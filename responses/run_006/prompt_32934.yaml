prompt: |-
  I sit on the board of a conservation trust that manages a large fenced reserve. We've got a proposal in front of us from one of our own field biologists, who wants funding for a two-year pilot to treat sarcoptic mange in the reserve's fox population using medicated bait stations. The mange is spreading and the foxes that get it die slowly over a few weeks. The technical side looks solid: the bait is target-specific, the dosing is worked out, and she's budgeted for monitoring.

  The problem is our trust's mission statement commits us to preserving native ecosystems and biodiversity, and says nothing about animal welfare. Treating the foxes would probably cut off a slow and nasty source of mortality, but it would also leave fox numbers higher than they'd otherwise be, and nobody's modelled what that does to the small mammals and ground-nesting birds on the reserve. Some board members think the proposal is just a category error — our job is ecological integrity, not running a field hospital for wild animals. Others have started using the phrase 'wild animal suffering' as if its an obvious part of our remit, and they point out that we already intervene plenty (we cull invasives, we repair erosion), so the 'hands off nature' line isn't one we actually hold.

  I need a short written opinion to circulate before Thursday's meeting. It should recommend a concrete course of action with a time frame — approve, reject, or approve with conditions — and it should engage the strongest consideration on the losing side rather than just restating the mission statement. I'd also like you to be straight with us about what we'd be commiting ourselves to if we approve: is there a principled stopping point between treating mange and, say, predator control or supplementary feeding during a hard winter?
reasoning: |-
  Okay, the user is a board member of a conservation trust facing a decision on funding a mange treatment project for foxes. They need a balanced opinion that addresses both ecological integrity and animal welfare concerns. 

  First, I need to understand the core tension: their mission focuses solely on biodiversity and ecosystems, but the proposal introduces wild animal suffering as a consideration. The board seems divided between strict conservationists ("not a field hospital") and welfare advocates ("we already intervene"). 

  Hmm... the user's phrasing suggests they're wary of mission creep. That "principled stopping point" question is particularly sharp - if they treat mange, what prevents them from becoming full-time wildlife medics? But they also clearly want to engage the losing side fairly, not just shut down debate.

  The biologist's technical competence isn't in question, which helps. The key unknowns are ecological impacts and precedent-setting. I should emphasize monitoring and sunset clauses to address both. 

  Noting the user's request for concrete action: conditional approval with a two-year pilot feels right. It respects the biologist's work while containing risks. The "no routine intervention" principle might placate traditionalists, and the suffering acknowledgment gives something to welfare advocates. 

  That stopping point question... needs a bright line. Ecosystem function versus individual welfare seems the cleanest division. Culling invasives maintains function; treating mange doesn't - unless mange threatens ecosystem collapse, which it doesn't here. Should make that distinction crystal clear. 

  User seems experienced - they name-dropped "wild animal suffering" correctly and spotted the precedent risk immediately. They'll want nuanced arguments, not platitudes. The tone should be decisive but not dismissive of either side.
answer: |-
  ## Recommendation: Approve the Two-Year Pilot with Strict Monitoring Conditions

  **Vote:** Approve with conditions  
  **Time Frame:** 2-year pilot as proposed, with mandatory 6-month and 18-month interim reviews, and a conclusive final report & board vote at 24 months on any continuation.

  **Rationale:** While our mission centers on native ecosystems and biodiversity, the arguments for intervention are compelling *within the controlled context of a pilot*. The biologist's proposal is scientifically sound, targets a specific, severe pathology causing documented suffering, and includes essential monitoring. Crucially, **approving this pilot does not commit us to perpetual intervention or broader welfare programs.** It commits us to *gathering critical data* we currently lack.

  **Engaging the Strongest "Losing Side" Consideration (Ecological Integrity/Pure Conservation):**  
  The core objection – that treating individual animals falls outside our mandate and risks distorting natural processes – is valid and serious. Uncontrolled fox numbers *could* negatively impact small mammals and birds, undermining biodiversity. This pilot directly addresses this concern: **The monitoring component *is* the answer.** It will empirically measure changes in fox density, survival rates, and crucially, impacts on key prey species and nesting success. Without this data, we are debating hypotheticals. If the monitoring shows significant negative ecological consequences during the pilot, we have a clear off-ramp at the interim reviews or the 24-month mark. Rejecting the pilot outright means condemning foxes to a gruesome fate *and* leaving us ignorant of the actual ecological trade-offs, potentially leading to worse outcomes long-term.

  **Engaging the Strongest "Losing Side" Consideration (Non-Intervention Consistency):**  
  The argument that we are inconsistent by intervening against invasives/erosion but not disease holds significant weight. Our existing actions (culling invasives, erosion control) *are* interventions explicitly justified by protecting native biodiversity and ecological function. The question is whether treating a *native* disease fits this framework. The pilot allows us to test if mange suppression *itself* serves biodiversity goals by preventing potential boom-bust cycles or maintaining a functional predator role, or if it actively harms other native species through increased predation pressure.

  **Principled Stopping Point & What We Commit To:**  
  Approving commits us to **this specific, time-bound intervention for this specific disease in this specific population**, *not* to a general welfare mandate.

  *   **The Principled Line:** Intervention should be justified primarily by **ecological function/biodiversity goals**, with suffering reduction as a *secondary benefit* or ethical bonus. The line lies between:
      *   **Justifiable:** Treating a severe, non-native disease outbreak; culling invasive species; habitat restoration; or mitigating *extreme, acute, human-caused* suffering (e.g., disentangling an animal from litter). *This mange pilot tests if treating a native disease fits here by providing ecological data.*
      *   **Not Justifiable (under current mission):** Routine medical care; predator control solely to boost prey numbers; supplementary feeding during natural hardship; intervening in natural predation or starvation. These primarily target individual welfare or population levels without a clear, primary biodiversity/ecosystem function rationale.

  *   **Commitments if Approved:**
      1.  **Funding & Monitoring:** Full commitment to the pilot budget, especially robust monitoring of foxes *and* key prey/bird species.
      2.  **Strict Review:** Binding interim and final reviews focused *first* on ecological impacts. Evidence of significant harm to non-target species triggers termination.
      3.  **No Precedent for Broad Welfare:** Explicit board statement that approval is *only* for this pilot based on its specific scientific design and potential ecological insights, *not* an endorsement of general wild animal suffering mitigation as core trust business.
      4.  **Sunset Clause:** Treatment stops at 24 months unless conclusive evidence presented that it *actively benefits* reserve biodiversity goals (beyond fox welfare), and the board explicitly re-approves.

  **Conclusion:** The potential to alleviate severe suffering in a native species *while* gathering vital ecological data warrants a controlled pilot. The strict conditions and reviews ensure we prioritize ecological integrity, test the core objection, and prevent mission creep. Rejection based solely on mission statement interpretation ignores the inconsistency of our existing interventions and forfeits an opportunity to make a future, evidence-based decision. Approve the pilot to *learn*, then decide definitively.
