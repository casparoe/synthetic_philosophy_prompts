prompt: |-
  So my friend has been reading a ton of Augustine lately and won't stop talking about lying. He's been sending me his verdicts on different cases and I've been keeping track. Here's what he's said so far:

  - Lying to murderers about whether you're hiding someone in your house: still wrong, but the least serious kind of lie.
  - Lying to get out of a promise you made: seriously wrong.
  - Saying something false as a joke where everyone's in on it: not a lie at all, since there's no intent to decieve.
  - Lying to spare someone's feelings when they ask a question they shouldn't have asked: wrong, but minor.
  - Lying under oath about something personally embarassing but not criminal: gravely wrong.

  Now he wants me to tell him what I think about a case where you lie to prevent someone from committing suicide — you tell them a loved one forgives them, when in fact that loved one said the opposite and wants nothing to do with them. He's going to give me his own verdict after I give mine, and I want to be able to predict what he'll say.

  I can see at least two principles that fit his first five verdicts equally well, and I think they might pull in different directions on the suicide case. Can you lay out what those principles are, which one you think better predicts his call on the suicide case, and — here's the part I really need — what follow-up case would most cleanly tell them apart?
