prompt: |-
  I teach a grad seminar on decision theory and formal epistemology, and I'm writing the final exam. I want one question on program equilibrium that actually tests whether students understand the mechanism — not just whether they can parrot "Löb's theorem lets programs cooperate in the Prisoner's Dilemma." The question should force them to work through why naive approaches fail and what the proof system is actually doing. Please write the question, a model answer of about 500–700 words, and a marking scheme. Total 16 marks, 45 minutes. The marking scheme should name the specific moves an A answer must contain and the specific mistakes that separate a B from an A.

  Here's the background they've had: we covered the standard one-shot PD and Nash equilibrium, then spent two weeks on program equilibrium — the basic setup where programs read each other's source code, the "cooperate-if-identical" proposal and why it fails (diagonalization/quining), FairBot and the Löbian cooperation proof, and a brief discussion of what happens if you weaken the proof system. They've seen Löb's theorem stated but most of them are still shaky on how it's actually applied in the FairBot argument — that's exactly what I want the question to dig into.

  Oh and for the marking scheme, include a one-line note on how students typically mess up each part — I've taught this before so I know the common pitfalls.
reasoning: |-
  We are designing a question that tests deep understanding of program equilibrium in the Prisoner's Dilemma (PD), specifically focusing on why naive approaches fail and how Löb's theorem enables cooperation via FairBot.

  The question should cover:
  1. The failure of a naive "cooperate if identical" program due to diagonalization (quining).
  2. The structure of FairBot and how it uses Löb's theorem to achieve mutual cooperation.

  We'll create a question that forces students to explain both parts.

  **Question:**

  Consider the Prisoner's Dilemma with the standard payoff matrix:

            Cooperate (C)   Defect (D)
  Cooperate (3,3)          (0,5)
  Defect    (5,0)          (1,1)

  Two players submit computer programs that can read each other's source code and then output either 'C' or 'D'. 

  (a) [4 marks] Explain why the following naive program fails to achieve mutual cooperation when playing against itself:

      NaiveBot:
        Read the opponent's source code.
        If the opponent's source code is identical to my own, output C.
        Otherwise, output D.

  (b) [12 marks] Now consider the FairBot program:

      FairBot:
        Try to prove (using a formal system F that extends Peano Arithmetic) that the opponent will output C.
        If such a proof is found, output C.
        Otherwise, output D.

      Suppose that both players use FairBot. Explain how mutual cooperation can arise. In your answer, you must:

        (i) Explain why FairBot playing against FairBot will find a proof that the opponent outputs C, leading to mutual cooperation. You should explicitly reference Löb's theorem and how it is applied in this context.

        (ii) Explain why the same proof system does not allow a defective program (like one that always defects) to exploit FairBot. Specifically, consider a program DefectBot that always outputs D. Explain why FairBot, when playing against DefectBot, does not find a proof that DefectBot outputs C and hence outputs D.

      Note: You may assume that the proof system F is consistent and that it is sufficiently strong to formalize the reasoning about the programs.

  **Total: 16 marks**

  **Model Answer (500-700 words):**

  (a) The NaiveBot program attempts to achieve mutual cooperation by cooperating only when it sees an identical copy of itself. However, this strategy is vulnerable to diagonalization. Consider a variant of NaiveBot, called NaiveBot2, which is defined as:

      NaiveBot2:
        Read the opponent's source code.
        If the opponent's source code is identical to my own, output D.   // Note: defect instead of cooperate
        Otherwise, output C.

  Now, what happens when NaiveBot plays against NaiveBot2? 

  First, note that NaiveBot and NaiveBot2 are different programs. Therefore, when NaiveBot plays against NaiveBot2, NaiveBot (which checks for identity) will see that the opponent's code is different and thus output D. Meanwhile, NaiveBot2 (which also checks for identity) will see that the opponent's code is different (because it is comparing its own code to NaiveBot's code) and thus output C (because of its otherwise clause). Hence, NaiveBot gets 5 and NaiveBot2 gets 0.

  But the real problem arises when we consider what happens if both players use NaiveBot. Then, each NaiveBot would see an identical program and thus output C. However, the existence of NaiveBot2 creates an incentive for a player to deviate. Specifically, if one player uses NaiveBot2 against an opponent using NaiveBot, then NaiveBot2 will get 5 (by defecting) while the opponent (NaiveBot) cooperates and gets 0. Since the player can achieve a higher payoff by using NaiveBot2, they are motivated to do so. Thus, in a population of NaiveBots, a mutant NaiveBot2 can invade. Therefore, the NaiveBot strategy is not stable. Moreover, even if we try to enforce using the same program, the possibility of a slight modification (like a comment) can break the identity check and lead to defection. Hence, the naive approach fails to reliably achieve cooperation.

  (b) (i) When two FairBots play each other, each FairBot tries to prove that the other will output C. We wish to show that each FairBot will succeed in finding such a proof and thus output C.

      Let FB1 and FB2 be two instances of FairBot (which are identical in code). FB1 attempts to prove that FB2 will output C. Similarly, FB2 attempts to prove that FB1 will output C.

      The key step in the proof is to show that FB1 can prove the statement "FB2 outputs C" by using the fact that FB2 is trying to prove the same about FB1. Specifically, we can set up the following:

          Let φ be the statement "FB2 outputs C".

          FB1 is trying to prove φ. Note that φ is equivalent to "FB2 finds a proof that FB1 outputs C".

          But FB2 is programmed to output C only if it can prove "FB1 outputs C", which is exactly the statement that FB1 is trying to establish about FB2. Therefore, if FB1 can prove that "if FB1 outputs C then FB2 outputs C", then FB1 can use that to prove φ.

          More formally, we note:

            FB1 outputs C  ⇔  FB1 proves "FB2 outputs C"   [by the definition of FairBot]
            Similarly, 
            FB2 outputs C  ⇔  FB2 proves "FB1 outputs C"

          Now, consider what FB1 can prove. Because the proof system is sufficiently strong, it can reason about the behavior of programs. In particular, FB1 can prove the following implication:

            □ (FB1 outputs C → FB2 outputs C)

          Why? Because if FB1 outputs C, that means FB1 has a proof that FB2 outputs C. And since the proof system is sound (we assume consistency, which implies soundness for the relevant statements), then FB2 must indeed output C. Therefore, the implication holds.

          But note: the above implication is exactly □ (φ) → φ, because φ is "FB2 outputs C". However, we have established that □ (φ) → φ is provable in F. Then, by Löb's theorem, which states that if F ⊢ □φ → φ then F ⊢ φ, we conclude that F proves φ, i.e., F proves "FB2 outputs C". Therefore, FB1 will find a proof of φ and output C.

          The same reasoning applies symmetrically to FB2. Hence, both FairBots output C, resulting in mutual cooperation.

  (b) (ii) Now consider FairBot playing against DefectBot (which always outputs D). FairBot will try to prove that DefectBot outputs C. However, DefectBot's code is:

          DefectBot:
            Output D.

          Since DefectBot always outputs D, regardless of the opponent, there is no scenario in which it outputs C. Therefore, the statement "DefectBot outputs C" is false. Because the proof system F is consistent, it cannot prove a false statement. Hence, FairBot will fail to find a proof that DefectBot outputs C. Therefore, FairBot will output D. Thus, the outcome is (D, D) with payoffs (1,1). 

          This shows that FairBot does not let itself be exploited: it defects against a known defector. Moreover, note that if FairBot were to cooperate against DefectBot, it would get 0 (the sucker's payoff). But by defecting, it gets 1, which is the best it can do against an opponent that always defects.

          Therefore, FairBot is not exploitable by DefectBot.

  **Marking Scheme:**

  Total: 16 marks.

  Part (a) [4 marks]:
  - 2 marks for explaining that a modified program (like NaiveBot2) can defect when playing against NaiveBot, leading to exploitation. [Common mistake: only saying "they are different programs" without showing how a mutant can invade or without the example.]
  - 2 marks for noting that diagonalization (or quining) breaks the identity check because a slight change in the program (or a program that is designed to defect on identical) can take advantage. [Common mistake: vague reference to "they might not be exactly the same" without the strategic incentive to deviate.]

  Part (b) [12 marks]:
  (b)(i) [8 marks]:
  - 2 marks for stating that each FairBot tries to prove the other outputs C.
  - 2 marks for correctly setting up the implication that if FairBot1 outputs C then FairBot2 outputs C (and vice versa) and noting that this is provable in the system. [Common mistake: confusing the direction of the implication or not stating the provability of the implication.]
  - 2 marks for invoking Löb's theorem: specifically, that because □φ → φ is provable, then φ is provable. [Common mistake: misstating Löb's theorem or applying it incorrectly (e.g., using it in the wrong direction).]
  - 2 marks for concluding that therefore each FairBot proves the other cooperates and thus cooperates. [Common mistake: circular reasoning without the formal application of Löb's theorem.]

  (b)(ii) [4 marks]:
  - 2 marks for stating that DefectBot always defects so the statement "DefectBot outputs C" is false. [Common mistake: saying that FairBot cannot prove it without explaining why (i.e., consistency).]
  - 2 marks for explaining that because the proof system is consistent, it cannot prove a false statement, so FairBot does not find a proof and thus defects. [Common mistake: saying FairBot defects because it sees that DefectBot defects, but note that FairBot doesn't simulate the opponent, it only tries to prove a statement about the opponent's output.]

  **Note on common mistakes:**
  - In part (a): Students often only say that the programs might not be identical due to comments or minor changes, but fail to recognize the strategic incentive for a player to deliberately design a program that defects when it sees itself (like NaiveBot2) to exploit NaiveBot.
  - In part (b)(i): The most common mistake is to argue circularly without invoking Löb's theorem: e.g., "FairBot1 proves that FairBot2 will cooperate because FairBot2 is trying to prove the same about FairBot1, and vice versa." This misses the key step of how the implication is proven and then Löb's theorem is applied to break the circularity.
  - In part (b)(ii): Students sometimes say that FairBot simulates the opponent and sees it defects, but that's not how FairBot works. FairBot uses a proof system, not simulation. They must note the consistency of the proof system.

  This question and marking scheme should effectively test the students' understanding of the mechanisms behind program equilibrium, especially the non-trivial application of Löb's theorem.
answer: |-
  ### Final Exam Question: Program Equilibrium in the Prisoner's Dilemma

  **Question (Total: 16 marks; Time: 45 minutes)**  
  Consider a one-shot Prisoner's Dilemma with payoffs:  
  - Mutual cooperation (C, C): (3, 3)  
  - Mutual defection (D, D): (1, 1)  
  - You defect, opponent cooperates (D, C): (5, 0)  
  - You cooperate, opponent defects (C, D): (0, 5)  

  Players submit programs that can read each other’s source code. The program outputs C or D.  

  **(a)** A student proposes the following program for cooperation:  
  ```  
  NaiveBot:  
    Read opponent’s source code.  
    If opponent’s code == my code, output C.  
    Else, output D.  
  ```  
  **Explain why NaiveBot fails to achieve mutual cooperation when both players use it.** Your answer must include a counterexample program demonstrating the flaw. (4 marks)  

  **(b)** Instead, consider **FairBot**:  
  ```  
  FairBot:  
    Using proof system F (a consistent extension of Peano Arithmetic),  
      try to prove "opponent will output C".  
    If a proof is found, output C.  
    Else, output D.  
  ```  
  **(i)** Explain why two identical FairBots both output C. **Explicitly reference Löb’s theorem** and show how the proof system F enables cooperation. (8 marks)  
  **(ii)** Explain why **DefectBot** (which always outputs D) causes FairBot to output D. Why doesn’t FairBot mistakenly "cooperate" with DefectBot? (4 marks)  

  ---

  ### Model Answer (Approx. 600 words)  
  **(a) NaiveBot fails due to diagonalization.** NaiveBot cooperates only if the opponent’s code is *identical* to its own. However, a malicious opponent can exploit this by submitting a program that *defects* when it sees NaiveBot’s code. Consider **CheatBot**:  
  ```  
  CheatBot:  
    Read opponent’s source code.  
    If opponent’s code == NaiveBot’s code, output D.  // Defect against NaiveBot  
    Else, output C.  
  ```  
  When NaiveBot plays CheatBot:  
  - NaiveBot checks if CheatBot’s code matches its own. Since CheatBot ≠ NaiveBot, NaiveBot outputs D.  
  - CheatBot checks if the opponent is NaiveBot. It sees it is, so it outputs D.  
  Result: Mutual defection (D, D).  

  But crucially, if both players submit NaiveBot, they cooperate (C, C). Yet CheatBot creates a *deviation incentive*: if Player 1 uses NaiveBot, Player 2 can "invade" with CheatBot to get payoff 5 (by defecting while Player 1 cooperates). Thus, NaiveBot is unstable. The flaw is that checking for *exact code equality* allows programs to "recognize and punish" NaiveBot, making cooperation non-robust.  

  **(b)(i) FairBot achieves mutual cooperation via Löb’s theorem.**  
  Let FB1 and FB2 be identical FairBots. FB1 tries to prove "FB2 outputs C". FB2 symmetrically tries to prove "FB1 outputs C". We show FB1 finds a proof:  
  1. **Setup**: FB1 attempts to prove the statement φ: "FB2 outputs C".  
  2. **Key observation**: By FairBot’s code, φ is equivalent to "FB2 finds a proof of ψ", where ψ is "FB1 outputs C".  
  3. **Provable implication**: Within F, FB1 can prove:  
     > "If ψ is true (FB1 outputs C), then φ is true (FB2 outputs C)."  
     *Reason*: If ψ holds, FB1 outputs C. But FB2 is identical to FB1 and uses F, so FB2 will *also* prove ψ (since ψ is true and F is sound). Thus, FB2 outputs C (φ).  
     Formally: F ⊢ ψ → φ.  
  4. **Löb’s theorem application**: Löb’s theorem states:  
     > If F ⊢ □φ → φ, then F ⊢ φ,  
     where □φ means "φ is provable in F".  
     Here, ψ → φ is equivalent to □φ → φ (since ψ ≡ □φ). Thus, F ⊢ □φ → φ.  
     By Löb’s theorem, F ⊢ φ.  
  5. **Conclusion**: FB1 proves φ ("FB2 outputs C"), so FB1 outputs C. By symmetry, FB2 outputs C.  

  **Why Löb’s theorem breaks the loop**: Naive self-referential proofs fail (e.g., "I cooperate if you do" leads to infinite regress). Löb’s theorem allows FB1 to prove φ *without assuming φ is true* by leveraging the structure of F. Specifically, step (3) uses F’s ability to prove soundness about itself, and step (4) uses Löb’s theorem to convert □φ → φ into □φ.  

  **(b)(ii) FairBot defects against DefectBot.**  
  DefectBot always outputs D, so the statement "DefectBot outputs C" is **false**. Since F is consistent, it cannot prove false statements. Thus, FairBot finds no proof of "DefectBot outputs C" and outputs D.  

  FairBot does not "simulate" DefectBot; it only searches for proofs in F. DefectBot’s behavior is hardcoded and independent of FairBot, so no proof of cooperation exists. FairBot thus correctly defects, avoiding exploitation (payoff 0) and achieving (D, D).  

  ---

  ### Marking Scheme (Total 16 marks)  
  **Part (a) (4 marks)**  
  - **2 marks**: Explain diagonalization flaw (NaiveBot is vulnerable to programs that defect when they recognize it).  
  - **2 marks**: Provide a counterexample (e.g., CheatBot) and show mutual defection.  
    *Common mistake (loses 1–2 marks)*: Only stating "programs might differ due to comments" without strategic counterexample.  

  **Part (b)(i) (8 marks)**  
  - **1 mark**: State FB1 tries to prove "FB2 outputs C".  
  - **2 marks**: Explain φ ≡ "FB2 outputs C" depends on ψ ≡ "FB1 outputs C" (symmetry).  
  - **3 marks**: Derive F ⊢ ψ → φ (or □φ → φ) using F’s soundness/internal reasoning.  
  - **2 marks**: Apply Löb’s theorem (F ⊢ □φ → φ ⇒ F ⊢ φ) to conclude φ is proven.  
    *Common mistakes*:  
    - Circular argument (e.g., "FB1 cooperates because FB2 cooperates") without Löb (loses 3–4 marks).  
    - Missing □φ → φ step (loses 2 marks).  

  **Part (b)(ii) (4 marks)**  
  - **2 marks**: State "DefectBot outputs C" is false and F is consistent → no proof exists.  
  - **2 marks**: Conclude FairBot outputs D (no exploitation).  
    *Common mistake*: Claiming FairBot "sees" DefectBot’s code and defects (ignores proof mechanism; loses 2 marks).  

  **Grade Boundaries**  
  - **A (14–16)**: Correct in all parts. Explicitly links Löb’s theorem to cooperation. No logical gaps.  
  - **B (10–13)**: Minor errors (e.g., vague Löb application, weak counterexample).  
  - **C (7–9)**: Major gaps (e.g., no diagonalization example, confuses proof/search).  
  - **D (4–6)**: Superficial answers (e.g., "Löb enables trust" without mechanism).  
  - **F (0–3)**: Incorrect or irrelevant.
