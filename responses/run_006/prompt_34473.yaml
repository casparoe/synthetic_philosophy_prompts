prompt: |-
  I'm teaching a grad seminar on decision theory and next week we're doing the Kelly criterion / geometric rationality stuff. I want to give my students a clear statement of one side of the debate. Could you argue for the following position: that the Kelly criterion represents a genuinely distinct normative framework from expected utility theory, not merely a special case of it. The key claim is that maximizing expected log wealth (or more generally, maximizing the time-average growth rate) is the primitive concept, and that expected value maximization across ensemble averages is the derivative special case that only works when you're not compounding. The fact that you can recover Kelly from expected utility by assuming log utility is, from this perspective, just a way of smuggling the temporal structure into the utility function after the fact — it doesn't explain *why* log utility is the right one. So the argument should press on the idea that ergodicity, not risk aversion, is what's doing the real work. I want the strongest version of this case you can make, including how you'd respond to the obvious objection that EU theory can just *stipulate* log utility and call it a day.

  And look, I know the standard line is that this is all just a disagreement about presentation, that there's no formal difference between the two once you pick your utility function. So don't give me the "they're mathematically equivalent" response — I've heard it. I want you to argue that the equivalence is superficial and that the geometric framing captures something normatively important that the EU framing buries, even if the math comes out the same in the end. If you want to bring in Ole Peters and the ergodicity economics literature to make the case, go ahead — I'm less interested in citations than in the structure of the argument itself.
