  First, I need to unpack why the equivalence feels superficial. The key seems to be temporal structure - Kelly cares about multiplicative processes unfolding over time, while EUT treats decisions as static ensembles. When Peters talks about "broken ergodicity," that's the core: wealth dynamics aren't just about possible states but about paths through time. 

  The user's phrase "smuggling temporal structure into utility" is sharp. Log utility in EUT feels post-hoc because it doesn't explain why we should care about growth rates in the first place. The normative force comes from wanting to survive repeated bets, not from abstract risk aversion. 

  For objections: Yeah, EUT can technically stipulate log utility. But that misses why log is special - it emerges from the dynamics, not preferences. Responding that "any concave utility works" actually proves the point: Kelly isn't about curvature, it's about avoiding ruin. 

  Should I emphasize Peters' coin flip example? Where ensemble average ≠ time-average? That visceral illustration shows why EUT's "many parallel worlds" framing fails for sequential decisions. The graduate students might appreciate that concrete math. 

  Also worth stressing that Kelly optimizes a path-dependent variable (final wealth after N bets) while EUT optimizes a moment-in-time expectation. Even when math agrees, the reasoning differs: one is engineering survival, the other is expressing preference. 

  User seems sophisticated - they name-dropped ergodicity economics casually. I'll avoid oversimplifying but keep the argument tight. No need to cite Peters excessively since they care more about argument structure. 

  Biggest challenge: Making "ergodicity" feel tangible rather than jargon. Maybe frame it as "the decision rule that doesn't go bankrupt" versus "the decision rule that averages hypotheticals." Growth-rate maximization is the compass for navigating multiplicative environments. 

  ...And crucially, log utility only looks "right" because we subconsciously know we live in such environments. Kelly makes that explicit.
answer: |-
  Here’s the strongest case for the Kelly criterion as a *distinct normative framework*, grounded in temporal dynamics and ergodicity, rather than a mere application of EUT with log utility:

  ### Core Argument: Kelly Embodies a Different Normative Primitive  
  1. **The Primacy of Time-Averaged Growth**:  
     Kelly’s core imperative—maximize the geometric growth rate—is a response to the *multiplicative, sequential nature of compounding wealth*. It treats decisions as embedded in a *temporal process* where outcomes cascade. The norm isn’t "maximize expected utility" but "avoid ruin and grow sustainably." This is fundamentally a *survival constraint* absent in EUT’s atemporal ensemble averages.  

  2. **Ergodicity as the Justification, Not Risk Aversion**:  
     In non-ergodic systems (like repeated bets), time averages (e.g., your actual wealth trajectory) ≠ ensemble averages (e.g., expected value across parallel universes). Kelly optimizes the *time-average growth rate*—the only quantity that matters to a single agent living through a sequence of events. EUT, by contrast, maximizes an ensemble average. When ergodicity is broken (i.e., when compounding creates path dependence), these diverge. **Kelly’s log-maximization restores ergodicity by making growth additive in utility space**, but this is a *structural fix* for a dynamical problem—not a "preference."  

  3. **The Misleading Comfort of Log Utility in EUT**:  
     Saying "EUT recovers Kelly with log utility" confuses *description* with *justification*. Why log? Because it linearizes multiplicative growth—but this only makes sense if you *already care about geometric growth*. EUT cannot explain why log is normatively special without smuggling in the temporal argument:  
     - If you frame wealth in absolute terms, EUT with linear utility says "bet everything on positive-EV gambles"—a ruinous strategy.  
     - Switching to log utility "solves" this, but only by implicitly assuming that your utility should reflect *compounded growth dynamics*. The normative force comes from the dynamics, not pure preference.  

  4. **Kelly Exposes EUT’s Blind Spot to Temporal Structure**:  
     EUT treats all decisions as isolated, weightless events. Kelly forces confrontation with *sequence dependence*:  
     - A bet with +EV but high variance might be "rational" under EUT (with any concave utility), but *irrational under Kelly* if it risks bankruptcy and truncates future growth.  
     - Kelly dynamically adapts bet sizing based on current wealth; EUT evaluates acts in a vacuum. This isn’t just "risk aversion"—it’s a recognition that *wealth is fuel for future opportunities*.  

  ### Responding to Key Objections:  
  **Objection: "EUT can stipulate log utility and get identical prescriptions. Isn’t this just semantics?"**  
  - **Response**: The math converges, but the *normative foundations* differ radically.  
    - EUT with log utility says: "I have a psychological aversion to losses that happens to resemble the logarithm."  
    - Kelly says: "I maximize long-term growth because compounding is multiplicative, and ruin is irreversible."  
    The latter is a *structural necessity* for surviving repeated bets; the former is a preference assumption. Kelly’s norm emerges from the physics of wealth dynamics, not psychology.  

  **Objection: "Any concave utility function in EUT avoids ruin. Why privilege log?"**  
  - **Response**: Only log utility *explicitly maximizes the growth rate*. Other concave functions (e.g., √W) may avoid ruin but sacrifice growth—they’re suboptimal for an agent focused on long-term compounding. Log isn’t "one risk aversion among many"; it’s the *unique function* that makes utility additive across multiplicative growth steps. This uniqueness reflects an objective, dynamic constraint.  

  **Objection: "Isn’t ergodicity just a fancy way to say 'repeated games'?"**  
  - **Response**: Ergodicity highlights a deeper point: *rationality should depend on whether the system aggregates over time or space*. For non-repeated decisions (e.g., a one-off gamble), ensemble averaging (EUT) is appropriate. But for compounding processes, rational agents must optimize time averages—a distinct normative principle. Kelly formalizes this shift.  

  ### Why the Framing Matters Normatively  
  - **Kelly as Engineering, Not Psychology**:  
    Kelly is a "rule for thriving in multiplicative environments." It doesn’t care about your subjective preferences; it cares about *not going broke in a world where wealth compounds*. This positions rationality as responsive to *external dynamics*, not internal states.  

  - **The Bankruptcy Counterfactual**:  
    EUT (even with log utility) struggles to explain why betting >Kelly fraction is *irrational* rather than "high risk-high reward." Kelly shows it’s strictly dominated: overbetting lowers *all possible* long-term growth paths, not just the unlucky ones. This is a pathwise, almost thermodynamic, inefficiency—not a preference violation.  

  ### Conclusion: Kelly as a Paradigm Shift  
  Kelly isn’t a "special case" of EUT—it’s a **corrective to EUT’s neglect of temporal structure**. By taking compounding seriously, it reveals that "expected utility" is incomplete for sequential decisions under multiplicative dynamics. The equivalence with log utility is a mathematical coincidence that obscures the causal driver: *ergodicity economics forces us to optimize what we actually experience (time averages) rather than what we imagine (ensemble averages)*. For a normative theory, that distinction is foundational.  

  → **Teach your students**: Kelly doesn’t just *use* log; it *explains why log matters* in a way EUT cannot. The debate isn’t about math—it’s about whether rationality is timeless (EUT) or embedded in time (Kelly).
