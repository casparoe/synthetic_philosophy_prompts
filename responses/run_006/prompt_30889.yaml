  We are going to translate five positions and arguments from infinite population ethics into the language of a mathematician with expertise in measure theory, functional analysis, summability methods, order theory, and set theory. We will break each one down into parts that translate cleanly, with distortion, or not at all. Then we will provide a residue report.

  Key mathematical tools we will reference:
  - **Summability**: Especially for conditionally convergent series, and the use of Banach limits or other generalized limits.
  - **Measure theory and integration**: For averaging and handling infinite sets.
  - **Ultrafilters and ultrapowers**: For constructing non-Archimedean fields and for defining limits in a non-standard way.
  - **Order theory**: For comparing worlds that might not have a real-valued representation.

  We note that in the ethical context, the "worlds" are typically represented as functions from the set of individuals (which may be infinite) to the reals (welfare levels). The set of individuals is often taken to be countable, but sometimes uncountable. We will generally assume a countable set for simplicity, but the mathematics can extend.

  ---

  **1. Total utilitarianism for infinite populations**

  (a) Clean translation:
     - The world is represented as a sequence of welfares: \( (w_i)_{i \in I} \) where \( I \) is a countable set (or more generally, a set with a given enumeration). The total utilitarian value is the sum \( \sum_{i} w_i \).
     - If the series converges absolutely, then the sum is well-defined and independent of the order.
     - If the series converges conditionally, then the sum depends on the order of summation. This is a straightforward mathematical fact.
     - If the series diverges (to \( \pm \infty \) or oscillates), then the sum is not defined in the reals.

  (b) Distortion:
     - The ethical claim that the order of summation should not matter (because individuals are morally equal) is not captured by the mathematics. The mathematics only shows that without absolute convergence, the sum is order-dependent. The ethical claim that order should not matter is an additional normative principle that forces us to reject conditional convergence as a method for total utilitarianism in the infinite case. The mathematics does not tell us whether we should use a different method (like a Banach limit) or give up on total utilitarianism.

  (c) No expression:
     - The ethical intuition that the sum should exist independently of the ordering does not have a mathematical counterpart. The mathematics only provides ways to force a value (e.g., by fixing an ordering, using a Banach limit, or using an ultrafilter) but does not tell us which, if any, is the right one. The moral requirement for impartiality (anonymity) is an ethical constraint that might lead us to require that the value be invariant under permutations. This requirement (if imposed) would force us to use only permutation-invariant methods, such as the limit of the average of the first n terms (if it exists) or a Banach limit that is permutation-invariant (which exists but is not unique). However, the ethical debate about whether impartiality should be imposed is not mathematical.

  ---

  **2. Average utilitarianism and limit-based relatives**

  (a) Clean translation:
     - For a finite population of size \( n \), the average is \( \frac{1}{n} \sum_{i=1}^n w_i \).
     - For an infinite population, we consider a sequence of finite subsets \( A_n \) that exhaust the population (i.e., \( \bigcup_n A_n = I \)) and then take the limit of the average over \( A_n \) as \( n \to \infty \).
     - The mathematical fact is that the limit may depend on the choice of the exhausting sequence \( \{A_n\} \). For example, if we have an infinite set of 0's and 1's, we can arrange the sequence so that the average converges to any value in [0,1] (by including more 0's or 1's at different rates).

  (b) Distortion:
     - The ethical claim that the average should be independent of the way we exhaust the population is an additional normative requirement. The mathematics only shows that it isn't. Thus, the mathematics does not tell us which exhausting sequence to choose. The ethical principle of impartiality might require that the value be invariant under permutations, which would force us to consider only symmetric sequences (e.g., the natural density if it exists). But the natural density does not always exist.

  (c) No expression:
     - The ethical intuition that the average should be a property of the entire world, not an artifact of the limiting process, is not captured. The mathematics does not provide a unique limit without additional structure (like a fixed exhausting sequence). The choice of the exhausting sequence (or the use of a Banach limit) is a normative decision.

  ---

  **3. The Pareto principle and adding one happy life**

  (a) Clean translation:
     - The Pareto principle: If we have two worlds \( w = (w_i) \) and \( w' = (w'_i) \) such that \( w'_i \geq w_i \) for all \( i \) and \( w'_j > w_j \) for at least one \( j \), then \( w' \) is better than \( w \).
     - Adding one happy life: Consider a world \( w \) with an infinite set of individuals and a new world \( w' \) that adds one individual with positive welfare \( \epsilon > 0 \) and leaves all others unchanged. Then the Pareto principle says \( w' \) is better than \( w \). However, if we are using a value function that is invariant under finite changes (like a Banach limit that is translation invariant, or a density-based average) then the value of \( w' \) might equal the value of \( w \).

  (b) Distortion:
     - The mathematics of Banach limits (or density measures) can be used to define a value function that is translation invariant. This would make the value of \( w \) and \( w' \) equal. But the Pareto principle would require that \( w' \) is strictly better. The mathematics does not resolve this conflict; it only provides the tools to define a value function that violates Pareto.
     - The ethical claim that adding one happy life should not change the value of the world is not a mathematical claim. It is a normative claim that might be motivated by the desire to avoid the "swamping" of finite changes by an infinite background.

  (c) No expression:
     - The ethical intuition that adding one happy life doesn't matter in an infinite world is in direct conflict with the Pareto principle. The mathematics only shows that we can have a value function that satisfies one or the other, but not both (unless we give up having a real-valued representation). The conflict between these two ethical intuitions is not resolved by the mathematics.

  ---

  **4. The paralysis worry**

  (a) Clean translation:
     - If we have a value function \( V \) that is invariant under finite changes (translation invariant) or if the infinite background has infinite total value (and we are using a rule that ignores finite changes), then for any two worlds that differ in only finitely many coordinates, \( V(w) = V(w') \). Hence, we cannot say that one is better than the other.

  (b) Distortion:
     - The mathematics shows that if we require translation invariance (or more generally, that finite changes do not affect the value), then we get paralysis. But the ethical worry is that this is unacceptable. The mathematics does not tell us whether we should abandon translation invariance. It only shows the consequence.

  (c) No expression:
     - The ethical claim that we should care about finite changes even in an infinite world is not captured by the mathematics. The mathematics can only tell us that if we want to avoid paralysis, we must reject translation invariance. But the ethical debate about whether we should avoid paralysis or accept it (because finite changes are indeed swamped) is beyond mathematics.

  ---

  **5. Enlarging the value domain**

  (a) Clean translation:
     - We can use hyperreal numbers (via an ultrapower construction) to assign a value to a world. Specifically, we fix a free ultrafilter \( \mathcal{U} \) on \( \mathbb{N} \) (or on the index set). Then, for a world \( w = (w_i) \), we define the hyperreal value as the equivalence class of the sequence \( (w_i) \) in the ultrapower \( \mathbb{R}^\mathbb{N} / \mathcal{U} \). This hyperreal value can be compared (via the transfer principle) and is sensitive to finite changes (if the ultrafilter is free, then two sequences that differ in finitely many places can have different hyperreal values).
     - Alternatively, we can use ordinal numbers to rank worlds. For example, we might say that a world with a higher "order of infinity" of positive welfare is better. This can be done by mapping the world to an ordinal based on the structure of the welfare distribution.

  (b) Distortion:
     - The use of hyperreals requires choosing an ultrafilter. The choice of ultrafilter is arbitrary and can lead to different orderings. The ethical claim that one ultrafilter is better than another has no mathematical basis. Moreover, the hyperreal representation is not unique: different ultrafilters yield non-isomorphic fields. The same holds for ordinal rankings: the choice of how to map the world to an ordinal is arbitrary.

  (c) No expression:
     - The ethical motivation for using a non-Archimedean field or ordinal numbers is to avoid paralysis and to be able to compare any two worlds. However, the mathematics does not provide a canonical way to do this. The ethical intuition that there is a unique "correct" ordering of worlds is not supported by the mathematics. The mathematics only provides a way to extend the ordering, but the extension is highly non-unique.

  ---

  **Residue Report**

  The translation reveals several patterns:

  1. **Mathematical tools as normative carriers**: The translation shows that standard mathematical tools (like the use of a particular limit procedure, an ultrafilter, or a Banach limit) are not neutral. Each tool makes a normative commitment:
     - Choosing a particular ordering for summation (for total utilitarianism) violates anonymity.
     - Choosing an exhausting sequence for averaging violates impartiality unless it is symmetric.
     - Using a translation-invariant Banach limit violates the Pareto principle.
     - Using a hyperreal construction requires choosing an ultrafilter, which is arbitrary and not ethically motivated.

  2. **What the mathematics cannot express**: The ethical intuitions of impartiality (anonymity), the moral importance of finite changes, and the uniqueness of the value ordering do not have mathematical counterparts. The mathematics can only tell us the consequences of our normative choices. It cannot tell us which normative choices are correct.

  3. **Distortion vs. precision**: The philosophical claims are less precise than they look. For example:
     - Total utilitarianism in infinite settings does not specify how to handle conditional convergence. The mathematics reveals that without additional structure, the sum is order-dependent. The ethical principle of impartiality then forces us to reject order-dependence, but the mathematics does not tell us how to build an order-invariant sum.
     - The paralysis worry is a consequence of requiring translation invariance. But the ethical debate is about whether we should require translation invariance. The mathematics cannot resolve that.

  4. **Hidden normative work**: Every time we use a particular mathematical tool (like an ultrafilter or a Banach limit) to represent value in infinite worlds, we are importing a normative assumption. For example:
     - Using a Banach limit that is translation invariant assumes that finite changes do not matter. That is a substantive ethical claim.
     - Using a natural density for averaging assumes that the ordering of the individuals is the correct one to use for the limit, which may not be ethically neutral.

  5. **What is missing in the mathematical vocabulary?** The mathematics we have is rich enough to model the structures, but it does not provide a unique way to assign values. The ethical content lies in the choice of which mathematical structure to impose. Therefore, the mathematical vocabulary is not missing tools, but it reveals that the ethical debate is about the choice of tools. However, there is one exception: the ethical requirement for a complete ordering of all worlds (without any incomparability) might force us into using non-Archimedean fields or ordinals. But even then, the mathematics shows that the ordering is not unique and depends on arbitrary choices (like the ultrafilter). Thus, the residue is that the ethical claims about the uniqueness and objectivity of the ordering might be untenable.

  In conclusion, the translation process does not reveal a lack in the mathematical vocabulary but rather an overabundance of mathematical options. The ethical debate is about which of these options to choose and why. The mathematics forces us to confront the arbitrariness of the choices we make. Therefore, the residue is primarily ethical: we must make normative arguments for why a particular mathematical structure (e.g., a specific summability method) is the right one for ethical evaluation.
answer: |-
  ### Translation of Infinite Population Ethics into Mathematical Vocabulary

  **Context:**  
  I map ethical concepts to mathematical structures using your expertise. Welfare distributions are modeled as functions \( f: I \to \mathbb{R} \), where \( I \) is a countable set of individuals (generalizable to uncountable sets via measure theory). "Worlds" are equivalence classes under permutations (anonymity). Value functions \( V \) map welfare distributions to an ordered set (e.g., \(\mathbb{R}\), hyperreals, ordinals). I track where mathematics carries, distorts, or fails to capture ethical content. Normative assumptions embedded in mathematical choices are flagged.

  ---

  #### 1. **Total Utilitarianism**  
  *Ethical claim:* The value of a world is the sum of all welfare. Infinite sums may diverge or depend on summation order.  

  **(a) Clean translation:**  
  - Let \( I = \mathbb{N} \), welfare \( (w_n)_{n=1}^\infty \). Total value is \( \sum_{n=1}^\infty w_n \).  
  - Absolute convergence: If \( \sum |w_n| < \infty \), the sum is order-invariant.  
  - Conditional convergence: If \( \sum w_n \) converges but not absolutely, Riemann series theorem applies: for any \( \alpha \in [-\infty, \infty] \), there is a permutation \( \sigma \) such that \( \sum w_{\sigma(n)} = \alpha \).  
  - Divergence: If partial sums \( \to \pm\infty \) or oscillate, no real-valued sum exists.  

  **(b) Distortion:**  
  - *Normative assumption in mathematics:* Order-invariance is a **normative demand** for impartiality (anonymity). The mathematics shows order-dependence under conditional convergence, but it doesn't prescribe whether to enforce order-invariance. If you demand order-invariance (as ethics often does), you must reject conditionally convergent sums. This is a distortion because mathematics *enables* order-dependence, but ethics *forbids* it.  
  - *Hidden commitment:* Using \(\mathbb{R}\) as the value range assumes "finite representability," ignoring the ethical need for comparability when sums diverge.  

  **(c) No expression:**  
  - Ethical principle that *all lives matter equally* has no mathematical counterpart. Mathematics describes *how* sums behave, not *why* order-dependence is ethically unacceptable. The intuition that "swapping lives shouldn't change value" is a normative axiom, not derivable from series convergence.  

  ---

  #### 2. **Average Utilitarianism and Limit-Based Relatives**  
  *Ethical claim:* Value is average welfare. For infinite populations, use limits over finite subsets.  

  **(a) Clean translation:**  
  - Finite case: \( V(f) = \frac{1}{|F|} \sum_{i \in F} f(i) \) for finite \( F \subset I \).  
  - Infinite case: Fix an exhaustion \( \{F_n\} \) (finite sets with \( \bigcup_n F_n = I \)), then \( V(f) = \lim_{n \to \infty} \frac{1}{|F_n|} \sum_{i \in F_n} f(i) \).  
  - Limit dependence: Different exhaustions yield different limits. For \( w_n = (-1)^n \), "natural" exhaustion gives no limit; other exhaustions can yield any \( \alpha \in [-1,1] \).  
  - Banach limits: If we use a generalized limit (e.g., a shift-invariant linear functional on \( \ell^\infty \)), the average may exist but is non-unique.  

  **(b) Distortion:**  
  - *Normative assumption in mathematics:* Choosing an exhaustion or Banach limit **smuggles in ethical bias**. For example:  
    - Using \( F_n = \{1, \dots, n\} \) assumes the indexing of \( I \) is morally relevant.  
    - Demanding shift-invariance (for Banach limits) assumes temporal order matters, conflicting with anonymity.  
  - Mathematics shows that limit-dependence is inevitable without additional structure, but ethics demands structure-neutrality.  

  **(c) No expression:**  
  - Ethical principle that *the average must reflect the "whole" population impartially*. Mathematics provides no canonical exhaustion for an unstructured infinite set. The intuition that "no subgroup should dominate" has no formal counterpart without predefining a measure.  

  ---

  #### 3. **Pareto Principle vs. Adding a Happy Life**  
  *Ethical claim:* Pareto improvements (helping some, harming none) are better, yet adding one happy life seems to make no difference.  

  **(a) Clean translation:**  
  - Pareto: If \( f'(i) \geq f(i) \forall i \) and \( \exists j \) with \( f'(j) > f(j) \), then \( V(f') > V(f) \).  
  - Adding a life: Let \( f' \) extend \( f \) to \( I \cup \{k\} \) with \( f'(k) = \epsilon > 0 \). For a translation-invariant \( V \) (e.g., a Banach limit), \( V(f') = V(f) \).  

  **(b) Distortion:**  
  - *Normative commitment:* Translation-invariance (e.g., \( V(w_1, w_2, \dots) = V(w_2, w_3, \dots) \)) **assumes finite changes are irrelevant**. This conflicts with Pareto. Mathematics can enforce either property but not both:  
    - Banach limits satisfy translation-invariance but violate Pareto.  
    - Pointwise summation satisfies Pareto but is undefined for infinite populations.  
  - The mathematics doesn't resolve the conflict; it forces a choice between axioms.  

  **(c) No expression:**  
  - Ethical intuition that *one life "shouldn't matter" in an infinite world* cannot be derived. Mathematics shows the inconsistency but offers no ethical justification for prioritizing one axiom over the other.  

  ---

  #### 4. **Paralysis Worry**  
  *Ethical claim:* If finite changes are swamped by infinite backgrounds, no action is better than another.  

  **(a) Clean translation:**  
  - Let \( V \) be a linear functional on \( \ell^\infty \) that vanishes on finitely supported sequences (e.g., a Banach limit). Then for any \( f, g \) differing at finitely many points, \( V(f) = V(g) \).  
  - Measure-theoretic: If \( V \) is an invariant mean, finite sets have measure zero.  

  **(b) Distortion:**  
  - *Hidden normative work:* Defining "swamping" via translation-invariance or \(\sigma\)-additivity **assumes indifference to finite changes**. This is a substantive ethical stance: it implies that only "dense" or "tail" behavior matters.  
  - Mathematics formalizes paralysis but doesn't prescribe whether to accept it.  

  **(c) No expression:**  
  - Ethical horror at paralysis—e.g., "saving a life must matter"—has no mathematical weight. Mathematics can avoid paralysis (e.g., with hyperreals), but that requires *rejecting* standard tools, which itself is a normative choice.  

  ---

  #### 5. **Enlarging the Value Domain**  
  *Ethical claim:* Use hyperreals, ordinals, etc., to compare infinite worlds.  

  **(a) Clean translation:**  
  - **Hyperreals:** Fix a free ultrafilter \( \mathcal{U} \) on \( \mathbb{N} \). For \( f: \mathbb{N} \to \mathbb{R} \), assign value \( [f]_\mathcal{U} \) in \( ^*\mathbb{R} = \mathbb{R}^\mathbb{N} / \mathcal{U} \). Finite changes are visible: if \( f, g \) differ finitely, \( [f]_\mathcal{U} \neq [g]_\mathcal{U} \).  
  - **Ordinals:** Rank worlds by order type (e.g., value = supremum of welfare in initial segments).  
  - **Cardinality-based:** Compare the cardinality of positive/negative welfare sets (e.g., \( |\{i: w_i > 0\}| \) vs. \( |\{i: w_i < 0\}| \)).  

  **(b) Distortion:**  
  - *Normative arbitrariness:*  
    - Choosing \( \mathcal{U} \) for hyperreals is ethically unmotivated—different \( \mathcal{U} \) yield different orderings.  
    - Ordinal rankings depend on a well-ordering of \( I \), violating anonymity.  
  - Mathematics provides the machinery but not a *reason* to prefer one enlargement over another.  

  **(c) No expression:**  
  - Ethical hope for a "complete, impartial" ordering. Hyperreals and ordinals force trade-offs:  
    - Hyperreals require ultrafilters (arbitrary).  
    - Ordinals require well-orderings (anonymity-violating).  
  - The intuition that "all infinities are comparable" is mathematically feasible but ethically ungrounded.  

  ---

  ### Residue Report: What Survives and What Doesn't  

  #### Summary of Translation Failures  
  1. **Normative assumptions in mathematics**:  
     - Using \(\mathbb{R}\) assumes values are Archimedean (no infinitesimals), which dismisses the ethical need for finite changes to matter in infinite worlds.  
     - Demanding \(\sigma\)-additivity or translation-invariance assumes finite effects are negligible—a substantive ethical claim.  
     - Choosing an exhaustion, Banach limit, or ultrafilter smuggles in bias (e.g., favoring an ordering of lives).  

  2. **Ethical intuitions without mathematical counterparts**:  
     - Impartiality (anonymity): Mathematics can enforce it (e.g., permutation-invariant limits), but only by adding it as an axiom.  
     - The moral weight of finite changes: Mathematics can model this (e.g., hyperreals), but not justify it.  
     - Completeness of ordering: Enlargements (hyperreals, ordinals) achieve comparability but introduce arbitrariness.  

  3. **Distortion sources**:  
     - Mathematics *exposes* conflicts (e.g., Pareto vs. translation-invariance) but cannot *resolve* them.  
     - Standard tools (e.g., Lebesgue measure, series convergence) silently impose ethical commitments (e.g., tail events dominate).  

  #### Conclusion: What the Translation Reveals  
  - **Your vocabulary is sufficient** to formalize the problems, but it **forces normative choices** disguised as mathematical "naturalness." For example:  
    - Banach limits commit to translation-invariance, which implies finite changes don't matter—a contestable ethical stance.  
    - Summation order commits to an indexing of lives, violating anonymity unless explicitly quotiented.  
  - **Philosophical claims are less precise than they appear**:  
    - "Total welfare" is ill-defined for infinite populations without specifying summability.  
    - "No difference from adding a life" assumes translation-invariance, which is a technical choice, not an ethical given.  
  - **Ethically relevant gaps**:  
    - The demand for *canonical orderings* (no arbitrariness) is mathematically impossible in standard frameworks. Ultrafilters, ordinals, and Banach limits are non-constructive and non-unique.  
    - The intuition that *ethics must be action-guiding* (avoiding paralysis) conflicts with the mathematical ease of defining "swamping" functionals.  

  **Final verdict**: Your mathematical vocabulary captures the *structure* of the problems but reveals that the ethical content lies in the choice of axioms (e.g., anonymity, Pareto). The "hidden" normative work in standard mathematics (e.g., using \(\mathbb{R}\), translation-invariance) shows that philosophers' appeals to "natural" mathematical rules often import unargued ethical assumptions. The residue is primarily ethical: mathematics can model any consistent system, but which system we *should* use demands normative justification.
