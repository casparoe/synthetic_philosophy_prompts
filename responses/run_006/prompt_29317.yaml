  Okay, the user is a postdoctoral researcher preparing for a workshop on consequentialism and decision-making under severe uncertainty. They're defending a qualified act-consequentialism against the cluelessness objection. Their core argument is that while cluelessness doesn't refute consequentialism as a criterion of rightness, it forces a revision of the decision procedure from expected value maximisation to a robustness-based rule with a conservative default. 

  The audience composition is highly specific and potentially hostile: EA-aligned consequentialists, a Kantian sceptic, formal epistemologists, a virtue ethicist, and a political philosopher. Each brings distinct concerns. The user needs anticipatory defence strategies that are both philosophically rigorous and rhetorically tactical.

  First, the EA-consequentialists will attack the departure from expected value maximisation as status quo bias. This is the most damaging objection because it strikes at the rule's core justification. The reply must reframe robustness as epistemic humility, not timidity. The soft spot? It doesn't fully resolve how to act when all options violate robustness (e.g., climate intervention dilemmas).

  The Kantian's "action-guiding" challenge is fundamental but expected. The reply should grant consequentialism's limits while insisting it remains partially action-guiding via constraints. Softness: this might concede too much ground on demandingness.

  Formal epistemologists will demand precision about "reasonable models" specification. This is technically thorny but less existentially threatening. The reply must acknowledge vagueness while offering procedural constraints. Softness: the "epistemic peers" criterion risks circularity.

  The political philosopher's critique of the conservative baseline as harm-entrenching is morally loaded. The reply should distinguish systemic injustice from true cluelessness cases. Softness: many real-world cases blur this line (e.g., colonial legacies).

  The nightmare question—about permissibility violations under the baseline—requires conceding that the theory sometimes prohibits intuitively required actions. Pre-emptive admission in the talk is crucial to avoid gotcha moments.

  Key concessions to front-load: (1) robustness may demand inaction in urgent-seeming scenarios, (2) the "reasonable models" set has borderline cases. This builds credibility.

  Literature notes: The arbitrariness of priors in cluelessness is well-established (Greaves, Mogensen). The viability of non-maximising decision procedures remains hotly contested (MacAskill vs. Lenman). Never imply consensus where none exists.

  British English adjustments: "prioritise", "defence", "labour", "sceptical" throughout. Avoid "math" for "maths".
answer: |-
  Here is a Q&A preparation sheet tailored to your specific audience, workshop context, and arguments, using British English and reflecting the contested state of the literature. The objections are ordered by likelihood and potential damage.

  **Core Concession to Pre-empt in Talk:** "Before proceeding, I should concede that my robustness rule, particularly the conservative baseline, *will* sometimes prohibit actions that might, with the benefit of perfect knowledge, turn out to be optimal or even obligatory by act-consequentialist lights. This is an uncomfortable consequence I accept, stemming from the epistemic limitations under deep uncertainty. The alternative, I argue, is acting on arbitrary priors carrying unacceptable risks of severe harm."

  **The Nightmare Question (Hope Nobody Asks):** "If your conservative baseline forbids intervention even in scenarios where we have *some* strong moral reason to suspect current trajectories are leading towards catastrophe (e.g., nascent AI risks or environmental tipping points), doesn't this make your theory practically indistinguishable from a deontological prohibition on acting under uncertainty, thereby abandoning consequentialism’s core commitment to promoting the good?"

  **Likely & Damaging Objections:**

  1.  **From EA-sympathetic Act-Consequentialist:** "This ‘robustness’ requirement and conservative default just looks like a fancy philosophical justification for status quo bias. Expected value maximisation, even with imperfect priors, is the only way to *systematically aim* at doing the most good. Throwing it out because we’re uncertain seems like giving up. Aren’t you just risk-averse?"
      *   **Reply:** "The objection presupposes that using *any* specific prior is epistemically justified in cluelessness cases. My claim is that for long-run, identity-affecting consequences, the choice of prior *is* substantially arbitrary – there’s no uniquely rational way to assign probabilities to wildly divergent possible futures. Maximising over an arbitrary prior isn't aiming at the good; it's gambling on a guess dressed as calculation. Robustness avoids privileging one arbitrary guess. It’s not risk-aversion about outcomes, but epistemic humility about our models. We suspend judgement where evidence is too weak to justify a specific probability model."
      *   **Soft Spot:** Doesn't fully resolve the tension with the *aim* of consequentialism. It justifies inaction but feels passive compared to the EA drive to actively seek the best.

  2.  **From the Kantian:** "You admit cluelessness prevents us knowing which act is right, yet still claim consequentialism is action-guiding via this ‘robustness rule’. But if the criterion of rightness is inaccessible, how can *any* decision rule derived from it be reliably action-guiding? Isn't this just confirming that consequentialism collapses under uncertainty, leaving us needing non-consequentialist constraints (like duties) to actually guide action?"
      *   **Reply:** "The criterion of rightness (maximising actual value) remains conceptually clear, even if epistemically inaccessible. The decision rule isn't *derived* directly from that criterion in a maximising way under uncertainty; it's derived from an *epistemic principle* (suspending judgement under deep uncertainty) applied *within* the consequentialist framework. The rule tells us what we can permissibly do *given* our ignorance about what would maximise value, prioritising avoiding potentially catastrophic mistakes justified by arbitrary priors. It remains consequentially motivated – avoiding severe harms we might cause through epistemically unjustified interventions."
      *   **Soft Spot:** Concedes consequentialism cannot provide *maximising* guidance under cluelessness, which feeds the Kantian critique about its core action-guiding ambition.

  3.  **From Formal Epistemologist (Re: Model Specification):** "How is the ‘suitably wide range of reasonable empirical models and evaluative theories’ defined and updated? Isn't this just reintroducing arbitrariness at a higher level? What counts as 'reasonable'? How do we avoid the set being implausibly wide (paralysing) or implausibly narrow (effectively maximising over an implicit prior)? How does higher-order evidence (e.g., expert disagreement) affect the set?"
      *   **Reply:** "You're right, specification is challenging and a locus of potential arbitrariness. 'Reasonableness' involves minimal criteria: empirical models must be logically coherent, consistent with fundamental known laws, and not demonstrably falsified; evaluative theories must be internally consistent and represent recognised moral perspectives (e.g., various population axiologies). The set isn't fixed; it contracts with decisive evidence (e.g., ruling out specific physics models) and may expand with new theoretical possibilities. Higher-order evidence (e.g., widespread expert disagreement *on fundamentals*) often *justifies* a wider set, reinforcing deep uncertainty. It’s procedural and defeasible, aiming to capture genuine indeterminacy, not eliminate all vagueness."
      *   **Soft Spot:** The criteria ("recognised moral perspectives," "fundamental known laws") remain somewhat vague and contestable. Avoiding paralysis requires judgement calls.

  4.  **From Political Philosopher:** "Doesn't this 'conservative baseline of non-intervention' dangerously entrench existing power structures and distributions of harm? If the status quo involves systemic injustice (which it often does), forbidding intervention unless robustness is met effectively protects that injustice. Isn't this a conservative bias favouring the powerful?"
      *   **Reply:** "A crucial qualification: the conservative baseline applies *specifically* in contexts of *cluelessness* – deep uncertainty about long-run, identity-affecting consequences. Many injustices are *not* clueless; we have strong evidence of the harm being done *now* and in the foreseeable future (e.g., preventable poverty, discrimination). My rule doesn't apply there. The baseline is only a default when the *downstream consequences of intervention itself* are deeply uncertain and potentially catastrophic. The motivation isn't conserving the status quo per se, but avoiding causing *new, severe, and unknowable* harms through interventions whose effects we cannot reasonably model."
      *   **Soft Spot:** The line between "foreseeable injustice" and "clueless intervention" can be blurry in practice (e.g., complex economic reforms). Risks being misapplied to defend harmful status quos.

  5.  **From EA-sympathetic Act-Consequentialist (Re: Stifling Innovation):** "If everyone followed this rule, wouldn't it stifle potentially hugely beneficial innovations and interventions whose long-term effects are uncertain but whose short/medium-term benefits seem clear? Progress often requires leaps into the partially unknown. Isn't your rule overly cautious?"
      *   **Reply:** "The rule doesn't forbid all action under uncertainty, only action where *no option* meets the robustness requirement across a wide range of reasonable models. Many innovations have foreseeable, manageable consequences or positive expected value across plausible models. The rule targets the *extreme* cases of cluelessness where models diverge wildly on sign and magnitude, suggesting catastrophic downsides are plausible under credible models. It encourages focusing efforts where consequences are more knowable or robustly positive. The epistemic principle demands this caution precisely because the potential downsides of getting it wrong in cluelessness cases are often existential and irreversible."
      *   **Soft Spot:** Assessing whether consequences are "knowable enough" to avoid the robustness rule involves judgement. May discourage high-risk/high-reward endeavours even if some reasonable models show vast benefits.

  6.  **From Virtue Ethicist:** "Why do we need this complex decision *rule* at all? Isn't cluelessness precisely the kind of situation where rigid rules fail, and we need practical wisdom (phronesis) – the virtuous agent's capacity to judge well in complex, uncertain contexts? Doesn't your rule just create new forms of counterintuitive paralysis?"
      *   **Reply:** "Practical wisdom is essential for applying *any* rule, including this one – especially in specifying the 'reasonable set'. However, cluelessness poses a unique structural problem demanding a specific *constraint*: the inability to justify specific probability assignments. A purely virtue-based approach risks masking arbitrariness under 'judgement'. The robustness rule provides a structured framework to operationalise the epistemic humility virtue ethics might endorse, making the suspension of judgement and prioritisation of avoiding catastrophic error explicit and defensible. It guides the *exercise* of phronesis in this specific epistemic context."
      *   **Soft Spot:** The rule *can* be complex to apply. Doesn't eliminate the need for judgement, just structures it around a specific epistemic principle.

  7.  **From Formal Epistemologist (Re: Imprecise Probabilities):** "Why not use imprecise probabilities (sets of priors) rather than abandoning expected value maximisation? Couldn't you maximise *expected value* with respect to the *set* of reasonable priors (e.g., using Γ-maximin or similar rules), which might avoid your arbitrariness charge while being more precise than your robustness criterion?"
      *   **Reply:** "Imprecise probabilities are a valuable tool for *modelling* uncertainty. However, applying standard decision rules like Γ-maximin to them in cluelessness cases faces problems. Firstly, Γ-maximin is extremely conservative, often equivalent to my baseline. Secondly, and crucially, specifying the *set* of probabilities faces the same 'reasonable models' challenge. More importantly, the core arbitrariness isn't just in the probabilities; it's in the *structure* of the models themselves (what variables, causal links, axiological weights). Robustness across distinct *models* addresses this deeper structural uncertainty better than varying probabilities within one model frame. It's a response to model ambiguity, not just imprecise credence."
      *   **Soft Spot:** The boundary between model uncertainty and parameter uncertainty within a model frame is fuzzy. A sophisticated imprecise probability approach *might* capture some aspects.

  8.  **From EA-sympathetic Act-Consequentialist (Re: Comparatives):** "Even if absolute expected value calculations are arbitrary, surely we can often make *comparative* judgements? E.g., Option A seems *more likely* to be better than Option B across many plausible models, even if we can't assign precise values. Why not maximise *robustly superior expected choice-worthiness* instead of demanding robustness for permissibility?"
      *   **Reply:** "Comparative robustness is valuable and often achievable! My permissibility condition is intentionally demanding – it requires an action to be choice-worthy *simpliciter* (not just better than alternatives) across the range. This is specifically for situations where *no* option shows robust superiority, and models suggest different options could lead to catastrophically bad outcomes. In less severe uncertainty, comparative robustness is a great heuristic. But in deep cluelessness, acting on 'A is probably better than B' still relies on implicitly weighting the models where A wins more heavily – which brings back the arbitrariness if those weightings aren't justified. The baseline kicks in only when even comparative judgements lack robustness across the set."
      *   **Soft Spot:** Insisting on robust choice-worthiness (vs. robust superiority) might be too strict in some cases where one option is clearly *less bad* across models, even if none is robustly *good*.

  **Literature Grounding Notes (Reflecting Contested Nature):**
  *   **Settled:** The core *problem* of cluelessness for act-consequentialism (especially concerning long-term/identity-affecting effects) is widely acknowledged as significant (Lenman, Greaves, Mogensen). The arbitrariness of priors in these contexts is a common theme.
  *   **Contested:** Whether cluelessness refutes consequentialism *as a criterion of rightness* (Lenman vs. defenders like Ord, MacAskill). The viability and justification of *non-maximising decision procedures* within consequentialism is highly contested. The use of robustness reasoning (as opposed to, e.g., IP or other formal methods) is novel and not settled. The specific epistemic principle linking deep uncertainty to suspension of judgement/permissibility constraints is my argument and open to challenge. The "conservative baseline" is particularly contentious and lacks consensus, though precedents exist in discussions of the Precautionary Principle.

  This preparation sheet prioritises the objections most likely to arise from your specific audience and that strike closest to the core arguments of your paper. Good luck with the workshop!
