      *   *Margin beside "What matters is what you were trying to do...":* "✓ Strong emphasis on intent, a core element in deception ethics."
      *   *Margin beside "The only exception might be...":* "✓ Good recognition of a potential nuance - where the listener's inference is unreasonable. Could strengthen this by linking it back to the 'listener responsibility' point - *this* is where responsibility might shift more."

  5.  **Overall Strengths:**
