prompt: |-
  I've been reading through the moral uncertainty literature — MacAskill, Bykvist, and Ord, and the surrounding debates — and I keep running into the same frustration. Everyone seems to have a preferred approach: maximize expected choice-worthiness, or use a "my favorite theory" heuristic, or adopt a parliamentary model, or something else. But the arguments for and against these approaches often assume different standards of success. One paper will critique a view for failing to handle intertheoretic comparisons; another will dismiss that problem as a bullet worth biting; a third will say the whole enterprise is misguided because the correct moral theory already tells you how to handle uncertainty about itself. I want to step back and get clear on the criteria before I evaluate any particular theory.

  What would a theory of decision-making under moral uncertainty actually have to get right? I'm looking for a list of desiderata: the phenomena it must explain, the cases it must handle correctly, the formal constraints it must respect, the distinctions it must not collapse, and the results from neighboring fields — decision theory, metaethics, normative ethics — it must be consistent with. For each requirement, give the case or consideration that motivates it. Then flag which requirements are non-negotiable, meaning any adequate theory must satisfy them, and which are preferences of particular camps that a theory could reasonably reject. Most importantly, I want to know whether any subset of these desiderata is jointly unsatisfiable. If there's a tension between, say, avoiding fanaticism about low-credence extreme theories and respecting the formal structure of expected utility theory, or between requiring intertheoretic comparability and accommodating theories that deny cardinal structure, or between being action-guiding and respecting the possibility that the correct moral theory instructs you to ignore moral uncertainty — I want that spelled out. If the list itself turns out to contain an impossibility result, that's the part I most need to understand. I'm not asking for a scorecard of existing theories against the list; I can do that myself once I have the criteria. What I want is the specification. What is the job description for a theory in this area, and does the job description itself contain contradictions?
reasoning: |-
  Okay, the user is diving deep into moral uncertainty literature and feeling frustrated by the lack of consistent evaluation criteria across different approaches. They want a clear framework of desiderata to assess theories, including which are essential and which might conflict. 

  Hmm, I need to unpack their core request: they're not asking for theory comparisons but for the meta-criteria themselves. The frustration stems from papers talking past each other with mismatched standards. Underneath that, they might be seeking either (a) intellectual clarity to navigate the field or (b) tools to develop their own position. Given their meticulous phrasing, likely an academic or advanced grad student.

  Key challenges here: First, balancing comprehensiveness without laundry-listing. Second, avoiding bias toward any camp while acknowledging where desiderata originate. Third—crucially—surfacing tensions honestly since they explicitly want contradictions exposed. 

  *flips mental notebook to desiderata drafting mode* Start with non-negotiables: Action-guidance and normative coherence feel foundational—without these, the whole enterprise collapses. Comparability and cardinality are trickier; purists might reject them but they're functionally necessary for most frameworks. 

  *winces at foreseen conflicts* Ah yes, the fanaticism vs EU-consistency clash is unavoidable. Also spotting a sneaky tension: Moral theory self-reference vs action-guidance. If the true theory says "ignore uncertainty," but we're uncertain which theory is true... *trails off into recursive headache*. Must flag that.

  *checks for landmines* Should clarify that "non-negotiable" doesn't mean universally agreed—just that theories failing these become self-undermining or inert. Also need to emphasize that desiderata weights vary by metaethical stance (e.g., realist vs constructivist). 

  *double-checks impossibility alerts* The comparability-cardinality-fanaticism triangle really is the tripwire. Worth stressing that some trade-offs are conscious design choices (e.g., MEC bites fanaticism; parliamentary models ditch EU). User seems prepared to handle that nuance. 

  Final thought: User's "specification" framing is smart. This really is about writing a job description where some required skills conflict. Might subtly help them realize why the field remains fragmented...
answer: |-
  Here's a specification of desiderata for a theory of decision-making under moral uncertainty (DMU), organized by category, with motivating cases, negotiability flags, and identified tensions:

  **Core Non-Negotiables (Any Adequate Theory Must Satisfy These):**

  1.  **Action-Guidance (The Point of the Exercise):**
      *   **What:** Must output a recommended action (or set of permissible actions) for an agent facing a concrete choice under moral uncertainty.
      *   **Motivation:** The primary purpose of DMU is to tell an agent *what to do* when they don't know which moral theory is true. A theory that fails to provide guidance in realistic cases is useless for its intended purpose. *Example:* Faced with donating to AMF vs. an existential risk charity while uncertain between utilitarianism and a deontology permitting/requiring partiality.
      *   **Non-Negotiable:** Yes. Failure here defeats the core aim.

  2.  **Normative Coherence (Respecting Normative Space):**
      *   **What:** Must be consistent with the *possibility* that distinct moral theories exist and make different normative claims. Cannot presuppose the truth of one specific metaethical view (e.g., radical moral skepticism or a specific normative theory) in its *foundation*.
      *   **Motivation:** DMU presupposes a context where multiple coherent, potentially true moral theories are under consideration. A theory that collapses all uncertainty into a single framework or assumes moral facts don't exist fails to engage with the problem as stated. *Example:* A theory that assumes "all moral theories are just expressions of preference" from the outset invalidates the need for DMU.
      *   **Non-Negotiable:** Yes. The field assumes genuine normative uncertainty.

  3.  **Credence Sensitivity (Respecting Degrees of Belief):**
      *   **What:** The recommended action must generally depend on the *degrees of belief* (credences) the agent assigns to different moral theories. Higher credence in a theory should typically give its prescriptions more weight.
      *   **Motivation:** Ignoring the strength of belief trivializes uncertainty. An agent 99% confident in Theory A and 1% in Theory B should usually act very differently from one with 50/50 credence. *Example:* Choosing between a small certain benefit (favored by Theory A) and a risky massive benefit (favored by Theory B). The 99/1 agent likely takes the certain benefit; the 50/50 agent might gamble.
      *   **Non-Negotiable:** Yes. A core aspect of uncertainty is *degree*.

  4.  **Theory Sensitivity (Respecting Differences in Theories):**
      *   **What:** The recommended action must generally depend on *which* moral theories are under consideration and *what they prescribe* for the given choice.
      *   **Motivation:** Changing the normative landscape should change the recommendation under uncertainty. If adding a new theory (e.g., a strong rights-based view) or changing what an existing theory prescribes doesn't alter the DMU output, the theory isn't responsive to the moral uncertainty. *Example:* Adding a theory that forbids a previously permissible action under uncertainty should potentially make that action impermissible.
      *   **Non-Negotiable:** Yes. Must be responsive to the inputs.

  **Highly Desirable, But Potentially Rejectable by Some Theories:**

  5.  **Intertheoretic Comparability (Cardinal Scale):**
      *   **What:** Must provide a method for comparing the *magnitude* of choice-worthiness differences *across* different moral theories. (Is the difference between A1 and A2 according to Theory T1 larger or smaller than the difference between B1 and B2 according to Theory T2?).
      *   **Motivation:** Essential for aggregating prescriptions meaningfully, especially under Expected Choice-Worthiness (MEC) approaches. Without comparability, it's unclear how to weigh the "strength" of different theories' recommendations. *Example:* Utilitarianism says donating to AMF saves a life (huge gain); a moderate deontology might say keeping a minor promise is slightly better than breaking it (small gain). How to compare the "size" of these gains across theories?
      *   **Negotiable:** Yes, but rejecting it severely limits options. Parliamentary models try to avoid it; "My Favorite Theory" simply ignores it. Rejection often leads to vagueness or paralysis.

  6.  **Cardinality within Theories:**
      *   **What:** Must handle moral theories that themselves only have ordinal structure (only rank options, no meaningful "strength" of preference within the theory).
      *   **Motivation:** Many plausible moral theories (e.g., some forms of deontology, virtue ethics) resist cardinal representation. A DMU theory requiring all input theories to be cardinal is overly restrictive. *Example:* A deontology might rank keeping promises over breaking them but lack a cardinal measure of *how much* worse breaking a promise is.
      *   **Negotiable:** Yes. Theories like MEC often *assume* or *impose* cardinal structure for aggregation. Others (e.g., some voting models) work directly with ordinal rankings. Rejection is a feature for some approaches.

  7.  **Avoidance of Fanaticism / Extreme Sensitivity to Low-Probability Theories:**
      *   **What:** Should not allow theories assigned extremely low credence to dominate decisions solely because they assign astronomically high (or low) values to outcomes.
      *   **Motivation:** Preserves the intuition that very unlikely theories shouldn't dictate action unless the stakes under them are truly catastrophic *and* irremediable otherwise. *Example:* A theory with 0.0001% credence that says not donating exactly $10.42 to a specific cause causes eternal torture shouldn't force the agent to obsess over finding that cause and donating that exact amount.
      *   **Negotiable:** Yes, but rejecting it is a major cost. MEC bites this bullet; other theories (e.g., variance-normalizing MEC, parliamentary models, lexical thresholds) aim to avoid it.

  8.  **Consistency with Rational Choice under Empirical Uncertainty (EU Structure):**
      *   **What:** Should ideally share the compelling axiomatic structure (completeness, transitivity, continuity, independence) of Expected Utility theory when applied to morally relevant empirical uncertainty *within* a single moral theory.
      *   **Motivation:** Rational choice under empirical uncertainty is well-established. A DMU theory that violates basic EU axioms *even when the agent is certain about morality* seems problematic. *Example:* If certain of utilitarianism, the agent should satisfy EU axioms regarding gambles over outcomes affecting utility.
      *   **Negotiable:** Yes. Some theories (e.g., parliamentary models using voting rules) inherently violate EU axioms (like independence). Proponents argue EU axioms aren't sacrosanct for *inter-theoretic* aggregation.

  **Important Meta-Constraints & Consistency Requirements:**

  9.  **Moral Theory Self-Reference (The "What Would the True Theory Say?" Problem):**
      *   **What:** Must be consistent with the possibility that the *true* moral theory itself might contain instructions for how to act under moral uncertainty about itself or other theories.
      *   **Motivation:** If the true theory T* says "ignore uncertainty, always follow T*", then a DMU theory advising otherwise based on credences in T1...Tn seems to contradict T*. *Example:* A simple realist divine command theory might hold that doubting the commands is itself sinful; the "true" DMU rule is "follow the commands".
      *   **Tension:** Creates a potential conflict with **Action-Guidance** and **Credence Sensitivity**. If the true theory says "ignore uncertainty," but you're uncertain what the true theory is (and whether it says that), what do you do? Most DMU theories implicitly assume true theories are *neutral* or *silent* on DMU. This is a deep challenge.

  10. **Metaethical Neutrality (As Far As Possible):**
      *   **What:** Should not presuppose a specific contentious metaethical view (e.g., realism vs. expressivism, naturalism vs. non-naturalism) in its *justification* or *mechanics*, unless absolutely necessary.
      *   **Motivation:** To be widely applicable, DMU should work for agents with diverse metaethical commitments. *Example:* A theory requiring "objective intertheoretic comparisons" might be problematic for non-cognitivists or error-theorists.
      *   **Negotiable:** Somewhat. Achieving full neutrality is difficult. MEC often leans realist; some voting models might be more expressivist-friendly. It's a spectrum.

  11. **Consistency with Dominance Reasoning:**
      *   **What:** If an action A is ranked at least as highly as action B by *every* theory the agent has non-zero credence in, and strictly higher by at least one theory they have positive credence in, then A should be strictly preferred to B under DMU.
      *   **Motivation:** A basic principle of rational choice under certainty that should extend to uncertainty when there's unanimity. *Example:* If all theories agree giving to charity is better than burning the money, DMU should recommend charity.
      *   **Negotiable:** Highly desirable, broadly accepted, but some exotic cases (involving theories with incommensurable values or infinite utilities) might challenge it. Failure here is generally seen as a major flaw.

  **Key Tensions and Potential Impossibilities:**

  1.  **The Central Tension: Fanaticism vs. EU-Consistency vs. Comparability/Cardinality:**
      *   **Tension:** MEC satisfies **EU-Consistency** and (with cardinal inputs and comparability) provides a clear **Action-Guidance** mechanism. However, it leads directly to **Fanaticism** (sensitivity to low-p extreme theories). Avoiding Fanaticism (e.g., by capping values, using thresholds, or switching to non-EU aggregation like voting) typically requires violating **EU-Consistency** and/or making **Comparability** even harder or requiring aggressive normalization that distorts the input theories' cardinal scales. **Cardinality within Theories** is also harder for non-MEC approaches. *This is the major fault line in the field.* Satisfying all of {Avoid Fanaticism, EU-Consistency, Strong Intertheoretic Comparability} simultaneously seems extremely difficult, likely impossible for standard cases.

  2.  **Moral Theory Self-Reference vs. Action-Guidance under Uncertainty:**
      *   **Tension:** If the true moral theory T* instructs agents to ignore moral uncertainty and always follow T*, then any DMU theory that *doesn't* simply follow the agent's best guess at T* seems to contradict T*. But if the agent is uncertain *whether T* is true* or *what T* says about DMU*, they are stuck in a regress (**"What does the true theory say I should do given my uncertainty about what it says?"**). Resolving this requires either: (a) Assuming T* is silent/neutral on DMU (begging the question), (b) Building a regress-stopping rule into the DMU theory itself (which then might contradict some possible T*), or (c) Denying the coherence of T* having such instructions (contentious). This threatens the coherence of the entire DMU project.

  3.  **Intertheoretic Comparability vs. Accommodating Non-Cardinal Theories:**
      *   **Tension:** Providing meaningful **Intertheoretic Comparability** typically requires cardinal information within each theory. However, respecting that many plausible theories lack **Cardinality within Theories** pushes towards DMU methods that work with ordinal rankings (e.g., voting models). But ordinal aggregation methods struggle to capture the *intensity* of preferences across theories and often violate **EU-Consistency** and potentially **Dominance** in complex cases. Achieving robust comparability without imposing artificial cardinal structure on ordinal theories is a significant challenge.

  **Conclusion: The Job Description & Its Contradictions**

  The core job of a DMU theory is to provide **Action-Guidance** to agents facing choices while holding **Credences** over multiple distinct **Moral Theories** whose prescriptions conflict (**Theory Sensitivity**), maintaining **Normative Coherence**.

  This job description *itself* contains significant tensions:

  *   The desire for **EU-Consistency**, **Avoiding Fanaticism**, and robust **Intertheoretic Comparability** is likely **jointly unsatisfiable**. Trade-offs are inevitable. MEC bites the fanaticism bullet; others jettison EU or comparability.
  *   The **Moral Theory Self-Reference** problem threatens the **Normative Coherence** of the entire enterprise if the true theory has strong DMU instructions. Resolving it without begging the question is deeply challenging.
  *   **Accommodating Non-Cardinal Theories** complicates achieving **Intertheoretic Comparability** and often forces departure from **EU-Consistency**.

  No existing theory satisfies all desiderata perfectly. The choice between approaches often involves prioritizing which tensions to resolve and which costs to accept (e.g., MEC prioritizes EU & Comparability, biting Fanaticism; parliamentary models prioritize avoiding Fanaticism & accommodating ordinal theories, sacrificing EU & strong Comparability). Recognizing these core tensions in the desiderata themselves is crucial for evaluating any proposed solution. The specification reveals that the "job" might be inherently conflicted in certain ways.
