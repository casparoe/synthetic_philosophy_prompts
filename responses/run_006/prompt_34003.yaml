answer: |-
  You're asking for a deep excavation of the linguistic bedrock beneath the practice of generic masculines and the resistance to singular "they". It's a messy question, but a profoundly important one. Let's reconstruct the tacit philosophy of language embedded in these practices, acknowledging the complexities and potential contradictions.

  **The Philosophy Presupposed by Generic Masculine ("He", "Man") Usage:**

  1.  **Strict Referentialism / Denotational Atomism:** At its core, this practice presupposes that a word's *meaning* is primarily, if not solely, its stipulated denotation – the concept or object it officially refers to in the abstract system of language. Crucially, this denotation is seen as separable from and unaffected by:
      *   **Connotation:** The cultural, emotional, or associative baggage a word carries.
      *   **Mental Imagery:** The specific pictures or exemplars the word evokes in the minds of speakers and hearers.
      *   **Social Usage Patterns:** How the word is actually deployed in real-world contexts, particularly its historical and social associations.
      The defence "But 'he' *means* 'he or she' here!" relies entirely on this: if we stipulate the denotation is gender-neutral, then it *is* neutral, regardless of other factors. Connotations of maleness are seen as irrelevant "noise" or personal misinterpretation, not constitutive of meaning.

  2.  **Stipulative Definitionalism:** Closely tied to referentialism is the belief that meaning is fundamentally established and controlled by authoritative stipulation (grammarians, dictionaries, style guides, "proper usage"). If the authorities declare "he" is the correct generic pronoun, then that *becomes* its meaning in that context. This view places immense weight on codified rules over actual usage or speaker intuition.

  3.  **The Cognitive Harmlessness of Grammatical Defaults:** This practice presupposes that grammatical markers like gender are purely formal, syntactic features with no significant cognitive or psychological consequences. The fact that "he" is the unmarked, default form and "she" is the marked, specific form is seen as a neutral grammatical accident, akin to noun classes in other languages. It assumes this asymmetry doesn't implicitly reinforce the idea that "male" is the norm or baseline human experience, while "female" is the deviation requiring specification. The possibility that grammatical structure shapes thought (a weaker form of linguistic relativity) is implicitly rejected or deemed negligible.

  4.  **The Primacy of the Abstract System over Embodied Experience:** Meaning resides in the abstract linguistic system ("langue" in Saussurean terms), not in the messy realities of how embodied individuals with specific identities and histories *use* and *experience* language ("parole"). The claim that generic "he" *should* be inclusive treats language as a disembodied logical system, ignoring how actual hearers/readers, particularly women and non-binary people, might process and feel excluded by it. The lived experience of exclusion is dismissed as a failure to understand the "correct" (stipulated) meaning.

  5.  **Ignoring the Indexical Function:** Pronouns, especially personal pronouns, are inherently indexical – their meaning shifts depending on context and the speaker/hearer. Generic "he" attempts to force an indexical term ("he," which typically points to a specific male antecedent) into a non-indexical, purely denotational role ("any person"). This practice presupposes that this forcing is unproblematic and that the inherent "pointing-to-male" function can be completely overridden by stipulation in generic contexts.

  **Which Rival Views Does This Quietly Rule Out?**

  *   **Use-Based Theories of Meaning (e.g., Wittgensteinian, Pragmatics):** Views that meaning is determined by use in context, not by abstract stipulation. If meaning is use, the persistent association of "he" with maleness in countless contexts undermines its claim to true neutrality.
  *   **Stronger Forms of Linguistic Relativity:** The idea that language structure significantly influences thought patterns or worldview. Generic masculine practice assumes grammar is cognitively inert regarding social categories.
  *   **Constitutive Views of Connotation:** Views that see connotation and association as *integral* to a word's meaning, not just decorative extras. If connotations of maleness are part of the meaning of "he," they can't be simply switched off.
  *   **Embodied/Situated Cognition:** Theories emphasising that language understanding is rooted in bodily experience and social identity. The exclusion felt by non-male readers isn't a misunderstanding; it's a direct result of how the word functions experientially.
  *   **Critical Discourse Analysis:** Approaches highlighting how language choices reflect and reinforce power structures. The generic masculine is seen as reflecting and perpetuating patriarchal norms.

  **The Second Practice: Accepting "He or She" / Rewriting but Rejecting Singular "They"**

  This shift reveals additional or modified presuppositions:

  1.  **Presupposed by the Shift Itself:**
      *   **Recognition of the Referential/Connotative Problem:** Implicitly concedes the point Hofstadter satirises: that generic "he" *isn't* reliably processed as neutral by many users. Its maleness connotation leaks through and causes exclusion. This undermines pure referentialism/stipulation.
      *   **Retention of Binary Gender Essentialism:** "He or she" explicitly accepts that gender (conceived strictly as male/female binary) is a fundamental characteristic requiring specification in generic reference. It presupposes that every individual *must* fit into one of these two categories for linguistic purposes.
      *   **Grammatical Prescriptivism Endures:** The solution is still sought through prescribed rules ("use this cumbersome phrase" or "reword entirely"), not organic usage.

  2.  **Presupposed by Rejecting Singular "They":**
      *   **Strict Number Concord as Inviolable:** This view elevates formal grammatical agreement (a singular antecedent *must* have a singular pronoun) above communicative function, historical precedent, and overwhelming usage. It presupposes that the grammatical rule of number concord is more fundamental and important than clarity, inclusivity, or linguistic efficiency.
      *   **Ambiguity Phobia:** It presumes that singular "they" is inherently confusing or ambiguous, despite centuries of effective use where context makes the referent clear (e.g., "Someone left *their* umbrella"). This overstates the problem of ambiguity while ignoring the ambiguity *introduced* by forcing "he or she" onto a non-binary individual or the clumsiness of constant rewrites.
      *   **Reification of "Grammar" as Static Rules:** It treats "grammar" as a fixed set of eternal, prescriptive rules (often based on 18th/19th century Latinate models) rather than a descriptive account of how language actually functions and evolves. Resistance often stems from "it breaks the rule" rather than "it causes genuine communication failure."
      *   **Denial of Legitimacy for Non-Binary Referents:** Crucially, this rejection often implicitly (or explicitly) refuses to acknowledge non-binary gender identities as linguistically valid. If "he or she" covers *everyone*, then there is no need for "they," because only two categories exist. This clashes fundamentally with Hofstadter's implied view and lived experience.

  **What Hofstadter's Implied View Rejects that This Second Practice Still Holds:**

  *   **The Harmlessness of Defaults:** Hofstadter's satire fundamentally attacks the idea that making one group the default is psychologically or socially neutral. The second practice, by insisting on "he or she," still centres the binary gender distinction as the *necessary* framework for generic reference, maintaining its salience.
  *   **Stipulation Overriding Lived Experience:** While conceding "he" alone is problematic, the "he or she" camp still relies on stipulation ("use this phrase") to *impose* a binary framework on language users, potentially excluding or misrepresenting non-binary individuals. Hofstadter implies meaning arises from the *effect* of the language in context, not just the stipulated intent.
  *   **Formal Rules Over Communicative Function:** Hofstadter highlights the absurdity and exclusion caused by clinging to a formal rule (white/male as default) despite its communicative failure. Rejecting singular "they" due to number concord prioritises a formal rule over the clear communicative success and inclusivity the form achieves for millions daily.

  **Is the Question Ill-Posed? Some Caveats:**

  *   **No Single Coherent Philosophy:** You're right to suspect this. Defenders of generic "he" historically drew on various strands: traditional grammar, logical positivism, perhaps a simplistic view of Latin grammar. There wasn't a unified linguistic theory.
  *   **Motivations Vary:** Some proponents genuinely believed in the stipulated neutrality; others were consciously enforcing patriarchal norms; many simply accepted tradition uncritically. The "philosophy" often amounted to "this is the rule".
  *   **"Presupposition" Might Be Too Strong:** For many practitioners, especially historically, it wasn't a consciously held "philosophy" but an unexamined linguistic habit or adherence to authority. The presuppositions are largely *reconstructed* from the logic required to sustain the practice against criticism.
  *   **The Real Driver is Often Social, Not Linguistic:** Underpinning *both* practices (generic "he" and rejecting "they") are often unspoken social beliefs about gender hierarchy, binary essentialism, and resistance to social change, which then seek justification in linguistic arguments.

  **Conclusion:**

  The practice of generic masculine pronouns presupposes a philosophy of language centred on **stipulative denotation, the separability and irrelevance of connotation, and the cognitive harmlessness of grammatical defaults.** It rules out use-based, connotative, embodied, and critically-aware theories of meaning. The shift to "he or she" while rejecting singular "they" **concedes the connotative problem with generic 'he'** but **retains binary essentialism, strict prescriptivism (especially number concord), and ambiguity phobia,** while often implicitly **denying the linguistic validity of non-binary identities.** Hofstadter's satire effectively exposes the social absurdity and exclusion inherent in treating one specific group as the linguistically unmarked "default" human, a presupposition that lingers in the insistence on binary solutions. Abandoning these practices would necessitate embracing a view where **meaning is significantly shaped by use, connotation, and lived experience; where grammatical rules are descriptive guides rather than inviolable laws; and where inclusivity is a core criterion for linguistic adequacy.** It’s less a change in a single theory, and more a shift from a prescriptive, abstract, denotational view towards a pragmatic, descriptive, usage-based, and socially situated understanding of how language actually works in the world. The messiness reflects the complex interplay between language structure, social power, and individual cognition – a reality that tidy grammatical stipulations often fail to capture.
