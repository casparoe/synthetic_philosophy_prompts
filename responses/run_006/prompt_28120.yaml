prompt: |-
  so i was rewatching Memento last weekend — the nolan film where the guy has anterograde amnesia and uses tattoos and polaroids to keep track of things — and i fell down this rabbit hole about something i'd read in a blog post about "knowing how vs. knowing that." the basic idea as i understand it is that there's a difference between knowing how to do something (ride a bike, play piano) and knowing that some proposition is true ("paris is the capital of france"). ryle made this distinction famous, but then some philosophers like stanley and williamson came along and argued that knowing-how is really just a species of knowing-that — that when you know how to ride a bike, what you really have is knowledge of some fact like "this way of balancing works."

  what got me thinking is that leonard in memento can't form new declarative memories — he can't accumulate new knowing-that — but he seems to retain procedural abilities: he drives, he fights, he follows his own routines for tattooing facts on himself. so the film kinda dramatizes the distinction, right? but it also complicates it, because his whole system of tattoos and notes is basically an attempt to externalize knowing-that so he can function, and by the end it's clear this has gone badly wrong — he's manipulating his own future self by selectively curating what "facts" he records. there's that scene where he burns the photo of his dead attacker and writes "don't believe his lies" on teddy's polaroid, basically engineering a false belief for his future self.

  i'd love a reading of the film through this knowing-how vs. knowing-that lens. does the film take a side — does it suggest that knowing-how is more fundamental or more resilient than knowing-that? or does it show that knowing-how without reliable knowing-that becomes unmoored and self-destructive? are there specific scenes where this tension is especially visible? i'm a software engineer with zero philosophy background so please explain the philosophical positions clearly, but also really dig into the film. approach this as a philosopher of mind who takes film seriously as a medium that can do philosophical work — maybe start by brainstorming the key scenes that bear on the question before you write. and keep it to about 500 words max — i want depth but not a dissertaion.
