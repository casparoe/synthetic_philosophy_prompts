answer: |-
  Here's a reading of *Memento* through the lens of "knowing-how" (KH) vs. "knowing-that" (KT), focusing on key scenes and the film's philosophical implications:

  **Philosophical Groundwork:**
  *   **Ryle (KH ≠ KT):** Gilbert Ryle argued KH (procedural knowledge, skills) is fundamentally different from KT (propositional knowledge, facts). You *show* KH by doing, not by stating facts *about* doing. Knowing *how* to ride a bike isn't reducible to knowing *that* "leaning left counteracts a fall right."
  *   **Stanley/Williamson (KH is KT):** They argue KH *is* a form of KT – specifically, knowledge *of a way* (under a practical mode of presentation) to perform an action. Knowing how to ride a bike involves knowing *that* *this specific way* of balancing *is* the way to ride.

  **Memento's Dramatization:**
  Leonard Shelby (Guy Pearce) perfectly embodies the distinction due to his anterograde amnesia. He cannot form new KT ("I know *that* this person is lying"). Critically, however, he retains KH ("I know *how* to drive/fight/tattoo").

  **Key Scenes & Analysis:**

  1.  **Opening Scene / John G. Killing:** Leonard executes a complex plan: luring someone to a remote location, setting an ambush, strangling him, and photographing the body. This showcases robust KH – ingrained motor skills, tactical sequencing, and procedural memory for his own "system." He *knows how* to be a hunter.
      *   **Tension:** This KH operates terrifyingly effectively *without* reliable KT. He *knows how* to kill, but the KT justifying *why* ("*that* this is John G.") is externally sourced and flawed.

  2.  **Tattooing Routine:** Leonard meticulously tattoos "facts" onto himself. This scene highlights the *attempted externalization of KT*. The ritual itself (sterilizing, inking) is KH he retains. But the *content* ("FACT: CAR LICENSE SG13 7IU") is KT he must physically encode because his brain cannot hold it internally.
      *   **Tension:** The process (KH) is intact, but the reliability of the inscribed propositions (KT) is vulnerable to manipulation and error.

  3.  **Teddy's Photo Manipulation:** This is the crux. Leonard burns the photo proving he already killed his wife's attacker. He writes "DON'T BELIEVE HIS LIES" on Teddy's photo and later tattoos "FACT 6: CAR LICENSE SG13 7IU" (planting false KT that Teddy is John G.).
      *   **Tension:** This scene weaponizes the Rylean distinction. Leonard's KH (writing, tattooing) is used deliberately to implant *false* KT for his future self. His procedural skills become tools for self-deception. His KH functions flawlessly, but the KT it serves is corrupted. Stanley/Williamson's view struggles here: the "way" Leonard knows (his system) is actively generating harmful false propositions.

  4.  **Sammy Jankis Story:** Leonard recounts Sammy, who also had anterograde amnesia. His wife, testing if his KH (giving insulin shots) required KT (remembering her), deliberately overdosed and died. Leonard concludes Sammy's condition was psychological, not physical, implying KH *could* persist independently *if* the will was there.
      *   **Tension:** This story (itself likely distorted KT) explores whether KH *can* truly operate without *any* supporting KT (did Sammy *know how* to give insulin without *knowing that* it was his wife needing it?). It also foreshadows Leonard's own manipulation.

  **The Film's Philosophical Stance:**
  *Memento* powerfully illustrates **both the resilience of KH and its dangerous potential when severed from reliable KT.**
  *   **KH is More Fundamental/Resilient:** Leonard's skills persist where his declarative memory fails. Driving, fighting, systematizing – these survive the neurological damage, supporting Ryle's view of KH as distinct and embodied.
  *   **KH Without KT is Unmoored & Destructive:** The film's tragedy stems from this disconnect. Leonard's effective KH (hunting, investigating, tattooing) becomes a destructive engine precisely *because* it lacks grounding in truth (reliable KT). His system is brilliant KH applied to disastrously false KT. His final line – "Do I lie to myself to be happy? ... Yes I will." – highlights the terrifying emptiness achievable when KH serves constructed, rather than discovered, KT.

  **Conclusion:** *Memento* doesn't choose a strict philosophical side but powerfully dramatizes the *interdependence* of KH and KT for meaningful, ethical action. Leonard's retained KH proves robust and distinct (supporting Ryle), but the film shows this procedural capacity, divorced from true propositional knowledge and vulnerable to manipulation, leads to a self-perpetuating cycle of violence and delusion. His knowing-*how* is tragically intact; his knowing-*what* is fatally compromised. The film argues both are essential.
