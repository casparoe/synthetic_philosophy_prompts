  I'm a software engineer working in formal verification — most of my day is in Lean and Coq, trying to make proof automation do something useful. A friend of mine did a math undergrad and keeps insisting that Gödel's incompleteness theorems prove no AI could ever really do mathematics the way a human can. His version of it is: any formal system strong enough for arithmetic has a Gödel sentence it can't prove, but we humans can see that the sentence is true, so the human mind can't itself be a formal system, so no algorithm can match a human mathematician. I'm fairly sure he's confusing a few different claims, but I don't have the philosophy background to pin down which ones.

  Could you restate the argument he's gesturing at — the Lucas/Penrose-style claim that Gödel shows the mind isn't an algorithm — in the vocabulary I actually use? I think in terms of formal systems, proof checkers, soundness and consistency, object language versus metalanguage, the halting problem, decidability, and reflection principles. Walk through the argument step by step, and for each step tell me what translates cleanly into that vocabulary, what had to be distorted or fudged to fit, and what has no expression in my vocabulary at all. Then give me the residue report: after the translation, is there anything left of the claim that isn't just a confusion between a system proving something and a system's behavior being consistent with a truth it can't assert, including it's own consistency? Basically I want to know whether my friend's argument is substantive and my vocabulary is too narrow to catch it, or whether the argument quietly depends on notions my vocabulary refuses to smuggle in.
