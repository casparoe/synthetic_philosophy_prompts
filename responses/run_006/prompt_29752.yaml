prompt: |-
  ok so i just had this three-hour argument with my friend about wild animal suffering and habitat destruction and i genuinely cannot figure out where we actually disagree. the setup: we both agreed to grant (for the sake of the argument) that wild animal lives are on balance suffering-dominated — lots of starvation, predation, disease, the whole thing. and then he was like "well then obviously clearing a forest is good, you're preventing all those future miserable lives." and i kept saying no, wait, it cant be that simple — the animals that are there when the bulldozers show up don't just peacefully cease to exist, they die badly or get displaced into worse conditions, and then whatever replaces the forest (cattle pasture, soy field, whatever) hosts a completely different set of animals with a different welfare profile, and the temporal horizon matters because maybe you're just trading one kind of suffering for another. but honestly i don't have a worked-out view and i'm not sure which of my objections actually bite.

  so what i want from you is your actual credence on this claim: "For a typical case of large-scale habitat destruction (say, clearing tropical forest for agriculture), the intervention is net positive in expectation for total wild animal welfare, assuming a suffering-dominated view of wild animal lives." give me a number. but more importantly, decompose the thing — what are the sub-questions your credence rides on, what probability do you stick on each, and how do they combine? i want to see which term is doing the heavy lifting and which one you'd most easily flip on.

  and for format: after you write out your reasoning, give me a JSON object. schema: "overall_credence" (number 0–1), "decomposition" (array of objects, each with "sub_question" (string), "credence" (number 0–1), "justification" (string, one sentence)), "most_sensitive_term" (string, which sub-question would shift your overall number the most if you changed your mind), and "least_confident_term" (string, which sub-question you're least sure about). also in the prose part, tell me how confident you are in the whole analysis and which point you're least sure of — i know that overlaps with the JSON fields but i want it in plain english too.
