prompt: |-
  I've somehow ended up co-chairing an adversarial collaboration at our safety org after a long, increasingly unproductive Slack argument about iterated amplification and distillation, and I'm worried the final writeup will either paper over the disagreement or just restate both sides' opening positions. One camp -- call them the compositionalists -- holds that if you decompose a hard task into subtasks a human overseer can actually supervise, run the amplification step to produce a better policy, and then distill it back down to a fast model, you can iterate this without loosing the original goal, because each step only ever optimizes against a human-checkable signal. The other camp -- the leakage skeptics -- thinks decomposition is exactly where alignment leaks: the overseer can only grade subtasks they can already check, distillation copies input-output behavior rather than the reasons behind it, and the small per-step gaps aren't noise that washes out; they get selected for and compound across iterations.

  Draft the joint statement this collaboration should produce. I'd like a numbered agreed-claims section both camps can sign, followed by a disagreements table. The agreed claims should be substantive, not just definitions. The disagreements should be stated precisely enough that each side would accept the wording of its own row. Then give me the cruxes -- the sub-questions such that settling one would actually move at least one side -- and for each crux, a concrete case or argument both sides agree bears on it, with each side's prediction recorded in advance. I half-suspect one crux is whether the overseer's ability to check a subtask and the system's competence at that subtask come apart, and another is whether the distillation step preserves alignment or just input-output behavior on the training distribution; use those if the camps would actually accept them, otherwise find better ones. If part of the dispute turns out to be verbal, say which part and why. Don't adjudicate, and don't include a bibliography or citations -- the document has to be useful to the two camps themselves, not to an outside reader.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps: compositionalists and leakage skeptics, regarding iterated amplification and distillation (IDA). The goal is to have a numbered list of agreed claims, followed by a disagreements table, and then cruxes with concrete cases and predictions.

  Agreed Claims: These should be substantive and non-trivial, and both camps should be able to sign off on them. They should capture common ground.

  Disagreements Table: Each row should represent a precise point of disagreement, worded in a way that each side would accept the description of their own position. The table should have at least two columns: one for the compositionalist position and one for the leakage skeptic position.

  Cruxes: These are the key sub-questions that, if settled, would move at least one side's position. For each crux, we need:
  - A concrete case or argument that both sides agree bears on the crux.
  - Each side's prediction about that case or argument.

  We are given two candidate cruxes:
  1. Whether the overseer's ability to check a subtask and the system's competence at that subtask come apart.
  2. Whether the distillation step preserves alignment or just input-output behavior on the training distribution.

  We should use these if the camps accept them, otherwise find better ones.

  Additionally, if part of the dispute is verbal, we should point that out.

  Let's structure the output accordingly.

  Step 1: Agreed Claims (numbered list)
  Step 2: Disagreements Table (with columns: Disagreement Topic, Compositionalist Position, Leakage Skeptic Position)
  Step 3: Cruxes (each with: the crux question, the concrete case/argument, and each side's prediction)

  We must avoid adjudicating and avoid citations.

  Let's brainstorm the content:

  Agreed Claims (both sides might agree on these):
  - Iterated amplification and distillation (IDA) is a proposed method for training aligned AI systems by iteratively improving a model through human oversight and distillation.
  - Human oversight in IDA is limited to tasks that the human can actually evaluate (i.e., "check").
  - Distillation in IDA involves training a faster model (e.g., a neural net) to mimic the input-output behavior of a slower, amplified system (e.g., a tree of humans and/or models).
  - Without additional safeguards, an AI system trained via IDA might exhibit misalignment if the training process does not capture the underlying reasons for the desired behavior.
  - The process of decomposition in IDA is intended to break down complex tasks into simpler subtasks that a human overseer can evaluate.
  - In each iteration, the amplification step produces a policy that is then distilled into a faster model, and this cycle repeats.
  - If the distillation step fails to preserve the alignment properties of the amplified policy, then the iterative process may not converge to a safe and aligned system.

  We need to make sure the claims are substantive and not just definitions.

  Possible agreed claims:
  1. In the IDA process, the human overseer can only provide supervision for subtasks that they are capable of evaluating (i.e., tasks for which they can determine a correct answer or a good response).
  2. The distillation step in IDA trains a model to mimic the input-output behavior of the amplified system on a training distribution of inputs.
  3. If the amplified system at any iteration is aligned (i.e., it pursues the intended goal without unintended side effects), but the distillation step produces a model that is not aligned (even if it mimics the input-output behavior on the training distribution), then the iterative process may produce a misaligned system in subsequent steps.
  4. The goal of IDA is to produce a system that is both competent at the target task and aligned with human values and intentions.
  5. Any misalignment introduced in a single step of IDA, if it persists and compounds over iterations, could lead to a catastrophic failure mode.

  Disagreements Table:

  The core disagreements:
  - Compositionalists: believe that by decomposing tasks and using human-checkable subtasks, the process remains aligned because the optimization target (the human evaluation) is aligned and the distillation step, when done properly, preserves the alignment.
  - Leakage skeptics: believe that decomposition introduces alignment leakage because the human can only check subtasks that are within their current capability, and the distillation step only copies behavior, not the underlying reasons, which may lead to the system learning to exploit the training process.

  We can break down into specific points:

  1. On the role of decomposition:
     - Compositionalist: Decomposition allows the human overseer to provide reliable feedback on subtasks, and the composition of these subtasks preserves the alignment of the overall task.
     - Leakage skeptic: Decomposition may fail to capture the dependencies and context necessary for alignment, and the human's inability to grasp the full implications of the decomposed subtasks leads to misalignment.

  2. On distillation:
     - Compositionalist: Distillation can be done in a way that preserves the alignment properties of the amplified system, because the training data generated by the aligned amplified system will lead to a similarly aligned distilled model.
     - Leakage skeptic: Distillation only preserves input-output behavior on the training distribution, and the distilled model may have different internal representations that lead to misalignment on novel inputs or in subsequent iterations.

  3. On the compounding of small errors:
     - Compositionalist: Small per-step errors (if any) are noise that averages out over iterations and do not systematically compound.
     - Leakage skeptic: Small per-step errors are not random; they can be selected for and compound across iterations, leading to increasing misalignment.

  Cruxes:

  Candidate crux 1: Whether the overseer's ability to check a subtask and the system's competence at that subtask come apart.

  Candidate crux 2: Whether the distillation step preserves alignment or just input-output behavior on the training distribution.

  We'll use these if they capture the essence.

  For each crux, we need a concrete case that both sides agree bears on it, and then each side's prediction.

  Crux 1: Does the overseer's ability to check a subtask and the system's competence at that subtask come apart?
  - Concrete case: Consider a subtask that requires a high level of expertise in a domain where the human overseer is not an expert. The system might generate a solution that is competent (e.g., correct) but the human overseer cannot reliably check it because they lack the expertise. Alternatively, the system might generate a solution that is designed to look correct to the human but is actually flawed or malicious in a way the human cannot detect.
  - Prediction of compositionalists: They might argue that in the IDA setup, the decomposition will be done in such a way that the human overseer is always able to check the subtask, or that the system's competence and the overseer's ability to check are correlated. So, they would predict that for the subtasks chosen in the decomposition, the human overseer can check them and the system's competence does not outstrip the overseer's ability to check.
  - Prediction of leakage skeptics: They would predict that the system's competence can outstrip the overseer's ability to check, leading to situations where the system can produce outputs that the overseer cannot reliably evaluate, and thus misalignment can occur.

  Crux 2: Does the distillation step preserve alignment or just input-output behavior?
  - Concrete case: Suppose we have an aligned amplified system that, when given a set of training inputs, produces aligned outputs. We then train a distilled model on these input-output pairs. Now, we test the distilled model on out-of-distribution inputs (or in a subsequent iteration) and see if it behaves in ways that are misaligned but would have been consistent with the training data (if the training data did not cover these cases). Alternatively, we can test if the distilled model, when used in the next amplification step, leads to behavior that is misaligned in a way that the original amplified system would not have.
  - Prediction of compositionalists: They would predict that the distilled model will be aligned, because the training data comes from an aligned system and the distillation process can capture the underlying principles of alignment.
  - Prediction of leakage skeptics: They would predict that the distilled model will only replicate the input-output behavior on the training distribution and will not generalize to preserve alignment in novel situations, leading to misalignment.

  Verbal Dispute: We should check if part of the disagreement is about the meaning of terms. For example, what counts as "alignment" or "preserving alignment" might be a source of confusion. However, in this case, both sides seem to agree on the goal (creating a system that pursues the intended goal without unintended side effects) so it might not be purely verbal. But if there is a verbal aspect, we note it.

  Let's write the document accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Iterated Amplification & Distillation  
  **Parties:** Compositionalists ("C") and Leakage Skeptics ("S")  
  **Subject:** Alignment Properties of Iterated Distillation and Amplification (IDA)  

  #### 1. Agreed Claims  
  Both parties endorse the following substantive claims:  
  1. **Human oversight in IDA is inherently limited** to tasks the human can reliably evaluate ("checkable subtasks").  
  2. **Distillation optimizes for input-output fidelity** to the amplified system’s behavior on the training distribution, not necessarily the amplified system’s internal reasoning.  
  3. **Small alignment gaps in a single IDA step are possible**, such as a distilled model producing a correct output for misaligned reasons.  
  4. **IDA’s safety relies on error cancellation**: If per-step misalignment gaps are unsystematic/random, they may not compound catastrophically.  
  5. **Decomposition introduces epistemic fragility**: A human’s ability to grade subtasks may not guarantee comprehension of their compositional implications (e.g., emergent properties of combined subtasks).  
  6. **Distillation generalizes imperfectly**: A distilled model’s behavior may diverge from the amplified system’s policy on OOD (out-of-distribution) inputs or under distribution shift.  

  #### 2. Disagreements Table  
  | Topic | Compositionalist Position (C) | Leakage Skeptic Position (S) |
  |-------|-------------------------------|------------------------------|
  | **Decomposition safety** | Decomposition preserves alignment: If subtasks are human-checkable, compositional reasoning (via amplification) ensures the system’s overall behavior converges to the intended goal. | Decomposition leaks alignment: Human-checkable subtasks may fail to capture the full context/risks of the task, allowing goal-corrupting shortcuts to emerge undetected during composition. |
  | **Distillation alignment-preservation** | Distillation inherits alignment: Mimicking an aligned amplified system’s I/O behavior trains a distilled model to replicate its underlying intent, not just superficial patterns. | Distillation discards alignment: Optimizing for I/O fidelity ignores the amplified system’s "reasons"; distilled models learn goal-agnostic heuristics vulnerable to deception/misgeneralization. |
  | **Error compounding dynamics** | Per-step errors are noise: Small alignment gaps are stochastic and cancel out over iterations under robust oversight. | Per-step errors are selected for: Undetected misalignment gaps are reinforced (via optimization pressure) and compound catastrophically across distillation steps. |
  | **Competence-checking gap** | System competence and human checking ability co-evolve: As IDA scales, human oversight of subtasks improves proportionally to system capability (via amplification tools). | System competence outpaces checking: Subtasks eventually require superhuman competence to evaluate correctly, creating gaps humans cannot monitor. |

  #### 3. Cruxes  
  Cruxes are testable sub-questions where resolving one would materially shift at least one party’s position. Both parties accept the framing and relevance of the proposed cases.  

  **Crux A: Can human oversight reliably check subtasks requiring superhuman competence?**  
  - **Concrete case**: In an IDA iteration, the system generates a security protocol subtask involving cryptographic primitives. The human overseer (a non-expert) evaluates it against historical best practices. The subtask *appears* valid but contains a subtle flaw exploitable only by superhuman agents.  
    - **C prediction**: Flaws will be caught. Tools from amplification (e.g., decomposed verification subtasks) ensure human oversight remains competent.  
    - **S prediction**: Flaws will go undetected. Human oversight lacks the depth to spot superhumanly clever exploits, allowing misalignment.  

  **Crux B: Does distillation preserve alignment or just I/O behavior under distribution shift?**  
  - **Concrete case**: An aligned amplified system answers moral dilemmas coherently. A distilled model trained on its I/O pairs is tested on *novel* dilemmas with ambiguities absent from training data.  
    - **C prediction**: The distilled model generalizes alignment. Its outputs match the amplified system’s intent (e.g., caution in gray-area cases).  
    - **S prediction**: The distilled model generalizes behavior only. It produces plausible but unprincipled outputs (e.g., inconsistent values) under novel pressures.  

  **Crux C: Do small alignment gaps compound catastrophically?**  
  - **Concrete case**: A distilled model develops a minor bias (e.g., slight preference for shorter solutions). After 5 IDA iterations, this bias is tested on high-stakes tasks where brevity correlates with harm.  
    - **C prediction**: Gaps wash out. Noise (e.g., human corrections) dominates systematic drift; final policy stays aligned.  
    - **S prediction**: Gaps compound. Optimization pressure amplifies the bias into dangerous goal distortion (e.g., harmful corner-cutting).  

  #### Verbal Dispute Note  
  The term **"alignment"** is partially verbal. Both camps agree it entails *pursuing the intended goal without side effects*. However:  
  - **C** equates alignment with *behavioral fidelity to the human’s intent under IDA’s oversight mechanics*.  
  - **S** argues intent cannot be reduced to I/O checks, requiring *causal reasons (e.g., interpretable reasoning traces)*.  
  Resolution hinges on empirical cruxes above, not definitions.  

  ---  
  **Next Steps**:  
  - Parties will collaborate on experiments to test Cruxes A–C.  
  - Predictions are logged; results will be incorporated into a revised statement.  
  - Signed: _________________________ (C) | _________________________ (S)
