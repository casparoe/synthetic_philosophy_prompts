prompt: |-
  I lead the analytics group at a state public-health agency. A large share of what reaches my desk is a claim of the form "the data we already collect shows X": a newly proposed risk factor, a new explanation for a long-running trend, a new outbreak signature, a reanalysis of years of surveillance data that supposedly supports a mechanism nobody had proposed when the data were collected. These claims feed decisions about interventions, advisories, and where we spend scarce analytic time, so we see them constantly and the stakes are high. Some of them are plainly hypotheses built after staring at the data; some are genuinely new theories that happen to predict patterns already sitting in our databases. My analysts are statistically competent but have no formal epistemology, and I need them to stop treating those two kinds of claim as if they were the same. I keep seeing the same failure mode: a hypothesis that was read off the data is given the same credit as one that stuck its neck out.

  I know the shape of the problem from Bayesian confirmation theory: the problem of old evidence. If the evidence is already known with probability one, conditioning on it cannot move the probability of the hypothesis, yet in practice old data sometimes plainly should support a new theory. I also know the usual repairs are something like counterfactual priors and the distinction between prediction and accommodation. What I do not have is a procedure my analysts can run.

  Write me a decision procedure for deciding, when someone claims that old data supports a new hypothesis, whether and how strongly the old data should count. It should be a reusable checklist in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "no — this is not evidence," where it stops with "yes — this is evidence, with roughly this strength," and where it hands the question to a person because judgment cannot be eliminated. Ground it in what Bayesian confirmation theory actually says about old evidence, but translate: an analyst should not need to know the theory to run it, and the whole thing must be runnable in under a day by someone with a master's-level statistics background and produce documentation a scientific review committee can sign off on.

  The procedure should preserve the distinctions that actually do the work. In particular, it must separate and give my analysts a test for each of the following:
  - whether the hypothesis was formulated before or after the data were examined;
  - whether the analysis itself was pre-specified or chosen after looking — the test statistic, the subgroup, the time window, the threshold;
  - whether the hypothesis makes a risky, precise prediction about the old data, or is compatible with nearly anything the data could have shown;
  - whether a counterfactual prior can be reconstructed honestly: what a reasonable analyst would have assigned to P(data | hypothesis) versus P(data | not-hypothesis) if the hypothesis had been on the table before the data were seen;
  - whether the old data were used to build the hypothesis in the first place, so that using them again as support is double-counting.

  It should also handle the hard cases explicitly: the old data are the only data there will ever be; the analyst cannot honestly reconstruct what they would have believed beforehand; the hypothesis is vague enough to accommodate almost anything but is dressed in precise language.

  Then run the procedure on three cases:
  1. An internal analyst proposes that our existing hospitalization database supports a new causal claim about a common exposure, after having run several hundred associations and found one that meets a conventional significance threshold; the hypothesis as stated was written down only after the significant association was found.
  2. A modeler derives, from an independently motivated transmission model, a precise quantitative prediction about the shape of a lag structure in historical surveillance data. The prediction is present in data collected years before the model existed, and it was specific enough that it could easily have failed.
  3. A mixed case of your own construction: the hypothesis is partly built from the old data but also makes one moderately risky prediction, and the analyst's own sense of what they would have believed beforehand is not trustworthy.

  The first case should produce an answer the proposing analyst will not like; the third should force the procedure to hand the question to a person. Be explicit about which steps are judgment calls dressed up as procedure, where the procedure will predictably misfire, and what it cannot do — in particular, what it cannot determine about hypotheses that were formed with the data in view. Also say where the procedure stops being epistemology and becomes decision theory: how strongly the old data should count is the procedure's business; whether to act on it, given costs and values, is not.

  End the response with a single line of the form:

  \answer{...}

  where the content is a one-sentence summary of the procedure.
reasoning: |-
  We are designing a decision procedure for evaluating claims that old data supports a new hypothesis, with a focus on the problem of old evidence. The procedure must be a reusable checklist that analysts can follow without deep epistemological training, and it must address the key distinctions: when the hypothesis was formulated, whether the analysis was pre-specified, the riskiness of the prediction, the reconstruction of a counterfactual prior, and whether the data were used to build the hypothesis.

  The procedure will have a series of steps (questions) with clear stopping points. We want to output either:
  - "no — this is not evidence" (or minimal evidence)
  - "yes — this is evidence, with roughly this strength" (and give a qualitative strength)
  - or hand the question to a person (for judgment).

  We are also to run the procedure on three cases.

  The procedure is grounded in Bayesian confirmation theory. The key idea is that for old evidence, we need to think counterfactually: what would we have expected the data to look like under the hypothesis and under alternatives, if we had considered the hypothesis before seeing the data? And how surprising is the data under the alternatives?

  We break down the procedure into steps:

  1. **Determine when the hypothesis was formulated relative to examining the data.**
     - Ask: Was the hypothesis written down (or otherwise formally specified) before any of the relevant data was examined for the purpose of testing this hypothesis?
     - If yes, proceed to step 2.
     - If no, then the hypothesis may have been influenced by the data (accommodation). Proceed to step 5 (which deals with reconstruction).

  2. **Determine if the analysis was pre-specified.**
     - Ask: Was the entire analysis plan (including the test statistic, subgroup, time window, threshold, etc.) pre-registered or otherwise fixed before the data were examined for this hypothesis?
     - If yes, proceed to step 3.
     - If no, then the analysis may have been tuned to the data. Proceed to step 5.

  3. **Assess the riskiness and precision of the prediction.**
     - Ask: Does the hypothesis make a precise and risky prediction about the data? That is, is the prediction such that many other outcomes (that could have reasonably occurred) would have been inconsistent with the hypothesis?
     - We can measure riskiness by considering the counterfactual: if the hypothesis were false, how likely is it that we would have observed data that fits the hypothesis? We want P(data | not hypothesis) to be low.
     - If the prediction is precise and risky (so that P(data | not hypothesis) is low), then proceed to step 4.
     - If the prediction is vague (so that the data is compatible with many outcomes under not hypothesis) or non-risky (so that P(data | not hypothesis) is high), then the data does not strongly confirm the hypothesis. We stop with "minimal evidence" (or "weak evidence") and document why (vague prediction).

  4. **Reconstruct the counterfactual prior predictive distributions.**
     - We now attempt to reconstruct what a reasonable analyst would have expected the data to look like under the hypothesis and under the alternatives, before seeing the data.
     - Ask: Can we honestly and reasonably assign:
          - P(data | hypothesis) 
          - P(data | not hypothesis)
       based on what we knew before the data were collected (or before the hypothesis was formed, if the hypothesis is new but the data is old)?
     - If yes, then we compute the Bayes factor (BF) = P(data | hypothesis) / P(data | not hypothesis). We interpret:
          - BF > 1: evidence for the hypothesis; the strength is proportional to the BF (e.g., BF>3: moderate, BF>10: strong, etc., using standard scales).
          - BF ≈ 1: no evidence.
          - BF < 1: evidence against.
     - We then stop with "yes, this is evidence" and report the strength (based on BF).
     - If we cannot reconstruct these probabilities honestly, then we proceed to step 5.

  5. **Determine if the hypothesis was built from the old data.**
     - Ask: Is there a clear indication that the hypothesis was constructed (or tuned) to fit the old data? This includes:
          - The analyst explored the data and then formulated the hypothesis to match a pattern found.
          - The hypothesis was one of many considered and selected because it fit.
          - The analysis involved multiple tests and only the significant one is reported.
     - If yes, then the data is being double-counted (used to generate the hypothesis and then to confirm it). We stop with "no — this is not independent evidence" (or "minimal evidence, due to double-counting").
     - If no (i.e., the hypothesis was not built from the old data, but we cannot reconstruct the priors or the analysis wasn't pre-specified), then we must use judgment. We proceed to step 6.

  6. **Judgment call: Can we bound the Bayes factor?**
     - Here we try to bound the strength of the evidence by considering what a reasonable prior might have been.
     - We ask: Even if we cannot assign exact probabilities, can we bound P(data | not hypothesis) from below? That is, can we argue that even without the hypothesis, the data was not extremely unlikely? And can we bound P(data | hypothesis) from above? (But note: if the hypothesis was built on the data, then P(data | hypothesis) might be set to 1 artificially, so we must avoid that.)
     - Alternatively, we can try to reconstruct a minimal prior probability for the data under the alternative (not H) by considering the space of possible outcomes and how many would have been consistent with the hypothesis. If the hypothesis is vague, then the set of outcomes consistent with it is large and P(data | not H) might not be very low.
     - We also consider: Is there a way to test the hypothesis on new data? If so, we might discount the old data and recommend a new study.
     - If we can bound the Bayes factor (e.g., we can say that BF < some value, meaning the evidence is at most weak) then we report that.
     - If we cannot bound it, then we hand the question to a panel of experts for a qualitative judgment. We document the uncertainty.

  Additionally, we note:

  - **Hard cases**:
     - The old data are the only data: We must do the best we can with the above.
     - Cannot reconstruct prior: We go to step 5 and 6.
     - Hypothesis is vague: This is caught in step 3 (if we get there) and leads to minimal evidence.

  The procedure stops with a decision about the evidential value of the old data. It does not decide whether to act; that is a separate decision theory problem (involving costs, benefits, and other evidence).

  Now, we run the procedure on the three cases.

  **Case 1: Internal analyst proposes a new causal claim after running several hundred associations.**

  - Step 1: The hypothesis was written down after the significant association was found. So we go to step 5.
  - Step 5: The hypothesis was built from the old data (by running many tests and selecting one). Therefore, we stop with: "no — this is not independent evidence (minimal evidence due to double-counting)."

  **Case 2: Modeler derives a precise quantitative prediction from an independently motivated model and checks it against old data.**

  - Step 1: The hypothesis (the model and its prediction) was formulated before the data were examined for this test? We assume the model was built independently and the data were historical and not used to build the model. So the answer is: the hypothesis was formulated before the data were examined for this purpose. (Note: The data existed but were not examined in the context of this hypothesis until now.) So we proceed to step 2.
  - Step 2: Was the analysis pre-specified? The modeler derived a precise prediction and then looked at the data exactly as predicted. We assume the analysis (which data, which variables, which time window, etc.) was fixed by the prediction. So yes, pre-specified. Proceed to step 3.
  - Step 3: The prediction is precise and risky: it could easily have failed. So we proceed to step 4.
  - Step 4: We try to reconstruct the counterfactual priors. We need P(data | H) and P(data | not H). 
     - P(data | H): Under the model, the data should look like the prediction. We can assign a probability (or density) based on the model's stochastic elements. If the model is deterministic, then we might use a small error tolerance.
     - P(data | not H): What would we expect under alternative models? This requires domain knowledge. But the prediction was specific enough that under not H, the data might be very unlikely. 
     - We assume we can do this reconstruction (the modeler can provide P(data|H) and we can reason about alternatives). Then we compute the Bayes factor. 
  - Result: We stop with "yes — this is evidence, with strength [computed BF]".

  **Case 3: Mixed case (constructed example):** 
     - Hypothesis: A researcher notices an unusual pattern in a subset of the old data (say, a spike in cases in a particular region and time) and then formulates a hypothesis that a specific event (say, a festival) caused that spike. The hypothesis also predicts that in similar future events (if they occur) we would see a spike, but there are no such future events in the data. The hypothesis was not pre-registered and the analysis (which festival, which region, which time window) was chosen after seeing the spike. However, the researcher argues that the festival is the only plausible cause in that context and that the spike was very large.

  We run the procedure:

  - Step 1: Hypothesis was formulated after the data were examined (the spike was noticed). Go to step 5.
  - Step 5: Was the hypothesis built from the old data? Yes, because the pattern was noticed and then the hypothesis was built to explain it. But wait: the hypothesis also makes a prediction about future events (though we don't have that data). However, for the old data, we are using the same data that generated the hypothesis. So we would normally say "double-counting" and stop with "no". But note: the hypothesis makes a moderately risky prediction: that the spike should be exactly at the time of the festival and not at other times. So let's see if we can do better.

  However, the procedure at step 5 says: if the hypothesis was built from the old data, then we stop with "no". But what if the risky prediction part is separable? We note that the procedure requires judgment at step 5: if the hypothesis was built from the data, we stop with "no". But let's check the step 5 condition: "Is there a clear indication that the hypothesis was constructed (or tuned) to fit the old data?" Yes, because the festival was chosen after seeing the spike. So we stop with "no — minimal evidence due to double-counting".

  But note: the procedure might be too harsh here. What if the risky prediction about the exact timing was not part of the data that generated the hypothesis? Actually, the entire hypothesis was built to explain the spike. So we are double-counting.

  Alternatively, we might try to consider: what part of the data was used to build the hypothesis and what part is a prediction? But in this case, the same data (the spike at the festival time) is being used to build and to confirm. So we stick with "no".

  However, the problem states that the hypothesis "also makes one moderately risky prediction". But if that prediction is about the same data, then it's not independent. If the prediction is about new data, then we wouldn't be using the old data for that. For the old data, we are stuck.

  But note: the procedure does not have a step for splitting the data. We are using the entire old dataset. So we must stop with "no".

  But the problem says the mixed case should force the procedure to hand the question to a person. So we must adjust the procedure to account for such nuances.

  We revise step 5 to be more nuanced:

  **Revised Step 5:**
     - Ask: Was the hypothesis built from the old data? (meaning: the same data now being used for testing)
          - If yes, then:
              - Is there a part of the data that was not used to build the hypothesis and that the hypothesis predicts? (i.e., can we do a within-data cross-validation?) For example, if the hypothesis was built on a subset of the data (e.g., one region) and then tested on another subset (another region) in the same dataset, then we might treat the test subset as new. But if not, then we are double-counting.
          - If the entire data was used to build the hypothesis, then we stop with "no — double-counting".
          - If there is a clear separation (e.g., the hypothesis was built on part A and tested on part B of the same dataset) then we can proceed to step 3 (for part B) but note that the data for part B must not have been used in building the hypothesis. However, we must be cautious because the entire dataset might have been used in generating the hypothesis (e.g., the idea came from the whole data). This is tricky and might require judgment.

  Alternatively, we can note that the procedure is designed for the entire dataset. If the analyst wants to use a holdout, that should be pre-specified. In the mixed case as described, there is no holdout. So we stop with "no". But to force a judgment call, we can add:

     - If the hypothesis was built from the old data but the analyst claims that the hypothesis makes a prediction that was not used in building it (and the data for that prediction is available in the same dataset but was not looked at) then we can proceed to step 2 (but note that the analysis for the prediction must have been pre-specified). However, without pre-specification, we cannot be sure that the prediction was not tuned.

  Given the complexity, we might instead in step 5, when we answer "yes" (the hypothesis was built from the old data), we then ask: 

     - "Can we identify a subset of the data that was not used to generate the hypothesis and that provides a test of a risky prediction? And was the analysis plan for that test fixed without looking at that subset?"

  If yes, then we can treat that subset as new data and run steps 1-4 for that subset. But note: step 1 for that subset would be "yes" (if the hypothesis was built without that subset) and then we require pre-specification (step 2) for that subset.

  But in the example, the entire dataset was used. So we don't have a holdout. Therefore, we go to step 6: judgment call.

  So let's restructure step 5:

  **Step 5:**
     - Determine if the hypothesis was built from the old data (the same data now used for testing). 
     - If no, proceed to step 6 (judgment call for prior reconstruction).
     - If yes, then:
          a. If there exists a holdout dataset (a part of the data that was not used in building the hypothesis) and the analysis plan for the holdout was pre-specified, then we run the procedure on the holdout dataset (go to step 1 for the holdout, which will be "yes" because the hypothesis was built without the holdout, then step 2, etc.).
          b. Else, we stop with "no — the old data cannot be used as independent evidence because they were used to generate the hypothesis."

  But note: the holdout must be truly untouched. Also, the pre-specification must be real.

  In the mixed case example, there is no holdout. So we would stop with "no". But the problem says the mixed case should force the procedure to hand the question to a person. Therefore, we must add an exception:

     - If the hypothesis was built from the old data and there is no holdout, but the analyst argues that the hypothesis makes a risky prediction that was not influenced by the data (or that the data used in the prediction was not used in building the hypothesis) then we cannot automatically say "no". We must use judgment. So we go to step 6.

  Therefore, we restructure step 5 as:

  **Step 5: Determine if the hypothesis was built from the old data.**
     - Ask: Was the hypothesis constructed (or adjusted) using the old data that are now being used to test it?
     - If no, proceed to step 6.
     - If yes, then:
          - Ask: Is there a pre-specified holdout dataset and a pre-specified analysis plan for that holdout that was set before the holdout was seen? 
          - If yes, then run the entire procedure on the holdout dataset (starting at step 1) and use the result for the holdout as the evidence.
          - If no, then we go to step 6 (judgment call) because the situation is complex and we cannot automatically rule out evidence.

  Now, for the mixed case:

  - Step 1: no (hypothesis after data) -> step 5.
  - Step 5: yes, the hypothesis was built from the old data. And there is no holdout. So we go to step 6.

  **Step 6: Judgment call:**
     - We try to bound the Bayes factor. We ask: 
          - What is the most plausible alternative explanation for the data? How likely was the data under that alternative?
          - How likely was the data under the hypothesis? (But note: the hypothesis was built to fit the data, so we cannot set P(data|H)=1 arbitrarily. We must think counterfactually: if the hypothesis had been proposed before seeing the data, what would P(data|H) have been? And what would P(data|not H) have been?)
     - In the festival example:
          - The hypothesis: the festival caused the spike. 
          - P(data | H): If the festival causes a spike, we might expect a spike of a certain magnitude. But note: the spike was already seen, so we must think counterfactually. Without the data, we might have expected a spike of some typical size? But we don't know.
          - P(data | not H): Without the festival, what is the chance of a spike that large at that time? We might use historical data to estimate the baseline rate and the variance. If such a spike is rare, then P(data | not H) is low.
     - But the problem is that the festival was chosen because of the spike. So we have to account for multiple testing: if there are many festivals and many regions, then the chance of a large spike coinciding with any festival anywhere might be high. 
     - We might try to compute a p-value adjusted for multiple comparisons. But that is frequentist. In Bayesian terms, we need the prior probability of the data under the alternative. 
     - Since the analyst cannot be trusted to reconstruct what they would have believed beforehand, we rely on domain experts. We ask: What would a reasonable analyst, before seeing the data, have thought about the chance of seeing a spike of this magnitude in this region at the time of the festival? And what would they have thought under the hypothesis? 
     - Given the complexity and the need for domain knowledge, we hand the question to a panel of experts. We document the uncertainty and the reasons.

  Therefore, for the mixed case, we stop with: "hand to a person (expert panel) for judgment."

  **Summary of the procedure:**

  We have a 6-step procedure:

  1. **Hypothesis timing:** Was the hypothesis specified before examining the data for this test? If yes, go to 2; else, go to 5.
  2. **Analysis pre-specification:** Was the analysis plan fixed before examining the data? If yes, go to 3; else, go to 5.
  3. **Riskiness of prediction:** Is the prediction precise and risky? (i.e., under not hypothesis, the data was unlikely). If yes, go to 4; else, stop with "minimal evidence" (due to vagueness).
  4. **Counterfactual prior reconstruction:** Can we assign P(data|H) and P(data|not H) reasonably? If yes, compute Bayes factor and report strength; else, go to 5.
  5. **Hypothesis built from data?:** 
     - If the hypothesis was built from the data (and no pre-specified holdout exists), then go to step 6.
     - If there is a pre-specified holdout, then run the procedure on the holdout (from step 1).
     - If the hypothesis was not built from the data, go to step 6.
  6. **Judgment call:**
     - Attempt to bound the Bayes factor by considering what a reasonable prior would have been. If possible, report the bound (and thus the maximum strength of evidence).
     - If not, hand the question to a panel of experts for a qualitative assessment.

  Now, we write the procedure as a reusable checklist.

  ---

  **Decision Procedure for Evaluating Claims that Old Data Supports a New Hypothesis**

  **Purpose:** To assess whether, and to what extent, previously collected data provides evidence for a newly proposed hypothesis, accounting for the risk of double-counting and the problem of old evidence.

  **Inputs:** 
  - A hypothesis H.
  - An existing dataset D (collected before H was proposed, or before the current analysis).
  - The history of how H was developed and how D was used in that development.
  - The analysis plan that produced the claim.

  **Outputs:** 
  - One of: 
     a. "no — this is not evidence" (or "minimal evidence") with reasons.
     b. "yes — this is evidence" with a qualitative or quantitative strength (e.g., weak, moderate, strong).
     c. "hand to expert panel for judgment".

  **Steps:**

  1. **Hypothesis Timing:**
     - Question: Was the hypothesis H formally specified (written down) before any part of the dataset D was examined for the purpose of testing or developing H?
     - Sufficient answer: 
          - Yes: Documentation (e.g., preregistration, dated notes) showing H was specified before D was examined for H.
          - No: There is evidence that H was formulated after seeing D (or part of D), or the timing is unclear.
     - Procedure:
          - If yes, proceed to step 2.
          - If no, proceed to step 5.

  2. **Analysis Pre-specification:**
     - Question: Was the entire analysis plan (including the test statistic, subgroup, time window, threshold, etc.) fixed and documented before the dataset D was examined for this test?
     - Sufficient answer:
          - Yes: Preregistration or a dated analysis plan that exactly matches the analysis done.
          - No: The analysis was chosen after looking at D (or the analysis is one of many tried and only the significant one is reported).
     - Procedure:
          - If yes, proceed to step 3.
          - If no, proceed to step 5.

  3. **Riskiness and Precision of Prediction:**
     - Question: Does H make a precise and risky prediction about D? (That is, under the alternative to H, the observed data D would have been unlikely.)
     - Sufficient answer:
          - Yes: The prediction is quantitative and specific, and it is possible to specify outcomes that would have been inconsistent with H. The space of outcomes consistent with H is small relative to the space of all possible outcomes that might reasonably have occurred. (Example: predicting a specific numerical value or a specific pattern that is not expected by chance.)
          - No: The prediction is vague (e.g., "there will be an increase" without specifying how much) or non-risky (e.g., the data is likely under many alternatives to H).
     - Procedure:
          - If yes, proceed to step 4.
          - If no, stop with output: "minimal evidence — the prediction was not sufficiently risky or precise." (Reason: Even if H is false, the data D would not be surprising.)

  4. **Counterfactual Prior Reconstruction:**
     - Question: Can we honestly and reasonably assign two probabilities:
          - P(D | H): The probability of observing data D if H were true, as assessed by what we knew before D was collected (or before H was proposed, if D is old).
          - P(D | not H): The probability of observing D if H were false, under the same prior knowledge.
     - Sufficient answer:
          - Yes: We have a statistical model or expert consensus that provides these probabilities (or densities) without being influenced by the knowledge of D. (Note: For not H, we may use the best alternative model available at the time.)
          - No: We cannot reconstruct these probabilities without being influenced by D.
     - Procedure:
          - If yes, compute the Bayes factor (BF) = P(D|H) / P(D|not H). 
               - If BF > 1, the data supports H. The strength:
                    - 1 < BF < 3: weak
                    - 3 ≤ BF < 10: moderate
                    - 10 ≤ BF < 30: strong
                    - BF ≥ 30: very strong
               - If BF ≈ 1, output "minimal evidence".
               - If BF < 1, output "evidence against H".
          - If no, proceed to step 5.

  5. **Hypothesis Built from Data?**
     - Question: Was the hypothesis H constructed (or adjusted) using the dataset D (or a part of D) that is now being used to test it?
     - Sufficient answer:
          - Yes: There is evidence that H (or its specific parameters) was chosen to fit D (e.g., by exploring D, running multiple tests, or adjusting H until it matched D).
          - No: H was developed independently of D (e.g., from theory, other data, or prior literature).
     - Additional question (if yes): Was there a pre-specified holdout subset of D that was not used in building H and for which there was a pre-specified analysis plan?
          - Yes: We have a clear separation of data used for building and testing, and the test was pre-specified.
          - No: There is no holdout or the holdout analysis was not pre-specified.
     - Procedure:
          - If the answer to the first part is no, proceed to step 6.
          - If the answer is yes and there is a pre-specified holdout, then re-run the entire procedure (from step 1) using only the holdout data. (Note: For step 1, the holdout data must not have been examined for H before. If not, then the holdout is not truly independent.)
          - If the answer is yes and there is no pre-specified holdout, proceed to step 6.

  6. **Judgment Call and Bounding:**
     - Question: Can we bound the strength of the evidence by estimating a lower bound for P(D|not H) and an upper bound for P(D|H) without being influenced by the knowledge of D, so that we can compute a maximum Bayes factor?
     - Sufficient answer:
          - Yes: We can use domain knowledge to conservatively estimate the probabilities. For example, we can compute the probability of the data under a broad alternative model that might have been considered before seeing D. We then compute a bound on BF.
          - No: The bounds are too wide to be informative, or we cannot trust the estimates.
     - Procedure:
          - If we can compute a bound, then report the maximum Bayes factor and the corresponding strength (as in step 4) as the best-case scenario for the evidence. (But note: this is conservative and the true evidence might be weaker.)
          - If we cannot, then output: "hand to expert panel for judgment". (The panel will use their domain expertise to qualitatively assess whether D supports H, considering the history and the risk of double-counting.)

  **Handling Hard Cases:**
     - **Only old data exists:** We must do the best we can with the above. Steps 5 and 6 are particularly relevant.
     - **Cannot reconstruct prior:** This leads to step 6.
     - **Vague hypothesis:** This is caught in step 3 (if reached) and leads to minimal evidence.

  **Limitations:**
     - The procedure cannot magically turn a hypothesis built on the data into strong evidence. It will err on the side of caution.
     - For hypotheses formed with the data in view, the procedure may often lead to step 6 (judgment) or to a rejection of evidence (step 5).
     - The procedure does not assess the truth of H, only the evidential value of D for H.
     - The procedure does not consider costs and benefits of actions. That is decision theory.

  **Running the Cases:**

  **Case 1:**
     - Step 1: No (hypothesis after data) -> step 5.
     - Step 5: The hypothesis was built from the data (by running hundreds of tests) and there is no holdout. So we go to step 6.
     - Step 6: We try to bound the evidence. The data D (the significant association) was found in one test out of hundreds. We can compute a bound on P(D|not H) by accounting for multiple testing: the chance of at least one false positive at the chosen threshold. This is high if we did hundreds of tests. Therefore, P(D|not H) is not low. We can compute a bound: 
          - P(D|not H) ≥ (number of tests) * (significance level)   [by Bonferroni, but actually more accurately by the false positive rate under multiple testing]
          - So BF = P(D|H) / P(D|not H) ≤ 1 / [ (number of tests) * (significance level) ]   [if P(D|H)=1, but note P(D|H) might be less than 1]. 
          - Since the number of tests is large, BF is small. Therefore, the evidence is at best weak. 
     - We output: "minimal evidence — the association is likely due to multiple testing."

  **Case 2:**
     - Step 1: Yes -> step 2.
     - Step 2: Yes (pre-specified by the model) -> step 3.
     - Step 3: Yes (risky prediction) -> step 4.
     - Step 4: We can reconstruct. 
          - P(D|H): The model predicts the data with some stochastic element. We can compute the likelihood.
          - P(D|not H): We use a reasonable alternative model (e.g., a null model or a competing model) and compute the likelihood of D under that.
          - BF = P(D|H) / P(D|not H) is large (say, 100). 
     - Output: "yes — strong evidence (BF ≈ 100)".

  **Case 3 (Mixed):**
     - Step 1: No -> step 5.
     - Step 5: Hypothesis was built from the data (the festival was chosen because of the spike) and there is no holdout. So we go to step 6.
     - Step 6: We try to bound. 
          - We ask: How many festivals and regions could have been tested? If there were many, then the chance of a spike (by chance) at any one of them is high. 
          - We might compute the probability of a spike of that magnitude occurring at any festival in any region in the dataset under the null. This could be done by simulation or by using the baseline rate and the number of opportunities. 
          - If that probability is high, then P(D|not H) is high and BF is low. 
          - But note: the hypothesis might be that this particular festival (because of its size, etc.) should cause a spike. However, since the festival was selected after the fact, we must account for the selection. 
          - Without a clear way to bound (because the analyst's prior might have been that this festival was special, but we don't trust that), we decide we cannot bound reliably. 
     - Output: "hand to expert panel for judgment".

  **Final Answer:**

  We end with a one-sentence summary of the procedure.

  \answer{The procedure sequentially evaluates the independence, pre-specification, riskiness, and reconstructability of the hypothesis and data, then bounds or flags for judgment, to assign an evidential strength to old data for a new claim.}
answer: |-
  ### Decision Procedure for Evaluating Claims that Old Data Supports a New Hypothesis  
  **Purpose**: To determine whether pre-existing data provides valid evidence for a new hypothesis, accounting for double-counting, data-dredging, and the problem of old evidence. Outputs are:  
  - **"No evidence"**: Data does not support the hypothesis.  
  - **"Evidence, strength = [weak/moderate/strong]"**: Data supports hypothesis (qualitative strength based on Bayes factor bounds).  
  - **"Hand to expert panel"**: Unresolvable ambiguity; human judgment needed.  

  **Key Principles from Bayesian Confirmation Theory**:  
  - **Old evidence problem**: If data \(D\) is known, it cannot update belief in hypothesis \(H\) unless we reconstruct what we *would have believed* before seeing \(D\).  
  - **Core test**: Reconstruct the counterfactual **Bayes factor** \( \text{BF} = \frac{P(D \mid H)}{P(D \mid \neg H)} \). If \(\text{BF} > 1\), \(D\) supports \(H\). Strength scales with \(\text{BF}\) (e.g., \(\text{BF} > 10\) = strong).  
  - **Critical distinctions**: Hypothesis timing, analysis pre-specification, prediction risk, and reconstruction feasibility.  

  ---

  ### The Procedure: A Reusable Checklist  
  **Instructions**: Answer each question in order. Stop at the first terminal output (**bolded**). Document all answers for review.  

  1. **Was the hypothesis formulated *before* examining the data?**  
     - *Ask*: "Was \(H\) written down *before* anyone involved examined \(D\) for this claim?"  
     - *Sufficient answer*:  
       - **Yes** (with timestamped documentation): Proceed to Step 2.  
       - **No** (or ambiguous): Proceed to Step 5.  
     - *Why*: Hypotheses built *after* seeing data risk double-counting.  

  2. **Was the analysis plan pre-specified?**  
     - *Ask*: "Was the test statistic, subgroup, time window, and threshold fixed *before* examining \(D\)?"  
     - *Sufficient answer*:  
       - **Yes** (preregistered/dated protocol): Proceed to Step 3.  
       - **No** (e.g., multiple analyses run, best one chosen): Proceed to Step 5.  
     - *Why*: Post-hoc analysis inflates false positives.  

  3. **Does the hypothesis make a *risky, precise* prediction?**  
     - *Ask*: "If \(H\) were false, would \(D\) likely look different? (e.g., is \(P(D \mid \neg H)\) low?)"  
     - *Test*:  
       - Calculate the **standardized effect size** of \(D\) under \(H\).  
       - Estimate \(P(D \mid \neg H)\) using historical data or null models.  
     - *Sufficient answer*:  
       - **Yes** (\(P(D \mid \neg H) \leq 0.05\) and effect size > null expectation): Proceed to Step 4.  
       - **No** (prediction vague or \(P(D \mid \neg H)\) high): **Stop → Minimal evidence. Reason**: \(D\) is likely under \(\neg H\).  
     - *Why*: High-risk predictions uniquely support \(H\).  

  4. **Can we reconstruct \(P(D \mid H)\) and \(P(D \mid \neg H)\) honestly?**  
     - *Ask*: "Ignoring \(D\), what would reasonable analysts have assigned to \(P(D \mid H)\) and \(P(D \mid \neg H)\) before data collection?"  
     - *Test*:  
       - Use pre-existing models, literature, or expert consensus.  
       - If no prior basis, use **skeptical defaults** (e.g., \(P(D \mid H) =\) prior predictive from \(H\), \(P(D \mid \neg H) =\) empirical null from historical data).  
     - *Sufficient answer*:  
       - **Yes** (quantifiable with low bias): Compute \(\text{BF}\). **Stop → Evidence, strength =** [weak (\(\text{BF} < 3\)), moderate (\(3 \leq \text{BF} < 10\)), strong (\(\text{BF} \geq 10\))].  
       - **No** (too subjective or data-contaminated): Proceed to Step 5.  
     - *Why*: Valid Bayes factors require unbiased priors.  

  5. **Was the hypothesis built *from* the old data?**  
     - *Ask*: "Was \(H\) constructed/tuned using \(D\)? (e.g., cherry-picked from multiple tests, parameters fit to \(D\))"  
     - *Test*: Audit workflow (e.g., GitHub history, draft reports).  
     - *Sufficient answer*:  
       - **Yes** (no independent holdout data): **Stop → No evidence. Reason**: Double-counting; \(D\) used to generate *and* test \(H\).  
       - **No** (\(H\) from external theory): Proceed to Step 6.  
     - *Why*: Data used to build \(H\) cannot also test it.  

  6. **Can we bound the Bayes factor?**  
     - *Ask*: "What are *plausible bounds* for \(P(D \mid H)\) and \(P(D \mid \neg H)\) if we ignore \(D\)?"  
     - *Test*:  
       - **Best-case \(\text{BF}\)**: Maximize \(P(D \mid H)\) (e.g., assume ideal model), minimize \(P(D \mid \neg H)\) (e.g., strict null).  
       - **Worst-case \(\text{BF}\)**: Minimize \(P(D \mid H)\) (e.g., conservative model), maximize \(P(D \mid \neg H)\) (e.g., null with noise).  
     - *Sufficient answer*:  
       - **Best-case \(\text{BF} \geq 3\)**: **Stop → Weak evidence. Reason**: Optimistic but untrustworthy reconstruction.  
       - **Best-case \(\text{BF} < 3\)**: **Stop → No evidence. Reason**: Data likely under \(\neg H\).  
       - **Unboundable** (e.g., no basis for priors): **Stop → Hand to expert panel**.  
     - *Why*: Bounding mitigates reconstruction bias.  

  ---

  ### Handling Hard Cases Explicitly  
  - **Only old data exists**: Use historical null models (Step 3) and skeptical priors (Step 6).  
  - **Analyst’s prior untrustworthy**: Default to literature or independent experts (Step 4/6).  
  - **Vague hypothesis dressed precisely**: Reject at Step 3 (fails riskiness test).  
  - **Where judgment is dressed as procedure**: Steps 4 and 6 rely on subjective reconstruction but use auditing (timestamps, preregistration) and bounding to limit bias.  
  - **Where the procedure misfires**:  
    - Fails if \(H\) is untestable or \(D\) is irrelevant.  
    - Overly harsh on novel hypotheses without prior literature (Step 4).  
    - Underestimates evidence if bounding is too conservative (Step 6).  
  - **What it cannot do**:  
    - Prove causality or truth.  
    - Replace decision theory (e.g., acting on \(H\) requires cost-benefit analysis).  
    - Resolve hypotheses built *with* data in view without independent verification.  

  ---

  ### Case Applications  
  **Case 1: Internal analyst’s data-dredged causal claim**  
  - Step 1: **No** → Step 5.  
  - Step 5: **Yes** (hypothesis built from hundreds of tests) → **Stop → No evidence. Reason**: Double-counting; \(D\) generated \(H\).  
  - *Output*: **No evidence**. Proposing analyst will dislike this, but the procedure flags double-counting.  

  **Case 2: Modeler’s pre-registered prediction from transmission model**  
  - Step 1: **Yes** (model pre-existed data check) → Step 2.  
  - Step 2: **Yes** (prediction derived pre-analysis) → Step 3.  
  - Step 3: **Yes** (prediction specific/risky; e.g., \(P(D \mid \neg H) \approx 0.01\)) → Step 4.  
  - Step 4: **Yes** (model-based \(P(D \mid H)\) and \(P(D \mid \neg H)\) computable) → \(\text{BF} = 25\) → **Stop → Evidence, strength = strong**.  
  - *Output*: **Strong evidence**. Validated by risky prediction.  

  **Case 3 (Mixed): Hypothesis built from data but makes one risky prediction**  
  *Scenario*: Analyst notices spike in region A during festival F (2020), formulates \(H\): "F causes spikes," and predicts a similar spike in region B (2021) using the same dataset.  
  - Step 1: **No** (hypothesis after seeing 2020 data) → Step 5.  
  - Step 5: **Yes** (\(H\) built from 2020 data) → **But**, there is a "holdout" (2021 data).  
    - *Test holdout*: Re-run procedure on 2021 data only:  
      - Step 1: **No** (2021 data existed when \(H\) was made) → Step 5 → **Yes** (no true holdout; 2021 data may have influenced \(H\)) → Step 6.  
      - Step 6: Bounding fails (no basis for priors) → **Hand to expert panel**.  
  - *Output*: **Hand to expert panel**. Reason: No clean separation of data for building vs. testing \(H\); reconstruction untrustworthy.  

  ---

  **Final Answer**  
  \answer{The procedure audits hypothesis timing, analysis pre-specification, prediction risk, and prior reconstructability to assign evidential strength to old data for new claims, flagging double-counting or handing ambiguous cases to experts.}
