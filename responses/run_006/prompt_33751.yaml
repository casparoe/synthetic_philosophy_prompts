  Practical implications? If pragmatic encroachment is true, knowledge isn't purely epistemic; practical stakes affect its truth. That could impact norms of assertion or action. Contextualism keeps knowledge purely epistemic but varies the semantic standards. So for philosophy, it affects how we define knowledge's nature.

