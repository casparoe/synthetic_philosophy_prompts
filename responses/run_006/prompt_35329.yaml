  I should also address whether each interpretation is defensible independently. The radical view might be criticized for ignoring systemic issues, while the moderate one balances agency and constraints. The weakest is defensible but not relevant to social theory debates. The user needs to show that the classmate's argument requires dismissing facticity, which Sartre doesn't do.

