  The user raises important complications: third parties like high command ordering raids, rotation schedules disrupting continuity, and how cooperation differs when motivated by mutual benefit versus fear of reprisal. They also wonder why, despite cooperation emerging, the war continued for four years. This ties into the broader question of whether this case confirms game theory or shows its limitations.

