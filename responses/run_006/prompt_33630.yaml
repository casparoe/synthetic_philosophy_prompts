answer: |-
  ### Decision Procedure for Copy Review

  Here's a step-by-step decision procedure to evaluate app copy for ethical concerns. Aim to complete within 15 minutes per piece of copy. Use your product knowledge and common sense—no philosophy degree needed.

  ---

  #### **Procedure Steps**  
  *(Stop early if you hit a verdict)*

  1. **LITERAL TRUTH CHECK**  
     **Question:** Is the statement **factually false**?  
     - *Yes* → **Verdict: LIE**  
       *Recommendation: FLAG for rewrite (non-negotiable)*  
     - *No* → Proceed to Step 2.  
     *Why?* A lie is always unethical. Legal may miss technically-true deceptions.  

  2. **USER INFERENCE TEST**  
     **Question:** Would a **reasonable user** (busy, non-expert) infer something **false** from this?  
     - *Yes* → Proceed to Step 3.  
     - *No* → **Verdict: CLEAN**  
       *Recommendation: DON’T CARE (approve as-is)*  
     *Why?* Misleading hinges on likely interpretation, not literal meaning.  

  3. **OMISSION ASSESSMENT**  
     **Question:** Is a **critical fact omitted** that would change the user’s understanding?  
     - *No* → **Verdict: CLEAN**  
       *Recommendation: DON’T CARE*  
     - *Yes* → Proceed to Step 4.  
     *Why?* Omissions cause "misleading but not lying" if the gap creates false beliefs.  

  4. **HARM POTENTIAL**  
     **Question:** Could the false inference cause **material harm**?  
     - *Yes* → **Verdict: MISLEADING BUT NOT A LIE**  
       *Recommendation: REWRITE*  
     - *No* → **Verdict: MISLEADING BUT NOT A LIE**  
       *Recommendation: DON’T CARE (low risk)*  
     - *Unsure* → **Handoff to human** (product/legal).  
     *Why?* Harm includes financial loss, privacy violations, or eroded trust.  

  ---

  #### **Key Notes**  
  - **Philosophy Translation**:  
    - "Lying" = saying something false.  
    - "Misleading" = implying something false (via omission/context).  
    - Intent matters less than real-world impact.  
  - **Edge Cases**:  
    - If harm is ambiguous (e.g., minor inconveniences), hand off to humans.  
    - Industry norms ≠ ethical justification.  
  - **Misfires**:  
    - Overly cautious on minor issues (e.g., trivial features).  
    - Under-cautious if you assume users "should know" something.  

  ---

  ### Application to Your Cases  
  #### **Case 1: Push Notification**  
  *Copy: "Your free trial ends in 2 days — subscribe to keep budgeting."*  
  - **Step 1 (Literal Truth)**: True (trial ends; subscription enables editing).  
  - **Step 2 (User Inference)**: Reasonable user infers "app becomes unusable," not "read-only mode exists." → *False inference*.  
  - **Step 3 (Omission)**: Critical fact omitted (read-only remains available).  
  - **Step 4 (Harm)**: Harm likely (user may panic-subscribe to avoid data loss).  
  **Verdict**: **MISLEADING BUT NOT A LIE**  
  **Recommendation**: **REWRITE**  
  *Rewrite Suggestion*:  
  > "Your free trial ends in 2 days — subscribe to edit budgets. Your data stays viewable for free."  

  ---

  #### **Case 2: Settings Screen**  
  *Copy: "We never sell your data."*  
  - **Step 1 (Literal Truth)**: Literally false (payment for data sharing = "selling" in user context).  
  **Verdict**: **LIE**  
  **Recommendation**: **FLAG for rewrite**  
  *Rewrite Suggestion*:  
  > "We share data with partners under contracts. Read more in our Privacy Policy."  
  *Why?* "Sell" isn’t a legal term here—users equate payment with selling.  

  ---

  #### **Case 3: Referral Prompt**  
  *Copy: "Invite friends and you’ll both get $10."*  
  - **Step 1 (Literal Truth)**: Literally false (friend gets $10 **off**, not $10 cash/credit).  
  **Verdict**: **LIE**  
  **Recommendation**: **FLAG for rewrite**  
  *Rewrite Suggestion*:  
  > "Invite friends to get $10 credit. They get $10 off their first month."  

  ---

  ### How the Procedure Earns Its Keep  
  For contrast, here’s a **clean case** that would pass:  
  *Hypothetical Push Notification*: "Your dining budget is 90% used. Tap to adjust."  
  - **Step 1**: True (factual).  
  - **Step 2**: User infers "I’ve nearly spent my dining budget" → **correct**.  
  - **Steps 3–4**: No omissions/harm.  
  **Verdict**: **CLEAN** → Approved.  

  ### When to Hand Off  
  - **Step 4 (Harm Potential)**: If harm is debatable (e.g., "dark pattern" UI that’s industry-standard but sketchy).  
  - **Ambiguity**: If "reasonable user" interpretation is unclear (e.g., niche features).  

  This procedure prioritizes **user trust** while respecting your time. It flags 95% of issues and explicitly calls out when humans should debate values.
