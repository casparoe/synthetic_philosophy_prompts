          - Is the copy using language that is known to be ambiguous in a way that benefits the company and harms the user?
      - But note: We are not mind readers. We can look at:
          - The context of where the copy appears (e.g., a push notification for urgency, a setting that should be clear).
          - The known facts about the product (e.g., what the feature actually does).
      - If we have strong evidence of intent to deceive (e.g., the omission is in a context where the user would be harmed and the company gains, and the crucial fact is hidden), then we can call it "misleading but not a lie" and recommend rewrite. But note: this step might be too subjective? Let's reframe.

      Instead, we can skip intent and go to:

   2. **Reasonable User Interpretation** (This is the key for misleading)
      - Question: What would a reasonable user infer from this statement in the context it is presented?
      - How to test: Imagine an average user (not a lawyer, not overly skeptical, but not naive) reading the statement. What would they believe?
      - Compare that inferred belief with the actual facts.
          - If the inferred belief is false, then the statement is misleading.
      - However, we must consider the context. For example, in a push notification, the user may be in a hurry and not think deeply.

