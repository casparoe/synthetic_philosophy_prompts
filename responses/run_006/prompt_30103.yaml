prompt: |-
  I've been going through a bunch of Bongard problems lately—the ones where six boxes on the left and six on the right are supposed to differ by a single rule, and you have to name it. What's striking is how uneven they are: some are obvious in under a second, and others stay opaque no matter how long you look, even though the drawings themselves are simple. The usual story people give is that the hard ones are "abstract" or that the rule is "unexpected," but that mostly relabels the phenomenon. I want to understand it at the level of concept induction from a few examples: what does a solver actually have to do to get from a dozen little drawings to the right generalization, and why does that go wrong so sharply?

  I'd expecially like you to explain the relationship between the space of candidate rules (which is enormous), the way the examples carve that space into equivalence classes, and the level of description at which the rule happens to be statable. In particular: is the hard part mainly a search problem, a representational problem, or a problem about knowing which level of abstraction to try? And why do some Bongard problems stay hard even when you add more examples, while a single re-description of the examples you already had can make the rule obvious? Please also say where your account is most likely to break: what kind of evidence or consideration would make you revise the story you're giving, and which step in the account is the least secure.
