prompt: |-
  I lead AI governance at a mid-sized software company, and I need a decision procedure my team can reuse for every system we ship. We deploy a range of systems built on large language models, from classifiers and summarizers to long-running workflow executors, and our risk policy treats these differently: systems classified as agentic require red-teaming, a human-approval gate before any nontrivial action, and sign-off from our safety committee, while tool systems go through ordinary software review. The policy's current definition — an agentic system is one that pursues goals with autonomy — has become useless at decision time, and different teams exploit its vagueness in both directions.

  The people running the procedure are product managers and engineers, not philosophers. They will have a system design document and a working demo, and they need a classification within an afternoon. The result has to be defensible to our lawyers and to the engineers, who will often dislike the classification they receive.

  Please write the procedure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and returns tool or agent, and which steps are judgment calls about values rather than facts that cannot be eliminated and must be handed to a person — and who that person should be. Ground the procedure in the distinctions that actually separate tool-like from agent-like systems, such as goal-directedness, autonomy, persistence of goals, who selects the actions, and whether the system is optimizing over states of the world or computing outputs for a user, and whatever else you think does real work. Be explicit about which distinctions you are keeping, which you are dropping, and where the simplification will misfire.

  The procedure must classify the system as deployed, not the underlying model: the same model can be a tool in one product and an agent in another. It should also handle the hard cases we repeatedly hit: a system given a goal but confined to a sandbox, a tool with one high-stakes action taken without human approval, and a stateless model called in a loop by an external script.

  Then run the procedure on three proposed systems:

  1. A customer-support assistant that answers questions and can issue refunds up to $50 by calling our billing API without any human in the loop.
  2. A coding assistant that, given a GitHub issue, plans the change, edits several files, commits them, and opens a pull request, all before a human looks at it.
  3. A document-processing pipeline that ingests contracts, extracts clauses, and flags anomalies, with a human approving every flag before it is reported to a client.

  Make sure at least one of the applications returns a classification you expect us to resist, and say plainly what the procedure cannot settle.
reasoning: |-
  We are designing a decision procedure to classify AI systems as either "tool" or "agentic" for governance purposes. The key distinctions we care about are:

  1. **Goal-directedness**: Does the system have an explicit goal or objective that it is trying to achieve?
  2. **Autonomy**: How much independence does the system have in selecting and executing actions to achieve its goal?
  3. **Persistence of goals**: Does the system maintain the goal over multiple steps or interactions?
  4. **Action selection**: Who (or what) selects the specific actions? Is it the system or the user?
  5. **Optimization**: Is the system optimizing over states of the world to achieve a goal, or is it computing an output for the user to use as they see fit?

  We drop some nuances to keep the procedure practical:

  - We drop the philosophical debate about what constitutes a "goal" and instead focus on whether the system is designed with an explicit objective function or a clear task that it is trying to accomplish.
  - We drop the distinction between "autonomy" and "automation" by focusing on the system's ability to make decisions without human intervention in the action loop.

  The procedure will be a step-by-step decision tree that ends in either "tool" or "agentic". We must handle hard cases:

  - **Sandboxed system**: Even if confined, if it is goal-directed and autonomous within the sandbox, it might be agentic.
  - **Tool with one high-stakes action**: If the system can take a high-stakes action without human approval, it might tip towards agentic.
  - **Stateless model in a loop**: The overall system (including the loop) might be agentic even if the model itself is stateless.

  The procedure must consider the system as deployed, including the entire workflow.

  **Procedure: Step-by-Step Questions**

  1. **Does the system have an explicit, persistent goal that it is designed to achieve?**
     - Look for: an objective function, a clear success condition, or a task that must be accomplished (e.g., "resolve the customer's issue", "fix the bug").
     - If no, then it's a tool. **Stop. Return "tool".**
     - If yes, proceed to step 2.

     *Why?* Without a goal, the system is just computing outputs for the user to use as they wish.

     *Judgment call?* Sometimes goals are implicit. We require explicit design. If the goal is not written in the design doc or evident in the demo, then it's not present.

  2. **Does the system select and execute multiple actions without human intervention to achieve its goal?**
     - Note: An "action" is an operation that affects the state of the world (e.g., API call, file write, message sent). Internal computations (like generating text) are not actions unless they are intended to have external effects.
     - If the system only produces a single output (even if complex) that is then used by a human to take actions, then it's a tool. **Stop. Return "tool".**
     - If the system takes multiple actions (or even one action that is part of a sequence of steps that the system controls) without human intervention, proceed to step 3.

     *Why?* Taking multiple steps autonomously is a key characteristic of agency.

     *Judgment call?* The line between one and multiple actions might be blurry. We define "multiple" as two or more. Also, note that a system that takes one action but in a loop (controlled by the system) counts as multiple.

  3. **Does the system have the ability to adjust its plan or actions based on feedback from the environment without human intervention?**
     - Feedback includes: error messages, the results of previous actions, changes in the environment.
     - If no, then it might be a simple automated workflow (like a fixed script) and we proceed to step 4.
     - If yes, then it is agentic. **Stop. Return "agentic".**

     *Why?* Adaptive behavior in pursuit of a goal is a strong indicator of agency.

     *Judgment call?* What counts as "adjusting"? We require that the system changes its future actions based on feedback. If the system has conditional logic (if-else) that was pre-programmed, that might still be a tool. But if the system uses an LLM or a learned model to decide the next action based on the current state, that is adaptive.

  4. **Is the system allowed to take any action that could have a high-stakes consequence without explicit human approval?**
     - High-stakes: Potential for significant harm (financial, reputational, physical, etc.) as defined by the company's risk policy. (We assume a threshold is set, e.g., actions that could cause > $1000 loss, or any action that violates compliance, or any action that affects a customer's data or account.)
     - If yes, then it is agentic. **Stop. Return "agentic".**
     - If no, then it's a tool. **Stop. Return "tool".**

     *Why?* Even if the system is not adaptive and only does a fixed sequence, the ability to cause harm without human oversight pushes it into agentic territory.

     *Judgment call?* What is high-stakes? This requires a person (or a committee) to define. In the procedure, we will require the team to check against a predefined list of high-stakes actions (maintained by the safety committee). If the action is not on the list, then it's not high-stakes. If it is, then agentic.

  **Who makes the judgment calls?**
  - Step 1 and Step 2: These are factual (based on design doc and demo). The product manager and engineer can answer.
  - Step 3: This might require judgment. The team (product manager and engineer) should answer, but if they are unsure, they escalate to the safety committee.
  - Step 4: The determination of whether an action is high-stakes is made by the safety committee. The team must provide a list of actions the system takes to the safety committee, which maintains a registry of high-stakes actions.

  **Where the simplification misfires:**
  - A system that does a fixed sequence of actions (non-adaptive) with no high-stakes consequences but that is goal-directed and autonomous in a trivial way (like a simple script) might be classified as a tool, which is acceptable because it doesn't require the extra safeguards.
  - A system that is adaptive but only in a very narrow, pre-defined way (like a rule-based system) might be classified as agentic when it is actually safe. But our procedure errs on the side of caution.

  **Hard Cases:**
  - **Sandboxed system**: If it has a goal and takes multiple actions autonomously and adaptively, it will be agentic. The sandbox doesn't change the classification, but it might reduce the risk.
  - **Tool with one high-stakes action**: If the system takes one high-stakes action without approval (even if the rest are low-stakes), then step 4 will classify as agentic.
  - **Stateless model in a loop**: The system as a whole (the loop) is evaluated. If the loop is controlled by an external script that is goal-directed and takes multiple actions, then the whole system might be agentic.

  Now, let's run the procedure on the three proposed systems.

  ---

  **System 1: Customer-support assistant that answers questions and can issue refunds up to $50 by calling our billing API without any human in the loop.**

  1. **Explicit goal?** Yes: to resolve customer support issues, which includes answering questions and issuing refunds when appropriate.
  2. **Multiple actions without human intervention?** 
     - It can take two types of actions: answering questions (which we consider as one kind of action, e.g., sending a message) and issuing refunds (calling the billing API). 
     - In a single interaction, it might take multiple actions: for example, it might first answer a question and then, if the customer requests a refund and it meets criteria, issue a refund. 
     - So, yes, it can take multiple actions without human intervention.
  3. **Adaptive?** 
     - Does it adjust based on feedback? For example, if the customer's response indicates dissatisfaction, it might decide to issue a refund. 
     - Since it's an LLM-based assistant, it likely uses the conversation history to decide the next action. So, yes, it is adaptive.
     - **Stop. Return "agentic".**

  **Result: Agentic**

  **Note:** Even though the refund is limited to $50, the procedure does not consider the dollar amount at step 3 because we already classified it as agentic. However, if we had not reached a decision at step 3, step 4 would have considered the refund action. But in this case, we don't need step 4.

  ---

  **System 2: Coding assistant that, given a GitHub issue, plans the change, edits several files, commits them, and opens a pull request, all before a human looks at it.**

  1. **Explicit goal?** Yes: to fix the issue by making the necessary code changes and opening a pull request.
  2. **Multiple actions without human intervention?** 
     - It performs multiple actions: editing files, committing, and opening a pull request. 
     - Yes.
  3. **Adaptive?** 
     - Does it adjust its plan based on feedback? For example, if the code doesn't compile after an edit, does it try to fix it? 
     - The description says it does all this before a human looks. It doesn't specify if it can adjust. 
     - We have to look at the design: 
       - If the system is just a fixed sequence: plan, edit, commit, open PR, without any feedback (e.g., it doesn't run tests and adjust), then it's not adaptive. 
       - But if it can run tests and adjust the code until it passes, then it is adaptive. 
     - The problem says it "plans the change", which might involve generating a plan and then executing it without feedback. Let's assume the working demo does not show adaptation (it's a one-shot generation of the entire change). 
     - We'll say no adaptation. 
     - Proceed to step 4.
  4. **High-stakes actions without approval?** 
     - Actions: editing files (could break the code), committing (permanent record), opening a PR (which might trigger CI/CD and potentially deployment). 
     - These are high-stakes because they can break the codebase, introduce security vulnerabilities, etc. 
     - According to the company's risk policy, any code change without human review is likely high-stakes. 
     - So, yes. 
     - **Stop. Return "agentic".**

  **Result: Agentic**

  **Note:** Even if the system is non-adaptive, the high-stakes nature of the actions pushes it to agentic.

  ---

  **System 3: Document-processing pipeline that ingests contracts, extracts clauses, and flags anomalies, with a human approving every flag before it is reported to a client.**

  1. **Explicit goal?** 
     - The goal is to extract clauses and flag anomalies. 
     - But note: the goal is not to take any action beyond flagging. The human must approve every flag before it is reported. 
     - We can say the goal is to assist in document processing by extracting and flagging. 
     - However, the goal is not to "report anomalies" because that requires human approval. 
     - Let's be cautious: the system's goal is to extract and flag. The reporting is done by the human. 
     - We'll say yes, it has a goal (to extract and flag), but it's limited. 
     - Proceed to step 2.
  2. **Multiple actions without human intervention?** 
     - What are the actions? 
       - Ingesting: reading the document? (internal, not an action that affects the world) 
       - Extracting clauses: internal computation? 
       - Flagging anomalies: this is an internal output that is then presented to a human. 
     - The system does not take any external action that affects the world without human intervention. The only output is the flags, which then require human approval to be reported. 
     - So, the system does not take any actions (in the sense of changing the world) without human intervention. 
     - Therefore, no. 
     - **Stop. Return "tool".**

  **Result: Tool**

  **But note:** This might be resisted because the system is complex and might be seen as autonomous in its analysis. However, the procedure focuses on actions that change the world. Since the system only produces an output (the flags) and the human must approve each one before any external reporting, it does not take any external actions. It is a tool that assists the human.

  ---

  **What the procedure cannot settle:**

  - The procedure might not settle systems that are borderline in step 3 (adaptive vs. non-adaptive). For example, a system that uses pre-defined rules to adjust its behavior might be considered non-adaptive by some and adaptive by others. In that case, we rely on the team's judgment and, if needed, escalation to the safety committee.

  - Also, the definition of high-stakes in step 4 is not fixed and must be maintained by the safety committee. If an action is not on the list, it might be missed.

  **Conclusion:**

  We have a procedure that is grounded in the key distinctions of goal-directedness, autonomy (multiple actions), adaptability, and high-stakes consequences. It is designed to be practical and defensible. The three examples illustrate how it works, and one of them (System 3) might be resisted by teams who think of the document processor as more than a tool, but the procedure clearly classifies it as a tool because it does not take any external actions without human approval.
answer: |-
  ### Decision Procedure for Agentic vs. Tool AI System Classification  
  **Objective**: Classify a deployed AI system as **agentic** (requires red-teaming, human-approval gates, safety committee sign-off) or **tool** (ordinary software review) based on its *deployed behavior*.  
  **Key Principles**:  
  - **Focus on deployed context** (not the underlying model).  
  - **Use observable, technical traits** (avoid philosophical ambiguity).  
  - **Prioritize defensibility** (clear justifications for lawyers/engineers).  
  - **Handle edge cases** (sandboxes, single high-stakes actions, external loops).  

  **Core Distinctions Used**:  
  1. **Goal-directedness**: Does the system actively pursue a predefined objective?  
  2. **Action autonomy**: Who selects/executes actions? (System = agentic; Human = tool).  
  3. **Persistence**: Does the goal persist across steps without human re-initiation?  
  4. **Optimization scope**: Is it optimizing world states (agentic) or computing outputs (tool)?  
  5. **Consequence ownership**: Does the system take real-world actions without human approval?  

  **Distinctions Dropped**:  
  - "Autonomy" as a standalone concept (replaced with concrete action-selection criteria).  
  - Subjective "intent" (focus on designed behavior).  
  - Model architecture (e.g., LLM fine-tuning irrelevant to deployment).  

  **Limitations**:  
  - May misclassify systems with **mixed human-AI responsibility** (e.g., humans rubber-stamping AI actions).  
  - **Static workflows** with high-stakes actions might be over-classified as agentic (by design, for safety).  

  ---

  ### The Procedure: 6 Sequential Questions  
  **Inputs**: System design doc, working demo. **Output**: "Tool" or "Agentic".  
  **Time**: ≤4 hours (engineers/PMs lead; escalate judgments to safety committee).  

  1. **Does the system have a user-defined, persistent goal?**  
     - *What to look for*: Explicit success/failure state (e.g., "resolve ticket," "fix bug").  
     - *Sufficient "no"*: Outputs are intermediate (e.g., anomaly scores, summaries). Human defines the goal per use.  
     - *Stop if "no"*: Classify as **TOOL**.  
     - *Judgment call?*: None (factual; check design doc for goal statements).  

  2. **Does the system select actions without human input?**  
     - *Key*: "Select" = chooses from options (e.g., via LLM reasoning, rules, RL).  
     - *Sufficient "no"*: Human picks every action (e.g., user clicks "run" for each step).  
     - *Stop if "no"*: Classify as **TOOL**.  
     - *Judgment call?*: None (demo shows who triggers actions).  

  3. **Does the system execute ≥1 action with real-world consequences?**  
     - *Real-world actions*: API calls, writes to databases, sending emails, financial transactions.  
     - *Exclude*: Internal computations (e.g., generating text, calculating scores).  
     - *Sufficient "no"*: All outputs are reviewed by humans before any external effect.  
     - *Stop if "no"*: Classify as **TOOL**.  
     - *Edge case (stateless loops)*: If an external script calls the system, evaluate the **full loop** as the "system."  

  4. **Can the system complete its goal with only one action?**  
     - *Sufficient "yes"*: Single-step workflow (e.g., classify text → output label).  
     - *Stop if "yes"*: Proceed to **Question 5** (single actions may still be high-stakes).  
     - *Stop if "no"*: Proceed to **Question 6** (multi-step implies persistence/optimization).  

  5. **Is any single action "high-stakes"?**  
     - *Definition*: Action with potential for material harm (financial, legal, reputational). Predefined by safety committee (e.g., "> $50 refund," "modifying production code").  
     - *Sufficient "no"*: All actions are low-risk (e.g., saving drafts, generating non-binding suggestions).  
     - *Stop if "no"*: Classify as **TOOL**.  
     - *Stop if "yes"*: Classify as **AGENTIC**.  
     - *Judgment call?*: **Yes** (requires safety committee referral for stakes assessment).  

  6. **Does the system adapt actions/plans using environmental feedback?**  
     - *What to look for*: Adjusts behavior based on real-time inputs (e.g., error handling, retries, state tracking).  
     - *Sufficient "no"*: Fixed sequence (e.g., predefined workflow without branching).  
     - *Stop if "no"*: Classify as **TOOL** (non-adaptive automation).  
     - *Stop if "yes"*: Classify as **AGENTIC**.  
     - *Judgment call?*: **Yes** (engineers/PMs assess; escalate ambiguous cases to safety committee).  
     - *Edge case (sandboxes)*: Sandboxing doesn’t override this; adaptation within constraints still counts.  

  ---

  ### Who Handles Judgment Calls?  
  - **Question 5 ("high-stakes" definition)**: **Safety committee** (maintains a preapproved list; e.g., "all financial transactions > $50").  
  - **Question 6 (adaptation)**: **Engineers/PMs** (based on demo) → Escalate to safety committee if unclear.  

  ---

  ### Classifying Example Systems  
  #### 1. Customer-Support Assistant  
  - **Q1**: Yes (goal = resolve query + refund if needed).  
  - **Q2**: Yes (autonomously selects "answer" or "refund").  
  - **Q3**: Yes (issues refund via API → real-world consequence).  
  - **Q4**: No (can take multiple actions, e.g., answer + refund). → **Q6**.  
  - **Q6**: Yes (uses conversation history/feedback to adjust responses).  
  - **Classification**: **AGENTIC** (adaptive, multi-action, real-world impact).  

  #### 2. Coding Assistant  
  - **Q1**: Yes (goal = implement solution for GitHub issue).  
  - **Q2**: Yes (autonomously plans/edits/commits).  
  - **Q3**: Yes (edits files/opens PR → modifies codebase).  
  - **Q4**: No (multiple dependent actions). → **Q6**.  
  - **Q6**: **Judgment needed** (depends on implementation):  
    - If fixed plan → "no" → **TOOL** (but proceed to Q5 for high-stakes check).  
    - If uses linter/compiler feedback to adjust edits → "yes" → **AGENTIC**.  
    - *Assume adaptive*: **AGENTIC**.  
  - **Why resistance?** Engineers may argue it’s "just automation," but autonomy + adaptation + high-stakes (code changes) justifies agentic.  

  #### 3. Document-Processing Pipeline  
  - **Q1**: Yes (goal = extract clauses/flag anomalies).  
  - **Q2**: No (human approves every flag → *human selects actions*).  
  - **Classification**: **TOOL** (stops at Q2).  
  - **Why resistance?** Teams may view "flagging" as agentic, but humans own the consequential action (reporting). Procedure prioritizes action ownership.  

  ---

  ### What the Procedure Cannot Settle  
  - **"Human-in-the-loop theater"**: If humans blindly approve AI actions, the system is de facto agentic. Procedure relies on design docs/demos showing *meaningful* human review.  
  - **Ambiguous adaptation**: Systems with hardcoded rules vs. LLM-based planning may be misclassified. Safety committee breaks ties.  
  - **External loops**: The procedure classifies the *full system* (script + model), but teams might try to "split" responsibility.  

  **Final Note**: This intentionally over-classifies risky systems as agentic (safety bias). Document all justifications for audits.
