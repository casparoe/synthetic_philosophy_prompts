  Qualia don't map at all. The user wonders if CS vocabulary is too limited or if functionalism is incomplete. Here, I should explain that functionalism handles structure, not subjective experience. The gap might be functionalism's limitation, not CS's poverty—pointing to theories like property dualism. 

