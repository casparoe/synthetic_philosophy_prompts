prompt: |-
  I'm a grad student TA-ing for an undergrad moral philosophy course, and next week I have to lead a fifty-minute discussion section on the idea that hypocrisy undermines your standing to blame. The professor covered it in lecture but the students were visibly confused — they kept saying things like "but if what the hypocrite says is true, why can't they say it?" I need to un-confuse them and actually get the philosophical point to land.

  Don't explain the topic to me — I know the literature. What I need is a teaching plan: what has to go first in the section, what example should carry the whole thing (and what the example needs to have and not have), what misconceptions they'll bring in or form along the way and exactly where I should head each one off, and one question I can ask at the end to check whether they actually got it rather than just nodding along. I'm especially worried they'll conflate "lacking standing" with "being wrong" or "being a bad person," and I'm not sure how to sequence things so the distinction between the truth of the blame and the standing to issue it feels unavoidable rather than like a technicality. Also, when you lay out the plan, please flag which parts of the standing-to-blame debate are basically settled among people working on it and which parts are genuinely contested — I don't want to accidentally present one contested view as if it's the consensus and have the professor give me a look.
reasoning: |-
  Okay, the user is a grad student TA preparing for a discussion section on how hypocrisy undermines standing to blame. They need a teaching plan because undergrads got confused during the lecture. The main confusion was students focusing on the truth of the hypocrite's statement rather than the speaker's standing. 

  First, I need to unpack the core challenge: students are conflating the truth of the blame with the right to deliver it. The TA mentioned students kept saying, "If it's true, why can't they say it?" So the plan must make the standing vs. truth distinction unavoidable, not just a technicality. 

  The TA also wants to avoid presenting contested views as consensus. I recall that the basic hypocrisy principle is widely accepted—hypocrisy undermines standing—but the reasons why and possible exceptions (like reform) are debated. Wallace, Coates, and Todd are key authors here. 

  For the teaching plan, a strong central example is crucial. It needs to be relatable, show clear hypocrisy, and have the blame be true. The roommate example seems good: someone who never does dishes complains about a mess. This makes the truth undeniable (the mess is real) but the speaker lacks standing. 

  I should structure the discussion to start by validating their intuition (truth matters) before challenging it. Step 1: Get them to agree the blame is true. Step 2: Reveal hypocrisy and ask if it's harder to take the blame seriously. Then introduce the philosophical distinction: truth is one thing, standing is another. 

  Potential misconceptions to address: 
  - Lacking standing doesn't mean the blame is false. 
  - It's not about being a bad person; even reformed hypocrites might lack standing. 
  - The issue is about authority to blame, not the content. 

  The check question at the end should force them to apply the distinction. Something like: "If a reformed smoker blames someone for smoking, do they have standing?" This tests if they grasp that reform might restore standing—a contested point—without requiring a right answer. 

  Timing is tight: 50 minutes. I'll allocate time for each segment, keeping the example central. Wrap-up should clarify settled vs. debated points: hypocrisy removes standing (settled), why and how reform affects it (debated). 

  The TA's anxiety about the professor's "look" means I must flag contested areas clearly. Highlight that Wallace's authority view is dominant but Coates's assurance view offers alternatives, and Todd's objections are active debates. 

  Overall, the plan should flow from intuition to theory, using the example to force cognitive dissonance, then resolve it with the standing/truth distinction. The check question then probes deeper understanding.
answer: |-
  Here's a battle-tested teaching plan designed to shatter the "truth trumps all" misconception and make the standing/truth distinction land, while flagging the scholarly fault lines:

  **Core Objective:** Students will articulate *why* a hypocrite might lack the *standing* to blame, even when their *judgment is true*, distinguishing standing from both moral wrongness and epistemic correctness.

  **The Anchor Example: "Roommate Dishes"** (Needs to be simple, relatable, and undeniable in its hypocrisy & truth)
  *   **Scenario:** Alex and Taylor are roommates. For weeks, Alex leaves dirty dishes piled high in the sink, ignoring Taylor's requests. Taylor always cleans them eventually, grumbling. One day, *Taylor* leaves *one* bowl in the sink overnight. The next morning, **Alex** storms out of their room, points at the bowl, and angrily blames Taylor: "This is disgusting! You're so lazy and inconsiderate! Clean this up NOW!"
  *   **Why it works:**
      *   **Clear Hypocrisy:** Alex's own consistent behavior is far worse.
      *   **Undeniable Truth:** Taylor *did* leave a dish out. Leaving dirty dishes *is* inconsiderate to a roommate. The *content* of Alex's blame is accurate.
      *   **Intuitive Reaction:** Students *feel* Alex's blame is illegitimate/unfair/hard to take seriously, *despite* the truth.
      *   **Avoids Distractions:** No complex motives, no ambiguity about facts, no historical oppression dynamics (save those for advanced discussions).

  **50-Minute Plan (Sequenced for Conceptual Unpacking & Misconception Busting):**

  1.  **Grounding & Validating Intuition (10 mins):**
      *   **Question 1:** "In the 'Roommate Dishes' scenario, *is* Taylor's single dirty bowl wrong? Is Alex's *judgment* about the mess and the inconsiderateness *correct*?" (Target: Establish **Truth** - they'll say "Yes". Affirm this is crucial).
      *   **Question 2:** "Is Alex's *act of blaming* Taylor for it problematic? Why? What feels 'off'?" (Target: Elicit **Hypocrisy** & **Intuitive Illegitimacy** - "Alex does it way more!", "It's unfair", "Alex has no right", "It's rich coming from them").
      *   ***Head Off Misconception #1 Here:*** Reiterate clearly: "So, we all agree Alex's *judgment* seems *true*, BUT Alex's *act of delivering the blame* feels deeply problematic, unfair, or illegitimate. That feeling is key. We're not saying Alex is *wrong* about the dishes being bad, we're saying Alex might not be the *right person* to deliver that blame."

  2.  **Introducing the Philosophical Distinction (5 mins):**
      *   "Philosophers capture this difference with two concepts:"
          *   **The Truth/Correctness of the Blame (Judgment):** Is the *content* of the blame accurate? Is the blamed act *actually wrong*? (Settled: Truth is necessary *for* blame to be justified, but not *sufficient* for *issuing* it legitimately).
          *   **Standing to Blame:** Does the blamer have the *authority*, *right*, or *proper position* to *issue* this blame *to this person*? Is the blamer a *suitable voice* for this moral demand? (This is our focus).
      *   **Analogy (Optional but helpful):** "Imagine a traffic cop. They need *proof* a law was broken (truth/correctness). BUT, if the cop *themselves* was speeding wildly just moments before pulling you over, their *standing* to give *you* the ticket feels compromised, even if you *were* speeding."

  3.  **Why Hypocrisy Undermines Standing (Using the Example) (15 mins):**
      *   **Question 3:** "*Why* does Alex's hypocrisy make Alex a bad person to deliver this blame to Taylor? What specifically is damaged?" (Target: Elicit core reasons - avoid letting them jump to "Alex is a bad person").
      *   **Guide Discussion Towards:**
          *   **Fairness/Complicity (Wallace-esque):** Alex hasn't held *themself* to the same standard they demand of Taylor. Blaming Taylor while doing worse makes Alex complicit in the very norm violation they're condemning. It's unfair to demand purity from others when you're impure. (Settled Core: Hypocrisy *typically* undermines standing via unfairness/complicity).
          *   **Lack of Moral Authority/Credibility:** Taylor can rightly say, "Who are *you* to lecture *me* about this?" Alex's own actions destroy their credibility as an enforcer of this norm. (Settled Core: Hypocrisy damages the blamer's perceived authority on *this specific issue*).
      *   ***Head Off Misconception #2:*** Explicitly state: "Notice it's NOT primarily that Alex is a 'bad person' *in general*. Alex might volunteer at a soup kitchen! It's specifically that Alex lacks standing *on this issue* (dish cleanliness) *with Taylor* because of Alex's *own* relevant behavior. Standing is often *issue-specific* and *relationship-contextual*."
      *   ***Head Off Misconception #3:*** Reiterate: "Crucially, Taylor *still* did something wrong! The *wrongness of Taylor's act* doesn't disappear. But *Alex* might not be the right person to point it out *in this way*."

  4.  **Testing Boundaries & Introducing Contestation (15 mins):**
      *   **Question 4 (Reform):** "What if Alex had a genuine conversion? Suppose Alex sincerely apologized for past dish sins, started diligently doing their dishes for a month, and *then* found Taylor's bowl. Would Alex now have standing to blame Taylor? Why or why not?" (Target: **Contested Area**! This is the heart of much debate - Todd vs. Coates/Wallace).
          *   *Possible Answers:* "Yes, they've cleaned up their act!" (Supports reform restoring standing - Coates/Wallace). "No, the past hypocrisy still taints them" or "Maybe, but it depends on Taylor's acceptance" (Highlights lingering issues - Todd). **Flag:** "Philosophers actively debate this! Some (like Coates) think sincere reform can restore standing by demonstrating commitment to the norm. Others (like Todd) argue the *past* hypocrisy creates a permanent barrier or requires specific reparations to the victim (Taylor)."
      *   **Question 5 (Worse Hypocrite?):** "Does it matter *how much* worse Alex's behavior was? If Alex only left dishes out *once* before, would Alex's standing be less undermined than if Alex did it constantly?" (Target: Explore degree - generally Settled that worse/more consistent hypocrisy more severely undermines standing).
      *   **Question 6 (Different Kind of Wrong?):** "What if Alex blamed Taylor for something *different*? Say, Taylor borrowed Alex's sweater without asking? Would Alex's hypocrisy about dishes undermine Alex's standing to blame for the sweater?" (Target: Settled that undermining is often *norm-specific*. Dish hypocrisy likely doesn't affect standing to blame for sweater theft unless a broader 'respect' norm is invoked).

  5.  **Synthesis & The Check Question (5 mins):**
      *   Briefly recap: Hypocrisy undermines standing because it involves unfairness/complicity and destroys credibility/authority *on that specific issue*, even when the *judgment is true*. It's about *who gets to speak* the truth in this context.
      *   **The Check Question (The Litmus Test):** **"Imagine a politician gives a passionate speech condemning corruption, demanding harsh punishments. We later discover this politician is deeply corrupt themselves. Does the politician's hypocrisy mean (A) that corruption isn't actually wrong, or (B) that the politician lacks the proper standing to be the one delivering this condemnation, even though corruption *is* wrong?"**
          *   **Why it works:** Forces the distinction explicitly. (A) conflates standing with truth (wrong answer). (B) correctly separates the wrongness of the act from the blamer's legitimacy. If they grasp it, they'll confidently pick (B) and explain why (A) misses the point.
          *   **Listen for:** "Corruption is still wrong, but *they* can't credibly say it" or "The truth doesn't change, but *they* lose the right to complain" or explicitly rejecting (A).

  **Flagging the Scholarly Landscape:**

  *   **Settled Consensus:**
      *   Hypocrisy *typically* undermines the standing to blame.
      *   This undermining is primarily due to unfairness/complicity and a lack of credibility/authority *on the specific norm in question*.
      *   The *truth* of the blame is necessary for blame to be appropriate *at all*, but hypocritical truth-tellers often lack standing *to issue it*.
      *   Standing is distinct from the blamer's overall moral character and the wrongness of the blamed act.
  *   **Actively Contested:**
      *   **Can Reform Restore Standing?** (Todd vs. Coates/Wallace): Can sincere repentance and changed behavior wipe the slate clean, or does past hypocrisy create an irreparable barrier/require specific reparations?
      *   **The Role of the Victim:** How crucial is the *victim's* (or relevant community's) acceptance of the blamer's reform or apology for restoring standing? (Todd emphasizes this).
      *   **The Basis of Standing:** Is it primarily about *fairness* (Wallace), *assurance* (Coates - hypocrisy violates assurances that the blamer is committed to the norm), or something else?
      *   **Scope of Undermining:** How norm-specific is the undermining? When does hypocrisy on one issue "bleed over" to standing on another? (General leaning towards specificity, but nuances debated).

  **Key Teaching Moves:**

  *   **Relentlessly Separate Concepts:** Use phrases like "The act is wrong, BUT the blamer lacks standing," or "The judgment is true, YET the delivery lacks authority."
  *   **Leverage the "Feeling":** Keep returning to their intuitive reaction to Alex. "Remember that gut feeling of unfairness? *That's* the feeling of compromised standing."
  *   **Label Misconceptions Explicitly:** "I know someone might be thinking X, but remember Y..." when anticipating conflation.
  *   **Use the Check Question Confidently:** It directly targets the core confusion. Their answers will tell you if it landed.

  This sequence forces them to confront the distinction through a relatable example, validates their initial intuition about truth while challenging its sufficiency, explicitly names and separates the concepts, tests boundaries to show nuance and contestation, and finally uses a high-stakes check question to confirm understanding. Good luck – that "professor look" won't be coming your way!
