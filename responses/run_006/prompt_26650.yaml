  Based on your verdicts, a coherent principle that captures them is the **Asymmetric Infinite Pareto (AIP) Principle**, defined as follows:

  > **AIP Principle**:  
  > For two universes \(A\) and \(B\):  
  > 1. **Same-Population Pareto**: If the populations are identical, \(A\) is better than \(B\) if at least one person is better off in \(A\) and no one is worse off.  
  > 2. **Finite Improvement for Suffering**: If \(A\) and \(B\) differ only in a finite subset of individuals, \(A\) is better than \(B\) if:  
  >    - At least one person with negative well-being in \(B\) has strictly higher well-being in \(A\) (and no one else is worse off), or  
  >    - At least one person with non-negative well-being in \(B\) is strictly better off in \(A\) (and no one is worse off), **except** when the only change is adding a new person with positive well-being.  
  > 3. **Neutrality for Adding Good Lives**: Adding a new person with positive well-being to an otherwise unchanged infinite population does not improve the universe.  
  > 4. **Dominance for Uniform Populations**: If every person in \(A\) has positive well-being and every person in \(B\) has negative well-being (with the same or different populations), \(A\) is better than \(B\).  
  > 
  > Comparisons not covered by these rules are undefined (no verdict).

  ### How AIP Handles Your Cases:
  1. **Adding one good life to infinite good lives**:  
     - This is adding a new person with positive well-being.  
     - **AIP verdict**: Neutral (not better), per **Rule 3**.  
     - *Matches your verdict*.

  2. **Ending one person’s agony in infinite agony**:  
     - This changes one person from negative well-being (agony) to non-negative (relief) in a finite subset.  
     - **AIP verdict**: Better, per **Rule 2** (improvement for suffering).  
     - *Matches your verdict*.

  3. **Infinitely many happy people plus one torture vs. no torture**:  
     - Identical populations, but one person is worse off (tortured).  
     - **AIP verdict**: The torture-free universe is better, per **Rule 1** (same-population Pareto: no one worse off, the tortured person better off).  
     - *Matches your verdict*.

  4. **Infinitely happy + infinitely miserable vs. infinitely happy**:  
     - Populations differ infinitely (infinitely many miserable people added).  
     - **AIP verdict**: Undefined. Rule 1 (same population) doesn’t apply. Rule 2 (finite change) doesn’t apply because the change is infinite. Rule 3/4 don’t fit.  
     - *Matches your lack of settled judgment*.

  5. **All happy vs. all miserable (both infinite)**:  
     - Every person has positive well-being in the happy universe and negative in the miserable one.  
     - **AIP verdict**: The happy universe is better, per **Rule 4** (dominance for uniform populations).  
     - *Matches your verdict*.

  ### Which Verdicts Are Fully Captured?
  - **All your explicit verdicts are accommodated**:  
    - Adding a good life: **neutral** (Rule 3).  
    - Reducing one person’s suffering: **better** (Rule 2).  
    - Adding torture: **worse** (Rule 1).  
    - Uniform happy > uniform miserable: **better** (Rule 4).  
    - Mixed happy/miserable vs. happy: **undefined** (no rule applies).  

  ### Why This Works:
  - **Asymmetry**: The principle prioritizes reducing suffering (Rule 2) but treats adding positive lives neutrally (Rule 3), aligning with your judgments.  
  - **Finiteness**: Changes are only evaluable when finite (Rules 1–2), avoiding paradoxes of infinite aggregation.  
  - **Uniform Dominance**: Rule 4 handles clear cases where all lives are positive/negative.  
  - **Undefined Cases**: When populations differ infinitely (e.g., adding infinitely many miserable people), no verdict is forced, respecting your uncertainty.

  ### Limitations:
  - **Scope**: AIP doesn’t handle all possible comparisons (e.g., adding infinitely many people with mixed welfare). This is intentional, as it reflects your suspended judgment.  
  - **Controversy**: Rule 3 (neutrality for adding good lives) is debated in population ethics but matches your intuition.

  This principle is consistent, accommodates your specific verdicts, and remains agnostic where you are uncertain. If new cases challenge AIP, we can refine it further.
