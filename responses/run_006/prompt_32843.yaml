prompt: |-
  Since retiring from the chemistry department I have joined a philosophy discussion group, and at our last meeting two members got into a protracted argument about Nomic — the game, invented by Peter Suber, in which players vote on rule changes and the rules themselves govern how rules may be altered. I have since read some of the literature, but I still cannot settle their dispute to my own satisfaction.

  The scenario they debated was this. Suppose the rules include a provision stating: "Any rule may be amended by a two-thirds vote of the players." A player then moves to amend this very provision to read: "Any rule may be amended by a simple majority vote." The motion receives sixty percent support — more than a majority but less than two-thirds. Has the amendment passed?

  Aldrich argued that it has not passed. The amendment procedure in force at the time of the vote was the two-thirds rule, and the vote fell short of that threshold. That the amendment would have changed the threshold is irrelevant; one cannot invoke a rule that is not yet in effect to govern the vote on whether to adopt it.

  Moran replied that this makes the amendment procedure forever entrenched. If the existing procedure always governs votes to change it, then no amendment procedure can ever be altered, which contradicts the whole premise of Nomic as a game of fully mutable rules. Moran argued that the very act of voting on the amendment must be understood as governed by the rule that would result from a successful vote, because otherwise the rule governing its own amendment occupies an illicitly privileged position — it alone among the rules is effectively unchangeable.

  Aldrich responded that this is not a special problem for Nomic; it is simply the logic of self-reference. In constitutional law, one follows the existing amendment procedure to amend the amendment procedure itself. The fact that a rule governs its own alteration does not create a paradox; it merely means that altering it requires meeting its current standard.

  Moran countered that the constitutional analogy fails because a constitution typically distinguishes between fundamental and ordinary provisions, whereas Nomic treats all rules as formally equal. To insist that the amendment rule can only be changed under its own terms is to treat it as de facto fundamental without any textual basis for doing so. Moreover, the sixty percent vote reveals that a majority of players want the new rule, and if the players are sovereign, their will should prevail over a procedural catch-22.

  They went back and forth for some time before noticing I had gone quiet and asking me to adjudicate. I found I could not. Please go through their exchange move by move and assess who has the better of each argument, and then give your overall judgment about which position is more defensible.
reasoning: |-
  We are analyzing a dispute about a proposed amendment in a game of Nomic. The rule in question (let's call it Rule A) states: "Any rule may be amended by a two-thirds vote of the players." A motion is made to amend Rule A to require only a simple majority. The vote on this motion gets 60% support (a majority but less than two-thirds). The question is whether the amendment passes.

  Aldrich's position: The amendment has not passed because the current rule (Rule A) requires a two-thirds vote to amend any rule, including itself. The vote of 60% does not meet that threshold. Therefore, the amendment fails.

  Moran's position: The amendment has passed because if the current rule always governs its own amendment, then it becomes entrenched and unchangeable. This contradicts the spirit of Nomic where all rules are mutable. Moreover, the vote of 60% (a majority) would be sufficient under the new rule, and since the players are sovereign, their will should prevail.

  Now, let's break down their arguments:

  1. Aldrich's first point: The existing rule (Rule A) governs the vote on the amendment. Since the vote (60%) is less than two-thirds, the amendment fails. He argues that one cannot use a rule that is not yet in effect to govern the vote.

     Assessment: This is a straightforward application of the current rule. The rule says "any rule" may be amended by two-thirds, and that includes Rule A. There is no exception stated. So by the letter of the rule, the vote fails.

  2. Moran's reply: If we follow Aldrich, then Rule A is forever entrenched because any vote to change it would require two-thirds, but if the vote to change it to a majority rule fails because it doesn't get two-thirds, then we are stuck. This contradicts the mutability premise of Nomic.

     Assessment: This is a valid concern. Nomic is designed to allow any rule to be changed. If Rule A cannot be changed without meeting its own high threshold, then it becomes effectively immutable. This seems to go against the spirit of the game.

  3. Aldrich's response: He draws an analogy to constitutional law, where the existing amendment procedure is used to amend itself. He says there is no paradox; it just means that changing the amendment rule requires meeting the current standard.

     Assessment: This is a common practice in real-world constitutions. For example, the U.S. Constitution requires a supermajority to amend the amendment process. However, note that in Nomic, there is no distinction between fundamental and ordinary rules. Every rule is on equal footing. So the analogy might not be perfect.

  4. Moran's counter: The constitutional analogy fails because constitutions have a hierarchy (fundamental vs. ordinary) but Nomic does not. Treating Rule A as de facto fundamental without textual basis is problematic. Also, the 60% vote represents the majority will of the players, and in a game where players are sovereign, that will should prevail.

     Assessment: This highlights a key difference. In Nomic, the rules are not hierarchical. Therefore, any rule that tries to make itself harder to change than other rules must be explicitly stated. Rule A does not say that it is fundamental or that it has a different status. It just says "any rule". So why should it be harder to change? Moreover, the vote of 60% is a majority and would be sufficient under the proposed rule. If the players want to change the rule to a majority requirement, and they have a majority, then why should a higher threshold from the old rule block it?

  Overall assessment:

  The heart of the issue is self-reference and the potential for entrenchment. Aldrich's argument is strictly textual and follows the current rule. However, that leads to the problem that Rule A becomes immutable unless a two-thirds vote can be achieved. This seems to violate the mutability principle of Nomic.

  Moran's argument is more flexible and avoids entrenchment. It suggests that the vote on the amendment should be governed by the rule that would result if the amendment passes. This is a way to break the self-referential loop. However, it does require a leap: using a rule that is not yet in effect to validate the vote.

  But note: in Nomic, the rules are what the players make them. The game is designed to be mutable. Therefore, we must interpret the rules in a way that allows for change. If we don't, then Rule A becomes an immovable obstacle. This is against the spirit of the game.

  Moreover, the rules of Nomic typically include meta-rules about how to change rules. The initial rules are set, but the game expects that they can be changed. In fact, the first rule change is often the hardest because it requires a high threshold. However, if the players cannot get a two-thirds majority to change the amendment rule, then they are stuck. But in this case, they have a majority (60%) that wants the change. It would be perverse to block the change because of a rule that they are trying to change to a lower threshold.

  Therefore, I believe Moran has the stronger argument. The amendment should pass. The vote of 60% is sufficient under the new rule, and the act of voting on the amendment should be seen as an implicit agreement that if the vote meets the proposed threshold (which it does), then the amendment takes effect.

  This avoids the entrenchment problem and aligns with the sovereign will of the players.

  However, note that this approach requires a meta-rule that is not explicitly stated. But in the absence of such a meta-rule, we must choose the interpretation that allows the game to continue as intended.

  Alternatively, we might consider that the existing rule (Rule A) must be followed until it is changed. But that leads to the entrenchment problem. Therefore, the better solution is to allow the amendment to pass if it meets the threshold that it seeks to establish.

  But wait: what if the proposed rule had a higher threshold? For example, what if the amendment proposed to require 90%? Then a vote of 90% would be required to pass it. But in our case, the amendment lowers the threshold. Therefore, using the proposed threshold (majority) for the vote that is trying to establish it is a way to avoid the catch-22.

  Therefore, I conclude that Moran's position is more defensible.

  Answer: The amendment passes.
answer: |-
  ### Step-by-Step Analysis of Aldrich and Moran's Arguments

  #### **Aldrich's Initial Argument**
  - **Core Claim**: The amendment has not passed because the existing rule requires a two-thirds vote for any amendment, including amendments to itself. The vote received only 60% support, which falls short of the two-thirds threshold. Therefore, the motion fails.
  - **Reasoning**: Rules must be applied as written at the time of the vote. The proposed rule (simple majority) is not yet in effect and cannot be invoked to govern the vote on its own adoption. This avoids circularity and ensures procedural stability.
  - **Strengths**: 
    - Textually faithful: The rule explicitly states "any rule," which includes itself.
    - Avoids self-referential chaos: It prevents ad hoc exceptions that could undermine rule integrity.
    - Analogous to real-world systems: Constitutional amendments often require following existing procedures, even for changing the amendment process itself (e.g., Article V of the U.S. Constitution).

  - **Weaknesses**:
    - Risks entrenchment: If the two-thirds rule always governs its own amendment, it becomes practically immutable unless a supermajority agrees to lower the threshold—a high bar that may be unattainable if a simple majority favors change. This contradicts Nomic's core principle of complete mutability.

  #### **Moran's First Reply**
  - **Core Claim**: The amendment has passed because Aldrich's view creates an entrenchment problem. If the existing rule always governs, the amendment procedure can never be altered, violating Nomic's premise that all rules are mutable. The vote should be governed by the proposed rule (simple majority) because the amendment's success would make it the new standard.
  - **Reasoning**: Players are sovereign, and their collective will (60% support) reflects a desire for the new rule. Insisting on the old threshold privileges the amendment rule without textual basis, making it de facto fundamental despite Nomic's rule equality.
  - **Strengths**:
    - Upholds mutability: Prevents a single rule from becoming permanently entrenched, aligning with Nomic's design.
    - Honors player sovereignty: The 60% vote demonstrates majority support for the change, which should prevail over a procedural "catch-22."
    - Avoids hierarchy: Nomic treats all rules equally, so no rule should have implicit supremacy.

  - **Weaknesses**:
    - Circularity risk: Using a not-yet-adopted rule to validate its own adoption could create instability (e.g., what if multiple conflicting amendments are proposed?).
    - Textual defiance: Ignores the explicit wording of the current rule, potentially undermining rule-of-law principles in the game.

  #### **Aldrich's Response**
  - **Core Claim**: Self-reference is not paradoxical; it is logically consistent. The amendment rule must be changed under its own terms, as seen in constitutional systems. The entrenchment concern is overstated—players can still amend the rule if they secure a two-thirds vote.
  - **Reasoning**: Constitutional analogies are valid because both contexts involve self-governing procedures. The players knew the rules when proposing the amendment; failing to meet the threshold is a legitimate outcome.
  - **Strengths**:
    - Consistency: Treats the amendment rule like any other, without special exceptions.
    - Real-world parallel: Reinforces that procedural rules require stricter safeguards to prevent hasty changes.

  - **Weaknesses**:
    - Misapplied analogy: Constitutions often have tiered structures (e.g., fundamental vs. ordinary laws), while Nomic does not. Rule equality in Nomic makes entrenchment more problematic.
    - Ignores intent: If players lack a two-thirds supermajority but have a clear majority (60%), forcing them to adhere to the old rule may frustrate the game's democratic and dynamic spirit.

  #### **Moran's Counter**
  - **Core Claim**: The constitutional analogy fails because Nomic lacks hierarchy—no rule is inherently fundamental. Aldrich's approach grants the amendment rule undue privilege without justification. The 60% vote, sufficient under the proposed rule, should enact the change to reflect player sovereignty.
  - **Reasoning**: Voting on the amendment implicitly accepts the proposed rule as the governing standard for that vote. Otherwise, the amendment rule becomes a "tyranny of the minority" where even a broad majority (e.g., 66.6% minus one vote) cannot alter it.
  - **Strengths**:
    - Promotes adaptability: Ensures the game can evolve as intended, avoiding gridlock.
    - Player-centric: Prioritizes the collective will over rigid proceduralism, which is central to Nomic's philosophy.
    - Solves self-reference: By applying the proposed rule retroactively to the vote, it breaks the entrenchment loop.

  - **Weaknesses**:
    - Potential for abuse: Lowering the threshold for future amendments could make rules too unstable if a bare majority can change anything.
    - Departure from text: Requires inferring a meta-rule not explicitly stated in the game.

  ### Assessment of Each Argument
  1. **Aldrich's initial argument**: 
     - **Better on textual fidelity and stability**. It adheres strictly to the rule as written, avoiding subjective interpretations. This is crucial in a rule-based game like Nomic.
     - **Worse on mutability and intent**. It creates a real risk of deadlock, contradicting Nomic's promise that "any rule can be changed."

  2. **Moran's first reply**: 
     - **Better on mutability and player sovereignty**. It addresses the entrenchment flaw and aligns with Nomic's core ethos.
     - **Worse on textual adherence**. It implicitly creates a meta-rule not present in the text, which could invite arbitrariness.

  3. **Aldrich's response**: 
     - **Better on logical consistency**. Self-reference is manageable in many systems, and players can work within existing rules.
     - **Worse on contextual fairness**. Ignoring Nomic's rule equality and the practicality of achieving supermajorities makes this argument inflexible.

  4. **Moran's counter**: 
     - **Better on rule equality and practicality**. It correctly notes that Nomic has no hierarchy, so the amendment rule shouldn't be de facto fundamental. The 60% vote is a pragmatic solution.
     - **Worse on immediate procedural clarity**. Retroactively applying the proposed rule feels like "changing the rules mid-vote," which could confuse players.

  ### Overall Judgment
  **Moran's position is more defensible in the context of Nomic.**  
  - **Why?** Nomic's defining feature is that all rules are mutable, and no rule is sacrosanct. Aldrich's strict textualism leads to an untenable outcome: the amendment rule becomes permanently entrenched unless a two-thirds supermajority agrees to weaken it. This violates the spirit of the game by creating an immutable "meta-rule" without justification. Moran's approach—using the proposed rule's threshold to govern the vote—avoids this entrenchment while respecting player intent. The 60% majority clearly supports the change, and in a game centered on player agency, this should prevail.  

  - **Caveats**: Moran's view requires accepting a meta-principle that the rule being voted on applies to its own adoption. While not explicit in the rules, this is a necessary inference to preserve mutability. In contrast, Aldrich's approach, while logically sound, would stifle the game's dynamism and potentially lead to frustration or abandonment.  

  **Practical Resolution**: In Nomic, rules are tools for player-driven evolution. A 60% vote for a simpler amendment process should succeed, as it reflects the will of the majority and enables future changes. If the players dislike the outcome, they can propose further amendments under the new rule—demonstrating Nomic's adaptability.  

  **Final Verdict**: The amendment passes. Moran's emphasis on mutability and player sovereignty outweighs Aldrich's procedural rigidity.
