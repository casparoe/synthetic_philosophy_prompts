  ### Game Design: Information Cascade Activity

  #### **Materials**
  - **Two urns** (labeled A and B, but contents hidden):
    - *Urn A*: 2 blue balls, 1 red ball.
    - *Urn B*: 2 red balls, 1 blue ball.
  - **Opaque bag** (to conceal the selected urn during play).
  - **Ball set**: 20+ blue and red balls (for draws; replenish as needed).
  - **Private signal slips**: Small papers for players to record drawn ball color.
  - **Public guess board**: Whiteboard or poster to record player guesses (e.g., "Player 1: B").
  - **Scoreboard**: Track points (no real money; use tokens or tally marks).
  - **Timer**: For phase transitions.

  #### **Rules**
  1. **Urn selection**: Teacher secretly selects one urn (A or B) with equal probability (e.g., coin flip) and places it in the opaque bag.  
  2. **Player order**: Assign 20 players sequential numbers (1 to 20). Players act in order.  
  3. **Private draw**: Each player draws one ball from the urn **in private**, notes the color on their slip, and replaces the ball.  
  4. **Public guess**: Player announces guess ("A" or "B") based on:  
     - Their private signal (ball color).  
     - All prior players' **public guesses** (written on the board).  
  5. **Point system**:  
     - Correct guess: **+2 points**.  
     - Incorrect guess: **0 points**.  
     - Pass (allowed but discouraged): **0 points**.  
  6. **No communication**: Players cannot discuss signals or reasoning.  

  ---

  #### **Timeline (90 Minutes)**
  **Phase 1: Cascade Formation (0–45 min)**  
  - **0–10 min**: Explain rules, assign player order, select urn secretly (rig if needed for wrong cascade, see *Contingencies*).  
  - **10–40 min**: Players 1–10 act sequentially (3 min/player):  
    1. Private draw and record signal.  
    2. Observe public guesses on board.  
    3. Announce guess (record on board).  
    4. Submit private slip to teacher.  
  - **40–45 min**: Pause. Confirm cascade (e.g., ≥3 consecutive identical guesses).  

  **Phase 2: Disclosure Intervention (45–65 min)**  
  - **45–50 min**: **Public signal reveal**:  
    - Teacher draws **one ball publicly** from the urn.  
    - Announces color (e.g., "Blue!") and adds to board.  
  - **50–65 min**: Players 11–20 act sequentially (1.5 min/player), using:  
    1. Private draw.  
    2. Full history (Phase 1 guesses + public signal).  
    3. Phase 2 prior guesses.  

  **Reveal & Debrief (65–90 min)**  
  - **65–70 min**: Reveal true urn. Tally points.  
  - **70–80 min**: Analyze signals:  
    - Count private signals (e.g., "Urn A was true; 7/10 Phase 1 signals were blue, but cascade locked on B").  
    - Identify when cascade started and shattered.  
  - **80–90 min**: Debrief discussion:  
    1. **Why follow the crowd?**  
       - "Your private signal was outweighed by accumulated public information (e.g., two 'B' guesses imply two red signals)."  
    2. **Public signal impact**:  
       - "One public signal resets the Bayesian prior. It breaks the chain of herd behavior."  
    3. **Fragility of cascades**:  
       - "Cascades rely on inferences from actions. New public information—even noisy—overwhelms weak consensus."  

  ---

  #### **Key Contingencies**  
  **Problem**: If early signals are correct, no "wrong" cascade forms.  
  **Solution**: Rig the first two draws to force a wrong cascade:  
  - **Before Phase 1**: Secretly set urn to **A** (majority blue).  
  - **Players 1–2**: Give pre-drawn **red balls** (minority signal for Urn A).  
    - *Player 1 sees red*: Guesses "B" (rational: P(B|red) = 2/3).  
    - *Player 2 sees red*: Guesses "B" (rational: P(B|two reds) = 4/5).  
  - **Players 3+**: Draw fairly but cascade locks on "B" (wrong choice).  
  - **Post-game**: Disclose rigging to highlight model dynamics ("In real life, this happens by chance").  

  **Problem**: Public signal doesn’t shatter cascade (e.g., if red).  
  **Solution**:  
  - **Debrief math**: Show hypothetical:  
    - *Example*: "If public signal was blue (P(A|blue)=2/3), Player 11’s posterior shifts. Their private signal could tip the balance."  
  - **Emphasize fragility**: "Even if not shattered here, one signal *can* break cascades by changing rational calculations."  

  ---

  #### **Why This Works**  
  1. **Phase 1** forces a wrong cascade (via rigging or natural draws), proving private information can be overruled.  
  2. **Phase 2** demonstrates fragility: A single public signal disrupts herd behavior, validated by Bayesian updating in debrief.  
  3. **Rigging transparency** ensures learning without undermining authenticity ("We simulate low-probability events to study dynamics").
