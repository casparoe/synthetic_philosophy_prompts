  We are designing a classroom activity to demonstrate information cascades, specifically focusing on two aspects: 
   (1) Cascades can lock in on the wrong choice even when the majority of private information points the other way.
   (2) Cascades are fragile and can be shattered by a single public signal.

   We will have two phases: 
     Phase 1: Cascade formation (without any public signals beyond the actions of previous players)
     Phase 2: A disclosure intervention (revealing a public signal) to break the cascade.

   We'll use an urn model. There are two urns: Urn A and Urn B.
     - Urn A contains 2 blue balls and 1 red ball.
     - Urn B contains 2 red balls and 1 blue ball.

   One of these urns is chosen randomly (with equal probability) at the start of the game. The goal of the students is to guess which urn was chosen.

   The game proceeds in turns. Each student (in sequence) gets to:
     - Draw a ball from the chosen urn (in private, so only they see the color) and then replace it.
     - Then, they must publicly announce their guess of which urn it is (A or B). They can also choose to pass (but we will discourage passing to keep the game moving; if they pass, they get 0 points and we move on).
     - After announcing, they write down their private signal (the color they drew) on a private slip (to be collected for later analysis).

   However, note: we want to simulate the BHW model where players observe the guesses (but not the private signals) of previous players.

   We will have two rounds:

   Round 1 (Cascade Formation Phase): 
     - Players 1 to N (say 10 players) go in order. Each player:
          1. Draws a ball in private (and records it privately).
          2. Observes the previous players' public guesses (but not their private draws).
          3. Makes a guess (A or B) based on their private signal and the history of public guesses.

   Round 2 (Disclosure Intervention Phase):
     - We reveal a public signal. This public signal is generated by drawing a ball from the urn and announcing its color to everyone. (Note: This is a noisy signal because the urn could be A or B and the ball drawn might not be the majority color of the true urn.)
     - Then, we have Players 11 to 20 (if we have 20 students, the next 10) go in order. They each:
          1. Draw a private ball (and record it).
          2. Observe the entire history of Round 1 (the guesses of players 1-10) and the public signal (the revealed ball color).
          3. Also observe the guesses of the previous players in Round 2 (if any).
          4. Make a guess.

