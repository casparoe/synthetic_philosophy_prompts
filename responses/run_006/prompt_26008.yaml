    40-50 min: Round 2 (Disclosure Intervention). 
          - The teacher draws a ball from the urn in front of everyone and announces its color (this is the public signal). 
          - Then, players 11 to 20 go in order: each draws a private ball, then announces their guess (having seen the entire history of Round 1 and the public signal, and the guesses of the previous players in Round 2). They also record their private draw.

    50-70 min: We reveal the true urn. Then, we go through the sequence of guesses and the private signals (we have the slips). We can tally:
          - The private signals (how many blues and reds) for the true urn. This will show that even if the majority of private signals pointed to the correct urn, a cascade might have locked in on the wrong one.
          - We then look at Round 2: how the public signal broke the cascade.

