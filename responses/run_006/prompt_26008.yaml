                  - As computed earlier, the informative signals are two reds (from players 1 and 2) and one blue (public). So:
                      P(A | two reds and one blue) = 1/3, P(B)=2/3.
                  - Then they draw a ball privately.
                  - If they draw blue, they are indifferent (posterior 0.5 for A and B) -> they might flip a coin. We can suggest they guess based on the majority of the signals they have? Or they can guess arbitrarily. In the Bayesian model, they are indifferent so any guess is rational.
                  - If they draw red, they guess B.
              - Player 12:
                  - Observes everything: the two reds (inferred), the public blue, and player11's guess.
                  - Player11's guess: if player11 guessed B, then player12 doesn't know if player11 drew red or was indifferent and flipped to B. This makes it messy.

            This is not ideal.

          Given the complexity, I recommend we change the disclosure intervention to be a stronger signal: we reveal the true urn to one student (randomly) and that student is told to announce their signal truthfully? But that student doesn't have a signal, they know the truth.

          Alternatively, we can have the teacher reveal the true urn to the whole class? That would break the cascade for sure, but it's not a noisy signal.

          I think for the purpose of the classroom, we can reveal a noisy public signal that is stronger: for example, we draw two balls and if they are the same, we announce that color as the public signal. If they are different, we draw again until we get two the same? But that would make the public signal have a higher accuracy.

          Let me compute the accuracy of drawing two balls and taking the majority (if they are the same) and if they differ, we draw two more? But time.

          Alternatively, we draw three balls and take the majority. That would be 20/27 accurate. But we don't have time for three draws.

          Given the time, I will design the activity with a single public ball draw and accept that it might not break the cascade immediately. The key is that it adds public information and may cause the cascade to break in later players. Then in the debrief, we can show the math of how a public signal can break it.

          We can also run a simulation in the debrief to show the breaking.

          So here is the full activity design:

          Game: Information Cascade with Urn

          Materials:
            - An urn prepared with either:
                 Urn A: 2 blue balls, 1 red ball.
                 Urn B: 2 red balls, 1 blue ball.
            - A large number of extra balls (at least 20 blue and 20 red) to refill if needed, but we are replacing after each draw.
            - Two red balls (for the first two players) in opaque envelopes or under cups.
            - Private signal recording slips for each student.
            - A board to record public guesses.

          Setup:
            - The teacher secretly chooses the urn to be A.
            - The first two players are assigned to receive the rigged red balls.

          Rules for players:
            - Each player must guess the urn type (A or B) based on the public history of guesses and their private signal.
            - They cannot see the private signals of others, only the public guesses.
            - They get 2 points for a correct guess, 0 for incorrect or pass.
            - They must publicly announce their guess.

          Procedure:

            Phase 1 (Cascade Formation): 
              - Player 1: 
                  - Given an envelope/cup with a red ball (they look privately).
                  - They should then publicly guess: after Bayesian updating, they should guess B.
                  - They record their private signal (red) on the slip and hand it in.
                  - Teacher records their guess (B) on the board.
              - Player 2:
                  - Given an envelope/cup with a red ball.
                  - They see player1's guess (B).
                  - They should guess B.
                  - Record private signal (red) and hand in.
                  - Teacher records guess (B).
              - Player 3 to 10:
                  - Draw a ball from the urn in private (and replace it).
                  - See the history of guesses (all previous are B).
                  - Compute their belief and guess.
                  - We expect them to guess B regardless of their draw.
                  - Record their private signal and hand in.
                  - Teacher records their guess.

            Phase 2 (Disclosure Intervention):
              - The teacher draws one ball from the urn in front of everyone and announces its color. 
              - We hope for blue. If we get red, we can still use it, but it won't break the cascade. 
              - Then, players 11 to 20, in order:
                  - Draw a ball in private.
                  - See the entire history of guesses (players 1-10) and the public signal (the announced color).
                  - Announce their guess.
                  - Record their private signal.

            Reveal the true urn (A).

          Then, we collect all private signals and count:
            - In Round 1, how many private signals were blue and how many were red? We expect at least 5 or 6 blue (since urn A has 2/3 blue) out of 8 draws (players 3-10), but the cascade persisted on B.

          Debrief:
            - Show the private signals and highlight that the majority of private signals in Round 1 were likely blue (pointing to A), but the cascade locked in on B.
            - Explain why it was rational for each player to follow the crowd.
            - For the public signal: even though it was only one ball, it was observed by everyone and added to the information set. 
            - In Round 2, players have this new information. If the public signal was blue, it might have caused some players to break the cascade.

          What if the public signal was red? Then it reinforces the cascade. But we can then discuss: what if the public signal had been blue? We can do the math.

          To increase the chance of a blue public signal, the teacher can stack the draw? But that would be rigging. Alternatively, we can draw until we get a blue? But that might take time.

          Given the constraints, this is the best we can do.

          Timeline (90 minutes):

            0-10 min: Introduce the concept of information cascades. Explain the rules and the urn setup. Assign order (1 to 20). 

            10-40 min: Round 1. Players 1 to 10 go in sequence. Each player takes about 3 minutes: 
                       1 min to receive/look at signal, 
                       1 min to think and announce, 
                       1 min to record and next.
                       But 10 players * 3 min = 30 min. We have 30 min in this block.

            40-45 min: Public signal draw. Draw one ball and announce. 

            45-60 min: Round 2. Players 11-20 go in sequence. Each player 2-3 minutes. 10 players * 2 min = 20 min.

            60-65 min: Reveal the true urn (A). 

            65-80 min: Collect and tabulate the private signals. Write on the board the sequence of public guesses and the private signals (for players 1-10, we know player1 and 2 are red, then players 3-10 we have their draws). For players 11-20, we also have their draws.

            80-90 min: Debrief.

          What can go wrong:
            - The public signal might be red (1/3 chance for urn A). Then the cascade might not break. 
               Workaround: In the debrief, we can simulate what would have happened if the public signal had been blue, using the actual private signals of players 11-20. Or we can do the math.

            - In Round 1, even with the rigged first two, if player3 onward draw many reds, then the cascade is not as surprising. But urn A has only 1/3 red, so likely we get more blues.

            - Students might not do the Bayesian updating correctly. 
               Workaround: Provide a cheat-sheet with the updating rules? Or we can have them vote for their guess and then explain the right guess. But that might slow down.

            - Time might be tight for 20 students. 
               Workaround: Have less than 10 in each round? Maybe 8 in Round 1 and 8 in Round 2? With 20 students, we can do 10 in each.

          Given the above, we proceed.

          This design meets the objectives as well as possible within the constraints.
