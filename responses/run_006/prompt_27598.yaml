  ### Key Features
  - **Time Efficiency**: Focused on observable metrics (physical checks, behavior sampling). Completable in ≤2 hours.  
  - **Defensibility**:  
    - Fails only for unambiguous harm (Steps 1, 3).  
    - Escalates uncertainty to experts (Step 6) or corrective actions (Steps 2, 4).  
    - Explicit judgment calls (Step 5) with documented reasoning.  
  - **Sentience Adaptation**:  
    - Stricter rules for nociception-confirmed species (e.g., salmon analgesia).  
    - Precautionary defaults for contested cases (e.g., shrimp ablation hygiene).  
  - **Balance**: Prioritizes preventing harm without requiring impossible measures (e.g., no enrichment mandate for tilapia without evidence).  

  This procedure honors the precautionary principle while acknowledging scientific and operational realities. It remains actionable for auditors but transparent about its assumptions and limits.
