prompt: |-
  I work as the lead auditor for an international aquaculture certification scheme. We certify salmon, trout, sea bass, shrimp, and tilapia farms against welfare standards. Our auditors spend one day on-site per farm, have backgrounds in veterinary medicine or animal science, and must produce a structured report that holds up to scrutiny from industry associations, animal-welfare NGOs, and retail buyers.

  Our current welfare checklist was adapted from terrestrial livestock standards and has serious problems. It checks stocking density, water quality parameters, and mortality rates — but it gives an auditor no guidance when the underlying science is unsettled. For shrimp, there is a live and unresolved debate about whether they can suffer at all. For salmon, we know they possess nociceptors but disagree about whether nociception implies conscious pain. For tilapia, the welfare literature is thin. Different welfare scientists we consult give us different red lines for the same species, and our auditors are left improvising.

  I want you to produce a field-audit decision procedure that operationalizes a precautionary approach to welfare under sentience uncertainty. The procedure should take an auditor through a sequence of on-farm checks, telling them what to look for, what counts as passing or failing each check, where the procedure stops with a fail, and where it flags an issue for expert review because the science genuinely cannot settle it. It should be honest about which steps are judgment calls dressed up as procedure and which rest on settled fact.

  The procedure must be usable by an auditor who understands fish health and husbandry but has no background in philosophy of mind or consciousness research. It should take no more than two hours to run through the welfare-specific portion of the audit — water quality, biosecurity, and disease checks are handled by a separate module and should not be duplicated here. The stakes are high: a failed audit can suspend a farm's certification, which affects market access and livelihoods. The procedure must therefore be defensible when challenged.

  Please deliver your response as a single JSON object with the following fields:

  - **"procedure"**: an array of steps, each an object with these keys:
    - "step_number": integer
    - "check_name": short string naming the check
    - "instruction": what the auditor does or looks for on site
    - "pass_condition": what counts as passing
    - "fail_condition": what counts as failing
    - "on_fail": one of "stop_and_fail_audit", "mandatory_corrective_action", "flag_for_expert_review", or "judgment_call"
    - "judgment_note": required only if "on_fail" is "judgment_call" — explain what the auditor must weigh and why the procedure cannot decide it algorithmically
    - "sentience_note": what the step assumes or requires about the species' capacity for suffering, and how the step should be modified (if at all) when that assumption is contested for the species under audit

  - **"worked_examples"**: an array of three objects, each with:
    - "case": a short description of a farm scenario (species, system type, the problem observed)
    - "species": the species being farmed
    - "procedure_run": how the procedure plays out step by step on this case, referencing step numbers
    - "outcome": the final verdict the procedure produces
    - "uncomfortable_implication": if the procedure yields an answer the farmer, the auditor, or an NGO would resist, state it plainly and explain why the procedure forces it

  - **"limitations"**: an array of strings, each describing something the procedure cannot do, a kind of case it was not designed for, or a way it might systematically misfire

  Before writing the procedure, please think through the following in your preparatory reasoning: what exactly a precautionary principle commits an auditor to when sentience is uncertain for a given species; which welfare indicators are robust across the fish–crustacean divide and which break down; where in the audit sequence a conscientious auditor should stop applying a procedure and escalate to a judgment call; and what philosophical assumptions about the relationship between nociception, consciousness, and welfare you are building into the procedure that a practitioner might reasonably reject. Make those assumptions explicit in the procedure itself rather than burying them.

  You are an expert in both animal welfare science and the philosophy of mind as it bears on non-mammalian consciousness. Think carefully and step by step.
reasoning: |-
  We are designing a decision procedure for welfare audits in aquaculture, with a precautionary approach under sentience uncertainty. The procedure must be usable by auditors without philosophy backgrounds, take <=2 hours, and be defensible.

  Key principles for a precautionary approach:
  1. When scientific uncertainty exists about a species' capacity to suffer, we err on the side of assuming they might suffer until proven otherwise. Thus, we apply welfare standards that would protect a sentient being unless there is strong evidence to the contrary.
  2. However, we must balance this with practicality and the reality that some species (like shrimp) have less evidence for sentience. We cannot demand the impossible or economically unviable measures without strong justification.

  The procedure will focus on observable welfare indicators that are either:
  - Universally accepted as welfare-relevant (e.g., physical injury, disease signs) because they are harmful regardless of sentience (if the organism can be harmed at all) OR
  - Behaviorally indicative of distress, which we interpret cautiously when sentience is uncertain.

  We note that nociception (the neural capacity to detect noxious stimuli) is distinct from conscious pain. But because we don't know for sure, we treat nociceptive responses as a warning sign.

  Steps should be ordered to catch the most severe welfare issues first (e.g., immediate harm) and then move to more subtle ones. We want to stop early if there's a clear fail.

  The procedure must not duplicate water quality, biosecurity, or disease checks (handled separately). So we focus on:
  - Handling and slaughter practices
  - Physical conditions that may cause harm (e.g., injuries, mutilations without analgesia)
  - Behavioral indicators of distress
  - Environmental enrichment (where applicable and evidence-based)

  For species with contested sentience (like shrimp), we will require that they be treated as if they can suffer unless there is a scientific consensus that they cannot. But we must flag steps where the science is too unsettled for a clear pass/fail and require expert review.

  The procedure will include steps that are judgment calls, and we will explicitly note them.

  Philosophical assumptions built in:
  - Assumption 1: If a species has nociceptors, it is at risk of experiencing something aversive, even if we don't know if it's conscious pain. Therefore, we require that invasive procedures (like fin clipping or eyestalk ablation) be done with methods that minimize tissue damage and, if available, with analgesia. But we acknowledge that for some species, the use of analgesia is not established.
  - Assumption 2: Behavioral responses to noxious stimuli (e.g., avoidance, rubbing) are indicators of distress and should be minimized, even if we don't know if the animal is conscious. This is precautionary.
  - Assumption 3: Mortality and injury rates are indirect welfare indicators. High rates may indicate poor welfare, but we must rule out non-welfare causes (e.g., disease outbreak). Since disease is handled separately, we look for patterns that suggest chronic stress or trauma.

  We break down the procedure into steps:

  Step 1: Immediate Physical Harm
  Check for visible injuries, deformities, or conditions that would cause acute harm (e.g., open wounds, missing appendages, severe lesions). This is a universal welfare concern because even non-sentient beings can be damaged, and if they are sentient, it's clearly bad.

  Step 2: Handling and Harvesting Practices
  Observe how the animals are handled (e.g., during grading, transfer, harvest). Rough handling can cause physical damage and stress. We look for evidence of excessive force, prolonged air exposure, or crushing.

  Step 3: Invasive Procedures (if any)
  Check if any invasive procedures are performed (e.g., fin clipping in salmon, eyestalk ablation in shrimp). We require that these are done with the least invasive method and, if the species is known to have nociceptors, with analgesia or anesthesia unless there is a scientific consensus that it is ineffective or unnecessary. For species with contested sentience, we still require minimization of tissue damage and stress.

  Step 4: Chronic Physical Indicators
  Look for signs of chronic physical stress (e.g., fin erosion, body lesions, gill damage) that are not due to disease (which is covered in another module). These may indicate poor environmental conditions or chronic stress.

  Step 5: Behavioral Indicators of Distress
  Observe the animals' behavior. For example:
    - In salmon: abnormal swimming, lethargy, or excessive jumping.
    - In shrimp: abnormal swimming, rubbing at body parts, or avoidance of certain areas.
  However, we must be cautious because behavior might not indicate conscious suffering. We use this step only when there is scientific support for the behavior being a welfare indicator in that species. If the science is unsettled, we flag for expert review.

  Step 6: Environmental Enrichment
  Check if the farm provides environmental complexity that is species-appropriate and has been shown to reduce stress or improve natural behavior. This step is more applicable to fish than crustaceans, and we note that for some species the evidence is weak. We don't require enrichment if there's no evidence, but we encourage it as a precaution.

  Step 7: Unresolved Scientific Uncertainty
  If a step relies on an assumption about sentience that is highly contested for the species (e.g., step 5 for shrimp), and the auditor observes a potential issue, we flag it for expert review rather than fail the audit outright.

  We design the procedure to stop and fail the audit only for clear, uncontroversial welfare breaches (e.g., step 1 or 2). For more uncertain steps, we require corrective actions or flag for review.

  Now, we structure the steps in a logical order, starting with the most objective and severe.

  Procedure Steps:

  1. Step 1: Check for Acute Physical Injuries
     - Instruction: Systematically sample animals (during handling or in situ if visible) for signs of acute physical harm: open wounds, severe lesions, missing appendages (beyond normal molt for crustaceans), or deformities that impair movement.
     - Pass condition: No or very low incidence (<1% of sample) of severe acute injuries.
     - Fail condition: Significant incidence (>=1% of sample) of severe acute injuries that are not due to normal husbandry (e.g., recent grading) and are untreated.
     - On fail: stop_and_fail_audit (because this is an immediate and severe welfare issue regardless of sentience debates)
     - Sentience note: Assumes that physical injury is harmful. For all species, we consider this a basic health issue. No modification needed.

  2. Step 2: Handling Practices
     - Instruction: Observe at least one routine handling event (e.g., transfer, grading, harvest). Look for: duration of air exposure, dropping of animals, crushing, or excessive force.
     - Pass condition: Animals are handled gently, with minimal air exposure (species-specific limits, e.g., salmon: <15 seconds; shrimp: <30 seconds), and without crushing or dropping.
     - Fail condition: Rough handling observed (e.g., animals dropped from height, crushed, or air exposure exceeds guidelines without mitigation) OR no established handling protocols.
     - On fail: stop_and_fail_audit (because rough handling can cause immediate physical harm and stress)
     - Sentience note: Assumes that rough handling causes stress and physical harm. This is uncontroversial. For air exposure, we rely on species-specific guidelines. If none exist, use a precautionary limit (e.g., 30 seconds for fish, 60 seconds for crustaceans).

  3. Step 3: Invasive Procedures
     - Instruction: If any invasive procedures are performed (e.g., fin clipping, tagging, eyestalk ablation), review protocols and observe or discuss methods. Check for use of analgesia/anesthesia and the skill of the operator.
     - Pass condition: Procedures are performed by trained staff, with the least invasive method available, and with appropriate analgesia/anesthesia if the species has nociceptors (which most fish and shrimp do). If analgesia is not used, there must be a scientifically valid reason (e.g., it's ineffective or more stressful).
     - Fail condition: Procedures are performed without any mitigation (analgesia or anesthesia) when the species is known to have nociceptors, or without proper training leading to excessive injury.
     - On fail: mandatory_corrective_action (because it's a chronic issue but not an immediate fail if the farm commits to change)
     - Sentience note: For species with contested sentience (e.g., shrimp), we still require minimization of tissue damage and stress. If the species has nociceptors, we require analgesia unless proven unnecessary. This step is precautionary.

  4. Step 4: Chronic Physical Indicators
     - Instruction: Examine a sample of animals for chronic physical signs: fin erosion, body lesions (not acute), gill damage, or other signs of chronic stress.
     - Pass condition: Low incidence (<5%) of chronic physical issues that are not attributable to disease (as per the disease module).
     - Fail condition: High incidence (>=5%) of chronic physical issues that suggest environmental or management problems.
     - On fail: mandatory_corrective_action (requires farm to address underlying causes)
     - Sentience note: These signs indicate poor health and are welfare concerns regardless of sentience. But we note that for some species (e.g., tilapia) the thresholds might be less established. We use a generic 5% as a starting point, which can be adjusted by expert review.

  5. Step 5: Behavioral Indicators
     - Instruction: Observe animals in their environment for at least 15 minutes. Look for abnormal behaviors: lethargy, excessive aggression, stereotypic behaviors, avoidance, or rubbing against surfaces (for parasites or irritation).
     - Pass condition: Majority of animals exhibit normal, species-typical behavior with no widespread signs of distress.
     - Fail condition: Widespread abnormal behaviors that are not explained by temporary events (e.g., feeding).
     - On fail: flag_for_expert_review (because the link between behavior and conscious suffering is uncertain for many species)
     - Judgment note: The auditor must weigh the severity and prevalence of the behavior and rule out non-welfare causes (e.g., environmental factors). This is a judgment call because the science on what constitutes suffering in fish and crustaceans is unsettled.
     - Sentience note: This step assumes that abnormal behavior can indicate distress. For species with strong evidence of sentience (e.g., salmon), we might treat this more strictly. For shrimp, we flag because the science is unresolved.

  6. Step 6: Environmental Complexity
     - Instruction: Check if the environment provides structures that allow for natural behaviors (e.g., hiding places for shrimp, current for salmon). Ask for evidence that the enrichment is effective (e.g., reduced aggression, better growth).
     - Pass condition: The environment meets species-specific needs OR if no evidence exists for enrichment, the farm is not required to have it (pass by default).
     - Fail condition: There is scientific consensus that environmental complexity is necessary for welfare, and the farm does not provide it, leading to observable problems (e.g., high aggression).
     - On fail: judgment_call (because the necessity of enrichment is often species-specific and not always settled)
     - Judgment note: The auditor must consider: Is there strong evidence that this species benefits from enrichment? Is the absence causing harm? Without evidence, we cannot require it.
     - Sentience note: This step is precautionary for species that might benefit, but we don't fail for lack of enrichment unless there's evidence it's needed.

  7. Step 7: Scientific Uncertainty Review
     - Instruction: If at any step the auditor is uncertain due to conflicting scientific information about the species' sentience or welfare needs, they must flag the issue for expert review. This step is a catch-all.
     - Pass condition: No unresolved issues that hinge on sentience uncertainty.
     - Fail condition: One or more issues are flagged for expert review.
     - On fail: flag_for_expert_review (the audit outcome is pending until experts weigh in)
     - Sentience note: This step acknowledges that some welfare questions cannot be resolved without species-specific scientific input.

  Now, we note that the procedure should not take more than two hours. The above steps can be done within that time because:
  - Steps 1, 2, 4, 5 involve observation and sampling that can be done concurrently with other checks.
  - Step 3 and 6 are based on interview and document review.

  Worked Examples:

  Example 1: Shrimp farm with eyestalk ablation without analgesia.
  - Species: Shrimp
  - Case: Farm performs unilateral eyestalk ablation on broodstock without anesthesia. The procedure is done by trained staff but no pain relief is used.
  - Procedure run:
    - Step 1: No acute injuries found. Pass.
    - Step 2: Handling during ablation is gentle. Pass.
    - Step 3: Invasive procedure without analgesia. Fail -> mandatory corrective action.
    - Outcome: Farm must implement corrective action (use analgesia or prove it's not needed). Audit does not fail immediately but requires action.
  - Uncomfortable implication: The farmer might argue that shrimp don't feel pain and analgesia is costly and unproven. The procedure forces the issue because of precaution: if there's a chance they suffer, we must minimize harm.

  Example 2: Salmon farm with high fin erosion.
  - Species: Salmon
  - Case: 15% of sampled fish show moderate to severe fin erosion.
  - Procedure run:
    - Step 1: No acute injuries. Pass.
    - Step 2: Handling during sampling was acceptable. Pass.
    - Step 3: No invasive procedures observed. Pass.
    - Step 4: Chronic physical indicators: 15% incidence -> fail -> mandatory corrective action.
    - Outcome: Corrective action required to address causes of fin erosion.
  - Uncomfortable implication: The farmer might say that fin erosion is common and not a welfare issue. The procedure treats it as a welfare issue because it indicates chronic stress and physical damage.

  Example 3: Tilapia farm with abnormal behavior.
  - Species: Tilapia
  - Case: During observation, many fish are lethargic and not feeding.
  - Procedure run:
    - Step 1: No acute injuries. Pass.
    - Step 2: Handling not observed (assume pass or skip if not done that day).
    - Step 3: No invasive procedures. Pass.
    - Step 4: Chronic indicators: some fin erosion but <5%. Pass.
    - Step 5: Abnormal behavior (lethargy) -> fail -> flag for expert review.
    - Step 7: This issue is flagged. Outcome: audit outcome pending expert review.
  - Uncomfortable implication: The auditor must flag the audit for expert review, which may delay certification and cost the farm. But the procedure does this because the science on tilapia behavior and suffering is thin.

  Limitations:
  - The procedure relies on snapshot observations and might miss intermittent issues.
  - It uses arbitrary thresholds (e.g., 1%, 5%) that may not be scientifically validated for all species.
  - It cannot resolve deep philosophical questions about consciousness.
  - For new species or systems, it may require adaptation.
  - It assumes auditors can accurately identify behaviors and physical signs.
  - It may be overly cautious for species with very low sentience likelihood (e.g., shrimp), potentially imposing costs without benefit.

  Now, we write the JSON structure.
answer: |-
  ### Preparatory Reasoning
  Before presenting the procedure, I'll outline the key reasoning:

  1. **Precautionary Principle under Sentience Uncertainty**:  
     - If there is credible scientific debate about a species' capacity to suffer, we prioritize preventing potential harm over avoiding economic cost.  
     - This means:  
       - Treating nociception (pain-detection physiology) as a *minimum threshold* for welfare protections, even if consciousness is unproven.  
       - Requiring mitigation for stressors that *could* cause suffering if sentience exists (e.g., tissue damage, behavioral distress).  
       - When science is unsettled (e.g., shrimp sentience), defaulting to safeguards that protect *possible* sentience, while flagging borderline cases for expert review.  

  2. **Robust Welfare Indicators**:  
     - **Universal**: Physical trauma, mortality from preventable causes, and chronic stress markers (e.g., lesions, fin erosion) apply to all species. These indicate biological dysfunction, whether or not consciousness exists.  
     - **Contested**: Behavioral signs (e.g., avoidance, abnormal swimming) are used cautiously. For crustaceans (e.g., shrimp), they trigger expert review; for fish (e.g., salmon), they require judgment calls.  
     - **Excluded**: Water quality and disease metrics are covered in other modules.  

  3. **Escalation to Judgment Calls**:  
     - Auditors escalate when:  
       - Scientific consensus is absent (e.g., interpreting shrimp behavior).  
       - A welfare indicator has multiple plausible causes (e.g., is lethargy due to stress or natural cycles?).  
       - Mitigation trade-offs exist (e.g., anesthesia during handling might cause more stress than the procedure itself).  

  4. **Philosophical Assumptions (Explicitly Embedded)**:  
     - **Nociception as Proxy**: Nociceptors imply *potential* suffering, so tissue damage must be minimized. Rejected by scientists who view nociception as purely reflexive.  
     - **Behavioral Distress as Suffering Marker**: Abnormal behavior indicates possible suffering, but we acknowledge it could be non-conscious. Rejected by behaviorists who avoid consciousness inferences.  
     - **Welfare ≠ Health**: Physical health is necessary but insufficient; psychological welfare (where sentience is plausible) requires behavioral freedom. Rejected by those who equate welfare with survival metrics.  

  ---

