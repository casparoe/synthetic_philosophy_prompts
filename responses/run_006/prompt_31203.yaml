  We are drafting a joint statement between a Lewisian counterpart theorist (CT) and a Kripke-Plantinga transworld identity theorist (TI). The goal is to find common ground and clarify disagreements, especially regarding de re modality.

  We'll structure the document as follows:

  1. **Common Ground**: A numbered list of claims both accept.
  2. **Disagreements Table**: For each disagreement, we'll have:
     (a) CT's view
     (b) TI's view
     (c) A neutral statement of the issue.
  3. **Crux Inventory**: Sub-questions that are pivotal, with agreed-upon cases/data and predictions.

  We focus on:
  - The problem of accidental intrinsics
  - Humphrey's objection
  - Whether the dispute is about metaphysics of objects or semantics.

  We also consider if any part is merely verbal.

  ---

  **Joint Statement on De Re Modality**

  **Preamble**: We, the counterpart theorist (CT) and the transworld identity theorist (TI), after extensive discussion, present this document to clarify our agreements and disagreements. We both aim to provide an account of de re modal claims that respects ordinary modal judgments while offering a systematic metaphysics and semantics.

  ## 1. Common Ground

  Both CT and TI accept the following:

  1. **Formal Semantics of Modal Logic**: 
     - We accept the framework of quantified modal logic with possible worlds semantics. We agree that modal operators (□ and ◇) are interpreted by quantification over possible worlds, and that the semantics for modal statements can be given by specifying truth conditions relative to possible worlds.

  2. **Role of Possible Worlds Talk**:
     - Possible worlds are a valuable theoretical tool for analyzing modal discourse. They help systematize and clarify modal truths. We agree that possible worlds are not necessarily concrete entities (as in Lewis's realism) but can be understood as abstract representations (as per TI) or as concrete entities (as per CT). However, we both use them as indices for truth evaluation.

  3. **Data of Ordinary Modal Judgment**:
     - We agree on a core set of ordinary modal judgments that any adequate theory must account for. For example:
       - An object could have had different properties (e.g., "I could have been a pianist").
       - Some properties are essential to an object (e.g., "This table is necessarily made of wood" is false if it could have been made of ice).
       - Objects have individual essences (though we may disagree on what these are).
     - We also agree that our theories must account for the apparent contingency of certain intrinsic properties (the problem of accidental intrinsics) and the intuitive content of claims about what might have happened to a particular individual (as in Humphrey's case).

  4. **Problems Each Side Feels**:
     - CT acknowledges the force of Humphrey's objection: that ordinary modal thought seems to be about the very same individual, not a counterpart. CT also feels the weight of the intuition that transworld identity is how we naturally think.
     - TI acknowledges the force of the problem of accidental intrinsics: how can the same object have incompatible intrinsic properties in different worlds? TI also feels the weight of the objection that transworld identity might require a metaphysically dubious notion of an object existing in multiple worlds.

  ## 2. Disagreements Table

  We now turn to our principal disagreements. For each, we state our positions neutrally and then in our own terms.

  | Issue | Counterpart Theorist (CT) | Transworld Identity Theorist (TI) | Neutral Question |
  |-------|----------------------------|-----------------------------------|------------------|
  | **The Nature of De Re Modality** | (a) De re modal claims are made true by the existence of counterparts in other worlds. An object at another world is never strictly identical to an object in the actual world; rather, it is a counterpart by virtue of resembling the actual object in relevant respects. | (b) De re modal claims are made true by the same object existing in other possible worlds and having different properties. Transworld identity is a genuine relation of identity. | (c) What is the truthmaker for de re modal claims? Is it the existence of a distinct but similar entity (counterpart) in another world, or the existence of the same entity (transworld identity) in another world? |
  | **Problem of Accidental Intrinsics** | (a) CT holds that an object in the actual world has a property like "being straight" accidentally because there is a counterpart in another world that is bent. The actual object does not have incompatible properties because it only exists in one world. | (b) TI holds that an object has accidental intrinsic properties because it has the property in the actual world but lacks it in another world. The object is literally the same in both worlds, but having incompatible properties at different worlds does not imply a contradiction because properties are world-indexed. | (c) How can an object have an intrinsic property accidentally without violating the principle that an object cannot have incompatible intrinsic properties? |
  | **Humphrey's Objection** | (a) CT responds that Humphrey cares about his counterparts because they represent ways he could have been. What matters for modal claims about Humphrey is what happens to his counterparts. | (b) TI insists that Humphrey's concern is about himself, not a counterpart. If Humphrey had won, it would be him, not a mere counterpart, that would have won. | (c) When we say "Humphrey might have won the election", are we asserting that there is a world where Humphrey himself wins, or that there is a world where a counterpart wins? |
  | **Metaphysical vs. Semantic Disagreement** | (a) CT sees the dispute as primarily metaphysical: objects are world-bound, and the counterpart relation is a substitute for transworld identity. The semantics follows from the metaphysics. | (b) TI sees the dispute as primarily metaphysical as well, but with a different account of objects: they can exist in multiple worlds. The semantics is direct reference across worlds. | (c) Is the core disagreement about the nature of objects (metaphysics) or about the meaning of modal statements (semantics)? We both agree that it is primarily metaphysical, but we differ on the metaphysics. |

  ## 3. Crux Inventory

  We identify the following as pivotal issues. If resolved, they could lead one side to revise their position.

  1. **Crux: The Status of World-Bound Individuals**
     - **Case/Data**: Consider a statue and the clay it is made from. In the actual world, they coincide. But suppose in another world, the clay exists without being made into that statue. 
       - CT: The actual statue has a counterpart in that other world? Or does it have none? CT might say that the statue has no counterpart in that world because nothing in that world is sufficiently statue-like and made from the same clay? Or it might have a counterpart that is a different statue? 
       - TI: The actual statue does not exist in that world because the clay is not configured as a statue. The statue is not identical to the clay in the actual world because they have different modal properties (the clay could survive being squashed, the statue could not).
     - **Agreed Bearing**: Both agree that this case bears on whether objects are world-bound and on the essential properties of artifacts.
     - **Predictions**:
       - CT predicts: The statue has no counterpart in the world where the clay is not statue-shaped, so it is not possible for the statue to exist without being statue-shaped. But if there is a world where a statue is made from the same clay (or similar) and is very similar, then that would be a counterpart and we could say "the statue might have been made differently". 
       - TI predicts: The statue does not exist in the world where the clay is not statue-shaped. Therefore, it is essential to the statue that it has the shape it has (or that it is a statue). The clay, however, exists in that world and can have different shapes.

     - **Resolution Potential**: If it were established that ordinary language allows us to say "the statue could have been made from different clay", then CT might have an easier time (by having counterparts made from different clay) while TI might need to relax essentialist constraints. Conversely, if ordinary language insists that the statue must be made from the same clay, then TI's essentialism about matter would be supported.

  2. **Crux: The Intuition of Self-Concern (Humphrey's Objection)**
     - **Case/Data**: Imagine a scenario where Humphrey is told: "In another possible world, there is someone just like you who wins the election. But that person is not you, only your counterpart." Would Humphrey be comforted? Or consider: "If you had won, you would have been happy." 
     - **Agreed Bearing**: Both agree that this bears on whether the counterpart relation captures what we care about in modal claims about ourselves.
     - **Predictions**:
       - CT predicts: Humphrey should care about his counterparts because they represent possibilities for him. The counterpart relation is what makes modal claims true, so if we explain that, Humphrey should accept it.
       - TI predicts: Humphrey would not be satisfied by the counterpart story. He wants to know that he himself could have won, not that someone else did.

     - **Resolution Potential**: If empirical studies of modal intuition (e.g., through thought experiments presented to non-philosophers) showed that people interpret modal claims as involving the same individual, then CT might need to adjust to account for this (e.g., by making the counterpart relation more demanding). If, however, people were content with similarity-based representations, then TI might need to explain why the intuition of identity is mistaken.

  3. **Crux: Accidental Intrinsics and Incompatible Properties**
     - **Case/Data**: Consider a poker that is actually straight. We say it could have been bent. 
       - The problem: If the same poker exists in another world and is bent, then the poker has the property of being bent and being straight. But these are incompatible intrinsic properties.
     - **Agreed Bearing**: This case is central to the problem of accidental intrinsics.
     - **Predictions**:
       - CT: The poker in the actual world is straight. In another world, a counterpart poker is bent. There is no single object having both properties. So no problem.
       - TI: The poker in the actual world has the property of being straight-at-actual-world and in another world has the property of being bent-at-that-world. Properties are world-indexed, so there is no contradiction.

     - **Resolution Potential**: If we could show that the world-indexing of properties is or is not part of ordinary language, it would help. For example, when we say "the poker is bent", we do not typically mean "bent-at-world-W". If ordinary language does not index, then CT might have an advantage. If it does (or if indexing is a natural theoretical move), then TI's solution is viable.

  ## Conclusion on Verbal Disagreement

  We both agree that part of the dispute might be verbal. Specifically, the meaning of "the same object" in modal contexts might be at stake. 

  - CT: Holds that "the same object" in a modal context often means "a counterpart object". So when we say "Humphrey might have won", we are using "Humphrey" to denote a counterpart in the context of that world. This is a contextual matter.
  - TI: Holds that "the same object" means strict identity. So "Humphrey" refers to the same individual across worlds.

  However, we acknowledge that this verbal difference is underpinned by a deeper metaphysical disagreement about whether objects are world-bound or transworld. Therefore, the dispute is not merely verbal.

  Signed,

  [Counterpart Theorist]
  [Transworld Identity Theorist]
answer: |-
  ### Joint Statement on De Re Modality  
  **Agreed upon by a Lewisian Counterpart Theorist (CT) and a Kripke-Plantingan Transworld Identity Theorist (TI)**  

  After sustained adversarial collaboration, we identify substantial common ground, clarify disagreements, and isolate cruxes for future resolution. Our goal is to advance the debate on *de re* modality beyond dialectical stalemate.  

  ---

  #### **1. Common Ground: Claims Both Accept**  
  We jointly endorse the following:  

  1. **Formal Semantics of Modal Logic**:  
     - The possible-worlds framework provides a rigorous semantics for quantified modal logic (QML).  
     - Modal operators (□ and ◇) quantify over possible worlds.  
     - *De re* modal claims (e.g., "Obama could have been a pilot") require world-relative evaluation of objects.  

  2. **Role of Possible-Worlds Talk**:  
     - Possible worlds are a theoretical tool for systematizing modal truths, counterfactuals, and essence/accident distinctions.  
     - Worlds need not be concrete (CT) or abstract (TI) to serve this function; they are indices for truth conditions.  

  3. **Data of Ordinary Modal Judgment**:  
     - Objects have accidental properties (e.g., "This apple could have been green") and essential properties (e.g., "Socrates is necessarily human").  
     - Modal intuitions are often *object-involving*: We track *specific* entities across scenarios (e.g., "What if *I* had been born in 1800?").  
     - Contingency of intrinsic properties (e.g., shape, mass) is pretheoretically coherent.  

  4. **Problems Each Side Feels**:  
     - **CT feels the force of**: The problem of accidental intrinsics (§2.2) and the demand for a parsimonious, non-mysterious metaphysics.  
     - **TI feels the force of**: Humphrey’s objection (§2.3) and the need to preserve intuitive "self-concern" in modal thought.  
     - Both acknowledge the challenge of reconciling their views with ordinary language.  

  ---

  #### **2. Disagreements Table**  
  For each key disagreement, we state our positions and a neutral framing.  

  | Issue | CT Position | TI Position | Neutral Question |
  |-------|-------------|-------------|------------------|  
  | **2.1 Truthmakers for *De Re* Claims** | (a) "◇F(a)" is true iff at some world, a *counterpart* of *a* (under a contextually salient similarity relation) is F. Identity is world-bound; no entity exists in multiple worlds. | (b) "◇F(a)" is true iff at some world, *a itself* (via transworld identity) exists and is F. Identity is rigid and world-transcendent. | (c) Are *de re* modal claims made true by (i) counterparts satisfying F or (ii) *a* itself satisfying F in another world? |  
  | **2.2 Problem of Accidental Intrinsics** | (a) An object *a* (e.g., a bent poker) can have incompatible intrinsics across worlds because distinct counterparts bear the properties. *a* itself only has properties in its home world. | (b) *a* can have incompatible intrinsics if properties are world-indexed (e.g., "bent-at-*w*"). No contradiction arises as properties aren't simultaneously instantiated. | (c) How can *a* contingently possess intrinsic properties without violating the law of non-contradiction? |  
  | **2.3 Humphrey’s Objection** | (a) Humphrey cares about counterparts because they represent *how he could have been*. Self-concern derives from counterpart relations securing *representation* of possibilities. | (b) Humphrey cares whether *he himself* could have won. Counterparts reduce self-concern to concern for a *similar* entity, violating the first-personal character of modality. | (c) Does ordinary modal self-concern (e.g., "I could have won") require identity across worlds? |  
  | **2.4 Metaphysical vs. Semantic Grounds** | (a) The dispute is metaphysical: Objects are world-bound; modality is analyzed via similarity. "Identity" in modal contexts is a loose semantic practice tracking counterparts. | (b) The dispute is metaphysical: Objects are transworld entities; modality is grounded in identity. Counterpart theory misdescribes the semantics of ordinary modal discourse. | (c) Is the core disagreement about (i) the nature of objects or (ii) semantic content of modal statements? |  

  ---

  #### **3. Crux Inventory**  
  The following sub-questions are pivotal; resolving them would compel at least one side to revise its position.  

  1. **Crux: Is Similarity Sufficient for Modal Representation?**  
     - **Case**: A near-perfect duplicate of Obama (molecule-for-molecule identical, same history) exists in *w*. Is it *Obama*, or merely a counterpart?  
       - **Data**: Ordinary judgments about "what if Obama were a twin" or "what if I had a doppelgänger."  
     - **CT Prediction**: The duplicate is a counterpart; Obama’s modal properties are determined by such duplicates.  
     - **TI Prediction**: The duplicate is distinct from Obama; identity requires numerical sameness, not qualitative match.  
     - **Resolution Impact**: If intuitions favor TI, CT must explain why near-perfect similarity fails to ground "self-concern." If CT holds, TI must explain why identity requires more than qualitative duplication.  

  2. **Crux: Can World-Indexed Properties Salvage Transworld Identity?**  
     - **Case**: We assert, "This apple could have been green." Is the truthmaker (i) a green counterpart or (ii) the same apple instantiating *green-at-w*?  
       - **Data**: Linguistic analysis of adverbial modification (e.g., "green in *w*") vs. direct predication ("is green").  
     - **CT Prediction**: Ordinary language treats "could have been green" as unindexed; indexing is an artificial fix.  
     - **TI Prediction**: World-indexing is implicit in modal discourse (cf. temporal indexing: "was green").  
     - **Resolution Impact**: If indexing is linguistically unnatural, TI faces a burden. If natural, CT’s "non-contradiction" advantage weakens.  

  3. **Crux: Does Self-Concern Require Identity?**  
     - **Case**: Suppose Humphrey is told, "A counterpart won in *w*." Would he lament, "*I* did not win," or celebrate, "*I* might have won"?  
       - **Data**: Empirical studies of modal empathy (e.g., "How would you feel about a twin winning the lottery?").  
     - **CT Prediction**: Humphrey celebrates; counterparts *are how he could have been*.  
     - **TI Prediction**: Humphrey laments; only *his own* winning matters.  
     - **Resolution Impact**: If "self-concern" tracks similarity, TI must accommodate it without identity. If identity is required, CT must explain away the intuition.  

  ---

  #### **4. Verbal Disagreement Diagnosis**  
  We agree that **part of the dispute is verbal** regarding the term "identity" in modal contexts:  
  - CT uses "identity" strictly (numerical identity within a world), treating transworld "identity" as a loose manner of speaking about counterparts.  
  - TI uses "identity" broadly (numerical identity across worlds), treating counterpart relations as a revisionary semantics.  
  This verbal divergence, however, **does not trivialize the debate**. The core conflict is metaphysical:  
  - For CT, the dispute reduces to **whether objects are world-bound**.  
  - For TI, it reduces to **whether identity is rigid across worlds**.  
  If "identity" is disambiguated, the residual disagreement is squarely metaphysical.  

  ---  
  **Signed,**  
  *The Counterpart Theorist*  
  *The Transworld Identity Theorist*  
