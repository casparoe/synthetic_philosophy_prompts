answer: |-
  Here's a villanelle that captures the dizzying, self-consuming logic of the paradox, using the form itself as the trap. The refrains are the two halves of the reasoning cycle, chasing each other relentlessly:

  **Envelope Paradox Villanelle**

  I lift the flap and see the coin within, (Line 1)
  A solid sum held steady in my palm. (Line 2)
  *The other holds the double or the half.* (Refrain 1)
  This reasoned voice insists I cannot win (Line 3)
  By standing still; it whispers calm (Line 4)
  I lift the flap and see the coin within. (Line 5 - Refrain 1)

  The math unfolds, a bright arithmetic: (Line 6)
  Half chance of doubling, half of halving loss. (Line 7)
  *Then take the one you haven't opened yet.* (Refrain 2)
  Expected value makes the logic stick — (Line 8)
  A tempting gain outweighs the smaller cost. (Line 9)
  *The other holds the double or the half.* (Refrain 1)

  I switch. New weight. New numbers to unpick. (Line 10)
  But now this sum, once strange, becomes my own, (Line 11)
  *Then take the one you haven't opened yet.* (Refrain 2)
  The same bright math, relentless, sharp, and quick, (Line 12)
  Applies again! The trap is fully grown. (Line 13)
  I lift the flap and see the coin within. (Line 14 - Refrain 1)

  The first choice fades. This new one feels like theft (Line 15)
  Unless I switch once more? The doubt begins. (Line 16)
  *The other holds the double or the half.* (Refrain 1)
  This groundless ground where reason is bereft — (Line 17)
  Where every gain implies potential sins. (Line 18)
  *Then take the one you haven't opened yet.* (Line 19 - Refrain 2)

  No anchor point, no stable place to stand. (Line 20)
  The voices chase: *The other holds...* (Refrain 1)
  *...the one you haven't opened yet.* (Refrain 2)
  I lift the flap, the coin within my hand, (Line 21 - Refrain 1)
  *Then take...* The choice becomes the voice's net. (Line 22 - Refrain 2)
  *The other holds the double or the half,* (Refrain 1)
  *Then take the one you haven't opened yet.* (Refrain 2)

  ---

  **How this embodies your vision:**

  1.  **The Refrains as Paradoxical Voices:**
      *   **Refrain 1:** "*The other holds the double or the half.*" This is the core premise driving the calculation. It sounds factual, neutral.
      *   **Refrain 2:** "*Then take the one you haven't opened yet.*" This is the conclusion drawn from that premise and the expected value calculation. It sounds like imperative advice, the "rational" action.
      *   Together, they form the loop: Premise -> Calculation -> Action -> (Leads back to Premise).

  2.  **The Dizziness & Trap:**
      *   The poem starts with discovery (Line 1) and initial calm (Line 2).
      *   Refrain 1 introduces the seed. Refrain 2 gives the first command (Stanza 1).
      *   Stanza 2 explains the math explicitly ("bright arithmetic", "expected value").
      *   Stanza 3 enacts the switch ("I switch. New weight.") and the immediate realization that the *same logic applies again* ("The same bright math... Applies again! The trap is fully grown."). Refrain 1 (Line 14) now feels like looking at a *new* envelope after switching.
      *   Stanza 4 captures the growing doubt and instability ("groundless ground," "doubt begins"). The refrains feel less like guidance and more like compulsions.
      *   Stanza 5 shows the complete collapse: "No anchor point," "The voices chase." The refrains are explicitly named as voices driving the speaker. The final two lines land together, not as resolution, but as the inescapable, self-referential trap. Choosing becomes indistinguishable from the voice commanding the choice ("The choice becomes the voice's net"). The refrains *are* the paradox.

  3.  **Form as Paradox:**
      *   Just as the expected value calculation demands switching *no matter which envelope you hold or what amount you see*, the villanelle *demands* the return of the refrains *no matter what the preceding stanza says*. The structure is relentless.
      *   The inability of the poem to break free from its refrains mirrors the inability of the reasoning to break free from its own circular logic without introducing external assumptions (which the poem deliberately avoids).
      *   The final couplet forces the two refrains together, revealing their interdependence and how they lock the speaker (and the reasoner) into the loop. "The choice becomes the voice's net" explicitly states that the action (switching) is ensnared by the very reasoning that prompted it.

  4.  **Accessibility & Recognition:**
      *   Phrases like "double or the half," "expected value," "switch," "the one you haven't opened yet," and the focus on the *reasoning* make the paradox clear to those who know it.
      *   For those unfamiliar, the progression from calm discovery, through logical persuasion, into confusion, doubt, and entrapment by "voices" and a "net" creates the feeling of being pulled in two directions and caught in an unsolvable loop. The mathematical terms ("arithmetic," "half chance") hint at the source without requiring deep understanding.

  The poem doesn't solve the paradox; it *performs* it, letting the villanelle's inherent structure of recurring inevitability embody the dizzying, self-defeating logic that "drives you nuts." The trap snaps shut in the final couplet.
