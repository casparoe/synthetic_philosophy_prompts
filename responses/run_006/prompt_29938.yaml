  So the disagreement might be in whether the message should be taken as evidence about the termites when evaluating the causal effect. 

  The version of CDT that ignores the message would say: without the message, we only have the prior on T. Then the causal effect of paying is to reduce your wealth by $1,000 without changing T, so it's bad. 

  But if you condition on the message, you get a different posterior on T, and then the causal effect of paying is still -$1,000, but now the expected termite damage is affected by the information from the message. 

  However, note: in the conditional distribution (given M=1), the termite damage cost is not affected by paying. But the information from the message tells you that if you pay, then there are no termites, and if you don't, then there are termites. 

  So the two actions (pay and not pay) lead to different conclusions about the termites. And that is what EDT uses. 

  But CDT, even after conditioning on the message, should recognize that paying does not cause the termites to go away. However, it also recognizes that the message has given you information. The key is that the information is not causal: it is diagnostic. 

  But in our do-calculus computation, we see that after conditioning on the message and then intervening on P, the expected value of T changes. Why? Because the message is a collider and conditioning on it with the intervention sets up a deterministic relationship. 

  In summary, the potential outcomes framework (with the do-calculus) actually shows that if you condition on the message, then CDT and EDT both recommend paying. 

  But the initial description of the problem claims that CDT recommends not paying. This suggests that there might be a different interpretation. 

  One possibility: the initial description might be from a source that uses a different formulation of CDT that does not condition on the message? Or perhaps they argue that the message is not part of the background knowledge when making the decision? 

  However, if we do not condition on the message, then the decision is made without the message. But you have received the message, so you must use it. 

  **Residue for XOR Blackmail:**
  - The potential outcomes framework (with do-calculus) can model the problem and shows that conditioning on the message and then intervening leads to the same conclusion as EDT: pay.
  - The initial claim that CDT says not to pay is either based on not conditioning on the message or on a different causal structure.

  ### Overall Residue Report

  **What translates cleanly:**
  - The structure of the decision as a treatment assignment problem.
  - The potential outcomes in each branch or under each treatment.
  - The role of pre-treatment variables (like the coin flip or the termites).
  - The assignment mechanism for the treatments (random coin flip, or chosen by the agent).
  - The do-calculus for computing causal effects in the presence of confounding by observation (like conditioning on the message).

  **What had to be fudged or stretched:**
  - In Counterfactual Mugging, the potential outcome in one world (heads) depends on the treatment in another world (tails). This cross-world dependence is not standard in the potential outcomes framework (which typically assumes SUTVA). We had to consider the entire scenario as a unit and the decision rule as the treatment. Or we had to consider the expected utility of the decision rule across the branches.
  - In XOR Blackmail, the initial claim about CDT not recommending payment did not hold up in our do-calculus analysis. This suggests either a misinterpretation in the initial description or a different variant of CDT. We had to leave open why the initial claim was made.

  **What has no expression:**
  - The idea of a decision rule that applies across different possible states (as in UDT) is not a standard concept in causal inference. However, we captured it by averaging over the states (coin flip) to compute the expected utility of the rule.
  - The exact reason for the disagreement in the literature on XOR Blackmail is not fully resolved by our analysis. We found that conditioning on the message leads both EDT and CDT to recommend paying. This suggests that the initial description might be flawed or that there is a deeper philosophical disagreement about conditioning.

  **Does the residue point to something missing?**
  - The cross-world dependence in Counterfactual Mugging points to a limitation of the potential outcomes framework. The framework is designed for observed and counterfactual outcomes in the same unit. Here, we have two different units (worlds) and the outcome in one unit depends on the treatment in another. This is not typical. Pearl's framework with possible worlds might be more natural, but even there, cross-world dependencies are handled with care.
  - In XOR Blackmail, our analysis did not confirm the initial claim about CDT. This suggests that the decision-theory debate might be affected by how we specify the background knowledge and the causal graph. It might also be that in some formulations of CDT, you are not allowed to condition on variables that are affected by the treatment (even if they are pre-treatment in the current context). 

  **Conclusion:**
  The potential outcomes framework and do-calculus can handle both problems, but with some stretching for cross-world dependencies. The disagreements among decision theories seem to arise primarily from:
  - Whether to condition on the current state (as in the coin flip) or not (UDT vs CDT/EDT).
  - How to handle evidence from the action (EDT conditions on the action, CDT does not in its effect estimation but does in the background knowledge).

  However, in the case of XOR Blackmail, our analysis suggests that when properly conditioned on the available information (the message), both EDT and CDT agree. This may indicate that the initial presentation of the problem was oversimplified or that there is a variant of CDT that does not use the message appropriately.

  Overall, the decision-theory debates highlight aspects of causal reasoning that are not always at the forefront in applied work: the importance of the choice of conditioning set and the handling of cross-world counterfactuals. But the potential outcomes framework is expressive enough to capture the scenarios, albeit with some non-standard elements.
