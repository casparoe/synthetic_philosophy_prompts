  ### Systematic Translation into Potential-Outcomes Framework

  #### **Counterfactual Mugging**
  **Structure and Key Elements:**
  - **Units**: Two parallel "universes" (coin-flip branches), indexed by $C$:  
    - $C=1$ (heads universe)  
    - $C=0$ (tails universe)  
  - **Treatment**: Payment decision in the tails branch ($T_{\text{tails}}$):  
    - $T_{\text{tails}}=1$ (pay $100)  
    - $T_{\text{tails}}=0$ (don't pay)  
  - **Outcome**: Net monetary gain ($Y$), defined per universe.  
  - **Assignment Mechanism**:  
    - $C \sim \text{Bernoulli}(0.5)$ (fair coin flip).  
    - $T_{\text{tails}}$ is chosen by the agent in the tails universe.  
    - $T_{\text{heads}}$ is **not assigned**; it's counterfactually defined by $T_{\text{tails}}$ via Omega's prediction.  
  - **Potential Outcomes**:  
    - For $C=0$ (tails): $Y(0, T_{\text{tails}}) = -100 \cdot T_{\text{tails}}$ (immediate loss if pay).  
    - For $C=1$ (heads): $Y(1, T_{\text{heads}})$ is **not realizable**; instead, $Y(1) = 10,000 \cdot I(T_{\text{tails}}=1)$ (reward iff $T_{\text{tails}}=1$ would have occurred).  
  - **Observed Data**:  
    - You observe $C=0$ (tails), so $Y(0, T_{\text{tails}})$ is observed for your chosen $T_{\text{tails}}$.  
    - $Y(1)$ is **missing** (heads universe is counterfactual).  
  - **Confounding**: None. $C$ is randomized, and $T_{\text{tails}}$ is freely chosen.  
  - **Key Dependence**: $Y(1)$ depends on $T_{\text{tails}}$ via cross-world counterfactual linkage (violates SUTVA).  

  **Decision Theories Translated:**  
  - **Causal Decision Theory (CDT)**:  
    - Focuses on *local* causal effect in the observed universe ($C=0$).  
    - Treatment effect: $\tau_{\text{local}} = Y(0,1) - Y(0,0) = -100 - 0 = -100$.  
    - Conclusion: Don't pay ($T_{\text{tails}}=0$) to avoid $100 loss. Ignores $Y(1)$ as irrelevant.  
  - **Evidential Decision Theory (EDT)**:  
    - Conditions on observed $C=0$. Payment $T_{\text{tails}}$ provides *no evidence* about $C=1$ (since $C$ is fixed), so infers no gain.  
    - Conclusion: Same as CDT.  
  - **Updateless Decision Theory (UDT)**:  
    - Maximizes *pre-coin-flip expected utility*:  
      $E[Y] = 0.5 \cdot Y(1) + 0.5 \cdot Y(0, T_{\text{tails}})$.  
    - Chooses $T_{\text{tails}}=1$ to maximize $E[Y]$:  
      $E[Y \mid T_{\text{tails}}=1] = 0.5 \cdot 10,000 + 0.5 \cdot (-100) = 4,950$  
      $E[Y \mid T_{\text{tails}}=0] = 0.5 \cdot 0 + 0.5 \cdot 0 = 0$.  
    - Conclusion: Pay to secure high $Y(1)$.  

  **Why Disagreement?**  
  CDT/EDT ignore cross-world effects and condition on $C=0$. UDT optimizes globally over all counterfactual branches.  

  ---

  #### **XOR Blackmail**
  **Structure and Key Elements:**  
  - **Units**: Single agent facing a pre-treatment state (termite status $T$) and a message $M$.  
  - **Treatment**: Payment decision ($P$):  
    - $P=1$ (pay $1,000)  
    - $P=0$ (don't pay)  
  - **Outcome**: Net loss ($Y$): $Y = -1,000,000 \cdot T - 1,000 \cdot P$.  
  - **Pre-Treatment Variable**:  
    - $T \sim \text{Bernoulli}(p)$ (termites present, unknown to agent).  
  - **Assignment Mechanism**:  
    - $M = I(T \oplus P = 1)$ (message sent iff $T$ and $P$ differ).  
    - $P$ is chosen by the agent after observing $M=1$.  
  - **Potential Outcomes**:  
    - $Y(P) = -1,000,000 \cdot T - 1,000 \cdot P$ (causally, $P$ doesn’t affect $T$).  
  - **Observed Data**: $M=1$ is observed (message received).  
  - **Confounding**: None. $T$ is pre-treatment, and $P$ is chosen.  

  **Decision Theories Translated:**  
  - **Causal Decision Theory (CDT)**:  
    - Uses *do-operator*: $E[Y \mid do(P), M=1]$.  
    - $P$ has no causal effect on $T$, so:  
      $E[Y \mid do(P=1), M=1] = -1,000,000 \cdot E[T \mid M=1] - 1,000$  
      $E[Y \mid do(P=0), M=1] = -1,000,000 \cdot E[T \mid M=1]$.  
    - Treatment effect: $\tau_{\text{do}} = -1,000$ (always lose more if pay).  
    - Conclusion: Don't pay ($P=0$).  
  - **Evidential Decision Theory (EDT)**:  
    - Conditions on $M=1$ and *chooses* $P$:  
      - If $P=1$, $M=1 \implies T=0$ (since $T \oplus 1 = 1 \iff T=0$).  
      - If $P=0$, $M=1 \implies T=1$ (since $T \oplus 0 = 1 \iff T=1$).  
    - Expected outcomes:  
      $E[Y \mid P=1, M=1] = -1,000$ (no termites)  
      $E[Y \mid P=0, M=1] = -1,000,000$ (termites present).  
    - Conclusion: Pay ($P=1$) to avoid large loss.  

  **Why Disagreement?**  
  CDT ignores *diagnostic evidence* from $P$ about $T$. EDT uses $P$ to update beliefs about $T$ but confounds causation and evidence.  

  ---

  ### Residue Report: What Translates, What Doesn’t, and Why

  #### **Clean Translation**  
  1. **Treatments and Outcomes**:  
     - Both problems map cleanly to binary treatments ($T_{\text{tails}}$, $P$) and continuous outcomes ($Y$).  
  2. **Assignment Mechanisms**:  
     - Randomization of $C$ (coin flip) and agent-chosen treatments fit standard causal inference.  
  3. **Ignorability and Confounding**:  
     - No unmeasured confounders (randomized or chosen treatments).  
  4. **Causal Effects (CDT)**:  
     - Local effects (e.g., $\tau_{\text{local}}$ in mugging, $\tau_{\text{do}}$ in blackmail) translate directly.  
  5. **Pearl’s Do-Calculus (for CDT)**:  
     - Clarifies that $E[Y \mid do(P)]$ in blackmail ignores evidence from $P$.  

  #### **Stretched or Fudged**  
  1. **Cross-World Counterfactuals (Mugging)**:  
     - $Y(1)$ depends on $T_{\text{tails}}$ in another "universe". This violates SUTVA (treatment assigned in one unit affects another’s outcome). Potential outcomes assume SUTVA, so this requires conceptual stretching.  
  2. **Pre-Choice Predictions (Both)**:  
     - Omega’s prediction assumes deterministic $T_{\text{tails}}$ or $P$. Potential outcomes typically allow stochastic treatments, but perfect prediction forces determinism.  
  3. **EDT’s Evidential Reasoning (Blackmail)**:  
     - Translating $E[Y \mid P, M=1]$ requires conditioning on the *act of choosing* $P$, which blends evidence with action. This is unnatural in causal inference, where actions are interventions ($do(P)$), not observations.  

  #### **No Expression in Potential Outcomes**  
  1. **Updatelessness (Mugging)**:  
     - UDT’s optimization over *all counterfactual branches* has no analog. Potential outcomes focus on realized or single-world counterfactuals (e.g., $Y(1)$ for observed units), not global decision rules.  
  2. **Self-Referential Predictions (Both)**:  
     - Omega’s prediction creates a fixed point: Your choice determines the prediction that influenced the outcome. This circularity isn’t naturally handled.  
  3. **EDT’s Vulnerability to Money Pumps**:  
     - Claims that EDT invites exploitation (e.g., repeated blackmail) rely on dynamic consistency issues absent in static PO frameworks.  

  #### **Does the Residue Point to a Gap?**  
  - **Yes, for UDT and Self-Referentiality**:  
    Potential outcomes lack machinery for:  
    - Global decision rules (UDT) optimizing over counterfactual worlds.  
    - Fixed-point reasoning (Omega’s prediction ties your action to outcomes across worlds).  
    This suggests a substantive gap: **cross-world counterfactual dependence** and **pre-commitment strategies** are real decision-theoretic structures not captured in standard causal models.  

  - **No, for EDT-CDT Disagreements**:  
    The blackmail "disagreement" partially dissolves under PO analysis:  
    - CDT’s "don’t pay" relies on $E[T \mid M=1]$ being *unaffected* by $do(P)$.  
    - EDT’s "pay" arises only if you misapply conditioning (interpreting $P$ as evidence, not intervention).  
    Here, the residue reflects **ambiguity in conditioning sets**, not deep causal structure. PO + do-calculus clarifies that CDT is internally consistent, while EDT conflates seeing and doing.  

  #### **Conclusion**  
  - **Translatable Core**: Treatments, outcomes, randomization, and local effects map cleanly. Do-calculus resolves CDT positions.  
  - **Gaps**: Cross-world dependencies (mugging) and self-referential predictions require extensions beyond SUTVA. UDT’s "updatelessness" has no PO equivalent, suggesting a limitation for dynamic decisions.  
  - **Recommendation**: For decision theory, embrace **global expected utility** (like UDT) as a formal extension to PO. For causal purity, reject EDT’s evidential leaps as conflating $E[Y \mid P]$ with $E[Y \mid do(P)]$. The "residue" highlights genuine challenges in multi-world optimization, not just philosophical noise.
