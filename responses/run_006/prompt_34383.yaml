  ## Hospital Ethics: A Dose of Disagreement

  **Setting:** A stark hospital conference room. Dr. ARYA (Utilitarian) paces, while Dr. BEN (Scanlonian Contractualist) sits calmly. A vial of "NeuroRegen" rests on the table – the last dose.

  **Dr. Arya (Utilitarian):** Ben, the math is undeniable. NeuroRegen can save Mr. Henderson's life, *or* we can dilute it to relieve the debilitating migraines plaguing 50 patients in Ward B. Henderson has a 90% chance of dying without it. Each migraine patient loses, on average, 8 hours of excruciating pain per day without relief. Giving it to Henderson saves one life. Diluting it gives roughly 400 hours of severe suffering alleviated *per day* for a week. The sheer quantity of suffering prevented... it dwarfs the single loss. We *must* maximize well-being.

  **Dr. Ben (Contractualist):** Arya, it’s precisely that "dwarfs" I object to. You’re adding up hundreds of hours of intense pain and comparing the sum to the loss of a life. But to *whom* are you justifying this choice? To Mr. Henderson? Can you look him in the eye and say, "Your life is ending because relieving 50 headaches *added together* is more important"? What principle could he possibly accept that allows his fundamental interest in continued existence to be traded away for the aggregated, lesser burdens of others? He could reasonably reject any principle permitting that.

  **Dr. Arya:** Reasonably reject? Ben, he’s *one* person! His rejection is based on an understandable, but ultimately self-centered, perspective. Morality requires us to step outside ourselves. Think of the impartial spectator – the view from nowhere. From that vantage, the total misery in Ward B *is* a greater moral evil than one death. It’s not bad arithmetic; it’s recognizing that pains, even smaller ones, are real, additive harms. Ignoring the numbers is ignoring the suffering of the many for the sake of the one. Is *that* reasonable?

  **Dr. Ben:** It’s not about ignoring the many, Arya. It’s about what kind of justification we owe to *each individual*. To each migraine sufferer, I can say: "We cannot give you relief because the drug is needed to save a life. We recognize your pain is real and significant, but the principle we follow prioritizes preventing the most severe, irreparable harm to any one person when resources are scarce. Your burden, while awful, is not comparable to the loss of existence." That principle – prioritizing the prevention of catastrophic loss to an individual over aggregated lesser harms – is one each migraine patient could potentially accept *without* feeling their fundamental status is denied. They still have a complaint, but it’s against scarcity, not against a principle that trades their *type* of claim for a life.

  **Dr. Arya:** But Ben, that principle seems arbitrary! What if it were 500 migraine patients? 5000? A million? At some point, the sheer *scale* of the suffering *must* outweigh a single life, even on your view. Otherwise, you're saying a headache, multiplied enough times, is *never* worse than death? That defies any coherent sense of value. Where's your threshold? And what do you say to the *collective* of migraine patients? "Sorry, your combined agony, even though it's orders of magnitude greater in sheer suffering-hours, simply doesn't count against one life"? That feels like an irrational refusal to aggregate, a fetishization of the individual claim.

  **Dr. Ben:** It's not that the suffering "doesn't count." It counts immensely! And numbers *do* matter, Arya, crucially, but in a different way. Imagine a different scenario: diverting an ambulance causing a 5-minute delay for 100 drivers vs. causing a 1-hour delay for one driver. A principle allowing the small aggregated delays to prevent the large single delay seems reasonable; no one could reasonably reject it based on their individual burden. The *burdens are comparable in kind and severity*. The problem arises when the harms are of fundamentally *different orders* – existence versus severe pain. For harms of *similar* magnitude and kind, numbers *can* justify imposing a smaller burden on each of many to prevent a larger burden on one. But trading existence for aggregated pain? The discontinuity is too great. The person facing annihilation isn't just suffering *more*; they are suffering the loss of *everything*. That creates a special justificatory burden no sum of lesser burdens can meet for *that individual*.

  **Dr. Arya:** But that "special burden" is exactly what I dispute from the impersonal moral standpoint. Life *is* valuable precisely because of the conscious experiences it contains – the joys and the pains. Preventing vast sums of intense pain *preserves* more of that valuable conscious experience than saving one life. It *is* about arithmetic, Ben – the arithmetic of sentience. Telling Mr. Henderson isn't about justifying it *to him personally* as if his subjective outrage vetoes the greater good; it's about explaining the tragic necessity of an impartial calculus that minimizes total suffering in an imperfect world. We say, "Your death is a profound tragedy, but the alternative condemns fifty others to prolonged agony. We chose the path that prevents the greater overall misery." His life isn't "traded" for headaches; it's that saving him would require accepting an even greater sum of suffering elsewhere, which we cannot morally do.

  **Dr. Ben:** And that justification, Arya, reduces Mr. Henderson to a vessel of experiences whose value can be summed against others. He becomes a statistic. Contractualism insists justification must be *to persons*, respecting their separate, inviolable status. "Greater overall misery" only makes sense if you can add across persons. I deny that moral mathematics works that way for fundamental interests. To Mr. Henderson, the principle you invoke *does* treat his life as fungible with enough headaches. That is what he can reasonably reject. The alternative is to accept a principle where any individual, no matter how vital their interest, can be sacrificed if enough others have a countervailing, lesser interest. That creates a terrifying vulnerability for everyone.

  **Dr. Arya:** And your alternative risks paralyzing us in the face of vast, diffuse suffering, prioritizing the one dramatic tragedy over the quiet agony of the multitude. It *is* terrifying, Ben, but perhaps the vulnerability lies in clinging to an individualistic justification that fails the demands of collective welfare in a complex world. We must be able to add, or morality becomes impossibly myopic.

  *(They stare at the vial, the weight of the decision hanging heavy.)*

  ---

  **Confidence Note:**

  *   **Representation of Scanlonian Contractualism (Ben):** **High Confidence.** The core argument – rejection of interpersonal aggregation for justifying serious losses, the focus on justifiability *to each individual* affected, the distinction between comparable burdens (where numbers matter) and discontinuous harms (where they don't easily) – is central to Scanlon's *What We Owe to Each Other* and his responses to critics like John Taurek. The "reasonable rejection" framework and the emphasis on the *kind* of justification owed are accurately portrayed.
  *   **Representation of Utilitarianism (Arya):** **High Confidence.** The focus on maximizing aggregate well-being (suffering alleviated), the appeal to an impartial perspective ("view from nowhere"), the insistence that pains are additive harms, the challenge of thresholds for the contractualist, and the framing of the justification as a tragic necessity of minimizing total suffering are core utilitarian commitments, well-represented by thinkers like Bentham, Sidgwick, and Singer.
  *   **The Move of Least Certainty:** Ben's distinction between "comparable burdens" (delays) and "discontinuous harms" (life vs. pain) is key to his position. While Scanlon clearly argues for this discontinuity, **I'm least confident about precisely *how* sharp or defensible this line is.** Critics (and some utilitarians like Arya) argue the distinction is arbitrary or fuzzy. How severe must the "lesser" harm be before numbers *can* outweigh a life? Is intense, lifelong paralysis different from migraines? Contractualism offers principled reasons *why* life is discontinuous, but drawing the exact boundary in practice is a point of ongoing debate *within* contractualism and is the most vulnerable point in Ben's argument to the utilitarian's "slippery slope" challenge.
