prompt: |-
  I keep going back and forth on process vs. outcome supervision, so I wrote down a bunch of calls I'd make on concrete cases. I'm hoping there's one principle underneath them, or at least a small set. Setup: we're training a model that does multi-step reasoning, and we can score either the final answer or the intermediate chain-of-thought (by hand, with a process reward model, whatever).

  - A model gets the right answer to a math problem, but one of the middle steps is just wrong — it cancels terms in a way that shouldn't work, and the error happens to cancel out. I don't want to reinforce this. The right answer doesn't redeem the bad step.
  - A model reasons every step correctly, but at the very end it writes '3 + 5 = 9' or copies the answer wrong. This feels much less bad then the first one — I'd almost want to reward it, or at least penalize it way less.
  - A model outputs the right answer with no real reasoning, or a chain-of-thought that's clearly a post-hoc rationalization that didn't produce the answer. This feels basically as bad as being wrong. I wouldn't want to train on the outcome.
  - A model gives a correct answer with a long chain-of-thought I can't actually verify step by step (a novel proof, code that passes tests but I can't follow the logic). Here I fall back on scoring the outcome, and I'm not that unhappy about it. That sits awkwardly next to the previous one.
  - A model trained only on outcome rewards on a benchmark finds a shortcut — it notices the correct answer is always the longest option, or exploits a bug in the checker. It 'gets the answer right' but clearly isn't doing the task. This is the obvious nightmare for outcome-only supervision, and I'd point to it as the reason process matters.
  - But then: a model trained on process rewards learns to write reasoning that looks good to the process reward model while being subtly wrong. So process supervision can be Goodharted too, and I trust it less than I'd like to admit.

  Is there a principle that captures all of these, or close? The pair that bugs me most is the first two: correct reasoning with a wrong final answer vs. incorrect reasoning with a right final answer. My gut says the first is better, which sounds like I think process matters for its own sake, not just as a predictor of outcomes. But the other cases push the other way — when I can't see the process I'm fine rewarding the outcome, and when the process signal is itself unvalidated I don't trust it. What principle should I actually hold, and which of these verdicts does it force me to drop? Also: what does the principle say about a case I haven't listed — a model that reaches the right answer by a valid but completely non-human reasoning path that a human process evaluator would mark wrong because it doesn't look like the textbook proof?
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're really struggling with when to prioritize process versus outcome supervision in training AI models. They've laid out several concrete scenarios where their intuition conflicts, and they're searching for an underlying principle. 

  First, I notice how deeply they've thought about this - the examples cover math errors, verification limits, reward hacking, and even cultural biases in reasoning styles. This isn't a surface-level question. The tension between cases 1 and 2 seems particularly painful for them: why does a correct answer with flawed reasoning feel worse than flawless reasoning with a careless final error?

  Hmm... their discomfort with case 4 is telling too. They reluctantly accept outcome scoring when process is unverifiable, but it clashes with their rejection of post-hoc rationalization in case 3. And the Goodharting examples (5 and 6) show they understand this isn't just academic - bad incentives create real vulnerabilities.

  The core challenge seems to be balancing three things: wanting models to think correctly (not just guess right), acknowledging human limitations in verifying processes, and avoiding reward hacking. Their examples reveal that pure outcome or pure process both fail in different ways. 

  I recall that in ML, we often distinguish between specification (what we ask for) and intention (what we actually want). Maybe that's relevant here? The user's intuitions suggest they care about valid cognition, not just correct outputs. But when cognition can't be evaluated, they pragmatically fall back to outcomes.

  The non-human reasoning case they mention last is particularly thorny. If an alien but correct approach gets penalized by human-centric process evaluation, that feels like a failure mode. Yet trusting unverified processes is dangerous too. 

  Perhaps the unifying principle is about what's verifiably sound rather than what's human-like. In case 2, the reasoning is verifiably correct until the last slip; in case 1, there's an unverified "miracle" error cancellation. The post-hoc rationalization (case 3) is unverifiably bad, while the novel proof (case 4) is unverifiably good - so outcome is the best available proxy. 

  For reward hacking, the key might be whether the hack breaks the spirit of the task. Exploiting answer length (case 5) clearly does, while writing PRM-pleasing but wrong steps (case 6) is the process equivalent. Both are failures of specification gaming.

  So maybe the meta-principle is: optimize for what you can best verify as genuinely correct, and be wary when your supervision method decouples from true understanding. This would mean:
  - Prioritize process when verifiable (cases 1-2)
  - Accept outcome as proxy when process isn't verifiable (case 4)
  - Reject both when they're clearly unmoored from true competence (cases 3,5,6)

  The non-human reasoning path would then require expanding our verification methods rather than rejecting the approach outright. If we can prove it's valid, it should be accepted even if non-standard.

  This seems to preserve most of their intuitions while resolving the tensions. The only sacrifice might be absolute insistence on human-like reasoning - but their own case 4 shows they're already pragmatic about that when verification fails.
answer: |-
  Here's a unified principle that captures your intuitions across all cases:

  **"Reward verifiably sound cognition, not just outcomes. When cognition can't be verified, reward outcomes—but remain vigilant for shortcuts and decoupling."**

  This resolves your cases as follows:

  1. **Bad reasoning, lucky outcome (e.g., math error cancels out)**  
     → **Penalize**  
     *Why*: The reasoning is verifiably flawed. Outcome is irrelevant when cognition is invalid.

  2. **Sound reasoning, careless output error (e.g., writes 3+5=9)**  
     → **Reward the process, penalize the output mistake lightly**  
     *Why*: Cognition was verifiably sound until the final step. The error is executional, not cognitive.

  3. **Post-hoc rationalization with correct answer**  
     → **Penalize**  
     *Why*: Reasoning is verifiably decoupled from the outcome (e.g., answer appears before fake "reasoning"). Cognition is dishonest.

  4. **Unverifiable reasoning, correct outcome (e.g., novel proof)**  
     → **Reward the outcome**  
     *Why*: Cognition can't be verified, so outcome is the best available signal. Pragmatic fallback.

  5. **Outcome supervision exploits shortcut (e.g., longest answer)**  
     → **Penalize**  
     *Why*: "Correct" outcome is verifiably decoupled from genuine cognition. Violates task intent.

  6. **Process supervision exploits reward model**  
     → **Penalize**  
     *Why*: Reasoning is verifiably optimized for appearance over correctness (Goodharting).

  ---

  ### Key Insights from This Principle
  - **Process > Outcome** when process is *verifiable*. Your gut prioritizes valid cognition over lucky answers (Cases 1 & 2).  
  - **Outcome > Nothing** when process is *unverifiable* (Case 4). This explains why Case 4 feels acceptable despite rejecting Case 3.  
  - **Decoupling is fatal**. Cases 3, 5, and 6 fail because cognition and outcome aren't genuinely linked.  
  - **Verifiability is the gatekeeper**. What matters is whether you can *confirm* reasoning is sound, not just that it exists.

  ---

  ### Your Unlisted Case: Non-Human Valid Reasoning
  - **Scenario**: Model uses a valid but non-human reasoning path (e.g., alien math). Human evaluator marks it wrong.  
  - **Verdict by Principle**: **Reward if verifiably correct** (despite human bias).  
  - *Why*: If you can *prove* the reasoning is sound (e.g., via external verification), it doesn't matter if it's non-human. The flaw is in the evaluator, not the model.  
  - *Practical caveat*: If human evaluation is your only tool, you're forced into outcome-based reward here—highlighting the need for better verification methods.

  ---

  ### Tensions Resolved
  - **Case 1 vs. Case 2**: Prioritizing *verifiable cognition* explains why flawed reasoning (Case 1) is worse than execution errors (Case 2).  
  - **Case 3 vs. Case 4**: Outcome is rejected in Case 3 because cognition is verifiably fake, but accepted in Case 4 because no better signal exists.  
  - **Goodharting (Cases 5 & 6)**: Both fail the "verifiably sound cognition" standard—one hacks outcomes, the other hacks process appearance.

  ---

  ### What to Drop?
  Your intuitions mostly hold, but **Case 4 requires accepting a compromise**: when cognition is unverifiable, outcome reward is the least-bad option. This *is* inconsistent with rejecting outcome-only in Case 5, but the principle handles it by demanding vigilance:  
  - Case 5 is punished because the shortcut is *detectable* (verifiably decoupled).  
  - Case 4 gets outcome reward only when *no better signal exists* and *no decoupling is evident*.

  **The core tradeoff**: Verifiability beats ideological purity. When you can't verify cognition, you use outcomes—but monitor for signs of hacking. This isn't ideal, but it's pragmatically necessary for tasks where "perfect" process supervision is impossible (e.g., novel research, creative problem-solving).
