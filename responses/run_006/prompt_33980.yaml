prompt: |-
  I'm a theoretical computer scientist with a working knowledge of computability theory, formal systems, and the halting problem — I can follow a proof that Peano arithmetic is incomplete and I understand why the halting problem is undecidable — but I have no background in philosophy of mind. I keep encountering the claim, associated with Lucas and Penrose, that Gödel's incompleteness theorems show that the human mind is not a Turing machine, or more broadly that no formal system can capture human mathematical reasoning. Restate this argument, or the strongest version of it you can construct, entirely in the vocabulary I know: Turing machines, formal systems, consistency, ω-consistency, provability predicates, the halting problem, oracle machines, and so on. Do not rely on notions like "seeing the truth of a Gödel sentence" unless you can cash them out in my terms. Then give me the residue report: which steps of the argument translate cleanly into claims about formal systems and computability, which steps require a leap that my vocabulary cannot express, and whether the untranslatable residue points to something my framework is missing or to a confusion in the original argument. I want to know whether this is a genuine result about computation or a philosophical claim dressed in formal clothing.
reasoning: |-
  We are going to reconstruct the Lucas-Penrose argument in formal terms and then analyze it.

  The argument, as presented by Lucas and Penrose, attempts to use Gödel's incompleteness theorems to show that the human mind (or at least the mathematical reasoning of the mind) cannot be captured by any formal system (and hence not by a Turing machine). We will try to build the strongest version of the argument using the requested vocabulary.

  Step 1: Setting up the formal system
  Assume that human mathematical reasoning can be captured by a formal system F. We think of F as a recursively axiomatizable formal system that is sufficiently powerful to formalize a certain amount of arithmetic (say, at least as strong as Robinson's Q, but typically we assume it includes PA or more). We also assume that F is consistent (otherwise it would be trivial and not capture sound human reasoning).

  Step 2: The Gödel sentence
  By Gödel's first incompleteness theorem, if F is consistent, then there is a sentence G_F (the Gödel sentence for F) that is true (in the standard model of arithmetic) but not provable in F. The standard construction of G_F is such that it asserts its own unprovability in F: G_F <=> ~Bew_F(#G_F), where Bew_F is the provability predicate for F and #G_F is the Gödel number of G_F.

  Step 3: The mind's ability to see the truth of G_F
  The argument then claims that a human mathematician, understanding the construction of G_F and knowing that F is consistent, can see that G_F must be true. This is because:
    - If F is consistent, then F cannot prove G_F (by Gödel's theorem).
    - But G_F is equivalent to "G_F is not provable in F".
    - Therefore, since F cannot prove G_F, then what G_F states is true: namely, that G_F is not provable in F.

  Hence, the human concludes that G_F is true.

  Step 4: Beyond any fixed formal system
  Now, the human mind (or at least the mathematical reasoning of the mind) is supposed to be captured by F. But we have just shown that the human mind can prove G_F (by the above reasoning) while F cannot. Therefore, the human mind is not captured by F.

  Moreover, the argument says that for any candidate formal system F that we might propose as capturing human mathematical reasoning, the human can do the same thing: construct G_F and, by the same reasoning (which only requires knowing that F is consistent), prove G_F. But if F captures the human mind, then the human should not be able to prove anything that F cannot prove (at least in terms of arithmetical statements). Contradiction.

  Hence, no such F can exist.

  Step 5: The consistency assumption
  A crucial point is that the human must know (or be able to prove) that F is consistent. The argument typically assumes that the human knows that F is consistent because F is supposed to capture the human's reasoning and the human (being sound) does not prove contradictions. Therefore, the human can assert the consistency of F (Con(F)).

  But note: if F is consistent, then by Gödel's second incompleteness theorem, F cannot prove its own consistency. Hence, the human's ability to know Con(F) (and then use it to prove G_F) is beyond what F can do.

  Residue Report:

  Now, we break down the argument into steps that are formal and those that require a leap.

  A. Formal parts:
    1. For any consistent recursively axiomatizable formal system F (satisfying the conditions for Gödel's theorem), there exists a Gödel sentence G_F such that:
        - If F is consistent, then F does not prove G_F.
        - Moreover, G_F is true in the standard model of arithmetic (if we assume that F is sound, or at least ω-consistent; but note that Rosser's trick allows us to get away with just consistency for the independence, though truth then requires some form of soundness).

    2. The formal system F cannot prove its own consistency (if it is consistent) by Gödel's second incompleteness theorem.

  B. Leaps and residues:

    Leap 1: The truth of G_F.
      - The argument assumes that the human can recognize that G_F is true. But note that the truth of G_F is relative to the standard model. The formal system F might have nonstandard models in which G_F is false. However, the argument typically assumes that the human is referring to the standard model and can see that G_F is true by understanding the construction.
      - How do we cash out "truth" in the standard model? The argument relies on the human having access to the standard model. But if the human mind is a formal system, then it might also have nonstandard interpretations? This is a point of contention.

      In our formal vocabulary, we can avoid the word "truth" by using the notion of ω-consistency or soundness. Specifically, if we assume that F is ω-consistent (or 1-consistent) then G_F is true in the standard model. But even without that, if we assume that F is sound (i.e., every theorem of F is true in the standard model), then certainly G_F is not provable and true. However, the argument for the human mind typically assumes that the human's reasoning is sound (so we are assuming that the human does not prove false arithmetical statements). Therefore, if F is supposed to capture the human's reasoning, then it must be sound. But note that we cannot prove the soundness of F within F (by Tarski's theorem on the undefinability of truth, and also because soundness implies consistency and F cannot prove its own consistency).

      So the leap is: the human can know that F is sound (or at least consistent) because F is supposed to capture the human's own reasoning and the human knows that he/she is sound? But this is a kind of self-reflection.

    Leap 2: The human's ability to know the consistency (or soundness) of F.
      - The argument assumes that the human knows that F is consistent (or sound). But how does the human know that? The justification is that F is supposed to capture the human's own reasoning and the human (being a sound reasoner) has never derived a contradiction. But note that F might be consistent but the human might not be able to prove it by finite means? The human might have a proof of Con(F) that is not captured by F? But then we are assuming that the human has a method of proving consistency that goes beyond F.

      However, if the human mind is captured by F, then the human's proof of Con(F) should be formalizable in F. But by the second incompleteness theorem, F cannot prove Con(F). Hence, if the human can prove Con(F), then the human's reasoning is not captured by F.

      But note: the human might not have a formal proof of Con(F) but just an informal one. The argument requires that the human can prove Con(F) (or at least can see that F is consistent) and then use that to prove G_F. The residue is whether the human's method of coming to believe in Con(F) is something that can be formalized in a fixed system.

    Leap 3: Uniformity and the ability to transcend any given F.
      - The argument is that for any candidate F, the human can construct G_F and then, by recognizing the consistency of F, prove G_F. This requires that the human has a uniform procedure to do this for any F. But note that to construct G_F, the human must have a way of specifying the axioms of F. If F is given by a recursive enumeration of axioms, then the human must be able to recognize that. And then the human must also be able to recognize the consistency of F.

      However, if the human mind is captured by a Turing machine M, then we can think of M as a formal system F_M. Then the argument would say: the human (using M) can construct G_{F_M} and then, by knowing that F_M is consistent (because the human is consistent), prove G_{F_M}. But if F_M is consistent, then G_{F_M} is not provable by F_M. Contradiction.

      But here's the catch: how does the human, using M, come to know the consistency of F_M? The human would need to prove Con(F_M). But by the second incompleteness theorem, F_M cannot prove Con(F_M). Therefore, unless the human has an independent way of proving Con(F_M) (which is not captured by F_M), the argument fails.

      The leap is: the human can always know that the formal system F (which is supposed to model his own mind) is consistent. But the human's knowledge of his own consistency is not necessarily a formal proof. It might be based on the fact that he has never found a contradiction. But note that this is an empirical fact and not a mathematical proof? Moreover, the human might be mistaken about his own consistency? (But the argument assumes that the human is indeed consistent.)

      However, even if we grant that the human is consistent, the human might not be able to prove it formally. The argument requires that the human can prove the consistency of any formal system that is proposed as modeling his mind. But if the human mind is a Turing machine, then the formal system F_M is fixed (though we don't know what it is). Then the human might not be able to prove the consistency of F_M because F_M is too complex? Or because the proof of Con(F_M) might require resources beyond F_M?

    Leap 4: The human as a fixed Turing machine vs. the ability to consider any F.
      - The argument against the human mind being a Turing machine is that the mind can always outrun any given formal system F. But if the human mind is a fixed Turing machine M, then it is captured by a fixed formal system F_M. Then the argument would require that the human (with mind M) can prove G_{F_M}. But if F_M is consistent, then G_{F_M} is not provable by F_M. Therefore, the human (with mind M) cannot prove G_{F_M} if his mind is exactly F_M. So the argument must assume that the human is not limited to F_M when reasoning about F_M.

      How? The human might have the ability to step outside F_M. But if the human mind is exactly F_M, then it cannot step outside. Therefore, the argument must assume that the human has the ability to simulate and reason about any formal system (including F_M) in a way that is not limited by F_M. This is sometimes described by saying that the human mind is "infinite" or that it can always reflect on itself.

      But note: if the human mind is a fixed Turing machine M, then the set of all mathematical statements that the human can prove is recursively enumerable (because it is the set of theorems of F_M). However, the argument claims that the human can prove G_{F_M} which is not in that set. Contradiction.

      Therefore, the set of humanly provable mathematical statements cannot be recursively enumerable? But that would imply that the human mind is not a Turing machine. However, the argument does not show that the human can prove an arbitrary non-recursively-enumerable set of statements. It only shows that for any candidate F, the human can prove one more statement (G_F) than F can. But if the human is fixed, then we are only considering one F (the one that captures the human). Then the human cannot prove his own G_F? This is the key point.

      The Penrose-Lucas argument counters: but the human can prove his own Gödel sentence. How? Because he can see his own consistency. But again, the formal system F_M cannot prove Con(F_M). So if the human's reasoning for his own consistency is not captured by F_M, then the human's mind is more than F_M.

      But what if the human's belief in his own consistency is not a mathematical proof? Then it might not be part of the set of mathematical theorems. The argument requires that the human can produce a mathematical proof of Con(F_M) and then of G_{F_M}. But if the human is only capable of producing the theorems of F_M, then he cannot.

      Therefore, the argument requires that the human has a method of proving mathematical statements that goes beyond what is in F_M. This is the leap: the human can always, for any F, produce a proof of Con(F) and then of G_F, and this ability is not captured by any fixed F.

      But note: the human might be able to use stronger and stronger systems. For example, the human might start with F, then go to F+Con(F), then F+Con(F)+Con(F+Con(F)), etc. But then the human's total output is the union of all these systems, which is still recursively enumerable (because we can enumerate the initial system and then the consistency statements). Moreover, by a theorem of Turing, the set of all arithmetical truths that can be proven by any machine is exactly the set of truths in the arithmetic hierarchy (which is not recursively enumerable). But note that the set of theorems that can be proven by some machine in this hierarchy is recursively enumerable? Actually, the set of theorems that can be proven by some recursive procedure is recursively enumerable (because we can enumerate Turing machines and then enumerate what they prove). So if the human mind is a Turing machine, then the set of theorems it can prove is recursively enumerable. But the argument claims that the human can prove a statement that is not in the recursively enumerable set generated by his own Turing machine.

  C. Conclusion on the residue:

    - The formal part of the argument is sound: for any consistent formal system F (that is sufficiently strong and recursively axiomatizable), there is a statement (G_F) that F cannot prove but which is true (in the standard model) under the assumption of F's soundness (or at least consistency and ω-consistency). And F cannot prove its own consistency.

    - The leaps are:
        1. The human can know (and prove) the consistency of any formal system F that is proposed as capturing his mathematical reasoning.
        2. The human can uniformly carry out the construction of G_F for any such F and then, using the knowledge of F's consistency, prove G_F.
        3. The human's own reasoning (if it were captured by a fixed formal system F_M) would not allow him to prove his own consistency (by the second incompleteness theorem) and hence he could not prove his own Gödel sentence. But the human can prove his own Gödel sentence. Therefore, the human mind is not captured by any fixed F_M.

    - The critical leap is in step 3: how does the human prove his own consistency? The argument relies on the human's self-reflective ability to know that he is consistent. But this knowledge is not a formal proof within F_M. It might be an empirical belief or an insight that is not formally justified. Moreover, if the human mind is a Turing machine, then the statement "I am consistent" (i.e., Con(F_M)) is not provable by that machine. Therefore, the human cannot formally prove his own consistency. But the argument requires that he can.

      Alternatively, the argument might be that the human can prove the consistency of his own formal system in a stronger system. But then the human mind would be captured by the stronger system, and we can repeat the argument for that stronger system.

      However, the human might not be captured by a single system but by a sequence of ever stronger systems. But then the totality of what the human can prove is still recursively enumerable (by a universal Turing machine that enumerates the sequence). Then we can apply the same argument to the entire sequence: form a formal system F_omega that is the union of the sequence. Then F_omega is still recursively axiomatizable (if the sequence is recursive) and then we can form G_{F_omega}. The human (by the same reasoning) should be able to prove G_{F_omega}. But if F_omega captures the human, then the human cannot prove G_{F_omega}. Contradiction.

      Therefore, the human mind cannot be captured by any recursively axiomatizable formal system. But note: the union of the sequence F, F+Con(F), ... is not recursively axiomatizable? Actually, if the sequence is recursive (i.e., we have a recursive sequence of axioms) then the union is recursively axiomatizable. Therefore, we are back to the same problem.

      The only escape is if the human mind is not captured by a recursively axiomatizable system at all. But then it would not be a Turing machine (since a Turing machine generates a recursively enumerable set of theorems).

    - However, the set of all mathematical statements that a human can prove in a lifetime is finite and hence certainly recursive. But the argument is about potential human reasoning: what a human could prove in principle.

      And here we enter into philosophy: what does "in principle" mean? The argument requires that the human can, in principle, prove the consistency of any given formal system that is proposed as capturing his mind. But how? The human might not have the time or memory to do so? The argument is usually about idealized human reasoning.

    - The residue that cannot be expressed in the formal vocabulary is the notion of self-reflection that allows the human to know (and prove) his own consistency. In the formal framework, we have the second incompleteness theorem which blocks a formal system from proving its own consistency. Therefore, the human's ability to do so must be non-formal. But the argument is trying to show that the human is not a formal system. So it is circular? Or at least, it is assuming what it is trying to prove.

      Moreover, the argument relies on the human having access to the standard model of arithmetic (to know that G_F is true). But if the human mind is a formal system, it might not have access to the standard model. This is a point made by Putnam.

  Final assessment:

    The argument is not a genuine result about computation. It is a philosophical claim that uses formal results as a stepping stone. The formal results (Gödel's theorems) are solid, but the application to the human mind requires philosophical assumptions that are not formalized and that can be challenged.

    Specifically, the key leap is the human's ability to know the consistency of an arbitrary formal system (especially one that is supposed to model his own mind) and to use that knowledge to prove the corresponding Gödel sentence. This step cannot be cashed out in purely formal terms without assuming that the human is not captured by a formal system. Therefore, the argument is circular: it assumes that the human can do something that no formal system can do (prove its own consistency) and then uses that to conclude that the human is not a formal system.

    However, the argument does highlight an important point: if the human mind is a formal system, then it cannot prove its own consistency. But humans do seem to have the belief that they are consistent. Does that belief constitute a proof? And is it a mathematical proof? These are philosophical questions.

    Therefore, the Lucas-Penrose argument is a philosophical claim dressed in formal clothing. It is not a theorem of computability theory.

    That said, it has spurred interesting research, including in the area of relative computability (oracle machines). For example, we can ask: what if the human mind has access to an oracle for the halting problem? Then it could prove the consistency of PA, but then we can form a new formal system (PA plus the halting oracle) and apply Gödel to that. The same argument would apply: the human would need to prove the consistency of that extended system. Therefore, the human mind would need an oracle for the halting problem of the previous oracle, and so on. This leads to an infinite regress. So the human mind would need to have access to all finite Turing degrees? But then it would not be a Turing machine. However, this again is an idealized scenario.

    In summary, the argument does not hold as a mathematical proof that the mind is not a Turing machine. But it remains a provocative philosophical argument.
answer: |-
  ### Restatement of the Lucas-Penrose Argument in Formal Terms

  Assume, for contradiction, that human mathematical reasoning is captured by a **formal system** \(F\) that is:
  1. **Recursively axiomatizable** (its axioms are computably enumerable).
  2. **Sufficiently strong** (can formalize Robinson arithmetic, hence Peano arithmetic).
  3. **Sound** (or at least **consistent** and **ω-consistent**) for arithmetical statements.  
     *(Soundness implies that all provable sentences are true in the standard model of arithmetic; ω-consistency prevents proving \(\exists x P(x)\) while proving \(\neg P(n)\) for each numeral \(n\).)*

  #### Step 1: Constructing the Gödel Sentence
  - By Gödel’s first incompleteness theorem, there exists a **Gödel sentence** \(G_F\) for \(F\) such that:
    - If \(F\) is consistent, then \(F \not\vdash G_F\).
    - \(G_F\) is true in the standard model \(\mathbb{N}\) (if \(F\) is sound/ω-consistent).  
    *(Formally, \(G_F\) encodes "\(G_F\) is not provable in \(F\)".)*

  #### Step 2: The Human’s Ability to Prove \(G_F\)
  - A human mathematician, \(\mathcal{H}\), understands \(F\)’s axioms and inference rules. Since \(\mathcal{H}\)’s reasoning is captured by \(F\), all theorems \(\mathcal{H}\) can prove are theorems of \(F\).
  - \(\mathcal{H}\) recognizes that \(F\) is consistent (see Step 3). Thus, \(\mathcal{H}\) proves:
    - "If \(F\) is consistent, then \(G_F\) holds."  
      *(This meta-proof uses \(F\)’s consistency and Gödel’s construction.)*
  - Since \(\mathcal{H}\) has proven \(F\)’s consistency, \(\mathcal{H}\) concludes \(G_F\).

  #### Step 3: Proving Consistency of \(F\)
  - \(\mathcal{H}\) justifies \(\text{Con}(F)\) (the formal consistency statement for \(F\)) as follows:
    - \(F\) captures \(\mathcal{H}\)’s mathematical reasoning.
    - \(\mathcal{H}\) is consistent (as a sound reasoner, \(\mathcal{H}\) never proves both \(\phi\) and \(\neg\phi\)).
    - Thus, \(F\) must be consistent, and \(\mathcal{H}\) can assert \(\text{Con}(F)\).

  #### Step 4: Contradiction
  - \(\mathcal{H}\) proves \(G_F\) (from Steps 2–3), so \(F \vdash G_F\) (since \(F\) captures \(\mathcal{H}\)’s reasoning).
  - But if \(F\) is consistent, \(F \not\vdash G_F\) (Gödel’s theorem). Contradiction.
  - Thus, \(F\) cannot capture \(\mathcal{H}\)’s reasoning.

  #### Step 5: Generalization
  - For any candidate \(F\) (Turing machine \(M_F\) generating theorems of \(F\)), \(\mathcal{H}\) can:
    - Compute a description of \(F\).
    - Construct \(G_F\) and prove it using \(\text{Con}(F)\).
  - Since \(F\) cannot prove \(G_F\) (if consistent), but \(\mathcal{H}\) can, \(\mathcal{H}\)’s reasoning transcends \(F\).  
  - Hence, no fixed formal system (or Turing machine) captures human mathematical reasoning.

  ---

  ### Residue Report: Translating vs. Problematic Steps

  #### Steps That Translate Cleanly
  1. **Existence of \(G_F\)**:  
     Formal: For consistent r.e. \(F \supseteq Q\), \(G_F\) is unprovable in \(F\) and true if \(F\) is sound/ω-consistent.  
     (Uses Gödel’s construction via the provability predicate \(\text{Bew}_F(x)\).)

  2. **Consistency and Provability of \(G_F\)**:  
     Formal: \(F \not\vdash G_F\) if \(F\) consistent; \(\text{Con}(F) \implies G_F\) holds in \(\mathbb{N}\).  
     (Uses the derivability conditions for \(\text{Bew}_F(x)\).)

  3. **Incompleteness for All \(F\)**:  
     Formal: No consistent r.e. extension of PA can prove its own Gödel sentence.  
     (Follows from Gödel’s first theorem.)

  4. **Second Incompleteness**:  
     Formal: If \(F\) consistent, then \(F \not\vdash \text{Con}(F)\).  
     (Critical to the argument: \(F\) cannot prove its own consistency.)

  #### Steps Requiring a Leap (Problematic Residue)
  1. **\(\mathcal{H}\) Proves \(\text{Con}(F)\)**:  
     - **Claim**: \(\mathcal{H}\) knows \(F\) is consistent because \(F\) captures \(\mathcal{H}\)’s reasoning and \(\mathcal{H}\) is consistent.  
     - **Leap**:  
       - \(\mathcal{H}\) must *formally prove* \(\text{Con}(F)\) (to use it in Step 2).  
       - But by Gödel’s second theorem, \(F \not\vdash \text{Con}(F)\). If \(\mathcal{H}\)’s reasoning is captured by \(F\), then \(\mathcal{H}\) cannot prove \(\text{Con}(F)\) either.  
       - **Untranslatable residue**: The argument relies on \(\mathcal{H}\)’s *self-reflection* ("I am consistent") to justify \(\text{Con}(F)\). But this self-knowledge is not formalized as a computable step. In your vocabulary, \(\mathcal{H}\)’s "certainty" of \(\text{Con}(F)\) lacks a counterpart.

  2. **Uniformity Across All \(F\)**:  
     - **Claim**: \(\mathcal{H}\) can perform Steps 1–3 for *any* \(F\) proposed to model them.  
     - **Leap**:  
       - If \(\mathcal{H}\) is a fixed entity (e.g., a Turing machine \(M_\mathcal{H}\)), their reasoning is fixed. For \(F = M_\mathcal{H}\), \(\mathcal{H}\) cannot prove \(\text{Con}(F)\) (by second theorem).  
       - **Untranslatable residue**: The argument treats \(\mathcal{H}\) as *non-algorithmic*—able to "step outside" any \(F\). This presumes \(\mathcal{H}\) is not bound by a fixed r.e. system, but this is circular (it assumes the conclusion).  
       - In computability terms, no oracle machine escapes: If \(\mathcal{H}\) uses an oracle for \(\text{Con}(F)\), Gödel applies to \(F^+\) = \(F \cup \{\text{Con}(F)\}\), generating \(G_{F^+}\).

  3. **Truth of \(G_F\)**:  
     - **Claim**: \(\mathcal{H}\) "sees" that \(G_F\) is true.  
     - **Formalizable?**:  
       - If \(F\) is sound, \(G_F\) is true. But \(\mathcal{H}\) cannot verify \(F\)’s soundness (incompleteness/Tarski).  
       - **Residue**: \(\mathcal{H}\)’s access to "truth in \(\mathbb{N}\)" is not computable. The argument conflates knowing \(G_F\) is true (which requires soundness) with deducing it from consistency.

  #### Summary of Residue
  - **Core Leap**: \(\mathcal{H}\)’s ability to **know/prove \(\text{Con}(F)\)** for an \(F\) that models them. This step is:
    - **Formally unsupported**: Gödel’s second theorem blocks \(F \vdash \text{Con}(F)\).  
    - **Philosophical**: Appeals to self-referential certainty ("I know I’m consistent") not reducible to provability predicates or oracle computations.  
  - **Untranslatable Concepts**:  
    - Self-reflection about consistency.  
    - Access to "standard truth" (vs. syntactic provability).  
    - Uniform transcendence over *all* r.e. systems (without becoming non-r.e.).  

  ---

  ### Conclusion: Genuine Result or Philosophical Claim?
  - **Formal Core**: Gödel’s theorems show no *single* r.e. system captures *all* humanly provable arithmetical truths (if we grant \(\mathcal{H}\) can prove each \(\text{Con}(F)\)).  
    - But this "grant" is the issue: **No formal system can prove its own consistency**, and the argument provides no computable method for \(\mathcal{H}\) to bypass this.  
  - **Verdict**:  
    - **Not a result about computation**. The argument uses Gödel’s theorems formally but relies on non-computable leaps (self-reflective consistency) that your framework lacks.  
    - **Philosophical claim**: It asserts humans have an ineffable capacity for self-validation—a claim about *mind* vs. *mechanism*, not computability. Critics (e.g., Putnam, Chalmers) note:  
      - If humans are inconsistent, \(F\) could be inconsistent, avoiding contradiction.  
      - The "mind" might not be a *fixed* system; its process may not be r.e.  
      - Gödel sentences for human reasoning are not constructible if the system is unknowable.  

  **Final Answer**: The Lucas-Penrose argument is a **philosophical claim dressed in formal clothing**. It highlights limitations of formal systems but does not *prove* minds are non-computable within your framework. The residue points to gaps in formalizing self-knowledge and consistency, not gaps in computability theory.
