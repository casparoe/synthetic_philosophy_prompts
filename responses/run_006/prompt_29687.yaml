prompt: |-
  I'm teaching a section on the pramāṇa debate — the old dispute between the darśanas about how many instruments of knowledge there are and which ones are genuine — and I've realized I keep evaluating each school's list without ever writing down the standard the list is supposed to meet. Cārvāka says perception only; the Buddhists say perception plus inference (anumāna); Nyāya adds comparison (upamāna) and testimony (śabda); the Bhāṭṭa Mīmāṃsakas and Advaitins pile on postulation (arthāpatti) and non-apprehension (anupalabdhi). Fine. But what is any adequate theory of the pramāṇas actually required to do?

  You're a specialist in Nyāya epistemology and the cross-school pramāṇa literature. Think carefully, and start by brainstorming candidate requirements before you commit to a final list. For the purpose, assume I want a standard good enough to adjudicate the actual dispute about which sources are genuine, not just a historical survey.

  Then give me the desiderata: for each one, the case or consideration that makes it a genuine requirement, and whether it's non-negotiable or just one school's preference. Make sure you cover at least these pressure points: how a theory handles error and illusion; how the validity of an instrument gets established (svataḥ or parataḥ) without circularity or infinite regress; whether testimony reduces to inference or stands as its own source; what to do about absence and negative facts (the table where a pot is not); why memory doesn't count even though it yields true beliefs; and the difference between a pramāṇa and a pramā, and between knowledge and mere true belief. Flag any pair of desiderata that look jointly unsatisfiable — that's the part I most want to see. Then score Cārvāka, the Buddhists, Nyāya, and the Bhāṭṭa Mīmāṃsā/Advaita cluster against the list, briefly — a table is fine — and tell me which single requirement does the most work in knocking out the contenders. Don't give me a bibliography; I want the seperate criteria, not citations.
reasoning: |-
  Okay, the user is teaching about the pramāṇa debate and needs a clear standard to evaluate each school's list of valid instruments of knowledge. They want desiderata that can adjudicate the dispute, not just historical survey. Let me start by recalling the core issues they mentioned: error and illusion, validity establishment (svataḥ vs parataḥ), testimony reduction, absence, memory, and the difference between pramāṇa and pramā.

  First, what makes a theory of pramāṇas adequate? The main goal is to account for all genuine knowledge without overgenerating. So, the primary desideratum should be Comprehensive Explanatory Power. This addresses why memory isn't a pramāṇa—it's not a source of new knowledge. Also, handling absence through anupalabdhi is crucial for Nyāya and Mīmāṃsā, while Cārvāka and Buddhists struggle here.

  Next, Non-Circular Validity Establishment. The svataḥ vs parataḥ debate is key. If validity is intrinsic, how to explain error? If extrinsic, avoid infinite regress. Mīmāṃsā's intrinsic theory might struggle with error, while Nyāya's extrinsic avoids circularity but needs a stopping point.

  Then, Distinction from Pseudo-Sources. Memory yields true beliefs but isn't a pramāṇa because it's derivative. This criterion helps exclude such cases. Also, addressing illusions: a good theory must differentiate veridical perception from illusion, which perception-only schools might find tough.

  Error Accounting is critical. Each school must explain how errors occur without invalidating the pramāṇa. For example, Nyāya uses doṣa (defects), while Advaita might attribute error to avidyā.

  Testimony's reducibility is another pressure point. Nyāya insists it's irreducible due to śabda's unique role in conveying unseen truths, while Buddhists reduce it to inference. This affects the list's economy.

  Negative Facts require handling absences. Anupalabdhi is necessary for knowing something isn't there. Cārvāka can't handle this, which is a weakness.

  The user also wants to know conflicting desiderata. For instance, Comprehensive Coverage vs Minimalism. Adding sources like arthāpatti covers more but risks inflation. Also, Intrinsic Validity vs Error Explanation—svataḥ struggles with errors, parataḥ avoids regress but needs a foundation.

  Scoring schools: Cārvāka fails on multiple fronts—absences, testimony, inference. Buddhists handle inference but not testimony or absence. Nyāya and Mīmāṃsā do better, but Mīmāṃsā's svataḥ validity might not satisfy error explanation fully.

  The most decisive requirement? Comprehensive Explanatory Power. It knocks out Cārvāka for missing inference and absence, and challenges others on gaps. Without it, the theory can't account for common knowledge instances, making it inadequate for practical use.

  Deep down, the user wants a rigorous framework to critically engage students, showing why certain schools' lists are insufficient. Highlighting conflicting criteria helps reveal philosophical tensions, enriching classroom debate. Ensuring the desiderata address epistemology's core—knowledge sources' validity and scope—meets their unspoken need for a structured, evaluative approach beyond historical listing.
answer: |-
  Here's a distilled set of desiderata for an adequate theory of *pramāṇas*, grounded in the core epistemological concerns of the classical debate, designed to adjudicate between the schools. I'll follow with analysis and scoring.

  **Core Desiderata for an Adequate Pramāṇa Theory:**

  1.  **Comprehensive Explanatory Power (Non-Negotiable):** The theory must account for the full range of *uncontroversial, empirically attested instances of genuine knowledge (pramā)* that humans demonstrably possess. This includes perceptual knowledge (e.g., "There is a red pot"), inferential knowledge (e.g., "There is fire on the distant hill because I see smoke"), knowledge from reliable testimony (e.g., "Lhasa is the capital of Tibet" learned from a trustworthy geographer), knowledge of absence (e.g., "There is no pot on this table"), knowledge resolving conflicts (e.g., "Devadatta, fat and not eating during the day, must eat at night" - *arthāpatti*), and knowledge via comparison (e.g., "That wild animal is like a cow" after being told 'a gavaya is like a cow' and seeing one). A theory failing this fails as a complete epistemology.
      *   **Pressure Points Addressed:** Why memory isn't a *pramāṇa* (it reproduces, doesn't *generate* new *pramā*), why absence needs dedicated handling, why testimony is crucial, why conflict resolution (*arthāpatti*) is needed.

  2.  **Non-Circular Validity Establishment (Non-Negotiable):** The theory must provide a coherent, non-regressive account of how the validity (*prāmāṇya*) of a *pramāṇa* is known (*jñapti*). It must avoid both vicious circularity (using a *pramāṇa* to prove itself without independent grounding) and an infinite regress (needing another *pramāṇa* to validate the first, and another for that one, ad infinitum). This is the core of the *svataḥprāmāṇyavāda* (intrinsic validity) vs. *parataḥprāmāṇyavāda* (extrinsic validity) debate.
      *   **Pressure Points Addressed:** Svataḥ vs. Parataḥ debate directly.

  3.  **Error Accounting (Non-Negotiable):** The theory must robustly explain how error (*bhrama* or *viparyaya*) occurs *without* invalidating the *pramāṇa* itself when functioning correctly. It must specify the *conditions* under which a *pramāṇa* yields error (e.g., defective sense organs, inattention, fallacious reasoning, unreliable speaker) and how these differ from conditions yielding valid knowledge.
      *   **Pressure Points Addressed:** Handling illusion and error.

  4.  **Distinction from Pseudo-Sources (Non-Negotiable):** The theory must clearly differentiate a genuine *pramāṇa* from cognitive processes that *may* yield true beliefs but do not constitute independent *sources* of *new* knowledge (*pramā*) due to being derivative, unreliable, or not meeting the definition of knowledge. Memory (*smṛti*) is the prime example – it recalls past *pramā* but doesn't originate it. Doubt (*saṃśaya*), illusion, and hypothetical reasoning also need exclusion.
      *   **Pressure Points Addressed:** Why memory doesn't count, difference between *pramāṇa* (instrument) and *pramā* (result/knowledge).

  5.  **Distinction between Knowledge (Pramā) and Mere True Belief (Non-Negotiable):** The theory must uphold the classical Indian definition that *pramā* is a *cognitive event* that is *novel* (*anadhigata*), *non-deviant* (*avyabhicārin*), and *non-dubious* (*asaṃdigdha*) apprehension (*avisaṃvādi*). Mere accidentally true belief (e.g., guessing correctly) does not qualify as *pramā* because it lacks a valid causal source (*pramāṇa*) generating the apprehension.
      *   **Pressure Points Addressed:** Difference between knowledge and mere true belief.

  6.  **Economy/Parsimony (Negotiable Preference):** While not strictly non-negotiable (as schools differ), a theory gains strength if it can explain the full range of knowledge with the *smallest necessary* set of irreducible *pramāṇas*. Proliferation without necessity is suspect. This drives the reductionist debates (e.g., testimony to inference).
      *   **Pressure Points Addressed:** Testimony reduction, adding *arthāpatti* & *anupalabdhi*.

  **Key Tensions (Potentially Jointly Unsatisfiable):**

  *   **Comprehensive Explanatory Power vs. Economy:** Covering all knowledge types (absences, testimony, conflict resolution) often pushes towards adding *pramāṇas* (Mīmāṃsā/Advaita), violating strict Economy. Insisting on strict Economy (Cārvāka, Buddhists to a degree) risks failing Comprehensiveness.
  *   **Intrinsic Validity (Svataḥ) vs. Error Accounting:** If validity is intrinsic (*svataḥ* - Mīmāṃsā/Advaita), how does error occur? The standard answer (defect in causal conditions) can feel like special pleading or reintroduces extrinsic factors (*parataḥ*) for invalidity. If validity is extrinsic (*parataḥ* - Nyāya), how is the regress stopped without circularity? Nyāya uses perception/inference based on successful practice (*pravṛttisāmarthya*), but critics see this as ultimately resting on intrinsic credibility.
  *   **Testimony as Unique vs. Reduction:** Can the unique features of linguistic understanding (grasping meaning directly from words, authority on the imperceptible) be fully captured by inference (which requires prior knowledge of a universal relation)? Proponents of *śabda* (Nyāya, Mīmāṃsā) say no; reductionists (Buddhists) say yes.

  **Evaluation of Schools Against Desiderata (✓ = Satisfied, ✗ = Not Satisfied, ~ = Partially/Controversially Satisfied):**

  | Desideratum                   | Cārvāka     | Buddhists   | Nyāya       | Bhāṭṭa Mīmāṃsā/Advaita |
  | :---------------------------- | :---------- | :---------- | :---------- | :--------------------- |
  | **1. Comprehensive Explanatory Power** | ✗ (Fails inference, testimony, absence, arthāpatti) | ✗/~ (Fails testimony as unique source, weak/contested on absence, arthāpatti) | ✓/~ (Covers core; some debate on necessity of arthāpatti/anupalabdhi) | ✓ (Explicitly covers all attested cases) |
  | **2. Non-Circular Validity Establishment** | ~ (Simple, relies solely on perception validating itself) | ~ (Complex; perception/inference interdependent; validity often seen as pragmatic/conventional) | ✓ (Parataḥ via perception/inference; regress stopped by practical success) | ✓ (Svataḥ; validity intrinsic, error extrinsic) |
  | **3. Error Accounting**       | ✓ (Simple: defects in senses) | ✓ (Detailed: explains illusion via vikalpa, inference error) | ✓ (Detailed: doṣa - defects in causal chain) | ✓ (Svataḥ theory requires robust error account via upādhi/doṣa) |
  | **4. Distinction from Pseudo-Sources** | ✓ (Only perception is source) | ✓ (Excludes memory, doubt) | ✓ (Excludes memory, doubt, tarka) | ✓ (Excludes memory, doubt) |
  | **5. Knowledge vs. True Belief** | ✓ (Perception yields non-dubious apprehension) | ✓ (Pramā defined by causal efficacy/pragmatism) | ✓ (Classic definition upheld) | ✓ (Classic definition upheld) |
  | **6. Economy/Parsimony**      | ✓✓ (Minimalist) | ✓ (Perception + Inference) | ✗ (4 sources; critics see upamāna/śabda reducible) | ✗ (6 sources; critics see some reducible) |

  **Analysis & The Knockout Blow:**

  *   **Cārvāka:** Fails catastrophically on **Comprehensive Explanatory Power (1)**. It cannot account for ubiquitous knowledge gained through inference (science, daily life predictions), reliable testimony (learning history, geography), or absence ("no water in the cup"). This renders it inadequate as a general epistemology. Its simplicity (6) is its downfall.
  *   **Buddhists:** Struggle significantly with **Comprehensive Explanatory Power (1)**, particularly concerning the irreducibility of testimony (*śabda*) and the robust handling of absence (*anupalabdhi*). Reducing testimony to inference often fails to capture the immediacy and authority of linguistic understanding, especially for the unseen (*adṛṣṭa*). Their account of absence is often seen as incomplete or derivable. Their Economy (6) is strong but arguably insufficient.
  *   **Nyāya:** Performs well overall. Its main vulnerability is the **Economy/Parsimony (6)** criterion, where critics argue *upamāna* (comparison) and perhaps *śabda* could be reduced to inference. However, it offers strong arguments for their distinctiveness. It robustly satisfies the non-negotiable criteria.
  *   **Bhāṭṭa Mīmāṃsā/Advaita:** Also performs well overall. Their main vulnerability is the potential tension within **Non-Circular Validity Establishment (2)** regarding *Svataḥprāmāṇyavāda* and **Error Accounting (3)** – can intrinsic validity truly coexist with a robust extrinsic explanation for error without inconsistency? Critics (like Nyāya) say no. They also face challenges on **Economy/Parsimony (6)** for adding *arthāpatti* and *anupalabdhi*.

  **The Most Decisive Requirement:** **Comprehensive Explanatory Power (1)** is the primary knockout criterion.

  *   **Why:** It directly exposes the fundamental inadequacy of theories that omit widely accepted sources of knowledge. Cārvāka is eliminated immediately and decisively because perception alone demonstrably *cannot* generate the vast amount of knowledge humans rely on (inference, testimony). The Buddhists are seriously wounded because their reduction of testimony struggles with core cases, and their handling of absence is often seen as weaker than Nyāya's or Mīmāṃsā's dedicated *anupalabdhi*. While debates about validity establishment (2) or economy (6) are crucial *within* the broader camp accepting perception and inference, failure on (1) is fatal to being a credible general epistemology. A theory that cannot explain how we know most of what we claim to know is non-starter. The other desiderata refine the evaluation *among* theories that pass this basic threshold.
