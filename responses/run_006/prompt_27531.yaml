  Looking at their notes, they've identified an interesting asymmetry between the intentional stance and the other two stances. The physical stance describes systems as they actually are, the design stance involves some idealization based on evolutionary history, but the intentional stance adds a layer of normative idealization about rationality. The user worries this makes intentional patterns partly constituted by the stance itself, potentially undermining Dennett's realism about these patterns.

