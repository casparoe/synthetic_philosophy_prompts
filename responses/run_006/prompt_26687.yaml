prompt: |-
  I've been trying to sort out what I actually think about when it's permissible to impose costs on some people for the sake of benefits to others — the kind of trade-off that utilitarianism treats as straightforward addition and subtraction. Going by my gut on cases, here is where I land.

  Diverting a runaway trolley from a track with five people onto a track with one: permissible. But a surgeon who carves up one healthy patient to save five dying ones: clearly not permissible, even though the arithmetic is the same.

  A modest tax increase on the top few percent of earners to fund a vaccine program that will prevent thousands of childhood deaths: permissible, and I'd go further — it would be wrong not to do it. But rounding up a random person and forcing them to donate bone marrow, a procedure with comparable inconvenience and risk to paying the extra tax, in order to save a stranger: not permissible, and not even close.

  Breaking a casual promise to meet a friend for coffee because I encounter someone who needs help getting to the emergency room: permissible, though I owe the friend an apology. But breaking a promise to one person in order to keep a more valuable promise to two others: I'm not sure that's permissible at all — it feels like the first promisee has a claim on me that isn't simply outweighed by numbers.

  A military commander ordering a soldier to carry out a mission that is nearly certain death, where the mission will save the rest of the unit: permissible, provided the soldier voluntarily enlisted and the military's chain of command is legitimate. But a government conscripting civilians for the same mission without their prior consent: not permissible, even if the lives saved are the same.

  A factory that, to stay open and preserve a thousand jobs in a town with no other employment, exposes ten workers to a carcinogen at levels known to cause one statistical cancer death: not permissible — you can't just write one person off as the price of a thousand livelihoods. Yet I accept that driving to work imposes a tiny fatal risk on pedestrians and cyclists, and aggregated across a society, that risk translates into statistical deaths that we collectively accept in exchange for the convenience of car travel. I'm not sure these two are consistent.

  I can feel that there's a principle somewhere in here about the separateness of persons — that you can't just sum benefits and burdens across people as if they were one person's pleasures and pains. But my verdicts don't all point the same way. Some trade-offs feel like legitimate social cooperation, others feel like using people. Is there a principle that captures most or all of these verdicts? If not, which ones should I give up, and what does the best available principle say about a case I haven't considered: a government that imposes a one-time wealth tax of ten percent on everyone above a certain threshold to fund reparations for a historical injustice, where the beneficiaries are the descendants of those wronged?
reasoning: |-
  Okay, let me try to unpack this user's moral dilemma. They're grappling with when it's acceptable to impose costs on some for the benefit of others, and their intuitions don't neatly align with utilitarianism. They've listed several scenarios where similar arithmetic leads to different moral judgments. 

  First, I notice this is someone deeply reflective about ethics—probably has read some philosophy but isn't satisfied with textbook answers. They're candid about their conflicting intuitions (e.g., trolley vs. surgeon) and even spot their own inconsistencies (factory risks vs. driving risks). That intellectual honesty is refreshing. The underlying anxiety seems to be: "How do I systematize my ethics without betraying what feels fundamentally human?"

  The separateness-of-persons intuition is key here. Rawls comes to mind immediately—they're basically describing why he rejected utilitarianism. But their examples add nuance: consent (soldier vs. conscript), role obligations (promises), and structural vs. targeted harm (tax vs. bone marrow) all seem to interact differently with that principle. 

  I'm struck by how their cases map to classic philosophical distinctions: 
  - Doing vs. allowing (trolley) 
  - Positive vs. negative rights (tax vs. forced donation) 
  - Institutional vs. interpersonal ethics (factory risks as policy vs. driving as diffuse harm) 

  The reparations case they mention last is particularly thorny. It tests whether their principle can handle historical obligations—something their other cases don't touch. If they reject the bone marrow draft but accept redistributive taxes, does historical wrongdoing create a special "debt" that overrides usual constraints? That might require grafting a corrective justice framework onto their existing intuitions.

  Their factory/driving inconsistency is the most vulnerable point. Maybe they'd bite the bullet on driving being immoral? Or perhaps distinguish intended vs. foreseen harm? But that feels shaky. Alternatively, they might lean on "reasonable avoidability"—we accept driving risks because alternatives are impractical, whereas factory risks could be mitigated. Not perfect, but workable.

  What they might really need isn't just a principle but a layered approach: 
  1. Baseline deontology (rights/consent) 
  2. Consequentialist adjustments for large-scale coordination (taxes, driving) 
  3. A "tyranny of small decisions" clause to handle aggregation problems 

  ...But that risks becoming ad hoc. Scanlon's contractualism could be cleaner: an act is wrong if others could reasonably reject it. The bone marrow draft? Easily rejectable. Vaccines via progressive tax? Harder to reject if exemptions exist for hardship. The broken promise case becomes clearer too—the first promisee can reasonably reject being traded off without their input.

  For reparations, contractualism might help: could descendants of the wronged reasonably reject lack of reparations? Could the taxed reasonably reject the burden? Depends on implementation details—which matches their case-by-case intuition. 

  Their core tension seems to be between wanting systemic fairness (hence accepting some trade-offs) while recoiling at direct instrumentalization of people. I’d emphasize that as the north star: "Systemic cooperation good, reducing persons to means bad." The rest is drawing lines in the mess of real-world constraints.
answer: |-
  Your intuitions reveal a sophisticated moral framework that prioritizes **individual rights, consent, and procedural fairness** over pure aggregation of costs and benefits—while still allowing trade-offs in specific contexts. This aligns with **contractualist, deontological, or rights-based theories** (e.g., Rawls, Scanlon, Nozick) rather than utilitarianism. Below, I synthesize your judgments into principles and address the reparations case.

  ---

  ### **Core Principles Explaining Your Intuitions**
  1. **Anti-Instrumentalization Principle**:  
     You cannot treat a person as a *mere means* to benefit others, even if net utility increases.  
     - **Why surgeon/bone marrow cases fail**: Actively sacrificing a non-consenting individual for others treats them as an object.  
     - **Why trolley succeeds**: You’re not *using* the one person; you’re redirecting an existing threat.  

  2. **Consent and Voluntary Cooperation**:  
     Costs are permissible when imposed through systems where people have:  
     - **Prior consent** (e.g., enlisting in the military),  
     - **Fair exit options** (e.g., choosing not to drive), or  
     - **Democratic legitimacy** (e.g., tax policies).  
     - *Conscription fails*; *voluntary military sacrifice succeeds*.

  3. **Role-Relative Obligations**:  
     Promises, professional roles, or prior commitments create special duties that can’t be overridden by aggregate gains.  
     - Breaking a coffee promise for an emergency is acceptable (minimal harm vs. urgent need).  
     - Breaking Promise A to keep Promises B+C fails—you owe specific obligations to the first promisee.  

  4. **Structural vs. Targeted Harms**:  
     Diffuse, systemic risks (e.g., driving fatalities) are tolerated if:  
     - They’re **unavoidable for social functioning**,  
     - Risks are **fairly distributed**,  
     - No one is *singled out* as a sacrifice.  
     - *Factory carcinogens fail*: Targeted, foreseeable harm to specific workers.  

  5. **Proportionality and Alternatives**:  
     Costs must be proportional to benefits, and less harmful alternatives must be exhausted.  
     - *Taxes for vaccines*: Low cost to wealthy, high societal gain, no better alternative.  
     - *Bone marrow draft*: Extreme intrusion when less invasive solutions exist.  

  ---

  ### **Resolving Inconsistencies**
  - **Factory vs. Driving Risks**:  
    Driving risks are (1) *unavoidable* for modern life, (2) *universally shared* (drivers also face risks), and (3) mitigated by safety regulations. Factory risks *target* a vulnerable group for corporate profit, with alternatives (e.g., safer technology, shutdown compensation).  
    **Consistency test**: If driving risks were avoidable and forced on a minority, you’d reject them too.  

  - **Broken Promises**:  
    Keeping promises to two people at the expense of one isn’t merely "aggregation"—it violates a *specific duty* owed to an individual. Numbers don’t dissolve personal obligations.  

  ---

  ### **Reparations Wealth Tax: Applying the Principles**
  A one-time 10% wealth tax on the wealthy for historical reparations:  
  - **Permissible if**:  
    - The tax is **proportional** to the scale of historical injustice (not punitive).  
    - Beneficiaries are **direct descendants** of those wronged (clear causal link).  
    - The tax is **structurally fair**: Applied via democratic process, with exemptions for hardship.  
    - **No better alternatives** exist (e.g., land restitution instead of cash).  
  - **Not permissible if**:  
    - It **singles out arbitrary wealthy individuals** unrelated to the injustice (instrumentalization).  
    - It imposes **disproportionate burdens** (e.g., bankrupting people).  

  **Your principles likely support this**, provided:  
  1. The tax avoids *targeting* specific persons as sacrificial means (it’s systemic).  
  2. It addresses a **corrective justice** obligation (unlike the bone marrow case, which lacks historical/causal ties).  
  3. It upholds **procedural fairness** (e.g., legislation vs. unilateral seizure).  

  ---

  ### **The Best-Available Principle: Contractualism**
  **Scanlon’s Principle**: An act is wrong if it could be reasonably rejected by someone affected by it.  
  - **Trolley**: The one might reject being killed, but their objection is weaker than the five’s rejection of dying.  
  - **Surgeon/Bone Marrow**: The victim can reasonably reject being used as a resource.  
  - **Taxes**: The wealthy can’t reasonably reject a modest sacrifice for life-saving vaccines.  
  - **Reparations**: Descendants of the wronged can reasonably reject ongoing inequity; the wealthy can’t reasonably reject a one-time tax addressing documented injustice.  

  This captures your emphasis on **individual standing** without ignoring consequences.  

  ---

  ### **Which Intuitions to Re-examine?**
  1. **Statistical Deaths in Driving**: If driving risks are avoidable (e.g., self-driving cars), failing to mitigate them *might* become impermissible under your principles.  
  2. **Promise Trade-offs**: If breaking Promise A saves a life, keeping Promises B+C may be less defensible—life trumps promises.  

  --- 

  **In short**: You prioritize *how* costs are imposed (consent, role duties, systemic fairness) over arithmetic sums. The reparations tax is likely permissible if it meets contractualist standards—correcting injustice without reducing individuals to mere means.
