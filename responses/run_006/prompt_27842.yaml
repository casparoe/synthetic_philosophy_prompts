prompt: |-
  I am preparing to use a passage from a popular introduction to moral philosophy in an undergraduate course, and I would like a careful assessment of it before I do. The passage summarizes Kant's universalizability test as follows:

  "Kant's categorical imperative says that an action is permissible only if you could consistently will that everyone act on the same maxim — roughly, the same policy — in the same circumstances. The test is essentially a consistency check on what would happen if your policy were universalized. If universal adoption would produce a contradiction or make the practice self-defeating, the act is wrong: if everyone made lying promises to escape a difficulty, promising itself would collapse; and if everyone declined to help others in need, social life would become something no one could rationally accept. Morality, for Kant, is therefore a matter of not making an exception of yourself: universalizing a maxim just is a way of checking whether everyone's acting on it would have consequences we could all accept. That is why Kantian ethics and rule-utilitarianism are often said to coincide in practice, since both assess policies by asking what would happen if everyone followed them."

  I am inclined to think the final sentence overreaches, but I want a point-by-point audit rather than a general impression.

  Please structure your answer in four sections: (1) "What the summary gets right" (about 100 words); (2) "What is misleading or wrong" (about 250 words), going through the passage sentence by sentence; (3) "What Kant actually held" (about 150 words), correcting the main distortions; and (4) "Does the closing claim survive?" (about 100 words), assessing whether the alleged agreement with rule-utilitarianism follows from anything accurate in the summary.
