  - `alternative_diagnoses`: array of objects, each with fields `step` (string), `diagnosis` (string), and `costs` (string) — the two or three most serious alternative places one might locate the flaw, and what each would cost
  - `surviving_insight`: string — what the argument gets right even if it ultimately fails; what constraint on a theory of rational choice it reveals
