  A[Q1: Identical bridge in new society?] -->|Yes| B[Q2: Speed bump 'enforces' like human?]
  A -->|No| C[Q4: Nuclear control inherent?]
  B -->|Yes| D[ANT: Politics emerges from networks]
  B -->|No| E[Q3: Meaning reducible to user intent?]
  E -->|Yes| F[Instrumentalism: Neutral tools]
  E -->|No| G[SCOT: Social negotiation]
  C -->|Yes| H[Winner Strong: Inherent politics]
  C -->|No| I[Q5: Reversible via redesign?]
  I -->|Yes| J[Feenberg: Democratic redesign]
