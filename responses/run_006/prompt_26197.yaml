  Below is a decision tree that maps the logical space of positions on whether artifacts have politics. The tree starts with a single question and branches via concrete yes/no questions, each designed to be answerable without revealing the resulting position. The six required positions appear as leaves, with their most awkward commitments noted. Unoccupied logical spaces and inseparable positions are flagged at the end.

  ### Decision Tree: Do Artifacts Have Politics?
  **Start Here:**  
  **Q1:** Consider a highway bridge built with low overpasses (e.g., Robert Moses’s parkways). If an identical bridge were placed in a different society (e.g., one without racial segregation or buses), could it avoid excluding disadvantaged groups?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q4.  

  ---

  **If YES to Q1 (Politics is context-dependent):**  
  **Q2:** Can a speed bump be said to "enforce" speed limits independently, like a human traffic officer? (That is, do nonhumans *actively* shape outcomes, not just passively enable human actions?)  
  - **Yes** → **Leaf: (4) Actor-Network Theory (Latour)**.  
    - *Awkward commitment*: Ascribing symmetrical agency to nonhumans (e.g., claiming a speed bump "negotiates" with drivers) risks anthropomorphizing objects and diluting accountability.  
  - **No** → Go to Q3.  

  **Q3:** Is the political meaning of a technology (e.g., a factory machine) reducible *entirely* to the intentions of its users? (Could it have unintended effects, like empowering a group the designer never considered?)  
  - **Yes** → **Leaf: (6) Instrumentalism**.  
    - *Awkward commitment*: Insisting artifacts are *always* neutral tools requires dismissing cases where design constraints inherently favor certain groups (e.g., Moses’s bridges) as coincidental.  
  - **No** → **Leaf: (5) Social Constructivism (SCOT)**.  
    - *Awkward commitment*: Claiming politics arises *only* from social interpretation ignores how material constraints (e.g., a bridge’s height) resist reinterpretation.  

  ---

  **If NO to Q1 (Politics is design-dependent):**  
  **Q4:** Is authoritarian control inherent to *any* nuclear reactor, regardless of design or society? (i.e., Could no alternative reactor design avoid centralization?)  
  - **Yes** → **Leaf: (1) Winner’s Strong Thesis**.  
    - *Awkward commitment*: Asserting that technologies like nuclear power *require* authoritarianism ignores counterexamples (e.g., decentralized renewables) and implies technological determinism.  
  - **No** → Go to Q5.  

  **Q5:** Could the political bias in a technology (e.g., Moses’s bridges) be reversed via democratic redesign? (e.g., Raising the bridges without scrapping the entire highway system?)  
  - **Yes** → **Leaf: (3) Feenberg’s Democratic Rationalization**.  
    - *Awkward commitment*: Assuming technical codes can *always* be democratically contested underestimates how deeply embedded power structures resist redesign (e.g., proprietary software).  
  - **No** → **Leaf: (2) Winner’s Weak Thesis**.  
    - *Awkward commitment*: Claiming path dependencies are *effectively irreversible* understates human ingenuity in subverting or retrofitting artifacts (e.g., repurposing exclusionary infrastructure).  

  ---

  ### Unoccupied Logical Spaces & Diagnosis
  - **Path: Q1=No → Q4=Yes → Q5=Yes**  
    - *Diagnosis*: **Incoherent**. If politics is inherent to a technology type (Q4=Yes), it cannot be redesigned away (Q5=Yes). This conflates necessity with contingency.  
  - **Path: Q1=Yes → Q2=Yes → Q3=Any**  
    - *Diagnosis*: **Unexplored**. ANT (Q2=Yes) rejects reducing politics to *either* human intentions (Q3=Yes) *or* social negotiation (Q3=No), so Q3 is irrelevant. The tree bypasses this via Q2.  

  ### Indistinguishable Positions & Resolution
  - **Feenberg (3) vs. SCOT (5)** could be conflated if "redesign" (Q5) is misinterpreted as "reinterpretation."  
    - *Resolution*: Add a **sub-question for Q1=No → Q4=No**:  
      **Q5a:** Does changing the politics require *physical modification* of the artifact (e.g., altering the bridge), or just new social practices?  
      - Physical modification → Feenberg (3).  
      - Social practices only → SCOT (5) (but SCOT is already in Q1=Yes branch).  
      This clarifies that Feenberg demands *material redesign*, while SCOT focuses on *interpretive flexibility*.  

  ### Tree Structure Summary
