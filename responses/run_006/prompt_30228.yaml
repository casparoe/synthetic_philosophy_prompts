prompt: |-
  I'm TAing a third-year decision theory course and next week I've got to teach the Allais paradox and the independence axiom in one fifty-minute section. The students know how to compute expected utility for simple lotteries, but they havent seen the axioms and most of them think the Allais thing is just about people being bad at math. I don't need the paradox explained to me — I need a plan for how to explain it. What has to come first, and in what order should the pieces go so the independence axiom shows up as the exact thing the example violates, rather than as a bit of formalism I impose afterward? By the end I want them to see why the second pair just is the first pair mixed with a common third lottery, and why the axiom then forces the same choice in both pairs. If you'd use something other than the original Allais pair as the carrying example, say so, and say what a good pair has to have and not have — I suspect it needs a big common-consequence chunk and a tiny probability difference, but I'm not sure. What misconceptions should I expect (I'm betting on 'this just shows expected utility is descriptively false so we should drop it' and 'it's only the certainty effect / risk aversion'), and where in the sequence should I head each one off? What should I explicitly say we're not going to settle at this level? And give me one end-of-section question that would show they understand the axiom and the violation, not just that they can reproduce the numbers.
reasoning: |-
  Okay, let's tackle this TA's problem. They need to teach the Allais paradox and the independence axiom in a fifty-minute section. The students already know how to compute expected utility but haven't seen the axioms. The main challenge is to present the independence axiom as the exact thing violated by the paradox, not just as an afterthought. 

  First, I should consider the students' misconceptions. The TA mentioned that many think the Allais paradox is just about people being bad at math. Others might think it shows expected utility is descriptively false, so we should drop it, or attribute it solely to the certainty effect or risk aversion. These need to be addressed during the lesson.

  The key is to structure the session so that the independence axiom emerges naturally from the paradox. Starting with the Allais choices makes sense because it's concrete. The original Allais pair uses a common consequence, which is crucial. Alternatives might be less effective if they don't have that large common consequence chunk and a tiny probability difference. So sticking with the original is probably best.

  Breaking down the session into timed segments helps. First, present the two choice pairs and have students vote. Then analyze preferences to highlight the contradiction. Next, reframe the second pair as a mixture with a common lottery. This is where the independence axiom should be introduced—showing it as the hidden structure in the choices. Explain why the axiom forces consistent choices, and how violating it leads to the paradox.

  Addressing misconceptions is vital. When students suggest it's just bad math, emphasize that even rational people choose this way. Later, when discussing risk aversion, clarify that the paradox occurs even if we control for it. And when they say expected utility should be discarded, point out its normative value and how axiomatic approaches help identify inconsistencies.

  End with a question that tests understanding beyond numbers. A good one asks which axiom is violated and why the choices conflict with it, requiring them to explain the common lottery mixture. This ensures they grasp the structural issue, not just the calculations.

  Need to make sure each step flows into the next, with clear transitions. Timing is tight, so practice is essential. Also, prepare slides with the lotteries visualized to aid comprehension. By the end, students should see the independence axiom not as abstract but as the logical constraint that the Allais paradox challenges.
answer: |-
  Here’s a battle-tested plan for your 50-minute section, designed to make the independence axiom emerge *from* the Allais paradox. The key is structuring the sequence so students **discover** the axiom as the missing rule that resolves their confusion.

  **Core Example:** **Use the original Allais pair (1953).** It’s iconic, and its structure perfectly highlights the common consequence. Alternatives often obscure the key mechanism.

  *   **What a good pair needs:**
      *   A **large "common consequence" chunk** in both pairs (e.g., 89% chance of $1M in Pair 1).
      *   A **small probability difference** driving the shift in preference (e.g., 1% chance of $0 vs. 0% in Pair 1A).
      *   **Controlled values:** Avoid extreme risk aversion triggers; focus on the structural violation. ($1M, $5M, $0 work well).

  **Lesson Plan (50 Minutes):**

  1.  **Hook & Setup (5 mins):**
      *   "We know EU is a powerful tool. But do people *always* choose according to EU, even when they understand the math? Today we look at a famous puzzle that challenges this."
      *   Briefly define a lottery (reminder): Probabilities over outcomes.
      *   **State Goal:** "By the end, you'll see why this puzzle is deeper than bad math – it points to a fundamental axiom of rational choice under uncertainty."

  2.  **Present the Allais Choices & Vote (10 mins):**
      *   **Display Pair 1 CLEARLY (Visual Aid is Crucial!):**
          *   **Option 1A:** `100% chance of $1 Million`
          *   **Option 1B:** `10% chance of $5 Million` + `89% chance of $1 Million` + `1% chance of $0`
      *   **Ask:** "If you *had* to choose ONE from Pair 1, which would you pick? Show of hands (1A or 1B)." *Record results.* (Expect strong majority for 1A).
      *   **Display Pair 2 CLEARLY:**
          *   **Option 2A:** `11% chance of $1 Million` + `89% chance of $0`
          *   **Option 2B:** `10% chance of $5 Million` + `90% chance of $0`
      *   **Ask:** "If you *had* to choose ONE from Pair 2, which would you pick? Show of hands (2A or 2B)." *Record results.* (Expect strong majority for 2B).
      *   **Highlight the Conflict:** "Notice a pattern? Most people choose 1A over 1B, *and* 2B over 2A. Let's see what EU says..."

  3.  **EU Calculation & The Puzzle (7 mins):**
      *   Assign utilities: `U($0) = 0`, `U($1M) = 1`, `U($5M) = u` (Note: `u > 1`, exact value *doesn't matter yet*).
      *   **Calculate Pair 1:**
          *   `EU(1A) = 1 * U($1M) = 1`
          *   `EU(1B) = (0.10 * u) + (0.89 * 1) + (0.01 * 0) = 0.10u + 0.89`
          *   **Preferring 1A implies:** `1 > 0.10u + 0.89` => `0.11 > 0.10u` => `u < 1.1`
      *   **Calculate Pair 2:**
          *   `EU(2A) = (0.11 * 1) + (0.89 * 0) = 0.11`
          *   `EU(2B) = (0.10 * u) + (0.90 * 0) = 0.10u`
          *   **Preferring 2B implies:** `0.10u > 0.11` => `u > 1.1`
      *   **THE CONTRADICTION:** "Uh oh! To prefer 1A, you need `u < 1.1`. To prefer 2B, you need `u > 1.1`. You *cannot* have both `u < 1.1` and `u > 1.1`. EU forbids this combination of choices. But most people *do* make these choices. This is the Allais Paradox. Why?"

  4.  **Unpacking the Shift & Introducing Common Consequence (8 mins):**
      *   **Focus on the 89%:** "Look closely at Pair 1B and Pair 2A. What happens in 89% of cases?"
          *   1B: `89% chance $1M`
          *   2A: `89% chance $0`
      *   **Reframe Pair 2:** "Notice that Option 2A is *exactly like* Option 1A *except* that instead of the 89% $1M, it has 89% $0. Similarly, Option 2B is like Option 1B *except* that instead of the 89% $1M, it has 89% $0."
      *   **The Crucial Insight:** "Pair 1 is: `(1A vs 1B) = (Guaranteed $1M vs. A gamble that mostly gives $1M but has small chances of $5M or $0)`. Pair 2 is: `(2A vs 2B) = (Take the 'safe' part of 1A but replace its safe $1M chunk with $0` vs. `Take the 'risky' part of 1B but replace its safe $1M chunk with $0)`."
      *   **Student Prompt:** "What *changed* between Pair 1 and Pair 2 regarding that 89% chunk? How did the relationship between Option A and Option B *within each pair* change when we swapped that 89% $1M for 89% $0?" (Guide them: The *difference* between A and B within their pair remained the same 10% gamble vs. 11% safe, but the *common background* changed).

  5.  **Introducing the Independence Axiom (The "Aha!" Moment) (12 mins):**
      *   **State the Intuition:** "A fundamental principle of rational choice under uncertainty says: **If two options differ *only* in a part of the lottery that is *identical* between them, then your preference between them should depend ONLY on the parts that are different, NOT on the identical part.** That identical part is irrelevant to the choice between them."
      *   **Formalize it (Simply):** "Let P, Q, R be lotteries. Let α be a probability (0 < α < 1). The Independence Axiom says: If you prefer P to Q, then you *must* prefer the mixture `[αP + (1-α)R]` to the mixture `[αQ + (1-α)R]`."
      *   **Apply to Allais:** "Look back! Let:
          *   `P = Guaranteed $1M` (This is Option 1A)
          *   `Q = 10% $5M + 89% $1M + 1% $0` (This is Option 1B)
          *   `R = Guaranteed $1M` (Wait... need something else!)
      *   **Identify the Common Lottery:** "Notice the 89% chunk? In Pair 1, both options *effectively* have an 89% chance of $1M. In Pair 2, both options have an 89% chance of $0. Call this common 89% chunk lottery `R`."
          *   Define `R₁ = $1M for sure` (the common consequence in Pair 1)
          *   Define `R₂ = $0 for sure` (the common consequence in Pair 2)
      *   **Reframe using Mixtures (The Key Step):**
          *   **Option 1A:** `[11% of P + 89% of R₁]` where `P = $1M for sure`. *But P is identical to R₁!* Refine:
              *   Think of 1A as `[100% of P]` where `P = $1M`. The 89% is *part of P*.
          *   **Better Reframing:** Focus on the *varying* 11% part:
              *   **Option 1A:** `11% chance of $1M + 89% chance of R₁ ($1M)` = **`[11% of S + 89% of R₁]`** where `S = $1M for sure`.
              *   **Option 1B:** `11% chance of G + 89% chance of R₁ ($1M)` = **`[11% of G + 89% of R₁]`** where `G = 10/11 $5M + 1/11 $0` (the gamble conditional on the 11%).
          *   **Pair 1 Choice:** `S` vs `G` mixed with `R₁`.
          *   **Pair 2 Choice:** *Same S and G!*
              *   **Option 2A:** `11% chance of $1M + 89% chance of R₂ ($0)` = **`[11% of S + 89% of R₂]`**
              *   **Option 2B:** `11% chance of G + 89% chance of R₂ ($0)` = **`[11% of G + 89% of R₂]`**
      *   **The Axiom's Demand:** "Independence says: Your preference between mixing `S` with `R₁` vs. mixing `G` with `R₁` (Pair 1) should be the *same* as your preference between mixing `S` with `R₂` vs. mixing `G` with `R₂` (Pair 2). Because the choice should only depend on `S` vs `G`! The common `R` (`R₁` or `R₂`) is irrelevant. Choosing 1A (S w/ R₁) over 1B (G w/ R₁) implies S > G. This *forces* you to prefer 2A (S w/ R₂) over 2B (G w/ R₂). But people prefer 2B over 2A! **They are letting the *common consequence* `R` (`$1M` vs `$0`) influence their choice between `S` and `G`.** This violates Independence."

  6.  **Addressing Misconceptions & Scope (5 mins):**
      *   **"It's just bad math / risk aversion":** "We saw the math is clear (`u < 1.1` and `u > 1.1` is impossible). While risk aversion (`u < 1.1`) explains preferring 1A, it *requires* preferring 2A. The paradox is the *switch* to 2B. Independence violation explains the *inconsistency* itself."
      *   **"It's the certainty effect":** "Yes, the certainty of $1M in 1A is psychologically powerful! But the independence axiom tells us *why* that certainty effect leads to inconsistency when the common consequence changes. The axiom forces us to ignore the 'safety' of the common part when comparing the differing parts."
      *   **"So EU is descriptively false, drop it!":** **Crucial Point:** "This shows EU (as defined by these axioms) is *descriptively* imperfect. But it remains incredibly powerful *normatively* (how we *should* choose to avoid inconsistencies) and as a benchmark. Much of modern decision theory (like Prospect Theory) starts by understanding *how* and *why* axioms like Independence are violated descriptively. We're not dropping EU today; we're understanding one of its core assumptions and a major challenge to it."
      *   **What we're NOT settling:** "We're not deciding if EU is 'right' or 'wrong' overall. We're not fully exploring *why* people violate independence (psychology). We're seeing how an axiom defines rational consistency and how a famous paradox violates that specific axiom."

  7.  **Wrap-up & Key Takeaway (3 mins):**
      *   "The Allais Paradox reveals a deep inconsistency in how people evaluate lotteries when a large common consequence changes."
      *   "The Independence Axiom requires that adding the same common consequence to two options shouldn't change your preference between them."
      *   "Violating Independence means your preference depends not just on the differences between options, but also on irrelevant common outcomes. This can lead to choices that are impossible under Expected Utility."
      *   "This isn't just 'bad math'; it's a systematic violation of a principle of consistent choice."

  **End-of-Section Question (Tests Understanding of Axiom & Violation):**

  > "Consider the following two pairs of lotteries:
  >
  > *   **Pair X:**
  >     *   Option X1: 70% chance of $100, 30% chance of $0
  >     *   Option X2: 60% chance of $150, 40% chance of $0
  > *   **Pair Y:**
  >     *   Option Y1: 70% chance of $100, 30% chance of **$50**
  >     *   Option Y2: 60% chance of $150, 40% chance of **$50**
  >
  > Suppose a person chooses **X1** over X2 in Pair X, but chooses **Y2** over Y1 in Pair Y.
  >
  > (a) Explain how this pattern of choices might violate the Independence Axiom. (Hint: Identify a common consequence `R` and lotteries `P` and `Q` such that Pair Y involves mixing `P` and `Q` with `R`).
  >
  > (b) Does this pattern *necessarily* violate Expected Utility Theory? Briefly explain why or why not."

  **Why this question works:**
  1.  It uses a *different* example, forcing transfer, not recall.
  2.  Part (a) explicitly asks them to *apply* the Independence Axiom structure (identify R, P, Q, mixtures).
  3.  Part (b) checks if they understand the violation is about *inconsistency* (Yes, it necessarily violates EU for the same reason Allais does: `EU(X1) > EU(X2)` implies a utility inequality contradicted by `EU(Y2) > EU(Y1)`).
  4.  It avoids simple EU calculation; it requires understanding the *axiomatic conflict*.
  5.  The common consequence ($50 vs $0) and probability structures mirror Allais logically.

  **Pro Tips:**
  *   **VISUALS ARE KEY:** Use tables, probability trees, or Venn diagrams to show the lotteries and highlight the common chunks. Animating the "mixture" step is very effective.
  *   **TIMING:** Practice! 50 mins is tight. Stick to the slots. Don't get bogged down in EU calc proofs.
  *   **LANGUAGE:** Use "common consequence," "mix/mixture," "differ only in..." constantly. Reinforce the structural similarity.
  *   **POLLING:** Use clickers or show of hands actively. The conflict between Pair 1 and Pair 2 choices is the engine.
  *   **EMPHASIZE:** The goal isn't to "fix" the choice, but to see the *inconsistency* revealed by the axiom.

  This sequence builds from concrete choice → contradiction → structural analysis → axiom formalization → misconception addressing. The independence axiom emerges as the necessary (and violated) rule for consistency. Good luck!
