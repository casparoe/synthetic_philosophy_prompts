answer: |-
  ### Taxonomy of Positions on Supererogation  
  *For a Graduate Seminar on Moral Theory*  

  This taxonomy classifies positions on whether morally good acts exist that are not morally required. Each branch is defined by a concrete diagnostic question, forcing a choice about structural features (not labels). Work through the questions to locate your view. Positions marked ★ are standardly defended; others are noted as unoccupied.  

  ---

  #### Start: Question 1  
  **Is there any act such that performing it is morally good, yet failing to perform it is not morally wrong?**  
  *(This distinguishes views that allow for a "third category" beyond duty.)*  

  - **No** → **Position (a): No Third Category**  
    ★ All morally significant acts are either required or forbidden. Good acts are precisely those that are required; no "good but optional" acts exist.  
    *Associated with: Act-utilitarianism (e.g., Bentham), strict Kantianism (e.g., on some readings of the Categorical Imperative).*  

  - **Yes** → Proceed to Question 2.  

  ---

  #### Question 2 (for "Yes" to Question 1)  
  **Consider this case: A passerby sees a child drowning in a shallow pond. Wading in to save her would ruin the passerby’s expensive suit. Is the passerby morally required to save the child?**  
  *(This tests whether cost to the agent can negate a duty.)*  

  - **Yes** → Proceed to Question 3.  
    *(Saving the child is obligatory despite the cost.)*  
  - **No** → **Position (b): Sacrifice-Defined Supererogation**  
    ★ Supererogatory acts exist and are distinguished by demanding significant sacrifice/cost from the agent. Acts become supererogatory (rather than obligatory) when they impose nontrivial costs (e.g., ruined suit).  
    *Associated with: Common-sense morality (e.g., Urmson), moderate deontology.*  

  ---

  #### Question 3 (for "Yes" to Question 2)  
  **Can an act be supererogatory (good but not required) if it imposes no significant cost on the agent?**  
  *(This tests whether supererogation requires sacrifice.)*  

  - **Yes** → Proceed to Question 4.  
  - **No** → **Logically possible but unoccupied position**  
    *Unoccupied because: (1) Incoherent if all costly acts are already handled under Position (b), or (2) unattractive—it implausibly implies that costless acts (e.g., effortlessly donating spare wealth) cannot be supererogatory.*  

  ---

  #### Question 4 (for "Yes" to Question 3)  
  **Is there any supererogatory act that falls entirely outside the scope of a general duty (e.g., beneficence)?**  
  *(This distinguishes whether supererogation is constrained by duties or transcends them.)*  

  - **Yes** → **Position (c): Ideals-Based Supererogation**  
    ★ Supererogation is grounded in the optional pursuit of ideals (e.g., sainthood, heroism) or values beyond duty. Such acts are good but not required, independent of sacrifice or existing duties.  
    *Associated with: Scheffler (The Rejection of Consequentialism), Raz (on optional values).*  
  - **No** → **Position (d): Imperfect-Duty Supererogation**  
    ★ Supererogatory acts exist but only as meritorious ways to fulfill "imperfect duties" (duties with latitude, e.g., beneficence). They are optional in timing/manner but fall within the broader scope of a duty.  
    *Associated with: Kantianism (e.g., Baron on beneficence), rule-utilitarianism.*  

  ---

  ### Notes on Unoccupied Positions & Ambiguities  
  1. **Position requiring sacrifice + confined to imperfect duties**:  
     - Logically possible (e.g., "only costly acts within beneficence are supererogatory").  
     - Unoccupied because: (a) Unattractive—it excludes costless supererogation (e.g., easy rescues), and (b) redundant—if confined to duties, sacrifice adds no new distinction.  

  2. **Ambiguous boundary between (c) and (d)**:  
     - If an ideal (e.g., heroism) overlaps with an imperfect duty (e.g., beneficence), is the act (c) or (d)?  
     - **Additional question needed**: *"Does the moral value of a supererogatory act derive solely from fulfilling a duty, or can it arise independently?"*  
       - Duty-derived → (d)  
       - Independent → (c)  

  3. **Position denying "optional goodness" but accepting cost-based exemptions**:  
     - Logically possible (e.g., "all acts are required unless costly, but costly acts are merely permissible, not good").  
     - Unoccupied because: (a) Incoherent—if an act is good when done despite cost, failing to act should be criticizable, and (b) empirically unsupported (e.g., we praise costly rescues).  

  ---

  ### Purpose of this Taxonomy  
  By using cases and structural questions (e.g., sacrifice, duty-scope), this tree avoids reliance on jargon. It reveals commitments:  
  - **Deniers of supererogation** (Position a) collapse good into required.  
  - **Sacrifice-based views** (b) tie optionality to cost.  
  - **Duty-based views** (d) tether supererogation to imperfect obligations.  
  - **Ideals-based views** (c) detach supererogation from duty altogether.  

  Locate your view by working backward from the cases. For instance, if you judge the pond rescue non-obligatory due to cost, you’re committed to (b); if you deem it obligatory but allow other supererogatory acts, you branch toward (c)/(d).
