prompt: |-
  You are a professional philosopher working at the intersection of moral psychology and political philosophy, with a specialist's grasp of the literature on paternalism, autonomy, and the ethics of influence. I teach a graduate seminar on paternalism and nudging, and a running disagreement has emerged that I would like your help in making tractable and explicit. The proposition under dispute is this: default-setting nudges of the sort used in opt-out organ donation and automatic retirement-savings enrollment — where a government enrolls people by default while allowing them to opt out at trivial cost — are objectionably manipulative in a sense strong enough to make their use presumptively impermissible, even when the chosen default is plausibly in the enrollee's own interest. Please resist the temptation to answer that it depends on what one means by "manipulative." The task is precisely to force your own interpretation into the open and then commit to a number.

  Before committing, brainstorm the candidate sub-questions and the readings of "manipulative" and "presumptively impermissible" that you are implicitly adopting. Then give me a single number: your all-things-considered credence that the proposition is true. Decompose that credence into at least four sub-questions, assigning each a rough probability and one line of justification. Useful sub-questions might include: whether a nudge is manipulative only if it deliberately bypasses or exploits a cognitive defect, rather than merely working through ordinary heuristics; whether a stable, non-ad-hoc line can be drawn between exploiting a bias and adapting a policy to how people actually choose; whether such defaults are better modeled as a soft form of coercion or as a respectful response to the fact that many people prefer not to choose; and whether the presumption of impermissibility is doing real work, in the sense that it could be defeated by the welfare gains of the typical case. Add or replace sub-questions if you think my decomposition mislocates the issue. Then show, however roughly, how the numbers combine, and identify the sub-question to which the aggregate is most sensitive — the single number that, if changed, would move your credence the most.

  For calibration: my own credence is around 0.35, and a colleague of mine holds roughly 0.7. After giving your own number and decomposition, tell me where the disagreement between someone at 0.35 and someone at 0.7 most likely lives, and say what evidence or argument would most shift your most sensitive sub-question. I am less interested in the specific number than in seeing the architecture of the reasoning, with its weak points marked.
