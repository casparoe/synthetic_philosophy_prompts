prompt: |-
  I'm an analyst at a large e-commerce company, and I've been studying how our executive team has handled metric problems over the past five years. I've compiled their track record on seven occasions where a team reported that a performance metric was being gamed:

  1. **Warehouse**: workers were meeting their "items picked per hour" target by skipping quality checks. The executive team replaced the metric with a composite of speed and accuracy. (*Changed the metric.*)

  2. **Customer service**: agents were hitting their "tickets closed per day" target by closing tickets prematurely, forcing customers to open new ones. The executive team kept the metric but added a "reopen rate" counter-metric and a monthly audit of a random sample of closed tickets. (*Kept the metric, added safeguards.*)

  3. **Sales**: the team was hitting quarterly revenue targets by discounting heavily in the final weeks, which eroded margins. The executive team kept the revenue target but added a margin floor below which deals wouldn't count toward the target. (*Kept the metric, added constraints.*)

  4. **Engineering**: the "story points completed per sprint" metric was leading teams to inflate their estimates. The executive team removed the metric entirely and instructed engineering managers to evaluate team output qualitatively. (*Removed the metric.*)

  5. **Marketing**: the "cost per lead" metric was being gamed by running campaigns that generated large volumes of low-quality leads. The executive team replaced it with "cost per qualified lead," where qualification required that a lead had completed a sales call. (*Changed the metric.*)

  6. **Content**: the "articles published per month" metric was driving a decline in quality. The executive team kept the metric but added a mandatory editorial review step before publication. (*Kept the metric, added safeguards.*)

  7. **Recruiting**: the "time to fill" metric was leading recruiters to rush candidates through the pipeline. The executive team kept the metric as-is, arguing that the problem was in execution, not measurement, and that managers should coach their recruiters to resist the pressure. (*Kept the metric, no changes.*)

  Now we're facing a new case. The product team's "features shipped per quarter" metric has been in place for three years. Over the past year, the team has been shipping smaller and smaller features — many are minor UI tweaks that users barely notice. The team's velocity number looks excellent, but the product isn't meaningfully improving. The head of product wants to keep the metric but add a requirement that each feature receive a "user impact" score before it counts toward the quarterly target. The head of engineering argues that any shipping metric will eventually be gamed and that we should abandon quantitative targets for shipping entirely and evaluate the team's output qualitatively, as we did with engineering story points.

  Based on our executive team's track record, what would they most likely decide? Which precedent is the closest analog to this situation? And if their precedents genuinely underdetermine the answer, what principle would they be adopting with each choice?
reasoning: |-
  Okay, let's tackle this problem step by step. The user is an analyst at an e-commerce company looking at how the executive team handles gamed metrics. They've provided seven historical cases and now have a new situation with the product team's "features shipped per quarter" metric. The question is what the executives would likely decide based on past actions.

  First, I need to recall the seven precedents. The executive team had three main approaches: changing the metric, keeping it with safeguards/constraints, removing it entirely, or keeping it unchanged. For Warehouse and Marketing, they changed the metric to something more composite or qualified. Customer Service, Sales, and Content kept the metric but added safeguards or constraints. Engineering removed the metric entirely. Recruiting kept it without changes.

  Now, the new case: "features shipped per quarter" leading to smaller, less impactful features. The head of Product wants to keep the metric but add a "user impact" score. The head of Engineering suggests removing quantitative targets altogether, similar to the Engineering precedent.

  I should look for the closest analog. The Content case (#6) seems relevant because they kept the "articles published per month" metric but added an editorial review. That's a safeguard to ensure quality. Similarly, the Product head's suggestion is adding a user impact score before counting features. That's a safeguard too. 

  But in Engineering (#4), they removed the metric entirely because estimates were being inflated. The Engineering head here is arguing the same—that any shipping metric will be gamed. However, in Engineering, they removed the metric and switched to qualitative evaluation. 

  The key difference is whether the metric can be fixed with safeguards. In Content, they believed the editorial review would mitigate quality issues without scrapping the metric. In Engineering, they decided against any quantitative measure. 

  The new situation has two proposals: Product's safeguard (user impact score) vs. Engineering's removal. The precedents show that when metrics lead to declining quality, they sometimes add safeguards (like Customer Service with reopen rates, Content with editorial review) rather than removing them. Only in Engineering did they remove it entirely, possibly because estimating story points was inherently problematic.

  Also, in Recruiting (#7), they kept the metric without changes, arguing execution was the issue. But in this case, both heads acknowledge a problem, so that's not applicable.

  So the closest analog is Content (#6): kept the metric but added a safeguard. The executive team would likely favor the Product head's approach—adding a user impact score. This maintains quantitative tracking but addresses quality concerns. Removing the metric entirely, as in Engineering, might be seen as overkill if safeguards can realign incentives. Therefore, the probable decision is to keep "features shipped" but require a user impact score for each feature to count.
answer: |-
  Based on your executive team's track record and decision patterns, here's the most likely outcome and reasoning:

  **Most Likely Decision:**  
  The executive team would **keep the "features shipped per quarter" metric but add the "user impact score" requirement** proposed by the Head of Product.

  **Closest Analog:**  
  **Content Team (Case #6: "Articles published per month" + editorial review)**.  
  This precedent is the strongest match because:
  - Both involve a *volume-based output metric* (articles/features) driving *quality erosion*.
  - Both solutions retain the core metric while *adding a quality gate* (editorial review → user impact score).
  - The executive team has consistently favored this "metric + safeguard" approach for creative/output-focused teams (Customer Service #2, Sales #3, Content #6).

  ### Why Other Precedents Are Less Applicable:
  - **Engineering (Case #4)** involved *inherently subjective estimation* (story points), which is fundamentally different from *counting tangible outputs* (features). Removing metrics for estimation isn’t comparable to shipping.
  - **Warehouse/Marketing (Cases #1 & #5)** replaced metrics entirely, but both had *objective alternatives* (composite speed/accuracy, qualified leads). "User impact" is subjective and can’t standalone as a replacement.
  - **Recruiting (Case #7)** kept the metric unchanged, but the problem was attributed to *execution* (rushing candidates). Here, the metric *directly incentivizes* trivial features.
  - **Sales (Case #3)** added a *clear quantitative constraint* (margin floor). "User impact scores" are qualitative, aligning more with Content’s editorial safeguard.

  ### Principles Behind the Choices:
  If precedents were ambiguous (which they aren’t here), the team’s approach reveals two guiding principles:  
  1. **"Metric + Safeguard" Principle**:  
     *When a metric measures tangible output but incentivizes corner-cutting, add a quality-control step.*  
     (Applied to Customer Service, Sales, Content, and now Product).  
     *Rationale*: Output volume is valuable if quality is enforced; abandoning measurement risks underinvestment.  

  2. **"Remove Only When Inherently Flawed" Principle**:  
     *Remove metrics only when they measure ambiguous or unverifiable outcomes (e.g., story points).*  
     (Applied only in Engineering’s case).  
     *Rationale*: Subjective estimates can’t be "fixed" with safeguards—they require qualitative judgment.  

  ### Why Product’s Situation Fits "Metric + Safeguard":
  - **Features shipped** is a concrete output (like articles/tickets), not an estimate.  
  - The problem (trivial features) mirrors Content’s quality decline, not Engineering’s estimation inflation.  
  - A "user impact score" acts as a gatekeeper, analogous to editorial review.  

  **Predicted Outcome**: The Head of Engineering’s argument will be rejected because:  
  ① Shipping features is a *measurable output*, unlike story points.  
  ② The team has *never removed a metric for tangible deliverables*; they consistently add safeguards.  
  ③ The executive team trusts *process-based solutions* (audits, reviews, scores) to correct gaming.  

  *Recommendation for the Analyst*: Frame the "user impact score" as a *standardized editorial process* (like Content’s review) to ensure executive alignment. Highlight that removal would contradict their 5-year pattern of preserving output metrics with quality controls.
