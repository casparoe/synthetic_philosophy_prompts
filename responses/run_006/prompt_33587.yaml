prompt: |-
  I teach an upper-level undergraduate seminar in experimental philosophy, twelve students, one eighty-minute session. Design a classroom activity in which students first serve as subjects in a minimal-pair judgment task modeled on the Knobe effect, then work in small groups to articulate what principle separates the two cases, and finally confront the aggregate pattern of their own responses before the phenomenon is named. I want the surprise to be felt rather than reported: before the judgments are tallied, each student must write down and publicly commit to a prediction about how the class will respond, and the facilitator must not introduce the name or the standard interpretation until the debrief. Specify the vignettes to use, written in your own words rather than quoted from the published studies, and design them so that one case involves a norm violation and the other a norm-conforming action with structurally similar side effects. Then give a procedure for collecting judgments without social contamination, a timeline for the eighty minutes, and a debrief that maps the class's responses to the distinction between acting intentionally and acting with foresight, the role of norm violations in producing the asymmetry, and the broader experimental-philosophy question of what folk intuitions can and cannot tell us about concepts. By the end, students should see the asymmetry as a live feature of their own judgments rather than a reported finding, and as a methodological challenge for reading concepts off intuitions. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be explicit about which feature of the effect a classroom replication cannot reproduce and must be supplied by the instructor instead.
reasoning: |-
  We are designing an activity for an 80-minute upper-level undergraduate seminar on experimental philosophy, with 12 students. The activity will focus on the Knobe effect (also known as the side-effect effect). The key elements are:
   1. Students will serve as subjects in a minimal-pair judgment task.
   2. They will then work in small groups to articulate the principle that separates the two cases.
   3. They will confront the aggregate pattern of their own responses, with each student committing to a prediction about the class response before the tally.
   4. The facilitator will not name the effect or give the standard interpretation until the debrief.

   The vignettes: We need two cases that are structurally similar but one involves a norm violation and the other a norm-conforming action, both with side effects.

   Classic Knobe effect: 
     - Harm condition (norm violation): A CEO decides to implement a new program that will harm the environment, and he does so because he doesn't care about the environment.
     - Help condition (norm conforming): A CEO decides to implement a new program that will help the environment, and he does so because he doesn't care about the environment.

   We'll write our own versions to avoid direct quotes.

   Let me create two vignettes:

   Vignette 1 (Harm condition):
     "The CEO of a large corporation is considering a new policy that would increase profits. The Vice President of the company tells the CEO: 'Implementing this policy will definitely increase our profits, but it will also harm the environment.' The CEO responds: 'I don't care at all about harming the environment. I just want to make as much profit as possible. Let's implement the policy.' They implement the policy. As a result, the environment is harmed."

   Vignette 2 (Help condition):
     "The CEO of a large corporation is considering a new policy that would increase profits. The Vice President of the company tells the CEO: 'Implementing this policy will definitely increase our profits, and it will also help the environment.' The CEO responds: 'I don't care at all about helping the environment. I just want to make as much profit as possible. Let's implement the policy.' They implement the policy. As a result, the environment is helped."

   We will ask the same question in both cases: "Did the CEO intentionally harm/help the environment?" (with the verb adjusted accordingly).

   However, note: the standard Knobe effect is about the asymmetry in the intentionality attribution. We expect a high rate of "yes" in the harm condition and a low rate in the help condition.

   Procedure to avoid social contamination:
     - We will divide the class into two groups. One group will see the harm vignette and the other the help vignette. We don't want students to see both at the same time because that might prime them to the asymmetry.

     But note: the activity requires that they later work in groups to articulate the principle that separates the two cases. So we must reveal both cases to everyone at some point. However, during the initial judgment, we want to avoid contamination.

     Proposed procedure for judgment collection:
       Step 1: Split the class into two halves (6 students each). Group A gets the harm vignette, Group B the help vignette.
       Step 2: Each student reads their assigned vignette and answers the question: "Did the CEO intentionally [harm/help] the environment?" (Yes/No) and also a confidence rating (e.g., 1-5, but we can keep it simple with just the binary if time is tight). We are primarily interested in the binary judgment.
       Step 3: Collect the responses privately (e.g., on slips of paper) without discussion.

     Step 4: Then, we form new groups that include both A and B. Since we have 12 students, we can form 3 groups of 4 (each group will have 2 from A and 2 from B). In these mixed groups, students share the two vignettes (each student describes the vignette they saw) and then try to articulate what principle separates the two cases. They should not reveal their own judgment yet to avoid biasing the group.

     Step 5: After group discussion, each group writes down a principle.

     Step 6: Now, we bring the class together. Before revealing the class responses, each student must write down a prediction: "What percentage of the class do you think said 'yes' to the harm vignette? What percentage said 'yes' to the help vignette?" They commit to this prediction by writing it down and handing it in (or we can have them announce and record).

     Step 7: Then, the instructor reveals the aggregate responses from the initial collection (for each vignette separately). We tally the number of "yes" for the harm condition and the help condition.

     Step 8: Now, we have the surprise: we expect a large asymmetry (high percentage for harm, low for help). The instructor then names the effect and leads a debrief.

   Timeline for 80 minutes:

     0-10 min: Introduction to the activity (without revealing the topic). Distribute the vignettes (half the class gets harm, half help). Students read and write their judgment (yes/no) on a slip of paper. Collect the slips.

     10-15 min: Form new groups (each group has 2 harm and 2 help). In these groups, students describe the vignette they saw (without revealing their judgment) and then together try to articulate the principle that differentiates the two cases.

     15-30 min: Group discussion (15 minutes) to come up with a principle. Each group writes down their principle on a sheet.

     30-40 min: Each group reports their principle. The instructor writes them on the board.

     40-45 min: Each student individually writes down their prediction for the class responses (e.g., "I predict that X% of the class said the CEO intentionally harmed the environment, and Y% said the CEO intentionally helped the environment."). They commit publicly by writing and handing in (or by raising hands for ranges? but we want a record). Alternatively, the instructor can ask each student to say their prediction and record on the board.

     45-50 min: The instructor reveals the actual class responses (for harm and help separately). For example: "In the harm condition, 5 out of 6 said yes (83%). In the help condition, 1 out of 6 said yes (17%)."

     50-80 min: Debrief (30 minutes).

   Debrief structure:

     - Start by noting the asymmetry and naming it (the Knobe effect or side-effect effect).
     - Explain the standard interpretation: people are more likely to judge a side effect as intentional when it is harmful (a norm violation) than when it is beneficial (a norm-conforming action).
     - Discuss the distinction between acting intentionally and acting with foresight: In both cases, the CEO foresaw the outcome and proceeded, but the intentionality attribution is asymmetric. This challenges the idea that intentionality is solely about foresight and desire.
     - The role of norm violations: when an action violates a norm, we are more likely to attribute intentionality for the side effect, even if the agent did not have a positive desire for that outcome (only indifference).
     - Broader implications: What can folk intuitions tell us about concepts? This effect shows that intuitions about intentional action are sensitive to moral considerations. This challenges the traditional philosophical method of relying on intuitions to analyze concepts because it reveals that intuitions are not purely about the conceptual structure but are influenced by moral judgments.

     - Connect to experimental philosophy: This effect has been replicated in many cultures and with many variations, and it raises a methodological challenge. How can we use intuitions to understand concepts if they are influenced by non-conceptual factors (like moral judgments)? We must be cautious about reading concepts off intuitions without empirical investigation.

     - Finally, note that the effect is robust and has been found in many studies, but also that there are debates about the explanation (e.g., the biasing role of moral judgment, or alternative accounts that see the effect as revealing a deeper structure of intentional action).

   What will predictably go wrong:

    1. Group discussion might lead to contamination: In the mixed groups, when students share the vignettes, they might also share their judgments. We must instruct them: "When you describe the vignette to your group, do not say how you answered the question. We are only sharing the scenario at this point."

    2. Some students might not understand the task of articulating a principle. The instructor should give an example of a principle (without giving away the effect): e.g., "One principle might be: an action is intentional only if the agent desires the outcome. But does that fit both cases?"

    3. The prediction task: students might not have a clear idea. We can ask them to predict the percentage for each scenario. But note: they haven't seen the other scenario? Actually, in the mixed groups, they have heard about both. So they have the information.

    4. The sample size is small (6 per condition). We might not get the effect (e.g., 4/6 harm and 2/6 help is still an asymmetry but not as dramatic as 6/6 and 0/6). The instructor must be prepared to explain that with a small sample, the effect might not be as strong, but that the phenomenon is well-established in larger studies.

    5. Time management: The group discussion might run long. The instructor must keep time and cut off if needed.

    6. Debrief might run short or long. The instructor should have key points ready.

   What a classroom replication cannot reproduce and must be supplied by the instructor:

     The classroom has a very small sample size (n=6 per condition). It is possible that by chance the responses do not show the asymmetry (e.g., if 3 students in the harm condition say no and 3 in the help condition say yes). The instructor must be prepared to:

       a) Still use the data to discuss (even if it doesn't show the effect, it's a teaching moment about sample size and variability).
       b) But more importantly, the instructor must be ready to supply the standard result from the literature: "In the original study by Knobe, and in many replications, about 80% of people say the harm was intentional, but only about 20% say the help was intentional. So if our class didn't show that, it might be due to the small sample. But the phenomenon is robust in larger studies."

     The key feature that the classroom cannot reproduce is the statistical reliability of the effect due to the small sample. Therefore, the instructor must have the literature at hand to show the typical results.

   Revised vignettes to make them more parallel and clear:

     Harm condition:
       "The CEO of a large company is presented with a new strategy that will increase profits. The Vice President reports: 'Adopting this strategy will boost profits, but it will also harm the environment.' The CEO replies: 'I don't care about harming the environment. I only care about maximizing profits. Go ahead with the strategy.' They adopt the strategy. As a result, the environment is harmed."

       Question: "Did the CEO intentionally harm the environment?" (Yes/No)

     Help condition:
       "The CEO of a large company is presented with a new strategy that will increase profits. The Vice President reports: 'Adopting this strategy will boost profits, and it will also help the environment.' The CEO replies: 'I don't care about helping the environment. I only care about maximizing profits. Go ahead with the strategy.' They adopt the strategy. As a result, the environment is helped."

       Question: "Did the CEO intentionally help the environment?" (Yes/No)

   Let's write the procedure step-by-step:

   Step 1: Introduction (5 min)
     - Instructor: "Today we're going to do an activity that involves making judgments about a scenario. I'll give half of you one scenario and the other half a different scenario. Read it carefully and answer the question at the end. Write your answer on the slip of paper without putting your name. We are collecting anonymous responses."

   Step 2: Distribute the vignettes (pre-printed) to the two groups. Group A (harm) and Group B (help). (2 min)

   Step 3: Students read and write their judgment (3 min). Collect the slips.

   Step 4: Form new groups: 3 groups of 4, each with 2 from A and 2 from B. (1 min)

   Step 5: Group task (15 min): 
     - Instructions: "In your group, each of you will describe the scenario you read. Do not reveal your judgment about the question. Then, as a group, try to figure out what the key difference is between the two scenarios. What principle might explain why someone might answer the question differently in the two cases? Write down the principle your group comes up with."

   Step 6: Group report (10 min): Each group reports their principle. The instructor writes them on the board.

   Step 7: Prediction (5 min): 
     - "Now, based on the two scenarios, I want each of you to predict how the class responded. In the scenario where the CEO harmed the environment, what percentage of the class do you think said the CEO did it intentionally? And in the scenario where the CEO helped the environment, what percentage said the CEO did it intentionally? Write your predictions on a slip of paper and hand them in."

     Alternatively, to save time, the instructor can ask for a show of hands for ranges (e.g., for harm: 0-20%, 20-40%, ... 80-100%) and record. But writing is more private.

   Step 8: Reveal the class results (5 min): 
     - The instructor tallies the harm responses and the help responses and writes the percentages on the board.

   Step 9: Debrief (30 min): as outlined above.

   Total: 5+2+3+1+15+10+5+5+30 = 76 minutes (a bit over, so we can shave 2 min from group report and 2 min from the introduction).

   Alternatively, if time is tight, we can reduce the group report to 5 min (each group just states their principle) and the prediction to 3 min.

   Let's adjust:

     Introduction: 5 min
     Distribution and reading: 3 min (so steps 2-3: 5 min total? because distribution is quick and reading takes 1-2 min, then writing the answer 1 min -> total 3 min for step 2-3)
     Step 4: 1 min
     Step 5: 12 min (instead of 15)
     Step 6: 5 min (each group 1.5 min)
     Step 7: 3 min
     Step 8: 2 min
     Step 9: 30 min

     Total: 5+3+1+12+5+3+2+30 = 61 minutes. That leaves room for transitions.

   Now, what if the class doesn't show the effect?

     The instructor should say: "In our class, we had [X]% say the harm was intentional and [Y]% say the help was intentional. This [does/does not] show the asymmetry that is typically found. Let me show you what the typical result is."

     Then show a slide or write on the board the typical numbers (from Knobe's original: 82% for harm, 23% for help).

     Then proceed: "This effect is called the Knobe effect or the side-effect effect. It has been replicated many times. So why might we not have seen it? One reason is that we have a small sample. With only 6 people in each group, we can get random variation. But the effect is robust in larger samples."

     Then continue with the debrief.

   Also, note: the effect is about the asymmetry. So even if the numbers are not extreme, if the harm condition has a higher percentage than the help condition, that's the effect.

   Therefore, the instructor should compare the two percentages.

   Finally, the debrief should cover:

     - The asymmetry found (or not) in the class data and the typical asymmetry in the literature.
     - The distinction between intentional action and foresight: in both cases the CEO foresaw the outcome and was indifferent, yet people are more willing to say the harm was intentional. This suggests that intentionality is not just about foresight and desire but also about the moral status of the outcome.
     - The role of norm violations: when the side effect is a norm violation (harming the environment is bad) we are more likely to say it was intentional.
     - Challenge to conceptual analysis: if our intuitions about intentional action are influenced by moral judgments, then we cannot rely solely on intuitions to define the concept of intentional action. We might need to revise our theories or our methods.

     - Broader: experimental philosophy uses empirical methods to study philosophical questions. This effect shows that intuitions are not uniform and can be influenced by factors that traditional philosophy might not have considered.

   References: Knobe, J. (2003). Intentional action and side effects in ordinary language. Analysis, 63(279), 190-194.

   This plan should achieve the goal: students see the asymmetry as a live feature of their own judgments (if present) and as a methodological challenge.
answer: |-
  ### Classroom Activity Design: Knobe Effect Exploration

  #### **Vignettes** (Custom-Written)
  **Case 1 (Norm Violation - Harm):**  
  *"A pharmaceutical company’s CEO is reviewing a new drug. The head of R&D reports: ‘This drug will dramatically increase company profits, but it will also severely pollute the river near our factory, violating environmental regulations.’ The CEO responds: ‘I don’t care about polluting the river—I only care about profits. Approve the drug.’ The drug is approved. As predicted, the river becomes heavily polluted."*  

  **Question:** *Did the CEO intentionally pollute the river?*  
  **( ) Yes**  
  **( ) No**  

  **Case 2 (Norm-Conforming Action - Help):**  
  *"A pharmaceutical company’s CEO is reviewing a new drug. The head of R&D reports: ‘This drug will dramatically increase company profits, and it will also purify the river near our factory, improving water quality beyond legal requirements.’ The CEO responds: ‘I don’t care about purifying the river—I only care about profits. Approve the drug.’ The drug is approved. As predicted, the river becomes significantly cleaner."*  

  **Question:** *Did the CEO intentionally purify the river?*  
  **( ) Yes**  
  **( ) No**  

  ---

  ### **Procedure & Timeline (80 Minutes Total)**  
  **Goal:** Ensure students experience the asymmetry *firsthand* before theorizing or debriefing.  

  #### **Phase 1: Judgment Collection (15 min)**  
  - **0–5 min:** Split students into **Group A** (6 students) and **Group B** (6 students) seated apart.  
  - **5–10 min:**  
    - Group A receives **Harm Vignette**; Group B receives **Help Vignette**.  
    - Students read their vignette and **privately** circle "Yes" or "No" on an anonymous slip.  
    - *Prevent contamination:* Use physical barriers (e.g., folders) between students; collect slips immediately.  
  - **10–15 min:**  
    - Students **write a brief rationale** for their judgment (2–3 sentences) on the back of the slip.  
    - Facilitator collects all slips in two envelopes (Harm/Help) without revealing responses.  

  #### **Phase 2: Group Principle Articulation (25 min)**  
  - **15–20 min:** Reorganize into **mixed groups of 4** (3 groups total, each with 2 from Group A and 2 from Group B).  
    - **Task:** Share vignette details *without revealing personal judgments*.  
    - **Prompt:** *"What underlying principle distinguishes these cases? Why might someone answer differently in each?"*  
    - *Critical rule:* Students **cannot discuss their own judgments**—only the scenarios and hypothetical reasoning.  
  - **20–35 min:** Groups draft a one-sentence principle (e.g., *"Intentionality requires violating a norm"*).  
  - **35–40 min:** Groups share principles on the board. **Do not discuss patterns yet.**  

  #### **Phase 3: Prediction & Revelation (15 min)**  
  - **40–45 min:** **Individual predictions:**  
    - Each student writes privately:  
      *"I predict ____% of the class said ‘Yes’ in the HARM case."*  
      *"I predict ____% of the class said ‘Yes’ in the HELP case."*  
    - Students publicly **commit** by reading predictions aloud (record on board).  
  - **45–50 min:** **Reveal class data:**  
    - Tally and project anonymous responses:  
      - Harm Case: #Yes/#Total (e.g., "5/6 said Yes").  
      - Help Case: #Yes/#Total (e.g., "1/6 said Yes").  
  - **50–55 min:** **Silent reflection:** Students note surprises/discrepancies in predictions vs. results.  

  #### **Phase 4: Structured Debrief (25 min)**  
  **Goal:** Map responses to philosophical concepts without "lecturing."  

  1. **Name the Phenomenon (5 min):**  
     - *"This asymmetry is called the **Knobe Effect** (or side-effect effect). It reveals a tension in how we assign intentionality."*  
     - Show aggregate data from seminal studies (e.g., Knobe 2003: 82% Harm-Yes vs. 23% Help-Yes) to contextualize class results.  

  2. **Conceptual Breakdown (10 min):**  
     - **Intentionality vs. Foresight:**  
       - *"In both cases, the CEO foresaw the outcome but claimed indifference. Why is harm ‘intentional’ but help ‘unintentional’? Does ‘intentional’ require desire, or just awareness?"*  
     - **Role of Norm Violations:**  
       - *"Polluting violates environmental norms; purifying exceeds them. How does norm violation ‘pull the trigger’ on intentionality judgments?"*  
     - Use student principles from Phase 2 to seed discussion (e.g., *"Group 2’s principle mentioned norms—how does that fit?"*).  

  3. **Methodological Implications (10 min):**  
     - *"Your intuitions today mirror those of thousands in experiments. What does this mean for philosophy?"*  
     - **Key Qs:**  
       - Can we define "intentional action" purely by intuitions?  
       - If moral judgments "leak" into non-moral concepts, how reliable are folk intuitions?  
       - Does this support experimental philosophy (X-Phi) or challenge traditional analysis?  
     - **Conclusion:** *"The Knobe Effect shows intuitions are *reactive*—shaped by context, not just abstract concepts. This forces us to ask: Are we discovering concepts or constructing them?"*  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Judgment Contamination:**  
     - *Risk:* Students peek at neighbors’ responses during Phase 1.  
     - *Fix:* Use folders as barriers; emphasize anonymity; collect responses swiftly.  

  2. **Group Discussion Dominance:**  
     - *Risk:* Extroverts steer principle articulation; introverts disengage.  
     - *Fix:* Assign roles (e.g., "Recorder," "Spokesperson"); use timed think-pair-share.  

  3. **Atypical Class Data:**  
     - *Risk:* Small sample (n=6 per group) may not show asymmetry (e.g., 4/6 Harm-Yes, 3/6 Help-Yes).  
     - *Fix:* **Preemptively** contextualize: *"With n=12, we may not see the textbook split—let’s compare to the literature!"* Show published data to affirm the effect.  

  4. **Premature Theorizing:**  
     - *Risk:* Students name "Knobe Effect" before debrief.  
     - *Fix:* Begin with *"We’re exploring intuition patterns—no jargon yet!"* Redirect: *"Save labels for later!"*  

  ---

  ### **What Classroom Replication *Cannot* Reproduce**  
  - **Statistical Reliability:** A class of 12 lacks power to replicate the effect robustly (e.g., 80% vs. 20% splits). Students might see weak/atypical asymmetry.  
  - **Instructor’s Role:** **Explicitly bridge class data to published results** during debrief. Say:  
    > *"Our small sample might obscure the pattern, but aggregated studies show a strong, cross-cultural asymmetry. This isn’t random—it’s a reproducible feature of human judgment."*  

  ---

  ### **Outcomes**  
  - Students **experience** the Knobe Effect as a personal intuition clash (not a "textbook fact").  
  - They confront the **methodological tension**: If their own judgments are asymmetrical and context-dependent, how can philosophers treat intuitions as pure conceptual evidence?  
  - Final takeaway: *"Concepts like ‘intentionality’ may be shaped by moral cognition—and X-Phi helps us unpack this."*  

  **Materials Needed:** Printed vignettes, response slips, envelopes, timers, whiteboard.  
  **Key Citation:** Knobe, J. (2003). *Intentional Action and Side Effects in Ordinary Language*. Analysis, 63(279), 190–194.
