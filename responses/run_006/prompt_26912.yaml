prompt: |-
  You are a professional philosopher specializing in weakness of will, akrasia, and the philosophy of action, with a working knowledge of the psychology of hyperbolic discounting, preference reversal, and self-control. You have been asked to help a novelist translate your field's insights into a reusable character-construction procedure. Think carefully before you write. Begin by brainstorming the key distinctions and mechanisms your field recognizes — judgment shifts, executive failure, preference reversals under temporal proximity, the difference between akrasia and compulsion, the question of whether clear-eyed akrasia is possible at all — and then decide which of these survive translation into a tool for someone who is not a philosopher and who needs to make a decision in under an hour. Be honest about which distinctions you are dropping and why.

  I am a novelist. I write literary fiction in which characters make consequential decisions against their own better judgment: the politician who torpedoes a career they spent decades building, the parent who breaks a promise they genuinely meant to keep, the addict who walks back into the room they swore they would never enter again. I am tired of writing these moments by feel and suspecting afterward that they worked only because the plot required them. I want a procedure I can run during outlining, before I write a word of prose, that tells me whether a character's failure of will is psychologically credible given how I have constructed them — their desires, their beliefs, their history, their situation — and, if it is not, what I would need to change.

  The procedure should be something I can use in under an hour per major character. I have no formal training in philosophy, though I am willing to learn a small number of technical distinctions if they earn their keep. I need the procedure to be honest about where it is making a judgment call rather than applying a rule, and I need it to flag the cases it cannot settle — where the philosophy itself is divided, or where the answer depends on a fact about human psychology that is not yet known. I also need it to tell me when the most honest answer is "this character, as you have built them, would not plausibly fail here — if the plot requires it, you must change either the character or the situation."

  Please deliver:

  1. A step-by-step procedure — a checklist, a flowchart in words, a set of questions to ask in order — that I can run on any character facing a moment of possible akratic failure. Each step should say what counts as a sufficient answer and where the procedure stops with a "no, this won't work."

  2. A brief explanation, in plain language, of the key idea or ideas from the philosophy of weakness of will that the procedure operationalizes. I do not need a literature review; I need to know what the procedure is doing so I can trust it and adapt it when it misfires.

  3. Three worked applications:
     - A politician who has spent twenty years building toward a Supreme Court nomination and, at the confirmation hearing, makes a gratuitously hostile remark that sinks it — a remark they knew, even as they formed it, would destroy them.
     - A parent who genuinely believes they should keep a promise to attend their child's performance and, at the last moment, chooses to stay at work instead.
     - An alcoholic who has been sober for three years and, on an ordinary Tuesday with no obvious trigger, walks into a bar and orders a drink.

  4. For at least one of these, the procedure should tell me something I will not want to hear — that the failure is not credible as written, or that I have built the character wrong for the moment I need them to have.

  5. A section on what the procedure cannot do: the cases it cannot adjudicate, the philosophical disagreements it papers over, and the ways a clever novelist can fool it.

  Ground the procedure in the actual philosophical and psychological work on akrasia — the distinction between weakness of will and compulsion, the structure of hyperbolic discounting and preference reversal, the role of judgment shifts versus executive failure, the question of whether akrasia is even possible — but do not lecture. Every distinction you include must earn its place by doing work in the procedure. If a distinction cannot be translated into a question a novelist can ask about their character, leave it out and note that you have done so.
reasoning: |-
  Okay, I need to help this novelist create a procedure for building credible characters who experience weakness of will. They want something practical that can be used in under an hour per character, grounded in philosophy and psychology but without unnecessary complexity. 

  First, I should identify the core concepts from akrasia research that actually help writers. The key ones seem to be: the difference between true akrasia (acting against one's better judgment) versus compulsion (where the person's judgment itself changes), hyperbolic discounting (valuing immediate rewards more highly), and preference reversal (when our choices flip as an option gets closer in time). The big philosophical debate about whether "clear-eyed akrasia" exists - acting against your judgment while fully aware it's wrong - matters here because characters doing this feel more tragic.

  The novelist specifically wants to avoid moments that feel plot-forced. So the procedure must flag when a character wouldn't plausibly fail. I'll need to build in hard stops for that. They also want honesty about where philosophy is divided - like whether executive failure (the brain's control system crashing) fully explains weakness of will.

  For the procedure itself, I imagine a flowchart-style checklist. Step 1 would confirm it's actually akrasia (not compulsion or ignorance). Step 2 would check for temporal proximity - is the tempting option immediate while consequences are delayed? That's where hyperbolic discounting kicks in. Step 3 would look for judgment shifts - maybe the character rationalizes in the moment. If none, that's where we confront the clear-eyed akrasia debate. Step 4 examines cognitive load - stress or fatigue that could overwhelm self-control. 

  The worked examples will test this. The politician making a career-destroying remark: if they knew it was destructive as they spoke it, that's clear-eyed akrasia. But is it credible? The procedure might flag that without strong pressure or depletion, it feels forced. The alcoholic walking into a bar unprompted - that likely needs some hidden trigger to feel real. 

  For the parent missing a child's event, the key is the last-moment switch. Hyperbolic discounting makes sense here - immediate work pressure versus delayed relationship damage. But if the parent has high willpower normally, the procedure should question why they'd fail now. 

  I'll need to be brutally honest in at least one case. Probably the alcoholic example - with no trigger and three years sobriety, random failure seems unlikely. The novelist would need to add stress or environmental cues.

  Finally, I'll clarify limitations: the procedure can't resolve philosophical debates, can't predict all human behavior, and might be fooled by complex character nuances. But it should make the novelist's "by feel" decisions more rigorous.
answer: |-
  Here is a character-construction procedure for akratic failure, grounded in philosophy and psychology, designed for practical use:

  **Key Ideas Simplified:**
  1.  **Akrasia vs. Compulsion:** True weakness of will (*akrasia*) means acting against your *current, conscious judgment* of what's best. If the character truly changes their mind in the moment (judgment shift) or feels utterly hijacked by a force they never resisted (compulsion), it's not akrasia.
  2.  **Hyperbolic Discounting:** Humans instinctively value immediate rewards/costs much more intensely than future ones, even if the future stakes are vastly larger. This "time distortion" is the primary engine of akrasia.
  3.  **Preference Reversal:** Due to hyperbolic discounting, a character can genuinely prefer Option A (sobriety, career) *in general* but suddenly prefer Option B (drink, outburst) *when it's immediately available*.
  4.  **Executive Failure:** Sometimes the problem isn't desire, but the mind's "control system" (willpower, focus) getting overloaded (by stress, fatigue, emotion) and failing to act on the better judgment.
  5.  **The Clear-Eyed Question:** Can someone *knowingly and intentionally* choose the worse option *while* clearly seeing it as worse? Philosophers debate this, but psychological evidence suggests it's rare. *Most akrasia involves subtle judgment shifts or failures of control in the heat of the moment.* **Procedure Tip:** Default to assuming some degree of subtle shift or overload unless you have a strong narrative reason for pure clear-eyed failure.

  **The Akrasia Credibility Check Procedure (Flowchart in Words):**

  **Goal:** Determine if a character's planned failure of will is psychologically credible *as akrasia*, or if changes are needed.

  1.  **Is it Akrasia? (Not Compulsion/Ignorance)**
      *   *Question:* Did the character, *in the moment of action*, still consciously believe Action X was worse overall than the alternative (inaction or Action Y)?
      *   *Sufficient Answer:* Yes (Proceed to Step 2).
      *   *Stop/Red Flag:* No.
          *   If they genuinely *changed their mind* and believed Y was best *in that moment* (judgment shift), it's not akrasia. Explore *why* the shift occurred.
          *   If they were overwhelmed by a force they felt powerless to resist *without ever forming a conscious judgment against it in the moment* (e.g., a PTSD flashback triggering flight), it's closer to compulsion. Different mechanics.
          *   If they were ignorant of consequences *at the time of action*, it's not akrasia.

  2.  **Is the Temptation Immediate? (Hyperbolic Discounting Trigger)**
      *   *Question:* Is the perceived benefit of the akratic action (relief, pleasure, avoidance of discomfort) *immediately available* upon acting, while the major negative consequences are *significantly delayed* (even by minutes or hours)?
      *   *Sufficient Answer:* Yes (Proceed to Step 3).
      *   *Stop/Red Flag:* No.
          *   If both costs and benefits are immediate or both are distant, hyperbolic discounting isn't the likely driver. Credibility plummets for standard akrasia. Re-evaluate motivation (sudden impulse? hidden belief?).
          *   *Exception:* If the *avoidance of an immediate negative* (embarrassment, anxiety, effort) is the driver, and *that avoidance* has delayed costs, this counts as "immediate benefit" (relief).

  3.  **Is there a Subtle Judgment Shift? (Mitigating "Clear-Eyed" Akrasia)**
      *   *Question:* In the crucial moment, did the character's assessment of the options subtly change? Did the temptation seem *more valuable* ("One drink won't hurt," "I deserve this") or the cost seem *less certain/significant* ("Maybe it won't destroy everything," "I can fix this later") *compared to their usual judgment*?
      *   *Sufficient Answer:* Yes (Credibility High. Proceed to Step 4 for nuance).
      *   *Judgment Call/Proceed:* No (or Minimal). *This is the "Clear-Eyed Akrasia" zone. Proceed with caution.* Credibility hinges heavily on Step 4. Pure clear-eyed akrasia is philosophically contentious and psychologically rare.

  4.  **Is Executive Function Compromised? (The Overload Factor)**
      *   *Question:* Was the character experiencing significant stress, fatigue, strong emotion (anger, despair, euphoria), distraction, or cognitive load *in the immediate lead-up to the failure*? Had they recently exerted significant self-control?
      *   *Sufficient Answer:* Yes (Significantly increases credibility, *especially* if Step 3 was "No". Explains *how* clear-eyed failure *might* occur via control system crash).
      *   *Judgment Call/Red Flag:* No.
          *   If Step 3 was "Yes", credibility might still be OK.
          *   If Step 3 was "No" (Pure clear-eyed attempt) *and* no significant overload... **Credibility is VERY LOW.** This is the "Character/Situation Needs Change" signal. The character, as built, likely *wouldn't* fail here. You need either:
              *   A stronger judgment shift (Step 3 = Yes).
              *   Significant executive overload (Step 4 = Yes).
              *   A different motivation (not akrasia).
              *   A change to the situation (introduce an immediate pressure or overload).
          *   *Philosophical Flag:* Pure clear-eyed akrasia without overload is a major unresolved debate. The procedure flags this as high-risk for feeling artificial.

  **Worked Applications:**

  1.  **The Politician (Gratuitous Hostile Remark):**
      *   **Step 1:** Yes. They knew *as they formed it* it would destroy them. Akrasia target.
      *   **Step 2:** Yes. Benefit: Immediate catharsis, expression of anger/contempt (powerful feeling). Cost: Delayed (career implosion happens after hearing).
      *   **Step 3:** **Crucial Here.** *As written?* Probably No/Minimal. They knew it *would* destroy them as they formed it. Pure clear-eyed attempt.
      *   **Step 4:** *As written?* Unclear. A confirmation hearing is high-stress, but is it *overwhelming*? Were they fatigued? Had they just endured hours of hostile questioning (depleting self-control)? *If no specific overload is established...*
      *   **Verdict:** **PROBLEM (What you won't want to hear).** As described (ordinary stress, no depletion, no judgment shift), this pure clear-eyed failure is *low credibility*. The procedure says: *Change the character or situation.*
          *   *Fix Options:*
              *   **Judgment Shift:** Show a subtle rationalization *as the anger rises* ("This sanctimonious fool deserves it," "My base will love it," "It might even look strong").
              *   **Executive Overload:** Intensify the situation – they just got ambushed with a deeply personal, unfair attack; they're severely sleep-deprived; they're on medication affecting impulse control.
              *   **Situation Change:** Make the remark *less* gratuitous – it's a calculated risk that backfires spectacularly (then it's poor judgment, not akrasia).

  2.  **The Parent (Missing Child's Performance for Work):**
      *   **Step 1:** Yes. They genuinely believe they should go.
      *   **Step 2:** Yes. Benefit: Immediate relief from work pressure/anxiety, immediate completion of a pressing task (avoiding negative). Cost: Delayed (child's disappointment, relationship damage).
      *   **Step 3:** Likely Yes. Subtle shift: "This *one* time won't matter," "Work is critical *right now*," "I'll make it up to them tenfold," "They won't even notice I'm late/missing."
      *   **Step 4:** Very Likely Yes. Last-moment work crisis implies high stress, urgency, cognitive load. Possibly fatigue.
      *   **Verdict:** **CREDIBLE.** Hyperbolic discounting (immediate work pressure relief vs. delayed emotional cost) + plausible judgment shift ("one time") + high executive load (crisis) makes this a classic, credible akrasia scenario.

  3.  **The Alcoholic (Sober 3 Years, Walks into Bar "Randomly"):**
      *   **Step 1:** Yes. They believe sobriety is best.
      *   **Step 2:** Yes. Benefit: Immediate relief/craving satisfaction/escape (?). Cost: Delayed (relapse consequences).
      *   **Step 3:** **Crucial Here.** *As written?* ("ordinary Tuesday, no obvious trigger") Likely No/Minimal shift. Why *now*? What made the drink seem viable/necessary *today*?
      *   **Step 4:** *As written?* Unclear. An "ordinary Tuesday" suggests no significant overload. Three years sober suggests strong coping mechanisms.
      *   **Verdict:** **LOW CREDIBILITY (as written).** The lack of a discernible trigger (which would enable a judgment shift or increase vulnerability) and lack of significant overload make this random failure on an ordinary day hard to believe after 3 years of sobriety. *Change needed:*
          *   **Add a Trigger:** A subtle cue (smell, song, argument earlier that day, passing the old bar), a build-up of low-level stress, a moment of unexpected despair/boredom/euphoria ("I feel great, I can handle one").
          *   **Add Overload:** They are exhausted, physically ill, or just endured an emotionally draining event (even if minor).
          *   **Show Judgment Shift:** A creeping thought pattern beforehand ("What's the point?", "I've earned it," "I'm different now").

  **What the Procedure CANNOT Do:**

  1.  **Resolve Philosophical Disputes:** It flags debates (like pure clear-eyed akrasia) but doesn't solve them. You must make a narrative choice.
  2.  **Predict All Human Behavior:** Human psychology is messy. The procedure identifies *plausible* pathways, not certainties. Anomalies happen, but they need *more* justification in fiction.
  3.  **Handle Extreme Pathology:** Severe addiction, mania, psychosis, profound trauma often operate outside standard akrasia models (veering into compulsion/breakdown). The procedure assumes relatively intact cognition.
  4.  **Account for All Nuance:** Deep backstory, unconscious motives, or incredibly complex personalities might have factors the simple checklist misses. It provides a strong foundation, not an exhaustive analysis.
  5.  **Define "Significant" Overload/Shift:** This is inherently subjective. The procedure flags where this judgment is critical. You must decide based on character and context.
  6.  **Guarantee Reader Belief:** Plausibility isn't the same as narrative power. A perfectly plausible moment can feel flat; a slightly stretched one can feel profound with great execution. This checks mechanics, not artistry.
  7.  **Be Fooled By:** A clever novelist can:
      *   **Hide the Judgment Shift:** Craft internal monologue that *masks* a subtle rationalization as clear-eyed awareness.
      *   **Invent Novel Triggers:** Create a unique, character-specific trigger for a shift or craving that fits their history but wasn't obvious.
      *   **Amplify Micro-Stressors:** Build a case that tiny, accumulated stresses (a "death by a thousand cuts") constitute significant executive overload for *this* character.
      *   **Leverage the Debate:** Write a powerful, tragic scene *deliberately* depicting pure clear-eyed akrasia, accepting it's philosophically contested but artistically compelling. The procedure flags it as high-risk, not impossible.

  **Use this procedure during outlining to pressure-test your akrasia moments. It forces you to identify the *mechanism* of failure (discounting? shift? overload?) and ensures it's grounded in basic human psychology, preventing purely plot-driven implausibility.**
