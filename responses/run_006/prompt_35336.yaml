  **Highest-impact evidence for #3**: A **formal impossibility proof** showing that *any* conditional semantics for dispositions must implicitly quantify over dispositional primitives. This would decisively undermine the reductive project.

  **Why degeneracy?** The pattern resembles Lakatosian degeneration: each "fix" (e.g., Martin's ceteris paribus, Choi's masks-as-finks) spawns new counterexamples (e.g., mimicking cases, time-indexed stimuli) while increasing theoretical complexity without corresponding predictive gain. The 30-year stalemate suggests non-convergence.

