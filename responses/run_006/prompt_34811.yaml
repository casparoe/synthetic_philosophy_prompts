prompt: |-
  I've been reading about Dennett's claim that Darwin and Turing each performed a "strange inversion of reasoning" — Darwin by showing that biological design requires no intelligent designer, and Turing by showing that intelligent-seeming computation requires no understanding in the machinery. The common thread, as I understand it, is that both demonstrated how competence can arise without comprehension. But doesn't this framework ultimately eliminate comprehension altogether? If the evolutionary processes that built our brains operated without any understanding, and our brains themselves are just Turing-style syntactic engines running on meaningless symbols, then our subjective sense of grasping ideas, seeing why something must be so, or genuinely understanding a proof would seem to be an illusion — a useful fiction that competence-without-comprehension happens to generate. Is Dennett's position genuinely eliminativist about understanding, or is there a way to keep comprehension real within this picture that I'm missing?

  After your answer, please provide a structured summary as a JSON object with the following fields:

  - "darwin_inversion": a one-sentence statement of Darwin's strange inversion as Dennett characterizes it
