prompt: |-
  In a planning meeting last week, our product manager killed a feature the team had spent two quarters building by saying that continuing would just be throwing good money after bad. I've heard the same one-liner end arguments about staying in a degree program, a lease, a failing experiment — and I'm never sure what precise claim is doing the work. I know the basic dollar-auction setup (the highest bidder wins the dollar but the second-highest bidder pays too), and I know there's a psychology literature on escalation of commitment, but that's roughly where my grip gives out. I'd like you to take the slogan "throwing good money after bad" and lay out the distinct precise claims it could be making: about whether and how past expenditures may rationally influence future choices, about what goes wrong in escalation, and about when a commitment should be abandoned. Order the readings from the trivial or merely descriptive to the strong and contestable, and for each say whether people who study the dollar auction and escalation of commitment would treat it as settled or as a live dispute. Then tell me which reading or readings actually license the product manager's move of killing a half-finished feature on that basis, and which readings wouldn't get her there even if true. I want a menu of readings with verdicts, not a single interpretation defended as the right one. Where the field is genuinely divided — for instance over whether sunk costs are always irrelevant, or whether escalation is driven mainly by self-justification, loss aversion, or something else — flag the disagreement as disagreement rather than presenting one camp's view as settled. End with a last line beginning "Summary:" that states the bottom line in a single sentence.
reasoning: |-
  We are going to break down the slogan "throwing good money after bad" into distinct precise claims. We will order these from trivial/descriptive to strong/contestable. For each, we note whether the literature (dollar auction and escalation of commitment) treats it as settled or disputed. Then we evaluate which readings license the product manager's decision and which do not.

  ### 1. **Trivial/Descriptive Claim: Sunk Costs Are Irrecoverable**
     - **Claim**: Money already spent (the "bad" money) cannot be recovered. Therefore, it should not factor into future decisions.
     - **Status in Literature**: This is settled. Both the dollar auction model and escalation of commitment literature agree that sunk costs are by definition irrecoverable and should not influence rational decision-making.
     - **Licenses PM's Move?**: Yes, because it emphasizes that past expenditures are irrelevant. The PM is focusing only on future costs and benefits.

  ### 2. **Moderate Claim: Continuing Investment Often Leads to Escalation Due to Psychological Biases**
     - **Claim**: People tend to escalate commitment to failing courses of action due to various psychological factors (e.g., self-justification, loss aversion, desire not to appear wasteful). This can turn a small loss into a large one.
     - **Status in Literature**: Well-documented in escalation of commitment literature (e.g., Staw's work) and the dollar auction. However, the exact drivers (self-justification vs. loss aversion vs. others) are debated. There is agreement on the phenomenon but disagreement on the primary psychological mechanism.
     - **Licenses PM's Move?**: Yes. The PM is arguing that continuing would be an escalation of commitment, which is a known trap. The literature supports that such escalation is common and harmful.

  ### 3. **Moderate Claim: The Dollar Auction as a Model of Escalation**
     - **Claim**: The dollar auction is a formal model showing how rational actors can get trapped in escalating bids because each incremental bid seems justified by the desire to avoid losing the sunk cost. The trap arises because the total cost can exceed the value of the prize.
     - **Status in Literature**: Settled as a model of escalation. However, the model assumes rational actors in a specific structure. Real-world decisions may involve more complex factors.
     - **Licenses PM's Move?**: Yes. The feature development can be seen as a dollar auction: the team has already invested two quarters (sunk costs) and now faces the choice to invest more (good money) for a feature that might not be worth the total cost. The model warns that continuing can lead to a net loss.

  ### 4. **Strong Claim: Sunk Costs Are Always Irrelevant in Rational Decision-Making**
     - **Claim**: Only future costs and benefits matter. Any consideration of past expenditures is irrational.
     - **Status in Literature**: This is a foundational principle in economics (e.g., sunk cost fallacy). However, in practice, there are debates about boundary conditions. Some argue that in strategic contexts (e.g., signaling commitment) or when there are learning effects, sunk costs might indirectly matter. Also, behavioral economics shows that people do consider sunk costs, so the claim is normative rather than descriptive.
     - **Licenses PM's Move?**: Yes, directly. The PM is applying the rational economic principle: ignore sunk costs and only consider future costs and benefits.

  ### 5. **Contestable Claim: Abandonment Should Occur When Marginal Cost Exceeds Marginal Benefit**
     - **Claim**: We should abandon a project when the cost of the next increment (good money) exceeds the benefit of that increment. Note that this does not require the total cost to exceed the total benefit (which might be harder to achieve if there's a large sunk cost).
     - **Status in Literature**: This is a standard marginal analysis in economics and is settled. However, in the context of escalation, people often fail to do this because they focus on total costs (including sunk) versus total benefits.
     - **Licenses PM's Move?**: Yes. The PM is implying that the next increment (the "good money") is being thrown after the "bad" because the marginal benefit of completing the feature does not justify the marginal cost.

  ### 6. **Contestable Claim: Abandonment Should Occur When Total Expected Costs Exceed Total Expected Benefits**
     - **Claim**: We should abandon a project if the total expected costs (including sunk costs) exceed the total expected benefits. This is a stronger condition because sunk costs are included in the total costs. However, in rational decision-making, sunk costs are irrelevant and should not be included. This claim is actually inconsistent with the sunk cost principle because it factors in sunk costs. But note: sometimes people use "throwing good money after bad" to mean that the entire project is now a net loss and hence should be stopped. This reasoning is fallacious because sunk costs are irrecoverable and should not affect the decision.
     - **Status in Literature**: This is considered a fallacy in the literature (the sunk cost fallacy). The rational approach is to ignore sunk costs and only consider future costs and benefits. Therefore, this claim is contested and typically rejected by economists and decision theorists.
     - **Licenses PM's Move?**: No, not if it is based on including sunk costs. However, the PM might be making the rational marginal analysis (claim 5) but phrasing it in a way that sounds like total costs. We must be cautious. If the PM is saying that because we've already spent two quarters (sunk) and now the total cost would be too high if we continue, then that is fallacious. But if she is saying that the future cost (good money) is not justified by the future benefit, then it's not fallacious.

  ### 7. **Contestable Claim: Escalation is Driven Primarily by [Specific Mechanism]**
     - **Claim**: The main driver of escalation is a specific psychological factor, such as:
          - **Self-justification** (people want to justify their past decisions)
          - **Loss aversion** (people are more motivated to avoid losses than to achieve gains, so they keep investing to avoid realizing a loss)
          - **Social factors** (e.g., fear of looking bad in front of others)
     - **Status in Literature**: Disputed. While all these factors are known to contribute, there is no consensus on which is dominant. Some studies emphasize self-justification, others loss aversion, and others social or organizational pressures.
     - **Licenses PM's Move?**: This claim by itself doesn't license the move because it's about the cause of escalation. However, if the PM is using the slogan to invoke the general danger of escalation (as in claim 2), then it does. The specific mechanism doesn't matter for the decision to stop; the danger does.

  ### Which Readings License the PM's Move?
  - **Licenses the move**: Claims 1, 2, 3, 4, and 5. These all support the idea that past expenditures should not influence the decision and that continuing when the future costs exceed future benefits is irrational and a form of escalation.
  - **Does not license the move (or does so fallaciously)**: Claim 6 if interpreted as including sunk costs in the total cost calculation. However, note that if the PM is only considering future costs and benefits (as in claim 5) then it is valid. The slogan is often used in the valid way (claim 5) but sometimes misinterpreted as claim 6.

  ### Clarification on Claim 6:
  The PM might have said "throwing good money after bad" to mean:
     - Valid interpretation: We are about to spend more money (good money) on a project that has already consumed resources (bad money) and this additional spending is not worth it on its own (marginal cost > marginal benefit). This is claim 5.
     - Fallacious interpretation: We have already spent so much (bad money) that if we add more (good money) the total cost will be too high, even if the marginal benefit of the next increment exceeds the marginal cost. This would be claim 6 and is fallacious.

  Given the context, the PM likely meant the valid interpretation (claim 5). She is arguing that the future spending (good money) is not justified by the future benefit, hence it would be wasted (thrown after the bad money that is already gone).

  ### Summary of Verdicts on PM's Move:
  - If the PM's reasoning is based on the irrelevance of sunk costs and a marginal analysis (future cost > future benefit), then it is licensed by claims 1, 4, and 5 (and supported by 2 and 3 as context for why people fail to do this).
  - If the PM's reasoning is based on the total cost (including sunk) exceeding total benefit, then it would not be licensed by rational principles (claim 6 is fallacious) and the literature would reject it.

  ### Summary of Field Disagreements:
  - **Settled**: Sunk costs are irrecoverable and should not factor into future decisions (claim 1). The dollar auction and escalation of commitment are well-established phenomena (claims 2 and 3). Marginal analysis (claim 5) is the rational standard.
  - **Disputed**: The primary psychological driver of escalation (claim 7). Also, there are boundary conditions for the sunk cost principle (e.g., in game theory or when there are reputational concerns) but these are exceptions.

  ### Final Tally for the PM:
  The product manager's move is licensed by the core rational principle (ignore sunk costs, do marginal analysis) and by the recognition of escalation traps. It is not licensed if she is including sunk costs in her calculation of total costs and benefits.

  Summary: The product manager's decision to kill the feature is justified if based on the marginal future cost exceeding marginal future benefit (ignoring sunk costs) and to avoid an escalation trap, but not if based on the fallacious inclusion of sunk costs in the total cost-benefit analysis.
answer: |-
  ### Ordered Readings of "Throwing Good Money After Bad"  
  From trivial/descriptive to strong/contestable, with field consensus and relevance to the PM's decision.  

  1. **Descriptive: Sunk Costs Are Irrecoverable**  
     - **Claim**: Past expenditures ("bad money") are gone and cannot be recovered; only future costs and benefits matter.  
     - **Status**: Settled in economics and decision theory. Dollar auction/escalation literature universally agrees.  
     - **Licenses PM's Move?**: **Yes**. This trivial claim implies past costs are irrelevant, so the decision should hinge solely on future ROI.  

  2. **Moderate: Escalation Often Occurs Due to Psychological Biases**  
     - **Claim**: People irrationally escalate commitment due to biases (e.g., self-justification, loss aversion), turning small losses into large ones.  
     - **Status**: Settled as a common phenomenon, but **disputed** on primary drivers (self-justification vs. loss aversion vs. social pressure).  
     - **Licenses PM's Move?**: **Yes**. The PM invokes this to argue that continuing would compound error due to predictable irrationality.  

  3. **Moderate: Dollar Auction Dynamics as a Trap**  
     - **Claim**: Rational actors escalate bids (e.g., in dollar auctions) because quitting feels like accepting a loss, creating a trap where total costs exceed the prize value.  
     - **Status**: Settled as a model of escalation. The dollar auction is a canonical example of how rational choices can lead to irrational outcomes.  
     - **Licenses PM's Move?**: **Yes**. The half-built feature is the "dollar," and continuing risks sinking more costs than the feature is worth.  

  4. **Strong: Sunk Costs Should *Never* Influence Decisions**  
     - **Claim**: Rational agents must ignore sunk costs entirely; any consideration is a fallacy.  
     - **Status**: **Disputed**. Economics treats this as normative truth, but psychology/behavioral studies show humans *do* weigh sunk costs. Some argue they can signal commitment or inform learning.  
     - **Licenses PM's Move?**: **Yes**. This directly supports killing the feature if future costs outweigh benefits, regardless of past investment.  

  5. **Strong: Abandon When Marginal Costs Exceed Marginal Benefits**  
     - **Claim**: A project should be abandoned if the cost of the *next increment* (e.g., finishing the feature) exceeds its incremental benefit. Ignores sunk costs.  
     - **Status**: Settled in cost-benefit analysis. Escalation literature treats this as the rational standard.  
     - **Licenses PM's Move?**: **Yes**. The PM claims the next dollar (time/money) spent would yield less value than it costs.  

  6. **Contestable: Abandon When Total Costs Exceed Total Benefits**  
     - **Claim**: A project should be abandoned if *total* costs (including sunk costs) exceed total expected benefits.  
     - **Status**: **Disputed and often rejected**. Economists call this the "sunk cost fallacy" because sunk costs should be excluded. Critics argue it misdiagnoses the problem.  
     - **Licenses PM's Move?**: **No**. This would require including past costs in the calculation, which the slogan explicitly rejects as irrational.  

  7. **Contestable: Escalation is *Mainly* Driven by [Specific Bias]**  
     - **Claim**: Escalation is primarily caused by one factor, e.g.:  
       - **Self-justification**: Needing to justify past decisions (Staw 1976).  
       - **Loss aversion**: Valuing losses more than gains (Kahneman & Tversky).  
       - **Project completion effect**: Overvaluing finishing a project.  
     - **Status**: **Highly disputed**. No consensus on the dominant driver; context-dependent.  
     - **Licenses PM's Move?**: **No**. While escalation is real, this claim doesn’t directly justify abandonment—only that biases exist.  

  ### Which Readings License the PM's Decision?  
  - **Licenses the move**: Readings 1–5. They all support ignoring sunk costs and focusing on future marginal utility. The PM’s rationale fits here: continuing ("good money") is irrational if future costs outweigh benefits, regardless of past work.  
  - **Does not license the move**: Readings 6–7. Reading 6 commits the sunk cost fallacy, while Reading 7 describes mechanisms but doesn’t prescribe action.  

  ### Field Divisions Flagged  
  - **Sunk cost irrelevance**: Economists treat as settled; psychologists note humans violate it.  
  - **Drivers of escalation**: Self-justification vs. loss aversion vs. social factors—active debate.  

  Summary: The product manager's decision is justified by the core economic principle that sunk costs are irrelevant and by escalation dynamics, but not by including sunk costs in total cost-benefit analysis or by disputing psychological mechanisms.
