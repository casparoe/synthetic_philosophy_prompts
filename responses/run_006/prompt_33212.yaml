prompt: |-
  I keep noticing a pattern in moral reasoning that I can't quite put my finger on, and I'm wondering whether it has an established name in philosophy.

  Suppose someone is in a situation where a person they love is in danger, and they can save either that person or a stranger, but not both. They save the person they love. When asked later why they did it, they say something like "I determined that my action was morally permissible because it was consistent with an impartial principle that anyone could endorse." There's something about this answer that feels wrong — not because the action was wrong, but because the reasoning seems to misrepresent what was actually going on. The person didn't act from an impartial principle; they acted from love. And the fact that they reached for an impartial justification at all seems to suggest that something is missing from their relationship to the person they saved.

  I've noticed this structure in other contexts too: someone acts from a deep personal commitment — a friendship, an artistic vocation, a religious conviction — and then, when pressed, offers a justification that translates the commitment into terms that would be acceptable to anyone, regardless of whether they share the commitment. The justification isn't false, exactly, but it seems to hollow out the very thing it's trying to defend. The original motivation didn't need that kind of justification, and the act of providing it somehow corrupts or displaces the motivation.

  I'm not asking about the general idea that some things are valuable for non-impartial reasons — that's a broader topic. What I'm trying to isolate is the specific claim that, in certain cases, the very act of offering an impartial justification for a personal action is itself a kind of moral failure, even if the justification is sound and the action is right. The fact that the person felt the need to run the impartial calculation at all, rather than simply acting from the personal commitment, seems to indicate that the commitment is not what it should be.

  Is there an established term or concept for this specific configuration? How is it different from related ideas like the problem of demandingness, or the distinction between agent-relative and agent-neutral reasons, or the idea that some goods are incommensurable? If there isn't a settled name, what would you call it, and where exactly are its boundaries?

  Please structure your response with the following sections:
  - **Closest existing concepts** (roughly 300 words): Identify the philosophical concepts, distinctions, or debates that come nearest to the phenomenon I've described, explaining each briefly.
  - **How my phenomenon differs** (roughly 300 words): For each concept identified, explain how the phenomenon I've described either matches it imperfectly or goes beyond it — what's distinctive about my case that the existing concept doesn't fully capture.
  - **Best fit and name** (roughly 200 words): State which concept fits best, and if the phenomenon deserves a name of its own, propose one with a clear definition that distinguishes it from the alternatives.
  - **Boundary cases and edge questions** (roughly 200 words): Explore cases where it's unclear whether the phenomenon applies, or where the line between it and a neighboring concept blurs.
reasoning: |-
  Okay, the user is describing a specific moral reasoning pattern where someone acts from personal commitment but justifies it with impartial principles, which feels hollow or corrupting. They want to know if there's an established term for this, and how it differs from existing concepts like agent-relative reasons or integrity. 

  Hmm, this is subtle. The core issue isn't just that personal commitments exist, but that retroactively justifying them impartially betrays the original motivation. The user senses this justification act itself is a moral failure, even if logically sound. That's nuanced. 

  First thought: Williams' integrity objection to utilitarianism fits well—he argued impartial demands can alienate us from our "ground projects." But Williams focused on external demands forcing justification, while here the agent voluntarily offers it. That's a twist. 

  Also relevant: Bernard Williams' "one thought too many" example—the man saving his wife shouldn't need utilitarian calculations. Perfect match for the rescue scenario. But the user extends it to artistic/religious commitments too, which pushes beyond Williams' focus on intimate relationships. 

  Frankfurt's "care as source of normativity" comes to mind—he saw care creating reasons that can't be reduced to impartiality. Yet Frankfurt doesn't address the corruption when agents themselves try to reduce them. 

  Difference from agent-relative reasons? That framework accepts personal reasons but doesn't critique the act of translating them. The user's phenomenon is about the psychological/moral cost of that translation attempt. 

  Best fit is Williams' "one thought too many," but it needs expansion beyond rescue cases. Coining "motivational displacement" could work—capturing how justification displaces original commitment. 

  Boundary cases: What if someone acts from love but later discovers impartial justifications? Or if impartial framing strengthens commitment (e.g., "loving neighbors" in religious ethics)? Those blur the lines. 

  User seems philosophically sophisticated—they've noticed a real gap in how we discuss moral psychology. Their frustration with hollow justifications might stem from seeing this pattern in real-world discourse (political? academic?). Beyond labeling it, they may want tools to challenge reductive moral reasoning.
answer: |-
  ### **Closest existing concepts**

  1.  **Bernard Williams' "One Thought Too Many":** Williams famously critiqued consequentialism (especially utilitarianism) using the example of a man who saves his wife from drowning instead of a stranger. Williams argued that while the man *might* be able to offer a consequentialist justification afterward (e.g., "society benefits from strong personal commitments"), if he *needed* that justification *in the moment* to motivate or permit the action, it would show a "moral error" or a lack of genuine love. The "one thought too many" is the impartial calculation itself intruding where direct commitment should suffice.

  2.  **Integrity Objections to Consequentialism (Williams):** Williams argued that consequentialism, by demanding impartiality, forces agents to alienate themselves from their deepest personal commitments ("ground projects") that give life meaning. Constantly subordinating these commitments to an impartial calculus violates the agent's integrity – their sense of self and identity.

  3.  **Agent-Relative vs. Agent-Neutral Reasons (Nagel, Scheffler):** Agent-relative reasons are reasons whose force depends on the agent's specific situation, relationships, or projects (e.g., "I must save *my* child"). Agent-neutral reasons apply to everyone equally, regardless of their perspective (e.g., "a life should be saved"). The phenomenon involves acting on agent-relative reasons but then formulating an agent-neutral justification.

  4.  **Harry Frankfurt on "Care" and "Loving":** Frankfurt argues that caring about something (or loving someone) is not reducible to judgments of value. It creates reasons and motivations *sui generis*. The need to justify care/love via impartial value assessments misunderstands the nature of these commitments.

  5.  **The Problem of "Over-Justification" (Psychology):** While not purely philosophical, psychological research shows that intrinsic motivation (e.g., doing something for love or joy) can be undermined if replaced by extrinsic justification/rewards. Offering an impartial justification might function similarly, corrupting the intrinsic nature of the commitment.

  ### **How my phenomenon differs**

  *   **Williams' "One Thought Too Many":** This is the *closest* fit. Your phenomenon *is* essentially an instance of this. However, you explicitly extend it beyond the rescue scenario to commitments like artistic vocations or religious convictions, and you emphasize the *act of offering the justification later* as the corruption, even if the calculation wasn't present *during* the act. Williams focuses more on the error being the thought intruding *in deliberation*. You highlight the corruption in the *post hoc rationalization* itself.
  *   **Integrity Objections:** Williams' integrity objection is about external moral theories *demanding* impartial justification, leading to alienation. Your phenomenon focuses on the *agent themselves* feeling the *need* to supply this impartial justification *voluntarily* when challenged, even if no external theory demands it. The corruption stems from the agent's *internal* displacement of their own commitment, not just an external imposition.
  *   **Agent-Relative/Neutral Distinction:** This distinction *describes* the different types of reasons involved but doesn't *evaluate* the act of translating one into the other. It doesn't capture the *normative failure* or *hollowing out* you describe – the idea that translating the agent-relative reason into an agent-neutral justification is itself problematic and betrays the commitment.
  *   **Frankfurt on Care:** Frankfurt provides a strong foundation for *why* the commitment exists independently of impartial justification. Your phenomenon adds the specific *pathology* that occurs when the agent, despite having this commitment, feels compelled to *misrepresent* its source via impartial justification when accounting for their action, thereby undermining the very nature of the care.
  *   **Over-Justification:** This psychological concept captures the *motivational* corruption (intrinsic replaced by extrinsic) but not necessarily the *moral* or *relational* failure you identify – the betrayal of the loved one or the commitment by denying its primacy as the genuine source of the reason.

  ### **Best fit and name**

  The **best fit** is Bernard Williams' concept of **"one thought too many,"** especially as articulated in his drowning spouse example. It directly addresses the core issue: the intrusion of impartial calculation where direct personal commitment should be motivationally and justificatorily sufficient, and the resulting moral failing (lack of love/integrity).

  However, your emphasis on the *post hoc act of offering the impartial justification* as the corrupting moment, even if the deliberation itself was pure, and the extension beyond intimate relationships to deep personal commitments, suggests a specific *variant* or *extension* of Williams' point.

  **Proposed Name: Motivational Displacement (or Commitment Displacement)**

  *   **Definition:** Motivational Displacement occurs when an agent, having acted rightly from a deep personal commitment (e.g., love, friendship, vocation, faith), subsequently offers an impartial or agent-neutral justification for the action. This act of justification constitutes a moral failure by implicitly denying the sufficiency and primacy of the original commitment as the genuine source of the reason and motivation, thereby corrupting or "hollowing out" the nature of that commitment and the relationship it constitutes. The failure lies not in the action or the logic of the justification, but in the agent's felt need to displace their authentic motivation with an impartial account when explaining themselves.

  ### **Boundary cases and edge questions**

  1.  **Discovering Impartial Reasons Afterward:** What if someone acts purely from love, saves their spouse, and *later* realizes an impartial principle *also* supports their action? Is simply *acknowledging* this displacement? Likely not. The failure arises when the impartial reason is offered *as* the primary or necessary justification, displacing the commitment. The boundary is crossed when the agent presents the impartial reason *instead of* or as *superseding* the commitment-based reason.
  2.  **Defending Commitments to Others:** Is it always displacement to explain your action to a third party using impartial terms? If the explanation is purely strategic ("I know you only understand impartial reasons, so I'll frame it that way") while internally affirming the commitment, it might avoid the *internal* corruption, though it might involve a different failing (insincerity?). The core displacement occurs when the agent *themselves* comes to see or present the impartial reason as the *real* ground.
  3.  **Commitments Informed by Impartiality:** What about commitments that are *intrinsically* partly impartial? (e.g., a religious commitment commanding universal love, or an artistic vocation seen as serving a universal human good). Does justifying the act *via* that universal aspect constitute displacement? It depends: If the agent acted *from* their particular love/faith/vocation *as informed by* its universal aspect, justifying via that aspect is authentic. If they act from the particular bond but then *reduce* the justification *only* to the universal aspect, ignoring the particular, displacement occurs. The line is blurry.
  4.  **The "Should" Question:** You state the person *shouldn't* feel the need for impartial justification. But *why*? Williams argues love *just is* a sufficient reason. Frankfurt argues care creates its own reasons. The boundary question is: Are there personal commitments so deep and constitutive that they *cannot* and *should not* require external (impartial) validation to be legitimate reasons for action? Motivational Displacement assumes the answer is yes for certain core commitments.
