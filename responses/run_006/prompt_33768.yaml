prompt: |-
  For my philosophy of science class we're doing Friedman's F-twist — the idea that unrealistic assumptions in scientific models don't matter as long as the predictions are good. I want to analyze the use of DSGE models by central banks before the 2008 financial crisis through that lens. You know the basic story: these models assumed perfectly rational agents, no financial sector to speak of, no bubbles — and yet they were the main tool at the Fed and other central banks. When the crisis hit, they totally failed to predict it or even model what was happening. I want a careful mapping: what would Friedman's F-twist say in defense of these models, and where does the defense break down? Was the problem that the assumptions were unrealistic in the wrong way, or that the predictions were actually bad and people just didnt notice? And does the episode refute the F-twist, or just show it was misapplied, or something else? Also, I want you to say what kind of evidence or argument would flip your verdict — like, what would make you switch from calling it a refutation to calling it a misapplication, or vice versa. End with \answer{refutes} or \answer{supports} or \answer{complicates} for your overall take on what the 2008 crisis does to the F-twist.
