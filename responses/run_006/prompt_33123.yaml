prompt: |-
  I've been trying to sort out what I think about supererogation — acts that are good but not required — by testing my gut on a bunch of cases. The trouble is my gut isn't consistent, and I can't find a principle that fits all of it. Here are my verdicts, roughly:

  1. A child is drowning in a shallow pond. I'm in a suit that cost £200 and will be ruined if I wade in. I think I'm obligated to save the child. Not supererogatory, just required.

  2. I get a letter from a reputable charity saying £200 would save a child's life overseas. I think giving the £200 would be supererogatory, not required. (I don't feel I've done something wrong if I bin the letter, though I'd feel good about myself if I donated.)

  3. A stranger needs a bone marrow transplant. The registry contacts me as a match. The procedure is painful and involves a week of recovery. I think donating would be deeply admirable and clearly supererogatory — not something anyone can demand of me.

  4. I see someone collapse on the pavement. Calling an ambulance costs me nothing but thirty seconds. I think I'm obligated to call. Not supererogatory.

  5. My neighbour asks me to feed their cat while they're away for a weekend. I'm free and it's no trouble. I think agreeing is the decent thing, but I'm not sure it rises to obligation — and I definately wouldn't call it supererogatory. It's just... ordinary decency. But what's the difference between ordinary decency and obligation?

  6. Someone spends their weekends training as a volunteer first responder, at real cost to their leisure and social life, so they can help in emergencies. I think this is supererogatory. Not required.

  7. A parent works double shifts for years, sacrificing their health, to afford their child's medical treatment. My instinct is that this is obligatory — parental duty — but it also feels heroic in a way that doesn't sit neatly in either box. It almost feels like it's required and supererogatory at the same time, which can't be right.

  8. Someone gives 90% of their income to effective charities and lives on the remainder, radically below what their peers spend. I think this is supererogatory — saintly, even. Definitely not required.

  Here's what bothers me. Cases 1 and 2 look structurally similar: a £200 cost saves a life. But I call one obligatory and the other supererogatory. I could try to explain the difference by proximity, or salience, or the fact that in case 1 I'm the only person who can help — but then case 3 (bone marrow) also involves a unique match and I still call it supererogatory. So uniqueness isn't doing the work either. Meanwhile case 7 (the parent) feels like a counterexample to the whole obligatory/supererogatory distinction — it seems to be both.

  What I want is a principle, or maybe a small set of candidate principles, that gets as many of these verdicts right as possible. I'm willing to overturn one or two if the principle is clean enough. But I want to know which ones I'd have to give up, and why. Also: what does your preferred principle say about the parent case (7)? Is there a way to make sense of its double aspect, or does the principle force me to pick one side?
reasoning: |-
  Hmm, the user is struggling with supererogation—acts that are good but not required. They've listed eight scenarios where their gut reactions conflict, and they want a consistent principle to explain these judgments. Let me start by understanding their cases.

  First, cases 1 and 2 both involve saving a child's life at a £200 cost, but they see one as obligatory and the other as supererogatory. Proximity or uniqueness doesn't seem to explain it because case 3 (bone marrow) is unique but still supererogatory. Case 4 (calling an ambulance) is minimal cost and obligatory, while case 5 (feeding a cat) is low cost but not obligatory, just decent. Case 6 (volunteer training) is costly and supererogatory. Case 7 (parent sacrificing) feels both obligatory and heroic, which is confusing. Case 8 (donating 90% income) is clearly supererogatory.

  The user needs a principle that fits most cases, even if it means revising a few. They also want clarity on case 7. I should consider existing ethical frameworks. The Moderate Demands Principle (MDP) comes to mind—it sets a threshold of reasonable sacrifice. For instance, £200 to save a nearby child (case 1) is reasonable, hence obligatory. But £200 to save a distant child (case 2) might be seen as beyond reasonable due to psychological distance or diffusion of responsibility. However, the user might question why physical proximity matters ethically.

  Another angle is role-based duties. Case 7 (parent) is obligatory because of parental responsibilities, even if the sacrifice is heroic. The heroism is in the degree of sacrifice, but the duty itself is clear. This separates the act's obligatoriness from its admirability. For case 5 (feeding cat), neighborly help might fall under social expectations without strict obligation, while case 4 (calling ambulance) is a minimal cost with high stakes, making it obligatory.

  Case 3 (bone marrow) involves significant personal cost (pain, recovery time), which exceeds reasonable demands, hence supererogatory. But case 1's suit ruin is monetary and minor in comparison. Case 8's extreme donation is clearly beyond reasonable sacrifice. The challenge is defining "reasonable." Factors could include cost type (money, time, pain), relationship, urgency, and availability of others.

  The user might need to adjust their view on case 2. If they accept MDP, donating £200 could be obligatory if it's a reasonable demand, challenging their initial supererogatory verdict. Or, they could argue that effective altruism shifts obligations, but that might conflict with their other judgments. 

  For case 7, separating duty and sacrifice resolves the dual aspect. The parent has an obligation to help their child, but the extent of their sacrifice is supererogatory, making it admirable beyond duty. This distinction allows both aspects to coexist. 

  The user's inconsistency between cases 1 and 2 might require them to either reclassify case 2 as obligatory or accept that proximity affects obligations. If they lean towards effective altruism, they might need to revise case 2, but that could strain other cases. Alternatively, adopting a hybrid principle combining MDP with role duties could cover more ground without overhauling all verdicts. 

  In summary, MDP with role-specific duties explains most cases. The user might need to reconsider case 2 or case 1, but the principle offers a coherent framework. Case 7's duality is addressed by distinguishing the duty from the degree of sacrifice, preserving both obligatoriness and admirability.
answer: |-
  Your struggle is profound because supererogation sits at the messy intersection of ethics, psychology, and social expectation. Your intuitions are largely consistent with widely shared judgments, and the tension arises because multiple principles are at play. Here's a synthesis based on your cases, aiming for a coherent framework:

  ### Core Principle: The Moderate Demands Principle (MDP) + Role-Specific Duties
  1.  **The Moderate Demands Principle (MDP):** We are morally obligated to prevent significant harm (especially death/suffering) *unless* the cost to ourselves would be **unreasonably demanding**.
      *   "Unreasonably demanding" is context-dependent but generally includes:
          *   **High Personal Cost:** Significant physical pain, permanent bodily harm, extreme risk to life/health, profound psychological trauma, or *radical* sacrifice of one's core life projects/happiness.
          *   **High Opportunity Cost:** Sacrificing something essential for one's own fundamental well-being or core responsibilities (e.g., ability to care for dependents).
      *   **"Moderate" is relative:** What's moderate for a billionaire isn't moderate for someone in poverty. What's moderate for a parent regarding their child isn't moderate for a stranger.

  2.  **Role-Specific Duties:** Certain roles (parent, spouse, professional in a critical field) generate *stronger* obligations than general beneficence. Duties within these roles can demand sacrifices that would be supererogatory for a stranger.

  ### Applying the Principles to Your Cases

  1.  **Drowning Child (£200 suit):** **Obligatory.** Cost is moderate (financial loss), harm prevented is immense (death). MDP easily met.
  2.  **Charity Letter (£200):** **Supererogatory (on your judgment).** *This is the outlier under strict MDP.* MDP suggests £200 to save a life should be obligatory *if* it's not unreasonably demanding *for you*. Your intuition likely hinges on:
      *   **Diffusion of Responsibility:** Many *could* help; you aren't uniquely positioned.
      *   **Psychological Distance/Lack of Salience:** The need isn't immediate or directly observed.
      *   **Systemic Factors:** The problem feels too vast; individual donations seem like drops in the bucket. *(MDP would *challenge* this verdict; see "Tension" below).*
  3.  **Bone Marrow Donation:** **Supererogatory.** Cost is high: significant pain and disruption (week of recovery). This likely exceeds the "moderate demands" threshold for helping a stranger. Uniqueness doesn't override the high personal cost.
  4.  **Call Ambulance (30 sec):** **Obligatory.** Cost is negligible. Preventing significant harm with zero-to-minimal cost is a clear, basic obligation.
  5.  **Feed Neighbour's Cat:** **Not Obligatory, Not Supererogatory (Decency).** This falls below the threshold of preventing significant harm. It's an act of neighborly courtesy or low-level beneficence within normal social expectations. The cost is very low, but the harm prevented (hungry cat, worried neighbor) is also relatively minor. It's expected decency, not a stringent duty or heroic sacrifice.
  6.  **Train as First Responder:** **Supererogatory.** Significant personal cost (leisure, social life) over time to prepare to help others *potentially* in the future. This exceeds what can be demanded (MDP), though admirable.
  7.  **Parent's Sacrifice:** **Obligatory (with heroic effort) - Resolving the Double Aspect.**
      *   **Obligatory Core:** The parent has a *role-specific duty* to secure essential medical care for their child. This duty demands significant sacrifices that would be supererogatory for a stranger.
      *   **Heroic Effort:** The *extent* of the sacrifice (double shifts, health damage, sustained over years) is extraordinary. This is where the "doubleness" comes in:
          *   *Fulfilling the Duty:* The act itself (working to pay for treatment) is obligatory *because* of the role and the child's need.
          *   *Manner of Fulfillment:* The *degree* of sacrifice, perseverance, and selflessness *exceeds* the minimum required by the duty. This "above and beyond" aspect is what feels heroic and admirable – akin to supererogation *within* the fulfillment of a duty. It's not that the *act* is both obligatory *and* supererogatory; it's that fulfilling the obligatory act involved a level of sacrifice that is *itself* exceptional and praiseworthy beyond the call of the basic duty.
  8.  **Give 90% to Charity:** **Supererogatory.** Radical sacrifice of personal well-being and normal life opportunities, far exceeding "moderate demands" (MDP). Sainthood territory.

  ### Addressing the Tensions & Which Verdicts Might Need Adjustment

  *   **The Core Tension (Case 1 vs. Case 2):** MDP, strictly applied, suggests both saving the drowning child *and* donating £200 to save the distant child *should* be obligatory *if* £200 is not an unreasonable demand *for the specific agent*. Your intuition in Case 2 reflects powerful psychological/social factors (diffusion, distance) that *feel* morally relevant but are hard to justify ethically as reasons *not* to act when the cost/benefit ratio is identical to Case 1.
      *   **Option 1 (Revise Case 2):** Conclude donating £200 *is* obligatory if affordable. This aligns MDP and Effective Altruism principles. You'd have to accept that binning the letter *is* wrong, though perhaps less blameworthy than ignoring the drowning child due to the psychological factors.
      *   **Option 2 (Modify MDP):** Argue that "moderate demands" includes *psychological* or *practical* factors like direct proximity/salience or being the *only* available agent. This preserves your Case 2 verdict but makes the principle messier and risks inconsistency (e.g., uniqueness didn't sway you in Case 3).
      *   **Option 3 (Accept Inconsistency):** Acknowledge the psychological pull of proximity/salience creates a felt moral difference, even if it's ethically shaky. Most people live with this tension.

  *   **Case 3 (Bone Marrow) vs. Case 1/2:** The difference is *cost type*. MDP focuses on the *demandingness* of the cost. Ruining a £200 suit is primarily a financial cost. Bone marrow donation involves significant physical pain, bodily intrusion, and recovery time – a much higher personal cost category. MDP explains why uniqueness doesn't override this high cost.

  *   **Case 5 (Cat) vs. Case 4 (Ambulance):** The difference is the *severity of harm prevented*. An untreated medical emergency is severe harm; a hungry cat for a weekend is minor inconvenience. Low cost + preventing severe harm = obligation (Case 4). Low cost + preventing minor harm = basic decency/social expectation, not strict obligation (Case 5). The threshold for "significant harm" matters.

  *   **Case 7 (Parent):** The principle clarifies the double aspect. The core act (securing treatment) is obligatory due to the parental role. The *level of sacrifice* involved in fulfilling that obligation is exceptional and praiseworthy – it's the *heroism in meeting the duty*, not a separate supererogatory act. This resolves the contradiction.

  ### Candidate Principles Summarized

  1.  **Moderate Demands Principle (MDP):** Prevent significant harm unless the cost to yourself is unreasonably demanding (considering cost magnitude, type, and your capacity).
  2.  **Role-Specific Amplification:** Duties arising from specific relationships (parent, etc.) demand greater sacrifices than general beneficence.
  3.  **Decency Threshold:** Acts preventing minor harms at negligible cost are matters of ordinary decency/social expectation, not strict obligation or supererogation.
  4.  **Cost Type Matters:** Physical pain, health risk, and radical life disruption weigh more heavily than comparable financial costs or moderate inconvenience.

  **Which verdicts might you need to give up?** Primarily **Case 2 (Charity)** if you demand strict ethical consistency under MDP (Option 1). Alternatively, you might soften MDP to include psychological availability factors (Option 2), accepting some fuzziness. **Case 5 (Cat)** isn't overturned, it's categorized separately under "decency." **Case 7 (Parent)** is resolved, not overturned.

  Your intuitions reveal the complexity of supererogation: duties are bounded by reasonable sacrifice, shaped by relationships, and influenced by psychological realities. The clearest path (Option 1) challenges the intuitive difference between Cases 1 and 2, while Option 2 preserves intuition at the cost of theoretical purity. Case 7 shows that heroic effort can fulfill a duty without being supererogatory *in itself*.
