prompt: |-
  ok so im trying to get a handle on zeno's paradoxes and i read this little section in a popular physics book about infinity. it summarized things roughly like this: 'Zeno's paradoxes are arguments that motion is impossible. In Achilles and the tortoise, Achilles can never catch the tortoise because he first has to reach the point where the tortoise started, by which time the tortoise has moved a bit further, and so on forever. The standard solution is calculus: an infinite series can sum to a finite value, so the infinitely many little tasks take only a finite amount of time. The arrow paradox makes the same point — at any instant the arrow is in one place and therefore isn't moving, so it's never moving — and here too the fix is to think of velocity as the limit of average velocities. What Zeno was really getting at is how you can complete infinitely many tasks in finite time, and once you understand limits there isn't really any leftover puzzle.' I have a hunch that the arrow part is a bit off and that 'calculus solves it' is overselling, but i dont know enough to say exactly where. Could you act as a philosopher who works on ancient Greek philosophy and the philosophy of mathematics, and go through this summary piece by piece? Please take your time, maybe start by brainstorming what each paradox actually says before you audit it. I want to know which parts are fair, which parts are subtle misreadings or conflations, and whether the books overall takeaway survives once you correct the details.
