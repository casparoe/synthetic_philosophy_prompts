  They emphasize the need for a reading that takes Borges' details seriously: the hrönir (objects that materialize through expectation), the adjective-based language, the encyclopedia as world-making technology, and the narrator's conflicted seduction by Tlön. They want to avoid reducing the story to a philosophical allegory or distorting the philosophy to fit the fiction. They also ask where Borges' metaphysics might resist pragmatist interpretation, marking a limit to this reading.

