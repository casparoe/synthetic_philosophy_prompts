  I think the most promising angle is to argue that Borges isn't condemning pragmatism outright but staging its latent dangers when detached from certain constraints. The hrönir perfectly literalize James' "truth happens to an idea"—but show this becoming pathological when severed from Peircean discipline. The story thus pressures pragmatism to clarify its boundaries: What prevents "truth-making" from becoming mere reality distortion? Peirce's emphasis on the "community of inquiry" and science as corrective seems crucial here, but Tlön shows how even that can be hijacked (the encyclopedia as corrupted "consensus engine"). Borges might be saying: This is how pragmatism ends if it forgets that truth requires friction beyond utility or consensus.

