prompt: |-
  ok so im a software engineer with basically no philosophy background, and i keep running into this term supererogation — the stuff thats morally good but not required, like jumping on a grenade or donating a kidney to a stranger. every time i try to read a theory of it the author assumes i already know what a theory of it is supposed to do, and i dont. so before i read any actual theories, i want the spec.

  write it like a requirements doc. what does any adequate theory of supererogation have to deliver? give me the acceptance criteria with the case or consideration behind each one: the distinctions it cant collapse (like "not required" vs "morally neutral", or small everyday favors vs heroic self-sacrifice), the edge cases it has to handle (can something be supererogatory toward yourself, like developing a talent way past any duty? does the same act flip from required to supererogatory when the relationship changes, a kidney for your kid vs for a stranger? do professional roles — soldier, doctor, lifeguard — move the line? does it matter whether the person did the heroic thing by accident or for the wrong reason?), and the structural puzzles it has to solve (if the act is better than what duty demands, why isnt it simply required? why is skipping a supererogatory act not blameworthy when skipping a duty is? and is there a mirror-image category of bad-but-permissible acts, and does your theory predict one?).

  also mark which requirements are non-negotiable and which are just one camps preference — e.g. is it a hard requirement that a theory leave room for optional good acts at all, given some moral theories seem to make everything required? flag any two or three requirements you think cant be jointly satisfied, because that tension is the part i most want to see. and tell me which single requirement does the most work knocking out theories. skip the full scorecard of existing views, ill do that myself after.

  id rather the list be sharp than exhaustive. if theres a requirement people usually put on it that you think is actually bogus, say so and why.
reasoning: |-
  Okay, the user is a software engineer with no philosophy background who keeps encountering the term "supererogation." They're frustrated because philosophical texts assume prior knowledge, so they want a "requirements doc" that outlines what any adequate theory of supererogation must deliver. 

  Hmm, interesting framing—they're literally asking for acceptance criteria like in software development. That makes sense given their background. They want clarity on distinctions, edge cases, and structural puzzles before diving into theories. 

  First, I need to identify the absolute core requirements (the non-negotiables) versus the debatable ones. The fundamental puzzle is: how can something be morally good but not required? That's the bedrock. Then we have key distinctions like "not required" versus "morally neutral," and the blameworthiness gap (why skipping supererogation isn't blameworthy like skipping duty is). 

  Edge cases they mentioned are crucial: self-regarding acts (like developing a talent), relationship dependencies (kidney for kid vs. stranger), professional roles shifting obligations, and motivation (doing good accidentally or for wrong reasons). Also, the mirror-category question (suberogation) seems important to them. 

  Ah, and they explicitly want tensions highlighted—requirements that might conflict. The biggest one is probably the "Blameworthiness Gap" vs. "Motivation Sensitivity." If skipping isn't blameworthy, but doing it for bad reasons might be blameworthy... that's messy. Also, optionality vs. demandingness (if morality requires everything, supererogation vanishes). 

  I should flag which requirement knocks out the most theories. Definitely the "Not Merely Permissible" criterion—if a theory can't distinguish supererogation from neutral acts, it fails. Utilitarianism often struggles here. 

  For controversial points: the "Suberogation" mirror-category is debated (some think it's just "bad but permissible," others say it collapses into "wrong"). Also, "Self-Regarding Supererogation" is divisive—can you be "beyond duty" to yourself? 

  ...Writing the response now. Structuring it as a spec doc with sections: Core Requirements, Edge Cases, Structural Puzzles, Tensions. Marking each as "MUST" (non-negotiable) or "MAY" (preference). Calling out the key tension and the knockout requirement. Keeping it sharp, not exhaustive, as requested.
answer: |-
  Here’s your **Theory of Supererogation Spec: v1.0** — structured as a requirements doc, with acceptance criteria, edge cases, tensions, and priority flags.  

  ---

  ### **I. CORE REQUIREMENTS** (Non-Negotiable)  
  **AC1: Not Required, Not Neutral**  
  - **Requirement**: MUST sharply distinguish supererogatory acts from:  
    (a) *Duties* (required, blameworthy if omitted),  
    (b) *Morally neutral acts* (no praise/blame).  
  - **Why**: Collapsing supererogation into duty eliminates optional goodness; collapsing into neutrality erases moral praiseworthiness.  
  - **Knockout Power**: Fails if theory cannot ground this distinction.  

  **AC2: Praiseworthy But Not Blameworthy Omission**  
  - **Requirement**: Performing a supererogatory act MUST merit moral praise; *not* performing it MUST **not** merit moral blame.  
  - **Why**: Core paradox — if skipping isn’t blameworthy, why is doing it praiseworthy? Theory must resolve this.  
  - **Edge Case**: Heroic sacrifice (e.g., jumping on a grenade) — praiseworthy, but refusing isn’t murder.  

  **AC3: Beyond the Call of Duty**  
  - **Requirement**: Supererogatory acts MUST exceed baseline moral demands (duties).  
  - **Why**: If duty expands to cover all good acts, supererogation vanishes (e.g., extreme utilitarianism struggles here).  

  ---

  ### **II. EDGE CASES & CONSIDERATIONS**  
  **AC4: Relationship Dependence**  
  - **Requirement**: Theory MUST explain how duties/supererogation shift with relationships.  
    - *Example*: Donating a kidney to your child (duty?) vs. stranger (supererogatory).  
  - **Failure Mode**: If theory cannot handle this, it’s over-rigid.  

  **AC5: Professional Roles**  
  - **Requirement**: MUST address how roles (doctor, soldier) convert normally supererogatory acts into duties.  
    - *Example*: Lifeguard saving a swimmer = duty; bystander = supererogatory.  

  **AC6: Motivation & Accident**  
  - **Requirement**: MUST clarify if accidental/intrinsically evil motives can be supererogatory (e.g., jumping on grenade to show off).  
  - **Consensus View**: Most theories require *intention to do good* for praiseworthiness.  

  **AC7: Self-Regarding Supererogation (Controversial)**  
  - **Requirement**: SHOULD address if self-directed acts (e.g., extreme asceticism, genius-level skill cultivation) can be supererogatory.  
  - **Tension**: If duties to self exist, is "beyond duty" coherent?  

  ---

  ### **III. STRUCTURAL PUZZLES**  
  **AC8: The "Why Not Required?" Problem**  
  - **Requirement**: MUST explain why supererogatory acts aren’t simply *required* if they produce more good than duties.  
  - **Theory Burden**: Answer usually involves agent autonomy, cost thresholds, or value pluralism.  

  **AC9: The Mirror Category (Suberogation)**  
  - **Requirement**: SHOULD predict whether "suberogatory" acts (bad but permissible, e.g., mildly selfish choices) exist.  
  - **Bogus Alert?**: Some argue all bad acts are either wrong or neutral — no "permissible bad."  

  ---

  ### **IV. TENSIONS & TRADEOFFS**  
  **1. Demandingness vs. Optionality (AC3 vs. AC8)**  
  - **Conflict**: If morality isn’t demanding (allowing supererogation), why isn’t the *best* act required?  
  - **Theories Break Here**: Act-utilitarianism (everything required) vs. moderate deontology (room for supererogation).  

  **2. Blameworthiness Gap vs. Motivation Sensitivity (AC2 vs. AC6)**  
  - **Conflict**: If accidental heroism isn’t praiseworthy, but omission isn’t blameworthy — how does theory assign moral weight?  

  **3. Relationships vs. Universality (AC4)**  
  - **Conflict**: Should supererogation be agent-neutral (anyone can do it) or agent-relative (depends on your role)?  

  ---

  ### **V. PRIORITY FLAGS**  
  - **MUST-HAVE**: AC1, AC2, AC3 (Collapse these, and the concept dies).  
  - **THEORY-KILLER**: **AC1 (Not Required, Not Neutral)**. Fails if supererogation = duty (e.g., utilitarianism) or = neutrality (e.g., minimal deontology).  
  - **CONTROVERSIAL**: AC7 (Self-Regarding) and AC9 (Suberogation) — theories may reject these to avoid complexity.  
  - **HIGH-STAKES EDGE**: **AC5 (Professional Roles)**. If a theory can’t explain why soldiers/lifeguards have expanded duties, it’s inadequate for real-world ethics.  

  ---

  ### **VI. BOGUS REQUIREMENT ALERT**  
  **"Supererogation Requires Sacrifice"**  
  - **Why Bogus?**: Everyday favors (e.g., helping a stranger carry groceries) are low-cost but often supererogatory. Sacrifice may indicate *degree* (heroic vs. mundane), not essence.  
  - **Resolution**: A theory MAY distinguish *degrees* of supererogation but MUST NOT require heroism.  

  ---

  **NEXT STEPS FOR YOU**:  
  1. Audit theories against this spec (e.g., **Urmson**'s "saints and heroes", **Heyd**'s agent-centered view, **Slote**'s satisficing).  
  2. Watch for **AC1 failures** (common in maximizing theories).  
  3. Test **AC4 & AC5** against role-dependent theories (e.g., **feminist ethics**).  

  This spec isolates the *functional core* of supererogation — use it to stress-test theories before diving into their jargon. Good luck! 🔍
