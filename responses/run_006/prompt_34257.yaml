answer: |-
  Here are the desiderata for an adequate solution to the Frege-Geach problem for expressivism, categorized by domain, with rationale and negotiability status. Desiderata marked **(NN)** are widely considered non-negotiable for *any* expressivist solution; others reflect commitments of specific expressivist camps.

  ---

  ### **I. Linguistic Phenomena: Unasserted Contexts**  
  *(Must explain uniform behavior of moral/non-moral sentences across contexts)*  
  1. **Embedding in Conditionals** (NN):  
     - *Case:* "If stealing is wrong, then getting little brother to steal is wrong." Must function as a valid conditional, not an asserted command/attitude.  
     - *Rationale:* Geach’s challenge: moral sentences in antecedents aren’t asserted but constrain truth/acceptance of consequents.  

  2. **Negation** (NN):  
     - *Case:* "Stealing is not wrong" vs. "It’s not that stealing is wrong" (withholding judgment).  
     - *Rationale:* Expressivism must distinguish *rejecting* a moral claim from *accepting its negation*.  

  3. **Disjunctions & Other Connectives**:  
     - *Case:* "Either stealing is wrong or society is unjust." Must license inference patterns (e.g., disjunction elimination).  
     - *Rationale:* Moral sentences embed in truth-functional compounds identically to descriptive ones.  

  4. **Belief/Doubt Reports**:  
     - *Case:* "Alice believes stealing is wrong" vs. "Alice doubts stealing is wrong."  
     - *Rationale:* Attributing attitudes requires moral sentences to denote *contents* (propositions) even if expressivism rejects realist truth-conditions.  

  5. **Questions & Modal Embeddings**:  
     - *Case:* "Is stealing wrong?" or "Possibly, stealing is wrong."  
     - *Rationale:* Moral sentences function in non-declarative contexts without being "uttered" expressively.  

  ---

  ### **II. Inferential Patterns**  
  *(Must validate or explain away standard inferences)*  
  6. **Logical Validity** (NN):  
     - *Case:* Modus Ponens: *If P, then Q; P; therefore Q* must hold when P/Q are moral (e.g., "If lying is wrong, telling Joe to lie is wrong; lying is wrong; therefore...").  
     - *Rationale:* Core to logic; failure here would make moral reasoning unintelligible.  

  7. **Moral Inconsistency Detection**:  
     - *Case:* Recognizing that "Charity is good" and "Charity is not good" are incompatible.  
     - *Rationale:* Essential for moral disagreement and dialectic.  

  8. **Explaining Invalid Inferences**:  
     - *Case:* Invalid arguments (e.g., affirming the consequent) must *not* be validated.  
     - *Rationale:* Solution must not overgenerate valid inferences.  

  ---

  ### **III. Conceptual Distinctions**  
  9. **Attitude Inconsistency vs. Mere Difference** (NN):  
     - *Case:* Distinguishing *disagreeing with* "Stealing is permissible" (inconsistency) from *being indifferent to* stealing (mere difference).  
     - *Rationale:* Central to expressivism’s core thesis that moral judgments express conative attitudes.  

  10. **Rejection vs. Negation Acceptance**:  
      - *Case:* Withholding judgment on "Stealing is wrong" ≠ accepting "Stealing is not wrong."  
      - *Rationale:* Negation must be a cognitive operation on content, not just absence of endorsement.  

  ---

  ### **IV. Theoretical Constraints**  
  11. **Compositionality** (NN for most):  
      - *Case:* Meaning of "Lying is wrong and charity is good" must derive from parts + structure.  
      - *Rationale:* Foundational to semantics; ad-hoc stipulations for moral terms are untenable.  

  12. **Standard Semantics for Non-Moral Language**:  
      - *Case:* "Grass is green and snow is cold" has truth-conditional content. Must integrate moral/non-moral without dual semantics.  
      - *Rationale:* Avoids segregating language into disconnected fragments.  

  13. **Attitude Specification** (NN for pure expressivists):  
      - *Case:* Must state *which mental state* is expressed by "If lying is wrong, then..." (e.g., a complex attitude, not just a "proposition").  
      - *Rationale:* Expressivism’s core commitment: meanings *are* constituted by attitudes. Stipulating "logical objects" without psychological reality is cheating.  

  14. **Truth/Alethic Status**:  
      - *Negotiable:*  
        - *Deflationists* (e.g., Blackburn): Allow "truth" for moral sentences as a logical device.  
        - *Anti-truth* camps: Reject truth-aptness entirely (rare today).  
      - *Rationale:* Must explain normative uses of "true" ("Everything he said is true") without collapsing to realism.  

  15. **Internalism about Motivation** (Negotiable):  
      - *Strong Internalism* (e.g., Ayer): Moral judgment *entails* motivation.  
      - *Weak Internalism* (e.g., Blackburn): Moral judgment has a *default* connection to motivation.  
      - *Rationale:* Expressivism often relies on motivational force to distinguish moral judgments.  

  ---

  ### **V. Suspected Tensions**  
  The most plausible candidate for joint unsatisfiability:  
  - **Compositionality** (11) + **Attitude Specification** (13) + **Standard Semantics** (12).  
  - *Why?* Explaining embedding in truth-conditional terms (e.g., conditionals as functions) while reducing *all* meaning to *psychologically real, non-cognitive attitudes* is extraordinarily difficult. Hybrid theories split the difference; pure expressivists (e.g., Gibbard) use highly abstract attitudes (e.g., "plan-laden" states).  

  ---

  ### **Brief Solution Scorecard**  
  | **Family**               | **Strengths**                          | **Weaknesses**                              |  
  |---------------------------|----------------------------------------|---------------------------------------------|  
  | **Classical Prescriptivism** (Hare) | Handles imperatives.                  | Fails embedding (e.g., conditionals).       |  
  | **Hyperplan Expressivism** (Gibbard) | Validates logic; compositional.       | Attitudes are highly abstract (psychologically implausible?). |  
  | **Quasi-Realism** (Blackburn) | Explains truth-talk; respects logic. | Relies on deflationism; attitude specification vague for complexes. |  
  | **Single-Attitude Semantics** (e.g., Horgan/Timmons) | Unified attitude (e.g., "ought").    | Struggles with complex embeddings.          |  
  | **Hybrid Expressivism** (Ridge, Schroeder) | Eases compositionality; handles negation. | Risks losing "pure" expressivism; motivation connection murky. |  

  ---

  **Key Insight**: An optimal solution must explain moral language *as if* it were truth-conditional while grounding it *entirely* in non-representational mental states. The tension between semantic uniformity and psychological implementation remains the central hurdle.
