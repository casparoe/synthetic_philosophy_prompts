  We are drafting a joint statement for a one-shot symmetric Prisoner's Dilemma between two equally rational players. The two parties are:
  - A superrationalist (in the style of Hofstadter) who argues that cooperation is rational.
  - A standard game theorist who argues that defection is the unique rational play.

  We are to produce:
  (1) Agreed claims (numbered, precise, non-vacuous)
  (2) Disagreements table (one row per residual disagreement, with each side's position in their own words without strawmen)
  (3) Cruxes (sub-questions that would move at least one side if settled)
  (4) Tests and predictions (for each crux, a concrete case and what each side predicts, and what would count as revision)

  Additionally, we must identify if any part is merely verbal and adjust accordingly.

  Let me first sketch the core commitments:

  Superrationalist (SR) core commitments:
  - Equally rational players in identical situations (same payoffs, same information, same reasoning capacity, same decision procedure) will choose identically.
  - Therefore, only symmetric outcomes (both cooperate or both defect) are possible.
  - Since mutual cooperation yields a better payoff than mutual defection, cooperation is rational.

  Standard game theorist (SGT) core commitments:
  - Rationality requires that a player never choose a strictly dominated act. Since defection strictly dominates cooperation (it yields a better payoff no matter what the other player does), defection is the only rational choice.
  - The possibility of asymmetric outcomes (one cooperates, one defects) cannot be ruled out by common knowledge of rationality and symmetry alone. Without a causal or institutional link, each player must consider all possible actions of the other, including defection.

  Now, we must draft the joint statement.

  (1) Agreed Claims:

  We must cover:
  - Payoff structure and dominance: what dominance does and does not establish.
  - Symmetry and common knowledge of rationality: what they do and do not entail.
  - Conditions under which cooperation would be rational (e.g., against a copy, enforceable agreement, repeated play).
  - Distinction between recommending an act and predicting an outcome.

  Precise formulations:

  1. The game is a one-shot, two-player, symmetric Prisoner's Dilemma. The payoffs satisfy T > R > P > S and R > (T+S)/2, so that mutual cooperation is Pareto optimal and mutual defection is the unique Nash equilibrium of the stage game. Defection strictly dominates cooperation: for each player, defection yields a strictly higher payoff than cooperation regardless of the other player's choice.

  2. Strict dominance alone establishes that defection is the only strategy that is not strictly dominated. However, it does not by itself establish that defection must be played in every possible scenario; it leaves open the possibility that other considerations (such as causal links, binding agreements, or repeated interaction) might override the dominance reasoning.

  3. Symmetry of the game means that both players face identical payoff structures and have the same information about the game. Common knowledge of rationality means that each player knows both are rational, each knows that the other knows, and so on.

  4. Symmetry and common knowledge of rationality do not, by themselves, entail that both players will choose the same action. They are consistent with both players defecting, both cooperating, or even asymmetric outcomes (if the players use different reasoning processes). However, they are also consistent with both players using the same reasoning process and thereby arriving at the same action.

  5. Cooperation would be rational in the following cases:
     a. Against a known deterministic copy of oneself (e.g., a computer program that is an exact duplicate of one's own decision process, or a player who is known to use the same decision procedure and to be in the same situation).
     b. When there is an enforceable agreement to cooperate.
     c. In an indefinitely repeated Prisoner's Dilemma with a sufficiently high discount factor, where the Folk Theorem applies and cooperation can be sustained in equilibrium.

  6. There is a distinction between recommending an act (what a player should do) and predicting an outcome (what both players will do). A theory may predict mutual defection but still recommend cooperation if it believes that the other player will cooperate, but in the absence of a basis for such a belief, the recommendation must account for the possibility of defection.

  (2) Disagreements table:

  Residual disagreements:

  Question 1: In the symmetric one-shot Prisoner's Dilemma with common knowledge of rationality and symmetry, is cooperation a rational choice?

  - Superrationalist: Yes, because the symmetry and common knowledge of rationality imply that both players will reason identically and therefore choose the same action. Since mutual cooperation yields a higher payoff than mutual defection, and the asymmetric outcomes are impossible, cooperation is rational.

  - Standard game theorist: No, because defection strictly dominates cooperation. The possibility of asymmetric outcomes cannot be ruled out by symmetry and common knowledge of rationality alone. Without a causal link or a guarantee that the other player will cooperate, defection is the only rational choice.

  Question 2: Are the asymmetric outcomes (one cooperates, one defects) possible in the symmetric one-shot Prisoner's Dilemma under common knowledge of rationality and symmetry?

  - Superrationalist: No, because identical rational agents in identical situations must choose the same action. Therefore, only symmetric outcomes are possible.

  - Standard game theorist: Yes, because even with symmetry and common knowledge of rationality, each player must consider the entire set of possible actions of the other player. Rationality does not require that both players choose the same action; it only requires that each chooses a best response to their beliefs. Without further constraints, a player might believe the other will cooperate and defect, leading to asymmetry.

  (3) Cruxes:

  We need to list sub-questions that could move at least one side. Candidate cruxes:

  a) Can identical reasoning processes in identical situations ground a non-causal dependence between the two players' acts?

  b) What must be included in the symmetry condition? (Payoffs, information, computational capacities, decision procedures?) And how much of it is doing the work?

  c) Is the superrationalist recommendation robust to small asymmetries or to a small probability that the other player is irrational? What would it mean if it is not?

  d) Does the reasoning that yields cooperation in the symmetric Prisoner's Dilemma commit the superrationalist to one-boxing in Newcomb's problem, to cooperating in an asymmetric Prisoner's Dilemma, or to team reasoning in Hi-Lo?

  Let me list them as:

  Crux 1: Non-causal dependence. 
     - Issue: Whether the identity of reasoning processes and situations can create a non-causal link that forces the same action.

  Crux 2: Symmetry requirements.
     - Issue: What conditions must be met for the symmetry argument to apply? Must the players have identical decision procedures? How identical must they be?

  Crux 3: Robustness to asymmetries and irrationality.
     - Issue: What happens if there is a small asymmetry (e.g., one player has a slightly different payoff, or one has a slightly higher computational capacity) or if there is a small probability that the other player is irrational? If the superrationalist recommendation breaks down under such perturbations, does that undermine it?

  Crux 4: Implications for other decision problems.
     - Issue: Does the superrationalist reasoning lead to one-boxing in Newcomb's problem? Would it require cooperation in an asymmetric Prisoner's Dilemma? Would it lead to team reasoning in a Hi-Lo game?

  (4) Tests and predictions:

  For each crux, a concrete case and what each side predicts.

  Crux 1: Non-causal dependence.

  Test case: A player faces a known deterministic copy of themselves (e.g., they are told that the other player is an exact duplicate of their own decision-making algorithm, running in the same state, and that there is no causal link between the two).

  Predictions:
  - SR: Both players will cooperate because they both reason that since they are identical, they will choose the same action, and mutual cooperation is better. Cooperation is rational.
  - SGT: Even against a copy, defection is still the dominant strategy. However, if the copy is exact, then both will choose the same action. But if both are rational, they will both defect. So the outcome will be mutual defection. Thus, defection is still rational because if the other were to cooperate, you would do better by defecting. The dominance argument still holds.

  What would count as revision?
  - For SR: If in the copy case, it turned out that both players defected, that would contradict their prediction of cooperation. They would have to revise.
  - For SGT: If in the copy case, both players cooperated, that would be a surprise and might require an explanation, but they would not necessarily abandon dominance. They might argue that the copy is not rational if it cooperates.

  Crux 2: Symmetry requirements.

  Test case: Consider a symmetric Prisoner's Dilemma but with a small asymmetry: Player 1 is told that Player 2 has a slightly higher payoff in the (C,C) outcome (say, R+ε for Player 2, while Player 1 gets R). Both players know this.

  Predictions:
  - SR: The superrationalist might argue that the slight asymmetry breaks the symmetry, so now the players are not in identical situations. Therefore, the argument for cooperation fails. They may then revert to defection.
  - SGT: The standard game theorist would say that defection is still the dominant strategy for both. The slight change in Player 2's payoff does not affect Player 1's dominance of defection.

  What would count as revision?
  - For SR: If they still recommend cooperation in the presence of a small asymmetry, that would be a revision (because they typically require strict symmetry). But if they abandon cooperation, that is consistent.
  - For SGT: No revision needed.

  Crux 3: Robustness to irrationality.

  Test case: The symmetric Prisoner's Dilemma, but each player believes there is a small probability (say, 1%) that the other player is irrational and will cooperate no matter what.

  Predictions:
  - SR: The superrationalist might still recommend cooperation, arguing that if both are rational (which is 99% likely), they will both cooperate, and the expected payoff from cooperation might still be higher. But if the probability of irrationality is high enough, they might defect. However, in the standard superrationality, the focus is on the rational players, so they might downplay the irrationality.
  - SGT: The standard game theorist would calculate the expected payoff. Since defection is still a dominant strategy (it does better regardless of what the other does, even if the other might cooperate with some probability), defection is still the rational choice.

  What would count as revision?
  - For SR: If they recommend defection in the face of any positive probability of irrationality, that would be a revision because they originally rule out asymmetric outcomes entirely. But they might adjust by saying that in the presence of uncertainty, the argument weakens.

  Crux 4: Implications for other problems.

  Test cases:
  a) Newcomb's problem: A being (the predictor) has predicted your action. You have two choices: take one box (which contains $1,000,000 if the predictor predicted you would take one box, and $0 otherwise) or take two boxes (which always contains $1,000 regardless of the prediction, plus the $1,000,000 if predicted to take one box). The predictor is highly accurate.

  b) Asymmetric Prisoner's Dilemma: The payoffs are not symmetric. For example, Player 1 gets the standard payoffs, but Player 2 has different payoffs (but still a PD structure: T2>R2>P2>S2 and R2>(T2+S2)/2, and for Player 1, T1>R1>P1>S1, R1>(T1+S1)/2, but T1≠T2, etc.).

  c) Hi-Lo game: A coordination game with two Nash equilibria, one Pareto superior to the other. Players choose A or B. If both choose A, both get 10; if both choose B, both get 5; if they choose differently, both get 0.

  Predictions:

  a) Newcomb's problem:
     - SR: The superrationalist would one-box. They reason that the predictor has predicted their action, so if they are a one-boxer, they get $1,000,000, and if they are a two-boxer, they get only $1,000. Since the predictor is accurate, they are effectively in a symmetric situation with their future/predicted self, so they should one-box.
     - SGT: Two-box. Because regardless of what the predictor has done, taking both boxes yields $1,000 more than taking one box. The predictor has already made the prediction, so it's fixed.

  b) Asymmetric PD:
     - SR: The superrationalist might not recommend cooperation because the symmetry is broken. The players are not in identical situations, so they cannot assume the same action. They might defect.
     - SGT: Defect, because it's still dominant.

  c) Hi-Lo:
     - SR: The superrationalist would choose A (the higher payoff equilibrium) because they expect the other to reason identically and choose A as well.
     - SGT: Both (A,A) and (B,B) are Nash equilibria. Without more, game theory does not select one. But if there is common knowledge of rationality and salience, they might choose A. However, standard game theory does not have a unique recommendation without refinement. But note: superrationality would predict and recommend A.

  What would count as revision?
  - For SR: If they two-box in Newcomb, that would be a revision. If they cooperate in an asymmetric PD, that would be a revision. If they do not choose A in Hi-Lo, that would be a revision.
  - For SGT: If they one-box in Newcomb, that would be a revision. But note: some game theorists (e.g., evidential decision theorists) do one-box. The standard game theorist in this context is a causal decision theorist.

  Verbal Disagreement?

  Is any part merely verbal?

  One potential issue: what does "identical situation" mean? The SR includes the decision procedure as part of the situation, while the SGT might not. Also, the SR uses "rational" to imply that they will use the same reasoning and thus act the same, while the SGT uses "rational" as not playing dominated strategies.

  But the core disagreement seems substantive: can we rule out asymmetric outcomes based on symmetry and common knowledge of rationality? The SR says yes, the SGT says no.

  Thus, no merely verbal disagreement.

  Now, we draft the document accordingly.
answer: |-
  ### Joint Statement on the One-Shot Symmetric Prisoner's Dilemma  
  **Produced through adversarial collaboration between a proponent of Hofstadter-style superrationality and a standard game theorist**  

  #### (1) Agreed Claims  
  Both parties accept the following claims about the one-shot, symmetric Prisoner's Dilemma between two equally rational players. Each claim is formulated to be precise, non-vacuous, and free of ambiguity.  

  1. **Payoff structure and dominance**:  
     - The game is symmetric: both players face identical payoff matrices satisfying \(T > R > P > S\) and \(R > (T + S)/2\), where \(T\) (temptation) is the payoff for defecting when the other cooperates, \(R\) (reward) for mutual cooperation, \(P\) (punishment) for mutual defection, and \(S\) (sucker) for cooperating when the other defects.  
     - Defection strictly dominates cooperation for each player: regardless of the other player's choice, defection yields a strictly higher payoff than cooperation. This establishes that defection is the only undominated strategy.  
     - Dominance alone does not establish that defection must be played in all conceivable scenarios; it leaves open the possibility that additional factors (e.g., causal links, binding agreements, or repeated interaction) could override dominance reasoning.  

  2. **Symmetry and common knowledge of rationality**:  
     - Symmetry means both players have identical payoff structures, identical information about the game, and common knowledge that both are rational.  
     - Common knowledge of rationality means each player knows both are rational, each knows the other knows, and so on ad infinitum.  
     - Symmetry and common knowledge of rationality do not, by themselves, entail that both players will choose the same action. They are consistent with both players defecting, both cooperating, or asymmetric outcomes (one cooperates, one defects). They also do not entail that asymmetric outcomes are impossible if players reason differently.  

  3. **Conditions for rational cooperation**:  
     - Cooperation is rational if:  
       - (a) A player faces a known deterministic copy of themselves (e.g., an identical decision procedure with identical inputs and no causal independence).  
       - (b) There is an enforceable agreement to cooperate (e.g., external enforcement ensures mutual cooperation).  
       - (c) The game is indefinitely repeated with a sufficiently high discount factor, where the Folk Theorem supports cooperation as an equilibrium.  
     - Outside these conditions, dominance establishes defection as the rational choice unless further non-standard assumptions are introduced.  

  4. **Act recommendation vs. outcome prediction**:  
     - Recommending an act (what a player should choose) is distinct from predicting an outcome (what both players will choose).  
     - A theory may predict mutual cooperation but must justify why a player should cooperate absent a guarantee that the other will cooperate. Conversely, a theory may predict mutual defection but still recognize that cooperation could yield higher payoffs under specific circumstances.  
     - Rationality concerns act recommendation based on available information; it does not require correct outcome prediction.  

  #### (2) Disagreements Table  
  The table below summarizes unresolved disagreements. Each position is stated as the respective proponent would endorse it, without misrepresentation.  

  | No. | Question at issue | Superrationalist's position | Standard game theorist's position |
  |-----|-------------------|----------------------------|-----------------------------------|
  | 1   | **Is cooperation rational in the symmetric one-shot Prisoner's Dilemma under common knowledge of rationality?** | Cooperation is rational because symmetry and common knowledge of rationality imply identical reasoning and thus identical choices. Only symmetric outcomes are live; mutual cooperation dominates mutual defection, so cooperation is uniquely rational. | Defection is uniquely rational because strict dominance requires avoiding a dominated act. Symmetry and common knowledge of rationality do not eliminate asymmetric outcomes as live possibilities, so cooperation risks the sucker's payoff. |
  | 2   | **Are asymmetric outcomes (one cooperates, one defects) possible under symmetry and common knowledge of rationality?** | Asymmetric outcomes are impossible. Identical rational players in identical situations must produce identical choices due to non-causal dependence: the same reasoning process applied to the same inputs yields the same output. | Asymmetric outcomes are possible. Rationality requires only that each player best-responds to their beliefs. Without a causal or institutional link, players may hold differing beliefs (e.g., one believes the other will cooperate), allowing asymmetric choices even under symmetry and common knowledge of rationality. |

  #### (3) Cruxes  
  The following sub-questions are pivotal; settling any would compel at least one side to revise their position.  

  - **Crux 1: Non-causal dependence**  
    Can identical reasoning processes in identical situations ground non-causal dependence (i.e., guarantee identical choices without causal links)?  
    - *Stakes*: If yes, superrationality is strengthened; if no, standard game theory is validated.  

  - **Crux 2: Symmetry requirements**  
    What must symmetry include beyond payoffs and information (e.g., computational capacities, decision procedures)? How much work does each element do?  
    - *Stakes*: If strict identity in decision procedures is necessary and sufficient, superrationality applies narrowly; if not, it may collapse.  

  - **Crux 3: Robustness to perturbations**  
    Is the superrationalist recommendation robust to small asymmetries (e.g., payoff differences) or a small probability of irrationality? If not, does this undermine superrationality?  
    - *Stakes*: Non-robustness implies superrationality is fragile and inapplicable to real-world deviations from ideal symmetry.  

  - **Crux 4: Implications for related problems**  
    Does superrationality entail:  
    - (a) One-boxing in Newcomb's problem?  
    - (b) Cooperation in an asymmetric Prisoner's Dilemma?  
    - (c) Choosing the Pareto-optimal equilibrium in Hi-Lo via team reasoning?  
    - *Stakes*: If superrationality implies (a)–(c), it may overextend; if it does not, it may be inconsistent.  

  #### (4) Tests and Predictions  
  For each crux, a test case is specified. Predictions are stated, along with what would count as a view-revising result.  

  | Crux | Test case | Superrationalist prediction | Standard game theorist prediction | Revision condition |
  |------|-----------|----------------------------|-----------------------------------|-------------------|
  | **1: Non-causal dependence** | Game against a known deterministic copy of oneself (e.g., identical algorithm with identical inputs). | Both players cooperate, as identical reasoning leads to identical choices, making cooperation rational. | Both players defect, as dominance prevails; identical reasoning does not negate dominance. | Superrationalist revises if both defect; standard game theorist revises if both cooperate *and* this is deemed rational. |
  | **2: Symmetry requirements** | Symmetric Prisoner's Dilemma modified by a small payoff asymmetry (e.g., Player 2 receives \(R + \epsilon\) for mutual cooperation, Player 1 receives \(R\)). | Cooperation is not rational; asymmetry breaks the condition for identical choices, so defection is rational. | Defection remains rational for both; the asymmetry does not affect Player 1’s dominance argument. | Superrationalist revises if cooperation is still recommended; standard game theorist has no revision. |
  | **3: Robustness to perturbations** | Symmetric Prisoner's Dilemma where each player believes the other is irrational with probability 1% (irrationality defined as cooperating unconditionally). | Cooperation remains rational; the high probability of mutual cooperation among rational players outweighs the risk. | Defection remains uniquely rational; dominance holds, and the 1% chance of irrationality does not justify cooperation. | Superrationalist revises if defection is recommended; standard game theorist revises if cooperation is deemed rational. |
  | **4a: Newcomb's problem** | Newcomb's problem with a reliable predictor. | One-boxing is rational; symmetry between choice and prediction implies taking one box maximizes expected payoff. | Two-boxing is rational; dominance dictates taking both boxes regardless of the prediction. | Superrationalist revises if two-boxing is recommended; standard game theorist revises if one-boxing is deemed rational. |
  | **4b: Asymmetric Prisoner's Dilemma** | Prisoner's Dilemma with asymmetric payoffs (e.g., Player 1’s \(T_1 > R_1 > P_1 > S_1\), Player 2’s \(T_2 > R_2 > P_2 > S_2\), but \(R_1 \neq R_2\), etc.). | Cooperation is not rational; asymmetry prevents identical reasoning, so defection is required. | Defection is rational for both; dominance still holds for each player. | Superrationalist revises if cooperation is recommended; standard game theorist has no revision. |
  | **4c: Hi-Lo game** | Hi-Lo game with two choices: A (payoff 10 each) or B (payoff 5 each) if matching; 0 otherwise. | Choosing A is rational; identical reasoning leads to the Pareto-optimal equilibrium. | Both (A,A) and (B,B) are rationalizable; salience or refinements may favor A, but game theory alone does not prescribe it. | Superrationalist revises if A is not chosen; standard game theorist does not revise unless superrationality forces a unique prescription.  

  **Assessment of verbal disagreements**: No part of the dispute is merely verbal. Terms like "dependence," "rational," and "identical situation" are fixed in the agreed claims: "dependence" is specified as causal or non-causal; "rational" is defined by the avoidance of strictly dominated acts (standard game theory) or identical reasoning leading to identical choices (superrationality); "identical situation" includes payoffs, information, and decision procedures. The residual disagreement is substantive, concerning whether non-causal dependence justifies ruling out asymmetric outcomes.
