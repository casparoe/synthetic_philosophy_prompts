prompt: |-
  I'm a PhD student in philosophy of mind, and I've been trying to get clear on something methodological that keeps coming up in our reading group: when is a thought experiment doing genuine work, and when is it just an intuition pump in the pejorative sense — persuading without earning it? I've got verdicts on a bunch of cases and I want to know whether there's a principle behind them, or whether I'm just being inconsistent.

  Here are my verdicts:

  - Thomson's violinist: legitimate. It isolates a specific feature (bodily autonomy versus right to life) and doesn't seem to smuggle in the conclusion.
  - Searle's Chinese room: not legitimate. It gets its force from imagining a little man in a room and then insisting there's no understanding — but the systems reply says the man isn't the whole system, and the setup makes that reply feel like a dodge when it shouldn't be.
  - Jackson's Mary: legitimate, even though I'm a physicalist. It forces me to explain what Mary learns, and that's productive even if I think there's an answer.
  - Chalmers' zombie: not legitimate. It just asserts that a physical duplicate could lack consciousness and then concludes consciousness is non-physical. The thought experiment is the conclusion.
  - Parfit's teletransporter: legitimate. It separates psychological continuity from bodily continuity and makes me feel the pull of the former without forcing the answer.
  - Block's Chinese nation: I go back and forth. On one hand it seems like the Chinese room scaled up; on the other, it makes vivid the claim that functional organisation alone can't suffice for consciousness, and that claim might be right even if the thought experiment is question-begging.
  - Thomson's people-seeds: legitimate, but I can't articulate why it feels different from the violinist even though they're doing structurally similar work.
  - Nozick's experience machine: legitimate. It isolates a single variable — experienced versus actual contact with reality — and the answer isn't forced.

  The pair that bothers me most is Mary and zombies. They're both about whether physicalism can account for consciousness, and both ask us to imagine something a physicalist might deny is possible. But Mary feels like fair play and zombies feel like cheating, and I can't say why. I've only just realised how much this nags at me.

  Is there a principle — or a small set of criteria — that sorts these cases correctly? And if it forces me to revise some of my verdicts, which ones should I give up? Also, what does the principle say about a case I haven't mentioned — say, Davidson's swampman? I genuinely don't know what to think about that one, and I'd rather not have my verdict on it be driven by whatever mood I'm in.
reasoning: |-
  Okay, the user is a PhD student in philosophy of mind struggling with a methodological question about thought experiments. They've provided their verdicts on several famous cases and are particularly troubled by the apparent inconsistency between accepting Jackson's Mary argument while rejecting Chalmers' zombie argument. Both target physicalism about consciousness, yet they feel Mary is legitimate while zombies are not. They're seeking a principled way to distinguish genuinely productive thought experiments from mere "intuition pumps."

  Hmm, their examples cover a wide range: Thomson's violinist (abortion ethics), Searle's Chinese room (AI consciousness), Jackson's Mary (qualia), Chalmers' zombie (physicalism), Parfit's teletransporter (personal identity), Block's Chinese nation (functionalism), Thomson's people-seeds (abortion again), and Nozick's experience machine (value of reality). The Mary/zombie tension seems to be the core concern. 

  I notice they're self-aware about potential inconsistency - that's good scholarly instinct. Their description suggests they might be conflating two issues: whether a thought experiment is dialectically fair versus whether it's philosophically sound. Mary feels "fair" because it presents an epistemic gap (what Mary learns) without directly asserting an ontological one, whereas zombies begin by assuming ontological possibility (conceivability entails possibility) which physicalists reject. 

  The user also mentions Davidson's swampman as an unresolved case - that's interesting because it tests semantic externalism versus first-person identity. I should address that too since they explicitly asked. 

  Their struggle with Block's Chinese nation is telling - it's structurally similar to Searle's Chinese room but they're more sympathetic, perhaps because Block's version highlights scale/complexity as a red herring. That suggests their criteria might include whether the thought experiment controls for irrelevant factors. 

  What they really need is diagnostic tools, not just verdicts. A good framework should: 
  1) Explain why Mary feels productive (it forces physicalists to refine their position - e.g., representationalism) while zombies feel circular (it assumes what it proves)
  2) Resolve their people-seeds/violinist unease (both are autonomy arguments, but people-seeds risks equivocating on "invasion" in a way violinist avoids)
  3) Handle swampman by showing how it tests the necessity of historical properties

  The key might be distinguishing between thought experiments that reveal conceptual tensions versus those that presuppose contested metaphysical premises. Also worth considering whether the intuition appealed to is pre-theoretical (like Nozick's machine) or theory-laden (like zombies). 

  ...I should probably structure this around three criteria: dialectical fairness, control of variables, and openness. Their Mary verdict stays, zombies go, Chinese room gets upgraded to "flawed but useful" if seen as challenging functionalism rather than disproving it. Swampman would be legitimate on my view - it isolates history from current state. 

  Most importantly, they need permission to revise their Block verdict; feeling torn there is rational because it's purposefully hyperbolic. Might suggest they read Dennett's critique of intuition pumps alongside this.
answer: |-
  Your struggle reveals a deep methodological insight: the difference often lies in **dialectical fairness, variable control, and cognitive openness**. Here's a principled framework derived from your intuitions, with revised verdicts where needed:

  ### Core Criteria for Legitimate Thought Experiments
  1.  **Dialectical Fairness:** Does the setup avoid *presupposing* the contested conclusion? Does it allow rival positions to engage without begging the question?
  2.  **Variable Isolation:** Does it cleanly isolate the target variable(s) while controlling for confounding factors or irrelevant emotional salience?
  3.  **Cognitive Openness:** Does it generate a *puzzle* or *tension* that demands explanation, rather than merely asserting an intuition as decisive?

  ### Applying the Framework to Your Cases (Revised Verdicts)
  -   **Thomson's Violinist:** **Legitimate.** Isolates bodily autonomy vs. life-saving obligation *without* assuming abortion is analogous (the argument is for permissibility *if* the analogy holds). Fair to opponents.
  -   **Searle's Chinese Room:** **Flawed but not wholly illegitimate.** *Problem:* Fails dialectical fairness. Searle stipulates the man "follows syntax" but "has no understanding," dismissing the systems reply by fiat. *Salvage:* It *productively* challenges functionalism by making vivid the intuition that syntax ≠ semantics.
  -   **Jackson's Mary:** **Legitimate.** Isolates the epistemic gap (knowledge of physical facts vs. phenomenal knowledge). It *creates a puzzle* physicalists must solve (e.g., via representationalism, ability hypothesis), without presupposing dualism.
  -   **Chalmers' Zombie:** **Illegitimate (pejorative pump).** *Violates Dialectical Fairness:* It *assumes* the conceivability of zombies entails metaphysical possibility – the *core premise* physicalists reject. The thought experiment *is* the assertion of the anti-physicalist conclusion disguised as an intuition. No genuine puzzle is generated for the dualist.
  -   **Parfit's Teletransporter:** **Legitimate.** Isolates psychological continuity from physical/bodily continuity. Creates genuine tension about identity criteria without forcing an answer (psychological vs. bodily theorists both engage with the case).
  -   **Block's Chinese Nation:** **Illegitimate (pejorative pump).** *Violates Dialectical Fairness:* Like Searle, it *stipulates* the absence of consciousness in the system ("no consciousness would appear") while describing functional isomorphism. It *assumes* functionalism is false to argue it's false. The "vividness" is emotional, not probative.
  -   **Thomson's People-Seeds:** **Legitimate, but weaker than Violinist.** Isolates the concept of "due diligence" in preventing invasion vs. violation of bodily autonomy once invasion occurs. The "seed" analogy *does* risk smuggling in conclusions (is it *really* an "invader"?), making it slightly less clean than the violinist but still creating a puzzle about responsibility and boundaries.
  -   **Nozick's Experience Machine:** **Legitimate.** Cleanly isolates intrinsic value of contact with reality vs. subjective experience. The intuition against plugging in creates a puzzle about value theory without presupposing its answer.

  ### Resolving the Mary vs. Zombie Tension
  *   **Mary:** Presents an *epistemic gap* ("What does Mary *learn*?"). Physicalists can (and do) grant the *conceivability* of Mary's scenario while offering explanations (e.g., new *modes of presentation*, *abilities*, or *recognitional concepts*). It challenges physicalism to *account* for something.
  *   **Zombie:** Presupposes a *metaphysical gap* ("This is *possible*"). It doesn't challenge physicalism to explain something; it *asserts* physicalism is false by assuming the falsity of physicalism's core claim (that the physical facts fix *all* facts, including consciousness). Physicalists reject the starting premise. **The difference is between posing a *challenge* (Mary) and *declaring victory* (Zombie).**

  ### Davidson's Swampman
  *   **Scenario:** Davidson is spontaneously assembled from a swamp by lightning, molecule-for-molecule identical to Davidson just before the event. Does he have thoughts, beliefs, or refer to things (like "water") meaningfully?
  *   **Verdict via Framework:** **Legitimate.**
      *   **Dialectical Fairness:** It doesn't presuppose externalism or internalism. It *tests* the necessity of historical/causal connections for meaning and mental content. An externalist (like Davidson) *must* deny Swampman has content initially; an internalist/functionalist might affirm it. Both positions engage.
      *   **Variable Isolation:** Isolates intrinsic physical/functional state from historical/causal origins.
      *   **Cognitive Openness:** Creates a genuine tension: Swampman *acts* like he has beliefs, but *lacks* the history. This forces refinement of theories of content (e.g., is causal history essential? Is functional role sufficient?).

  ### Revised Verdict Summary & Recommendations
  *   **Revise Down:** Searle (Flawed but useful heuristic, not decisive), Block (Illegitimate pump), Chalmers (Illegitimate pump).
  *   **Maintain:** Thomson (both), Mary, Parfit, Nozick.
  *   **New:** Swampman (Legitimate).
  *   **Key Principle:** **A thought experiment is illegitimate (a pejorative intuition pump) when its persuasive force relies *primarily* on presupposing a core, contested metaphysical premise necessary for the intended conclusion, thereby preventing dialectical engagement from the rival position.** Zombies and the Chinese Nation fail this test; Mary and Swampman pass.

  This framework explains your intuitive distinction between Mary and zombies: Mary exploits an epistemic gap *within* the physicalist framework as a challenge, while zombies assert a metaphysical gap *against* the physicalist framework as a premise. Stick with your Mary intuition and your zombie skepticism – they reflect sound methodological judgment. Your unease with Block was warranted; it functions similarly to Searle but amplifies the question-begging through scale. Swampman is a productive test case for theories of mental content.
