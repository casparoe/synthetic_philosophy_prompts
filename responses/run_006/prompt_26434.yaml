prompt: |-
  I'm a grad student in political science and I've been roped into giving a guest lecture on the Condorcet jury theorem to a mixed undergrad class — mostly PPE and econ majors, some of whom have had a bit of stats but plenty who haven't. It's a fifty-minute slot and I'm supposed to make them understand what the theorem actually says, why its conditions are so fragile, and why it doesn't straightforwardly justify democracy even though people keep citing it that way. The prof warned me that last years guest lecturer just threw the inequality on the board and lost everyone by minute ten.

  Don't explain the theorem to me — I know it. I need a teaching plan: the sequence, the dependencies, the one example that carries it all. What has to come first and why? I'm worried about a few specific misconceptions: students thinking it's just the "wisdom of crowds" thing, students not seeing why independence matters (and how weirdly demanding that condition actually is), and students walking away thinking "Condorcet proved democracy works." Where exactly in the fifty minutes should I head each of these off? Also, what should I openly refuse to get into at this level, and what's a good check at the end to see if they actually got it rather than just nodding along?

  Give me your plan in these sections: (1) Dependency structure — what needs to be in place before what, in order (~150 words). (2) The carrying example — the one scenario to build everything around, what it needs and what it must avoid (~100 words). (3) Misconception map — the three or four main ones, when each is likely to form, and exactly where in the sequence to defuse each (~200 words). (4) What to leave out — things to explicitly say we're skipping and why (~75 words). (5) The exit check — one question or task that would tell me whether they understood the theorem rather than just the vibes (~50 words).
reasoning: |-
  Okay, the user is a grad student in political science preparing a guest lecture on the Condorcet jury theorem for an undergrad class with mixed backgrounds. They need a teaching plan that avoids technical overload while addressing common misconceptions. 

  First, let's unpack their core needs: They want to prevent students from oversimplifying the theorem as "proof" of democracy's effectiveness. The previous lecturer failed by jumping into math too early. The audience includes PPE/econ majors with uneven stats exposure — so conceptual clarity is paramount.

  Hmm, the dependency structure is crucial. Must start with voting intuition before any formalism. The carrying example should feel immediate — like a jury decision — but also scalable to show fragility. Independence is the landmine here; students won't grasp why it's unrealistic unless shown through a concrete chain reaction.

  For misconceptions: The "wisdom of crowds" confusion will arise immediately if I don't contrast binary choice vs. estimation upfront. The democracy justification myth needs preemptive smashing during the "so what?" phase. And independence... ah, that requires contaminating the clean example with something visceral, like peer pressure or media bubbles.

  What to omit? Definitely proofs and Bayesian updating. Also, extensions like heterogeneous competence can wait. The exit check must force application — not regurgitation — of the independence condition. A courtroom scenario with witness tampering would test if they see how real-world voting violates the theorem's assumptions.

  ...Wait, did the user hint at political science relevance? Should emphasize how CJT gets weaponized in policy debates despite its fragility. But keep the focus pedagogical: Their job is to equip students to critique such arguments, not settle them.
answer: |-
  Here’s a focused 50-minute teaching plan designed for clarity and misconception prevention:

  ### (1) Dependency Structure (~150 words)  
  **Order:** Start with **voting intuition** ("How do groups make decisions?") → Introduce **binary choice** (e.g., "Guilty/innocent") → Define **individual competence** *p > 0.5* (stress: better than a coin flip!) → **Group competence**: Show majority rule amplifies *p* with 3 voters (simple math) → **Scale up**: Use the *n* formula to show *P* → 1 as *n* → ∞ → **Conditions slide**: Explicitly list (binary choice, *p* > 0.5, independence, identical *p*) → **Fragility demo**: Break independence → **Implications**: Why ≠ "proof" of democracy.  
  **Why:** Builds from concrete (small jury) to abstract (theorem). Conditions MUST follow the "wow" moment of scaling up, so fragility hits harder. Math stays minimal until after intuition is set.

  ### (2) The Carrying Example (~100 words)  
  **Scenario:** A jury deciding "guilty/innocent."  
  **Needs:** Binary choice (guilt), competence (*p* = 0.6 per juror), small *n* first (3 jurors, show 2/3 correct beats 1/3), scalable to large *n*.  
  **Avoids:** Continuous estimates (no "wisdom of crowds" confusion), avoids policy/ideology (focus on factual guilt).  
  **Fragility Demo:** Show how one juror overhearing another's guess (*breaking independence*) can cascade errors (e.g., first juror wrong, others follow = group error even if *p* > 0.5).

  ### (3) Misconception Map (~200 words)  
  1.  **"It’s just wisdom of crowds (estimation)."**  
      *   **When:** Likely at the start.  
      *   **Defuse:** **Minute 2** – Contrast jury (binary truth: guilty/innocent) with guessing cow weight (continuous estimate). Stress CJT requires *one right answer*.  

  2.  **"Independence isn’t a big deal."**  
      *   **When:** After stating conditions, before fragility demo.  
      *   **Defuse:** **Minute 25** – Use the jury example: "What if Juror 2 hears Juror 1 whisper 'guilty'? Even if Juror 2 thinks 'innocent', they might doubt themselves." Show cascading error calculation. Ask: "Is *your* vote ever influenced by polls, friends, or media?"  

  3.  **"Condorcet proved democracy works."**  
      *   **When:** After showing *P* → 1.  
      *   **Defuse:** **Minute 35** – Hammer: CJT requires unrealistic conditions. "Real votes: Are choices binary? (No – many candidates). Is *p* > 0.5 for all? (Doubtful – complex issues). Independence? (Rare – information networks). CJT shows *idealized* competence, not real-world democracy."  

  4.  **"Competence just means being smart."**  
      *   **When:** When defining *p*.  
      *   **Defuse:** **Minute 15** – Clarify: *p* is *task-specific* probability of being *correct* on *this* issue. "A genius astrophysicist isn't necessarily *p* > 0.5 on tax policy."

  ### (4) What to Leave Out (~75 words)  
  *   **Formal Proof:** Skip the limit derivation or combinatorics. Say: "The math shows the probability grows, but we accept that result."  
  *   **Heterogeneous Competence:** Avoid varying *p*<sub>i</sub>. State: "The theorem assumes equal skill; relaxing this complicates things massively."  
  *   **Bayesian Updating:** Don’t frame jurors as updating priors. Keep *p* as innate (if unrealistic) task competence.  
  *   **Extensions/History:** No time for Condorcet paradox or other theorems. Focus solely on CJT.

  ### (5) The Exit Check (~50 words)  
  **Question:** *"A mayor cites CJT to argue her landslide election proves the voters were probably correct. What’s wrong with this?"*  
  **What reveals understanding:**  
  *   Recognizes elections aren’t binary choices.  
  *   Questions if *p* > 0.5 for all voters on the *correct* choice.  
  *   Notes lack of independence (campaigns influence voters).  
  *   Rejects equating majority size with correctness *per CJT*.

  **Timing Buffer:** Build in 5 mins for Q&A at the end. Good luck! This sequence turns fragility from an afterthought into the main reveal.
