  We are going to translate Goodman's new riddle of induction into the vocabulary of machine learning.

  **The Setup in Goodman's Terms:**

  Goodman's riddle is about the problem of induction. He introduces two predicates:
  - **Grue**: An object is grue if it is observed before time t and is green, or it is not observed before t and is blue.
  - **Bleen**: An object is bleen if it is observed before time t and is blue, or it is not observed before t and green.

  The standard predicates are:
  - **Green**: An object is green (regardless of time).
  - **Blue**: An object is blue (regardless of time).

  Now, suppose we have a set of emeralds observed before time t, and all of them are green. Then, according to our usual inductive practice, we would predict that emeralds observed after time t will also be green. However, note that all the emeralds observed so far are also grue (because they were observed before t and are green). So, by the same token, we might predict that emeralds observed after time t will be grue, which means they will be blue (since after t, grue means blue).

  The problem is: why do we prefer the hypothesis that emeralds are green (and hence remain green) over the hypothesis that they are grue (and hence turn blue after t)?

  **Translation into Machine Learning Vocabulary:**

  We are going to set up a learning problem.

  1. **The learning task:** We want to predict the color of emeralds based on the time of observation. Specifically, we are given a dataset of emeralds with two features: the time of observation (relative to t) and the color (green or blue). We are to learn a function that maps the time (before t or after t) to the color.

  2. **The data:**
     - Let the time feature be a binary variable: 0 for "before t" and 1 for "after t".
     - The label (color) is also binary: 0 for green and 1 for blue.
     - Our training data consists of all emeralds observed before t (so time=0). In the training set, every emerald has color=0 (green). So we have a set of n examples: (x_i=0, y_i=0) for i=1..n.

  3. **The two rival hypotheses (models):**
     - Hypothesis H1 (the "green" hypothesis): The color is always green, regardless of time. So the model is: 
          f1(x) = 0 for all x (i.e., green for both time=0 and time=1).
     - Hypothesis H2 (the "grue" hypothesis): The color is green before t and blue after t. So the model is:
          f2(x) = 0 if x=0 (before t), and 1 if x=1 (after t).

     Note: We could also have the "blue" hypothesis (always blue) and the "bleen" hypothesis (blue before t and green after t). But the training data (all green before t) rules out the blue and bleen hypotheses? Actually, note that the training data (all green before t) is consistent with both H1 and H2. The bleen hypothesis would have been: blue before t and green after t. But the training data shows green before t, so bleen is inconsistent. Similarly, the always blue hypothesis is inconsistent. So we focus on H1 and H2.

  4. **The evidence they share:** Both hypotheses are consistent with the training data. For every training example (x_i=0, y_i=0), both models predict correctly: 
     - H1: f1(0)=0 (correct)
     - H2: f2(0)=0 (correct)

     Therefore, the training error for both models is 0.

  5. **The prediction for future data (after time t):** 
     - H1 predicts that an emerald observed after t (x=1) will be green (y=0).
     - H2 predicts that an emerald observed after t (x=1) will be blue (y=1).

  6. **Model selection:** We have two models that are equally good on the training data (both have 0 training error). How do we choose which one to use for prediction on future data (after t)? The problem is that without additional criteria, we cannot choose.

  7. **What Goodman takes the riddle to establish:** Goodman argues that the problem is not just that the data underdetermines the theory (which is a common problem in induction) but that we need a way to distinguish between "projectible" and "non-projectible" predicates. We prefer "green" because it is a well-entrenched predicate (it has been used successfully in many past inductions) and because "grue" is defined in a way that makes reference to a specific time t (which Goodman considers artificial). The riddle establishes that the rules of induction must depend on the language or the predicates we use, and that purely syntactic or formal rules (like those in confirmation theory) are insufficient. We need to look at the history of the use of the predicates.

  **Residue Report:**

  Now, we break down which parts translate cleanly, which with distortion, and which not at all.

  1. **The notion of a projectible predicate:**
     - **Clean translation?** In ML, we have the concept of a "feature representation" and we often impose a prior that favors simpler or smoother functions. A projectible predicate might be one that leads to a model that generalizes well. However, in the grue example, both hypotheses are equally simple in terms of the number of parameters or the structure of the decision boundary. H1 is constant, H2 is a step function. Without additional context, both are simple. The issue is that "grue" is defined in a way that is time-dependent and seems ad hoc. In ML, we might capture this by the feature representation: if we only have the feature "time" (with a fixed t) then both models are equally simple. But if we have a feature "is after t", then H2 is a simple step function on that feature, while H1 is a constant. However, we might have a prior that disfavors features that are tied to a specific time point? This is not standard. Alternatively, we might note that "grue" is a disjunctive predicate (in terms of the base features: color and time) and that disjunctive predicates are often considered less projectible. In ML, we often use regularization to avoid overfitting to such disjunctions. However, note that H2 is not more complex than H1 in terms of the VC dimension or Rademacher complexity in the given feature space (if we have a binary feature for time). They both have the same complexity. So the translation is not entirely clean. We might say that projectibility is related to the alignment of the feature representation with the true underlying structure? But that's circular because we don't know the true structure.

     - **Distortion:** In ML, we often rely on a fixed feature representation and then use regularization to control complexity. But the projectibility of a predicate seems to depend on the history of its use (entrenchment) and how it is defined, which are not typically part of the ML framework. So the notion of projectibility requires an external criterion (like entrenchment) that is not captured by the formal properties of the model.

  2. **Goodman's appeal to the entrenchment of predicates:**
     - **Translation?** In ML, we often use pre-defined features that are chosen by the engineer. The entrenchment of a predicate (like "green") might be reflected in the fact that we have a lot of prior data and models that have successfully used the feature "green". We might incorporate this as a prior that favors models using entrenched features. However, standard ML does not typically include a mechanism for tracking the history of feature usage. We do have Bayesian methods where we can set a prior over models. We could set a higher prior for models that use features that have been successful in the past. But this is not a standard part of the ML vocabulary.

     - **Distortion or missing?** The concept of entrenchment is largely missing in standard ML. We do not have a built-in way to assign a prior to a feature based on its historical usage in successful predictions. We might approximate it by having a meta-learning system that learns feature priors from multiple tasks, but that is beyond the typical ML vocabulary. So this part does not translate cleanly.

  3. **The claim that the riddle raises a question beyond underdetermination:**
     - **Translation?** Underdetermination is common in ML: multiple models can fit the training data equally well. The standard response is to use regularization, model selection criteria (like AIC, BIC), or validation data. However, in this case, we don't have held-out data from after t. So we are forced to choose without any data from the future. The riddle goes beyond underdetermination because both hypotheses are equally supported by the data and equally simple in a formal sense. The difference is that one hypothesis uses a predicate ("green") that we have used in many successful inductions, and the other ("grue") is a new and artificial predicate.

     - **Clean?** The underdetermination is clear in ML. The extra element is the appeal to entrenchment and the artificiality of the "grue" predicate. Since ML doesn't have a standard way to incorporate entrenchment, this extra element does not translate cleanly. We might say that the ML framework is missing a component that captures the history of feature usage.

  4. **The claim that no purely formal confirmation theory settles it:**
     - **Translation?** In ML, we have formal methods for model selection (like regularization, cross-validation, and complexity measures). However, without any data from after t, we cannot use cross-validation. We can use complexity measures: both models have the same number of parameters (if we consider H1 as a constant and H2 as a step function on a binary feature, they are both simple). So formal methods might not break the tie. Goodman's point is that a purely formal theory (one that does not consider the meaning of the predicates or their history) cannot resolve the riddle. This translates well: without incorporating some prior about which features are more natural (which might be non-formal, based on our experience), we cannot choose.

     - **Clean?** This part translates cleanly: we see that in ML, if we rely solely on formal complexity measures and the training data, we cannot choose between H1 and H2. We need additional prior knowledge.

  **Verdict on the residue:**

  The ML vocabulary captures the underdetermination and the need for regularization or prior knowledge. However, it does not have a built-in mechanism for handling the entrenchment of predicates or for incorporating the history of feature usage. This means that the ML framework, as typically presented, is inadequate to fully resolve Goodman's riddle without additional components. The residue is that ML needs to incorporate a way to assign priors based on the past success of features (or predicates) in other related tasks. This is not standard, but it is an area of current research (e.g., meta-learning, transfer learning, and feature learning).

  However, note that in practice, ML engineers do choose features based on domain knowledge and past experience. So the entrenchment is handled at the level of the practitioner. But within the formal framework, it is missing.

  Therefore, the translation shows that Goodman's worry is substantive: without an account of projectibility (which requires more than formal structure and includes the history of usage), the learning problem is underdetermined in a way that cannot be resolved by standard formal methods.

  **What would change my mind?**

  If someone could show that within the standard ML framework (without introducing historical entrenchment) there is a formal way to break the tie between H1 and H2 that is both justifiable and leads to the selection of H1 (the green hypothesis), then I might conclude that Goodman's riddle is less substantive. For instance:

  - If we can show that the feature representation for "grue" is inherently more complex (in a formal, ahistorical sense) than "green", then we might break the tie. But note: in the given feature space (with time as a feature), both models are equally simple.

  - Alternatively, if we use a different feature representation: for example, if we represent the color as a continuous spectrum, then the green hypothesis might be a constant function over time and wavelength, while the grue hypothesis would be a discontinuous function in the wavelength-time space? But that requires a richer feature space. Goodman's riddle is set up with the given predicates.

  Another consideration: if we use a Bayesian approach and set a prior that favors models with fewer dependencies (so H1 has no dependency on time, while H2 does), we might break the tie. But note that H1 is independent of time, and H2 depends on time. So we might assign a higher prior to H1 because it is a constant function. This is a standard approach: we often prefer simpler models. However, Goodman might object that this is a formal criterion and that it doesn't capture the full story of projectibility (because we could define a new predicate that makes H1 look complex and H2 look simple). But in the given feature space, the prior on model complexity would favor H1.

  However, note that in ML, we can choose the feature representation. If we had chosen to represent the data with the feature "grue" and "bleen" as primitive, then the constant grue hypothesis might be simpler? This is the language dependence that Goodman emphasizes. So the prior on model complexity is relative to the feature representation.

  Therefore, to change my mind, one would have to show that the standard ML framework (with a fixed feature representation and a prior on model complexity) can resolve the riddle without appealing to entrenchment. But note that without a fixed feature representation, we are back to the problem of choosing the right representation. And that choice is often guided by past success (entrenchment). So the residue remains.

  **Where failure is most likely:**

  The most likely point of failure in my reasoning is in the assessment of model complexity. If we consider the complexity of the hypotheses in terms of their description length in a universal language (like in Kolmogorov complexity), then "green" might have a shorter description than "grue" because "grue" requires specifying the time t. However, note that in the problem, t is fixed. But in a universal language, we would have to encode t, which might make the description of H2 longer. This would break the tie. However, this approach is formal and ahistorical. But Goodman might counter that we can define a language in which "grue" is primitive and then "green" becomes complex. So the problem of language dependence remains.

  Therefore, I think the residue stands: the ML vocabulary, without incorporating entrenchment or without fixing the feature representation a priori (which is typically done by the engineer based on entrenched practice), cannot resolve the riddle. And that is exactly Goodman's point.
answer: |-
  ### Faithful Translation of Goodman's Riddle into ML Vocabulary

  #### Setup of the Learning Problem
  - **Task**: Binary classification (predict color of emeralds: green or blue).  
  - **Feature Space**: Time (relative to a fixed future timestamp `t`), binarized as `pre-t` (observed before `t`) or `post-t` (observed at/after `t`).  
  - **Training Data**: All observed emeralds are from `pre-t` and labeled "green".  
  - **Held-Out Data**: Future emeralds from `post-t` (unobserved at training time).  
  - **Model Class**: Hypotheses mapping `pre-t`/`post-t` to colors.  
  - **Goal**: Select a hypothesis that generalizes to `post-t` data.  

  #### Rival Hypotheses and Shared Evidence
  - **Hypothesis H₁ (Green)**:  
    - \( f_1(\text{time}) = \begin{cases} \text{green} & \text{if pre-t} \\ \text{green} & \text{if post-t} \end{cases} \)  
    - **Inductive Bias**: Color is time-invariant.  
  - **Hypothesis H₂ (Grue)**:  
    - \( f_2(\text{time}) = \begin{cases} \text{green} & \text{if pre-t} \\ \text{blue} & \text{if post-t} \end{cases} \)  
    - **Inductive Bias**: Color shifts at `t` (disjunctive rule tied to `t`).  
  - **Shared Evidence**:  
    - Both achieve **0 training error** on `pre-t` data (all predict "green" correctly).  
    - Both fit the training data perfectly—no overfitting.  
    - **No held-out data** from `post-t` exists to test generalization.  

  #### What Goodman's Riddle Establishes  
  Goodman argues that:  
  1. **Underdetermination is insufficient**: Both hypotheses are equally consistent with training data and have similar complexity (e.g., both are simple decision rules).  
  2. **Projectibility is key**: Only "green" is *projectible* (suitable for induction), while "grue" is not.  
  3. **Entrenchment resolves the riddle**: "Green" is entrenched (historically used/predictively successful), while "grue" is artificial and novel.  
  4. **No formal solution**: Purely syntactic/model-theoretic criteria (e.g., simplicity, Occam’s razor) cannot distinguish H₁ and H₂. The riddle requires **pragmatic, historical context**.  

  ---

  ### Residue Report: What Translates, What Distorts, What Is Missing  

  #### Clean Translations  
  1. **Underdetermination by data**:  
     - **ML counterpart**: Multiple models (H₁, H₂) achieve 0 training error. Standard issue in model selection.  
     - **Fidelity**: Perfect—both hypotheses are in the hypothesis space and fit training data.  
  2. **Generalization error as the core challenge**:  
     - **ML counterpart**: Held-out error on `post-t` data distinguishes H₁ (low error if green persists) from H₂ (high error if green persists).  
     - **Fidelity**: Faithful—Goodman’s worry is about *future* predictions.  
  3. **Inductive bias as a necessary tool**:  
     - **ML counterpart**: Priors/regularizers must favor "sensible" hypotheses (e.g., time-invariance).  
     - **Fidelity**: Clean—Goodman agrees bias is essential but argues it must be grounded in history.  

  #### Translations with Distortion  
  1. **Projectible predicates**:  
     - **ML attempt**: Translate as "features permitting low-complexity generalization." H₁ is simpler (constant function) vs. H₂ (time-dependent).  
     - **Distortion**:  
       - In ML, complexity is syntactic (e.g., VC dimension). H₂ is not inherently more complex—it’s a step function, often low-complexity.  
       - Goodman’s projectibility is **semantic and historical** ("green" is natural; "grue" is disjunctive and parasitic on "green"). ML lacks machinery to formalize this.  
     - **What bends**: Projectibility reduces to algorithmic complexity, losing Goodman’s emphasis on predicate *history* and *language-dependence*.  
  2. **Goodman’s beyond-underdetermination claim**:  
     - **ML attempt**: Underdetermination is routine (e.g., overparametrized models). Use validation data or complexity penalties.  
     - **Distortion**:  
       - Goodman says the riddle is **deeper**—even with infinite `pre-t` data, H₁ and H₂ are indistinguishable *without* entrenchment.  
       - In ML, held-out data from `post-t` would resolve this, but Goodman denies such data exists *by construction*.  
     - **What bends**: ML assumes data can resolve underdetermination; Goodman argues data from `post-t` is *irrelevant* to justifying induction *now*.  

  #### No Counterpart in ML  
  1. **Entrenchment of predicates**:  
     - **Goodman’s view**: "Green" is preferable because it is entrenched—a predicate with a history of successful use.  
     - **ML gap**: No concept of **feature/predicate history**. ML priors are static (e.g., Gaussian priors), not evolving with predicate usage across tasks.  
  2. **No purely formal solution**:  
     - **Goodman’s view**: Syntax alone (e.g., simplicity, logic) cannot favor H₁ over H₂.  
     - **ML gap**: ML relies on formal tools (e.g., regularization, cross-validation). These fail here:  
       - **Complexity**: H₁ (constant) and H₂ (step function) have identical complexity in binary feature space.  
       - **Validation**: No `post-t` data exists.  
       - **Bayesian priors**: A prior favoring time-invariance (H₁) *works*, but this is a **substantive assumption**, not a formal necessity.  

  ---

  ### Verdict on the Residue  
  **Your ML framework is partially adequate but misses the historical-pragmatic core of the riddle.**  
  - **Where ML succeeds**: It frames underdetermination, generalization, and the need for inductive bias.  
  - **Where ML fails**: It lacks tools to handle **entrenchment** and **predicate projectibility** as historical phenomena.  
  - **Goodman’s worry is substantive**: The riddle exposes that induction relies on *contingent human practices* (e.g., using "green" for millennia). ML’s formal tools cannot resolve this alone—they implicitly inherit entrenched features from engineers.  

  **Root of the inadequacy**: ML treats features as given, but Goodman shows feature *choice* is grounded in successful history. Without encoding predicate entrenchment (e.g., as meta-priors across tasks), ML cannot justify preferring "green" over "grue" in a vacuum.  

  ---

  ### What Would Change My Mind  
  I would revise this verdict if:  
  1. **ML formalizes entrenchment**: An extension of ML incorporates dynamic feature priors based on historical success (e.g., "feature net utility" across past tasks). If this resolves the riddle *without* ad-hoc assumptions, Goodman’s challenge weakens.  
  2. **A purely formal solution emerges**: If someone proves that, for *any* predicate language, H₂-like hypotheses *always* have higher Kolmogorov complexity (or lose in minimum description length), then formal criteria suffice.  
  3. **Counterexample to projectibility**: If "grue" is shown to be projectible in a real ML task (e.g., predicting seasonal changes), the riddle loses force.  

  **Where failure is most likely**: In my claim that ML cannot handle entrenchment. Meta-learning (e.g., MAML) or Bayesian hierarchical models *might* approximate this, but they require prior data from *analogous tasks*—which Goodman’s riddle denies. If you can simulate entrenchment via multi-task learning, the gap narrows.  

  **Honest conclusion**: Your vocabulary is powerful but incomplete. Goodman wins on the philosophy, but ML engineers sidestep the riddle by inheriting entrenched features from science. The residue reveals a dependency you cannot formalize—*yet*.
