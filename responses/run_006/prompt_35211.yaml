prompt: |-
  I recently joined an AI lab after years in philosophy of cognitive science, and I've found myself in the middle of a running argument about the frame problem that has become surprisingly personal — it's affecting how we allocate engineering time, and I have to take a position soon. One camp (mostly the engineers) holds that the frame problem is philosophically interesting but practically moot: modern systems with probabilistic reasoning, attention mechanisms, and learned relevance functions handle the challenge well enough, and the remaining difficulties are ordinary engineering. The other camp (mostly the philosophers and a few old-school symbolic AI people) holds that the frame problem was never really about engineering — it was about whether relevance can be captured in a formal system at all, and the fact that we now use systems whose relevance judgments are opaque and unprincipled doesn't constitute a solution.

  We've decided to try an adversarial collaboration to see what we can actually agree on and where our real disagreements lie. I'd like you to draft the document we should produce.

  Specifically, write the joint statement of an adversarial collaboration between these two camps on the frame problem. The document should include:

  1. A numbered list of claims both sides can sign — about the original formulation of the frame problem, about what any adequate solution must accomplish, and about what the formal results (computational intractability, the Yale shooting problem, and the like) do and don't establish.

  2. A disagreements table. For each row, give: the precise statement of the disagreement in neutral terms; the formulation each side would accept for its own position; and an indication of whether the disagreement is substantive or potentially terminological.

  3. A list of cruxes — sub-questions such that settling them would move at least one side. For each crux, describe a concrete case or piece of evidence both sides would agree bears on it, and state what each side would predict about that case.

  Please avoid summarizing the general literature; this should be the kind of document that comes from people who have already been arguing for a while and know the terrain. Go into the weeds — for instance, you might engage with specific proposals like the situation calculus, the distinction between the frame problem and the qualification problem, or the question of whether the problem is epistemic or metaphysical.

  End your response with a one-sentence summary of the residual disagreement, as the last line.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two camps on the frame problem.

  Background: 
  - Camp A (engineers): Frame problem is philosophically interesting but practically moot. Modern systems (probabilistic reasoning, attention mechanisms, learned relevance) handle it well enough; remaining issues are ordinary engineering.
  - Camp B (philosophers and symbolic AI): Frame problem was never just about engineering; it's about whether relevance can be formally captured at all. Current systems (opaque, unprincipled) do not constitute a solution.

  Goal: Produce a document with:
  1. A numbered list of agreed claims.
  2. A disagreements table (statement in neutral terms, each side's position, and whether substantive/terminological).
  3. A list of cruxes (sub-questions with concrete cases/evidence and predictions).

  Agreed Claims:
  Both sides can agree on the following:

  1. The frame problem, as originally formulated in the context of symbolic AI (e.g., McCarthy and Hayes, 1969), concerns the challenge of efficiently representing which properties of a situation change and which remain unchanged when an action is performed, without having to explicitly list all non-effects (the frame axioms).

  2. The frame problem is distinct from, though related to, the qualification problem (the problem of specifying all preconditions for an action) and the ramification problem (the problem of indirect effects).

  3. The frame problem has a technical aspect (the combinatorial explosion of frame axioms in naive representations) and a deeper epistemological aspect (the problem of relevance: how to determine what is relevant to a given action or inference).

  4. The technical aspect of the frame problem (combinatorial explosion) has been addressed by various formal methods in symbolic AI (e.g., frame axioms with monotonic solutions, non-monotonic logics, explanation closure, etc.), though these methods have limitations in expressiveness and computational complexity.

  5. The frame problem, in its broader sense, is not limited to symbolic systems; it arises in any system that must reason about change, including probabilistic and neural systems.

  6. Modern AI systems (e.g., deep learning with attention, probabilistic graphical models) can perform effectively in many real-world tasks without explicitly solving the frame problem in the classical symbolic sense.

  7. The frame problem, in its epistemological aspect, is related to the problem of common sense reasoning and the challenge of specifying what is relevant in an open-ended world.

  8. The frame problem is computationally intractable in the worst case for any system that must reason about all possible properties (due to the combinatorial nature of the world state).

  9. The Yale shooting problem and similar puzzles illustrate the challenges of non-monotonic reasoning and the potential for unintended consequences in formalizing change, but they do not by themselves prove the impossibility of formal solutions.

  Disagreements Table:

  We present disagreements in neutral terms, then each camp's position.

  | Neutral Statement of Disagreement | Camp A (Engineers) Position | Camp B (Philosophers/Symbolic) Position | Type of Disagreement |
  |-----------------------------------|-----------------------------|-----------------------------------------|----------------------|
  | Whether the frame problem, in its core epistemological challenge (the problem of relevance), has been solved by contemporary AI systems. | Camp A: The frame problem, as a practical engineering challenge, is effectively solved for the domains we care about by modern AI techniques (e.g., learned attention, probabilistic models). The remaining issues are incremental improvements. | Camp B: The frame problem, as an epistemological challenge about the nature of relevance, remains unsolved because current systems do not provide a formal, principled account of relevance; they rely on statistical patterns that are opaque and may fail in novel situations. | Substantive |
  | Whether the opacity of learned relevance functions in modern AI systems is a fundamental flaw or an acceptable engineering trade-off. | Camp A: Opacity (e.g., in deep learning) is an acceptable trade-off given the performance of these systems; interpretability is a separate goal that can be addressed as needed. | Camp B: Opacity is a fundamental flaw because it prevents us from understanding and guaranteeing the system's relevance judgments, which is at the heart of the frame problem. | Substantive |
  | Whether the frame problem is primarily an engineering challenge or a foundational philosophical problem. | Camp A: The frame problem is primarily an engineering challenge that we have largely overcome with modern techniques. | Camp B: The frame problem is a foundational philosophical problem about the nature of relevance and common sense, which engineering workarounds do not address at a principled level. | Substantive (but with potential terminological aspects regarding the scope of "frame problem") |
  | Whether formal systems (including symbolic and non-symbolic) can, in principle, capture relevance in an open world. | Camp A: Formal systems, especially those that learn from data, can capture relevance sufficiently for practical purposes. | Camp B: It is unclear whether any formal system can capture relevance in an open world because relevance is context-dependent and potentially unbounded. | Substantive |
  | Whether the frame problem is a special case of the more general problem of efficient representation and inference, or a distinct problem about the nature of change and relevance. | Camp A: The frame problem is a special case of the general problem of efficient representation and inference, which we are making continuous progress on. | Camp B: The frame problem is distinct because it highlights a fundamental gap in our ability to formalize common sense reasoning about change. | Potentially terminological (depending on how "distinct" is defined) |

  Cruxes:

  We list cruxes that, if settled, would move at least one side. For each, we describe a concrete case or evidence and the predictions of each camp.

  1. **Crux: Robustness to Novelty**
     - **Question:** Can a modern AI system (e.g., a state-of-the-art transformer with attention) correctly handle relevance in a novel, open-ended scenario that requires common sense reasoning about change, without having been trained on similar examples?
     - **Concrete Case:** Present a system with a scenario involving a chain of actions in a physical setting that includes an unusual disturbance (e.g., a gust of wind during a classic blocks world manipulation). The scenario is designed such that the disturbance is rare and not in the training data, but humans would easily recognize its relevance. Measure whether the system correctly infers the non-effects and effects (including indirect ones) without being explicitly trained on wind.
     - **Camp A Prediction:** With sufficient general training data and model scale, the system will handle this scenario correctly (or with acceptable error) because the learned attention mechanisms capture general patterns of relevance.
     - **Camp B Prediction:** The system will likely fail because it lacks a principled representation of relevance and relies on statistical regularities that do not hold for this novel case.

  2. **Crux: Formal Verifiability**
     - **Question:** Can we formally verify the relevance judgments of a learned system (e.g., a neural network) for a non-trivial domain?
     - **Concrete Case:** Take a neural network trained to predict state changes in a simulated physical environment (e.g., a robot manipulation task). Attempt to formally verify, using methods like neural network verification or interpretability tools, that the network's internal representation of relevance (e.g., which features it attends to) is correct for a set of test cases, including edge cases.
     - **Camp A Prediction:** With advances in interpretability and verification tools, we will be able to verify the relevance judgments for critical subsets of the system's behavior, at least in constrained domains.
     - **Camp B Prediction:** Formal verification will be infeasible or incomplete because the relevance judgments are embedded in high-dimensional, opaque representations that do not align with symbolic formalisms.

  3. **Crux: Scaling to Long Action Chains**
     - **Question:** Do modern systems (neural or probabilistic) exhibit combinatorial explosion in the frame problem when reasoning about long chains of actions?
     - **Concrete Case:** Test a system (e.g., a transformer or a probabilistic model) on a task requiring reasoning over a long sequence of actions (e.g., 50 steps) in a dynamic environment with many objects. Measure the accuracy and computational resources required as the chain length increases, compared to a symbolic system with non-monotonic reasoning.
     - **Camp A Prediction:** Modern systems (especially with attention) will scale sub-linearly or logarithmically with chain length due to learned abstractions, avoiding combinatorial explosion in practice.
     - **Camp B Prediction:** Without explicit representation of frame axioms, the system will either require exponentially growing resources (with the number of properties) or will make increasing errors as the chain lengthens due to the accumulation of unhandled indirect effects.

  4. **Crux: Human-like Common Sense**
     - **Question:** Can a system without a symbolic representation of relevance achieve human-like common sense reasoning about change?
     - **Concrete Case:** Build a system that must pass a test of common sense reasoning about change (e.g., a variant of the Winograd Schema Challenge involving change over time). Compare the performance of a purely neural system (trained on large-scale data) and a hybrid system with explicit symbolic reasoning about change.
     - **Camp A Prediction:** The neural system, trained on sufficient data, will perform as well as or better than the hybrid system.
     - **Camp B Prediction:** The hybrid system will outperform the neural system, especially on cases requiring explicit reasoning about non-effects and relevance.

  Residual Disagreement (one-sentence summary):
  The residual disagreement centers on whether the frame problem's core challenge — the principled formalization of relevance in open-ended reasoning — has been or can be solved by engineering methods that rely on learned, statistical patterns without explicit, verifiable representations.
answer: |-
  ### Adversarial Collaboration Statement: The Frame Problem in Contemporary AI

  **Preamble:**  
  We, representatives of the "engineering" and "philosophical/symbolic" perspectives, agree that the frame problem—originally articulated by McCarthy and Hayes (1969) as the challenge of efficiently representing change in formal systems—remains a focal point for debates about AI’s foundations and capabilities. While we concur on key historical and technical points, disagreements persist about its implications for modern AI. This document outlines shared ground, divergences, and testable cruxes to guide our lab’s resource allocation.  

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following:  

  1. **Original Formulation**: The frame problem arose in symbolic AI (e.g., situation calculus) as the challenge of avoiding combinatorial explosion when inferring which properties *do not* change after an action, without exhaustive frame axioms.  

  2. **Distinctness from Related Problems**:  
     - The frame problem (persistence of properties) is separate from the *qualification problem* (exhaustive preconditions for actions) and the *ramification problem* (indirect effects of actions).  
     - All three are subsets of the broader "relevance problem" (determining what is relevant to a given inference).  

  3. **Formal Results**:  
     - Computational intractability (e.g., worst-case complexity of relevance detection) is an established theoretical limit but does not preclude practical approximations.  
     - Puzzles like the Yale shooting problem demonstrate the brittleness of early non-monotonic solutions but do not prove the impossibility of formal approaches.  

  4. **Modern Systems**:  
     - Neural/statistical systems (e.g., transformers with attention) empirically handle many real-world inference tasks without explicit frame axioms.  
     - These systems "solve" the frame problem *instrumentally* (i.e., they function adequately in deployed contexts) but not necessarily *formally* (i.e., with verifiable guarantees).  

  5. **Core Challenge**: Any adequate solution must achieve *relevance-tracking*: dynamically identifying which properties are invariant/affected under actions in open-ended environments.  

  6. **Epistemic Scope**: The problem is fundamentally *epistemic* (about reasoning efficiency) not metaphysical (about the nature of change itself).  

  ---

  ### 2. Disagreements Table  
  | Neutral Statement of Disagreement | Engineering Camp Position | Philosophical/Symbolic Camp Position | Substantive/Terminological |  
  |-----------------------------------|----------------------------|---------------------------------------|----------------------------|  
  | Whether modern AI systems "solve" the frame problem. | "Learned relevance functions (e.g., attention) resolve the frame problem as an engineering challenge; residual errors reflect ordinary optimization trade-offs." | "Opacity in learned systems shifts the problem but does not solve it; relevance remains unprincipled and ungrounded in formal semantics." | Substantive |  
  | Whether relevance can be formalized. | "Relevance is tractable as a learning/optimization problem; no deeper formalization is needed for functional AI." | "Relevance is inherently unformalizable in closed systems due to the open-world nature of context; statistical approximations are ontologically inadequate." | Substantive |  
  | The role of opacity in relevance judgments. | "Opacity is acceptable if systems scale and generalize; interpretability is a separable enhancement." | "Opacity perpetuates the frame problem by masking how relevance is determined, preventing verification and trust." | Substantive |  
  | Whether the frame problem is inherently tied to symbolic representations. | "The problem transcends paradigms; solutions require scalable inference, not symbolic primitives." | "The problem originated in symbolic AI as a *formal* challenge; sub-symbolic systems sidestep it by forfeiting explicitness." | Terminological (divergent scoping of "frame problem") |  
  | The necessity of non-monotonic reasoning. | "Monotonicity is irrelevant; learned probabilistic models handle uncertainty without explicit non-monotonic rules." | "Non-monotonicity is essential to the frame problem’s core (e.g., default persistence), and its absence in learned systems limits rigorous reasoning." | Substantive |  

  ---

  ### 3. Cruxes  
  Settling these sub-questions would meaningfully update one or both camps’ positions. Each crux includes a testable case and predictions.  

  1. **Crux: Novelty Robustness**  
     - **Question**: Can a learned system generalize relevance judgments to actions/properties outside its training distribution?  
     - **Concrete Case**: Train a transformer on household tasks (e.g., stacking objects), then test on a novel action (e.g., "microwaving a snow globe") requiring unseen physical inferences (e.g., melting, pressure changes).  
     - **Engineering Prediction**: System succeeds via attention/transfer learning; errors are fixable with data augmentation.  
     - **Philosophical Prediction**: System fails catastrophically due to unprincipled relevance assignment; symbolic approaches (e.g., event calculus) handle novelty better via explicit axioms.  

  2. **Crux: Formal Verifiability**  
     - **Question**: Can relevance judgments be verified for correctness in bounded domains?  
     - **Concrete Case**: In a blocks world variant, verify whether a system (neural vs. situation-calculus-based) correctly infers persistent properties (e.g., color unchanged after moving a block) under adversarial perturbations (e.g., hidden magnets).  
     - **Engineering Prediction**: Probabilistic confidence scores provide sufficient verification; no symbolic formalism needed.  
     - **Philosophical Prediction**: Only symbolic systems achieve verifiability; neural attention masks irreproducible heuristics.  

  3. **Crux: Scaling Efficiency**  
     - **Question**: Does combinatorial explosion resurface in learned systems for complex action sequences?  
     - **Concrete Case**: Benchmark a transformer against a non-monotonic solver (e.g., using default logic) on long-horizon tasks (e.g., 50-step cooking recipes) with sparse relevant changes.  
     - **Engineering Prediction**: Learned relevance (e.g., attention sparsity) avoids explosion; runtime scales sub-linearly.  
     - **Philosophical Prediction**: Symbolic solutions scale better; neural systems incur hidden costs (e.g., retraining for new actions).  

  4. **Crux: Cognitive Plausibility**  
     - **Question**: Do human-like relevance judgments require symbolic grounding?  
     - **Concrete Case**: Compare fMRI data of humans solving frame problems (e.g., predicting what changes when a car door opens) against neural/symbolic model activations.  
     - **Engineering Prediction**: Neural activations align better with human data; symbolic systems are cognitively implausible.  
     - **Philosophical Prediction**: Human judgments show structure alignable with symbolic rules (e.g., "intactness" defaults); neural models capture correlations, not principles.  

  ---

  **Residual Disagreement**: The two camps irreconcilably disagree on whether statistical approximations of relevance constitute a *resolution* of the frame problem or merely an *evasion* of its epistemological challenge.
