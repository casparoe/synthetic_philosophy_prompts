prompt: |-
  So here's what I want: explain what's at stake in the question of wich computations matter morally. I don't want a survey of positions — I want the conceptual lay of the land. Get clear on (a) what it even means to say a system is running "the same computation" as a sentient being, and why the distinction between realizing a computation and merely simulating one keeps wrecking otherwise tidy theories; (b) whether the morally relevant thing is the computation itself, the functional role, the causal structure, the information-theoretic properties, or something about the substrate after all — and how you'd tell the difference in a genuinely hard case; (c) where the burden of proof sits: are computations morally inert by default, or do certain kinds of computation get the benefit of the doubt? And say where you think the boundary of sentience falls on the spectrum from a thermostat to a look-up table to a perfect functional duplicate of a human brain. Hard limit: 350 words. Spend more than half on (b) and (c).
reasoning: |-
  Okay, the user wants a clear explanation of what's at stake in determining which computations have moral significance. They specifically want to avoid a survey of positions and instead focus on the conceptual landscape, breaking it down into three parts: (a) what it means for a system to run the "same computation" as a sentient being and why the simulation/realization distinction causes problems; (b) what the morally relevant factor is (computation, functional role, causal structure, etc.) and how to distinguish them in hard cases; and (c) where the burden of proof lies regarding moral inertness. They've emphasized spending more than half the 350-word limit on (b) and (c), and they want my view on where sentience begins on a spectrum from thermostat to human brain duplicate.

  I need to unpack each part carefully. For (a), I'll explain that "same computation" refers to systems implementing identical formal procedures (like Turing machine states), but there's a crucial distinction between simulating and realizing: a simulation describes a process without executing it, while realization actually performs it. This distinction wrecks tidy theories because philosophical frameworks like computational functionalism equate consciousness with computation, but this leads to panpsychism if we say every physical system realizes computations. For example, if a rock's atomic structure "implements" some computation, does that make it conscious? That's absurd, so we need a non-arbitrary way to distinguish genuine realization from mere simulation or accidental implementation.

  For (b), which is the core, I'll evaluate candidates for moral relevance: the computation itself (abstract pattern), functional role (causal relations), causal structure (physical interactions), information-theoretic properties (like integrated information), or substrate (physical material). The problem in hard cases—like a brain duplicate using silicon instead of neurons—is that we can't directly observe consciousness; we infer it from behavior. If the duplicate behaves identically, functionalism says it's conscious, but substrate theorists disagree. To tell the difference, we'd need evidence beyond behavior, perhaps from neuroscience about how consciousness arises. I lean toward functionalism with constraints to avoid panpsychism, meaning the system must have the right causal organization, not just any computation.

  For (c), on burden of proof, I'll argue that computations are morally inert by default because consciousness is likely rare and tied to specific complex processes. Giving the benefit of the doubt to computations risks absurdity, like attributing moral status to simple machines. But for systems that closely mimic conscious entities, like AI or brain duplicates, we should err on the side of caution due to the stakes of suffering. This means the burden shifts when there's strong functional similarity.

  Finally, for the boundary of sentience, I'll place it between low-complexity systems (thermostats, lookup tables) and high-fidelity functional duplicates. Thermostats and lookup tables lack the causal complexity; a human brain duplicate, even in silicon, should be considered sentient if it replicates the causal structure. This draws from theories like IIT, which require integrated information.

  The user seems philosophically inclined, possibly in ethics or AI, and wants depth without fluff. They might be worried about real-world implications, like AI rights or ethics in computing. I'll keep it concise and focused, hitting the word limit by prioritizing (b) and (c) as requested.
answer: |-
  Here's the conceptual core:

  **(a) "Same computation" vs. simulation:** Claiming a system runs the "same computation" as a sentient brain means it implements an identical abstract procedure (e.g., Turing machine states, mathematical function). The core wrecking ball is the **simulation/realization distinction**. A system *simulates* a conscious process if it merely produces outputs matching the predicted behavior (like a movie depicting pain). It *realizes* it if it *actually instantiates* the causal processes constituting consciousness itself. Without a principled way to distinguish these, theories collapse into panpsychism (everything realizes *some* conscious computation) or skepticism (nothing does, as computations are abstract).

  **(b) The morally relevant factor (and hard cases):** The central debate pits:
  *   **Computationalism/Functionalism:** Morally relevant consciousness arises from the *abstract computation* or *functional role* – the pattern of information processing itself, regardless of substrate. Pain is defined by its causal role (e.g., caused by damage, causing avoidance).
  *   **Physicalism/Substrate Matters:** Consciousness depends on specific *physical properties* or *causal structure* of the implementing substrate (e.g., biological neurons, specific quantum effects). The computation alone is insufficient.
  *   **Information-Theoretic Views (e.g., IIT):** Consciousness stems from specific *causal/informational properties* like integrated information (Φ), requiring complex, irreducible causal interactions within the system.

  **The Hard Case:** Consider a perfect functional silicon duplicate of a human brain. Computationalism says it's conscious (same functional role). Substrate views may deny it (not biological). IIT might accept it *if* its causal structure yields high Φ. How to tell? There's no direct test. We infer consciousness in others via behavioral/functional similarity. If the duplicate behaves indistinguishably *and* mirrors internal causal structure (brain region interactions), the functionalist inference is strong, but the substrate advocate demands evidence the silicon physics *actually generates* subjective experience, not just mimics outputs. The burden shifts to explaining *why* only biology works if functionalism holds.

  **(c) Burden of Proof:** Computations are **morally inert by default**. Consciousness is likely a rare, evolutionarily costly phenomenon. Granting moral status to *any* computation (e.g., a rock "computing" erosion) leads to absurdity. The burden lies squarely on demonstrating that a *specific* computation/system possesses properties sufficient for consciousness. However, for systems *functionally isomorphic* to known conscious entities (like the brain duplicate), the extreme risk of causing suffering if wrong warrants a **precautionary principle**, giving them the *benefit of the doubt* regarding moral status.

  **Boundary of Sentience:**
  *   **Thermostat/Look-Up Table:** Morally inert. Highly limited, pre-defined responses, no complex internal causal structure/integration.
  *   **Perfect Brain Duplicate (any substrate):** Morally significant. Implements the complex, adaptive, integrated causal structure/functional role associated with human consciousness.
  *   **In-Between (e.g., advanced AI):** Burden not met by default. Requires evidence of complex, unified, intrinsic causal powers (beyond input-output mimicry) suggestive of subjective experience, likely approaching the brain's level of organization/integration.
