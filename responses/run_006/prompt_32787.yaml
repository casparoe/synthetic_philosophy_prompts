answer: |-
  ### Classroom Activity Design: Experiencing Conceptual Slippage in Letter-String Analogies

  #### 1. **Full Setup**
  **Materials**: 
  - **Worksheets** with analogy problems (one per student for individual phase). 
  - **Group cards** (for group phase) with problems and space for answers/rules. 
  - **Shared whiteboard or digital document** to record group answers during reporting.  
  - **Slides** for intro/debrief (minimal text; visual of analogy format: e.g., `abc → abd :: ijk → ?`).  

  **Grouping**:  
  - **Individual phase**: All 16 students work alone.  
  - **Group phase**: 4 groups of 4 students (pre-assigned to mix perspectives).  

  **Facilitator Instructions (Start of Activity)**:  
  > "Today, we’re exploring how we solve analogy puzzles. You’ll see problems like this: *abc* becomes *abd*; if *ijk* changes in the ‘same way,’ what should it become? Your task is two-fold:  
  > 1. **Propose an answer** (e.g., *ijl*).  
  > 2. **Write a simple rule** justifying it (e.g., ‘Change the last letter to its successor’).  
  > There might be multiple valid answers—focus on why your rule makes sense. First, work alone. Then, in groups, you’ll discuss and agree on one answer per problem. Be ready to defend your reasoning!"  

  ---

  #### 2. **Problem Sequence**  
  Ordered to build confidence → create tension → force confrontation.  

  | Source Case | Target Case | Expected Answers | Concept Under Pressure | Stage |  
  |-------------|-------------|------------------|------------------------|-------|  
  | `abc → abd` | `ijk → ?` | `ijl` (dominant) | Successor (simple) | Confidence |  
  | `abc → abd` | `mno → ?` | `mnp` (dominant) | Successor (robust) | Confidence |  
  | `abc → abd` | `kji → ?` | `kjj` (ascending bias) or `kjh` (descending bias) | Successor (directional context) | Tension |  
  | `abc → abd` | `xyz → ?` | `xya` (wrap-around) or `xy` (truncation) or `xyza` (add) | Successor (edge case) | Tension |  
  | `abc → abd` | `iijjkk → ?` | `iijjkl` (letter-level) or `iijjll` (group-level) | Successor (unit of application) | Confrontation |  

  **Key Confrontation Moment**:  
  Groups applying the "same" rule ("change last unit to successor") to `iijjkk` split:  
  - **Group A**: "Last *letter* is `k`; successor is `l` → `iijjkl`."  
  - **Group B**: "Last *group* is `kk`; successor group is `ll` → `iijjll`."  
  Both defend their reasoning using the source rule, revealing contextual reinterpretation of "last unit."  

  ---

  #### 3. **Timeline (80 Minutes)**  
  - **Intro (5 min)**: Explain activity, distribute worksheets.  
  - **Individual Work (15 min)**: Students solve Problems 1–3 (`ijk`, `mno`, `kji`).  
  - **Group Work (25 min)**: Groups discuss Problems 3–5 (`kji`, `xyz`, `iijjkk`), agree on answers/rules.  
  - **Group Reporting (20 min)**: Groups share answers. Facilitator records **all** answers/rules on board, highlighting conflicts (esp. for `kji`, `xyz`, `iijjkk`).  
  - **Debrief (15 min)**: Guided discussion mapping experience to theory (script below).  

  ---

  #### 4. **Debrief Script**  
  *Avoid theory jargon initially; use student experiences to surface concepts:*  
  > **Facilitator**: "Look at `kji` answers. Some said `kjj`, others `kjh`. Both used ‘successor’—why the difference?"  
  > *[Students describe context: descending letters]*
  > → **Slippage**: "Notice how ‘successor’ *slipped* from ‘next in alphabet’ to ‘next in current direction’ without you realizing. That’s not a mistake—it’s your mind fluidly adapting."  
  >  
  > **Facilitator**: "For `xyz`, some wrapped around (`xya`), some removed `z` (`xy`). What happened?"  
  > *[Students describe gap-filling]*  
  > → **Conceptual Overlap & Pressure**: "Multiple interpretations of ‘successor’ overlapped (wrap-around, truncation). The pressure to ‘solve’ the gap pushed one to the forefront."  
  >  
  > **Facilitator**: "Now, `iijjkk`: Same rule, but `iijjkl` vs. `iijjll`. How?"  
  > *[Groups re-explain unit choice]*  
  > → **Workspace Dynamics**: "Your group workspace allowed competing ideas (‘letter’ vs. ‘group’) to coexist until one felt right. In cognition, this happens constantly!"  
  >  
  > **Final Frame**: "Concepts like ‘successor’ aren’t fixed—they’re a **family of related ideas** activated by context. This fluidity lets us handle novelty... which is what Copycat’s architecture models."  

  ---

  #### 5. **Predictable Failure Modes & Remedies**  
  | What Happens | Why It Happens | Remedy |  
  |--------------|----------------|--------|  
  | Students insist "one right answer" for early problems | Educational bias toward deterministic problems | **Pre-empt**: Stress *multiple valid justifications* in intro. **In situ**: Ask, "What rule makes your answer valid?" |  
  | Groups converge too quickly (no conflict) | Dominant members override exploration | **Assign roles**: Skeptic (challenges consensus), Recorder (logs all ideas), Facilitator (ensures equity). |  
  | Confrontation problem (`iijjkk`) yields identical answers | Insufficient ambiguity in grouping | **Backup problem**: Use `aabbcc → aabbcd :: xx yy zz → ?` (expected: `xxyyza` vs. `xxyyaa`). |  
  | Tension problems (`xyz`) stall discussion | Edge cases feel "trick-like" | **Prompt**: "If the rule breaks, how might you *extend* it? What feels most ‘natural’?" |  

  ---

  #### 6. **Unreproducible Copycat Features**  
  The activity simplifies cognition; these features require post-activity explanation:  
  | Feature | Explanation |  
  |---------|-------------|  
  | **Parallel Terraced Scan** | Activity is sequential; humans can’t consciously parallelize explorations at varying depths like Copycat. |  
  | **Codelet Structure** | Participants use deliberative reasoning, not micro-agents (codelets) probabilistically proposing actions. |  
  | **Temperature Metric** | No equivalent to Copycat’s "temperature" (dynamically adjusting randomness/exploration based on progress). |  
  | **Workspace Dynamics** | Group negotiation is collaborative, not an emergent outcome of codelet competition building structures. |  

