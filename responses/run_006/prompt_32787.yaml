prompt: |-
  I'm a PhD student in cognitive science, and I'm running a guest session in an advanced undergraduate seminar called "Concepts and Cognition" — about 16 students, one 80-minute block. I want them to feel conceptual slippage in their own reasoning before they read the papers on the Copycat architecture and fluid concepts. The core idea is that even in a tiny, well-defined microdomain, concepts like "successor," "opposite," and "same" shift under contextual pressure, and that this is not a failure of reasoning — it is how fluid concepts work.

  Design a classroom activity that makes this happen. The domain should be letter-string analogies: participants are given analogy problems (e.g., abc → abd :: ijk → ?) and must propose completions and defend them. The activity should be structured so that they encounter cases where their own rules break down and they have to notice that they have been sliding between different interpretations of the same concept without realizing it. The key moment should be when two participants — or two groups — realize they applied the "same" rule to the "same" case but got different answers, and both can justify their reasoning.

  Please provide the following:

  1. Full setup: materials (worksheets, slides, cards, or a shared document), how to group the students, and the exact instructions the facilitator gives at the start.

  2. A sequence of analogy problems, ordered to first build confidence, then create tension, then force a confrontation. For each problem, give the source case, the target case, the answer(s) you expect participants to produce, and which concept is under pressure at that point.

  3. A timeline for the 80 minutes, with durations for each phase.

  4. A debrief script that maps specific moments in the activity onto the theoretical concepts: slippage, conceptual overlap, the pressure to fill gaps, the role of the workspace, and the idea that there is no single "right" concept of successor — just a family of related ones that get activated differently by context. The debrief should name the theoretical concepts only after participants have lived through the phenomenon.

  5. What will predictably go wrong the first time I run it, and how to handle each failure mode.

  6. An honest note on which features of the Copycat architecture (the parallel terraced scan, the codelet structure, temperature, the workspace dynamics) the activity cannot reproduce and that I will need to supply in the mini-lecture afterward.

  After the activity description, give me a structured summary as a JSON object with the following schema:

  - "phases": an array of objects, each with fields "name" (string), "duration_minutes" (number), "instructions" (string — what the facilitator says or does), and "target_concept" (string — the theoretical idea the phase is meant to surface)
  - "problem_sequence": an array of objects, each with fields "source_case" (string), "target_case" (string), "expected_answers" (array of strings), "concept_under_pressure" (string), and "stage" (one of "confidence", "tension", "confrontation")
  - "failure_modes": an array of objects, each with fields "what_happens" (string), "why_it_happens" (string), and "remedy" (string)
  - "unreproducible_features": an array of objects, each with fields "feature" (string) and "explanation" (string — one sentence on why the activity cannot capture it)
reasoning: |-
  We are designing an activity for an advanced undergraduate seminar in cognitive science. The goal is to make students experience conceptual slippage in their own reasoning within a microdomain of letter-string analogies. The activity should lead to a moment where participants apply the "same" rule but get different answers, both justifiable.

  Key elements:
  - Use letter-string analogies (e.g., abc → abd :: ijk → ?)
  - Structure: build confidence, then create tension, then force a confrontation.
  - Debrief to connect the experience to theoretical concepts (slippage, conceptual overlap, etc.) without naming them until after.

  Let's break down:

  1. **Setup**: 
     - Materials: Worksheets or a shared document (for simplicity, we'll assume a shared document projected or individual worksheets). Alternatively, we can use index cards for each problem to hand out at different stages.
     - Grouping: Start individually, then pair or small groups (to foster discussion and reveal differing interpretations). We'll have 16 students. We can do 4 groups of 4 for the group phase.
     - Instructions: Explain that they are solving letter-string analogy problems. They must propose an answer and write a brief justification (the rule they used). Emphasize that there might be more than one valid answer and that they should be ready to defend their reasoning.

  2. **Problem Sequence**:
     We need a sequence that starts simple (to build confidence), then introduces ambiguity (tension), and then a problem that can be solved in two conflicting ways (confrontation). 

     Example of a confrontation problem: 
     - Source: abc → abd (change last letter to its successor? or change 'c' to 'd'? which is the successor of 'c')
     - Target: ijk → ... 
          - If they think of "successor" as next in the alphabet, they might say 'ijl' (change 'k' to 'l')? But note: the example abc→abd changes the last letter to the next letter. However, what if we have a problem that uses the same rule but in a different context? 

     We want a problem where the concept of "successor" might be applied to the entire string? Or to individual letters? Or maybe the concept of "opposite" or "same" in a different light.

     Let me design a sequence:

     Stage 1: Confidence-building problems
       Problem 1: abc → abd :: ijk → ? 
          Expected: ijl (change last letter to next letter) or maybe ijd? But that doesn't make sense. Typically, it's ijl. 
          Concept: successor (of the last letter)

       Problem 2: abc → abd :: rst → ?
          Expected: rsu (change last letter to next: t->u)

       Problem 3: aaa → aab :: zzz → ?
          Expected: aaa (if we think of wrapping around? but typically in the alphabet, after z there is nothing. Or maybe they think of the alphabet as circular? But without that, they might say no change? or error? But we want to build confidence so we avoid that. Instead, let's do a non-edge case. Actually, we can use this to start introducing tension? Maybe hold off and do a non-edge case for confidence.

          Alternatively, to avoid edge, do:
          Problem 3: abc → abd :: mmm → ?
          Expected: mmn (change last letter to next)

     Stage 2: Tension (introduce ambiguity)
       Problem 4: abc → abd :: kji → ?
          Now, the target string is descending. They might think: 
            - Apply the same rule: change the last letter to its successor. But the last letter is 'i'. Successor is 'j'. So kjj? 
            - But note: the source string is ascending, and the target is descending. Maybe they should reverse the rule? Or change the last letter to the next in the opposite direction? 
            - Expected answers: kjj (if they just do the same letter change) or kjh (if they think of opposite direction). Both can be justified.

       Problem 5: abc → abd :: xyz → ?
          Now, what is the successor of z? There is none. So they might say:
            - xya (wrap around) or xy_ (blank) or xyz (no change) or maybe xy (remove the last letter) ... but we expect xya (wrap around) or maybe they think of an error. But we want to show that the context (like the problem before) might influence. Actually, this is a good tension because after the previous problem, they might have different ideas.

       Actually, to build tension, we might have two problems that individually are ambiguous but the same rule applied leads to different outcomes? 

       Let me rework the sequence:

       Stage 1: Confidence (simple, unambiguous)
          P1: abc → abd :: ijk → ijl   [rule: change last letter to next letter]
          P2: abc → abd :: mmm → mmn   [rule: same]

       Stage 2: Tension (introduce one kind of ambiguity: direction and edge)
          P3: abc → abd :: kji → ? 
              Expected: kjj (if they ignore direction and just change the last letter) OR kjh (if they think of the string as descending and change to the previous letter? but note: the rule was "change to successor", which in a descending context might be the predecessor? Or they might not think of the direction and just do kjj).
              Concept: direction context affecting the meaning of "successor"

          P4: abc → abd :: xyz → ?
              Expected: xya (wrap around) or xy (remove) or xyz (no change) or xyy? (maybe they think of a different rule). But we want to show that without a wrap-around concept, the rule breaks.

          However, note: the rule from P1 and P2 was "change last letter to its successor". In xyz, the successor of z is undefined. So they must adapt.

       Stage 3: Confrontation: 
          We want a problem where the same rule applied by different groups leads to two different answers that are both justifiable and that conflict.

          Problem: Let's use a problem that can be interpreted in two ways that both use the concept of "successor" but in different ways.

          Example: 
            Source: abc → abd 
            Target: iijjkk → ?

          What rule in the source? 
            - It changed the last letter to the next letter. 
            - But note: the source has a pattern of one a, one b, one c. The target has two of each? 

          How to apply the rule? 
            Option 1: Change the last letter (the last 'k') to 'l'. So iijjkl? 
            Option 2: Change every occurrence of the last letter? So change every 'k' to 'l'? Then iijjll.

          Now, both are using the idea of "successor" but at different levels (single letter vs. group). 

          Alternatively, we can do:

            Source: aabbcc → aabbcd   (changed the last letter to its successor)
            Target: iijjkk → ?

            Then, if they apply the same rule: change the last letter to its successor -> iijjkl? 
            But what if they see the pattern as pairs? Then they might change the last pair? Or the last element of the pair? 

          Actually, let me use:

            Source: abc → abd   (change the last letter to its successor)
            Target: ppqqrr → ?

            Now, if they change the last letter to its successor: ppqqrs
            But if they see the string as three pairs and change the last pair? How? Changing the last pair to the next in the pair? Or the entire pair? 

          We can design:

            Source: abc → abd   (rule: replace the last letter with its successor)
            Target: xx yy zz → ?   (but we write it without spaces: xxyyzz)

            Then:
            Option 1: replace the last letter (z) with the next (so xxyyza? but that breaks the pattern) -> not good.
            Option 2: replace the last group (zz) with the next group (aa) -> then xxyyaa? 
            Option 3: replace the last letter with the next letter, so xxyyz a? but that doesn't fit the pattern. 

          Alternatively, let's do:

            Source: abc → abd   (change the last letter to its successor: c->d)
            Target: iijjkk → ?

            How about:
            - Rule: change the last letter to its successor -> iijjkl? (but breaks the pattern of two of each)
            - Rule: change the last group (kk) to the next group (ll) -> iijjll? 

          Now, both groups might justify:
            Group A: "We applied the rule exactly as in the source: change the last letter. The source changed one letter, so we change one letter: k to l -> iijjkl"
            Group B: "We noticed that the target string has groups of two. The source had single letters. We think the rule should be applied to the last group as a whole. So we change the last group (kk) to the next group (ll) -> iijjll"

          This causes confrontation: same source rule, same target string, but two different answers.

          We can also have a problem that uses the concept of "opposite":

            Source: a → z :: b → ? 
            Expected: y? (opposite in the sense of symmetric in the alphabet? But what is the opposite of a? z? and b? y? But note: the source changes a to z (which is the opposite end) so for b we change to y.

            But then we can have:
            Source: a → z :: m → ?
            Now, the opposite of m: is it n? or l? or something else? There are two ways: 
              - By position: a=1, z=26, so m=13, then opposite would be n=14? or another letter? Actually, the mirror: if a maps to z (1 to 26), then m (13) maps to n (14) because 13+13=26? but 26-13+1=14? Or 13 maps to 14? 
              - Alternatively, by symmetry: a and z are at the ends, then b and y, then c and x, ... m and n? (because 13 and 14 are adjacent). 

            But that's confusing. Let me stick to the group pattern for the confrontation.

          Therefore, confrontation problem:

            Source: abc → abd   (as before)
            Target: iijjkk → ?

          Expected answers: 
            - iijjkl (change last letter to next)
            - iijjll (change the last group to the next group)

          Both can be justified.

     So the problem sequence:

     | Stage        | Source Case | Target Case | Expected Answers | Concept under pressure |
     |--------------|-------------|-------------|------------------|------------------------|
     | Confidence 1 | abc → abd   | ijk → ?    | ijl             | Successor (simple)     |
     | Confidence 2 | abc → abd   | mmm → ?    | mmn             | Successor (repeated)   |
     | Tension 1    | abc → abd   | kji → ?    | kjj OR kjh       | Direction (ascending vs descending) |
     | Tension 2    | abc → abd   | xyz → ?    | xya OR ...       | Edge (z) and wrap-around |
     | Confrontation| abc → abd   | iijjkk → ? | iijjkl OR iijjll | Grouping (what is the unit to apply successor?) |

     Note: For Tension 1 (kji), we expect:
        - kjj: if they just change the last letter (i to j) without considering the direction of the string.
        - kjh: if they think that because the string is descending, they should change the last letter to the next in the descending order (so i to h? because after i in descending is h). But note: the rule is successor. In the source, successor meant next in the ascending order. In a descending string, the "successor" in the context of the string might be the next in the descending order (which is the predecessor in the alphabet). So they might say: change the last letter to its predecessor? Then kji -> kjh? 

     But wait: the rule in the source was to change to the next letter (successor) in the alphabet. So if they apply the same rule to kji, they should change i to j -> kjj. But then why would they get kjh? Only if they reinterpret the rule in the context of the descending string. So we can have both.

     For Tension 2 (xyz): 
        - xya: wrap around (z->a)
        - xyz: no change (because there's no next)
        - xyy: maybe they change the last letter to a default? 
        But we want to show that they have to extend the concept.

  3. **Timeline for 80 minutes**:

     - Introduction (10 min): Explain the activity and rules. Hand out worksheets or set up shared doc.
     - Individual work (10 min): Each student solves the first two confidence problems and the first tension problem (P1, P2, P3). They write their answer and a one-sentence rule.
     - Group work (15 min): Form groups of 4. Give them the next tension problem (P4) and the confrontation problem (P5). They must agree on an answer for each and write a rule.
     - Group reporting (15 min): Each group reports their answers and rules for P3, P4, and P5. The facilitator writes them on the board. For P5 (confrontation), there will be at least two groups with different answers (iijjkl vs iijjll). Facilitator asks each to justify.
     - Class discussion (15 min): Facilitator leads a discussion on why there are different answers even when the rule was the same? How did they decide? What does this say about concepts?
     - Debrief (15 min): Connect to theory without jargon first, then name the concepts.

     Total: 10+10+15+15+15+15 = 80 min.

  4. **Debrief Script**:

     Start by asking: 
       - "What happened when you solved the problems? Did you ever feel that a rule that worked before stopped working? How did you adjust?"
       - "In the problem with kji, some of you changed the last letter to j, some to h. Why? What made you interpret the rule differently?"
       - "In the problem with xyz, how did you handle the fact that z doesn't have a next letter? What did you do then?"
       - "Now, look at the confrontation problem: iijjkk. We have two answers: iijjkl and iijjll. Both groups said they applied the same rule as the source: change the last element to its successor. But why the different answers?"

     Then, guide them to notice:
       - The concept of "successor" changed depending on the context: in a descending string, it might mean the next in the descending order (predecessor in the alphabet). At the edge (z), it might wrap around. In the grouped string, it might be applied to the entire group or just the last letter.
       - They didn't realize they were redefining the concept until they saw someone else's answer. This is conceptual slippage: the meaning of the concept shifted without them being fully aware.

     Then, introduce the theoretical concepts:
       - **Conceptual slippage**: The way a concept (like "successor") can shift its meaning subtly in response to contextual pressures.
       - **Conceptual overlap**: The idea that multiple related concepts (e.g., successor for a single letter vs. successor for a group) are activated at the same time, and the context determines which one is chosen.
       - **Pressure to fill gaps**: When a rule breaks (like at z), we feel compelled to extend the concept to cover the gap, even if it means changing the definition.
       - **Role of the workspace**: The mind holds multiple representations and rules in a mental workspace, and they compete until one fits best (here, in group discussion, they had to negotiate).
       - **Family of concepts**: There isn't one "right" concept of successor — there is a family of related concepts that are activated differently by context.

     Finally, explain that this is how fluid concepts work: they are not rigid, but adapt to the situation.

  5. **Failure Modes**:

     - **What happens**: Students get stuck on the first problem and can't proceed. 
       **Why**: The instructions might be unclear. The first problem is too ambiguous? 
       **Remedy**: Make the first problem very simple and give an example. In the introduction, do a quick example together.

     - **What happens**: In the group phase, one student dominates and the group converges too quickly without exploring alternatives.
       **Why**: Group dynamics.
       **Remedy**: Assign roles: one recorder, one facilitator (ensures everyone speaks), one skeptic (challenges the group's answer), one timekeeper. Or have each person first write their own answer and rule, then share.

     - **What happens**: During the confrontation, both groups don't have conflicting answers (they all agree on one answer).
       **Why**: The confrontation problem might be too obvious in one direction, or the group discussion might have converged.
       **Remedy**: Have a backup problem that is more ambiguous. Alternatively, if they all agree, the facilitator can play devil's advocate and present the alternative answer and ask if it's possible.

     - **What happens**: The debrief turns into a debate about which answer is correct.
       **Why**: Students are used to problems having one right answer.
       **Remedy**: Emphasize at the start that in this activity, multiple answers can be valid if justified. In the debrief, redirect from "correctness" to "the reasoning process and how context influenced".

  6. **Unreproducible Features of Copycat**:

     - **Parallel Terraced Scan**: The activity is sequential and group-based, while in Copycat, multiple possibilities are explored in parallel at different depths. The activity cannot show the simultaneous exploration of many paths with different levels of attention.
     - **Codelet Structure**: Copycat uses small, independent codelets that probabilistically act. The activity is driven by conscious reasoning in groups, not by a swarm of small, independent processes.
     - **Temperature**: The activity doesn't model the temperature dynamic (which controls randomness and exploration). Students are not guided by a global measure of coherence that adjusts randomness.
     - **Workspace Dynamics**: In Copycat, the workspace is a shared structure where codelets build and modify representations. In the activity, the workspace is the group discussion, but it doesn't have the same emergent structure.

  Now, the structured summary as JSON:

