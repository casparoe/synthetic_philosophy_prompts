  But note: the problems are:

    P1: Confidence 1: abc→abd :: ijk→?
    P2: Confidence 2: abc→abd :: mmm→?
    P3: Tension 1: abc→abd :: kji→?
    P4: Tension 2: abc→abd :: xyz→?
