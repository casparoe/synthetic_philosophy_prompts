  Moderate threats include misrepresentation cases (where HOTs misattribute states) and global workspace overlap. The former forces awkward disclaimers; the latter risks making HOT redundant. Awkward but survivable issues are phenomenological gaps (e.g., why HOTs aren't conscious themselves) and neural implementation. 

