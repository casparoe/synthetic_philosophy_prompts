  The user wants to understand why Sidgwick turned to psychical research. The key is that if survival is proven, it could support a cosmic justice system where self-interest aligns with morality. Sidgwick saw this as a potential empirical solution. The user might be questioning whether this connection is logically sound or just a personal quirk. They’re looking for a systematic analysis, not biography.

  I need to reconstruct Sidgwick's argument step by step. First, the dualism problem: egoism vs. utilitarianism. Without a divine guarantee, they conflict. Then, survival evidence could imply a just universe, thus resolving the conflict. But where does this reasoning fail? Sidgwick assumes that survival implies a benevolent order, but that’s a leap. Survival alone doesn't prove justice; an afterlife could be chaotic or indifferent. Also, the empirical evidence from psychical research was weak, which Sidgwick himself acknowledged. 

