  - Intellectualism (Stanley/Williamson): Knowing-how reduces to knowing-that propositions. But it's tacit; you don't consciously access them. Like having a type signature (spec) in your head but executing without runtime checks. Maps to knowledge distillation: extracting rules from procedural knowledge into declarative form, imperfectly.

