prompt: |-
  I recently spent a long evening arguing with a friend about whether Mencius or Xunzi has the better account of human nature, and we kept tripping over the same difficulty. Mencius appears to hold that human nature is good because every person possesses incipient moral dispositions that can be cultivated, while Xunzi appears to hold that human nature is bad because our inborn desires lead to conflict and goodness must be constructed through deliberate effort and ritual. We could not tell how much of the dispute is substantive and how much is verbal, since the two seem to use xing (nature) differently. Please act as a professional philosopher specializing in classical Chinese ethics. Think carefully, begin by brainstorming several senses in which Mencius and Xunzi might be using xing, and then give one clear, non-obvious example of a conceptual issue that arises in this debate. Explain briefly why that issue matters for adjudicating between their positions.
