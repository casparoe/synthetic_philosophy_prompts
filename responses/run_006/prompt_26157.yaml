prompt: |-
  I'm clerking for a judge and I need to figure out what she'd do on a case we just got assigned. Her past statutory interpretation rulings, as best I can read them from her opinions:

  - She held that a statute penalizing "whoever knowingly makes a false statement to a federally insured bank" requires the defendant to know the bank was federally insured, even though a plain reading could attach "knowingly" only to "makes a false statement." She said the presumption of mens rea runs through the whole phrase unless Congress clearly indicates otherwise.

  - She held that a statute banning "the sale of drug paraphernalia" covers a head shop that gave away free pipes with every purchase, because "sale" in this context includes commercial distribution by any means and reading it otherwise would let the whole statute be evaded.

  - She held that a statute requiring employers to "reasonably accommodate" disabled employees does not cover accommodating an employee's commute from a far-away suburb, because "accommodate" in the employment context means adjustments to the workplace itself. She leaned hard on the ordinary meaning of words in their specific legal setting.

  - She held that a statute making it a crime to "use a firearm" during a drug offense covers a defendant who traded a gun for drugs, because "use" includes employing something as an item of barter. She spent three pages on dictionary definitions and corpus linguistics.

  - She held that a statute granting asylum to refugees with a "well-founded fear of persecution on account of membership in a particular social group" does not cover someone fleeing gang recruitment, even when the gang targeted them for refusing to join. She said "particular social group" requires a shared immutable characteristic, not merely being singled out by criminals.

  - She held that a statute prohibiting "whoever transports a minor in interstate commerce with intent that the minor engage in prostitution" applies even when the defendant and minor crossed state lines for unrelated reasons and the prostitution plan formed only after they arrived. She said the jurisdictional hook is satisfied once the travel happened, and the statute's protective purpose demands a broad reading of the transport element.

  The new case: a statute makes it a crime to "knowingly transfer, possess, or use, without lawful authority, a means of identification of another person." The defendant used a fake name and a social security number he literally made up — it doesnt correspond to any real person. He used it to open a credit card. The question is whether a fabricated SSN counts as "a means of identification of another person."

  I need to predict which way she'll go, and also tell her which of her own precedents is the closest analog if she asks. I can see at least two rules that fit all six of her past rulings, and they point opposite directions on this one. What are those rules, which one do you think she's actually running, and is there a case on the horizon that would settle which rule she's really committed to?
reasoning: |-
  Alright, let's tackle this problem step by step. The user is a law clerk trying to predict how a judge would rule on a new case based on her past statutory interpretation decisions. The key issue is whether using a fabricated SSN falls under "a means of identification of another person."

  First, I need to understand the judge's approach from her previous rulings. Looking at her six cases, she seems to have a consistent methodology but applies it contextually. The two main interpretive rules emerging are the Linguistic Holism Rule (LHR) and the Anti-Evasion Rule (AER). 

  In the first case (false statement to a bank), she applied a presumption of mens rea throughout the entire phrase. This suggests she looks at the statute as a whole, not just isolated words. That's LHR. But in the head shop case, she broadened "sale" to include free gifts to prevent evasion of the statute's purpose—AER in action. 

  Next, the "reasonable accommodation" case leaned on ordinary meaning in a specific context (workplace adjustments), favoring LHR. But in the firearm trade case, she expanded "use" to include barter, using dictionaries and corpus linguistics—again, LHR. The asylum case required a shared immutable characteristic for "social group," sticking closely to term definitions (LHR). However, the prostitution transport case took a broad view to fulfill protective intent (AER).

  For the new case, the conflict is clear. Under LHR, "another person" implies a real individual, so a made-up SSN wouldn't count. But AER would argue that excluding fabricated IDs would create a loophole, undermining the statute's purpose of preventing identity fraud. 

  The judge's pattern shows she uses LHR more consistently, especially in definition-heavy cases like the asylum and firearm rulings. The AER seems reserved for situations where evasion would gut the statute, like the head shop or transport cases. Here, since fabricated SSNs are still used to defraud, she might lean towards AER to prevent loopholes. But her preference for textual analysis (dictionaries, context) suggests she might stick with LHR. 

  The closest precedent is the false statement case, where she required knowledge of the bank's insured status, showing emphasis on statutory phrasing. Yet the head shop case's anti-evasion approach could apply here too. 

  To settle which rule she truly favors, a case where both rules conflict without other factors (like evasion risk) would be needed. For example, a statute with ambiguous terms where plain meaning versus purpose leads to opposite outcomes, without a clear evasion possibility.
answer: |-
  Based on the judge's past rulings, I identify two consistent interpretive rules that explain all six precedents but conflict on this new case:

  1.  **The Linguistic Holism Rule (LHR):** Interpret statutory phrases as integrated wholes, giving effect to the ordinary meaning of *all* words in their specific context. Presumptions (like mens rea) apply throughout the phrase. Dictionary definitions, corpus linguistics, and the specific legal/contextual setting of the words are paramount. Avoid redefining words so broadly they swallow adjacent limiting terms.

  2.  **The Anti-Evasion Purpose Rule (AEPR):** Interpret statutory language to effectuate the statute's core purpose and prevent obvious evasion, even if it requires a broader reading of individual words than their most literal or narrowest ordinary meaning. This is particularly strong when a narrow reading would create a gaping loophole or frustrate the statute's protective or regulatory goal.

  **How the Rules Fit the Precedents:**

  *   **False Statement to Bank (Knowingly):** **LHR** wins. Mens rea presumption runs through *the entire phrase* ("knowingly makes a false statement to a federally insured bank"), requiring knowledge of the bank's status. A narrow reading of "knowingly" would ignore the integrated phrase.
  *   **Sale of Drug Paraphernalia (Free Pipe):** **AEPR** wins. A narrow reading of "sale" would let head shops evade the entire statute by using gimmicks. The statute's purpose demands "sale" includes commercial distribution broadly.
  *   **Reasonable Accommodate Commute:** **LHR** wins. "Accommodate" in the *specific context* of employment law and its ordinary meaning refers to the *workplace*, not general life circumstances. Expanding it to commutes disregards the contextual setting.
  *   **Use a Firearm (Trade for Drugs):** **LHR** wins (though method shows emphasis on text). Heavy reliance on dictionary/corpus definitions of "use" (including "employ," "avail oneself of") supports including barter. The focus is squarely on the *linguistic meaning of the word*.
  *   **Particular Social Group (Gang Recruitment):** **LHR** wins. The core of the holding is the *definition* of "particular social group" requiring a shared immutable characteristic, grounded in the term's established meaning in asylum law. Being targeted by criminals doesn't fit that definition.
  *   **Transport Minor for Prostitution (Intent Formed Later):** **AEPR** wins. A narrow reading requiring intent *before* crossing state lines would create a massive loophole defeating the statute's clear protective purpose against exploiting minors transported interstate. "Transport" is read broadly in light of the purpose.

  **The New Case: Fabricated SSN**

  *   **Statute:** "...a means of identification **of another person.**"
  *   **Defendant's Act:** Used a completely fabricated SSN (not assigned to any real person) to open a credit card.

  **Conflict Between the Rules:**

  1.  **Linguistic Holism Rule (LHR) Points to NO Liability:** The phrase "**of another person**" is a critical limiting element. Its ordinary meaning requires that the identification belong to or represent an *actual, existing individual*. A fabricated SSN does not identify any "other person"; it identifies a *fictional* entity. Applying the mens rea requirement "knowingly" holistically would require the defendant to know he was using ID *of another person*, which is impossible if the ID is purely fictional. Dictionary definitions of "another person" and "identification" strongly support this reading. Ignoring "of another person" would effectively read it out of the statute.

  2.  **Anti-Evasion Purpose Rule (AEPR) Points to LIABILITY:** The statute's core purpose is to prevent identity fraud and the harms caused by the misuse of identifying information. Allowing the use of *fabricated* SSNs for fraud creates a massive loophole. Criminals could evade the statute entirely by simply making up numbers instead of stealing real ones, achieving the same fraudulent result and causing the same harm (e.g., to creditors, credit systems). The purpose of protecting against fraud and misuse of identification systems demands that "means of identification of another person" be read broadly to include identifiers *represented* as belonging to another real person, even if they are fabricated.

  **Prediction & Closest Analog:**

  *   **Likely Outcome:** She will find **NO LIABILITY** under this statute. She will hold that a fabricated SSN is **not** a "means of identification of another person."
  *   **Primary Rule Applied:** **Linguistic Holism Rule (LHR)**. Her consistent emphasis on the ordinary meaning of *all* words in context, reliance on linguistic tools (dictionaries, corpus), and application of presumptions holistically (like mens rea) is the stronger, more consistent thread running through her jurisprudence, evident in the False Statement, Accommodation, Firearm Use, and Asylum cases.
  *   **Closest Analog:** **The False Statement Case.** This is the strongest parallel:
      *   Both involve a mens rea requirement ("knowingly") modifying a complex phrase.
      *   Both hinge on giving full effect to a limiting phrase within that complex phrase ("to a federally insured bank" / "of another person").
      *   Both apply a presumption (mens rea) through the entire phrase.
      *   Both reject arguments that the limiting phrase is merely jurisdictional or doesn't require knowledge/connection to a real entity.
      *   Both prioritize the integrated textual reading over potential loopholes or broader purposes argued under AEPR.

  **The Case That Would Settle Which Rule Dominates:**

  A case squarely presenting the conflict between LHR and AEPR, where the statutory text's plain meaning *clearly* leads to a result that *blatantly* undermines the statute's undeniable core purpose *and* creates a significant, easily exploitable loophole, and where there are no other textual or contextual clues to resolve it.

  *   **Example Scenario:** Imagine a statute punishing "the knowing destruction of **an original, signed deed** to real property." Defendant knowingly destroys a perfect, certified copy of an original deed. The statute's undeniable purpose is to protect the integrity of property records.
      *   **LHR:** "Original, signed deed" clearly excludes a copy. No liability.
      *   **AEPR:** Allowing destruction of copies creates a huge loophole. The purpose demands "original" includes perfect copies for the statute's function. Liability.
      *   **Your Judge's Likely Approach:** Based on her pattern, she would almost certainly follow **LHR** and find no liability, emphasizing the specific words "original" and "signed," even if it creates a loophole. Her ruling in the Asylum case (denying protection despite undeniable persecution risk because the victim didn't fit the *defined term*) is a strong indicator. She tolerates the loophole created by the head shop statute only because the *word* "sale" could linguistically bear the broader meaning in a commercial context and because the evasion was direct and would completely gut the statute. She is less likely to *create* meaning (like reading "another person" to include a fictional person) solely based on purpose when the text is clear and limiting.

  **Conclusion:**

  Predict the judge will rule that the fabricated SSN does **not** constitute "a means of identification of another person," relying primarily on the **Linguistic Holism Rule** exemplified in the **False Statement case**. Be prepared to discuss the tension with the Anti-Evasion Purpose Rule, but emphasize her stronger, more consistent textualist approach evident in most precedents. The case that would definitively show her commitment to LHR over AEPR is one where the text is unambiguous but leads to a significant, obvious loophole undermining core purpose, and she chooses the text regardless.
