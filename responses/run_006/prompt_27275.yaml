  i want to open the piece with a sonnet. here's what i'm picturing:

  the octave should give us the world as it naively appears — causes churning out effects, fire doing its thing, the confidence that causal powers are baked into things themselves. the volta should be the turn where the reader clocks that none of these connections are necessary; they're just god's customary way of doing things, and at any instant he could do otherwise. the closing couplet should land the existential point: we live in a world sustained moment by moment, not one running on its own steam.

  a couple constraints: dont name-drop al-ghazali in the poem — let the ideas carry it. and it needs to be accurate enough that someone who knows occasionalism would recognize the view specifically (not just generic theism or a vague "causation is mysterious" vibe). someone who doesnt know the view should still find it a striking poem.

  after the poem, include a commentary section (maybe 200 words) walking through your choices: why a sonnet for this, what you put in the volta, and how you handled the ʿāda / divine-habit concept without reducing it to mere humean regularity.
