  Word choice matters. "Fiat" implies divine command, "habit" suggests regularity without necessity. Avoiding terms like "law" keeps it distinct from Hume. The commentary should explain these choices: why sonnet (compression, volta), volta's role, and how 'āda differs from Hume by being volitional.

