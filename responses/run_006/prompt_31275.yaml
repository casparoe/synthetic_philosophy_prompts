prompt: |-
  I have been trying to get clear about when I think it is legitimate to say that one person is better or worse off than another, and I would like to know what principle, if any, captures my verdicts. Here they are, going on gut instinct.

  (1) If one person has a mild tension headache and another has a migraine, I have no hesitation saying that the person with the migraine is worse off. I mean this as a claim about how things are for them, not merely as an expression of whom I would rather help.

  (2) If one person is in severe acute physical pain and another is in acute grief, I refuse to rank them. I do not merely lack information; I doubt that there is a single scale of badness along which the two states differ.

  (3) For a single person across time, I make even cross-dimension comparisons without hesitation. I can say that the grief I felt after a bereavement was worse than a toothache I had the same year, and I do not think I am merely reporting which I would rather relive.

  (4) When two people report their overall satisfaction with life, I generally trust the reports. If Ana says she is at 8 out of 10 and Ben says 6 out of 10, I take Ana to be better off, absent special reasons.

  (5) But I do not trust reports of satisfaction that look adapted to deprivation. Someone who has spent years in severe poverty may sincerely say that they are content with very little, and I find myself thinking that they may still be worse off than a moderately dissatisfied person in comfortable circumstances. I cannot say what makes this case different from Ana and Ben's except that the contentment seems to have been formed by the deprivation itself.

  (6) Across species, I am willing to compare within a single dimension. A dog with a broken leg is worse off than a human with a paper cut. But a dog's chronic separation anxiety and a human's mild depression feel like different dimensions, and I balk at comparing them.

  (7) Yet I have no trouble saying that a person with clinical depression is worse off than a person with a stubbed toe. So I do not have a general taboo against comparing physical pain with emotional distress across people.

  The closest I can come to a principle is this: comparisons require a shared dimension of experience plus some notion of intensity; self-reports carry weight unless the underlying preferences were shaped by the deprivation they report on; and a single person's own history provides a common scale that is missing when we move between minds. But that principle cannot explain (7), since a stubbed toe and depression do not share a dimension, and it may not explain why I am so confident in (1) while so resistant in (2).

  Is there a principle, or a small set of candidate principles, that captures these verdicts, or most of them? State the best candidate precisely, say which clause is motivated by which verdict, and tell me honestly which of my verdicts it cannot accommodate and which I would have to overturn. Also tell me what it predicts about cases I have not listed: comparing a person's physical pain with their own emotional distress years later; comparing two people's anxieties of apparently equal intensity; comparing an infant's suffering with an adult's; and comparing a satisfied person whose preferences were formed by indoctrination with a frustrated person whose preferences are authentically their own.
reasoning: |-
  Okay, the user is grappling with a deep ethical and philosophical question about comparing well-being across individuals. They've listed seven specific intuitive judgments and are seeking a coherent principle that can explain most of them. This touches on longstanding debates in welfare economics, philosophy of mind, and ethics - particularly interpersonal utility comparisons and adaptive preference problems.

  Hmm, their examples reveal several tensions: they accept some cross-dimensional comparisons (like depression vs stubbed toe) but reject others (acute pain vs grief). They trust self-reports except when preferences seem adapted to deprivation. The species comparison case suggests they might be implicitly weighting cognitive capacity.

  The user seems philosophically sophisticated - they've already identified key problems like adaptive preferences and the "common scale" issue. Their frustration with their own tentative principle shows they recognize the contradictions. I should acknowledge that sophistication while offering a structured alternative.

  What's interesting is how their intuitions map to existing philosophical positions without fully aligning: the dimension-based thinking resembles Griffin's "component pluralism", the adaptive preference concern echoes Nussbaum's capabilities approach, and the self-report trust aligns with standard welfare economics - but no single theory explains all their judgments.

  For the proposed principle, I'll need to:
  - Explicitly define "dimension" as experiential quality types (pain, grief etc.)
  - Build in intensity as a secondary factor
  - Add a "cognitive capacity" clause for cross-species cases
  - Formalize the adaptive preference exception using Sen's ideas
  - Preserve first-person authority as default

  The migraine vs headache case (1) clearly motivates the shared dimension requirement. Their refusal to rank pain vs grief (2) shows dimensions aren't always commensurable. The depression vs stubbed toe case (7) is the biggest challenge - I'll argue depression contains painful affective components that create partial dimensional overlap.

  For new test cases: 
  - Intra-personal comparisons should be permitted via autobiographical memory (as in their verdict 3)
  - Comparing anxieties requires examining phenomenological similarity
  - Infant vs adult suffering needs developmental cognitive weighting
  - The indoctrination case extends adaptive preference concerns

  I should emphasize this principle still has problems - particularly how to objectively identify dimensions and whether intensity comparisons are truly possible across minds. But it systematizes their intuitions better than their initial attempt. The key is making the dimension concept flexible enough to handle depression as having both affective and cognitive aspects that partially overlap with physical pain's aversiveness.
answer: |-
  Your intuitions reveal a sophisticated, pluralistic view of well-being comparisons that resists reduction to a single scale. After analyzing your verdicts, I propose this principle:

  **The Pluralistic Comparability Principle:**  
  *Well-being comparisons between individuals are legitimate iff:*  
  **(a)** *They share a sufficiently similar experiential dimension (e.g., pain, grief, anxiety), AND*  
  **(b)** *Intensity differences are discernible through observable proxies (behavior, physiology, context) or credible self-report, AND*  
  **(c)** *Self-reports are not distorted by adaptive preference formation.*  
  *Within a single individual's life history, cross-dimensional comparisons are permitted via autobiographical unity.*

  ---

  ### How each clause explains your verdicts:
  1. **Migraine vs. headache (Verdict 1)**  
     → Satisfies (a) (shared pain dimension) and (b) (clear intensity difference).  
     → *Motivated by your confidence here.*

  2. **Physical pain vs. grief (Verdict 2)**  
     → Violates (a): distinct dimensions with no common metric.  
     → *Explains your refusal to rank.*

  3. **Single person cross-time (Verdict 3)**  
     → Permitted by the autobiographical unity exception.  
     → *Captures your willingness to compare.*

  4. **Self-reports (Ana/Ben) (Verdict 4)**  
     → Covered by (b): default trust in self-reports.  
     → *Reflects your acceptance.*

  5. **Adapted self-reports (Verdict 5)**  
     → Blocked by (c): deprivation distorts self-assessment.  
     → *Explains your skepticism.*

  6. **Cross-species comparisons (Verdict 6)**  
     → Broken leg vs. papercut: satisfies (a) (shared pain dimension) and (b) (severity proxies).  
     → Separation anxiety vs. depression: violates (a) (dimension mismatch across species).  
     → *Accounts for your selective balking.*

  7. **Depression vs. stubbed toe (Verdict 7)**  
     → **Revised dimension concept:** Depression includes *affective suffering* (shared with physical pain's unpleasantness), satisfying (a). Intensity proxies (functional impairment, duration) satisfy (b).  
     → *Resolves your exception to dimension-sharing.*

  ---

  ### Limitations & Required Verdict Revisions:
  - **Verdict 2 accommodation:** The principle fully explains your refusal to compare pain vs. grief (dimension mismatch).  
  - **Verdict 7 accommodation:** By expanding "dimension" to include broad affective states (e.g., "acute aversiveness"), it captures your intuition without contradiction.  
  - **Required revision:** Your initial claim that (7) violates dimension-sharing must be reconsidered. The principle shows depression and pain *do* share a substrate of conscious distress.

  ---

  ### Predictions for Unlisted Cases:
  1. **Personal pain vs. past emotional distress**  
     → **Permitted:** Autobiographical unity allows comparison ("My grief was worse than my toothache").

  2. **Two people's equal-intensity anxieties**  
     → **Blocked:** If anxieties are truly identical in dimension and intensity (e.g., both have moderate social anxiety), no legitimate comparison exists. Differences require identifiable asymmetry (e.g., duration, triggers).

  3. **Infant vs. adult suffering**  
     → **Conditionally permitted:** Shared dimensions (e.g., pain from hunger) allow comparison if intensity proxies exist (crying duration, vital signs). Complex states (e.g., loneliness) may violate (a) due to developmental differences.

  4. **Indoctrinated satisfaction vs. authentic frustration**  
     → **Blocked:** Indoctrination triggers clause (c) (adaptive preference). The satisfied person is worse off *if* their preferences were formed under coercion/ignorance, despite self-report.

  ---

  ### Philosophical Tensions Remaining:
  - **Dimension boundaries:** What counts as "sufficiently similar"? (e.g., is chronic boredom a form of suffering comparable to mild pain?)  
  - **Intensity calibration:** How to equate scales across minds? (Your principle relies on proxies, but these are imperfect.)  
  - **Non-human minds:** Comparing species requires controversial assumptions about phenomenological similarity.

  This principle systematizes 6.5/7 verdicts (fully explaining 1-6, reinterpreting but accommodating 7). It prioritizes *phenomenological similarity* over strict metric unity, reflecting your intuition that well-being has irreducible qualitative dimensions. To adopt it, you must accept that "dimensions" can be broader than basic senses (e.g., encompassing depression's affective core)—a refinement your own verdicts support.
