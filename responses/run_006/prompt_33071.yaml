prompt: |-
  I teach an upper-level seminar on public reason and religion in liberal democracy: sixteen students, one 75-minute session. Design a structured deliberation that makes the students feel the force of the asymmetry objection to the demand that citizens justify coercive laws with reasons that others can reasonably accept, without my lecturing on the objection first and without naming it until the debrief. Choose a contested policy—ideally one that is not so immediately personal that students cannot adopt assigned positions—on which both a religious argument and a secular comprehensive argument (for instance, an autonomy-based liberal argument or a utilitarian one) are naturally in play. The rules, roles, or constraints should be arranged so that students trying to comply with a public-reasons-only rule run into the asymmetry themselves: religious reasons are filtered out as nonpublic while secular reasons that are equally sectarian in their foundations pass without comment, and students who must translate their reasons into generally accessible terms end up doing work that others are not asked to do. Provide roles or rules, a timeline, any brief reason-cards or handouts the facilitator needs, and a debrief that maps specific moments in the exercise onto the distinction between public and nonpublic reasons, the wide view of public political culture, and the translation proviso. Also tell me what will predictably go wrong the first time I run it, including how to handle students who spot the asymmetry early, and which feature of the real debate the exercise cannot reproduce and I will need to supply myself.
reasoning: |-
  Okay, the user is teaching a seminar on public reason and religion in liberal democracy. They want a structured deliberation exercise that helps students grasp the asymmetry objection without lecturing first. The asymmetry objection points out that secular reasons often aren't scrutinized like religious ones under public reason requirements. 

  Hmm, the user needs a realistic policy debate where both religious and secular arguments appear naturally. It should feel organic, not forced. Assisted suicide comes to mind - it has clear religious objections (sanctity of life) and secular arguments (autonomy, utility) that are equally deep but treated differently in public discourse. 

  The key challenge is making students experience the asymmetry. Need roles that force some to translate their views into "public" language while others don't. Also important that the secular comprehensive views (like utilitarianism) slip through as "public" when they're actually just as sectarian. 

  For setup: four role groups (religious pro/con, secular pro/con) with position cards containing both deep and surface-level arguments. Rules must require "publicly accessible reasons only," enforced by a moderator. The trap is that secular groups won't realize their foundational premises (e.g. preference autonomy as ultimate good) are just as contested as divine commands. 

  Predictable problems: students might sniff out the asymmetry too early, or secular groups might accidentally use their deep reasons. Need contingency plans - if spotted early, lean into it during debrief; if seculars reveal foundations, highlight how even their "translation" depends on unspoken assumptions. 

  Biggest missing piece in the exercise? Real-world power dynamics where secular views dominate. Must emphasize in debrief that what counts as "public" is politically shaped, not neutral. 

  Timing is tight - 75 mins total. Strict facilitation needed: short intro (10 mins), group prep (15), debate (35), debrief (15). Handouts should be minimal, just role cards with bullet points. 

  Debrief structure is crucial. Start with student observations about unequal burdens, then introduce Rawlsian terms. Contrast how "sanctity of life" gets dismissed while "bodily autonomy" gets a pass despite both resting on comprehensive doctrines. Highlight the translation labor religious students had to do. 

  Ah, and warn the user: first run will be messy. Students might resist assigned positions or over-rationalize. Emphasize that discomfort is pedagogical - the point is to feel the unfairness, not solve it. Maybe suggest they run it twice if time allows, since reflection deepens after first failure.
answer: |-
  Here’s a structured deliberation exercise designed to surface the asymmetry objection experientially, using **physician-assisted suicide (PAS)** as the policy issue—contentious yet abstract enough for role adoption.

  ---

  ### **Exercise Title:** *The Fairness Forum: Justifying PAS*

  **Policy:** *Should our state legalize physician-assisted suicide for terminally ill, mentally competent adults?*

  **Learning Goal:** Experience the unequal burden of "public reason" constraints on religious vs. secular comprehensive doctrines.

  ---

  ### **Structure & Roles**  
  *(Assign roles secretly; students don’t know others’ assignments)*  
  | **Group**              | **Role**                | **Secret Foundation**                          | **Public-Facing Goal**               |  
  |-------------------------|--------------------------|-----------------------------------------------|--------------------------------------|  
  | 1 (4 students)        | **Religious Opponents** | Catholic Natural Law: Life is sacred; only God may end it. | Argue against PAS using "widely accessible" reasons. |  
  | 2 (4 students)        | **Secular Opponents**   | Utilitarianism: PAS risks coercion of vulnerable groups, net harm to society. | Argue against PAS using "public reasons." |  
  | 3 (4 students)        | **Religious Supporters**| Unitarian Universalism: Bodily autonomy reflects divine gift; compassion requires choice. | Support PAS using "generally acceptable" reasons. |  
  | 4 (4 students)        | **Secular Supporters**  | Autonomy-Based Liberalism: Self-ownership justifies control over death. | Support PAS with "shared political values." |  

  **Special Role:** 1-2 **Moderators** (rotate among students) to enforce rules.

  ---

  ### **Rules & Constraints**  
  1. **Public Reason Only:** Arguments must appeal to reasons "all free and equal citizens could reasonably accept" (distribute printed rule cards).  
  2. **No Foundations:** Do not cite religious texts, metaphysical doctrines, or comprehensive ethical systems (e.g., "the Bible says," "utilitarianism requires").  
  3. **Translation Duty:** If challenged, explain *how* your view connects to common democratic values (e.g., equality, well-being).  
  4. **Moderator Power:** Flag violations with a buzzer/bell. Violators must rephrase or forfeit speaking time.  

  *(Secular groups’ foundations are equally sectarian but sound "neutral"—e.g., utilitarianism isn’t universally shared)*  

  ---

  ### **Timeline (75 mins)**  
  1. **Intro (5 mins):** Frame PAS as a live policy debate. Distribute role cards (foundations hidden) and rules.  
  2. **Prep (15 mins):** Groups draft 3 arguments complying with rules. *Prompt: "How would you justify your position to fellow citizens of diverse worldviews?"*  
  3. **Deliberation (40 mins):**  
     - **Rounds 1-2:** Groups present arguments (3 mins/group). Moderators enforce rules.  
     - **Cross-Examination (20 mins):** Groups question each other. Moderators target *religious* groups: *"Can you explain that without your faith tradition?"*  
     - **Final Rebuttals (5 mins):** Groups summarize.  
  4. **Debrief (15 mins):** Reveal the asymmetry objection.  

  ---

  ### **Handouts**  
  **Role Cards (Example):**  
  > *Religious Opponent (Secret: Natural Law)*  
  > **YOU BELIEVE:** Life’s sanctity is inherent and God-given. PAS violates eternal moral law.  
  > **YOUR TASK:** Oppose PAS using reasons derived from health outcomes, social trust, or human dignity—*without referencing God or religion.*  

  **Rule Card:**  
  > - "Public reasons" = grounded in political values (e.g., liberty, fairness) or shared evidence.  
  > - NO appeals to comprehensive doctrines (religious/secular).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Secular Groups "Cheat" Accidentally:**  
     - *E.g.,* "Autonomy is the highest good!" → Moderator lets it slide (shows asymmetry).  
     - **Fix:** Note in debrief how this exposes the double standard.  

  2. **Religious Groups Frustrated:**  
     - *E.g.,* "I have to translate everything—others don’t!" → **Lean in:** Ask, *"Did others face similar burdens?"*  

  3. **Students Spot Asymmetry Early:**  
     - **Strategy:** Affirm privately, ask them to play along: *"Observe how others react—this is part of the experiment."*  

  4. **Shallow Arguments:**  
     - *Why:* Students avoid deep values to comply. **Solution:** In debrief, contrast their neutered arguments with secret foundations.  

  **Critical Missing Nuance:**  
  Real-world power dynamics—secular frameworks *feel* "neutral" because they dominate politics. **You must explain this post-exercise.**  

  ---

  ### **Debrief Script**  
  **Q1:** *"Which groups struggled most to comply with the rules? Why?"*  
  → Surface frustration of religious students doing "translation work."  

  **Q2:** *"Did any arguments sound 'public' but rely on hidden foundations?"*  
  → Identify secular appeals to autonomy/utility as *also* comprehensive.  

  **Introduce Concepts:**  
  1. **Asymmetry Objection:**  
     - Religious reasons are excluded as "nonpublic," while secular doctrines evade scrutiny.  
     - **Map to exercise:** Moderators challenged religious students to translate; secular utilitarians weren’t asked, "Why prioritize aggregate welfare?"  

  2. **Wide View of Public Political Culture:**  
     - Rawls allows citizens to *present* comprehensive reasons IF they supplement public reasons.  
     - **Map:** Had religious students been permitted to *add* faith arguments *after* giving public reasons, burden decreases.  

  3. **Translation Proviso:**  
     - The unfair expectation that religious citizens "reframe" their views while secular citizens don’t.  
     - **Map:** Opposing PAS via "risk to vulnerable groups" (secular) required no translation; opposing via "sanctity of life" (religious) did.  

  **Clincher:** *"The exercise reveals liberal democracy’s blind spot: treating secularism as 'neutral' is itself a sectarian stance."*  

  ---

  **Why PAS Works:**  
  - Religious stakes (sanctity of life) vs. secular stakes (autonomy/utility) are symmetrical in depth.  
  - Students focus on policy logic, minimizing personal exposure.  
  - Translation burden on religious roles feels tangible quickly.  

  **First-Run Tip:** Pre-brief moderators to enforce rules *strictly* against religious roles and *leniently* against secular ones to heighten asymmetry.
