  - **Joint satisfiability**: Explore if requirements conflict, especially purity vs. relational constraints.  
  - **Theories**: Briefly map hypocrisy-based, relationship-based, and eliminativist views to the desiderata, noting gaps.  

  Key pitfalls to avoid:  
