  The user’s explicit needs are clarity on non-negotiables vs. contested points, potential conflicts in requirements, and a quick tour of major theories. But deeper, they might feel stuck in circular seminar debates and want tools to critically engage. They might also suspect "standing" isn’t a coherent concept—so highlighting tensions is crucial.

  Now, structuring the response:  
