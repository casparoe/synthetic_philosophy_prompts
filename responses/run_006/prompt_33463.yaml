  - Flag where everyday practice clashes with philosophical tidyness (e.g., reformed hypocrites).  
  - Explicitly mark "received wisdom" (non-negotiables) vs. "battlefield" (contested).  

  User’s unspoken need might be confidence to navigate literature without getting lost. By showing where desiderata clash, they can assess theories’ costs. Also, their "half-suspect" suggests they’d appreciate honesty about coherence—even if messy.
answer: |-
  Here’s a structured breakdown of desiderata for a theory of standing to blame, grounded in cases and distinctions, with assessments of non-negotiability, potential conflicts, and a brief scorecard of major views.

  ---

  ### **Core Desiderata for an Adequate Theory**  
  *(Non-negotiables in bold; contested/contextual marked)*  

  1. **Distinguish Standing from Blame’s Correctness**  
     - **Case**: An unrepentant hypocrite (e.g., a cheating spouse blaming their partner for infidelity).  
     - **Requirement**: The hypocrite’s blame may be *true* (the partner did wrong) but they lack *standing* to express it.  
     - **Force**: Ordinary practice: We say "You’re in no position to blame!" without retracting the underlying criticism.  
     - **Status**: **Non-negotiable**. Standing is about *authority to blame*, not the blame’s accuracy.  

  2. **Distinguish Standing from Expressiveness**  
     - **Case**: Blaming a dictator for atrocities might be true and deserved, but expressing it could provoke retaliation.  
     - **Requirement**: Standing ≠ whether expressing blame is *prudent* or *useful*.  
     - **Force**: We can have standing to blame even when doing so is unwise (e.g., a victim blaming their abuser at personal risk).  
     - **Status**: **Non-negotiable**. Standing is a normative condition for *issuing* blame, not a consequentialist calculus.  

  3. **Hypocrisy Undermines Standing (but with Caveats)**  
     - **Case**: An unrepentant hypocrite (as above).  
     - **Requirement**: Hypocrisy *typically* voids standing—blaming while engaging in the same wrong signals unfairness.  
     - **Contested Cases**:  
       - *Repentant hypocrite*: Someone who did the same wrong decades ago but now condemns it sincerely.  
         - **Battlefield**: Some camps say standing is restored if blamer has reformed; others say past hypocrisy permanently taints.  
       - *Trivial vs. Serious Wrongs*: Hypocrisy over minor faults may not destroy standing for grave wrongs.  
     - **Status**: **Non-negotiable that hypocrisy *can* void standing**, but *when* it does is contested.  

  4. **Third-Party Standing is Possible but Limited**  
     - **Case**: A stranger with no connection to victim/wrongdoer blames a corporate polluter.  
     - **Requirement**: Standing isn’t *only* for victims or their intimates—but "busybodies" may lack it.  
     - **Force**: We accept some third-party blame (e.g., activists condemning injustice) but reject meddlers in private disputes.  
     - **Status**: **Contested**: Relationship-based views restrict standing; impartialist views extend it broadly.  

  5. **Complicity Modifies Standing**  
     - **Case**: A mobster’s lieutenant blames a rival for violence.  
     - **Requirement**: Complicity in *related* wrongdoing may undermine standing, even if not identical to the wrong blamed.  
     - **Force**: We reject blame from those "up to their necks in it" (e.g., a corrupt politician condemning bribery).  
     - **Status**: **Non-negotiable** that complicity *can* negate standing; *scope* is contested.  

  6. **Relational Proximity Matters**  
     - **Case**: The victim’s friend blames vs. a stranger.  
     - **Requirement**: Close relationships often *strengthen* standing (e.g., family of a murder victim).  
     - **Force**: We defer to victims’ loved ones but question strangers’ "right" to insert themselves.  
     - **Status**: **Contested**: Relationship-centric views demand this; impartialists see it as optional.  

  7. **Sincerity ≠ Standing**  
     - **Case**: A stranger passionately but sincerely blames a parent for mild parenting flaws.  
     - **Requirement**: Sincere belief in blame’s truth doesn’t confer standing.  
     - **Force**: We dismiss "virtue-signaling" outsiders even if their judgment is correct.  
     - **Status**: **Non-negotiable**. Standing isn’t reducible to epistemic conditions.  

  ---

  ### **Can These Requirements Be Jointly Satisfied?**  
  **Tension exists between:**  
  - **Impartiality** (all moral agents have standing) vs. **Relationality** (standing requires special connection).  
  - **Purity** (hypocrisy always destroys standing) vs. **Redemption** (reformed hypocrites regain standing).  

  **Conflict highlight**: If standing requires relational proximity (e.g., friend of victim), third-party blame (e.g., human rights advocates) lacks standing—but this clashes with practice where we accept *some* detached blame. Conversely, if standing is universal, it collapses the distinction between involved/uninvolved blamers. **No theory satisfies all desiderata without cost**.  

  ---

  ### **Scorecard: Major Views vs. Desiderata**  
  *(✓ = Strong fit; ✗ = Weak fit; ~ = Partial)*  

  | **View**               | **Core Claim**                              | **Strengths**                          | **Weaknesses**                                  |  
  |-------------------------|---------------------------------------------|----------------------------------------|------------------------------------------------|  
  | **Hypocrisy-Based**     | Standing requires "clean hands."            | ✓ Hypocrisy cases (3)                 | ✗ Third-party blame (4); ~ Repentant hypocrites (3) |  
  | **Relationship-Based**  | Standing requires role/relationship (e.g., victim, friend). | ✓ Relational cases (6); ✗ Complicity (5) | ✗ Third-party blame (4); ✗ Distinguishes standing from correctness (1) |  
  | **Eliminativist**       | "Standing" is redundant; blame is either true/useful or not. | ✓ Simplicity                          | ✗ All non-negotiables (fails 1,2,3,7)—ignores practice of challenging "position." |  
  | **Hybrid (e.g., Moral Community)** | Standing requires non-complicity + commitment to norms. | ~ Most cases (avoids extremes)         | ~ Contested cases (e.g., reformed hypocrites)  |  

  **Verdict**: No dominant winner. **Hybrid views** (e.g., standing as a "right to address blame" grounded in non-hypocrisy + normative competence) come closest but struggle with edge cases (e.g., the *sincerely reformed hypocrite*). The desiderata reveal "standing" as a cluster concept with irreducible tensions—likely explaining why debates persist.  

  **Next Step**: Test theories against the *repentant hypocrite* and *detached activist* cases—these often force the biggest concessions.
