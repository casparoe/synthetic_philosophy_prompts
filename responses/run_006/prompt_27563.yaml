answer: |-
  ## Joint Statement on Textualism and Purposivism in Statutory Interpretation  
  **Authored by Professor A (Textualist) & Professor B (Purposivist)**  

  ### Preamble  
  This document reflects our genuine agreements, persistent disagreements, and the precise cruxes on which resolution depends. We commit to representing each position accurately, using terminology endorsed by its proponent. Where disagreements are terminological or normative, we flag them explicitly. Our goal is to clarify, not compromise.  

  ---

  ### I. Numbered Claims of Unreserved Agreement  
  Both signatories endorse the following propositions:  

  1.  **The Primacy of Enacted Text:** A statute’s legally binding directive is found in the text enacted by the legislature and signed into law.  
  2.  **The Existence of Easy Cases:** Where the statutory text provides a clear and unambiguous answer to the question presented, that answer controls, regardless of perceived purpose or legislative desires not reflected in the text. (E.g., awarding statutory damages "not exceeding $50" when actual damages are $1,000).  
  3.  **The Existence of Genuinely Hard Cases:** Cases exist where reasonable interpreters, applying good-faith methods, disagree on the meaning or application of the text in context. These are not merely disagreements over policy preferences.  
  4.  **The Judicial Role Under Article III:** Courts interpret statutes; they do not rewrite them. Judges are not legislators.  
  5.  **The Relevance of Context:** Statutory text is not interpreted in a vacuum. Linguistic context (e.g., surrounding words, the whole statute) is always relevant.  
  6.  **The Limits of Literalism:** Strict literalism ("word-by-word without context") is not a tenable theory of interpretation and can lead to absurd results neither side endorses.  
  7.  **The Fallibility of Legislative History:** Legislative history can be incomplete, contradictory, manipulated, or unrepresentative of the enacting coalition. It is not an infallible guide.  
  8.  **The Problem of Unforeseen Applications:** Statutes will inevitably be applied to factual scenarios not specifically contemplated by the enacting legislature.  
  9.  **Concessions to the Opposing View:**  
      *   *Textualist Concession:* Purposivism correctly identifies that legislatures act to solve problems and achieve goals; understanding this can sometimes illuminate textual meaning and guard against wooden interpretations leading to frustration of obvious aims.  
      *   *Purposivist Concession:* Textualism correctly emphasizes that only the enacted text has the force of law, provides crucial notice to citizens and predictability, and acts as a vital constraint on judicial overreach by tethering judges to an objective source.  

  ---

  ### II. Disagreements Table  

  | Point of Disagreement          | Textualist Position (Prof. A)                                                                                                                                 | Purposivist Position (Prof. B)                                                                                                                                                                                               | Crux                                                                                                                                                                                                                                                          | Evidence Bearing on Crux & Predictions                                                                                                                                                                                                                                                                                                                                 |
  | :----------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Primary Objective in Interpretation** | The sole proper objective is to discern the *communicative content* of the enacted text, understood by a reasonable person at the time of enactment using the conventions of statutory language. | The primary objective is to discern and effectuate the *statutory purpose* – the general aims or problem-solving goals the legislature sought to achieve, as embodied, but not necessarily exhausted by, the enacted text. | **Does the "meaning" of a statute consist *only* in the semantic content conveyed by the text's words and structure in context (Textualism), or does it *necessarily include* the functional objective(s) the legislature sought to accomplish (Purposivism)?** | **Evidence:** Analysis of how courts actually justify decisions in "hard cases" historically; linguistic philosophy on meaning vs. purpose. <br> **Textualist Prediction:** Analysis will show purpose-based reasoning leads to inconsistency and judicial policymaking disguised as interpretation. <br> **Purposivist Prediction:** Analysis will show even textualists implicitly rely on functional coherence to resolve ambiguity. |
  | **2. Role of Legislative History** | Legislative history is categorically unreliable as an indicator of statutory meaning. It reveals only the views of individual members or committees, not the collective intent of the enacting legislature. Its use undermines textual supremacy and predictability. | Legislative history, when properly used (e.g., committee reports explaining the problem addressed, uncontradicted sponsor statements), provides highly relevant evidence of the *purpose* the text was designed to serve, especially when textual meaning is unclear. It helps discern the "why" behind the text. | **Can legislative history, despite its flaws, reliably provide evidence of the *statutory purpose* that is both distinct from the semantic meaning of the text and necessary/authoritative for resolving genuine textual ambiguity in a way that respects legislative supremacy?** | **Evidence:** Empirical study of instances where legislative history was used to resolve ambiguity vs. instances where it contradicted clear text; surveys of legislative drafters on intent vs. enacted text. <br> **Textualist Prediction:** Studies will show legislative history is frequently contradictory or used to override text, reducing predictability. <br> **Purposivist Prediction:** Studies will show legislative history, used cautiously, clarifies purpose without overriding text and increases fidelity to legislative design in close cases. |
  | **3. Handling Unanticipated Applications** | When the text clearly applies to unforeseen facts, the court must apply it, even if the result seems incongruent with the original purpose or leads to perceived harshness. Updating is for the legislature. If the text is ambiguous *as applied to the new facts*, the court interprets it using semantic contextual tools (dictionaries, canons, structure). | When unforeseen facts arise, the court must determine if applying the literal text would *frustrate the core statutory purpose* in a way the enacting legislature would not have intended. If so, and especially if the text permits, the purpose should guide application. Ambiguity should be resolved by seeking the purpose-consistent meaning. | **When unforeseen facts arise: Should the court's inquiry remain strictly focused on whether the *semantic meaning of the text* clearly applies (Textualism), or should it also ask whether that application would *frustrate the core statutory purpose* in an intolerable way (Purposivism)?** | **Evidence:** Analysis of historical instances where courts applied statutes to unforeseen facts; public perception/legitimacy studies of outcomes; rate of legislative correction after such decisions. <br> **Textualist Prediction:** Analysis will show purposivist frustration tests lead to unpredictable judicial overrides of text. <br> **Purposivist Prediction:** Analysis will show textualist literalism in unforeseen cases leads to unjust, irrational outcomes that undermine respect for law and increase legislative burden. |
  | **4. The "Purpose" Anchor** | "Purpose" must be derived exclusively *from the text and structure of the statute itself*, understood objectively. External goals or notions of "good policy" cannot be imported. Purpose is a tool for *understanding the text*, not overriding it. | While purpose must be grounded in the statute, discerning it often requires looking to the *problem the legislature was addressing* and the *mischief it sought to remedy*, informed by context including legislative history. Purpose provides a lens for *interpreting ambiguous or open-textured text*. | **Is statutory purpose *solely immanent* within the semantic structure of the enacted text (Textualism), or can it be *informed by reliable external evidence* of the specific problem the legislature sought to solve (Purposivism), even if that evidence helps resolve textual ambiguity?** | **Evidence:** Linguistic analysis of whether statutory text alone can reliably convey specific purpose without extratextual context; historical studies comparing enacted text to contemporaneous legislative problem statements. <br> **Textualist Prediction:** Analysis will show purposivists rely on contested external evidence to impose purposes not fairly derivable from the text. <br> **Purposivist Prediction:** Analysis will show textualist "immanent purpose" is often indeterminate or reconstructs purpose based on assumptions that external evidence could confirm or refute. |

  ---

  ### III. Housekeeping: Terminological & Normative Flags  

  1.  **Terminological Disagreements:**
      *   **"Legislative Intent":** Prof. A uses this to mean the specific subjective intentions of individual legislators (rejected by both). Prof. B uses it as shorthand for the collective "design" or "purpose" objectively attributable to the statute based on text and reliable context. *This difference is largely terminological once clarified.*
      *   **"Plain Meaning":** Prof. A views "plain meaning" as meaning discernible from semantic context and structure, potentially complex but still "plain" in that sense. Prof. B often associates "plain meaning" with simplistic literalism. *Clarification reduces conflict; both agree complex text can have an objective meaning.*
      *   **"Purpose of the Statute":** Prof. A grounds this strictly in the enacted text's structure and semantic implications. Prof. B grounds it primarily in the text but allows reliable external evidence to illuminate it. *This reflects the substantive disagreement (II.4), not merely terminology.*

  2.  **Normative Disagreements (Premises Laid Bare):**
      *   **Core Judicial Role Anxiety:** Prof. A: Primary fear is *judicial overreach* – unelected judges substituting their policy preferences for the law. The core democratic value is *fidelity to the enacted text as the only legitimate expression of the legislature's will*. Prof. B: Primary fear is *judicial underreach* or *wooden formalism* – judges failing to fulfill the legislature's problem-solving mandate when text alone is insufficient. The core democratic value is *fidelity to the legislative design and the functional goals the people's representatives sought to achieve*.
      *   **Priority of Values:** Prof. A prioritizes *predictability, notice, constraint of judges, and stability* across all cases. Prof. B prioritizes *fidelity to legislative design, achieving just/rational outcomes in application, and adaptive functionality*, especially in hard or unforeseen cases, seeing predictability as flowing from principled purpose-based reasoning.
      *   **View of Legislature:** Prof. A views the legislative process as producing a *definitive textual command*. Prof. B views it as producing a *deliberative effort to solve a problem*, with the text being the primary but not sole evidence of that effort. *These differing conceptions of the legislative product underpin many interpretive choices.*

  ---

  **Conclusion**  
  This statement reflects our best-faith effort to map our agreements, isolate our genuine disagreements with precision, identify the crucial questions (cruxes) on which resolution depends, and specify the kinds of evidence that could potentially change our minds. We have flagged where our differences stem from terminology or fundamental normative commitments about law and democracy. We offer this not as a resolution, but as a framework for more productive debate and further scholarly inquiry aimed at these cruxes.  

  **Signed,**  
  _________________________ (Prof. A, Textualist)  
  _________________________ (Prof. B, Purposivist)  
  *Date: October 26, 2023*
