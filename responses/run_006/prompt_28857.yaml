  - If you picked the envelope with $Y, then the other has $2Y (so double).
  - If you picked the envelope with $2Y, then the other has $Y (so half).

  Since you pick at random, the probability that you picked the smaller one is 1/2, and the probability that you picked the larger one is 1/2.

  Mira's argument:
  - You pick an envelope and observe $X. Then the other envelope has either $2X or $X/2, each with probability 1/2.
  - Expected value of switching = (1/2)*2X + (1/2)*(X/2) = (2X + X/2)/2 = (5X/2)/2 = 5X/4 = 1.25X.
