  Minimum cross-entropy: minimize KL divergence subject to P(Paris)/P(Euro) = 0.8. This preserves the relative odds only for events not mentioned in the constraint. Here, since London and Berlin are both European non-France, and the constraint doesn't distinguish them, MinxEnt would also keep their relative odds equal, so same as Jeffrey.

