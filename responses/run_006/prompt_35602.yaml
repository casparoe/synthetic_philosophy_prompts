answer: |-
  Your puzzle hits on a deep and well-recognized challenge in probabilistic reasoning: **updating beliefs on uncertain evidence or partial constraints** (like conditional probabilities, correlations, or inequalities) rather than on direct observations of events. This isn't just a quirk; it's a fundamental gap in basic Bayesian conditioning. Below, I'll unpack the core problem, its standard names, the main candidate solutions, where they disagree, and the state of the debate.

  ### The Core Problem & Its Name
  - **The Issue**: Standard Bayesian conditioning requires learning that a specific *proposition* is true (e.g., "I am in Paris"), which sets P(Paris) = 1 and renormalizes other probabilities. But when you learn a *constraint* on your probabilities (e.g., "P(Paris | European capital) = 0.8"), infinitely many posterior distributions can satisfy it. Your prior doesn't specify how to redistribute probabilities among possibilities *not directly constrained* (e.g., London vs. Berlin).
  - **Standard Names**:
    1. **Probability Kinematics**: Coined by Richard Jeffrey, this describes "changing gears" in your probability distribution when evidence isn't categorical.
    2. **Updating on Uncertain Evidence**: Emphasizes that the evidence itself is probabilistic (e.g., a conditional chance).
    3. **Constraint-Based Updating**: The broadest term, covering learning inequalities, correlations, or any linear/nonlinear constraint on probabilities.
    4. **Jeffrey's Paradox** (less common): Sometimes used for cases like your example, where multiple updates seem "natural."

  ### Candidate Solutions & Where They Disagree
  Solutions differ in how they define "minimal change" from your prior to a posterior satisfying the new constraint. Here are the main approaches:

  1. **Jeffrey Conditionalization (Jeffrey's Rule)**  
     - **Idea**: Preserve the *relative odds* of possibilities *within* each cell of a "partition" defined by the evidence. In your example, the partition is {Paris, (London or Berlin)}.  
     - **Update Rule**:  
       - Set P(Paris) = 0.8 (since European capital is certain).  
       - Keep P(London)/P(Berlin) unchanged (from prior: 1/3 ÷ 1/3 = 1).  
       - Since P(¬Paris) = 0.2, assign P(London) = 0.1, P(Berlin) = 0.1.  
     - **When It Applies**: Best for evidence that directly updates probabilities of a partition (e.g., "P(Paris) = 0.8" or "P(European capital ∩ France) = 0.8").  
     - **Critique**: Feels intuitive but arbitrary. Why preserve London/Berlin odds but not their odds relative to Paris?  

  2. **Minimum Cross-Entropy (MinxEnt) / Kullback-Leibler Divergence Minimization**  
     - **Idea**: Minimize how much information is "gained" when moving from prior to posterior, subject to the constraint. This is the information-theoretic approach, generalizing MaxEntropy.  
     - **Update Rule**:  
       - Posterior Q minimizes KL-divergence D_KL(Q || P) subject to Q(Paris) = 0.8.  
       - For your uniform prior, Q(London) and Q(Berlin) *remain equal* (each 0.1), matching Jeffrey.  
       - **But disagreement arises if priors aren't uniform**: Suppose prior is P(Paris)=0.3, P(London)=0.6, P(Berlin)=0.1. MinxEnt would give Q(London) ≈ 0.15, Q(Berlin) ≈ 0.05 (preserving their 6:1 ratio), while Jeffrey might not (if partition isn't aligned).  
     - **When It Applies**: Handles arbitrary linear constraints (e.g., "P(Paris) ≥ 0.7", "E[X] = 5").  
     - **Critique**: Justified from information theory, but may over-adjust probabilities unrelated to the constraint.  

  3. **Maximum Entropy (MaxEnt)**  
     - **Idea**: Choose the *most uncertain* posterior satisfying the constraint (i.e., maximize entropy).  
     - **Update Rule**:  
       - In your uniform prior example, MaxEnt also gives Q(London) = Q(Berlin) = 0.1.  
       - **Disagrees with MinxEnt if prior isn't uniform**: MaxEnt ignores your prior and maximizes entropy from a *uniform* default. For non-uniform priors, it differs sharply from MinxEnt.  
     - **When It Applies**: Often used when no prior exists (e.g., in physics), but controversial for belief updating.  
     - **Critique**: Discards your original beliefs entirely if they aren't uniform.  

  4. **Objective Bayesian Updates**  
     - **Idea**: Use principles like symmetry or indifference to break ties (e.g., "no reason to distinguish London/Berlin → keep equal").  
     - **Update Rule**: In your case, set Q(London) = Q(Berlin) = 0.1.  
     - **When It Applies**: Simple cases with clear symmetries.  
     - **Critique**: Ad hoc; fails for complex constraints (e.g., "P(Paris) > 0.7 and P(London) > P(Berlin)").  

  ### Where Solutions Diverge: Your Example Revisited
  - **Uniform Prior (P=1/3 each)**: All methods agree: Q(Paris)=0.8, Q(London)=Q(Berlin)=0.1.  
  - **Non-Uniform Prior**: Suppose P(Paris)=0.2, P(London)=0.7, P(Berlin)=0.1. Constraint: P(Paris | European capital)=0.8.  
    - **Jeffrey**: Preserve London/Berlin ratio (7:1). Q(Paris)=0.8, so Q(London)+Q(Berlin)=0.2 → Q(London)=0.175, Q(Berlin)=0.025.  
    - **MinxEnt**: Preserve *all* ratios not directly constrained. London/Berlin stays 7:1 → same as Jeffrey.  
    - **But change the constraint**: If you learn "P(Paris) = 0.8" directly, Jeffrey preserves London/Berlin ratio (MinxEnt does too). If you learn "P(Paris | {Paris,London}) = 0.8", MinxEnt still preserves Berlin's probability, while Jeffrey might not (if Berlin isn't in the partition).  

  **Key Disagreement Triggers**:  
  - Non-uniform priors.  
  - Constraints that don't align with "natural" partitions (e.g., learning a correlation between A and B when your prior has dependencies with C).  
  - Inequality constraints (e.g., "P(Paris) ≥ 0.8"): MinxEnt chooses boundary (Q=0.8), MaxEnt may not.  

  ### The State of the Debate
  - **MinxEnt vs. Jeffrey**: MinxEnt is favored in information theory (e.g., Shore & Johnson, 1980) as the "unique" generalization of conditioning for linear constraints. Philosophers (e.g., van Fraassen) defend Jeffrey's rule for partition-based evidence.  
  - **Critiques**:  
    - **Subjectivity**: All rules require choosing how to "parameterize" uncertainty (e.g., what to keep constant).  
    - **No Consensus**: No single rule has "won." MinxEnt dominates engineering/ML; Jeffrey's is common in philosophy.  
    - **Deeper Issues**: Some argue these are *all* ad hoc (e.g., Diaconis & Zabell, 1982) and advocate for more foundational approaches (e.g., Dutch book arguments).  

  ### Key References
  1. **Richard Jeffrey** (1965, 1983): *The Logic of Decision* (foundational for probability kinematics).  
  2. **Shore & Johnson** (1980): Axiomatic derivation of MinxEnt (*IEEE Trans. Info. Theory*).  
  3. **Edwin Jaynes** (2003): *Probability Theory: The Logic of Science* (champions MaxEnt/MinxEnt).  
  4. **Van Fraassen** (1981): "A Problem for Relative Information Minimizers" (critique of MinxEnt).  
  5. **Diaconis & Zabell** (1982): "Updating Subjective Probability" (rigorous treatment of alternatives).  

  ### Practical Advice
  For your examples:  
  - **Conditional chance (P(C|B)=k)**: Use MinxEnt if priors matter; Jeffrey if B defines a clear partition.  
  - **Inequality (P(C|B) ≥ 0.6)**: MinxEnt sets it to equality (0.6); consider imprecise probabilities if unsure.  
  - **Correlations**: MinxEnt handles linear constraints best; simulate if possible.  

  **Bottom line**: This is the "update under constraints" problem. It lacks a universal solution because *minimal change* is context-dependent. In practice, choose MinxEnt for information-theoretic rigor, Jeffrey’s for partition-aligned evidence, and document your choice explicitly. The debate remains open, reflecting deeper questions about belief revision itself. If you explore specific constraints further, I can help map them to these rules!
