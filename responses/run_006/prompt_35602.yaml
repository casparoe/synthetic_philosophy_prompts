  I recall that this is known as the "probability kinematics" problem or updating with uncertain evidence. Richard Jeffrey's work from the 1960s introduced Jeffrey conditionalization for when the evidence itself is uncertain. But here it's not that the evidence is uncertain - we're certain about the conditional relationship.

  The user mentions other examples too: learning correlations without exact values, or inequality constraints. These are all cases of partial constraint updates. The literature has several approaches: Jeffrey's rule, minimum cross-entropy (which generalizes Jeffrey), maximum entropy, and others.

  Minimum cross-entropy (or MinxEnt) minimizes the Kullback-Leibler divergence from the prior, subject to the constraint. It's the Bayesian update for this situation in some senses. Jeffrey's rule is a special case when the constraint is on a partition.

  But in the European capital example, both might give the same answer. Where do they differ? Suppose the antecedent doesn't cover the whole space. For example: possibilities are Paris, London, Berlin, and also New York (not European). Prior: each 1/4. Learn: "If European capital, P(France) = 0.8". Now European capitals have total probability 0.75 (since NY is 0.25). The constraint says P(Paris | Euro) = 0.8, so P(Paris) should be 0.8 * 0.75 = 0.6.

