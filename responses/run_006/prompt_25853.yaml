prompt: |-
  I keep seeing this line on the forum whenever someone's arguing about evidence and induction: "a white shoe confirms that all ravens are black." It gets deployed as if it's self-evidently a reductio of something — but of what exactly depends on the poster. Sometimes it's trotted out to show that naive falsificationism is bankrupt, other times to push people toward Bayesianism, and occasionally someone uses it to claim that our everyday intuitions about what counts as evidence are completely worthless.

  I want to get clear on what this slogan is actually saying. Can you lay out the distinct precise claims it could be making — from the trivial logical point about contraposition to the strong epistemological claim that observing my socks genuinely supports an ornithological hypothesis — and tell me, for each, whether it's true, false, or genuinely contested? And crucially: which of these readings would actually licence the move from "confirmation has some counterintuitive features" to "therefore your pre-theoretic judgments about evidence are systematically unreliable"? I want a menu I can refer back to next time someone drops it in a thread. Please write the answer in British English.
