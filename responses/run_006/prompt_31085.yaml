answer: |-
  Precisely! But that subjectivity isn't arbitrariness; it reflects a deep physical fact: *information is physical*. When two observers assign different entropies based on differing knowledge, they are correctly describing different physical constraints. The observer with the demon's measurement *can* extract work from the single-molecule gas in Szilard's engine; the observer without that knowledge *cannot*. Both describe real limitations on possible actions within the physical world. Landauer and Bennett brilliantly show that resetting the demon's memory dissipates heat, preserving the global second law *on average*. But this doesn't explain why *possessing* the information *allows* the apparent local decrease in entropy in the first place! The dissipation upon erasure compensates, yes, but the core puzzle remains: the demon exploits its *knowledge* to temporarily circumvent the typical thermodynamic behavior derived from coarse-grained ignorance. The second law, in its statistical form, fundamentally governs what is *practically possible given our state of information about microscopic degrees of freedom*. The erasure cost is the *remedy* for exploiting information asymmetry, not an elimination of the asymmetry's fundamental role.
