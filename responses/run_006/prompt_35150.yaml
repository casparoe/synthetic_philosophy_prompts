  We are creating a thought experiment about a hinge commitment in an ordinary context. The scenario must show a proposition that stands fast for an agent, structures their inquiries, and is exempt from doubt, while also having strong evidence for it. We avoid stock examples (like hands or the external world) and philosophers.

  Scenario:

  Dr. Aris Thorne, a seasoned epidemiologist, is investigating an outbreak of a rare respiratory illness in a remote region. Every morning, without fail, she begins her work by consulting the latest data on her secure laptop, which she has used for years without issue. The proposition that "my laptop reliably displays accurate data from the health network" functions as a hinge for her: it is the bedrock upon which she conducts her analysis, tracks the spread, and formulates public health recommendations. She never questions this reliability; it is simply assumed in every action she takes. However, Dr. Thorne also has strong evidence for this hinge: she has a stack of validation reports from the IT department, years of consistent performance, and multiple cross-checks with other devices that have always confirmed the laptop's accuracy. If asked, she would readily produce this evidence. Yet, in her daily work, this evidence is not consulted; the hinge proposition stands fast and is not subject to doubt.

  Now, we analyze the case from two perspectives:

  (a) The non-doxastic hinge epistemologist (e.g., Danièle Moyal-Sharrock or Duncan Pritchard) would say that the proposition about the laptop's reliability is a hinge commitment. It is not a belief (in the sense of a doxastic state that can be true or false, justified or unjustified) but rather a non-propositional certainty that is manifest in her actions. For them, hinges are not known because they are the framework within which knowledge claims make sense. The evidence, while present, does not turn the hinge into knowledge because the hinge is not the kind of thing that can be known (it is pre-epistemic, a condition for the possibility of knowledge). The hinge epistemologist would point out that Dr. Thorne does not use the evidence to support the hinge in her practice; the evidence is idle. The hinge is shown in her unhesitating reliance on the laptop, not in any evidential reasoning.

  (b) The doxastic hinge epistemologist (e.g., Annalisa Coliva) would argue that the hinge commitment is a deeply entrenched empirical belief. Given that Dr. Thorne has strong evidence for the laptop's reliability, the doxasticist would say that she does know that the laptop reliably displays accurate data. The doxasticist would note that the evidence is available and would be cited if challenged, and that the depth of entrenchment does not preclude knowledge. The real difference between this and a normal evidence-based belief, according to the doxasticist, is the degree of entrenchment and the fact that the proposition is not typically subject to doubt in the agent's inquiries. But with such evidence, it is a case of knowledge.

  The feature of the case that allows (a) to grant the evidence and still deny knowledge is that the evidence plays no role in the agent's actual reliance on the hinge. For Dr. Thorne, the hinge proposition is not held on the basis of evidence; it is held fast as a pre-condition for her work. The evidence is there, but it is not part of the justification structure that supports her daily actions. The non-doxasticist would say that the hinge is arational and thus not a candidate for knowledge.

  On the other hand, (b) would point to the fact that the agent would produce the evidence if asked as showing that the attitude is doxastic and evidentially based. However, the doxasticist would note that the real difference between this and a normal belief is the depth of entrenchment and the role it plays in structuring inquiry. The doxasticist might say that this is a very well-justified belief that is so central that it is rarely questioned, but it is still a belief and, with the evidence, counts as knowledge.

  Finally, how would a defender of (a) answer the charge that they've defined hinge so that no amount of evidence could ever count? The defender of (a) would say that it is not a matter of the evidence being insufficient, but of the hinge being of a different logical category. Hinges are not propositions that are believed or disbelieved; they are the scaffolding that makes believing and disbelieving possible. Evidence is relevant only within a system of beliefs and doubts, and the hinge is what sets up that system. Thus, even if we have evidence for a hinge, we are using that evidence within a system that already depends on the hinge. Therefore, the evidence cannot ground the hinge without circularity. The hinge must stand fast without being based on evidence for inquiry to proceed. Hence, the non-doxasticist is not setting an impossible standard but recognizing a fundamental aspect of how our epistemic practices work.
answer: |-
  ### Thought Experiment: The Epidemiologist's Laptop

  Dr. Lena Chen, a seasoned epidemiologist, is tracking the spread of a novel zoonotic virus in a rural region. Her daily workflow—analyzing infection clusters, modeling transmission rates, and issuing public health advisories—rests entirely on her decade-old field laptop, which she uses to access real-time data from a network of health sensors. The proposition "this laptop reliably transmits and displays accurate sensor data" functions as a hinge commitment for Lena: it stands fast, exempt from doubt, and structures every inquiry she makes (e.g., she never pauses to verify the laptop’s basic functionality before interpreting data, nor does she entertain skepticism about its readings when forming hypotheses). Crucially, Lena possesses strong, citable evidence for this hinge: she has years of validation reports from IT audits, cross-checks against independent lab tests confirming the laptop’s accuracy, and a flawless track record in past outbreaks where its data directly led to successful interventions. If challenged, she would confidently present this evidence—yet in practice, she never consults it. Her reliance on the laptop is immediate and pre-reflective, like breathing; the evidence exists but remains inert, gathered "just in case" rather than actively supporting her conviction.

  ### Analysis of the Case

  **(a) Non-doxastic hinge epistemologist (e.g., Danièle Moyal-Sharrock):**  
  This view holds that hinge commitments are non-doxastic certainties—they are *acted upon* but not believed or known. For Lena, the laptop’s reliability is a hinge because it is *shown* in her unhesitating use of it as a tool for inquiry (e.g., she structures models around its data without testing its foundations). The evidence Lena has is irrelevant to its hinge status: hinges are not justified propositions but the "bedrock" enabling justification. Thus, even with strong evidence, the hinge cannot be "known" because knowledge requires doubt and justification, whereas hinges are the undoubted framework *for* doubt and justification. The evidence is merely a contingency; Lena’s certainty is embodied in her actions, not in her evidence-based reasoning.

  **(b) Doxastic hinge epistemologist (e.g., Annalisa Coliva):**  
  This view treats hinges as deeply entrenched empirical beliefs that *can* be known when supported by evidence. Lena’s laptop proposition is a hinge due to its role in structuring her inquiries (e.g., it’s immune to revision during her work), but it is still a belief—and her robust evidence means she *knows* the laptop is reliable. The difference between this and a "normal" belief is the hinge’s *functional invulnerability*: while ordinary beliefs are revised with counterevidence, Lena’s hinge belief is so foundational that she would dismiss contradictory data as sensor errors or hacking rather than doubt the laptop itself. Her evidence is active (she’d cite it if challenged), but the hinge’s entrenchment makes it resilient in a way typical beliefs aren’t.

  ### Key Features and Responses

  - **How (a) denies knowledge despite evidence:** The non-doxasticist points to the **functional inertia of the evidence**—Lena’s certainty operates independently of her evidence. Her hinge is enacted through her unchallenged reliance on the laptop (e.g., she never uses the reports to *bolster* her trust mid-inquiry), making it a pre-epistemic condition for evidence-based reasoning. Evidence here is "idle"; it doesn’t sustain the certainty, which is why it can’t convert the hinge into knowledge.  
  - **What (b) identifies as the hinge’s uniqueness:** The doxasticist argues the real difference from normal beliefs is the **asymmetric resilience** of the hinge. If Lena encountered a conflicting report, she’d question the report (e.g., "the sensors must be faulty") rather than the laptop, whereas a normal belief (e.g., "the virus spreads via aerosols") would be revised with new data. This entrenchment, not the evidence itself, defines the hinge.  

  **Defending (a) against the charge of "defining away" evidence:**  
  A non-doxasticist would reply that hinges *by nature* cannot be evidentially supported without circularity. Evidence only functions *within* a framework of hinges (e.g., Lena’s evidence assumes the reliability of her senses, memory, and logic). Demanding evidence for hinges misunderstands their role: they are not "claims" to be justified but the basis for justification. If evidence could validate a hinge, it would tacitly rely on that very hinge (e.g., Lena’s validation reports presuppose the laptop’s reliability to be read). Thus, the issue isn’t insufficient evidence but a category error—hinges are *enacted certainties*, not propositions awaiting proof.
