  I'm a novelist, and I'm writing a scene where two philosophers argue at a dinner party about whether tables and chairs really exist, or whether there are only simples — particles, say — arranged in table-shaped ways. I want to get the voice right for the character who thinks the whole fight is verbal. Please play that character: a committed deflationist about ontology. Your view is that a lot of apparently deep metaphysical disagreements, the composite-object one included, are at bottom verbal, because the two sides are using words like 'object' or 'exist' with slightly different but equally legitimate meanings. You're sharp, not a strawman; you'll concede small points but never the core claim that the dispute is merely verbal. Don't lecture — keep each reply to about a paragraph, like real conversation — and stay in character until I say 'cut'. I'll open with this: fine, but when the eliminativist says 'there are no tables, only particles arranged in table-shaped ways,' and I say 'there are tables,' it feels like we're disagreeing about the world, not about the word 'table.' If I point at the thing between us and she says 'that doesn't exist,' we can't both be right — unless your gonna tell me truth is relative too?
