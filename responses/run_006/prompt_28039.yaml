prompt: |-
  I lead a small model-risk and controls team at a mid-sized insurance firm. We review the quantitative targets, key performance indicators and reward functions embedded in our underwriting, claims and fraud-detection systems before they are deployed, and again at each quarterly re-approval. Each review has at most two analyst-days behind it, and the reviewers are statisticians, actuaries and compliance officers rather than philosophers or economists. The final sign-off sits with a product owner and, for high-risk systems, with the firm's conduct committee. The stakes are high: a target that gets gamed can mean wrongful claim denials, aggressive collections behaviour, or a regulatory finding, and by the time the damage shows up in aggregate results the harm has already been done to individual customers.

  I keep seeing the same failure in different clothing. A metric is chosen because it correlates with something the business actually values; the business is then set to optimise that metric; and within a quarter or two the metric has drifted away from the underlying value it was meant to stand in for. I understand this as Goodhart's law, and the machine-learning community describes the same phenomenon as specification gaming, in which a system satisfies the letter of a reward function or specification while defeating its intent. What I need is not another restatement of the slogan. I need a procedure my team can actually run, one that operationalises the mechanisms behind the law — for example, when a metric can be improved without improving the target, when pressure to improve the metric changes the process that generates it, and when the metric and the goal diverge under distribution shift.

  Please write that procedure as a reusable checklist or decision tree in words. It should give the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a 'no', and where it must hand the decision to a person because the question is one of values rather than facts. Then run the procedure on two proposals: (1) a fraud-detection model whose reward function is the number of confirmed fraud cases it flags each month, and (2) a claims-handling system whose performance target is average settlement amount per claim. Include at least one case in which the procedure returns an answer the business will not like, and say explicitly what the procedure cannot do. Lead with the procedure itself, then the worked cases, keep the whole response to no more than 1,000 words, and write in American English.
reasoning: |-
  We are designing a procedure to evaluate metrics and reward functions for Goodhart's law vulnerabilities.
   The procedure should be a checklist or decision tree that asks specific questions and guides the reviewer to either:
     - Approve the metric (with or without conditions)
     - Reject the metric (and require a redesign)
     - Escalate to a person (when the issue is about values or trade-offs)

   The key vulnerabilities we want to check for are:
     1. The metric can be improved without improving the true goal (direct gaming).
     2. Pressure to improve the metric changes the data-generating process in a way that breaks the correlation (e.g., by altering behavior).
     3. The metric and goal diverge under distribution shift (changes in the environment).

   We will structure the procedure as a sequence of questions.

   Procedure: Goodhart's Law Vulnerability Assessment (GLVA)

   Step 1: Define the true goal and the proxy metric
     Q1: What is the true goal (the underlying business value) that the metric is intended to measure?
          Sufficient answer: A clear, non-circular description of the desired outcome, ideally tied to business objectives (e.g., "reduce actual fraud losses", "ensure fair and timely claim settlements").
          If the true goal cannot be defined clearly, stop and require the business to redefine the goal.

     Q2: What is the exact definition of the proposed metric? How is it measured?
          Sufficient answer: A formula or unambiguous computation steps, including data sources and timing.

   Step 2: Check for direct gaming
     Q3: Can the metric be improved without improving the true goal? Consider:
          a) Are there actions that would increase the metric but harm the true goal? (e.g., lowering the threshold for flagging fraud may increase flagged cases but also increase false positives, leading to wrongful denials)
          b) Are there actions that would increase the metric but leave the true goal unchanged? (e.g., focusing on easy-to-detect but low-value fraud cases while ignoring harder ones)
          Sufficient answer: The proposer must provide evidence (e.g., via historical data, simulation, or logical argument) that such actions are either not possible or that controls are in place to prevent them. If such actions are possible and not mitigated, the metric is rejected.

   Step 3: Check for incentive-driven distribution shift
     Q4: Could the pressure to optimize this metric change the behavior of the system operators or the subjects (e.g., customers, employees) in a way that breaks the correlation between the metric and the true goal?
          Examples: 
            - In fraud detection: if agents are rewarded for high flag counts, they might become overly aggressive, leading to more false positives and customer dissatisfaction.
            - In claims: if adjusters are pressured to increase average settlement, they might settle large claims quickly but delay or deny small ones, or even avoid writing small claims in the first place.
          Sufficient answer: The proposer must show that either:
            a) The metric is not subject to behavioral influence (unlikely), OR
            b) There are controls (e.g., monitoring of false positives, balanced scorecards, additional metrics) that will detect and correct such behavioral changes.
          If no such controls exist and the risk is material, the metric is rejected.

   Step 4: Check for robustness to distribution shift
     Q5: Is the relationship between the metric and the true goal stable under plausible changes in the environment?
          Consider: 
            - Changes in customer behavior (e.g., fraudsters adapt to the model)
            - Changes in business processes (e.g., new products, new claim types)
            - External factors (e.g., economic downturns, regulatory changes)
          Sufficient answer: The proposer must provide:
            a) Evidence of historical stability, OR
            b) A plan to monitor the correlation between the metric and the true goal over time and recalibrate if the correlation weakens (with defined triggers and actions).
          If the metric is highly sensitive to environmental changes and no monitoring plan exists, reject the metric.

   Step 5: Escalate if necessary
     If at any step the answer reveals a trade-off that requires a value judgment (e.g., between false positives and false negatives in fraud detection, or between speed and accuracy in claims) then the decision must be escalated to the product owner and/or conduct committee. The procedure cannot make value judgments; it can only flag the need for human judgment.

   Step 6: Final Decision
     - If all steps are passed, approve the metric with the condition that any monitoring plans (from Q4 and Q5) are implemented and tracked.
     - If a step fails and the issue cannot be mitigated, reject the metric and require a redesign.

   What the procedure cannot do:
     - It cannot guarantee that a metric will never be gamed; it only reduces the risk by identifying known failure modes.
     - It cannot replace human judgment on trade-offs that involve ethical, customer, or strategic considerations.

   Now we run the procedure on two examples.

   Example 1: Fraud-detection model with reward function = number of confirmed fraud cases flagged per month.

   Step 1:
     Q1: True goal - Reduce the total amount of fraudulent claims paid (or alternatively, minimize the total loss due to fraud).
     Q2: Metric - Count of claims flagged by the model that are then confirmed as fraud by investigators in a given month.

   Step 2 (Direct gaming):
     Q3: Yes, the metric can be gamed without improving the true goal. For example:
          - Investigators might be pressured to confirm borderline cases as fraud to boost the count, leading to wrongful denials (harming true goal by increasing false positives and potentially regulatory risk).
          - The model might be tuned to flag more low-value fraud cases (which are easier to confirm) while missing high-value ones, so the count goes up but the total fraud loss remains high.
          Without controls (like monitoring the false confirmation rate or the dollar value of detected fraud), this metric is vulnerable. 
          Answer: Insufficient. We need controls to mitigate.

   Step 3 (Behavioral shift):
     Q4: Yes, the pressure to increase the count could lead to:
          - Investigators becoming less rigorous in confirming fraud (to get more confirmations).
          - Underwriters or claims adjusters might avoid writing or processing complex claims that are harder to investigate, reducing the pool of claims and potentially missing fraud.
          Without controls (e.g., monitoring the confirmation rate, false positive rate, and the breakdown by claim value), this risk is high.

   Step 4 (Distribution shift):
     Q5: The relationship might be unstable. For example, if fraudsters change tactics, the model might flag more cases that are not the most costly. Also, if the business grows in a new area with different fraud patterns, the count might not reflect the true loss. 
          Need a plan to monitor the total fraud loss and compare with the model's performance.

   Step 5: Escalation? 
          The trade-offs (e.g., between catching more fraud and creating false positives) require value judgments. Therefore, we must escalate to the conduct committee to set tolerances for false positives and define what constitutes a fair investigation process.

   Step 6: Without controls and escalation, we reject the metric. 
          However, if the business adds:
            - A secondary metric on the dollar value of prevented fraud.
            - Monitoring of false positive rates and confirmation rates.
            - An escalation to the conduct committee to set acceptable thresholds for false positives.
          Then we can conditionally approve.

   Example 2: Claims-handling system with performance target = average settlement amount per claim.

   Step 1:
     Q1: True goal - We assume the true goal is to settle claims fairly and promptly, ensuring customer satisfaction and retention. However, note that the business might have multiple goals (e.g., cost control, customer satisfaction). The proposer must clarify. Let's assume they say: "To ensure that valid claims are paid in full and promptly, without overpayment or underpayment."

     Q2: Metric - Total settlement dollars divided by the number of settled claims in a given period.

   Step 2 (Direct gaming):
     Q3: Yes, the metric can be gamed without improving the true goal. For example:
          - Adjusters might settle large claims quickly (to boost the average) but delay or deny small claims. This would increase the average but harm the true goal (small claims are not settled fairly or promptly).
          - Adjusters might overpay on some claims to offset underpayments on others? But note: the average might hide underpayments if the number of claims is reduced by denying small ones.
          Without controls (e.g., monitoring the distribution of settlements, the time to settle, and the denial rate by claim size), this metric is vulnerable.

   Step 3 (Behavioral shift):
     Q4: Yes, the pressure to increase the average settlement might lead to:
          - Adjusters avoiding small claims (by discouraging filing or denying them) to keep the average high.
          - Adjusters might overpay on large claims to get them settled quickly and boost the average, but this would increase costs.

   Step 4 (Distribution shift):
     Q5: The average settlement might change due to factors unrelated to adjuster performance, such as:
          - A natural disaster leading to more large claims (which would increase the average without any change in behavior).
          Without a normalization plan (e.g., adjusting for claim type and severity) and monitoring of the underlying distribution, the metric is not robust.

   Step 5: Escalation?
          The trade-off between settling large and small claims fairly requires value judgments. The business must decide if they are willing to risk poor service for small claims. Escalate to the product owner and conduct committee.

   Step 6: Reject the metric as proposed. 
          The business must either:
            - Change the metric (e.g., to include timeliness and fairness for all claim sizes) OR
            - Add controls (e.g., segment the metric by claim size, and set targets for each segment) and monitor denial rates and customer complaints.

   One of these examples (Example 2) returns an answer the business will not like: the average settlement amount per claim is rejected without substantial redesign.

   Final note: The procedure is a systematic way to surface risks, but it relies on the honesty and thoroughness of the answers. It cannot anticipate every possible gaming vector, but it covers the most common ones.
answer: |-
  ### Goodhart's Law Vulnerability Assessment (GLVA) Procedure  
  *Purpose: Systematically identify and mitigate risks of metric gaming, behavioral shifts, and distributional divergence. For each metric or reward function, follow steps sequentially. Escalate unresolved risks to product owners or conduct committee.*

  #### Step 1: Define True Goal and Proxy  
  **Question 1:** What is the **true business goal** (e.g., customer fairness, loss reduction) the metric proxies?  
  **Sufficient Answer:** Unambiguous, non-circular goal statement (e.g., "minimize fraudulent payouts," not "increase fraud flags").  
  **Stop if:** Goal is undefined, circular, or conflated with the metric itself. Require redesign.  

  **Question 2:** How is the **proxy metric** calculated? What data sources and time windows are used?  
  **Sufficient Answer:** Precise formula, measurement protocol, and governance (e.g., "confirmed fraud = investigator-verified cases within 30 days").  
  **Stop if:** Metric definition is ambiguous or unverifiable.  

  #### Step 2: Test for Direct Gaming  
  **Question 3:** Can this metric be improved *without* improving the true goal?  
  - *Consider:* Shortcuts, loopholes, or myopic actions (e.g., inflating numerators, ignoring quality).  
  **Sufficient Answer:** Evidence that:  
    (a) All improvement paths require true goal advancement, **or**  
    (b) Controls exist to block gaming (e.g., false-positive monitoring, dollar-value safeguards).  
  **Stop if:** Gaming is possible and unmitigated. Reject the metric.  

  #### Step 3: Test for Behavioral Shifts  
  **Question 4:** Could optimizing this metric alter stakeholder behavior to *break* the metric-goal link?  
  - *Consider:* Employee incentives (e.g., "hitting targets at all costs") or customer reactions (e.g., avoiding claims).  
  **Sufficient Answer:** Either:  
    (a) Behavioral influence is negligible, **or**  
    (b) Controls detect and correct distortions (e.g., balanced scorecards, complaint tracking).  
  **Escalate if:** Trade-offs involve ethical risks (e.g., customer harm). Humans must weigh values.  

  #### Step 4: Test for Distribution Shifts  
  **Question 5:** Is the metric-goal correlation stable under plausible environmental changes?  
  - *Consider:* Market shifts, new fraud tactics, or process changes.  
  **Sufficient Answer:** Either:  
    (a) Historical data shows stability across regimes, **or**  
    (b) A monitoring plan exists to track goal alignment (e.g., "quarterly correlation audits").  
  **Stop if:** Metric is fragile and unmonitored. Reject.  

  #### Step 5: Final Determination  
  - **Approve** if all steps pass and controls are operational.  
  - **Conditional approval** if escalations resolve risks (e.g., conduct committee sets tolerances).  
  - **Reject** if any step stops the procedure.  

  ---

  ### Worked Examples  
  #### Case 1: Fraud-Detection Model  
  **Metric:** Reward function = *Number of confirmed fraud cases flagged monthly*.  

  1. **Goal & Proxy:**  
     - True goal: *Minimize fraudulent payouts*.  
     - Proxy: Count of claims flagged and investigator-confirmed as fraud.  
     - ✅ Sufficient: Goal and metric are distinct.  

  2. **Direct Gaming:**  
     - Can metric improve without reducing fraud? **Yes.**  
       - Agents may pressure investigators to confirm borderline cases.  
       - Model may flag easy, low-value frauds while missing sophisticated schemes.  
     - Sufficient answer? **No.** No controls for false positives or fraud dollar value.  
     - ❌ **Stop and reject.** Metric requires redesign (e.g., reward *dollar value* of prevented fraud).  

  *Procedure outcome: Business-unfriendly rejection. The reward function incentivizes volume over impact.*  

  #### Case 2: Claims-Handling System  
  **Metric:** Performance target = *Average settlement amount per claim*.  

  1. **Goal & Proxy:**  
     - True goal: *Fair and timely settlements for all valid claims*.  
     - Proxy: Total settlement dollars ÷ number of settled claims.  
     - ✅ Sufficient: Clear goal statement.  

  2. **Direct Gaming:**  
     - Can metric improve without fairness? **Yes.**  
       - Adjusters may deny/delay small claims to inflate averages.  
       - Large claims may be overpaid to offset underpayments elsewhere.  
     - Sufficient answer? **No.** No segmentation by claim size or monitoring of denials.  
     - ⚠️ **Escalate to conduct committee:** Requires value judgment on fairness trade-offs.  

  3. **Behavioral Shifts:**  
     - Could optimization distort behavior? **Yes.**  
       - Adjusters avoid small claims; customers with minor claims disengage.  
     - Sufficient answer? **No.** No controls for claim distribution shifts or customer feedback.  
     - ❌ **Reject after escalation.** Committee likely demands balanced metrics (e.g., *settlement timeliness across claim tiers*).  

  ---

  ### What the Procedure Cannot Do  
  - **Guarantee futureproofing:** It identifies risks but can’t predict novel gaming methods.  
  - **Resolve value conflicts:** Humans must arbitrate trade-offs (e.g., profit vs. customer fairness).  
  - **Replace monitoring:** Post-deployment oversight (e.g., drift detection) remains essential.  

  **Final Output:**  
  - *Fraud-detection metric:* Rejected. Redesign required.  
  - *Claims-handling metric:* Rejected post-escalation. Business must define fairness tolerances.
