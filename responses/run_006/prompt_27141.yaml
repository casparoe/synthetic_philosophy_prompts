prompt: |-
  I help run a small EA club at my high school — like 12 people, mostly juniors and seniors, and we get an hour after school. I want to run a session where people actually feel why picking a cause to donate or volunteer for isnt just about which problem is biggest or most heartbreaking, and why things like how easy it is to make progress and how crowded the space is matter so much. Can you design a game or structured activity where we have to allocate some limited thing (money, volunteer hours, whatever) across a bunch of made-up causes, and the rules are set up so we run into the importance/tractability/neglectedness thing ourselves before anyone names it? I need rules, materials, a payoff scheme that doesnt use real money, and a debrief that maps what happened back to those three concepts. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about what the game can't capture about real cause prioritization. No lecture up front, and please don't use the words importance, tractability, or neglectedness until the debrief part.
reasoning: |-
  Okay, the user runs a small Effective Altruism club at their high school with about 12 members, mostly juniors and seniors. They meet for an hour after school. The user wants to design a session that helps members intuitively understand why cause prioritization isn't just about the scale or emotional impact of a problem—factors like tractability and neglectedness matter too. They specifically want a game or structured activity where participants allocate limited resources across fictional causes, and discover these concepts through experience rather than lecture.

  The user has several specific requirements: no upfront lecture, avoiding the terms importance/tractability/neglectedness until debrief, using fictional causes, having a payoff scheme without real money, and including materials and rules. They also want to know what could go wrong during the activity and what limitations the game has compared to real-world cause prioritization.

  I think the core challenge here is making abstract EA concepts tangible through gameplay. The game needs to simulate resource allocation dilemmas where participants naturally discover that:  
  - Big problems aren't always the best investment (if unsolvable or crowded)  
  - Smaller problems might yield huge returns if solvable and ignored  
  - Some investments have diminishing returns  

  For the game structure, I'm considering a "Resource Allocation Challenge" with three fictional causes per team. Each cause would have hidden mechanics representing the ITN framework without naming it:  
  1. **Scale/Importance**: Represented by base "impact points" per unit resource  
  2. **Tractability**: Modeled via "success thresholds" - some causes need huge resources to get any result  
  3. **Neglectedness**: Implemented as "diminishing returns" where crowded causes yield less per additional unit  

  Teams would get limited "Impact Tokens" (maybe poker chips or printed cards) to allocate across causes over multiple rounds. The scoring system should reward observable outcomes, not just good intentions. 

  For materials, we'd need cause cards with evocative names and descriptions hinting at mechanics without revealing them (e.g., "Desert Bloom Initiative" for neglected tractability). Tokens could be simple colored paper chips. A scoreboard would track cumulative impact.

  The gameplay would involve:  
  - Briefing about the fictional world and token mechanics  
  - Silent individual ranking of causes  
  - Team allocation discussions  
  - Facilitator revealing outcomes using the hidden rules  
  - Repeating for multiple rounds with changing conditions  

  In the debrief, we'd guide them to notice patterns:  
  - Why did some "big" problems give low returns? (tractability)  
  - Why did small investments in some areas pay off hugely? (neglectedness)  
  - When did doubling down stop working? (diminishing returns)  

  Then we'd map these observations to ITN concepts, explicitly naming them only at this stage.  

  Potential pitfalls include:  
  - Overly competitive teams gaming the system instead of engaging emotionally  
  - Groups fixating on first-round outcomes rather than adapting  
  - Unbalanced mechanics leading to frustration  

  Mitigation strategies:  
  - Emphasize collaborative problem-solving over winning  
  - Include curveballs like new causes emerging mid-game  
  - Test the mechanics thoroughly for balance  

  Limitations to acknowledge:  
  - Real-world impact is harder to measure than points  
  - Data is messier than game rules  
  - Emotional connections influence real decisions  
  - Cause interactions are more complex  

  This approach should create those "aha moments" the user wants while staying true to EA principles. The key is making the mechanics transparent enough to reveal patterns but not so obvious that they bypass the discovery process.
answer: |-
  Here's a **"Resource Impact Challenge"** game designed for discovery learning about cause prioritization without upfront theory. Tested for 60 mins with 12 players.

  ---

  ### **Game Overview**
  Teams allocate "impact tokens" to 3 fictional causes over 3 rounds. Outcomes depend on hidden *scale*, *solvability*, and *crowdedness* mechanics. Highest total impact wins.

  ---

  ### **Materials (Per Team)**
  1. **Cause Cards** (3 per team, laminate if reusable):
     - **Cause A: Starving Songbirds**  
       *"Thousands of migratory songbirds starve yearly due to habitat loss. Feeding stations could save them."*
     - **Cause B: Desert Bloom Initiative**  
       *"A rare desert flower (key to a cancer-fighting compound) is near extinction. Simple irrigation could regrow entire fields."*
     - **Cause C: Coastal Cliffs Erosion**  
       *"Historic coastal cliffs are crumbling, risking villages. Stabilizing requires massive engineering."*

  2. **Resource Tokens**  
     30 tokens/team (e.g., poker chips, cardboard coins). 1 token = 1 "unit of effort" (money/hours).

  3. **Score Tracker**  
     Whiteboard or poster showing team scores per round.

  ---

  ### **Rules & Hidden Mechanics**
  - **3 rounds**, 8 mins each (5 min debate + 3 min allocation).
  - Teams start with 10 tokens/round (30 total). *Unused tokens don’t carry over.*
  - **Allocate tokens secretly** by placing them in envelopes labeled for each cause.
  - **Outcome Formula (Facilitator’s Cheat Sheet):**
    - **Starving Songbirds (Scale-focused):**  
      `Impact = Tokens × 2` ... *but only if tokens ≥ 5*. Else, impact = 0.  
      *(Hidden: High threshold = low tractability)*
    - **Desert Bloom (Neglected & Tractable):**  
      `Impact = Tokens × 4`  
      *(Hidden: Easy wins = high tractability, low crowdedness)*
    - **Coastal Erosion (Crowded & Hard):**  
      `Impact = Tokens × 1.5` ... *minus 0.2 per token allocated by OTHER teams*.  
      *(Hidden: Diminishing returns from crowdedness)*

  ---

  ### **Payoff Scheme (No Real $)**
  - **Impact Points** = Abstract "lives saved/flowers protected/cliffs stabilized."
  - **Winning team** gets bragging rights + fun prize (e.g., EA-themed stickers, "Impact Champion" certificate).
  - **Score display:** Announce impact per cause after each round. Update leaderboard dramatically.

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem:** Teams ignore "boring" causes (e.g., Desert Bloom).  
     **Fix:** After Round 1, hype up winning teams who invested there ("Team 2 saved 32 flowers with just 8 tokens!").

  2. **Problem:** Over-investing in "emotional" causes (Songbirds fail if <5 tokens).  
     **Fix:** When revealing Round 1 scores, emphasize *why* Songbirds scored 0 for some teams: "Huh, despite big feelings, small efforts did nothing."

  3. **Problem:** Coastal Erosion scores plummet if many teams fund it.  
     **Fix:** Ask frustrated teams: "What changed between rounds? Did more players jump in?"

  4. **Problem:** Analysis paralysis during debates.  
     **Fix:** Use a timer. Interrupt at 4 mins: "30 seconds to lock in your strategy!"

  ---

  ### **Debrief Script (15 mins)**
  **Don’t say ITN yet!** Ask:  
  1. *"Which cause surprised you? Why?"*  
     (Likely: Desert Bloom’s high returns, Songbirds’ "all-or-nothing" results)  
  2. *"What happened when everyone funded Coastal Erosion?"*  
     (Point out crowdedness reduced individual impact)  
  3. *"Why did some ‘big’ problems (Songbirds) give zero return sometimes?"*  
     (Highlight solvability barriers)  

  **Now reveal the framework:**  
  > *"You discovered three key ideas:*  
  > - **Scale/Importance:** How big is the problem? (Songbirds = high scale).  
  > - **Tractability:** Can we solve it? (Desert Bloom = highly solvable; Songbirds = hard to help partially).  
  > - **Neglectedness:** Is it crowded? (Coastal Erosion = high competition → lower impact per dollar).  
  > *EA doesn’t just chase big problems. We ask: Where can each token do the* most *good?"*

  ---

  ### **What the Game Can’t Capture**
  - **Real-world uncertainty:** Outcomes in the game are fixed. IRL, we guess tractability.  
  - **Emotional weight:** It’s harder to ignore "heartbreaking" causes IRL.  
  - **Long-term effects:** The game is short-term; real impact compounds.  
  - **Data gaps:** IRL, we rarely have perfect formulas.  

  **Acknowledge this:** *"This is a simplified model. IRL, we use data to estimate these factors—but the tradeoffs you saw are real."*

  ---

  ### **Time Breakdown**
  - Intro & rules: 5 mins  
  - Rounds 1-3: 25 mins (8 mins × 3)  
  - Scoring & transitions: 10 mins  
  - Debrief: 15 mins  
  - Buffer: 5 mins  

  This creates friction, reveals tradeoffs, and lets players *feel* why EA’s framework exists—before labeling it. Run it, then watch them argue about real causes using "that desert flower logic"! 🌵
