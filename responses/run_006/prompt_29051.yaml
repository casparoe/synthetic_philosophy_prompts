answer: |-
  This is a deep and persistent puzzle in legal philosophy and causation theory. The law's differential treatment of acts and omissions, particularly regarding causation, rests on several conceptual layers. Here's a breakdown of the prevailing theories, their compatibility with the practice, the state of scholarly debate, and the question of internal consistency:

  **1. What Theory Does the Practice Presuppose?**

  The practice itself doesn't neatly commit to a single, universally accepted philosophical theory of causation. Instead, it reflects a pragmatic *legal* concept of causation that blends factual and normative elements. However, the strongest arguments point towards a combination:

  *   **Primarily: Factual "But-For" Causation + Normative Duty as a Separate Liability Filter (Your Third Option, Refined):**
      *   **Core Consensus:** There is broad agreement among theorists and practitioners that at the *factual*, *counterfactual* ("but-for") level, **both positive acts and omissions can be necessary conditions for an outcome.** But-for your omission to throw the ring (when you had the ability), the victim wouldn't have drowned. This counterfactual dependence holds *regardless* of legal duty. This is the minimal settled ground.
      *   **The Legal Move:** The law, however, does *not* treat every but-for cause as a *legal* cause sufficient for liability. It imposes an additional filter: **the existence of a legally recognized duty.**
      *   **Why This View Fits:** This explains the structure of the rules. The prosecution must *first* establish factual causation (but-for the omission, death would not have occurred when it did). *Then*, they must prove the defendant had a specific legal duty to act. Only if *both* are satisfied is the omission treated as legally causative for liability purposes (e.g., gross negligence manslaughter by omission).
      *   **Causation Labeling:** Proponents argue the law isn't changing the *meaning* of causation itself when it attaches liability for omissions under a duty. It's saying that *only* when such a duty exists is the failure to act, which was factually a but-for cause, something the law will hold you responsible for *as if* you caused it by a positive act. The label "causation" is applied to the overall legal conclusion of responsibility, incorporating the duty element.

  *   **Challenged By: The Normative Causation Theory (Your Second Option):**
      *   **The Argument:** Scholars like Tony Honoré (building on H.L.A. Hart) argue that causation in law is inherently normative. What counts as "causing" an outcome depends partly on our ideas about responsibility, which are tied to norms of conduct. A duty defines the scope of our responsibility. Therefore, *only when a duty exists* can an omission be considered a *cause* in the legally relevant sense. The duty isn't just a separate filter; it fundamentally changes whether the omission qualifies as a cause *at all* within the legal framework.
      *   **Why It Appeals:** This directly explains the linguistic practice: courts *say* "D caused V's death by omission" only when a duty exists. It captures the intuition that morally and legally, failing to rescue a stranger feels fundamentally different from pushing someone in.
      *   **Criticism:** Critics (like Michael Moore) argue this conflates causation (a factual relation) with responsibility/liability (a normative judgment). They maintain factual causation (but-for) exists independently, and the duty requirement is purely about when we *hold someone responsible* for that factual cause.

  *   **Largely Rejected: Omissions Aren't Genuine Causes (Your First Option):**
      *   **The Argument:** Some metaphysicians argue that omissions are absences, and absences cannot exert force or energy, thus cannot be genuine causes. The law, on this view, merely *fictions* causation for policy reasons when a duty exists to punish blameworthy inaction.
      *   **Why It Doesn't Fit:** This clashes directly with legal doctrine and language. Courts *do* frame liability as "causing death by omission" when a duty exists. They treat the omission as the operative causal factor leading to the result within the chain of events for which the defendant is held responsible. They are not saying "You didn't cause it, but we'll punish you anyway." The concept of "causing by omission" is embedded in the law.

  **2. State of Scholarly Debate:**

  *   **Settled:**
      1.  **But-for (Factual Causation) Applies to Omissions:** Almost universally accepted that an omission can be a necessary condition (but-for cause) for an outcome.
      2.  **Liability for Omissions Requires a Legal Duty:** This is a bedrock principle in criminal and tort law across common law jurisdictions.
      3.  **Policy Drives the Duty Requirement:** The law limits duties to act to prevent overwhelming burdens and preserve individual autonomy, except where relationships or prior conduct create special responsibilities. This is uncontroversial as the *reason* for the rule.

  *   **Hotly Contested:**
      1.  **The Philosophical Nature of Legal Causation:** Is "legal cause" purely descriptive (based on counterfactuals and physical processes) or inherently normative (incorporating duties and responsibilities)? This is the core debate between the "Separate Filter" view (Moore) and the "Normative Causation" view (Hart & Honoré).
      2.  **Does "Causing by Omission" Involve a Fiction?** While the "pure absence" view is largely rejected *within legal theory*, the debate continues about whether labeling an omission a "cause" stretches the concept beyond its natural meaning, even with a duty. Most legal theorists accept it as a valid legal concept, but philosophers of causation remain divided.
      3.  **The Scope of Duties:** Where precisely the lines of duty should be drawn (e.g., bystanders vs. special relationships, how "easy" the rescue must be) is perennially debated, but this is more about policy than the core concept of causation itself.

  **3. Is the Practice Internally Consistent?**

  The law displays significant *tension*, though arguably *functional* consistency within its own pragmatic framework:

  *   **Apparent Inconsistency:** The core inconsistency you identified is real: the same physical sequence (person drowns, able bystander does nothing) is treated as non-causative without duty and causative with duty. This is hard to reconcile with a purely physicalist or counterfactual theory of causation *without* incorporating the duty normatively.
  *   **Consistency Through Legal Doctrine:**
      *   **Structure:** The law consistently applies the same two-step test: (1) Factual causation (but-for) + (2) Legal causation (which includes foreseeability, proximate cause for acts, and *duty* for omissions). This structural uniformity provides internal doctrinal consistency.
      *   **Duty as Defining Responsibility:** The law consistently views the existence of a duty as defining the sphere within which your inaction becomes legally relevant to the outcome. Without duty, your inaction is legally inert regarding that outcome, regardless of factual but-for status.
      *   **Avoiding Over-Extension:** The duty requirement consistently prevents the law from imposing a general duty to rescue, upholding a core principle of negative liberty.
  *   **Points of Strain (Inconsistencies in Application/Logic):**
      *   **Medical Cases:** Courts sometimes struggle when doctors omit treatment leading to death. They often strain to find an affirmative "act" (like turning off a ventilator) to avoid the omission/duty problem, revealing discomfort with pure omission liability even where a duty clearly exists.
      *   **"Creating the Danger":** The duty to act sometimes arises if you created the peril (e.g., pushing someone in). This blurs the line, as the initial act *is* a but-for cause, and the omission might be seen as a *failure to remedy* the situation you caused, making the omission analysis feel secondary.
      *   **Linguistic Ambiguity:** Judges sometimes slip between saying "the omission *caused* the death" and "the defendant is *liable for* the death caused by their omission," reflecting the underlying theoretical tension.

  **Conclusion:**

  The practice **strongly presupposes a hybrid model**:

  1.  **Factual Causation (But-For):** Applies universally to both acts and omissions as a necessary condition for liability. (Widely settled).
  2.  **Legal Causation & Liability:** Incorporates normative elements. For omissions, the **existence of a specific legal duty is a necessary precondition** for treating that omission as the *legal cause* of the harm. It functions primarily as a **separate, normative liability filter** applied *after* factual causation is established. However, the law's language ("causing by omission") and the integral role of duty in establishing the causal link for liability give significant credence to the view that **legal causation itself incorporates normative considerations** (like duty) that define the scope of responsibility.

  While there's consensus on the *doctrinal rules* (but-for + duty for omissions), the **fundamental philosophical nature of causation in law remains contested**, primarily between the "separate filter" view and the "normative causation" view. The practice is **functionally consistent within its doctrinal structure** but displays **logical tension and points of strain** that reflect the unresolved philosophical conflict at its core. It is a pragmatic solution to a profound metaphysical and ethical problem, not a deduction from a single, uncontested theory of causation.
