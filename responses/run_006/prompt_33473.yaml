prompt: |-
  I am a decision theorist who works with expected utility theory, social welfare orderings, and population axiology. I keep encountering the claim that the procreation asymmetry — roughly, that there is a moral reason not to bring a miserable person into existence but no symmetric moral reason to bring a happy person into existence — poses a deep problem for total utilitarianism and resists clean formalization. Restate the asymmetry itself, and the main philosophical attempts to account for it (person-affecting views, the independence of the asymmetry from person-affecting intuitions, critical-level and critical-range theories, the view that the asymmetry tracks a difference between reasons and requirements, and so on), in the vocabulary I actually use: utility functions defined over populations, social welfare relations, dominance, Pareto principles, betterness and neutrality, and the formal structure of population axiology. For each attempt, tell me what translates cleanly into my framework, what can be expressed only by stretching or gerrymandering the formalism, and what has no counterpart at all. Then give me the residue report: when the asymmetry resists translation, is that because my framework is missing a genuine normative structure, or because the asymmetry is less precise than its philosophical proponents take it to be?
reasoning: |-
  Okay, the user is a decision theorist specializing in expected utility theory, social welfare orderings, and population axiology. They're grappling with the procreation asymmetry and how it challenges total utilitarianism. The asymmetry suggests that while there's a moral reason against creating a miserable person, there isn't a symmetric reason to create a happy one. The user wants this explained in formal terms: utility functions, social welfare relations, Pareto principles, etc.

  First, I need to restate the asymmetry formally. For a utility level below zero (miserable), creating such a person is bad. But for a utility above zero (happy), creating them isn't good—it's neutral. Total utilitarianism would say creating any happy person is good since it increases total utility, so that's the conflict.

  Now, the main philosophical attempts to account for this. Person-affecting views argue that morality only concerns existing people. Creating a person doesn't benefit them because they didn't exist before. But how to formalize this? Maybe adding a neutral range or critical level. Critical-level theories set a positive threshold (α>0) where creating someone above α is good, but between 0 and α is neutral. Critical-range theories have a range [β, γ] where creation is neutral. Both can model the asymmetry: no requirement to create happy people (if γ > 0) but prohibition against miserable ones.

  Then there's the distinction between reasons and requirements. The asymmetry might be about duties: we have a duty not to harm (create miserable) but no duty to benefit (create happy). But in welfare frameworks, betterness is symmetric. Expressing this distinction requires introducing deontic concepts like obligations, which aren't part of standard axiology.

  Next, the independence from person-affecting views. Some argue the asymmetry exists independently. That might be captured by models that don't reference identity but still have asymmetry, like critical-level theories. However, these theories might still face problems like the Sadistic Conclusion.

  Assessing translation: Critical-level/range theories fit well into the formalism. Person-affecting views are trickier because they need existence comparisons, which standard relations don't handle. The reasons vs. requirements distinction doesn't translate at all without adding new structures.

  Residue report: Where the asymmetry resists formalization, like in the reasons/requirements part, it's because the framework lacks deontic concepts. But some aspects, like the lack of precision in "moral reason," might mean proponents haven't fully specified conditions. Also, formal models can't capture non-consequentialist elements without extensions.

  The user might need to know which extensions are feasible within their framework and which require paradigm shifts. They might also be interested in how different theories handle variable population Pareto principles and avoidance of counterintuitive conclusions. Highlighting the trade-offs in each approach, like critical-level theories avoiding the asymmetry issue but introducing new problems, would be crucial for their research.
answer: |-
  Here's a formalist's dissection of the procreation asymmetry and its attempted reconciliations within population axiology, structured for your framework:

  **The Asymmetry Restated Formally:**
  Consider a fixed background population \(B\) with welfare vector \(\mathbf{u}_B\). Let \(x\) be a potential person not in \(B\), with utility \(u_x\). The asymmetry claims:
  1.  **Harm Avoidance:** If \(u_x < 0\) (miserable existence), then \(B \cup \{x\}\) is *worse than* \(B\). Formally: \((B, \mathbf{u}_B) \succ (B \cup \{x\}, (\mathbf{u}_B, u_x))\) for \(u_x < 0\).
  2.  **Benefit Permissibility:** If \(u_x > 0\) (happy existence), then \(B \cup \{x\}\) is *not better than* \(B\). Formally: \((B, \mathbf{u}_B) \nsucc (B \cup \{x\}, (\mathbf{u}_B, u_x))\) for \(u_x > 0\). Crucially, it is typically *not* claimed that \(B \cup \{x\}\) is *worse* than \(B\), only that it isn't *better*. It might be *incomparable* or *exactly as good as*.

  **Conflict with Total Utilitarianism (TU):**
  *   TU Welfare Relation: \(X \succeq_{TU} Y\) iff \(\sum_{i \in X} u_i \geq \sum_{i \in Y} u_i\).
  *   TU implies: If \(u_x > 0\), then \(B \cup \{x\} \succ_{TU} B\) (violates Benefit Permissibility). If \(u_x < 0\), then \(B \succ_{TU} B \cup \{x\}\) (satisfies Harm Avoidance). The symmetry TU imposes (\(u_x > 0\) always improves, \(u_x < 0\) always worsens) is precisely what the asymmetry denies for \(u_x > 0\).

  **Philosophical Accounts & Formal Translation:**

  1.  **Person-Affecting Views (PAV):**
      *   **Core Idea:** An outcome \(X\) can only be better (worse) than \(Y\) for someone who exists in \(X\) or \(Y\). Creating \(x\) with \(u_x > 0\) isn't better *for* \(x\) (no prior subject to benefit) or *for* anyone in \(B\) (assuming no interactions).
      *   **Formal Translation Attempt:**
          *   *Clean Translation:* PAV motivates rejecting **Strong Pareto (SP)** and **General Non-Imposition (GNI)**. SP requires: If \(u_i \geq v_i\) for all \(i \in X \cap Y\) and \(u_j > v_j\) for some \(j \in X \cap Y\), then \(X \succ Y\). Creating \(x\) (who doesn't exist in \(Y=B\)) violates the antecedent for SP. GNI requires that for any two populations differing only by adding one person, one must be at least as good as the other. PAV allows incomparability.
          *   *Stretched/Gerrymandered:* Capturing "better/worse *for*" requires indexing welfare comparisons to sets of existing individuals. This necessitates a *variable-domain* welfare relation \(\succeq_D\) defined over pairs \((D, \mathbf{u})\), where \(D\) is the domain of existence. The "for whom" question becomes explicit but complicates axioms (e.g., redefining Pareto relative to the intersection domain). **Critical-Range Theories** often emerge as the *formal implementation* of PAV intuitions.
          *   *No Direct Counterpart:* The PAV *justification* ("no subject for benefit/harm") is a meta-ethical claim about moral patienthood, not a property of the ordering itself. The ordering reflects the *consequence* (asymmetry) but not the *reason*.

  2.  **Critical-Level (CL) and Critical-Range (CR) Theories:** (Often formal implementations of PAV intuitions)
      *   **Core Idea (CL):** Adding a person improves welfare only if their utility exceeds a positive critical level \(\alpha > 0\). Adding someone with \(u_x \leq \alpha\) is neutral or bad.
      *   **Formal Translation:**
          *   *Clean Translation:* Welfare relation: \(X \succeq_{CL} Y\) iff \(\sum_{i \in X} (u_i - \alpha) \geq \sum_{i \in Y} (u_i - \alpha)\). This directly yields the asymmetry: Adding \(x\) with \(u_x < 0 < \alpha\) is bad (\(\sum(u_i - \alpha)\) decreases). Adding \(x\) with \(0 < u_x < \alpha\) is bad or neutral (decrease or no change). Adding \(x\) with \(u_x > \alpha\) is good. Captures Harm Avoidance perfectly. Captures Benefit Permissibility for \(0 < u_x \leq \alpha\) (neutrality: \(B \sim_{CL} B \cup \{x\}\)). For \(u_x > \alpha\), it *violates* Benefit Permissibility (\(B \cup \{x\} \succ_{CL} B\)).
      *   **Core Idea (CR):** A range \([\beta, \gamma]\) (often \(\beta \leq 0 \leq \gamma\)) exists where adding a person is neutral.
      *   **Formal Translation:**
          *   *Clean Translation:* Welfare relation defined via conditions: If \(u_x \in [\beta, \gamma]\), then \(B \sim B \cup \{x\}\). If \(u_x < \beta\), then \(B \succ B \cup \{x\}\). If \(u_x > \gamma\), then \(B \cup \{x\} \succ B\). Setting \(\beta < 0 < \gamma\) (e.g., \(\beta = -k, \gamma = m\)) yields the asymmetry: Harm Avoidance (\(u_x < \beta < 0\)) and Benefit Permissibility (\(0 < u_x \leq \gamma\)). **This is the cleanest formal representation.** The neutrality range explicitly breaks the TU symmetry.
          *   *Stretched:* Justifying specific values for \(\alpha\), \(\beta\), \(\gamma\) normatively is difficult within the formalism.

  3.  **Independence of Asymmetry from Pure PAV Intuitions:**
      *   **Core Idea:** The asymmetry might hold even if one rejects PAV's core metaphysical claim (e.g., accepting that creating a happy person *is* better impersonally), due to other factors like non-identity, risk, or different types of reasons.
      *   **Formal Translation:**
          *   *Clean Translation:* CR/CL theories *formally* represent the asymmetry without necessarily committing to the PAV metaphysics. A CR theory where \(\gamma > 0\) embodies the asymmetry structurally. The **Weak Asymmetry Axiom** formalizes it directly: `(i) If u_x < 0, then B ≻ B∪{x}; (ii) If u_x > 0, then B∪{x} ⊁ B`.
          *   *No Counterpart:* The argument *that* the asymmetry is separable from PAV metaphysics is a meta-commentary about possible interpretations of the formalism, not an element *within* the formalism itself.

  4.  **Reasons vs. Requirements:**
      *   **Core Idea:** Creating a miserable person generates a strong moral *requirement* (duty not to do it), while creating a happy person generates only a weak moral *reason* (no duty to do it). The asymmetry is about deontic status, not necessarily axiological betterness.
      *   **Formal Translation:**
          *   *Stretched/Gerrymandered:* This requires moving beyond a single betterness ordering \(\succeq\). One could introduce a *two-tiered* system:
              1.  An axiological relation \(\succeq_A\) (e.g., TU: \(B \cup \{x\} \succ_A B\) if \(u_x > 0\), \(B \succ_A B \cup \{x\}\) if \(u_x < 0\)).
              2.  A deontic rule mapping \(\succeq_A\) and other factors (existence/non-existence) to requirements/permissions. E.g., `Requirement not to choose Y over X if X ≻_A Y and Y involves adding someone with u<0. No requirement to choose Y over X if Y ≻_A X solely because it adds someone with u>0`. This is highly non-standard and gerrymanders the framework.
          *   *No Clean Counterpart:* Standard population axiology operates on a single, complete (or at least complete enough for existence decisions) betterness ordering \(\succeq\). The distinction between "requirement" and "permissible improvement" has no direct representation. **This is the hardest aspect to capture.**

  **The Residue Report:**

  The procreation asymmetry resists *complete* and *elegant* formalization within standard population axiology for two primary reasons:

  1.  **Missing Normative Structure (Deontic Gap):** The core challenge stems from the **Reasons vs. Requirements** interpretation. Standard population axiology frameworks (welfare relations, Pareto, dominance) are fundamentally *axiological* – they define "betterness." The asymmetry, interpreted as a distinction between *prohibitions* (requirements) and the *absence of mandates* (despite potential betterness), introduces a *deontic* dimension (ought, duty, requirement, permission) that the purely axiological framework lacks. CR/CL theories *mimic* the consequence (neutrality for some happy additions) but cannot represent the *reason* (it's permissible *not* to create even if it would be better). This suggests a genuine limitation: capturing the full normative force of the asymmetry might require enriching the framework with explicit deontic operators or a separate structure for obligations/permissions derived from, but not identical to, betterness. *This residue points to a missing structure.*

  2.  **Imprecision / Ambiguity in the Asymmetry:** Some resistance arises from ambiguities within the asymmetry claim itself:
      *   **Scope of Neutrality:** Is adding a happy person *exactly as good as* not adding them (\(B \sim B \cup \{x\}\)), or merely *not better* (\(B \nsucc B \cup \{x\}\)) allowing for incomparability? CR theories specify the former; weaker formulations allow the latter (harder to axiomatize cleanly).
      *   **Level Dependence:** Is the neutrality claim absolute for *any* \(u_x > 0\), or could it lapse for *extremely* high positive utilities? Proponents often disagree. CR theories fix a range; pure asymmetry axioms often imply neutrality for all \(u_x > 0\).
      *   **Interaction Effects:** Does the claim hold *regardless* of the welfare of the background population \(B\)? Most formalizations assume it does (fixed \(B\)), but real-world cases might involve trade-offs. The cleanest formalizations (like CR) often assume separability/additivity, which may oversimplify.
      *   **"Moral Reason" Vagueness:** Does "no moral reason" imply axiological neutrality, or merely the absence of an *enforceable obligation*? This ambiguity fuels the gap between axiology (CR) and deontology (Reasons/Requirements). *This residue points to imprecision in the asymmetry claim.* Proponents often assert a clear intuition without fully specifying its precise logical and normative implications under all scenarios, making a single, universally accepted formalization elusive.

  **Conclusion:** Critical-Range theories provide the cleanest formal *axiological* representation of the asymmetry's consequences. Person-Affecting intuitions motivate rejecting Strong Pareto and Non-Imposition but find their best formal expression again in CR/CL theories. The core residue lies in the **Reasons vs. Requirements** interpretation, exposing a limitation of purely axiological frameworks – they lack the deontic vocabulary to distinguish "not better" from "permissibly not chosen even if better." This suggests the framework might need enrichment for a complete account. However, ambiguities within the asymmetry claim itself also contribute to the difficulty of finding a single, universally satisfactory formalization. The problem persists for TU not because it's incoherent, but because it enforces a symmetry the asymmetry denies, and alternative axiologies (CL/CR) often introduce other, potentially counterintuitive implications (e.g., Sadistic Conclusion).
