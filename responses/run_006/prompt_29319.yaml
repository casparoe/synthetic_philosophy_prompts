answer: |-
  Here's a breakdown of your friend's summary, analyzing each claim through the lens of mainstream functionalism (especially *non-reductive physicalist* functionalism, which is the dominant version), separating settled points from contested ones:

  ## Analysis of Claims

  1.  **"Functionalism is the view that mental states are defined by what they do, not by what they're made of."**
      *   **Careful Functionalist Response:** **Accept, with a crucial nuance.** This is a core definition. Functionalism defines mental states by their *functional role* – their typical causes (inputs), other mental states they interact with, and their behavioral/output effects. However, most functionalists (non-reductive physicalists) *also* believe mental states *are* physical states – just not *identical* to any single *type* of physical state (like C-fibers). They are physical states *playing* the functional role.

  2.  **"Pain just is the state that's typically caused by tissue damage and that causes wincing, avoidance, and the desire to make it stop."**
      *   **Careful Functionalist Response:** **Accept, with qualification.** This captures the core idea of defining a mental state (pain) by its functional role. The qualification is that the role is usually understood as much richer and involving complex interactions with other mental states (beliefs, desires, memories) and internal processing, not just input-output. But as a simplified example, it's acceptable.

  3.  **"The big selling point is multiple realizability: we know from comparative biology that very different nervous systems can be in pain — an octopus's pain can't be the same physical state as a human's — so pain can't be identical to any one physical state like C-fiber firing."**
      *   **Careful Functionalist Response:** **Strongly Accept.** This is an accurate statement of multiple realizability and its central role as an argument for functionalism over *type-identity theory* (which claimed mental state M = brain state B). Comparative biology provides strong evidence for MR.

  4.  **"Functionalism handles this by saying that any system with the right internal program has the mental state, whether the hardware is neurons, silicon, or something else entirely."**
      *   **Careful Functionalist Response:** **Accept.** This is a standard functionalist explanation of how MR works: the mental state is realized by whatever physical state plays the requisite functional role in that system.

  5.  **"That in turn shows mental states aren't physical states at all; they're abstract functional states, the way software is independent of hardware."**
      *   **Careful Functionalist Response:** **Flatly Reject (for mainstream functionalism).** This is the critical slide you sensed. **Mainstream functionalism (non-reductive physicalism) holds that mental states ARE physical states.** The key point is that a *type* of mental state (e.g., pain) is not identical to a *type* of physical state (e.g., C-fiber firing). However, each individual instance of pain *is* a physical state – it's just that the physical state realizing pain in a human (neural state X) is different from the physical state realizing pain in an octopus (neural state Y) or a robot (silicon state Z). The functional state is *multiply realizable* in physical states. The software/hardware analogy is useful to explain realization and independence from *specific* hardware, but functionalists generally see the "software" (mental state) as *implemented by* and therefore *constituted by* the physical hardware in any given instance. They are not non-physical entities.

  6.  **"The standard objection is that functionalism leaves out consciousness: a system could satisfy the entire functional profile of pain and yet feel nothing — the absent qualia problem — so the view is probably false."**
      *   **Careful Functionalist Response:** **Qualify Heavily.**
          *   **Accept:** The absent qualia problem (along with inverted qualia) is indeed *the* standard and most serious objection to functionalism. It points out that functionalism defines states by causal roles, which seem separable from the subjective, qualitative "feel" (qualia) of conscious states like pain.
          *   **Qualify/Contest:** Describing it as showing functionalism is "probably false" is **highly contested and not settled**. Functionalists have developed numerous responses:
              *   **"What it's like" is functional:** Some argue that the qualitative character *just is* a certain kind of complex functional role involving self-monitoring, accessibility, etc. (e.g., higher-order thought theories).
              *   **Inconceivability ≠ Possibility:** Arguing that we can *imagine* a functional duplicate without qualia doesn't prove it's *metaphysically possible*. Maybe the functional role *necessitates* qualia.
              *   **Misdescription:** Perhaps the functional profile described in the objection is incomplete. Maybe a system truly satisfying the *entire* functional role of a conscious being (including all internal monitoring and reporting functions) *must* have qualia.
              *   **Epiphenomenalism Problems:** If qualia are non-functional properties, what causal role do they play? If none, they seem epiphenomenal, which many find problematic.
          *   **Conclusion on this Point:** The absent qualia problem is a profound and unresolved challenge. It is *not* a settled refutation, but rather the central battleground in contemporary philosophy of mind concerning functionalism and physicalism. Many functionalists believe it *can* be answered within a functionalist/physicalist framework; others see it as a fatal flaw. Its status is **genuinely contested**.

  ## Summary of Settled vs. Contested

  *   **Settled/Accurate:**
      *   Functionalism defines mental states by functional/causal roles (Input-Processing-Output).
      *   Multiple realizability (MR) is a core argument for functionalism against type-identity theory.
      *   Functionalism explains MR by identifying mental states with functional roles realizable in diverse physical substrates.
      *   The absent qualia problem is the standard and major objection to functionalism.

  *   **Problematic/Misleading:**
      *   The claim that functionalism implies mental states "aren't physical states at all." (Mainstream functionalism is a form of physicalism).
      *   Presenting the functional state as "abstract" *in a way that implies non-physicality*. (Functional states are abstract *types* realized by physical *tokens*).
      *   Presenting the absent qualia problem as showing functionalism is "probably false" as if this is the consensus or settled conclusion. (It's a deep and ongoing debate, not a settled refutation).

  *   **Genuinely Contested:**
      *   **Whether functionalism can adequately account for phenomenal consciousness/qualia.** This is *the* core unresolved debate. Can functional roles fully capture subjective experience, or is there an irreducibly non-functional aspect? The success or failure of functionalism largely hinges on this question.

  ## Your Suspicion Was Correct

  Your instinct about the claim that functionalism implies mental states "aren't physical states at all" was spot-on. This misrepresents the majority position within functionalism (non-reductive physicalism). The summary slides from the correct point that mental states aren't *type-identical* to specific physical states (like C-fibers) to the incorrect conclusion that they are therefore *non-physical*. The software/hardware analogy, while useful, was pushed too far in an anti-physicalist direction. While there are *non-physicalist* functionalists (e.g., some computationalists), they are a minority. The summary presents this minority view as if it's the core functionalist position, which it is not.

  The presentation of the absent qualia objection as a decisive refutation is also overly simplistic and ignores the active defense functionalists mount against it. It's a powerful challenge, not a settled knockout blow.
