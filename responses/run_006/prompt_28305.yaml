prompt: |-
  I'm a journalist who covers philosophy and ideas for a general-interest magazine, and I'm planning a long-form explainer on David Lewis's modal realism — the view that all possible worlds exist in just the same way as the actual one. The piece is aimed at readers who are curious and educated but have no background in academic philosophy. I don't need you to explain modal realism to me; I need a plan for how I should structure the explanation. What order must the conceptual pieces go in so that the view doesn't come across as merely bizarre or as science fiction? What one example or thought experiment should carry the whole explanation, and what features must it have and lack to do that work? What misconceptions will my readers predictably form along the way — I'm anticipating at least "so this is the many-worlds interpretation of quantum mechanics" and "he's saying imaginary or fictional worlds are real" — and at which specific points in the sequence should I preempt each one? Finally, what should I openly decline to explain at this level, and how should I signal that to the reader? Please respond in continuous prose only, the way you would write an email or a letter: no headings, bullet points, bold text, or tables.
