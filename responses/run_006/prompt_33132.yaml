answer: |-
  ### Exam Question: Skolem's Paradox (90 Minutes)
  **Answer all three parts sequentially. Total: 20 marks.**

  **(a)** State the downward Löwenheim–Skolem theorem precisely, explaining the specific conditions under which it applies to the first-order theory ZFC. (4 marks)

  **(b)** Explain how applying this theorem to ZFC generates Skolem’s paradox: the apparent contradiction that a countable model \( M \) of ZFC satisfies the statement "there exists an uncountable set." Resolve this paradox formally by:
      (i) Precisely identifying the set in \( M \) claimed to be "uncountable" (using ZFC’s definition of uncountability).
      (ii) Explaining why this set is countable from the perspective of the metatheory.
      (iii) Crucially, detailing why the metatheoretic bijection witnessing this countability does *not* contradict the model \( M \)’s satisfaction of "this set is uncountable." Your explanation must explicitly reference the model \( M \)’s interpretation of quantifiers, membership, and the concept of a "function." (10 marks)

  **(c)** Skolem argued that this paradox reveals a fundamental limitation of first-order set theory. Discuss what the paradox shows about:
      (i) The *absoluteness* of the concept "countable" (i.e., whether it means the same thing inside every model).
      (ii) Whether first-order ZFC can "pin down" a unique, intended universe of sets (like \( V \)).
      Defend your position on these points, engaging with the implications of the internal/external distinction highlighted in part (b). (6 marks)

  ---

  ### Model Answer (Approx. 650 words)

  **(a)** The downward Löwenheim–Skolem theorem states that if a countable first-order theory \( T \) has an infinite model, then it has a countable infinite model. More specifically, for *any* infinite model \( \mathfrak{A} \) of \( T \) and *any* countable subset \( A_0 \) of the domain of \( \mathfrak{A} \), there exists an elementary submodel \( \mathfrak{B} \) of \( \mathfrak{A} \) such that \( A_0 \subseteq B \) and the domain \( B \) is countable. Applying this to ZFC: ZFC is a countable first-order theory (finitely many axioms/schemata). Assuming ZFC is consistent (hence has *some* model, e.g., \( V_\kappa \) for some inaccessible \( \kappa \), though this assumption is not necessary for the theorem), it has infinite models. Therefore, ZFC has a countable model \( M \). This model is an *elementary submodel* of some larger model, meaning \( M \) satisfies exactly the same first-order sentences as that larger model, and hence as ZFC itself. (4)

  **(b)** (i) Within the countable model \( M \), there exists a set, call it \( \omega_1^M \), which \( M \) "thinks" is the first uncountable ordinal. Formally, \( M \models \exists x \, (\text{`}x \text{ is an ordinal'} \land \forall f ( \text{`}f \text{ is a function'} \to \neg (\text{`dom}(f) = \omega \land \text{`ran}(f) = x'})) ) \). That is, \( M \) satisfies that no function *within its own universe* maps the natural numbers of \( M \) (denoted \( \omega^M \)) bijectively onto \( \omega_1^M \). According to \( M \), \( \omega_1^M \) is uncountable.

  (ii) From the external, metatheoretic perspective, the *entire domain* of \( M \) is countable (by the Löwenheim–Skolem theorem). Therefore, every element in \( M \)’s domain, including every element of \( \omega_1^M \), corresponds to some natural number in the metatheory. This means there exists a *metatheoretic* bijection \( g: \mathbb{N} \to \omega_1^M \), proving \( \omega_1^M \) is countable in the real world.

  (iii) The resolution lies in the *relativization* of concepts to the model \( M \). The statement "\( \omega_1^M \) is uncountable" is true *in M* (\( M \models \neg \exists f \, \text{`}f: \omega^M \to \omega_1^M \text{ is bijection'} \)). This means: within the model \( M \), there is no set (interpreted as a function *within M*) that \( M \) recognizes as a bijection from \( \omega^M \) (which \( M \) interprets as the set of natural numbers) to \( \omega_1^M \). Crucially:
      *   The metatheoretic bijection \( g \) exists *outside* of \( M \). It is not an element of the domain of \( M \).
      *   For \( g \) to "witness" countability *inside M*, it would need to be an element of \( M \) (specifically, a set *within M* satisfying ZFC's definition of a function) whose domain and range, *as interpreted by M*, are \( \omega^M \) and \( \omega_1^M \) respectively. However, \( g \) is not part of \( M \)'s universe.
      *   The quantifiers "\( \exists f \)" in the ZFC formula "there exists a bijection..." range *only* over the elements of \( M \)’s domain. They do not range over external objects like \( g \). Therefore, the *nonexistence claim* made inside \( M \) concerns only functions that are *members of M*; it says nothing about external functions. The external countability of \( \omega_1^M \) and the internal "uncountability" of \( \omega_1^M \) are statements about different collections of functions (internal vs. external) and are not contradictory. (10)

  **(c)** (i) Skolem’s paradox demonstrates that "countable" is not absolute. A set can be countable in the metatheory (via an external bijection) while being "uncountable" *within* a model \( M \) (due to the absence of a witnessing bijection *inside M*). This is because "countable" is defined using existential quantification over functions (\( \exists f \text{ bijection} \)). The meaning of "exists" here is relativized to the model. What counts as a "function" is also model-dependent (it must satisfy ZFC's functional definition *within M*). Therefore, the extension of "countable" depends fundamentally on the model in which the concept is interpreted.

  (ii) The paradox strongly suggests that first-order ZFC cannot pin down a unique intended universe of sets (like the cumulative hierarchy \( V \)). The Löwenheim–Skolem theorem guarantees the existence of numerous non-isomorphic models of ZFC: countable models, uncountable models, models where the continuum is "small," models where it is "large," etc., all satisfying the *same* first-order axioms. **Position:** Skolem himself used this to argue for **Skolemite Relativism/Skepticism**: There is no uniquely intended model; set-theoretic concepts like "uncountable" are inherently relative to the model, undermining the idea of a fixed, absolute universe of sets. **Defense:** Proponents of the absolute view (like Gödel) might argue that the countable model \( M \) is non-standard and "misinterprets" the meaning of "uncountable" because its internal notion of "function" is impoverished compared to the true, absolute universe. However, the paradox shows that first-order logic *itself* lacks the resources to distinguish this "true" interpretation from the non-standard ones. The inability to express "true uncountability" (i.e., lacking *any* bijection, internal or external) within first-order ZFC is the core limitation. Fixing a unique intended model (e.g., \( V \)) requires resources beyond first-order logic (e.g., second-order logic, or appeal to informal maximality principles), which themselves face challenges. (6)

  ---

  ### Marking Scheme (Total: 20 Marks)

  **Part (a) (4 Marks)**
  *   **2 Marks:** Correctly states the theorem for arbitrary countable theories with infinite models.
  *   **+1 Mark:** Explicitly notes ZFC is a countable first-order theory.
  *   **+1 Mark:** Explicitly notes ZFC (if consistent) has infinite models and therefore has a countable (infinite) model. Mention of "elementary submodel" is ideal but not mandatory if "model" is used clearly.

  **Part (b) (10 Marks)**
  *   **(i) (2 Marks):** Correctly identifies the set as the model’s \( \omega_1^M \) (or similar). Clearly states \( M \) satisfies the formula asserting no internal function bijects \( \omega^M \) onto this set.
  *   **(ii) (2 Marks):** Correctly states that the entire domain of \( M \) is externally countable, hence \( \omega_1^M \) is countable in the metatheory (via an external bijection \( g \)).
  *   **(iii) (6 Marks - Crucial Section):**
      *   **2 Marks:** States the metatheoretic bijection \( g \) exists *outside* \( M \) and is not an element of \( M \)’s domain.
      *   **2 Marks:** Explains that for \( M \) to "see" a bijection, it must be a set *within M* satisfying ZFC's definition of a function *in M*, and whose domain/range *as interpreted by M* are \( \omega^M \) and \( \omega_1^M \). \( g \) fails this.
      *   **2 Marks:** Explicitly links the resolution to the *relativization of quantifiers*: the formula "\( \neg \exists f \ldots \)" in \( M \) means "there is no set *in the domain of M* satisfying...". It quantifies only over \( M \)-sets, not external objects. (Mentioning "relativized quantifiers" or "\( \exists^M f \)" is key here).
      *   **A vs. B Distinction (iii):** An **A** answer (5-6/6) *explicitly covers all three points above clearly and precisely*, especially the role of quantifier relativization and the requirement that the function must be internal. A **B** answer (3-4/6) correctly identifies the external bijection and that it's not in \( M \), but provides a vaguer explanation of *why* this resolves the paradox, often missing the precise role of quantifiers or the model's internal definition of "function" ("M doesn't 'see' it" is insufficient without formal grounding).

  **Part (c) (6 Marks)**
  *   **(i) (3 Marks):**
      *   **2 Marks:** Clearly states "countable" is not absolute, explaining it depends on the model (relativization of existence quantifier over functions).
      *   **1 Mark:** Contrasts internal countability (defined by existence *in M*) vs. external/metatheoretic countability.
  *   **(ii) (3 Marks):**
      *   **1 Mark:** Recognizes the paradox implies multiple non-isomorphic models of ZFC exist (Löwenheim–Skolem).
      *   **1 Mark:** Takes a clear position (e.g., supports Skolemite Relativism, or argues it challenges uniqueness).
      *   **1 Mark:** Defends the position using the internal/external distinction (e.g., "first-order ZFC cannot rule out models where 'uncountable' means something different because the quantifiers are bounded by the model," or "the 'intended' meaning requires resources beyond FOL").
  *   **A vs. B Distinction (c):** An **A** answer (5-6/6) provides a nuanced discussion, clearly linking the non-absoluteness to the quantifier relativization from (b), explicitly states the multiplicity of models, and defends a coherent position using these elements. A **B** answer (3-4/6) correctly identifies non-absoluteness and the challenge to uniqueness but with less precision in linking to (b) or less developed defense of the position.

  **Penalties (Deduct 1-3 marks total, depending on severity and pervasiveness):**
  *   **-2:** Treating paradox as evidence ZFC/FOL is *inconsistent*. (Fatal flaw).
  *   **-2:** Conflating \( \omega^M \) (the model's natural numbers) with the real/metatheoretic \( \mathbb{N} \) without qualification.
  *   **-2:** Claiming the countable model "leaves out" elements of the "real" power set without explaining *how* this relates to the model's interpretation of \( \mathcal{P}(x) \) and the relativization of quantifiers (e.g., "\( M \)'s \( \mathcal{P}(\omega^M) \) is countable externally but internally contains only *some* subsets, and \( M \) believes it contains *all* subsets of \( \omega^M \) because its quantifiers range only over its own domain" is correct; "it just misses some sets" is vague and penalizable).
  *   **-1:** Vague use of "sees," "thinks," "from its perspective" without connecting to the formal satisfaction relation (\( \models \)) and relativized quantifiers/membership.
  *   **-1:** Misstating Löwenheim–Skolem (e.g., applying it only to countable *domains*, omitting "infinite model").
  *   **-1:** Significant unclarity in defining "uncountable" in ZFC terms.
  *   **-1:** Omitting the "elementary submodel" aspect in (a) without compensation (if "model" is used vaguely). **Overall Clarity and Structure:** Deduct up to 2 marks if the answer is poorly organized or excessively verbose, obscuring the key points.
