              - A person is told that a gavaya resembles a cow.
              - Later, seeing an animal in the forest that resembles a cow, the person comes to know that this animal is what the word "gavaya" denotes.
          - This cognition is not perception (because it involves a word and a remembered similarity), not inference (because there is no universal concomitance, vyāpti), and not testimony alone (because the testimony only gave the similarity, not the identification in the present).
     * Buddhist:
          - Argues that the case is a composite of perception, memory, and testimony, or an inference.
          - Naiyāyika must explain what each reduction leaves out.

   Technical terms: gloss on first use.

   Both characters are sharp, respond to each other, concede points when forced.

   End in a standoff.

   Let's begin.

   Characters:
     - Naiyāyika: Let's call him Nyāyaśiromani (N for short)
     - Buddhist: Let's call him Bauddhaśāstrin (B for short)

