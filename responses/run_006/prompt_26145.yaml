prompt: |-
  I'm choosing between two job offers and my own reasoning is bothering me. One is at a large, established company: the salary band, promotion timeline, and culture are well-documented and narrow in range. The other is at an early-stage startup: lower base pay but equity that could be worth nothing or a great deal. When I estimate expected values, the startup comes out ahead under most reasonable assumptions. Yet I keep gravitating toward the corporate offer, and I think it's because the uncertainties there are quantified and familiar — I know what I don't know. With the startup, I don't even know the shape of what I don't know; the probabilities themselves feel uncertain in a way that makes the expected-value calculation feel hollow. Is there a principled reason to prefer known risks over unknown ones, or am I just dressing up a cognitive bias?
reasoning: |-
  Okay, let me unpack this user's dilemma. They're torn between a predictable corporate job and a high-uncertainty startup, and their discomfort is fascinating—they've done the math correctly but distrust their own calculation because the startup's uncertainty feels qualitatively different. 

  First, I notice they're unusually self-aware. Most people would either blindly follow the EV calculation or rationalize their emotional preference, but they're actively questioning whether their unease is legitimate or biased. That sophistication tells me they'll appreciate nuanced concepts like Knightian uncertainty.

  Hmm... their core tension is between quantifiable risk (corporate) and unquantifiable uncertainty (startup). The corporate unknowns feel bounded—they know the salary band width and promotion variance. But startup unknowns feel unbounded—equity could become millions or zero, culture could be brilliant or toxic, and they can't even assign probabilities. 

  I should validate that distinction as academically sound (Knight, Ellsberg) before addressing their self-doubt. They might feel relief knowing economics recognizes this difference. But I must avoid jargon—translate "ambiguity aversion" into "it's rational to dislike uncertainty you can't measure."

  Their deeper need seems to be permission to choose safety. The EV calculation haunts them; they might feel choosing corporate is "irrational." I should reframe rationality: factoring in psychological costs (chronic stress from uncertainty) or opportunity costs (delayed life plans due to volatile income) is entirely valid. 

  Ah, and career trajectory! They didn't mention it, but startup experience has asymmetric upside—failure teaches resilience, success opens doors. Corporate paths build deep expertise. Which aligns better with their 10-year goals? I'll prompt them to consider that.

  Practical tip: The startup's "unknown unknowns" might become knowable with due diligence. Can they ask about cash runway? Founder track records? Product-market fit evidence? If founders refuse transparency, that itself is data.

  Finally, the metacognition point: If they're this stressed pre-commitment, how will they handle startup turbulence? Corporate predictability might conserve mental bandwidth for relationships or hobbies. That's not bias—it's self-knowledge.

  ...I'll structure this as: 1) Legitimize their feeling 2) Expand "rationality" beyond EV 3) Suggest probing startup unknowns 4) Prompt reflection on hidden costs and goals. Tone should reassure: their intuition isn't defective, it's integrating hard-to-quantify factors.
answer: |-
  Your self-awareness here is impressive, and your discomfort isn't irrational—it highlights a fundamental distinction in decision theory. There *are* principled reasons to prefer known risks over unknown ones, beyond mere cognitive bias. Let's break it down:

  ### 1. **Knightian Uncertainty vs. Risk (The Core Distinction)**
     - **Risk (Corporate Job):** You face measurable probabilities ("I know the salary band is $X±Y," "Promotion typically takes 2-4 years"). These are "known unknowns" with quantifiable distributions. Expected value (EV) calculations work well here.
     - **Uncertainty (Startup):** You face "unknown unknowns"—you can't assign reliable probabilities to outcomes (e.g., "Will this startup exist in 3 years?"). This is **Knightian uncertainty** (after economist Frank Knight). EV models struggle here because probabilities are guesses, not data.
     
     **Why it matters:** Humans (and rational models) handle risk better than true uncertainty. Your brain isn't broken; it's recognizing a deeper layer of unpredictability.

  ### 2. **Ambiguity Aversion (A Rational Bias?)**
     - People consistently prefer known risks over ambiguous ones, even when the ambiguous option has a higher *theoretical* EV. This is called **ambiguity aversion**.
     - **Is it rational?** Economists debate this, but in practice, **yes—if you account for unquantifiable costs.** Stress from chronic uncertainty, inability to plan life milestones (e.g., buying a home), or missed opportunities from instability are real downsides. If ambiguity imposes psychological or logistical costs, avoiding it is pragmatic.

  ### 3. **The Problem with Startup EV Calculations**
     - Startup valuations often involve **power-law distributions**: 90% of startups fail, but the 10% that succeed can generate 1000x returns. EV models are hypersensitive to your probability estimates for extreme outcomes—which are inherently speculative.
     - **Your intuition is right:** If you can’t confidently assign probabilities (e.g., "Is this startup in the top 5% or top 0.5%?"), the EV is a mathematical fiction. Relying on it feels "hollow" because it is.

  ### 4. **Hidden Costs of Uncertainty**
     - **Cognitive Load:** Constant uncertainty drains mental energy, leaving fewer resources for creativity or skill-building.
     - **Opportunity Cost:** A startup might offer higher *potential* upside, but the corporate role could provide:
       - Credibility/networks that compound over time.
       - Resources for skill development (training, mentors).
       - Stability enabling side projects or further education.
     - **Personal Fit:** Your risk tolerance isn’t just financial. If uncertainty causes chronic anxiety, it may harm your health or relationships—making the corporate job "worth more" in holistic terms.

  ### Principled Reasons to Choose the Corporate Offer
  | **Factor**               | **Corporate Role**                          | **Startup Role**                          |
  |--------------------------|---------------------------------------------|-------------------------------------------|
  | **Risk Type**            | Quantifiable (known unknowns)              | Knightian (unknown unknowns)             |
  | **EV Reliability**       | High (data-driven)                          | Low (speculative)                         |
  | **Stress/Load**          | Predictable, manageable                     | High variability, chronic uncertainty     |
  | **Career Capital**       | Structured growth, transferable credentials | Potentially high, but niche or volatile   |
  | **Life Planning**        | Enables stability (home, family, etc.)      | Hard to plan beyond 12-18 months          |

  ### Actionable Advice:
  1. **Stress-Test Your EV Assumptions:**
     - Run pessimistic scenarios: What if the startup’s exit takes 7 years instead of 4? What if dilution reduces your equity by 50%? Does the EV still hold?
     - Ask the startup: "What’s your runway? What milestones trigger the next funding round?" If they dodge, that’s data.

  2. **Evaluate Non-Financial Fit:**
     - Which culture aligns with your working style? (e.g., Do you thrive in ambiguity or structure?)
     - Which role excites you more *day-to-day*? (Passion fuels persistence in startups.)

  3. **Reframe "Rationality":**
     - Optimizing for **regret minimization** ("Which will I regret more in 10 years?") or **resilience** ("Which lets me sleep at night?") is just as rational as chasing EV.

  4. **Hybrid Approach:**
     - Could you negotiate accelerated review cycles at the corporate job? Or a signing bonus to offset the startup’s lower salary?
     - Does the corporate role offer avenues for innovation (e.g., internal R&D) that mimic startup upside with less risk?

  ### Bottom Line:
  Choosing the corporate job isn’t a cognitive bias—it’s a **rational preference for a different kind of value.** If stability enables you to thrive (personally and professionally), while uncertainty would undermine your focus or well-being, the corporate offer may have a higher *true* expected utility—even if the startup’s paper EV is larger. 

  **Ultimately:** Trust that your aversion to ambiguity isn’t weakness; it’s an acknowledgment that some uncertainties carry hidden tolls no spreadsheet can capture. The goal isn’t to eliminate bias, but to make a choice aligned with your full context—financial, emotional, and existential.
