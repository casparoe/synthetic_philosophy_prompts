answer: |-
  ### Decision Procedure for Unilateral Actions

  To prevent the unilateralist's curse in your student council, use this **5-step procedure** before any unilateral action. It prioritizes group alignment, urgency, and reversibility. **Each step must be answered in order. If you reach a "Stop," do not act unilaterally.** The procedure takes <10 minutes and uses simple language. Judgment calls are marked with ⚠️.

  ---

  #### **Step 1: Is this action reversible without significant harm?**  
     - **Yes** → Proceed to Step 2.  
     - **No** (e.g., irreversible commitments like signed contracts, public statements, or actions damaging relationships) → Proceed to Step 2 but note the higher stakes.  
     *Rationale: Irreversible actions risk permanent consequences if unpopular.*

  #### **Step 2: Can this wait for the next council meeting?**  
     - **Yes** (no deadline within 48 hours) → **Stop. Do not act.** Add to meeting agenda.  
     - **No** (deadline too soon) → Proceed to Step 3.  
     *Rationale: Non-urgent issues belong in group discussions.*

  #### **Step 3: Is this routine and non-controversial?** ⚠️ **(Judgment Call)**  
     - **Yes** (e.g., standard reminders, agreed-upon tasks, no disagreement expected) → Proceed to Step 4.  
     - **No** (e.g., new commitments, divisive topics, or unclear consensus) → Proceed to Step 5.  
     *Rationale: Routine tasks need less oversight; controversial ones risk misalignment.*

  #### **Step 4: Are you the designated officer for this task?**  
     - **Yes** (e.g., you handle social media for routine posts) → **You may act unilaterally.**  
     - **No** → Proceed to Step 5.  
     *Rationale: Designated roles reduce ambiguity for recurring tasks.*

  #### **Step 5: Can you get majority approval via quick vote?**  
     - Contact all 4 other officers **simultaneously** (e.g., group text). State:  
       *"Urgent vote needed: [Action]. Reply YES/NO within 30 mins. Requires 3+ YES to pass."*  
     - **Yes** (3+ YES votes, including you) → **You may act.**  
     - **No** (<3 YES votes, or undecided/missing votes) → **Stop. Do not act.**  
     *Rationale: Majority vote ensures group alignment under time pressure.*

  ---

  ### **Key Notes**  
  - **Time Limits:** If a quick vote is needed (Step 5), set a 30-minute deadline. If officers don’t respond in time, assume "NO."  
  - **Values vs. Facts:** If disagreement is about values (e.g., "Is this fair?"), not facts (e.g., "Does this event cost $100?"), the council must decide. Use Step 5 for urgent issues or wait for a meeting.  
  - **Limitations:** This procedure **cannot force consensus** if votes are split or officers are unresponsive. It **cannot replace trust**—use it to enable collaboration, not bypass it.  
  - **Designated Roles:** Assign officers specific duties (e.g., social media secretary) to streamline routine tasks. Update roles yearly.  

  ---

  ### **Case Applications**

  #### **Case 1: Signing up for a weekend fundraising event**  
  - **Step 1:** **No** (backing out damages relationships → irreversible).  
  - **Step 2:** **No** (deadline is today → urgent).  
  - **Step 3:** **No** (others are doubtful → controversial).  
  - **Step 4:** **No** (no designated officer for event sign-ups).  
  - **Step 5:** **Quick vote needed.** You think it’s good, but 4 others are doubtful. If you get 3+ YES votes → act. If not → **Stop.**  
    **Result:** *Likely STOP.* You need 2 more YES votes. Given widespread doubt, voting will probably fail. **This answer may disappoint you** (as the proposer), but it prevents unilateral overcommitment.  

  #### **Case 2: Posting a routine reminder about council applications**  
  - **Step 1:** **Yes** (can delete/edit the post if wrong).  
  - **Step 2:** **Depends.** If the meeting is before Friday → **Stop.** If the meeting is after Friday → urgent → proceed.  
  - **Step 3:** **Yes** (non-controversial reminder; no disagreement expected).  
  - **Step 4:** **Yes** (as secretary, you likely manage communications → designated).  
  - **Result:** **You may act unilaterally.** No vote needed.  

  #### **Case 3: Sending a critical email about hall-pass policy**  
  - **Step 1:** **No** (email can’t be unsent → irreversible).  
  - **Step 2:** **No** (assume urgent; policy change is time-sensitive).  
  - **Step 3:** **No** (council is divided → controversial).  
  - **Step 4:** **No** (no designated officer for policy critiques).  
  - **Step 5:** **Quick vote needed.** If 3+ YES votes (e.g., you + 2 others) → act. If not → **Stop.**  
    **Result:** *Uncertain.* Depends on vote outcome. If the council is split, it may fail.  

  ---

  ### **Critical Weaknesses and Reflections**  
  1. **What would most change the answer?**  
     In **Case 1**, if the **time commitment was a fact** (e.g., "The event requires 2 hours, not 10"), and you could prove this *before* Step 5, doubtful officers might switch votes. This turns a values debate ("Is it worth the effort?") into a factual one, making approval likelier.  

  2. **Where am I least confident?**  
     - **Step 3 (Judgment Call):** Calling an action "non-controversial" is subjective. An officer might misjudge others’ views (e.g., in **Case 2**, if someone secretly opposes the reminder).  
     - **Step 5 (Quick Votes):** Relies on officers responding fast. If 2 ignore the vote, even popular ideas fail. This might block good opportunities.  

  **Final Advice:** Pair this procedure with a council agreement that officers will:  
  - Respond to urgent votes within 30 minutes.  
  - Assign roles for routine tasks (e.g., secretary = social media).  
  - Review controversial unilateral actions at meetings to improve judgment.  

  This system reduces the curse by ensuring one optimist can’t commit the group—but it only works if everyone participates honestly.
