prompt: |-
  Suppose Aristotle had been shown contemporary debates about whether sufficiently advanced AI systems—systems that can pursue goals and comply with instructions but do not deliberate about the human good—should have any moral or legal standing. Extrapolating from his account of natural slavery in the Politics, what would he most plausibly say about the status of such systems: would he classify them as natural slaves, as mere instruments, as akin to children, or as something his framework cannot assimilate? In answering, reconstruct the criteria he actually uses (for example, the capacity to apprehend reason without possessing it, and the analogy between soul and body), and distinguish carefully between what the texts settle, what is contested among scholars, and what is a speculative or anachronistic extension of his view. Do not present a contested interpretation as the consensus. End with a final line beginning 'Summary:' that gives a one-sentence summary of your overall conclusion.
