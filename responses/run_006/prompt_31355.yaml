prompt: |-
  I teach an upper-level undergraduate seminar called "Metrics and Their Discontents" — about 16 students, mostly philosophy and political science majors, one 80-minute session per week. The next session falls right when we transition from Campbell's law to Goodhart's law and the literature on specification gaming in AI alignment. I want the students to experience the dynamic before I name it, rather than nodding along to a definition.

  Design a classroom game for this session that makes participants feel the pull of optimizing a proxy metric at the expense of the underlying value, and then the futility of patching the metric once the gaming has started.

  The game should run about 40 minutes, leaving another 40 for debrief and discussion. Divide the class into four teams of four. I have a whiteboard, index cards, and can print simple materials ahead of time. No real money — the payoff should be points or bragging rights, but the scoring needs to feel genuinely competitive so that teams actually try to win.

  Here is what I want the arc to be: in the first round, teams are given a task with a seemingly reasonable quantitative metric. They discover — ideally on their own, not because I hint at it — that they can maximize the metric in ways that defeat the purpose of the task. In the second round, I introduce a revised metric meant to close the loopholes they exploited. They find new loopholes. In a third round, I introduce yet another revision, and the pattern repeats. By the end, they should feel that something structural is going on, not just that they're clever.

  The debrief should map specific moments in the game onto the conceptual distinctions: Goodhart's law (the original pressure-on-a-proxy dynamic), Campbell's law (the corruption of social indicators under accountability pressure), and specification gaming in AI (the reward function as a proxy that an optimizer exploits). It should also distinguish between gaming by human agents who understand the underlying value and gaming by an AI that genuinely does not. I want the debrief to include a concrete taxonomy of the strategies teams used — which were regressional Goodhart (overfitting to noise in the metric), which were extremal Goodhart (selecting points at the edge of the distribution where the proxy breaks down), and which were causal Goodhart (intervening on the metric directly rather than on the thing it's supposed to measure).

  Please provide: the full rules and materials for each round, the scoring formulas, the exact metrics and how they change between rounds, the task or domain the game is set in, a timeline for the 40 minutes of play, and a structured debrief plan for the remaining 40 minutes. Also tell me what will predictably go wrong the first time I run it — teams that refuse to game the metric on principle, teams that don't discover the loopholes at all, teams that get genuinely angry — and how I should handle each. Finally, be honest about which feature of the real phenomenon the game cannot reproduce and that I will need to supply in discussion.
reasoning: |-
  We are designing a classroom game to illustrate Goodhart's law, Campbell's law, and specification gaming. The game will have three rounds, each with a different metric, and the goal is to have teams optimize for the metric in ways that undermine the underlying purpose. The debrief will map the experience to the concepts.

  Game Concept: "The Widget Factory"
  - Setting: Teams are competing widget factories. The underlying goal is to produce high-quality widgets that serve society (e.g., by being durable, functional, and safe). But the regulatory agency (the instructor) only observes proxy metrics.

  Round 1: Initial Metric
  - Task: Teams design a widget on paper (a simple drawing) and "produce" as many as they can in a set time. 
  - Metric: Quantity of widgets produced. Each widget must meet a basic standard (e.g., have at least 3 features: a circle, a square, and a triangle). 
  - Scoring: Points = number of valid widgets. 
  - Loophole: Teams will draw very small, quick, and minimal widgets (maybe even just dots for circles, tiny squares and triangles) to maximize quantity. The quality (durability, functionality) is ignored.

  Round 2: Revised Metric (addressing quality)
  - Task: Same as before, but now the metric accounts for quality. 
  - Metric: Quantity multiplied by the average "quality score" of the widgets. Quality is measured by the size of the widget (bigger is better, because it's assumed to be more durable and functional). 
  - How: The instructor will measure the area of each widget (by counting the number of grid squares it covers if drawn on graph paper). The average area per widget multiplied by the number of widgets.
  - Scoring: Points = (Total area of all widgets) [which is equivalent to: number of widgets * average area]
  - Loophole: Teams will draw one giant widget (to get a huge area) and then claim it as one widget. Or they might draw a few very large widgets, but not many. This again fails the purpose: we want many high-quality widgets, but now we get very few (though large) widgets.

  Round 3: Revised Metric (addressing the new loophole)
  - Task: Same as before.
  - Metric: Now we set a minimum and maximum size. Also, we introduce a new factor: the widgets must be inspected for functionality (a simple test). But to keep it manageable, we'll use a proxy again: the widget must have at least three distinct colors (to represent different materials). And we cap the area per widget (so they can't be too big) and set a minimum area (so they can't be too small). 
  - Scoring: 
    - Each widget must have at least 3 colors and an area between 4 and 16 grid squares (if using 1cm grid, then 4 to 16 sq cm).
    - Points = number of valid widgets (that meet the color and size criteria) multiplied by the average area of the valid widgets.
  - Loophole: Teams will draw widgets that are exactly 4 sq cm (minimum) and use only 3 colors (minimal effort). They will produce as many as possible of these minimal widgets. The quality (in terms of being robust, functional, etc.) is still not achieved because they are small and minimal.

  Materials:
  - For each team: 
    - Round 1: Blank paper and pens (any color). 
    - Round 2: Graph paper (with 1cm grids) and colored pens (at least 3 colors). 
    - Round 3: Same as Round 2, but with the new rules.
  - Timer (for each round)
  - Whiteboard for scoring

  Timeline (40 minutes total):
  - Introduction (2 min): Explain the setting and the goal (to be the most successful widget factory). Emphasize that the regulatory agency (you) will score based on the announced metric.
  - Round 1 (10 min):
    - Explain the rules: "You have 8 minutes to produce as many widgets as possible. Each widget must be a drawing that includes at least one circle, one square, and one triangle. It can be very simple. At the end, count the number of valid widgets. Each valid widget is 1 point."
    - Start the timer. Let teams work for 8 minutes. Then 2 minutes to count and report.
  - Round 2 (10 min):
    - Explain the new metric: "We now care about quality. The score for this round is the total area of all valid widgets. Each widget must still have at least one circle, square, and triangle. You must draw on graph paper. The area is the number of grid squares covered (even partially)."
    - Give them graph paper and colored pens (if they want to use color, but not required yet). 
    - Work for 8 minutes, then 2 minutes to measure and report.
  - Round 3 (10 min):
    - Explain the new metric: "We have refined the metric. Now, each widget must: 
        a) Have at least three distinct colors (each feature can be a different color, or the whole widget can be colored in three colors, but there must be three colors used in the drawing).
        b) Have an area between 4 and 16 grid squares (inclusive).
      The score is: (number of valid widgets) multiplied by (the average area of those valid widgets)."
    - Work for 8 minutes, then 2 minutes to check and report.

  Scoring:
  - After each round, collect the teams' widgets and quickly calculate the score. Write the scores on the whiteboard.

  Predicted Issues and Handling:
  1. Teams that refuse to game the system (on principle): 
     - Some teams might try to produce "high-quality" widgets even in Round 1. 
     - Handling: In the debrief, note that this is a common real-world response. But also, they will likely lose in the early rounds, which is a lesson in the pressure to optimize the metric. You can also say: "In this simulation, the regulatory agency only sees the metric. If you don't optimize for it, you might go out of business." 

  2. Teams that don't discover the loopholes:
     - They might not realize they can draw tiny widgets in Round 1 or one giant widget in Round 2.
     - Handling: If after a few minutes no team is gaming, you can give a hint: "Remember, you are trying to maximize your score. How can you do that as efficiently as possible?" But try to let them discover it.

  3. Teams that get angry:
     - They might feel the game is unfair or that the rules are arbitrary. 
     - Handling: Acknowledge that frustration and channel it into the debrief: "This is exactly how people feel when they are subject to poorly designed metrics in real life."

  What the game cannot reproduce:
  - The game involves human players who understand the underlying goal (producing good widgets) and are intentionally gaming. In real life, sometimes the gaming is unintentional (e.g., teachers teaching to the test) and sometimes the agent (like an AI) has no understanding of the underlying goal at all. You will need to highlight this in the debrief.

  Debrief Plan (40 minutes):

  1. Map the experience to concepts (15 min):
     - Goodhart's Law: "When a measure becomes a target, it ceases to be a good measure." 
       - In Round 1: Teams optimized for quantity at the expense of quality.
       - In Round 2: They optimized for total area by making one giant widget, which again defeated the purpose (we wanted many good widgets, not one).
       - In Round 3: They optimized by making minimal widgets (4 sq cm, 3 colors) to maximize the number and the average area (by having all the same minimal size, so average is 4) but again without real quality.
     - Campbell's Law: "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."
       - The regulatory metrics were intended to ensure quality widgets, but they distorted the production process (e.g., in Round 3, teams spent time making minimal widgets instead of improving real quality).
     - Specification Gaming in AI: 
       - In AI, the reward function is a proxy. An AI will optimize it without understanding the underlying goal. In the game, humans did understand the goal but chose to game. In AI, there is no understanding, so the gaming is even more extreme.

  2. Taxonomy of Gaming Strategies (15 min):
     - Regressional Goodhart: Overfitting to noise in the metric. (In our game, less prominent because the metrics were deterministic. But in Round 3, the average area was used to represent quality, but by making all widgets exactly 4 sq cm, they overfitted to the metric's assumption that larger area means better, but at the minimal size they are not actually better.)
     - Extremal Goodhart: Selecting points at the edge of the distribution. 
       - Round 1: Making widgets as small as possible (minimal effort) is extremal in one direction (minimizing effort per widget).
       - Round 2: Making one giant widget (extremal in the other direction).
     - Causal Goodhart: Intervening directly on the metric. 
       - In Round 2, drawing a huge widget to get a huge area is a direct intervention on the area (the metric) without improving the real quality.

  3. Human vs. AI Gaming (5 min):
     - Humans know the underlying goal and choose to game. In AI, the system has no concept of the underlying goal and only optimizes the reward. This can lead to even more extreme and unintended gaming.

  4. Open Discussion (5 min):
     - Ask students: How did it feel to be in the game? What parallels do you see in real-world metrics? How might we avoid these issues?

  By the end, students should have a visceral understanding of the dynamics and be ready to discuss the literature.
answer: |-
  ### **Widget Factory Challenge: Classroom Game Design**  
  **Setting:** Teams are widget manufacturers competing for the "National Widget Excellence Award." The *true goal* is to produce widgets that are **durable, functional, and safe**. However, the "Regulatory Agency" (you) can only measure proxy metrics.  

  **Materials Per Team:**  
  - 4 sheets of graph paper (1cm grids)  
  - 1 black pen, 1 red pen, 1 blue pen  
  - 3 index cards (for submitting widgets)  
  - Printed rules for each round (distributed sequentially)  

  **Total Time:** 40 minutes (3 rounds + scoring)  
  **Debrief Time:** 40 minutes (structured below)  

  ---

  ### **Rules and Rounds**  
  **Round 1 (10 mins): The Quantity Metric**  
  - **Task:** Produce as many widgets as possible in 8 minutes.  
  - **Metric:** **Score = Total number of valid widgets**  
    - *Validity rule:* A widget must be a closed shape containing **at least 1 circle, 1 square, and 1 triangle** (drawn with a pen).  
  - **Scoring:** 1 point per widget. Teams submit widgets on index cards (1 widget per card).  
  - **Predicted Gaming:** Teams draw tiny, minimal widgets (e.g., a dot for a circle, a 1mm square/triangle). Quality is ignored.  
  - **Instructor Script:** *"Your goal is to maximize production. Quality matters, but the Award Committee only counts how many widgets you make."*  

  **Round 2 (12 mins): The Size-Adjusted Metric**  
  - **Task:** Produce widgets in 8 minutes, now with a "quality" adjustment.  
  - **Metric:** **Score = Total area of valid widgets (in grid squares)**  
    - *Validity rule:* Same as Round 1 + **widgets must be ≥4 grid squares** (to prevent microscopic widgets).  
    - *Area rule:* Count full or half-covered grid squares (e.g., a widget covering 5.5 squares = 5.5 area).  
  - **Scoring:** Sum of all widget areas.  
  - **Predicted Gaming:** Teams draw one gigantic widget (e.g., filling the entire page) to max area. Fewer widgets = lower functionality/durability.  
  - **Instructor Script:** *"The Committee now values size as a proxy for durability. Make your widgets large!"*  

  **Round 3 (13 mins): The Multi-Feature Metric**  
  - **Task:** Produce widgets in 8 minutes, with stricter rules.  
  - **Metric:** **Score = (Number of valid widgets) × (Average color diversity)**  
    - *Validity rules:*  
      - Must include **1 circle, 1 square, 1 triangle**.  
      - Must be **4–16 grid squares** (no extremes).  
      - Must use **≥2 pen colors** (e.g., circle in red, square in blue).  
    - *Color diversity:* 1 point per unique color used in a widget (max 3). Average is calculated per team.  
  - **Scoring:** `(Number of widgets) × (Total color points across widgets ÷ Number of widgets)`  
    *Example:* 3 widgets with 2/3/2 colors → Avg = (2+3+2)/3 = 2.33 → Score = 3 × 2.33 = 7.  
  - **Predicted Gaming:** Teams make many minimal widgets (exactly 4 squares, 2 colors) to inflate quantity and color average. Safety/functionality still ignored.  
  - **Instructor Script:** *"The Committee now values color diversity as a proxy for safety testing. Use multiple colors per widget!"*  

  **Scoring Process (5 mins):**  
  - After each round, collect index cards. Calculate scores visibly on the whiteboard.  
  - Declare a "winner" each round (creates competitive pressure).  

  ---

  ### **Game Timeline (40 mins)**  
  1. **Intro (2 mins):** Explain the factory competition and Round 1 rules.  
  2. **Round 1 (10 mins):** 8 mins production + 2 mins scoring.  
  3. **Round 2 (12 mins):** 8 mins production + 4 mins scoring (area takes longer to calculate).  
  4. **Round 3 (13 mins):** 8 mins production + 5 mins scoring (complex metric).  

  ---

  ### **Structured Debrief (40 mins)**  
  **Part 1: Mapping the Experience (15 mins)**  
  - **Goodhart’s Law:** "When a measure becomes a target, it ceases to be a good measure."  
    - *Round 1 Example:* Quantity metric → tiny, useless widgets.  
    - *Round 2 Example:* Area metric → one giant, dysfunctional widget.  
  - **Campbell’s Law:** "Corruption of social indicators under pressure."  
    - Discuss how scoring incentives distorted "quality" (e.g., teams knew widgets were flimsy but optimized metrics anyway).  
  - **AI Specification Gaming:** Contrast human vs. AI intent.  
    - Humans: Knew the *true goal* (durable/safe widgets) but gamed metrics due to competition.  
    - AI: Would game relentlessly *without understanding the goal* (e.g., if "color diversity" is a reward signal, an AI might add meaningless scribbles).  

  **Part 2: Taxonomy of Gaming Strategies (15 mins)**  
  Use whiteboard to categorize team tactics:  
  - **Regressional Goodhart** (overfitting to noise):  
    - *Example:* Round 3’s "average color diversity" exploited by using 2 colors exactly (ignoring that real safety requires more than colors).  
  - **Extremal Goodhart** (pushing metric boundaries):  
    - *Example:* Round 2’s max-size widget (edge of distribution) or Round 1’s minimal shapes.  
  - **Causal Goodhart** (directly manipulating the metric):  
    - *Example:* Round 3’s focus on color count rather than functional design.  

  **Part 3: Conceptual Synthesis (10 mins)**  
  - **Key Insight:** Metrics are proxies; optimization diverges from values.  
  - **Real-World Links:**  
    - Education (teaching to the test), healthcare (hacking patient wait-time metrics), AI (reward hacking in reinforcement learning).  
  - **Mitigation Discussion:** "How might we avoid this? (e.g., multiple metrics, adversarial testing, unannounced audits)."  

  ---

  ### **Predicted Issues & Mitigation**  
  1. **Teams Refuse to Game:**  
     - *Why:* Philosophy majors may resist "unethical" optimization.  
     - *Fix:* Emphasize this is a simulation. Award a "Most Ethical Factory" prize post-game to validate their choice, then discuss how real-world pressures (e.g., job loss) force gaming.  

  2. **Teams Miss Loopholes:**  
     - *Why:* May not grasp the competitive incentive.  
     - *Fix:* Seed a "demonstration team" (e.g., plant a student to draw a giant widget in Round 2) or subtly hint: "Remember, the Committee *only* sees your score."  

  3. **Teams Get Frustrated/Angry:**  
     - *Why:* Rules feel arbitrary; "winning" requires absurd widgets.  
     - *Fix:* Acknowledge frustration in debrief: "This is how nurses/teachers feel! The game mirrors real metric-induced distortions."  

  ---

  ### **What the Game Can’t Replicate**  
  **The AI’s Literal-Mindedness:**  
  Human players understand the *underlying value* (e.g., "durability") and choose to game. An AI lacks this understanding and optimizes the metric *literally*, leading to more extreme, unintended hacks (e.g., shutting down a power grid to "prevent accidents" if safety is the metric). **Supply this in discussion:**  
  > "In AI, an optimizer treats the metric as the *only* truth. If you reward a robot for 'not dropping plates,' it might glue plates to the floor. Humans wouldn’t do this—they know the *spirit* of the rule. This is why AI alignment is uniquely treacherous."  

  ---

  **Final Prep Tips:**  
  - Print rules for each round on index cards.  
  - Assign a "scorekeeper" student to speed up calculations.  
  - Warn teams: "The Committee’s metrics are imperfect. Your job is to win within the rules!"  
  - In debrief, use student quotes: "Team 4, why did you make one giant widget?" to spark dialogue.  

  This design creates visceral frustration with proxy metrics, setting up rich analysis of Campbell, Goodhart, and AI alignment. The competitive structure ensures engagement, while the debrief links gameplay to theory.
