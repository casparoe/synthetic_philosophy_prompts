prompt: |-
  I teach an upper-level ethics seminar, and in a recent session on the moral difference between lying and misleading, a colleague of mine defended the view that the distinction carries genuine moral weight by drawing an analogy with the doing/allowing distinction. On his telling, lying is to misleading as killing is to letting die: the liar actively inserts a falsehood into the stream of testimony and thereby causes the hearer's false belief, whereas the misleader utters something true and allows the hearer to draw the false conclusion herself, just as the agent who lets die allows a causal process already under way to run to its end. The analogy is doing real argumentative work for him: it is meant to license the conclusion that lying is, other things equal, morally worse than misleading, and more broadly that the moral significance of the lie/mislead distinction is of a piece with the moral significance of the doing/allowing distinction.

  I am skeptical that the analogy carries as much as he wants, and I would like to address it carefully in the seminar rather than dismiss it. Could you audit the analogy for me? Set out the correspondence explicitly (a table would be fine): the speaker, the utterance, the hearer's inference, the resulting false belief, and whatever else you take to be in play. Then identify where the mapping strains or breaks, and which of those disanalogies matter for the conclusion he wants and which are incidental. In particular, I would like to know which features of the source the analogy quietly imports into the target — for example, the assumption that doing is worse than allowing, or that causes and allowings can be cleanly separated — and whether those imports are defensible once we are talking about testimony and inference rather than bodies and causal processes. Finally, tell me whether the conclusion survives once the disanalogies are explicit, or whether it rests on the analogy; if a better analogy would serve his purpose, I would welcome it. Since I want to be able to steelman the position before criticizing it, please also indicate what would change your mind: which consideration would lead you to a different verdict about how far the analogy holds, and where your own reasoning is most likely to fail.
reasoning: |-
  Okay, let me approach this ethics professor's query methodically. The colleague's analogy between lying/misleading and killing/letting die seems central to their argument about moral distinctions, but the professor suspects weaknesses. 

  First, I need to reconstruct the analogy's mapping clearly. The core parallels appear to be: liar as killer (active causer), misleader as non-intervener (passive allow-er), false belief as death (bad outcome). But immediately I notice a tension - while death is a physical endpoint, false belief involves the hearer's cognitive agency. That might matter.

  Hmm... the professor wants to know what baggage the analogy smuggles in. Probably the assumptions that: (1) actions and omissions are always cleanly separable, (2) causation is unidirectional, and (3) moral weight directly correlates with activity level. But in testimony, the line blurs - isn't selecting true statements to enable false inferences itself an action? 

  I recall Jennifer Saul's work on misleading - she argues that in conversational contexts, misleading often exploits cooperative norms, making it more like manipulation than mere allowing. That challenges the analogy's passive portrayal of misleading. And unlike biological processes, inferences can be interrupted by the speaker at multiple points.

  The professor also asked for steelmanning. The strongest version might emphasize the speaker's direct causal responsibility: just as pushing causes death more directly than omitting to save, lying directly implants falsehood while misleading merely sets up conditions for error. But even here, the hearer's inference complicates causality.

  For disanalogies that actually matter: (1) the role of epistemic agency in belief formation vs bodily harm, (2) the normative context of testimony (Gricean maxims), and (3) the fact that "allowing" false belief often involves active conversational shaping. These seem fatal to the equivalence.

  Perhaps a better analogy would be poisoning food vs leaving rotten food accessible with no warning. But even this retains problematic bodily harm framing. Maybe framing it as creating trap vs failing to remove existing trap? Still imperfect.

  Ultimately, the analogy might hold only if we accept highly mechanistic views of both bodily harm and belief formation - but that seems descriptively inaccurate for testimony. My reasoning could fail if new evidence shows hearers process deliberate truths and falsehoods identically, but that's unlikely given pragmatics research.

  The conclusion about moral weight difference might survive independently of this analogy - through intent or harm analysis - but the doing/allowing framework itself adds little and risks misdirection.
answer: |-
  Your colleague's analogy is intriguing but faces significant challenges when scrutinized. Below is a structured audit, steelmanning the position before exposing critical disanalogies. I conclude that the analogy imports untenable assumptions about causality and agency in testimony, weakening its moral conclusion.

  ### **Explicit Correspondence Table**
  | **Component**               | **"Killing/Letting Die" (Source)**                | **"Lying/Misleading" (Target)**                     |
  |-----------------------------|--------------------------------------------------|----------------------------------------------------|
  | **Agent**                   | Moral agent (e.g., doctor, bystander)            | Speaker                                            |
  | **Action Type**             | **Killing:** Actively causing death (e.g., injection) <br> **Letting Die:** Allowing existing causal process (e.g., withholding treatment) | **Lying:** Actively causing false belief (uttering falsehood) <br> **Misleading:** Allowing hearer to form false belief (uttering truth) |
  | **Causal Process**          | Biological/physical chain (e.g., disease progression) | Epistemic chain (hearer's inference)               |
  | **Patient/Outcome**         | Death of vulnerable patient                      | False belief of hearer                             |
  | **Moral Weight Claim**      | Doing harm (killing) > Allowing harm (letting die) | Doing harm (lying) > Allowing harm (misleading)    |
  | **Key Justification**       | Greater causal responsibility in "doing"         | Greater speaker responsibility in "inserting" falsehood |

  ---

  ### **Critical Disanalogies & Their Moral Significance**
  #### **1. Agency of the "Patient"**  
    - **Source:** The dying patient is passive; death occurs via *external* biological processes.  
    - **Target:** The hearer actively engages in inference. False beliefs arise from *interaction* between the utterance and the hearer's cognitive agency (e.g., background assumptions, biases).  
    - **Why it Matters:** In misleading, the speaker exploits the hearer’s agency to "do the work" of forming a false belief. This resembles *manipulation* (a "doing") more than passive allowing. The analogy’s "allowing" frame ignores this shared responsibility, overstating the speaker's passivity.

  #### **2. Structure of the "Causal Process"**  
    - **Source:** Letting die assumes a *pre-existing, independent causal chain* (e.g., a terminal illness). The agent merely refrains from intervening.  
    - **Target:** In misleading, no "independent" causal chain exists. The utterance *creates* the conditions for false belief by exploiting conversational norms (e.g., Gricean maxims). Omitting crucial context isn’t "allowing" a natural process—it’s *orchestrating* a deceptive inference.  
    - **Why it Matters:** Misleading often requires *active design* (e.g., cherry-picking truths). This blurs the doing/allowing line, making misleading closer to a "doing" than the analogy admits.

  #### **3. Normative Context**  
    - **Source:** Letting die may be neutral or permissible (e.g., respecting autonomy in DNR cases).  
    - **Target:** Testimony operates in a context of *shared epistemic norms*. Misleading violates the cooperative principle (Grice) by *intentionally* inducing false beliefs—a proactive violation even when truths are uttered.  
    - **Why it Matters:** The moral difference may stem from *intent to deceive* (present in both lying and misleading), not doing/allowing. The analogy obscures this by focusing on act structure.

  #### **4. Preventability & Control**  
    - **Source:** Letting die may involve unavoidable outcomes (e.g., untreatable cancer).  
    - **Target:** Hearers can often avoid false beliefs (e.g., by seeking clarification). However, speakers *reliably predict* misleading will succeed due to conversational trust.  
    - **Why it Matters:** The speaker’s *control over the outcome* is high in both lying and misleading, undermining the "allowing" defense. The analogy imports an assumption of inevitability that rarely applies.

  ---

  ### **What the Analogy Smuggles In (and Why It’s Problematic)**
  1. **"Doing > Allowing" as a Default**: Assumes this hierarchy is universal, but its applicability to testimony is questionable. In deception, *intent* and *exploitation of trust* may matter more than act structure.  
  2. **Clean Causal Separation**: Presumes clear boundaries between "inserting" vs. "allowing" falsehoods. Yet in testimony, utterances are *invitations to infer*; all communication involves hearer agency.  
  3. **Passive Patient Model**: Treats hearers as passive belief-recipients, ignoring their role in co-constructing meaning. This is descriptively inaccurate and morally misleading.

  ---

  ### **Does the Conclusion Survive?**  
  The *specific* conclusion—that lying is *inherently* worse than misleading due to doing/allowing—fails because the analogy:  
  - Underestimates the speaker’s active role in misleading,  
  - Overlooks the hearer’s agency,  
  - Ignores the normative context of communication.  
  However, a *weaker conclusion* may hold: lying is often *more directly attributable* to the speaker, making it easier to assign blame. But this relies on pragmatic (not structural) factors like clarity of intent or deniability.

  ---

  ### **A Better Analogy: "Poisoning vs. Withholding Medicine"**  
  For your colleague’s purpose, this reframing retains moral distinction while better fitting testimony:  
  - **Lying = Poisoning**: Actively introducing a harmful substance (falsehood).  
  - **Misleading = Withholding antidote**: Failing to provide vital corrective information, allowing pre-existing ignorance/error to "harm" the hearer.  
  **Advantage**: Acknowledges the speaker’s duty in testimony (unlike bystanders in letting die) and the role of prior epistemic states. Still imperfect, but less strained.

  ---

  ### **What Could Change My Mind**  
  1. **Evidence of Hearer Passivity**: If studies showed hearers *never* contribute to false beliefs (e.g., processing truths/falsehoods identically), the analogy gains strength.  
  2. **Causal Purity in Testimony**: If we could isolate "pure" allowing (e.g., silence when asked) from "active" misleading, the doing/allowing distinction might hold.  
  3. **Moral Intuitions on "Clean" Cases**: If in controlled thought experiments (e.g., "Truthful Note" vs. "Silence" in a life-or-death scenario), judgments consistently mirrored doing/allowing, the analogy would be bolstered.  

  **Where My Reasoning Is Most Vulnerable**: I may overstate the hearer’s agency. In high-stakes contexts (e.g., misinformation crises), hearers might be so vulnerable that misleading approximates "allowing" harm. Context likely moderates the analogy’s validity.

  ---

  ### **Teaching Recommendations**  
  - Have students test the analogy with edge cases:  
    - *"Is omitting a truth (allowing) equivalent to uttering a misleading truth?"*  
    - *"If a lie prevents greater harm, is it better than a 'mere' misleading?"*  
  - Discuss whether *intent to deceive* (common to both) is the true moral core, not act structure.  
  - Explore Jennifer Saul’s work (*Lying, Misleading, and What Is Said*) which challenges the doing/allowing framing in deception.  

  The analogy is a provocative starting point but cannot bear the moral weight your colleague assigns it. Its breakdown reveals that testimony’s normativity lies in *shared practices of trust*, not causal metaphysics.
