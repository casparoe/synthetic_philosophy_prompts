prompt: |-
  I teach jurisprudence and I've been preparing a lecture on the logical structure of legal systems, and I keep running into a pattern that I don't have a satisfactory name for. I've been collecting examples, and I'd like to know whether this specific configuration has been given a label in the literature—and if it hasn't, what the nearest concepts are and how it should be precisely distinguished from them.

  The pattern arises whenever a system of rules contains a rule about how the rules themselves can be changed, and someone then attempts to use that very rule to alter the rule-changing rule itself. Here are three instances I've been using to illustrate it. First, a constitution requires a two-thirds supermajority for amendments. A duly passed amendment, meeting that threshold, then declares that all future amendments shall require only a simple majority. Is that amendment valid? If it is, then the simple-majority rule was enacted under the old supermajority procedure, and future amendments can proceed under the new, lower threshold. But suppose someone now tries to amend the constitution by simple majority, and a challenge is raised: the amendment that established the simple-majority rule was itself invalid, because it purported to change the very procedure that authorized it. Second, a legislative body passes a statute whose sole content is "this statute is hereby repealed." The statute was enacted following the proper procedure, but its content is its own annulment—so what is the legal status of the repeal? Third, in a game whose rules include a procedure for changing the rules, a player proposes a rule change that says "this rule may not be changed by any future vote." If the change passes, the rule prohibiting further changes was itself the product of a change; is the new rule binding against a later attempt to change it, and if so, under what authority?

  I'm aware of neighboring ideas—self-reference in law, the paradoxes one finds in discussions of Kelsen's basic norm or Hart's rule of recognition, and the general literature on legal antinomies. But I'm not sure those quite capture the specific structure I'm describing: a rule-changing rule applied reflexively to itself, generating a question about the validity of the reflexive application and of everything downstream of it. Is there an established term for this exact configuration in jurisprudence or philosophical logic? If there is, what are its boundaries—does it cover all three of my cases, or only some, and why? If there isn't a single term, what are the closest concepts, how do they each fall short, and what would you propose as a name and definition?
reasoning: |-
  Okay, the user teaches jurisprudence and is preparing a lecture on the logical structure of legal systems. They've encountered a specific pattern involving rule-changing rules applied reflexively and are looking for a term or concept in the literature that describes this. Let me start by understanding their examples: constitutional amendment procedures changing themselves, a statute repealing itself, and a game rule making itself immutable.

  First, I recall that self-amendment is a known concept. Walter Murphy and others have written about constitutional changes altering amendment rules. But the user might be aware of that. The paradox here is whether such an amendment is valid if it uses the old rule to change itself. 

  Then there's the statute repealing itself. That sounds like self-application, but does it create a paradox? If the statute is valid when enacted, repealing itself immediately, does it ever exist? Legal systems might handle this through temporal logic or specific doctrines like desuetude, but the core issue is the self-referential act.

  The game rule example involves a rule that prevents future amendments, passed using the amendment procedure it seeks to restrict. This is similar to the constitutional issue but in a different context. It's about entrenchment and whether such a rule can bind future decisions.

  The user mentions Kelsen's basic norm and Hart's rule of recognition. Kelsen's hierarchy might view the amendment rule as a higher norm, so changing it requires the same level of validity. Hart's secondary rules include rules of change, but their self-application isn't directly addressed. The rule of recognition being unwritten might avoid this, but codified rules face the issue.

  The deeper need here might be for a unified framework to explain these paradoxes across different legal contexts. Terms like "procedural self-reference" or "rule-circularity" come to mind. The user probably wants to present this clearly to students, so distinguishing from related concepts like antinomies (conflicting norms) or logical paradoxes (liar paradox) is crucial. They might also need practical examples of how courts resolve these, like in India or Ireland, where implicit limits on amendments are recognized. Ensuring the term covers all three examples without overstretching is key. Proposing "reflexive rule-application" or "self-application paradox" could work, but checking literature for existing terms is essential. The user might benefit from references to specific cases or theorists beyond the usual suspects.
answer: |-
  This is a fascinating and profoundly important pattern in legal theory—one that sits precisely at the intersection of logic, meta-rules, and systemic validity. You're right that neighboring concepts don't quite capture its specific, self-consuming structure. Here's a breakdown:

  1.  **The Established Term: Self-Amendment (Specifically Reflexive Self-Amendment)**
      *   **Focus:** Changing a rule *using the procedure defined by that very rule*.
      *   **Literature:** This is the most direct and widely recognized term for your core constitutional example. Key figures include:
          *   **Lon L. Fuller:** Discussed self-amendment as a logical puzzle inherent in rule systems ("The Morality of Law").
          *   **Walter F. Murphy:** Explored the legitimacy and limits of constitutional self-amendment extensively ("Merlin's Memory: The Past and Future Imperfect of the Once and Future Polity").
          *   **Peter Suber:** Authored the seminal book *The Paradox of Self-Amendment*, which *directly addresses all aspects of your query*, analyzing the logic, paradoxes, and practical resolutions of rules changing themselves, including the amendment rule changing itself. This is the *essential* reference for your lecture.
          *   **H.L.A. Hart:** While the "rule of recognition" is a neighbor, Hart himself acknowledged the puzzle of secondary rules changing themselves (though he didn't resolve it definitively within his positivist framework).
      *   **Coverage:** This term perfectly fits your constitutional example and the game rule example (which is analogous). The statute example is a close relative but distinct (see below).

  2.  **Why Neighboring Concepts Fall Short:**
      *   **Self-Reference in Law:** Too broad. It covers any rule mentioning itself (e.g., "This statute takes effect on Jan 1st"), not necessarily the *change* of the rule *by* the rule.
      *   **Logical Paradoxes (Liar, Russell's):** Share the self-referential structure causing indeterminacy, but the *content* is different (truth-value vs. legal validity/effect). The legal version operates within a system of authority and practice.
      *   **Kelsen's Basic Norm:** The basic norm is presupposed, not changed by positive law. Attempting to change the amendment rule *is* changing positive law, though it might implicate the hierarchy of norms. The paradox arises *within* the positive system authorized by the basic norm.
      *   **Hart's Rule of Recognition:** An *unwritten* social practice identifying valid law. Attempting to *codify* or *change* it via statute creates a profound puzzle (can a rule *created by* the RoR change the RoR itself?), which Hart conceded was problematic. Your pattern often involves *written* rules attempting reflexive change.
      *   **Legal Antinomies (Norm Conflicts):** Your pattern isn't primarily about a conflict *between* two distinct rules (like a law saying X and another saying not-X). It's about the *internal consistency and authority* of a *single* rule (the amendment rule) when applied to itself. The conflict is between the *outcome* of applying the rule and the *basis* for its own authority.
      *   **J.C. Carter's "Unamendability in Disguise" / Implied Limits:** These are doctrines *developed by courts* to *resolve* the paradox in specific contexts (e.g., Kesavananda Bharati in India, Solange in Germany), not names for the logical structure itself.

  3.  **Distinguishing the Statute Example:**
      *   Your statute example ("this statute is hereby repealed") is a close relative but differs slightly in structure:
          *   It's **self-application**, not necessarily **self-amendment**. It applies its *substantive content* (repeal) *to itself* at the moment of enactment.
          *   The core paradox is temporal and performative: Can an act simultaneously create and destroy itself? Does it ever meaningfully "exist"?
          *   While sharing the self-referential paradox, it doesn't involve changing a *higher-order rule about change*; it's a first-order rule performing an immediate self-destructive act.
          *   **Term:** This is often called **Self-Destruction**, **Self-Abolition**, or **Self-Annulment**. Peter Suber also covers this extensively within the broader framework of self-referential rules in law.

  4.  **The Core Logical Structure & Proposed Terminology:**
      *   **Structure:** A **rule of change (Rc)** that defines the procedure (P) for changing rules within the system, is itself subjected to change *using procedure (P)*. The validity of the new rule (Rc') changing Rc depends on Rc, creating a circularity or paradox regarding the authority for the change itself and the status of future changes under Rc'.
      *   **Unifying Term:** While "Self-Amendment" is established for the constitutional/game rule contexts, the most precise *general* term capturing the logical essence across your examples is:
          *   **Reflexive Rule-Application (to Meta-Rules) / The Reflexivity Paradox of Secondary Rules**
          *   **Rule-Circularity in Meta-Norms**
      *   **Suber's Framework:** Peter Suber's *The Paradox of Self-Amendment* remains the most comprehensive analysis. He frames it as the paradox arising when a system's **amendment power** is used to **limit or redefine the amendment power itself**. He meticulously categorizes the types of changes (e.g., weakening, strengthening, entrenching) and the logical and practical responses.

  5.  **Resolution in Practice (for your Lecture):**
      Legal systems typically resolve these paradoxes pragmatically, avoiding the logical abyss:
      *   **Implicit Limits Doctrine:** Some constitutions are held to have unamendable "basic structures" or "core principles" that *cannot* be changed, even by the formal amendment procedure. The amendment rule cannot authorize its own destruction or the destruction of the constitutional identity (e.g., India, Germany). The reflexive change is invalid if it violates these implicit limits.
      *   **Temporal Logic/Order of Operations:** The old rule (Rc) is deemed valid *up to the point* it authorizes the creation of Rc'. Once Rc' is validly created *under Rc*, it supersedes Rc for future acts. The change is seen as a single act under the old authority, establishing new authority (e.g., many formalist approaches).
      *   **Political/Social Fact (Hartian):** The validity of Rc' ultimately depends on its acceptance by the relevant officials/citizens as the new rule of recognition/change, regardless of the logical circularity. The system "jumps tracks."
      *   **Nullity for Self-Destruction (Statute Example):** Many jurisdictions hold that a statute repealing itself is either void *ab initio* (never existed) or had instantaneous effect, disappearing immediately after enactment. Its only legal effect is its own disappearance.

  **Conclusion:**

  1.  **Established Term:** For your constitutional and game examples, **Self-Amendment** (specifically **Reflexive Self-Amendment** of the amendment rule) is the established term. Peter Suber's work is paramount.
  2.  **Closest General Concept:** The logical core is best described as the **Reflexivity Paradox of Secondary Rules** or **Rule-Circularity in Meta-Norms**. This highlights the application of a rule *about rule-change* to *itself*.
  3.  **Distinction:** This is distinct from simple self-reference, logical truth paradoxes, Kelsen's basic norm (which grounds the system), Hart's rule of recognition (which identifies validity), and antinomies (conflicts between norms). It's a paradox arising from the *self-application of the system's own rule of change*.
  4.  **Statute Example:** While sharing self-referential paradox, it's more specifically **Self-Annulment** or **Self-Destruction**, focusing on a first-order rule destroying itself instantly, rather than changing a higher-order meta-rule.

  **For your lecture:** Frame it as the **Logical Paradox of Reflexive Meta-Rule Change (Self-Amendment of the Amendment Rule)**. Use Suber as the anchor. Contrast it with the simpler **Self-Annulment** paradox of the statute. Emphasize how legal systems navigate this logical cliff edge through doctrines of implicit limits, temporal sequencing, or acceptance, moving from pure logic to institutional practice. This structure is fundamental to understanding the limits of legal positivism and the dynamic nature of constitutional systems.
