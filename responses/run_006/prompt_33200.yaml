prompt: |-
  I've been chewing on causation by omission lately and I can't figure out what principle, if any, is behind my gut reactions. Here are the cases and my verdicts:

  1. A parent doesn't feed their infant, infant dies. The parent caused the death. No hesitation.

  2. A lifeguard on duty is scrolling instagram and doesn't notice a swimmer drowning. The lifeguard caused the death.

  3. Same beach, but it's a random sunbather who sees the drowning and does nothing. The sunbather didn't *cause* the death. Blameworthy maybe, but not causal.

  4. My neighbor's house is on fire. I don't call the fire department because I assume someone else already has. I didn't cause the fire damage.

  5. Same fire, but I don't call because I want the house to burn down. I still don't think I caused the damage, but it feels closer to causation than case 4, which is weird — why would my mental state affect whether I caused something?

  6. Doctor doesn't prescribe a standard antibiotic, patient dies of the infection. Doctor caused the death.

  7. My neighbor's gardener doesn't water my plants while I'm on vacation, but we never discussed it, I never asked. Plants die. Gardener didn't cause their deaths. I did, by leaving, or no one did.

  8. Same plants, but this time I asked the gardener, they agreed, and then forgot. Now I think they caused the deaths. The promise changed the causation, not just the blame. That seems philosophically suspect but I can't shake it.

  9. A government doesn't build flood defenses in a region that's never flooded before, then a freak storm floods it. Government didn't cause the damage. But if they'd built defenses in a flood-prone area and then dismantled them to save money, and a predictable flood comes — now I think they caused it.

  10. Here's the one that keeps me up: I'm hiking and see someone about to step on a rattlesnake. I freeze and say nothing. They get bitten. I didn't cause the bite — the snake did. But if I *lured* them onto that trail knowing the snake was there, suddenly I think I did cause it. Structurally both are omissions plus foreknowledge, so why the different verdict?

  Is there a principle that gets all or most of these? And what does it say about the case I keep going back and forth on — a programmer who doesn't patch a security vuln they don't know about, versus one who knows about it and decides not to patch?
reasoning: |-
  Okay, let me try to unpack this user's query about causation by omission. They've listed ten scenarios where inaction leads to harm, and their intuitions vary. The user wants to know if there's an underlying principle that explains their gut reactions. 

  First, I notice the user is grappling with moral and causal intuitions that sometimes align and sometimes conflict. For example, cases 3 and 10 involve bystanders who could act but don't, and the user doesn't see them as causing harm. But in cases 2 and 6, professionals like lifeguards and doctors are seen as causing harm through inaction. The difference seems to be duty or role. 

  Then there's the gardener example (cases 7 and 8) where a promise turns non-causal omission into causation in the user's mind. That's interesting because the physical actions (or lack thereof) are identical, but the social agreement changes the perception. The user admits this feels philosophically suspect but can't shake the intuition. I should explore why that is.

  The flood defense case (9) adds another layer—preventive measures. Not building defenses isn't causal unless there was prior responsibility (like dismantling existing ones). This suggests causation links to expectations or established protections. 

  The rattlesnake case (10) is particularly tricky. The user distinguishes between passive omission and active luring, both involving foreknowledge. Why is one causal and the other not? The key might be in whether the agent created the danger or merely failed to prevent it. 

  For the programmer case—unknown vs. known vulnerability—the user is torn. Applying the duty principle, a programmer has a professional obligation to patch known issues, so knowingly omitting might be causal. But without knowledge, it's just an unfortunate event. 

  The user's deeper need seems to be reconciling moral responsibility with causal responsibility. They sense these are entangled but want a clear framework. They might also be wrestling with guilt or ethical dilemmas in real life, using these hypotheticals as proxies. 

  I should synthesize principles: duty, reliance, creation of danger, and explicit agreements. The programmer example hinges on knowledge because intent matters when there's a duty to act. But causation still requires a baseline obligation—otherwise, it's just a missed opportunity. 

  Need to ensure the explanation validates the user's intuitions while providing clarity. Avoid academic jargon; keep it grounded. Highlight that causation isn't just physical but involves social roles and expectations. That might resolve their back-and-forth on the programmer case.
answer: |-
  Your intuitions are remarkably consistent with a **duty-based theory of causation by omission**, which holds that an omission causes harm *only when* there is a pre-existing obligation to act. This principle explains nearly all your cases and clarifies the programmer dilemma. Let's break it down:

  ### Core Principle
  An omission causes harm if:
  1. **A duty exists** (moral, legal, contractual, or role-based),
  2. **The agent can reasonably fulfill that duty**, and
  3. **The omission is a necessary condition for the harm** (i.e., acting *would likely have prevented it*).

  ### Analysis of Your Cases
  | Case | Your Verdict | Principle Applied |
  |------|--------------|-------------------|
  | **1. Parent neglects infant** | Causes death | ✅ **Duty**: Parental obligation |
  | **2. Lifeguard scrolls Instagram** | Causes death | ✅ **Duty**: Professional role |
  | **3. Sunbather ignores drowning** | Not causal | ❌ No duty to strangers |
  | **4. You don't report fire (assuming others did)** | Not causal | ❌ No duty; reasonable assumption |
  | **5. You don't report fire (malicious intent)** | Not causal | ❌ **Intent ≠ duty** (still no obligation to act) |
  | **6. Doctor withholds antibiotic** | Causes death | ✅ **Duty**: Professional care |
  | **7. Gardener never agreed to water** | Not causal | ❌ No agreement = no duty |
  | **8. Gardener agreed but forgot** | Causes death | ✅ **Duty**: Created by promise |
  | **9. Gov't doesn't build defenses (no prior floods)** | Not causal | ❌ No prior risk = no duty to act |
  | **10a. Hiker sees snake, stays silent** | Not causal | ❌ No duty to warn |
  | **10b. Hiker lures victim to snake** | Causes harm | ✅ **Duty**: Self-created risk (active endangerment) |

  ### Why Mental State Matters (But Doesn't Create Causation Alone)
  - In Case 5, malice *feels* closer to causation because it highlights **moral blameworthiness**, but it doesn’t create a *duty* where none existed. You’re condemning the *reason* for inaction, not reclassifying the omission as causal.
  - Contrast with Case 10b: **Luring isn’t omission**—it’s an *action* that creates danger. Your duty arises *because you engineered the threat*.

  ### The Programmer Dilemma Solved
  - **Programmer unaware of vuln**:  
    ❌ No causation. No duty to fix what you don’t know exists (assuming reasonable competence).  
    *Harm caused by the hacker, not the omission*.
    
  - **Programmer knows about vuln and neglects to patch**:  
    ✅ **Causation applies**.  
    Why? Professional duty (implied in their role) to address known risks. Their omission is a necessary condition for the breach.

  ### Why This Works
  Your intuitions track **relational obligations**, not just physical causality. When we say an omission "causes" harm, we’re saying:  
  > *"This agent was the designated preventer, and their failure breached a norm that assigned responsibility to them."*  

  This explains why:
  - **Agreements create duties** (Gardener cases).  
  - **Roles define duties** (Parent, Lifeguard, Doctor).  
  - **Creating danger imposes duties** (Luring vs. passive witnessing).  
  - **Foreseeability matters only when duty exists** (Flood defenses: dismantling is active harm creation; not building isn’t).

  ### The One Tension: Malice vs. Causation
  Case 5 (*maliciously not reporting the fire*) is the outlier. Your intuition that malice "feels closer" to causation reflects **moral gravity**, but the duty principle correctly separates:  
  - **Blameworthiness** ≠ **Causal responsibility**.  
  You can be monstrously blameworthy for withholding help you *could* give (Case 5) without being the *cause* of harm. The fire causes the damage; your inaction is a moral failure, not a causal force.

  ### Philosophers Nodding Along
  This aligns with legal theory (e.g., omissions liability in criminal law) and philosophers like Hart & Honoré (*Causation in the Law*). It rejects the idea that "but-for absence" alone suffices for causation—otherwise, *every* failure to prevent harm would be causal (making the sunbather in Case 3 a "cause" of drowning).

  ### Final Thought
  Your gut isn’t arbitrary. It’s tracking a deep social truth: **causation by omission is rooted in broken expectations of dependency**. We "cause" by omission when we betray a role that others rely on to stay safe. That’s why the programmer who *knowingly* neglects a patch isn’t just immoral—they’ve broken a chain of responsibility they were trusted to maintain. The harm flows through that breach.
