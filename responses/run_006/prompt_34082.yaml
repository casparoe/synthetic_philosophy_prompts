answer: |-
  ### Final Exam Question  
  **"Prioritarianism is often presented as a solution to the leveling-down objection that plagues egalitarianism. Does prioritarianism genuinely *resolve* the normative problem identified by the leveling-down objection, or does it merely *avoid* the objection by redefining the foundational concern of distributive justice? In your answer, critically evaluate whether prioritarianism addresses the moral intuition that makes leveling down troubling, or whether it sidesteps egalitarianism’s core challenge by replacing a relational commitment with an absolute, weighted concern for the worse-off."**  

  ---

  ### Model Answer (798 words)  
  Prioritarianism claims to salvage the intuition that benefiting the worse-off matters more while avoiding egalitarianism’s susceptibility to the leveling-down objection (LDO). However, a closer analysis reveals that prioritarianism does not *resolve* the LDO’s challenge to egalitarian values; instead, it *evades* the objection by abandoning relational equality altogether and embedding an aversion to leveling down into its axiological structure. This redefinition changes the subject of distributive justice, leaving egalitarianism’s core moral problem unaddressed.  

  **The Leveling-Down Objection’s True Target**  
  The LDO (Parfit 1997) exposes a flaw in *telic* egalitarianism: if equality is intrinsically valuable, leveling down—making some worse off without improving anyone—should be *pro tanto* good because it increases equality. Yet this seems absurd; justice cannot recommend gratuitous harm. Crucially, the LDO does not merely challenge egalitarianism’s policy implications but its *axiological coherence*: can a relational value (equality) justify absolute losses? Egalitarians like Temkin respond that the objection reveals a conflict between equality and other values (e.g., well-being), but concedes that telic egalitarianism must accept that leveling down has *some* value. Prioritarianism enters as a purported solution by making the moral value of benefits depend solely on absolute well-being levels, weighted toward the worse-off.  

  **Prioritarianism’s Avoidance Strategy**  
  Prioritarianism avoids leveling down by construction: since it assigns no value to equality itself, reducing a better-off person’s welfare without aiding the worse-off yields no gain in value. The prioritarian "weighting" function (e.g., giving priority to gains for those at lower well-being levels) only registers improvements. For example:  
  - *Case 1 (Leveling Down)*: A moves from (5, 5) to (3, 3). Egalitarians see increased equality as good; prioritarians see no value gain.  
  - *Case 2 (Priority to Worse-Off)*: A moves from (5, 2) to (5, 4). Prioritarians value B’s gain more due to weighting; egalitarians value reduced inequality.  

  Here, prioritarianism avoids endorsing leveling down, but this is because it *eliminates equality as a consideration*. The LDO targets the claim that *equality is intrinsically valuable*. Prioritarianism "solves" the problem by denying this premise outright—replacing relational evaluation with an absolute, person-affecting weighting system. It does not reconcile equality’s value with the intuition against harming some for no benefit; it discards equality as irrelevant.  

  **Does Prioritarianism Preserve the Moral Insight?**  
  Prioritarians argue that weighting captures the "kernel" of egalitarianism (e.g., helping the worse-off matters more) without awkward consequences. However, this misdiagnoses the LDO’s lesson. The objection does not merely show that egalitarianism leads to bad outcomes; it questions whether a *relational* ideal can be coherent when it values states where no one benefits. Prioritarianism sidesteps this by making the moral value of distributions entirely *non-relational*. Consider two implications:  
  1. **The Non-Identity Problem**: Prioritarians must weight gains based on absolute well-being, not comparative disadvantage. If two people exist at (10, 1), giving a unit to the worse-off is highly valuable. But if we compare this to a society of two people at (1, 1), giving a unit to either has less priority. Egalitarians would note that the first society involves radical inequality—a concern prioritarianism ignores.  
  2. **Irrelevance of Relative Gains**: In a society (8, 2), improving the better-off to 10 has low prioritarian value. In a society (4, 2), improving the better-off to 6 has *higher* prioritarian value (since 2 is weighted more heavily than 6). Yet egalitarians would object that worsening relative inequality in the second case (from 4:2 to 6:2) is unjust—a concern prioritarianism dismisses.  

  Prioritarianism thus fails to capture why leveling down feels troubling *for egalitarians*. The unease arises from the tension between relational equality and well-being. By rejecting the relational element, prioritarianism does not resolve this tension; it renders it invisible.  

  **Is Avoidance Philosophically Defensible?**  
  One might argue prioritarianism improves on egalitarianism by purging it of incoherent elements. But this misses the point: if distributive justice includes a fundamental commitment to relational fairness (e.g., opposing caste systems or exploitative hierarchies), prioritarianism does not "solve" the LDO—it *abdicates* the terrain where the objection bites. Anderson (1999) and Scanlon (2018) stress that equality matters as a social-relational ideal (e.g., avoiding oppression). Prioritarianism, focused solely on weighted well-being aggregates, cannot explain why *non-exploitative* inequalities (e.g., due to luck) might still be objectionable. It reduces justice to compassionate allocation, not a demand for mutual regard among equals.  

  **Conclusion**  
  Prioritarianism avoids the leveling-down objection by replacing telic egalitarianism’s relational value with an absolute priority-weighted welfare function. However, it does not resolve the normative problem the LDO poses—that relational equality struggles to justify absolute losses. Instead, it suppresses the conflict by redefining distributive justice’s core concern. For those who see equality as intrinsically tied to social relations, prioritarianism changes the subject. It offers a coherent alternative to egalitarianism but cannot claim to have answered egalitarianism’s deepest challenge. The LDO remains a valid critique of telic egalitarianism; prioritarianism merely builds a fortress elsewhere.  

  ---

  ### Marking Scheme (Total: 25 Marks)  
  **A (22–25 Marks): Outstanding**  
  - **Correctly Identifies**: Prioritarianism avoids LDO by abandoning relational equality and embedding anti-leveling into its value function.  
  - **Critically Engages**: Argues that prioritarianism does not *resolve* the moral tension in egalitarianism but *evades* it by redefining the subject.  
  - **Key Moves**:  
    - Contrasts telic egalitarianism’s axiological problem (relational value vs. absolute loss) with prioritarianism’s non-relational structure.  
    - Uses examples (e.g., non-identity problem, irrelevance of relative gains) to show prioritarianism’s indifference to equality.  
    - Engages the "changing the subject" critique (e.g., Anderson/Scanlon on social equality).  
    - Concludes that prioritarianism offers an alternative but leaves egalitarianism’s core challenge unanswered.  
  - **Typical Misses**: None significant; may lack nuance on deontic egalitarian responses.  

  **B (17–21 Marks): Competent**  
  - **Correctly Identifies**: Prioritarianism avoids leveling down via weighting and rejects equality as intrinsically valuable.  
  - **Limited Critical Engagement**: Explains *how* prioritarianism avoids LDO but does not deeply interrogate whether this "solves" or "sidesteps" the problem.  
  - **Key Moves**:  
    - Describes LDO and prioritarianism’s weighting mechanism accurately.  
    - Notes that prioritarianism focuses on absolute (not relative) positions.  
    - States that prioritarianism changes the focus from equality to priority but does not explore philosophical implications.  
    - May claim prioritarianism "solves" LDO without examining if egalitarian concerns persist.  
  - **Typical Misses**:  
    - Does not contrast prioritarianism’s *avoidance* with a genuine *resolution* of egalitarianism’s tension.  
    - Omits discussion of relational vs. non-relational values (e.g., misses Anderson/Scanlon).  
    - Uses examples mechanically without drawing out normative implications.  

  **C (12–16 Marks): Adequate**  
  - **Correctly Identifies**: Basic definitions of prioritarianism, LDO, and how prioritarianism rejects leveling down.  
  - **Superficial Engagement**: Summarizes Parfit or prioritarianism’s formula without addressing the question’s core ("resolve vs. avoid").  
  - **Key Moves**:  
    - Recites the LDO and prioritarianism’s response.  
    - Mentions that prioritarianism weights gains to the worse-off.  
    - May conflate deontic/telic egalitarianism or misstate prioritarianism.  
  - **Typical Misses**:  
    - Fails to analyze whether prioritarianism "changes the subject."  
    - Does not discuss the moral intuition behind LDO or relational equality.  
    - Omits critical evaluation; answer is descriptive, not argumentative.  

  **Deductions**  
  - **−1−3**: Factual errors (e.g., misdefining LDO, prioritarianism).  
  - **−2−4**: Poor structure/unclear argument.  
  - **−3**: No examples.  

  This scheme rewards students for moving beyond *description* to *critical analysis* of prioritarianism’s philosophical strategy, emphasizing the shift from relational to absolute valuation.
