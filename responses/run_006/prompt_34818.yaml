prompt: |-
  I'm an advanced undergraduate in philosophy, and I've noticed a pattern in ordinary life that I can't find a label for. I'm hoping you can tell me whether it has an established name in the epistemological literature, and if so, what it is, how it's defined, and where its boundaries are—or if nothing quite fits, whether you can coin a term and mark it off from the nearest neighbors.

  Here's the pattern. Twice in the last month I've caught myself and others doing something odd with the word "know." The first time: my partner asked whether I knew if the pharmacy was open on Sunday. I said yes—I'd been there on a Sunday a few weeks ago. Then she said, "Are you sure? Because if it's not, we're out of luck on the prescription until Monday, and the doctor said not to miss a dose." And I found myself saying, "Well, I don't really know—I just remember it being open once." The second time: a seminar professor asked whether anyone knew the publication date of a certain paper. I said I did—1987. He said, "You're sure? It matters for the chronology of the argument." And I hedged: "I think so, but I guess I don't know." In both cases, my evidence didn't change; what changed was what hung on being right. Yet the word "know" seemed to come and go with the stakes.

  I've noticed a related pattern in arguments more generally: someone asserts a claim with confidence, and when the practical costs of being wrong are raised, they retreat to "I don't know"—but if the stakes are lowered again, the confidence returns. It's not that they're lying or equivocating in the ordinary sense; it's more that the threshold for what counts as "knowing" seems to move with the practical context.

  So my question: is there a standard term for this phenomenon—the way the truth or assertability of "S knows that P" appears to depend on what's practically at stake for the speaker? I've come across the phrase "knowledge is stakes-sensitive," but I'm not sure whether that's a named doctrine, a folk observation, or something else. If there is a name, I'd like to know what it covers, what it excludes, and how it relates to nearby ideas about context and knowledge. If there isn't one, I'd like a proposal: a term, a definition, and a clear statement of how it differs from the closest existing concepts.

  Please take the role of a professor of epistemology who is generous with the theoretical landscape but precise about distinctions. Think through the question carefully—don't just reach for the nearest label. I'm less interested in the name itself than in the carving: what exactly this phenomenon is, what it isn't, and where its edges are.

  Please structure your response as follows:

  1. **Identification** (roughly 150 words): Does this phenomenon have an established name? If so, what is it? If it maps onto more than one candidate, name them all and say which you think is the best fit at first glance.

  2. **The concept, defined** (roughly 200 words): Give a precise definition of the concept you've identified as the best fit. What are its necessary and sufficient conditions, if any? What canonical examples or thought experiments is it associated with?

  3. **Distinctions and boundaries** (roughly 250 words): How does this concept differ from the nearest alternatives? What phenomena does it exclude that a naive reading might include? Are there borderline cases that reveal something about the concept's limits?

  4. **What's settled, what's contested** (roughly 200 words): Among philosophers who work on this, what is widely agreed upon and what remains genuinely disputed? Please don't present a contested view as the consensus.

  5. **If nothing fits** (roughly 150 words, or skip this section if you identified a clear fit in section 1): If you think no established concept captures the phenomenon, propose a term, define it, and explain what it picks out that existing concepts miss.
