prompt: |-
  Okay so I've been reading the Pascal's mugging literature on and off for years and I've realised I still can't tell whether my position is justified or just a refusal to take expected utility seriously when the numbers get silly. I want to force myself to be precise.

  What's your credence that the correct response to a standard Pascal's mugging is to refuse to pay? Standard setup: a mugger claims they will torture 3↑↑↑3 people unless you give them £5. You have no way to verify their claim; your prior on them having this power is astronomically small, but the stakes are astronomically large, and expected utility says pay up.

  I want a number, but I mostly want the decomposition. The sub-questions I can see:

  (a) Are bounded utility functions the right solution? (i.e. utility maxes out at some finite value, so no threat can be infinitely bad)

  (b) If utility is unbounded, should we use something like a complexity penalty on hypotheses that makes the mugger's prior so low that expected utility still says don't pay?

  (c) Is there a principled reason to treat the mugger's threat as literally incoherent — not just unlikely, but not the kind of thing that can figure in a decision problem at all?

  (d) Does the fact that you'd also pay a second mugger, and a third, etc., until you're broke, matter for whether paying the first one is correct? (i.e. is the problem really about dutch books or iterated muggings?)

  Give me numbers for each, how they combine, and which sub-question your overall credence is most sensitive to. I'm at maybe 0.9 that you shouldn't pay but I'm not proud of how I got there. If you're also above 0.9, tell me what you think the strongest argument for paying actually is — the one that makes you least comfortable with your answer.

  Oh and please write the answer in American English even though I'm writing this in British English, just a preference.
