answer: |-
  You've hit upon one of the most fascinating and philosophically rich concepts in decision theory and political philosophy! What you're describing has a name—**precommitment**—but the "weirdness" you're noticing reveals profound questions about identity, rationality, and autonomy. Let's break this down step by step:

  ### Core Terminology & Conceptual Frameworks
  1. **Precommitment (or Ulysses Pact):**  
     This is the overarching term. Named after Odysseus (Ulysses in Latin) who tied himself to his ship's mast to resist the Sirens' song, it describes **binding your future self to a course of action** to avoid succumbing to anticipated irrationality or temptation.  
     - *Key Philosophers:* Jon Elster ("Ulysses and the Sirens," 1979) pioneered its modern analysis. Thomas Schelling ("The Strategy of Conflict," 1960) explored it in game theory.

  2. **Self-Binding Commitment:**  
     A subset of precommitment emphasizing **the self-imposed nature of the restraint**. It explicitly addresses your paradox: *the same agent acts as both "binder" and "bound."*  
     - *Key Thinkers:* Derek Parfit ("Reasons and Persons," 1984) links this to personal identity over time.

  3. **Constitutional Precommitment:**  
     The political version you mentioned (e.g., constitutions hard to amend). Here, a polity's "present self" binds its "future self" to core principles.  
     - *Key Debate:* Legal scholar Stephen Holmes argues this preserves democracy by safeguarding its foundations. Critics like Jeremy Waldron see it as undemocratic "dead hand control."

  ---

  ### Why It Feels Philosophically "Tricky": The Core Tensions
  Your unease taps into four major philosophical dilemmas:

  1. **The Divided Self Problem:**  
     Precommitment assumes we are **temporally fragmented beings**. Your "Tuesday planner-self" (rational, long-term view) distrusts your "Wednesday actor-self" (vulnerable to impulses). But *who is the "real" you?*  
     - **Parfit's View:** There's no enduring "self." We're a series of connected selves. Tuesday-you has no more authority than Wednesday-you—it's about which self best aligns with your deepest values.  
     - **The Akrasia Paradox:** If Wednesday-you angrily demands dessert, is that your "authentic" desire? Aristotle’s *akrasia* (weakness of will) suggests it’s a failure of rationality, not authenticity.

  2. **Rationality Wars:**  
     Is precommitment rational or a confession of irrationality?  
     - **Pro:** Economists (e.g., Robert Strotz) model it as **hyperbolic discounting**: We value immediate rewards too highly. Precommitment corrects this bias.  
     - **Con:** Philosopher Edna Ullmann-Margalit argues it’s **self-paternalism**. If Wednesday-you prefers dessert, overriding that preference insults your autonomy.

  3. **Agency and Autonomy:**  
     Can you meaningfully "constrain yourself"? Libertarians like Robert Nozick see this as incoherent: if you *choose* to eat dessert, you’re still acting freely. Precommitment defenders counter: true autonomy requires **protecting your capacity for rational choice** from internal threats (e.g., addiction).

  4. **The Democracy Paradox (Political Version):**  
     When founders make constitutions hard to amend, they imply:  
     *"We, the sober drafters, know better than you, future citizens swayed by passions."*  
     - **Holmes' Defense:** Constitutions enable democracy by preventing tyrannical majorities (e.g., banning rights violations).  
     - **Waldron's Critique:** It’s arrogant. Why assume past generations were wiser? Democracy requires trusting present majorities.

  ---

  ### Flavors of Precommitment & Their Nuances
  | **Type**               | **Mechanism**                          | **Example**                          | **Philosophical Twist**                     |
  |------------------------|----------------------------------------|--------------------------------------|---------------------------------------------|
  | **Physical Barriers**  | Make temptation inaccessible           | Frozen credit card                   | Reduces choice *options*, not willpower     |
  | **Social Delegation**  | Empower others to enforce your rule    | Roommate with cigarettes             | Introduces *interpersonal* accountability   |
  | **Procedural Hurdles** | Add steps to reverse decisions         | No dessert menu at the restaurant    | Exploits "friction" to delay impulsivity    |
  | **Constitutional**     | Legal rigidity (e.g., amendment rules) | U.S. Constitution's Article V        | Binds *collective* future selves            |

  ---

  ### Why This Isn't Just "Self-Control"
  Ordinary willpower relies on *moment-by-moment resistance*. Precommitment is different: it **strategically alters future choice architectures** to make weakness of will impossible or costly. It’s not fighting temptation in the moment—it’s destroying the battlefield beforehand.

  ---

  ### Brainstorming Your "Unsettling" Feeling: The Paradox Revisited
  Your intuition about the strangeness of "one self binding another" is spot-on. Philosophers call this **the problem of diachronic autonomy**: can a past decision legitimately bind a future agent who is *psychologically continuous* but not *identical*? Consider:
  - If Wednesday-you melts the ice-block to get the credit card, is that a "free" choice? Or was Tuesday-you’s freezing action a denial of Wednesday’s agency?
  - **Possible resolution (Elster):** Precommitment is rational if your *meta-preferences* (what you value overall) align with Tuesday-you, while Wednesday-you is hijacked by *temptation*. The "real" you is the planner, not the impulse.

  ---

  ### In Summary
  - **Term:** **Precommitment** or **Ulysses Pact** (for vivid individual cases), **Constitutional Precommitment** (for political versions).
  - **Why it’s tricky:** It exposes our non-unitary selves, challenges definitions of autonomy, and forces us to ask: *Which version of "me" deserves sovereignty?*
  - **Key Debate:** Is this profound wisdom (protecting our best selves) or self-inflicted tyranny (denying our evolving desires)?

  This isn’t just academic—it’s a toolkit for navigating human frailty. Your examples reveal how we hack our own psychology to survive in a world of temptations. If anything, your "thinking too much" has led you to a profound crossroad of philosophy, behavioral economics, and politics where even experts still wrestle with the implications. Well spotted!
