answer: |-
  Here's a Q&A prep sheet prioritizing objections by damage potential, tailored for your audience, with concise replies and vulnerability notes:

  **Top-Tier Objections (High Damage Potential)**

  1.  **Objection (Legal Theorist):** "Your account eviscerates negligence law. Liability *requires* causation. If omissions aren't causal, how can we justify holding the lifeguard liable for the drowning? Are you suggesting negligence liability is fundamentally incoherent or requires a radical overhaul?"
      *   **Reply:** "No. Negligence liability requires *duty*, *breach*, *factual connection*, and *harm*. I argue the 'factual connection' element for omissions isn't causal but *normative-counterfactual*. The lifeguard *should have acted* (duty/breach), and *had they acted as required*, the harm *likely would not have occurred* (normative-counterfactual dependence). Liability rests on this dependence plus the breached duty, not ontological causation. The structure remains intact."
      *   **Weakness:** Requires convincing legal scholars to decouple "cause-in-fact" from ontological causation, a significant conceptual shift. The "normative-counterfactual" link needs robust development to replace causation's perceived objectivity.

  2.  **Objection (Metaphysician - Productionist):** "You claim omissions lack productive 'oomph'. But what about *preventions*? If I *actively* block a rescue (push the lifeguard), that's a cause. If I *omit* to remove the block (knowingly leave the gate locked), the absence of my removal *allows* the harm – it's the *same physical process* being facilitated by the absence. Isn't the absence playing a symmetric, causally relevant role in the process?"
      *   **Reply:** "Preventions involve *active interventions* altering a process. The locked gate is a physical state (the lock's presence) causing obstruction. The omission is the *absence of unlocking*. The physical process leading to death is caused by the *presence* of the obstacle (water, locked gate), not by the *absence* of the rescuer's key-turning. The omission describes *our normative expectation* that someone *should have altered* the causal chain dominated by presences."
      *   **Weakness:** The line between "presence of obstacle" and "absence of remover" can feel semantic. Explaining why facilitating harm via absence is fundamentally different from causing it via presence in the underlying physics/metaphysics is challenging.

  3.  **Objection (Legal Theorist/Metaphysician):** "Your distinction collapses in cases of *dependent powers* or *sustaining causes*. A plant dies from *lack* of water. Is the absence of water not a cause? The heart's beating *sustains* life; its omission (stopping) causes death. Isn't the ongoing *absence* of cessation (the beating) causally sustaining, and thus its omission genuinely causal?"
      *   **Reply:** "The plant dies because of the *presence* of destructive processes (dehydration, cell breakdown) enabled when water is absent. The heart stopping is the *presence* of a new state (cessation) initiating destructive processes. Sustaining is the *ongoing presence* of an activity (the beating). We *describe* the death as caused by 'lack of water' or 'heart failure,' but metaphysically, it's the *presences* (destructive processes, cessation event) doing the causing. The omission language points to the *failure of an expected sustaining presence*."
      *   **Weakness:** Requires denying that absences can be sustaining causes or that dependent powers require absences as genuine relata. This may seem counterintuitive and requires a strong commitment to a purely "positive" ontology of causation.

  **Mid-Tier Objections (Significant Challenge)**

  4.  **Objection (Metaphysician - Difference-Maker):** "On a sophisticated difference-making account (e.g., causal modeling, interventionist theories), omissions *are* difference-makers. Holding fixed other factors, intervening to *make* the lifeguard jump in *changes* the outcome. This manipulability *is* causation. Are you rejecting the entire difference-making framework?"
      *   **Reply:** "I accept difference-making is crucial for *explanation* and *responsibility attribution*. But manipulability via introducing a presence (the rescue) doesn't prove the prior *absence* was itself a cause. It shows the world *would have been different* had a presence occurred. This is normative-counterfactual dependence vital for responsibility, but it doesn't entail the absence itself possessed causal efficacy within the actual sequence of events dominated by presences (the drowning process)."
      *   **Weakness:** Concedes significant ground to difference-making accounts for practical purposes while insisting on a metaphysical distinction that may seem overly fine-grained or irrelevant to legal practice.

  5.  **Objection (Legal Theorist):** "The law often treats acts and omissions identically when duty exists (e.g., failing to feed a child vs. poisoning them). Your theory creates an artificial metaphysical gap where the law (and moral intuition) sees normative equivalence. Isn't this a reason to think your metaphysical criterion is flawed or irrelevant to the legal concept of causation?"
      *   **Reply:** "The law's (and morality's) *normative* equivalence is precisely my point! We hold agents equally responsible because the *normative-counterfactual dependence* and breached duty are identical. The law *calls* both 'causation,' but this is a normative attribution masking an underlying metaphysical difference. Recognizing this distinction clarifies that liability for omissions rests squarely on duty and counterfactual dependence, not importing problematic causal metaphysics."
      *   **Weakness:** Risks appearing dismissive of legal doctrine and common moral intuition. Requires arguing that law's conceptual conflation is a mistake needing correction, which is a heavy lift.

  **Lower-Tier Objections (Manageable)**

  6.  **Objection (Metaphysician):** "Aren't you just pushing the problem back? If omissions aren't causes, what *are* the causes in these scenarios? The drowning? The bacteria? But these seem insufficient – we need the omission to explain why *this particular harm* occurred *to this victim* at *this time*."
      *   **Reply:** "The causes are the positive events and processes: the wave overwhelming the swimmer, the bacterial proliferation overwhelming the immune system. The omission explains *why the preventatives or sustainers expected by norm weren't there*, making the victim vulnerable to those positive causes. But the *causal work* is done by the positive events. The omission is part of the *explanatory context*, not the causation."
      *   **Weakness:** May seem unsatisfying; the "explanatory context" feels causally loaded. Requires careful separation of causation from explanation.

  7.  **Objection (Legal Theorist):** "What about statutory duties? If a statute *defines* the failure to file a form as causing a penalty, is that not causation by omission by legal fiat? Doesn't this show causation is a legal construct?"
      *   **Reply:** "Statutes create *legal consequences* contingent on factual scenarios (including omissions). Calling the penalty 'caused' by the omission is legal shorthand, not metaphysical assertion. The statute establishes a normative link: *if* omission X occurs, *then* penalty Y follows. This is a rule-based imputation, not evidence for ontological causation by absence."
      *   **Weakness:** Easy reply, potentially dismissive. Acknowledge legal constructivism but hold the metaphysical line.

  **The Question You Hope Nobody Asks**

  *   **Objection (Savvy Metaphysician/Legal Theorist):** "You argue omissions lack the 'productive' features of genuine causes. But isn't your *entire account* vulnerable to the charge that *all* causation, even by 'positive' events, ultimately relies on *contrastive* or *difference-making* reasoning to pick out the relevant cause from the causal field? If causation fundamentally involves contrasts (the spark vs. the oxygen, the punch vs. the victim's frailty), then isn't the omission (no rescue) simply the relevant contrastive *absence* selected by the normative context (the duty to rescue) against the backdrop of other present factors? Doesn't this collapse your production/difference-making distinction entirely, showing omissions *are* causes in precisely the same contrastive way as presences?"
      *   **Why it's Damaging:** Directly attacks the core distinction your thesis relies on. It argues that *all* causal attribution is contrastive and context-dependent, making normative selection inherent in *any* causal claim. If true, singling out omissions as non-causal based on a lack of "intrinsic production" becomes untenable; omissions are just one type of contrastive factor. This undermines the metaphysical foundation of your argument and suggests the difference is merely pragmatic or linguistic, not ontological.
      *   **Potential Reply (2-min):** "While contrast is crucial for *identifying* causes within a complex field, it doesn't erase the ontological distinction between events that *contribute energy/momentum/force* (presences) and the *absence* of such contribution. Contrast helps us *focus* on which presence is salient (e.g., the spark, not the oxygen). For omissions, contrast *creates* the salient factor – the absence itself – precisely because no positive contribution occurred. The normative context selects *which absence matters*, but the absence itself is still metaphysically inert; it doesn't *do* anything. The causal work remains with the presences enabled by that absence."
      *   **Weakness of Reply:** Highly contentious. Many metaphysicians argue causation *is* inherently contrastive and "production" is either illusory or reducible to difference-making. Defending "intrinsic production" as ontologically prior to contrast is a major burden. The reply risks sounding like special pleading for a discredited view.

  **Key Q&A Strategy:**
  *   **Anchor in Law:** Emphasize that your view *preserves* negligence liability via duty + normative-counterfactual dependence. It's a reinterpretation, not an abolition.
  *   **Concede Explanatory Power:** Acknowledge that omissions are crucial for explanation and responsibility attribution – you're just denying they are *metaphysical causes*.
  *   **Focus on "Positive Ontology":** Consistently redirect to the claim that the actual causal work in the world is done by presences (events, processes, states), and omissions are defined by the *lack* of such a presence where normatively expected.
  *   **Acknowledge Weaknesses Honestly:** Briefly admitting the tough points ("That's a challenging point about contrast...", "The normative-counterfactual link does need more formalization...") builds credibility and disarms critics.
  *   **Know Your Allies:** Identify sympathetic metaphysicians (e.g., followers of Dowe, Salmon, or certain process theorists) whose work you can reference briefly if challenged.

  Good luck! Your thesis is provocative and well-positioned to spark a lively debate.
