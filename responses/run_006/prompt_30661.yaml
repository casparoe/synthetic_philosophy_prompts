prompt: |-
  You're a philosopher of science who works on natural kinds and biological classification, and you're good at turning theory into something a working biologist can actually use. I want you to think carefully and start by brainstorming a bit before you write the final procedure.

  I'm on the scientific advisory committee of a state wildlife agency. Four or five times a year we have to rule on proposed changes to how we classify organisms: usually a proposal to split one recognized species into two, or to lump two into one, sometimes to recognize a subspecies or a population-level management unit. These decisions feed directly into endangered-species listings, hunting and fishing rules, and land-use permits, and they get challenged in court alot. We're mostly field biologists and ecologists; nobody on the committee has formal philosophy training, and we've been deciding case by case with no shared framework, which is starting to feel indefensible. Our director has to sign off on whatever we recommend and she wants a written rationale she can defend to a judge.

  I want you to write us a decision procedure we can actually run on a proposed split or lump. It should be grounded in what the philosophy of natural kinds has to say about when a category tracks something real in nature rather than just being a convenient filing system, but it has to be usable by smart non-philosophers over two or three meetings. It should be a checklist or sequence of questions to ask in order, and it should say clearly at each step what counts as a good enough answer, where the procedure stops with a no, and where it hands the decision to a person because the question is a values call rather than a scientific one.

  Before you write the procedure, brainstorm the relevant considerations: whether the candidate group supports induction, whether knowing something belongs to the group lets you predict other things about it that tend to pay off, whether the members share a stable cluster of properties held together by some underlying mechanism rather than just by our sorting, whether the thing is more like an individual with a history than a kind, whether recognizing it would force us to recognize a thousand other groups, and anything else you think matters. Then turn that into the procedure.

  Then run the procedure on three cases:
  (1) a proposal to split a widespread bird species into an eastern and a western species based on a small genetic difference, a difference in song, and no known ecological or morphological difference;
  (2) a proposal to recognize a fish population in a single watershed as its own management unit, where the population is isolated and locally adapted to water temperature but still reproductively compatible with the next watershed over;
  (3) a proposal to keep recognizing a traditional species that turns out to be a grab-bag of superficially similar but not closely related populations.

  I want the third one to be the case where your procedure gives an answer I'm not going to like, and I want you to be honest about where the procedure will misfire, what it can't settle, and whether the idea of natural kinds is doing real work here or just giving us a fancier way to describe our hunches. Don't give us a bibliography or a reading list; we need the procedure itself.
reasoning: |-
  Okay, the user is on a wildlife agency committee that handles species classification changes, which have real-world consequences like endangered species listings and land-use permits. They need a practical decision procedure grounded in the philosophy of natural kinds but usable by non-philosophers. 

  First, I need to unpack the core ideas from natural kinds philosophy that are relevant here. Natural kinds are categories that reflect real divisions in nature, not just human convenience. Key aspects include:
  - **Projectibility**: Can we make reliable predictions about members of the group?
  - **Cluster stability**: Do members share multiple properties consistently?
  - **Underlying mechanisms**: Is there a causal explanation (genetic, ecological) holding these properties together?
  - **Historical individuality**: Does the group have a shared evolutionary trajectory?
  - **Parsimony**: Does recognizing the group make our classification system messier or cleaner?

  The challenge is turning these abstract concepts into a step-by-step checklist. The procedure must have clear stopping points, indicate when a decision is scientific vs. values-based, and handle edge cases. 

  For the workflow, I imagine a sequential elimination process: Start with the most objective criteria (like reproductive isolation) before moving to fuzzier ones (like adaptive significance). Steps should escalate from "hard" science to "softer" judgments, with off-ramps where a "no" stops the process and handoffs where committees must exercise discretion. 

  The three test cases are perfect for stress-testing:
  1. **The bird split**: Genetics and song differences but no ecology/morphology. Should fail early on projectibility and mechanism criteria.
  2. **The fish management unit**: Local adaptation but reproductive compatibility. Should pass on adaptive significance and management utility but trigger a values call about conservation priorities. 
  3. **The grab-bag species**: Superficially similar but polyphyletic groups. Will force a "no" despite tradition, exposing where the procedure bites the bullet.

  I anticipate discomfort with Case 3—the procedure will demand lumping or reclassifying, which may upset stakeholders. That’s intentional; it shows the framework isn’t just rubber-stamping hunches. The philosophy is doing real work by privileging predictive utility over tradition.

  Biggest pitfalls: 
  - The procedure can’t resolve all debates (e.g., rank disputes between species/subspecies). 
  - It may undervalue historical/cultural attachments to existing categories. 
  - "Values calls" will still be contentious but at least made explicit.

  Final structure should be a flowchart-like Q&A with bold headers, dead-ends marked 🛑, and judgment calls marked ⚖️. No jargon, just plain questions like "Can you predict traits from group membership?" with biologist-friendly examples.
answer: |-
  Here's a practical decision procedure grounded in natural kinds philosophy, designed for wildlife agency use. The core idea: **A category is scientifically justified if recognizing it significantly improves *reliable prediction* for conservation/management decisions due to a *stable cluster of properties* with an *underlying causal mechanism*.** 

  ### Brainstormed Key Considerations
  1.  **Projectibility/Predictive Power:** Does assigning an organism to this group let you accurately predict other biologically/ecologically/behaviorally relevant traits better than chance or alternative groupings? (The *sine qua non* of a natural kind).
  2.  **Stable Property Cluster:** Do members consistently share a *suite* of significant, interdependent traits (not just one)? Is this clustering stable across time/relevant environments?
  3.  **Underlying Mechanism:** Is there a known or strongly inferred causal process (e.g., shared evolutionary lineage, genetic isolation, local adaptation, unique developmental pathway) explaining *why* the cluster coheres? (Avoids arbitrary groupings).
  4.  **Independence vs. Arbitrariness:** Does recognizing this group force us to recognize countless other similar divisions (making the system chaotic), or is it a relatively distinct node? (Avoids "splitting everything").
  5.  **Historical Individuality (vs. "Kind"):** Is this group best understood as a unique lineage with a shared history? (Applies well to populations/species). This often *provides* the mechanism.
  6.  **Operational Utility:** Does recognizing this group *specifically* improve management/conservation actions (e.g., setting quotas, protecting habitat, reintroduction success)? (Links science to mandate).
  7.  **Parsimony:** Does recognizing this group clarify the biological picture, or add unnecessary complexity without proportional gain in understanding/utility?
  8.  **Values Handoff:** Is the core debate about scientific reality, or about the *weight* or *significance* of differences given management goals? Science can describe differences; humans must decide if they are *important enough* for a specific action.

  ---

  ## The Wildlife Agency Classification Decision Procedure

  **Goal:** Determine if a proposed taxonomic/management unit (Split, Lump, New Unit) reflects a scientifically robust category justifying distinct recognition for management purposes.

  **Instructions:** Work through questions sequentially. Stop at any 🛑 or ⚖️. Answer questions using best available evidence (genetics, morphology, ecology, behavior, distribution). Document evidence/responses at each step.

  ### Step 1: The Predictive Power Test
  *   **Question:** If we assign an unknown individual to the proposed group (e.g., "Western Bird" or "Watershed Fish"), can we reliably predict *additional, biologically significant traits* (beyond those used to define it) better than if we assigned it to the broader group (e.g., "Original Bird Species" or "Downstream Fish")? (e.g., predict disease susceptibility, specific habitat requirement, migratory route, response to a threat, growth rate, reproductive timing).
      *   **Good Enough Answer:** YES, supported by empirical data or strong inference from mechanism (Step 3). Prediction must be relevant to potential management/conservation decisions.
      *   **🛑 STOP (No Justification):** NO, or predictions are weak/unreliable/irrelevant to management. *Proposal fails the core test of utility.*
      *   **Proceed to Step 2:** YES.

  ### Step 2: The Coherent Cluster Test
  *   **Question:** Are the traits defining the proposed group (and those predicted in Step 1) part of a reasonably *stable and correlated suite* of features? (e.g., genetics + song + timing; temperature tolerance + genetics + morphology). Is this clustering consistent across the group's range and over relevant timescales?
      *   **Good Enough Answer:** YES, multiple lines of evidence show consistent co-occurrence of traits beyond what random variation or simple environmental gradients would produce.
      *   **🛑 STOP (No Justification):** NO, traits are variable, uncorrelated, or inconsistently expressed. Group appears defined by one or two arbitrary characters. *Lacks robustness.*
      *   **Proceed to Step 3:** YES.

  ### Step 3: The Mechanism Test
  *   **Question:** Is there a known or strongly supported *underlying causal mechanism* explaining the stable cluster of traits? (e.g., significant genetic divergence + drift/selection causing song difference; historical isolation + selection for local adaptation; shared developmental constraint).
      *   **Good Enough Answer:** YES, mechanism is identified and plausibly explains the cluster (e.g., genetic data supports isolation-by-distance/barrier; selection experiments show local adaptation).
      *   **🛑 STOP (No Justification):** NO, mechanism is unknown, speculative, or demonstrably inadequate. *Cluster may be spurious or transient.*
      *   **Proceed to Step 4:** YES.

  ### Step 4: The Independence Test
  *   **Question:** Does recognizing this group create a clear, relatively distinct category without forcing us to immediately recognize a large number of other, equally valid groups at the same level? (e.g., splitting the "Western Bird" wouldn't logically require splitting every adjacent population with a minor song variant).
      *   **Good Enough Answer:** YES, the group represents a significant discontinuity or a clear peak in variation relative to neighbors. Recognizing it doesn't imply an avalanche of mandatory splits/lumps.
      *   **⚖️ PROCEED (Judgment Call):** It's unclear, or recognition might imply recognizing many similar units. *Science can describe the variation pattern, but significance is a values call.* **Hand off to Committee:** Is the level of distinction *sufficiently unique* within this taxon to warrant formal recognition *despite* potential proliferation concerns? Consider biological context and precedent.
      *   **Proceed to Step 5 (if YES or ⚖️ resolved as YES).**

  ### Step 5: The Management Utility Test
  *   **Question:** Would recognizing this distinct group *significantly improve the efficacy* of specific, existing, or anticipated management or conservation actions compared to the current classification? (e.g., preventing over-exploitation of a vulnerable subpopulation, protecting critical unique habitat, ensuring successful reintroductions, setting appropriate harvest quotas).
      *   **Good Enough Answer:** YES, clear link between the group's distinct traits/predictability and a tangible management outcome. Utility outweighs added complexity.
      *   **🛑 STOP (No Management Case):** NO, recognition provides no clear management advantage, or advantages are purely academic. *Lacks mandate justification.*
      *   **⚖️ PROCEED (Significance Judgment):** YES, but the *degree* of improvement or cost/benefit is debatable. *Science confirms difference, but its importance for action is a values call.* **Hand off to Committee:** Given the confirmed differences (Steps 1-4), is the *management benefit* of recognition high enough to justify the change? Consider legal mandates, resources, stakeholder impacts.

  ### Step 6: Recommendation
  *   Based on the flow:
      *   Reached 🛑 STOP: **Recommend REJECTING** the proposed change.
      *   Passed all Steps/⚖️ resolved affirmatively: **Recommend ACCEPTING** the proposed change.
      *   ⚖️ unresolved: **Committee Vote** required on the specific values question identified.

  ---

  ## Running the Procedure: Three Cases

  **Case 1: Split Widespread Bird (East vs. West based on Genetics + Song)**
  1.  **Predictive Power?** *Unlikely.* Small genetic diff + song difference. Can we predict diet, nesting success, disease susceptibility, migratory path, or response to habitat loss in East vs. West *better* than knowing it's the original species? *Probably not.* No evidence provided. **🛑 STOP (No Justification).** *Recommend REJECT split.* (Philosophy Work: Highlights that difference ≠ predictive power. Prevents taxonomic inflation based on single characters).

  **Case 2: Recognize Fish Management Unit (Isolated, Temp-Adapted, Compatible)**
  1.  **Predictive Power?** *YES.* Assigning a fish to this watershed group predicts its optimal temperature range, spawning timing linked to local flow, and potentially growth rate/max size *better* than assigning it to the broader downstream group. Relevant for habitat protection, dam operations, stocking.
  2.  **Coherent Cluster?** *YES.* Genetics (isolation-by-distance), physiology (temp tolerance), life-history (spawning timing) likely correlate and are stable for that watershed.
  3.  **Mechanism?** *YES.* Local adaptation via natural selection driven by consistent temperature regime, reinforced by isolation (geographic/hydrological barriers implied).
  4.  **Independence?** *Likely YES.* Watersheds are natural, often discrete units. Recognizing this one doesn't *force* recognizing every tiny tributary, especially if adaptation evidence is strong here. (If watersheds are very small/fragmented, might ⚖️; assume not).
  5.  **Management Utility?** *⚖️ YES, but Significance Judgment.* Protecting cold water refuges is crucial *specifically for this unit*. Stocking downstream fish would fail here. Recognition enables targeted actions. **Committee:** Does this specific need justify a formal MU designation? *Likely YES.* *Recommend ACCEPT MU recognition.* (Philosophy Work: Mechanism + Predictive Utility for management anchors it as a "real" unit for conservation, even without full species status. Focuses on what matters practically).

  **Case 3: Keep Traditional "Grab-Bag" Species (Polyphyletic, Superficially Similar)**
  1.  **Predictive Power?** *NO (Crucially).* Assigning an organism to this traditional "species" tells you little reliably *beyond the superficial morphology used to define it*. You *cannot* reliably predict genetics, ecology, physiology, or vulnerability of one population based on another within the "species". **🛑 STOP (No Justification).** *Recommend REJECTING the current classification (i.e., lump or reclassify).*

  **Why you won't like this (and where it misfires):** The procedure forces you to abandon tradition when it lacks predictive power. This might destabilize listings, names, and regulations tied to the old category. It prioritizes scientific utility over stability or convenience.

  *   **Where it misfires:** If *superficial similarity* (e.g., cryptic morphology) *is* actually the trait management needs to predict (e.g., for pest control ID), Step 1 might pass, justifying the group pragmatically despite non-monophyly. The procedure relies on identifying *biologically significant* traits. If morphology is all that matters *for the management goal*, it could pass Step 1 based on that alone.
  *   **What it can't settle:** The *rank* (species, subspecies, MU). It only justifies *recognition as a distinct unit*. Philosophy clarifies *that* a group is real/natural, not precisely *what level* it belongs at – that involves convention and purpose.
  *   **Is Natural Kinds doing work?** **YES.** It ruthlessly exposes when a category is merely a "convenient filing system" (the grab-bag) versus one tracking causally grounded clusters that support inference (the fish MU). It prevents clinging to tradition without predictive utility. The "hunch" that the grab-bag isn't right is validated by the failure of the predictive power test.

  **Conclusion:** This procedure forces explicit evaluation of *why* a grouping matters biologically and for management, using core ideas from natural kinds (prediction, mechanism, cluster stability) as practical filters. It stops indefensible splits/lumps based on single characters or tradition without utility, highlights where science ends and values-based judgment begins (⚖️), and provides a defensible rationale for courts focused on scientific justification and management relevance. It won't eliminate debate, but it structures it rigorously.
