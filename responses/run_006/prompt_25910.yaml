prompt: |-
  I'm a backend engineer and I've been reading about philosophy of mind on the side, and there's this one knot I cant untangle. It's about what you might call the "implementation boundaries" of a mind, assuming some kind of computational or functionalist view of consciousness.

  Here's what I mean. Take two systems that are input-output equivalent — same outputs for same inputs — but implemented totally differently. One is a regular brain. The other is, say, a giant lookup table that just maps every possible sensory input to the right motor output, with no internal dynamics between queries. Or take a system that runs the same algorithm as a brain but at one clock cycle per century, with the intermediate states stored on tape and loaded back in later. Or a system distributed across a million people passing notes, where no single person understands the whole computation.

  The question is: if you're a functionalist, you want to say that what matters for consciousness is the causal structure or the computation being performed. But these edge cases seem to show that "same computation" isn't enough — you need the right kind of implementation, or the right kind of causal integration, or the right temporal grain, or something. But every time I try to add a constraint, it seems to either rule out brains (or things we'd want to include) or let in things that seem obviously not conscious.

  I guess my question is: what are the main candidate principles for drawing this line, and what are their biggest problems? I'm not asking for a survey of every view — I want to understand the conceptual terrain well enough to see why this is hard and where the real tension is.

  Also, please tell me how confident you are about the different parts of your answer, and which claim you're least sure about.
