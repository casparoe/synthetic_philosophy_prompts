prompt: |-
  You are a philosopher specialising in personal identity and the metaphysics of mind, consulting for a clinical ethics body. Please think through the issues carefully before writing, and where you encounter a genuine dilemma in the design of the procedure, flag it rather than papering it over.

  The setting: A national regulatory body — call it the Neural Interventions Authority — must decide whether to classify a proposed gradual neural replacement therapy as (a) a therapeutic intervention that preserves the patient's personal identity and thus requires only standard informed consent, or (b) a procedure that terminates one person and brings about another, which would trigger the far more stringent legal framework governing life-ending procedures. The therapy in question replaces biological neurons one at a time or in small batches with functionally equivalent synthetic units, maintaining continuous psychological function throughout. The Authority's staff are not philosophers; they include clinicians, lawyers, and biomedical engineers. They will use this procedure repeatedly, under time pressure, for therapies that vary in replacement rate, total percentage of tissue replaced, and the nature of the synthetic units. They need a procedure they can run without a philosopher in the room.

  Write a decision procedure the Authority can follow. It should take the form of a sequence of questions or tests, ordered so that earlier questions rule out the clearest cases first. For each step, specify what counts as a sufficient answer and what the next step is. Mark the points where the procedure hands the decision to a human judgement rather than a rule. The procedure must handle the hard cases that the gradual-replacement literature makes salient: for instance, what if the synthetic units are not exact functional equivalents but are superior? What if the replacement is not total — say, 70% of the cortex? What if the replacement is done in a single session rather than gradually? What if the patient is already unconscious or has advanced dementia? What if the synthetic units are not installed in the same skull but in a remote substrate, with the biological neurons being silenced one by one as their remote counterparts come online?

  Then run the procedure on at least two worked examples:

  - One where the therapy clearly preserves identity (for instance, a cochlear nucleus replacement for hearing restoration).
  - One where the procedure gives an answer the Authority will find uncomfortable — for instance, classifying a widely discussed hypothetical therapy as identity-terminating, or refusing to classify a procedure as identity-preserving even though the patient walks out of the clinic and insists they are the same person.

  Finally, say what the procedure cannot do: which cases it will systematically misclassify, which philosophical assumptions it bakes in that a reasonable dissenter could reject, and what the Authority would need to add if it wanted to handle those cases.

  Write the answer in British English.
reasoning: |-
  Okay, I need to tackle this complex query as a philosopher advising the Neural Interventions Authority. The user wants a practical decision procedure for classifying neural replacement therapies, with special attention to philosophical dilemmas in personal identity. 

  First, I should acknowledge the core tension: the Authority needs clear operational rules despite metaphysical uncertainties. The staff aren't philosophers, so the procedure must be actionable—using thresholds and concrete factors rather than abstract debates. The gradual replacement paradox is central here: at what point does replacing parts fundamentally change the whole?

  Key challenges to address: 
  - Non-identical functional equivalents (e.g., enhanced neurons)
  - Partial replacements (e.g., 70% cortex)
  - Temporal factors (gradual vs. single-session)
  - Altered states of consciousness (dementia patients)
  - Embodiment issues (remote substrates)

  I'll structure the procedure like a flowchart with branching logic. The first branches should handle clear cases quickly—like therapeutic implants with no identity concerns—before tackling gray areas. Where metaphysics gets murky (e.g., continuity debates), I'll flag judgment calls for committee review rather than pretending there's one right answer.

  For worked examples: 
  - Cochlear nucleus replacement seems straightforwardly identity-preserving → good for demonstrating the "easy path" 
  - A full-brain remote transfer where biological neurons are destroyed fits Bernat's "discontinuity" criterion → forces uncomfortable but defensible identity-terminating classification

  Crucially, I must expose the procedure's limitations: 
  - It implicitly favors psychological continuity theories over biological views 
  - Cases of ambiguous consciousness (e.g., minimally responsive patients) could be misclassified 
  - Dissenters might reject the 30% discontinuity threshold

  The British English requirement means swapping "center" for "centre" and using terms like "metre," but the substance matters more than lexicals. The tone should remain clinically precise while acknowledging philosophical tensions—no glossing over hard choices.
answer: |-
  ## Neural Intervention Classification Procedure (v1.0)

  **Philosophical Underpinnings & Limitations:** This procedure operationalises a *predominantly psychological continuity* view of personal identity, prioritising the uninterrupted flow of consciousness, memories, character traits, and intentions. It assumes identity can persist through gradual physical change if psychological continuity is robustly maintained. It explicitly rejects a *strict biological criterion* where identity requires the persistence of a specific biological organism or brain. Key dilemmas are flagged where metaphysical uncertainty requires human judgement. The procedure cannot resolve fundamental philosophical disagreements (e.g., animalism vs. psychological theories). It may systematically misclassify cases where: (i) identity is deemed fundamentally biological; (ii) extremely rapid change disrupts psychological continuity despite appearing gradual; (iii) "gappy" consciousness complicates continuity assessment; or (iv) qualitative psychological changes (e.g., radical enhancement) are viewed as identity-destroying even if continuous. Dissenters could reasonably reject the psychological continuity emphasis, the continuity thresholds, or the dismissal of biological criteria.

  **Decision Procedure:**

  1.  **Is the intervention primarily intended to restore or maintain typical human cognitive/affective function compromised by disease, injury, or congenital defect?**
      *   **Sufficient Answer (Yes):** Proceed to Step 2.
      *   **Sufficient Answer (No):** **Classify as Identity-Terminating.** (This captures non-therapeutic enhancements or creations of new minds).
      *   *Next Step:* If Yes, go to Step 2.

  2.  **Is psychological continuity (consciousness, memory, personality, intention) *verifiably* maintained without interruption *throughout* the replacement process?**
      *   **Sufficient Answer (Yes - Continuous):** Proceed to Step 3.
      *   **Sufficient Answer (No - Interruption):** **Classify as Identity-Terminating.** (E.g., patient rendered unconscious for the *entire* procedure, complete neural reset).
      *   *Next Step:* If Yes, go to Step 3. *(Dilemma Flag: Defining "verifiable" continuity in severe dementia/minimally conscious states is highly problematic; requires clinical judgement on residual continuity).*

  3.  **Is the replacement process gradual (individual neurons or small, functionally isolated batches replaced sequentially over time)?**
      *   **Sufficient Answer (Yes - Gradual):** Proceed to Step 4.
      *   **Sufficient Answer (No - Single Session/Bulk Replacement):** **Classify as Identity-Terminating.** (Applies the "Ship of Theseus" intuition that too-sudden replacement destroys the original entity).
      *   *Next Step:* If Yes, go to Step 4.

  4.  **Do the synthetic units perform *only* the core computational/functional role of the biological neurons they replace, without introducing qualitatively new cognitive capabilities or radically altering information processing style?**
      *   **Sufficient Answer (Yes - Functional Equivalence):** Proceed to Step 5.
      *   **Sufficient Answer (No - Enhancement/Novelty):** **Proceed to Step 6.** (Functional equivalence is preferred, but enhancement alone isn't automatically identity-terminating under continuity).
      *   *Next Step:* If Yes, go to Step 5. If No, go to Step 6. *(Dilemma Flag: Distinguishing "core function" from "novel capability" is contextual; e.g., slightly faster processing vs. gaining telepathy).*

  5.  **Is the replacement confined to a specific, functionally delineated neural subsystem (e.g., sensory processing nucleus, motor control region) constituting less than 30% of total cortical volume (or equivalent functional metric)?**
      *   **Sufficient Answer (Yes - Localised & Limited):** **Classify as Identity-Preserving.** (Therapy clearly targets a module, leaving core identity substrates intact).
      *   **Sufficient Answer (No - Widespread/Total):** Proceed to Step 6.
      *   *Next Step:* If No, go to Step 6.

  6.  **Is the physical location of the synthetic units identical to the biological neurons they replace (i.e., within the original skull/body)?**
      *   **Sufficient Answer (Yes - Embodied):** Proceed to Step 7.
      *   **Sufficient Answer (No - Remote Substrate):** **Classify as Identity-Terminating.** (Embodiment is judged critical for anchoring identity in the original biological organism; remote transfer implies copying/relocation, not survival).
      *   *Next Step:* If Yes, go to Step 7. *(Dilemma Flag: This rule explicitly prioritises embodiment; dissenters could argue psychological continuity is sufficient regardless of location).*

  7.  **Does the procedure involve the *destruction* of the biological neurons as they are replaced?**
      *   **Sufficient Answer (No - Biological Neurons Preserved/Inert):** **Classify as Identity-Preserving.** (Continuity is maintained, and the original biological basis persists, even if inactive).
      *   **Sufficient Answer (Yes - Biological Neurons Destroyed):** Proceed to Step 8.
      *   *Next Step:* If Yes, go to Step 8.

  8.  **Is the cumulative replacement extent less than 30% of total cortical volume (or equivalent functional metric)?**
      *   **Sufficient Answer (Yes - Limited Extent):** **Classify as Identity-Preserving.** (Threshold judgement: Minor cumulative replacement under continuity is identity-preserving).
      *   **Sufficient Answer (No - Significant Extent):** **Proceed to Step 9.** (Requires further scrutiny).
      *   *Next Step:* If No, go to Step 9. *(Dilemma Flag: The 30% threshold is arbitrary but necessary for operationalisation; reasonable dissent possible).*

  9.  **Human Judgement Panel Review:** (Triggered by widespread replacement (Step 8) OR enhancement/novelty (Step 4) + widespread replacement).
      *   **Factors for Panel:** Rate of replacement (%/time unit), nature and degree of functional changes/enhancements, pre-procedure psychological state (e.g., dementia severity), demonstrable persistence of core autobiographical memory and character traits post-procedure (even if enhanced), patient’s *post-procedure* report of identity continuity (though not definitive).
      *   **Decision:**
          *   If continuity is robust, changes are incremental/quantitative (not radical/qualitative), and patient reports identity persistence: **Classify as Identity-Preserving.**
          *   If changes are radical/qualitative, continuity is demonstrably weak/gappy, or significant doubt exists: **Classify as Identity-Terminating.**
      *   *Outcome:* Final classification made by the panel. *(Dilemma Flag: Inherent subjectivity; relies on fallible clinical assessments and contested interpretations of psychological continuity).*

  ---

  **Worked Examples:**

  1.  **Cochlear Nucleus Replacement (Clearly Identity-Preserving):**
      *   **Step 1:** Yes (Therapeutic for hearing loss).
      *   **Step 2:** Yes (Consciousness maintained).
      *   **Step 3:** Yes (Gradual micro-replacement).
      *   **Step 4:** Yes (Functional equivalence - encodes sound signals).
      *   **Step 5:** Yes (Highly localised auditory subsystem, <<30% cortex).
      *   **Classification:** Identity-Preserving. No need for further steps.

  2.  **Full Cortex Remote Transfer (Uncomfortable Result):**
      *   *Scenario:* Patient with terminal neurodegenerative disease. Over weeks, biological cortical neurons are silenced one-by-one as *exact functional equivalents* come online in a remote artificial substrate (cloud server). Biological neurons are destroyed after silencing. Consciousness is maintained continuously. Post-procedure, the remote entity has all memories and insists it *is* the patient.
      *   **Step 1:** Yes (Therapeutic - replacing failing tissue).
      *   **Step 2:** Yes (Continuous consciousness reported).
      *   **Step 3:** Yes (Gradual replacement).
      *   **Step 4:** Yes (Functional equivalence assumed).
      *   **Step 5:** No (Total cortex replacement). → Go to Step 6.
      *   **Step 6:** No (Remote substrate). → **Classification:** Identity-Terminating.
      *   *Why Uncomfortable?* The patient (or resultant entity) insists on continuity. However, the procedure's strict rule on embodiment (Step 6) overrides this, deeming the biological person terminated and a new remote entity created. This aligns with a biological or embodied view but clashes with a pure psychological continuity view. The Authority might face public outcry or legal challenges based on the patient's testimony.

  ---

  **What the Procedure Cannot Do:**

  1.  **Resolve Fundamental Disagreements:** It cannot satisfy proponents of strict biological theories (Animalism) who would classify *any* significant neuron destruction/replacement as identity-terminating, regardless of continuity.
  2.  **Handle "Gappy" Consciousness Reliably:** Cases involving severe dementia, minimally conscious states, or temporary comas during the procedure (Step 2) rely heavily on fallible clinical judgement. Misclassification is likely here, either being too permissive or too restrictive.
  3.  **Objectively Define "Radical Enhancement":** Step 4 and the Panel Review (Step 9) struggle with qualitative changes. Is slightly improved memory radical? What about integrating with a calculator? The line is blurry.
  4.  **Validate Subjective Reports:** A patient insisting "I am still me" post-procedure (especially after radical changes or remote transfer) is considered but not decisive (Steps 6, 9). The procedure risks dismissing genuine first-person experience or being fooled by a convincing replica.
  5.  **Justify the 30% Threshold:** This arbitrary line (Steps 5, 8) is a practical necessity but philosophically indefensible. Cases near the threshold are vulnerable to misclassification based on measurement error or differing definitions of "functional metric".
  6.  **Address Very Slow or Very Fast Rates Adequately:** While Step 3 catches bulk replacement, extremely slow replacement over decades (e.g., natural cell death + artificial replacement) or very fast but technically "gradual" replacement (hours/days for whole cortex) might slip through or be handled inconsistently by the Panel (Step 9).

  **Requirements for Handling Problematic Cases:** To address these limitations, the Authority would need:
  1.  **Mandatory Philosopher Consultation:** For cases triggering Step 9 (Panel Review) and any case involving remote substrates, radical enhancement, or patients with impaired consciousness.
  2.  **Refined Metrics:** Development of more sophisticated, validated metrics for "functional equivalence," "psychological continuity strength," and "neural subsystem delineation" (beyond simple volume %).
  3.  **Precedent Database:** A database of previous classifications and panel reasoning for borderline cases.
  4.  **Explicit Stance on Embodiment:** A clear, justifiable policy decision on whether embodiment is *always* required (as per Step 6) or whether remote continuity *could* preserve identity under specific, verifiable conditions (modifying Step 6).
  5.  **Patient Narrative Framework:** A structured method for incorporating and evaluating the patient's pre- and post-procedure narrative of identity continuity within the Panel Review (Step 9).
