prompt: |-
  I am a philosophy professor presenting a paper at a law-school jurisprudence workshop next month. The paper uses the game Nomic as its central example and defends the following thesis: the puzzles of self-amendment in Nomic arise not from the self-referential content of any single rule but from conflating a rule's status at the time an amendment is performed with its status after the amendment takes effect; once these are indexed apart, self-amendment is no more paradoxical than ordinary amendment. The paper's more controversial claim is that the hierarchy of legal rules is not a fixed architecture of rule-types but a shifting status relation, so that a rule functions as a rule of change because of the position it occupies relative to an act, a position that can be altered by the very act it governs. The argument moves through four steps: an act of amendment is valid or invalid under the rule in force before the act; in self-amendment the rule changed is the same rule under which the act is performed; the appearance of circularity arises only if the act is evaluated under the rule as amended; and the residual problem is to give identity and persistence conditions for a rule across change, which the paper grounds in the rule's office within the system rather than its wording.

  The audience is a law-school workshop: mostly legal philosophers working in jurisprudence and constitutional theory, two logicians who work on self-reference and non-well-founded structures, and one formal epistemologist. The legal philosophers will reach for Hart and Kelsen and for constitutional amendment practice; the logicians will expect a formal treatment; the epistemologist will worry about bootstrapping. They have not played Nomic and will not be moved by game mechanics unless the mechanics are shown to track a real legal phenomenon.

  Prepare my Q&A prep sheet. I want the objections this audience will actually raise, not the objections I would get from people who know the Nomic literature. Order them by expected likelihood times damage, phrase each as a member of this audience would put it in their own vocabulary, and give each a two-minute reply and a note on where the reply is soft. Include the question I am hoping nobody asks, and identify the single reply that must land for the paper to survive.

  Return the prep sheet as a single JSON object with the following schema:

  {
    "thesis_restated": string,
    "audience_profile": string,
    "objections": [
      {
        "rank": number,
        "objection": string,
        "raised_by": string,
        "likelihood": number,
        "damage": number,
        "concession": string,
        "reply": string,
        "soft_spot": string
      }
    ],
    "question_hoping_nobody_asks": {
      "question": string,
      "why_damaging": string
    },
    "reply_that_must_land": {
      "reply": string,
      "why": string
    }
  }

  Aim for eight objections. For each, likelihood and damage should be integers from 1 to 10, rank should order them from first to address to last, the objection should be phrased as the audience member would say it, concession should state what I should grant immediately, reply should be a two-minute response, and soft_spot should say where the reply is weakest or what the audience member will press next. Do not include a bibliography, reading list, or citations.
