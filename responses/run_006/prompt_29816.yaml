  ### Analyzing Your Lottery Choices with Dave

  I'll break this down step by step to clarify the argument between you and Dave, explain the key concepts (like the independence axiom and money-pumping), and address who is right about what. Your choices were:
  - **First decision**: You chose A ($900 guaranteed) over B (89% chance of $900, 10% chance of $5000, 1% chance of nothing).
  - **Second decision**: You chose D (10% chance of $5000) over C (11% chance of $900).

  Dave claims this is inconsistent based on expected utility theory and the independence axiom. You argue that the certainty of A makes it feel different from the gamble in B, and in the second choice, neither option is certain, so you prefer the higher payoff despite the slightly lower probability. Let's dive into the logic.

  ### 1. **Dave's Argument: The Independence Axiom and "Carving Out" the Common Part**
  Dave says your preferences violate the independence axiom, a core principle of expected utility theory. This axiom states that if you prefer one lottery (e.g., A) over another (e.g., B), you should also prefer any "mixture" of those lotteries with a common third option. Here's how it applies to your choices:

  - **First choice (A vs. B)**:
    - A is a sure thing: 100% chance of $900.
    - B can be seen as a mixture: with 89% probability, you get $900 (same as A), and with 11% probability, you get a "sub-lottery" with a 10/11 chance of $5000 and a 1/11 chance of nothing (we'll call this sub-lottery "L" for simplicity). So, B = 89% of A + 11% of L.

  - **Second choice (C vs. D)**:
    - C: 11% chance of $900 (which is equivalent to 11% of the "A outcome" and 89% of nothing).
    - D: 10% chance of $5000 (which is equivalent to 10% of the "$5000 outcome" and 90% of nothing).
    - Dave argues that C and D are derived by "carving out" the 89% common part from A and B:
      - If you remove the 89% chance of $900 from A, you're left with the 11% chance of $900, which is C.
      - If you remove the 89% chance of $900 from B, you're left with the remaining 11% portion, which consists of a 10% chance of $5000 and a 1% chance of nothing—this is exactly D (since D has a 10% chance of $5000 and a 90% chance of nothing, but the 90% includes the "carved out" 89% nothing plus the 1% nothing from B).

  Dave's point is that the only difference between A and B is what happens in that 11% "non-common" portion:
  - In A, that 11% gives $900 for sure (like C, but C is scaled to a full lottery).
  - In B, that 11% gives the risky L (like D, but D is a scaled version of L).

  Since you prefer A over B, Dave says you should also prefer the "safe" option in the non-common portion (i.e., C) over the risky one (D). But you did the opposite by choosing D over C, which he calls inconsistent.

  **Why Dave thinks this violates expected utility**: Expected utility theory assumes that your preferences can be represented by a consistent utility function (e.g., where you assign a fixed "utility" value to each outcome, like u($900), u($5000), and u($0)). If your choices violate the independence axiom, as yours do, it means no such utility function can describe your behavior—your preferences depend on how options are framed, not just the outcomes and probabilities.

  ### 2. **Your Defense: Why Your Choices Make Sense to You**
  You explained that:
  - In the first choice, the certainty of $900 feels different from a gamble, even if B has a high chance of the same $900. This is the "certainty effect" from behavioral economics, where people overvalue guaranteed outcomes compared to probabilistic ones.
  - In the second choice, neither option is certain, and the probabilities are similar (11% vs. 10%), so you prefer the riskier option with a much higher payoff ($5000 vs. $900). This is like risk-seeking behavior for small probabilities, especially when all outcomes are gains relative to nothing.

  This is a common human pattern and can be explained by prospect theory (developed by Daniel Kahneman and Amos Tversky). Prospect theory says:
  - People evaluate outcomes relative to a reference point (here, probably $0).
  - Losses loom larger than gains (loss aversion), so in the first choice, the 1% chance of nothing in B feels like a potential loss compared to the sure $900.
  - Probabilities are weighted non-linearly: small probabilities (like the 10% chance of $5000) are often overweighted, making them more attractive, while high probabilities (like 89%) are underweighted.
  - The certainty effect makes guaranteed outcomes (like A) especially appealing.

  So, your choices aren't "ridiculous"—they reflect how real people make decisions under risk. Expected utility theory is a normative model (how people "should" decide), but prospect theory is descriptive (how people actually decide).

  ### 3. **Who's Logically Cornered? Dave's Point About Inconsistency**
  Dave is technically correct that your preferences violate the independence axiom, making them inconsistent with expected utility theory. Here's a quick proof using expected utility (simplifying by assuming u($0) = 0 for clarity):

  - From your first choice (A > B):
    - EU(A) = u(900)
    - EU(B) = 0.89u(900) + 0.10u(5000) + 0.01u(0) = 0.89u(900) + 0.10u(5000)  (since u(0) = 0)
    - Since you prefer A: u(900) > 0.89u(900) + 0.10u(5000)
    - Rearranged: 0.11u(900) > 0.10u(5000)  →  u(900) > (10/11)u(5000)

  - From your second choice (D > C):
    - EU(C) = 0.11u(900) + 0.89u(0) = 0.11u(900)
    - EU(D) = 0.10u(5000) + 0.90u(0) = 0.10u(5000)
    - Since you prefer D: 0.10u(5000) > 0.11u(900)  →  u(5000) > (11/10)u(900)

  But from the first inequality, u(900) > (10/11)u(5000), which implies u(5000) < (11/10)u(900). This directly contradicts the second inequality (u(5000) > (11/10)u(900)). So, under expected utility, your preferences are indeed inconsistent—no utility function can satisfy both choices.

  ### 4. **Money-Pumping: What Dave Means and Why It Matters**
  Dave warned you could be "money-pumped." This is a thought experiment where someone with inconsistent preferences can be exploited into losing money through a series of trades. Here's how it might work for you:

  - **Step 1**: You start with lottery B (which you like less than A). Since you prefer A to B, you might pay a small fee (e.g., $1) to switch from B to A.
  - **Step 2**: Now you hold A. But consider the "non-common" portion (the 11% part where A and B differ): in isolation, you prefer the risky option (like D) over the safe one (like C). So, if offered, you might pay another fee (e.g., $1) to modify A so that in the 11% non-common case, you get the risky L instead of the safe $900. This turns A into B.
  - **Step 3**: You now have B again, but you paid to switch away from it earlier. You might then pay to switch back to A, and the cycle repeats.

  Each switch costs you money, and since your preferences flip based on framing (certain vs. risky), you could end up paying repeatedly without changing your final outcome. Money-pumping shows why inconsistency can be costly in repeated decisions.

  ### 5. **Who's Right? A Summary**
  - **Dave is right about the inconsistency under expected utility theory**: Your choices violate the independence axiom, meaning they can't be explained by a consistent utility function. He's also correct that this could make you vulnerable to money-pumping in theory (though in a one-time bar bet, it's not a practical concern).
    
  - **You're right that your choices are defensible and common**: Your preferences aren't irrational—they align with how humans actually behave, as shown in prospect theory. The certainty of A makes it psychologically different from B, and in the second choice, the near-identical probabilities make the higher payoff more attractive. If you reject the independence axiom as a description of human behavior (as many behavioral economists do), then it's not a "problem" for you—it's just how people are.

