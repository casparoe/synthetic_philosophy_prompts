  Dave has you cornered on pure logic—your preferences are inconsistent with the standard economic model of rationality. But that model doesn't fully capture human psychology. Your choices are reasonable in context, and people make similar decisions all the time (e.g., buying insurance for certainty while also buying lottery tickets for small chances of big gains).

