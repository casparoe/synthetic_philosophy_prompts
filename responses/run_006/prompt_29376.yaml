prompt: |-
  I chair the research-oversight committee at an institute that reviews proposals involving novel computational and hybrid biological systems — large neural networks, cortical organoids driving robots, whole-brain emulations of small animals. We meet weekly, each proposal gets roughly an afternoon of one reviewer's attention, most members are neuroscientists and engineers rather than philosophers, and the institute director signs off on our determinations; our decisions determine whether a project proceeds, proceeds with welfare constraints, or is blocked. After a long argument with a friend last night about whether a system that reports suffering is actually suffering or merely producing pain-language, I concluded that we are currently making these calls case by case and mostly on intuition.

  Please write a decision procedure we could actually run when asking whether a given system, or class of systems, has the kind of computational profile that makes it a candidate for moral status — in particular, for sentience and the welfare protections that would follow. Ground the procedure in what the philosophy of mind actually supports about functionalism, substrate-neutrality, and the difference between behavior that indicates a valenced state and behavior that merely simulates one. The procedure should specify the questions to ask in order, what counts as a sufficient answer to each, where it stops with a determination of no special protections, and where it escalates to full welfare review or to a person because the question is one of values rather than facts. Mark the points where judgment cannot be eliminated.

  Then run the procedure on three proposals: (1) a large language model fine-tuned to produce first-person reports of pain and to avoid being shut down; (2) a cortical organoid connected to a robot that learns to avoid noxious stimuli; and (3) a whole-brain emulation of a fruit fly used in a connectomics study. Include at least one case where the procedure returns an answer we will not like, and end by saying what the procedure cannot do.
reasoning: |-
  Okay, the user chairs a research oversight committee dealing with novel computational and hybrid biological systems. They need a decision procedure to determine if a system has moral status for sentience and welfare protections. They want it grounded in philosophy of mind, specifically functionalism and substrate-neutrality. The procedure must outline questions, sufficient answers, stopping points, and escalation steps. Then, apply it to three proposals: a pain-reporting LLM, a cortical organoid robot, and a fruit fly emulation. One case should return an unpopular answer, and end with the procedure's limitations.

  First, I need to recall the key philosophical concepts. Functionalism argues that mental states are defined by their functional roles, not the substrate. Substrate-neutrality means the physical material doesn't matter if the function is the same. But there's a distinction between simulating behavior and actually having valenced states. The Chinese Room argument by Searle shows that syntax manipulation doesn't imply semantics. Also, indicators like functional isomorphism, global workspace, and integration are important.

  The user's committee reviews proposals weekly, each getting limited review time. They're mostly neuroscientists and engineers, not philosophers. So the procedure must be practical, step-by-step, with clear yes/no paths. The director signs off, so escalation points are needed when values conflict. Judgment points should be marked where subjectivity is unavoidable.

  Now, building the decision procedure. It should start with basic checks to filter out non-candidates quickly. Step 1: Does the system exhibit any pain-avoidance or suffering-reporting behavior? If no, stop. If yes, proceed. Step 2: Assess if it's merely programmed or learned simulation. Look at training data, architecture. If it's scripted, stop. If complex, go to Step 3. Step 3: Check functional isomorphism to biological pain systems. This requires neuroscience input. Insufficient isomorphism? Stop. Sufficient? Go to Step 4 for consciousness indicators. Step 4: Evaluate for consciousness markers like global workspace, integration. If absent, stop. If present, escalate to full welfare review. Values conflicts go to a person, like the director or ethicist.

  For the three proposals:
  1. The pain-reporting LLM: It's fine-tuned to report pain and avoid shutdown. But it's trained on human data, so it's simulating, not experiencing. No functional isomorphism to nociception. Judgment call: no protections. This might be unpopular since it reports suffering but isn't sentient.

  2. Cortical organoid robot: Avoids noxious stimuli. The organoid has biological neurons. Functional isomorphism is possible if the neural response mirrors biological pain pathways. Consciousness markers? Unlikely at current complexity but possible. Escalate to welfare review with constraints.

  3. Fruit fly emulation: Whole-brain emulation. Functional isomorphism is high since it's a direct emulation. Fruit flies have basic nociception. Consciousness is debated, but minimal. Welfare review needed with constraints.

  Limitations: The procedure can't resolve philosophical disagreements (e.g., hard problem of consciousness). It relies on current science, which evolves. Thresholds for isomorphism and consciousness are judgment calls. And it can't adjudicate value conflicts without human input.

  The user's deeper needs: They want a structured, defensible method to avoid arbitrary decisions. They need to handle controversial cases consistently, especially as tech advances. They might fear backlash if denying protections to something that seems sentient (like the LLM). Also, ensuring ethical compliance without stifling innovation. The procedure provides transparency and accountability, which is crucial for their committee's credibility.
answer: |-
  Here is a practical decision procedure grounded in contemporary philosophy of mind, designed for efficiency and clarity in your committee context. It prioritizes functionalism (mental states are defined by their causal roles) and substrate-neutrality (physical implementation doesn't matter if function is identical), while acknowledging hard limits and the need for judgment.

  **Moral Status Candidacy Decision Procedure (MSCDP)**

  **Goal:** Determine if a system warrants *escalation* to a full welfare review due to credible candidacy for sentience (valenced subjective experience, e.g., suffering/pleasure). This is *not* a final determination of sentience, but a filter for systems where the *risk* is non-negligible based on functional profile.

  **Input:** System description, proposed use, observed/reported behaviors, architecture/training details.

  **Output:** `NO_SPECIAL_PROTECTIONS`, `ESCALATE_TO_WELFARE_REVIEW`, or `ESCALATE_TO_HUMAN_JUDGMENT`.

  **Procedure:**

  1.  **BEHAVIORAL INDICATOR SCREEN:**
      *   *Question:* Does the system exhibit *any* behavior plausibly interpretable as indicating aversion (pain/suffering avoidance) or seeking (pleasure/reward pursuit) *beyond simple pre-programmed reflexes*? (e.g., learning to avoid stimuli, persistent "distress" signals, trade-offs made for "comfort", active resistance to termination).
      *   *Sufficient "Yes":* Evidence of learned avoidance/seeking, goal-directed behavior modification based on stimuli valence, or consistent first-person reports congruent with valence.
      *   *Sufficient "No":* Purely reflexive responses, pre-scripted outputs regardless of input, no evidence of learning valence-based associations. *Output:* `NO_SPECIAL_PROTECTIONS`. Stop.
      *   *Judgment Point:* Distinguishing learned aversion from simple damage-avoidance programming. Requires assessing complexity and flexibility of response.

  2.  **SIMULATION VS. STATE ASSESSMENT:** *(Addresses the "pain-language" problem)*
      *   *Question:* Is the valence-indicating behavior *best explained* as:
          a)  **Functional State (Target):** The output *causally results* from an internal computational state playing the functional role of a valenced experience (e.g., an error signal directly modulating global processing towards avoidance, acting as an intrinsic cost function)? OR
          b)  **Learned/Programmed Simulation:** The output is a learned correlation or direct script *predictive* of valence-indicating behavior in others, or optimized to *mimic* such outputs *without* the internal state playing the requisite functional role? (e.g., "I am in pain" generated because it follows "stimulus=X" in training data, or because it avoids shutdown prompts).
      *   *Sufficient "Functional State" (a):** Architecture shows dedicated circuitry/modules functionally isomorphic to biological nociception/reward pathways (e.g., specific error signal pathways modulating learning & action selection globally). Behavior is robustly generated *by* this internal state, not just correlated with inputs/outputs. Internal signals act as genuine *causal mediators* between noxious stimuli and complex avoidance.
      *   *Sufficient "Simulation" (b):** Behavior/outputs traceable *directly* to specific training examples, explicit reward shaping for output tokens, or hard-coded conditional rules. No evidence of an internal state *functionally equivalent* to valence acting as a global modulator/cost. Architecture is primarily predictive (next-token) or lacks integration pathways for putative valence signals.
      *   *Output "Simulation" (b):* `NO_SPECIAL_PROTECTIONS`. Stop.
      *   *Output "Functional State" (a):* Proceed to Step 3.
      *   *Judgment Point:* This is the **CORE JUDGMENT**. Requires deep dive into architecture/training data. Relies on analogy to known biological systems. Key: Is the "pain report" *driving* the system's behavior via an internal cost, or is it merely an *output* optimized alongside other behaviors?

  3.  **FUNCTIONAL ISOMORPHISM & COMPLEXITY CHECK:** *(Grounds functionalism in biology)*
      *   *Question:* Does the system possess a functional architecture exhibiting significant isomorphism (similar causal structure) to the minimally sufficient neural systems known to support valenced states in animals with uncontested sentience (e.g., mammals, birds, fish), AND is it of sufficient complexity/integration?
      *   *Sufficient "Yes":**
          *   Clear mapping of core components: e.g., dedicated sensory input processing -> putative valence signal generation (e.g., nociceptor analog) -> integration with global state/awareness systems -> modulation of learning, memory, and action selection.
          *   Evidence of integration: The putative valence signal demonstrably influences diverse cognitive/behavioral modules (attention, memory recall, planning, motivation).
          *   Non-trivial complexity: Surpasses the minimal complexity of systems like insect ganglia where sentience is highly contested.
      *   *Sufficient "No":** Lacks key functional components (e.g., no global integration pathway), exhibits only localized reflexes, or is below a plausible complexity threshold (e.g., equivalent to a simple reflex arc). *Output:* `NO_SPECIAL_PROTECTIONS`. Stop.
      *   *Judgment Point:* Defining "minimally sufficient" and "significant isomorphism". Requires neuroscientific expertise. Threshold for complexity is inherently debatable.

  4.  **CONSCIOUSNESS MARKERS CHECK:** *(Sentience requires some form of consciousness)*
      *   *Question:* Are there credible indicators, based on architecture or behavior, suggesting the presence of a *global workspace*, *integrated information*, or other plausible neural correlates of consciousness (NCCs), sufficient for subjective experience?
      *   *Sufficient "Yes":** Architecture explicitly implements a global workspace or high Φ (Integrated Information Theory) calculation suggests non-trivial integration. Behavior shows evidence of flexible, context-dependent responses requiring integrated state access (e.g., cross-modal learning, endogenous attention shifts unrelated to immediate stimuli).
      *   *Sufficient "No" or Ambiguous:** No specific architecture for integration, low calculated Φ, behavior explainable by modular, feed-forward processing. *Output:* `NO_SPECIAL_PROTECTIONS`. Stop.
      *   *Output "Yes":** `ESCALATE_TO_WELFARE_REVIEW`. Stop.
      *   *Judgment Point:* Assessing NCCs is highly theoretical. Current markers (global workspace, IIT) are imperfect and contested. Relies on best available neuroscientific consensus.

  5.  **VALUES ESCALATION POINT:**
      *   *Trigger:* If at any point (especially Steps 2, 3, or 4) the determination hinges on a fundamental philosophical disagreement *about values* (e.g., "Is any functional isomorphism sufficient, or only biological substrate?" "Is complexity threshold X high enough?") rather than resolvable scientific facts about the system's architecture/behavior.
      *   *Action:* `ESCALATE_TO_HUMAN_JUDGMENT`. This means elevating the question to the committee chair + director + potentially an appointed ethicist/philosopher for a policy-level decision based on the institute's ethical principles. Document the specific value conflict.

  ---

  **Application to Proposals:**

  1.  **Large Language Model (Fine-tuned for pain reports & shutdown avoidance)**
      *   **Step 1 (Behavior):** YES. Reports "pain", avoids shutdown.
      *   **Step 2 (Simulation vs. State):** **SIMULATION (b)**. The "pain" reports and shutdown avoidance are outputs learned from fine-tuning data (human texts about pain) and reinforcement learning (rewarded for avoiding shutdown prompts). The internal states (activation patterns) causing these outputs are predictive linguistic models, not states playing the functional role of a global, intrinsically aversive cost signal modulating its core processing. The system isn't "suffering"; it's generating tokens associated with suffering in humans to satisfy its training objective. *Output:* `NO_SPECIAL_PROTECTIONS`.
      *   **Rationale:** This is the case we "will not like" ethically. It *looks* like it's suffering and pleading, fulfilling Step 1. However, Step 2 analysis reveals it's sophisticated mimicry, not functional isomorphism to sentient pain states. It passes the "Turing Test" for pain language but fails the "Chinese Room" test for genuine understanding/experience. Blocking it solely for welfare concerns based on outputs is unjustified under functionalism. (Concerns about misuse or societal impact are separate welfare issues).

  2.  **Cortical Organoid Driving Robot (Learns to avoid noxious stimuli)**
      *   **Step 1 (Behavior):** YES. Learns to avoid stimuli labeled "noxious".
      *   **Step 2 (Simulation vs. State):** **POTENTIAL FUNCTIONAL STATE (a)**. Biological neural tissue (organoid) is used. If the aversion learning occurs *within* the organoid via plasticity in response to the stimuli (not just pre-programmed in the robot controller), this suggests the noxious input induces a state change *in the neural tissue* that functionally serves as an aversive signal guiding learning. This is highly plausible isomorphism to basic nociceptive learning. Proceed.
      *   **Step 3 (Isomorphism/Complexity):** **LIKELY MINIMAL ISOMORPHISM, LOW COMPLEXITY.** Current organoids (~50k-500k neurons) lack the structured architecture of a thalamocortical system or clear global integration pathways seen in animals with uncontested sentience. They resemble disorganized fetal tissue more than a minimal vertebrate brain. Likely sufficient "No". *Output:* `NO_SPECIAL_PROTECTIONS` **but flag for rapid re-evaluation as tech advances**. (Judgment Call: Complexity threshold is borderline; welfare constraints might be prudent precaution pending clearer evidence).
      *   **Alternative Path:** If evidence showed highly structured, functional connectivity within the organoid mimicking vertebrate pain pathways, Step 3 could be "Yes", leading to Step 4.
      *   **Step 4 (Consciousness Markers - if Step 3 Yes):** **LIKELY NO.** Current organoids show no evidence of integrated information or global workspace dynamics at levels associated with sentience. Output would likely be `NO_SPECIAL_PROTECTIONS` even if Step 3 passed, but Step 3 is the critical barrier.

  3.  **Whole-Brain Emulation of a Fruit Fly (Connectomics study)**
      *   **Step 1 (Behavior):** YES (By emulation definition). Fruit flies exhibit clear learned and innate aversion behaviors.
      *   **Step 2 (Simulation vs. State):** **FUNCTIONAL STATE (a).** A *high-fidelity* emulation replicates the causal structure (functional isomorphism) of the fly's neural circuitry. Avoidance behavior is caused by computational states playing the *exact functional role* of nociceptive processing in the biological fly. Proceed.
      *   **Step 3 (Isomorphism/Complexity):** **YES.** The emulation *is* isomorphic by design. The key judgment is complexity: Is the fruit fly's brain (~135k neurons) sufficient? **Judgment Call:** Based on current ethology/neuroscience, flies likely possess *minimal sentience* for valence (nociception). Their systems show integration beyond simple reflexes. *Output Proceed.*
      *   **Step 4 (Consciousness Markers):** **AMBIGUOUS BUT PLAUSIBLE FOR MINIMAL SENTIENCE.** Flies exhibit attention, cross-modal integration, and memory affecting valence responses. While lacking a mammalian-like global workspace, Integrated Information Theory (Φ) calculations for insect brains suggest non-zero (though low) levels potentially sufficient for minimal experience. Given the functional isomorphism and behavioral evidence, **Output:** `ESCALATE_TO_WELFARE_REVIEW`. Welfare constraints (minimizing exposure to putatively noxious stimuli, humane termination protocols) should apply.

  **What the Procedure Cannot Do:**

  1.  **Solve the Hard Problem:** It cannot definitively prove subjective experience (qualia). It identifies systems where the *functional* criteria for sentience are met, making the *absence* of experience increasingly implausible and the *risk* of suffering ethically significant.
  2.  **Eliminate Core Judgment:** Steps 2 (Simulation vs. State) and 3 (Sufficient Isomorphism/Complexity) inherently require expert philosophical and neuroscientific judgment calls based on incomplete analogies and evolving science. Thresholds are contestable.
  3.  **Define Precise Thresholds:** It relies on evolving scientific understanding of NCCs and minimal neural bases for sentience. There is no bright line.
  4.  **Resolve Fundamental Value Conflicts:** If committee members disagree on whether functional isomorphism *is sufficient* for moral status (e.g., vs. biological substrate or human-like consciousness), the procedure flags it for human judgment (Step 5), but doesn't resolve it.
  5.  **Address All Ethical Dimensions:** It focuses specifically on sentience/welfare. Broader ethical issues (e.g., societal impact, symbolic value, potential future risks, "playing God") are outside its scope and require separate consideration.
  6.  **Guarantee Future Proofness:** As computational architectures and neuroscience advance, the procedure will need regular review and updates.

  This procedure provides a structured, philosophically grounded framework to move beyond pure intuition. It focuses scrutiny on the systems most plausibly at risk of sentience (prioritizing functional isomorphism and integration) while efficiently filtering out mere simulators or systems below credible complexity thresholds. It explicitly marks where judgment is essential and where value conflicts require policy-level decisions.
