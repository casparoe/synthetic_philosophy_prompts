answer: |-
  Here are five numbered points addressing the tensions in Maimonides' argument:

  1.  Maimonides maintains the sacrificial laws are permanently binding *despite* their origin as a concession; the concession itself, once commanded by God as a necessary pedagogical step towards pure worship, acquires eternal divine authority within the Halakhic system, preventing future change.
  2.  The tension arises because God's immutable will is expressed through commandments *shaped* by mutable human circumstance; Maimonides resolves this by positing that God eternally wills the *ultimate goal* (pure monotheistic worship) but allows the *means* (sacrifices) to be contingent and adapted to specific historical human limitations.
  3.  His appeal to God knowing "all actions and their contexts" doesn't directly counter relativism; instead, it asserts that God's contingent commands, precisely *because* they are divinely chosen with perfect knowledge of all circumstances, possess an objective appropriateness for their specific purpose and time, even if the form seems arbitrary or rooted in idolatry.
  4.  While the *form* (sacrifices) is contingent and historically conditioned, Maimonides insists the *underlying purpose* (redirecting worship towards God alone, establishing a priesthood, etc.) is eternal and divine; thus, the command is not relativized *in essence*, only in its initial, necessary mode of implementation for a particular people.
  5.  His argument creates a paradox: if the concession was necessary due to ingrained idolatry, and the sacrificial system successfully weaned Israel from it, the *reason* for the concession vanished, yet the *laws* remain immutable, suggesting Maimonides prioritizes the stability of divine law over a purely functional interpretation of its historical origin.
