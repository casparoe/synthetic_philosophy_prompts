  That "God knows contexts" bit - ugh, it's frustrating. It feels like Maimonides dodges the relativism bullet by appealing to omniscience, but that doesn't address why historically-conditioned laws wouldn't need updating later. Unless... is he suggesting divine commands are perfect for each era by design? But he never says that.

