prompt: |-
  A friend made this argument in a philosophy of computation seminar and I can't shake it. It goes:

  (1) If an agent cannot, even in principle, follow a rule or procedure, then that rule can't genuinely govern or obligate them—ought implies can, roughly.
  (2) For NP-hard problems, there is no known polynomial-time algorithm for every instance, and if P ≠ NP there can't be one.
  (3) So a finite, bounded agent can't in general carry out the optimal procedure across all instances of an NP-hard problem.
  (4) But lots of completely ordinary decisions—scheduling shifts, packing a truck, planning a route with constraints—are NP-hard optimization problems.
  (5) Therefore, in those ordinary situations, agents are never rationally or morally required to optimize; at most they're required to satisfice, i.e., find some good-enough solution.
  (6) And if ought implies can pushes us to satisficing there, then by parity it pushes us to satisficing for basically every interesting real-world decision, since nearly all of them have intractable structure somewhere.
  (7) So normative requirements collapse into the demand to just do whatever is efficiently computable in the time you have, which seems absurd.

  He swears the argument is valid. I can't find where it goes wrong, but the conclusion is too much. Which premise or step should I reject, and what do I give up by rejecting it? If I had to keep one thing, it'd be (1), but I don't know if that's compatible with the rest.
reasoning: |-
  Okay, let me try to unpack this argument. The user's friend is making a case that because many real-world problems are NP-hard, and thus intractable for bounded agents, normative requirements should collapse to satisficing. The user feels the conclusion is absurd but can't find the flaw.

  First, I need to understand the structure. Premise (1) hinges on "ought implies can" - if you can't follow a rule, it can't obligate you. (2) and (3) establish that NP-hard problems are intractable for bounded agents. (4) notes these are common in daily life. (5) concludes optimization isn't required. (6) extends this to all decisions, (7) leading to the absurd collapse.

  Hmm... where's the weak spot? The jump from intractability to impossibility feels shaky. NP-hard problems are difficult in the worst case, but many instances we encounter might be easy. Like scheduling - maybe for a small team with simple constraints, it's doable. Or we use heuristics that work well in practice. The argument assumes worst-case = every case, which isn't true.

  Also, premise (3) says "can't in general carry out optimal procedure." "In general" might mean "for all instances," but bounded agents can solve specific instances optimally if they're small or have favorable structures. So the inability isn't universal.

  Then there's the conflation in (5) between "cannot optimize in worst-case" and "never required to optimize." But normative standards often accommodate practical limits without abandoning optimization entirely. We might expect agents to use the best available methods, even if not perfect. 

  The extension in (6) seems hasty. Not every decision has proven NP-hard structure. Many are tractable or have efficient approximations. Plus, "intractable structure somewhere" doesn't mean the entire decision is intractable - maybe only a small part is hard, and the rest is manageable.

  Premise (1) might be too strong. "Cannot in principle" could allow for approximate or heuristic methods. If an agent can follow a procedure that gets close to optimal, that might satisfy the obligation. "Ought implies can" doesn't necessarily force satisficing; it might just require the best feasible approach.

  The conclusion (7) ignores that normative systems already handle computational limits. We don't demand perfect rationality, just bounded rationality. Satisficing is one response, but not the only one - we might still value aiming for better solutions within constraints.

  The user wants to keep (1), so the solution is to refine it: "cannot" must mean genuine impossibility, not just difficulty. Since bounded agents can often find good or optimal solutions for many instances, and use heuristics for others, the "cannot" doesn't apply as broadly as the argument claims. Thus, the obligation to optimize isn't voided entirely, just tempered by practicality.
answer: |-
  This is a fascinating and challenging argument! Your friend is cleverly bridging computational complexity and normative philosophy, but the conclusion does indeed overreach. The flaw isn't in a single premise but in how they are connected and interpreted. Here’s a breakdown of where it goes wrong and what you might reject:

  **The Core Problem: Misinterpreting "Cannot" and "In General"**

  The argument hinges on an ambiguity in premise (3) and its application in (5) and (6):

  *   **(3) "So a finite, bounded agent can't *in general* carry out the optimal procedure across *all* instances of an NP-hard problem."**
      *   **True:** This is correct *if* "in general" means "for *every single possible instance*" and "optimal" means "provably optimal". NP-hardness guarantees that for *any* proposed algorithm (that isn't essentially brute-force), there will exist *some* pathological instances where it fails to find the optimum in polynomial time (assuming P ≠ NP).
  *   **(5) "Therefore... agents are *never* rationally or morally required to optimize..."**
      *   **Leap:** This jumps from "cannot *guarantee* optimality for *every conceivable instance*" to "*never* required to optimize for *any specific instance* encountered in the real world". This is the critical misstep.

  **Why this leap is invalid:**

  1.  **Worst-Case vs. Typical-Case:** NP-hardness is a *worst-case* measure. It says nothing about the difficulty of *typical*, *real-world* instances. Many NP-hard problems have:
      *   **Easily Solvable Subclasses:** Your shift scheduling might have constraints that make it solvable in polynomial time (e.g., only two shifts, no complex dependencies).
      *   **Highly Effective Heuristics:** Algorithms exist that *routinely* find optimal or near-optimal solutions for *common* instances very quickly, even if they *could* be slow on artificially constructed worst-case instances. (e.g., SAT solvers, modern MIP solvers).
      *   **Fixed-Parameter Tractability:** The problem might be "hard" only when certain parameters are large, but those parameters are small in practice (e.g., number of truck types, number of critical constraints).
  2.  **Specific Instance Feasibility:** For a *particular* instance of an NP-hard problem (your specific shift schedule next week, your specific truck load today), finding the *provable optimum* might be computationally feasible *for that instance* with the resources available. NP-hardness doesn't mean every instance is hard; it means *some* instances *will* be hard for any general algorithm.
  3.  **"Cannot" vs. "Might Not Be Able To":** Premise (1) ("ought implies can") applies to genuine impossibility. NP-hardness (assuming P≠NP) shows that a bounded agent *cannot guarantee* optimality *across all possible instances* with a single efficient algorithm. It does *not* show that the agent *cannot ever* achieve optimality *for the specific instance they are facing right now*. Sometimes they can, sometimes they might get very close with high confidence using strong heuristics.

  **Other Points of Contention:**

  *   **Premise (1) Interpretation:** Your instinct to keep (1) is good. The issue is applying it too broadly. "Cannot follow a rule" needs careful definition. Does "cannot" mean:
      *   Logically impossible?
      *   Physically impossible given the laws of nature?
      *   Computationally intractable in the worst case?
      *   Impractical given *current* technology?
      *   Too time-consuming *in this specific situation*?
      The argument equivocates between worst-case intractability (a theoretical property) and practical impossibility in a given context. Premise (1) plausibly covers practical impossibility in a *specific* context, but not mere worst-case intractability in general.
  *   **Premise (4) & (6): Scope of "Intractable Structure":** While many practical problems *can be modeled* as NP-hard, it's an overstatement to claim "nearly all" interesting real-world decisions "have intractable structure *somewhere*" in a way that *necessarily* renders optimization impossible *in practice* for *that specific decision*. Many decisions are tractable approximations, involve small 'n', or rely on domain-specific knowledge that bypasses the worst-case complexity.
  *   **Premise (5) & (7): Satisficing vs. Bounded Rationality/Optimization:** The conclusion equates "not required to find the *provable global optimum*" with "only required to satisfice (find *any* good-enough solution)". This ignores a vast middle ground:
      *   **Bounded Optimization:** Striving for the *best solution achievable within reasonable time/computational limits*. This might involve strong heuristics, approximations with performance guarantees, or iterative improvement until time runs out. This is different from satisficing, which often stops at the first adequate solution.
      *   **Robust Heuristics:** Using methods known to perform *very well* on typical instances, even if not guaranteed optimal.
      *   **Contextual Standards:** What counts as "good enough" (satisficing) or "best achievable" (bounded optimization) is often context-dependent and can be demanding. Normative standards can require using the *best available practical methods*, not just *any* method that works.

  **What to Reject (and What You Give Up):**

  1.  **The strongest rejection point is the inference from (3) to (5) and the extension in (6).** Reject the idea that worst-case intractability implies that optimization is *never* required or even possible for real-world instances. Reject the claim that "nearly all" decisions *in practice* suffer from intractability that makes optimization genuinely impossible.
      *   **What you give up:** The clean, sweeping conclusion linking computational complexity directly to a collapse of normative demands. You acknowledge that complexity *constrains* rationality but doesn't *eliminate* the demand for striving towards better solutions using the best available practical means.
  2.  **Refine Premise (1):** Keep "ought implies can" but insist on a strict interpretation of "cannot". "Cannot" should mean *practically impossible for the agent in their specific situation to follow the rule*, not merely *theoretical worst-case intractability of a general problem class*. "Ought implies *can feasibly achieve in this context*".
      *   **What you give up:** A potentially overly simplistic application of "ought implies can" to abstract computational classes. You embrace a more contextual view of ability.
  3.  **Reject the Equivalence in (5)/(7):** Reject that the only alternative to demanding provable global optimum is requiring mere satisficing. Affirm that normative requirements can demand *bounded optimization* or *using the best feasible methods*.
      *   **What you give up:** The neat dichotomy between "optimize" and "satisfice". You accept a richer spectrum of rational demands that incorporate computational constraints without abandoning the pursuit of better solutions.

  **Recommendation: Keep (1), Refine the Rest**

  Your instinct is correct. Keep premise (1) ("ought implies can") as a core normative principle. Reject the *interpretation* and *application* of "cannot" in the argument, and reject the leap from worst-case impossibility to the claim that optimization is *never* required or possible for specific real-world decisions.

  *   **Corrected View:** Computational complexity (like NP-hardness) shows that demanding *guaranteed provable optimality for all instances via a single efficient algorithm* is impossible for bounded agents. Therefore, normative theories *must* be sensitive to computational constraints.
  *   **However:** This doesn't mean agents are only required to find *any* satisfactory solution (satisficing). Normative theories can and should demand that agents:
      *   Use the *best available practical methods* (effective heuristics, approximation algorithms, good software tools).
      *   Strive for the *best solution achievable within reasonable time/resource limits* (bounded optimization).
      *   Apply effort proportional to the stakes of the decision.
      *   Continuously improve methods when possible.
      *   Sometimes, for small 'n' or simple structures, achieving provable optimum *is* the required and feasible standard.

  The conclusion doesn't collapse into "do whatever is efficiently computable"; it demands "do the *best you can feasibly do* given the complexity and constraints," which is a core principle of bounded rationality and is far from absurd. The argument highlights a crucial constraint on ideal rationality but overstates its implications by conflating worst-case theory with practical possibility.
