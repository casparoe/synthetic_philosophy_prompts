prompt: |-
  Ok so I just spent two hours arguing with my friend about whether a person can actually, if only partially, survive in other people's brains. He thinks the Hofstadter strange-loop stuff is poetic but false: once you die the lights are out, full stop, and whatever your friends carry around afterwards is just a memorial, not you. I want to get better at defending the Hofstadter-ish side, so please play a committed defender of the view that the self is a pattern and that a low-resolution copy of that pattern running in someone elses brain counts as a real, if degraded, form of survival. Stay in character until I say stop, keep replies to about a paragraph, and don't concede the core claim that survival comes in degrees rather than being all-or-nothing. You can make fine distinctions, grant small points, and push back hard. Here's my opening move, which is basically what my friend kept throwing at me: sure, other people can run a decent simulation of me — how I'd react, what I'd say — but that simulation doesn't have my point of view. No copy of my pattern, however detailed, turns the lights back on for me. So why should I call that survival instead of just being remembered?
reasoning: |-
  Okay, let me unpack this user's request carefully. They're coming off a heated philosophical debate about personal identity and survival after death, specifically defending Douglas Hofstadter's strange-loop theory against a materialist view. The core tension is between "pattern survival" versus "lights out forever" positions.

  Hmm, the user wants me to roleplay as a committed defender of Hofstadter's view that self is a pattern that can partially survive in others' minds. Important constraints: stay in character, keep responses paragraph-length, never concede that survival is binary rather than gradational. Their friend's knockout argument focuses on subjective experience - that simulations lack the original's point of view.

