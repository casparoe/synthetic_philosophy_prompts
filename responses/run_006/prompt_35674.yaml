answer: |-
  You've hit on one of the most subtle and debated points in decision theory! The jump from "Kelly is optimal for repeated bets" to "Kelly is *the* general norm of rationality" is indeed where things get philosophically contentious. Your intuition that it seems like expected utility theory (EUT) with log utility is correct, but proponents argue there's more to it. Let's break down the arguments and your valid concerns:

  1.  **Your Core Insight is Correct: Kelly *is* EUT with Log Utility**
      *   Technically, yes. Maximizing expected log wealth *is* equivalent to maximizing expected utility where your utility function is U(W) = log(W). This is a specific, highly risk-averse utility function (diminishing marginal utility of wealth, infinite negative utility at W=0).
      *   If someone *doesn't* have a log utility function (which most people don't, especially over all wealth levels), then maximizing expected log wealth would be irrational *according to standard EUT*. Standard EUT holds that rationality requires maximizing expected utility *given your specific preferences* (your utility function).

  2.  **The Kelly Proponent's Counter-Argument: Beyond Subjective Utility**
      Proponents of geometric rationality argue Kelly is privileged *independently* of arbitrary utility functions for deeper structural reasons:

      *   **The No-Bankruptcy Guarantee:** Kelly betting is the *only* strategy that guarantees you never go bankrupt (W=0) in a sequence of favorable, independent bets *while still taking non-zero bets*. Any other fixed fraction strategy (like betting half-Kelly) has a positive probability of ruin over infinite time. Betting more than Kelly ("overbetting") guarantees ruin with probability 1. This is seen as a fundamental structural advantage, not just a preference.
      *   **Time Consistency / Myopic Optimality:** The Kelly strategy is *time-consistent* in a unique way. The optimal fraction to bet *today*, assuming you will follow the Kelly strategy *forever in the future*, is *always* the full Kelly fraction. If you use a different utility function (e.g., U(W) = sqrt(W)), the optimal bet *today* depends on how many future bets you expect to make. Kelly is "myopically optimal" – the best single-period decision is the same as the best decision within the infinite sequence, without needing to know the future horizon. This is argued to be a hallmark of robust rationality.
      *   **Dominance in the Long Run (Beyond Growth Rate):** While maximizing growth rate is the initial motivation, proponents argue the dominance is stronger. In the limit of many bets, the Kelly bettor will *almost surely* end up with vastly more wealth than any other "essentially different" strategy. Not just *more on average*, but with probability approaching 1, the Kelly bettor's wealth will exceed that of any other bettor by an arbitrarily large factor. This is seen as a stronger justification than simply winning a growth rate race. It suggests Kelly isn't just *a* good strategy, but *the* strategy that dominates alternatives in the long run.
      *   **Rationality as Survival / Avoiding Forced Exit:** Linked to no-bankruptcy, the argument is that a rational agent must adopt a strategy that ensures they remain in the game. Strategies that risk ruin (anything ≠ Kelly) are irrational because they guarantee you *will* eventually exit the game and miss out on all future opportunities, no matter how favorable. Log utility is the *only* utility function that inherently encodes this absolute avoidance of ruin.
      *   **The Dutch Book / Money Pump Argument (Advanced):** Some arguments claim that an agent not using Kelly (or something isomorphic to it) can be subjected to a form of Dutch book or money pump in sequential betting scenarios, *even if they are consistent according to their own non-log utility function*. This suggests a deeper inconsistency in non-Kelly strategies under sequential choice. (This is highly technical and debated).

  3.  **Your Valid Concerns: Is it Just Dressed-Up Log Utility?**

      *   **The Subjectivity Charge:** You are absolutely right to point out that for an agent who genuinely has a different utility function (e.g., someone who values $1 million almost as much as $10 million, or someone who desperately needs $10,000 to avoid catastrophe *now*), forcing them to maximize log wealth would be irrational *by their own lights*. Geometric rationality implicitly prioritizes "staying in the game forever and growing asymptotically" above all other possible terminal goals or risk tolerances.
      *   **The "Everything" Problem:** Extending Kelly beyond repeated identical favorable bets is highly problematic. Real-life decisions involve:
          *   Non-monetary outcomes (health, relationships, knowledge).
          *   Correlated bets/outcomes.
          *   Unique, irreversible decisions (not repeated).
          *   Situations where the "odds" are unknown or subjective.
          *   Goals other than long-term wealth accumulation.
      Applying "bet the Kelly fraction" directly to these is nonsensical. Proponents might argue for a generalized "geometric" perspective (e.g., maximize the geometric mean of *some* scaling factor), but this becomes abstract and loses the clean, objective properties of the original Kelly criterion.
      *   **Risk Aversion Mismatch:** Kelly is *extremely* risk-averse near ruin and *less* risk-averse (willing to bet larger fractions) at very high wealth levels compared to many people's intuitive risk preferences. Insisting it's universally rational ignores this disparity.

  **The Synthesis: What You Might Be Missing (and What Isn't Convincing)**

  1.  **Structural Guarantees vs. Utility:** The strongest argument *for* Kelly as universally rational in *sequential favorable bet* scenarios hinges on the **structural guarantees** (No Ruin, Time Consistency, Long-Term Dominance) being seen as *inherently rational requirements*, independent of arbitrary utility. The claim is that *any* rational agent *must* want to avoid guaranteed eventual ruin and *must* want time-consistent plans, and Kelly is the *only* strategy that delivers this in the canonical setup. Log utility isn't the starting point; it's the *consequence* of demanding these structural properties.
  2.  **The Burden Shift:** The argument subtly shifts the burden: Instead of Kelly needing to align with arbitrary preferences, it claims that preferences *should* align with Kelly to satisfy these deeper structural axioms of rational sequential play under growth and uncertainty.
  3.  **It's NOT Just About Growth Rate:** You correctly note the slide from "best for repeated bets" to "general norm". The proponent's counter is that the reasons for its optimality in repeated bets (the structural guarantees) are *themselves* fundamental principles of rationality applicable more broadly, even if the direct "betting fraction" calculation isn't.

  **Conclusion:**

  You're not missing a simple step; you're correctly identifying a genuine philosophical leap. There *is* a case that Kelly is uniquely privileged in sequential decision-making under uncertainty with reinvestment, **not merely because it maximizes growth, but because it provides fundamental structural guarantees (no ruin, time consistency) that other strategies lack.** Proponents argue these guarantees *define* rationality in such contexts, making log utility the *rational consequence*, not an arbitrary preference.

  However, your skepticism is **highly warranted.** For many real-world decisions outside the specific domain of repeated, favorable, independent bets with reinvestment:
  *   Kelly's structural guarantees may not apply or be relevant.
  *   Individual risk preferences, time horizons, and non-wealth goals *do* matter.
  *   Insisting Kelly/log utility is universally "rational" often *is* dressing up a specific (albeit mathematically elegant) risk preference as a deep principle, potentially ignoring an individual's actual values and context.

  **In short:** Kelly's optimality for long-term growth in repeated bets is mathematically proven. The claim that this makes "geometric rationality" (max E[log]) *the* general norm of rationality is a much stronger, philosophical claim based on valuing the structural properties it provides (no ruin, time consistency, long-term dominance) above all else. It's compelling within its specific domain and for those who prioritize those structural guarantees universally, but it's not an inevitable conclusion forced upon everyone by pure logic, and it faces significant challenges when applied to the messy, non-repeated decisions of real life. Your friend is presenting a specific, albeit powerful, philosophical stance within decision theory, not an undisputed fact.
