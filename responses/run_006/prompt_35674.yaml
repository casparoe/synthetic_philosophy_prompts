  I recall that Kelly proponents argue it's not just about utility. The no-bankruptcy guarantee and time consistency are key. Time consistency means that the optimal fraction remains the same regardless of when you stop, which isn't true for other utility functions. Maybe that's the point they're missing. Also, the idea that Kelly avoids ruin entirely could be seen as a structural advantage beyond subjective utility.

