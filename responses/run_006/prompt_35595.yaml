  For the desiderata, each point needs a clear case: why it's important, what happens if it's dropped, and which theories might compromise on it. For instance, the conscious/unconscious distinction is fundamental—any theory must explain that. But how higher-order theories handle animal consciousness might be more flexible, depending on whether they accept lower-order consciousness.

  The unity of experience is tricky. If consciousness arises from one state representing another, how does that account for the holistic feel? Some theories might argue that the higher-order state binds the experience, but others might need to relax the criteria. 

  Neural correlates are non-negotiable. Any theory must align with brain data, like prefrontal cortex involvement. But if a theory can't explain cases of prefrontal damage without loss of consciousness, that's a problem. 

  The consciousness of higher-order states is a deep issue. If a higher-order state makes another state conscious, what makes it conscious? Infinite regress is a threat here. Some theories might bite the bullet and say it's unconscious, but that needs justification. 

  I should also note if some criteria conflict. For example, requiring animal consciousness without higher-order thought clashes with theories that demand such thoughts. This conflict might mean no theory satisfies all, which is crucial for the user's paper. 

