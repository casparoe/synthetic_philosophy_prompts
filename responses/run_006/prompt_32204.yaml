answer: |-
  Here's the statue/clay debate mapped to OOP concepts, followed by the residue report.

  **Positions in OOP Terms:**

  1.  **Monism (Statue = Lump):**
      *   There's one physical object instance (`LumpOfClay`) allocated on the heap.
      *   When shaped, the instance's *state* changes (shape, properties). Its `isSculpted` flag flips to `true`.
      *   "Statue" and "Lump" are just two different *reference variables* (`lumpRef`, `statueRef`) pointing to the *same object instance*. They represent different *interfaces* (`LumpInterface`, `StatueInterface`) or *type tags* (checked via `instanceof`) that the single object instance implements/possesses based on its current state.
      *   Squashing changes the state again (`isSculpted = false`); the `StatueInterface` is no longer valid, but the object instance (`LumpOfClay`) persists. `statueRef` might become invalid or point to null. Identity (`==`) remains constant.

  2.  **Pluralism (Two Things):**
      *   Two distinct object instances exist simultaneously on the heap: `myLump` (type `Lump`) and `myStatue` (type `Statue`).
      *   `myStatue` *has-a* strong reference to `myLump` (composition/aggregation). `myStatue` is essentially a wrapper or facade object.
      *   They share the same underlying matter/data (perhaps a reference to the same `AtomicMatter` array), but are different objects (`myLump != myStatue`).
      *   Shaping creates the `Statue` instance, linking it to the pre-existing `Lump`. Squashing destroys the `Statue` instance (`myStatue = null`), but the `Lump` instance remains. Leibniz's law holds: different creation/destruction times and conditions.

  3.  **Constitution View:**
      *   One primary object instance exists (`myStatue` of type `Statue`).
      *   This `Statue` instance *has-a* reference to a `Lump` instance (`constitutingLump`) as a core part of its state.
      *   The `Lump` instance is a distinct object, but it exists *only* as a property *of* the `Statue` during the statue phase. Accessing "the lump" means accessing `myStatue.constitutingLump`.
      *   Shaping creates the `Statue` object, which instantiates its own `Lump` component (or takes a pre-existing `Lump` reference). Squashing destroys the `Statue` object (and potentially its `Lump` component, or sets `constitutingLump` to a new "squashed" state). The lump's persistence depends on implementation.

  **Residue Report:**

  *   **Maps Cleanly:**
      *   Object Identity (`==` vs `.equals()`): Directly maps to the core question of whether "is the same thing" means identity or state equality.
      *   Mutability/State Change: Explains *how* the physical material changes (object state mutation).
      *   References/Interfaces: Explains *why* we talk about "the statue" vs "the lump" differently (different references/interfaces to the same or related objects).
      *   Composition: Maps cleanly to Pluralism/Constitution views.

  *   **Fudged:**
      *   **Existence/Destruction Conditions:** OOP object lifecycle (constructor `new`, GC) is a poor analog for real-world existence/destruction. Philosophers debate *when* the lump/statue *fundamentally* starts/stops existing based on form/purpose. OOP creation (`new`) is explicit; real-world persistence is continuous.
      *   **Temporal Properties:** Philosophers assign properties like "existed on Monday". OOP objects don't inherently track their own creation time or past states without explicit code.
      *   **"Survives" Squashing:** In Pluralism, does the `Lump` object *survive* or is a *new* squashed lump object created? OOP allows either implementation. The metaphysical debate assumes persistence of the *same* lump.

  *   **No OOP Counterpart:**
      *   **Fundamental Ontology:** The debate is about *what fundamentally exists* at a point in time (one thing? two things?). OOP is agnostic – you choose the model (1 instance, 2 instances) based on design needs. Both are valid implementations.
      *   **Modal Properties:** Philosophers consider properties like "could survive squashing" (lump) vs "could not" (statue). OOP deals with actual state, not inherent potential defined outside the class's methods. A `Statue` class *could* have a `surviveSquash()` method returning `true` if poorly designed.
      *   **Spatial Coincidence:** The fact that two *potentially* distinct things occupy identical space is deeply puzzling metaphysically. In OOP, two distinct objects can easily reference the same spatial data without issue.

  *   **Residue Significance:**
      The residue shows your OOP vocabulary **captures the implementation mechanics perfectly** but doesn't resolve the underlying **metaphysical question** philosophers grapple with: what are the fundamental criteria for object persistence and identity *in reality* over time, especially through change? The debate is substantive *for ontology* (the study of what exists). OOP provides tools to *model* different ontological choices pragmatically, but doesn't dictate which choice reflects reality "better" because it operates at a different level of abstraction. The residue highlights philosophy's focus on real-world existence, not just software representation.
