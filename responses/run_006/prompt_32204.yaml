prompt: |-
  I'm a software engineer, mostly Java backend. I stumbled on this thing philosophers argue about called the statue and the clay problem. The setup: you have a lump of clay, you shape it into a statue, and now the question is whether the statue and the lump are the same thing or two different things. They seem to have different properties — the lump existed on Monday before you shaped it, the statue didn't; if you squash the statue, the statue is destroyed but the lump survives — so Leibniz's law would say they're distinct. But they occupy the exact same space and are made of the same matter, so that's weird.

  My instinct is that this is just a confusion about reference vs. value, or about object identity vs. the object's current state. Like, you have one object on the heap, and you're just pointing to it through two different variables with different type tags. Am I right?

  Restate the main positions in this debate — monism (statue = lump), pluralism (they're two things), the constitution view — in the vocabulary I actually use: classes, instances, references, identity vs. equality, composition, type tags, interfaces, mutability. Be precise, don't handwave.

  Then give me the residue report. What maps cleanly? What did you have to fudge? What parts of the philosophers' debate have no counterpart in OOP at all? And is the residue a sign that my vocabularly is missing something real, or that the debate is less substantive than it looks?

  Keep it under 600 words — I want this tight.
