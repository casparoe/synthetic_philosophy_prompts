prompt: |-
  I'm a staff engineer on a team that maintains a small library of formally verified components — sorting and search routines, parsers, a scheduler — that sits underneath a safety-critical product, so the team lead has to sign off on every proof we merge. Part of my job is reviewing pull requests where a collegue claims 'this proof shows the function is total' or 'we've proved a witness exists.' We've been burnt a few times by proofs that a thing exists but don't actually hand us any way to find it: the proof goes through by assuming the thing doesn't exist and deriving a contradiction, and when we go to extract the algorithm there's just nothing there. I dimly remember this being the difference between classical and constructive (intuitionistic) logic, but I don't have the background to turn that into a review checklist.

  Please write me a reusable decision procedure for reviewing such proofs that a non-logician engineer can actually run in about twenty minutes per proof, once or twice a week, grounded in what intuitionistic logic and constructivism actually say about when a proof yields a witness. It should tell me what to look for to decide whether a proof is constructive enough that we can extract an algorithm, or at least a bound; which classical moves — excluded middle, double negation elimination, proof by contradiction, noncomputable choice, that sort of thing — are red flags and which are actually harmless in context (negative results, finite or decidable domains, etc.); which distinctions have to survive the simplification and which can be dropped; where the procedure should stop and hand the proof to someone with real logic background; and which steps are judgment calls dressed up as procedure. Then run the procedure on three worked cases: (1) a proof that any list can be sorted, done by assuming a minimal permutation exists and deriving a contradiction otherwise; (2) a proof that a particular parser never loops on malformed input; and (3) a termination proof for the scheduler that relies on a well-ordering with no computable description. I need at least one of these to come out with an answer the author won't like, and I want you to say plainly what the procedure can't settle.
reasoning: |-
  We are going to design a decision procedure for reviewing proofs in the context of constructive mathematics, with the goal of determining whether a proof is sufficiently constructive to yield an algorithm (or at least a bound) when we extract it.

  The key idea: constructive proofs (in the intuitionistic logic) are those that provide explicit witnesses for existential statements and explicit algorithms for functions. Classical logic, by allowing the law of excluded middle and proof by contradiction, can sometimes prove existence without providing a way to construct the witness.

  The procedure:

  1. **Identify the main claim**: What is the theorem being proved? Typically, it will be one of:
     - An existential statement (∃x. P(x))
     - A universal statement (∀x. ∃y. R(x,y))  [which is a function from x to y]
     - A totality statement (a function is total: ∀x. ∃y. f(x)=y)
     - A termination statement (a computation always halts)

  2. **Check the logical form of the proof**:
     We are particularly interested in the use of classical principles. We must flag:
     - **Excluded middle (EM)**: Any use of "P ∨ ¬P" without specifying which one holds.
     - **Double negation elimination (DNE)**: If you have ¬¬P and conclude P.
     - **Proof by contradiction (PbC)**: To prove P, assume ¬P and derive a contradiction.
     - **Axiom of choice (AC)**, especially when it is applied to an infinite set without a decidable order or when it is noncomputable.

     However, note that some uses of classical logic are harmless:
     - When proving a negative statement (e.g., ¬∃x. P(x)) because negative statements do not require a witness.
     - When the domain is finite and small enough to be enumerated (then we could in principle try all possibilities).
     - When the domain is decidable (e.g., we have a decision procedure for the predicates involved).

  3. **Look for the extraction mechanism**:
     In constructive proofs, the proof itself is a recipe for building the witness. Therefore, we should see:
     - For an existential statement: an explicit construction of the witness, or a procedure that builds it.
     - For a universal statement: a function that, given an input, produces the output and a proof that it satisfies the relation.

  4. **Red flags**:
     - Any use of EM, DNE, or PbC in the proof of an existential statement or a function totality is a red flag if the proof does not then provide an explicit witness or algorithm. However, note that sometimes these principles are used on decidable predicates and hence are safe (because we can compute which side holds).

     How to check for decidable predicates? Look for a lemma or assumption that the predicate is decidable (i.e., we have a function that returns true or false for every input). For example, in the case of finite domains, we can decide by checking all cases.

  5. **When to stop and hand over to an expert**:
     - When the proof uses advanced concepts (e.g., ordinals, nonstandard models, complex set-theoretic arguments) and you cannot see how to extract an algorithm.
     - When the proof uses classical principles but in a way that might be eliminable (e.g., by using a constructive substitute) and you are not sure.
     - When the proof is very long and complex and you cannot trace the logic.

  6. **Judgment calls**:
     - Sometimes a proof uses classical logic in a way that is not directly constructive, but the result is still computationally extractable. For example, if the classical part is only used to prove a negative lemma that is then used in the constructive part, then the extraction might still work.
     - Also, sometimes a proof uses EM on a decidable predicate, but the decidability is not immediately obvious. You have to judge whether the predicate is indeed decidable.

  7. **What the procedure cannot settle**:
     - There are constructive proofs that are not efficient, so even if we get an algorithm, it might be too slow. The procedure does not address efficiency.
     - Some proofs might be constructive but rely on axioms that are not implemented in the extraction mechanism (e.g., if the proof uses the axiom of choice in a set theory that is not implemented). We assume the underlying system is consistent with the extraction.

  Now, let's run the procedure on the three examples.

  ### Example 1: Proof that any list can be sorted (by assuming a minimal permutation exists and deriving a contradiction otherwise)

  **Step 1: Main claim**: 
     - We are proving that for any list L, there exists a sorted permutation of L. This is an existential statement (∃ permutation P of L such that P is sorted).

  **Step 2: Logical form**:
     - The proof assumes that there is a minimal permutation (with respect to some ordering) and then derives a contradiction if it is not sorted. This is a proof by contradiction: 
          Assume no sorted permutation exists → then the minimal permutation (which must exist by the well-ordering principle) is not sorted → but then we can show that there is an even smaller permutation, contradiction.

  **Step 3: Red flags**:
     - The proof uses the well-ordering principle (a form of choice) on the set of permutations. Since the set of permutations of a finite list is finite, we might think it's safe. However, note:
          * The proof does not construct the sorted permutation. It only shows that the minimal one must be sorted.
          * The minimal permutation is defined by an ordering that might not be computable? Actually, the ordering is usually lexicographic or by some metric of "sortedness", but the proof does not specify how to find it.

     But note: the domain (permutations of a finite list) is finite. Therefore, we can in principle enumerate all permutations and pick the minimal one. However, the proof does not do that; it uses a non-constructive existence of a minimal element.

     However, because the domain is finite, we can extract an algorithm by brute force: try all permutations and pick one that is sorted. But note: the proof does not tell us how to check if a permutation is sorted? Actually, that part is decidable: we can compare adjacent elements.

     Therefore, the red flag (use of well-ordering) is actually harmless because of the finite domain. But wait: the proof does not explicitly say that we are going to try all permutations. It just proves existence. However, in the context of finite domains, we know that we can do a brute force search. So the extraction is possible.

     **Verdict**: The proof is acceptable because the domain is finite and the predicates are decidable. We can extract an algorithm (though inefficient) by brute force.

     However, note: the proof might be intended to be used for lists of any type (even infinite? no, lists are finite). But if the list is very long, brute force is not practical. The proof does not give an efficient algorithm. But the requirement is only for extraction of an algorithm, not an efficient one.

     So this proof is acceptable, but we might note that it leads to an inefficient algorithm.

  ### Example 2: Proof that a particular parser never loops on malformed input

  **Step 1: Main claim**:
     - The claim is that for any malformed input, the parser terminates (does not loop). This is a universal statement: ∀ input (malformed) the parser terminates.

  **Step 2: Logical form**:
     - We are not told how the proof is done. But the problem says it's a proof that the parser never loops on malformed input. We must look at the method.

     Suppose the proof goes by: 
          Assume the parser loops on some malformed input → then we derive a contradiction (because the parser is designed to detect malformed inputs and reject them).

     This is a proof by contradiction.

  **Step 3: Red flags**:
     - Proof by contradiction is used for a positive statement: termination. In constructive logic, termination must be proved by providing a termination measure (e.g., a decreasing function in the input). 

     However, note that termination is a negative statement? Actually, termination is: ¬(loops forever). But note: we can also view it positively: there exists a step at which the parser halts. So it's an existential statement: for every input, there exists a step n such that the parser halts at step n.

     Therefore, the proof by contradiction is a red flag because it does not give a bound on the number of steps.

     We must check: does the proof provide a bound? If the proof by contradiction does not give any bound, then we cannot extract a bound.

     Alternative: if the proof shows that the parser always either accepts, rejects, or continues in a way that decreases some well-founded measure, then it would be constructive. But if it only uses contradiction, we have no witness.

     **Verdict**: This proof is problematic. We cannot extract a bound on the running time. The proof must be rewritten to include a termination measure (e.g., the length of the input, or a lexicographic measure of the parser state) that decreases with each step.

     Therefore, the author won't like this: the proof is nonconstructive and does not give a bound. We must ask for a constructive termination proof.

  ### Example 3: Termination proof for the scheduler that relies on a well-ordering with no computable description

  **Step 1: Main claim**:
     - The scheduler always terminates (for any input). This is a totality claim: ∀ input, the scheduler terminates.

  **Step 2: Logical form**:
     - The proof uses a well-ordering (every nonempty set has a least element) to show that the computation cannot go on forever. Specifically, it assigns to each state of the scheduler an element of a well-ordered set and shows that the sequence of states is strictly decreasing. Since the set is well-ordered, there are no infinite decreasing chains.

  **Step 3: Red flags**:
     - The well-ordered set is described as having "no computable description". This means we cannot compute the assignment of states to the well-ordered set. Therefore, the proof does not give a computable way to determine the next state or to bound the number of steps.

     Even though the proof shows that the sequence of states is decreasing and hence must be finite, without a computable assignment we cannot extract a bound. Therefore, the proof is nonconstructive.

     **Verdict**: This proof is problematic. We cannot extract an algorithm for the scheduler? Actually, the scheduler algorithm is given, but we cannot see that it terminates in a computable way. Moreover, without a bound, we cannot predict when it will terminate.

     Therefore, the author won't like this: the proof does not yield a bound and the termination is nonconstructive. We must either find a computable well-ordering (if the set of states is countable and we can define one) or use a different measure.

  **Summary of the three examples**:

  1. The sorting proof: acceptable (because finite domain) but inefficient.
  2. The parser proof: not acceptable (proof by contradiction without providing a bound).
  3. The scheduler proof: not acceptable (noncomputable well-ordering).

  **What the procedure cannot settle**:

  - If a proof uses classical logic in a way that is not obviously eliminable but the domain is not clearly finite or decidable, then we may need an expert to see if there is a constructive version.
  - Sometimes a proof is constructive but the witness is not immediately apparent; it might be hidden in a lemma that is proved constructively. We have to trace the entire proof.
  - The procedure does not guarantee that the extracted algorithm is efficient or meets real-time constraints (which might be critical in safety-critical systems). It only checks for existence of an algorithm.

  **Final Decision Procedure Checklist**:

  1. What is the main claim? (existential, universal, termination, etc.)
  2. Does the proof use any classical principles (EM, DNE, PbC, AC, well-ordering) in the proof of a positive existential claim?
  3. If so, is the domain of the variable(s) in the classical principle:
     a. Finite? (then harmless, but note inefficiency)
     b. Decidable? (i.e., we have a decision procedure for the predicates) then harmless.
     c. Negative statement? (then harmless)
  4. If the classical principle is used and the domain is not finite or decidable, then it is a red flag.
  5. For termination and existence claims, does the proof provide an explicit witness (e.g., a termination measure, an explicit construction)? If not, and classical logic was used, then the proof is nonconstructive.
  6. If the proof uses a well-ordering or choice, is the well-ordering/choice computable? If not, then it's nonconstructive.
  7. If you are unsure about whether a predicate is decidable or if the proof can be made constructive, hand it over to an expert.

  This checklist should take about 20 minutes per proof.
answer: |-
  Below is a reusable decision procedure for reviewing proofs in your formally verified component library, designed to be executed in ~20 minutes by a non-logician. It focuses on identifying when classical logic prevents witness extraction and flags specific proof patterns that threaten constructivity. The procedure includes a checklist, context-specific exceptions, and guidelines on when to escalate. Worked examples follow, including one problematic case (Example 3).

  ---

  ### **Decision Procedure: Constructivity Review Checklist**  
  *(Run this for each proof of existence, totality, or termination)*  

  1. **Identify the Proof Goal**  
     - [ ] **Positive claim?** (e.g., "there exists X", "function halts for all inputs", "we can compute Y").  
     - [ ] **Negative claim?** (e.g., "no contradictions", "function never diverges").  
       *→ Harmless if classical: Negative claims don’t require witnesses.*  

  2. **Scan for Classical Red Flags**  
     Check for these *non-constructive* techniques in the proof body. **Stop and reject if found** *unless* they meet harmless conditions (Step 3):  
     - [ ] **Proof by Contradiction (PbC)** for positive claims:  
       *"Assume ¬P → contradiction, therefore P"* (e.g., "Assume no sorted list exists → contradiction").  
     - [ ] **Excluded Middle (EM) or Double Negation Elimination (DNE)** in positive claims:  
       *"P ∨ ¬P" without specifying which, or "¬¬P → P"*.  
     - [ ] **Non-Constructive Choice Axioms**:  
       *Uncomputable well-orderings, arbitrary choice from infinite sets (e.g., "pick a minimal element via well-ordering")*.  
     - [ ] **Undecidable Quantifiers**:  
       *Universal/ existential quantifiers over infinite sets without computable bounds (e.g., "∀x∈ℝ...")*.  

  3. **Check for Harmless Exceptions**  
     Red flags **are acceptable** only if:  
     - [ ] **Finite/Decidable Domain**: EM/PbC used on finite sets (e.g., `n < 5`), or predicates with computable tests (e.g., `isEven(n)`).  
       *→ Witness extraction: Brute-force search possible.*  
     - [ ] **Negative Claim**: PbC/EM proving absence (e.g., "parser never loops").  
     - [ ] **Trivial Witness**: Witness is explicit elsewhere (e.g., PbC shows existence, but algorithm is defined separately).  

  4. **Verify Witness Extraction Mechanism**  
     - [ ] **Explicit Construction**: Proof directly defines an algorithm/bound (e.g., "here’s the sorting function").  
     - [ ] **Implicit Bound**: Proof provides a termination metric (e.g., "steps decrease by δ each iteration").  
     - [ ] **No Witness?** → Proof is non-constructive; reject.  

  5. **Escalate to Logician If**:  
     - Proof uses advanced set theory (e.g., ordinals, uncountable choice).  
     - Harmless-exception status is unclear (e.g., "is this predicate decidable?").  
     - Proof mixes constructive/classical logic in nested lemmas.  

  6. **Judgment Calls** (Document these):  
     - Efficiency of extracted algorithm (not required, but note for downstream).  
     - "Decidable" claims without an explicit decision procedure.  
     - Choice over large-but-finite sets (e.g., 10¹⁰ elements – acceptable but inefficient).  

  ---

  ### **Worked Examples**  
  #### **Example 1: Proof that any list can be sorted**  
  *Proof sketch: "Assume no minimal unsorted permutation exists → contradiction. Thus, minimal permutation is sorted."*  

  1. **Goal**: Positive existential ("sorted list exists").  
  2. **Red Flags**:  
     - PbC: Assumes no sorted list exists → contradiction.  
     - Non-constructive choice: "Minimal permutation" implies well-ordering.  
  3. **Harmless Exceptions?**  
     - Domain is **finite** (permutations of finite list).  
     - Predicate "sorted" is **decidable** (scan list pairwise).  
  4. **Witness Extraction**: Brute-force search over permutations is possible (inefficient but valid).  
  5. **Verdict**: ✅ **ACCEPT**. Domain finiteness makes classical logic harmless.  

  ---

  #### **Example 2: Proof that parser never loops on malformed input**  
  *Proof sketch: "Assume parser loops on malformed input X → contradiction (violates soundness invariant)."*  

  1. **Goal**: Negative claim ("never loops").  
  2. **Red Flags**: PbC used ("assume loops → contradiction").  
  3. **Harmless Exceptions?**  
     - Negative claim → PbC is **always harmless**. No witness needed.  
  4. **Witness Extraction**: Not required (proves absence of divergence).  
  5. **Verdict**: ✅ **ACCEPT**. Classical logic is safe for negative claims.  

  ---

  #### **Example 3: Termination proof for scheduler**  
  *Proof sketch: "States map to ordinals in a well-ordering. Each step decreases the ordinal → termination. Well-ordering is non-computable."*  

  1. **Goal**: Positive termination ("scheduler always halts").  
  2. **Red Flags**:  
     - Non-constructive choice: **Non-computable well-ordering**.  
     - No explicit bound: Ordinal assignment is abstract.  
  3. **Harmless Exceptions?**  
     - Domain **not finite/decidable**: States are unbounded.  
     - No trivial witness: Ordinals are non-computable.  
  4. **Witness Extraction**: **None**. Proof shows "termination exists" but provides no runtime bound or halting certificate.  
  5. **Verdict**: ❌ **REJECT**. Author must replace with:  
     - Constructive termination metric (e.g., lexicographic measure on state).  
     - Computable well-ordering (e.g., finite sets with known orders).  
     *→ This is the answer the author won’t like.*  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Efficiency**: A constructive proof may still yield an exponential-time algorithm (e.g., brute-force sort). The procedure only checks for existence.  
  2. **Hidden Assumptions**: If a classical lemma is buried in a subproof, it may be missed without escalation.  
  3. **Partial Constructivity**: Proofs where witnesses exist for subsets of inputs (e.g., "works for decidable subtypes") require manual inspection.  

  **Time Estimate**: ~15–20 minutes per proof: Steps 1–4 (10 min), escalation/judgment (5–10 min). Focus on red flags and domain finiteness/decidability first.
