answer: |-
  ## Ghost Loop

  This morning almost called your name at dawn.  
  I hear your *no* before my thought's complete.  
  **She wasn't bone, but how the light was drawn.**  

  Predict your take on headlines, weather, scorn –  
  exactly how you'd shuffle down the street.  
  This morning almost called your name at dawn.  

  That joke last night? I laughed, abrupt, forlorn,  
  the cadence yours, the timing indiscreet.  
  **She wasn't bone, but how the light was drawn.**  

  I set two mugs out, habit barely worn,  
  your phantom taste of bergamot bittersweet.  
  This morning almost called your name at dawn.  

  A faulty mirror shows a face ill-shorn  
  by grief, reflecting echoes in retreat.  
  **She wasn't bone, but how the light was drawn.**  

  A self-made knot, a strange loop, threadbare, torn,  
  still runs within me, tangled, incomplete:  
  **Her dimmer copy runs on in my storm,**  
  **She wasn't bone, but how the light was drawn.**

  ---

  **Notes on the Request:**

  *   **Refrains:** "She wasn't bone, but how the light was drawn" (capturing the pattern-not-stuff essence) and "Her dimmer copy runs on in my storm" (the degraded, persistent internal pattern).
  *   **Form as Function:** The villanelle's cyclical recurrence of refrains mirrors the intrusive, recurring nature of the friend's internalized patterns. Each reappearance feels slightly different in its new context, like the pattern surfacing in a new situation within the speaker's mind ("in my storm").
  *   **Final Quatrain:** The concluding couplet forces the two refrains together: "Her dimmer copy runs on in my storm, / She wasn't bone, but how the light was drawn." This juxtaposes the comfort of presence ("runs on") with the stark reality of loss and degradation ("dimmer," "storm" vs. the ethereal "light was drawn"). It *is* her pattern, and it *isn't* her presence.
  *   **Accessibility:** The core experience of grief, phantom presence, and internalized habits is central. Hofstadter's specific theory is conveyed through the refrains' *implications* ("light was drawn" implying pattern, "dimmer copy" implying replication/degradation, "strange loop" mentioned directly) without needing prior knowledge. "Self-made knot" also subtly hints at self-reference.
  *   **Emotion:** Blends the awful ("faulty mirror," "bittersweet," "storm," "tangled, incomplete") with the comforting ("runs on," the persistence of the pattern) as requested. The final couplet encapsulates that bittersweet tension.
  *   **Imagery:** Light, reflections, echoes, code ("runs on"), knots, storms, and physical absence ("bone," "phantom taste," "shuffle down the street") build the world of the poem.
