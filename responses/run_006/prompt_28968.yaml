  Then there's the question about what specifically triggers this obligation: persecution, fear of harm, crossing a border? Dummett focuses on persecution as the defining feature because it's an injustice that states have a duty not to perpetuate. Crossing a border alone isn't sufficient; it's the reason for fleeing that matters. 

  Next, the user asks about people fleeing poverty, lawlessness, or environmental disasters. Dummett would categorize them under ordinary migrants, so states have discretion. But this raises a tension because extreme poverty could be seen as a severe harm. The user might be hinting at a critique here—does Dummett's framework address structural injustices? 

  I should also consider the user's deeper needs. They might be looking for a critical analysis of Dummett's theory, especially its limitations regarding non-persecution-based migration. The mention of "pressure points" suggests they want to understand where the theory might be problematic, like its reliance on persecution as the sole trigger for obligations. 

