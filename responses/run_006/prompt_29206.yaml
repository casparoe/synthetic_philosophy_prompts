answer: |-
  ### Classroom Game: The Platonia Dilemma Challenge

  **Core Philosophy**: Create an experiential introduction to the Platonia Dilemma, emphasizing the limitations of causal decision theory (CDT) and the potential (but contested) role of superrationality. Students confront coordination failures, Schelling points, and Hofstadter's symmetry-breaking proposal.

  ---

  ### 1. Rules, Materials, and Payoff Scheme
  - **Participants**: 12 graduate students.  
  - **Materials**:  
    - 12 identical envelopes (one per student) containing:  
      - 5 blank slips of paper (one per round).  
      - A token board (to track points).  
    - A sealed "prize box" with 12 trivial prizes (e.g., artisanal chocolates, novelty pens).  
    - A submission box for anonymous slip collection.  
  - **Payoff**:  
    - **Token system**: Winning a round = 1 token. Tokens are exchanged post-game for prizes (e.g., 1 token = 1 chocolate; 3 tokens = premium pen).  
    - **No real stakes**: Prizes are symbolic to incentivize engagement without pressure.  
  - **Rules**:  
    - Each round, students privately write "CLAIM" or "NOT" on their slip and submit anonymously.  
    - **Win condition**: Exactly one "CLAIM" slip → winner gets 1 token.  
    - **Loss condition**: 0 or ≥2 "CLAIM" slips → no winner.  
    - **No communication**: Strict ban on talking, eye contact, or signaling.  
    - **Common knowledge**: All rules and group rationality are announced upfront.  

  ---

  ### 2. Round Structure & Announcements  
  Design: 5 rounds escalating from naive play to superrationality. *Withhold theoretical terms (e.g., "Schelling point") until debrief*.  

  - **Round 1 (Baseline: CDT Failure)**  
    - **Announce**: *"Decide independently: CLAIM or NOT. If exactly one CLAIM, they win. Else, no win. You cannot communicate."*  
    - **Withhold**: No additional hints. Goal is to observe chaotic outcomes (likely 0 or multiple claims).  

  - **Round 2 (Repeated Baseline)**  
    - **Announce**: *"Same rules. You may adjust based on last round."*  
    - **Goal**: Tests if students spontaneously converge (unlikely).  

  - **Round 3 (Schelling Point: Arbitrary Tiebreaker)**  
    - **Announce**: *"New rule: The person whose first name comes FIRST alphabetically (A=1st, Z=last) should CLAIM. Others should NOT. If multiple names tie, use last name (e.g., Alice Adams > Alice Zhang)."*  
    - **Withhold**: Do not specify who this is (students compute independently).  
    - **Goal**: Demonstrates coordination via focal points.  

  - **Round 4 (Superrationality Attempt)**  
    - **Announce**: *"Back to original rules—no tiebreakers. But first, discuss: What policy would you want everyone to follow? Talk for 5 minutes, then decide privately."*  
    - **Discussion prompt**: *"What single rule could all rational people adopt to ensure one winner?"*  
    - **Withhold**: Do not endorse any policy. Observe if they devise symmetry-breaking (e.g., "tallest person claims").  

  - **Round 5 (Pure Superrationality)**  
    - **Announce**: *"No discussion. No tiebreakers. Decide independently: What would a rational agent do, knowing all others are rational and reasoning identically?"*  
    - **Goal**: Tests if Hofstadter-style superrationality (policy-focused reasoning) succeeds without communication.  

  ---

  ### 3. Debrief: Mapping Outcomes to Theory  
  *After the game, project results and discuss:*  

  | **Round** | **Typical Outcome** | **Theoretical Lesson** |  
  |-----------|---------------------|------------------------|  
  | 1–2       | 0 or ≥2 claims; no winner | **Settled**: CDT fails—no unique equilibrium. Symmetric reasoning causes mutual prediction loops ("If I claim, others won’t? But they think that too!"). |  
  | 3         | 1 winner (usually the "A-name") | **Settled**: Schelling points work. Arbitrary conventions (e.g., alphabetical order) resolve coordination by creating focal points. Not rationality alone—salience matters. |  
  | 4         | 1 winner (if policy agreed) or failure | **Contested**: Success supports Hofstadter—shared policies ("team reasoning") can coordinate. Failure shows superrationality may need external anchors (e.g., precedent from Round 3). |  
  | 5         | Unpredictable (often failure) | **Contested**: Pure superrationality struggles without conventions. Highlights debate: Is "what policy should we all adopt?" a valid move, or does it smuggles in realism about others' actions? |  

  **Key Theoretical Distinctions**:  
  - **Settled**: CDT cannot solve Platonia alone (evident in Rounds 1–2).  
  - **Settled**: Schelling points enable coordination (Round 3).  
  - **Contested**:  
    - Whether superrationality (Rounds 4–5) is *rational* or *ad hoc* (e.g., is it rational to assume others adopt the same policy?).  
    - Whether the policy shift ("I → we") requires abandoning CDT for alternative frameworks (e.g., evidential decision theory or team reasoning).  
  - **Activity Bias**: The setup follows Hofstadter’s *symmetry assumption* (all agents are identical). Critics (e.g., Binmore) argue real agents aren’t perfectly symmetric—coordination then *requires* focal points.  

  ---

  ### 4. Predictable Problems & Solutions  
  - **Covert Signaling**:  
    - *Risk*: Students wink, cough, or choose slips slowly to signal intent.  
    - *Solution*: Enforce "eyes down" during submissions; use a room divider for privacy; discard slips if signaling suspected.  

  - **Unintended Conventions**:  
    - *Risk*: Group converges on rogue Schelling points (e.g., "oldest claims") in Round 4/5.  
    - *Solution*: Celebrate this! It shows focal points emerge naturally. Debate: Is this superrationality or just Schelling again?  

  - **Feeling Random**:  
    - *Risk*: Students see it as a lottery, not reasoning.  
    - *Solution*: In debrief, contrast Round 1 (chaotic) with Round 3 (ordered). Have students share reasoning: *"In Round 5, why did you claim?"*  

  - **Tiebreaker Confusion (Round 3)**:  
    - *Risk*: Multiple "A-names" cause ties.  
    - *Solution*: Pre-game, assign each student a unique number (1–12); use "lowest number claims" as the tiebreaker. Avoid revealing numbers publicly.  

  ---

  ### 5. Contested vs. Settled: Honest Notes  
  - **Settled Consensus**:  
    - CDT *cannot* resolve the Platonia Dilemma (Rounds 1–2 confirm this).  
    - Schelling points *can* solve it by adding salience (Round 3).  
  - **Contested Terrain**:  
    - **Superrationality’s validity**: Hofstadter claims it is rational to assume identical agents adopt identical policies. Critics (e.g., game theorists) argue this is circular—it assumes coordination to achieve coordination.  
    - **The "policy shift"**: Is moving from "what should I do?" to "what should we all do?" justified? Defenders say yes (rationality requires symmetry). Skeptics say no (CDT lacks machinery for joint intentions).  
    - **Activity Design**: This game assumes Hofstadter’s symmetry premise. To test alternatives (e.g., asymmetric rationality), you’d need skewed payoffs or roles—but that’s a different dilemma.  

  **Final Tip**: Frame debrief as *exploration*, not advocacy. Say: *"Today, we saw coordination fail, succeed with conventions, and stumble without them. Whether ‘superrationality’ explains the last step is hotly debated—let’s dig into that next week!"*
