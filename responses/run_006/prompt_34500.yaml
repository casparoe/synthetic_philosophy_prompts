prompt: |-
  I teach a graduate seminar in the philosophy of medicine, and one of my colleagues — a philosopher of biology with unusually systematic views about disease concepts — has been serving as an outside discussant. Over the semester, she has offered crisp, unhesitating verdicts on a series of cases we have put to her, always with the same instruction: "Is this a disease? Answer yes or no, and set aside questions about whether it is a disability, an injury, a risk factor, or a syndrome — just disease, strictly speaking." Here are the cases and her answers:

  1. Bacterial pneumonia in an otherwise healthy thirty-year-old: disease.
  2. Pregnancy in a healthy woman: not a disease.
  3. Adult-type lactose intolerance in a population where only 10% of adults retain lactase production: disease.
  4. Adult-type lactose intolerance in a population where 90% of adults are lactase non-persistent: not a disease.
  5. ADHD in a nine-year-old boy who is failing third grade: disease.
  6. Presbycusis (gradual, bilateral age-related hearing loss) in a seventy-year-old: not a disease.
  7. Fibromyalgia (chronic widespread pain, fatigue, and cognitive difficulties with no identifiable peripheral tissue damage): disease.
  8. Exclusive same-sex attraction in an adult who is entirely comfortable with it: not a disease.

  Next week we are adding a ninth case: congenital anosmia — being born without a sense of smell — in a forty-year-old who reports no distress about it, has adapted fully, and does not regard it as an impairment. I want to predict her verdict before she gives it. I am less interested in the bare yes or no than in the rule or principle she appears to be applying across these eight cases, which other rules fit her verdicts equally well, and which of those rules would yield different answers on the anosmia case. If you can identify a further case — ideally one we could present to her in the final session — that would cleanly discriminate between the remaining candidate rules, I would be especially grateful.
reasoning: |-
  Okay, let me approach this systematically. The user teaches a philosophy of medicine seminar and wants to understand the underlying principle behind their colleague's disease classifications. The colleague has given clear yes/no verdicts on eight cases, and now they're adding congenital anosmia as a ninth case. The user wants to predict the verdict and identify the governing rule.

  First, I need to analyze the pattern across the existing cases. The key cases that stand out are lactose intolerance (cases 3 and 4) and presbycusis (case 6). In lactose intolerance, the verdict changes based on population prevalence - it's considered a disease when rare (10% non-persistent) but not when common (90%). Presbycusis in a 70-year-old isn't a disease despite being an impairment, likely because it's age-expected. 

  ADHD (case 5) and fibromyalgia (case 7) are both classified as diseases despite lacking clear biological markers, suggesting the colleague isn't strictly using a biological dysfunction criterion. Meanwhile, pregnancy (case 2) and same-sex attraction (case 8) aren't diseases even though they involve physiological changes, because they're either species-typical or not inherently harmful.

  The anosmia case presents an interesting test: it's congenital (present from birth), non-progressive, and causes no distress. If the colleague's principle is based on deviation from species-typical function, anosmia should be a disease. But if it's about whether the condition is statistically expected for that age/life stage, it might not be, since it's lifelong and stable. 

  I think the strongest candidate principle is: "A condition is a disease only if it represents a statistically atypical functional deviation from the species norm for that life stage, with an implicit harm criterion." This explains why age-related hearing loss isn't a disease (expected at 70) while ADHD is (atypical for childhood). For anosmia, since smell is a basic human sense and its absence isn't age-expected, I predict she'll call it a disease.

  To test this against alternative rules, we could propose a case of childhood myopia where 80% of a population develops it by age 10 due to environmental factors. If she calls it a disease, she's using the harm criterion; if not, she's weighting statistical typicality more heavily. That would help distinguish between the candidate principles.
answer: |-
  Based on the pattern of verdicts, your colleague appears to be applying a **biostatistical theory of disease (BST) grounded in evolutionary function and statistical typicality**, with a critical refinement concerning **life-stage appropriateness**. Here's the breakdown:

  ### Core Principle:
  **"A condition is a disease iff it involves a statistically *subnormal* deviation from the species-typical functional organization *at a given life stage*, reducing an individual's ability to perform evolutionarily selected functions (without requiring distress or harm in a social sense)."**

  ### Analysis of Verdicts:
  1. **Pneumonia**: Yes → *Pathological dysfunction (bacterial invasion), subnormal function, atypical at any age.*  
  2. **Pregnancy**: No → *Species-typical physiological state, not a deviation.*  
  3. **Lactose intolerance (10% prevalence)**: Yes → *Subnormal digestive function (deviation from species-typical lactase persistence), statistically atypical.*  
  4. **Lactose intolerance (90% prevalence)**: No → *Statistically typical for that population; not subnormal in context.*  
  5. **ADHD**: Yes → *Subnormal neurocognitive function (impulse control/attention), atypical for life stage.*  
  6. **Presbycusis**: No → *Statistically typical age-related change, not subnormal for life stage.*  
  7. **Fibromyalgia**: Yes → *Subnormal pain/sensory processing (functional deviation), atypical at any age.*  
  8. **Same-sex attraction**: No → *No functional deficit; within range of evolutionarily stable variation.*  

  ### Prediction for Congenital Anosmia:
  **Verdict: DISEASE**  
  - **Why**: Congenital anosmia is a *subnormal deviation* from the species-typical sensory architecture (olfaction is an evolutionarily selected function). Its lifelong presence doesn't make it "typical" for any life stage (unlike presbycusis at 70). Adaptation/lack of distress is irrelevant under BST.

  ---

  ### Alternative Rules & Fit:
  1. **Pure Harm Theory (e.g., Wakefield's Harmful Dysfunction)**  
     - *Fits*: All "yes" cases involve harm (even fibromyalgia causes pain).  
     - *Fails*: Lactose intolerance in 90% prevalence (no harm if dairy avoidable) would still be "disease" under BST but colleague says "no."  

  2. **Statistical Typicality Alone**  
     - *Fits*: Lactose intolerance cases, presbycusis.  
     - *Fails*: Fibromyalgia (statistically rare) should be "disease" (fits), but same-sex attraction (statistical minority) is "no disease" (fits only if combined with functional deficit).  

  3. **Distress/Disability Requirement**  
     - *Fails*: Fibromyalgia (distress implied) fits, but anosmia without distress would be "no" — conflict with predicted "yes." ADHD in a high-support environment might not cause distress.  

  4. **Biological Dysfunction (Normativist-Free)**  
     - *Fits*: Pneumonia, fibromyalgia (organic dysfunction inferred).  
     - *Fails*: Lactose intolerance in 90% prevalence (organic dysfunction present) should be "disease" — but colleague says "no."  

  ---

  ### Discriminating Test Case: **Severe Childhood Myopia in a Digitally Immersive Society**
  - **Scenario**: In a population where 80% of children develop severe myopia by age 10 due to near-work/screen exposure, a child has uncorrected 20/200 vision.  
  - **BST Prediction (Colleague's Likely Verdict)**: **NOT A DISEASE**  
    - Statistically typical for life stage/population; vision correctable (no functional deficit with glasses).  
  - **Alternative Rule (Pure Dysfunction)**: **DISEASE**  
    - Clear biological dysfunction (abnormal eye development).  
  - **Why it Discriminates**:  
    - Challenges statistical typicality vs. biological dysfunction. Colleague's lactose intolerance verdicts suggest she prioritizes population statistics. If she calls this "no disease," it confirms BST. If "yes," she leans toward organic dysfunction.  

  ### Key Insight:
  Your colleague's framework is **descriptivist** (grounded in evolutionary biology) but **relativized to populations and life stages**. This avoids pathologizing normal aging (presbycusis) or majority traits (lactose intolerance), while labeling minority biological deviations as disease regardless of coping (anosmia, ADHD). The anosmia verdict will confirm whether "congenital but non-progressive" conditions are exempt from life-stage typicality—likely not.
