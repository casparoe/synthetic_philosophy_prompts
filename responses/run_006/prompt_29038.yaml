  For the final I want one essay question that makes them confront whether the hyperbolic discounting framework and the philosophical akrasia literature are even talking about the same thing. Not just "compare and contrast" — I want them to take a position on whether one can explain the other, and if so at what cost. I don't want separate summaries of Davidson and Ainslie with a paragraph stitched between them.

