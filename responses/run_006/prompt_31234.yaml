prompt: |-
  For most of my career I worked as an experimental physicist, and I have only lately begun to read philosophy of science in a systematic way. Lakatos's account of research programmes has been on my desk, and it has made me want to get clear about something I repeatedly observed in the working life of my field but never articulated.

  The practice I have in mind, described as neutrally as I can, is this. When a mature experimental field obtains a result that conflicts with a well-established central theory, the community's first response is almost never to treat the central theory as falsified. The standard sequence is to question the experiment, then the analysis, then the auxiliary assumptions: calibration, background conditions, detector models, assumptions about the sample. Only after many independent failures does the central theory itself become a live target. So far this looks like Lakatos's protective belt. But the practice has two further features. First, the field does not allow just any auxiliary adjustment: an adjustment is taken seriously only if it is itself testable and eventually leads to new successful predictions, and ad hoc patches that merely neutralize the anomaly are treated as a mark of decline. Second, in my experience, funding panels and hiring committees often reward proposals that challenge the central theory once a programme has stagnated, even when no single anomaly has been decisive.

  What theory of theory appraisal does this ensemble of practices presuppose? Reconstruct the implicit theory as precisely as you can, and say which parts of it are strictly required by the practice and which parts are merely compatible with it. In particular, does the practice really presuppose something like Lakatos's distinction between a hard core and a protective belt, together with his criterion of progressive versus degenerating problemshifts? Or is the same behaviour equally licensed by a Bayesian view in which the core simply carries a very high prior, or by a Popperian view in which the core is a conjecture tested only at the level of the whole programme? Where is the practice philosophically underdetermined, so that several rival theories would produce the same behaviour? And is the ensemble internally consistent? Finally, tell me what would have to change in the day-to-day norms of a field — in peer review, in the treatment of anomalies, in funding decisions — if the presupposed view were replaced by a straightforward falsificationism on which every failed prediction counts directly against the core.
reasoning: |-
  Okay, the user is an experimental physicist who has recently started diving into philosophy of science, specifically Lakatos. They've observed a pattern in their field: when an experiment contradicts a central theory, the first reaction isn't to discard the theory but to scrutinize everything else—experimental setup, analysis, auxiliary assumptions—before questioning the core theory. This aligns with Lakatos's protective belt idea, but the user notes two more aspects: adjustments must lead to new predictions (not just ad hoc fixes), and funding/hiring bodies encourage challenging the core theory when progress stalls, even without a single decisive anomaly.

  The user wants to know what theory of theory appraisal underlies these practices. They ask if it strictly requires Lakatos's framework (hard core, protective belt, progressive/degenerating shifts) or if alternatives like Bayesianism or Popperianism could explain it. They also wonder where the practice is underdetermined—meaning multiple theories could produce the same behavior—and if the practices are internally consistent. Finally, they ask how day-to-day norms would change under straightforward falsificationism.

  First, I need to reconstruct the implicit theory from the described practices. The core features are: protecting the central theory initially, requiring auxiliary adjustments to be testable and predictive (not ad hoc), and incentivizing challenges to the core when stagnation occurs. This seems like a blend of Lakatos with pragmatic elements. 

  Lakatos is a strong fit because of the hard core/protective belt structure and the emphasis on progressive vs. degenerating shifts. The requirement that adjustments must yield new predictions directly mirrors Lakatos's criterion for a progressive problemshift. The funding/hiring aspect aligns with his view that degenerating programmes should be replaced, even without "falsification." 

  But could Bayesianism explain this? In a Bayesian view, the central theory has a very high prior due to its past success. Anomalies would first lower the probability of auxiliaries (calibration, etc.), and only after repeated failures affect the core. The requirement for testable adjustments could be seen as demanding high likelihood ratios for new hypotheses. However, Bayesianism doesn't inherently explain the community's active reward for challenging the core during stagnation—it's more passive. Popperian holism (testing the whole programme) also fits the initial protection but doesn't account for the structured evaluation of auxiliaries or the progressive/degenerating distinction.

  The practice is underdetermined in some areas. For example, the initial protective behavior is common to Lakatos, Bayesianism, and Popper. The aversion to ad hoc fixes is shared by Lakatos and Popper (and even Bayesians if ad hoc means low prior or likelihood). But the proactive shift in funding during stagnation is uniquely Lakatosian. The internal consistency seems solid: protecting the core avoids premature rejection, while requiring progress prevents stagnation, and incentivizing challenges renews the field.

  If replaced by straightforward falsificationism, norms would change drastically: anomalies would directly target the core theory, leading to faster rejection. Peer review would focus less on experimental checks and more on core implications. Funding might prioritize testing theories over developing auxiliaries, possibly causing instability in established fields. This could be disruptive, especially in mature fields like physics where theories are deeply entrenched.

  The user might also be seeking validation of their lived experience through philosophical frameworks. Their deeper need could be understanding how philosophy systematizes their observations, or perhaps evaluating if their field's practices are justified. They might also want arguments to advocate for certain approaches in their community.
answer: |-
  Your observations capture a sophisticated, community-level theory-appraisal practice that blends elements from multiple philosophical frameworks. Here's a reconstruction of the implicit theory, its alignment with major philosophies, and the consequences of adopting strict falsificationism:

  ### Reconstructed Implicit Theory of Appraisal
  1. **Hierarchical Protection**:  
     Central theories (CT) are shielded by auxiliary assumptions (AA) and methodological norms. Anomalies must first exhaustively challenge AA (calibration, models, conditions) before CT is questioned.  
     - *Required by practice*: Yes—this sequence is non-negotiable in mature fields.  

  2. **Non-Ad Hoc Adjustment**:  
     Modifications to AA must:  
     (a) Be empirically testable independently,  
     (b) Generate novel predictions (not merely resolve the anomaly).  
     - *Required by practice*: Yes—ad hoc patches are explicitly rejected as degenerative.  

  3. **Stagnation-Triggered Criticism**:  
     CT becomes a legitimate target when:  
     (a) Multiple independent anomalies persist despite AA adjustments,  
     (b) The research programme shows diminishing returns (no new predictions, excessive patchwork).  
     - *Required by practice*: Yes—funding/hiring incentives institutionalize this shift.  

  4. **Holistic Viability**:  
     CT is evaluated not by single experiments but by the programme’s trajectory: its capacity to explain *and predict*, while expanding domains.  
     - *Required by practice*: Yes—no "decisive anomaly" is needed to justify challenges.  

  ---

  ### Compatibility with Philosophical Frameworks
  | **Practice Element**       | **Lakatos**                     | **Bayesian**                          | **Popperian Holism**             |  
  |----------------------------|--------------------------------|---------------------------------------|----------------------------------|  
  | Hierarchical Protection    | Hard core + protective belt    | High prior on CT                      | Conjectures tested en bloc       |  
  | Non-Ad Hoc Adjustment      | Progressive problemshift       | High-likelihood novel predictions     | Rejects immunizing stratagems    |  
  | Stagnation-Triggered Shift | Degenerating problemshift      | Low posterior despite AA updates      | Programmatic falsification       |  
  | Holistic Viability         | Programme progressiveness      | Model coherence + predictive success  | Severe tests of whole framework  |  

  **Where Practice is Underdetermined**:  
  - The *initial protection* of CT is compatible with all three frameworks.  
  - The *rejection of ad hoc patches* aligns with Lakatos and Popper (both oppose "conventionalist stratagems"), and Bayesians can model it via low priors for untestable adjustments.  
  - **Key divergence**: The *stagnation-triggered shift* is uniquely Lakatosian. Bayesians focus on probability updates (no inherent "stagnation" concept), while Popperians wait for a decisive falsification.  

  **Internal Consistency**:  
  The ensemble is **consistent** because:  
  - Protection preserves CT’s explanatory power during normal science.  
  - Anti-ad hoc rules prevent degeneration.  
  - Stagnation triggers ensure CT isn’t protected indefinitely.  
  *Tension*: Funding panels rewarding CT challenges *before* decisive anomalies might seem premature for Popperians, but it aligns with Lakatos’s emphasis on programme vitality over isolated falsifications.  

  ---

  ### Consequences of Adopting Straightforward Falsificationism
  If your field replaced its implicit view with **naive falsificationism** (every anomaly directly falsifies CT), day-to-day norms would shift radically:  

  1. **Peer Review**:  
     - Anomalous results would immediately challenge CT, bypassing scrutiny of AA.  
     - Papers claiming "falsification" from single experiments would proliferate, risking premature CT rejection.  

  2. **Treatment of Anomalies**:  
     - Less investment in replicating experiments or refining AA (e.g., detector models).  
     - Rapid proliferation of rival CTs for every anomaly, fragmenting consensus.  

  3. **Funding Decisions**:  
     - Proposals to test AA (calibration, background models) would be deprioritized.  
     - Funding would favor "high-risk" CT-overthrow projects over incremental programme development.  

  4. **Field Stability**:  
     - Mature fields (e.g., particle physics) would destabilize, as entrenched theories (e.g., Standard Model) face constant "falsification" from minor anomalies.  
     - Long-term research programmes would struggle to form, as CTs are abandoned too quickly.  

  **Example**: Under falsificationism, the 2011 OPERA experiment's "faster-than-light neutrino" result would have immediately threatened relativity, rather than triggering a successful search for a loose fiber-optic cable (an AA fix).  

  ---

  ### Conclusion
  Your field’s practice **presupposes a Lakatosian core** but incorporates pragmatic elements:  
  - **Strictly Lakatosian**: Progressive/degenerating problemshifts define when CT becomes a target.  
  - **Compatible additions**: Bayesian priors justify initial CT protection; Popperian severity informs AA testing.  
  - **Underdetermined**: Initial anomaly response is explainable by all three, but the *stagnation response* is distinctly Lakatosian.  

  The practice is philosophically sophisticated, balancing theory preservation with progress—unlike falsificationism, which would prioritize revolutionary upheaval over cumulative refinement. This reflects science as a self-correcting, communal enterprise rather than a series of decisive confrontations.
