answer: |-
  ### Assignment of Credence: Objective Interpersonal Comparisons of Well-Being

  **Precise Proposition:**  
  *It is determinately true or false (independently of any convention for measurement, aggregation, or policy) that a change affecting person A improves A’s well-being by a greater magnitude than a change affecting person B improves or worsens B’s well-being.*

  **Interpretation of Well-Being:**  
  I use two interpretations:  
  1. **Hedonic well-being**: Well-being is constituted by conscious experiences (e.g., pleasure/pain intensity, life satisfaction).  
  2. **Preference-satisfaction well-being**: Well-being is the satisfaction of informed, rational preferences.  

  **Final Credences:**  
  - **Hedonic interpretation**: 2%  
  - **Preference-satisfaction interpretation**: 0.5%  
  *I will use the hedonic interpretation for the rest of the answer, as it is more amenable to cardinal comparisons.*  

  ---

  ### Decomposition into Sub-Questions  
  I decompose the main proposition into six sub-questions (five required, one added for metaphysical coherence). Each sub-question must hold for the proposition to be true.  

  1. **Cardinal Intrapersonal Comparisons Supported**  
     *Does the correct theory of well-being allow for cardinal (quantitative) comparisons of well-being changes within a single person?*  
     - **Probability**: 80% (hedonic), 55% (preference-satisfaction)  
     - **Justification**: Hedonic views (e.g., classical utilitarianism) inherently support cardinality via intensity of experience. Preference views require cardinalization (e.g., von Neumann-Morgenstern utilities), which is contested.  
     - **Bearing**: Essential foundation. If false, interpersonal comparisons collapse.  

  2. **Non-Arbitrary Intrapersonal Units**  
     *Even if cardinal, can units of well-being change (e.g., "utils") be defined non-arbitrarily?*  
     - **Probability**: 60% (hedonic), 40% (preference-satisfaction)  
     - **Justification**: Neuroscience suggests hedonic states might have ratio-scale properties (e.g., pain thresholds). Preferences rely on behavioral choices, which may not reveal true intensity.  
     - **Bearing**: Arbitrary units undermine objectivity; comparisons become conventional.  

  3. **Non-Arbitrary Interpersonal Scaling**  
     *Can a common zero point (e.g., neutral well-being) and unit scale (e.g., "one util = same welfare significance across persons") be grounded factually?*  
     - **Probability**: 20% (hedonic), 10% (preference-satisfaction)  
     - **Justification**: Zero might be anchored to minimal consciousness (hedonic), but scaling units requires universal properties (e.g., neural correlates of welfare) that remain speculative. Preference views lack cross-person anchors.  
     - **Bearing**: The core hurdle. Without this, interpersonal "magnitudes" are meaningless.  

  4. **Truth-Apt Descriptive Claims**  
     *Are interpersonal comparison claims factual descriptions, not expressions of approval/policy?*  
     - **Probability**: 85% (shared)  
     - **Justification**: If well-being facts exist (e.g., hedonic states), claims about them are truth-apt. Non-cognitivist critiques (e.g., Harsanyi) apply to aggregation, not metaphysics.  
     - **Bearing**: Distinguishes objectivity from usefulness. If false, no fact exists to know.  

  5. **Empirical Tracking of Facts**  
     *Do human judgments/empathy reliably track well-being facts (if they exist)?*  
     - **Probability**: 50% (hedonic), 30% (preference-satisfaction)  
     - **Justification**: Empathy correlates with neural/behavioral data (hedonic), but is noisy and biased. Preferences are inferred from choices, which are context-dependent.  
     - **Bearing**: Does not affect existence of facts but questions epistemic access.  

  6. **Metaphysical Coherence**  
     *Is well-being metaphysically "scalar" and comparable across persons?*  
     - **Probability**: 65% (hedonic), 45% (preference-satisfaction)  
     - **Justification**: Physicalism allows hedonic states to be measurable properties. Preference-based "utils" may lack mind-independent reality.  
     - **Bearing**: Addresses whether comparisons are possible in principle, not just practically.  

  ---

  ### Combining Sub-Questions  
  The proposition requires **all sub-questions to be true simultaneously**. I treat them as *independent* (though some dependencies exist; this is conservative). The combined credence is the product of probabilities:  

  **Hedonic interpretation**:  
  \[
  P(\text{Main}) = P_1 \times P_2 \times P_3 \times P_4 \times P_5 \times P_6 = 0.80 \times 0.60 \times 0.20 \times 0.85 \times 0.50 \times 0.65 \approx 0.021 = 2.1\%
  \]

  **Preference-satisfaction interpretation**:  
  \[
  0.55 \times 0.40 \times 0.10 \times 0.85 \times 0.30 \times 0.45 \approx 0.0025 = 0.25\%
  \]

  **Sensitivity Analysis**:  
  - **Most sensitive**: Interpersonal scaling (\(P_3\)). Doubling \(P_3\) (hedonic) to 40% raises final credence to 4.2%. Halving it to 10% lowers credence to 1.05%.  
  - **Least sensitive**: Truth-aptness (\(P_4\)). Varying \(P_4\) by ±20% changes the final credence by <0.5%.  
  - **Least confident sub-question**: Interpersonal scaling (\(P_3\)). I assign only 20% due to lack of empirical anchors.  

  **Evidence to Shift \(P_3\) (Interpersonal Scaling)**:  
  Strong evidence for universal neurocomputational correlates of welfare (e.g., pain intensity encoded identically in all brains) could raise \(P_3\) to 60%. For example, cross-species/cultural neural signatures of hedonic gain that map linearly to behavior. This would increase final credence to ~6.3% (hedonic).  

  ---

  ### Epistemic vs. Metaphysical Uncertainty  
  - **Metaphysical uncertainty (doubt about facts existing)**: 70% of hesitation.  
    - Rooted in \(P_3\) (scaling) and \(P_6\) (coherence). Questions whether well-being magnitudes *can* share a universal scale.  
  - **Epistemic uncertainty (doubt about knowing facts)**: 30% of hesitation.  
    - Rooted in \(P_5\) (tracking) and \(P_2\) (non-arbitrary units). Concerns measurement limitations even if facts exist.  

  **Conclusion**:  
  My credence in objective interpersonal comparisons is very low (2%), primarily due to the near-intractability of non-arbitrary interpersonal scaling. This reflects *metaphysical* skepticism: even if intrapersonal comparisons are robust, extending them across persons may require conventions. The preference-satisfaction view fares worse due to its reliance on behavior.
