prompt: |-
  Okay, I'm teaching a grad seminar on vagueness next semester and I want to get my head straight about what the theories are even supposed to do before I assign the readings. So heres what I need:

  You're an expert in philosophy of language and philosophical logic. Think carefully and then write me the desiderata: what any adequate theory of vagueness has to get right. I don't mean "solve the sorites" as a single bullet — I want the full breakdown of what that actually demands. What phenomena does a theory need to explain? What cases does it need to get right? What distinctions can't it collapse? For each requirement, give me the case or consideration that motivates it.

  Then flag which of these are non-negotiable (any theory that fails them is dead) and which are more like preferences of particular camps. If you think some subset of the desiderata can't be jointly satisfied — like, if getting requirement A forces you to fail requirement B — point that out. That's the part I most want to see.

  Also, which single requirement knocks out the most candidate theories? And briefly: how do the main approaches (supervaluationism, epistemicism, degree/fuzzy theories, contextualism) do against the list? Just a sentence or two each.

  Keep the whole thing to 800 words max. I want it tight.
reasoning: |-
  Okay, let me approach this systematically. The user is teaching a graduate seminar on vagueness and needs a clear breakdown of theoretical desiderata before assigning readings. This requires distilling complex philosophical debates into essential criteria while highlighting tensions between them.

  First, I consider the core challenges of vagueness. The Sorites Paradox is the obvious starting point, but unpacking it reveals multiple layers: borderline cases, tolerance principles, and the sharp boundaries problem. Each demands separate treatment in the desiderata list. 

  For borderline cases, Jackson's "clearly tall" vs "clearly not tall" example comes to mind as the classic illustration. Any theory must account for why we hesitate with borderline instances while maintaining classical logic where possible. The tolerance principle then connects directly to the Sorites - we need to explain why small changes seem insignificant yet lead to absurd conclusions.

  The sharp boundaries problem feels particularly thorny. Wright's argument that vague predicates can't have precise cutoffs seems fundamental, yet epistemicism explicitly denies this. I should note this as a major fault line among theories. 

  Higher-order vagueness adds another dimension. If we define "borderline" precisely, don't we just push vagueness to the next level? This seems to challenge many approaches' internal coherence. 

  Practical reasoning considerations matter too - we use vague terms successfully daily, so theories shouldn't make ordinary judgments impossible. And semantic competence is key: how we learn and apply vague predicates must be explainable.

  Now for the non-negotiables. Borderline cases and the Sorites paradox seem indispensable - any theory ignoring them isn't addressing vagueness at all. Tolerance and sharp boundaries feel equally central. But higher-order vagueness? Some theories might reasonably set it aside, though doing so weakens them.

  The big tension jumps out: explaining tolerance without positing sharp boundaries. This is where most theories stumble. Supervaluationism avoids sharp cutoffs but struggles with truth-value gaps; epistemicism embraces sharp boundaries but makes them unknowable; fuzzy logic avoids jumps but introduces compositional issues.

  For knock-out punches, the sharp boundaries requirement eliminates many contenders. Only epistemicism openly accepts them, while others develop elaborate dodges. This seems like the biggest filter among theories.

  When running through approaches: Supervaluationism handles borderlines and Sorites well but stumbles on higher-order vagueness and truth-value gaps. Epistemicism is logically conservative but makes semantic competence mysterious. Fuzzy logic captures gradation naturally but faces explosive compositional challenges. Contextualism reflects usage shifts but struggles with single-case judgments.

  I'll structure this as: 1) Essential phenomena, 2) Key distinctions, 3) Practical constraints, then flag tensions and theory performances. The sharp boundaries paradox gets special emphasis as the major differentiator. Keeping under 800 words means sacrificing some examples but the core trade-offs must remain clear.
answer: |-
  Here are the core desiderata for any adequate theory of vagueness, categorized by phenomena and motivation, with critical tensions highlighted:

  ### Non-Negotiable Desiderata (Failure = Theory Dead)
  1.  **Borderline Cases:** Must explain the existence and nature of "borderline" instances (e.g., a patch *neither clearly red nor clearly not red*). *Motivation:* Central datum of vagueness; denial eliminates the phenomenon.
  2.  **The Sorites Paradox:** Must resolve or explain the paradox (a single grain doesn't make a heap, yet 100,000 grains do). *Motivation:* The core logical challenge; failing this renders the theory inert. Requires explaining why the Tolerance Principle (small changes preserve category membership) seems compelling yet leads to contradiction.
  3.  **No Sharp Boundaries Requirement:** Must avoid or explain away the counterintuitive existence of a precise cutoff (e.g., a specific hair whose removal makes someone bald). *Motivation:* Deep intuition; positing unknowable sharp boundaries (epistemicism) is often seen as a *response* to this requirement, not a denial. Theories *explicitly* positing knowable sharp boundaries fail.
  4.  **Classical Logic Preservation (in the clear):** Must respect classical truth values for uncontroversial cases (e.g., "1-grain pile is not a heap" is True, "Mountain is a heap" is True). *Motivation:* Semantic competence requires stable truth conditions for clear cases.

  ### Highly Desirable (Failure Severely Weakens Theory)
  5.  **Higher-Order Vagueness:** Must account for the vagueness of "borderline" itself (e.g., patches that are neither clearly red, nor clearly not red, nor clearly borderline). *Motivation:* Intuitive lack of sharp boundaries *between* clear cases, borderline cases, and clear non-cases.
  6.  **Penumbral Connection:** Must explain why certain combinations involving borderlines are clearly false (e.g., "Patch A is red and Patch B is not red, but B is redder than A" must be false, even if A/B are borderline). *Motivation:* Preserves intuitive logical relations between vague predicates.
  7.  **Semantic Competence:** Must explain how speakers learn, use, and communicate successfully with vague predicates despite the lack of precise definitions/boundaries. *Motivation:* Vague language is functional; theories shouldn't make this competence mysterious.
  8.  **Practical Reason Compatibility:** Must allow for rational decision-making and assertion involving vague claims. *Motivation:* We constantly make judgments and act based on vague predicates ("Is he tall enough for the ride?").

  ### Key Tensions & Trade-offs
  *   **The Central Tension:** Explaining **Tolerance (Sorites Premise)** without positing **Sharp Boundaries**. This is the heart of the problem. Most theories reject Tolerance to avoid contradiction but must explain why it *seems* true. Epistemicism bites the bullet on sharp boundaries.
  *   **Higher-Order Challenge:** Satisfying **No Sharp Boundaries** while fully accommodating **Higher-Order Vagueness** is extremely difficult. Many theories struggle to avoid simply pushing the sharp boundary up a level (e.g., a sharp boundary between clear cases and first-order borderlines).
  *   **Logic vs. Intuition:** Preserving full **Classical Logic** often conflicts with capturing the **No Sharp Boundaries** intuition and **Higher-Order Vagueness**. Non-classical logics (supervaluationism, fuzzy logic) sacrifice classical logic to avoid sharp boundaries.

  ### The Knock-Out King: No Sharp Boundaries
  This desiderata eliminates the widest swathe of intuitively plausible candidate theories. Naive classical theories with precise cutoffs fail outright. Epistemicism survives only by making the boundary radically unknowable, which many find deeply unsatisfactory. Supervaluationism and fuzzy logic are largely motivated by avoiding this requirement.

  ### Theory Performance Snapshot
  *   **Supervaluationism:** Excels at **Borderline Cases**, **No Sharp Boundaries**, **Penumbral Connection**, **Classical Logic (for clear cases)**. Struggles with **Higher-Order Vagueness**, truth-value gaps, and explaining **Tolerance**'s appeal. **Semantic Competence** is complex.
  *   **Epistemicism:** Preserves full **Classical Logic**, resolves **Sorites** (denies Tolerance), handles **Higher-Order Vagueness** easily. Fails the **No Sharp Boundaries** intuition for many, makes **Semantic Competence** deeply puzzling.
  *   **Degree Theories (Fuzzy Logic):** Naturally models **Borderline Cases** and gradation, avoids **Sharp Boundaries**, explains **Tolerance**'s appeal. Faces severe challenges with **Penumbral Connection** and compositional rules (**Sorites** often recurs as degrees change too slowly), and deviates significantly from **Classical Logic**.
  *   **Contextualism:** Explains **Tolerance** via shifting standards, aids **Semantic Competence/Practical Reason**. Often struggles with **Single-Case** judgments ("Is *this* heap?") and **Penumbral Connection**, and may not fully solve **No Sharp Boundaries/Higher-Order Vagueness** within a context.

  This framework should provide a solid foundation for evaluating the readings and theories in your seminar. The tensions, especially around sharp boundaries and tolerance, are crucial for driving discussion.
