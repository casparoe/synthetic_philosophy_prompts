  First, I need to recall the key debates in this literature. Dennett's "intuition pumps" criticism is the starting point, but there are more refined positions now. I should consider thinkers like Williamson, who defends thought experiments by linking them to ordinary counterfactual reasoning, and Cappelen, who rejects intuitions entirely. Then there are positions like Weinberg's on cultural variability and Knobe's affect-based accounts.

  The root question should be whether thought experiments provide genuine epistemic support. But branching shouldn't be binary. The first split could be about whether they can ever provide support. If yes, then under what conditions? If no, why not? 

  For the "yes" branch, sub-questions could include whether judgments are theory-laden and whether affective framing is distorting. For the "no" branch, sub-questions might address whether the problem is with intuition itself or its application. 

  Naming positions is crucial. Williamson's epistemic view, Weinberg's restrictionist stance, Knobe's affective bypass, and Cappelen's radical rejection are must-includes. Each leaf needs a test case application, like Mary's room or the trolley problem.

  I should also note empty branches. For example, someone might think judgments are theory-laden but affective framing isn't distorting. That's logically possible but unattractive, hence unexplored. Similarly, positions that deny any epistemic support but see the problem as application-specific might be incoherent.

  The meta-aspect is important too. The taxonomy itself argues that distinctions like theory-ladenness and affective framing matter. Highlighting unresolved splits, like between Weinberg and Knobe on the source of unreliability, shows where further questions are needed—maybe on the role of conceptual competence versus affective influence.

  Finally, keeping it to 6-10 leaves means balancing coverage without overcrowding. Testing each position against a concrete example ensures clarity for grad students. Flagging unexplored areas encourages further research, aligning with the workshop's pedagogical goals.
answer: |-
  Here’s a taxonomy structured as a branching tree, capturing nuanced positions on the epistemic status of thought experiments. The root question addresses **whether thought experiments *can* provide genuine epistemic support**, with subsequent branches isolating key fault lines in the literature. Positions are defined by their commitments to specific epistemic mechanisms or failure modes, not mere endorsement/rejection.

  ### Taxonomy of Positions on Thought Experiments
  **Root Question:** *Can thought experiments (TEs) ever provide non-trivial epistemic support for their conclusions?*  
  *(Non-trivial = support not reducible to pre-existing arguments/data)*

  1. **Branch 1: Do TEs derive support from *intuitions* (seemings) about hypothetical cases?**  
     - *No →* **Epistemic Deflationism** (e.g., Williamson 2007)  
       *TEs are disguised arguments/counterfactual reasoning; intuitions are incidental.*  
       **Branch 1.1: Can TEs still provide epistemic support via non-intuitive mechanisms?**  
         - *Yes →* **Competence-Based Rationalism** (Williamson)  
           *Commitment: Trolley switches are valid iff they track competent counterfactual judgment.*  
         - *No →* **Global Skepticism** (Unnamed)  
           *Commitment: All TEs are circular or question-begging (e.g., Zombies presuppose dualism).*  
     - *Yes →* **Intuitionist Views** → Proceed to Branch 2.  

  2. **Branch 2 (for Intuitionist Views): Are pre-theoretic intuitions *reliable* sources of evidence?**  
     - *No →* **Restrictionism** (e.g., Weinberg, Nichols & Stich 2001)  
       *Commitment: Mary’s Room fails; color knowledge intuitions vary culturally/are unreliable.*  
     - *Yes →* Proceed to Branch 3.  

  3. **Branch 3: Are TE intuitions *distorted* by non-epistemic factors?**  
     - *Yes →* **Proceed to Branch 3.1**  
     - *No →* **Rationalist Intuitionism** (e.g., Bealer 1998, Pust 2000)  
       *Commitment: Zombies are conceivable → metaphysically possible (Chalmers).*  

  4. **Branch 3.1: What is the primary distortion mechanism?**  
     - **Branch 3.1a: Is distortion caused by *affective framing*?**  
       *Yes →* **Affective Bypass Theory** (e.g., Knobe 2007, Greene 2008)  
         *Commitment: Trolley switch vs. footbridge intuitions track emotional salience, not moral principle.*  
       *No →* **Proceed to Branch 3.1b**  
     - **Branch 3.1b: Is distortion caused by *suppressed causal complexity*?**  
       *Yes →* **Causal Omission Skepticism** (e.g., Dennett 2013, Wilkes 1988)  
         *Commitment: Chinese Room ignores implementation/embodiment, underdetermining "understanding".*  
       *No →* **Proceed to Branch 3.1c**  
     - **Branch 3.1c: Is distortion caused by *tacit theoretical commitments*?**  
       *Yes →* **Theory-Ladenness View** (e.g., Sosa 2009, Cummins 1998)  
         *Commitment: Thomson's violinist smuggles contested premises about bodily autonomy.*  

  ---

  ### Leaf Positions Summary (8 positions)
  1. **Competence-Based Rationalism** (Williamson)  
     *Support? Yes, via counterfactual reasoning. Test case: Trolley problem intuitions reflect rational competence.*  
  2. **Global Skepticism** (Unnamed)  
     *Support? Never. Test case: Zombies assume conceivability→possibility gap; all TEs are circular.*  
  3. **Restrictionism** (Weinberg et al.)  
     *Support? Rarely/never (domain-specific). Test case: Mary’s Room intuitions are empirically unreliable.*  
  4. **Rationalist Intuitionism** (Bealer, Chalmers, Pust)  
     *Support? Yes, via rational intuition. Test case: Zombies establish hard problem of consciousness.*  
  5. **Affective Bypass Theory** (Knobe, Greene)  
     *Support? Only if affective bias is controlled. Test case: Footbridge trolley variant exploits disgust.*  
  6. **Causal Omission Skepticism** (Dennett, Wilkes)  
     *Support? Only with full causal detail. Test case: Chinese Room ignores causal role of syntax.*  
  7. **Theory-Ladenness View** (Sosa, Cummins)  
     *Support? Only when commitments are explicit. Test case: Violinist assumes controversial personhood theory.*  
  8. **Hybrid Distortion View** (Unnamed)  
     *Support? Only absent multiple distortions. Test case: Trolley problems combine affect + causal omission.*  

  ---

  ### Key Notes on the Taxonomy
  1. **Unresolved Splits** (positions not distinguished by current branches):  
     - **Restrictionism vs. Affective Bypass**: Both reject Mary’s Room, but for different reasons (cultural variability vs. affective framing).  
       *Prising Apart:* Does the unreliability stem from *cognitive architecture* (Affective Bypass) or *contingent variation* (Restrictionism)?  

  2. **Unoccupied Branches**:  
     - *"No" to Branch 3 (intuitions undistorted) but "No" to Branch 2 (intuitions unreliable)*: Logically possible (intuitions are reliable *and* distorted), but likely incoherent/unattractive.  
     - *"Yes" to Branch 1 (intuition-based) but "No" to Branch 3.1 (no distortion mechanism)*: Occupied by Rationalist Intuitionism. The reverse (non-intuition-based but distortion-focused) is incoherent.  

  3. **Meta-Argument Embedded**:  
     The tree prioritizes distinctions that diagnose *how* TEs succeed/fail (e.g., affective vs. causal vs. theoretical failure modes), not just *whether* they work. This reflects the methodological insight that critiques must target specific mechanisms.  

  4. **Test Cases**:  
     Each position’s commitments are crystallized by how it handles canonical examples, exposing its unique constraints on legitimate TE use.  

  ---

  ### Pedagogical Value
  This structure shows that the debate hinges on:  
  - The **role of intuitions** (incidental vs. essential)  
  - The **psychology of judgment** (affect, bias, competence)  
  - The **metaphysics of scenarios** (causal detail, conceivability)  
  - The **theory-dependence of evidence**  

  Graduate students can use this to:  
  1. Locate their own assumptions,  
  2. Identify dialectical opponents’ core commitments,  
  3. Design better TEs by avoiding flagged pitfalls.  

  Would you like expanded details on any leaf position, test case analyses, or adjustments to the branching logic?
