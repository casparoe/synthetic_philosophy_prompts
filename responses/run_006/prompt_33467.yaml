prompt: |-
  I've been thinking about a problem that came up during an argument with my partner a few weeks ago. We were discussing a friend of ours, Callum, who holds two political views that contradict each other in a way that takes about three or four steps of reasoning to uncover. My partner said Callum was being irrational, full stop. I pushed back, saying that if the contradiction requires real inferential work, failing to see it is a failure of cleverness or effort, not rationality. We got nowhere, and since then I've been collecting my verdicts on cases to see whether there's a principled line behind them.

  Here are the cases and my verdicts.

  1. **Simple modus ponens.** Alice knows that if it's raining, the picnic is cancelled. She looks out the window, sees it's raining, and goes back to reading. She hasn't yet concluded that the picnic is cancelled. She would assent if asked, but the thought hasn't crossed her mind. **Verdict:** she is being irrational. The failure is trivial, but it is a failure.

  2. **Long chain.** Ben knows P₁, and knows P₁→P₂, and knows P₂→P₃, and so on through P₁₉→P₂₀. He has never drawn the conclusion P₂₀. If you walked him through each step he would assent at every stage, but he has never assembled the chain himself. **Verdict:** not irrational. Twenty steps is too many to expect anyone to hold in mind.

  3. **Hidden contradiction (Callum's case).** Callum believes that the state should not interfere with private contracts between consenting adults. He also believes that employment contracts should be regulated to prevent exploitative wage arrangements. The contradiction only becomes visible after several inferential steps connecting the two commitments. **Verdict:** not irrational. The inconsistency is real but not accessible to casual reflection.

  4. **Obvious contradiction.** Diane says she believes all humans have equal moral worth, and also says she believes some people's lives simply matter more than others because of their contributions to society. When the contradiction is pointed out, she says she meant both statements literally and stands by both. **Verdict:** irrational. The inconsistency is right on the surface.

  5. **Probabilistic incoherence.** Evan assigns credence 0.7 to proposition A, 0.6 to proposition B, and 0.4 to the disjunction A∨B. He has never studied probability theory and has no idea these numbers are incoherent. The violation is not something he could detect without training. **Verdict:** I want to say he is being irrational, but I'm not confident. His credences are objectively incoherent — they violate the probability axioms — yet the incoherence is hidden from him.

  6. **Unproven theorem.** Fatima is a professional mathematician who knows the ZFC axioms. She has been trying to prove a certain open conjecture for years and hasn't succeeded. **Verdict:** not irrational. No one thinks mathematicians are irrational for failing to prove hard theorems.

  7. **Forgotten premise.** Greg knows that if the grant deadline is Friday, he needs to submit by Thursday night. He knows the deadline is Friday. On Wednesday, he acts as if he has plenty of time and makes no preparations. The conclusion simply hasn't occurred to him. **Verdict:** irrational. This is just the modus ponens case with a longer delay — the inference is immediate once attended to, and a rational person would have attended to it.

  The tension I can't resolve is between cases 3 and 5. In case 3, I excuse Callum because the contradiction takes work to uncover. But in case 5, Evan's incoherence also takes work to uncover — he would need training he doesn't have — and yet I still feel he's irrational. What distinguishes them? Is probability theory normatively special in a way that ordinary deductive logic is not? Is the difference that Evan's credences are his own mental states while Callum's contradiction is between external propositional commitments? Or am I simply wrong about one of the two verdicts?

  I'm looking for a principle — or a small set of candidate principles — that captures my verdicts as well as possible, explains what distinguishes the cases where logical ignorance is irrational from those where it isn't, and tells me which of my verdicts I should revise if they can't all be saved. Please state the principle precisely, show how it handles each of the seven cases, and apply it to a further case I haven't been able to settle: someone who believes the premises of a valid argument, can find no flaw in the reasoning, but rejects the conclusion because they distrust the arguer. Is that person rationally required to accept the conclusion, or does their distrust give them a rational excuse?
reasoning: |-
  Okay, the user presents a fascinating philosophical problem about rationality and logical ignorance. They've constructed seven detailed thought experiments with their own verdicts, and are struggling to reconcile their judgments on Case 3 (Callum's hidden contradiction) and Case 5 (Evan's probabilistic incoherence). 

  Hmm... the core tension is this: why do I excuse Callum for not spotting a multi-step contradiction, but feel Evan should be held responsible for probabilistic incoherence he can't detect? The user suspects probability might be "special" - that's an interesting angle. Or maybe it's about whether the inconsistency is in one's own mental states versus external propositions? 

  First, let's map what makes each case distinct. Alice's failure (Case 1) feels irrational because modus ponens is trivial - it's about attention, not ability. Ben's 20-step chain (Case 2) gets a pass because cognitive load matters. Diane (Case 4) is clearly irrational by defiantly embracing contradiction. Fatima (Case 6) isn't irrational for failing to prove a hard theorem - that's about limits, not flaws. Greg (Case 7) is like Alice but with memory lapse - still irrational because the inference is obvious once recalled.

  Now the puzzle pieces: Callum (Case 3) vs Evan (Case 5). The user's intuition treats probabilistic coherence as stricter than deductive consistency. Why? I think they're onto something with the "mental states" distinction. Evan's credences are direct representations of his own uncertainty - their incoherence means his very uncertainty-measuring tool is broken. Callum's beliefs might be stored separately without active contradiction until probed. 

  The principle I'll propose - "Accessible Rationality" - has two key moves: 
  First, distinguish between structural irrationality (like Evan's credences violating probability axioms) and performance errors (like Callum not connecting distant beliefs). Second, set the threshold at what's "reasonably accessible" given one's cognitive resources and knowledge. 

  For Evan: even without training, probability axioms govern rational uncertainty - so his incoherence is structural. For Callum: the contradiction requires substantive inference, not just unpacking commitments. That preserves the user's verdicts. 

  The new case about distrusting a valid argument is telling: under this principle, rejecting sound logic due to distrust is irrational because the validity is accessible upon inspection. The distrust might explain the error but doesn't excuse it rationally. 

  User seems philosophically sophisticated - they're not just seeking answers but testing principles. Might be a grad student or autodidact in epistemology. Their frustration with the Callum/Evan tension suggests they want a unified theory of rationality that handles both logic and uncertainty. 

  Final thought: they might resist letting probability off the hook. If pressed, I'd argue that probabilistic coherence is constitutive of rationality in a way that spotting remote contradictions isn't - but that's a bigger debate!
answer: |-
  You've identified a profound tension in theories of rationality. The distinction between cases 3 and 5 hinges on **whether the norm violated is constitutive of rationality itself** (making violation inherently irrational) or **a derivative norm requiring cognitive labor** (where failure may be excused). Here’s a principle that captures your verdicts:

  ### The Principle of Accessible Structural Rationality
  **An agent is irrational iff:**
  1. **Structural violation:** Their attitudes violate a *constitutive norm of rationality* (e.g., logical consistency, probabilistic coherence).
  2. **Cognitive accessibility:** The violation is *reasonably accessible* given their cognitive resources, knowledge, and context—requiring no novel inference, expertise, or effort beyond what can be expected of them.

  ---

  ### Application to Your Cases
  1. **Alice (Simple modus ponens):**  
     - *Violation:* Structural (logical inconsistency between beliefs).  
     - *Accessibility:* Trivial (immediate inference).  
     → **Verdict: Irrational** ✔️  

  2. **Ben (Long chain):**  
     - *Violation:* Structural (logical entailment not realized).  
     - *Accessibility:* Not reasonable (20 steps exceed working memory).  
     → **Verdict: Not irrational** ✔️  

  3. **Callum (Hidden contradiction):**  
     - *Violation:* Structural (inconsistent beliefs).  
     - *Accessibility:* Not reasonable (requires non-trivial inferential work).  
     → **Verdict: Not irrational** ✔️  

  4. **Diane (Obvious contradiction):**  
     - *Violation:* Structural (explicit contradiction).  
     - *Accessibility:* Trivial (immediately evident).  
     → **Verdict: Irrational** ✔️  

  5. **Evan (Probabilistic incoherence):**  
     - *Violation:* Structural (violates probability axioms—a *constitutive* norm for credences).  
     - *Accessibility:* Irrelevant here; probabilistic coherence is a *built-in requirement* for credences, not a derivative demand. Ignorance doesn’t excuse the structural flaw.  
     → **Verdict: Irrational** (revise your hesitation) ✏️  

  6. **Fatima (Unproven theorem):**  
     - *Violation:* None. Failing to prove a theorem isn’t a structural violation—rationality doesn’t require omniscience.  
     → **Verdict: Not irrational** ✔️  

  7. **Greg (Forgotten premise):**  
     - *Violation:* Structural (inconsistent beliefs/actions).  
     - *Accessibility:* Reasonable (recalling a known fact is expected).  
     → **Verdict: Irrational** ✔️  

  ---

  ### Why Cases 3 and 5 Diverge
  - **Callum (Case 3):** The contradiction requires *active inference* to uncover. His failure is a *performance error*, not a structural flaw in his belief system. Rationality doesn’t demand he perform all possible inferences.  
  - **Evan (Case 5):** Probabilistic coherence is a **constitutive norm** for credences. Like avoiding contradictions in beliefs, it’s a *defining feature* of rational credences. Violating it is irrational *even if unrecognized*—it’s akin to Diane holding explicit contradictions.  

  **Key Distinction:** Deductive consistency requires *not believing contradictions*, but not *discovering all implicit contradictions*. Probabilistic coherence is a *positive constraint* on the numerical relationships among credences—violations render the credences themselves defective, regardless of awareness.  

  ---

  ### Your Unsettled Case: Distrusting a Valid Argument  
  **Scenario:** Someone believes all premises of a valid argument, finds no flaw in the reasoning, but rejects the conclusion due to distrust of the arguer.  

  **Analysis using the principle:**  
  - **Structural violation:** They hold beliefs that logically entail the conclusion while denying it (inconsistency).  
  - **Accessibility:** The entailment is accessible—they acknowledge the reasoning is flawless. Distrust of the arguer doesn’t block access to logical implication.  
  → **Verdict: Irrational.**  
  - **Why?** Distrust might *explain* their error, but it doesn’t *excuse* it. Rationality requires aligning beliefs with accessible logical consequences. They should either:  
    - Accept the conclusion, or  
    - Revise their belief in the premises/reasoning (which they haven’t done).  

  ---

  ### Candidate Principles Refined
  1. **Constitutive Norms Principle:**  
     Rationality requires satisfying *constitutive norms* (e.g., consistency, probabilistic coherence) when violations are accessible. Probabilistic norms are constitutive for credences; discovering implicit contradictions is not.  
  2. **Cognitive Load Threshold:**  
     Failures due to complexity exceeding cognitive resources (e.g., 20-step chains, multi-step contradictions) are excusable; failures due to inattention or defiance (Alice, Diane, Greg) are not.  
  3. **Priority of Structural Defects:**  
     Violations of built-in standards (e.g., incoherent credences, explicit contradictions) are irrational *per se*; failures of inference are irrational only if the inference is trivial.  

  ### Verdicts to Revise
  - **Revise Case 5:** Evan *is* irrational—probabilistic incoherence is a structural defect.  
  - **All other verdicts** align with the principle.  

  This framework preserves your intuition that rationality is constrained by human limitations but holds agents accountable for accessible, fundamental norms. It also explains why probability *is* "special": it defines what credences *are*, whereas deductive logic governs relations between beliefs that need not all be inferred.
