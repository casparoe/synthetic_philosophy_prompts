prompt: |-
  so i just got back from a three-hour argument with my friend about risk-weighted expected utility, and now i want a third opinion before i decide how much to update. here's the question i actually want answered: what is your credence that buchak-style risk-weighted expected utility is the correct normative account of rational preference under uncertainty? and i mean normative — not whether people actually do it, but whether it's what a rational agent ought to do. i want a number, not "it depends on the formalism."

  please decompose the number for me. the moving parts i can see are at least these:

  (a) how likely is it that expected utility theory is just false as a normative theory — i.e. that at least some allais-type preferences are rationally permissible (or required), rather than mistakes to be corrected?

  (b) conditional on EU being false, how likely is it that the right repair is to transform probabilities with a risk function, so that risk aversion lives in the weighting of states, rather than to put the risk attitude in the utility function, or to move to something else entirely — ambiguity models, rank-dependent utility, regret theory, or just incomplete preferences?

  (c) how likely is it that REU actually survives dynamic choice — that it doesn't tell you to make plans you'd later abandon, or leave you open to dutch books or money pumps?

  (d) how much probability do you put on the thought that "the correct theory of rational preference" isn't determinate enough to have a truth value in the first place?

  give me a rough probability for each, how they combine, and which sub-question your final number is most sensitive to. if there's a big term i've left out, add it. and tell me what evidence would move each sub-question the most.

  for calibration: i came out of the argument at about 0.6, my friend at about 0.15. where do you think our disagreement actually lives — which sub-question is one of us mostly wrong about?

  and please, if the whole request is confused — if i'm conflatng decision-theoretic rationality with something else, or asking for a credence where there's no fact of the matter, or the descriptive/normative distinction i gestured at doesn't do the work i think it does — tell me that plainly instead of giving me a polite set of numbers.
