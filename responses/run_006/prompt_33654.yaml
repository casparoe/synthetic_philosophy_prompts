  The real trouble comes with Plato's claim that injustice corrupts the soul. Game theory has no equivalent for "soul corruption" as an intrinsic bad. Preferences are taken as given; it doesn't judge their formation. This exposes a fundamental gap: game theory describes behavior, while Plato prescribes character formation.

