  That smell motif is crucial - it's embodied, positional, and income-proof. The Parks' involuntary nose-wrinkling exposes how some disadvantages can't be bought away. And the moral ambiguity... the Kims aren't saints, the Parks aren't monsters. That disrupts simple victim-perpetrator binaries in distributive justice. 

  For the capability approach, I'll focus on security (constant flood threats), social belonging (the staircase scene), and spatial agency (the basement vs mansion contrast). But must acknowledge that some capabilities like respect might be inherently positional. 

  The ending should highlight what only art can add to philosophy: the visceral, sensory dimension of inequality. That lingering shot of the semi-basement after the flood says more about unfreedom than any theory could. 

  Better avoid academic jargon since the user requested American English. The analysis needs to breathe like the film does - philosophical but not dry, critical but not reductive. The moral complexity is key; this isn't a socialist realist manifesto but a tragicomedy about systemic violence. 

