prompt: |-
  I've been having this on-and-off argument with my brother for months now about whether the world is actually getting morally better. He says no: every generation just swaps one set of prejudices for another and calls it progress. I want to say yes: the fact that we now think slavery, burning cats for fun, and the idea that women shouldn't vote are wrong is not just fashion — something actually moved. But then I start listing the things a good story about moral progress would have to explain, and I realise I don't have a clear list, and neither does he. So here's what I want: write me the list of requirements. What does any adequate theory of moral progress have to deliver before I should believe it? Assume the point of the theory is to settle whether the widening of moral concern counts as genuine progress, not just to describe how opinions changed. Which cases must it get right — the end of slavery, the rise of animal welfare (whatever you think of how far that should go), the way the circle of who counts seems to have widened from family to tribe to nation to all humans and now maybe to animals and future people — and which distinctions it can't collapse, like the difference between widening the circle and just treating the people already inside it better, or between a change in what people say and a change in what they actualy do and the institutions they build. And which historical facts is it not allowed to contradict — including the ugly bits, the backsliding, the fact that some of the worst atrocities happened in societies that thought they were the most civilised. For each requirement, tell me why it's a requirement and wich case or consideration forces it.

  Then mark which requirements are non-negotiable and which are just one camp's pet preferences (for example, some people will demand that progress be measured against a standard that doesn't itself change over time, others will demand that the whole thing be explained without any spooky moral facts). Tell me if any pair of the requirements can't be jointly satisfied, because that would itself be a finding, and if one requirement on its own rules out most of the usual stories people tell, say which one. If you can, end by briefly scoring the usual kinds of story against the list — but keep that short, the list is the point. Oh, and please write the whole answer in British English.
reasoning: |-
  Okay, the user has been arguing with their brother about whether the world is morally progressing. They want a list of requirements that any theory of moral progress must meet to be convincing. They mentioned key examples like ending slavery, animal welfare, and expanding moral circles. They also want distinctions between genuine progress and superficial changes, and they want historical facts accounted for, including atrocities and backsliding.

  First, I need to outline the non-negotiable requirements versus the debated ones. The user wants to know what's essential and what's optional. Key cases like abolition of slavery and women's suffrage must be explained. Also, the theory must handle the widening moral circle without conflating it with better treatment within existing circles. Historical backsliding, like atrocities in "civilized" societies, is crucial too.

  The user probably needs a structured framework to evaluate theories, helping them in their debate. They might also seek validation that moral progress is real despite setbacks. Deep down, they could be looking for hope or reassurance that efforts towards justice matter. They mentioned avoiding "spooky moral facts," so the theory should be grounded without relying on abstract ideals.

  I should list requirements covering explanation of key developments, differentiation of progress types, handling historical complexities, and theoretical coherence. Each requirement needs a justification tied to a specific case. For example, explaining abolition requires addressing both ethical shifts and economic factors. The distinction between widening circles and better treatment is vital to show genuine expansion of concern.

  Non-negotiables include explaining paradigm shifts like slavery abolition, differentiating widening from intensifying concern, and accounting for backsliding. Debatable points might include whether progress needs an objective standard or if moral facts are necessary. Conflicts could arise between requiring objective standards and avoiding spooky facts, or reconciling progress with ongoing atrocities.

  Scoring common theories briefly: Enlightenment rationalism might handle expanding circles but struggle with non-human inclusion. Utilitarianism explains animal welfare but faces measurement issues. Theistic accounts provide objectivity but lack universality. Social evolution might explain shifts but risk determinism. Critical theories handle power dynamics but may overemphasize discourse over material changes.

  Finally, ensuring the response is in British English. Terms like "moral concern" instead of "moral circle" and using "backsliding" instead of "regression" where appropriate. Checking for consistent spelling and terminology.
answer: |-
  Here is a comprehensive list of requirements for an adequate theory of moral progress, tailored to your debate and written in British English. I'll structure each requirement with **What it is**, **Why it's required** (linking to your cases/considerations), and whether it's **Non-Negotiable** or **Debatable**. Finally, I'll briefly score common theories.

  **Core Requirements (Non-Negotiable for a Serious Theory):**

  1.  **Explain Paradigm-Shifting Condemnations:**
      *   **What:** Must account for the widespread modern judgement that practices like chattel slavery, burning animals for entertainment, or denying women suffrage are *fundamentally* wrong, not merely unpopular or inconvenient. It must explain why these shifts feel like discoveries of error, not just changes in taste.
      *   **Why:** Cases like slavery abolition, basic animal welfare laws, and women's suffrage are your prime examples. A theory that dismisses these as mere "swapping prejudices" fails to capture the perceived moral weight of the change. The shift from seeing slaves as property to seeing them as persons demanding rights is qualitatively different from swapping, say, blue for green as the fashionable colour.
      *   **Status:** **Non-Negotiable.** A theory that cannot explain why ending slavery feels like *progress* rather than just *change* isn't addressing your core question.

  2.  **Distinguish Widening the Circle from Intensifying Concern:**
      *   **What:** Must clearly differentiate between expanding the set of entities considered morally significant (e.g., from tribe to nation, humans to animals/sentient beings, present to future generations) and simply treating the *existing* circle better (e.g., improving workers' rights within a nation already recognised as full persons).
      *   **Why:** You explicitly raised this. Including animals or future people represents a potential expansion of *who matters*, distinct from giving existing voters better healthcare. Collapsing this distinction makes "progress" meaningless – improving conditions for kings wouldn't be progress if serfs still didn't count. Cases like animal welfare laws represent a tentative widening beyond *Homo sapiens*.
      *   **Status:** **Non-Negotiable.** This distinction is central to the "widening circle" argument your brother critiques.

  3.  **Account for Backsliding, Atrocities, and Hypocrisy:**
      *   **What:** Must grapple with historical regressions (e.g., post-Reconstruction Jim Crow laws), horrific atrocities committed by societies claiming moral superiority (e.g., Nazi Germany, colonial powers practicing genocide while preaching civilisation, Stalinist purges), and the gap between professed ideals and actions (e.g., founding democracies practising slavery).
      *   **Why:** You highlighted the "ugly bits." A theory implying linear, inevitable progress is empirically false and naïve. The Holocaust, committed in a highly "civilised" society, is the starkest challenge. Progress isn't smooth or guaranteed.
      *   **Status:** **Non-Negotiable.** Ignoring this invalidates the theory against historical reality.

  4.  **Address the Institution/Action Gap:**
      *   **What:** Must explain the relationship between changing moral *discourse* (what people say is right/wrong), changes in individual *behaviour*, and changes in *institutional structures and norms* (laws, treaties, social expectations). Progress in one doesn't guarantee the others.
      *   **Why:** You mentioned the difference "between a change in what people say and a change in what they actually do and the institutions they build." Ending slavery required not just changed opinions, but civil war, constitutional amendments, and new institutions. Conversely, racist attitudes persisted long after legal abolition.
      *   **Status:** **Non-Negotiable.** Moral progress is unstable if only about sentiments; it needs institutional embedding. Conversely, laws without underlying sentiment (e.g., imposed by force) may not reflect genuine moral progress.

  5.  **Explain the "Feeling of Discovery":**
      *   **What:** Must account for the phenomenological aspect – why does condemning past practices (like burning cats) feel like recognising a truth that was always there (e.g., causing unnecessary suffering is wrong), rather than just adopting a new preference?
      *   **Why:** This is key to your intuition that "something actually moved." It addresses your brother's "just swapping prejudices" claim directly. If progress feels like uncovering a moral fact (even if not "spooky"), the theory needs to explain that *feeling* and whether it's justified.
      *   **Status:** **Highly Important / Borderline Non-Negotiable.** A theory that renders this universal feeling entirely illusory risks being implausible.

  **Important but Debatable Requirements (Reflecting Different Philosophical Camps):**

  6.  **Provide a Standard (Objective vs. Evolving):**
      *   **What:** Must specify *against what* progress is measured. Is it an objective, transhistorical moral standard (e.g., well-being, flourishing, rights)? Or is progress defined immanently, as better alignment with a society's own evolving, deepest values/commitments (even if those values change)?
      *   **Why:** Without *some* standard, "progress" is just change. An objective standard (e.g., reduced suffering) might condemn past societies more clearly but requires defending the standard itself. An immanent standard (e.g., the US better living up to "all men are created equal") avoids "spooky facts" but might struggle to condemn core values of very different past societies (e.g., honour cultures).
      *   **Status:** **Debatable.** This is the core philosophical split. Objectivists demand #6a (Fixed Standard), anti-objectivists demand #6b (Evolving/Immanent Standard). *A theory must pick one and justify it.* They likely **cannot be jointly satisfied.**

  7.  **Avoid Reliance on "Spooky" Moral Facts (Optional for some, Mandatory for others):**
      *   **What:** Some demand the theory explains progress without positing mind-independent, non-natural moral truths ("spooky facts"). Progress must be explicable through natural processes (psychology, sociology, evolution, rational discourse).
      *   **Why:** Philosophical naturalism (dominant in academia) rejects non-natural entities. For these thinkers, a theory needing "spooky facts" is unscientific and explanatorily empty. Your brother's "just swapping prejudices" view often stems from this naturalistic, anti-objectivist stance.
      *   **Status:** **Debatable (but often a deal-breaker for naturalists).** Theories accepting moral realism (#6a) reject this requirement.

  8.  **Explain the Mechanism of Change:**
      *   **What:** Must describe *how* moral progress (as defined) actually happens. Is it driven by reason/argument, empathy, economic/technological shifts, power struggles, cultural evolution, or some combination?
      *   **Why:** To move beyond mere description ("it changed") to explanation ("*why/how* it changed"). Abolition involved religious arguments, economic shifts (industrialisation vs. plantation economy), and bloody conflict. Which was primary?
      *   **Status:** **Important, but mechanism can vary.** A theory lacking *any* plausible mechanism is weak. Specific mechanisms are debatable.

  9.  **Account for Cultural Variation & Non-Linearity:**
      *   **What:** Must acknowledge that progress isn't uniform globally or across domains (e.g., gay rights advance in some places while regressing in others; environmental concern rises while economic exploitation continues).
      *   **Why:** Contemporaneous examples challenge simple linear narratives. Progress in women's rights varies hugely worldwide today. A theory implying global synchrony is false.
      *   **Status:** **Important.** A theory implying universal synchrony is fatally flawed.

  **Conflicts and Ruled-Out Theories:**

  *   **Conflict:** Requirement #6a (Objective Standard) fundamentally conflicts with #7 (No Spooky Facts). Requirement #6b (Evolving Standard) can satisfy #7 but struggles to provide a *critical* standard beyond a society's current self-understanding. Requirement #3 (Account for Atrocities) strongly challenges overly optimistic theories (e.g., simple "Enlightenment reason leads inevitably to progress").
  *   **Ruling Out:** Naïve Whig History (linear, inevitable progress towards present) fails #3 catastrophically. Extreme Moral Relativism ("it's all just cultural preference") fails #1 and #5 utterly, making condemnation of past atrocities nonsensical. Simplistic Biological Determinism (e.g., "progress is just evolved empathy") struggles with #3 (atrocities) and #8 (specific mechanisms of recent shifts like abolition).

  **Brief Scorecard of Common Theories:**

  *   **Enlightenment Rationalism (Kantian/Rawlsian):** Strong on #1, #5, #6a. Explains #2 via universalisation. Weak on #3 (why did reason fail catastrophically?), #4 (gap between principle and practice), #7 (relies on rational "spooky" norms). Mixed on #8 (reason *can* drive change, but history is messy).
  *   **Utilitarianism (Bentham/Singer):** Strong on #1, #2 (sentience defines circle), #6a (well-being standard). Explains #5 as recognising suffering. Good on #8 (highlighting suffering often drives change). Weak on #3 (why massive suffering occurs?), #4 (preference frustration vs. action), #7 (objective well-being debated). Can struggle with rights (#1 - slavery wrong beyond suffering?).
  *   **Theistic Accounts:** Strong on #1, #5, #6a (divine command/natural law). Can explain #2 (all God's creatures). Weak on #3 (theodicy problem - why allow atrocities?), #7 (relies on divine "spooky" facts), #9 (cultural variation in belief). Lacks universality for non-believers.
  *   **Social Evolution / Cultural Darwinism:** Strong on #8 (change mechanisms), can address #9 (variation). Weak on #1, #5 (reduces moral truth to adaptive preference - risks collapsing into your brother's view), #6 (lacks normative standard beyond survival/fitness). Struggles to condemn extinct but adaptive practices (e.g., slavery in agrarian empires).
  *   **Critical Theories (Marxist, Feminist, Post-colonial):** Strong on #3, #4 (power, hypocrisy, institutions), #8 (change via struggle). Explains backsliding (#3) well. Explains #1 as contingent victories in power struggles. Weak on #5, #6 (often sees moral claims as masks for power - aligns with your brother's critique; risks relativism). Can struggle with #2 beyond human groups.

  **Conclusion:** A theory convincing *you* must nail #1, #2, #4, #5, and crucially, handle #3. It must also convincingly address #6 (choosing and justifying a standard). For your brother, satisfying #7 while still making #1 feel like genuine discovery (#5) is the major hurdle. The historical record (#3, #4, #9) is the brutal testing ground where many appealing theories stumble. No theory perfectly satisfies all requirements, especially given the inherent conflicts, but the best ones grapple seriously with the non-negotiables. Your list highlights that progress is real but fragile, contested, and never guaranteed – a messy, uneven, and often reversible human achievement, not an inevitable historical force.
