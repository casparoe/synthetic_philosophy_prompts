  For part (1), I need to define the core versions accurately. Textualism should emphasize ordinary meaning at enactment time, regardless of drafters' expectations. Purposivism should focus on statutory purpose, possibly updating applications. The key distinction lies in how each handles unanticipated cases - textualism sticks to semantic meaning while purposivism looks to purpose. 

  Moving to part (2), Gorsuch's opinion is fascinating material. His but-for causation argument seems strictly textualist by isolating statutory language. The individual-level reading rejects group-based interpretations, again text-bound. His dismissal of legislative expectations is classically textualist. But when he addresses consequences, he might be flirting with purposivism by implying the textual result aligns with Title VII's purpose. That's the most interesting tension.

  For part (3), the conclusion must be decisive. The strongest evidence points to textualism and purposivism being distinct but borrowing when text underdetermines outcomes. Bostock shows textualism can reach socially progressive results, undermining stereotypes. But the counterpoint exists - Gorsuch's purpose mentions create ambiguity. Still, the core reasoning remains textualist.

  The user likely needs this for academic discourse, so precision matters. They're probably wrestling with how legal methods function in practice versus theory. My analysis should help them position Bostock within broader jurisprudential debates while acknowledging nuances. The word limit means every point must count - focus on conceptual clarity over case law recitation.

  Noticing they're a PhD student, I should avoid oversimplification. The "covert purposivism" question deserves careful handling - it's where real scholarly debate lives. Also flagging how this impacts the textualism/purposivism dichotomy could be valuable for their original work. The conclusion should give them a firm stance to build upon while acknowledging counterarguments.
answer: |-
  ### Bottom Line:
  Bostock demonstrates that textualism, rigorously applied using contemporary semantic tools (but-for causation, ordinary meaning at enactment), can yield results aligning with purposivist goals in unanticipated cases, yet without resorting to legislative intent or purpose, suggesting the methods are distinct rivals in justification but may converge in outcome when textual meaning is clear and broad.

  ### Analysis:

  **(1) Core Definitions & Unanticipated Applications:**
  *   **Textualism (Standard Version):** Requires interpreting statutory language based on its *ordinary public meaning at the time of enactment*. The interpreter asks how a reasonable person would understand the words in context, focusing on semantic content, syntax, and linguistic conventions. For unanticipated applications: **The textualist applies the enacted meaning, *even if unforeseen by drafters*, because fidelity is to the codified words, not subjective expectations.** Consequences are irrelevant; meaning is fixed at enactment.
  *   **Purposivism (Standard Version):** Requires interpreting statutory language to advance the statute's underlying *purpose(s)*, often discerned from legislative history, statutory structure, or the problem the statute aimed to solve. For unanticipated applications: **The purposivist asks whether extending the statute to the new case *best serves the statute's purpose(s)*.** If the purpose encompasses the new situation, even if linguistically unforeseen, application is warranted. If not, it may be rejected, even if linguistically plausible.

  **(2) Assessing Gorsuch's Moves:**
      *   **Ordinary Meaning ("Because of...sex"):** Gorsuch grounds the analysis in the ordinary, public meaning of "discriminate against...because of...sex" at the time of Title VII's enactment (1964). He insists this is the sole relevant inquiry. **Assessment: Genuinely Textualist.** This is the core textualist move, rejecting arguments based on 1964 understandings of "sex" or legislative expectations.
      *   **But-For Causation:** Gorsuch employs but-for causation as the established, ordinary meaning of "because of" in anti-discrimination law. He argues that sexual orientation or gender identity discrimination *necessarily* requires considering sex: but-for the employee's sex, the adverse action wouldn't have occurred. **Assessment: Genuinely Textualist.** This is a logical, linguistic application of a standard causal principle to the statutory phrase, deriving the result directly from the language's semantic implications.
      *   **Individual-Level Reading:** Gorsuch rejects arguments focusing on whether homosexuals/transgender people constitute a protected *group* under "sex," insisting the statute prohibits *individual* discrimination where sex is a necessary factor. He focuses on the *reason* for the adverse action applied to *this individual*. **Assessment: Genuinely Textualist.** This follows from the textual structure ("individual," "because of") and avoids importing extratextual group-based theories or purposes. The analysis stays within the linguistic boundaries of the prohibition.
      *   **Enforcing What the Statute Says vs. Expectations:** Gorsuch explicitly disavows reliance on societal evolution, moral views, or legislative expectations/intent (e.g., "the limits of the drafters’ imagination"). He frames the decision as compelled by the enacted text's logic. **Assessment: Genuinely Textualist.** This is a hallmark of textualism: rejecting subjective intent or unforeseen consequences as irrelevant if the meaning is linguistically clear. The result stems solely from the semantic content of "because of sex."
      *   **Consequences Discussion (Dissent's Concerns):** Gorsuch dismisses the dissent's parade of horribles (bathrooms, sports, religious liberty) as irrelevant to the textual question, stating Title VII's consequences for other laws "are questions for future cases" and that the Court's role is only to enforce this statute's text. **Assessment: Primarily Textualist, with Potential Covert Purposivist Undertone?** Insisting consequences are irrelevant is deeply textualist. However, his brief suggestion that Title VII's "fundamental rule" of individual fairness supports the reading (*Bostock*, slip op. at 32) hints at purpose. Yet, he presents this as inherent in the textual concept of "discrimination...because of...sex," not an external purpose. Thus, **largely Textualist**, bordering on a textualist conception of inherent purpose within the words.

  **(3) Implications for the Textualism/Purposivism Debate:**
  Bostock best supports the view that **textualism and purposivism are distinct rival methods in justification, but their perceived rivalry is often overdrawn because clear textual meaning can sometimes align with evolving societal purposes, and textualism itself requires interpreting words within a conceptual framework that may imply purpose.**

  *   **Why Rivalry is Confirmed & Overdrawn:** Gorsuch's *justification* is rigorously textualist, explicitly rejecting purposivist tools (legislative history, intent, evolving purpose). He grounds every step in semantic meaning and linguistic logic. Purposivists would likely reach the same result but justify it by appealing to Title VII's core purpose of eliminating irrational discrimination in employment, *despite* the drafters' specific expectations. The *methods* and *justifications* are fundamentally different rivals.
  *   **Why Convergence at Application?** The result converged with what purposivists (and many living constitutionalists) desired. This convergence occurred because the broad textual language ("because of sex") possessed inherent semantic potential that, analyzed with modern linguistic tools (but-for causation), encompassed the unanticipated application. The text, interpreted faithfully using standard textualist tools, *already contained* the progressive outcome. The drafters' narrow *expectations* did not constrain the broad *meaning* they enacted.
  *   **Why Underdeterminacy/Borrowing is Less Compelling:** The text, under Gorsuch's analysis, was *not* underdetermined in a way requiring borrowing. His but-for argument aimed to show the result was linguistically *compelled*. While purposivists might argue textualism inevitably smuggles in purpose (e.g., inherent "fairness"), Gorsuch presented this as deriving *from the meaning of "discrimination because of sex,"* not an external purpose. The strongest textualist claim is that he stayed within semantic bounds.
  *   **Definite Conclusion:** Bostock best supports the view that **the rivalry between textualism and purposivism is genuine regarding justification but is often overdrawn in practice because broad textual language, faithfully interpreted using semantic tools, can encompass unanticipated applications that align with purposivist goals without needing purposivist methodology.** Textualism, when the text is broad and clear (as interpreted), can be a vehicle for legal evolution.
  *   **Strongest Counter-Consideration:** The strongest argument for "covert purposivism" or borrowing is that Gorsuch's reliance on but-for causation, while linguistically sound, functions similarly to purposivism by focusing on the *reason* for the discrimination and its fundamental unfairness, concepts deeply intertwined with the *purpose* of anti-discrimination law. His dismissal of consequences also arguably serves a purposivist-like aim of ensuring the statute's core objective isn't undermined by unforeseen applications. However, he anchors this reasoning firmly *within* the textual semantics ("because of") rather than external purpose. The counter highlights the difficulty of completely isolating semantic meaning from the functional context and conceptual framework in which words operate.
