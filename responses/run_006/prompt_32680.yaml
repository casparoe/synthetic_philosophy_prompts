prompt: |-
  My philosophy of language prof has been drilling a Gricean distinction between what's said and what's implicated, and I've kept a list of her verdicts so far. On 'Some of the students passed,' she says the 'not all' is implicated, not part of what's said. On 'It's cold in here' said to a host, she says the request to close the window is implicated, not said. On 'She got married and had a baby,' she says the temporal order is implicated, not said. On 'He's an Englishman; therefore, he's brave,' she says the 'therefore' connection is a conventional implicature, not part of what's said. Next week she's going to rule on 'I've had breakfast' said first thing in the morning — specifically whether 'today' is part of what's said or merely implicated. Predict how she'll rule, but I'm less interested in the answer than in the rule she seems to be running: the minimal one where what's said is just conventional meaning plus reference assignment and disambiguation, the contextualist one where enrichments needed for a complete truth-evaluable proposition count as said, or something else. Say what each rule predicts about the new case, give your best guess and why, and tell me wich further case would settle which rule she's actually running.
