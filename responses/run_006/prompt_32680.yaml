  Okay, the user is a philosophy of language student dealing with Gricean distinctions. Their professor has been teaching the difference between what's said and what's implicated, using specific examples. Now, they're about to cover "I've had breakfast" first thing in the morning, and the question is whether "today" is part of what's said or just implicated. The user wants to predict the ruling but cares more about identifying the underlying rule the professor is using.

  First, I need to recall the different approaches to "what's said." The minimal view (like Grice) sticks to conventional meaning plus disambiguation and reference fixing. Contextualists like Sperber and Wilson or Recanati allow for pragmatic enrichments to form a complete proposition. The user mentioned conventional implicature too, from the "therefore" example.

  Looking at the professor's past rulings: "Some" doesn't imply "not all" as said—that's scalar implicature. "It's cold" leading to a request is implicature. Temporal order in "married and had a baby" is implicated. "Therefore" is conventional implicature. These point towards a minimal approach, especially since enrichments like temporal order aren't included in what's said.

  For "I've had breakfast" in the morning: if minimal, "today" isn't part of what's said because it's not encoded. The verb tense might imply recent past, but "today" requires context. So minimal would say implicated. Contextualist would say it's needed for truth-evaluation, hence part of what's said. 

  But the professor's history suggests minimalism. The temporal case with "and" was ruled as implicated, which aligns with minimalism. Also, conventional implicature for "therefore" shows she distinguishes conventional from conversational implicatures. 

  The user also wants a test case to confirm the rule. Examples like "John has three children" could work. Minimal says "exactly three" isn't said, while contextualist might include it. Another case is incomplete descriptions, e.g., "the table is covered with books" when multiple tables exist. Minimal requires disambiguation, so "in this room" might be implicated, while contextualist sees it as part of what's said. 

  So, predicting the professor will say "today" is implicated, based on minimalism. The test case with incomplete descriptions would clarify if she's strictly minimal or allows some enrichments. If she requires context for reference fixing, that's minimal, but if she includes unarticulated constituents like location, that's contextualist.
answer: |-
  Based on your professor's pattern of rulings and the core Gricean framework, here's the breakdown for the "I've had breakfast" case and the underlying rule she's likely using:

  1.  **The Case: "I've had breakfast" (said first thing in the morning)**
      *   **Literal Meaning (Minimal Proposition):** The speaker has had breakfast at least once in their life prior to the moment of utterance.
      *   **Intended Meaning (Likely):** The speaker has had breakfast *today*, and specifically *this morning*, implying they don't want/need breakfast now.
      *   **Question:** Is "today" (or "this morning") part of *what is said* or merely *conversationally implicated*?

  2.  **Predictions of Each Rule:**
      *   **Minimalism (Gricean Core - Conventional Meaning + Disambiguation/Reference Fixing):**
          *   **Prediction for "I've had breakfast":** "Today" is **NOT** part of what is said. What is said is the minimal, context-independent proposition: the speaker has had breakfast at some point(s) in their life before now. The restriction to "today" is a conversational implicature (likely relevance-based: why say this now? To indicate you've eaten *recently*, meaning *today*).
          *   **Justification:** The present perfect tense ("have had") conventionally encodes *past action with present relevance*, but it does not *conventionally* encode "earlier on the same calendar day". That interpretation relies entirely on contextual factors (time of utterance, typical breakfast schedules, relevance to the situation). No disambiguation or reference fixing is needed for the minimal proposition.
      *   **Contextualism (Enrichment for Truth-Evaluability - e.g., Sperber & Wilson, Recanati):**
          *   **Prediction for "I've had breakfast":** "Today" **IS** part of what is said. The minimal proposition (life-time breakfast) is not what the speaker intends to assert and is likely not even fully truth-evaluable in the context (it's trivially true and irrelevant). Enriching the time frame to "today" or "this morning" is necessary to arrive at a proposition that has a determinate truth value (true if they ate today, false if they haven't) and reflects the intended assertion.
          *   **Justification:** The minimal proposition is pragmatically defective (too weak, irrelevant). Context provides the necessary time frame ("today") to yield a proposition that is both relevant and capable of being true or false in the specific situation.
      *   **Conventional Implicature:** This doesn't seem applicable here. "Today" isn't conventionally signaled by the words "I've had breakfast" in the way "therefore" conventionally signals a conclusion. It's context-driven.

  3.  **Best Guess for Professor's Ruling & Why:**
      *   **Prediction:** She will rule that **"today" is implicated (conversationally), NOT part of what is said.**
      *   **Reasoning:** Her previous rulings are *strongly* indicative of a **Minimalist** approach:
          *   "Some Fs are G" -> "Not all" = Implicated (Scalar Implicature).
          *   "It's cold" -> "Close the window" = Implicated (Relevance/Request).
          *   "She got married and had a baby" -> Temporal Order = Implicated (Manner/Content?).
          *   "therefore" -> Consequence Relation = Conventional Implicature (Explicitly *not* part of "what is said", relegated to implicature).
          All these rulings resist incorporating pragmatic inferences into "what is said", even when they seem necessary for relevance or full understanding. She consistently isolates the conventional, linguistically encoded meaning (+ reference/disambiguation) as "what is said" and pushes pragmatic effects into implicature. The "I've had breakfast" case fits this pattern perfectly: the temporal restriction is a pragmatic inference driven by context and relevance, not lexically or grammatically encoded by the present perfect in a way that *forces* the "today" reading without context.

  4.  **The Crucial Test Case to Settle the Rule:**
      To definitively distinguish her Minimalism from Contextualism, you need a case where **disambiguation/reference fixing is insufficient to yield a relevant or truth-evaluable proposition, requiring *further enrichment*.**

      *   **Proposed Test Case: "John has three children."**
          *   **Minimalist Prediction:** What is said is simply that the number of children John has is three. The scalar implicature "not more than three" is implicated. The proposition is truth-evaluable as-is (True if he has exactly three, false otherwise, regardless of the implicature).
          *   **Contextualist Prediction:** In many contexts (e.g., explaining why John qualifies for a family discount, why he's tired, etc.), what is *asserted* (said) might be that John has *exactly* three children. The minimalist proposition ("at least three") is often pragmatically inadequate or even false if intended strictly minimally.
      *   **Why it's Crucial:** The Minimalist *can* argue the proposition "John has three children" (meaning at least three) *is* truth-evaluable and relevant enough. They push the "exactly" reading to implicature. The Contextualist argues that "exactly three" is often the *only* proposition asserted, making the minimal proposition irrelevant or false. **Your professor's ruling here is key:**
          *   If she says "exactly three" is merely implicated (scalar implicature), she's firmly **Minimalist**.
          *   If she says "exactly three" is part of what is said (necessary for the proposition to be relevant/truth-evaluable as asserted in context), she leans **Contextualist**.

      *   **Alternative/Additional Test Case: Incomplete Descriptions.** E.g., pointing at a messy table in a room with only one obvious table and saying "**The table is covered with books.**"
          *   **Minimalist Prediction:** What is said is incomplete/false if there are multiple tables in the world/universe. Disambiguation/reference fixing ("the table *in this room*") is needed to get a truth-evaluable proposition, and this fixing is part of "what is said". *However*, if the context makes it obvious, the Minimalist might accept this fixing as sufficient without further enrichment.
          *   **Contextualist Prediction:** Even after reference fixing to the table in the room, the proposition might still need enrichment like "*completely* covered" or "*relevant part* covered" to be truth-evaluable against the context (maybe only half is covered). They might argue *this* enrichment is part of what is said.
          *   **Why it's Crucial (especially for "in this room"):** Does she see the location ("in this room") as merely *contextually obvious* reference fixing (part of what is said, Minimalism) or as a full-blown *unarticulated constituent* added pragmatically (potentially pushing towards Contextualism if she argues it's part of the asserted content beyond simple fixing)? Her ruling on *how much* pragmatic input is allowed *within* "what is said" for reference fixing vs. enrichment is the test. If she *only* allows what's needed for grammatical completeness (fixing the referent of "the table") and pushes any further specification ("covered *completely*") to implicature, she's Minimalist. If she argues the location ("in this room") or degree ("completely") are necessary enrichments *for the proposition to be what is asserted*, she's Contextualist.

  **Conclusion:** Your professor's consistent pattern points towards a **strict Gricean Minimalist** approach to "what is said". She isolates linguistically encoded meaning and essential disambiguation/reference fixing as "what is said" and treats almost all other pragmatic contributions, even those crucial for relevance and understanding, as implicatures. Therefore, predict she will rule that "today" in "I've had breakfast" (said in the morning) is **conversationally implicated**, not part of what is said. The "John has three children" case is likely the best litmus test to confirm this Minimalism versus a move towards Contextualism.
