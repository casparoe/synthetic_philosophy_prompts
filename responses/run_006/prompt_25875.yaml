prompt: |-
  I'm teaching a single session on Zeno's paradoxes to a reading group of graduate students in mathematics who have had no exposure to ancient philosophy. They will arrive assuming the paradoxes were settled once limits were formalized in the nineteenth century and that the point of the session is antiquarian. I have seventy-five minutes. I want them to leave understanding the paradoxes as live challenges to the coherence of motion rather than as confused anticipations of infinite series, and in particular to see why the move from Cauchy and Weierstrass does not address the underlying metaphysical difficulty.

  Don't explain the paradoxes to me. Plan how I should structure the session: what idea has to be in place before the paradoxes even bite, which single paradox should carry the whole arc and why not the others, the misconceptions they will walk in with and the new ones they will form during the session, where in the sequence each should be headed off, what I should openly set aside as beyond seventy-five minutes, and one question I can pose in the final five minutes to test whether the distinction that matters has actually landed.
