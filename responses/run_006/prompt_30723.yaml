answer: |-
  You've pinpointed a fascinating and well-observed pragmatic phenomenon! There isn't one single, universally agreed-upon term for this *specific* order-sensitivity, but the core concepts explaining it are well-established in linguistics and philosophy of language, primarily drawing from **Gricean pragmatics**.

  Here's the breakdown:

  1.  **The Core Principle: Informativeness and Relevance (Gricean Maxims)**
      *   When we speak, we implicitly follow conversational maxims (Paul Grice), including the **Maxim of Quantity** (be as informative as required) and the **Maxim of Relation** (be relevant).
      *   Stating the **stronger/more specific conditional first** (`If A & B, then Disaster`) sets a high informational standard. It provides a specific, detailed scenario with its outcome.
      *   Following it immediately with the **weaker/less specific conditional** (`If A, then Great`) violates expectations:
          *   **Quantity:** It provides *less* specific information than you've just demonstrated you possess (you know about the A&B case).
          *   **Relation:** It feels irrelevant or backward after establishing that adding B changes the outcome dramatically. Why mention the simpler case *after* revealing its insufficiency?
      *   The hearer's natural interpretation is that the speaker must be **correcting, refining, or retracting** the implication of the first statement. The "But..." reinforces this corrective reading.

  2.  **The Natural Order: Building Specificity**
      *   Stating the weaker/simpler conditional first (`If A, then Great`) meets the initial informational requirement.
      *   Following it with the stronger/more specific conditional (`But if A & B, then Disaster`) naturally **adds information, refines, or qualifies** the first statement. It explains a crucial exception or complication. The "But..." signals this contrastive addition perfectly.

  3.  **Naming the Phenomenon:**
      *   **Pragmatic Ordering Constraint on Conditionals:** This is a descriptive, accurate phrase capturing the essence.
      *   **Conditional Informativeness Ordering:** Highlights the role of the Quantity maxim.
      *   **Asymmetry of Conditional Addition/Refinement:** Focuses on why adding detail works one way but not the other.
      *   **Gricean Ordering Effect for Conditionals:** Anchors it in the theoretical framework.
      *   **Retraction Implicature in Conditional Sequencing:** Specifically names the implicature triggered by the reverse order.
      *   While **Conditional Perfection** (the tendency to interpret "If P then Q" as "If and only if P then Q") is related (the reverse order breaks this potential perfection), it's not the primary mechanism here. **Concessive Conditionals** ("Even if...") also share some territory but aren't the core.

  4.  **The "Retraction" Effect:**
      Your intuition is spot on. There isn't a perfect single term *just* for the retraction sense in the reverse order, but **Retraction Implicature** or **Correction Implicature** (arising from the violation of Gricean maxims) is the precise description of *why* it sounds like a take-back. The reverse order *forces* this implicature.

  5.  **Past vs. Future Tense:**
      **It's the same phenomenon.** The tense (past counterfactual "would have" vs. future "will") doesn't change the underlying pragmatic mechanism. The asymmetry arises from the logical relationship between the antecedents (one implies the other: `A&B` entails `A`, but `A` does not entail `A&B`) and the conversational maxims governing how we present information sequentially. The future example ("rain only" following "rain and covers") exhibits the same retraction implicature when reversed.

  **In Summary:**

  *   There's no single perfect, universally standardized term, but the phenomenon is well-understood.
  *   **Pragmatic Ordering Constraint on Conditionals** or **Conditional Informativeness Ordering** are good descriptive phrases.
  *   The core explanation lies in **violations of Gricean maxims (Quantity and Relation)**, leading to a **Retraction or Correction Implicature** when the weaker conditional follows the stronger one.
  *   The natural order allows **incremental refinement**; the reverse order forces a **corrective reading**.
  *   This holds equally for both past counterfactual and future-directed conditionals because the asymmetry stems from the logical relationship of the antecedents and the pragmatics of information sequencing, not the temporal modality.

  You've identified a beautiful example of how meaning isn't just in the words, but in their order and the unspoken rules of conversation!
