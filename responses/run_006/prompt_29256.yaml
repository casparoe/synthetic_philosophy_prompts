prompt: |-
  I lead a technical AI safety team, and we are split between two positions on what kind of guarantee an alignment-relevant property should have before it can count as a safety result.

  The worst-case camp holds that a property is a safety result only if it is stated over an explicitly chosen adversary or threat model and holds for all inputs in that set; average-case or distributional statements are not safety results, because deployment of powerful systems includes adversarial optimization (including by the system itself and by other actors), and because the relevant failures are asymmetric enough that averaging over them is exactly the wrong operation. The average-case camp holds that worst-case guarantees for general-purpose learned systems are either unattainable, vacuous, or silently conditional on a threat model the designer merely stipulated; the only honest and useful target is a distributional or expected-risk statement, with worst-case reasoning kept as a heuristic for choosing and stress-testing the distribution.

  Draft the document that a good-faith adversarial collaboration between these two camps should produce. Write it as follows.

  1. Agreed claims. A numbered list of substantive claims both camps can sign, including claims about the inadequacy of IID validation, about distribution shift, about asymmetric costs, about the limits of guarantees against unbounded adversaries, and about what a guarantee must specify in order to be checkable at all. Keep these non-vacuous; avoid wording that only one side would sign.

  2. Disagreement table. For each residual disagreement, give (a) the precise claim the worst-case camp affirms and the average-case camp denies, phrased so the affirming side would accept the wording; (b) the precise claim the average-case camp affirms and the worst-case camp denies, phrased likewise; and (c) your judgment of whether the disagreement is substantive or partly verbal, with reasons.

  3. Cruxes. Identify the sub-questions such that a settled answer would move at least one camp. For each crux, specify a concrete case, experiment, or argument that both camps would accept as bearing on it, and record in advance what each camp predicts that test would show. Candidate cruxes include, but are not limited to: whether the input distribution for a capable general system is better modeled as a distribution one can specify or as an adversary one must bound; whether the threat model in a worst-case guarantee is any less stipulated than the distribution in an average-case guarantee; whether asymmetric catastrophic costs can be absorbed into an expected-utility framing or instead force a minimax criterion; and whether worst-case methods that work for narrow input spaces (adversarial examples, verified small programs) can scale to general reasoning. Do not simply list these; draft them precisely and commit to the formulations.

  4. Verbal dispute report. State which parts of the debate you believe are disagreements about words or about the honorific use of "safety," and which parts are substantive disagreements about how to reason under uncertainty about a system that may be optimizing against you. Commit to the diagnosis.

  Assume the document will be read by strong ML engineers who have not picked a side. Use the technical vocabulary of statistical learning theory, robust optimization, formal verification, and decision theory freely, but define any term whose meaning the two camps might themselves contest.

  Be committed throughout. Do not lay out options and leave them to me: make the drafting choices, phrase each camp in its strongest acceptable wording, and defend the contested formulations. Where you think one camp is smuggling an assumption into a shared term such as "guarantee," "distribution," or "adversary," say so outright.
reasoning: |-
  We are drafting a document for a good-faith adversarial collaboration between two camps in an AI safety team: the worst-case camp and the average-case camp. The document has four parts: Agreed Claims, Disagreement Table, Cruxes, and Verbal Dispute Report.

  We aim for clarity, precision, and commitment. We use technical vocabulary but define contested terms. We phrase each camp's position in its strongest acceptable wording and avoid vacuous agreements.

  ## 1. Agreed Claims

  Both camps agree on the following substantive claims:

  1. **Inadequacy of IID Validation**: When deploying a learned system in an open environment, the assumption that the test distribution is identical and independent (IID) to the training distribution is insufficient for safety. This is because the system may encounter inputs that are out-of-distribution (OOD) or adversarially optimized to cause failures.

  2. **Distribution Shift is Inevitable**: In any non-stationary environment, especially when the system is powerful enough to influence its own inputs or when other agents adapt to the system, the input distribution at deployment will shift from the training distribution. Therefore, any safety guarantee must account for such shifts.

  3. **Asymmetric Costs of Failure**: The cost of a catastrophic failure (e.g., existential risk) is vastly greater than the benefit of normal operation. Thus, even a low-probability event of catastrophic failure cannot be averaged away by a high probability of safe operation.

  4. **Unbounded Adversaries are Unrealistic**: No non-trivial guarantee can hold against an unbounded adversary (e.g., one with unlimited compute or access to the system's internals). Therefore, any practical guarantee must specify a bounded threat model.

  5. **Need for Explicit Specification**: A guarantee must explicitly specify the set of inputs (for worst-case) or the input distribution (for average-case) over which it holds. Without such specification, the guarantee is not checkable and hence not meaningful.

  6. **Heuristic Value of Opposing Methods**: Worst-case reasoning (e.g., adversarial training, formal verification) is a valuable heuristic for stress-testing and improving average-case performance. Similarly, average-case methods (e.g., empirical risk minimization) can inform the design of systems that are more robust in worst-case scenarios.

  7. **Guarantees as Conditional Statements**: Both worst-case and average-case guarantees are conditional on assumptions. A worst-case guarantee assumes a threat model (a set of adversarial capabilities), and an average-case guarantee assumes a data-generating distribution. Neither is unconditional.

  ## 2. Disagreement Table

  We now state the residual disagreements. For each, we give:
  (a) The claim the worst-case camp affirms and the average-case camp denies, in wording acceptable to the worst-case camp.
  (b) The claim the average-case camp affirms and the worst-case camp denies, in wording acceptable to the average-case camp.
  (c) Our judgment on whether the disagreement is substantive or partly verbal, with reasons.

  ### Disagreement 1: What constitutes a safety result?

  (a) **Worst-case camp affirms**: A property is a safety result only if it is stated as a guarantee that holds for all inputs in an explicitly chosen threat model (a set of inputs defined by adversarial capabilities), and not merely as an average over a distribution.

  (b) **Average-case camp affirms**: A property is a safety result if it is stated as a guarantee that holds in expectation (or with high probability) over an explicitly specified distribution, and worst-case guarantees are not required because they are either unattainable for general systems or vacuously weak when stated against a bounded adversary.

  (c) **Judgment**: Substantive. The disagreement is about the nature of the guarantee required for safety, not about definitions. The worst-case camp holds that only a universal quantifier over a threat set can capture the asymmetric risks, while the average-case camp holds that distributional guarantees are the only non-vacuous ones.

  ### Disagreement 2: The role of the threat model vs. the distribution

  (a) **Worst-case camp affirms**: The threat model (as a set of inputs) is less stipulated and more fundamental than the distribution because it can be defined by the capabilities of the adversary (which are objective), whereas the distribution is inherently subjective and cannot be known in advance for open-ended systems.

  (b) **Average-case camp affirms**: The input distribution is less stipulated and more fundamental than the threat model because it can be estimated from data and updated online, whereas the threat model is a subjective set that may not reflect realistic failures.

  (c) **Judgment**: Partly verbal. Both camps agree that both the threat set and the distribution must be specified, but they disagree on which one is "fundamental". The term "fundamental" is ambiguous (epistemically vs. ontologically). However, there is a substantive core: the worst-case camp believes that an adversarial set is more robust to unknown unknowns, while the average-case camp believes that a distribution is more learnable and testable.

  ### Disagreement 3: Decision-theoretic framing

  (a) **Worst-case camp affirms**: For safety-critical systems with asymmetric catastrophic costs, the appropriate decision criterion is minimax (minimize the worst-case loss) and not expected utility, because expected utility can be dominated by low-probability, high-consequence events that are not captured by the expected value.

  (b) **Average-case camp affirms**: Expected utility (or risk) is the appropriate decision criterion even for catastrophic risks, provided that the utility function is unbounded below and the distribution is well-specified, because minimax is overly conservative and leads to paralysis or vacuous guarantees.

  (c) **Judgment**: Substantive. The camps disagree on the proper decision-theoretic framework for safety. The worst-case camp argues that minimax is necessary for robustness against rare catastrophes, while the average-case camp argues that expected utility can account for catastrophes by assigning them high disutility and that minimax is impractical.

  ## 3. Cruxes

  We identify key sub-questions (cruxes) that, if resolved, would move at least one camp. For each crux, we specify a concrete test and record each camp's prediction.

  ### Crux 1: Modelability of the input space

  **Question**: For a capable general-purpose AI system operating in an open-ended environment (e.g., the internet), is the input space better modeled as a distribution that can be specified (and estimated) or as an adversary that must be bounded?

  **Concrete Test**: Consider a system that must answer arbitrary user queries while avoiding harmful outputs (e.g., a chatbot). Run two experiments:

  - **Experiment A (Distributional)**: Train the system using empirical risk minimization on a large dataset of user queries (with harmful queries filtered). Then, deploy the system and measure the rate of harmful outputs on a held-out test set (IID) and on a set of adversarially crafted queries (non-IID). Also, allow the testers to iteratively update the test set based on previous failures (simulating adaptive adversaries).

  - **Experiment B (Threat Model)**: Train the system with adversarial training using a bounded threat model (e.g., queries that can be generated by a human with 1 hour of effort). Then, deploy and measure as above.

  **Worst-case camp prediction**: In Experiment A, the rate of harmful outputs will be low on IID but high on the adaptive set, and the system will fail catastrophically when deployed. In Experiment B, the system will have a low rate of harmful outputs on both IID and the adaptive set (within the threat model), and the deployment will be safe.

  **Average-case camp prediction**: In Experiment A, with a large enough dataset and proper distributional robustness techniques, the system will generalize to non-IID and adaptive settings. In Experiment B, the system will be safe within the threat model but will be brittle to inputs outside the threat model (which are inevitable in open deployment) and may have higher average error rates.

  ### Crux 2: Stipulativeness of the guarantee condition

  **Question**: Is the threat model in a worst-case guarantee any less stipulated (i.e., more objective) than the distribution in an average-case guarantee?

  **Concrete Test**: Consider the task of defining the condition for a guarantee. Ask both camps to specify their condition for a safety property (e.g., "the system never outputs a harmful response") for a given system. Then, have an independent auditor (with no stake in the debate) assess the two conditions:

  - For the worst-case camp: The threat model (e.g., "all inputs that can be generated by an adversary with access to the system's architecture but not its weights, and with a compute budget of 1000 GPU-hours").

  - For the average-case camp: The input distribution (e.g., "the distribution of user queries as observed over the last 6 months, projected to change by no more than 10% in KL divergence per month").

  **Argument/Assessment**: The auditor will evaluate which condition is more objectively specified, measurable, and stable over time.

  **Worst-case camp prediction**: The threat model is more objective because it is defined by explicit bounds on the adversary's capabilities (which are verifiable), whereas the distribution is inherently unobservable in full and subject to change without notice.

  **Average-case camp prediction**: The distribution can be empirically estimated and monitored, and the threat model is subjective because it requires guessing the adversary's capabilities and intentions.

  ### Crux 3: Decision-theoretic criterion under catastrophic risk

  **Question**: For a system with catastrophic risks (e.g., an AI that could cause human extinction), can asymmetric costs be adequately captured in an expected-utility framework (by assigning -infinity utility to extinction), or do they force a minimax criterion?

  **Concrete Case**: Consider a choice between two systems:

  - System X: 0.9999 probability of saving 1 billion lives and 0.0001 probability of causing extinction.
  - System Y: 1.0 probability of saving 999 million lives.

  Assume that extinction is infinitely bad (utility = -∞). Then, expected utility of X is undefined (or -∞) and of Y is finite. Now, modify: let extinction have utility -U_cat where U_cat is a large but finite number (e.g., equivalent to the loss of 10^12 lives). Then, expected utility of X is 0.9999 * 1e9 - 0.0001 * 10^12 = 999,900,000 - 100,000,000 = 899,900,000. Expected utility of Y is 999,000,000. So Y is better.

  **Argument**: The average-case camp argues that with a finite (but very negative) utility for catastrophe, expected utility is well-defined and leads to reasonable trade-offs. The worst-case camp argues that assigning a finite utility to extinction is wrong because extinction is irreversible and unboundedly bad, so minimax (avoiding extinction at all costs) is the only rational choice.

  **Worst-case camp prediction**: In the finite-utility case, the expected utility calculation is sensitive to the arbitrary choice of U_cat. If U_cat is set to the value of all future lives, then the probability of extinction must be exactly zero to have a finite expected utility. Therefore, minimax is required.

  **Average-case camp prediction**: Expected utility with a large but finite U_cat is a practical way to make trade-offs. Minimax leads to absurd decisions, such as rejecting any system with a non-zero probability of extinction regardless of benefits.

  ### Crux 4: Scalability of worst-case methods

  **Question**: Can worst-case methods (e.g., formal verification, adversarial training) that work for narrow systems (e.g., image classifiers, small programs) scale to provide non-vacuous guarantees for general reasoning systems (e.g., a large language model with agency)?

  **Concrete Experiment**: Take a task that requires general reasoning (e.g., a debate judge that must evaluate arguments and avoid being tricked by deceptive arguments). Attempt to provide a worst-case guarantee for a specific property (e.g., "the judge never agrees with a false statement") against a threat model (e.g., an adversary with access to the judge's architecture and a fixed compute budget).

  **Test**: Can a worst-case guarantee be obtained with non-vacuous bounds (i.e., the system satisfies the property with a non-trivial bound, not one that is too loose to be useful) and without making the system too brittle or reducing its performance below usable levels?

  **Worst-case camp prediction**: Yes, by using techniques such as interactive verification, constrained optimization, and adversarial training, we can build systems with non-vacuous worst-case guarantees for non-trivial threat models.

  **Average-case camp prediction**: No, because the input space is too high-dimensional and combinatorial, and the adversary can always find inputs that exploit the gaps in the verification. The resulting guarantee will be either vacuous (e.g., "the adversary must solve an NP-hard problem") or the system will be too limited to be useful.

  ## 4. Verbal Dispute Report

  We identify the parts of the debate that are verbal (about words or honorifics) and those that are substantive.

  - **Verbal Disputes**:
    1. **Definition of "safety result"**: The two camps are using "safety result" honorifically. The worst-case camp reserves the term for worst-case guarantees, while the average-case camp allows distributional guarantees. This is a verbal dispute about labeling. We recommend disambiguating by using "worst-case safety result" and "average-case safety result".
    2. **"Guarantee"**: Both camps agree that a guarantee is conditional, but they disagree on what condition is appropriate. The core is substantive, but the term "guarantee" is sometimes used as if it were unconditional. We stipulate that all guarantees are conditional and focus on the condition.

  - **Substantive Disputes**:
    1. The core disagreement is about the nature of the uncertainty in the input space: whether it is best modeled as a distribution (average-case) or as a set defined by an adversary (worst-case). This is substantive because it affects how we design and evaluate systems.
    2. The decision-theoretic framing (expected utility vs. minimax) under catastrophic risk is substantive and has practical implications for system design and deployment.

  We commit to this diagnosis: the debate is largely substantive, but some confusion arises from verbal disagreements about the terms "safety" and "guarantee". Resolving the substantive issues requires empirical and theoretical progress on the cruxes.

  ---
  This document is a draft for review. We have made strong commitments in phrasing and diagnosis. We welcome feedback from both camps to refine the formulations and ensure they are acceptable.
answer: |-
  ### Adversarial Collaboration Document: On Safety Guarantees for AI Alignment  

  ---

  #### **1. Agreed Claims**  
  Both camps endorse the following non-vacuous claims:  
  1. **IID validation is insufficient for safety**: Deployment environments violate IID assumptions due to distribution shift, adversarial inputs, and self-induced distributional change (e.g., via feedback loops).  
  2. **Explicit threat/distribution specification is mandatory**: Any purported guarantee must explicitly define either (a) the adversary’s capabilities (threat model) or (b) the data-generating distribution. Vague or implicit scopes render guarantees untestable.  
  3. **Catastrophic risks are asymmetric**: The cost of a single catastrophic failure (e.g., existential harm) dominates the expected utility of safe operation, invalidating trivial expected-value tradeoffs.  
  4. **Unbounded adversaries preclude non-vacuous guarantees**: No non-vacuous guarantee can hold against an adversary with unlimited compute, data access, or optimization power. Bounds must be explicit.  
  5. **All guarantees are conditional**: Both worst-case and average-case guarantees rely on assumptions (threat model or distribution). Neither is "unconditional"; the dispute centers on *which* condition is appropriate for safety.  
  6. **Heuristic cross-pollination is valuable**: Worst-case methods (e.g., adversarial training) improve average-case robustness, and average-case methods (e.g., empirical risk minimization) inform worst-case stress tests.  

  ---

  #### **2. Disagreement Table**  
  *For each disagreement, (a) and (b) are mutually exclusive claims phrased in each camp’s strongest acceptable wording. (c) diagnoses the nature of the dispute.*  

  | #  | Disagreement                                                                 | (a) Worst-case camp affirms (average-case denies)                                                                                                                                 | (b) Average-case camp affirms (worst-case denies)                                                                                                                                 | (c) Judgment & Reasons                                                                                                                                                             |  
  |----|------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **D1** | What constitutes a "safety result"?                                          | A property is a safety result only if it holds *for all inputs* within an explicitly bounded threat model (e.g., adversaries with compute ≤ *C*, access ≤ *A*). Distributional guarantees (e.g., expected risk) are *not* safety results, as they permit catastrophic failures under adversarial inputs within the support. | A property is a safety result if it holds with high probability over an explicitly specified distribution *and* has been stress-tested against worst-case inputs. Worst-case guarantees are either vacuous (e.g., "safe against all adversaries" is impossible) or silently rely on heuristic threat models. | **Substantive**. Turns on whether safety *requires* universal quantifiers over inputs. Worst-case camp views average-case as inherently insecure under optimization; average-case camp views worst-case as practically unattainable. |  
  | **D2** | Epistemic status of threat model vs. distribution                            | Threat models (e.g., "adversaries with gradient access") are *less stipulated* than distributions because capabilities can be grounded in hardware/access constraints, whereas distributions for open-ended systems are unobservable and nonstationary. | Distributions (e.g., "user queries from 2020–2030") are *less stipulated* because they can be approximated from data and updated online, whereas threat models are arbitrary sets disconnected from real-world failure likelihoods. | **Partly verbal**. Disagreement hinges on "stipulated": worst-case camp equates it with "unobservable," average-case with "unvalidatable." Both agree the other’s approach involves assumptions, but dispute which is more tractable to specify/verify. |  
  | **D3** | Decision-theoretic framing under catastrophe                                 | Asymmetric costs force a **minimax criterion**: safety-critical properties must be optimized for worst-case loss within the threat model. Expected utility (EU) is misaligned because EU can be high while P(catastrophe) > 0. | Asymmetric costs are absorbed via **bounded expected utility** (e.g., *U*(catastrophe) = -∞). EU *is* appropriate if the utility function penalizes catastrophe sufficiently and the distribution covers tail events. Minimax is paralyzing (e.g., rejects systems with low P(failure)). | **Substantive**. Worst-case camp denies EU can handle low-probability/high-impact events without degenerate constraints; average-case camp denies minimax is feasible for AGI. |  

  ---

  #### **3. Cruxes**  
  *Sub-questions where resolution would shift positions. Tests are concrete and falsifiable.*  

  1. **Crux: Scalability of Worst-Case Guarantees**  
     - **Question**: Can worst-case methods (e.g., formal verification) provide non-vacuous guarantees for general-purpose systems (e.g., LLMs) at scale?  
     - **Test**: Attempt to verify a safety property (e.g., "never output a harmful instruction") for a 1B-parameter LLM against a threat model (adversaries with ≤ *C* compute). Use state-of-the-art tools (e.g., abstract interpretation, SMT solvers). Measure tightness: bound the fraction of inputs *not* covered by the guarantee.  
     - **Worst-case prediction**: Success: non-vacuous bounds (e.g., ≥90% coverage) achievable.  
     - **Average-case prediction**: Failure: bounds either vacuous (coverage ≈0%) or heuristic (rely on unverified simplifications).  

  2. **Crux: Threat Model vs. Distribution as Anchors**  
     - **Question**: Which is more robust to *unknown unknowns*: a threat model (bounded adversary) or a distribution (estimated from data)?  
     - **Test**: Deploy an AI system in a high-stakes setting (e.g., science agent). After deployment, introduce an unanticipated input class (e.g., novel adversarial attack). Measure failure rates:  
       - *Group A*: Systems with average-case guarantees (trained/tested on pre-deployment distribution).  
       - *Group B*: Systems with worst-case guarantees (verified against threat model excluding the novel attack).  
     - **Worst-case prediction**: Group B fails less catastrophically (threat models bound capabilities; novel attacks often exploit "nearby" weaknesses).  
     - **Average-case prediction**: Group A fails less (distributions capture real-world entropy; novel attacks are outliers, minimized via distributional robustness).  

  3. **Crux: Minimax vs. EU Under Catastrophe**  
     - **Question**: Can bounded EU (finite negative utility for catastrophe) replicate minimax behavior without absurd tradeoffs?  
     - **Case**: Choose between two medical AIs:  
       - *AI-X*: Expected lives saved = 1M; P(catastrophe) = 10⁻⁶.  
       - *AI-Y*: Expected lives saved = 900K; P(catastrophe) = 0.  
     - **Test**: Fix *U*(catastrophe) = -10¹² (disutility equivalent to 1B deaths). Calculate EU for both. Does EU reject AI-X?  
     - **Worst-case prediction**: EU accepts AI-X (10⁻⁶ × -10¹² = -1M; net utility ≈ 0), which is unacceptable. Minimax rejects AI-X.  
     - **Average-case prediction**: EU rejects AI-X if *U*(catastrophe) is sufficiently negative (e.g., -10¹⁵). Minimax is unnecessary.  

  ---

  #### **4. Verbal Dispute Report**  
  We diagnose two entangled disputes:  
  - **Verbal**: The term "**safety result**" is honorific. The worst-case camp restricts it to worst-case guarantees; the average-case camp allows distributional statements. *Resolution*: Use qualified terms ("worst-case safety result," "average-case safety assurance").  
  - **Substantive**: The core disagreement is **epistemological**:  
    - The worst-case camp believes safety requires *robustness to adversarial optimization*, which demands universal quantifiers over threat models.  
    - The average-case camp believes *learning under distribution shift* is fundamental, and worst-case guarantees are illusions without data-validated foundations.  
  This is not reducible to semantics: it reflects divergent beliefs about whether AI risk stems primarily from **malicious actors** (favoring threat models) or **complexity/ignorance** (favoring distributions).  

  ---  
  *Document drafted for ML engineers by consensus process. Definitions:  
  - **Threat model**: Explicit bounds on adversary capabilities (e.g., compute, access, knowledge).  
  - **Distribution**: Data-generating process, specified mathematically or via a dataset.  
  - **Vacuous guarantee**: One that holds trivially (e.g., "safe against adversaries who cannot compute 2+2").  
  - **Non-vacuous**: Guarantee with practical bite (e.g., "safe against all gradient-based attacks with ≤ *L₂* perturbation 0.1").*
