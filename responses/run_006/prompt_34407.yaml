answer: |-
  Your inquiry cuts to the heart of a profoundly slippery problem—one where intuitions fracture across cases, and theories often shine brightly in one scenario only to crumble in another. Before constructing or adopting any theory, you’re wise to demand a rigorous specification of what it *must* achieve. Let me lay out the full set of desiderata, drawing on your cases and expanding where necessary, with the reasoning behind each. I’ll be candid about tensions, especially the fault line between making and reception.

  First, any adequate account **must explain the dramatic value shift upon revelation of authenticity**. The van Meegeren case is paradigmatic: a work celebrated as a Vermeer masterpiece collapses in value and status when exposed as a 20th-century forgery. Conversely, a work dismissed as "school of" or a copy, when reattributed to the master (e.g., a "new" Caravaggio discovered), soars in value and critical esteem. The theory must explain why knowledge *about* the object’s origin, not its perceivable qualities, directly causes this seismic shift. This rules out accounts valuing only immediate aesthetic experience or formal properties.

  Second, it **must account for the rejection of perfect physical duplicates**. Even a molecule-for-molecule replica of the *Mona Lisa*, created without any connection to da Vinci, would be deemed less valuable than the original hanging in the Louvre. This holds even if no human (or machine) could ever detect a difference. Consequently, the theory cannot rely solely on the physical object’s intrinsic properties. Materialism fails here.

  Third, it **must accommodate arts where multiplicity is inherent without collapsing the original/copy distinction entirely**. In cast sculpture (e.g., Rodin’s bronzes), printmaking (e.g., Rembrandt’s etchings), or digital art (NFTs notwithstanding), there are multiple "originals" or authorized instances. Yet, within these, distinctions persist: artist’s proofs vs. later casts, the plate vs. the print, the master file vs. a screenshot. The theory must explain why *some* multiplicity is permissible or even defining, while *other* copies (forgeries, unauthorized reproductions) are devalued. It must respect that "originality" here isn’t singular but remains tied to authorized genesis.

  Fourth, it **must explain why forgeries can acquire value as historical artifacts in their own right**. Van Meegeren’s forgeries, once exposed, lost their "Vermeer" value but gained value as fascinating, skillful frauds with their own stories. The theory must allow for this value transformation, showing that the *kind* of value changes (historical curiosity vs. artistic masterpiece), and why the same object can occupy different value categories based on attributed history.

  Fifth, it **must acknowledge the role of reception history and cultural context, without reducing value entirely to it**. A painting revered for centuries as a masterpiece accrues layers of meaning, interpretation, and influence. Its status isn’t *just* about its creation moment. The theory must explain why its journey through culture matters—why a newly discovered, identical "twin" by the same artist wouldn’t instantly share the canonical status of its long-celebrated sibling. However, it cannot make value *purely* contingent on reception, lest it struggle to explain the initial shock of the van Meegeren revelation or the excitement of a reattribution.

  Sixth, it **must handle imperceptible differences**. We care about authenticity even when we cannot see, feel, or scientifically distinguish the original from the forgery (as in the perfect duplicate case). This reinforces that the value difference is fundamentally relational or historical, not perceptual. Any theory relying on aura, presence, or unique material essence detectable only subconsciously risks mystification or unfalsifiability.

  Seventh, it **must be consistent with findings from adjacent fields**:
  *   **Conservation Science:** Physical deterioration and restoration practices matter. A painting isn’t valued solely as an abstract idea; its material trajectory is part of its history. A theory denying any significance to the physical object’s unique biography contradicts why we conserve the specific canvas Leonardo painted on.
  *   **Anthropology/Economics:** The intensity of the original/forgery distinction varies culturally and historically. A viable theory must explain why this distinction is particularly strong in post-Renaissance Western art markets and connoisseurship, without rendering it arbitrary. It should also be compatible with observed behaviors like the endowment effect (valuing what one owns more highly).
  *   **Philosophy of Mind/Action:** If the theory invokes artist’s intention (a common move), it must handle cases where intentions are unclear, changed, or collaboratively distributed without collapsing the value distinction.

  Eighth, it **must distinguish between different *kinds* of "copies" and explain their varying status**. An authorized reproduction (e.g., a museum poster), a student’s faithful copy made for study, a deliberate forgery intended to deceive, and a later artist’s appropriation (e.g., Warhol’s *Mona Lisa*) are all "copies" but elicit vastly different evaluations and concerns. The theory must capture these nuances, particularly the moral dimension often attached to deception in forgery.

  **Now, the conflicts and the theory-killer:**

  The most significant tension lies between the **making-history** requirements (Desiderata 1, 2, 3, 8) and the **reception-history** requirements (Desiderata 4, 5, 7). Making-focused theories (e.g., those emphasizing the artist’s unique creative act, intentionality, or causal history of production) excel at explaining the rejection of duplicates and the shock of forgery revelation. However, they often stumble on Desideratum 5: why a long-revered work’s cultural resonance matters independently, or why a newly discovered identical twin lacks it. They also struggle slightly with Desideratum 4 (forgery-as-artifact value), as the object’s value here stems from its *successful deception*, a reception phenomenon.

  Reception-focused theories (e.g., those emphasizing institutional validation, cultural narratives, or provenance chains) handle Desiderata 4 and 5 beautifully, explaining value shifts based on changing narratives and the artifact value of exposed forgeries. But they are severely challenged by Desiderata 2 and 6: why a *perfect* duplicate, even if integrated into the same narrative or institution, wouldn’t be valued equally. If value is purely constituted by reception, why wouldn’t the Louvre’s perfect *Mona Lisa* replica, once accepted and displayed, accrue the same value over time? Making-history seems indispensable for this distinction.

  **The single requirement that does the most to exclude popular theories is Desideratum 2: The rejection of perfect physical duplicates.** This devastates:
  *   **Materialist/Aesthetic Theories:** If value resides in the object’s form or material, a perfect duplicate should be equally valuable. It isn’t.
  *   **Pure Reception/Institutional Theories:** If value is bestowed by belief, narrative, or institutional acceptance, a perfect duplicate successfully introduced into the correct context should become equivalent. The intuition rejects this.
  *   **Romantic "Aura" Theories:** Appeals to a mystical presence unique to the original founder on the imperceptibility criterion (Desideratum 6). If we can’t perceive it, why does it matter *causally* to value? And the duplicate would presumably lack this aura, demanding an explanation beyond the physical.
  *   **Simple Intention Theories:** If the value is solely in the master's *intention* realized in the object, a perfect duplicate realizes identical formal properties, seemingly fulfilling the intention just as well. Why the difference?

  Can an account satisfying *both* making and reception demands exist? It’s extraordinarily difficult but not impossible. A hybrid theory is likely necessary, one where the *primary* value anchor is the specific historical act of making by the artist (or authorized workshop/protocol), grounding the rejection of duplicates and the shock of forgery. *Upon this foundation*, reception history accretes layers of cultural meaning, influence, and narrative significance (Desideratum 5), which become part of the object’s value but are *dependent* on its authentic genesis. The exposed forgery loses its foundational value (connection to the master) but gains a *new*, parasitic value based on its reception history as a deception (Desideratum 4). The duplicate lacks the foundational value entirely and cannot accrue the *same* dependent reception value because its genesis is known/fabricated. This preserves the core distinction while accommodating reception’s undeniable role. The devil, of course, is in specifying how these layers interact causally and constitutively without circularity.

  This map of desiderata reveals just how treacherous the terrain is. Any theory neglecting one of these pillars will fail somewhere critical. Your instinct to clarify the demands before surveying theories is sound – it reveals why this problem remains a graveyard of elegant but incomplete solutions. The conflict between the object’s birth and its life in the world is the crux upon which most theories falter.
