prompt: |-
  You are an expert on philosophical pedagogy who also knows the ins and outs of two-dimensional semantics — Chalmers, Jackson, Stalnaker, the whole debate. Think carefully about the dependency structure of the ideas before you lay out the plan.

  I'm a PhD student TAing an upper-level undergrad philosophy of language course. Next week I have to teach two-dimensional semantics in one 75-minute session. The students have already done Kripke — they've read Naming and Necessity, they can parrot back the necessary a posteriori and rigid designation, and they've done some basic possible-worlds semantics (they know what an intension is, at least formally: a function from worlds to extensions). But 2D always goes badly in this course. The evals from previous years show students walking away thinking it's just "there are two kinds of possible worlds" or "primary intension is what's in your head and secondary intension is what's in the world."

  I don't need you to explain 2D semantics to me. I know the machinery. I need a teaching plan: the sequence of ideas, the one example that carries the whole session, and — crucially — the misconceptions theyll form and exactly where in the timeline I should head each one off.

  Specific constraints:
  - I have to make the "considered as actual" vs "considered as counterfactual" distinction land. This is the thing that always fails. They nod along when I say it but then five minutes later theyre treating primary intension as just "what I think the word means" and secondary as "what it really means."
  - They'll confuse primary intension with epistemic possibility and secondary with metaphysical possibility. I need to forestall this explicitly.
  - I need them to see why we need the whole apparatus, not just "rigid designation plus some epistemology." The motivation has to be clear before I start drawing matrices or I'll lose them.
  - I'm not sure whether to use "water" or "Hesperus" as the running example. Tell me which one and why, and also tell me what the example needs to have and what it must not have (so I understand the choice).
  - They tend to get lost when the "actually" operator shows up, so I need to place that carefully in the sequence.
  - I have a whiteboard and I'll draw the 2×2 matrix, but I need to know when to draw it — too early and its meaningless, too late and its just a summary they copy down.

  Plan the arc: what do I put on the board at minute 1, what's the pivot point around minute 30, what do I do at minute 60 to consolidate. And give me the one question I can ask in the last five minutes that would show me whether someone actually understands the two-dimensional framework or is just mapping it onto the Kripkean machinery they already know.

  Also: which parts of 2D semantics should I openly refuse to get into at this level? I'm thinking the debate between epistemic and contextual 2D, and the whole question of whether 2D gives you a semantics for attitude ascriptions. But maybe there's something else I should explicitly set aside.
reasoning: |-
  Okay, the user is a PhD student TA teaching an upper-level undergrad philosophy of language course. They need to teach two-dimensional semantics in one 75-minute session. The students already know Kripke, possible-worlds semantics, intensions, necessary a posteriori, and rigid designation. But past evals show students misunderstand 2D as just two kinds of worlds or confuse primary intension with "what's in your head" and secondary with "what's in the world."

  The user wants a teaching plan focusing on the sequence of ideas, a central example, misconceptions to preempt, and when to introduce the matrix. Key challenges include making the "considered as actual" vs. "counterfactual" distinction land, preventing confusion between epistemic/metaphysical possibility, and showing why the whole apparatus is needed beyond rigid designation plus epistemology.

  The user also asks whether to use "water" or "Hesperus" as the running example. Water is better because it avoids complications with identity statements, better illustrates the a posteriori necessity, and clearly separates epistemic and metaphysical dimensions. Hesperus could lead to conflation issues since it's an identity statement.

  The main challenge is the "considered as actual" vs. "counterfactual" distinction. Students often reduce this to a subjective/objective split. To counter this, the user should stress the objective nature of both intensions and use the matrix to show how the same world plays different roles.

  The lesson arc should start by reviewing Kripke's necessary a posteriori to show the gap between epistemic and metaphysical possibility. Then introduce the epistemic puzzle: how can a necessary truth be a posteriori? This motivates 2D semantics. Use the water example throughout, with the matrix introduced after establishing the motivation.

  Misconceptions to address:
  1. Primary as "what I think," secondary as "what it is": Emphasize that both are objective, differing only in how worlds are considered.
  2. Confusing epistemic/metaphysical possibility: Clarify that primary intension deals with epistemic scenarios, not metaphysical possibilities of worlds.
  3. Treating 2D as just rigid designation + epistemology: Highlight how rigid designation alone doesn't resolve the epistemic puzzle.

  The "actually" operator should be introduced later, perhaps when discussing secondary intensions, to avoid confusion. Set aside debates on epistemic vs. contextual 2D, attitude ascriptions, and reduction programs. Focus purely on how 2D handles the necessary a posteriori.

  End with a diagnostic question: "If we discovered that XYZ is actually water, would 'water is H2O' be necessarily true?" This tests understanding of how primary and secondary intensions interact across scenarios.
answer: |-
  Here's a meticulously structured 75-minute lesson plan focusing on conceptual dependencies, preempting misconceptions, and ensuring the "considered as actual" distinction lands. The arc prioritizes **motivation before mechanics** and uses **water** as the central example.

  **Why Water (Not Hesperus):**
  *   **Use:** "Water is H₂O"
  *   **Why:** 
      *   Involves a **natural kind term**, central to Kripke's necessary a posteriori.
      *   Clearly separates **epistemic doubt** ("*Could* it not be H₂O?") from **metaphysical necessity** ("*Is* it necessarily H₂O?").
      *   **Crucially:** Allows a clean distinction between scenarios (XYZ-world *considered as actual*) and counterfactuals (H₂O-world *considered as counterfactual*).
  *   **Avoid Hesperus:**
      *   Identity statements ("Hesperus is Phosphorus") risk conflating the two-dimensional analysis with Frege's Sense/Reference, which Kripke rejects.
      *   The epistemic scenario for "Hesperus is Phosphorus" is less intuitive than for "water is H₂O" (doubting identity vs. doubting composition).
      *   It obscures the "considered as actual" role for the *environment* defining the kind.

  **Core Misconceptions & Preemption Strategy:**

  1.  **Primary = "What I think", Secondary = "What it is" / "The Real Meaning":**
      *   **Preempt:** Stress *repeatedly* that **BOTH** intensions are objective, truth-conditional components of meaning. The difference is **ONLY** in *how a world is considered*: as actualized (fixing reference) or as counterfactual (evaluating counterfactual truth). Hammer the *role* of the world, not the *content* of the mind.
  2.  **Primary = Epistemic Possibility, Secondary = Metaphysical Possibility:**
      *   **Preempt:** Explicitly state: "Primary intension tracks scenarios that are *epistemically possible* **for us, now**. Secondary intension tracks what is *metaphysically necessary/possible* **given how our world actually is**. The primary intension *itself* isn't 'epistemic possibility'; it's a function defined over scenarios representing epistemic possibilities."
  3.  **2D is just "Rigid Designation + Epistemology":**
      *   **Preempt:** Show *why* rigidity alone doesn't solve the puzzle of how "Water is H₂O" is necessary yet knowable only a posteriori. Rigidity tells us *how* it designates across worlds *once fixed*, but not *how the fixing happens* or why we needed empirical info to learn the necessity. 2D provides the *structure* for that fixing process.

  **Set Aside Explicitly (Announce at Start):**
  1.  **The Epistemic vs. Contextual 2Dism Debate:** "We're presenting the core *framework* motivating both sides, not adjudicating whether primary intensions are purely epistemic or have contextual elements."
  2.  **Attitude Ascriptions:** "We won't be applying this to 'believes that' today; that's a complex extension."
  3.  **Metaphysical Reduction Programs:** "We're using 2D to *analyze meaning and necessity*, not necessarily to reduce consciousness or other phenomena (though that's a motivation for some)."
  4.  **Deep Technicalities:** E.g., centered worlds, granularity of scenarios, full formal semantics for "actually". Stick to intuitive scenarios.

  **The Lesson Arc (75 Mins):**

  **(0-15 mins: MOTIVATION - The Kripkean Puzzle & The Gap)**
  *   **Board:** `Kripke: "Water is H₂O" is Necessary A Posteriori.`
  *   **Review:** "Kripke showed 'Water is H₂O' is metaphysically necessary (assuming rigidity & actual composition). But we *learned* this empirically. How is this possible?"
  *   **The Gap:** "Before discovery, it was *epistemically possible* that water wasn't H₂O (e.g., XYZ). After discovery, we know it's *metaphysically necessary* that water is H₂O. How does meaning bridge this gap? How can a meaning entail a necessary truth that requires empirical discovery?"
  *   **Rigidity's Limitation:** "Rigidity tells us 'water' picks out H₂O in every counterfactual world. Great! But *why* does it pick out H₂O? *How* was it fixed to H₂O? Rigidity assumes reference is fixed; it doesn't explain the *fixing* process or why empirical info was needed to discover the *necessity*."
  *   **Core Question:** "**We need an account of meaning that explains both the a priori aspects (what fixes reference given a world *as actual*) and the a posteriori necessities (the rigid designation once fixed).** This is why we need 2D semantics." *(Plant the seed: Meaning has two jobs!)*

  **(16-35 mins: INTRODUCING THE TWO DIMENSIONS - "Considered as Actual")**
  *   **Board:** `Worlds Considered AS ACTUAL vs. AS COUNTERFACTUAL`
  *   **Key Move:** "Forget 'kinds of worlds'. Think about *roles* a single world can play in evaluating meaning and truth."
  *   **Considered as Actual (The Reference-Fixing Role):**
      *   "Imagine a world W *as if it were the actual world*. What counts as 'water' *in W*? What does the word 'water' *refer to* **if W is actualized**? This depends on the *descriptive features used to fix the reference* in W. For 'water', it's something like 'the clear, drinkable liquid in oceans and lakes, etc., *in W*'."
      *   **Example (XYZ World):** "Consider Twin Earth (W_te) *as actual*. In W_te, the stuff in oceans/lakes is XYZ. If *this* were actual, 'water' would refer to XYZ. The primary intension of 'water' maps W_te *considered as actual* to XYZ."
      *   **Crucial Point:** "This is **objective**. It's not *my belief* about W_te. It's a fact about what 'water' *would refer to* given how reference is fixed *if that world were actual*. This explains the epistemic possibility: Before discovery, W_te *considered as actual* was live for us; 'water' *could have* referred to XYZ."
  *   **Preempt Misconception #1 & #2:** "Notice: The primary intension isn't 'what's in my head'. It's an objective function defined by the conventions of reference-fixing for the term. It answers 'What *would* it refer to *if* this world is actual?' It tracks *scenarios compatible with our reference-fixing knowledge* (epistemic possibility), but the function itself is a semantic feature."

  **(36-50 mins: INTRODUCING THE SECOND DIMENSION & THE MATRIX)**
  *   **Board:** **DRAW THE 2x2 MATRIX NOW.**
      *   Label Rows: `World Considered as Actual (w_a)` -> [Our World (H₂O), Twin World (XYZ)]
      *   Label Columns: `World Considered as Counterfactual (w_c)` -> [Our World (H₂O), Twin World (XYZ)]
      *   Label the two intensions: Primary (Row Headers), Secondary (Diagonal/Depends on Row).
  *   **Considered as Counterfactual (The Rigid Evaluation Role):**
      *   "Now, hold fixed our *actual* world (W_actual - H₂O). Consider other worlds *as counterfactual situations*. What does 'water' refer to *in those counterfactual situations*? **Given that 'water' is rigidly designated to H₂O in *our* actual world**, it picks out H₂O in *every* counterfactual world, *even Twin Earth*!"
      *   **Example (Our World Actual):** "In W_actual (H₂O) *as actual*, 'water' rigidly designates H₂O. So, when we consider Twin Earth (W_te) *as counterfactual*, we ask: 'In W_te, what is the H₂O (the stuff designated by our word 'water') like?' It might be frozen or absent, but 'water' still refers to H₂O there. The secondary intension of 'water' (given our world is actual) is the constant function mapping every w_c to H₂O."
      *   **The Matrix Populated:**
          *   Row 1 (w_a = Our H₂O World):
              *   w_c = Our H₂O World: `Water is H₂O` -> **T** (H₂O is H₂O)
              *   w_c = XYZ World: `Water is H₂O` -> **T** (Rigidity: Refers to H₂O, even in XYZ world)
          *   Row 2 (w_a = Twin XYZ World):
              *   w_c = Our H₂O World: `Water is H₂O` -> **F** (If *XYZ World* is actual, 'water' refers to XYZ. In *this* counterfactual (H₂O world), XYZ is H₂O? False. XYZ ≠ H₂O.)
              *   w_c = XYZ World: `Water is H₂O` -> **F** (If XYZ World is actual, 'water' refers to XYZ. In XYZ World, XYZ is H₂O? False.)
      *   **Crucial Point:** "The secondary intension **depends on which world is considered actual**. It's the intension *after* reference is fixed *in that actual world*."
  *   **Preempt Misconception #3:** "See how rigidity *is part of* the secondary intension? But the primary intension (the rows) explains *how* rigidity gets set up differently depending on which world is actualized. 2D doesn't replace rigidity; it embeds it within a broader account of meaning that explains the *origin* of rigidity and the a posteriori necessity."

  **(51-65 mins: CONSOLIDATION - Necessity, Apriority, and "Actually")**
  *   **Board:** `Necessity: True at all w_c *for fixed w_a*` / `Apriority: True for all w_a *at w_a*`
  *   **Necessity (Metaphysical):** "A statement S is necessary **relative to a world considered as actual** iff its secondary intension (for that w_a) is true at *all* worlds considered as counterfactual. For 'Water is H₂O' with *our world* as actual: Look down Column 1 (w_a fixed as ours) - True at both counterfactual worlds? **Yes** (T, T). Necessary! But look down Column 1 *with w_a as Twin World*: False at both counterfactual worlds? **Yes** (F, F). So it's *not* necessary *if Twin World is actual*. Necessity is world-relative, but rigid designation makes it necessary *given our actual world*."
  *   **Apriority:** "A statement S is a priori iff its primary intension is true for *all* worlds w_a *considered as actual, evaluated at w_a itself* (i.e., the diagonal: where w_a = w_c). 'Water is H₂O' at diagonal: (Our World: T) & (Twin World: F). **Not** true for all w_a at w_a! So a posteriori. 'Water is water' *would* be T on the diagonal (trivially). A priori!"
  *   **Introducing "Actually":**
      *   **Placement:** Here, *after* the matrix is understood.
      *   **Role:** "The word 'actual' in 'actually water is H₂O' rigidifies. It means: *Look at the world fixing the reference (this one!), and see what 'water' rigidly designates there (H₂O), and say that stuff is H₂O*. This statement ('Actually, water is H₂O') **is** a priori! Its primary intension *is* true on the diagonal: For *any* w_a considered as actual, 'actually water' refers to whatever fixes the reference *in w_a*, so 'actually water is H₂O' is true in w_a only if the reference-fixer in w_a *is* H₂O. But in the XYZ world considered as actual, the reference fixer is XYZ! So it's **F** on the diagonal. It's contingent a priori!" (Just mention this; don't dive deep unless asked. Emphasize "actually" points back to the reference-fixing world).
  *   **The Big Picture:** "2D semantics provides a unified framework where:
      1.  **Primary Intension (Meaning as Reference-Fixing):** Explains cognitive significance, epistemic possibility, a priori knowledge.
      2.  **Secondary Intension (Meaning as Rigid Designation):** Explains modal profile, necessary a posteriori truths.
      3.  **The Diagonal:** Explains (contingent) a priori truths involving 'actually'."

  **(66-75 mins: DIAGNOSTIC QUESTION & WRAP-UP)**
  *   **Diagnostic Question (Ask at ~70 mins):** "**Suppose we discovered that the clear, drinkable liquid in *our* oceans and lakes is actually XYZ, not H₂O. Would the statement 'Water is H₂O' be metaphysically necessary? Why or why not?**"
  *   **Why it Works:** This tests the core distinction.
      *   **Correct Answer:** "No. If our world *is* the XYZ world (considered as actual), then 'water' rigidly designates XYZ. So 'Water is H₂O' would mean 'XYZ is H₂O', which is false in all counterfactual worlds (including ones with H₂O). Its secondary intension (relative to this XYZ-actual world) would be constantly false, hence not necessary."
      *   **Incorrect Answers Reveal Misconceptions:**
          *   "Yes, because rigid designation..." -> Misses dependency of secondary intension/rigidity on which world is actual.
          *   "No, because it wouldn't be H₂O..." -> Might be correct but for wrong reason (e.g., confusing with epistemic).
          *   "It depends on what we believe..." -> Reduces to subjectivism.
  *   **Wrap-Up (2 mins):** Reiterate the two roles of worlds ("considered as actual" vs. "counterfactual"), the two jobs of meaning (reference-fixing vs. rigid designation), and how 2D resolves the Kripkean puzzle of necessary a posteriori truths by separating these dimensions. Emphasize both intensions are objective semantic features.

  **Key Pivot Points:**
  *   **Minute 1:** Board = Kripke's Puzzle. Establish the *problem*.
  *   **Minute 15:** Board = "Worlds Considered AS ACTUAL". Shift to the *key conceptual distinction*.
  *   **Minute 30:** Introduce the **Matrix** immediately after explaining Primary Intension, *before* explaining Secondary Intension. The matrix *shows* the dependency.
  *   **Minute 60:** Board = Definitions of Necessity & Apriority using the matrix/diagonal. Consolidate the framework's payoff.
  *   **Minute 70:** Ask the **Diagnostic Question**.

  This plan forces engagement with the "considered as actual" role by making it the *starting point* for defining meaning (primary intension) and showing how the secondary intension *depends* on it. The water example, matrix timing, and diagnostic question are chosen specifically to combat the ingrained misconceptions you've identified. Good luck!
