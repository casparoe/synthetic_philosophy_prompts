prompt: |-
  I'm on parental leave with my first kid, and I've gotten weirdly fixated on a category of actions I keep noticing: things people praise you for even though nobody would say you were required to do them. Change a blowout at 3am and you're a great dad; refuse and, at most, you're a little disappointing. That gap between 'good' and 'required' has sent me down the supererogation rabbit hole, and I'm about to start reading the actual theories — the classic saint-and-hero line, the people who think the whole category is incoherent, the consequentialists trying to make room for it. Before I read any more of the the theories, I want the spec: what should I be asking of a theory of supererogation?

  Write me the desiderata. For each one, give the case or consideration that forces it, and say whether it's non-negotiable or just a preference of one camp. I want at least these covered: the distinction between good-but-not-required and merely permissible, with a case that keeps them apart; the paradox any theory has to dissolve (if an act is morally best, why doesn't 'ought' apply to it?); the asymmetry between good-beyond-duty acts and bad-but-not-forbidden ones, if that asymmetry is real (and if it isn't, say why the denial is itself a requirement on a theory); and the psychological constraints on doing a supererogatory act while thinking of it as optional, since that thought might ruin it. Flag any pair of these you think can't be jointly satisfied — that's the part I most want. Format: exactly five numbered items, each a sentence or two, no introduction or conclusion. Four items should be the desiderata; the fifth should say how confident you are in the list overall and which single requirement you're least sure is really a requirement.
reasoning: |-
  Okay, the user is on parental leave and has become fascinated with supererogation—actions that are praiseworthy but not required. They've noticed this in parenting scenarios, like changing a diaper at 3am versus refusing. Now, they're about to dive into theories and want a set of desiderata to evaluate them. Their query is detailed and structured, so they're clearly looking for a rigorous framework.

  First, I need to identify the key elements they mentioned: distinguishing good-but-not-required from merely permissible, the paradox of why the "best" action isn't obligatory, asymmetry between supererogatory and suberogatory acts, and the psychological constraint where seeing an act as optional might undermine its moral value. They also want to know if any of these conflict. 

  Starting with the distinction requirement. The user gave the example of changing a diaper: praised if done, not condemned if skipped. I need a case that clearly separates praiseworthy optional acts from neutral ones. Something like donating a kidney versus minor help. This seems non-negotiable; without it, supererogation collapses into duty or indifference.

  Next, resolving the paradox. If an act is the best possible, why isn't it obligatory? This is a core challenge. Theories must explain why "ought" doesn't always attach to the optimal choice. Classic utilitarians struggle here, so any theory needs a solution, maybe by introducing agent-centered options or constraints. This is probably non-negotiable for the concept to make sense.

  Then, asymmetry. Is there a parallel for bad-but-not-forbidden acts? The user questions if asymmetry exists. If a theory denies it, that denial should be justified. For example, failing to donate a kidney isn't blameworthy like committing a minor offense. Some theories might reject asymmetry, but they must address why suberogation isn't symmetrical. This could be contingent on the theory's framework.

  Psychological constraint: Can you perform a supererogatory act while seeing it as optional without diminishing its value? If motivation shifts from duty to optional goodness, does that affect praiseworthiness? This might be more of a preference; some theories (like virtue ethics) could handle it differently than deontological ones. It's tricky because overemphasizing optionality might lead to laxity, but requiring duty-like commitment could erase the supererogatory nature.

  Now, checking for conflicts. The paradox and asymmetry might clash. For instance, justifying why the best act isn't obligatory (paradox) could lead to allowing some suboptimal acts, but then explaining why there's no symmetric "suberogation" might be harder. Also, the psychological constraint and the distinction might conflict: if you must see the act as optional to be supererogatory, but thinking it's optional might reduce your moral motivation, creating tension.

  The user's deeper needs: They're a new parent, so real-world applicability matters. They might be grappling with guilt or societal expectations in parenting. The theory should resonate with personal experiences, like balancing self-sacrifice and personal limits. They also want clarity before reading theories to avoid bias, showing a desire for independent critical thinking. 

  Confidence level: Overall, the list covers core aspects. The asymmetry requirement is the least certain—some philosophers reject it, and theories might handle it variably without invalidating supererogation. Highlighting this uncertainty is key for the user's exploration.
answer: |-
  1.  **Distinguish Praiseworthy Optional from Merely Permissible:** A theory must sharply separate actions that are morally good but not required (and praiseworthy) from those that are merely permissible (morally neutral, neither praiseworthy nor blameworthy). *Case:* Donating a kidney to a stranger is widely seen as supererogatory (praiseworthy but not required), while refraining from giving a small, insignificant amount of spare change to charity is merely permissible (not blameworthy, but not praiseworthy either). This distinction is **non-negotiable**; its collapse eliminates supererogation entirely.
  2.  **Resolve the "Paradox of Supererogation":** A theory must explain why an act can be the morally best available option without it being morally obligatory ("If it's best, why isn't it required?"). *Consideration:* Utilitarianism seemingly implies the best act *is* required, erasing supererogation. Any viable theory must provide a coherent rationale for why morality sometimes permits agents to choose a less-than-best option without blame, even when a better option exists (e.g., via agent-centered prerogatives, constraints, or satisficing). Resolving this paradox is **non-negotiable** for the concept's coherence.
  3.  **Account for (or Deny) the Asymmetry:** A theory must either explain the apparent asymmetry between supererogatory acts (good beyond duty, praiseworthy) and suberogatory acts (bad but not forbidden, blameworthy), or provide a principled reason for denying this asymmetry exists. *Case:* While donating a kidney is supererogatory (praiseworthy, not required), *failing* to donate isn't typically seen as symmetrically blameworthy-subergatory in the same way committing a minor, non-forbidden offense (like a very minor white lie of convenience) might be. If a theory *denies* asymmetry (claiming all non-forbidden bad acts are blameworthy-subergatory), this denial must be a **non-negotiable consequence** of its core principles (e.g., strong maximizing consequentialism). Otherwise, explaining the asymmetry is a **key requirement**.
  4.  **Handle the "Motive/Optionality" Tension:** A theory must address the psychological constraint that performing an act *as* supererogatory (i.e., believing it is genuinely optional) should not inherently undermine its praiseworthiness or moral goodness. *Consideration:* If an agent believes "I *must* do this heroic act or I'm failing morally," the act might seem less supererogatory and more like perceived duty. Conversely, thinking "This is purely optional, I get no moral credit either way" might erode the motivation for costly sacrifice. A theory needs resources to explain how an act can be both understood as optional *and* be performed for morally worthy reasons (e.g., benevolence, commitment) that merit praise. This is a **significant requirement**, though its specific handling (e.g., focus on motive vs. objective status) may vary by camp.
  5.  **Confidence & Weakest Link:** I am **highly confident** these four desiderata capture the core conceptual demands for evaluating theories of supererogation, grounded in the puzzles and cases you outlined. The requirement I am **least sure** is universally *non-negotiable* is **Accounting for the Asymmetry (3)**. While the *need* to address it (either by explaining or denying it) is crucial, the *specific outcome* (asymmetry exists vs. symmetry holds) is more contingent on a theory's foundational commitments (e.g., deontological vs. maximizing consequentialist) than the absolute necessity of the distinction (1) or resolving the paradox (2). Some coherent theories might reject asymmetry without collapsing the concept entirely.
