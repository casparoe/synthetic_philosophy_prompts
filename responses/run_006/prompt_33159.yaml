  I'm a retired neurobiologist — spent forty years in the lab, mostly on motor planning and the basal ganglia, reward prediction, that sort of thing. I've recently gotten into philosophy, and I came across Kavka's toxin puzzle. You know the one: a billionaire offers you a million dollars if at midnight tonight you intend to drink a toxin tomorrow that will make you sick for a day. The money is deposited the moment you form the intention — you don't actually have to drink the stuff. The puzzle is that you can't form the intention, because you know that once you have the money, you'll have no reason to go through with it.

  Now, to me this smells like something my field has been chewing on for decades — the relationship between planning and execution, the way the brain commits to a course of action, the distinction between preparatory activity in premotor cortex and the actual motor command. So here's what I want: restate Kavka's toxin puzzle in the vocabulary of neurobiology — motor plans, efference copies, the basal ganglia's role in action selection, reinforcement learning, the whole toolkit. Translate the puzzle as faithfully as you can. Then give me the residue report: what parts of the puzzle map cleanly onto neural mechanisms we actually understand, what parts you had to fudge, and what parts of the philosophical debate have no neural counterpart at all. I want to know whether my intuition that "this is just a problem about commitment mechanisms in a distributed action-selection system" is right, or whether the philosophers are onto something that my vocabulary can't capture.
