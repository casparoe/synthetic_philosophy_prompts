  ### Discriminating Between Rules with a New Pair
  Since Rules A and B both predict $80 sure in the new pair, we need a **discriminating pair** where they disagree. The goal is to:
  - Test if your friend uses **Rule A (lexicographic worst-outcome)** or **Rule B (probability weighting)**.
  - Avoid certainty (to mute the certainty effect) and ensure worst outcomes differ.

  #### Proposed Discriminating Pair:
  - **Option X**: 1% chance of $1000, 99% chance of $0  
    *EV = 10, worst outcome = $0*.
  - **Option Y**: 50% chance of $21, 50% chance of $1  
    *EV = 11, worst outcome = $1*.

  | Rule          | Prediction | Reasoning |
  |---------------|------------|-----------|
  | **Rule A (Lexicographic)** | **Option Y** | Worst outcome: $1 > $0 → Choose Y. |
  | **Rule B (Probability Weighting)** | **Option X** | 1% chance of $1000 is overweighted (feels like 5–10%), making X appear more valuable. Linear value: w(0.01) × 1000 ≈ 50–100 > w(0.5) × 21 ≈ 10.5. |
  | **Anticipated Regret** | Ambiguous | Regret if X yields $0 ("I missed $1") vs. regret if Y yields $1 ("I missed $1000"). |

  **Why this pair?**
  - Rule A chooses Y due to better worst outcome ($1 > $0).
  - Rule B chooses X due to overweighting the 1% chance of $1000.
  - Past choices don't test extreme probabilities (1%), so this reveals nonlinear weighting.

  #### Expected Outcomes:
  - If she chooses **Y**, it supports **Rule A**.
  - If she chooses **X**, it supports **Rule B**.

