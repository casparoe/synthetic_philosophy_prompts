       - **Choice 4**: Worst outcomes tied ($0 = $0) → Compare EVs: 80 > 75 → Choose 20% $400.

  2. **Probability-Weighting with Certainty Effect (Rule B)**:
     - **Rule**: Use a Prospect Theory-like model:
       - **Certainty effect**: Sure gains are overweighted.
       - **Probability weighting**: Small probabilities (e.g., 1–20%) are overweighted, while moderate/large probabilities (e.g., 80–100%) are underweighted.
     - **Fits Choices**:
       - **Choice 1**: Certainty of $100 is overvalued; 1% chance of $0 is overweighted → Choose $100 sure.
       - **Choice 2**: 10% chance of $120 is overweighted (more than linear 10%), and no certainty → Choose 10% $120.
       - **Choice 3**: Certainty of $300 is overvalued; 20% chance of $0 is overweighted → Choose $300 sure.
       - **Choice 4**: 20% chance of $400 is overweighted (more than linear 20%) → Choose 20% $400.

  3. **Anticipated Regret (Psychological Factor)**:
     - **Rule**: Avoid options where regret from a bad outcome (e.g., getting $0 when a safe option existed) is salient.
     - **Fits Choices**: Explains aversion to risk in Choices 1/3 (regret if $0 occurs) but not in Choices 2/4 (no safe option to regret missing).

