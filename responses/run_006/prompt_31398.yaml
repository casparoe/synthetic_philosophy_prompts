  ### Summary
  - **New Pair ($80 sure vs. 60% $120, 40% $70)**: All rules predict **$80 sure**.
  - **Rules That Fit**: Lexicographic worst-outcome (A) and probability-weighting (B).
  - **Discriminating Pair**: **1% $1000 vs. 50% $21 + 50% $1**.  
    - Rule A predicts **Y (50% $21 + 50% $1)**.  
    - Rule B predicts **X (1% $1000)**.
  - **Best Guess**: Rule A (lexicographic). Test with the discriminating pair to confirm. If she chooses X, switch to Rule B.
