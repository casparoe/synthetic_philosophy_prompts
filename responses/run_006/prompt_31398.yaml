  ### Prediction for New Pair: $80 Sure vs. 60% $120, 40% $70
  - **Option A**: $80 sure (certain gain).  
  - **Option B**: 60% $120, 40% $70 (risky; EV = 100, but min outcome = $70).

  | Rule          | Prediction | Reasoning |
  |---------------|------------|-----------|
  | **Rule A (Lexicographic)** | **$80 sure** | Worst outcome: $80 > $70 → Choose $80 sure. |
  | **Rule B (Probability Weighting)** | **$80 sure** | Certainty effect dominates; $80 sure is overvalued. Also, 40% chance of $70 < $80 may feel like a "loss," triggering risk aversion. |
  | **Anticipated Regret** | **$80 sure** | Choosing B and getting $70 risks regret ("I could have had $80"). |

  **Consensus**: All rules predict **$80 sure**.  
  **Why?** The certainty effect (Rules B and regret) and better worst outcome (Rule A) align. EV of B ($100) is higher, but your friend consistently prioritizes safety when a sure gain exists.

