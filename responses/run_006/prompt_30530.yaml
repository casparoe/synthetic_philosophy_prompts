prompt: |-
  My friend Maya is the one person I know who has an actual worked-out view about whether individual choices matter, and she's weirdly consistent about it. I've been keeping track, and now I have a decision to make and I want to know what she'd say.

  Her record, as best I can reconstruct it:

  - She dosn't vote in national elections and says it's fine not to, because no election has ever come down to one vote and none will. Voting is fine if it makes you feel good but it's not a duty.
  - She won't buy factory-farmed chicken and says other people shouldn't either, even though she admits one person buying a chicken basically never changes how many chickens get raised. Her line is something like "you're still paying for the killing."
  - She flies for vacation without guilt. She says the plane is going anyway, and one seat in one direction doesn't change how much fuel gets burned or whether the route exists.
  - She refuses to buy cheap clothes from brands with sweatshop labor and says it's wrong, even though she knows her purchase won't shut the factory down or free anyone. Again it's the "paying someone to do it" thing.
  - She thinks not recycling a bottle or using a plastic straw isn't a real moral issue, since the harm is spread across everyone and one bottle doesn't move the needle.

  I just got offered a graphic design job at a marketing firm whose biggest client is an oil and gas company. The pay is good and the work itself is just normal ads, nothing false, but I'd be spending my week helping a fossil fuel company look good. I genuinely can't tell whether Maya would file this with the chicken and sweatshop cases (I'd be taking money to help someone do the harmful thing) or with the flight and voting cases (diffuse harm, no identifiable victim, and the campaign would run with someone else in the seat if I said no).

  I'm less interested in the actual verdict than in the rule she seems to be running. What are the plausible rules that fit all of her verdicts so far, which one best explains them, what does each predict about my job offer, and what single follow-up case should I put to her that would cleanly tell the best two or three rules apart?
reasoning: |-
  Okay, let me tackle this problem step by step. The user wants to understand the underlying ethical rule their friend Maya follows based on her past decisions, apply it to a new job offer situation, and design a test case to clarify between competing interpretations.

  First, I need to analyze Maya's positions. She doesn't vote because one vote doesn't change outcomes, but avoids factory-farmed chicken and sweatshop clothes because "you're paying for the killing" or supporting unethical practices. She flies guilt-free since her seat doesn't affect the flight's operation, and thinks recycling one bottle is insignificant.

  The key tension is between direct participation versus marginal impact. For voting and flights, she focuses on negligible individual effect. For chicken and clothes, she emphasizes direct complicity ("paying for it"). The recycling case shows she rejects tokenism when harm is diffuse.

  Now for the job offer: designing ads for an oil company. Is this like taking money to support harm (chicken/clothes) or replaceable labor (voting/flights)? The "helping look good" aspect feels closer to direct participation, but the replaceability argument could apply.

  Possible rules:
  1. Direct causation vs. complicity (best fit)
  2. Personal integrity vs. consequentialism
  3. Symbolic participation vs. actual impact

  The direct complicity rule seems strongest - it explains all cases cleanly. Under this, the job would be unethical like buying chicken. The replaceability rule would say it's fine like flying. 

  To test this, I'd propose a hypothetical about working at a slaughterhouse versus a gas station that sells factory-farmed chicken. If Maya sees slaughterhouse work as directly causing harm (unethical) but gas station work as merely facilitating (ethical), that confirms the complicity distinction. If both are equally bad, she might be applying a broader integrity rule.

  The recycling case adds nuance - she rejects guilt for truly negligible diffuse harms, which might make the oil job (where individual contribution is small but direct) a borderline case worth probing further.
answer: |-
  Based on Maya's pattern of decisions, she operates on a principle that distinguishes **direct causal responsibility/complicity** from **statistically negligible participation in diffuse harm**. Here's a breakdown of the plausible rules, their fit, predictions for your job, and a decisive test case:

  ### Plausible Ethical Rules & Their Fit
  1.  **The Direct Complicity Principle:**
      *   **Rule:** An action is morally significant if you *directly exchange value* (money, labor) to *enable or request* a harmful act, even if your individual contribution doesn't change the aggregate outcome. Harmless participation in diffuse systems is permissible.
      *   **Fit with Maya's Verdicts:**
          *   *Voting (Permissible):* Casting a vote isn't paying for or requesting harm; it's participating in a diffuse system where your impact is nil.
          *   *Factory Chicken/Sweatshops (Wrong):* You directly exchange money *for the harmful product itself*, financially supporting the harmful system and expressing demand for it. "You're paying for the killing."
          *   *Flying (Permissible):* You buy a seat on a plane that was flying anyway. You aren't commissioning the flight or paying *for the harm*; you're utilizing existing capacity. Your purchase doesn't signal demand for *additional* harmful flights in a meaningful way at the margin.
          *   *Not Recycling (Permissible):* Disposing of one bottle/straw doesn't involve a direct exchange for harm; it's negligible participation in a vast, diffuse pollution system.
      *   **Prediction for Your Job:** **Wrong.** You would be *directly exchanging your labor* for money paid by the oil company *specifically to enable their harmful operations* (via improving their image/marketing). You are being paid to help them *do* the harmful thing more effectively, similar to "paying for the killing."

  2.  **The Replaceability/Marginal Impact Principle:**
      *   **Rule:** An action is only morally significant if your individual choice demonstrably changes the outcome (prevents harm, causes harm, creates a good). If you are easily replaceable and your action doesn't alter the total amount of harm/good, it's morally neutral.
      *   **Fit with Maya's Verdicts:**
          *   *Voting (Permissible):* Your single vote doesn't change the outcome (non-replaceable in a decisive way? Not exactly, but impact is zero).
          *   *Factory Chicken/Sweatshops (Inconsistent Fit):* Fits poorly. Buying one chicken *doesn't* change the number raised or shut down a factory (no marginal impact). This rule would suggest her actions are pointless. Her "paying for it" justification doesn't align with pure replaceability.
          *   *Flying (Permissible):* The plane flies regardless; your seat would be filled by someone else. No marginal fuel burn.
          *   *Not Recycling (Permissible):* One bottle makes no measurable difference.
      *   **Prediction for Your Job:** **Permissible.** The marketing campaign would happen with or without you. Another graphic designer would take the job and do the same work. Your individual labor doesn't change the outcome for the oil company.

  3.  **The Symbolic Participation/Integrity Principle:**
      *   **Rule:** An action is morally significant if it constitutes *symbolically endorsing or personally participating in* a harmful process, regardless of marginal impact. Avoiding participation maintains personal integrity even if ineffective.
      *   **Fit with Maya's Verdicts:**
          *   *Voting (Permissible/Potentially Good):* Voting can be a symbolic civic duty/expression, even if ineffective (fits her "fine if it makes you feel good").
          *   *Factory Chicken/Sweatshops (Wrong):* Buying the product symbolically endorses and financially participates in the harmful system, violating integrity.
          *   *Flying (Weak Fit):* Flying *is* participating in the harmful system of air travel. This rule might suggest guilt. Maya's justification focuses on lack of marginal impact, not integrity.
          *   *Not Recycling (Permissible):* Negligible symbolic or participatory weight for one item.
      *   **Prediction for Your Job:** **Likely Wrong.** Taking the job is direct symbolic and practical participation in aiding the oil company's harmful operations, compromising personal integrity.

  ### Which Rule Best Explains Maya's Views?
  *   **The Direct Complicity Principle (#1) fits best overall.** It cleanly explains her core distinction:
      *   **Financially/Actively Enabling Harm (Chicken, Sweatshops, Oil Job?):** Direct exchange of value for a harmful good/service or direct labor supporting harm = **Wrong.**
      *   **Negligible Participation in Diffuse Systems (Voting, Flying, Recycling):** No direct exchange/complicity; impact is statistically zero = **Permissible.**
  *   The Replaceability Principle (#2) struggles with the chicken/sweatshop cases. Her "paying for it" language points to complicity, not just impact.
  *   The Symbolic Principle (#3) struggles with flying. Her justification is practical (plane flies anyway), not symbolic/integrity-based.

  ### Prediction for Your Job Offer (Based on Best Fit - Direct Complicity)
  *   Maya would almost certainly say taking the job is **wrong**. Her reasoning: "You'd be *directly accepting payment* to use your skills *specifically to help an oil company* operate more effectively by improving its public image. It's not like the plane seat – you aren't just filling an empty slot on a flight that happens anyway. You're being hired *by the harmful actor* (or its direct agent) to *perform a service* that aids their core harmful activity. You're taking money to help them 'look good,' which is part of how they continue 'doing bad.' It's analogous to 'paying for the killing' or 'paying for the sweatshop labor' – you're being paid *to help enable the harm.*"

  ### The Decisive Follow-Up Case to Test the Rules
  To cleanly distinguish between the **Direct Complicity Principle (Best Fit)** and the **Replaceability Principle**, pose this:

  > **"What about working the cash register at a gas station that sells factory-farmed chicken (but also sells lots of other things)? Your job doesn't increase the amount of chicken sold; if you quit, someone else would take the job and sell the same amount. Are you morally complicit in factory farming by taking that paycheck?"**

  *   **Prediction under Direct Complicity Principle (Best Fit):**
      *   **Likely Permissible.** While you handle transactions, you aren't *directly paid by the chicken factory*, nor is your labor *specifically dedicated* to enabling chicken sales. You're facilitating a wide range of transactions for a retailer. The harm link is indirect. You're not "paying for the killing" in the same way as buying the chicken; you're being paid for a generic service that incidentally handles harmful products among many others. *(This distinguishes it from the graphic design job targeted at aiding a specific harmful client)*.
  *   **Prediction under Replaceability Principle:**
      *   **Permissible.** Your individual work doesn't change the amount of chicken sold; you are replaceable. Therefore, no moral issue.
  *   **Prediction under Symbolic Participation Principle:**
      *   **Likely Wrong (or Ambiguous).** You are directly participating in the system selling harmful products, handling transactions for them. This might violate integrity.

  **Why this case is decisive:**
  1.  It directly tests the core tension: Is it the *financial/labor exchange specifically enabling harm* (Complicity) or the *individual replaceability* (Replaceability) that matters most?
  2.  It mirrors your job offer structure (working for a company that enables harm) but makes the harm link less direct and more incidental.
  3.  If Maya says the gas station job is **permissible**, it strongly confirms the **Direct Complicity Principle** as her core rule, distinguishing *direct, targeted enabling* from *incidental facilitation*. This would solidify the prediction that your oil company job is wrong.
  4.  If she says the gas station job is **wrong**, it suggests the **Symbolic Participation Principle** or a broader **Integrity Principle** might be stronger than initially thought, or that she draws the complicity line more broadly. This would make your job offer prediction even stronger (wrong) but under a different rationale.
  5.  If she says it's **permissible solely because you're replaceable**, it revives the **Replaceability Principle** as a better fit than initially assessed, making your job offer potentially permissible.

  **In summary:** Maya's pattern points strongly to a **Direct Complicity Principle**. Under this, your graphic design job would be unethical. The Gas Station Cashier case will definitively test this against the main alternative explanations (Replaceability/Symbolism). Ask her that, and her answer will clarify her underlying rule and its application to your dilemma.
