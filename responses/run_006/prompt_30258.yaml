  I am preparing a short unit for an undergraduate political philosophy course on the equality-of-what debate, and I would like to pair the standard arguments about equalizing welfare, resources, and capabilities with Kurt Vonnegut's short story "Harrison Bergeron." Most discussion of the story stops at calling it a satire of egalitarianism, but I want to use it to force the distinctions the philosophical literature actually draws, and to see whether the story engages any of those positions or only attacks a leveling-down caricature that nobody defends. What exactly does the Handicapper General equalize — achieved functionings, capabilities, resources, or welfare — and how would a welfarist, a resourcist in Dworkin's sense, and a capability theorist in Sen's sense each diagnose the society Vonnegut describes? My working hunch is that the story equalizes achieved functionings by destroying capabilities, which lets it present as equality something no serious egalitarian would want; I would like that hunch tested rather than merely confirmed.

  I would also like to know where the story illuminates something the philosophical literature underplays — for example, the difference between leveling down and equalizing, or the difference between compensating people for unchosen natural disadvantage and punishing the exercise of talent — and where the story resists the philosophical reading, perhaps by treating the equalization of a metric as if it necessarily meant leveling everyone down, or by treating every attempt to correct natural inequality as the same kind of absurdity. Point to specific scenes and choices, such as the weighted ballerinas, George's mental-handicap radio, Harrison's dance, and the ending, and say what the story gives a student of the debate that the articles alone do not. Please write this as continuous prose, the way one would write a letter or a critical essay I can draw on for class, with no headings, bullet points, bold text, or tables.
