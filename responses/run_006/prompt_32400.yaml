  First, I need to map their core concern: they feel both sides are "doing different things with the same word" and the literature confirms this deadlock. Their deflationist view (truth as linguistic device) clashed with their friend's inflationism (truth as substantive property for inquiry/meaning). The key questions are: is this substantive or verbal? Are they answering different questions? Does the equivalence schema beg questions? And crucially - what would progress look like?

  Hmm... the user's phrasing suggests they're philosophically sophisticated but tired of circular debates. They mention "standard moves" and decades-long stalemate. Their request for "structure of the standoff" implies they suspect a meta-problem. I should avoid rehashing textbook arguments and focus on the architecture of disagreement.

  I recall Putnam's critique that deflationism presupposes meaning while inflationism presupposes truth - that might explain mutual question-begging. And Price's distinction between semantic vs practical stances could clarify the "different questions" angle. The user's own insight about "different things with the word" feels key - perhaps they're intuitively grasping Carnap's framework/internal questions divide.

  For progress: the user seems open to dissolving the debate rather than resolving it. Distinctions (meta/semantic vs object level), reframing (pragmatic functions), or accepting pluralism might help. Highlighting how both sides rely on each other's assumptions could validate their sense of stalemate while pointing beyond it.

  Word limit is tight - 600 words. Prioritise: 1) diagnosing divergent focal points 2) exposing mutual presuppositions 3) constructive dissolution pathways. British English means "realise" not "realize", etc. No jargon dumps; anchor in their "snow is white" example.

  Most importantly: acknowledge their intuition that it's not mere verbal disagreement but genuinely different projects. That's smarter than calling it "just semantics".
answer: |-
  Your diagnosis hits a crucial nerve: the deflationism-inflationism debate often stalls because **the two approaches answer genuinely different, though entangled, questions, operating at distinct levels of analysis.** The standoff arises from conflating semantic function with metaphysical/functional role, making progress difficult without explicit disambiguation.

  1.  **Different Focal Points (The Core Issue):**
      *   **Deflationism** primarily addresses the *semantic function* and *logical grammar* of the word "true" *within our language*. Its core evidence is the disquotational schema (S is true iff P). It asks: "What linguistic work does 'true' perform?" Answer: enabling endorsement, generalisation, and semantic ascent. Its success lies in explaining these uses *without* invoking a substantive property. For you, "snow is white is true" *just is* a way to endorse "snow is white".
      *   **Inflationism** primarily addresses the *role* truth plays in *explaining broader phenomena* – inquiry, belief, meaning, success. It asks: "What *is* this norm or property that beliefs aim at, that makes inquiry possible, that successful actions track?" It sees "true" as pointing to this explanatory property. Your friend focuses on truth as the *target* of inquiry, the *standard* for belief – roles seemingly requiring something more robust than a logical device.

  2.  **Mutual Presupposition & Question-Begging:**
      *   **Against Deflationism:** The inflationist argues that the disquotational schema *presupposes* the meaningfulness of "P". A full theory of meaning, they contend, *requires* appealing to truth conditions, which a substantive truth property provides. To them, deflationism seems parasitic on meaning it cannot ultimately explain. Your friend's appeal to "answerability" implies this normative 'pull' needs grounding.
      *   **Against Inflationism:** The deflationist counters that the inflationist's appeals to "aim of inquiry" or "norm for belief" are either empty or reducible. What *is* "aiming at truth" besides aiming to believe P only when P? Normative talk, they argue, uses "true" precisely in the disquotational way ("You ought to believe *that snow is white* only if *snow is white*"). To you, your friend seems to be re-describing linguistic practices using inflated vocabulary.

  3.  **Why the Debate Doesn't Move:**
      *   **Talking Past:** You focus on the *word's function in discourse*; your friend focuses on the *concept's role in explaining mental/social practices*. These are different explanatory projects.
      *   **Stalemate:** Deflationism struggles to *fully* explain normative and explanatory roles without seeming dismissive ("it's just more talking"). Inflationism struggles to articulate the *unique* nature of this property without relying on intuitions the deflationist dissolves ("saying it's 'substantive' explains nothing new").
      *   **Conceptual Entanglement:** The word "true" is inextricably used *in* the practices (inquiry, assertion) the inflationist wants to explain *using* truth. Disentangling its semantic function from its explanatory role is fiendishly hard.

  4.  **Paths to Progress:**
      *   **Explicit Disambiguation:** The most crucial step is recognising *which* question is being asked: the semantic function of the *predicate* "is true" or the nature of the *norm/property* governing belief and inquiry. Framing the discussion this way avoids immediate stalemate.
      *   **Functional Analysis:** Focus on the *specific work* "true" does in different contexts (endorsement, generalisation, normative assessment). Does inflationism genuinely explain *more* about these functions, or just redescribe them?
      *   **Pragmatic/Normative Frameworks:** Explore whether the normative role your friend values can be grounded in *pragmatic* features of assertion and inquiry (e.g., commitment, success conditions, social coordination) without invoking a metaphysically substantive truth *property*, perhaps satisfying a deflationary-leaning perspective while capturing the functional role.
      *   **Pluralism?:** Perhaps "truth" serves multiple functions, and different theories capture different aspects. Deflationism might be largely correct *semantically*, while inflationism identifies a real *functional* role in epistemology and philosophy of mind, albeit one potentially reducible to other norms (e.g., accuracy, justification, success).

  **Conclusion:** The standoff isn't merely verbal, but neither is it a straightforward factual disagreement. It's a clash of explanatory priorities and levels. Deflationism offers a compelling account of the word's logic and semantics. Inflationism identifies a genuine explanatory target in our practices. Progress requires acknowledging these distinct projects, clarifying *exactly* what phenomenon one aims to explain ("true" as a predicate vs. truth as a norm/property for belief), and investigating whether the inflationist's target can be secured without committing to a metaphysically robust property *beyond* the deflationist's apparatus. Recognising the distinct questions dissolves the illusion of a single, stagnant debate into potentially complementary (or at least non-competing) lines of inquiry.
