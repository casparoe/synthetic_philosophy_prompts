prompt: |-
  Alright, I'm a philosophy professor teaching a grad seminar on metaethics, and we've been working through Sharon Street's evolutionary debunking argument — the idea that our moral intuitions were shaped by natural selection for reproductive fitness, not for tracking moral truth, so they're presumptively unreliable. One of my sharper students keeps pushing back with an analogy that I want to get your take on.

  Here's the move: the student says that evolution also shaped our perceptual systems. Our eyes, our ears, our capacity to reason about the physical world — all of that was tuned by selection pressures. But we don't go around saying "vision is debunked" or "your auditory experience of the truck bearing down on you is just a fitness-enhancing illusion." We trust perception. So if the debunker's premise — "evolution explains why you have that faculty, therefore its outputs are suspect" — would also debunk perception, and we're not willing to debunk perception, then the premise must be too strong. Either the debunking argument proves too much and collapses, or there's a principaled difference between the moral case and the perceptual case that the student is missing.

  I'd like you to think through this carefully, ideally as a professional philosopher working in metaethics. Start by brainstorming the key structural features of the analogy and then lay it out explicitly: what maps onto what — a table of correspondences would be great. Then go through the places where the analogy breaks down, and seperate the disanalogies that actually matter for the student's argument from the ones that are just noise. Does the student's challenge survive once the disanalogies are on the table? And if the analogy is ultimately misleading, is there a better one the student should be reaching for instead?
reasoning: |-
  Okay, this is a sophisticated metaethics challenge from a grad seminar. The professor's student is using perception as a foil against Street's evolutionary debunking argument - a move I recognize from literature but executed with unusual precision here. Let me unpack this systematically.

  First, the analogy's core structure needs mapping. The student equates evolution's role in shaping moral intuitions with its role in shaping perceptual faculties. If we accept perceptual outputs as truth-tracking despite evolutionary origins, shouldn't we extend the same charity to moral intuitions? That's the thrust. 

  *flips mental notebook open* The correspondence table practically writes itself:
  - Moral intuition : Perceptual experience
  - Reproductive fitness : Survival advantage
  - Moral truth : Mind-independent physical reality
  - Debunker's skepticism : Global perceptual skepticism
  The student's implying Street commits to a premise that, if generalized, would force us into Cartesian doubt about everything.

  But the disanalogies... ah, this is where it gets juicy. Three really matter:
  1) The teleosemantics angle: Perceptual states have determinate contents tied to specific environmental features (light wavelengths → color experiences). Moral intuitions? Their content is radically underdetermined. A fitness-enhancing "help kin" disposition could correspond to realist "duty to family" or constructivist "community cohesion preference" with equal evolutionary plausibility.

  2) Calibration mechanisms: We constantly cross-validate perception against itself and instruments. Touch corrects vision, microscopes correct naked eye. Moral intuition lacks this. When deontologists and consequentialists clash over trolley problems, there's no moral microscope to settle it.

  3) Counterfactual robustness: We can model how perception would respond under non-actual conditions (if wavelengths shifted, color experiences would change predictably). Moral intuitions fail spectacularly here - consider how reproductive fitness would favor entirely different norms in a euspecies like termites versus humans.

  *strokes chin* The student might retort that early vision had no calibration either. True! But perception's subsequent bootstrapping through external tools creates an epistemic divergence morality hasn't matched. Street could grant perceptual parity in Pleistocene conditions while noting modernity created asymmetry.

  Is the analogy salvageable? Only if stretched thin. A better foil might be mathematical intuition - also evolutionarily shaped yet seemingly truth-tracking. But here the calibration argument bites harder: we built calculators to check arithmetic intuitions, whereas moral "calculators" just encode more intuitions.

  Final verdict? The student's challenge lands a glancing blow by exposing overgeneralization risk, but Street can parry by noting the disanalogies are precisely what make moral beliefs vulnerable where perceptual ones aren't. *nods* I'll structure the response to validate the student's acuity while demonstrating why the debunker's knife still cuts.
answer: |-
  ## Deconstructing the Perceptual Analogy Against Street's Debunking

  Your student has landed a powerful objection – one that strikes at the heart of evolutionary debunking arguments (EDAs). Let's dissect it systematically.

  **1. The Analogy Mapped: Correspondence Table**

  | Feature                          | Moral Intuition (Street's Target) | Perceptual Faculty (Student's Analogy) |
  | :------------------------------- | :-------------------------------- | :------------------------------------- |
  | **Evolutionary Origin**          | Shaped by natural selection       | Shaped by natural selection            |
  | **Selective Pressure**           | Reproductive fitness              | Survival/Reproductive fitness          |
  | **Putative Function**            | Guide cooperative behavior, social cohesion | Detect features of external world      |
  | **Outputs Debunked Premise**     | Moral intuitions (`X is wrong`)   | Perceptual experiences (`I see a truck`) |
  | **Putative Truth Target**        | Mind-independent moral truths     | Mind-independent physical reality      |
  | **Debunker's Skeptical Claim**   | Intuitions unreliable re: truth   | Perceptions unreliable re: truth?      |
  | **Student's "Proves Too Much"**  | If EDA debunks morals, it *should* debunk perception too | But we don't (and can't) debunk perception in practice |
  | **Student's Conclusion**         | EDA premise ("evolutionary origin implies unreliability") is too strong or false | EDA premise must be rejected or qualified |

  **2. Key Disanalogies & Their Significance for the Argument**

  Not all differences matter equally. Here's a breakdown, separating critical disanalogies from incidental noise:

  *   **Disanalogies that *Matter* (Undermine the Analogy):**
      *   **A. Calibration & Independent Checkability:**
          *   **Perception:** We have robust, *independent* methods to verify perceptual claims. We cross-check sight with touch, hearing, and instruments (microscopes, rulers, spectrometers). We build predictive models of the physical world confirmed by technology (physics, engineering). This ongoing calibration *warrants* trust despite evolutionary origins.
          *   **Morality:** No comparable independent check exists for core moral intuitions. We appeal to *other moral intuitions* (reflective equilibrium), cultural norms (themselves evolutionary products), or contested theories – but no "moral spectrometer" confirms mind-independent moral truths. The system is largely self-referential. **Significance:** This explains *why* we rightly trust perception *despite* its origins – it's constantly verified. The lack of similar verification for morality is precisely what makes EDAs potent.
      *   **B. Teleosemantics & Content Determinacy:**
          *   **Perception:** Evolutionary pressures plausibly *selected for tracking specific mind-independent features* (e.g., detecting predators, ripe fruit, solid ground). Success depended on *accurate* representation of a *shared* external reality. The content of perceptual states is tightly linked to specific environmental features (e.g., "red" tracks specific light wavelengths).
          *   **Morality:** Evolutionary pressures plausibly selected for *fitness-enhancing behavioral dispositions and motivations* (e.g., kin altruism, reciprocal cooperation, aversion to harm within group). These *need not* track mind-independent moral truths; they only need to *motivate behavior enhancing survival/reproduction*. The *same* behavioral disposition (e.g., "help kin") is compatible with *vastly different* moral truths (realist "Family has intrinsic moral weight" vs. constructivist "Promoting group cohesion is valued") or even no truth at all ("It feels right"). **Significance:** Perception likely *was* selected for tracking truth (reality). Morality was likely selected for motivating adaptive behavior – truth-tracking is an unnecessary hypothesis.
      *   **C. Counterfactual Robustness:**
          *   **Perception:** We can model how perception *would* function in radically different environments and predict its (in)accuracies. We understand *why* it works here (e.g., wavelengths present, atmospheric conditions).
          *   **Morality:** If evolutionary pressures had been different (e.g., a eusocial species like ants, extreme resource scarcity), we can easily imagine radically different "moral intuitions" emerging (e.g., extreme collectivism, mandatory culling of the weak) that would feel equally "objectively true" to those beings. This undermines the idea intuitions reliably track *truth*, rather than just being fitness-enhancing. **Significance:** Highlights the contingency of moral intuitions in a way perceptual intuitions are *not* contingent on the specific *truths* of physics.

  *   **Disanalogies that are *Noise* (Don't Undermine the Core Challenge):**
      *   **Modality Specificity:** Vision vs. Hearing vs. Moral intuition. (Irrelevant to the structural epistemic point).
      *   **Complexity:** Moral reasoning might involve more cognitive layers. (The core intuition is still the input).
      *   **Cultural Variation:** Perception has less cultural variation *at the basic level* than morality. (While true, the core analogy concerns the *evolutionary origin* of the faculty's basic outputs, not later cultural elaboration).
      *   **Fallibility:** Both are fallible (optical illusions, moral disagreements). (The argument is about *systematic unreliability due to origin*, not occasional errors).

  **3. Does the Student's Challenge Survive?**

  *   **Partially, but weakened.** The student brilliantly exposes a potential *overgeneralization* risk in EDAs: If "shaped by evolution for fitness" *automatically* entails "unreliable for truth," then perception *should* be debunked too. We rightly reject that conclusion for perception, suggesting the premise is too crude.
  *   **However, the critical disanalogies provide Street (or a defender) with the resources to resist the collapse.** They can argue:
      1.  Perception earns its epistemic credentials *post-hoc* through independent calibration and its success in predicting/intervening in a shared world. Morality lacks this.
      2.  Perception's evolutionary history is best explained as selection *for tracking truth*. Morality's evolutionary history is best explained as selection *for motivating adaptive behavior* – truth-tracking is superfluous.
      3.  The counterfactual fragility of moral intuitions contrasts sharply with the counterfactual robustness of core perceptual capacities regarding physical reality.
  *   **Conclusion:** The student's challenge forces a crucial refinement of the debunker's premise. It cannot be the *mere fact* of evolutionary shaping that debunks. The debunker must argue that evolutionary shaping *in the specific case of morality* did not select for truth-tracking and that *no independent calibration exists*. The analogy shows the premise needs qualification, but the disanalogies prevent the argument from collapsing entirely. Street can plausibly claim the qualification holds for morality but not perception.

  **4. A Better Analogy for the Student?**

  The perceptual analogy is potent but flawed due to the calibration issue. A potentially stronger analogy for the student to pursue might be:

  *   **Mathematical/Cognitive Intuitions (e.g., Basic Logic, Arithmetic):**
      *   **Correspondence:** Shaped by evolution (e.g., tracking objects, social exchanges). Outputs (`1+1=2`, modus ponens) feel necessary and objective. We don't debunk them due to evolutionary origin.
      *   **Advantage over Perception:** Like morality, these lack *direct* sensory calibration. We "check" math with more math/logic – a potentially self-referential system akin to reflective equilibrium in ethics. The "independence" problem mirrors morality closely.
      *   **Debunker's Counter:** Even here, crucial differences exist. Mathematical/logical truths are *abstract/conceptual* and potentially supervene on fundamental structural features of any possible world an intelligent agent could reason about. Their applicability in describing the *physical* world is confirmed by science (back to perception/calibration!). Moral truths, if realist, concern *reasons for action/normativity* – a different domain. Furthermore, core logical/mathematical intuitions show remarkable cross-cultural consistency and counterfactual robustness unlike core moral intuitions (e.g., about harm to out-groups). Street might argue evolution plausibly *did* select for basic truth-tracking in logic/arithmetic because accurate prediction/planning *requires* it, whereas adaptive behavior doesn't require tracking moral truth.

  **In Summary:** Your student has identified a genuine pressure point in EDAs. The perceptual analogy forces the debunker to move beyond a simplistic "evolution implies unreliability" premise. However, the disanalogies concerning calibration, teleosemantic content, and counterfactual robustness provide a principled basis for Street to argue that evolution plausibly *did not* shape moral intuitions for truth-tracking *and* that morality lacks the independent verification that saves perception (and perhaps basic math/logic). The challenge sharpens the debate but doesn't deliver a knockout blow. It would be productive to explore the math/logic analogy further in seminar – it may be the most resilient foil.
