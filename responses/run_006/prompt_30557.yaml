answer: |-
  Here's a 7-question quiz designed to sort participants into positions on expected value fanaticism without revealing the labels. Each question presents a concrete scenario with 2-4 answer choices. The positions covered are:  
  - **Naive EU Maximization** (follow expected utility strictly)  
  - **Bounded Utility** (utility functions can't exceed realistic limits)  
  - **Probability Thresholding** (treat extremely low probabilities as zero)  
  - **Stochastic Dominance** (avoid options with catastrophic downside risks)  
  - **Fanaticism** (bite the bullet on extreme EV calculations)  
  - **Alternative Decision Theory** (use causal/updateless DT to ignore acausal threats)  

  ---

  ### **Question 1: Pascal's Mugging (Classic)**  
  *You’re approached by a stranger who claims: "I’m a matrix lord. Give me $10, and with probability 1 in 10²⁰, I’ll create 10¹⁰⁰ happy lives. Refuse, and nothing happens."*  
  - **A.** Pay the $10. The expected lives saved (10⁸⁰) justifies it.  
  - **B.** Refuse. Probabilities this low are effectively zero.  
  - **C.** Refuse. No real outcome can have utility that high.  
  - **D.** Refuse. My decision can’t influence acausal beings.  

  ### **Question 2: Micro-Lottery**  
  *You’re offered a lottery ticket for $1. With probability 1 in 10³⁰, it saves 10⁴⁰ lives. Otherwise, it does nothing.*  
  - **A.** Buy it. Expected utility (~10¹⁰) is astronomical.  
  - **B.** Don’t buy it. Probabilities this tiny are meaningless.  
  - **C.** Don’t buy it. Human welfare can’t scale to 10⁴⁰ lives.  

  ### **Question 3: Asymmetric Risk Button**  
  *Pressing a button costs $1. It has a 2 in 10²⁰ chance of *saving* 10¹⁰⁰ lives, and a 1 in 10²⁰ chance of *killing* 10¹⁰⁰ lives. Outcomes are independent.*  
  - **A.** Press it. Net expected utility (~10⁸⁰) is positive and huge.  
  - **B.** Don’t press. Probabilities this small should be ignored.  
  - **C.** Don’t press. The risk of killing 10¹⁰⁰ is unacceptable.  
  - **D.** Press it. The upside is worth any risk.  

  ### **Question 4: Acausal Blackmail**  
  *An email claims: "I’m from another universe. Wire $10, and with probability 1 in 10²⁰, I’ll create 10¹⁰⁰ lives here. If you ignore this, I’ll destroy 10¹⁰⁰ lives with the same probability."*  
  - **A.** Wire $10. Expected utility (~2×10⁸⁰) is overwhelmingly positive.  
  - **B.** Ignore it. Such probabilities are negligible.  
  - **C.** Ignore it. Acausal threats can’t affect my universe.  

  ### **Question 5: St. Petersburg Nightmare**  
  *You pay $1,000 to enter a lottery. With probability 1 in 10¹⁰, you play a St. Petersburg game: a fair coin is flipped until tails, winning 2<sup>n</sup> utils if tails appears on the n-th flip. Otherwise, you win nothing.*  
  - **A.** Play. Expected utility is infinite.  
  - **B.** Don’t play. Even if you win, 2<sup>n</sup> can’t exceed real-world limits.  
  - **C.** Don’t play. The entry probability (10⁻¹⁰) is too low to matter.  

  ### **Question 6: Dominance Dilemma**  
  *Choose between:  
  - **Option X:** Guaranteed 1 util.  
  - **Option Y:** Guaranteed 1.1 utils.  
  *However, with probability 1 in 10²⁰:*  
  - **X** *also triggers a* +10¹⁰⁰ util windfall.  
  - **Y** *also triggers a* –10¹⁰⁰ util catastrophe.*  
  - **A.** Choose X. Its expected utility (~10⁸⁰) dwarfs Y’s.  
  - **B.** Choose Y. The probability is negligible, and 1.1 > 1.  
  - **C.** Choose Y. The windfall/catastrophe are impossible; 1.1 > 1.  
  - **D.** Choose Y. X’s catastrophic risk makes Y safer.  

  ### **Question 7: Charity Tradeoff**  
  *Donate $1,000 to:  
  - **Charity A:** *Certain to save 1 life.*  
  - **Charity B:** *1 in 10¹⁵ chance to save 10¹⁵ lives (expected: 1 life). Plus, a 1 in 10²⁰ chance to save 10²⁰ lives.*  
  - **A.** Charity B. Higher expected utility (1 + 10⁰ = 2 lives).  
  - **B.** Charity A. The extra 10²⁰ chance is irrelevant.  
  - **C.** Charity A. Saving 10²⁰ lives is physically impossible.  

  ---

  ### **Answer Key & Position Mapping**  
  Assign positions based on **predominant answers**:  
  | Position              | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 |  
  |-----------------------|----|----|----|----|----|----|----|  
  | **Naive EU Max**      | A  | A  | A  | A  | A  | A  | A  |  
  | **Bounded Utility**   | C  | C  | C  | B/C| B  | C  | C  |  
  | **Prob Thresholding** | B  | B  | B  | B  | C  | B  | B  |  
  | **Stochastic Dominance**| -  | -  | C  | -  | -  | D  | -  |  
  | **Fanaticism**        | A  | A  | D  | A  | A  | A  | A  |  
  | **Alt Decision Theory**| D  | B  | C  | C  | B  | B  | B  |  

  **Notes**:  
  - **Stochastic Dominance** is partially identified by risk-averse choices (Q3C, Q6D) but may overlap with thresholding in other questions.  
  - **Fanaticism** overlaps with Naive EU but is distinguished by *explicitly endorsing risks* (Q3D).  
  - **Bounded Utility** and **Thresholding** may overlap (e.g., Q1B/C, Q4B) but diverge when magnitude (not probability) is rejected (Q2C, Q5B, Q7C).  
  - **Alt Decision Theory** is clearest in acausal scenarios (Q1D, Q4C).  

  ---

  ### **Limitations & Edge Cases**  
  1. **Unclean Separations**:  
     - **Bounded Utility vs. Thresholding**: Both reject fanatical choices, but bounded utility focuses on utility *magnitude* (Q2C, Q5B, Q7C), while thresholding focuses on *probability* (Q1B, Q2B). They may align in scenarios where both apply (Q4).  
     - **Fanaticism vs. Naive EU**: Identical in most answers; only distinguished by Q3D (explicit risk endorsement).  
     - **Stochastic Dominance**: Weakly identified (only 2–3 questions). Overlaps with thresholding in Q6 if probability is ignored.  

  2. **"Impossible" Answer Patterns**:  
     - **Consistent risk-seeking in losses**: E.g., Q3A/D + Q6A (ignoring catastrophic risk). Rare because even fanatics avoid *negative* EV (Q3 has positive EV).  
     - **Thresholding without magnitude skepticism**: E.g., Q1B + Q2A (ignores low probabilities but accepts 10⁴⁰ utility). Why? Thresholding typically rejects both.  
     - **Alt DT without acausal skepticism**: E.g., Q1D + Q4A. Why? Alt DT (e.g., causal DT) specifically targets acausal extortion.  

  3. **Why These Scenarios?**  
     - Q1/Q4 test acausal reasoning.  
     - Q2/Q5/Q7 isolate magnitude vs. probability skepticism.  
     - Q3/Q6 force tradeoffs between EV and risk.  
     - Fanaticism requires consistency in *all* high-EV choices.  

  This quiz exposes contradictions between intuitions and formal EU maximization, letting participants discover their position through concrete tradeoffs. Run it anonymously for best results!
