answer: |-
  Your teacher is making a **crucially important and substantive point**, not just avoiding the question. While her repetition might feel dismissive, the distinction she's emphasizing is fundamental to understanding quantitative genetics and prevents serious misinterpretations. Here's a breakdown of what "heritability doesn't tell you about individuals" means, from obvious to profound:

  1.  **The Superficially Obvious (Boring):** "You can't calculate *your specific* heritability." This is trivially true – heritability (h²) is a population statistic, like the average height. Nobody asks "What's *my* average height?" So you can't ask "What's *my* heritability for IQ?"

  2.  **The First Substantive Level (Why the Student Question is Wrong):** **Heritability does NOT mean "percent genetic."** This is the core error in questions like "Is my IQ 60% genetic?" Heritability (h²) is defined as:
      `h² = Variance due to Genetic Differences / Total Phenotypic Variance`
      *   **It's about *variation* in a *population*:** It tells us what *proportion of the differences* we see in a trait (like IQ scores) *within a specific population at a specific time* can be statistically attributed to genetic differences *within that population*.
      *   **It says nothing about the *absolute contribution* of genes to the trait in any single individual.** Think of baking a cake: The "heritability" of cake height *in your kitchen* might be 80% if you always use the same recipe (environment) but different amounts of baking powder (genetic variation). This DOES NOT mean that for *one specific cake*, 80% of its height came from the baking powder and 20% from the recipe. The cake needed *both* to exist at all. Heritability only tells you why cakes *differ* in height in your kitchen.

  3.  **The Profound Level (Why it Matters & Justifies the Shutdown):** **Genes and environment are inextricably intertwined and non-additive *within an individual*.** This is the deepest reason the question is misguided.
      *   **Non-Additivity:** Genes and environment don't just add up independently inside you (like 60% + 40% = 100%). They *interact* (GxE): A genetic predisposition might only express itself in a specific environment. They also *correlate* (rGE): Your genes might influence the environments you experience (e.g., a genetically brighter child seeks out more books).
      *   **The "Oven" Analogy:** Imagine heritability tells you how much differences in oven temperatures (genes) explain variation in cake browning *across many ovens using the same recipe*. This tells you nothing about how the temperature setting *combined with the recipe* produced the browning in *your specific oven* for *your specific cake*. The unique combination of *your* genes and *your* life experiences creates *your* IQ in a way that cannot be partitioned into separate percentages. The whole is greater than the sum of its parts.

  **Why your teacher shuts it down (and is justified):**

  1.  **Preventing Fundamental Misconception:** The "percent genetic for me" idea is biologically nonsensical. Shutting it down firmly prevents students from building further understanding on this flawed foundation.
  2.  **Emphasizing Population Focus:** Quantitative genetics *starts* with understanding variation in populations. Applying population stats directly to individuals is a category error.
  3.  **Avoiding Genetic Determinism:** The "percent genetic" interpretation feeds the dangerous and incorrect idea of genetic determinism ("My genes made me this way, environment doesn't matter"). Heritability estimates are *descriptive* of a population at a point in time, NOT *prescriptive* for individuals. High heritability does NOT mean a trait is unchangeable by environment (e.g., PKU is 100% "genetic" but treatable by diet).
  4.  **Context Dependence:** Heritability values change. If you change the environmental variation (e.g., provide everyone with excellent nutrition and education), the genetic variation might explain a *larger* proportion of the remaining differences (h² increases). If you introduce massive genetic diversity, environmental factors might explain more (h² decreases). A single number doesn't capture this dynamism for an individual.

  **What to ask in Office Hours (Show you get the distinction but want depth):**

  Instead of re-challenging the slogan, demonstrate you understand the *population* vs. *individual* distinction and ask for deeper exploration:

  *   "I understand now that heritability is about partitioning variance in a population and can't be applied as 'percent genetic' to an individual. Could you help me understand *why* it's impossible or meaningless to partition the genetic and environmental contributions *within* a single person? Is it fundamentally because of GxE and rGE?"
  *   "If heritability for IQ is 0.6 in a population, what *does* that actually tell us about that population? How might that value change if, say, we moved that entire population to a dramatically different environment?"
  *   "How do concepts like gene-environment correlation and interaction make the idea of a fixed 'percent genetic' contribution for an individual nonsensical?"
  *   "Can you give an example where a trait has high heritability in a population, yet we know the environment has a massive impact on individual outcomes (or vice versa)?"

  **Conclusion:** Your teacher has a **very strong point**. The statement "heritability doesn't tell you about individuals" is far from a boring slogan; it guards against a profound and common misunderstanding that misrepresents how genes and environment work together to shape traits. While her repetition might feel frustrating, the distinction she's hammering home is essential for thinking accurately about genetics and behavior. Go to office hours prepared to explore the *why* and *how* of gene-environment interplay, not to re-litigate the individual/population distinction she's rightly emphasizing.
