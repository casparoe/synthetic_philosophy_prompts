  ### Thought Experiment: The Submarine Authentication Game

  **Setting:** October 1985, North Atlantic. Two nuclear-armed rivals, ALPHA and BETA, are in a crisis over disputed territory. Both have ballistic missile submarines (SSBNs) on patrol. Each SSBN requires periodic authentication signals from its National Command Authority (NCA) to remain in a non-launch-ready "safe" state. If authentication is missed for a critical period, the submarine automatically shifts to a launch-ready state. The NCA can choose between two authentication protocols:  
  - **Standard Protocol:** Authentication required every 24 hours (missed twice = 48 hours to launch-ready).  
  - **Rapid Protocol:** Authentication required every 12 hours (missed twice = 24 hours to launch-ready).  

  The Rapid Protocol reduces vulnerability to a decapitating strike (ensuring retaliation) but increases the risk of accidental war due to communication failures (e.g., solar flares, equipment glitches). The probability of a communication failure lasting 24 hours is 0.01 (1%); for 48 hours, it is 0.001 (0.1%).  

  ---

  ### Game Setup
  **Players:** ALPHA and BETA.  
  **Actions:** Each chooses a protocol: **Rapid (R)** or **Standard (S)**.  
  **Preferences:**  
  - Avoid nuclear war (worst outcome: mutual destruction).  
  - Avoid unilateral vulnerability (prevent the other from exploiting a decapitation advantage).  
  - Minimize accidental war risk.  

  **Assumptions:**  
  - No deliberate first strike is rational (MAD holds if both use Standard).  
  - Accidental launch by one triggers retaliation by the other (mutual destruction).  
  - Communication failures are independent events.  
  - Payoffs:  
    - **Nuclear War (any cause):** -100 for both.  
    - **No War:** 0.  
    - **Unilateral Vulnerability:** -50 (if one uses Standard while the other uses Rapid, the Standard user risks decapitation without assured retaliation).  

  ---

  ### Normal Form Game (Payoffs: ALPHA, BETA)
  | ALPHA \ BETA | Rapid (R)       | Standard (S)    |
  |--------------|-----------------|-----------------|
  | **Rapid (R)** | (-2, -2)       | (-0.5, -50.5)  |  
  | **Standard (S)**| (-50.5, -0.5) | (-0.1, -0.1)   |

  **Payoff Calculations:**  
  - **Both Rapid (R,R):**  
    - Accidental war risk: Prob = 1 - (1-0.01)² ≈ 2% (0.02).  
    - Payoff = 0.02 × (-100) + 0.98 × 0 = **-2**.  
  - **Both Standard (S,S):**  
    - Accidental war risk: Prob = 1 - (1-0.001)² ≈ 0.2% (0.002).  
    - Payoff = 0.002 × (-100) + 0.998 × 0 = **-0.1**.  
  - **Mixed (R,S) or (S,R):**  
    - *Rapid user (e.g., ALPHA if (R,S)):*  
      - Accidental risk: 0.01 (only from own subs).  
      - No vulnerability (deters BETA).  
      - Payoff = 0.01 × (-100) = **-1** → **-0.5** (adjusted for unilateral advantage).  
    - *Standard user (e.g., BETA if (R,S)):*  
      - Accidental risk: 0.01 (from ALPHA’s subs) + decapitation risk.  
      - Payoff = 0.01 × (-100) + 0.99 × (-50) ≈ **-50.5** (expected cost of vulnerability).  

  ---

  ### Why Delegation (Rapid) is Individually Rational
  1. **If BETA chooses Rapid (R):**  
     - ALPHA’s choice:  
       - **Rapid (R):** Gets -2.  
       - **Standard (S):** Gets -50.5 (high vulnerability cost).  
     - ALPHA prefers **-2 > -50.5** → Chooses **Rapid**.  
  2. **If BETA chooses Standard (S):**  
     - ALPHA’s choice:  
       - **Rapid (R):** Gets -0.5 (low accidental risk, no vulnerability).  
       - **Standard (S):** Gets -0.1 (very low accidental risk).  
     - ALPHA prefers **-0.5 < -0.1** but must avoid vulnerability. The -50.5 outcome if BETA defects to Rapid makes Standard too risky.  
     - **Rational choice:** ALPHA chooses **Rapid** to avoid unilateral vulnerability, even though -0.5 < -0.1.  

  **Equilibrium:** (Rapid, Rapid) is the only Nash equilibrium. Both choose Rapid, getting -2.  
  **Pareto Inferior Outcome:** (R,R) gives -2 each, worse than (S,S) at -0.1 each.  

  ---

  ### Key Structural Feature: **Unilateral Vulnerability**
  - **What it does:** Creates asymmetric costs in mixed (R,S) outcomes. The Standard user faces high vulnerability costs (-50.5), making Rapid dominant regardless of the other’s choice.  
  - **Remove it:** If vulnerability cost = 0 (no decapitation advantage), payoffs simplify:  
    - (R,R): -2  
    - (R,S): -0.5, -0.5  
    - (S,S): -0.1  
    Now (S,S) is the rational equilibrium (accidental risk minimized).  

  ---

  ### Attack from a Defender of "Stable Brinkmanship"
  **Argument:**  
  *"Delegation (Rapid Protocol) makes retaliation credible, deterring deliberate strikes. This reduces the likelihood of war. In your model, the vulnerability cost is arbitrary. In reality, MAD makes decapitation impossible, so Standard Protocol is always safe. Your case overstates unilateral vulnerability."*  

  **Rebuttal (Does the Attack Land?)**  
  **No—and here’s why:**  
  1. **Credibility vs. New Vulnerability:**  
     - Stable brinkmanship assumes MAD is immutable. This case shows that when technology (e.g., communication protocols) creates a *temporary vulnerability window*, MAD can be undermined. 1980s SSBNs *were* vulnerable to decapitation if authentication delays were exploited.  
  2. **Empirical Plausibility:**  
     - The U.S. and USSR feared "decapitation strikes" in the 1980s (e.g., Soviet worry about Pershing II missiles). Protocols like the Rapid option existed (e.g., short-alert systems).  
  3. **Rational Choice Under Uncertainty:**  
     - Even with MAD, a rational actor cannot risk the 1% chance the adversary *might* exploit a vulnerability. The -50.5 cost reflects this, making Rapid rational.  

  **Conclusion:** The attack fails because it ignores how new strategic dependencies (authentication timing) can create first-strike incentives *despite* MAD, flipping delegation from stabilizing to destabilizing.  

  --- 

  **Teaching Note:** Use this to show how rational actors, under incomplete control of retaliation mechanisms, can jointly choose a riskier equilibrium. The key is the interaction of delegation costs (accidental war) and vulnerability costs.
