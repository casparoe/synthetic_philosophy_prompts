prompt: |-
  Please compare two explanations for why people resist certain market exchanges even when both parties consent and the harms are contested or indirect: the repugnance account, which locates the problem in a widely shared aversion to the transaction itself, and the commodification or corruption account, which locates the problem in what buying and selling does to the meaning or value of the good involved. Use kidneys, votes, and price-gouged disaster goods as running examples, but focus on the structure of the two accounts rather than on the examples themselves. In particular, address what each account identifies as the primary wrong-making feature; whether the objection attaches to the good, the act, or the social meaning of the exchange; and what each account implies about whether such objections could be mistaken, merely conventional, or capable of changing over time. Then identify a case in which the two accounts would come apart in what they predict or recommend, and say what that divergence shows about which account is doing the deeper explanatory work. Please respond in continuous prose, without headings, bullet points, bold text, or tables, as you would in an email or letter.
