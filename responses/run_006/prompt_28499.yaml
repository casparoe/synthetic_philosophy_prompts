answer: |-
  The resistance to certain consensual market exchanges, even absent clear harms, can be illuminated through two distinct theoretical lenses: the repugnance account and the commodification (or corruption) account. While both acknowledge the phenomenon of objection, they diverge fundamentally in identifying the source of the wrong, what precisely is being objected to, and the nature and potential flexibility of that objection.

  The **repugnance account** posits that the core problem lies in a deep-seated, widespread emotional or intuitive aversion to the transaction itself. The primary wrong-making feature is the feeling of disgust, revulsion, or profound discomfort elicited by the very idea of buying and selling the specific good or service in question. This objection attaches directly to the *act* of exchange. The act of putting a price on a kidney, selling one's vote, or drastically raising the price of water during a disaster feels intrinsically offensive, violating a fundamental taboo regardless of consent or contested harms. Regarding the nature of the objection, the repugnance account suggests it is primarily visceral and potentially non-rational. Consequently, such objections *could* be mistaken – reflecting irrational biases, cultural quirks, or historical accidents rather than reasoned moral principles. They are often deeply conventional, rooted in specific social norms and sensibilities, and are demonstrably capable of changing over time as societal attitudes evolve (e.g., historical taboos around life insurance or lending money for interest have significantly weakened).

  In contrast, the **commodification account** locates the problem not in an aversion to the act, but in the transformative effect market exchange has on the *good itself* and its surrounding social meaning. The primary wrong-making feature is the *corruption* or *degradation* of the good's intrinsic value or significance when it becomes a commodity. The objection attaches most fundamentally to the *good* and its meaning, arguing that certain things possess a value (e.g., dignity, sacredness, civic virtue, intrinsic worth) that is incompatible with being bought and sold. Selling a kidney commodifies the human body, undermining human dignity. Selling a vote commodifies citizenship, corrupting the democratic process. Price-gouging essential goods during disasters commodifies human vulnerability and necessity, eroding social solidarity. The wrong stems from what market logic *does* to the meaning of the good. This account implies objections are grounded in defensible, though contestable, understandings of value. While conventions shape *which* goods are seen as non-commodifiable, the underlying argument is that commodification genuinely destroys or diminishes important non-market values. Therefore, objections might evolve as understandings of value change (e.g., debates around surrogacy), but they are less likely to be dismissed as *merely* irrational or conventional mistakes; they stem from a reasoned (if debated) claim about value corruption.

  A revealing divergence occurs with **price-gouged disaster goods** (like water or shelter after a hurricane). The *repugnance account* effectively explains the widespread visceral outrage: the act of drastically raising prices for essentials in a crisis feels exploitative and disgusting, triggering a strong aversion regardless of arguments about supply/demand efficiency or consent. The *commodification account*, however, faces a greater challenge here. While it can argue that price-gouging commodifies basic human needs and solidarity in a moment of vulnerability, the objection seems less rooted in the *inherent* non-commodifiable nature of the *good* itself (like a kidney or vote). Water is routinely bought and sold; the intense objection arises specifically from the *context* of disaster and vulnerability, not an inherent property of water that market logic inherently corrupts. The repugnance account captures the visceral reaction well, but struggles to articulate a deeper *reason* beyond disgust.

  This divergence highlights the deeper explanatory work of the commodification account. While repugnance powerfully describes the phenomenological response (the feeling of disgust), commodification provides a *reasoned justification* for *why* the feeling arises and *why* it might be morally significant, particularly for goods like kidneys or votes. It points to a perceived conflict between market valuation and other crucial forms of value (dignity, citizenship). In the price-gouging case, the commodification account's relative struggle suggests the outrage might be more about exploitation of circumstance (captured partly by repugnance) or unfairness, rather than a fundamental corruption of the good's meaning. Conversely, the commodification account offers a more robust, value-based explanation for objections to markets in goods where the non-market meaning is central to their perceived value, demonstrating its capacity to articulate the underlying moral concern that repugnance merely signals.
