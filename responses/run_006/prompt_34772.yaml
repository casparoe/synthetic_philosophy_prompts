prompt: |-
  I'm taking a metaphysics course this term, and we've spent the last few weeks on the special composition question — roughly, under what conditions do some things compose a further thing? I've been trying to get clear on what I actually think by working through cases, and my verdicts are pulling me in different directions. I'd like help finding a principle that captures them, or at least diagnosing which ones I should give up.

  Here are my verdicts:

  (1) A living cat: the particles that make it up compose a single thing — the cat. This one feels non-negotiable.

  (2) A pile of sand grains on a beach: the grains don't compose anything further. It's just many things, not one.

  (3) A sand dune: I find myself thinking the grains do compose a dune. But a dune just is a pile of sand with a certain shape and a wind-formed causal history. I can't see what metaphysical difference the shape makes, and I'm uncomfortable with the mismatch between (2) and (3).

  (4) A cloud: the water droplets compose a cloud. But a cloud is just a scattered collection of droplets with vague boundaries and no internal structure. If a cloud is a thing, I don't see why the sand pile isn't.

  (5) Two strangers shaking hands: they don't compose a new object. They're just two people in contact. This feels obvious.

  (6) A deck of playing cards scattered across the floor: no composite object — just fifty-two cards. The same deck, stacked neatly in its box: I want to say the cards now compose a deck. But the only difference is spatial arrangement, and letting composition turn on that seems suspiciously superficial.

  (7) A swarm of bees in flight: just many bees, no further object. But I've read that some biologists treat ant colonies as single superorganisms, and I don't know whether that should shift my metaphysical verdict or whether I'm conflating two questions.

  (8) A human corpse, minutes after death: I think the particles still compose a single thing — the body. But it's no longer a living organism, so whatever principle covered the cat can't simply be "life."

  (9) A watch, fully assembled and running: one thing. The same watch, disassembled into all its parts in a box: just parts, no watch. This feels like the cards case all over again.

  (10) The rock in my hand: one thing. But I know it's just a lattice of mineral grains, and I can't say what it has that the sand pile lacks — they differ in how strongly the parts are bonded, but is degree of attachment really a metaphysical difference-maker?

  I've tried out a few candidate principles — "compose a thing if and only if the parts are fastened together," "compose a thing if and only if the parts participate in a life," "compose a thing if and only if the collection is functionally integrated" — and each one handles some cases cleanly while failing badly on others. I can feel something in the neighborhood, but I can't state it.

  I'd like you to propose the best principle you can that captures as many of these verdicts as possible, state clearly which verdicts it forces me to abandon and why, and tell me what it predicts about a case I haven't listed: the particles that currently make up my body versus the particles that made up my body seven years ago, which are almost entirely different. Are those two collections the same thing — me — or is that a different kind of question from the one I've been asking?
reasoning: |-
  Okay, let me start by understanding the user's dilemma. They're grappling with the Special Composition Question in metaphysics, trying to reconcile their intuitive judgments about when parts compose a whole. The user has listed ten specific cases where their intuitions clash, and they're seeking a unifying principle or guidance on which intuitions might need revision.

  First, I need to analyze each case to identify patterns. The cat (1) is a clear composite object, while the sand pile (2) isn't. But the sand dune (3) feels like it should be a composite, creating tension with the pile. Similarly, the cloud (4) is considered a composite, which seems inconsistent with the sand pile. Cases like shaking hands (5) and scattered cards (6) are non-composites, but stacked cards are composites, raising questions about spatial arrangement's role. The swarm of bees (7) isn't a composite, but ant colonies as superorganisms complicate things. The corpse (8) remains a composite after death, challenging a life-based principle. The watch (9) shifts from composite to non-composite based on assembly, and the rock (10) is a composite despite being similar to a sand pile.

  The user has tried principles like fastening, life, and functional integration, but each fails some cases. I recall that in metaphysics, common approaches include universalism (everything composes), nihilism (nothing composes), and various restricted principles. The user's intuitions suggest a middle ground, so restricted composition is likely where to focus.

  Looking at their cases, function keeps appearing. The cat functions as an organism, the watch tells time when assembled, the stacked cards are ready for play. But the sand pile has no function, and the cloud doesn't either—it's just a collection. However, the user considers the cloud a composite. That's a problem. Maybe vagueness or conventionality plays a role here? Social or linguistic practices might influence judgments for clouds and dunes, but that feels unsatisfying metaphysically.

  The corpse is tricky. It's not alive but still considered a whole. Perhaps the persistence of form or cohesion matters. The rock has bonded grains, unlike the sand pile. But bonding is physical, not metaphysical—unless we tie it to functional persistence. The corpse retains the body's form temporarily.

  For the bees vs. ant colonies, the superorganism concept suggests functional integration at the colony level. If the ants function as a unit with division of labor, that could warrant composition. Bees in a swarm might not have that integration, so no composite.

  The identity over time question—whether the body from seven years ago is the same as now—touches on persistence. The functional principle might handle this: as long as the organism maintains its functional integrity, it persists despite part replacement. But the user is asking about the collection of particles, not the organism. The particles seven years ago composed me then, and current ones compose me now, but they're different collections. So they don't compose the same thing now; instead, the organism persists through part changes.

  Putting this together, a functional principle seems promising but needs refinement. Maybe: parts compose a whole if they form an integrated system with a unified function that's more than the sum of parts. This covers the cat (metabolic functions), the watch (time-telling), stacked cards (gaming unit), rock (structural integrity), and corpse (retained form/cohesion temporarily). 

  But the cloud and dune don't have functions. The user must abandon seeing them as composites or adjust the principle. Perhaps include cases where collective behavior emerges, but that might be too vague. Alternatively, accept that some composites are conventional, not metaphysical. The user might need to concede that dunes and clouds are composites due to human categorization, not objective metaphysics.

  The sand pile vs. dune inconsistency remains. If shape and history make the dune a composite but not the pile, that's problematic. Unless the dune's stability and role in an ecosystem grant it functional properties, but that's a stretch. The user might have to give up the dune as a composite or accept the pile as one, but they strongly reject the latter.

  For the bees, if biologists call ant colonies superorganisms due to functional integration, it might qualify, while a bee swarm doesn't. This distinction could resolve the issue, aligning with biological practice without overextending.

  In conclusion, the best principle is functional integration, requiring a unified function beyond aggregation. This forces abandoning the cloud and dune as metaphysically composite, seeing them as loose collections. The handshake and scattered cards are correctly non-composites. The corpse is included due to residual functional structure. The rock's bonding provides functional stability. The body's particles over time: different collections compose the same persisting organism due to functional continuity, addressing the persistence question separately from composition at a time.
answer: |-
  Based on your intuitively compelling but conflicting verdicts, the principle that best captures *most* of them while forcing minimal revision is a **Functional Integration Principle**:

  **Proposed Principle:**  
  *Some things, Xs, compose a further thing Y if and only if the Xs are integrated together to form a stable system that performs a unified function F, where F is not merely the aggregate function of the Xs acting independently, and the persistence of Y depends on the maintenance of this integrated state performing F.*

  **How it captures your verdicts:**

  1.  **Living Cat:** YES. The particles are integrated into a stable, self-sustaining system performing the unified function of being a living cat (metabolism, homeostasis, reproduction, etc.). This function isn't just the particles acting independently.
  2.  **Pile of Sand Grains:** NO. The grains lack integration into a system with a unified function beyond "being a pile." They act independently.
  3.  **Sand Dune:** **Requires Revision (Probably NO).** While shaped by wind, a dune typically lacks a *unified function*. It doesn't *do* anything as a system that the grains don't do independently (e.g., pile up, erode). Its "stability" is relative and passive, not actively maintained by integrated processes. *(You likely need to abandon (3) to align with (2) or significantly reinterpret what "function" a dune could have).*
  4.  **Cloud:** **Requires Revision (NO).** Similar to the dune. Water droplets condense and evaporate based on atmospheric conditions acting on them individually or in small groups. There's no integrated system performing a unified function *as a cloud*. Its persistence isn't maintained by internal integration. *(You must abandon (4) if you want consistency with (2) and the principle; otherwise, you need a different principle).*
  5.  **Two Strangers Shaking Hands:** NO. They form a temporary spatial arrangement (contact) but lack integration into a stable system with a unified function beyond the individuals' independent actions (greeting). No new functional entity emerges.
  6.  **Scattered Cards:** NO. No integrated system, no unified function beyond "being individual cards."
      **Stacked Cards in Box:** **Requires Revision (Probably NO).** Spatial arrangement facilitates the *potential* for a function (playing a game), but the cards themselves aren't integrated into a system *performing* a unified function *as a deck*. The box isn't functionally integrated with the cards. *(You likely need to abandon the stacked deck verdict unless you can argue the deck-in-box is an artifact system with the function of "being ready for play" – this is a stretch for the principle and feels conventional).*
  7.  **Swarm of Bees:** NO. While coordinated, a flying swarm typically lacks the deep integration and unified function of a *superorganism*. It's many bees flying near each other with individual/simple collective goals (e.g., relocating).
      **Ant Colony (Superorganism):** YES. If biologists are right, the ants (and fungus, etc.) are deeply integrated into a stable system performing unified colony-level functions (reproduction, resource acquisition, defense, waste management) that aren't just the aggregate of individual ant functions. The *colony* persists based on maintaining this integration.
  8.  **Human Corpse:** YES (Temporarily). The particles remain integrated into a stable (though decaying) system that *temporarily* retains the unified function of "being a human body" – maintaining its structure, allowing forensic study, etc. This function is distinct from the aggregate functions of the particles. Persistence *as a body* depends on this (decaying) structural integrity. (Note: This verdict requires accepting "being a corpse" as a genuine function; if not, abandon (8) as a composite).
  9.  **Assembled Watch:** YES. The parts are integrated into a stable system performing the unified function of telling time. This function isn't just the aggregate of the parts (gears don't tell time alone). The watch's persistence depends on this integration.
      **Disassembled Watch:** NO. No integration, no unified function beyond the individual parts.
  10. **Rock:** YES. The mineral grains are strongly bonded/integrated into a stable system performing the unified function of "being a cohesive, structural unit" (resisting fragmentation, maintaining shape under typical stress). This function isn't just the aggregate of the grains (a pile lacks cohesion). Persistence *as that rock* depends on this bonded state. *(Contrasts with sand pile due to degree and nature of integration enabling a unified function).*

  **Verdicts You Must Abandon/Revise & Why:**

  *   **(3) Sand Dune:** Must likely be abandoned. Passive shape and causal history, without active integration or a unified function, don't meet the principle. The principle pushes you towards seeing it as just grains, like the pile.
  *   **(4) Cloud:** Must be abandoned. Similar reasoning to the dune. Lack of internal integration and unified function.
  *   **(6) Stacked Deck:** Must likely be abandoned. Mere spatial arrangement enabling potential use doesn't constitute current functional integration into a system performing a unified function. The principle suggests it's still just 52 cards in a box.
  *   **(7) Ant Colony:** Requires accepting the superorganism view. If biologists are correct that it meets the functional integration criteria, then YES. If not, then NO like the bee swarm.

  **Strengths of this Principle:**

  *   Explains the core distinction between "mere piles" (sand, scattered cards) and integrated objects (cat, watch, rock).
  *   Handles life (cat) and non-life (watch, rock, corpse) composites.
  *   Explains why assembly matters for artifacts (watch, *maybe* stacked deck if revised).
  *   Avoids relying solely on vague boundaries (cloud), shape (dune vs pile), or spatial arrangement (stacked cards vs scattered).
  *   Addresses the biological case (ant colony vs bee swarm) based on scientific description of integration.
  *   Explains the rock vs sand pile distinction via *functional cohesion* derived from bonding.

  **Weaknesses:**

  *   "Unified function" can be fuzzy. Is "being a corpse" or "being a structural unit" a robust enough function? Is "being ready to play" a function of the stacked deck?
  *   Relies on a somewhat teleological notion of "function" (especially for artifacts and organisms), which some metaphysicians find problematic.
  *   May struggle with very simple composites (like the rock) where the "function" seems very basic (cohesion).

  **Your Body Over Time: Particles Now vs. Seven Years Ago:**

  This question shifts from **composition** (what composes a whole *at a time*) to **persistence** or **identity over time** (is a whole existing at one time the *same thing* as a whole existing at another time?).

  1.  **Composition Question (At a Time T):**
      *   The collection of particles constituting your body *at time T* (say, today) composes a thing: your living body (an organism).
      *   The collection of particles constituting your body *at time T-7 years* composed a thing: your living body (the same organism) *at that past time*.
      *   These are *two different collections of particles* composing *two different temporal parts* of the same persisting object (you).

  2.  **Persistence/Identity Question (Over Time):**
      *   Is the living body composed of particles at T the *same thing* as the living body composed of (mostly different) particles at T-7 years? According to the functional integration principle applied to persistence, likely **YES**.
      *   **Why?** The principle suggests that what matters for the persistence of the composite object (you, the organism) is the *continuity of the integrated functional system*. As long as the processes of metabolism, repair, homeostasis, etc., maintain the functional integration of the organism *as a living system* in a continuous way (even while gradually replacing parts), the *same object* persists. The identity of the whole depends on the continuity of its functional organization, not the identity of its material parts. You are the same living organism over time, despite part replacement, because your functional integration persists continuously.

  **In summary:** The Functional Integration Principle best reconciles your core intuitions about organisms, artifacts, and cohesive non-living things, while forcing you to abandon composites for clouds, dunes, and likely stacked decks. It distinguishes composition (at a time) from persistence (over time), explaining how you persist despite particle replacement through the continuity of functional integration.
