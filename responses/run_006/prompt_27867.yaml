prompt: |-
  I've been trying to work out on my own how you're supposed to change your mind when the evidence doesn't come in as a clean yes/no. Like I half-see something move in the dark and my probability that it's a cat goes from 10% to 60% without any single proposition becoming certain. I've gathered that the standard rule (update on the thing you learned for sure) doesnt cover this, and that there are fancier rules like Jeffrey conditionalization that are supposed to. Before I commit to one of them, I want the spec: what does any rule for updating on uncertain evidence actually have to deliver? Give me the requirements list -- the cases it has to get right, the distinctions it can't collapse (your evidence changing vs the world changing, for instance), the facts about probability it can't contradict, and whether the order of two murky observations should matter -- with the reason each one counts as a requirement. Also say which requirements are non-negotiable and which are just conveniences or aesthetics, and flag any pair that can't be had together. Keep the scorecard of existing rules brief; the list is the part I'm after.
reasoning: |-
  We are discussing how to update probabilities when the evidence is uncertain, i.e., not a single proposition that becomes certain. The standard Bayesian update (conditionalization) requires that you learn a proposition with certainty. In cases of uncertain evidence (like seeing something move in the dark and raising the probability of a cat without being certain of any particular proposition about what you saw), we need a more flexible rule.

  The goal is to specify the requirements (the "spec") for any rule that updates on uncertain evidence. We will list the cases it must handle, distinctions it must preserve, and properties it must satisfy. We also note which requirements are non-negotiable and which are more about convenience or aesthetics, and flag any conflicts.

  ## Requirements for an Update Rule on Uncertain Evidence

  1. **Probabilistic Coherence (Non-negotiable)**: 
     - After updating, the new degrees of belief must form a probability distribution (non-negative, sum to 1, etc.). 
     - Reason: We are representing degrees of belief, and probability theory is the standard framework for coherent reasoning under uncertainty.

  2. **Reflection of the Evidence (Non-negotiable)**:
     - The update must appropriately reflect the change in confidence due to the uncertain evidence. For example, if the uncertain evidence causes the probability of a cat to rise from 10% to 60%, then the updated probability of the cat must be 60%.
     - Reason: The whole point is to change beliefs in response to the evidence.

  3. **Distinction between Evidence Change and World Change (Non-negotiable)**:
     - The update must not confuse changes in our evidence with changes in the world. For example, if we see something that makes us think a cat is more likely, we are updating because of a change in our perceptual evidence, not because the cat suddenly became more likely without any evidence (which would be a change in the world). 
     - Reason: This is a fundamental distinction in epistemology.

  4. **Order Independence? (Context-dependent)**:
     - The rule should specify whether the order of two murky observations matters. In general, we expect that the order of evidence might matter (because the second observation may be interpreted in light of the first). However, if the two observations are independent, then the order might not matter. The requirement is that the rule should be able to account for sequential updates and the order should matter only when the evidence is not independent.
     - Reason: We want to model sequential learning. However, if the rule forces order to matter when it shouldn't (e.g., for independent evidence) or vice versa, that would be a problem.

  5. **Commutativity (Optional, but desirable in some cases)**:
     - Ideally, if two pieces of evidence are independent (in some sense) then the order of updating shouldn't matter. But note: in general, for uncertain evidence, commutativity is not always required because the way we interpret the second piece of evidence might depend on the first. So this is more of a convenience and may not always be non-negotiable.
     - Reason: It simplifies updating and is a property that holds for standard conditionalization when learning with certainty. But for uncertain evidence, it may not hold and that might be acceptable.

  6. **Minimal Change (Aesthetic/Convenience)**:
     - The update should change the probabilities as little as possible to accommodate the new evidence. This is sometimes called "conservatism" or "minimum cross-entropy" principle. 
     - Reason: We don't want to change our beliefs arbitrarily. However, there might be multiple ways to achieve the constraint imposed by the evidence, so minimal change is a guideline.

  7. **Handling Multiple Constraints (Non-negotiable for the rule's scope)**:
     - The rule should be able to update on multiple uncertain pieces of evidence at once. For example, if we have an observation that simultaneously changes our probabilities for several propositions (e.g., the probability of a cat and the probability of a dog), the rule should allow updating on all of them.
     - Reason: Real evidence often affects multiple beliefs simultaneously.

  8. **Compatibility with Standard Conditionalization (Non-negotiable)**:
     - In the case where the evidence is certain (i.e., we update on a proposition with probability 1), the rule should reduce to standard Bayesian conditionalization.
     - Reason: We want the rule to generalize the standard case.

  9. **Internal Consistency (Non-negotiable)**:
     - The update rule must be consistent in the sense that if we update on the same evidence twice, it should not change the probability distribution beyond the first update (idempotency). 
     - Reason: Updating twice on the same evidence should not change anything the second time.

  10. **Learning from Experience (Non-negotiable)**:
      - The rule should allow for learning from repeated experiences. For example, if we have multiple similar murky observations, the probability of the cat should eventually converge to near 1 (if it is indeed a cat) or near 0 (if it is not). 
      - Reason: We expect that repeated evidence should lead to increased confidence.

  ## Potential Conflicts

  - **Order Independence vs. Order Mattering in Dependent Evidence**: We cannot have a rule that always makes order irrelevant because sometimes evidence is dependent. But we also cannot have a rule that always requires order to matter because sometimes it shouldn't. The rule must be flexible enough to handle both. This isn't a conflict in requirements but a requirement for flexibility.

  - **Minimal Change vs. Other Constraints**: The principle of minimal change might conflict with the requirement to exactly match the new probabilities for the directly affected propositions (Requirement 2). But in fact, the minimal change principle is often used to determine the update when there are multiple ways to satisfy the new constraints.

  ## Existing Rules and Their Brief Scorecard

  1. **Jeffrey Conditionalization**:
     - **How it works**: You directly set new probabilities for a partition of the space (e.g., {cat, not cat}) and then redistribute the probabilities of other propositions by weighting by the new probabilities of the partition.
     - **Meets**: Requirements 1, 2 (if the partition is chosen appropriately), 3 (arguably), 8, 9, 10 (with repeated updates). 
     - **Fails**: It requires that the evidence is captured by a partition. Also, it does not specify how to choose the partition, which might be problematic (Requirement 7 might be partially met). It does not necessarily satisfy minimal change (Requirement 6) in the general case.

  2. **Field Conditionalization**:
     - **How it works**: It updates by rescaling the probabilities by a function that represents the evidential input. It uses a parameter for the strength of the evidence.
     - **Meets**: 1, 2 (if the input function is set appropriately), 3, 8? (only in special cases), 9, 10.
     - **Fails**: It might not handle multiple constraints (Requirement 7) as naturally.

  3. **Probability Kinematics**:
     - This is essentially the same as Jeffrey conditionalization.

  4. **Generalized Entropy Maximization** (e.g., the principle of minimum cross-entropy):
     - **How it works**: You update by finding the probability distribution that is closest (in cross-entropy) to the prior distribution and satisfies the new constraints (e.g., the new probabilities for certain events).
     - **Meets**: 1, 2, 6 (by design), 7 (can handle multiple constraints), 8 (if the constraint is a single event with probability 1, it reduces to conditionalization), 9 (if the constraints are the same, the same distribution is found), 10 (with repeated updates, it should converge).
     - **Fails**: It might be computationally intensive and not as intuitive. Also, it requires that the constraints are consistent and that there is a unique solution (which there is under the constraints). It does not inherently preserve the structure of the evidence (like the partition in Jeffrey) so Requirement 3 might be a matter of how constraints are set.

  ## Conclusion

  The requirements list is:

  1. Probabilistic Coherence (non-negotiable)
  2. Reflection of the Evidence (non-negotiable)
  3. Distinction between Evidence Change and World Change (non-negotiable)
  4. Order of Updates: The rule should allow for sequential updates and the order should matter when the evidence is dependent (non-negotiable for flexibility). Order independence for independent evidence is a desirable property but not always required (and sometimes not possible without independence).
  5. Commutativity: Desirable in cases of independent evidence, but not always necessary (and sometimes not possible).
  6. Minimal Change: A convenience/aesthetic principle to avoid arbitrary changes.
  7. Handling Multiple Constraints: Non-negotiable for the rule to be generally applicable.
  8. Compatibility with Standard Conditionalization: Non-negotiable.
  9. Internal Consistency (Idempotency): Non-negotiable.
  10. Learning from Experience: Non-negotiable.

  Note: The rule must be flexible enough to model the fact that the same physical event might be interpreted differently (and hence lead to different constraints) at different times (so order might matter appropriately).

  The minimum cross-entropy (or maximum entropy) approach is a strong candidate because it meets most of the requirements, including handling multiple constraints and minimal change. However, Jeffrey conditionalization is simpler and more intuitive when the evidence can be captured by a partition.

  It's important to note that the choice of rule might also depend on the specific interpretation of the uncertain evidence and the structure of the problem.
answer: |-
  Below is the requirements list ("spec") for any rule updating on uncertain evidence, designed to address your core concern: handling cases where evidence isn't cleanly true/false but still shifts probabilities (e.g., "half-seeing" something). The list includes **cases to handle**, **distinctions to preserve**, **formal properties**, and **trade-offs**, with justifications and priority levels. Existing rules are scored briefly at the end.

  ---

  ### **Requirements List for Updating on Uncertain Evidence**

  1. **Probabilistic Coherence (NON-NEGOTIABLE)**  
     **What it must deliver:** Output must be a valid probability distribution (non-negative, sums to 1).  
     **Reason:** Violating basic probability axioms breaks rationality.  
     **Priority:** Foundational.

  2. **Evidence-Response Faithfulness (NON-NEGOTIABLE)**  
     **What it must deliver:** If evidence directly shifts your credence in proposition \(A\) from \(P_\text{old}(A)\) to \(P_\text{new}(A) = x\), the rule must output \(x\).  
     **Example:** Your "half-seen movement" shifts \(P(\text{cat})\) from 10% to 60%; the rule must deliver 60%.  
     **Reason:** The rule exists to respect such shifts. Ignoring them defeats its purpose.  
     **Priority:** Core to the problem.

  3. **World-Change vs. Evidence-Change Distinction (NON-NEGOTIABLE)**  
     **What it must deliver:** Updating on *new evidence* (e.g., a murky observation) must be distinguishable from *changes in the world* (e.g., the cat actually becoming more likely).  
     **Case to handle:** Your credence in \(A\) rising because you saw something vs. rising because \(A\) became objectively more probable (e.g., via new background information).  
     **Reason:** Epistemology requires separating belief updates (evidence) from ontological changes (world). Collapsing these invalidates learning.  
     **Priority:** Foundational.

  4. **Compatibility with Certain Evidence (NON-NEGOTIABLE)**  
     **What it must deliver:** If evidence *is* certain (e.g., you clearly see the cat), the rule must reduce to standard Bayesian conditionalization: \(P_\text{new}(B) = P_\text{old}(B \mid A)\).  
     **Reason:** The rule must generalize standard probability theory. Failure implies inconsistency.  
     **Priority:** Boundary-case necessity.

  5. **Idempotence (NON-NEGOTIABLE)**  
     **What it must deliver:** Updating twice with the *same* uncertain evidence must not change beliefs beyond the first update.  
     **Reason:** Repeated identical evidence shouldn't amplify shifts arbitrarily (e.g., two identical "half-sees" of the same event shouldn't push \(P(\text{cat})\) from 10% → 60% → 100%).  
     **Priority:** Basic consistency.

  6. **Order Sensitivity (CONTEXT-DEPENDENT)**  
     **What it must deliver:**  
     - If two observations are *dependent* (e.g., seeing murky movement then hearing a meow), order **must** matter.  
     - If observations are *independent* (e.g., two unrelated murky glimpses), order **should not** matter.  
     **Case to handle:**  
     - Order matters: See movement (\(P(\text{cat})\) 10% → 60%), then hear meow (\(P(\text{cat})\) 60% → 90%) vs. reversed order.  
     - Order irrelevant: Two statistically identical vague observations.  
     **Reason:** Real-world evidence is often sequential and context-dependent. A rule must reflect this or misrepresent learning.  
     **Priority:** Non-negotiable for dependency; desirable for independence.

  7. **Minimal Information Loss (CONVENIENCE/AESTHETIC)**  
     **What it should deliver:** Updates should preserve as much prior information as possible while respecting the evidence shift.  
     **Reason:** Avoids arbitrary changes to unrelated beliefs (e.g., if \(P(\text{cat})\) increases, \(P(\text{dog})\) might decrease, but \(P(\text{moon})\) should stay fixed).  
     **Priority:** Desirable for efficiency/accuracy but not strictly necessary. Violations can be "fixed" by adding domain knowledge.

  8. **Partition Independence (CONVENIENCE)**  
     **What it should deliver:** Updates shouldn't depend on how you partition the hypothesis space (e.g., defining \(\{\text{cat}, \text{not-cat}\}\) vs. \(\{\text{dog}, \text{raccoon}, \text{other}\}\)).  
     **Reason:** Evidence about cats shouldn't arbitrarily alter dog/raccoon probabilities without justification.  
     **Priority:** Aesthetic—violations can be mitigated by careful modeling.

  ---

  ### **Impossible Pairings & Trade-offs**
  - **Order Independence vs. General Dependence Handling:**  
    You *cannot* have a rule that always ignores order *and* handles dependent evidence correctly. Order must matter when evidence is dependent (Requirement 6).  
  - **Minimal Change vs. Partition Independence:**  
    Rules preserving minimal information (e.g., entropy-based) often violate partition independence. Rules enforcing partition independence (e.g., Jeffrey) may change unrelated probabilities "non-minimally."

  ---

  ### **Brief Scorecard of Existing Rules**
  | Rule                   | Meets Non-Negotiables? | Handles Order? | Minimal Change? | Partition Indep.? |  
  |------------------------|------------------------|----------------|-----------------|-------------------|  
  | **Jeffrey Conditionalization** | Yes (1–5)              | Only if evidence partitions align | No              | **Yes**           |  
  | **Field Conditionalization**   | Yes (1–5)              | **Yes** (flexible) | No              | No                |  
  | **Entropy Maximization**       | Yes (1–5)              | **Yes**        | **Yes**         | No                |  
  | **Leitgeb's Rule**             | Partial (fails 2 if constraints conflict) | Yes | No              | No                |  

  **Key Takeaways:**  
  - **Jeffrey** is simple but partition-sensitive.  
  - **Field** handles order well but may over/under-change beliefs.  
  - **Entropy methods** (e.g., Kullback-Leibler) are rigorous but computationally complex.  
  - No rule aces all "convenience" criteria—choose based on your use case.  

  ---

  ### **Recommendation**  
  For your "half-seen cat" case:  
  1. Start with **Jeffrey Conditionalization** if your evidence naturally partitions hypotheses (e.g., \(\{\text{cat}, \text{not-cat}\}\)).  
  2. Switch to **entropy-based methods** if you have multiple simultaneous shifts (e.g., \(P(\text{cat})\) and \(P(\text{dog})\) both change) and want minimal updates.  
  3. Use **Field Conditionalization** for sequential, context-dependent updates (e.g., movement → meow).  

  All non-negotiables are covered by these rules; choose based on which convenience/aesthetic criteria matter most for your context.
