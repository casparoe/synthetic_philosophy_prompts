prompt: |-
  ok so I just spent like three hours arguing with my friend about virtue ethics and the situationist stuff and I'm trying to figure out what rule she's actually running. Here's her track record:

  - Milgram: she says it tells you nothing about character, pure situation.
  - Darley & Batson's Good Samaritan study (seminary students, some late for a talk): not character, all situation.
  - Hartshorne & May honesty studies where kids cheat on tests but not in sports: not character, just domain-specific.
  - A guy who's volunteered at the same food bank every Thursday for 15 years: she says that IS character.
  - Someone who's consistently kind to everyone — baristas, coworkers, family, strangers, the works: character.
  - Someone who's honest at work but lies on their taxes and to their friends: she says no, that's not character, that's just situationally variable.
  - A whistleblower who reports their company's fraud knowing they'll lose their job and probably their career: character.

  Now the case we actually disagreed on: a person who set up an automatic monthly donation of 10% of their income to effective charities twenty years ago, never thinks about it, doesn't volunteer, doesn't give in any other way, and when asked says "oh I set that up ages ago and honestly forget about it most months." Would she say that's character or not?

  What I really want to know is: what rule is she running that fits all seven of her verdicts, what are the other rules that also fit them, which ones diverge on the automatic-donor case, and what additional case would cleanly tell the rules apart?
reasoning: |-
  Okay, let me try to unpack this user's query. They spent three hours arguing with a friend about virtue ethics and situationist critiques. The user provided seven examples of their friend's judgments on different scenarios, and they want to figure out the underlying rule the friend is using. The main point of contention is the automatic donor case.

  First, I need to analyze each of the friend's verdicts. She dismisses Milgram, Good Samaritan, and Hartshorne & May studies as purely situational or domain-specific, not indicative of character. But she considers consistent volunteering and kindness as character. The whistleblower is also character. The inconsistent person (honest at work but lies elsewhere) isn't character. 

  The key seems to be the combination of consistency across contexts and conscious engagement. The friend requires both traits to be stable across different situations and involve active, deliberate choices. The automatic donation is consistent but lacks conscious effort, so the friend might not see it as character. 

  Looking at possible rules, the "Consistency + Conscious Engagement" rule fits all seven cases. Other rules like "Consistency Only" would include the automatic donor, which the friend likely rejects. To test this, I should propose an additional case: someone who consciously volunteers but inconsistently. If the friend denies it's character, that confirms her rule requires both consistency and active engagement.
answer: |-
  Based on your friend's track record, here's the breakdown of her implicit rule, alternative rules, how they handle the automatic donor, and a diagnostic case:

  **Your Friend's Likely Rule:**

  *   **Consistency + Conscious Engagement:** A behavior demonstrates "character" only if it meets **BOTH** criteria:
      1.  **Behavioral Consistency:** The behavior must be *stable and repeated over time* and *across different contexts/situations* (demonstrating it's not just a one-off or domain-specific).
      2.  **Active Conscious Engagement:** The behavior must involve *deliberate choice, effort, or conscious awareness* at the time of action (demonstrating an underlying stable disposition rather than just habit or automation).

  **How it fits her verdicts:**

  1.  **Milgram:** One-off situation, extreme pressure. *No consistency over time/contexts, highly situational pressure.* **Not Character.**
  2.  **Good Samaritan:** One-off situation, time pressure manipulated. *No consistency over time/contexts, strong situational pressure.* **Not Character.**
  3.  **Hartshorne & May:** Consistency *within* domains (e.g., school tests) but *not across* domains (e.g., sports vs. tests). *Fails cross-context consistency.* **Not Character.**
  4.  **15-Year Food Bank Volunteer:** Repeated behavior over a long time. Requires *consistent conscious effort* each week (getting ready, going there, participating). **Character.**
  5.  **Consistently Kind to Everyone:** Behavior is *consistent across vastly different contexts* (baristas, coworkers, family, strangers). Requires *ongoing conscious effort and choice* in interactions. **Character.**
  6.  **Honest at Work/Lies Elsewhere:** Behavior is *inconsistent across contexts* (work vs. taxes/friends). Fails cross-context consistency. **Not Character.**
  7.  **Whistleblower:** While potentially a one-off act, it reflects a *profound, conscious choice* involving significant personal sacrifice, likely stemming from deep-seated values (integrity, justice) applied consistently *to a core principle* in a high-pressure situation. **Character.** (Note: This is the most debatable fit, but the conscious engagement & sacrifice aspect likely tips it for her).

  **The Automatic Donor Case (Based on her Rule):**
  She would likely say **NOT Character**.
  *   *Consistency?* YES (20 years, 10% income).
  *   *Conscious Engagement?* NO ("never thinks about it," "forget[s] about it most months"). The behavior is automated and lacks ongoing conscious choice or effort.

  **Alternative Rules that Also Fit Her 7 Verdicts:**

  1.  **Consistency Across Diverse Contexts (CADC):** Character requires stable behavior across *significantly different situations/domains* (e.g., work, home, taxes, strangers). This fits Milgram/GoodSam (no consistency), Hartshorne (no cross-domain consistency), Volunteer (consistent in volunteering context, but only one context - *might be borderline*), Kind (consistent across diverse contexts), Inconsistent Honesty (no cross-context), Whistleblower (one act, but applies principle in a core way? *Borderline*). **Diverges on Volunteer?** (If volunteering is only one context, this rule *might* not classify it as character, unlike your friend).
  2.  **Costly/Effortful Consistency (CEC):** Character requires behavior that is *both consistent and involves significant personal cost or effort*. This fits Milgram/GoodSam (low effort/cost for obedience? *debatable*), Hartshorne (no consistency), Volunteer (consistent effort/cost), Kind (consistent effort/cost), Inconsistent Honesty (no consistency), Whistleblower (high cost/effort). **Diverges:** Might struggle slightly with Kindness (is being kind *always* costly?), but generally fits. **Diverges on Automatic Donor?** YES. CEC would likely say **Character** (consistent financial cost) *unless* the lack of awareness negates the "effort/cost" aspect.

  **Rules Diverging Specifically on the Automatic Donor Case:**

  *   **Your Friend's Rule (Consistency + Conscious Engagement):** **NOT Character** (Lacks conscious engagement).
  *   **Purely Behavioral Consistency (PBC):** **Character** (It's highly consistent over a long period). *But this rule fails Hartshorne & May (she said not character) and Inconsistent Honesty (she said not character).*
  *   **Costly/Effortful Consistency (CEC):** **Likely Character** (Consistent financial cost/sacrifice). *But this rule might classify the Volunteer and Kind person similarly.*
  *   **Intentionality/Purpose Rule:** If focused on the *initial intent* and *purpose* of the setup, might say **Character** (Initial conscious choice to be charitable). *But this rule fails Milgram/GoodSam (participants intended to be good subjects) and possibly the Volunteer (if they just got into a routine without deeper thought).*

  **Diagnostic Case to Distinguish Rules:**

  Propose this scenario: **"The Reluctant but Consistent Helper":** *Sarah dislikes volunteering and finds interacting with needy people draining. However, she believes it's her moral duty. Every single Saturday for 10 years, she forces herself to get up, goes to the soup kitchen, and performs her duties diligently and effectively, despite her inner aversion. She never volunteers elsewhere or engages in other charitable acts.*

  *   **Your Friend's Rule (Consistency + Conscious Engagement):**
      *   *Consistency:* YES (10 years, every Saturday).
      *   *Conscious Engagement:* **YES (HIGH)**. Requires massive, deliberate effort and conscious choice *every single time* to overcome aversion. **Verdict: CHARACTER.**
  *   **Consistency Across Diverse Contexts (CADC):**
      *   Only one context (soup kitchen). **Verdict: NOT CHARACTER.**
  *   **Costly/Effortful Consistency (CEC):**
      *   High effort/cost (overcoming aversion weekly). **Verdict: CHARACTER.**
  *   **Purely Behavioral Consistency (PBC):**
      *   Highly consistent behavior. **Verdict: CHARACTER.**

  **Why this case works:**
  *   It clearly separates **Consistency + Conscious Engagement** (your friend's likely rule) from **Consistency Across Diverse Contexts**. Your friend would say CHARACTER (due to the high conscious effort), while CADC would say NOT CHARACTER (only one context).
  *   It also separates it from **Purely Behavioral Consistency** (which would accept it, but your friend rejects cases like Hartshorne & May showing inconsistency).
  *   It aligns your friend's rule with **Costly/Effortful Consistency** on this case, but you already know they diverge on the Automatic Donor (CEC: Character, Friend: Not Character).

  **Conclusion:** Your friend's rule is best described as requiring **Consistency *and* Conscious Engagement**. The Automatic Donor fails on the Conscious Engagement criterion. The "Reluctant Helper" case cleanly distinguishes her rule from a strict Consistency-Across-Diverse-Contexts rule.
