answer: |-
  ### Essay Question  
  "Danto argues that narrative sentences reveal an asymmetry between explanation and prediction that fundamentally challenges Hempel's covering-law model. Defend or challenge the following claim: *Because historical explanation is inherently retrospective and relies on narrative sentences, it cannot satisfy the symmetry requirement of the covering-law model without abandoning what makes historical explanations distinctive and causally adequate.* In your response, address:  
  (a) Why narrative’s retrospective structure resists subsumption under general laws;  
  (b) How Danto’s narrative sentences expose the failure of prediction-explanatory symmetry;  
  (c) Whether rejecting covering-law forces history to abandon causal explanation.  
  Distinguish at least two distinct objections to the covering-law model and evaluate which cuts deeper."  

  ---

  ### Model Answer (598 words)  
  The claim is defensible: narrative explanation’s retrospective character and reliance on narrative sentences undermine the covering-law model’s symmetry requirement while preserving causal adequacy. This reveals two objections—one epistemic, one conceptual—with the latter being more fundamental.  

  **(a) Retrospectivity vs. General Laws**  
  Narrative explanations resist subsumption under laws because they interpret past events *from a later vantage point*, integrating knowledge unavailable to historical actors. For instance, describing the *July Crisis (1914)* as "the prelude to World War I" relies on post-1918 knowledge. General laws (e.g., "nationalism increases conflict probability") cannot capture this *significance*, as laws abstract from singular temporal perspectives. Historians explain *why* an event mattered in a specific causal chain, not merely *that* it occurred under invariant regularities. This retrospectivity is constitutive of historical understanding, not a practical limitation.  

  **(b) Narrative Sentences and Symmetry Failure**  
  Danto’s narrative sentences—e.g., "Aristarchus anticipated Copernican heliocentrism"—demonstrate why explanation and prediction cannot be symmetric in history. Such sentences describe an event (*E*) by referencing later events (*E₂*) unknown at *E*’s occurrence. A covering-law model demands that if *E* explains *E₂*, one should predict *E₂* from *E* and laws. But *no amount of laws* allows predicting *E₂* from *E* alone, as *E₂*’s description depends on *future* contingencies. Aristarchus’s act only becomes "anticipating Copernicus" *after* Copernicus; no contemporary could predict this description. Thus, narrative sentences violate the symmetry thesis (that explanation implies prediction) *in principle*, not merely in practice.  

  **(c) Causal Explanation Survives**  
  Rejecting covering-law does not abandon causality. Narrative explanations instead provide causal accounts through *contextual interconnection*. For example, explaining the French Revolution via "rising bourgeois discontent" traces concrete causal pathways (economic shifts → ideological critiques → political collapse) without invoking universal laws. Causality here derives from counterfactual dependence (e.g., without bread shortages, sans-culotte protests might not have erupted) and mechanistic links (e.g., print culture spreading Enlightenment ideas), not nomological subsumption. Narrative coherence *is* causal coherence: it shows how earlier events *generated* later ones, given contingent conditions.  

  **Two Objections and Their Depth**  
  - *Epistemic objection*: Historians rarely state laws, and historical events are too complex for strict prediction. This is a practical weakness but leaves covering-law *conceivable*.  
  - *Conceptual objection*: Narrative sentences make historical explanation *retrospectively irreducible*. This attacks symmetry—a core tenet of covering-law—by showing that historical facts (like "prelude to WWI") are *constituted* by later developments. This cuts deeper because it proves covering-law incompatible with history’s *temporally perspectival* nature, even if ideal laws existed.  

  Thus, covering-law fails because it cannot accommodate the retrospective constitution of historical significance. Narrative explanation remains causal by elucidating context-dependent generative mechanisms, not despite but *through* its temporally embedded structure.  

  ---

  ### Marking Scheme (20 points, 60 minutes)  
  **A-Grade (18–20 points) Must Demonstrate:**  
  1. **Precise Danto/Hempel Engagement**: Uses "narrative sentences" to *directly* refute symmetry (b), not just mention retrospectivity.  
  2. **Two Distinct Objections**: Clearly separates *practical/epistemic* (e.g., complexity/no stated laws) from *conceptual* (retrospective irreducibility via narrative sentences).  
  3. **Causal Defense**: Explains how narrative causality works *without* laws (e.g., counterfactuals/mechanisms).  
  4. **Depth Evaluation**: Argues why the conceptual objection (symmetry failure) is more fatal than epistemic concerns.  

  **B-Grade (15–17 points) Must Demonstrate:**  
  1. **Basic Retrospectivity Argument**: Explains why laws cannot capture narrative significance (a).  
  2. **Symmetry Problem**: Notes prediction/explanation asymmetry but may not tightly link to Danto.  
  3. **Causal Retention**: States that causality remains but lacks mechanistic examples.  
  4. **Two Objections**: Identifies them but may not rigorously compare depth.  

  **Common Errors (Deductions):**  
  - **–3–4 points**: *Confusing "no stated laws" with "no governing laws"*. Error: Fails to see covering-law could hold *in principle* even if historians don’t state laws.  
  - **–2–3 points**: *Treating narrative as chronology*. Error: Equating narrative with "sequencing events" (e.g., "then A, then B") rather than *explanatory emplotment* (e.g., "A *led to* B because...").  
  - **–3 points**: *Inferring retrospectivity negates causality*. Error: Assumes "retrospective" = "non-causal" (e.g., "narrative is interpretive, not causal").  
  - **–2 points**: *Misapplying symmetry*. Error: Claims asymmetry exists because "predicting the future is hard" (practical), not because narrative sentences *logically* require hindsight.  

  **Key A/B Differentiator**:  
  - **A**: Explicitly ties Danto’s narrative sentences to the *conceptual impossibility* of symmetry.  
  - **B**: Correctly identifies asymmetry but attributes it to complexity/human agency, not retrospective constitution.  

  **Note**: Scores below 15 indicate major omissions (e.g., ignoring symmetry, not addressing causality).  

  ---  
  This structure ensures students confront the *philosophical* tensions (not just Hempel’s formula), while the marking scheme rewards nuanced distinctions and penalizes routine misconceptions. The model answer models concision and argumentative rigor within word limits.
