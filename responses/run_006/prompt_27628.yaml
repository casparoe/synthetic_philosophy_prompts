prompt: |-
  I spent most of last night arguing with a friend about whether there is any real argument that rational agents must maximize expected utility, or whether expected utility theory is just a modeling convention economists impose on people. By the end, my friend offered what he called the standard coherence argument, which he summarized for me roughly like this:

  "There is a real proof here. If your preferences over gambles satisfy a few axioms — completeness, transitivity, and independence — then a theorem shows they can be represented as maximizing the expected value of some utility function. Conversely, if your preferences violate those axioms, you are vulnerable to a money pump: a sequence of trades, each of which you would accept given your preferences, that leaves you worse off no matter what happens. So a person who does not maximize expected utility is provably irrational, in the sense of being self-defeating by their own lights. And the axioms are just minimal consistency requirements; they are purely formal and do not presuppose any substantive view about what is valuable. The only way to reject the conclusion is to deny that choices reveal preferences, which is a far less plausible position. That is why expected utility maximization is the received view of instrumental rationality."

  I do not have the technical background to tell how much of this is established theorem, how much is interpretive gloss, and how much is overstatement, and I do not want to concede or push back on the wrong parts. Could you audit his summary claim by claim?

  Please give me the audit as a single JSON object with the following fields:

  - "claims": an array of objects, one for each distinct claim you can extract from his summary. Each object should have:
    - "claim": a short restatement of the claim (string)
    - "verdict": one of "accurate", "simplification", "misleading", "overstated", or "false" (string)
    - "why": a paragraph explaining the verdict, including what the relevant theorem actually establishes and where the claim deviates from it (string)
    - "defender_would_say": how a careful defender of coherence arguments would respond to the criticism of this claim (string)
    - "critic_would_say": how a critic would push back on this claim (string)
    - "corrected_version": an accurate one-sentence replacement for the claim, or null if the claim is fine as stated (string or null)
  - "overall": an object with:
    - "fairness": one of "mostly_fair", "fair_in_spirit_but_inaccurate_in_detail", or "unfair" (string)
    - "conclusion_survives": whether his final claim, that expected utility maximization is the received view of instrumental rationality, survives the corrections, and in what weakened or qualified form (string)
    - "biggest_error": the single most important misrepresentation in his summary (string)
    - "accurate_core": the part of the summary that is correct and worth keeping (string)
reasoning: |-
  We are auditing the friend's summary of the coherence argument for expected utility theory.
   The summary contains several claims. We will break it down into distinct claims and evaluate each.

   Claim 1: "If your preferences over gambles satisfy a few axioms — completeness, transitivity, and independence — then a theorem shows they can be represented as maximizing the expected value of some utility function."

   Verdict: This is accurate, but note that there are different sets of axioms. The standard ones are completeness, transitivity, continuity, and independence (or substitution). The friend mentioned completeness, transitivity, and independence, but missed continuity. However, in the context of the summary, it's a simplification because continuity is also required.

   Why: The von Neumann-Morgenstern theorem states that if a preference relation over simple lotteries (gambles) satisfies completeness, transitivity, continuity, and independence, then there exists a utility function such that one lottery is preferred to another if and only if the expected utility of the first is greater than that of the second. The friend omitted the continuity axiom, which is necessary to avoid lexicographic preferences. Without continuity, the representation might not hold.

   Defender would say: The continuity axiom is a technical requirement that is non-controversial in most settings. In practice, it is satisfied if there are no infinitely desirable or infinitely bad outcomes. The core idea remains: with reasonable consistency axioms, we get an expected utility representation.

   Critic would say: The continuity axiom is substantive. For example, if there is an outcome that is infinitely bad (like death) compared to others, continuity might fail. Thus, the axioms are not purely formal and may not apply to all agents.

   Corrected version: "If your preferences over gambles satisfy the axioms of completeness, transitivity, continuity, and independence, then a theorem shows they can be represented as maximizing the expected value of some utility function."

   Claim 2: "Conversely, if your preferences violate those axioms, you are vulnerable to a money pump: a sequence of trades, each of which you would accept given your preferences, that leaves you worse off no matter what happens."

   Verdict: This is an overstatement or misleading.

   Why: Money pump arguments are typically used for violations of transitivity (e.g., cyclic preferences) and sometimes for violations of independence, but they are not straightforward for all axiom violations. For violations of the independence axiom, a money pump is not as direct. Also, the money pump argument for violation of continuity is not standard. Moreover, the money pump argument requires that the agent is willing to make the trades repeatedly without learning, and that there is no cost to the trades. It is a thought experiment and may not reflect real-world vulnerability.

   Defender would say: The money pump is a conceptual demonstration of the practical cost of inconsistency. While it might not be a literal sequence of trades in the real world, it shows that the agent's preferences are self-defeating. For independence violations, there are Dutch book arguments (similar to money pumps) in some contexts.

   Critic would say: Money pump arguments are not universal. For example, if the agent only faces the choice once, or if the agent can precommit, then the pump is avoidable. Also, for violations of independence (like in Allais paradox), it's not clear how a money pump would work.

   Corrected version: "If your preferences violate transitivity, you are vulnerable to a money pump. For violations of other axioms, such as independence, similar arguments (like Dutch books) can sometimes be constructed, but they are less direct."

   Claim 3: "So a person who does not maximize expected utility is provably irrational, in the sense of being self-defeating by their own lights."

   Verdict: Overstated.

   Why: The argument shows that if an agent's preferences violate the axioms, then they can be exploited in a way that they end up with a worse outcome according to their own preferences. However, the term "irrational" is loaded and might imply more than just vulnerability to a money pump. Also, the money pump argument does not necessarily extend to all violations (as above). Moreover, there are alternative models (e.g., prospect theory) that violate expected utility but are not necessarily self-defeating.

   Defender would say: The money pump shows that the agent is paying to end up with something they consider worse. That is self-defeating by their own preferences. If an agent's choices lead to a sure loss, that is a clear form of irrationality.

   Critic would say: The agent might not care about the sequential choices in the same way, or might have preferences that are context-dependent. Also, the agent might avoid the pump by being aware of it. Furthermore, rationality might be defined in a way that allows for occasional violations (e.g., due to computational limits) without being self-defeating.

   Corrected version: "A person whose preferences violate the axioms of expected utility (especially transitivity) can be shown to be vulnerable to a sequence of choices that leads to a sure loss, which is self-defeating by their own preferences."

   Claim 4: "And the axioms are just minimal consistency requirements; they are purely formal and do not presuppose any substantive view about what is valuable."

   Verdict: Misleading.

   Why: The axioms are about consistency, but they are not without substantive implications. For example, the independence axiom requires that preferences between two lotteries should not change when mixed with a third lottery. This rules out common patterns such as the Allais paradox, which many people find intuitively rational. The axioms are formal in that they don't specify the utility function, but they do constrain the form of preferences.

   Defender would say: The axioms are indeed minimal conditions for consistent choice. They do not dictate what the agent should value (the utility function can be anything) but only how those values should be combined in the face of uncertainty. The independence axiom, for instance, is a requirement of linearity in probabilities which is necessary for the expected utility form.

   Critic would say: The independence axiom is not a mere consistency condition but a substantive assumption about how choices under uncertainty should be made. It rules out sensitivity to risk in ways that are not inconsistent (as in the Allais paradox). Thus, the axioms impose a specific structure on preferences.

   Corrected version: "The axioms are formal requirements that do not specify the content of the utility function, but they do impose structural constraints on preferences that may rule out some intuitively reasonable behaviors."

   Claim 5: "The only way to reject the conclusion is to deny that choices reveal preferences, which is a far less plausible position."

   Verdict: Overstated.

   Why: There are other ways to reject the conclusion. For example, one might accept that choices reveal preferences but argue that the axioms are too restrictive (as in behavioral economics) or that rationality does not require satisfying the axioms. Also, the revealed preference approach is not the only way to model decision making. Some might argue for a more cognitive model that doesn't rely solely on revealed preferences.

   Defender would say: The entire theory is built on revealed preferences. If we reject that, then we are rejecting the basis of microeconomics. The axioms are meant to be conditions on observable choice behavior, so if choices don't reveal stable preferences, then we cannot even begin to model rationality.

   Critic would say: Choices might not reveal stable preferences because of context effects, framing, or other psychological factors. Moreover, one might accept revealed preferences but argue that the axioms are not necessary for rationality (e.g., under bounded rationality). Thus, denying that choices reveal stable preferences is not the only way out.

   Corrected version: "One major way to reject the conclusion is to deny that choices reveal stable preferences, but critics might also argue that the axioms are too strong or that rationality does not require satisfying them."

   Claim 6: "That is why expected utility maximization is the received view of instrumental rationality."

   Verdict: Accurate in spirit but with caveats.

   Why: Expected utility theory is indeed the dominant model of instrumental rationality in economics and decision theory. However, it has been challenged by behavioral economics and alternative models (e.g., prospect theory, rank-dependent utility). So while it is the "received view", it is not without controversy.

   Defender would say: Despite challenges, expected utility remains the benchmark model of rational choice under uncertainty in economics and decision theory.

   Critic would say: The received view is changing with the rise of behavioral economics, and there is now a plurality of models.

   Corrected version: "Expected utility maximization is the traditional and still dominant view of instrumental rationality in economics, though it faces challenges."

   Overall fairness: The summary is fair in spirit but inaccurate in detail. The friend captures the core argument but oversimplifies and overstates some points.

   Conclusion survives: The conclusion that expected utility maximization is the received view of instrumental rationality survives, but with the qualification that it is a benchmark model that has been challenged and that the axioms are not without controversy.

   Biggest error: The most important misrepresentation is the claim that any violation of the axioms leads to vulnerability to a money pump. This is not straightforward for violations of independence and continuity.

   Accurate core: The core correct part is that there is a representation theorem (with the full set of axioms) and that violations of transitivity can lead to money pumps, which are self-defeating.

   Now, we structure the output as a JSON object with the specified fields.
