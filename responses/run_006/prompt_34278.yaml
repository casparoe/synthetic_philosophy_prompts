  I'm least confident about the implications of immunity to error through misidentification - this literature is complex and contested. The user's interpretation is elegantly minimalist but risks being unfalsifiable if it dismisses all contrary evidence as "later overreach." They might address this by specifying what would count as evidence against their view.

