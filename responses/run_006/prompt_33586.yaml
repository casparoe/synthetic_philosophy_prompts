  For flips in conclusions, Simpson’s paradox comes to mind. Assuming independence could reverse causal judgments (e.g., drug efficacy). The user would probably find that compelling. 

  On unfalsifiability: yes, the default can be shielded by claiming "you missed prior info," but that’s not unique to this principle—defaults often work this way. The real issue is whether it remains useful. If it constantly fails without cues, it’s not truth-tracking. 

