prompt: |-
  I'm a director of engineering at a mid-sized software company, and like many people in this industry who read Slate Star Codex and similar blogs, I've internalized Chesterton's fence as a heuristic: don't tear down a fence until you understand why it was built. But I keep running into the problem that this is too vague to actually guide decisions. My team regularly proposes deprecating old internal services, rewriting legacy modules, removing features that seem to have low usage, and eliminating process steps that look like bureaucratic cruft. When I say "let's make sure we understand why it's there first," the response is often "we looked, and as far as we can tell, it's just historical accident." Sometimes that's true, and sometimes they've missed something important — the legacy service handles an edge case that only triggers at 3 a.m. on the last day of the quarter, the code review step catches a class of error that is rare but catastrophic, the rarely-used feature is the only thing keeping a handful of enterprise customers from churning. I want something more structured than a one-line heuristic, and I want my team to internalize the epistemic humility that the heuristic is pointing at, not just pay lip service to it.

  I've been reading Burke and some of the secondary literature on epistemic conservatism — the idea that existing practices and institutions encode information that no single individual can fully articulate, that the bare fact that something has survived is weak evidence of its functional value, and that the burden of proof should fall on the reformer rather than on the inherited arrangement. I want to translate this into a decision procedure my team can actually run when they're proposing to remove or replace something. The procedure should be a checklist or flowchart they can work through in under an hour before bringing a proposal to me. It should force them to distinguish between "we understand why this was created and the reason no longer applies" and "we can't figure out why this was created, so we're assuming it was pointless." It should identify the cases where the procedure can't give a clear answer and escalation to human judgment is necessary. And it should be honest about the points where the procedure itself is making a judgment call dressed up as a mechanical step.

  Once you've written the procedure, run it on two or three worked examples from software engineering: say, deprecating a legacy authentication service that everyone agrees is a mess, removing a code review step that adds two days to every deployment cycle, and killing a feature that 3% of users still use. For at least one of these examples, the procedure should recommend against the action my team wants to take. Also, flag the limits: what kinds of change proposals does this procedure simply not speak to, and where does the Burkean framework itself break down as a guide to software engineering decisions?
reasoning: |-
  We are going to create a structured decision procedure for evaluating proposed changes (removals, deprecations, simplifications) in a software engineering context. The procedure is inspired by Chesterton's fence and Burkean epistemic conservatism. The goal is to avoid removing something that has hidden value and to force the team to investigate the reasons for the existence of the element in question.

  The procedure will be a checklist with steps. At each step, the team must gather evidence and document their findings. The procedure should be completed in under an hour for most cases, so it must be focused.

  **Procedure: Change Impact Assessment (CIA) Checklist**

  1. **Describe the element to be changed.**
     - What exactly is being proposed for removal/deprecation? (e.g., legacy service, process step, feature)
     - Who uses it? (internal/external, which teams/users)
     - When was it created? (if known)

  2. **State the reason for the proposed change.**
     - What problem does the change solve? (e.g., reduces maintenance, speeds up deployment, simplifies codebase)
     - What are the expected benefits?

  3. **Investigate the original purpose.**
     - Why was this element created? (Check commit messages, design docs, tickets, ask original authors if available)
     - What problem was it solving at the time?
     - If there is no documentation, what can be inferred from the context of its creation?

  4. **Identify current functionality and dependencies.**
     - What does this element do now? (Be specific. If it's code, what are the inputs, outputs, and side effects? If it's a process, what are the steps and who performs them?)
     - What systems, processes, or features depend on this element? (Use dependency mapping, call graphs, process diagrams)
     - Are there any known edge cases or special conditions that it handles? (e.g., time-based, data conditions, user roles)

  5. **Assess usage and monitoring.**
     - How is this element used currently? (Collect usage data: logs, metrics, user analytics, process adherence)
     - If it's a feature, what percentage of users use it? How often? Are there specific user segments (e.g., enterprise)?
     - If it's a process step, what is the compliance rate? Are there instances where skipping it caused problems?
     - If it's a service, what is its load? What are its error rates?

  6. **Evaluate risks of removal.**
     - What could break if we remove this? (Consider direct and indirect effects)
     - What are the worst-case scenarios? (e.g., data loss, security breach, customer churn, compliance violation)
     - How would we detect if something breaks after removal? (Do we have monitoring in place for the affected areas?)

  7. **Consider alternatives to removal.**
     - Can we refactor, replace, or improve instead of removing?
     - Is there a way to achieve the benefits of removal (e.g., simplification) without losing the functionality? (e.g., feature flag, gradual deprecation, automation of process step)

  8. **Weigh costs and benefits.**
     - What are the costs of keeping it? (maintenance, time, complexity, opportunity cost)
     - What are the benefits of keeping it? (avoiding risks, serving users, ensuring stability)
     - What is the net effect? (Quantify if possible, but qualitative is acceptable)

  9. **Make a recommendation.**
     - If the original purpose is understood and no longer relevant, and there are no current critical dependencies or uses, and risks are low -> **Remove**.
     - If the original purpose is unclear, but current usage and risk assessment show no significant value -> **Remove with caution** (maybe with a deprecation period and monitoring).
     - If there is evidence of current value (even if original purpose is unclear) or high risk -> **Do not remove** (or re-evaluate after mitigating risks).
     - If the investigation is inconclusive -> **Escalate** (to the director, with the collected evidence).

  10. **Document the decision and rationale.**
      - Regardless of the decision, document the findings and the reasoning for future reference.

  **Worked Examples**

  **Example 1: Deprecating a legacy authentication service**

  1. **Describe**: A legacy authentication service written in an old framework. It handles user logins for a few older applications.
  2. **Reason**: It's a maintenance burden, uses deprecated libraries, and the team wants to consolidate on a modern auth service.
  3. **Original purpose**: Created 5 years ago to handle authentication for the initial product. The modern service didn't exist then.
  4. **Functionality and dependencies**: It handles login, session management, and password reset. Two internal applications still use it. The modern service doesn't support one legacy protocol (SAML 1.0) that these apps require.
  5. **Usage**: The two apps have about 100 internal users. The service handles about 50 logins/day. No external users.
  6. **Risks**: Removing it would break the two internal apps. The legacy protocol is not supported by the modern service.
  7. **Alternatives**: Update the apps to use a supported protocol? But that requires app changes. Alternatively, extend the modern service to support SAML 1.0? But that's non-standard and insecure.
  8. **Costs/Benefits**: Keeping: maintenance cost (moderate). Removing: saves maintenance but requires updating the apps (costly) or losing functionality.
  9. **Recommendation**: **Do not remove** until the apps are updated or an alternative for SAML 1.0 is in place. The team must plan a migration.

  **Example 2: Removing a code review step that adds two days to deployment**

  1. **Describe**: A mandatory code review by a security expert that happens after peer review and before deployment.
  2. **Reason**: It delays deployments by an average of two days because the security expert is overloaded.
  3. **Original purpose**: Introduced after a security incident two years ago to catch vulnerabilities that peer reviewers might miss.
  4. **Functionality and dependencies**: The security expert looks for specific vulnerabilities (e.g., SQLi, XSS). Only applies to production deployments.
  5. **Usage**: 100% of production deployments go through this step. The security expert rejects about 5% of deployments for critical issues.
  6. **Risks**: Without this step, critical vulnerabilities might be deployed. The worst-case scenario is a major breach.
  7. **Alternatives**: Automate more checks in CI? Train peer reviewers on security? Rotate security experts to reduce bottleneck? Or make the review non-blocking (deploy with a follow-up review) for low-risk changes?
  8. **Costs/Benefits**: Keeping: delay in deployments. Removing: faster deployments but increased security risk. Automation and training could reduce the need for manual review.
  9. **Recommendation**: **Do not remove** immediately. Instead, **implement alternatives** such as:
     - Automate security scanning in CI to catch common issues.
     - Train developers on security best practices.
     - Only require the security review for high-risk changes (e.g., touching authentication, payment).
     - If after these changes the manual review is still adding two days, re-evaluate.

  **Example 3: Killing a feature that 3% of users still use**

  1. **Describe**: A feature that allows users to export data in a specific legacy format (e.g., XML). Only 3% of users use it.
  2. **Reason**: The feature complicates the code and requires maintenance. The team wants to promote a newer JSON export.
  3. **Original purpose**: Created because the industry used XML at the time. Now, JSON is the standard.
  4. **Functionality and dependencies**: It generates an XML file from the user's data. No other features depend on it. The new JSON export is available and more feature-rich.
  5. **Usage**: 3% of users use it, but analysis shows they are enterprise customers with large contracts. They have not adopted the JSON export because their downstream systems require XML.
  6. **Risks**: Removing it might cause these enterprise customers to churn. They represent 15% of revenue.
  7. **Alternatives**: Deprecate with a long lead time? Offer to help migrate? Or keep it but stop enhancing it?
  8. **Costs/Benefits**: Keeping: low maintenance (the code is stable). Removing: risk of losing key customers. The cost of keeping might be worth the revenue retention.
  9. **Recommendation**: **Do not remove** without first engaging with the affected customers. If they can migrate, then remove after a deprecation period. If not, keep it.

  **Limits of the Procedure and the Burkean Framework**

  1. **Innovation and Necessary Change**: The framework is biased against change. Sometimes, change is necessary for survival (e.g., technological shifts). The procedure might slow down innovation if overused.
  2. **Unknown Unknowns**: The procedure relies on the ability to investigate. If the reason for the fence is lost to history and not discoverable in an hour, the team might proceed with removal when they shouldn't.
  3. **Paralysis by Analysis**: For every change, an hour might be too long in a fast-paced environment. The procedure is for non-trivial changes only.
  4. **Scope**: It doesn't apply to:
     - New feature development (only removals/simplifications).
     - Emergencies (e.g., a security patch that requires immediate removal of a component).
     - Changes that are mandated by external factors (e.g., legal requirements).
  5. **Human Factors**: The team might go through the motions without real epistemic humility. The checklist can become a box-ticking exercise.
  6. **Software vs. Society**: Software is more malleable than social institutions. We can (and should) remove things that are no longer useful, even if we don't fully understand their origin. The Burkean argument is weaker in software because the costs of maintaining a fence might be high and the consequences of removal might be easier to reverse (if you have good rollback and monitoring).

  **Conclusion**: The procedure forces the team to gather evidence and think critically about removal. It shifts the burden of proof to the reformers. However, it should be applied judiciously and not become a barrier to necessary progress. The director should use the escalation step to apply judgment when the evidence is ambiguous.
answer: |-
  Below is a structured decision procedure designed to operationalize Chesterton's fence and Burkean epistemic conservatism for software engineering teams. It's a checklist-style workflow that forces explicit consideration of the fence's purpose, current value, and risks—while flagging when human judgment is needed. The goal is to combat "we don't know why this exists, so it's probably useless" thinking. 

  ---

  ### **Change Impact Assessment (CIA) Procedure**  
  *For evaluating proposed removals/deprecations (services, code, features, processes)*  
  **Timebox:** 45-60 minutes. Document answers before proceeding. Escalate unresolved questions to the director.  

  #### **Step 1: Reconstruct the Fence’s History**  
  - **1.1.** Trace origin:  
    - ☐ Review commit history/PRs, design docs, or tickets from creation.  
    - ☐ Consult original authors (if available) or long-tenure team members.  
    - *If no records exist:* State this explicitly. Do **not** assume "no reason = no value."  
  - **1.2.** Articulate the solved problem:  
    - ☐ "This was built to solve [X] because [Y]." (e.g., "The auth service handled SSO for PartnerAPI because OAuth wasn’t supported.")  
    - ☐ If unclear: "Best guess is [hypothesis], but evidence is weak because [gaps]."  
  - **1.3.** Flag historical triggers:  
    - ☐ Was this a reactive fix? (e.g., post-incident, compliance demand, key customer request)  
    - ☐ Did constraints exist then that don’t now? (e.g., old infra, deprecated dependencies)  

  #### **Step 2: Map Current Dependencies & Usage**  
  - **2.1.** Identify **explicit** dependencies:  
    - ☐ List systems, users, or workflows that directly depend on this. (Use logs, monitoring, or dependency graphs.)  
    - ☐ For code: Run static/dynamic analysis to find callers.  
    - ☐ For processes: Interview affected teams.  
  - **2.2.** Probe for **implicit** dependencies:  
    - ☐ Does this handle edge cases? (e.g., "This function processes null inputs gracefully.")  
    - ☐ Is it a fallback? (e.g., "This service is called if the primary times out.")  
    - ☐ *Red flag:* "We don’t have data" → Escalate to Step 4.  
  - **2.3.** Quantify usage:  
    - ☐ Measure usage frequency, user segments, and error rates. (e.g., "3% of users, but all Enterprise tier.")  
    - ☐ For processes: Track adherence and bypass frequency.  

  #### **Step 3: Assess Risks of Removal**  
  - **3.1.** Test failure scenarios:  
    - ☐ "If we remove this, what breaks if [X] happens?" (e.g., peak load, bad data, compliance audit)  
    - ☐ Worst-case impact: Data loss? Customer churn? Security breach?  
  - **3.2.** Evaluate detection gaps:  
    - ☐ Are current tests/monitoring sufficient to catch this? (e.g., "No tests for quarterly cron job.")  
  - **3.3.** Cost of reversal:  
    - ☐ How hard is it to roll back? (e.g., "Database schema change → irreversible." vs. "Feature flag → easy.")  

  #### **Step 4: Challenge Assumptions**  
  - **4.1.** Pressure-test "low value":  
    - ☐ "Could this be critical for a minority?" (e.g., "3% of users generate 30% of revenue.")  
    - ☐ "Is absence more costly than presence?" (e.g., "Removing this saves 2 engineer-days/year but risks $500k in churn.")  
  - **4.2.** Alternatives to removal:  
    - ☐ Can we refactor, disable, or partial-deprecate? (e.g., feature-flag the code, automate the process step)  
    - ☐ "Is removal the only/best solution to our pain point?"  

  #### **Step 5: Make a Recommendation**  
  - **☐ Remove** only if:  
    - History is understood AND original problem is obsolete AND no material current usage/dependencies AND low-risk.  
  - **☐ Do not remove** if:  
    - History is unknown OR high-risk OR high-value minority use OR alternatives exist.  
  - **☐ Escalate** if:  
    - Evidence conflicts (e.g., "No usage data, but original purpose was critical") OR unknowns remain after checklist.  

  #### **Key Judgment Calls (Be Honest!)**  
  - Step 1.1: "No records" doesn’t mean "no reason"—it means uncertainty.  
  - Step 2.2: Absence of evidence ≠ evidence of absence.  
  - Step 4.1: Burkean bias: Favor keeping when uncertainty exists. Burden of proof is on remover.  

  ---

  ### **Worked Examples**  
  #### **Example 1: Deprecate Legacy Authentication Service**  
  - **Step 1:** Created 7 years ago for main app auth. Original problem: Integrate with on-prem LDAP. Now, LDAP is rare.  
  - **Step 2:** Only 2 internal tools use it (5% of traffic). No external users. Dependency scan shows no callers in core apps.  
  - **Step 3:** Risk: Breaks internal tools. Low impact (tools can migrate). Rollback: Easy (service restart).  
  - **Step 4:** Low value? Yes—internal-only. Alternative: Rewrite tools to use modern auth.  
  - **Recommendation:** ✅ **Remove** with 30-day deprecation notice.  

  #### **Example 2: Remove Code Review Step Adding 2-Day Delay**  
  - **Step 1:** Added after $500k outage from a memory leak 2 years ago. Original problem: Catch resource bugs pre-deploy.  
  - **Step 2:** Required for all deploys. 95% compliance. Metrics: Catches 1 critical bug/50 deploys.  
  - **Step 3:** Risk: Leaks, crashes, or data loss if skipped. Detection gap: Staging doesn’t simulate production load.  
  - **Step 4:** "Low value"? False—catches rare but catastrophic bugs. Alternative: Automate resource checks in CI.  
  - **Recommendation:** 🛑 **Do not remove**. Automate checks first, then reassess.  

  #### **Example 3: Kill Feature Used by 3% of Users**  
  - **Step 1:** Built 5 years ago for a since-churned enterprise client. Original problem gone? Unknown—no docs.  
  - **Step 2:** 3% of users, but analytics show all are Enterprise tier. Support tickets: "We use this for monthly reports."  
  - **Step 3:** Risk: Churn from Enterprise users (30% revenue). Rollback: Hard (data migration needed).  
  - **Step 4:** "Low value"? No—critical for high-revenue segment. Alternative: Deprecate with 1-year sunset.  
  - **Recommendation:** 🛑 **Do not remove**. Engage users first; deprecate if migration path exists.  

  ---

  ### **Limits of the Burkean Framework in Software**  
  1. **Doesn’t Apply to:**  
     - **Greenfield work:** No fence exists yet.  
     - **Emergencies:** E.g., security vuln requiring immediate removal.  
     - **Obvious bloat:** Typos, dead code with zero references.  
     - **Innovation:** Radical improvements often require tearing down fences without perfect understanding.  

  2. **Framework Breakdowns:**  
     - **High maintenance costs:** If a "fence" consumes 50% of engineering time, its survival may be due to inertia, not value.  
     - **Fast-changing environments:** In DevOps, some fences (e.g., manual approvals) become counterproductive quickly.  
     - **Reversible decisions:** Unlike societal institutions, software can often roll back changes. Burke underweights reversibility.  
     - **Human factors:** Teams may over-index on "historical purpose" and ignore that the fence is now *causing* bugs (e.g., outdated libs).  

  3. **Procedural Blind Spots:**  
     - **"Unknown unknowns":** The checklist can’t force teams to discover undocumented edge cases.  
     - **Speed tradeoffs:** For tiny changes (e.g., deleting unused CSS), this is overkill. Reserve for high-risk/effort items.  
     - **False negatives:** May keep toxic fences (e.g., racist/sexist code) if "original purpose" is ignored. Moral > Burkean concerns.  

  ### **Implementation Advice**  
  - **Templatize this:** A Confluence/GitHub template with fields for each step.  
  - **Calibrate with postmortems:** When a removal causes an incident, ask: "Which CIA step did we skip?"  
  - **Incentivize humility:** Reward teams for finding "hidden reasons," even if it blocks their project.  

  This procedure turns epistemic humility into actionable scrutiny. It won’t prevent all mistakes, but it forces the team to confront uncertainty—making "we don’t know" a starting point, not an excuse.
