answer: |-
  ### Systematic Translation of Williams's Critiques into Decision-Theoretic Terms

  #### **1. Integrity Objection**  
  **Williams's Claim**: Utilitarianism violates personal integrity by demanding agents abandon deeply held "ground projects" (identity-constituting commitments) when they conflict with global utility maximization. This forces *self-alienation*—agents must treat their core values as mere inputs to an impersonal calculus.  

  **Decision-Theoretic Restatement**:  
  - Let an agent's **utility function** \(U_i\) be decomposable into two components:  
    - **Agent-relative utility** \(U_r(s; i)\): Value of state \(s\) *to agent \(i\)*, reflecting personal commitments (e.g., \(U_r(\text{project success}; i) = 100\)).  
    - **Agent-neutral utility** \(U_n(s)\): Impersonal value of \(s\) (e.g., \(U_n(\text{global welfare}) = \sum_j U_j(s)\)).  
  - Utilitarianism requires maximizing \(U_n(s)\) at all times.  
  - **Conflict**: When \(\arg\max_s U_n(s)\) ≠ \(\arg\max_s U_r(s; i)\), utilitarianism forces \(i\) to choose an action \(a^*\) where:  
    \[
    a^* = \underset{a}{\arg\max}  U_n(s_a) \quad \text{but} \quad U_r(s_{a^*}; i) \ll U_r(s_a'; i) \quad \text{for some alternative } a'.
    \]
  - **Integrity violation**: The demand to choose \(a^*\) requires \(i\) to:  
    - Treat \(U_r\) as *instrumental* to \(U_n\), negating its status as a **constitutive element of rational agency**.  
    - Adopt a **discontinuous preference revision**—suppressing \(U_r\) in the choice domain—which fractures the agent's identity.  

  **Formal Mechanism**:  
  - Williams argues that some ground projects are **lexicographic preferences** over outcomes. For example:  
    "Complete my life's work" \(\succ_L\) "Maximize global utility" if \(U_n\) is not catastrophically low.  
  - Utilitarianism ignores lexicographic structures, reducing all values to a **common metric** (e.g., cardinal utility), violating **preference incommensurability**.  

  ---

  #### **2. "One Thought Too Many" Argument**  
  **Williams's Claim**: Utilitarianism injects an inappropriate *moral calculation* into contexts where immediate, personal commitment should prevail (e.g., saving a drowning spouse). The "one thought too many" is the utilitarian deliberation itself, which corrupts the moral character of the act.  

  **Decision-Theoretic Restatement**:  
  - Consider an agent \(i\) facing a choice:  
    - **Act A**: Save spouse (cost \(c_i\), benefit \(b_{\text{spouse}}\)).  
    - **Act B**: Save stranger (cost \(c_i\), benefit \(b_{\text{stranger}}\) where \(b_{\text{stranger}} > b_{\text{spouse}}\)).  
  - Utilitarianism requires calculating \(U_n(\text{A})\) vs. \(U_n(\text{B})\).  
  - Williams objects that **rational deliberation** should be *procedurally constrained*:  
    - **Commitment as a decision rule**: "Save your spouse" should be a **fixed action rule** \(R_{\text{spouse}}\), not subject to consequentialist evaluation.  
    - **Higher-order preference**: \(i\)'s **meta-utility function** \(M_i\) values adherence to \(R_{\text{spouse}}\) *for its own sake*:  
      \[
      M_i(\text{follow } R_{\text{spouse}}) > M_i(\text{maximize } U_n)
      \]  
      This makes \(R_{\text{spouse}}\) a **constitutive commitment**—part of \(i\)'s practical identity.  
  - The "thought" (calculating \(U_n\)) is "too many" because:  
    - It **instrumentalizes** a commitment that should be **deontically rigid**.  
    - It reveals a **failure of integration**: The agent who deliberates via \(U_n\) has a fragmented decision architecture.  

  **Game-Theoretic Angle**:  
  - Commitment to \(R_{\text{spouse}}\) can be modeled as a **precommitment device** in a **dynamic game**:  
    - By precommitting to \(R_{\text{spouse}}\), \(i\) ensures predictable responses in future interactions (e.g., sustaining trust).  
  - Utilitarianism forces *renegotiation* of commitments at each node, destroying **equilibrium stability** in relational contracts.  

  ---

  ### Residue Report: What Doesn't Translate  

  #### **Clean Translations**  
  - **Agent-relative vs. agent-neutral values**: Maps perfectly to Williams's "personal vs. impersonal reasons."  
  - **Constitutive commitments**: Captured by lexicographic preferences or meta-utility functions valuing procedural rules.  
  - **Alienation**: Formalized as utility function discontinuity under utilitarian demands.  

  #### **Stretched or Distorted Elements**  
  1. **The "Horror" of Calculation**:  
     - Williams describes visceral repugnance at *considering* utilitarian trade-offs (e.g., "Should I kill one to save five?").  
     - Decision theory lacks tools to model **affective resistance to deliberation**. It treats all costs as fungible, but Williams sees deliberation itself as *morally corrosive* in certain contexts.  

  2. **Identity Constitutiveness**:  
     - Decision theory reduces "identity" to a **preference bundle** (\(U_r + M_i\)).  
     - Williams argues identity is **ontologically prior** to preferences—ground projects *generate* reasons, not vice versa.  

  3. **Thick Relationships**:  
     - Saving a spouse isn't just high \(U_r\); it embodies a **relational norm** that utilitarianism "misdescribes."  
     - Game theory can model norms as equilibria, but cannot explain why violating them *feels* like "betrayal" rather than preference frustration.  

  #### **No Counterpart in Decision Theory**  
  - **The Phenomenology of Agency**:  
    Williams's agent experiences actions as "mine" or "alien" based on their source. Decision theory's agents are **causal machines**—no intrinsic link between choice-generation and *selfhood*.  
  - **Non-Proxyable Values**:  
    Some commitments (e.g., "finish *my* book") cannot be fulfilled by another agent, even if \(U_n\) increases. Decision theory assumes value is transferable.  
  - **Regret vs. Agent-Regret**:  
    Williams distinguishes regret over outcomes ("I wish things were different") from **agent-regret** ("I did *this*"). The latter has no formal correlate.  

  ---

  ### Conclusion: Residue as Limitation or Illusion?  
  - **Genuine Limitation**:  
    The residue reveals decision theory's **structural blindness to the first-person perspective**. It cannot model:  
    - Why certain commitments resist trade-offs *even when the agent acknowledges* \(U_n\) is higher.  
    - The **expressive value of actions** (e.g., saving a spouse *as affirmation of love*).  
    This aligns with critiques by Sen (1982) and Frankfurt (1971): Rational choice cannot capture "care as a non-derivative source of reasons."  

  - **Williams's Intuitions Under Precision**:  
    Some arguments lose force when formalized:  
    - **Commitment devices** can be instrumentally justified (e.g., avoiding costly deliberation).  
    - **Meta-preferences** allow agents to "embed" integrity constraints (e.g., Kantians maximizing \(U_n\) subject to deontic rules).  
    Yet Williams's core insight—that *some reasons are identity-constituting*—exposes decision theory's reductionism. Rational choice frames all values as preferences, but **moral psychology requires thicker concepts**.  

  **Final Verdict**: The residue confirms a limitation. Decision theory excels at modeling *instrumental rationality* but stumbles at *constitutive rationality*—the realm where reasons define who we are. Williams shows morality cannot be fully "economized."  

  ##### Key References for Your Context:  
  - Sen, A. (1977) *Rational Fools*: Critique of self-interest maximization.  
  - Gauthier, D. (1986) *Morals by Agreement*: Game-theoretic morality (counterpoint to Williams).  
  - Bratman, M. (2000) *Reflection, Planning, and Temporally Extended Agency*: Higher-order preferences.
