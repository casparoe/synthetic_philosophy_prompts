prompt: |-
  I'm running a philosophy discussion group for smart non-philosophers — mostly programmers, a couple lawyers — and this week I'm doing Kavka's toxin puzzle. I've got maybe 35–40 minutes. Don't explain the puzzle to me, I already know it inside out. What I need is a teaching plan.

  The audience is sharp but theyve never done philosophy of action. They'll try to dissolve the puzzle with practical fixes rather than engaging with the conceptual issue. I want them to feel the force of it.

  What I need from you: the order in which to introduce the pieces so the puzzle builds rather than lands flat, the one example or analogy that should carry the whole thing (and why that one and not some other obvious candidate), the misconceptions people predictably bring — I'm guessing "just precommit" and "intentions are just predictions about your own behavior" are two of them — and exactly where in the sequence I should head each one off, plus one question I can ask at the end to check whether they actually got the philosophical problem rather than just the surface paradox.

  You're an expert in decision theory and philosophy of action. Think through the dependency structure carefully before laying out the plan — what idea has to be in place before the next one makes sense, and which confusions will block understanding if I don't address them at the right moment.
