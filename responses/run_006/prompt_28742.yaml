  The check question at the end should force them to articulate why it's impossible to form the intention. If they focus on action rather than intention formation, they missed the point. The question "Why can't you form the intention?" targets the core issue.

  Also, the user wants the audience to feel the paradox. So, after presenting the puzzle, I should ask them to mentally put themselves in the situation. Ask, "Would you drink it?" Then, "Could you intend to drink it?" That personal engagement might make the conceptual problem more salient.

