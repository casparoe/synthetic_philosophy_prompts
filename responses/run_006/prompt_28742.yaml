  Timing is tight. Allocate time for each section: setup (10 min), paradox (10 min), failed solutions (10 min), deeper issue (5 min), conclusion (5 min). Keep the billionaire story concise. Use the whiteboard to list conditions and decision points to make it visual.

  During the discussion, when someone suggests precommitment, I should ask how exactly they'd bind their future self. Physical constraints? Contracts? Then point out that the billionaire only cares about the intention, not the commitment mechanism. The intention must be genuine, not coerced. This shows that precommitment doesn't create the intention; it might force the action, but the paradox is about forming the intention itself.

