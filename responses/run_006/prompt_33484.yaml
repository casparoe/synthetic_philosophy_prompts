answer: |-
  Let me sketch the terrain for what a theory of diachronic epistemic norms must accomplish, drawing on the cases and tensions you’re wrestling with. The goal isn't just to pick winners in existing debates like Reflection versus Christensen's drug case, but to articulate what *any* contender must explain or accommodate to be viable. It’s about the job description for rationality across time.

  First and foremost, it must **handle anticipated shifts in epistemic position correctly**. This splits into several critical sub-cases. It obviously needs to mandate deference when you know you’ll gain strictly more evidence without distortion – that’s the core intuition behind Reflection and strict conditionalization. If you *know* your future self sees everything you see plus more, and processes it well, defiance seems arrogant. But equally, it must *forbid* deference when you anticipate epistemic degradation. Christensen’s drug is the canonical case: if you know you’ll soon irrationally believe you can fly, your current self *shouldn’t* adopt that future credence. This extends to cases of anticipated *partial* degradation: if you know your future self will have strictly more evidence *but* will process it badly due to fatigue, bias, or computational limits (imagine an AI foreseeing a corrupted update cycle), the theory must explain why, or under what precise conditions, deference breaks down. It must also address anticipated *loss* of information – Sleeping Beauty waking up with amnesia is a stress test here. Should she align with her pre-sleep credence or her less-informed future awakenings? And what about rarer cases where you know your future evidence will be strictly *worse* (e.g., knowing you’ll soon be sensory-deprived)? The theory can’t demand deference here; it might even demand *anti*-deference, but must justify it.

  Second, it must **respect fundamental distinctions in the nature of belief constraints**. Crucially, it must differentiate *epistemic* reasons for belief change (changes driven by evidence/rational inference) from *pragmatic* ones (changes for gain, comfort, or coercion). A theory blurring these risks collapsing into instrumentalism, where beliefs are tools, not truth-trackers. Similarly, it must clarify the relationship between *synchronic* norms (coherence at a time) and *diachronic* ones (change over time). Are diachronic norms reducible to sequences of synchronic states plus evidence input, or are they genuinely independent constraints? This ties into the deep question of whether rationality is fundamentally timeless or inherently temporal. Furthermore, it must navigate the gulf between norms for *ideally rational agents* (unbounded, logically omniscient) and norms for *bounded agents* like us (or practical AIs). What’s rationally obligatory for a god might be impossible for a human; a good theory must say where flexibility enters and why, without excusing all irrationality. This links to the distinction between norms that are *constitutive* of being a believer (violating them means you’re not truly holding beliefs/credences) versus those that are merely *good advice* (pragmatic rules of thumb for imperfect reasoners). Reflection, for instance, is often presented as constitutive – but can it be, if Christensen’s case shows rational violation?

  Third, it must **demonstrate consistency with established formal and empirical frameworks**. It should ideally avoid *diachronic Dutch books* – sequences of bets an agent finds acceptable individually but which guarantee a loss. While Dutch book arguments have critics, susceptibility often flags deep incoherence. It should cohere with *probability kinematics* and *representation theorems*; if credences obey the probability axioms synchronically, how should they evolve? Radically departing from conditionalization needs strong justification. It should also engage, at least minimally, with what we know from *psychology* about actual human belief revision. While a normative theory isn’t descriptive, completely ignoring how humans *can* reason (e.g., our reliance on heuristics, susceptibility to biases, memory limitations) risks prescribing the impossible or irrelevant for bounded agents. The theory must explain why its ideal is relevant to non-ideal creatures.

  Now, the tensions. I suspect the hardest conflicts lie between **accommodating bounded agency** and **satisfying ideal coherence constraints**, and between **avoiding diachronic Dutch books** and **handling anticipated processing corruption**. If the theory demands strict conditionalization to avoid Dutch books, it struggles with Christensen-like cases where conditionalizing on the *content* of the future belief is irrational. Conversely, allowing exceptions for anticipated irrationality risks making diachronic coherence too fragile or subjective. Similarly, respecting human cognitive limits might require relaxing synchronic coherence (e.g., logical omniscience) or diachronic rules, potentially undermining the theory’s normative force. How much "rationality" can we sacrifice to boundedness before it’s no longer a theory of *epistemic* norms? This tension is stark in Sleeping Beauty: the "thirder" and "halfer" positions often hinge on different weightings of synchronic coherence versus diachronic updating principles under memory loss.

  The single requirement doing the most heavy lifting to exclude obvious candidates is **correctly handling anticipated processing corruption**. This is the wrecking ball for naive Reflection and strict conditionalization. Reflection, baldly stated, demands deference to your future self *even when you know they’ll be irrational* – Christensen’s case shows this is absurd. Strict conditionalization struggles because the future "evidence" (the drug-induced belief itself) isn’t independent or trustworthy; conditionalizing on it propagates error. This case also challenges the "no diachronic norms" view: it seems *rationally required* to *not* defer here, implying *some* diachronic constraint exists. Getting this case right forces a theory to either refine Reflection significantly (e.g., adding a "rationality proviso"), abandon it for a different mechanism, or redefine what constitutes legitimate "future evidence."

  Overall, I’m fairly confident (say, 80%) this list captures the essential demands. The point I’m least sure about is the precise **weight and scope of the bounded/ideal distinction**. How much should a normative *epistemology* bend to our cognitive frailties? Should it prescribe an ideal we asymptotically approach, or rules usable by humans *as we are*? This feels like the murkiest philosophical swamp. Overemphasizing the ideal risks irrelevance; overemphasizing the bounded risks abandoning normative force. Getting this balance right is crucial, deeply contested, and I’m unsure where the fulcrum lies. The viability of any diachronic theory hinges on how it navigates this tension while satisfying the other demands. Keep pushing on that – it’s where the deepest work is needed.
