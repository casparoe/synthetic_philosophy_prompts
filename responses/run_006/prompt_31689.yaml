prompt: |-
  I'm a program manager at a large tech company overseeing a portfolio of about twenty projects ranging from six-month experiments to multi-year platform builds. The thing I struggle with most is knowing when to kill a project that's gone sideways. I've read about the dollar auction and escalation of commitment, and I recognize the pattern: we've sunk $X into something, it's not working, but pulling the plug feels like admitting $X was wasted, so we throw in more. I want a decision procedure I can actually use in quarterly reviews — a checklist or sequence of questions I run through for each amber/red project, that takes maybe 15 minutes, and that's designed specifically to catch the escalation dynamic. It should flag where I'm likely to be fooling myself (e.g. 'the next milestone will be different' when it never is), and it should be honest about the fact that the procedure itself can be gamed by the same psychology its meant to check. Then run it on two cases: (1) an internal tooling project that was supposed to ship in 9 months, is now at month 20, has a working but unloved MVP, and the team lead wants 6 more months and 2 more engineers to 'get it right'; (2) a machine learning feature that was supposed to improve user retention by 5%, has delivered 1.2% in A/B tests after a year of tuning, and the data science lead argues the model is 'on the verge of a breakthrough' if we just double the training compute. For each, tell me what the procedure says and whether I should trust it.
reasoning: |-
  We are designing a decision procedure to combat escalation of commitment in failing projects. The procedure must be quick (15 min per project), structured as a checklist, and resistant (though not immune) to self-deception. 

  Key principles:
  1. Focus on future costs and benefits only (ignore sunk costs).
  2. Challenge optimistic assumptions (require evidence for why the next period will be different).
  3. Compare the project against alternative uses of resources (opportunity cost).
  4. Explicitly consider the psychological traps (e.g., "sunk cost fallacy", "overconfidence in breakthroughs").
  5. Be skeptical of requests for more resources without clear milestones or evidence of change.

  Checklist of Questions (to be answered for each project in amber/red status):

  1. **Sunk Cost Acknowledgment**: Have we explicitly stated the sunk costs (time, money, resources) and then set them aside for the rest of the evaluation? (This step is to mentally detach.)

  2. **Future Investment Required**: What are the exact resources (time, team size, money) being requested for the next phase? Be specific.

  3. **Future Expected Benefit**: What is the specific, measurable outcome we expect if we invest these resources? (e.g., "We will achieve 5% retention lift" or "We will ship a tool with 90% user satisfaction") 
     - How was this outcome determined? Is it based on past patterns or new evidence?

  4. **Probability of Success**: On a scale of 1 to 10, what is the team's confidence in achieving the stated outcome? Then, challenge: What is the basis for that confidence? (Look for concrete evidence, not optimism.)
     - Ask: What has changed that makes the next period different from the past? If nothing has changed, why expect a different result?

  5. **Milestone Definition**: Is there a clear, unambiguous milestone at the end of this next investment period that, if not achieved, will lead to immediate cancellation? 
     - The milestone must be binary (pass/fail) and measurable. No "almost there".

  6. **Opportunity Cost**: What else could we do with these resources (team, time, money)? 
     - Specifically, what other projects or ideas are we not doing because of this? What is their expected value?

  7. **Historical Pattern Check**: 
     - Has this project consistently missed its milestones? 
     - Has the team previously said they were "close" and then failed to deliver? 
     - If so, how many times? (If more than two, that's a red flag.)

  8. **Outside View**: How would an unbiased outsider (e.g., a new hire, a competitor) view this project? Would they invest fresh capital?

  9. **Gaming the Procedure**: Are we answering these questions honestly, or are we trying to justify continuing? 
     - Specifically, are we overstating benefits, understating costs, or being overly optimistic about probabilities? 

  10. **Decision Rule**: 
      - If the expected value (probability of success * benefit) is less than the opportunity cost (what we could get elsewhere) → kill.
      - If there is no clear milestone or the team cannot provide evidence for a change in trajectory → kill.
      - Otherwise, approve the next phase with the strict milestone.

  Now, apply this to the two cases:

  **Case 1: Internal Tooling Project**

  - **Background**: 20 months (originally 9), working but unloved MVP. Team lead wants 6 more months and 2 more engineers.

  1. **Sunk Cost**: 20 months of team effort. Set aside.
  2. **Future Investment**: 6 months, 2 additional engineers (so total team size? Let's assume current team is 4, then becomes 6 for 6 months → total 6*6=36 person-months).
  3. **Future Expected Benefit**: "Get it right" → define what that means. Let's say: achieve 80% satisfaction in internal user survey (from current, say, 40%?).
  4. **Probability of Success**: Team lead might say 8/10. But why? They've had 20 months and only have an unloved MVP. What's changed? The lead may say "we now know what we did wrong and have a new plan". But without evidence of a turnaround, we must be skeptical.
  5. **Milestone**: At 6 months, achieve 80% satisfaction in a survey of at least 50 users? If not, cancel.
  6. **Opportunity Cost**: With 2 more engineers for 6 months, we could start two new small projects or boost other teams. What is the expected value of those? Maybe higher than a tool that isn't loved.
  7. **Historical Pattern**: The project has already taken more than twice the original time and is not loved. Previous milestones were missed. This is a pattern of over-optimism.
  8. **Outside View**: An outsider would see a project that has consistently underperformed and is asking for more. They might not invest.
  9. **Gaming**: We might be overstating the benefit of having the tool "right" and understating the cost of 2 engineers for 6 months.
  10. **Decision Rule**: 
      - Expected benefit: Even if we assign a 50% chance of achieving 80% satisfaction (which is generous), the benefit is a tool that is loved. But note: if the tool is internal, the business impact might be indirect (e.g., productivity). We must quantify that. Let's say the productivity gain is estimated at $Y. Then expected value = 0.5 * $Y.
      - Opportunity cost: 36 person-months could be used on other projects. If each person-month is valued at $Z (including overhead), then the cost is 36*$Z. Also, the opportunity cost of not doing other projects (which might have a higher expected value).
      - Without clear evidence of a turnaround and given the history, the expected value is likely lower than the opportunity cost.

  **Recommendation for Case 1**: Kill the project. The procedure flags it because of the historical pattern of missing milestones, lack of evidence for a turnaround, and high opportunity cost.

  **Case 2: Machine Learning Feature**

  - **Background**: Goal was 5% retention improvement, achieved 1.2% after a year. Data science lead wants double the training compute (so more resources) for a "breakthrough".

  1. **Sunk Cost**: One year of tuning. Set aside.
  2. **Future Investment**: Double the training compute (which may mean more money and time? Let's assume it takes 2 months and costs $C for the extra compute).
  3. **Future Expected Benefit**: Achieve the 5% retention improvement (or at least, say, 4% to be valuable). But note: the lead says "on the verge of a breakthrough" — we need a specific number.
  4. **Probability of Success**: Lead says high, maybe 9/10. Why? Because they see something in the learning curves? Ask for evidence: show the learning curve that indicates diminishing returns haven't set in? Or show a small-scale experiment that suggests the full model would work? Without evidence, it's optimism.
  5. **Milestone**: After doubling the compute and 2 months of work, we must achieve at least 3% retention lift in an A/B test (or whatever is the minimum to be worthwhile). If not, kill.
  6. **Opportunity Cost**: The compute and 2 months of the team's time could be used for other ML projects. What is the expected value of the next best alternative? Maybe another feature that is projected to give 2% with 80% chance? 
  7. **Historical Pattern**: The project has been ongoing for a year and only achieved 1.2%. They have been tuning and trying to improve. The fact that they haven't hit 5% (or even close) suggests that the problem might be harder than expected. However, note that ML can have breakthroughs, but we need evidence.
  8. **Outside View**: An outsider might see a project that has underdelivered and is asking for more resources without a strong reason. They might be skeptical unless there's a clear technical rationale.
  9. **Gaming**: We might be overconfident in the breakthrough because we've invested a year and want it to work.
  10. **Decision Rule**: 
      - Expected benefit: If we assign a 30% chance of achieving 3% (or 5%) lift, then the expected value is 0.3 * (value of 3% lift). We must compare that to the cost of the compute and the opportunity cost of the team's time.
      - However, note that the lead is asking for a specific resource (compute) and time (2 months). If the cost is not too high and the milestone is clear, it might be worth a final shot.

  **Recommendation for Case 2**: Approve the extra compute and 2 months, but with a strict milestone: achieve at least 3% retention lift in an A/B test (or whatever the minimum valuable improvement is). If not met, kill. Why? Because the cost of the extra compute might be relatively low and the potential upside is high. But the procedure flags that without a clear milestone and evidence, it's risky. So we set the milestone and give one last chance.

  **Should you trust the procedure?** 

  - The procedure is designed to counteract the main psychological traps. However, it can be gamed if the team (or you) overstates benefits, understates costs, or is overly optimistic about probabilities. That's why the questions about evidence and the outside view are critical. 
  - For Case 1, the evidence of consistent underperformance and the lack of a clear change in trajectory make killing the project a strong recommendation. 
  - For Case 2, because the additional investment is bounded (2 months and compute) and the team can point to some progress (1.2% so far) and the potential upside is high, it's worth a final, tightly controlled experiment. 

  The procedure doesn't guarantee a correct decision, but it forces a structured, evidence-based approach that minimizes emotional attachment and sunk cost fallacy. You should trust it more than an unstructured debate, but always be aware of the gaming potential (question 9) and seek independent reviews if possible.
answer: |-
  Below is a **15-minute decision checklist** designed to combat escalation of commitment in failing projects. It focuses on **future costs/benefits**, **evidence-based reality checks**, and **explicitly naming psychological traps**. The procedure forces you to confront biases while acknowledging its own vulnerabilities (e.g., teams may game milestones or overstate confidence).  

  ---

  ### **The "Kill Switch" Checklist**  
  *(Run this quarterly for each amber/red project. Timebox each section.)*  

  1. **Sunk Cost Confession (1 min)**  
     - *"What have we spent (time/money/team) so far? Write it down. Now delete it from your mind. These costs are gone."*  
     - *Psychological Trap Flag:* "Are we afraid to 'waste' this investment?"  

  2. **Future Resource Ask (2 min)**  
     - *"What exactly is being requested? (e.g., 6 months, 2 engineers, $X compute)."*  
     - *"What could these resources achieve elsewhere? (e.g., 2 engineers → 3 new experiments)."*  
     - *Gaming Risk:* Teams may understate asks. Demand specificity.  

  3. **Success Milestone (3 min)**  
     - *"What is the binary pass/fail outcome promised at the end of this new phase? (e.g., '80% adoption by X team' NOT 'improve quality')."*  
     - *"How many times have we reset this milestone? If >2, assume pattern will hold."*  
     - *Trap Flag:* "Are we hearing 'this time is different’ without evidence?"  

  4. **Evidence Scan (4 min)**  
     - *"What data proves progress is accelerating? (e.g., metrics, user feedback, technical breakthroughs)."*  
     - *"What data contradicts the optimism? (e.g., flatlined KPIs, negative user reviews)."*  
     - *Trap Flag:* "Are we ignoring negative signals because they’re uncomfortable?"  

  5. **Probability Assessment (3 min)**  
     - *"On a 1–10 scale, what’s the REALISTIC probability of hitting the new milestone? Multiply this by the expected value (e.g., 10% chance × $1M impact = $100K expected value)."*  
     - *"Would we invest fresh resources at this probability? If not, kill."*  
     - *Gaming Risk:* Teams may inflate confidence. Demand data anchors.  

  6. **Opportunity Cost (2 min)**  
     - *"If we reallocated these resources to our #1 backup project, what’s its expected value? (e.g., 60% chance × $500K impact = $300K)."*  
     - *"Is the current project’s expected value higher? If not, kill."*  

  7. **Kill Decision (Final 1 min)**  
     - **Kill if ANY of these are true:**  
       - No binary milestone defined.  
       - Milestone reset >2 times.  
       - Probability-adjusted value < opportunity cost.  
       - No new evidence justifies deviation from past trends.  

  ---

  ### **Case Applications**  

  #### **Case 1: Internal Tooling Project**  
  - *Background:* 20 months (vs. 9 planned), unloved MVP. Team wants 6 months + 2 engineers.  
  - **Checklist Output:**  
    1. **Sunk Cost:** 20 months/$$$ spent → **deleted**.  
    2. **Future Ask:** 6 months + 2 engineers → could build 2–3 new MVPs.  
    3. **Milestone:** "Get it right" is vague. Previous milestones reset 2+ times. → **Red flag**.  
    4. **Evidence:** MVP is "unloved" (negative signal). No data shows progress accelerating.  
    5. **Probability:** Low (3/10?) → 30% chance of adoption. Value likely < opportunity cost.  
    6. **Opportunity Cost:** 2 engineers → high-value experiments elsewhere.  
    7. **Kill Decision:** **KILL**. Vague milestone, repeated resets, weak evidence.  

  - **Should you trust it?**  
    **YES**. The checklist caught:  
    - *Escalation Trap:* Team is framing "get it right" as a moral imperative (avoiding sunk cost shame).  
    - *Pattern Ignorance:* 20 months of delays, yet no new evidence justifies extra time.  
    - *Opportunity Cost:* 2 engineers could deliver more value elsewhere.  

  ---

  #### **Case 2: ML Feature Project**  
  - *Background:* 1.2% retention lift (vs. 5% target) after 1 year. Team wants 2× compute for "breakthrough".  
  - **Checklist Output:**  
    1. **Sunk Cost:** 1 year/$$$ → **deleted**.  
    2. **Future Ask:** Double compute → could train 2 new models for other projects.  
    3. **Milestone:** "Breakthrough" = ? → Demand binary: "4% lift in next A/B test."  
    4. **Evidence:**  
       - *Pro:* 1.2% lift shows partial progress.  
       - *Con:* Diminishing returns (only +1.2% after 1 year). No proof of impending leap.  
    5. **Probability:** Medium (5/10?) → 50% chance of 4% lift. Value depends on user-base size.  
    6. **Opportunity Cost:** Compute could test new models → potentially higher upside.  
    7. **Kill Decision:** **APPROVE, with kill clause**: "If next milestone (4% lift) isn’t hit, kill immediately."  

  - **Should you trust it?**  
    **CAUTIOUSLY**. The checklist:  
    - *Prevents Overkill:* ML projects often require iterative tuning. 1.2% lift isn’t failure.  
    - *Forces Honesty:* "Breakthrough" is now a hard metric.  
    - *But Risk Remains:* Team may overfit the model to hit 4% temporarily. Monitor for gaming.  

  ---

  ### **Why This Works**  
  - **Anti-Bias Design:** Questions 3–4 attack the "just one more try" fallacy. Question 5 quantifies wishful thinking.  
  - **Speed:** Focuses only on forward-looking evidence.  
  - **Gaming Safeguards:**  
    - Demands binary milestones (no wiggle room).  
    - Flags repeated resets as death patterns.  
    - Compares to alternatives (breaking escalation inertia).  
  - **Limitations:** Teams may still manipulate probability scores or milestone definitions. Pair this with an independent reviewer for critical projects.  

  **Final Tip:** Share this checklist with project leads BEFORE reviews. Transparency reduces gaming and aligns expectations. Kill fast, reinvest faster.
