prompt: |-
  Okay so this is now personal: a friend has been trying to get me to buy into a Pasadena-game-style bet, with the payoffs rescaled and a cover charge, and I realized I can't even say what the fair price is because the expected value just... doesn't exist, or changes if you sum the terms in a different order. Before I go down the rabbit hole of fixes, I want the spec first. What should a theory of choice under undefined (and infinite) expectations actually deliver? I'm not asking for a scorecard of the main contenders yet — I want the list of requirements, with the case or consideration behind each. Things like: it should agree with plain expected value on finite games; it shouldn't let the value of a game depend on an arbitrary ordering of the states; it should still respect dominance when one option is better in every state; it should distinguish a game with infinite expectation from one with undefined expectation; it should say something non-arbitrary about what price, if any, I should pay. For each requirement, tell me whether its non-negotiable or just one camp's preference, and which ones you think can't be jointly satisfied — I suspect the whole point is that some of them conflict, and thats the part I most want to see. Then, briefly, which single requirement does the most work to rule out the obvious patches (bounded utility, 'just use the median', refusing to play, etc.).
reasoning: |-
  Okay, the user is dealing with a Pasadena game variant and is frustrated because the expected value is undefined or changes with the summation order. They want to understand what a theory of choice under undefined or infinite expectations should deliver. They specifically asked for a list of requirements, each backed by a rationale, and to know which are non-negotiable versus preferences. Also, they want to see conflicts between these requirements and which one rules out obvious patches.

  First, I need to recall the Pasadena paradox. It's a game with payoffs like ((-1)^{n+1} * n / log(n)) for state n, which conditionally converges. The alternating signs cause the expected value to depend on the order of summation. That's why standard expected utility fails here.

  The user mentioned their friend's bet involves rescaling payoffs and a cover charge. So, they need a framework to decide a fair price when EV is undefined. Their deeper need is to navigate decision-making in such ambiguous scenarios without arbitrary choices.

  They listed specific requirements: agreement with finite EV, state order invariance, dominance, distinguishing infinite vs. undefined EV, and providing non-arbitrary prices. I should address each, noting conflicts. For example, order invariance clashes with the need to agree with EV in finite cases because conditional convergence relies on order.

  Dominance is non-negotiable; if one option is always better, it should be preferred. But in Pasadena-like games, dominance might be hard to apply if payoffs alternate and states are reordered. Also, distinguishing infinite from undefined EV is crucial. Infinite EV suggests any finite price is acceptable, while undefined is ambiguous.

  The key conflict is between order invariance and agreement with standard EV. Finite games don't have order issues, but infinite ones do. So any theory fixing order invariance might have to sacrifice agreement with EV when it's conditionally convergent.

  Among the patches, bounded utility (like log or sqrt) resolves the issue but violates agreement with EV since linear utility is standard. Using the median ignores tails, violating dominance if a state with extreme payoff affects the decision. Refusing to play avoids the problem but isn't a general solution. The strongest requirement ruling out patches is order invariance because any method depending on order is arbitrary, and patches like bounded utility or median fail this by altering the natural payoff structure.

  The user might also care about practical advice. They need a fair price for their friend's bet. Theories like weighted utility or relative utilitarianism offer solutions but require arbitrary choices (e.g., weighting schemes). The core issue is that no perfect solution satisfies all requirements, so compromises are necessary. Highlighting the conflicts helps them understand why various approaches exist and why none are universally accepted.
answer: |-
  Here’s a specification for a theory of choice under undefined/infinite expectations, derived from core decision-theoretic principles and the pathologies of games like the Pasadena paradox. Each requirement includes its rationale, negotiability, and conflicts. The key insight is that **no theory satisfies all requirements simultaneously**—trade-offs are unavoidable.

  ---

  ### **Core Requirements & Rationales**
  1. **Agreement with Finite EU (Non-negotiable)**  
     *What it should deliver*: The theory must reduce to standard expected utility (EU) when the expectation is finite.  
     *Rationale*: Backward compatibility with rational choice in non-pathological cases.  
     *Conflict*: Conflicts with order-invariance in conditionally convergent sums (e.g., Pasadena game).

  2. **State-Order Invariance (Non-negotiable)**  
     *What it should deliver*: The value of a game must not depend on an arbitrary ordering of states (e.g., summing payoffs in order 1,2,3,... vs. 1,3,5,...,2,4,6,...).  
     *Rationale*: States are ontological primitives; relabeling them shouldn’t alter preferences.  
     *Conflict*: Directly clashes with conditional convergence in Pasadena-style games.

  3. **Strict Dominance Respect (Non-negotiable)**  
     *What it should deliver*: If option A pays strictly more than B in every possible state, A must be preferred to B.  
     *Rationale*: Foundational axiom of rationality (no "money pumps").  
     *Conflict*: Less critical in infinite cases but constrains "refuse to play" workarounds.

  4. **Distinguish ∞ from Undefined Expectation (Negotiable)**  
     *What it should deliver*: The theory should treat games with divergent positive expectation (e.g., St. Petersburg) differently from those with undefined expectation (e.g., Pasadena).  
     *Rationale*: Undefined expectations reflect deeper pathology than "merely infinite" ones.  
     *Conflict*: Forces a bifurcation in the solution space.

  5. **Non-Arbitrary Pricing Guidance (Negotiable)**  
     *What it should deliver*: For any game, output a fair entry price (or a justified refusal to play).  
     *Rationale*: Practical necessity for real-world decisions (e.g., your friend’s bet).  
     *Conflict*: May require imposing auxiliary structure (e.g., prior distributions over orders).

  ---

  ### **Key Conflicts & Trade-offs**
  - **The Central Impossibility**:  
    **Agreement with EU** + **State-Order Invariance** → *Requires discarding conditional convergence*.  
    But **Agreement with EU** relies on Riemann’s rearrangement theorem, which *requires* order-dependence in conditionally convergent series.  
    → *Resolution*: Most theories sacrifice strict EU agreement for order-invariance (e.g., using Cesàro summation or weighted utilities).

  - **Pricing vs. Distinction**:  
    Providing a **non-arbitrary price** for undefined-expectation games often *blurs the distinction* between undefined and infinite expectations.  
    Example: Charging $10 for both St. Petersburg (infinite EU) and Pasadena (undefined EU) ignores their epistemic differences.

  ---

  ### **The Requirement That Rules Out Obvious Patches**  
  **State-Order Invariance** does the heaviest lifting. It eliminates:  
  - **Bounded Utility**: Resolves divergence but violates **Agreement with EU** (e.g., log-utility makes Pasadena finite but distorts linear games).  
  - **"Just Use the Median"**: Median payoffs are order-invariant but violate **Strict Dominance** (e.g., a state with +$1M payoff dominates others but may not affect the median).  
  - **Refusing to Play**: Avoids pricing but fails **Non-Arbitrary Pricing Guidance** and **Agreement with EU** (finite games are playable).  
  - **Order-Dependent Summation**: Directly violates **State-Order Invariance** by construction.  

  ---

  ### **The Iron Triangle of Undefined Expectations**  
  You can pick **two** of the following, but not all three:  
  1. **Order Invariance**  
  2. **Agreement with EU for Finite Games**  
  3. **Defined Valuation for Pathological Games**  

  Every major approach (Lauwers’s *Purely Finitely Additive* measures, Easwaran’s *Relative Utilitarianism*, Colyvan’s *Causal Decision Theory*) sacrifices one vertex. For practical bets like yours, **non-archimedean utilities** (e.g., surreal numbers) or **weighted averaging over orderings** offer paths—but both introduce new arbitrariness. The rabbit hole is deep, but the conflicts explain *why* it exists.

