prompt: |-
  I serve on my university's disability services advisory board. We have a fixed annual budget to allocate across accommodation requests — note-takers, assistive technology, physical access modifications, extended exam time, and the like. Requests always exceed the budget, so we must prioritize. The board is split three ways. One faction says we should allocate to maximize overall student welfare gains: survey students about subjective distress and direct funds where they'd relieve the most suffering per dollar. Another says we should equalize resources: give each student with a documented need the dollar equivalent of what it costs to address that need, up to the budget cap, regardless of differences in subjective benefit. A third, citing the capabilities approach, says we should identify a threshold of basic academic functionings — attending lectures, completing assignments, taking exams under fair conditions — and fund whatever it takes to bring every student up to that threshold, even if that means exhausting the budget on a few high-need students. Draft the decision memo I'll circulate before our next meeting. It should recommend one framework (or a specific hybrid) with an actionable allocation rule, and it must engage seriously with the strongest objection to whichever approach I recommend. Begin with the memo itself, with no preface or commentary.
reasoning: |-
  Okay, the user serves on a university disability services advisory board and needs to draft a decision memo about budget allocation frameworks. There are three factions with different approaches: maximizing welfare gains, equalizing resources, or ensuring a threshold of basic academic functioning using the capabilities approach. 

  The user wants me to recommend one framework (or a hybrid) with actionable allocation rules while addressing the strongest objection. The memo needs to be practical for real-world implementation.

  Hmm... this is tricky because each approach has merits. Maximizing welfare sounds efficient but could neglect high-cost needs. Equalizing resources feels fair but might spread funds too thin. The capabilities approach protects dignity but risks exhausting the budget on few students. 

  I notice the capabilities approach aligns most closely with academic equity - the core mission of disability services. The memo should emphasize that denying basic academic participation violates educational justice. The strongest objection is indeed budget exhaustion on high-need cases, so I'll build in a contingency: after meeting thresholds, residual funds get distributed via weighted lottery prioritizing severe impacts. 

  For actionable rules, I'll suggest concrete steps: defining the threshold bundle, cost-ranking accommodations, and the residual fund mechanism. The hybrid element makes it pragmatic while keeping the core principle intact. 

  The tone must be decisive yet respectful to all factions. I'll structure it as: 1) Recommendation rationale 2) Allocation procedure 3) Directly confronting the "exhaustion risk" objection with the mitigation strategy. No fluff - just operational clarity.
answer: |-
  **MEMORANDUM**  
  **TO:** Disability Services Advisory Board  
  **FROM:** [Your Name/Position]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommended Budget Allocation Framework for FY 2024  

  ### I. RECOMMENDATION  
  I recommend adopting a **threshold-centered hybrid framework**, prioritizing the capabilities approach to ensure all students reach a baseline of academic functioning. Residual funds (if any) will then be allocated via weighted lottery prioritizing severe welfare impacts.  

  #### Core Allocation Rule:  
  1.  **Define the Threshold:** Establish a minimum bundle of academic functionings (e.g., accessing course materials, completing timed assessments, participating in core class activities).  
  2.  **Cost-Rank Accommodations:** Rank all documented needs by cost to achieve the threshold *for each student*.  
  3.  **Fund Thresholds Sequentially:** Fund the *lowest-cost unmet threshold accommodations first* until all students meet the baseline or funds are exhausted.  
  4.  **Residual Funds Allocation:** If funds remain after thresholds are met, allocate via lottery weighted by:  
      -   Severity of subjective distress (validated through confidential surveys),  
      -   Magnitude of residual functional barrier beyond the threshold.  

  ### II. RATIONALE  
  The capabilities approach provides the strongest ethical foundation: it prevents exclusion from the core academic mission, aligns with disability justice principles, and mitigates systemic inequities. Equalizing resources per student ("dollar equivalence") ignores varying barriers to participation, potentially leaving high-need students unable to engage. Maximizing welfare efficiency risks neglecting small but vital accommodations for low-distress/high-barrier students (e.g., a deaf student needing ASL interpretation). This hybrid ensures:  
  - **Non-exclusion:** No student is denied fundamental academic participation due to cost.  
  - **Cost-Efficiency:** Funding the cheapest unmet thresholds first maximizes coverage.  
  - **Responsiveness:** Residual funds address welfare inequities beyond the baseline.  

  ### III. ENGAGING THE STRONGEST OBJECTION  
  **Objection:** *"Exhausting the budget on high-cost thresholds for a few students leaves many others with unmet needs, violating fairness and overall welfare."*  

  **Response:** This is a serious concern. We mitigate it by:  
  - **Prioritizing Lowest-Cost Thresholds First:** Funding a $100 note-taker for 10 students before one $50,000 elevator retrofit ensures broader initial impact. High-cost needs are only funded if cheaper thresholds are met *and* funds suffice.  
  - **Explicit Threshold Definition:** Limiting "basic functionings" to academic essentials (e.g., *attending* lectures, not necessarily optimal comfort) prevents scope creep.  
  - **Residual Equity Mechanism:** The weighted lottery ensures funds beyond the threshold address acute suffering.  
  - **Transparency:** Publishing the threshold definition and cost-ranking methodology holds us accountable to proportionality.  

  **If the budget exhausts before all thresholds are met**, we collectively advocate for increased funding—demonstrating a clear, unmet institutional obligation to accessibility.  

  ### IV. ACTIONABLE NEXT STEPS  
  1.  Draft the "Basic Academic Functionings Threshold" by November 15 (Board vote required).  
  2.  Collect cost data for all requests and rank by "cost-to-threshold."  
  3.  Distribute a standardized welfare/distress survey to requesters.  
  4.  Allocate funds per the sequential rule, then lottery.  

  This framework guarantees no student is left behind academically while distributing surplus resources where they alleviate the deepest hardship. I urge your support.  

  **Attachments:**  
  - Draft "Basic Academic Functionings Threshold" Definition  
  - Proposed Welfare Survey Instrument
