answer: |-
  ### Desiderata for Rational Choice with Predictors Conditioning on Decision Procedures

  Below, I outline the core desiderata that any adequate theory of rational choice must satisfy in scenarios involving predictors that condition on an agent's decision procedure. These are derived from the motivating cases: **Newcomb's problem**, **counterfactual mugging**, and **XOR blackmail**. For each desideratum, I specify the case forcing it, its status (non-negotiable or camp-specific), and address your three focal questions. I then briefly score causal (CDT), evidential (EDT), updateless (UDT), and functional (FDT) decision theories against the list.

  ---

  #### **Desiderata: Cases, Status, and Rationale**
  1. **Distinguish Correlation from Causation**  
     - **Case**: Newcomb's problem.  
     - **Status**: Non-negotiable. Collapsing this distinction leads to self-defeating decisions.  
     - **Rationale**: In Newcomb's, taking both boxes (causal) yields $1,000 more if Box B is empty, but taking one box (evidential) correlates with Box B containing $1M. An adequate theory must recognize that the predictor's action depends on *anticipation* of the agent's choice (correlation), not the choice's causal effect. Failing this (e.g., CDT's two-boxing) forfeits $1M when the predictor is accurate.

  2. **Handle Counterfactual Dependence Across Worlds**  
     - **Case**: Counterfactual mugging.  
     - **Status**: Non-negotiable. Rejecting this leads to inconsistency across possible worlds.  
     - **Rationale**: In counterfactual mugging, paying $100 in the tails world is rational only if the agent's decision *systematically* rewards cooperation in the heads world. The theory must value actions that fulfill counterfactual obligations (e.g., "If heads, I would want my past/future self to commit to paying in tails"). CDT fails by ignoring cross-world links; EDT fails by treating counterfactuals as evidence.

  3. **Respect Independence of Fixed States**  
     - **Case**: XOR blackmail.  
     - **Status**: Non-negotiable. Violating this invites exploitation.  
     - **Rationale**: In XOR blackmail, termite infestation is a fixed state unaffected by paying. Paying $1,000 only alters whether the predictor *reveals* the state (via the XOR rule). An adequate theory must not conflate *learning* about a state with *changing* it (e.g., EDT may pay to "avoid bad news," but this wastes money without affecting termites).

  4. **Evaluate Policies, Not Acts in Isolation**  
     - **Case**: Counterfactual mugging and XOR blackmail.  
     - **Status**: Non-negotiable. Acts cannot be rationalized independently of broader rules.  
     - **Rationale**: Rationality requires choosing a *policy* (a mapping from inputs to acts) that maximizes expected utility across all predictor-possible worlds. In counterfactual mugging, the policy "always pay when asked" secures $10,000 in heads. In XOR blackmail, the policy "never pay" avoids extortion. Isolated act-evaluation (CDT/EDT) misses systemic benefits.

  5. **Avoid Self-Defeating Decisions**  
     - **Case**: All three.  
     - **Status**: Non-negotiable. Self-defeat is irrational by definition.  
     - **Rationale**: Decisions must not predictably yield worse outcomes than alternatives. Two-boxing in Newcomb's loses $999,000; refusing in counterfactual mugging forfeits $10,000; paying in XOR blackmail wastes $1,000. CDT self-defeats in Newcomb's; EDT self-defeats in XOR blackmail.

  6. **Reject Decision-Instability**  
     - **Case**: XOR blackmail.  
     - **Status**: Non-negotiable. Instability permits blackmail.  
     - **Rationale**: If an agent's decision *creates* the conditions for exploitation (e.g., paying in XOR blackmail only when termites are absent), the theory must precommit to ignoring irrelevant information. EDT's updates on the blackmail letter ("If I pay, it means no termites!") collapse into instability; UDT/FDT fix policies pre-observation.

  ---

  #### **Answers to Focal Questions**
  1. **Can paying in counterfactual mugging and refusing in XOR blackmail be jointly satisfied?**  
     - **Yes, and the conflict dissolves under precise requirements**.  
     - **Why**:  
       - Counterfactual mugging demands *policy-based cooperation*: Paying in tails honors a precommitment that rewards you in heads. The predictor uses cross-world dependence.  
       - XOR blackmail demands *ignoring non-causal information*: Paying responds to a fixed state (termites) and enables blackmail. Refusing respects state independence.  
     - **Resolution**: A unified policy ("cooperate with benefactors, ignore blackmailers") satisfies both. UDT/FDT achieve this; CDT/EDT cannot.

  2. **Which requirement excludes the most candidate theories?**  
     - **Evaluate Policies, Not Acts in Isolation** excludes CDT and EDT most decisively.  
     - **Why**:  
       - CDT evaluates acts causally (e.g., "two-boxing can't affect the prediction"), ignoring policy benefits (one-boxing's correlation).  
       - EDT evaluates acts evidentially (e.g., "one-boxing predicts $1M"), but cannot enforce cross-world consistency (e.g., paying in counterfactual mugging lacks local evidence).  
       - UDT/FDT adopt policy-based evaluation, solving all three cases.

  3. **Are policy-evaluation and updatelessness one or two desiderata? Which does the work?**  
     - **One integrated desideratum: "Updateless Policy Evaluation."**  
     - **Why**:  
       - Policy-evaluation defines *what* to optimize (rules across worlds).  
       - Updatelessness defines *how* to optimize (fixing policies pre-observation, ignoring correlated information).  
       - **Workhorse**: Updatelessness does the heavy lifting. In Newcomb's, it avoids conditioning on the predictor's move; in XOR blackmail, it ignores the letter's evidence. Policy-evaluation provides the structure for counterfactual mugging's cross-world links.

  ---

  #### **Scoring CDT, EDT, UDT, and FDT**
  | **Desideratum**                          | **CDT** | **EDT** | **UDT** | **FDT** |  
  |------------------------------------------|---------|---------|---------|---------|  
  | 1. Distinguish correlation/causation     | ❌ (Two-boxes) | ⚠️ (One-boxes but for wrong reasons) | ✅       | ✅       |  
  | 2. Handle counterfactual dependence      | ❌ (Doesn't pay) | ❌ (Doesn't pay) | ✅ (Pays) | ✅ (Pays) |  
  | 3. Respect independence of fixed states  | ✅ (Doesn't pay) | ❌ (Pays to "avoid bad news") | ✅       | ✅       |  
  | 4. Evaluate policies, not acts           | ❌      | ❌      | ✅       | ✅       |  
  | 5. Avoid self-defeat                     | ❌ (Newcomb's) | ❌ (XOR blackmail) | ✅       | ✅       |  
  | 6. Reject decision-instability           | ✅       | ❌ (XOR blackmail) | ✅       | ✅       |  

  - **CDT**: Fails cases requiring policy optimization (1,2,4,5). Strength: resists XOR blackmail (3,6).  
  - **EDT**: Fails on causal structure (1), counterfactuals (2), and updatelessness (3,4,6). Strength: one-boxes in Newcomb’s (but for flawed reasons).  
  - **UDT/FDT**: Satisfy all desiderata. UDT fixes policies pre-observation; FDT treats decisions as mathematical functions. Both solve the cases.  

  **Conclusion**: Updateless policy evaluation (UDT/FDT) uniquely satisfies all desiderata. CDT and EDT fail by over-indexing on local acts or evidence, violating non-negotiable requirements like counterfactual consistency and state independence. The apparent tension between counterfactual mugging and XOR blackmail dissolves under policy-based theories that distinguish beneficial cooperation from exploitative conditioning.
