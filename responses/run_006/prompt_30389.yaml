  We are preparing desiderata for a theory of rational choice in scenarios with predictors that can condition on an agent's decision procedure. The motivating cases are Newcomb's problem, Counterfactual Mugging, and XOR Blackmail.

  Desiderata:

  1. **Distinction between correlation and causation** (Non-negotiable, motivated by Newcomb's problem and XOR Blackmail)
     - Newcomb's problem: A predictor places $1,000,000 in a box (Box B) only if it predicts you will take only Box B. If it predicts you will take both boxes, it leaves Box B empty. Box A always contains $1,000. Evidential Decision Theory (EDT) recommends taking only Box B because it correlates with the predictor having put the money there. Causal Decision Theory (CDT) recommends taking both because your action cannot causally affect the past prediction. The desideratum is that the theory must not confuse the causal structure: in Newcomb's, the decision does not cause the prediction, but the prediction is about the decision. The theory must correctly handle cases where the correlation is due to a common cause (the predictor's accuracy) and not a causal effect of the decision.

  2. **Handling of counterfactuals** (Non-negotiable, motivated by Counterfactual Mugging)
     - Counterfactual Mugging: A fair coin is flipped. If tails, the predictor asks for $100. If heads, the predictor would have given $10,000 if it predicted you would pay in the tails case. The intuition from many is that you should pay the $100 in the tails world because if the coin had been heads, you would have wanted to have committed to paying (and thus received $10,000). This requires evaluating counterfactuals in a way that considers what would have happened in a different branch. The theory must be able to reason about counterfactuals that are not causally connected (since the coin flip is in the past and independent) but are linked by the predictor's conditional strategy.

  3. **No preference for irrational precommitments** (Non-negotiable, motivated by XOR Blackmail and also by the desire to avoid CDT's two-boxing in Newcomb's)
     - XOR Blackmail: The predictor sends a blackmail letter only if either your house has termites (which would cause great damage) or you pay $1000, but not both. If you pay, you avoid the letter only if your house does not have termites. If you don't pay, you get the letter only if your house does have termites. The rational move is to not pay because paying does not cause your house to be termite-free, but the predictor's action is set based on the XOR condition. However, if you pay, you get the letter only if your house is termite-free (which is good because then you avoid the damage) but if you don't pay, you get the letter only if your house has termites (so the letter is a bad signal). But note: paying $1000 doesn't change the termites, it only changes whether you get the letter. The key is to avoid being blackmailed for a state that is already fixed. The theory must not recommend paying because that would be a form of "irrational precommitment" to avoid bad news (like in the smoking lesion problem). This is non-negotiable because it prevents the agent from being exploited by the predictor's setup.

  4. **Policy consistency across counterfactual scenarios** (Non-negotiable, motivated by Counterfactual Mugging and Newcomb's problem)
     - This is the idea that the agent should evaluate a policy (a mapping from observations to actions) rather than just an action in the current state. In Counterfactual Mugging, the policy of "pay when asked in the tails world" is what would have led to the $10,000 in the heads world. The theory must be able to assign value to the policy consistently across different possible worlds. This is what Updateless Decision Theory (UDT) does. Without this, the agent might act differently in counterfactual scenarios that are relevant to the predictor's decision.

  5. **Avoiding self-defeating decisions** (Non-negotiable, motivated by all cases)
     - The theory should not recommend actions that lead to predictably worse outcomes. In Newcomb's, two-boxing leads to $1000 when one-boxing would have led to $1,000,000. In Counterfactual Mugging, not paying in the tails world means you get nothing and also you wouldn't have gotten the $10,000 in the heads world. In XOR Blackmail, paying might seem to avoid the letter but actually doesn't change the termite status and costs $1000, whereas not paying might reveal bad news but doesn't cost anything. The theory must avoid actions that are self-defeating in the sense that they lead to worse outcomes than an alternative policy.

  6. **Respect the independence of prior states** (Non-negotiable, motivated by XOR Blackmail and Counterfactual Mugging)
     - In XOR Blackmail, the state of the termites is independent of the agent's action. Paying does not cause the termites to go away. Similarly, in Counterfactual Mugging, the coin flip is independent of the agent's action. The theory must not act as if the agent's decision can causally influence these prior states.

  Now, addressing the specific questions:

  **First Question: Can the requirements that push toward paying in counterfactual mugging and toward refusing to pay in XOR blackmail be jointly satisfied, or does the apparent conflict dissolve?**

  Yes, they can be jointly satisfied. The conflict dissolves when we consider the different causal and counterfactual structures:

  - In Counterfactual Mugging, paying in the tails world is part of a policy that, in the heads world, would have resulted in a large gain. The predictor's payment in the heads world is conditional on the agent having a policy that would pay in the tails world. The agent's action in the tails world is not causing the heads world outcome, but the policy is being evaluated across worlds.

  - In XOR Blackmail, paying does not change the termite status (which is fixed) and does not prevent the termite damage. Moreover, the predictor's sending of the letter is set by the XOR condition. Paying $1000 only avoids the letter in the case where the house does not have termites (so you pay to avoid a letter that would only come if you didn't pay and had termites). But if you don't pay, you only get the letter if you have termites (which is bad, but the letter doesn't cause the termites). The rational move is to not pay because the termite state is fixed, and paying doesn't change it. It only changes the letter's arrival in a way that doesn't prevent the damage.

  The key difference is that in Counterfactual Mugging, the agent's policy in one world (tails) affects the outcome in another world (heads) via the predictor's conditional strategy. In XOR Blackmail, the agent's action in the actual world only affects the letter and the payment, but not the termite state (which is the real problem). The predictor in XOR Blackmail is not offering a conditional benefit across worlds but is setting up a blackmail based on a fixed state.

  Therefore, a theory that evaluates policies (like UDT) can recommend paying in Counterfactual Mugging (because the policy of paying in tails leads to the $10,000 in heads) and not paying in XOR Blackmail (because the policy of not paying avoids the $1000 loss without affecting the termites).

  **Second Question: Which single requirement, if any, does the most to exclude familiar candidate theories?**

  The requirement for **policy consistency across counterfactual scenarios** (desideratum 4) is the one that most excludes familiar theories. It is central to UDT and is not satisfied by either EDT or CDT.

  - EDT evaluates actions based on the evidence they provide. It would not pay in Counterfactual Mugging because in the tails world, paying $100 is evidence that you are the kind of person who pays, but that doesn't help because the heads world didn't happen. EDT would not link the two worlds appropriately.

  - CDT evaluates actions based on their causal consequences. In Counterfactual Mugging, paying $100 in the tails world doesn't cause anything good (the heads world is gone) so it wouldn't pay. In the heads world, the agent isn't asked to do anything so there's no decision to be made. CDT fails to see the connection.

  Thus, the requirement for policy-based evaluation across counterfactuals excludes both EDT and CDT. Only UDT (and perhaps functional decision theory, which is similar) satisfies this.

  **Third Question: Are the requirement to evaluate policies rather than acts and the requirement to be updateless one desideratum or two, and which of them does the actual work in these cases?**

  They are closely related and can be seen as one desideratum: **evaluate policies, not acts, and do so updatelessly**. The idea is that the agent should choose a policy (a complete strategy for all possible observations) before seeing any information that might be correlated with the state of the world. This is because updating on such information can lead to losing the correlation that the predictor uses.

  In these cases:

  - In Newcomb's, if the agent updates on the contents of the boxes (or the prediction) then two-boxing becomes appealing. But if the agent chooses a policy in advance (one-box or two-box) without updating on the predictor's action, then one-boxing is better.

  - In Counterfactual Mugging, the agent in the tails world must not update on the fact that the coin came up tails and instead remember the policy that would have been chosen in the heads world. The agent should act as if they are in the counterfactual world where they might be asked to commit.

  - In XOR Blackmail, the agent should not update on the fact that they received the letter (which is evidence that either they have termites or they didn't pay, but not both). Instead, they should have a precommitment to not pay because paying does not cause the termites to go away.

  The updateless aspect is essential because updating would condition on information that is correlated with the state (like the prediction) and break the link that the predictor uses. But the core is the policy evaluation. So we can consider them as one desideratum: **updateless policy evaluation**.

  **Scoring the theories against the desiderata:**

  - **Causal Decision Theory (CDT)**:
    - Fails desideratum 4 (policy consistency) and 2 (handling counterfactuals appropriately). It gets Newcomb's wrong (two-boxes), gets Counterfactual Mugging wrong (doesn't pay), and gets XOR Blackmail right (doesn't pay). Fails on 5 (self-defeating in Newcomb's and Counterfactual Mugging).

