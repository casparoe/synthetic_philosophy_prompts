answer: |-
  ### Type-Theoretic Restatement of the White Horse Dialogue

  #### Core Types and Judgments
  - **`Horse`**: Base type representing the property of being a horse.  
    Inhabitants: `x : Horse` (e.g., `blackHorse`, `yellowHorse`, `whiteHorse`).
  - **`White`**: Refinement predicate on color. Applied to objects, yielding `{x | White(x)}`.  
  - **`WhiteHorse`**: Refinement type of `Horse` where `White` holds:  
    `WhiteHorse = {x : Horse | White(x)}`.  
    Inhabitants: `wh : WhiteHorse` (e.g., `whiteHorse`).

  #### Moves of the Argument

  1. **Initial Thesis (Gongsun Long)**  
     *Claim*: "Horse names shape; white names color; therefore, `WhiteHorse` is not `Horse`."  
     - **Type-Theoretic Rendering**:  
       - `Horse` and `White` are distinct predicates.  
       - `WhiteHorse = Horse ∩ {x | White(x)}` (intersection of `Horse` with a refinement).  
       - Since refinement adds a constraint, `WhiteHorse` is structurally distinct from `Horse`.  
       - **Type Equality Judgment**: `WhiteHorse ≢ Horse` (types are not equivalent).  
       - *Function Signature Test*:  
         ```haskell
         -- Accepts any Horse:
         takeHorse :: Horse -> ()
         -- Rejects non-white Horses:
         takeWhiteHorse :: WhiteHorse -> ()
         ```  
         `takeHorse` compiles for `yellowHorse`; `takeWhiteHorse` fails for `yellowHorse`.  

  2. **Objection**  
     *Claim*: "If there is a white horse, one cannot say there is no horse; thus, `WhiteHorse` is `Horse`."  
     - **Type-Theoretic Rendering**:  
       - Subtyping: `WhiteHorse <: Horse` (every `wh : WhiteHorse` is also `wh : Horse`).  
       - **Inhabitance Judgment**: `∃wh : WhiteHorse → ∃h : Horse` (inhabitance implies top-level type membership).  
       - *Type Checker Output*:  
         ```ocaml
         let whiteHorse : WhiteHorse = ... in
         let _ : Horse = whiteHorse  // Upcasts freely; no error.
         ```  
       - But: Subtyping `WhiteHorse <: Horse` does **not** imply type equality `WhiteHorse ≡ Horse`.

  3. **Seeking Test (Gongsun Long's Reply)**  
     *Claim*: "Ask for a horse: yellow/black horses suffice. Ask for a white horse: they do not. Thus, `WhiteHorse` is not `Horse`."  
     - **Type-Theoretic Rendering**:  
       - **Function Compatibility Test**:  
         ```typescript
         function seekHorse(): Horse { return yellowHorse; }  // OK
         function seekWhiteHorse(): WhiteHorse { return yellowHorse; }  // Type Error!
         ```  
       - The types `() → Horse` and `() → WhiteHorse` are **not equivalent** because:  
         - `WhiteHorse` imposes a stricter precondition (refinement).  
         - `Horse` is not a subtype of `WhiteHorse` (contravariance breaks symmetry).  
       - **Seeking Test ⇔ Function Type Non-Equivalence**:  
         `(Unit → Horse) ≢ (Unit → WhiteHorse)` because their codomains are distinct.  

  #### Key Type-Theoretic Judgments
  - **Subtyping**: `WhiteHorse <: Horse` (uncontroversial).  
  - **Type Identity**: `WhiteHorse ≢ Horse` (due to refinement constraints).  
  - **Extensional Equivalence**: `WhiteHorse`’s extension is a subset of `Horse`’s, but:  
    - Set equivalence fails: `{x | x : WhiteHorse} ⊂ {x | x : Horse}`.  
  - **Nominal vs. Structural**:  
    - In a **structural system**, `WhiteHorse` is a subtype but not equivalent.  
    - In a **nominal system**, `WhiteHorse` could be explicitly declared distinct, reinforcing non-identity.  

  ---

  ### Residue Report: What Maps, What Distorts, What's Lost

  #### Clean Mappings
  1. **Type Non-Identity (`WhiteHorse ≢ Horse`)**  
     - Maps directly to the thesis. Refinement types capture the intuition: `WhiteHorse` adds a constraint, altering type identity.  
  2. **Subtyping vs. Inhabitance (`WhiteHorse <: Horse` but not vice versa)**  
     - Explains the objection: subtyping ensures a white horse *is* a horse (value-level inhabitance).  
  3. **Seeking Test as Function Compatibility**  
     - Perfect mapping: The test reveals type non-equivalence via codomain restrictions.  

  #### Distortions to Fit Type Theory
  1. **"Naming" as Predicate Application**  
     - Original: "Horse names shape; white names color" → metaphysical distinction.  
     - Distortion: Flattened to `Horse : Type`, `White : Predicate`, losing the philosophy of naming.  
  2. **Refinement Types Imply Set Extensions**  
     - Original: May deny extensionality (School of Names focused on *intensions*: properties, not sets).  
     - Distortion: `WhiteHorse = {x : Horse | White(x)}` assumes a set-theoretic model.  

  #### Unmappable Elements
  1. **Ambiguity of 非 (*fei*)**  
     - *Fei* can mean "is not an instance of" (categorical exclusion) or "is not identical to" (type non-identity).  
     - Type theory forces the latter (`WhiteHorse ≢ Horse`), but the objection argues the former (inhabitance).  
     - **Blind Spot**: Type theory lacks a single operator for both meanings, risking conflation.  
  2. **Metaphysics of Properties**  
     - Original: "Shape" and "color" as distinct ontological categories.  
     - **No Counterpart**: Type theory treats both as predicates (`Horse`, `White`) without metaphysical weight.  
  3. **Contextual Role of Names**  
     - Original: Names ("horse", "white") are active agents that "shape" reality.  
     - **Lost**: Type theory views names as static labels for types/predicates.  

  #### Critical Assessment of the Exercise
  - **Confused Premise?**  
    - The dialogue is **not formal semantics** but a dialectic on the ontology of names.  
    - Mapping to type theory *imposes* an extensional, set-based model the School of Names likely rejected.  
  - **Ambiguity of *Fei* Decides the Interpretation**:  
    - Choosing "non-identity" (over "exclusion") is necessary for type theory, but it sidesteps the objection’s valid point about categorization.  
    - **Nearest Defensible Rendering**: Treat the thesis as a **type non-identity claim** and the objection as a **subtyping/inhabitance claim**. This resolves the apparent contradiction.  
  - **Blind Spot in Type Theory**:  
    - **Intensional vs. Extensional**: The seeking test maps to extensions (values satisfying requests), but the original may intend *intensional* differences (meaning of terms).  
    - **Looseness in Original**: The dialogue equivocates between "is a" (subtyping) and "is identical to" (type equality). Type theory exposes this.  

  #### Conclusion
  - **What the Translation Buys**:  
    A precise dissection of the logical structure:  
    - *Thesis*: Type non-identity due to refinement.  
    - *Objection*: Subtyping ensures value-level membership.  
    - *Seeking Test*: Function types reveal non-equivalence.  
  - **What It Loses**:  
    The philosophy of naming and the School of Names’ anti-extensional stance.  
  - **Residue Diagnosis**:  
    Points to a **blind spot in type theory** (handling intensionality) and **looseness in the original** (equivocation on *fei*).  
    **Recommendation**: Use this to enrich type theory with intensional constructs (e.g., quotient types for "naming" equivalence).
