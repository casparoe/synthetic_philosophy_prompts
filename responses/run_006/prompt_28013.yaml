prompt: |-
  I'm a quant at a hedge fund, so I think natively in terms of expected returns, Sharpe ratios, factor exposures, capacity constraints, crowding, and alpha decay. I've never read any philosophy. I keep hearing about this importance–tractability–neglectedness framework that cause prioritization people use to rank which problems to work on, and I want you to restate it in my vocabulary as faithfully as you can: causes as positions, importance as something like expected return to solving the problem, tractability as how much your marginal dollar of effort actually moves the outcome, neglectedness as something like how crowded the trade already is. Then give me the residue report: what translates cleanly, what you had to fudge to make it fit, and what has no counterpart in the way I think. In particular I want to know whether neglectedness really is just crowding, or whether it's pointing at something about other actors future allocations that my vocabulary cant express because it only sees current prices and positions. And tell me honestly whether the whole framework is just mean–variance optimization with a few extra constraints, or whether I'm smushing it into a shape it doesn't have.
reasoning: |-
  Okay, let me tackle this quant's request. They want the ITN framework translated into finance terms, with a residue report on what fits and what doesn't. 

  First, I need to map:
  - Causes → positions (long/short societal problems)
  - Importance → expected return (magnitude if solved)
  - Tractability → marginal impact per unit effort (like leverage)
  - Neglectedness → crowding (how many players already on it)

  The quant's analogy holds well for importance and tractability - those are direct parallels to expected return and marginal contribution in portfolio theory. But neglectedness is trickier. In finance, crowding is observable from current market data (positions, flows, volatility). In cause prioritization, neglectedness includes forward-looking elements like future actor allocation changes - something finance models don't capture perfectly since they're based on current prices.

  The big gap is time dynamics. Finance models assume efficient information processing, but cause prioritization deals with slow-moving, opaque systems where neglect can persist for reasons beyond just current resources. Also, the "return" in cause prioritization isn't monetary and has huge uncertainty - more like venture capital than public markets.

  I'll need to honestly point out where the analogy breaks: 
  1) Non-fungible efforts (expertise matters more than dollars)
  2) Time-lagged feedback loops
  3) Fundamental uncertainty in impact measurement
  4) Coordination effects that don't exist in trading

  The framework isn't just mean-variance optimization because it handles these non-linear, uncertain, time-dependent factors that don't fit neatly into Sharpe ratios. But the core similarity - allocating scarce resources for maximum expected impact - is mathematically analogous to portfolio optimization.
answer: |-
  Here's a restatement of the Importance-Tractability-Neglectedness (ITN) framework in quant finance terms, followed by a residue report highlighting conceptual translations, fudges, and gaps:

  ### Quant Translation of ITN
  1. **Causes = Positions**  
     *Long/short societal problems.* Going "long" a cause means allocating resources to solve it (e.g., long biosecurity = investing in pandemic prevention).

  2. **Importance ≈ Expected Return (ER)**  
     *Annualized expected return if the problem is fully solved.* Calculated as:  
     **ER = (Magnitude × Probability) / Time**  
     - **Magnitude**: NPV of all future benefits (e.g., for AI safety: avoided extinction = ∞ utility discounted to present value).  
     - **Probability**: Likelihood the problem materializes if unaddressed (tail risk probability).  
     - **Time**: Urgency discount factor (e.g., climate change has longer duration than nuclear terrorism).

  3. **Tractability ≈ Marginal Impact per Unit Effort (MI)**  
     *Delta of success probability per additional dollar/hour deployed.* The "leverage" of your capital:  
     **MI = ∂(Success Probability) / ∂(Resources)**  
     *Low MI* = Diminishing returns (e.g., policy advocacy in gridlocked systems).  
     *High MI* = Convex payoff (e.g., funding a key researcher near a breakthrough).

  4. **Neglectedness ≈ Crowding (C)**  
     *Inverse of active AUM allocated to the cause.* Measures saturation:  
     **C = 1 / ∑(Resourcesᵢ)**  
     - *High C*: Few players, cheap "entry" (e.g., tropical disease R&D).  
     - *Low C*: Overcrowded, low marginal alpha (e.g., climate change mitigation).  

  **ITN "Alpha" Score**  
  Rank causes by: **ER × MI × C**  
  *(Expected Return × Marginal Impact × Crowding)*  

  ---

  ### Residue Report  
  **Clean Translations**  
  | ITN Concept          | Quant Equivalent               | Fidelity |  
  |----------------------|--------------------------------|----------|  
  | **Importance**       | Expected Return (magnitude × probability) | ★★★★★ |  
  | **Tractability**     | Marginal contribution to portfolio return | ★★★★☆ |  
  | **Neglectedness**    | Crowding (1 / capital deployed) | ★★★☆☆ |  

  **Fudged Components**  
  1. **Neglectedness ≠ Crowding (Alone)**  
     - *What’s missing:* **Future allocation sensitivity.** In finance, crowding is observable (positions, flows, vol). In cause prioritization, neglectedness includes:  
       - **Actor plasticity**: Will other funders enter if progress occurs? (e.g., government scaling proven solutions).  
       - **Information asymmetry**: Causes may stay neglected due to visibility gaps, not just low ER.  
       - *Analogy:* Crowdedness in a *non-fungible* market with sticky capital and latent players.  

  2. **Tractability as ∂Probability/∂$**  
     - *Fudge:* Assumes impact is differentiable and linear. Reality:  
       - **Threshold effects**: Capital may have zero impact until critical mass (e.g., $10M for a clinical trial).  
       - **Path dependence**: Early capital has higher convexity (e.g., seeding a new field).  

  3. **Importance Calculation**  
     - *Fudge:* Quant ER uses market prices. Cause ER relies on **counterfactual utility estimates** (e.g., value of averting human extinction). No "risk-neutral measure" for societal problems.  

  **No Quant Equivalent**  
  1. **Cross-Cause Correlation**  
     - Causes aren’t tradable assets. Can’t calculate β or covariance (e.g., solving AI risk might compound biosecurity risks).  

  2. **Time Dynamics of Neglectedness**  
     - Finance: Crowding resolves via arbitrage. Causes: Neglect can *persist* due to:  
       - **Visibility hysteresis**: Problems ignored for decades stay ignored.  
       - **Coordination failures**: No "arbitrageur" to deploy capital efficiently.  

  3. **Effort Non-Fungibility**  
     - Your human capital ≠ USD. Expertise in one cause (e.g., AI governance) doesn’t transfer to another (e.g., malaria).  

  ---

  ### Is ITN Just Mean-Variance Optimization (MVO)?  
  **Yes, superficially:**  
  - ITN ≈ MVO for a portfolio of causes:  
    - *Importance* = μ (expected return)  
    - *Neglectedness* = 1/σ₂ (inverse of crowding "vol")  
    - *Tractability* = Leverage (magnifies μ)  

  **No, fundamentally:**  
  1. **No Efficient Frontier**  
     - Causes can’t be combined to optimize Sharpe ratios. Impact is often binary (solve/don’t solve).  

  2. **Alpha Decay is Asymmetric**  
     - In finance, crowding erodes alpha *predictably*. In causes:  
       - *Positive feedback*: Success attracts capital (e.g., mRNA vaccines → flood of biotech funding).  
       - *Negative feedback*: Failure deters capital (e.g., fusion energy’s "30 years away" stigma).  

  3. **Constraints Dominate**  
     - **Capacity**: Some causes absorb unlimited capital (e.g., cash transfers). Others are bottlenecked (e.g., talent).  
     - **Impact Asymmetry**: Shorting a cause (e.g., blocking harmful tech) isn’t symmetric to going long.  

  ---

  ### Bottom Line  
  Your analogy **works for 80% of ITN** – especially capturing neglectedness as crowding and tractability as marginal impact. But the framework forces you to confront **three quant-blind spots**:  
  1. **Future actor plasticity** (neglectedness isn’t just current $).  
  2. **Non-linear impact thresholds** (tractability isn’t differentiable).  
  3. **Counterfactual utility pricing** (importance has no market calibration).  

  ITN is MVO if MVO included (a) binary outcomes, (b) invisible latent capital, and (c) undefined utility functions. It’s less a portfolio optimization tool and more a **heuristic for sourcing convex, uncrowded, high-utility positions in a broken market**.  

  > "It’s like VC investing where all startups are pre-seed, pitch decks are written in Sanskrit, and the only exit is saving the world."
