  Okay, let me tackle this user's query about the Frege-Geach problem and expressivism. The user shared a summary from an illustrated guide and their tutor called it "ropey." They want to know what's accurate, what's misrepresented, and how expressivists like Blackburn or Gibbard respond. 

  First, I need to assess the box's claims. The core description of expressivism as equating "murder is wrong" to "boo murder" is a simplification. Blackburn's projectivism and Gibbard's norm-expressivism are more nuanced. They don't reduce moral statements to mere exclamations but see them as expressions of attitudes embedded in complex linguistic practices.

  The Frege-Geach problem is presented accurately: moral terms in non-assertive contexts like conditionals pose a challenge. However, calling it "devastating" and the solutions "ad hoc" is an overstatement. Blackburn's solution involves higher-order attitudes without making them about attitudes directly. He uses a propositional surface with attitudes underneath, maintaining semantic continuity. Gibbard treats moral statements as expressing acceptance of norms, which function like truth-apt claims in logic.

  The box's dismissal of "attitudes about attitudes" is a misrepresentation. Blackburn's quasi-realism aims to explain moral discourse's features without ontological commitments. Calling these responses "hopelessly ad hoc" ignores the systematic work done by expressivists. The user might not realize that the problem isn't unsolved but addressed within expressivist frameworks.

  The user's deeper need is likely exam preparation, wanting a clear, critical understanding. They might be confused by the tutor's criticism and seek clarity on nuances. Highlighting Blackburn and Gibbard's actual responses, showing how they differ from the simplified version, is key. Emphasizing that the problem is serious but not fatal, and that solutions are substantive, not ad hoc, will address their needs.
answer: |-
  **The box's characterization is a significant oversimplification that misrepresents both the Frege-Geach problem's force and the sophistication of expressivist responses, particularly those of Blackburn and Gibbard.**

  Here's a breakdown of the inaccuracies and nuances:

  1.  **Oversimplification of Expressivism:** The "boo/hurrah" model (attributed to Ayer) is a crude caricature, not how sophisticated expressivists like **Simon Blackburn (quasi-realism)** or **Allan Gibbard (norm-expressivism)** define their position. They don't claim moral statements are *identical* to grunts or cheers. Instead, they argue moral statements fundamentally *express* non-cognitive attitudes (disapproval, endorsement, plans, commitments) but are embedded in a complex linguistic practice that *mimics* factual discourse. The meaning is rooted in the attitude expressed, not in describing a state of affairs.

  2.  **Accurate Core of the Frege-Geach Problem:** The box correctly identifies the core challenge: Moral sentences appear in logically complex contexts (conditionals, negations, questions, beliefs) where the speaker is clearly *not* expressing the attitude typically associated with the atomic moral claim (e.g., disapproval in "If murder is wrong...").
      *   The problem is about **compositionality** (how the meaning of complex sentences depends on the meanings of their parts) and **logical inference** (how we validly reason with moral sentences embedded in arguments). If "murder is wrong" *only* means "Boo murder!" in simple assertions, what does it contribute to the meaning and logic of "If murder is wrong..."?

  3.  **Misrepresentation of Expressivist Responses:**
      *   **"Attitudes about attitudes" is a Vast Oversimplification:** While Blackburn and Gibbard *do* appeal to higher-order attitudes or states, it's far more systematic and less "ad hoc" than the box implies.
          *   **Blackburn (Quasi-Realism):** He doesn't say we have attitudes *about* attitudes. Instead, he argues that complex contexts express *higher-order attitudes* towards combinations of first-order attitudes. Expressing "If murder is wrong, then getting someone else to murder is wrong" involves *disapproving of* the combination *"*approving of murder but not approving of getting someone else to murder". His project is to show how the *surface features* of moral discourse (propositional form, truth-aptness, logical relations) can be explained *entirely* in terms of the expression of attitudes and the logical relations between these expressive commitments. The propositional form is a useful fiction for tracking commitments.
          *   **Gibbard (Norm-Expressivism):** He argues moral judgments express *acceptance of a system of norms* that govern planning and feeling. "Murder is wrong" expresses acceptance of a norm forbidding murder. Crucially, Gibbard treats the *content* expressed ("that murder is wrong") as a type of fact (a "normative fact") within his framework. This allows the sentence to function logically like any other proposition in contexts like conditionals, even though its fundamental nature is expressive. The meaning is *systematically* tied to the planning state expressed.
      *   **"Hopelessly ad hoc"?** Philosophers disagree on the ultimate success of these responses, but dismissing them as "hopelessly ad hoc" is unfair. Blackburn and Gibbard offer detailed, systematic *theories* of meaning for moral language designed precisely to handle compositionality and logic. They are complex, controversial, and face ongoing challenges, but they are not mere hand-waving or arbitrary additions.

  4.  **Overstatement of the Problem's Impact ("Devastating"):** While the Frege-Geach problem is *the* central technical challenge for expressivism and forced its development beyond simple emotivism, it is **not** universally regarded as "devastating" today. Blackburn's quasi-realism and Gibbard's norm-expressivism are widely seen as serious, sophisticated attempts to *solve* the problem within an expressivist framework. Many philosophers believe these responses, while perhaps not ultimately successful, significantly mitigate the force of the objection and show expressivism is still a live option. The box presents it as a settled knockout blow, which it isn't.

  **What an Expressivist (Blackburn/Gibbard) Would Say:**

  *   **Blackburn:** "You misunderstand. I agree 'murder is wrong' expresses disapproval in simple assertions. But language is more complex. In a conditional like 'If murder is wrong...', I'm not disapproving of murder *then and there*. Instead, I'm expressing a *higher-order disapproval*: I disapprove of *combining* approval of murder with failure to disapprove of getting someone else to murder. My project (quasi-realism) is precisely to explain how moral discourse *earns its right* to look propositional and logical, using only the resources of attitudes and their logical relations. The meaning *is* consistent across contexts – it's the expression of a complex attitude structure."
  *   **Gibbard:** "Saying 'murder is wrong' expresses my *acceptance of a norm* that forbids murder. This state of norm-acceptance has a content – 'that murder is wrong'. This content can be embedded in conditionals, negations, etc., just like the content of a belief. The logic works because we can reason with these contents representing normative facts. The fundamental nature is expressive (it's about planning and feeling governed by norms), but the semantic structure allows for compositionality and logic. It's a unified account, not an ad hoc fix."

  **In Conclusion:** The box accurately identifies the core *puzzle* of the Frege-Geach problem but misrepresents expressivism as a crude "boo/hurrah" theory, drastically oversimplifies the nature of sophisticated expressivist responses as merely "attitudes about attitudes," unfairly dismisses those responses as "hopelessly ad hoc," and overstates the consensus that the problem is "devastating." Expressivists like Blackburn and Gibbard offer complex, systematic theories specifically designed to solve the compositionality and logic problems by grounding meaning in the expression of complex attitudes or states (higher-order attitudes, plans, norm-acceptance) while explaining the propositional surface of moral discourse. Whether these solutions ultimately succeed is debated, but they represent serious philosophical work, not desperate, arbitrary fixes.
