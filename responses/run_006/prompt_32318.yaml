  - **Candidate A: Evidential Decision Theory (EDT) with Tickle/Screening-off Defense**  
    EDT maximizes expected utility based on conditional probabilities (evidence). The "tickle defense" handles cases like Smoking Lesion by conditioning on the gene's effects to screen off spurious correlations.  
  - **Candidate B: Functional/Logical Counterfactual Theory (e.g., FDT/UDT)**  
    This theory (e.g., Functional Decision Theory or Updateless Decision Theory) uses logical counterfactuals, treating decisions as outputs of a fixed decision procedure that a predictor can simulate. It optimizes outcomes across logical dependencies.

  **Fit to the Cases**:
  - **Standard Newcomb**:
    - **EDT + Tickle Defense**: One-boxing is rational. Choosing only the opaque box provides evidence the predictor put $1M there (P($1M in opaque | one-box) ≈ 0.9), leading to high expected utility.  
    - **FDT/UDT**: One-boxing is rational. The decision procedure "always one-box" causes the predictor to fill the opaque box, making one-boxing optimal.
  - **Smoking Lesion**:
    - **EDT + Tickle Defense**: Smoking is rational. The craving (the "tickle") screens off the gene-cancer correlation. Given the craving, smoking provides no evidence of the gene, so it adds pleasure without affecting cancer risk.  
