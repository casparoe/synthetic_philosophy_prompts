  Finally, I'll assess the survival of the argument: probably not, because the disanalogies reveal that the analogy doesn't prove the impossibility of mind-independent objects, just the limitations of our access to them. The argument might only show we can't conceive without conceiving, not that unperceived things are incoherent.

