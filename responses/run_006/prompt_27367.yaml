answer: |-
  Here is your Q&A prep sheet, structured for maximum tactical advantage in this interdisciplinary minefield:

  ---

  ### 1. Thesis and Framing (147 words)  
  Your position: Textual meaning is constitutively hybrid. Authorial intention is a necessary (but insufficient) determinant of meaning, providing the default framework for interpretation. Conventions, context, and textual features constrain and shape meaning *alongside* intention—not against it. Unlike strong intentionalism, you acknowledge that failed intentions or irrecoverable authorial contexts may cede primacy to other determinants. Unlike anti-intentionalism, you insist intention isn’t merely causal but orientational: interpretation is fundamentally a communicative act aimed at recovering *why* these words were deployed.  

  **Key concession for literary theorists:** Open by explicitly acknowledging that *institutional power* shapes whose intentions are deemed worthy of recovery (e.g., canonical white male authors vs. marginalized voices). Stress that your model accommodates this: when intentions are erased by oppression or lost history, convention/textual features rightly dominate. This preempts dismissal by conceding their core ethical concern upfront.

  ---

  ### 2. Audience Map (149 words)  
  **Philosophers (50%):**  
  - *Griceans (sympathetic):* Will focus on speaker-meaning vs. sentence-meaning distinctions. Likely to ask clarifying questions about "default status."  
  - *Semantic externalists (hostile):* Believe meaning is fixed by public conventions. Will attack intention's "constitutive" role. Expect objections about private language or communal meaning-negotiation.  
  **Literary scholars (50%):**  
  - *Anti-intentionalists (majority, hostile):* Trained in "death of the author" dogma. Will weaponize Foucault: "Isn't this just reinstating the bourgeois subject?" and cite cases where authorial intent is oppressive/irrelevant (e.g., colonial texts).  
  - *Post-intentionalists (minority, neutral):* May ask about "intention" as discursive effect (e.g., Judith Butler).  
  **Graduate students:** Will bridge gaps—e.g., "Can intention include unconscious drives?" (lit) or "How does default status handle malapropisms?" (phil).  

  **Likely to speak:** Externalist philosophers (combative) and senior anti-intentionalists (performative). Silent dissenters: junior lit faculty fearing peer backlash.

  ---

  ### 3. Objections Ordered by Damage Potential  
  *(Phrased in-audience-voice → 2-min reply → Weakness/Concession)*  

  **#1: The Power Objection (Lit Scholar)**  
  > *"Your model privileges authorial authority, silencing resistant readings. When reading Conrad’s *Heart of Darkness*, why should we care what a racist imperialist *intended* when postcolonial readings expose the text’s complicity in violence he couldn’t perceive?"*  
  **Reply:** "Intention isn’t an ethical mandate—it’s an interpretive starting point. We *must* recover Conrad’s intention to understand how the text reproduces imperialism *through* its blind spots. Your reading gains force precisely by contrasting textual meaning with intent. But if meaning were *only* reader-driven, we couldn’t critique authors for bad faith."  
  **Weakness:** Concede intention isn’t morally binding. Stress that your model *enables* critique by making authorial responsibility visible.  

  **#2: The Public Meaning Problem (Externalist Philosopher)**  
  > *"If meaning is constituted by intention, how do you explain that we understand *Moby-Dick*’s symbolism without access to Melville’s diaries? Surely conventions suffice—intention is just biography."*  
  **Reply:** "Conventions *enable* intention-recovery but don’t exhaust meaning. Consider an unknown poem found in an attic: without intent, we can’t distinguish irony from sincerity. Public meaning relies on generalized intent—the assumption that speakers *use* conventions purposefully. Melville’s symbolism works because he *deployed* conventions to mean something specific."  
  **Weakness:** Default status feels fuzzy here. Concede that in *stable* textual traditions, convention can proxy for intent.  

  **#3: The Death of the Author (Lit Scholar)**  
  > *"Barthes showed texts are ‘tissues of quotations’ from culture, not authorial psyches. Isn’t your ‘default’ just a romantic fiction?"*  
  **Reply:** "Barthes is right that texts exceed authors—but they start somewhere. When we read, we ask ‘What is *this* voice doing?’ not ‘What does culture say?’ The author is the locus of that voice. Even Foucault asked ‘What did Nietzsche *intend* with genealogy?’—he just historicized intent."  
  **Weakness:** Overclaiming "locus." Concede authors are shaped by discourse, but argue they *recompose* it intentionally.  

  **#4: Failed Intentions (Gricean Philosopher)**  
  > *"If I write ‘gullible’ but accidentally misspell it ‘gullable,’ does my intent make it mean ‘gullible’? If not, how is intent constitutive?"*  
  **Reply:** "Intent works *through* conventions. Your misspelling fails because conventions block intent-realization. Meaning is negotiated: intent sets the telos, but conventions mediate it. Here, the word defaults to ‘gullable’ (a new meaning) because intent couldn’t leverage conventions."  
  **Weakness:** Exposes tension in "constitutive but insufficient." Stress hybridity.  

  **#5: Unintended Meanings (Lit Scholar)**  
  > *"*Oedipus Rex *means ‘patriarchal anxiety’ to modern feminists—something Sophocles couldn’t intend. Isn’t this meaning *real* regardless of intent?"*  
  **Reply:** "Absolutely—but it’s a *new* meaning layered onto the text. The original meaning (e.g., fate vs. agency) isn’t erased. We need both: without intent, we couldn’t trace *how* the text accrued new meanings. Your reading is transformative, not foundational."  
  **Weakness:** Risks sidelining lit scholars’ innovation. Praise their readings as generative *additions*.  

  **#6: Epistemic Access (Philosopher/Lit Hybrid)**  
  > *"Most intentions are irrecoverable—self-reports lie, archives burn. If intent is constitutive but inaccessible, is meaning often indeterminate?"*  
  **Reply:** "Yes—and that’s why we use conventions/text as proxies. But inaccessibility doesn’t negate existence. We reconstruct intent from evidence (e.g., genre norms). When evidence conflicts, we admit indeterminacy—unlike anti-intentionalists who deny intent matters *even when known*."  
  **Weakness:** Sounds evasive. Urge epistemic humility: "We work with best evidence."  

  **#7: Authorial Self-Ignorance (Lit Scholar)**  
  > *"What about Freudian slips or repressed ideologies? If Twain *intended* *Huck Finn* as anti-racist but embedded racist tropes, which ‘intention’ counts?"*  
  **Reply:** "Multiple intentions coexist: conscious aims vs. unconscious habits. We resolve this by contextual evidence. Twain’s letters show anti-racist goals, but textual tensions reveal *unexamined* biases. Meaning emerges from this clash—intent includes what the author *committed to* through the text."  
  **Weakness:** Unclear how to weight conflicting intents. Cite "intentional horizon" (P.D. Juhl).  

  **#8: Genre Overrides Intent (Philosopher)**  
  > *"If I scribble sonnet-like lines intending a grocery list, is it a sonnet? Genre conventions seem to swamp intent."*  
  **Reply:** "No—but genre sets expectations that *shape* intent. If you subvert sonnet conventions ironically, genre enables that meaning. If unintended, it’s a misfire: the text may *resemble* a sonnet but not *mean* as one. Intent uses genre as a tool."  
  **Weakness:** Edge cases defy intuition. Joke: "Call it ‘accidental poetry’ and publish it!"  

  ---

  ### 4. The Question You Hope Nobody Asks (142 words)  
  > *"Your ‘default status’ looks suspiciously universal. Ethnographic studies show some cultures treat texts as authorless communal artifacts (e.g., oral epics). Isn’t your model just Western individualism disguised as theory?"*  

  **Why it cuts deep:** It reframes your entire project as culturally parochial. You lack cross-cultural defense of intent’s centrality, and your concession about power (section 1) undermines your universality claim.  

  **Do not try:** Arguing it’s "human nature" (anthropological minefield) or retreating to "only Western texts" (admits defeat).  

  **Honest assessment:** You need ethnographic counterexamples (e.g., intent-driven non-Western traditions) but don’t have them. Instead: **Concede** that your model addresses *textual communication* (writing/speech acts), not all symbolic practices. Stress that even communal texts imply *some* intentionality (e.g., "What did this bard *aim to achieve* with this telling?"). Then pivot: "But this deserves its own paper—thank you!"  

  --- 

  **Final Tip:** When lit scholars invoke Foucault/Barthes, agree with their critiques of *strong* intentionalism before distinguishing your view. This builds goodwill while clarifying stakes.
