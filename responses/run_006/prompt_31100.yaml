  The argument goes wrong at step (5), which claims that the same pivotal threshold structure applies to all collective actions like recycling, reducing emissions, donating, and protesting. This step is incorrect because it assumes that these actions only change the world if they are pivotal—i.e., if they cross a threshold that would not otherwise be crossed. However, this is not true for all collective goods; many have continuous or probabilistic outcomes where individual contributions have marginal effects, not just pivotal ones.

  ### Why Step (5) Looked Correct
  Step (5) appeared correct because it draws a parallel to voting, where the outcome is discrete (e.g., a candidate wins or loses) and an individual vote matters only in the rare event of a tie or one-vote margin. This pivotal model seems intuitive for threshold-based goods, where a single action could theoretically tip the balance (e.g., a recycling program might shut down if participation falls below a critical level). The friend generalizes this to other collective actions, implying that all such problems require crossing a threshold for any impact to occur. This overgeneralization stems from the focus on "changing the world" only through pivotal moments, ignoring incremental contributions.

  ### Why Step (5) Is False
  For many collective actions, outcomes are not determined by thresholds but by cumulative marginal contributions:
  - **Donating to large aid organizations**: Charities often use funds incrementally (e.g., $50,000 might save one life on average). A $100 donation has an expected value of saving 1/500 of a life, which is a marginal probabilistic benefit, not a pivotal one. If the donor values a life at $5 million (a common estimate), the expected benefit is $10,000, easily exceeding the cost of $100.
  - **Reducing emissions (e.g., flying less)**: Climate damage is continuous; each ton of CO₂ contributes incrementally to expected harm. The social cost of carbon is estimated around $100–$200 per ton. Reducing one ton at a personal cost of, say, $50 creates net social benefit if the actor values societal welfare, even if the probability of being pivotal is zero.
  - **Recycling**: While some programs have threshold effects (e.g., curbside pickup requiring minimum participation), many operate continuously. More recycling reduces waste processing costs and environmental harm incrementally, so each contribution has a small but non-zero marginal benefit.
  - **Protesting**: Influence is often continuous; larger protests garner more media attention and political pressure. One additional person can marginally increase the protest's impact, affecting policy even without crossing a strict threshold.

  In these cases, expected utility can be significant without a pivotal probability because the benefit scales with the contribution. Step (5) errs by conflating all collective actions with voting-like thresholds, when only some (e.g., voting itself) fit that model.

  ### Cost of Rejecting Step (5)
  Rejecting step (5) has minimal cost to the rest of your views:
  - **Consequentialism remains intact**: Expected utility still determines rationality, as per step (1). For continuous goods, expected benefits are calculated from marginal effects (e.g., expected lives saved per dollar donated), not pivotal probabilities.
  - **Voting can be rational**: Voting remains a threshold good with low pivotal probability, but step (4) can be rejected separately by incorporating the utility of "doing one's part" into the calculus (e.g., satisfaction from civic duty). This is consistent with step (1) if utility includes personal feelings, avoiding the need for a "separate source" of reasons.
  - **No collapse into paradox**: The line between pivotal and marginal contributions is precise:
    - **Pivotal actions** require a threshold where the outcome changes discontinuously (e.g., elections, certain policies with quorums). Here, expected utility depends on the low probability of being pivotal.
    - **Marginal actions** involve continuous outcomes where each unit of contribution has a proportional effect (e.g., donations, emissions reductions). Here, expected utility is direct and calculable without pivotal probability.
    This distinction doesn't collapse because marginal actions never rely on being pivotal; they always have an expected effect proportional to the contribution size.

  ### Alternative Fixes Considered
  - **Adding expressive/duty value**: Step (1) can accommodate this by including utility from the act itself (e.g., pride in voting). This could resolve voting's irrationality in step (4) but is unnecessary for marginal actions, where expected world consequences already justify participation.
  - **Rejecting step (2)**: The pivotal probability in large elections is often higher than 10⁻⁷ (e.g., ~10⁻⁴–10⁻⁵ for n=150 million), making voting more rational. But this doesn't address the generalization error in step (5) and still leaves voting harder to justify than marginal actions.
  - **Rejecting step (1)**: Abandoning expected utility as the sole source of reasons (e.g., adding deontic duties) resolves the absurdity but at high cost, undermining consequentialist foundations you wish to keep.

  Rejecting step (5) preserves step (1), avoids the absurd conclusion in step (6), and allows voting to be rational via marginal utility or duty value.

  \answer{reject step 5}
