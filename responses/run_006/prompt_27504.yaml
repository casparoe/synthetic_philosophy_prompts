  Okay, the user is diving deep into the philosophy of art, specifically the problem of forgeries. They've noticed that museums and the art market handle forgeries differently but both treat the object differently after it's exposed. The museum recontextualizes it, while the market value plummets. They want to understand the implicit theories of aesthetic value behind these practices and whether they're consistent.

  First, I need to recall the readings they mentioned—Goodman, Dutton, Lessing. Goodman's distinction between autographic and allographic arts is relevant here. Forgeries in autographic arts like painting matter because of the history of production. Dutton's concept of artistic performance ties the value to the artist's actions. The user's question goes beyond these to institutional practices.

  The user is interested in the practical implications. Museums don't discard forgeries; they rebrand them. The object's physicality is unchanged, but its identity shifts. The market's reaction is a drastic drop in value even without deception. They're hinting at aesthetic empiricism—where only perceivable properties matter. But both institutions seem to reject that.

  Breaking down the museum's perspective: They treat artworks as historical documents. Authenticity is tied to origin. A forgery becomes a testament to art history, changing its narrative. The market's view is more about scarcity and ownership. Provenance equals exclusivity. If a piece isn't by Vermeer, it loses that exclusivity, hence the value drop. 

  Are these two views consistent? Both prioritize origin over perceptual qualities. The museum shifts the context but still values the object as an artifact. The market abandons it because it lacks the desired provenance. So underlying both is a commitment to origin as essential. Aesthetic empiricism would collapse this distinction, but institutions don't operate that way.

  The user might be probing if institutions are hypocritical. But actually, both practices stem from the same core belief: art's value is more than sensory experience. The museum retains it as evidence of cultural history, while the market discards it as a commodity without the right pedigree. 

  What if we adopted aesthetic empiricism? Museums might display forgeries as originals if indistinguishable, but that undermines their educational role. The market might still crash because collectors want the "real" thing, not just the look. So institutional purposes differ, but both reject empiricism. The user's deeper need might be understanding how societal values shape art institutions, or questioning if there's inconsistency in still valuing forgeries differently. They might be seeking arguments to challenge traditional views or reconcile practice with theory.
answer: |-
  Your observation cuts to the heart of how institutions *perform* their theories of art value, often more eloquently than their stated philosophies. Let's reconstruct the implicit theory behind these practices and examine the tension with aesthetic empiricism:

  **The Implicit Institutional Theory: "Origin is Constitutive"**

  Both museum and market practices rest on a shared core commitment: **the origin of an artifact is constitutive of its identity and primary value as an artwork.** An artwork isn't just an arrangement of properties; it's a *historical event* or a *trace of agency*.

  1.  **The Museum's Practice (Preservation & Recontextualization):**
      *   **Commitment:** The object remains valuable, but *as a different kind of artifact*. Its new value derives from its history *as a deception* or as evidence of reception history/taste.
      *   **Why Origin Matters:** The object cannot be a Vermeer *because Vermeer didn't make it*. Its primary identity *as an artwork* (a Vermeer) was contingent on its origin. Removing that origin destroys that specific artwork-identity.
      *   **What They Preserve:** They preserve the physical object *as evidence* of:
          *   **Artistic Skill (of the forger):** Demonstrating technical prowess in a different context (deception).
          *   **Cultural/Reception History:** Documenting what past experts/collectors valued and how they were fooled (e.g., "The Han van Meegeren Phenomenon").
          *   **The History of Attribution & Connoisseurship:** Serving as a pedagogical tool about the fallibility and evolution of art historical methods.
          *   **The Narrative of "The Fake":** The object now tells a story *about* authenticity, forgery, and the art world itself. This narrative is contingent on its *actual* origin (20th-century forgery) being known.

  2.  **The Market's Practice (Value Collapse):**
      *   **Commitment:** The primary value assigned to a unique artwork by a master artist is fundamentally tied to its scarcity and the *provenance of its creation*. This value is almost entirely origin-dependent.
      *   **Why Origin Matters:** The market isn't (primarily) paying for the sensory experience. It's paying for:
          *   **Scarcity & Exclusivity:** Owning one of the *very few* objects *actually made* by the revered artist.
          *   **Provenance & Pedigree:** The object's lineage back to the artist's hand is its core asset.
          *   **Associative Value:** Owning an object imbued with the aura of genius, historical significance, and cultural capital *directly linked* to the originating artist.
          *   **Future Investment:** The origin (authenticity) is the bedrock guarantee of future value stability/appreciation. A known forgery lacks this foundation.
      *   **The Transparency Paradox:** Even if everyone knows it's a fake, the value collapses because the core *reason* for its previous astronomical value (being *by* Vermeer) has been definitively removed. The market confirms that its price wasn't based on the *look*, but on the *origin*.

  **Consistency Between Museum & Market?**

  *   **Shared Foundation:** Yes, both implicitly reject aesthetic empiricism. Both agree that the origin (who made it, when, and under what circumstances) is **constitutive** of the artwork's primary identity and core value. The physical object alone is insufficient.
  *   **Divergent Valuation Frameworks:** The key difference lies in *what kind of value* they extract from the object *after* the origin is known:
      *   **Market:** Focuses almost exclusively on *artistic origin-as-commodity value*. Remove that origin, remove the commodity value. It abandons the object because its *raison d'être* within the market framework (being a rare Vermeer) is gone.
      *   **Museum:** Shifts focus to *historical/documentary/cultural value*. The object gains a *new*, often intellectually rich, identity and value *precisely because* its true origin (as a forgery) is now known. Its value now resides in its role as evidence within art history narratives.

  **The Challenge of Aesthetic Empiricism**

  If we adopted the strict view that "the value of an artwork resides entirely in its perceivable surface properties," the institutional practices would need radical overhaul:

  1.  **For the Museum:**
      *   **No Reclassification Needed:** If the perceptual experience is identical, the forgery *is* the Vermeer for the viewer. Removing the "Vermeer" attribution becomes an act of deception, hiding the "true" (perceptually identical) aesthetic object.
      *   **Display Philosophy:** Museums would display the forgery *as* the original masterwork, as the aesthetic experience is paramount. Disclosing the true origin might be seen as an interesting historical footnote, but irrelevant to the aesthetic encounter.
      *   **Loss of Historical Narrative:** Exhibits on "fakes" or "the history of collecting" centered on forgeries would lose their primary rationale. If the perceptual experience is all that matters, why highlight the "fake" status? The object's value as a cautionary tale/document relies on origin *mattering*.

  2.  **For the Market:**
      *   **No Value Collapse:** If the perceptible properties are identical, the aesthetic value is identical. The market price should remain high. Provenance becomes irrelevant to the core value proposition (the aesthetic experience).
      *   **Shift in Scarcity:** The value of "originality" would plummet. A perfect replica (digital, mechanical, or hand-painted) would hold equal aesthetic (and therefore market) value to the original. The market would shift to valuing the *first* instance, the *best* instance, or the most *convenient* instance of the perceptible properties, not the unique artifact created by the master.
      *   **Transparency Becomes Mandatory (but Irrelevant to Value):** Disclosure of origin would be necessary to avoid fraud (selling a copy as the "first" copy might matter), but knowing something *is* a copy wouldn't inherently diminish its value if the perceptible properties are perfect.

  **Why Institutions Resist Empiricism (Implicitly):**

  The practices reveal that both institutions, despite their differences, treat artworks as more than perceptual stimuli:

  *   **Art as Historical Testimony:** Museums see artworks as nodes in a historical network, carrying the trace of their time, creator, and reception. Origin is paramount for this.
  *   **Art as Performance/Event:** Following Dutton, the artwork is the *act* of the artist creating *that* specific object in its specific context. A forgery is a different performance, regardless of outcome.
  *   **Art as Unique Artifact:** The market, and much museum scholarship, trades on the irreplaceable nature of the singular object born from the artist's hand. Scarcity is tied to origin.
  *   **Art as Encounter with the Artist:** Viewers often seek a connection, however mediated, with the creative mind of the original artist. A forgery breaks that link, regardless of appearance.

  **Conclusion:**

  The museum's recontextualization and the market's abandonment of the exposed forgery, despite its unchanged physicality, are consistent manifestations of the same underlying theory: **the origin of an artwork is constitutive of its identity and primary value.** They differ only in *what kind of secondary value* they assign to the object once its primary artistic identity (based on origin) is shattered.

  Adopting strict aesthetic empiricism would necessitate revolutionary changes: museums displaying perfect forgeries as originals (or rendering origin irrelevant), and markets valuing perfect replicas as highly as originals. However, current institutional practices powerfully demonstrate that the art world, in its actions, overwhelmingly rejects empiricism. It values the *history*, the *performance*, the *provenance*, and the *unique artifact* as inseparable from the aesthetic object itself. The story the object tells about its own making is part of its essence.
