answer: |-
  Here's a teaching plan designed to preempt derailment and focus squarely on the **normative force** of the money pump argument for diachronic rationality:

  **Core Goal:** Students should understand that the money pump *exposes a structural vulnerability inherent in cyclic preferences over time*, arguing that avoiding this vulnerability *requires* satisfying certain diachronic consistency constraints (e.g., commitment, resoluteness, sophistication), which are distinct from synchronic requirements. It's about the *rational defect* revealed, not the practical likelihood of being pumped.

  **Phase 1: Foundation (15 mins) - Setting the Stage Normatively**

  1.  **The Starting Point: Synchronic Rationality Requirements (5 mins)**
      *   Briefly recap: Rational choice theory often assumes preferences satisfy axioms like transitivity *at a single point in time*. (e.g., If A>B and B>C, then A>C).
      *   **Why?** To avoid contradictions *now* and ensure coherent choice *now*. Representational theorems show these axioms allow preferences to be represented as maximizing expected utility *at a time*.
      *   **Question:** "Does synchronic coherence guarantee you won't make choices over time that you end up regretting or that leave you worse off?" (Plant the seed).

  2.  **Introducing the Diachronic Problem (10 mins)**
      *   "Rationality isn't just about snapshots; it's about navigating time. We make plans, form intentions, and face sequences of choices."
      *   **Key Distinction:** Synchronic (at a time) vs. Diachronic (over time) rationality requirements.
      *   **The Challenge:** How can preferences change *rationally* over time? (e.g., learning new info, changing tastes). BUT, what if preferences seem to shift *without reason*, or worse, *cycle* predictably?
      *   **The Core Question:** "Are there consistency requirements that apply *specifically* to how your preferences/choices relate *across different times*? The money pump is an argument that says *yes*, and points to a specific kind of failure."

  **Phase 2: The Engine - The Money Pump Scenario (30 mins)**

  1.  **The Example: Keep it Simple & Visceral - Modified Beverage Cycle (5 mins setup)**
      *   "Imagine your options for a drink at three different points *today* are **Coffee (C)**, **Tea (T)**, or **Juice (J)**."
      *   **Stable, Cyclic Preferences (State clearly & write down):**
          *   *Right now (t0):* You prefer C > T > J > C. (i.e., Coffee > Tea > Juice > Coffee).
          *   **Crucial:** Emphasize these are your *stable, known* preferences *at the relevant choice points*. This isn't about changing your mind unexpectedly later. It's your fixed structure.
      *   **Normative Claim:** "According to synchronic rationality, at *each individual choice point*, you are rational if you choose your most preferred option *at that moment*. But let's see what happens over time..."

  2.  **The Pump Sequence (10 mins - Walk through slowly)**
      *   **Point 1 (t1):** Offered Tea (T) or Juice (J). *Synchronic preference:* T > J. You rationally choose **T**.
      *   **Point 2 (t2):** Now holding T. Offered to *trade* T for C, paying a small fee (say $0.10). *Synchronic preference:* C > T. You rationally pay $0.10 to trade **T for C**.
      *   **Point 3 (t3):** Now holding C. Offered to *trade* C for J, paying another $0.10. *Synchronic preference:* J > C?! (Remember the cycle: J > C). You rationally pay $0.10 to trade **C for J**.
      *   **Result:** You have Juice (J), which you originally preferred *less* than Tea (T) at t1... and you've paid $0.20. You are objectively worse off than if you had *kept* the Tea you started with at t2, or even just taken Juice at t1.

  3.  **Highlighting the Vulnerability & Normative Point (15 mins - MOST CRITICAL)**
      *   **The Exploitation:** "A clever trader, knowing your preferences, can exploit this cycle to extract money from you, leaving you with a less preferred outcome and less money."
      *   **The Irrationality Charge:**
          *   "Each choice *at the time* was synchronic-rational based on your preferences *at that moment*."
          *   "Yet, the *overall sequence* of choices leaves you worse off than sticking with an option you *already had* at an earlier point (Tea at t2)."
          *   "The *structural defect* is the *cycle* itself. It makes you vulnerable to predictable, foreseeable (by others) exploitation *even if you make the locally best choice each time*."
      *   **The Diachronic Requirement:** "To avoid *this specific kind of predictable, costly vulnerability over time*, rationality seems to demand more than just synchronic coherence. It demands some form of diachronic consistency: perhaps *sticking to a plan* (commitment), *foreseeing and avoiding* the trap (sophistication), or *resolving* the future inconsistency *now*."
      *   **Reframe "I'd just stop":** "Notice: The argument *doesn't depend* on you actually *being* pumped. It points out that your *preference structure itself* makes you *vulnerable* to being exploited in this predictable way. It's like having a security flaw in your software – the flaw is there whether a hacker exploits it or not. The money pump *demonstrates* the flaw. The normative demand is to avoid having preferences that *contain* this flaw."

  **Phase 3: Addressing Misconceptions Proactively (15 mins)** - *Weave these in during Phase 2/3, but be ready to address explicitly*

  *   **(a) "I'd just notice the cycle and refuse the next trade!"**
      *   **Response:** "Great! But *why* would you refuse? If your preferences *right then* are C > T, paying $0.10 to get C seems rational *at t2*. Refusing means *overriding* your synchronic preference. *That* action – refusing the locally rational trade – is evidence you recognize the need for a *diachronic* constraint. The pump shows *why* you *should* (rationally) feel compelled to override the local preference. It shows the *need* for that diachronic rule."
  *   **(b) "This is just about stupidity or bad memory!"**
      *   **Response:** "No. We've assumed stable, known preferences and perfect memory. The agent knows their preferences and remembers past choices. The problem arises from the *logical structure* of the preferences themselves (the cycle) interacting with sequential choice opportunities. It's a structural vulnerability, not a cognitive failure."
  *   **(c) "It shows pragmatic badness, not irrationality!"**
      *   **Response:** "This is key! The money pump *uses* pragmatic badness (losing money, ending up worse off) to *reveal* the underlying irrationality. The irrationality *is* the cyclic structure that *causes* this predictable vulnerability to pragmatic loss. If rationality is about making good decisions, being predictably exploitable in this way seems like a rational failing. The pragmatic loss is the *symptom* of the structural defect."
  *   **(d) Conflating with Dutch Books:**
      *   **Response:** "Dutch Books target *probabilistic* incoherence (incoherent credences) at a single time, showing vulnerability to sure loss in betting scenarios. Money pumps target *preferential* incoherence (cyclic preferences) *over time*, showing vulnerability to sure loss (or sure worsening) through sequential trades. Both are 'exploitation arguments,' but they target different types of incoherence (beliefs vs. preferences) and different domains (synchronic vs. diachronic)."
  *   **(e) Potential New One: "But preferences change naturally!"** (Pre-empt this)
      *   **Response:** "Absolutely! Rational preference change (e.g., learning juice has more vitamins) is not the target. The issue is *cyclic* preferences that are *stable* and *predictable*. If your preferences change *non-cyclically* and rationally in response to new information, you likely wouldn't be vulnerable to *this specific* kind of pump."

  **Phase 4: Consolidation & Assessment (15 mins)**

  1.  **Summarize the Normative Structure (5 mins):**
      *   Cyclic preferences are synchronically possible.
      *   Acting on them sequentially *can* lead to predictably worse outcomes (the pump).
      *   This reveals a *structural vulnerability* inherent in the preferences.
      *   To avoid *this specific vulnerability*, agents need diachronic consistency constraints (beyond synchronic requirements).
      *   Therefore, cyclic preferences are diachronically irrational *because* they create this vulnerability.

  2.  **The Key Assessment Question (10 mins - Discussion):**
      *   **"Suppose an agent with cyclic preferences successfully avoids being money-pumped in a specific instance (maybe they notice the cycle, or no exploiter appears). Does this mean their cyclic preferences are rationally unproblematic? Why or why not, according to the normative argument presented by the money pump?"**

      *   **Why this question?**
          *   It directly targets the core normative claim: the vulnerability *itself* is the rational defect, not the actual occurrence of pumping.
          *   It forces students to articulate that avoiding the pump in practice doesn't remove the *structural flaw* that made the vulnerability possible and predictable.
          *   It tests if they understand the money pump as a *demonstration* of an inherent problem, not just a description of a possible bad outcome.
          *   A good answer will reference the *predictable exploitability* based on *stable, known preferences* as the source of the irrationality charge, irrespective of actual exploitation.

  **Where to Draw the Line & What to Say:**

  *   **"Why be rational?":** "That's a deep and important meta-question! For today, we're operating *within* the project of trying to articulate what instrumental rationality *requires* for agents navigating time. We're asking *if* cyclic preferences are irrational *within that framework*, assuming we generally want to avoid predictable vulnerability and worsening our position. The 'why be rational?' question is one level up, and we can tackle that another time."
  *   **Formal Representation Theorems:** "The money pump argument is often seen as complementary to representation theorems. Representation theorems show that synchronic coherence *allows* you to be represented as maximizing utility *at a time*. The money pump argues that diachronic coherence is needed to avoid predictable loss *over time*. We're focusing on the latter's normative force today, not the formal underpinnings linking them."
  *   **Psychological Realism:** "We're building a *normative model* of rationality, not a descriptive psychological theory. The question isn't 'Do people actually fall for this?' but 'If an agent has these stable preferences, does this expose a rational flaw that they *should* want to avoid, and *how*?'"
  *   **Specific Solutions (Resolute vs. Sophisticated):** Briefly mention these are proposed diachronic strategies to avoid the pump *if* you have cyclic preferences, but the core point today is that you *shouldn't have* the cyclic preferences to begin with, because they create the vulnerability these strategies try to patch. Don't dive deep into the debate between them.

  **Example Choice:** Stick with **Coffee/Tea/Juice**. It's classic, simple, and avoids distracting real-world complexities. Make it concrete: "You're at a conference; drink stations at different times." The slight absurdity of paying to swap drinks highlights the irrationality. Avoid more 'concrete' examples (like job choices) that might introduce irrelevant factors (risk, uncertainty, values changing for good reasons).

  **Key to Success:** Be relentlessly clear that the **stable cyclic preference structure** is the target, the **predictable vulnerability** is the symptom, and the **diachronic requirement** is the proposed cure. Anchor every point back to this normative core. Good luck! Your awareness of the pitfalls is the best preparation.
