  The provost's "avoid total loss" argument has emotional weight but ignores that winning still loses money. The critics' position is mathematically stronger but needs framing that acknowledges psychological pull of sunk costs.

  Structural considerations: 
  - Must recommend specific action (approve/deny/conditional) 
  - Needs time-bound elements 
