  - **Propositionalist Prediction**: Embedded conditionals can be interpreted in a truth-conditional way, perhaps by providing a suitable semantics (like the material conditional or a more sophisticated one). The embedding test will show that conditionals can be embedded without anomaly.

  **Crux 2: The Import of the Triviality Results**

  - **Issue**: Are there propositional accounts that can avoid the triviality results by relaxing one of Lewis's assumptions without giving up on truth conditions?
  - **Concrete Case**: Consider the approach of restricting Adams' Thesis to a fixed probability function (not closed under conditioning). The Propositionalist might point to a system like that of Richard Bradley (e.g., in his "Adams condition" for conditionals) where the conditional is a proposition and Adams' Thesis holds for the current probability function but not for all probability functions. The Non-Propositionalist argues that even this restricted version fails because conditionals are used in contexts where we do condition on other information (and thus change the probability function).
  - **Test**: Consider a scenario where an agent learns a new fact that is logically independent of A and C. For example, let A be "The coin is flipped" and C be "It lands heads". The agent has Cr(C|A)=0.5. Now, the agent learns that the coin is biased towards heads (say, with a new probability function Cr'). If the conditional "If A then C" is a proposition, then its truth value is fixed. But after learning about the bias, the agent's conditional probability Cr'(C|A) becomes 0.6. Does the agent then change their credence in the conditional? If so, then the conditional proposition must be such that its truth is not fixed? Or must we say the conditional proposition is the same but the agent's credence in it should change? But then Adams' Thesis would require that Cr'(conditional) = Cr'(C|A)=0.6, but if the truth of the conditional is fixed, then the agent's credence should not change unless they get evidence about the conditional itself. This leads to a tension.
  - **Non-Propositionalist Prediction**: The agent will update their conditional probability without having evidence about the truth of the conditional (because there is no such truth). Hence, the only coherent way is to deny that the conditional has a truth value. In the test, the agent will naturally adjust their conditional probability without any need to consider a change in the truth of the conditional.
  - **Propositionalist Prediction**: The agent can update their credence in the conditional proposition to match the new conditional probability, and this does not require the truth of the conditional to change. The Propositionalist might explain this by saying that the conditional proposition is about a relation between A and C that is sensitive to the agent's total evidence (like a conditional event). Alternatively, they might accept that the truth conditions are such that the conditional is true in some worlds and false in others, but the agent's credence in it must track the conditional probability in the current state of information. They might also relax the requirement that Adams' Thesis must hold after learning arbitrary evidence.

  **Crux 3: The Norm of Assertability**

  - **Issue**: Can the data that Adams' Thesis captures (i.e., that we are inclined to assert a conditional to the degree of our conditional probability) be explained by a norm of assertability without being a claim about the credence in a proposition?
  - **Concrete Case**: Consider the famous example from Dorothy Edgington: You are about to draw a card from a deck. You say, "If the card is red, it's a heart." Your conditional probability of heart given red is 1/2. But if the conditional were a material implication, then since the card might be black, the material conditional (~Red ∨ Heart) would be true (because ~Red is true) and you should be certain of it. But intuitively, you are not certain and you would not assert it without reservation.
  - **Test**: We compare the predictions of the two views. The Non-Propositionalist says: the conditional is assertable to degree 1/2 because that is the conditional probability. The Propositionalist must say: the conditional is not assertable because it is false (if the card is red and not a heart) or true (if the card is black or a heart), but we don't know which. Hence, the assertability of the conditional should be the credence that the material conditional is true, which would be 1 - Cr(Red and not Heart) = 1 - (1/4) = 3/4. But that contradicts the intuition that it should be 1/2.
  - **Non-Propositionalist Prediction**: The case shows that the assertability of the conditional is 1/2, which matches the conditional probability and cannot be explained by the truth conditions of a proposition. Hence, the case supports their view.
  - **Propositionalist Prediction**: The Propositionalist must either (a) reject the material conditional as the correct account and provide an alternative truth condition that makes the conditional assertable to degree 1/2, or (b) explain why we are inclined to say 1/2 even though the truth conditions would require 3/4. For (a), they might propose a non-material conditional (like the suppositional conditional) or a context-dependent one. For (b), they might say that the norm of assertability for conditionals is the conditional probability, but that does not reflect the credence in the proposition. They must then explain why the credence in the proposition is 3/4 but we are not allowed to assert it with that credence? This is a challenge. Some Propositionalists (like those adopting Stalnaker's semantics) might say that the conditional probability is the credence in the conditional proposition only when the antecedent is possible, but then they must also avoid the triviality by restricting Adams' Thesis.

