  - **Test**: We examine natural language usage. Do we have clear intuitions about the truth conditions of embedded conditionals? For example, does "It is not the case that if it rains, the match will be canceled" have the same assertability conditions as "If it rains, the match will not be canceled"? Or does it have a different meaning? Also, what about conditionals embedded in disjunctions: "Either if A then C or if D then E"?
