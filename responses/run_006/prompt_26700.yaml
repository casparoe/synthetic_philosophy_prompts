  ### Adversarial Collaboration Statement: Indicative Conditionals and Lewis's Triviality Results

  **Parties:**  
  - **Non-Propositionalist (Adams Camp):** Holds that Adams' Thesis is correct without qualification, and indicative conditionals do not express propositions.  
  - **Propositionalist:** Holds that indicative conditionals express propositions with truth conditions, so Adams' Thesis must be restricted or reinterpreted as a norm of assertability.  

  #### 1. Agreed Claims  
  Both parties accept the following substantive claims:  
  1. **Adams' Thesis (Descriptive Claim):** For a rational agent, the degree of belief appropriate to an indicative conditional "If \(A\), then \(C\)" is the conditional probability \(P(C \mid A)\), provided \(P(A) > 0\). This is a core feature of indicative conditionals in natural language.  
  2. **Lewis's Triviality Results (Core Mechanics):** Lewis's proofs demonstrate that if the indicative conditional is represented as a propositional connective (i.e., it denotes a proposition in the same algebra as \(A\) and \(C\)), and if Adams' Thesis holds for all probability distributions, then the probability space is trivialized (e.g., all propositions must be probabilistically independent or the algebra is limited to 4 or fewer atoms).  
  3. **Assumptions in Lewis's Proof:**  
     - (a) **Closure under conditioning:** Probability functions are closed under conditionalization on any proposition with non-zero probability.  
     - (b) **Conditional as an ordinary proposition:** The indicative conditional "If \(A\), then \(C\)" is treated as a proposition in the same algebra as \(A\) and \(C\), and can be embedded in Boolean operations.  
     - (c) **Universal scope:** Adams' Thesis holds for all probability distributions or a sufficiently rich class (e.g., one closed under conditioning).  
  4. **What the Proof Rules Out:** No binary propositional connective can satisfy Adams' Thesis universally (i.e., for all \(A\), \(C\), and probability distributions) under Lewis's assumptions.  
  5. **What the Proof Does Not Rule Out:**  
     - Adams' Thesis holding for a fixed probability distribution (without closure under conditioning).  
     - Adams' Thesis as a norm of assertability (e.g., "assert 'If \(A\), then \(C\)' only if \(P(C \mid A)\) is high").  
     - Non-propositional accounts of conditionals (e.g., where conditionals lack truth conditions or are not in the algebra).  

  #### 2. Disagreements Table  
  Each row states a residual disagreement. Wording is acceptable to the side it describes.  

  | Issue | Non-Propositionalist (Adams Camp) | Propositionalist |  
  |-------|-----------------------------------|-----------------|  
  | **Nature of indicative conditionals** | Indicative conditionals do not express propositions; they are devices for conditional assertion and lack truth conditions. | Indicative conditionals express propositions with truth conditions (e.g., possible-worlds intensions). |  
  | **Status of Adams' Thesis** | Adams' Thesis is correct as a claim about credence: the degree of belief in "If \(A\), then \(C\)" is identical to \(P(C \mid A)\). | Adams' Thesis is not a claim about credence in a proposition; it is either false as stated or best explained as a norm of assertability. |  
  | **Primary lesson from Lewis's triviality** | Lewis's results show that indicative conditionals cannot express propositions, as this would require Adams' Thesis to hold universally, leading to absurdity. | Lewis's results show that Adams' Thesis must be restricted (e.g., to assertability) if conditionals express propositions; they are the main reason to reject an unqualified Adams' Thesis. |  
  | **The role of the algebra** | Conditionals are not in the algebra of propositions; treating them as such is a category error that triggers triviality. | Conditionals are in the algebra; triviality arises only if we insist Adams' Thesis holds universally, which is unnecessary. |  

  #### 3. Cruxes  
  Cruxes are sub-questions where resolution would move at least one party. For each, a concrete case/argument is provided, with both sides agreeing it bears on the crux. Predictions are stated in advance.  

  **Crux 1: Can Adams' Thesis hold for a single probability distribution without triviality?**  
  - **Case:** Consider an agent with a fixed probability function \(P\) over a finite algebra. Define "If \(A\), then \(C\)" as a proposition satisfying \(P(\text{If } A, \text{ then } C) = P(C \mid A)\) for all \(A, C\) in the algebra. Does this lead to triviality if conditioning is not applied to all possible propositions (i.e., Lewis's closure assumption is relaxed)?  
  - **Non-Propositionalist Prediction:** Triviality still occurs because the algebra must accommodate conditioning on the conditional itself (via Lewis-style arguments).  
  - **Propositionalist Prediction:** No triviality occurs; Adams' Thesis can hold for \(P\) if we avoid conditioning on arbitrary propositions (e.g., by restricting the domain).  

  **Crux 2: Do embeddings of conditionals require truth conditions?**  
  - **Case:** Consider the negated conditional: "It is not the case that if \(A\), then \(C\)." If conditionals lack truth conditions, this embedding is problematic. Analyze natural language embeddings (e.g., in negation, disjunction, or belief reports) for coherence without truth conditions.  
  - **Concrete Argument:** Examine if "It is not the case that if it rains, the match is canceled" can be:
    - Asserted when \(P(\text{match canceled} \mid \text{rain})\) is low (supports Non-Propositionalist).  
    - Interpreted as a truth-functional compound (supports Propositionalist).  
  - **Non-Propositionalist Prediction:** Embeddings are reducible to conditional speech acts (e.g., conditional denial) and do not require truth-conditional treatment.  
  - **Propositionalist Prediction:** Embeddings demand truth conditions; e.g., negation requires a proposition to negate.  

  **Crux 3: Does conditional probability guide assertion independently of credence?**  
  - **Case:** Suppose an agent has \(P(C \mid A) = 0.9\) but low credence in the truth of "If \(A\), then \(C\)" (e.g., due to external factors). Is the agent warranted in asserting "If \(A\), then \(C\)"?  
  - **Concrete Argument:** Use the **card example**: A fair deck is shuffled. You say, "If the card is red, it is a heart." \(P(\text{heart} \mid \text{red}) = 0.5\), but \(P(\text{red} \to \text{heart})\) for material implication is \(0.75\).  
  - **Non-Propositionalist Prediction:** Assertion is warranted iff conditional probability is high; truth conditions are irrelevant.  
  - **Propositionalist Prediction:** Assertion is guided by conditional probability as a pragmatic norm, but credence in the proposition may differ (e.g., 0.75 for material implication).  

  #### 4. Verbal Disputes  
  The disagreement over the term **"proposition"** is partially verbal:  
  - **Why it is verbal:** The Non-Propositionalist uses "proposition" to mean a truth-apt entity in a Boolean algebra (per Lewis’s setup). The Propositionalist may use it more broadly (e.g., for context-dependent contents). Both agree that *if* "proposition" implies Boolean embeddability and algebra membership, Lewis’s results rule out a propositional connective satisfying Adams’ Thesis universally.  
  - **Why it is substantive:** The dispute remains because the Propositionalist insists conditionals have truth conditions *even if* non-Boolean, while the Non-Propositionalist denies truth conditions altogether.  

