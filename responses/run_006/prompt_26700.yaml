  4. **Verbal Disputes**: If any part of the dispute is merely verbal, we identify it and explain why.

  ---

  **1. Agreed Claims**

  Both parties accept the following:

  1. **Adams' Thesis (as a descriptive claim about rational credence)**: For an indicative conditional "If A, then C", the rational degree of belief in the conditional, for an agent, is the conditional probability of C given A, provided that the agent's credence in A is non-zero. That is, Cr(If A, then C) = Cr(C|A) = Cr(A ∧ C) / Cr(A), when Cr(A) > 0.

  2. **Lewis's Triviality Results**: David Lewis proved a series of results showing that, under certain assumptions, there is no proposition (expressed by the indicative conditional) that satisfies Adams' Thesis for all probability distributions. Specifically, Lewis showed that if the conditional is represented as a proposition (i.e., a set of possible worlds) in the algebra of propositions over which credence is defined, and if the probability function is such that we can condition on any proposition (closure under conditioning) and the conditional is treated as an ordinary event (i.e., it is in the same algebra), then Adams' Thesis holding for all probability distributions leads to triviality (i.e., the probability function can only have at most two values, which is absurd).

  3. **Assumptions in Lewis's Proof**: The proof assumes:
     a. The conditional "If A, then C" is a proposition and thus is a member of the same algebra of propositions as A and C.
     b. The probability function is defined over this algebra and is closed under conditioning: that is, for any proposition X with positive probability, conditioning on X (i.e., updating by conditionalization) yields a new probability function.
     c. Adams' Thesis holds for all probability distributions (or at least for a sufficiently rich class that includes all those that can be obtained by conditioning).

  4. **What the Proof Rules Out**: Lewis's results show that there is no binary connective (defining a proposition) that satisfies Adams' Thesis as a general identity for every probability function and for every pair of propositions A and C (with Cr(A)>0) in the algebra.

  5. **What the Proof Does Not Rule Out**:
     a. It does not rule out that Adams' Thesis might hold for a particular fixed probability distribution (as opposed to all distributions).
     b. It does not rule out that Adams' Thesis might hold when the conditional is not treated as a member of the same algebra (for instance, if the conditional is not a proposition at all, or if it is a proposition in a different algebra).
     c. It does not rule out that Adams' Thesis might hold approximately or in a restricted class of probability distributions.

  6. **The Central Issue**: The triviality results force a choice: either reject the idea that indicative conditionals express propositions (and thus reject that they have truth conditions) or restrict Adams' Thesis (e.g., to a particular probability function, or as a norm of assertability rather than a general credence identity).

  ---

  **2. Disagreements Table**

  We now present the core disagreements, with each row stating the issue and then each side's view in their own terms. Each side agrees that the statement under their column accurately represents their position.

  | Issue | Non-Propositionalist (Adams camp) | Propositionalist |
  |-------|-----------------------------------|-----------------|
