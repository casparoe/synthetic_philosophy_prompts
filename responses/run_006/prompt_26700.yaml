  # Adversarial Collaboration Statement: Indicative Conditionals and Lewis's Triviality

  ## 1. Agreed Claims

  We, the undersigned, agree on the following points:

  1. Adams' Thesis, as a descriptive claim about rational credence, states that for an indicative conditional "If A, then C", the rational degree of belief in the conditional is the conditional probability of C given A (provided that the credence in A is non-zero): Cr(If A, then C) = Cr(C|A).

  2. Lewis's triviality results show that, under the assumptions that:
     - The conditional is a proposition and thus a member of the same algebra of propositions as A and C;
     - The probability function is defined over this algebra and is closed under conditioning (i.e., for any proposition X with positive probability, conditioning on X yields a new probability function);
     - Adams' Thesis holds for all probability distributions (or for a sufficiently rich class that includes all those obtained by conditioning);
     then the only probability functions that satisfy these conditions are trivial (having at most two values).

  3. The triviality results rule out the possibility of a binary connective (defining a proposition) that satisfies Adams' Thesis as a general identity for every probability function and every pair of propositions A and C (with Cr(A)>0) in the algebra.

  4. The triviality results do not rule out:
     - Adams' Thesis holding for a particular fixed probability distribution;
     - Adams' Thesis holding when the conditional is not treated as a member of the same algebra;
     - Adams' Thesis holding approximately or in a restricted class of probability distributions.

  5. The triviality results force a choice: either reject that indicative conditionals express propositions (and thus reject that they have truth conditions) or restrict Adams' Thesis (e.g., to a particular probability function, or interpret it as a norm of assertability).

  ## 2. Disagreements

  We disagree on the following points, and each party endorses the statement in their respective column:

  | Issue | Non-Propositionalist (Adams camp) | Propositionalist |
  |-------|-----------------------------------|-----------------|
  | **Nature of indicative conditionals** | Indicative conditionals do not express propositions; they are not truth-apt and do not have truth conditions. | Indicative conditionals express propositions and thus have truth conditions; they are truth-apt. |
  | **Status of Adams' Thesis** | Adams' Thesis is correct without qualification: the rational credence in an indicative conditional is the corresponding conditional probability. | Adams' Thesis is either false as a general claim about credence in a conditional proposition, or it is a norm of assertability (i.e., one should assert an indicative conditional only when the conditional probability is high). |
  | **Lesson from Lewis's triviality** | Lewis's results show that indicative conditionals cannot express propositions because that would require Adams' Thesis to hold (which we take as fundamental) and that leads to triviality. Hence, to preserve Adams' Thesis, we must deny that conditionals express propositions. | Lewis's results show that Adams' Thesis cannot hold without restriction. Therefore, we must restrict Adams' Thesis (to, e.g., a norm of assertability) in order to maintain that conditionals express propositions. |
  | **Conditional propositions in the algebra** | Since conditionals do not express propositions, they are not in the algebra of propositions over which credence is defined, thus avoiding the triviality. | Conditionals are in the algebra, but Adams' Thesis does not hold for all probability distributions; it might hold for the current probability function or be a norm of assertability. |

  ## 3. Cruxes

  We identify the following cruxes. For each, we describe a concrete case that both agree bears on the issue and record each party's prediction.

  ### Crux 1: The Embedding Test

  - **Issue**: Can indicative conditionals be embedded in truth-functional contexts in a semantically coherent way that is consistent with Adams' Thesis?
  - **Case**: Consider the negation of a conditional: "It is not the case that if it rains, the match will be canceled." Also, consider a disjunction: "Either if it rains, the match will be canceled, or if it snows, the game will be postponed." We ask: do these embedded constructions have clear truth conditions? And do they behave as if they are truth-functional compounds of propositions?
  - **Non-Propositionalist Prediction**: Embedded conditionals are either unassertable, or they are interpreted in a way that does not treat the conditional as a proposition (e.g., as a conditional negation or a conditional disjunction). The embedding test will reveal that conditionals cannot be straightforwardly embedded and hence do not behave as propositions.
  - **Propositionalist Prediction**: Embedded conditionals can be given a truth-conditional interpretation (e.g., by using a suitable semantics such as the material conditional or a more complex one). The embedding test will show that conditionals can be embedded without anomaly and with a clear truth-conditional meaning.

  ### Crux 2: The Import of the Triviality Results

  - **Issue**: Can we avoid the triviality results by restricting Adams' Thesis to a fixed probability function without giving up on truth conditions?
  - **Case**: Consider an agent who initially has Cr(C|A)=0.5 for a conditional "If A then C". Now, the agent learns a new fact E that is independent of A and C but changes the conditional probability to Cr'(C|A)=0.6. If the conditional is a proposition, then its truth value is fixed. How does the agent update their credence in the conditional? Does the agent change their credence to 0.6? If so, what justifies that change without evidence about the conditional itself?
  - **Non-Propositionalist Prediction**: The agent updates their conditional probability to 0.6 without having to consider a change in the truth of the conditional (because there is no such truth). This is the natural and rational update. Hence, the case shows that the conditional is not a proposition.
  - **Propositionalist Prediction**: The agent updates their credence in the conditional proposition to 0.6. The justification is that the conditional proposition is about a relation between A and C that depends on the agent's evidence. The update is rational because the new evidence E changes the agent's assessment of the relation. The case does not force us to abandon truth conditions.

  ### Crux 3: The Norm of Assertability

  - **Issue**: Can the data supporting Adams' Thesis be explained by a norm of assertability without being a claim about the credence in a proposition?
  - **Case**: Consider a fair deck of cards. You are about to draw one. You say, "If the card is red, then it is a heart." Your conditional probability of heart given red is 1/2. Compare this to the material conditional: ~Red ∨ Heart, which has a probability of 3/4 (since the card might be black or a heart). 
  - **Non-Propositionalist Prediction**: The assertability of the conditional is 1/2, which matches the conditional probability. The material conditional account would predict 3/4, which is incorrect. Hence, the case supports the view that conditionals are not propositions (and in particular, not material conditionals).
  - **Propositionalist Prediction**: The conditional is not assertable because it is likely false (if the card is red and not a heart). However, the norm of assertability for conditionals is given by the conditional probability, so even though the credence in the proposition might be 3/4, we are not allowed to assert it when the conditional probability is 1/2. This shows that Adams' Thesis is a norm of assertability, not a credence in a proposition. Alternatively, the Propositionalist might provide a non-material truth condition that makes the conditional assertable to degree 1/2.

  ## 4. Verbal Disputes

  We note that the term "proposition" might be a source of potential verbal dispute. The Non-Propositionalist typically means by "proposition" a classical proposition (a set of possible worlds) that is embeddable in truth-functional contexts and belongs to the same algebra as non-conditional propositions. The Propositionalist might have a more flexible notion (e.g., a proposition that is context-dependent or one that is not in the same algebra). However, the core of the disagreement is substantive: the Non-Propositionalist denies that indicative conditionals have truth conditions at all (in any classical sense) and takes Adams' Thesis as fundamental, while the Propositionalist insists that they have truth conditions and that Adams' Thesis must be restricted. This is not merely verbal.

