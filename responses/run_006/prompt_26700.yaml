  | **The status of Adams' Thesis** | Adams' Thesis is correct without qualification: the rational credence in an indicative conditional just is the corresponding conditional probability. This is a fundamental fact about the meaning of indicative conditionals and must be preserved. | Adams' Thesis is not strictly true as a claim about the credence in a proposition. Instead, it is either false (because the credence in the conditional proposition is not always the conditional probability) or it is a norm of assertability (i.e., one should only assert an indicative conditional when one's conditional probability of C given A is high). |
  | **The lesson from Lewis's triviality** | Lewis's results show that indicative conditionals cannot express propositions because if they did, they would have to satisfy Adams' Thesis (which they take as non-negotiable) and that leads to triviality. Hence, the only way to preserve Adams' Thesis is to deny that conditionals express propositions. | Lewis's results show that Adams' Thesis cannot hold without restriction. Therefore, if we want to maintain that conditionals express propositions (which we do), we must reject Adams' Thesis as a general identity for credences and instead explain it as a norm of assertability. The triviality results are a primary reason to reject Adams' Thesis as a claim about credence. |
