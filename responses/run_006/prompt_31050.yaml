  walk me through what Xunzi's best counterargument to the baby-lab evidence would look like. and also, flip it: are there findings from modern developmental psych or behavioral economics that would actually make Mencius sweat — stuff that fits Xunzi's picture better than his? i want to know if the empirical scorecard is really as lopsided as it first seems.
