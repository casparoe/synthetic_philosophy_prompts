prompt: |-
  I teach an intro philosophy elective to about 30 high school juniors, 90-minute block. We're hitting paradoxes next week and I want them to actually live through the surprise exam paradox rather than just hear me describe it and then watch them pretend to be confused for five minutes before someone checks their phone under the desk.

  Here's what I'm thinking: I set up a situation where something surprising is supposed to happen on one of several days, they can reason about it, and the reasoning leads them to conclude it can't happen — and then it does. The thing that happens has to have real stakes (not a grade, but something they actually care about) so the logic bites. Candy, a homework pass, first out the door for lunch, whatever.

  The tricky part is that I can't just announce "today we're doing the surprise exam paradox" or the whole thing is spoiled. They need to think they're doing something else, or that the announcement is genuine, and the paradox needs to emerge from their own reasoning. I also need to handle the kid who's heard of it before and blurts out the answer — ideally the structure makes that not matter.

  Give me the activity as exactly five phases, each described in a sentence or two, with no introduction or conclusion. The fifth phase should be the debrief: what questions I ask, what connections I make explicit, and what the predictable student objections are going to be and how to handle them. Also tell me honestly whether the whole thing falls apart if one kid has already heard of the paradox — and if so, what I do about it.
reasoning: |-
  We are designing an activity to simulate the surprise exam paradox for high school students. The paradox: a teacher announces a surprise exam next week (Mon-Fri). Students reason that it can't be Friday because if it hasn't happened by Thursday, they'd expect it Friday and it wouldn't be a surprise. Then they rule out Thursday, and so on, concluding no exam can be a surprise. But then the teacher gives it on Wednesday and it is a surprise.

  We need:
  - Real stakes (candy, homework pass, etc.)
  - The announcement must seem genuine and not part of a lesson on paradoxes.
  - The paradox must emerge from their reasoning.
  - Five phases.

  Here's a plan:

  Phase 1: The Setup
  I announce that sometime this week (Mon-Fri) I will give a "special bonus opportunity" (e.g., a chance to win candy for everyone who is present when I announce it) and that the key feature is that it will be a surprise — they won't know which day until it happens.

  Phase 2: The Reasoning
  On Monday, after the announcement, I facilitate a discussion: "How might you figure out when it will be? Could it be Friday?" Guide them to see that if it hasn't happened by Thursday, then on Friday they would expect it, so it wouldn't be a surprise. Then, if Friday is ruled out, then by Thursday if it hasn't happened by Wednesday, they'd expect it on Thursday — so Thursday is ruled out, and so on.

  Phase 3: The Event
  On Wednesday (or another day that isn't Friday, and preferably not Monday to avoid them thinking it's too early) I actually give the bonus opportunity (e.g., a quick candy quiz or just handing out candy to everyone present). The key is that they are surprised because they had ruled out Wednesday by the reasoning.

  Phase 4: The Reveal
  Immediately after the event, I reveal that what just happened was a demonstration of a famous paradox. I explain that they had collectively reasoned that the event couldn't happen on any day, and yet it did.

  Phase 5: The Debrief
  I ask: 
  - "Why were you surprised today even though you knew it would happen this week?" 
  - "How did we rule out each day? What was wrong with that reasoning?" 
  - "What does this say about knowledge and prediction?" 
  - "Can we ever truly be surprised if we think through all possibilities?"

  Predictable objections:
  - "But if we hadn't done the reasoning, we wouldn't have been surprised on Wednesday." 
    Response: Exactly, so the reasoning itself created the conditions for surprise? But note that without the reasoning, they might have expected it any day. The paradox arises because of the reasoning.

  - "It wasn't a surprise because I thought it might be today." 
    Response: But the reasoning led us to rule out Wednesday? (Remind them of the step-by-step elimination.) Maybe the surprise is relative to the reasoning? 

  - "What if we just didn't rule out any day?" 
    Response: Then the event wouldn't be a surprise? But the teacher said it would be a surprise. The paradox is that the teacher's announcement seems to make the event impossible, yet it happens.

  Handling a student who knows the paradox:
  We must prevent them from spoiling. One way: In the announcement, make the event specific to this class and the week. Also, during the reasoning phase, if a student says "it's a paradox, you can't have it", I can say: "That's an interesting idea, but let's see if we can figure out why that might be." Then proceed with the reasoning. The event happening anyway will still be a surprise to most, and the debrief will reveal the paradox. If a student blurts out the whole thing, I can say: "Well, let's test that theory. We'll see what happens this week." And then when it happens, it demonstrates that even if you know the paradox, the event can still be a surprise.

  But note: if a student says "it can't happen" and then it does, that still works. The activity is robust because the event happening is the key.

  However, if too many know it, the surprise might be less. But in an intro class, likely few have heard of it.

  Revised plan to avoid Monday: We do the announcement on Monday, but the event won't be Monday. So:

  Phase 1 (Monday): Announce the bonus opportunity: "Sometime this week, I will give you a chance to earn [reward]. It will be a surprise — you won't know until the moment I announce it in class. It will happen during our regular class time on one day: Monday, Tuesday, Wednesday, Thursday, or Friday."

  Phase 2 (Monday, after announcement): Lead the reasoning. Start by asking: "Can the surprise happen on Friday?" ... and so on. They will rule out Friday, then Thursday, then Wednesday, then Tuesday, then Monday? But note: if we do the reasoning on Monday, they might rule out Monday because if it were Monday, they would expect it on Monday? But wait, on Monday they don't have any prior days without the event. So the reasoning for Monday: if it hasn't happened by Sunday (which it hasn't) then they would expect it Monday? But that's not how the week starts. The standard reasoning starts from the last day.

  So let's adjust: the reasoning should be done at the beginning of each day? But we can't do that for every day. Instead, we do the reasoning on Monday for the whole week. The standard paradox says the exam can't be on Friday, then Thursday, etc., and then it can't be on Monday because if it were Monday, then on Monday morning they would expect it? But that seems weak. Alternatively, we can do the reasoning on Monday and they rule out Friday, then Thursday, then Wednesday, then Tuesday, and then they think it must be Monday? But then if it doesn't happen Monday, they are surprised? And then on Tuesday, they rule out Friday, Thursday, Wednesday, and then Tuesday (because if it hasn't happened by Monday, they would expect it Tuesday) — so then they think it must be Monday? But Monday is gone. So they are surprised when it happens Tuesday.

  But note: if we do the event on Tuesday, then on Monday they haven't ruled out Monday, so they might have been expecting it Monday. Then on Tuesday, they might think: "It didn't happen Monday, so it must be today or later. But we ruled out Friday, Thursday, Wednesday? So it must be Tuesday? Then it's not a surprise." So if we do it Tuesday, it might not be a surprise if they are following the reasoning.

  Alternatively, if we do it on Wednesday, then on Tuesday they think: it must be Tuesday because the other days are ruled out? Then when it doesn't happen Tuesday, they are surprised? Then on Wednesday, they think: it must be today? So they expect it? Then it's not a surprise.

  This is the core of the paradox: the reasoning seems to rule out every day, so they don't expect it on any day? But then when it happens, they are surprised.

  But in practice, if they do the reasoning and rule out all days, then they don't expect it on any day? So it is a surprise when it happens? That's the resolution: the reasoning is flawed because it assumes that the students will be certain about the exam on the last possible day, but in reality they are not certain until the day arrives.

  So let's design:

  Phase 1 (Monday): Announce the surprise bonus opportunity for this week (Mon-Fri). Explain that it will be a surprise: they won't know until it happens.

  Phase 2 (Monday): Facilitate the reasoning. Start by asking: "Can the surprise happen on Friday? Why or why not?" Guide to: If it hasn't happened by Thursday, then on Friday they would expect it, so it wouldn't be a surprise. Therefore, it cannot be on Friday. Then: "So if it can't be on Friday, then can it be on Thursday?" Guide: If it hasn't happened by Wednesday, then they know it must be Thursday (since Friday is ruled out) so they would expect it on Thursday, so it wouldn't be a surprise. Therefore, it cannot be on Thursday. Continue: then Wednesday? If it hasn't happened by Tuesday, then they know it must be Wednesday (since Thursday and Friday are ruled out) so they would expect it Wednesday -> not a surprise. Therefore, not Wednesday. Then Tuesday: if it hasn't happened by Monday, then they know it must be Tuesday (since Wed, Thu, Fri are ruled out) so they expect it Tuesday -> not a surprise. Then Monday: they know it must be Monday? So they expect it Monday -> not a surprise. Conclusion: it can't happen at all? But wait, the teacher said it would. So what's wrong?

  Phase 3: The event. I choose a day that is not Monday (so they have at least one day without the event) and not Friday (to avoid the last day). Let's pick Wednesday. On Wednesday, at the start of class, I say: "Okay, today is the day for the bonus opportunity." And then I do it (e.g., a quick question to answer for candy, or just hand out candy to everyone). The point is, they are surprised because by the reasoning, Wednesday was ruled out.

  Phase 4: The reveal. "You might be wondering why I did this today. Remember our reasoning? We thought it couldn't happen on any day, but here it is on Wednesday. And were you surprised? [They say yes.] So how did that happen? This is actually a famous paradox called the surprise exam paradox."

  Phase 5: Debrief. Questions:
  - "Why were you surprised today even though you knew it would happen this week?" 
  - "How did we rule out Wednesday? What was the flaw in that reasoning?" 
  - "Did anyone think it might happen today? Why or why not?" 
  - "What does this tell us about our ability to predict the future with certainty?"

  Objections and responses:
  - "I wasn't surprised because I thought it might be today." 
    Response: "But did you expect it for sure? The reasoning said it couldn't be a surprise on any day, but it was. And note, many of you were surprised."

  - "But if we do the same thing again, we won't be surprised." 
    Response: "Exactly, which shows that the surprise depends on your state of knowledge. The paradox arises because the announcement seems to make the event impossible, but in reality, the event can still be a surprise because the reasoning was flawed: we assumed that on the previous day we would be certain, but in fact we weren't."

  - "The reasoning was wrong because we didn't actually rule out Wednesday: we only ruled it out if it hadn't happened by Tuesday. But it did happen on Wednesday, so that condition wasn't met." 
    Response: "Exactly! The reasoning relies on a chain of conditionals that break when the event happens. In reality, we are never certain until the last moment because we know the reasoning might be flawed, or we forget, or we just don't feel certain."

  Handling prior knowledge:
  If a student says on Monday: "I know this, it's a paradox, it can't happen" — I can say: "Well, let's see. Maybe we'll get to the bottom of this by the end of the week." Then when it happens, that student is still surprised? Maybe not, but the rest are. And in the debrief, we can discuss: "Even if you had heard of the paradox, were you still surprised? Why?" 

  Alternatively, if a student tries to explain the whole thing, I can say: "That's an interesting theory, but we are going to test it this week. Let's see what happens." And then proceed. The event happening on a day that isn't the last day will still be a surprise to many because they might not have expected it that day.

  But note: the student who knows might not be surprised. That's okay. The point is to show the paradox to the majority.

  So the five phases:

  Phase 1: On Monday, announce a surprise bonus opportunity (e.g., candy for all present) to occur on one day this week (Mon-Fri) during class, with the defining feature that it will be a surprise.

  Phase 2: Immediately after the announcement, lead a class discussion to logically deduce that the event cannot occur on any day (by starting with Friday and working backwards).

  Phase 3: On Wednesday (or another middle day), at the start of class, conduct the bonus opportunity, ensuring it is a surprise.

  Phase 4: After distributing the reward, reveal that this was a demonstration of a famous paradox and that the class's reasoning had led them to believe the event was impossible.

  Phase 5: Debrief by asking: 
  - Why were you surprised today? 
  - How did our reasoning rule out Wednesday? 
  - What flaw did we discover in our reasoning? 
  - What does this teach us about prediction and certainty? 
  Address objections: 
  - If a student claims they weren't surprised, note that the reasoning doesn't eliminate the possibility entirely because we don't have 100% certainty until the event happens. 
  - If a student points out the conditionals weren't met, explain that the chain of reasoning breaks in practice because we never reach the state of absolute certainty required to make the next step.

  The activity should work even if one or two students have heard of it because the event still happens and the reasoning is still done collectively. The surprise element may be less for those students, but the debrief will still be valuable.
answer: |-
  ### Phase 1: Announcement  
  On Monday, casually announce: "This week, I’ll randomly give a real reward—like a homework pass or candy—to everyone present during one class session, but only if you’re genuinely surprised when it happens; if you predict the day right, no reward."  

  ### Phase 2: Guided Elimination  
  On Monday or Tuesday, prompt: "Let’s strategize—could the reward be Friday? Why/why not?" Steer discussion to eliminate Friday (if not given by Thursday, you’d expect it Friday → not a surprise), then Thursday (using the same logic), then Wednesday, until all days seem impossible.  

  ### Phase 3: The Event  
  On Wednesday (mid-week to avoid predictability), abruptly interrupt class with: "Reward time! Answer one easy question for candy/passes," ensuring it feels spontaneous and stakes are immediate (e.g., "30 seconds to respond—no overthinking!").  

  ### Phase 4: Paradox Reveal  
  After distributing rewards, confess: "This was a trap—you just experienced the surprise exam paradox. Your reasoning said this couldn’t happen today, but it did, and you were still surprised."  

  ### Phase 5: Structured Debrief  
  **Questions:**  
  - "Why were you shocked today despite 'knowing' it’d happen this week?"  
  - "Where did our elimination argument fail?"  
  - "How does this challenge the idea that logic always predicts reality?"  
  **Predictable Objections & Responses:**  
  - *"I wasn’t surprised—I suspected Wednesday!"* → "But did you *expect* it? Suspicion ≠ certainty; the paradox requires absolute prediction."  
  - *"The reward wasn’t fair—you tricked us!"* → "Exactly! The trick reveals how self-defeating logic can create false certainty."  
  - *"If we’d ignored reasoning, we’d be surprised anyway."* → "True! Does that mean overthinking destroys surprise? Or that ‘surprise’ is subjective?"  
  **Prior-Knowledge Risk:**  
  - **Does it fall apart?** Partially—one informed kid might spoil the reasoning (e.g., "It’s a paradox, so it’ll happen anyway!").  
  - **Fix:** Preempt by saying: "If you’ve heard of something like this, play along—focus on why the logic *feels* inescapable." If they blurt, pivot: "Great—now prove your theory by convincing peers it’s impossible… then we’ll see if the reward surprises *them*." The event’s tangible stakes (e.g., missing candy) keep engagement high even if logic is "solved."
