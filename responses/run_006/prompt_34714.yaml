  This revision: we amend (1) to say that the mechanism is defined relative to a set of causal features (or a high-level model that captures these features). Then, (4) can be maintained because for a given set of features, there is a fact of the matter. But then we have to say that the set of features is part of the mechanism description. And (5) becomes an example: if two networks use different sets of features, then they are different mechanisms (at the feature level). But note: we can have two networks that use the same features but with different internal architectures? Then at the feature level, they are the same. And (2) is satisfied.

