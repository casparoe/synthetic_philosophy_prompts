    - It does **not** prove time is an "illusion" in any metaphysical sense. Our universe (expanding, low rotation) likely lacks CTCs.  
  - **Key caveat**: Gödel's argument is about *global causal structure* in a *particular solution* of GR—not time "full stop." It highlights GR's formal possibilities, not empirical realities.

