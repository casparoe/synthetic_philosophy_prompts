prompt: |-
  Ok here's something I've been thinking about for my teaching. I teach a course on practical rationality and decision theory, and every year I do the money pump unit -- you know the drill, if your preferences are intransitive (A > B > C > A) then a clever trader can extract an infinite amount of money from you through a series of trades, each of which you'll accept because you prefer the offered option to what you currently hold. The students get the abstract point fine. But I've become convinced that actually applying this to real life is harder then it looks, because most of us don't walk around with explicit preference orderings in our heads, and the contexts where we get money-pumped aren't helpfully labeled as such.

  So here's what I want: a procedure that a non-specialist can actually use to audit their own preferences for money-pump vulnerability. This is something I'd give to my students as a take-home exercise -- spend twenty minutes, run through the steps, see if you're vulnerable. It should be a checklist or a set of diagnostic questions that surfaces the kind of intransitivities that actually show up in real decision-making, like when you prefer A to B on one criterion, B to C on another, and then C to A because the criteria shift again without you noticing.

  The procedure needs to handle some hard cases. It should flag when the procedure itself will give a false positive -- preferences that look intransitive but aren't because the options aren't really comparable or the decision context changed in a relevant way. It should also flag the vulnerabilities it won't catch (false negatives). And it should be honest about which steps are judgment calls dressed up as procedure and which are genuinely mechanical.

  Then run it on two or three worked examples: one where the procedure catches a genuine vulnerability, one where it flags something that turns out fine on closer inspection, and one where the procedure can't decide and you have to punt to the person.
reasoning: |-
  We are designing a procedure to audit one's preferences for money-pump vulnerability. The key challenge is that real-life preferences are often implicit and context-dependent. The procedure should help identify intransitive cycles that could lead to being money-pumped, while being aware of false positives (due to non-comparable options or changing contexts) and false negatives.

   Procedure Outline:

   1. **Identify a Set of Related Options**: 
      - The user should think of a domain (e.g., choosing an apartment, a phone plan, a job) and list a set of options (A, B, C, ...) that are relevant and comparable in that domain.

   2. **Define the Criteria**:
      - List the criteria (e.g., price, quality, location) that matter in this domain.
      - For each criterion, note whether it is a primary criterion (one that is always considered and might be used to break ties) or a secondary criterion (used only when primary criteria are tied, or in specific contexts).

   3. **Establish Preference for Each Pair on Each Criterion**:
      - For each pair of options (A vs B, B vs C, A vs C, etc.), determine the preference on each criterion independently. This step is mechanical: for each criterion, which option is better?
      - Example: For price, lower is better; for quality, higher is better.

   4. **Identify Contexts or Frames**:
      - Consider if there are different contexts or frames in which the decision might be made. For example, when in a hurry, one might prioritize speed; when with family, comfort might be key. The user should note any such contexts.

   5. **Check for Intransitivities within a Fixed Context**:
      - For a fixed context (i.e., fixed set of criteria weights and fixed frame), try to form a preference ordering. This step requires judgment because the user must decide how to weigh criteria in that context.
      - How to do it: 
          a. For a given context, assign weights to criteria (even roughly: high, medium, low).
          b. For each pair of options, decide the overall preference by comparing the criteria. If one option is better on all criteria, it's dominant. Otherwise, the user must judge which criteria are more important in that context and decide the overall preference.
          c. Check for cycles: If A>B, B>C, and C>A in the same context, then there's an intransitivity.

   6. **Flag Possible False Positives**:
      - If a cycle is found, check:
          - Are the options truly comparable? (e.g., comparing a car and a bicycle for commuting might not be comparable if the context requires carrying heavy equipment.)
          - Did the context change during the pairwise comparisons? (e.g., when comparing A and B you were in a hurry, but when comparing B and C you had time to think, and then for C and A you were in a different mood.) If the context changed, then the intransitivity might be due to that and not a true preference cycle in a fixed context.

   7. **Acknowledge False Negatives**:
      - The procedure cannot catch cycles that involve more than three options (though we focus on triples because they are the most common and illustrative).
      - It might miss cycles that occur only in contexts the user did not consider.
      - It might miss cycles because the user did not list all relevant options or criteria.

   8. **Limitations and Judgment**:
      - Steps 4 and 5 are judgment calls: identifying contexts and assigning weights.
      - Steps 1 and 2 are also somewhat judgment-based (what options and criteria to include).
      - The mechanical steps are 3 (pairwise on each criterion) and the cycle check in 5c.

   Worked Examples:

   Example 1: Genuine Vulnerability (Catches a cycle)

     Domain: Choosing a laptop.
     Options: 
       A: High performance, heavy, expensive.
       B: Medium performance, medium weight, medium price.
       C: Low performance, light, cheap.

     Criteria: 
       Performance (higher better), Portability (lighter better), Price (lower better).

     Context: Fixed context of a student who needs to carry the laptop around but also run heavy software.

     Step 3 (mechanical):
       A vs B: A better on performance, B better on portability and price.
       B vs C: B better on performance and portability, C better on price.
       A vs C: A better on performance, C better on portability and price.

     Step 5: In the fixed context, the student assigns weights: Performance (high), Portability (medium), Price (medium). 
       - A vs B: Performance is the most important, so A>B.
       - B vs C: Performance and portability are both better for B, so B>C.
       - A vs C: Now, A is better on performance (most important) but C is better on portability and price. The student realizes that the weight of performance is high, but the gap in portability and price is large enough that they actually prefer C to A. So C>A.

     Cycle: A>B, B>C, C>A. This is an intransitivity.

     Step 6: Check for false positive: 
       - Options are comparable (all laptops).
       - Context did not change.

     Conclusion: Genuine vulnerability.

   Example 2: False Positive Flagged (Cycle due to context shift)

     Domain: Choosing a restaurant for dinner.
     Options:
       A: Fancy, expensive, long wait.
       B: Casual, moderate price, moderate wait.
       C: Fast food, cheap, no wait.

     Criteria: Ambiance, Price, Wait time.

     Without specifying context, we might get:
       Step 3 (mechanical):
          A vs B: A better ambiance, B better price and wait.
          B vs C: B better ambiance, C better price and wait.
          A vs C: A better ambiance, C better price and wait.

     Now, if we try to assign weights without context, we might get inconsistent preferences.

     Step 4: Contexts matter:
       - Context 1: Celebrating an anniversary (weight ambiance high).
          A>B (because ambiance is most important), B>C (same reasoning), and A>C (so no cycle: A>B>C).
       - Context 2: Quick lunch break (weight wait time and price high).
          In this context: C>B (because of wait and price), B>A (same), and C>A (so C>B>A).

     But what if the user does not fix context and tries to have a universal preference? They might say:
        "In general, I prefer ambiance when I can afford it, but sometimes I don't care."

     Step 5: Without context, the user might report:
          A>B (thinking of a celebration), B>C (again in celebration mood? but wait, in celebration they would prefer B to C? yes, because ambiance is still better in B than C) and then C>A (thinking of a quick lunch: C is better than A on price and wait). 

     Now we have a cycle: A>B, B>C, C>A.

     Step 6: Flag possible context shift. The cycle disappears when we fix the context.

     Conclusion: False positive due to context shift.

   Example 3: Inconclusive (Requires human judgment)

     Domain: Choosing a job.
     Options:
       A: High salary, long commute, stressful.
       B: Medium salary, medium commute, medium stress.
       C: Low salary, short commute, low stress.

     Criteria: Salary (higher better), Commute (shorter better), Stress (lower better).

     Context: Fixed context of a person in their 30s, career-oriented but also values work-life balance.

     Step 3 (mechanical):
       A vs B: A better salary, B better commute and stress.
       B vs C: B better salary, C better commute and stress.
       A vs C: A better salary, C better commute and stress.

     Step 5: Assign weights. The user is conflicted. They assign high weight to salary and also to stress. 
          - A vs B: They feel that the extra salary in A is worth the longer commute and higher stress? Maybe A>B.
          - B vs C: Similarly, the extra salary in B is worth the longer commute and higher stress? B>C.
          - A vs C: Now, the gap between A and C in salary is huge, but the commute and stress in C are much better. They are unsure: is the high salary worth the long commute and high stress? They might prefer C to A because they value work-life balance more than they thought? Or they might prefer A to C because the salary difference is too big.

     The user cannot decide between A and C. Without a clear preference between A and C, we cannot form a cycle.

     Step 7: This procedure cannot force a decision. The user must reflect and make a judgment. If they end up with C>A, then we have a cycle (A>B, B>C, C>A). If they decide A>C, then A>B>C and no cycle.

     Conclusion: The procedure flags this as requiring further judgment. The user must decide their preference between A and C in the fixed context.

   Putting it together: The Procedure Checklist

   Step 1: Pick a domain and list at least 3 options (A, B, C, ...). [Judgment]

   Step 2: List the criteria that matter. [Judgment]

   Step 3: For each pair of options and for each criterion, note which option is better (mechanical).

   Step 4: Identify one or more decision contexts that might affect the weights of criteria. [Judgment]

   Step 5: For a fixed context (pick one context at a time):
     a. Assign weights to criteria (high, medium, low). [Judgment]
     b. For each pair of options, determine the overall preference by combining the criteria (using the weights). [Judgment]
     c. Check for cycles: Look at the preferences for A vs B, B vs C, A vs C. If you have a cycle (A>B, B>C, C>A) then note it.

   Step 6: For each cycle found in Step 5c, check:
     - Are the options truly comparable? (e.g., are they all viable in the same situation?) [Judgment]
     - Was the context held fixed? (if not, then the cycle might be due to context shift and not a true intransitivity) [Judgment]
     - If both are true, then you have a genuine vulnerability.

   Step 7: Acknowledge limitations (false negatives):
     - The procedure only checks triples. You might have a cycle over more options that you didn't check.
     - You might have missed a context where a cycle occurs.
     - You might have missed an option or a criterion.

   Finally, the user should be told that Steps 1, 2, 4, 5a, 5b, 6 are judgment calls, and Step 3 and 5c are mechanical.

   This procedure is designed for a 20-minute exercise. The user should focus on one domain and one context at a time.
answer: |-
  Below is a practical, step-by-step procedure for auditing personal preferences for money-pump vulnerability. It's designed as a checklist for non-specialists, with clear distinctions between judgment-based steps and mechanical checks. The procedure includes safeguards against false positives (seeming intransitivities that aren't real) and flags its limitations (false negatives). I'll follow this with three worked examples.

  ---

  ### **Preference Audit Procedure for Money-Pump Vulnerability**  
  *Time: ~20 minutes*  

  #### **Step 1: Define Your Decision Domain**  
  *(Judgment call)*  
  - **Task:** Pick a specific area of life (e.g., "choosing a laptop," "weekend plans," "career moves").  
  - **Why:** Real-world intransitivities are domain-specific.  
  - **Red Flag:** Avoid overly broad domains (e.g., "life choices").  

  #### **Step 2: List Concrete Options**  
  *(Judgment call)*  
  - **Task:** Identify 3–5 tangible options (A, B, C, ...). Use real examples (e.g., "Job A: $80K salary, 1-hour commute" vs. "Job B: $70K, 15-minute commute").  
  - **Safeguard:** Exclude options that aren't mutually substitutable (e.g., "apples" vs. "mortgage rates" → incomparable).  

  #### **Step 3: Identify Decision Criteria**  
  *(Judgment call)*  
  - **Task:** List 2–4 criteria influencing your preference (e.g., cost, time, quality).  
  - **Critical Step:** Note if criteria are *context-dependent* (e.g., "I value cost when money is tight, but quality when it's not").  

  #### **Step 4: Map Pairwise Preferences**  
  *(Mechanical)*  
  - **Task:** For every pair (A vs. B, B vs. C, A vs. C), ask:  
    *"If I could only choose between THESE TWO right now, which would I pick? Why?"*  
  - **Record:** Preferences + the **dominant criterion** for each choice (e.g., "A > B on quality," "B > C on cost").  
  - **Requirement:** Assume identical contexts (same time, mood, constraints).  

  #### **Step 5: Check for Cycles**  
  *(Mechanical)*  
  - **Task:** Review pairwise results for cycles (A > B > C > A).  
  - **Tool:** Sketch a preference diagram (arrows between options).  
  - **If no cycle → Low risk.** Proceed to Step 6.  
  - **If cycle → Flag vulnerability.** Proceed to Step 6.  

  #### **Step 6: Audit for False Positives**  
  *(Judgment call)*  
  For any cycle found in Step 5, ask:  
  1. **"Are all options comparable?"**  
     - *Yes:* Proceed.  
     - *No* (e.g., options serve different needs) → **False positive likely**. Cycle invalid.  
  2. **"Did my decision context change?"**  
     - Check if the *dominant criterion* shifted between pairs (e.g., "A > B used 'price,' but C > A used 'convenience'").  
     - *No shift* → Cycle **may be genuine**.  
     - *Shift occurred* → **False positive likely**. Context-dependence explains the cycle.  

  #### **Step 7: Acknowledge False Negatives**  
  *(Limitations)*  
  The procedure **WON'T catch**:  
  - **Multi-option cycles** (e.g., A > B > C > D > A).  
  - **Hidden criteria** (e.g., unstated emotional biases).  
  - **Dynamic contexts** (e.g., preferences changing mid-cycle due to fatigue).  
  - **Probabilistic choices** (e.g., "I prefer A 60% of the time, B 40%").  

  #### **Final Output**  
  - **Vulnerable:** Genuine 3-option cycle with fixed context/comparability.  
  - **Not Vulnerable:** No cycle, or cycle explained by context/criteria shift.  
  - **Inconclusive:** Ambiguous comparability/context (requires deeper reflection).  

  ---

  ### **Worked Examples**  

  #### **Example 1: Genuine Vulnerability (Caught)**  
  **Domain:** Choosing a coffee brand.  
  **Options:**  
  - A: Fancy local brand ($12/lb, eco-friendly).  
  - B: Mid-tier brand ($8/lb, decent quality).  
  - C: Cheap brand ($5/lb, poor taste).  

  **Procedure:**  
  1. **Step 3 Criteria:** Cost (primary), Quality (primary), Ethics (secondary).  
  2. **Step 4 Pairwise Preferences** (fixed context: "morning coffee"):  
     - A vs. B: **A > B** (dominant: *quality*).  
     - B vs. C: **B > C** (dominant: *quality*).  
     - C vs. A: **C > A** (dominant: *cost*).  
  3. **Step 5:** Cycle detected (A > B > C > A).  
  4. **Step 6 Audit:**  
     - *Comparable?* Yes (all coffee brands).  
     - *Context shift?* Yes! C > A used *cost*, but A > B and B > C used *quality*.  
     - **False Positive?** No! Context was fixed ("morning coffee"), yet criteria *inconsistently applied* (ignored ethics in C vs. A). **Genuine vulnerability.**  
  **Conclusion:** Money-pump risk (e.g., buy A → trade to C for savings → trade back to A for quality).  

  ---

  #### **Example 2: False Positive (Caught and Dismissed)**  
  **Domain:** Weekend activity.  
  **Options:**  
  - A: Hiking (free, exhausting).  
  - B: Movie ($15, relaxing).  
  - C: Fancy dinner ($50, indulgent).  

  **Procedure:**  
  1. **Step 3 Criteria:** Cost (primary if budget tight), Enjoyment (primary if rested).  
  2. **Step 4 Pairwise Preferences:**  
     - A vs. B: **A > B** (dominant: *cost*; context: "tight budget").  
     - B vs. C: **B > C** (dominant: *cost*; context: "tight budget").  
     - C vs. A: **C > A** (dominant: *enjoyment*; context: "payday, want fun").  
  3. **Step 5:** Cycle detected (A > B > C > A).  
  4. **Step 6 Audit:**  
     - *Comparable?* Yes (all leisure activities).  
     - *Context shift?* **Yes!** A > B/B > C used *cost* during "tight budget," but C > A used *enjoyment* during "payday."  
     - **False Positive:** Cycle due to legitimate context change. No vulnerability.  
  **Conclusion:** Safe! (Cycle reflects rational shifting priorities, not intransitivity).  

  ---

  #### **Example 3: Inconclusive (Requires Human Judgment)**  
  **Domain:** Apartment rental.  
  **Options:**  
  - A: Downtown loft ($2K, noisy, 5-min commute).  
  - B: Suburban house ($1.5K, quiet, 30-min commute).  
  - C: Midtown condo ($1.8K, moderate noise, 15-min commute).  

  **Procedure:**  
  1. **Step 3 Criteria:** Commute time (primary), Cost (primary), Noise (secondary).  
  2. **Step 4 Pairwise Preferences** (fixed context: "workweek priority"):  
     - A vs. B: **A > B** (dominant: *commute*).  
     - B vs. C: **B > C** (dominant: *cost*).  
     - C vs. A: **?? Inconclusive.** *Equal cost/commute? Noise breaks tie?*  
  3. **Step 5:** No clear cycle (C vs. A undefined).  
  4. **Step 6:** N/A (no cycle).  
  **Stuck at Step 4:** C vs. A depends on tie-breaking:  
  - If noise dominates, **C > A** → Cycle (A > B > C > A).  
  - If commute dominates, **A > C** → No cycle (A > B > C, but A > C).  
  **Conclusion:** **Inconclusive.** User must resolve C vs. A with deeper reflection.  

  ---

  ### **Key Takeaways for Students**  
  - **Money pumps thrive on inconsistent criteria application**, not just abstract intransitivity.  
  - **Real vulnerabilities** arise when:  
    - Your criteria shift *without contextual justification*.  
    - You ignore hidden trade-offs (e.g., "saving money now" vs. "regretting quality later").  
  - **The procedure won't save you** if you skip hard judgments (Step 6) or ignore dynamic contexts.  
  - **Homework:** Run this on 1–2 personal decisions. Report: vulnerability found, false positive caught, or judgment punt.
