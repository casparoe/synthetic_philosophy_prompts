  Next, the user asks what this preservation licenses for structural realism. They mention constructive empiricism, so I should contrast the two. Structural realism argues that the mathematical structure is what's real and persists through theory changes. Constructive empiricism, per van Fraassen, says we should only believe what's observable. The survival of Fresnel's equations supports structural realism by showing that the structure is preserved even when ontology isn't. But does it fully counter constructive empiricism? Maybe not, since an empiricist could say the equations are just tools for prediction. The realist needs to argue that structure explains why theories are successful.

