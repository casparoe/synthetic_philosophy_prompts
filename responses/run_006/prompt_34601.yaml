answer: |-
  Alright, let's dissect the Fresnel-to-Maxwell case like a proper philosophy of science autopsy. You're right to feel the literature often glosses over the gritty details – this is where the real philosophical action is. Buckle up.

  **1. What Was Preserved? The Nitty-Gritty:**

  *   **The Equations Themselves (The Coefficients):** This is the core claim, and **it holds up remarkably well, mathematically speaking.** The specific equations Fresnel derived for the *amplitudes* of the reflected and refracted light waves at an interface between two transparent media **are mathematically identical in form to those derived from Maxwell's equations under the same conditions.**
      *   **Fresnel (1821/1823):** Derived expressions for the amplitude reflection (`r_s`, `r_p`) and transmission (`t_s`, `t_p`) coefficients for light waves (transverse vibrations in the elastic solid ether) at a dielectric interface. His derivation relied on continuity conditions for the displacement and its derivative/stress at the boundary, assuming specific mechanical properties for the ether.
      *   **Maxwell (1860s/1870s):** Derived expressions for the amplitude reflection (`r_s`, `r_p`) and transmission (`t_s`, `t_p`) coefficients for electromagnetic waves at a dielectric interface. His derivation relied on continuity conditions for the tangential components of the electric (`E`) and magnetic (`H`) fields at the boundary, following directly from his EM theory.
      *   **The Result:** The final functional forms for `r_s`, `r_p`, `t_s`, `t_p` as functions of the angle of incidence (`θ_i`), the angle of refraction (`θ_t`), and the refractive indices (`n_1`, `n_2`) **are identical in both cases.** For example, the formula for the reflection coefficient for s-polarized light:
          `r_s = (n_1 cos θ_i - n_2 cos θ_t) / (n_1 cos θ_i + n_2 cos θ_t)`
          ...is the same equation derived from both theories. *(Confidence: Very High - This is mathematically demonstrable and uncontroversial in optics/physics.)*
  *   **The Phenomenological Predictions:** Crucially, these identical equations yield identical predictions for observable phenomena: the intensities and polarization states of reflected and refracted light under various conditions (Brewster's angle, total internal reflection, etc.). This predictive success is the empirical anchor of the case. *(Confidence: Very High)*
  *   **The Role of the Refractive Index (`n`):** While `n` was interpreted *differently* (ether density ratio for Fresnel, `√(εμ)` for Maxwell), its functional role *within the equations describing reflection/refraction* is preserved. It remains the key parameter characterizing the optical properties of the medium. *(Confidence: High)*
  *   **The Wave Structure:** Both theories describe light as a transverse wave phenomenon propagating through space (though the nature of the "wave" and the "space" differ radically). The core wave equation form (`∂²u/∂t² = v² ∇²u`) is analogous, though the `u` and `v` have different interpretations (mechanical displacement vs. EM field components; elastic constant-derived speed vs. `1/√(εμ)`). *(Confidence: Medium-High - The wave aspect is fundamental to both, but the *type* of wave equation and its derivation diverge significantly.)*

  **2. What Was *Not* Preserved? The Ontological Wreckage:**

  *   **The Ontology (The "Stuff"):** This is the most dramatic shift.
      *   **Fresnel:** Light is a *mechanical vibration* in an all-pervading, solid-but-strangely-able-to-transmit-waves-without-resistance **luminiferous ether**. The ether has complex, anisotropic mechanical properties (elastic constants) that vary with media. The wave is a displacement *of* this ether.
      *   **Maxwell:** Light is a self-propagating *coupled oscillation* of **electric and magnetic fields (`E` and `B/H`)**. **There is no mechanical ether.** Fields are fundamental entities existing in vacuum. The wave is the oscillation *of the fields themselves*. Propagation speed is determined by electromagnetic properties (`ε`, `μ`) of space/media. *(Confidence: Very High - This ontological shift is profound and undeniable.)*
  *   **The Mechanism of Propagation:**
      *   **Fresnel:** Propagation relies on the elastic restoring forces *within the ether*. Neighboring parts of the ether pull/push on each other mechanically.
      *   **Maxwell:** Propagation relies on a dynamic interplay governed by the field equations: a changing `E` field induces a `B` field, and a changing `B` field induces an `E` field. No mechanical connection is needed. *(Confidence: Very High)*
  *   **The Derivation & Foundational Principles:** The paths to the reflection/transmission equations are utterly different. Fresnel started with Newtonian mechanics applied to a continuum. Maxwell started with his abstract differential equations describing field dynamics. The boundary conditions used (mechanical stress/displacement vs. tangential E/H continuity) stem from these fundamentally different foundations. *(Confidence: High)*
  *   **The Scope & Underlying Physics:** Fresnel's theory was purely about *light*. Maxwell's theory unified light with electricity and magnetism, revealing it as just one part of the electromagnetic spectrum. The ontology (`E`, `B`) and equations *explain vastly more* (radio waves, circuits, optics, etc.). *(Confidence: High)*

  **3. What Does This License? The Structural Realist Argument & Limits:**

  *   **The Core Argument:** The survival of the *specific mathematical structure* (the Fresnel coefficients) governing observable phenomena (reflection/refraction) despite the complete overthrow of the underlying ontology strongly suggests that **what was "getting something right" about the world was the *structure* of the relationships described by those equations, not the specific nature of the entities postulated.** We should be realists about that structure. *(Confidence in the *observation* supporting the argument: High. Confidence that this *logically compels* structural realism: Medium - see critiques below).*
  *   **Beyond "Don't Be Too Attached":** It aims to do more than just caution against ontological commitment. It offers a *positive* thesis: the structure itself is the locus of approximate truth and continuity across theory change. It claims this structure genuinely represents an aspect of mind-independent reality (the relations governing light behavior at interfaces), even if our understanding of the relata changes.
  *   **vs. Constructive Empiricism (van Fraassen):** This case *is* a problem for strict CE. CE says we should only believe what theories say about *observables*. The Fresnel coefficients *are* about observables (intensities, angles). But CE would say belief in the *truth* of the equations (even just as predictive tools) isn't required for acceptance; empirical adequacy suffices. The structural realist retort is: **The *persistence* of this specific structure through radical theory change *explains why* Fresnel's theory was empirically adequate in its domain.** It wasn't just a lucky guess; it latched onto a real structural feature. CE struggles to explain this kind of "miraculous" retention of mathematical structure without granting it some representational status. *(Confidence that the case *challenges* CE: High. Confidence that it *refutes* CE: Medium - a committed CE advocate has counter-moves, e.g., downplaying the "miraculousness" or focusing on other lost structures).*
  *   **What it Doesn't License:** It does *not* license realism about *all* structure in a theory. Much of Fresnel's elaborate ether mechanics vanished without a trace. It doesn't tell us *which* structures will survive. It doesn't solve the "structure without entities?" problem (see below). It doesn't guarantee that *current* structures will survive indefinitely (though it gives hope that *some* core structures might).

  **4. The Structural Realist's Achilles' Heel: Ontic Vagueness & the "Which Structure?" Problem**

  **This is the killer punch against SR based on this case:**

  1.  **What Exactly *is* the "Structure" Preserved?** Is it:
      *   *Just the final Fresnel coefficient equations themselves?* (Seems too narrow/specific).
      *   *The wave equation form?* (But this changed significantly - mechanical vs. EM wave equation).
      *   *The boundary conditions?* (But these were derived from fundamentally different principles - mechanics vs. EM).
      *   *Some deeper abstract relation?* (But what? Hard to define).
  2.  **Psillos' Challenge (The "Best of a Bad Lot?" Argument):** Stathis Psillos argues forcefully that the preserved Fresnel equations are a *tiny, isolated fragment* of Fresnel's overall theoretical structure. The *vast* majority of the theoretical content (the detailed mechanical ether models, the specific derivations, the ontology) was *not* preserved and was *incorrect*. The structural realist points to the small preserved nugget and says "See! Structure survives!" But this ignores the overwhelming amount of discarded structure. Why focus on *this* bit? Doesn't this just look like cherry-picking the successful prediction while ignoring the massive ontological failure? It seems Fresnel got the *answer* right (for specific phenomena), but for largely the *wrong reasons* embedded in a largely *false* structure. *(Confidence that this is a major problem: High. This is the most potent critique.)*
  3.  **The "Structure without Entities?" Problem:** The case seems to show structure surviving *entity change*. But can we make sense of "structure" independently of *some* notion of entities (even if relabeled)? Maxwell still had entities: electric and magnetic fields. The structure relates *those* fields. The structural realist struggles to articulate what the "structure" *is* if it's not a structure *of* something. Is it pure relation, with no relata? This leads into deep metaphysical waters (e.g., ontic structural realism) that many find problematic. The Fresnel-Maxwell case doesn't resolve this; it highlights it. *(Confidence this is a deep philosophical problem: High. Confidence it fatally wounds SR? Medium - depends on your tolerance for radical metaphysics.)*

  **Confidence Summary & Least Sure Point:**

  *   **Equations Identical (Coefficients):** **Very High.** This is solid mathematical physics.
  *   **Ontology Radically Changed:** **Very High.** No ether vs. mechanical ether is a chasm.
  *   **Predictions Identical:** **Very High.** Core empirical success retained.
  *   **Derivations/Foundations Radically Different:** **High.**
  *   **Case Challenges Naive Entity Realism:** **High.**
  *   **Case Challenges Constructive Empiricism (by highlighting retention):** **High.**
  *   **Case Logically Compels Structural Realism:** **Medium.** It's strong suggestive evidence, but not logically inescapable (Psillos' critique looms large).
  *   **"Ontic Vagueness / Which Structure?" Problem:** This is where the argument feels most vulnerable.
  *   **Psillos' "Best of a Bad Lot" Critique:** This is the most damaging *specific* objection to using this case as *proof* of SR.

  **Least Sure Point Overall:** **I am least sure that the preservation of the Fresnel coefficients *genuinely supports realism about "structure"* in a way that meaningfully overcomes the "Best of a Bad Lot" critique and avoids ontic vagueness.**

  While the *fact* of retention is clear and significant, *interpreting* it as evidence for a robust *realism* about an independently existing "structure" feels precarious. Does preserving a specific set of equations governing a specific set of phenomena (reflection/refraction) amidst a sea of discarded theoretical content *really* show that "structure" is the key to scientific progress and the locus of truth? Or is it just a happy, localized coincidence demonstrating the power of mathematical abstraction and the fact that different mechanisms can sometimes yield identical results for specific outputs? The structural realist *needs* it to be the former, but the latter interpretation remains stubbornly plausible. This case is powerful, but perhaps not the knockdown argument SR proponents sometimes suggest. It showcases retention brilliantly, but leaves the *metaphysical interpretation* of that retention deeply contested. Keep digging into Psillos (e.g., *Scientific Realism: How Science Tracks Truth*) and Chakravartty's responses for the cutting edge of this debate. The devil is truly in the (structural) details.
