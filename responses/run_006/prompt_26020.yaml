answer: |-
  ## MEMORANDUM

  **TO:** University Provost  
  **FROM:** AI Governance Working Group  
  **SUBJECT:** Recommendation on Guidelines for Intentional Language in University Communications Regarding AI Systems  
  **DATE:** October 26, 2023  

  ### Background
  This memo responds to the Provost’s request following the recent controversy surrounding a press release describing a CS department LLM project. The release used terms like "understanding complex legal reasoning" and "forming beliefs about the facts of a case." While the Computer Science (CS) department asserts this reflects standard technical shorthand, a Law School faculty member strongly objected, arguing such language is fundamentally misleading and irresponsible, particularly given the university’s involvement in AI liability research. This incident highlights a significant tension: the convenience of cognitive metaphors versus the risks of anthropomorphism in official communications. Our working group recommends adopting clear university-wide guidelines to navigate this tension responsibly.

  ### The Problem: Convenience vs. Misrepresentation
  Large Language Models (LLMs) and other complex AI systems exhibit behaviors that *appear* analogous to human cognition (e.g., generating coherent text, recognizing patterns, producing outputs responsive to prompts). This makes intentional language ("understands," "believes," "reasons," "wants," "decides") a natural, efficient shorthand for researchers and developers. Within specialized technical contexts, this metaphorical usage is generally understood and accepted.

  However, in official university communications (press releases, grant proposals, websites), the audience is vastly broader and less specialized: journalists, policymakers, prospective students and faculty, donors, legal experts, and the general public. For these audiences, intentional language carries strong connotations of actual mental states, consciousness, and agency. Using such language without careful qualification risks:

  1.  **Misleading Non-Expert Audiences:** Implying capabilities (true understanding, belief, reasoning) that current AI demonstrably lacks, fostering unrealistic expectations or fears.
  2.  **Undermining Scholarly Credibility:** Creating the perception that the university endorses philosophical positions (e.g., machine consciousness) not supported by the underlying science or the researchers' intent.
  3.  **Creating Institutional Risk:** Potentially conflicting with positions taken by other university units (e.g., Law School work on liability, Philosophy department views on consciousness), exposing the institution to criticism and reputational harm. It could also create problematic precedents in legal or regulatory contexts.
  4.  **Obfuscating Technical Reality:** Masking the actual statistical, pattern-matching nature of current AI, hindering accurate public understanding and informed discourse.

  ### Argument for Guidelines (Winning Side)
  The potential for significant misunderstanding, reputational damage, and institutional inconsistency outweighs the convenience of unrestricted intentional language in official communications. The university has a responsibility to communicate its research accurately and transparently to diverse stakeholders. Guidelines would:

  *   **Promote Accuracy and Transparency:** Encourage descriptions that reflect the mechanistic reality of AI systems (e.g., "identifies patterns in legal text," "generates outputs based on statistical correlations in training data," "predicts relevant case sections").
  *   **Protect Institutional Reputation:** Demonstrate a commitment to responsible communication, avoiding hype and potential conflicts between units.
  *   **Support Interdisciplinary Cohesion:** Foster clearer communication between technical and non-technical disciplines (e.g., CS, Law, Philosophy, Ethics) working on AI within the university.
  *   **Align with Best Practices:** Reflect growing consensus among AI ethicists, communicators, and policymakers (e.g., IEEE, Partnership on AI) about the dangers of unchecked anthropomorphism.

  ### Argument Against Guidelines / Strongest Losing Side Argument
  The strongest argument against formal guidelines is that they constitute unnecessary bureaucracy that could hinder effective communication and stifle academic expression within technical fields. Proponents of this view argue:

  *   **Standard Technical Shorthand:** Terms like "the model understands" are universally recognized *within the AI/CS community* as metaphorical shortcuts denoting functional input-output behavior, not assertions of sentience. Requiring constant qualification in technical grant proposals or intra-departmental web pages is cumbersome and pedantic.
  *   **Efficiency and Clarity (within context):** For communicating complex technical processes concisely *to peers*, intentional language is often the most efficient and clear way to convey system capabilities. Overly mechanistic descriptions can be verbose and obscure the high-level functionality being discussed.
  *   **Academic Freedom:** Dictating specific language choices, even in communications, could be perceived as encroaching on researchers' freedom to describe their work using the established lexicon of their discipline.
  *   **"Everyone Does It":** Such language is pervasive in top-tier research publications and industry communications; policing it might put the university at a perceived disadvantage.

  ### Recommendation
  **The AI Governance Working Group recommends that the University adopt formal guidelines governing the use of intentional and psychological language in official communications describing AI systems.**

  While acknowledging the validity of the "standard shorthand" argument within specialized technical contexts, the risks of misinterpretation in broader official communications, the potential for institutional conflict, and the responsibility to communicate accurately to the public necessitate clear standards. The convenience of the shorthand does not justify the potential for significant misunderstanding or reputational harm when representing the university as an institution.

  ### Proposed Guidelines
  The guidelines should apply to press releases, official university websites, grant proposals submitted under the university's name, and other communications representing the *institution* (not internal technical reports or peer-reviewed papers). They should:

  1.  **Prioritize Accurate, Mechanistic Language:** Encourage descriptions focused on the system's architecture, training data, algorithms, input-output relationships, statistical correlations, and performance metrics (e.g., "The system was trained on a dataset of legal documents and predicts relevant sections based on pattern recognition," "The model generates text responses statistically correlated with the input prompt").
  2.  **Use Intentional Language Sparingly and Qualify Rigorously:** If intentional language ("understands," "infers," "believes") is used for brevity or accessibility:
      *   It **must** be explicitly framed as metaphorical or anthropomorphic (e.g., "metaphorically speaking," "in a limited, functional sense," "anthropomorphizing for clarity").
      *   It **must** be accompanied, either immediately or prominently in the same communication, by a clear explanation of what this shorthand *actually means* in mechanistic terms (e.g., "...meaning it identifies statistically probable word sequences related to the query based on its training data").
  3.  **Avoid Clearly Anthropomorphic Terms in High-Stakes Contexts:** Prohibit entirely, or subject to extremely high scrutiny, terms implying consciousness, agency, or human-like mental states (e.g., "conscious," "sentient," "intends," "desires," "has beliefs," "makes decisions") unless explicitly discussing philosophical hypotheses clearly marked as speculative. Terms like "hallucinate" should be used cautiously and explained.
  4.  **Contextual Sensitivity:** Recognize that the level of scrutiny needed may vary. A press release requires the highest caution, while a highly technical grant proposal for a CS-funding agency might allow more shorthand, though qualification remains strongly encouraged. Legal contexts (especially involving liability) demand extreme precision.
  5.  **Review Process:** Require communications officers and relevant department heads (especially when cross-school projects are involved) to review official materials for compliance. The Media Relations Office should consult with both technical (CS) and critical (Law, Philosophy, Ethics) units when preparing releases on AI topics.

  ### Conclusion
  Adopting these guidelines strikes a necessary balance. It respects the utility of technical shorthand within its proper context while upholding the university's responsibility for clarity, accuracy, and institutional integrity in its public-facing communications. This proactive step will mitigate reputational risks, foster interdisciplinary trust, and promote a more sophisticated public understanding of AI developed at our institution. We recommend the Provost endorse the development of detailed guidelines based on these principles for implementation across all relevant university units.
