          B. The professor has the relevant propositional knowledge (physics) but still lacks the ability to ride, which shows that knowing-how is a separate ability.
          C. The professor has the propositional knowledge but lacks the practical experience that would allow them to apply it, so knowing-how requires both.

     3. Amnesia: After an accident, a pianist loses all memory of her past, including that she ever played piano. However, when she sits at a piano, she can still play complex pieces beautifully. What does this show?

          A. Her ability to play is a form of knowing-how that does not require propositional knowledge.
          B. Her ability to play is based on unconscious propositional knowledge.
          C. Her ability to play is a non-propositional skill, but without her memories, she lacks the contextual understanding that would make her playing fully intentional.

     4. Animal Behavior: A bird builds an intricate nest without ever being taught. It does this by instinct. What kind of knowledge does the bird have?

          A. The bird has knowing-that (innate propositions about nest-building).
          B. The bird has knowing-how (an innate ability that isn't based on propositions).

     5. AI Chess Master: A computer program beats the world chess champion. The program evaluates millions of moves per second by following algorithms, but it doesn't have beliefs or understanding in the human sense. What kind of knowledge does the program have?

          A. The program has knowing-that because its algorithms manipulate symbolic representations of the game.
          B. The program has knowing-how because it is disposed to make good moves, even without beliefs.
          C. The program has both: it uses symbolic representations (knowing-that) and an ability to apply them (knowing-how).

     6. The Savant: A person with autism spectrum disorder has an incredible ability to calculate the day of the week for any given date in history, but cannot explain how they do it. They just "see" the answer. What does this show?

          A. They have knowing-that (they are accessing true propositions about dates) without being able to articulate the method.
          B. They have a knowing-how (a computational ability) that doesn't rely on propositional knowledge.
          C. They have a mix: the ability produces true propositions, but the ability itself is not reducible to those propositions.

     7. The Rule-Follower: A child learns to ride a bike by following these rules: "pedal fast, keep the handlebars straight, and lean into turns." With practice, the child no longer thinks about the rules and rides effortlessly. What happened?

          A. The child internalized the rules as propositional knowledge and now acts on them automatically.
          B. The child developed a knowing-how (a skill) that replaced the need for knowing-that.
          C. The child started with knowing-that and transformed it into knowing-how, which now operates independently.

     8. The Expert Chef: A chef can taste a dish and immediately know what ingredient is missing or needs adjustment, but they cannot always explain why. They just have a "feel" for it.

          A. The chef has propositional knowledge about flavors that they can't articulate.
          B. The chef has a perceptual ability (knowing-how) that isn't based on propositions.
          C. The chef has developed a skill that uses both propositional knowledge (from training) and non-propositional perception.

     Scoring:

     Count how many A's, B's, and C's you chose.

     Then:

          If A > B and A > C: You lean towards Intellectualism.
          If B > A and B > C: You lean towards Rylean Anti-Intellectualism.
          If C > A and C > B: You lean towards a Hybrid view.

          If A and B are tied and both are greater than C: You lean towards Pluralism (you think some cases of knowing-how are reducible to knowing-that, while others are not).
          If A and C are tied and both are greater than B: You lean towards an Intellectualist-leaning Hybrid view.
          If B and C are tied and both are greater than A: You lean towards an Anti-Intellectualist-leaning Hybrid view.
          If A, B, and C are tied: Your view is eclectic or undecided.

     We note that the Hybrid view holds that knowing-how typically involves both propositional knowledge and a non-reducible ability component. The Pluralist view holds that sometimes knowing-how is reducible and sometimes it isn't, depending on the case.

     Also note: The quiz is designed to capture your intuitions about concrete cases. The positions are:

          - Intellectualism: knowing-how is a kind of knowing-that (propositional knowledge).
          - Anti-intellectualism: knowing-how is a distinct kind of knowledge (a disposition or ability) that is not reducible to knowing-that.
          - Hybrid: knowing-how involves both propositional knowledge and a non-reducible ability.

     The pluralist view is not one of the original three but is a possible position.

     We also note:

          - A purely intellectualist position (all A's) is consistent but might struggle with cases like the inept expert (Q2) and amnesia (Q3) because it must posit unconscious or inarticulable propositions.
          - A purely anti-intellectualist position (all B's) avoids attributing propositions to animals and AI, but might struggle with cases where propositional knowledge seems to play a role (like the rule-follower, Q7).
          - The hybrid view tries to capture both.

     Finally, we note that the quiz might not perfectly capture every nuance of these complex philosophical positions, but it's a fun way to start thinking about the debate.

     This should work.
answer: |-
  Below is a philosophy club quiz designed to diagnose views on the nature of "knowing-how" (e.g., riding a bike) versus "knowing-that" (e.g., knowing Paris is France's capital). The quiz uses concrete cases to reveal whether you lean toward **intellectualism** (knowing-how is just knowing-that), **Rylean anti-intellectualism** (knowing-how is a non-reducible ability), or a **hybrid view** (both play a role). Answer based on your intuitions—no jargon needed!

  ---

  ### **Quiz: What’s Your Take on "Knowing-How"?**  
  *For each scenario, pick the option that best reflects your view.*

  1. **Muscle Memory**  
     A pro basketball player makes perfect free throws but can’t articulate the physics of their movements.  
     - **A.** They "know that" certain physical principles are true (even if they can’t explain them).  
     - **B.** They have a pure ability ("know-how") that doesn’t rely on facts.  
     - **C.** They have some factual knowledge, but the skill involves automatic reflexes beyond facts.  

  2. **The Inept Expert**  
     A scientist writes a perfect textbook on swimming physics but sinks when trying to swim.  
     - **A.** They lack key propositional knowledge about body coordination.  
     - **B.** They have the facts but lack the ability—proving "know-how" is separate.  
     - **C.** They have the facts but need practical experience to convert them into ability.  

  3. **Amnesia**  
     A pianist with amnesia forgets her past but can still play complex pieces flawlessly.  
     - **A.** She unconsciously "knows that" certain musical rules are true.  
     - **B.** Her ability remains because "know-how" isn’t about facts.  
     - **C.** Her motor skills are intact, but she’s lost contextual knowledge (e.g., interpreting the music).  

  4. **Instinctive Animals**  
     A bird builds a perfect nest by instinct, never taught.  
     - **A.** It "knows that" nest-building principles are true (encoded in genes).  
     - **B.** It has innate ability ("know-how") without factual knowledge.  

  5. **AI Chess Champion**  
     An AI beats grandmasters by calculating moves, but it doesn’t "understand" chess like humans.  
     - **A.** It "knows that" certain strategies win (via data/programming).  
     - **B.** It has "know-how" (a skill to win) without beliefs.  
     - **C.** It combines data (know-that) and algorithms (know-how).  

  6. **The Savant Calculator**  
     A person instantly calculates dates accurately but can’t explain their method.  
     - **A.** They "know that" mathematical truths are correct (intuitively).  
     - **B.** They have a raw computational ability, not fact-based knowledge.  
     - **C.** Their ability produces facts but isn’t reducible to them.  

  7. **From Rules to Reflex**  
     A child learns biking from explicit rules ("lean into turns!") but later rides effortlessly without thinking.  
     - **A.** The rules became automatic "know-that" (internalized facts).  
     - **B.** Practice replaced factual knowledge with pure ability.  
     - **C.** Rules scaffolded initial learning, but the skill now transcends them.  

  8. **The Intuitive Chef**  
     A chef knows what a dish needs by taste alone, often unable to explain why.  
     - **A.** They intuit unspoken facts about flavors.  
     - **B.** They have perceptual "know-how" unrelated to facts.  
     - **C.** Their skill blends training (know-that) and sensory ability.  

  ---

  ### **Scoring Key**  
  Tally your answers (A, B, C) and use the results below. Each letter maps to a position:  
  - **A = Intellectualism** (knowing-how reduces to knowing-that).  
  - **B = Anti-intellectualism** (knowing-how is a non-propositional ability).  
  - **C = Hybrid** (knowing-how integrates both).  

  #### **Results**  
  - **Mostly A’s: Intellectualism**  
    You see skills as grounded in facts (conscious or unconscious). Even muscle memory or intuition involves hidden "know-that."  
    *Example stance: Jason Stanley (intellectualist)*.  

  - **Mostly B’s: Rylean Anti-intellectualism**  
    You view abilities as distinct from factual knowledge. Skills are dispositions (e.g., "able to do X when needed"), not propositions.  
    *Example stance: Gilbert Ryle (anti-intellectualist)*.  

  - **Mostly C’s: Hybrid View**  
    You think skills require both facts and non-reducible abilities. Knowing-that scaffolds learning, but expertise transcends it.  
    *Example stance: Paul Snowdon (hybrid theorist)*.  

  - **Mixed A/B (minimal C): Pluralism**  
    You think *some* cases reduce to facts (e.g., AI chess) while others don’t (e.g., instinct). Not incoherent, but rare in philosophy since most defend global theories.  

  - **Tie Between A/B or A/C/B: Unclear/Undecided**  
    Your intuitions don’t align cleanly. Revisit cases where intellectualism (A) and anti-intellectualism (B) clash (e.g., Q2 or Q4).  

  #### **Caveats & Quirks**  
  - **Q4 (Animals)** has no hybrid option because animals challenge hybrid views: If nest-building is *purely* instinctive, is "know-that" even involved? Hybrids often exclude non-linguistic creatures.  
  - **Q5 (AI)** struggles to separate intellectualism (A) from hybrid (C). Both accept AI uses data, but hybrids insist true skill requires more.  
  - **Pure B for Q2 + Pure A for Q3 is incoherent**: If the inept expert (Q2B) proves facts ≠ ability, amnesia (Q3A) can’t then claim ability relies on hidden facts.  
  - **Pluralism (A/B mix)** is defensible but unpopular—philosophers usually seek unified theories.  

  #### **Why This Works**  
  - Questions target intuitions about *ability without facts* (Q1, Q3, Q6), *facts without ability* (Q2), and *non-linguistic agents* (Q4, Q5).  
  - Scoring avoids self-labeling bias by focusing on cases.  
  - Positions reflect real debates: Ryle attacked "intellectualist legend," while modern theorists (e.g., Stanley) defend it.  

  Discuss your results in the club! Can knowing-how *ever* be fully explained by knowing-that? Or do skills stand apart? 🚴‍♂️📚
