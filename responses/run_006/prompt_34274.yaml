prompt: |-
  I've been trying to sort out my intuitions about when individual actions matter in collective harm cases, and my verdicts are kind of a mess. I want to know if there's a principle that captures them, or at least most of them.

  Here are my cases:

  - I skip buying a chicken breast at the grocery store. I figure the store orders in bulk, my one purchase doesn't affect how many chickens are killed, so it doesn't matter either way. Verdict: not wrong to buy it, not praisworthy to skip.

  - I don't vote in a national election. One vote never decides it. Verdict: not wrong to stay home.

  - I'm in a firing squad of ten, where one rifle has a blank and nobody knows whose. I fire. Verdict: wrong, even if my bullet was the blank. I participated.

  - I'm one of twenty people each dumping a bucket of sludge into a lake. The lake can absorb nineteen buckets without harm, but twenty kills all the fish. I dump my bucket. Verdict: wrong. But I'm not sure this is consistent with the chicken case.

  - I buy a t-shirt from a company that uses sweatshop labor. My purchase doesn't change their practices; the supply chain is what it is. Verdict: feels wrong, but I can't explain why if it makes no difference.

  - I'm the hundredth person to join a protest, where the organizers said they need a hundred people to get media coverage. The coverage happens. Verdict: my joining mattered, and I'd have been wrong to bail.

  - I take a private jet for a weekend trip instead of flying commercial. Verdict: feels wrong, but the climate impact of one flight is negligible, so I'm not sure my intuition tracks.

  - I'm the one person in a thousand who could tip a boycott over the threshold for a company to change its policy. I boycott. Verdict: matters, I should do it.

  - I eat a steak at a restaurant where the meat is already cooked and would be thrown out if I didn't eat it. Verdict: not wrong. (But is this just the chicken case again?)

  Is there a principle lurking here? Something about thresholds, or about expected impact, or about participation versus buying? I keep going back and forth on whether the chicken and the sweatshop t-shirt should come out the same way. If there's a principle that gets most of these, I'd like to know what it says about a case I haven't listed: being one of millions of people whose small emissions collectively cause climate harms, where no individual emission is decisive. And if the principle forces me to drop some of my verdicts, which ones should go?
reasoning: |-
  Okay, the user is struggling with ethical intuitions about individual actions in collective harm cases. They've listed several scenarios where their judgments vary, and they're seeking a unifying principle. Let me start by understanding each case they provided.

  First, the chicken breast purchase. They think skipping it doesn't matter because stores order in bulk. Similarly, not voting isn't wrong since one vote rarely matters. But in the firing squad, even with a blank, participating feels wrong. The lake with twenty buckets—dumping the twentieth is wrong. Sweatshop t-shirt feels wrong despite no impact. The protest tipping point matters. Private jet feels wrong but impact is negligible. Boycott tipping point matters. Eating steak that would be wasted is okay.

  They want a principle that explains most cases. Maybe thresholds or participation? The firing squad and lake cases involve clear thresholds. But chicken and voting don't. Sweatshop and private jet are tricky because no threshold. The protest and boycott have tipping points. 

  The user's deeper need might be consistency in ethical decisions. They mention climate change as a key concern. How to judge small emissions when collective harm is huge? They might feel guilt but can't pinpoint why. Also, they might want practical guidance for daily choices without overburdening themselves.

  Possible principles: Expected harm? But in firing squad, expected harm is high, but the blank means no actual harm. Participation seems key here. For the lake, it's threshold-dependent. Voting and chicken purchases are overdetermined; one action doesn't change anything. Sweatshop and private jet are similar, but they feel wrong. Why? 

  Ah, complicity. Even if no impact, participating in a harmful system feels complicit. But that's not about consequences. The protest case is about actual impact at the threshold. So maybe two principles: threshold effects and complicity. 

  Climate change is tricky. Each emission doesn't cross a threshold, but collectively harmful. Expected harm is minimal per person, but complicity might apply. Veganism parallels here—each purchase doesn't change demand, but complicity in animal suffering. 

  The user might need to accept that complicity explains some intuitions, even without impact. Or they could adjust some verdicts. For example, accept that sweatshop isn't wrong if no impact, but that clashes with their feeling. Or embrace complicity as valid. 

  Also, the steak case is like the chicken but with waste. Avoiding waste justifies it, similar to the "would be thrown out" factor. 

  So the best approach might be a hybrid: distinguish threshold cases (wrong to participate), overdetermined cases (not wrong per se), complicity cases (might feel wrong due to association), and expected harm (if high probability of harm). 

  Climate change: complicity might apply, or focus on collective responsibility. The user might need to decide if complicity is enough to condemn actions without individual impact. Or advocate for systemic change rather than individual blame. 

  Their conflict between chicken (okay) and sweatshop (not) might be inconsistent unless complicity is the differentiating factor. Maybe sweatshop involves exploitation, making complicity stronger. Or they could revise sweatshop to be like chicken if truly no impact. 

  In conclusion, the user needs to clarify if they value complicity over consequentialism. The principle would then combine both, explaining thresholds and complicity. For climate, if complicity matters, then emissions are wrong even without individual impact. Otherwise, they should adjust their sweatshop intuition. Either way, some verdicts might need re-evaluation for consistency.
answer: |-
  Your intuitions reveal a tension between *consequentialist* thinking (focusing on outcomes) and *deontological* thinking (focus on duties, participation, or complicity). No single principle perfectly captures all your verdicts, but a hybrid approach combining **Thresholds, Expected Impact, and Participation/Complicity** comes close. Here's a breakdown:

  ### Key Principles at Work
  1.  **Threshold Effects:** Actions matter when you are the one who crosses (or is expected to cross) a critical threshold causing harm. (e.g., Lake bucket #20).
  2.  **Expected Impact:** Actions matter when there's a significant *probability* your action will trigger a harmful outcome, even if it's not guaranteed. (e.g., Boycott tipper).
  3.  **Participation/Complicity:** Actions matter when you are *actively participating* in a harmful collective act, even if your specific contribution is negligible. This involves a duty *not* to be part of causing harm. (e.g., Firing squad).
  4.  **Overdetermination:** An action *doesn't* matter if the outcome is guaranteed regardless of your specific choice. Your action is neither necessary nor sufficient. (e.g., Chicken breast, Voting, Wasted steak).

  ### Applying the Principles to Your Cases

  | Case | Principle(s) | Verdict Consistency |
  |------|--------------|---------------------|
  | **Chicken Breast** | Overdetermination (Store orders bulk; your purchase doesn't change slaughter orders) | Consistent: Not wrong |
  | **Not Voting** | Overdetermination (One vote never decides) | Consistent: Not wrong |
  | **Firing Squad** | Participation/Complicity (You are part of an intentional killing act) | Consistent: Wrong |
  | **Lake Bucket #20** | Threshold Effect (You are the one crossing the harm threshold) | Consistent: Wrong |
  | **Sweatshop T-Shirt** | Participation/Complicity (You are benefiting from/willingly participating in an exploitative system) | Tension: Feels wrong despite overdetermination |
  | **100th Protester** | Threshold Effect (You are the one crossing the critical mass threshold) | Consistent: Mattered/Wrong to bail |
  | **Private Jet** | Expected Impact (Tiny but non-zero contribution) + Participation/Complicity | Tension: Feels wrong despite small impact |
  | **Boycott Tipper** | Expected Impact (High probability your action triggers change) | Consistent: Matters/Should do it |
  | **Wasted Steak** | Overdetermination (Harm already done; waste avoidance is neutral/positive) | Consistent: Not wrong |

  ### The Core Tension: Chicken vs. Sweatshop vs. Firing Squad
  *   **Chicken:** Purely overdetermined. Your action is causally inert. Principle: Overdetermination → Not wrong.
  *   **Firing Squad:** Purely about participation. You are an agent in a harmful act. Principle: Participation/Complicity → Wrong.
  *   **Sweatshop T-Shirt:** **This is the hardest.** Causal impact (overdetermination) suggests "not wrong," like the chicken. Your intuition ("feels wrong") likely stems from **Participation/Complicity** – you are voluntarily engaging with and benefiting from a system you know causes severe harm to others. The *moral taint* of association is strong.

  **Resolution:** To be consistent with the *causal reasoning* in the chicken case, you might need to drop the intuition that buying the sweatshop shirt is *causally* wrong. However, the "feels wrong" intuition is valid if you accept **Participation/Complicity** as a separate moral principle. Many ethicists argue that knowingly participating in unjust systems *is* wrong, even if your individual causal impact is zero. This explains the intuitive difference between the chicken (system viewed as relatively neutral/necessary) and the sweatshop (system viewed as actively exploitative/unjust).

  ### Climate Change: The Ultimate Test Case
  *   **Problem:** Your emissions are massively overdetermined. No single emission is causally necessary or sufficient for any specific climate harm (threshold). The expected harm of your individual emissions is real but infinitesimally small.
  *   **Analysis:**
      *   **Pure Consequentialism (Expected Impact):** Your action adds a tiny, non-zero amount of expected harm. While negligible individually, multiplied by billions, it's catastrophic. This suggests *some* moral weight, but it feels vanishingly small per person.
      *   **Thresholds:** No individual threshold exists. Harm is gradual and probabilistic.
      *   **Participation/Complicity:** You are knowingly participating in a collective act (fossil fuel consumption) causing massive, foreseeable harm. This principle strongly suggests the action is wrong.
      *   **Overdetermination:** Your specific emissions won't change the global outcome. Argues against individual wrongness.

  **Principle Applied:** A hybrid principle captures the intuition that emissions *are* wrong:
  *   **"It's wrong to knowingly participate in a collective practice that causes severe harm, where your participation contributes (even minutely) to the harm, and where alternatives exist."**
      *   **Participation/Complicity:** Check (knowingly part of harmful practice).
      *   **Expected Impact (Micro):** Check (adds a non-zero increment of harm).
      *   **Alternatives:** Check (lower-emission options usually exist).

  This doesn't rely on being a threshold-crosser, just on being a contributing participant in a harmful collective endeavor. The *scale* of the harm and the *foreseeability* amplify the wrongness under this principle.

  ### Which Verdicts Might Need Adjustment?
  1.  **Sweatshop T-Shirt:** To be consistent with the *causal reasoning* of the chicken case, you might need to conclude it's *not causally* wrong. However, if you accept **Participation/Complicity**, your "feels wrong" intuition stands. This principle provides a *reason* for the feeling.
  2.  **Private Jet:** Similar to sweatshop/climate. Pure consequentialism (expected impact) makes it barely wrong. **Participation/Complicity** makes it clearly wrong – it's a highly conspicuous, unnecessary, and disproportionate contribution to a harmful practice. Your intuition likely tracks this principle.
  3.  **Voting:** While overdetermined, some argue **Participation/Complicity** applies weakly (duty to participate in democracy) or **Expected Impact** applies if elections are very close (probability isn't *exactly* zero). Your "not wrong" verdict is common, but some ethicists push back based on collective duty.

  ### The Hybrid Principle
  **"An individual action is likely wrong if: (a) It crosses (or has a significant chance of crossing) a threshold causing harm; OR (b) It constitutes active participation in a collective act intended or known to cause severe harm, and alternatives exist; AND its expected contribution to harm is non-negligible within the collective context."**

  *   **Captured:** Firing Squad (b), Lake (a), Protest Tipper (a), Boycott Tipper (a), Climate/Private Jet/Sweatshop (b - if you accept complicity).
  *   **Explains "Not Wrong":** Chicken (No a/b), Voting (No a/b, thresholds too high), Wasted Steak (No a/b - harm already done, may reduce waste).
  *   **Handles Tension:** Explains *why* sweatshop feels different than chicken (complicity in severe injustice vs. routine consumption) while acknowledging the causal similarity. Allows climate emissions to be wrong based on complicity + micro-impact, even without thresholds.

  This principle validates most of your intuitions. The key choice is whether to fully embrace **Participation/Complicity** for cases like sweatshops and emissions. If you do, your intuitions are largely consistent. If you reject it, you'd need to adjust your verdicts on sweatshops, private jets, and potentially climate emissions to align with pure overdetermination/consequentialism. Most philosophers grappling with collective harm find a role for complicity necessary to match common moral intuitions.
