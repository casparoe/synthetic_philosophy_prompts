  A friend of mine who did a politics and tech module told me the whole course basically boiled down to one idea from some guy called Winner, and he summarised it like this:

  "Winner argues that technologies aren't neutral tools — they have politics built right into them. His classic example is the low bridges on Long Island parkways, which Robert Moses deliberately designed so buses couldn't pass under them, effectively stopping poor and black New Yorkers from reaching the beach. The general point is that once you install a technology, it locks in a particular social order: nuclear power plants force you to have a centralised authoritarian state, the internet forces you towards democracy, and so on. So the takeaway is that technology determines politics, and the only real choice we have is whether we design our technologies democratically before they design us."

  I'm not sure I trust this as a summary — it feels a bit too neat, and I vaguely remember hearing that the Moses story is disputed. Could you go through it and tell me what's accurate, what's a distortion, and whether the conclusion he draws actually follows from whatever Winner really said? I'd like to be able to push back with something specific next time it comes up.
