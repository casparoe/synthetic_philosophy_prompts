answer: |-
  Your instincts are spot-on – your roommate's summary captures the *spirit* of Chesterton and Burke but oversimplifies their arguments, misstates the burden of proof, and ignores crucial nuances that make their views less rigid than presented. Here's a breakdown:

  1.  **Chesterton's Fence (From *The Thing*, 1929):**
      *   **The Actual Parable:** Chesterton described encountering a fence in a field with no apparent purpose. He argued that before tearing it down, a "reformer" *must* first understand *why it was built in the first place*. Only once you grasp its original purpose can you judge whether that purpose is still valid, is served poorly, or is harmful. The core principle is **epistemic humility**: don't assume your ignorance of a reason means no reason exists.
      *   **What's Fair in Your Roommate's Summary:** He correctly identifies the core message: don't destroy something just because *you* don't immediately see its purpose. The emphasis is on understanding before action.
      *   **What's Subtly Wrong/Missing:**
          *   **Not "Prove Harmful," but "Understand Purpose":** Chesterton doesn't say you must prove the fence is *actively harmful* to remove it. He says you must *understand its original function* before deciding. Once understood, you might find it obsolete, poorly designed, or even harmful – and *then* removal is justified. The barrier is ignorance, not necessarily harm.
          *   **Burden of *Understanding*, Not Just Proof:** The initial burden is on the reformer to *investigate and comprehend* the institution's history and rationale. It's not necessarily about proving harm *first*, but about overcoming your own ignorance *first*.
          *   **Implies Change is Possible:** The whole point of understanding is to enable *informed* change. Chesterton wasn't arguing for permanent preservation; he was arguing against reckless demolition based on superficial understanding.

  2.  **Burkean Conservatism (Primarily from *Reflections on the Revolution in France*, 1790):**
      *   **The Actual View:** Burke deeply distrusted abstract reason and radical attempts to redesign society based on theoretical blueprints (like the French Revolution). He argued:
          *   **Accumulated Wisdom:** Institutions, traditions, and customs ("prejudice" in his terms) embody the practical wisdom and experience of countless generations, refined through trial and error. They are complex social organisms.
          *   **Human Fallibility:** No single generation possesses the wisdom or foresight to fully understand the intricate web of social relations or predict all consequences of radical change. We are "dwarfs on the shoulders of giants."
          *   **Preference for Gradual Reform:** Change is inevitable and often necessary, but it should be slow, organic, and respectful of existing structures. Reform should aim to *preserve and improve* the core essence of institutions ("a disposition to preserve, and an ability to improve"), not obliterate them. It's like repairing an old house rather than burning it down to build a new one from untested plans.
          *   **Organic Society:** Society is a partnership between the living, the dead, and the unborn; we have obligations to past and future generations, not just ourselves.
      *   **What's Fair in Your Roommate's Summary:** He captures Burke's reverence for tradition as accumulated wisdom, his skepticism of radical change driven by abstract theory, and his emphasis on the fallibility of individual reason compared to collective experience.
      *   **What's Subtly Wrong/Missing:**
          *   **Not Against *All* Change, But Against *Radical* Change:** Burke explicitly endorsed *reform*. He was not a reactionary who wanted no change ever. His target was the *wholesale, violent, root-and-branch overthrow* of institutions based on abstract ideals divorced from historical context.
          *   **Harm Isn't the Sole Justification:** While Burke valued stability, his argument wasn't solely "only change if harm is proven." It was "change cautiously, incrementally, respecting the complex wisdom embedded in existing structures, because radical change unleashes unforeseen consequences." Change could be justified by demonstrating how the *proposed reform* aligns with the underlying principles of the existing order or addresses a clear dysfunction *within that framework*.
          *   **"Burden of Proof is Always on the Reformer" is an Overstatement:** Burke certainly believed reformers needed strong justification, especially for radical proposals. However, he also believed institutions needed to *function* and serve society's needs. Stagnant or dysfunctional institutions could lose legitimacy. His framework implies institutions *also* carry a burden to demonstrate their continued utility or alignment with deeper principles over time, especially when challenged. It's a dynamic tension, not a one-sided burden.

  **Addressing Your Critiques & Roommate's "Rare Cases" Claim:**

  *   **Slavery, Suffrage, etc.:** This is where your roommate's rigid summary fails badly. Applying Chesterton/Burke *rigidly* as he does *would* indeed have opposed abolition and suffrage:
      *   **Chesterton:** An abolitionist *would* understand the "purpose" of slavery (economic exploitation, racial hierarchy) and deem it morally abhorrent and fundamentally unjust. Understanding the purpose doesn't oblige preservation; it enables the judgment that the purpose itself is evil and the institution *must* be torn down. Chesterton's fence doesn't protect evil fences once understood.
      *   **Burke:** While Burke might have favored gradual emancipation schemes over immediate abolition, his core principles *could* support change in the face of profound *injustice* (which violates the deeper principles of natural law and social order he believed in). He would likely condemn institutions that fundamentally violate human dignity as *failures* of tradition, not its sacred embodiment. Reformers could argue these institutions had become *corruptions* of the true social order, not its essence. His "rare cases" dismissal trivializes how reformers *do* meet the (nuanced) burden by demonstrating profound moral harm and systemic injustice.
  *   **"Blanket Ban on Change":** You're right to sense this distortion. Both thinkers:
      *   Were reacting against *specific* radical movements (Chesterton against modernism/eugenics/socialism; Burke against the French Revolution).
      *   Valued understanding and incrementalism, *not* stasis. Chesterton was a prolific and often radical social critic himself!
      *   Assumed institutions *should* serve a positive purpose. An institution whose original purpose is forgotten *and* which demonstrably serves no current good (or causes harm) *could* be removed after investigation. Both would insist the investigation be thorough.

  **Conclusion: Does "burden of proof is always on the reformer" follow?**

  *   **In a Nuanced Sense, Yes, But Not Absolutely:** Chesterton and Burke strongly emphasize that reformers bear the responsibility to:
      *   (Chesterton) Understand *why* the institution exists.
      *   (Burke) Understand its place in the complex social fabric and the potential unintended consequences of radical change.
      *   Both: Offer compelling reasons *why* change is necessary and preferable to the risks of dismantling the existing structure.
  *   **However, Your Roommate's Formulation is Too Rigid and One-Sided:**
      *   It ignores that the burden on Chesterton is primarily *investigative* (understand the purpose) before judgment, not necessarily proving active harm.
      *   It ignores Burke's acceptance of *reform* and the idea that dysfunctional institutions *can* lose legitimacy. Institutions aren't automatically presumed perfect or eternally relevant simply by existing.
      *   It frames it as "prove harm or shut up," whereas the original arguments are more "understand deeply, proceed cautiously, and have very good reasons if you want radical change."
      *   It fails to acknowledge that traditions *can* embody error, prejudice, and injustice just as much as wisdom. The "accumulated wisdom" isn't always wise.

  **Applying this to the Latin/Greek Requirement:**

  *   **Chesterton's Lens:** Before abolishing it, *understand its original purpose*. Was it to train minds through rigorous grammar? Access foundational Western texts? Cultivate a shared elite cultural language? Foster attention to detail? Only once you know *why* it was instituted can you judge:
      *   Is that purpose still valid for your university's mission today?
      *   Is this requirement the *best* or *only* way to achieve that purpose?
      *   Does the cost (electives lost) outweigh the benefit?
  *   **Burke's Lens:** Recognize that this requirement might embody pedagogical wisdom (e.g., benefits of learning highly inflected languages, exposure to ancient thought). Abolishing it might have unforeseen consequences (e.g., diminishing a certain type of intellectual rigor, severing a link to historical academic tradition). Is abolition a radical overreaction, or could it be *reformed* (e.g., one semester, broader "antiquity" courses, more flexible options)? Does the proposed change respect the university's identity and core educational values?
  *   **Your Reform Argument is Strengthened by Understanding:** Instead of just "it's useless and eats electives," a more Chesterton/Burke-aware argument would be: "We understand its original purposes (X, Y, Z). However, evidence suggests these purposes are no longer central to our modern curriculum/goals [cite if possible], or can be better achieved through other means [e.g., logic courses, close reading seminars, modern language study]. The significant cost in student flexibility outweighs the diminishing returns of this specific requirement in the 21st century." This addresses the epistemic humility concern by showing you've done the work.

  In essence, your roommate's summary turns a valuable caution against reckless change based on ignorance into a near-absolute presumption in favor of the status quo. Chesterton and Burke offered powerful arguments for careful, respectful, and historically-informed reform, *not* for paralysis in the face of outdated or unjust institutions. The burden on reformers is heavy, but it's not insurmountable, and it involves understanding, not just proving harm.
