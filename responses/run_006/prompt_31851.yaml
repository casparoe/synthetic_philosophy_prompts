prompt: |-
  An adversarial collaboration between a committed frequentist and a committed subjectivist Bayesian about the interpretation of probability has produced a joint document. Draft that document. It should include:

  1. A numbered list of agreed claims—about the mathematical formalism (the Kolmogorov axioms, the laws of large numbers, the central limit theorem), about what each side acknowledges the other gets right, about the limits of each view, and about what each side would count as evidence against its own position.

  2. A disagreements table, with columns: (a) the precise formulation of the disagreement, phrased so that each side would accept the wording of its own position; (b) the crux—the sub-question such that settling it would move at least one side; (c) a test, case, or argument both agree bears on the crux; and (d) each side's prediction about what that test or case will show.

  The statement should distinguish genuine disagreements from merely verbal ones. Where the dispute reduces to a difference about what the word "probability" ought to mean, or about what the job description of a probability claim is, say so explicitly. Address at least the following issues: the reference class problem, the meaning of single-case probabilities, the justification of prior probabilities, and the role of probability in scientific inference.

  Begin with the joint statement itself, with no preface or commentary.
reasoning: |-
  We are a committed frequentist (F) and a committed subjectivist Bayesian (B) who have engaged in an adversarial collaboration. After extensive discussion, we present this joint document to clarify both our agreements and disagreements. We aim to distinguish substantive disagreements from verbal ones and to identify potential paths for resolution.

  ## 1. Agreed Claims

  We agree on the following:

  1. **Mathematical Formalism**: 
     - Probability theory is formalized by the Kolmogorov axioms (non-negativity, unit measure, and countable additivity). 
     - The laws of large numbers (weak and strong) and the central limit theorem are mathematical theorems that follow from these axioms. We agree on their statements and mathematical proofs.

  2. **What Each Side Acknowledges the Other Gets Right**:
     - **Frequentist acknowledges**: Bayesian methods provide a coherent framework for updating beliefs with new data and are particularly effective in sequential analysis and decision-making under uncertainty. The Bayesian approach naturally incorporates prior information when it is available and relevant.
     - **Bayesian acknowledges**: Frequentist methods, especially in the form of hypothesis testing and confidence intervals, are well-suited for objective reporting of data in many scientific contexts, particularly when prior information is minimal or uncontroversial. The frequentist emphasis on long-run error control is valuable in experimental design.

  3. **Limits of Each View**:
     - **Limits of Frequentism**: 
       - It struggles to assign probabilities to single, non-repeatable events in a way that is not circular (e.g., defining probability via long-run frequency for a singular event).
       - It does not provide a direct way to incorporate prior knowledge.
       - The reference class problem (discussed below) is a serious challenge.
     - **Limits of Subjectivist Bayesianism**:
       - The choice of prior can be subjective and controversial, especially when there is no consensus on prior information.
       - The interpretation of probability as degree of belief, while internally consistent, is not directly testable in the same way as frequentist probabilities.
       - Computations can be complex, and improper priors can lead to paradoxes.

  4. **What Would Count as Evidence Against One's Own Position**:
     - **Frequentist**: If it were shown that the long-run frequency of an event does not converge to a limit (e.g., in a well-defined, repeatable experiment), that would challenge the frequentist definition. Also, if a situation arises where frequentist methods consistently lead to worse decisions than Bayesian methods in long-run applications, that would be problematic.
     - **Bayesian**: If it were shown that Bayesian updating with coherent priors consistently leads to worse decisions than frequentist methods in the long run, that would challenge the Bayesian approach. Also, if a situation arises where no rational prior can be agreed upon and this leads to irreconcilable differences in conclusions, that would be a challenge.

  ## 2. Disagreements Table

  We now present our key disagreements in the following table. Each row addresses a specific disagreement.

  | # | (a) Formulation of Disagreement                                                                                                                                 | (b) The Crux                                                                                                                               | (c) Test/Case/Argument Bearing on Crux                                                                                          | (d) Predictions                                                                                                                               |
  |---|------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|
  | 1 | **Reference Class Problem**: <br>F: Probability is defined relative to a collective (a well-defined reference class of repeated trials). The problem is choosing the right collective. <br>B: Probability is always conditional on specific information, so the reference class is part of the conditioning. The problem is not a flaw but a feature of rational updating. | Is the reference class problem a fundamental flaw in the frequentist interpretation, or is it an unavoidable aspect of any probability concept? | Consider a unique event (e.g., the probability that a particular candidate will win an upcoming election). Both approaches must assign a probability. | F: The frequentist will try to find a collective of similar elections, but admits this is arbitrary. <br>B: The Bayesian assigns a probability conditional on all available information, including unique aspects. |
  | 2 | **Meaning of Single-Case Probabilities**: <br>F: A single-case probability is either meaningless or must be defined as a property of a collective of which the case is a member. <br>B: A single-case probability is a rational degree of belief about that particular case, given the available information. | Can a single-case probability be meaningfully assigned without reference to a collective?                                                | Consider the probability that a specific coin (which will be tossed once and then destroyed) lands heads.                       | F: This probability is either 0 or 1 (but unknown) or it must be defined relative to a class of similar coins. <br>B: It is a legitimate expression of uncertainty, e.g., 0.5 if the coin is believed fair. |
  | 3 | **Justification of Prior Probabilities**: <br>F: Prior probabilities in the Bayesian sense are arbitrary and lack objective foundation. <br>B: Prior probabilities are a necessary starting point for rational inference and can be based on objective information or default principles (e.g., maximum entropy). | Can prior probabilities be justified in a way that is not ultimately subjective?                                                           | Examine the use of priors in a context with minimal prior information (e.g., the probability of a new, unknown physical constant). | F: Any prior (even "objective" ones) introduces subjectivity and may bias results. <br>B: With minimal information, objective priors (e.g., Jeffreys prior) can be derived from invariance principles. |
  | 4 | **Role of Probability in Scientific Inference**: <br>F: The goal of scientific inference is to control long-run error rates (e.g., via p-values and confidence intervals). <br>B: The goal is to update beliefs about hypotheses in light of data (e.g., via posterior distributions and Bayes factors). | What is the primary objective of statistical inference in science: long-run error control or coherent updating of beliefs?                 | Analyze a set of replicated experiments where a true effect exists. Compare the long-run frequency of correct inferences (F) with the coherence of beliefs (B). | F: Predicts that methods with good long-run properties (e.g., low type I error) will lead to more reliable science. <br>B: Predicts that methods that update beliefs coherently (even with subjective priors) will lead to faster convergence to truth. |

  ### Clarification on Verbal Disagreements

  - **Definition of Probability**: We agree that at least part of our dispute is verbal. The frequentist insists that "probability" must refer to a long-run frequency in a repeatable experiment. The Bayesian insists that "probability" is a measure of rational degree of belief. We both agree that the mathematical calculus is the same, but we disagree on the interpretation of the concept. This is a difference in the job description: F sees probability as describing the world (a physical property), while B sees it as describing a state of knowledge (an epistemic property).

  - **Reference Class Problem**: We agree that the reference class problem is a challenge for both views but manifests differently. For F, it is a problem of selecting the right collective. For B, it is a problem of specifying the conditioning information. We disagree on whether this is a fatal flaw for the frequentist view (B says yes, F says no) and whether the Bayesian approach adequately resolves it (F says no, B says yes).

  - **Single-Case Probabilities**: This is a genuine disagreement. F denies that single-case probabilities (without a collective) are meaningful in the frequentist sense, while B asserts they are the fundamental object of interest.

  - **Justification of Priors**: This is a genuine disagreement. F sees the subjectivity of priors as a fundamental weakness, while B sees the use of priors (even subjective ones) as a strength that allows for flexibility and rationality.

  - **Scientific Inference**: This is a genuine disagreement about the goals of science. F emphasizes controlling error rates over many experiments, while B emphasizes rational belief updating in the individual case.

  We hope this document clarifies our positions and provides a basis for further discussion.
answer: |-
  ### Joint Statement on Probability: Frequentist and Subjectivist Bayesian Perspectives  

  #### 1. Agreed Claims  
  We, a committed frequentist (F) and a committed subjectivist Bayesian (B), jointly affirm the following:  

  1.1 **Mathematical Formalism**:  
     - The Kolmogorov axioms (non-negativity, unit measure, and countable additivity) are the foundation of probability theory. Both views fully accept these axioms and their consequences.  
     - The laws of large numbers (weak and strong) are valid theorems. They demonstrate that the sample mean converges to the expected value under repeated trials (F) or as a coherence property of beliefs (B).  
     - The central limit theorem is a mathematical truth. It justifies approximate normality in large samples, regardless of interpretation.  

  1.2 **What Each Acknowledges the Other Gets Right**:  
     - **F acknowledges**: Bayesian methods excel at incorporating prior information, updating beliefs with data, and making decisions under uncertainty. They are superior for sequential analysis and contexts requiring quantified subjective judgments (e.g., medical diagnosis).  
     - **B acknowledges**: Frequentist methods are well-suited for objective reporting of long-run performance (e.g., Type I/II error control), randomized controlled trials, and scenarios where prior information is absent or must be suppressed for transparency.  

  1.3 **Limits of Each View**:  
     - **Frequentist limits**:  
       - Cannot assign probabilities to non-repeatable events without ad hoc choices (e.g., unique historical events).  
       - Depends on hypothetical infinite sequences, which are unobservable.  
       - Struggles with post-data inference (e.g., interpreting a p-value as evidence for a hypothesis).  
     - **Bayesian limits**:  
       - Priors can introduce subjectivity, potentially biasing results when prior knowledge is weak or contested.  
       - Computationally intensive in complex models; sensitive to prior specifications.  
       - Lacks a universal rule for selecting priors, inviting the "subjectivity charge."  

  1.4 **What Would Count as Evidence Against One’s Own Position**:  
     - **Frequentist**: If it were proven that long-run frequencies fail to converge in a well-defined repeatable experiment, or if Bayesian methods demonstrably yielded better long-run calibration (e.g., in prediction) despite correct frequentist model specification.  
     - **Bayesian**: If coherent updating consistently produced poorly calibrated beliefs (e.g., 90% credible intervals containing the true value <<90% of the time), or if frequentist methods achieved superior decision outcomes without priors in rational agent models.  

  ---  

  #### 2. Disagreements Table  
  We distinguish genuine disagreements from verbal differences. **Verbal disagreements** concern the *meaning* of "probability" or its *job description*: F defines probability as a *long-run frequency* in repeatable trials; B defines it as a *rational degree of belief* given information. **Genuine disagreements** involve substantive claims about inference.  

  | # | (a) Formulation of Disagreement                                                                                                | (b) The Crux                                                                                           | (c) Test/Case/Argument                                                                                                 | (d) Predictions                                                                                                                                 |  
  |---|------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------|  
  | 1 | **Reference Class Problem**:<br>F: Probability requires a well-defined reference class (e.g., "mortality rate of 50-year-old smokers"). Ambiguity in class selection is a practical issue, not a flaw in the theory.<br>B: Probability is always conditional on specific information. The "problem" reflects legitimate uncertainty in selecting relevant conditions for belief. | Is probability *inherently* tied to a physical reference class (F) or a state of knowledge (B)? | **Test**: Assign a probability to "Philosopher X will die by age 70." F must choose a reference class (e.g., "philosophers" vs. "philosophers with X’s lifestyle"). B conditions on all known traits of X. | **F**: Predicts different reference classes yield divergent probabilities, proving the need for objective class definitions.<br>**B**: Predicts coherent conditioning on all information resolves ambiguity. |  
  | 2 | **Meaning of Single-Case Probabilities**:<br>F: Single-case "probabilities" (e.g., "probability this coin lands heads") are either disguised long-run claims (if repeatable) or meaningless (if truly singular).<br>B: Single-case probabilities are meaningful as degrees of belief (e.g., "my confidence this coin lands heads is 0.5"). | Can single-case probabilities exist without reference to a collective? | **Case**: A unique event (e.g., "probability that a specific neutron decays in 10 minutes"). F treats it as a property of a collective of identical neutrons; B assigns belief based on quantum theory. | **F**: Predicts only collective-based probabilities are empirically verifiable.<br>**B**: Predicts single-case beliefs guide rational decisions (e.g., betting) even for unrepeatable events. |  
  | 3 | **Justification of Prior Probabilities**:<br>F: Priors are arbitrary without frequency-based grounding (e.g., historical data). Unjustified priors introduce subjectivity.<br>B: Priors are justified as formalizations of rational initial beliefs (via symmetry, maximum entropy, or expert judgment). | Can priors be objectively grounded (F) or are they inherently subjective yet rational (B)? | **Argument**: Use a flat prior for an unknown parameter (e.g., the fraction of water on exoplanet Y). F demands calibration to physical frequencies; B argues flat priors maximize uncertainty absent information. | **F**: Predicts misspecified priors cause systematic errors in long-run performance.<br>**B**: Predicts coherent updating ensures posterior robustness with sufficient data. |  
  | 4 | **Role of Probability in Scientific Inference**:<br>F: Probability controls long-run error rates (e.g., p-values, confidence intervals). Beliefs about hypotheses are not probabilistic.<br>B: Probability quantifies belief in hypotheses (e.g., posteriors). Long-run properties are secondary to coherence. | Should inference prioritize error control over repeated trials (F) or belief quantification given data (B)? | **Test**: Replicate a drug efficacy study 100 times. Compare frequentist error rates (e.g., % of false positives) vs. Bayesian belief calibration (e.g., % of 95% credible intervals containing the true effect). | **F**: Predicts frequentist methods outperform in error control with fixed significance levels.<br>**B**: Predicts Bayesian methods yield more accurate beliefs per-study via priors and updating. |  

