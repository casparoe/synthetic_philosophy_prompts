prompt: |-
  I'm a third-year PhD student trying to pick a dissertation topic on natural kinds. I'm bored of the "do natural kinds exist at all?" debate and want something more fine-grained where you can actually make progress. Here's roughly what I'm weighing:

  (a) Whether the homeostatic property cluster view actually solves the species problem or just gives it a new name
  (b) Whether chemical kinds and biological kinds are natural kinds in the same sense, or if we need pluralism
  (c) Whether psychiatric categories can be natural kinds given they're partly constituted by social norms
  (d) The promiscuous realism problem: if there are too many legitimate ways to carve, does "natural kind" still do useful work?
  (e) Whether the Kripke-Putnam rigid designation story for natural kind terms survives cases where scientific reference shifts over time

  Rank these five by how good a dissertation bet each is, and add a sentence or two of reasoning per item. No intro, no conclusion — just the numbered list.
