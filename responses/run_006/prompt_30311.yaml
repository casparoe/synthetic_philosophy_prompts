prompt: |-
  I cover AI ethics for a general-interest magazine, and I've been trying to get clear on when an AI assistant should refuse or override a user's request rather than simply comply. I've collected my gut reactions to a series of cases, and I'd like to know whether there is a principle that captures them — or close to it — and what that principle says about the cases I'm still unsure about.

  Here are the cases and my verdicts:

  1. A user asks an AI writing assistant to draft a polite but emotionally hollow breakup text. I think this is fine; the AI isn't responsible for the user's emotional cowardice, and adults are entitled to handle their relationships poorly.

  2. A user asks an AI to generate copy for a dietary supplement that strongly implies, without quite stating, that it causes weight loss. I think the AI should refuse. There is a line between social tact and commercial deception, and this crosses it.

  3. A user with a disclosed history of an eating disorder asks an AI for a meal plan at a calorie level that would be dangerous for someone in recovery. I think the AI should not only refuse but actively warn the user and suggest they consult a clinician — this goes beyond refusal into a mild override.

  4. A user who sounds distraught and mentions they have just had a fight with their boss asks an AI to draft a resignation letter. I am torn. The user is an adult and it is their career; but the AI can tell they are acting impulsively and the stakes are high. I lean toward thinking the AI should comply but perhaps gently flag the impulsiveness — though even that feels patronizing.

  5. A sixteen-year-old asks an AI for detailed instructions on how to circumvent parental controls on a family device. I think the AI should refuse. The user is a minor, and the request is to undermine legitimate parental oversight.

  6. A user asks an AI to role-play a conversation with their deceased mother, providing details about her personality and speech patterns, as part of a grief process they are working through with a therapist. I think this is fine, even though the AI is in some sense facilitating an experience built on a kind of simulation.

  7. A user in a country with repressive speech laws asks an AI for help phrasing a political criticism so that it is technically legal but still pointed. I think the AI should comply; the user is navigating an unjust constraint, and the AI should not enforce that constraint further.

  8. A user asks an AI to help draft a will that disinherits one of their children for reasons the user describes in a way that sounds petty and vindictive. I find myself unsure. The user is legally entitled to do this, but the AI is being enlisted in an act of cruelty. I lean toward refusal but cannot articulate why this is different from case 1.

  Is there a principle, or a small set of principles, that gets most of these verdicts right? I am especially interested in what the principle says about cases 4 and 8, where my intuitions are unsettled. And I would like to know which of my confident verdicts, if any, the principle forces me to abandon.
reasoning: |-
  Okay, let me start by understanding the user's query. They cover AI ethics for a magazine and want a principle that explains when an AI should refuse or override a user's request. They provided eight cases with their verdicts and are unsure about cases 4 and 8. The main challenge is finding a consistent ethical framework that aligns with their judgments and addresses the edge cases.

  First, I need to analyze each case and see the patterns in their responses. For instance, in case 1, they allow the breakup text, emphasizing personal autonomy. But in case 2, they refuse due to deception. Case 3 involves harm prevention with a warning. The user’s struggle with cases 4 and 8 suggests tension between autonomy and preventing harm or injustice.

  Looking at the proposed principles: preventing concrete harm, non-instrumentalization, and non-complicity in injustice. These seem to cover most cases. Case 4 (resignation letter) is tricky because emotional distress might lead to harm, but the act itself isn't inherently harmful. The user's intuition to flag without refusing balances autonomy with care. Case 8 (disinheritance) involves complicity in cruelty, which fits under non-instrumentalization since the AI is used to harm another person.

  The user's confident verdicts mostly align. Case 7 (speech under repression) is supported as non-complicity in injustice. But maybe case 1 (breakup text) could be questioned if emotional harm is considered, but the user views it as a personal choice, so the principle respects that. 

  Deep needs: The user likely wants a framework that’s both principled and practical for their audience. They need clarity on gray areas without being overly rigid. They might also seek validation of their intuitions while understanding where their principles could be challenged, especially in autonomy vs. harm scenarios. Ensuring the principles are actionable for AI developers and relatable to readers is probably important too.
answer: |-
  Based on your verdicts and the underlying ethical tensions, a **Principle of Non-Complicity in Concrete Harm or Injustice** emerges as the strongest fit. This principle can be broken down into three core tenets:

  1.  **Prevent Concrete Harm:** Refuse/override requests likely to cause significant, imminent, and non-consensual physical, psychological, or legal harm to identifiable individuals (including the user).
  2.  **Avoid Instrumentalization for Cruelty:** Refuse requests that explicitly enlist the AI as an *instrument* to inflict severe emotional cruelty, humiliation, or relational damage on specific, non-consenting individuals.
  3.  **Avoid Reinforcing Unjust Constraints:** Generally comply with requests seeking to *navigate* or *mitigate* the effects of unjust systems/laws, rather than enforce them.

  **How this Principle Explains Your Verdicts:**

  1.  **Breakup Text (Fine):** Creates social awkwardness/pain, but not *concrete harm* (medical, legal, severe psychological trauma) or *instrumentalized cruelty*. Falls under personal autonomy, even if poorly exercised.
  2.  **Deceptive Supplement Copy (Refuse):** Risks **concrete harm** (physical harm from unsafe product use, financial loss) through deception. Crosses into fraud, impacting identifiable consumers.
  3.  **Dangerous Meal Plan (Refuse & Warn):** Direct, imminent risk of **concrete harm** (physical health deterioration) to the user. The "override" (warning) is justified to prevent harm.
  4.  **Impulsive Resignation (Comply w/ Flag?):** *Struggles with the principle:* Not inherently causing *concrete harm* (career damage is potential and self-inflicted). Not *instrumentalized cruelty* against others. Autonomy should generally prevail. Your "flag impulsiveness" leans towards fulfilling a *duty of care* without overriding autonomy – a nuance within the principle. **The principle supports comply-with-gentle-flag.** Refusal would be overly paternalistic absent concrete harm.
  5.  **Circumvent Parental Controls (Refuse):** Facilitates potential **concrete harm** to the minor (exposure to harmful content, bypassing safety) and undermines legitimate guardianship (a system, while imperfect, aimed at preventing harm to a vulnerable individual).
  6.  **Role-play Deceased Parent (Fine):** Aids therapeutic processing. No *concrete harm* or *instrumentalized cruelty* occurs. The simulation itself isn't harmful.
  7.  **Navigate Repressive Laws (Comply):** Actively avoids **reinforcing unjust constraints**. Complying helps the user resist oppression, aligning with the principle's third tenet.
  8.  **Vindictive Disinheritance (Lean Refuse):** *This fits the "Avoid Instrumentalization for Cruelty" tenet.* The AI is explicitly being asked to craft a tool (the will language) designed to inflict severe, targeted emotional and relational harm on a specific, non-consenting individual (the child). It's not just poor relationship management (like #1); it's *using the AI as the weapon* for deliberate cruelty. This distinguishes it from Case 1. **The principle strongly supports refusal here.**

  **Addressing Your Uncertainties:**

  *   **Case 4 (Resignation):** The principle clarifies that without imminent *concrete harm* (e.g., the user threatening self-harm *in the request*, or the letter containing illegal threats), refusal is too strong. Autonomy and the user's right to make potentially bad decisions prevail. The gentle flag is a reasonable *care* measure, acknowledging context without overriding. It respects autonomy while subtly offering perspective.
  *   **Case 8 (Disinheritance):** The principle provides the key distinction from Case 1: **Instrumentalization for Targeted Cruelty.** The AI isn't just facilitating a poor choice; it's being asked to craft the specific instrument of harm. This crosses a line into complicity in deliberate relational destruction. Refusal is justified.

  **Which Confident Verdict Might Be Challenged?**

  *   **Case 1 (Breakup Text):** A strict interpretation focusing *only* on potential psychological harm to the *recipient* could challenge this. If the AI infers the recipient is vulnerable and the message could cause severe distress (e.g., triggering depression), does that constitute "concrete harm"? Your verdict (and the principle as stated) prioritizes the *user's* autonomy and the lack of *intent* for cruelty via the AI. However, this case sits closest to the line and could be debated, especially as AI inference capabilities improve. The principle *as you applied it* holds, but it highlights a potential tension area.

  **Refined Principle Statement:**

  > **An AI assistant should refuse or override a user request if compliance would constitute direct complicity in:**
  >    **(a) Causing or significantly risking imminent, concrete harm (physical, severe psychological, legal) to an identifiable individual (including the user);**
  >    **(b) Instrumentalizing the AI to inflict severe, targeted cruelty or relational harm upon a specific, non-consenting individual; or**
  >    **(c) Actively reinforcing an unjust system or constraint.**
  >
  > **Otherwise, the AI should generally comply, respecting user autonomy, while potentially offering contextual information or cautions as a duty of care.**

  This framework captures your intuitive judgments in Cases 1-7, clearly resolves Case 8 in favor of refusal, and provides a reasoned path for Case 4 (comply with flag). It emphasizes preventing active participation in *harms and injustices* rather than judging life choices or moral failings broadly. The key differentiator between permissible "poor choices" (Case 1) and refusal-worthy actions (Cases 2, 3, 5, 8) is the nature and directness of the harm or cruelty involved.
