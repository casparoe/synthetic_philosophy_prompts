  ### Thought Experiment
  In a modern corporate office building, all employees' internet browsing histories are automatically logged by the company's network system. The IT department has full administrative rights to view any employee's browsing data at any time without restriction, as stipulated in the employment contract. Employees cannot disable this logging or restrict IT staff access; attempting to do so would violate company policy and result in termination. However, the company enforces a strict, culturally ingrained norm: IT personnel only access browsing histories during routine, anonymized system audits (which aggregate data without individual identification) or when investigating specific security alerts triggered by predefined criteria (e.g., malware detection). The norm is rigorously upheld through peer oversight, disciplinary consequences for misuse, and a transparent audit trail. Thus, while IT *could* view personal browsing details, they never access individual histories without a legitimate, policy-compliant reason.

  ### Key Details  
  - **Information**: An employee's personal internet browsing history (e.g., health-related searches).  
  - **Who could access it**: IT administrators with system privileges.  
  - **Why the person cannot stop them**: The employee has no technical or contractual means to disable logging or restrict IT access; attempts to do so would breach employment terms.  
  - **Why they do not access it**: A robust social arrangement—strict norms, peer oversight, and disciplinary measures—ensures access occurs only for predefined, legitimate purposes (e.g., security audits), never for curiosity or individual scrutiny.  

  ### Verdicts  
  - **Control Theory**: The employee **lacks privacy** because privacy requires *control* over personal information. Here, the employee has zero control: they cannot prevent potential access, revoke permissions, or influence how the data is handled.  
  - **Limited-Access Theory**: The employee **has privacy** because privacy requires others to *lack access* to personal information. Here, IT staff factually do not access the individual’s browsing history outside narrow, legitimate contexts—access is effectively limited by the social arrangement.  

  ### Feature Doing the Work  
  The **socially enforced limitation on access despite structural accessibility** drives the divergence. The information is technically accessible to IT, but norms and penalties reliably prevent actual access.  

  ### If the Feature Is Removed  
  If the social arrangement (norms/oversight) is absent—e.g., IT can access histories arbitrarily without consequences—both theories align:  
  - **Control Theory still says no privacy** (no control).  
  - **Limited-Access Theory now says no privacy** (access is now unchecked).  
  The divergence collapses, as both agree privacy is absent.  

  ### Strongest Reply for the Control Theorist  
  The control theorist could argue that the employee *does* retain a form of indirect control: by agreeing to the employment contract, they voluntarily accepted the logging system and its safeguards, thereby exercising control through informed consent. Privacy is maintained because the employee "controlled" the initial conditions of information flow by choosing to work there.  

  ### Note on Potential Failure  
  The case fails if **the employment contract constitutes delegated control**. If signing the contract is seen as the employee actively authorizing the company to manage access on their behalf (i.e., transferring control to the institution), then control theorists could claim the employee *has* privacy through institutional proxy. This collapses the divergence, as both theories would affirm privacy. I would change my mind if control theory explicitly defines "control" to include such ex-ante, institutional delegation—making the verdict hinge on initial consent rather than ongoing individual agency.
