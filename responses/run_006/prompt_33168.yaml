  Prioritizing the questions: The first one about whether the objection is distinct from distributive issues seems foundational. If it's just about distribution, then prioritarianism might solve it. But if it's deeper, about aggregation itself, that changes everything. This question is upstream because it affects how we approach other solutions. It's tractable through conceptual analysis and cases like transplant or utility monster. If resolved, it could simplify or redirect the entire project.

