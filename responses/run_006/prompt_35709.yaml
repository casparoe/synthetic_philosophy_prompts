  I'm a decision theory PhD student and I'm putting together a handout for our grad reading group on descriptive models of choice under risk. I want a "which model of risk preferences do you actually hold?" sorting quiz: 8–10 questions, each a concrete choice between two (or three) money lotteries, plus a scoring key that maps answer patterns to leaves. It should sort people by the choices they make, not by which theory they think sounds right, so no question should mention the independence axiom or ask anything like "are you a rank-dependent utility person." Everything has to run through the lottery choices.

  Build it from the logical space rather than from a list of names. The dimensions I care about are: whether someone reverses across the common-consequence structure of the original Allais pair; whether they also reverse across a common-ratio pair (and whether that reversal is the subproportional one); whether their choices shift when gambles involve losses or mixed gain–loss outcomes rather than pure gains; whether their choices shift when they'll be told what the foregone option would have paid (which should matter for regret theory but not for the outcome-based models); and whether they violate first-order stochastic dominance or transitivity. Then locate the named positions in that space and mark the empty cells, with a sentence on whether each is empty because the view is incoherent, unattractive, or just unexplored.

  Leaves I need: expected utility (EU), rank-dependent utility (RDU, Quiggin-style probability weighting with no reference point), cumulative prospect theory (CPT, RDU plus sign-dependent weighting and loss aversion), regret theory (Loomes–Sugden style), and a residual "no stable model fits you" leaf. If you think Machina-style generalized expected utility with fanning out deserves its own leaf, add it, but say honestly whether your items can actually seperate it from RDU—if not, flag that.

  Required cases: the original Allais common-consequence pair (1A: $1,000,000 for sure vs 1B: 89% $1,000,000, 10% $5,000,000, 1% nothing; 2A: 11% $1,000,000, 89% nothing vs 2B: 10% $5,000,000, 90% nothing); a common-ratio pair like Kahneman and Tversky's (sure $3,000 vs 80% chance of $4,000, then 25% chance of $3,000 vs 20% chance of $4,000); at least one mixed gain–loss pair where CPT's loss aversion is doing work that RDU's probability weighting alone can't (e.g., a 50–50 chance of +$200 or −$100 vs a sure $0); and at least one regret-theory item where the same pair is offered with and without feedback about the foregone option. Flag any pairs of leaves the quiz can't separate, and say what extra question would pull them apart.

  Start the response with the quiz itself, no preface or commentary, then the scoring key, then the notes on empty cells and inseparability.
