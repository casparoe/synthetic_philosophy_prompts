  ### Risk Preference Sorting Quiz  
  *Choose one option for each question.*  

  1. **Option A:** $1,000,000 for sure.  
     **Option B:** 89% chance of $1,000,000, 10% chance of $5,000,000, 1% chance of $0.  

  2. **Option A:** 11% chance of $1,000,000, 89% chance of $0.  
     **Option B:** 10% chance of $5,000,000, 90% chance of $0.  

  3. **Option A:** $3,000 for sure.  
     **Option B:** 80% chance of $4,000, 20% chance of $0.  

  4. **Option A:** 25% chance of $3,000, 75% chance of $0.  
     **Option B:** 20% chance of $4,000, 80% chance of $0.  

  5. **Option A:** 50% chance of +$200, 50% chance of -$100.  
     **Option B:** $0 for sure.  

  6. *(No feedback about foregone outcomes)*  
     **Option A:** 50% chance of $1,000, 50% chance of $0.  
     **Option B:** $500 for sure.  

  7. *(You will learn what the foregone option paid)*  
     **Option A:** 50% chance of $1,000, 50% chance of $0.  
     **Option B:** $500 for sure.  

  8. **Option A:** $100 for sure.  
     **Option B:** 99% chance of $100, 1% chance of $0.  

  ---

  ### Scoring Key  
  Record your choices for Questions 1–8, then follow these steps:  

  1. **Dominance violation check:**  
     - If you chose **B in Q8**, you are assigned to:  
       **"No stable model fits you"** (violates dominance).  
     - *Otherwise, proceed.*  

  2. **Regret reversal check:**  
     - If you chose **A in Q6** and **B in Q7**, you are assigned to:  
       **Regret Theory** (choices shift with feedback).  
     - *Otherwise, proceed.*  

  3. **Expected Utility (EU) check:**  
     - If **all** of the following apply:  
       - **Q1/Q2:** *Either* (A in both) *or* (B in both).  
       - **Q3/Q4:** *Either* (A in both) *or* (B in both).  
       - **Q6/Q7:** Same choice (both A or both B).  
       - You passed Q8 (chose A).  
       You are assigned to: **Expected Utility (EU)**.  
     - *Otherwise, proceed.*  

  4. **Rank-Dependent Utility (RDU) check:**  
     - If **all** of the following apply:  
       - **At least one reversal:** (A in Q1 and B in Q2) *and/or* (A in Q3 and B in Q4).  
       - **No regret reversal:** Same choice in Q6 and Q7.  
       - **Mixed gamble:** Chose **A in Q5**.  
       - You passed Q8 (chose A).  
       You are assigned to: **Rank-Dependent Utility (RDU)**.  
     - *Otherwise, proceed.*  

  5. **Cumulative Prospect Theory (CPT) check:**  
     - If **all** of the following apply:  
       - **At least one reversal:** (A in Q1 and B in Q2) *and/or* (A in Q3 and B in Q4).  
       - **No regret reversal:** Same choice in Q6 and Q7.  
       - **Mixed gamble:** Chose **B in Q5**.  
       - You passed Q8 (chose A).  
       You are assigned to: **Cumulative Prospect Theory (CPT)**.  

  6. **Residual category:**  
     - If none of the above fits your choices, you are assigned to:  
       **"No stable model fits you"**.  

  ---

  ### Notes on Models and Logical Space  
  - **Expected Utility (EU):** Satisfies independence (no Allais/common-ratio reversals), outcome-based (no feedback effects), obeys dominance.  
  - **Rank-Dependent Utility (RDU):** Allows Allais/common-ratio reversals via probability weighting, but no loss aversion/sign-dependence (accepts mixed gamble) and no feedback effects.  
  - **Cumulative Prospect Theory (CPT):** Allows Allais/common-ratio reversals *and* rejects mixed gambles due to loss aversion. No feedback effects.  
  - **Regret Theory:** Choices shift when feedback about foregone outcomes is provided (Q6 → Q7 reversal). May or may not show other reversals.  
  - **"No stable model fits you":** Violates dominance (Q8), shows non-standard reversals (e.g., B in Q1 + A in Q2), or has incompatible patterns (e.g., reversals + regret sensitivity).  

  #### Empty Cells and Inseparability:  
  - **Machina-style models** (e.g., fanning-out): Not separated from RDU here. Both explain Allais/common-ratio reversals; add a question testing the *betweenness* axiom (e.g., a 50-50 mix of two lotteries vs. the lotteries themselves) to pull them apart.  
  - **EU with loss aversion:** Not isolated. A loss-averse EU maximizer rejecting Q5 would be misassigned to CPT; add a question testing linearity (e.g., $300 for sure vs. 80% chance of $400) to clarify.  
  - **Regret + CPT:** No leaf for this combination. Regret reversal (Q6→Q7) is prioritized; if present, loss aversion (Q5) is not evaluated.  
  - **Opposite reversals** (e.g., B in Q1 + A in Q2): Rare and unattractive; assigned to residual.  
  - **No reversal + regret reversal:** Covered by regret theory.  
  - **RDU/CPT without reversals:** Not observed empirically; assigned to residual unless they fit EU.
