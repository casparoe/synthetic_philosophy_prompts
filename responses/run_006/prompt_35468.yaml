prompt: |-
  ive been trying to figure out what i think about aggregation in ethics — you know, the whole torture vs dust specks thing, whether a zillion mild headaches outweighs one person being tortured. every paper i read seems to just pick an intuition and build a theory around it, and i dont want to go further down rabbit holes without knowing what the terrain actually is. so: what does a theory of aggregation have to get right? give me the desiderata list. the cases it has to handle (the original thought experiment obviously, but also the continuum versions where you dial intensity up gradually, and the ones where the harms are spread across different lives vs piled into one). the formal constraints — transitivity, separability, independence, whatever — and which of these it can permissibly ditch if it tells a good story about why. the distinctions it cant afford to collapse (like many small harms to different people vs many small harms to the same person — those feel different but maybe they shouldnt). and the thing i most want: are there pairs of desiderata that cant be jointly satisfied? if the requirements list itself is inconsistent, that changes everything. a quick scorecard of the main views against the list would be nice but the list is what i actually need.
reasoning: |-
