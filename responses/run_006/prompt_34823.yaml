     - Accidental right actions (e.g., helping someone by mistake) lack moral worth.

  5. **The central debate about moral worth concerns the nature of the motivation required.** Specifically, we disagree on whether the agent must be motivated by the thought of duty (duty-first) or by the features that make the action right (right-reasons), which may or may not be conceptualized as duties.

