  ### Disagreement 2: The sufficiency of acting from duty for moral worth
  - (a) 
    - Duty-first: Acting from the motive of duty is sufficient for moral worth (provided that the action is right and the duty is genuine).
    - Right-reasons: Acting from the motive of duty is not sufficient for moral worth because the agent might be acting on the thought of duty without being responsive to the underlying right-making reasons.

  - (b) Crux: Can an agent who acts from the motive of duty but is not responsive to the underlying right-making reasons (e.g., because they have a mistaken view of what the right-making reasons are) have moral worth?

  - (c) Test case: **The Miserable Philanthropist (modified)**: Suppose a person helps others only because they believe it is their duty, but they have a deeply mistaken view about why it is a duty. For example, they believe that helping others is a duty because it pleases a malevolent god who will punish them if they don't. The action is right (helping others) and done from the motive of duty, but the agent's conception of duty is based on a bad reason. 
    - Duty-first prediction: The action has moral worth because the agent is acting from the motive of duty (they are doing it because they believe it is morally required, even if their belief about why it is required is wrong). 
    - Right-reasons prediction: The action lacks moral worth because the agent is not motivated by the actual right-making reasons (e.g., the needs of others) but by a distorted reason (appeasing a malevolent god).

  ### Disagreement 3: The necessity of acting from duty in cases where the agent has mixed motives
  - (a) 
    - Duty-first: In cases where the agent has both a motive of duty and other motives (like sympathy), the action has moral worth only if the agent acts from the motive of duty (i.e., the motive of duty must be the determining ground of the action).
