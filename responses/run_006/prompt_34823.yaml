answer: |-
  ### Adversarial Collaboration Document: Moral Worth in Moral Psychology

  #### **Agreed Claims**  
  We, representatives of the "duty-first" and "right-reasons" views, affirm the following substantive points of agreement about moral worth. These are not platitudes but reflect core shared commitments:  

  1. **Moral worth is distinct from moral rightness**. An action can be morally right (e.g., helping someone in need) yet lack moral worth if done for objectionable motives (e.g., solely for a reward). Conversely, moral worth presupposes that the action is morally right (or at least, the agent justifiably believes it to be right).  
  2. **Moral worth is motivationally internal**. It depends solely on the agent’s reasons for acting, not on external outcomes, luck, or accidental success.  
  3. **Moral worth is necessary for deep moral creditworthiness**. It is the property that makes an action praiseworthy in a way that reflects the agent’s moral character, beyond mere permissibility.  
  4. **Actions done from self-interest or fear lack moral worth**. If an agent helps others only to avoid punishment or gain a advantage, the action lacks moral worth, regardless of its rightness.  
  5. **Agreed verdict on Kant’s cold-duty case**: The agent who helps others solely from duty, despite feeling no sympathy, acts with moral worth. Both views concur this agent deserves moral credit.  
  6. **Agreed verdict on the selfish benefactor**: An agent who donates to charity solely for public recognition (a self-interested motive) performs a right action but lacks moral worth.  
  7. **The debate centers on the "why" of motivation**. We disagree not on whether motivation matters, but on *which kind* of motivation grounds moral worth: duty as a formal motive (duty-first) or responsiveness to the situation’s right-making features (right-reasons).  
  8. **Moral worth is not reducible to intuition, emotion, or social consensus**. Both views reject subjectivist or relativistic accounts of creditworthiness.  

  ---

  #### **Disagreements Table**  
  Each row outlines a core disagreement. For each:  
  - **(a)** states the precise formulation each side endorses.  
  - **(b)** identifies the crux—the pivotal sub-question that, if resolved, would settle (or significantly advance) the disagreement.  
  - **(c)** presents a concrete test case both sides accept as relevant to the crux, along with predictions.  

  | Disagreement | Duty-first formulation (a) | Right-reasons formulation (a) | Crux (b) | Test case (c) | Duty-first prediction | Right-reasons prediction |
  |--------------|----------------------------|-------------------------------|----------|---------------|-----------------------|--------------------------|
  | **1. Necessity of duty-belief** | An action has moral worth only if the agent is motivated by the belief that the act is morally required (i.e., "I do X because it is my duty"). | An action has moral worth if the agent is motivated by the features that actually make X right (e.g., "I do X to alleviate suffering"), even if the agent denies X is a duty. | Must the agent conceptualize their motive *as a duty* to have moral worth? | **Case: "Huck Finn Revisited"**<br>Agent helps a victim of injustice solely out of empathy for their pain, while falsely believing (due to flawed upbringing) that the action is morally forbidden. The action is objectively right. | No moral worth: Agent lacks duty-belief, so motivation is non-moral (merely emotional). | Moral worth: Agent acts for the right-making reason (alleviating injustice/suffering), regardless of false duty-belief. |
  | **2. Sufficiency of duty-motivation** | Acting from duty is sufficient for moral worth if the action is right, even if the agent is ignorant of the deeper right-making reasons. | Acting from duty is insufficient for moral worth if the agent fails to respond to the underlying right-making features (e.g., focuses on rules while ignoring context). | Does moral worth require responsiveness to the specific features that make the action right? | **Case: "Rigid Rule-Follower"**<br>Agent keeps a promise to meet a friend, motivated solely by "duty is duty." Unbeknownst to them, the friend is in crisis and needs support. The agent would keep the promise even if they knew the friend didn’t care. Action is right. | Moral worth: Motive of duty suffices; agent need not grasp contextual reasons. | No moral worth: Agent is rigidly fixated on rules, not the right-making features (e.g., friendship, need). |
  | **3. Moral worth in conflict cases** | When inclinations (e.g., sympathy) conflict with duty, moral worth requires overriding inclinations to act from duty. Acting *with* inclination but *without* duty lacks moral worth. | Moral worth requires acting for the right-making reasons; inclinations can carry moral worth if they track those reasons, even when duty is absent or rejected. | Can actions driven solely by non-duty motives (e.g., empathy) have moral worth if they align with right-making reasons? | **Case: "Spontaneous Compassion"**<br>Agent sees a stranger in distress and helps immediately out of visceral empathy, with no conscious thought of duty. The action is right. | No moral worth: Lack of duty-motivation reduces this to amoral impulse. | Moral worth: Empathy here responds to the right-making reason (suffering), so it is creditworthy. |

  ---

  #### **Verbal Disagreement Assessment**  
  We conclude that **no part of the dispute is purely verbal**. Both views use "moral worth" to denote the property that makes an action deeply praiseworthy due to the agent’s motivations. However, the disagreement is substantive because:  
  - The duty-first view ties moral worth to *moral self-awareness* (acting because one recognizes an action as obligatory).  
  - The right-reasons view ties it to *moral responsiveness* (acting because of features that objectively justify the action).  
  This yields divergent verdicts in cases like Huck Finn or Spontaneous Compassion, confirming the conflict is not terminological.  

  ---

  \boxed{\text{The debate over moral worth hinges on whether creditworthiness requires motivation by duty as a formal principle or by the right-making reasons in the world, with disagreements testable through cases of false belief, rule rigidity, and spontaneous compassion.}}
