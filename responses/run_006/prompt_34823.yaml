  # Adversarial Collaboration on Moral Worth

  ## Agreed Claims

  We, the undersigned, representing the duty-first and right-reasons views, agree on the following substantive claims regarding moral worth:

  1. **Moral worth is distinct from moral rightness.** An action can be morally right without having moral worth (e.g., if done for the wrong reasons), and an action must be morally right to have moral worth.

  2. **Moral worth is a property of actions that depends solely on the agent's motivation for performing the action.** Specifically, it concerns the reasons for which the agent acts.

