prompt: |-
  Got into a long argument last night with a friend about whether someone who gives away most of their income is doing something above and beyond or just doing what everyone owes. This morning I remembered i'm leading a fifty-minute intro ethics section next week, and the topic is supererogation. Don't explain supererogation to me; plan how I should teach it. The students are first-years, they've done one unit on utilitarianism and one on Kant, and they mostly think an act is either required, permitted, or wrong, end of story. I need the order of ideas: what has to be in place before the concept even makes sense, and what depends on what. I also want the one carrying example I should build the whole session around — and if you don't think the standard soldier-jumping-on-a-grenade case is right for this, say why not and tell me what the example has to have and has to lack. What misconceptions should I expect them to form, and exactly where in the sequence should I head each one off? I'm especially worried they'll collapse the category into the idea that if an act is best, it's required, or on the other side make supererogatory acts sound merely optional in the sense of no reason to do them. I also know there's something I should openly leave out at this level — maybe the whole Kantian objection that there cant be a category beyond duty — but I want you to tell me what to leave out and how to say so. And give me one question I can ask in the last five minutes to check whether they actually got the distinction rather than just repeating the word.
reasoning: |-
  Okay, let me tackle this ethics teaching dilemma. The user needs a structured 50-minute intro on supererogation for first-years who only see acts as required/permitted/wrong. 

  First, the foundational gap: students need to grasp that moral frameworks can have "moral surplus" beyond duty. The grenade example might backfire because its extreme sacrifice could make supererogation seem irrelevant to daily life. Instead, a wealth redistribution case - like someone donating 75% income - better shows voluntary goodness without implying recklessness. 

  Key misconception alert: students will likely equate "best action" with "required action." Must preempt this when contrasting utilitarianism (where supererogation struggles) with Kantian perfect/imperfect duties. Need to explicitly plant warning signs like: "If you're thinking 'but shouldn't we always do the best thing?' - hold that thought for our next pivot."

  For sequencing: start by destabilizing their tripartite framework with the donation example. Make them debate whether it's obligatory or just nice. Then formally define supererogation with four criteria (good, optional, praiseworthy, costly). Crucially, have them test examples against all four criteria simultaneously - this prevents the "merely optional" misconception.

  What to omit? Full Kantian objections about duties being sufficient. Just acknowledge that some philosophers reject the category without diving into why. Say: "We're bracketing whether 'beyond duty' is conceptually coherent - that's for advanced seminars."

  Final comprehension check: pose "What's the difference between not blameworthy (permissible) and actively praiseworthy?" Their answers must show they grasp the extra layer of positive evaluation beyond mere allowance.
answer: |-
  Here’s a structured 50-minute lesson plan focused on conceptual clarity, sequencing, and addressing misconceptions. I’ll flag key moves as we go.

  ---

  ### **Core Objective:**  
  Establish supererogation as a *distinct moral category* (praiseworthy but not obligatory) and show why it’s philosophically interesting.

  ---

  ### **Lesson Sequence & Key Moves:**

  #### **1. Warm-Up: Destabilize the Tripartite Framework (5 mins)**
     - **Question:** *"If you see someone drop a $20 bill, is it morally wrong to keep it? Permissible? Required to return it?"*  
       (Students default to required/permitted/wrong categories.)  
     - **Pivot:** *"What if you sprint after them in the rain, miss your bus, and get sick to return $20? Still* required *or something else?"*  
       *(Planting seed: some acts feel "beyond" duty.)*

  #### **2. Build Foundations: What Makes Supererogation Possible? (10 mins)**  
     **MUST establish first:**  
     - **Moral Latitude:** Not all morally significant acts are obligatory (contrast utilitarianism’s demandingness vs. Kant’s imperfect duties).  
     - **Praiseworthiness ≠ Obligation:** Praise can attach to acts not blameworthy to omit (e.g., Kant’s "friend of humanity" vs. dutiful friend).  
     - **Cost Matters:** Supererogation involves *significant sacrifice* (time, risk, resources).  

  #### **3. The Central Example: Wealth Redistribution (Builds on their prior units)**  
     - **Why NOT the soldier:**  
       Extreme sacrifice (death) can make supererogation seem heroic/rare, not everyday-relevant. Risk of students conflating it with "duty in emergencies."  
     - **Proposed Example:**  
       *"Clara earns $100,000/year. She lives minimally, donates 75% to effective charities, volunteers weekends, and adopts foster children. Is she doing what morality* requires *or something else?"*  
     **Why this works:**  
       - Connects to utilitarianism (maximizing good) and Kant (beneficence as imperfect duty).  
       - Involves sustained sacrifice (not one-off heroism).  
       - Avoids life/death stakes (focuses on moral category, not psychology).  
       - Relatable tension: "Should we *all* do this?"

  #### **4. Define Supererogation + Criteria (5 mins)**  
     Explicitly state:  
     - **1. Morally Good** (promotes welfare, virtue, etc.).  
     - **2. Not Obligatory** (omission isn’t blameworthy).  
     - **3. Morally Praiseworthy** (exceeds baseline duty).  
     - **4. Involves Sacrifice** (personal cost).  
     **Test Clara’s case against criteria.**

  #### **5. Address Misconceptions Proactively (15 mins)**  
     | **Misconception**                | **When to Address**          | **How to Counter**                                                                 |
     |----------------------------------|------------------------------|------------------------------------------------------------------------------------|
     | **"If it’s best, it’s required"** | After defining criteria       | *"Utilitarianism might say Clara’s act is best, but is it* enforceable *as duty? Would we blame someone who donates 10%? Why/why not?"* |
     | **"Just optional = no reason"**  | When discussing praiseworthiness | *"Is Clara’s act merely 'not wrong'? Why might we admire her more than someone who donates 5%?"* (Highlight meriting *praise*). |
     | **Collapse into imperfection**   | Contrasting with Kant         | *"Kant’s imperfect duties allow flexibility (help* some *people), but Clara helps* many *at high cost. Does Kant have a category for* extra credit*?"* |

  #### **6. What to Omit & How**  
     - **Kant’s Denial of Supererogation:** *"Some philosophers (like Kant) argue duties already encompass all moral worth. We’re bracketing that debate today to explore why others think ‘beyond duty’ is a useful category."*  
     - **Controversial Examples (e.g., self-sacrifice):** Stick to Clara to avoid distracting debates about autonomy/heroism.  
     - **Religious Roots:** Not needed for conceptual clarity here.

  #### **7. Comprehension Check Question (Last 5 mins)**  
     *"Imagine Jay saves a stranger’s life by donating a kidney. Tina gives a coworker a sincere compliment. Which act (if either) is supererogatory? Why isn’t the other?"*  
     **Why this works:**  
     - Kidney donation: Clear sacrifice, optional, praiseworthy (meets all 4 criteria).  
     - Compliment: Praiseworthy but trivial cost → not supererogatory (fights "any nice act = supererogatory").  
     - Tests grasp of *sacrifice* and *praiseworthiness beyond baseline*.

  ---

  ### **Why This Sequence Works:**  
  1. **Starts from student intuitions** but disrupts binaries early.  
  2. **Builds necessary concepts** (latitude, praise, cost) *before* defining supererogation.  
  3. **Example is "unpackable"** across utilitarianism/Kant/sacrifice.  
  4. **Preempts collapse errors** by separating "obligatory," "permissible," and "praiseworthy" early.  
  5. **Final question** diagnoses if they distinguish supererogation from minor kindnesses/heroic obligations.

  **Tip:** Use live polling (if available) for Clara’s case: "Required? Permitted? Something else?" Spot-check evolving understanding mid-session.
