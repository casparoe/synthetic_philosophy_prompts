prompt: |-
  so my philosophy professor summarized Moore's paradox in lecture the other day, and i wrote it down but now i'm wondering if it was oversimplified. here's what he said, roughly:

  "Moore noticed that a sentence like 'it's raining, but i don't believe it's raining' is logically incoherent — it can't possibly be true. because when you assert the first part, you're committing yourself to believing it's raining, and then the second part takes that commitment back. so it's a kind of performative contradiction, like saying 'i promise to come but i don't intend to.' Moore thought this revealed that assertion isn't just reporting on the world — it's also expressing a belief, and that's built into the very act of asserting. so you can't assert p without, in some sense, expressing that you believe p."

  i don't know, something about the phrase 'logically incoherent' and 'can't possibly be true' bothers me because i've heard people say the sentence isn't actually a contradiction — it can be true, it's just weird to say it. and i'm not sure moore himself would have said assertion is partly constituted by belief. can you walk me through what's right and what's wrong in that summary? like, which parts would a philosopher who works on moore's paradox nod along with, which parts would they say are subtly off, and what does the paradox actually show if the summary gets some of it wrong?
