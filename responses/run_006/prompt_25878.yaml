prompt: |-
  A couple of weeks ago I was at a pub with two mates from uni, and things got properly heated between them over something that happened at work. One of them, Callum, works in sales and had just closed a deal by telling a client that a competitor's product had been 'recalled twice in the last three years.' Which is true — but what Callum knew and didn't say is that both recalls were for a trivial labelling issue that posed zero safety risk, and that his own company's product had actually had a more serious (but unpublicised) issue around the same time. The client clearly took 'recalled twice' to mean the product was dangerous, and Callum let them run with it.

  When Callum told the story, our other mate Jess basically called him a liar. Callum pushed back hard: every sentance he uttered was true, he never said the product was dangerous, and the client was free to ask follow-ups. Jess said that's exactly what makes it worse — he's using the literal truth as a shield while doing all the same work a lie would do, except now he also gets to feel clever about it. Callum said that can't be right because then basically all of social life would be immoral: we all manage what we reveal, we all let people draw their own conclusions, and drawing a hard line at 'literally false' at least gives us a clear rule. Jess came back with: so if I ask you whether you ate the last biscuit and you say 'I've been in the other room all afternoon' — which is true, but you nipped in and ate it two minutes ago — you haven't lied to me? Callum said that's different because the biscuit case involves a direct question and a reasonable expectation of a straight answer, whereas his client was an adult doing business and should know to be sceptical. Jess said he was just moving the goalposts: first the rule was 'nothing I said was false,' now suddenly context and expectations matter, so the rule wasn't actually doing the work he claimed it was. At that point they both turned to me and I had absolutley nothing useful to say.

  It's been rattling around in my head since. They both made points that feel right but I can't hold them all at once. Can you go through their exchange move by move and say who's right about what — not just who wins overall, but which specific claims hold up and which don't? And if there's a sensible middle position that neither of them articulated, I'd like to know what it is. Oh, and please write in British English — I'm sending this on to a couple of people and we're all in the UK.
reasoning: |-
  Okay, the user presents a complex ethical debate between friends Callum and Jess about truthfulness in sales tactics. The core issue revolves around whether technically true but misleading statements constitute dishonesty. 

  First I need to unpack the layers here. The pub argument has three dimensions: ethical (is this deception?), practical (how do we define lying in business?), and interpersonal (how their disagreement unfolded). The user wants a move-by-move analysis rather than a simple verdict, which suggests they've appreciated the nuance in both positions.

  Hmm, Callum's defense rests on three pillars: literal truth (no false statements), client autonomy (they didn't ask follow-ups), and industry norms (business skepticism expected). But Jess attacks each: she reframes truthfulness as requiring context, argues deception harms regardless of intent, and exposes contradictions in his "literal truth" rule with the biscuit analogy. 

  The biscuit example is particularly clever - it proves that even in personal contexts, we recognize truthful evasion as dishonest when there's clear expectation of transparency. That's why Callum suddenly invokes "context" here, undermining his own initial absolutism. Jess is right to call this goalpost-moving.

  What neither addressed sufficiently is proportionality. In high-stakes commercial decisions, omitting material information (like the trivial recall reason) feels more unethical than, say, dodging a biscuit accusation. The FCA's "clear, fair and not misleading" standard captures this well - it's not just about factual accuracy but about preventing false impressions. 

  The user's friends represent two common but incomplete frameworks: Callum's legalistic minimalism ("technically correct") versus Jess's intentionalist approach ("you meant to deceive"). The middle path would be: truthfulness requires assessing both factual accuracy and the listener's reasonable understanding. In sales contexts especially, creating false impressions through selective truth-telling violates fair dealing principles, even if every syllable is factual.

  I should emphasize how Jess's critique exposes the bad faith in Callum's position - his satisfaction at "feeling clever" suggests he knows this isn't entirely above board. The "shield" metaphor is spot-on: he's using precision as camouflage. 

  For the UK context, referencing the Consumer Protection Regulations feels relevant - commercial practices that distort economic behavior are unlawful regardless of literal falsehood. That gives Jess's position stronger legal footing than Callum's.
answer: |-
  Right, let's break this down move by move in proper British English. Both made valid points, and both had weaknesses - the truth (fittingly) isn't entirely one-sided. Here's the dissection:

  1.  **The Incident:**
      *   **Callum:** Tells client competitor's product was "recalled twice in the last three years." (Technically true).
      *   **Callum:** Knows but omits that recalls were trivial (labelling) and his own product had a more serious, unpublicised issue.
      *   **Result:** Client clearly infers the competitor's product is dangerous, Callum doesn't correct this.

  2.  **Jess's Opening Accusation:**
      *   **Jess:** Calls Callum a "liar."
      *   **Assessment:** **Partially Valid, Partially Weak.** While Callum's *intent* was deceptive, Jess's accusation is technically inaccurate *if* we define "lying" strictly as uttering a false statement. Callum didn't utter a falsehood. Jess's *underlying point* (that it was deceptive and wrong) is strong, but the *label* "liar" is arguably too blunt and invites the literal defence.

  3.  **Callum's First Defence:**
      *   **Callum's Points:**
          *   "Every sentence was true." (Factual).
          *   "Never said it was dangerous." (Factual).
          *   "Client was free to ask follow-ups." (Factual, but ethically questionable).
      *   **Assessment:** **Superficially Strong, Ethically Weak.** His statements *were* factually correct. The client *could* have asked more questions. However, this defence ignores:
          *   **Intent:** He clearly *intended* the client to infer danger.
          *   **Omission of Material Context:** Omitting *why* the recalls happened and *his own product's issue* distorted the truth, making the factual statement highly misleading. In business, omitting material facts known to be relevant to the decision is often considered a "misrepresentation by omission."
          *   **Abuse of Trust:** Sales relies on a degree of trust; exploiting that trust by creating false impressions is unethical, even without uttering falsehoods.

  4.  **Jess's Counter: The Core Ethical Argument**
      *   **Jess's Points:**
          *   He's using literal truth as a "shield."
          *   The statement does "all the same work a lie would do" (creates false belief).
          *   He gets to "feel clever about it."
      *   **Assessment:** **Very Strong.** Jess cuts to the heart of the ethical problem: **Intentional Deception.** The *effect* and the *intent* are identical to telling an outright lie ("Their product is dangerous"). The fact it's done through selective truth-telling doesn't magically make it ethical; it makes it *calculated* deception. The "feeling clever" point highlights the bad faith – he knows he's misleading them. This isn't just managing what you reveal; it's actively constructing a misleading picture.

  5.  **Callum's Broader Defence: The "Social Life" Argument**
      *   **Callum's Point:** If Jess is right, then "basically all of social life would be immoral" because we all manage what we reveal and let people draw conclusions. He suggests a "hard line at 'literally false'" gives a clear rule.
      *   **Assessment:** **Weak and Overreaching.** This is a false equivalence and a slippery slope fallacy.
          *   **Scale & Stakes:** Social niceties ("Do I look fat in this?") involve trivial omissions to avoid hurt feelings. Callum's omission materially affected a significant business decision with potential financial consequences. The *impact* matters.
          *   **Intent:** Social omissions often aim to *avoid harm* or maintain harmony, not to *gain unfair advantage* through deception.
          *   **The "Clear Rule" Fails:** As Jess immediately demonstrates with the biscuit.

  6.  **Jess's Counter: The Biscuit Analogy**
      *   **The Scenario:** Jess asks "Did you eat the last biscuit?". Callum says "I've been in the other room all afternoon" (true, but he snuck in and ate it 2 mins ago).
      *   **Jess's Point:** Is this *not* lying?
      *   **Assessment:** **Strong and Devastating.** This perfectly exposes the flaw in Callum's "literal truth" rule. It's clearly deceptive. The literal statement is true, but it's designed to mislead Jess into a false conclusion ("He couldn't have eaten it"). It directly parallels Callum's sales tactic: answering a question (implied in the sales context: "Is there a reason I shouldn't buy the competitor?") with a technically true but materially misleading statement. We all recognise this *is* dishonest.

  7.  **Callum's Distinction: "Context and Expectations"**
      *   **Callum's Point:** The biscuit case involves a direct question and a "reasonable expectation of a straight answer." His client is "an adult doing business" who "should know to be sceptical."
      *   **Assessment:** **Contradictory and Self-Defeating.**
          *   **Contradiction:** This completely undermines his earlier "hard line at literally false" rule. He now admits context (direct question, reasonable expectation of a straight answer) *does* matter. Jess is right – he *is* moving the goalposts. His initial rule ("I said nothing false") wasn't sufficient to justify his action, so he had to invent a new, context-dependent rule.
          *   **Weak Justification:** While business *does* require more scepticism than a chat about biscuits, it doesn't absolve someone from *intentional deception*. Business ethics still condemn misleading statements and material omissions (see: Financial Conduct Authority principles like "clear, fair and not misleading"). Expecting scepticism doesn't give you carte blanche to manipulate. Trust is *still* a necessary component of efficient business.

  8.  **Jess's Final Point: "Moving the Goalposts"**
      *   **Jess's Point:** Callum has abandoned his original rule ("nothing false said") and now relies on context/expectations, proving the original rule wasn't sufficient.
      *   **Assessment:** **Entirely Correct.** This is the logical knockout blow to Callum's initial defence. His attempt to distinguish the biscuit case implicitly concedes that literal truth alone isn't enough to ensure ethical communication. Context, intent, and reasonable expectations *are* crucial factors.

  **Who's Right About What?**

  *   **Callum is right that:**
      *   He uttered no literally false statements. (Factually correct, but ethically insufficient).
      *   Business contexts require more inherent scepticism than personal ones. (Generally true, but doesn't excuse deception).
  *   **Jess is right that:**
      *   Callum's action was intentionally deceptive and had the same effect as a lie. (Core ethical point).
      *   He was using literal truth as a shield for bad faith behaviour.
      *   The biscuit analogy exposes the dishonesty inherent in such tactics.
      *   Callum contradicted himself by abandoning his "literal truth" rule when challenged with the biscuit example, proving that rule was inadequate ("moving the goalposts").
      *   Context, expectations, and intent *do* matter in determining whether communication is truthful or deceptive.

  **The Sensible Middle Position (Neither Quite Articulated):**

  The ethical standard isn't merely **"Don't say false things"** (Callum's initial, flawed rule) or an impossibly broad **"Reveal everything and prevent any possible misunderstanding"** (which Callum wrongly implied Jess was advocating).

  **The sensible middle is: "Do not intentionally create false beliefs through selective truth-telling or material omissions, especially where there is a reasonable expectation of transparency."**

  *   **Key Elements:**
      1.  **Intent:** Was the primary purpose to mislead? (Callum's clearly was).
      2.  **Materiality:** Was the omitted information significant enough to likely change the listener's decision or understanding? (The *reason* for the recalls and Callum's *own product's issue* were highly material).
      3.  **Reasonable Expectations:** What would a reasonable person expect to be disclosed in this context? (In sales, disclosing known, material drawbacks of competitors *when you raise them yourself* and material risks of your own product is a reasonable expectation of fair dealing. In answer to a direct question like "Did you eat the biscuit?", a straight answer is expected).
      4.  **Good Faith:** Are you acting with honesty and integrity, or trying to "get away with" deception? (Callum's "feeling clever" remark betrays bad faith).

  Callum violated this standard: he intentionally used a selective truth to create a materially false belief in the client's mind about the competitor's product, while withholding material negative information about his own. The biscuit example also violates it for the same reasons.

  Jess won the core ethical argument and exposed the flaw in Callum's reasoning. Callum was clinging to a technicality ("not literally false") to justify behaviour that any reasonable person would recognise as deceptive and sharp practice. The sensible rule isn't about *never* omitting anything, but about *not using omission or selective truth to intentionally mislead on material points*. That's the difference between polite discretion and calculated deception. Callum was doing the latter.
