  Hmm... their core request is unusually precise. They want a comprehensive list of desiderata before evaluating any specific solutions. Not just technical requirements but also philosophical trade-offs. The phrase "job description for a theory" really stands out - they're essentially asking for functional specifications. 

  I notice they're particularly concerned about contradictory requirements ("which bullet to bite"). That suggests they've already glimpsed impossibility results and want them mapped systematically. Smart approach - if you can't satisfy all desiderata, you need to know which ones are breakable.

  The user seems philosophically sophisticated but mathematically cautious. They mention friends and literature, so probably grad-student level or very engaged autodidact. Their examples (Pareto, anonymity paradoxes) show they've done background reading but feel the presentations skip fundamentals. 

  Key challenges in structuring this:
  First, must distinguish absolute dealbreakers from nice-to-haves. For example, "must handle actual infinities" is non-negotiable for the domain, while "must use real numbers" isn't.
  Second, need to flag inherent tensions clearly - like how strong Pareto plus anonymity already causes trouble in infinite settings.
  Third, should categorize requirements by problem type (population ethics vs. spacetime ethics vs. decision theory) since different infinities create distinct issues.

  Biggest landmine: The user wants "the full list" but that's impossible - new thought experiments keep emerging. So I'll frame it as "core requirements" with the major paradoxes that any theory must address. Should explicitly note this isn't exhaustive.

  Most satisfying part will be the impossibility results section. They explicitly asked for where requirements clash, and things like the Pareto/anonymity conflict or the rearrangement paradox really show why this isn't just about choosing fancy math. 

  Final output needs that single-sentence payoff they requested. Something that captures how infinite ethics forces us to abandon completeness or universality - maybe about "managing trade-offs" rather than "solving"...
answer: |-
  Here is a comprehensive list of desiderata for an adequate theory of infinite ethics, derived from core ethical intuitions, paradox avoidance, and mathematical constraints. Requirements are categorized, with **non-negotiable constraints** (★★★), **strongly desirable properties** (★★), and **negotiable preferences** (★). Inherent tensions are flagged.

  ### I. Core Domain Requirements (What the Theory Must Handle)
  1.  **Infinite Populations:** Must evaluate worlds with infinitely many moral patients (e.g., infinitely many future humans, digital minds, aliens). (★★★)
  2.  **Infinite Spatiotemporal Extent:** Must handle worlds existing infinitely far into the future and/or across infinite space (e.g., eternal universes, multiverses). (★★★)
  3.  **Infinite Value Density:** Must accommodate worlds where value per unit space/time is unbounded (e.g., infinitely intense bliss/suffering at points). (★★★)
  4.  **Mixed Infinities:** Must consistently compare worlds combining different types of infinities (e.g., finite population/duration vs. infinite population/duration vs. infinite density). (★★★)
  5.  **Finite Subsets & Changes:** Must meaningfully relate to finite sub-worlds and localized changes within infinite structures (e.g., improving a finite region). (★★★)

  ### II. Ethical Intuitions & Principles (What the Theory Should Respect)
  6.  **Strong Pareto:** If World A is identical to World B except at least one individual is better off in A and no individual is worse off, then A is better than B. (★★★) *[But see tensions below]*
  7.  **Weak Pareto:** If *every* individual is better off in World A than in World B, then A is better than B. (★★★)
  8.  **Anonymity (Basic):** The *identity* of individuals doesn't matter, only their welfare levels. Permuting welfare states across individuals shouldn't change the overall value. (★★) *[See tensions]*
  9.  **Non-Imposition (Minimal Benign Addition):** Adding individuals with lives worth living (positive welfare), without affecting others, should not make the world *worse*. (★★) *[Negotiable strength: "should be better" vs. "not worse"]*
  10. **Avoidance of the Repugnant Conclusion:** Should not *force* the conclusion that a world with a vast multitude of lives barely worth living is better than a world with a smaller, extremely flourishing population, especially when infinities are involved. (★★) *[But finite-domain RC might be unavoidable]*
  11. **Rejection of Strictly Dominated Worlds:** If World A has higher welfare than World B for *every* individual, A must be better than B (re-stating Weak Pareto). (★★★)
  12. **Sensitivity to Location (Rejection of Pure Rearrangement):** Merely rearranging welfare states across an infinite space/time *without changing the multiset of welfare levels* should not turn a bad world into a good one or vice versa. (★★) *[See tensions with Anonymity]*
  13. **Asymmetry (Very Negotiable):** Many argue adding individuals with lives *not* worth living (negative welfare) makes the world worse, while adding individuals with lives worth living might be neutral or good. This is highly contentious even in finite ethics. (★)

  ### III. Decision-Theoretic & Practical Requirements
  14. **Comparability:** Should establish a *complete*, transitive preference ordering over a wide range of possible worlds (ideally all conceivable ones). (★★) *[But impossibility results suggest relaxing to partial orders]*
  15. **Action Guidance (Feasibility):** Should yield non-arbitrary, actionable recommendations (or clear incommensurability) for realistic choices involving potential infinities (e.g., existential risk mitigation, large-scale colonization). (★★)
  16. **Consistency with Finite Ethics:** Should reduce to standard finite-population utilitarianism (or other chosen base theory) when populations/durations are finite. (★★★)
  17. **Invariance to Description:** Should not depend on arbitrary choices like labeling of locations or the mathematical representation of infinity. (★★★)

  ### IV. Paradox Avoidance (What the Theory Must Not Do)
  18. **Dissolve the Paradise Paradox:** Adding an individual with a life worth living to an infinite paradise shouldn't make it worse (challenges some naive aggregation). (★★)
  19. **Dissolve/Manage the (Infinite) Mere Addition Paradox:** Adding a group (finite or infinite) of individuals with lives worth living shouldn't make the world worse, nor lead to contradictions via chains of additions. (★★)
  20. **Handle the (Infinite) Sadistic Conclusion:** Should not recommend creating large numbers of individuals with lives barely worth living *over* preventing the existence of individuals with very negative lives, if infinities allow such comparisons. (★★)
  21. **Avoid Value Inversion:** Should not allow a world strictly better than another by Pareto to be judged as worse overall. (★★★)
  22. **Manage the Rearrangement Paradox:** Should not judge a world as good merely because suffering is "evenly distributed" or "diluted" infinitely, nor condemn a world merely because bliss is concentrated. (★★) *[Tied to Sensitivity to Location]*
  23. **Avoid Infinitary Paralysis:** Should not render all (or too many) actions morally equivalent or incomparable due to infinities. (★★)

  ### V. Mathematical Constraints
  24. **Consistency:** Must be mathematically coherent and internally consistent (e.g., no contradictions derived from the axioms). (★★★)
  25. **Constructivity (Ideal):** Should be definable within a foundational system (e.g., ZFC set theory) without relying on highly non-constructive axioms. (★) *[Hyperreals require Ultrafilters (weak AC), Surreals are class-sized]*
  26. **Robustness (Ideal):** Results should not be overly sensitive to infinitesimal changes or pathological representations. (★)

  ### Key Tensions & Impossibility Results
  *   **Pareto vs. Anonymity in Infinite Settings:** Strong Pareto + Strong Anonymity lead to contradictions (e.g., worlds where every pairwise swap makes it worse, but the fully permuted world is identical). *Resolution requires weakening one.*
  *   **Completeness (Total Order) vs. Intuitions:** Achieving a complete ordering over *all* infinite worlds often requires sacrificing strong intuitions like Non-Imposition or avoiding the Repugnant Conclusion, or using mathematically exotic structures that lack action guidance.
  *   **Sensitivity to Location vs. Anonymity:** Pure anonymity suggests only the *multiset* of welfare states matters, not their arrangement. Sensitivity to Location (rejecting pure rearrangement) requires that arrangement *does* matter. *Resolution requires either abandoning pure anonymity or finding a principled way to incorporate location/spatiotemporal structure.*
  *   **Additivity Breakdown:** Standard summation (Σ) fails for infinite sets. Any aggregation method (hyperfinite sums, integration, density measures, etc.) will violate some intuitive principle (e.g., Non-Imposition, Pareto, Sensitivity) in some scenarios. *There is no universally satisfactory "sum".*
  *   **Independence of Description:** Achieving invariance often clashes with the need to define aggregation procedures that require structure (e.g., a measure, an ordering of locations).

  ### Summary of Non-Negotiables vs. Negotiable
  *   **Non-Negotiables (★★★):** Handling core infinities (1-4), relating to finite subsets/changes (5), Weak Pareto (7), Rejection of Strictly Dominated Worlds (11), Internal Consistency (24), Consistency with Finite Ethics (16), Invariance to Description (17).
  *   **Strongly Desirable but Potentially Sacrificeable (★★):** Strong Pareto (6), Anonymity (8), Non-Imposition (9), Avoiding RC/Sadistic Conclusion (10, 20), Sensitivity to Location (12), Comparability (14), Action Guidance (15), Paradox Avoidance (18-23).
  *   **Negotiable Preferences (★):** Strength of Non-Imposition (9), Asymmetry (13), Constructivity (25), Robustness (26).

  **The fundamental challenge of infinite ethics is that no theory can satisfy all desirable intuitive principles simultaneously; adequacy requires carefully managing unavoidable trade-offs between ethical intuitions and mathematical coherence.** \answer{An adequate theory of infinite ethics must coherently handle core infinities while managing inevitable trade-offs between conflicting ethical intuitions and mathematical constraints, prioritizing non-negotiable consistency and finite reduction over universal comparability or full adherence to all intuitive principles.}
