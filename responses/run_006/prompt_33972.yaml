prompt: |-
  The problem of logical omniscience is usually posed as a defect of possible-worlds and Bayesian models: they represent agents as certain of every logical truth and closed under logical consequence, which no finite reasoner is. Before I evaluate the proposed fixes, I want the specification of what a fix must accomplish. Write the desiderata for a theory of the beliefs or credences of a logically bounded agent. For each requirement, give the case or consideration that makes it a requirement, and mark which requirements are non-negotiable and which are commitments of a particular research program rather than constraints on any adequate theory. Address at least the following: distinguishing failure to draw an inference from believing the negation of its conclusion; preserving some modest closure, such as modus ponens or conjunction elimination, without reinstating full classical closure; making sense of how an agent can rationally learn a logical truth or update on discovering that one of their beliefs entails another; stating how much of probabilism survives once logical omniscience is dropped, including whether credences over logically equivalent propositions must coincide and whether tautologies must receive credence one; and avoiding a theory so permissive that any pattern of belief, however incoherent, counts as rational. If some subset of these requirements cannot be jointly satisfied, identify it and explain why.
reasoning: |-
  We are to set out desiderata for a theory of beliefs or credences for a logically bounded agent, addressing the points given. We must consider:

  1. Distinguishing failure to draw an inference from believing the negation of its conclusion.
  2. Preserving some modest closure (like modus ponens or conjunction elimination) without full classical closure.
  3. Making sense of learning a logical truth or updating on discovering that one belief entails another.
  4. Stating how much of probabilism survives (including credences over logically equivalent propositions and tautologies having credence one).
  5. Avoiding a theory that is too permissive (so that not every incoherent pattern is rational).

  We'll also note which requirements are non-negotiable and which are program-specific, and if some requirements conflict we must identify and explain.

  Let's break down each requirement:

  ### 1. Distinguishing failure to draw an inference from believing the negation of its conclusion

  **Requirement:** The theory must allow that an agent can fail to believe a conclusion that follows from their beliefs without thereby believing the negation of that conclusion.

  **Case/Consideration:** Consider an agent who believes P and believes P→Q but has not yet put these together to conclude Q. We do not want to say that the agent therefore believes ¬Q. This is a common scenario in human reasoning.

  **Non-negotiable:** This seems non-negotiable for a realistic theory. Without it, we would have to attribute to the agent an implausible level of awareness and consistency.

  ### 2. Preserving modest closure without full classical closure

  **Requirement:** The theory should include some form of closure under basic inferences (e.g., modus ponens, conjunction elimination) but not require closure under all classical logical consequences.

  **Case/Consideration:** Without any closure, the theory would not capture the normative force of logic. For example, if an agent believes P and P→Q, then upon considering Q, they ought to believe Q. But we do not require that the agent has already considered and believed every consequence.

  **Non-negotiable vs Program-specific:** Having at least some closure (like modus ponens) is non-negotiable for a normative theory of rationality. However, the exact form of closure might be program-specific. For instance, some theories might require closure under immediate inferences but not complex ones.

  ### 3. Making sense of learning logical truths and updating on entailment

  **Requirement:** The theory should explain how an agent can rationally come to believe a logical truth they previously did not believe, and how they update when they discover that one of their beliefs entails another.

  **Case/Consideration:** 
  - **Learning a logical truth:** An agent might not initially realize that (P ∨ ¬P) is true, but upon reflection, they come to accept it. How does the theory model this?
  - **Updating on entailment:** Suppose an agent believes A and then discovers that A entails B. How should they update their belief in B? They might not have believed B before, but now they should.

  **Non-negotiable:** This is non-negotiable for a dynamic theory of belief. Without it, we cannot model logical learning.

  ### 4. Surviving parts of probabilism

  We break this into subpoints:

  #### a. Credences over logically equivalent propositions
  **Requirement:** Should the theory require that logically equivalent propositions have the same credence?

  **Case/Consideration:** In classical probability, if A and B are logically equivalent, then P(A)=P(B). But a bounded agent might not recognize the equivalence. However, once they do, they should assign the same credence. The issue is whether the theory requires the equality even before the agent recognizes the equivalence.

  **Non-negotiable:** It is non-negotiable that once the agent recognizes the equivalence, they should adjust their credences to be equal. But it is acceptable (and necessary) to allow that before recognition, the credences might differ.

  #### b. Tautologies having credence one
  **Requirement:** Should the theory require that every tautology has credence one?

  **Case/Consideration:** In classical probability, every tautology has probability 1. But a bounded agent might not recognize a complex tautology. However, if they are certain of the axioms and rules, then they should assign credence 1 to every tautology they have derived. But what about ones they haven't?

  **Non-negotiable:** It is non-negotiable that the agent should assign credence 1 to a tautology once they recognize it as such. But before recognition, they might assign less. However, note that if the agent is using a probability function, then even without recognizing a tautology, their credence function might assign 1 to it (if it is a standard probability function). But we are dropping omniscience so we might allow non-standard assignments.

  **How much survives?** We want to preserve as much of probabilism as possible without logical omniscience. This might include:
  - The probability axioms for the agent's current state, but without requiring that the agent has assigned probability 1 to every tautology and 0 to every contradiction that they haven't recognized.
  - Updating by conditionalization, but with the caveat that conditional probabilities might be undefined for conditionals the agent hasn't considered.

  A common approach is to use a set of probability functions (representing the agent's epistemic state) or to allow non-standard probability assignments (like allowing P(tautology)<1 until the agent recognizes it).

  ### 5. Avoiding excessive permissiveness

  **Requirement:** The theory must not be so permissive that any pattern of belief, no matter how incoherent, is deemed rational.

  **Case/Consideration:** Without constraints, the theory would be vacuous. We need some normative force. For example, an agent who believes P, believes P→Q, and believes ¬Q should be considered irrational.

  **Non-negotiable:** This is non-negotiable for a normative theory.

  ### Identifying potential conflicts

  One potential conflict is between allowing the agent to fail to assign probability 1 to a tautology (until they recognize it) and the requirement that tautologies must have probability 1 in standard probability. We resolve this by relaxing the standard probability axioms for bounded agents.

  Another conflict might arise between closure and boundedness: if we require closure under modus ponens, then whenever the agent believes P and P→Q, they must believe Q. But what if they haven't put the two together? We can handle this by making closure a dynamic norm: the agent is required to believe Q when they attend to P and P→Q and the connection between them.

  ### Summary of Desiderata

  1. **Distinguish failure from disbelief:** 
     - Non-negotiable: Yes.
     - Description: The theory must not equate failure to infer with disbelief in the conclusion.

  2. **Modest closure:**
     - Non-negotiable: Yes, for basic inferences (when the agent has the relevant beliefs and attends to the inference).
     - Description: Closure under at least modus ponens and conjunction elimination, but only when the agent is in a position to draw the inference (i.e., when the premises are believed and the agent considers the connection). Full classical closure is not required.

  3. **Logical learning and updating on entailment:**
     - Non-negotiable: Yes.
     - Description: The theory must provide mechanisms for updating beliefs upon learning logical relations.

  4. **Surviving parts of probabilism:**
     - **Credences for equivalent propositions:** 
          - Non-negotiable: The agent must assign the same credence to logically equivalent propositions *once they recognize the equivalence*. Before recognition, they may not.
     - **Tautologies:**
          - Non-negotiable: The agent must assign credence 1 to a tautology *once they recognize it as a tautology*. Before recognition, it is acceptable if they don't.
          - However, note that in a standard Bayesian framework, tautologies always have credence 1. So if we are to drop omniscience, we must relax this. One way is to allow that the agent's credence function does not have to assign 1 to every tautology, but then we must have a mechanism for updating when a tautology is recognized.

     Additionally, we might require that the agent's credences satisfy the probability axioms for the fragment of the language they have considered? Or we might use a non-standard probability model (like a set of probability functions, or a non-additive measure).

  5. **Avoiding excessive permissiveness:**
     - Non-negotiable: Yes.
     - Description: The theory must have normative force and rule out clearly irrational patterns.

  ### Potential Conflict

  The main conflict is between the requirement that tautologies must have credence 1 (a core tenet of probabilism) and the boundedness requirement that an agent may not recognize a complex tautology. We cannot simultaneously require that every tautology has credence 1 (without exception) and allow that an agent might not assign 1 to a tautology they haven't recognized. Therefore, we must relax the probabilism requirement: we only require that the agent assigns credence 1 to the tautologies they have recognized and that they update appropriately when they learn a new tautology.

  Alternatively, we might maintain that the agent's credence function is a standard probability function over the entire language, but then we face the omniscience problem. To avoid that, we might model the agent as having a credence function that is defined only over a limited set of propositions (the ones they have considered) and then extend it when new propositions are considered. This is the approach of "finite probabilistic models".

  ### Conclusion

  We have outlined the desiderata. The non-negotiable ones are:

  - Distinguishing failure to infer from disbelief.
  - Having at least some closure (like modus ponens) for attended inferences.
  - Accounting for logical learning and updating on entailment.
  - Requiring that once a logical equivalence or tautology is recognized, the credences adjust appropriately.
  - Not being overly permissive.

  The relaxation of the requirement that tautologies always have credence 1 (even when not recognized) and that equivalent propositions always have the same credence (until recognized) is a necessary concession to boundedness.

  A theory that satisfies all these might use a model that:
  - Represents the agent's current set of considered beliefs or credences.
  - Includes a mechanism for updating when the agent draws an inference or learns a logical fact.
  - Allows for the possibility that the agent has not yet considered all consequences, so that the credence function might not be defined on every proposition, or might not satisfy the probability axioms for propositions not yet considered.

  However, note that some of these desiderata are challenging to meet simultaneously. For instance, preserving modus ponens as a strict requirement (when the agent has the premises and attends to the inference) and avoiding omniscience requires that the agent does not have to believe every consequence in advance, but must form the belief when they attend to the inference. This is a dynamic requirement.

  Overall, the desiderata are jointly satisfiable if we design the theory to be dynamic and to account for the agent's current state of attention and logical awareness.
answer: |-
  Below, I specify the desiderata for a theory of beliefs or credences for a logically bounded agent, addressing each requirement outlined in the query. For each, I provide the motivating case or consideration, indicate whether it is non-negotiable or program-specific, and discuss potential conflicts. The desiderata aim to balance realism (acknowledging cognitive limitations) with rationality (preserving normative standards). I conclude by identifying a key conflict.

  ### **Desiderata for a Theory of Logically Bounded Agents**
  #### 1. **Distinguishing Failure to Infer from Disbelief in the Conclusion**  
     - **Requirement**: The theory must allow that an agent can fail to believe a conclusion entailed by their current beliefs without believing the *negation* of that conclusion.  
     - **Motivating Case**: An agent believes \(P\) and \(P \rightarrow Q\) but has not yet considered \(Q\). They do not believe \(Q\) due to oversight or computational limits, but they also do not believe \(\neg Q\) (which may be inconsistent with their other beliefs). Equating non-belief with disbelief would misattribute irrationality.  
     - **Status**: **Non-negotiable**. This is fundamental to avoiding pathological misrepresentation of bounded agents. Without it, the theory collapses all ignorance into contradiction.  

  #### 2. **Modest Closure Without Full Classical Closure**  
     - **Requirement**: The theory must enforce closure under basic, immediate inferences (e.g., modus ponens, conjunction elimination) for *attended* beliefs, but not require closure under complex or unrecognized entailments.  
     - **Motivating Case**: When an agent explicitly believes \(A \land B\), they should believe \(A\) upon minimal reflection (conjunction elimination). However, they need not believe all remote consequences (e.g., a complex theorem derivable from \(A \land B\) in 100 steps).  
     - **Status**: **Non-negotiable for modest closure**; **program-specific for scope**. All adequate theories must handle "easy" inferences to avoid trivializing rationality. The *extent* of closure (e.g., whether it applies to probabilistic modus ponens) may vary by program (e.g., Bayesian vs. syntactic models).  

  #### 3. **Rational Learning of Logical Truths and Entailments**  
     - **Requirement**: The theory must explain how agents:  
       (a) Rationally update upon learning a new logical truth (e.g., discovering that \(\neg(P \land \neg P)\) is a tautology).  
       (b) Update beliefs upon discovering an entailment (e.g., learning \(A \models B\) when they already believe \(A\)).  
     - **Motivating Cases**:  
       - (a) An agent initially assigns \(\text{credence} < 1\) to a complex tautology \(T\) (e.g., a long disjunction). After proving \(T\), they raise their credence to 1.  
       - (b) An agent believes \(A\) and later realizes \(A \models B\). They then come to believe \(B\) (or raise their credence in \(B\)).  
     - **Status**: **Non-negotiable**. A theory lacking this cannot model logical growth, a core aspect of bounded rationality. Updates must avoid ad hocness (e.g., via logical conditioning or belief revision operators).  

  #### 4. **Survival of Probabilism**  
     - **Requirements**:  
       (a) **Logically equivalent propositions**: Credences need not coincide *until* equivalence is recognized, but must coincide after recognition.  
       (b) **Tautologies**: Credence 1 is not required for unrecognized tautologies, but must hold once recognized.  
       (c) **Probability axioms**: Kolmogorov axioms (non-negativity, additivity, normalization) apply only to propositions within the agent's "considered set" (those explicitly represented).  
     - **Motivating Cases**:  
       - (a) An agent assigns \(\text{cred}(P) = 0.7\) and \(\text{cred}(\neg\neg P) = 0.5\) due to not recognizing double-negation elimination. This is permissible until they learn the equivalence, after which credences must align.  
       - (b) An agent may assign \(\text{cred}(A \lor \neg A) = 0.9\) if \(A \lor \neg A\) is complex, but must set it to 1 upon proof.  
       - (c) Additivity (\(\text{cred}(A \lor B) = \text{cred}(A) + \text{cred}(B)\) for exclusive \(A, B\)) holds only if the agent grasps the exclusivity.  
     - **Status**: **Non-negotiable for recognition-triggered alignment**; **program-specific for axioms**. Credences *must* respect logic post-recognition to avoid irrationality. The suspension of axioms for unrecognized propositions is necessary for boundedness. Full probabilism (e.g., all tautologies at credence 1) is abandoned, but a "local" probabilism survives for the agent's current epistemic state.  

  #### 5. **Avoiding Excessive Permissiveness**  
     - **Requirement**: The theory must include normative constraints that rule out blatantly irrational states (e.g., believing \(A\) and \(\neg A\) simultaneously, or violating modus ponens for attended beliefs).  
     - **Motivating Case**: An agent who believes \(P\), \(P \rightarrow Q\), and \(\neg Q\) (while attending to all) is irrational. A theory allowing this as "bounded" would be vacuous.  
     - **Status**: **Non-negotiable**. Without this, the theory cannot distinguish rationality from irrationality, undermining its purpose. Constraints need not require global consistency but must prohibit local incoherence.  

  ### **Conflict Identification: Why Not All Desiderata Can Be Fully Satisfied**  
  The **recognition-triggered requirements** (e.g., credence alignment upon learning equivalence) and **modest closure** conflict with **avoiding permissiveness** in edge cases:  
  - **Conflict**: Suppose an agent believes \(A\), and \(A\) entails \(B\) via a complex proof. They fail to believe \(B\) (due to boundedness) and also believe \(\neg B\) (e.g., due to a misconception). Modest closure does not force them to believe \(B\) (as the entailment is unattended), and the permissiveness criterion might allow this (since they haven't "recognized" the entailment). Yet this state \((A, \neg B)\) with \(A \models B\) is intuitively irrational.  
  - **Why Inevitable?** Boundedness permits ignorance of entailments, but normative ideals demand that agents not *contradict* latent knowledge. A theory cannot simultaneously:  
    - Excuse failure to draw complex inferences (boundedness),  
    - Condemn all local incoherence (non-permissiveness),  
    - And remain computationally realistic.  
    **Resolution**: The theory must "tolerate" *unrecognized* inconsistencies but enforce updates when entailments are discovered. This shifts the conflict to the dynamics of learning (Desideratum 3), where the agent must resolve contradictions upon recognition.  

  ### **Summary of Status**  
  - **Non-negotiable Desiderata**: (1) Distinguishing non-belief from disbelief, (2) Modest closure for attended inferences, (3) Learning logical truths/entailments, (5) Avoiding excessive permissiveness. These are minimal for any adequate theory.  
  - **Program-Specific Elements**: The *scope* of closure (e.g., only modus ponens vs. all Horn clauses), the *degree* of probabilism (e.g., whether additivity is always required), and the *representation* of beliefs (e.g., credences vs. binary beliefs).  
  - **Viable Theories**: Approaches like **impossible worlds** (expanding the set of worlds to include logical impossibilities) or **syntactic models** (representing beliefs as explicit sentences) can satisfy most desiderata by relaxing logical omniscience locally while preserving norms for recognized inferences. However, the conflict above necessitates tolerating temporary, unrecognized incoherence.  

  This framework ensures agents are neither idealized nor irrational, but dynamically rational within their cognitive limits.
