  The dangerous question: "What if I defect and she cooperates?" This exposes the argument's vulnerability. If such a scenario is possible, even if irrational, it breaks the symmetry. The user has to argue it's impossible, but that's tough without physical determinism.

  Concession: Acknowledge that this approach only applies under strict symmetry and common knowledge. That narrows the scope but makes it defensible within those parameters. It shows awareness of limitations without undermining the thesis.

