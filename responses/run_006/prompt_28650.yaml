prompt: |-
  I've been teaching a grad seminar on anthropic reasoning this term, and working through the standard cases has made me realize my own gut verdicts don't actually hang together. I'd rather not just pick the self-sampling assumption or the self-indication assumption by fiat; I want to know what principle, if any, captures the way I actually react, and which of my reactions I'd have to abandon. Here's where I land before I start trying to be consistent.

  In the God's coin-toss case with one observer on heads and two on tails, I wake up in a white room with no way to tell which person I am, and I want to say the coin is still 50/50. Waking up doesn't feel like evidence, since I'd wake up either way. But change the setup so tails creates a billion observers, and my gut flips: I now feel heads is basically ruled out, because a hypothesis on which a billion observers exist makes my own existence vastly more likely than one on which exactly one does. Then there's the presumptious philosopher case: two cosmological theories fit all the data equally well and are equally simple; the only difference is that one says the universe contains 200 billion observers and the other says 200 trillion. The philosopher says we should strongly favor the bigger number, just because our existence is more likely if there are more of us. My gut says that's nuts — the fact that I exist can't be evidence for a theory that says more people exist. And yet I find the doomsday argument genuinely hard to resist: if I reason as if I'm a random draw from all humans who will ever live, then finding myself around the 60-billionth human strongly favors a total of 100 billion over 100 trillion, and I cant shake the feeling that there's something to that.

  So I seem to be running the self-sampling assumption in the one-vs-two coin toss, the doomsday case, and the presumptuous philosopher case, but running the self-indication assumption in the one-vs-a-billion coin toss. Is there a principle that gets all of these, or close? If not, which verdict should I drop, and why? And what would the principle you settle on say about a case I've been avoiding: a presumptuous-philosopher setup where the two theories differ by only a factor of two, 200 billion versus 400 billion — and about a one-vs-ten coin toss? If I stay anti-presumptuous in the factor-of-two case, does that force me to give up the billion-observer verdict, or is there a way to have both without just drawing an arbitrary line somewhere?
reasoning: |-
  Okay, let's tackle this user's dilemma. They're teaching a grad seminar on anthropic reasoning and are struggling to reconcile their intuitive judgments across different thought experiments. Their gut reactions seem inconsistent: they apply the Self-Sampling Assumption (SSA) in some cases and the Self-Indication Assumption (SIA) in others. Specifically:

  In the God's coin toss with one vs. two observers, they stick with 50/50 for the coin (SSA). But when tails creates a billion observers, they flip to thinking heads is ruled out (SIA). In the Presumptuous Philosopher case (200B vs. 200T observers), they reject SIA as "nuts," yet find the Doomsday Argument (SSA-based) compelling. 

  The core tension is between observer-count sensitivity and independence from observer count. Their billion-observer reaction screams SIA, while their two-observer reaction and Doomsday/Philosopher judgments align with SSA. But SSA and SIA are fundamentally incompatible frameworks—one weights by observer count, the other doesn't.

  Now, Full Non-indexed Conditioning (FNC) might bridge this. It treats first-person observations ("I exist") as fixed background knowledge rather than evidence. This dissolves the billion-observer tension because "I exist" is equally certain under any theory where observers exist—so it shouldn't update probabilities. 

  But does this handle Doomsday? Under FNC, being the 60Bth human isn't evidence about total humans because your birth rank was inevitable. Yet intuitively, finding yourself early *feels* evidentiary. The user might need to bite the bullet here: if FNC is right, Doomsday is flawed. Alternatively, they could adopt a hybrid: use SSA for indexical uncertainty (like coin-toss awakenings) but FNC for existential facts. 

  For the factor-of-two Philosopher case, FNC would say: no update. But if the user balks, they must confront why a billion feels different. Is it magnitude alone? That suggests inconsistency. The cleanest path is embracing FNC universally—rejecting both billion-update and Doomsday—but that sacrifices strong intuitions. A compromise: use SSA when observer sets differ (coin-toss) but FNC when comparing total universe sizes (Philosopher). Still messy. 

  Ultimately, the user must choose which intuition to surrender. Keeping the billion-update while rejecting Doomsday requires accepting that "I exist" is only evidence in asymmetric cases—a slippery slope. I'd recommend FNC for coherence, even if it means overriding that visceral billion-observer reaction.
answer: |-
  Your intuitions reveal a deep tension between *indexical* and *non-indexical* updating, and resolving it requires abandoning one of your gut reactions. Here's a breakdown of the principles and how to reconcile them:

  ### Core Principles at Play
  1.  **Self-Sampling Assumption (SSA):** Reason as if you are a random observer from the *reference class* of all possible observers in your epistemic situation.
  2.  **Self-Indication Assumption (SIA):** Reason as if a theory is more likely *proportionally to the number of observers* it predicts. Your existence is evidence favoring theories with more observers.
  3.  **Full Non-Indexed Conditioning (FNC):** Treat the fact "I exist" as *fixed background knowledge*, not as evidence to update on. Only use non-indexical evidence.

  ### Your Intuitions & Their Conflicts
  *   **God's Coin Toss (1 vs 2):** FNC or SSA. "I wake up" is not evidence (FNC) or you are a random awakening (SSA). Result: 50/50. 👍
  *   **God's Coin Toss (1 vs 1e9):** SIA. The vast difference makes your existence feel like strong evidence for Tails. 👍
  *   **Presumptuous Philosopher (200B vs 200T):** Rejection of SIA. "I exist" shouldn't favor a theory just because it predicts vastly more observers. 👍
  *   **Doomsday Argument:** SSA. Reasoning from your random birth rank feels compelling. 👍

  **The Inconsistency:** You want to apply SIA (observer-count weighting) in the 1-vs-Billion case but *reject* SIA (observer-count weighting) in the Presumptuous Philosopher case. You also want to apply SSA (observer-count indifference) in the 1-vs-2 case, yet accept its observer-count-dependent implications in Doomsday.

  ### The Resolution: Full Non-Indexed Conditioning (FNC)
  FNC provides the most consistent framework *if* you are willing to abandon your gut reaction in the **1-vs-Billion case**:

  1.  **God's Coin Toss (1 vs 2):** "I exist" is background knowledge. Heads: 1 observer exists (you). Tails: 2 observers exist. Both are certain given their theory. Your specific identity/indexical fact ("which one am I?") provides no new information about the coin flip. **Verdict: 50/50.**
  2.  **God's Coin Toss (1 vs 1e9):** "I exist" is background knowledge. Heads: 1 observer exists (you). Tails: 1e9 observers exist. Both are certain given their theory. Your specific identity/indexical fact provides no new information about the coin flip. **Verdict: 50/50.** *(This requires abandoning your gut feeling that Tails is favored).*
  3.  **Presumptuous Philosopher (200B vs 200T):** "I exist" is background knowledge. Both theories entail observers exist. Observers existing is certain under both. No update occurs. **Verdict: 50/50, rejecting the Philosopher.**
  4.  **Doomsday Argument:** "I exist" is background knowledge. You *also* have the non-indexical evidence "Approximately 60 billion humans have been born so far." Under FNC, you reason about *total* humans given this data point. Models where total humans are only ~100B make "60B born so far" *less surprising* than models where total humans are 100T (where you'd expect to be born much later, on average). **Verdict: Some support for earlier Doom, but significantly weaker than under SSA.** (Your gut reaction likely overweights the indexical reasoning).

  **Why FNC is Coherent:**
  *   FNC cleanly separates *epistemic* probability (what you should believe about the world) from *indexical* facts (who/what you are in that world).
  *   "I exist" is *not* evidence about the world; it is a logical precondition for having any evidence at all. It's part of your prior, not your likelihood.
  *   Indexical uncertainty ("which observer am I?") only matters *after* conditioning on non-indexical evidence and the theory, to determine if your existence/perspective is *possible* under the theory. If it's possible, it doesn't change the probability of the theory.

  ### Addressing Your Specific Questions

  1.  **Presumptuous Philosopher (200B vs 400B):** Under FNC, **no update**. Your existence is background knowledge, equally compatible with both theories. You should assign 50/50 based on simplicity/fit/etc. *If* you find this factor-of-two case intuitively different from the factor-of-1000 case, that suggests your gut is inconsistently applying magnitude thresholds to SIA, which FNC avoids.
  2.  **God's Coin Toss (1 vs 10):** Under FNC, **50/50**. Your existence is certain under either outcome. Indexical uncertainty doesn't count as evidence about the coin.
  3.  **Can you keep the Billion-Verict?** Only by sacrificing consistency elsewhere:
      *   **Option A (Embrace SIA):** You must accept the Presumptuous Philosopher's conclusion (200T is vastly favored over 200B) and accept strong SIA-based Doomsday. This clashes with your anti-presumptuous intuition.
      *   **Option B (Hybrid):** Use SSA for cases with *observer-set differences within the experiment* (like the coin tosses) and FNC for *cosmological theories about total observers*. This is ad-hoc. Why the distinction? Your reaction to the factor-of-two Philosopher case would determine if you need a threshold (e.g., "only apply SIA for observer count ratios > X"), which is arbitrary.

  ### Recommendation: Embrace FNC and Abandon the Billion-Verict
  *   **Why:** It's the most philosophically defensible and consistent principle. It avoids the absurdity of the Presumptuous Philosopher while offering a sensible (though weaker) account of Doomsday-like reasoning based on *non-indexical* data ("N humans born so far").
  *   **The Cost:** You must accept that your strong feeling in the 1-vs-Billion case is an illusion caused by conflating indexical uncertainty with evidence about the world. The visceral sense that "I'm more likely to exist if there are more observers" is misleading under FNC; "I exist" is treated as a given, not a likelihood.
  *   **The Payoff:** A unified, non-arbitrary approach. You avoid drawing lines about "how big a ratio matters" or when observer sets are "part of the experiment" vs. "cosmological."

  **Conclusion:** Your core tension stems from wanting "I exist" to be evidence when observer counts differ *wildly* (SIA) but *not* to be evidence otherwise (rejecting SIA/FNC). FNC resolves this by declaring "I exist" is *never* evidence to update on – it's background knowledge. This requires abandoning your billion-observer verdict. The alternative is inconsistency or arbitrary thresholds. For your seminar, framing the debate around whether "I exist" constitutes *evidence* (SIA) or *background* (FNC) provides the clearest path to resolving these paradoxes.
