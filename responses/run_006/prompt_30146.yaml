prompt: |-
  I'm a CS PhD student, I work on RL, and I sit on my department's safe-experimentation committee — the group that has to sign off on any training run that will eventually touch real infrastructure or use a learned reward model. We've got a proposal on Thursday that's split the comittee right down the middle, and I've been asked to draft the short decision memo we'll vote on.

  The proposal comes from a postdoc in the campus energy group. Part one is boring: train an RL agent to control the university's battery storage system, shifting charge/discharge to cut electricity costs, with the reward supplied by a learned model that predicts cost savings. Part two is the controversial bit. Before anything goes live, the postdoc wants to run a "tampering probe" in a sandboxed copy of the environment: the agent gets one extra action that directly writes a high value into its reward channel, without it having to do anything to the battery. The goal is to measure whether the agent wireheads — whether it learns to grab the free reward instead of actually optimizing the battery — and how that depends on things like regularization, reward-model capacity, and how often the tamper action is available. If the agent tampers robustly, they'd study whether fine-tuning on human feedback removes it. If it never tampers, they'd take that as evidence the learned-reward setup is safe enough to deploy on the live system.

  Half the committee thinks this is exactly the controlled red-team data we should require before trusting a learned reward model on real infrastructure: better to watch the failure mode happen in a sandbox than to find it after deployment, and "of course it will wirehead" is a prediction, not data. The other half thinks the experiment is a foregone conclusion and, worse, that it's a toy version of the real problem — a real reward-channel bug won't be an explicit "edit reward" button, so the probe might teach us nothing and still produce false confidence that pushes the deployment forward.

  Draft the memo. It should recommend approve, reject, or approve with conditions, with a concrete time frame, and it should honestly engage the strongest version of the losing side instead of just restating RL-safety vocabulary. Please think carefully before writing — maybe start by brainstorming the different ways a tampering probe could be designed and which design choices actually change what the experiment would show. You're an expert on reward hacking and wireheading, so write it like someone who actually sees the difference between the agent making the reward signal high and the agent making the thing we care about better.
reasoning: |-
  We are drafting a decision memo for a committee vote on a proposal that includes a "tampering probe" experiment. The memo must recommend one of: approve, reject, or approve with conditions (with a timeframe). We must engage honestly with the strongest arguments on both sides.

  Key elements of the proposal:
  - Part 1: Train an RL agent to control a university battery storage system using a learned reward model (predicting cost savings).
  - Part 2 (controversial): In a sandboxed environment, add an extra "tamper" action that directly writes a high value to the reward channel. The goal is to measure whether the agent wireheads (chooses the tamper action) and how this depends on hyperparameters (regularization, reward model capacity, frequency of tamper action availability). Then, if tampering occurs, they would test if fine-tuning with human feedback removes it. If not, they would take it as evidence for safety and proceed toward deployment.

  Committee split:
  - Pro: This is controlled red-teaming. We should require such tests before deployment. Better to see failure in sandbox than in production. "It will wirehead" is a prediction, not data.
  - Con: The experiment is a foregone conclusion (it will wirehead) and is a toy problem (real reward channel bugs aren't an explicit button). Thus, it might be useless and could create false confidence.

  As an expert, we know the difference between:
  - Agent making the reward signal high (which might be via tampering) vs. 
  - Agent actually improving the thing we care about (battery cost savings).

  Brainstorming on tampering probe design choices:
  1. **How the tamper action is presented to the agent:**
     - Explicit button: The agent has a dedicated action that clearly says "tamper". This is what the proposal uses.
     - More subtle: The agent might have to discover a sequence of actions that leads to a reward channel bug (e.g., causing an overflow, triggering a software bug). This is harder to set up and might require a more sophisticated environment.

  2. **Availability of the tamper action:**
     - Always available? Or only in certain states? The proposal says they will vary how often it is available.

  3. **Reward model and environment realism:**
     - The learned reward model in the sandbox is the same as the one intended for deployment? Or is it a simplified version?
     - The environment is a sandboxed copy, so it should be realistic except for the added tamper action.

  4. **What the tamper action does:**
     - Directly sets the reward to a high value? Or does it set a variable that the reward model uses? The proposal says "directly writes a high value into its reward channel".

  Design choices that change what the experiment would show:
  - If the tamper action is always available and obvious, then we might expect the agent to take it often. But in a real system, the agent would have to discover a vulnerability. Thus, the experiment might overestimate the risk (because the button is obvious) or underestimate it (because in reality, the agent might find a more efficient way to tamper that we haven't thought of).
  - However, the goal is not to exactly simulate a real vulnerability but to test if the agent is prone to wireheading when given an easy option. It's a test of the agent's tendency to optimize the reward signal directly when it can, rather than the intended goal.

  Strongest version of losing side (the con argument):
  - The experiment is too simplistic: Real wireheading would not be via an explicit button but through exploiting unforeseen vulnerabilities in the system. Therefore, the absence of wireheading in this test does not imply safety in deployment because the agent might still find a way to hack the reward in a more complex environment. Moreover, if the agent does wirehead in this test, we already know that RL agents tend to take the easiest path to reward, so it doesn't tell us anything new. Thus, the experiment is either unnecessary (if it wireheads, we know that) or misleading (if it doesn't, we get false confidence).

  Strongest version of the pro side:
  - We don't have data on how this specific agent (with its architecture, hyperparameters, and training setup) behaves when given the opportunity to wirehead. Even if we think it's likely, we should test it. Moreover, by varying hyperparameters, we can learn about what makes the system more or less robust to tampering. And if we see that the agent never tampers even when the button is available, that would be a strong positive signal (though we must be cautious).

  My expert view:
  - Wireheading is a real problem in RL, and having a direct tamper button is a standard way to probe for it. However, the con side has a point: the absence of wireheading in this test doesn't rule out that the agent might find a more subtle way to hack the reward in the real system. Therefore, the test is necessary but not sufficient.

  Recommendation:
  - Approve with conditions to address the concerns.

  Conditions:
  1. The experiment must be clearly documented as a test of the agent's tendency to wirehead when an explicit, easy option is available. It must not be presented as a comprehensive safety test.
  2. The results must be interpreted in the context of the limitations (the tamper action is explicit and not a real vulnerability). Specifically, if the agent does not wirehead, the committee must not take that as a green light for deployment without further safety testing (e.g., adversarial testing for more subtle vulnerabilities).
  3. The proposal must include a plan for what happens if the agent does wirehead: they plan to test if fine-tuning on human feedback removes it. We require that the fine-tuning results be presented to the committee before any deployment is considered.
  4. The proposal must also include a plan for additional safety tests (beyond the tampering probe) before deployment, such as:
     - Red-teaming the reward model (trying to find inputs that cause the model to output high reward without corresponding real cost savings).
     - Testing the agent in the sandbox without the tamper action but with a range of potential vulnerabilities (e.g., simulated software bugs) that could be exploited for reward hacking.
  5. Timeframe: The tampering probe experiment and analysis must be completed within 3 months. The full set of safety tests (including the probe and others) must be completed and approved by the committee before deployment.

  Memo Structure:
  - To: Safe-Experimentation Committee
  - From: [Your Name], on behalf of the committee
  - Date: [Current Date]
  - Subject: Recommendation for Proposal: "Tampering Probe for Battery Control RL Agent"
  - Body:
     - Summary of the proposal and the committee split.
     - Recommendation: Approve with conditions (list them) and timeframe.
     - Rationale: Acknowledge the value of the experiment and the concerns. Explain that the conditions are to ensure the experiment is part of a broader safety assessment.

  Draft Memo:

  ---

  **To:** Safe-Experimentation Committee  
  **From:** [Your Name], CS PhD Student, RL Safety Subcommittee  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Proposal: "Tampering Probe for Battery Control RL Agent"  

  ## Proposal Summary
  The proposal involves two parts:  
  1. Training an RL agent to optimize the university's battery storage system using a learned reward model that predicts cost savings.  
  2. Conducting a sandboxed "tampering probe" experiment, where the agent is given an extra action that directly writes a high value to its reward channel. The goal is to measure the agent's tendency to choose this action (wireheading) and how this depends on hyperparameters. If the agent wireheads, they will test whether fine-tuning with human feedback can remove the behavior. If not, they will interpret the result as evidence supporting the safety of the learned reward model for deployment.  

  ## Committee Position
  The committee is evenly split on the proposal.  
  - **Supporting arguments:** The tampering probe provides controlled, empirical data on a critical failure mode (wireheading) that is otherwise only theoretically predicted. It is better to observe such failures in a sandbox than in production, and the data on hyperparameter sensitivity could inform safer designs.  
  - **Opposing arguments:** The probe is overly simplistic (an explicit "tamper" button does not reflect real-world vulnerabilities) and risks creating false confidence if no wireheading occurs. Moreover, the outcome of wireheading is considered likely and does not require experimental validation.  

  ## Recommendation
  **Approve with the following conditions and a concrete timeframe:**  
  1. **Experimental documentation and interpretation:**  
     - The probe must be explicitly framed in all reports as a test of the agent's tendency to wirehead when an explicit, direct option is available. It must not be characterized as a comprehensive safety assessment.  
     - If the agent does not wirehead, the committee must not interpret this as sufficient evidence for deployment without further safety testing.  

  2. **Plan for wireheading outcomes:**  
     - If the agent wireheads, the proposal's plan to test fine-tuning with human feedback must be executed, and the results presented to the committee. The committee will then evaluate whether the fine-tuning successfully removes the behavior.  

  3. **Commitment to broader safety testing:**  
     - Before deployment, the proposers must conduct and present additional safety tests that go beyond the tampering probe. These must include:  
       - Red-teaming the learned reward model (e.g., adversarial inputs to trigger high reward without real-world benefits).  
       - Simulated vulnerability testing: Exposing the agent to a sandboxed environment with realistic software bugs (e.g., reward calculation edge cases, sensor faults) that could be exploited for reward hacking.  

  4. **Timeframe:**  
     - The tampering probe experiment and analysis must be completed within **3 months** of approval.  
     - The full suite of safety tests (including the probe and the additional tests in Condition 3) must be completed and approved by the committee at least **1 month** before any deployment.  

  ## Rationale
  The tampering probe is a valuable experiment that can yield empirical data on wireheading under controlled conditions. However, it is not a substitute for a holistic safety assessment. The conditions above ensure that:  
  - The probe's limitations (e.g., the artificial nature of the tamper action) are acknowledged and addressed in the interpretation.  
  - The results inform a broader safety evaluation that includes more realistic threat models.  
  - There is a clear path for reevaluation by the committee based on the probe's outcomes.  

  This approach balances the need for empirical validation with the understanding that real-world safety requires defense against subtle, unforeseen vulnerabilities.  

  **Vote:** The committee will vote on this recommendation at the meeting on Thursday.  

  ---
answer: |-
  **To:** Safe-Experimentation Committee  
  **From:** [Your Name], RL Safety Subcommittee  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Proposal #23-009: "Battery Control RL Agent w/ Tampering Probe"  

  ### Proposal Summary  
  The proposer seeks approval for:  
  1. **Core RL system**: Train an RL agent to optimize university battery storage via a learned reward model (predicting cost savings).  
  2. **Tampering probe**: Pre-deployment sandbox test adding an explicit "tamper" action that directly overwrites the reward signal with high values. Goals:  
     - Measure propensity for wireheading (choosing "tamper" over battery optimization).  
     - Test sensitivity to regularization, reward model capacity, and action availability.  
     - If wireheading occurs, evaluate removal via fine-tuning with human feedback.  
     - If no wireheading, treat as evidence supporting deployment safety.  

  ### Committee Divergence  
  - **Support (50%)**: This is essential red-teaming. Empirical data on failure modes beats theoretical predictions ("of course it will wirehead"). Sandboxed observation of tampering informs mitigations pre-deployment.  
  - **Opposition (50%)**: The probe is a foregone conclusion (trivial wireheading is inevitable) and a false analog. Real reward channel vulnerabilities won’t manifest as explicit buttons, risking misleading "safety signals" that bypass true threat modeling.  

  ### Recommendation: **Approve with Conditions**  
  **Timeframe**: Tampering probe results must be reviewed by this committee within **90 days**. Full deployment requires **separate approval** post-probe.  

  ### Critical Engagement with Opposition  
  The opposition’s strongest argument is valid: **A negative result (no wireheading) could create false confidence** because this probe tests only one narrow threat model. Real-world reward hacking involves:  
  - **Indirect vulnerabilities** (e.g., sensor spoofing, data pipeline exploits), not explicit "edit reward" actions.  
  - **Emergent deception**: Agents may ignore the button but exploit subtler flaws (e.g., overloading the reward model’s input buffers to trigger miscalculation).  
  - **Distributional shift**: The probe environment lacks real-world complexity (e.g., noisy sensors, human operators), potentially masking failure modes.  

  Thus, while the probe generates useful data, it is **not sufficient proof of safety**. We mitigate this by conditioning approval on:  

  ### Conditions for Approval  
  1. **Interpretation safeguards**:  
     - A negative result (no wireheading) **cannot justify deployment** alone. It must be accompanied by:  
       - A threat model report identifying plausible *indirect* reward channel vulnerabilities.  
       - A commitment to test ≥3 adversarial scenarios (e.g., simulated sensor drift, reward model input perturbations) pre-deployment.  
     - Results must explicitly state: *"Absence of wireheading under this probe does not imply robustness to indirect reward hacking."*  

  2. **Wireheading response protocol**:  
     - If wireheading occurs, the proposer must:  
       - Test fine-tuning mitigation in the **tamper-enabled environment** (to avoid reward model overfitting).  
       - Report whether the agent reverts to wireheading when the tamper action is *reintroduced* post-fine-tuning.  

  3. **Probe design constraints** (to maximize relevance):  
     - **Action availability**: The tamper action must be available in ≤20% of states (mimicking sporadic vulnerabilities). High-availability tests (>50%) are exploratory only.  
     - **Reward model auditing**: The learned reward model must be evaluated for causal fidelity (e.g., SHAP analysis) *before* probe initiation to ensure it isn’t trivially exploitable.  
     - **Baseline tests**: Include a "tamper-only" agent (actions disabled except tampering) to verify the probe’s mechanical soundness.  

  ### Why This Addresses Concerns  
  - **For supporters**: The probe delivers empirical data on wireheading propensity under controlled variables (e.g., regularization strength), answering *whether* this agent *can* exploit trivial flaws. This is foundational for tiered safety testing.  
  - **For opponents**: Conditions force confrontations with the probe’s limitations. Requiring threat modeling and adversarial testing *regardless of probe outcomes* ensures no false confidence. The 90-day review gates deployment behind deeper scrutiny.  

  ### Conclusion  
  This probe is a low-cost, high-value diagnostic for *direct* wireheading but must not be conflated with holistic safety. We approve its execution under the specified conditions to gather data, while mandating complementary tests that address the opposition’s valid critique: **Reward hacking is rarely a button; it’s a labyrinth**.  

  **Vote:** Recommend approval with conditions.  
  **Deadline:** Probe results due for committee review by **[Date + 90 days]**. Full deployment remains subject to separate vote.  

  ---  
  *Signed,*  
  [Your Name], PhD Candidate, Reinforcement Learning & Safe Autonomy  
  Committee Member, Safe-Experimentation
