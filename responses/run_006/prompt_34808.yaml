prompt: |-
  I serve on my university's Committee on Academic Requirements, and we are currently reviewing whether to retain the foreign language proficiency requirement for all undergraduates. At our last meeting, a colleague from the economics department made the following argument: over the past fifteen years, whenever the university has surveyed students about which requirements they find most burdensome, foreign language study consistently ranks first. Moreover, enrollment data from peer institutions show that when language courses are made optional, enrollment in them drops precipitously. He concluded that the requirement should be eliminated because, as he put it, the data reveal what students actually value, and the university ought to respect those revealed preferences.

  Something about this argument strikes me as wrong, but I am having difficulty articulating exactly what the error is. I recognize that the argument moves from descriptive claims about student behavior and preferences to a normative conclusion about what the university should do, but I am not sure whether that move is always illegitimate, or only illegitimate in this particular case, or what principle distinguishes the legitimate from the illegitimate cases. Are there circumstances under which one can validly move from facts about what people do or prefer to conclusions about what an institution ought to do? If so, what principle would tell us whether my colleague's argument belongs to that class? And if the argument is indeed fallacious, what is the most precise way to characterize the mistake?

  I am a philosopher by training but not a specialist in metaethics, so I would appreciate an analysis that is rigorous but does not presuppose fluency in the technical literature. Please write your answer in American English.
reasoning: |-
  Okay, the user is a philosopher serving on a university committee reviewing the foreign language requirement. Their colleague from economics argued to eliminate it based on student surveys showing it's burdensome and enrollment drops when optional. The colleague calls this "revealed preference," suggesting the university should respect what students value. The user feels this is wrong but can't articulate why. They want to know if moving from descriptive claims (what students do) to normative conclusions (what the university should do) is fallacious here.

  First, I need to unpack the colleague's argument. The key points are: 1) students consistently rank language requirements as most burdensome in surveys, 2) when peers make language courses optional, enrollment plummets. The colleague interprets this as revealed preference—students don't value language learning, so the requirement should be removed. The user senses a flaw but isn't sure if descriptive-to-normative moves are always invalid or just here.

  The user mentioned being a philosopher but not a metaethics specialist, so I should avoid jargon while being rigorous. The core issue is whether institutions should base educational policies solely on student preferences. I recall Hume's is-ought gap: you can't derive an "ought" from an "is." But the user wants to know if there are exceptions and how to pinpoint the flaw here.

  Considering the educational context, universities have a mission beyond satisfying student preferences. They aim to cultivate skills and knowledge that students might not initially value. For example, critical thinking or exposure to diverse perspectives. Language learning might fall into this category—students find it hard now but benefit long-term. So the colleague ignores the institution's educational role.

  The revealed preference concept from economics assumes preferences are clear and static, but education can shape preferences. Students might not see language skills' value until later. Also, surveys measure burden, not long-term benefits. The data shows aversion but not whether the requirement is unjustified. The colleague conflates preference satisfaction with educational goals.

  The user needs a precise fallacy name. It's a category error: treating education like a consumer market. Students aren't mere consumers; they're learners whose preferences can evolve. The institution's duty includes promoting unrecognized goods. Also, there's a false dichotomy: either respect preferences or ignore them, but there might be middle grounds like better teaching or showing relevance.

  Are there cases where descriptive facts support normative conclusions? Yes, if institutional goals align with preferences. For example, if the goal is student satisfaction, then survey data matters. But here, the university's goal is likely broader education, so preferences alone aren't sufficient. The principle is whether preferences align with institutional purposes. Here, they conflict, so the move is invalid.

  The user might also want to challenge the data interpretation. "Burdensome" doesn't mean "not valuable." Hard requirements can be worthwhile. The enrollment drop at peers could reflect opportunity costs, not devaluation. So the data doesn't prove students disvalue languages; it shows they prioritize other courses when free to choose.

  The most precise fallacy is the is-ought fallacy combined with ignoring institutional telos. The colleague's error is grounding the "ought" solely in preferences without engaging with the university's educational mission. The response should explain that policies need justification based on educational values, not just preferences.
answer: |-
  Your colleague's argument commits a fundamental error in reasoning by conflating descriptive observations about student preferences with a normative conclusion about educational policy. While not *all* moves from "is" to "ought" are invalid, this particular argument fails because it ignores the core purpose and responsibilities of the university. Here’s a precise breakdown:

  ### 1. **The Core Flaw: Misapplying "Revealed Preference" to Institutional Mission**
     - **Revealed Preference Fallacy in Education**: In economics, "revealed preference" suggests choices reveal underlying values. However, applying this mechanically to educational requirements commits a **category error**. Universities are not merely consumer marketplaces satisfying existing preferences; they are institutions with a *telos* (purpose): to cultivate knowledge, critical capacities, and skills students *may not yet value* but *ought to acquire* for their intellectual and civic development.
     - **Ignoring Institutional Telos**: Your colleague assumes the university’s sole duty is to satisfy student preferences. But universities have a fiduciary responsibility to design curricula that serve students' long-term interests, even when those interests conflict with short-term preferences. For example:
       - Students might "reveal" a preference against challenging math, science, or ethics courses—but universities retain these requirements because they are essential to a robust education.
       - Language learning fosters cognitive flexibility, intercultural competence, and engagement with diverse perspectives—goods the university is tasked with promoting, regardless of initial student resistance.

  ### 2. **The Data’s Limited Relevance**
     - **Surveys Measure Burden, Not Value**: That students find language study "burdensome" reveals effort/discomfort, not a lack of value. Many high-impact educational experiences (e.g., research, thesis writing) are burdensome but transformative.
     - **Enrollment Drops Reflect Constraints, Not Devaluation**: When language courses are optional, enrollment drops likely reflect pragmatic choices (e.g., prioritizing major requirements or perceived "easier" electives), not a rejection of language learning’s intrinsic worth. This is compounded by:
       - **Opportunity Costs**: Students have limited credits; optional courses compete with major requirements.
       - **Information Gaps**: Students may undervalue language skills due to lack of exposure to their long-term benefits.

  ### 3. **When "Is" to "Ought" Moves *Are* Valid (and Why This Isn’t One)**
     A move from descriptive facts to normative conclusions is valid **only when the facts align with the institution's justifying purpose**. For example:
     - *Valid*: If a university’s mission includes preparing students for global careers, data showing employers prioritize language skills *could* support retaining the requirement (facts → institutional goal → policy).
     - *Invalid*: Your colleague’s argument uses facts (student preferences) to override the university’s educational mission without engaging that mission. Preferences alone cannot dictate policy because:
       - Students lack complete information about long-term educational goods.
       - Universities exist partly to *shape* preferences through exposure to valuable disciplines.

  ### 4. **Precise Characterization of the Mistake**
     The argument commits two interrelated fallacies:
     - **Teleological Neglect**: Ignoring the institution's essential purpose (cultivating unrecognized goods) when deriving "ought" from "is."
     - **Consumerist Reduction**: Mistaking education for a consumer transaction, where student preferences are sovereign. This reduces education to a service model rather than a formative enterprise.

  ### 5. **A Better Normative Framework**
     To evaluate the requirement, your committee should ask:
     - Does language proficiency advance the university’s educational goals (e.g., critical thinking, global citizenship)?
     - Is there evidence of long-term student benefit (e.g., cognitive gains, career outcomes)?
     - Could the requirement be reformed (e.g., better pedagogy, flexible pathways) rather than eliminated?
     - Are burdens distributed equitably? (e.g., Is the requirement harder for heritage speakers or students with learning differences?).

  ### Conclusion
  Your colleague’s error is not that he moves from "is" to "ought," but that he grounds the "ought" *solely* in student preferences without engaging the university’s independent responsibility to define and promote educational goods. The argument is illegitimate here because it substitutes a market logic for an educational one. Valid normative arguments for policy must reference the institution’s mission—not merely aggregate preferences. As a philosopher, you might frame this as a failure to distinguish between *preference-satisfaction* and *flourishing*, where the latter may require guided exposure to challenging but valuable disciplines. The university’s duty is to the latter.
