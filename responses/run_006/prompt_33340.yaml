prompt: |-
  I'm a PhD student in moral philosophy, mostly working on population ethics and how to aggregate suffering. Lately I've been trying to get clear on lexical-threshold negative utilitarianism: the view that there's an intensity threshold such that any amount of suffering above it lexically outweighs any amount below it, so below-threshold pains can be traded off against one another but never against an above-threshold pain. I want a case for a paper I'm writing, because I have a hunch the view gets sold as the humane alternative to standard negative utilitarianism but actually just relocates where the ruthless trade-offs happen.

  Construct a thought experiment in which a lexical-threshold negative utilitarian is committed to imposing a larger total amount of mild suffering than a classical, summing negative utilitarian would impose, in order to prevent one instance of suffering just above the threshold. So the threshold view comes out as the one willing to pile up the misery — the opposite of how it's usualy presented. Constraints: a hospital or public-health setting (no trolleys, no science fiction), numbers small enough to state in a paragraph, and the threshold has to be set at a defensable intensity (something like severe neuropathic pain that a competent patient would say makes continued life not worth living) rather than a cutoff rigged to force the result. For the exercise, assume only suffering matters, so pleasures aren't in the ledger.

  After the scenario, do the check: state each theory's verdict and why, with the arithmetic for the classical view and the lexical-priority reasoning for the threshold view; identify the single feature of the case that does the work; and say what would happen if you nudged the severe pain just below the threshold or the mild pains just above it. Finish with how a defender of the classical summing view would attack the threshold verdict in this case, and whether that attack lands on the threshold view's own terms.
