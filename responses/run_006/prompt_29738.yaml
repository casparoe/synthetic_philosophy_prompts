prompt: |-
  I've been collecting my own verdicts on cases where someone deliberately makes themselves less rational — through precommitment, self-deception, or changing their own desires — and I want to know whether one principle captures them.

  - Stranded hitchhiker. A driver stops but won't trust a promise to pay on arrival, because he knows I'd have no reason to pay once I'm safe in town. If I could take a pill that would make me keep the promise regardless of my interests, I'd take it, and I think doing so would be rational — even though the pill makes me less responsive to my reasons at the moment of paying.
  - Ulysses. Binding himself to the mast so that his later self can't steer toward the Sirens seems plainly rational.
  - Negotiating pill. A negotiator takes a drug that makes her genuinely unable to accept any offer below a floor, so that her refusal is credible. I think that's fine, and rational.
  - Smoking contract. Someone pays a third party to send a large sum to a cause he detests if he smokes again. Fine, rational.
  - Cultivated rage. Someone deliberately cultivates a disposition to fly into costly rages so that people won't cross him, knowing the rages will sometimes cost him more than giving in would have. I don't think that's rational, though the mechanism looks the same as the others.
  - False-belief pill. A student takes a pill that makes him believe he will succeed, though the belief is false; believing it makes him work harder, and he ends up succeeding. I want to say this isn't rational — he bought success with a false belief.
  - Promise chip. A person has a device implanted that will force him to keep every promise he makes, including promises extracted by duress or trickery; he knows this in advance. I don't think that's rational.
  - Fraudulent driver. The hitchhiker case again, but the driver is a known con man who takes the money and drives off. I still want to say the pill was rational at the time, but I'm less sure.

  The pair that bothers me: the negotiating pill and the false-belief pill feel different, though both are cases of deliberately inducing a locally irrational mental state to gain a strategic benefit. Is there a principle that gets all of these, or nearly all, and which of my verdicts does it force me to drop? And what should the principle say about the case I keep going back and forth on — someone who undergoes a procedure that makes her permanently and genuinely care more about keeping promises than about her own welfare, knowing she will sometimes be exploited by people who know she's been altered?
reasoning: |-
  Okay, the user is tackling a complex philosophical problem about rationality and self-modification. They've collected various scenarios where people intentionally make themselves less rational—through precommitment, self-deception, or desire alteration—and want to know if a single principle can explain their intuitive judgments on these cases. 

  First, I notice the user is clearly well-versed in decision theory and philosophy (referencing Ulysses, using terms like "precommitment"). This isn't someone's casual curiosity—they're systematically testing intuitions against theoretical frameworks. The frustration in phrases like "the pair that bothers me" suggests they've wrestled with this extensively.

  The core tension they highlight—between instrumental rationality (using irrationality as a tool) and substantive rationality (maintaining reason-responsiveness)—is thorny. Their examples create a spectrum: from clearly acceptable precommitments (Ulysses) to clearly unacceptable ones (promise chip), with gray areas in between (cultivated rage, false-belief pill). 

  What's especially clever is their inclusion of boundary-testing cases: the fraudulent driver variation probes whether the initial decision's rationality depends on outcomes, while the last hypothetical about permanent promise-preference alteration forces us to consider when instrumental gains become identity-destroying. 

  I should acknowledge that their intuitions mostly align with standard decision theory (accepting precommitments that solve coordination problems, rejecting those inviting exploitation), but the false-belief case reveals a deeper concern about epistemic integrity that pure instrumentalism can't capture. That's why the "contextual integrity" principle feels promising—it preserves their rejection of self-deception while justifying strategic irrationality in bargaining. 

  For their wavering case (permanent promise-preference alteration), I suspect their hesitation stems from it straddling two categories: functionally it's like the negotiating pill (credible commitment device), existentially it's akin to the promise chip (vulnerability to exploitation). The resolution might lie in distinguishing between temporary, context-bound modifications versus fundamental, identity-altering ones—the latter risks undermining the very self whose goals the commitment was meant to serve. 

  Ultimately, they're seeking not just classification but a coherence check: "Which of my verdicts are defensible?" The answer seems to be that cultivated rage and false-belief pills can be rejected without contradiction, while the fraudulent driver case confirms that rationality evaluates decisions under uncertainty, not outcomes. 

  This is precisely the kind of nuanced problem where philosophy shines—by exposing why simple principles fail, we refine our understanding of agency. The user's meticulous case-building suggests they'd appreciate that complexity rather than seek an artificial simplification.
answer: |-
  Your collection highlights a fascinating tension in rationality: **instrumental rationality** (using means effectively to achieve goals) versus **substantive rationality** (maintaining reason-responsiveness). A principle that captures most of your intuitions is:

  **"Deliberate self-modification is rational iff it:  
  (1) Solves a credible commitment problem *without* creating unacceptable risks of exploitation,  
  (2) Preserves contextual epistemic integrity, and  
  (3) Aligns with the agent's deep values."**

  Here's how it applies to your cases:

  ---

  ### **Cases Your Principle Endorses**
  - **Stranded Hitchhiker** & **Negotiating Pill**:  
    Solves commitment problems (paying/refusing low offers) credibly. Low exploitation risk (hitchhiker pays voluntarily; negotiator sets her *own* floor). Epistemic integrity intact (no false beliefs).  
    → *Rational under the principle.*

  - **Ulysses Pact**:  
    Solves self-control problem (Sirens). No exploitation risk. Maintains epistemic integrity. Aligns with deep values (survival, journey).  
    → *Rational.*

  - **Smoking Contract**:  
    Solves self-control problem. Low exploitation risk (triggered by *own* action). Preserves truth-tracking.  
    → *Rational.*

  ---

  ### **Cases Your Principle Rejects**
  - **Cultivated Rage**:  
    Fails (2) and (3). Rages cause *uncontrolled* collateral damage (epistemic failure: rage isn't context-specific). Misaligns with deep values (most value calmness/control). High risk of net harm.  
    → *Irrational* (matches your verdict).

  - **False-Belief Pill**:  
    Violates (2) "contextual epistemic integrity." False beliefs corrupt general reasoning, even if locally beneficial. Success is achieved by self-deception, undermining rational agency.  
    → *Irrational* (matches your verdict).

  - **Promise Chip**:  
    Fails (1) and (3). Creates extreme exploitation risk (duress/trickery). Overrides deep values (autonomy, self-preservation).  
    → *Irrational* (matches your verdict).

  - **Fraudulent Driver**:  
    *Still rational initially* under the principle. The pill solved the hitchhiker’s commitment problem. The driver’s fraud was unforeseeable; rationality evaluates decisions *under available information*. Outcome doesn’t retroactively invalidate the strategy.  
    → *Rational at the time* (matches your verdict).

  ---

  ### **The Negotiating Pill vs. False-Belief Pill Distinction**
  The key difference is **epistemic side effects**:  
  - The **negotiating pill** alters *preferences/actions*, not beliefs. You still assess offers accurately but cannot accept low ones.  
  - The **false-belief pill** corrupts *belief formation*. It induces global irrationality (false confidence affects all decisions), not targeted commitment.  

  Your intuition distinguishes "strategic irrationality" (negotiating pill) from "epistemic self-sabotage" (false-belief pill). The principle captures this.

  ---

  ### **Your Wavering Case: Permanent Promise-Alteration**
  > *"Someone undergoes a procedure making her permanently care more about keeping promises than her welfare, knowing she'll sometimes be exploited."*

  **Verdict: Likely Irrational**  
  - Fails (1): Creates high exploitation risk (others can extract harmful promises).  
  - Fails (3): Permanently overrides deep values (welfare/autonomy) for a narrow goal.  
  - Unlike Ulysses (temporary restraint), this is a *fundamental identity change*. Rationality requires preserving the core self’s interests.  

  **Exception:** If her "deep value" is becoming a promise-keeping saint (e.g., a monk), it *might* be rational. But absent that, it resembles the *promise chip*—sacrificing too much for credibility.

  ---

  ### **Which Verdicts Would Change?**
  The principle supports all your verdicts except *possibly* **cultivated rage** if refined:  
  - If rage is *highly targeted* (e.g., only when cheated) and aligns with values (e.g., enforcing fairness), it *could* be rational. But as described (costly rages, no control), rejection holds.

  ---

  ### **Core Insight**
  Rational self-modification isn't about "irrationality" but **strategic meta-rationality**: bending local rationality to serve global goals, *without* compromising the cognitive tools needed to navigate an uncertain world. When self-alignment risks self-destruction (exploitation, false beliefs), it ceases to be rational.
