  I'm a systems engineer — I live in terms of source code, compiler output, the OS, registers, silicon. I've been trying to get my head around the causal exclusion argument in philosophy of mind, the one where mental causes get squeezed out because the physical world is already causally closed, especially the version where people want mental states to be something over and above the physical while still causing things. Can you restate that whole argument and the surrounding debate in my actual vocabulary: layers of abstraction, the program vs the machine code that implements it, determinism of the underlying hardware, multiple realizability as same source compiling to different instruction sets, that kind of thing. Be faithful — dont just say the mind is like software and call it a day.

  Then give me the residue report. Which parts of the philosophers' debate translate cleanly into how a running program relates to its machine code? Which parts did you have to fudge or stretch to make fit? Which parts have no counterpart at all in the systems picture? And then tell me: is the philosophers' worry about mental causation just a confusion about levels that I already know how to dissolve, or does the residue point to something my vocabulary genuinely can't see? I want the translation and the residue, not a summary of the literature.
