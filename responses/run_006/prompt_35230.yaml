prompt: |-
  I've been down the program equilibrium rabbit hole for a few months now and I'm trying to turn it into an actual research plan instead of just rereading old posts. The basic setup — players submit programs, each can read the other's source before the game is played, and in a one-shot prisoner's dilemma you can get mutual cooperation without contracts or reputation — seems like one of the more underrated ideas for getting artificial agents to not defect by default when they interact once. The proof-based / Löbian side is where I keep getting stuck, because every scheme where a program cooperates only if it can prove the other one cooperates seems to either explode into a folk theorem's worth of equilibria, get gamed by agents that hunt for spurious proofs, or fall apart when the agents aren't symmetric or can't fully verify each other's code.

  Suppose the end goal is making progress on the parts of this that matter for cooperation between artificial agents that meet once, can inspect each other's source, and have no external enforcement. I have about two years, one person, and a background thats more modal logic than game theory. Which three or four open problems in program equilibrium should I actually prioritize, and why those over the others? I'm less interested in a survey than in the reasoning: for each problem, what exactly is the sticking point that keeps it open, how much would solving it change downstream work, how tractable is it for someone with my background, and what evidence over the next year would make you demote it. I also want the ordering itself defended — what criteria you're weighing, what tradeoffs you're making between tractability and downstream importance, and which interesting-sounding problems you're deliberately leaving off the list.

  After the prose, give me the ranking as a JSON object. Schema: an array of objects, one per problem you're prioritizing, with fields: rank (integer), short_name (string), why_this_over_others (one paragraph), tractability (one of "high", "medium", "low"), downstream_weight (one of "high", "medium", "low"), neglectedness (one of "high", "medium", "low"), and what_would_demote_it (string).
reasoning: |-
  We are focusing on the practical goal of enabling cooperation in one-shot interactions between AI agents that can inspect each other's source code. The challenges include avoiding the folk theorem explosion, handling spurious proofs, and dealing with asymmetric or unverifiable agents.

  Criteria for selection:
  1. **Downstream Importance**: How much would solving this problem advance the practical deployment of program equilibrium in AI?
  2. **Tractability**: Given a background in modal logic and two years, how feasible is it?
  3. **Neglectedness**: Is the problem understudied, so that making progress would be impactful?
  4. **Demotion Criteria**: What evidence in a year would make us reconsider the problem's priority?

  We deliberately avoid:
  - Overly theoretical explorations without clear practical implications.
  - Problems that are already well-studied and have known solutions.
  - Issues that are more about game theory than the program equilibrium setting.

  We prioritize problems that are central to making program equilibrium work in practice for AI agents.

  **Selected Problems and Ranking**:

  1. **Problem 1: Robust Proof Verification Against Adversarial Code**
     - **Why this over others?**: The core of program equilibrium relies on agents correctly verifying each other's behavior via proofs. However, adversarial agents can submit code that tries to trick the proof system (e.g., by finding spurious proofs or causing infinite loops). Without a robust verification mechanism, the entire approach is vulnerable. This is the most immediate barrier to practical implementation because if the proof system isn't trustworthy, cooperation fails. Solving it would allow agents to safely rely on each other's proofs even in the presence of malicious or buggy code.
     - **Tractability**: Medium. Background in modal logic is directly applicable to proof systems. However, making it robust against adversarial code is challenging and may require combining with formal methods.
     - **Downstream Weight**: High. Without this, the foundation is shaky.
     - **Neglectedness**: Medium. Some work exists on proof-based cooperation, but the adversarial aspect is less explored.
     - **What would demote it?**: If within a year we find that existing formal verification techniques (like model checking or symbolic execution) can be straightforwardly adapted to handle adversarial code in this setting, then this problem becomes less critical.

  2. **Problem 2: Handling Asymmetric Agents and Incomplete Verification**
     - **Why this over others?**: In practice, agents may not be symmetric (e.g., different capabilities, different knowledge) and may not be able to fully verify each other's code (due to computational limits or obfuscation). Current program equilibrium models often assume symmetry and full verifiability. This problem is crucial because real AI systems will be heterogeneous and resource-bounded. Solving it would extend program equilibrium to realistic settings.
     - **Tractability**: Medium. Modal logic can help model knowledge and belief under uncertainty. However, integrating game theory with these asymmetries is non-trivial.
     - **Downstream Weight**: High. Asymmetry and incomplete verification are the norm in real-world interactions.
     - **Neglectedness**: High. Most literature assumes symmetry and full verifiability.
     - **What would demote it?**: If a simple reduction to symmetric cases is found (e.g., via a trusted third party or a universal representation) that doesn't sacrifice the one-shot nature, then this problem becomes less urgent.

  3. **Problem 3: Avoiding Folk Theorem Explosions in Program Equilibrium**
     - **Why this over others?**: The folk theorem in program equilibrium leads to too many equilibria, including ones that are not cooperative. We need a criterion to select the cooperative equilibrium without external enforcement. This problem is important because without a selection mechanism, we cannot guarantee cooperation. Solving it would provide a principled way to achieve mutual cooperation as the focal equilibrium.
     - **Tractability**: Low to Medium. This is a deep game-theoretic issue, but modal logic (e.g., using common knowledge or focal points) might offer new angles. It's harder because it requires both game theory and logic.
     - **Downstream Weight**: High. Without equilibrium selection, the approach may not lead to cooperation in practice.
     - **Neglectedness**: Medium. Some work exists on equilibrium selection, but not specifically in the program equilibrium setting with proof-based agents.
     - **What would demote it?**: If we discover that in the program equilibrium setting the cooperative equilibrium is the only one that is stable under natural refinements (e.g., based on simplicity or robustness) without introducing new mechanisms, then this problem becomes less pressing.

  4. **Problem 4: Resource-Bounded Proof Construction and Verification**
     - **Why this over others?**: Real agents have limited computational resources. Current models assume that proofs can be constructed and verified instantly, which is unrealistic. This problem is critical because without efficient proof handling, the mechanism cannot be implemented in practice. Solving it would make program equilibrium feasible for real AI systems.
     - **Tractability**: Medium. Background in logic can help design efficient proof systems, but integrating with complexity theory is challenging.
     - **Downstream Weight**: High. Without efficiency, the approach is purely theoretical.
     - **Neglectedness**: High. Most work ignores computational limits.
     - **What would demote it?**: If we find that for the prisoner's dilemma and similar games, the proofs required are trivial and can be handled by existing automated theorem provers within realistic time, then this problem is less important.

  **Tradeoffs**:
  - We put Robust Proof Verification first because it's foundational: if the proof system is broken, nothing else matters.
  - Asymmetry and Incomplete Verification is next because it addresses the reality of heterogeneous agents.
  - Avoiding Folk Theorem Explosions is important but more abstract and might be partially solved by the first two.
  - Resource-Boundedness is critical for implementation but might be more of an engineering challenge after the theory is settled.

  We leave off:
  - **Self-Modifying Code**: While important, it's a further complication and might be too broad for the first two years.
  - **Multi-Agent Extensions**: We focus on two-agent one-shot for simplicity.

