  First, I need to come up with a concrete example. Maybe something involving promises or duties to different parties. A classic setup could be a parent torn between two children. That might work. Let's say a parent has to choose which child to save in a life-threatening situation. Both children are in equal danger, and saving one means abandoning the other. The obligations here are to protect each child, but the parent can't fulfill both.

  Now, why is this resistant to the standard strategies? Let me go through each one. The "ought implies can" argument says you can't be obligated to do the impossible. But here, the parent can save either child, so each obligation is possible individually, but not together. So that strategy doesn't dissolve the dilemma because the impossibility arises from the conflict itself, not inability.

  Next, epistemic uncertainty. The user mentioned that sometimes dilemmas are just uncertainty about which obligation is weightier. In this case, both children are equally dependent and valued, so there's no hidden fact making one obligation stronger. The conflict remains even with full knowledge.

  Then disjunctive obligations. The idea is that the real duty is to save one or the other. But that doesn't capture the moral failure; whichever child is left, the parent has failed their duty to that child. The disjunctive approach glosses over the violation of the unchosen obligation.

  I should make sure the example has clear details. Setting it during a fire with identical twins in separate rooms emphasizes the symmetry. The parent must choose quickly, adding urgency. The obligations arise from the parental role, which is fundamental and non-delegable.

  Also, the user wants the resistance visible in the example itself. So describing the twins as equally loved and the situation as symmetrical shows why epistemic uncertainty isn't the issue. The parent's capability to save either child addresses "ought implies can." The lingering guilt after choosing highlights that the disjunctive duty doesn't resolve the moral failure.

  Is there any higher principle that could rank the obligations? Like saving the younger child or one with better prospects? But if the twins are identical in all relevant aspects, no such principle applies. That's crucial to prevent resolution via a higher rule.

  Check if the example meets all criteria: irreconcilable obligations without override, resistance to dissolution strategies. Yes. Also, ensure the description includes structural features like symmetry, role-based duties, and the necessity of choice causing inevitable failure.
answer: |-
  Here is an example of a situation designed to resist standard strategies for dissolving moral dilemmas:

  **The Example: The Parent and the Twins in the Fire**

  Imagine a parent, Alex, who is home alone with their two identical 5-year-old twins, Ben and Chloe. A sudden, intense fire breaks out, rapidly blocking all exits except one narrow hallway. Due to the fire's position and the layout of the house, Alex can only escape through this hallway. Ben and Chloe are trapped in separate, equally distant bedrooms down opposite ends of this hallway. The fire is spreading so quickly that Alex has only enough time to run down the hallway to one bedroom, grab that child, and escape. If Alex tries to reach both, the fire will block the exit, and all three will die. Alex *must* choose one child to save, knowing that by doing so, they are condemning the other to certain death. Alex feels equally bound by the profound, non-delegable, and fundamental parental obligation to protect the life of *each* individual child.

  **The Moral Dilemma:**

  1.  **Obligation 1:** Save Ben (arising from the parent-child relationship and duty to protect Ben's life).
  2.  **Obligation 2:** Save Chloe (arising from the parent-child relationship and duty to protect Chloe's life).
  3.  **Irreconcilability:** Alex *cannot* fulfill both obligations simultaneously. Saving Ben necessarily means abandoning Chloe to death, and vice-versa.
  4.  **No Clear Override:** There is no morally relevant difference between Ben and Chloe (e.g., health, character, potential) that Alex or any observer could use to justify prioritizing one over the other. The obligations stem from identical relationships and involve the identical fundamental value of each child's life.
  5.  **No Higher-Order Principle:** There is no overarching principle (like "save the youngest," "save the most lives," or "favor the child closer") that applies here to rank or reconcile the obligations. Both children are equally young, saving either results in saving one life, and the distances/risks are identical. The fundamental duties to each child seem equally paramount.

  **Resistance to Dissolution Strategies:**

  1.  **Resistance to "Ought Implies Can":**
      *   **Strategy:** Argues that Alex cannot be obligated to do the impossible (save both), so there is no genuine conflict of obligations.
      *   **Resistance in the Example:** The dilemma arises precisely *because* Alex *can* do each action individually (Alex *can* save Ben; Alex *can* save Chloe), and each action is separately obligatory. The conflict stems not from the *inability* to perform a single impossible action (save both), but from the *incompatibility* of performing two actions each of which Alex *can* do and *ought* to do. "Ought implies can" doesn't dissolve the separate "oughts"; it highlights the tragic clash *between* them given the practical constraints. Alex *can* save Ben, and *ought* to save Ben; Alex *can* save Chloe, and *ought* to save Chloe; but Alex *cannot* do *both*. The impossibility is a *result* of the conflict of "can"s, not proof that the "oughts" were illusory.

  2.  **Resistance to Epistemic Uncertainty:**
      *   **Strategy:** Argues that the *apparent* dilemma is only due to Alex not knowing which obligation is truly weightier; a fully informed agent would see one obligation clearly overrides the other.
      *   **Resistance in the Example:** The structural symmetry of the case eliminates epistemic uncertainty as the source of the dilemma. Alex knows *everything* relevant: the children are identical in all morally significant aspects (age, relationship to Alex, vulnerability, potential), the risks and chances of success are identical for saving either, the value of each life is identical, and the consequences of choosing one over the other are certain and catastrophic for the unchosen child. There *is* no hidden fact (e.g., "Ben has an unknown heart condition making his life less valuable") that could resolve the conflict. The dilemma persists *despite* full knowledge. The conflict is ontological (about the nature of the obligations themselves), not epistemological.

  3.  **Resistance to the Disjunctive Obligation Proposal:**
      *   **Strategy:** Argues that Alex's *true* obligation is disjunctive: "Save Ben *or* save Chloe," not "Save Ben *and* save Chloe." This dissolves the conflict by replacing two conjunctive obligations with one disjunctive one.
      *   **Resistance in the Example:** While Alex *must* choose one action (saving one child), describing the obligation *only* as disjunctive ("save Ben or Chloe") fails to capture the profound moral remainder and the sense of tragic wrongdoing inherent in the situation. Whichever child Alex saves, they have *violated* a fundamental, specific obligation *to the child left behind*. Alex *owed* it *to Chloe* to save her, specifically. By saving Ben, Alex fails Chloe in a way that is not absolved by having saved Ben. The guilt, regret, and sense of having wronged Chloe (or Ben, if Chloe is saved) are testaments to the persisting force of the *unchosen* specific obligation. The disjunctive strategy masks this moral violation by focusing solely on the action taken, ignoring the specific duty owed to the individual who was failed. The parent's obligation isn't generically to "save a child"; it's specifically to save *each* of *their* children.

  **The Key Structural Feature:** The **perfect symmetry of the conflicting obligations in terms of source, weight, object, and consequences** combined with **mutual exclusivity forced by circumstance**. This symmetry prevents resolution via epistemic clarity (there's nothing *to* discover that breaks the tie) and makes the disjunctive proposal feel morally inadequate (it ignores the binding duty *to the specific individual* who is failed). The "ought implies can" strategy is resisted because the impossibility stems from the conflict of two individually possible and obligatory actions, not the impossibility of a single action. The obligations remain distinct, powerful, and binding *even though* they cannot both be fulfilled, creating the genuine dilemma.
