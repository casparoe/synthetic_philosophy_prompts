answer: |-
  ## Q&A Prep Sheet: Top Objections & Replies  

  ### **Objection 1 (Highest Damage):**  
  *"Deontology is brittle. If your AI refuses to violate a 'don't lie' rule even to prevent genocide, it’s clearly immoral. Consequentialism avoids these perverse extremes."*  
  **Reply (2-min):**  
  "First, we’re not advocating naive rule absolutism. We can design *thresholded* deontology (e.g., 'Don’t lie unless imminent catastrophe'). Crucially, under radical uncertainty, the AI can’t *know* if lying *actually* prevents genocide—it might worsen it. Consequentialism here forces guesswork with existential stakes. Deontology defaults to caution when predictions are unreliable. For known high-stakes thresholds, we encode exceptions explicitly—making tradeoffs auditable, not emergent."  
  **Weakness:** Thresholds blur into utilitarianism. Defending "imminent catastrophe" criteria invites utility calculations.  

  ### **Objection 2:**  
  *"Specifying rules just moves the problem. Who defines the constraints? You’ll get specification gaming, adversarial inputs, or bad rules causing harm."*  
  **Reply:**  
  "True, but it’s a *tractable* problem. Unlike utility functions, rules are discrete, verifiable units (e.g., 'Never alter medical records'). We can test rules *offline* against adversarial datasets, certify compliance formally, and patch failures individually. Utility functions require perfect global preference models vulnerable to distributional shifts. Rules let us contain failures: a broken rule can be fixed without retraining the entire value model."  
  **Weakness:** Rule interactions (e.g., privacy vs. safety) can create systemic gaps hard to foresee.  

  ### **Objection 3:**  
  *"You’re ignoring bounded optimality. Expected utility maximization is the only rigorous framework for decisions under uncertainty. Why throw out math for philosophy?"*  
  **Reply:**  
  "Because in real-world deployment, the 'expected value' is often illusory. When an AI can’t assign probabilities to outcomes (e.g., novel threats or fractal edge cases), maximizing utility is mathematically ungrounded. Deontology acts as a robust satisficing strategy: prioritize knowable, invariant constraints (e.g., rights) over speculative optimization. It’s decision theory for *Knightian uncertainty*—not just risk."  
  **Weakness:** Consequentialists can counter with imprecise probabilities or robust optimization tech.  

  ### **Objection 4 (Philosopher):**  
  *"Deontology is anthropocentric. Human rights emerge from consequences! A *true* moral AI would maximize impartial good—we just need better utility learning."*  
  **Reply:**  
  "Impartial good requires a coherent, learnable utility function. We lack that, and ML systems *can’t* learn it from human data (e.g., value incommensurability, preference loops). Deontology doesn’t presuppose metaphysics—it’s a *procedural* safeguard: 'Don’t use race in sentencing' is verifiable; 'maximize fairness' isn’t. Until we solve moral ontology, constraints are safer."  
  **Weakness:** Assumes utility learning is doomed—AGI could theoretically overcome this.  

  ### **Objection 5:**  
  *"Rules make AI less adaptable. In a crisis, we want an AI that breaks rules to save lives. Your approach is anti-innovative."*  
  **Reply:**  
  "Innovation requires trust. If an AI unpredictably breaks rules for perceived 'greater good,' humans can’t rely on it (e.g., medical AI lying for 'beneficial' placebo effects). We can *design* for adaptability: allow *human*-approved overrides in defined crises, or meta-rules for rule revision. But core constraints must hold unless explicitly suspended—by humans."  
  **Weakness:** Over-reliance on human overrides may bottleneck response times.  

  ### **Objection 6:**  
  *"This is just RLHF with shoddy heuristics. We already use rule-based rewards!"*  
  **Reply:**  
  "RLHF optimizes for *preference signals*, not deontic norms. If humans inconsistently tolerate lying, RLHF learns consequentialism-by-proxy. I advocate *architectural* priors: hard constraints the RL loop *can’t* override (e.g., circuit-level interrupt for prohibited actions). This isn’t heuristic RL—it’s design-for-assurance, like aviation’s 'fly-by-wire' limits."  
  **Weakness:** Hybrid systems exist; the line between "hard constraint" and "high penalty" is fuzzy in practice.  

  ### **The Question I Hope Nobody Asks:**  
  *"What happens when rules conflict? Your AI freezes while a utilitarian acts. Isn’t deontology computationally dangerous?"*  
  **Reply:**  
  "Conflicts are rare with well-designed constraints (e.g., lexicographic priorities: safety > privacy > convenience). When unavoidable, we *want* the AI to 'freeze' and seek human input—this is *safer* than arbitrating tradeoffs autonomously under uncertainty. A self-driving car shouldn’t decide whether to kill a pedestrian to save its passenger; it should brake and alert. Contestability > covert utility calculus."  
  **Weakness:** Humans freeze too—but critics will argue superhuman AIs *should* resolve dilemmas better than us.  

  ---  
  **Final Note:** Your strongest card is **deployment reality**—engineers care about verification, distribution shifts, and stakeholder trust. Philosophers care about coherence; stress that deontology is a *pragmatic stopgap* for partial AGI. Anchor in "We can’t wait for perfect utility functions to deploy safe systems."
