prompt: |-
  I've been following the metaethics literature on and off since grad school, and the Frege–Geach problem for expressivism has started to feel like watching two grandmasters play out a draw they both saw coming on move twelve. You know the shape of it: expressivists hold that moral judgments are conative attitudes — disapproval, acceptance of norms, plans — rather than beliefs with representational content that can be true or false. Geach pointed out that this makes the compositional semantics of moral language deeply puzzling, because moral terms appear unasserted in conditionals, disjunctions, and the antecedents of arguments, where the speaker plainly isn't expressing the attitude in question. Take a simple modus ponens: if lying is wrong, then getting your brother to lie is wrong; lying is wrong; therefore, getting your brother to lie is wrong. The argument is plainly valid, but in the conditional's antecedent, "lying is wrong" isn't being used to express disapproval of lying — so what does it contribute to the sentence, and why does the inference go through? Blackburn answered with higher-order attitudes: to accept the conditional is to approve of a combination of attitudes, so that you approve of disapproving of getting-your-brother-to-lie given disapproving of lying. Gibbard shifted the framework to norm-governed planning states. Schroeder gave us being-for. Each wave addresses some subset of the logical problems — negation, mixed sentences, capturing the right inference patterns — but critics keep identifying gaps, and the reply is always a more baroque attitudinal structure that begins to look, to the critics, suspiciously like a representational belief in disguise.

  I'm not asking who wins. What I want is a diagnosis of why this debate has the shape it does — why it has run for sixty years without anything that looks like a decisive shift. Is it a straightforward engineering problem: expressivism needs a compositional semantics for non-representational mental states, we haven't found the right formal tool yet, but the back-and-forth is healthy refinement and we're narrowing in? Or is it a deeper clash about what a semantic theory is supposed to do — expressivists trying to explain what speakers are up to when they use moral language, critics demanding a truth-conditional compositional theory that assigns propositions to sentences, and neither side acknowledging they're answering different questions under the same heading? Or is the Frege–Geach problem actually a reductio of expressivism that its defenders have treated as a research program, so that the whole sequence is degenerative and the impasse is a refusal to take the hint? I want the diagnosis to engage the actual moves in the literature — not a hand-wavy "they're talking past each other" — and to say what, if anything, would count as progress: a formal impossibility result, a new distinction that reframes the problem, or the honest conclusion that the impasse is permanent and we should stop expecting it to resolve. Keep the response to 500 words maximum.
reasoning: |-
  Okay, let me unpack this user's query. They're clearly deeply familiar with the Frege-Geach problem in metaethics, tracing its evolution from Blackburn's quasi-realism through Gibbard's planning theories to Schroeder's being-for approach. Their frustration with the stalemate is palpable – they describe it as grandmasters playing out a predetermined draw. 

  The core of their request is diagnostic: why has this debate persisted for sixty years without resolution? They present three possible explanations: (1) it's an unsolved but solvable engineering problem in compositional semantics, (2) it reflects deeper methodological divergence about what semantics should do, or (3) it's actually a reductio ad absurdum of expressivism that defenders refuse to accept. 

  What's sophisticated here is how they reject superficial answers – they explicitly want engagement with the literature's actual moves, not just "they're talking past each other." They also demand criteria for what would count as progress. I notice their examples (mixed discourses, negation issues) show they understands the technical hurdles like negation and mixed atomic/ethical sentences that tripped up earlier expressivist systems.

  The challenge is condensing this into 500 words while honoring the depth of their knowledge. I'll need to reference specific solution-attempts and their failures: Blackburn's higher-order attitudes failing on negation, Gibbard's planning states struggling with mixed content, Schroeder's being-for inviting accusations of disguised descriptivism. 

  For the diagnostic part, I'm leaning toward explanation (2) – the conflict between expressivism's psychologistic ambitions versus truth-conditional semantics' formal requirements. But I should acknowledge that (3) has force too, given how expressivist "solutions" increasingly mimic propositional architecture. 

  On progress conditions: a formal impossibility proof would be decisive but unlikely; a reframing (like distinguishing semantic content from attitude expression more radically) might help; permanent impasse remains possible. The user seems to suspect this last option – their "refusal to take the hint" phrasing suggests sympathy for the reductio view.

  I'll structure tightly: problem recap → solution attempts & shortcomings → diagnosis of methodological clash → evaluation of progress conditions. Must cite Blackburn/Gibbard/Schroeder specifically to meet their request for literature engagement.
answer: |-
  Your diagnosis hits the crux: the Frege-Geach impasse stems primarily from a **clash of methodological commitments about semantic theory**, exacerbated by the inherent difficulty of formalizing non-representational content compositionally. This isn't merely unsolved engineering, nor a straightforward reductio, but a persistent tension between two legitimate goals:

  1.  **Expressivism's Core Project:** Explaining the *distinctive function* of moral language – its connection to motivation, action-guidance, and non-representational mental states (attitudes, plans). This is fundamentally *psychologistic* and *pragmatic*.
  2.  **The Critic's Demand:** Providing a *formal compositional semantics* showing how the meaning of complex sentences (especially unasserted contexts) is built systematically from the meanings of their parts, preserving logical relations like validity. This traditionally assumes *truth-conditional content*.

  **Why the Stalemate?**

  *   **Attitudinal Solutions Mimic Propositions:** Each expressivist solution (Blackburn's higher-order approval, Gibbard's plan-laden worlds, Schroeder's being-for) inevitably constructs complex, structured objects (approval combinations, plan structures, "being-for" relations) that *functionally resemble* truth-conditional propositions. They define "consistency" and "entailment" relations over these attitude-laden structures to capture logic. Critics see this as conceding the game – if you need quasi-propositional objects for compositional semantics anyway, why deny moral judgments are beliefs?
  *   **The Trade-off:** Addressing compositional logic (negation, mixed sentences, embedding) forces expressivists into increasingly abstract, attitude-theoretic machinery. This achieves formal adequacy at the cost of distancing the theory from the *simple, motivating core* of expressivism (e.g., "wrong" just *is* booing). This fuels the "disguised descriptivism" charge. Conversely, preserving the simple motivational core leaves logic unexplained.
  *   **Different Success Criteria:** Expressivists claim success by showing *some* systematic attitudinal semantics capturing logic is *possible*, proving their project isn't *incoherent*. Critics demand this semantics also be *explanatorily superior* to descriptivism and remain *distinctly non-representational* in feel – a higher bar often unmet.

  **What Counts as Progress?**

  *   **Decisive Shift Unlikely:** A formal *impossibility* proof seems improbable, given the ingenuity shown. A *fully satisfying* solution requires bridging the methodological gap.
  *   **Meaningful Progress:** Would involve either:
      *   A novel formal framework providing genuinely *simpler* compositional semantics for attitudes, demonstrably avoiding proposition-mimicry while handling all embeddings robustly.
      *   A compelling meta-theoretical distinction reframing the debate (e.g., sharply separating semantic *content* from attitude *expression* in a non-trivial way, or redefining the goals of compositional semantics for normative language).
      *   Honest acknowledgment that the core expressivist motivation (simple motivational states) might only explain *simple assertions*, while complex embeddings require a different, perhaps hybrid, semantic treatment – accepting a permanent tension.

  The impasse persists because both sides address valid concerns: the distinctive *role* of moral language (expressivism) and the systematic demands of *logic and composition* (critics). The "engineering" solutions needed for the latter constantly threaten to subsume the former. Recognizing this methodological clash as fundamental is key; resolution requires either a revolutionary formal tool or a reconception of the semantic task itself.
