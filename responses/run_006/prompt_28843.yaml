  The marathon and masochistic cases are interesting. The pain feels unpleasant in the moment, but because it's part of a valued activity or desired, the overall verdict is that it's not bad. This complicates the idea that immediate unpleasantness equals badness. Nightmare pain has no real damage but is still bad, emphasizing the experiential aspect. Unconscious nociception isn't bad because there's no consciousness, which aligns with the idea that consciousness is necessary.

