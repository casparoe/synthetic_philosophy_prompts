  I should check if the proposed principle covers all cases. For chronic pain adaptation, the unpleasantness might be reduced or contextually integrated, so it's less bad. Masochistic pain's unpleasantness is desired, so it's not bad in that context. Amnestic pain was unpleasant at the time, so bad then. Nightmare pain is unpleasant, so bad. Unconscious nociception lacks experience, so not bad.

