answer: |-
  ## Dialogue: After the Conference Talk  
  *(Alex, late 30s, computationalist, nursing a whiskey. Sam, early 40s, critic, sketching on a napkin. They’re at a dimly lit bar near the conference venue.)*

  **Alex:** *(Leans in)* Sam, that Q&A got me thinking about your comment. You dismissed the computational metaphor entirely. But seriously—how *else* do you explain systematic thought? If I can think "John loves Mary," I can think "Mary loves John." That's compositionality. Brains *must* have combinatorial syntax. That’s computation.

  **Sam:** *(Taps napkin)* Compositionality ≠ computation, Alex. Birds fly in flocks with complex patterns—does that mean flocks *run flight-programs*? Brains evolved dynamical systems shaped by embodiment and ecology. You’re projecting a 20th-century engineering concept onto wetware that predates Turing by half a billion years.

  **Alex:** But we *model* those dynamics computationally! Look—neurons spike or don’t spike. Networks integrate inputs, threshold, propagate signals. That’s discrete state transitions! Whether it’s McCulloch-Pitts neurons or Bayesian inference, it’s computation *implemented* in biology. Abstraction saves you from the messiness.

  **Sam:** *(Leans forward)* Ah, "abstraction." There’s the sleight of hand. When a river erodes rock, we *could* describe it as "computing" canyon geometry. But that’s just physics. Your "computational description" is post-hoc. Where’s the *program* in the brain? Where’s the read/write head? The hardware/software distinction collapses when the "hardware" *is* the process.

  **Alex:** So what? A GPU implements shader programs through physics—electrons moving through silicon. Brains implement cognitive processes through neurochemistry. The level matters! Marr’s algorithmic level captures *why* the system works, separate from implementation. That’s how we get generalization, error correction—

  **Sam:** —And *representation*? That’s the fatal flaw. When a neuron fires "for" a face, is that a *symbol*? Or just a causal coupling? If it’s symbolic, who’s the interpreter? If it’s causal, calling it "computation" adds nothing. You’re smuggling in semantics under the guise of syntax.

  **Alex:** Symbols ground out in sensorimotor loops! A retinal pattern "represents" light because it covaries with it and drives action. The visual system *processes* that pattern into edge detectors, shape coders—it’s a transformation of informational states. That’s computation!

  **Sam:** *(Scoffs)* "Informational states." You’ve stretched "computation" so thin it covers any physical change. Thermodynamics "computes" equilibrium. A falling rock "computes" its trajectory. The term loses all bite! Meanwhile, real computers have *semantic engines*—they manipulate symbols *as* symbols because we assign meaning. Brains *generate* meaning. Big difference.

  **Alex:** So connectionism? Deep learning? They’re computational models that *work*. They predict neural data, explain behavioral errors. If it walks like a duck…

  **Sam:** *(Points with pen)* No—they *approximate* brains using computational tools. That’s pragmatic, not ontological. Dynamical systems models explain timing effects connectionists ignore. Your "duck" is a useful puppet, not the real animal. Brains aren’t *doing* linear algebra; they’re self-organizing organs.

  **Alex:** But systematicity! Productivity! How do you explain generating *novel* thoughts without combinatorial structure? "The hungry purple dinosaur recited Kafka"—you’ve never thought that, but your brain can assemble it. That screams symbolic computation.

  **Sam:** *(Sips beer)* Or it screams a high-dimensional state space where trajectories can evolve along gradients of association and constraint. Language is a cultural artifact that *trained* your brain, not proof of innate symbols. Brains are pattern-completing engines, not Turing machines.

  **Alex:** Then why do we *build* Turing machines to mimic cognition? Why does cognitive neuroscience find hierarchical processing, receptive fields, predictive coding—all computable?

  **Sam:** Because we only have computational tools! We see nails because we have hammers. But describe "predictive coding" without invoking Bayesian *inference*—suddenly it’s just neural firing minimizing prediction error through feedback loops. No "computation" needed—just dynamics.

  **Alex:** *(Pauses)* ...So is your objection just semantic? That "computation" implies something artificial?

  **Sam:** No. It’s metaphysical. Framing brains as computers obscures their biological essence—continuous, embodied, embedded. It makes us hunt for non-existent "programs." We miss how cognition emerges from the whole organism interacting with the world.

  **Alex:** And your alternative? "It’s all dynamics?" That’s vacuously true. Computation gives us *explanatory power*. Without it, cognitive science collapses into description.

  **Sam:** Or it evolves. We might understand memory as synaptic reweighting plus neuromodulatory context—not "memory retrieval algorithms." Biology isn’t clean. Your "right level of abstraction" might be a Procrustean bed.

  *(Silence. Alex swirls whiskey. Sam crumples the napkin.)*

  **Alex:** ...I still think you’re throwing the baby out with the bathwater. Computation is the best lens we have for *how* syntax and semantics combine.

  **Sam:** And I think it’s a lens that distorts as much as it reveals. But... *(smirks)* buy me another drink, and I’ll explain why your Bayesian priors are just embodied habits.

  **Alex:** *(Grins)* Deal. But only if you admit predictive coding models *do* capture something real.

  **Sam:** They capture *correlates*. Not essence. But fine—for whiskey, I’ll concede the model’s utility. Just not its ontology.

  *(Alex signals the bartender. The argument continues, but the tension eases into collegial frustration.)*

  ---

  ### Key Philosophical Points Explored:
  1. **Systematicity/Productivity** (Alex): Combinatorial thought implies formal structure.  
  2. **Levels of Abstraction** (Alex): Computational descriptions are robust across implementations.  
  3. **The Vacuity Objection** (Sam): If any physical change is "computation," the term is meaningless.  
  4. **Hardware/Software Distinction** (Sam): Brains lack separable "programs"; process = substrate.  
  5. **Representation & the "Interpreter Problem"** (Sam): Syntax alone can’t generate semantics without external assignment.  
  6. **Dynamical Alternatives** (Sam): Cognition as continuous, embodied state-space evolution.  

  ### Why Smart People Hold These Views:  
  - **Computationalists** see computation as the *only* framework explaining cognition’s structural precision and generality. Without it, we lose predictive models unifying mind, brain, and machine.  
  - **Critics** see computation as a metaphorical scaffold obscuring biological reality. Treating brains as computers risks reifying artifacts of our tools and ignoring emergence, embodiment, and non-symbolic processing.  

  The dialogue remains unresolved because the core tension—between *functional abstraction* and *biological specificity*—is foundational to cognitive science. Neither side "wins"; they map the boundaries of the problem.
