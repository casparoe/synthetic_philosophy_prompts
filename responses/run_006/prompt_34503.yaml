prompt: |-
  I am a PhD student in science and technology policy and serve on my university's emerging-technology review panel. The panel evaluates faculty, student, and industry-partner proposals that raise dual-use or socially disruptive concerns: synthetic biology, open-weight machine learning models, pathogen research, autonomous systems, and similar. We can approve, require modifications, or recommend against a project, but we cannot enforce our decisions. The university has no formal authority to stop research, and researchers can and sometimes do proceed without our approval by moving the work elsewhere, taking outside funding, or relabeling the project.

  A recurring problem is what Bostrom, Douglas, and Sandberg (2016) call the unilateralist's curse. In its canonical form, several actors each can unilaterally take an action that imposes consequences on everyone, and each, judging independently, may act even though the group as a whole would have preferred that no one acted. The variant I see most often in our docket is this: each actor would prefer the action not be taken at all, but each reasons that if they refrain someone else will likely act anyway, and so prefers to be the one who acts — to shape the outcome, capture the credit, or avoid being left behind. The result is that the action is taken even though nearly everyone involved would have preferred that no one took it. Research groups tell us, in so many words, "if we don't do this, someone else will." And our own review process sits inside the strategic landscape rather than above it: a panel recommendation against a project can perversely accelerate it by making the researchers feel they have less to lose from going outside official channels.

  What I need is not another set of criteria for evaluating the underlying research; we already have those. I need a decision procedure for evaluating our own position in the strategic landscape, so that our recommendations do not reliably produce the very outcome the panel exists to prevent.

  Please write this as a document we could realistically adopt as a standing operating procedure, for panel members who have never heard of the unilateralist's curse and have no background in game theory or decision theory. Define technical terms on first use, and keep the procedure usable under time pressure. Structure it in exactly these sections:

  1. Screening questions (roughly 400 words). Diagnostic questions that determine whether a proposal before us has the structure of a unilateralist's curse. Each question should be answerable yes/no or from evidence we can gather. For each question, say what evidence would count as a decisive yes and what would count as a decisive no. State the threshold at which we conclude the curse is likely in play, and state explicitly when we exit to our standard review process because the curse is not in play.

  2. The procedure (roughly 600 words). A sequence of steps to run when screening flags a curse situation. For each step, state what action we take, what information we need, what the step is meant to achieve, and how we will know whether it worked. Include steps that change what we communicate and to whom, steps that change our own decision rule, and steps that try to change the structure of the situation so the curse dissolves. Be honest about which steps are likely to work and which are aspirational.

  3. Worked cases (roughly 500 words each). Apply the screening questions and the procedure to the following two cases, walking through each step and stating the outcome.

  (a) A lab in our university wants to release an open-weight model for guiding chemical synthesis, with plausible dual-use application to toxic-agent discovery. The panel's initial inclination is to recommend against release. We have credible information that three well-resourced groups elsewhere are building comparable tools, at least one of which intends to release within the year regardless of what we do.

  (b) A historian on our campus proposes to digitize and publish a large corpus of declassified intelligence documents that includes names of living sources. The panel worries about harm to those individuals, but the corpus is already accessible to credentialed researchers, and the proposal is a single-lab archival project with no plausible race dynamic. Apply the screening questions and show why this is not a unilateralist's curse situation, and where the standard review process is the right tool.

  4. Limits (roughly 300 words). State clearly what this procedure cannot do: the curse situations it will fail to address, the judgment calls that cannot be proceduralized, and the failure modes of the procedure itself — ways it could make the outcome worse rather than better.
reasoning: |-
  Okay, the user is a PhD student in science and technology policy serving on an emerging-technology review panel. They're dealing with the unilateralist's curse problem where researchers proceed with risky projects because they fear others will do it anyway. The panel can't enforce decisions, so they need a practical procedure to avoid making things worse. 

  Hmm, this is a sophisticated policy challenge wrapped in academic terminology. The user clearly understands game theory concepts but needs operational tools for non-expert panel members. The core tension is between ethical oversight and institutional powerlessness - like having a speed limit sign that actually makes drivers go faster. 

  First, I should unpack why existing approaches fail. Their panel has criteria for evaluating research risks, but those become counterproductive when researchers game the system. The "someone else will do it" justification turns ethical review into a perverse incentive. And when researchers bypass the panel, oversight becomes theater.

  For the SOP, I'll need to translate Bostrom's abstract curse into concrete diagnostics. Key indicators: multiple actors capable of action, negative externalities, and the "first mover advantage" logic. Screening questions must be binary and evidence-based - no game theory jargon. 

  The procedure should focus on changing incentives since the panel lacks enforcement power. Options include: reframing recommendations to avoid backlash, facilitating coordination between groups, or helping researchers "save face" when abandoning projects. But I must be honest - some solutions require influence they don't have.

  For case (a), it's classic curse: multiple labs racing, unilateral action harmful. The procedure might suggest conditional approval ("release only if others don't") or helping researchers coordinate. But success isn't guaranteed. 

  Case (b) is different - no race dynamic, harm is localized. Here standard review applies. Important to show how screening catches this.

  Finally, limits: This won't work when actors are malicious, when information is secret, or if the panel's involvement triggers backlash. The procedure itself could become a bureaucratic hurdle. Must emphasize it's a damage-control tool, not a solution.

  The user's unspoken need? Legitimacy. They want the panel to matter despite having no authority. So the SOP should help them shift from saying "no" to creating ethical off-ramps.
answer: |-
  ## University Emerging Technology Review Panel: Unilateralist's Curse Mitigation Procedure

  **Version 1.0 | Effective Date: [Date]**

  **Purpose:** To identify proposals where the "Unilateralist's Curse" (UC) dynamic poses a significant risk that our standard review recommendations might inadvertently accelerate the very project we seek to mitigate, and to implement alternative strategies in those specific cases.

  **1. Screening Questions: Is the Unilateralist's Curse Likely?**

  These questions determine if a proposal exhibits the core UC structure: Multiple actors *could* independently proceed with an action imposing widespread negative consequences. Each actor might *prefer* no one acts, but each also fears others *will* act regardless, leading them to act themselves to gain an advantage or avoid disadvantage. If UC is likely, proceed to Section 2. Otherwise, use the **Standard Review Process**.

  Answer each question based on available evidence (proposal, PI statements, panel knowledge, brief external inquiry if feasible). **Threshold:** If Q1, Q2, Q3, and *either* Q4a *or* Q4b are decisively "Yes", UC is likely in play. Exit to Standard Review if any of Q1-Q3 are "No" or if both Q4a and Q4b are "No".

  *   **Q1: Multiple Capable Actors?** Are there multiple distinct, well-resourced actors (labs, companies, nations) *other than the proposer* who demonstrably *could* undertake a similar action/achieve a similar outcome independently?  
      *   *Decisive Yes:* Evidence of 3+ known entities actively pursuing comparable capabilities with resources to succeed; public announcements of intent; funding secured; established expertise. (e.g., "Three other labs confirmed developing similar chemical synthesis models.")  
      *   *Decisive No:* Project relies on unique resources/expertise *only* available to this proposer; no credible evidence of comparable efforts elsewhere.  
      *   *Exit if No:* UC requires multiple potential actors.

  *   **Q2: Harmful Unilateral Action?** If *any single actor* (including this proposer) proceeds independently, is there a plausible, non-negligible risk of significant *widespread* negative consequences (e.g., societal harm, security threats, severe ethical violations) that would impact parties beyond the actor themselves?  
      *   *Decisive Yes:* Clear dual-use potential (e.g., enables bioweapon development, mass disinformation); significant safety risks if deployed without safeguards; severe privacy breaches affecting many.  
      *   *Decisive No:* Risks are primarily local to the research team or institution; consequences are minor or purely reputational; risks are effectively mitigated by the proposer's specific plan.  
      *   *Exit if No:* UC requires significant negative consequences imposed by unilateral action.

  *   **Q3: Proposer's "Race" Justification?** Does the proposer explicitly or implicitly justify proceeding by arguing that if *they* don't act, *someone else likely will*, and that acting first provides them a significant advantage (e.g., shaping outcomes, capturing credit, avoiding strategic disadvantage)?  
      *   *Decisive Yes:* Statements like "We must lead or be left behind," "If we don't do it, [Competitor X] will," "First-mover advantage is crucial." Proposal emphasizes urgency tied to competition.  
      *   *Decisive No:* Justification focuses solely on scientific merit, societal benefit, or unique capability *without* referencing competitors or the need to act first.  
      *   *Exit if No:* The core UC strategic motivation ("others will do it anyway") is absent.

  *   **Q4a: "No Action" Preferred?** Is there credible evidence suggesting that *most* capable actors (including potentially the proposer, if not for the race dynamic) would *genuinely prefer* that *no one* undertakes the action, due to its inherent risks?  
      *   *Decisive Yes:* Public statements from multiple actors acknowledging risks and advocating restraint; established norms or treaties against similar actions; proposer expresses significant personal reservations but feels compelled by the race dynamic.  
      *   *Decisive No:* Actors openly embrace the action; risks are downplayed; no advocacy for restraint exists.

  *   **Q4b: "First Mover" Advantage Critical?** Is the perceived advantage gained by acting first (e.g., setting standards, capturing market share, gaining prestige) so large that it strongly outweighs the risks *in the proposer's calculus*, making unilateral action rational for them *even if they acknowledge the overall harm*?  
      *   *Decisive Yes:* Proposal highlights massive commercial potential, dominant market position, or unique prestige from being first. Proposer indicates willingness to bypass safeguards for speed.  
      *   *Decisive No:* Advantages of acting first appear marginal; proposer emphasizes rigorous safety/ethics regardless of timing.

  **2. The Procedure: Mitigating the Curse**

  If screening indicates UC likelihood, follow these steps. **Goal:** Avoid accelerating the project; encourage coordination or restraint; reframe incentives.

  *   **Step 1: Pause & Assess Leverage (Action: Internal Discussion)**
      *   *Action:* Suspend standard recommendation drafting. Discuss internally: What limited leverage *does* the panel/university have? (Reputation, funding recommendations, platform for dialogue, access to networks?).
      *   *Info Needed:* Understanding of university's relationship with the PI; any soft power points; contacts in relevant fields/networks.
      * *Achieve:* Realistic understanding of tools available. Avoid futile gestures.
      * *Success:* Clear identification of 1-2 potential pressure points/influence channels.
      * *Likelihood:* High (Internal assessment).

  *   **Step 2: Reframe Communication with Proposer (Action: Dialogue Shift)**
      *   *Action:* Engage the PI in a **non-adversarial conversation focused on the UC dynamic itself**. Acknowledge their "someone else will do it" concern as valid *within the strategic landscape*. Shift focus from "Should *you* do this?" to "How can *anyone* do this responsibly, given the risks?" Explore *their* ideas for collective solutions. **Explicitly state that a recommendation against approval *might* incentivize them to proceed elsewhere, which the panel wants to avoid.**
      *   *Info Needed:* PI's openness to discussion; their perception of competitors and risks.
      * *Achieve:* Build trust, de-escalate defensiveness, introduce the UC concept, surface potential for coordination or pre-commitments.
      * *Success:* PI acknowledges UC concern; engages constructively on broader responsibility; expresses willingness to explore alternatives beyond unilateral action. Avoids immediate dismissal or hardening of position.
      * *Likelihood:* Moderate (Depends on PI's temperament and perceived stakes).

  *   **Step 3: Explore Conditional Approval / Coordination Mechanisms (Action: Creative Proposal)**
      *   *Action:* Based on Step 2, propose alternatives to simple "Approve/Deny":
          *   **Conditional Approval:** "We recommend approval *only if* you secure a verifiable commitment from at least [Number] major competitors *not* to proceed similarly within [Timeframe], OR if an international moratorium/oversight framework is established by [Date]." (Leverages their desire for legitimacy).
          *   **Coordinated Release/Safeguards:** "We recommend approval contingent on jointly developing and implementing enhanced safety/ethics protocols with competitors X & Y before release." (Shares burden, reduces unilateral harm).
          *   **Transparency & Challenge:** "We recommend approval *only if* you publicly commit to [Specific Safeguard] and challenge competitors to match it, inviting independent verification." (Uses race dynamic for good).
      *   *Info Needed:* Feasibility of contacting competitors; existence of relevant forums (scientific societies, pre-competitive consortia); PI's willingness to engage.
      * *Achieve:* Transform the action from purely unilateral towards conditional or coordinated, dissolving the pure UC structure. Give the PI a "responsible leader" pathway.
      * *Success:* PI agrees to pursue a conditional or coordinated approach; concrete steps towards coordination are initiated.
      * *Likelihood:* Low-Moderate (Requires PI buy-in and competitor willingness; often aspirational but worth attempting).

  *   **Step 4: Internal Decision Rule Shift (Action: Vote on Impact, Not Just Risk)**
      *   *Action:* When formulating the final recommendation, panel members explicitly factor in: "Will this recommendation *increase*, *decrease*, or have *no effect* on the *likelihood or speed* of this project (or its harmful outcome) happening *somewhere in the world*, given the UC dynamic?" Prioritize recommendations minimizing *global* acceleration risk, even if imperfect locally.
      *   *Info Needed:* Insights from Steps 1-3; assessment of PI's likely reaction to different recommendations.
      * *Achieve:* Avoid recommendations that are ethically pure locally but disastrous globally by triggering bypass.
      * *Success:* Recommendation demonstrably considers and attempts to mitigate the UC acceleration risk.
      * *Likelihood:* High (Internal procedural change).

  *   **Step 5: Escalate & Broaden Communication (If Needed & Possible) (Action: Strategic Outreach)**
      *   *Action:* If risk is extreme and local leverage minimal, use university channels (e.g., Provost, Research Office) to:
          *   **Alert Relevant Networks:** Inform key scientific societies, funding bodies (e.g., NSF, NIH program officers), or government agencies (via appropriate channels) about the specific UC risk and competing actors, *framed as a systemic concern*, not just a project review. Encourage them to foster coordination/moratoria. (Requires careful framing to avoid appearing to "shop" a disapproved project).
          *   **Public Positioning (Cautiously):** Consider university leadership making a *principled statement* about the need for collective action on this class of technology, *without* necessarily naming specific projects or competitors, to shift norms.
      *   *Info Needed:* Clearance from university leadership; appropriate external contacts; careful messaging strategy.
      * *Achieve:* Increase pressure on competitors; foster broader discussion; potentially enable coordination the proposer couldn't achieve alone.
      * *Success:* External bodies acknowledge the concern and initiate discussions or actions promoting coordination/restraint.
      * *Likelihood:* Low (Requires institutional will and external receptiveness; high risk of backfiring if mishandled).

  **3. Worked Cases**

  **(a) Open-Weight Chemical Synthesis Model**

  *   **Screening:**
      *   Q1: **Yes.** Credible evidence of 3+ well-resourced external groups building similar tools.
      *   Q2: **Yes.** Plausible dual-use for toxic-agent discovery = significant widespread risk.
      *   Q3: **Yes.** Implicit/explicit "if we don't, they will" logic is highly likely given the known competitors and one's stated intent to release regardless.
      *   Q4a: **Unclear/No.** No evidence competitors prefer *no* release; one definitely intends to. Q4b: **Yes.** First-mover advantage in setting standards/capturing mindshare in a hot field is likely critical to the proposer. **Threshold Met (Q1-3 Yes + Q4b Yes). UC Likely.**
  *   **Procedure:**
      *   **Step 1:** Identify leverage: University prestige, potential for NSF/NIH funding recommendations, panel's technical credibility.
      *   **Step 2:** Meet PI. Acknowledge competitive pressure. "We share your concern about uncontrolled release. How could *any* release of such powerful tools happen safely? Could there be a way to align efforts?" Explicitly warn that a "Recommend Against" might push them to release privately/faster.
      *   **Step 3:** Propose: "We could *conditionally approve* release if your lab leads an effort to establish minimum safety/ethics benchmarks adopted by at least 2 major competitors within 6 months. Alternatively, approval if you jointly develop a verified 'safe release' protocol with [Specific Competitor X]." Or: "Approval contingent on implementing [Specific Robust Safeguard Y] and publicly challenging others to match it."
      *   **Step 4:** If PI rejects coordination but shows credible plan for strong *unilateral* safeguards exceeding competitors' likely standards, consider recommending approval *with* strong public documentation of safeguards (to set a high bar), rather than triggering a faster, less responsible release. If no safeguards, recommend against *and* trigger Step 5.
      *   **Step 5:** (If Step 3/4 fail & risk high) Brief Research Office/Provost. Suggest contacting NSF/NIH program managers (if applicable funding) and relevant AI/chemistry societies to highlight the imminent UC risk and need for field-wide guidance on model release for synthesis.
  *   **Outcome:** Depends on PI engagement. Best case: PI agrees to pursue coordination/safeguards, conditional approval given. Moderate case: Panel approves release with strong, public unilateral safeguards hoping to set norms. Worst case (but mitigated): Panel recommends against, but simultaneously triggers broader field alerts via Step 5, hoping to slow *all* releases.

  **(b) Digitizing Declassified Documents with Named Sources**

  *   **Screening:**
      *   Q1: **No.** Proposal is a single-lab archival project. "Credentialed researcher" access is *not* equivalent to multiple actors capable of *independently* mass-digitizing and publishing the *entire corpus*. No evidence others are racing to do this exact action.
      *   Q2: **Yes.** Potential harm to named individuals is a significant risk. *However...*
      *   Q3: **No.** No indication the historian is acting due to fear of competitors beating them to publication. Likely motivation is scholarly access/public interest.
      *   **Exit:** Q1 is No (lacks multiple capable actors). Q3 is No (lacks the "race" justification). **UC NOT LIKELY.**
  *   **Why Standard Review is Right:** The core problem is the *inherent ethics* of publishing names vs. historical value, within *this specific project*. There is no strategic dynamic where the panel's disapproval would cause the historian to rush and publish elsewhere (if they bypass the university, they likely lose access to the archives). The risks are primarily tied to *this specific act* of publication, not replicated by multiple actors racing. The standard review process can focus on: harm-benefit assessment, feasibility of redaction, consultation with relevant archives/intelligence bodies, and university reputation risk – without worrying about triggering a global acceleration.

  **4. Limits**

  This procedure has significant limitations:

  *   **Failure to Dissolve the Curse:** Success (coordination, restraint) relies heavily on the goodwill and rationality of the proposer and competitors. Malicious actors, extreme commercial/strategic pressure, or simple distrust can render Steps 2 & 3 ineffective.
  *   **Information Gaps:** We often operate with imperfect information about competitors' capabilities, intentions, and timelines. Misjudging Q1 or Q4 can lead to misapplication of the procedure.
  *   **Aspirational Steps:** Step 3 (Coordination) and Step 5 (External Escalation) are often aspirational. Securing competitor buy-in is difficult; external bodies may be unresponsive or powerless.
  *   **Inadvertent Harm:** Step 5 (External Escalation) risks: 1) Alerting *more* actors to the opportunity, worsening the curse; 2) Damaging university/PI relationships if perceived as betrayal; 3) Being ignored, undermining panel credibility.
  *   **False Negatives:** Clever proposers might hide the UC dynamic (avoid mentioning competitors) to bypass screening and get an easier standard review.
  *   **Reputational Risk:** Approving (even conditionally) or appearing soft on a high-risk project due to UC concerns can damage the panel's and university's reputation for rigorous oversight.
  *   **Cannot Create Authority:** The procedure cannot grant the panel or university enforcement power it lacks. It can only attempt to work within existing constraints using persuasion and strategic influence.
  *   **Judgment Calls:** Assessing "significant widespread risk" (Q2), "genuine preference for no action" (Q4a), and "critical advantage" (Q4b) involves subjective judgment. The threshold for triggering the procedure is also a judgment call.
  *   **Complexity & Time:** Running this procedure adds steps and time to review, potentially delaying decisions. It requires panel members to grasp the UC concept strategically.

  **Conclusion:** This procedure is a damage-mitigation tool for a specific, perverse incentive structure. It aims to prevent our recommendations from becoming fuel for the curse. It is not a solution to the curse itself, nor a substitute for careful ethical review of the underlying research. It should be applied judiciously, recognizing its inherent limitations and the possibility of failure. Success often means achieving a *less bad* outcome rather than the ideal.
