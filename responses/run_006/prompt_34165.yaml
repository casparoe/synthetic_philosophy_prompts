  What counts as progress? Distinctions like actual vs. alternative sequences help, but might not resolve the stalemate. Formal models could clarify ability conditions. Empirical studies on folk intuitions might show which concepts align with common sense, but that's descriptive, not normative. Acknowledging the question misalignment could shift focus to sourcehood, making Frankfurt cases less central.

