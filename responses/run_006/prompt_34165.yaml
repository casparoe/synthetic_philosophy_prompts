answer: |-
  Your diagnosis is perceptive: the Frankfurt stalemate arises from multiple, interlocking disagreements that are often obscured by the shared terminology of "alternative possibilities." The impasse isn't primarily about the cases themselves but about **divergent foundational priorities, conceptual analyses, and methodological commitments.** Below is a structural diagnosis, followed by what genuine progress might entail.

  ### Core Dimensions of Disagreement
  1.  **The Primacy Question (Metaphysics vs. Semantics):**
      *   **Source Incompatibilists** prioritize the *metaphysics of origination*: Responsibility requires being the *ultimate source* of one's action in a way incompatible with determinism. "Could have done otherwise" (CDO) matters only derivatively—if sourcehood requires indeterministic gaps. PAP is a symptom, not the disease. Frankfurt cases are irrelevant because they bypass the core issue: even *without* the intervener, determinism undermines sourcehood.
      *   **Classical Compatibilists/Libertarians (focused on PAP)** prioritize the *semantics/analysis of ability*: They ask what CDO *means* and whether its satisfaction (in some specific sense) is necessary for responsibility. Frankfurt cases target PAP directly, attempting to sever responsibility from CDO.

  2.  **The Nature of "Can" (Scope of Ability):**
      *   **Compatibilists** often analyze CDO in *fine-grained, dispositional, or conditional* terms: "S could have done otherwise" means "S *would* have done otherwise *if* she had chosen/willed/deliberated differently" (or similar), holding fixed the actual laws and past. Frankfurt cases are designed to preserve this *actual-sequence ability* while removing *robust alternative possibilities* (access to genuinely open futures).
      *   **Incompatibilists** often require a *robust, categorical, or leeway* notion of "can": Genuine alternatives require the *metaphysical possibility* of a different outcome *at the moment of choice*, grounded in indeterminism or agent-causation. They see compatibilist "abilities" as mere conditional dispositions, insufficient for grounding blame. Residual "flickers of freedom" (e.g., the *ability to choose otherwise* just before the intervention kicks in) are often highlighted because they preserve this robust "can."

  3.  **Dialectical Standards for Counterexamples:**
      *   **Compatibilists** see Frankfurt cases as successful *intuition pumps*: They elicit the judgment that the agent is responsible *despite* lacking robust alternatives. If the intuition holds, PAP is refuted. Further tweaks aim only to shore up the intuition against objections.
      *   **Incompatibilists** demand that counterexamples satisfy the *deeper conditions* of responsibility: A case only refutes PAP *if* the agent is *genuinely* responsible. But if sourcehood is compromised (either by determinism or by the intervener's *presence* as a causal factor, even if inactive), the agent isn't responsible. For them, Frankfurt cases *assume* the compatibility they aim to prove or fail to isolate the relevant variable (robust CDO).

  4.  **Evidential Weight of Intuitions:**
      *   **Pro-Frankfurt Theorists** grant significant weight to *case-specific intuitions*: The vividness of Jones acting "on his own" generates strong evidence against PAP.
      *   **Skeptics** downplay intuitions about *bizarre, metaphysically loaded thought experiments*: They argue intuitions here are unreliable, theory-laden, or clash with stronger intuitions about sourcehood/determinism. They prioritize *systematic coherence* with broader metaphysical commitments (e.g., the Consequence Argument) over isolated case judgments.

  ### Is the Disagreement Verbal, Substantive, or Mismatched?
  It is **primarily a substantive mismatch of questions and priorities**, compounded by conceptual divergence:
  *   **Substantive:** There's deep disagreement about the *essential grounding* of moral responsibility (sourcehood vs. actual-sequence reasons-responsiveness) and the nature of free will (robust access vs. agential harmony).
  *   **Mismatched:** Compatibilists using Frankfurt cases ask: "Is responsibility *conceptually tied* to access to alternatives?" Source Incompatibilists ask: "Does determinism (or covert intervention) *metaphysically preclude* the ultimacy required for responsibility?" These questions address different conceptual layers.
  *   **Not Merely Verbal:** While "can" is ambiguous, the core dispute isn't *just* about word meaning. It's about which concept of ability (if any) is *relevant* to responsibility and what responsibility *fundamentally consists in*.

  ### What Would Count as Progress?
  Breaking the stalemate requires shifting focus away from refining Frankfurt cases and towards clarifying the underlying disputes:

  1.  **Explicitly Decoupling PAP from Source Incompatibilism:** Acknowledge that defeating PAP doesn't touch source-incompatibilist concerns. Progress here involves *re-framing the debate* around sourcehood arguments directly (e.g., the Zygote Argument, Manipulation Arguments against compatibilism) rather than PAP. Frankfurt cases become peripheral.
  2.  **Formalizing/Modeling Ability Concepts:** Developing precise, shared *formal frameworks* for different notions of "ability," "power," and "possibility" relevant to agency (e.g., using modal logic, causal modeling, or decision theory). This could clarify *exactly* what is being denied in Frankfurt cases and whether different senses are being conflated. (This is nascent in work inspired by Kenny, Horty, or Maudlin).
  3.  **Taxonomy of Responsibility Conditions:** Establishing a widely accepted *map* of the conceptual space: distinguishing sourcehood, ownership, reasons-responsiveness, control, desert-bases, etc., and investigating their logical and metaphysical dependencies. This makes disagreements about *which* condition is primary explicit and testable.
  4.  **Meta-Ethical/Empirical Work on Intuitions:** Rigorous experimental philosophy studying *which* features of Frankfurt cases drive intuitions of responsibility/non-responsibility across diverse populations. Does the intervener's *presence* alone undermine responsibility for some? Does emphasizing the agent's internal state strengthen it? This could identify if intuitions are stable or theory-driven. *However*, progress requires integrating this data into *normative arguments* about which intuitions are reliable and why.
  5.  **Arguments for Priority:** The most direct progress would be compelling arguments establishing whether:
      *   The analysis of ability necessarily *presupposes* a prior account of responsible agency (suggesting source/metaphysics is primary).
      *   An account of responsible agency necessarily *presupposes* a prior analysis of ability (suggesting semantics is primary).
      *   They are irreducibly interdependent, requiring a holistic approach.
      *   **Example:** An argument showing that *any* plausible analysis of "could have done otherwise" robust enough to ground desert-based blame *entails* indeterministic sourcehood (or compatibly, that it doesn't).
  6.  **Demonstrating Dialectical Asymmetry:** Showing that one side's core position (e.g., source incompatibilism) cannot even *coherently engage* with Frankfurt-style counterexamples without begging the question against the other, or vice-versa. This would reveal the mismatch as fatal to the debate's current framing.

  **In essence:** Genuine progress requires moving beyond the Frankfurt case as the central battleground. It necessitates directly confronting the *priority dispute* between the metaphysics of sourcehood and the semantics of ability, coupled with clearer formal tools and a taxonomy that forces explicit declarations of foundational commitments. The half-century refinement of Frankfurt cases has likely exhausted its dialectical utility; the path forward lies in meta-theoretical clarification and engaging the sourcehood question head-on. The debate persists not because the cases are unresolved puzzles, but because they sit atop a deeper fault line about the very foundations of agency and responsibility.
