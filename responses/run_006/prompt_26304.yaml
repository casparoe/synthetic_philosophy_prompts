prompt: |-
  I'm on my university's IACUC and we're deadlocked on a protocol that's turned into a philosophy seminar. A neuroscientist wants to run a pain-study on pigs — electrode implants in the brain, nociceptive stimulation, the whole deal. She's already running a near-identical protocol on mice (approved last year, no friction). The pig version would use fewer animals overall, and she argues the data will translate better to humans because pig neuroanatomy is closer to ours. So on the Three Rs logic we normally apply, it looks decent: fewer animals, better science.

  Here's the split. Three of us think pigs are obviously a harder case than mice because pigs are more cognitively sophisticated — better memory, more behavioral flexibility, maybe something closer to suffering-as-we-know-it. Two others say this is just speciesism with a neuroscience gloss: we're drawing the line at "animals whose minds seem more like ours" and calling it an ethical distinction, same way people draw it at dogs vs. pigs or mammals vs. fish. They point out that we didn't ask any of these questions when the mouse protocol came through — we applied our standard checklist and approved it. Now suddenly for pigs we're inventing extra hurdles. They want us to evaluate the pig protocol on the exact same criteria we used for mice and stop treating pigs like they're in a different moral category just because we find them more relatable.

  The chair wants each of us to circulate a short written opinion before Thursday's vote. I need to recommend: approve, reject, or approve with conditions — and if conditions, they need to be concrete enough the researcher could actually respond to them. The opinion should honestly engage the strongest argument on the side I'm not taking, and it should give the committee something we can act on, not a tour of the animal-ethics literature.

  Also: tell me how confident you are in the recommendation, and single out the point you're least sure of. If there's a place where your reasoning goes soft I want to know where.
reasoning: |-
  Okay, the user is part of a university IACUC committee that's deadlocked on a pig pain study protocol. They need to write a recommendation before Thursday's vote. The neuroscientist argues the pig study would use fewer animals and provide better human-translatable data than her existing mouse study. The committee is split: some think pigs require higher ethical scrutiny due to greater cognitive sophistication, while others call this speciesism since mice were approved without such debate.

  Hmm, this is a classic ethics-in-science dilemma with real consequences. The user needs actionable advice, not philosophy. They explicitly want: 1) A clear recommendation (approve/reject/approve with conditions) 2) Concrete conditions if applicable 3) Engagement with the strongest counterargument 4) Confidence level and weakest point in the reasoning.

  First, unpacking the core conflict. The "cognitive sophistication" camp has a point - pigs do have complex cognition (studies show self-awareness, emotional contagion). But the "speciesism" camp isn't wrong either - why didn't we question mouse suffering? The mouse approval sets a precedent that's hard to ignore. 

  The key is recognizing both positions are partially right. The solution isn't rejecting the protocol but elevating welfare standards proportionally. The Three Rs framework already allows this - refinement isn't just about reducing pain but accounting for species-specific needs. Pigs' intelligence means standard analgesics might not address their psychological distress adequately. 

  For recommendations: Approval with conditions makes most sense. Main conditions should be: 1) Enhanced analgesia protocols (maybe multimodal) 2) Strict behavioral monitoring with pre-defined intervention triggers 3) Environmental enrichment to mitigate stress. These are concrete and actionable. 

  The strongest counterargument is indeed the speciesism charge. It's valid that we're inconsistent, but the response shouldn't be lowering standards for pigs - it should mean re-examining our mouse protocols later. This study forces us to confront a blind spot in our system. 

  Least confident point: Whether enrichment actually offsets the experimental distress meaningfully. There's limited data on this for farm animals in labs. But we have to try - it's the best available mitigation. 

  User seems stressed about the deadline and philosophical tangents. They need practical, vote-ready material. Keeping it concise but substantive is crucial. Also subtly acknowledging the emotional weight - working with large, intelligent mammals hits differently than mice, even if that's not "scientifically rigorous" to admit.
answer: |-
  Here's a recommendation draft designed for your IACUC vote, balancing ethical rigor with actionable criteria:

  ---

  **Recommendation: APPROVE WITH CONDITIONS**  
  *(Confidence: 85%)*

  ### Core Reasoning:
  The protocol presents a scientifically valid case for improved translational relevance and reduced animal numbers. However, the committee’s legitimate concern about pigs’ advanced cognition (e.g., episodic memory, social intelligence, potential for complex distress) warrants *procedural refinement*, not rejection. This isn’t speciesism—it’s evidence-based **welfare adjustment** reflecting the species’ capacities. We routinely refine protocols for different species (e.g., environmental enrichment for primates vs. rodents). Applying identical criteria to mice and pigs ignores established ethology, which violates the *Refinement* pillar of the 3Rs by failing to adapt to species-specific needs.

  ### Conditions for Approval:
  1.  **Enhanced Analgesia & Monitoring:**  
      *   **Requirement:** Multimodal analgesia (e.g., NSAID + opioid/local anesthetic) must be used *plus* validated, continuous post-op pain assessment (e.g., Pig Grimace Scale, vocalization analysis, activity monitoring) with predefined intervention thresholds. The PI must specify backup analgesics if initial control is inadequate.  
      *   **Rationale:** Pig nociception/affective pain pathways are more complex than mice; standard protocols may be insufficient.  
      *   **Actionability:** PI can consult veterinary anesthesiology and add monitoring tech specs.

  2.  **Behavioral & Environmental Refinements:**  
      *   **Requirement:** Mandatory social housing pre/post-op (unless scientifically justified otherwise) AND provision of species-specific enrichment (e.g., rooting substrates, manipulable objects) throughout the study. Daily behavioral logs must track signs of distress (e.g., withdrawal, aggression, stereotypies).  
      *   **Rationale:** Pigs are highly social and exploratory; isolation/boredom compounds distress.  
      *   **Actionability:** PI can detail housing/enrichment plans and log templates.

  3.  **Humane Endpoint Triggers:**  
      *   **Requirement:** Define *additional*, stricter behavioral endpoints beyond standard physiologic measures (e.g., sustained avoidance of conspecifics >24h, lack of engagement with enrichment >48h, severe apathy).  
      *   **Rationale:** Advanced cognition may manifest suffering through behavioral changes before physical decline.  
      *   **Actionability:** PI can list specific, observable behaviors warranting early euthanasia.

  ### Engaging the Strongest Counterargument:
  The "speciesism" critique holds weight: **We *were* inconsistent by not scrutinizing mouse cognition/suffering more deeply.** This highlights a flaw in our standard checklist for smaller, less "relatable" animals. However, the solution isn’t to ignore pig cognition to maintain parity, but to *improve our framework for all species.* This protocol forces necessary evolution: moving forward, we should explicitly require *species-specific welfare justifications* for *all* protocols, including rodents. Rejecting this study solely because we previously overlooked mouse suffering is ethically incoherent and hinders scientific progress based on better translational models.

  ### Least Confident Point:
  **(Confidence Dip: ~70%)**  
  **Whether the proposed refinements (especially enrichment) *effectively mitigate* the psychological distress inherent in this invasive protocol.** While robust evidence supports enrichment reducing stress in captive pigs, its efficacy against *severe, induced pain* in a research setting is less clear. I’m not certain it fully addresses the core ethical concern about "suffering-as-we-know-it." However, rejecting the study based on this uncertainty feels like imposing an impossible standard – the conditions represent the *best available, practical mitigation* grounded in current welfare science. This is where the scientific merit (translation, reduced numbers) tips the balance.

  ### Why This Works for the Committee:
  *   **Actionable:** Clear, specific conditions the PI can implement/modify.
  *   **Addresses Both Sides:** Acknowledges cognitive concerns without rejecting the science; forces systemic improvement.
  *   **Grounds in 3Rs:** Strengthens *Refinement* based on species biology, aligns with *Reduction*.
  *   **Breaks Deadlock:** Moves beyond philosophy into concrete welfare safeguards.

  ---

  **Final Note:** This recommendation pushes the IACUC toward a more nuanced, species-specific application of the 3Rs. If approved with these conditions, it sets a precedent for ethically rigorous evaluation of higher-functioning models without vetoing scientifically valuable work. Good luck with the vote.
