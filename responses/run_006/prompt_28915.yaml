answer: |-
  Right then, let's cut to the chase. Here's the spec sheet for an adequate theory of promissory obligation – the core requirements it *must* or *really should* deliver, based on the philosophical puzzles and practical realities of promising.

  **I. Core Cases It Must Get Right (The Hard Examples)**

  1.  **Unlearned Promises:** Must explain why a promise creates an obligation *even if the promisee never learns of it* (e.g., you post a promise letter that gets lost). *Why:* Intuition strongly suggests the obligation arises upon making the promise, not reception. **Non-negotiable.**
  2.  **Impossibility:** Must account for when a promise becomes genuinely *impossible* to fulfil through no fault of the promisor (e.g., promising to sell a specific vase, which then smashes accidentally). *Why:* Obligations shouldn't bind to the logically or physically impossible. Requires distinguishing impossibility from mere difficulty. **Largely non-negotiable** (though *when* obligation ceases may be debated).
  3.  **Duress/Coercion:** Must explain why promises made under significant illegitimate *pressure* or *threat* are often void or voidable (e.g., "Promise me £10,000 or I'll break your legs"). *Why:* Justice demands that agreements under duress aren't binding. **Non-negotiable.**
  4.  **Immoral/Illegal Promises:** Must explain why promises to do something *wrong* (immoral or illegal) generally do *not* create a binding obligation (e.g., promising to commit murder). *Why:* Obligations cannot override fundamental moral/legal prohibitions; a theory shouldn't make wrongdoing obligatory. **Non-negotiable.**
  5.  **Promises to the Dead:** Must address whether a promise *to someone now deceased* remains binding (e.g., promising a dying friend to care for their child). *Why:* Tests if the obligation relies solely on the living promisee's ongoing will/rights or on other factors (e.g., the promisor's commitment, the deceased's interest). **Debated, but a strong test - likely non-negotiable for a comprehensive theory.**
  6.  **Promises to Oneself:** Must determine if these constitute genuine promissory *obligations* (e.g., "I promise myself I'll quit smoking"). *Why:* Tests the core features of promising – is a second party essential? **Highly contested; negotiable camp preference** (some views inherently exclude it, others include it as a special case).

  **II. Crucial Distinctions It Must Not Collapse**

  7.  **Promise vs. Prediction/Intention:** Must sharply distinguish *promising* from merely *predicting* an outcome or *stating an intention* (e.g., "I'll be there tomorrow" vs. "I *promise* I'll be there tomorrow"). *Why:* Promising uniquely creates an obligation; collapsing this distinction makes promising meaningless. **Non-negotiable.**
  8.  **Existence vs. Weight of Obligation:** Must distinguish the *creation* of the promissory obligation from its *strength* or *weight* relative to other moral reasons (e.g., keeping a trivial promise vs. aiding someone in immediate danger). *Why:* Explains why we sometimes *justifiably* break promises without denying the obligation existed. **Non-negotiable.**
  9.  **Breaking vs. Rectification:** Must distinguish the *wrong* of breaking a promise from the potential *duty to rectify* the harm caused by breaking it. *Why:* Breaking a promise is one wrong; failing to apologise, compensate, or make amends is potentially another distinct wrong. **Important distinction, likely non-negotiable** for a full account.

  **III. Essential Constraints It Must Respect**

  10. **Non-Automatic Binding:** Must *not* make *every* utterance of "I promise" binding, regardless of context, content, or competence (e.g., promises made while asleep, utterly nonsensical promises, promises by young children). *Why:* Promising requires intentional agency and minimally intelligible content. **Non-negotiable.**
  11. **Non-Subjectivism:** Must *not* make the existence of the obligation depend *entirely* on the promisee's *feelings* or *beliefs* about it (e.g., "I'm only obligated if you feel offended if I break it"). *Why:* Obligations are objective normative facts, not mere projections of feeling; this avoids capriciousness. **Non-negotiable.**
  12. **Explaining Release/Uptake:** Must explain the significance of the *promisee releasing* the promisor or the role of *promisee uptake* (understanding/acceptance) *without* making them constitutive of the *initial* obligation (linking back to Unlearned Promises). *Why:* Release clearly matters, and uptake often seems relevant, but the obligation arises from the act of promising itself. **Non-negotiable** to explain the phenomena; **negotiable** on *how* central uptake is.

  **The Heavy Lifter:**
  The requirement doing the **most work ruling out usual contenders** is **#10 (Non-Automatic Binding)**. It immediately sinks simplistic speech-act views that equate uttering "I promise" with creating an obligation regardless of context (e.g., jokes, coercion, insanity). It forces the theory to specify the *necessary conditions* for bindingness.

  **Suspected Conflict:**
  The pair **#11 (Non-Subjectivism)** and **#12 (Explaining Release/Uptake)** creates tension. If the obligation doesn't depend on the promisee's feelings (#11), why does the promisee's act of *releasing* the promisor (#12) dissolve it? Similarly, if uptake isn't essential for the obligation arising (#1, #12), why does it often *seem* crucial? Reconciling the objective basis of the obligation with the promisee's power over it is a major challenge.

  **Brief Scorecard of Usual Suspects:**

  *   **Practice/Convention View (e.g., Rawls):**
      *   *Fails:* #1 (Unlearned Promises - practice requires shared understanding?), #5 (Promises to Dead - practice relies on living participants?), #12 (Explanation of Release - why does *this* convention include release?).
      *   *Struggles:* #4 (Immoral Promises - is the practice *that* authoritative?), #6 (Self-Promises - outside the social practice?).
  *   **Expectation View (e.g., Scanlon):**
      *   *Fails:* #1 (Unlearned Promises - no expectation created?), #11 (Non-Subjectivism - obligation depends on expected reliance/feelings?).
      *   *Struggles:* #8 (Existence vs. Weight - why is *this* expectation special?), #12 (Release - why does releasing negate the wrong of creating the expectation?).
  *   **Normative Powers View (e.g., Owens, Shiffrin):**
      *   *Fails:* #6 (Self-Promises - can one grant oneself a right?).
      *   *Struggles:* #1 (Unlearned Promises - can a right be granted unknowingly?), #5 (Promises to Dead - does the right persist?), #12 (Uptake - is granting a right possible without uptake?), #4 (Immoral Promises - can one grant a right to demand wrongdoing?).

  This spec highlights why no single theory commands universal assent – each struggles with at least one non-negotiable requirement or a crucial distinction. The tension between objectivity and the promisee's role (#11 vs #12) remains particularly thorny.
