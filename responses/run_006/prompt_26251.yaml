prompt: |-
  I'm teaching Le Guin's "The Ones Who Walk Away from Omelas" in my democratic theory seminar next week and I want to read it through the boundary problem — the question of who properly belongs to the demos, who gets to be part of "the people" whose flourishing the political order is meant to serve. The story makes this wierdly literal: the whole city's happiness depends on a single child locked in a basement, and everyone knows it. The child is spatially inside the city but politically outside it — not a beneficiary, not a participant, just a condition. I want to use the story to press on the idea that the boundary problem is prior to democratic procedure: you can't vote on who gets to vote without already having a demos, and Omelas seems to dramatize the violence of that pre-democratic constituting moment. But I don't want to reduce the story to an allegory, and I'm worried the fit isn't perfect — the child isn't exactly a foreigner or a non-citizen in the usual sense, and the ones who walk away don't form a new demos, they just leave. So here's what I'd like: give me exactly five numbered points, each a sentence or two, no introduction or conclusion, that read the story through the boundary problem — where it illuminates the philosophical issue, where it complicates it, and where the honest critic has to admit the story is doing something else. For each point include a confidence level (high/medium/low) and single out the one you're least sure about.
