answer: |-
  You've brilliantly exposed the core tension in the White Horse Paradox! The error lies in the inference at **step (3)**. Rejecting this step preserves the valuable insights about compound terms while avoiding the absurdities.

  Here's the breakdown:

  1.  **Step (1) is Valid:** It correctly observes the difference in *extension* (the set of things satisfying the request). The set satisfying "bring me a horse" (all horses) is larger than the set satisfying "bring me a white horse" (only white horses). They are different sets.
  2.  **Step (2) is Ambiguous but Salvageable:** Saying they "name different things" can be interpreted correctly as "they pick out different sets/extensions" (as established in (1)). This is acceptable *if* we interpret "name different things" as "have different extensions." The cost is acknowledging that "naming different things" here refers strictly to the *sets* being different, not necessarily the *kinds* or *essences* being fundamentally incompatible.
  3.  **Step (3) is the Fatal Error:** This is where the invalid inference happens. **From "term A and term B name different things (have different extensions)" it does *not* logically follow that "a B is not an A".**
      *   **Why it's invalid:** This inference confuses *difference in extension* with *exclusion from the category*. Set B (white horses) is a *subset* of set A (horses). The fact that B is not identical to A does *not* mean that members of B are not members of A. All members of B *are* members of A. Saying the *sets* are different (because one is a proper subset of the other) does not imply that a white horse isn't a horse; it implies that *not all horses are white horses*, which is true and unproblematic. The inference mistakenly treats "names different things" as implying mutual exclusivity or categorical incompatibility.
  4.  **Step (4) Correctly Demonstrates the Absurdity:** You perfectly show the reductio ad absurdum. Applying the faulty step (3) inference consistently leads to nonsensical conclusions: "a brown horse is not a horse" and "a white horse is not white." This proves the inference rule used in step (3) is invalid.
  5.  **Step (5) Highlights the Absurd Conclusion:** The logical endpoint of accepting step (3) is indeed absurd, confirming the error.

  **What Rejecting Step (3) Costs and Preserves:**

  *   **Cost:** You give up the literal, surface-level reading of the paradoxical conclusion "a white horse is not a horse." You acknowledge this is a provocative *non sequitur* resulting from a logical error.
  *   **Preserves the Valuable Insight:** The *core work* of the argument remains intact and is crucial for your lecture:
      *   **Compound Terms Create New Kinds:** "White horse" designates a more specific kind than "horse" alone. It carves reality at a different joint, picking out a subset defined by the conjunction of properties (horseness + whiteness).
      *   **Difference in Extension/Satisfaction Conditions:** The argument powerfully demonstrates that "horse" and "white horse" have different extensions and different satisfaction conditions (as per step (1)). What counts as fulfilling one request doesn't necessarily fulfill the other. This highlights the semantic precision demanded by the School of Names.
      *   **Focus on Names (Ming):** The argument brilliantly showcases the Gongsonian focus on how names (terms) function – how their reference is determined and how compound names create new, specific designations distinct from their components. "White horse" isn't simply "white" + "horse" in its reference; it designates the *intersection*.
      *   **Provocation and Dialectic:** The *apparent* absurdity of step (3) serves the School of Names' purpose of shaking up conventional assumptions about language and reality, forcing deeper analysis. Rejecting the inference doesn't negate this dialectical function; it clarifies what the argument *actually* proves versus where it missteps.

  **How to Frame this for Your Lecture:**

  1.  **Acknowledge the Paradox:** Present the argument as Gongsun Long (or the tradition) presents it, including the conclusion "a white horse is not a horse."
  2.  **Highlight the Insight (Steps 1 & 2):** Emphasize the undeniable truth in steps 1 and 2 – the difference in what satisfies the requests and the resulting difference in the extensions/reference of the terms. Discuss how "white horse" creates a new, specific kind.
  3.  **Identify the Flaw (Step 3):** Explicitly point out the invalid inference: "Just because the *set* of white horses is different from (and smaller than) the set of all horses, it *does not follow* that an individual white horse fails to be a horse. It only follows that not *everything* that is a horse is a white horse." Use the subset analogy.
  4.  **Demonstrate the Absurdity (Steps 4 & 5):** Show how applying the same faulty inference leads to "a white horse is not white," proving the inference rule is bad.
  5.  **Explain the Cost & Value:** Conclude that while the *literal conclusion* (step 3) is false and based on a logical error, the argument's real value lies in its powerful demonstration of how compound terms function: they define new, specific kinds with distinct extensions and satisfaction conditions. The paradox provokes us to think carefully about language, reference, and categorization – core concerns of the School of Names. Rejecting step 3 allows you to embrace the argument's insightful core about compound terms without being committed to the absurdity that a white horse isn't white or isn't a horse.

  By rejecting step (3), you salvage the profound point about the semantic power of compound names while avoiding logical incoherence. This is the standard philosophical resolution to the paradox.
