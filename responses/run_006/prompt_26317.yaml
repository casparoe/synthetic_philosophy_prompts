prompt: |-
  I work on community design at a large online platform. My team regularly proposes new behavioral norms we want to see emerge organically — things like "credit the creator when you repost," "use content warnings for certain topics," or "don't reply to a new user's first post with sarcasm." We promote these through interface nudges, community manager messaging, and public endorsement, but we don't enforce them through the moderation system. Some take hold and become self-sustaining; others fizzle out or require constant prodding. We can't reliably predict which.

  I've been told that David Lewis's account of convention — where a convention is a self-sustaining solution to a recurring coordination problem, supported by mutual expectations rather than enforcement — offers a way to think about this. I want you to turn that account into a procedure my team can actually use, before we invest in promoting a norm, to assess whether it has the structure to become a genuine convention.

  Please structure the response as follows:

  1. **The procedure** (~500 words). A step-by-step checklist, each step a yes/no question. A "no" should either stop the procedure (the norm won't become a convention) or flag a specific obstacle we would need to address before proceeding. The steps should operationalize the core Lewisian conditions: that the situation is a recurring coordination problem, that there is at least one viable alternative regularity, that each person prefers to follow the regularity when they expect others to, and that these expectations can become common knowledge. For each step, specify what counts as sufficient evidence for a "yes" — what we should look for in user behavior, platform data, or the structure of the interaction. Be honest about which steps require judgment rather than data.

  2. **Worked example: a norm that should work** (~300 words). Run the procedure on a proposed norm that passes. Show the reasoning at each step, including what the evidence would look like and what the alternative regularity is.

  3. **Worked example: a norm that should fail** (~300 words). Run the procedure on a norm that fails — ideally one my team would find intuitively appealing and would want to work — at an early step. Explain what kind of intervention would be needed instead (enforcement, incentive redesign, changing the environment) and whether the Lewisian framework tells us anything about why that intervention is necessary.

  4. **Where the procedure breaks** (~200 words). Identify cases the procedure cannot settle: norms that aren't coordination problems at all (norms against exploitation, norms encoding status hierarchies, norms where people disagree about what outcome is good), norms where the Lewisian conditions are met but the norm still doesn't take hold, and points where the procedure substitutes the designer's judgment for evidence about what users actually prefer. Say what the Lewisian framework is structurally blind to.
reasoning: |-
  We are structuring the response as requested.

  1. **The Procedure: Lewisian Convention Assessment Checklist**

     Based on David Lewis's account of convention as a self-sustaining solution to a recurring coordination problem, we can break down the assessment into the following steps. Each step is a yes/no question. A "no" at any step either stops the procedure (indicating the norm is unlikely to become a convention without significant changes) or flags a specific obstacle that must be addressed. The steps operationalize Lewis's core conditions: recurrence, alternatives, conditional preference, and common knowledge.

     **Step 1: Is there a recurring coordination problem?**  
     *Definition*: A situation where multiple users face the same interaction repeatedly, and each user's best action depends on what others do. The problem must involve alignment of actions (coordination), not just conflict or unilateral action.  
     *Evidence for "yes"*:  
     - Look for repeated instances of the same type of interaction in platform data (e.g., reposting, replying to new users).  
     - User interviews/surveys indicating uncertainty about how to act or frustration when others act unpredictably.  
     - Behavioral data showing inconsistent outcomes (e.g., sometimes reposts with credit lead to positive engagement, sometimes not).  
     *Judgment call*: Requires interpreting whether the situation is truly about coordination (mutual adjustment) rather than a pure conflict of interest or a problem solvable by individual action.  
     *If "no"*: Stop. This is not a coordination problem, so Lewisian convention won't emerge. Consider whether enforcement or incentives are needed instead.

     **Step 2: Is there at least one viable alternative regularity?**  
     *Definition*: A different pattern of behavior that could also solve the same coordination problem. This alternative must be feasible and recognizable to users.  
     *Evidence for "yes"*:  
     - Identify existing or potential alternative behaviors (e.g., for "credit the creator," an alternative might be "no credit but use a standardized repost format").  
     - Platform data showing that some users already follow a different pattern in similar situations.  
     - User research revealing that users can imagine and describe alternatives.  
     *Judgment call*: Deciding what counts as "viable" — it must be a real option that could solve the problem, not a theoretical but impractical one.  
     *If "no"*: Flag as obstacle. Without alternatives, the norm might be the only option, but Lewis requires alternatives for a convention to emerge. You may need to design an alternative or reconsider if this is truly a coordination problem.

     **Step 3: Does each user prefer to follow the proposed regularity if they expect others to follow it? (Conditional Preference)**  
     *Definition*: Users must see the norm as beneficial when others follow it, compared to the alternative(s). This is conditional on expectations — if they expect others to follow, they prefer to follow too.  
     *Evidence for "yes"*:  
     - Run scenario-based surveys: "If most people did X, would you prefer to do X or Y?"  
     - A/B tests: Introduce the norm in a small community and measure voluntary adoption and satisfaction when others are also adopting.  
     - Data from similar platforms or existing subcommunities where the norm is followed, showing higher user retention/engagement.  
     *Judgment call*: Requires inferring preferences from behavior or self-reports, which can be biased. Must ensure the preference is conditional on expectations, not absolute.  
     *If "no"*: Stop. If users don't prefer the norm even when others follow, it won't sustain. You might need to redesign the norm or add incentives.

     **Step 4: Can expectations about others' behavior become common knowledge?**  
     *Definition*: Users must be able to form and share beliefs that "almost everyone follows the norm" and that "almost everyone expects others to follow." This requires observable behavior and communication channels.  
     *Evidence for "yes"*:  
     - Platform features that make compliance visible (e.g., public attribution for reposts).  
     - Data showing that when the norm is adopted in a group, users quickly notice and adjust expectations (e.g., via increased discussion or reduced confusion).  
     - User testing: After exposure to the norm in a simulated environment, users report believing others will follow it.  
     *Judgment call*: Assessing whether the platform's design supports common knowledge (e.g., through notifications, public displays) or hinders it (e.g., fragmented communities).  
     *If "no"*: Flag as obstacle. You may need to enhance visibility or communication tools to build common knowledge.

     **Step 5: Is the proposed regularity self-sustaining without external promotion?**  
     *Note*: This step is predictive and should be assessed after testing the norm in a limited setting.  
     *Definition*: Once established, the norm persists because users prefer to follow it given their expectations, without needing nudges or enforcement.  
     *Evidence for "yes"*:  
     - Run a pilot: Introduce the norm in a subset of communities, then phase out promotion. Monitor if adoption remains high.  
     - Network effects: Data shows adoption spreading organically (e.g., via social learning) after initial seeding.  
     - User reports: After the pilot, users say they follow the norm because "that's what everyone does," not because of prompts.  
     *Judgment call*: Requires observing the norm over time to confirm stability.  
     *If "no"*: Flag as obstacle. The norm might need longer seeding, a critical mass, or environmental adjustments to tip into self-sustaining.

  2. **Worked Example: A Norm That Should Work**  
     **Proposed norm**: "Credit the creator when you repost."

     **Step 1: Recurring coordination problem?**  
     Yes. Reposting is frequent. Without credit, creators feel exploited, and reposters face backlash. Users need to coordinate on whether to credit and how.  
     *Evidence*: High volume of reposts; user complaints about stolen content; data showing variability in crediting behavior.

     **Step 2: Alternative regularity?**  
     Yes. Alternative: Repost without credit but with a link to the original. Or, a platform-standard "share" button that auto-credits.  
     *Evidence*: Some users already use manual credits, others use platform tools, others do nothing.

     **Step 3: Conditional preference?**  
     Yes. If users expect others to credit, they prefer to credit too (to avoid criticism and because it's fair).  
     *Evidence*: In surveys, 80% say they'd credit if others did. In A/B tests, communities with high crediting see higher reciprocity.

     **Step 4: Common knowledge?**  
     Yes. The platform can make crediting visible (e.g., showing "via @creator" on reposts).  
     *Evidence*: When tested, users in the pilot group reported noticing credits and feeling expected to do the same.

     **Step 5: Self-sustaining?**  
     Yes. After initial promotion, crediting rates remained high even when nudges were removed in the test group.  
     *Evidence*: Organic adoption grew by 15% monthly; users corrected non-creditors.

     **Conclusion**: This norm has the structure to become a convention.

  3. **Worked Example: A Norm That Should Fail**  
     **Proposed norm**: "Don't reply to a new user's first post with sarcasm."

     **Step 1: Recurring coordination problem?**  
     *Yes*: New users join frequently, and replies set the tone. But note: This might not be a pure coordination problem.  
     *Evidence*: Data shows new users often face sarcastic replies; some leave after negative experiences.

     **Step 2: Alternative regularity?**  
     *Yes*: Alternative: "Use neutral language in replies to new users" or "Ignore new users' posts if you can't be positive."  
     *Evidence*: Some communities already enforce positivity; others are sarcastic by culture.

     **Step 3: Conditional preference?**  
     *No*: Many users (especially in edgy communities) prefer sarcasm — it's part of their identity. Even if others avoid sarcasm, they might not.  
     *Evidence*: Surveys show only 40% of active users prefer neutrality if others use it; others enjoy sarcasm regardless. A/B tests show sarcasm persists even in positivity-prompted groups.

     **Failure at Step 3**: The norm lacks conditional preference. Users don't universally prefer to avoid sarcasm when others avoid it; some gain status from it.

     **Intervention needed**:  
     - Enforcement: Moderate sarcastic replies to new users.  
     - Incentive redesign: Reward positive replies with visibility.  
     - Environmental change: Limit reply options for first posts.  
     **Lewisian insight**: This isn't a coordination problem because preferences conflict — some users want a welcoming environment, others enjoy sarcasm. Conventions require aligned preferences conditional on expectations.

  4. **Where the Procedure Breaks**  
     The Lewisian framework is structurally blind to:  
     - **Non-coordination problems**: Norms against exploitation (e.g., "don't harass") involve conflicts of interest, not mutual adjustment. Lewisian conventions won't emerge here; enforcement is needed.  
     - **Status or hierarchy norms**: Norms that signal in-group status (e.g., using insider jargon) may spread without solving coordination problems, driven by social rewards.  
     - **Preference misalignment**: If users disagree on the desired outcome (e.g., in political groups), the conditional preference step fails, but the procedure flags this.  
     - **Hidden preferences**: The procedure relies on observable evidence or surveys, which may not capture true preferences (e.g., users hide their desire to troll).  
     - **External shocks**: Even if all steps pass, real-world events (e.g., viral controversies) can disrupt conventions.  
     - **Designer bias**: Steps 2–3 require judging "viable alternatives" and "preferences," which may reflect the designer's worldview, not users'.  

     In such cases, the procedure cannot settle the outcome. Lewisian conventions are a specific type of norm; many community norms require other tools.
answer: |-
  ### 1. The Procedure: Lewisian Convention Assessment Checklist  
  This checklist operationalizes David Lewis's conditions for a convention: a recurring coordination problem, at least one viable alternative regularity, conditional preference for conformity given expectations, and the potential for common knowledge. A "no" at Steps 1–3 stops the process; a "no" at Steps 4–5 flags an obstacle requiring redesign.  

  **Step 1: Is the proposed norm addressing a *recurring coordination problem*?**  
  - **What to ask**: Are users repeatedly facing a situation where (a) their optimal action depends on what others do, and (b) alignment benefits everyone?  
  - **Evidence for "yes"**:  
    - *Data*: High-frequency interactions (e.g., 70%+ of users encounter this weekly).  
    - *Behavior*: User complaints about "confusion" or "inconsistency" (e.g., forums debating how to repost).  
    - *Structure*: Mutual dependence exists (e.g., crediting helps creators *and* reposters avoid backlash).  
  - **Judgment required**: Distinguishing coordination problems (e.g., "How should we label spoilers?") from unilateral dilemmas (e.g., "Don't spam").  
  - **If "no"**: Stop. This isn’t a coordination problem—consider enforcement or incentives.  

  **Step 2: Is there at least one *viable alternative regularity* to solve the same problem?**  
  - **What to ask**: Could users plausibly adopt a different stable behavior pattern that also resolves the coordination problem?  
  - **Evidence for "yes"**:  
    - *Data*: Natural variation in current behavior (e.g., 30% credit creators manually, 20% use platform tools, 50% don’t credit).  
    - *User input*: Surveys show users recognize alternatives (e.g., "We could use hashtags instead of @mentions for credit").  
  - **Judgment required**: Assessing "viability" (e.g., alternatives must be recognizable, low-friction, and historically/technically feasible).  
  - **If "no"**: Flag obstacle. Without alternatives, a Lewisian convention can’t emerge—design an alternative or redefine the problem.  

  **Step 3: Would each user *prefer to follow the norm* if they expected *most others to follow it*?**  
  - **What to ask**: Given expectations of widespread conformity, do users see adhering as the best *personal* outcome?  
  - **Evidence for "yes"**:  
    - *Surveys/A-B tests*: >60% of users report they’d comply if others did (e.g., "I’d use content warnings if others did, so my posts aren’t ignored").  
    - *Behavioral data*: In isolated communities where the norm organically exists, compliance correlates with higher engagement/satisfaction.  
  - **Judgment required**: Separating *conditional preference* ("I’ll do it if others do") from *intrinsic motivation* ("I’ll do it because it’s right").  
  - **If "no"**: Stop. Users won’t sustain it voluntarily—redesign the norm or add incentives.  

  **Step 4: Can expectations of conformity become *common knowledge* on the platform?**  
  - **What to ask**: Can users easily observe others’ compliance and infer that "everyone knows" the norm exists?  
  - **Evidence for "yes"**:  
    - *Platform design*: Features make compliance visible (e.g., public labels for content warnings).  
    - *Data*: Rapid information diffusion (e.g., norm discussions trend quickly; >40% of users encounter the norm via feeds within 1 week of promotion).  
  - **Judgment required**: Gauging if your platform’s architecture (e.g., algorithmic amplification, notification systems) supports visibility.  
  - **If "no"**: Flag obstacle. Boost observability (e.g., add compliance indicators) or seed in smaller communities first.  

  **Step 5: Is the norm *self-reinforcing* under real-world conditions?**  
  - **What to ask**: Once adopted by a critical mass, would compliance reduce the need for promotion?  
  - **Evidence for "yes"**:  
    - *Pilot data*: In tests, compliance grows >10% monthly *after* removing nudges.  
    - *Network effects*: Users punish non-compliance (e.g., downvoting uncredited reposts) or reward conformity (e.g., liking warnings).  
  - **Judgment required**: Predicting tipping points. Use agent-based modeling or historical analogs.  
  - **If "no"**: Flag obstacle. The norm needs sustained promotion or environmental tweaks (e.g., amplifying social feedback).  

  ---

  ### 2. Worked Example: A Norm That Should Work  
  **Proposed norm**: "Use standardized spoiler warnings (e.g., [SPOILER]) before discussing new episodes."  

  - **Step 1: Recurring coordination problem?**  
    **Yes**. Users frequently encounter unmarked spoilers. Alignment benefits everyone: avoiders skip content, posters get engagement.  
    *Evidence*: 65% of TV forum users report weekly spoiler exposure; complaints like "I scrolled past because no warning."  

  - **Step 2: Viable alternative regularity?**  
    **Yes**. Alternative: Hiding spoilers behind click-to-reveal blocks.  
    *Evidence*: 40% of users currently use click-to-reveal; 30% use [SPOILER]; 30% use no warning. All solve the problem.  

  - **Step 3: Conditional preference?**  
    **Yes**. If users expect others to use [SPOILER], they prefer it too (to avoid complaints and ensure their posts are seen).  
    *Evidence*: In A-B tests, spoiler-tagged posts get 25% more engagement when the norm is localized. Surveys show 75% would comply if standardized.  

  - **Step 4: Common knowledge?**  
    **Yes**. Platform displays [SPOILER] tags prominently in feeds.  
    *Evidence*: In pilots, 80% of users recognized the norm within 2 weeks via visibility tools.  

  - **Step 5: Self-reinforcing?**  
    **Yes**. Non-tagged spoilers get downvoted; users remind offenders.  
    *Evidence*: After promotion ended in tests, compliance rose from 50% to 85% in 3 months.  

  **Conclusion**: All steps pass. This can become a convention.  

  ---

  ### 3. Worked Example: A Norm That Should Fail  
  **Proposed norm**: "Don’t reply to a new user’s post with criticism for their first 24 hours."  

  - **Step 1: Recurring coordination problem?**  
    **Yes**. New users join daily; veterans’ replies set community tone. Alignment helps retention (new users stay) and efficiency (veterans avoid backlash).  
    *Evidence*: 50% of new users post weekly; "welcome culture" is a common forum topic.  

  - **Step 2: Viable alternative regularity?**  
    **Yes**. Alternative: "Always start with positive feedback before critiquing."  
    *Evidence*: Some subcommunities use "compliment sandwiches"; others ignore new users.  

  - **Step 3: Conditional preference?**  
    **No**. Many veterans *prefer* criticizing immediately (saves time, asserts expertise), even if others withhold criticism.  
    *Evidence*: Surveys show only 30% of active users would comply if others did ("Criticism is how we maintain quality"). A-B tests reveal no drop in harsh replies despite promotion.  

  **Failure at Step 3**: The norm lacks conditional preference. Veterans gain little from complying and lose status/expedience.  

  **Intervention needed**:  
  - **Enforcement**: Moderators remove harsh replies.  
  - **Incentive redesign**: Gamify positivity (e.g., award badges for "welcoming" replies).  
  - **Environmental change**: Delay comment visibility for new users’ posts.  
  **Lewisian insight**: This isn’t a pure coordination problem—it’s a conflict between new users’ needs and veterans’ preferences. Conventions require mutual benefit.  

  ---

  ### 4. Where the Procedure Breaks  
  The Lewisian framework is **structurally blind** to:  
  - **Non-coordination norms**: Norms addressing exploitation (e.g., "don’t dox") or status hierarchies (e.g., "titles denote expertise") involve power imbalances or moral mandates, not mutual adjustment. The procedure fails at Step 1.  
  - **Preference misalignment**: If users disagree on the *desired outcome* (e.g., activists vs. trolls debating "allowed speech"), Step 3 will fail, but the framework doesn’t resolve the conflict—only external incentives can.  
  - **Hidden preferences**: Surveys (Step 3) may misreport preferences due to social desirability bias.  
  - **External shocks**: Even if all steps pass, real-world events (e.g., viral controversies) can derail conventions.  
  - **Tacit knowledge**: Lewis assumes rationality, but norms often spread through imitation, not conscious coordination.  
  - **Designer bias**: Steps 2–3 rely on *your team’s judgment* of "viable alternatives" and "preferences," which may not reflect marginalized users’ needs.  

  **When to abandon the procedure**: If a norm fails Step 1 or 3, it likely needs top-down enforcement. If it passes all steps but still fails, investigate cognitive biases (e.g., pluralistic ignorance) or platform friction (e.g., UX obscures compliance).
