  ## The Persistent Indeterminacy in Teleosemantics: Beyond the Disjunction Problem

  Teleosemantics, which grounds mental content in the biological functions of representational states (as determined by evolutionary or learning history), effectively addresses the disjunction problem by privileging the conditions under which a state was *selected for* tracking, rather than all conditions where it happens to be tokened. However, a deeper indeterminacy problem arises when a single representational mechanism has a complex evolutionary history involving exaptation, where *multiple, distinct etiologies* contribute to its current maintenance. This problem persists even after solving the disjunction problem and resists standard solutions, suggesting a need to revise a core commitment of the program.

  **The Central Case: The Predator Detector**

  Consider a visual detection system in a prey species (e.g., a ground squirrel). This neural mechanism was originally selected for in ancestral environments for reliably detecting the presence of *aerial predators* (e.g., hawks), triggering an immediate freeze response. Over time, due to environmental shifts, the *same* neural mechanism became exapted: it also reliably detects the presence of *terrestrial predators* (e.g., foxes), triggering a distinct flight-to-burrow response. Crucially:

  1.  **Original Selection:** The mechanism's initial fixation and refinement were driven by selection for detecting hawks (H).
  2.  **Exaptation & Current Maintenance:** The mechanism's current presence and structure are *also* explained by selection pressure favoring its ability to detect foxes (F). Both predator types are now common threats, and failure to detect either significantly reduces fitness. Both H-tracking and F-tracking contribute to the mechanism's current maintenance in the population.
  3.  **Incompatibility:** H and F are distinct, incompatible properties. There is no single, unified property "H-or-F" that fully captures the distinct adaptive responses required (freeze vs. flee).

  The problem is: What is the *unique* content of the state produced by this mechanism? Does it mean HAWK, FOX, or something else (like DANGER or PREDATOR)? Teleosemantics seeks a naturalistically respectable, uniquely determined content. However, applying standard solutions reveals deep conflict or circularity.

  **Standard Solutions and Their Failure:**

  1.  **Appealing to Current Selection/Stabilizing Function:**
      *   **Proposal:** Content is fixed by the conditions that *currently* explain the state's maintenance (its "stabilizing function").
      *   **Problem:** Both H-detection *and* F-detection currently contribute to stabilization. This suggests the content is disjunctive: HAWK OR FOX. However, this is deeply unsatisfactory. The state doesn't trigger a generic "predator response"; it reliably co-varies with and causes two *distinct*, incompatible, and highly specific behavioral responses (freeze vs. flee) depending on the predator type (which the animal can often discriminate post-detection). Assigning "HAWK OR FOX" fails to capture this specificity and the downstream functional differentiation. The mechanism isn't *for* detecting a disjunction; it's involved in detecting two distinct things that happen to require different actions.

  2.  **Appealing to the Consumer's Use:**
      *   **Proposal (e.g., Millikan):** Content is determined by how consuming systems (e.g., the freeze mechanism, the flee mechanism) *use* the representational state to perform *their* proper functions.
      *   **Problem:** Which consumer defines the content? The freeze response system consumes the state *as if* it meant HAWK, performing its function (avoiding hawks) when the state co-varies with H. The flee response system consumes the state *as if* it meant FOX, performing its function (avoiding foxes) when the state co-varies with F. Appealing to the consumer merely pushes the indeterminacy down a level. *Which* consumer's perspective is privileged? The historical consumer (freeze for H)? The newer consumer (flee for F)? Both uses are now integral to the system's current fitness. There's no non-arbitrary way to choose one consumer's "interpretation" without presupposing which function is primary – begging the question against the exaptation scenario.

  3.  **Appealing to Proper vs. Accidental Function:**
      *   **Proposal:** Privilege the *original* selected function (detecting H) as the "proper function," relegating the exapted function (detecting F) to an "accidental" benefit.
      *   **Problem:** This flies in the face of the case description. The F-detection is *not* merely accidental; it is a key factor *explaining why the mechanism persists in its current form in the present environment*. Its contribution to fitness is systematic, reliable, and equivalent in importance to H-detection for current survival. Dismissing F-detection as "accidental" ignores its genuine etiological role in current maintenance, violating the core etiological spirit of teleosemantics. The distinction between "proper" (historical origin) and "accidental" becomes arbitrary when the exapted function is now equally fundamental.

  4.  **Appealing to a Weighted Selection History:**
      *   **Proposal:** Assign content based on which historical function contributed *more* to the mechanism's selection and maintenance, perhaps weighted by recency or intensity.
      *   **Problem:** How is this weighting determined non-arbitrarily and naturalistically? Quantifying the relative selective impact of H-detection over deep evolutionary time versus F-detection in recent millennia is empirically fraught, if not impossible. More fundamentally, *any* weighting scheme presupposes we can isolate and compare the contributions of distinct functions. But defining these "functions" independently already requires identifying the relevant conditions (H and F) and their effects – essentially presupposing the intentional contents we are trying to derive. The scheme risks circularity by relying on an undeclared intentional interpretation of the system's history to weigh the histories themselves.

  **The Underlying Issue: Presupposing Intentionality**

  Each proposed solution either yields conflicting contents (HAWK vs. FOX vs. HAWK-OR-FOX) or, in attempting to resolve the conflict, subtly presupposes an intentional description of the system. Deciding which consumer "really" uses the state, which function is "proper," or how to weight histories requires us to *already* think of the mechanism as having states *about* H or F or specific responses. Teleosemantics aims to *naturalize* content by reducing it to non-intentional, selectionist terms. However, in this complex exaptation case, the solutions seem forced to borrow back the intentional notions they seek to ground.

  **Conclusion: The Commitment to be Revised**

  This persistent indeterminacy suggests that the core teleosemantic commitment demanding a **unique, univocal content** assigned solely based on etiological function, even in complex cases of multi-etiological maintenance, is unsustainable. The case demonstrates that a single physical state type, sustained by selection for its reliable causal connections to *multiple distinct environmental features* that require *distinct responses*, resists having its content pinned down to one specific condition by etiological criteria alone.

  Therefore, the commitment that should be revised is the insistence that **etiological function *always* determines a *single*, specific, non-disjunctive content for a representational state.** Teleosemantics needs to accommodate the possibility of **pluralistic content** or **context-dependent content determination** in cases of significant exaptation where multiple distinct etiologies genuinely contribute to current maintenance. This might involve integrating factors like current context or downstream processing pathways alongside history, or accepting a degree of indeterminacy as a feature of evolved biological systems rather than a flaw in the theory. Failing to do so leaves teleosemantics vulnerable to this deeper challenge, where its solutions either conflict or covertly rely on the very intentionality they aim to explain.
