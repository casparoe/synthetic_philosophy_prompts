prompt: |-
  ok so in my geometry class we do these proofs where the teacher makes us assume the opposite of what we're trying to prove, and then if we end up with a contradiction (like x = 5 and x ≠ 5) we're supposed to conclude the original thing is true. also whenever a contradiction shows up in your work everyone treats it as proof that you messed up somewhere, like its just obvious that no contradiction can be true. but i went down a rabbit hole about dialetheism and paraconsistent logic, where some philosophers think there can be true contradictions and that a contradiction shouldn't let you infer literally anything. now im confused about what my math class is actually committed to. like does proof by contradiction secretly assume the principle of explosion, or double negation elimination, or just that no contradictions are true, or some mix? would proof by contradiction still be a valid move in a paraconsistent logic, or is it a specifically classical thing? and if the dialetheists are right, what would have to change about how we teach and do math — would we have to stop treating a contradiction as a sign of error, or could we keep the method with a weaker justification? basically i want you to reconstruct the theory of logic and truth that the whole practice presupposes, say which parts the practice actually needs and which parts it just happens to fit with, and tell me where its underdetermined so that more than one theory would license the same classroom rules.
