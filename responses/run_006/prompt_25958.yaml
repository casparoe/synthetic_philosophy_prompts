answer: |-
  Here’s my definitive list of desiderata for an adequate theory of "what matters in survival," grounded in the puzzle cases and their philosophical pressures. I prioritize **practical rationality** – what should shape our fears, hopes, and prudential concern for the future.

  ### Non-Negotiable Core Desiderata

  1.  **Survival Must Matter:** The theory must explain *why* we have *prudential concern* for our future selves (anticipatory fear, hope, responsibility, self-interest). Motivating Case: Our pre-theoretical, overwhelming intuition that *my* future pain matters to *me now* in a way others' pain does not. Denying this (extreme nihilism) renders the entire project incoherent.
  2.  **Accommodate Fission (Branch-Line Case):** The theory must explain why fission (e.g., hemisphere transplant into two bodies) feels like survival *twice over*, even if strict identity is lost. Motivating Case: Parfit's branch-line – Lefty feels like "me" *before* Righty wakes up, suggesting survival isn't strictly tied to unique identity. A theory denying any survival in fission (e.g., strict biological views) fails this.
  3.  **Distinguish Survival from Mere Psychological Similarity:** The theory must explain why having a psychologically *similar* future person isn't enough for prudential concern. Motivating Case: Creating a perfect psychological duplicate *after* my death. I might wish them well, but I don't *fear* their pain as mine. Survival requires connection, not just resemblance.
  4.  **Handle the Teletransporter (Reassembly):** The theory must explain why stepping into the teletransporter (which destroys the original and creates a psychologically/physically identical replica elsewhere) feels like *survival* for the traveler. Motivating Case: The strong intuition that the replica *is* me (or that I survive as them). A theory dismissing this as mere death (e.g., strict biological continuity) conflicts with powerful practical reasoning.
  5.  **Account for Gradual Change (Spectrum Cases):** The theory must provide a plausible account of how prudential concern applies across gradual psychological/physical change. Motivating Case: The Psychological Spectrum – if gradual change can transform me into a profoundly different person, does my concern for that future "me" diminish gradually, or is there a sharp cut-off? The theory must avoid absurdly sharp boundaries while respecting that *radical* discontinuity (e.g., dementia, personality wipe) seems to end survival.

  ### Important but Potentially Negotiable/Camp-Specific Desiderata

  6.  **Respect the "Unity" Intuition (Fusion Case):** The theory should plausibly explain why fusion (two persons merging into one) feels like the *end* of the original persons, not their survival. Motivating Case: If persons A and B fuse into C, we intuit A and B cease to exist, even if C inherits their memories/traits. Views prioritizing psychological continuity *over identity* might struggle here, potentially needing to say A & B partially survive in C. This is negotiable *only* if the theory provides a compelling alternative account of fusion.
  7.  **Address Fission Asymmetry (Optional but Telling):** A strong theory might explain the common intuition that fission is survival but *being* one of the fission products isn't identical to the original. Motivating Case: While I (original) survive as both Lefty and Righty, Lefty (post-op) is *a* survivor but isn't strictly identical to the *pre-op* me. This tests how finely the theory carves survival vs. identity.
  8.  **Provide Action Guidance:** The theory should offer meaningful guidance for rational self-concern and anticipation. Motivating Case: Should I enter the teletransporter? Should I fear fusion? A theory that says "you survive but it's not *you*" without clarifying prudential concern is practically useless.

  ### Key Tensions & Incompatibilities

  *   **Fission vs. Unity (Desiderata 2 vs. 6):** This is the core tension. Fission pushes us towards saying survival is possible *without* strict one-one identity, relying on robust psychological continuity (RPC). Fusion pushes us towards saying survival requires a *single* continuer (unity). **They cannot be jointly satisfied without significant theoretical cost.** A theory emphasizing RPC (like Parfit) handles fission well but struggles with fusion (potentially saying A & B survive as aspects of C, violating the "end" intuition). A theory emphasizing unity (like some biological or simple soul views) handles fusion better but catastrophically fails fission (saying I die if split). *Resolution requires prioritizing one intuition or redefining survival itself.*
  *   **Teleporter vs. Biological Continuity (Desiderata 4 vs. some interpretations of 3):** The teletransporter intuition (survival via replication) directly contradicts the intuition that *this specific biological organism* must continue uninterrupted for survival. A theory must choose which intuition is more fundamental or offer a non-biological account of physical continuity.

  ### The Field-Narrowing Requirement: The One-One Identity Constraint

  **Desideratum 2 (Accommodate Fission)** is the most powerful filter. It immediately rules out:

  1.  **Simple Biological Views:** They insist identity requires the continued existence of the same living organism. Fission destroys the original organism (or makes identity indeterminate), so they must deny survival, failing desideratum 2.
  2.  **Simple Soul/Substance Dualism:** If identity requires the persistence of a unique simple soul, fission creates an insurmountable problem (one soul can't become two). Survival is denied.
  3.  **"Identity is What Matters" Views:** Any view insisting that prudential concern *logically requires* strict numerical identity fails, as fission provides a seeming counterexample where concern persists without identity.
  4.  **Overly Demanding Narrative Views:** Views requiring strict identity for a coherent narrative struggle with fission, where the narrative seems to branch.

  This leaves theories that **decouple prudential concern from strict numerical identity**, primarily Parfitian Reductionism (RPC + "what matters" is Relation R) and Four-Dimensionalist variants. However, these then face the **Fusion Challenge (Desideratum 6)** and must navigate the **Spectrum (Desideratum 5)** without relying on identity as a crutch.

  ### My Positioned Summary
  An adequate theory *must* accept that **survival (prudential concern) can obtain without strict numerical identity** (Non-Negotiables 1, 2, 4). It must ground concern in **non-branching psychological and/or physical continuity** (3, 4, 5), resisting mere similarity. The **core tension** is Fission vs. Fusion; I prioritize **fission accommodation** as the more compelling and widely shared intuition, accepting the cost of a more complex account of fusion (e.g., survival ends in fusion because *no single successor inherits the original's unique relational continuity sufficiently intact*). The **One-One Constraint (Desideratum 2)** is the critical filter, decisively favoring Parfitian and 4D approaches over biological, simple soul, or strict identity-based views. Narrative views survive only if they abandon requiring strict identity for narrative coherence and focus on continuity of character/memory as the object of concern.
