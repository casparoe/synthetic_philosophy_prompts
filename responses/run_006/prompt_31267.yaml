prompt: |-
  Last night I had a long argument with a friend about the presumption of independence in heuristic mathematical reasoning, and I have been unable to settle it on my own. My friend's view was that when two events have no known connection, treating them as independent is not merely a convenient approximation: it is forced by the principle of maximum entropy, since any dependence we cannot articulate is information we do not possess, and a rational probability assignment must not import information we lack. That sounds right to me, but it leads somewhere strange. If the independence step is forced by a general principle of rationality, then it is not a guess, and a heuristic argument that uses it should be as strong as a proof once the remaining quantitative estimates are checked. Yet mathematicians continue to describe such arguments as merely heuristic. Which of us is confused, and about what exactly? I would like a committed response: take a definite position on the correct relationship between the presumption of independence, maximum-entropy reasoning, and the gap between heuristic and rigorous argument. Present it as exactly five numbered points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is grappling with a nuanced debate about the presumption of independence in heuristic reasoning, sparked by a disagreement with a friend. Their friend argues that treating unrelated events as independent isn't just convenient—it's mandated by maximum entropy principles since unarticulated dependencies shouldn't be assumed. The user intuitively agrees but finds it problematic because if independence is "forced" by rationality, heuristic arguments using it should carry near-proof strength, yet mathematicians still label them non-rigorous. This tension suggests the user suspects a deeper philosophical or methodological gap they can't pinpoint.  

  Hmm, the core confusion seems to lie in conflating epistemic justification with mathematical proof. Maximum entropy does justify *starting* from independence when information is absent, but that's a probabilistic stance, not a mathematical guarantee. The friend's view overstates the force of maximum entropy by ignoring how unmodeled dependencies can exist—entropy maximization handles ignorance, not truth. Meanwhile, the user's unease about heuristic gaps is valid: rigorous math requires *demonstrating* independence or bounding errors, which entropy arguments don't provide.  

  The user might also be subtly asking about the authority of heuristics in math. Their phrasing ("should be as strong as a proof") reveals an expectation that rational principles ought to translate to mathematical certainty. But probability isn't truth-preserving like deduction; it's risk-managing uncertainty. Point 2 will need to stress that distinction sharply.  

  For the response, I'll need to dismantle the friend's claim that maximum entropy "forces" independence as a universal truth. Instead, I'll frame it as a defensible default under ignorance—but one that remains vulnerable to hidden variables. The five points should escalate from defining maximum entropy's role to explaining why heuristics stay non-rigorous. Critically, point 5 must resolve the paradox: maximum entropy justifies the *model*, not the *conclusion's certainty*.  

  ... And I should avoid mentioning "Bayesian" or "frequentist" to keep it accessible. The user seems math-savvy but not necessarily versed in probability philosophy. Concrete examples (e.g., coin flips vs. prime gaps) would help, but the user requested no illustrations. Stick to crisp, numbered assertions.
answer: |-
  1.  Maximum entropy justifies treating events as independent *only when the lack of constraint information genuinely implies no dependence*; it is a rational default for probabilistic *modeling* under ignorance, not a universal truth about the events themselves.
  2.  Heuristic arguments using independence *assume* this modeling choice is sufficiently accurate; rigorous proof requires *demonstrating* independence or rigorously bounding the error introduced by assuming it, which entropy maximization alone does not achieve.
  3.  The gap arises because maximum entropy provides a *justified prior probability assignment*, not a guarantee about the underlying reality; unmodeled or unknown dependencies can exist, making the independence assumption potentially inaccurate despite its epistemic justification.
  4.  While maximum entropy makes the independence assumption rationally defensible as a starting point in probabilistic reasoning, it does not eliminate the need for empirical validation or mathematical proof of independence when claiming deductive certainty.
  5.  Mathematicians label such arguments heuristic precisely because they rely on an *unverified modeling assumption* (independence) whose potential inaccuracy introduces a gap that rigorous proof must close, regardless of how rationally the assumption was chosen initially.
