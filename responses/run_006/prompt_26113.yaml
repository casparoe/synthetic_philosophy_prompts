prompt: |-
  In the course of covering economics, climate science, and epidemiology over the past decade, I have noticed a recurring argumentative move that I cannot find a precise label for. A model is built on assumptions that everyone involved concedes are false — sometimes vividly so: perfectly rational consumers, frictionless planes, well-mixed populations, spherical cows. When a critic objects that an assumption is unrealistic, the modeler replies, in effect, that what matters is predictive accuracy, not the realism of the premises. Friedman's 1953 essay on positive economics, or some descendant of it, is typically invoked as a blanket warrant. So far, familiar ground.

  The pattern I want to isolate is what happens next. The same modeler, when the model's predictions later fail, will sometimes turn around and blame the failure on one of those very assumptions — the same assumptions whose unreality they earlier dismissed as irrelevant to the model's soundness. The assumption, in other words, enjoys a kind of dual citizenship: when the model works, it is shielded from criticism by instrumentalist logic; when the model breaks, it is retroactively offered as the culprit. Its falsehood is neither here nor there until it is needed to absorb a failure, at which point it suddenly matters a great deal.

  I am not asking about the general debate between instrumentalism and realism in modeling, nor am I after the standard F-twist itself. What I want to identify is this narrower configuration: an assumption is treated as immune to empirical challenge when the model succeeds, but is selectively reclassified as an empirically significant defect when the model fails — producing what looks like a systematic asymmetry that protects the modeling framework from ever being genuinely at risk. Is there an established name for this two-step? If not, how would you characterize it in a way that distinguishes it from ordinary instrumentalism, from ad hoc rescue, and from the uncontroversial fact that an assumption can be harmless for some predictions and fatal for others? And is there a principled criterion for telling when the move is legitimate — because the assumption genuinely operates differently across the relevant domains — and when it is merely a rhetorical device that renders a modeling program unfalsifiable?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a specific pattern in modeling across economics, climate science, and epidemiology. The key points are: modelers use unrealistic assumptions (like spherical cows) and defend them using instrumentalism, saying only predictive accuracy matters. But when the model fails, they blame those same assumptions they previously dismissed.

  First, I need to make sure I understand the core issue. The user isn't asking about instrumentalism vs. realism in general. They're focused on this flip-flop where assumptions are irrelevant when convenient and suddenly critical when needed to explain failure. The challenge is to find a term for this two-step maneuver and distinguish it from related concepts like ad hoc hypotheses or context-dependent assumptions.

  The user mentions Friedman's essay as a common defense. So, I recall Friedman's instrumentalist view: models are tools, assumptions don't need to be realistic. But the problem arises when modelers inconsistently apply this principle. When the model works, assumptions are shielded; when it fails, those same assumptions become the scapegoat. This creates an asymmetry that protects the model from being falsified.

  Now, I need to figure out if there's an established term for this. I'm thinking about concepts in philosophy of science. Lakatos comes to mind with his research programs, where auxiliary hypotheses protect the core. But the user's case is different because it's the same assumption being used inconsistently. Ad hoc rescue usually involves adding new hypotheses, not reinterpreting existing ones. So that doesn't fit perfectly.

  How about "assumption shielding" or "retroactive scapegoating"? Those are descriptive but not established terms. The user wants to know if there's a precise label. Maybe "immunity flip"? That captures the switch from immune to blameworthy. But I should check if any literature discusses this specifically. Upon reflection, it seems there isn't a widely accepted term, so coining a phrase might be necessary.

  Distinguishing this from legitimate cases is another part of the user's question. Sometimes, an assumption might be harmless for certain predictions but critical for others. For example, frictionless planes might work for large-scale motion but fail at small scales. The key is whether the modeler can explain why the assumption's impact varies contextually. If they can't, it's likely an unfalsifiable maneuver.

  The user also wants to know how to tell when this move is legitimate versus rhetorical. The principled criterion would involve explicit domain specification and mechanism articulation. If the modeler can show why the assumption's realism matters in one context but not another, it's valid. Otherwise, it's a defensive tactic.

  I should also consider the user's identity. They've been covering these fields for a decade, so they're familiar with the debates but need a precise label. Their deeper need might be to critique this practice effectively in academic or public discourse. Having a term like "immunity flip" could help them articulate the issue succinctly.

  Potential related concepts: confirmation bias, where one favors confirming evidence, or motivated reasoning. But those are broader. The asymmetry here is specific to model assumptions. Another angle is the Duhem-Quine problem—blaming auxiliary assumptions instead of the core theory. However, in this case, it's the same assumption being dismissed then blamed, which is a twist on Duhem-Quine.

  In conclusion, the best approach is to acknowledge the lack of an established term, propose a descriptive one like "immunity flip," and clarify the conditions under which such a move is legitimate. This addresses the user's need for precision in critique while providing tools to differentiate valid from fallacious uses.
answer: |-
  This is a sharp observation of a deeply problematic pattern in modeling practice, for which there isn't a single universally established term, but it can be precisely characterized and distinguished. Here's a breakdown:

  1.  **Core Characterization & Proposed Terms:**
      *   **Assumption Shielding / Immunity Flip:** The assumption is granted **immunity from empirical challenge** (via instrumentalism) during model success, but this immunity is **flipped** to become the **primary locus of empirical blame** upon failure. This creates an asymmetric protection for the model's core.
      *   **Retroactive Scapegoating of Dismissed Assumptions:** The unrealistic assumption, previously dismissed as irrelevant, is retroactively scapegoated when convenient to explain failure.
      *   **Instrumentalist Bailout:** Leveraging instrumentalism to deflect criticism of assumptions during success, then bailing out of instrumentalism to use those same assumptions as the explanation for failure.
      *   **Asymmetric Assumption Accountability:** The accountability of the assumption changes asymmetrically based on model performance, always shielding the core framework.

  2.  **Distinguishing it from Related Concepts:**
      *   **Ordinary Instrumentalism (F-twist):** Instrumentalism *consistently* claims assumptions are irrelevant fictions judged *only* by predictive success. The pattern you describe **violates this consistency**. When the modeler blames the assumption upon failure, they are *implicitly admitting its realism/accuracy *does* matter* for *that* prediction, contradicting their earlier instrumentalist stance for *other* predictions. Instrumentalism is used defensively but abandoned diagnostically.
      *   **Ad Hoc Rescue/Hypothesis:** Ad hoc rescues typically involve *adding* new assumptions or modifying the model *after* failure to save it (e.g., epicycles). Your pattern involves *reinterpreting the status of an **existing**, previously dismissed assumption* – not adding new structure, but changing the narrative about why an existing part failed. It's leveraging the *same* element differently.
      *   **Context-Dependent Sensitivity of Assumptions:** It's uncontroversial that an assumption (e.g., frictionless plane) might be harmless for predicting large-scale motion but fatal for predicting small-scale wear. The key difference is **transparency and prior specification**. A legitimate modeler would ideally:
          *   Acknowledge the assumption's limitations *upfront*.
          *   Specify the *domain* or *type of predictions* where the assumption is likely adequate vs. inadequate.
          *   Base the post-hoc explanation on a plausible mechanism linking the *specific* failure to the *specific* falsity of the assumption *in that context*.
      Your pattern lacks this. The assumption is dismissed *universally* as irrelevant ("false assumptions don't matter, only predictions") until failure occurs, *then* its falsity is suddenly universally relevant to *that specific failure* ("ah, the failure proves the assumption mattered here"). The shift is opportunistic, not principled or pre-specified.

  3.  **Is it Legitimate? The Principled Criterion:**
      The move is **potentially legitimate only if the modeler can articulate a clear, domain-specific *mechanism* or *sensitivity argument* explaining why the false assumption was benign for previous successful predictions but is *causally responsible* for the specific failure observed.**

      *   **Legitimate Example:** A climate model assumes a "well-mixed" atmosphere for global CO2 concentration. It successfully predicts long-term global average temperature rise. It fails to predict a specific regional extreme precipitation event. The modeler argues: "The well-mixed assumption is adequate for globally forced trends like average temperature but is *known* to be invalid for regional precipitation extremes, which depend critically on local atmospheric dynamics and moisture transport that the assumption smooths over. This failure highlights the limitation of this assumption *for this specific type of prediction*." (Mechanism/sensitivity is specified and domain-specific).
      *   **Illegitimate (Rhetorical Device) Example:** An economic model assumes perfect rationality and frictionless markets. It successfully predicts aggregate investment trends over 5 years. It then fails to predict a specific market crash. The modeler states: "The model worked before because the irrationality and frictions averaged out, but this crash *proves* that irrational panic and market frictions (which we always knew were unrealistic but dismissed as irrelevant) are actually the fundamental cause." (This is an unfalsifiable "heads I win, tails you lose" move. There's no *specific* mechanism linking the *previously dismissed* assumption to *this* failure that wasn't equally applicable to the previous predictions where it was deemed irrelevant. The assumption becomes an all-purpose excuse).

  4.  **Why it's Problematic & Unfalsifiable:**
      This pattern renders the core modeling framework **effectively unfalsifiable**. Failure is never attributed to the core logic or equations; it's always deflected onto an auxiliary assumption whose falsity was pre-emptively declared irrelevant until needed as an escape hatch. It protects the paradigm from fundamental challenge. It exploits the inherent difficulty of the Duhem-Quine problem (which hypothesis is wrong?) but does so in a particularly asymmetric and opportunistic way.

  **Conclusion:**

  While there's no single perfect, universally recognized term, **"Asymmetric Assumption Immunity"** or **"Immunity Flip"** captures the core dynamic best. **"Retroactive Scapegoating of Dismissed Assumptions"** is more descriptive.

  The key identifier is the **asymmetry in the empirical status of the assumption**: irrelevant fiction when the model succeeds, causally crucial flaw when it fails, *without* a prior, principled, mechanism-based specification of *why* the assumption's impact differs across these domains. This distinguishes it from consistent instrumentalism, genuine ad hoc modification, or legitimate context-dependent sensitivity.

  The **principled criterion for legitimacy** hinges on the modeler's ability to **provide a domain-specific, mechanistic explanation *before or independent of the failure* for *why* the assumption's falsity is irrelevant for prediction type A but potentially fatal for prediction type B.** Without this, the move is a rhetorical device that shields the modeling program from genuine empirical risk.
