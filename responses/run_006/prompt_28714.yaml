answer: |-
  ## Research Proposal: Foundations of Lexical Threshold Negative Utilitarianism: Compensation, Commensurability, and the Threshold Problem

  **1. Research Question:**  
  Can lexical threshold negative utilitarianism (LTNU) provide a principled, non-arbitrary account of *why* intense suffering above the threshold is lexically worse than any pleasure, thereby rendering it non-compensable, while maintaining a coherent account of commensurability and compensation *below* the threshold, without collapsing into either full commensurability or radical incommensurability?

  **2. The Problem & Why Existing Positions Leave It Open:**  
  LTNU prioritizes the prevention of intense suffering above a specific threshold intensity/duration over the promotion of any quantity of pleasure. Below this threshold, it accepts trade-offs (e.g., mild pains offset by sufficient pleasures). The core challenge, highlighted in the debate, is the *dual role* of the threshold and the apparent inconsistency in how value is measured:

  *   **Below Threshold:** Pleasure and pain are treated as commensurable on a single scale of "net badness/goodness"; compensation is possible.
  *   **Above Threshold:** Pleasure and pain are treated as *incommensurable* in a specific way: no amount of pleasure can compensate for a single instance of above-threshold suffering. The "currency" of evaluation seems to shift.

  **Existing defenses of LTNU often leave the fundamental nature of this shift unexamined:**

  *   **Consensus:** There is broad agreement among utilitarians (classical and negative) that *if* suffering and pleasure are fundamentally commensurable, trade-offs should be possible across all intensities. LTNU explicitly rejects this.
  *   **Consensus:** Most proponents acknowledge the arbitrariness objection but often respond pragmatically (e.g., "the threshold is fuzzy but clearly exists") or by pointing to psychological discontinuities (without establishing their normative force).
  *   **Contested:** The *metaphysical and axiological foundations* of the threshold are highly contested. Is the threshold marking:
      *   A discontinuity *within* a single cardinal scale of disvalue (e.g., suffering intensity becomes infinite)?
      *   A shift to an entirely distinct dimension of value (e.g., "dignity violation" vs. "mere discomfort")?
      *   A categorical deontological constraint emerging within a consequentialist framework?
  *   **Gap:** Crucially, existing literature largely fails to explicitly separate and rigorously analyze the two distinct conceptual "jobs" the threshold performs: **(1)** Marking a *discontinuity* in the *magnitude* of badness (quantitative shift), and **(2)** Instituting a fundamental *change in the nature of comparability* between suffering and pleasure (qualitative shift, specifically rendering compensation impossible). **This proposal argues that this conflation is the root of the "patch" objection.** Without disentangling these roles and providing a principled basis for *both*, LTNU remains vulnerable.

  **3. Approach & Why Not Obvious Alternatives:**  
  This project will employ rigorous conceptual analysis within moral philosophy and axiology to dissect the foundations of LTNU's threshold.

  *   **Core Method:** Analyze the concepts of **commensurability**, **compensation**, and **lexical priority** as they function in LTNU. Specifically:
      1.  **Disentangle the Roles:** Precisely define and separate the "discontinuity marker" function from the "compensation blocker" function of the threshold.
      2.  **Test Foundations:** Examine potential axiological bases for each role:
          *   *Discontinuity:* Could cardinal measurability break down? Is there a plausible argument for "infinite disvalue" above the threshold? What are the implications for aggregation below/above?
          *   *Compensation Blocker:* Does this require a distinct value dimension (e.g., intrinsic evil of intense suffering)? Does it imply a type of incommensurability? What *kind* of incommensurability (incomparability, discontinuous comparability)? Can it be grounded without appealing to deontology?
      3.  **Synthesize:** Explore whether a coherent LTNU can be built by grounding one role and deriving the other, or if both require independent (but compatible) foundations. Test if satisfying one role inevitably undermines the other or the coherence of below-threshold trade-offs.

  *   **Why Not Alternatives:**
      *   **Full Commensurability (Classical/U):** Rejected as it fails to capture the core LTNU intuition that some suffering *cannot* be traded off, which the project takes seriously as a starting point needing defense.
      *   **Full Incommensurability (e.g., Radical NU/Deontology):** Rejected as it makes below-threshold trade-offs (widely accepted in practice and intuitively plausible for minor pains/pleasures) mysterious or impossible, which LTNU explicitly wants to allow. This project seeks to preserve this aspect.
      *   **Vagueness/Pragmatism:** Simply accepting a vague threshold avoids the philosophical challenge and concedes the "arbitrary patch" point. This project seeks a principled *defense*.
      *   **Empirical Threshold Setting:** While empirical data might inform *where* a threshold lies, it cannot answer the *normative* "why" question regarding commensurability and compensation. This project focuses on the necessary conceptual foundations.

  **4. What a Result Looks Like (Success):**  
  Success would involve constructing a coherent and defensible model for LTNU where:
  *   The location of the threshold, while potentially context-sensitive or vague at the margins, is grounded in a *principled distinction* concerning the nature of value or disvalue.
  *   The reason *why* compensation fails above the threshold is clearly articulated and differentiated from the reason for the quantitative discontinuity (if any).
  *   Below-threshold commensurability and compensation remain intact and are shown to be compatible with the above-threshold structure.
  *   This model avoids collapsing into either full commensurability (making the threshold arbitrary) or full incommensurability (making below-threshold trade-offs incoherent).

  A successful outcome might be a novel axiological framework for LTNU (e.g., based on distinct types of disvalue, or a specific model of discontinuous cardinality) that resolves the tension.

  **5. What Counts as Failure:**  
  The project would demonstrate the difficulty or impossibility of a principled LTNU if:
  *   The two roles of the threshold are shown to be fundamentally inseparable in a way that inevitably leads to arbitrariness in one or both.
  *   Every attempt to ground the compensation blocker either collapses into full incommensurability (undermining below-threshold trade-offs) or relies on an arbitrary or question-begging distinction.
  *   Grounding the discontinuity quantitatively (e.g., infinite disvalue) proves incompatible with maintaining commensurability below the threshold or leads to unacceptable implications (e.g., making *any* above-threshold suffering infinitely worse than *any* amount of below-threshold suffering, regardless of quantity).
  *   The analysis concludes that LTNU inherently requires accepting a fundamental, ungrounded discontinuity in value commensuration, confirming the "arbitrary patch" critique as unavoidable within the view's structure.

  **6. Scope & Timeline (6 Months):**
  *   **Month 1-2:** Deep literature review focusing on commensurability, incommensurability, lexical priority, and existing LTNU defenses/attacks. Precise formulation of the dual-role hypothesis.
  *   **Month 3-4:** Conceptual analysis phase 1: Systematically disentangling the discontinuity and compensation-blocker roles. Developing and critiquing potential axiological bases for each role independently.
  *   **Month 5:** Conceptual analysis phase 2: Testing the compatibility and potential derivability of the roles. Synthesizing findings into potential coherent models or identifying insurmountable obstacles.
  *   **Month 6:** Refinement of arguments, identification of strongest viable model (if any), and drafting of the final research report clearly outlining the findings regarding the core question's answerability within LTNU. Preparation for potential journal article submission.

  **Conclusion:**  
  This project addresses a foundational challenge at the heart of lexical threshold negative utilitarianism: reconciling its allowance for compensatory trade-offs below a threshold with its absolute rejection of compensation above it. By rigorously analyzing and attempting to separate the dual roles of the threshold – marking discontinuity and blocking compensation – it aims to determine whether LTNU can be grounded on principled, non-arbitrary axiological foundations or if the "patch" critique reveals an inherent instability in the view. The outcome will significantly clarify the theoretical viability and commitments of LTNU.
