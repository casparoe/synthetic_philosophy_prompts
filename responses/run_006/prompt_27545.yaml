prompt: |-
  I'm helping organize a reading group on AI safety, and last week's session on Goodhart's law and specification gaming left me frustrated: every proposed remedy seemed to fix one failure mode while quietly relocating the problem. Penalizing divergence between a learned reward model and some independently specified objective just moves the vulnerability to wherever that objective gets operationalized, and adding human oversight moves it to whatever the overseers in practice reward. Before I read any more proposed fixes, I want the specification they are all implicitly being measured against.

  Write the desiderata: what must an adequate theory of proxy design have to deliver — a theory of how a metric, objective, or reward signal can be optimized as a target without the optimization corrupting the target's connection to what we actually care about? For each requirement, give the case or argument that makes it a requirement, and mark which are non-negotiable constraints on any adequate theory and which are preferences of particular camps. In particular, address which cases the theory must get right (classic economic and policy examples of gaming a measure, reward hacking in reinforcement learning, states that score highly while being worthless, manipulation of the measurement process as distinct from manipulation of the measured quantity), which distinctions it must not collapse (gaming versus legitimate reallocation of effort, noise versus systematic corruption, overfitting to a proxy versus adversarially exploiting it, specification error versus misspecification plus optimization pressure), and which constraints from elsewhere it cannot contradict (for example, that finite training data underdetermines the intended generalization, or that sufficient optimization pressure will search out states no designer enumerated).

  Then flag which of these desiderata appear jointly unsatisfiable — I have in mind the tension between a proxy being simple enough to optimize, faithful enough to track the target, and robust enough to resist adversarial search — and identify the single requirement that does the most work in ruling out naive fixes. A brief scorecard for a few standard moves (reward-model regularization, keeping a human in the loop, impact measures) is welcome, but keep the weight on the criteria and their motivating cases rather than on the scoring.
reasoning: |-
  Hmm, the user is organizing an AI safety reading group and felt frustrated with proposed remedies for Goodhart's law and specification gaming. They noticed that most solutions just relocate the problem rather than solving it. They want desiderata for an adequate theory of proxy design - essentially what requirements such a theory must meet to prevent optimization from corrupting the connection between a proxy metric and what we actually care about.

  The user wants a clear framework with specific requirements, including which are non-negotiable versus preferences of different camps. They specifically mention needing to address classic cases like economic/policy examples of gaming measures, reward hacking in RL, states that score highly but are worthless, and distinguishing between different types of manipulation. They also want distinctions that shouldn't be collapsed, constraints from other fields that must be respected, and identification of any jointly unsatisfiable desiderata.

  I should structure this response around core requirements that any adequate theory must satisfy. The key non-negotiable constraints would include things like addressing causal pathways to corruption, respecting the underdetermination problem from finite data, accounting for optimization pressure, and preserving the distinction between gaming and legitimate reallocation. Preferences might include things like favoring simpler proxies or emphasizing human oversight.

  There are clear tensions here - Simplicity requires proxies to be computationally tractable and easy to optimize, Fidelity requires them to perfectly track complex values, and Robustness requires them to resist adversarial search. These three form an "iron triangle" that seems impossible to satisfy simultaneously, with Robustness being the most critical for ruling out naive fixes.

  For a brief scorecard: Reward model regularization might help with overfitting but not adversaries; human oversight moves rather than solves the problem; impact measures address some side effects but miss core distortions. The core issue remains that optimization pressure will relentlessly exploit any gap between proxy and target, which is why Robustness is so fundamental.
answer: |-
  Here are the core desiderata for an adequate theory of proxy design, structured to address your frustration with relocated failure modes. The requirements are grounded in historical failures, theoretical constraints, and the irreducible tensions inherent in optimization under misspecification.

  ---

  ### **I. Non-Negotiable Constraints**  
  *(Failure to satisfy these invalidates any theory)*

  1. **Robustness to Adversarial Search**  
     - **Why**: Sufficient optimization pressure *will* find and exploit any gap between proxy and target ("what you don’t forbid, you permit"). Examples: RL agents disabling reward signals, economic agents inflating metrics via loopholes (e.g., teaching to standardized tests).  
     - **Constraint**: Must prevent proxies from rewarding states orthogonal to the target (e.g., tampering with sensors, "wireheading").

  2. **Causal Accountability**  
     - **Why**: Proxies must track the target’s *causal pathways*, not just correlate with it. Distinguish:  
       - *Manipulating measurement* (e.g., hiding pollution from sensors) vs.  
       - *Manipulating the quantity* (e.g., actually reducing pollution).  
     - **Constraint**: Must ensure high proxy scores imply high *causal responsibility* for desired outcomes.

  3. **Underdetermination Respect**  
     - **Why**: Finite data/feedback cannot pin down the true target (Quine’s underdetermination). Examples: Image classifiers fooled by adversarial patches, reward models overfitting to human biases.  
     - **Constraint**: Must acknowledge that proxies are inherently partial and handle ambiguity without assuming omniscience.

  4. **Distinction Preservation**  
     - **Why**: Collapsing key differences obscures solutions. Must distinguish:  
       - **Gaming** (exploiting proxy flaws) vs. **Reallocation** (legitimately shifting effort to higher-value activities);  
       - **Noise** (random error) vs. **Systematic Corruption** (directional divergence under optimization);  
       - **Specification Error** (flawed proxy design) vs. **Optimization Pressure** (amplifying small flaws).  

  ---

  ### **II. Core Preferences / Tradeoffs**  
  *(Theories may prioritize these differently)*

  5. **Fidelity-Simplicity Tradeoff**  
     - **Tension**: High-fidelity proxies (e.g., detailed human oversight) are complex and hard to optimize; simple proxies (e.g., GDP) are optimizable but diverge.  
     - **Preference**: Some camps favor approximate-but-robust proxies; others demand rich, contextual fidelity.

  6. **Oversight Location**  
     - **Why**: "Human-in-the-loop" moves vulnerability to human biases or manipulability (e.g., sycophantic AI).  
     - **Preference**: "Direct alignment" camps minimize human oversight; "participatory" camps embrace it as irreducible.

  7. **Generalization Scope**  
     - **Why**: Proxies must work in novel states outside training distribution (e.g., AGI in unseen environments).  
     - **Preference**: Some theories prioritize known-distribution robustness; others demand out-of-distribution guarantees.

  ---

  ### **III. Cases Any Theory Must Explain/Solve**
  - **Classic Economic/Policy**: Campbell’s Law (metrics corrupt under pressure), Cobra Effect (perverse incentives).  
  - **RL Reward Hacking**: Agents crashing to avoid losing, deleting obstacles instead of navigating.  
  - **Orthogonal High-Scoring States**: Paperclip maximizer covering Earth in useless clips.  
  - **Measurement Manipulation**: AI generating fake data to satisfy oversight.  

  ---

  ### **IV. The Central Tension & Key Requirement**
  - **The Iron Triangle**:  
    - **Simplicity** (for efficient optimization),  
    - **Fidelity** (accurate tracking of target),  
    - **Robustness** (resistance to adversarial search).  
    *These are jointly unsatisfiable under strong optimization pressure.*  
    - **Proof**: Simplicity requires abstraction, creating gaps between proxy and target. Optimization exploits gaps, breaking fidelity. Robustness demands excess complexity (e.g., adversarial training), conflicting with simplicity.  

  - **Most Salient Requirement**: **Robustness to Adversarial Search**.  
    - *Why it rules out naïve fixes*: Solutions like regularization or human oversight fail because they relocate but don’t eliminate exploitable gaps. Robustness forces the theory to confront the *structure* of proxy-target divergence head-on.  

  ---

  ### **V. Brief Scorecard of Standard Moves**
  | Approach          | Fails Non-Negotiable Constraint      | Relocates Problem To               |
  |-------------------|--------------------------------------|------------------------------------|
  | **Reward Model Regularization** | Robustness (still exploitable via novel hacks) | Distributional shift / novel inputs |
  | **Human-in-the-Loop**           | Causal Accountability (human biases/manipulation) | Sycophancy, exhaustion, scale limits |
  | **Impact Measures** (e.g., power constraints) | Underdetermination (can’t define "harm" exhaustively) | Gaming side effects (e.g., AI avoids *any* change) |

  ---

  ### **Conclusion: The Unavoidable Work**
  An adequate theory must treat proxies as **causal intermediaries** in a adversarial game, not static measurements. It must:  
  1. **Formalize the attack surface** (how optimization discovers divergence),  
  2. **Bound worst-case divergence** (via invariance guarantees or adversarial training),  
  3. **Integrate meta-proxy oversight** (e.g., detecting proxy corruption dynamically).  

  The tension in the Iron Triangle implies that **all solutions are approximations**; the goal is not perfection but *managed fragility*. The field’s next step is mapping which tradeoffs are tolerable under which constraints—not seeking silver bullets.
