  First, I should understand their core issue. They're dealing with self-referential rules in legal contexts—rules that talk about themselves, especially regarding amendment, entrenchment, or validity. The challenge is to find a logical principle that explains why some work and others don't, without getting bogged down in doctrine.

  Looking at their cases: (1) is straightforward—repeal conditions are fine. (2) is unamendable but coherent, though normatively iffy. (3) is paradoxical like the Liar. (4) and (5) are key: changing amendment thresholds is okay, but self-entrenchment with higher bars seems invalid to them. (6) is toothless against future laws. (7) restricts content, not power, so fine. (8) is standard and okay. (9) is like (2) but for procedures, coherent but bold.

  Their tentative principle focuses on not removing powers, but it fails because in (2) and (9), the rule does remove amendment powers, yet they call it coherent. So I need a better approach. Maybe distinguish between different types of self-reference: some are operational (like setting procedures), others are declarative (like claiming validity or immunity).

  I recall Kelsen's Grundnorm and Hart's rule of recognition. Also, logic paradoxes like self-amendment in law. Perhaps a principle based on performative coherence: a self-referential rule is valid if it doesn't create a logical contradiction in its application or existence. For example, in (3), declaring itself invalid leads to inconsistency—it can't exist as valid if it denies its validity. Whereas in (1), stating repeal conditions doesn't cause a loop; it just provides instructions.

  Let me sketch a principle: **A self-referential rule is coherent if and only if its self-reference does not produce a performative contradiction or logical inconsistency in its creation, application, or amendment.** 

  Breaking it down:
  - **Performative contradiction**: When the rule's existence undermines what it declares. E.g., a rule saying "I am invalid" can't be valid without contradiction.
  - **Logical inconsistency**: Situations where truth values clash, like in paradoxes.
  - **Creation context**: Rules must be assessable at their enactment moment without relying on future uncertainties.

  Applying this to their cases:
  1. **Repeal conditions**: No contradiction. Just sets a procedure. Coherent.
