answer: |-
  Here’s a logically structured decision tree for mapping commitments on the therapy/enhancement distinction, designed to force clarity on underlying principles. It separates genuine conceptual splits in the literature, avoids false consensus, and flags limitations. Written in British English.

  ---

  **Therapy/Enhancement Distinction: A Commitment-Mapping Taxonomy**  
  *Each branch represents a binary choice on foundational claims. Follow the path to your terminal position.*

  ### 1. Does "normal species functioning" (NSF) describe a *natural/objective fact* (e.g., grounded in evolutionary biology), rather than a normatively constructed ideal?  
     - **Yes (Naturalism)** → Go to Q2  
     - **No (Constructivism)** → Go to Q5  

  ---

  #### **NATURALIST BRANCH**  
  ### 2. Is preserving/restoring NSF *intrinsically morally significant* (e.g., because it defines human dignity, species integrity, or a "natural good")?  
     - **Yes** → Go to Q3  
     - **No** → Go to Q4  

  ### 3. Does justice in healthcare *require* prioritising therapy (restoring NSF) over enhancement (exceeding NSF)?  
     - **Yes** → **Bioconservatism (Kass-style)**  
       *Named position. Sees NSF as sacred; enhancement as hubristic or dehumanising. Therapy is a moral imperative.*  
     - **No** → **"Prudential Naturalism" (unnamed)**  
       *Empty branch. Incoherent: If NSF is intrinsically significant, justice would logically prioritise its restoration. No major defender.*  

  ### 4. Can the therapy/enhancement distinction do *useful work* for distributing healthcare justly (e.g., by linking therapy to "health needs")?  
     - **Yes** → **Normative Naturalism (Daniels-style)**  
       *Named position. NSF is objective but not intrinsically moral. Distinction is vital for defining just healthcare entitlements.*  
     - **No** → **Transhumanist Naturalism (e.g., Savulescu/Bostrom)**  
       *Named position. NSF is a biological fact but morally irrelevant. Justice should focus on welfare, not maintaining norms. Distinction collapses.*  

  ---

  #### **CONSTRUCTIVIST BRANCH**  
  ### 5. Is the therapy/enhancement distinction *instrumentally useful* (e.g., for policy, resisting medicalisation, or prioritising urgent needs), despite being socially constructed?  
     - **Yes** → Go to Q6  
     - **No** → Go to Q7  

  ### 6. Should justice in healthcare *formally adopt* the distinction to allocate resources, even if it’s fuzzy?  
     - **Yes** → **Pragmatic Constructivism (Daniels-compatible)**  
       *Overlaps with Daniels but rejects NSF as natural. Distinction is a necessary proxy for "urgent health needs" in policy contexts.*  
     - **No** → **Critical Constructivism (disability studies-influenced)**  
       *Named position (e.g., Silvers, Scully). Distinction reflects ableist norms and should be dismantled to avoid discrimination. Justice requires alternative frameworks.*  

  ### 7. Is "wellbeing" the *only coherent foundation* for evaluating biomedical interventions?  
     - **Yes** → **Welfarism (Harris-style)**  
       *Named position. Therapy/enhancement is a false dichotomy. Only welfare gains matter, regardless of method.*  
     - **No** → Go to Q8  

  ### 8. Are there *non-welfarist values* (e.g., autonomy, authenticity, social solidarity) that make the distinction matter morally?  
     - **Yes** → **"Moral Pluralist Anti-Distinction" (unnamed)**  
       *Underexplored branch. Possible position: Distinction is unhelpful, but wellbeing isn’t the only metric. Enhancement might threaten autonomy or social equality.*  
     - **No** → **Nihilism about Bioethical Categories (unnamed)**  
       *Deeply unattractive. Rejects all frameworks for judging interventions. No coherent ethics. No serious defenders.*  

  ---

  ### Taxonomy Notes  
  - **Terminal Positions**: 8 leaves (2 empty).  
  - **Empty Branches**:  
    - *Prudential Naturalism (3→No)*: Incoherent. Intrinsic moral significance of NSF logically implies prioritisation in justice.  
    - *Nihilism (8→No)*: Deeply unattractive. Abandons ethical reasoning entirely.  
  - **Unseparated Pairs**:  
    - *Transhumanist Naturalism (4→No)* vs *Welfarism (7→Yes)*: Both reject the distinction, but differ on *why* (NSF’s irrelevance vs wellbeing as sole metric). The tree can’t split these without a prior meta-ethical question about naturalism.  
    - *Bioconservatism (3→Yes)* vs *Moral Pluralist (8→Yes)*: Both oppose enhancement on non-welfarist grounds, but bioconservatism requires naturalism. The tree separates them via Q1.  
  - **Contested Premises (Do not treat as consensus)**:  
    - NSF’s objectivity (Q1) is hotly debated. Naturalists (e.g., Wakefield) and constructivists (e.g., Amundson) are entrenched.  
    - Whether justice *needs* the distinction (Q4/Q6) divides egalitarians (e.g., Daniels vs Segall).  
    - Welfarism’s sufficiency (Q7) is rejected by deontologists, virtue ethicists, and critical theorists.  

  ### How to Use This  
  1. Start at Q1. Answer strictly based on your *commitments* (e.g., "If I reject evolutionary teleology, I’m constructivist").  
  2. Proceed to terminal position. **Compare leaves** with peers to pinpoint disagreements (e.g., "We’re both constructivists, but you see instrumental value in the distinction and I don’t").  
  3. **Avoid** conflating positions: e.g., Daniels and bioconservatives both use the distinction but diverge at Q2/Q3.  

  ### Why This Works  
  - Forces engagement with *why* the distinction matters (or doesn’t).  
  - Exposes when labels (e.g., "anti-enhancement") mask incompatible foundations.  
  - Flags "undefended" spaces for novel arguments.  

  ---  
  *Adapted from debates between: Naturalists (Daniels, Wakefield), Constructivists (Amundson, Silvers), Welfarists (Harris, Savulescu), Bioconservatives (Kass, Sandel), and Critical Theorists (Parens, Scully). British English compliant.*
