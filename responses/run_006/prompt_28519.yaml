answer: |-
  The clatter of glasses and conference chatter provided a dissonant soundtrack to the familiar tension at the corner table. Charles, swirling a neat whiskey, eyed Maya over the rim of his glass. Maya, nursing an espresso martini, met his gaze with weary defiance.

  **Charles:** (Sighing) Maya, we both saw the same talk. Yet again, the presenter acts like finks are some unspeakable horror for dispositional realism. It’s tedious. Lewis *solved* it decades ago. You don’t need to abandon conditionals; you refine them. The *reformed* conditional: ‘If the stimulus were applied *and the intrinsic causal basis remained intact*, the manifestation would occur.’ Poof. Finks? Maskers? Handled. The fink *destroys* the basis. The masker *blocks* the manifestation *despite* the basis. The conditional holds because the *basis* holds fixed.

  **Maya:** (Leaning forward, finger tapping the table) Charles, Charles... that’s precisely the sleight of hand. You think adding ‘intrinsic causal basis’ like a magic incantation makes the problem vanish? It just pushes it back a step. *What is this ‘basis’?* If it’s not itself dispositional, what on earth is it? Some inert, categorical lump? And if it *is* dispositional... well, congratulations, you've just defined dispositions in terms of... other dispositions! You’ve smuggled the primitiveness right back in, just buried it one level down. Your ‘basis’ *is* the disposition, wearing a lab coat.

  **Charles:** (Setting his glass down sharply) That’s unfair reductionism! The basis *grounds* the disposition. It’s the categorical microstructure – the molecular bonds in the glass that make it brittle, the specific neural pathways for irritability. It’s the categorical property that *explains why* the counterfactual holds when it holds. The disposition *is* the property that makes the reformed conditional true. The basis *makes it have* that property.

  **Maya:** (Shaking her head, a frustrated smile) But *how*? *How* does this inert, non-dispositional microstructure ‘ground’ or ‘make true’ a counterfactual? You invoke causation – the basis *causes* the manifestation under stimulus. Fine. But causation *itself* is shot through with dispositionality! What’s the difference between ‘causing’ and ‘being disposed to cause’? Your analysis relies on the very thing you’re trying to reduce. It’s circular. The ‘basis’ is just a placeholder for whatever-it-is-that-makes-the-dispositional-talk-apt. You haven’t reduced anything; you’ve just relabeled the mystery ‘basis’ and attached a conditional to it.

  **Charles:** (Voice rising slightly) And your ‘primitivism’ does better? What explanatory work does it *do*, Maya? Seriously? “It’s brittle? Oh, that means it has the primitive disposition of brittleness!” What have you told me? You’ve slapped a label on a pattern of behavior and counterfactual dependencies we observe. You’re just *naming* our ignorance! How does calling it ‘primitive’ help us *explain* why the glass breaks when struck, or why sugar dissolves, beyond just saying ‘that’s its nature’? That’s not explanation; it’s surrender!

  **Maya:** (Eyes flashing) It’s not surrender; it’s realism! Some properties *just are* powers, tendencies, capacities. They’re fundamental features of the world. Calling them primitive isn’t a *failure* of explanation; it’s recognizing their *explanatory fundamentality*. Why *does* the reformed conditional hold true for this glass and not that pillow? Because *this glass has the primitive disposition of brittleness, and the pillow does not*! That disposition *explains* the truth of the conditional, the behavior under stimulus, *and* why your ‘basis’ has the causal profile it does. The disposition isn’t *reduced* to the basis; the basis *manifests* the disposition!

  **Charles:** So, the disposition explains the basis that explains the conditional that we use to identify the disposition? That’s a tight little circle. Elegant, perhaps, but explanatory? I see smoke and mirrors. My analysis at least *connects* dispositions to observable conditionals and underlying structure. It gives us something to *look for* empirically – the basis. Yours says “It just is,” and stops. How is that progress?

  **Maya:** Progress? Maybe it’s about accurately describing reality, not forcing it into a reductive straitjacket! Your ‘connection’ is an illusion. Every time we probe deeper into the ‘basis’, what do we find? More dispositions! Quarks have spin, charge – powers! Fields have potentials! The world *is* fundamentally dispositional. Trying to reduce dispositions to non-dispositional bases plus conditionals is chasing a phantom. Conditionals *track* dispositions; they don’t *constitute* them. Finks and masks don’t just break your initial analysis; they *reveal* that dispositions are modally robust in ways a simple conditional can’t capture. The intrinsic basis maneuver is a patch, not a foundation. It acknowledges the robustness lives *in the object*, not just in the conditional, but then refuses to name it for what it is: a primitive power.

  **Charles:** (Leaning back, swirling his near-empty glass) So, the world is just... pushings and pullings? Pure potentiality? No bedrock? That sounds suspiciously like... well, like *magic*. Or at least, bad metaphysics. How do you even individuate these primitive dispositions? What makes brittleness different from solubility? By their manifestations? Then you’re defining them circularly again. By their... what? Primitive dispositional essences? Spare me.

  **Maya:** (Finishing her drink) It’s no more magical than irreducible intentionality or consciousness. Some things resist tidy reduction. Dispositions are one of them. We individuate them by their characteristic manifestations *under appropriate conditions*, yes – but that’s *identification*, not *reduction*. The *property itself* is the power. As for bedrock... perhaps the bedrock *is* active. Perhaps passivity is the illusion. But that’s a debate for another whiskey. Or perhaps next year’s conference bar. Same time, same argument?

  **Charles:** (A wry, tired smile touching his lips) Undoubtedly, Maya. Undoubtedly. Though I maintain, ‘intrinsic basis’ isn’t a dodge. It’s a location. Yours is just a shrug.

  **Maya:** (Standing up) And yours is just a label hiding deeper structure. Goodnight, Charles. Try not to dream of finks.

  **Charles:** Dream? With this whiskey? I’ll dream of categorical bases... nice, solid, unproblematic ones. Sleep well, Maya. Try not to conjure primitive powers in the night.

  They exchanged a look that was equal parts exasperation and deep, grudging respect. The dance would continue. The dispositions remained stubbornly, primitively, counterfactually, *there*.
