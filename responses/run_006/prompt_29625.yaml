  The user is questioning if Descartes was "cartoonishly wrong." I should note that his position was based on his criteria for consciousness—language and flexible reason. He thought only humans had immaterial souls, hence minds. Animals, lacking language, were just complex machines. But he didn't deny they had sensations; he saw them as mechanical responses. The article's claim about no feelings whatsoever might be overstated. Descartes did distinguish between mechanical pain responses and conscious suffering, which the latter he reserved for humans.

  Now, the vivisection part. The article links Descartes' philosophy to animal cruelty in science. Historically, his followers did use his ideas to justify vivisection. But Descartes himself might have been uneasy about it. He wrote about avoiding causing suffering, but since he didn't believe animals felt pain consciously, it's a gray area. So the article's connection isn't baseless, but it's more about his followers than Descartes personally.

