  Okay, the user is applying for a dissertation fellowship and needs a two-page proposal based on their half-formed idea about heuristic reasoning. Let me start by understanding their core concern. They notice that in informal arguments—like philosophy, science, policy—people often line up multiple considerations pointing the same direction and treat them as independent evidence, making the combined case seem stronger. But sometimes, this is double-counting because the considerations stem from the same source or are just different slices of the same point. The user wants to turn this into a precise research question.

  First, I need to refine their idea into a clear, answerable question. The user suggests framing it around when a presumption of probabilistic independence is justified and what formal properties a default rule should have. That makes sense. The key is to distinguish between legitimate cumulative reasoning and fallacious double-counting. 

  Next, why isn't this already solved? They mention Bayesian accounts, maximum entropy, robustness. I should explain why each falls short. Bayesian independence is too strict for informal contexts. Maximum entropy assumes uniform priors which might not apply. Robustness requires varied evidence but doesn't address when independence can be presumed. Highlighting these gaps positions the project as necessary.

  The user wants a monthly plan. Month 1: taxonomy of independence claims in arguments. Months 2-4: formal modeling of different roles independence plays. Months 5-7: develop and test default rules. Months 8-9: refine rules, address objections. Month 10: write up. That seems feasible in a year.

  For a positive result, a defensible default rule that handles clear cases without case-by-case checks. Risks? If the only solution is checking each case individually, that would make the presumption useless. Need to acknowledge this but show how the project might still provide heuristics.

  Also, the user doesn't want citations, so avoid those. Keep it scoped to one year. Emphasize the practical implications across fields to show impact. Make sure the proposal is structured clearly: problem, research question, existing approaches' shortcomings, methodology, timeline, expected outcomes, and risks.
answer: |-
  ## Dissertation Proposal: The Epistemic License for Independence in Cumulative Heuristic Reasoning

  **1. Problem Statement:** Informal reasoning in philosophy, science, and policy often relies on *cumulative case arguments*: multiple distinct-seeming considerations (C1, C2, ..., Cn) all pointing towards the same conclusion (H). Crucially, the intuitive force of such arguments often depends on treating these considerations as *independent* pieces of evidence, amplifying the perceived support for H. However, this presumption is frequently dubious. Considerations may share a common source, be different descriptions of the same underlying fact, or be non-trivially correlated due to background assumptions ("double-counting"). While critics often dismiss arguments by asserting "those aren't independent," there exists no systematic account of *when* a default presumption of independence is epistemically justified in informal contexts, nor what form a defeasible rule for such a presumption should take. This gap leads to persistent fallacies and unresolved disputes.

  **2. Research Question:** Under what conditions is a *default presumption of probabilistic independence* among considerations in informal cumulative case arguments epistemically justified? What formal properties must a defensible default rule for such independence possess to avoid systematic error while remaining practically useful?

  **3. Why Existing Approaches Don't Settle It:**

  *   **Bayesian Accounts of Independent Evidence:** Formal Bayesianism defines independence precisely (P(C1 & C2 | H) = P(C1 | H)P(C2 | H)), but requires known, precise likelihoods and priors. It offers no guidance for the *default presumption* of independence when formal probabilities are unavailable or ill-defined, which is the norm in informal heuristic reasoning. It tells us what independence *is*, not when to *assume* it provisionally.
  *   **Maximum Entropy (MaxEnt) Methods:** MaxEnt provides a principled way to choose a prior probability distribution under ignorance, often assuming independence by default. However, its justification relies heavily on specific information-theoretic principles applied to a well-defined hypothesis space. Its applicability to *informal considerations* whose probabilistic structure and interrelationships are vague or contested is unclear. MaxEnt doesn't address *which* variables should be assumed independent in an informal argument structure.
  *   **Robustness Reasoning (e.g., Multiple Means of Determination):** This focuses on whether diverse methods/lines of evidence converge on the same result, enhancing reliability. While related, it primarily concerns the *variety* of evidence sources/methods, not the probabilistic *independence* of specific *considerations* arising within or across those methods. Two considerations from the same robust method could be non-independent; two considerations from different methods might still share a common dependence. Robustness doesn't provide criteria for the independence of individual considerations.

  **4. Research Plan (12 Months):**

  *   **Month 1-2: Taxonomy & Case Analysis:** Systematically collect and categorize instances of alleged independence/dependence disputes in philosophical arguments (e.g., ethics, epistemology), scientific reasoning (e.g., model corroboration, interpreting data), and policy debates. Focus on identifying *how* independence is claimed/denied and the grounds invoked (e.g., "common cause," "conceptual overlap," "different mechanisms," "distinct data sources").
  *   **Months 3-4: Formalizing Roles of Independence:** Develop small, tractable formal models (using probability theory/Bayesian networks) capturing the core logical structures identified in the taxonomy. Model distinct roles: (a) Amplification of support under independence; (b) Attenuation of support under dependence; (c) The impact of *assuming* independence when it's absent; (d) The cost of *failing* to assume independence when it holds. Identify key parameters (e.g., strength of individual considerations, degree of dependence).
  *   **Months 5-7: Developing & Testing Candidate Default Rules:** Propose and formalize candidate default rules for presuming independence (e.g., "Presume independence if considerations arise from distinct methodological sources," "Presume independence absent explicit known pathways of dependence," rules incorporating conceptual distinctiveness assessments). Rigorously test these rules against the clear cases of valid/invalid independence claims identified in Phase 1, using the models from Phase 2. Assess rules for robustness, ease of application, and error profiles (false positives/negatives on independence).
  *   **Months 8-9: Refinement & Objections:** Refine the most promising rule(s). Analyze key challenges: defeasibility conditions, handling vague considerations, the relationship between conceptual and probabilistic independence. Address the "triviality objection" head-on.
  *   **Month 10: Synthesis & Formal Characterization:** Synthesize findings into a clear characterization of the conditions for epistemic justification of the default presumption. Precisely state the formal properties of a defensible rule (e.g., conservatism, symmetry, path-sensitivity).
  *   **Months 11-12: Dissertation Drafting:** Write core dissertation chapters outlining the problem, analysis, proposed rule(s), justification, and implications.

  **5. Expected Outcomes & Significance:**
  *   **Positive Result:** A clearly articulated, formally grounded, and practically applicable **defeasible default rule** for presuming independence in informal reasoning. This rule would have identifiable formal properties (e.g., it minimizes worst-case error amplification under plausible ignorance constraints, or it successfully screens out paradigmatic double-counting while permitting paradigmatic cumulative support) and provide concrete guidance (e.g., "independence can be presumed *unless* considerations X and Y share source S or are linked via mechanism M"). The rule would be *non-trivial* – offering a shortcut compared to full dependence-structure analysis.
  *   **Significance:** The project bridges formal epistemology and the practice of reasoning. It promises to:
      *   Provide normative clarity for constructing and evaluating ubiquitous cumulative arguments.
      *   Reduce fallacious double-counting.
      *   Offer tools for more productive critiques of arguments.
      *   Contribute to the foundations of informal logic and heuristic reasoning under uncertainty.
      *   Have applications in critical thinking pedagogy and interdisciplinary research assessment.

  **6. Risk Assessment & Failure Conditions:**
  *   **Primary Risk:** The investigation concludes that **no non-trivial default rule is epistemically justified.** The only defensible approach might be requiring explicit, case-by-case justification for independence claims before they can contribute to cumulative force. This would render the sought-after "presumption" pointless and constitute project failure regarding the core research question.
  *   **Mitigation:** The Phase 1 taxonomy and Phase 2 modeling are valuable independently, documenting the phenomenon and its pitfalls. The project would still yield a significant negative result: demonstrating the *impossibility* of a useful default rule, forcing reliance on explicit justification, which is itself an important finding.
  *   **Other Risks:** (1) The formal models prove unable to capture the nuances of informal considerations. (2) No candidate rule adequately handles the spectrum of cases. (3) The project becomes unmanageably broad.
  *   **Mitigation:** Focused scoping (prioritizing clearest cases in Phase 1), pragmatic use of simplified models, and iterative refinement of rules based on testing. The 12-month timeline enforces discipline.

  This project addresses a fundamental gap in understanding heuristic reasoning by rigorously investigating the justification and structure of a crucial, implicit presumption. It promises either a practical tool for better reasoning or a significant negative result highlighting the necessity of explicit dependence analysis.
