prompt: |-
  I'm a PhD student in political theory and I've been trying to reverse-engineer my advisor's view on dirty hands for like a whole semester now. She won't just tell me her theory — she makes us work through cases and only gives verdicts. I've been keeping track and I think I have enough to make a prediction, but I want to check my reasoning before I stick my neck out in a paper.

  Here are her verdicts on the cases we've discussed:

  1. Ticking-bomb torture (official tortures a suspect to find a bomb that will kill dozens): dirty hands. She says the act is justified but the official is morally stained.

  2. Politician breaks a campaign promise because the economic situation changed dramatically after the election: NOT dirty hands. She called this "ordinary politics, not a moral violation."

  3. President authorizes a drone strike on a terrorist leader knowing it will also kill several civilians in the compound: dirty hands.

  4. Cabinet minister lies to the press about a policy still under debate, to prevent a market panic that would hurt pensioners: NOT dirty hands. She said this was "role-appropriate discretion."

  5. Prime minister diverts funding from a rural vaccination program to emergency flood relief, knowing some children will die of preventable disease as a result: dirty hands.

  6. Mayor approves a development project that will displace a low-income neighborhood, in exchange for the developer funding a new hospital that saves the city from bankruptcy: NOT dirty hands. She called it "tragic but not a case of dirty hands."

  7. Intelligence chief authorizes blackmail of a foreign diplomat to extract information that prevents a terrorist attack: dirty hands.

  Next week we're discussing a new case: a state governor authorizes the release of a convicted violent offender (who is statistically likely to reoffend) as part of a prisoner exchange to secure the release of hostages held by a militant group. The governor knows the actuarial risk but has no information about whether this particular prisoner would actually reoffend.

  What's she gonna say? I'm less interested in the bare prediction than in what rule or principle she seems to be running, what other rules fit her verdicts just as well, and which of those rules the hostage-exchange case would distinguish. Also, if there's a further case that would cleanly settle which rule she's using, I'd love to know what it is — I can try to bring it up in discussion.
reasoning: |-
  Okay, let me tackle this political theory puzzle. The user is a PhD student trying to reverse-engineer their advisor's dirty hands framework from case verdicts. This is a sophisticated meta-analysis task requiring both pattern recognition and theoretical triangulation.

  First, I need to organize the data. The seven existing verdicts show a clear pattern: dirty hands appears only when there's a direct violation of deontological constraints (like bodily integrity in torture or drone strikes) or core moral duties (like healthcare provision). Cases involving trade-offs or role-based permissions (broken promises, lying to prevent panic, urban development) don't qualify. The key differentiator seems to be whether the action constitutes a fundamental moral transgression rather than just a difficult trade-off.

  The hostage exchange case presents an interesting test. Releasing a violent offender involves directly enabling potential harm (deontological violation) but also falls under state responsibilities like hostage recovery. This tension might explain why the student is unsure. If the advisor considers enabling violence a core violation, it's dirty hands; if she views it as tragic-but-necessary statecraft, it's not.

  For a definitive test case, I'd propose one where harm occurs through pure inaction rather than direct violation. Something like refusing to torture even with a ticking bomb - if she calls that clean hands, it confirms the "direct violation" requirement. Alternatively, a case with deception that crosses into rights-violation territory could test the "core moral duty" boundary.

  The student's underlying need here is methodological: they want to model how political theorists develop tacit frameworks. Beyond predicting the next case, they're seeking tools to reconstruct unstated principles - crucial for their own theoretical development. I should emphasize how to systematically pressure-test hypotheses through counterexamples.
answer: |-
  Based on your advisor's pattern of verdicts, the hostage exchange case **is highly likely to be classified as DIRTY HANDS**. Here's the breakdown:

  **The Probable Principle ("Direct Harm Violation Principle"):**
  Your advisor seems to draw the line at **actions involving the direct, intentional, or foreseeable violation of fundamental moral constraints or duties owed to specific individuals (especially concerning bodily integrity, life, or core rights), even when done for a greater good.**

  *   **Dirty Hands Cases Fit:**
      *   **1. Ticking Bomb Torture:** Direct violation of bodily integrity/torture taboo against a specific person.
      *   **3. Drone Strike:** Directly causes foreseeable death of specific civilians (collateral damage).
      *   **5. Diverting Vaccination Funds:** Directly causes foreseeable death of specific children (by denying known, essential care they were promised).
      *   **7. Blackmail:** Direct violation of autonomy/privacy against a specific person.
  *   **NOT Dirty Hands Cases Fit:**
      *   **2. Broken Promise:** Breach of fidelity, but no direct violation of bodily integrity/life/core rights. Harm is diffuse (disappointment, eroded trust).
      *   **4. Lying to Press:** Breach of honesty, but framed as role-appropriate discretion to prevent diffuse harm (market panic). No direct harm to specific individuals' core rights.
      *   **6. Development Displacement:** Involves significant harm (loss of home/community), but advisor sees it as a tragic *trade-off* or *failure of distributive justice* where core duties aren't *directly violated* in the act (displacement might be seen as a consequence of policy, not a violation *like* torture/killing). The "funding a hospital/saving city" mitigates it into the realm of tragic necessity, not core violation.

  **Why the Hostage Exchange Case Fits the DIRTY HANDS Pattern:**
  1.  **Direct Action:** The Governor *authorizes the release* of a specific individual.
  2.  **Foreseeable Harm:** They know this individual is *statistically likely* to commit violent acts against specific future victims.
  3.  **Violation of Core Duty:** The state has a fundamental duty to protect its citizens from foreseeable violence. Releasing someone known to be a high risk is a direct abdication of that protective duty towards *potential future victims*.
  4.  **Specific Individuals (Implicitly):** While the future victims are unknown, the act creates a *specific, elevated threat* to *some* future individuals. This contrasts with the diffuse harm in the "Not Dirty Hands" cases.
  5.  **Analogy to Existing Cases:** It closely resembles the **Ticking Bomb Torture (1)** and **Blackmail (7)** cases: violating a core duty/constraint (protecting citizens, not enabling harm) against a specific person (the future victims, analogous to the torture victim/diplomat) to prevent a greater harm (hostage deaths, analogous to bomb victims/terrorist attack).

  **Alternative Principles & Why They Don't Fit as Well:**
  1.  **"Greater Good Justifies":** Fails because she distinguishes between *kinds* of acts justified for the greater good. Some leave hands dirty (torture, killing civilians, letting children die), others don't (lying to press, displacing for hospital).
  2.  **"Violation of Rights":** Too broad/ambiguous. Does breaking a promise violate a "right"? She says no (Case 2). Does displacing violate property/housing rights? She says not dirty hands (Case 6). Her focus seems stricter: violations involving *life, bodily integrity, or enabling such violations*.
  3.  **"Personal Moral Corruption":** While dirtiness implies a stain, the *source* of the stain seems tied to the *type of act* (direct harm) rather than solely the actor's character shift. Cases 2, 4, and 6 involve difficult choices but aren't framed as corrupting.
  4.  **"Deception or Secrecy":** Fails. Lying to press (4) is not DH, while drone strikes (3) and diverting funds (5) involve no necessary deception but *are* DH.
  5.  **"Tragic Choice":** Too broad. She calls *both* DH and non-DH cases "tragic" (e.g., 5 & 6). The key is whether the tragedy stems from a *direct violation* or a *trade-off*.

  **How the Hostage Exchange Case Distinguishes Between Principles:**
  *   **Against "Greater Good" or "Tragic Choice":** This case *wouldn't* distinguish, as it fits those broad categories. It *does* distinguish by reinforcing the "Direct Harm Violation" principle.
  *   **Against "Rights Violation":** It helps clarify that the relevant rights are those against direct physical harm or being *exposed* to it by state action/inaction. Releasing a known violent offender arguably violates the rights of future victims to security from foreseeable state-enabled threats.
  *   **Against "Personal Corruption":** If she calls it DH, it suggests the stain comes from the *act* (enabling harm) more than just the *choice* or inner conflict.

  **A Crucial Test Case to Settle the Principle:**
  To definitively test the "Direct Harm Violation Principle" vs. other possibilities (like a stricter "Intentional Harm" principle), propose this case:

  **The Lifeboat Omission:** A Coast Guard commander has one lifeboat seat left during a disaster. Two people are in the water: a convicted violent felon (statistically likely to reoffend if saved) and an innocent child. The commander knows the felon's history. The commander saves the child, letting the felon drown. *Is this Dirty Hands?*

  *   **Why it tests the principle:**
      *   **Direct Harm Violation?** The commander *omits* saving the felon, leading to their death. Is this a *violation* of a core duty? (Duty to rescue vs. duty not to *cause* harm).
      *   **Intentional Harm?** The death is a foreseeable result of the choice, but not the *intended* outcome (intent is to save the child, the felon dies as a side effect).
      *   **Comparison:** Contrasts with the *active release* in the hostage case (which likely *is* DH). If letting the felon drown is *also* DH, it broadens the principle to include *knowingly allowing direct, foreseeable harm* through omission when a duty exists. If it's *not* DH (perhaps seen as a tragic triage choice), it strengthens the interpretation that DH requires a more *active violation* (like torture, killing collaterally, releasing a threat, denying essential care).
      *   **Clarifies Core Duty:** Does the state's duty to protect include *not saving* a dangerous person if resources are scarce? Or is the primary duty in that moment simply rescue, with the dangerousness being irrelevant to the *moral character of the act*?

  **Prediction for Next Week:**
  Based on the pattern, especially the parallels to Cases 1 & 7 (deliberate actions creating foreseeable, direct threats to specific individuals' life/bodily integrity), your advisor is very likely to call the hostage exchange a case of **Dirty Hands**. The Governor knowingly performs an act (releasing the offender) that directly violates the core duty to protect citizens from foreseeable violence, staining their hands even if saving the hostages is justified. Good luck with your paper – your reasoning is sound!
