prompt: |-
  At a reading group on nineteenth-century liberal thought, a colleague has been defending Mill's view of British rule in India by leaning hard on the analogy Mill himself draws between governing peoples he judged not yet ready for representative institutions and a guardian's rule over a child before the age of majority. The colleague's conclusion is that colonial despotism was therefore not, in principle, illegitimate: it was a temporary tutelage, and its wrongness would consist only in being extended past the point at which the subject people had become capable of self-government. Mill, who spent much of his working life at the East India Company, is often read as defending the Company's rule in something like this spirit.

  I suspect the analogy is doing more work than it can bear, but I want it tested rather than dismissed. Please audit it. First, give the full correspondence table: what is meant to play the role of the guardian, the child, the child's developing capacities, the child's interests, the family bond, the age of majority, and the criterion for when the tutelage ends. Second, work through the disanalogies: the difference between a child's developing capacities and the standing capacities of the adults being governed; the assumption that the guardian is disinterested and shares the child's interests; the question of who sets the criteria for readiness and whether they can be set non-circularly; the heterogeneity of an entire subject population compared with a single child; and any others you judge material. Third, separate the disanalogies that are fatal to the colleague's use of the analogy from those that are merely superficial. Finally, say whether the conclusion — that despotic colonial rule could be a legitimate temporary tutelage — survives once the disanalogies are on the table, and offer a better analogy if one is available.
reasoning: |-
  Okay, the user is asking me to critically analyze John Stuart Mill's analogy between colonial rule and a guardian-child relationship. This is a sophisticated request from someone clearly well-versed in political philosophy and colonial history. 

  First, I need to unpack the analogy fully. The colleague is using Mill's guardian-child comparison to justify colonial rule as temporary tutelage. But the user suspects this analogy might be fragile. They want me to audit it systematically - first by mapping the correspondence, then identifying disanalogies, assessing which are fatal, and finally evaluating if the conclusion holds.

  Hmm... Mill's position is tricky because while he championed individual liberty in Western contexts, he defended authoritarian colonial rule. The East India Company connection is important - he literally helped administer the system he was philosophically justifying. 

  For the correspondence table, I should be precise: the guardian is the colonizer, the child is the colonized, "age of majority" means readiness for self-governance, etc. But already I see problems - actual colonial powers were profit-driven corporations, not disinterested parents.

  The disanalogies section needs careful handling. The capacity difference is huge - colonized adults aren't undeveloped children. And the "disinterested guardian" claim collapses when we recall colonial exploitation. Most damning is the circularity: colonizers define "readiness" in ways that conveniently prolong their rule. 

  I'm struck by how the heterogeneity of colonized societies gets erased in this analogy. India wasn't some monolithic child but a civilization with complex governance traditions. And the violence of colonial rule bears no resemblance to parental care.

  Which disanalogies are fatal? Definitely the capacity difference and the interest conflict. The circular readiness criterion is equally devastating. The family bond absence is serious but perhaps secondary.

  The conclusion can't survive this. Colonial despotism was structurally illegitimate, not redeemable as "temporary tutelage." For a better analogy, I'm considering apprenticeship - but even that risks implying incompetence. Maybe international trusteeship? Though that has problematic baggage too. 

  This user is clearly wrestling with how liberal thinkers rationalized imperialism. Beyond logic-chopping, they might want resources to challenge contemporary apologists for interventionism. I should emphasize how power corrupts such "tutelage" projects historically.
answer: |-
  Here's a systematic audit of Mill's guardian-child analogy for colonial rule, addressing your request step-by-step:

  ### 1. Correspondence Table (Mill's Intended Analogy)
  | **Guardian Analogy Element** | **Corresponding Colonial Element in Mill's View**         |
  |------------------------------|-----------------------------------------------------------|
  | **Guardian**                 | Colonial Ruler (e.g., British East India Company/Raj)     |
  | **Child**                    | Colonized People (e.g., Indians)                          |
  | **Child's Developing Capacities** | "Civilizational" readiness for self-government (rationality, public spirit, administrative skills) |
  | **Child's Interests**        | Long-term well-being, progress toward "civilization" & self-rule |
  | **Family Bond**              | Assumed shared civilizational destiny/trusteeship         |
  | **Age of Majority**          | Point of "readiness" for self-government                  |
  | **Criterion for Ending Tutelage** | Colonized people's demonstrated capacity for rational self-governance |

  ### 2. Key Disanalogies & Their Materiality
  **(A) Capacity Differential**  
  - *Analogy:* Children genuinely lack rational faculties; development is biological/universal.  
  - *Disanalogy:* Colonized adults have mature rational capacities honed within their own social/political traditions. "Incapacity" is defined by colonial standards, not absence.  
  - *Materiality:* **FATAL.** Denies agency to functioning societies; pathologizes difference as deficiency.

  **(B) Guardian's Motivations & Interests**  
  - *Analogy:* Guardian is (ideally) disinterested, acting solely for child's welfare; interests are aligned.  
  - *Disanalogy:* Colonial rulers pursue economic extraction, strategic dominance, racial superiority, and bureaucratic self-perpetuation. Interests conflict with colonized (e.g., drain of wealth).  
  - *Materiality:* **FATAL.** The foundational assumption of benevolent intent is empirically false. Power corrupts trusteeship.

  **(C) Criterion for "Readiness"**  
  - *Analogy:* Majority is biologically fixed; readiness is objectively measurable (e.g., literacy, age).  
  - *Disanalogy:* "Readiness" is defined by colonizers using circular logic (e.g., "They lack institutions like ours → need our rule → can't build institutions under our rule").  
  - *Materiality:* **FATAL.** Self-serving criteria ensure indefinite deferral of self-rule (e.g., India deemed "unready" for 190 years).

  **(D) Heterogeneity of the Governed**  
  - *Analogy:* A single child with unified interests.  
  - *Disanalogy:* Colonized societies are diverse (ethnic, religious, class). "Tutelage" imposes artificial unity, exacerbating divisions. Despotism denies self-determination to *all* groups.  
  - *Materiality:** **SERIOUS.** Invalidates the "tutelage" premise; rule is imposed, not consensual.

  **(E) Violence & Resistance**  
  - *Analogy:* Discipline is corrective; child accepts guardian's authority.  
  - *Disanalogy:* Colonial rule relies on violence, suppression of dissent, and crushing revolts (e.g., 1857 Uprising). Resistance proves non-consent.  
  - *Materiality:* **FATAL.** Exposes coercion, not care.

  **(F) Exit & Accountability**  
  - *Analogy:* Child can sue for emancipation; guardian accountable to courts/society.  
  - *Disanalogy:* No legal/political recourse for colonized; no neutral arbiter.  
  - *Materiality:* **SERIOUS.** Removes safeguards against abuse.

  ### 3. Fatal vs. Superficial Disanalogies
  - **Fatal Disanalogies** (Destroy the analogy's core logic):  
    - (A) Capacity Differential  
    - (B) Guardian's Motivations & Interests  
    - (C) Criterion for "Readiness"  
    - (E) Violence & Resistance  
  - **Serious but Not Fatal**: (D) Heterogeneity, (F) Exit & Accountability.  
  - **Superficial**: None—all identified disanalogies are material.

  ### 4. Conclusion & Alternative Analogy
  - **Conclusion's Validity:** **No, the conclusion does not survive.** The disanalogies reveal that colonial "tutelage":  
    (a) Presumes non-existent incompetence in adults,  
    (b) Is corrupted by the guardian's self-interest,  
    (c) Uses rigged criteria to perpetuate itself,  
    (d) Relies on violence, not consent.  
    Colonial despotism is thus *structurally illegitimate*—not because it outlasts "readiness," but because it is axiomatically paternalistic, self-appointed, and coercive. Mill's analogy masks domination as benevolence.

  - **Better Analogy: Prison Warden & Prisoners**  
    - *Correspondence:* Warden (colonizer) imposes rules on prisoners (colonized) claiming "rehabilitation" (civilizing mission). Rules serve institutional control; "reform" is secondary. Release criteria are arbitrary. Resistance proves non-consent.  
    - *Why Better:* Rejects paternalism; centers power imbalance, coercion, and institutional self-interest. Acknowledges that the "warden" benefits from the status quo and cannot objectively judge "rehabilitation."  
    - *Limitation:* Still imperfect (colonized aren't convicted criminals), but avoids infantilization and better captures violence and lack of consent.

  **Final Note:** Mill's analogy is not merely flawed—it is ideological. It reframes conquest as pedagogy and resistance as ingratitude. The fatal disanalogies reveal colonial rule as an exercise in power, not a developmental stage. A defensible critique must reject the analogy entirely, not merely adjust its timeline.
