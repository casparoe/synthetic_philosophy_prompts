prompt: |-
  I work in the engagement team at an NHS trust, the bit that runs public consultations on what the trust should keep funding and what it should cut when the budget won't stretch. Every few months we run a meeting where residents tell us what they think should be prioritised, and afterwords I write a note for the board saying which views we took seriously and which we set aside. The thing I keep getting stuck on is that I can't explain, even to myself, where the line is between someone's considered view and someone's bias. People say things like 'why should my taxes pay for people who smoked' or 'mental health isn't a real illness like cancer' or 'we should look after our own before people who've only just got here.' Some of that is clearly out of order, but the line between 'that's a moral view about responsibility and desert' and 'that's just prejudice' feels like it moves depending on who said it and whether I happen to agree. I don't want our consultation to be fake, where we only count the views that match what the trust was going to do anyway, but I also don't want to dress up every nasty comment as a legitimate preference.

  Could you write me a procedure my team could actually run on a comment that comes up in one of these meetings? There are four of us, none of us with any philosophy background, and we usually have about two weeks between the meeting and the board paper. I'd like it as a set of questions we ask in order, with some idea of what counts as a good enough answer to each, where the procedure says 'set this one aside,' and where it says 'this is a genuine value judgement, a person has to make it, don't pretend the checklist made the call.' Be honest about which steps are really judgement calls dressed up as procedure, and about the cases where the procedure is most likely to misfire. Then run it on three examples: (1) someone saying the trust shouldn't fund IVF because having children is a luxury not a medical need, (2) someone saying we shouldn't pay for interpreter services because if you live here you should speak English, and (3) someone saying dementia care should be funded before cancer screening because people with dementia have no voice and cancer already gets all the charity money. And make sure at least one of the worked examples is a case where your procedure tells me I have to count a view that I'm going to hate putting in front of the board.
reasoning: |-
  Okay, let me try to unpack this user's problem. They work in an NHS trust engagement team, running public consultations on budget priorities. Their main struggle is distinguishing between legitimate considered views and prejudiced biases when analyzing public feedback. They need a practical procedure their team can use to evaluate comments fairly, especially since they lack philosophy backgrounds and have tight deadlines.

  The user wants a step-by-step process that's honest about its limitations. They specifically mentioned three examples: IVF funding as "luxury," opposing interpreter services, and prioritizing dementia over cancer care. One of these should challenge the team to include uncomfortable but valid views.

  Hmm... The core tension here is between democratic inclusion and ethical boundaries. The NHS has legal duties (Equality Act 2010) and core principles (universality, equity) that can't be compromised. But consultations must also capture genuine community values. The procedure needs to separate:
  - Factual inaccuracies (e.g., "mental health isn't real illness")
  - Discriminatory statements (e.g., anti-immigrant rhetoric)
  - Tough but defensible value judgments (e.g., prioritizing terminal illnesses)

  I should build a flowchart-style checklist that:
  1) Flags illegal/discriminatory comments immediately
  2) Filters out verifiably false claims
  3) Identifies personal anecdotes vs. systemic arguments
  4) Explicitly marks where judgment calls are unavoidable

  For the examples:
  - The IVF comment might pass as a value judgment about "medical need" definitions
  - The interpreter stance likely fails discrimination checks
  - The dementia prioritization could be recorded as a valid equity argument

  Crucially, the dementia example should be the uncomfortable but includable one - it highlights need-vs-impact tradeoffs without violating rights. The procedure must force confronting such valid-but-unpleasant views.

  Also... the user hinted at unconscious bias in their team ("the line moves depending on who said it"). The process should include step 0: anonymize comments before evaluation to reduce this.

  Finally, the output needs to be board-ready. So the procedure should generate clear categorization: "Excluded (reason: discrimination)" or "Included (category: equity argument)".
answer: |-
  Here's a practical, step-by-step procedure for your team to evaluate public comments, designed for non-philosophers under time pressure. It acknowledges where judgements are unavoidable and flags common pitfalls. The core principle is: **Distinguish between *values* (which count) and *prejudice/inaccuracy* (which we set aside), guided by NHS principles and law.**

  ---

  ### **Procedure: Evaluating Public Comments**
  **(Run sequentially on each distinct comment/argument)**

  1.  **STEP 0: Anonymize & Contextualize (Team Admin)**
      *   *Action:* Remove names, identifiable details. Note if the comment came from a patient, carer, resident, specific community rep, etc. (Context matters for understanding perspective, not for validity).
      *   *Why:* Reduces unconscious bias based on *who* said it. Ensures focus on *what* was said.

  2.  **STEP 1: Is it Legally Discriminatory or Hate Speech? (Filter)**
      *   *Question:* Does this comment express prejudice against a group protected under the Equality Act 2010 (age, disability, gender reassignment, marriage/civil partnership, pregnancy/maternity, race, religion/belief, sex, sexual orientation) based *solely* on their membership in that group, using derogatory language or advocating denial of core services?
      *   *Good Enough Answer:* YES if it uses slurs, advocates denying *all* care based on identity (e.g., "Don't treat immigrants"), or promotes harmful stereotypes *as the sole basis* for exclusion. NO if it expresses a *general* value judgement (e.g., "prioritise citizens") without *inherently* demeaning a protected group.
      *   *Decision:* **SET ASIDE IMMEDIATELY** (Illegal, incompatible with NHS constitution). Flag for monitoring if extreme.
      *   *Judgement Call?* **Minimal.** Use the Equality Act definition strictly. Pitfall: Mistaking strong language for hate speech if it criticises a *service*, not a *group*.

  3.  **STEP 2: Is it Factually Inaccurate? (Filter)**
      *   *Question:* Does the comment rely on a clearly false factual claim as its *primary justification*? Can this claim be easily verified/rebutted by NHS evidence or widely accepted science?
      *   *Good Enough Answer:* YES if core claim is demonstrably false (e.g., "Vaccines cause autism," "Mental illness isn't real," "Smokers don't pay taxes"). NO if it's a value judgement *based on* a debatable interpretation or personal experience (e.g., "IVF feels like a luxury *to me*").
      *   *Decision:* **SET ASIDE** if false claim is essential to the argument. *Do not* set aside opinions based on *values* simply because you disagree or find them uncomfortable.
      *   *Judgement Call?* **Moderate.** Requires quick team consensus on what constitutes "widely accepted" fact vs. value-laden interpretation. Pitfall: Overreaching and dismissing values disguised as facts (e.g., "Cancer is *always* more serious" - value judgement disguised as fact).

  4.  **STEP 3: Is it Rooted in Personal/Specific Experience? (Context)**
      *   *Question:* Does the comment describe a specific, firsthand experience (good or bad) with a service, or articulate a personal need/impact? Does this experience illustrate a broader point relevant to priorities?
      *   *Good Enough Answer:* YES if it provides concrete examples (e.g., "My mother's dementia care was poor because..." or "IVF gave me my family, it's vital"). NO if it's only a general opinion without connection to experience or impact.
      *   *Decision:* **FLAG AS CONTEXT** (Not a priority *vote*, but valuable insight into impact, gaps, or lived experience). Include in summaries as illustrative evidence.
      *   *Judgement Call?* **Low.** Focus on presence of concrete details.

  5.  **STEP 4: Does it Express a Genuine Value Judgement About NHS Principles? (Core Inclusion Test)**
      *   *Question:* Does the comment express a preference about how *limited NHS resources should be allocated*, based on a defensible (even if contestable) interpretation of core NHS values (e.g., clinical need, effectiveness, fairness, equity, preventing premature death, quality of life, personal responsibility, community benefit)?
      *   *Good Enough Answer:* YES if it tackles a *trade-off* inherent in rationing (e.g., "Prioritise life-threatening over non-life-threatening," "Focus on conditions with greatest population impact," "Weight services for the most vulnerable more heavily," "Consider individual responsibility factors"). NO if it's simply self-interest without a value argument ("Don't cut *my* service").
      *   *Decision:* **INCLUDE & CATEGORISE** (This is the core legitimate preference). Note the *value* expressed (e.g., "Prioritises clinical urgency," "Emphasises personal responsibility," "Focuses on equity for the voiceless").
      *   *Judgement Call?* **HIGH - The Crucial Step.** Requires asking: "What underlying value about resource allocation or healthcare is being expressed here, *even if I dislike it*?" Pitfall: Letting personal discomfort with the *conclusion* (e.g., cutting IVF) blind you to the *value* (defining 'core medical need') being expressed.

  6.  **STEP 5: Is the Value Judgement Framed Respectfully & Constructively? (Tone Note)**
      *   *Question:* Even if the *value* passes Step 4, is the *expression* gratuitously offensive, inflammatory, or deliberately disrespectful to other groups/views?
      *   *Good Enough Answer:* Subjective, but YES if it uses insults, dehumanising language, or seems designed purely to provoke anger rather than argue a point.
      *   *Decision:* **INCLUDE the value judgement (Step 4),** but **NOTE the problematic tone** in your report. The *substance* of the value counts, but the board should know if expression was harmful.
      *   *Judgement Call?* **Moderate.** Focus on extreme disrespect, not just bluntness or passion. Pitfall: Confusing strong emotion with disrespect, or sanitising important community anger.

  ---

  ### **Worked Examples**

  **Example 1: "The trust shouldn't fund IVF because having children is a luxury, not a medical need."**
  1.  **Step 1:** Not discriminatory/hate speech (targets a service, not a protected group).
  2.  **Step 2:** Not factually inaccurate. "Medical need" is a value-laden term, not a fixed fact. Opinion on whether infertility constitutes a medical need is the core value judgement.
  3.  **Step 3:** No specific personal experience cited (general opinion).
  4.  **Step 4:** **CRUCIAL STEP:** This expresses a clear value judgement about defining the *core purpose* of the NHS ("medical need" vs. "luxury") and where infertility sits within that. It directly addresses resource allocation based on a view of healthcare scope. **INCLUDE & CATEGORISE** (e.g., "View: IVF falls outside core NHS medical need").
  5.  **Step 5:** Tone is direct but not inherently disrespectful or inflammatory. **INCLUDE without tone note.**
      *   **VERDICT:** **INCLUDE** as a legitimate value judgement about NHS scope. You might *hate* this view, but it's a core ethical debate in rationing.

  **Example 2: "We shouldn't pay for interpreter services because if you live here you should speak English."**
  1.  **Step 1:** **CRITICAL STEP.** This targets access to essential NHS services based on national origin/language (protected characteristics under Race & potentially Religion). It advocates denial of a core service enabling safe, effective care based on group membership and a perceived failure to assimilate. **SET ASIDE IMMEDIATELY** (Discriminatory under Equality Act, contravenes NHS right to access services).
  2.  (Stop. No need for further steps).
      *   **VERDICT:** **SET ASIDE (Discrimination).** This is prejudice dressed as a value judgement. The underlying *value* ("promote English language skills") could be expressed legitimately elsewhere (e.g., funding ESOL classes), but not as a reason to deny medical interpretation.

  **Example 3: "Dementia care should be funded before cancer screening because people with dementia have no voice and cancer already gets all the charity money."**
  1.  **Step 1:** Not discriminatory/hate speech (argues for prioritising one vulnerable group over another, doesn't demean either).
  2.  **Step 2:** "Cancer already gets all the charity money" is an exaggeration but not the core justification. The primary argument is about voice and existing attention/resources. Not grounds for setting aside.
  3.  **Step 3:** May imply experience (seeing dementia patients as voiceless) but not specific. General point.
  4.  **Step 4:** **CRUCIAL STEP:** Expresses two clear value judgements relevant to NHS priorities:
      *   **Value 1: Equity/Advocacy:** Prioritise groups perceived as less able to advocate for themselves ("no voice").
      *   **Value 2: Resource Balance:** Allocate NHS resources counter-cyclically to compensate for perceived imbalances in *other* funding sources (charity money).
      *   **INCLUDE & CATEGORISE** (e.g., "View: Prioritise dementia care based on greater vulnerability/lack of advocacy and to counterbalance perceived charity funding inequity").
  5.  **Step 5:** Tone is reasoned and highlights vulnerability. **INCLUDE without tone note.**
      *   **VERDICT:** **INCLUDE** as a legitimate, albeit challenging, value judgement about equity and resource allocation balance. This is the example you *hate* putting forward (arguing *against* cancer screening!), but it passes the test – it’s a value-based argument about priority-setting using relevant NHS concepts (vulnerability, equity).

  ---

  ### **Key Honesties & Pitfalls**

  *   **STEP 4 is the Heart (and the Hardest):** This is where the "bias vs. value" line is drawn. It *is* a judgement call. Be rigorous: "What value about *sharing limited NHS resources* is being expressed?" If it speaks to need, fairness, effectiveness, responsibility, or scope of the NHS, it likely counts, *even if you disagree vehemently with the conclusion*. The pitfall is rejecting views that make you uncomfortable.
  *   **STEP 1 is Your Guardrail:** Use the Equality Act strictly. This prevents prejudice being legitimised. The pitfall is being *too* narrow – e.g., missing systemic bias disguised as values. Err on the side of caution: if it *sounds* like it's blaming/denying a protected group, it probably is.
  *   **"Considered" ≠ "Agreeable":** A "considered view" doesn't mean you agree or it's well-researched. It means it expresses a coherent *value* relevant to the NHS's impossible choices. Angry, poorly articulated views can still express legitimate underlying values (Step 4).
  *   **Tone is Secondary (but Noted):** Don't exclude valid value judgements just because they're shouted or rudely expressed (Step 5). But *do* flag extreme incivility.
  *   **Procedure Can Misfire:**
      *   **On Subtle Bias:** Values arguments masking prejudice (e.g., "Prioritise *deserving* citizens" implying immigrants are undeserving) might sneak through Step 1 if not explicit. Mitigation: Be vigilant in Step 4 – does the *value* inherently rely on excluding a protected group?
      *   **On Complex Views:** Comments mixing valid values with prejudice/facts might need parsing into parts (include the value, set aside the rest).
      *   **On "Lived Experience":** Over-valuing articulate personal stories vs. inarticulate but deeply held community values. Mitigation: Step 3 flags experience for context, but Step 4 ensures *values* from any source count.
      *   **Team Bias:** The biggest risk. Mitigation: Anonymize (Step 0), use the steps *rigorously* as checks, discuss borderline cases as a team, acknowledge discomfort.

  This procedure won't make the ethical dilemmas disappear, but it provides a transparent, defensible, and legally sound framework for ensuring your consultation captures the messy reality of public values while upholding NHS principles and the law. It forces you to confront the uncomfortable but legitimate trade-offs, which is the hallmark of a genuine, not fake, consultation.
