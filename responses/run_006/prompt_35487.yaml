answer: |-
  The situation you've described is known as the St. Petersburg paradox, first introduced by Daniel Bernoulli in 1738. It highlights a conflict between the mathematical concept of expected value and real-world decision-making. Your calculation of the expected monetary value (EMV) is correct: since each term in the series is 1 and the sum diverges to infinity, the EMV is indeed infinite. However, this result is paradoxical because no rational person would pay a very large sum to play, as you intuitively sensed. The resolution involves two key insights: diminishing marginal utility and practical constraints.

  ### 1. **Diminishing Marginal Utility and Expected Utility Theory**
     - People do not value money linearly. Gaining an additional dollar is worth less when you already have a lot of money. This is modeled by a utility function, often logarithmic (e.g., \(U(x) = \log(x)\)), which captures decreasing marginal utility.
     - Instead of maximizing EMV, rational decision-makers maximize expected utility. For a payout \(X\) and initial wealth \(W\), the expected utility of playing the game (after paying fee \(F\)) is:
       \[
       E[U] = \sum_{n=1}^{\infty} \left( \frac{1}{2} \right)^n \log(W - F + 2^n)
       \]
     - Unlike EMV, this series converges to a finite value because \(\log(2^n) = n \log 2\) grows slowly, and the terms \((1/2)^n n \log 2\) decrease rapidly. For example, with \(W = \$1000\) and \(F = \$20\), \(E[U]\) is finite and comparable to \(\log(W)\).
     - The fair fee \(F\) is found by solving \(E[U(W - F + X)] = U(W)\). This \(F\) depends on your initial wealth (e.g., it might be around \$10–\$25 for typical wealth levels), explaining why high fees feel unfair—you're risk-averse to losing substantial money for unlikely huge gains.

  ### 2. **Practical Constraints**
     - In reality, no one can pay infinite sums. The game assumes the payout \(2^n\) is always possible, but for large \(n\) (e.g., \(n = 40\)), \(2^{40}\) exceeds global wealth. Thus, payouts are effectively capped, making EMV finite.
     - With a reasonable cap (e.g., \(n \leq 30\)), EMV becomes \(\sum_{n=1}^{30} 1 = 30\), suggesting a fair fee near \$30. Beyond this, the probability of larger payouts is negligible (e.g., \(P(n > 30) \approx 10^{-9}\)).

  ### Why the Math and Intuition Diverge
  - The infinite EMV relies on unrealistic assumptions: risk-neutrality, linear utility, and unbounded payouts. Humans are risk-averse, and the logarithmic utility function reflects this, yielding a finite expected utility.
  - Your friend's claim that refusing is "irrational" ignores these factors. Expected utility theory, not EMV, is the standard for rational decisions under uncertainty.

  In short, the math is "airtight" in a vacuum, but real-world rationality incorporates utility and constraints. For further reading, explore Bernoulli's original paper or expected utility theory—your math club advisor can likely suggest resources. This paradox beautifully illustrates why economics and psychology must inform mathematical models.
