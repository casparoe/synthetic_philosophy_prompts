prompt: |-
  I'm on the governance committee of a DAO that has been running futarchy-style votes for a couple years now, and we've build up enough of a track record that the decisions are starting to feel precedential. The basic setup: proposals pass or fail based on what conditional prediction markets say about a success metric, and our committee is supposed to keep the choices coherent across cases. Here's the record so far, stripped of details:

  - We approved a protocol upgrade when the market predicted +12% token price over six months.
  - We rejected an influencer marketing spend when the market predicted no measurable price effect.
  - We approved a compliance overhaul that the market said wouldn't move price, but that cut the probability of a catastrophic regulatory fine from about 20% to 5% over a year; we treated that as an expected-value win.
  - We rejected a treasury diversification into stables when the market predicted much lower volatility but flat-to-down expected return.
  - We approved a bug bounty when the market predicted no price effect but a drop in the probability of a critical exploit from 10% to 6%; we treated that as a cheap expected-value win.

  Now we have a proposal to spend treasury funds on a one-year insurance policy covering a catastrophic smart-contract failure. The market on token price over the next year predicts -2% (the premium). The market on 'probability of a catastrophic exploit in the next 12 months' predicts a drop from 5% to 1%. We didn't commission a market on overall expected token value, and the proposer argues the exploit-probability market is the relevant one because the whole point is tail risk. The two of us on the committee disagree: one says we should approve whenever the market says the proposer's chosen metric will improve; the other says we've always implicitly required an improvement in expected token value, and tail-risk reductions only count if they pay for themselves. What should we decide if we want to be consistent with our own record? Which precedent is the closest analog, and if the record really underdetermines this, what principle are we adopting under each choice? And is there a further case we could put to the markets that would split those two principles more cleanly than this one?
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a DAO governance committee that uses futarchy, where decisions are based on prediction markets. They have a history of past decisions and now face a new proposal about buying insurance against smart-contract failure. The committee members disagree on how to interpret the market data. One wants to rely solely on the metric the proposer chose (reducing exploit probability), while the other insists on expected token value improvement, which isn't directly measured here.

  First, I need to parse their precedents. They've approved proposals that either increased token price or reduced significant risks with clear expected value gains, even when price didn't change. The compliance overhaul and bug bounty approvals were based on reduced probabilities of catastrophic events, treated as expected-value wins. Rejections happened when there was no positive impact on price or expected value. 

  The current proposal shows a 2% token price drop (the insurance cost) but reduces exploit probability from 5% to 1%. The key question is whether reducing tail risk without a net expected value gain is sufficient. Their past decisions required expected value improvements when price wasn't impacted. The compliance and bug bounty cases had quantifiable benefits that outweighed costs. Here, the benefit isn't directly tied to expected value. 

  The user's deeper need might be establishing a consistent decision framework to avoid arbitrary rulings. They might also want to prevent future disagreements by clarifying principles. The insurance case is trickier because the cost (price drop) is clear, but the benefit (risk reduction) isn't monetized. Without an expected value market, they have to infer. 

  I should compare this to previous cases. The compliance overhaul is the closest: it reduced regulatory risk without price impact, but they calculated the expected value. Here, they lack that calculation. The stables diversification was rejected for similar reasons—reduced volatility without expected gain. 

  To resolve the ambiguity, they need a principle: either allow proposers to choose metrics (risking incoherence) or insist on expected value. The latter aligns better with their history. A better test case would involve a proposal with high cost and clear risk reduction but negative expected value, forcing a clear choice between tail risk mitigation and expected returns.
answer: |-
  Based on your record and the principles it establishes, **rejecting the insurance proposal is the more consistent approach**, though the record reveals underlying ambiguity that needs explicit resolution. Here's the breakdown:

  ### Key Precedents & Principles from Your Record:
  1.  **Expected Value is Paramount:** Your approvals consistently required a demonstrable *net positive expected value (EV)* for the token:
      *   Protocol Upgrade: Direct +EV via price increase.
      *   Compliance Overhaul: EV calculated as (20%-5%) * Catastrophic Fine Cost > 0 (even with flat price).
      *   Bug Bounty: EV calculated as (10%-6%) * Exploit Cost > Spending (even with flat price).
  2.  **Rejections Based on Lack of Positive EV:**
      *   Influencer Marketing: No measurable positive impact (implied neutral/negative EV).
      *   Treasury Diversification: Lower volatility insufficient without positive EV (flat/down return).
  3.  **Proposer's Metric ≠ Sovereign:** You didn't automatically accept the market on the *proposer's chosen metric*. In the treasury diversification case, the proposer likely argued "lower volatility" was the key metric, but you required a link to positive EV.
  4.  **Tail Risk Only Counts if it Pays:** Risk reduction alone wasn't sufficient. In the compliance and bug bounty cases, you *explicitly calculated* that the reduction in probability *multiplied by the avoided cost* exceeded the proposal's cost.

  ### Analysis of the Insurance Proposal:
  *   **Token Price Market:** Predicts a -2% cost (the premium paid). This is a direct negative EV impact *unless offset*.
  *   **Exploit Probability Market:** Predicts a reduction from 5% to 1% (4% absolute reduction). **Crucially, this is NOT an EV market.**
  *   **The Missing Link:** You lack a market quantifying the *cost/value avoided* by the insurance policy (the payout value multiplied by the reduced probability). The exploit probability reduction is necessary but *not sufficient* for approval under your precedent. **You require: `(Reduced Prob * Avoided Cost) > Premium Cost`.** You have `Reduced Prob` (4%) and `Premium Cost` (2% token value), but **no data on `Avoided Cost`**.
  *   **Proposer's Argument Flawed:** Claiming the exploit-probability market is sufficient ignores your requirement to demonstrate *net positive EV*. Your committee explicitly performed this calculation in analogous cases (compliance, bug bounty).

  ### Why Rejection is More Consistent:
  1.  **Lack of Demonstrated EV:** Like the rejected treasury diversification (lower volatility without EV gain), this offers risk reduction without demonstrated net EV gain. The -2% price impact is a clear cost.
  2.  **Adherence to Calculation Requirement:** In the compliance and bug bounty cases, you *demanded* evidence (via calculation) that the risk reduction justified the cost. You lack that evidence here. Approving without it breaks this precedent.
  3.  **"Pays for Itself" Principle:** Your approvals for risk mitigation required the benefit to outweigh the cost. The insurance premium (-2%) is known; the expected benefit (`4% * Payout Value`) is unknown. Without knowing `Payout Value`, you cannot confirm if it "pays for itself."

  ### Why There's Ambiguity & The Two Principles
  The record underdetermines whether *any* significant tail-risk reduction is sufficient *if the proposer chooses that metric*, or if *only net positive EV* matters. Your actions strongly imply the latter, but it wasn't explicitly stated until now.

  *   **Principle A (Proposer's Metric):** "The committee approves if the market on the metric *chosen by the proposer and deemed relevant by the committee* predicts improvement, regardless of other impacts." **(Inconsistent with your record - see treasury diversification rejection).**
  *   **Principle B (Net Expected Token Value):** "The committee approves only if the proposal demonstrably increases the expected value of the token, considering all significant impacts. Risk reduction must be valued and shown to exceed costs." **(Consistent with your past approvals and rejections).**

  ### Crafting a Cleaner Test Case
  To decisively split Principles A and B, propose something like:

  *   **The "Symbolic Safeguard":** Spend a *significant* amount (e.g., 5% of treasury) on an elaborate, highly publicized security audit by a prestigious but impractical firm. The *only* predicted impact is a reduction in the perceived probability of a catastrophic exploit (say, market predicts drop from 5% to 3.5%). Crucially, markets predict:
      *   **Token Price:** -5% (due to the cost).
      *   **Exploit Probability:** -1.5% (absolute).
      *   **Expected Token Value:** Unchanged or slightly negative (as the cost outweighs the small, non-monetized risk reduction for EV purposes).

  **Why it Splits Cleanly:**
  1.  Under **Principle A (Proposer's Metric):** If the proposer chooses "exploit probability" and the market predicts improvement, it *should* be approved. Tail risk is reduced!
  2.  Under **Principle B (Net EV):** The explicit cost (-5% token value) is known. The benefit (1.5% reduction * Catastrophe Cost) is unknown but *highly unlikely* to exceed the 5% cost unless the catastrophe value is astronomically high (far exceeding the treasury). It should be rejected for lack of demonstrated positive EV.

  ### Recommendation & Path Forward
  1.  **Reject the Insurance Proposal:** It fails the test applied in similar historical cases (compliance, bug bounty) because it lacks the crucial calculation demonstrating that the risk reduction's value exceeds the cost. The -2% price impact is a concrete negative.
  2.  **Adopt Principle B Explicitly:** Formalize that approval requires a demonstrated net positive expected value impact on the token. This aligns with your actual past behavior.
  3.  **Future Market Design:** Commission markets that *directly address EV* for risk-mitigation proposals. Instead of just "exploit probability," commission a market on "Expected Token Value Impact" *or* pair the probability market with a market estimating the cost of the catastrophe event itself. This provides the `Avoided Cost` needed for the calculation.
  4.  **Address the Ambiguity:** Use this decision to clarify the governing principle for the DAO. State explicitly that tail-risk reductions, while valuable, are subject to the same net EV requirement as other proposals.

  By rejecting this proposal and adopting Principle B formally, you maintain consistency with the logic underpinning your past approvals and rejections, ensuring coherent decision-making based on the fundamental goal of increasing the expected value of the token.
