  For the counterargument about more simulated minds: even if there are more minds, they are contingent on simulators continuing the simulation. If the simulators shut it down, those minds cease to exist. This contingency makes their existence less secure than baseline minds. Also, the resources to create simulations are finite, so there might be limits to how many simulations are run.

