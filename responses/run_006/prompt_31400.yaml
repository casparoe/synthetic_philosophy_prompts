  Debrief:

  - Pure strategy dominance: a pure strategy is dominated if there is another pure strategy that yields at least as much in every contingency and strictly more in at least one. In this game, no pure strategy dominated D.
  - Mixed strategy dominance: a pure strategy is strictly dominated if there exists a mixed strategy (over other pure strategies) that yields strictly more in every contingency. Here, D was dominated by a mixture of A and B.
  - After eliminating D, we have a new game. In this new game, C is now strictly dominated by a mixture of A and B. So we can eliminate C.
  - The iterated elimination procedure: we eliminate strategies in rounds, and after elimination, we consider the reduced game.
  - Epistemic assumptions: each round assumes that the players are rational (they will not play a strictly dominated strategy) and that there is common knowledge of rationality (everyone knows that others are rational, everyone knows that everyone knows, and so on). This allows us to eliminate in multiple rounds.

