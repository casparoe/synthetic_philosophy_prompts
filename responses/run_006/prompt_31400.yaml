  ### Iterated Dominance In-Class Game  
  **Designed for 20 students (75 minutes)**  
  **Goal:** Create a scenario where pure-strategy dominance stalls, but mixed-strategy dominance enables iterated elimination. Students will experience the *need* for mixed strategies as a predictive tool.

  ---

  ### **Game Rules & Setup**  
  **Players:**  
  - Split students into **Group A (Player 1)** and **Group B (Player 2)**, 10 each.  
  - **Strategies for both groups:** `A`, `B`, `C`, `D` (written on a handout).  

  **Payoffs (non-monetary):**  
  - Reward: **1 piece of candy** (or 1 course point) per 5 points earned.  
  - Use the **same payoff matrix for both groups** (below). Rows = your choice, columns = opponent’s choice.  
  - **Matrix (Row Player’s Payoff):**  

  |         | **A (col)** | **B (col)** | **C (col)** | **D (col)** |  
  |---------|------------|------------|------------|------------|  
  | **A (row)** | 5          | 0          | 4          | 1          |  
  | **B (row)** | 0          | 5          | 4          | 1          |  
  | **C (row)** | 2          | 2          | 0          | 1          |  
  | **D (row)** | 1          | 1          | 1          | 0          |  

  **Example:**  
  - If you (Group A) choose `A` and your opponent (Group B) chooses `C`, you earn **4 points**.  
  - If you (Group B) choose `C` and your opponent (Group A) chooses `A`, you earn **2 points** (since you are the row player).  

  **Procedure:**  
  1. **Round 1 (10 min):**  
     - Groups A and B choose `A`, `B`, `C`, or `D` secretly (write on slips).  
     - Randomly pair Group A with Group B (draw names from hats).  
     - Calculate payoffs using the matrix. Announce total candies/points earned.  

  2. **Discussion 1 (15 min):**  
     - Poll choices: *"Who chose D? Why?”*  
     - Ask: *"Is there a strategy that is always worse than some other single strategy?"*  
       - Students will see:  
         - `D` is **not strictly dominated by any pure strategy** (e.g., vs. `A`: `D`=1 < `A`=5, but vs. `C`: `D`=1 > `A`=0).  
       - Stall point: Pure-strategy elimination gets stuck.  

  3. **Round 2 (10 min):**  
     - Allow students to change strategies. Announce: *"D is still allowed."*  
     - Re-pair and recompute payoffs.  

  4. **Discussion 2 (15 min):**  
     - Ask: *"Is there a way to guarantee more than D without knowing the opponent’s move?"*  
     - Introduce **randomization**: *"Suppose you flip a coin to choose between A and B. What would you earn against each opponent move?"*  
       - Guide them to calculate:  
         - Vs. `A`: \(0.5 \times 5 + 0.5 \times 0 = 2.5 > 1\)  
         - Vs. `B`: \(0.5 \times 0 + 0.5 \times 5 = 2.5 > 1\)  
         - Vs. `C`: \(0.5 \times 4 + 0.5 \times 4 = 4 > 1\)  
         - Vs. `D`: \(0.5 \times 1 + 0.5 \times 1 = 1 > 0\)  
       - **Revelation:** Any mix of `A` and `B` (with probability \(p ∈ (0.2, 0.8)\) strictly dominates `D`!  

  5. **Round 3 (10 min):**  
     - Eliminate `D`: *"You cannot choose D anymore."*  
     - Play again with only `A`, `B`, `C`.  

  6. **Discussion 3 (10 min):**  
     - Ask: *"Now, is there a strategy you would never play?"*  
       - Students find `C` is **not dominated by any pure strategy** (e.g., vs. `A`: `C`=2 > `B`=0, but vs. `C`: `C`=0 < `A`=4).  
       - Reuse randomization: *"Coin flip between A and B vs. C’s payoffs."*  
         - Vs. `A`: \(2.5 > 2\)  
         - Vs. `B`: \(2.5 > 2\)  
         - Vs. `C`: \(4 > 0\)  
       - **Revelation:** A mix of `A` and `B` (e.g., \(p = 0.5\)) strictly dominates `C`!  

  ---

  ### **Debrief: Mapping Game to Theory**  
  - **Pure-Strategy Dominance Failure:**  
    - In Round 1, no single strategy beats `D` in *every* case. Students see the stall.  
  - **Mixed-Strategy Dominance:**  
    - Randomization between `A` and `B` beats `D` in *every* scenario. This dislodges the "pure-only" mindset.  
  - **Iterated Elimination:**  
    - After removing `D`, `C` becomes dominated by the same logic. Students *feel* the iterative tightening.  
  - **Epistemic Assumptions:**  
    - **Round 1:** Assumes rationality (no one plays strictly dominated strategies).  
    - **Round 3:** Assumes **common knowledge of rationality** (all know others are rational, so `D` is gone; thus, `C` becomes vulnerable).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Students won’t randomize in play.  
     - **Solution:** Emphasize randomization is a *tool for reasoning*, not a play requirement. Ask: *"Would a rational player ever choose D, knowing a mix of A/B is safer?"*  

  2. **Problem:** Post-elimination, some still choose `C` and "win" (e.g., if opponents play `A`/`B`).  
     - **Solution:** Highlight the *counterfactual*: *"You won because your opponent didn’t play optimally. But if they avoid dominated strategies, C always loses."* Use this to discuss common knowledge.  

  3. **Problem:** Time crunch in pairing/payoffs.  
     - **Solution:** Use quick methods (e.g., Google Form for choices; random number generator for pairing). Pre-calculate payoff examples.  

  ---

  ### **Limitation & Wrap-Up**  
  **What the game cannot replicate:**  
  - **Infinitely iterated rationality:** Students only see 2 rounds, but in theory, elimination can continue indefinitely. In wrap-up, explain: *"Real-world rationality has depths; we assume players eliminate ad infinitum."*  

  **Wrap-Up Script:**  
  > *"You hit a wall with pure strategies—D seemed playable until you used randomization to *prove* it’s unsafe. Then, by eliminating D, you exposed C. This is iterated strict dominance: a ladder of rationality we climb together. Next class, we formalize this—and you’ll see how it underpins rationalizability."*  

  **Materials:**  
  - **Handout** (1 page): Payoff matrix + rules.  
  - **Slips of paper** for choices + **hats** for pairing.  
  - **Candy/course points** for rewards.  

  This game forces students to invent mixed strategies to break deadlock, making the formal definition feel inevitable.
