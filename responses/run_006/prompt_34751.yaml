prompt: |-
  ok so i'm writing a paper on moral particularism for a grad seminar and i want to check whether my position actually hangs together before i commit to it in print. here's roughly where i've landed:

  (1) i'm a particularist in dancy's sense: there are no exceptionless moral principles, and the holism of reasons is true — a feature that counts in favour of an action in one context can count against it in another, or be irrelevant.

  (2) but i also think some features are pretty much always morally relevant in the same direction. like, causing suffering is almost always a reason against. this is just a contingent fact about the world, not a conceptual truth, but it's a very robust one.

  (3) i think moral knowledge works through something like moral perception — we can just see, in a particular situation, what matters and what we ought to do, without subsuming the case under a principle.

  (4) i also think reflective equilibrium is the right method in moral epistemology. you start with considered judgements about cases, then try to bring them into coherence with principles, background theories, etc., revising at any point.

  (5) i think that in practice we need codified rules — in medical ethics, in law, in institutional life — and these rules don't just summarise the underlying reasons; they have genuine normative force of their own.

  (6) i'm worried that particularism makes moral disagreement really hard to resolve. if there are no shared principles to appeal to, what do we do when two people with different moral sensibilities look at the same situation and see different things? this seems like a serious problem and i'm not sure the standard particularist replies work.

  so that's the set. what i want to know: which of these are actually in tension, which only look like they are, and how bad are the tensions? rank them by severity. and if there's a single revision that would clean up the most, tell me what it is and what it costs.

  (and please write in british english, my supervisor's a stickler for it.)
reasoning: |-
  Okay, the user is working on a paper about moral particularism for a grad seminar and wants to ensure their position is coherent. They've outlined six key points they're building their argument around. I need to carefully evaluate each point to identify tensions, rank them by severity, and suggest possible revisions.

  The user's position combines Jonathan Dancy's particularism with some nuanced additions. Point (1) is standard particularism: no exceptionless moral principles and holism of reasons. Point (2) introduces "defeasible generalism" - acknowledging that some features like causing suffering are almost always morally relevant in the same direction, though this is contingent rather than necessary. This seems consistent with particularism as long as they maintain it's not exceptionless.

  Point (3) about moral perception aligns well with particularism since it emphasizes case-by-case judgment without relying on principles. Point (4) on reflective equilibrium is also compatible, though there's potential tension here since particularists are skeptical about principles while reflective equilibrium uses them heuristically. The user seems aware of this and might handle it by treating principles as revisable summaries rather than absolute rules.

  Point (5) is where significant tension emerges. The user claims codified rules have "genuine normative force of their own" beyond summarizing reasons. This directly challenges particularism's core view that all normativity stems from particular reasons. Particularists like Dancy would see rules as purely derivative. The user needs to justify how rules gain independent authority without appealing to general principles they've rejected.

  Point (6) about moral disagreement is a well-known challenge for particularism. The user is right to be concerned - without shared principles, resolving disagreements relies heavily on moral perception, which can vary between individuals. This practical problem might require them to soften their particularism or develop a richer account of how moral perception can be cultivated and shared.

  Looking at tensions:
  - The strongest tension is between (1)/(2) and (5) regarding the normative force of rules. This is a fundamental conflict needing resolution.
  - Next is the tension between (1) and (6) about disagreement resolution - this is serious but perhaps manageable through their reflective equilibrium approach.
  - The potential tension between (3) and (4) is milder since both can coexist if principles are used heuristically in equilibrium.

  For revisions:
  - The most impactful change would be modifying point (5) to say rules derive their force from the reasons they summarize, not independently. This preserves particularism while acknowledging rules' practical importance.
  - If keeping independent normative force for rules, they'd need to develop a hybrid theory showing how particularism accommodates this - perhaps through institutional roles or rule-utilitarian elements, though this risks inconsistency.

  The user should also address how moral perception (3) can be reliable enough to handle disagreements (6), perhaps by linking it to reflective equilibrium (4) as a corrective process. Their treatment of "almost always" relevant features in (2) seems solid as a contingent claim that doesn't violate holism.

  The user writes in British English, so I'll ensure my response uses "judgements" instead of "judgments," "codified" instead of "codified," and other British spellings. They're clearly deep in the philosophical details but wisely seeking external validation before committing. I'll structure my feedback to first affirm compatibilities, then analyze tensions by severity, and finally offer targeted revision options with their trade-offs clearly stated.
answer: |-
  Right then, let's have a proper look at your position. It's a thoughtful synthesis, pulling together strands from Dancy, intuitionism, reflective equilibrium, and practical ethics. On the whole, it hangs together reasonably well as a *version* of particularism, but there are genuine tensions, primarily concerning the normative force of rules and the challenge of disagreement. Here's a breakdown of compatibilities and tensions, ranked by severity:

  **Broadly Compatible Elements:**

  *   **(1) Particularism (Holism) & (2) Defeasible General Tendencies:** These are entirely consistent. Dancy himself acknowledges that certain features (like pain) are *pro tanto* reasons in the vast majority of contexts due to their typical valence. Your point that this is contingent and robust, not conceptual or necessary, is spot-on for particularism. It doesn't undermine holism; it just notes a very strong empirical pattern. Call it "defeasible generalism" within particularism.
  *   **(1) Particularism & (3) Moral Perception:** This is a natural fit. Particularism often relies on a perceptual or intuitive model of moral judgement precisely because it rejects the need for subsumption under principles. Seeing what matters *here and now* is central.
  *   **(3) Moral Perception & (4) Reflective Equilibrium:** These can work in tandem. Moral perception provides the initial "considered judgements" (intuitions about cases) that feed into the process of reflective equilibrium. Reflective equilibrium then provides a framework for testing, refining, and justifying those perceptions against other judgements, principles (treated heuristically), and background theories. Perception gives the raw data; equilibrium provides the critical methodology.
  *   **(2) Defeasible Tendencies & (4) Reflective Equilibrium:** The observed robust tendencies can *emerge from* or be *supported by* the process of reflective equilibrium. Discovering that causing suffering *is* almost always a reason against is precisely the kind of generalisation reflective equilibrium might arrive at and justify, while acknowledging its defeasibility.
  *   **(1)/(2)/(3)/(4) & (5) Need for Codified Rules (Practical Necessity):** Particularists readily admit that for practical purposes (efficiency, coordination, institutional fairness, combating bias, ensuring minimum standards), codified rules are essential. This is a pragmatic concession, not a theoretical inconsistency. The tension arises not from the *need* for rules, but from your claim about their *normative force* (see below).

  **Tensions (Ranked by Severity):**

  1.  **Severe Tension: (1) Particularism vs. (5) Genuine Normative Force of Rules**
      *   **The Problem:** This is the most significant friction. Particularism, especially Dancy's version, is built on the idea that *all* genuine normativity resides in the particular reasons present in a situation. Rules are, at best, useful summaries, reminders, or practical shortcuts derived *from* those underlying reasons. They have no *independent* normative authority. If a rule genuinely conflicts with the salient reasons in a specific case, the particularist insists the *reasons* win. The rule is a mistake or needs revision.
      *   **Your Claim:** Saying rules have "genuine normative force of their own" suggests they create reasons *beyond* or even *against* the reasons present in the particulars. This sounds like rule-based normativity – the force comes from the rule *itself* being in place. This directly contradicts the particularist core (point 1) that normativity flows solely from the features of the specific situation.
      *   **Why Severe?** It fundamentally challenges the particularist ontology of reasons. If rules can generate reasons independently, then exceptionless (or strongly prescriptive) principles *do* exist at the level of practice, undermining the core particularist thesis. It risks collapsing into a form of rule-based generalism in practical domains.

  2.  **Significant Tension: (1)/(3) Particularism/Perception vs. (6) Moral Disagreement Resolution**
      *   **The Problem:** Your worry is well-founded. If moral knowledge is primarily perceptual and non-principled, and holism means reasons shift dramatically with context, resolving deep disagreements becomes extremely difficult. Appealing to shared principles is unavailable. The standard particularist replies – appeal to shared sensitivities cultivated through experience, analogy, detailed description of the case, or the process of reflective equilibrium itself – often seem inadequate against entrenched differences in perception ("moral vision"). How do you arbitrate when two people of seemingly equal sensitivity and knowledge "see" fundamentally different things in the *same* particulars?
      *   **Why Significant?** It's a major practical and epistemological challenge. While not a *logical* contradiction within the theory, it risks making moral discourse practically inert in hard cases and potentially undermines the claim to objectivity or rational resolvability that many moral realists (including some particularists) want to maintain. Your inclusion of (4) Reflective Equilibrium helps *somewhat* (it provides a structured process for dialogue), but the lack of shared principles as anchor points remains a weakness compared to generalist approaches.

  3.  **Potential/Mild Tension: (3) Moral Perception & (4) Reflective Equilibrium (Re: Principles)**
      *   **The Problem:** Reflective Equilibrium explicitly involves formulating and testing *principles*. Your strong particularism (point 1) and perceptual model (point 3) suggest these principles are deeply suspect and potentially distorting if taken as more than heuristic summaries. There's a risk that RE, by its nature, pulls you towards formulating principles that might then subtly bias future perception or be mistaken for having more authority than they do (echoing the tension with point 5).
      *   **Why Mild?** This is manageable. A sophisticated particularist can use RE while maintaining a deflationary view of principles. Principles generated in RE are understood as *always* defeasible, provisional summaries of patterns discerned through perception and judgement, useful for guiding attention and structuring thought, but possessing no independent normative weight. They are tools *within* the particularist epistemology, not foundations for it. Your commitment to revising "at any point" is key here. Just be explicit about the status of principles within your RE process.

  **Ranking by Severity:**

  1.  **Most Severe:** The tension between (1) Particularism and the claim of independent normative force for rules in (5).
  2.  **Significant:** The difficulty of resolving disagreement (6) within a framework of (1) Particularism and (3) Moral Perception.
  3.  **Mild/Manageable:** The potential friction between the principle-forming aspect of (4) Reflective Equilibrium and the anti-principle stance of (1) Particularism / (3) Moral Perception.

  **The Single Most Impactful Revision:**

  *   **Revision:** Modify **Point (5)**. Retreat from the claim that codified rules have "genuine normative force of their own." Instead, argue that they have **significant derivative practical authority**.
      *   **What it Costs:** You lose the strong claim about *sui generis* normative force. Rules become powerful, practically indispensable tools whose *authority* stems *entirely* from:
          1.  Their (imperfect) encapsulation of the underlying particular reasons relevant to the domain (e.g., promoting patient welfare, ensuring justice, preventing harm).
          2.  The crucial *practical functions* they serve: coordination, efficiency, reducing error under pressure or bias, ensuring predictability and fairness in institutions, embodying collective wisdom, establishing clear baselines. Disobeying a rule requires a *strong justification* based on the particular reasons *in this case* overriding these powerful practical considerations.
      *   **What it Gains:** It removes the severe tension with core particularism (point 1). Rules remain essential and carry significant weight, but that weight is explained *by* particularism (the underlying reasons they track and the practical reasons for having them) rather than contradicting it. It aligns better with the spirit of Dancy and avoids importing a source of normativity external to the particular situation.
      *   **How it Helps Elsewhere:** It slightly mitigates the disagreement problem (point 6). While shared principles aren't appealed to, shared *rules* (accepted for practical/functional reasons) can provide a common framework for discussion and a baseline, even if their application in edge cases is contested based on particulars. It also clarifies the mild tension with RE: principles/rules formulated are understood as aiming for this derivative practical authority and summarising function.

  **Conclusion:**

  Your position is largely coherent and represents a defensible, nuanced form of particularism, especially common among those working in applied ethics. The major stumbling block is the independent normative force of rules. Revising that to emphasise their derivative practical authority resolves the most severe tension while still capturing their vital, weighty role. The disagreement challenge remains serious but is inherent to particularism; leaning heavily on the structured dialogue and mutual correction potential of reflective equilibrium (point 4) is your best bet within the framework. Be explicit about the status of principles within your RE process as defeasible summaries. Good luck with the paper – it's a promising line of argument! Just mind that claim about rule-force.
