  ok so I keep seeing people argue about whether physicalism can handle consciousness, or whether we need panpsychism or idealism or whatever, and it feels like everyone's just cherry-picking the data points their view handles well. before I read another paper on this, I want the full spec: what would an adequate theory of consciousness actually have to deliver? write me the desiderata — the phenonema it has to explain, the cases it has to get right, the distinctions it can't collapse, the results from neuroscience and psychology it has to be consistent with — with the case or consideration behind each requirement. then flag which ones are non-negotiable (fail these and the theory is dead) and which are more like camp preferences. I especially want to know whether any pair of these requirements can't be jointly satisfied, because if so that's more interesting than another theory. if you want to do a quick scorecard for physicalism, panpsychism, and illusionism against the list that's fine but the criteria are the main thing.

  lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question. write in British English.
