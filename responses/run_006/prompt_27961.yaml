answer: |-
  An adequate theory of consciousness must fundamentally explain subjective experience while rigorously accounting for diverse empirical data and conceptual distinctions, facing potential incompatibilities between its core requirements.

  **Non-Negotiable Desiderata (Fail these, the theory is inadequate):**

  1.  **The Hard Problem (Subjective Experience):** *Explain why and how physical processes give rise to subjective, qualitative experience (qualia) – the "what it is like" aspect.* **Case:** The persistent intuition and argument (e.g., Jackson's Knowledge Argument, Nagel's Bat) that knowing all physical facts about colour processing doesn't tell you what experiencing *redness* is like. Failure to address this renders the theory incomplete.
  2.  **The Reality of Qualia:** *Account for the seemingly intrinsic, qualitative properties of conscious states (e.g., the redness of red, the painfulness of pain).* **Case:** The apparent ineffability and intrinsic nature of sensory experiences; arguments against reduction (e.g., the inverted spectrum thought experiment remains conceivable).
  3.  **Neural Correlates of Consciousness (NCC):** *Be consistent with, and explain, the empirical findings linking specific neural activity patterns to reported conscious states.* **Case:** Decades of neuroscience research (e.g., identifying NCCs in visual cortex, effects of anaesthetics, stimulation studies) showing reliable correlations between brain activity and consciousness. Ignoring this severs the theory from empirical reality.
  4.  **Intentionality (Aboutness):** *Explain how conscious states can be *about* things, possess meaning, or represent the world.* **Case:** The inherent directedness of conscious thoughts, perceptions, and beliefs (e.g., thinking *about* Paris, seeing *a tree*). A theory collapsing intentionality into non-representational states fails.
  5.  **Unity & Binding:** *Explain the integrated, unified nature of conscious experience at a single moment, binding disparate sensory inputs and thoughts into one coherent field.* **Case:** The seamless experience of a visual scene with colour, shape, motion, and sound integrated despite processing in separate brain areas; disruptions in syndromes like simultanagnosia.
  6.  **Subjective Report & Behaviour:** *Account for the link between subjective experience, first-person reports ("I see red"), and associated behaviour (e.g., pressing a button when seeing red).* **Case:** The foundational method of consciousness science relies on report; conditions like locked-in syndrome show preserved consciousness despite minimal behaviour. A theory severing report/behaviour from consciousness is empirically useless.
  7.  **Distinction: Conscious vs. Unconscious Processing:** *Preserve and explain the difference between processes that are phenomenally conscious and those that are not, despite both being supported by the brain.* **Case:** Empirical findings like blindsight (unconscious visual ability without conscious perception), masked priming, and subliminal perception demonstrate robust unconscious cognition distinct from conscious experience.
  8.  **Causal Efficacy:** *Explain how conscious states can be causally efficacious in the physical world (e.g., influencing decisions and actions), without violating physical causal closure.* **Case:** The intuition that our conscious deliberations cause our actions; epiphenomenalism (consciousness having no effect) seems counter-intuitive and potentially undermines the evolutionary rationale for consciousness. Physical closure is a core scientific principle.
  9.  **Altered States:** *Account for the radical changes in subjective experience across different states (e.g., wakefulness, dreaming, anaesthesia, psychedelic states) and their neural correlates.* **Case:** The profound phenomenological shifts in dreams or under anaesthesia, clearly linked to specific changes in brain function.

  **Highly Desirable / "Camp Preference" Desiderata:**

  10. **Structure of Experience:** *Explain the characteristic structure of consciousness (e.g., centre/periphery, temporal flow, perspectivalness).* **Case:** The phenomenological field has structure – we experience a focal point within a periphery, a continuous flow of time, and a first-person perspective. Explaining this structure adds depth.
  11. **The Self:** *Account for the sense of self or subjectivity inherent in experience (the feeling that experiences happen *to me*).* **Case:** The ubiquitous first-person perspective; disruptions in depersonalisation/derealisation. While crucial for a complete picture, some theories minimise or redefine the self.
  12. **Evolutionary Plausibility:** *Provide a plausible account of how consciousness could have evolved via natural selection.* **Case:** The biological cost of supporting the brain/NCCs demands an evolutionary rationale. While important for naturalism, it might be secondary to explaining the basic phenomenon.
  13. **Parsimony / Simplicity:** *Be as simple and ontologically economical as possible while satisfying the non-negotiables.* **Case:** Occam's Razor; adding fundamental entities (e.g., proto-consciousness in panpsychism) is a cost unless necessary. This is a virtue, not a strict requirement.
  14. **Formal Rigour / Testability:** *Ideally, be formally specifiable and generate testable predictions.* **Case:** Science progresses through testability (e.g., IIT makes specific predictions). Highly desirable for scientific traction, but nascent theories might lack this initially.

  **Key Incompatibilities / Tensions:**

  *   **Hard Problem + Causal Closure:** This is the core tension. If consciousness is non-physical (to solve the Hard Problem), how does it interact with the physical world without violating closure? Physicalism struggles with the Hard Problem; dualism struggles with closure.
  *   **Reality of Qualia + Parsimony / Structuralism:** If qualia are fundamental or intrinsic properties, this adds ontological complexity. Physicalist structural/functional accounts struggle to capture intrinsic qualia without illusionism/eliminativism.
  *   **Intrinsic Nature (Panpsychism) + Combination Problem:** Panpsychism attributes intrinsic nature to fundamental entities to address the Hard Problem, but faces the (potentially insurmountable) problem of how micro-consciousness combines into macro-consciousness.
  *   **Causal Efficacy + Epiphenomenalism Threat:** Any theory making consciousness fundamentally distinct (even property dualism) risks rendering it causally inert (epiphenomenal), conflicting with the need for causal efficacy and evolutionary plausibility.
  *   **Subjective Report + Illusionism:** Illusionism takes reports at face value as behaviour but denies the reality of the qualia reported. This directly conflicts with the "Reality of Qualia" desideratum for many.

  **Brief Scorecard:**

  *   **Physicalism (e.g., functionalism, identity theory):**
      *   **Strengths:** Excels at NCC, Intentionality, Unity, Report/Behaviour, Altered States, Unconscious/Conscious distinction, Causal Closure, Parsimony, Testability. Strong on empirical fit.
      *   **Weaknesses:** Profoundly struggles with the Hard Problem and Reality of Qualia (Explanatory Gap). Structure/Self might be handled functionally. Evolutionary plausibility often asserted but qualia's role is mysterious.
  *   **Panpsychism:**
      *   **Strengths:** Directly addresses the Hard Problem and Reality of Qualia by making experience fundamental. Compatible with Causal Closure (if micro-consciousness is physical). Explains intrinsic nature.
      *   **Weaknesses:** Faces the severe Combination Problem. Struggles with Unity, explaining complex macro-consciousness from simples. NCC/Report link is indirect. Parsimony poor. Testability currently low. Evolutionary role unclear.
  *   **Illusionism (e.g., Dennett, Frankish):**
      *   **Strengths:** Embraces Causal Closure, Parsimony, Testability fully. Explains Report/Behaviour flawlessly. Handles NCC, Intentionality, Unconscious/Conscious distinction well. Dissolves the Hard Problem by denying qualia's reality.
      *   **Weaknesses:** Fundamentally denies the core non-negotiable "Reality of Qualia" and arguably fails the "Hard Problem" by eliminating it rather than solving it. Radically counter-intuitive. Struggles to explain the *seeming* reality of qualia convincingly.
