prompt: |-
  I'm an infra engineer, not a philosopher, so go easy on the jargon. I've been thinking about how my team decides what 'caused' an outage. The drill: something breaks, we roll back the most recent deploy, and if the bug goes away, the postmortem says the deploy caused the outage. Done. We never say the outage was caused by the server being on, or by the network existing, or by the deploy pipeline running, even though all of those were also true and, in some but-for sense, necessary. Meanwhile our experiments team does A/B tests: flip a feature flag, watch the metric, and if it moves they say the flag caused the movement. I get that in practice you need to blame something actionable, but Im curious what picture of causation these practices commit us to. Are we implicitly saying causes are the things you can actually intervene on, so that establishing causation just is flipping a switch and watching what changes? Or is the rollback just a cheap way of checking a counterfactual ('if this deploy hadn't shipped, the bug wouldnt have happened'), in which case the background stuff should count as causes too and our postmortems are being inconsistent? Do the incident practice and the A/B testing practice presuppose the same theory or different ones? And if we actually had to swap the underlying theory, what would the postmortem template have to change?
reasoning: |-
  Okay, let me unpack this infra engineer's question. They're noticing a practical disconnect in how their team assigns causality during outages versus how their experiments team does it with A/B tests. On the surface, both seem to use similar "flip and observe" methods—rollbacks for deploys, feature flags for metrics. But the engineer senses something philosophically fishy about only blaming the deploy while ignoring necessary background conditions like servers running. 

  Hmm, they're really asking two layered questions here: First, what implicit theories of causation are baked into these work practices? Second, are these theories consistent across incidents and A/B testing? That's sharper than most operational gripes—this person thinks structurally. 

  Let me mentally walk through their examples. When they say "we don't blame the server being on," it highlights how human pragmatism filters causality. Of course the server is necessary, but pointing to it fixes nothing. Reminds me of David Lewis's counterfactual theory—we focus on the closest possible world where the cause didn't happen. In that world, the server still runs, but the deploy doesn't ship. 

  But then A/B testing feels different. When experiments team says "feature flag caused metric movement," they're likely relying on Rubin's potential outcomes framework—holding everything else equal, the flag flip isolates the effect. That's more about correlation with intervention than counterfactuals. 

  Wait—is the core tension between but-for necessity and sufficiency? The deploy is sufficient to break things (flipping it fixes the issue), while the server is merely necessary. And sufficiency is what matters for actionability. 

  The engineer's "cheap counterfactual" intuition is spot-on. Rollbacks test a minimal rewrite of history. But if we demanded completeness, postmortems would drown in existential dread ("the outage was caused by the Big Bang..."). 

  Practically speaking, if they adopted a different theory—say, formal causal graphs—what changes? Postmortems might map prerequisite dependencies (network, pipeline) and flag deploy as the proximate trigger. But that feels like overkill for most outages. Maybe just adding a "contributing conditions" section would bridge the gap without losing focus. 

  ...I should emphasize that both practices are valid because they serve different purposes: blameless fixes vs. measurement rigor. The inconsistency isn't a bug; it's a feature of context. Though nudging them to document environmental assumptions could prevent future "but it worked in staging" facepalms.
answer: |-
  Your instincts are spot-on—this is a profound practical question about operational causality, and you've nailed the core tension. Let's break it down without philosophy jargon:

  ### 1. **Your Outage Practice: "Rollback as Cause"**
     - **What You're Doing:** You're using a **minimal sufficient intervention test**. By rolling back the deploy and observing recovery, you identify the deploy as the **proximate sufficient cause**—the smallest actionable change that, when reversed, resolves the issue.
     - **Why Background Conditions Don't Count**: 
       - Servers/networks/pipelines are **necessary but insufficient conditions**. They're always present ("standing conditions"), so they don't *explain* the change. If your server being "on" caused the outage, it would break constantly.
       - Causality in ops is about **actionable specificity**. Saying "the network existing caused the outage" is like saying "oxygen caused the fire"—true but useless. What mattered was the *spark* (the deploy).
     - **Counterfactual Check**: Yes, the rollback tests a counterfactual: *"If this deploy hadn't shipped, would the outage have occurred?"* But crucially, **you only modify one variable** (the deploy) while holding standing conditions constant. That’s pragmatism, not inconsistency.

  ### 2. **A/B Testing: "Flag Flip as Cause"**
     - **What They're Doing:** Experiments isolate variables via **controlled intervention**. Flipping the flag while holding other factors constant tests: *"Does this variable *sufficiently* drive the observed change?"*
     - **Shared Logic with Rollbacks**: Both practices rely on **difference-making**: 
       - *Ops*: "Removing X fixed Y → X caused Y."
       - *Experiments*: "Adding X changed Y → X caused Y."
     - **Key Difference**: A/B tests aim for *scientific attribution* (quantifying impact), while rollbacks aim for *operational recovery* (fast mitigation). But both assume **isolatability**—you can change one thing without destabilizing the system.

  ### 3. **The Shared Theory: Interventional Causality**
     - Both practices commit to a **manipulationist theory of causation**: 
       > *"X causes Y if, by changing X while holding other things equal, we can change Y."*
     - **Why It Works**: 
       - It ignores non-actionable "but-for" factors (like the universe existing). 
       - It focuses on **levers you control**. 
       - It’s inherently **counterfactual-lite**—you test *one* plausible alternative world (no deploy/flag flipped).

  ### 4. **The Inconsistency You Sense**
     - It’s not theoretical—it’s **scoping**. Ops postmortems prioritize:
       - **Proximity**: The deploy was the *closest* event to the failure.
       - **Actionability**: You can revert deploys; you can’t "revert" the network existing.
     - But if standing conditions *were* abnormal (e.g., a network flap *interacted* with the deploy), they *should* be in the postmortem! Your practice *assumes* standing conditions are stable—which is usually safe, but sometimes a trap.

  ### 5. **What Would Change Under a Different Theory?**
     - **If you adopted "but-for" causation** (all necessary conditions are causes):
       - Postmortems would be cluttered: *"Causes: Deploy (proximate), AWS us-east-1 (necessary), TCP/IP (necessary), $EMPLOYEE writing the code (necessary)..."* → Unactionable noise.
     - **If you used formal causal graphs** (e.g., Pearl-style):
       - You’d map dependencies: "Deploy → Bug ← Load Balancer Config".
       - Postmortems would include **contributing factors** (e.g., "Smoke testing didn’t cover LB edge case").
       - **Template Change**: Add sections like:
         - *"Necessary Conditions Present"* (e.g., "Service was running in production").
         - *"Contributing Factors"* (e.g., "Monitoring didn’t alert on latency spike").
         - *"Proximate Trigger"* (the deploy).

  ### Practical Recommendations
  1. **Keep your rollback heuristic**—it’s fast and correct 95% of the time.
  2. **Augment postmortems subtly**:
     - Add a checkbox: *"Were standing conditions nominal? (Y/N)"* If "No", investigate (e.g., "Deploy exposed latent race condition during DNS update").
     - Include **interaction causes**: *"The deploy triggered a failure because ______ was unstable."*
  3. **Harmonize with Experiments Team**: 
     - Borrow their **"hold other things equal" rigor** for complex outages. Test hypotheses: *"If we revert the deploy AND keep the load balancer config, does it recover?"*
     - Use feature flags for **safer rollbacks**—this bridges both practices.

  ### Bottom Line
  Your team isn’t being inconsistent—you’re practicing **causal triage**. Standing conditions are the *floor*; the deploy is the *spill*. A/B tests and rollbacks share the same core principle: **causation is revealed by intervention**. The only "flaw" is when standing conditions aren’t actually standing—so document assumptions, not just triggers.
