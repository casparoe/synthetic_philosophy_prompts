  ### The Handicap Principle Signaling Game

  **Title:** The Cost of Honesty  

  **Materials:**  
  - 16 index cards (8 labeled "Signaler", 8 labeled "Receiver")  
  - 16 quality cards (8 green "High Quality", 8 red "Low Quality")  
  - 32 choice slips (16 for signals: "High" or "Low"; 16 for responses: "Accept" or "Reject")  
  - Whiteboard to track payoffs and aggregate results  
  - Pens for students  

  **Setup (5 minutes):**  
  1. Divide students into pairs (8 pairs total). Randomly assign one student in each pair as "Signaler," the other as "Receiver."  
  2. Give each signaler a *hidden* quality card: 4 receive "High Quality," 4 "Low Quality" (randomly assigned each round).  
  3. Explain base payoffs:  
     - **Signaler goal:** Get accepted. Accepted = 10 points. Rejected = 0 points.  
     - **Receiver goal:** Accept High, reject Low. Accept High = +10 points. Accept Low = -10 points. Reject any = 0 points.  
  4. Announce cost rules **only for the current round** (see below). Costs subtract from signaler’s payoff *after* acceptance/rejection.  

  **Rules for Each Round (15 minutes total; 5 minutes per round):**  
  - **Round 1: Cheap Talk**  
    - **Cost rule:** Sending any signal costs 0 points.  
    - **Play:**  
      - Signalers see their quality and choose a signal: "High" or "Low" (write on slip).  
      - Receivers see the signal (not quality) and choose: "Accept" or "Reject" (write on slip).  
      - Instructor collects slips, reveals outcomes, and calculates payoffs.  

  - **Round 2: Uniform Cost**  
    - **Cost rule:** Sending "High" costs 5 points (all signalers, any quality). Sending "Low" costs 0.  
    - **Play:** Same as Round 1. Reassign roles and qualities (mix pairs).  

  - **Round 3: Differential Cost**  
    - **Cost rule:**  
      - High-quality signalers: Sending "High" costs 2 points.  
      - Low-quality signalers: Sending "High" costs 12 points.  
      - Sending "Low" costs 0 (all).  
    - **Play:** Same as Round 1. Reassign roles and qualities.  

  **Timeline:**  
  - **Minutes 0-5:** Setup and rules.  
  - **Minutes 5-10:** Round 1.  
  - **Minutes 10-15:** Round 2.  
  - **Minutes 15-20:** Round 3.  
  - **Minutes 20-75:** Debrief (see below).  

  **Payoff Calculation (Per Pair):**  
  - **Signaler payoff:**  
    - Accepted: (10 - signal cost)  
    - Rejected: (0 - signal cost)  
  - **Receiver payoff:**  
    - Accept High: +10  
    - Accept Low: -10  
    - Reject: 0  

  **Tracking Results:**  
  - Record on whiteboard after each round:  
    - % of High-quality signalers sending "High."  
    - % of Low-quality signalers sending "High."  
    - % of "High" signals accepted by receivers.  
    - % of "Low" signals accepted by receivers.  

  ---

  ### Debrief (55 minutes)  
  **Map Game Outcomes to Concepts:**  
  1. **Round 1 (Cheap Talk):**  
     - **Observed behavior:** Low-quality signalers often send "High" (free bluff). Receivers distrust signals, rejecting most "High" signals.  
     - **Concepts:**  
       - *Divergence of interests:* Signalers want acceptance regardless of quality; receivers want truth.  
       - *Pooling equilibrium:* All send "High," so signal carries no information. Receivers ignore it (reject) → mutual loss.  
       - **Takeaway:** Without costs, deception is rampant. Signals are ignored.  

  2. **Round 2 (Uniform Cost):**  
     - **Observed behavior:** Low-quality signalers still send "High" (cost is affordable if accepted). Receivers remain distrustful (reject "High" signals).  
     - **Concepts:**  
       - *Mere costliness ≠ honesty:* Uniform cost taxes everyone equally. Low-quality can still afford bluffing (5-point cost vs. 10-point gain if accepted).  
       - *Pooling persists:* Signals remain uninformative. Receivers reject "High" to avoid -10 payoff, hurting honest high-quality signalers.  
       - **Takeaway:** Fixed costs raise the stakes but don’t enable separation. Low-quality "invade" the "High" signal.  

  3. **Round 3 (Differential Cost):**  
     - **Observed behavior:** High-quality send "High" (low cost = net +8 if accepted). Low-quality send "Low" (high cost = net -2 even if accepted). Receivers trust "High" (accept), reject "Low."  
     - **Concepts:**  
       - *Handicap principle:* Costs scale with quality. Low-quality *cannot afford* the "High" signal (12 > 10), so they reveal themselves.  
       - *Separating equilibrium:* Signals match truth ("High" = high-quality, "Low" = low-quality). Receivers trust and profit.  
       - *Differential cost enables honesty:* High-quality gain more from signaling (8 vs. 0 for silence), while low-quality lose by bluffing.  

  **Key Distinctions:**  
  - **Index vs. Handicap Signals:**  
    - *Index:* Physically tied to quality (e.g., antler size fixed by nutrition). *This game does NOT model indexes* (no physical constraint).  
    - *Handicap:* Honest because low-quality pay higher *relative* costs. *This game captures handicaps* via differential costs.  
  - **Why Costs Must Be Differential:**  
    Uniform costs are "paid by all" and don’t punish bluffers disproportionately. Only when costs *hurt low-quality more* (e.g., 12 vs. 2) do signals become honest.  

  **Core Lesson:**  
  Honesty in signaling requires **differential costs** (handicap principle), not just expense. Cheap talk and uniform costs collapse into deception; differential costs force truth-telling by making bluffing unprofitable for low-quality actors.  

  ---

  ### Predictable Failures & How to Handle Them  
  1. **Collusion (e.g., signalers always send "High," receivers always accept):**  
     - **Why:** Students may "cooperate" to maximize group points.  
     - **Fix:** Emphasize self-interest. Say: *"You are evolving genes, not friends. Your payoff is individual. If you collude, you’ll miss the key insight."*  
     - **Leverage:** In Round 3, show colluders that low-quality lose points by bluffing.  

  2. **Receivers Trust Against Incentives (e.g., accept "High" in Rounds 1/2):**  
     - **Why:** Optimism or misreading payoffs.  
     - **Fix:** Publicize that 50% of signalers are low-quality. Calculate expected payoff: Accepting "High" in Round 1/2 averages (0.5×10 + 0.5×-10) = 0, while rejecting = 0. *"Why risk -10?"*  

  3. **"Any Costly Display = Honest":**  
     - **Why:** Misinterpreting Round 2 (uniform cost) as sufficient.  
     - **Fix:** Contrast Round 2 and 3 results:  
       - Round 2: Low-quality still bluff. Receivers reject → high-quality punished.  
       - Round 3: Low-quality *stop bluffing* → receivers trust.  
       - **Ask:** *"Why did mere expense fail? What changed in Round 3?"*  

  4. **Differential Cost Feels "Rigged":**  
     - **Why:** Students may resent the 12-point cost as arbitrary.  
     - **Fix:** Explain: *"In nature, costs are condition-dependent. A sick peacock can’t grow long feathers without starving. The cost isn’t arbitrary; it’s tied to real limitations."*  

  **What the Game CANNOT Reproduce:**  
  - **Evolutionary Dynamics:** Real signals evolve over generations. Receivers coevolve (e.g., skepticism increases if bluffed). This game is one-shot rational choice.  
    - *Acknowledge:* *"In life, this is a slow dance of mutation and selection. Today, we compressed it into rational decisions."*  
  - **Non-Rational Actors:** Animals don’t "calculate" but inherit strategies.  
  - **Continuous Quality:** Qualities are binary here; in nature, they’re often a spectrum.  

  **Final Tip:** Run the game fast. Focus debrief on contrasts:  
  - *"Why did Round 1 and 2 fail? What changed in Round 3? How did your behavior shift when costs became differential?"*  
  Use whiteboard data to show the spike in honesty/separation in Round 3.
