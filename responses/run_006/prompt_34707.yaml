  The quiz should present scenarios where respondents choose whether an external resource is (a) part of cognitive process, (b) mere tool, or (c) in between. I need to include specific cases: Otto's notebook, smartphone use, skilled tool use (like a blind person's cane), collaborative thinking, brain-computer interface, external reasoning aids, and a novice tool user. 

  For the Otto case, I'll describe an Alzheimer's patient relying on a notebook for memory - this tests the classic parity principle. The smartphone scenario will cover navigation, scheduling and fact retrieval to probe integration versus tool use. For embodied cognition, I'll use a blind person's cane where sensory feedback creates a sensorimotor loop - this should distinguish between bodily extension and artifact extension.

  The collaborative thinking case will involve a couple finishing each other's sentences to test social extension versus individual cognition. The brain-computer interface scenario needs to challenge simple intracranialism by blurring the skull boundary. The whiteboard case will show problem-solving where external marks are essential - this often feels like cognitive extension even to skeptics. And for novice tool use, I'll describe someone fumbling with new tech to test the "trust and glue" conditions.

  I'll add two more scenarios: one about fluent calculator use to probe automaticity, and another about group problem-solving to distinguish social extension from full distribution. Each question will be vivid and accessible without technical jargon.

  For scoring, I'll map answer patterns to positions. Key diagnostics: intracranialists should consistently choose (b); embodied cognition will accept cane/body but reject artifacts; parity-based extension will accept Otto, smartphone and whiteboard if functionally equivalent; integration-based will reject novice cases but accept fluent ones; social extension will accept the couple; distributed cognition will consistently choose (a) for group cases and see systems over individuals.

  I'll note where positions might overlap or where combinations don't match existing theories - for example, someone accepting social extension but rejecting artifacts might be an unexplored position. The scoring key will be transparent about ambiguities rather than forcing categories.
answer: |-
  ## The "Where Does Your Mind End?" Diagnostic Quiz

  **Instructions:** For each scenario, imagine yourself in the situation described. Consider the external resource mentioned in **bold**. Is it best described as:

  *   **(a) Part of the person's/persons' cognitive process itself?**
  *   **(b) A mere tool feeding information into a cognitive process happening entirely inside the individual's head(s)?**
  *   **(c) Something in between – not *just* a tool, but not cleanly part of the cognitive process either?**

  Choose the option that feels most accurate to your intuition. There are no trick questions; go with your gut feeling.

  ---

  **Scenario 1: Otto's Notebook**
  Otto has early-stage Alzheimer's disease and struggles to form new long-term memories. He relies heavily on a small notebook he always carries. When he learns a new fact (like the address of the museum), he immediately writes it down. When he needs that information later (like navigating to the museum), he consults the notebook without question, trusting it implicitly. The notebook is his sole reliable way to recall such new information.
  **The notebook** is best described as:
  (a) Part of Otto's cognitive process
  (b) A mere tool for Otto
  (c) Something in between

  **Scenario 2: Smartphone Savvy**
  You are trying to get across town to a meeting. You pull out your smartphone. You open your calendar app to confirm the address and time, then switch to a maps app for turn-by-turn navigation. While walking, you wonder about the presenter and quickly search their name, getting a brief bio. You use these apps fluidly, without consciously thinking about *how* to use them; they feel like a seamless part of your planning and navigation.
  **Your smartphone (running these specific apps)** is best described as:
  (a) Part of your cognitive process
  (b) A mere tool for you
  (c) Something in between

  **Scenario 3: The Blind Walker's Cane**
  Sarah, who is blind, navigates her neighborhood using her white cane. She doesn't consciously think about each tap and sweep. Instead, the vibrations and resistance from the cane flowing through her hand and arm provide a continuous, direct stream of information about the texture of the ground, the location of curbs, obstacles, and open doorways. She experiences the world *at the tip of the cane*, not at her hand.
  **The cane** is best described as:
  (a) Part of Sarah's cognitive process
  (b) A mere tool for Sarah
  (c) Something in between

  **Scenario 4: The Thinking Couple**
  Alex and Jamie have been partners for 15 years. When tackling complex problems like planning a major trip or resolving a tricky family issue, they have a well-established rhythm. One starts a sentence, the other finishes it seamlessly. They build ideas directly on each other's fragments, often realizing what the other meant before they've fully articulated it. They jointly "see" solutions on the whiteboard that neither would have arrived at alone. When working this way, they feel like a single thinking unit.
  **The partner (e.g., Jamie acting in this collaborative mode)** is best described as:
  (a) Part of Alex's cognitive process (and vice versa)
  (b) A mere source of input for Alex (and vice versa)
  (c) Something in between

  **Scenario 5: The Neural Implant Translator**
  David has a severe communication disorder. He has a neural implant that detects specific patterns of brain activity associated with his *intention* to speak. This implant wirelessly connects to a small wearable computer. When David mentally formulates a sentence he wants to say, the implant detects this pattern and the computer generates the corresponding speech output through a speaker almost instantly. David experiences this as "just thinking his words out loud."
  **The implant+wearable computer system** is best described as:
  (a) Part of David's cognitive process
  (b) A mere tool for David
  (c) Something in between

  **Scenario 6: Reasoning on the Whiteboard**
  You are trying to solve a complex logic puzzle. You pick up a marker and start sketching possibilities on a large whiteboard. You draw boxes, arrows, write labels, cross things out, draw connections. You point at different parts, muttering "if this... then that...". You frequently step back, looking at the evolving diagram, and new insights pop into your head *because* of the spatial arrangement you've created externally. The marks feel essential to your reasoning.
  **The evolving marks/diagram on the whiteboard** is best described as:
  (a) Part of your cognitive process
  (b) A mere tool for you
  (c) Something in between

  **Scenario 7: The Clunky New Calculator**
  Maria is learning advanced statistics. She's been given a powerful but complex programmable calculator for her course. She hasn't fully mastered it yet. She constantly needs to check the manual to remember which sequence of obscure buttons to press for each specific test. She inputs data carefully, double-checking each entry, and views the output on the screen with some suspicion, always mentally verifying it against her rough expectations. It feels cumbersome.
  **The calculator (as Maria is currently using it)** is best described as:
  (a) Part of Maria's cognitive process
  (b) A mere tool for Maria
  (c) Something in between

  **Scenario 8: Fluent Calculator Use**
  Now imagine Maria, 6 months later. She uses the same calculator constantly and has mastered its functions. She inputs data and selects statistical tests fluidly, without conscious thought about the button sequences. She trusts the outputs implicitly for calculations too complex for mental math, using them directly in her reasoning and report writing. The calculator feels like a natural extension of her mathematical ability.
  **The calculator (as Maria fluently uses it now)** is best described as:
  (a) Part of Maria's cognitive process
  (b) A mere tool for Maria
  (c) Something in between

  **Scenario 9: The Cockpit Crew**
  A commercial airliner is preparing for takeoff. The Pilot, Co-Pilot, and Flight Engineer are each responsible for specific checks and procedures outlined in detailed checklists. They call out steps sequentially ("Flaps set?" "Flaps set, 15 degrees." "Confirmed."), monitor different instruments, and cross-verify each other's actions. Information flows rapidly between them and the aircraft's automated systems. A complex, accurate model of the aircraft's state emerges *only* through this coordinated interaction. No single person has the complete picture internally at all times.
  **The other crew members and the checklists/instruments (as part of the system)** are best described as:
  (a) Part of the *individual* Pilot's cognitive process
  (b) Mere tools/sources of input for the individual Pilot
  (c) Something in between OR (d) The *system* (crew + aircraft) is the cognitive unit, not the individuals alone. *(Note: Choose (a), (b), (c) as before, OR (d) if that feels more accurate)*

  ---

  ## Scoring Key & Interpretation

  **How it works:** This quiz diagnoses your intuitive commitments about the boundaries of cognition by seeing *where* and *under what conditions* you see external resources becoming constitutive parts of thinking, rather than mere inputs/outputs. Your pattern of answers reveals which theoretical position your pre-theoretical judgments align with most closely.

  **Diagnostic Answers & Positions:**

  1.  **Intracranialism:** Consistently chooses **(b)** across *all* scenarios. The mind is entirely skull-bound; externals are just inputs, outputs, or tools. *Diagnostic:* (b) for Otto's Notebook (7), Whiteboard (6), Fluent Calculator (8), and especially Neural Implant (5). Rejects extension even when integration seems deep.
  2.  **Embodied Cognition:** Chooses **(a)** for **Scenario 3 (Cane)** but consistently **(b)** or sometimes **(c)** for artifacts like Notebooks (1), Smartphones (2), Whiteboards (6), or Calculators (7/8). Accepts the *body* (sensorimotor loops involving tools like canes) as cognitive, but draws the line at non-biological artifacts or other people. *Diagnostic:* (a) for Cane (3) + (b) for Otto (1), Smartphone (2), Whiteboard (6). Neural Implant (5) is a challenge; likely (b) or (c).
  3.  **Extended Cognition (Parity-Based):** Chooses **(a)** for resources that *functionally replace* internal processes, regardless of physical location, especially if you'd accept an internal equivalent. *Diagnostic:* (a) for Otto (1), Fluent Calculator (8), and likely Whiteboard (6) & Neural Implant (5). May be less likely to choose (a) for Smartphone (2 - feels multi-functional/messy) or Social (4). Should choose (b) for Clunky Calculator (7) & possibly Novice Cane use (not included, but implied contrast).
  4.  **Extended Mind (Integration-Based):** Focuses on *trust, glue, and fluency*. Chooses **(a)** only when the resource is reliably available, automatically endorsed/trusted, and fluently accessed. *Diagnostic:* Contrasts **Scenario 7 (Clunky Calc - likely b/c)** with **Scenario 8 (Fluent Calc - likely a)**. Also likely (a) for Otto (1 - trust/glue) and Fluent Smartphone (2). May be less sure about Whiteboard (6 - transient?) or Neural Implant (5 - deep integration). Rejects (a) if glue is missing, even if parity exists.
  5.  **Socially Extended Cognition:** Chooses **(a)** specifically for **Scenario 4 (Thinking Couple)**. Sees close collaborative partners as genuine *parts* of an individual's cognitive system. May also choose (a) for Otto (1) or other artifacts, but the *social* extension is key. *Diagnostic:* (a) for Thinking Couple (4) + likely (a) or (c) for other artifacts. Different from Distributed by focusing on the *individual* mind extending socially.
  6.  **Distributed Cognition:** Chooses **(d)** in **Scenario 9 (Cockpit Crew)** or consistently interprets other collaborative/system scenarios as systems-level cognition. Sees cognition as fundamentally distributed across individuals and artifacts; the *system* is the primary unit, not the person. *Diagnostic:* (d) in Scenario 9. Likely (a) or (c) for artifacts like Whiteboard (6), Fluent Calculator (8), but framed as part of a system. May find individual-focused questions like Otto (1) or Smartphone (2) slightly awkward. Strongly rejects pure Intracranialism.

  **Mapping Your Answers:**

  *   **Mostly (b) across the board:** Strong alignment with **Intracranialism**.
  *   **(a) on Cane (3), but mostly (b) on Artifacts (1,2,6,7,8) & People (4,9):** Alignment with **Embodied Cognition**.
  *   **(a) on Otto (1), Fluent Calc (8), Neural Implant (5), Whiteboard (6); (b) on Clunky Calc (7); mixed on Social (4) & Cockpit (9):** Alignment with **Extended Cognition (Parity-Based)**.
  *   **(a) on Otto (1), Fluent Calc (8), Fluent Smartphone (2); (b) or (c) on Clunky Calc (7); (c) or (b) on Whiteboard (6 - maybe transient) or Neural Implant (5 - maybe too integrated?); mixed on Social (4):** Alignment with **Extended Mind (Integration-Based)**. The key is the *fluency/trust* distinction (7 vs 8).
  *   **(a) on Thinking Couple (4); likely also (a) or (c) on some artifacts like Otto (1) or Whiteboard (6); (b) or (c) on Cane (3) or Cockpit (9) if seen as non-social systems:** Alignment with **Socially Extended Cognition**.
  *   **(d) on Cockpit (9); likely (a) or (c) on Whiteboard (6), Fluent Calc (8) *as system components*; possibly (c) or mixed on individual cases like Otto (1) or Smartphone (2) seen in isolation; likely (a) or (d) on Thinking Couple (4) as a small system:** Alignment with **Distributed Cognition**.

  **Ambiguities and Uncharted Territory:**

  *   **Scenario 5 (Neural Implant):** This is a major test. Intracranialists *must* say (b) or (c). Embodied Cognition might lean (b) or (c). Parity-Based and Integration-Based likely say (a). It sharply divides Intracranialism from extension views.
  *   **Scenario 6 (Whiteboard):** Often a point of agreement between Parity/Integration views (a) and even some moderates (c). Intracranialists (b) and strict Embodied (b) are clear outliers. Distributed views see it as part of a system.
  *   **Scenario 9 (Cockpit):** Choosing (a), (b), or (c) here pulls towards seeing the *individual* as the unit. Choosing (d) is strongly diagnostic for Distributed Cognition. Social Extension might choose (a) for crewmates, but (d) captures the system focus better.
  *   **Mixed Artefact & Social, Rejecting Embodiment:** If you consistently choose (a) for artifacts (Otto, Fluent Calc, Whiteboard) *and* for the Thinking Couple (4), but choose (b) for the Cane (3), this doesn't cleanly fit the standard positions. Embodied Cognition accepts the cane but rejects artifacts. Your view might prioritize functional role/integration *over* bodily incorporation, potentially a variant of Extended Cognition/Mind that rejects the special status of the biological body. This position exists but is less commonly emphasized.
  *   **Social Extension without Artefact Extension:** Choosing (a) for Thinking Couple (4) but consistently (b) for artifacts (Otto, Smartphone, Calculator) suggests you believe minds can extend socially but not into objects. This is a defensible but less common position (e.g., some interpretations of "second-person" cognition). It might align with certain enactivist or phenomenological views that prioritize social interaction over tool use.
  *   **Mostly (c) ("In Between"):** This suggests a moderate or conservative view, perhaps leaning towards Intracranialism or Embodied Cognition but acknowledging the complexity and interdependence. You might be sympathetic to "embedded cognition" or "scaffolded cognition" views where externals are crucial but not constitutive parts of the cognitive process itself.

  **What the Quiz Might Not Perfectly Separate:**

  *   **Parity vs. Integration:** Scenarios 1 (Otto - has glue), 7 (Clunky Calc - lacks glue), and 8 (Fluent Calc - has glue) are key. If you give the same answer for Otto and the Fluent Calc (likely a), and a different one for Clunky (b/c), you align with Integration. If you give the *same* answer for Otto and Clunky Calc (e.g., both a based purely on functional role, ignoring fluency), you align more strongly with Parity. The Whiteboard (6) is less diagnostic here.
  *   **Social Extension vs. Distributed Cognition:** Scenario 4 (Couple) vs. Scenario 9 (Cockpit) is crucial. Choosing (a) for the couple but (b)/(c) or even (d) for the cockpit leans Social Extension (focus on individual mind extending to close others). Choosing (a) for the couple *and* (d) for the cockpit, or seeing the couple itself as a small distributed system, leans Distributed. The Thinking Couple scenario is designed to be intimate enough to tempt Social Extension, while the Cockpit is clearly systemic.
  *   **Strong Embodied vs. Conservative Integration:** Both might say (a) for the Cane (3) and (b) for the Clunky Calc (7). The distinction comes on Fluent Calc (8) or Otto (1): Embodied Cognition says (b), Integration says (a). Similarly, Whiteboard (6): Embodied likely (b), Integration likely (a) or (c).

  **Using the Results:** This quiz provides a snapshot of your *intuitive commitments* about cognitive boundaries. Discussing *why* you answered as you did, especially where your answers diverge from others or create tensions within a position, is where the rich philosophical debate begins! Enjoy your reading group discussion!
