answer: |-
  Your objection is astute and Foucault himself grappled with it, notably in interviews like "Truth and Power." The core defense hinges on rejecting the premise that knowledge serving power equates to being *merely* an effect without critical purchase. Foucault isn't claiming all discourses are *equally* arbitrary or that genealogy offers transcendent Truth. Rather, he insists that *all* knowledge, including his own, is historically situated and enmeshed in power relations. The difference lies in its *function* and *target*.

  Genealogy is a *counter-knowledge*. It doesn't claim an Archimedean point outside power but operates strategically *within* the field. Its value isn't derived from being "pure" but from its capacity to expose the contingency and specific mechanisms of dominant truth-regimes it analyzes. When Foucault dissects the Panopticon or the "repressive hypothesis," he uses meticulous archival work not to reveal an eternal truth, but to destabilize *taken-for-granted* truths (e.g., the inherent benevolence of modern punishment or the naturalness of sexual repression). His discourse is indeed a "move in a power game" – but its power resides precisely in contesting the naturalized foundations of other power/knowledge regimes. It's a weapon aimed at the *politics of truth* itself.

  The epistemic status? Genealogy produces *historically situated truth-effects* that are *effective* because they demonstrate the apparatuses constructing what we accept as true. It gains force through its empirical density and its ability to make visible what dominant discourses obscure. Foucault concedes his work is partial and perspectival ("I am an experimenter, not a theorist"), but its validity stems from its capacity to render problematic what was assumed solid, opening spaces for resistance. His reflexivity wasn't perfect, but the core thesis holds: recognizing power/knowledge entanglement doesn't doom critique; it reorients critique toward exposing the *how* of truth production.

