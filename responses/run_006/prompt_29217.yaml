answer: |-
  **What's Your Hidden Theory of Pleasure?**  
  *Discover which philosophical lens shapes your diary entries*

  1.  **When a headache finally fades, that relief feels like...**  
      A) A distinct, positive sensation washing over me.  
      B) Simply the absence of the pain – nothing added, just subtraction.  
      C) My brain signaling "this is good, avoid headaches in the future."  
      D) Something unique to relief – not like other pleasures.

  2.  **The deep satisfaction after finally solving a tricky problem (like a spreadsheet formula) is mainly...**  
      A) A warm, fulfilling feeling inside.  
      B) My positive attitude toward the solved state.  
      C) What keeps me hooked on puzzle-solving.  
      D) Just its own kind of satisfaction – different from eating cake.

  3.  **That first perfect sip of coffee in the morning provides pleasure primarily through...**  
      A) Its delicious sensory taste/smell/warmth.  
      B) My enjoyment of the experience in that moment.  
      C) Reinforcing my morning coffee habit.  
      D) A combination unique to coffee – not reducible to one thing.

  4.  **When you listen to a sad song that beautifully evokes missing your ex, the pleasure (if any) comes from...**  
      A) A bittersweet emotional sensation that feels good despite the sadness.  
      B) Appreciating the artistry or the catharsis, not a specific feeling.  
      C) The song fulfilling a need to process emotion, making you replay it.  
      D) The complex mix itself – the sadness isn't separate from the pleasure.

  5.  **Eating a delicious dessert when you're already full...**  
      A) Still delivers a clear sensory pleasure from the taste, even if I regret it later.  
      B) Is something I enjoy (attitudinally) in the moment, regardless of the physical sensation.  
      C) Is driven by a motivational state overriding fullness signals to get more reward.  
      D) Feels qualitatively different from eating when hungry – less pure pleasure.

  6.  **Scratching an annoying itch feels good because...**  
      A) It replaces an unpleasant sensation with a distinctly pleasant one.  
      B) I intensely dislike the itch, so its removal is what I enjoy.  
      C) The scratch provides immediate negative reinforcement (removes bad).  
      D) It's relief, not really pleasure in the same way as listening to music.

  7.  **Enjoying a profoundly sad film (where you might even cry)...**  
      A) Involves a positive emotional sensation mixed with the sadness.  
      B) Means I value the experience and find it meaningful, not that I feel "happy."  
      C) Happens because the film fulfills a deep need, keeping me engaged.  
      D) Is its own unique experience – not the same "pleasure" as comedy.

  8.  **The keen anticipation of an upcoming vacation...**  
      A) Is a unique, exciting feeling in the present.  
      B) Is my positive pro-attitude toward the future event.  
      C) Motivates my current planning and saving behaviors.  
      D) Feels different from the actual pleasure of being on vacation.

  9.  **The "warm glow" after doing a significant favor for someone...**  
      A) Is a genuine, positive emotional sensation inside.  
      B) Reflects my satisfaction with having done the right thing.  
      C) Reinforces prosocial behavior, making me more likely to help again.  
      D) Is distinct pride/fulfillment, not identical to sensual pleasure.

  ---

  **Scoring Key: Mapping Answers to Theories**

  *   **Branch 1 (Headache Relief - Q1):** Treats relief as...
      *   A) Felt-Quality, Functional
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 2 (Problem Solving - Q2):** Treats satisfaction as...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 3 (Coffee Sip - Q3):** Focuses on...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 4 (Sad Song - Q4):** Explains bittersweet pleasure via...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 5 (Eating Full - Q5):** Interprets "pleasure despite fullness" as...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 6 (Scratching Itch - Q6):** Sees the "good" of scratching as...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 7 (Sad Film - Q7):** Accounts for enjoyment via...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 8 (Anticipation - Q8):** Views anticipation as...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property
  *   **Branch 9 (Warm Glow - Q9):** Attributes the glow to...
      *   A) Felt-Quality
      *   B) Attitudinal
      *   C) Functional
      *   D) No-Common-Property

  **Determine Your Leaf (Theory):**
  *   Tally your most frequent answer pattern across branches.
  *   **Felt-Quality View:** Mostly A's. *Awkward Commitment:* Must posit a distinct positive sensation even in bittersweet or painful-but-valued experiences (like the sad film).
  *   **Attitudinal View:** Mostly B's. *Awkward Commitment:* Must explain "enjoyment" without any necessary accompanying feeling, even in intense sensory cases (like the first coffee sip).
  *   **Functional View:** Mostly C's. *Awkward Commitment:* Labels states as "pleasure" even if not consciously liked, as long as they reinforce behavior (like eating when uncomfortably full).
  *   **No-Common-Property View:** Mostly D's. *Awkward Commitment:* Accepts that "pleasure" lacks a unifying essence, potentially making hedonistic calculations vague or impossible.

  **Flags:**
  *   **Ambiguous Separation:** Felt-Quality (A) and Attitudinal (B) views often converge on sensory cases (Q3 - Coffee) but diverge sharply on relief (Q1) or evaluation-heavy cases (Q7 - Sad Film). Functional (C) and Attitudinal (B) can be hard to distinguish in cases of relief (Q1, Q6) or reinforcement of positive attitudes (Q9). The quiz may not cleanly separate these pairs in all answer profiles; look for consistency across *different* case types.
