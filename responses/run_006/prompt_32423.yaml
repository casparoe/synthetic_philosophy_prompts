prompt: |-
  I spent my career in physics—experimental, mostly optics—and retired about two years ago. Since then I've been reading my way into philosophy, specifically decision theory, and I keep coming back to the Ellsberg paradox. I get the basic point: people prefer bets where the probabilities are known (the urn with 50 red and 50 black) over bets where they're not (the urn with 100 balls that are red and black in unknown proportions), even when the payoffs are identical. That violates Savage's sure-thing principle, and it seems to me the standard response in economics has been to build models that accommodate this preference—maxmin expected utility, Choquet expected utility, the smooth ambiguity model, and so on.

  But the more I read, the more I feel like the field has accumulated a lot of technical machinery without settling the questions that actually matter. I'm not looking for a reading list or a bibliography; I'm looking for a judgment call from someone who knows the terrain.

  Here's what I want to know: if you had to pick, say, the three or four most important open questions in the ambiguity aversion literature right now—questions where progress would actually change how we think about decision-making under uncertainty—what would they be, and in what order? I care about the ordering and the reasoning behind it.

  Specifically, I'd like you to think about: which questions are upstream of others (settling them would disolve or reshape other debates), which are tractable with the tools we have (experimental or conceptual), and which would matter most for practice—for how real people or institutions should make decisions when probabilities aren't crisp. I'm also curious whether some of the questions that look like live debates are actually just fights about modeling conventions that don't have a fact of the matter.

  For context, I'm not an academic trying to publish. I'm a retired guy with time to think, and I want to know where to put my attention. I'm more interested in the conceptual architecture than in the latest working paper.

  Please structure your response in the following sections:

  1. The Candidates (roughly 600 words): lay out the top open questions, one by one, with a brief statement of what's at stake in each. Don't just name them—give me enough to see why they're live.

  2. Dependency Structure (roughly 400 words): which questions are upstream of which? If we got a decisive answer to question A, which other questions would be transformed or rendered moot? Are there any questions that look independent but actually share a hidden crux? A diagram in words is fine.

  3. The Prioritization (roughly 500 words): rank them and defend the ranking. What criteria are you using—importance, tractability, neglectedness, something else? Where do the criteria pull in different directions, and how do you resolve the tension? Be explicit about the trade-offs.

  4. What Would Change Your Mind (roughly 200 words): what experimental result or conceptual argument, if it appeared in the next few years, would most shake up your ranking? I want to know which empirical or philosophical findings you're treating as background assumptions that could shift.
