  For Phenomena, key points are the intuition of endlessness, different infinite sizes (like integers vs reals), and infinite processes in math (limits, recursion). These are observable in math that any theory must address.

  Paradoxes include Hilbert's Hotel, Galileo's, and Banach-Tarski. Theories need to resolve or explain these without contradiction. Russell's paradox shows the need for consistent set formation rules.

  Constraints involve consistency with math results (Cantor's theorems, Gödel) and avoiding contradictions. Non-classical logics might be an option, but core math must be preserved.

