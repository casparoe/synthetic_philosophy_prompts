  ok so I've been reading Dennett on free will and I keep coming back to that phrase "the varieties of free will worth wanting." The idea is that some conceptions of free will are non-starters — they'd be awful to actually have, or they're incoherent, or they're just not what we care about when we care about free will. Before I go further into the literature I want to get clear on what the criteria even are. Write me the desiderata: what does a conception of free will have to actually deliver to count as a variety worth wanting? Give me the requirements, with the case or consideration behind each, and flag which ones you think are genuinely non-negotiable vs. which are just Dennett's own preferences sneaking in. Also, distinguish between requirements that come from the "worth wanting" part and requirements that come from the "free will" part — I suspect those can pull in different directions and I want to see where the tension is. If any pair of requirements can't be jointly satisfied, that's the part I'm most interested in. And please no formatting — no headings, no bullet points, no bold, no tables. Just write it as continuous prose, like you're explaining it in an email.
