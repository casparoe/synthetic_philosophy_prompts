prompt: |-
  hey, in our constructive logic class we just went from the BHK interpretation to the Curry-Howard correspondence and i'm trying to figure out how much curry-howard actually adds. could you compare the two as accounts of what an intuitionistic proof is? bhk says a proof of an implication is a method that turns any proof of the antecedent into a proof of the consequent, and a proof of a negation is a method that turns any proof of the proposition into a proof of a contradiction; a proof of a disjunction is a proof of one disjunct together with an indication of which one. curry-howard reads those as function types, functions into the empty type, and sum types. that sounds like the same thing, just with the types written down. so is curry-howard basically bhk made precise, or does it give you something bhk doesn't, like criteria for when two proofs are the same, or normalization as a proof-theoretic notion, or an actual account of what a method is? and where do the two pictures actually come apart, if at all? i keep hearing that bhk is more informal and curry-howard is its computational realization, but i want to know if there are places where they make different predictions or where one is doing different philosophical work then the other.
