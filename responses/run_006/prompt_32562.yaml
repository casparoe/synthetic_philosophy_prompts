prompt: |-
  Two colleagues of mine, Elena and Marcus, have been going back and forth for weeks about a case one of them encountered in the contractualist literature, and when they finally asked me to referee I found I couldn't. The case is this. A technician is trapped in a room full of live transmission equipment. If the equipment stays on, he will be killed; if it is shut down, he can be rescued, but the broadcast of a World Cup final will be interrupted, and an enormous number of viewers — say, a billion — will each lose a short stretch of the match and suffer a mild frustration. Should the broadcast be shut down?

  (1) Elena says obviously yes: a person's life is not outweighed by any number of people's mild irritation at missing part of a game. This, she says, is what Scanlonian contractualism gets right. A principle must be justifiable to each individual, and no individual viewer has a complaint that comes anywhere near the technician's complaint against being killed. To sum a billion small frustrations into something that outweighs a life is to treat "the viewers" as if they were a single subject who suffers the sum of those frustrations, but no such subject exists.

  (2) Marcus says that cannot be the whole story. If no quantity of lesser harms may outweigh one greater harm, then the same reasoning requires saving one person from a broken arm rather than preventing a billion people from each suffering a broken finger — indeed, rather than preventing a billion people from each suffering a harm only slightly less severe than a broken arm. That, he says, is absurd. At some point numbers must count, and a view that cannot say where has simply drawn an arbitrary line and called it principle.

  (3) Elena replies that the broken-arm conclusion is not an embarrassment, because justification is owed to persons one at a time. Compare the technician's complaint with any single viewer's complaint, and the technician wins every time; that the comparison comes out the same way a billion times over changes nothing. She concedes that numbers matter in one place: when individual claims are equal, as when one must choose between saving one person and saving five from the same harm, numbers act as a tie-breaker. But a tie-breaker cannot make a weaker individual claim stronger than a stronger one.

  (4) Marcus answers that the tie-breaker concession only deepens the problem. Suppose one must choose between saving one person from death and saving five from a harm only barely less severe — permanent quadriplegia, say. Each of the five has a claim nearly as strong as the one person's claim to life, yet on Elena's rule the single death wins, because each pairwise comparison favors the person who will otherwise die. If Elena now says the harms are close enough for numbers to count, she has reintroduced aggregation and still owes a principled threshold, which is the very thing she has not supplied. If she will not say that, she is committed to letting five people become quadriplegic in order to prevent one death.

  (5) Elena responds that the threshold objection cuts both ways. Marcus's own view has to say how small a harm may be before it becomes irrelevant when weighed against a life, and any aggregative position faces its own version of the line-drawing problem. The real disagreement, she says, is not about where to draw a line but about whether harms to different people may be added together at all, and Marcus keeps presupposing that they may.

  They then turned to me. I could not tell who was right about what, so I would like a careful adjudication. Please go through the exchange move by move and say, for each move, whether it is right, wrong, or partly right and why; then say who is right about which specific points, and what, if anything, both of them are missing. If one of them is more right overall, say so, but only after the point-by-point analysis.
reasoning: |-
  Okay, so I need to help referee this debate between Elena and Marcus about contractualism and aggregation. Let me start by understanding the core issue. The case involves a technician whose life is at risk versus a billion viewers missing part of a World Cup final. Elena argues that saving the technician is obvious because you can't aggregate minor frustrations to outweigh a life. Marcus disagrees, saying that at some point numbers must matter to avoid absurd conclusions.

  First, I should recall Scanlonian contractualism. The idea is that a principle must be justifiable to each person affected. So, no one could reasonably reject a principle that saves a life over minor frustrations. Elena's point (1) seems solid here. But Marcus counters with the broken arm example. If numbers never matter, then saving one person from a broken arm would outweigh preventing a billion broken fingers. That does seem counterintuitive. 

  Elena's response (3) is that individual claims are compared pairwise. The technician's claim vs. any single viewer is stronger. Only when claims are equal do numbers break ties. But Marcus's quadriplegia example (4) challenges this. If saving one life versus five cases of quadriplegia, pairwise the life wins each time. But letting five suffer severe harm to save one life feels wrong. Elena says Marcus hasn't solved the line-drawing problem either, which is fair. Both face thresholds, but Elena denies aggregation entirely.

  Looking deeper, Elena's view might struggle with varying harm scales. If harms are close, like quadriplegia vs. death, how close must they be for numbers to matter? That's a problem. Marcus's aggregation allows summing harms, but he needs a threshold where small harms become negligible. Both have line-drawing issues, but Elena's is about comparability while Marcus's is about aggregability.

  The key philosophical divide is aggregative vs. non-aggregative approaches. Elena sticks to individual claims without summing, while Marcus insists that large numbers of lesser harms must count. Marcus's examples highlight situations where non-aggregation leads to unacceptable outcomes, pushing Elena to either accept those outcomes or adjust her view, which might weaken her position.

  In adjudicating, Elena is right that contractualism traditionally rejects aggregation. But Marcus points out real-world implications that seem unreasonable. Perhaps both miss that contractualism might allow for aggregation in specific contexts, like when harms are comparable. Or that the distinction between trivial and significant harms could be key. Also, the original case's "mild frustration" is clearly trivial, making Elena stronger there. But in severe harms like quadriplegia, aggregation seems necessary, showing Elena's view might not be fully tenable.
answer: |-
  Here is a point-by-point adjudication of the debate, followed by a synthesis of what each party gets right, what they miss, and an overall assessment.

  ### **Move-by-Move Analysis**
  **(1) Elena’s Initial Claim: Correct in Principle, but Overly Rigid**  
  - **Right:** Elena correctly identifies the core tenet of Scanlonian contractualism: principles must be justifiable to each person individually, and one life *cannot* be outweighed by aggregated trivial harms (e.g., mild frustration). No single viewer could reasonably reject a principle prioritizing the technician’s life. Summing harms across individuals violates contractualism’s individualism.  
  - **Wrong/Overlooked:** She dismisses aggregation entirely without addressing *how contractualism handles comparable harms of differing magnitudes* (e.g., death vs. paralysis). Her view risks absolutism: if "no quantity" of lesser harms outweighs a greater harm, absurdities arise (as Marcus notes).  

  **(2) Marcus’s Counter: Partly Right, Highlights a Problem but Overcorrects**  
  - **Right:** Marcus correctly identifies a flaw in Elena’s rigid non-aggregation: it leads to absurd conclusions (e.g., saving one broken arm over a billion broken fingers). Contractualism must account for *thresholds* where numbers matter to avoid morally untenable outcomes.  
  - **Wrong/Overlooked:** He conflates *all* harms as aggregable. The broken-finger example is valid, but he fails to distinguish *severity*: mild frustration (World Cup) is qualitatively different from physical harm (broken finger). Contractualism can reject aggregating trivial harms while allowing aggregation for severe ones.  

  **(3) Elena’s Response: Defensible but Incomplete**  
  - **Right:** She correctly notes contractualism’s focus on *pairwise comparisons* and the tie-breaker role for numbers *only when claims are equal*. For the technician vs. any single viewer, the technician’s claim is overwhelmingly stronger.  
  - **Wrong/Overlooked:** She sidesteps Marcus’s core challenge: *how does contractualism handle harms of similar severity?* Her tie-breaker only applies to identical harms (e.g., one death vs. five deaths), not to harms on a continuum (e.g., death vs. quadriplegia).  

  **(4) Marcus’s Quadriplegia Case: Strong Critique, but Misrepresents Contractualism**  
  - **Right:** This exposes a critical weakness in Elena’s view. If pairwise comparisons always favor the greater harm, saving one life *must* override preventing five quadriplegias—a conclusion many find implausible. Contractualism needs a way to address "closeness" of harms.  
  - **Wrong/Overlooked:** Marcus assumes contractualism *cannot* handle this without full aggregation. However, Scanlon (*What We Owe to Each Other*) allows for "impartiality" in weighing comparable claims. The problem isn’t aggregation per se but defining a *principled basis* for when harms are "close enough" for numbers to matter.  

  **(5) Elena’s Threshold Objection: Correct but Avoids the Underlying Issue**  
  - **Right:** Marcus’s aggregative approach also faces a line-drawing problem (e.g., how small a harm is "irrelevant"?). Contractualism’s core strength is rejecting *summing trivial harms*, which avoids the "billion viewers" absurdity.  
  - **Wrong/Overlooked:** She ignores that contractualism *must* address Marcus’s quadriplegia case. By treating "no aggregation" as axiomatic, she risks reducing contractualism to a rigid hierarchy where *any* greater harm trumps *any* number of marginally lesser harms.  

  ---

  ### **Who is Right About What?**  
  - **Elena is Right About:**  
    - The *core contractualist principle*: Individual justification prohibits aggregating a billion trivial frustrations to override a life.  
    - The *absurdity of Marcus’s aggregative extreme*: Summing mild frustrations treats diffuse groups as a single entity, violating individualism.  
    - The *tie-breaker role for numbers*: Identical claims (e.g., one life vs. five lives) allow numbers to break ties.  

  - **Marcus is Right About:**  
    - The *problem of comparable harms*: Non-aggregation fails in cases like death vs. quadriplegia, where pairwise comparisons lead to unacceptable outcomes.  
    - The *need for thresholds*: Contractualism must explain when harms are "close enough" for numbers to matter without collapsing into aggregation.  
    - The *absurdity of Elena’s extreme*: Saving one broken arm over a billion broken fingers is indefensible.  

  ---

  ### **What Both are Missing**  
  1. **The Spectrum of Harm Severity:**  
     - Contractualism can accommodate "closeness" without full aggregation. For example, harms can be grouped into *categories* (e.g., "trivial," "moderate," "severe"). Pairwise comparisons apply *within* categories, but numbers may matter *across* close categories (e.g., death and quadriplegia are "sufficiently close" for numbers to tip the balance).  
     - **Missed Solution:** Scanlon’s "complaint model" allows weighing *individual complaints* comparatively. A quadriplegic’s complaint against paralysis might be comparable to a dying person’s complaint against death in *intensity*, permitting numbers to decide.  

  2. **The Role of Reasonable Rejection:**  
     - In the World Cup case, no viewer could *reasonably reject* a principle prioritizing a life over mild frustration.  
     - In the quadriplegia case, the five could *reasonably reject* a principle that always prioritizes one life over five severe disabilities, as their complaints are nearly as strong.  

  3. **Contextual Factors:**  
     - **Trivial vs. Non-Trivial Harms:** Mild frustration (World Cup) is trivial; broken fingers or quadriplegia are not. Contractualism can reject aggregating trivial harms while allowing aggregation for non-trivial ones.  
     - **The "Close Enough" Threshold:** Contractualists (e.g., T.M. Scanlon, Sophia Moreau) argue that when harms are "on a par," numbers break the tie. Defining "on a par" (e.g., death and quadriplegia) avoids arbitrary lines.  

  ---

  ### **Overall Verdict**  
  **Marcus is more right in the broader context, but Elena wins the original case.**  
  - **Elena "wins" the World Cup scenario:** Saving the technician is morally obligatory. A billion mild frustrations cannot outweigh a life under contractualism. Marcus’s aggregation would permit grotesque trade-offs (e.g., sacrificing one person to prevent a billion hangnails).  
  - **Marcus "wins" the meta-debate:** His critique exposes a flaw in non-aggregation for comparable harms. Contractualism *must* incorporate a nuanced approach to severity and closeness to avoid implausible conclusions.  
  - **Synthesis:** Contractualism can reconcile both intuitions:  
    1. **No aggregation for trivial harms** (Elena’s core insight).  
    2. **Numbers matter for severe/comparable harms** (Marcus’s core insight).  
    The quadriplegia case requires recognizing that death and quadriplegia are "close enough" for the five to collectively outweigh the one—not by aggregation, but because each has a complaint of similar gravity.  

  **Final Word:** Both colleagues highlight genuine challenges in contractualism. Elena defends its individualism against utilitarian excesses; Marcus forces it to address real-world moral complexity. The referee should recommend refining contractualism with a harm-severity framework, not abandoning its core.
