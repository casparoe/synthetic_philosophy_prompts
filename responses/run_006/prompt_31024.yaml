  Brainstorming lines: Start with observing a raven to confirm directly. Then shift to the apple, noting how it's evidence but weak. Words like "slight," "faint," or "thin" can emphasize the weakness. In the final couplet, juxtapose the raven's strong evidence with the apple's faint support.

