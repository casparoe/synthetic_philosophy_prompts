  ## Hempel's Raven Villanelle

  I saw a raven, black against the sky,
  A single note in darkness, deep and stark.
  **The hypothesis: all ravens black must lie.**

  A white shoe gleamed, a non-black thing nearby,
  Not raven-kind, adrift within the park.
  **All that are not black are not ravens – why?**

  One bird confirms the rule we might apply;
  One hundred more would leave a clearer mark.
  **The hypothesis: all ravens black must lie.**

  But logic's frame makes confirmation sly:
  That shoe, though white, ignites a tiny spark.
  **All that are not black are not ravens – why?**

  For green apples beneath a sunlit high
  Are non-black things, fulfilling that remark.
  **The hypothesis: all ravens black must lie.**

  The paradox, where common sense may sigh,
  Finds evidence where shadows leave their arc.
  **All that are not black are not ravens – why?**
  **The hypothesis: all ravens black must lie.**

  So in the green apple, a proof, though thin and slight,
  Confirms the raven's blackness, faint and far, by contrapositive's pale light.

  ---

  **Note on Philosophical Content:**

  *   **Confidence Level:** Moderately High (7/10)
  *   **Core Elements Captured:** I'm confident the poem accurately reflects the *logical equivalence* of the hypothesis and its contrapositive, the *standard Hempelian point* that observing non-black non-ravens (like a green apple or white shoe) *does* provide genuine confirmation of "all ravens are black" (via confirming the contrapositive), and the *paradoxical nature* arising from the intuition clash.
  *   **Least Sure Aspect:** Conveying the **"vanishingly weak"** nature of this confirmation *explicitly enough within the poem's constraints*. While the final couplet uses "proof, though thin and slight," "faint and far," and "pale light," I'm less certain this fully lands the emphasis Hempel intended – that observing a white shoe confirms the hypothesis to an almost negligible, practically useless degree compared to observing a black raven. The poem *implies* it ("faint and far"), but the starkness of Hempel's point about its weakness might be slightly understated in favor of poetic flow. The paradox recognition relies on the reader connecting "green apple," "white shoe," "confirms," and "contrapositive" to the standard example.
