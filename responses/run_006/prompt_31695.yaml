prompt: |-
  I sit on the bargaining committee of my union local. Our contract with the employer expires in nine months, and the committee is split over whether to adopt, before talks even begin, a public resolution committing us not to accept any wage increase below six percent and no increase in our share of health-insurance premiums. The proponents say that if we tie our own hands in public, management will see that we cannot retreat, and that this is the only way to keep us from being slowly talked down over months of negotiation. The opponents say management has already been putting out public statements that wages are frozen, so our resolution would simply dare them to make their own no-concessions pledge, and the two fixed positions would carry us into a strike that most people on both sides do not actually want.

  I have no academic background, but I have been trying to think this through on my own, and I keep coming back to the idea that commitments can race each other: each side makes itself immovable in order to gain ground, and the result is that both become unable to move, even when moving would be better for everyone. I do not have the vocabulary to turn that thought into a decision the committee can act on. Please draft the short written opinion I will circulate before our next meeting. It should recommend a concrete course of action with a time frame for the months before and during negotiations, and it should engage the strongest case for adopting the public no-concessions resolution rather than simply dismissing it. The committee is practical and will set aside anything that reads like an academic essay.
reasoning: |-
  Okay, the user is part of a union bargaining committee facing a strategic dilemma. They need to decide whether to publicly commit to a minimum 6% wage increase and no health premium increases before negotiations even start. The committee is split, and the user wants a practical, non-academic written opinion to present.

  Hmm, the user clearly understands the core tension here - that rigid commitments could lead to a lose-lose stalemate. But they struggle to articulate it in committee-friendly terms. Their metaphor about "commitments racing each other" is actually spot-on game theory, though they rightly avoid jargon.

  The key challenges I see: First, the management has already started framing expectations ("wages frozen"). A union hardline now could escalate to mutual brinkmanship. Second, the user's role requires bridging between two valid concerns - some members fear being worn down, others fear provoking unnecessary conflict.

  What's not said but implied: The user likely needs cover for a moderate position. They're privately skeptical of the hardline approach but respect its proponents. The request for "engaging the strongest case" suggests they want to validate colleagues' fears while steering toward flexibility.

  The real need here isn't just analysis - it's providing diplomatic language to prevent committee polarization. The response must avoid academic terms while capturing: 1) Why the hardline is tempting (prevents erosion) 2) Why it's risky (triggers mirroring) 3) A third path that addresses both fears.

  Timeframe is crucial too. They need actionable phases: pre-negotiation prep (next 3 months?), early talks (months 4-6?), crunch time (last 3 months?). The solution should let both factions see their priorities reflected - maybe firm goals but flexible tactics.

  Biggest trap to avoid: Sounding like they're dismissing the hardliners. The "strength through flexibility" angle might work - comparing it to martial arts where yielding creates advantage. Practical unionists will appreciate that better than game theory lectures.
answer: |-
  ## Committee Memorandum: Strategic Approach to Upcoming Negotiations  
  **To:** Bargaining Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Recommendation: Dynamic Positioning Over Rigid Pre-Commitment  

  The core tension we face is real: **how to prevent being negotiated downward without boxing ourselves—and management—into a strike nobody wants.** I respect the proponents’ goal: a public "no retreat" pledge seeks to lock in our strength early. Their argument has merit—if we show unbreakable resolve, management *might* concede faster. But the opponents rightly warn this could trigger a disastrous game of chicken. My recommendation balances both insights: **adopt firm goals but reject public pre-commitment. Instead, build leverage through phased, disciplined unity.**  

  ### Why the Public Pledge Risks Backfiring  
  Management’s "wage freeze" rhetoric is a deliberate pressure tactic. If we respond with an equally rigid public stance:  
  - **We validate their hardline**, giving them cover to dig in.  
  - **We remove off-ramps**, forcing them to "lose face" if they move—making movement harder.  
  - **We invite a stalemate** where compromise feels like betrayal on both sides—exactly what could push us toward an unwanted strike.  

  ### A Better Path: Strategic Discipline with Flexibility  
  Our strength lies in our unity and preparation—not in public posturing. Here’s a concrete plan:  

  #### **Phase 1: Next 90 Days (Pre-Negotiations)**  
  - **Internally commit** to our core demands (6%+ wages, no premium hikes).  
  - **Build leverage quietly**:  
    - Survey members to document specific hardships (e.g., premium costs, inflation impacts).  
    - Gather data on company profits, executive pay, and competitor contracts.  
    - Train stewards to mobilize quickly if needed.  
  - **Public messaging**: Frame our needs without ultimatums (e.g., "Workers deserve fair raises matching inflation and protection from healthcare cost shifts").  

  #### **Phase 2: Months 4–6 (Early Negotiations)**  
  - **Enter talks without public absolutes** but with unified resolve.  
  - **Test management’s position**: Are they truly frozen? Is there flexibility on non-wage issues (e.g., bonuses, scheduling, retiree benefits)?  
  - **Maintain internal discipline**:  
    - Hold weekly committee briefings for stewards to prevent misinformation.  
    - Use member meetings to reaffirm solidarity around core goals.  

  #### **Phase 3: Months 7–9 (Critical Period)**  
  - **Assess progress**: If management shows movement, negotiate fiercely but pragmatically.  
  - **If talks stall, escalate pressure strategically**:  
    - Controlled actions (e.g., informational pickets, media stories on company profits vs. worker needs).  
    - **Only then** consider a public "line in the sand" vote—backed by visible member action—*after* management has seen our capacity to mobilize.  

  ### Why This Works Better  
  - **Prevents mutual traps**: Avoiding early public absolutes keeps management guessing and avoids cornering them into matching our rigidity.  
  - **Builds real power**: Data and mobilization readiness are stronger than symbolic pledges.  
  - **Preserves off-ramps**: We keep negotiating room while signaling unwavering commitment through actions, not just words.  
  - **Focuses management on consequences**: They negotiate more seriously if they see our unity is active, not just declared.  

  ### Conclusion: Strength Through Flexibility  
  A public pledge now risks turning negotiations into a high-stakes standoff. By internally uniting around non-negotiable goals, preparing relentlessly, and escalating pressure only *if needed*, we force management to confront our resolve without giving them an excuse to lock in. **Recommendation: Reject the public resolution. Commit instead to the phased plan above—and let our preparation, not our promises, speak loudest.**  

  Respectfully,  
  [Your Name]  

  ---

  **Key Strategic Principles Embedded:**  
  1. **Avoid Forcing Mirrored Commitment**: Rigidity invites rigidity; ambiguity preserves options.  
  2. **Leverage > Ultimatums**: Real power comes from readiness to act, not pre-announced positions.  
  3. **Controlled Escalation**: Pressure is most effective when deployed *responsively*, not preemptively.  
  4. **Unity as Action**: Internal discipline and member engagement deter retreat more credibly than public vows.
