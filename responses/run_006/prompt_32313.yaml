prompt: |-
  I work in trust and safety at a mid-sized video platform. I write the content rules and also handle appeals, so I'm making maybe twenty calls a week about whether a specific video violates something like "no glorification of violence" or "no hateful conduct." The stakes are real: a wrong call either keeps a bad actor up or kills a creator's channel. I've got about ten minutes per case, I can't pull in a lawyer or a philosopher each time, and my boss wants the calls consistent and defensible when someone appeals.

  The problem is the cases keep outrunning the rule. The rule plus every past decision we've made just doesn't settle whether this new video is a violation, and asking "what does the rule really mean here" makes my team argue in circles. I've read a little of the Kripkenstein rule-following stuff — the claim that there's no fact about the rule that fixes what counts as the right next application, and that what saves us is agreement in practice rather than the rule itself. I don't need the exegesis about whether Kripke got Wittgenstein right; I need the operational version.

  Give me a reusable procedure for deciding whether a novel case falls under a content rule, written for someone who has to act on it, not theorize about it. It should be a checklist of questions in order, with what counts as a sufficient answer to each, where the procedure stops with "the rule doesn't settle this" and hands the case to a person, where it says "yes, apply the rule" even when my team's intuition squirms, and which calls I can make myself versus which need the policy lead's sign-off. Mark the steps where judgment can't be eliminated, and say what the procedure as a whole can't do. Then run the procedure on two cases: (1) a rule against "glorifying violence" applied to a documentary clip of a real bombing that the channel celebrates; (2) a rule against "hateful conduct" applied to a minority creator using a slur for themselves in a comedy sketch. One of those should come out in a way I'm not going to like.

  Format: exactly seven numbered items, each a sentence or two, no introduction and no conclusion. The first five items are the procedure; the last two are the worked examples.
reasoning: |-
  Hmm, the user works in trust and safety at a video platform and needs a practical procedure for applying content rules to borderline cases. They're dealing with rules like "no glorification of violence" and "no hateful conduct," making about 20 decisions per week with limited time per case. The philosophical ideas about rule-following (like Kripkenstein) are interesting but they need something actionable, not theoretical.

  The user wants a reusable checklist that determines when to apply a rule, when to say it doesn't cover a case, and when to escalate. The procedure should handle situations where the rule and past decisions are ambiguous, and it needs to specify where judgment is unavoidable. They also want two examples: one with glorifying violence in a documentary, and another with hateful conduct involving a minority creator using a slur. One outcome should be intentionally unsatisfying to demonstrate the limits.

  Key requirements from the user: The procedure must be in seven numbered items - first five for the steps, last two for examples. Each step should be brief and clear, indicating sufficient answers, when to stop or apply the rule, and when to escalate. I need to mark where judgment is required and what the procedure can't handle. For the examples, I'll make sure one has an outcome the user won't like, based on their role.

  Breaking down the procedure: The core problem is that rules run out, so I'll build a decision tree that starts with literal interpretation and moves to context. Step 1 should check if the case fits the rule's plain meaning, using a threshold of clear violation. Step 2 involves precedent: if past decisions clearly cover this, it's settled; if there's conflict, it's indeterminate. Step 3 assesses intent - if the content creator's obvious purpose is to break the rule, that might override nuance. Step 4 looks at platform context, like how the content is framed or consumed, which requires judgment. Step 5 is the final call: if all prior steps are indeterminate, the rule doesn't settle it, and it goes to a policy lead; otherwise, the reviewer can decide unless it's high-stakes.

  For the examples: For the bombing documentary, if it's presented as heroic, it might violate glorification of violence, even if it's documentary-style - an outcome the user might dislike because it restricts historical content. For the minority creator using a slur in comedy, if it's reclaiming the term without targeting others, it might not violate hateful conduct - another potentially disliked outcome because it allows slurs in some contexts. I'll make the glorification example the unsatisfying one since it could lead to suppressing educational content.

  Overall, the procedure acknowledges that rules aren't exhaustive and judgment is needed in gray areas. Limitations include inability to resolve deep disagreements or predict new contexts. This should give the user a tool to handle most cases consistently and know when to escalate.
answer: |-
  1.  Check literal match: Does this case fall entirely within the core, unambiguous examples the rule was written to cover (e.g., explicit calls for violence, direct slurs against a group)? If yes (e.g., video titled "Go Bomb These People"), apply the rule yourself; sufficient answer is clear alignment with rule text and intent. If no or partially, proceed.
  2.  Check precedent consistency: Do all relevant past decisions for similar cases *unanimously* point one way? (Sufficient answer: clear pattern exists). If unanimous "violation", apply rule yourself; if unanimous "safe", mark safe yourself. If conflicting precedents exist or no close precedent, proceed. Judgment required to determine similarity.
  3.  Assess primary intent/purpose: Is the core purpose of the content *unambiguously* to violate the spirit of the rule (e.g., solely to incite hatred, solely to celebrate violence)? Ignore claimed intent; focus on content structure, framing, and likely audience takeaway. If yes, apply the rule yourself; sufficient answer is overwhelming evidence of malicious/destructive intent. If unclear or mixed, proceed. Judgment required.
  4.  Evaluate platform context & harm risk: Considering the *platform's specific context* (audience, presentation, algorithm promotion, current events), is there a *clear and present risk* of significant, direct harm (e.g., incitement, targeted harassment, radicalization) if the content stays? (Sufficient answer: high confidence based on platform data/patterns). If high risk is clear, apply rule yourself. If risk is uncertain or primarily reputational/offensiveness, proceed. Judgment required heavily here. Requires policy lead sign-off if applying rule based primarily on this step.
  5.  If all prior steps are indeterminate (no literal match, conflicting/no precedent, intent unclear, harm risk uncertain), conclude "Rule does not settle this case." Hand to policy lead for new precedent or rule clarification. You cannot make the call alone here. The procedure cannot invent new rule meanings or resolve fundamental value conflicts inherent in the rule's ambiguity.
  6.  *Glorification of Violence (Documentary Clip):* Not literal match (documentary). Precedents likely split (some historical docs allowed, some militant celebration removed). Intent unclear (informative vs. celebratory framing). Harm risk depends on framing/audience - if channel clearly celebrates bombing as heroic, high harm risk exists (step 4), apply rule. You won't like removing historical context, but the celebratory framing triggers step 4.
  7.  *Hateful Conduct (Minority Creator Slur in Comedy):* Not literal match (self-targeted, comedic). Precedents likely conflict. Intent likely reclaiming humor, not hate. Harm risk is complex; potential offense exists, but direct incitement/harm risk is low unless targeting others. Steps 1-3 indeterminate, harm risk uncertain (step 4). Conclude rule doesn't settle (step 5), hand to policy lead. You won't like the ambiguity allowing potentially offensive content, but the rule + precedent don't clearly forbid self-referential reclaiming in comedy.
