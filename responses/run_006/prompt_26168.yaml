  I should also explain why common alternatives don't fit. "Axioms" imply formal logic, "dogma" suggests rigidity, "tropes" are about content—none capture this dynamic social layer. The key difference from Wittgenstein is that these are mutable social agreements, not metaphysical certainties. 

