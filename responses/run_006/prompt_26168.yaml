answer: |-
  This is a brilliantly articulated observation about the unspoken infrastructure of creative practice. You're absolutely right that standard terms like "dogma," "axiom," or "rule" don't capture the specific, functional role these beliefs play. Wittgenstein's "hinge propositions" (*Angeln* in *On Certainty*) are indeed a close cousin, but the differences are crucial, as you intuited. Here's a breakdown of concepts and a proposed term:

  **Why "Hinge Propositions" (Wittgenstein) is Close but Not Perfect:**

  1.  **Focus:** Wittgenstein tackles *epistemological* certainty – the foundations of *knowledge* and *doubt* ("I have two hands," "The world existed more than 5 minutes ago"). Your concern is *pragmatic* certainty – the foundations of a *shared activity* or *practice* ("Stories involve change," "Showing is often effective").
  2.  **Function:** For Wittgenstein, hinges allow the *language game of doubting/asserting knowledge* to function. For you, these craft beliefs allow the *language game of workshop critique/craft discussion* to function.
  3.  **Scope:** Wittgenstein's hinges are often universal (or treated as such within his examples). Your craft beliefs are specific to a particular community and practice (contemporary literary fiction workshops/craft discourse).

  **Other Philosophical Concepts & Why They Don't Quite Fit:**

  *   **Foucault's "Historical A Priori" / "Episteme":** The underlying, often unconscious, rules governing what can be said/thought in a particular historical period. This is too broad, deep, and historically contingent. Your phenomena are more specific to a sub-culture (writers) and more consciously acknowledged (even if not questioned).
  *   **Althusser's "Problematic":** The structured system of concepts and questions defining a theoretical field, determining what questions can even be asked. This is closer, especially regarding what questions are "legible," but it's heavily tied to theoretical discourse and ideology critique, feeling too rigid for a creative practice.
  *   **Kuhn's "Paradigm":** The set of shared beliefs, values, and techniques defining "normal science." This captures the community aspect but is too comprehensive and revolutionary for your context. Workshop assumptions are smaller components within a larger, looser paradigm.
  *   **MacIntyre's "Practices" (in *After Virtue*):** He defines a practice as a coherent, complex form of socially established cooperative human activity with internal goods and standards of excellence. Your phenomena are precisely the kind of shared understandings that *constitute* the "standards of excellence" and define what counts as participating in that practice ("the game"). This is perhaps the most fertile ground conceptually.

  **The Proposed Term: "Constitutive Conventions"**

  This term best captures the phenomenon you describe:

  1.  **Constitutive:** These beliefs aren't just rules *within* the practice; they are fundamental to *constituting* the practice itself. They define what the practice *is* and what counts as a relevant move *within* it. Without them, the shared activity (the workshop discussion, the craft book advice) becomes unintelligible or collapses. They are the "floor."
  2.  **Conventions:** Emphasizes their origin in social agreement within a specific community (writers, workshop participants, craft book authors/readers). They are not universal laws, divine truths, or purely logical necessities, but shared understandings that enable cooperation and communication. They are *practical agreements* that make the practice work.

  **Why "Constitutive Conventions" Works:**

  *   **Specificity:** It directly addresses the "what makes a shared practice possible" aspect.
  *   **Flexibility:** It allows for these conventions to evolve over time or differ between sub-communities (e.g., literary fiction vs. experimental fiction workshops might have slightly different sets).
  *   **Non-Dogmatic:** "Convention" implies agreement, not divine decree. They are held because they *work* for the practice, not because they are inherently sacred.
  *   **Functionality:** It highlights their role in enabling specific types of discourse and evaluation ("the furniture of disagreement").
  *   **Clarity:** It avoids the epistemological baggage of "hinge" while retaining the core idea of enabling foundation.

  **Demarcating the Boundaries:**

  1.  **Domain-Specific:** They only function as constitutive conventions within the specific practice they enable (e.g., contemporary literary fiction workshops). Questioning them *within* that context stalls the game.
  2.  **Non-Absolute:** They are not eternal truths. They *can* be examined, debated, and changed, but doing so requires stepping *outside* the standard practice framework into meta-discussion, historical analysis, or manifesto-writing. This is distinct from arguing *within* the framework (e.g., *how* to show, not *whether* showing matters).
  3.  **Enabling, Not Dictating:** They make shared practice possible but don't rigidly determine all outcomes. They define the playing field and the basic rules of the game, not every possible play.
  4.  **Revealed by Challenge:** Their existence and nature become most visible precisely when someone challenges them within the context where they are constitutive, causing the conversation to stall. This "stalling" is the diagnostic sign.
  5.  **Distinguished from Dogma/Axiom/Trope:**
      *   **Dogma:** Held on authority, resistant to question (often religious/political). Conventions are held for pragmatic functionality, not authority.
      *   **Axiom:** A self-evident starting point in a formal system (logic, math). Conventions are social, not formal/logical.
      *   **Trope/Cliché:** A common pattern *within* the narrative content. Conventions are *about* the practice of creating/evaluating that content.

  **In Summary:**

  The **Constitutive Conventions** of a practice (like contemporary fiction writing workshops) are the shared, foundational, often unspoken beliefs that define the very possibility of engaging in that practice coherently. They are the practical agreements that set the stage for meaningful discussion, critique, and creation *within* that specific framework. Questioning them isn't heresy; it's simply attempting to play a different game on the same field, which causes confusion. "Hinge" captures the foundational aspect, but "Constitutive Conventions" more accurately reflects their social, practical, domain-specific nature in enabling a shared creative endeavor. These are the bedrock assumptions that allow the vibrant, contentious, and ultimately productive conversation of craft to happen at all.
