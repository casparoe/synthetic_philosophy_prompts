prompt: |-
  ok so i keep hitting the same wall every time i try to read about jeffrey conditionalization, and i want to front-load the confusion instead of reading another post that restates the formula. before i look at more candidate theories, write me the desiderata for a theory of updating on uncertain evidence. i want the actual requirements list, not a survey. for each one: the motivating case or puzzle, whether its non-negotiable or just a preference of one camp, and which single requirement knocks out the most popular positions.

  some things i care about, in case its useful. it should reduce to plain bayes when the observation gets probability one, obviously. but it also has to say what the input to an update is when nothing gets probability one: a new distribution over a partition, a likelihood ratio, something else. and it has to take a stand on what stays fixed during the update, because jeffreys rule keeps the conditional probabilities inside the partition rigid, and that rigidity is doing a lot of work. is that a genuine requirement or just a modeling choice you can reject? also the partition problem: jeffrey updating gives different answers depending on how you carve up the same experience, so a theory owes us an account of where the partition comes from or why the dependence is not a bug. and the commutativity thing: ordinary conditioning doesnt care about the order of observations, jeffrey updating does. i want to know if path-independence is a real constraint or a fake one, because if it is real then some of the other desiderata are probably jointly unsatisfiable. flag any pairs like that. and there should be something about diachronic coherence, whether the requirements can be motivated by dutch book or reflection style arguments without sneaking in the conclusion.

  then briefly score the main contenders against the list: at least jeffrey conditionalization, strict conditionalization, and radical probabilism or whatever the minimal revision people are doing. keep the scoring short, the criteria are the part i want.
reasoning: |-
  We are going to list the desiderata for a theory of updating on uncertain evidence. For each desideratum, we'll provide:
  1. The motivating case or puzzle.
  2. Whether it's non-negotiable or a preference of one camp.
  3. Which single requirement knocks out the most popular positions.

  Then we will briefly score the main contenders (Strict Conditionalization, Jeffrey Conditionalization, and Radical Probabilism) against the list.

  ---

  **Desiderata for a Theory of Updating on Uncertain Evidence**

  1. **Reduction to Strict Conditionalization for Certain Evidence**
     - **Motivation**: When an observation is certain (i.e., assigned probability 1), the updating rule should reduce to Bayes' rule (strict conditionalization). This ensures consistency with the standard Bayesian framework in the limit of certain evidence.
     - **Non-negotiable?**: Widely considered non-negotiable. Without this, the theory would be inconsistent with the foundation of Bayesian updating.
     - **Knocks out**: Any theory that does not reduce to strict conditionalization when evidence is certain. This is a basic requirement that most theories satisfy, so it doesn't knock out many popular positions. However, it is a minimal requirement.

  2. **Specification of Input for Uncertain Evidence**
     - **Motivation**: In cases of uncertain evidence (e.g., seeing a cloth in dim light and being unsure of its color), we need a clear account of what the input to the update is. Is it a new probability distribution over a partition? A likelihood ratio? Or something else?
     - **Non-negotiable?**: Non-negotiable that the theory must specify the input. However, the form of the input is a point of contention. Some theories (like Jeffrey) require a probability distribution over a partition, while others might require likelihood ratios or constraints.
     - **Knocks out**: Theories that do not specify what the input is. This is a requirement that every theory must meet, so it doesn't knock out specific popular positions but rather forces a choice.

  3. **Rigidity (Conditional Probabilities Fixed)**
     - **Motivation**: Jeffrey Conditionalization assumes that conditional probabilities given the elements of a partition remain fixed. For example, if you update on a partition of colors, then for any event A, P_new(A | color_i) = P_old(A | color_i). This is a key assumption that allows the update to be defined.
     - **Non-negotiable?**: Not non-negotiable. Some argue that rigidity is a modeling choice and that other things might be held fixed (e.g., likelihood ratios). However, without some form of invariance, updating becomes underconstrained.
     - **Knocks out**: This requirement is specific to Jeffrey Conditionalization. If one rejects rigidity, then Jeffrey updating is knocked out. But other theories might not require it.

  4. **Partition Invariance**
     - **Motivation**: The "partition problem" for Jeffrey Conditionalization: the updated probabilities depend on the choice of the partition. For example, updating on a partition {red, green} vs. {red, green, blue} for the same experience might yield different results. A theory should either explain why the partition is fixed by the evidence or provide a partition-invariant update rule.
     - **Non-negotiable?**: Some consider partition dependence a bug, others a feature. It is non-negotiable for some that the update should not depend on an arbitrary partition, but others argue that the partition is part of the evidence.
     - **Knocks out**: Jeffrey Conditionalization is knocked out by the requirement of partition invariance because it is partition-dependent. This requirement would push us toward partition-invariant rules (like minimizing relative entropy subject to constraints).

  5. **Commutativity (Path-Independence)**
     - **Motivation**: In strict conditionalization, the order of updates does not matter (if the evidence is certain and consistent). For uncertain evidence, should the order matter? Commutativity requires that updating on E then F yields the same as F then E. This is desirable for a consistent belief state.
     - **Non-negotiable?**: Not non-negotiable. Some argue that evidence might be order-dependent (e.g., if the evidence is about the same event in different ways). However, if one holds that the order of learning should not matter, then commutativity is required.
     - **Knocks out**: Jeffrey Conditionalization is not commutative in general. Therefore, requiring commutativity would knock out Jeffrey Conditionalization. Strict conditionalization is commutative for certain evidence, but it doesn't handle uncertain evidence.

  6. **Diachronic Coherence (Dutch Book and Reflection)**
     - **Motivation**: The updating rule should not lead to diachronic incoherence, such as being susceptible to a Dutch book (a sequence of bets that lead to sure loss) or violating the Reflection Principle (that your current self should defer to your future self's beliefs). These are normative arguments for consistency over time.
     - **Non-negotiable?**: For many Bayesians, diachronic coherence is non-negotiable. However, some argue that Dutch book arguments for updating rules are not always compelling.
     - **Knocks out**: Any updating rule that is diachronically incoherent. Strict conditionalization satisfies diachronic coherence. Jeffrey Conditionalization is also diachronically coherent (if the input is a partition and rigidity is assumed) under a suitable interpretation. But if a rule does not satisfy these, it may be knocked out.

  7. **Minimal Change (Information-Theoretic Considerations)**
     - **Motivation**: When updating, we should change our beliefs as little as possible to accommodate the new evidence. This is often formalized by minimizing a divergence (like Kullback-Leibler) between the old and new distributions subject to the evidence constraints.
     - **Non-negotiable?**: This is a preference of the "minimal revision" camp (e.g., Radical Probabilism). It is not non-negotiable for everyone, but it is a common desideratum.
     - **Knocks out**: Rules that are not minimal in this sense. For example, if we require minimal change, then Jeffrey Conditionalization (which minimizes KL-divergence under the constraints of fixed partition probabilities and rigidity) satisfies it. But without rigidity, we might get a different update.

  **Note on Tensions**:
  - **Rigidity vs. Partition Invariance**: Jeffrey Conditionalization requires rigidity and uses a partition, but this leads to partition dependence. If we require partition invariance, then we must abandon rigidity as defined by Jeffrey (or at least have a more flexible invariance). This tension is a key reason for alternative approaches.
  - **Commutativity vs. Partition Dependence**: If we require commutativity, then we cannot have a rule that is partition-dependent in the way Jeffrey is, unless the partitions are chosen in a way that commutes (which is not generally the case). So commutativity and partition dependence are in conflict.

  ---

  **Brief Scoring of Main Contenders**

  1. **Strict Conditionalization**:
     - **Reduction to Strict**: Trivially satisfies (it is the base case).
     - **Input for Uncertain Evidence**: Does not handle uncertain evidence (requires probability 1).
     - **Rigidity**: Not applicable (since evidence is certain).
     - **Partition Invariance**: Not applicable (no partition involved).
     - **Commutativity**: Satisfies for consistent evidence.
     - **Diachronic Coherence**: Satisfies (immune to Dutch books).
     - **Minimal Change**: It is minimal in the sense of being the only update that satisfies the constraint (but does not handle uncertain evidence).

     **Verdict**: Only handles certain evidence.

  2. **Jeffrey Conditionalization**:
     - **Reduction to Strict**: Satisfies (when one partition element gets probability 1).
     - **Input for Uncertain Evidence**: Requires a new probability distribution over a partition.
     - **Rigidity**: Assumes rigidity of conditional probabilities given partition elements.
     - **Partition Invariance**: Fails: the update is partition-dependent.
     - **Commutativity**: Fails in general.
     - **Diachronic Coherence**: Satisfies under a diachronic Dutch book argument (if the input is the partition and the new probabilities, and rigidity holds).
     - **Minimal Change**: Minimizes KL-divergence subject to the constraints (fixed new partition probabilities and rigidity).

     **Verdict**: Handles uncertain evidence but is partition-dependent and non-commutative.

  3. **Radical Probabilism (Minimal Revision)**:
     - This camp, associated with Richard Jeffrey and further developed by others, emphasizes updating by minimizing a divergence (like KL) subject to constraints. The constraints can be more general than a partition (e.g., expectation values, likelihood ratios). The idea is to hold fixed as much as possible, but without necessarily assuming a partition or rigidity.

     - **Reduction to Strict**: Satisfies (if the constraint is that an event has probability 1, then it reduces to strict conditioning).
     - **Input for Uncertain Evidence**: Accepts various inputs (constraints) such as probabilities of events, expectations, or likelihood ratios.
     - **Rigidity**: Does not assume rigidity of conditionals. Instead, it holds fixed only what is not constrained, by the minimal change principle.
     - **Partition Invariance**: Can be achieved if the constraints are specified in a partition-invariant way (e.g., by linear constraints on probabilities). However, if the constraints are tied to a partition, then it may still be partition-dependent.
     - **Commutativity**: Generally fails for non-commuting constraints. However, if the constraints are consistent and commute, then the update might be commutative.
     - **Diachronic Coherence**: Not automatically satisfied. It depends on the constraints. If the constraints are just probabilities of events, then it might avoid Dutch books, but for more general constraints, it might not.
     - **Minimal Change**: The core principle: minimizes KL-divergence (or another divergence) subject to the constraints.

     **Verdict**: Flexible, but the challenge is to specify the constraints appropriately and to ensure coherence.

  ---

  **Conclusion**:
  The desiderata are not all jointly satisfiable. In particular:
  - If you require partition invariance and commutativity, then Jeffrey Conditionalization is ruled out.
  - Radical Probabilism (minimal revision) is more flexible but may not satisfy diachronic coherence for arbitrary constraints and does not automatically solve partition dependence if constraints are partition-based.

  The choice of updating rule depends on which desiderata one prioritizes and how one interprets uncertain evidence (e.g., as providing a distribution over a partition or as providing constraints of another form).
answer: |-
  Here's a structured breakdown of the desiderata for a theory of updating on uncertain evidence, followed by a scored evaluation of the main contenders. I focus on non-negotiable requirements, key tensions, and knockout criteria, as requested.

  ---

  ### **Desiderata for Updating on Uncertain Evidence**

  1. **Reduction to Strict Conditionalization**  
     - **Motivation**: When evidence $E$ becomes certain ($P_\text{new}(E) = 1$), the update must reduce to Bayes' rule: $P_\text{new}(H) = P_\text{old}(H \mid E)$.  
     - **Non-negotiable?** **Yes** – Failure implies inconsistency with standard Bayesianism.  
     - **Knocks out**: Theories violating this (e.g., some *ad hoc* rules). Rarely an issue for mainstream proposals.  

  2. **Input Specification**  
     - **Motivation**: What constitutes "evidence" when no event has probability 1? (e.g., observing a dimly lit cloth: is input a new probability for colors, a likelihood ratio, or a constraint?).  
     - **Non-negotiable?** **Yes** – A theory must define its inputs unambiguously.  
     - **Knocks out**: Vague or incomplete theories (e.g., some "minimal revision" approaches lacking clear input rules).  

  3. **Rigidity Requirement**  
     - **Motivation**: Jeffrey Conditionalization assumes $P_\text{new}(H \mid E_i) = P_\text{old}(H \mid E_i)$ for partition elements $\{E_i\}$. But is this necessary?  
     - **Non-negotiable?** **No** – This is a **modeling choice**. Rejecting rigidity opens alternatives (e.g., preserving likelihood ratios).  
     - **Knocks out**: Jeffrey Conditionalization itself if rigidity is rejected.  

  4. **Partition Invariance**  
     - **Motivation**: Jeffrey updating yields different results for coarser/finer partitions of the *same evidence* (e.g., $\{\text{Red}, \text{Blue}\}$ vs. $\{\text{Red}, \text{Green}, \text{Blue}\}$). A theory should explain or resolve this.  
     - **Non-negotiable?** **Debated** – Some argue it's a **bug** (updates should be partition-invariant); others see it as a **feature** (partitions reflect how evidence is conceptualized).  
     - **Knocks out**: Jeffrey Conditionalization if partition invariance is required.  

  5. **Commutativity (Order Independence)**  
     - **Motivation**: Sequential updates on evidence $A$ then $B$ should equal $B$ then $A$ if evidence is "about the same thing." Violations imply path-dependence of beliefs.  
     - **Non-negotiable?** **No** – Order dependence *can* be rational (e.g., if evidence alters the interpretation of subsequent evidence).  
     - **Tension**: Commutativity + Partition Invariance + Rigidity are **jointly unsatisfiable** in many cases. Sacrificing one is often necessary.  

  6. **Diachronic Coherence**  
     - **Motivation**: Avoid diachronic Dutch books (vulnerability to sure-loss bets across time) or violations of the Reflection Principle ("future me" should not seem irrational to "current me").  
     - **Non-negotiable?** **Yes** for normative theories – Coherence is foundational to Bayesianism.  
     - **Knocks out**: Theories violating Dutch book coherence (e.g., some "improper" priors).  

  ---

  ### **Scoring Key Contenders**

  | **Desideratum**               | **Strict Conditionalization** | **Jeffrey Conditionalization** | **Radical Probabilism (Minimal Revision)** |  
  |-------------------------------|-------------------------------|--------------------------------|--------------------------------------------|  
  | **Reduction to Strict**       | ✅ Trivial                    | ✅ Yes                         | ✅ (If constraints allow)                  |  
  | **Input Specification**       | ❌ (Only handles $P(E)=1$)    | ✅ (Input: distribution over partition) | ⚠️ (Varies; e.g., constraints or ratios) |  
  | **Rigidity**                  | ✅ (Trivially rigid)          | ✅ (Assumes rigidity)          | ❌ (Rejects rigidity; preserves only specified quantities) |  
  | **Partition Invariance**      | ✅ (No partition needed)      | ❌ (Fails: partition-sensitive)| ⚠️ (Depends on chosen constraints)        |  
  | **Commutativity**             | ✅ (Order-independent)        | ❌ (Generally order-dependent) | ⚠️ (Depends on constraints; often fails)  |  
  | **Diachronic Coherence**      | ✅ (Dutch-book coherent)      | ✅ (Coherent under rigidity)   | ⚠️ (Coherence not guaranteed for arbitrary inputs) |  

  - **Strict Conditionalization**: Only handles certain evidence. Fails **Input Specification** for uncertain cases.  
  - **Jeffrey Conditionalization**:  
    - **Knocked out by**: Partition Invariance (if required) or rejection of Rigidity.  
    - **Strengths**: Clear input, reduces to strict, coherent.  
  - **Radical Probabilism** (e.g., entropy minimization):  
    - **Knocked out by**: Nothing decisively, but struggles with **Input Specification** (constraints are user-defined) and **Coherence** (no general Dutch book proof).  
    - **Strengths**: Flexible; rejects rigidity; can enforce partition invariance if constraints are invariant.  

  ---

  ### **Key Tensions and Trade-offs**  
  - **Rigidity vs. Partition Invariance**: Jeffrey assumes rigidity → partition dependence. Reject rigidity (as Radical Probabilism does) to seek partition invariance, but this sacrifices Jeffrey's coherence guarantees.  
  - **Commutativity vs. Realism**: Order dependence may reflect rational learning (e.g., evidence recontextualizes past beliefs). Demanding commutativity may be unrealistic.  
  - **Input Clarity vs. Flexibility**: Jeffrey forces input as a partition distribution; Radical Probabilism allows general constraints but lacks unique prescriptions.  

  No theory satisfies all desiderata. Jeffrey is the most coherent for partition-based inputs but requires accepting partition dependence and rigidity. Radical Probabilism is more flexible but less principled. Commutativity is likely a dispensable "nice-to-have."
