answer: |-
  You're absolutely right—the standard "tattoos as extended memory" reading is philosophically shallow. *Memento* is a *stress test* for the Extended Mind Thesis (EMT), exposing a **critical vulnerability**: **epistemic hygiene**. Clark & Chalmers (C&C) assume trusted, reliable coupling. Leonard’s system is a **polluted cognitive ecosystem**. Let's dissect the key scenes and build your argument:

  **Core Problem for EMT:** C&C's criteria (constancy, availability, trust, past endorsement) focus on *functional integration*. Leonard’s system meets some (constancy/availability of tattoos/notes) but catastrophically fails **trust** and **authenticity of source**. The film asks: **Can an extended cognitive process be "working" while being fundamentally *epistemically poisoned*?** And what does that say about the mind?

  ### Scene Analysis & Philosophical Pressure Points

  1.  **The Foundational Tattoo: "JOHN G. RAPED AND MURDERED MY WIFE"**
      *   **The EMT "Success"?** This tattoo is constantly available, directly guiding action (his life's purpose). By EMT criteria, it *is* part of his belief-forming system.
      *   **The Film's Challenge:** This "fact" is *unverified* and potentially *planted*. Leonard *chose* to ink it based on fragmented, unreliable internal memory (his condition) and possibly external manipulation (Teddy? Himself?). The tattoo *feels* like a core belief, but its origin is murky.
      *   **Pressure Point:** EMT emphasizes *current* functional role ("belief" via guiding action), downplaying *genealogy* and *justification*. *Memento* screams: **Origins matter!** A belief etched in skin is no more inherently justified than one in a manipulated notebook. The mind extends, but so does the potential for **embedded falsehood**.

  2.  **Teddy's Polaroid: "DON'T BELIEVE HIS LIES" & "HE IS JOHN G."**
      *   **The EMT "Success"?** Leonard uses the Polaroid fluently – it directly triggers suspicion and action against Teddy. It's integrated into his decision-making *in the moment*.
      *   **The Film's Challenge:** Leonard *wrote this himself*, based on *another* unreliable source (Teddy's initial claim? His own manipulated notes?) and likely a desire to create a new "John G." target. It's **self-manipulation** masquerading as external memory. He trusts the *artifact* (the photo/note) but its content is deliberately deceptive *by his own prior hand*.
      *   **Pressure Point:** **Authorship ≠ Authenticity.** EMT doesn't require the *agent* to be the *original author* (Otto uses a notebook written by others *if trusted*). But here, Leonard *is* the author, yet the content is *designed* to deceive *his future self*. The extended system facilitates **internal epistemic sabotage**. Where does the "mind" end and self-deception begin when the deception is materially embedded?

  3.  **The Final Scene: Writing Teddy's License Plate ("FACT 6")**
      *   **The EMT "Success"?** Classic EMT! He lacks biological memory, uses an external tool (pen/photo) to record crucial information ("SG1371U") for future action. Fluent, trusted, functional coupling.
      *   **The Film's Challenge:** He's *intentionally* creating a false "fact" to give himself purpose. He *needs* the lie. This isn't a passive recording error; it's **active fabrication integrated into the cognitive loop**. The extended system isn't just storing bad data; it's *enabling and enacting* a delusion.
      *   **Pressure Point:** **The Extended Mind can be Pathological.** EMT describes a *process*, not necessarily a *rational* or *truth-tracking* one. Leonard's extended system "works" *to achieve his goal* (purpose through vengeance), but that goal is built on sand. The film reveals that extended cognition can be **perfectly functional *and* perfectly delusional**. The question shifts: Does EMT care about *truth*, or just functional success *for the agent's current goals*?

  ### Philosophical Synthesis: What *Memento* Reveals about EMT

  *   **Not a Counterexample, but a Pathological Case:** The film doesn't *refute* EMT; it shows it operating in a **dysfunctional, epistemically toxic mode**. Leonard's mind *is* extended – his tattoos and photos *are* constitutive parts of his cognitive processes. But that process is **rotten at the core**. EMT can "accommodate" this by saying the process runs on bad inputs, but this feels inadequate.
  *   **The Crucial Gap: Epistemic Hygiene / Authenticity Conditions:** C&C's "trust" criterion is too thin. *Memento* demonstrates the need for **stronger conditions**:
      *   **Source Monitoring/Authenticity:** The system needs mechanisms (internal or external) to track the *provenance* and *reliability* of externally stored information. Leonard lacks this entirely. His system has **no immune response** to cognitive parasites (others' lies) or autoimmune disorders (self-deception).
      *   **Non-Maleficence of Coupling:** The coupling shouldn't *actively facilitate* self-deception or systematic error generation. Leonard's tools make fabrication and manipulation *too easy* and integrated.
      *   **Dynamic Justification (or Lack Thereof):** EMT focuses on the *dispositional* belief state enabled by the extension. *Memento* forces us to ask about the *justification* for that dispositional belief. Is an unjustified belief stored externally still a "belief" in the same way? Or is it a *malignant cognitive artifact*?
  *   **The Blurred Line: Mind, World, and Self-Deception:** The film's genius is showing how the **materialization of memory** (skin, paper) doesn't purify it. Externalizing thought makes it *vulnerable* to external *and internal* corruption. The boundary between mind and world isn't just where cognition *happens*; it's where **truth and delusion are physically inscribed and enacted**. Leonard’s extended mind *is* his self-deception.

  ### Your Punchline for the Audience

  > "Don't let anyone tell you *Memento* simply illustrates the Extended Mind Thesis with tattoos. That's the starting point. The film's real philosophical power is as a **horror story about cognitive extension**. It shows us that when the mind spills out into the world, it doesn't leave its capacity for delusion and self-destruction behind. Clark and Chalmers gave us Otto's trustworthy notebook. *Memento* gives us Leonard's epistemically poisoned skin. It forces us to ask: **Can an extended mind be *sick*?** Can a cognitive process be perfectly extended, perfectly functional according to EMT criteria, yet be fundamentally *unhinged from truth*? The film doesn't break EMT; it reveals its terrifying implication: **The tools that extend our minds can also become the cages for our delusions, materially reinforcing the lies we tell ourselves.** It demands that EMT confront the **pathologies of extension** – the need for cognitive immune systems, for authenticity checks – if it truly wants to map the landscape of the human mind, not just its healthy habitats, but its darkest, most self-deceptive corners."

  This approach uses the film to *do* philosophy – to expose a critical ambiguity in EMT (trust vs. deep epistemic hygiene) and explore the profound consequences of minds being materially entangled with a manipulable world and our own manipulative selves. It turns Leonard's tragic system into a powerful philosophical probe.
