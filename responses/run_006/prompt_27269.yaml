  ### Adapted Superrationality Game for Your Reading Group

  #### **Core Structure**
  - **Two Rounds**: Run back-to-back with identical rules except for the payoff structure.
  - **Players**: 12 participants.
  - **Materials**: 
    - Slips of paper (one per player per round) with options: "CLAIM" or "PASS".
    - Pens.
    - A collection box/hat for anonymous submission.
    - Prizes: 
      - **Platonia Round**: One $10 gift card (or pizza topping choice if using food budget).
      - **Luring Lottery Round**: A fixed prize pool of $12 in cash (or 12 small chocolates). 
  - **Stakes**: Keep stakes real but low (e.g., gift cards, pizza influence, or extra credit). Avoid high-value prizes to prevent distress.

  ---

  ### **Rules & Instructions (Read Aloud to Group)**

  #### **Setup**
  - "We’ll play two short games. In each, you’ll secretly choose CLAIM or PASS. No talking, signaling, or seeing others’ choices. Submit slips anonymously."

  #### **Round 1: Platonia Dilemma**
  - **Rules**:  
    - "If **exactly one person** writes CLAIM, that person wins the $10 gift card (or pizza choice).  
    - If **zero or multiple people** write CLAIM, **no one wins**—everyone gets plain cheese pizza (or nothing).  
    - PASS means you forfeit winning but avoid causing a multi-claim failure."  
  - **Payoff Examples**:  
    - One CLAIM: Claimant wins $10, others get $0.  
    - Zero CLAIMs: All get $0.  
    - Two+ CLAIMs: All get $0.  

  #### **Round 2: Luring Lottery**
  - **Rules**:  
    - "If **at least one person** writes CLAIM, the $12 prize pool is **split equally among all claimants**.  
    - If **zero people** write CLAIM, **no one wins**.  
    - PASS means you get nothing, even if others claim."  
  - **Payoff Examples**:  
    - One CLAIM: Claimant gets $12.  
    - Two CLAIMs: Each gets $6.  
    - Twelve CLAIMs: Each gets $1.  
    - Zero CLAIMs: All get $0.  

  #### **Logistics**
  1. **Distribute slips** face-down. 
  2. **Set a 60-second timer** to force quick decisions (prevents hesitation-based signaling). 
  3. **Collect slips immediately** in a box; shuffle before counting. 
  4. **Announce results publicly** after each round: 
     - Platonia: Report number of CLAIMs and winner (if any). 
     - Luring: Report number of CLAIMs and prize split. 

  ---

  ### **Debrief Script**
  **Goal**: Link outcomes to superrationality, Hofstadter’s paradox, and decision theory.

  #### **After Platonia Round**
  1. **Report Results**: "We had [X] CLAIMs. Outcome: [Winner name] wins $10 / No one wins."  
  2. **Questions**:  
     - "Why did you CLAIM? Why did you PASS?"  
     - "Did you assume others would act like you? How did that affect your choice?"  
  3. **Theory Connection**:  
     - "In Platonia, superrationality says: If everyone is identical and reasons identically, you must all choose the same. If all PASS, no win. If all CLAIM, no win. Only *exactly one CLAIM* works—but how do you coordinate that without communication?"  
     - "Hofstadter’s paradox: If you think, ‘I should CLAIM because I want to be the one,’ everyone thinks that → everyone CLAIMs → failure. Yet if you PASS, hoping others solve it, they might too → failure. This is a coordination trap."  
     - "Real-world parallel: Voting in small groups where abstention spoils the outcome."  

  #### **After Luring Lottery Round**
  1. **Report Results**: "We had [Y] CLAIMs. Each claimant gets $[12/Y]."  
  2. **Questions**:  
     - "Did claiming feel safer here? Why?"  
     - "Were you tempted to PASS to ‘let others win more’? Did you trust them to do the same?"  
  3. **Theory Connection**:  
     - "Here, claiming is a **dominant strategy**: Even if others claim, you get *something* (unlike Platonia). If you expect others to claim, you still gain by claiming. If you expect no claims, you win big by claiming."  
     - "Superrationality twist: If all reason identically, all should claim → everyone gets $1. But is this better than Platonia’s $0? Hofstadter argues this structure ‘lures’ cooperation by reducing risk."  
     - "In practice, Luring Lottery often has **more claimants** because failure (multi-claim) isn’t catastrophic. But if people PASS to avoid diluting the prize, they risk total failure (0 claims)."  

  #### **Compare Rounds**
  - "Contrast the two:  
    - Platonia: High risk (win big or lose all) → often leads to failure due to coordination failure.  
    - Luring: Lower risk (always win something if you claim) → often has more claims, but dilutes rewards.  
  - Superrationality assumes identical reasoning, but real humans vary. Did anyone act ‘irrationally’? Did that help or hurt the group?"  

  ---

  ### **What Will Go Wrong (and Mitigation)**
  1. **Platonia Ruined by a Joker**:  
     - **Risk**: One person claims "as a joke," causing multi-claim failure.  
     - **Mitigation**: Emphasize stakes ("This tests rational thinking—play seriously"). Use extra credit if available to incentivize focus.  

  2. **Subtle Coordination Attempts**:  
     - **Risk**: Players hesitate, write slowly, or cough to signal intent.  
     - **Mitigation**: Enforce strict silence. Use a timer to rush decisions. Collect slips instantly.  

  3. **Misunderstanding Payoffs**:  
     - **Risk**: Confusion in Luring Lottery about split mechanics (e.g., "Do I get more if fewer claim?").  
     - **Mitigation**: Clarify with examples. Repeat rules. Use visual aids (e.g., a slide).  

  4. **Anonymity Breach**:  
     - **Risk**: Names on slips or public counting could influence future rounds.  
     - **Mitigation**: Use numbered slips (non-identifiable) and privatize results until debrief.  

  ---

  ### **What Would Change My Mind About This Design**
  - **Critical Assumption**: Players in Luring Lottery will recognize claiming as a **dominant strategy** and all (or nearly all) will claim.  
  - **Result That Would Challenge This**:  
    - **Luring Lottery has 0–3 claims**. This implies players:  
      - Misunderstood payoffs (thought claiming *reduced* others’ shares).  
      - Used Platonia reasoning ("I’ll PASS to let one person win big").  
      - Prioritized altruism/group efficiency over self-interest.  
    - **Why It Matters**: If dominant strategy fails in practice, superrationality’s real-world relevance weakens. Hofstadter’s "luring" effect relies on players *not* self-sacrificing. If altruism overrides, the paradox collapses.  
  - **Response**: Rerun with clearer payoffs. Discuss why rational agents *shouldn’t* PASS in Luring Lottery. Highlight tension between individual/group rationality.  

  ---

  ### **Final Tips**
  - **Pilot Test**: Run with friends first to fix ambiguities.  
  - **Budget Flexibility**: Use candy or pizza toppings if cash/credit is infeasible.  
  - **Time**: Each round + debrief = 20–30 mins. Total activity: 60–90 mins.  
  - **Learning Goal**: The "visceral" takeaway should be frustration in Platonia (coordination impossible) vs. guarded optimism in Luring Lottery (dominant strategy "works" but feels unsatisfying).  

  This design forces players to confront the tension between individual rationality and group coordination—exactly Hofstadter’s weirdness. Good luck!
