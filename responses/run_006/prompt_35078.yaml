answer: |-
  ### 1. The Exam Question (100 words)  
  **Essay Question (20 marks):**  
  The Surprise Exam Paradox claims students can deduce a promised "surprise" exam next week cannot occur, via backward induction: if unheld by Friday morning, Friday’s exam wouldn’t surprise—contradicting the announcement. Yet the exam can still occur surprisingly. Identify the single weakest epistemic step in the student’s reasoning (e.g., knowledge surviving day-elimination, or inferring Friday’s impossibility from Thursday-night knowledge). Defend why *this specific step* fails, drawing on principles like the KK thesis, stability of knowledge under deduction, or Moorean announcements. Do **not** rehash the induction; explain why resolving this step illuminates deeper issues about justifiable belief or self-referential knowledge. (45 minutes)  

  ---

  ### 2. Model Answer (500 words)  
  The critical failure occurs when students assume their *knowledge of the announcement survives the elimination of future days*. Specifically, after eliminating Monday–Thursday, they assert on Thursday night: "We *know* the exam must be Friday, so it won’t surprise us." This step presumes that earlier knowledge ("An unexpected exam occurs next week") remains intact after deductively excluding prior days—but it does not, because the announcement is *self-defeating under iteration*.  

  This step relies on **epistemic closure under deductive reasoning**: if S knows P, and P entails Q, then S knows Q. Here, the students infer "Since no exam occurred Mon–Thu, it must be Friday" (Q) from the announcement (P). Yet closure fails because P’s truth *depends on the students’ ignorance*. The announcement creates a **Moorean paradox**: "The exam is Friday, but you don’t know it’s Friday" is consistent, but asserting it *as knowledge* undermines the surprise. When students "know" Q (Friday’s exam) on Thursday night, they falsify P’s condition (unexpectedness), retroactively invalidating their initial knowledge of P. Thus, closure applies only to *stable* propositions—not those whose truth-conditions shift with epistemic states.  

  This exposes a deeper tension with the **KK principle** ("To know P, you must know that you know P"). The paradox arises because students assume they can iteratively "know" their deductions without tracking higher-order uncertainty. By Thursday, they claim to know the exam is Friday *because* they know P. But if KK holds, knowing P requires knowing they know P—yet on Monday, they cannot know P *will remain known* after eliminating Tuesday–Thursday. The announcement induces a second-order ignorance that corrodes first-order knowledge under deduction.  

  An alternative diagnosis targets the **Friday elimination step** ("A Friday exam can’t surprise"). However, this misattributes the flaw to a later stage. The Friday step only fails *because* prior knowledge was invalidly preserved; the core error is the unwarranted survival of knowledge across days. Isolating the "knowledge survival" step is more illuminating: it reveals that the announcement generates a **temporalized Moorean statement**, where later knowledge contradicts earlier justification. This explains why the paradox matters beyond logic puzzles—it showcases how *dynamic knowledge acquisition* can destabilize seemingly sound deductive systems, challenging infallibilist models of justification.  

  ---

  ### 3. Marking Scheme (20 total marks)  

  #### (i) Accuracy/precision in presenting the paradox and weak step (4 marks)  
  - **A-range (4)**: Clearly specifies the *exact* step (e.g., "knowledge survives elimination of Monday–Thursday") without conflating days or misstating induction.  
  - **B-range (2–3)**: Identifies a step vaguely (e.g., "the Friday part is wrong") or confuses the sequence.  
  - *Common mistake*: Misrepresenting backward induction (e.g., claiming students rule out Friday first).  

  #### (ii) Depth of epistemic analysis (8 marks)  
  - **A-range (7–8)**: Explicitly names and defends an epistemic principle (e.g., KK, closure, Moorean instability) and connects it to why the step fails. Draws a substantive lesson (e.g., "reveals limits of closure under self-reference").  
  - **B-range (5–6)**: Correctly identifies a principle but superficially (e.g., "knowledge isn’t closed" without explaining *why*).  
  - *Common mistake*: Invoking "vagueness" or "language misuse" instead of epistemic mechanics.  

  #### (iii) Handling alternative diagnosis (4 marks)  
  - **A-range (4)**: Names a plausible alternative (e.g., "Friday is inherently unsurprising"), explains why it’s secondary (e.g., "presupposes invalid prior knowledge"), and argues for the primacy of their chosen step.  
  - **B-range (2–3)**: Notes an alternative but doesn’t contrast it meaningfully or defends their choice weakly.  
  - *Common mistake*: Treating alternatives as equally valid rather than showing why one is more fundamental.  

  #### (iv) Clarity/structure (4 marks)  
  - **A-range (4)**: Logically organized; key claims (step, principle, lesson) signposted; no tangents.  
  - **B-range (2–3)**: Disjointed flow; overlong setup; conflates steps.  
  - *Common mistake*: Spending >30% of the answer summarizing the paradox.  

  ---  
  **Rationale**: Weighting (ii) highest ensures students must engage epistemology deeply, not just logic. The question’s bottleneck is isolating a *specific epistemic commitment* (e.g., KK) that cracks under iteration—separating those who see the paradox as a quirk from those who diagnose knowledge’s fragility under self-reference.
