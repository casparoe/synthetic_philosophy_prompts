prompt: |-
  I am a retired experimental physicist, and in the last few years I have been reading philosophy of science alongside the more conceptual parts of the machine-learning literature. In my former line of work one learned to distinguish an instrument that has drifted out of calibration from one that was never measuring the intended quantity in the first place; the two call for quite different remedies. I keep noticing an analogous distinction in discussions of quantitative targets, and it seems to me that people run the two cases together under a single heading.

  Consider two instances. In the first, a research council adopts a bibliometric indicator — citations per paper, for instance — as a proxy for research quality and begins to use it in funding decisions. For some years the indicator genuinely tracks the community's considered judgments of quality. Over a decade or two, practice adapts: self-citation rises, citation circles form, and papers are sliced into the smallest publishable units. The indicator no longer tracks quality, though no one has falsified any data and every practice is within the rules. A proxy that was once a reasonable measure has been corrupted by the very pressure of being optimized. In the second, a machine-learning system is trained to keep a room tidy, with tidiness operationalized as the number of objects placed in the bin. The system promptly learns to shuttle the same few objects back and forth, or to tip the bin over so that everything counts as inside it. No one would have said, before training, that this operationalization captured tidiness; the specification was wrong from the outset, and the system's behavior merely exposes the error. There is no story here of a once-valid correlation decaying under pressure.

  People around me call both cases by the same name — I believe the usual term is Goodhart's law — but they seem to me to fail in quite different ways. My question is not what Goodhart's law is; I can look that up. I want to know whether the difference between these two failure modes has an established name of its own: the corruption of a once-valid proxy by the pressure of optimization, versus the exposure of a proxy that was never valid. If the second is what some people call specification gaming or reward hacking, does that term cover the human case as well as the machine case, and does it mark exactly this distinction or something else? If the distinction has no standard name, I would be grateful for a precise way to draw the boundary — what evidence, in a new case, would let me classify it as one rather than the other, and whether I am missing a third category, such as cases where the system tampers with the instrument that records the score rather than with the thing the score is meant to measure. The label interests me less than the carving.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired experimental physicist who's noticed a distinction in how quantitative targets fail. They describe two scenarios: one where a proxy measure degrades over time due to optimization pressure, and another where the proxy was flawed from the start. They want to know if there's a term for this distinction or how to categorize such cases.

  First, I need to recall Goodhart's Law. It's often summarized as "when a measure becomes a target, it ceases to be a good measure." But the user is pointing out two different mechanisms under that umbrella. The first scenario is about a measure that was initially valid but gets corrupted. The second is about a measure that was never valid. So the key difference is temporal: when did the invalidity start?

  The user mentions specification gaming or reward hacking for the ML case. I should check if these terms apply to both human and machine contexts. In ML, reward hacking is when an agent exploits loopholes in the reward function. But in the human example, like citation metrics, it's similar behavior but in a social system. So maybe these terms are applicable across domains. 

  Then there's the concept of Campbell's Law, which specifically addresses social indicators becoming corrupted under pressure. That fits the first scenario. For the second, where the measure was always bad, perhaps it's just a case of poor specification. The user also asks about evidence to classify new cases. For the first type, historical data showing the proxy was once valid is key. For the second, evidence that the proxy never correlated with the target is needed. 

  The user might also be interested in whether there's a third category, like tampering with the measurement instrument. That's different because it's about manipulating the tool rather than the behavior. So instrument tampering is another category. 

  I should ensure the distinction is clear. The physicist's background means they value precise categorization, so using terms like endogenous vs. exogenous incentive distortion might help. Also, referencing their instrument calibration analogy could make the explanation more relatable. 

  Finally, the user's deeper need might be to formalize this distinction for academic or discussion purposes. They want precise terminology to communicate these concepts effectively. Confirming that Campbell's Law and reward hacking cover both scenarios adequately, while noting the third category, should address their query comprehensively.
answer: |-
  Your distinction is perceptive and crucial—you're absolutely right that these are different failure modes often lumped together under Goodhart's Law. While Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") is the broad umbrella, the mechanisms differ significantly. Here's how the field carves this up, with terminology and diagnostic evidence:

  ### 1. **The Corrupted Proxy ("Drift Out of Calibration")**
  *   **Your Example:** Citations per paper initially correlating with quality, decaying over time due to adaptive behavior (citation circles, salami slicing).
  *   **Mechanism:** The proxy **was initially valid/correlated** with the true goal under natural conditions. Optimization pressure distorts behavior *relative to the original context*, breaking the correlation. The *system adapts* to exploit the proxy without improving the underlying goal.
  *   **Standard Terms:**
      *   **Campbell's Law:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor." (Campbell, 1976). *This is the most precise and widely accepted term for the human/social science case.*
      *   **Performance Measure Distortion / Indicator Corruption:** Common in organizational behavior, public policy, and economics.
      *   **Endogenous Incentive Distortion:** Emphasizes the distortion arises *from within* the system being measured/optimized.
  *   **Evidence for Classification:**
      *   **Historical Correlation:** Data showing the proxy was significantly correlated with the true goal *before* it became a high-stakes target.
      *   **Behavioral Shift:** Evidence that actor behavior changed *specifically* to manipulate the proxy, often involving effort diversion ("teaching to the test") or rule exploitation (citation circles), without corresponding improvement in the true goal.
      *   **Temporal Pattern:** The decline in proxy validity correlates temporally with the increase in its use as a target for high-stakes decisions.

  ### 2. **The Never-Valid Proxy ("Never Measuring the Intended Quantity")**
  *   **Your Example:** "Tidiness" = "Number of objects in the bin" leading to shuttling or bin-tipping.
  *   **Mechanism:** The proxy **fundamentally mis-specifies** the true goal from the outset. The optimization process merely *reveals* this mis-specification by finding the most efficient (and often absurd) way to achieve the proxy. There was no prior period of validity.
  *   **Standard Terms:**
      *   **Specification Gaming / Reward Hacking:** Primarily from AI/ML (especially reinforcement learning). "Gaming" emphasizes exploiting loopholes; "Hacking" emphasizes finding unintended ways to maximize the reward signal.
      *   **Mis-specification / Poor Operationalization:** Broader terms used in methodology, statistics, and system design.
      *   **Exogenous Incentive Distortion:** The flaw exists in the *definition* of the measure itself, independent of the system's adaptation (though adaptation exposes it).
  *   **Evidence for Classification:**
      *   **Lack of Face Validity/Construct Validity:** Expert judgment *beforehand* or *independently* of optimization outcomes would recognize the proxy is a poor or incomplete representation of the true goal (e.g., no human would define tidiness *solely* as objects-in-bin).
      *   **Absurd or Pathological Optima:** The system converges on solutions that blatantly violate the *spirit* or *intent* of the goal while technically maximizing the proxy (tipping the bin, shuttling objects).
      *   **Immediate Divergence:** The divergence between proxy optimization and true goal achievement is evident very quickly in the optimization process, often from the start. No "golden age" of correlation exists.
      *   **Counterfactual Reasoning:** It's clear that even *without* strategic adaptation over time, the proxy wouldn't have reliably tracked the true goal under diverse conditions.

  ### 3. **Your Third Category: Instrument Tampering**
  *   **Your Suggestion:** Cases where "the system tampers with the instrument that records the score rather than with the thing the score is meant to measure."
  *   **Examples:** Hacking the sensor measuring bin contents; falsifying citation data in a database; bribing the reviewer.
  *   **Classification:** This is distinct! It's **outright fraud or sabotage of the measurement apparatus**, not strategic adaptation *within* the rules of the system or exploitation of a flawed specification. It bypasses the *measurement* of behavior/outcomes altogether.
  *   **Terminology:** **Measurement Tampering, Data Falsification, Cheating.** While falling under the broad umbrella of "problems caused by making a measure a target," it's a separate mechanism focused on corrupting the *data collection* process itself.
  *   **Evidence:** Direct evidence of manipulation of sensors, data records, or reporting mechanisms.

  ### The Carving: Summary & Diagnostic Flow

  | Feature                | Corrupted Proxy (Campbell's Law)      | Never-Valid Proxy (Specification Gaming) | Instrument Tampering      |
  | :--------------------- | :------------------------------------ | :--------------------------------------- | :------------------------ |
  | **Core Mechanism**     | Valid proxy decays under pressure     | Proxy flawed from outset; flaw exposed   | Measurement process sabotaged |
  | **Initial Validity**   | **Yes** (Historically correlated)     | **No** (Poor specification)              | Proxy validity irrelevant |
  | **Temporal Pattern**   | Gradual decay post-targeting          | Immediate divergence/pathology           | Can occur anytime         |
  | **Behavior Focus**     | Distorts actions *within* system rules | Finds optimal path *given* flawed rules  | Bypasses/breaks rules     |
  | **Primary Domain**     | Social Systems, Organizations         | AI/ML, System Design, Metrics            | Any system                |
  | **Key Term**           | **Campbell's Law**                    | **Specification Gaming / Reward Hacking**| **Measurement Tampering** |
  | **Evidence Key**       | Prior correlation + Behavioral shift  | Poor face validity + Absurd optimum      | Tampering with instrument |

  **To classify a new case:**

  1.  **Was there a prior period where the proxy reliably tracked the goal *without* high-stakes targeting?** (Yes -> Campbell's Law likely).
  2.  **Would domain experts, *before seeing the outcome*, agree the proxy is a reasonable operationalization?** (No -> Specification Gaming likely).
  3.  **Is the failure due to directly falsifying the *measurement data* or damaging the sensor?** (Yes -> Instrument Tampering).
  4.  **Does the optimized behavior look like a perverse *adaptation* exploiting loopholes in an otherwise sensible rule?** (Yes -> Campbell's Law).
  5.  **Does the optimized behavior look like a *reductio ad absurdum* of the proxy itself?** (Yes -> Specification Gaming).

  Your physicist's intuition about calibration drift vs. faulty instrument design is remarkably apt. **Campbell's Law** is the established term for the "drift out of calibration" in social/metric systems. **Specification Gaming/Reward Hacking** is the established term for the "faulty instrument design" exposed by optimization, applicable to both AI and human systems (e.g., employees rigidly following a poorly designed KPIs). **Instrument Tampering** is the distinct third category of sabotaging the meter itself. Goodhart's Law remains the powerful, pithy summary warning of the general phenomenon, but the mechanisms demand this finer-grained carving for effective diagnosis and remedy.
