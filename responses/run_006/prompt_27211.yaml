answer: |-
  Here is a draft joint statement designed for adversarial collaboration between a committed Robust Moral Realist (RMR) and a committed Quasi-Realist Expressivist (QRE), attempting maximal precision and neutrality in phrasing the agreements and disagreements:

  ---

  **Joint Statement: Adversarial Collaboration on Robust Moral Realism vs. Quasi-Realist Expressivism**

  **1. Agreed Claims (Substantive Concessions & Common Ground):**

      1.1  **Expressivism's Linguistic Achievement (RMR Concession):** The RMR grants that the QRE program has demonstrated, through sophisticated semantic and logical frameworks (e.g., norm-expressivism, inferentialist accounts), how moral discourse can systematically *earn the right* to the full trappings of cognitive discourse (assertoric syntax, embedding in conditionals, truth-aptness, belief-ascriptions) without requiring the metaphysical commitments of robust realism (e.g., stance-independent moral properties or facts). The surface grammar of moral thought and talk is adequately captured by QRE semantics.
      1.2  **Realism's Explanatory Ambition (QRE Concession):** The QRE grants that the RMR aims to provide a metaphysically robust *explanation* for the objectivity, authority, and mind-independence of morality, positing moral properties/facts that are part of the ultimate furniture of the world and stand in explanatory relations (e.g., grounding moral disagreement, justifying convergence under improved conditions). The RMR's project is not merely semantic but deeply explanatory.
      1.3  **Moral Motivation (Common Ground):** Both agree that competent moral judgment is *intrinsically motivating* for rational agents (internalism), and that this motivational force is best explained by the essential *conative* or *practical* element inherent in moral thought (e.g., desires, plans, commitments, endorsements). Neither party believes this intrinsic motivation logically entails the *falsity* of realism (contra simple versions of the argument from motivation).
      1.4  **Moral Disagreement - Limits of Phenomenology (Common Ground):** Both agree that the *phenomenology* of moral disagreement (feeling like one is discovering objective truth, experiencing fundamental clashes) is real and significant. However, both also agree that this phenomenology alone is *not* conclusive evidence for either realism (as it *could* be explained by strong projective attitudes) or expressivism (as it *could* be explained by access to objective properties). The *existence* of deep disagreement is neutral between the views.
      1.5  **Moral Disagreement - Convergence (Common Ground):** Both agree that convergence in moral judgment under conditions of improved information, rationality, and impartiality (Ideal Observer conditions) *would* occur to a significant degree. However, they agree that the *significance* of this convergence is disputed (see Disagreements).

  **2. Disagreements Table:**

  | Issue Area                | Robust Moral Realist (RMR) Position                                                                 | Quasi-Realist Expressivist (QRE) Position                                                                 |
  | :------------------------ | :-------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- |
  | **2.1 Truth-Makers & Properties** | Moral judgments are true or false in virtue of stance-independent moral properties instantiated in the world, which our judgments track (or fail to track). | Moral judgments express non-representational practical attitudes (e.g., plans, commitments, valuations); their "truth" consists in the correctness of these attitudes within a framework constituted by those very practical stances. |
  | **2.2 Explanatory Role**  | Stance-independent moral properties/facts play an indispensable *causal or grounding role* in explaining (at least) the convergence of moral judgment under ideal conditions, the felt authority of morality, and the possibility of fundamental moral error. | The phenomena cited by the RMR (convergence, felt authority, error) are fully explicable by the nature of our shared human sentiments, practical needs, social dynamics, and the logic of the practical attitudes we express, without invoking stance-independent properties/facts as explanatorily fundamental. |
  | **2.3 Nature of Disagreement** | Deep, fundamental moral disagreement involves a clash of cognitive beliefs about stance-independent moral properties, where at least one party is misrepresenting those properties. | Deep, fundamental moral disagreement involves a clash of incompatible practical stances or conative attitudes; resolving it requires practical negotiation or persuasion, not merely improved representation of independent facts. |
  | **2.4 Convergence Significance** | Significant convergence under ideal conditions is best explained as the result of cognitive access to stance-independent moral truths becoming less obscured. | Significant convergence under ideal conditions is best explained as the result of shared human nature and practical rationality leading to the harmonization of practical stances when biases and errors are removed. |

  **3. Cruxes: Testable (or Conceptually Resolvable) Sub-Questions**

      3.1  **Crux 1: The Phenomenology of Moral Discovery & Error**
          *   **Question:** Can the phenomenology of *discovering* a moral truth (e.g., realizing slavery is wrong after sustained reflection) or of *profound moral error* (e.g., recognizing one's past endorsement of slavery was deeply mistaken) be fully explained without positing a *representational* relation to stance-independent properties?
          *   **Concrete Case:** Consider an individual raised in a society accepting chattel slavery who, through exposure to narratives of suffering, philosophical arguments about equality, and reflection on impartiality, undergoes a profound conversion experience, feeling they have *discovered* a deep truth they were previously *blind* to.
              *   **RMR Prediction:** This phenomenology is best, and perhaps only, explained as the lifting of obscuration (bias, ignorance) allowing perception/recognition of a pre-existing stance-independent moral fact. The feeling of *discovery* and *prior blindness* tracks representational success/failure.
              *   **QRE Prediction:** This phenomenology is fully explained by the restructuring of deep-seated conative attitudes (empathy, commitment to fairness) and the realization of the practical incompatibility of slavery with these now-dominant attitudes. The "discovery" language reflects the depth of the practical commitment shift, not a new relation to an independent fact.
          *   **Bearing:** If the RMR explanation is uniquely adequate, realism gains support. If the QRE explanation suffices, expressivism is vindicated.

      3.2  **Crux 2: The Explanation of Convergence & Moral Progress**
          *   **Question:** Does the explanation of robust cross-cultural convergence on core moral norms (e.g., prohibitions on murder, theft, promise-breaking; valuing reciprocity) under conditions of increasing knowledge and impartial discourse *require* positing causal influence from stance-independent moral properties, or is it sufficiently explained by shared biological/social needs and the logic of practical reasoning?
          *   **Concrete Case:** Consider the near-universal emergence of norms against wanton killing of in-group members across vastly different human societies and historical periods, despite significant variation in other moral beliefs. Or, consider the historical trend towards condemning slavery.
              *   **RMR Prediction:** This pattern of convergence, especially on norms crucial for social cooperation and human flourishing, is best explained by the increasing recognition of stance-independent moral facts (e.g., about human dignity, harm) driven by expanding knowledge and rational discourse. The *direction* and *content* of progress point to an independent standard.
              *   **QRE Prediction:** This convergence is fully explained by the combined pressures of evolved human psychology (empathy, reciprocal altruism), the practical necessity of social coordination for survival/flourishing, and the internal logic of extending impartial concern as knowledge expands. No appeal to tracking independent properties is needed; the "standard" is immanent to the practical project.
          *   **Bearing:** If the realist's explanatory claim is indispensable, realism is strengthened. If the expressivist's explanation is complete, the realist posits an unnecessary ontological layer.

      3.3  **Crux 3: Contingency vs. Necessity of Moral Framework**
          *   **Question:** Could radically different, stable, and non-pathological forms of "moral" sensibility and practice exist (e.g., in alien intelligences or under radically different evolutionary pressures) that are fundamentally incompatible with core human moral commitments (e.g., valuing well-being, fairness), *without* constituting a fundamental moral error?
          *   **Concrete Thought Experiment:** Imagine an intelligent species (the "Kael") whose evolutionary history strongly selected for extreme competitiveness and zero-sum resource acquisition. Their stable, cooperative "morality" centrally values dominance hierarchies, the glory of overcoming rivals, and views compassion as weakness. They engage in complex "moral" discourse about honor, duty (to outcompete), and flourishing (defined by relative status), experiencing internal motivation and deep disagreement within their framework.
              *   **RMR Prediction:** The Kael are profoundly morally mistaken about core values (e.g., the disvalue of suffering inflicted for status, the lack of intrinsic worth beyond competitive success). Their framework fails to track stance-independent moral truths. Human morality is closer to those truths.
              *   **QRE Prediction:** The Kael framework, while horrifying to humans, represents a different, coherent set of practical attitudes solving *their* fundamental coordination problems and expressing *their* conative nature. Judging them as "mistaken" in a realist sense is inappropriate; it's a clash of practical stances. Human morality is "ours," not closer to an independent truth.
          *   **Bearing:** If the RMR is correct about the Kael, it strongly supports the existence of stance-independent moral facts that constrain possible valid moralities. If the QRE is correct, it demonstrates the contingency of our morality on our specific practical nature.

  **4. Likely Drafting Failure Point:**

  *   **Most Likely Sticking Point:** The RMR formulation in Disagreement 2.2 ("play an indispensable *causal or grounding role* in explaining...").
  *   **Reason:** The QRE will likely object that granting the *indispensability* of moral properties/facts in explanation, even hypothetically within the RMR column, implicitly endorses the RMR's core metaphysical claim in a way that undermines the QRE's explanatory project. They might argue it frames the disagreement as if the RMR's explanans is a *live option* needing refutation, rather than a category mistake.
  *   **Rewording Consideration:** To alleviate QRE concern, consider adding a parenthetical or footnote emphasizing that "indispensable *from the RMR perspective*" or rephrase the RMR claim as: "...posit that stance-independent moral properties/facts play an indispensable causal or grounding role...". The key is to ensure the QRE isn't signing onto a statement that implies the RMR explanans is even *potentially* valid, only that *the RMR claims it is*.

  **Crux summary:** Whether the phenomenology of moral discovery and the pattern of moral convergence are best explained by representational access to stance-independent properties or by the dynamics of practical attitude formation and the logic of conative commitments.

  ---

  **Key Design Notes:**

  1.  **Agreed Claims:** Focuses on *substantive concessions* often downplayed in debate: the RMR granting QRE's semantic success, the QRE granting RMR's explanatory *ambition* (not success), and clarifying common ground on motivation/disagreement to prevent those being used as cheap argumentative points.
  2.  **Disagreements Table:** Uses precise, "in-house" language for each column ("stance-independent properties", "tracking" for RMR; "practical attitudes", "framework constituted by stances", "express" for QRE). Each row isolates a core dimension of the dispute (Metaphysics, Explanation, Semantics of Disagreement, Significance of Convergence).
  3.  **Cruxes:** Designed to be substantive points where resolving the sub-question *would actually change minds* (or at least force significant reconsideration). The cases are chosen to be:
      *   **Phenomenology Case:** A core part of the "felt objectivity" intuition realists rely on.
      *   **Convergence Case:** A core explanandum for realism's appeal to mind-independence.
      *   **Alien Case:** A direct test of contingency vs. necessity, targeting the heart of the realism claim.
      Each side's prediction is recorded neutrally, reflecting their actual position.
  4.  **Failure Point:** Highlights a realistic tension in the *drafting process* itself, showing awareness that even this careful phrasing might hit a snag due to deep philosophical commitments.
  5.  **Crux Summary:** Distills the deepest, most fundamental issue underlying the specific disagreements: the nature of explanation for the core phenomena that make morality *seem* objective. This is the bedrock.

  This draft aims to force both sides to acknowledge the strengths of the other program and the precise location of their remaining disagreement, moving beyond talking points to identifiable, potentially resolvable (or at least testable) cruxes.
