prompt: |-
  My philosophy of medicine prof has been tossing out verdicts on cases all semester and we're supposed to reverse-engineer her theory of disease. Here's what she's said so far:

  - Type 1 diabetes: disease
  - Pregnancy: not a disease
  - Lactose intolerance in a 30-year-old of Northern European descent: not a disease
  - Myopia correctable to 20/20 with glasses: disease
  - Asymptomatic hypertension (145/95, no symptoms): disease
  - Male pattern baldness in a 50-year-old: not a disease
  - Chronic primary insomnia: disease

  Next week she's giving us presbyopia (age-related loss of near vision) in a 48-year-old who uses reading glasses and isn't particuarly bothered by it. I have to predict her verdict.

  I'm pretty sure the two live theories are naturalism (disease = biological dysfunction relative to species-typical function, Boorse-style) and normativism (disease = a state we disvalue, something harmful or undesirable). Her verdicts so far fit both, but I think presbyopia pulls them apart.

  What should I predict she'll say? Which of her earlier cases is the closest analog under each theory? And if I'm wrong and her existing verdicts genuinely underdetermine it, what principle is she adopting with each choice? Also, if I wanted to run one more case by her to settle which theory she's running for good, what should it be?

  Lead with your bottom line and then walk me through it — no preamble, no restating the question.
