answer: |-
  Here's a rigorous desiderata list for a theory of omnipotence, framed as the "spec" you requested. It identifies core problems, essential distinctions, and points of unavoidable tension that force different theoretical approaches.

  **The Core Mandate: What the Theory MUST Deliver (Non-Negotiable)**

  1.  **Handle the Stone Paradox Non-Trivially:** It must provide a coherent and non-question-begging resolution to "Can an omnipotent being create a stone too heavy for it to lift?" *Why mandatory?* This is the quintessential test case for coherence. Simply declaring it "meaningless" or "logically impossible" without a *principled reason* tied to the *nature* of omnipotence is insufficient. The resolution must illuminate what omnipotence *is*.

  2.  **Respect Logical Impossibility:** It must consistently deny that an omnipotent being can bring about *logically impossible* states of affairs (e.g., creating a married bachelor, making 2+2=5 *without redefining the terms*, existing and not existing simultaneously). *Why mandatory?* Logically impossible states are incoherent descriptions, not genuine tasks. Performing them isn't a display of power; it's nonsense. Any theory allowing this collapses into incoherence.

  3.  **Distinguish Power from Exercise:** It must clearly separate *having the power* to do X from *actually exercising* that power. *Why mandatory?* Omnipotence is about maximal capability, not constant maximal activity. God *can* create a universe but *chooses* not to (at some times, hypothetically). This distinction is crucial for free will, divine choice, and avoiding absurdities (e.g., God *must* constantly be doing everything possible).

  4.  **Distinguish Inability from Incoherence:** It must rigorously distinguish between:
      *   A genuine *inability* (lack of power) to do X.
      *   X being *incoherent* (logically impossible), meaning there *is no* "doing X" to be unable to do.
      *   X being *compatible with omnipotence but not performed* (see #3).
      *Why mandatory?* Conflating these is the root of many paradoxes and misunderstandings (e.g., the stone paradox often trades on this ambiguity).

  5.  **Define Scope Relative to "All Things":** It must specify the scope of "all things" in definitions like "able to do all things." Does "all things" mean:
      *   All logically possible things?
      *   All states of affairs?
      *   All actions?
      *Why mandatory?* The scope determines the theory's boundaries and vulnerability to paradoxes. The stone paradox directly challenges this definition.

  **Essential Distinctions the Theory MUST Preserve (Non-Collapsible)**

  1.  **Logical vs. Metaphysical vs. Physical Impossibility:**
      *   **Logical:** Contradicts laws of logic (e.g., square circle). *Must be off-limits.*
      *   **Metaphysical:** Violates necessary truths about the structure of reality (e.g., water not being H₂O, abstract objects existing necessarily). *Theory must decide if these are limits or not.*
      *   **Physical:** Violates contingent laws of nature (e.g., traveling faster than light *in this universe*). *Generally agreed an omnipotent being can override/suspend these.* The theory must clarify its stance on metaphysical impossibilities.

  2.  **Omnipotence vs. Maximal Power:** It must distinguish *absolute* omnipotence (being *the* maximally powerful being possible, capable of anything logically possible) from *relative* maximal power (merely being the most powerful being *that happens to exist*). *Why mandatory?* Only absolute omnipotence is philosophically interesting or relevant to classical theism. A merely maximally powerful being could be surpassed.

  **Problem Cases & Their Status (Hard Requirement vs. Shibboleth)**

  1.  **Changing the Past:**
      *   **Status:** **Debated Requirement.** Some views (e.g., strict immutability, certain views of time) see changing the actual past as logically impossible (like making 2+2=5). Others see it as metaphysically impossible but logically conceivable, posing a potential limit. A strong theory should *address* it clearly. *Hard requirement?* No, but failure leaves a vulnerability.
  2.  **Creating a Truly Free Creature Who Cannot Sin/Who Must Love God:**
      *   **Status:** **Core Challenge / Shibboleth.** This tests the interplay between omnipotence, divine goodness, and libertarian free will. Can omnipotence create *freedom* with *guaranteed outcomes*? Many argue "cannot sin" or "must love" is *incompatible* with genuine libertarian freedom. *Hard requirement?* Not universally. It depends on the theorist's stance on free will. If they reject libertarian freedom, it might be possible. If they accept it, this becomes a key test showing an apparent *limit* inherent in the concept of creation/freedom itself. This is often a dividing line between camps.
  3.  **Being Unable to Sin / Being Essentially Good:**
      *   **Status:** **Hard Requirement for Classical Theism.** Most theistic traditions hold that God is *necessarily* good and thus *cannot* sin. This is not a lack of power but a perfection of character. A theory *must* accommodate this inability without compromising omnipotence. Failure here is fatal for traditional views.
  4.  **Being Unable to Cease to Exist / Being Necessary:**
      *   **Status:** **Hard Requirement for Classical Theism.** God is typically conceived as a *necessary* being, whose existence is not contingent. Therefore, God cannot cause Himself to cease to exist. Like #3, this must be framed as a perfection (aseity/necessity), not a lack of power. Essential for traditional views.

  **The Inevitable Conflicts: Where Desiderata Clash (The Sorting Mechanism)**

  Here's the crux – these desired features create genuine tensions. The theory's resolution of *which tension it prioritizes* defines its camp:

  1.  **Bring About Any Possible State of Affairs vs. Unable to Sin (#1 vs. #3):**
      *   **Conflict:** "Sinful act S" is often considered a *logically possible* state of affairs/action. But classical theism requires God to be *unable* to bring about S. How can God be omnipotent if there's a logically possible action/state He cannot perform/cause?
      *   **Resolution (Camps):**
          *   **Prioritize "Unable to Sin":** Deny that "sinning" is a *genuine power* God lacks, framing it as an imperfection incompatible with His nature. Omnipotence = power to do anything *consistent with being God*. (Common Thomistic/Augustinian view).
          *   **Prioritize "Any Possible State":** Argue God *could* sin logically, but necessarily *won't* due to His nature. This preserves the scope of power but risks making goodness contingent. (Less common, some modal approaches).
          *   **Redefine "State of Affairs":** Argue truly sinful states are metaphysically impossible *for God* to cause/inhabit. (Complex modal views).

  2.  **Bring About Any Possible State of Affairs vs. Unable to Cease to Exist (#1 vs. #4):**
      *   **Conflict:** "God ceasing to exist" seems a logically possible state of affairs. But God cannot cause it. Is this a limit?
      *   **Resolution (Camps):** Similar to #1. "Self-annihilation" is either not a coherent action/power for a necessary being, or it's a logically possible but metaphysically impossible state *for God* to bring about due to His nature. The prioritization is the same.

  3.  **Bring About Any Possible State of Affairs vs. Creating Truly Free Creatures (#1 vs. #2):**
      *   **Conflict:** "A world where creature C freely chooses X" seems logically possible. Can omnipotence *guarantee* that C freely chooses X? (e.g., freely loves God). If not, is this a limit?
      *   **Resolution (Camps):**
          *   **Prioritize "Any Possible State":** Argue omnipotence *includes* the power to determine free choices (compatibilism or rejection of libertarian freedom). Then God *can* create such a creature.
          *   **Prioritize "True Freedom":** Argue that genuine libertarian freedom is *incompatible* with divine determination of choices. Therefore, God *cannot* create a world with both free creatures *and* a guaranteed specific free choice. This is not a limit on God's *power* but a *conceptual incoherence* in the request itself. (Common free will defense view).

  4.  **Immutability (Unchangeability) vs. Performing Actions:**
      *   **Conflict:** If God is absolutely immutable (unchanging), how can He *act* in time (e.g., create, respond to prayer)? Action seems to imply change (from not-acting to acting).
      *   **Resolution (Camps):** Requires sophisticated views of time, eternity, and action (e.g., God's act is eternal and simple, temporal effects are on creation, not God; or immutability refers only to essential attributes, not relational acts).

  **The Scorecard (Brief as Requested): Which Desideratum Sorts the Camps?**

  *   **The Stone Paradox:** Tests the core coherence of the theory's definition and its handling of the Power/Incoherence distinction (#4). Failure here sinks the theory.
  *   **"Unable to Sin" (#3) & "Unable to Cease" (#4):** These are the *primary drivers* for the most significant camp divisions. Theories are largely sorted by *how they resolve the conflict* between requiring God to be necessarily good/necessary and the scope of "all possible things/actions."
      *   **Camp A (Prioritize Divine Nature):** Omnipotence = power to do anything *logically possible and compatible with divine perfection/necessity* (e.g., Aquinas). Sinning/ceasing are incompatible with being God.
      *   **Camp B (Prioritize Scope of Power):** Omnipotence = power to do *anything logically possible* (full stop). God's necessary goodness/necessity means He *wouldn't* sin/cease, not that He *couldn't*. (Less common theistically, closer to some philosophical maximal power concepts).
  *   **Free Will vs. Guaranteed Outcome (#2):** Sorts camps based on their view of freedom. Does "omnipotence" extend to controlling free will? (Compatibilist/Determinist) or not? (Libertarian).

  **The Takeaway:** A robust theory of omnipotence *must* coherently resolve the stone paradox while respecting logical impossibility and the core distinctions (power/exercise, inability/incoherence). Its most defining feature, however, will be *how it navigates the inherent tension* between the maximal scope of divine power and the necessary attributes of the divine nature (goodness, necessity, aseity). The resolution of *that* conflict is what fundamentally separates the main historical and contemporary views. Your instinct that the "case closed" responses are inadequate is correct – the real philosophical work lies precisely in unpacking these tensions. Good luck with the unit!
