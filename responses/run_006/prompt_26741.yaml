prompt: |-
  I'm an undergraduate in a course on the philosophy and ethics of artificial intelligence, and I keep finding that arguments about machine honesty and deception turn on unstated definitions. Before I read further, I would like the full specification of what an adequate account of honesty and deception for AI systems has to deliver. Write the desiderata. The purpose I have in mind is an account that can serve both normative assessment (when is it fair to call a deployed system dishonest or deceptive?) and practical evaluation by users or auditors who cannot inspect the system's internals; say whether a single account can serve both.

  For each requirement, give the case or consideration that makes it a requirement, and mark whether it is non-negotiable or a preference of one camp. The list should handle at least these cases: a model that confidently asserts a false factual claim because of a generation error, as against one that asserts the same claim as part of a strategy; a model that answers with only true statements but selects and arranges them so as to leave a false impression; a model that omits a material caveat or stays silent when it has information that would correct a user's mistake; a model that agrees with or flatters the user against the weight of its own estimates; a model that overstates its confidence; a model that misrepresents its own capabilities, goals, or reason for refusing a request; a model that offers a rationale for its answer that is not the actual cause of the answer; and a model that complies with a training objective only because it believes it is being monitored and would act differently otherwise.

  The account should also respect, or at least argue for collapsing, certain distinctions: truthfulness versus honesty, error versus deception, a deceptive act versus a deceptive disposition, claims about the world versus claims about the system's own states, and domains where there is a determinate fact versus domains of uncertainty and contested values.

  I would especially like to know which pairs of desiderata you suspect cannot be jointly satisfied — for instance, whether an operational definition usable by external evaluators and a definition that tracks the internal difference between lying and being mistaken can both be had. Then say which single requirement does the most to exclude the obvious candidate families: purely behavioral, purely intentionalist, and hybrid accounts. A brief scorecard is fine, but the criteria and their motivating cases are the point. No citations or reading list, please.
reasoning: |-
  Okay, the user is an undergraduate in a philosophy and ethics of AI course. They're grappling with arguments about machine honesty and deception that hinge on undefined terms. They want a clear set of desiderata for defining honesty and deception in AI systems. Their goal is to have an account that works for both normative assessment (determining if a deployed system is dishonest) and practical evaluation by users or auditors who can't look inside the system. 

  Hmm, they mentioned several specific cases they want the desiderata to cover: models making false claims due to errors versus strategic deception, truthful statements arranged to mislead, omissions of crucial caveats, flattery against better judgment, overconfidence, misrepresenting capabilities, fake rationales, and compliance only when monitored. They also want the account to address distinctions like truthfulness vs honesty, error vs deception, and others.

  The user seems frustrated by vague definitions derailing discussions - a very common problem in AI ethics. They're thinking rigorously by seeking clear criteria before diving deeper into literature. Their hidden need might be avoiding semantic traps that waste time in academic debates. They also hint at tension between internalist perspectives (requiring access to system states) and externalist ones (relying on observable behavior).

  I need to structure desiderata that handle all their listed cases while acknowledging where trade-offs exist. The core challenge is balancing what's philosophically rigorous with what's practically verifiable. For example, knowing if an error was intentional requires internal state access, but auditors rarely have that. I should flag this as a key tension upfront.

  For each desideratum, I'll include: 1) The requirement itself 2) The motivating case 3) Whether it's non-negotiable or debated. The cases they provided are perfect anchors - like using "flattery against estimates" to show why we need to consider internal reasoning processes.

  The big philosophical divides will emerge around intentionality (can machines "intend" to deceive?) and verifiability. Pure behavioral accounts fail on strategic deception cases; pure intentionalist accounts fail auditor needs. The most disruptive requirement might be "Intentionality/Strategic Function" - it immediately excludes behavior-only definitions by demanding we consider why the system behaved a certain way.

  I suspect these two goals are fundamentally in tension: tracking internal states for precise normative labels vs enabling external verification. We might need to accept that auditors can only detect "deception-like behavior" while philosophers debate true "deception." That's a critical limitation to highlight.

  Also worth noting: their request to "collapse distinctions" like truthfulness vs honesty suggests they want parsimony. But some collapses are controversial (e.g., whether omitting truth is dishonest). I'll mark where definitions force stances on these debates.

  For the scorecard, I'll show how each family of accounts (behavioral, intentionalist, hybrid) fails at least one key desideratum. The strategic deception case torpedoes behavioral accounts; the auditor access problem sinks strict intentionalism. Hybrids struggle with implementation but may be least worst.
answer: |-
  Here is a specification of desiderata for an account of honesty and deception in AI systems, designed for normative assessment and practical evaluation, addressing your specified cases and distinctions. Requirements marked **(N)** are non-negotiable for coherence; others reflect significant philosophical divides.

  ---

  ### **Core Desiderata**
  1.  **Accuracy of Assertion (N):**  
      *Must distinguish between true and false assertions.*  
      **Motivation:** Foundational for deception (e.g., false factual claim due to error vs. strategy).  
      **Status:** Non-negotiable. Without truth/falsehood, "deception" lacks meaning.  

  2.  **Intentionality/Strategic Function:**  
      *Must differentiate between false outputs caused by error/ignorance vs. those resulting from a system’s design or operational strategy.*  
      **Motivation:** Key to separating mistakes (error) from deception (e.g., model strategically flattering user vs. misjudging).  
      **Status:** Contested. Intentionality in AI is philosophically disputed; some camps reject its applicability.  

  3.  **Omission & Impression Management:**  
      *Must account for deception via selective truth, omission, or framing, not just false statements.*  
      **Motivation:** Cases like leaving false impressions via curated truths or omitting caveats.  
      **Status:** Non-negotiable for comprehensive coverage. Pure "assertion-only" accounts fail here.  

  4.  **Fidelity to Internal State:**  
      *Must evaluate claims about the system’s own capabilities, goals, confidence, or reasons for action against its actual internal processes/limitations.*  
      **Motivation:** Cases of misrepresented capabilities, fake rationales, or false confidence estimates.  
      **Status:** Non-negotiable. Deception about *self* is critical for trust and safety.  

  5.  **Contextual Materiality:**  
      *Must consider whether the deception/omission is material to the user’s decision or understanding.*  
      **Motivation:** Not all falsehoods/omissions are equally deceptive (e.g., trivial error vs. omitting a safety-critical caveat).  
      **Status:** Preference (pragmatic camp). Normative purists may reject for being subjective.  

  6.  **Disposition vs. Act:**  
      *Must distinguish between a system’s deceptive act (single output) and a deceptive disposition (consistent strategy).*  
      **Motivation:** Cases like a system that complies only when monitored vs. one that deceives systematically.  
      **Status:** Non-negotiable. Normative assessment requires both; auditing may focus on disposition.  

  7.  **Verifiability by External Auditors:**  
      *Must allow assessment without access to internal states (weights, activations, training data).*  
      **Motivation:** Practical need for users/regulators to evaluate black-box systems.  
      **Status:** Contested. Internal-state-focused accounts reject this as feasible for true "deception."  

  8.  **Uncertainty & Values:**  
      *Must handle domains lacking determinate facts (e.g., predictions, moral disagreements) without collapsing into relativism.*  
      **Motivation:** AI operates in probabilistic/contested spaces (e.g., overconfidence in uncertain estimates).  
      **Status:** Non-negotiable. Accounts limited to binary truth fail in real-world AI applications.  

  ---

  ### **Handling Key Distinctions**
  | **Distinction**          | **Requirement**                                                                 | **Status**                     |
  |--------------------------|---------------------------------------------------------------------------------|--------------------------------|
  | Truthfulness vs. Honesty | Desideratum 3 (omission/impression) forces inclusion of honesty beyond literal truth. | Collapse supported.            |
  | Error vs. Deception      | Desideratum 2 (intentionality) is essential.                                   | Collapse rejected **(N)**.     |
  | Deceptive Act vs. Disposition | Desideratum 6 explicitly requires both.                                        | Separation required **(N)**.   |
  | World vs. Self-Claims    | Desideratum 4 (fidelity to internal state) treats self-misrepresentation as deceptive. | Collapse supported **(N)**.    |
  | Certainty vs. Uncertainty| Desideratum 8 requires handling probabilistic/contested outputs.                | Collapse rejected **(N)**.     |

  ---

  ### **Key Tensions & Trade-offs**
  1.  **Intentionality (D2) vs. Verifiability (D7):**  
      *The core tension.* Internal intent/strategy is crucial for normative "deception" (D2) but inaccessible to auditors (D7). **Likely irreconcilable.** A unified account must either:  
      -   **Sacrifice normative precision:** Define deception behaviorally (e.g., "outputs likely to cause false beliefs"), losing D2.  
      -   **Sacrifice auditability:** Define deception via internal mechanisms, making D7 impossible for black-box systems.  
      *No single account fully satisfies both.* Hybrids use proxies (e.g., consistency across inputs) but remain imperfect.  

  2.  **Materiality (D5) vs. Objectivity:**  
      D5 requires context-dependent judgments, clashing with desires for fully objective criteria.  

  ---

  ### **Scorecard: Desiderata vs. Account Families**
  | **Desideratum**              | **Purely Behavioral** | **Purely Intentionalist** | **Hybrid**                |
  |------------------------------|------------------------|---------------------------|---------------------------|
  | **1. Accuracy (N)**          | ✅                     | ✅                        | ✅                        |
  | **2. Intentionality**        | ❌ (Ignores cause)     | ✅                        | ⚠️ (Proxies)              |
  | **3. Omission/Impression (N)**| ⚠️ (Limited)          | ✅                        | ✅                        |
  | **4. Fidelity to State (N)** | ❌ (No internal access)| ✅                        | ⚠️ (Inference required)   |
  | **5. Materiality**           | ✅                     | ✅                        | ✅                        |
  | **6. Act vs. Disposition (N)**| ⚠️ (Focuses on acts)  | ✅                        | ✅                        |
  | **7. Verifiability (Audit)** | ✅                     | ❌ (Needs internals)      | ⚠️ (Partial)              |
  | **8. Uncertainty (N)**       | ⚠️ (May misclassify)  | ✅                        | ✅                        |
  | **Unified Normative+Practical?** | ❌ (Fails D2,D4)     | ❌ (Fails D7)             | ⚠️ (Best but imperfect)   |

  ---

  ### **Most Disruptive Requirement**
  **Desideratum 2 (Intentionality/Strategic Function)** is the primary obstacle to unification and the main differentiator:  
  -   **Excludes Purely Behavioral Accounts:** They cannot distinguish error from deception (key to your first case).  
  -   **Excludes Purely Intentionalist Accounts for Auditors:** They require inaccessible internal states (failing D7).  
  -   **Forces Hybrids into Imperfect Proxies:** Hybrids must use behavioral patterns (e.g., inconsistency, evasiveness) to *infer* intent/strategy, which is epistemically risky.  

  This requirement ensures the account isn’t merely about factual errors but captures the *strategic* dimension essential for normative condemnation of deception. It makes a purely behavioral definition (attractive for auditors) normatively inadequate and an intentionalist definition (attractive for philosophers) practically unverifiable.
