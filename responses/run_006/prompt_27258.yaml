answer: |-
  ### Essay Question  
  **Galen Strawson’s Basic Argument concludes that true moral responsibility is impossible. Critically evaluate this argument by addressing the following: (1) Explain why the argument’s force lies in a *regress* about self-creation, not merely the observation that one did not create oneself *ex nihilo*. (2) Demonstrate why the argument remains untouched by indeterminism—i.e., why undetermined choices would not halt the regress. (3) Identify the premise a compatibilist must reject to salvage moral responsibility, and assess whether doing so yields a conception of responsibility robust enough to support ordinary blame/resentment, or merely a "deflated" causal notion of ownership. (60 minutes)**  

  ---

  ### Model Answer (698 words)  
  Galen Strawson’s Basic Argument targets the coherence of moral responsibility by exposing a regress inherent in the concept of *self-determination*. Its core insight is not simply that we lack godlike self-creation (a trivial point), but that responsibility requires *impossible iterative self-shaping*. I argue that the regress persists even under indeterminism, and while compatibilists can reject Strawson’s premise linking responsibility for actions to responsibility for character, this leaves them with a responsibility too "thin" to ground blame.  

  **(1) The Regress vs. Bare Self-Creation**  
  Strawson’s argument begins: To be responsible for an action (A), one must be responsible for how one is (mentally) at the time of A (Premise 2). This "how one is" includes reasons-responsive mechanisms, values, or character traits that explain A. Crucially, responsibility for *being* that way requires being responsible for an *earlier* action (A-1) that shaped it (Premise 3). But responsibility for A-1 then demands responsibility for how one was *prior* to A-1, and so on infinitely (Premise 4). The regress arises because each attribution of responsibility "pushes back" the need for agency to a prior moment. This is distinct from complaining "I didn’t create myself," which implies a single creative act. Strawson’s point is that *any* moment of putative responsibility presupposes *prior* self-shaping—a structural paradox, not a failed historical event.  

  **(2) Indeterminism Doesn’t Stop the Regress**  
  The argument’s power lies in its independence from determinism. Suppose choices are undetermined—e.g., a libertarian "agent-cause" intervenes spontaneously. For the agent to be responsible for choice C, they must (per Premise 2) be responsible for the mental state (M) from which C issues (e.g., their reasons or character). But if M is *not* their responsibility (say, it appeared randomly or was shaped by prior unchosen actions), then C is not truly "theirs" in the requisite sense. Indeterminism might make C "uncaused" by prior states, but it doesn’t make M (the source of C) *self-determined*. Randomness breaks causal chains but not the regress of self-authorization: an undetermined choice still emanates from a self the agent did not sufficiently control. Thus, the argument avoids the Consequence Argument’s focus on causal necessity; it targets *ownership* of the sources of action, not the absence of alternatives.  

  **(3) The Compatibilist Escape & Its Cost**  
  Compatibilists must reject **Premise 2**: that responsibility for an action requires responsibility for "how one is." They replace this with a weaker condition: responsibility requires that the action reflect *reasons-responsive mechanisms* (Fischer) or *endorsed desires* (Frankfurt), even if those mechanisms/desires were not self-created. This yields a "deflated" responsibility: an action is "mine" if it coheres with my psychology (e.g., I identify with my desire to steal), regardless of how that psychology formed.  

  However, this compatibilist move struggles to ground *robust* blame/resentment. Strawson’s challenge is that without *ultimate* self-creation, blame targets a self shaped by factors beyond the agent’s control (genes, upbringing, luck). If I blame a thief, but his kleptomania arose from childhood trauma he didn’t choose, my resentment seems to punish him for "who he is"—precisely what Premise 2 problematizes. Compatibilists counter that their view captures *ordinary* practices: we blame people when their actions reflect *their* bad attitudes, not just causes. Yet this feels revisionist. As Watson notes, real blame often involves a "retrospective" demand that the agent *should have been different*—a sentiment that smuggles in the need for self-creation. The compatibilist notion ("the action flowed from her values") is merely causal ownership; it lacks the *desert* presupposed in resentment (e.g., "She *chose* to be this way"). Thus, while compatibilism salvages *attribution*, it cannot justify the reactive attitudes’ moral weight.  

  **Objection:** The strongest challenge comes from **P.F. Strawson** himself (in "Freedom and Resentment"). If we *suspend* the metaphysical demand for self-creation and focus on interpersonal practices, resentment might persist as a natural response to ill will—regardless of regresses. If students convincingly argue that this practice-based approach *dissolves* (not answers) Galen Strawson’s regress as irrelevant to social life, they might defend compatibilist blame.  

  ---

  ### Marking Scheme (20 marks total)  
  **A (17–20):**  
  - Clearly distinguishes the *infinite regress* from "lack of *ex nihilo* self-creation" (e.g., notes Premises 3–4 generate iterative demand).  
  - Correctly explains why *undetermined choices* don’t resolve the regress (focus on ownership of mental state *preceding* choice).  
  - Identifies **Premise 2** as the compatibilist target and assesses robustness: contrasts "causal ownership" (e.g., action caused by my values) vs. "desert-based blame" (e.g., agent could/should have authored values).  
  - Engages the "single objection" (e.g., P.F. Strawson’s practice-based reply) dialectically.  

  **B (13–16):**  
  - Explains the regress but conflates it with deterministic causation or alternative possibilities.  
  - Acknowledges indeterminism doesn’t help but doesn’t specify *why* (e.g., misses that randomness ≠ self-authorship).  
  - Rejects Premise 2 but offers superficial robustness assessment (e.g., "blame still makes sense" without addressing Strawson’s worry about luck).  
  - Treats the objection as a footnote.  

  **C (9–12):**  
  - Misstates the Basic Argument as:  
    - *Determinism-focused* (e.g., "you can’t be responsible if you lack alternatives").  
    - *Literal self-creation* (e.g., "Strawson says you must be your own cause").  
  - Fails to explain why indeterminism fails (e.g., "randomness gives freedom").  
  - Vaguely identifies "a premise" without analyzing the cost to compatibilism.  

  **D/F (0–8):**  
  - Summarizes the argument without engaging the three tasks.  
  - Major errors (e.g., claims Strawson defends compatibilism).  

  **Credit for Contrary Conclusion (A-range):**  
  To defend compatibilism robustly, students must:  
  - Reject Premise 2 *and* argue that blame requires **only interpersonal answerability** (e.g., Watson: "holding responsible is about moral dialogue, not metaphysics").  
  - Explain why P.F. Strawson’s practice-based view *dissolves* the regress as a non-issue.  
  - Show that "thin" ownership *is* sufficient for resentment (e.g., "blaming a dishonest friend targets *her* character, not her cosmic self-creation").  

  ---  
  **Rationale**: This question forces engagement with Strawson’s unique regress while precluding canned answers. The model answer and scheme reward precision on underdiscussed nuances (e.g., indeterminism’s irrelevance) and penalize conflations with familiar debates (e.g., determinism). By requiring assessment of compatibilism’s cost, it probes deeper than standard exegesis.
