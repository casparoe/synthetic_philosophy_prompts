  Here’s a sestina designed to mirror Nomic's self-amending vertigo, using the end-words **rule, change, vote, bind, paradox, game**. The permutation enacts the shifting ground of the game, culminating in the core paradox of self-entrenchment.

  **The Meta-State**

  We start with ink and parchment, first the **rule**,
  A simple scaffold meant to scaffold **change**.
  A hand goes up, proposes; then we **vote**,
  And words gain weight, a structure to **bind**.
  A flicker stirs – the nascent **paradox** –
  Is this the world, or just the **game**?

  The scaffolding itself becomes the **game**.
  A player crafts amendment to the **rule**:
  “All future shifts demand a three-fourths **vote**.”
  The table nods; they sanction this new **change**.
  Now power shifts, a tighter knot to **bind**,
  Revealing contours of the **paradox**.

  The deeper structure feeds the **paradox**.
  What meta-law can govern this self-**game**?
  “The method *itself* cannot be changed!” they **bind**,
  A keystone clause, a self-protecting **rule**.
  But ink once wet invites the next bold **change**:
  A motion flies to *lower* the needed **vote**.

  Disquiet hums. They call the crucial **vote**
  On stripping strength from that deep **paradox**.
  Can foundational bedrock bear such **change**?
  It passes. Now the shifting core **game**
  Undoes the lock, the once-unbreakable **rule**.
  Did they just sever what they meant to **bind**?

  The tension sharpens. How can players **bind**
  A world where every word demands a **vote**?
  “Immutable!” one cries, proposing **rule**
  One-O-One: “This Law *is* the **Paradox**,
  Forever fixed, the anchor of the **game**,
  Beyond the reach of any future **change**!”

  A hush descends. The ultimate **change**?
  To freeze the flow, attempt to finally **bind**
  The very essence of the living **game**.
  The ballot slips: they cast the final **vote**
  To crown this perfect, self-devouring **paradox**.
  Can *this* now stand? This absolute, last **rule**?

  *(Envoi)*
  The **paradox** stands iron-bound, a **rule**
  Defiant. Yet a whisper seeks **change** –
  “Repeal the power!” A new, doomed **vote**.
  Can they dissolve the knot they chose to **bind**?
  Constitution cracks, becomes its own **game**’s
  Undoing. Frozen law. The crashing **game**.

  ---

  **How it enacts Nomic's vertigo:**

  1.  **End-Word Permutation as Rule Change:** The strict sestina permutation (6-1-5-2-4-3, etc.) forces the relationship between the core concepts (**rule, change, vote, bind, paradox, game**) to shift with each stanza, mirroring how a rule change alters the procedural landscape for the *next* proposal and vote. The words are bound by the form, yet their context changes.
  2.  **Narrative Progression:** The poem traces a classic Nomic arc:
      *   Stanza 1: Initial rules and the act of changing them.
      *   Stanza 2: Amending the amendment rules (requiring a higher vote threshold).
      *   Stanza 3: Attempting to make the amendment rule itself unchangeable (binding the paradox).
      *   Stanza 4: Successfully changing that "immutable" rule (lowering the vote threshold).
      *   Stanza 5: Proposing a new, truly unamendable rule (Rule 101: The Paradox).
      *   Stanza 6: Passing Rule 101, creating the ultimate bind.
  3.  **The Envoi & the Paradox:** The envoi hits the crisis:
      *   Line 1: The "paradox" (Rule 101) *is* the unamendable "rule".
      *   Line 2: Someone tries to "change" the system by repealing the foundational power to amend.
      *   Line 3: A "vote" occurs on this repeal *under the rules*, including Rule 101.
      *   **The Paradox:** If the repeal passes, it would allow changing Rule 101, but Rule 101 forbids changing itself. If it fails, Rule 101 stands. Either outcome seems to violate the intended meaning of the rules. The game's logic crashes. The "constitution cracks," becoming its own "undoing." The final line emphasizes the collapse: the "game" (playful rule-making) is destroyed by becoming absolute, frozen "law," which is "no game" at all.
  4.  **Accessibility:**
      *   **For Nomic Players:** They'll recognize the specific sequence: amending voting thresholds, attempting immutability clauses, the infamous Rule 101 archetype, and the resulting constitutional crisis. The language ("meta-law," "foundational bedrock," "self-devouring paradox") speaks directly to their experience.
      *   **For Newcomers:** The core concepts are clearly introduced ("ink and parchment, first the rule," "proposes; then we vote"). The narrative arc shows the progression from simple rule-making to self-referential absurdity. The final envoi presents a clear, dramatic logical impasse ("Frozen law. The crashing game") that conveys the "vertigo" without needing prior knowledge.

  The sestina's rigid, cycling form becomes the perfect vessel for Nomic's essence: a playful, perilous dance with the rules that govern the dance itself. Good luck with the piece!
