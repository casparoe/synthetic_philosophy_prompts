  First, I need to unpack the phrase's possible meanings. The core tension is between subjectivity and objectivity. The user points out real inconsistency in how people apply this—invoking subjectivity to avoid arguments but then relying on experts or implying some works are universally better. That suggests they're looking for philosophical clarity to resolve practical disagreements. Their deeper need might be understanding whether aesthetic debates can ever be meaningful or if they're truly pointless.

  I recall Hume and Kant's theories on taste. Hume's "standard of taste" argues for informed consensus, while Kant's "subjective universality" describes judgments that feel personal but demand others' agreement. The user might be hinting at this: if people defer to experts, they're implicitly accepting Hume's view, which contradicts their use of the phrase to end arguments. The phrase "beauty is in the eye of the beholder" is often misapplied as radical subjectivism, but even its moderate forms don't fully dismiss expertise or consensus.

