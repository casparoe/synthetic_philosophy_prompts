answer: |-
  ## The Pasadena Paradox: A Genuine Thorn in Expected Value's Side?

  The Pasadena paradox presents a fascinating and unsettling challenge to the foundational tenets of expected value (EV) theory in decision-making under uncertainty. The game is deceptively simple: a fair coin is tossed repeatedly until it lands heads. Let `n` be the number of flips required. If `n` is odd, you win £(2<sup>n</sup> / n). If `n` is even, you lose £(2<sup>n</sup> / n). Calculating the expected payoff leads to the infinite series: 1 (for n=1) - 1/2 (for n=2) + 1/3 (n=3) - 1/4 (n=4) + ... . This is the alternating harmonic series, a paradigm of conditional convergence. Crucially, Riemann demonstrated that such series can be rearranged to sum to *any* real number whatsoever, or even made to diverge. Consequently, the Pasadena game seemingly lacks a well-defined expected value in the standard sense. This prompts the unsettling question: does this paradox reveal a fundamental flaw in EV theory? Examining the main lines of defence suggests that while not fatal, the paradox exposes genuine and troubling limitations.

  One common retort is that EV theory was never intended to apply to gambles lacking a well-defined expectation. Proponents argue the theory implicitly assumes absolute convergence or finite outcomes, and the Pasadena game simply falls outside its legitimate domain. Formally, this is correct; the mathematical definition of expectation requires the sum of the absolute values of the payoffs multiplied by their probabilities to converge (absolute convergence). Since the Pasadena game involves |2<sup>n</sup>/n| * (1/2<sup>n</sup>) = 1/n, summing to the divergent harmonic series, it fails this criterion. Therefore, strictly speaking, EV theory isn't "wrong" here; it's silent. However, this defence feels deeply unsatisfying. It portrays EV theory as a narrow formalism that abdicates responsibility precisely when faced with a seemingly coherent gamble – one with well-defined probabilities and payoffs for every possible outcome. If a core decision rule cannot adjudicate on such a gamble, declaring it simply "out of scope" highlights a significant practical limitation. Rational agents *will* encounter complex gambles, and a theory that offers no guidance – or, worse, suggests guidance depends arbitrarily on the order of summation – seems deficient.

  A second line of response seeks alternative methods to rank the Pasadena game. **Dominance reasoning** might be employed: could we compare it to other gambles? Unfortunately, the Pasadena game dominates no non-trivial gamble (as it yields arbitrarily large losses for some even `n`), and is dominated by every gamble offering a fixed positive return (due to the potential for huge losses). Dominance offers little purchase here. More promising are **regularisation techniques**. These aim to assign a unique value by imposing constraints on how the infinite sum is evaluated. Examples include:
  1.  **Cesàro summation:** Averaging the partial sums. For the alternating harmonic series, this converges to ln(2).
  2.  **Discounting:** Introducing a small discount factor δ (0 < δ < 1) and evaluating lim<sub>δ→1</sub> Σ ±δ<sup>n</sup>/n. This also yields ln(2).
  3.  **Weak expected utility:** Evaluating lim<sub>n→∞</sub> E[u(X<sub>n</sub>)] for a bounded utility function `u`. If `u` is concave (risk-averse), this limit exists and depends on `u`.
  These methods often converge to ln(2) or a value dependent on risk aversion. While mathematically elegant and providing *a* valuation, they feel like post-hoc fixes. Why privilege Cesàro summation over other methods? Why choose a particular discount rate or bounded utility function? The arbitrariness inherent in selecting a regularisation method mirrors the arbitrariness of rearranging the series itself, albeit now constrained by the chosen technique. It solves the practical problem of assigning *some* value but doesn't resolve the conceptual unease: the "true" expected value remains elusive and undefined within the standard theory.

  The third perspective argues that the Pasadena paradox reveals a need for a deeper fix within decision theory itself. The paradox demonstrates that the standard EV criterion is not merely incomplete but potentially incoherent when applied broadly, as it can yield contradictory recommendations based on mathematically equivalent descriptions (rearrangements). This suggests EV theory, as traditionally formulated, is insufficiently robust. Proposals for deeper fixes include:
  1.  **Incorporating convergence criteria:** Making absolute convergence (or some other strong convergence criterion) an explicit axiom of rational preference for infinite gambles.
  2.  **Refined decision rules:** Developing rules that incorporate sensitivity to the *manner* of convergence or employ concepts like "exchangeable" sequences where rearrangement doesn't alter value.
  3.  **Alternative foundations:** Exploring frameworks less reliant on infinite summation, such as finite-case extensions or theories based on stochastic dominance even in limits.
  This view acknowledges the paradox as symptomatic of a genuine theoretical lacuna.

  **Verdict: A Troubling Limitation, Not a Fatal Blow, but Demanding Evolution**

  The Pasadena paradox does indeed show that expected value theory is in *genuine trouble*, but not necessarily fatal trouble. It does not prove EV theory universally invalid. For the vast majority of finite gambles or infinite gambles with absolutely convergent series, it remains a powerful and rational tool. The "scope limitation" defence is technically accurate but practically inadequate; a robust decision theory should aspire to handle coherently defined gambles like Pasadena, not dismiss them by fiat.

  The core trouble exposed is twofold. Firstly, it reveals that the *existence* of a well-defined expectation is a non-trivial requirement that fails in plausible scenarios, rendering the standard theory mute where guidance might be sought. Secondly, and more profoundly, it demonstrates that when the expectation is merely conditionally convergent, the very concept of "expected value" becomes fragile and context-dependent. The value assigned, and thus the rational choice prescribed, becomes contingent on the arbitrary ordering of states (or the chosen method of summation/regularisation). This strikes at the heart of the theory's aspiration to provide an *objective* criterion for rational choice under uncertainty.

  While regularisation methods offer pragmatic solutions for assigning *a* value, they feel like workarounds acknowledging the underlying problem rather than resolving it within the core theory. The paradox, therefore, strongly supports the need for a deeper evolution. Expected value theory needs either explicit, fundamental axioms restricting its domain to absolutely convergent cases (rendering it less general than one might hope) or a more sophisticated framework that can intrinsically handle conditional convergence – perhaps by incorporating convergence robustness or explicit regularisation principles into the definition of rationality itself. The Pasadena paradox doesn't sink expected value theory, but it forces a reckoning, showing its standard formulation is insufficiently robust and demanding a more nuanced understanding of expectation in the realm of the infinite. It highlights that the mathematics of convergence is not merely a technical detail, but foundational to coherent decision-making.
