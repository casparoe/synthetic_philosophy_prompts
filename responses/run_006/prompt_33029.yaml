answer: |-
  Here is the collaborative document drafted by representatives of the Conventionalist (Conv) and Assurance Theorist (Assur) perspectives, reflecting good-faith adversarial collaboration:

  **Document: Points of Convergence and Divergence on the Nature of Promissory Obligation**

  **Preamble:** We, representing Conventionalist and Assurance Theorist perspectives, acknowledge a shared commitment to explaining the moral force of promises. While fundamental disagreements remain, we have identified significant areas of common ground and clarified the precise points of contention. Our goal is not to persuade each other here, but to accurately map the territory for further inquiry.

  **(1) Agreed Upon Claims (Phenomenology, Explananda, Empirical Facts):**

  1.  **Phenomenology of Obligation:** Promising typically *feels* like undertaking a distinct and strong moral obligation, distinct from merely expressing an intention or making a prediction about one's future behavior.
  2.  **Intentionality & Communication:** A promise requires a specific communicative act by the promisor, intended to be understood *as* a promise (or commitment) by the promisee. Accidental or misunderstood utterances do not constitute promises.
  3.  **Invitation to Reliance:** The act of promising functions to invite the promisee to rely on the promisor performing the promised action. The promisor understands this invitation and intends it.
  4.  **Reliance & Harm:** Promisees often (though not always) rely on promises, and broken promises often (though not always) cause harm (disappointment, frustration, material loss, undermined trust) to the promisee.
  5.  **Social Ubiquity:** Practices recognizably similar to promising exist in virtually all human societies. Coordinating future behavior is a fundamental human social need.
  6.  **Practice as Context:** Promising occurs within a broader social context. The *meaning* of the communicative act (that it counts as a promise) depends on shared social understandings (e.g., language, conventions about what counts as "giving one's word").
  7.  **Wrongness of Betrayal:** Breaking a promise is *prima facie* wrong, and this wrongness involves a specific element of betrayal or letting down the promisee, distinct from simply doing a harmful act.
  8.  **Voluntary Undertaking:** The obligation is incurred voluntarily by the promisor through their act of promising.
  9.  **Not Mere Prediction:** Promising is not merely predicting one's future action; it involves undertaking a commitment to bring that action about.
  10. **Explananda Requirement:** Any successful theory must explain the *specificity* of the obligation (why it binds to *this* particular action for *this* particular promisee), its *strength*, its connection to *reliance/harm*, and the distinctive *wrong* of betrayal.

  **(2) Disagreements Table:**

  | Point of Disagreement                  | Conventionalist Position (Conv)                                                                                                                                 | Assurance Theorist Position (Assur)                                                                                                                                                                                                 | Judgement (Substantive/Partly Verbal) |
  | :------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------ |
  | **1. Source/Foundational Basis of Obligation** | The obligation originates in and is constituted by the rules of a valuable social practice. The practice is justified by its collective benefits (coordination, trust, efficiency), and participation binds one to its internal norms. | The obligation originates in a fundamental moral principle concerning the wrongness of inducing reasonable, voluntary reliance in another person through one's intentional communicative act. The practice provides context but isn't constitutive. | **Substantive**                       |
  | **2. Role of the Social Practice**     | The practice is **constitutive**. Promising *is* defined by the practice; the obligation *is* the obligation to follow the practice's rules in this instance. Without the practice, there is no such thing as a promise or its obligation. | The practice is **facilitative/enabling**. It provides the shared linguistic and conceptual tools necessary for the core moral act (assurance-giving) to occur reliably and be understood. The *wrong* arises from the interpersonal act itself, not the practice per se. | **Substantive**                       |
  | **3. Moral Significance of "Freely Created Expectation"** | The expectation created is morally significant *primarily* because the practice *designates* its creation as the trigger for an obligation under the practice rules. The moral force derives from the justified practice, not the bare fact of expectation creation. | The act of freely and intentionally creating a legitimate expectation in another person *is itself* the fundamental moral wrong when disappointed. The practice merely standardizes *how* this assurance is effectively given and recognized. This is a core moral power/responsibility. | **Substantive**                       |
  | **4. Obligation Without Practice?**    | It is conceptually impossible. "Promise" is a practice-defined concept. An act lacking the social context of the practice cannot be a promise and cannot generate a *promissory* obligation, though it might generate other moral duties (e.g., reparation for harm caused by misleading). | It is conceptually possible (though practically difficult). If an individual clearly communicates an intention to act, specifically to invite reliance, and the context makes this understood *as* a commitment (even absent a named practice), the core moral wrong of disappointing freely invited reliance still occurs, constituting a promissory-like obligation. | **Substantive** (Key Crux)            |
  | **5. Primary "Good" Promising Serves** | The collective good of social coordination, stability, and efficiency. Individual obligations are justified as the necessary cost/mechanism for sustaining this beneficial practice ("Practice-First"). | The individual good of enabling specific, tailored reliance and assurance between individuals. The collective benefits of the practice are a valuable *byproduct* of enabling these individual moral transactions ("Interpersonal-First"). | **Partly Verbal/Emphatic** (Reflects different starting points, but both acknowledge both goods exist) |

  **(3) Cruxes: Key Tests for the Theories**

  We identify the following thought experiments as crucial for adjudicating between our views. Both sides agree these cases bear directly on the core disagreements.

  1.  **Crux 1: The "Alien Promise" (Tests: Source of Obligation, Role of Practice, Obligation Without Practice?)**
      *   **Case:** Two humans are stranded on a deserted island with no prior contact or shared culture. One (A) says to the other (B): "I understand we have no shared rules, but hear me: I *commit* to bringing you fresh water every morning. I say this specifically so you can rely on it and sleep soundly tonight, knowing water will come." B understands this clearly as A's intent. A fails to bring water without good reason, causing B distress and dehydration.
      *   **Conv Prediction:** There is no *promissory* obligation. "Commit" lacks meaning here. A may have a duty not to harm B or to compensate for misleading him (if A's utterance was deceptive), but it lacks the specific *form* and *force* of a promissory obligation generated by a social practice. The wrong is general (harm/deception), not specific promise-breaking.
      *   **Assur Prediction:** There *is* a promissory obligation. A intentionally created a specific expectation of performance in B to invite reliance. A freely undertook this assurance. Disappointing this freely invited reliance is the core moral wrong of promise-breaking, independent of a pre-existing social structure. The obligation exists.

  2.  **Crux 2: The Secret Promise (Tests: Role of Practice, Primary Good)**
      *   **Case:** A makes a sincere promise to B in strict secrecy. B is sworn to secrecy. The promise is kept or broken entirely privately. No one else ever knows the promise was made or broken. The content is such that B's reliance (or lack thereof) has no ripple effects on wider social trust or coordination. (Assume the promise is significant to B, e.g., "I promise to visit your grave every year").
      *   **Conv Prediction:** The obligation is significantly *diminished* or non-existent. The primary justification of the practice – sustaining social coordination and trust – is absent. There's no societal impact. The act lacks the full social context that constitutes a promise. Any residual duty stems from general honesty or avoiding harm to B's feelings, not promissory fidelity.
      *   **Assur Prediction:** The obligation remains **full force**. The core moral event is complete: A freely invited B's reliance through a clear communicative act understood as a commitment. Disappointing that specific expectation is the wrong, regardless of secrecy or societal impact. The interpersonal assurance and potential betrayal are what matter.

  3.  **Crux 3: The Unrelied-Upon Promise (Tests: Moral Significance of Expectation, Source of Wrong)**
      *   **Case:** A makes a clear promise to B. B, however, is deeply cynical about A and does not believe A will perform or rely on it in any way (B takes no action based on it, has no emotional expectation). A then breaks the promise. B is completely unaffected emotionally or materially.
      *   **Conv Prediction:** Breaking the promise is still wrong, but the *primary* wrong is to the *practice* itself. A violated the constitutive rule of the valuable social institution. B's lack of reliance may mitigate the harm, but the core obligation (to follow the practice rule) was breached.
      *   **Assur Prediction:** Breaking the promise is **not wrong**, or is only minimally wrong. The core wrong is the *disappointment of invited, reasonable reliance*. If no reliance was invited *or* occurred, the essential moral element is missing. A might be blameworthy for insincerity at the time of promising, but the wrong of *breaking the promise* doesn't occur without the actual (or reasonably anticipated) disappointed expectation.

  **Conclusion on the Depth of Disagreement:**

  Our collaboration confirms that the disagreement runs deep, centering on the **nature of obligation itself** and the **source of normativity** for promissory duties.

  *   **For the Assurance Theorist,** obligation arises directly from a fundamental moral principle governing interpersonal transactions: the duty not to harm others by manipulating their expectations through voluntary, intentional communicative acts. Promising is a paradigm case of exercising this moral power/responsibility. The social practice is merely a tool enabling this core moral act.
  *   **For the Conventionalist,** obligation is inherently institutional and practice-based. Normativity flows from the collective justification of the social practice. The specific obligation to keep a promise *is* the obligation to follow the rules of this valuable institution. The interpersonal dynamics of expectation and reliance are consequences *of* the practice's rules, not their independent moral foundation.

  While the **moral significance of freely created expectations** is a major point of contention (Crux 3), it is a manifestation of this deeper divide about whether obligation is fundamentally *interpersonal* and grounded in dyadic moral powers (Assur) or fundamentally *institutional* and grounded in the collective justification of social practices (Conv). Settling the Cruxes (especially 1 & 2) would force one side to significantly revise their core account or provide compelling reinterpretations of the cases.
