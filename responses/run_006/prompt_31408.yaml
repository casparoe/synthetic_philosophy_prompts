answer: |-
  ### Which View of Imprecise Probability Do You Actually Hold?  
  *A Quiz for Decision-Makers Under Ambiguity*  
  *Answer based on your honest reaction to each scenario. Choose the option closest to your view.*  

  ---

  #### **Question 1: The Two-Urn Choice**  
  You face two urns:  
  - **Urn A** has exactly 50 red and 50 blue balls (50% red).  
  - **Urn B** has 100 red and blue balls, but the ratio is unknown (could be 0–100% red).  
  You win $100 if you draw a red ball. Which urn do you choose?  
  A. Urn A (known 50%).  
  B. Urn B (unknown ratio).  
  C. I’m indifferent.  

  #### **Question 2: Honest Reporting**  
  You’re asked for the probability it will rain tomorrow. Based on your evidence, all you can honestly say is that it’s between 30% and 60%. A colleague insists you must give a single number for a model. What do you do?  
  A. Pick a single number in the range (e.g., 45%).  
  B. Report the range (30–60%) and explain it’s the only honest answer.  
  C. Refuse to give any number and say, “I can’t assign one.”  

  #### **Question 3: Learning Widens the Range**  
  You estimate the probability of a factory accident next year at 10–20%, based on safety reports. Then you learn the reports might understate risks by 0–10% due to incomplete data. What is your new estimate?  
  A. 10–30% (the uncertainty increased).  
  B. 10–20% (the new flaw doesn’t change my range).  
  C. I can’t assign a range now—the data is too unreliable.  

  #### **Question 4: Overlapping Investments**  
  You invest $10,000 in one of two projects:  
  - **Project X**: Expected return between $400 and $600.  
  - **Project Y**: Expected return between $500 and $700.  
  The ranges overlap, and neither contains the other. How do you choose?  
  A. Project Y (its worst case, $500, beats X’s $400).  
  B. Project X (it has less uncertainty; range width $200 vs. $300).  
  C. Both are reasonable—I could flip a coin or pick arbitrarily.  

  #### **Question 5: Betting on Blue**  
  Same two urns as Question 1 (Urn A: 50/50; Urn B: unknown ratio). Now you bet on drawing a *blue* ball. Which urn?  
  A. Urn A (known 50%).  
  B. Urn B (unknown ratio).  
  C. Indifferent.  

  #### **Question 6: The Risky Bet**  
  You’ve said Event Z’s probability is between 30% and 60%. Someone offers you a bet: win $100 if Z happens, lose $100 if not. Do you take it?  
  A. Yes (for some probabilities in the range, it’s profitable).  
  B. No (for some probabilities, it’s a net loss).  
  C. I’d need a single probability to decide.  

  #### **Question 7: Updating Imprecision**  
  Your prior probability that a coin is biased (always lands heads) is 20–40%. You flip it once and get heads. If it’s fair, it has a 50% heads chance. What is your posterior probability of bias?  
  A. A single number (e.g., I’d update to ≈46% using the prior midpoint).  
  B. A range (≈33–57%, calculated from the prior range).  
  C. I’d keep the prior range (20–40%)—the evidence doesn’t reduce imprecision.  

  #### **Question 8: Job Offer Dilemma**  
  Choose between two remote jobs:  
  - **Job A**: Salary $70K–$90K, commute 20–30 mins. You value time at $1/min.  
  - **Job B**: Salary $80K–$100K, commute 40–60 mins.  
  Total compensation (salary minus commute cost) ranges:  
  - Job A: $70K – $30 = $40K to $90K – $20 = $70K → **$40K–$70K**.  
  - Job B: $80K – $60 = $20K to $100K – $40 = $60K → **$20K–$60K**.  
  Ranges overlap; neither contains the other. How do you choose?  
  A. Job A (its worst case, $40K, beats Job B’s $20K).  
  B. Job B (its best case, $60K, beats Job A’s $70K? Wait—no, but maybe I value salary more).  
  C. Both are defensible—I might pick either arbitrarily.  

  #### **Question 9: Avoiding Information**  
  You have a precise 40% probability for an event. You’re offered free information that will tell you if the probability is “higher” (30–50%) or “lower” (10–30%). You care only about making better decisions. Do you accept?  
  A. Yes—more information is always better.  
  B. No—it could replace my precise probability with a wider range, making decisions harder.  
  C. It depends on the specific decision I face.  

  #### **Question 10: Combining Uncertainties**  
  Event A has probability 30–50%, Event B (independent of A) has 40–60%. What is P(both A and B)?  
  A. 12–30% (0.3×0.4 to 0.5×0.6).  
  B. 30–50% (using rough averages).  
  C. 0–50% (ignoring independence or distrusting ranges).  

  ---

  ### Scoring Key  
  Tally your answers and match the pattern to a position. Positions are based on formal views in decision theory:  

  #### **I. Precise Probabilism (PP)**  
  *Always use a single probability; ranges reflect poor thinking.*  
  - **Answers**: 1A or 1C, 2A, 3B or 3C, 4A or 4B, 5A or 5C, 6C, 7A, 8A or 8B, 9A, 10B or 10C.  
  - **Logic**: You avoid or reject imprecise probabilities, force single numbers, and see ambiguity as resolvable.  
  - **Label**: "Sharp Subjective Bayesian" (if you update precisely) or "Objective Bayesian" (if you demand precise priors).  

  #### **II. Permissive Imprecision (PI)**  
  *Sometimes a range is honest, sometimes a number is fine—it’s context-dependent.*  
  - **Answers**: Mix of precise and imprecise choices. Key signs: 2A or 2B, 3A, 4C, 7A or 7B, 9A or 9C, 10A or 10B.  
  - **Logic**: You flexibly use ranges or numbers based on evidence, but don’t insist ranges are mandatory.  
  - **Label**: "Ecumenical Imprecisionalist" (unnamed; rare in literature).  

  #### **III. Mandatory Imprecision (MI)**  
  *When evidence is incomplete, you must use a range. Choose based on your decision rule:*  

  - **MI-Worst-Case (Maximin)**  
    *Choose options with the best worst-case outcome.*  
    - **Answers**: 1A, 2B or 2C, 3A, 4A, 5A, 6B, 7B or 7C, 8A, 9B, 10A.  
    - **Logic**: You avoid ambiguity (e.g., prefer known urns, reject risky bets) and optimize for safety.  
    - **Label**: "Maximin" (Ellsberg-style ambiguity aversion).  

  - **MI-Undominated (E-Admissibility)**  
    *Reject an option only if another beats it across all probabilities in your range.*  
    - **Answers**: 1C, 2B, 3A, 4C, 5C, 6A, 7B, 8C, 9A or 9C, 10A.  
    - **Logic**: You accept ambiguity, keep multiple options if neither dominates, and might randomize.  
    - **Label**: "E-Admissibility" (Levi, Seidenfeld).  

  - **MI-Admissible-Prior (Γ-Maximization)**  
    *Keep an option if it’s best for at least one probability in your range.*  
    - **Answers**: Same as MI-Undominated—*this quiz cannot reliably separate it from E-Admissibility*.  
    - **Logic**: Coherent with E-Admissibility; both tolerate indeterminacy.  
    - **Label**: "Γ-Maximization" (Gardenfors, Sahlin).  

  #### **Flagged Notes**  
  - **Unseparated Positions**: MI-Undominated and MI-Admissible-Prior often yield identical answers. The quiz cannot split them cleanly.  
  - **Rare/Incoherent Patterns**:  
    - **PI with worst-case decisions** (e.g., 2A + 4A + 6B): Permissive on beliefs but rigid in decisions. Rare—why allow ranges if you always minimize regret?  
    - **PP with inconsistent updating** (e.g., 7A + 3C): Demands precision but avoids learning. Logically coherent if you distrust new evidence, but unusual.  
  - **Unnamed Leaves**:  
    - PI has no standard name—it’s a pragmatic middle ground.  
    - Maximax (always optimistic: e.g., 1B, 4B, 5B, 8B) is rare and unnamed here; it maps to "other."  

  ---

  ### Confidence and Uncertainties  
  I’m **85% confident** in these distinctions and labels. They match classic problems (Ellsberg, Levi, Walley) and isolate core disagreements.  
  - **Strongest**: The Two-Urn (Q1/Q5) cleanly splits PP/MI-Worst-Case from others.  
  - **Weakest**: Separating MI-Undominated from MI-Admissible-Prior (Q4/Q8). Both permit overlapping choices, so answers don’t differ enough. I’m least sure about scoring for PI—it’s flexible, so patterns vary widely.  

  *Discuss, debate, and discover where your group stands!*
