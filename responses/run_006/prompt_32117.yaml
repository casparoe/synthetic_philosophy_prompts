          The classic leveling down is destroying the 10 without giving it to anyone. That would take State B [20,0] to [10,0] (State C) which we saw is worse.

          So where is the leveling-down objection for prioritarianism? Brown seems to be making a different point: that prioritarianism does not necessarily avoid the implication that inequality is bad in a way that the egalitarian would want. But that is not the leveling-down objection.

       After more reflection, I recall that the argument by Persson and Brown is that prioritarianism might be vulnerable to a leveling-down objection when we consider the *average* prioritarian view and when we have variable populations. 

       Example for average prioritarianism:
          State A: [10, 10] (n=2) -> average: (f(10)+f(10))/2 = f(10)
          State B: [10] (n=1) -> average: f(10)

          So the average prioritarian is indifferent between a two-person society with [10,10] and a one-person society with [10]. Now, if we level down State A by removing one person (leaving [10]), we get State B. This is a leveling down in the sense that we are making one person disappear (so the remaining one is at 10, but the other is gone). The average prioritarian value is the same. So they are indifferent. But note: the egalitarian might also be indifferent? Because there is no inequality in either state. However, the utilitarian would prefer State A (total utility 20) over State B (10). 

          But the leveling-down objection is about making people worse off without making anyone better off. In this case, we made one person disappear (which is very bad for that person) and the other remains at 10. So it's not that we just made one person worse off without helping anyone? We made one person cease to exist. This is a different issue (the non-identity problem?).

       Alternatively, consider:
          State A: [20, 20] (n=2) -> average prioritarian: (f(20)+f(20))/2 = f(20)
          State B: [20, 10] (n=2) -> average prioritarian: (f(20)+f(10))/2

          Since f is concave, we have f(20) > (f(20)+f(10))/2? Actually, no: 
            f(20) = (2f(20))/2 > (f(20)+f(10))/2   if and only if 2f(20) > f(20)+f(10)  <=> f(20) > f(10) which is true.

