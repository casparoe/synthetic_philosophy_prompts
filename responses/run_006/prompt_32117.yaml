            A: [u, u] (n people, all at utility u)
            B: [u, u, ..., u] (m people, all at u)   [same as A?]

          Actually, he considers:
            A: a population of n people all at u.
            B: a population of m people all at u (and m≠n).

          For the average prioritarian, the value of A is f(u) and of B is f(u). So they are equally good.

          Now, suppose we start in a state that is a mix: 
