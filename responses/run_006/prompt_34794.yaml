prompt: |-
  so ive been reading quine's bit about the linguist and the native and the rabbit, and i keep coming back to this one move he makes. the way he sets it up, the linguist can get "gavagai" as an observation sentence pretty much sorted out—stimulus meaning lines up with "lo, a rabbit" and all that. then he says but you still cant tell whether "gavagai" refers to rabbits or undetached rabbit parts or temporal stages of rabbits, so reference is inscrutable, and then from there we get the full-on indeterminacy of translation where whole translation manuals can be incompatible but equally right. i want an argument that the second step doesnt actually go through—that the inscrutability of reference at the level of terms doesnt give you indeterminacy at the level of whole sentences or translation manuals, because when you actually translate a whole sentence you never have to settle the reference of a term independently of the contribution it makes to the sentences truth conditions, and two manuals that assign different referents to "gavagai" but agree on all observation sentences arent genuinely rival manuals, theyre just notational variants of the same one. so please argue that quines slide from inscrutability of reference to indeterminacy of translation relies on a picture of how translation manuals work that he never actually defends, and that a more holistic picture of translation blocks the inference. basically i want the case for why gavagai is a problem for reference but not for meaning.
