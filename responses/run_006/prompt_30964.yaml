prompt: |-
  I've been going down rabbit holes on AI safety stuff—mostly forum posts and a couple papers I half-understand—and one thing I can't settle is whether "avoid side effects" is even a coherent thing to ask an AI to do on its own. So here's what I want: your actual credence, a number between 0 and 1, that you can define "avoid side effects" for an AI in a way that's actually usable, without first handing it a full specification of everything humans value. By "actually usable" I mean a concrete agent could be built to follow it and would avoid catastrophic side effects in novel situations, not just toy examples. And I don't want "it depends"—I want the number and the reasoning in pieces.

  Break the question into the sub-questions your number rides on, give each a rough probability and a line or two of why, and show how they combine into the final number. Some I keep getting stuck on: (1) can you even separate intended effects from side effects without already having the goal specified; (2) any measure that tries to keep the world close to what it would have been has to pick what counts as close, and doesn't that choice smuggle values back in through the baseline your comparing against; (3) maybe a full value spec isn't needed because a partial or relative one is enough; (4) maybe the whole framing is wrong and the real crux is something I'm not seeing. Feel free to replace any of these with better ones.

  Then tell me which sub-question your final number is most sensitive to—the one where being wrong about it would move the whole thing the most—and what kind of argument or result would actually shift it for you. If you think I've carved the question up badly, give me the carve you'd use instead.
