  **(3) No Non-Arbitrary Threshold (70%)**  
  *Justification:* Lexical or threshold views face the "spectrum argument" (e.g., where to draw the line between "barely worth living" and "zero value" when well-being differences are continuous), rendering any fixed cutoff philosophically arbitrary.

  **(4) Psychological Explanation > Axiological (65%)**  
