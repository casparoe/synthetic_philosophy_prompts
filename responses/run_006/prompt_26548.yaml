  (4) addresses why the conclusion feels repugnant. Psychological explanations like scope insensitivity make sense. People struggle with large numbers, and the status quo bias makes the large population seem worse. But maybe there's an actual axiological reason. I'd say 65% confidence in the psychological explanation.  

