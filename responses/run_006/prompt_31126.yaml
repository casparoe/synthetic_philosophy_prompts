prompt: |-
  In my government class we have been studying populism, and one of my classmates keeps defending populist leaders by saying they are the only ones who truly carry out "the will of the people." I suspect the phrase is doing more work in his argument than it can bear, but I cannot yet say exactly what it would have to mean for his argument to succeed. Please take the role of a professional political philosopher and think carefully. First, brainstorm several distinct things someone might mean by "the will of the people" when they use it to justify a policy or a leader: consider who counts as "the people," how the people's will could be identified (elections, opinion polls, protests, referendums, a leader's claim to intuit it, or something else), and whether the will must be informed, stable, and internally consistent. Then write exactly five numbered items, with no introduction or conclusion. Each item should be one or two sentences and should do three things: state one precise reading of the slogan, classify that reading as trivial, substantive, or false, and say whether that reading would actually support the conclusion that representatives or leaders are obligated to follow it.
reasoning: |-
  Okay, the user is in a government class studying populism and has a classmate who defends populist leaders by claiming they carry out "the will of the people." The user suspects this phrase is being overused but isn't sure how to articulate why. They want me to take on the role of a political philosopher to break down what "the will of the people" might mean.

  First, I need to brainstorm different interpretations of "the will of the people." Key aspects to consider include who counts as "the people," how their will is identified, and whether that will needs to be informed, stable, and consistent. The user specifically wants five numbered items, each defining a precise reading of the slogan, classifying it as trivial, substantive, or false, and stating whether it obligates leaders to follow it.

  Considering different interpretations: First, the simplest one would be majoritarian electoral outcomes. That seems straightforward—leaders are elected by majority vote. But this is trivial because it's just a basic principle of democracy. It would support the obligation to follow it, but only in procedural terms.

  Another angle: direct democracy through referendums. This is substantive because it bypasses representatives. It would support the obligation argument since it's a direct expression.

  Then there's the idea of latent common interests—what people would want if fully informed. This is substantive but tricky to measure. It might not actually support the obligation because leaders could claim to know better than the people themselves.

  What about the leader's claimed intuition? Like a populist saying they just "feel" the people's will. That seems false because it's unverifiable. It could justify ignoring actual expressions of will, so it doesn't support the obligation in a democratic sense.

  Lastly, the aggregated preferences through polls. This is substantive and dynamic. It might create an obligation, but polls can be volatile, so following them rigidly could be problematic.

  I need to ensure each point is concise—one or two sentences. Also, classifications: trivial for obvious truths, substantive for meaningful but debatable, false for incorrect assumptions. And clearly state if it supports the obligation.

  The user's deeper need might be to critically engage with populist rhetoric. They probably want to challenge their classmate's argument by showing that "will of the people" is ambiguous and not a straightforward mandate. Highlighting how different interpretations affect democratic legitimacy could empower the user in debates.

  Making sure the responses are neutral and philosophical, avoiding bias. Each item should stand alone, no intros or conclusions as requested. Let me structure the five points clearly.
answer: |-
  1. **Majoritarian electoral outcomes**: "The will of the people" means the preference expressed by a simple majority of eligible voters in a free and fair election for a specific leader or party. *Substantive*. This reading supports the conclusion that elected leaders are procedurally obligated to govern as representatives of that majority, based on their mandate.

  2. **Direct democratic consensus**: "The will of the people" refers to a clear, stable majority preference revealed through mechanisms like referendums or initiatives on specific policies. *Substantive*. This reading supports the conclusion that representatives are obligated to implement those specific policy outcomes directly, bypassing representative deliberation.

  3. **Latent common interest**: "The will of the people" signifies the objective, long-term interests of the citizenry as a whole, which the people *would* hold if fully informed and rational, regardless of their current expressed preferences. *Substantive*. This reading does *not* inherently support the conclusion that leaders are obligated to follow *expressed* preferences, as it allows leaders to claim superior insight into the people's "true" will, potentially overriding actual opinions.

  4. **Leader's claimed intuition**: "The will of the people" is defined solely by a leader's assertion that they uniquely embody or intuitively understand the authentic desires of the "real people" (often excluding dissenting groups). *False*. This reading does *not* support the conclusion that leaders are obligated to follow any independently verifiable popular will, as it makes the leader the sole arbiter and source of legitimacy, decoupled from empirical evidence.

  5. **Aggregated contemporaneous preferences**: "The will of the people" is the statistically measurable aggregation of individual citizen preferences at a given moment, typically identified through opinion polls on specific issues. *Substantive*. This reading supports the conclusion that representatives *should* feel obligated to follow these expressed preferences closely to be responsive, though the volatility and potential inconsistency of such preferences complicate a strict obligation.
