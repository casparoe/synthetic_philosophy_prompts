answer: |-
  Here are the five most important implications of the unilateralist's curse for your procedures:

  1.  **Settled:** **Procedures must explicitly distinguish between actions that are *officially permitted* to be taken unilaterally (policy) and those that *merely lack a formal barrier* to being taken unilaterally (practice).** The curse's structural risk is significantly higher for the latter, where unilateral action is an unintended loophole rather than a deliberate design choice, demanding specific safeguards like default consultation requirements or cooling-off periods.

  2.  **Settled:** **Formal procedures should create common knowledge that any unilateral action binding the group is *highly visible and immediately known* to all other members.** This common knowledge structurally blunts the curse by deterring unilateral action (as the actor knows others will know and can react) and enabling rapid collective response to reverse or mitigate actions if needed.

  3.  **Contested:** **For actions *not* officially designated as unilateral under policy, procedures should establish a strong default *presumption against unilateral action* requiring justification for override.** While the curse structurally implies such a presumption reduces rash action, it's contested whether this should be a formal rule (potentially stifling initiative) or a strong cultural norm reinforced by procedure (relying on common knowledge of the curse itself).

  4.  **Contested:** **Procedures should facilitate generating common knowledge about *individual member thresholds for action* (e.g., risk tolerance, urgency perception) regarding sensitive decisions.** While the curse structurally arises from differing thresholds, it's contested whether explicit sharing improves collective rationality by calibrating expectations or paradoxically triggers the curse by revealing who is most likely to act unilaterally.

  5.  **Settled:** **Procedures must include mechanisms for *rapid collective review and potential reversal* of any unilateral action taken, regardless of whether it was policy-sanctioned or merely de facto.** The curse structurally implies damaging actions *will* occur; minimizing their binding impact necessitates clear, pre-agreed paths for the group to collectively reassess and rescind commitments made by one member.
