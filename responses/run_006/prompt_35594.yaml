  ### I. Agreed Claims

  We both accept the following claims about the standard thought experiments in anthropic reasoning:

  1. **God's Coin Toss (GCT) Setup**: 
     - A fair coin is flipped by a hypothetical agent (e.g., "God"). If heads, one observer is created in a room. If tails, ten observers are created in ten separate rooms. You are one of the created observers and find yourself in a room. The question is: what credence should you assign to the coin having landed tails?

  2. **GCT: What it isolates**: 
     - The case is intended to isolate the impact of the number of observers on rational credence, independent of other factors (e.g., indexical information about which room you are in). Both sides agree that the case is well-posed for this purpose.

  3. **GCT: Common Misconceptions**:
     - Both sides agree that it is a misconception to think that the mere fact of your existence (i.e., that you are an observer) is irrelevant to the reasoning. However, we disagree on how exactly it should factor in (see disagreements).

  4. **Doomsday Argument (DA) Setup**:
     - Suppose we consider the total number of humans who will ever exist. We are at an early rank (say, among the first 100 billion). The DA argues that this observation is more likely under the hypothesis that the total number of humans is small (e.g., 200 billion) than under the hypothesis that it is large (e.g., 100 trillion), and thus we should update in favor of the smaller total.

  5. **DA: What it isolates**:
     - The DA isolates the effect of one's birth rank on the probability of the total duration of the human species. Both sides agree that the argument is about updating probabilities based on one's temporal position.

  6. **DA: Common Misconceptions**:
     - Both sides agree that it is a misconception to confuse the DA with claims about inevitable doom or to ignore the role of prior probabilities. The argument is about Bayesian updating, not determinism.

  7. **Presumptuous Philosopher (PP) Setup**:
     - Two theories are proposed: Theory A predicts that the universe contains 1 billion observers. Theory B predicts that it contains 1 trillion observers. The theories are equally likely a priori. A philosopher, without any empirical evidence, claims that Theory B is overwhelmingly more likely because there are more observers under it.

  8. **PP: What it isolates**:
     - The case is intended to isolate the role of the expected number of observers in theory selection. It tests whether the mere number of observers predicted by a theory should affect its probability.

  9. **PP: Common Misconceptions**:
     - Both sides agree that it is a misconception to think the PP is about empirical evidence. It is purely about the prior probability assigned to theories based on their predicted number of observers.

  ### II. Disagreements Table

  We disagree on the following key issues. We present each issue neutrally, then state our respective positions in a way we each endorse.

  | Neutral Issue Statement | SSA Defender's Position | SIA Defender's Position |
  |-------------------------|-------------------------|-------------------------|
  | **The evidential impact of one's own existence in GCT** | SSA: My existence as an observer does not by itself provide evidence that there are more observers. In GCT, I should condition on being one of the actually existing observers and use the fact that I am equally likely to be any of them. This leads to a credence of 10/11 for tails. | SIA: My existence as an observer provides evidence that there are more observers because there are more observers in the tails scenario. In GCT, I should multiply the prior probability of each outcome by the number of observers it contains. This leads to a credence of 1/2 for tails. |
  | **The validity of the Doomsday Argument** | SSA: The DA is valid. Given that I am a random sample from all humans who will ever exist, finding myself among the first 100 billion provides evidence that the total number is small. | SIA: The DA is invalid. My existence as an early human is not evidence for a small total number because the probability of existing at all is higher if there are more humans. Thus, the DA update is canceled. |
  | **The Presumptuous Philosopher's conclusion** | SSA: The PP's conclusion is absurd. We should not assign higher prior probability to a theory just because it predicts more observers. Our prior should be based on the theory's simplicity or other non-observational features. | SIA: The PP's conclusion is correct. If two theories are equally likely a priori and one predicts more observers, then upon learning that I exist, I should assign higher probability to the theory with more observers because my existence is more likely under that theory. |

