  ### Joint Statement on Anthropic Reasoning  
  **After One Year of Adversarial Collaboration**  
  *By a Defender of the Self-Sampling Assumption (SSA) and a Defender of the Self-Indication Assumption (SIA)*  

  We have engaged in sustained, good-faith collaboration to clarify our disagreements and agreements on anthropic reasoning. While we remain committed to our respective positions, we present this document to:  
  - Articulate shared understandings of key thought experiments;  
  - Disclose unresolved disagreements neutrally;  
  - Identify empirically testable cruxes;  
  - Note where language may obscure substance.  

  This statement reflects our mutual commitment to precise, non-caricatured formulations. We agree on the *setup* and *purpose* of core cases but diverge on their *interpretation*.  

  ---

  ### I. Agreed Claims  
  We jointly endorse the following numbered claims about each case:  

  1. **God’s Coin Toss (GCT)**  
     - **Setup**: A fair coin is flipped. Heads creates 1 observer; tails creates 10 observers. You awaken in a room with amnesia, knowing this setup.  
     - **Purpose**: Isolates how observer count affects credence in unobserved events (e.g., the coin flip), absent indexical information (e.g., room identity).  
     - **Common Misconceptions**:  
       - The case is not about whether you *exist* (both outcomes guarantee an observer exists).  
       - It is not solvable by purely non-anthropic priors (e.g., ignoring observer-count effects).  

  2. **Doomsday Argument (DA)**  
     - **Setup**: Humans are assigned random birth ranks from 1 to \(N\), where \(N\) is the total humans ever born. You observe your rank \(n\) (e.g., \(n \approx 100\) billion) and weigh "early doom" (\(N = 200\) billion) vs. "late doom" (\(N = 100\) trillion).  
     - **Purpose**: Tests whether a low birth rank \(n\) is evidence for a small \(N\).  
     - **Common Misconceptions**:  
       - DA is not a claim of *inevitable* doom; it is a Bayesian update from birth rank.  
       - It does *not* require assuming you are a "random sample" from all *conceivable* observers—only from actual observers in your reference class.  

  3. **Presumptuous Philosopher (PP)**  
     - **Setup**: Two theories, A and B, have equal prior probability. Theory A predicts \(10^9\) observers; theory B predicts \(10^{12}\) observers. No empirical data exists. The philosopher claims theory B is \(\gg 50\%\) likely.  
     - **Purpose**: Examines whether observer count alone (without data) can dominate priors.  
     - **Common Misconceptions**:  
       - PP is not about empirical evidence; it isolates the role of observer-count in theory selection.  
       - It does *not* assume theories are identical except for observer count (but controls for other factors).  

  ---

  ### II. Disagreements Table  
  We irreducibly disagree on the following. Each row states:  
  - A neutral description of the issue;  
  - The SSA defender’s position (in their endorsed wording);  
  - The SIA defender’s position (in their endorsed wording).  

  | Neutral Issue Statement | SSA Defender’s Position | SIA Defender’s Position |
  |-------------------------|-------------------------|-------------------------|
  | **In GCT, does your observation "I exist in a room" provide evidence for tails?** | SSA: Yes. I must condition on being a random observer from all who *actually exist*. With 10× more observers on tails, my existence is 10× more likely under tails than heads. My credence for tails is \(10/11\). | SIA: No. My existence *itself* is evidence because it is more likely if more observers *exist*. The prior probability of tails is multiplied by its observer count. My credence for tails is \(1/2\). |
  | **Is the Doomsday Argument’s Bayesian update valid?** | SSA: Yes. My low birth rank \(n\) is less likely under a large \(N\) than a small \(N\), as I am a random sample from all humans. This favors "early doom". | SIA: No. My existence is more likely if \(N\) is large, which exactly cancels the birth-rank effect. No update occurs; the prior on \(N\) remains unchanged. |
  | **Is the Presumptuous Philosopher’s conclusion sound?** | SSA: No. PP is a *reductio ad absurdum*: observer count alone cannot override priors without empirical evidence. We must penalize complex theories (e.g., those positing extra observers). | SIA: Yes. My existence is evidence for theories predicting more observers, as they make my existence more probable. PP is correct and not absurd. |

  ---

  ### III. Cruxes  
  We identify two cruxes. If resolved, either would materially shift at least one position. For each crux, we:  
  - State the core question;  
  - Propose a concrete test case;  
  - Specify both sides’ *advance predictions*.  

  #### Crux 1: Does your existence evidence more observers?  
  **Neutral Statement**: Does learning "I exist" (absent indexical details) increase credence in hypotheses with more observers?  

  **Test Case (Asymmetric God’s Coin Toss)**:  
  - Coin flip: heads creates 1 observer; tails creates 1,000,000 observers.  
  - You awaken in a room (no indexical information).  
  - *Question*: What is your credence for tails?  

  | Position | Prediction |  
  |----------|------------|  
  | **SSA** | Tails credence = \(10^6 / (1 + 10^6) \approx 1\) |  
  | **SIA** | Tails credence = \(1/2\) |  

  #### Crux 2: Is the Presumptuous Philosopher a reductio?  
  **Neutral Statement**: Should theories with more observers gain credence *solely* from your existence?  

  **Test Case (Theories A vs. B)**:  
  - Prior: \(P(\text{Theory A}) = P(\text{Theory B}) = 0.5\).  
  - Theory A: Only you exist.  
  - Theory B: You and 999,999 others exist.  
  - *Question*: After learning "I exist," what is \(P(\text{Theory A})\)?  

  | Position | Prediction |  
  |----------|------------|  
  | **SSA** | \(P(\text{A}) \approx 10^{-6}\) (i.e., vanishingly small) |  
  | **SIA** | \(P(\text{A}) = 0.5\) |  

  ---

  ### IV. Verbal Disagreement or Dissolution  
  We agree that part of our dispute is **verbal** and dissolves under sharper formulation:  
  - **"Existence" vs. "Specific Identity"**: SSA treats "I exist" as inseparable from "I am a *specific* observer." SIA treats "I exist" as a distinct, non-indexical fact. This causes apparent contradictions (e.g., in GCT).  
  - **Resolution**: Both positions agree that conditioning *only* on "I exist" (no identity information) yields SIA-like updates, while conditioning on "I am a random observer in the actual world" yields SSA-like updates. The crux is *which* conditioning reflects rational anthropic reasoning.  

