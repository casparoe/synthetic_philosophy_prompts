prompt: |-
  I keep encountering theories of vagueness—supervaluationism, epistemicism, many-valued and degree-theoretic approaches, contextualism—and each seems to talk past the others about what a theory of vagueness is even supposed to do. Before I read another one, I want the desiderata laid out explicitly. What must an adequate theory of vagueness deliver?

  For each requirement, give the case, puzzle, or datum that motivates it, and then assess whether it is non-negotiable or merely a preference of one camp. I am especially interested in the following:

  - The sorites paradox itself. What exactly does a theory have to do to count as having handled it—block the inference, dissolve the puzzle, explain away its pull? If merely blocking the paradox (e.g., by rejecting one premise) is enough, what further explanatory burden does the theory carry to account for why the paradox seemed compelling in the first place?
  - Borderline cases. A theory must explain what it is for a predicate to have borderline cases, and why we cannot resolve them by stipulation. But is it also required to explain why some predicates admit borderline cases while others do not—or is that a separate question a theory of vagueness can leave to someone else?
  - Higher-order vagueness. If a theory draws a sharp boundary between the clear cases and the borderline cases, it seems to recreate the sorites at a higher level. Is handling higher-order vagueness a genuine requirement, or is it a ladder we can kick away once the first-order paradox is resolved? If it is a requirement, what counts as a satisfactory treatment—eliminating the appearance of a higher-order boundary, or merely showing that it is harmless?
  - Logical revisionism. Must a theory preserve classical logic, or is it permitted to revise it—and if so, how much revision is too much? If a theory gives up bivalence or excluded middle, what does it owe us in return: a complete alternative logic, a translation manual back to classical reasoning, or something else?
  - Penumbral connections. Vague predicates do not float free of one another: nothing can be clearly red and clearly orange all over, and someone who is clearly tall is thereby not clearly short. A theory must respect these connections. Is this a separate requirement, or does it fall out of other desiderata? Does it constrain the logic of vague predicates in a way that rules out otherwise attractive candidates?
  - The forced-march sorites. Some theories handle the logical paradox but collapse when asked to classify each item in a sorites sequence one by one, since the theorist is forced either to draw a sharp cutoff or to give answers that seem to violate the theory's own semantics. Is the forced march a fair test of a theory, or does it smuggle in an assumption the theory is entitled to reject—such as that every statement in a series must be answerable?

  Finally: is there any subset of these desiderata that cannot be jointly satisfied? I have heard it suggested, for instance, that handling higher-order vagueness while preserving classical logic forces an infinite hierarchy of metalanguages, and that avoiding this requires sacrificing something else. If that is right, spell out the tension—the impossibility result, or the near-impossibility result, is more interesting to me than any particular positive theory. And if you had to pick one desideratum that eliminates the largest number of candidate theories in a single stroke, which one is it, and why?
reasoning: |-
  Okay, this user is deep into philosophical theories of vagueness and wants a structured breakdown of what makes a theory adequate. They're clearly frustrated with how different approaches talk past each other, so they're asking for explicit desiderata before diving into another theory. 

  First, I need to unpack why they're asking this. They mention specific puzzles like the sorites paradox and higher-order vagueness, so they're not a beginner—they've hit conceptual walls and want a map. The tone suggests intellectual fatigue ("before I read another one"), so clarity and organization are crucial. They're also signaling they care about trade-offs ("cannot be jointly satisfied"), meaning they want honesty about limitations, not just marketing for any single theory. 

  The six bullet points are well-chosen pressure points. For each, I should: (1) state the requirement plainly, (2) give the motivating puzzle, (3) flag how negotiable it is, and (4) note where theories typically fail. The final question about trade-offs is the money shot—they want the "impossibility result" teased in their last paragraph. 

  Starting with the sorites: The core issue is that merely blocking the paradox (e.g., epistemicism's "there's a sharp cutoff we can't know") feels unsatisfying if it doesn't explain why the paradox seems compelling. So the desideratum isn't just technical consistency but explanatory depth. Supervaluationism handles this well with its "no fact of the matter" approach, but at the cost of higher-order headaches. 

  Borderline cases are non-negotiable—any theory that can't distinguish "clearly tall," "borderline tall," and "clearly not tall" is dead on arrival. But explaining why some predicates are vague might be outsourced to philosophy of language. 

  Higher-order vagueness is where theories bleed. Classical logic loyalists (epistemicists) bite the bullet and accept sharp boundaries between clear/borderline cases, which feels counterintuitive. Non-classical approaches (fuzzy logic) avoid this but collapse in forced-march scenarios. This might be the biggest tripping point—the user's hint about "infinite hierarchies" targets supervaluationism's need for infinitely many precisifications. 

  Ah, penumbral connections! This is subtle but vital. If a theory says "this patch is red and orange" is acceptable, it's broken. Supervaluationism nails this via admissible precisifications, but fuzzy logic struggles with compositional rules (how "red and orange" computes when both have 0.5 truth values). 

  Forced-march sorites is the killer app for testing theories. Epistemicists can consistently point to a cutoff (even if unknown), but supervaluationists look hypocritical saying "no sharp line" yet forced to classify each item. This exposes whether a theory is psychologically plausible, not just logically coherent. 

  Now the trade-offs: The user's suspicion is correct—classical logic + higher-order vagueness forces either infinite hierarchies (messy) or unexplainable boundaries (unsatisfying). But if I had to pick one desideratum that wrecks most theories, it's higher-order vagueness. It nukes epistemicism (sharp boundaries feel wrong), simple many-valued logics (fixed truth-value gaps recreate the problem), and burdens supervaluationism with infinite regress. Only radically revisionist approaches like subvaluationism or non-transitive logics dodge it, but they sacrifice classical logic. 

  Final note: The user wants "impossibility results," so I'll explicitly frame the trilemma: keep classical logic → accept sharp borders/hierarchies; avoid sharp borders → revise logic; avoid hierarchies → ? That's the tension no theory cleanly resolves.
answer: |-
  Here's a breakdown of the core desiderata for an adequate theory of vagueness, motivated by the puzzles and constraints you've highlighted. I'll address each point explicitly, assess negotiability, and conclude with the key tensions and trade-offs.

  ---

  ### **Core Desiderata & Motivating Puzzles**

  1.  **Resolve the Sorites Paradox**
      *   **Motivation:** The core paradox itself (e.g., 1 grain is a heap; adding 1 grain never turns non-heap to heap; therefore, 1,000,000 grains is a heap). Demonstrates the tension between tolerance (small changes don't matter) and sharp boundaries.
      *   **Requirement:** A theory must *block the paradoxical conclusion* while explaining why the reasoning *seemed* compelling.
      *   **Non-Negotiable?** **Yes.** Blocking the conclusion is essential. Merely rejecting a premise (e.g., "there *is* a sharp cutoff") is insufficient without explaining the pull of tolerance and the seeming absence of boundaries. The theory must account for the *phenomenology* of vagueness – why we resist sharp boundaries.
      *   **Explanatory Burden:** High. The theory must explain why tolerance principles are so intuitively plausible yet ultimately unsound (or contextually restricted, or semantically misapplied).

  2.  **Explain Borderline Cases**
      *   **Motivation:** Clear cases (Picasso's *Guernica* is art), clear non-cases (a random rock is not art), and unclear cases (Duchamp's *Fountain*? Early scribbles of a child prodigy?). Resistance to stipulation (we can't just *decide* *Fountain* isn't borderline).
      *   **Requirement:** Define the *nature* of borderline cases (e.g., truth-value gaps, epistemic uncertainty, contextual indecision). Explain why stipulation fails – borderline status reflects a *deep feature* of the predicate/world, not just lack of decision.
      *   **Non-Negotiable?** **Yes.** Accounting for borderline cases is central to any theory *of vagueness*. Explaining why stipulation fails is key to distinguishing vagueness from mere ignorance or under-specification.
      *   **Separate Question?** While explaining *why some predicates are vague* (e.g., semantic indecision vs. worldly fuzziness) is important, an adequate theory of vagueness can often presuppose that vagueness exists and focus on its structure. However, a *complete* theory would ideally address this.

  3.  **Handle Higher-Order Vagueness**
      *   **Motivation:** Just as there's no sharp line between "tall" and "not tall," there seems to be no sharp line between "clearly tall" and "borderline tall" (or "borderline tall" and "not clearly tall"). A sharp meta-boundary invites a Sorites for "clearly P".
      *   **Requirement:** Avoid positing sharp boundaries *at any level*. The theory must either:
          *   Eliminate the appearance of sharp meta-boundaries (e.g., by making "clear case" or "borderline" themselves vague).
          *   Show that any meta-boundaries are harmless/benign (e.g., epistemicist claims we *can't know* them, rendering them practically inert).
      *   **Non-Negotiable?** **Highly Contentious, but Leaning Towards Yes.** Most find sharp meta-boundaries intuitively unacceptable, recreating the original problem. Theories *without* this (e.g., sophisticated supervaluationism, fuzzy logic with infinitely many values, contextualism with shifting standards) are generally preferred. Epistemicism bites the bullet here. Kicking away the ladder is seen by many as cheating.
      *   **Satisfactory Treatment:** Eliminating the appearance is ideal. Showing harmlessness is difficult but possible (epistemicism's argument). Infinite hierarchies are often seen as a heavy cost.

  4.  **Preserve/Revise Logic (Minimally)**
      *   **Motivation:** Classical logic (Bivalence, Excluded Middle) seems challenged by borderline cases (is "This is tall" true, false, or neither? Can "P or not-P" fail?).
      *   **Requirement:** Justify its logical commitments. If revising classical logic:
          *   Provide a *complete, consistent, and usable alternative logic* for reasoning with vague predicates.
          *   Explain the *cost* of revision (e.g., loss of simple proofs, compositional semantics issues) and demonstrate clear benefits.
          *   Ideally, provide a way to recover classical reasoning for non-vague domains or contexts.
      *   **Non-Negotiable?** **No, but with a Strong Preference for Minimal Revision.** Preserving classical logic (Epistemicism) is a major advantage. Revision (Supervaluationism - loses Bivalence but keeps Excluded Middle; Fuzzy Logic - rejects both) must offer significant compensating gains in handling other desiderata (especially borderline cases, higher-order vagueness, penumbral connections). Radical revision (e.g., abandoning Modus Ponens, Transitivity) faces a high bar. The theory *must* deliver a workable logic.

  5.  **Respect Penumbral Connections**
      *   **Motivation:** "Nothing can be clearly red and clearly orange all over." "If clearly tall, then not clearly short." These are conceptual or necessary truths involving vague predicates.
      *   **Requirement:** The logic/semantics must entail these connections. They shouldn't be contingent or accidental.
      *   **Non-Negotiable?** **Yes.** Violating these (e.g., allowing "clearly red and clearly orange" to be true) is a fatal flaw, showing the theory doesn't capture the meaning relations between predicates. It's a core test of semantic adequacy.
      *   **Separate or Derivative?** While falling out of meaning, it's a distinct *constraint* on the logic/semantics. It famously rules out simple three-valued logics where "P & ~P" can be true for borderline cases of contradictory predicates. Supervaluationism handles this well via admissible precisifications. Fuzzy logic struggles (depending on the chosen t-norm/conjunction operator).

  6.  **Withstand the Forced-March Sorites**
      *   **Motivation:** Imagine sequentially judging each pair in a Sorites series. The theorist seems forced to either:
          *   Draw a sharp cutoff (contradicting the rejection of sharp boundaries).
          *   Give inconsistent answers (e.g., saying n is tall implies n+1 is tall, but later denying it).
          *   Refuse to answer some questions (but why?).
      *   **Requirement:** Provide a coherent account of what happens in such a march that aligns with the theory's semantics and doesn't force inconsistency or implausible silence.
      *   **Non-Negotiable?** **Debated, but a Strong Test.** Proponents see it as exposing practical incoherence in theories that reject sharp boundaries. Opponents argue it smuggles in assumptions the theory rejects:
          *   That every sentence *must* be assertible/deniable in every context.
          *   That context is stable throughout the march.
          *   That the march reflects competent, rational application of the concept.
      *   **Fair Test?** It's a powerful stress test for *contextualist* and *supervaluationist* theories. Contextualists handle it best by allowing standards to shift subtly during the march. Supervaluationists must explain competent speakers' reluctance to commit ("no fact") or appeal to context. Epistemicists can consistently identify a cutoff (even if unknowable). Fuzzy logic theorists assign values but face the "what number?" challenge. A theory that fails this test needs a compelling reason why the test is illegitimate or how competent speakers *should* navigate it without inconsistency.

  ---

  ### **The Tensions and Trade-offs: The Impossibility Trilemma**

  The core tension arises when trying to satisfy **Classical Logic**, **No Sharp Boundaries (including Higher-Order)**, and **Robust Handling of Borderline Cases**.

  1.  **Preserve Classical Logic (Bivalence, Excluded Middle):** This is the Epistemicist route. It blocks the Sorites by accepting a sharp (but unknowable) boundary. It handles penumbral connections classically.
      *   **Cost:** Fails "No Sharp Boundaries" spectacularly (at first-order and all higher orders). Borderline cases are explained solely as epistemic (which many find deeply counterintuitive – is *Fountain*'s art-status *really* just a matter of not knowing a fact?).

  2.  **Reject Sharp Boundaries (First and Higher-Order):** This requires rejecting Bivalence (borderline cases aren't true or false). Supervaluationism is the prime example (borderlines are truth-valueless gaps; "clearly P" is vague; sharp meta-boundaries are avoided via higher-order gaps or infinite hierarchies). Many-valued/Fuzzy logics attempt this by degrees.
      *   **Cost (Supervaluationism):** Loses Bivalence. *Requires significant logical revision* (e.g., truth is supertruth, losing some classically valid inferences like conditional proof). Faces the Forced March challenge and needs to explain the nature of "admissible precisifications" without sharp boundaries. Avoiding sharp meta-boundaries often leads to complex hierarchies or primitive notions of "definiteness". Penumbral connections are handled well.
      *   **Cost (Many-Valued/Fuzzy):** Requires even more radical logical revision. Often struggles with penumbral connections (e.g., compositionality – the truth-value of "red and orange" for a borderline case). Higher-order vagueness is problematic (is the transition from 0.5 to 0.5001 truth-value sharp?). The Forced March exposes the arbitrariness of choosing any specific cutoff value. Explaining the *meaning* of intermediate truth-values is challenging.

  3.  **Avoid Infinite Hierarchies/Primitives:** Epistemicism avoids them by accepting sharp boundaries. Simple three-valued logics avoid them but fail Penumbral Connections and Higher-Order Vagueness. More sophisticated approaches (contextualism, dynamic semantics) try to avoid both hierarchies and sharp boundaries.
      *   **Cost (Contextualism):** Often requires significant departure from classical semantics/logic for vague predicates *in dynamic settings*. Explaining the precise mechanism of context shift and its limits is crucial to avoid the appearance of sharp boundaries *within a fixed context*. Higher-order vagueness becomes vagueness in the contextual parameters themselves.

  **The Near-Impossibility:** Satisfying **all three** – **Classical Logic**, **Genuine No Sharp Boundaries (including Higher-Order)**, and **Robust Non-Epistemic Borderline Cases** – seems impossible without resorting to **infinite hierarchies of "definitely" operators** or **primitive, unexplained higher-order vagueness**. This is the "ladder" you can't kick away. Epistemicism sacrifices No Sharp Boundaries. Supervaluationism sacrifices Classical Logic and simplicity (accepting hierarchies). Contextualism sacrifices stable classical semantics across contexts. Fuzzy logic sacrifices classical logic and compositional clarity.

  ---

  ### **The Single Most Eliminating Desideratum**

  If forced to pick one desideratum that eliminates the largest number of candidate theories in a single stroke, it's **Handling Higher-Order Vagueness Satisfactorily**.

  *   **Why?**
      *   **Eliminates Epistemicism:** It inherently posits sharp boundaries at every level (even if unknown).
      *   **Eliminates Simple Many-Valued Logics (e.g., 3-valued):** They simply recreate sharp boundaries between "True", "Borderline", and "False", inviting a Sorites for "Borderline".
      *   **Challenges Supervaluationism:** Forces it into complex hierarchies of "definitely" operators or primitive vagueness in "admissibility".
      *   **Challenges Fuzzy Logic:** Requires explaining the vagueness of the *mapping* from objects to degrees (is the transition from 0.799 to 0.8 "sharp"?).
      *   **Challenges Contextualism:** Requires explaining the vagueness of the contextual parameters (e.g., the comparison class, the "standards") themselves.
  *   **Impact:** Almost no theory escapes unscathed or without significant complexity. Theories that *do* handle it well (e.g., sophisticated supervaluationism with D-operator hierarchies, complex fuzzy systems, contextualism) often do so by sacrificing classical logic, semantic simplicity, or introducing significant theoretical machinery. It's the desideratum that most directly exposes the fundamental depth and pervasiveness of the phenomenon of vagueness.

  In conclusion, an adequate theory must navigate a minefield of demanding, often conflicting desiderata. The central tension revolves around preserving classical logic vs. eliminating sharp boundaries while providing a plausible account of borderline cases. Higher-order vagueness acts as the most stringent test, revealing the deep challenges in taming the fuzziness of language and the world. There is no free lunch; every theory pays a significant price somewhere.
