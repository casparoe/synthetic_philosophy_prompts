prompt: |-
  I cover science and ideas for a magazine, and I edit both long reported features and shorter news analyses. The recurring problem on my desk is knowing when a story is ready to file. Some writers treat every piece as if it needs one more source, one more study, one more rival interpretation; others stop the moment the piece is publishable and miss the reporting that would have changed the argument. Deadlines and word counts are fixed, but so is the cost of being shallow or wrong.

  I have read enough about Herbert Simon's work on satisficing and bounded rationality to believe that a threshold of acceptability, rather than an exhaustive search for the best possible version of a story, can be a rational stopping rule when search is costly and the full set of options cannot be surveyed. What I have not seen is that idea turned into a procedure an editor without a background in the theory can actually run. Please write one for me: a decision procedure, grounded in satisficing and bounded rationality, for deciding when a reported story is ready to file, which my desk could use repeatedly.

  Make it a procedure in the strongest sense. It should be a sequence of questions or tests in a fixed order, with a clear account of what counts as a sufficient answer to each; it should say where the procedure returns "file", where it returns "keep reporting", and where it stops and hands the decision to a person because the question is one of editorial judgement rather than mechanics. It should specify how to set an aspiration level for a piece before reporting begins, how to revise that level when the reporting environment turns out to be richer or poorer than expected, and how to prevent revision from becoming a quiet lowering of standards. It should distinguish satisficing from settling, and it should make the stopping rule sensitive to the costs of further search, not only to the quality of what has already been found.

  Build in the constraints of my context: a fixed word count and deadline for each piece; writers of varying experience; fact-checkers who are available but expensive; sources who will speak only on background; and the impossibility of covering every angle. The procedure should be usable by someone who has never read Simon, so translate the concepts rather than invoke them.

  Then run the procedure on three cases:

  1. A 3,000-word feature on a contested epidemiological claim. The writer has two strong sources on one side, one on the other, and a central document that neither side will release.

  2. A 900-word news analysis of a new paper on AI safety. The writer says it is ready, but has read only the paper itself and one critical blog post.

  3. A 2,500-word reported essay that meets its original brief, is factually clean and well written, but does not yet say anything surprising. The writer has already interviewed nine people. My instinct is to commission more reporting; I want the procedure to be capable of telling me, on its own terms, that the problem is the aspiration level I set at the start rather than a shortage of search, and to say "file" if that is what follows.

  Finally, say explicitly what the procedure cannot do: the cases where it will misfire, the steps that are judgement dressed as mechanics, and the assumptions it makes about the newsroom that may not hold elsewhere. Please write the answer in British English.
reasoning: |-
  Okay, the user is a magazine editor handling science and ideas pieces. They're struggling with knowing when a story is ready to file—balancing thoroughness against deadlines. They've referenced Herbert Simon's satisficing theory but need a practical, step-by-step procedure. 

  First, I need to unpack their pain points: writers either over-research or under-report, fixed constraints (word count/deadline), and the high cost of shallowness or errors. They want a mechanical decision tree, not academic theory. 

  Key elements to include: 
  - A clear threshold system ("Good Enough Standard") set upfront 
  - Dynamic adjustment of that standard based on reporting realities 
  - Safeguards against lowering standards covertly 
  - Distinction between satisficing (meeting core needs) vs settling (compromising essentials) 
  - Cost-awareness (time/source access vs value of extra digging) 

  For the procedure, I'll structure it as a flowchart-style Q&A. Must avoid jargon—replace "bounded rationality" with "real-world limits on reporting." The three test cases will demonstrate how it handles: 
  1) Contentious science with missing evidence 
  2) Rushed analysis needing perspective checks 
  3) Competent but unsurprising essays 

  Biggest challenges: 
  - Making aspiration level revisions objective (using "surprise ratio" helps) 
  - Flagging when human judgment must override mechanics 
  - Confessing the procedure's limits upfront (e.g., breaking news vs deep features) 

  British English touches: "whilst," "amongst," "labour," "colour." Will use "desk" as they do for editorial team. 

  The test cases reveal nuances: Case 1 fails on source balance but may file if deadline pressure outweighs document gaps; Case 2 clearly needs more voices; Case 3 exposes how aspiration levels can be mis-set. 

  Finally, the "Cannot Do" section is crucial—this isn't a substitute for editorial flair, just a framework to force explicit decisions. Must emphasise that surprising insights sometimes emerge late, and the procedure can't predict that.
answer: |-
  Below is a satisficing-based decision procedure for determining when a reported story is ready to file, designed for practical editorial use. It translates Simon’s principles into a step-by-step checklist, emphasising **clarity, feasibility, and cost-awareness** while accommodating fixed deadlines, word counts, and reporting realities. The procedure distinguishes between **satisficing** (meeting core standards efficiently) and **settling** (failing essentials). It uses **British English** throughout.

  ---

  ### **The "Ready to File" Procedure**  
  **For editors assessing science/ideas pieces (reported features, news analyses, essays)**  

  #### **I. Setup: Before Reporting Begins**  
  1. **Define the "Good Enough Standard" (GES)**:  
     - *Action*: With the writer, agree:  
       - **Core question**: What must this piece *definitively* answer? (e.g., "Does study X prove cause Y?").  
       - **Minimum sources**: Key stakeholders/experts needed (e.g., "2 pro, 2 con, 1 neutral").  
       - **Non-negotiable evidence**: Foundational documents/data required.  
       - **Surprise threshold**: Must offer ≥1 unexpected insight (e.g., new angle, counterintuitive data).  
     - *Output*: Written GES (1 paragraph max). Revise only if major new context emerges.  

  2. **Set Cost Guards**:  
     - *Action*: Assign:  
       - **Time budget**: Hours/days for reporting (align with deadline).  
       - **Source difficulty**: "Easy" (readily available) / "Hard" (elusive, hostile).  
       - **Costly checks**: Flag facts requiring expensive verification (e.g., lab data).  

  ---

  #### **II. The Checklist: Run When Writer Submits Draft**  
  *Ask in order. Stop at first "Keep Reporting" or "Escalate".*  

  1. **DEADLINE TEST**  
     - *Question*: "Can further reporting fit within the time/word limits?"  
     - *Sufficient Answer*: "Yes, with space for ≤1 new source or ≤200 words."  
     - **FILE** if "No".  
     - **KEEP REPORTING** if "Yes" + next test fails.  

  2. **GES CORE TEST**  
     - *Question*: "Does the draft meet every *essential* item in the Good Enough Standard?"  
     - *Sufficient Answer*: "Yes" (all core questions answered, min. sources included, key evidence present).  
     - **KEEP REPORTING** if "No".  
     - **ESCALATE** if "Yes" *but* standards feel too low (e.g., sources are weak). → *Human judgement*.  

  3. **SURPRISE TEST**  
     - *Question*: "Does the draft offer ≥1 non-obvious insight?"  
     - *Sufficient Answer*: "Yes" (e.g., fresh data, unanticipated viewpoint, undermines consensus).  
     - **FILE** if "Yes" + next test passes.  
     - **KEEP REPORTING** if "No" *and* time/source access allows deeper work.  
     - **ESCALATE** if "No" *and* constraints block further work. → *Is "surprise" vital here?*  

  4. **COST-BENEFIT TEST**  
     - *Question*: "Would *one more step* (source, document, study) likely:  
       a) Change the argument significantly?  
       b) Cost disproportionate time/money?"  
     - *Sufficient Answer*:  
       - "No major change expected" OR  
       - "Expected change minor vs. high cost".  
     - **FILE** if "Yes".  
     - **KEEP REPORTING** if:  
       - "Major change likely" + cost acceptable *or*  
       - Critical gap found (e.g., missing viewpoint).  
     - **ESCALATE** if benefit unclear. → *Editor/writer debate*.  

  ---

  #### **III. Anti-Settling Safeguards**  
  - **GES Revision Rules**:  
    - *Only revise pre-reporting GES if*:  
      - New facts alter the story’s fundamental scope (e.g., breaking development).  
      - Sources prove impossible (e.g., key figure dies). Document this.  
    - *Never revise mid-draft* to excuse gaps.  
  - **Settling vs. Satisficing**:  
    - **Satisficing** = GES met *without* avoidable weaknesses (e.g., all sides heard).  
    - **Settling** = GES "met" by dropping core needs (e.g., ignoring a key critic). Reject drafts that settle.  

  ---

  ### **Applied to Your Cases**  
  **Case 1: 3,000-word feature on contested epidemiology**  
  - **GES Core Test**: Fails. Missing central document + source imbalance (2 vs 1).  
  - **Cost-Benefit Test**: "One more step" (pursuing document) could change argument. But if source access exhausted and deadline looms → **Escalate**. *Editor judges if imbalance is fatal*.  
  - **Outcome**: Likely **Keep Reporting** or **Escalate**.  

  **Case 2: 900-word AI safety analysis**  
  - **GES Core Test**: Fails (only paper + 1 critic; needs ≥2 independent perspectives).  
  - **Surprise Test**: Unlikely with shallow sourcing.  
  - **Cost-Benefit Test**: Adding 1–2 expert views is fast/low-cost.  
  - **Outcome**: **Keep Reporting**.  

  **Case 3: 2,500-word essay (factually clean but unsurprising)**  
  - **GES Core Test**: Passes (brief met, well-sourced, clean).  
  - **Surprise Test**: Fails.  
  - **Cost-Benefit Test**: "One more step" (e.g., 10th interview) unlikely to yield surprise if 9 failed. High time cost vs. low expected benefit.  
  - **Outcome**: **FILE** (if GES didn’t mandate "surprise"). Else → **Escalate** to judge if surprise is essential. *Procedure flags mis-set aspiration level*.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Judge narrative flair**: Well-structured but dull writing passes mechanics.  
  2. **Handle breaking news**: Assumes pre-reporting GES setup; ineffective for rapid turnover.  
  3. **Replace editorial instinct**: "Escalate" steps acknowledge judgement calls (e.g., "Is this source credible enough?").  
  4. **Solve inaccessible sources**: If critical sources refuse to talk, procedure may force "settling".  
  5. **Guarantee depth in low-effort cultures**: Relies on writers/editors honestly engaging with GES.  
  6. **Predict unforeseeable insights**: A "last-minute source" might transform a piece – but the procedure minimises *systematic* under-reporting.  

  **Key Assumptions**:  
  - Editors/writers collaborate in good faith.  
  - Fact-checking catches errors *if* evidence is provided.  
  - "Surprise" is valued (may not fit straight news).  

  This procedure makes satisficing **actionable** by converting theory into editorial triage: prioritising rigour over exhaustiveness, and cost over perfection. It forces explicit trade-offs – which is the point.
