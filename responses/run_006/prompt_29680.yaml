prompt: |-
  So there's this thing that's been bugging me about advance directives — you know, living wills, DNRs, the forms where you lay out what treatments you want if you lose capacity down the line. The whole practice is built on the idea that my past self gets to bind my future self, even when my future self might have totally different values or might not even be capable of having preferences at all.

  Here's what feels inconsistant to me. In basically every other area of life, we let people change their minds. If I sign a contract to sell my house and then get cold feet, there are penalties but no one drags me to the closing at gunpoint. If I join a religion at 20 and leave it at 40, nobody says "ah but your 20-year-old self committed you." Even marriage, which is literally a lifelong vow, lets people divorce. So what is it about medical decisions that makes my earlier self a dictator over my later, incapacitated self?

  And it gets weirder with dementia. There are these well-known cases where someone writes an advance directive saying "if I get dementia and stop recognizing my family, withhold antibiotics and let me die of pneumonia," but then when they actually have dementia, they seem content — they enjoy chocolate pudding, they smile at visitors, they have a quality of life their earlier self either didn't anticipate or actively discounted. And yet the standard advance-directive paradigm says: too bad, your earlier self already decided. What view of personal identity makes that make sense? Is it that the severely demented person isn't "really" the same person as the one who signed the form? Or is it that the earlier, competent self has some special authority that the later, incompetent self simply lacks? And if it's the second one, why doesn't the same logic apply to someone who's drunk, or in the grip of new love, or temporarily not thinking straight — we don't let those people's earlier selves bind them forever either.

  I guess my main question is: what philosophical theory of personal identity, and what theory of autonomy or authority, does the whole advance-directive framework presuppose? Is it committed to a particular view, or is the practice compatible with several different theories that just happen to converge on the same policy recommendation? And if we swapped out the presupposed view for a different one — say, a view where the self is constantly being re-written by later experience — what would actually have to change about how advance directives work in practice?

  I'm a medical resident, not a philosopher. I feel like a bioethicist or someone who works on personal identity would see the hidden assumptions here more clearly than my attending does. So think like a philosopher of medicine for this. Lead with your bottom line in the first sentence — what view the practice actually presupposes — and then walk me through the reasoning and the alternatives. No preamble, no restating the question. Really think through the candidates before committing; if it helps, brainstorm a couple different reconstructions of what the practice might be assuming, and then say which one does the best job of making sense of the law as it actually stands and where the others would force changes.
reasoning: |-
  Okay, let me unpack this medical resident's deep dive into advance directives. They're hitting a fundamental tension: why does past-you get to chain future-you in healthcare when we let people change their minds everywhere else? 

  First, their analogy game is strong - contracts with exit clauses, religious conversion, divorce. All have escape hatches that advance directives seemingly lack. Then they zero in on dementia as the ultimate test case: a smiling, pudding-enjoying person whose directive demands non-treatment. That's where the philosophical rubber meets the clinical road.

  Hmm... they're really asking two layered questions: 
  First, what theory of personal identity makes "past-self dictatorship" coherent? 
  Second, what view of autonomy underpins binding future incapacitated selves? 

  The dementia example exposes the fault lines. If the directive-writer saw dementia as identity death, but the actual patient exhibits simple pleasures, which self counts? And why? 

  I need to reconstruct the unstated premises in current practice. Let me mentally flip through philosophical frameworks: 

  Lockean memory theory? Nope - dementia breaks psychological continuity but we still honor directives. 
  Parfitian reductionism? Maybe - but courts aren't ruling based on quasi-memories. 
  Bratman's planning theory? Warmer - advance directives as extended agency. 

  *scribbles mental notes* 
  The resident's drunk/temporary incapacity comparison is sharp. Why treat permanent incapacity differently? Current practice implicitly says: when no coherent self exists to override prior instructions, the last competent self reigns. But that assumes... 

  Aha! The core presupposition emerges: autonomy crystallizes at competence peaks. Your directive isn't just a preference - it's a sovereignty transfer to your past self when future autonomy mechanisms fail. 

  But what if we switched theories? Say we adopted Schechtman's narrative self view where identity reshapes constantly. Then directives would need expiration dates or dementia-override clauses. Or if we took a strictly present-self-interest view? Boom - directives collapse entirely for the incapacitated. 

  *imagines policy overhaul* 
  The resident's attending probably sees this as paperwork. But changing the philosophy would change everything: requiring periodic re-signing, adding "when I seem happy" exceptions, maybe even patient advocates assessing current versus past self interests. 

  Whew. This is why bioethicists lose sleep. That dementia paradox - directive versus pudding-smile - isn't just clinical; it's about which version of you gets to say "this is me".
answer: |-
  The standard advance directive framework presupposes a **Lockean psychological continuity theory of personal identity combined with a "precedent autonomy" view of moral authority**, where the last competent self retains decision-making sovereignty over future non-autonomous states.

  ### Core Philosophical Presuppositions:
  1. **Personal Identity**:  
     Assumes identity persists through severe cognitive decline via *biological continuity* or *minimal psychological connectedness*. The demented patient is legally/ethically the "same person" who signed the directive, even if lacking memory or values continuity. This rejects views like Parfit’s reductionism (where identity might dissolve with psychological discontinuity) or a strict narrative self theory (where identity requires coherent self-authorship).

  2. **Autonomy & Authority**:  
     Prioritizes **precedent autonomy**: the competent self’s right to bind future selves when autonomy is permanently lost. This treats autonomy as a *diachronic capacity*—your past competent self is the "sovereign planner" of your life story. Incompetent selves are seen as *non-autonomous agents* lacking moral standing to override prior directives, unlike temporarily impaired states (e.g., drunkenness) where competence can be restored.

  ### Why This Framework Prevails:
  - **Practical Necessity**: Without binding directives, we default to surrogate decision-makers or medical paternalism, risking treatment against documented wishes.  
  - **Temporal Neutrality**: Assumes the competent self best understands "overall life interests." Enjoying pudding in dementia is viewed as a fragmentary experience disconnected from the person’s lifelong values (e.g., dignity, avoiding indignity).  
  - **Legal Consistency**: Courts uphold directives as expressions of enduring personhood (*Cruzan v. Director, MDH*), avoiding slippery slopes where "current contentment" could justify overriding prior refusals.

  ### Alternative Theories & Their Implications:
  | **Philosophical View**               | **Impact on Advance Directives**                                                                 | Real-World Example Change |
  |--------------------------------------|--------------------------------------------------------------------------------------------------|---------------------------|
  | **Present-Oriented Interest Theory** (Dworkin, Jaworska)           | Directives could be overridden if the current self has interests (e.g., pleasure).               | Dementia patients receive antibiotics despite prior refusal if they appear content. |
  | **Narrative Identity Theory** (Schechtman)                         | Directives expire when narrative identity fractures; later "self" might gain authority.          | Require periodic reaffirmation post-diagnosis; dementia-stage preferences considered. |
  | **Bodily Continuity View** (Animalism)                             | Strengthens directives: identity is purely biological, so past self’s wishes always govern.      | *No change* – aligns with current practice. |
  | **Parfitian Reductionism** (No "further fact" of identity)         | Undermines binding force: if identity is not preserved, past self’s authority lapses.            | Directives guide but don’t bind; focus shifts to current well-being. |

  ### Resolving the Dementia Paradox:
  The tension between prior refusal and current contentment is addressed by:
  - **The "Then vs. Now" Hierarchy**: Prior competent self’s values (e.g., "avoid living with dementia") trump current non-autonomous preferences.  
  - **Quality of Life Discounting**: Smiling at pudding is seen as biologically driven contentment, not meaningful well-being that outweighs prior autonomy.  
  - **Ulysses Contract Analogy**: Like tying oneself to a mast to resist future impulses, the directive protects against feared future states even if the compromised self "acquiesces."

  ### What Would Change Under Competing Theories:
  - If we adopted **Jaworska’s view** that dementia patients retain "autonomy interests," directives would become *rebuttable* by current observed well-being. Clinicians would assess whether treatment refusal still aligns with the patient’s evolving interests.  
  - Under a **strict narrative identity view**, directives might require dementia-specific clauses (e.g., "only if I show signs of distress") or sunset provisions.  
  - **Presentism** would collapse directives entirely for the incompetent, shifting to best-interest determinations by surrogates.

  ### Bottom Line for Practice:
  Current law assumes your competent self is the *true author* of your life, with irrevocable authority over permanently incapacitated futures. While philosophically contestable, this balances autonomy against the chaos of real-time guesswork. To mitigate ethical tension, consider:  
  1. Building **dementia-specific flexibility** into directives (e.g., "withhold antibiotics only if I appear distressed").  
  2. **Mandating values discussions** (not just checkboxes) to capture nuanced views on identity and quality of life.  
  3. **Hybrid models** where directives set default rules, but surrogates can override based on clear evidence of current well-being—though this risks eroding the practice’s core purpose.  

  This framework isn’t philosophically pristine but reflects a pragmatic compromise: in the void of lost autonomy, we defer to the last clear voice.
