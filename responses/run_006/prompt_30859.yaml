  Also, truth-value gaps vs. hidden truths affect how you advise someone asking "Am I bald?" An epistemicist would say "There’s an answer, but I don’t know it"—terrible bedside manner but philosophically consistent. A supervaluationist would say "There isn’t a determinate answer," which feels more honest but collapses into higher-order vagueness problems. 

