prompt: |-
  I'm in a grad seminar on vagueness and I've been going back and forth between epistemicism and supervaluationism for weeks. You're a philosopher of language who actually works on this stuff — please think through this with me carefully, and if my framing is off, start by correcting that instead of just answering the question as asked.

  After class my friend and I got into it, and he made a case I can't shake. Supervaluationism says 'Alex is bald' is true iff it's true on every admissable precisification of 'bald', false iff false on every precisification, and neither true nor false in borderline cases. Epistemicism says there's a single sharp cutoff — some exact number of hairs — but we can never know where it is. My friend's claim: these are the same view with different vibes. Both say we can't settle borderline cases. Both keep classical logic mostly intact. The only real difference, he says, is that the epistemicist is willing to say there's a fact of the matter about whether Alex is bald, while the supervaluationist says there isn't. But isn't that right? If a borderline case is neither true nor false, that just is saying there's no fact of the matter. So what I want to know is whether there's any actual downstream difference — in how you reason with vague predicates, in what you'd say to someone who wants to know whether they're bald, in how you'd handle the sorites — or whether the whole debate is really just about how comfortable you are with the word 'unknowable.' I feel like there should be more to it, but I can't articulate a single concrete diffrence, and I'm starting to suspect my friend is right.
