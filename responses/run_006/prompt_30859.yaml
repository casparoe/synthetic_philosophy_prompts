answer: |-
  You're wrestling with a deep and persistent tension in vagueness theory—one that even seasoned philosophers grapple with. Your friend's challenge is astute, but crucially incomplete. While epistemicism and supervaluationism *appear* behaviorally similar in many contexts, they rest on fundamentally opposed metaphysical and semantic foundations with tangible downstream differences. Let's dissect this systematically:

  ### Core Divergence: Ontology of Vague Facts
  - **Epistemicism (e.g., Williamson)**: There *is* a precise fact of the matter (e.g., 8,732 hairs demarcate baldness). Borderline cases arise *solely* from **epistemic limitation**. Vagueness is ignorance.
  - **Supervaluationism (e.g., Fine, Keefe)**: There is *no* precise fact of the matter. "Alex is bald" is **indeterminate** in borderline cases because the world/language lacks a single cutoff. Vagueness is ontological indeterminacy.

  ### Concrete Downstream Differences:
  1. **Treatment of Borderline Cases in Reasoning**:
     - **Epistemicism**: You *must* accept that some instance of the Sorites premise ("If someone with n hairs is bald, so is someone with n+1 hairs") is **false**, though you can't know which one. Classical logic holds without exception.
     - **Supervaluationism**: No single instance of the Sorites premise is *false* (each is true on *some* precisification), but the *universal generalization* is **superfalse** (false on all precisifications). This requires abandoning classical inference rules (e.g., universal instantiation) in borderline regions.

  2. **Response to "Am I Bald?" (Borderline Case)**:
     - **Epistemicist**: "There is a definite answer, but I (and all humans) cannot know it. You are either bald or not—I just can’t tell which."  
       *→ Commits to bivalence, denies speaker authority.*
     - **Supervaluationist**: "There is *no* determinate answer. It’s neither true nor false that you’re bald—it depends on how we sharpen 'bald'."  
       *→ Rejects bivalence, embraces indeterminacy.*

  3. **Higher-Order Vagueness**:
     - **Epistemicism**: Higher-order vagueness (vagueness in what counts as "borderline") collapses into **iterated ignorance**. We don’t know where the cutoff is, and we also don’t know the boundaries of our ignorance.  
     - **Supervaluationism**: Admits genuine **higher-order indeterminacy** (no sharp boundary between determinate/indeterminate cases). This forces complex "precisifications of precisifications," risking infinite regress or artificial stratification.

  4. **The Sorites Paradox Resolution**:
     - **Epistemicism**: Solves Sorites by **denying tolerance** (one hair *does* make a difference somewhere) but attributes our inability to detect this to cognitive limits.  
     - **Supervaluationism**: Solves Sorites by **denying the universal premise's truth** while preserving local tolerance. The paradox fails because the premise isn't *supertrue*.

  5. **Metaphysical Commitments**:
     - **Epistemicism**: Requires **unknowable facts**—a heavy burden. Why *can’t* we know? (Williamson: due to chaotic dependence on microscopic factors.)  
     - **Supervaluationism**: Requires **truth-value gaps**—incompatible with classical logic’s assumption of bivalence. Needs a non-classical semantics.

  ### Why the Confusion? The "Competent Speaker" Test
  Both theories predict that competent speakers will *hesitate* or *disagree* in borderline cases. This surface similarity is what your friend notices. But the *explanation* differs radically:
  - Epistemicism: Hesitation due to **ignorance** of the sharp boundary.
  - Supervaluationism: Hesitation due to **semantic indecision** (no boundary to know).

  ### Verdict: Not Just "Vibes"
  The debate isn’t merely about the *word* "unknowable." It’s about:
  - Whether reality/language contains **sharp boundaries** (epistemicism) or **inherently fuzzy joints** (supervaluationism).
  - Whether classical logic is **universally valid** (epistemicism) or **locally violable** (supervaluationism).
  - Whether vagueness is a **human cognitive flaw** or a **feature of representation**.

  **Practical implication for your seminar**: Press where the theories *diverge in predictions*. Ask: "Can vague predicates have *hidden sharp boundaries*?" Epistemicism says *yes*; supervaluationism says *no*. That’s a concrete, testable difference—not just vibes. Your instinct is right: the gap is real, but it’s buried in the metaphysics and logic, not the phenomenology of uncertainty.

  If you want to explore a hybrid path, look at **contextualist** or **psychological** approaches (e.g., Raffman, Shapiro), but don’t let the epistemicism/supervaluationism debate collapse prematurely. The devil—and the philosophy—is in the details.
