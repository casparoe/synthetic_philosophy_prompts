answer: |-
  Here's a Q&A prep sheet designed for your EAG talk, ordered by **damaging potential** (starting with the most challenging). It includes phrasing, 2-minute replies, weaknesses, and strategic concessions.

  ---

  ### **Q&A Prep Sheet: Defending Morally Significant Individual Actions**

  #### **1. The Sophisticated Causation Objection (The "Real Issue")**  
  *Likely Phrasing:*  
  "Your expected utility argument assumes we *can* assign meaningful probabilities to being a threshold cause. But the real problem is metaphysical: In massively complex systems (like markets), can my *single* veggie burger purchase *ever* genuinely be the *cause* of a farm shutting down? It seems like a category error. Doesn’t this just beg the question by smuggling in the probability distribution you need?"  

  **Your 2-Minute Reply:**  
  "Great point – this cuts to the heart of the disagreement. I agree causation in complex systems isn't like flipping a light switch. But 'cause' here means *making a difference* within a probabilistic framework. Think of it like voting: Your single vote *probably* won't be pivotal, but if it *were*, it would clearly be a cause of the outcome. The system *is* sensitive to marginal inputs at thresholds. Assigning a tiny probability to being pivotal isn't arbitrary; it's based on the structure of the system (e.g., how close a firm is to a capacity decision). We *do* use expected cause in high-stakes decisions (e.g., engineering safety margins). Rejecting this requires denying marginal causation entirely – which implies *no* individual action in a collective context *ever* matters, even in clear tipping-point scenarios. That seems implausible."  

  **Weakness in Your Reply:**  
  Doesn't *fully* resolve the metaphysical unease about "what it means to be a cause." You lean on pragmatism ("we do this elsewhere") and the implausibility of the alternative.  

  **Concession to Make:**  
  "I concede that the *nature* of causation here is fuzzy and probabilistic, not mechanical. But fuzziness doesn't mean zero expected impact."  

  ---

  #### **2. The Threshold Paradox ("Undue Credit")**  
  *Likely Phrasing:*  
  "If I’m the millionth signature on a petition that triggers a policy change, your logic says I 'caused' the entire policy and get all the credit. But that’s absurd! The first 999,999 signers did the work. Why does the last one get the crown? Isn't this a reductio of your view?"  

  **Your 2-Minute Reply:**  
  "This is a common misunderstanding. **Expected utility doesn't assign *total* credit to the threshold actor; it assigns the *marginal* expected value of their action.** Every signer before the threshold had a small chance of *being* the threshold signer themselves. The 999,999th signer had a much higher probability of being pivotal than the 1st signer. *Each* signer's expected impact is their probability of being pivotal multiplied by the value of the outcome. The 'last' signer gets high *actual* impact but very low *ex-ante* expected value. The 'first' signer gets low actual impact (if not pivotal) but higher *ex-ante* expected value because they *enabled* the later signatures. It's perfectly consistent."  

  **Weakness in Your Reply:**  
  Requires the audience to grasp the counterintuitive distinction between *ex-ante* expected value and *ex-post* actual impact/causation. Some may still feel it's "unfair."  

  **Concession to Make:**  
  "I agree the *ex-post* perspective feels intuitively jarring. But ethics requires us to act under uncertainty (*ex-ante*), where the expected value calculation holds."  

  ---

  #### **3. Practical Inefficacy in Large Markets**  
  *Likely Phrasing:*  
  "Sure, tipping points *exist*, but for buying veggie burgers or skipping one flight in a global market with billions of actors, isn’t the probability of *me* being the threshold customer so infinitesimally small that it’s effectively zero? Doesn’t this make your expected value calculation practically irrelevant?"  

  **Your 2-Minute Reply:**  
  "Three key points:  
  1.  **It's Not Always Infinitesimal:** Probabilities depend on market conditions. If a plant-based meat co. is on the brink of a major expansion (or bankruptcy), your purchase *today* has a much higher pivot probability than when they're stable.  
  2.  **Scale Magnifies Small Chances:** A 1-in-10-million chance of averting 100k tonnes of CO₂ (e.g., by triggering a supply chain shift) still has an expected value of 10 tonnes – far more than your direct footprint.  
  3.  **Ignoring It is Asymmetric:** If we dismiss tiny probabilities of large *harms* (e.g., "my driving won't cause a fatal crash"), we'd make reckless decisions. Consistency demands we apply the same logic to *benefits*."  

  **Weakness in Your Reply:**  
  Assumes we can reliably estimate these tiny probabilities and the magnitude of impacts. Critics argue we often can't.  

  **Concession to Make:**  
  "Absolutely, the probabilities *are* often extremely small. But 'effectively zero' is a slippery slope – and my secondary argument (norms/expression) doesn't rely on thresholds at all."  

  ---

  #### **4. Collective Action Problems / "What Difference Do I Make?"**  
  *Likely Phrasing:*  
  "This feels like a classic collective action problem. If everyone thought like you, maybe it works. But since most people *don’t* make these choices, my individual action is literally a drop in the ocean. Why bother?"  

  **Your 2-Minute Reply:**  
  "Two answers:  
  1.  **Expected Utility Still Applies:** Even if others aren't acting, *your* action still has that tiny chance of being pivotal in shifting the system. Waiting for others to act first guarantees no progress.  
  2.  **The Expressive/Norm-Shaping Power:** Your action isn't just a drop; it's a signal. It normalizes the behavior, influences peers (studies show people adjust consumption based on perceived norms), and builds political will. Rosa Parks wasn't pivotal in a vacuum; her act expressed an injustice and shifted norms. Ignoring this is ignoring how social change *actually* happens."  

  **Weakness in Your Reply:**  
  The expressive argument is harder to quantify. Critics may see it as secondary or "soft."  

  **Concession to Make:**  
  "If *only* the threshold argument worked, it might feel too fragile for some. That's why the expressive/norm channel is crucial and robust independently."  

  ---

  #### **5. "Isn't This Just Virtue Signaling?"**  
  *Likely Phrasing:*  
  "Aren't you just defending feel-good individualism? Shouldn't EAs focus 100% on systemic change (policy, tech innovation) and earning to give, instead of worrying about their personal carbon footprint or diet? This seems like ineffective virtue signaling."  

  **Your 2-Minute Reply:**  
  "Virtue signaling implies the action is *only* about showing off, with no real impact. I've argued there *is* real (expected) impact via thresholds and norms. Further:  
  1.  **Credibility & Integrity:** Advocating for systemic change while personally contributing to the problem undermines credibility (e.g., climate academics flying constantly).  
  2.  **Complementarity, Not Substitution:** No one argues *only* for individual action. It’s part of a portfolio. Personal action builds understanding, commitment, and often *drives* systemic engagement (e.g., vegetarians more likely to support animal welfare laws).  
  3.  **It’s Not Either/Or:** You can divest *and* lobby for carbon taxes. You can be veg*n *and* fund alternative protein R&D."  

  **Weakness in Your Reply:**  
  Risk of sounding preachy or downplaying the (often) larger impact of systemic work.  

  **Concession to Make:**  
  "I absolutely agree systemic change is paramount and often higher-impact. But dismissing *all* individual action as irrelevant or counterproductive is a mistake."  

  ---

  ### **The Question You Hope Nobody Asks ("The Regress Problem")**  
  *Likely Phrasing:*  
  "Your threshold argument relies on assigning probabilities to being pivotal. But determining *that probability* itself requires knowing how *other* actors will behave, which depends on *their* beliefs about being pivotal... and so on. Isn't this an infinite regress? Doesn't it collapse into wild speculation or circularity, making the expected value calculation meaningless in practice?"  

  **Why It's Dangerous:**  
  It attacks the *feasibility* of the expected utility calculation at its core. If we can't non-arbitrarily assign the pivotal probability because it depends on predicting others' predictions (ad infinitum), the whole threshold EV argument seems unfalsifiable and useless.  

  **Your Best 2-Minute Reply (Damage Control):**  
  "This is a profound challenge in game theory (Keynesian Beauty Contest). We avoid infinite regress by:  
  1.  **Using Observable Data:** We base probabilities on historical data (e.g., firm expansion thresholds), market indicators (e.g., utilization rates), or calibrated models – not pure recursion.  
  2.  **Common Priors:** We assume actors share rough estimates of pivotal probabilities based on public information (e.g., "This factory is at 95% capacity").  
  3.  **Focusing on Robustness:** Even wide confidence intervals often still yield non-trivial EV when multiplying by massive impacts.  
  4.  **Falling Back to Norms:** If EV *is* too indeterminate in some cases, the norm-shaping argument provides independent moral weight.  
  Ultimately, *inaction* also has an expected value based on *some* assumed probability distribution. Demanding impossible certainty paralyzes all decision-making under uncertainty."  

  **Weakness:** This reply is technical and may feel unsatisfying. It concedes significant ground on the precision/reliability of pivotal probabilities.  

  **Strategy:** Acknowledge the depth of the problem, offer the pragmatic responses, pivot hard to the expressive argument as a reliable fallback. Don’t get bogged down in game theory details.

  ---

  ### **Key Prep Advice**
  1.  **Lead with Concessions:** Acknowledge weaknesses early ("Yes, the probabilities *are* often tiny...", "I agree causation is fuzzy..."). Builds trust.
  2.  **Anchor to Norms:** When an EV argument feels shaky, pivot to: "And this is *why* the expressive/norm effect is so crucial independently."
  3.  **Order Matters:** Start with the strongest critiques (#1 & #2). If you handle those well, the rest feel easier.
  4.  **Flag the "Real Issue":** Explicitly name the causation vs. probability debate early in your talk. Pre-empts the most sophisticated pushback.
  5.  **Avoid Jargon:** Use "pivotal" or "threshold" instead of "marginal causal impact"; "expected impact" instead of "ex-ante EV."
  6.  **Emphasize Portfolio Thinking:** "Individual action is one tool among many, not the only tool."

  Good luck at EAG! You've got a solid case – the key is navigating the nuances without getting derailed.
