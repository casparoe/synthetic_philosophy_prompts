answer: |-
  **Bottom line:** This is primarily a substantive metaphysical disagreement about the nature of mind and action, exacerbated by a fundamental methodological divide concerning the *evidence* relevant to settling it. Linguistic analysis and phenomenological description are probing different aspects of the same phenomena using incompatible tools, leading to a stalemate where each side dismisses the other's core data.

  **Reasoning breakdown:**

  1.  **The Core Substantive Disagreement:** At its heart, the debate is metaphysical. Both sides agree *that* know-how (skillful action) exists. The disagreement is about *what kind of mental state or capacity constitutes it*.
      *   **Intellectualists (Stanley & Williamson, etc.):** Argue know-how *just is* a species of propositional knowledge (knowledge-that), specifically knowledge *under a practical mode of presentation*. The nature of the mental state is fundamentally *representational* and *propositionally structured*, even if accessed/employed differently in action.
      *   **Anti-Intellectualists (Rylean descendants, Dreyfus-influenced, etc.):** Argue know-how is a *sui generis* mental capacity – a complex of *abilities, dispositions, embodied sensitivities, and non-propositional engagements* with the world. Its nature is fundamentally *procedural*, *embodied*, and often *non-representational* or *non-conceptual*.

  2.  **The Methodological Divide & Evidence Mismatch:** This is why the debate appears stuck and circular.
      *   **Intellectualists' Method & Evidence:** Rely heavily on *linguistic analysis* (syntax, semantics of knowledge ascriptions, embedding tests). Their primary evidence is the *linguistic behavior* of knowledge attributions ("S knows how to φ"). They aim for a *unified semantic theory* of "knows" that covers *all* its uses. Their arguments target the *form* of our *talk* about knowing-how. They see phenomenology/skill descriptions as potentially interesting but methodologically secondary or even irrelevant to establishing the *fundamental nature* of the state *ascribed* via language.
      *   **Anti-Intellectualists' Method & Evidence:** Rely heavily on *phenomenological description* and *analysis of skillful action*. Their primary evidence is the *character of lived experience* of skilled performance (flow, absorption, non-deliberative action, embodied coping) and cases where explicit propositional knowledge seems absent or counterproductive. They aim for a *psychologically realistic account* of *how* skills are exercised. They see linguistic analysis as potentially missing the *actual nature* of the *ability itself*, arguing syntax doesn't dictate metaphysics. They see linguistic arguments as potentially capturing how we *report* know-how, but not what it *is*.

  3.  **Why It's Stuck:**
      *   **Talking Past Each Other:** Intellectualists address "What is the correct semantic analysis of utterances *ascribing* know-how?" Anti-intellectualists address "What is the correct metaphysical/psychological account of the *ability itself* manifested in skilled action?" These are related but distinct questions.
      *   **Evidence Dismissal:** Intellectualists see phenomenological counterexamples (e.g., skillful action without conscious deliberation) as failing to undermine the claim that *underlying* the ability is propositional knowledge (accessible in principle). Anti-intellectualists see linguistic arguments as irrelevant "grammatical sophistries" (to borrow a Rylean phrase) that ignore the lived reality of non-propositional skill.
      *   **Bedrock Intuitions:** You are right that bedrock intuitions play a role. Intellectualists have a strong intuition that *all* knowledge must be fundamentally representational/propositional to be "knowledge" at all. Anti-intellectualists have a strong intuition that *lived, embodied action* cannot be fully captured by descriptions of internal representations. These intuitions shape what each side accepts as valid evidence and explanations.
      *   **Your Hunch is Largely Correct:** Intellectualists prioritize a *unified semantic account of knowledge ascriptions*. Anti-intellectualists prioritize a *psychologically realistic account of skilled action and ability*. These priorities lead them to privilege different methodologies and types of evidence, making mutual engagement on the *core metaphysical question* incredibly difficult. It's not *just* a verbal dispute about "knows," but the verbal analysis vs. phenomenological analysis clash *is* a major symptom of the deeper methodological and evidential divide driving the substantive metaphysical disagreement.
