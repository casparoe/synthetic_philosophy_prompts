  - Strong emergence: Downward causation threatens causal closure or overdetermination.

  Unoccupied positions:
  1. Under eliminative reductionism: "Special sciences have fundamental laws." Why? Eliminativism denies higher-level laws; special sciences would be reducible or eliminated. So incoherent.
  2. Under weak emergence: "Emergence is ontological." But weak emergence is defined as epistemic, so this is contradictory.
