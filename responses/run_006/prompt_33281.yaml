prompt: |-
  I'm writing a paper on the principle of indifference, and before I evaluate any particular proposal for rehabilitating it I want to nail down what a successful rehabilitation would actually have to achieve. Please write the desiderata for an adequate theory of how to assign probabilities under ignorance — the phenomena it must handle, the paradoxes it must resolve (or at least survive), the constraints from probability theory it must respect, and the distinctions it must draw — with the case or consideration that motivates each requirement.

  Be specific about the paradoxes. A desideratum shouldn't just say "resolve Bertrand's paradox"; it should identify what, precisely, about the chord-in-a-circle case a theory must get right, and why that generalizes beyond the circle. Do the same for the cube-factory problem, the water-and-wine problem, and the problem of partition dependence more generally. If there are further paradoxes or edge cases that any adequate theory must handle, include those too.

  Flag which requirements are non-negotiable (a theory that fails them is simply false, or no theory of probability at all) and which are theoretical virtues one might trade off. If some subset of these desiderata is jointly unsatisfiable given known results — for instance, if the demand that a theory always yield a unique probability distribution conflicts with the demand that it be invariant under reparameterization, or if satisfying the probability axioms while matching intuitive verdicts across all the classic paradoxes is provably impossible — say so explicitly, and explain the tension.

  I'm especially interested in whether any single requirement does most of the work in eliminating the naive version of the principle (assign equal probability to each possibility you can state) and whether the remaining contenders are distinguished primarily by which requirement they give up. A table would be helpful for any scorecard you include, but the weight of the answer should be on the justification of the requirements themselves, not on grading existing proposals.
reasoning: |-
  We are constructing desiderata for a theory that aims to rehabilitate the principle of indifference (PoI). The naive PoI (assign equal probability to each "possibility") runs into several well-known paradoxes. We want a set of requirements that an adequate theory must meet to be considered successful. We'll break down the desiderata into several categories: handling phenomena, resolving paradoxes, respecting probability theory, and drawing key distinctions. We'll also note which are non-negotiable and which are theoretical virtues that might be traded off.

  ### I. Non-negotiable Requirements (Core Probability Theory)
  Any theory of probability must satisfy these to be considered a probability theory.

  1. **Probability Axioms (Kolmogorov Axioms)**  
     - **Requirement**: The theory must assign probabilities that are non-negative, sum to 1 over the sample space, and are countably additive (or at least finitely additive).  
     - **Motivation**: Without these, we do not have a probability measure. This is foundational.  
     - **Non-negotiable**: Yes.

  2. **Coherence (Avoiding Dutch Books)**  
     - **Requirement**: The assigned probabilities must be coherent, meaning that they do not allow a Dutch book (a set of bets that guarantees loss).  
     - **Motivation**: Coherence is a fundamental rationality constraint for degrees of belief.  
     - **Non-negotiable**: Yes (for any subjective or objective Bayesian theory).

  ### II. Handling Phenomena: What the Theory Must Account For
  These are phenomena that a theory of probability under ignorance should handle.

  3. **Complete Ignorance**  
     - **Requirement**: The theory must provide a method to assign probabilities when there is no evidence at all (or symmetric evidence) regarding a set of mutually exclusive and exhaustive possibilities.  
     - **Motivation**: The original motivation for PoI — how to assign probabilities when we know nothing.  
     - **Non-negotiable**: The theory must at least cover such cases. However, how it covers them might be contested.

  4. **Continuous vs. Discrete Variables**  
     - **Requirement**: The theory should be applicable to both discrete and continuous sample spaces.  
     - **Motivation**: Many problems (e.g., Bertrand's paradox) involve continuous parameters. A theory that only works for discrete cases is inadequate.  
     - **Non-negotiable**: Yes, because the world has both.

  ### III. Paradoxes and Edge Cases
  We now turn to specific paradoxes. For each, we state the problem, what the theory must get right, and why it generalizes.

  5. **Bertrand's Paradox (Chord in a Circle)**  
     - **Problem**: What is the probability that a random chord of a circle is longer than the side of the inscribed equilateral triangle? Different ways of generating the chord (e.g., by random endpoints, random midpoint, or random direction and distance from center) yield different probabilities (1/3, 1/2, 1/4).  
     - **What must the theory get right?** The theory must either:  
       (a) Assign a unique probability by specifying a canonical parameterization, or  
       (b) Show that the problem is ill-posed and that without a physical mechanism (or further specification) no unique probability exists, or  
       (c) Assign a set of probabilities (imprecise probabilities) reflecting the ambiguity.  
     - **Why it generalizes**: This is an instance of the general problem of **parameterization dependence**: the probability assignment should not depend on an arbitrary choice of how the problem is parameterized (e.g., in terms of chord length, angle, etc.). The theory must address invariance under reparameterization.  
     - **Non-negotiable?**: The theory must at least not yield contradictions when the same problem is parameterized in different ways. However, note that if the theory does not yield a unique probability, that might be acceptable (e.g., by embracing imprecision). But if it yields inconsistent probabilities under different parameterizations, that is a problem.

  6. **The Cube Factory (Dubois-Prade, 1985)**  
     - **Problem**: A factory produces cubes with side length between 0 and 1 meter. We are ignorant of the production process. What is the probability that the side length is at most 0.5 meters? If we parameterize by side length (L), we get P(L ≤ 0.5) = 0.5. If we parameterize by face area (A = L²), then the same event (L ≤ 0.5) becomes A ≤ 0.25. But if we are indifferent over A, P(A ≤ 0.25) = 0.25.  
     - **What must the theory get right?** The theory must resolve the inconsistency. It must either:  
       (a) Choose a distinguished parameterization (e.g., side length) and justify why, or  
       (b) Assign a set of probabilities, or  
       (c) Deny that there is a unique probability.  
     - **Why it generalizes**: This is a case of **nonlinear transformation** of parameters. The theory must handle transformations that change the density. The problem is that the uniform distribution in one variable is not uniform in a nonlinear transformation of that variable.  
     - **Non-negotiable?**: The theory must not simultaneously assign two different probabilities to the same event. So it must avoid the contradiction.

  7. **Water-Wine Paradox (Von Mises, 1939)**  
     - **Problem**: We have a mixture of water and wine, and we know the ratio of water to wine is between 1/2 and 2. We are ignorant of the exact ratio. What is the probability that the ratio is ≤1? If we parameterize by the ratio R (water/wine), then P(R≤1) = (1-1/2)/(2-1/2) = 1/3. But if we reparameterize by the ratio S = wine/water, then the event R≤1 is equivalent to S≥1. If we assume a uniform distribution over S in [1/2, 2], then P(S≥1) = (2-1)/(2-1/2) = 2/3.  
     - **What must the theory get right?** The same event (water ≤ wine) is assigned two different probabilities (1/3 vs 2/3) under two natural parameterizations. The theory must avoid this contradiction.  
     - **Why it generalizes**: This is another case of reparameterization (R vs 1/R) and the non-invariance of uniform distribution under inversion.  
     - **Non-negotiable?**: The theory must avoid assigning two different probabilities to the same event.

  8. **Partition Dependence (General Problem)**  
     - **Problem**: The probability assigned to an event can change if we refine or coarsen the partition of the sample space. For example, if we are ignorant about the color of a book, we might assign P(red)=1/2 and P(not red)=1/2. But if we partition "not red" into blue and green, then by the naive PoI we get P(red)=1/3, P(blue)=1/3, P(green)=1/3. Then P(not red)=2/3, which is inconsistent with the previous assignment.  
     - **What must the theory get right?** The theory must assign consistent probabilities regardless of how the sample space is partitioned.  
     - **Why it generalizes**: The problem occurs whenever we have nested or overlapping partitions. The theory must be invariant under refinements and coarsenings of the sample space.  
     - **Non-negotiable?**: The theory must assign the same probability to an event regardless of how we describe its complement (i.e., regardless of the partition). Otherwise, we have inconsistency.

  ### IV. Constraints and Distinctions

  9. **Invariance under Reparameterization**  
     - **Requirement**: The probability assigned to an event should be invariant under one-to-one (and smooth, if continuous) transformations of the parameters.  
     - **Motivation**: The choice of parameterization should not affect the probabilities, as it is arbitrary. This is a key lesson from Bertrand and the cube factory.  
     - **Non-negotiable?**: This is a highly desirable property, but it might be too strong. It is known that in continuous spaces, if we require invariance under all smooth transformations, then we are limited to improper priors or must abandon uniqueness. Thus, some theories might give up this requirement and instead select a canonical parameterization.

  10. **Uniqueness**  
      - **Requirement**: The theory should assign a unique probability distribution to every well-posed problem of ignorance.  
      - **Motivation**: Without uniqueness, we cannot make definite predictions or decisions.  
      - **Non-negotiable?**: Not necessarily. Some theories (e.g., imprecise probability) argue that ignorance should be represented by a set of distributions. Thus, this might be a theoretical virtue to trade off.

  11. **Consistency with Known Symmetries**  
      - **Requirement**: When there are symmetries in the problem (e.g., permutation symmetry in the labels of the outcomes), the probability assignment should respect them.  
      - **Motivation**: Symmetries are often our only guide in ignorance. For example, in a coin flip, if we have no reason to think heads is more likely than tails, we assign 1/2.  
      - **Non-negotiable?**: Respecting known symmetries is non-negotiable. However, identifying symmetries can be tricky.

  ### V. Known Tensions and Impossibilities
  - It is known (from the work of Jaynes, among others) that in continuous spaces, the requirements of **uniqueness**, **invariance under reparameterization**, and **satisfaction of the probability axioms** are in tension. Specifically:
     - If we require invariance under all smooth reparameterizations, then the only candidate is the (improper) uniform distribution on the real line, which does not normalize (violates the probability axioms).
     - Alternatively, we may break uniqueness by allowing a family of distributions (e.g., via maximum entropy with constraints) or break reparameterization invariance by choosing a privileged parameterization (e.g., Jeffreys prior).

  - The **partition dependence** problem in discrete spaces shows that the naive PoI is inconsistent. Therefore, any theory that uses the naive PoI without a principled way to choose the partition will fail.

  ### VI. Which Requirement Does the Most Damage to the Naive PoI?
  The most damaging requirement is **partition dependence** because it shows that the naive PoI is not even consistent with itself when we change the description of the same problem. This is fatal in discrete cases. For continuous cases, **reparameterization invariance** (and the related cube factory and water-wine problems) shows that the naive uniform distribution is arbitrary.

  ### VII. Scorecard of Contenders by Which Requirements They Give Up
  We are not grading existing proposals in depth, but we note that:

  | Approach                     | Key Features                                                                 | Requirements Given Up                          |
  |------------------------------|-----------------------------------------------------------------------------|------------------------------------------------|
  | **Jeffreys Prior**           | Invariant under reparameterization (using Fisher information)               | Uniqueness in multidimensional cases? (But often unique) |
  | **Maximum Entropy**          | Maximizes entropy subject to constraints                                    | Reparameterization invariance (depends on parameterization) |
  | **Reference Class**          | Uses a natural partition (e.g., by using the "most natural" description)    | Invariance under reparameterization, uniqueness? |
  | **Imprecise Probability**    | Assigns a set of probabilities                                              | Uniqueness                                    |
  | **Objective Bayesianism**    | Uses default priors (e.g., Jeffreys, reference priors)                      | May give up uniqueness in some cases          |
  | **Logical Probability**      | Tries to define a unique prior based on logical structure                   | Often fails reparameterization invariance     |
  | **Group Invariance**         | Uses symmetries to define a unique prior (e.g., Haar measure)               | May not exist or be unique in some cases      |

  Note: The above table is very rough.

  ### Conclusion
  An adequate rehabilitation of the principle of indifference must at least:
  - Satisfy the probability axioms and coherence (non-negotiable).
  - Handle both discrete and continuous cases.
  - Avoid the contradictions in the classic paradoxes (Bertrand, cube factory, water-wine) by either providing a unique invariant distribution or by consistently denying uniqueness (and providing a representation of ambiguity).
  - Avoid partition dependence in discrete cases.

  The key tension is between uniqueness, reparameterization invariance, and normalization. Any theory will have to relax at least one of these. The choice of which to relax distinguishes the major approaches.
answer: |-
  Below is a comprehensive set of desiderata for a rehabilitated principle of indifference (PoI), structured to address the phenomena it must handle, paradoxes it must resolve, theoretical constraints, and key distinctions. I first outline the desiderata with explicit motivations, then discuss tensions, trade-offs, and the role of each requirement in defeating naive PoI. A summary table compares how major approaches trade off desiderata.

  ---

  ### **I. Non-Negotiable Desiderata**  
  *(Violations imply the theory is incoherent or not a probability theory.)*

  1. **Satisfaction of Kolmogorov Probability Axioms**  
     - **Requirement**: Probabilities must be non-negative, sum to 1 over the sample space, and obey countable additivity (or finite additivity for finite spaces).  
     - **Motivation**: Without this, the theory fails as a basis for probability. Violations (e.g., negative probabilities or non-normalization) preclude rational decision-making.  
     - **Generalization**: Foundational to all probabilistic reasoning.  
     - **Non-negotiable**: Yes.

  2. **Coherence (Avoidance of Dutch Books)**  
     - **Requirement**: Probabilities must not enable a Dutch book (a system of bets guaranteeing loss).  
     - **Motivation**: Coherence is a minimal rationality constraint. If probabilities admit Dutch books, agents are exploitable, violating the purpose of probabilistic guidance.  
     - **Generalization**: Applies universally to any uncertainty representation.  
     - **Non-negotiable**: Yes.

  ---

  ### **II. Paradox-Specific Desiderata**  
  *(Failures here indicate inadequacy for ignorance contexts.)*

  3. **Resolution of Reparameterization Invariance (Bertrand's Paradox)**  
     - **Problem**: In a unit circle, what is P(random chord length > side of inscribed equilateral triangle)? Different "uniform" parameterizations yield P = 1/3 (random endpoints), 1/2 (random midpoint), or 1/4 (random radial distance).  
     - **Requirement**: The theory must assign the same probability to the same event, regardless of parameterization.  
     - **What it must get right**: The event "chord longer than triangle side" is fixed; only the coordinate system (e.g., endpoints vs. midpoints) changes. A solution must either:  
       (a) Yield identical probabilities across all parameterizations, or  
       (b) Justify a unique privileged parameterization (e.g., via symmetry).  
     - **Generalization**: Reparameterization invariance is necessary for any continuous ignorance problem (e.g., assigning P(0.5 < X < 1) for an unknown X).  
     - **Non-negotiable**: Yes (contradictory probabilities for the same event violate coherence).

  4. **Resolution of Nonlinear Transformation Invariance (Cube Factory Problem)**  
     - **Problem**: A factory produces cubes with side length L ∈ [0, 2]. Under ignorance, is P(L ≤ 1) = 0.5? If reparameterized by area A = L², the event L ≤ 1 becomes A ≤ 1, but naive uniformity over A implies P(A ≤ 1) = P(L ≤ 1) = 1/4, contradicting uniformity over L.  
     - **Requirement**: Probabilities for events must be invariant under nonlinear transformations (e.g., L → L²).  
     - **What it must get right**: The event "side length ≤ 1" is identical to "area ≤ 1". A theory must not assign conflicting probabilities.  
     - **Generalization**: Applies to any ignorance problem with non-linear scales (e.g., P(velocity < v) vs. P(kinetic energy < e)).  
     - **Non-negotiable**: Yes (contradiction violates probability axioms).

  5. **Resolution of Measure-Theoretic Consistency (Water-Wine Paradox)**  
     - **Problem**: A mixture has water/wine ratio R ∈ [1/3, 3]. Naive uniformity over R gives P(R ≤ 1) = 2/5. Reparameterized as S = wine/water = 1/R, the event R ≤ 1 is S ≥ 1. Uniformity over S gives P(S ≥ 1) = 2/3, contradicting P(R ≤ 1).  
     - **Requirement**: Probabilities must be consistent under reciprocal transformations (R ↔ 1/R).  
     - **What it must get right**: The event "water ≤ wine" is invariant; only the variable (R or S) changes. A solution must ensure P(R ≤ 1) = P(S ≥ 1).  
     - **Generalization**: Generalizes to any ratio-based ignorance (e.g., P(probability < 0.5) vs. P(odds < 1)).  
     - **Non-negotiable**: Yes (contradiction violates coherence).

  6. **Resolution of Partition Invariance**  
     - **Problem**: For a book with unknown color, a binary partition {red, ¬red} yields P(red) = 1/2. A ternary partition {red, blue, green} yields P(red) = 1/3. But ¬red = blue ∨ green, so P(¬red) jumps from 1/2 to 2/3.  
     - **Requirement**: Probabilities must be invariant under refinement/coarsening of partitions.  
     - **What it must get right**: The event "red" is the same; only the description of alternatives changes. A theory must assign P(red) consistently.  
     - **Generalization**: Applies to any discrete or discretized ignorance problem (e.g., assigning P(cancer) with different disease classifications).  
     - **Non-negotiable**: Yes (contradiction violates additivity).

  ---

  ### **III. Theoretical Desiderata**  
  *(Violations may be acceptable trade-offs, but reduce adequacy.)*

  7. **Uniqueness of Probability Distribution**  
     - **Requirement**: For a well-posed ignorance problem, the theory should output a unique probability distribution.  
     - **Motivation**: Non-uniqueness (e.g., imprecise probabilities) complicates decision-making and undermines PoI's goal of objectivity.  
     - **Trade-off**: Relaxed in some theories (e.g., supervaluationism) to handle paradoxes.  
     - **Non-negotiable**: No (but a strong virtue).

  8. **Broad Applicability**  
     - **Requirement**: The theory must handle:  
       - Discrete and continuous sample spaces.  
       - Finite and infinite dimensions (e.g., assigning P for multiple unknowns).  
     - **Motivation**: Ignorance arises in diverse contexts (e.g., particle physics vs. dice rolls).  
     - **Non-negotiable**: Yes for adequacy (but edge cases may be tolerated).

  9. **Compatibility with Evidence-Based Updates**  
     - **Requirement**: Priors under ignorance must allow Bayesian updating without inconsistency.  
     - **Motivation**: PoI is often a "default prior"; it must integrate with broader Bayesianism.  
     - **Non-negotiable**: No (but a virtue for rehabilitation).

  ---

  ### **IV. Known Tensions and Impossibilities**  
  **Key Tension**: Uniqueness + Reparameterization Invariance + Normalization are jointly unsatisfiable in continuous spaces.  
  - **Why**: Reparameterization invariance demands that uniform densities transform correctly under variable changes (i.e., using the Jacobian). But for unbounded or transformationally complex spaces (e.g., R⁺ → R), no normalized prior can be invariant under all smooth reparameterizations (e.g., uniformity over L is non-uniform over L²).  
  - **Consequence**: Theories must relax one desideratum:  
    - **Relax uniqueness**: Imprecise probabilities (e.g., sets of priors).  
    - **Relax reparameterization invariance**: Privilege a parameterization (e.g., Jeffreys prior).  
    - **Relax normalization**: Use improper priors (e.g., uniformity on R), but these violate Kolmogorov.  

  **Partition Invariance is Fatal to Naive PoI**:  
  - The **single most damaging requirement** is partition invariance. Naive PoI assigns equal probability to "states" in a partition, but the number of states is arbitrary (e.g., {red, ¬red} vs. {red, blue, green}). This directly produces contradictions (P(¬red) = 1/2 vs. 2/3), defeating naive PoI in discrete cases. Continuous paradoxes (Bertrand, cube) extend this by showing that "uniformity" depends on how the state space is parameterized.  
  - **Result**: All rehabilitations must abandon "equal probability per possibility" without constraints. Surviving theories are distinguished by which desideratum they relax to avoid partition dependence.

  ---

  ### **V. Scorecard of Major Approaches**  
  *How existing rehabilitations trade off desiderata (✔ = satisfied, ✖ = violated, ~ = contextually satisfied):*

  | **Theory**               | **Probability Axioms** | **Reparameterization Invariance** | **Partition Invariance** | **Uniqueness** | **Key Trade-off**                                     |
  |--------------------------|------------------------|-----------------------------------|--------------------------|----------------|-------------------------------------------------------|
  | **Naive PoI**            | ✖ (often)             | ✖                                | ✖                       | ✔              | Violates all paradox-related desiderata.             |
  | **Jeffreys Prior**       | ✔                     | ✔ (via Fisher metric)            | ~ (for "objective" pars)| ~ (unique per metric)| Privileges "information-theoretic" parameterization. |
  | **Maximum Entropy**      | ✔                     | ✖ (depends on par choice)        | ✖                       | ✔              | Assumes a privileged discretization or partition.    |
  | **Group Invariance**     | ✔                     | ✔ (for symmetry group)           | ✔ (group-symmetric pars)| ~ (if Haar unique)| Fails when no symmetry (e.g., cube factory).          |
  | **Imprecise Probability**| ✔ (per prior)         | ✖ (set may not cover all reps)   | ~ (set covers partitions)| ✖              | Sacrifices uniqueness for flexibility.               |
  | **Reference Priors**     | ✔                     | ~ (asymptotic invariance)        | ✖                       | ~              | Depends on data likelihood; not pure ignorance.      |

  **Notes**:  
  - **Jeffreys/Group Invariance**: Survive continuous paradoxes via reparameterization-invariant measures (density ∝ √det(Fisher info) or Haar measure). May fail partition invariance in discrete cases (e.g., no symmetry group for book color).  
  - **MaxEnt**: Requires a fixed partition or discretization, violating partition and reparameterization invariance.  
  - **Imprecise**: Avoids contradictions by allowing sets (e.g., [1/3, 1/2] for Bertrand), but sacrifices uniqueness and decision-theoretic clarity.  

  ---

  ### **Summary**  
  A successful PoI rehabilitation must:  
  1. **Non-negotiably** satisfy probability axioms, coherence, and avoid contradictions in paradoxes (Bertrand, cube, water-wine, partitions).  
  2. **Ideally** provide unique, broadly applicable probabilities invariant under reparameterization and partitioning.  
  3. **Acknowledge tensions**: Uniqueness + reparameterization invariance + normalization are jointly impossible in general; any theory must relax one.  

  **Key insight**: Partition invariance is the core problem for naive PoI, as it exposes the arbitrariness of "equal probability per state." Surviving theories either privilege a parameterization (Jeffreys), assume symmetries (group invariance), or abandon uniqueness (imprecise probabilities). The choice hinges on which desideratum is relaxed—**there is no free lunch**. For your paper, evaluate proposals by how they justify these trade-offs.
