  ok so I've been going back and forth on counterfactual mugging for literally years now and I realized I still don't have a number I'd actually bet on. like if someone put a gun to my head and made me choose, I don't know what I'd do, and that feels embarassing given how many times I've argued about it on the forum.

  standard setup: Omega (perfect predictor, or at least a very good simulator) flips a fair coin. if heads, Omega asks you for $100, and if you pay, Omega gives $10,000 to a stranger. if tails, Omega just tells you "hey I simulated you and you would have paid if it had been heads, so I'm telling you all this; now please pay $100 anyway." the thing is Omega only runs this whole scenario if their simulation says you'd pay on heads.

  I want your credence that the correct decision is to pay the $100. not "it depends on whether you're using FDT vs CDT" — I want the number you'd actually act on if you had to press the button. decompose it:

  - your credence that FDT/UDT is the right decision theory, as opposed to CDT or EDT
  - conditional on FDT being right, your credence that the logical counterfactual "if the coin had been heads, I would have paid" is well-defined and truth-apt, rather than being some confused notion that doesn't refer to anything
  - conditional on both of those, your credence that paying in the actual world gives you the right kind of acausal influence — i.e., that Omega's simulation genuinely depends on what you'd do in the heads branch in a way that makes paying now decision-relevant, rather than the whole thing being a weird verbal trick
  - any other terms you think belong

  give me numbers for each, one line of justification, and show how they combine into the overall credence. then tell me which term you're least confident about and what evidence or argument would shift it most. like if someone proved that logical counterfactuals are basically meaningless but Omega's simulation is faithful, would you flip? or the reverse?
