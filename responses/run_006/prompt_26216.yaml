prompt: |-
  I am a high school student who has been reading about the frame problem in philosophy of mind and artificial intelligence, and I keep encountering two attitudes that seem hard to reconcile. Some writers treat it as a deep and still unsolved problem about how any generally intelligent system could select, from everything it knows and everything it could infer, just the beliefs and inferences that bear on what to do or believe next. Others treat it as a leftover artifact of the old symbolic, logic-based approach to AI, a problem that modern machine learning has largely bypassed and that further scaling will continue to erode. I would like your credence, as a number between 0 and 1, on this claim: the frame problem, in the broad sense of relevance selection, names a genuine obstacle to building generally intelligent systems, and current machine learning methods do not solve it in a way that would generalize to general intelligence; it is not the kind of difficulty that will disappear merely from making present architectures larger and better trained.

  Please decompose that number instead of just stating it, and commit to a single number even though some of the sub-questions are uncertain; the decomposition is where the nuance belongs. Tell me the sub-questions your credence depends on, for example whether the broad frame problem is a real computational problem or an artifact of a particular kind of formalization, whether learned mechanisms such as attention already perform relevance selection in a way that solves the problem or only in narrow settings, whether the deepest difficulty lies in representation, in search, or in the very idea of relevance, and whether the problem is well-posed enough that we would recognize a solution at all. For each sub-question give a rough probability and a sentence of justification, then show how you combine them into the final number. Tell me which sub-question your final number is most sensitive to, which argument or piece of evidence would move it most, and where you think your reasoning is most likely to fail.

  Please write your answer as continuous prose, the way you would write an email or a letter: no headings, bullet points, bold text, or tables.
