  We are two game theorists who have long disagreed about the proper solution to two-person bargaining problems. Despite our differences, we have jointly produced this document to clarify both our points of agreement and the precise nature of our disagreements. We hope this will serve to advance the understanding of cooperative bargaining.

  1. Claims Both Parties Accept

    1.1. Setting: We consider two-player bargaining problems defined by a pair (S, d), where:
          - S is a compact and convex subset of R^2, representing the set of feasible utility payoffs.
          - d = (d1, d2) is the disagreement point in S, which results if no agreement is reached.

    1.2. We both accept the following axioms for a bargaining solution:
          - Pareto Optimality (PO): The solution should select a payoff pair (u1, u2) in S such that there is no other point (u1', u2') in S with u1' >= u1 and u2' >= u2 and strict inequality for at least one player.
          - Symmetry (SYM): If the problem is symmetric, i.e., (u1, u2) in S iff (u2, u1) in S and d1 = d2, then the solution should assign equal utility to both players.
          - Invariance with Respect to Affine Transformations (INV): If we apply an affine transformation to the utilities of each player (i.e., a positive scaling and shift) then the solution should transform accordingly.

    1.3. We note that in some cases the Nash Bargaining Solution (NBS) and the Kalai-Smorodinsky Bargaining Solution (KSBS) coincide. This occurs when:
          - The feasible set S is such that the utopia point (defined as the point (u1_max, u2_max), where u1_max = max{u1: (u1, u2) in S for some u2} and similarly for u2_max) is on the line from the disagreement point d to the Nash point. Equivalently, the two solutions coincide when the Pareto frontier of S is linear and symmetric in the appropriate sense.

    1.4. Both solutions capture important normative principles:
          - The NBS maximizes the product of the gains from the disagreement point: (u1 - d1)*(u2 - d2). It can be interpreted as the outcome of a hypothetical bargaining process that maximizes the joint gain in a multiplicative sense.
          - The KSBS is the unique point on the Pareto frontier that satisfies u1 - d1 / (u1_max - d1) = u2 - d2 / (u2_max - d2). It ensures that the relative gain of each player (as a fraction of the maximum gain they could achieve) is equal. This can be interpreted as a principle of equal proportional concessions.

  2. Disagreements Table

    We now present the key points of disagreement. Each row states one exact divergence. We have taken care to state each position in a way that the respective proponent would endorse.

    | Issue                                                                                     | Nash Bargaining Solution (NBS) Position                                                                 | Kalai-Smorodinsky Bargaining Solution (KSBS) Position                                                                 |
    |-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|
    | **Independence of Irrelevant Alternatives (IIA) vs. Individual Monotonicity (IM)**        | We hold that IIA is a compelling axiom: if the solution is in a subset T of S that contains d, then the solution for (T,d) should be the same as for (S,d). This ensures consistency when options are removed. | We hold that IM is a compelling axiom: if, for fixed d, the set S expands in a way that improves the maximum achievable utility for one player (say player 1) without affecting the other player's maximum, then player 1 should not be worse off in the new solution. This ensures that a player benefits from having more opportunities. |
    | **Response to changes in the bargaining set**                                             | When the set of alternatives expands, the NBS may change arbitrarily as long as the new point is still the product-maximizer. We see this as a virtue: it reflects that the bargaining outcome is determined solely by the available options and the disagreement point. | The KSBS guarantees that when the set expands in a direction that benefits one player, that player's outcome does not decrease. We see this as essential to fairness: a player should not be punished for having more opportunities. |
    | **Interpretation of the disagreement point**                                              | We regard the disagreement point as the only relevant threat point. The NBS uses the entire structure of S but only through the product maximization, which is sensitive to the shape of S near the solution. | We agree that the disagreement point is crucial, but we also believe that the utopia point (the ideal aspirations) should play a role. The KSBS uses the utopia point to calibrate the relative gains. |
    | **Apparent disagreement: Role of the utopia point**                                       | We do not object to the use of the utopia point per se, but we believe that IIA is more fundamental. The utopia point can change arbitrarily when irrelevant alternatives are added, which we find unacceptable. | We argue that the utopia point is a natural reference and that the violation of IIA is acceptable because the KSBS satisfies IM, which we consider more important. |

    Note: One apparent disagreement that is merely verbal is about the term "fairness". Both sides use the term, but they mean different things. The NBS camp sees fairness in the consistency of IIA, while the KSBS camp sees fairness in the monotonicity of IM.

  3. Cruxes

    We identify the following cruxes. Settling one of these would move at least one of us.

    3.1. **Crux 1: The normative appeal of IIA versus IM.** Which axiom is more fundamental for a fair bargaining outcome? 

    3.2. **Crux 2: The role of the utopia point.** Should the solution depend on the utopia point (i.e., the maximum each player can achieve in S) or only on the local structure around the solution and the disagreement point?

    3.3. **Crux 3: Sensitivity to the bargaining set.** How should the solution respond when the bargaining set expands in a way that only increases one player's maximum achievable payoff?

  4. Concrete Bargaining Problems

    We now present two bargaining problems that we both agree bear on the cruxes. For each, we record the problem, the predictions of each solution, and what each of us would count as evidence against our own view.

    **Problem 1:**
        Let d = (0,0). 
        Let S be the convex hull of the points (0,0), (1,0), (0,1), and (0.5, 0.6). 
        [Note: This set is convex and compact. The Pareto frontier is the line segment from (0.5,0.6) to (1,0).]

        - NBS: The Nash solution maximizes u1 * u2 over S. We compute:
            On the segment from (0.5,0.6) to (1,0): parameterize by t in [0,1]: 
              u1 = 0.5 + 0.5t, u2 = 0.6 - 0.6t.
            Then the product: (0.5+0.5t)*(0.6-0.6t) = 0.3*(1+t)*(1-t) = 0.3*(1-t^2) -> maximum at t=0: (0.5,0.6).
            So NBS = (0.5, 0.6).

        - KSBS: The utopia point is (u1_max, u2_max) = (1, 0.6). 
            The KSBS is the point (u1, u2) on the Pareto frontier such that:
               u1 / 1 = u2 / 0.6   =>   u2 = 0.6 * u1.
            We also have the equation of the Pareto frontier: u2 = 0.6 - 0.6*( (u1-0.5)/0.5 ) = 0.6 - 1.2*(u1-0.5) = 1.2 - 1.2*u1.
            Solving: 0.6 * u1 = 1.2 - 1.2*u1  =>  1.8*u1 = 1.2  => u1 = 2/3 ≈ 0.666, u2 = 0.6 * (2/3) = 0.4.
            So KSBS = (2/3, 0.4).

        This example shows a clear divergence: NBS is (0.5,0.6) and KSBS is (0.666,0.4).

        - Nash Proponent: 
            Prediction: The correct solution is (0.5,0.6). 
            Why: It maximizes the product of gains and satisfies IIA. If we consider a subset T of S that excludes the point (1,0) but still contains (0.5,0.6) and (0,0), then the solution remains (0.5,0.6). The KSBS changes if we remove (1,0) because then u1_max becomes 0.5 and the KSBS would become (0.5,0.6). This shows that the KSBS is sensitive to irrelevant alternatives (like (1,0) that are not chosen). 
            Evidence against my view: If it were shown that in actual bargaining experiments, players do not settle at (0.5,0.6) but at something closer to (0.666,0.4) even when they know the entire set, that would challenge the descriptive power of NBS. Also, if there were a compelling real-world example where the removal of an irrelevant alternative that is not the solution leads to an outcome that everyone considers unfair, that would challenge the normative appeal of IIA.

