  Key challenges:
  1. Weighting different moral views.
  2. Handling incommensurability (when a view says the comparison is impossible).
  3. Dealing with infinite stakes (e.g., longtermist views might see existential risks as having infinite negative value).
  4. Accounting for the possibility of an unconsidered moral view that could dominate.
  5. Setting boundaries: when to say no, when to hand off.

