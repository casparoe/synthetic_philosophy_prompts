  ### Practical Procedure for Grant Decisions Under Moral Uncertainty

  This procedure transforms moral uncertainty theory into a 2-hour meeting-friendly process. It uses a pre-meeting spreadsheet (takes ~20 min per staff member) and outputs: **Fund**, **Don't Fund**, or **Values Call for Board**. The core idea is **normalize impacts to a benchmark grant**, **assign equal weight to each moral view** (not each person), and **handle vetoes/infinities first**.

  ---

  #### **Pre-Meeting Spreadsheet**  
  *(Completed by each staff member for each grant)*  
  1. **Moral View**: Select one: `Neartermist`, `Animal Welfare`, `Longtermist`, `Rights-Based` (add others as needed).  
  2. **Veto?** `Yes/No`. *Does this grant violate core constraints (e.g., rights violations)?*  
  3. **Impact Estimate**:  
     - *Quantitative*: Estimate impact in your view's units (e.g., DALYs averted, animal suffering reduced, % risk reduction).  
     - *Normalization*: Convert to "Benchmark Grant Equivalents" (BGE). *Example: "This grant achieves X% of the impact of our benchmark $100K deworming grant."*  
  4. **Infinite Stakes?** `Yes/No`. *Could this grant cause/predict infinite harm or good (e.g., extinction risk)?*  
  5. **Incommensurable?** `Yes/No`. *Can this grant be compared to our benchmark?*  
  6. **Unconsidered View Risk**: `High/Medium/Low`. *Is there a plausible moral view we're ignoring that would dominate? (e.g., "This might exploit marginalized groups")*  

  > **Benchmark Grant**: A real grant all staff understand (e.g., a $100K deworming program). Each view defines its own BGE (e.g., Neartermist: 100 DALYs = 1.0 BGE; Animal Welfare: 1,000 suffering-years averted = 1.0 BGE).

  ---

  #### **Meeting Procedure** (120 min total)  
  **Step 1: Present Proposal** (5 min)  
  - Staff lead summarizes the grant.  

  **Step 2: Veto Check** (15 min)  
  - *Rule*: **Any veto → Don't Fund**.  
  - *Mechanical*: If any staff marks "Veto? = Yes," the grant is rejected. No debate.  
  - *Why*: Avoids unpassable proposals (e.g., rights violations).  
  - *Handoff*: If vetoed, end discussion. Output = **Don't Fund**.  

  **Step 3: Handle Infinities** (20 min)  
  - *Rule*: **Any infinity → Escalate to Board**.  
  - *Mechanical*:  
    - If any staff marks "Infinite Stakes? = Yes," output = **Values Call for Board**.  
    - *Exception*: If **all** non-vetoed views agree on the *direction* (e.g., all say "infinite good"), output = **Fund**.  
  - *Why*: Infinities (e.g., extinction risk) are too high-stakes for staff to arbitrate.  
  - *Judgment Call*: Staff debate if stakes are truly infinite (e.g., "Is this AI risk grant *really* infinite, or just high-impact?").  

  **Step 4: Aggregate Impacts** (30 min)  
  - *Rule*: **Fund if aggregate score ≥ 0.5×Benchmark**.  
  - *Mechanical*:  
    1. Exclude incommensurable views (staff marked "Incommensurable? = Yes").  
    2. For each remaining view, average its BGE scores (e.g., if two Neartermists rate a grant at 0.8 and 1.2 BGE, Neartermist view = 1.0 BGE).  
    3. Assign **equal weight** to each view (e.g., 25% each for 4 views).  
    4. Calculate aggregate score: `(Weight₁ × BGE₁) + (Weight₂ × BGE₂) + ...`  
    5. **Fund if aggregate ≥ 0.5; else Don't Fund**.  
  - *Why*: Balances views without privileging "loud" staff. Threshold ensures cost-effectiveness.  
  - *Judgment Call*: Staff debate BGE estimates (e.g., "Is 0.1% pandemic risk reduction really 5.0 BGE?").  

  **Step 5: Unconsidered View Check** (15 min)  
  - *Rule*: **High risk → Escalate to Board**.  
  - *Mechanical*: If any staff marks "Unconsidered View Risk = High," output = **Values Call for Board**.  
  - *Why*: Avoids blind spots (e.g., "What if a decolonial view condemns this?").  
  - *Judgment Call*: Staff debate if risk is truly "High" (e.g., "Is this a niche concern or a major oversight?").  

  **Step 6: Final Output** (5 min)  
  - Output one of:  
    - **Fund** (no veto, no infinities, aggregate ≥ 0.5, no high unconsidered risk).  
    - **Don't Fund** (veto OR aggregate < 0.5).  
    - **Values Call for Board** (infinities OR high unconsidered risk).  

  ---

  ### Worked Examples  
  **Benchmark Grant**: $100K deworming program.  
  - Neartermist: 100 DALYs averted = 1.0 BGE  
  - Animal Welfare: 0 BGE (no animal impact)  
  - Longtermist: 0 BGE (no long-term effect)  
  - Rights-Based: 0 BGE (permissible but not quantifiable)  
  - *Aggregate Benchmark Score* = 0.25 (each of 4 views weighted equally: 0.25×1.0 + 0.25×0 + 0.25×0 + 0.25×0 = 0.25).  

  ---

  #### **Example 1: Deworming Program** ($200K grant)  
  *Why this tests the procedure*: I’m neartermist-sympathetic, but the procedure rejects this—exposing tradeoffs.  

  **Pre-Meeting Spreadsheet**:  
  | Staff View           | Veto? | BGE    | Infinite? | Incomm.? | Unconsidered Risk |  
  |----------------------|-------|--------|-----------|----------|-------------------|  
  | Neartermist A        | No    | 0.75   | No        | No       | Low               |  
  | Neartermist B        | No    | 0.75   | No        | No       | Low               |  
  | Animal Welfare A     | No    | 0      | No        | No       | Low               |  
  | Animal Welfare B     | No    | 0      | No        | No       | Low               |  
  | Longtermist          | No    | 0.01   | No        | No       | Low               |  
  | Rights-Based (Chair) | No    | N/A    | No        | **Yes**  | Low               |  

  **Procedure**:  
  1. **Veto Check**: No veto → proceed.  
  2. **Infinities**: None → proceed.  
  3. **Aggregate Impacts**:  
     - Exclude Rights-Based (incommensurable).  
     - View averages:  
       - Neartermist: (0.75 + 0.75)/2 = 0.75 BGE  
       - Animal Welfare: (0 + 0)/2 = 0 BGE  
       - Longtermist: 0.01 BGE  
     - Equal weights (3 views): 33% each.  
     - Aggregate = (0.33×0.75) + (0.33×0) + (0.33×0.01) = **0.25**.  
  4. **Threshold**: 0.25 < 0.5×0.25 → **Don't Fund**.  
  5. **Unconsidered View**: Low risk → no escalation.  
  **Output: Don't Fund**  

  *Why it fails my sympathies*: As a neartermist, I see 150 DALYs averted—but the grant is rejected because:  
  - High cost ($200K vs. benchmark $100K).  
  - Animal/Longtermist views dilute the score.  
  - *Procedure’s flaw*: Neutral views (0 BGE) penalize grants that only benefit one view.  

  ---

  #### **Example 2: Farmed Fish Welfare Campaign** ($300K grant)  
  *Why this tests the procedure*: Contentious, but aggregate score works.  

  **Pre-Meeting Spreadsheet**:  
  | Staff View           | Veto? | BGE   | Infinite? | Incomm.? | Unconsidered Risk |  
  |----------------------|-------|-------|-----------|----------|-------------------|  
  | Neartermist A        | No    | 0.05  | No        | No       | Medium            |  
  | Neartermist B        | No    | 0.10  | No        | No       | Medium            |  
  | Animal Welfare A     | No    | 0.40  | No        | No       | Low               |  
  | Animal Welfare B     | No    | 0.30  | No        | No       | **High**          |  
  | Longtermist          | No    | 0     | No        | No       | Low               |  
  | Rights-Based (Chair) | No    | N/A   | No        | **Yes**  | Low               |  

  **Procedure**:  
  1. **Veto Check**: No veto → proceed.  
  2. **Infinities**: None → proceed.  
  3. **Aggregate Impacts**:  
     - Exclude Rights-Based.  
     - View averages:  
       - Neartermist: (0.05 + 0.10)/2 = 0.075 BGE  
       - Animal Welfare: (0.40 + 0.30)/2 = 0.35 BGE  
       - Longtermist: 0 BGE  
     - Equal weights (3 views): 33% each.  
     - Aggregate = (0.33×0.075) + (0.33×0.35) + (0.33×0) = **0.14**.  
  4. **Threshold**: 0.14 < 0.5×0.25 → **Don't Fund**.  
  5. **Unconsidered View**: Animal Welfare B flags "High" risk (e.g., "Might ignore Indigenous fishing communities"). → **Values Call for Board**.  
  **Output: Values Call for Board**  

  *Why it works*: Low aggregate score triggers escalation due to unconsidered view risk.  

  ---

  #### **Example 3: Biosecurity Grant** ($500K for pandemic monitoring)  
  *Why this tests the procedure*: Longtermist infinities dominate.  

  **Pre-Meeting Spreadsheet**:  
  | Staff View           | Veto? | BGE    | Infinite?     | Incomm.? | Unconsidered Risk |  
  |----------------------|-------|--------|---------------|----------|-------------------|  
  | Neartermist A        | No    | 15.0   | No            | No       | Low               |  
  | Neartermist B        | No    | 8.0    | No            | No       | Low               |  
  | Animal Welfare       | No    | 0      | No            | No       | Low               |  
  | Longtermist          | No    | N/A    | **Yes (Good)**| **Yes**  | Low               |  
  | Rights-Based (Chair) | **Yes**| N/A    | No            | Yes      | Low               |  

  **Procedure**:  
  1. **Veto Check**: Rights-Based Chair vetoes ("Surveillance violates privacy rights") → **Don't Fund**.  
     *Stops here*.  

  **Output: Don't Fund**  

  *Why it’s robust*: Veto overrides even strong longtermist support.  

  ---

  ### What the Procedure Gets Wrong  
  1. **False Neutrals**: Views that assign "0 BGE" to grants outside their scope (e.g., animal welfare on deworming) drag down aggregate scores.  
     - *Fixable?* Only if staff agree to "opt out" of scoring irrelevant grants.  
  2. **BGE Subjectivity**: Staff may manipulate BGE estimates to favor their view.  
     - *Fixable?* Use pre-agreed benchmarks (e.g., "1 BGE = 100 DALYs").  
  3. **Cluelessness**: Longtermist views often reject quantification (e.g., "We can’t model AI risk"). Forces them to choose between "infinite" or "incommensurable."  
  4. **Weighting**: Equal per-view weighting may feel unfair to majority views (e.g., if 4/5 staff are neartermists).  
  5. **Speed**: Requires staff to translate complex grants into BGEs quickly.  

  ### Final Advice  
  - **Pilot the procedure** on 1–2 grants to refine benchmarks.  
  - **Escalate strategically**: Use "Values Call for Board" sparingly (e.g., only for infinities/unconsidered risks).  
  - **Admit limitations**: This won’t resolve deep disagreements—but it makes them legible.  

  > "This won’t make you agree, but it will make your disagreements tractable."
