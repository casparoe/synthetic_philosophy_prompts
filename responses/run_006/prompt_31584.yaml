  3. **Veto**: We treat any veto as rejection. But if it's not the board chair, we might not need to? However, we do because we don't want to propose something that a staff member finds impermissible.

  4. **Infinite handling**: We fund if any non-vetoed view has infinite positive. This might lead to funding too many speculative longtermist grants? But we rely on the longtermist PO to use "infinite" only when truly appropriate.

  5. **Uncertainty**: We didn't incorporate uncertainty in the aggregation. We used point estimates. We could extend to ranges, but that would complicate.

  6. **Dominant unconsidered view**: We only flag for the board in specific cases. We might miss some.

  7. **Benchmark**: The benchmark must be consistent. We used a deworming grant. But the animal welfare view had to use their own benchmark for normalization. We allowed that. Each view defines the impact of the benchmark in their own terms.

  8. **Example 1 rejection**: This might be against my sympathies (as a neartermist) but the procedure rejected it because it was less cost-effective than the benchmark and other views were neutral. We might want to fund a grant that is worse than the benchmark if we have extra funds? But we are comparing one grant at a time. We assume the alternative is the benchmark. We might need to compare against a portfolio? But that is too complex.

  ### Conclusion
  The procedure is a starting point. It will make mistakes (like rejecting a deworming grant that is slightly less cost-effective than our benchmark) but it forces explicit normalization and aggregation. It also handles vetoes and infinities. We can refine the threshold and weighting over time.

  Note: The procedure requires discipline from staff to provide honest and consistent inputs. It also requires that they understand their moral views well enough to quantify. The rights-based view might never provide a magnitude, so it will only be a veto check.

  We hope this brings structure to the meetings.
