  ### Pre-Meeting Preparation (20 minutes per program officer)
  Each program officer (PO) fills out a spreadsheet for the grant proposal. The spreadsheet has the following columns:
  1. **Moral View**: Which moral view they are representing (e.g., neartermist global health, animal welfare, longtermism, rights-based deontology).
  2. **Expected Impact in View's Terms**: A qualitative description and, if possible, a quantitative estimate (with uncertainty) of the impact of the grant in the units of that view (e.g., DALYs averted, animal suffering reduced, probability reduction of existential catastrophe, rights violations prevented). If the PO cannot quantify, they can leave it as qualitative.
  3. **Scale Normalization**: The PO must provide a normalization factor to convert the impact into a common scale. We suggest using a benchmark grant that the foundation has previously funded (or a standard one) as a reference. For example, for a neartermist, the benchmark might be a typical deworming program. The PO will state how many units of their view's measure (e.g., DALYs) that benchmark grant achieves. Then, the impact of the current grant is normalized by the benchmark. This yields a "normalized impact" (NI) for the grant under that view: NI = (impact of current grant) / (impact of benchmark grant). This NI is unitless and positive (if beneficial) or negative (if harmful). If the PO cannot do this (e.g., because the view is incommensurable with the benchmark), they mark it as "incommensurable".
  4. **Infinite Stakes**: If the grant has infinite positive or negative stakes according to the view (e.g., it affects existential risk positively or negatively in a longtermist view), the PO marks a checkbox for "infinite positive" or "infinite negative". They can also note if it's "near-infinite" (e.g., very high stakes but finite) and provide a large number for NI accordingly.
  5. **Uncertainty**: The PO can note if there is high uncertainty in the impact estimate (e.g., a range) but for simplicity, we might ask for a point estimate for the meeting. Alternatively, we can have them provide a confidence interval and then use the mean or median.
  6. **Dominant Unconsidered View**: The PO can flag if they believe there is a moral view not represented in the room that, if considered, would dominate the decision (e.g., "This grant might violate rights, and if we had a rights-based deontologist, they would veto it"). This is a warning to the group.

