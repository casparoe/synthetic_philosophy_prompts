answer: |-
  ### **Probability Interpretations In-Class Game: "The Uncertainty Exchange"**  
  **Time:** 75 minutes  
  **Students:** 15 undergraduates (mixed stats background)  
  **Goal:** Experience frequentist, subjectivist, and propensity intuitions through betting, without prior exposure to terminology.  

  ---

  ### **Materials**  
  - **Play Money:** 500 poker chips (or paper slips) total. Each student starts with 20 chips (300 chips). Reserve 200 for payouts.  
  - **Events:**  
    1. **Coin Flips:** A fair coin.  
    2. **Single Case:** A sealed box labeled "Mystery Tube" (empty).  
    3. **Coin Flip (again):** For Dutch book round.  
  - **Betting Boards:** Whiteboard/markers to post odds in Round 3.  
  - **Tracking:** Spreadsheet/app to track chip balances.  

  ---

  ### **Rules & Payoff Scheme**  
  **Chip Values:** Chips convert to candy/extra credit (e.g., 50 chips = 1 candy bar). No real money.  

  #### **Round 1: Repeatable Event (Frequentism Pull)**  
  - **Event:** Flip a fair coin **10 times**. Bet on the **number of heads** (4, 5, or 6).  
  - **Betting:**  
    - Students buy a "ticket" for their chosen outcome (e.g., "5 heads").  
    - Ticket price: Fixed at 5 chips.  
    - Payout: **30 chips** if correct.  
  - **Why?** Stable frequency (50% heads) makes 4–6 heads likely (~65.6% chance). Students see payouts correlate with long-run stability.  

  #### **Round 2: Single-Case Event (Propensity/Subjectivism Pull)**  
  - **Event:** **"Will the Mystery Tube contain a red marble?"** (Box is sealed; no prior info).  
  - **Betting:**  
    - Students post **subjective odds** (e.g., "I offer 1:1 odds on YES").  
    - Another student accepts their odds by betting chips (e.g., bet 10 chips on "YES" at 1:1 to win 20 total).  
    - After bets, reveal the box is **empty** (no marble). All bets on "YES" lose; "NO" wins.  
  - **Payouts:** Winners gain chips from losers.  
  - **Why?** No frequency exists. Students rely on personal hunches (subjectivism) or imagined "tendencies" (propensity).  

  #### **Round 3: Dutch Book (Subjectivism Coherence Pull)**  
  - **Event:** A **single coin flip** (heads/tails).  
  - **Betting:**  
    - Each student posts public odds for **heads** (e.g., "I pay 3:1 on heads").  
    - Others bet *against* them if odds are incoherent (e.g., if Alice offers 3:1 on heads *and* 3:1 on tails, her implied probabilities sum to >1).  
    - Bettor places **two bets** (e.g., 10 chips on heads with Alice at 3:1, 10 chips on tails with Alice at 3:1).  
    - After flip, bettor wins one bet. Alice loses chips regardless.  
  - **Payout:** Bettor gains chips; bookie loses chips if odds are incoherent.  
  - **Why?** Forces coherent odds (sum of implied probabilities = 100%) to avoid guaranteed loss.  

  ---

  ### **Step-by-Step Flow**  
  1. **Setup (5 min):** Distribute chips, explain rules (no jargon!), emphasize chip rewards.  
  2. **Round 1: Coin Flips (20 min)**  
     - Bet on 4/5/6 heads (tickets cost 5 chips, payout 30 if correct).  
     - Flip coin 10x live. Settle payouts.  
  3. **Round 2: Mystery Tube (20 min)**  
     - Students post/accept odds on the sealed box.  
     - Reveal emptiness. Settle payouts.  
  4. **Round 3: Dutch Book (20 min)**  
     - Students post odds for a coin flip. Peers exploit incoherent odds.  
     - Flip coin once. Settle payouts.  
  5. **Debrief (10 min):** Link experiences to interpretations (see below).  

  ---

  ### **Debrief: Mapping Game to Interpretations**  
  | **Game Moment**          | **Interpretation**      | **Why It "Pulls" Them**                                                                 |  
  |--------------------------|-------------------------|------------------------------------------------------------------------------------------|  
  | Round 1 (coin flips)     | **Frequentism**         | Payoffs mirror long-run frequency (4–6 heads occurs ~66% of the time in repeated trials). |  
  | Round 2 (Mystery Tube)   | **Subjectivism/Propensity** | No frequency exists. Bets rely on personal belief (subjectivism) *or* imagined physical tendency (propensity). |  
  | Round 3 (Dutch book)     | **Subjectivism**        | Incoherent odds = guaranteed loss. Coherence forces probabilities to "add up" like degrees of belief. |  

  #### **What the Activity CAN’T Settle**  
  - **Round 2’s ambiguity:** Students may think propensity "wins" if they bet based on imagined tube properties. Stress:  
    > "This round *doesn’t* prove propensities exist. You could be using made-up tendencies! Subjectivism handles single cases *without* physical properties."  
  - **Frequentism’s limits:** Round 1’s frequency is stable, but real-world events (e.g., climate) often lack this.  
  - **Dutch books ≠ proof:** Coherence avoids sure loss but doesn’t validate "true" probabilities—just internally consistent beliefs.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Round 2 bets cluster around 50:50 ("safe" odds) → No emotional stake.  
     **Fix:** Seed drama—whisper fake hints (e.g., "I heard the tube was prepared by a scientist").  

  2. **Problem:** Round 3 incoherence is rare (students post 1:1 odds to avoid exploitation).  
     **Fix:** Demo a guaranteed loss upfront (e.g., instructor posts 2:1 on *both* heads/tails; let a student "clean them out").  

  3. **Problem:** Math-phobic students disengage during Dutch books.  
     **Fix:** Use simple odds (1:1, 2:1) and hand out a "cheat sheet" for implied probabilities (e.g., 3:1 = 25% chance).  

  4. **Problem:** Students demand "correct" answers post-game.  
     **Fix:** Debrief script:  
     > "This game makes you *feel* why each interpretation exists. No view is ‘right’—frequentism needs data, subjectivism handles singles, propensity imagines hidden forces. Philosophers debate which is *most useful*."  

  ---

  ### **Why This Works**  
  - **Frequentism:** Round 1’s repeatable bet ties payouts to observable stability.  
  - **Subjectivism/Propensity:** Round 2’s unknowable event forces personal judgment vs. invented tendencies.  
  - **Coherence:** Round 3’s exploitation threat makes abstract probability laws visceral.  
  - **No Lecturing:** The rules and payoffs drive insights—students "live" the interpretations before naming them.  

  **Final Tip:** Run the Mystery Tube round *before* Round 1 to amplify single-case confusion. The coin’s stability in Round 1 then feels concretely different!
