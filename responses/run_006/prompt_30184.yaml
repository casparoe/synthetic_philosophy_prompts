       - In round 2, some of you thought about the instructor's skill (propensity) and some just used your gut (subjectivism). The activity doesn't tell us which is the "true" probability. It just shows that for single-case events, we need to go beyond frequency.
       - Round 3 doesn't tell us that probabilities are subjective. It only tells us that if we are going to bet, we must be coherent. A frequentist might avoid betting on single events? Or might use a reference class to set the odds? But then they would be coherent too.

    **Predictable Problems:**

    - **Problem:** Round 1: The binomial calculation might be too hard for some. Some students might set a price of 50? But the expected value is 66. Then if A doesn't occur, they lose 50? And they might feel bad.
        - **Handling:** Reassure that it's a learning experience. We are not trying to win chips but to learn about probability.

    - **Problem:** Round 2: The shot might be missed or made? If made, then those who paid a lot win? If missed, those who paid a lot lose. This might be demotivating.
        - **Handling:** Emphasize that it's about the decision process, not the outcome.

    - **Problem:** Round 3: Students might set P_H and P_T arbitrarily? Some might set both very low? Then they get penalized and lose many chips? And they might be upset.
        - **Handling:** We can cap the penalty? Or we can let them revise? But that defeats the purpose. Alternatively, we can not use their entire chip stack? We can say: you start with 100 chips, and the penalty cannot exceed 100? But if they set P_H=0 and P_T=0, then they lose 100? And they are broke. That's okay? They learn a lesson.

        Alternatively, we can limit the maximum bet? Maybe they cannot set prices below 20? Or above 80? But that's arbitrary.

        Or we can tell them: "You want to set prices that are fair and that you believe in." Then they might set more reasonably.

    - **Problem:** The debriefing might be too abstract.
        - **Handling:** Use concrete examples from the game.

    **Conclusion:**
    This design should work. We use play money, and the game has three rounds that illustrate the three interpretations. The debriefing maps the rounds to the interpretations and clarifies the limits.

