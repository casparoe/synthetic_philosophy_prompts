  For the first question on ex ante/ex post: The film’s power comes from blending discrimination against existing people (Vincent) with critiques of selection, but philosophically these are distinct. Procreative beneficence cares about which child gets born, not how society treats them later. The film’s conflation might weaken its direct critique of selection but strengthens its warning about societal attitudes enabling selection. 

