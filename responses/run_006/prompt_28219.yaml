prompt: |-
  I'm teaching a seminar on constitutional theory to advanced undergraduates, and next week's session is on the idea of constitutional precommitment—the Ulysses-contract analogy, where a polity binds itself against its own foreseeable future impulses. The students have already read some Elster, so they know the basic story, but I need to plan the ninety-minute session so that the normative structure of the idea actually lands. Don't explain the material to me; plan how I should structure the explanation. I need the dependency order: what conceptual pieces have to be in place before the analogy does any real work (presumably the problem of time-inconsistency, and the distinction between first-order and second-order preferences), which example should carry the whole session and what it must have and lack—and whether the original Ulysses-and-the-Sirens story suffices or needs a supplement from ordinary life. I also want the misconceptions students predictably form: I'm guessing they'll conflate precommitment with promising, or think the analogy justifies any constitutional entrenchment whatsoever, or miss that the binding must be self-imposed to carry the normative weight it does. Tell me exactly where in the sequence each misconception should be headed off, what to leave explicitly untreated at this level, and one question I can pose in the final ten minutes that will tell me whether they've grasped the normative puzzle—why a democracy would ever need to tie its own hands—rather than just the descriptive mechanism.
reasoning: |-
  Okay, this professor is teaching a constitutional theory seminar and needs a structured plan for a 90-minute session on constitutional precommitment. They've already covered Elster, so students know the basics, but the professor wants the normative weight to really land. 

  First, I need to unpack what they're asking. They want a dependency order - meaning which concepts must be established before the Ulysses analogy works. The key elements seem to be time-inconsistency and first-order vs second-order preferences. Without these, the analogy is just a story without theoretical teeth.

  They're also asking for a central example that can carry the session. The original Ulysses myth might be too clean - real-life examples like addiction or dieting could better show internal conflict. But constitutional examples are trickier because collectives don't have unified preferences like individuals. That tension is exactly where the normative puzzle lives.

  The misconceptions they anticipate are spot-on: conflating precommitment with promising (which is interpersonal), thinking any entrenchment is justified (missing the self-binding requirement), and overlooking the collective action problem in democracies. Each needs surgical prevention at specific points.

  For the finale, they want a diagnostic question that tests understanding of why democracies would self-bind. Something about the tension between present and future selves seems essential - maybe asking them to design a precommitment against majority tyranny that doesn't become minority tyranny itself.

  The real challenge is sequencing. Can't jump to constitutions until individual psychology is rock-solid. And must distinguish precommitment from mere obstacles - the binding must align with higher-order preferences. That's why the dieting example feels useful early on: everyone gets that internal struggle.

  Also need to flag what not to cover - like enforcement mechanisms or non-democratic contexts. This session is about the normative core only. The professor seems expert enough to handle tangents, but the structure should keep them focused.

  That final question is crucial. It can't be mechanical ("how does amendment work") but must expose whether they see precommitment as democracy's self-correction mechanism rather than its limitation. The voting rights example might work - why bind future majorities to protect minority rights if democracy is about majority rule?
answer: |-
  Here's a structured 90-minute session plan focusing on dependency order, conceptual foundations, targeted misconceptions, and assessment:

  **Core Objective:** Students grasp the **normative justification** (binding future selves to protect against weakness of will/mob rule) not just the descriptive mechanism.

  **Dependency Order & Session Flow (90 mins):**

  1.  **Grounding the Problem: Time-Inconsistency & Self-Defeat (15 mins)**
      *   *Start:* Concrete, individual-level example (**Dieting/Saving**). "Imagine you seriously want to lose weight next month. Why might you *now* throw out the junk food, schedule workouts with a trainer who charges cancellation fees, or use an app that locks your fridge after 8 PM?"
      *   *Build Concept:* **Time-Inconsistency of Preferences.** "What I want *now* (commitment devices) vs. what I *foresee* I might want later (cake at midnight). Acting on that later impulse would defeat my *overall* goal."
      *   *Key Distinction:* **First-Order Preferences** (Immediate desire: eat cake) vs. **Second-Order Preferences** (Reflective desire: desire *to desire* health/long-term goals). The conflict creates vulnerability.
      *   *Why Essential?:* Without this psychological conflict, precommitment seems irrational coercion, not rational self-binding.

  2.  **The Binding Mechanism: Ulysses & the Sirens (10 mins)**
      *   *Present Analogy:* Briefly recount Ulysses (knows Sirens' song will overwhelm his reason/first-order desire to survive; binds himself *now* to resist *then*; sailors block ears/ignore pleas).
      *   *Analyze Components:* Identify the elements: Foreseen threat, weakness of will, preemptive self-binding, external enforcement (ropes, wax). Focus on *why* binding is necessary (overcoming *self*).
      *   *Limitation Flagged:* "This is an individual story. Polities are collectives. How does this map?"

  3.  **Bridging to Polity: Collective Self-Binding & Its Unique Problems (20 mins)**
      *   *Transition Example:* **Rights Protection Against Tyranny of the Majority.** "Why might a founding generation, *including* the current majority, entrench rights (speech, religion, due process) knowing a future passionate majority might want to violate them?"
      *   *Map Concepts:*
          *   "Future Impulse" = Passionate Majority's discriminatory law (1st-order preference).
          *   "Reflective Preference" = Founders' commitment to core principles of equality/liberty (2nd-order preference).
          *   "Binding" = Constitutional entrenchment (text), independent judiciary (enforcement mechanism).
      *   *Crucial Normative Point:* The binding is **self-imposed** by the polity (through its representatives/process) to protect its *own* enduring values/goals against its *own* foreseeable future irrationality or passion. It's democratic self-correction.
      *   ***Preempt Misconception #1 (Conflation with Promising):*** "This is NOT a promise *to others* (like a treaty). It's the polity binding *itself* to its *own* principles. The 'other' is its own future self prone to error/weakness. Promises involve distinct parties; precommitment involves diachronic selves."

  4.  **Deepening the Polity Analogy & Addressing Misconceptions (25 mins)**
      *   *Core Constitutional Example:* **The Amendment Process.** "Why make it hard? Why not let a simple majority change anything anytime?"
      *   *Analysis:*
          *   Identifies the "impulse" (easy change by transient majority).
          *   Identifies the "reflective preference" (stability, deliberation, protecting core structures/rights from fleeting passions).
          *   The difficulty is the "binding" (supermajority requirements, time delays, multiple bodies).
      *   ***Preempt Misconception #2 (Justifies Any Entrenchment):*** "Does the precommitment logic justify *any* rule a past generation imposes? **NO.** The *normative force* depends on:
          1.  **Self-Imposition:** Was it genuinely the polity binding *itself* via legitimate process? (Reject imposed constitutions).
          2.  **Rationale:** Is the binding aimed at protecting *fundamental* principles/goals against *foreseeable* self-defeat? (Reject entrenchments serving narrow factional interests or preventing necessary adaptation).
          3.  **Revisability:** Can the 'self' still change its mind through extraordinary effort? (Amendment process itself is key)."
      *   *Contrast:* Discuss a counter-example where entrenchment *lacks* normative precommitment weight (e.g., a racist grandfather clause explicitly designed to *permanently* disenfranchise a minority - not self-protection, but oppression of an 'other').

  5.  **The Normative Puzzle & Assessment (20 mins)**
      *   *Recap Tension:* "Democracy values majority rule. Precommitment restricts future majorities. How is this democratic? Why bind *ourselves*?"
      *   *Synthesize Justification:* Precommitment is justified as an exercise of democratic *sovereignty* over *time* to protect the *conditions* for democracy itself (rights, stability, deliberation) and its *fundamental values* against self-destructive impulses inherent in collective action (passion, myopia, tyranny of majority).
      *   ***Diagnostic Question (Final 10 mins):*** **"Imagine a society deeply committed to both majority rule *and* minority rights. Why might they deliberately design a constitution that makes it *very difficult* for a future majority to restrict voting rights, even if that future majority passionately believes such restrictions are necessary? How does this avoid simply being rule by a past majority?"**
          *   *Why it works:* It forces them to articulate the precommitment logic: protecting a fundamental democratic condition (voting rights) *from the polity's own foreseeable future impulse* (potential majority disenfranchising others). It directly addresses the core tension (democracy limiting democracy) and the self-imposed, protective rationale. Answers revealing confusion will likely conflate past rule vs. self-binding, miss the protection-of-self rationale, or fail to see the threat as internal.

  **What to Explicitly Leave Untreated at This Level:**
  *   Enforcement mechanisms in detail (e.g., judicial review philosophies).
  *   Specific historical debates about particular clauses.
  *   Non-democratic uses of precommitment logic.
  *   Detailed critiques of precommitment theory (e.g., "dead hand" problem, epistemic objections) – save for future sessions.
  *   Alternative constitutional foundations (e.g., natural law, pure popular sovereignty without precommitment).

  This sequence ensures the psychological foundation (steps 1 & 2) is solid before tackling the collective problem (step 3). The core example (Amendment Process + Rights Protection in Step 4) carries the normative weight by directly confronting the democracy/restraint tension. Misconceptions are preempted at the point where they naturally arise. The diagnostic question isolates the core normative puzzle for assessment.
