answer: |-
  Here are five diagnostic points characterizing the impasse:

  1.  **Explanatory Standards Disagreement:** The core impasse stems from conflicting views on what constitutes a genuine *explanation* of systematicity/compositionality, with LOT requiring discrete, causally efficacious symbolic tokens governed by combinatorial syntax/semantics, while connectionists/dynamical theorists accept emergent functional properties or stable state transitions as sufficient, leading to accusations of "merely simulating" versus "truly implementing." Progress would require a mutually accepted, non-question-begging criterion for when a system possesses intrinsic compositional structure rather than exhibiting compositional behavior.

  2.  **Non-Negotiable Phenomena Dispute:** The two sides fundamentally disagree on whether systematicity and compositionality are universal, non-negotiable *empirical phenomena* demanding explanation (LOT) or artifacts of specific tasks/linguistic analysis that may not reflect the basic nature of all cognition (Connectionism/Embodied Cognition), making reconciliation impossible without empirical consensus on the scope and nature of these features. Progress hinges on decisive evidence demonstrating systematicity/compositionality as either universal and fundamental or task-specific and derived across diverse cognitive domains (I am less confident this operationalization is feasible soon).

  3.  **Competence vs. Mechanism Priority:** The impasse reflects a deeper methodological split: LOT prioritizes specifying the abstract *competence* (the "what" of cognition - inferential roles, truth conditions) any cognitive system must realize, demanding formal representational vehicles, while opponents prioritize describing the concrete causal *mechanisms* (the "how" - neural processes, sensorimotor engagements), viewing the competence level as potentially misleading or epiphenomenal. Progress requires developing theories that successfully integrate competence descriptions with mechanistic implementations without reducing one to the other.

  4.  **Differing Standards of Success:** The debate persists partly because the paradigms employ different, often incommensurable, standards of success (explanatory ideals vs. predictive/modeling fecundity); LOT values satisfying a priori constraints on rationality and meaning, while connectionism/embodiment value neural plausibility, graceful degradation, and learning, making each side see the other as failing on their core metric. Progress necessitates explicit negotiation of the primary goals of cognitive science or recognition that distinct (but complementary) questions are being asked.

  5.  **Representational Ontology Clash:** The disagreement is rooted in incompatible conceptions of "representation": LOT requires discrete, concatenative, semantically evaluable internal symbols with constituent structure, while connectionists use distributed, superpositional vectors whose semantics are often holistic and context-dependent, and radical embodied/dynamicists often reject internal representations altogether, rendering arguments about their structure moot (I am less confident this fully captures the nuances of all non-classical positions). Progress demands a shared, empirically grounded taxonomy of representational types and their cognitive roles, or conclusive evidence against internal representation.
