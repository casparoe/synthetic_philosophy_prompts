  First, I should consider the different ways to characterize this impasse. One dimension is the disagreement about what constitutes a genuine explanation versus a mere model. Classical approaches like Fodor's LOT insist on explicit symbolic representations with combinatorial syntax and semantics, while connectionists and embodied cognition theorists often point to distributed representations or emergent dynamics as sufficient. This leads to accusations of simulation versus genuine implementation.

  Another dimension involves differing views on what phenomena are fundamental to cognition. LOT proponents consider systematicity and compositionality as non-negotiable features that any cognitive theory must explain, while their opponents might view these as artifacts of linguistic cognition rather than general features of thought.

  There's also the deeper methodological divide about the goals of cognitive science. The classical approach seeks to specify the abstract competence that any cognitive system must realize, while connectionist and embodied approaches focus on describing the actual causal mechanisms in biological systems. This reflects a competence versus performance distinction that runs deep in cognitive science.

  I also need to consider whether the debate might be about different standards of success rather than substantive empirical disagreements. Each research program might be answering different questions - LOT focusing on the formal properties of thought, while connectionism focuses on learning and neural plausibility.

  Finally, there's the question of whether "representation" is being understood differently across these frameworks. LOT relies on an internal symbolic system with discrete constituents, while connectionists use distributed representations and embodied theorists might question the need for internal representations altogether.

  For each point, I should indicate what would count as progress. For the explanation versus simulation debate, progress would come from clearer criteria for what counts as implementation. For the phenomena disagreement, we need better ways to test for compositionality in non-classical systems. To bridge the competence-performance gap, we need theories that integrate both levels. For the standards of success division, we need mutual understanding that different questions are being addressed. And for the representation debate, we need a shared taxonomy of representational types.

  I should flag that I'm least confident about the second point regarding which phenomena are non-negotiable, since there's ongoing debate about whether systematicity is truly universal, and about the fifth point regarding representation, since the concept remains contested across philosophy and cognitive science. The other points about explanatory standards, methodological goals, and differing standards seem more established in the literature.

