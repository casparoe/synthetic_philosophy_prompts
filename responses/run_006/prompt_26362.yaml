answer: |-
  Your query brilliantly dissects the fundamental tension at the heart of democratic citizenship. The institutional and rhetorical apparatus surrounding voting does indeed presuppose a theory of practical reason that transcends narrow instrumental rationality. Here's a reconstruction of the implicit theory, an assessment of the asymmetry, and the potential consequences of embracing instrumentalism:

  **The Implicit Theory of Practical Reason Underpinning Voting:**

  The practice doesn't *reject* instrumental rationality entirely but *subordinates* it within a broader, non-instrumental framework. It presupposes a hybrid theory, drawing primarily from **Civic Republicanism** and **Expressive Theories**, with significant elements of **Rule-Consequentialism** and **Kantianism**:

  1.  **Civic Republicanism & Collective Self-Governance:**
      *   **Core Idea:** Voting is not primarily an individual act to secure personal benefit, but a constitutive act of collective self-determination. The "good" achieved is the very existence and legitimacy of the democratic polity itself.
      *   **Presupposition:** The state is a common project ("res publica"). Its authority derives from the consent and ongoing participation of the governed. Abstaining is akin to free-riding on the collective effort required to sustain the system. The "utility" is the preservation of the democratic system and one's standing as a full citizen within it.
      *   **Duty:** Voting is a **civic duty** inherent in membership, akin to jury duty. Its value is intrinsic to maintaining the republic, not contingent on the causal efficacy of a single act.

  2.  **Expressive/Symbolic Action:**
      *   **Core Idea:** Voting is a **performative ritual** expressing core democratic values and affirming individual and collective identity.
      *   **Presupposition:** The act signifies:
          *   **Equal Standing:** Each citizen has an equal voice (one person, one vote).
          *   **Authorization:** Granting or withholding consent from those who govern.
          *   **Solidarity:** Participation in a shared civic community.
          *   **Commitment:** To the norms and procedures of peaceful conflict resolution.
      *   **Duty:** The duty is to *perform* the ritual that reaffirms these values and binds the community together. Low turnout is seen as a symbolic failure, weakening the perceived legitimacy of the system.

  3.  **Rule-Consequentialism:**
      *   **Core Idea:** While one vote doesn't matter, *if everyone followed the rule "Don't vote if your individual impact is negligible,"* democracy would collapse. Therefore, each individual has a duty to follow the beneficial rule "Vote in elections."
      *   **Presupposition:** The collective good (a functioning democracy) requires widespread adherence to a rule that, for any single actor, appears irrational from a purely instrumental view. The "utility" is the systemic outcome of widespread rule-following.

  4.  **Kantian Elements:**
      *   **Core Idea:** Voting expresses **autonomy** (exercising one's reason in the public sphere) and respect for the **dignity of citizenship** and the **categorical imperative** (acting in a way that the maxim of your action could become a universal law – if no one voted, democracy fails).
      *   **Presupposition:** Voting is a duty owed to oneself (as an autonomous being) and to others (as fellow citizens deserving of a legitimate government).

  **Is the Theory Strictly Presupposed?**

  The practice is **compatible with multiple theories** (Civic Republican, Expressive, Rule-Consequentialist, Kantian), but **not compatible with pure, narrow instrumental rationality** focused solely on the causal impact of the single act. Abandoning *all* non-instrumental justifications *would* force a radical revision of the practice and rhetoric. However, abandoning *one specific* non-instrumental theory (e.g., only Kantianism) might not necessarily undermine the practice, as others could still provide support. The core presupposition is that voting has a **non-instrumental value** tied to citizenship, legitimacy, and collective self-rule.

  **The Asymmetry: Voting vs. Other Political Acts**

  The inconsistency you observe is real and stems from specific features of voting:

  1.  **Formal Equality & Anonymity:** Voting is the *only* act where every citizen has precisely the same formal input (one vote) delivered secretly. Protests, donations, letter-writing, and lobbying are inherently unequal – they depend on resources (time, money, social capital, location, eloquence). Treating them as universal duties would be implausible and unfair. Voting's unique procedural equality makes it a plausible candidate for a universal duty.
  2.  **Authorization & Legitimacy:** Voting is the foundational act of authorizing representatives and governments. Other acts influence those already authorized, but voting *is* the authorization ritual itself. The system's legitimacy hinges on sufficient participation in this specific act.
  3.  **Secrecy:** Secrecy removes direct personal consequence or social pressure (in theory), emphasizing the pure act of citizen judgment rather than the instrumental effect of persuasion or demonstration.
  4.  **Systemic Function:** Voting serves the essential systemic function of peacefully aggregating preferences and transferring power. While other acts are valuable, the system *requires* this specific mechanism to function *as a democracy*. Low turnout directly threatens this core function in a way low protest attendance does not.
  5.  **Ritual & Symbolism:** Voting's standardized, periodic, and universal nature makes it a powerful ritual symbolizing the core of the democratic contract. Other acts are more ad hoc and varied.

  **Is the Asymmetry Defensible?**

  It is **defensible, but imperfectly**:

  *   **Defensible:** Given voting's unique role in authorization, procedural equality, and systemic necessity, treating it as a special universal duty distinct from resource-dependent political acts makes sense. It anchors the legitimacy of the entire system in a minimally equal act of participation.
  *   **Imperfect:** The asymmetry risks **undervaluing other crucial forms of participation**. An active democracy needs more than just voters; it needs informed, engaged citizens who monitor government, organize, and advocate between elections. Overemphasizing voting as the *sole* duty can foster passive citizenship ("I voted, I did my part"). It can also obscure the reality that other forms of participation, while unequal, often have *more* instrumental impact than a single vote.

  **Consequences of Embracing Instrumental Logic:**

  If society fully embraced the instrumental logic of the paradox and abandoned the non-instrumental justifications:

  1.  **Collapse of Rhetoric:** "Civic duty" arguments would vanish. Appeals would shift entirely to "Your vote *could* matter in *this close race*" or "Vote if you enjoy it/feel good," which are demonstrably weak motivators for many.
  2.  **Radical Institutional Change:** Efforts to minimize voting costs (e.g., automatic registration, expanded early/mail voting, holiday) might continue, but the *imperative* to achieve high turnout would disappear. The state might cease "get out the vote" campaigns or voter education framed as duties. Voting might become like other low-impact civic acts – encouraged, but not valorized as essential.
  3.  **Legitimacy Crisis:** Persistently low turnout, now seen as rational rather than pathological, would severely undermine the perceived legitimacy of elected governments and the democratic system itself. The "consent of the governed" would be demonstrably thin.
  4.  **Shift in Civic Focus:** Emphasis might shift towards forms of participation perceived as having higher individual instrumental returns: donating (if wealthy), forming influential interest groups, litigation, or disruptive protest. This could exacerbate inequalities in political influence.
  5.  **Potential for Alternative Foundations:** Society might seek new non-instrumental foundations, perhaps emphasizing **deliberative democracy** (duty to participate in reasoned discourse) or **lottery-based systems** (sortition) to replace elections, though these face their own challenges.

  **Conclusion:**

  The institutional and rhetorical apparatus around voting presupposes that citizenship entails non-instrumental obligations tied to collective self-governance, legitimacy, and the expression of equal standing. This primarily Civic Republican/Expressive view is necessary to resolve the paradox of voting and justify the immense effort expended to facilitate mass participation. While the asymmetry between voting and other political acts is defensible based on voting's unique formal equality, role in authorization, and systemic necessity, it risks neglecting the importance of broader civic engagement. Embracing pure instrumental logic would dismantle the moral foundation of voting as a duty, leading to lower participation, a legitimacy crisis, and a fundamental reconfiguration of democratic practice, likely shifting power further towards those with resources to engage instrumentally effective political action. The persistence of the current practice suggests that, despite the rational choice paradox, societies deeply value the non-instrumental goods that mass voting symbolizes and helps sustain.
