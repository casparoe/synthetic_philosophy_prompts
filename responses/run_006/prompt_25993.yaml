answer: |-
  ## Silent Burden on Moriah's Slope

  My son, the knife hangs heavy at my side,
  Your trusting hand in mine, the wood you bear.
  My heart, a storm no father's love can hide,
  Ribs cage a cry that shreds the mountain air.
  Each step ascends where reason finds no ground;
  The law of care demands I shield, defend.
  Yet higher still, a dread, unspeaking sound —
  That voice which claims what love cannot transcend.

  (So if I spoke, what language could explain?
  The stones would judge, the sky would turn to lead.
  To frame this choice makes duty vile again —
  No words can walk where faith alone may tread.)

  Not by my worth, but by His call I climb
  This razor's edge between the knife and light.
  No middle path absolves the act or time:
  One plunge — I murder, or make darkness bright.

  ---

  ### Notes on Execution
  *   **Octave (Lines 1-8):** Builds tension through physical details (knife, hand, wood) and ethical conflict ("law of care," "reason finds no ground") contrasted with the incomprehensible divine command ("dread, unspeaking sound").
  *   **Volta (Lines 9-12):** The turn explicitly addresses Abraham's *silence*. Explaining ("frame this choice") would reduce the absolute, singular duty to God into a universal ethical argument ("makes duty vile again"), betraying the faith-relation. Silence is the only possible response ("faith alone may tread").
  *   **Couplet (Lines 13-14):** States the core paradox: Abraham's action isn't based on personal merit ("Not by my worth") but solely on the absolute relation suspending ethics ("by His call"). The consequence is stark: he exists *only* as murderer *or* knight of faith ("One plunge..."), with no ethical justification or middle ground ("No middle path").
  *   **Kierkegaardian Accuracy:** Directly addresses the *Problemata*: the teleological suspension of the ethical, the incommunicability of faith's movement, the absolute duty to God superseding universal ethics, and the terrifying either/or that defines Abraham (murderer/knight of faith).
  *   **Standalone Poem:** Uses concrete imagery (knife, wood, mountain, stones, sky, plunge, light/darkness) and emotional tension (father's love vs. dread, silence, razor's edge) to convey the core drama and existential horror without requiring prior knowledge of Kierkegaard. The sonnet form provides inherent structure and gravitas.
