  ok so i've been reading david lewis on humean supervenience and i want a poem about it. the idea is that the whole world is just a mosaic of particular, local, non-modal facts — one thing happening, then another, then another — and the laws of nature are nothing over and above that. they're just the best system of regularities, the most concise summary, the axioms of the ideal theory. there's no "oomph," no necessity, no glue holding the mosaic together. things just happen in patterns, and that's it.

  i want a sonnet where the octave is just the mosaic — a catalog of particular things happening, one damn thing after another, no explanations, just the raw succession of facts. then the volta at line 9 should shift to the idea that the laws we thought governed all this are just our summaries, our compression algorithms, and that the regularity is all there is. the closing couplet should leave the reader with the vertigo of that — the sense that the world is held together by nothing but pattern, and that pattern isnt the kind of thing that makes anything happen.

  i want it accurate enough that a metaphysician would nod along. the humean picture should be right: no necessary connections between distinct existences, the mosaic as the fundamental reality, laws as descriptive not prescriptive.

  after the poem, give me a short note (max 100 words) on the strongest anti-humean objection to this picture, and what consideration would most likely make the poem's stance untenable.
