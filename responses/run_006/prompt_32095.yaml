  The research sharing case is trickier:
  De-identified data sharing with academics generally aligns with user expectations in health tech. But "long-term trends" could be re-identifiable, and long COVID research is still emerging. Conditional "yes" with strict data minimization and re-contact consent.

  Final structure should mirror product thinking: start concrete (purpose/benefit), move to ethical risks, end with implementation safeguards. Must include clear "judgment call" flags where philosophical theories diverge.
answer: |-
  Here’s a practical, philosophy-grounded decision procedure for your team — designed for sprint meetings, not seminar rooms. I’ll call it the **Contextual Integrity Assessment (CIA)**, inspired by Helen Nissenbaum’s work (simplified for your needs). The core idea: **Privacy is about preserving appropriate information flows within specific relationships and contexts.** Violations occur when data practices breach contextual norms or undermine autonomy.

  ---

  ### The CIA Checklist: 7 Questions in Order  
  *(Ask these for any data practice: collection, retention, sharing, derivation)*  

  1. **WHAT IS THE CONCRETE USER/CUSTOMER BENEFIT?**  
     - *Ask:* "Does this solve a *specific*, *significant* problem for our users, in a way they’d recognize?"  
     - *Sufficient answer:* Evidence-backed benefit (e.g., "Detects sleep apnea with 90% accuracy in trials").  
     - *Hard stop if:* Vague ("might be useful someday") or purely commercial ("monetize data").  
     - *Judgment call:* How "significant" is the benefit? (e.g., life-threatening vs. minor convenience).  

  2. **COULD WE ACHIEVE THIS BENEFIT WITH LESS DATA/RISK?**  
     - *Ask:* "What’s the *minimal viable data* for this? Have we explored alternatives?"  
     - *Sufficient answer:* Comparison of options (e.g., "Audio vs. chest-motion sensors for apnea").  
     - *Hard stop if:* Less intrusive alternatives exist and are feasible.  
     - *Judgment call:* Is the added risk proportional to the incremental benefit?  

  3. **WHAT IS THE USER'S REASONABLE EXPECTATION HERE?**  
     - *Ask:* "In the *context* of using a sleep wearable, would users expect this data practice?"  
     - *Sufficient answer:* Alignment with core product promise (e.g., HRV tracking: expected; audio sampling: unexpected).  
     - *Hard stop if:* Clearly violates contextual norms (e.g., bedroom audio recording without explicit medical necessity).  
     - *Judgment call:* How "sacred" is the context? (Health data ≠ social media data).  

  4. **CAN WE DESIGN MEANINGFUL USER AUTONOMY?**  
     - *Ask:* "Can users *truly* understand and control this? Is consent granular and reversible?"  
     - *Sufficient answer:* Opt-in (not opt-out), plain-language explanation, easy revocation.  
     - *Hard stop if:* Cannot implement genuine choice (e.g., dark patterns, bundled consent).  
     - *Judgment call:* Does "consent" feel coerced by the benefit? (e.g., "I need apnea detection but hate audio recording").  

  5. **WHAT RELATIONSHIPS DOES THIS IMPACT?**  
     - *Ask:* "Could this data alter power dynamics (e.g., doctor-patient) or enable non-consented surveillance (e.g., employer, family)?"  
     - *Sufficient answer:* Safeguards against misuse (e.g., family access requires mutual consent).  
     - *Hard stop if:* Enables exploitation or unintended monitoring.  
     - *Judgment call:* Does this create "data leverage" against the user?  

  6. **WHAT ARE THE UNSEEN SOCIETAL RISKS?**  
     - *Ask:* "Could this normalize harmful practices? Create group harms? Fuel discrimination?"  
     - *Sufficient answer:* Mitigation plan (e.g., bias testing for algorithms).  
     - *Hard stop if:* High risk of irreversible harm (e.g., data usable for insurance discrimination).  
     - *Judgment call:* Are we contributing to a "surveillance society"?  

  7. **IS THIS REDEEMABLE BY TRANSPARENCY?**  
     - *Ask:* "If we explain *exactly* what we do and why, would users feel betrayed or respected?"  
     - *Sufficient answer:* Clear communication plan (e.g., in-app explainers, white papers).  
     - *No hard stop* — but if "betrayed" is likely, revisit Q1–Q6.  

  ---

  ### Applying the CIA to Your Proposals  
  **Proposal 1: Passive Audio Sampling for Sleep Apnea**  
  1. **Benefit:** High (early apnea detection saves lives).  
  2. **Minimal Data?** ❌ — Less intrusive alternatives exist (e.g., vibration/motion sensors).  
  3. **Expectation:** ❌ — Microphones in bedrooms breach "sanctuary" context.  
  4. **Autonomy:** 🟡 — Opt-in possible, but users may feel coerced by medical benefit.  
  5. **Relationships:** 🟡 — Could enable domestic spying if device compromised.  
  6. **Societal Risk:** 🟡 — Normalizes always-on audio in private spaces.  
  7. **Transparency:** ❌ — "We record your bedroom" inherently feels violating.  
  **VERDICT:** ❌ HARD STOP at Q2/Q3. Benefit doesn’t justify contextual breach.  

  **Proposal 2: Sharing De-identified HRV/Sleep Data for Long COVID Research**  
  1. **Benefit:** High (advances treatment of chronic illness).  
  2. **Minimal Data?** 🟡 — Can we share trends, not raw data? Pseudonymize?  
  3. **Expectation:** ✅ — Users expect health data used for research (with consent).  
  4. **Autonomy:** ✅ — Explicit opt-in for research sharing (not buried in T&Cs).  
  5. **Relationships:** ✅ — Academic partners bound by ethics reviews.  
  6. **Societal Risk:** 🟡 — Re-identification possible; could stigmatize long COVID patients.  
  7. **Transparency:** ✅ — Clear disclosure: "We share trends with [University] for long COVID research."  
  **VERDICT:** ✅ YES, with conditions: Aggregated data only, robust de-ID, re-contact option.  

  ---

  ### Philosophical Confidence & Uncertainties  
  - **Confidence (High):**  
    - Contextual norms matter (e.g., bedrooms ≠ gyms).  
    - Autonomy requires genuine choice, not illusions.  
    - Relationships define appropriate flows (e.g., doctor ≠ advertiser).  
  - **Least Confident Step: QUESTION 6 (Societal Risks)**  
    - *Why?* Philosophers disagree on whether privacy’s primary purpose is individual autonomy (my framework) or social justice (e.g., preventing discrimination).  
    - *Alternative View:* A "power-centric" approach (e.g., Julie Cohen) would prioritize Q6 higher, asking: "Does this amplify existing inequalities?" For example, the audio sampler might disproportionately harm abuse victims.  
    - *My Adjudication:* I keep Q6 later because societal risks often emerge from individual/contextual failures (Q2–Q5). But this is where philosophical camps split.  

  ### How to Use This in Sprints  
  1. **Assign a "Privacy Advocate"** to run the CIA (rotating role).  
  2. **Timebox to 15 mins** per proposal. If stuck at any step, table it.  
  3. **Document rationales** (e.g., "Q3: Passed — academic research expected").  
  4. **Escalate "judgment calls"** to a cross-functional ethics panel (PM, legal, eng, UX).  

  This won’t eliminate trade-offs — but it forces explicit consideration of *why* privacy matters beyond compliance: **It preserves dignity, context, and human flourishing in a datafied world.** Your wearable isn’t just a device; it’s a participant in intimate human experiences. Treat it accordingly.
