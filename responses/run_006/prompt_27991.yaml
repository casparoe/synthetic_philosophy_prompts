answer: |-
  Here's your audit—direct, ranked tensions with fixes and a verdict. I'll flag *real* inconsistencies (not just debatable spots) and prioritize based on systemic damage to your Gricean framework. 

  **Severity Ranking & Fixes:**  
  1. **TENSION: (2) Minimalist "What is Said" vs. (5) Irony/Metaphor as Implicature**  
     - **Conflict**: (2) claims "what is said" is *literally expressed* (reference-fixed + disambiguated). (5) says in irony/metaphor, the speaker "only goes through the motions" of saying the literal content. But if they utter "You're a fine friend" (ironically), (2) *forces* you to treat the literal proposition as **said**—even if it's not meant. Grice (1975) agrees: irony *says* the literal falsehood to implicate the opposite. Your (5) implies no literal content is *said*, violating (2).  
     - **Severity**: Critical. Undermines coherence of "saying" and conflates it with non-literal speaker meaning.  
     - **Cheapest Fix**: Revise (5) to align with Grice: irony/metaphor *involves saying the literal content* but implicating a contrary/figurative meaning. Keeps (2) intact.  

  2. **TENSION: (2) Minimalist "What is Said" vs. (6) Modified Occam's Razor**  
     - **Conflict**: (6) prefers pragmatic explanations over lexical ambiguities. But (2) bans pragmatic enrichment (e.g., domain restriction for quantifiers). Example: "Every student passed" may contextually imply *every student in Class 5B*, but (2) excludes this enrichment from "what is said." If pragmatic fixes can't touch "what is said," you might *need* lexical ambiguity (e.g., positing a hidden variable for quantifiers) to handle contextual effects—violating (6).  
     - **Severity**: High. Risks making (6) inert if minimalism forces ambiguity claims.  
     - **Cheapest Fix**: Allow *limited* context (e.g., assignment of *obvious* contextual variables) in (2). Or clarify that (6) applies *after* "what is said" is fixed.  

  3. **TENSION: (2) Minimalist "What is Said" vs. (4) Generalized Implicatures (GCIs)**  
     - **Conflict**: GCIs (e.g., "some" → "not all") feel automatic, but (4) insists they’re calculable/cancellable implicatures. (2) excludes default inferences from "what is said." Problem: If GCIs are *too* default, they might bleed into "what is said" (e.g., via semantic underdeterminacy). Your (2) resists this, but pressures you to treat GCI triggers (e.g., "some") as lexically ambiguous ("some and possibly all" vs. "some but not all")—clashing with (6).  
     - **Severity**: Moderate (manageable with care).  
     - **Cheapest Fix**: Stress in (4) that GCIs are *defeasible inferences*, not semantic defaults. Use cancellability tests rigorously ("Some students passed—in fact, all did") to defend the divide.  

  4. **TENSION: (3) Calculability/Cancellability vs. (4) Generalized Implicatures**  
     - **Conflict**: GCIs often feel non-calculable (automatic) and hard to cancel without oddness (e.g., "Some students passed—maybe all!" sounds marked). But (3) demands implicatures be derivable from CP/maxims + cancellable. Strict adherence might force you to deny *true* GCIs exist (turning them into "pragmatic conventions" or semantic content).  
     - **Severity**: Low (theoretical squeak, not breakage).  
     - **Cheapest Fix**: Note that GCIs *are* calculable (via maxim of Quantity) and cancellable (even if disfavored). Cite Levinson (2000) on "default inferences."  

  **Which Single Revision Cleans Up the Most?**  
  **Revise (5) on irony/metaphor** (as in Fix #1). It’s the cheapest and most critical fix. Irony *must* involve saying the literal proposition to implicate its opposite—your current (5) mislocates the mechanism. This preserves your core (1)-(4) and (6) without cascading changes.  

  **If Something *Has* to Go?**  
  **Drop strict (2)**. Minimalism is your biggest liability. Allowing *some* pragmatic enrichment (e.g., saturation of indexicals, not free enrichment) resolves tensions with (4), (5), and (6) while keeping Gricean intent.  
  - **Effect on Package**: (1) stays solid. (3)-(6) get *stronger*—GCIs, figurative language, and Occam’s razor work better if "what is said" can absorb basic context (e.g., "I'm ready" → "ready *for the exam*"). But you lose minimalist purity.  

  **Final Consistency Verdict**:  
  Your package is *nearly* consistent **iff** you fix (5) and allow (2) limited contextual resolution (beyond reference/ambiguity). (1) is your anchor—none of the tensions touch it. Commit to (3)/(4) as-is; they’re standard Grice. (6) is safe if you don’t let (2) force ambiguities.  

  **Action**: Tighten (5), clarify "context" in (2) to include variable assignment (e.g., for pronouns, tense), and you’re battle-ready. Grice would approve.
