  Looking at the cases: cases 1 and 2 show the core asymmetry. Cases 3 and 4 introduce complications with tone and non-verbal cues, touching on speaker intention versus audience interpretation. Cases 5 and 6 involve conventions and omissions, which relate to conversational implicature and conventional implicature as discussed by Grice.

  The established term for the position that lying is morally worse is the "moral difference thesis." The contrary view, which denies any moral difference, is often called "consequentialism about deception" or specifically "no-difference view" in the context of lying vs. misleading.

  The boundary problems they mention—where speaker intention, conventional meaning, and audience inference diverge—are central to debates in philosophy of language. Key concepts here include Grice's theory of implicature, speaker meaning versus sentence meaning, and the role of context. Cases like 3 and 4 highlight issues of insincerity and whether non-literal cues affect the definition of lying. Cases 5 and 6 deal with omissions and conventional meanings, which tie into how implicatures work and whether they can constitute deception equivalent to lying.

  I should ensure that the terms provided are precise. The moral asymmetry is well-documented in works by philosophers like Thomas Carson, Jennifer Saul, and Seana Shiffrin. The boundary challenges are discussed in the context of defining lying itself, with contributions from Don Fallis, Paul Faulkner, and others. 

  The user might also be interested in how these distinctions apply in real-world scenarios like law or ethics, where precise definitions matter. They might be looking for frameworks to analyze their cases further. I'll present the terms clearly and note that the boundary issues are active areas of debate without consensus.
answer: |-
  The established term for the moral asymmetry you describe is the **moral difference thesis**, and the broader set of puzzles concerning the boundary between lying and misleading falls under discussions of **pragmatics, implicature, and the definition of lying**, particularly focusing on the **intention-based vs. expectation-based accounts of assertion**.

  1.  **Moral Difference Thesis:** This is the position that lying (directly asserting a falsehood) is morally worse than merely misleading (causing a false belief via true statement + implicature or omission), even when consequences are identical. Proponents often argue lying violates a fundamental duty of truthfulness or fidelity more directly (e.g., Kantian deontologists like Christine Korsgaard, or Thomas Carson in *Lying and Deception: Theory and Practice*). The contrary view, denying a *fundamental* moral distinction, is often called the **no-difference view** (or sometimes consequentialist equivalence), arguing that the moral wrongness depends solely on consequences, intentions, and harm, not the literal truth/falsity of the utterance (e.g., Jennifer Saul in *Lying, Misleading, and What is Said* challenges the significance of the distinction, though not necessarily endorsing strict equivalence).

  2.  **Boundary Puzzles & Key Concepts:** The instability in Cases 3-6 arises from conflicts between:
      *   **Speaker Meaning vs. Sentence Meaning:** What the speaker intends to communicate vs. the literal semantic content of the words (Grice).
      *   **Conventional Implicature vs. Conversational Implicature:** Case 6 hinges on whether the misleading implication is part of conventional linguistic meaning ("serviced" implying "runs well" *by convention*) or a context-dependent inference. Conventional implicatures blur the line towards lying.
      *   **Intention to Deceive vs. Intention to Assert Falsely:** Traditional definitions of lying (e.g., Augustine, Aquinas) require an *intention to assert a falsehood*. Merely misleading involves an *intention to deceive* without that specific assertion. Cases 3 & 4 challenge this: Does sarcastic intent (Case 4) negate the assertion, even if words are false? Does the wink (Case 3) make the *overall act* insincere, even if words are true?
      *   **The Role of Audience Uptake & Convention:** Cases 3, 4, and 6 highlight how social conventions and audience interpretation can alter whether an utterance counts as an assertion of a falsehood. If a community *conventionally* understands "serviced" as "runs well" (Case 6), uttering "it was serviced" knowing it doesn't run well may functionally *be* asserting a falsehood *in that context*, pushing it towards lying. Similarly, the wink (Case 3) exploits shared understanding with the third party, potentially making the statement *to the colleague* a form of lying-by-pretense.
      *   **Omission vs. Commission:** Case 5 exemplifies the moral ambiguity of deceptive omissions relying on true statements to imply falsehoods, distinct from direct false assertion but often condemned similarly when the omission violates a duty to disclose.

  **How your description fits and differs:**
  *   Your core observation (Cases 1 & 2) perfectly aligns with the central debate around the Moral Difference Thesis.
  *   Your boundary cases (3-6) are excellent illustrations of the unresolved debates within the philosophy of language and the definition of lying. Philosophers like Don Fallis, Paul Faulkner, and Andreas Stokke actively debate these edge cases.
  *   **Philosophical Significance:** The instability isn't a flaw in your description but reflects genuine philosophical controversy. It challenges whether morality hinges on a stable linguistic category (lying) or on more fluid concepts like communicative intention, reasonable expectation, and context. The difficulty in drawing a sharp boundary *is* the problem and motivates both defenses and critiques of the Moral Difference Thesis. If the boundary is too porous, the moral significance of the lying/misleading distinction weakens. If it can be robustly defined (e.g., via strict intention-based accounts), the distinction holds more weight.
