  ### Adversarial Collaboration Document: Counterpart Theory vs. Transworld Identity  
  **Parties**:  
  - **Counterpart Theorist (CT)**: Committed to David Lewis's framework, where individuals are world-bound, and *de re* modality is analyzed via counterpart relations (based on similarity).  
  - **Transworld Identity Theorist (TWI)**: Committed to individuals existing across worlds, with cross-world identity primitive or grounded in individual essences.  

  **Preamble**:  
  Both parties affirm that this document clarifies the dispute without resolving it. They jointly agree to the structure, affirmations, and test cases below, and commit to avoiding straw-manning. Disagreements are framed neutrally, and cruxes are designed to isolate empirically or intuitively tractable issues.  

  ---

  ### I. Joint Affirmations  
  Both parties endorse the following substantive claims as foundational to the debate:  

  1. **Possible worlds are indispensable for analyzing modality**. Both accept that possible worlds semantics provides a formally rigorous framework for modeling modal claims (e.g., S5 axioms), and that worlds are maximal, consistent states of affairs. Worlds are not merely linguistic constructs but represent genuine modal reality.  

  2. ***De re* modality requires explaining truth conditions for claims about specific individuals**. Examples include "Alice could have been a musician" or "This table is necessarily made of wood." Any theory must account for how such statements are grounded in non-modal facts.  

  3. **Modal truths supervene on non-modal truths**. There can be no difference in *de re* modal properties (e.g., what is possible for Alice) without some non-modal difference (e.g., in actual-world properties, laws, or relations).  

  4. **The problem of accidental intrinsics must be resolved**. If an individual (e.g., a statue) is flexible in one world but rigid in another, a theory must explain how this variance comports with identity or similarity constraints without contradiction.  

  5. **Essential properties are theoretically necessary**. Essentialism (e.g., "Alice is necessarily human") is coherent and must be accommodated, though what grounds essence (e.g., origins, kind-membership) is disputed.  

  6. **Our pre-theoretic modal intuitions are data to be explained**. Cases like "Chrysler could have built a different car" or "Caesar could not have been a poached egg" constrain theories; neither side may dismiss intuitions as irrelevant.  

  7. **Identity is transitive, symmetric, and reflexive**. Both agree that if \(a = b\) in any world, this commits to standard identity logic (Leibniz’s Law) within that world.  

  ---

  ### II. Disagreements Table  
  *Each row pairs CT and TWI commitments on a shared sub-issue. Wording is acceptable to the respective proponents.*  

  | Sub-Issue                  | Counterpart Theorist (CT)                                                                 | Transworld Identity Theorist (TWI)                                                                 |  
  |----------------------------|-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|  
  | **1. Nature of Individuals** | Individuals are world-bound: each concrete individual exists in exactly one possible world. There is no literal identity across worlds. | Individuals are transworld entities: one and the same individual exists in multiple possible worlds, with identity preserved across worlds. |  
  | **2. Semantics of *De Re* Claims** | The truth of "Individual \(x\) could have been \(F\)" depends on \(x\) having a counterpart in some world that is \(F\). Counterparts are determined by contextually relevant similarity relations. | "Individual \(x\) could have been \(F\)" is true iff there is a world where \(x\) itself is \(F\). Identity, not similarity, is the truth-maker. |  
  | **3. Grounding of Modal Properties** | Modal properties of \(x\) (e.g., being possibly \(F\)) are extrinsic: they derive from properties of distinct, world-bound counterparts. | Modal properties of \(x\) are intrinsic to \(x\) itself: they derive from \(x\)'s own properties in other worlds. |  
  | **4. Basis of Essentialism** | Essential properties of \(x\) are those shared by all counterparts under the most stringent counterpart relation. Essence is context-relative. | Essential properties of \(x\) are determined by \(x\)'s individual essence—a non-relational, intrinsic feature (e.g., origin or haecceity) that grounds identity across worlds. |  
  | **5. Criteria for Cross-World Continuity** | Continuity across worlds is a matter of counterpart relations, which may be one-many, vague, or context-dependent (e.g., based on similarity in origins, qualities, or causal roles). | Continuity across worlds is strict identity, governed by a determinate individual essence that specifies necessary and sufficient conditions for transworld identity. |  
  | **6. Status of Identity Statements** | Identity claims like "\(x\) in \(w_1 = y\) in \(w_2\)" are false; cross-world "identity" is always a loose speech for counterpart relations. | "\(x\) in \(w_1 = y\) in \(w_2\)" is literally true when \(x\) and \(y\) are the same transworld individual; identity is primitive or essence-grounded. |  

  ---

  ### III. Cruxes  
  *Cruxes are formulated such that a resolution would force one side to revise their position. Each includes:*  
  - *(a) A test case both sides accept as probative.*  
  - *(b) CT’s prediction/judgment.*  
  - *(c) TWI’s prediction/judgment.*  
  - *(d) Diagnosis of why the crux remains unsettled.*  

  **Crux 1: The Grounding of Modal Variance in Accidental Intrinsics**  
  - (a) **Test Case**: A statue, Goliath, is actually flexible. In world \(w\), Goliath is rigid. Is Goliath in \(w\) the same entity as actual Goliath?  
  - (b) **CT**: Goliath in \(w\) is not identical to actual Goliath; it is a counterpart. Flexibility and rigidity are held by distinct world-bound individuals linked by similarity.  
  - (c) **TWI**: Goliath in \(w\) is identical to actual Goliath; properties like rigidity/flexibility are world-indexed properties of the same transworld individual.  
  - (d) **Diagnosis**: Unsettled due to divergent interpretations of Leibniz’s Law. CT denies cross-world property-bearers, avoiding a contradiction. TWI indexes properties to worlds, denying a violation. Both solutions are internally consistent, so the crux reduces to whether variance requires distinct property-bearers.  

  **Crux 2: Essentialism Under Counterfactual Origin Changes**  
  - (a) **Test Case**: Alice originated from egg \(e_1\) and sperm \(s_1\). In world \(w\), a person indistinguishable from Alice originates from \(e_2\) and \(s_2\). Is the person in \(w\) Alice?  
  - (b) **CT**: Depending on context, the person in \(w\) may be a counterpart of Alice (if similarity weights origins lightly) or not (if origins are weighted heavily). Essence is context-sensitive.  
  - (c) **TWI**: The person in \(w\) is not Alice; Alice’s essence includes her actual origins (\(e_1/s_1\)), so she cannot originate from \(e_2/s_2\) in any world.  
  - (d) **Diagnosis**: Unsettled because CT and TWI disagree on whether essential properties are fixed or flexible. CT appeals to contextual intuitions (e.g., "biological vs. psychological" Alice), while TWI appeals to rigid essentialism. Empirical evidence (e.g., cloning thought experiments) does not break the tie, as both reinterpret the data.  

  **Crux 3: Identity in Branching Scenarios**  
  - (a) **Test Case**: In world \(w_1\), Bob exists. World \(w_2\) is identical to \(w_1\) until time \(t\), then diverges slightly (e.g., Bob scratches his nose). Is Bob-in-\(w_2\) identical to Bob-in-\(w_1\)?  
  - (b) **CT**: Bob-in-\(w_2\) is a counterpart of Bob-in-\(w_1\) (similarity is high), but they are distinct individuals. Identity statements across worlds are false.  
  - (c) **TWI**: Bob-in-\(w_2\) is identical to Bob-in-\(w_1\); trivial differences (e.g., a scratch) do not break identity if Bob’s essence (e.g., his origin) is preserved.  
  - (d) **Diagnosis**: Unsettled due to divergent views on transworld identity vs. similarity. CT sees no issue in one-many relations; TWI demands all-or-nothing identity. The crux hinges on whether identity can tolerate "small differences," which is intuitive but not decisive.  

  ---

  ### IV. Drafter’s Assessment  
  *(As a neutral arbiter, I identify verbal and genuine disagreements based on the above.)*  

  **Merely Verbal Disagreements**:  
  - **The Semantics of "Identity" Talk**: When TWI says "Goliath is rigid in \(w\)," they mean the transworld individual has rigidity-at-\(w\). CT says "Goliath’s counterpart is rigid," meaning a distinct individual. Both track the same modal fact (Goliath’s rigidity is possible) but parse the ontology differently. This is terminological: CT’s "counterpart" and TWI’s "transworld individual with world-indexed properties" are notational variants for many cases.  
  - **Formal Expressibility**: Both theories can model S5 axioms and handle standard modal inferences (e.g., from necessity to actuality). Disagreements about "identity in the metalanguage" do not affect truth-conditions for everyday modal claims.  

  **Genuine Disagreements**:  
  - **The Metaphysics of Individuals**: CT’s world-bound individuals versus TWI’s transworld entities is irreducibly at stake. This is not verbal because it implies divergent ontologies: CT multiplies entities (each world has its own "Alice"), while TWI multiplies modes of presentation (one Alice with world-relative properties). Empirical implications arise in cases like quantum indeterminacy or fission, where the theories yield different predictions about persistence.  
  - **Context-Dependence vs. Absolutism**: CT’s contextual counterpart relations contrast with TWI’s fixed essences. This is genuine because it affects explanatory scope: CT better handles vague cases (e.g., "could Alice have been a robot?"), while TWI better explains rigid designators (e.g., "Hesperus is Phosphorus"). The crux is whether modality is objective (TWI) or interest-relative (CT).  
  - **What Grounds Supervenience**: For CT, modal supervenience is grounded in inter-world similarity; for TWI, in the transworld individual’s essence. This difference surfaces in Crux 2, where intuitions about origins diverge.  

  **Conclusion**:  
  The residual disagreement is smaller than the literature suggests: many conflicts reduce to terminology or modeling choices. However, it is sharper on the core issue—**whether individuals are world-bound or transworld**—which has downstream effects on essentialism, persistence, and context-dependence. A resolution may require engaging external domains (e.g., philosophy of language for reference, or physics for indeterminism) rather than rehashing classical thought experiments. Both parties could sign this document, as it isolates tractable cruxes and minimizes talking-past.
