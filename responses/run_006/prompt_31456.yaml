  We are drafting a structured document for an adversarial collaboration between a counterpart theorist (CT) and a transworld identity theorist (TWI). The goal is to clarify points of agreement, disagreements, cruxes, and to assess whether parts of the dispute are merely verbal.

  ## I. Joint Affirmations

  Both parties agree on the following substantive claims:

  1. **De re modal discourse is meaningful and requires explanation.** We agree that statements about what is possible or necessary for particular individuals (e.g., "Humphrey could have won the election") are intelligible and that a theory of modality must account for them.

  2. **Possible worlds are a legitimate and valuable tool for analyzing modality.** We agree that possible worlds semantics provides a formally adequate framework for modeling modal claims, and we accept the standard axioms of S5 modal logic as capturing the logical structure of modality.

  3. **The analysis must account for our modal intuitions and linguistic practices.** A successful theory must explain why we judge certain modal claims to be true and others false, and it must do justice to the way we use modal language in ordinary and philosophical contexts.

  4. **Individuals have modal properties that are not merely a matter of their actual properties.** For example, an individual might have the property of being possibly F even if they are not actually F, and this requires an explanation that goes beyond the actual world.

  5. **Modal facts supervene on non-modal facts.** There is no difference in modal truth without some non-modal difference. Both parties agree that the modal profile of an individual is determined by non-modal features (though they may disagree on what these features are and how they determine modal properties).

  6. **The theory must resolve modal paradoxes and puzzles.** This includes puzzles of coincidence (e.g., the ship of Theseus), identity through time and across worlds, and the problem of accidental intrinsics (e.g., how an object can have different intrinsic properties in different worlds).

  7. **The theory must be compatible with a plausible account of essence and accident.** We agree that some properties of an individual are essential (they hold in every world where the individual exists) and others are accidental.

  ## II. Disagreements Table

  The table below presents the core commitments of each theory. Each row addresses a specific sub-issue. The wording is acceptable to the respective proponents.

  | Sub-Issue | Counterpart Theorist (CT) | Transworld Identity Theorist (TWI) |
  |-----------|---------------------------|-----------------------------------|
  | **1. Ontology of Individuals** | Individuals are world-bound: each individual exists in exactly one possible world. | Individuals are transworld entities: the same individual can exist in more than one possible world. |
  | **2. Analysis of De Re Modality** | De re modal claims are analyzed in terms of counterparts: an individual in the actual world has a property possibly/necessarily F iff some/all of its counterparts in other worlds are F. | De re modal claims are analyzed by the same individual having the property in other worlds: an individual has a property possibly F iff there is a possible world where that very individual is F. |
  | **3. Primitive Notions** | Counterpart relations are primitive or contextually determined similarity relations. There is no primitive cross-world identity. | Cross-world identity is primitive (or grounded in individual essences). There are no counterpart relations as a substitute for identity. |
  | **4. Grounding of Modal Properties** | The modal properties of an individual are grounded in the existence and properties of counterparts in other worlds. | The modal properties of an individual are grounded in the properties that the individual has in other worlds. |
  | **5. Individuation and Essence** | What is essential to an individual is determined by the counterpart relation: essential properties are those shared by all counterparts. | What is essential to an individual is a matter of its individual essence, which is intrinsic and invariant across worlds. |
  | **6. Semantics of Modal Predication** | In the semantics, a modal predicate applied to an individual is evaluated by looking at the properties of its counterparts in other worlds. | In the semantics, a modal predicate applied to an individual is evaluated by looking at the properties of that very individual in other worlds. |
  | **7. Handling of Identity Across Worlds** | Identity across worlds is never literal; it is always a matter of counterpart relations that may be one-to-one or one-to-many. | Identity across worlds is literal and strict (one-to-one); an individual is identical to itself in every world where it exists. |
  | **8. Response to the Problem of Accidental Intrinsics** | The problem is solved by allowing an individual to have different intrinsic properties in different worlds via its counterparts, without violating Leibniz's Law, because counterparts are not identical to the individual. | The problem is solved by holding that an individual can have different intrinsic properties in different worlds because properties are world-relative. Leibniz's Law is not violated because properties are indexed to worlds. |

  ## III. Cruxes

  For each crux, we provide:

  (a) A test case both sides agree is relevant.
  (b) CT's judgment.
  (c) TWI's judgment.
  (d) Diagnosis of why the crux remains unsettled.

  ### Crux 1: The Grounding of Essential Properties

  (a) **Test Case**: Consider an individual, Alice, who is actually human. Is it essential to Alice that she is human? That is, must she be human in every world where she exists?

  (b) **CT's Judgment**: It depends on the counterpart relation. If the context selects a counterpart relation that requires being human, then yes. But in a different context, a counterpart relation might allow non-human counterparts (e.g., a robot duplicate), so Alice could have been non-human.

  (c) **TWI's Judgment**: If being human is part of Alice's individual essence, then she must be human in every world where she exists. If not, she might not be. The essence is fixed and not context-dependent.

  (d) **Diagnosis**: The crux remains unsettled because CT and TWI disagree on what grounds essential properties. CT ties essence to contextually variable counterpart relations, while TWI ties it to a fixed individual essence. The dispute involves a deeper disagreement about the nature of properties and whether context-dependence is acceptable in metaphysics.

  ### Crux 2: Identity in Cases of Fission

  (a) **Test Case**: Suppose in world W1, there is a person, Ben. In world W2, there is a fission event: Ben splits into two people, Ben-left and Ben-right, each of whom is psychologically and physically continuous with Ben in W1. Is Ben identical to Ben-left? To Ben-right? To both? To neither?

  (b) **CT's Judgment**: In W2, there is no individual that is identical to Ben because Ben is world-bound. Ben may have two counterparts in W2: Ben-left and Ben-right. Neither is identical to Ben, but both are counterparts by sharing enough similarities. Thus, Ben survives as both in a counterpart-theoretic sense, but not by identity.

  (c) **TWI's Judgment**: Ben cannot be identical to both Ben-left and Ben-right because that would violate the transitivity and symmetry of identity. Therefore, Ben is identical to neither. Ben does not exist in W2 because the fission event destroys him. Alternatively, if TWI allows partial identity or branching, then Ben might be identical to both, but this requires a non-standard account of identity.

  (d) **Diagnosis**: The crux remains unsettled because CT and TWI have different criteria for persistence. CT relies on counterpart relations that can be one-to-many, while TWI requires strict identity. The test case highlights a conflict between our intuitions about survival (which might be vague) and the logic of identity.

  ### Crux 3: The Necessity of Identity

  (a) **Test Case**: Consider the statement: "If Hesperus is Phosphorus, then necessarily Hesperus is Phosphorus." (Assume that Hesperus and Phosphorus are the same entity in the actual world.)

  (b) **CT's Judgment**: The necessity of identity does not hold in general. If in some world, the counterpart of Hesperus is not the same as the counterpart of Phosphorus, then in that world, they are not identical. Thus, it is possible that Hesperus is not Phosphorus.

  (c) **TWI's Judgment**: The necessity of identity holds: if Hesperus is Phosphorus in the actual world, then in every world where both exist, they are identical. There is no world where they are distinct.

  (d) **Diagnosis**: The crux remains unsettled because CT allows counterpart relations to diverge for the same individual in different contexts (e.g., when considering Hesperus and Phosphorus separately), while TWI holds that identity is absolute and necessary. The dispute reflects a deeper disagreement about the role of context in modal discourse and the nature of identity.

  ## IV. Drafter's Assessment

  ### Verbal Disagreements

  I judge that some aspects of the dispute are merely verbal:

  1. **The Formalism of Possible Worlds Semantics**: Both theories can use the same possible worlds framework. CT uses counterpart relations as the accessibility relation for individuals, while TWI uses identity. But the formal structures can be made isomorphic in many cases. For instance, if the counterpart relation is an equivalence relation (which it need not be in CT), then it behaves like identity. The difference in formalism does not necessarily track a difference in truth conditions for every modal claim.

  2. **The Problem of Accidental Intrinsics**: Both theories can solve this problem. CT does so by having non-identical counterparts with different properties, and TWI by having the same individual with world-indexed properties. The solution is achieved by different terminological routes, but both are formally adequate.

  ### Genuine Disagreements

  However, there are genuine, substantive disagreements:

  1. **The Nature of Individuals**: The core issue is whether individuals are world-bound or transworld. This is not merely terminological because it affects how we understand the persistence conditions of individuals and their modal properties. For CT, an individual's modal properties are extrinsic (depending on counterparts in other worlds), while for TWI, they are intrinsic (depending on the individual's own properties in other worlds). This difference has implications for the metaphysics of persons, artifacts, and natural kinds.

  2. **Context-Dependence vs. Absolutism**: CT allows context-dependence in modal claims (via the counterpart relation), while TWI typically does not. This is a genuine issue about the semantics and metaphysics of modality: is modality fixed by the world alone, or does it depend on how we describe the situation? This disagreement is irreducible and reflects different views on the objectivity of modal properties.

  3. **Essentialism**: For TWI, essential properties are fixed by the individual's nature and are not context-dependent. For CT, they are contextually determined. This is a substantive disagreement about whether there are mind-independent essences.

  ### Conclusion

  The residual disagreement is smaller than the literature suggests in that many apparent conflicts are due to terminological differences and can be resolved by careful formalization. However, the core issues about the nature of individuals and the context-dependence of modality remain sharp and genuine. The adversarial collaboration reveals that the debate is not just about Humphrey's counterparts or stipulations about essences, but about fundamental metaphysical commitments that are not easily reconciled.
