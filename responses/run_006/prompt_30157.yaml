answer: |-
  ## The Branch Manager

  The letter from Prognostica Solutions arrived on recycled smart-paper, its faint, algorithmic watermark shimmering under the harsh fluorescents of Maris’s office. It bore the same quiet, inescapable gravity as a court summons – because, in a way, it was. In the near-future city of Veridia, predictive agencies weren’t just forecasting the weather; they were architects of certified counterfactuals, their pronouncements binding branches of reality that had never flowered.

  Maris ran "Valence & Maris: Inheritance Arbitrage," a sleek two-person operation specializing in untangling contested wills using predictive audits. She knew the power – and the unease – baked into Prognostica’s systems. Today’s letter was personal. Her thumb brushed the activation glyph.

  > **Subject: Certified Counterfactual Outcome Notification (Ref: CM-7742-T)**
  >
  > *   A quantum-entangled coin (Ref: QEC-8891) was flipped on 10/23/37.
  > *   Outcome: TAILS (Certified Accuracy: 99.99998%).
  > *   **Consequent Obligation:** You are hereby invoiced for the sum of $1,500.00 USD.
  >
  > *Rationale: Had the outcome been HEADS (a non-actualized branch), Prognostica Solutions would have initiated a transfer of $1,000,000.00 USD to your account. This payment obligation in the HEADS branch was predicated solely on Prognostica's prediction (Certified Accuracy: 99.99998%) that, in this actualized TAILS branch, you would pay the stipulated fee of $1,500.00 USD. Fulfillment maintains systemic integrity and your predictive reliability rating. Non-payment incurs penalties and rating downgrade.*

  The air conditioning hummed. $1,500. Not ruinous. But paying felt like pouring water into sand. She was buying… what? The *idea* of a million dollars she’d never touch? The continued good behavior of a ghost-Maris in a dead universe? Yet, her business, Valence & Maris, *relied* on Prognostica’s ratings. Inheritance disputes hinged on predictive audits of deceased intent. A downgrade meant lost clients. She was paying for the *credibility* of the counterfactual machinery that fed her. Evidence – the certified tails, the binding contract – demanded it. But the *cause*? Paying now couldn’t make the heads branch real. It was a ritual to appease a god of probability.

  Later that week, Leo Valence, her partner and the other half of their firm’s namesake, slammed his own Prognostica letter onto her desk. His face was pale. "Read this. Just… read it."

  Maris scanned it. It was different.

  > **Subject: Conditional Notification (Ref: XB-3381)**
  >
  > *   This notification has been dispatched **if and only if** exactly one of the following statements is true:
  >     1.  Your primary residence (12 Oak Bower Lane) is currently infested by active *Coptotermes formosanus* (Formosan subterranean termites).
  >     2.  You authorize a payment of $1,000.00 USD to Prognostica Solutions within 72 hours of receipt.
  >
  > *Note: This is not an accusation, nor a demand. It is a logical notification based on proprietary predictive modeling. No further information regarding the truth state of condition (1) will be provided regardless of your action. Prognostica Solutions adheres strictly to predictive ethics guidelines.*

  "Blackmail," Leo hissed. "They’re holding my house hostage unless I pay them a grand to make the question go away!"

  "It’s not, technically," Maris said, her voice tight. She understood Leo’s rage. "It’s the XOR blackmail structure. The letter only exists because one and *only* one thing is true: either you have termites, or you’ll pay. Paying makes condition (2) true, satisfying the XOR, meaning the letter *was* correctly sent. But it also retroactively *means* you didn’t have termites – because if you did, *and* paid, that would be *two* truths, violating the XOR condition. It shouldn’t have been sent."

  Leo stared. "So… if I pay, it proves I *don’t* have termites? But how? Paying doesn’t magically un-eat my floor joists!"

  "No," Maris admitted. "Paying doesn't *cause* the absence of termites. It just makes the *evidence* – this letter – consistent with you *not* having them. Conversely, if you *don't* pay, the letter's existence *proves* you *do* have termites. Because the only other condition for it being sent – you paying – didn't happen."

  "So, if I don't pay, I definitely have termites? And if I *do* pay, I definitely *don't*?"

  "According to the logic of the notification, yes. But the *actual termites* are a physical fact, independent of the letter. Paying doesn't affect them. It only affects what the letter *signifies* about them. Prognostica isn't *causing* the termites; they're just sending a message based on a prediction about your house *or* your payment decision. The unease is that the *act* of paying *changes the meaning* of the threat."

  "It's psychological judo," Leo spat. "They're not demanding money *or else*. They're saying the *existence* of this letter *is* the 'or else'. Paying makes the 'or else' vanish, but only semantically! The potential damage is real, regardless!"

  Maris saw the chasm opening between them. Her counterfactual mugging was about obligation to a ghost branch, paid for systemic integrity. Leo’s XOR blackmail was about the terrifying power of *evidence* itself – evidence whose meaning was dictated by his own response. Paying wouldn't kill termites; it would just redefine the past prediction. Not paying wouldn't summon termites; it would merely confirm their predicted existence.

  Maris paid her $1,500. A debit notification flickered on her screen. A small, sour taste filled her mouth – the taste of subsidizing a reality that never was, to preserve the one that fed her. It felt less like a rational choice and more like appeasing a capricious, all-seeing machine. The *evidence* demanded payment; the *cause* felt utterly disconnected.

  Leo refused to pay. "I won't be manipulated by their semantic trap," he declared, jaw set. "If I have termites, I'll deal with it. I won't pay a thousand bucks just to make their stupid prediction look consistent."

  Forty-eight hours later, a structural inspector, called by a deeply anxious Leo, found extensive Formosan termite damage in the subfloor of 12 Oak Bower Lane. The repair estimate was north of $15,000.

  Leo stormed into the office, the inspector's report trembling in his hand. He thrust it at Maris. "See? They *knew*. They sent the letter *because* I had termites. They just wrapped it in their fucking logic puzzle to make it seem like *I* was choosing the meaning! But the damage was real. The cause was termites, not my decision! They *used* the prediction to extort me, knowing the evidence would prove them right *unless* I paid to make the evidence lie!"

  He looked at Maris, betrayal hardening his eyes. "And you paid yours. You fed the machine. You paid for a branch that died. How is that not just… tribute? How is what they did to me *not* blackmail, dressed up in decision theory?"

  Maris had no easy answer. She saw the raw wood, the crumbling evidence of silent destruction. Leo’s refusal had revealed a concrete, costly truth. Her payment had preserved an abstract rating, a ghost’s promise. Both actions were responses to certified predictions, but Leo’s refusal felt like defiance against manipulation, while her payment felt like complicity. The difference wasn't in the logic, but in the *substance* of what was at stake: hidden rot versus a phantom windfall.

  "The system works," Maris said quietly, gesturing at the report. "Their prediction was accurate."

  "The prediction was accurate *because I didn't pay*!" Leo yelled. "It was a self-fulfilling prophecy built on my fear! If I'd paid, the prediction would have been 'accurate' that I *didn't* have termites, even if I did! That's not prediction, Maris. That's… rigged evidence. That's coercion dressed as math. I can't work with this."

  Leo Valence resigned the next day, dissolving Valence & Maris. Maris sat alone in the quiet office. The notification of her updated, pristine Prognostica Reliability Rating glowed on her screen: **AAA+**. It felt like an epitaph. She had paid the mugger in the branch that lost, upholding a contract with a ghost to maintain her standing in the world of the living. Leo had called the blackmailer's bluff, revealing the rot beneath the floorboards, and paid a different, heavier price. The predictive agencies delivered truth, but only truths shaped by the very decisions they solicited, binding the present to obligations owed to non-existent pasts and meanings rewritten by the act of payment itself. The branches never happened, but their weight was crushing. She ran her fingers over the smooth, cool surface of her desk, paid for by arbitrating the disputes of the dead, and wondered what rot, what counterfactual debts, were silently accruing beneath her own foundations, waiting for a letter to give them meaning.

  ---

  **Author's Note:** This story leans on a functionalist interpretation of Newcomb-like problems and counterfactual dependence, treating the predictive agency's accuracy and the enforceability of counterfactual contracts as axiomatic within its world. It implicitly sides with evidential/causal decision theory hybrids that recommend paying in Counterfactual Mugging to maintain one's reputation as a "rational agent" within a system that rewards such consistency. The key liberty is treating the *mere existence* of the XOR blackmail letter as undeniable proof *after the fact* of the exclusive-or condition holding, ignoring potential noise or error margins in the prediction/notification mechanism. The most tempting objection is the *causal decision theorist* (CDT) perspective: a CDT purist would argue Maris is simply being swindled; since the coin flip is past and unchangeable, paying $1,500 provides her *no causal benefit* – the heads branch is gone, and her payment doesn't causally influence future predictions, only correlates with them. They would see Prognostica exploiting irrational guilt over a lost opportunity. For Leo, a CDT might argue that since paying doesn't *cause* the absence of termites, the only rational reason to pay would be if he believed Prognostica might somehow *prevent* termites (which they don't); otherwise, not paying and facing the potential damage is the causally sound choice, making the letter irrelevant noise, not blackmail. The story’s world assumes the *evidential* link (high rating = future opportunity) is strong enough to override pure CDT, which many theorists dispute.
