  Their evolutionary angle is clever but risky - it makes consciousness a "nomological dangler" that just happens to correlate perfectly with adaptive states. Might need to weaken either the necessity claim in (3) or the reliability claim in (2). 

  Most salvageable path? Defend introspective reliability as deriving from physical state detection rather than qualia detection. But that requires conceding we're not directly aware of qualia - which they may resist given their hard problem stance. 

