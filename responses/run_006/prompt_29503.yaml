  Ah, the distinction they're groping for lies in testability and revision mechanisms. Scientific testimony isn't a binary "believe/don't believe" but an invitation to investigate. When Becquerel reported fogged plates, other scientists could replicate the conditions. Uniform experience isn't static in science—it's always provisional. Whereas miracles (transubstantiation, resurrections) are typically singular, unrepeatable events claiming to override physics permanently. 

  The user's suspicion about premise (3) is sharp too. Hume treats "laws of nature" as monolithic, but scientifically they're just our best current models. The moment an anomaly appears, scientists don't just weigh testimony—they design new experiments. That's the escape hatch Hume misses. 

  Also worth noting: the user's example cleverly avoids religious baggage by using a secular "miracle" (radioactivity). Makes the problem crisper. Their underlying worry seems to be that Hume's skepticism could become anti-empirical if overgeneralized—which is exactly what Karl Popper later criticized about verificationism. 

  The resolution isn't rejecting Hume entirely but qualifying his scope. His argument holds for unrepeatable, untestable claims, not methodologically investigated anomalies. The user might appreciate connecting this to Bayesian updating too—science allows adjusting priors with new evidence, while miracle reports demand belief in fixed priors. 

