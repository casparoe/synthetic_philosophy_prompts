answer: |-
  Here’s a practical 15-minute decision procedure for your mitigating circumstances panel, grounded in luck egalitarian principles but operationalized for real-world use. It surfaces value judgments while providing defensible structure. The core question at each step: **"Was this genuinely beyond the student’s reasonable control?"**

  ### The Decision Procedure: "Control & Response" Flowchart
  *(Run steps sequentially; stop at first "No" unless indicated)*

  1.  **Immediate Physical Safety?**  
      *   **Question:** Was the student physically incapacitated or in immediate danger (e.g., hospitalization, acute injury, natural disaster)?
      *   **Sufficient Answer:** Verifiable evidence (medical note, police report, official notice). Corroboration trumps student statement alone.
      *   **Outcome (Yes):** Grant request (Brute Luck - Uncontrollable). *Stop.*
      *   **Outcome (No/Unclear):** Proceed to Step 2.
      *   *Luck Egalitarian Dressing:* Explicitly identifies core brute luck.

  2.  **Sudden, Severe External Shock?**  
      *   **Question:** Did an unexpected, major external event directly prevent submission/preparation (e.g., sudden bereavement of immediate family, victim of crime, critical utility failure *at submission time*)?
      *   **Sufficient Answer:** Verifiable evidence + clear temporal link to deadline. Must be genuinely unforeseeable/unpreventable *by the student*.
      *   **Outcome (Yes):** Grant request (Brute Luck - External Shock). *Stop.*
      *   **Outcome (No/Unclear):** Proceed to Step 3.
      *   *Luck Egalitarian Dressing:* Focuses on externality and unforeseeability (brute luck).

  3.  **Significant Health Event (Physical/Mental)?**  
      *   **Question:** Did a documented health condition (physical or mental) significantly impair the student’s ability to meet the deadline *during the critical period*?
      *   **Sufficient Answer:** Medical evidence (e.g., doctor/mental health professional note) confirming diagnosis AND linking symptom severity/impact directly to the deadline period. Retrospective diagnosis needs strong justification.
      *   **Outcome (Clear Yes):** Grant request (Brute Luck - Health). *Stop.*
      *   **Outcome (Mixed/Pre-existing/Unclear):** Proceed to Step 4 (The "Reasonableness Gate").
      *   *Luck Egalitarian Dressing:* Judges if impairment was brute luck or influenced by choices (e.g., treatment adherence).

  4.  **The Reasonableness Gate (Where Values Enter):**  
      *   **Questions (Ask Sequentially):**
          *   a. **Foreseeability:** Was a significant flare-up/impairment reasonably foreseeable based on the student's known history? (If no chronic history, likely brute luck - Grant).
          *   b. **Mitigation:** *If foreseeable,* did the student take reasonable steps *in advance* to manage the risk and mitigate the impact? (e.g., registered with disability services, followed treatment plan, used university support, started work early, *communicated proactively* with tutors *before* crisis).
          *   c. **Response:** *If impairment occurred,* did the student take reasonable steps *as soon as possible* to address it and seek an extension *before* the deadline? (e.g., contacting tutor/dept immediately upon realizing the problem).
      *   **Sufficient Answer:** Requires judgment. Focus on *objective reasonableness*, not perfection. Evidence helps (e.g., disability registration, email timestamps, support service records).
      *   **Outcome (a=No OR b=Yes & c=Yes):** Grant request (Brute Luck outweighs Option Luck elements). *Stop.*
      *   **Outcome (a=Yes AND (b=No OR c=No)):** Proceed to Step 5 (Likely Denial).
      *   *Luck Egalitarian Dressing:* This IS the core option luck judgment (choices around managing risk/response), framed as "reasonable steps". Values are unavoidable here.

  5.  **Resource/Commitment Mismanagement?**  
      *   **Question:** Is the primary cause poor planning, over-commitment (e.g., excessive paid work, social events), technical negligence (e.g., no backup), or workload prioritization *without* a significant external/health trigger identified in Steps 1-4?
      *   **Sufficient Answer:** Student's own account often reveals this. Lack of evidence for Steps 1-4 is telling.
      *   **Outcome (Yes):** Deny request (Option Luck - Consequences of choices). *Stop.*
      *   **Outcome (Plausible External Factor):** Rare. Revisit Step 4 or escalate to Senior Tutor if genuinely novel/marginal.
      *   *Luck Egalitarian Dressing:* Explicitly frames denial as consequence of choice (option luck).

  **Escalation:** Any case causing significant discomfort or where Step 4 judgment is finely balanced should be flagged for brief discussion/input from the Senior Tutor *before* final decision.

  ---

  ### Worked Cases (Applying the Procedure)

  **Case 1: The Night Out & Chronic Condition Flare-Up**
  *   **Scenario:** Student with documented anxiety/depression goes on a weekend music festival trip (Thu-Sun). Returns exhausted, has a severe anxiety attack Mon/Tue, misses deadline Wed. Medical note confirms flare-up during Mon-Wed.
  *   **Procedure:**
      1.  Immediate Safety? No (not hospitalized). *Next.*
      2.  External Shock? No. *Next.*
      3.  Health Event? **Yes** (medical note). BUT... mixed/pre-existing. *Go to Step 4.*
      4.  Reasonableness Gate:
          *   a. **Foreseeability?** **Yes.** Student knows condition is exacerbated by exhaustion/lack of routine/stress. Festival is high-risk.
          *   b. **Mitigation?** **Likely No.** Did they plan recovery time? Start work early knowing the risk? Use coping strategies proactively? Evidence usually lacking. *Likely insufficient mitigation.*
          *   c. **Response?** Maybe. Did they email *as soon as* they felt unwell Mon? Or only after missing deadline? Check timestamps. (Often too late).
      *   **Outcome:** **Likely DENY.** (a=Yes, b=No). Flare-up link to choices makes it option luck. *Harsh but consistent.* Senior Tutor might soften if response (c) was excellent, but mitigation (b) is key.
  *   **Why it Bites:** Punishes "risky" leisure despite genuine illness. Values judgment: Is it reasonable to expect students with chronic conditions *never* to take social risks? The procedure says "manage the risk or face consequence".

  **Case 2: Bereavement of Distant Relative + Existing Workload Issues**
  *   **Scenario:** Student misses deadline. Cites bereavement (death of a grandparent overseas 10 days prior) and stress from working 30 hrs/week. Grandparent's death verifiable.
  *   **Procedure:**
      1.  Immediate Safety? No. *Next.*
      2.  **Sudden, Severe External Shock?** **Yes.** Bereavement of immediate family member (usually defined as parent/sibling/child; check policy! Grandparent *may* qualify, often does). Verifiable. Clear temporal link (though 10 days prior requires judgment on impact duration).
      *   **Outcome:** **GRANT.** (Brute Luck - External Shock). *Stop.* Workload issues irrelevant at this step.
  *   **Why it's Defensible:** Focuses on the major uncontrollable event. Doesn't penalize grief timeframe or prior choices (workload). Avoids intrusive "how sad were you really?".

  **Case 3: Broken Laptop, No Backup, Deadline Missed**
  *   **Scenario:** Student claims laptop died 3 hours before deadline. No backup. Couldn't access library PCs in time. No history of issues.
  *   **Procedure:**
      1.  Immediate Safety? No. *Next.*
      2.  External Shock? **Arguable** (tech failure). But is it *critical utility failure*? Usually not. *Next.*
      3.  Health Event? No. *Next.*
      4.  Reasonableness Gate:
          *   a. **Foreseeability?** **Yes.** Hardware fails. Everyone knows backups are essential (uni emphasizes this).
          *   b. **Mitigation?** **No.** No backup = failure to take basic, reasonable preventative step.
          *   c. **Response?** Could they have gone to library *immediately*? Did they contact IT/tutor *before* deadline? (Often not).
      *   **Outcome:** **DENY.** (a=Yes, b=No). Consequence of poor planning (option luck). *Uncomfortable but fair.*
  *   **Vulnerability:** What if the failure was truly bizarre (verified catastrophic failure during auto-save)? Then Step 2 *might* apply as an unforeseeable shock. But "no backup" usually sinks it.

  ---

  ### Where the Procedure is Most Vulnerable & How to Defend It

  1.  **Step 4 ("Reasonableness Gate") - Values Judgment Disguised:**
      *   **Attack:** "Your 'reasonable steps' are subjective! It punishes vulnerable students who struggle to navigate support or plan perfectly."
      *   **Defense:** Acknowledge the value judgment. Frame it as:
          *   **Shared Responsibility:** The university provides support (disability services, wellbeing, academic skills); students have a *reasonable* duty to engage with it proactively when aware of risks. It's not perfection, it's demonstrable effort.
          *   **Preventing Exploitation:** Without this step, *any* pre-existing condition becomes an automatic pass, regardless of choices, undermining academic standards and fairness to students who manage their conditions diligently.
          *   **Focus on Process, Not Outcome:** We judge the *reasonableness of actions* (Did they try to register? Did they email *before* the deadline?), not the severity of the condition or the quality of their work. Evidence (emails, registrations) makes this less subjective.

  2.  **Edge Cases of "Foreseeability" (Step 4a):**
      *   **Attack:** "How can a student with a *new* mental health dip predict it? Your procedure assumes knowledge they didn't have!" OR "You punished the festival-goer for a *possible* flare-up, not a certainty!"
      *   **Defense:**
          *   **Known Conditions:** For *documented, pre-existing* conditions, foreseeability applies to *risk of flare-up*, not certainty. Choosing high-risk activities without mitigation is a choice.
          *   **New Conditions:** A genuinely *new* condition appearing acutely just before a deadline with no prior history is treated as brute luck (Step 3 - Grant). Foreseeability (Step 4a) only kicks in for known/chronic issues. Evidence of diagnosis/timing is key.

  3.  **Perceived Harshness (e.g., Laptop, Festival Cases):**
      *   **Attack:** "This is cruel! The student suffered bad luck (laptop died, got ill) and you're denying help!"
      *   **Defense:**
          *   **Option Luck Core:** Distinguish the *trigger* (bad luck) from the *vulnerability* (lack of backup, ignoring known health risks). The procedure compensates for pure bad luck (brute luck) but not for being unprepared for foreseeable risks (option luck).
          *   **Systemic Fairness:** Granting these routinely devalues extensions for students who *did* experience genuine brute luck (hospitalization, bereavement) and encourages poor planning. It protects the integrity of the mitigation system.
          *   **Learning Opportunity:** Consequences teach responsibility – backing up work, managing workload, understanding personal health risks – crucial skills for university and beyond.

  **Key to Defense:** Consistently frame the procedure as focusing on **controllable factors and reasonable duties of students**, not making judgments about the inherent "deservingness" of the person or the severity of the outcome itself. It's about whether the *cause* of the missed deadline was *overwhelmingly* outside their control *despite* reasonable precautions/actions. This makes it administratively viable and philosophically grounded, even when the outcomes are tough.
