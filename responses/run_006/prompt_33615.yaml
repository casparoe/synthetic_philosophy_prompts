  Now, translating these into software terms. For intentionalism, the developer's design documents and commit messages are key. The code's purpose is tied to their intent. New Criticism maps to the codebase itself—source code and runtime behavior define meaning. Barthes' view would involve the code's interaction with the system, libraries, and environment, detached from the author. Reader-response is about how different users (developers, end-users) interpret the code based on their context.

  Next, the residue report. Clean translations: New Criticism's focus on the text aligns perfectly with runtime behavior and tests. Intentionalism's specs and documentation have counterparts. Barthes' intertextuality relates to dependencies and APIs. Reader-response fits with different users' perspectives.

