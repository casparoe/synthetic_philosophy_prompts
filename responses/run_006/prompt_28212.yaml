  The malfunction problem seems the sharpest objection. If a trait's function is what it was selected for, how can a heart that fails to pump still have that function? Here's where philosophy improves on intuition: etiologists distinguish between proper function (historical selection) and current capacity. Like Wright's broken carburetor analogy - its function remains fuel regulation even when broken. This preserves biology's distinction between function and failure.

