answer: |-
  You've absolutely identified a distinct and fascinating phenomenon—one that's more specific than the sunk cost fallacy and critically dependent on the *competitive interaction* between two parties. You're right to sense that the core mechanism is different, and your examples perfectly illustrate the trap. Here's the breakdown:

  ### The Established Name: The Dollar Auction (Paradigm/Game)
  The cleanest match for your charity auction example is the **Dollar Auction**, devised by economist Martin Shubik in 1971. It's a formal game-theoretic model designed explicitly to demonstrate the paradox you describe.

  **Why "Dollar Auction" is the Core Concept:**
  1.  **Two Key Players:** It explicitly models the interaction between *two* rational actors bidding against each other.
  2.  **Sunk Costs as the Engine:** The escalating bids become sunk costs *immediately* after they're placed. The loser pays their last bid and gets nothing.
  3.  **The Perpetual Second-Place Trap:** This is the critical mechanism you identified. At any point past the first bid, the *second-highest bidder* faces the worst immediate outcome: paying their bid and getting nothing. Their "rational" choice is to bid *just enough more* to become the (temporary) high bidder, turning a certain loss into a *potential* smaller loss (if they win) or at least delaying the large loss. This action then thrusts the *other* bidder into the dreaded second-place position, forcing *them* to bid again using the same logic.
  4.  **Inevitable Escalation Beyond Value:** This back-and-forth, driven purely by the desire to avoid the immediate catastrophic loss of being second, predictably pushes the sum of the winning bid and the losing bid far beyond the value of the prize ($1 in the original, $20 in your example).
  5.  **Mutual Loss is Likely:** As in your example, even the "winner" usually loses net value ($35 bid for a $20 bill = net loss of $15), and the loser is devastated ($34 loss in your scenario). The auctioneer (or the conflict itself) extracts maximum value.

  ### How it Differs from the Standard Sunk Cost Fallacy (And Why it's Its Own Thing)

  1.  **Strategic Interdependence:** This is the crucial difference. In the standard sunk cost fallacy (watching a bad movie, finishing a meal), the decision is *isolated*. My choice to continue doesn't directly force *you* into a worse position. In the Dollar Auction dynamic, **my "rational" action to mitigate *my* sunk cost (by bidding higher) directly creates a *worse* sunk cost problem *for you***. My gain (avoiding being second) is your immediate loss (being forced into second place). This creates a vicious feedback loop absent in individual sunk cost scenarios.
  2.  **The "Second-Place Trap" Mechanism:** The standard sunk cost fallacy involves continuing a *single, ongoing project* due to past investment. The Dollar Auction dynamic hinges on a very specific, recurring moment of decision: **"Am I currently in second place facing a total loss? If yes, I *must* invest more to escape that specific, intolerable outcome."** It's this positional trigger that drives the escalation.
  3.  **Competitive Rivalry:** The presence of a direct, active competitor is essential. The conflict is zero-sum (only one can "win" the prize, though both often lose net). The escalation is fueled by the desire not just to gain the prize, but to *defeat the other party* and avoid the humiliation/concrete loss of being the loser *this round*.
  4.  **Predictability in Game Theory:** While the standard sunk cost fallacy is seen as an individual cognitive *bias* leading to irrationality, the Dollar Auction demonstrates how **perfectly rational actors, acting solely to minimize their *immediate* potential losses at each step, can be trapped into collectively disastrous outcomes.** Game theory predicts this escalation logically, even without assuming psychological bias (though bias often exacerbates it). It's a structural trap.

  ### Broader Context: Escalation of Commitment in Rivalry

  The Dollar Auction is the purest, most distilled model. Your company budget battle and lawsuit examples represent real-world manifestations of this dynamic in less formalized conflicts. This broader phenomenon is often called **Escalation of Commitment in Competitive Contexts** or **Rivalrous Sunk Cost Traps**.

  *   **Core Mechanism (Same as Dollar Auction):** Each incremental investment by one side (time, political capital, legal fees) becomes a sunk cost. The *other* side, seeing this investment, faces a choice:
      *   **Concede:** Admit all their *own* past investments were wasted and accept defeat.
      *   **Match/Escalate:** Invest more resources to stay in the fight, hoping to eventually win and justify *all* past investments (theirs and the new ones). Choosing this option creates a new, larger sunk cost problem for the *first* side, forcing them to reinvest or concede.
  *   **Why it Spirals:** Like the auction, the party facing imminent "loss" (conceding the budget, losing the lawsuit) feels the acute pain of their sunk costs going to waste. Investing more to avoid *that specific, immediate loss* feels like the lesser evil. This action resets the trap for the opponent.
  *   **Outcome:** Total costs (time, money, relationships, reputation) vastly exceed the original value of the contested resource. Both sides are often worse off than if they had compromised early or never engaged. There is often no true "winner," only a "lesser loser."

  ### Boundary Cases and Core Mechanism

  *   **Core Mechanism:** **Mutually Reinforcing Sunk Cost Traps via Strategic Positioning.** Party A's action to avoid *their* imminent sunk cost loss creates an imminent sunk cost loss threat for Party B, who then acts to avoid *that*, recreating the threat for Party A, and so on. The "second-place" position is constantly shifting but always present and painful.
  *   **Boundary Case 1 (No Sunk Costs):** If investments weren't sunk (e.g., in a fight over a divisible resource where you could walk away *and* recoup your costs), the trap wouldn't exist. The irrecoverability is key.
  *   **Boundary Case 2 (No Direct Rivalry/Positional Trap):** If the "contest" isn't zero-sum or doesn't have a clear "second-place-loses-everything" moment (e.g., two companies independently developing a product, each with their own sunk costs but not directly bidding against each other for a *single* prize), it reverts to parallel individual sunk cost fallacies, not the interactive trap.
  *   **Boundary Case 3 (Ability to Commit/Coordination):** If the parties could credibly commit *in advance* to split the prize or set a binding cap on investment (e.g., the departments agree on a fair split day one; the litigants agree to mediation with a spending limit), they can avoid the trap. The inability to coordinate or commit is a key enabler.
  *   **Boundary Case 4 (Multiple Players):** While often dyadic, the logic can extend to more players, though the dynamics become more complex. The fundamental "avoid being the loser who pays and gets nothing" incentive remains.

  ### Is it Just a Special Case?

  It's best understood as a **specific and highly potent subtype of escalation of commitment**, distinguished by:

  1.  **Dyadic Rivalry:** Requires two (or few) direct competitors.
  2.  **Zero-Sum Contest:** Only one can "win" the primary prize.
  3.  **Sequential, Reciprocal Investment:** Actions are taken in turn, each response triggered by the other's prior action.
  4.  **The Second-Place Trigger:** The immediate driver of each escalation step is the intolerable prospect of being the *current* loser facing total sunk cost loss.

  While rooted in the concept of sunk costs, the **strategic interaction, the feedback loop, and the positional trigger** make the Dollar Auction dynamic a distinct and powerful phenomenon. It's why military conflicts, bidding wars, and bitter legal/corporate disputes so often spiral far beyond rational limits – the structure of the contest itself creates the trap. You've identified a profound and costly real-world problem with a solid theoretical foundation. Understanding it as the "Dollar Auction Paradigm" or "Mutual Sunk Cost Escalation Trap" gives you the precise lens to analyze and potentially avoid these destructive spirals in the future. Recognizing the "second-place trap" moment is crucial for breaking the cycle.
