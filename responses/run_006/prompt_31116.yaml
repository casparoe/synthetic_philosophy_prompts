prompt: |-
  In my just war theory seminar people keep invoking the moral equality of combatants as if it settles things, but it gets used to shut down different arguments. Most recently someone used it to dismiss the claim that a soldier fighting for an unjust cause is doing something wrong just by fighting. I can see there's a legal convention (jus in bello treats both sides symmetrically), but people seem to mean something moral by it, and I can't tell what. Can you lay out the distinct precise claims that slogan could be making — legal equality versus moral equality, equal liability to attack versus equal permissibility versus equal blameworthiness, an epistemic claim about what soldiers can know, an excuse-based claim — and for each say whether it's plausible and whether it actually get's you the conclusion that the unjust-side soldier isn't doing wrong? I want a menu of readings, not just one, because the guy in my seminar is definitely running one particular reading and I suspect it's the weakest.
reasoning: |-
  Okay, the user is in a just war theory seminar and keeps hearing "moral equality of combatants" (MEC) used to shut down arguments, especially the idea that soldiers on the unjust side are doing something wrong by fighting. They want a breakdown of the different interpretations of MEC—legal vs. moral, liability vs. permissibility vs. blameworthiness, epistemic claims, excuse-based claims—and an assessment of each interpretation's plausibility and whether it supports the conclusion that unjust-side soldiers aren't doing wrong.  

  First, I need to map out the possible readings of MEC. The user mentioned legal equality, which is straightforward: jus in bello applies symmetrically. But the seminar seems to be mixing this with moral claims. The key is to disentangle the layers.  

  The user suspects their classmate is using the weakest version. That suggests I should structure the response to highlight which interpretations are defensible and which are shaky. The classmate probably conflates legal symmetry with moral absolution—that’s a common slippage.  

  Breaking it down:  
  - **Legal Equality**: Clear-cut. International law treats combatants equally for jus in bello compliance. But this doesn’t touch moral guilt.  
  - **Moral Liability to Attack**: The "orthodox" Walzerian view. Soldiers lose their immunity by posing threats. Plausible for liability, but doesn’t address the initial wrong of joining an unjust war.  
  - **Moral Permissibility**: The claim that fighting for the unjust side isn’t inherently wrong. This is weak—it ignores the moral weight of participating in aggression.  
  - **Moral Blameworthiness**: Focuses on excuses (e.g., ignorance, coercion). More defensible, but excuses don’t erase the wrongful act, just reduce culpability.  
  - **Epistemic Claim**: Soldiers can’t know their side is unjust. Overstated—soldiers often have access to information, and modern conflicts aren’t that opaque.  

  The user wants to show that some versions of MEC don’t actually support the "no wrongdoing" conclusion. For example:  
  - Legal equality is irrelevant to moral wrongness.  
  - Liability to attack doesn’t justify the act of fighting.  
  - Permissibility is easily refuted.  
  - Blameworthiness and epistemic claims might reduce guilt but don’t negate wrongdoing.  

  I should emphasize that even the stronger excuses (blameworthiness/epistemic) concede the act is pro tanto wrong—they just excuse the agent. The classmate likely conflates these, using legal or liability claims to imply moral innocence.  

  Also, the user might need ammo for their seminar. Highlighting that Walzer himself separates jus ad bellum from jus in bello, but revisionists like McMahan challenge this. Pointing out that "moral equality" often smuggles in a permissibility claim under the guise of liability.  

  Finally, the conclusion: MEC (as liability) is plausible for narrow contexts but doesn’t resolve the core question. The unjust soldier’s participation remains wrongful, even if excused or legally protected. The slogan is being overextended.
answer: |-
  Here's a breakdown of the distinct claims packed into "moral equality of combatants" (MEC), their plausibility, and whether they support the conclusion that the unjust-side soldier isn't doing wrong by fighting. Your seminar classmate is likely relying on a specific (and often weaker) conflation.

  **Core Distinctions:**
  1.  **Legal Equality vs. Moral Equality:** This is fundamental. Legal equality is a convention for managing conflict; moral equality makes a claim about underlying rightness/wrongness.
  2.  **Liability vs. Permissibility vs. Blameworthiness:** These are distinct moral concepts:
      *   **Liability:** You can be permissibly harmed/targeted because of something you've done/are doing (e.g., posing a threat).
      *   **Permissibility:** Your *own action* is morally allowed/not wrong.
      *   **Blameworthiness:** You are *culpable* or *deserve blame* for a wrongful action you committed.
  3.  **Epistemic Claim:** About what combatants *can reasonably know*.
  4.  **Excuse-Based Claim:** Explaining why someone who did something wrong isn't *fully* (or at all) blameworthy.

  ---

  **The "Menu" of Readings:**

  1.  **The Legal Equality Claim (Jus in Bello Symmetry)**
      *   **Precise Claim:** The *legal rules* governing the conduct of warfare (jus in bello - distinction, proportionality, necessity) apply equally to combatants on both sides of a conflict, regardless of the justice of their cause (jus ad bellum). Combatants on the unjust side are not *legally* criminals simply for fighting; they are lawful targets and entitled to POW status if captured.
      *   **Plausibility:** **Highly Plausible.** This is the bedrock of modern International Humanitarian Law (IHL). Its purpose is pragmatic: to ensure wars are fought with *some* restraint by giving combatants on both sides incentives to follow the rules. Without it, the unjust side would have no incentive to follow any rules.
      *   **Gets you "not doing wrong"?** **NO.** This is purely about *legal status and rules of conduct*, not the underlying morality of *why* they are fighting. It explicitly does *not* address whether joining/fighting for an unjust cause is *morally* wrong. It treats them identically *as combatants under the laws of war*, not as moral agents. Conflating this with moral innocence is a category error.

  2.  **The Moral Liability to Attack Claim (The Orthodox Walzerian View)**
      *   **Precise Claim:** Combatants on both sides are *morally liable* to be attacked and killed by enemy combatants simply by virtue of being combatants (i.e., posing a threat). This liability is symmetrical and independent of the justice of their cause.
      *   **Plausibility:** **Moderately Plausible (but contested).** This is Michael Walzer's core argument in *Just and Unjust Wars*. The reasoning is that by joining the military and taking up arms, individuals forfeit their peacetime right not to be killed; they enter a state of "mutual endangerment." The justification for killing them isn't *punishment* for fighting unjustly, but *self-defense* (or defense of others) against an immediate threat they pose. This allows for symmetrical jus in bello rules.
      *   **Gets you "not doing wrong"?** **NO.** This claim is *only* about *when it is permissible to kill someone*. It says nothing about whether the act of *being a combatant in an unjust war* is itself morally wrong. Walzer himself explicitly states that soldiers fighting for an unjust cause *are* doing something morally wrong – they are "criminals" in the moral sense – but they are still *liable* to be killed because of the threat they pose. Liability ≠ Permissibility. They are doing wrong *and* they can be permissibly killed for doing it.

  3.  **The Moral Permissibility Claim (The Strong Moral Equality Claim)**
      *   **Precise Claim:** The *act of fighting* itself is morally permissible for combatants on both sides, regardless of the justice of their nation's cause. There is no fundamental moral difference between pulling the trigger for the just side vs. the unjust side *as an individual combatant*.
      *   **Plausibility:** **Highly Implausible.** This is the view your classmate likely *wants* MEC to imply, but it's the weakest reading philosophically. It directly contradicts the core intuition of just war theory: that *why* you fight matters fundamentally. If the war is unjust aggression, then the combatants participating *are* instruments of that aggression. Their actions contribute to wrongful harm. Claiming their act of fighting is *permissible* (not just excusable or non-criminal legally) severs the moral link between the individual soldier and the unjust collective action. Revisionist just war theorists (like Jeff McMahan) argue forcefully against this, seeing it as incoherent: how can killing people *justifiably defending themselves against your aggression* be a morally permissible act?
      *   **Gets you "not doing wrong"?** **YES, but only by asserting the implausible claim.** If this claim were true, then yes, the unjust-side soldier isn't doing wrong *by fighting*. But this claim lacks strong justification and contradicts basic moral reasoning about complicity in aggression.

  4.  **The Epistemic Claim (Soldiers Can't Know)**
      *   **Precise Claim:** Individual combatants cannot reliably know whether their nation's cause is truly just or unjust. Governments control information, propaganda is powerful, the fog of war is thick, and moral reasoning about complex geopolitical situations is difficult for ordinary soldiers. Therefore, we *cannot morally judge* them for fighting based on the (unknowable-to-them) justice of the cause.
      *   **Plausibility:** **Plausible in Many Cases, but Overstated.** It's true that soldiers often operate under significant epistemic constraints. Conscripts, low-ranking soldiers, and those in highly controlled societies may genuinely lack access to truth. However, this is not *universally* true. Professional soldiers, officers, citizens in democracies with free press, those fighting blatant wars of conquest – may have significant access to information suggesting the war's injustice. The claim also risks infantilizing soldiers and absolving them of *any* responsibility to critically assess their government's actions. It's often an *excuse*, not a denial of wrongdoing.
      *   **Gets you "not doing wrong"?** **NO (or Not Necessarily).** This claim is about *knowledge*, not the inherent *wrongness* of the act. It suggests soldiers *might* be *excused* for doing something wrong if they genuinely didn't know, or that we *shouldn't blame them* as harshly. It doesn't change the fact that *if* the cause is unjust, their act of fighting *is* contributing to wrongdoing. It makes the wrongdoing *non-culpable* or *less culpable*, not *non-wrongful*.

  5.  **The Excuse-Based Claim (Reduced or Absent Blameworthiness)**
      *   **Precise Claim:** While fighting for an unjust cause *is* morally wrong (pro tanto), combatants often have strong *excuses* that significantly reduce or eliminate their personal *blameworthiness* or *culpability*. Excuses include: epistemic limitations (see #4), duress/coercion (conscription, threat of punishment), indoctrination, the fog of war, the overwhelming power of the state, and the "collective action problem" (one soldier refusing won't stop the war).
      *   **Plausibility:** **Very Plausible.** This is often the strongest moral point underlying the intuitions behind MEC. It acknowledges the objective moral wrong of participating in unjust aggression but recognizes the immense pressures and limitations soldiers face that diminish their personal responsibility. It separates the *wrongness of the act* from the *blameworthiness of the agent*.
      *   **Gets you "not doing wrong"?** **NO.** This claim explicitly *accepts* that the unjust-side soldier *is* doing something morally wrong by fighting (contributing to unjust harm). Its point is that the soldier might not be *personally culpable* or *deserve blame* (or full blame) for it due to mitigating circumstances. It rejects the *moral permissibility* claim (#3) but offers reasons why we shouldn't necessarily *condemn the individual soldier* as harshly as we condemn the act or the political leaders. The conclusion it supports is "not (fully) blameworthy," **not** "not doing wrong."

  **Conclusion & Seminar Strategy:**

  *   **Your classmate is almost certainly conflating Legal Equality (#1) and/or Moral Liability (#2) with Moral Permissibility (#3).** They hear "combatants are equal under the rules of war" or "it's okay to kill combatants on both sides" and slide to "therefore, their act of fighting is morally okay for both." This slippage is common but philosophically invalid.
  *   **The strongest arguments for *symmetry* are:**
      *   **Legal Pragmatism (#1):** Essential for workable IHL.
      *   **Moral Liability (#2):** Explains *why* symmetrical jus in bello rules can be morally grounded (self-defense against a threat), without denying the underlying ad bellum wrong.
      *   **Excuses (#5):** Explains why individual unjust combatants often aren't *culpable criminals* deserving maximal blame, even though their participation is wrongful.
  *   **The strongest arguments *against* the claim "the unjust-side soldier isn't doing wrong" are:**
      *   Moral Permissibility (#3) collapses under scrutiny.
      *   Liability (#2) explicitly doesn't address the permissibility *of their fighting*, only the permissibility *of killing them*.
      *   Legal Equality (#1) is irrelevant to moral wrongness.
      *   Epistemic (#4) and Excuse (#5) claims *presuppose* the act is wrong but offer reasons why the agent isn't fully responsible.

  **To challenge your classmate:** Ask: "Are you saying the *act of fighting* for an unjust aggressor is morally permissible, or are you saying something else (like it's legally protected, or they can be killed, or they have excuses)?" Force them to specify which precise claim they are making. Point out that Walzer (the originator of modern MEC) explicitly says unjust combatants *are* doing wrong, they are just *liable* to be killed. Ask how contributing to an act of aggressive war isn't *prima facie* morally problematic. Highlight the distinction between *blameworthiness* and *wrongness* of the act. By forcing precision, you expose whether they are relying on the implausible Moral Permissibility claim (#3) or smuggling in Legal Equality (#1) as moral absolution.
