prompt: |-
  I've been going down a rabbit hole about how the Unicode Consortium decides what gets its own code point and what doesn't, specifically for letters. Here's what's puzzling me. They treat the roman 'a' and the italic 'a' as the same character — just font variations, one code point. But they treat Latin 'a' and Cyrillic 'а' as different characters with different code points, even though they're visually identical in most fonts. And they've got Han characters where what looks like basically the same thing to a non-expert gets unified across Chinese, Japanese, and Korean, while a community proposing a slightly different shape of an existing Latin letter for their minority language sometimes gets told no because it's "just a glyph variant." What theory of letter identity does this practice presuppose? Is it shape, function, historical origin, user intention, or some mix? And is the practice actually consistent — does it apply one theory across the board, or does it kinda switch between them depending on the script and the politics of who's asking? Reconstruct the implicit metaphysics of the letterform that you'd need to believe for most of these decisions to make sense. And then tell me what would break if they adopted a pure shape-based criterion instead.
reasoning: |-
  Okay, the user is diving deep into Unicode's decisions on code points for letters. They're puzzled by the apparent inconsistencies: why italic 'a' isn't separate from roman 'a', but Cyrillic 'а' gets its own code point despite looking the same. Also, why Han characters are unified across CJK while minor Latin variants are rejected as glyph variants.

  First, I need to recall Unicode's core principles. The key is that Unicode encodes characters, not glyphs. Characters are abstract entities, while glyphs are their visual representations. So the italic 'a' is just a stylistic variation of the same character 'a'. But Cyrillic 'а' is a different character because it belongs to a different script, used in a distinct writing system. 

  Then there's the Han unification. Chinese, Japanese, and Korean share many characters derived from Han script, but over time, they developed regional glyph variations. Unicode unifies them under one code point if they share the same historical origin and meaning, even if glyphs differ slightly. This is a practical decision to avoid duplicating thousands of characters. But for Latin script, adding a new variant might not be necessary if it's just a stylistic choice, not representing a new phoneme or used in a separate writing system.

  The user mentions minority languages proposing slight Latin letter variations. Unicode might reject these as glyph variants because they don't serve a distinct linguistic function. But if the variant is used consistently in a community to represent a different sound, it might get encoded. So the criteria involve script, function, and usage, not just shape.

  The implicit metaphysics here is that a character's identity is tied to its linguistic role, historical origin, and script, not its appearance. Unicode prioritizes interoperability and efficiency. Adopting a pure shape-based system would break this. Every font variation could demand a new code point, leading to chaos. Imagine encoding bold, italic, serif, sans-serif as separate characters. The character set would explode, making data processing inefficient. Also, disunifying Han characters would increase the number of code points significantly, complicating text handling across CJK languages.

  The user might be frustrated with what seems like arbitrary decisions. They might need reassurance that there's a logical framework, even if it's not perfect. The deeper need could be understanding how linguistic principles apply in tech standards, or advocating for minority scripts. They might also be interested in the politics behind these decisions, like how influential bodies push for their scripts. 

  I should explain the balance between linguistic function and practicality. Highlighting examples like the Cyrillic 'а' vs. Latin 'a' shows how script differentiation is crucial. For Han unification, it's about historical unity despite visual differences. The user's scenario suggests they're looking for consistency, but Unicode's approach is context-dependent. Addressing their examples and explaining the underlying principles should clarify the reasoning. Also, discussing what breaks with a shape-based approach emphasizes why the current system, despite its quirks, is necessary for global text processing.
answer: |-
  That's an incredibly sharp observation – you've hit upon one of the most philosophically fraught and practically challenging aspects of Unicode. The Consortium's decisions often *feel* inconsistent because they rest on a **multifaceted, context-dependent theory of "character identity"** that prioritizes *linguistic function, historical origin, and script membership* over pure visual form (glyph). Here's the implicit metaphysics reconstructed:

  ## The Implicit Metalinguistic Theory of Unicode Character Identity ("When is a shape a distinct character?")

  1.  **Primacy of Script:** The fundamental container for identity is the **writing system (script)**. Latin, Cyrillic, Greek, Han (CJKV), Arabic, etc., are distinct universes. A shape within one script is *ontologically different* from an identical shape in another script, even if borrowed. (Latin `a` U+0061 vs. Cyrillic `а` U+0430).
  2.  **Linguistic Function is Paramount:** A character is defined by its role in representing linguistic units (phonemes, syllables, morphemes, words) within its script/writing system. If two glyphs represent the *same linguistic unit* in the *same script* and *same language context*, they are variants of one character. If they represent *different linguistic units* (even if phonetically identical), they are distinct characters.
      *   *Italic 'a' vs. Roman 'a':* Same linguistic unit (the vowel /a/) in the Latin script. Glyph variation only.
      *   *Latin 'a' vs. Cyrillic 'а':* Represent different linguistic units *by virtue of belonging to different scripts*, even if both often represent /a/. Cyrillic `а` is part of the system encoding Russian, Bulgarian, etc., distinct from Latin.
  3.  **Historical Origin & Lineage:** Characters inherit their identity from their historical predecessors and the evolution of the writing system. Han unification relies heavily on this: characters sharing a common historical ancestor in the Chinese tradition and representing the same morpheme/core meaning across CJK are unified, *despite* contemporary glyph variations (e.g., 骨 in China vs. Japan). Their "characterhood" is tied to their shared historical origin and semantic core.
  4.  **Community Usage & Standardization:** A distinct character exists if a *significant linguistic community* consistently uses a specific shape to represent a distinct linguistic element *within their standardized writing system*, and this distinction is not merely typographical. This is where minority language proposals often struggle – they must prove the variant is *functionally necessary* within a distinct *standardized* orthography, not just a preferred glyph.
  5.  **Minimization Principle:** Avoid encoding purely graphical variations unless they meet the above criteria. This is crucial for practical manageability.

  ## Why It *Seems* Inconsistent & Context-Dependent

  *   **Script-Specific Conventions:** The weight given to historical origin vs. contemporary function varies. Han unification *heavily* weights historical origin/morpheme identity due to the sheer scale and shared history. For Latin, the focus is overwhelmingly on contemporary linguistic function within modern orthographies.
  *   **Scale & Practicality:** Unifying tens of thousands of Han characters based on historical roots is seen as necessary to avoid an explosion of duplicate code points. The number of proposed Latin variants is much smaller, so the barrier for "distinct function" is set higher.
  *   **Political & Cultural Factors:** Proposals often come through national standards bodies or major institutions. Established scripts/languages with large user bases and strong standardization bodies (like those for CJK) have more influence. Minority languages often lack this institutional backing or documented standardization proving *functional necessity*.
  *   **The "Font Variation" vs. "Character" Boundary is Fuzzy:** When does a stylistic difference (italic) become a distinct character? Unicode generally says "never for Latin," while accepting it for mathematical alphanumerics (e.g., Mathematical Italic `𝑎` U+1D44E) because they function in a distinct *semantic domain* (math notation). The *context of use* matters.

  ## What Breaks Under a Pure Shape-Based Criterion?

  Adopting a purely visual/glyph-based criterion would be catastrophic for Unicode's core goals of universal interchange and efficient text processing:

  1.  **Character Set Explosion:** Every font variation (bold, italic, sans-serif, serif, small caps, condensed, handwritten styles), every minor typographical whim, and every regional handwriting variant would demand its own code point. The character set would balloon into the millions, becoming utterly unmanageable.
  2.  **Loss of Semantic/Linguistic Meaning:** Text would become purely visual data. Searching for the word "cat" would fail if it was rendered in a different font style. Spell checkers, grammar checkers, text-to-speech, and machine translation would become impossible or wildly inaccurate, as they rely on the abstract character identity.
  3.  **Broken Interoperability:** Text copied from one system/font to another would potentially change meaning if glyphs with identical shapes but different underlying codes were interpreted differently, or if minor shape variations were encoded as different characters. The "same" text could have wildly different digital representations depending on the font used to create it.
  4.  **Rendering Nightmare:** Rendering engines would need to know the *exact* code point for every visual nuance. Instead of specifying "Arial Italic 'a'", you'd have to specify a unique code point for that specific glyph, defeating the purpose of fonts and stylesheets.
  5.  **Han Unification Collapse:** CJK text processing would become a disaster. The same semantic character (e.g., "water" 水) would have dozens or hundreds of different code points based on minor stylistic or regional glyph differences (Japanese vs. Chinese vs. Korean typographical traditions). Databases, dictionaries, and search indexes would fragment horribly.
  6.  **Ambiguity & Confusion:** Countless visually similar or identical glyphs from different scripts (like Latin `a`, Cyrillic `а`, Greek `α`, Mathematical Italic `𝑎`) would be conflated into a single code point, destroying the distinction between different writing systems and their inherent meanings.
  7.  **Impracticality:** Creating fonts, keyboards, input methods, and software supporting millions of purely glyph-based code points would be technically and economically infeasible.

  **In essence:** Unicode's implicit metaphysics prioritizes the **character as a linguistic signifier within a specific writing system** over the **character as a purely visual mark**. While the decisions involve pragmatism, politics, and sometimes feel inconsistent across scripts, the core principle of separating abstract character identity from visual representation (glyph) is fundamental to making digital text work globally. The "inconsistencies" you perceive often arise from applying this core principle to the vastly different historical, linguistic, and practical realities of the world's writing systems. A pure shape-based approach sacrifices linguistic meaning and interoperability for visual fidelity, undermining the very purpose of a universal character encoding.
