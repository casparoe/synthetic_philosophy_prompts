prompt: |-
  I've been turning something over for a while and I'd like a proper diagnosis rather than a survey. In undergrad I read Dawkins on memes and it felt like a revelation: tunes, catchphrases, fashions, bits of technology all spreading and mutating and getting selected more or less like genes. Then I got into the more serious literature and found that almost nobody in the actual sciences of culture uses "meme" anymore, and the people who do serious cultural evolution (Boyd and Richerson, Henrich, and so on) mostly treat memetics as a wrong turn. But when I read the back-and-forth from the 90s and 2000s, it doesn't look like anyone actually lost an argument. Dawkins and Dennett say memes are real units of cultural inheritance and selection; Sperber and others say culture mostly isn't copied the way genes are, it's reconstructed and transformed by each mind, so the unit dissolves; and the cultural evolution people say you can do Darwinian population thinking about culture without discrete, high-fidelity replicators. All three sides seem to accept the same basic facts about how culture spreads, yet they've been talking past each other for decades. My working hypothesis is that the debate was never really about whether culture evolves — everyone grants that in some loose sense — but about what an explanation of culture has to do: whether it has to bottom out in entities that get transmitted, or can stop at changing frequencies of traits in a population. But I'm not sure that's right; maybe its a straightforward empirical question about copying fidelity that just wasn't settled at the time, or maybe "meme" was doing two jobs at once (a scientific construct and a catchy word) and people argued past each other because of that. I'd like a diagnosis of what kind of disagreement this actually is, what would have counted as progress in, say, 2005, and whether anything in cultural evolution research since then could actually settle it or whether the question is just badly posed. I know the lay of the land, so don't bother with citations or a reading list; I want the structure of the disagreement laid bare.
reasoning: |-
  Okay, this user is deeply immersed in the meme theory debate and wants a structural analysis rather than facts. They've clearly read Dawkins, Dennett, Sperber, Boyd & Richerson, Henrich. Their frustration is palpable - they see all sides accepting the same cultural transmission mechanisms yet talking past each other for decades. 

  Hmm, their working hypothesis about explanatory bottoming-out vs population-level frequencies is sharp, but I suspect there's more. The core tension feels like three different explanatory ideals pulling at the same phenomenon. Dawkins wants atomistic replicators because that's what worked in biology. Sperber insists on cognitive reconstruction because that's where psychology lives. Boyd/Richerson prioritize measurable population dynamics because that's what their models capture.

  What's really clever about their question is spotting that nobody disputes the surface behavior of culture - it's about what counts as a satisfying explanation. Like arguing whether light is particles or waves when both models are useful for different purposes. 

  The user seems to want philosophical closure on why this debate persists despite shared empirical ground. They're not asking "who's right" but "why has this remained unresolved?" That's sophisticated. Their mention of 2005 suggests they suspect some later developments (maybe internet memes? quantitative social science?) might have shifted things.

  Ah! The key might be recognizing that "meme" was overloaded from the start - a scientific construct smuggling in a viral-pop-culture metaphor. When scientists rejected the former, they accidentally threw out useful aspects of the latter. Meanwhile, Boyd/Richerson's models work precisely because they avoid specifying psychological mechanisms, which feels unsatisfying to cognitive purists. 

  Recent cultural evolution work won't settle this because the disagreement isn't empirical - it's about what explanatory satisfaction looks like. The user's hunch about "what explanations must do" is dead on. I should frame this as competing explanatory virtues: replicators offer clear units but distort cognition, reconstruction honors psychology but loses selection's clarity, population models predict trends but feel "black box." 

  The resolution isn't choosing a side but mapping when each approach illuminates best. Like how fluid dynamics and molecular kinetics both explain water, just at different scales. The user deserves to hear that their structural insight is correct - this was always about what "counts" as explanation.
answer: |-
  Your diagnosis is perceptive: **the core disagreement isn't empirical but ontological and methodological—about what constitutes an adequate *explanation* of cultural change.** The "shared facts" mask divergent epistemic commitments. Here's a structural breakdown:

  ### 1. **The Three Axes of Disagreement**
     - **A. Replication vs. Reconstruction**  
       Dawkins/Dennett: Insist cultural inheritance *requires* discrete, high-fidelity replicators ("copy-the-product"). Without them, selection lacks units to act upon.  
       Sperber/Atran: Argue culture is mostly "copy-the-instructions" (inferential reconstruction). Transmission is transformative by default; high-fidelity copying is rare. "Memes" are reifications.  
       *Stalemate Reason*: Both describe real phenomena (e.g., viral TikTok dances vs. reinterpreted folk tales). The fight is over which pattern is *explanatorily primary*.

     - **B. Units of Selection vs. Population Dynamics**  
       Memetics: Demands gene-like units ("replicators with vehicles") for Darwinism to apply strictly.  
       Cultural Evolution (CE): Adopts Price's equation—selection works on *any* heritable variation, regardless of replication fidelity. Frequencies of traits (e.g., baby names, pottery styles) can evolve without atomistic "memes."  
       *Stalemate Reason*: CE models *work* empirically without replicators. Memeticists see this as "black-boxing" cognition; CE sees replicators as unnecessary metaphysical baggage.

     - **C. Psychology vs. Epidemiology**  
       Sperber: True explanation must bottom out in cognitive mechanisms (inference, attractors).  
       Dawkins/Boyd-Richerson: Focus on population-level outcomes (e.g., why trait X spreads). Cognitive details are secondary to selection dynamics.  
       *Stalemate Reason*: Psychology explains *how* transmission happens; CE explains *why* some variants dominate. They’re complementary, but framed as rivals.

  ### 2. **What "Progress" Would Have Looked in 2005**
     - **Clear victory conditions were impossible** because the debate conflated three distinct questions:
       - *Descriptive*: How *often* is culture copied vs. reconstructed? (Empirical, but context-dependent).  
       *Theoretical*: Must cultural evolution require replicators to be "Darwinian"? (Philosophical/definitional).  
       *Pragmatic*: Which framework generates better models/predictions? (CE won this by 2005 with diffusion models, biases).
     - Progress would have required disentangling these and agreeing on success criteria. Instead, proponents talked across levels.

  ### 3. **Why It Wasn't Settled (and Still Isn't)**
     - **"Meme" did two jobs**: It was a putative scientific unit *and* a rhetorical tool for a "universal Darwinism" worldview. Critics attacked the former; defenders conflated it with the latter.  
     - **Selection vs. Transformation**: Memetics emphasizes *selection* of variants; reconstructionists emphasize *transformation during transmission*. Both occur, but their relative importance varies by domain (e.g., chain emails vs. religious rituals).  
     - **The Fidelity Red Herring**: Empirical studies (e.g., Mesoudi's transmission chains) show copying fidelity exists on a spectrum. But proving "low fidelity" doesn't kill selection—it just shifts the unit (e.g., to "attractor basins" in trait space).

  ### 4. **What Modern CE Research Shows (Without Settling It)**
     - **Boyd-Richerson/Henrich-style models** succeed by ignoring replicators and tracking trait frequencies + biases (content, context, model-based). Their predictive power sidesteps the meme debate.  
     - **Cognitive anthropology** (e.g., Boyer, Atran) confirms Sperber: culture is reconstructed via domain-specific inference. High-fidelity copying is the exception.  
     - **Digital culture** (e.g., viral trends) *looks* memetic—but even there, reconstruction occurs (e.g., remixes, algorithmic filtering).  

  **Conclusion**: The debate persists because **it’s not about facts but about explanatory ideals**.  
  - If you demand *reduction to cognitive mechanisms*, memetics (and strict CE) feels inadequate.  
  - If you demand *quantitative population models*, memetics is inflexible and Sperber is "just psychology."  
  - If you want a *unified theory of culture*, all seem partial.  

  **The Irony**: Modern CE tacitly incorporates all three:  
  - **Population-level models** (Boyd-Richerson) as the engine  
  - **Cognitive reconstruction** (Sperber) as the transmission mechanism  
  - **"Memetic" patterns** as a subset of high-fidelity phenomena  

  The question wasn’t badly posed—but it demanded a single "correct" level of analysis where none exists. The resolution isn’t victory for one camp, but recognizing that culture evolves through **interacting processes** (replication, reconstruction, selection) best modeled with pluralistic tools. Memetics wasn’t refuted; it was absorbed into a broader evolutionary ecology of culture.
