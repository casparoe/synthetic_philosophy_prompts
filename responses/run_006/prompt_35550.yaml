  So my brother has spent the last month watching cosmology videos, and now every family dinner turns into the fine-tuning argument. His position, as near as I can pin it down, is that the fact that a bunch of constants (cosmological constant, strong force strength, electron-proton mass ratio, whatever) had to be insanely close to there actual values for life to be possible basically settles the God question. I'm more skeptical — I keep reaching for multiverse and selection-effect stories, and I also suspect "life as we know it" is doing more work than it should — but I've realized I dont actually know where my skepticism is doing the most work. For calibration, my credence in the claim below is around 0.35 and his is around 0.85.

