prompt: |-
  ok so i'm a cog-sci phd working on pain affect and i keep hitting the same wall: people in this literature are argueing past each other because they haven't agreed on what a theory of pain's badness is even supposed to do. before i read another paper i want the spec. not a theory of pain in general — a theory of what makes pains *bad*, why they matter in the way they do. give me exactly five desiderata any adequate account has to satisfy, each a sentence or two with the case or phenomenon that earns it a spot on the list. flag any pair you think can't be jointly satisfied. and tell me which single desideratum does the most to rule out the naive view that the badness is just built into the sensation itself — the view everyone wheels out pain asymbolia to refute.
reasoning: |-
  Okay, the user is a cognitive science PhD student researching pain affect, specifically why pains are bad. They're frustrated because the literature lacks agreement on what a theory of pain's badness should accomplish. They want five clear desiderata for such a theory, each backed by a real-world case. They also want to know which desiderata conflict and which one best refutes the naive view that badness is intrinsic to pain sensation.

  First, I need to recall key phenomena in pain research. Pain asymbolia is the classic counter to intrinsic badness—patients feel pain but don't find it unpleasant. That's crucial. Then there's placebo effects, where beliefs modulate pain's badness without changing sensation intensity. Motivational conflict cases, like athletes ignoring pain, show badness isn't always dominant. Hedonic reversals, like masochism, prove context flips badness to goodness. And developmental cases with congenital insensitivity reveal that badness requires learning.

  For desiderata, each must address these phenomena. I'll start with the dissociation between sensation and affect, using asymbolia. That directly challenges the naive view. Next, motivational force—pain drives action, but not rigidly, as seen in athletes or suppressed pain. Then modifiability via cognition, demonstrated by placebos. Contextual valence, where the same sensation can be good or bad depending on situation, like in BDSM. Finally, developmental trajectory, showing badness isn't innate but learned through experience.

  Now, conflicts: Motivational dominance and contextual valence might clash. If pain must always demand attention (dominance), how can it sometimes be ignored or enjoyed? That's a tension worth flagging. The strongest anti-naive desideratum is the first one—dissociation—since asymbolia proves sensation and badness aren't inseparable.

  I should ensure each desideratum is precise and tied to a specific case. The user wants brevity, so each gets one sentence plus a phenomenon. Also, highlight which pair conflicts. Finally, emphasize why dissociation is the knockout punch against intrinsic badness. This structure should give them a solid framework to evaluate theories.
answer: |-
  Here are five core desiderata for any adequate theory of pain's badness, grounded in key phenomena and designed to cut through conceptual confusion. I'll flag the critical conflict and identify the strongest anti-naive desideratum.

  1.  **Dissociation from Sensory Qualia:** *The theory must explain how the experienced badness (unpleasantness) of pain can dissociate from its sensory-discriminative features (intensity, location, quality).* (Case: **Pain Asymbolia** - Patients accurately report sharp, intense sensations following noxious stimuli but experience no associated unpleasantness or urge to withdraw. The *sensation* is intact; the *badness* is absent.)
  2.  **Motivational Force & Dominance:** *The theory must account for the powerful, often overriding, motivational force of pain's badness to drive escape, avoidance, and protective behavior, while also explaining why this force can sometimes be suppressed or overridden.* (Case: **Motivational Conflict (e.g., Endurance Athletics)** - A runner experiences intense burning muscle pain (high sensory intensity & unpleasantness) but suppresses the urge to stop because the goal (winning) temporarily dominates. The badness persists & motivates, but higher-order goals win the conflict.)
  3.  **Cognitive Modifiability:** *The theory must explain how the badness of a given nociceptive signal can be significantly modulated by cognitive factors like meaning, expectation, and context, without necessarily altering the sensory intensity.* (Case: **Placebo/Nocebo Effects** - Identical thermal stimuli are rated as significantly more unpleasant when preceded by a cue signaling "high pain" vs. "low pain," or when given an inert "analgesic" vs. an inert "hyperalgesic." The *sensory input* is constant; the *experienced badness* changes based on belief/expectation.)
  4.  **Contextual Valence:** *The theory must explain why the affective valence (good/bad) of a pain-like sensation can flip depending on its interpreted biological significance or context.* (Case: **Hedonic Reversal (e.g., "Good Pain")** - The intense burning sensation of spicy food (capsaicin) or the muscle soreness after exercise is often described as "good" or even sought after when interpreted as safe/beneficial (pleasure, growth). The identical sensation in a context signalling harm (e.g., unexpected burning skin) is intensely bad.)
  5.  **Developmental/Emergent Nature:** *The theory must explain how the badness of pain emerges developmentally and requires specific neural integration, rather than being an inherent property of nociceptive signals.* (Case: **Congenital Insensitivity to Pain (CIP) - Affective Component** - Individuals with CIP lack the aversive response to tissue-damaging stimuli from birth. They feel the *sensation* (pressure, temperature change) but do not develop the associated unpleasantness or learn its significance as "bad," leading to severe injuries. Badness isn't innate; it's learned/constructed.)

  **Flagged Conflict:** Desideratum **#2 (Motivational Force & Dominance)** and Desideratum **#4 (Contextual Valence)** are potentially difficult to satisfy *jointly* in a simple way.
  *   Why? #2 emphasizes the powerful, often prepotent, *imperative* quality driving immediate escape/avoidance – a core aspect of why pain is evolutionarily "bad." #4 highlights that under certain safe/beneficial interpretations, the *same* sensation can lose its imperative force and even become attractive. A theory needs to explain how the *badness* (linked to the imperative force) can fundamentally *change its valence* based on context without simply saying "it's a different kind of sensation." It must reconcile the seemingly intrinsic imperative with profound context-dependence of valence.

  **The Anti-Naive Knockout Punch:** Desideratum **#1 (Dissociation from Sensory Qualia)**, demonstrated by **Pain Asymbolia**, does the most to rule out the naive intrinsic view.
  *   Why? It provides the clearest *dissociation evidence*. Asymbolia patients have the paradigmatic *sensory experience* of acute, intense pain (sharp, burning, localized) – everything the naive view says *is* the badness. Yet, they report *no unpleasantness whatsoever* and exhibit no defensive behavior. This proves the sensory "pain" quale itself is *not sufficient* for the badness. The badness is a distinct component that can be stripped away, leaving the sensation intact but affectively neutral. While other desiderata (like #3 or #4) show the badness is *mutable*, #1 shows it's *separable* – the most direct refutation of intrinsicism.

  This framework forces theories to grapple with the core puzzles: dissociation, motivation, cognitive penetration, valence flexibility, and developmental emergence. Any account failing to address these will likely talk past others or miss the mark entirely. Good luck breaking through that wall!
