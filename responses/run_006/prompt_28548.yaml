  I recall that in philosophy, the doing/allowing distinction hinges on whether an agent actively causes harm or merely permits it to happen. Withdrawal of life-sustaining treatment is often classified as allowing death, not killing. But the user points out complications: food and water seem more basic than a ventilator, and Terri wasn't actively dying—she could live decades with the tube. How does that affect the analysis?

