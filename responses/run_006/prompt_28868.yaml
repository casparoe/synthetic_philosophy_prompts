  **Joint Statement on Self-Amendment in Nomic-Style Systems**

  **Preamble:** We, the undersigned, have engaged in an adversarial collaboration to clarify our respective positions on the logical and practical status of self-referential amendments in rule systems. We adopt the framework of Nomic-style games (as introduced by Peter Suber) as a model for our investigation. We focus on three canonical puzzle cases: (i) the self-voiding rule, (ii) the self-entrenching rule, and (iii) the omnibus repeal. Our goal is to articulate both our areas of agreement and disagreement with precision.

  **1. Common Ground**

  We agree on the following substantive claims:

  1.1. **Self-referential amendments are possible in Nomic-style systems.** Rule systems can contain rules that refer to themselves and that govern their own amendment.

  1.2. **The three puzzle cases (self-voiding, self-entrenching, omnibus repeal) are logically coherent and may be proposed in a Nomic game.** Each case presents a challenge that requires resolution.

  1.3. **Formal models can illuminate the structure of self-referential rules.** They can demonstrate consistency or inconsistency, and they can show how rules might be interpreted to resolve apparent paradoxes.

  1.4. **In actual play, the resolution of a puzzle case may depend on the actions of the players.** Players might accept, reject, or reinterpret a proposed amendment based on their understanding of the rules and the context.

  1.5. **A rule that is void ab initio (from the beginning) has no legal effect.** If a rule is void at the moment of its enactment, it cannot change the legal system.

  1.6. **The rules of a Nomic game, including the rules for amendment, form a system that is finite and at least initially consistent.** The system is designed to be operated by players who follow the rules.

  1.7. **The concept of "validity" in a rule system depends on the rules of that system.** A rule is valid if it is enacted in accordance with the rules in force at the time of enactment.

  1.8. **A rule that purports to amend the rules of amendment must be evaluated under the rules in force at the time of its proposal.** The rules that govern the proposal's adoption are those that exist prior to and during the proposal's consideration.

  **2. Disagreements Table**

  We disagree on the following points. Each side's view is fairly represented by the following formulations:

  | Issue | Formal-Determinacy View | Practical-Indeterminacy View |
  |-------|--------------------------|-----------------------------|
  | **2.1. Determinacy of Validity in Self-Referential Amendments** | For any self-referential amendment, the system's rules and principles of validity together determine whether it succeeds or fails; there is no third possibility (e.g., "gappy" status) and no need for an external decision beyond the application of the rules. | Some self-referential amendments (like the puzzle cases) create genuine gaps: the existing rules do not determine whether the amendment is valid or void; resolution requires a fresh act of norm-making (e.g., by players) that is not dictated by the prior rules. |
  | **2.2. The Self-Voiding Rule** | A rule whose entire content is that it is void is necessarily void. The rule's self-referential claim of voidness is correct because the rule, if valid, would invalidate itself, leading to a contradiction. Thus, the rule is void ab initio. | The self-voiding rule creates a gap: the rule cannot be valid (because if it were, it would void itself) and cannot be void (because then it would not exist to void itself). Since the prior rules do not resolve this, players must decide whether to treat it as void or as having some other effect. |
  | **2.3. The Self-Entrenching Rule** | A self-entrenching rule, enacted under the lower threshold, is valid and immediately raises the threshold for its own amendment. The rule was enacted under the old threshold, which was sufficient at the time of enactment, so the new threshold applies to future amendments. | The self-entrenching rule creates a gap: if the rule is valid, then the new threshold applies to the rule itself, but the rule was enacted under the old threshold. The prior rules do not say whether the new threshold applies retroactively. Players must decide whether to accept the rule's validity and the new threshold. |
  | **2.4. Resolution of Paradoxes** | Apparent paradoxes in self-referential amendments are resolved from within the system by applying consistent principles of validity (e.g., hierarchy of rules, non-retroactivity, avoidance of contradiction). | Genuine gaps created by self-referential amendments cannot be resolved by the system alone; they require a decision by an authority (e.g., the players) that is not determined by the rules. |

  **3. Cruxes**

  We identify the following cruxes. If settled, at least one side would change its view.

  3.1. **Crux: The Status of the Self-Voiding Rule After Enactment**

     - **Case:** Consider a game where players propose and adopt a rule that states: "This rule is void." The rule is enacted according to the existing amendment procedures.
     - **Formal-Determinacy Prediction:** The rule is void from the moment of enactment because it asserts its own voidness. Therefore, it never becomes part of the system. The system remains unchanged.
     - **Practical-Indeterminacy Prediction:** The rule creates a gap: the system cannot consistently assign it either validity or voidness. The players must decide, by a fresh act, whether to treat it as void or to reinterpret it (e.g., as a proposal to end the game). Until they decide, there is no fact of the matter about its validity.
     - **Why Crux:** If the formal-determinacy view is correct, the rule is automatically void without player intervention. If the practical-indeterminacy view is correct, player intervention is necessary. This case tests whether the system alone can resolve the paradox.

  3.2. **Crux: The Retroactive Effect of a Self-Entrenching Rule**

     - **Case:** A rule is proposed that changes the threshold for amending Rule X from a simple majority to a two-thirds majority. The rule itself is Rule X. It is enacted by a simple majority (the old threshold).
     - **Formal-Determinacy Prediction:** The rule is valid and the new threshold applies immediately. Any future attempt to amend Rule X requires a two-thirds majority. The rule was enacted under the old threshold, which was valid at the time, and the new threshold is not retroactive.
     - **Practical-Indeterminacy Prediction:** The rule creates a gap: if valid, then the new threshold should apply to the rule itself, but it was enacted under the old threshold. The prior rules do not specify whether the new threshold applies to the rule that enacted it. Players must decide whether to accept the rule and the new threshold, or to reject the rule as self-undermining.
     - **Why Crux:** This tests whether the system's rules determine the temporal effect of a self-amendment or if a gap exists requiring player decision.

  3.3. **Crux: The Omnibus Repeal Including Itself**

     - **Case:** A rule is enacted that states: "All rules in the system, including this one, are repealed." It is enacted according to the existing amendment procedures.
     - **Formal-Determinacy Prediction:** The rule repeals all rules except itself. Because the rule must be in force at the time of repeal to have any effect, it repeals every other rule and then, by its own terms, repeals itself. The result is a system with no rules. Alternatively, if the rule repeals itself at the same moment, it might be void ab initio (leading to no change). Either outcome is determined by the rules and principles of validity.
     - **Practical-Indeterminacy Prediction:** The rule creates a gap: if it repeals itself, then it cannot have been in force to repeal the other rules. If it does not repeal itself, then it remains and the repeal is incomplete. The prior rules do not resolve this circularity. Players must decide whether the repeal is effective (leaving no rules) or void (leaving the prior system intact).
     - **Why Crux:** This tests whether the system can determinately handle a rule that purports to repeal itself along with the entire system.

  3.4. **Crux: The Role of Player Interpretation in Actual Play**

     - **Case:** In a game, players are presented with a self-voiding rule. They discuss and then vote on whether to accept it as valid or void.
     - **Formal-Determinacy Prediction:** The players' vote does not create validity or voidness; it merely reflects what the rules already determine. If they vote to accept it as valid, they are mistaken because the rule is void by its own terms. If they vote to reject it, they are correct.
     - **Practical-Indeterminacy Prediction:** The players' vote resolves the gap. Until they vote, there is no fact of the matter. The vote is an act of norm-making that sets the status of the rule.
     - **Why Crux:** This tests whether the players' actions are discovering a pre-existing fact (determinacy) or creating a new one (indeterminacy).

  **4. Merely Verbal Disputes**

  After discussion, we find that part of our dispute is merely verbal:

  - **Term: "Rule"**: We both use "rule" to refer to a norm that is part of a system, but we sometimes differ in whether we include the entire context of the system (including principles of validity) in the concept of "rules". The formal-determinacy view often includes implicit principles (like non-contradiction) as part of the system, while the practical-indeterminacy view may reserve "rules" for explicit provisions. This does not reflect a substantive disagreement about how systems operate, but rather a difference in the scope of the term.

  - **Term: "Determine"**: The formal-determinacy view uses "determine" to mean that the outcome is logically entailed by the rules and principles. The practical-indeterminacy view uses "determine" to mean that the rules and principles alone provide a unique outcome without the need for further norm-making. This difference in usage can lead to apparent disagreement when in fact both agree that the rules constrain possible outcomes. The substantive disagreement is over whether the rules alone always provide a unique outcome.

  We conclude that, aside from these terminological clarifications, our disagreements are substantive and revolve around the determinacy of self-referential amendments and the necessity of external decisions.

  **Signatures:**

  [Signature for Formal-Determinacy Proponent]

  [Signature for Practical-Indeterminacy Proponent]

