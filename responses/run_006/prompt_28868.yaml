  We are drafting a joint statement for two legal philosophers, one holding a formal-determinacy view and the other a practical-indeterminacy view, regarding self-amending rules in the context of Nomic-style games. The document must capture common ground, disagreements, cruxes, and any merely verbal disputes.

  Let's break down the required sections:

  1. **Common Ground (Numbered List of Claims):** We need a list of substantive claims both can agree on. These should be about self-reference, validity, formal models, and actual play in the context of the three puzzle cases.

  2. **Disagreements Table:** A table with at least four rows, each representing a distinct point of disagreement. Each row should have two columns: one for the formal-determinacy view and one for the practical-indeterminacy view. The formulations must be acceptable to each side and not caricatures.

  3. **Cruxes:** Identify key sub-questions that, if settled, would change at least one side's view. For each crux, provide a concrete case or argument (from the puzzle cases or variants) and what each side predicts about it.

  4. **Merely Verbal Disputes:** If any part of the dispute is about terminology (like "valid", "determine", or "rule"), identify it and explain why.

