  This document captures the common ground, disagreements, cruxes, and verbal disputes as required. It is precise enough for a third party to understand the issues and what would resolve them.
answer: |-
  ### Joint Statement on Self-Amendment in Nomic-Style Systems  

  **Preamble**  
  We, the undersigned, have debated the logical foundations of self-amending rules for years. Through adversarial collaboration, we now present our shared understandings, disagreements, and cruxes, using Nomic-style games (Suber, 1982) as a model. We focus on three canonical puzzle cases: the self-voiding rule, the self-entrenching rule, and the omnibus repeal. This document reflects our commitment to precision and mutual clarification.  

  ---

  ### 1. Common Ground  
  We jointly affirm the following substantive claims:  

  1. **Self-reference is inherent and permissible** in Nomic-style systems. Rules may refer to themselves without intrinsic invalidity, provided they comply with procedural requirements at enactment.  
  2. **Formal models reveal necessary constraints**. No finite rule system can resolve all conceivable self-referential amendments without risking inconsistency or regression.  
  3. **Actual play requires operationalizable rules**. In a functioning Nomic game, players must act *as if* the system is determinate to avoid paralysis, even if gaps exist.  
  4. **Voidness requires grounds**. A rule is void only if it violates a specific, antecedent validity condition (e.g., procedural defect or substantive conflict with a higher rule).  
  5. **Temporal priority matters**. Rules enacted under a given amendment procedure are evaluated under the rules in force *at the time of enactment*.  
  6. **The three puzzle cases are logically distinct** and represent core challenges: self-voiding rules test consistency, self-entrenching rules test temporal application, and omnibus repeals test comprehensive self-reference.  
  7. **Not all paradoxes are fatal**. Some self-referential proposals are unproblematic (e.g., self-preserving rules), while others generate unresolvable tensions under the system’s own logic.  

  ---

  ### 2. Disagreements Table  
  The following table fairly represents our core disagreements. Each formulation is endorsed by the respective signatory as capturing their position.  

  | Issue | Formal-Determinacy View | Practical-Indeterminacy View |  
  |-------|--------------------------|------------------------------|  
  | **Nature of gaps** | Apparent gaps in self-amendment are always resolvable by applying the system’s rules and meta-principles (e.g., non-contradiction, hierarchy). If no resolution exists, the amendment is void. | Genuine gaps exist: some self-referential amendments create indeterminacies that *no* prior rule or principle resolves, leaving validity unsettled until a fresh act of authority intervenes. |  
  | **Source of validity** | Validity is wholly determined by antecedent rules. A successful amendment derives its authority entirely from the rules in force at enactment; no external "decision" is needed to create validity. | Validity can be conferred by extraneous acts. When gaps exist, a rule’s validity is fixed only when players *decide* its status, and this decision is not deducible from prior rules alone. |  
  | **Effect of self-voiding rules** | A self-voiding rule is necessarily void *ab initio*. Its self-negating content violates the consistency principle, preventing it from entering the system. | A self-voiding rule creates a true gap. It is neither valid nor void until players decide; the act of enactment triggers an unresolved contradiction that players must address. |  
  | **Retroactivity in self-entrenchment** | A self-entrenching rule is valid and applies immediately after enactment. The old threshold governs its adoption; the new threshold governs only subsequent amendments. | A self-entrenching rule’s effect on itself is indeterminate. The system cannot determine whether the new threshold applies retroactively; players must decide whether it "locks in" or invalidates itself. |  

  ---

  ### 3. Cruxes  
  The following sub-questions, if resolved, would compel at least one side to revise its position. Each crux includes a concrete case and our predictions.  

  #### Crux 1: *Does enactment alone resolve self-voiding rules?*  
  - **Case**: Rule X states: "This rule is void." It is enacted by a majority vote under a procedure requiring only a majority.  
  - **Formal-Determinacy Prediction**: Rule X is void upon enactment. The contradiction makes it invalid *ab initio*; the system reverts to pre-amendment state.  
  - **Practical-Indeterminacy Prediction**: Enactment creates a gap. Players must decide whether to (a) treat Rule X as void, (b) ignore it, or (c) deem it a failed amendment. No outcome is pre-determined.  
  - **Why crux**: If the system automatically voids Rule X, determinacy holds. If players must decide, indeterminacy holds.  

  #### Crux 2: *Can self-entrenchment apply retroactively?*  
  - **Case**: Rule Y (enacted by simple majority) states: "Amendments to Rule Y require a 2/3 majority." Players immediately propose repealing Rule Y under the old simple-majority rule.  
  - **Formal-Determinacy Prediction**: Rule Y is valid. The repeal attempt fails because the new threshold applies; the old threshold governed only Rule Y’s enactment.  
  - **Practical-Indeterminacy Prediction**: The repeal’s validity is indeterminate. Players must decide whether Rule Y’s new threshold applies to itself or only to future amendments.  
  - **Why crux**: If Rule Y’s effect is fixed upon enactment, determinacy holds. If its self-application is unresolved, players must fill the gap.  

  #### Crux 3: *Does partial survival resolve omnibus repeals?*  
  - **Case**: Rule Z states: "All rules are repealed, including this one." It is enacted correctly.  
  - **Formal-Determinacy Prediction**: Rule Z repeals all other rules, then self-repeals. The system is left ruleless.  
  - **Practical-Indeterminacy Prediction**: Rule Z creates a gap. If it self-repeals, it cannot repeal others; if it survives, it remains. Players must decide if repeal is total, partial, or void.  
  - **Why crux**: If self-repeal is simultaneous and complete, determinacy holds. If self-reference prevents coherent execution, players must intervene.  

  #### Crux 4: *Can gaps exist without player intervention?*  
  - **Case**: Players unanimously adopt a "gap-closing" rule: "Any amendment creating indeterminacy is void." They then enact a self-voiding rule.  
  - **Formal-Determinacy Prediction**: The gap-closing rule preemptively voids the self-voiding rule. The system resolves the issue internally.  
  - **Practical-Indeterminacy Prediction**: The gap-closing rule cannot resolve its own application to the self-voiding rule. Players must still decide how to apply it.  
  - **Why crux**: If meta-rules can close gaps, determinacy holds. If meta-rules inherit the same indeterminacy, players must decide.  

  ---

  ### 4. Merely Verbal Disputes  
  We identify one primarily verbal disagreement:  
  - **"Determine" in validity claims**:  
    - The formal-determinacy view uses "determine" to mean *logical entailment*: rules + principles yield a unique outcome (e.g., "valid" or "void").  
    - The practical-indeterminacy view uses "determine" to mean *causal efficacy*: rules + principles must produce an outcome *without* extraneous input.  
    **Why verbal**: Both agree rules constrain outcomes, but the latter holds that some cases require non-deductive inputs (player decisions) to produce a result. This is a difference in the *mechanism* of determination, not the existence of constraints.  

  ---

  **Conclusion**  
  This statement crystallizes our agreements, disagreements, and the cruxes defining our debate. We commit to further empirical testing in Nomic games to resolve these cruxes.  

  *Signed,*  
  **The Formal-Determinacy Proponent**  
  **The Practical-Indeterminacy Proponent**  

  ---  
  *Date: 2023-10-15*  
  *Adversarial Collaboration Project*
