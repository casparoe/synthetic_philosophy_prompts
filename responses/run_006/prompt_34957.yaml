  - **"Marital status is plainly that kind of fact"**: Strong justification showing why this deception matters (reasonable person standard).  
  - **"Condition (ii) is not implicated... a lie is neither"**: Precise distinction—correctly notes coercion requires force/threats, not merely deception.  
  - **"Condition (i) is satisfied"**: Accurate assessment; no issues with competence noted in the scenario.  
