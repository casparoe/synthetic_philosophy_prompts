prompt: |-
  I'm a TA for an undergrad sexual ethics course and I'm grading a batch of exam answers. I have alot of these to grade and could use a second set of eyes on one of them. Here's the question and the student's answer.

  Question: "Suppose A meets B at a party and tells B that A is single, when A is in fact married. B consents to have sex with A, and B would not have consented had B known A was married. On a view where valid consent requires (i) competence, (ii) voluntariness/absence of coercion, and (iii) adequate information: is B's consent valid? Discuss how each condition applies."

  Student answer: "B's consent is invalid, and the failure is in condition (iii). B was deceived about A's marital status, and under Tom Dougherty's deal-breaker account, deception invalidates consent whenever it concerns a fact that a reasonable person would consider a deal-breaker. Marital status is plainly that kind of fact, so the information condition fails. Condition (ii) is not implicated: A did not coerce B, because coercion requires the use of force or threats of force, and a lie is neither. Condition (i) is satisfied: B is a competent adult, not intoxicated or otherwise impaired. So B's consent is invalid solely on the information condition."

  Give the answer a letter grade, then give me the point-by-point comments that justify the grade — I want comments I could hand back to the student, so tie each one to a specific sentence. Put the grade on the first line, then a bulleted list of comments. Keep your whole response under 300 words.
reasoning: |-
  Okay, the user is a TA grading a sexual ethics exam and wants me to evaluate a student's answer. They've provided the question about whether consent is valid when deception about marital status occurs, and the student's response analyzing the three consent conditions. 

  First, I need to assess if the student correctly identified the key issue: deception invalidating consent through the information condition (iii). The student referenced Dougherty's deal-breaker account appropriately - that's strong. They also correctly noted coercion (ii) wasn't present since lies aren't force/threats, and competence (i) was satisfied. 

  Hmm, one subtle point: the student says "B's consent is invalid solely on the information condition" - but actually, when information condition fails, consent itself is invalid, not just the condition. That's a minor wording issue. Otherwise, the analysis is precise and shows good understanding. 

  For grading: This clearly meets A-level criteria. The answer is accurate, well-structured, and engages with course material (Dougherty). The one phrasing nitpick doesn't undermine the excellent core analysis. 

  Now drafting comments: I'll highlight what they did well (spot-on application of conditions, correct coercion distinction) while gently noting the "solely" phrasing could be clearer. The tone should be constructive since it's feedback for the student. 

  Word count check: My response needs to stay under 300 words with grade + bulleted comments. I'll keep praise concise and critique minimal since it's a strong answer.
answer: |-
