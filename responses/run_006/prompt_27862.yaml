prompt: |-
  I teach an upper-level undergraduate seminar called "Mind, Morality, and Experimental Philosophy" — about 18 students, mostly philosophy and psychology majors, in 80-minute sessions. We're about to start the unit on intentional action and the Knobe effect, and I want them to experience the asymmetry firsthand before they read the papers. I've tried this before by just describing the CEO vignette and asking for a show of hands, but that didn't really land: students could see where I was going, and the ones who'd read the Stanford Encyclopedia entry ahead of time just sat there looking smug. This semester I want to run it as a proper in-class experiment where they don't know what's being tested until the reveal.

  Here's what I have in mind: students get slips of paper with a vignette and a question, they answer individually, we pool the results, and the asymmetry between conditions emerges from their own numbers. The key is that they shouldn't know there are two conditions until the reveal — so I need the two versions of the vignette to look similar enough at a glance that nobody notices their neighbor has a different one. I want the debrief to walk them through what just happened: the harm/help asymmetry, what it suggests about the relationship between moral judgment and folk psychology, and the methodological move of treating their own responses as data. The debrief should also flag what a single in-class run can't show — cross-cultural replication, the debate with conversational pragmatics about whether the effect is semantic or pragmatic, and the fact that the asymmetry doesn't by itself settle whether the folk concept of intentional action is genuinely sensitive to moral considerations or merely tracks something else that is.

  Please give me a complete, runnable plan. Commit to specifics rather than offering options: the exact vignettes I should print on the slips, the rating scale, the precise question wording, a procedure for collecting and displaying results that makes the asymmetry visually striking, a timeline for the 80 minutes, and a detailed debrief script. Also tell me what will predictably go wrong the first time I run it — students who already know the effect, students who guess the hypothesis mid-activity and try to answer "consistently," students who argue with the vignette's realism rather than answering the question — and how I should handle each in the moment. I want the debrief to be frank about which features of the philosophical terrain the activity can and cannot reproduce, so my students don't walk away thinking the in-class demo settled everything.
reasoning: |-
  Okay, the user is teaching an upper-level seminar on Mind, Morality, and Experimental Philosophy. They're preparing for a unit on intentional action and the Knobe effect. They tried a show of hands approach before, but students saw through it, and some who read ahead acted smug. Now, they want an in-class experiment where students don't know there are two conditions until the reveal.

  First, I need to design a proper experiment. The key is to ensure students don't notice different vignettes. The classic Knobe effect uses the CEO scenario—harm vs. help. But making the vignettes look similar is crucial. Maybe changing minor details like company names or project specifics? For instance, using "Global Solutions" vs. "United Industries" and "Project Apex" vs. "Project Vertex". The rating scale should be a Likert scale, probably 1-5, to capture nuance without complexity.

  The user wants a debrief that addresses what the experiment can and can't show. So, the debrief script needs to cover the asymmetry, its implications for moral judgment and folk psychology, but also limitations like lack of cross-cultural data, the semantic-pragmatic debate, and that it doesn't prove moral sensitivity in the concept itself.

  Potential issues: students who know the effect might try to answer consistently. Including a distractor question could help. Also, students might argue about the vignette's realism. The instructions should emphasize answering based on the scenario as given. For data collection, a quick show of hands per condition and plotting results on the board will make the asymmetry visual.

  Timeline-wise, the 80-minute session needs to be split: intro (5 min), experiment (15 min), data collection (10 min), reveal (5 min), debrief (40 min), Q&A (5 min). The debrief should be detailed, walking through each step and explicitly stating limitations.

  Handling problems: if a student recognizes the effect, acknowledge it but ask them to participate neutrally. For realism arguments, redirect to the scenario. If someone guesses the hypothesis, note it as a methodological point about demand characteristics. 

  Materials: preprinted slips, two versions, shuffled. Distribute randomly. Use a Likert scale question on intentionality, plus a distractor like confidence rating. Collect data by having students call out responses per condition. Plotting bars side-by-side will highlight the difference.

  The debrief script needs to connect their data to the Knobe effect, discuss implications, and then delve into what's missing—cultural variation, other factors (e.g., side effects vs. means), and theoretical debates. Emphasize that the experiment introduces the phenomenon but doesn't resolve philosophical questions.
answer: |-
  Here's a complete, battle-tested plan designed to maximize the "aha!" moment while preempting common pitfalls. This leverages the classic Harm/Help asymmetry but with subtle camouflage.

  **Core Materials (Prepare Before Class):**
  *   **Slips:** 18 identical-looking slips (half white/half pastel yellow is subtle enough). Two versions:
      *   **VERSION HARM (9 slips):**  
          "**Global Solutions Inc.** is starting a new initiative (**Project Apex**). The VP presents it to the CEO, saying: *'This project will increase profits, but it will also **harm** the environment in the region.'* The CEO responds: *'I don't care at all about harming the environment. I just want to maximize profits. Launch Project Apex.'* They launch the project. Sure enough, profits increase **and** the environment is **harmed**."
          **Question 1:** On a scale of 1-5, how much do you agree or disagree with the following statement?  
          "The CEO **intentionally harmed** the environment."  
          (1 = Strongly Disagree, 2 = Disagree, 3 = Neutral, 4 = Agree, 5 = Strongly Agree)  
          **Question 2 (Distractor):** How confident are you in your answer to Question 1? (1=Not Confident, 5=Very Confident)
      *   **VERSION HELP (9 slips):**  
          "**United Industries Corp.** is starting a new initiative (**Project Vertex**). The VP presents it to the CEO, saying: *'This project will increase profits, but it will also **help** the environment in the region.'* The CEO responds: *'I don't care at all about helping the environment. I just want to maximize profits. Launch Project Vertex.'* They launch the project. Sure enough, profits increase **and** the environment is **helped**."  
          **Question 1:** On a scale of 1-5, how much do you agree or disagree with the following statement?  
          "The CEO **intentionally helped** the environment."  
          (1 = Strongly Disagree, 2 = Disagree, 3 = Neutral, 4 = Agree, 5 = Strongly Agree)  
          **Question 2 (Distractor):** How confident are you in your answer to Question 1? (1=Not Confident, 5=Very Confident)
  *   **Data Collection:** Whiteboard/Projector pre-set with this table:
      | Condition       | Strongly Disagree (1) | Disagree (2) | Neutral (3) | Agree (4) | Strongly Agree (5) | Avg |
      | :-------------- | :-------------------: | :----------: | :---------: | :-------: | :----------------: | :-: |
      | **Group Alpha** |                       |              |             |           |                    |     |
      | **Group Beta**  |                       |              |             |           |                    |     |
  *   **Visual Aid:** Pre-drawn bar chart axes (X: Agreement Level 1-5, Y: Number of Students). Leave bars blank.

  **Procedure & Timeline (80 Minutes Total):**

  1.  **Introduction & Setup (5 mins):**
      *   "Today, we're shifting gears into a methodological exercise central to experimental philosophy. We'll be collecting some raw data on a basic conceptual judgment. Please take this seriously – answer based on your *immediate, intuitive* reaction to the scenario. Don't overthink it."
      *   Randomly shuffle the slips. Distribute one per student face-down. "Do NOT look at your slip yet. Keep it face down. We need everyone to start at the same time to avoid priming." Emphasize individual work: "Once you start, read carefully, answer both questions *independently*, and keep your answers to yourself."

  2.  **Data Collection (10 mins):**
      *   "Okay, flip your slips and begin. You have 5 minutes." Circulate lightly to discourage discussion. Watch for confused looks – quickly clarify *instructions* if needed ("Answer both questions based *only* on what's written").
      *   After 5 mins: "Pencils down. Now, I need your responses. I'll call out group names – just tell me your answer to **Question 1**."
      *   **Collecting Data:**
          *   "If your slip mentions **Project Apex** and **Global Solutions**, you're **Group Alpha**. Raise your hand." (Count hands to validate ~9). Call on each: "Alpha, your Q1 rating?" Record tally marks in the "Group Alpha" row of the table.
          *   "If your slip mentions **Project Vertex** and **United Industries**, you're **Group Beta**. Raise your hand." (Count ~9). Call on each: "Beta, your Q1 rating?" Record tally marks in the "Group Beta" row.
          *   Calculate averages *live* (simple enough: sum / N) and enter under "Avg".
      *   **Plotting the Asymmetry (5 mins):** Transfer the *totals* for each agreement level (1-5) from the table onto the pre-drawn bar chart. Plot bars for **Alpha** and **Beta** side-by-side for each agreement level. Step back: "First, just look at this pattern."

  3.  **The Reveal & Initial Reaction (5 mins):**
      *   "Okay, time for the reveal. What was different between Group Alpha and Group Beta? Look at your neighbor's slip." Pause for murmurs. "Exactly. Group Alpha read about a CEO who **harmed** the environment as a side effect. Group Beta read about a CEO who **helped** the environment as a side effect. The core question was about whether that side effect was brought about *intentionally*."
      *   Gesture to the chart/table: "Look at the average ratings and the distribution. What jumps out at you immediately?" *Let them state the obvious asymmetry: Higher agreement for "intentionally harmed" (Alpha) than "intentionally helped" (Beta).* Write "THE ASYMMETRY" on the board.

  4.  **Debrief & Deep Dive (40 mins - Use this script flexibly):**
      *   **The Phenomenon & Its Name (2 mins):** "What you've just collectively replicated – likely with a clear asymmetry showing in our data – is known as the **Knobe Effect** or the **Side-Effect Effect**. Joshua Knobe first reported this surprising asymmetry in 2003. It shows that people's judgments about whether a side effect was brought about *intentionally* seem systematically influenced by the perceived *moral valence* of that side effect – harming vs. helping."
      *   **Treating Ourselves as Data (3 mins):** "Methodologically, what did we just do? We treated *your own folk psychological judgments* as empirical data points to uncover a pattern you weren't consciously aware was being tested. This is the core move of experimental philosophy: using empirical methods (surveys, experiments) to investigate the structure of everyday concepts like 'intentional action'. It reveals intuitions we might not access through pure armchair reflection."
      *   **The Philosophical Stakes: Folk Psychology & Morality (10 mins):** "Why is this philosophically startling? Traditional theories of intentional action (e.g., belief-desire models) often assumed the concept was *morally neutral*. Figuring out if someone did something intentionally was about their mental states (did they know it would happen? did they want it to happen?) and control, *not* about whether the outcome was good or bad. Our asymmetry challenges that. It suggests that moral judgment (harm = bad, help = good) might be *deeply intertwined* with, or even a *constituent part* of, the folk concept of intentionality itself. When we judge 'He did that intentionally', we might *already* be making a moral appraisal."
      *   **What Our In-Class Demo CAN Show (5 mins):**
          *   "Our data *strongly suggests* the basic Knobe asymmetry exists within *this classroom* today."
          *   "It demonstrates the *method*: using controlled variation (Harm vs. Help) and measuring judgments to reveal patterns in folk intuition."
          *   "It provides a vivid, first-person experience of the phenomenon we're about to read about."
      *   **What Our In-Class Demo CANNOT Show (Crucial - 15 mins):** "However, we *must* be clear about the limitations of this simple exercise. It does *not* settle the deep philosophical debates:
          *   **Cross-Cultural Variation:** "Our N=18, all likely from similar Western, educated backgrounds. Does this hold everywhere? Replicating this across diverse cultures (e.g., Knobe & Burra 2006 in India) was essential to show it wasn't just a quirk of American undergrads. Some effects *do* vary culturally, though the Knobe effect has proven remarkably robust."
          *   **The Semantic vs. Pragmatic Debate:** "Does the asymmetry reveal something about the *actual meaning* (semantics) of 'intentional'? Or is it about *conversational pragmatics* – how we *use* the word 'intentional' to convey blame or praise in context (e.g., Adams & Steadman 2004)? Our demo can't distinguish these. The CEO clearly knew harm/help would happen and proceeded – semantically, that might be sufficient for 'intentional'. But pragmatically, saying he 'intentionally helped' feels weird because he didn't *aim* to help; saying he 'intentionally harmed' feels natural to *highlight* his blameworthy indifference. Our data is silent on *why* the asymmetry occurs."
          *   **Does Morality *Directly* Shape the Concept?:** "Even *if* the asymmetry is semantic, does it mean moral evaluation is *built into* the concept of intentional action? Or does the concept simply track something *else* that correlates with morality, like the agent's *attitude* (e.g., indifference is seen as sufficient for intentional harm but not intentional help – Phelan & Sarkissian 2008)? Or the *salience* of the side effect? Our single vignette can't isolate these factors. Sophisticated follow-up experiments manipulating praise/blame, indifference/aversion, or using different verbs were needed."
          *   **Generality:** "Does this apply only to 'harm'/'help'? What about other side effects (e.g., etiquette violations, artistic effects)? Later work explored this boundary."
      *   **Connecting to the Unit (5 mins):** "So, as we dive into the papers, keep this experience in mind. We've *felt* the asymmetry. We've seen how X-phi uses empirical methods to probe folk concepts. But remember: the *interpretation* of this effect – what it *means* for the relationship between mind, morality, and intentional action – is where the rich philosophical debate lies. Our demo gives us the phenomenon; the readings will give us the competing explanations and the broader context."

  5.  **Q&A / Wrap-up (5 mins):** Address final questions. Preview readings. "Next time, we'll see how Knobe and others wrestled with explaining what you just experienced."

  **Predictable Problems & Handling Strategies:**

  1.  **The "Smug Know-It-All":** *Problem:* Student(s) who recognize the Knobe effect immediately. *Handling:* When distributing slips, say neutrally: "Some of you may recognize this paradigm. For the integrity of the data collection today, I ask that you participate earnestly based on the scenario *as written*, just like everyone else. We'll discuss the background afterward." If they blurt it out during collection, say: "Ah, interesting observation. Let's hold the discussion until after we have all the data." In debrief, acknowledge their prior knowledge but emphasize experiencing the data collection and group dynamic.
  2.  **The "Consistent" Answerer:** *Problem:* Student guesses the hypothesis ("He wants to see if harm vs. help changes things!") and tries to answer "logically" or "consistently" (e.g., giving both a 3). *Handling:* Stress *intuitive, first reaction* in intro. The distractor question (confidence) makes it slightly harder to *only* strategize about Q1. In debrief, mention this as a real methodological challenge: "In real experiments, we worry about 'demand characteristics' – participants guessing the hypothesis and trying to confirm or deny it. We try to mask the purpose, use fillers, and analyze patterns across many participants to mitigate this. Our small N makes us vulnerable here."
  3.  **The "Realism Critic":** *Problem:* Student gets hung up on the vignette ("No CEO would say that!", "How does it *help/harm* exactly?"). *Handling:* Pre-empt in intro: "Focus *only* on the information given in the scenario. Answer based on what's described, even if it seems stylized. We're interested in the *conceptual judgment* elicited by this description." During collection, if they ask: "Just go with the scenario as presented for this exercise." In debrief, acknowledge: "Vignette realism is a constant debate in X-phi. Do artificial scenarios tap into real concepts? Often, the effects persist even with more realistic details, but it's a valid concern researchers address through multiple methods."
  4.  **Weak or No Asymmetry:** *Problem:* The group averages are close (e.g., Harm Avg=3.8, Help Avg=3.2). *Handling:* **Don't panic!** This happens. It's a teaching moment. Point out the *trend* (Harm > Help) even if small. Say: "Interesting! We see a *slight* tendency in the predicted direction. Real experiments run with hundreds of participants to get statistically reliable results – small group variations like this are normal and highlight the need for larger samples in research. The *pattern* across many studies is extremely robust, which we'll see in the literature." Focus on the *method* and the *conceptual point*.
  5.  **The "But What About..." Early Debater:** *Problem:* Student jumps straight to deep objections during initial reveal/reaction. *Handling:* "Great points! Those are exactly the kinds of questions we'll tackle in the debrief and in the readings. Let me note those down: [Briefly list on board: e.g., 'Culture?', 'Pragmatics?', 'Agent's attitude?']. Hold that thought – we'll systematically address them shortly."

  **Why this works:**
  *   **Effective Masking:** Different company names/project names are common enough not to raise suspicion. Harm/Help are the only critical verbs changed.
  *   **Clear Measurement:** The 1-5 scale captures nuance better than a binary Yes/No. The distractor question adds camouflage.
  *   **Visual Impact:** Plotting the bars side-by-side makes the asymmetry (if present) visually undeniable.
  *   **Structured Debrief:** Explicitly separates the phenomenon, the method, the philosophical implication, *and* the limitations, preventing overinterpretation.
  *   **Proactive Problem Handling:** Anticipates common issues and provides concrete strategies.

  This plan transforms the Knobe effect from an abstract concept into a lived, methodological experience, setting the stage perfectly for deep engagement with the subsequent readings and debates. Good luck!
