answer: |-
  ## Teaching Plan: Bertrand's Paradox & the Principle of Indifference (75 min)

  **Core Goal:** Show that continuous cases expose a *fundamental ambiguity* in applying the Principle of Indifference (PoI), challenging its coherence as a rule for complete ignorance in a way discrete cases do not. The paradox reveals that PoI is *incomplete without a privileged parameterization or "correct" description* of the possibility space.

  **Key Sequence & Why:**
  1.  **Reactivate Discrete PoI (10 min):** Quick recap using dice/cards. *Why?* Ground the lecture, show PoI's *apparent* clarity when possibilities are *naturally discrete and individuated*. Establish PoI as the tool for ignorance.
  2.  **Transition to Continuous: The Challenge (5 min):** Pose: "How do we apply PoI when possibilities are *continuous* (e.g., a point on a line, a chord in a circle)?" Highlight: We need to describe the space via parameters (e.g., length, angle, position). *Why?* Signal the shift and the new problem: choosing *how* to describe the space isn't obvious.
  3.  **Present Bertrand's Problem (5 min):** State: "Consider random chords of a unit circle. What's the probability a random chord is longer than the side of the inscribed equilateral triangle?" Sketch circle, inscribed triangle, chord length `√3`. *Why?* Concrete, visual, simple question. The "random chord" phrasing invokes PoI naturally.
  4.  **Worked Example: Three Valid Methods (25 min):** (***The Core Carrying the Lecture***)
      *   **Method 1 (Fixed Endpoint):** Fix one chord endpoint (A), parameterize by the *uniform random angle θ* of the other endpoint (B) relative to the tangent at A. Show P(longer) = **1/3**.
      *   **Method 2 (Midpoint Radius):** Parameterize chord by its *uniform random distance r* from the center (0 ≤ r ≤ 1). Show P(longer) = **1/2**.
      *   **Method 3 (Midpoint Area):** Parameterize chord by its *uniform random midpoint position (x,y)* anywhere *inside* the circle. Show P(longer) = **1/4**.
      *   *Boardwork:* Pre-draw large circles. Calculate each probability clearly, emphasizing valid uniform distributions over different parameters. **Crucially display the results (1/3, 1/2, 1/4) side-by-side.** *Why?* Demonstrates the paradox starkly: Same problem, different *equally natural* parameterizations, different *valid* probabilities via PoI.
  5.  **The Paradox & Interpretive Crux (20 min):**
      *   **State the Paradox:** PoI, applied consistently within each method, yields incompatible results for the same event under ignorance.
      *   **Address Interpretive Crux (Lean towards Incompleteness):**
          *   *Inconsistency View:* PoI leads to logical contradiction here; it's broken.
          *   ***Incompleteness View (Emphasize):*** PoI *requires* a privileged description of the possibilities ("correct" parameterization) to yield a unique answer. But "random chord" doesn't specify this. PoI alone is insufficient; it needs supplementation (e.g., a physical random process defining "random"). *This is the qualitative leap from discrete cases.*
      *   *Why this focus?* It directly addresses the core philosophical problem: PoI isn't self-sufficient for continuous spaces. "Ignorance" alone doesn't pick the right way to apply it.
  6.  **Addressing Misconceptions (Timed within Sequence):**
      *   *Pre-Paradox:* "PoI is straightforward like in dice." *Headed off by Step 2 & the stark results of Step 4.*
      *   *During Methods:* "One method must be *wrong*." *Headed off by showing each method's uniformity assumption is mathematically valid and *physically plausible* for some process (e.g., Method 1: spinning a pointer; Method 2: throwing a stick; Method 3: throwing a dart).*
      *   *Post-Paradox:* "We just need more *information* about what 'random' means." *Acknowledge this is correct, but emphasize this *is* the point!* PoI *for complete ignorance* fails uniquely here because "random chord" underdetermines the parameterization. Discrete cases don't have this underdetermination. Also: "The real probability is one of them, we just don't know which." *Counter:* There is no "real" probability under pure ignorance; PoI was supposed to define it and fails uniquely.
      *   *Post-Paradox:* "This is just a math trick." *Counter:* The math in each method is sound. The problem is conceptual: what constitutes an "equally possible" *description* in a continuum?
  7.  **What to Omit & State Why:**
      *   Detailed derivations beyond the core calculations (assume they can follow or provide handout).
      *   Generalizations to other paradoxes (Borel-Kolmogorov, wine/water). *Say:* "Other paradoxes exist, but Bertrand's is the clearest illustration of the *core* problem for PoI in continua."
      *   Deep dive into objective Bayesian responses (e.g., Jeffreys priors). *Say:* "Solutions exist but require adding *more* structure (invariance principles), showing PoI *alone* is insufficient."
      *   Frequentist "solutions" (defining a physical experiment). *Say:* "Specifying a physical process fixes the parameterization, bypassing the PoI ambiguity, but doesn't solve how PoI applies under *pure ignorance*."
  8.  **Check for Understanding (5 min):**
      *   **Question:** "In discrete cases like dice, applying PoI seems straightforward: we count the distinct, symmetric faces. Why does the continuous chord case present a *qualitatively different* challenge for PoI, beyond just being harder to calculate?"
      *   **Target Response:** They must articulate that continuous spaces lack naturally individuated, symmetric fundamental possibilities. Applying PoI *requires choosing a way to parameterize the space*, and different, equally plausible ways to do this lead to different probability assignments for the *same event*. PoI alone doesn't tell you *which* parameterization reflects the "true" possibilities under ignorance. (Discrete cases don't have this parameterization ambiguity; the possibilities are given.)

  **Timing Buffer (5 min):** Reserve for questions during methods or deeper discussion of the crux.

  **Board Plan:**
  *   **Left:** Discrete PoI Recap (Dice/Card example), PoI Statement.
  *   **Center:** Bertrand's Problem Statement, Circle Diagram (with inscribed triangle & `√3` chord).
  *   **Right:** Columns for each Method (Sketch, Parameter, Key Calc Step, Result: 1/3, 1/2, 1/4 clearly boxed).
  *   **Bottom:** Key Conclusions: "Same Event -> Different Probabilities under PoI", "PoI requires a privileged parameterization for uniqueness", "PoI is incomplete under ignorance for continuous spaces".
