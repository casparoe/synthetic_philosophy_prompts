prompt: |-
  I'm in a seminar on early modern political thought, and we've been reading Pascal's Pensées. One of my classmates keeps invoking Pascal's line that "justice without force is powerless; force without justice is tyrannical" to dismiss any political proposal that doesn't back moral claims with coercive power — and also to dismiss any exercise of power that lacks moral justification. The line is treated as a deep insight that cuts through political naivete, but I can't tell whether it's making a trivial point about enforcement, a cynical claim about the conventionality of justice, or a substantive normative principle about legitimate authority. Can you lay out the distinct precise claims this sentence could be expressing, from the near-tautology to the radical thesis? For each reading, say: (a) whether it's plausible, (b) what argumentative work it actually does, and (c) which reading Pascal himself most likely intended, given the broader context of the Pensées.
