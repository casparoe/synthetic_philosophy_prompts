answer: |-
  ## Joint Statement on Moral Uncertainty: MEC & MFT Proponents

  **(1) Points of Agreement:**
  1.  **Mind-Independent Moral Truth Exists:** We agree that moral facts are objective and mind-independent. Morality is not merely a matter of personal preference or social convention.
  2.  **Structure of Disagreement:** Reasonable, intelligent, and well-informed individuals can persistently disagree fundamentally about the correct moral theory due to (a) the complexity and underdetermination of moral evidence, (b) incommensurable foundational intuitions/commitments, and (c) the difficulty of fully resolving deep conceptual disagreements.
  3.  **Moral Uncertainty is Real & Significant:** Agents often face genuine uncertainty about which fundamental moral theory is true, not merely uncertainty about applying a known theory to complex empirical facts. This uncertainty is a distinct and important phenomenon for practical reasoning.
  4.  **Moral Uncertainty ≠ Moral Subjectivism/Relativism:** Acknowledging moral uncertainty does *not* entail that all moral views are equally valid, that "anything goes," or that morality is subjective or relative. Our disagreement occurs *within* a shared commitment to objective moral truth.
  5.  **Moral Uncertainty ≠ Factual Uncertainty:** The nature of uncertainty about fundamental moral *principles* differs qualitatively from uncertainty about empirical *facts*. Resolving moral uncertainty involves distinct challenges, including potential incomparability between theories.
  6.  **Rejection of Universal Skeptical Suspension:** Moral uncertainty does *not* automatically require suspending all moral judgment or action. Agents must still act, and both approaches offer frameworks for doing so under uncertainty.
  7.  **The "Most Credible" Theory is Central:** Both approaches recognize the fundamental importance of the credence (subjective probability) an agent assigns to competing moral theories. The theory deemed most credible plays a crucial role for both MFT and MEC.
  8.  **Internalism about Rationality:** We agree that the requirements of rationality under moral uncertainty are internal to the agent's own epistemic state (their credences and, for MEC, their value comparisons). We are not debating what an omniscient observer would prescribe.

  **(2) Points of Disagreement:**

  | Point of Divergence                                                                                                  | MEC Proponent Position                                                                                                                                 | MFT Proponent Position                                                                                                                                 |
  | :------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **What is the rationally required response to conflicting moral prescriptions under uncertainty?**                    | "Rationality requires maximizing the *expected choiceworthiness* of one's actions, weighting the choiceworthiness assigned by each theory by the probability that theory is true." | "Rationality requires acting *solely* according to the prescriptions of the single moral theory one judges to be *most credible* (probable), regardless of what less probable theories demand." |
  | **What is the normative significance of less probable theories?**                                                     | "Less probable theories contribute to the overall rational assessment of an action based on their probability and the *magnitude* of their evaluation of it." | "Less probable theories have *no direct normative weight* in determining what the agent rationally ought to do. Their significance is purely epistemic (informing credences)." |
  | **Is intertheoretic comparison of choiceworthiness levels possible and necessary for rational action under uncertainty? (*Internal MEC Note*)** | ***(Split)*** **Comparability Required:** "Meaningful MEC calculation fundamentally requires a method for comparing degrees of choiceworthiness *across* different theories (e.g., vNM utility, range normalization)." <br> **Comparability Optional:** "MEC can be applied using only *intra*-theoretic comparisons of choiceworthiness within each theory, combined with credences, to generate a partial ordering or identify robustly best options." | "Intertheoretic comparisons of choiceworthiness levels are either **impossible** (due to fundamental incommensurability) or, where attempted, **arbitrary** and devoid of normative force. Relying on them is irrational." |
  | **Is deference to the most probable theory mandatory?**                                                              | "Deference to the most probable theory is *not* rationally mandatory. Rationality can sometimes demand acting against the prescription of the most probable theory if sufficiently disvalued by sufficiently probable alternatives." | "Deference to the most probable theory *is* rationally mandatory. Failing to follow the prescription of the theory one judges most likely to be true constitutes a failure of practical rationality." |
  | **What concept of "rational choice under uncertainty" is primary?**                                                  | "The primary concept is *rational optimization* under conditions of normative uncertainty, analogous to decision-making under empirical uncertainty." | "The primary concept is *rational deference* to the best available normative authority (i.e., the most credible theory)." |

  **(3) Cruxes and Predictions:**

  1.  **Crux: Are meaningful, non-arbitrary intertheoretic comparisons of choiceworthiness levels (degrees of moral value/duty-strength) possible?**
      *   **MEC Prediction (Comparability Required Camp):** Yes, meaningful comparisons *are* possible, either through structural features of theories (e.g., vNM axioms revealing cardinal scales), conceptual analysis of "better/worse," or pragmatic normalization procedures that capture genuine normative weight. Resolving this crux affirmatively is necessary for MEC to be feasible as typically conceived.
      *   **MEC Prediction (Comparability Optional Camp):** Meaningful comparisons *across* theories are *not* generally possible or required. Rational action under uncertainty can be guided by MEC using only *intra*-theoretic ordinal (or cardinal) rankings combined with credences to find robustly best options or establish dominance, avoiding cross-theory comparisons.
      *   **MFT Prediction:** No, meaningful intertheoretic comparisons are **impossible**. The purported scales of different theories are fundamentally incommensurable. Any attempt to compare them introduces arbitrary elements devoid of normative significance. *Resolution Impact:* Affirmative resolution would undermine a core MFT objection to standard MEC. Negative resolution would undermine standard MEC but potentially support the "Comparability Optional" MEC approach or strengthen MFT.

  2.  **Crux: Does practical rationality intrinsically demand deference to the single most credible normative authority (theory) when such authorities conflict?**
      *   **MEC Prediction:** No. Rationality demands optimizing expected normative value, which inherently incorporates the *aggregated* verdicts of all plausible theories weighted by credibility. Deference is only optimal if the most probable theory's verdict dominates or is robust across alternatives. Rationality can *require* deviating from the most probable theory.
      *   **MFT Prediction:** Yes. Rationality fundamentally consists in aligning one's actions with the normative judgment one takes to be *most likely correct*. Ignoring the verdict of the theory you deem most credible in favor of an aggregate involving theories you judge *less* credible is irrational, akin to letting a minority opinion override the most probable truth. *Resolution Impact:* Affirmative resolution would strongly favor MFT. Negative resolution would remove a foundational MFT justification and support the MEC optimization framework.

  3.  **Crux: Does the structure of moral theories generally allow for the type of cardinal ranking (within a theory) necessary for non-trivial MEC calculations, even absent intertheoretic comparisons?**
      *   **MEC Prediction (Comparability Optional Camp):** Yes. Many plausible moral theories (e.g., utilitarianism, many forms of deontology with scalar features, virtue ethics with flourishing metrics) naturally admit or can be coherently interpreted as supporting cardinal intra-theoretic choiceworthiness rankings, allowing meaningful expected choiceworthiness calculations *within* the constraints of each theory before credence weighting.
      *   **MFT Prediction / Skeptical View:** Often No. Many plausible moral theories (e.g., strict deontological constraints, certain rights-based views) are fundamentally ordinal or involve absolute prohibitions/requirements that resist meaningful cardinal scaling *even within the theory*, making robust intra-theoretic MEC calculations impossible or trivial. *Resolution Impact:* Affirmative resolution supports the viability of "Comparability Optional" MEC. Negative resolution severely limits the applicability of *any* MEC approach and strengthens the case for MFT as the only coherent alternative.
