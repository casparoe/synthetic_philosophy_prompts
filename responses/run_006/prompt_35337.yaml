  Ah, the meat is in their second layer: the rationality disconnect. The user nails it - critics (like Scheffler or early Laudan) really did demand algorithmic rationality, while Kuhnians see rationality as value-guided judgment. This isn't contested; even critics now concede scientific rationality isn't purely algorithmic. The debate evolved into whether Kuhnian values suffice.

  But here's where it gets murky: the user asks if progress is possible. That's tricky. Recent work on partial reference (Sankey) and epistemic values (Douglas) offers genuine advances, but whether it satisfies critics... doubtful. The Bayesian attempts (Earman) failed to convince Kuhnians. So perhaps the user's pessimism has merit - it's less stuck than transformed into questions about underdetermination and values.

