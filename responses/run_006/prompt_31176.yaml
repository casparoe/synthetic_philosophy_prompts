prompt: |-
  I've come around to illusionism about phenomenal consciousness — the strong version, not the weak one: there is no phenomenal consciousness in the usual sense, there's nothing it is like to be me, and the apparent qualitative residue left over after all the functional, representational, and cognitive facts are in is a systematic introspective error rather than a real property I'm detecting. I want to stress-test this. Not the standard Mary's-room or explanatory-gap moves — I want the defeaters that actually bite. Give me a numbered list of exactly five items, each a sentence or two, no introduction or conclusion: the five considerations that should most move me away from the view, ranked from fatal to merely awkward. For each, say what would have to be true of the world (or our evidence) for it to land, and whether a committed illusionist would concede it as a genuine cost or dismiss it. Make the fifth item your honest take on whether illusionism has been qualified into unfalsifiability, and whether that's a problem for a view like this.
