prompt: |-
  I'm trying to figure out what I actually think about using AI at work, going by my gut on cases. I keep going back and forth and I think there's some principle I'm tracking but I can't articulate it.

  Here are my verdicts on a bunch of situations:

  1. Using Copilot to autocomplete a repetitive getter/setter or a loop pattern I've written a thousand times. Fine, no problem.

  2. Asking ChatGPT to explain a concept I'm fuzzy on (like the CAP theorem tradeoffs) and then using that understanding to make a design decision. Fine, this is basically like reading a really good StackOverflow answer.

  3. Copy-pasting a regex from ChatGPT that I don't really understand, but I test it and it works. Leaning not fine, though I do it sometimes.

  4. Using an AI coding assistant to write an entire feature, reviewing each chunk as I go, understanding each chunk, and shipping it. Fine.

  5. Same as 4, but three months later I have to extend the feature and I realize I can't really reason about the system as a whole without the AI again. The original use was fine at the time, but now I feel like something went wrong.

  6. I'm a senior dev supposed to be the expert on our payment module. I use AI to fix a bug in it, and the AI's explanation teaches me something I didn't know about our own code. Fine.

  7. Same situation, but the AI's fix works, I don't fully understand why, and I approve the PR anyway. Not fine.

  8. I'm learning Rust. I use AI heavily to get past the borrow checker on a personal project, and I tell myself I'm learning by reading the AI's explanations. Six months later, I still can't write Rust without AI assistance. I was fooling myself. Not fine.

  9. I use AI to write all my Jira ticket updates and status reports. Fine, honestly. That's just formatting thoughts I already have.

  10. I use AI to summarize a bunch of design docs I was supposed to read before an architecture review, and I go into the review relying on the summaries. Not fine.

  11. A junior dev on my team uses AI for almost everything and ships code that works, but when I ask them to walk me through why they made a particular design choice, they can't. They're not fine, but I'm not sure if the problem is the AI use itself or something else.

  The thing I keep getting stuck on: cases 4 and 5 have identical behavior at the time of use, but my verdict changes when I look back later. That makes me think my principle has to be about whether understanding is preserved over time, not just about the moment of use. But then case 9 (Jira updates) doesn't involve understanding at all and I'm fine with it, so it can't just be "any use that doesn't build understanding is bad."

  Is there a principle that gets as many of these as possible, and which of my verdicts does it force me to overturn? Also, what does the principle say about a case I haven't listed: using AI to write unit tests for code I wrote myself?
reasoning: |-
  Okay, let's tackle this user's dilemma. They're struggling to articulate a consistent principle behind their gut reactions to various AI use cases at work. The key is to find a unifying theme that explains their approvals and disapprovals across all scenarios, especially the tricky ones like 4 and 5 where time reveals a problem.

  First, looking at their verdicts: they're fine with AI as a productivity tool for repetitive tasks (1), learning aids (2,6), and non-technical writing (9). But they reject uses that bypass understanding (3,7,10) or create dependency (5,8). The pain point is case 4 vs 5 - same initial action, different later outcomes. This suggests the principle isn't just about immediate understanding but sustainable capability.

  Hmm, the user's frustration with case 5 is revealing. When they couldn't extend the feature months later, it exposed that the initial "understanding" was shallow. So maybe the real issue is whether AI use builds or erodes their ability to function independently over time. That would explain why Jira updates (9) are fine - no future capability needed there.

  For the junior dev in case 11, the problem isn't the AI itself but that it's masking a lack of foundational understanding. The user intuitively knows this is dangerous because the junior isn't developing necessary skills. Similarly, using AI to summarize design docs (10) backfires because it undermines the required depth for architectural decisions.

  The unit test question is interesting. If they write tests themselves, they reinforce their understanding of the code's behavior. Having AI generate tests could be acceptable if they rigorously validate them, but risky if they just trust the output. The principle would demand they maintain ownership of the testing logic.

  Wait - what about case 6 vs 7? Both involve fixes, but only 6 is fine because they learn from the AI's explanation. This confirms that knowledge transfer is essential. The user's principle seems to revolve around agency: does this AI use enhance my human judgment or outsource it?

  The more I think about it, "sustainable competence" covers most cases. It's not that AI can't be used for complex tasks (4), but that it must leave the user more capable, not less. Cases where the user feels "something went wrong" (5,8) are those where competence degraded over time. 

  For the unit test scenario, the verdict would hinge on whether they're actively engaging with the tests to deepen their understanding versus treating them as black boxes. The principle would approve cautious use with verification, but reject blind acceptance.
answer: |-
  Your gut reactions reveal a consistent principle: **AI use is acceptable when it preserves or enhances *human agency, judgment, and competence* over time.** It fails when it erodes your ability to reason, make decisions, or retain ownership of critical work.

  ### Core Principle Breakdown:
  1. **Agency Preservation**  
     AI must act as a *tool you control*, not a crutch that controls you. You should always be the driver, not a passenger.
  2. **Judgment Preservation**  
     AI-generated outputs require *meaningful human validation*. You must retain the ability to critically evaluate results.
  3. **Competence Preservation**  
     AI should *augment your skills* without preventing their development or causing atrophy. Understanding must persist beyond the immediate task.

  ### Your Cases Analyzed:
  | **Case** | **Your Verdict** | **Applies Principle?** | **Why** |
  |----------|------------------|------------------------|---------|
  | 1 (Autocomplete) | ✅ Fine | Yes | Saves time, preserves understanding |
  | 2 (Concept Explain) | ✅ Fine | Yes | Builds competence via learning |
  | 3 (Regex Copy/Paste) | ❌ Not fine | Yes | Bypasses judgment/understanding |
  | 4 (Feature w/ Review) | ✅ Fine | **⚠️ Partial** | Immediate review ≠ sustained competence |
  | 5 (Later Incomprehension) | ❌ Not fine | Yes | Competence decay revealed |
  | 6 (Learn from AI Fix) | ✅ Fine | Yes | Enhances competence |
  | 7 (Blind Fix Approval) | ❌ Not fine | Yes | Lacks judgment/validation |
  | 8 (Rust Dependency) | ❌ Not fine | Yes | Prevents competence development |
  | 9 (Jira Updates) | ✅ Fine | Yes | Non-critical, agency preserved |
  | 10 (Design Doc Summary) | ❌ Not fine | Yes | Erodes judgment in critical context |
  | 11 (Junior Dev) | ❌ Not fine | Yes | Competence not developing |

  ### The Conflict in Cases 4 & 5:
  - **Case 4** *seemed* fine initially because you validated understanding *at that moment*.  
  - **Case 5** exposed the flaw: **Competence wasn't internalized**. The AI acted as a "cognitive prosthesis" – you never truly owned the knowledge.  
  - **The Principle Demands**: If using AI for complex work, you must *stress-test your own understanding* for longevity (e.g., "Could I rebuild this without AI?").

  ### Overturned Verdict:
  - **Case 4 must be revised to ❌ Not fine** under your principle.  
    **Why**: The eventual failure in Case 5 proves that "reviewing chunks" doesn't guarantee sustained competence. True ownership requires deeper internalization than step-by-step validation provides.

  ### Unit Test Scenario:
  **Using AI to write tests for your code:**  
  - **✅ Acceptable IF**:  
    - You rigorously validate every test case  
    - You understand *why* tests cover specific edge cases  
    - Tests serve as documentation you can explain  
  - **❌ Unacceptable IF**:  
    - You can't justify test coverage  
    - Tests pass but don't reflect real-world usage  
    - You couldn’t write equivalent tests yourself  

  ### The "Sustainable Competence" Framework:
  Your principle suggests this decision tree:  
  ```mermaid
  graph TD
      A[Use AI?] --> B{Critical for core competence?}
      B -->|Yes| C[Preserve agency?]
      B -->|No| D[✅ Acceptable]
      C -->|Yes| E[Validate understanding?]
      C -->|No| F[❌ Reject]
      E -->|Yes & Retained long-term| G[✅ Acceptable]
      E -->|No| H[❌ Reject]
  ```

  ### Key Takeaway:
  **AI should compress learning curves, not eliminate them.** Your discomfort with Cases 3,5,7,8,10, and 11 stems from AI circumventing the *effort* required to build durable expertise. Where shortcuts risk competence atrophy (coding, system design, learning), validation isn’t enough—you need active internalization. For non-core tasks (Jira tickets), efficiency gains are harmless.

  This principle explains 10/11 cases and forces you to reject Case 4. It prioritizes *you* as the resilient expert, not the AI.
