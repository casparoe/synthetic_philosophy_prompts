  Just got back from a long arguement with a mate about laws of nature, and I realised I don't actually have a settled view myself. So here's what I want from you: your credence that the laws of nature are nothing over and above the Humean mosaic — the whole distribution of local particular facts — so there are no primitive governing laws or necessary connections, and something like the best-system account is right. I don't want "it depends on your metaphysics"; I want a number and a decomposition. Break it into at least these bits: (i) whether the best-system account can genuinely distinguish laws from cosmic accidents, (ii) how damaging the explanatory circularity worry is for governing laws, (iii) how much weight to give the way actual scientific practice treats laws as if they explain and constrain, and (iv) how plausible it is that possible worlds are just recombinations of the actual mosaic. Put a rough probability on each, show how they combine into your overall figure, then tell me which sub-question your final number is most sensitive to and what would shift it most. And can you answer in British English?
