prompt: |-
  I'm an undergraduate in an upper-division metaethics seminar, and we're working through non-cognitivism and the Frege–Geach problem this week. A handout my TA distributed summarizes the dialectic as follows:

  "Expressivism is the view that moral judgments are not beliefs but expressions of non-cognitive attitudes, paradigmatically approval and disapproval; 'murder is wrong' is roughly equivalent to 'boo to murder.' The Frege–Geach problem is that moral sentences also occur in embedded contexts, as in 'If murder is wrong, then getting your little brother to murder is wrong,' where the speaker plainly is not expressing disapproval of murder, and so expressivism cannot explain what the sentence means there. The deeper difficulty is that valid inference, as in modus ponens, requires truth-apt premises; since expressivist moral judgments are neither true nor false, expressivism makes moral reasoning impossible. Expressivists have replied by saying that moral terms have both descriptive and prescriptive meaning, but this reply is generally regarded as abandoning the view, because once descriptive meaning is admitted moral judgments become beliefs again and the position collapses into a kind of subjectivism."

  I have a vague sense that this runs together a few different positions and maybe overstates the force of the problem, but I don't trust my own reading enough to pin down where. Could you go through the summary sentence by sentence and tell me which parts a careful expressivist would accept, which are simplifications, and which are inaccurate or unfair? I'd particularly like to know whether the conclusion that expressivism "makes moral reasoning impossible" follows from anything true in the summary, and whether the descriptive-plus-prescriptive reply is really just an abandonment of expressivism.
reasoning: |-
  Okay, the user is an undergraduate in an upper-division metaethics seminar dealing with expressivism and the Frege-Geach problem. They received a TA's handout summarizing the dialectic but feel it might oversimplify or misrepresent expressivism. They want a detailed breakdown of each part of the summary, pointing out where it's accurate, oversimplified, or unfair. They're particularly concerned about whether expressivism truly makes moral reasoning impossible and if the descriptive-plus-prescriptive solution abandons expressivism.

  First, I need to recall the core ideas of expressivism and the Frege-Geach problem. Expressivism says moral judgments express non-cognitive attitudes like approval, not beliefs that are true/false. Frege-Geach points out that moral sentences in embedded contexts (like conditionals) don't express attitudes, so expressivism struggles to explain their meaning and how moral arguments work.

  Looking at the TA's summary: The initial characterization of expressivism is mostly accurate but oversimplifies by reducing it to "boo/hurrah." Modern expressivists like Blackburn and Gibbard use more sophisticated frameworks. The part about embedded contexts is correct—expressivism's challenge is explaining attitude expressions in non-assertive contexts. The deeper issue about truth-aptness and valid inference is where things get tricky. The claim that expressivism makes moral reasoning impossible is too strong. Neo-expressivists have developed quasi-realism to handle truth-aptness without collapsing into subjectivism.

  The user’s hidden needs might include clarifying misunderstandings before class discussions or writing papers. They might seek reassurance that expressivism isn't easily dismissed, as their seminar might present it as defeated. They could also want nuanced arguments to engage critically with the material.

  For the descriptive-plus-prescriptive point: The summary claims this abandons expressivism, but hybrid expressivists (like Ridge) combine both elements without collapsing. Distinguishing between pure and hybrid expressivism is key here. The user might need this distinction to avoid conflating different positions.

  I should address each part of the summary step by step, referencing modern developments. Emphasize that while Frege-Geach is a serious challenge, expressivism has evolved, and declaring it impossible is unfair. Highlight quasi-realism's solutions and hybrid theories as valid responses that maintain expressivism's core. Stress that the TA's summary reflects an older, simpler view but current discourse is more complex. This helps the user grasp the ongoing debate and defend expressivism's viability in their seminar.
answer: |-
  This is an excellent question, and your intuition is spot-on. While the TA's summary captures the *core* challenge (Frege-Geach) and a *common* criticism, it significantly oversimplifies the expressivist landscape and understates the sophistication of contemporary responses. Let's break it down sentence by sentence:

  1.  **"Expressivism is the view that moral judgments are not beliefs but expressions of non-cognitive attitudes, paradigmatically approval and disapproval; 'murder is wrong' is roughly equivalent to 'boo to murder.'"**
      *   **Careful Expressivist Would Accept:** The core definition is correct. Expressivism denies that moral judgments are fundamentally *beliefs* representing states of affairs that are true or false. They are expressions of non-cognitive (conative, emotive, planning) attitudes.
      *   **Simplification/Oversimplification:** The "boo/hurrah" model is a *caricature* of early, simplistic emotivism (Ayer, Stevenson). Contemporary expressivists (Blackburn, Gibbard) offer much more sophisticated accounts. "Boo" is a placeholder for complex attitudes like disapproval, commitment to norms, or plans. The meaning isn't *just* an ejaculation; it involves complex dispositions to act, reason, and feel. They wouldn't say it's *equivalent* to "boo murder," but that "boo murder" highlights the *primary function* of the utterance.
      *   **Accuracy:** Captures the fundamental contrast with cognitivism.

  2.  **"The Frege–Geach problem is that moral sentences also occur in embedded contexts, as in 'If murder is wrong, then getting your little brother to murder is wrong,' where the speaker plainly is not expressing disapproval of murder, and so expressivism cannot explain what the sentence means there."**
      *   **Careful Expressivist Would Accept:** This is a *perfectly accurate* statement of the core **problem**. Embedded contexts (conditionals, negations, questions, belief reports) are the central challenge. The speaker uttering the conditional isn't expressing disapproval of murder *at the moment of utterance*. The problem is explaining the *meaning* of the embedded clause "murder is wrong" within the larger sentence and how it contributes to the meaning and logic of the whole.
      *   **Accuracy:** This is the heart of the Frege-Geach problem, correctly stated.

  3.  **"The deeper difficulty is that valid inference, as in modus ponens, requires truth-apt premises; since expressivist moral judgments are neither true nor false, expressivism makes moral reasoning impossible."**
      *   **Careful Expressivist Would Accept:** The challenge of explaining logical validity (like modus ponens) involving moral sentences is indeed the "deeper difficulty" arising from Frege-Geach. Expressivism *starts* by denying that moral judgments are straightforwardly truth-apt.
      *   **Oversimplification/Inaccuracy/Unfairness:**
          *   **"Requires truth-apt premises":** This is a *contested* claim. While classical logic assumes truth-aptness, expressivists argue logic is fundamentally about *consistency* or *commitment preservation* in thought and language, which *can* apply to non-truth-apt expressions. Blackburn's projectivism/quasi-realism and Gibbard's norm-expressivism aim precisely to show how logic *can* work for moral discourse *without* presupposing realist truth-aptness *at the metaphysical level*.
          *   **"Expressivism makes moral reasoning impossible":** This is a **gross overstatement** and arguably **unfair**. It ignores the expressivist project's *entire point*: to show how moral reasoning *is* possible *despite* being based on attitudes. Neo-expressivists explicitly develop complex semantic frameworks (using possible worlds, planning states, or minimal truth) to model moral reasoning and logical validity *within* an expressivist framework. They argue they *can* explain why modus ponens is valid for moral arguments. Whether they *succeed* is hotly debated, but claiming they *make it impossible* ignores their sophisticated attempts and misrepresents their goals.

  4.  **"Expressivists have replied by saying that moral terms have both descriptive and prescriptive meaning..."**
      *   **Accuracy:** This accurately describes one type of expressivist response: **Hybrid Expressivism** (e.g., Michael Ridge, Daniel Boisvert). Hybrid theories *do* grant moral terms a descriptive component alongside the expressive/prescriptive component.
      *   **Simplification:** It misses the dominant response strategy from "pure" expressivists like Blackburn and Gibbard. Their solution isn't adding descriptive meaning but developing a **complex semantics** for the *expressive* component itself that can handle embedding (e.g., Blackburn's "attitudes to attitudes" or Gibbard's "plan-laden worlds"). They aim to solve Frege-Geach *without* abandoning the core non-cognitivist thesis about the fundamental nature of moral judgments.

  5.  **"...but this reply is generally regarded as abandoning the view, because once descriptive meaning is admitted moral judgments become beliefs again and the position collapses into a kind of subjectivism."**
      *   **Careful Expressivist (Hybrid) Would Reject:** This is a **contentious and arguably inaccurate characterization**.
          *   **Not Necessarily Abandonment:** Hybrid expressivists *explicitly* argue they maintain the core expressivist commitment. They claim the *distinctive, essential, and motivating* element of moral judgment remains the expression of a non-cognitive attitude. The descriptive component is secondary or derived. They aim to capture the insights of expressivism while solving Frege-Geach by leveraging the descriptive element for embedding.
          *   **Not Necessarily Subjectivism:** Hybrid theories can avoid simple subjectivism. The descriptive meaning might be tied to *shared* standards, social norms, or idealized perspectives, not merely the speaker's own feelings. Ridge's "Ecumenical Expressivism," for instance, combines expressivism with a form of contextualism about the descriptive element.
          *   **"Collapse":** Whether hybrids *truly* avoid collapse into a form of cognitivism or subjectivism is a **live debate**, not a settled verdict. Critics argue the descriptive component inevitably takes over, making the attitude redundant. Hybridists argue they maintain a genuine synthesis. Calling it "generally regarded as abandoning the view" overstates the consensus and dismisses the hybrid project too quickly. *Pure* expressivists (Blackburn, Gibbard) *would* see hybrids as abandoning core non-cognitivism, but hybrids disagree.

  **Addressing Your Specific Questions:**

  1.  **Does "expressivism makes moral reasoning impossible" follow?** **No, it does not validly follow.** The argument is:
      *   Premise 1: Expressivism denies moral judgments are truth-apt.
      *   Premise 2: Valid inference requires truth-apt premises. (Contested!)
      *   Conclusion: Therefore, expressivism makes valid moral inference (reasoning) impossible.
      The conclusion only follows *if* Premise 2 is true and *if* expressivists cannot provide an alternative account of validity. Neo-expressivists *reject* Premise 2 as it stands. They argue logic can be understood as concerning *consistency of commitments* or *inheritance of attitude* which *can* apply to non-truth-apt expressions. They then build complex semantic systems to model this. Whether they *succeed* is the debate – but they provide detailed arguments against the *impossibility* claim. The summary presents Premise 2 as an unassailable truth, which it is not within the expressivist project.

  2.  **Is the descriptive-plus-prescriptive reply just an abandonment?** **Not necessarily, and it's not the only reply.**
      *   **For Pure Expressivists (Blackburn, Gibbard):** Yes, adding descriptive meaning *in the way hybrids do* would be seen as abandonment. *Their* solution is to handle embedding *within* a purely expressivist semantics using complex attitudes or planning states.
      *   **For Hybrid Expressivists (Ridge, Boisvert):** Emphatically *no*. They argue they are developing a *new form* of expressivism that retains the core motivational, non-representational element as primary while using a descriptive component specifically to solve Frege-Geach and capture other features of moral language. They explicitly deny collapsing into subjectivism or simple cognitivism.
      *   **The Debate:** Critics argue hybrids either collapse into cognitivism or fail to solve the problem. Hybridists argue they offer the best of both worlds. It's an ongoing research program, not a settled failure. The summary presents the *critics' verdict* as the final word, which is unfair to the hybrid position.

  **In Summary:**

  The TA's handout accurately states the core Frege-Geach challenge and identifies a significant hurdle for expressivism. However, it:

  1.  **Oversimplifies** expressivism itself (relying on the "boo/hurrah" model).
  2.  **Overstates and unfairly dismisses** the expressivist response by:
      *   Claiming they make moral reasoning *impossible* (ignoring sophisticated semantic projects).
      *   Presenting the contested claim about logic requiring truth-aptness as a fatal given.
      *   Ignoring the dominant *pure* expressivist solutions (Blackburn, Gibbard) focused on complex attitude semantics.
      *   Mischaracterizing hybrid expressivism as *necessarily* abandoning the view and collapsing into subjectivism, rather than presenting it as a live (though contested) alternative approach.

  The dialectic is far more nuanced and ongoing than the handout suggests. Expressivists have developed highly sophisticated, complex theories precisely to answer Frege-Geach and vindicate moral reasoning. Whether they ultimately succeed is the subject of intense debate in contemporary metaethics, but they have not been simply refuted or forced into abandonment.
