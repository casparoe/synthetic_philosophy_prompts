answer: |-
  Your decomposition is astute—the debate *is* a tangle of distinct but interdependent disagreements. The impasse persists because each strand resists resolution on its own terms, and their entanglement creates a rhetorical loop. Here's a diagnosis:

  ### 1. **The Strands of Disagreement**
  Your decomposition holds, but their interactions intensify the stalemate:
  - **(a) Empirical/Practical Feasibility**  
    Mises/Hayek: Real-world planners face *unknowable* local/tacit knowledge (e.g., a machine operator's insight, a supplier's informal workaround). Markets aggregate this via prices; planners cannot.  
    Lange/Lerner: Computational advances (big data, AI) *could* approximate market signals. Iterative feedback ("tâtonnement") suffices.  
    **Impasse:** Lange assumes knowledge *can* be centralized; Hayek says it *cannot*. This is untestable without real-world scale experiments (which are politically impossible).

  - **(b) Conceptual/Formal Validity**  
    Mises/Hayek: "Prices" without property rights are accounting fictions. They lack the *incentive* and *discovery* functions of real markets.  
    Lange/Lerner: Shadow prices in a planner's model *are* prices if they clear markets. Feasibility is defined mathematically (convergence proofs).  
    **Impasse:** Competing definitions of "rational allocation." Is it Pareto efficiency (Lange) or dynamic adaptation (Hayek)? Neither side concedes the other's frame.

  - **(c) Incentives, Power, and Authority**  
    Both models ignore: Who forces managers to report truthfully? Why would planners adjust prices "neutrally"? Real planners face political pressure, corruption, and bureaucratic self-interest.  
    **Impasse:** Mises/Hayek imply this voids socialism; Lange treats it as an "implementation detail" separable from the model.

  - **(d) Normative Foundations**  
    Underlying the technical debate:  
    - Mises/Hayek: Markets are *necessary for freedom*. Central planning = coercion.  
    - Lange/Lerner: Planning enables *equity and collective goals*. Markets = inefficient/immoral.  
    **Impasse:** Technical claims are weaponized for moral ends. Conceding a point feels like endorsing tyranny or injustice.

  ---

  ### 2. **Could Formal Results Resolve Anything?**
  - **Computation/Complexity:**  
    Results like the **Hurwicz impossibility theorem** (1972) show *no* mechanism can be both Pareto-efficient and incentive-compatible for all information structures. This challenges Lange but doesn't refute "good enough" approximations.  
    **Limitation:** Assumes self-interested actors—Hayek's tacit knowledge problem remains untouched.

  - **Information Economics:**  
    Hayek's "knowledge problem" maps to **information asymmetry** and **scattered local knowledge**. Modern mechanism design (e.g., auction theory) shows markets *can* aggregate information efficiently, but only under strict conditions (competition, property rights).  
    **Limitation:** Lange's model assumes perfect compliance—no asymmetry or strategizing.

  - **Complexity Theory:**  
    Calculating general equilibrium is **NP-hard** or worse. Lange's iterative process may not converge in polynomial time for complex economies.  
    **Limitation:** Hayek's critique isn't about computation speed but *unknowability*—some knowledge is non-algorithmic.

  **Verdict:** Formal results clarify *trade-offs* (e.g., "efficiency requires property rights") but can't settle the core clash. The debate isn't purely technical—it's about **epistemology** (what counts as knowledge?) and **ontology** (do "prices" require markets?).

  ---

  ### 3. **Why Progress Is Paralyzed**
  - **Asymmetric Burden of Proof:**  
    Mises/Hayek demand planners solve an *insoluble* problem (capturing tacit knowledge). Lange/Lerner demand critics disprove a *non-falsifiable* model ("with enough computation, it works").
  - **Moving Goalposts:**  
    - Pro-markets point to USSR/Venezuela failures → "Not real Lange!"  
    - Pro-planning cite algorithmic success (e.g., prediction markets) → "That's not central planning!"  
  - **Nested Disagreements:**  
    The empirical (a), conceptual (b), and incentive (c) strands collapse into (d): *What is the purpose of an economy?* Efficiency? Freedom? Justice?  

  ---

  ### 4. **What Would Progress Look Like?**
  The debate is "live" only if decoupled into tractable questions:
  - **Empirical:** Use agent-based models to simulate Lange's process with:  
    - Imperfect information  
    - Strategic actors  
    - Computation limits  
    (e.g., how quickly does it diverge from equilibrium with 1% bad data?).
  - **Conceptual:** Define "rational allocation" rigorously:  
    - Static efficiency?  
    - Dynamic innovation?  
    - Resilience to shocks?  
    Markets and planning score differently on each.
  - **Normative:** Explicitly debate values first. If equity > growth, planning's inefficiencies might be acceptable.
  - **Hybrids:** Study modern mixed systems (e.g., China's "socialist market economy") as data points for what aspects of planning/markets function at scale.

  ---

  ### The Core Diagnosis
  **This is a meta-disagreement about the *nature of economic knowledge*.**  
  - Mises/Hayek see economics as a *coordination problem* rooted in human subjectivity and discovery.  
  - Lange/Lerner see it as an *optimization problem* solvable with sufficient data and computation.  

  Until these epistemologies reconcile, the debate will remain a loop. The most viable path forward is to abandon the quest for a "winner" and focus on context: *Under what conditions* (technological, cultural, scale) can planning/markets capture aspects of economic rationality? But this requires setting aside the ideological stakes—which is why the debate endures.
