answer: |-
  Here’s an adversarial collaboration document designed to clarify agreements, pinpoint disagreements, and identify testable cruxes. Both views are presented neutrally, with language acceptable to each side.

  ---

  **Adversarial Collaboration: The Persistence of Self**  
  *Jointly Authored by [Your Name] and [Friend's Name]*

  ### 1. **Agreed-Upon Foundational Claims**  
  *(Both signatories endorse these statements as true or plausible)*  

  1.  **Internal Models Exist**: Humans naturally generate dynamic internal models ("low-res copies") of significant others, which influence behavior, emotions, and predictions.  
  2.  **Patterns Can Be Instantiated**: Specific patterns of information processing (memories, habits, personality traits) can be partially replicated across different substrates (e.g., biological brains, potential future substrates).  
  3.  **Biological Continuity is Default**: Under normal circumstances, the persistence of a human self is contingent on the continuous biological functioning of the organism (brain/body).  
  4.  **Fidelity Matters for Function**: The accuracy ("resolution") of a replicated pattern significantly impacts its functional equivalence to the original (e.g., a low-res model predicts behavior poorly).  
  5.  **No Metaphysical Ghosts**: There is no evidence for a non-physical "soul" or immutable essence separable from physical processes.  
  6.  **Grief Involves Internal Models**: The experience of grief after death is intrinsically linked to the continued operation and updating of the internal model of the deceased within the bereaved.  

  ### 2. **Core Disagreements: The Nature of Self and Survival**  
  *(Each column states the respective view's position in its own terms)*  

  | Issue                              | Pattern View (PV)                                                                 | Organism/Continuity View (OCV)                                                          |
  | :--------------------------------- | :-------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- |
  | **1. Definition of "Self"**        | A self *is* a specific, dynamic pattern of information processing and its causal effects. | A self *is* the ongoing process of a particular living organism, fundamentally tied to its biological continuity. |
  | **2. Identity & Survival Criterion** | Identity/survival depends on the *pattern's instantiation and causal efficacy*. If a sufficiently high-fidelity pattern runs *anywhere*, the self persists there. | Identity/survival depends on *unbroken continuity of the specific biological process*. A copied pattern, however faithful, is a *new* entity (copy/simulation), not the original self. |
  | **3. Low-Res Copies (e.g., in Memory)** | The low-res pattern running in a survivor's brain *is* a literal (though partial/degraded) instantiation of the deceased's self-pattern. Part of them *does* survive, albeit imperfectly. | The low-res pattern is a *representation* or *model* created *by the survivor*, not an instantiation *of the deceased's self*. It's a cognitive tool of the survivor, not survival of the deceased. |
  | **4. High-Fidelity Copy (e.g., Upload)** | A perfect copy running on new hardware is numerically identical to the original self. It *is* the original person continuing their existence. | A perfect copy is a distinct individual psychologically identical *at inception* to the original. It is a *twin*, not the original person, who ceased upon biological death. |

  ### 3. **Cruxes: Testable Sub-Questions**  
  *(Specific questions where evidence could shift views, with pre-commitments)*  

  **Crux 1: The High-Fidelity Copy ("Upload") Scenario**  
  *   **Scenario:** A perfect, atomically precise scan of Person A's brain is made at time T. The original biological brain is destroyed simultaneously. The scan is activated on synthetic hardware, producing a conscious entity indistinguishable from Person A at T, with apparent continuous memory.  
  *   **Question:** Is the entity post-activation Person A?  
  *   **PV Prediction:** **Yes.** The unique pattern constituting Person A is now running on a new substrate. Continuity of the *pattern* is sufficient for identity.  
  *   **OCV Prediction:** **No.** The specific biological process was terminated. The upload is a psychologically identical but numerically distinct entity.  
  *   **Evidence Against PV:** If the upload *lacks* a compelling subjective sense of continuity ("I feel like a copy, not the original") despite functional equivalence, it challenges PV's claim that pattern instantiation *is* survival.  
  *   **Evidence Against OCV:** If the upload exhibits an *unbroken, first-person subjective experience* indistinguishable from biological continuity (e.g., reports "I blinked, and now I'm here in this new body"), it challenges OCV's claim that biological continuity is *necessary* for identity/survival.  

  **Crux 2: The Fidelity Threshold for "Survival" in Copies**  
  *   **Scenario:** A copy of a person's pattern is instantiated in another brain or machine, but with varying degrees of imperfection (e.g., missing memories, slightly altered personality traits, slower processing).  
  *   **Question:** At what level of fidelity (if any) does the copy constitute the *survival* of the original person, rather than just being a good simulation?  
  *   **PV Prediction:** Survival is **graded**. As fidelity increases, the degree of survival increases. There is no sharp threshold; it's a continuum based on functional equivalence. "True" survival requires high fidelity, but even low-res copies contain *some* survival.  
  *   **OCV Prediction:** Survival is **binary** and tied solely to biological continuity. *No* copy, regardless of fidelity, constitutes the survival of the original person. Copies are always distinct entities (simulations/models/twins).  
  *   **Evidence Against PV:** If increasing fidelity *never* produces the *original* person's subjective perspective (only ever creates a *new* entity that believes it *is* the original), even at near-perfect fidelity.  
  *   **Evidence Against OCV:** If copies at extremely high fidelity (indistinguishable from the original by any external or internal measure) consistently report *being* the original and demonstrate unique, non-replicable knowledge/experience only the original had.  

  ### 4. **Terminological Clarifications**  
  *(Where disagreement may stem from word usage)*  

  1.  **"Survive"**:  
      *   **PV:** Primarily means *the persistence of the specific pattern and its causal role*. ("Part of their pattern survives in my brain.")  
      *   **OCV:** Primarily means *the continued existence and conscious experience of the original biological entity*. ("Their body died; *they* did not survive in my brain, only my memory of them did.")  
      *   **Nature:** **Primarily Verbal.** The core disagreement (Crux 1 & 2) remains substantive, but using "survive" carelessly causes confusion.  
  2.  **"Self"**:  
      *   **PV:** Refers to the *abstractable pattern itself*. ("The self-pattern can be instantiated multiple times.")  
      *   **OCV:** Refers to the *concrete, specific biological instance*. ("The self is this organism right here, now.")  
      *   **Nature:** **Substantive & Verbal.** The definitional difference reflects the core ontological disagreement about what constitutes identity.  
  3.  **"Is" (Identity)**:  
      *   **PV:** Identity is based on pattern equivalence and causal continuity. ("The upload *is* me.")  
      *   **OCV:** Identity is based on numerical sameness of the biological entity. ("The upload is *a copy of* me.")  
      *   **Nature:** **Substantive.** This is the heart of the metaphysical disagreement (Crux 1).

  ---

  **How to Use This Document:**

  1.  **Sign the Agreements (Section 1):** Confirm you both accept these starting points.
  2.  **Acknowledge the Disagreements (Section 2):** Verify the table accurately represents your core positions *in your own terms*.
  3.  **Focus Debate on the Cruxes (Section 3):**  
      *   Discuss the concrete scenarios.  
      *   Examine real-world analogs (e.g., identical twins, severe amnesia followed by recovery, AI development).  
      *   Seek evidence relevant to the "Evidence Against" criteria each side pre-committed to.  
  4.  **Clarify Terminology (Section 4):** When arguing, explicitly state which sense of "survive," "self," or "is" you are using to avoid talking past each other.

  This structure forces engagement with the strongest versions of each other's arguments and focuses the debate on potentially resolvable points (the Cruxes), moving beyond purely definitional or intuitive stalemates. Good luck!
