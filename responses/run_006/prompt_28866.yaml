  First, I need to understand the core of their disagreement. The pattern view sees identity as a replicable pattern, while the continuity view ties the self to a specific biological organism. The user mentioned they keep talking past each other, so the document needs to clarify where they agree and where the real disagreements lie. 

  The user wants a structured document with numbered agreements, a table of disagreements, and cruxes—specific questions that could resolve parts of the argument. They also want to flag terminological differences. 

  Starting with the agreements: Both sides likely agree that people maintain internal models of others and that these models influence behavior. They also probably acknowledge that biological continuity is how identity typically persists. Highlighting these common grounds can set a foundation. 

  For the disagreements table, I'll phrase each side's position in their own terms. The pattern view emphasizes the pattern's instantiation as survival, while the continuity view stresses biological persistence. Using columns for each perspective will keep it clear. 

  The cruxes are crucial. The high-fidelity copy scenario is a key test case. If a perfect copy is made, does that constitute survival? The pattern view would say yes, it's the same self; the continuity view would say it's a copy, not the original. Each side must state what evidence would falsify their view. For example, if a copied individual doesn't feel continuous, that challenges the pattern view. 

  Terminological issues: "Survival" and "self" might be used differently. The pattern view sees survival as pattern continuity, while the continuity view ties it to biological life. Pointing this out can prevent unnecessary conflict over words. 

  I should ensure the document is neutral, substantive, and addresses both technical (software analogy) and philosophical aspects. The user's engineering background means concrete examples like software deployments will resonate. Their friend's pattern perspective needs equal representation. 

