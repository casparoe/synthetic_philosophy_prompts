prompt: |-
  Ok so I've been argueing with a friend for like a year about this Hofstadter idea that the self is a pattern rather than a thing, and that when someone close to you dies a low-res copy of them keeps running in your brain, so part of them literally survives in you. I'm a backend engineer and I keep reaching for the software analogy: a copy of the codebase running somewhere else is not the same deployment, and a model of a person is not the person. My friend thinks that's exactly backwards — he says the deployment is the wrong level to think about identity, the pattern is what matters, and if the pattern is running somewhere, that's you, even if it's a lower-fidelity version. We're both sick of talking past eachother and we agreed to do one of those adversarial collaboration write-ups, but neither of us knows how to actually produce one.

  So write the document we should both be able to put our names on. The two camps: (1) the pattern view — a self just is a certain pattern of information processing, identity comes in degrees, and to whatever extent that pattern is instantiated in another brain, you persist there; (2) the organism/continuity view — a self is tied to the particular living organism (or at least to the right kind of continuity with it), and another instantiation of the pattern is at best a copy or a simulation, not you. Give me a numbered section of claims both sides can sign — make them substantive, not just definitions — and then a table of the residual disagreements, worded so each side would accept the phrasing of its own column. Then the cruxes: the sub-questions where settling one would actually move one of us. I suspect one crux is the high-fidelity copy case: if we could run someone's entire pattern on new hardware, is that them? For each crux, give the concrete case or argument both sides agree bears on it, write down each side's prediction in advance, and say what each side would count as evidence against their own view. Also flag anywhere you think we're really just using "self" or "survive" differently rather than disagreeing about the world, because I have a feeling some of this is verbal and some of it isn't.
