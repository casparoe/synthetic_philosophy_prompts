  Okay, the user is a novelist working on a book set around the 2016 Brexit referendum. They need to understand the democratic boundary problem—specifically, who gets to vote in such a referendum—to accurately portray characters excluded from the vote. Their main characters include a Polish care worker in the Midlands and a retired British couple in Spain, both disenfranchised in the referendum. The user wants a rigorous analysis using democratic theory frameworks to map the franchise boundaries.

  The user's explicit request is for a case study applying democratic theories to the Brexit referendum's franchise. They mention several theories: all-affected interests, all-subjected, stakeholder, and the historical community view. They want each theory analyzed in terms of where it would draw the franchise boundary, how it judges the actual franchise, what it handles well, and where it falls short. They also want to see what the Brexit case reveals about the theories themselves.

  But the user's deeper needs might be more nuanced. As a novelist, they need to authentically capture their characters' experiences of exclusion. Understanding the theoretical tensions will help them depict the moral and emotional weight of disenfranchisement. They might also be exploring themes of belonging, identity, and justice in a divided society. The Brexit context is emotionally charged, so they need a balanced analysis that avoids oversimplifying the political drama.

  I need to structure the response clearly for each theory. For each, I'll outline its core principle, apply it to the Brexit franchise, judge the actual boundaries, note strengths in explaining the case, and point out limitations. Then I'll discuss what the case reveals about the theory. After covering all four, I'll synthesize insights from the Brexit experience and tie it back to how this helps the novelist.

  The all-affected principle argues that anyone affected should have a say. This would include EU citizens in the UK, Brits abroad beyond 15 years, young people, and possibly others like Scottish citizens or EU partners. The theory would criticize the actual franchise as too narrow. It handles the moral claims of excluded residents well but falls apart in practice due to the butterfly effect problem—where to draw the line on affectedness.

  The all-subjected principle focuses on those governed by the laws. This would include UK-resident EU citizens but exclude long-term expats and young people not yet subject to laws. It might accept the actual franchise but criticize excluding resident EU citizens. It handles the coercion aspect well but struggles with the referendum's exceptional nature and doesn't resolve youth exclusion.

  The stakeholder principle emphasizes those with a tangible stake in the community. This could include resident EU citizens but exclude expats and youth. It might critique the actual franchise as inconsistent, especially regarding EU citizens. It captures the lived reality of residents but has vague boundaries and overlooks the referendum's unique impact on expats.

  The historical community view relies on existing citizenship and residency. It would defend the actual franchise as administratively coherent. It handles stability and clarity well but ignores normative questions and the changing nature of political community, failing to address the exclusion of deeply integrated residents.

  Synthesizing, the Brexit case shows that each theory has flaws. The referendum exposed tensions between community boundaries and real-world ties. Practical compromises led to contradictions, like excluding EU citizens but including Commonwealth citizens. This highlights the messiness of democratic boundaries in a globalized world.

  For the novelist, this analysis provides a framework to explore characters' disenfranchisement. The Polish care worker's exclusion under all theories except all-affected underscores her lack of voice despite deep ties. The retired couple in Spain represents the stakeholder paradox—they had a stake but were excluded. The theories help frame their narratives within larger democratic tensions, adding depth to the story.
answer: |-
  Here is a rigorous analysis of the Brexit referendum franchise through the lens of democratic boundary theories, structured as requested. The case powerfully illustrates the tensions and limitations inherent in each approach.

  **The Boundary Problem & Brexit: A Case Study Analysis**

  1.  **The All-Affected Interests Principle**
      *   **Core Idea:** Anyone whose interests are significantly affected by a decision should have a right to participate in making it.
      *   **Boundary Drawn:** Vastly broader than the actual franchise.
          *   *Included:* All UK-resident EU citizens (deeply affected economically, socially, personally), British citizens abroad >15 years (affected by loss of EU rights, passport value, potential barriers to return), 16-17 year olds (longest future affected), potentially citizens of the Republic of Ireland (due to CTA and NI implications), perhaps even citizens of other EU states (if concerned about broader EU stability/movement) and Gibraltar (directly impacted).
      *   **Judgment of Actual Franchise:** Harshly critical. Seen as fundamentally unjust and democratically deficient. Excluded precisely those whose lives were most directly and profoundly altered (resident EU citizens, long-term expat Brits, future-bound youth).
      *   **Handles Well:**
          *   Captures the core moral grievance of the excluded characters (Polish careworker, retired couple in Spain, disenfranchised youth). Their lives *were* massively altered.
          *   Highlights the referendum's extraordinary scope – it wasn't routine policy but a fundamental reordering of rights, residency, and identity with deep, long-term consequences far beyond the usual electorate.
          *   Exposes the arbitrariness of excluding deeply integrated residents based solely on nationality.
      *   **Runs Out / Stretches / Misdescribes:**
          *   **The Butterfly Effect Problem:** Logically, *everyone* is affected to some degree by a decision this large (e.g., global markets, geopolitics). Where is the line? The principle offers no clear, administratively feasible threshold for "significance." It risks infinite regress.
          *   **Dilution & Practicality:** Including millions of non-traditional voters (especially non-citizens) raises concerns about the practical feasibility of a vote and the dilution of the vote's meaning for the historic political community making the existential choice.
          *   **Ignores Coercion vs. Consequence:** Doesn't distinguish between being *subject to* the future UK laws implementing Brexit (coercion) and merely being *impacted* by them (consequence). The Spanish retirees are impacted but not subject to UK law.
      *   **What the Case Shows About the Theory:** The Brexit referendum is the *all-affected principle's strongest empirical case* and simultaneously its *greatest practical challenge*. It vindicates the principle's core normative intuition about injustice but brutally exposes its crippling lack of operational boundaries and its potential incompatibility with national self-determination in large-scale sovereign decisions. The theory appears aspirational but politically impractical for foundational choices.

  2.  **The All-Subjected Principle**
      *   **Core Idea:** Anyone who is subject to the coercive power of the laws resulting from the decision should have a right to participate.
      *   **Boundary Drawn:** Narrower than All-Affected, broader than the historical community in key ways.
          *   *Included:* All individuals legally resident in the UK and thus subject to its laws *regardless of nationality* (including the Polish careworker, other EU citizens). This aligns with local election franchise.
          *   *Excluded:* British citizens abroad >15 years (not subject to UK daily laws), 16-17 year olds (often debated, but typically not seen as fully subjected until voting age), citizens of other EU states not resident in the UK, Irish citizens not resident in UK (though CTA complicates this).
      *   **Judgment of Actual Franchise:** Criticizes the exclusion of UK-resident EU citizens. Might accept exclusion of long-term expats and 16-17 year olds (depending on interpretation of "subjected"). Views the inclusion of Commonwealth citizens as inconsistent unless they are also subjected.
      *   **Handles Well:**
          *   Directly addresses the core injustice for resident EU citizens: they lived under UK law pre-referendum and would be subject to the *new* laws implementing Brexit. Their exclusion meant they had no say in the regime that would coercively govern them.
          *   Provides a clearer, more administrable boundary than All-Affected (based on residency, aligning with existing registration).
          *   Focuses on the core democratic ideal: no coercion without representation.
      *   **Runs Out / Stretches / Misdescribes:**
          *   **The Referendum Itself vs. Implementation:** The referendum was an *advisory* vote on a principle, not a direct law-making act. The *subsequent* laws are what subject people. Does the principle apply to the *authorizing* vote? This is contested.
          *   **Scale & Nature of the Decision:** Does "subjected" adequately capture the *existential* nature of the decision? Removing EU citizenship rights arguably subjected residents to a different *kind* of vulnerability.
          *   **Ignores Profoundly Affected Non-Residents:** Fails to capture the plight of the retired couple in Spain (subject to Spanish law, but UK's decision drastically altered *their* legal status and rights within the EU).
          *   **Youth Exclusion:** Doesn't resolve the 16-17 year old dilemma – they *are* subject to the laws but were excluded.
      *   **What the Case Shows About the Theory:** The case highlights the principle's *normative strength* regarding resident foreigners but exposes a *temporal/functional limitation*. It struggles to cleanly apply to foundational constitutional *precursors* (referenda) rather than routine legislation. It also reveals that "subjected" might be too narrow for decisions that radically alter the *context* of life for people intimately tied to, but not residing within, the polity making the choice.

  3.  **The Stakeholder Principle**
      *   **Core Idea:** The franchise should belong to those who have a sustained, significant, and tangible stake in the continuing life of the political community. This often blends residency, contribution (taxes, social ties), and long-term commitment.
      *   **Boundary Drawn:** Potentially broader than historical community, focused on integration.
          *   *Included:* Likely UK-resident EU citizens with stable jobs/ties (like the Polish careworker), potentially British citizens abroad who maintain strong ties (property, family, intent to return – though the Spanish retirees' 20-year absence weakens this). Might include 16-17 year olds as future stakeholders.
          *   *Excluded:* Short-term residents, British citizens abroad with minimal ties, non-resident foreigners.
      *   **Judgment of Actual Franchise:** Criticizes the exclusion of integrated resident EU citizens. Sees the exclusion of long-term expats as potentially justifiable depending on their stake (but the 15-year rule is arbitrary). Likely criticizes youth exclusion. Views the inclusion of non-resident Commonwealth citizens with minimal UK ties as inconsistent.
      *   **Handles Well:**
          *   Captures the intuitive sense that the Polish careworker, contributing to society daily, had a deeper "stake" than a Commonwealth citizen who left decades ago and has no current UK ties.
          *   Acknowledges the importance of social integration and contribution alongside legal status.
          *   Offers a more flexible, context-sensitive criterion than rigid citizenship.
      *   **Runs Out / Stretches / Misdescribes:**
          *   **Defining "Stake":** Highly subjective and contestable. Is paying taxes enough? How strong must social ties be? How is "intent to stay" measured? Lacks clear administrative criteria, vulnerable to manipulation.
          *   **The Nature of the Stake in Sovereignty:** Does a Polish nurse's "stake" in her job and community equate to a stake in deciding the UK's *constitutional relationship* with Europe? Critics argue sovereignty decisions belong to the historic national community.
          *   **Expat Paradox:** Struggles with citizens abroad. Their stake might be emotional or ancestral, but is it equivalent to the stake of residents facing daily consequences? The Spanish retirees had a huge *personal* stake in EU freedom of movement, but a diminished *civic* stake in the UK's day-to-day future.
          *   **Overlooks Coercion:** Doesn't directly address the fundamental issue of being subject to law.
      *   **What the Case Shows About the Theory:** Brexit reveals the stakeholder principle's *appealing flexibility* but also its *fatal vagueness*. It resonates with the lived reality of exclusion felt by integrated residents ("I contribute, I belong here!") but offers no robust, impartial way to measure that stake for a high-stakes sovereignty decision. It risks creating hierarchies of belonging that are themselves contentious.

  4.  **The Historically Given Political Community (Citizenship/Residency Model)**
      *   **Core Idea:** The demos is defined by pre-existing legal and historical boundaries: primarily citizenship and current residency. Stability, administrative feasibility, and the established constitutional order are paramount.
      *   **Boundary Drawn:** Exactly mirrors the actual franchise used.
          *   *Included:* British, Irish, and qualifying Commonwealth citizens *resident* in the UK; British citizens abroad registered within last 15 years.
          *   *Excluded:* All others (non-resident EU citizens, UK-resident EU citizens, Brits abroad >15 years, 16-17 year olds).
      *   **Judgment of Actual Franchise:** Defends it as legitimate, practical, and consistent with precedent (e.g., UK general elections, 1975 EEC referendum). Argues that sovereignty decisions rightly belong to the national citizen body as historically constituted. Exclusions are seen as necessary for manageability and democratic coherence.
      *   **Handles Well:**
          *   Provides a clear, administratively workable boundary based on existing registries and legal categories. Avoids the chaos of defining new boundaries for each vote.
          *   Reflects the deep-seated understanding that fundamental questions of national sovereignty and constitutional direction belong to the established national citizenry.
          *   Acknowledges the practical reality of organizing a major referendum.
          *   Explains the inclusion of Commonwealth citizens as a legacy of the historic imperial relationship codified in law.
      *   **Runs Out / Stretches / Misdescribes:**
          *   **Moral Arbitrariness:** Cannot justify *why* the Polish careworker, deeply integrated and facing profound consequences, should be excluded while a Commonwealth citizen arriving yesterday gets a vote. Defends the status quo without normative justification beyond tradition and law.
          *   **Ignores Transnational Reality:** Fails to account for the lived experience of deep European integration (freedom of movement, shared rights) which created legitimate stakes for resident EU citizens and long-term UK expats in other EU countries.
          *   **Anachronistic Boundaries:** The Commonwealth inclusion highlights the historical contingency and potential injustice of the "given" community – why Malta or Cyprus, but not France or Poland?
          *   **Youth Exclusion:** Defends exclusion based solely on an arbitrary age cutoff, ignoring their unique future stake.
      *   **What the Case Shows About the Theory:** The Brexit referendum is the *strongest vindication of this view's practicality and political legitimacy*, yet simultaneously its *most damning indictment on normative grounds*. It functioned administratively but resulted in widely perceived injustices that fueled alienation and division, particularly among those whose lives were bound to the UK but excluded from the decision. It demonstrates how "given" boundaries can become morally and politically unsustainable in a transnational context, yet also how powerful the inertia of the existing demos remains.

  **Synthesis: What the Brexit Referendum Reveals about Democratic Boundary Theory**

  1.  **No Clear Winner, All Flawed:** The referendum powerfully demonstrates that *none* of the standard theories provides a wholly satisfactory, universally acceptable, and practically feasible solution to the boundary problem for a foundational sovereignty decision in a transnational context. Each has significant normative or practical weaknesses exposed by the case.
  2.  **The Tyranny of the Practical vs. The Injustice of the Status Quo:** The case highlights the fundamental tension between normative ideals (especially All-Affected/All-Subjected) and practical political reality/feasibility (embodied by the Historical Community view). The compromise reached (the actual franchise) was administratively functional but normatively incoherent and deeply unjust to many.
  3.  **The Existential Nature Matters:** The scale and consequence of the decision amplified the boundary problem. Routine policy decisions might fit neatly within the Historical Community view; decisions that rupture transnational legal orders and identities expose its limitations dramatically.
  4.  **Transnational Realities Strain National Demoi:** The case underscores how European integration (and globalization generally) creates categories of people – deeply integrated foreign residents and long-term expatriate citizens – who don't fit neatly into the traditional national demos but have profound, legitimate stakes in its major constitutional choices. Theories struggle to accommodate this.
  5.  **The Problem of Time:** The franchise grappled poorly with temporal dimensions – excluding those with the longest future stake (youth) and those whose past connection (Brits abroad >15 years) still held significant present stakes.
  6.  **Contingency & Power:** The inclusion of Commonwealth citizens while excluding EU citizens starkly revealed that the "given" demos is not natural or inevitable, but the product of historical contingency, power relations, and political choices that can appear arbitrary in a new context.
  7.  **Legitimacy Deficits are Real:** Regardless of the theoretical defense of the historical community, the exclusion of significantly affected groups created a tangible legitimacy deficit for the outcome in the eyes of those excluded and many observers, fueling ongoing division. This practical political consequence challenges theories that dismiss normative concerns about the boundary.

  **For Your Novel:** This analysis provides the rigorous framework you sought. The Polish careworker embodies the failure of the All-Subjected/Stakeholder/All-Affected principles against the Historical Community reality. Her exclusion highlights coercion without representation and the arbitrariness of citizenship-based boundaries in a transnational setting. The Yorkshire retirees in Spain expose the limitations of the All-Subjected and Historical Community views – profoundly affected but not residing within the coercive jurisdiction, their long-term stake ignored by the arbitrary 15-year rule. Their plight resonates with the All-Affected principle but also shows the Stakeholder principle's ambiguity regarding expatriates.

  The referendum franchise wasn't just a technical detail; it was an existential political choice about who "belonged" to the UK demos making a fateful decision. Writing your characters honestly means capturing the profound dissonance between their lived reality, their sense of belonging and stake, and the cold, often arbitrary, legal lines drawn by a political community grappling, imperfectly, with an inherently insoluble democratic dilemma. The theories illuminate *why* their exclusion feels unjust, while the case reveals why that injustice was structurally embedded in the decision-making process itself.
