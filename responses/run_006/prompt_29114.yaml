answer: |-
  Below is a decision tree for the Special Composition Question (SCQ), designed to guide users from concrete cases to named metaphysical positions. The tree uses intuitive, non-doctrinal questions and covers the requested positions: **mereological nihilism**, **universalism**, **van Inwagen's organicism**, **Markosian's brutalism**, and a **moderate view** (e.g., contact/fastening). **Composition-as-identity (CAI)** is noted but not a leaf, as it entails universalism. The tree is based on logical space, flags contested issues, and fits on 1–2 pages.  

  ---

  ### **Special Composition Question (SCQ) Decision Tree**  
  *Answer questions based on intuition, not doctrine. Follow branches to your position.*  

  #### **Start Here**  
  1. **Q0: Do a hammer’s handle and head (fastened together) compose a single object (a hammer)?**  
     - **YES** → Go to Q1.  
     - **NO** → Go to Q2.  

  #### **Branch 1: Hammer = YES**  
  2. **Q1: Do the hammer’s handle and a random pebble on Mars compose something?**  
     - **YES** → **Universalism**  
       - *Description:* Composition always occurs; any plurality has a sum.  
       - *Note:* CAI (composition-as-identity) entails this view.  
     - **NO** → Go to Q3.  

  3. **Q3: Is there a non-circular, informative principle (e.g., "contact" or "fastening") that explains when composition occurs?**  
     - **NO** → **Brutalism (Markosian)**  
       - *Description:* Composition has no general principle; it’s a brute fact about reality.  
       - *Contested:* Brutalism allows borderline cases (e.g., heaps), but critics argue it risks arbitrariness.  
     - **YES** → Go to Q4.  

  4. **Q4: Do the particles of a cat compose a whole *after* it dies (i.e., is there a dead cat-shaped composite)?**  
     - **YES** → **Moderate View (e.g., contact/fastening)**  
       - *Description:* Composition requires physical interaction (e.g., contact, bonding).  
       - *Settled:* This view faces serious challenges (e.g., cat-on-mat problem).  
     - **NO** → **"Artifacts-Only" View**  
       - *Description:* Only artifacts (e.g., hammers) and living things compose; inanimate composites (e.g., corpses) do not.  
       - *Status:* Unexplored/unattractive. No major defense exists; it struggles with the living/dead cat distinction.  

  #### **Branch 2: Hammer = NO**  
  2. **Q2: Do the particles of a *living* cat compose a whole?**  
     - **NO** → **Mereological Nihilism**  
       - *Description:* Composition never occurs; only simples exist.  
       - *Vagueness:* Rejects borderline cases (no composition = no vagueness).  
     - **YES** → **Organicism (van Inwagen)**  
       - *Description:* Composition occurs only when activity constitutes *life*.  
       - *Contested:* Vagueness concerns exist (e.g., borderline life/death cases), but not all agree this is fatal.  

  ---

  ### **Key Notes & Clarifications**  
  - **Composition-as-identity (CAI):** Not a leaf node. It entails **universalism** (Q1=YES) and is incompatible with restricted views.  
  - **Empty Branches:** The "Artifacts-Only" view (Q4=NO) is unexplored. It arises in the tree but lacks defenders, as it denies composites for corpses while accepting hammers/cats arbitrarily.  
  - **Indistinguishable Positions:** Brutalism and some moderate views *cannot* be split by this tree alone. To distinguish:  
    - *Ask:* "Can there be borderline cases of composition?"  
      - Brutalism: YES (no principle → vagueness possible).  
      - Moderate Views: CONTESTED (e.g., contact may admit vague boundaries).  
  - **Vagueness Debate:**  
    - **Settled:** Moderate views (e.g., contact) are widely criticized for vagueness worries.  
    - **Contested:** Whether vagueness *fatally* undermines all restricted views (including organicism/brutalism) is unresolved. Nihilism/universalism avoid this by having no restrictions.  
  - **Tree Logic:** Based on 5 binary questions → 32 possible paths. Only 6 paths lead to named views; others are empty/unattractive (e.g., Q0=NO + Q2=NO + Q1=YES is incoherent).  

  ---

