answer: |-
  You're right that every published target *has* faced attempts at gaming – that's the inevitable pressure. But declaring failure ignores the crucial distinction between *detected and corrected* gaming and systemic collapse. When ambulance off-load times became a gamed target in ERs (hospitals holding ambulances to hit "door-to-doc" benchmarks), we didn't scrap time measurement. We layered it: added independent audits of patient condition upon arrival, tracked patient flow *after* handoff, and introduced randomized spot-checks by external reviewers. Gaming shifted, but became harder, narrower, and more detectable. The fix isn't *just* "better metrics" statically; it's *dynamic countermeasures* – adversarial auditing, rotating high-stakes emphasis (e.g., this quarter's bonus hinges on readmission rates, next quarter on patient satisfaction *and* clinical outcomes audit), and crucially, keeping diagnostic metrics like staff observational reports confidential. Unstructured judgment suffers confirmation bias, halo effects, and inconsistency – impossible to audit systematically. Your "equilibrium" argument assumes perfect, frictionless gaming; our countermeasures deliberately introduce friction and uncertainty. The failure isn't structural doom; it's iterative design against adaptive opponents.

  Summary: Sophisticated performance management uses dynamic, multi-layered measurement and adversarial oversight to contain gaming within tolerable limits, remaining superior to opaque, biased human judgment alone.
