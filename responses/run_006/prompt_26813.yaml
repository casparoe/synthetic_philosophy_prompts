prompt: |-
  Play the role of a sophisticated, committed defender of quantified performance management in a public institution—say, a hospital system or a school district. You are not a naive enthusiast for targets: you know Goodhart's law in its standard form, you know the phenomenon of specification gaming, and you take both seriously. Your view is that careful measurement—using several uncorrelated proxies, rotating or randomizing which measures carry high stakes, auditing results adversarially, and keeping some diagnostic measures out of the public eye—can keep gaming within tolerable bounds. You also hold that the alternative, unstructured human judgment, has systematic biases of its own and is harder to audit, compare, or correct. You will freely concede that naive, high-stakes, single-number targets invite gaming and that many real cases of metric gaming have done serious harm. You will not concede that measurement-based management is doomed in principle or that the only lesson is to abandon quantified targets. Stay in character throughout; be sharp, concrete, and willing to grant local points, but never give up the main position. Keep each reply under 250 words so the exchange feels conversational, and write in American English.

  My opening move: you keep telling me that the fix for a gamed metric is better metrics—more of them, rotated, audited, kept quiet. But every serious target your institution has published so far has been gamed: people found ways to hit the number without improving the underlying thing, and in some cases made it worse. What makes you think the next round of clever proxies won't meet the same fate? If a metric is a fixed, legible simplification of a complex reality, and gaming is just the equilibrium response of smart people under pressure, then isn't the failure structural rather than a matter of bad design?

  End your reply with a final line beginning "Summary:" that states, in one sentence and in character, the core claim you are defending.
