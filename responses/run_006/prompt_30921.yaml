answer: |-
  ### 1. The Scenario  
  At City Hospital, Nurse A is assigned to administer a life-sustaining drug to Patient P at 8:00 AM, while Nurse B (on a separate team) is independently tasked with administering a *different* rescue medication at 9:00 AM if P’s vital signs deteriorate. Both tasks are mandatory per hospital protocol, and neither nurse coordinates with or checks the other’s work. On a critical day, Nurse A omits the 8:00 AM dose. Unrelatedly, Nurse B—distracted by an emergency elsewhere—also omits the 9:00 AM rescue dose. P dies at 10:00 AM from complications that would have been prevented *either* by A’s timely dose *or* by B’s rescue dose. Crucially, even if A had administered the 8:00 AM dose, B’s subsequent omission would still have occurred (due to B’s unrelated distraction), and P would still have died.  

  ### 2. The Candidate Omission and the Harm  
  **Candidate omission:** Nurse A’s failure to administer the 8:00 AM drug.  
  **Harm:** Patient P’s death at 10:00 AM.  

  ### 3. The Counterfactual Verdict  
  The counterfactual account denies causation: P’s death does not depend on A’s omission. If A *had* administered the drug at 8:00 AM, B would still have omitted the rescue dose at 9:00 AM due to her distraction, and P would still have died. The outcome is overdetermined—P’s death occurs regardless of A’s action—so A’s omission is not a but-for cause. Holding fixed B’s omission (as part of the actual-world context) is standard under standard *ceteris paribus* interpretations; altering it would conflate the counterfactual with backtracking. Thus, no causal link exists between A’s omission and P’s death. (Words: 115)  

  ### 4. The Selection Verdict  
  The selection account affirms causation: A’s omission is a salient departure from an established routine. Administering the 8:00 AM dose is A’s unambiguous, protocol-defined duty—a “fixed point” in the hospital’s normal course of events. Its omission disrupts this baseline expectation independently of B’s subsequent failure, which is itself abnormal but not a normative substitute for A’s role. While P’s death is overdetermined, the selection framework treats A’s breach as a cause because it is a discrete deviation from what was standardly required *of A* (per Hart and Honoré’s emphasis on role-specific norms). The verdict arises from institutional routines, not moral blame: A’s job was to act, and her failure is a non-redundant causal factor when assessed against the background of expected operations. (Words: 120)  

  ### 5. The Feature Doing the Work  
  The divergence stems from **structural overdetermination with independent backup protocols**. The hospital’s system creates two independent, norm-governed opportunities to prevent harm (A’s duty and B’s duty), neither of which relies on the other. This allows the counterfactual account to treat B’s omission as a *preempting* cause that severs dependence on A’s omission, while the selection account treats each omission as a distinct, norm-violating cause because each breaches a separate baseline expectation. The independence ensures that B’s failure is not triggered by A’s omission (avoiding backtracking) and that A’s role remains a self-contained “default” routine, making her omission a non-redundant candidate for causal selection. (Words: 112)  

  ### 6. Removing the Feature  
  If the protocols were interdependent (e.g., B’s duty *only* activates if A fails), the accounts converge. The counterfactual test now affirms causation: without A’s omission, B’s task wouldn’t exist, so P’s death depends on A’s failure. The selection account still affirms causation (A’s omission breaches routine), but the structural change eliminates overdetermination. Without independence, B’s omission is no longer a preempting cause, so the counterfactual theorist must accept A’s omission as a cause. (Words: 90)  

  ### 7. The Counterfactual Theorist’s Reply  
  The counterfactual theorist could argue that A’s omission *is* part of the causal chain: it removes a barrier to harm that B’s omission then exploits, making A’s inaction a contributing cause. They might reframe the scenario by noting that if A had acted, P’s vulnerability at 9:00 AM would have been reduced, making B’s omission non-lethal (though this violates *ceteris paribus* by altering B’s context). Alternatively, they could adopt a contrastive approach, claiming A’s omission caused death *rather than survival* only if B acted—but here, B’s inaction was certain. However, both moves fail: the first requires illegitimate backtracking (changing B’s distraction), while the second still shows no dependence *in this world*. **The reply does not succeed because it cannot establish but-for dependence without compromising standard holding-fixed constraints.** (Words: 145)
