answer: |-
  Your historical litany misses the crucial nuance that sophisticated realism demands. We don't commit holistically to *every* element of past theories; realism is selective. Take Fresnel: his *equations* for diffraction and polarization, the *structural relations* governing light's behavior, were retained and embedded in Maxwell's electromagnetism and later QED. The ether was an *idle posit* – a flawed ontological carrier for those enduring, predictively essential mathematical structures. Similarly, phlogiston and caloric were speculative *substances* posited to explain conservation principles, but the core *laws* they were meant to underpin (like mass conservation or heat flow relationships) were progressively refined, not abandoned.

  The pessimistic induction’s "base rate" fallacy lies in treating all discarded theories as equivalent to our current mature ones and ignoring selective retention. Theories like Newtonian mechanics weren't *centrally false* in their *working posits* – the inverse-square law *genuinely* described observable planetary motion within its domain. Its limitations emerged at new scales, but the predictively successful core wasn't a "false positive"; it was *approximately true* for the phenomena it addressed. The miracle is that our *most* mature theories – QED, general relativity – make novel, high-precision predictions across *unprecedented* domains. To claim their central working structures (like quantum fields or spacetime curvature) are likewise false, despite this robust success, *is* to invoke a miracle of unexplainable effectiveness. History shows discarded *frameworks*, not the wholesale failure of well-confirmed, essential theoretical content.
