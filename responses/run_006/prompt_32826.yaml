answer: |-
  ## The Villanelle of the Discounted Will

  **Refrain 1 (Planner - Long-Run Self):** *This time, I will adhere to the design.*  
  **Refrain 2 (Doer - Short-Run Self):** *But now I choose the pleasure, swift and near.*  
  The future glows, a disciplined incline.

  I chart the course, draw boundaries clear and fine,  
  Commit to labor, banish fleeting cheer.  
  **This time, I will adhere to the design.**

  The tempting fruit seems distant, less divine,  
  A minor speck, no cause for present fear.  
  *But now I choose the pleasure, swift and near.*

  Tomorrow's gain holds value, fits the line  
  Of prudent steps resolving every year.  
  **This time, I will adhere to the design.**

  The moment looms, the present claims its shrine,  
  Tomorrow's weight dissolves and disappears.  
  *But now I choose the pleasure, swift and near.*

  Regret ascends, a bitter, sharpened vine,  
  As costly impulse triumphs, crystal-clear.  
  **This time, I will adhere to the design.**  
  *But now I choose the pleasure, swift and near.*

  **One shadow split across the shifting now,**  
  **Borrowing resolve from who I disavow.**

  ---

  **Committed Note on Theoretical Liberties:**

  The poem adheres closely to the core mechanics of hyperbolic discounting (Ainslie, Laibson) and the planner-doer conflict. The alternating refrains explicitly model preference reversal: the planner's commitment (Refrain 1) dominates in the distant future, but as the tempting reward nears, the doer's valuation spikes hyperbolically, overturning the plan (Refrain 2). The cycle of resolution -> temptation -> reversal -> regret -> new resolution is mapped onto the tercets.

  The key liberty lies in the **personification and degree of agency** granted to the "planner" and "doer." The poem treats them as distinct voices battling for control. While this is a common and powerful pedagogical and narrative device within behavioral economics (e.g., Thaler & Shefrin's "planner/doer," Fudenberg & Levine's "dual-self"), it's a simplification. Strictly speaking, hyperbolic discounting describes a *single* agent whose discount function changes shape over time relative to delays, leading to dynamically inconsistent choices. There isn't truly a separate "planner self" making promises; it's the same agent at time *t* making choices for *t+n* that the agent at *t+n* won't follow when *n* becomes very small.

  I chose this personification for two reasons:
  1.  **Poetic Necessity & Clarity:** The villanelle form demands two distinct, contrasting voices for the refrains to create the intended dramatic tension and mirror the *experience* of internal conflict. Depicting a single agent whose preferences merely *shift* is less visceral and harder to structure within this form.
  2.  **Capturing the Phenomenology:** The *feeling* of internal conflict, of one part of oneself making resolutions another part breaks, is central to the lived experience of weakness of will explained by hyperbolic discounting. The planner/doer metaphor, while not neurologically literal, powerfully captures this subjective reality and the models built to describe it.

  The closing couplet explicitly addresses the theoretical reality behind the personification: they are "One shadow" (a single agent) temporarily fragmented ("split across the shifting now") by hyperbolic discounting, and the planner's resolutions are indeed "Borrowing resolve from who I disavow" – making commitments that rely on the future self's compliance, a compliance the future self, when it becomes the present self, predictably fails to deliver. This acknowledges the liberty while grounding it in the underlying theory. The poem leans on the contested *metaphor* of multiple selves but accurately depicts the *mechanism* and *consequences* of hyperbolic discounting.
