prompt: |-
  ok so im a high school student and i play alot of rpgs, and i keep running into games with karma or honor meters (rdr2, infamous, mass effect, that kind of thing). they all seem to treat karma like a number that goes up when you pick the "good" quest option and down when you steal or kill, and then npcs react differently or you get a different ending. i want to know whether the actual philosophical idea of karma as a theory of moral desert — the one where actions have fitting consequences, your intention matters and not just the outcome, suffering in this life can be payback for something in a past life, and the whole cycle of rebirth is something you're trying to get out of — actually translates into that vocabulary, or whether games are just using the word for something totally different.

  you're a professional philosopher who also actually knows game design. restate the real theory of karma as moral desert in the vocabulary of game mechanics i'd understand: meters, xp, quest flags, hidden stats, rng, save files, new game plus, permadeath, npc reputation, endings. do it as faithfully as you can, not just as a loose analogy. if different traditions (hindu, buddhist, etc.) differ in ways that matter for the translation, flag that. then give me the residue report: which parts of the theory map cleanly, which parts you had to fudge or distort to fit, and which parts have no counterpart at all in how games handle karma. and be honest about whether the stuff that doesn't survive means games are getting karma wrong, or whether the philosophical idea is trying to do something a game system can't even express.

  think carefully, and maybe brainstorm the translation before you commit to it. if my whole framing is off, tell me, but still do the translation first.
