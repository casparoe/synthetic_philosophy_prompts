prompt: |-
  I'm about to start a unit on consciousness, and I keep running into the same frustrating move in both directions: people argue about whether phenomenal consciousness and access consciousness come apart by pointing at a single paradigm — blindsight, backward masking, change blindness, the partial-report paradigm, no-report binocular rivalry — and reading it as decisive, while quietly helping themselves to exactly the distinction the paradigm was supposed to settle. Before I read any more of that back-and-forth, I want the full specification on the table. Write the desiderata that any adequate account of the relationship between access consciousness and phenomenal consciousness must meet.

  For each desideratum, give the case or consideration that forces it — an empirical finding the account must respect or a conceptual distinction it cannot collapse — and say why it is a requirement rather than a preference. I particularly want the list to handle: the fact that report is itself a task with its own memory and attention demands, so evidence for phenomenality is always filtered through access; the apparent mismatch between the felt richness of experience and the sparse contents that survive full report; and the question of what it even means for a state to be phenomenally conscious but inaccessible to the subject's later reasoning, if its content can't be put to any cognitive use. Mark which desiderata are non-negotiable for any serious view and which are commitments of particular camps. Then flag any pairs or larger subsets of desiderata you suspect cannot be jointly satisfied, and say exactly what the conflict is. Finally, score global workspace theory briefly against the list, but keep the weight on the criteria — the scorecard is only a sanity check, since I'll use the list to structure the seminar.

  Open with a one-sentence statement of the central tension any such theory must resolve, then give the numbered desiderata. Hard limit: 900 words.
reasoning: |-
  Hmm, the user is preparing to teach a unit on consciousness and is frustrated with circular arguments about phenomenal vs. access consciousness. They've encountered too many discussions where scholars use paradigms like blindsight or binocular rivalry as decisive evidence while implicitly relying on the very distinction they're trying to prove. They want a clear set of desiderata - requirements that any serious theory must address - before diving deeper into the literature.

  I need to create a comprehensive list of desiderata that addresses their specific pain points: the mediation of report through cognitive processes, the richness vs. sparsity paradox, and the conceptual puzzle of what "inaccessible phenomenality" even means. Each desideratum must be grounded in empirical findings or conceptual necessities, with clear justifications for why they're requirements rather than preferences.

  The user wants me to flag which desiderata are non-negotiable versus camp-specific, identify potential conflicts between them, and include a brief sanity check of global workspace theory. All within 900 words, starting with a one-sentence encapsulation of the core tension.

  Looking at their needs: As an educator, they're designing a seminar and want to avoid superficial debates. They need structural tools to help students critically evaluate theories. Their frustration suggests they value conceptual rigor and want to bypass common rhetorical traps in consciousness studies.

  For the desiderata, I'll organize them into several key areas: First, paradigms like blindsight and partial-report that create separation intuitions. Second, the methodological constraints involving report mediation and richness-sparsity mismatches. Third, the conceptual requirements about cognitive isolation and functional leverage. Fourth, considerations about report's role as evidence. And fifth, how to handle borderline cases.

  I need to identify conflicts - particularly between the richness intuition (#5) and the functional leverage requirement (#7), and between methodological constraints (#8) and the demand for independent evidence of phenomenality (#9). These tensions reveal why the debate persists.

  For global workspace theory scoring: It clearly satisfies separation (#1-4) and functional leverage (#7) by design, but struggles with richness (#5), cognitive isolation (#6), and report mediation (#8). This explains both its appeal and limitations.

  The response must be tightly structured: central tension statement first, then numbered desiderata with forced-by cases and requirement justifications, followed by conflict analysis and brief GWT evaluation. I'll mark non-negotiables with asterisks and be precise about where positions diverge.
answer: |-
  Here is your desiderata list, structured to avoid circularity traps:

  **Central Tension:** Any theory must resolve how phenomenally conscious states relate to cognitive availability (access) despite evidence for phenomenality always being mediated by access-dependent report, while accommodating the intuition of experience exceeding reportable content.

  1.  **\*Separation Intuition (Blindsight):** Must allow for states with relevant content (e.g., visual stimulus location/identity) that demonstrably guide behavior (forced-choice guessing) but lack phenomenal character (subject reports no visual experience). *Forced by:* Type 1 blindsight. *Requirement:* Distinguishes functional visual processing from subjective seeing. Non-negotiable.

  2.  **\*Separation Intuition (Masked Priming/Partial Report):** Must allow for states with phenomenal character that are nonetheless *briefly unavailable* for standard report, reasoning, or deliberate action *at the time*. *Forced by:* Backward masking (subjectively seen but unreportable prime affecting reaction time), Sperling partial report (iconic memory decay before full report). *Requirement:* Shows phenomenality can precede or temporarily exceed access capacity. Non-negotiable.

  3.  **Access Without (Reported) Phenomenology? (Attended Unseen):** Must account for how intense attentional processing (e.g., in change blindness, inattentional blindness) can occur on stimuli that subjects fail to report *seeing* phenomenally. *Forced by:* Change blindness trials where subjects scrutinize the changing region yet deny seeing the change. *Requirement:* Prevents collapsing access into phenomenality; suggests access resources can be allocated without guaranteeing phenomenal awareness. Non-negotiable.

  4.  **\*Dissociation Under Constant Stimulation (No-Report Paradigms):** Must explain how neural/physiological signatures differ when identical sensory input is phenomenally experienced vs. not, *without relying on subjective report as the measure*. *Forced by:* No-report binocular rivalry (neural differences persist when rivalrous perception is inferred via motor tracking, not verbal report). *Requirement:* Provides evidence for phenomenality independent of explicit report demands. Non-negotiable.

  5.  **\*Richness vs. Sparsity (Iconic Memory/Inattentional Blindness):** Must reconcile the subjective *richness* of perceptual experience with the demonstrable *sparsity* of details reportable in full-report paradigms or missed under inattention. *Forced by:* Sperling (rich icon, sparse report), inattentional blindness (gorilla unseen). *Requirement:* Addresses the core phenomenological puzzle; cannot simply equate accessible content with phenomenal content. Non-negotiable.

  6.  **Cognitive Isolation Puzzle:** Must clarify what it *means* for a state to be phenomenally conscious yet cognitively isolated – incapable of guiding deliberation, belief formation, or intentional action *at all*. *Forced by:* Conceptual requirement arising from desiderata 2 & 5. *Requirement:* Prevents an explanatorily useless notion of "pure" inaccessible phenomenality; phenomenality must have *some* connection to potential cognitive leverage, however fleeting or limited. Non-negotiable conceptual constraint.

  7.  **Functional Leverage:** Must explain how phenomenality *enables* specific cognitive functions (e.g., flexible planning, novel action) that unconscious representations cannot support. *Forced by:* Contrast between blindsight (limited, stimulus-bound behavior) and normal vision (flexible use). *Requirement:* Gives phenomenality a functional role. Commitment of functionalist/access-inclusive camps; non-negotiable for them, potentially rejected by non-functionalist phenomenal realists.

  8.  **\*Report Mediation Constraint:** Must acknowledge that *all* empirical evidence for phenomenality in others (verbal report, button press, confidence rating) relies on access mechanisms (attention, working memory, response systems). *Forced by:* Methodological necessity. *Requirement:* Prevents treating report as a direct "window" on raw phenomenality; mandates explaining the access-phenomenology link. Non-negotiable.

  9.  **Independent Evidence for Phenomenality:** Must provide criteria or evidence for attributing phenomenality *other than* successful report/access itself. *Forced by:* Desideratum 8 & the need to avoid circularity. *Requirement:* Allows distinguishing genuine phenomenal cases from mere potential access or complex unconscious processing. Commitment of phenomenal realist/separatist camps; access-first views may reject need.

  10. **Borderline Cases (Degraded Access):** Must handle cases of degraded or ambiguous access (e.g., tip-of-the-tongue, fringe consciousness, drowsiness, some anesthesia) without arbitrary boundaries. *Forced by:* Empirical reality of graded transitions. *Requirement:* Ensures theory applies across the spectrum of conscious states. Non-negotiable for comprehensive accounts.

  **Conflicting Desiderata:**

  *   **5 (Richness) vs. 7 (Functional Leverage):** If phenomenality is vastly richer than access (#5), how does this rich content provide functional leverage (#7) if most of it *can't* be leveraged cognitively? Theories must either limit richness, posit leverage from the *potential* for access, or downplay functional leverage.
  *   **8 (Report Mediation) vs. 9 (Independent Evidence):** If all evidence requires access (#8), how can truly independent evidence for phenomenality (#9) be found? This tension fuels the core debate. Separatists must find proxies (e.g., neural NCCs); access-first views deny #9 is necessary.

  **Global Workspace Theory (GWT) Scorecard:**

  *   **Excels at:** 1, 2 (explains temporary inaccessibility), 3 (access = broadcasting, not phenomenality), 7 (function = global availability). Clearly satisfies functional leverage.
  *   **Struggles with:** 5 (often equates accessible content with phenomenal content, downplaying richness), 6 (struggles to define phenomenality beyond access), 8 (acknowledged but report is primary evidence), 9 (rejects need).
  *   **Handles:** 4 (uses NCCs like sustained ignition as evidence), 10 (access can be partial/degraded).

  GWT prioritizes access and function (1-4,7) but faces challenges accommodating richness (5) and defining inaccessible phenomenality (6,9), directly reflecting the core tension. Its strength is explaining how consciousness enables cognitive flexibility; its weakness is fully capturing the qualitative character and potential excess of phenomenology over access.
