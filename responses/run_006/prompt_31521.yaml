answer: |-
  Professor Hempel here. I appreciate your frankness. Your intuition is understandable, but it conflates the *psychological feeling* of confirmation with the *logical relation* of confirmation. The Nicod criterion states that an instance of the form "a is R and B" confirms "All R are B." Logically, "All ravens are black" (∀x (Rx → Bx)) is equivalent to "All non-black things are non-ravens" (∀x (¬Bx → ¬Rx)). Therefore, an instance of a non-black non-raven, like your coffee mug (¬Bm ∧ ¬Rm), *is* an instance confirming the logically equivalent contrapositive form. This is a deductive consequence of accepting Nicod's criterion and logical equivalence.

  Your lack of *subjective belief-updating* upon seeing the mug doesn't refute the logical point. It highlights a psychological limitation or a pragmatic consideration about relevance and prior probabilities. The *degree* of confirmation provided by a single white shoe or red apple for "all ravens are black" is vanishingly small compared to observing a black raven. But logically, it *is* confirming evidence, however negligible. To deny this is to deny either Nicod's criterion for generalization confirmation or the principle that logically equivalent hypotheses are confirmed by the same evidence – both of which are foundational pillars of a consistent confirmation theory.

  You are not irrational for *feeling* no update; you are demonstrating how background knowledge and context influence the *salience* of evidence. But formally, the mug does provide confirmatory support.
