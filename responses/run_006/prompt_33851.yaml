prompt: |-
  I am a professor of philosophy and a member of my university's academic integrity board. We adjudicate cases of plagiarism, exam cheating, falsified data, and unauthorized collaboration, and we recommend sanctions up to and including expulsion. The board's deliberations almost always turn on character: we ask whether the student shows remorse, whether this was a one-time lapse or points to a pattern, whether the student is the kind of person who would do this again. I have taught the situationist critique of virtue ethics for years — the work of John Doris and Gilbert Harman, the Milgram obedience experiments, the Darley and Batson Good Samaritan study, the finding that discovering a dime in a phone booth dramatically increases helping behavior — and I have grown increasingly uncomfortable sitting in these hearings watching my colleagues draw exactly the kind of cross-situational character inferences that the situationist evidence calls into question.

  But I cannot simply tell the board that stable character traits are a fiction and we should stop making judgments. We still have to decide cases. What I need is a decision procedure that takes the situationist critique seriously without being paralyzed by it.

  Please write me a procedure our board can follow, grounded in what the situationist critique actually licenses and what it does not. The procedure should be a sequence of questions we ask about each case, in order, with guidance on what counts as a sufficient answer to each question. It should force us to check for situational explanations before we reach for character explanations, and it should tell us at what point the residual — what remains after we have accounted for the situation — is serious enough to warrant a sanction. It should flag the steps where the procedure cannot eliminate judgment and a human being must decide.

  Then apply the procedure to three hypothetical cases:

  1. A first-semester freshman copied a paragraph from an online source without attribution in a paper for a course in which the professor never discussed citation standards, the class had four hundred students, and the student had no prior record.

  2. A senior paid someone to write a paper for them in a small upper-division seminar whose professor had discussed academic integrity on the syllabus and in the first class session, and the student had previously been warned for minor plagiarism in another course.

  3. A student with a clean prior record texted exam answers to a friend during a remotely proctored exam. The course had shifted to remote format mid-semester because of a public health emergency, the exam instructions did not address collaboration, and the student had no prior infractions.

  For each case, tell me where the procedure lands, and flag whether the answer is one the board will find uncomfortable. Finally, tell me what the procedure cannot do: what kinds of cases it will mishandle, what assumptions it smuggles in, and what a virtue ethicist would say we have lost by adopting it.
reasoning: |-
  Okay, the user is a philosophy professor on an academic integrity board. They're grappling with how to reconcile the situationist critique of virtue ethics with the practical need to adjudicate cases. The situationist perspective, drawing from thinkers like Doris and Harman, argues that behavior is heavily influenced by situational factors rather than stable character traits. Yet, the board often focuses on assessing a student's character—remorse, patterns of behavior, likelihood of reoffending.

  The user needs a procedural framework that integrates situationist insights without leading to decision paralysis. They want a step-by-step process that forces consideration of situational factors before assessing character. The procedure must specify when residual factors warrant sanctions and highlight where human judgment is unavoidable.

  Let me outline a decision procedure. Start with establishing the violation—confirming that misconduct occurred. Then, assess situational factors: environmental pressures (course size, clarity of instructions, external stressors), institutional context (prior warnings, departmental norms), and psychological influences (cognitive load, emotional state). This step requires evidence, not speculation.

  Next, evaluate residual agency. After accounting for situational pressures, what deliberate choices did the student make? This involves determining if the misconduct required planning or bypassed clear safeguards. The key is to see if the act reflects an intentional disregard for integrity despite manageable pressures.

  Then, examine the student's response. Do they acknowledge the violation? Show understanding of why it was wrong? Propose concrete steps to prevent recurrence? This step should focus on their learning and future behavior, not just remorse.

  Finally, determine sanctions based on residual agency, response quality, and institutional consistency. Sanctions should be proportional and aim for restoration, not retribution.

  Applying this to the cases: The freshman likely had high situational pressures (large class, no instruction) and low residual agency. A warning and education would suffice. The senior, with clear warnings and prior misconduct, shows high residual agency. Probation or suspension seems appropriate. The remote exam case has mixed factors—emergency context but unclear instructions. Educational sanctions fit best.

  The procedure avoids character judgments but can't eliminate all subjectivity. Virtue ethicists would argue it neglects moral development. Limitations include handling ambiguous intent or systemic issues. It assumes situational factors are identifiable, which isn't always true.

  This approach shifts focus from "what kind of person" to "what circumstances led to this," aligning with situationism while maintaining actionable outcomes.
answer: |-
  Here is a decision procedure grounded in the situationist critique, designed to minimize reliance on inferences about stable character traits while enabling practical adjudication. It prioritizes situational analysis and focuses on concrete actions, patterns of behavior (as observable events, not traits), and institutional responsibilities.

  **Academic Integrity Board Situational Decision Procedure (AIB-SDP)**

  1.  **Establish Fact of Violation:** *"Is there clear and convincing evidence that a specific academic integrity violation occurred?"*
      *   **Guidance:** Requires objective evidence (e.g., Turnitin report, proctoring software flag, witness testimony, admission). If "No," dismiss the case. If "Yes," proceed.
      *   **Judgment Required?** Minimal (fact-finding based on evidence).

  2.  **Analyze Situational Pressures:** *"What specific situational factors demonstrably present at the time of the violation could significantly increase the likelihood of *any* student committing this type of violation?"*
      *   **Guidance:** Systematically examine:
          *   **Environmental:** Ambiguous/unclear instructions? Unusual stress (health crisis, personal emergency)? High-stakes pressure? Course size/impersonality? Remote proctoring challenges? Technical difficulties? Time pressure? Resource access issues?
          *   **Instructional:** Were relevant academic integrity standards explicitly taught, reiterated, and easily accessible *for this specific assignment/exam*? Was the expectation clear and unambiguous?
          *   **Institutional:** Was the student adequately informed *in general* about university policies? (Assume baseline institutional responsibility unless evidence shows deliberate avoidance).
          *   **Personal Context (Use Sparingly):** *Only* consider documented, severe, contemporaneous crises (e.g., hospitalization, death of immediate family) *directly impacting* the ability to meet standards *at that specific moment*. Avoid vague "stress" claims without strong evidence. *Focus on how the situation constrained options or clouded judgment, not on excusing the act.*
      *   **Sufficient Answer:** A list of concrete, evidence-based situational factors relevant to the violation type. Avoid speculation.
      *   **Judgment Required?** Moderate (Assessing relevance and weight of situational factors based on evidence).

  3.  **Assess Residual Agency:** *"After accounting for the situational pressures identified, what degree of deliberate choice or bypassing of safeguards was involved in the violation?"*
      *   **Guidance:** Focus on the *act itself* as an event, not the actor's character:
          *   **Negligence vs. Intent:** Did the situation make honest error plausible (e.g., unclear citation rules in Step 2), or did the act require deliberate steps unlikely to be accidental (e.g., paying for a paper, texting specific answers)?
          *   **Bypassing Safeguards:** Did the student actively circumvent clear rules or procedures (e.g., ignoring explicit warnings, disabling proctoring software)?
          *   **Alternatives Available:** Were there readily available, reasonable alternative actions within the situation (e.g., asking for clarification, requesting an extension, simply leaving the unattributed source out)?
      *   **Sufficient Answer:** An assessment of the *act's deliberateness* within the context established in Step 2. Categorize as: Low (Primarily situation-driven, minimal deliberate bypass), Moderate (Situational pressures present, but deliberate action required), or High (Deliberate action despite minimal situational pressure or bypassing clear safeguards).
      *   **Judgment Required?** High (Balancing situational factors against the nature of the act).

  4.  **Evaluate Pattern (Behavioral, Not Characterological):** *"Is there documented evidence of *previous, similar* academic integrity violations by this student?"*
      *   **Guidance:** Look *only* at the official record. Prior violations are relevant *not* as proof of a "dishonest character," but as evidence of: (a) failure to learn from previous sanctions/education, or (b) a specific behavioral pattern in academic contexts that requires a different institutional response to promote compliance. Ignore assumptions about "likely" prior undetected violations.
      *   **Sufficient Answer:** Yes (specify documented incidents) or No.
      *   **Judgment Required?** Minimal (Reviewing official records).

  5.  **Assess Response & Proposed Amends:** *"Does the student acknowledge the specific violation (without requiring speculation about motives)? Do they demonstrate understanding of *why* it violated standards? Do they propose concrete, feasible steps to ensure it won't happen again?"*
      *   **Guidance:** Focus on observable statements and actions:
          *   **Acknowledgment:** Clear admission of the factual violation.
          *   **Understanding:** Explanation showing grasp of *why* the act violated academic integrity rules (e.g., "I understand that not citing sources misrepresents others' work as my own," not just "I'm sorry I got caught").
          *   **Future Prevention:** Specific, practical plans (e.g., "I will use the writing center for citation help," "I will clarify collaboration rules with every professor," "I will seek an extension if overwhelmed").
          *   **Avoid:** Demands for displays of "remorse" or inferences about sincerity. Focus on the *substance* of the response and its practicality. Acceptance of responsibility is key, not emotional performance.
      *   **Sufficient Answer:** Yes/No for each element (Acknowledge, Understand, Plan). Weigh the substance of the plan.
      *   **Judgment Required?** Moderate (Assessing the substance and feasibility of understanding and plans).

  6.  **Determine Sanction & Remediation:**
      *   **Guiding Principles:**
          *   Sanctions should primarily reflect **Residual Agency** (Step 3) and **Pattern** (Step 4).
          *   **Situational Factors** (Step 2) primarily mitigate sanction severity or inform remediation, *not* excuse the violation entirely (barring extreme, documented incapacity).
          *   **Response** (Step 5) informs remediation and probationary terms, *not* core sanction severity. A good response doesn't negate a serious act, but suggests education might work.
          *   Prioritize **Educational/Remedial Sanctions** (e.g., integrity workshop, rewriting assignment, reduced course grade, citation tutorial) over purely punitive ones whenever possible, especially where Situational Factors were high or Residual Agency was low.
          *   **Punitive/Protective Sanctions** (e.g., course failure, suspension, expulsion) are justified primarily by High Residual Agency, documented Patterns (especially ignoring previous remediation), or acts that fundamentally undermine the assessment process (e.g., paying for a paper, large-scale cheating).
      *   **Decision Framework:**
          1.  **Remediation Required?** If Situational Factors included lack of clear instruction or student understanding, mandate specific education *regardless* of other factors.
          2.  **Base Sanction:** Based on Residual Agency (Low: Primarily Remediation/Warning; Moderate: Significant Grade Penalty + Remediation; High: Course Failure or above + Remediation).
          3.  **Adjust for Pattern:** Documented prior similar violation? Escalate sanction level (e.g., Moderate -> High; High -> Suspension/Expulsion Consideration). No prior record? Maintain or slightly mitigate base sanction.
          4.  **Integrate Response:** Good Response (Acknowledge+Understand+Feasible Plan)? Focus remediation, potentially reduce punitive aspect (e.g., suspension to probation). Poor Response? Intensify remediation requirements and monitoring (probation).
          5.  **Formal Outcome:** Assign specific sanction(s) and remediation requirements.
      *   **Judgment Required?** High (Applying the framework to the specific findings).

  ---

  **Application to Hypothetical Cases:**

  **Case 1: Freshman's Unattributed Paragraph**
  *   **Step 1:** Yes, violation occurred (plagiarism detected).
  *   **Step 2:** **High Situational Pressures.** Large class (400 students), professor never discussed citation standards (critical instructional factor), likely first exposure to university-level expectations. No evidence of unusual personal crisis.
  *   **Step 3:** **Low Residual Agency.** Action (copying without attribution) could easily stem from ignorance/lack of clarity in this situation. No evidence of deliberate bypassing (e.g., hiding source).
  *   **Step 4:** **No Pattern.** Clean prior record.
  *   **Step 5:** (Assume typical freshman response: acknowledges, may not fully understand "why" beyond "it's the rule," needs guidance on plan).
  *   **Step 6:**
      *   **Remediation Required:** Mandatory citation workshop/meeting with writing center.
      *   **Base Sanction:** Low Residual Agency -> Primarily Remediation/Warning.
      *   **Adjust for Pattern:** No prior record -> Maintain.
      *   **Integrate Response:** Needs education on "why" -> Build understanding into remediation.
      *   **Outcome:** **Formal Warning, Mandatory Citation Tutorial/Rewrite (if feasible), Grade Penalty on assignment (minor, e.g., zero for that paragraph).** *Uncomfortable?* Yes, for colleagues who want to see "remorse" or infer laziness/dishonesty. The procedure prevents harsh punishment for a situation-driven lapse.

  **Case 2: Senior Paid for Paper**
  *   **Step 1:** Yes, violation occurred (evidence of contract cheating).
  *   **Step 2:** **Low Situational Pressures.** Small seminar, professor explicitly discussed academic integrity (syllabus + first class). No evidence of unusual external pressures beyond typical academic workload.
  *   **Step 3:** **High Residual Agency.** Paying for a paper requires deliberate, multi-step action. Actively bypasses clear institutional safeguards and expectations. Reasonable alternatives existed (ask for help, request extension, write own work).
  *   **Step 4:** **Pattern.** Documented prior warning for minor plagiarism (shows failure to learn/previous issue).
  *   **Step 5:** (Assume possible response: may acknowledge factually, but downplay or make excuses; understanding may be superficial; plan might be vague).
  *   **Step 6:**
      *   **Remediation Required:** Mandatory in-depth academic integrity seminar/consultation.
      *   **Base Sanction:** High Residual Agency -> Course Failure or above.
      *   **Adjust for Pattern:** Prior similar violation -> Escalate sanction (Course Failure insufficient). Consider suspension (1 semester).
      *   **Integrate Response:** Likely poor response -> Intensify remediation/monitoring. Mandate probation with specific conditions (e.g., all future papers reviewed pre-submission).
      *   **Outcome:** **Course Failure, Suspension for 1 Semester, Mandatory Intensive Academic Integrity Program, Probation upon return.** *Uncomfortable?* Possibly for colleagues hesitant to suspend/expel, but the procedure justifies it based on High Agency and Pattern, not character judgment. Others might want harsher punishment based on "dishonest character."

  **Case 3: Texted Answers During Remote Proctored Exam**
  *   **Step 1:** Yes, violation occurred (proctoring flag/text evidence).
  *   **Step 2:** **Significant Situational Pressures.** Shifted to remote mid-semester due to emergency (novelty, potential tech/home stress), exam instructions did *not* address collaboration (critical ambiguity - created gray area). Clean prior record.
  *   **Step 3:** **Moderate Residual Agency.** Texting answers is deliberate. However, the lack of explicit prohibition on collaboration creates ambiguity ("Was this *really* forbidden?"). Did not bypass clear safeguards (unless texting was explicitly banned by university policy). Alternatives (ask prof during exam? stay silent?) existed but situational pressure (emergency context, ambiguity) reduces deliberateness.
  *   **Step 4:** **No Pattern.** Clean prior record.
  *   **Step 5:** (Assume response: acknowledges texting, expresses confusion due to lack of instruction, proposes always clarifying rules in future).
  *   **Step 6:**
      *   **Remediation Required:** Educational discussion clarifying remote exam expectations/collaboration policies.
      *   **Base Sanction:** Moderate Residual Agency -> Significant Grade Penalty + Remediation.
      *   **Adjust for Pattern:** No prior record -> Maintain.
      *   **Integrate Response:** Good response (acknowledges, confusion plausible, specific plan) -> Focus on remediation/grade penalty.
      *   **Outcome:** **Significant Grade Penalty on Exam (e.g., zero for that portion, partial course grade reduction), Mandatory Meeting to Discuss Remote Exam Policies.** *Uncomfortable?* Yes. Colleagues may see texting as blatant cheating warranting harsher punishment (course failure) and infer dishonesty. The procedure highlights the ambiguous context and lack of explicit instruction as mitigating factors, focusing on correcting the misunderstanding.

  ---

  **What the Procedure Cannot Do (Limitations & Critiques):**

  1.  **Eliminate Judgment:** Steps 2 (Situational Pressures), 3 (Residual Agency), and 6 (Sanction) inherently require significant human judgment in weighing evidence and applying the framework. It structures judgment but doesn't replace it with an algorithm.
  2.  **Ambiguous Intent:** It struggles with cases where intent is genuinely murky or where the line between severe negligence and deliberate cheating is very thin, even after situational analysis. Judgment calls remain crucial.
  3.  **"First Strike" for Severe Offenses:** While Pattern (Step 4) adjusts sanctions, the procedure still allows severe sanctions (like course failure or suspension) for a single, high-agency act (like buying a paper) even without prior record. Some may argue this is too harsh for a "first offense," while others (and the procedure) see the act itself as sufficiently egregious.
  4.  **Systemic Issues:** It focuses on the individual student and the immediate situation. It doesn't directly address broader systemic failures (e.g., endemic poor citation instruction university-wide, unrealistic workloads that incentivize cheating) that create recurring situational pressures. Addressing these requires institutional action beyond the board's scope.
  5.  **Assumptions Smuggled In:**
      *   **Agency Threshold:** It assumes we *can* meaningfully distinguish "residual agency" after situational analysis. Hard situationists might argue situational forces always dominate, making this step illusory.
      *   **Responsibility:** It assumes individuals retain *some* responsibility for actions even under pressure, rejecting pure determinism. This is a philosophical commitment.
      *   **Educability:** It assumes remediation can change future *behavior* (focusing on skills, knowledge, environmental management) even if "character" is unstable. This is an empirical hope.
      *   **Institutional Primacy:** It implicitly prioritizes maintaining academic standards and the integrity of credentials over purely rehabilitative or therapeutic goals for the student.
  6.  **The Virtue Ethicist's Critique:** A virtue ethicist would argue the AIB-SDP loses something fundamental:
      *   **Moral Development:** It abandons the project of fostering virtuous character (honesty, integrity, intellectual humility) in students, settling merely for rule-compliance and behavioral management.
      *   **Understanding Motives:** By de-emphasizing motive, remorse, and sincerity (Step 5), it fails to engage with the student's *moral understanding* and *reasons for acting*, which are central to virtue ethics. An apology without genuine remorse is hollow for a virtue ethicist.
      *   **Holistic Judgment:** It replaces holistic judgment about the person and their moral growth with a fragmented, bureaucratic checklist focused on external factors and observable acts, neglecting the inner state and potential for genuine reform.
      *   **Exemplars and Context:** Virtue ethics often considers context deeply but integrates it into an understanding of what a "good student" or "honest scholar" would do *in that situation*. The AIB-SDP explicitly avoids defining such ideals or judging proximity to them.

  The AIB-SDP offers a pragmatic, situationally-aware framework for making necessary decisions under uncertainty about character. It prioritizes fairness by demanding scrutiny of context and focusing on actions and patterns, but it consciously sacrifices the virtue ethicist's deeper aspiration to judge and nurture moral character. It accepts that institutions must act to protect standards based on the best available (imperfect) evidence and reasoning, acknowledging the limits imposed by the situationist critique.
