  Here’s a toast that navigates the tension with warmth, humor, and respect, honoring both her extraordinary character and the humanity of their relationship. It’s structured to land on the couple’s complementary strengths:

  **(Clink glass)**  
  "Alright, settle down! For those who don’t know me, I’m [Your Name], [Brother's Name]’s slightly-less-impressive brother, and today’s designated toastmaster. Now, anyone who’s met [Brother's Name] knows he’s a solid guy – loyal, funny, maybe *too* good at remembering your embarrassing childhood stories. But let’s be honest… the real headline today is who he managed to convince to marry him. [Wife's Name].

  **[Raise glass slightly towards her]**  
  "[Wife's Name], from the moment we met you, it’s been… well, let’s call it *humbling*. Most of us hope we’re decent people. You? You redefine the scale. Running a legal clinic fighting for asylum seekers? Giving away more than most of us *dream* of earning? Having a moral compass that points 'true north' while ours occasionally spins like a dashboard ornament? It’s genuinely awe-inspiring. Truly. To your side of the room – we *get* it. You see a living saint. And honestly? We kinda see it too.

  **[Shift tone slightly, warm humor]**  
  "But here’s the thing about saints… sometimes, us mere mortals just need to know where the *good* tacos are, or argue passionately about whether Die Hard is a Christmas movie, without contemplating the deeper ethical implications of Bruce Willis’s footwear choices. [Brother's Name], remember when Mom tried to donate *all* the Thanksgiving leftovers to the shelter before anyone got seconds? Or when Dad nearly short-circuited trying to calculate the exact carbon offset for driving to the golf course? We love you, [Wife's Name], but you’ve… *elevated* our dinner table conversations. Let’s just say, our family group chat now has significantly more links to worthy causes and slightly fewer memes about cats in hats.

  **[Pivot to the heart – their dynamic]**  
  "And that’s where my brother comes in. Because [Brother's Name], you aren’t just marrying a saint. You’re marrying a whole, brilliant, fierce, *human* woman. And what’s amazing isn’t just [Wife's Name]'s incredible heart – it’s that she chose *you*. You, with your ability to find the perfect level of 'chill'. You, who reminds us that joy isn't always found in grand gestures, but in stupid inside jokes, lazy Sundays, and appreciating the simple, messy, wonderful act of just *being* together.

  **[Key insight – the balance]**  
  "You see, [Brother's Name], you have this superpower. You ground her. Not by dimming her light, God no – but by giving her a place to land that isn’t the front lines. You remind her that sometimes, the most radical act of kindness is letting *yourself* be loved, simply as you are. And [Wife's Name], you… you *lift* him. You challenge him, inspire him, and probably ensure he recycles properly. You make that good heart of his beat with a deeper purpose.

  **[Resolution – the couple, not the philosophy]**  
  "That’s the real magic here. It’s not about sainthood versus slackers. It’s about two people whose strengths don’t compete; they *complete*. You temper each other’s extremes. Where she sees the world that *should* be, you, [Brother's Name], help her navigate the world that *is*. And where he might be content with 'good enough,' you, [Wife's Name], show him what 'extraordinary' looks like. Together, you create something neither could alone: a partnership that’s both deeply good and deeply *human* – full of purpose, yes, but also laughter, comfort, and probably some very intense debates about composting.

  **[Final toast]**  
  "So here’s to [Brother's Name] and [Wife's Name]. May your marriage be as unwavering as your convictions, [Wife's Name], and as effortlessly joyful as your sense of humor, [Brother's Name]. May you never lose your fire for making the world better, and may you always remember to save some of that warmth for each other, for lazy mornings, and for the perfectly imperfect life you’re building together. To the couple who proves that the best kind of love doesn’t require perfection – just perfect balance. Cheers!"

  **Why this works:**

  1.  **Acknowledges Her Goodness Sincerely:** Opens with genuine admiration for her work and character, validating her side.
  2.  **Humor from Family's Perspective:** The jokes target the *family's* adjustment and minor failings ("carbon offset for golf," "leftovers"), not her virtue. It's self-deprecating, not critical of her.
  3.  **Names the Tacticly:** Uses relatable examples (Die Hard, tacos, leftovers) to illustrate the "cost" (the intensity, the shift in normalcy) without judgment. "Elevated our dinner table" and "humbling" frame it positively but honestly.
  4.  **Brother as the Hero:** Positions the brother not as morally lesser, but as essential – the grounding force, the source of simple joy and humanity. His "superpower" is framed as vital to *her* well-being and their relationship.
  5.  **The Balance is the Point:** Explicitly states that their complementary natures ("temper each other's extremes," "complete," not "compete") are the strength of their union. Resolves the tension by showing how they make each other *more* fully human and attractive together.
  6.  **Ends on the Couple & Love:** The final toast focuses solely on their partnership, love, and future, leaving the philosophical observation behind as a setup, not the conclusion.
  7.  **"Perfectly Imperfect":** This final phrase subtly encapsulates the core idea (maximal moral goodness might be "perfect" in one way, but human life requires embracing imperfection) while celebrating *their* unique, balanced union.
  8.  **Respectful Language:** Uses "Saint [Name]" early to disarm, "awe-inspiring," "brilliant, fierce, human woman," "unwavering convictions" – all reinforce deep respect.

  **Deliver it warmly, with genuine smiles, especially when looking at each of them during their respective parts. Pace it naturally – it should fit comfortably in 5 minutes. Good luck!**
