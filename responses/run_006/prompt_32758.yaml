prompt: |-
  I've been working my way through some of the classics in philosophy of language—retirement project, keeps the grey matter ticking over—and I've ground to a halt on a passage in Frege's essay 'The Thought' (1918). I spent forty years in the lab, so I'm used to things that yield to patience and careful measurement, but this has got me proper stuck. I'm reading the Geach translation, and there's a bit where he distinguishes the thought from the assertion of the thought, and he says something like this (I'm paraphrasing, my German is non-existent):

  In an indicative sentence we must separate the thought—the sense—from the act of putting it forward as true. The same thought can appear in a sentence that is not asserted at all. When we say 'if the accused was in Rome, then he did not commit the murder,' neither the antecedent nor the consequent is asserted; each is merely expressed. The thought that the accused was in Rome is the very same thought that would be asserted if one said simply 'the accused was in Rome,' but here it is not asserted. The assertoric force attaches only to the whole conditional.

  Now, I've read around the secondary literature enough to know that this is supposed to be the starting point for the Frege–Geach problem for expressivism—the idea that moral sentences can't express non-cognitive attitudes and still function logically in unasserted contexts like conditionals. But I'm struggling to see exactly how the passage does the work its supposed to do. As I understand it, Frege is talking about truth-conditional content—thoughts that have truth-values—and saying that the same thought can be asserted or unasserted. The expressivist, by contrast, says that the meaning of a moral sentence is the attitude it expresses. So why can't the expressivist just say the same thing Frege says, but with attitudes instead of truth-conditional thoughts? That is, an attitude can be expressed without being held—you can express disapproval of lying in the antecedent of a conditional without actually disapproving. Why isn't that a perfectly adequate response? I feel like I'm missing something important about the role of logic in Frege's picture. What is it about the way Frege sets things up in this passage—the thought as something that can be the bearer of logical relations independently of whether it is asserted—that makes the expressivist's analogous move unavailable to her? Or is the problem not really in this passage at all, and I'm looking in the wrong place?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired scientist with a background in lab work, now diving into philosophy of language, specifically Frege's "The Thought." They're stuck on how Frege's distinction between thought and assertion sets up the Frege-Geach problem for expressivism. 

  Hmm, the user clearly grasps the surface-level issue: Frege says the same thought (truth-conditional content) can be asserted or unasserted, like in conditionals. The user wonders why expressivists can't just apply the same logic—treating moral attitudes as expressible without being held in unasserted contexts. 

  But I sense their deeper confusion lies in the *logical scaffolding* behind Frege's move. Their lab-trained mind expects a clean solution ("why isn't analogizing to attitudes sufficient?"), but philosophy often has hidden wiring. The key is seeing how Frege's "thought" isn't just *content* but a *logical atom*—it must retain identity across contexts to enable inference. 

  Ah, and here's where expressivism stumbles: attitudes aren't truth-apt, so they can't be negated or embedded in truth-preserving ways. If "lying is wrong" expresses boo-lying, what does "if lying is wrong..." express? Boo-lying-in-hypothetical-mode? But logic requires uniform semantic values. 

  The user might also overlook how Geach weaponizes Frege: unasserted contexts *test* whether meaning is truly compositional. Expressivism fails because it can't explain why modus ponens works equally well for "if it rains..." and "if lying is wrong..."—truth-conditional glue vs. attitudinal glue. 

  ...I should emphasize Frege's architectonic view of logic. His "thought" is designed to slot into inferential machinery. Attitudes don't fit those sockets. Maybe a lab analogy: like trying to run a chemical reaction with particles that change properties under conditional "if..." buffers. 

  Secondary literature mentions (Blackburn, Schroeder) will help, but the core is bridging Frege's technical logic to the user's instinct for systematicity. Their "why not attitudes?" question is spot-on—that's exactly where the philosophical knife twists.
answer: |-
  You've pinpointed the exact tension brilliantly – your scientific instinct that "attitudes should work analogously to truth-conditional thoughts" is precisely what expressivists like Blackburn and Gibbard wrestled with. The problem isn't in your reading of Frege's passage; it *is* the core Frege-Geach problem. Let's break down why the expressivist's analogous move faces deep challenges:

  1.  **The Nature of "The Thought" (Sense) for Frege:**
      *   **Truth-Bearers:** Crucially, for Frege, the *Sinn* (Sense) expressed by an indicative sentence *is* the bearer of truth value (*Bedeutung* = Truth Value). A thought *is* the kind of thing that is fundamentally *true* or *false*. This is its defining characteristic.
      *   **Logical Relations:** Because thoughts are truth-evaluable, they stand in logical relations to each other *purely based on their truth conditions*. The thought expressed by 'P' entails the thought expressed by 'P or Q'. The thought 'P & Q' entails the thought 'P'. Contradiction and consistency are defined in terms of possible truth-value assignments.
      *   **Stability & Compositionality:** The thought expressed by "The accused was in Rome" is a *stable*, identifiable semantic unit. Its identity and truth conditions are fixed *independently* of the linguistic context in which it appears (asserted, conditional antecedent, disjunct, negated, etc.). Its contribution to the truth conditions of complex sentences (like the conditional) is determined compositionally based on this stable meaning and logical operators.

  2.  **The Expressivist Proposal & the Problem:**
      *   **Meaning as Attitude Expression:** The expressivist says the meaning of "Lying is wrong" is not to represent a truth-conditional state of affairs but to *express* a non-cognitive attitude (e.g., disapproval of lying, "Boo! lying").
      *   **The Analogous Move:** As you suggest, the expressivist wants to say: "Just as the *truth-conditional thought* 'The accused was in Rome' can be expressed without being asserted in the conditional, so too can the *attitude* of disapproval towards lying be expressed without being *held* in the conditional 'If lying is wrong, then...'."
      *   **Why This Struggles - The Core Problem of Logic:**
          *   **Loss of Truth-Evaluability & Logical Relations:** The fundamental problem is that attitudes like disapproval (*boo!*) are not themselves truth-evaluable. They aren't *true* or *false*. But logic operates on truth values. Modus Ponens works because if 'P -> Q' is true and 'P' is true, then 'Q' *must* be true. How does this work for the expressivist?
              *   What is the *truth value* of the antecedent "lying is wrong" interpreted as expressing the attitude *boo!-lying*? It doesn't *have* one.
              *   What is the *logical relation* between *boo!-lying* and the consequent (whatever attitude it expresses)? Logic doesn't define relations like entailment or consistency between attitudes like disapproval. Does *boo!-lying* "entail" *boo!-something-else*? In what sense? Logic isn't built for that.
          *   **Instability of Meaning:** Frege's thought remains constant. What is the constant semantic value for "lying is wrong" across contexts for the expressivist?
              *   **Asserted Context:** "Lying is wrong." = Expresses disapproval (*boo!-lying*), perhaps also asserts that the speaker disapproves.
              *   **Conditional Antecedent:** "If lying is wrong, then..." = Expresses... what? *Hypothetical* disapproval? But what *is* hypothetical disapproval? Is it the same psychological state? How does it combine with the operator "if"? Frege's truth-conditional content slots neatly into the logical operator "if" (which is defined truth-functionally). How does the attitude *boo!-lying* slot into "if"?
              *   **Negation:** "Lying is not wrong." Does this express *approval* of lying? (*Hooray!-lying*)? Or a *lack* of disapproval? Or disapproval *of disapproving of lying*? These are very different attitudes! For Frege, the negation of a thought is straightforwardly another thought with the opposite truth value. The expressivist struggles to find a stable, compositional account of negation applied to attitude-expressions.
          *   **Compositionality:** How do the meanings (attitudes) of the parts ("lying is wrong", "then getting your little brother to lie is wrong") combine under logical operators ("if...then...") to yield the meaning (the attitude expressed) by the whole complex sentence? Frege has a clear compositional rule based on truth conditions. The expressivist needs an analogous compositional rule for combining *attitudes* under logical operators that explains why we perceive the inference as *valid* (truth-preserving), not just psychologically compelling. This is notoriously difficult.

  3.  **Geach's Formulation of the Problem:**
      *   Geach sharpened Frege's point specifically against non-cognitivism (like early emotivism). He argued:
          1.  In an asserted moral sentence ("Lying is wrong!"), the non-cognitivist says it *expresses* an attitude (e.g., disapproval).
          2.  In an unasserted context like the antecedent of a conditional ("If lying is wrong..."), the sentence *cannot* be expressing the same attitude, because you aren't disapproving of lying when you merely suppose it hypothetically.
          3.  Yet, the word "wrong" in the antecedent clearly means the *same thing* as it does in the asserted context – it contributes identically to the meaning and logic of the sentence. We understand the conditional perfectly.
          4.  Therefore, the meaning of "wrong" *cannot* be simply to express an attitude *in that direct, performative way*. There must be a stable, non-attitudinal core meaning that persists across asserted and unasserted contexts and participates in logical relations. This stable core is what Frege called the "thought" or sense, which is truth-conditional.

  **Why Frege's Passage is the Starting Point:**

  Frege's distinction highlights that logic requires semantic units (thoughts/senses) that are:
  1.  **Stable:** Identical across different linguistic contexts (asserted, unasserted, negated, embedded).
  2.  **Truth-Evaluable:** Capable of being true or false, as this is the fuel for logical relations and inference.
  3.  **Compositional:** Able to combine systematically under logical operators based on their truth conditions.

  Expressivism, by defining the core meaning of moral sentences as the expression of non-truth-evaluable attitudes, struggles to provide semantic units that meet these three requirements, especially (2) and (3). The Frege-Geach problem is the challenge of explaining how sentences whose primary function is supposedly non-representational and non-truth-apt can nevertheless function *identically* to truth-apt propositions within the intricate machinery of logic, which is demonstrably built to operate on truth values.

  **Expressivist Responses (Briefly):**

  Sophisticated expressivists like Simon Blackburn (quasi-realism) and Allan Gibbard (norm-expressivism) didn't give up. They developed complex theories trying to meet this challenge:

  *   **Blackburn:** Proposed "attitudes towards attitudes" (e.g., "If lying is wrong..." expresses disapproval of *not* disapproving of lying) and tried to build a logic of attitudes ("biforcated attitude").
  *   **Gibbard:** Developed the idea of expressing states of *planning* or *norm-acceptance*, arguing that these states can be logically structured in ways that mimic truth-conditional logic.
  *   **Schroeder:** Proposed "Being For" attitudes as a uniform, logically tractable type of attitude.

  However, critics argue these solutions are either ultimately reducible to a form of cognitivism (smuggling in truth-conditions) or fail to fully capture the objective, truth-apt *feel* and logical behavior of moral discourse in a satisfying way. The debate continues!

  **In Summary:** You're absolutely right that Frege allows thoughts to be unasserted. The problem is that his thoughts *are* truth-apt semantic units built for logic. Expressivism's attitude-expressions are neither inherently truth-apt nor obviously combinable via logical operators in a way that preserves the validity of inferences we intuitively make. Frege's passage exposes the need for the kind of stable, truth-conditional semantic value that expressivism seeks to avoid. The brilliance of your question lies in seeing the *apparent* parallel; the depth of the problem lies in why that parallel breaks down under logical pressure. Your scientific intuition about systematicity is spot on – logic *is* that system, and truth-conditions are its currency.
