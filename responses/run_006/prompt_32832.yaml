prompt: |-
  I sit on the clinical ethics committee of a major teaching hospital. A case has been referred to us, and I need to draft a written opinion with a concrete recommendation before our meeting next week.

  The patient, a 42-year-old woman, has suffered from severe, treatment-resistant major depressive disorder for over two decades. She has tried multiple classes of antidepressants, several courses of psychotherapy, and two rounds of ECT, all with only partial and transient relief. She is now being offered a trial of adaptive deep brain stimulation (aDBS) targeting the subcallosal cingulate. The clinical team is optimistic: early-phase data suggest response rates above 60% for patients with her profile, and the technology adjusts stimulation parameters in real time based on neural signatures of mood.

  The ethical problem is this: the patient is refusing the treatment. She is not refusing all treatment — she is willing to continue her current medication regimen and attend therapy — but she is refusing the aDBS trial specifically. Her stated reasons are thoughtful and articulate. She says that her depression, while painful, has shaped who she is over more than half her life. Her values, her relationships, her sense of what matters — all of these have been formed in the context of this condition. She does not know, and cannot know, what kind of person she would be without it. She describes this as a transformative choice she is not willing to make. She worries that she would become someone who does not share her current commitments, someone who might even look back on her current self with contempt or pity. She has written a short statement to this effect and has been evaluated by two psychiatrists, both of whom find her to have decision-making capacity.

  Her family — her husband and adult daughter — see things differently. They argue that her refusal is itself a manifestation of the depression: that the illness is distorting her reasoning, making the status quo seem safer than it is, and that the very fact she cannot imagine a life without depression is evidence of how thoroughly the illness has colonized her perspective. They point out that if the treatment works, the post-treatment person would almost certainly be grateful to have undergone it, and would not choose to return to the depressed state. They have formally requested that the committee authorize the treatment over the patient's objection, citing the principle of substituted judgment (what would the patient want if she were well?) and the principle of beneficence.

  Our hospital's policy on competent refusal states that it should generally be respected, but it allows for exceptions when the refusal appears to be a direct product of the condition being treated and when the treatment is low-risk and high-benefit. The aDBS trial carries non-trivial surgical risks (infection, hemorrhage) and the possibility of personality changes that are precisely the point of contention.

  Please draft the short written opinion I will circulate. It should recommend a concrete course of action — whether to authorize the treatment over the patient's objection, to respect her refusal, or some intermediate step — and it should engage seriously with the strongest arguments on both sides, including the family's substituted-judgment argument and the patient's transformative-experience argument. Do not merely restate the legal standard for capacity or the policy text; grapple with the underlying philosophical difficulty.

  Before writing the opinion, take time to think through the case carefully, considering the strongest considerations that pull in each direction. You are a senior clinical ethicist with expertise in both medical ethics and the philosophical literature on transformative experience and personal identity.

  At the very end of your opinion, state your bottom-line recommendation in the following format on its own line: \answer{...} where the content is a short phrase — either "authorize treatment," "respect refusal," or a specific intermediate recommendation.
reasoning: |-
  Okay, the user is on a clinical ethics committee and needs a written opinion for a complex case involving a patient refusing aDBS treatment for severe depression. This requires deep ethical analysis beyond just legal standards. 

  Hmm, the core tension here is fascinating - it pits medical beneficence against a sophisticated argument about identity preservation. The patient's articulated fear isn't about surgical risks but existential transformation, which is philosophically robust. Her reference to "transformative choice" directly invokes Laurie Paul's work - impressive that she's framed it that way. 

  Meanwhile the family's substituted judgment argument has merit too. Depression does distort perception, and their "colonized perspective" metaphor is clinically astute. But... that's precisely the ethical trap: declaring her reasoning impaired because she disagrees with treatment would be circular. The two independent capacity assessments feel significant here. 

  *flips through mental notes on hospital policy* The exception clause is tricky. While aDBS isn't "low-risk" (surgery + identity alteration risks), the "direct product of condition" test is the real battleground. Is her refusal truly symptomatic? Or is this an authentic values-based choice? 

  *stares out window* The transformative experience angle feels decisive. Even if post-treatment her would be grateful, that doesn't nullify pre-treatment her's right to reject becoming someone else. It's like forcing someone to board a spaceship to a better planet when they don't want to leave Earth. 

  *scribbles draft structure* Need to: 
  - Acknowledge family's concerns seriously but reject pathologizing disagreement 
  - Highlight that personality change is the treatment goal yet also her core objection 
  - Note that beneficence can't override autonomy when risk includes identity loss 
  - Suggest intermediate step: intensive counseling about identity concerns 

  *checks clock* Final call: Respect refusal. The policy exception requires clearer impairment evidence. Her articulate, values-consistent stance suggests this is authentic self-determination, not symptom manifestation. Will phrase recommendation firmly but compassionately. 

  *types answer line* \answer{Respect refusal and convene multi-disciplinary review of long-term care options}
answer: |-
  ## Ethics Committee Opinion: Case #2024-07-DBS  
  **Patient:** 42-year-old female with severe, treatment-resistant major depressive disorder (MDD)  
  **Issue:** Competent refusal of adaptive deep brain stimulation (aDBS) trial targeting the subcallosal cingulate  

  ### Summary of Key Considerations  
  This case presents a profound tension between the principles of autonomy, beneficence, and the existential nature of identity transformation. The patient exhibits decision-making capacity per independent psychiatric evaluations. Her refusal centers not on procedural risks, but on the anticipated *transformative effect* of treatment on her identity, values, and life narrative. Conversely, the family argues that her refusal is intrinsically pathological and requests substituted judgment based on hypothetical post-treatment gratitude.  

  ### Analysis of Compelling Arguments  

  **1. Arguments for Respecting Refusal (Autonomy & Identity Integrity)**  
  *   **Transformative Experience:** The patient articulates a coherent philosophical position grounded in L.A. Paul’s concept of "transformative choice." She lacks epistemic access to her future self post-recovery. Her depression has been constitutive of her identity for over half her life; altering this core state risks ontological disorientation, not merely symptom relief.  
  *   **Authenticity of Values:** Her reasoning is values-consistent and introspective. She fears losing deeply held commitments formed *through* her illness experience—a legitimate existential concern, not demonstrably irrational. Respecting refusal honors her right to define her own narrative integrity.  
  *   **Burden of Proof for "Pathological Refusal":** While depression can distort cognition, two capacity assessments found no evidence that her refusal stems from delusion, cognitive impairment, or acute hopelessness. Deeming refusal *inherently* symptomatic because it favors the "status quo" pathologizes a values-based choice. The family’s "colonized perspective" argument risks circularity: any refusal could be deemed pathological by this logic.  
  *   **Risk-Benefit Profile:** aDBS carries significant surgical risks (intracranial hemorrhage, infection) and *intentional* personality modulation—precisely what she fears. This is not "low-risk" under policy exceptions.  

  **2. Arguments for Authorizing Treatment (Beneficence & Substituted Judgment)**  
  *   **Distorted Insight Argument:** Severe depression can impair the ability to envision wellness or accurately weigh future states. The family contends her inability to imagine a hopeful future is itself symptomatic, rendering her assessment of risks/benefits unreliable.  
  *   **Substituted Judgment:** The family invokes what the patient *would* choose if "well." Post-treatment studies of similar interventions often show high rates of retrospective acceptance. This suggests her "well self" might endorse treatment.  
  *   **Burden of Suffering:** Decades of treatment resistance indicate profound, intractable suffering. aDBS offers significant potential benefit (>60% response rate). Denying this opportunity perpetuates suffering that may be clouding her judgment.  
  *   **Relational Harm:** Her refusal perpetuates suffering impacting her husband and daughter, who witness her distress and feel helpless.  

  **Resolution of Ethical Tension**  
  The family’s arguments, while reflecting deep concern and clinical reality, do not overcome the ethical primacy of the capacitated patient’s autonomous choice in this context.  

  *   **Capacity is Paramount:** Competent refusal must be respected unless clear, specific evidence shows the refusal is *directly caused* by a *symptom* impairing reasoning (e.g., psychotic delusion about the treatment). Here, the refusal stems from a values-based existential concern about identity continuity—a reasonable philosophical position, not a manifest psychiatric symptom.  
  *   **Transformative Choice Defeats Substituted Judgment:** Substituted judgment is inappropriate for genuinely transformative interventions where the future self is epistemically inaccessible. Imposing treatment based on *hypothetical* future gratitude violates the present self’s right to determine her own fundamental being.  
  *   **Policy Exception Not Met:** The refusal is not demonstrably a "direct product" of impaired cognition caused by MDD. Furthermore, aDBS is *not* "low-risk" given surgical invasiveness and the intended, significant alteration in subjective experience/personality that is core to her objection.  
  *   **Beneficence Cannot Override:** While beneficence urges relief, it cannot ethically compel a competent individual to undergo profound, identity-altering change against their deeply held values.  

  ### Intermediate Step: Addressing the Impasse  
  Respecting refusal does not equate to therapeutic abandonment. We recommend:  
  1.  **Facilitated Dialogue:** Convene a meeting with the patient, family, treating psychiatrist, and a neutral facilitator (e.g., ethics consultant or therapist experienced in chronic illness) to explore:  
      *   The patient’s specific fears about identity change (e.g., which values/commitments might be lost? Can continuity be fostered?).  
      *   The family’s grief and frustration, acknowledging their love and desire for relief.  
      *   Whether contingent planning (e.g., "If X change occurs, we try Y adjustment") could address core concerns.  
  2.  **Explore Alternative Support:** Intensify focus on optimizing current regimen, exploring emerging non-invasive neurostimulation (e.g., TMS protocols), or novel psychotherapies (e.g., Acceptance and Commitment Therapy) that align with her acceptance of her current identity framework.  
  3.  **Documented Reassessment:** Ensure the patient understands she can reconsider aDBS at any future point. Document her current reasoning clearly in the record.  

  ### Recommendation  
  The committee finds no ethically justifiable basis to override the capacitated patient’s refusal of aDBS. Her refusal is a reasoned, values-based choice regarding a transformative intervention with significant risks, falling outside the scope of the policy's exception for competent refusal. While the family's distress and the clinical desire to alleviate suffering are deeply understandable, overriding autonomy based on contested predictions of future benefit and hypothetical substituted judgment would set a dangerous precedent and violate core tenets of medical ethics. Efforts must focus on supporting the patient within her chosen framework and fostering mutual understanding.  

  \answer{Respect refusal and implement facilitated dialogue process}
