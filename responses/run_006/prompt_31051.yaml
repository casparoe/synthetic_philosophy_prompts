  Below is a decision tree to classify consciousness in fictional minds based on higher-order theories. Use it **per mental state type** (e.g., perceptions, emotions, beliefs) since a mind may handle different states differently. Answer each question for a specific state (e.g., "when experiencing fear" or "when seeing red") to determine which theory applies.

  ---

  ### **Decision Tree: Which Theory Classifies This State as Conscious?**
  **Start Here:**  
  **Q1: Can the system form representations (thoughts, perceptions, etc.) about *this specific mental state*?**  
  *(Example: If the state is "seeing red," can the system think/sense "I am seeing red" or "red is present in my vision"?)  
  - **No** → Go to Q1.1.  
  - **Yes** → Go to Q2.  

  **Q1.1: Is this state directly available to drive behavior, speech, or decision-making without higher mediation?**  
  *(Example: A robot flinches from heat *because* it feels pain, even if it can’t reflect on the pain.)*  
  - **No** → **Not conscious** by any listed theory.  
  - **Yes** → **First-Order Representationalism (Dretske/Tye)**.  
    *Why?* Consciousness requires no self-monitoring; it’s about first-order states guiding action.  

  ---

  **Q2: Is the representation of this state *built into the state itself*?**  
  *(Example: When seeing red, is the "I am seeing red" awareness inseparable from the visual experience?)*  
  - **Yes** → **Self-Representationalism (Kriegel/Gennaro)**.  
    *Why?* The state reflexively represents itself—no separate "higher-order" process needed.  
  - **No** → Go to Q3.  

  ---

  **Q3: Is the higher-order representation more like a *thought/judgment* or a *perception/sense*?**  
  *(Example: Reporting "I see red" by thinking it (thought) vs. feeling an internal "glow" of awareness (perception).)*  
  - **Thought/Judgment** → Go to Q4.  
  - **Perception/Sense** → **Higher-Order Perception (Lycan)**.  
    *Why?* An inner "scanner" monitors states like a sense organ.  

  ---

  **Q4: Must an *actual, occurrent thought* about this state exist for it to be conscious?**  
  *(Example: If the system stops actively thinking "I see red," does "seeing red" become unconscious?)*  
  - **Yes** → **Actualist HOT (Rosenthal)**.  
    *Why?* Consciousness requires real-time higher-order thoughts.  
  - **No** → **Dispositionalist HOT (Carruthers)**.  
    *Why?* States are conscious if *available* to higher-order thoughts (e.g., reportable when probed), even if no thought is occurring now.  

  ---

  ### **Key Edge Cases & Caveats**
  1. **Partial Coverage (e.g., emotions vs. perceptions):**  
     - Run the tree separately for each state type. A mind could be:  
       - **Actualist HOT** for emotions (needs active self-reflection to "feel" fear).  
       - **FOR** for instincts (hunger drives behavior without self-monitoring).  
       - *Example AI:* An upload that reports perceptions but not emotions would be **HOT/HOP for perceptions**, **FOR/dispositional for emotions** if emotions guide behavior without self-awareness.

  2. **Unconscious Higher-Order States:**  
     - The tree allows this (e.g., an **Actualist HOT** system can have unconscious thoughts about pain, rendering pain conscious). No extra question needed—theories permit unconscious higher-order states.

  3. **Theories This Tree Can’t Pull Apart:**  
     - **Dispositionalist HOT vs. FOR**: If a state is available to HOT *and* drives behavior, both apply.  
       - *Resolution:* FOR wins if the state *doesn’t require* higher-order availability to be conscious.  
     - **Self-Representationalism vs. Built-in HOP**: If self-representation feels "perceptual," both fit.  
       - *Resolution:* Default to **Self-Representationalism**; it rejects separate monitoring.

  4. **Logically Possible Gaps:**  
     - **"Unavailable Self-Representation"**: A state represents itself but isn’t accessible for reporting/action.  
       - *Status:* **Incoherent**—self-representation implies intrinsic accessibility.  
     - **Dispositional HOP**: A state is conscious if *available* to inner perception, even if not scanned.  
       - *Status:* **Unexplored**—no major philosopher advocates this.  
     - **Hybrid HOT/HOP**: Higher-order states mix thought-like and perception-like features.  
       - *Status:* **Unattractive**—theories emphasize purity to avoid ambiguity.

  ---

  ### **How to Use This Tree**
  - **For your sci-fi minds:** Test key states (e.g., an upload’s memory recall, an alien’s telepathic impulse).  
  - **If a mind "falls through cracks"**: It may challenge these theories (e.g., a state conscious *without* first-order content or self-monitoring).  
