prompt: |-
  I'm in an upper-division seminar on contemporary moral philosophy, and we've spent the last three weeks on the aggregation debate: Taurek's "Should the Numbers Count?", Parfit's "Innumeracy" reply, Kamm's pairwise comparison argument, Scanlon's contractualism, and a few pieces by Hirose and Otsuka. Before I try to settle on a view, I want to step back and ask what the criteria for a successful view even are — the debate seems to pull in so many directions that I suspect people are implicitly working with different desiderata and talking past each other.

  Please write out the desiderata: what any adequate theory of how we should choose when we can save different numbers of people must get right. For each requirement, give the case or consideration that motivates it, and tell me whether you think it's non-negotiable (any theory that fails it is dead) or whether it's a substantive commitment that one side of the debate could reasonably reject as question-begging.

  Some specific issues I want the list to address:

  - The distinction between aggregating claims within a single life and aggregating claims across different lives, and whether a theory that permits one but not the other can be made coherent.
  - The relevance (if any) of the fact that each person has only her own life to lose, and whether this fact generates a requirement to give each person a say or a chance rather than simply maximizing lives saved.
  - Whether the numbers must count in the same way for deterministic choices (I can save A or save B and C) as for choices under uncertainty (I can take an action that will save A for sure or an action that will save B and C with some probability), or whether these are different problems with different criteria.
  - Whether the theory must generalize beyond one-off rescue cases to distributive justice more broadly — for instance, to how we allocate scarce medical resources — or whether rescue cases are sui generis and a theory can be adequate for them without committing itself on distribution.
  - Whether a theory that gives each person an equal chance of being saved (e.g., a weighted lottery) is ruled out by the same considerations that would rule out giving the many no chance at all, or whether there is a principled difference between ignoring the numbers and merely discounting them.
  - Whether the theory must respect a requirement of equal concern or equal respect for persons, and if so, what that requirement actually demands in a conflict situation — is it satisfied by impartial consideration of everyone's interests, or does it require something procedural?

  If you think some subset of these desiderata cannot be jointly satisfied — that the list itself reveals a kind of impossibility result — please flag that explicitly. That's the part I would most want to see.

  Finally, a brief scorecard: how do Taurek's equal-chances coin-toss, the straightforward saving-the-greater-number view, Kamm's pairwise comparison argument, Scanlon's contractualist approach, and one weighted-lottery view of your choice fare against the list? But the desiderata themselves are the main deliverable; don't let the scorecard take over.

  Please write in American English.
reasoning: |-
  Okay, the user is in an upper-division seminar on contemporary moral philosophy, specifically the aggregation debate. They've covered key texts like Taurek, Parfit, Kamm, Scanlon, Hirose, and Otsuka. Now they want to step back and identify the criteria for a successful theory on saving lives when numbers differ. They're concerned that the debate might involve conflicting desiderata, leading people to talk past each other. 

  First, I need to unpack their explicit questions. They want desiderata listed with motivating cases, flagged as non-negotiable or reasonably rejectable. They also specified six issues to address: within-life vs. across-life aggregation, the "only one life to lose" factor, deterministic vs. probabilistic cases, generalization to distributive justice, equal-chance mechanisms vs. ignoring numbers, and equal concern/respect requirements. 

  Hmm, the user seems analytically sophisticated—they’re spotting meta-level friction in the literature. Their unspoken need might be for a framework to evaluate the debate’s stalemates, possibly to position their own stance. The "impossibility result" request suggests they suspect inherent tensions. 

  For desiderata, I’ll start with the most widely shared ones:  
  - **Personal Sovereignty**: Motivated by "only one life to lose." Non-negotiable? Probably—even aggregationists like Parfit accept it as a constraint.  
  - **No Arbitrary Disregard**: Rejecting Taurek’s coin-toss-for-5-vs-1. Non-negotiable for most, but Taurekians would bite the bullet.  
  - **Permissible Within-Life Aggregation**: Rooted in how we treat one person’s multi-faceted interests. Non-negotiable; denying this seems incoherent.  
  - **Impartiality**: Equal respect demands no bias toward specific individuals. Non-negotiable foundational commitment.  

  Then harder ones:  
  - **Across-Life Aggregation Permissibility**: Parfit’s A/B/C case motivates it. But this is the core dispute—Taurekians reject it as question-begging.  
  - **Risk-Sensitivity**: Should probabilistic cases align with deterministic ones? Hirose/Otsuka argue yes; others see uncertainty as distinct.  
  - **Generalizability**: Rescue vs. distributive justice. Scanlon treats them similarly; others see rescue as sui generis.  
  - **Procedural Fairness**: Equal chances might satisfy equal respect differently. Taurek embraces this; critics see it as irrational when numbers differ.  

  Impossibility tension: The clash between **No Arbitrary Disregard** (demanding attention to numbers) and Taurek’s **Individual Loss Insignificance** (denying moral weight to sums) might be irreconcilable—hence the debate’s persistence.  

  For the scorecard (briefly):  
  - **Taurek**: Fails No Arbitrary Disregard but nails Procedural Fairness.  
  - **Straight Aggregation**: Nails most desiderata but struggles with Personal Sovereignty in edge cases (e.g., Kamm’s Transitivity Trap).  
  - **Kamm**: Clever but risks collapsing into aggregation or violating Impartiality in multi-person cases.  
  - **Scanlon**: Strong on Personal Sovereignty but ambiguous on numbers—may fail Across-Life Aggregation.  
  - **Weighted Lottery**: Compromises between fairness and efficiency; satisfies Procedural Fairness but not Risk-Sensitivity if probabilities≠numbers.  

  User’s deepest need? Likely mapping the fault lines to find where their own intuitions land—or whether to accept a fragmented landscape. I’ll flag the desiderata conflicts starkly.
answer: |-
  Here is a systematic breakdown of desiderata for a theory of aggregation in life-saving cases, addressing your specific queries. I'll flag tensions and whether each desideratum is widely seen as non-negotiable or reasonably contestable. The core tension reveals a near-impossibility in satisfying all intuitions simultaneously.

  ### Core Desiderata
  1. **Personal Sovereignty (Non-Negotiable)**  
     *What it demands*: Each person's life has irreducible moral significance; you cannot treat individuals as mere containers for fungible "life-units."  
     *Motivating case*: Taurek’s "only one life to lose" argument (1 vs. 1 rescue). Ignoring a person’s claim because they are "outnumbered" seems to disregard their distinct moral status.  
     *Status*: Non-negotiable. Even aggregationists (e.g., Parfit) accept this as a constraint; failure implies moral monstrosity (e.g., sacrificing one to harvest organs for five).

  2. **No Arbitrary Disregard (Non-Negotiable)**  
     *What it demands*: You cannot ignore a person’s claim without a morally relevant reason.  
     *Motivating case*: Saving 5 vs. 1. A theory that flips a coin here (giving the single person a 50% chance) appears to arbitrarily disregard the claims of four in the group of five.  
     *Status*: Non-negotiable for most. Taurek rejects this desideratum, arguing numbers are irrelevant, but critics see this as fatal.

  3. **Permissible Within-Life Aggregation (Non-Negotiable)**  
     *What it demands*: Aggregating harms/benefits *within a single life* must be allowed (e.g., treating a person’s broken arm and headache together rather than separately).  
     *Motivating case*: A doctor who refuses to prioritize a patient’s life-threatening injury over their mild headache because "each claim deserves equal consideration" is absurd.  
     *Status*: Non-negotiable. Denying this collapses into incoherence. **Key implication**: Theories forbidding *all* aggregation (e.g., radical Taurekianism) fail here.

  4. **Impartiality / Equal Respect (Non-Negotiable)**  
     *What it demands*: All persons deserve equal moral concern; no bias toward specific individuals.  
     *Motivating case*: Choosing to save your friend over five strangers violates fairness.  
     *Status*: Non-negotiable foundational commitment. **Tension**: *What equal respect demands* is contested—impartial weighing of interests (aggregation) vs. procedural fairness (equal chances).

  ---

  ### Contested Desiderata
  5. **Permissible Across-Life Aggregation (Reasonably Rejectable)**  
     *What it demands*: Aggregating claims *across lives* is sometimes required (e.g., saving 5 > saving 1).  
     *Motivating case*: Parfit’s A/B/C case (save A alone, or B and C together). Intuition strongly favors saving B+C.  
     *Status*: Taurekians reasonably reject this. They argue "separateness of persons" makes summing across lives illegitimate, unlike within-life aggregation. **Core conflict**: This is the heart of the debate.

  6. **Risk-Sensitivity (Reasonably Rejectable)**  
     *What it demands*: Numbers must count similarly in deterministic cases (save A *or* B+C) and probabilistic cases (save A for sure *or* a 50% chance to save B+C).  
     *Motivating case*: If saving B+C is obligatory deterministically, shouldn’t a 51% chance to save B+C outweigh saving A?  
     *Status*: Rejectable. Some (e.g., Otsuka) argue risk introduces distinct obligations; others (Hirose) demand consistency. Taurekians treat both cases identically (equal chances).

  7. **Generalizability to Distributive Justice (Reasonably Rejectable)**  
     *What it demands*: Principles for one-off rescues should extend to distributive contexts (e.g., allocating organs).  
     *Motivating case*: A hospital triaging ventilators faces the same "numbers" problem as a rescuer.  
     *Status*: Rejectable. Scanlon sees rescues as involving "urgency" distinct from distributive fairness. Taurek’s view generalizes poorly (e.g., flipping coins for all scarce resources).

  8. **Procedural Fairness vs. Outcome Sensitivity (Reasonably Rejectable)**  
     *What it demands*: Equal respect may require giving each person a "fair chance" (e.g., weighted lottery) rather than maximizing lives saved.  
     *Motivating case*: A weighted lottery (e.g., 5:1 odds favoring the group) in a 5 vs. 1 case. This "discounts" numbers but doesn’t ignore them.  
     *Status*: Rejectable. Aggregationists see lotteries as irrational when outcomes are certain; others see them as respecting individual standing. **Key nuance**: Weighted lotteries avoid the *arbitrary disregard* problem but may violate outcome-oriented impartiality.

  ---

  ### The Impossibility Tension
  **The central clash**:  
  - **No Arbitrary Disregard** demands that we cannot ignore the claims of the many (e.g., in 5 vs. 1).  
  - **Personal Sovereignty** + **Taurek’s Insight** ("only one life to lose") suggests that saving the greater number cannot *override* the single person’s claim, as their loss is total for them.  
  **Result**: No theory fully satisfies both without cost.  
  - *Aggregationism* (e.g., Parfit) sacrifices Taurek’s view of sovereignty.  
  - *Pure Taurek* sacrifices the claims of the many.  
  - *Compromises* (e.g., weighted lotteries) satisfy neither side perfectly but may be least bad.

  ---

  ### Brief Scorecard
  | **Theory**               | **Personal Sovereignty** | **No Arbitrary Disregard** | **Permissible Within-Life Agg** | **Impartiality** | **Across-Life Agg** | **Risk-Sensitivity** | **Generalizability** | **Procedural Fairness** |
  |--------------------------|--------------------------|----------------------------|----------------------------------|------------------|---------------------|----------------------|----------------------|--------------------------|
  | **Taurek (coin toss)**   | ✓✓✓                      | ✗ (Ignores numbers)        | ✗ (Inconsistent)                | ✓ (Procedural)  | ✗                   | ✓ (Same for all)     | ✗ (Chaotic)          | ✓✓✓                      |
  | **Straight Aggregation** | ✓ (But thin)             | ✓✓✓                        | ✓✓✓                             | ✓ (Outcome)     | ✓✓✓                 | Depends             | ✓✓✓                  | ✗                        |
  | **Kamm (Pairwise)**      | ✓✓                       | ✓                          | ✓✓✓                             | ✗ (Intransitive)| Partial             | ?                   | Weak                 | ✗                        |
  | **Scanlon (Contractualism)** | ✓✓✓                  | ✓                          | ✓✓✓                             | ✓✓              | ✗/Partial           | ✗                   | ✓✓ (But distinct)    | ✓                        |
  | **Weighted Lottery**     | ✓✓                       | ✓ (Avoids total disregard) | ✓✓✓                             | ✓ (Procedural)  | ✗ (Discounts)       | ✗ (If probs ≠ weights)| Weak               | ✓✓✓                      |

  **Key**:
  - ✓✓✓ = Fully satisfies  
  - ✓✓ = Partially satisfies  
  - ✓ = Minimally satisfies  
  - ✗ = Fails  
  - ? = Unclear  

  **Takeaways**:  
  - **Taurek** fails on arbitrariness and within-life aggregation.  
  - **Straight aggregation** struggles with personal sovereignty (e.g., in Kamm’s transitivity traps).  
  - **Kamm** risks intransitivity (e.g., in 3-way cases: A vs. B, B vs. C, but A > C not held).  
  - **Scanlon** is ambiguous on numbers: Why wouldn’t each reject a principle allowing their death for fewer others?  
  - **Weighted lottery** (e.g., save 5 with 5/6 probability vs. 1 with 1/6) balances claims but seems irrational under certainty.  

  The desiderata reveal why the debate persists: **Personal Sovereignty** and **No Arbitrary Disregard** pull toward incompatible solutions. A successful theory must either reframe one (e.g., argue sovereignty doesn’t forbid aggregation) or adopt a hybrid (e.g., weighted lotteries in uncertainty). No view dominates.
