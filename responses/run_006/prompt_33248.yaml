prompt: |-
  I've been trying to reverse-engineer a friend's views on discounting the future. She's a careful thinker — not an economist, but someone who arrives at her positions by reflecting on cases rather than applying a formula. Over several months of conversation I've collected the following verdicts:

  She'd rather have $100 today than $120 in a year, but she'd rather have $120 in eleven years than $100 in ten years. She says the difference between "now and later" feels much larger than the difference between "later and slightly more later," and she's untroubled by the fact that this pattern would, if she made the first choice now, lead her to reverse it in a year. On a policy question involving lives: she supports spending $10 million today to save 100 lives today, but opposes spending $10 million today to save 105 lives in one year. Yet she supports spending $10 million in fifty years to save 105 lives in fifty-one years over spending $10 million in fifty years to save 100 lives in fifty years. She's aware of the pattern and says it doesn't feel like a contradiction: the further out you go, the less the exact timing matters. She also thinks we should care about the welfare of people in 500 years roughly as much as we care about people in 100 years, and she's frustrated by standard cost-benefit analyses that discount the far future to nearly nothing. But she admits she doesn't feel the same urgency about a preventable death in 200 years that she feels about a preventable death next year. I once asked her to compare two policies: one prevents a catastrophe in 30 years, the other prevents the same catastrophe in 130 years. She said she'd prefer the earlier one, but only weakly — she'd trade it off for a very small increase in the number of lives saved.

  I can see at least three candidate rules that fit everything she's said. One is quasi-hyperbolic discounting (the β-δ model), with a steep present-bias parameter β and a δ close to 1 — the sharp drop in weight happens right after the present moment, and everything in the future is discounted at nearly the same low rate. A second is a "near/far" threshold view, on which there's a high discount rate for the first few decades and a low, maybe zero, rate beyond that, with the cutoff somewhere in the mid-future rather than at the present moment. A third is that she doesn't discount time itself at all, but she discounts for the probability that the promised good will actually reach its intended beneficiary — and she implicitly thinks that probability decays quickly over the near term and slowly over the long term.

  The new case I want to predict: I ask her to compare Policy A, which prevents 1,000 deaths in 5 years at a cost of $10 million today, with Policy B, which prevents 1,000 deaths in 55 years at a cost of $10 million in 50 years. Both involve a 5-year gap between cost and benefit, but one starts now and the other is shifted 50 years into the future. What does she say? And if her answer to this case doesn't settle the matter, what single further case would most cleanly tell the three candidate rules apart?

  Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, the user is trying to understand a friend's complex views on future discounting. They've described her position through several detailed scenarios and have proposed three possible models to explain her reasoning. Now they want to predict how she'd respond to a new policy comparison and potentially design a test case to distinguish between the models.

  Looking at her existing positions: She shows strong present bias in financial decisions (preferring $100 now over $120 in a year, but reversing when both options are delayed). The same pattern appears in life-saving scenarios - she values immediate lives highly but shows weak time preference for distant futures. Key points are the steep near-term discounting that flattens over time, and her explicit acknowledgment that timing matters less further out.

  The three candidate rules are:
  1) Quasi-hyperbolic (β-δ) discounting with high present bias but low long-term discounting
  2) A threshold model with high discounting for several decades then low thereafter
  3) Risk-based discounting where perceived probability of delivery decays quickly then plateaus

  For the new case (Policy A: save 1000 lives in 5 years at $10M cost now vs Policy B: save 1000 lives in 55 years at $10M cost in 50 years), all three models would predict indifference or near-indifference since both options have equal cost-benefit gaps and are either both "far" or similarly discounted. Her earlier statements suggest she'd see these as comparable.

  To distinguish the models, we need a test that exploits their structural differences. A comparison between saving lives in 50 vs 60 years would be decisive:
  - β-δ model would show slight preference for 50 years
  - Threshold model might show strong discontinuity if 50 years is near threshold
  - Risk model would show constant ratio if risk decay stabilizes

  The life-saving context is better than monetary as it avoids confounding factors like investment returns. This case would cleanly reveal whether her discounting has continuous decay (β-δ), a sharp cutoff (threshold), or is actually about perceived risk rather than time preference.
answer: |-
  She would be indifferent or nearly indifferent between Policy A and Policy B, but if forced to choose, might weakly prefer Policy A. To distinguish the rules, ask her to choose between saving 100 lives in 50 years versus 110 lives in 60 years.

  **Reasoning:**  
  Her pattern shows steep discounting for immediate vs. near-future tradeoffs but flat discounting for distant-future tradeoffs. Policy A (cost now, benefit in 5 years) and Policy B (cost in 50 years, benefit in 55 years) both involve a 5-year gap:  
  - Under **quasi-hyperbolic discounting** (β low, δ≈1), both options are in the "flat" future region. The 50-year shift in timing doesn’t matter because β only penalizes the "now" (t=0) and δ≈1 makes all future periods near-equal. She weakly prefers Policy A only if β slightly discounts the 5-year wait (but β’s effect is minimal beyond t=0).  
  - Under the **near/far threshold** (e.g., high discounting for ≤30 years), both options start beyond the threshold (5 and 50 years are "far"), so the gap is identically discounted. Indifference holds.  
  - Under **risk-based discounting**, the probability decay stabilizes over long horizons. Both policies have identical 5-year gaps in stable risk zones, so equal weighting.  

  **All models predict near-indifference** because:  
  - She sees costs/benefits beyond ~10 years as similarly weighted (per her 11y vs. 10y money preference and 50y vs. 51y lives preference).  
  - The 50-year shift doesn’t alter the gap’s discounting in any model.  

  **To distinguish, test a distant-future tradeoff:**  
  Ask her to choose between saving:  
  - **Option X:** 100 lives in 50 years  
  - **Option Y:** 110 lives in 60 years  

  Predictions:  
  - **Quasi-hyperbolic (δ≈1):** She weakly prefers X (since δ slightly discounts the extra 10 years).  
  - **Threshold model:** If 50/60 years are both "far" (post-threshold), she is indifferent. If the threshold is later (e.g., 50y is "near"), she strongly prefers Y. But her 50y vs. 51y view suggests 50y is "far," so indifference likely.  
  - **Risk-based discounting:** She prefers Y if the risk decay rate implies >10% higher survival odds for the 10-year delay (e.g., if risk plateaus, she may demand more lives to offset delay). Her "urgency" comment suggests time still matters weakly, so she might require >105 lives in 60y to prefer Y over 100 in 50y, unlike the other models.  

  This isolates long-term discounting: quasi-hyperbolic implies continuous decay, threshold implies discontinuity, and risk-based relies on non-temporal decay rates. Her "very small increase" comment in the catastrophe case favors quasi-hyperbolic, but this test clarifies.
