prompt: |-
  so i'm working on a novel where one of the central tensions is whether my protagonist should have a child, given the state of the world and her own uncertainties. i've been reading around the procreation asymmetry — you know, the idea that there's a moral difference between bringing a happy person into existence and failing to bring a miserable person into existence, even though the cases look structurally symmetric. i keep running into people who either accept it or reject it based on one or two toy cases, and i want to understand what a *theory* of the asymmetry is even supposed to do before i let my characters live inside one.

  so here's what i need: a list of desiderata. what does any adequate theory of the procreation asymmetry have to get right? what cases must it handle, what distinctions can't it collapse, what independent moral principles can't it contradict? for each requirement, give me the case or consideration that motivates it — why is it a requirement and not just someone's pet intuition. then tell me which ones are genuinely non-negotiable and which are commitments of particular camps that a theory might reasonably walk away from. and crucially: are any pairs of these requirements jointly unsatisfiable? if so, which ones, and why — that's the part i most want to see, because if the desiderata themselves are inconsistent then the debate is a different beast than i thought.

  lead with the bottom line — the single most important thing i should walk away knowing, whether that's a requirement that kills most theories or a tension in the desiderata themselves. then give me the full list and reasoning. no preamble, no restating what i asked.
