prompt: |-
  I am a PhD student in philosophy of science, and I have been following the debate about whether philosophy makes progress, which strikes me as having reached a strange kind of stalemate. On one side, pessimists point to the persistence of live disagreement about central questions — free will, universals, the nature of consciousness, the foundations of ethics — and argue that a discipline that does not converge on answers after centuries is not progressing in the sense in which the sciences progress. On the other side, optimists reply that philosophy's progress consists in something other than convergence: refining distinctions, dissolving pseudo-problems, generating sharper questions, producing conceptual and formal tools that other fields take up, and ruling out options once thought live. Each side appears to find the other's examples either irrelevant or question-begging, and the exchange has begun to repeat itself.

  My working hypothesis is that the disagreement is not primarily about the historical facts — both sides would accept most of the same facts about what philosophers have actually done — but about what should count as progress in the first place, and perhaps about what philosophy is for. I want a diagnosis rather than a verdict. Is this a substantive disagreement, a verbal dispute over the word "progress", a difference about standards of success, or two groups answering different questions under one heading — for example, a descriptive question about what philosophy has in fact achieved versus a normative question about what philosophy should aim at? Is there a hidden empirical or formal question doing the work, or is the impasse a sign that the question is ill-posed? Be specific about what each side is committed to and where the real fault line lies, drawing on what each side actually says rather than a caricature of it. Then tell me what, if anything, would count as progress in this debate given your diagnosis — a distinction, a change of question, a study of particular cases, or an argument that no progress should be expected and why.

  Please write in British English and keep the answer to no more than 900 words.
