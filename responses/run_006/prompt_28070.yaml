prompt: |-
  I'm taking a seminar this term on promises and contracts, and we just read Scanlon's account of promising. I keep going back and forth on whether I actually understand it, because the textbook's summary sounds off in a way I can't quite pin down.

  The textbook glosses it like this: "Scanlon holds that the duty to keep a promise has nothing to do with social conventions or the rules of a practice. It comes from a general moral principle against causing expectations and then disappointing them. If I promise to water your plants, the reason I have to water them is just that I've made you believe I will, and it would be wrong to let you down. So any time you knowingly allow someone to form an expectation about what you'll do — even if it's just a guess about your plans that you could have corrected but didn't — you are bound just as if you'd promised. Promising is therefore only a label for creating expectations; the word itself does no moral work. This also shows that breaking a promise is basically a kind of lying, since what you did wrong was to state something false about your future conduct."

  I have a vague sense this is right in the broad outline but maybe sloppy on the details, but I don't know Scanlon well enough to say weather the sloppiness matters or where exactly it is. You're a philosopher who works on Scanlon's contractualism. Please think through this carefully — start by reconstructing the principle of fidelity in your own words, then go through the summary clause by clause and tell me what's fair, what's a simplification, and what a careful Scanlon would reject. I want to seperate the accurate core from the gloss. Also say whether the final conclusion about lying actually follows from the accurate parts, or whether it's smuggling something in.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a seminar on promises and contracts, specifically reading Scanlon. The textbook summary they provided feels off to them, but they can't pinpoint why. Their main request is to dissect this summary, clarify Scanlon's actual view, and check if the lying analogy holds.

  First, I need to recall Scanlon's Principle F from "What We Owe to Each Other." The core idea is that misleading someone about your future actions creates a moral obligation because it undermines trust and causes harm when expectations are disappointed. The textbook's summary oversimplifies by suggesting any expectation creates a binding duty, but Scanlon is stricter. He requires that the promisee relies on the promiser intentionally causing the expectation, and that reliance could lead to harm.

  The user might be struggling because the textbook conflates all expectations with promises. For example, not correcting someone's guess about your plans isn't automatically binding under Scanlon. The promiser must intend to assure and the promisee must rely on that. This distinction is crucial but missing in the textbook.

  Another point is the dismissal of social practices. Scanlon does see conventions as facilitating promises but not the source of obligation. The textbook implies conventions are irrelevant, but Scanlon acknowledges their role in communication without grounding the duty in them.

  The lying analogy at the end is problematic. Breaking a promise isn't lying because the promiser might intend to keep it but fail. The wrong is in creating a false expectation, not necessarily an intentional false statement. The user might sense this conclusion is forced, so highlighting the difference between misleading and lying is key.

  I should structure the response by reconstructing Principle F, then analyzing each part of the textbook's summary. Point out where it's fair (e.g., duty from general moral principle), oversimplified (e.g., any expectation binding), and incorrect (e.g., lying equivalence). Emphasize the reliance and harm conditions, and clarify that social practices aren't the source but aid reliability.

  The user's deeper need is likely to grasp Scanlon's nuanced view for their seminar discussions or papers. They might need to correct misconceptions in class or understand the philosophical underpinnings beyond the textbook. Ensuring they see the specific conditions Scanlon imposes can help them articulate why the summary feels sloppy and strengthen their arguments.
answer: |-
  I'm glad you're wrestling with this – that textbook summary *is* problematic, and your unease is spot-on. While it captures the *anti-conventionalist spirit* of Scanlon's account, it distorts the *specificity* and *grounding* of his Principle F (Fidelity), leading to significant errors and the misleading "lying" conclusion. Let's break it down meticulously.

  **Reconstructing Scanlon's Principle F (Fidelity):**

  In *What We Owe to Each Other*, Scanlon derives the duty to keep promises from a more fundamental moral principle prohibiting actions that harm others by undermining valuable forms of reliance and trust. The core principle is **Principle F**:

  > *Principle F: If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A's not doing so); and (2) A knows that B wants to be assured of this; and (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; and (4) B knows that A has the beliefs and intentions just described; and (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent;*
  >
  > *THEN, in the absence of special justification, A must do X unless B consents to X's not being done.*
  >
  > *WHY? Because A's action creates a situation where B is likely to form expectations and rely on A doing X. If A then fails to do X without B's consent, B suffers a distinctive kind of harm: the harm of having one's trust and reliance deliberately invoked and then disappointed. This undermines the valuable practice of being able to give and receive assurances about future conduct.*

  **Crucial elements often missed:**
  1.  **Intentional Assurance:** Scanlon emphasizes the *deliberate act of assuring*. It's not just *causing* an expectation; it's *intending to provide assurance* that you will do X.
  2.  **Mutual Recognition:** Both parties must understand the situation (conditions 4,5,6). B must recognize that A is intentionally assuring them, and A must know that B recognizes this.
  3.  **Harm of Disappointed Trust:** The wrong isn't just disappointing *any* expectation. It's the specific harm done when someone *relies* on your *deliberate assurance* and is let down. This harm damages the valuable practice of giving/receiving assurances.
  4.  **Consent Condition:** The duty is conditional on the promisee *not consenting* to the non-performance. Release is possible.
  5.  **"Unless B consents" is Key:** This clause in the initial assurance distinguishes promises from mere predictions or statements of intent. It frames the assurance as creating an obligation *to B* that B has the power to waive.

  **Dissecting the Textbook Summary Clause-by-Clause:**

  1.  **"Scanlon holds that the duty to keep a promise has nothing to do with social conventions or the rules of a practice."**
      *   **Fair:** This is correct *in spirit*. Scanlon explicitly rejects the "practice view" (e.g., Rawls, Searle) that the duty *derives solely* from the existence of a social practice of promising. The *moral force* comes from Principle F, a general principle about harm and reliance.
      *   **Sloppy/Simplification:** It *overstates* the irrelevance of conventions. Scanlon acknowledges conventions *facilitate* promising by providing clear signals for when Principle F conditions are met. Saying "I promise" is an efficient way to satisfy the mutual recognition requirements (conditions 3-6). Conventions make promising *reliable and recognizable*, but the *duty itself* stems from Principle F, not the convention.

  2.  **"It comes from a general moral principle against causing expectations and then disappointing them."**
      *   **Fair:** Captures the anti-conventionalist core and the link to a general principle.
      *   **Sloppy/Inaccurate:** It's *far too broad and vague*. Scanlon's principle is **NOT** simply "against causing expectations and then disappointing them." It's specifically about:
          *   **Intentionally causing an expectation *by providing assurance*** (not just causing it passively).
          *   Doing so under conditions of **mutual recognition** (B knows they are being assured, A knows B knows, etc.).
          *   The wrong being the **harm of disappointed trust/reliance** in this specific context, which damages a valuable practice.
          Disappointing *any* expectation you *could have corrected* (like a guess about your plans) does **not** automatically invoke Principle F or create a binding obligation.

  3.  **"If I promise to water your plants, the reason I have to water them is just that I've made you believe I will, and it would be wrong to let you down."**
      *   **Fair:** The core idea that the duty stems from creating a belief/expectation and the wrong of letting down is present.
      *   **Sloppy/Inadequate:** It misses the *specific mechanisms* that make promising special:
          *   It's not *just* making you believe; it's *assuring* you *intentionally*.
          *   It requires *mutual recognition* of that assurance.
          *   The "wrong" is specifically the harm of *betraying deliberately invoked trust*, not just general disappointment.
          *   It omits the crucial "unless you consent" condition in both the initial act and the duty.

  4.  **"So any time you knowingly allow someone to form an expectation about what you'll do — even if it's just a guess about your plans that you could have corrected but didn't — you are bound just as if you'd promised."**
      *   **Fair:** Absolutely **None**. This is a **fundamental misrepresentation** of Scanlon and the most dangerous part of the summary.
      *   **Careful Scanlon Rejects This:** Principle F requires **intentional assurance**, not merely *failing to correct* an expectation. Letting someone believe a mistaken guess about your plans, while potentially rude or misleading in other ways, **does not** satisfy conditions (1) (voluntary and intentional leading), (2) (knowing B wants assurance), (3) (acting *with the aim* of providing assurance), (4), (5), or (6) (mutual recognition). You haven't *assured* them. Scanlon distinguishes sharply between *assurances* (which invoke Principle F) and mere *predictions* or *statements of intention* (which do not, even if they create expectations you could correct).

  5.  **"Promising is therefore only a label for creating expectations; the word itself does no moral work."**
      *   **Fair-ish in Spirit, Wildly Simplistic:** The phrase "I promise" isn't a *magic incantation* that creates duty out of thin air. The duty comes from Principle F.
      *   **Sloppy/Inaccurate:**
          *   "Creating expectations" is far too broad (see point 4).
          *   The word "promise" **does significant moral work** *pragmatically*: It is a highly conventionalized and efficient way to *satisfy the conditions of Principle F*. Saying "I promise" clearly signals:
              *   Intent to assure (satisfies 1, 3).
              *   Recognition that the promisee wants assurance (satisfies 2 implicitly).
              *   Creates mutual recognition (satisfies 4,5,6) – both parties instantly understand an assurance is being given and received.
          *   While the *duty* comes from Principle F, the *word* "promise" is a powerful tool for triggering that principle reliably and clearly. It's not *just* a label; it's a highly effective *instrument* for invoking the conditions under which Principle F applies.

  6.  **"This also shows that breaking a promise is basically a kind of lying, since what you did wrong was to state something false about your future conduct."**
      *   **Fair:** Breaking a promise often *involves* misleading the promisee, and the initial assurance can be false.
      *   **Sloppy and Conflating:**
          *   **Not Necessarily Lying:** Lying requires an *intention to deceive at the time of the statement*. You can sincerely promise to do X (intending to do it) but later fail due to weakness of will, unforeseen circumstances, or changing priorities. You stated your *intention* sincerely at the time; you didn't lie. The wrong in breaking the promise arises from the *harm of disappointed reliance*, not from the initial statement being a lie.
          *   **Wrong Focus:** The core wrong for Scanlon isn't the *falsity of the past statement*, but the *present harm caused by the failure to perform* after having invoked reliance. It's about the *broken trust*, not the *initial falsehood*. The initial statement might have been perfectly sincere.
          *   **Broader Category:** Breaking a promise is a specific type of *wrong* (violation of Principle F, harming through disappointed trust). Lying is a different (though sometimes overlapping) wrong (intentionally asserting what one believes to be false). Breaking a promise is more akin to *betrayal* than simple lying.

  **Conclusion: Separating Core from Gloss**

  *   **Accurate Core:** Scanlon grounds the duty to keep promises in a general moral principle (Principle F) prohibiting actions that harm others by deliberately invoking their trust and reliance and then disappointing it, *not* in social conventions. Promising is a primary way this principle is invoked. The word "promise" works by efficiently satisfying the conditions of Principle F (intentional assurance under mutual recognition).
  *   **Key Simplifications/Distortions in the Gloss:**
      1.  **Overly Broad:** Principle F applies *only* to *intentional assurances* given under conditions of *mutual recognition*, **not** to *any* expectation you cause or fail to correct.
      2.  **Ignores Intent & Mutual Recognition:** The textbook omits the crucial elements of *aiming to assure* and both parties *understanding* that an assurance is being given/received.
      3.  **Downplays the "Unless You Consent" Clause:** This is central to Scanlon's account and distinguishes promises from predictions.
      4.  **Misrepresents the Role of the Word "Promise":** While not magical, it *does* significant pragmatic work in triggering Principle F conditions reliably. It's not "just a label."
      5.  **Mischaracterizes the Wrong:** The harm is *disappointed trust/reliance deliberately invoked*, not just disappointment in general.
  *   **The "Lying" Conclusion:** This **does not follow** from the accurate core and **smuggles in a conflation**. The textbook summary's broad, passive view of "causing expectations" (point 4) makes promise-breaking *look* more like lying (a false statement). However, a careful reading of Scanlon shows:
      *   You can break a promise without having lied (if you intended to keep it).
      *   The wrong is primarily the *harm of broken trust and reliance*, not the initial falsity (if any).
      *   Lying is about *deceptive assertion*; promise-breaking is about *failing to fulfill an assurance*, causing a specific harm. While deceptive promising *is* lying *and* promise-breaking, most promise-breaking is not lying. The "lying" analogy obscures Scanlon's distinctive account of the harm involved.

  **In short:** The textbook captures Scanlon's rejection of conventionalism but disastrously over-simplifies Principle F into a vague prohibition on disappointing *any* expectation, leading to the false equivalence with lying. Scanlon's actual account is far more precise, requiring intentional assurance under mutual recognition, with the wrong located in the harm of betrayed trust, not mere falsity. Your unease was well-founded – the summary *is* sloppy on crucial details that matter significantly.
