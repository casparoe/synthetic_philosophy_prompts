  For alternatives, I’d stress that changing their approach would mean either:  
  - Dropping referential evaluation (just measure coherence, not facts)  
  - Or redesigning systems to include sensory/action loops (robotics, embodied agents).  

  But that’s impractical for their product goals. So maybe they need to reframe how they talk about models—avoiding terms like "knows," admitting the simulation of understanding. The user seems to want this honesty; their frustration with marketing gloss is palpable.  

