  Cruxes are essential. What sub-questions could shift opinions? One crux is whether rationality requires bounded utility functions. The fanatic might argue that boundedness is arbitrary, while the skeptic points to real-world applications needing finite resources. Another crux involves the epistemology of tiny probabilities—can they be meaningfully quantified? The fanatic trusts probability assignments, but the skeptic is wary of their reliability.

  For each crux, I need arguments both sides accept as relevant. For bounded utility, empirical cases like long-term investments might test practicality. The skeptic predicts boundedness will prove necessary, while the fanatic thinks adjustments can handle extremes. On tiny probabilities, hypothetical scenarios with increasing stakes could show if fanaticism holds under scrutiny. The skeptic expects such cases to break down, while the fanatic sees consistent application.

  I must avoid strawman portrayals. The fanatic isn't ignoring small probabilities; they rigorously apply the math. The skeptic isn't rejecting counterintuitive results but seeking coherence. Clarifying terms like "rational" and "should" is crucial. The fanatic ties rationality to formal coherence, while the skeptic links it to practical justifiability. Highlighting this distinction prevents verbal disputes.

  The user's deeper need might be fostering productive dialogue. They want a document that captures sophisticated arguments, helping participants move beyond talking points. Including structured sections with agreements, disagreements, and cruxes addresses this. By specifying testable predictions, the document can guide future research in the workshop.

  I should ensure both positions are represented fairly. For example, the fanatic's commitment to axiomatic approaches and the skeptic's emphasis on decision-making under constraints. Referencing real defenders like MacAskill for fanaticism and Weirich for skepticism adds credibility. Also, mentioning rejected solutions like probability discounting shows both sides' rigor.

  Finally, the document should facilitate adversarial collaboration. By laying out cruxes and test cases, it encourages empirical or theoretical exploration. This structure helps workshop participants engage with the core issues constructively, moving the debate forward.
answer: |-
  ## Joint Statement: Expected Value Fanatics vs. Skeptics in Normative Decision Theory

  **Preamble:** We, an Expected Value Fanatic (EVF) and a Fanaticism-Skeptic (FS), engaged in adversarial collaboration concerning the application of expected value maximization under normative uncertainty, especially in cases involving tiny probabilities of vast utilities ("fanatical" cases). We acknowledge the sophistication of both positions and seek to clarify the genuine points of agreement and disagreement to advance the debate. We agree that expected utility theory (EUT) is the foundational framework for rational choice under risk and normative uncertainty, but disagree fundamentally on whether its *unbounded and unmodified* application is rationally compelling in the limit.

  ### 1. Points of Agreement

  Both sides affirm the following:

  1.  **Formal Coherence:** The mathematical formalism of expected value calculation (EV = Σ P_i * U_i) is the correct *starting point* for rational decision-making under probabilistic normative uncertainty. It provides a powerful tool for aggregating beliefs and values.
  2.  **The Source of Trouble:** Cases like Pascal's Mugging (a tiny probability of an astronomically large payoff/penalty demanding extreme action), the St. Petersburg Paradox (infinite expected value from a game with finite almost sure outcomes), and similar fanatical scenarios expose a deep tension within standard EUT when applied to unbounded outcome spaces and arbitrarily small probabilities. These cases generate intuitively unacceptable prescriptions that challenge the theory's practical adequacy.
  3.  **Rejection of Ad Hoc Boundaries:** Proposed solutions involving arbitrary probability thresholds (e.g., "ignore probabilities below 10^-9"), arbitrary utility bounds (e.g., "cap utility at 10^100"), or domain restrictions (e.g., "only consider outcomes physically possible in our universe") are rejected by both sides. They lack principled justification, are vulnerable to manipulation, and fail to address the core structural issue.
  4.  **Rejection of Simple Probability Discounting:** Approaches that systematically downweight small probabilities (e.g., weighted probability models like rank-dependent utility) *solely to avoid fanaticism* are unsatisfactory. They often violate compelling axioms (like stochastic dominance) and lack a clear normative basis for the chosen weighting function.
  5.  **The Importance of Theoretical Coherence:** Any satisfactory solution must be integrated into a coherent decision-theoretic framework, not just a patch for specific counterexamples. It should respect core normative intuitions wherever possible while maintaining internal consistency.
  6.  **The Reality of Normative Uncertainty:** Agents often face genuine uncertainty about which moral theory (or value function) is correct, making the problem of aggregating across possibilities with potentially unbounded stakes practically relevant and theoretically pressing.

  ### 2. Disagreements Table

  | Disagreement Area       | Expected Value Fanatic (EVF) Stance (as they would phrase it)                                                                                            | Fanaticism-Skeptic (FS) Stance (as they would phrase it)                                                                                                                               |
  | :---------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Rational Requirement** | Rationality *requires* acting to maximize expected value, *regardless* of the size of the probability or the magnitude of the utility involved, provided the probability is non-zero and the utility is finite. Any deviation is irrational incoherence. | Rationality *requires* rejecting prescriptions derived from maximizing expected value when those prescriptions depend sensitively on arbitrarily defined tiny probabilities of arbitrarily large utilities ("fanaticism"). Accepting fanaticism undermines the justificatory basis of rational decision-making. |
  | **2. Unboundedness**    | The possibility space for normative theories and their evaluative outcomes must be considered unbounded in principle. Rational agents must be equipped to handle arbitrarily large utilities and arbitrarily small probabilities within the EUT framework. | Decision theory must incorporate principled bounds on either the range of *meaningfully comparable* utilities or the *epistemically tractability* of probabilities to yield practically coherent and justifiable prescriptions. Unboundedness leads to pathological results. |
  | **3. Status of Fanatical Cases** | Fanatical cases are valid implications of coherent EUT. Counterintuitive results stem from intuitions biased by limited experience and scale, not flaws in EUT. Rationality demands overcoming these biases. | Fanatical cases reveal a fundamental flaw in the *unrestricted application* of EUT to normative uncertainty. They demonstrate that maximizing expected value is not always the rational criterion when dealing with the limits of epistemic possibility and value aggregation. |
  | **4. Nature of "Should"** | "Should" is defined strictly by formal coherence with the axioms of rational choice (e.g., Savage, von Neumann-Morgenstern). Deviating from EV maximization violates these axioms and is therefore objectively irrational. | "Should" incorporates considerations of practical justification, epistemic responsibility, and the avoidance of pathological dependence on speculative extremes. Formal coherence is necessary but *not sufficient* for a full account of rational "should". |

  ### 3. Cruxes: Key Sub-Questions & Agreed Tests

  **Crux 1: Is a Bounded Utility Function (or Equivalent Structural Constraint) a Necessary Condition for a Coherent and Practically Adequate Decision Theory?**

  *   **Why it Matters:** If FS can demonstrate boundedness is necessary, fanaticism is structurally blocked. If EVF can show a fully adequate unbounded theory exists, fanaticism stands.
  *   **Agreed Test Case:** Analysis of long-term consequentialist theories (e.g., maximizing aggregate welfare over infinite time horizons or possible beings). Can an unbounded EUT yield non-arbitrary, actionable, and intuitively defensible prescriptions without collapsing into fanaticism or paralysis?
      *   **FS Prediction:** Unbounded theories will inevitably generate fanatical prescriptions in realistic scenarios involving deep uncertainty about vast futures. Boundedness (e.g., discounting, population ethics constraints) will prove necessary for coherence.
      *   **EVF Prediction:** Careful application of EUT (e.g., leveraging domain-specific knowledge, consistent probability assignments) can manage these cases without ad hoc bounds, upholding rationality. Boundedness introduces arbitrariness.
  *   **Agreed Argument Type:** Formal results showing either the inevitability of fanaticism under unboundedness without relying on ad hoc assumptions, or the possibility of constructing a consistent, action-guiding unbounded theory that avoids pathological results.

  **Crux 2: Can Epistemic Norms Meaningfully Assign and Justify Non-Infinitesimal Probabilities to Possibilities Involving Arbitrarily Large Utilities?**

  *   **Why it Matters:** Fanaticism often depends on assigning *some* non-zero probability to speculative scenarios with vast stakes. If such assignments are inherently unjustifiable or meaningless, the force of fanaticism weakens significantly.
  *   **Agreed Test Case:** Iterated variants of Pascal's Mugging or "Pascalian Priors". Examine whether an agent can consistently assign probabilities to increasingly outlandish hypotheses (e.g., "a being offering 3^^^3 utils exists and will reward/punish me") in a way that withstands epistemic scrutiny and avoids trivializing all other decisions.
      *   **FS Prediction:** Epistemic norms (e.g., simplicity, connection to evidence, calibration) will show that meaningful probabilistic assignments to sufficiently extreme hypotheses are either impossible or must decay so rapidly that they become pragmatically negligible compared to non-fanatical options, justifying discounting.
      *   **EVF Prediction:** Epistemic norms allow (and sometimes require) assigning non-zero probabilities to logically possible, even if empirically bizarre, hypotheses. The sheer magnitude of potential stakes means that even extremely low probabilities *must* dominate the calculation for a rational agent.
  *   **Agreed Argument Type:** Analysis grounded in formal epistemology (Bayesianism, imprecise probabilities, theory of evidence) and decision theory under severe uncertainty, focusing on the justification and robustness of probability assignments to extreme hypotheses.

  **Crux 3: Does Adherence to Unmodified EUT in Fanatical Cases Undermine the Practical Justifiability of Rational Choice More Generally?**

  *   **Why it Matters:** EVF prioritizes formal coherence. FS argues that if coherence leads to clearly unacceptable results, it undermines the claim that coherence defines rationality.
  *   **Agreed Test Case:** "All-or-Nothing" trade-offs. Compare an agent following EUT into fanaticism (e.g., sacrificing everything for a minuscule chance of vast payoff) vs. an agent using a bounded/modified rule. Which agent's choices are more defensible to others, or provide a more stable basis for cooperation, trust, and long-term planning?
      *   **FS Prediction:** The fanatic agent's behavior will appear reckless, unjustifiable, and lead to predictably bad outcomes in the overwhelming majority of possible worlds, undermining the practical authority of rationality claims based solely on EUT coherence.
      *   **EVF Prediction:** While the fanatic's choice may seem counterintuitive, it remains the uniquely rational action given the *actual* probabilities and utilities. Practical defensibility stems from correct application of rational principles, not from conforming to potentially flawed intuitions. The skeptic's agent is demonstrably irrational.
  *   **Agreed Argument Type:** Examination of the social and practical implications of each approach, including game-theoretic scenarios involving multiple agents with different decision rules, and philosophical arguments about the nature and purpose of rationality.

  ### Clarification on Terminology

  *   **"Rational" / "Should":** We acknowledge a key divergence. The EVF primarily uses "rational" to denote *formal coherence* with axioms like ordering, continuity, and independence (or their normative uncertainty analogs). The FS uses "rational" to denote *practical justifiability and avoidance of clear pathology*, even if requiring modification of the formal framework. This difference is substantive, not merely verbal. After setting aside the label, the core disagreement remains: **Is strict adherence to the EV calculation formula under any non-zero probability and finite utility a *sine qua non* of correct decision-making, or does avoiding fanatical dependence on speculative extremes constitute a higher rational imperative?**

  This statement reflects our best-faith effort to delineate the core of our disagreement while acknowledging shared ground and identifying paths for productive future inquiry. We hope it serves as a useful foundation for workshop discussion.

