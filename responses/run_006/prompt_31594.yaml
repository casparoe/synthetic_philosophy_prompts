  For each desideratum, I'll explain the case that motivates it and note whether it's non-negotiable or camp-specific. Then I'll identify potential tensions between desiderata, flag which one does the most to exclude main contenders, and end with a scorecard for nihilism, universalism, and the "life" view (like van Inwagen's).

  The professor seems to want the list to highlight inherent tensions in the debate - possibly suggesting that no answer satisfies all plausible requirements. I should be rigorous but avoid mere summaries of standard positions. The trout-turkey case pushes against unrestricted composition, while the table and organism support restricted composition. The heap and cloud introduce vagueness concerns. The statue/lump pair forces consideration of whether constitution is reducible to composition or requires separate treatment.

  The argument from vagueness is particularly thorny - it assumes composition can't be vague without arbitrariness, which pressures theories toward sharp boundaries. The epistemic desideratum matters because if a theory says ordinary objects don't exist (like nihilism), it must explain why we believe they do. The "over and above" question touches on grounding and ontological innocence - can a theory remain neutral here?

  I suspect several desiderata conflict: e.g., respecting ordinary objects while avoiding arbitrariness, or handling vagueness without sharp cuts. The sharp-boundary requirement (#4) might be the most exclusionary since it's hard to satisfy without unnaturalness. In the scorecard, nihilism fails ordinary objects but avoids arbitrariness; universalism embraces arbitrariness but handles all clear cases; the life view has sharp boundaries but excludes artifacts. 

  The overarching tension is that naturalness and non-arbitrariness pull against ordinary intuition and tolerance for vagueness. I'll conclude that every major theory violates at least one plausible desideratum - that's the critical insight for the seminar.
answer: |-
  Here is a carefully reasoned list of desiderata for an adequate answer to the Special Composition Question (SCQ), derived from first principles and key problem cases. Each desideratum is justified by specific considerations and assessed for negotiability. The list aims to capture the genuine metaphysical constraints revealed by the dialectic, not merely summarize existing positions.

  ### Desiderata for an Adequate Answer to the SCQ

  1.  **Accommodate Paradigmatic Composite Objects (Non-negotiable Core):** The theory must explain the existence and unity of *clear cases* where composition is uncontroversially taken to occur: a functioning artifact (e.g., a table assembled from legs and a top) and a living organism (e.g., a cat composed of its cells). Failure here means the theory fails basic descriptive adequacy for our world.
      *   *Case/Justification:* The table and the organism. Denying these seems wildly counterintuitive and renders the theory irrelevant to the world as we experience and describe it. This is the minimal data any theory must save.

  2.  **Respect the Non-Existence of Paradigmatic Non-Objects (Non-negotiable Core):** The theory must explain the *non*-existence of objects in cases where composition is uncontroversially taken *not* to occur: a mere aggregate (e.g., a heap of sand grains) and a radically disconnected pair (e.g., the trout-turkey).
      *   *Case/Justification:* The heap and the trout-turkey. While a heap has spatial proximity, it lacks the functional unity of a table or organism. The trout-turkey utterly lacks any relevant connection. Treating these as genuine composite objects seems metaphysically profligate and contradicts strong intuitions about objecthood and unity. A theory failing this becomes universalism by default.

  3.  **Avoid Metaphysical Arbitrariness (Non-negotiable for Restricted Theories):** If composition is restricted (neither nihilism nor universalism), the boundary between composing and non-composing pluralities must be drawn along a *metaphysically natural joint* or grounded in fundamental features of reality. It cannot be a brute, unexplained, or merely conventional line.
      *   *Case/Justification:* The continuum problem. Consider gradually moving the parts of a table apart (table -> loose parts) or gradually killing a cat (organism -> corpse -> scattered molecules). Any plausible restricted answer must place the composition cutoff somewhere. If the cutoff doesn't track a fundamental discontinuity (e.g., the presence/absence of *life*, a specific *causal nexus*), it appears arbitrary – why *here* and not one step over? This is the core challenge for restricted views posed by the slide towards nihilism or universalism.

  4.  **Resolve or Defuse Vagueness (Non-negotiable):** The theory must either (a) provide a *sharp and natural boundary* for composition (satisfying Desideratum 3), (b) explain why composition *can* be vague without metaphysical arbitrariness (e.g., via semantic indecision or ontological indeterminacy), or (c) convincingly show where the Argument from Vagueness (which claims composition *must* be sharp or else universalism/nihilism follows) goes wrong. It cannot leave the threat of vagueness undermining the proposed boundary.
      *   *Case/Justification:* The Argument from Vagueness itself. If composition is vague (e.g., is *this* arrangement of sand grains a heap? When *exactly* does a dying cat cease to exist?), and if composition is an all-or-nothing matter, then (the argument claims) either nihilism or universalism must be true to avoid vague existence. A restricted theory must tackle this argument head-on; ignoring it is fatal.

  5.  **Address the Problem of the Many (Constraint on Accommodating Paradigms):** The theory must provide a coherent account of how a single composite object (e.g., a cloud, a cat) can exist despite there being many overlapping collections of parts (e.g., cloud-candidates differing by a few molecules) that seem equally qualified to be *that* object under the theory's criterion.
      *   *Case/Justification:* The cloud and the cat. Clouds are vague, and cats have fuzzy boundaries (e.g., shedding cells). If the theory's condition for composition (e.g., causal unity) is satisfied by many slightly different pluralities in the same region, how does it pick out exactly one cat/cloud? The theory must either dissolve the problem (e.g., by denying many candidates exist, or by identifying the object with a maximal entity) or accept metaphysical indeterminacy without collapsing into incoherence. Prescinding is not an option; the problem arises directly from applying the composition criterion.

  6.  **Vindicate or Systematically Explain the Epistemic Salience of Ordinary Objects (Strong Preference, Often Non-negotiable in Practice):** The theory should either vindicate the existence and knowability of ordinary composite objects (tables, cats), or provide a compelling explanation for why we are systematically (but non-culpably) mistaken about them, and what we are *actually* perceiving/knowing/referring to instead. The cost of error theory must be justified.
      *   *Case/Justification:* Our pervasive belief in and interaction with tables and cats. If the theory denies these exist (e.g., nihilism, or a very restrictive view), it owes an explanation for the robust phenomenology and apparent success of our practices concerning them. If it affirms them (e.g., universalism, moderate restrictions), it should explain our ability to know and refer to them. A theory that renders ordinary objects unknowable or our beliefs about them inexplicable illusions faces a significant burden.

  7.  **Clarify the Relationship to Constitution (Constraint on Scope/Completeness):** The theory must either (a) show that constitution (e.g., statue/lump) is reducible to facts about composition and part-sharing plus modal or temporal properties, (b) demonstrate that the SCQ can be answered independently of constitution (i.e., composition facts are prior to or separable from constitution facts), or (c) integrate constitution into its account of composition. It cannot simply ignore constitution if the statue/lump case reveals a distinct metaphysical phenomenon.
      *   *Case/Justification:* The statue and the lump of clay. They share all parts at a time, yet seem distinct because they have different persistence conditions. Does composition occur for the lump? For the statue? Are they the same composite? An answer to the SCQ needs to situate itself relative to this puzzle. Can it explain the "co-location" of composites via part-sharing alone, or does it need an additional relation (constitution)? Prescinding risks incompleteness.

  8.  **Specify the Ontological Status of Composites (Neutrality Possible, but Implications Matter):** The theory should be explicit about whether composite objects are *something over and above* their parts (with novel causal powers or irreducible identity conditions) or are "ontologically innocent" (mere aggregates with no further ontological cost). While neutrality *might* be possible for the SCQ answer itself, the choice will deeply impact the theory's ability to satisfy other desiderata (e.g., explaining unity, avoiding causal overdetermination).
      *   *Case/Justification:* The intuition of genuine unity in organisms/tables vs. the mereological sum view. If composites are something over and above, this might help explain their unity and distinctness (Desiderata 1, 5) but raises questions about emergence and overdetermination. If they are not, this supports ontological parsimony but makes explaining the difference between a table and a heap (Desideratum 2) more challenging. While the SCQ answer *might* leave this open ("composition occurs when C, regardless of what it ontologically implies"), the implications for the theory's coherence and explanatory power are significant.

  ### Tensions and the Core Difficulty

  *   **Suspected Inconsistency:** Desiderata 1, 2, 3, 4, and 6 create a powerful tension that arguably **cannot be jointly fully satisfied.** Accommodating ordinary objects (1, 6) while excluding heaps/trout-turkeys (2) without arbitrariness (3) and while defusing vagueness (4) is the central challenge.
  *   **The Most Exclusionary Requirement:** **Desideratum 3 (Avoid Metaphysical Arbitrariness)** coupled with **Desideratum 4 (Resolve Vagueness)** does the most to exclude main contenders.
      *   *Nihilism* avoids arbitrariness (no composition, no boundary) but catastrophically violates 1 and 6.
      *   *Universalism* avoids sharp boundaries/vagueness problems (everything composes) but violates 2 (embraces trout-turkeys) and arguably 3 (no natural joint, just logical possibility).
      *   *Moderate Restricted Views* (e.g., contact, life, functional unity) struggle to satisfy 3 & 4: their proposed boundaries (e.g., moment of death, exact degree of functional integration) often appear *precisely where* we perceive vagueness, making them seem suspiciously arbitrary or demanding acceptance of counterintuitive sharp cuts or widespread indeterminacy. Showing their boundary is genuinely natural *and* sharp, or that vagueness is metaphysically acceptable at the boundary, is their biggest hurdle.
  *   **The Upshot:** **Every major type of answer to the SCQ violates at least one plausible and demanding desideratum.** There is no cost-free solution. The debate largely centers on which costs are more palatable and which desiderata are truly non-negotiable.

  ### Scorecard: Main Views vs. Desiderata

  1.  **Nihilism (Composition Never Occurs):**
      *   **Fails:** 1 (denies tables/cats), 2 (succeeds trivially by denying everything), 6 (requires radical error theory about ordinary objects, high cost).
      *   **Succeeds:** 3 (no boundary, no arbitrariness), 4 (no composition, no vagueness issue), 5 (no composites, no problem), 7 (no composites, no constitution issue), 8 (no composites).
      *   **Summary:** Avoids arbitrariness and vagueness perfectly at the extreme cost of eliminating all ordinary composites and requiring a massive error theory.

  2.  **Universalism (Composition Always Occurs):**
      *   **Fails:** 2 (embraces heaps/trout-turkeys as genuine objects), 3 (no natural joint, boundary is arbitrary - any plurality composes), 6 (vindicates ordinary objects but also vindicates bizarre objects, inflating ontology; arguably makes knowledge of *specific* ordinary objects harder amidst the clutter).
      *   **Succeeds:** 1 (affirms tables/cats), 4 (no vague composition - always occurs), 5 (can address via maximality or indeterminacy), 7 (can handle statue/lump via temporal parts or coincidence), 8 (tends towards ontological innocence).
      *   **Summary:** Captures all clear composites and avoids vagueness at the cost of ontological profligacy and inability to draw a non-arbitrary distinction between unified objects and mere heaps/scattered sums.

  3.  **Life (Composition iff caught up in a single life - van Inwagen):**
      *   **Fails:** 1 (denies existence of artifacts like tables - a major cost), 6 (requires error theory for artifacts), arguably 3 & 4 (is the precise moment a life begins/ends a metaphysically *sharp* and *natural* boundary? Or is it vague/arbitrary? This is highly contentious), 7 (must explain statue/lump without artifacts, focusing only on living parts).
      *   **Succeeds:** 2 (excludes heaps/trout-turkeys), 5 (can address problem of the many by appealing to maximal life-sustaining activities or accepting indeterminacy at fuzzy boundaries), 8 (typically views organisms as something over and above - "lives").
      *   **Summary:** Draws a seemingly natural (biological) boundary excluding artifacts and mere aggregates, but faces severe challenges regarding artifacts, the sharpness of life/death boundaries, and vagueness at organism edges. Its artifact denial is a major cost.

  This list and analysis provide the necessary framework for evaluating any proposed answer to the SCQ, highlighting the deep conceptual tensions and unavoidable trade-offs at the heart of the debate.
