answer: |-
  That's excellent that you're spotting the issues here! Your syntactic background gives you a sharp eye for potential misstatements. This passage, while capturing popular motivations, contains several problematic oversimplifications and conflations that a card-carrying intuitionist or constructive mathematician would strongly object to. Let's break it down:

  **Fair Points (mostly):**

  1.  **Rejection of LEM & BHK Motivation:** The core motivation is correctly attributed to Brouwer's constructivism: mathematical truth requires a construction/proof. Asserting `P ∨ ¬P` requires possession of either a proof of `P` or a proof of `¬P`. This is the foundation.
  2.  **Constructivity & Algorithm Extraction:** The link between intuitionistic proofs and algorithms is fundamentally sound. A constructive proof *does* contain an explicit procedure (or algorithm).
  3.  **Adoption in CS/Type Theory:** The historical adoption of intuitionistic logic as the foundation for type theory (especially Martin-Löf Type Theory) and verified programming due to computational content is accurate.

  **Subtly Wrong, Misleading, or Conflated Issues:**

  1.  **"Many classical theorems... simply become false":** **This is the most egregious error.**
      *   **Misleading:** Saying theorems "become false" strongly implies they are provably *false* in intuitionistic logic. This is **not** the case.
      *   **Reality:** These theorems (like IVT, B-W) are **unprovable** using only intuitionistic logic and constructive principles. They are *not* intuitionistic theorems. However, they are also **not** contradicted by intuitionistic logic itself. One cannot prove `¬IVT` intuitionistically either (assuming the classical IVT isn't contradictory).
      *   **Constructive Reformulation:** Crucially, many classical theorems *have* constructive counterparts. For example:
          *   The **constructive Intermediate Value Theorem** requires a *modulus of continuity* (uniform continuity) or a *locally non-constant* function. It becomes a statement about *approximations*.
          *   The **constructive Bolzano-Weierstrass Theorem** requires the sequence to be *located* or *totally bounded* in a specific constructive sense. It might state that *if* a sequence has a convergent subsequence, *then* we can find it, or guarantee approximations under stronger preconditions.
      *   **Nuance:** The classical versions, as stated using classical concepts like unrestricted existence or arbitrary sequences of reals, are *rejected* by intuitionists because they rely on non-constructive principles (like LEM or AC over uncountable sets). But they aren't "false"; they are *meaningless* or *unjustified* within the constructive framework. Saying they "become false" fundamentally misrepresents the intuitionistic stance.

  2.  **"Intuitionistic logic also forces you to reject the axiom of choice":** **This is an oversimplification conflating distinct issues.**
      *   **Full AC (Classical):** The full, unrestricted Axiom of Choice (AC) as used in classical set theory (e.g., ZFC) is indeed rejected by intuitionists. The passage correctly identifies *one* reason: the non-constructive nature of "choosing" without a rule. Other reasons include its use in proving non-constructive results (like the existence of non-measurable sets) and its incompatibility with the BHK interpretation when sets/types aren't well-specified.
      *   **But Not All Choice:** Intuitionistic logic does **not** force the rejection of *all* choice principles. Many weaker, *constructively valid* choice principles are accepted and even fundamental:
          *   **Countable Choice (AC₀₀):** If `∀n ∃x P(n, x)` then `∃f ∀n P(n, f(n))`. This is often considered constructively acceptable and is used in constructive analysis.
          *   **Dependent Choice (DC):** A stronger form needed for many constructive arguments involving sequences.
          *   **Type-Theoretic Choice:** In Martin-Löf Type Theory (the logical backbone mentioned), the type `(x : A) → (y : B(x)) → C(x, y)` is *isomorphic* to `(f : (x : A) → B(x)) → (x : A) → C(x, f(x))`. This is a *theorem* expressing a *constructively valid* form of choice. Programmers use this isomorphism (`curry`/`uncurry`) constantly.
      *   **Conflation:** The passage lumps together the rejection of *full, classical AC* with a blanket rejection of *all choice principles*, which is incorrect. It also conflates the *logical* status (what is provable) with the *philosophical* justification (why full AC is rejected).

  3.  **"Proof by contradiction and double negation elimination are gone":** **Technically correct, but potentially misleading.**
      *   **Correct:** `¬¬P → P` (Double Negation Elimination) is *not* a theorem of intuitionistic logic. Proof by Contradiction in its classical form (`(¬P → ⊥) → P`) relies on it.
      *   **Intuitionistic Proof by Contradiction:** However, `(P → ⊥) → ¬P` *is* intuitionistically valid. One *can* prove the *negation* of a statement by showing it leads to absurdity. What one *cannot* do is prove a *positive* statement `P` *only* by showing `¬P` leads to absurdity. This distinction is crucial. The passage mentions "proof by contradiction" generically without this nuance, potentially leading students to think *no* form of contradiction is allowed.

  4.  **"Mathematical truth consists in mental construction":** **Accurate for Brouwer, but...**
      *   **Nuance:** While capturing Brouwer's original radical idealism, this phrasing might be too narrow for modern constructive mathematics broadly construed (e.g., Bishop, Martin-Löf, type theorists). They emphasize *verifiable constructions* and *algorithmic content* without necessarily tying it solely to a *private mental act*. The core is about evidence (proof/construction) being public, communicable, and algorithmic, not necessarily exclusively mental.

  **Summary for the Card-Carrying Intuitionist/Constructivist:**

  *   **Accept:** Rejection of LEM based on BHK; Constructivity & algorithm extraction; Unprovability (not "falsity") of many classical theorems *as classically stated*; Rejection of *full, classical AC*.
  *   **Strongly Reject:** The claim that classical theorems "simply become false". They become *unprovable* or require *reformulation*. This misrepresents the entire constructive enterprise.
  *   **Correct Nuance Needed:** The blanket statement against "proof by contradiction" needs the distinction between proving negations and proving positives. The rejection of AC needs qualification regarding weaker, constructively valid choice principles.
  *   **Potential Overemphasis:** While Brouwer's mentalism is historically important, modern constructive mathematics often emphasizes the objectivity of constructions and proofs.

  **Why this matters for you (Proof Theory):**

  Your syntactic expertise is highly relevant! The distinction between "unprovable" and "false" is crystal clear in proof theory. You know that intuitionistic logic (`IPC`) is a subsystem of classical logic (`CPC`):

  *   `CPC ⊢ φ` does *not* imply `IPC ⊢ φ` (e.g., LEM, DNE, Classical IVT).
  *   `CPC ⊢ φ` does *not* imply `IPC ⊢ ¬φ` (e.g., `¬IVT` is *not* an intuitionistic theorem).
  *   `IPC` has its *own* theorems with explicit computational content (via Curry-Howard).

  The passage conflates the *metalogical* status (unprovable in `IPC`) with the *object-level* truth (false in some model/interpretation). For constructive math, the relevant models are constructions/programs, not classical boolean-valued models. A classical theorem lacking a constructive proof isn't "false" in those constructive models; it simply *lacks a witness/realizer*.

  **Conclusion:**

  The passage captures the popular motivation but stumbles significantly on the implications, particularly by equating "unprovable intuitionistically" with "false", oversimplifying the stance on choice, and not fully clarifying proof by contradiction. As a proof theorist, you correctly sensed the overstatements regarding theorems becoming false and the axiom of choice. The core constructive perspective is that classical mathematics often proves statements *about idealized objects* in ways that lack computational meaning or evidence. Constructive mathematics seeks to rebuild those parts of mathematics that *do* have computational meaning, leading to different, often more informative, theorems – not to declare classical results "false" in an absolute sense.

  For further reading that avoids these pitfalls, look at works by Bridges & Richman (*Varieties of Constructive Mathematics*), Beeson (*Foundations of Constructive Mathematics*), or the Stanford Encyclopedia of Philosophy entries on Intuitionism and Constructive Mathematics. Bishop's *Foundations of Constructive Analysis* is the classic text demonstrating how to do analysis constructively *without* claiming classical theorems are false.
