prompt: |-
  I run a small reading group that has been stuck for three weeks on the dollar auction and the escalation-of-commitment literature, and I'd like you to draft the document that should come out of it. Two of the regulars, Priya and Marcus, have agreed to do an adversarial collaboration. Priya's line is that the auction is a trap built into the payoff structure: the two highest bidders both pay but only the winner gets the dollar, so once you're in second place you're choosing between paying your bid for nothing and raising to cut your loss, and escalation is mostly loss-minimization by a clear-eyed agent — the actual mistake is entering without a precommitment, not continuing. Marcus's line is that this is a rationalization: the clean story assumes away the actual drivers — sunk-cost reasoning, competitive arousal, face-saving, self-justification — and the escalation-of-commitment experiments show people going far past anything a plausible loss-minimizing calculation would license. So escalation, he says, is a decision error, not a feature of rationality.

  Please write the joint statement they could both sign, with: (1) a numbered agreed-claims section, about the auction's payoff structure, about what the escalation literature has and hasn't shown, and about where their two analyses are answering different questions; (2) a disagreements table, each entry phrased so it's own side would accept the wording — including at least whether fully rational agents with common knowledge of rationality would ever end up escalating past the dollar (and what difference a precommitment device or a known upper bound makes), and whether the psychological mechanisms are causes of the escalation or post-hoc stories; (3) the cruxes, the sub-questions such that settling one would move at least one of them, and for each crux a concrete manipulation, game variant, or argument both would accept as bearing on it, with Priya's and Marcus's predictions recorded in advance. Also say explicitly if some of their dispute is verbal — I suspect they mean different things by "rational escalation" — and flag any agreed claim that is so hedged it does no work.

  And please don't just hand me a balanced-sounding document for the sake of it. If you think an adversarial collaboration between these two positions is itself confused — say, because one is doing normative game theory and the other is doing descriptive psychology, or because the game-theoretic "trap" framing doesn't survive adding a known upper bound or a precommitment device — tell me that plainly and say what they should be arguing about instead. Where you're unsure about the game-theoretic details, say so rather than papering over it.
