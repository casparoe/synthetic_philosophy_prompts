answer: |-
  ### Exam Question (90-minute essay)  
  **Critically engage with the moral distinction between doing and allowing harm through the lens of life-sustaining treatment withdrawal.** Explain why classifying the *active* withdrawal of treatment (e.g., disconnecting a ventilator at a competent patient’s request) as "letting die" challenges attempts to ground the doing/allowing distinction solely in (a) the physical difference between acting and refraining, or (b) bare causal involvement. Then, evaluate whether the distinction can be plausibly revised—for instance, by appealing to the *initiation vs. discontinuation* of causal sequences or to *rights-based frameworks*—without collapsing into ad hoc reasoning or disguised consequentialism.  

  ---

  ### Model Answer (≈700 words)  
  The doing/allowing distinction is central to deontological ethics, traditionally holding that actively causing harm (doing) is morally worse than passively permitting it (allowing). Standard accounts ground this in physical or causal differences: doing involves bodily movement that initiates harm, while allowing entails inaction within preexisting causal chains. Withdrawing life-sustaining treatment, however, destabilizes this framework. Disconnecting a ventilator is a deliberate physical act—a physician *does* something—yet it is widely classified as letting die. This exposes flaws in grounding the distinction in mere action/inaction or causal contribution.  

  First, the action/refraining dichotomy fails. Withdrawal is indisputably an action (flipping a switch, removing tubing), yet it is morally and legally treated as an omission equivalent to withholding treatment. If "acting" physically suffices for "doing harm," withdrawal must constitute killing. But we resist this conclusion, suggesting physical movement alone cannot define "doing." Similarly, causal analyses falter. Both withdrawing treatment and omitting it entirely cause death by removing necessary support. If causal responsibility determines "doing," both cases should be equivalent, but intuitively, withdrawal aligns with allowing. The withdrawal case thus pressures definitions reliant on superficial mechanics: it forces us to recognize that identical physical acts or causal roles can be classified differently based on context.  

  To salvage the distinction, theorists propose revisions. One approach distinguishes *initiating* a lethal sequence from *discontinuing* intervention. On this view, withdrawal merely ceases ongoing aid, whereas killing introduces a new threat. Philippa Foot’s "positive/negative agency" exemplifies this: disconnecting stops a life-prolonging act (negative agency, allowing), while injecting poison creates a fatal threat (positive agency, doing). Yet this revision risks becoming ad hoc. Why is removing support fundamentally different from introducing harm? Both alter the status quo to cause death. If I disconnect a ventilator, I actively remove oxygen; if I administer poison, I actively introduce toxin. The moral asymmetry appears contingent on framing ("interrupting aid" vs. "imposing harm") rather than an intrinsic difference. Without independent justification, this reframing seems question-begging.  

  Rights-based revisions offer an alternative. Here, withdrawing treatment is allowing because patients have a right to refuse bodily intrusions. Disconnection merely honors their autonomy, rendering the physician’s role incidental. Killing, however, violates the victim’s rights regardless of consent. This elegantly classifies withdrawal but faces two pitfalls. First, it may reduce the doing/allowing distinction to a rights violation test, implying that "doing" is simply "unjustified harming." This invites consequentialism: if rights are grounded in interests, the distinction becomes derivative of net outcomes. Second, it struggles with non-rights cases. Imagine disconnecting a ventilator *against* a patient’s wishes. If withdrawal is intrinsically "allowing," it should remain less culpable than killing, but violating autonomy arguably makes it akin to doing harm. Rights-based views thus risk conflating the distinction with permissibility conditions rather than explaining its underlying structure.  

  Ultimately, the withdrawal case reveals that the doing/allowing distinction cannot rest on value-neutral criteria. Physical acts and causal chains gain moral significance only within normative contexts—e.g., entitlements to aid, role-based duties, or prior commitments. While revisions like the initiation/discontinuation or rights frameworks offer pragmatic coherence, they either implicitly rely on moral judgments (making the distinction derivative) or succumb to contextual variability that mirrors consequentialist weighing. This doesn’t doom deontology but suggests the distinction must be defended as a *moral primitive* reflecting agent-relative constraints, not a descriptive boundary.  

  ---

  ### Marking Scheme (20 Total Marks)  
  **A Answer (17–20 marks):**  
  - **Explains the pressure point:** Clearly articulates why withdrawal is an *action* that is classified as *allowing*, undermining physical/causal definitions (3 marks).  
  - **Critiques initial grounding:** Thoroughly demonstrates how action/inaction and causal criteria fail to classify withdrawal consistently (3 marks).  
  - **Evaluates both revisions:** Systematically assesses initiation/discontinuation *and* rights-based approaches, exposing ad hoc/consequentialist risks for each (6 marks).  
  - **Synthesis:** Argues that defensible revisions require normative (not empirical) foundations, acknowledging tensions with deontology’s aims (4 marks).  
  - **Structure:** Logically organized, precise terminology (2 marks).  

  **B Answer (13–16 marks):**  
  - Identifies withdrawal’s challenge but lacks depth in explaining why causal/action-based definitions fail.  
  - Discusses only one revision (e.g., rights) or evaluates revisions superficially.  
  - Recognizes ad hoc/consequentialist risks but doesn’t trace their implications for deontology.  
  - Competent structure but minor gaps in clarity/coverage.  

  **Common Mistakes (Deduct 1–3 marks per occurrence):**  
  1. **"Withdrawal isn’t *really* an action"**: Misunderstands the case’s purpose by denying its active nature.  
  2. **"Letting die because no duty exists"**: Conflates doing/allowing with positive/negative duties.  
  3. **"Consequentialism resolves this easily"**: Avoids deontology’s internal challenge by switching frameworks.  
  4. **Overgeneralizing rights**: Claims rights *always* determine the distinction, ignoring non-rights scenarios.  

  ---  
  **Word Counts**: Question (150), Model (698), Scheme (220).  
  **Note**: This tests analytical depth, not citation recall. Strong answers must dissect conceptual tensions and evaluate revisions’ theoretical costs.
