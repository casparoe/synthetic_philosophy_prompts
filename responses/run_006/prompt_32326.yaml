  I was reading this pop-sci book on quantum physics and consciousness, and the author gives a summary of Schrödinger's views that I'm not sure I trust. The passage goes something like this:

  "Schrödinger was convinced that quantum mechanics proved the ancient Vedantic teaching that all consciousness is one. He showed that quantum entanglement means particles remain connected across any distance, and he argued that human minds work the same way — beneath the illusion of separate selves, there's a single cosmic consciousness linking all beings. The reason you feel like a distinct person is maya, a kind of perceptual trick, and Schrödinger believed that quantum physics was finally catching up to what the Upanishads had known for millennia: that Atman is Brahman, that your innermost self is identical with the ground of all reality."

  I know Schrödinger actually wrote about Vedanta and took it seriously — that much is real — but the way this author makes it sound like he was using quantum entanglement as a mechanism for mind-melding feels off. I also vaguely remember that his interest in Vedanta came through Schopenhauer rather than from him trying to retroactively justify physics with mysticism. Can you go through this summary and tell me what's genuinely Schrödinger, what's the author projecting onto him, and what's just garbled? I want to know whether I should trust anything else in this book.
