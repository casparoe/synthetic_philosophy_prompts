answer: |-
  ## Upon the Scales of Sense

  My cube: defined by edges sharp and straight,
  By corners meeting, points that press and bite
  The patient palm, a keen, familiar weight.
  Its angles, known by pressure, day and night.
  My sphere: the seamless curve, the constant sweep,
  No ridge to catch, no change in its incline,
  A perfect whole the searching hand would keep,
  A truth confirmed by touch's steady sign.
  These forms reside within my mind's embrace,
  Not shadowed guesses, but clear substance won
  Through years of handling every curve and face –
  This world of touch, beneath the shrouding sun.
  *The bandages fall. Light becomes a flood.*
  *Two shapes before me on the polished wood.*

  One gleams with facets, hard lines sharply drawn,
  A fractured sunbeam caught in rigid frame.
  The other holds the light, a seamless dawn,
  A single curve proclaiming its own name.
  But which is which? The cube? The smooth command?
  My practiced hands recall the biting edge,
  The yielding roundness. Yet this sight-scanned land
  Offers no bridge across the knowledge ledge.
  To name them now, without my touch's aid –
  This test reveals the mind's foundation stone:
  Are senses walled, by slow experience swayed,
  Or does one spatial tongue speak truth alone?
  Is space a common script, innate and deep,
  Or must the shattered senses learn to leap?

  ---

  **Note on Contested Positions/Empirical Claims:**

  1.  **Immediate Matching Ability:** The poem portrays the speaker's *inability* to visually distinguish and match the cube and sphere to their tactile counterparts immediately upon sight restoration. While historical cases (e.g., Cheselden) suggested initial difficulty, modern studies (e.g., Held et al., 2011, on sight-restored congenitally blind patients) show more nuanced results. Some patients demonstrate *some* capacity for cross-modal matching very quickly (within days), though often imperfect and significantly improved with minimal visual experience. The poem leans towards the classic philosophical expectation of initial failure, which is not universally supported by all empirical evidence.
  2.  **Molyneux's Original Question:** William Molyneux's original question (1688, in a letter to Locke) specifically asked if a person born blind, made to see, could *visually distinguish and name* a cube and a sphere they had previously known by touch ("*tell which is the Globe, which the Cube*"). The poem stages a slightly different test: visually distinguishing the shapes and *matching* them to their tactile identities (knowing which seen shape *was* the cube/sphere they felt), without necessarily naming them. While closely related, naming and matching are distinct cognitive tasks. The poem focuses on the core matching problem central to the philosophical debate about innate spatial concepts.
  3.  **Philosophical Stakes Framing:** The closing couplet presents the nativist (common spatial language) vs. empiricist (separate senses needing connection) dichotomy clearly. However, modern cognitive science suggests a more complex interaction. While innate spatial *processing* mechanisms likely exist (supporting aspects of the "common script" view), the specific *association* of visual forms with tactile experiences and their *meaning* (like "cube-ness") appears to require learning and experience (supporting the empiricist aspect). The poem simplifies the debate into its classic dichotomy, which remains a live, though refined, philosophical question.
