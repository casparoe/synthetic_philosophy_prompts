prompt: |-
  I've been reporting on the wild animal suffering stuff — the idea that nature is basically a horror show for most individual animals, that r-selected species means billions of creatures being born just to die painfully within days, and that this is a massive neglected moral problem. I've gotten pretty convinced. But I'm a journalist and I know how easy it is to get swept up in a compelling argument. So tell me what would actually count against this view. I don't want the easy objections that defenders already have stock answers for. I want the stuff that a smart advocate would concede is a genuine problem for their position. What evidence would make the whole thing look overblown or misguided? What practical or philosophical defeaters are there? And be honest: has the view been insulated against falsification to the point where nothing could really count against it? If so, is that a problem for this kind of claim or just what you'd expect from a normative view?
