  Finally, the "moral overdemandingness" angle—asking if caring about every nematode is psychologically sustainable. That's more pragmatic than philosophical, but journalists care about pragmatism. Might pair well with the "does this paralyze environmentalism?" concern.

  *Brainwave* The user would probably appreciate concrete hooks: "Imagine if we discovered X" scenarios. Like if pain-negative animals were found, or if ecosystems collapsed after intervention. Those make abstract problems visceral. File under "evidence that would make WAS look overblown." 

