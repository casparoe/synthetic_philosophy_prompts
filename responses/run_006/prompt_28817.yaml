prompt: |-
  I'm putting together a position paper on moral uncertainty for a graduate seminar, and I want to run my commitments past someone who can spot where they pull against each other before I embarrass myself in class. Here's where I've landed after the first few weeks of reading:

  (1) The right way to make decisions under moral uncertainty is to maximize expected choiceworthiness (MEC): for each action, weigh the choiceworthiness that action would have according to each moral theory you have credence in by that credence, sum across theories, and pick the action with the highest total.

  (2) Intertheoretic comparisons of choiceworthiness — the step where you need to say that theory A's verdict "this action is wrong" counts for more or less than theory B's verdict "this action is suboptimal" — are possible only when the theories share enough structural common ground. In practice, this means you can compare two consequentialist theories (they both use a value function you can normalize) but you can't compare a consequentialist theory with a deontological one in any non-arbitrary way.

  (3) When intertheoretic comparisons break down, the right fallback is moral caution: if any theory you have non-negligible credence in says an action is seriously wrong, don't do it — even if the expected-choiceworthiness math (were it computable) might have come out in favor of doing it.

  (4) Moral uncertainty is structurally the same problem as empirical uncertainty. In both cases, you have a probability distribution over possible states and a value assignment to outcomes or actions, and the rational norm is to maximize expected value. The machinery is identical; the only difference is what the uncertainty is about.

  (5) The fanaticism worry — that a tiny credence in a bizarre moral theory will dominate all your decisions — isn't as serious as it looks, because fanatical results only arise if you grant extreme views extreme choiceworthiness magnitudes, and those magnitudes are exactly the sort of thing intertheoretic comparisons can't establish non-arbitrarily. The fanaticism problem is really just the intertheoretic comparison problem in disguise.

  I'd like you to act as a professional philosopher who works on decision theory and normative ethics and think through this carefully. Go through the commitments and identify which pairs are genuinely in tension and which only appear to be. Rank the genuine tensions by severity. For each, explain what would have to give and what the cheapest revision would cost me. I'm especially worried I might be implicitly helping myself to something in (3) or (4) that (1) and (2) rule out, or that (4) and (2) can't both be right at the same time. Don't just flag everything — some of these look worse than they are, and I want to know which.
reasoning: |-
  Okay, let me approach this systematically. The user presents five commitments about moral uncertainty and wants me to identify tensions between them. 

  First, I need to understand the core ideas: They endorse MEC (1) but limit its application to comparable theories (2), propose moral caution as fallback (3), equate moral and empirical uncertainty (4), and reframe fanaticism as a comparison problem (5).

  The most obvious tension jumps out between (1) and (3) - MEC requires calculation while caution bypasses it. But (2) already anticipates this by making MEC inapplicable where comparisons fail. Still, (3) introduces a completely different decision procedure when comparisons break down, which contradicts (4)'s claim of structural identity with empirical uncertainty.

  Hmm, (4) is particularly problematic. In empirical uncertainty, we don't have this comparison breakdown issue because all outcomes share a common value metric. But with moral theories, deontology and consequentialism might use incommensurable "currencies" of evaluation. The user seems to acknowledge this in (2) but doesn't reconcile it with (4).

  The fanaticism point (5) is actually quite clever - by linking it to intertheoretic comparisons, they avoid needing to solve it separately. But this makes the unresolved comparison problem even more urgent. If we can't normalize scales, how do we implement MEC even between two consequentialist theories with different value units?

  Looking at (3), moral caution feels like a practical patch rather than a principled solution. It's suspiciously similar to deontological thinking, which might beg the question against consequentialist approaches they have credence in. And how do we define "seriously wrong" across theories without facing the same comparison problem?

  The ranking of tensions should probably be:
  1. (4) vs (2) - the structural equivalence claim directly contradicts the comparison limitation
  2. (1) vs (3) - MEC and caution are fundamentally different decision procedures
  3. (2) itself - the comparison feasibility threshold seems vague ("enough structural common ground")

  The cheapest fix might be to moderate (4) by admitting moral uncertainty has unique features, while keeping MEC as ideal. But that costs them the elegant unification. Alternatively, they could drop moral caution (3) and accept incomparability means true indecision - though that's practically unsatisfying.

  I should also note how (5) depends entirely on resolving (2). If comparisons are possible, fanaticism needs addressing; if not, it's moot. The user's framework hangs on solving the comparison problem they've declared unsolvable for mixed theories.
answer: |-
  You've developed a sophisticated framework, but there are genuine tensions—particularly between **structural equivalence (4)** and **intertheoretic comparison limits (2)**, which cascades into problems for **MEC (1)** and **moral caution (3)**. Fanaticism (5) is well-contained but highlights the core tension. Below is a ranked analysis of tensions, with the most severe first. I'll flag where appearances are misleading.

  ---

  ### **Ranked Genuine Tensions**  
  **1.  (4) Structural Equivalence vs. (2) Intertheoretic Comparison Limits**  
      - **Tension Severity:** High (potentially fatal to your framework).  
      - **Why:** (4) claims moral and empirical uncertainty are structurally identical. But empirical uncertainty assumes a *common value function* across states (e.g., dollars or utils). (2) denies this for moral theories, arguing that deontological and consequentialist "choiceworthiness" lack a common scale. If comparisons are impossible in key cases (e.g., "don't lie" vs. "maximize utility"), the machinery of expected value *cannot be applied*—contradicting (4).  
      - **Cheapest Revision:** Drop (4)'s strong equivalence. Admit moral uncertainty is *analogous* but requires unique tools (e.g., normalization protocols, cautious heuristics) when theories are structurally divergent. Cost: Loses elegant unification but saves the rest.  

  **2.  (1) MEC Requirement vs. (3) Moral Caution Fallback**  
      - **Tension Severity:** Moderate (conceptual clash in decision rules).  
      - **Why:** (1) demands maximizing expected choiceworthiness, while (3) overrides this with a veto rule ("don't do X if any theory says it's seriously wrong"). When comparisons fail, (3) isn't a *fallback for MEC*—it’s a *different decision procedure* (closer to maximin or a deontic constraint). This contradicts (1)'s claim that MEC is always "the right way."  
      - **Cheapest Revision:** Recast (3) as a *pragmatic heuristic* for ignorance, not a normative requirement. Or restrict (3) to cases where comparisons are *truly impossible* (not just difficult). Cost: Weakens (3)'s moral force but avoids inconsistency.  

  **3.  (2) Intertheoretic Comparisons Limited to Consequentialism vs. (5) Fanaticism as Comparison Problem**  
      - **Tension Severity:** Low (internally coherent but exposes vagueness in (2)).  
      - **Why:** (5) correctly notes fanaticism relies on arbitrary magnitude comparisons. But (2) claims comparisons are possible between consequentialist theories via "normalization." Yet if two consequentialist theories use *incommensurable* value units (e.g., hedonic utils vs. objective-list flourishing), normalization may still be arbitrary. Your (2) needs clearer criteria for "structural common ground."  
      - **Cheapest Revision:** Clarify that "normalization" requires shared *dimensions* of value (e.g., both theories admit cardinal scales, even if units differ). Cost: Invites debates about what counts as "shared structure."  

  ---

  ### **Apparent Tensions That Aren't Genuine**  
  - **(1) MEC vs. (2) Comparison Limits:** *No tension.* (2) explicitly defines when MEC is *applicable*, so (1) is conditional on comparability. This is consistent.  
  - **(3) Moral Caution vs. (5) Fanaticism:** *No tension.* (3) blocks extreme options (e.g., torturing innocents) *without* needing precise comparisons, sidestepping fanaticism. (5) reinforces that magnitudes are arbitrary, supporting (3)'s caution.  

  ---

  ### **The Core Problem: (2) Undermines (4), Threatening (1) and (3)**  
  Your framework hinges on whether (4) can survive (2). If moral uncertainty lacks a common value scale, then:  
  - MEC (1) *cannot be implemented* for mixed ethical views, violating (1)'s claim that it's "the right way."  
  - Moral caution (3) becomes a *separate principle* unrelated to MEC, contradicting (1).  
  - **Root issue:** (4) assumes all uncertainties reduce to expected utility maximization. But if moral theories don't share a choiceworthiness scale, they lack the "utility function" required for empirical-style expected value.  

  ---

  ### **Recommended Revisions**  
  1. **Abandon strong (4):** Replace with: *"Moral uncertainty adapts formal tools from decision theory but requires special methods for intertheoretic comparisons."*  
  2. **Reframe (3):** Present moral caution as a *proxy for MEC under ignorance* (e.g., Will MacAskill's "principle of moral uncertainty") rather than a standalone norm.  
  3. **Clarify (2):** Specify what "structural common ground" entails (e.g., ordinal rankings? cardinal scales? boundedness?). This strengthens (5).  

  ---

  ### **Why You Won't Embarrass Yourself**  
  Your commitments reflect key insights in the literature (e.g., MacAskill, Sepielli, Lockhart). The tensions arise from current debates—not oversights. By acknowledging and refining them (e.g., dropping strict equivalence), your position becomes defensible. Focus your paper on **why structural equivalence fails for moral uncertainty**—that’s a compelling argument. If pressed in class, note that (3) is a *pragmatic response to incomparability*, not part of MEC itself.
