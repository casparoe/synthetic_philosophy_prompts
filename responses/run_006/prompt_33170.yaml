prompt: |-
  I have been noticing a recurring move in arguments about which beings deserve moral consideration, and I do not have a word for it. Someone will argue that we ought to extend some protection to, say, shrimp or bees, and in that part of the argument sentience is treated as a matter of degree: a shrimp is a little sentient, a dog is more sentient, a human is very sentient, and even a small amount of sentience should count for something. Then, a few minutes later in the same conversation, when someone objects that a thermostat or a simple robot also responds to its environment and adjusts its behavior to new information, the same person switches to speaking of sentience as something a being either has or entirely lacks — the thermostat simply is not sentient, full stop. The graded way of talking does the work when the aim is to draw marginal cases inside the circle of concern, and the binary way of talking does the work when the aim is to keep clearly non-sentient systems outside it.

  I am not asking whether shrimp or bees are in fact sentient, or where any line should be drawn. I am asking about the pattern itself: the slide, within a single argument, between treating a property as a continuum and treating it as a threshold, where each treatment is deployed as the argument requires. Does this move have an established name, either in discussions of moral status or in the more general theory of concepts? I can see that it is adjacent to the sorites/vagueness problem about heaps and baldness, and to plain equivocation, but it does not seem identical to either: it is not just the difficulty of saying where a vague boundary falls, and it is not just using one word in two senses, because the two senses are systematically related. If there is no exact name, I would like one coined, with a definition precise enough to distinguish it from the sorites, from equivocation, and from the legitimate position that sentience really is a graded property that underlies a binary moral threshold. What would a careful view have to say about how the graded notion and the threshold notion relate to each other, and under what conditions, if any, one may move between them without begging the question?
reasoning: |-
  Okay, the user is describing a recurring argument pattern they've noticed in discussions about moral consideration. They observe that when someone wants to include beings like shrimp or bees in moral consideration, they present sentience as a graded continuum ("a little sentient"). But when that same person wants to exclude things like thermostats, they switch to treating sentience as binary ("either sentient or not"). 

  Hmm, this is actually quite sophisticated. The user isn't asking about where to draw moral lines, but about the logical structure of the argument itself. They've already recognized it's adjacent to sorites paradoxes and equivocation but distinct. That shows they've thought deeply about this.

  Let me unpack what's happening here. The core issue seems to be a strategic shifting between two valid ways of conceptualizing sentience: as a continuous property (how much sentience) and as a threshold property (whether sentience exists). The problem arises when the same person uses whichever framing serves their immediate rhetorical goal, without consistency.

  I recall this resembles what's called "concept gerrymandering" in philosophy - selectively defining a concept's boundaries to achieve a desired outcome. For sentience debates specifically, the term "sentience-threshold sliding" might capture it well. 

  The user wants precision: they specifically ask to distinguish this from legitimate positions where sentience is graded but has a moral threshold. That's crucial. A careful view would acknowledge that both continuous and threshold aspects can coexist coherently if: (1) the underlying property (neurobiological complexity) is continuous, (2) the emergent property (sentience) has a threshold, and (3) we apply consistent criteria when categorizing entities.

  The unspoken need here might be for intellectual tools to call out this rhetorical sleight-of-hand in debates. The user seems frustrated by inconsistent argumentation and wants to name it precisely. That's why I'll emphasize how to identify when the shift becomes fallacious versus when it's philosophically justified - giving them concrete criteria about consistency in application of thresholds.
answer: |-
  This argumentative pattern is a recognizable and problematic move in moral philosophy discussions. While it doesn't have a single universally established name, it can be precisely described and distinguished from related concepts:

  **1. Proposed Names & Definition:**
     *   **Sentience-Threshold Sliding:** (Most descriptive for this specific context)
     *   **Conceptual Boundary Gerrymandering:** (Highlights the strategic redrawing of the boundary)
     *   **Threshold Opportunism:** (Focuses on exploiting the threshold for rhetorical advantage)
     *   **The Continuum/Binary Switch Fallacy:** (Descriptive but more general)

  **Definition:** The fallacious practice of strategically switching between treating a property (e.g., sentience) as a continuous spectrum and as a strict binary threshold *within a single argument*, specifically to include desired cases within a category (using the continuum) while excluding undesired cases (using the binary), without justification for the shift and while relying on the ambiguity between the two conceptualizations.

  **2. Distinguishing it from Related Concepts:**
     *   **Sorites Paradox (Heap Paradox):** The Sorites deals with the genuine difficulty of applying a vague predicate (like "heap" or "sentient") to borderline cases due to small, incremental changes. The fallacy here is *not* about grappling with borderline cases, but about *actively exploiting* the vagueness by *changing the conceptual framework* used to analyze *different* cases for strategic gain. The Sorites is a problem; this fallacy is an argumentative tactic.
     *   **Equivocation:** Standard equivocation uses the *same word* with *different, unrelated meanings*. Here, the meanings (continuous capacity vs. binary status) *are systematically related* – the binary status is intended to *supervene* on the underlying continuous property. The fallacy exploits the *relationship* and the *context-dependent application* of these linked concepts, not just a simple shift to an unrelated definition.
     *   **Legitimate Threshold Model:** It *is* philosophically coherent to hold that:
          *   Sentience (or a necessary substrate) is a continuous, graded property (e.g., neural complexity, information integration).
          *   Phenomenal consciousness (subjective experience) emerges as a threshold property – you either have it or you don't, even if the underlying basis is continuous.
          *   Moral status requires crossing this threshold.
          *   **The key difference:** A legitimate view applies the *same consistent criteria* for identifying the threshold and assessing all cases against it. The fallacy occurs when the *criteria or the conceptual framework itself* (continuous vs. binary) is switched opportunistically.

  **3. Why it's Fallacious & Question-Begging:**
     *   **Inconsistency:** The arguer uses incompatible conceptual models for different cases without justifying *why* the model changes.
     *   **Hidden Premise:** The switch presupposes the desired conclusion about the moral status of the specific entities in question (shrimp should be in, thermostats must be out). The reasoning becomes circular: "Shrimp deserve consideration because they have *some* sentience (treating it as continuous), and thermostats don't deserve consideration because they have *no* sentience (treating it as binary), *therefore* shrimp are sentient and thermostats aren't." This assumes the very distinctions it's trying to prove.
     *   **Exploits Ambiguity:** It leverages the inherent complexity and unresolved nature of consciousness to avoid providing rigorous definitions or criteria that apply consistently.

  **4. What a Careful View Requires:**
  To move between the graded basis and the moral threshold *legitimately*, one must:

     *   **Explicitly Define the Concepts:** Clearly distinguish:
          *   **The Underlying Continuous Property (UCP):** What is the empirically observable or theoretically proposed continuous feature (e.g., neural complexity, information integration capacity, behavioral flexibility)? This is the *basis* for sentience.
          *   **Sentience/Phenomenal Consciousness:** Define this as the *emergent binary property* of subjective experience. Acknowledge that while its basis (UCP) is continuous, sentience itself is an "on/off" emergent phenomenon (even if this is debated, the model must be clear).
          *   **Moral Status Threshold:** Argue why crossing the sentience threshold (not just having some UCP) is necessary and sufficient for moral consideration.
     *   **Define the Threshold Consistently:** Provide (even tentatively) criteria for identifying the point on the UCP continuum where sentience *likely* emerges. This is challenging but essential. Is it a specific level of neural integration? A specific behavioral marker? Acknowledging uncertainty is fine, but the *same* criteria must be applied to *all* cases.
     *   **Apply Criteria Uniformly:** Assess bees, shrimp, dogs, humans, thermostats, and AI *using the same UCP measure and the same proposed sentience threshold*. Argue that thermostats fall *far below* any plausible threshold based on the UCP, while shrimp are *near or above* a minimally plausible threshold. The distinction comes from applying consistent criteria to the continuum, *not* from switching how the property is conceptualized per case.
     *   **Acknowledge Uncertainty & Borderlines:** Honestly address that borderline cases (like shrimp, insects, simple AI) exist where applying the threshold is genuinely difficult and requires careful analysis based on the defined UCP and the best evidence for the emergence of sentience. Avoid using the binary switch to dismiss these challenges.

  **In essence:** The fallacy avoids the hard work of defining a sentience threshold based on a continuous property and applying it consistently. A careful view embraces that work, acknowledging that while the *basis* is continuous, the *emergent property* (sentience) and the *moral status* it confers might be threshold-based, requiring rigorous and uniform criteria for application across all entities. Switching frameworks mid-argument to achieve a pre-desired categorization is not sound reasoning; it's conceptual sleight of hand. "Sentience-threshold sliding" accurately captures this deceptive maneuver.
