prompt: |-
  I'm a PhD student in moral philosophy, and next week I have to lead a fifty-minute tutorial on the separateness-of-persons objection to utilitarianism for first-year undergraduates. They've had two lectures on consequentialism already: they can state the basic act-utilitarian criterion, they know the difference between hedonistic and preference-satisfaction versions, and they've been walked through the demandingness objection and the problem of interpersonal utility comparisons. They have not read Rawls or Nozick, and the objection itself will be new to them.

  Don't explain the objection to me. Plan how I should explain it: the order in which the pieces must be introduced and why each depends on the one before it, the single carrying example that should run through the whole session, the misconceptions they are likely to form and exactly where in the sequence I should head each one off, and what I should openly set aside as beyond the scope of the session. I'd also like one question I can ask in the last five minutes that will tell me whether they've grasped the objection as a structural point about the logic of aggregation rather than as just another complaint about utilitarianism being too demanding or impractical.

  A few things I want you to work around. Please do not use the standard tradeoff between a large number of mild headaches and one person's torture as the carrying example; they will have seen some version of that in lecture, and I want the tutorial to force them to think about the structure of the objection rather than reaching for a familiar intuition pump. I also suspect they will arrive with at least three misconceptions ready to hand: that the objection is just the demandingness objection restated, that it amounts to asserting that individuals have rights which utilitarianism violates, and that the real problem is that the felicific calculus is impossible to carry out in practice. I need to know where each of these is likely to surface and how to defuse it without making students feel stupid for having thought it.
reasoning: |-
  Okay, let me approach this systematically. The user is a moral philosophy PhD student preparing a tutorial on the separateness-of-persons objection to utilitarianism for first-year undergraduates. They've provided specific parameters: students understand basic act-utilitarianism, demandingness objections, and utility comparisons but haven't encountered Rawls or Nozick. The challenge is to structure the explanation while avoiding common misconceptions and overused examples.

  First, considering the pedagogical sequence. The objection must be built from foundational concepts the students already know - particularly utilitarianism's aggregation principle. I decide to start there explicitly, then introduce the distributive question, before contrasting interpersonal distribution with intrapersonal trade-offs. The key is making the structural distinction undeniable before even naming the objection.

  For the carrying example, I need something visceral but novel. The standard headaches-versus-torture case is banned, so I consider alternatives. A weight distribution scenario comes to mind: one person bearing crushing weight versus many sharing lighter burdens. This maintains physicality while avoiding familiar thought experiments. It also allows clear visualization of distribution across bodies.

  Anticipating misconceptions: 
  1) Confusing separateness with demandingness - I'll emphasize that demandingness is about cost to one agent, while separateness concerns distribution across patients. 
  2) Mistaking it for rights-violation - I'll clarify this precedes rights talk. 
  3) Reducing it to practical impossibility - I'll stress it's theoretical.

  The reveal should come late - only after establishing the structural point. And for assessment, I consider a question forcing distinction between aggregation logic and demandingness: "Why couldn't a utilitarian redistribute burdens unevenly?" This probes whether they see the objection as targeting aggregation itself.

  Throughout, I maintain respect for students' existing knowledge while guiding them past predictable misunderstandings. The physical example serves as both anchor and analytical tool across all stages.
answer: |-
  Here’s a structured plan for your tutorial, designed to build the objection step-by-step, preempt misconceptions, and use a cohesive analogy while respecting your constraints:

  ---

  ### **Core Analogy: The Weighted Backpacks**  
  *Instead of headaches/torture, use:*  
  **"100 students must carry 100kg of supplies 10km. Utilitarianism must decide how to distribute weight."**  
  *(Concrete, visceral, avoids familiar intuition pumps, highlights distribution across bodies)*

  ---

  ### **Sequence of Explanations (50 mins total)**  
  **1. Utilitarianism Recap + Aggregation Principle (5 mins)**  
     - *Review:* Act-UT maximizes total net utility.  
     - *Key point:* "Utility is *fungible*—it doesn’t matter *whose* utility it is."  
     - *Analogy setup:* "Total weight carried is all that matters—whether one person carries 100kg or 100 carry 1kg each."  

  **2. Introducing Distribution (10 mins)**  
     - *Question:* "Is there a moral difference between these distributions?"  
       - Option A: One person carries 100kg (collapses after 1km).  
       - Option B: 100 people each carry 1kg (all finish unharmed).  
     - *Student intuition:* B seems fairer, but UT *requires* B if total "burden-utility" is better.  
     - *Critical link:* UT cares only about *summed* burden, not *who* bears it.  

  **3. The Misstep: Intrapersonal vs. Interpersonal Trade-offs (15 mins)**  
     - *Intrapersonal analogy (safe ground):*  
       "If *one person* chooses between carrying 100kg once or 1kg/day for 100 days, UT approves—it’s the same total burden to *one life*."  
     - *Interpersonal shift (the crux):*  
       "But distributing 100kg *across 100 people* treats 100 separate lives like one life’s experiences. This *ignores that burdens fall on distinct individuals*."  
     - *Visual:* Whiteboard sketch showing 100kg on **one body** vs. 1kg on **100 bodies**.  
     - *Preempting Misconception #1 (Demandingness):*  
       "This isn’t about Option A being too demanding for the carrier—it’s about Option B using separate persons as ‘containers’ for utility."  
       → *Defuser:* "Demandingness is about *agent sacrifice*. This is about *patient distribution*."  

  **4. Naming the Objection: "Separateness of Persons" (10 mins)**  
     - *Define:* "Utilitarianism aggregates utility *as if* society is one big person. But persons are separate—you can’t ‘balance’ my burden against your gain like you can within one life."  
     - *Analogy reinforcement:* "Just as we can’t average the weight across 100 backpacks and say ‘all is well’, we can’t average suffering/benefit across persons."  
     - *Preempting Misconception #2 (Rights):*  
       "This isn’t yet about rights—it’s deeper: UT’s math *denies moral significance to individual boundaries*. Rights *follow from* this, but the core is structural."  
       → *Defuser:* "Rights are one response to separateness, but the objection shows *why* UT’s structure fails even *before* we talk rights."  

  **5. Contrast with Interpersonal Comparisons (5 mins)**  
     - *Preempting Misconception #3 (Felicific Calculus):*  
       "Even if we *could* perfectly compare utilities (e.g., know exactly how much weight each can bear), the problem *remains*: summing across persons treats separate lives as one."  
       → *Defuser:* "This isn’t practical—it’s about whether aggregation *makes sense*, not whether we can *measure* it."  

  **6. What We’re Setting Aside (2 mins)**  
     - Explicitly exclude:  
       - Rawls/Nozick (historical responses).  
       - Alternative theories (rights, egalitarianism).  
       - "This session is about *diagnosing a flaw in UT’s logic*, not solving it."  

  ---

  ### **Check-for-Understanding Question (Final 5 mins)**  
  **"Imagine a utilitarian redistributes weight so 50 people carry 2kg each, and 50 carry nothing. How does the separateness objection apply *even if total burden decreases*?"**  

  - *Why it works:*  
    - If they focus on unfairness/demandingness → missed the point.  
    - **Correct grasp:** "The *improved total* still ignores that 50 people bear burdens *for the sake of others*—it aggregates across separate beings."  
    - *Tests if they see:* The objection targets aggregation *itself*, not outcomes.  

  ---

  ### **Why This Sequence Works**  
  1. **Builds from familiar (UT aggregation) to critical insight (interpersonal ≠ intrapersonal).**  
  2. **Single analogy prevents cognitive overload and reinforces the structural flaw visually.**  
  3. **Preempts misconceptions *at the point they arise*:**  
     - Demandingness defused when contrasting Option A/B.  
     - Rights defused when naming the objection.  
     - Measurement defused after interpersonal comparison.  
  4. **Final question isolates the structural critique:** Forces distinction between "bad results" and "flawed logic."  

  ---
  **Materials needed:** Whiteboard (for weight distribution sketches), printout of the backpack scenario for reference. **Tone:** Use "we might initially think..." to normalize misconceptions as natural stepping-stones. This frames the objection as a discovery, not a "gotcha."
