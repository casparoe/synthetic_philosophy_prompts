prompt: |-
  I'm running a reading group for grad students from differnt departments—mostly not philosophy—and next week I'm doing Hempel's raven paradox. I've got about forty minutes and I want them to actually feel the pull of the paradox, not just learn what it is. Don't explain the paradox to me (I know it); plan how I should explain it to them. What has to be in place first, what's the one example or case that carries the whole thing, what misconceptions will they form at each step and where exactly should I head each one off, and what's one question I can ask at the end to check whether they got it rather than just nodding along. Also, what should I explicity leave out at this level and say so.

  Lead with the bottom line—the single most important thing about teaching this—and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is running a reading group for grad students from different departments, mostly non-philosophy, and wants to teach Hempel's raven paradox in 40 minutes. The main goal is for them to feel the paradox's pull, not just understand it. They don't need an explanation of the paradox itself but a teaching plan. 

  First, I need to recall the key elements of the paradox. Hempel's raven paradox deals with confirmation theory. It shows how observing a non-black non-raven (like a white shoe) can confirm the hypothesis that all ravens are black, which seems counterintuitive. The challenge is making students feel that weirdness.

  The user mentioned several specific requests: what foundational concepts to establish first, which example to use, common misconceptions and how to preempt them, a check-for-understanding question, and what to explicitly omit. They also want the bottom line upfront.

  The most important teaching point is creating cognitive dissonance. Students need to confront why the logical equivalence feels wrong. Without that tension, it's just a logic puzzle. So, every part of the lesson should build toward that moment of unease.

  For foundational concepts, students must grasp universal conditionals ("All ravens are black") and how instances confirm them. Starting with a non-paradoxical example like "All apples in this basket are red" makes sense. A green apple disconfirms it, while a red apple confirms it. 

  Then, introducing the logical contrapositive is crucial. "All ravens are black" is equivalent to "All non-black things are non-ravens." This equivalence is the core of the paradox. Using the same apple example to show contrapositive equivalence can help. For instance, "All apples are red" vs. "All non-red things are non-apples (from this basket)."

  The raven hypothesis should follow. Writing out both forms: H1: All ravens are black. H2: All non-black things are non-ravens. Emphasize that these are logically the same statement.

  Now, the key example: observing a white shoe. Since it's non-black and a non-raven, it confirms H2. But because H2 is equivalent to H1, it also confirms "all ravens are black." That's the jarring part. Students will resist this. They'll think observing irrelevant things (like shoes) shouldn't affect a hypothesis about ravens. So, I need to reinforce that logic dictates it does, even though it feels wrong.

  Common misconceptions to address: 

  1. Equating confirmation with proof. Students might think confirming means proving true. Clarify that confirmation increases likelihood slightly, not proves it. Use the apple example—seeing one red apple doesn't prove all are red, but it does add a tiny bit of support.

  2. Misunderstanding equivalence. They might think H1 and H2 are different. Stress that they're logically identical; same information, just rephrased. 

  3. Intuitive dismissal. They'll argue that a shoe has nothing to do with ravens. Acknowledge that intuition but point out logic overrules it here. This is where the paradox bites.

  4. Scope neglect. Not realizing that universal statements about all ravens inherently make claims about everything in the universe. A non-black thing could be anything, hence the shoe example works. Emphasize the universal scope.

  For the check question, asking why observing a white shoe feels irrelevant even though it's logically confirming. This tests if they grasp the tension between logic and intuition.

  What to omit: Avoid Nicod's criterion and probabilistic approaches. Mention that these are advanced topics, but for now, the focus is on the basic paradox.

  Timing is tight. Spend 5-10 minutes on foundations, 15 on the paradox setup, 10 on the shoe example and reactions, 5 on Q&A. Use the apple example to scaffold. Keep it interactive; ask them to predict what confirms the hypothesis at each step.

  The bottom line: Make them feel the contradiction between logic and intuition. Without that, the lesson fails. Everything builds to that dissonance.
answer: |-
  ### Bottom line:  
  **Make them viscerally experience the tension between airtight logic and revolting intuition—don't let them rationalize it away prematurely.**  

  ---

  ### Teaching Plan:  
  **1. Foundational Setup (10 mins)**  
  - **Start with confirmation basics:** Use a non-paradoxical example.  
    *Example:* "Suppose I claim, 'All apples in this basket are red.' What confirms this?"  
    - *Green apple in the basket?* → **Falsifies**. (They’ll agree.)  
    - *Red apple in the basket?* → **Confirms**. (Obvious.)  
  - **Introduce logical equivalence:**  
    - Hypothesis: "All ravens are black" (H1).  
    - Logically equivalent: "All non-black things are non-ravens" (H2).  
    - *Crucial:* Show equivalence via contrapositive:  
      *"If it’s a raven, then it’s black" ≡ "If it’s not black, then it’s not a raven."*  
    - **Checkpoint:** Ask, *"If I prove non-black things are never ravens, does that mean all ravens are black?"* (Yes—hammer this.)  

  **2. The Paradox Engine (15 mins)**  
  - **Present Hempel’s setup:**  
    - *Observation 1:* A black raven → Confirms H1 (intuitive).  
    - *Observation 2:* A white shoe (non-black, non-raven) → Confirms H2.  
    - *Logic trap:* Since H1 ≡ H2, the white shoe **must also confirm H1**.  
  - **Force the dissonance:**  
    - *Ask:* "How many of you buy that a white shoe supports 'all ravens are black'?" (Most will reject it.)  
    - *Reinforce logic:* "If H1 and H2 are identical, how can something confirm one but not the other?"  

  **3. Misconceptions & Preemptive Strikes**  
  - **Misconception 1:** *"But a shoe has nothing to do with ravens!"*  
    - **Cutoff:** *Before* they say this, stress: "Logic claims scope is universal. If non-black things exist, they *must* be non-ravens for H1 to hold."  
  - **Misconception 2:** *"Confirming isn’t proving—it’s just weak evidence."*  
    - **Preempt:** After Observation 2, clarify: "We’re not saying shoes *prove* it—just that they add *some* confirmation, like a raven does."  
  - **Misconception 3:** *Equivalence isn’t intuitive.*  
    - **Anchor:** Use the apple basket: "Finding a non-red thing *outside* the basket (e.g., a blue car) confirms 'all non-red things are non-apples [from this basket]'—which *is* equivalent to H1."  

  **4. The "Feel It" Moment (10 mins)**  
  - **Contrast:**  
    - *Black raven:* "Feels relevant, obvious confirmation."  
    - *White shoe:* "Feels absurd, meaningless."  
  - **Highlight the paradox:** "Your gut rejects what logic demands. *That’s* the paradox—not a trick, but a collision between formal rules and intuition."  

  **5. Check-for-Understanding Question (5 mins)**  
  - **Ask:** *"Why can’t we dismiss the white shoe as irrelevant *without* breaking the logic of equivalence?"*  
    - **Correct answer:** Rejecting it requires denying that H1 and H2 are identical—but they are logically inseparable. If they appeal to "relevance" or "context," they’ve missed the point.  

  **6. Explicit Omissions**  
  - **State upfront:** "We’re skipping solutions (e.g., Bayesian responses) and the grue paradox. Why? Today’s goal is to *feel* the paradox—not resolve it. Treat this like staring at an optical illusion."  

  ---

  ### Why This Works:  
  - **Scaffolding:** Builds from uncontroversial examples → paradox.  
  - **Cognitive dissonance:** The white shoe *forces* discomfort. Don’t soften it—linger there.  
  - **Combatting nods:** The checkpoint question exposes surface-level agreement. If they can’t articulate why intuition clashes with logic, they’re nodding.  
  - **Time efficiency:** Focuses *only* on the paradox’s core tension. No detours.  

  **Key trap to avoid:** Letting them "solve" it early. Shut down premature solutions with: "For now, sit with the unease. That’s where the philosophy lives."
