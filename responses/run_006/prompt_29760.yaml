answer: |-
  ### 1. Groundwork (150 words)  
  Judgment theories treat emotions as *evaluative cognitions*: fear is a judgment that an event is dangerous and relevant to goals. Perception theories frame emotions as *direct sensory readouts*: fear is perceiving autonomic arousal (e.g., heartbeat) as signaling threat. Feeling theories equate emotions with *subjective phenomenology*: fear is the raw qualitative experience ("what it’s like"), distinct from causes or behaviors.  

  **Translation rules**:  
  - **No smuggling**: I won’t imply RL/predictive coding concepts "solve" philosophical disputes.  
  - **Respect intentionality**: If a theory claims emotion is *about* something (e.g., danger), map to state representations or prediction errors.  
  - **Level discipline**: Judgment = computational (goal-relevance), perception = algorithmic (sensory inference), feeling = implementational (phenomenal access)—*unless* a theory explicitly bridges levels.  
  - **Transparency**: Flag forced mappings (e.g., "consciousness" in RL remains ill-defined).  

  ---

  ### 2. Vocabulary Map (200 words)  

  | Philosophical Concept      | RL/PP Equivalent                          | Fidelity Note                                  |  
  |----------------------------|------------------------------------------|-----------------------------------------------|  
  | Appraisal                  | State-value function \(V(s)\) update     | Partial: \(V(s)\) lacks explicit *normative* evaluation (e.g., "threat to me"). |  
  | Bodily change              | Interoceptive prediction error (IPE)     | High: IPE signals autonomic divergence from homeostatic priors. |  
  | Feeling (phenomenal)       | Qualia (if any) in global workspace      | Low: RL has no formal model of qualia; "readout" is a placeholder. |  
  | Intentional object         | Latent state \(s\) (e.g., "predator")    | High: \(s\) grounds the "aboutness" of RPE/IPE. |  
  | Valence                   | Reward prediction error (RPE) sign       | High: Positive RPE ≈ approach, negative ≈ avoidance. |  
  | Action tendency            | Policy \(\pi(a|s)\) shift                | High: Policy optimization drives action selection. |  
  | Emotion (judgment view)    | Belief update over goal-relevant \(V(s)\) | Moderate: Assumes goals are explicitly represented. |  
  | Emotion (perception view)  | IPE + Allostatic inference               | High: Body-as-sensor for value (interoception as perception). |  
  | Emotion (feeling view)     | Attended sensory buffer content          | Low: RL lacks theory of why some states *feel* like anything. |  

  ---

  ### 3. Judgment Theories in Target Vocabulary (250 words)  
  Emotions are computational updates to the agent's *evaluative model* of states. Fear occurs when a latent state \(s_t\) (e.g., looming object) is inferred to have low expected value \(V(s_t)\) relative to active goals (e.g., survival), triggering a high-magnitude negative RPE. This appraisal is a belief revision over the agent’s world model \(P(s_{t+1} | s_t, a_t)\): if \(s_t\) predicts future states with low \(V(s)\) (e.g., injury), it is labeled "dangerous." The emotion *is* this inference process—specifically, the shift in \(V(s)\) and subsequent policy reweighting toward avoidance actions \(\pi(a|\text{escape})\). Crucially, the appraisal is *model-based*: it requires simulating trajectories (e.g., "if I stay, pain likelihood increases"). Valence is RPE sign; intensity is RPE magnitude. Bodily changes (e.g., cortisol release) are *downstream effects* of policy selection (e.g., mobilizing energy for flight), not the emotion itself.  

  **Forced mapping**: Judgment theories often imply *conceptual* evaluation (e.g., "this is a violation of rights"), but RL reduces this to prediction errors over scalar value. Normative content (e.g., "dangerous") becomes a learned value label.  

  ---

  ### 4. Perception Theories in Target Vocabulary (250 words)  
  Emotions are *interoceptive inference* processes. Fear is the perception of a cascade of interoceptive prediction errors (IPEs) signaling bodily divergence from allostatic setpoints (e.g., rising heart rate, cortisol). These IPEs are *treated as evidence* for a latent "threat" state \(s_t\). The emotion is the brain’s *best guess* of the bodily state, generated by minimizing interoceptive free energy: \( \text{argmin}_{s} \, D_{\text{KL}}[q(\text{body} | s) \| p(\text{body})] \). Here, bodily changes aren’t consequences but *data*: ascending vagal signals are direct inputs. Valence arises from the sign of the *allostatic RPE* (e.g., IPE indicating falling blood glucose → negative valence). Action tendencies (e.g., freezing) are policy samples from a prior \(p(\pi | \text{high IPE})\) favoring uncertainty reduction. This view is inherently *model-free*: the body "senses" value without needing a world model.  

  **Critical note**: Perception theories map cleanly to predictive processing of interoception. "Bodily perception" ≈ IPE; "value" ≈ allostatic error. No residue beyond consciousness (see §6).  

  ---

  ### 5. Feeling Theories in Target Vocabulary (250 words)  
  Emotions are *conscious experiences* generated when affective processes enter a global workspace (GWS). Fear is the quale produced when RPEs/IPEs associated with threat states \(s_t\) are *attended* and encoded in a limited-capacity sensory buffer. This buffer integrates exteroceptive (e.g., visual predator cues), interoceptive (e.g., IPE from amygdala), and evaluative signals (e.g., \(V(s_t)\) from OFC) into a unified "felt" state. Crucially, the feeling *is not* the RPE, IPE, or policy shift—it is their *subjective rendering* in the GWS. Valence is the experiential flavor (e.g., "negative hedonic tone") of this integrated state. Bodily changes and appraisals may *cause* feelings (e.g., high IPE → GWS entry) but are not identical to them.  

  **Radical limitation**: RL has no naturalization of qualia. I map "feeling" to GWS occupancy, but this is descriptive—*why* some state representations have phenomenology is unaddressed. Judgment/perception processes are pre-conscious; feeling is their late-stage broadcast.  

  ---

  ### 6. Residue Report (350 words)  
  **Translated cleanly**:  
  - *Intentionality* → Latent state inference \(s_t\) (all views).  
  - *Valence* → RPE/IPE sign (all views).  
  - *Bodily changes (perception)* → IPE (high fidelity).  
  - *Action tendencies* → Policy sampling \(\pi(a|s)\) (high fidelity).  
  - *Appraisal (core)* → \(V(s)\) update + goal relevance (moderate fidelity; see below).  

  **Translated with distortion**:  
  - *Appraisal’s normative dimension*: Judgment theories call fear a "judgment of danger," implying conceptual/ethical evaluation. RL reduces this to RPE over evolutionarily coded rewards (e.g., pain avoidance). *Residue*: Normative force ("I *should* flee") vs. scalar value. **Blind spot**: RL lacks a model of *why* certain outcomes are "bad" beyond reinforcement history.  
  - *Perception’s directness*: Jamesian claims that emotion *is* the sensation of the body resist reducing IPE to a neural signal. **Residue**: "Raw sensation" vs. probabilistic inference. **Philosophical blur**: Perception theories often conflate neural representations with conscious perception.  
  - *Feeling’s privacy*: Subjective "what it’s like" maps to GWS occupancy, but this doesn’t capture the *ineffability* of qualia. **Blind spot**: RL has no account of why GWS states feel like anything.  

  **No counterpart**:  
  - *Qualia*: The intrinsic phenomenology of fear has no RL correlate. Predictive coding suggests precision-weighting modulates "vividness," but this doesn’t entail phenomenology. **Verdict**: Genuine limitation of current computational frameworks.  
  - *Emotional depth*: Feeling theories emphasize that emotions feel "meaningful," not just salient. RL links salience to RPE magnitude but can’t distinguish a "profound" sadness from intense pain. **Philosophical blur**: "Meaning" is undefined across theories.  
  - *Normative appraisal*: Judgment theories’ claim that emotions "track reasons" (e.g., anger judges injustice) has no RL equivalent. **Blind spot**: RL agents don’t represent "reasons," only values.  

  ---

  ### 7. Verdict (150 words)  
  **Levels artifact**: The judgment vs. perception debate collapses under translation. Judgment is computational (inferring \(V(s)\)); perception is algorithmic (reading IPEs). They describe complementary processes in a hierarchical RL agent: model-based appraisal updates priors for model-free interoceptive inference.  

  **Substantive disagreement**: The irreducibility of *feeling* is real. Judgment/perception theories can be fully operationalized pre-consciously; feeling theories demand an account of why some state representations are conscious and possess qualia. This isn’t a levels issue—it’s a gap in computational neuroscience.  

  **Vocabulary growth needed**: To express the residue, you’d need:  
  - A theory of *phenomenal binding*: How disparate signals (RPE, IPE, \(s_t\)) generate unitary affective qualia.  
  - A model of *intrinsic motivation*: Why certain RPEs feel "meaningful" (e.g., social exclusion vs. electric shock).  
  - *Normative RL*: Extending value functions to represent "reasons" (e.g., "wrongness" as a learnable abstract reward).  

  The core dispute isn’t about cognition vs. embodiment—it’s about whether emotion *must* feel like something to be itself. Your vocabulary handles the first two theories; the third exposes its hard problem.
