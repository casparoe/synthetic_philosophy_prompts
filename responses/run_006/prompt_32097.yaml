answer: |-
  Here’s a structured 50-minute lesson plan in British English designed to make the Orwellian/Stalinesque distinction **causally substantive**, using a focused example and pre-empting common misconceptions.  

  ---

  ### **Session Plan: Dennett’s Distinction – When Does Consciousness Happen?**  
  **Core Goal:** *Force students to see the distinction as competing causal architectures, not just descriptions.*  

  #### **1. Introduction: Framing the Problem (5 mins)**  
     - **Hook:** "Last week, colour phi showed your brain ‘retcons’ a smooth motion narrative. Today we ask: *When* does this narrative become conscious? Is it *during* the event (Stalinesque) or only *upon reflection* (Orwellian)?"  
     - **Stakes:** "This isn’t about ‘filling in’ gaps—it’s about whether consciousness requires a *real-time stream* or a *post-hoc story*. Dennett argues both explain the *report*, but only one explains the *causal chain*."  

  #### **2. The Pivotal Example: **Memory Revision vs. Real-Time Fabrication** (20 mins)**  
     - **Why NOT use colour phi?** Students already associate it with "filling in," muddying the temporal distinction.  
     - **Use this instead:**  
       > **"The Magic Card Trick"**:  
       > *A magician flashes two cards: first the Queen of Hearts (Q♦), then the King of Spades (K♠). You swear you saw the Queen *morph* into the King. But in reality, the trick used a hidden card swap.*  
     - **Q1:** *"When did you become conscious of the morphing?"*  
       - *Anticipate misconception:* Students will say "during the trick!"  
       - **Intervene:** "But your *report* is identical either way. What’s the difference in *brain processes*?"  
     - **Introduce the Courtroom Analogy (Dennett’s key move):**  
       | **Stalinesque** | **Orwellian** |  
       |----------------|---------------|  
       | A *real-time illusion*: Your brain generates a fake morphing *as the cards are shown* (like a show trial rigged in advance). | A *memory edit*: You see disjointed cards, but your brain *retroactively edits the memory* to include morphing (like rewriting records after a fair trial). |  
       - **Stress:** Both explain the *report* ("I saw morphing"), but one has consciousness *during* the event, the other *after*.  

  #### **3. Active Exercise: Spot the Difference (15 mins)**  
     - **Scenario:** *You hear a faint bang during a lecture. Later, you’re asked: "Did you hear an explosion?" You say yes—but did you consciously hear it *at the time*, or did you *reconstruct* it when asked?*  
     - **Task:** In pairs, argue for *which model applies*.  
       - **Stalinesque:** "The bang was ‘pre-processed’ as loud *before* entering consciousness."  
       - **Orwellian:** "You heard a noise, but only *decided* it was a bang when questioned."  
     - **Debrief:** Highlight that the *evidence* (your report) is identical—the distinction is *when computation occurs* relative to conscious access.  

  #### **4. Head Off Misconceptions (5 mins)**  
     - **Misconception 1:** *"It’s just semantics."*  
       → **Reframe:** "No—Stalinesque posits a *real-time illusion-generating mechanism*; Orwellian posits a *memory-editing mechanism*. These are testable claims."  
     - **Misconception 2:** *"Consciousness must be ‘somewhere’ in the brain."*  
       → **Shut down:** "Dennett rejects this! The distinction is about *processing order*, not Cartesian theatres."  
     - **Misconception 3:** *"Filling in implies a homunculus."*  
       → **Clarify:** "Filling in isn’t the issue—*when and how the narrative is fixed* is."  

  #### **5. Closing Question to Test Understanding (4 mins)**  
     - **"Could neuroscientific evidence *in principle* distinguish an Orwellian from a Stalinesque system? If so, what might we look for?"**  
       - *Correct answer:* Yes—e.g., neural signatures of *real-time processing errors* (Stalinesque) vs. *memory reconsolidation* (Orwellian).  

  #### **6. What to Refuse to Settle (1 min)**  
     - **Explicitly state:** "We *won’t* resolve whether consciousness ‘really exists’ or solve the hard problem. Today is about *models of timing*—not metaphysics."  

  ---

  ### **Why This Works**  
  - **The Card Trick > Colour Phi:** Breaks the "filling in" association by focusing on *temporal ambiguity* in perception/memory.  
  - **Courtroom Analogy:** Makes the causal pathways vivid and unignorable.  
  - **Active Exercise:** Forces students to locate the distinction in *mechanisms*, not reports.  
  - **Closing Question:** Reveals if they grasp it’s about *empirically distinct processes*.  

  **Materials:** Whiteboard (table comparing models), card props (optional).  
  **Tone:** Pace briskly; challenge assumptions; reward concrete mechanistic thinking over verbal disputes.  

  ---  
  **Final Tip:** If a student says, "But it’s the same outcome!", retort: "If you were building a robot to replicate this, would you code real-time fakery or memory edits? *That’s* the difference."
