prompt: 'I am a PhD student in political philosophy, and I am preparing a handout
  for an advanced undergraduate seminar on the ethics of markets. I would like you
  to build a sorting quiz: Which position on repugnant markets do you actually hold?
  Please take on the role of a professional moral and political philosopher who works
  on commodification and the limits of markets. Think carefully, and do not go straight
  to the labels: begin by brainstorming the fault lines on which positions actually
  come apart, construct the logical space those fault lines generate, locate the recognized
  positions within it, and only then write the quiz and its scoring key.


  The deliverable should be a classification instrument rather than a prose essay,
  and it should include the following parts.


  First, eight to ten diagnostic questions. Each question should present one concrete
  transaction or proposed market, specified well enough that a student is answering
  about the case rather than about a slogan. Use at least these three cases: a living
  donor selling a kidney to a wealthy recipient; a hardware store raising the price
  of bottled water tenfold after a hurricane; and a citizen selling a vote to a campaign
  for a fixed sum. You may add cases such as paid surrogacy with strong legal protections,
  paying blood plasma donors, an amusement park selling queue-jump passes, consensual
  dwarf-tossing for entertainment, or carbon offsets. For each case, stipulate that
  all parties consent and specify the background conditions; then offer three or four
  answer options that track a distinct justificatory commitment rather than an overall
  label. The options should be ones a student can choose without knowing which position
  they are voting for. Vary across questions whether the case isolates wrongness in
  the exchange itself, background injustice, coercion, incommensurability, effects
  on equal standing, or bare repugnance, and tailor the wording of the options to
  the case instead of reusing a template.


  Second, a scoring key that maps answer patterns onto six to eight named positions.
  Build the positions from the logical space, not from a list of labels. I expect
  the space to be generated by crossing at least these fault lines: whether the exchange
  is wrong in itself even under fair background conditions, or wrong only because
  of coercion, poverty, inequality, or asymmetric information; whether the wrong,
  when there is one, lies in the corruption of the norms or meaning of the good, in
  the treatment of incommensurable values as priceable, in damage to equal standing,
  or in the consequences; and whether felt repugnance is itself a reason or merely
  a heuristic that tracks one of the other wrongs. Positions that should appear as
  leaves include at least a corruption-of-the-good view, an incommensurability view,
  a background-injustice view, a coercion-or-exploitation-only view, an equal-standing
  view, a market-optimist view holding that no consensual exchange is wrong once externalities
  and information asymmetries are fixed, and a view on which felt repugnance itself
  carries independent justificatory weight. Use standard labels where they are unambiguous,
  and describe any position whose label would be contested rather than assigning it
  a name.


  Third, a short section on the logical space itself. State which combinations of
  answers are unoccupied, and diagnose each empty cell: is it empty because the position
  is incoherent, because it is unattractive enough that no one defends it, or because
  it is merely unexplored? Also flag any pair of positions your quiz cannot separate
  with the questions you chose, and say exactly which additional question or case
  would separate them.


  Fourth, for each leaf, one or two sentences on the position''s most awkward commitment:
  the case or implication that a smart defender of a rival position would press hardest.


  Please write in a formal, seminar-ready register, but keep the instrument usable
  as a handout: questions vivid and concrete, and the scoring key simple enough that
  a student can apply it by counting letters. Do not include a bibliography or reading
  list, and do not rely on verbatim quotation from any text.'
