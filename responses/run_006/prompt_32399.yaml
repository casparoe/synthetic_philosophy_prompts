  \  C. This is wrong because it commodifies the human body, turning it into food.\n\
  \  D. This is acceptable only if the proceeds go to charity.\n\nNow, we have 9 questions.\n\
  \nThen, the Repugnance-as-Reason view will choose B in Q9 and also tend to choose\
