  I'm a journalist covering philosophy of logic and formal epistemology. I've been trying to understand Fitch's paradox of knowability — the 1963 result that if all truths are knowable, then all truths are actually known. I can follow the derivation: substitute "p and no one knows that p" into the knowability principle, note that knowing this conjunction would require simultaneously knowing p and knowing that p is unknown, which is impossible, so the conjunction can't be true, so p entails someone knows p. But I'm convinced the notation is obscuring more than it reveals. What is the conceptual engine? In particular, why does a principle that sounds like a modest epistemic constraint — there are no permanently inaccessible truths — entail omniscience? And is the paradox genuinely a refutation of verificationism, or does it instead expose something about how we formalize "knowable"? Think through this as a philosophical logician. First do some brainstorming about the key conceptual moves, then present exactly five numbered insights, each a sentence or two, with no introduction or conclusion.
