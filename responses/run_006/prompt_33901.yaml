  - Genuine consensus: Independent evidentiary convergence
  - Information cascade: Rational discounting of private signals
  - Reputational cascade: Social conformity under perceived costs
  - Other types: Institutional bandwagons, ideological lock-in

  The diagnostic procedure must prioritize:
  1. Decisive early filters (e.g., replication status)
  2. Publicly observable features (citation patterns, argument structure)
