  For historical test cases:
  - Cold fusion (cascade): Clear cascade markers like replication failure
  - Plate tectonics (genuine): Evidence-driven despite initial resistance
  - Select cases where diagnosis would have been countercultural

  Philosophical pitfalls to avoid:
  - Mistaking institutional support for evidence quality
  - Overweighting "expert" status absent transparency
  - Ignoring suppressed alternatives

  The procedure should output:
  1. Consensus type classification
  2. Confidence estimate
  3. Recommended evidence for disambiguation

  Now structuring the diagnostic flow:
