answer: |-
  Below is a decision procedure for assessing scientific consensuses, distilled from information cascade theory (Bikhchandani et al. 1992; Banerjee 1992), social epistemology (Goldman 1999; Kitcher 1993), and empirical studies of scientific bandwagons (e.g., Collins 1992 on parapsychology). The procedure prioritizes **publicly observable markers** and **decisive early filters**, with explicit flags for unobservables/judgment calls. It classifies consensuses into four types:  
  **Genuine Consensus (GC)**, **Information Cascade (IC)**, **Reputational Cascade (RC)**, and **Institutional Bandwagon (IB)**—a fourth category where funding/peer-review structures incentivize conformity beyond rational belief updating.

  ---

  ### **Diagnostic Procedure: 7 Ordered Questions**  
  *(Execute in sequence; stop if conclusive)*  

  1. **Replication & Robustness Check**  
     *"Have independent replication attempts (or robustness tests in non-experimental fields) consistently supported the core claims?"*  
     - **GC**: ≥70% successful replications/robustness checks.  
     - **IC/RC/IB**: High failure rates, avoidance of replication, or "conceptual replications" substituting for direct tests.  
     - *Unobservable*: Private replication attempts suppressed by journals/funders.  
     - *Judgment*: Threshold for "consistent support" (defensible range: 60–80%).  
     - **STOP if IC/RC/IB likely**: Replication failure is a decisive early signal.

  2. **Citation Network Asymmetry**  
     *"Do >50% of citations supporting the consensus cluster in self-referential 'invisible colleges' (e.g., same lab, institution, or grant network)?"*  
     - **GC**: Citations dispersed across independent groups; significant critique engagement.  
     - **IC**: Citations concentrate in a pioneer's network; later papers cite prior adoption, not foundational evidence.  
     - **RC/IB**: Citations skew toward high-status figures; minimal engagement with critics.  
     - *Judgment*: "Self-referential" threshold (subjective but inferable from institutional affiliations).  

  3. **Dissent Treatment**  
     *"Is substantive dissent (a) published in major venues, and (b) addressed with evidence rather than ad hominem?"*  
     - **GC**: Dissent published; responses focus on data/error.  
     - **IC**: Dissent ignored; later entrants assume prior actors had private evidence.  
     - **RC/IB**: Dissent stigmatized (e.g., "fringe" labels); careers penalized.  
     - *Unobservable*: Self-censorship due to fear.  

  4. **Entry/Exit Dynamics**  
     *"Did researchers enter/exit the field based on (a) new evidence, or (b) social/incentive signals (e.g., funding shifts, hype)?"*  
     - **GC**: Entry/exit tracks evidence (e.g., mass exits after decisive falsification).  
     - **IC**: Entry surges after early adoption, regardless of evidence; exits delayed.  
     - **RC/IB**: Exit correlates with social risk (e.g., abandoning a "star scientist's" program is costly).  
     - *Judgment*: Inferring motives from publication/funding timelines.  

  5. **Stopping Rule Clarity**  
     *"Is there a clear, pre-registered criterion for falsifying the core claim?"*  
     - **GC**: Explicit falsification criteria (e.g., "if no Higgs boson at energy X, abandon model").  
     - **IC/RC/IB**: Moving goalposts (e.g., "anomalies require refinements, not abandonment").  
     - *Judgment*: Whether criteria are "clear" (high agreement possible).  

  6. **Evidence-to-Consensus Lag**  
     *"How quickly did consensus form relative to the strength of early evidence?"*  
     - **GC**: Consensus lags evidence accumulation (e.g., plate tectonics: decades of data).  
     - **IC/RC/IB**: Consensus outpaces evidence (e.g., rapid adoption of under-tested techniques).  
     - *Judgment*: "Strength of evidence" assessment (use proxy: sample size/error bars in key papers).  

  7. **Sensitivity to Null Results**  
     *"Does a single high-quality null result (a) shift consensus, or (b) trigger dismissal/special pleading?"*  
     - **GC**: Null results alter consensus (e.g., OPERA's superluminal neutrino retraction).  
     - **IC**: Null results ignored; later entrants assume pioneers had better data.  
     - **RC/IB**: Null results attacked procedurally or socially.  
     - *Unobservable*: File-drawer effect obscuring null results.  

  **Output Classification**:  
  - **GC** Passes Q1, Q3, Q5, Q7.  
  - **IC** Fails Q1 or Q7; shows Q2 asymmetry + Q4 entry dynamics.  
  - **RC** Fails Q3 (dissent suppression) + Q6 (fast consensus).  
  - **IB** Fails Q4 (incentive-driven entry/exit) + Q5 (no stopping rule).  

  **Philosophical Stability Note**:  
  A "failed" IC that passes Q1 (replication) is incoherent—cascades lack error correction. A "slow" RC is unstable—reputational risks decay if evidence mounts.  

  ---

  ### **Case Applications**  
  **Case 1: Cold Fusion (Pons & Fleischmann, 1989) — CASCADE**  
  - **Q1**: Replication failures >90% within 1 year → **STOP: IC/RC/IB likely**.  
  - *If continued*:  
    Q2: Citations clustered in electrochemistry networks; few from nuclear physicists.  
    Q3: Dissenters (e.g., Douglas Morrison) labeled "obstructionists."  
    Q4: Surge of entrants after media hype; exits after funding dried up, not evidence.  
    **Conclusion**: **IC** (early discounting of private signals) with **RC elements** (stigmatized dissent).  
  - *Unpopular at the time*: The procedure flags anomalies in months, while consensus lasted 2+ years.  

  **Case 2: Plate Tectonics (1960s) — GENUINE CONSENSUS**  
  - **Q1**: Seafloor spreading/paleomagnetic data replicated across continents.  
  - **Q2**: Citations dispersed (geology, oceanography, paleomagnetism).  
  - **Q3**: Wegener’s early dissent ignored, but 1960s critics (e.g., Harold Jeffreys) engaged evidentially.  
  - **Q4**: Gradual entry as magnetic anomaly data accumulated; no incentive bandwagon.  
  - **Q5**: Clear falsification criteria (e.g., symmetric magnetic stripes).  
  - **Conclusion**: **GC** — Consensus lagged evidence by 40 years.  

  ---

  ### **Limitations & Breaking Ties**  
  - **IC vs. GC is unobservable** when private signals are undisclosed. *Break tie with*: Lab notebooks/emails (if accessible) or surveys of early adopters’ reasoning.  
  - **RC vs. IB** hinges on intent. *Break tie with*: Anonymous testimony about fear vs. grant incentives.  
  - **Key judgment calls**: Citation clustering (Q2), evidence strength (Q6). Mitigate by comparing to field baselines (e.g., is >50% self-citation abnormal?).  

  This procedure prioritizes **falsifiable signals** (replication failure, citation patterns) over murky sociological inferences. It errs toward skepticism when consensus forms faster than evidence warrants—a hedge against science’s "herding" pathologies. Use it as a Bayesian prior: update with deeper dives when flags arise.
