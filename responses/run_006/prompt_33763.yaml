answer: |-
  That's a brilliantly observed pattern, and you're absolutely right that it clashes with the naive expectation of the **Condorcet Jury Theorem (CJT)**. CJT suggests that if each member of a group is more likely than not to be correct (competence > 50%), and they vote independently, then adding *more* members *always* increases the probability the *majority vote* is correct, approaching 100% as the group size grows infinitely large.

  Your observation highlights the crucial **gaps between CJT's assumptions and real-world committees**:

  1.  **Non-Independence:** People in committees *discuss*, share information (sometimes selectively), are influenced by others' status or eloquence, and hear the same arguments. Their judgments become correlated, violating CJT's core independence assumption.
  2.  **Decision Mechanism:** CJT assumes simple majority vote. Real groups use discussion, consensus, modified voting, or delegation. Poorly managed discussion can amplify errors or suppress minority (but correct) views.
  3.  **Homogeneous vs. Diverse Competence/Information:** CJT assumes identical competence and access to the *same* information. Real groups have members with *different* expertise, perspectives, and information sets. How these are *integrated* is critical.
  4.  **"Competence" is Contextual:** An expert in one domain might be mediocre in another aspect of the committee's task. Adding "competent" people in a narrow sense might not add relevant competence for the *specific* decision.

  **The Phenomenon & Its Names:**

  There isn't a single, universally agreed-upon name, but several concepts capture facets of what you describe:

  1.  **Coordination Costs / Process Losses:** This is perhaps the most fundamental mechanism. As group size increases:
      *   **Communication Overhead:** More time is spent sharing information, managing airtime, scheduling, repeating points. Less time is spent on deep analysis.
      *   **Logistical Complexity:** Organizing meetings, compiling input, reaching consensus becomes exponentially harder.
      *   **Social Loafing:** Some members may mentally "check out," assuming others will handle the work (even if they *could* contribute).
      *   **Production Blocking:** People have to wait to speak, leading to forgotten ideas or suppression of input.
      *   *Result:* The *process* of being a large group consumes energy and time that could be spent on the actual *task*, degrading decision quality despite individual competence. The "signal" gets lost in the noise of managing the group itself.

  2.  **Diminishing Returns of Information Diversity / Diversity Breakdown:** Initially, new members add genuinely novel perspectives and information (true diversity). Beyond a point:
      *   **Redundancy:** New members may possess overlapping knowledge/skills with existing members, adding little new signal.
      *   **Noise:** Truly unique information becomes rarer, while irrelevant or marginally relevant information increases.
      *   **Integration Failure:** The group's ability to *effectively synthesize* diverse, complex information breaks down. Instead of synergistic integration, you get information overload or superficial averaging.
      *   *Result:* The marginal benefit of an additional competent member's unique insight drops below the marginal cost of integrating them (coordination cost). Adding them *degrades* the group's overall signal-to-noise ratio.

  3.  **Averaging Problems & Bias Amplification:** If the group decision is an *average* of individual estimates or preferences:
      *   **Failure to Reduce Bias:** Averaging reduces *random error* (variance) but not *systematic error* (bias). If most members share a common bias, adding more biased (but individually "competent") members just reinforces that bias.
      *   **Mediocre Compromises:** Large groups often converge on the safest, most average option, suppressing innovative or potentially superior (but riskier) solutions favored by a knowledgeable minority.
      *   *Result:* Adding more competent but similarly biased members moves the group average further *away* from the truth, not closer.

  4.  **Deterioration of Deliberation Quality:** Even with open debate:
      *   **Superficiality:** Discussions in large groups often become shallower, covering more ground less deeply. Complex nuances get lost.
      *   **Dominance:** Louder or higher-status voices can disproportionately influence outcomes, even if their reasoning is flawed. Shyer experts hold back.
      *   **Focus on Manageability:** The group may prioritize reaching *any* decision efficiently over reaching the *best* decision, leading to premature closure or reliance on heuristics.
      *   *Result:* The *quality* of the collective reasoning process degrades with size, washing out the signal.

  **Confidence & Uncertainty:**

  *   **High Confidence in the Phenomenon:** I am highly confident that the phenomenon you describe is real, well-documented in organizational behavior, social psychology, and decision science literature. The deviation from CJT due to violated assumptions is well-understood.
  *   **High Confidence in Core Mechanisms:** I am highly confident that **Coordination Costs/Process Losses** and the **Diminishing Returns of Information Diversity** (especially when integration fails) are primary drivers. The concepts of social loafing, production blocking, and information overload are robust.
  *   **Moderate Confidence in Specific Labels:** While the mechanisms are clear, there isn't one perfect, universally accepted name. "Coordination Costs" or "Process Losses Leading to Diminishing Returns" are accurate descriptions. "Diversity Breakdown" or "Information Integration Failure" capture another key aspect.
  *   **Least Confident About the Precise "Tipping Point":** This is highly context-dependent and the part I'm least sure about predicting universally. The optimal size depends critically on:
      *   **Task Complexity:** Simple tasks tolerate larger groups better than highly complex, nuanced ones.
      *   **Nature of Competence:** How diverse and complementary is the expertise? Is the added member truly bringing *new* relevant signal?
      *   **Group Process & Leadership:** A skilled facilitator can mitigate coordination costs in larger groups. Poor leadership exacerbates them.
      *   **Decision Mechanism:** Well-structured voting or Delphi methods might handle larger groups better than unstructured consensus-seeking.
      *   **Group Cohesion & Culture:** Pre-existing trust and norms can smooth large-group processes.
      *   *General Rule of Thumb:* Research often points to an optimal range of **5-9 members** for complex decision-making tasks before significant process losses set in. But this is *very* flexible depending on the factors above.

  **In Summary:**

  You're observing the real-world consequences of **violating the independence and identical competence assumptions of the Condorcet Jury Theorem**, primarily due to escalating **Coordination Costs** and the **Diminishing Marginal Value of Additional Information/Expertise** when integration fails or redundancy/noise increases. While no single term perfectly captures it, "**Process Losses Leading to Diminishing Returns**" or "**Coordination Cost Threshold**" are descriptive. The core mechanisms are well-established, but predicting the exact group size where adding members becomes detrimental requires careful consideration of the specific task, member expertise, and group dynamics.
