answer: |-
  This is a profound observation that cuts to the heart of both aesthetic epistemology and disciplinary methodology. The asymmetry you describe reveals deep assumptions about the nature of aesthetic properties and how we come to know them. Let's break it down:

  **The Underlying Theory of Aesthetic Knowledge Presupposed:**

  1.  **The Primacy of Direct Perception & Phenomenal Experience:** Art history practice strongly implies that the *essential* aesthetic properties of an artwork (its power, emotional impact, subtle color relationships, texture, scale, presence, etc.) are fundamentally phenomenal. They must be *experienced firsthand* to be fully understood or known. Reproductions (photos, slides, digital images) are seen as inherently deficient carriers of this phenomenal content – they flatten, distort color, eliminate texture, and utterly fail to convey scale and physical presence. Written descriptions, while valuable for contextual or historical information, are seen as even further removed from the direct sensory and emotional encounter.

  2.  **The Non-Transferability of Subjective Response:** The discipline assumes that my deeply felt response to standing before a Rothko (awe, contemplation, unease, etc.) cannot be adequately *transmitted* to you through my description. You need to have *your own* direct encounter to generate *your own* response. While I can tell you *that* I was moved, and perhaps *why* (using formal analysis), the *quality* and *intensity* of the aesthetic experience itself is deemed non-transferable via testimony.

  3.  **Epistemic Humility Regarding Aesthetic Judgment:** Requiring direct encounter reflects a belief that forming a justified aesthetic belief (e.g., "This Rothko is profoundly moving") requires personal verification. Relying solely on testimony is seen as epistemically irresponsible for the core *aesthetic* judgment, even if it's sufficient for historical facts *about* the artwork (e.g., "Rothko painted this in 1958 using oil and egg on canvas").

  4.  **The Artwork as a Unique Physical Event:** Art history treats the artwork not just as an object conveying ideas, but as a *singular physical event* in space and time. Seeing the original is witnessing that specific event. A reproduction is a different event, a different object. The historian studying the French Revolution deals with events fundamentally mediated through representation from the start (documents, accounts, artifacts). The art historian studying the Rothko has direct access to *the thing itself* (or a later state of it), and the discipline values that access as paramount for aesthetic understanding.

  **Is Direct Acquaintance the *Only* Way? Alternative Explanations:**

  While direct acquaintance is central, the practice *might* also presuppose or incorporate other elements without rejecting its primacy:

  *   **Training Perception:** The requirement to see originals is pedagogical. It trains students to *see* – to develop the skills of observation, formal analysis, and sensitivity to materiality that are essential tools *for then* analyzing reproductions or descriptions more critically. Direct experience builds the perceptual vocabulary.
  *   **Contextual Understanding:** Being in the physical space (a gallery, chapel, site-specific installation) is often crucial for understanding how scale, light, and environment contribute to the work's effect. This is context that testimony struggles to convey adequately.
  *   **Material History & Conservation:** Direct examination allows for assessing material condition, techniques, and the physical history of the object – information vital for historical understanding and often invisible in reproductions.
  *   **Validation of Expertise:** Insisting on firsthand experience serves as a gatekeeping mechanism, establishing the art historian's authority as grounded in direct, embodied engagement with the objects of study.

  **Rejecting the Primacy of Direct Acquaintance: Implications for Art History Pedagogy**

  If we adopted a theory that aesthetic knowledge *can* be reliably transmitted through testimony (e.g., trusting a known expert's description of a work's impact, accepting VR as a sufficient simulacrum, believing secondary accounts of aesthetic qualities), art history pedagogy would undergo radical changes:

  1.  **De-Emphasis on Physical Pilgrimage:** The absolute requirement for doctoral students to travel globally to see specific originals would diminish significantly. "Viewing requirements" would become less stringent or even optional for forming core aesthetic judgments.
  2.  **Elevation of Reproductions & Mediated Forms:** High-quality digital reproductions (high-res images, 3D scans, detailed VR experiences) and exceptionally vivid critical descriptions would gain substantial epistemic weight. They would be seen as valid primary sources *for aesthetic knowledge*, not just supplementary aids or sources of factual information.
  3.  **Focus on Critical Analysis of Testimony:** Pedagogy would shift towards rigorously evaluating the *quality* and *reliability* of aesthetic testimony itself. Students would learn to critically assess:
      *   The expertise and track record of the testifier.
      *   The descriptive language used and its potential limitations/biases.
      *   The context in which the testimony was given (e.g., a formal analysis vs. a personal reaction).
      *   The limitations of the medium conveying the testimony (text, video, VR).
  4.  **Reconceptualizing "Primary Source":** The artwork itself might retain primacy, but *expert testimony* about its aesthetic properties could gain a status much closer to that of a primary source, rather than being seen as secondary interpretation. Archives of critical writing and recorded expert descriptions would become more central research materials.
  5.  **Increased Accessibility (Potentially):** Removing the *necessity* of costly travel could democratize access to advanced art historical study, allowing scholars without significant resources or mobility to engage deeply with geographically distant artworks based on high-quality mediated experiences and trusted testimony.
  6.  **Potential Loss of Embodied Knowledge:** Critics would argue this approach risks losing the irreplaceable, embodied, sensory knowledge gained through direct encounter – the feeling of scale pressing on you, the subtle play of light on a textured surface, the visceral impact that defies description. Pedagogy might struggle to replicate or compensate for this loss.

  **Conclusion:**

  The disciplinary norm in art history strongly presupposes a **phenomenalist** and **anti-testimonial** theory of core aesthetic knowledge. It assumes that the essential aesthetic properties and the experience they evoke are only fully knowable through direct, unmediated (or minimally mediated) sensory acquaintance with the original artwork. This contrasts sharply with history, where events are inherently mediated and knowledge is built through critical evaluation of testimony and evidence.

  Rejecting this view and embracing the reliable transmission of aesthetic knowledge via testimony would necessitate a paradigm shift in art history pedagogy. It would move the field away from its foundational emphasis on the irreplaceable physical encounter and towards a model prioritizing the critical evaluation of mediated experiences and expert descriptions. While potentially increasing accessibility, this shift would fundamentally alter the nature of the knowledge the discipline produces and values, likely generating significant debate about what constitutes authentic understanding of an artwork. The asymmetry, therefore, is not merely practical but reflects a deep philosophical commitment within art history to the unique epistemic status of direct aesthetic experience.
