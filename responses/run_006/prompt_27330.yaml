prompt: |-
  You are an expert in philosophical logic, particularly the semantics of nonclassical logics and the theory of truth. I have been reading the dialetheism debate — the dispute over whether some contradictions are true, defended most prominently by Graham Priest and others through paraconsistent logics — and it seems to me to have run for decades without either side moving. The dialetheist points to the Liar, the Russell set, and vagueness as data that a naive, unrestricted theory of truth or comprehension handles better than any classical story; the classical logician replies that true contradictions are more implausible than any of the ad hoc moves required to avoid them, and that the dialetheist's "not" cannot be real negation. The same examples and the same charges keep recurring. I want you to diagnose what kind of disagreement this really is. Is it a factual disagreement about whether any true contradiction has been demonstrated, a disagreement about what logic is for and therefore what counts as a cost, a partly verbal disagreement about whether the dialetheist's negation means the same as the classical one, or something else? My own hypothesis is that the two sides are mostly answering different questions under the name "logic": one is trying to preserve an expressive, naive theory of truth, and the other is trying to preserve classical inference. Be concrete about what each side treats as data and as non-negotiable, and say whether my hypothesis is right. Then, given your diagnosis, tell me what would actually count as progress — a theorem, a semantic framework, a new case, a change of question — or argue that no progress should be expected, and why. Start by brainstorming the strongest versions of each side's position and the candidate diagnoses before settling on your answer.
