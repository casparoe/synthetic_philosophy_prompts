answer: |-
  **Joint Statement on Pure Time Preference in Intergenerational Ethics**

  **1. Agreed Claims**

  1.  Pure Time Preference (PTP) is defined as the practice of assigning less weight to future welfare *solely* because it occurs farther in the future. It is conceptually distinct from discounting justified by:
      *   **Uncertainty:** Lower probability of future welfare existing (e.g., extinction risk) or being delivered as planned.
      *   **Opportunity Cost:** The potential for resources invested today to yield greater welfare later (e.g., economic growth).
      *   **Diminishing Marginal Utility:** Lower incremental welfare gain from consumption if future generations are wealthier.
  2.  Standard economic practice in cost-benefit analysis (CBA) typically employs a positive discount rate that combines elements, often including an explicit or implicit PTP component alongside other factors like opportunity cost (represented by the risk-free rate) and uncertainty.
  3.  The choice of discount rate, especially the PTP component, has profound implications for long-term policy (e.g., climate change mitigation, existential risk reduction, infrastructure investment). Lower PTP rates dramatically increase the present value of very long-term benefits and costs relative to near-term ones.
  4.  CBAs are highly sensitive to the discount rate applied over long time horizons. Small differences in the rate lead to order-of-magnitude differences in present valuations centuries or millennia hence. This sensitivity is a mathematical fact both sides acknowledge.
  5.  If PTP is morally permissible, then applying a positive PTP rate in very long-term CBAs would be justified, significantly lowering the present value of future welfare gains/losses solely due to temporal distance.
  6.  If PTP is *not* morally permissible, then the discount rate used in very long-term CBAs should be driven *only* by uncertainty about the future existence of welfare recipients (extinction risk), opportunity cost (expected economic growth affecting marginal utility), and potentially risk aversion, but *not* by the mere passage of time itself. This would generally imply a much lower effective discount rate for the far future than current standard practice.

  **2. Disagreements Table**

  | Point of Dispute                                                                 | Defender Position (Phrased for Defender Endorsement)                                                                                                                                 | Opponent Position (Phrased for Opponent Endorsement)                                                                                                                               |
  | :------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Rational Permissibility:** Is PTP rationally required or permissible?         | "Rational choice, particularly concerning intertemporal decisions under scarcity and collective action problems, inherently incorporates a positive pure time preference. Rational agents discount future welfare for the same fundamental reason they discount spatially distant welfare: the weakening of direct causal connection and agency over outcomes. Failing to do so ignores the structure of practical reason." | "Rationality, understood as consistent valuation, demands temporal neutrality. Discounting future welfare solely because it is future is isomorphic to discounting welfare based on arbitrary labels like person-ID numbers; it is rationally arbitrary and inconsistent. A rational agent values welfare equally regardless of *when* it occurs, provided existence and identity are certain." |
  | **Moral Permissibility:** Is PTP morally defensible?                             | "Morality permits, and sometimes requires, agent-relative partiality, including temporal partiality. We have stronger moral reasons to promote the welfare of those temporally closer to us, just as we have stronger reasons to promote the welfare of our children over distant strangers. Imposing equal concern across vast temporal distances is overly demanding and neglects the natural structure of human concern." | "Morality fundamentally requires impartiality. The temporal location of a welfare subject is as morally irrelevant as their spatial location or identity. Granting less moral weight to future persons solely because they live in the future constitutes unjust discrimination and violates the principle of equal consideration of interests." |
  | **Relevance of Agent-Relative vs. Agent-Neutral Reasons:**                       | "The distinction is crucial. Morality includes agent-relative reasons. Our reasons to act are inherently tied to our temporal position and agency. Obligations to the far future, if they exist, are significantly weaker *agent-relative* obligations compared to obligations to contemporaries or the near future. Denying this conflates agent-neutral ideals with practical moral demands." | "While agent-relative reasons exist (e.g., special obligations to family), the *basic* duty to avoid harming others or the duty to aid others in extreme need (when cost is low) generates agent-neutral reasons. When assessing the fundamental weight of welfare impacts caused by our actions (like climate change), agent-neutral reasons dominate, requiring temporal neutrality." |
  | **Burden of Proof:** Where does the burden lie regarding the use of PTP?        | "The burden of proof lies with those who reject the near-universal empirical observation of positive time preference in individual and collective behavior and who demand the radical, potentially paralyzing, sacrifice of current interests for vastly distant futures. Justifying the *absence* of PTP requires overcoming the rational and moral presumptions in its favor." | "The burden of proof lies squarely with those who advocate for weighting the interests of future generations less heavily solely due to their location in time. Such discrimination requires positive justification against the strong default moral principle of impartiality and equal consideration. The mere existence of behavioral time preference does not constitute normative justification." |

  **3. Cruxes and Diagnostic Thought Experiments**

  1.  **The Distant Stranger Crux:** *Does spatial distance morally justify discounting in a way analogous to temporal distance?*
      *   **Thought Experiment:** Imagine two identical individuals in desperate need of lifesaving aid you can provide at identical personal cost. One is next to you on the street. The other is on a different continent, but you have a magic button that instantly delivers the aid just as effectively. Are you morally permitted (or required) to prioritize the spatially closer individual solely because they are closer? Does the ease of helping the distant person via the button change the intuition?
      *   **Defender Prediction:** Most will intuitively feel it's permissible, perhaps even obligatory if resources are limited, to prioritize the spatially closer person initially, even with the magic button. This demonstrates the moral relevance of "distance" (spatial/temporal) via weakened connection/agency, supporting PTP. The magic button might weaken this intuition, showing the role of *ease* (akin to opportunity cost), but core partiality remains.
      *   **Opponent Prediction:** With the magic button removing all practical barriers (cost, difficulty), impartial morality demands helping the neediest first (e.g., whoever is in greater immediate peril) or flipping a coin. Prioritizing the spatially closer person *solely* due to proximity, absent other factors, seems arbitrary and discriminatory. This disanalogy weakens the case for temporal discounting. Spatial distance only matters derivatively via cost/difficulty, not intrinsically.

  2.  **The Future Self Crux:** *Does the unity of personal identity over time mandate temporal neutrality within a life, and if so, does this extend between lives?*
      *   **Thought Experiment (Parfitian):** You must choose between two medical procedures for yourself. Procedure A causes mild pain (level 1) tomorrow. Procedure B causes severe pain (level 10) in 10 years. Assume certainty, no inflation, no investment opportunity, and no change in your pain sensitivity. Is it rationally or morally permissible to choose B (severe future pain) solely to avoid A (mild near-term pain)? Does the answer change if the severe pain is inflicted on a different person genetically identical to you and psychologically continuous, created from your cells tomorrow?
      *   **Defender Prediction:** Many would find it intuitively rational/permissible to choose B, preferring to defer severe pain even at known higher intensity, demonstrating intra-personal PTP. The shift to the "different person" scenario significantly weakens this intuition, showing that PTP is tightly linked to personal identity and agency. Stronger PTP applies interpersonally.
      *   **Opponent Prediction:** Choosing B (severe future pain over mild present pain) seems clearly irrational and imprudent within a single life, violating temporal neutrality. The unity of the self demands equal concern for all stages. The "different person" scenario highlights that intergenerational discounting is like discounting *another person*, which is clearly impermissible. This strengthens the case against interpersonal PTP.

  3.  **The Sacrifice Crux:** *Does the demandingness of temporal neutrality invalidate it as a moral principle?*
      *   **Thought Experiment:** You can press a button that will, with certainty, prevent an existential catastrophe that would otherwise permanently eliminate all future Earth-originating sentient life in 500 years. Pressing it costs you 5% of your lifetime income (a significant but non-ruinous sacrifice). Assume no other effects, no opportunity cost argument (i.e., the resources aren't needed for nearer-term welfare), and no uncertainty about the catastrophe or the button's efficacy. Are you morally obligated to press the button?
      *   **Defender Prediction:** While preventing the catastrophe is good, the moral obligation is weak or non-existent due to the vast temporal distance. The sacrifice, while significant only to you, is demanded for beings with whom you share no meaningful agent-relative connection. PTP explains the intuition that this demand is excessive, placing the burden of proof on those claiming the obligation. Many would feel no strong obligation.
      *   **Opponent Prediction:** The moral obligation is clear and strong. The sheer magnitude of the loss (all potential future welfare) vastly outweighs the significant but finite sacrifice required *now*. Temporal distance is irrelevant to the moral weight of preventing such immense suffering and loss of potential. The demandingness does not negate the obligation; it highlights the stakes. Failing to press the button is a profound moral failure. Most impartial observers should recognize the obligation.
