prompt: |-
  I'm a software engineer with no background in philosophy, but I've been trying to think through something about the legal system that seems inconsistent to me. Most jurisdictions impose longer sentences on repeat offenders: someone convicted of burglary gets more prison time if they have a prior conviction than if it's a first offense. I understand the intuitive appeal, but I'm trying to work out what this practice actually presupposes about the purpose of punishment.

  Here's what puzzles me. If punishment is about giving someone what they deserve for a particular act, why should their history change the sentence for this act? They've already been punished for the first crime — they "paid their debt," as the saying goes. Sentencing them more harshly now looks like punishing them again for the earlier offense. So the practice seems to imply that punishment isn't fundamentally about desert for individual acts. But then what is it about? Managing dangerous people? Deterrence? Something else?

  And there's a further wrinkle: the same legal system that enhances sentences for past crimes does not generally allow longer sentences for people it merely predicts will reoffend in the future, based on risk assessment tools or statistical profiles. If the rationale for recidivism enhancements is public protection, why does a prior conviction count but a high risk score doesn't? That looks like an inconsistency.

  I'm trying to reconstruct what theory of punishment the system is implicitly committed to here — what view of the point of punishment makes this pattern of practices coherent, which rival views it quietly rules out, and whether the system's commitments are even internally consistent. I'd also like to know what would have to change in sentencing practice if we replaced the implicit theory with a different one.

  Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question.
