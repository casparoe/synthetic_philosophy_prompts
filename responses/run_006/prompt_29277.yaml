  Let me think through the knowledge assumptions. When independent firms negotiate prices, they're presumably tapping into dispersed market knowledge - each bringing private information about costs, demand, and alternatives. But when merged, that same pricing decision becomes an internal transfer price set by fiat. The legal distinction suggests antitrust doctrine implicitly believes:
  1) Market prices encapsulate decentralized knowledge that can't be replicated by command
  2) Firms as unified entities somehow internalize this knowledge through hierarchy

  Ah, this connects to Hayek's critique of central planning! The doctrine appears to assume that only market processes can aggregate fragmented knowledge. But wait - couldn't a central planner theoretically mimic markets like Lange proposed? 

  I should examine whether the doctrine necessarily requires Hayek's strong view. Maybe it's compatible with Lange if we imagine firms as miniature "trial-and-error" planners. But practically, antitrust enforcement would face massive information problems trying to distinguish efficient coordination from harmful collusion. Hence the bright-line rule at firm boundaries.

  If we adopted Lange's view consistently, antitrust might need radical changes. Perhaps allowing more interfirm coordination under regulatory supervision, or rethinking merger policy. But that would require solving the monitoring problem Hayek emphasized - can regulators really access the dispersed knowledge that markets reveal through prices?

  The user seems sophisticated - possibly an economics/law scholar exploring theoretical foundations. They might be probing whether current antitrust rules rest on sound epistemological grounds. I should clarify the unstated premises while acknowledging real-world enforcement constraints matter too.

  Notably, the question invites comparing Mises-Hayek with market socialism. That's ambitious! I'll need to distinguish what doctrine logically presupposes from what merely fits pragmatically. The command/market boundary likely stems from both theoretical beliefs about knowledge and practical adjudication limits.
answer: |-
  The antitrust doctrine described rests on an **implicit theory of economic knowledge** grounded in the Hayekian view of dispersed, local, and often tacit information. Here's a reconstruction of its assumptions, compatibility with rival theories, and implications of adopting a Lange-style alternative:

  ---

  ### **Implicit Theory of Economic Knowledge in Antitrust Doctrine**
  1. **Where Information Lives**  
     Knowledge is dispersed among market participants (consumers, suppliers, workers). Each actor holds private, contextual information about preferences, costs, innovations, and opportunities that cannot be fully articulated or centralized.

  2. **Who Can Possess It**  
     No single entity (e.g., a central planner or corporate HQ) can fully aggregate or access this decentralized knowledge. Firms possess only the knowledge relevant to their internal operations and contractual relationships.

  3. **Role of Prices**  
     Market prices act as **emergent signals** that synthesize dispersed information into actionable data. They enable decentralized actors to coordinate without needing to know *why* prices change—only *that* they do.

  4. **Command vs. Agreement**  
     - *Inside the firm*: Hierarchical control is efficient because coordination relies on **localized knowledge** within the firm’s boundaries. Transfer prices are administrative tools for internal efficiency, not market signals.  
     - *Between firms*: Agreements replace price discovery with negotiation, short-circuiting the market’s information-aggregating role. This risks distorting resource allocation by obscuring true scarcity/value.

  ---

  ### **Compatibility with Mises-Hayek vs. Lange**
  - **Mises-Hayek View (Strong Compatibility)**  
    The doctrine presupposes markets are *indispensable* for rational calculation. Independent firms *must* react to prices to reveal knowledge; collusion destroys this process. Mergers are tolerated because hierarchy’s limits (e.g., bureaucracy, incentive misalignment) naturally contain inefficiencies, while cartels externalize distortions system-wide.  
    → **Doctrine commits to**: Markets alone can mobilize dispersed knowledge; internal "command" is a constrained alternative.

  - **Lange-Style View (Weak Compatibility)**  
    Lange argued central planners could simulate markets by iteratively adjusting prices to clear supply/demand. Antitrust doctrine **does not strictly require** rejecting this: one could imagine a central board allowing interfirm coordination if it mimicked "market" outcomes.  
    → **But**: Current doctrine is incompatible in practice because:  
      - Lange assumes a benevolent/omniscient planner, while antitrust presumes regulators lack the knowledge to distinguish "good" coordination from harmful collusion.  
      - The bright-line rule at firm boundaries avoids unworkable regulatory oversight of interfirm agreements.

  ---

  ### **Changes Required Under a Consistent Lange-Style View**
  If antitrust embraced Lange’s belief that central planners could optimize prices:

  1. **Revise Antitrust Doctrine**  
     - Permit interfirm price/coordination agreements if approved by a regulatory board.  
     - Replace per se illegality of cartels with a rule of reason based on whether coordination "simulates competitive outcomes."  
     - Treat mergers more skeptically (if internal command is no more efficient than regulated interfirm coordination).

  2. **Redefine the Theory of the Firm**  
     - Firms would lose their special status as zones of permissible command. Boundaries would matter less than whether resource allocation follows a "trial-and-error" pricing process (whether internal or interfirm).  
     - Transfer prices would need to be "market-conforming," validated by regulators as proxies for true opportunity costs.

  3. **Institutional Overhaul**  
     - Create a central regulatory body with authority to set/approve prices for interfirm transactions.  
     - Grant regulators access to proprietary cost/demand data to mimic Lange’s iterative process.  

  ---

  ### **Key Tensions in Practice**
  - **Information Problem**: Regulators lack the real-time, granular data market prices reveal organically.  
  - **Incentive Problem**: Firms would game regulator-set prices, while internal transfer prices face internal accountability (e.g., profit centers).  
  - **Scalability**: Lange’s model works in theory for entire economies but fails under complexity; firms exist partly to avoid these costs.  

  The current doctrine implicitly recognizes that **firm boundaries are epistemic boundaries**: within them, local command is viable; beyond them, only prices can reconcile dispersed knowledge. Adopting Lange’s view would collapse this distinction—at the cost of regulatory hubris and inefficiency.
