prompt: |-
  so i'm taking this philosophy of causation course and also doing a CS degree, and we've been reading about causation by omission — like, whether not watering a plant causes it to die, or whether a doctor not giving a drug counts as causing the patient's death. the debate seems to split between people who say omissions are genuine causes and people who say they aren't, that only positive events or processes can be causes.

  i keep feeling like a lot of this maps onto stuff i deal with in programming, but i cant quite make it precise. like, when we debug, we talk about "what caused the crash" and sometimes the answer is a null pointer — something that's absent — and sometimes it's a line of code that shouldn't be there. or there's the difference between a function that returns the wrong value and a function that never gets called at all. or a missing else-branch in a conditional that silently does nothing when it should have handled a case.

  could you restate the main positions in the causation-by-omission debate using the vocabulary of program semantics / software engineering — things like control flow, null values, exceptions, dead code, missing branches, type errors, default behavior, that kind of thing? i want a systematic translation, not just loose analogies. and then the part i'm most curious about: what doesn't survive the translation? are there claims in the philosophical debate that have no counterpart in how we reason about programs, and if so, is that because the programming vocabulary is missing something important, or because the philosophical dispute is less substantive than it looks when you strip away the metaphysics?
