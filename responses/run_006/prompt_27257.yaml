prompt: |-
  I serve on the clinical ethics committee at a small hospital. We review maybe a dozen cases a year — treatment refusals, family members demanding we hide a diagnosis, triage decisions in a bad flu season — and our recommendations have to be defensible to the medical board if someone complains. We meet for an hour, and most of us are clinicians, not philosophers. Our current method is a one-page list of principles, and every meeting devolves into the same argument: one member says the principle settles it, and another says the principle is just a rule of thumb and this case is one of the exceptions. I gather philosophers have actually fought about this under the names generalism and particularism, and the particularists say something like: a feature that counts against an act in one case can count in favor of it in another, so there are no exceptionless moral principles to fall back on. I want you to turn that debate into a procedure the committee can actually run in an hour. What questions do we ask, in what order, and what counts as a sufficient answer to each? Where should the procedure stop with a no, and where does it have to hand the decision to a person because the question is one of judgment rather than fact? Be honest about which steps are judgment calls dressed up as procedure, and about what the procedure cannot do — in particular whether writing a procedure at all is already a concession to generalism. Then run the procedure on two cases: a patient with capacity refusing a blood transfusion on religious grounds, and a nurse who looked at a patient's chart in order to warn the patient's partner about an HIV diagnosis. Make sure at least one of those comes out the way the committee would not like. And please, no headings, bullets, bold text, or tables — continuous prose only, the way you'd write an email.
reasoning: |-
  Okay, the user serves on a clinical ethics committee at a small hospital. They're dealing with ethical dilemmas like treatment refusals or confidentiality breaches. Their current method uses a one-page list of principles, but meetings often devolve into arguments between strict adherence versus case-by-case exceptions. They mention the philosophical debate between generalism (principles are absolute) and particularism (context matters, no exceptionless rules).

  The user wants a practical, hour-long procedure that translates this philosophical debate into actionable steps. They need clear questions in sequence, with guidance on where judgment is required. They also want honesty about the procedure's limitations and whether creating it leans towards generalism. Plus, they want two test cases: one about a patient refusing a blood transfusion for religious reasons, and another about a nurse accessing a chart to warn a partner about HIV. One outcome should challenge the committee's preferences.

  First, I need to unpack their needs. The committee is time-constrained (one-hour meetings), composed mostly of clinicians without philosophy backgrounds, and they need defensible recommendations for the medical board. The core problem is the tension between rigid principles and flexible exceptions, which is exhausting and unproductive. They're seeking structure to streamline discussions and avoid repetitive debates.

  Digging deeper, the user might have unspoken needs. They could be frustrated with inefficiency or interpersonal conflicts in meetings. Perhaps they're worried about legal or reputational risks if recommendations aren't sound. Or they might feel unqualified in ethics and want a framework to build confidence. By requesting a procedure that forces an unwanted outcome, they're acknowledging biases and seeking objectivity—showing humility and a desire for growth.

  Now, to design the procedure. It must fit into an hour, so it should be linear and time-boxed. I'll adapt philosophical ideas into practical steps: start with case facts, then identify key features, weigh principles, consider exceptions, and finally make a judgment call. I need to flag where judgment is inevitable, not disguised as procedure. Also, creating a procedure is inherently generalist, as it imposes structure, but it can incorporate particularism by emphasizing context. That's a tension I'll address honestly.

  For the questions, I'll sequence them to build from facts to decision: 
  1. Gather all relevant facts. 
  2. Identify salient features (what makes this case stand out). 
  3. Apply principles but assess if they "stick" or "slip" in this context. 
  4. Consider if altering factors (like risk level) change the weight of features. 
  5. Make a judgment call when rules conflict. 
  6. Document the rationale. 
  I'll explain that steps 3-5 are judgment-heavy, and the procedure stops at "no" only in clear-cut harms, like overriding autonomy without justification. Otherwise, it hands off to the committee.

  Testing with the cases: 
  - Blood refusal: Autonomy is key, but the committee might dislike honoring it due to risk. The procedure should support refusal as defensible, showing how principles apply. 
  - HIV breach: Confidentiality is breached for beneficence, but the procedure might condemn it if no immediate harm was proven, forcing an outcome they dislike. This highlights particularism—context matters, but rules can't always bend.

  Throughout, I'll keep prose continuous and email-like. Honesty is crucial: the procedure can't eliminate disagreement or guarantee "right" answers; it just makes reasoning transparent. By the end, they should have a tool that saves time, reduces arguments, and produces auditable decisions, even if imperfect.
answer: |-
  Here’s a procedural framework distilled from the generalism-particularism debate, designed for a one-hour committee meeting. It accepts that principles *guide* but rarely *dictate* outcomes, and explicitly flags where judgment is unavoidable. Creating any procedure leans generalist (it imposes structure), but this one builds in particularist checks by forcing scrutiny of context. The steps are sequential; if any answer satisfies the stated threshold, you move to the next step. If not, you loop back or halt. Judgment calls are italicized.

  ### Procedure
  **Start with Case Facts (5 mins):**  
  The presenter outlines the case. Committee members ask clarifying questions *only*. No interpretations yet. Goal: Establish uncontested facts. *Sufficient answer: No material facts are disputed. If facts are unclear, pause for investigation; without facts, you cannot proceed.*

  **Identify Salient Features (10 mins):**  
  List every ethically relevant aspect: e.g., "patient has capacity," "treatment refusal," "risk of death," "religious motivation," "family conflict." *Sufficient answer: Committee agrees the list is comprehensive. Omissions here corrupt later steps.*

  **Apply Principles (15 mins):**  
  Take your one-page principles. For each salient feature, ask: **"Does this feature *always* trigger the same principle in every context, or could its moral valence flip here?"** Example: "Capacity usually triggers autonomy. Could it ever *not* justify refusal?" If yes (e.g., if refusal causes direct harm to others), note it. *Sufficient answer: Consensus that the feature’s role is stable/unstable in this context. If unstable, the principle "slips" (particularism wins for this feature). If a feature slips, principles alone cannot resolve the case—proceed to step 4. If no features slip, principles settle it (generalism wins)—skip to step 6.*

  **Weight-Shifting Factors (15 mins):**  
  *Only if principles slipped.* Ask: **"What factors alter the weight of the slipped features?**" Focus on:  
  - Magnitude of harm/benefit (e.g., "death vs. temporary discomfort").  
  - Immediacy (e.g., "risk in 2 hours vs. 2 months").  
  - Relational obligations (e.g., "nurse’s duty to patient vs. partner").  
  - Systemic impact (e.g., "undermining trust in confidentiality").  
  *Sufficient answer: Committee agrees on which factors amplify/diminish the weight of key features. This is judgment-heavy—no objective threshold. Disagreement means the case is truly ambiguous.*

  **Judgment Call (10 mins):**  
  *Only if ambiguity remains.* Ask: **"Which course best honors the *purpose* of our core principles while minimizing harm in *this* context?"** Example: Autonomy’s purpose is respecting agency; beneficence’s is preventing suffering. *This is pure judgment—no procedure can eliminate it. Disagreement likely persists. Sufficient answer: Majority vote. Document dissents.*

  **Document Rationale (5 mins):**  
  Articulate: why principles stuck/slipped, what factors shifted weights, and the judgment’s justification. *Crucial for defensibility.*

  **Where it Stops:**  
  - **Automatic "No"**: If a course violates a principle *and* no feature slips (e.g., "force-treatment on a capable patient without extenuating relational harm").  
  - **Judgment Required**: If principles slip or weights conflict.  

  ### Limitations
  1. **It can’t resolve deep value conflicts** (e.g., "sanctity of life vs. autonomy").  
  2. **It can’t guarantee consensus**—steps 4-5 are judgment calls in disguise.  
  3. **Writing a procedure *is* generalist**: It assumes structure aids reasoning. But by forcing attention to context, it bends particularist.  

  ---

  ### Case 1: Patient Refuses Blood Transfusion (Religious Grounds)  
  - **Facts**: Capable adult, refusal based on faith, imminent death without transfusion.  
  - **Salient Features**: Capacity, refusal, high-risk death, religious motivation.  
  - **Principles**: Autonomy (supports refusal). Beneficence (supports transfusion). Does any feature slip? **Death-risk *could* flip autonomy’s weight if harm is immediate/inevitable and affects others (e.g., minor dependents). Here, no dependents. Death-risk alone doesn’t flip autonomy for capable adults—it’s a core application. Principle holds.** *No slip.* Autonomy settles it: Honor refusal.  
  - **Outcome**: Committee dislikes "allowing death," but procedure forces "yes" to refusal.  

  ### Case 2: Nurse Accesses Chart to Warn Partner of HIV  
  - **Facts**: Nurse saw patient’s HIV+ result. Patient declined to notify partner. Nurse told partner privately, citing "duty to prevent harm."  
  - **Salient Features**: Breach of confidentiality, intent to prevent harm (partner’s HIV exposure), absence of patient consent, no legal mandate.  
  - **Principles**: Confidentiality (prohibits breach). Beneficence (supports breach to prevent harm). Does any feature slip? **Yes: "Preventing harm" usually supports beneficence. But here, it conflicts with confidentiality. Weight depends on *imminence* and *likelihood* of harm. If partner was at immediate high risk (e.g., unprotected sex imminent), beneficence might override confidentiality. If risk was low/remote, it won’t.**  
  - **Weight-Shifting**: Key factor is **evidence of imminent high-risk exposure**. Did the nurse know the partner was *currently* exposed? Case states "to warn," implying risk exists but not immediacy. Without evidence of immediacy, the harm-prevention feature *loses weight*. Confidentiality holds.  
  - **Judgment Call**: If no evidence of immediacy, breach is unjustified. Purpose of confidentiality (trust in healthcare) outweighs vague beneficence.  
  - **Outcome**: Condemn the nurse. Committee might *like* the nurse’s intent, but procedure forces "no" to the breach.  

  ---  
  This won’t end debate, but it channels it into structured steps, flags where judgment is irreducible, and produces auditable reasoning. The blood refusal case shows principles binding; the HIV case shows context stripping weight from a noble motive. Both defensible.
