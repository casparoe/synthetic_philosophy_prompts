       3. The fundamental rule: each flip is random and doesn't care about time. If we had a video of the flips, we could run it backwards and it would look the same. But the reason we see an arrow (from 140 to 70) is because we started in a very special state.

       4. In the real universe, the early state was very ordered (low entropy). The entropy (disorder) has been increasing ever since. This is the arrow of time.

       5. The activity doesn't explain why the universe started in a low-entropy state. That's a mystery.

       6. Also, note that with 140 coins, the fluctuations are small. In reality, the universe has so many particles that the chance of a significant fluctuation (like going back to order) is virtually zero.

       7. The arrow of time is statistical: it emerges from the behavior of large systems.

     What might go wrong:

       - The counts might not stabilize? With 140 coins, the standard deviation at equilibrium is sqrt(140 * 0.5 * 0.5) = about 5.9. So we expect the total heads to be between 64 and 76. If we get 80, we can explain that it's a fluctuation and the trend is still downward.

       - Participants might not see the connection to time? We have to emphasize: the mixing of milk in coffee is like the coins becoming mixed. The unmixing would be like the coins going back to all heads, which we don't see.

       - The activity takes too long? We can do fewer rounds.

     We are ready.
