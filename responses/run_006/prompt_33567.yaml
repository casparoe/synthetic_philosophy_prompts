  ### In-Class Activity: Pasadena Game Pricing  
  **Objective**: Students discover that rearranging the order of outcomes in the Pasadena game leads to irreconcilable "fair prices," revealing the gamble’s undefined expected value due to conditional convergence.  

  ---

  ### **Activity Rules & Setup**  
  **Duration**: 80 minutes  
  **Participants**: 15 students, divided into 3 groups of 5.  
  **Materials**:  
  - Handouts (one per group) with outcomes listed in specific orders.  
  - Calculators (for arithmetic).  

  **Instructions to Students**:  
  > "Your group has a description of a lottery. It lists all possible outcomes, their probabilities, and payoffs. **In the order given**, compute the cumulative expected value contribution (probability × payoff) for each outcome. Sum these to find the lottery’s fair price. Report your final sum after 20 terms."  

  **Key Constraints**:  
  - Groups **must** follow the handout’s outcome order.  
  - Outcomes beyond the 20th are ignored (finite truncation of the infinite series).  
  - Groups are **not** told they are pricing the same lottery.  

  ---

  ### **Group Handouts**  
  **Lottery Rules (All Groups)**:  
  > *A fair coin is tossed until it first lands heads. If heads occurs on toss \(n\), the payoff is:  
  > \[
  > \begin{cases} 
  > +\$2^n/n & \text{if } n \text{ is odd}, \\
  > -\$2^n/n & \text{if } n \text{ is even}.
  > \end{cases}
  > \]
  > The probability of heads on toss \(n\) is \((1/2)^n\).*  

  **Outcome Order & Expected Value (EV) Contributions**:  
  - **EV contribution** for outcome \(n\): \((-1)^{n+1}/n\) (since \((1/2)^n \times (\pm 2^n/n) = \pm 1/n\)).  
  - **Partial sums** should be tracked cumulatively.  

  | Group | Outcome Order (by \(n\)) | Target Partial Sum (After 20 Terms) | Rationale |
  |-------|---------------------------|-------------------------------------|-----------|
  | **Group 1** | Natural order: \(1, 2, 3, 4, \dots, 20\) | \(\approx \ln 2 \approx 0.693\) | Converges to the alternating harmonic series limit. |
  | **Group 2** | Two positives, one negative: \(1, 3, 2, 5, 7, 4, 9, 11, 6, 13, 15, 8, 17, 19, 10, 21, 23, 12, 25, 27\) | \(\approx (3/2) \ln 2 \approx 1.040\) | Rearrangement favors positive terms (ratio 2:1). |
  | **Group 3** | Maximize positives: \(1, 3, 5, \dots, 37\) (first 19 odd \(n\)), then \(n=2\) (one negative) | \(\approx +1.994\) | 19 large positive terms, then one negative term. |

  **Example Handout Snippet (Group 2)**:  
  | Outcome # | Description            | Probability | Payoff      | EV Contribution | Cumulative Sum |
  |-----------|------------------------|-------------|-------------|-----------------|----------------|
  | 1         | Heads on toss 1        | \(1/2\)     | \(+2\)      | \(+1.000\)      | \(1.000\)      |
  | 2         | Heads on toss 3        | \(1/8\)     | \(+8/3\)    | \(+0.333\)      | \(1.333\)      |
  | 3         | Heads on toss 2        | \(1/4\)     | \(-2\)      | \(-0.500\)      | \(0.833\)      |
  | ...       | ...                    | ...         | ...         | ...             | ...            |

  ---

  ### **Timeline**  
  1. **Introduction (10 min)**:  
     - Recap St. Petersburg paradox and expected utility.  
     - Motivate the Pasadena game: "Some gambles resist pricing even when payoffs are finite. Today, you’ll investigate why."  
     - Assign groups and handouts.  

  2. **Group Work (25 min)**:  
     - Groups compute cumulative sums. Circulate to ensure they follow the order.  
     - **Predictable Issue**: Students may skip terms or reorder calculations. Redirect: "Stick to the handout’s sequence!"  

  3. **Report Results (5 min)**:  
     - Groups share final prices (e.g., Group 1: ~0.69, Group 2: ~1.04, Group 3: ~1.99).  

  4. **Reveal & Conflict (5 min)**:  
     - "All groups priced the **same lottery**. Why are your answers different?"  

  5. **Debrief & Discussion (35 min)**: Use the script below.  

  ---

  ### **Debrief Script**  
  **Step 1: Surface the Conflict**  
  > "You all computed different fair prices for identical lotteries. Group 1 got ~0.69, Group 2 ~1.04, Group 3 ~1.99. This isn’t an error—it’s a mathematical crisis. **Why can’t we agree on a price?**"  

  **Step 2: Formalize the Problem**  
  - **Conditional vs. Absolute Convergence**:  
    > "The series for the Pasadena game’s EV is \(\sum_{n=1}^\infty (-1)^{n+1}/n\), which **converges conditionally** (to \(\ln 2\)) but **not absolutely**. The absolute series \(\sum_{n=1}^\infty 1/n\) (harmonic series) **diverges**."  
    - Riemann rearrangement theorem: "If a series converges conditionally, rearranging its terms can yield **any real number, or \(\pm \infty\)**. Your handouts did exactly this!"  

  - **Lebesgue Integrability**:  
    > "Expected utility theory requires the Lebesgue integral of \(|X|\) to be finite. Here, \(\mathbb{E}[|X|] = \sum_{n=1}^\infty 1/n = \infty\), so the expected value **is undefined**. No fair price exists!"  

  **Step 3: Address Limitations**  
  > "Our activity simplified reality:  
  > - **Finite vs. Infinite**: You summed 20 terms, but the full series is infinite. Rearrangement affects the **limit**, not just partial sums.  
  > - **Riemann vs. Lebesgue**: The Riemann rearrangement theorem explains your results, but expected value is defined via Lebesgue integration—which fails here.  
  > - **Truncation Artifact**: In the full series, Group 3’s rearrangement would diverge to \(+\infty\); we only saw a large positive due to truncation."  

  **Step 4: Broader Implications**  
  > "What does this mean for decision theory?  
  > - **Bounded Utility**: If utilities are bounded, \(\mathbb{E}[|U(X)|] < \infty\), avoiding this.  
  > - **No ‘True’ Price**: The Pasadena game has no rational fair price. Normative theories must exclude such gambles or require absolute convergence."  

  ---

  ### **What Could Go Wrong (and Mitigations)**  
  1. **Student Recognizes Identical Terms**:  
     - *Risk*: A student notes outcomes match across handouts.  
     - *Response*: "The lottery is defined by the set of outcomes and probabilities—**not the listing order**. Your pricing method (order-dependent summation) caused the disagreement."  

  2. **Objection: "Outcomes Are Mispaired!"**:  
     - *Risk*: A student argues probabilities/payoffs define distinct lotteries.  
     - *Response*: Clarify that "heads on toss \(n\)" has fixed \((p, \text{payoff})\) regardless of order. The handout’s "Outcome #" is a label, not part of the gamble.  

  3. **Arithmetic Bottlenecks**:  
     - *Risk*: Groups lag due to manual calculations.  
     - *Mitigation*: Use calculators; precompute EV contributions for \(n\) (since \(\pm 1/n\) is simple).  

  4. **Truncation Confusion**:  
     - *Risk*: Students dismiss results because "we ignored tiny probabilities."  
     - *Response*: "True, but even infinite rearrangements yield different limits. Truncation lets you *see* the dependence on order."  

  5. **Group 3’s Sum Stalls**:  
     - *Risk*: Their partial sum (1.99) isn’t dramatically large.  
     - *Mitigation*: Emphasize that 19:1 positive:negative ratio mimics a divergence to \(+\infty\) in the infinite case.  

  ---

  ### **Instructor Notes**  
  - **Emphasize Discovery**: Let students sit with the conflict before explaining. Ask: "Can you reconcile these prices?" before debrief.  
  - **Real-World Hook**: "This isn’t just abstraction—conditionally convergent gambles challenge insurance pricing and stochastic models."  
  - **Extension**: Post-activity, assign a proof that \(\mathbb{E}[|X|] = \infty\) or discuss how bounded utility resolves this.  

  This activity forces confrontation with the failure of expected value when absolute convergence is violated, deepening intuition for Lebesgue integrability and the fragility of conditionally convergent series.
