     However, note: the Lebesgue integral does not depend on the order because it is defined as the integral over the sample space, and it requires that the integral of |X| is finite. If that condition fails, then the expected value is not defined.

     So the takeaway: the Pasadena game does not have a well-defined expected value because the expected value of |X| is infinite.

