   Debrief script:

     After the groups report:

       Group 1: about 0.65
       Group 2: about 1.04
       Group 3: about 1.27

     Reveal: "These are the same lottery! How can we have three different expected values?"

     Let the students discuss.

     Then explain:

       The expected value is defined as the sum of the expected value contributions over all outcomes. But the outcomes are mutually exclusive and exhaustive, so the order should not matter. However, we are summing an infinite series that is only conditionally convergent, not absolutely convergent. The Riemann rearrangement theorem tells us that by changing the order of summation, we can make the series converge to any real number, or even diverge.

       But in the definition of expected value in probability theory (via the Lebesgue integral), the order does not matter. Why? Because the Lebesgue integral requires absolute convergence. Specifically, for a random variable to have an expected value, the integral of |X| must be finite (i.e., the series of absolute values must converge). In this case, the series of absolute values is the harmonic series, which diverges. Therefore, the expected value is not defined.

       What we did was a finite approximation. But even in the finite approximation, the order matters because we are truncating the series. In the full infinite series, by rearranging we can get any limit we want.

     What the activity cannot reproduce:

