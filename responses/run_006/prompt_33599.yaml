answer: |-
  You’ve misunderstood the hinge. Your *verbal* doubt ("maybe I’m a brain in a vat") isn’t genuine doubt in Wittgenstein’s sense—it’s an intellectual exercise floating atop hinges you *cannot* actually jettison. To doubt "I have hands" meaningfully, you’d need a framework where "hands," "deception," and "vats" have stable meaning. But your very act of formulating the skeptical scenario relies on hinges: the reliability of language, the existence of a world to deceive you, the temporal continuity allowing "now" to cohere. Your doubt *depends* on what it pretends to undermine. Radical skepticism is parasitic—it uses the scaffold it claims to dismantle. You aren’t *living* the doubt; you’re borrowing certainty to perform doubt.
