answer: |-
  The specific term you're describing is **Campbell's Law**, named after social scientist Donald T. Campbell. Here's the core definition:

  > **"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."**

  **Why it fits perfectly:**

  1.  **Proxy to Target:** It specifically addresses when a measurement (indicator/proxy) becomes the target of decision-making.
  2.  **Correlation Breaks:** The core outcome is the distortion or corruption of the *very process* the metric was meant to measure. Optimizing for the number ruins its value as a proxy.
  3.  **Reasonable Proxy Initially:** It implies the metric had initial validity as an indicator.
  4.  **Scope:** It covers both intentional gaming (like your dad's programmers) and more subtle system drift where the metric naturally becomes the de facto goal (like the rubric subtly redefining "good writing").
  5.  **Mechanism:** The "corruption pressure" arises *because* the metric is tied to consequences (grades, rewards, evaluations).

  **Boundaries:**

  *   Applies to **quantitative metrics** used for **evaluation or decision-making** in complex systems (social, organizational, educational).
  *   Requires the metric was initially a **plausible proxy** for the underlying goal.
  *   The damage occurs when the **focus shifts to maximizing the metric itself**, degrading its link to the true goal.

  **Related Term:** **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure") is often used interchangeably, especially in economics/business. Campbell's Law is more focused on social systems and the *corruption/distortion* mechanism.

  **In short:** Campbell's Law describes the exact pattern where a useful measurement metric, once used for evaluation, becomes the target, causing the metric to lose its validity as a proxy for the original goal. Intentional gaming is common, but systemic drift is also covered.
