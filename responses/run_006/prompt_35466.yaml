prompt: |-
  ok so ive been noticing this pattern everywhere and i dont know if theres a name for it. the basic thing is: someone picks a number to measure how well something is going, the number starts out as a decent stand-in for the real thing, but then people realize theyre being judged by the number and start optimizing for the number directly, and then the number stops being a good stand-in. like in school, a teacher makes a rubric for essays — thesis, evidence, structure, grammar — and at first it helps, but pretty soon everyone writes these weird frankenstein essays that score perfect on the rubric but are terrible to actually read. the rubric was supposed to *measure* good writing but it became the *definition* of good writing, and the definition is worse. or in a video game, the devs track "player engagement" by hours played, so they add grind-y mechanics that keep people logged in but make the game less fun. or at my dads workplace they measured programmer productivity by lines of code written, and guess what happened. what im asking is: is there a specific term for this exact thing — where a metric goes from being a proxy to being a target and the correlation breaks? i know "perverse incentives" and "gaming the system" but those seem broader, like they cover any situation where rules backfire. this feels more specific: the metric had to have been a reasonable proxy at first, and the damage is specifically that optimizing for it destroys the correlation it used to have. also does the concept require that people are *intentionally* gaming it, or does it also cover cases where the metric just naturally drifts? if theres no established name, what would you call it and how would you define its boundaries? try to keep the answer under 300 words if you can.
