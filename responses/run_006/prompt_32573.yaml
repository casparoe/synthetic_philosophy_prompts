answer: |-
  ### Q&A Prep Sheet: Dennett's Chase & Sanborn Argument Against Qualia  

  **Highest Damage (Phenomenal Realist Objections):**  
  1. **"You assume neuroscience/behavior can't resolve Chase vs. Sanborn. But what if we find distinct neural correlates for taste perception vs. preference? Doesn’t that objectively settle whether qualia changed?"**  
     *Reply (2-min):* Even with neural data, interpretation depends on our pre-theoretic concept of qualia. If we see neural changes in Sanborn’s taste cortex, is that the *quale* changing or his *sensitivity* to an unchanged quale? Chase’s unchanged taste cortex might reflect stable qualia or insensitivity. Neurology alone can’t break the ambiguity because we’d still need an independent criterion for "quale identity" – which is precisely what’s incoherent. The data requires framing via intentional or functional roles, not intrinsic qualia.  
     *Weakness:* Risks sounding dismissive of empirical progress; doesn’t fully address why neural *patterns* couldn’t ground quale identity under a physicalist view.  

  2. **"The thought experiment presumes qualia must be 'atomic' and directly introspected. But on my view (e.g., like Chalmers), qualia are complex and embedded in global states. Couldn’t we distinguish them via holistic first-person reports over time?"**  
     *Reply (2-min):* Holism doesn’t help. Sanborn might report a "globally different coffee experience" while Chase reports "same taste, less pleasurable." Both descriptions are equally consistent with shifted judgments or shifted qualia. Adding more introspective detail only expands the underdetermination—e.g., is "darker flavor" a new quale or a new judgment? There’s no stable anchor outside reactive dispositions.  
     *Weakness:* May not convince those who see phenomenology as self-validating; holists might argue coherence over time resolves indeterminacy.  

  **Moderate Damage (Representationalist/Language Focus):**  
  3. **"As a representationalist, I agree qualia aren’t intrinsic—they’re how we represent properties. Chase and Sanborn’s reports clearly differ in intentional content (e.g., representing the coffee as ‘unchanged/unpleasant’ vs. ‘changed/bad’). Doesn’t this resolve the indeterminacy?"**  
     *Reply (2-min):* Only if we abandon intrinsic qualia! If qualia reduce to representational content, then "quale change" just *means* a change in intentional state. But Chase and Sanborn’s dispute isn’t about representation; it’s about whether the *phenomenal character itself* shifted. Representationalism avoids incoherence by rejecting qualia as explanatory posits—exactly my point. Your view concedes qualia are empty as standalone entities.  
     *Weakness:* Representationalists may counter that their reduction *preserves* phenomenal character intentionally, leaving my argument inert.  

  4. **"This seems like verificationism. If nothing can distinguish two scenarios, does that mean there’s no fact? But indeterminacy might reflect epistemic limits, not metaphysical incoherence." (Likely from epistemologists)**  
     *Reply (2-min):* I’m not denying a metaphysical fact because of epistemic limits; I’m arguing the *concept* of qualia has no clear conditions of application. We can’t even conceive of what a "fact of the matter" would look like. Compare: asking whether a number is "green" is incoherent, not unknowable. Qualia discourse similarly lacks consistent rules.  
     *Weakness:* May invite charges of semantic inflation; hardcore realists will insist the concept is coherent via introspection.  

  **Lower Damage (Friendly Fire/Technical Pushback):**  
  5. **"As an illusionist, I agree qualia are incoherent. But isn’t Chase/Sanborn a red herring? Why not target the ‘explanatory gap’ directly?"**  
     *Reply (2-min):* This pump exposes the gap’s roots. If we can’t apply "quale" consistently in a simple case, it can’t explain hard problems. It’s a diagnostic tool showing qualia can’t do theoretical work—e.g., in debates about physicalism or zombies.  
     *Weakness:* Overlooked chance to preempt deeper critiques.  

  **The Question You Hope Nobody Asks:**  
  **"What if Chase and Sanborn *disagree* on whether the coffee tastes the same *to them now* vs. *to their past selves*? Doesn’t third-person testing (e.g., current discrimination behavior vs. past records) break the symmetry?"**  
  *Why it’s damaging:* It suggests behavioral criteria *can* resolve the case functionally (e.g., if Sanborn fails to distinguish past/present blends but Chase succeeds). This might imply qualia are redundant but not incoherent.  
  *Reply (2-min):* Functional tests track discriminatory capacities, not qualia. If Sanborn’s discrimination is impaired, is it because qualia changed or his judgment degraded? The test can’t isolate the "quale" variable. We resolve disputes pragmatically by ignoring qualia—e.g., we retrain Sanborn—which proves my point: qualia add nothing.  
  *Weakness:* Functionalists will argue this *dissolves* the problem, making qualia obsolete but not incoherent.  

  **Key Strategy:**  
  - **For realists:** Emphasize the *conceptual* (not empirical) underdetermination.  
  - **For representationalists:** Stress their view *endorses* eliminativism about intrinsic qualia.  
  - **For methodologists:** Frame indeterminacy as a failure of qualia to have necessary/sufficient conditions.  
