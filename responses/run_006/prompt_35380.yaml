    - No close person → **save 4 strangers** (larger group).  

  *Both rules agree here*, so we need a case where Rule A and Rule B *diverge*. Try:  

  **Litmus Test Case: 1 close friend vs. 2 distant cousins (both unseen in 10 years).**  
  - **Rule A prediction**:  
