  ### Analysis of Your Friend's Moral Algorithm

  #### Brainstorming
  The key factors in your friend's decisions appear to be:
  1. **Number of lives**: Utilitarian bias (saving more lives) when relationships are equal or irrelevant.  
  2. **Relationship type**: Strangers vs. family/friends.  
  3. **Relationship strength**: Closeness matters (e.g., "close friend" vs. "cousin unseen in 10 years").  
  4. **Threshold effects**: Strong relationships (like close friends) may override numbers entirely, while weak relationships (distant cousins) behave like strangers.  

  Notably, "closeness" acts as a binary switch:  
  - **Close tier**: Immediate, emotionally bonded relationships (close friends).  
  - **Non-close tier**: Strangers, distant relatives, or emotionally detached connections.  

  The verdicts show:  
  - Non-close groups are treated identically (strangers ≈ distant cousins).  
  - Close individuals always trump non-close groups, regardless of size.  

  #### Candidate Rules (Fitting All Verdicts)
  Here are 2 precise rules consistent with all test cases:

  **Rule A: Closeness-Weighted Utilitarianism**  
  1. Assign a "relationship weight" to each person:  
     - Stranger: **1**  
     - Distant cousin (unseen in 10 years): **1** (same as stranger)  
     - Close friend: **∞** (infinite weight, cannot be outweighed)  
  2. Sum weights for each group.  
  3. Save the group with the higher total weight.  
     - Ties → coin flip.  

  **Rule B: Threshold-Driven Priority**  
  1. If one group contains **any "close" person** (e.g., close friend), save that group.  
  2. Else, save the **larger group** (utilitarian).  
     - Equal numbers → coin flip.  

  *Both rules fit all your test cases:*  
  - 1 vs. 5 strangers: Rule A sums to 1 vs. 5 → save 5. Rule B has no close person → save 5.  
  - Close friend vs. 5/100 strangers: Rule A: ∞ > 5 or 100 → save friend. Rule B: close person present → save friend.  
  - 1 vs. 2 strangers: Rule A: 1 vs. 2 → save 2. Rule B: no close → save 2.  
  - Distant cousin vs. 5 strangers: Rule A: 1 vs. 5 → save 5. Rule B: no close → save 5.  
  - 1 vs. 1 stranger: Both rules → coin flip.  

  #### Predictions for 1 Distant Cousin vs. 2 Strangers
  - **Rule A**:  
    - Cousin weight = 1, Strangers weight = 2.  
    - Sum: 1 vs. 2 → **save the 2 strangers**.  
  - **Rule B**:  
    - No close person in either group.  
    - Compare numbers: 1 vs. 2 → **save the 2 strangers**.  

  #### Best Guess
  **Rule B (Threshold-Driven Priority)** is likely your friend’s algorithm.  
  - **Why?** It’s simpler and more human-interpretable. It avoids arbitrary weights (Rule A’s "∞" is theoretically clunky) and matches how people often describe loyalty: "I’d save my close friend *no matter how many strangers*." Rule B directly encodes this as a priority threshold. Rule A achieves the same but with mathematical overkill. The verdicts show no need for fractional weights (e.g., cousin isn’t "1.5x" a stranger—it’s treated identically to a stranger in group comparisons).  

  #### Litmus Test: Definitive Case to Distinguish Rules  
  **New case: 1 distant cousin (unseen in 10 years) vs. 4 strangers.**  
  - **Rule A prediction**:  
    - Cousin weight = 1, Strangers weight = 4.  
    - Sum: 1 vs. 4 → **save 4 strangers**.  
