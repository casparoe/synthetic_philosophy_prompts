      *   Distribute final cards. "Last round! Write your rating. But this time, YOU decide *how* to use the ratings. We have [Number] of [Resource]. You see the ratings on the board. Discuss for 5 minutes: **Which method seems fairest to use *this time*: Giving it to the Highest Ratings, or giving it randomly to people who rated above a 'Significant Need' threshold (you pick the threshold)? Or is there another way?**"
      *   After 5 min discussion, take a vote on the method. Implement the winning method for allocation. Record the final choice.
      *   *Watch For:* Arguments for each method. Appeals to individual suffering vs. group benefit. Confusion about what the numbers mean. Note if anyone questions how people *use* the scale.

  ## Debrief (30 min)
  Guide the discussion with these questions:

  1.  **"What was it like trying to decide how to allocate the resource?"** (Listen for: difficulty, frustration, sense of unfairness, uncertainty about needs).
  2.  **"Look at the board. What happened in Round 3 (and 4)? We had the same ratings, but two different ideas about 'fairness' pointed to different winners. Why did that happen?"** (Guide them to articulate: The numbers alone didn't tell us *how* to weigh individual intensity against spread of benefit. We had to *interpret* what fairness meant using the numbers).
  3.  **"When we asked for ratings, we assumed 0-10 was a common scale. Did we have evidence everyone meant the same thing by '7'? What might affect how someone uses that scale?"** (Listen for: personality, comparison to their own experiences, cultural norms, fear of sounding greedy, different interpretations of the anchors "0=Don't want" vs. "10=Want intensely").
  4.  **"In Round 5, when you debated the methods, what were the main arguments for 'Highest Ratings' vs. 'Significant Need Spread'? What does each method prioritize, and what does it risk overlooking?"** (Highlight: Highest Ratings prioritizes individual peak need but might miss many with moderate need. Significant Need Spread prioritizes helping more with 'enough' need but might overlook someone in extreme need. *The numbers don't resolve this value choice.*).
  5.  **"So, when a group has to divide something scarce, is comparing how much different people want it unavoidable? Why? And can we ever be sure we're comparing accurately, especially with just numbers?"** (Synthesize: Yes, comparison is unavoidable. But the activity shows numerical scales create an *illusion* of a common, objective measure ("utils") when in reality, the scale is subjective, the interpretation is contested, and the method of using the numbers requires value judgments the numbers themselves don't contain).
  6.  **"How might this play out in real situations like allocating a shared room, family help, or disaster relief?"** (Connect to stakes: The problem scales up; the illusion of numbers might be comforting but masks deeper difficulties).

  *   **If the group doesn't notice:** Point directly to Round 3 results on the board. "Look, here are the ratings. One method said winners were X, Y, Z. Another method said winners could be A, B, C. Both used the same 0-10 numbers. Why did they give different answers? What does that tell us about what those numbers can and can't do?"

  ## What will predictably go wrong
  1.  **Ratings don't create conflict (Rounds 3/4):** The most likely issue. *Solution:* Have a backup plan. Pre-select 3-4 participants privately before Round 3: Ask one to rate 10 ("extreme need"), three to rate 7-8 ("high need"), and instruct others to rate 4 or below ("low/moderate"). This guarantees a pool for "Significant Need" larger than resources, creating divergence.
  2.  **Participants rate strategically:** Some may inflate ratings to win. *Solution:* Briefly reiterate at the start of Rounds 3 & 4: "Remember, the point is to explore how we decide fairly. Please rate your *genuine* need *right now*, not what you think will win. Strategy breaks the exercise." Keep stakes low to reduce temptation.
  3.  **Group gets stuck debating fairness in Round 5:** They might argue endlessly without voting. *Solution:* Announce strict time limits ("2 minutes left!"), remind them they just need to *choose a method* for this round, and call for a vote if needed. "We need to allocate, so let's vote on the two main methods now."
  4.  **Someone dominates the discussion:** *Solution:* Use structured turns in Round 5 ("Let's hear from someone who hasn't spoken"), gently intervene ("Thanks, [Name], let's hear another perspective"), or use quick think-pair-shares before open discussion.

  ## What the activity cannot reproduce
  The activity necessarily simplifies the depth of *personal stakes*. While participants feel mild desire for a seat or snack, it cannot replicate the profound emotional weight, complex history, or existential need (e.g., a life-saving resource, a deeply meaningful opportunity) that amplifies the problem in real life. The frustration in the game is intellectual; real stakes involve visceral fear, grief, or desperation that makes the impossibility of truly knowing another's inner state far more agonizing and the limitations of numerical scales starkly apparent. You will need to explicitly bridge this gap in the debrief: Ask, "How might the feelings we explored here – confusion, doubt about the numbers, disagreement on fairness – change if the resource was something truly vital, like medical treatment or a safe home? Would the number scale feel more or less reliable then? Why?" This connects the experiential learning to the deeper human dilemma.
