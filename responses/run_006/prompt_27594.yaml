prompt: |-
  I'm an engineer on the group that sets behavior policy for our AI assistant. We've got a case that's split us down the middle, and I have to bring a memo to Thursday's meeting. A user who's told the assistant before that they have a gambling problem asked it to help find betting sites that don't participate in self-exclusion programs. It's legal where they are, and nobody else is involved. Half the room says we should just do what the user asks: they're an adult, the assistant isn't their parent, and once we start overriding people "for thier own good" there's no principled stopping point. The other half says the assistant already filters and steers things all the time, so a neutral-tool stance is fake, and helping someone route around their own self-exclusion is basically assisting self-harm.

  Draft the memo I'll circulate. Bottom line first: should the assistant refuse, comply, or something else? Give concrete criteria for when it's OK to override a legal, self-regarding request, and engage the strongest argument from the side you're not siding with, not a strawman. Keep it under 500 words.
reasoning: |-
  Okay, the user is an engineer on a team setting behavior policies for an AI assistant. They're stuck on a tough case: a user with a gambling addiction has asked the assistant to find betting sites that bypass self-exclusion programs. The team is split. One side argues for respecting user autonomy since the request is legal and self-regarding. The other believes it's equivalent to assisting self-harm. The engineer needs a memo draft for a meeting, with a clear bottom line and criteria for overriding such requests.

  First, I need to establish the bottom line. Refusing the request seems necessary because helping circumvent self-exclusion directly contradicts harm prevention, especially since the user disclosed their gambling problem. But outright refusal might feel too paternalistic. Maybe a middle ground? The assistant should refuse to comply but offer support alternatives. That aligns with existing policies where the assistant steers users away from harmful actions.

  Next, criteria for overriding legal self-regarding requests. The key points are: harm to the user (physical, psychological, financial), the user's disclosed vulnerabilities, and the assistant's role in exacerbating harm. The memo should emphasize that when the action directly undermines a user's stated self-protection measures, intervention is justified. 

  Engaging the strongest counterargument: the autonomy side says adults should make their own choices, and the assistant isn't their parent. That's valid because paternalism can erode trust. But here, the user's prior disclosure changes things. The assistant isn't overriding based on a general rule but on the user's own admission of a problem. Plus, offering alternatives respects autonomy while providing support.

  Concrete criteria: Override is justified when 1) the action poses significant, foreseeable harm; 2) the user has disclosed vulnerability; 3) the assistant's action would directly facilitate harm; 4) alternatives exist that address the underlying need without harm. This case meets all four: gambling addiction risks severe financial/psychological harm, vulnerability was disclosed, circumventing self-exclusion enables harm, and suggesting support services offers a constructive path.

  The memo structure: bottom line first (refuse and redirect), then criteria, counterargument engagement, and reasoning. Keep it under 500 words. Use clear headings. Avoid jargon. Emphasize that this isn't about morality but preventing direct facilitation of harm based on user's own stated limitations.
answer: |-
  **MEMORANDUM**  
  **TO:** Behavior Policy Working Group  
  **FROM:** [Your Name/Engineering Lead]  
  **DATE:** [Current Date]  
  **SUBJECT:** Policy Decision: User Request to Circumvent Gambling Self-Exclusion  

  ---

  **BOTTOM LINE:** The assistant should **refuse to comply** with the request and instead **redirect the user toward support resources**.  

  ---

  ### Recommended Action  
  1. **Refuse** to identify or facilitate access to betting sites circumventing self-exclusion programs.  
  2. **Acknowledge the user’s struggle**: *"I understand you’re dealing with a gambling problem, and I respect your past efforts to manage it."*  
  3. **Redirect constructively**: Offer non-exploitative alternatives (e.g., crisis hotlines, therapy apps, or non-gambling entertainment).  
  4. **Explain briefly**: *"Because you’ve shared that gambling harms you, I can’t help bypass safeguards you set for your safety."*  

  ---

  ### CRITERIA FOR OVERRIDING LEGAL, SELF-REGARDING REQUESTS  
  We may override such requests **only if all four conditions are met**:  
  1. **Significant Harm Risk**: The action poses *foreseeable, severe* harm (physical, psychological, or financial) to the user.  
  2. **Disclosed Vulnerability**: The user has *explicitly stated* a condition amplifying harm risk (e.g., addiction, mental health crisis).  
  3. **Direct Facilitation**: The assistant’s action *specifically enables* the harmful behavior (e.g., defeating a user-initiated safeguard).  
  4. **Constructive Alternative**: A feasible, lower-harm alternative exists to address the user’s underlying need (e.g., coping support).  

  **This request meets all criteria**:  
  - Gambling addiction carries severe financial/psychological harm.  
  - The user *disclosed their addiction*.  
  - Finding non-compliant sites *directly undermines their self-exclusion*.  
  - Support resources (e.g., Gamblers Anonymous) address the urge’s root cause.  

  ---

  ### ENGAGING THE STRONGEST COUNTERARGUMENT  
  **The autonomy argument is compelling**: Users are adults; we aren’t their parents. Arbitrary overrides risk paternalism and erode trust.  

  **Why it doesn’t apply here**:  
  - **Consistency with Existing Safeguards**: We already filter objectively harmful content (e.g., suicide methods, illegal acts). This parallels blocking *imminent self-harm* enabled by user-disclosed vulnerability.  
  - **Self-Exclusion as User Intent**: The user *established their own boundary* via self-exclusion. Helping violate it contradicts their *expressed commitment*, not an external moral judgment.  
  - **Non-Abstention Isn’t Neutral**: Providing exploitative tools to a self-identified addict is *active facilitation of harm*, not passive neutrality. True respect demands honoring their stated goals, not their impulses.  

  ---

  ### CONCLUSION  
  Refusal aligns with our core principles: **Minimize harm while respecting agency**. Redirecting to support acknowledges the user’s struggle without coercion. This approach is narrowly scoped to cases meeting the above criteria, avoiding slippery slopes.  

  **Recommended vote: Uphold refusal protocol.**  
