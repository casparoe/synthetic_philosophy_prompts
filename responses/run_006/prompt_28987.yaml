  The user also mentions realists sometimes concede some moral intuitions are debunked (like incest avoidance) but not others, whereas perception isn't carved up that way. That selective application weakens the analogy. I should examine other disanalogies: calibration methods, feedback loops, and the nature of the truths involved. Perception has clear external referents and ways to check accuracy, but moral truths might not, if they're non-natural.

  The user wants an audit: where the analogy holds, where it breaks, and if the breaks affect the dialectic. They also want to know if there's a better analogy and to distinguish consensus from contentious points. I recall Street's objections about the tracking relation and Bengson's responses. There's genuine debate here, so I need to flag areas of disagreement without taking sides prematurely.

  Another disanalogy is corrigibility. Perceptual errors can be corrected through tools and collective verification, but moral disagreements might not have the same resolution methods. Plus, the adaptive link in perception is about truth-tracking, while for morals, it might be about social cohesion or cooperation, which doesn't necessarily track truth. Joyce and others have argued this.

  The user's deeper need might be understanding whether the realist's analogy can withstand scrutiny or if it's a rhetorical move. They might also seek alternative defenses realists could use. I should consider analogies to logic or math, which are also non-empirical but seem objective. But math might not have the same evolutionary pressures, so that's tricky.

  I need to structure the response by first laying out the analogy, then disanalogies, assess dialectical impact, and suggest alternatives. Highlight where the literature agrees (e.g., perception's reliability) vs. disputes (whether moral faculties can track truths). Emphasize that the burden-shifting works only if the realist can show moral faculties are truth-tracking, which is contested. The analogy might not be decisive but could shift the burden if the realist provides an independent account of moral truth-tracking.

  Also, the user's observation about selective debunking of some intuitions but not others is crucial. Realists might use reflective equilibrium, but debunkers see that as circular. This ties into the lack of independent calibration in morals. The conclusion is that while the analogy highlights the need for debunkers to explain the difference, significant disanalogies remain, making the challenge harder for morality unless realists can bridge those gaps.
answer: |-
  Here's a thorough audit of the evolutionary debunking analogy between perception and morality, addressing your concerns point-by-point. I'll distinguish between consensus views and live disputes, and flag where I'm taking a position.

  ### **The Core Analogy & Its Dialectical Purpose**
  *   **Realist Claim:** If evolutionary origins alone don't undermine perceptual reliability, they shouldn't undermine moral reliability either. The burden shifts to the debunker to show why morality is special.
  *   **Mapping:**
      *   *Perceptual Faculties* ⟷ *Moral Faculties/Intuitions*
      *   *Evolutionary Shaping (Natural Selection)* ⟷ *Evolutionary Shaping (Natural Selection)*
      *   *Tracking Physical Reality* ⟷ *Tracking Moral Truths*
      *   *Skepticism about Perception* ⟷ *Skepticism about Morality*
  *   **Dialectical Work:** The analogy aims to show the debunking argument ("E explains beliefs without needing T, therefore we have reason to doubt T") is *too broad*. If it worked for morality, it should work for perception, leading to global skepticism. Since we reject perceptual skepticism, the argument form must be flawed. **This burden-shifting move is broadly accepted as *formally valid* by many on both sides (e.g., Shafer-Landau, Enoch, Wielenberg vs. Street, Joyce).**

  ### **Key Disanalogies & Their Significance**
  The analogy's *persuasiveness* hinges on the *relevance* of the differences. Here's where the mapping comes apart:

  1.  **The Nature of the "Truths" and "Tracking" Relationship:**
      *   **Perception:** Physical objects/properties (predators, cliffs, fruit) *causally interact* with our senses. Success (survival/reproduction) *directly depends* on accurately representing these features. The "tracking" is causal and feedback-driven. **(Broad Consensus).**
      *   **Morality:** Moral truths (if realist) are typically conceived as *non-natural*, *abstract*, or *causally inert* (e.g., Platonic forms, irreducible normative properties). They *cannot* causally interact with our cognitive faculties. **(Contentious but common realist commitment).**
      *   **Significance:** This is the **most critical disanalogy** (Street's "Darwinian Dilemma" hinges on it). In perception, evolution plausibly *favors* truth-tracking because truth has *causal efficacy*. For non-natural moral truths, evolution cannot select *for* sensitivity to them; it can only select *for* beliefs/concepts that *happen* to align with them *if* they enhance fitness *regardless* of truth. The realist needs an extra story for *why* fitness-promoting moral beliefs would track non-natural truths. **This directly addresses your point about the "independent story."** The debunker argues the analogy *does* beg the question by assuming moral truths *are* the kind of thing that *could* be tracked via natural selection.

  2.  **Calibration and Independent Verification:**
      *   **Perception:** We have robust, independent methods to *calibrate* and *verify* perceptual beliefs (instruments, triangulation, intersubjective agreement, predictive success in science/engineering). We can identify *how* and *why* perception errs (illusions) and correct it. **(Broad Consensus).**
      *   **Morality:** Calibration is deeply contested. Realists often appeal to *reflective equilibrium* (systematizing intuitions, principles, consequences), but debunkers argue this is *circular* if the intuitions themselves are evolutionarily suspect and lacks the *independent, non-moral* verification available to perception (e.g., we can't point a "moralometer" at an act). **(Live Dispute: Realists claim robust methods exist; Debunkers claim they are insufficiently independent).**
      *   **Significance:** The ability to independently verify and correct perceptual errors *justifies* our trust despite evolutionary origins. The lack of comparable independent verification for core moral intuitions leaves them vulnerable. Your observation about realists selectively debunking *some* intuitions (incest, in-group) relies precisely on *other* intuitions or principles calibrated via reflective equilibrium – a process debunkers see as corrupted from the start.

  3.  **The Adaptive Link: Truth-Tracking vs. Fittingness-Promoting:**
      *   **Perception:** Accuracy *is* adaptive. Seeing the lion *as it is* directly aids survival. **(Broad Consensus).**
      *   **Morality:** Did evolution select for *true moral beliefs* or just for *beliefs promoting cooperation, coordination, and social cohesion* within ancestral groups? (Joyce, Ruse). Believing "Helping kin is good" promotes inclusive fitness *whether or not* helping kin is *objectively* good. Believing "Outsiders are dangerous/threatening" promotes group cohesion *whether or not* outsiders *actually* pose a threat. **(Contentious, but the debunker's core explanatory claim).**
      *   **Significance:** This is the **second major disanalogy**. The debunker argues evolution explains the *content* of moral intuitions *without needing* moral truths. The perceptual analogy assumes the adaptive link *is* truth-tracking, but for morality, the adaptive link is arguably *fitness-promoting*, which is distinct. The realist needs to show why fitness-promoting moral beliefs would also be true, especially given the plausible socio-biological explanations for specific contents (kin altruism, reciprocity, tribalism).

  4.  **Domain Specificity and "Carving Up":**
      *   **Perception:** We readily identify specific *modules* (vision, hearing) with specific failure modes and calibration techniques. We don't generally carve "core" vs. "peripheral" perception based on evolutionary origins *for skeptical purposes*. An illusion in one modality doesn't generally cast doubt on others *fundamentally*. **(Broad Consensus).**
      *   **Morality:** Realists *do* often argue for debunking *specific* intuitions (e.g., incest disgust, parochial loyalty) while preserving others (e.g., basic harm avoidance, fairness) via reflective equilibrium. **(Common Realist Strategy - e.g., Huemer, Schafer-Landau).**
      *   **Significance:** Your suspicion is apt. This selective carving *is* disanalogous. The realist argues this is justified because only *some* intuitions are shown to be distorted by evolutionary forces irrelevant to truth. The debunker counters that reflective equilibrium itself relies on evolved intuitions, and the *entire faculty* is suspect due to its fitness-orientation, making piecemeal salvage questionable. The perceptual analogy doesn't support this kind of selective skepticism/certitude *within* the domain.

  5.  **Epistemic Role and Foundationalism:**
      *   **Perception:** Often considered a *foundational* source of justification. We cannot step completely outside it to verify it without circularity or regress. Its global reliability is a *presupposition* of empirical inquiry. **(Broad consensus in epistemology).**
      *   **Morality:** Moral realists often claim moral intuition has a similar foundational role. Critics argue this is far less secure, given the disagreements and the plausible non-truth-tracking evolutionary explanation. **(Live Dispute).**
      *   **Significance:** The analogy leverages the *privileged status* of perception. If morality lacks this status (due to disanalogies 1-3), the analogy's force is diminished. Can moral intuition be foundational *despite* its evolutionary origins? Realists say yes (if it tracks truth); Debunkers say no (because the origins block reliable tracking).

  ### **Does the Realist Conclusion Survive?**
  *   **The Analogy's Limited Success:** The analogy successfully shows that **"E explains B" alone is insufficient for skepticism.** It forces the debunker to add premises specific to morality (e.g., "E cannot select for tracking T because T is non-natural/causally inert" or "E selects for F, and F ≠ T"). **This burden-shifting is non-trivial and widely acknowledged.**
  *   **The Analogy's Failure to Secure Realism:** The critical disanalogies (1 & 3 especially) mean the analogy **does not establish parity of reliability**. The realist *still owes* a positive explanation for *how* evolution could produce reliable moral belief-forming faculties if moral truths are non-natural (the "coincidence" or "sensitivity" problem - Street). Simply pointing to perception doesn't answer this. **Most metaethicists (including many realists) agree the analogy alone is insufficient; it must be supplemented by a positive epistemology (e.g., rational intuition, Cornell realism).**
  *   **Conclusion:** The analogy **shifts the burden** but **does not discharge it** for the realist. It shows evolutionary origins *alone* aren't fatal, but combined with plausible disanalogies concerning the nature of moral truth and the mechanism of adaptive advantage, the challenge to moral realism remains significantly stronger than the (widely dismissed) challenge to perceptual realism. **The realist conclusion ("evolutionary debunking is no more threatening for morality than perception") survives only if one dismisses the significance of the disanalogies (1 & 3), which is precisely what's contested.**

  ### **A Better Analogy? (With Caveats)**
  The perceptual analogy has significant weaknesses. Alternatives are debated:

  1.  **Logical/Mathematical Intuitions:**
      *   **Mapping:** Abstract, necessary truths. No clear causal interaction. Evolutionary origins plausible (e.g., basic numeracy, logical inference useful for toolmaking, social planning).
      *   **Pros:** Better matches the non-natural, abstract nature of moral truths realists often posit. We don't generally doubt 2+2=4 due to evolution.
      *   **Cons:** Strong disagreement on *why* logical/math beliefs are reliable (Platonism vs. Naturalism). Arguably more "hardwired" and less variable than moral intuitions. Adaptive advantage *might* be more directly linked to truth (e.g., misadding berries could be fatal). Still vulnerable to the "Why think E selected for *truth*?" challenge if truths are non-natural. **(Live Dispute: Enoch/Wielenberg favor this; Joyce/Street are skeptical it helps morality).**
  2.  **Folk Mechanics/Biology:**
      *   **Mapping:** Intuitive beliefs about physical objects/biology shaped by evolution ("naive physics", essentialism about species).
      *   **Pros:** Shows evolution can produce roughly accurate beliefs about mind-independent reality in non-perceptual domains. Highlights that *some* correction/refinement is possible (science builds on/corrects folk theories).
      *   **Cons:** These are often *inaccurate* (e.g., impetus theory, flat earth intuitions) and require significant scientific correction. Demonstrates evolution gives us *useful heuristics*, not necessarily *truth*. Undercuts the demand for perfect reliability but may not satisfy the realist need for *objective truth-tracking*. **(Less commonly used but discussed, e.g., by Kahane).**

  **Which Analogy is Best?** There's **no consensus**. The Logical/Math analogy better fits non-naturalist realism but shares the "tracking" problem. Perceptual is more intuitive but has deeper disanalogies. The choice often reflects the realist's broader metaphysical/epistemological commitments.

  ### **Reporting Consensus vs. Taking Sides**
  *   **Broad Consensus:**
      *   The analogy successfully shows "E explains B" alone isn't sufficient for skepticism (burden-shifting works formally).
      *   Perception has causal feedback loops and independent calibration that morality lacks.
      *   Realists need *some* positive epistemology beyond the analogy.
      *   Selective debunking of *some* moral intuitions is common realist practice.
  *   **Live Disputes (Where I've Indicated Sides):**
      *   **The Significance of Disanalogies 1 & 3:** *I side with the debunker view* that these are fatal to the analogy's ability to *secure* reliability. Realists strongly contest this.
      *   **Calibration:** *I lean towards the debunker* on the lack of sufficiently independent moral calibration, though realists have sophisticated defenses.
      *   **Best Alternative Analogy:** *I find the Logical/Math analogy more promising than Perception* for non-naturalists, but acknowledge its unresolved issues.
      *   **Can Moral Intuition be Foundational?** *I'm skeptical* given the evolutionary origins and lack of causal contact, but this is hotly contested.

  In essence, the perceptual analogy is a powerful *dialectical move* that forces clarification, but its *persuasive force* for establishing moral reliability is significantly undermined by the disanalogies concerning the nature of moral truth and the mechanism of selection. The realist needs more than the analogy to answer the debunker.
