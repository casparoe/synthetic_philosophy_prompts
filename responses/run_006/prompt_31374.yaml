  Alright, let me tackle this user's query. They're describing a pattern in risk debates where someone alternates between strong and weak versions of the precautionary principle based on the context. The user is a longtime reader of rationalist content, so they're familiar with concepts like motte-and-bailey but feel this is different. 

  First, I need to understand the core issue. The user observes Alice switching between an absolute prohibition ("if there's any risk, don't do it") and a weaker burden-of-proof stance ("prove it's safe relative to the stakes"). The key is that Alice doesn't seem aware she's shifting standards. 

  The user wants three things: a name for this pattern, how to distinguish it from similar fallacies, and why the precautionary principle is prone to this. Let me start by recalling related concepts. Motte-and-bailey comes to mind, but as the user noted, both positions here are defensible, unlike the indefensible bailey. Isolated demands for rigor involve double standards, but here the inconsistency is in the principle's application, not just rigor. 

  Hmm, what about "precautionary principle stacking"? That doesn't sound right. Maybe "burden-shifting" or "motivated burden calibration"? The latter captures the adjustment of strictness based on desired outcomes. Since no established term exists, coining a phrase makes sense. "Motivated burden calibration" emphasizes the cognitive bias influencing the principle's application.

  Next, differentiation from other concepts. Unlike motte-and-bailey, both formulations here are valid; the issue is inconsistent use. Against isolated demands for rigor, this isn't about applying scrutiny selectively but adjusting the underlying principle's strength. Legitimate stake-based adjustments are consistent, whereas here the shift is outcome-driven.

  Why the precautionary principle? Its structure combines epistemic uncertainty (we don't know the risks) with normative burden assignment (prove safety first). This duality allows sliding between absolutes and gradients. Also, catastrophic potential in domains like virology or geoengineering triggers stronger intuitive aversion, making the absolute version more appealing when opposing something.

  The user's deeper need might be to articulate this pattern for clearer debates. They likely want tools to call out such inconsistencies without accusing bad faith. Highlighting the epistemic-normative bundling helps explain why this principle is especially vulnerable. Other principles with similar dualities (e.g., Pascal's Wager) might exhibit the same pattern, but precautionary debates' high stakes amplify it.
answer: |-
  This is an excellent observation of a subtle but pervasive pattern in risk discourse. Based on your description, here's a breakdown addressing your questions:

  1.  **Established Name:** There isn't a single, universally recognized term *specifically* for this pattern of motivated oscillation in the *strength* of a principle like the Precautionary Principle (PP). However, several related concepts get close:
      *   **Motivated Reasoning:** This is the broadest and most fundamental category. It describes the tendency to process information or apply principles in a way that favors pre-existing beliefs or desired conclusions. Your pattern is a specific manifestation of this.
      *   **Scope Creep / Selective Application:** These describe inconsistently expanding or contracting the boundaries or strictness of a principle based on the target, but don't fully capture the *epistemic strength* shift.
      *   **Burden Shifting:** This often occurs within the pattern, but focuses more on *who* bears the burden rather than the *height* of the burden required.
      *   **The closest descriptive phrase:** You might call this **"Motivated Burden Calibration"** or **"Motivated Stringency Adjustment."** While not a formal fallacy name, it accurately captures the core mechanism: the *required level of proof* (burden) or the *strictness of the prohibition* (stringency) is unconsciously adjusted based on the arguer's prior stance towards the activity.

  2.  **Characterization & Distinction:**
      *   **Key Feature:** The defining characteristic is the **unacknowledged and motivated variation in the *epistemic threshold* or *normative strength* of a single principle** (like the PP) depending on whether the arguer *opposes* or is *neutral/accepting* of a specific proposed action. The principle itself has valid strong and weak interpretations, but the arguer doesn't consistently apply one; they apply the version that best supports their pre-existing conclusion for each *specific case*.
      *   **Distinguishing from Motte-and-Bailey:**
          *   **Motte-and-Bailey:** Involves two distinct claims: one easily defensible but uninteresting ("motte"), one bold and desirable but hard to defend ("bailey"). Retreat under fire is tactical and often conscious.
          *   **This Pattern:** Involves *one principle* with a *spectrum of plausible interpretations* (from strong/absolute to weak/proportional). The shift isn't necessarily a tactical retreat from an indefensible claim, but an unconscious application of whichever interpretation yields the desired outcome for the specific proposal. Both interpretations remain "on the table" and defensible in the abstract.
      *   **Distinguishing from Isolated Demands for Rigor:**
          *   **Isolated Demands for Rigor:** Applies an *unusually high standard of evidence or scrutiny* to one position or proposal while *not applying it equally* to opposing positions or similar proposals. Focuses on *differential application of scrutiny*.
          *   **This Pattern:** Applies *different versions of the same underlying principle* (with different inherent levels of required rigor/stringency) to different proposals. It's not just demanding *more* evidence for one thing than another under the *same* standard; it's *changing the standard itself* based on the proposal.
      *   **Distinguishing from Legitimate Stake-Based Adjustment:**
          *   **Legitimate Adjustment:** Consistently applies a *single framework* where the required level of proof *logically scales* with the magnitude of potential harm and the level of uncertainty, *regardless* of who proposes it or prior feelings about it. The scaling is explicit and principled (e.g., "We require stronger evidence for safety as potential catastrophic harm increases").
          *   **This Pattern:** The adjustment appears inconsistent *relative to the stated stakes* and seems primarily driven by the arguer's pre-existing opposition to specific *types* of interventions rather than a consistent assessment of the risk profile itself. The strong version magically appears for disfavored interventions, even if objectively similar risks exist in favored activities where the weak version is used.

  3.  **Why the Precautionary Principle is Vulnerable:**
      *   **Inherent Vagueness:** The PP is notoriously difficult to define precisely. Core terms like "threat of harm," "scientific uncertainty," "cost-effective," "proportionate," and even "precautionary" are open to interpretation. This ambiguity creates fertile ground for motivated definitions.
      *   **Bundling Epistemic & Normative Claims:** Exactly as you pinpointed. It fuses:
          *   *Epistemic Claim:* We lack conclusive knowledge about potential harm (the uncertainty aspect).
          *   *Normative Claim 1:* This uncertainty *justifies or requires* specific action (or inaction).
          *   *Normative Claim 2 (The Burden):* The *proponent* of the action must *prove* safety (or acceptable risk) to a specified standard *before* proceeding.
      *   **The Crucial Vulnerability:** The **standard of proof required to meet the burden** is almost never explicitly defined within the core PP statements. *This is the core parameter that oscillates.*
          *   **Strong Version:** "Prove it's safe" means *prove with near certainty no catastrophic harm is possible*, which is often practically impossible, leading to de facto prohibition. (Applied to disfavored tech).
          *   **Weak/Proportional Version:** "Prove it's safe" means *demonstrate that risks are manageable and justified relative to benefits, given current knowledge*, allowing progress with safeguards. (Applied to favored activities or the status quo).
      *   **Emotional Salience & Dread:** Technologies like gain-of-function or geoengineering trigger "dread risks" – catastrophic, uncontrollable, potentially global consequences. This emotional response makes the strong, absolute version feel intuitively "correct" when opposing them, overriding the arguer's own weaker formulation used in other contexts.
      *   **Status Quo Bias:** The weak/proportional version is often implicitly applied to *ongoing activities* (like field epidemiology, fossil fuel use, driving cars) because they are familiar and their risks (while potentially large) are accepted. The strong version is weaponized against *novel interventions* perceived as disruptive or "tampering," creating an asymmetric barrier to innovation.

  **Would other principles show this?** Absolutely. Any principle involving burden of proof, acceptable risk thresholds, or proportionality that lacks a rigorously defined, consistently applied metric for *how much proof is enough* or *how proportional is proportional enough* is vulnerable. Examples:
  *   **"Innocent until proven guilty"**: Motivated oscillation between "beyond a reasonable doubt" (for favored defendants) vs. "preponderance of evidence" (for disfavored ones).
  *   **Pascal's Mugging-style reasoning:** Motivated oscillation in the probability threshold deemed "too risky to ignore" for very high-consequence, low-probability events.
  *   **"First, do no harm"**: Motivated oscillation between an absolute prohibition on any potential harm vs. a balancing of potential harms and benefits.

  **In Summary:** You're observing **Motivated Burden Calibration** or **Motivated Stringency Adjustment** within the application of a flexible principle like the Precautionary Principle. The PP is particularly vulnerable due to its inherent vagueness, the conflation of uncertainty with mandated action/inaction, the undefined critical parameter of "required standard of proof," and the emotional weight of the risks it's often applied to. The arguer experiences it as consistency because they genuinely believe each *specific application* of the principle (strong for X, weak for Y) is the correct and obvious one *in that context*, failing to see the inconsistency stems from their *prior conclusions* about X and Y, not a neutral assessment of the risks relative to a fixed standard.
