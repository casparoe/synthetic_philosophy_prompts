  ok so I had a baby three months ago and somehow that sent me down a rabbit hole about population ethics — I read Parfit on the repugnant conclusion and now I can't stop thinking about whether I did something wrong by bringing a life into existence that's only, like, moderately good. But here's the thing: every paper I read starts from some intuition about a particular puzzle case (the repugnant conclusion, the non-identity problem, the mere addition paradox) and then builds a theory to dodge that one thing, and then someone else points out that the fix creates a worse problem somewhere else. I want to step back.

