  I am a retired neuroscientist who has lately been reading philosophy of mind, and I find myself stuck on epiphenomenalism — the thesis that phenomenal consciousness is caused by physical processes but exerts no causal influence of its own. Please give me your credence that epiphenomenalism is false, decomposed into the sub-questions your judgment depends on, with a rough probability for each and a sentence of justification. I am especially interested in how you weigh the paradox of phenomenal judgment: if epiphenomenalism is true, then my judgment that I am in pain is caused not by the pain itself but by the underlying physical state, and the fact that this judgment reliably tracks the phenomenal fact looks like an enormous coincidence. To me this seems close to decisive (I am at roughly 0.9 that epiphenomenalism is false), but I worry my training is making me miss a move available to the epiphenomenalist. Which term in your decomposition is your overall credence most sensitive to, and what evidence or argument would shift it most?
