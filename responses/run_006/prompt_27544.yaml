  ## Exit Music (A Pantoum After the Tragedy)

  The theatre doors exhale me to the street,
  The fading thunder echoes in the stone.
  My pulse still races with a staggered beat,
  A chill I carry, walking home alone.

  The fading thunder echoes in the stone,
  The scenes I most dreaded play again.
  A chill I carry, walking home alone,
  Why do I dread what I most desire then?

  The scenes I most dreaded play again,
  Not shadows, sharp as shards against the mind.
  Why do I dread what I most desire then?
  This ache I sought, and hoped I would not find.

  Not shadows, sharp as shards against the mind,
  But feeling *felt*, a pressure in the chest.
  This ache I sought, and hoped I would not find,
  Refuses now to grant my spirit rest.

  But feeling *felt*, a pressure in the chest,
  Is this the strange and costly thing I bought?
  Refuses now to grant my spirit rest,
  Yet leaving early was a thing I fought.

  Is this the strange and costly thing I bought?
  Not that I think of the author's clever hand,
  Yet leaving early was a thing I fought.
  I clutch my coat against the chill, and stand.

  Not that I think of the author's clever hand,
  Nor breathe relief that it was not my woe.
  I clutch my coat against the chill, and stand.
  The pain was real, yet something made it grow

  Nor breathe relief that it was not my woe.
  Control the feeling? Step outside its glare?
  The pain was real, yet something made it grow
  Beyond the stage, suspended in the air.

  Control the feeling? Step outside its glare?
  The theatre doors exhale me to the street.
  Beyond the stage, suspended in the air,
  My pulse still races with a staggered beat.

  ---

  **Commentary on the Choices Made**

  The pantoum’s recursive structure is the poem’s primary philosophical engine. Lines reappear, forcibly shifted into new contexts, mirroring how the *same* tragic representation elicits both aversion and value. **"The scenes I most dreaded play again"** initially describes involuntary recall (aversive). Its repetition precedes **"Why do I dread what I most desire then?"**, reframing the replay as something paradoxically desired (valued). Similarly, **"This ache I sought, and hoped I would not find"** captures the contradictory pre-show anticipation; its later recurrence after **"But feeling *felt*, a pressure in the chest"** emphasizes the *immediacy* of the suffering as the valued (though disturbing) object itself.

  The poem touches key theoretical positions without resolution:
  *   **Conversion of Feeling:** **"The pain was real, yet something made it grow / Beyond the stage, suspended in the air"** suggests the suffering transforms into something else (aesthetic suspension?), but doesn't resolve into pleasurable catharsis.
  *   **Pleasure of Control/Release:** **"Control the feeling? Step outside its glare?"** explicitly raises the Humean idea of mastering painful emotion from a safe distance, but the question form and the speaker's lingering **"staggered beat"** undermine it as sufficient explanation.
  *   **Intrinsic Value of Feeling:** **"But feeling *felt*, a pressure in the chest"** and **"Is this the strange and costly thing I bought?"** directly posit intense emotional experience itself as the sought-after value, a Schopenhauerian note. The repetition solidifies this as a candidate, but the persistent dread prevents it from feeling like a simple answer.

  Crucially, the poem declines resolution by actively rejecting common escapes:
  *   **Admiration of Skill:** **"Not that I think of the author's clever hand"** dismisses this as irrelevant to the emotional paradox being experienced.
  *   **Relief (Schadenfreude):** **"Nor breathe relief that it was not my woe"** explicitly refuses this potential source of pleasure.

  The circularity of the pantoum form itself embodies the unresolved tension. The poem begins and ends with the speaker expelled onto the street, pulse racing (**"The theatre doors exhale me to the street"**, **"My pulse still races with a staggered beat"**). The machinery loops the core contradictory experiences (**"dread"/"desire"**, **"ache I sought"**, **"pain was real, yet something made it grow"**) without progression towards synthesis. The final stanza offers no new insight, only the repetition of the initial disturbance, leaving the speaker (and reader) in a state of "suspended" wonder. The form ensures the paradox remains felt, not solved.
