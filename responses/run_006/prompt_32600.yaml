prompt: |-
  I'm organizing a workshop on the normativity of promises for an interdisciplinary audience of philosophers, legal scholars, and political theorists, and I'd like to include a piece of philosophical dialogue that captures the central fault line in the contemporary literature on promissory obligation. You are to act as a specialist in moral philosophy with deep expertise in the promising literature — someone comfortable with the views of Rawls, Scanlon, Hume, Shiffrin, Owens, Gilbert, and their interlocutors.

  Write a dialogue between two characters, Elena and Julian, both moral philosophers who hold sharply different views about why promises bind. Elena defends a broadly practice-based or conventionalist account: on her view, promising is a socially constructed institution, and the obligation to keep a promise is internal to the rules of that institution, much as the obligation to follow the rules of a game is internal to having agreed to play it. Julian defends a broadly expectation-based or interpersonal account: on his view, the act of promising is a way of inviting another person to rely on one's future conduct, and the obligation to keep the promise derives from the wrongness of disappointing the reliance one has intentionally invited. They have been circling around this disagreement for years — they teach at neighboring institutions, they've traded objections in Q&A sessions and over email — and they've finally sat down over a long dinner at a conference to hash it out properly. They respect each other, and neither is trying to score points. The conversation should feel like a genuine attempt to understand what is at stake between them, not a debate transcript.

  The dialogue should grapple with at least the following pressure points:

  - The problem of bare or unaccepted promises: what if the promisee doesn't hear the promise, or doesn't care, or immediately releases the promisor? Does the obligation vanish, and if so, why? How does each view handle the intuition that a promise to a dying person binds even if the promisee will never know whether it was kept?
  - The problem of variable practice: if a society's promising conventions were different — say, they treated promises made on a Wednesday as non-binding, or required a witness — would the moral facts about promissory obligation differ? Does the practice view make promissory obligation too contingent on local convention, or does the expectation view have trouble explaining why the specific social form of "promising" matters at all?
  - The question of directed obligation: can the practice view account for the distinctive wrong of breaking a promise to a particular person (as opposed to merely violating a useful convention), and can the expectation view account for the distinctive force of the act of promising itself (as opposed to merely creating expectations, which can be done in many ways)?

  The dialogue should be roughly 1,000 to 1,500 words. Before writing the dialogue itself, take a moment to sketch the key argumentative moves each character will make, and identify one or two points where their views might actually converge or where the disagreement might turn out to be less deep than it first appears. Then write the dialogue, making sure each character genuinely responds to what the other has just said rather than launching into pre-rehearsed speeches.
reasoning: |-
  Okay, the user wants me to create a philosophical dialogue about promissory obligation for an interdisciplinary workshop. They need a conversation between two philosophers - Elena who supports practice-based accounts and Julian who favors expectation-based views. 

  This is quite a sophisticated request. The user clearly knows the literature well - they name-dropped Rawls, Scanlon, Hume and others while specifying key debate points like bare promises and variable practices. They're organizing an academic workshop, so they need something rigorous yet accessible across disciplines.

  Hmm... the tricky part is making this feel authentic. The dialogue can't be a dry debate; it needs to show genuine philosophical engagement. I should map out their core positions first: Elena sees promises like game rules (conventionalist), while Julian focuses on reliance (interpersonal). Their disagreements should surface around three pressure points:
  - Unaccepted promises (like vows to the dying)
  - Cultural relativity (if societies had different rules)
  - Directed obligations (who gets wronged when promises break)

  I notice possible convergence points too. Both might agree that promising isn't merely descriptive - it's normative. And both would reject pure instrumentalism about promises. The dinner setting helps humanize this; they're colleagues who respect each other, not opponents.

  For the structure: Start with Julian raising bare promises to challenge Elena. Then pivot to cultural variation where Elena counters. Finally dig into directed obligations - this exposes Julian's toughest hurdle. I'll weave in their citations naturally (Scanlon for Julian, Rawls for Elena etc.) without name-dropping excessively. 

  The tone matters. No rhetorical point-scoring. Julian should genuinely grapple with how his view handles the performative force of "I promise," while Elena needs to confront whether her conventions feel arbitrary. That dying promise case is perfect - it makes both theories sweat. 

  Word count is tight for 1k-1.5k. I'll focus on depth over breadth, maybe letting one pressure point lead organically to the next. The ending shouldn't resolve but show mutual refinement - maybe they agree promissory wrongs are "sui generis" while disagreeing why. That leaves the workshop audience with productive tension.
answer: |-
  ## Sketch of Key Moves & Convergence Points

  **Elena (Practice-Based View):**
  1. **Core Move:** Promises derive obligation from participation in a socially constituted normative practice. The rules of the practice (like fidelity) *define* what promising is and what it requires. Breaking a promise is akin to cheating at a game you voluntarily joined.
  2. **Bare Promises:** A promise *is* an invocation of the practice. If the practice isn't invoked correctly (e.g., no uptake, immediate release), the full promissory obligation *doesn't* arise. The dying person case is a *different* moral wrong (e.g., deception, disrespect), not a *promissory* wrong per se.
  3. **Variable Practice:** Yes, moral facts *about promissory obligation* would differ in societies with different constitutive rules. Promissory obligation *is* inherently conventional. This doesn't make it unimportant or arbitrary, any more than the rules of property or contract are arbitrary.
  4. **Directed Obligation:** The practice *itself* structures the directedness. By invoking the practice towards B, A incurs an obligation *owed specifically to B* within the normative framework they've both (implicitly) bought into. It's wrong *to B* because the practice defines it as a wrong done *to the promisee*.
  5. **Convergence:** Agrees the *point* of the practice is often to create reliance/assurance, and that the practice is valuable for interpersonal coordination. Might agree that *some* core element (like fidelity) is likely necessary for any viable promising practice.

  **Julian (Expectation-Based View):**
  1. **Core Move:** The moral core of promising lies in intentionally inducing reasonable, detrimental reliance in another person. The obligation arises from the duty not to harm others by manipulating their expectations. The social form ("promise") is a particularly clear *way* to do this, but not the source of the obligation itself.
  2. **Bare Promises:** If no reliance is induced (or possible, as in the unhearing promisee), no obligation arises *from the promise*. The dying person case *does* create an obligation because the promisor intentionally created an expectation *in that person* (even if short-lived), and breaking it disrespects their autonomy/trust *at that moment*.
  3. **Variable Practice:** No, the core moral wrong (intentionally inducing and then thwarting reasonable reliance) remains constant. Weird conventions (Wednesday promises) might affect whether reliance is *reasonable*, but the underlying moral principle doesn't change. The form matters instrumentally for *signaling* intent to induce reliance.
  4. **Directed Obligation:** The obligation is owed *to the promisee* precisely because *they* are the one whose reliance was invited and then harmed/disappointed. The distinctive force comes from the *intentionality* and *clarity* of the expectation-creation inherent in the act of promising.
  5. **Convergence:** Agrees social practices are crucial for establishing the *meaning* of the act (i.e., that "I promise" signals intent to assure). Agrees the practice has significant instrumental value. Might agree the practice provides a useful *framework* for identifying reasonable reliance.

  **Potential Convergence/Depth Reduction:**
  1. **The Importance of the Practice:** Both agree the social practice of promising is crucial – for Elena, it *constitutes* the obligation; for Julian, it provides the reliable *signal* and context that makes inducing reliance possible and reasonable.
  2. **The Value of Assurance:** Both ground the significance of promising (at least partly) in its ability to provide assurance and facilitate reliance-based cooperation.

  ---

  ## The Dialogue: Dinner at the Conference

  **(The clatter of plates subsides. Elena swirls her wine glass, Julian leans back, the intensity of the meal conversation giving way to a more focused quiet.)**

  **Elena:** Julian, that paper you gave today... it crystallized something for me. Your insistence that the *harm* of disappointed reliance is the bedrock – it made me realize why our disagreement feels so persistent. For you, the social practice is, fundamentally, epiphenomenal. A particularly efficient signaling device, perhaps, but ultimately, the moral work is done elsewhere. Is that fair?

  **Julian:** (Nodding slowly) Epiphenomenal is too strong. The practice is *essential* for the *act* to have its standard meaning and effect. Saying "I promise" reliably signals an intention to create a very specific kind of expectation. Without that shared understanding, the utterance wouldn’t *be* a promise. But yes... the *obligation* that arises, when it does, stems from the normative consequences of intentionally creating that expectation in another person. The practice enables the act, the act creates the moral situation. What feels off to me in your view, Elena, is that it seems to make the obligation... contingent in a way that loses the direct interpersonal wrong. Take a bare promise. Suppose I whisper a promise to your unconscious form in the hospital. You never hear it. On your practice view, since there’s no uptake, no invocation of the practice *with* you... no obligation arises? That seems deeply counterintuitive. Surely, I’ve still done something wrong if I break it?

  **Elena:** It *is* counterintuitive at first blush. But let me push back. *What* exactly is the wrong if you break it? You haven’t deceived *me* – I’m unaware. You haven’t harmed me through reliance – I couldn’t rely. If there’s a wrong, it seems more like self-deception, or perhaps a violation of some personal ideal of fidelity... but is it a *promissory* wrong *to me*? The practice of promising requires, as part of its constitutive rules, a promisee who *can* grasp the commitment. It’s like trying to make a move in chess against an opponent who isn’t at the board. The act misfires. The obligation, *qua* promissory obligation defined *by the practice*, doesn’t crystallize.

  **Julian:** But I *intended* it as a promise *to you*. I invoked the words, the form. I directed my commitment *at you*. Doesn’t that intentionality matter? If you woke up and I told you, "I promised to water your plants while you were out," you’d rightly feel... something. Betrayal? Disappointment? Not because you relied, but because I made a commitment *to you* and broke it. Your view seems to reduce it to a mere social faux pas, like breaking a minor convention of etiquette.

  **Elena:** It’s not mere etiquette! The practice carries deep normative weight *because* of what it enables – trust, cooperation, planning. But its structure defines its obligations. Your intuition about betrayal... I think it’s real, but it stems from a *different* moral source. Maybe it’s the disrespect of making a commitment in your name that I never intended to honor, or the deception *if* you later learn of it. But the specific *force* of "I broke my promise *to you*" requires the reciprocal structure of the practice. Now, consider the dying person. I make a deathbed promise. They die moments later. They’ll never know if I keep it. On your view, is there an obligation? Presumably yes, because I created an expectation *in them* just before they died?

  **Julian:** Precisely. For that brief moment, they heard me, they understood, perhaps they felt a flicker of relief or assurance. By breaking it, I violate the trust they placed in me *at that moment*. I exploit their vulnerability. The wrong is done *to them*, even if they never experience the consequence. It’s about respecting their agency *then*.

  **Elena:** But what if the promise was impossible for them to understand? Or if they immediately said, "No, don't trouble yourself"? On your reliance view, the obligation vanishes, yes? Because no expectation was induced, or it was immediately canceled.

  **Julian:** Essentially, yes. If there’s no reasonable reliance created or invited, the core condition for the obligation isn’t met. The utterance might be odd, but not morally binding in that specific way.

  **Elena:** And that’s where my conventionalism bites back, Julian. Because if the *moral* core is reliance, why does the specific social form of "promising" carry such unique weight? Why isn’t it just one way among many of creating expectations? If I say, "Julian, I give you my solemn word I’ll be there," or even just, "You can absolutely count on me," haven’t I invited reliance just as effectively? Yet, intuitively, "I promise" feels different, weightier. Doesn’t that suggest the practice itself adds a layer of normative structure?

  **Julian:** (Leans forward, thoughtful) It *is* weightier, I agree. But I’d argue it’s weightier *because* it’s the clearest, most unambiguous conventional signal we have for *intentionally assuming an obligation to another person*. It triggers the highest level of reasonable reliance. It’s the linguistic nuclear option for assurance. The form matters intensely *because* of what it communicates about my intention to bind myself and invite your trust. But the *source* of the obligation remains the moral prohibition against exploiting that invited trust. Now, let me turn your contingency question around. Suppose we discover a society where their ‘promising’ practice has a rule: promises made on Wednesdays are non-binding. Or they require three witnesses. If someone makes a Wednesday promise there and breaks it, is it morally wrong? On your view, it seems not, because they didn’t violate the constitutive rules of *their* practice. That feels... deeply unsettling. It makes promissory obligation hostage to local convention in a way that robs it of universal moral significance.

  **Elena:** It makes the *specific content* of the obligation contingent on the practice, yes. But the *value* of having *some* such practice isn’t contingent. Any society needs mechanisms for creating binding forward commitments. The Wednesday rule might be inefficient, even silly, but if it’s the established rule, and A invokes it on a Wednesday intending to bind themselves, but knowing the rule allows non-fulfillment... have they really undertaken the same obligation? They’ve participated in a different practice. The moral failing might be in having a bad practice, or in exploiting it cynically, but the specific wrong of "breaking a promise" *as defined by that practice* hasn’t occurred. Just as property rights differ across societies, so can the specific contours of promissory obligation. The universal need is for such institutions, not their identical form.

  **Julian:** But the *harm* of disappointed trust seems universal. If someone in that society says "I promise" on a Wednesday, knowing their hearer reasonably expects fidelity based on the *words* used (perhaps the hearer is a foreigner, or misunderstands the rule), and then breaks it – isn’t there still a core wrong done? The reliance, reasonably formed based on the apparent signal, is still thwarted. The local convention might excuse the promisor *within their own moral framework*, but doesn’t erase the interpersonal harm caused by the misleading signal.

  **Elena:** Ah, but now you’re smuggling in an appeal to reasonable reliance *despite* the practice! If the practice defines Wednesday utterances as non-binding signals, then relying on them *isn’t* reasonable within that practice, even if a foreigner misunderstands. The wrong to the foreigner might be one of negligence or miscommunication, not specifically promissory. The practice sets the baseline for reasonable expectations *about the practice itself*.

  **Julian:** (Sighs, runs a hand through his hair) That’s a tough one. Perhaps the local convention affects the *reasonableness* of the reliance, mitigating the wrong. But I still recoil at the idea that the moral status of breaking a commitment signaled by the words "I promise" fundamentally shifts based on the day of the week, according to local rules. It feels like it trivializes the commitment.

  **Elena:** And I recoil at the idea that the profound normative structure of promising reduces solely to the calculus of induced reliance. It loses the sense of undertaking a distinctive kind of obligation *by the act itself*. Which brings us to directedness. On your view, the obligation is owed to the promisee because they’re the one who relied. But what about cases where the promisee *doesn’t* rely? Suppose I promise to meet you for lunch, you shrug indifferently, but I stand you up anyway. You didn't rely – you didn't even care. On your view, no harm, no foul? But haven’t I still wronged *you* specifically? I broke my promise *to you*.

  **Julian:** (Pauses, frowning) That’s... difficult for my view. I might say you *attempted* to invite reliance, or that breaking it shows a lack of respect for you as someone to whom commitments are made. But it’s strained. The cleanest case relies on actual, or at least reasonably anticipated, reliance. Whereas for you...

  **Elena:** For me, it’s straightforward. By invoking the practice *towards you*, I incurred an obligation *to you*, according to its rules. You releasing me, or not caring, might waive the obligation or make its breach less serious, but the initial directedness is built into the act within the practice. I wronged *you* because I violated a norm of the practice that structures a relationship *between us*.

  **Julian:** So the practice itself creates the relational bond and the directed duty... almost like a miniature social contract between two individuals?

  **Elena:** (Smiling slightly) A bit like that, yes. A micro-institution invoked between us.

  **Julian:** I still think the *reason* that institution has moral force is rooted in the interpersonal vulnerabilities and assurances it mediates – the reliance and trust. But... (he takes a sip of wine) ...I see better now how the practice, for you, isn't just a signal, but the very fabric that weaves the obligation. It creates a normative space between people.

  **Elena:** And I see better how, for you, the practice gains its deepest significance from preventing a very specific kind of interpersonal harm – the betrayal of invited trust. Perhaps... perhaps the practice is the vessel, but the moral liquid it carries is the avoidance of that harm?

  **Julian:** (Chuckles) A messy metaphor, but... maybe. And perhaps your vessel gives the liquid its distinctive shape and force. The directedness, the sense of a bond created *by the act itself*... that’s hard to derive purely from reliance ex post facto. My view struggles to capture the performative magic of "I promise."

  **Elena:** And mine struggles to explain why that magic isn't just arbitrary convention, but something with deep moral resonance across contexts. Maybe we’re circling the same well, looking at different facets of the same complex thing – the human need to bind our future selves reliably to others.

  **Julian:** A need both social and deeply interpersonal. (Raises his glass slightly) Still disagree, but... perhaps less deeply about *why* it matters.

  **Elena:** (Clinks her glass against his) To the disagreement, then. And the dinner. It’s been illuminating, Julian. Truly.
