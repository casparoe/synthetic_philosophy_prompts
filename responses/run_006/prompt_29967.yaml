  Then, the leaks vs. deliberate signals distinction. DFH might see leakage as unavoidable but less risky than targeted METI, which is like shouting your coordinates. But is that realistic? Our radio signals degrade over distance, so maybe we're not as exposed as DFH fears. Also, the absence of any contact so far could undermine DFH—why no attacks if everyone's hiding?

