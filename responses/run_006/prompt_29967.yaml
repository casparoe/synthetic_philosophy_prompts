  I need to be honest about where DFH doesn't fit. For example, if civilizations are truly paranoid, they'd have sterilized Earth preemptively. The fact we exist might contradict DFH. Also, METI advocates' optimism about altruistic aliens challenges the axiom of inevitable hostility.

