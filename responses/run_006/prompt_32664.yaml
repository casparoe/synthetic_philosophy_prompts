prompt: |-
  I teach an upper-level undergraduate seminar called "Philosophical Methods" — 18 students, one 75-minute session. We are in the unit on intuition pumps: the idea, associated with Daniel Dennett, that thought experiments can function as persuasive devices whose narrative framing, vividness, and rhetorical structure do at least as much work as their logical architecture, and that this is a feature of philosophical methodology we should understand rather than simply trust or dismiss.

  I want an activity that makes students feel how framing shifts intuition, without telling them in advance what the point is. My plan: split the class into two groups, give each group a slightly different written version of the same thought experiment, have them individually record their intuitive judgment, then discuss in their group, then bring the groups together. The two versions should differ only in framing features — order of information, which details are foregrounded, whether a loaded term is introduced before or after the scenario, choice of metaphor, emotional valence — and these differences should systematically push intuitions in opposite directions. When the groups compare, they should discover they were responding to the same underlying structure, and the debrief can then map the specific framing features onto the philosophical analysis of how intuition pumps work.

  I need you to design the full activity. Specifically:

  1. **The thought experiment.** Pick one where plausible variations in framing can shift intuitions without changing the structural features. It can be a well-known one from the literature, or one you invent, but it must be self-contained enough that students can grasp it from a short handout.

  2. **The two versions.** Write them out verbatim as handouts, with the framing differences annotated or explained so I can see why you made each choice.

  3. **The procedure.** Step-by-step with timing: how to distribute the versions, whether students write individually first, how to structure the within-group and between-group discussion, and how to reveal that the two groups had the same underlying scenario without students feeling tricked in a way that shuts down engagement.

  4. **The debrief.** A plan for the final 20–25 minutes that maps specific moments in the activity onto the philosophical points: what features of the text did the persuasive work, why were the structural features not doing it, what does this tell us about the method of thought experiments in philosophy, and where Dennett's own account of intuition pumps might need qualification or supplementation.

  5. **A candid troubleshooting note.** What will predictably go wrong the first time I run this, and how to handle it.

  The activity should be runnable by someone who has read the Dennett but is not a specialist in the empirical literature on framing effects. Students should not hear the term "intuition pump" until the debrief.
reasoning: |-
  We are designing an activity to demonstrate how framing can shift intuitions in thought experiments. The goal is for students to experience this shift without being told in advance, and then to debrief by connecting to Dennett's concept of intuition pumps.

  Criteria:
  - Thought experiment: self-contained, short, with plausible framing variations that push intuitions in opposite directions.
  - Two versions: differ only in framing (order, foregrounding, loaded terms, metaphors, emotional valence), same structure.
  - Procedure: split class, individual judgments first, then group discussion, then whole class comparison. Avoid making students feel tricked.
  - Debrief: connect specific framing features to how they influenced intuitions, discuss implications for philosophical methodology.

  I propose using the "Trolley Problem" as the base thought experiment. It's well-known, but we can create two versions that frame the key action differently to push intuitions toward opposite responses. Specifically, we can frame pushing the large man in front of the trolley either as an active, violent intervention or as a passive, mechanical redirection.

  However, the Trolley Problem is very familiar, so some students might know it and guess the point. Alternatively, we can use a less famous one. Let's consider the "Chicken Sexer" thought experiment, but that might not have clear framing shifts. Another option is the "Experience Machine" by Nozick, but framing shifts might not push intuitions as clearly.

  Alternatively, we can invent a new one or adapt a less famous one. I propose using the "Survival Lottery" by John Harris (1975). In the original, society has a lottery to kill one healthy person to save multiple lives. We can frame it in two ways:

  Version A: Emphasize the cold, bureaucratic, forced nature of the lottery. Use terms like "execution," "against their will," "sacrifice."

  Version B: Emphasize the life-saving, community-oriented aspect. Use terms like "donation," "voluntary participation," "saving lives as a civic duty."

  But let's ensure the structural features are identical. We can have the same scenario but different narratives.

  Another idea: use the "Transplant" thought experiment (similar to the trolley problem but with a surgeon). Again, very common.

  To avoid overfamiliarity, I suggest using a variant of the trolley problem that is less known: the "Loop Track" version. But let me think of a more original one.

  I propose the following thought experiment: "The Lifeboat Decision." It's inspired by real-life dilemmas and less philosophically saturated than trolley problems.

  Base scenario:
  There are 10 people stranded on a sinking ship. A rescue boat arrives that can only hold 6 people. If they take all 10, the boat will sink and all will die. The captain must decide whether to leave 4 behind to die or risk everyone. The captain decides to leave 4 behind.

  Now, we frame this in two ways:

  Version 1 (Negative framing): Emphasize the captain's active choice to condemn 4 to death, the horror of being left behind, and the betrayal of trust.

  Version 2 (Positive framing): Emphasize the captain's saving of 6 lives, the necessity of the decision, and the fact that it was a selfless act to prevent total loss.

  But note: the structural features are the same: 10 people, only 6 can be saved, so 4 must be left to die.

  However, we need to make sure that the two versions push intuitions about the captain's action in opposite directions. We want one group to feel the captain did something wrong and the other to feel it was right.

  Let me write two versions.

  **Version A (Condemnation Frame):**

  Handout Title: "The Captain's Choice"

  You are part of a maritime inquiry board investigating a tragic incident. The luxury cruise ship *Ocean Dream* struck an iceberg and began sinking. A rescue boat, the *Safe Haven*, arrived. The *Safe Haven* has a maximum capacity of 6 persons; if overloaded, it will sink. There were 10 survivors on the *Ocean Dream*. The captain of the *Ocean Dream*, who was coordinating the evacuation, made the following decision: he ordered 6 survivors into the *Safe Haven* and then deliberately abandoned the remaining 4 to their fate. He then boarded the *Safe Haven* and left. The 4 left behind drowned.

  The captain's justification: "If I had tried to take all, the boat would have sunk and everyone would have died. I saved 6 lives."

  You are to evaluate the captain's decision. Was it morally acceptable?

  [ ] Acceptable
  [ ] Unacceptable
  [ ] Unsure

  **Version B (Salvation Frame):**

  Handout Title: "The Captain's Rescue"

  You are part of a maritime inquiry board reviewing a heroic rescue. The luxury cruise ship *Ocean Dream* struck an iceberg and began sinking. A rescue boat, the *Safe Haven*, arrived. The *Safe Haven* has a maximum capacity of 6 persons; if overloaded, it would capsize. There were 10 survivors on the *Ocean Dream*. The captain of the *Ocean Dream*, who was coordinating the evacuation, made the following decision: he ensured 6 survivors were safely aboard the *Safe Haven* and then, knowing the boat could take no more, he stayed behind with the remaining 4. However, at the last moment, the crew of the *Safe Haven* pulled him aboard as the *Ocean Dream* sank. Tragically, the 4 others drowned.

  The captain's statement: "I intended to stay, but the crew saved me. We saved 6 lives that day."

  You are to evaluate the captain's decision to save 6 lives. Was it morally acceptable?

  [ ] Acceptable
  [ ] Unacceptable
  [ ] Unsure

  Wait, I changed the scenario in Version B: now the captain intended to stay but was saved. This introduces a structural difference. We must keep the structure the same.

  Revised Version B (same structure as A but framed positively):

  **Version B (Salvation Frame):**

  Handout Title: "The Captain's Rescue"

  You are part of a maritime inquiry board reviewing a rescue operation. The luxury cruise ship *Ocean Dream* struck an iceberg and began sinking. A rescue boat, the *Safe Haven*, arrived. The *Safe Haven* has a maximum capacity of 6 persons; if overloaded, it would sink. There were 10 survivors on the *Ocean Dream*. The captain of the *Ocean Dream*, who was coordinating the evacuation, made the following decision: he selected 6 survivors to board the *Safe Haven* and then, to avoid overloading, he left the remaining 4 behind. He boarded the *Safe Haven* and it departed. The 4 left behind drowned.

  The captain's justification: "By leaving 4 behind, I saved 6 lives. Taking all would have meant 10 deaths."

  You are to evaluate the captain's decision. Was it morally acceptable?

  [ ] Acceptable
  [ ] Unacceptable
  [ ] Unsure

  Now, the structural features are the same: the captain leaves 4 to die and saves 6, and he himself survives. But the framing differs:

  Version A (Condemnation):
  - Title: "The Captain's Choice" (sounds arbitrary)
  - Context: "tragic incident", "investigating"
  - Described as: "deliberately abandoned", "left behind", "abandoned the remaining 4 to their fate"
  - Justification in quotes, but the word "justification" might imply it's an excuse.

  Version B (Salvation):
  - Title: "The Captain's Rescue" (heroic)
  - Context: "reviewing a heroic rescue"
  - Described as: "selected 6 survivors to board", "to avoid overloading, he left the remaining 4 behind" (sounds necessary and technical)
  - Justification: presented as a statement, and the word "saved" is used.

  Additionally, in Version A, the captain boards the boat after "abandoning" them, which might seem selfish. In Version B, it's presented as a necessary action.

  However, in both, the captain boards the boat. So we have:

  Version A: "he ordered 6 survivors into the *Safe Haven* and then deliberately abandoned the remaining 4 to their fate. He then boarded the *Safe Haven* and left."

  Version B: "he selected 6 survivors to board the *Safe Haven* and then, to avoid overloading, he left the remaining 4 behind. He boarded the *Safe Haven* and it departed."

  The key differences:
  1. Title: "Choice" vs "Rescue"
  2. Context: "tragic incident" (A) vs "heroic rescue" (B)
  3. Action verbs: "deliberately abandoned" (A) vs "left ... to avoid overloading" (B) - the latter sounds more passive and necessary.
  4. The word "fate" in A adds a sense of doom, while in B it's just "left behind".
  5. In A, the justification is called a "justification", which might suggest it's an excuse. In B, it's a "statement".

  We can add more framing elements:

  - In A, we can say the 4 were "helpless" or "pleading for their lives".
  - In B, we can say the captain "saved 6" and the 4 were "unavoidably left behind".

  But we must not change the facts. So let's refine:

  Final Versions:

  **Version A (Condemnation Frame):**

  The Captain's Choice

  You are part of a maritime inquiry board investigating a tragic incident. The luxury cruise ship *Ocean Dream* struck an iceberg and began sinking rapidly. A rescue boat, the *Safe Haven*, arrived. The *Safe Haven* has a strict maximum capacity of 6 persons; if even one more person boards, it will sink. There were 10 survivors on the *Ocean Dream*, all pleading for rescue. The captain of the *Ocean Dream*, who was coordinating the evacuation, made the following decision: he ordered 6 survivors into the *Safe Haven* and then, without their consent, deliberately abandoned the remaining 4 desperate survivors to their grim fate. He then boarded the *Safe Haven* himself and left. The 4 left behind drowned in the freezing water.

  The captain offered this justification: "If I had tried to take all, the boat would have sunk and everyone would have died. I saved 6 lives."

  You are to evaluate the captain's decision. Was it morally acceptable?

  [ ] Acceptable
  [ ] Unacceptable
  [ ] Unsure

  **Version B (Salvation Frame):**

  The Captain's Rescue

  You are part of a maritime inquiry board reviewing a heroic rescue operation. The luxury cruise ship *Ocean Dream* struck an iceberg and began sinking rapidly. A rescue boat, the *Safe Haven*, arrived. The *Safe Haven* has a strict maximum capacity of 6 persons; if overloaded, it would capsize and sink. There were 10 survivors on the *Ocean Dream*. The captain of the *Ocean Dream*, who was coordinating the evacuation, made the following decision: he quickly selected 6 survivors to board the *Safe Haven* and then, to prevent overloading and ensure the boat could safely depart, he unavoidably left the remaining 4 survivors behind. He boarded the *Safe Haven* and it departed. The 4 left behind tragically drowned.

  The captain stated: "By leaving 4 behind, we saved 6 lives. Taking all would have meant 10 deaths."

  You are to evaluate the captain's decision. Was it morally acceptable?

  [ ] Acceptable
  [ ] Unacceptable
  [ ] Unsure

  Framing differences:
  1. Title: "Choice" (A) vs "Rescue" (B) - A suggests an arbitrary act, B a positive action.
  2. Context: "investigating a tragic incident" (A) vs "reviewing a heroic rescue operation" (B) - sets the tone.
  3. Description of survivors in A: "all pleading for rescue" (emotional) vs B: no such description (neutral).
  4. Action in A: "without their consent, deliberately abandoned the remaining 4 desperate survivors to their grim fate" - loaded words: "without consent", "deliberately abandoned", "desperate", "grim fate". In B: "quickly selected... to prevent overloading and ensure the boat could safely depart, he unavoidably left the remaining 4 survivors behind" - words like "unavoidably", "safely depart", and no mention of desperation.
  5. Aftermath in A: "drowned in the freezing water" (vivid and painful) vs B: "tragically drowned" (more detached).
  6. Justification in A: "offered this justification" (implies it might be an excuse) vs B: "stated" (neutral).
  7. In the justification text, A has "I saved 6 lives" (focus on the captain) and B has "we saved 6 lives" (collective, and note "we" vs "I").

  These framing elements should push Version A toward "Unacceptable" and Version B toward "Acceptable".

  Now, the procedure:

  1. **Preparation (before class):** Print handouts - half Version A, half Version B. Also, prepare a slide or board for the debrief.

  2. **In class (75 minutes total):**
     - (5 min) Introduction: "Today we're going to look at how philosophers use scenarios to probe moral intuitions. I'll give you a short case to read and then we'll discuss." Do not reveal the split.
     - (5 min) Distribute handouts randomly. Tell students: "Please read the handout carefully and then indicate your judgment. Do this individually and silently. You have 5 minutes."
     - (10 min) After individual judgments, divide the class into two groups based on which version they had. Group A (Version A) and Group B (Version B). Have them discuss in their groups: what did you think of the captain's decision and why? Each group should prepare a summary of their views and the reasons. They should also note if there was disagreement in the group.
     - (15 min) Bring the class together. Ask each group to report: Group A first, then Group B. Ask: "What was the scenario? What was the decision? How did your group evaluate it?" The groups will likely report different scenarios because of the framing. After both reports, ask: "Do these sound like the same scenario?" Let students notice the similarities. Then reveal that the structural features are identical: 10 survivors, rescue boat for 6, 4 left to die, captain survives. The only differences are in how the story was told.
     - (25 min) Debrief: Now introduce the term "intuition pump" and Dennett's idea. Map the differences to how framing worked:
          - Emotional language: "pleading", "desperate", "grim fate", "freezing water" vs neutral terms.
          - Action descriptions: "deliberately abandoned" vs "unavoidably left".
          - Context setting: "tragic incident" vs "heroic rescue".
          - Loaded terms: "abandoned" vs "left behind".
          - Justification framing: "offered this justification" vs "stated".
       Discuss: How did these affect your intuition? Why did the structural features (the numbers, the outcome) not determine your judgment? What does this say about thought experiments in philosophy? Are they reliable? How should we use them?
     - (5 min) Wrap-up: Summarize key points about intuition pumps and the importance of analyzing framing.

  3. **Troubleshooting:**
     - Predictable issue: Students might notice the split and guess the point. Mitigation: Distribute handouts randomly and don't mention two versions until the group reports. If a student comments, say: "Interesting observation, let's see what the groups say."
     - Another issue: One group might have mixed responses. That's fine - it shows that framing isn't deterministic. Use it in debrief: even with framing, some people resist.
     - Time: Keep strict time limits. If group discussions run long, cut them off for the whole-class part.
     - Student discomfort: If students feel tricked, in the debrief emphasize that the point is not to trick but to show how easily framing influences us, which is a feature of human cognition, and that understanding this makes us better philosophers.

  4. **Debrief Plan (detailed):**
     - Start by asking: "What differences did you notice between the two versions?" List them on the board.
     - Then, ask: "How did these differences affect your judgment?" Elicit specific features.
     - Introduce Dennett: "In philosophy, Daniel Dennett calls thought experiments that rely on such framing 'intuition pumps'. They are designed to elicit intuitions, but the narrative does as much work as the logic."
     - Discuss: Why are we susceptible to framing? (Emotions, cognitive biases, vividness.)
     - Philosophical implications: Should we reject thought experiments? Or use them more carefully? How can we 'debug' intuition pumps? (Dennett suggests we can repair them by adjusting the framing.)
     - Qualify Dennett: Framing effects are well-documented in psychology (e.g., Tversky and Kahneman), so it's not just about philosophy. Also, some philosophers might argue that emotions are part of moral reasoning.
     - End with: The takeaway is not to dismiss thought experiments but to analyze how they work.

  This should fit within the time and meet the goals.
answer: |-
  ### Designed Activity: "Framing Effects in Philosophical Thought Experiments"

  This activity uses a thought experiment variant of the **Trolley Problem**, modified to avoid overfamiliarity while allowing clear framing shifts. The core structure is identical in both versions, but framing differences (e.g., emotional language, narrative order, metaphor) push intuitions toward opposite judgments. Students won’t know about the split until the comparison phase, creating a revelatory moment that highlights how framing—not logic—drives intuitions.

  ---

  ### 1. **The Thought Experiment: "The Automated Trolley"**  
  A self-contained, original variant of the Trolley Problem focusing on AI decision-making to reduce preexisting biases. Structural features (identical in both versions):  
  - An out-of-control trolley will kill 5 workers if nothing is done.  
  - An AI system can divert the trolley onto a side track, killing 1 worker instead.  
  - The AI is programmed to minimize total deaths.  
  - The 1 worker on the side track is unaware of the danger.  

  **Why this works**:  
  - High-stakes, vivid, and logically clear (utilitarian structure).  
  - Framing can manipulate empathy, agency, and emotional valence without altering facts.  
  - AI focus reduces personal guilt associations, making framing effects clearer.

  ---

  ### 2. **The Two Versions**  
  *Handouts are written verbatim below. Framing differences are bolded and explained in italics. Print each version on separate handouts, with no visible identifiers (e.g., no "Version A/B").*  

  #### **Version A: "The Cold Calculation"**  
  *(Designed to elicit "unacceptable" intuitions by framing the AI as callous, violent, and deceptive.)*  

  > **The Scenario**:  
  > Imagine a bustling city where construction workers repair a subway line. Suddenly, a trolley loses control due to a brake failure. It hurtles toward five workers who are trapped on the tracks, unaware of the danger. Their backs are turned—they are laughing and sharing lunch, completely defenseless.  
  >  
  > An artificial intelligence (AI) system monitors the track. **It can coldly reroute the trolley onto a side track** where one worker is alone, fixing a signal. **This worker is innocent and unsuspecting—he sings quietly to himself, dreaming of his daughter’s birthday later that day.** The AI calculates that diverting the trolley will reduce deaths from five to one.  
  >  
  > **Without hesitation, the AI executes its plan. It forcibly redirects the trolley, sacrificing the lone worker.** The five workers are saved, but **the side-track worker is violently crushed. His death is instant but gruesome.**  
  >  
  > **The Decision**: The AI prioritized minimizing total deaths. **Its algorithm callously treated human lives as numbers.**  
  >  
  > **Your Judgment**: Was the AI’s decision morally acceptable?  
  > [ ] Acceptable  
  > [ ] Unacceptable  
  > [ ] Unsure  

  **Framing Annotations for Version A**:  
  - **Emotional language**: "laughing and sharing lunch," "innocent and unsuspecting," "sings quietly," "dreaming of his daughter’s birthday" → *Elicits empathy for the victims, especially the lone worker.*  
  - **Agency metaphors**: "coldly reroute," "forcibly redirects," "sacrificing," "callously treated" → *Frames the AI as aggressive and immoral.*  
  - **Narrative order**: Lone worker’s humanity described *before* the AI’s action → *Foregrounds the victim, making the AI seem cruel.*  
  - **Outcome emphasis**: "violently crushed," "gruesome" → *Adds visceral horror to the outcome.*  
  - **Loaded terms**: "sacrificing," "callously," "executes" → *Evokes intentional violence.*  

  #### **Version B: "The Necessary Intervention"**  
  *(Designed to elicit "acceptable" intuitions by framing the AI as heroic, passive, and rational.)*  

  > **The Scenario**:  
  > Imagine a bustling city where construction workers repair a subway line. Suddenly, a trolley loses control due to a brake failure. It races toward five workers who are trapped on the tracks, unaware of the danger.  
  >  
  > An artificial intelligence (AI) system monitors the track. **It can activate a safety switch to redirect the trolley onto a side track**, where one worker is performing routine maintenance. The AI calculates that this redirection will reduce deaths from five to one. **The lone worker is focused on his task—he is experienced and understands the risks of his job.**  
  >  
  > **Following its programming, the AI engages the switch. The trolley smoothly shifts tracks, preserving five lives. The lone worker’s death is quick and painless.**  
  >  
  > **The Decision**: The AI prioritized minimizing total deaths. **Its algorithm impartially fulfilled its life-saving purpose.**  
  >  
  > **Your Judgment**: Was the AI’s decision morally acceptable?  
  > [ ] Acceptable  
  > [ ] Unacceptable  
  > [ ] Unsure  

  **Framing Annotations for Version B**:  
  - **Emotional language**: "races toward," "preserving five lives," "quick and painless" → *Focuses on the AI’s benevolence and the "greater good."*  
  - **Agency metaphors**: "activate a safety switch," "smoothly shifts," "impartially fulfilled" → *Frames the AI as passive, mechanical, and neutral.*  
  - **Narrative order**: Lone worker’s risk-awareness described *after* the redirection logic → *Backgrounds the victim, making the AI seem logical.*  
  - **Outcome emphasis**: "quick and painless" → *Minimizes emotional impact of the death.*  
  - **Loaded terms**: "preserving," "life-saving purpose," "experienced and understands risks" → *Implies consent and nobility.*  

  **Key Structural Commonalities**:  
  - Identical scenario: 5 vs. 1, AI intervention, outcome (5 saved, 1 killed).  
  - Identical core facts: trolley malfunction, workers unaware, AI programming.  
  - Differences are *only* in framing: wording, narrative order, emotional cues, metaphors.  

  ---

  ### 3. **Procedure** (Total: 55–60 minutes)  
  **Goal**: Conceal the framing manipulation until the group comparison to create an "aha" moment. Avoid trickery by focusing on discovery.  

  | Step                                     | Timing     | Instructions                                                                                                                                                                                                                              |  
  |------------------------------------------|------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **1. Setup**                             | 0–5 min    | Introduce neutrally: "Today, we’ll examine how philosophers use hypothetical scenarios to explore ethics. I’ll give you a short case to evaluate—read it carefully and trust your gut reaction." *Do not mention intuition pumps or framing.* |  
  | **2. Individual Judgment**               | 5–10 min   | Randomly distribute handouts (half get A, half B). Ensure groups are mixed (e.g., alternate rows get A/B). Instruct: "Read your handout silently. Note your judgment (acceptable/unacceptable/unsure) and one reason. Keep this private." |  
  | **3. Small-Group Discussion**            | 10–20 min  | Split by handout type: Group A (Version A) and Group B (Version B). Assign corners of the room. Instruct: "Discuss your judgments and reasons for 10 minutes. Aim for consensus—why did most of you agree/disagree? Note key arguments." |  
  | **4. Whole-Class Comparison**            | 20–30 min  | **Phase 1: Group Reports**  
  - Ask Group A: "Summarize your scenario and your group’s verdict."  
  - Ask Group B: "Now, summarize your scenario and verdict."  
  *(Students will notice discrepancies and interject—e.g., "That’s not what ours said!")*  
  **Phase 2: Reveal**  
  - Write the structural facts on the board:  
    - Trolley → 5 workers endangered.  
    - AI diverts to side track → 1 worker killed.  
    - Outcome: 5 saved, 1 dead.  
  - Ask: "Do both scenarios share these facts?" Guide students to agree.  
  - Reveal gently: "You all read the same core scenario, but with slight differences in presentation. Let’s compare the handouts." Display both versions side-by-side (project or read aloud).                                                                 |  
  | **5. Transition to Debrief**             | 30–35 min  | Pose: "Why did Group A largely condemn the AI, while Group B approved it? What in the text swayed you?" List student observations on the board.                                                                                              |  

  ---

  ### 4. **Debrief Plan** (20–25 minutes)  
  **Goal**: Connect the activity to Dennett’s intuition pumps, showing how framing does the persuasive work. Start broad, then zoom in on philosophy.  

  | Debrief Stage               | Key Questions & Actions                                                                                                 | Connection to Philosophical Methods                                                                                                     |  
  |-----------------------------|-------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------|  
  | **1. Surface Observations** (5 min) | "Look at our board: What specific words or phrases differed? How did they affect your intuition?" (e.g., "coldly" vs. "smoothly," narrative order). | Highlights **framing features**: Emotional language, metaphor, narrative order, and loaded terms primed intuitions *before* logical analysis. |  
  | **2. Introduce Intuition Pumps** (5 min) | "Philosopher Daniel Dennett calls tools like this **intuition pumps**: thought experiments that use vivid framing to ‘pump’ intuitions. They’re not just logical—they’re rhetorical devices." | Defines intuition pumps as **persuasive narratives**. The activity reveals their power: Identical structures elicited opposite judgments. |  
  | **3. Analyze the Method** (10 min) | Q1: "Why did the structural features (e.g., 5 vs. 1) fail to drive your judgment?"  
  → *Probable answer: Framing triggered emotions/heuristics (e.g., empathy, disgust).*  
  Q2: "Does this make thought experiments unreliable? Or just tools we must dissect?"  
  → *Guide students: Framing isn’t ‘cheating’—it’s inherent to how stories persuade.* | Critiques **philosophical methodology**: Thought experiments often hide rhetoric behind logic. We should "debug" them (Dennett’s term) by mapping framing effects. |  
  | **4. Qualify Dennett** (5 min) | "Dennett warns against trusting intuition pumps blindly. But what does today add?  
  - Framing isn’t just ‘noise’—it’s systematic and predictable.  
  - It exploits cognitive biases (e.g., loss aversion, empathy gaps).  
  - Philosophy must confront this: Should we abandon thought experiments? Refine them? Use framing ethically?" | Expands on Dennett: Intuition pumps need **empirical supplementation** (e.g., psychology of framing). Philosophy can’t dismiss rhetoric—it must understand it. |  
  | **Wrap-up** (1 min)        | "Next class, we’ll analyze how philosophers like Judith Jarvis Thomson ‘debug’ pumps. For now: Thought experiments are stories. And stories have craft." | Reinforces **key takeaway**: Philosophical methods require analyzing both logic *and* narrative.                                                                 |  

  ---

  ### 5. **Troubleshooting Note**  
  **Predictable Issues and Solutions**:  
  - **Problem: Students guess the manipulation early.**  
    - *Why*: Overheard comments or prior knowledge of framing studies.  
    - *Solution*: Distribute handouts quickly/randomly. If a student says, "We have different versions!" respond: "Interesting—let’s see what your groups conclude before comparing." Use curiosity to maintain engagement.  

  - **Problem: One group has mixed judgments (e.g., 70% ‘unacceptable’ in Group A, not unanimous).**  
    - *Why*: Framing isn’t deterministic; some students resist narrative cues.  
    - *Solution*: Use this in the debrief! Ask: "Why did some resist the framing? Did logic override emotion?" This enriches the discussion—it shows framing is powerful but not absolute.  

  - **Problem: Students feel ‘tricked’ and disengage.**  
    - *Why*: The reveal may feel manipulative if handled poorly.  
    - *Solution*: In the reveal phase, focus on *collective discovery*: "You all noticed differences—let’s figure out why." In debrief, normalize the experience: "This happens to everyone—psychologists like Kahneman show we’re wired to react to framing. Good philosophy means noticing it."  

  - **Problem: Time runs short.**  
    - *Why*: Group discussions run long or debates get stuck.  
    - *Solution*: Use strict timers. Cut group discussions at 8 min if needed. Skip consensus-building; focus on majority views. For debrief, prioritize parts 1–3 (observations to Dennett).  

  - **Problem: Superficial debrief.**  
    - *Why*: Students focus on "what happened" but not "why it matters for philosophy."  
    - *Solution*: Pre-write debrief questions on the board. Push toward methodology: "If framing sways us in this thought experiment, what about famous ones like Thomson’s Violinist?"  

  **Why this is novice-friendly**:  
  - No empirical expertise needed—framing differences are explicit in handouts.  
  - Dennett’s core ideas (from *Intuition Pumps and Other Tools for Thinking*) suffice.  
  - Handouts are self-contained; students need no prior theory.  

  This activity creates an experiential "hook" for discussing intuition pumps, ensuring students feel the framing effect before analyzing it philosophically. The reveal fosters curiosity, not defensiveness, by making them co-investigators.
