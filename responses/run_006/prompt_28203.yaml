     - Both sides agree: Without any anthropic update, the prior is 50-50. 
          Under SSA: You should reason you are a random observer. In heads world, there is 1 observer; in tails, 2. So, conditional on being an observer, P(heads) = 1/3.
          Under SIA: The prior is weighted by the number of observers. So, P_prior(heads) proportional to 1, tails to 2. Then, after conditioning on being an observer, P(heads) = (1/2 * 1) / (1/2*1 + 1/2*2) = 1/3.
