prompt: |-
  As a longtime reader of LessWrong and related forums, I have seen the doomsday argument and the Self-Indication Assumption treated too often as tribal badges, and I want the document that would result if two careful people actually sat down to isolate where the disagreement lives. Please draft the joint statement that a committed advocate of the doomsday argument and a committed proponent of the Self-Indication Assumption could both sign after a good-faith adversarial collaboration on whether our observed birth rank among humans is strong evidence that humanity will go extinct relatively soon.

  The advocate's core claim, to be stated in the document in its strongest defensible form, is: conditional on the total number of humans who will ever live, my birth rank is roughly uniform among those humans; a rank near one hundred billion is far more likely if the total is a few hundred billion than if it is in the trillions; so, for a wide range of priors, observing that we are this early substantially raises the probability of near-term extinction. The critic's core claim, also to be stated in its strongest form, is: my existence itself is more strongly predicted by worlds that contain more observers, and this self-indication effect gives larger-population hypotheses a prior boost that exactly cancels the birth-rank likelihood, so the doomsday inference evaporates; what remains is ordinary reasoning about extinction risk from non-anthropic evidence.

  Write the document they should have produced after a year of arguing. It should include:

  1. A numbered agreed-claims section. Cover at least: the conditional likelihood-ratio core of the doomsday argument that both sides accept as mathematics; precise statements of the Self-Sampling Assumption and the Self-Indication Assumption as update rules, written so a neutral third party could implement them; what both sides agree the dispute is not about, including ordinary Bayesian updating, the reality of extinction risks, and the fact that the two assumptions differ; and any claims about reference classes, model uncertainty, or the formal cancellation result that both can sign.

  2. A disagreements table. Each row should state one residual disagreement in neutral framing, with the advocate's formulation and the critic's formulation each written so its own side would accept the wording. Flag any rows that, on inspection, turn out to be verbal or to hinge only on a choice of formalism with no empirical content.

  3. A crux list. Identify the sub-questions such that settling one would move at least one side. I suspect the main cruxes are: whether the Self-Indication Assumption double-counts observers or is the only way to avoid ignoring the evidence of one's own existence; whether any non-arbitrary reference class can be selected for the sampling, and whether the doomsday conclusion is robust to plausible variations in that class; and whether the doomsday likelihood survives once model uncertainty about the far future is handled with a defensible prior over total human population. If you find a different crux more load-bearing, say so and justify it.

  4. For each crux, a concrete case, argument, or empirical consideration both sides agree bears on it, with each side's prediction recorded in advance. Use cases from the anthropics literature where they help, such as a duplication scenario with a fair coin or a scenario in which one theory postulates vastly more observers than another and the question is whether to update toward it without any new local evidence, but describe each case self-contained enough to be evaluated without external sources. Where no test can be agreed, say so explicitly and explain what that impasse indicates about the structure of the disagreement.
reasoning: |-
  We are drafting a joint statement from a Doomsday Argument (DA) advocate and a Self-Indication Assumption (SIA) critic after adversarial collaboration.

  Agreed Claims (Section 1):
  1. Mathematical Core: Both parties agree on the following likelihood ratio: 
     Let \( N \) be the total number of humans that will ever live (a random variable). 
     Let \( n \) be our observed birth rank (approximately 100 billion). 
     Conditional on \( N \), the probability of having a birth rank \( n \) is:
     \[
     P(n | N) = \begin{cases} 
          \frac{1}{N} & \text{if } n \leq N \\
          0 & \text{otherwise}
     \end{cases}
     \]
     Therefore, for two hypotheses \( N_1 \) and \( N_2 \) with \( n \leq N_1, N_2 \), the likelihood ratio is:
     \[
     \frac{P(n|N_1)}{P(n|N_2)} = \frac{N_2}{N_1}
     \]
     This means that, all else equal, the observation of birth rank \( n \) is more likely under smaller \( N \).

  2. Self-Sampling Assumption (SSA): Both parties agree that SSA is an update rule that says: 
     "When updating your beliefs upon learning your birth rank \( n \), you should condition on being a randomly selected observer among all observers in your reference class who will ever exist."

  3. Self-Indication Assumption (SIA): Both parties agree that SIA is an update rule that says: 
     "Upon learning that you exist, you should update in favor of hypotheses that imply the existence of more observers like you, in proportion to the number of such observers. Specifically, the prior probability of a hypothesis \( H \) should be weighted by the number of observers in \( H \), and then updated by ordinary conditioning on your evidence (which includes your birth rank)."

  4. Agreement on Disagreement: The dispute is not about:
     a) The mathematics of conditional probabilities: Both agree on the likelihood ratio above.
     b) Ordinary Bayesian updating without anthropic considerations: Both agree that non-anthropic evidence should be updated in the standard way.
     c) The reality of extinction risks: Both agree that there are real-world risks that could cause human extinction, and that these should be evaluated based on empirical evidence.
     d) The fact that SSA and SIA are different: Both agree that these two assumptions lead to different updates and therefore different conclusions about the doomsday argument.

  5. Reference Classes: Both parties agree that the choice of reference class (e.g., all humans, all conscious beings, etc.) is a source of uncertainty. However, they also agree that the core argument does not depend on the exact reference class as long as it is consistently applied and as long as we condition on being in that class. They note that robustness to reference class variation is a point of disagreement (to be detailed in the disagreements section).

  6. Formal Cancellation under SIA: Both parties agree that if one adopts SIA, then the prior probability of a hypothesis \( H_N \) (which states that the total number of humans is \( N \)) is proportional to \( N \times P_0(H_N) \), where \( P_0 \) is the prior without SIA. Then, upon conditioning on birth rank \( n \) (with \( n \leq N \)), the posterior becomes:
     \[
     P(H_N | n) \propto N \times P_0(H_N) \times \frac{1}{N} = P_0(H_N)
     \]
     Thus, under SIA, the posterior probability of \( H_N \) is the same as the non-anthropic prior \( P_0(H_N) \). This is the formal cancellation result: the likelihood effect (favoring small \( N \)) is exactly canceled by the prior weighting (favoring large \( N \)) in SIA.

  Disagreements Table (Section 2):

  | Disagreement Description (Neutral)                              | Advocate's Formulation (DA)                                     | Critic's Formulation (SIA)                                      | Verbal/Formalism? |
  |-----------------------------------------------------------------|-----------------------------------------------------------------|-----------------------------------------------------------------|-------------------|
  | 1. How to account for the evidence of one's own existence?     | SIA double-counts the fact that we exist, because we already condition on our existence by updating on our observations. | Without SIA, we ignore the fact that our existence is more probable in worlds with more observers. | Substantive       |
  | 2. The appropriate prior over observer locations.              | The prior should be uniform over observers (SSA) because we have no reason to favor one observer over another. | The prior should be uniform over observer-moments or weighted by the number of observers because hypotheses with more observers are more likely to contain us. | Substantive       |
  | 3. The impact of reference class choice.                        | The doomsday conclusion holds for a wide range of plausible reference classes (e.g., humans, sentient beings) and is robust to the exact choice. | The reference class problem is severe: the doomsday argument can be made arbitrarily strong or weak by choosing a different reference class, so it lacks robustness. | Substantive       |
  | 4. Handling of model uncertainty for large N.                   | Even with uncertainty about the far future, the prior over N is typically such that the likelihood ratio (favoring small N) still shifts the posterior toward earlier doom. | Under SIA, the prior over N must be specified, and SIA's prior weighting (favoring large N) is exactly what is needed to avoid an arbitrary bias toward doom. | Substantive       |
  | 5. Whether SSA leads to counterintuitive results in other scenarios. | SSA is the correct way to reason in anthropic problems and avoids the pitfalls of SIA (e.g., the presumptuous philosopher). | SIA is necessary to avoid counterintuitive results (e.g., in the sleeping beauty problem or the double-counting of identical observers). | Substantive (but note: some points may be verbal) |

  Note: We flag that disagreement 5 may involve arguments that are partly verbal or dependent on intuitions about other thought experiments, but both sides see them as substantive.

  Crux List (Section 3):

  Crux 1: Does SIA double-count the evidence of existence?
     - Importance: If SIA double-counts, then it is invalid and SSA should be used. If not, then SIA is necessary to avoid ignoring evidence.

  Crux 2: Is there a non-arbitrary reference class that can be used for the doomsday argument, and is the argument robust to reference class changes?
     - Importance: If the reference class is arbitrary and the conclusion changes drastically with the class, then the doomsday argument cannot be trusted. The DA advocate claims robustness, the critic claims sensitivity.

  Crux 3: How should we set the prior over the total number of humans, \( N \), especially given model uncertainty about the far future? And does the doomsday likelihood effect survive this uncertainty without SIA?
     - Importance: The DA advocate argues that even with uncertainty, the likelihood effect is strong enough to shift the posterior. The critic argues that without SIA, we are ignoring the prior probability of existing in a large universe.

  Crux 4: Which update rule (SSA or SIA) yields more intuitive results in well-established anthropic thought experiments?
     - Importance: Both sides use thought experiments to justify their update rules. If one rule consistently gives counterintuitive results, that counts against it.

  Concrete Cases for Cruxes (Section 4):

  Crux 1: Double-counting?
     - Case: "The Coin-Flip Creation" scenario: 
