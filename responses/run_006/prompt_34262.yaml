prompt: |-
  I run a small reading group out of my local rationality meetup — eight or so engineers and programmers, sharp but no formal philosophy, the kind of people who've argued about trolley problems on the forum but never had to seperate 'prima facie' from 'all things considered'. Next month I've got one ninety-minute session on the problem of dirty hands in politics, and I want to teach it properly, not just lead a bull session that ends in "politics is messy." I know the standard move is to open with the ticking-bomb torture case, but I think that's a trap: it immediately derails into whether torture ever works and whether the scenario is realistic, and it makes people think dirty hands is only about emergencies and violence, when the interesting structure is quieter than that. My instinct is to carry the session with a different case: a newly elected president of a country coming out of a civil war has to sign an amnesty law covering the security forces that ran the torture camps, because the military won't demobilize without it and the alternative is the war resuming with many more deaths. Signing denies the victims their day in court and lets torturers walk free — that's a real wrong — and yet it's plausibly the right thing to do. That, to me, is the whole puzzle in one case.

  I need a plan for how to explain this, not the explanation itself. What has to be in place before the students can even see the puzzle — I suspect it's the naive assumption that "right" and "wrong" are exclusive, that if an act was the right thing to do then there's nothing wrong about it and nothing to feel guilty about — and how do I crack that open without just asserting it? What order should the pieces go in, what depends on what, and where exactly do I introduce the idea that the wrongness survives the justification and leaves a remainder? I'm expecting the main misconception to be something like "if it saves alot of lives then it wasn't wrong, just hard," but I want the full misconception map: the people who'll collapse it into ends-justify-the-means consequentialism, the people who'll treat it as a tragic dilemma with no right answer, the people who'll say the guilt is just a psychological afterimage rather than evidence of real wrongness, and the ones who'll think this is a special get-out-of-jail-free card for politicians rather than a general feature of role obligations. For each one I want to know the point in the sequence where it should be headed off, and how to head it off without just telling them they're wrong.

  You're an expert in moral and political philosophy who has thought hard about this problem, not just read the summary page. Start by brainstorming the misconception list and the dependency structure before you write the final sequence. Then give me the plan: the order of ideas and why, the one carrying example (and if the amnesty case is bad, tell me what a better one needs that it lacks), the misconceptions and where each gets defused, what I should openly refuse to cover at this level, and one question I can ask at the very end to tell whether they actually got it rather than just nodded along. Don't give me a reading list.
reasoning: |-
  Okay, the user runs a reading group for engineers and programmers interested in rationality, focusing on the "dirty hands" problem in politics. They want to avoid the ticking-bomb torture example because it leads to debates about effectiveness and realism, which misses the broader philosophical point. Instead, they propose an amnesty case after a civil war. The user needs a structured plan to teach this concept effectively, addressing common misconceptions without just correcting them.

  First, I need to identify the core misunderstanding: the belief that if an action is justified, it can't be wrong. The user mentioned that participants might think saving lives makes the action not wrong, just difficult. Other misconceptions include reducing it to consequentialism, seeing it as a tragic dilemma with no right answer, viewing guilt as merely psychological, or considering it a special exemption for politicians.

  The dependency structure is crucial. The group needs to grasp that moral decisions can involve unavoidable wrongs even when justified. Starting with the amnesty case is good because it avoids immediate violence debates. But I should ensure the case is presented neutrally, emphasizing that the president must choose between two bad options, not that one is clearly better.

  Key steps: Begin with a simpler case to show that choices can involve unavoidable wrongs, like the supply officer diverting medicine. This establishes that some situations force a choice between two moral values. Then introduce the amnesty case, highlighting that the wrong (denying justice) persists despite the justification. Contrast this with tragic dilemmas where neither choice is justified; here, one choice is justified but still carries moral residue.

  Addressing misconceptions: For those leaning towards consequentialism, stress that the wrongness isn't overridden; it leaves a remainder. Against the tragic dilemma view, clarify that there is a justified choice, but it doesn't erase the wrongdoing. For the psychological guilt argument, explain that the guilt is appropriate because the act was genuinely wrong, not just regrettable. To counter the "politician's exemption" idea, link dirty hands to role obligations that anyone might face, like a doctor prioritizing patients during triage.

  The sequence should build step-by-step. Start with the supply officer example, then the amnesty case. Define dirty hands, distinguishing it from other concepts. Use thought experiments to challenge misconceptions. End with a question to check understanding, like asking what the president should feel after signing the amnesty and why.

  The user’s example is solid, but it must be framed correctly. Avoid implying that the amnesty is the obvious best choice; present it as a necessary evil with lingering wrongness. Also, refuse to dive into debates about realism or broader political theory. Focus solely on the moral structure of dirty hands.

  Finally, the closing question should reveal if they grasp the residue of wrongdoing despite justification. Asking what the president should feel and why would test their understanding of the moral remainder.
answer: |-
  Here's a battle-tested plan for your 90-minute session, designed to build the "dirty hands" concept step-by-step while preempting common collapses. Forget the ticking bomb – your amnesty case is excellent because it avoids emergency distortion and focuses on *institutional* compromise and *systemic* injustice.

  **Core Problem to Crack Open:** The naive assumption that moral justification erases moral wrongness. If it's "right all things considered," people think it can't *also* be genuinely wrong, and any guilt is irrational or merely emotional.

  **Misconception Map & When to Defuse Them:**

  1.  **"If it saves lives/prevents war, it wasn't *really* wrong, just difficult." (Consequentialist Collapse):** Most common. Defuse *immediately* after presenting the core case, before justification is discussed. Show that *both* options involve profound wrongs.
  2.  **"This is just 'ends justify the means' consequentialism." (Reductionism):** Defuse when introducing the *structure* of dirty hands. Emphasize the *persistence* of the wrong *despite* justification.
  3.  **"It's just a tragic dilemma with no right answer; both choices are equally bad/wrong." (Tragic Dilemma Equivalence):** Defuse when arguing for the *justification* of one choice. Highlight why one path is *demanded* (prevents greater catastrophe) while *still* being wrong.
  4.  **"The guilt is just psychology/regret, not evidence of real wrongness." (Psychological Reductionism):** Defuse when introducing the concept of "moral remainder." Link guilt to the *objective* violation of a moral principle, not just bad feelings.
  5.  **"This is a special excuse for politicians; normal people don't face this." (Role Exemption):** Defuse when generalizing the concept. Show how role obligations in high-stakes, constrained environments *create* the conditions, but the *structure* applies more broadly.
  6.  **"Denying justice isn't *really* wrong if it secures peace; peace is the higher justice." (Moral Monism/Justification Absorption):** A subtle variant of #1. Defuse by insisting on the *distinct* value of retributive/legal justice that is *separately* violated.

  **Dependency Structure:**
  1.  **Recognize Moral Conflict:** Must see that choices involve violating *genuine* moral principles.
  2.  **Accept Genuine Wrongdoing:** Must accept that choosing the *lesser evil* still involves committing *an evil*.
  3.  **Understand Justification:** Must see *why* the lesser evil is the "right" (or obligatory) choice all things considered.
  4.  **Grasp Non-Eraseability:** Must understand that justification *does not negate or cancel* the inherent wrongness of the act chosen.
  5.  **Conceptualize Remainder:** Must see that the unresolved wrongness manifests as a "moral remainder" (guilt, taint, need for reparation/atonement).

  **The 90-Minute Plan:**

  **Phase 1: Setting the Stage - Unavoidable Wrong (20 mins)**
  *   **Hook (5 min):** "We often talk about hard choices. Let's start with something simpler than your amnesty case. Imagine you're a medical supply officer in a disaster zone. You have ONE shipment of life-saving antibiotics. Camp A has 10 critically ill children. Camp B has 50 critically ill adults. You can only send it to one camp. Whichever you choose, people who could have been saved will die. Is there a 'right' choice? Probably: send it to Camp B, save more lives. But... is choosing Camp A *wrong*? Or is choosing Camp B *wrong* because you let the 10 kids die?" (Quick discussion).
  *   **Point:** Highlight that *sometimes there is no option that avoids committing a serious wrong*. Doing the "right thing" (saving more lives) *requires* doing something terrible (letting 10 kids die). Introduce the idea: **"In some choices, every option involves violating a genuine moral principle."**
  *   **Preempt Misconception #1 & #6:** Explicitly state: "Sending the drugs to Camp B is the *right thing to do*, given the circumstances. But does that mean letting the 10 children die *wasn't wrong*? Or that it was somehow 'okay'? Most of us feel it was *still wrong*, even if necessary." *Don't let them collapse it yet.* Just plant the seed: Rightness doesn't erase wrongness.

  **Phase 2: The Core Case - Amnesty & The Puzzle (25 mins)**
  *   **Present Your Amnesty Case (Neutrally!) (5 min):** Outline the scenario clearly. Emphasize: credible threat of renewed war if no amnesty, victims denied justice, torturers walk free. Stress the *moral weight* on both sides: Peace/Preventing Mass Death vs. Justice/Accountability/Non-Impunity.
  *   **Guided Analysis (15 min):**
      *   *Q1:* "What are the *moral principles* being violated *no matter what* the President does?" (List them: Prevent mass suffering/Uphold peace; Deliver justice/Punish grave wrongs/Protect rule of law/Respect victims). **Crucial: Reinforce that both options involve violating core, non-negotiable moral demands.**
      *   *Q2:* "Is there a *clear* 'right' answer? Which path seems *justified* overall? Why?" (Guide them to see signing is *probably* the lesser evil/obligatory choice to prevent greater catastrophe). **Preempt Misconception #3:** "Is this *just* a coin flip? A 50/50 tragic dilemma? Or is there a strong reason why one choice (signing) seems *demanded*, even though it's horrible?" (Focus on scale of harm prevented).
  *   **Introduce the Dirty Hands Puzzle (5 min):** "So, signing the amnesty is likely the *right thing to do* all things considered – it prevents a greater evil. BUT, in doing so, the President commits a serious wrong: perpetuating injustice, betraying victims, violating the rule of law. The puzzle is: **How can the same act be both the *right thing to do* AND genuinely *wrong*?** If it's right, how can it be wrong? If it's wrong, how can it be right? This is the 'Problem of Dirty Hands'." **Preempt Misconception #2:** "It's *not* simply 'ends justify the means'. The 'means' here (denying justice) is *still wrong*, even if the end (peace) is overwhelmingly important. The wrongness doesn't vanish."

  **Phase 3: Cracking the Naive Assumption - The Remainder (25 mins)**
  *   **The Survival of Wrongness (10 min):**
      *   *Q3:* "Imagine the President signs. The war ends. Lives are saved. Should the President feel *good* about signing? Or should they feel *guilty* or *tainted*? Why?" (Elicit feelings of guilt/shame/regret).
      *   *Q4:* "Is this guilt *just* a feeling? Like regretting a hard choice? Or is it a response to something *real* in the moral universe?" **Argue:** The guilt is *fitting* because a real wrong *was committed*. The principle of justice *was violated*. That violation doesn't disappear because it was necessary. **This is the Moral Remainder.** **Preempt Misconception #4:** Distinguish regret ("I wish I didn't have to") from guilt ("I did something wrong"). The guilt points to the *objective* wrong committed.
      *   **Analogy:** "Think of breaking a promise to save a life. Saving the life was the right thing to do. But you still *broke a promise*. You might (and arguably *should*) still feel guilty about breaking the promise, even though you were justified. You owe the person an apology or explanation. The wrongness leaves a trace."
  *   **Structure of Dirty Hands (10 min):** Define it clearly:
      1.  **Role Obligation:** Acting in a role (President, leader) with special responsibilities (protect citizens, maintain order).
      2.  **Inescapable Moral Conflict:** Facing a choice where *every* option violates a serious moral principle.
      3.  **Justification:** One option is *morally required* (lesser evil) given the role and consequences.
      4.  **Persistence of Wrong:** The act chosen remains *inherently wrong* despite its justification.
      5.  **Moral Remainder:** The justified wrong leaves a residue (guilt, taint, need for atonement/reparation).
  *   **Preempt Misconception #5:** "Is this *only* for politicians? Imagine a CEO who has to lay off 1000 loyal employees to save the company and the jobs of 5000 others. Or a doctor in triage deciding who gets the last ventilator. Or even you, having to tell a harsh truth that deeply hurts a friend for their own long-term good. The *scale* and *nature* of the principles differ, but the *structure* – unavoidable wrong within role obligations, justification, persistent wrongness, remainder – can appear anywhere responsibility meets constrained choices." Give a quick non-political example.

  **Phase 4: Consolidation & Look Ahead (15 mins)**
  *   **Recap (5 min):** Restate the core puzzle: How an act can be both justified/all-things-considered-right AND inherently wrong. Emphasize the non-erasure of wrongness and the concept of the moral remainder. Reiterate the structure.
  *   **Refuse to Cover (State Clearly):** "For today, we're *not* solving whether dirty hands is *true*, debating if the President *should* feel guilty, figuring out *how* to atone, or discussing *all* ethical theories. We're just trying to *see* the puzzle clearly in its own terms – that justification doesn't erase wrongness."
  *   **The Litmus Test Question (5 min):** **"After signing the amnesty and securing peace, the President says: 'I did the right thing, and therefore I have nothing to feel guilty about. Denying justice wasn't actually wrong in this situation.' Has this President understood the problem of dirty hands? Why or why not?"**
      *   *Why it works:* It directly tests the core insight. The correct answer is **No**. The President has collapsed the wrongness into the justification (Misconceptions #1, #2, #6) and dismissed the moral remainder (#4). Understanding dirty hands means recognizing that "I did the right thing" **does not** imply "therefore I did nothing wrong" or "therefore I shouldn't feel guilty."
  *   **Brief Look Ahead / Wrap (5 min):** "So, we've seen the structure. Next time, we could wrestle with the big questions: *Is* this a real phenomenon? *Should* the President feel guilty? *Can* they be cleansed? What does this *mean* for political ethics?" End by acknowledging the deep discomfort the idea provokes.

  **Why This Sequence Works:**

  1.  **Builds Gradually:** Starts with a simpler, less politically charged case to establish "inescapable wrong" before hitting the complex amnesty case.
  2.  **Defines the Problem Before Solution:** Forces them to sit with the puzzle ("How can it be both right AND wrong?") before offering the conceptual tools.
  3.  **Targets Core Misconception Early:** Directly challenges the "justification erases wrongness" idea in Phase 1 and reinforces it relentlessly.
  4.  **Uses Case Effectively:** The amnesty case avoids emergency logic, involves institutional compromise (not just violence), and has clear, weighty moral principles on both sides. It lacks the "Does torture work?" distraction.
  5.  **Preempts Collapses Strategically:** Each misconception is addressed at the precise point where it's most likely to arise in the logical flow.
  6.  **Focuses on Structure:** Avoids getting bogged down in debates about political theory, realism, or solutions. Stays laser-focused on *recognizing* the phenomenon.
  7.  **Provides Clear Litmus Test:** The final question is a direct probe for the core understanding.

  **Carrying Example:** Stick with your amnesty case. It's excellent. Ensure it's presented neutrally – don't *start* by implying signing is obviously the "right" choice. Frame it purely as the agonizing dilemma with profound wrongs on both sides. The "rightness" of signing should *emerge* from the group's analysis of preventing greater harm.

  This plan respects your group's intelligence by building the concept rigorously while actively preventing the common derailments you anticipate. Good luck!
