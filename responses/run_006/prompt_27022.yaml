  For Kant's view, the key is distinguishing policy execution driven by duty (intrinsic reward function) versus instrumental rewards. The shopkeeper's honest policy has moral worth only if it's anchored to "treat customers fairly" as a terminal goal. Williams' objection becomes a conflict between a human policy's instinctual drives (spousal bond as hardcoded intrinsic reward) versus explicit moral deliberation. 

