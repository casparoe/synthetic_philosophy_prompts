answer: |-
  **Thought Experiment:**  
  A public health authority must allocate $100 million to either treat a chronic inflammatory condition affecting 1% of the population (10,000 people in a population of 1,000,000) or fund a broad well-being enhancement program. Untreated, the condition causes persistent discomfort and functional impairment, reducing quality of life (QoL) to 0.5 on a standard 0–1 scale (0 = worst possible suffering, 1 = full flourishing), with treatment restoring QoL to 0.8. The same funds could instead provide a mild mood-enhancement program to the remaining 990,000 people, increasing their QoL from 0.8 to 0.805 for one year. Both utilitarians agree to fund the treatment. However, if the untreated condition's severity is reduced to QoL 0.6 (still restored to 0.8 with treatment), the classical utilitarian now prefers the enhancement program, while the negative utilitarian still prefers treatment.

  **(a) Base Case Agreement (Untreated QoL = 0.5):**  
  - **Classical Utilitarian:** Computes net QoL gains. Treatment yields 10,000 people × (0.8 – 0.5) × 20 years (average remaining lifespan) = 60,000 QALYs. Enhancement yields 990,000 × (0.805 – 0.8) × 1 year = 4,950 QALYs. Since 60,000 > 4,950, treatment maximizes total welfare.  
  - **Negative Utilitarian:** Focuses exclusively on suffering reduction. The condition (QoL 0.5) involves significant suffering, eliminated by treatment. The enhancement targets non-suffering individuals (QoL 0.8), merely increasing happiness. Suffering reduction is categorically prior, so treatment is obligatory.  

  **(b) Divergence with Reduced Severity (Untreated QoL = 0.6):**  
  - **Classical Utilitarian:** Treatment now yields 10,000 × (0.8 – 0.6) × 20 years = 40,000 QALYs. Enhancement remains 4,950 QALYs. However, the alternative use of funds could achieve more: investing the $100 million in government bonds yields 5% annual return ($5 million/year), funding *perpetual* annual enhancements. Each year, $5 million enhances 990,000 people from QoL 0.8 to 0.805 (4,950 QALYs/year). Discounted at 3%/year, this perpetuity has a net present value of 4,950 / 0.03 ≈ 165,000 QALYs. Since 165,000 > 40,000, the enhancement program maximizes utility.  
  - **Negative Utilitarian:** The condition (QoL 0.6) still constitutes suffering (below the "flourishing" threshold of ~0.7–1), and treatment eliminates it. The enhancement program only adds happiness for non-suffering individuals. Suffering reduction remains paramount, so treatment is mandatory.  

  **(c) Structural Feature:**  
  The divergence arises from **asymmetric moral categorization**. Classical utilitarianism uses a *monistic scale*: suffering reduction and happiness promotion are symmetrical components of welfare, summed directly (e.g., QALYs). Negative utilitarianism treats them as *categorically distinct*: suffering reduction is a stringent duty, while happiness promotion is optional or secondary. Thus, when treatment’s welfare gain (40,000 QALYs) is outweighed by an alternative (165,000 QALYs), classical utilitarianism switches. Negative utilitarianism never "trades off" core suffering against peripheral happiness.  

  **(d) Classical Utilitarian Critique:**  
  The classical utilitarian argues the negative utilitarian’s verdict in the divergent case reveals a **perverse inflexibility**: prioritizing a modest suffering reduction (40,000 QALYs) over a vastly larger happiness gain (165,000 QALYs) ignores that the latter could indirectly reduce more suffering. For example, the perpetual enhancement program might fund future anti-poverty measures or improve societal resilience, preventing aggregate suffering. By forbidding such trade-offs, negative utilitarianism fixates on immediate suffering at the cost of greater, avoidable misery—violating the core utilitarian tenet of *impartial welfare maximization*.
