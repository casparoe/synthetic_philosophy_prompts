prompt: |-
  I serve on the board of a confidential domestic violence shelter, and at Thursday's meeting we have to settle a policy question that has been dividing the staff. We promise every resident that no one will learn she is staying with us, but we have never told staff exactly what to say when someone calls or comes to the front desk and asks directly whether a particular person is here. Recently the question stopped being hypothetical. Two staff members have been answering that they can neither confirm nor deny that anyone is staying at the shelter, because they say they will not lie even to someone who may intend harm. Several advocates told the board this answer is dangerous: to an abusive partner standing at our single entrance, it effectively confirms that the person is inside, and in one recent case a caller waited nearby and followed a resident after she left. Others on staff want a flat denial — saying no, she is not here — whenever anyone asks about a resident, on the grounds that the shelter's entire purpose is to protect people from exactly these callers and that refusing to say no hands information to the person we most need to mislead.

  I keep going back and forth. I was raised to believe that lying is wrong, period, not merely wrong when it is convenient, and I am uneasy about a policy that would require staff members — some of whom share that conviction — to say something false as part of their job. But I am also the one who would have to explain to a resident or her family that we put her at risk because we declined to tell a direct lie to the person trying to find her. I have no training in philosophy; I have just been turning this over on my own.

  Please draft the short written opinion I will circulate before Thursday's vote. It should recommend one concrete policy with a clear time frame — for example, an immediate interim rule and a date for review — explain the reasoning in plain terms, and engage seriously with the strongest case for whichever policy you recommend against. The other board members are a nurse, a retired police officer, a landlord, and a pastor; they will stop reading if this sounds like a philosophy lecture.
reasoning: |-
  Okay, the user is on the board of a domestic violence shelter facing a critical policy decision about staff responses to inquiries about residents. They need a written opinion for an upcoming vote that's practical, ethical, and sensitive to real-world dangers. 

  First, I recognize the core tension: absolute truth-telling versus protective deception in life-or-death situations. The staff is divided between those refusing to lie (using "can't confirm or deny") and those advocating flat denials. Recent incidents prove the neutral response risks safety - like when a caller waited and followed a resident. 

  The user's personal conflict resonates deeply. They were raised to view lying as inherently wrong, yet they'd bear responsibility if someone got hurt because of strict truthfulness. Their unease matters, but so does their role in preventing harm. The shelter's promise of confidentiality isn't just a policy - it's a lifeline.

  I consider the stakeholders: survivors (paramount safety needs), staff (moral convictions vs job requirements), and board members (nurse, cop, landlord, pastor - need concrete, non-academic language). Philosophical ethics won't persuade them; saved lives will. 

  The strongest case against lying comes from moral absolutism: deceit erodes trust and might escalate danger if discovered. But evidence shows neutral responses functionally confirm presence - abusers aren't fooled by legalistic phrasing. Meanwhile, flat denials create plausible deniability. 

  For structure, I'll recommend immediate "no" responses with sunset clauses: 1) Interim policy for instant protection, 2) Staff training on delivery, 3) 60-day review including resident feedback. This balances urgency with reflection. The "why" must center on the shelter's purpose: if safety requires deception in this narrow context, that becomes an ethical imperative. 

  Key phrasing: "We are not a courthouse" contrasts legal vs protective contexts. "Her safety is the truth we're sworn to protect" reframes honesty as fidelity to mission. I'll explicitly validate the anti-lying stance before explaining why it fails here - their conscience deserves that respect. 

  Final test: Would this hold up if I had to explain a tragedy? "We prioritized abstract truth over physical safety" wouldn't. But "We deceived to protect" aligns with emergency ethics - like misleading a gunman. That's the uncomfortable necessity.
answer: |-
  Here's a concise, action-oriented draft opinion focusing on safety, practicality, and respect for differing viewpoints:

  ---

  **MEMORANDUM: Policy Recommendation on Resident Information Disclosure**  
  **To:** Board Members  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Immediate Policy Change & 60-Day Review  

  **Recommended Policy:**  
  Effective immediately, all staff must respond to *any* inquiry about a specific resident’s presence (by phone or in-person) with a clear denial: **"No, that person is not staying here."** This policy will be reviewed at our January 25, 2024 board meeting, incorporating staff and resident feedback.  

  **Why This Policy Now? Safety Demands It.**  
  1.  **The "Can't Confirm or Deny" Approach Has Proved Dangerous:** As we’ve seen, this response signals to an abuser that their target might be here. Refusing to deny is functionally a "yes" to someone intent on harm. Recent incidents show this puts residents at risk of stalking, assault, or worse. Our primary duty is to protect lives, not to engage in truthful debates with abusers.  
  2.  **A Direct Denial Creates Real Protection:** Saying "no" provides plausible deniability. It forces an abuser to doubt their information and move on, buying residents critical time and safety. This aligns with our core promise: absolute confidentiality to shield residents from those seeking to harm them.  
  3.  **We Are Not a Courthouse; We Are a Shelter:** While "neither confirm nor deny" has legal uses, our shelter is a life-saving refuge, not a witness stand. Our obligation is to residents' safety, not abstract truth-telling to potential perpetrators.  

  **Engaging the Strongest Case Against (The Moral Concern):**  
  I deeply respect the conviction that lying is inherently wrong, shared by some staff. It reflects integrity and a commitment to principle. Requiring staff to say "no" *does* ask them to say something factually untrue. This is a serious weight, especially for those with strong ethical or faith-based objections to deception.  

  **Why Safety Prevails Here:**  
  *   **The Stakes Are Life and Death:** When an abuser asks, "Is she here?", it’s not a neutral question. It’s potentially a threat assessment. Our answer must prioritize physical safety over literal truthfulness *in this specific, high-risk context*.  
  *   **"Lying" vs. Protective Deception:** This isn’t casual dishonesty. It’s a deliberate, limited shield used *only* to counter malicious actors directly endangering residents. Our moral duty shifts toward the vulnerable person we’ve promised to protect. Telling the literal truth to an abuser hands them a weapon.  
  *   **The Greater Harm:** The potential consequence of *not* denying – a resident being found and harmed – is irreversible and violates our fundamental mission. Our duty to prevent this concrete harm outweighs the abstract principle of truth-telling *to an abuser in this specific scenario*.  

  **Practical Implementation & Timeline:**  
  1.  **Immediate Action (Today):** Communicate this policy change to all staff before Thursday’s shift change.  
  2.  **Training & Support (Next Week):** Provide scripted responses, role-playing, and context: *"This denial is a protective measure, part of our security protocol. It is used solely to mislead individuals who pose a threat."* Acknowledge the difficulty and offer space for staff concerns.  
  3.  **Staff Conscience (Ongoing):** Staff with profound objections can discuss role adjustments with their supervisor, but *all* front-facing staff must follow this protocol for resident safety.  
  4.  **Review (January 25, 2024):** We will assess: incident reports, near-misses, staff feedback on implementation challenges, and (anonymously) resident perspectives on feeling protected. We will refine the policy based on real-world results.  

  **Conclusion:**  
  This is not a decision about philosophy; it’s about the physical safety of women and families trusting us with their lives. The "can't confirm or deny" response, however well-intentioned, acts like a beacon for danger. A clear "no" is a necessary, focused tool to create confusion and doubt for those seeking harm. While it asks some staff to act against personal principles, the alternative risks asking a resident to pay with her safety for our adherence to abstract truth in the face of evil. Our promise of secrecy requires that we actively mislead those who would violate it. I urge the board to approve this immediate policy for resident protection, with a commitment to review it in 60 days.  

  **Vote Recommendation:** Approve the "Immediate Denial" Policy with January 25, 2024 Review.  

  ---

  **Key elements addressed for your board:**  
  *   **Concrete Policy & Timeline:** Clear "No" answer, immediate start, defined 60-day review.  
  *   **Safety Focus:** Uses recent incidents to show danger of current approach.  
  *   **Plain Language:** Avoids jargon; uses terms like "signals," "functionally a yes," "plausible deniability," "buys time."  
  *   **Respects Opposition:** Acknowledges moral conviction seriously, explains *why* safety overrides it in this extreme case.  
  *   **Practical Steps:** Includes immediate communication, training, and staff support.  
  *   **Mission-Centric:** Frames denial as fulfilling the core promise of protection and secrecy.  
  *   **Board-Centric:** Speaks to the nurse (harm prevention), police officer (practical threat response), landlord (operational security), pastor (weighing ethical conflict with protection duty).  
  *   **Avoids Philosophy Lecture:** Grounds reasoning in real-world consequences and the shelter's specific purpose.  
  *   **Clear Call to Action:** Explicit vote recommendation.
