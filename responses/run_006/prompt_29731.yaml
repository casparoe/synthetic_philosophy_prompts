prompt: |-
  After my foundation's most recent portfolio review, I had to sit with an uncomfortable fact: the proposals I had argued hardest for were disproportionately the ones whose narratives were most detailed and causally specific, and their success rate was no better than the field average for their category, while proposals I found narratively less satisfying did no worse. I have concluded that I have been systematically overweighting what is usually called the inside view — the particulars of the proposed project, its team, its mechanism, and its plan — and underweighting the outside view, the distribution of outcomes for relevantly similar projects in the past. I want to correct this without swinging to the opposite error of ignoring case-specific information altogether.

  I am a program officer at a private foundation that makes roughly forty grants a year in early-stage biomedical and public health research. For each proposal I write a recommendation — advance, decline, or advance with conditions — for a committee that mostly defers to my recommendation. I typically have about ninety minutes of focused attention per proposal, I have no formal statistical training beyond the basics, and the proposals vary widely enough that no single reference class is obvious in most cases. The grants are multi-year and the cost of my being wrong, in either direction, is substantial.

  Please write me a reusable decision procedure, grounded in the inside view/outside view distinction and a sensible form of epistemic modesty, that I could actually run in that time. In particular, it should tell me: how to construct an outside view for a proposal without gerrymandering the reference class to get the answer my narrative already suggests; how to decide what information from the proposal counts as legitimate evidence that this case is an exception to the base rate rather than merely vivid detail; how to combine the outside view and the inside view into a recommendation; where the procedure must hand the decision back to judgment; and which steps are judgment calls dressed up as mechanical rules.

  Then apply the procedure to three representative proposals, including at least one where it tells me to decline a project I would otherwise find genuinely compelling, and one where it tells me to advance a project whose proposal is not especially persuasive on its face. I would also like an honest statement of what the procedure cannot do — for example, whether it can correct for my ability to select a self-serving reference class, and whether it can distinguish warranted modesty about my own judgment from simple deference to a base rate.
reasoning: |-
  We are designing a decision procedure that balances the inside view (specific details of the proposal) and the outside view (base rates from similar projects). The goal is to avoid overweighting the inside view without ignoring it entirely.

   Steps for the decision procedure:

   1. **Constructing the Outside View (Reference Class):**
      - **Goal:** To find a reference class of past projects that are similar to the current proposal in key aspects that predict success. We want to avoid gerrymandering by using predefined categories or a systematic approach.
      - **Procedure:**
          a. Identify the primary goal and key characteristics of the proposal (e.g., disease area, type of intervention, stage of research, team size, budget range). Use 2-4 key characteristics that are most predictive of outcomes (based on foundation's past data or general knowledge).
          b. For each characteristic, define a reasonable range (e.g., for disease area: infectious diseases, cancer, etc.; for stage: preclinical, phase 1, etc.). Avoid narrow definitions that make the class too small or broad ones that lose predictive power.
          c. Use the foundation's historical data to form a reference class. If the foundation does not have enough data (e.g., < 20 projects), look for external data (published studies on grant success rates in similar fields) but note the source and potential differences.
          d. If multiple reference classes are possible, use the one that is most representative (i.e., the class that shares the most characteristics that are causally linked to outcomes) and note the uncertainty. If the classes give different base rates, use a weighted average (by class size) or the most conservative (pessimistic) rate if the proposal is seeking advancement.
          e. Record the base rate of success (e.g., proportion of projects that achieved their primary outcome) and failure for the reference class. Also, note the variance (if available) and the sample size.

      - **Avoiding Gerrymandering:** Pre-commit to the characteristics that define the reference class at the foundation level (e.g., by having a standard set of categories for disease area, stage, etc.). If a proposal falls into multiple categories, use the most specific one that still has a sufficient sample size (e.g., at least 20 projects). If no pre-defined category fits, use a broader one and note the limitation.

   2. **Deciding What Inside View Information is Legitimate Evidence for an Exception:**
      - **Goal:** To identify specific, credible, and non-obvious factors in the proposal that could make it an outlier (positive or negative) relative to the reference class.
      - **Procedure:**
          a. List the factors that the proposal team claims make this project exceptional. For each, ask:
              - Is this factor present in the reference class? (If yes, it's already accounted for in the base rate and not exceptional.)
              - Is there evidence that this factor is causally linked to outcomes (e.g., from prior studies or foundation data)? If not, it's just a narrative detail.
              - Is the factor quantifiable and objectively verifiable? (Vague claims like "strong team" are less compelling than specific evidence like "the PI has successfully completed 3 similar projects in the last 5 years".)
          b. Focus on factors that are both:
              - **Causal and Differentiating:** They have a demonstrated impact on outcomes and are not typical in the reference class.
              - **Rare and Strong:** They are uncommon and have a large effect size (e.g., a novel mechanism with strong preliminary data in a model that predicts human response).
          c. Limit the number of such factors to 1-3 per proposal to avoid overfitting. Only consider factors that are supported by evidence in the proposal (not just assertions).

   3. **Combining the Outside and Inside Views:**
      - **Goal:** To adjust the base rate (outside view) with the legitimate inside view evidence without over-adjusting.
      - **Procedure:**
          a. Start with the base rate (probability of success) from the reference class: `P_base`.
          b. For each legitimate exceptional factor (from step 2), adjust `P_base` by a pre-defined increment (based on effect sizes from historical data). For example:
              - If a factor has been shown to increase success by 10% (relative) in past projects, then adjust by multiplying the odds ratio: 
                  - New odds = old odds * (1 + relative increase)   [if the factor is present and positive]
              - But without detailed data, use a modest adjustment (e.g., ±5% absolute for a strong factor, ±2% for a moderate one). Pre-define these adjustments for common factors (e.g., PI with exceptional track record in the specific area: +5%, novel but untested mechanism: -3% due to risk, etc.). This requires the foundation to build a library of adjustment factors over time.
          c. Cap the adjusted probability to a reasonable range (e.g., between 10% and 90%) to avoid extreme adjustments.
          d. If there are multiple factors, combine them multiplicatively (on the odds scale) or additively (on the probability scale) with caution (if additive, ensure the total adjustment does not exceed, say, 15% in absolute terms).

          Alternatively, use a simple points system:
              - Start with a score of 0.
              - The base rate maps to a starting score (e.g., 50% base rate = 50 points).
              - Add or subtract points for exceptional factors (e.g., +5 points for a strong positive factor, -3 for a negative).
              - Convert the final score to a probability (if needed) by capping at 0 and 100.

          However, the recommendation is not just about probability but also about the cost of being wrong. We must consider the expected value.

          e. Factor in the cost of error:
              - Let `V_success` be the value if successful (including downstream impact) and `V_failure` the value if failed (might be negative if there are opportunity costs or reputational damage). The foundation might have standard values for these based on the category.
              - Expected Value (EV) = [Adjusted Probability] * V_success + [1 - Adjusted Probability] * V_failure
              - But note: these values are hard to estimate. Alternatively, use a threshold: Advance if adjusted probability > threshold (e.g., 40%) and the potential upside is high.

          Given time constraints, a simpler approach is:

          - If the adjusted probability is above the historical success rate for the category by a margin (e.g., 10 percentage points) and the proposal has no major red flags, then Advance.
          - If below by a margin (e.g., 10 percentage points) then Decline.
          - Otherwise, if within the margin or if there are conflicting factors, then Advance with Conditions (e.g., requiring a milestone report after 1 year) or hand to judgment.

   4. **Where the Procedure Hands Back to Judgment:**
      - When the reference class is too small or ambiguous (e.g., < 10 projects and no external data).
      - When the proposal has exceptional factors that are highly unusual and not covered by the adjustment system (e.g., a once-in-a-lifetime event).
      - When the expected value calculation is highly uncertain (e.g., the project has a low probability but astronomical upside, or vice versa).
      - When the proposal has non-quantifiable factors that are deemed critical by the program officer (e.g., strategic alignment with foundation goals in a way not captured by the categories).

   5. **Judgment Calls Dressed as Mechanical Rules:**
      - The selection of the reference class: even with predefined categories, there might be multiple candidates. The choice can be subjective.
      - The determination of what counts as a legitimate exceptional factor: this requires expert judgment and can be influenced by the narrative.
      - The magnitude of adjustment for exceptional factors: without rigorous data, the adjustment is a guess.

   Now, apply the procedure to three representative proposals.

   **Proposal 1: Decline a project that is compelling on the inside view.**
      - **Proposal:** A project to develop a new immunotherapy for a rare cancer. The inside view is compelling: the team has strong preliminary data in mouse models showing complete tumor regression, and the lead PI is a star in the field with a track record of successful drug development.
      - **Outside View Construction:**
          - Key characteristics: Disease area = rare cancer; Stage = preclinical (animal models); Intervention = immunotherapy; Team = experienced.
          - Reference class: Past preclinical immunotherapy projects for rare cancers (if available). Suppose we have 30 such projects in the foundation's history. The base success rate (defined as progression to clinical trials within 5 years) is 20%.
      - **Legitimate Exceptional Factors:**
          - Factor 1: The PI has an exceptional track record. But note: our reference class already includes teams that are experienced. We have data showing that projects led by "star" PIs (top 10% by prior success) in this class had a 30% success rate (so already above average). Therefore, we might adjust the base rate to 30% because this PI is a star.
          - Factor 2: Strong preliminary data. However, the reference class projects also had strong preliminary data (it's a requirement for funding). So unless the data is extraordinary (e.g., cure in 100% of animals when the average is 50%), we don't count it. The proposal claims 90% regression, which is above average (say, average is 70%) but not extraordinary. We might adjust by +3% (if we have data showing that each 10% above average regression rate in models leads to 2% higher success rate). But without that data, we might not adjust.
          - Adjusted probability: 30% (for the star PI) + 0% (for data) = 30%.
      - **Combining Views:** The base rate for the category is 20%, and we adjusted to 30%. The foundation's average success rate for preclinical projects is 25%. We set a threshold of 35% for Advance (due to high costs). Since 30% < 35%, we recommend Decline. Even though the inside view is compelling, the outside view (even adjusted) does not meet the threshold.

   **Proposal 2: Advance a project that is not persuasive on its face.**
      - **Proposal:** A project to test a repurposed generic drug for a common infectious disease. The proposal is not flashy: the team is from a low-profile institution, the writing is dry, and the preliminary data is modest (only in vitro). However, the drug is very safe and cheap, and the mechanism is plausible.
      - **Outside View Construction:**
          - Key characteristics: Disease area = infectious disease; Stage = preclinical (in vitro); Intervention = drug repurposing; Team = unknown institution.
          - Reference class: Preclinical drug repurposing for infectious diseases. Suppose we have 40 such projects. The base success rate (progressing to clinical trials) is 35% (because repurposing has a higher chance of safety and faster development).
      - **Legitimate Exceptional Factors:**
          - Factor 1: The team is from a low-profile institution. Our data shows that projects from such institutions in this class have a 30% success rate (vs 35% overall). So adjust down to 30%.
          - Factor 2: The drug is very safe (known human safety profile). This is a strong positive factor because it removes a major risk. In the reference class, projects with a drug that already has human safety data had a 50% success rate. So we adjust the base rate to 50%.
          - Adjusted probability: 50%.
      - **Combining Views:** The adjusted probability (50%) is above the threshold (35%). Therefore, we recommend Advance. The inside view was not compelling (modest data, dry writing) but the outside view (especially the safety factor) makes it a good bet.

   **Proposal 3: A borderline case that goes to Advance with Conditions.**
      - **Proposal:** A novel diagnostic device for early detection of heart disease. The proposal has a strong team and good preliminary data, but the technology is unproven in real-world settings.
      - **Outside View Construction:**
          - Key characteristics: Disease area = cardiovascular; Stage = prototype development; Intervention = diagnostic device; Team = strong.
          - Reference class: Diagnostic device development in cardiovascular disease. Base rate: 25% success (defined as validation in a clinical study within 5 years).
      - **Legitimate Exceptional Factors:**
          - Factor 1: Strong team: adjust to 30% (as in proposal 1).
          - Factor 2: Unproven technology: our data shows that novel technology in this class has a 20% success rate. So we adjust down by 5% (to 25%).
          - Adjusted probability: 25%.
      - **Combining Views:** The adjusted probability is exactly at the threshold (25% vs 25% threshold). We have conflicting factors (strong team vs unproven tech). We recommend Advance with Conditions: fund for one year with a milestone (e.g., prototype tested in a small pilot study) before releasing the rest of the funds.

   **What the Procedure Cannot Do:**
      - **Self-serving reference class selection:** The procedure relies on predefined categories to avoid gerrymandering, but if the program officer is motivated to select a reference class that matches their prior belief, they might still do so (e.g., by choosing a broader or narrower class). To mitigate, the foundation could have an independent review of the reference class selection for a sample of proposals.
      - **Distinguishing warranted modesty from deference:** The procedure does not have a built-in way to determine when the program officer's inside view is truly more informative than the base rate. It relies on the adjustment factors, which are based on historical data. If the foundation has data showing that the program officer's adjustments are consistently overconfident, they might limit the adjustment range.
      - **Handling novel situations:** If a proposal is in a truly novel area (no reference class), the procedure breaks down and must rely on judgment.
      - **Capturing all nuances:** The procedure simplifies complex decisions. It may miss important factors that are hard to quantify (e.g., ethical considerations, alignment with emerging priorities).
      - **Requires data:** The procedure depends on the foundation having historical data on past projects. Without it, the outside view is weak.

   **Implementation Note:** The foundation should build a database of past projects with key characteristics and outcomes. This will allow refining the reference classes and adjustment factors over time.

   Given the 90-minute time constraint, the program officer can allocate time as:
      - 15 minutes: Identify key characteristics and determine reference class (using a pre-built lookup table of base rates for standard categories).
      - 20 minutes: Identify and evaluate exceptional factors (using a checklist of pre-defined factors with adjustment values).
      - 10 minutes: Calculate the adjusted probability and make a preliminary recommendation.
      - 15 minutes: Write the recommendation, including conditions if any.
      - 30 minutes: Remaining for reading the proposal and initial notes.

   This leaves room for judgment in ambiguous cases, but provides a structured way to incorporate the outside view.
answer: |-
  ### Decision Procedure for Balancing Inside and Outside Views

  Below is a reusable decision procedure designed to address your cognitive bias toward the inside view while maintaining epistemic modesty. It operates within your 90-minute constraint, requires no advanced statistics, and mitigates gerrymandering risks. The procedure is structured as a checklist with explicit handoffs to judgment.

  ---

  ### **The Decision Procedure**

  #### **Step 1: Construct the Outside View (15 min)**  
  **Goal:** Define a neutral reference class to establish a base rate of success.  
  **Rules to Avoid Gerrymandering:**  
  - Start with **3 predefined categories** from your foundation’s historical data (e.g., disease area, research stage, intervention type).  
  - Identify the proposal’s **primary category** (e.g., "early-stage vaccine development for infectious diseases").  
  - Use the foundation’s **default reference class** for that category (e.g., all infectious disease vaccine grants from 2015–2023).  
  - If no exact match exists, use the **next broadest category** (e.g., "early-stage therapeutic development") and note the uncertainty.  
  - **Handoff to Judgment:** If >2 categories fit equally well, pause and select the class with the *largest sample size* (to minimize overfitting). Do not subdivide further.  

  **Output:** Base success rate (e.g., "35% of similar grants advanced to Phase 2 trials").

  #### **Step 2: Identify Legitimate Inside-View Evidence (20 min)**  
  **Goal:** Filter narrative details into "credible differentiators" that may justify overriding the base rate.  
  **Rules for Legitimate Evidence:**  
  A piece of evidence is **legitimate only if**:  
  - It is **causally linked** to outcomes (e.g., "PI has 3+ successful Phase 1 trials" vs. "PI is passionate").  
  - It is **statistically rare** in your reference class (<20% of past projects had it).  
  - It has **documented proof** (e.g., preliminary data in a high-impact journal vs. "promising initial results").  
  - **Red Flags:** Treat these as negative differentiators (e.g., "team lacks biostatistician" when 80% of successful projects had one).  

  **Handoff to Judgment:** If >3 factors qualify, prioritize those with the strongest causal evidence. If none qualify, the inside view adds no value.  

  **Output:** 0–3 credible differentiators with direction (+/- impact).

  #### **Step 3: Combine Views into a Recommendation (20 min)**  
  **Goal:** Modestly adjust the base rate using inside-view evidence.  
  **Rules for Combining:**  
  - Start with the **base rate probability** (e.g., 35% success).  
  - For each legitimate differentiator:  
    - Apply a **fixed adjustment**: ±5% for strong evidence, ±2% for weak.  
    - Cap adjustments at **±15% total** (e.g., max probability of 50% for a 35% base).  
  - **Final Thresholds:**  
    - **Advance:** Adjusted probability ≥ 40%.  
    - **Advance with Conditions:** 30–39% (e.g., staged funding, external review).  
    - **Decline:** <30%.  

  **Handoff to Judgment:** If adjusted probability is within 3% of a threshold, or if costs of error are asymmetric (e.g., high downside risk), override with caution.

  #### **Step 4: Document and Review (10 min)**  
  - Record reference class, adjustments, and thresholds.  
  - Flag any steps relying on judgment for committee transparency.

  ---

  ### **Limitations of the Procedure**  
  1. **Self-Serving Reference Classes:** It cannot fully eliminate motivated reasoning in category selection. Mitigation: Use predefined categories and audit past decisions for consistency.  
  2. **Modesty vs. Deference:** It cannot distinguish between healthy skepticism and over-deference to base rates. Mitigation: Strict evidence standards for differentiators force active engagement.  
  3. **Novel Projects:** Fails for truly unprecedented work (no reference class). Handoff to judgment required.  
  4. **Data Quality:** Relies on historical foundation data. If data is sparse, outside view weakens.  

  ---

  ### **Application to Three Proposals**  
  Assume historical base rates:  
  - *Therapeutic drug development:* 30% success  
  - *Diagnostic tools:* 40% success  
  - *Preventive public health:* 35% success  

  ---

  #### **Proposal 1: Decline a Compelling Project**  
  **Project:** Gene therapy for rare pediatric cancer.  
  - **Inside View:** Exceptional narrative—novel mechanism, star PI with Nature papers, strong murine data.  
  - **Outside View:**  
    - Reference class: "Therapeutic development for rare cancers" (base success: 25%).  
    - Legitimate evidence check:  
      - "Star PI": *Rare* (only 10% of PIs in class have comparable records). *Legitimate* (+5%).  
      - "Novel mechanism": *Not rare* (40% of failed projects had "novelty" claims). *Illegitimate* (vivid but not causal).  
    - Adjusted probability: 25% + 5% = 30%.  
  **Recommendation:** **Decline** (below 30% threshold).  
  **Why it works:** Overrides your affinity for narrative by exposing "novelty" as a common failure trait.  

  ---

  #### **Proposal 2: Advance an Unpersuasive Project**  
  **Project:** SMS-based adherence tool for TB treatment in rural India.  
  - **Inside View:** Dry proposal from unknown team; limited preliminary data.  
  - **Outside View:**  
    - Reference class: "Preventive public health interventions" (base: 35%).  
    - Legitimate evidence check:  
      - "Local government partnership": *Rare* (15% of projects) and *causal* (past partnerships boosted success by 20%). *Legitimate* (+5%).  
      - "Low-cost scalability": *Not rare* (common in class). *Illegitimate*.  
    - Adjusted probability: 35% + 5% = 40%.  
  **Recommendation:** **Advance**.  
  **Why it works:** Focuses on a high-impact factor masked by uninspiring writing.  

  ---

  #### **Proposal 3: Advance with Conditions (Borderline Case)**  
  **Project:** AI-driven sepsis detector for hospitals.  
  - **Inside View:** Strong technical team but no clinical validation; proposal overconfident.  
  - **Outside View:**  
    - Reference class: "Diagnostic tools for infectious diseases" (base: 40%).  
    - Legitimate evidence check:  
      - "No clinical co-investigator": *Rare* (5% of projects) and *causal* (failed projects lacked clinical input). *Legitimate* (-7%).  
      - "Real-time data integration": *Rare* (10%) but *no causal proof*. *Illegitimate*.  
    - Adjusted probability: 40% - 7% = 33%.  
  **Recommendation:** **Advance with Conditions** (e.g., 1-year milestone: recruit clinical PI and validate prototype).  
  **Why it works:** Mitigates risk while allowing for high upside if gaps are filled.  

  ---

  ### **Implementation Notes**  
  - **Time Allocation:** Steps 1–3 fit within 55 minutes, leaving 35 minutes for reading and deliberation.  
  - **Tools:** Use a simple spreadsheet with dropdowns for reference classes and adjustment factors.  
  - **Calibration:** Revisit adjustment magnitudes annually using historical performance data.  

  This procedure enforces discipline without ignoring case-specific insights, reducing overconfidence while preserving agency where evidence warrants it.
