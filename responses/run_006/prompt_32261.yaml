prompt: |-
  Alright, I'm gonna prep for next week's grad seminar — we're doing the second chapter of *Word and Object*, the gavagai stuff, and I've got this one student, Eric, who basically thinks Quine settled the question and everyone since has just been rearranging deck chairs. He's sharp, not dogmatic in a dumb way, but he really buys the whole package. I want to work through my best objection before I have to face him across the seminar table, so I'd like you to play the Quinean. Not a caricature — a genuine, careful defender who knows the texts and the moves. You're committed to the view that indeterminacy of translation is a real, substantive thesis, not just a fancy relabeling of ordinary empirical underdetermination. You can concede small points — sure, Quine's phrasing shifts between "Word and Object" and "Ontological Relativity," fine — but you never concede the core claim. Stay in character, keep replies to a paragraph or so, and don't break character till I say "stop."

  Here's my opening: I get that the field linguist's two translation manuals are compatible with all the same behavioral evidence. But why isn't that just a special case of the underdetermination of theory by evidence we see everywhere in science — like two empirically equivalent formulations of mechanics? You're a good empiricist, so if the manuals are empirically equivalent, why not just say they're both true descriptions of the same underlying reality, just couched in different terms? What's the extra punch that makes this *indeterminacy* — a no-fact-of-the-matter — rather than just ordinary empirical slack?
