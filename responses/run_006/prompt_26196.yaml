prompt: |-
  I'm a clinical ethicist at a teaching hospital, I work maybe four or five consults a week — end-of-life stuff, treatment refusals, the occasional resource fight. And I keep running into the same basic problem: when am I supposed to treat someone else's moral judgment as something I should just defer to, the way I'd defer to a cardiologist about an ECG? 

  Sometimes its obvious. A patients family understands what the patient would have wanted better than I do — that seems like a straightforward case for deference. Other times it feels like moral deference is just a category mistake, like I'm outsourcing the very thing I was consulted to do. And then there's the murky middle: the attending who's been doing this for thirty years and has deeply settled views about, say, truth-telling. He's thought about it more than I have. Does that make him a moral expert I should defer to? Or is moral expertise not like that?

  I want you to write me a decision procedure I can actually use — a sequence of questions I can run at 2 AM, that ends in one of three outputs: defer, don't defer, or escalate to the full committee. I need it to distinguish at least three kinds of thing people might be offering me:
  - knowledge of values (the family knows the patient)
  - moral reasoning or argument (someone's thought harder or longer)
  - moral perception (the nurse who's been bedside sees something I'm missing)

  Then apply it to two cases. First: a family demands we keep going with aggressive treatment that the whole team agrees is futile; the family says they know the patient would want everything tried. Second: an attending with a thirty-year career tells me it is categorically wrong to conceal a terminal diagnosis even when the family, for cultural reasons, is begging us not to disclose it, and he expects me to back him.

  Flag where the procedure is most likely to give the wrong answer, and tell me what kind of case would make you substantially revise it.
reasoning: |-
  Okay, let me start by really understanding what this clinical ethicist is asking. They need a practical decision procedure for when to defer to others' moral judgments during consults. The main scenarios involve family members, experienced colleagues, and bedside staff. The key is to differentiate between three types of inputs: knowledge of values, moral reasoning, and moral perception.

  First, I need to break down the core problem. The user mentioned situations where deference feels straightforward, like family knowing the patient's wishes, versus murkier cases like an attending's long-held views. The challenge is creating a method to navigate these without outsourcing their ethical responsibility. 

  The decision tree needs clear steps. Starting with identifying the input type makes sense. For each type, specific criteria should apply. Knowledge of values requires authenticity and relevance. Moral reasoning needs expertise and defensibility. Moral perception hinges on unique access and plausibility. 

  Next, considering the user's need for escalation points. When criteria aren't met, or there's conflict, moving to the committee is necessary. But the user wants efficiency, especially at 2 AM, so the procedure must avoid unnecessary escalation. 

  Now, applying the procedure to the cases. The futile treatment case: the family claims knowledge of values. Checking authenticity—do they have consistent past directives? Relevance—is it about patient's values or their own? If doubts, like inconsistencies, escalation makes sense. 

  The terminal diagnosis case: the attending offers moral reasoning. Assessing expertise—yes, experience. But defensibility? Rigid stance might not consider context, like cultural nuances. If reasoning isn't context-sensitive, don't defer. Conflict with family values could necessitate escalation. 

  Where could this go wrong? If someone presents multiple input types simultaneously, like a nurse with both perception and reasoning. The procedure might oversimplify. Also, implicit biases could affect judgment on authenticity or plausibility. Cases with systemic issues, like cultural conflicts, might need more nuanced handling than the tree allows. 

  For revision, a case involving institutional policy versus patient values could challenge the framework. If policy contradicts patient autonomy, the procedure might not clearly guide deference. Highlighting such scenarios would prompt refining the criteria for moral reasoning, adding weight to institutional versus individual factors.
answer: |-
  Here’s a practical decision procedure for moral deference in clinical ethics consults, designed for clarity under pressure. It prioritizes **source legitimacy** and **contextual fit**, with clear off-ramps to committee escalation when uncertainty or conflict arises.

  ---

  ### **Decision Procedure: DEFER/ESCALATE**
  *(Run these questions sequentially)*

  1. **IDENTIFY THE SOURCE TYPE:**  
     ✅ *Is this primarily...*  
     - **A: Knowledge of values** (e.g., family, close friend, advance directive)? → **Go to Q2**  
     - **B: Moral reasoning/argument** (e.g., attending, ethicist, policy)? → **Go to Q3**  
     - **C: Moral perception** (e.g., nurse, social worker, bedside staff)? → **Go to Q4**  

  2. **FOR VALUE-KNOWERS (A):**  
     ✅ *Is their claim about the patient’s values...*  
     - **Plausible** (consistent with known facts, prior statements, or cultural/religious identity)?  
     - **Unconflicted** (not overridden by advance directives or clear prior wishes)?  
     - **Authentic** (not distorted by guilt, grief, or self-interest)?  
     → **YES to all? → DEFER.**  
     → **NO to any? → ESCALATE to committee.**  

  3. **FOR REASONERS (B):**  
     ✅ *Is their reasoning...*  
     - **Expertise-grounded** (in relevant clinical/ethical experience)?  
     - **Defensible** (explicitly engages principles, precedents, or policies)?  
     - **Context-sensitive** (acknowledges unique case factors)?  
     → **YES to all? → DEFER.**  
     → **NO to any? → DON’T DEFER** (engage in dialogue; if stalemate → **ESCALATE**).  

  4. **FOR PERCEIVERS (C):**  
     ✅ *Is their perception...*  
     - **Uniquely informed** (based on sustained, direct observation)?  
     - **Clinically coherent** (aligns with medical facts/team observations)?  
     - **Plausibly moral** (highlights values/harms others missed)?  
     → **YES to all? → DEFER.**  
     → **NO to any? → DON’T DEFER** (integrate insight but retain judgment).  

  ---

  ### **Application to Cases**

  **CASE 1: Family demands futile aggressive treatment**  
  - *Source Type:* **A (Knowledge of values)**.  
  - **Q2 Assessment:**  
    - Plausible? *Maybe* (if patient previously expressed "fight at all costs" views).  
    - Unconflicted? *Unlikely* (futility creates conflict with medical judgment).  
    - Authentic? *Unclear* (grief/guilt may distort "what patient would want").  
  → **Output: ESCALATE** (requires committee review to assess authenticity/conflict with futility).  
  *Why:* Futility triggers a *medical* judgment that values alone can’t override. Committee must weigh autonomy vs. non-maleficence.

  **CASE 2: Attending insists on full disclosure against family’s cultural wishes**  
  - *Source Type:* **B (Moral reasoning)**.  
  - **Q3 Assessment:**  
    - Expertise-grounded? **YES** (30-year experience).  
    - Defensible? **YES** (autonomy/truth-telling arguments).  
    - Context-sensitive? **NO** (categorical stance ignores cultural/family dynamics).  
  → **Output: DON’T DEFER** (engage attending; if unresolved → **ESCALATE**).  
  *Why:* Rigid rules fail contextual ethics. Committee can balance autonomy with cultural humility/relational harm.

  ---

  ### **Weaknesses & Revision Triggers**
  - **Where it fails:**  
    1. **"Hybrid" sources** (e.g., a nurse offering *both* moral perception *and* reasoning).  
       - *Fix:* Split input and run parallel tracks (e.g., defer to perception but not reasoning).  
    2. **Implicit bias** in assessing "plausibility" (Q2) or "clinical coherence" (Q4).  
       - *Mitigation:* Use committee review as bias-check.  
    3. **Systemic injustices** (e.g., deferring to policy that perpetuates inequity).  
       - *Flag:* If reasoning (Q3) appeals to unjust policies → **DON’T DEFER**.  

  - **Case that would force revision:**  
    A **resource allocation dispute** where:  
    - *Value-knower*: Patient’s family demands ICU transfer ("he’d want everything").  
    - *Reasoner*: Hospital policy prioritizes prognosis/age.  
    - *Perceiver*: Nurse notes unrecorded social factors (e.g., patient is sole carer).  
    → Procedure may miss **competing legitimacies**. Revision would add:  
    **Q5: Does deferring to one source exacerbate systemic inequity? → YES = ESCALATE + DON’T DEFER.**  

  ---

  ### **Key Principles Embedded**  
  - **Deference ≠ Absolution:** You defer to *inputs*, not outcomes. Your role is to validate the source’s legitimacy.  
  - **Escalation is strength:** Committee review is for structural uncertainty, not personal failure.  
  - **Moral expertise ≠ technical expertise:** Clinical experience informs but doesn’t dictate ethics; context is king.  

  This procedure draws from **fiduciary theory** (deference to values) and **pragmatic epistemology** (reasoning/perception as tools), while rejecting moral "expertise" as monolithic. Use it as a flashlight—not a compass—at 2 AM.
