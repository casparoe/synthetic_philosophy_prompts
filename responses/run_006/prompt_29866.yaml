  The procedure is designed to be skeptical of the alignment tax claim. It requires evidence for the claim and tries to break down the argument. It also forces the board to face the values trade-off only when the cost is both high and competitively significant. In many cases, the argument fails before reaching the values step.
answer: |-
  Below is a decision procedure for evaluating "alignment tax" claims in AI safety proposals. It's designed as a sequential checklist (spreadsheet-friendly) with clear stopping points, requiring evidence for each claim. The procedure treats "alignment tax" as a testable hypothesis—not a veto—and flags when a decision must be escalated to human judgment (e.g., values trade-offs). The process takes **15–20 minutes per proposal** in a board setting.

  ---

  ### **Decision Procedure: Alignment Tax Evaluation**
  **Input:** A proposal framed as having an "alignment tax" (safety measure X vs. cost/competitiveness concern Y).  
  **Output:** One of three verdicts:  
  1. **Implement X** (alignment tax claim invalid or overstated).  
  2. **Reject X** (alignment tax claim valid and prohibitive).  
  3. **Escalate to human judgment** (values trade-off required).  

  #### **Step 1: Verify Safety Benefit**  
  *Purpose: Ensure X addresses a real safety risk, not just legal/PR concerns.*  
  - **Question 1.1:** What specific harm does X mitigate? (e.g., "Reduces jailbreaks by 40%" or "Lowers misuse risk for bioweapons").  
    - *Sufficient answer:* Evidence of causality (e.g., internal tests, peer-reviewed studies, or threat models). Anecdotes are insufficient.  
  - **Question 1.2:** Is this harm alignment-relevant? (i.e., Does it involve goal misgeneralization, deception, or catastrophic misuse?)  
    - *Sufficient answer:* Yes (proceed). No (stop → **Escalate**; X is likely about compliance/PR, not alignment).  
  - **Stop if:** Harm is unsubstantiated (→ **Implement X**; tax claim is a rationalization).  

  #### **Step 2: Quantify Costs**  
  *Purpose: Test if "cost" is material or speculative.*  
  - **Question 2.1:** What are X’s direct costs? (e.g., engineering time, compute, latency, performance drop).  
    - *Sufficient answer:* Quantified metrics (e.g., "6-week delay," "$200K compute," "3% MMLU drop").  
  - **Question 2.2:** Are there indirect costs? (e.g., reputational damage, lost market share, regulatory backlash).  
    - *Sufficient answer:* Data-driven projections (e.g., "Sales drop 5% based on user surveys"). Speculative claims (e.g., "Competitors might gain share") are insufficient.  
  - **Stop if:** Costs are negligible or unproven (→ **Implement X**; tax is overstated).  

  #### **Step 3: Assess Competitiveness Impact**  
  *Purpose: Verify if the market will punish X.*  
  - **Question 3.1:** Do competitors face equivalent costs? (e.g., Do they use similar safety measures?)  
    - *Sufficient answer:* Evidence from audits, industry standards, or public disclosures (e.g., "Anthropic’s model card shows analogous evals").  
  - **Question 3.2:** Will customers actually defect? (e.g., Do users prioritize performance over safety?).  
    - *Sufficient answer:* Market research (e.g., "Enterprise clients rank safety 3rd in procurement criteria") or historical data (e.g., "Model B had 4% lower accuracy but gained users due to trust").  
  - **Stop if:**  
    - Competitors face similar costs OR customers value safety (→ **Implement X**; no unilateral tax).  
    - Costs are purely internal (e.g., engineering effort) with no market link (→ **Implement X**).  

  #### **Step 4: Evaluate Trade-offs**  
  *Purpose: Handle irreducible uncertainty or values conflicts.*  
  - **Question 4.1:** Is the safety benefit *non-quantifiable but critical*? (e.g., "X reduces existential risk likelihood").  
  - **Question 4.2:** Is the cost *strategically existential*? (e.g., "Delay causes 90% market share loss").  
  - **Stop if:**  
    - Both 4.1 and 4.2 are true (→ **Escalate to human judgment**; requires values-based decision).  
    - Only one is true (→ Use verdict from Step 3).  

  ---

  ### **Application to Proposals**
  **Key:**  
  - ✅ = Sufficient evidence/answer  
  - ❌ = Insufficient evidence/answer  
  - ⚠️ = Escalate to human judgment  

  #### **Proposal 1: Six-week external red-teaming before frontier model launch**  
  - **Step 1:**  
    - 1.1: Mitigates "jailbreaks, misuse, and unforeseen behaviors." Evidence: ✅ (Internal data shows red-teaming catches 30% of critical flaws).  
    - 1.2: Alignment-relevant? ✅ (Reduces goal misgeneralization).  
  - **Step 2:**  
    - 2.1: Direct cost: 6-week delay. ✅  
    - 2.2: Indirect cost: "Competitors launch sooner, capturing market share." ❌ (No data; only speculation).  
  - **Step 3:**  
    - 3.1: Competitors? ✅ (Anthropic/OpenAI use 4–8-week red-teaming per transparency reports).  
    - 3.2: Customer defection? ✅ (Enterprise surveys show 70% prefer delayed launch for safety).  
  - **Step 4:** Non-quantifiable benefit? ❌ (Benefit quantified in Step 1).  
  - **Verdict:** **Implement X** (Alignment tax claim invalid; competitors do it, customers value safety).  
  - **Why the board might dislike this:** Product team argued for "first-mover advantage," but evidence shows symmetric practices and market preference.  

  #### **Proposal 2: Don’t open-source weights for a toxin-capable model**  
  - **Step 1:**  
    - 1.1: Mitigates "bioterrorism misuse." Evidence: ✅ (Evaluation shows model can synthesize Novichok with 55% success).  
    - 1.2: Alignment-relevant? ✅ (Prevents malicious instrumentalization).  
  - **Step 2:**  
    - 2.1: Direct cost: None (already built).  
    - 2.2: Indirect cost: "Missed open-source community contributions; reputational hit." ❌ (No data on innovation loss; reputational risk unmeasured).  
  - **Step 3:**  
    - 3.1: Competitors? ✅ (Meta’s Llama 3 with similar capabilities isn’t open-sourced).  
    - 3.2: Customer defection? ✅ (Startups report choosing open-source for customization, but 0% cited safety as a dealbreaker).  
  - **Step 4:** Non-quantifiable benefit? ✅ (Catastrophic risk reduction can’t be fully quantified).  
    Strategic cost? ❌ (No evidence of existential market loss).  
  - **Verdict:** **Implement X** (No material costs; competitors withhold comparable models).  
  - **Why the board might dislike this:** Engineers argue for "community goodwill," but costs are unsubstantiated.  

  #### **Proposal 3: Safety fine-tuning that cuts MMLU by 3 points**  
  - **Step 1:**  
    - 1.1: Mitigates "offensive outputs and bias." Evidence: ✅ (Reduces harmful responses by 50% in evals).  
    - 1.2: Alignment-relevant? ✅ (Improves harmlessness alignment).  
  - **Step 2:**  
    - 2.1: Direct cost: 3-point MMLU drop. ✅  
    - 2.2: Indirect cost: "Clients choose competitors with higher scores." ✅ (Sales data: 5% loss when benchmarks dip >2 points).  
  - **Step 3:**  
    - 3.1: Competitors? ❌ (No data on whether rivals sacrifice performance for safety).  
    - 3.2: Customer defection? ✅ (MMLU is top-3 procurement factor for 80% of enterprise clients).  
  - **Step 4:** Non-quantifiable benefit? ✅ (Safety gains involve hard-to-measure social harms).  
    Strategic cost? ✅ (5% revenue loss threatens viability).  
  - **Verdict:** **Escalate to human judgment** (Trade-off between quantifiable revenue risk and non-quantifiable safety benefit).  
  - **Why the board might dislike this:** Engineers want a clear answer, but the procedure forces a values debate: "Is avoiding potential harm worth 5% revenue?"  

  ---

  ### **Procedure Summary**  
  - **Strengths:** Forces evidence for "tax" claims, handles hard-to-quantify safety, and resists rationalizations. Ends with clear escalation points.  
  - **Limitations:**  
    - Human judgment required for values trade-offs (e.g., revenue vs. catastrophic risk).  
    - Relies on data quality (garbage in, garbage out).  
  - **Practical Use:**  
    - Board members complete Steps 1–3 before meetings; debate occurs at Step 4 escalations.  
    - Engineers get a spreadsheet: Each step is a column; cells require evidence links.  
    - Average time per proposal: 15 mins (data prep) + 5 mins (discussion).  

  This procedure treats "alignment tax" as a testable hypothesis—not a trump card—and exposes when objections are rooted in values or strategic preferences rather than evidence.
