prompt: |-
  I am a novelist at work on a book set in a society rather like our own, and I have discovered that I cannot write convincingly about what my characters find corrupting, or merely transactional, or perfectly natural, until I have some clarity about my own moral geography on these questions. So I have been inventorying my reactions to a range of exchanges—some legal, some criminal, some merely distasteful—and I find I cannot state the principle I am applying, if indeed there is a single one. 

  Here are my verdicts, as honestly as I can give them.

  - A healthy adult selling a kidney to a stranger for $35,000: I find this repugnant. It is not merely that it is illegal; it strikes me as a kind of category mistake, as though the body is not the sort of thing one puts a price on. I feel this even when I imagine the sale being safe, informed, and genuinely voluntary.

  - A person on an overbooked flight paying a fellow passenger $300 to surrender their seat: I find this entirely unobjectionable. It is a mutually beneficial exchange of a place in a queue for money, and no one is worse off.

  - A vendor after a hurricane selling bottled water for $40 a case when the usual price is $6: I find this predatory. Even if the high price draws fresh supply to the stricken area—which I know it might—I cannot shake the sense that exploiting someone's desperation for profit is wrong in a way ordinary markups are not.

  - A couple paying a surrogate to carry a pregnancy, covering medical costs plus a $30,000 fee: I am tentatively comfortable with this, though I want to add conditions—informed consent, fair compensation, protection against exploitation. The unease I feel is real, but it does not rise to an objection, and it feels categorically different from my reaction to the kidney sale.

  - Someone offering $500 for another person's vote in a national election: I find this profoundly objectionable, far out of proportion to the sum involved. It feels like a corruption not just of the election but of citizenship itself—as though a vote is the kind of thing that is degraded by being bought and sold, regardless of consent.

  - A theme park that sells a "fast pass" allowing purchasers to skip the regular queue: I dislike this. It feels as though the wealthy are buying their way out of a shared inconvenience, and it makes the experience slightly worse for everyone else. But I would not make it illegal, and I am not sure my objection is a moral one rather than an aesthetic one.

  - A parent paying a university admissions consultant $20,000 to help craft essays and polish a résumé: I am uneasy but do not think this should be prohibited. The line between this and ordinary tutoring or test preparation is hard to draw, and I suspect my unease is about inequality in background opportunities, not about the transaction itself.

  - A parent bribing a university athletics official $500,000 to have their child designated as a recruited athlete: I find this straightforwardly corrupt and properly criminal. It is fraud on the institution and a theft of an opportunity from a more deserving applicant. No ambivalence.

  - A healthy adult selling blood plasma twice a week for $50 per session: I find this acceptable. It does not trigger the revulsion I feel about kidney sales, even though both involve removing something from the body for payment. The difference in my reaction is stark, and I do not know what to make of it.

  - A firm that buys life insurance policies from elderly policyholders, paying a lump sum now in exchange for the death benefit later: I am unsettled by this in a way that feels almost superstitious. It is legal, and the policyholder consents, but there is something ghoulish about a stranger holding a financial interest in another person's death. I cannot decide whether this is a real moral problem or merely an ick reaction.

  I keep returning to a case that does not appear on this list, and I suspect it will be central to the novel. A person under severe financial pressure sells to a corporation the right to name their firstborn child—something like "Pepsi Cohen" or "Tesla Williams"—in exchange for a substantial payment that would transform the family's circumstances. My gut says this is wrong, but I cannot tell whether the wrongness is different in kind from what happens in the surrogacy case, where money and the creation of a child are already entangled, or whether I am merely reacting to the case's unfamiliarity. 

  Can you identify the principle, or the small set of competing principles, that best captures the pattern of my verdicts? For each candidate, I would like to know which of my verdicts it forces me to revise, what it says about the naming-rights case, and what further case—one I have not listed—would most sharply distinguish the candidates. If my verdicts genuinely underdetermine the principle, I would rather know that than be given a false resolution.
reasoning: |-
  Okay, this novelist is grappling with some deep ethical questions to build a believable fictional society. They've listed various transactions and their gut reactions to each—some repugnant, some acceptable, others unsettling. Their core challenge is uncovering the hidden moral framework behind these judgments, especially since they sense inconsistency. The kidney sale feels vile but blood plasma sales don't; hurricane price gouging seems predatory while flight seat swaps feel harmless. 

  What stands out immediately is how viscerally certain examples provoke them—the vote sale "corrupts citizenship," the college bribery feels like "theft," and that naming-rights scenario with "Pepsi Cohen" clearly haunts their creative process. The discomfort around surrogacy versus the flat rejection of organ sales suggests a tension between commodification concerns and autonomy. 

  Hmm, they're hinting at three possible principles without naming them: one about degrading sacred things (votes, bodies), another about exploiting desperation (hurricane water), and a third about fairness distortions (fast passes, college bribes). But none perfectly captures all their reactions—like why plasma sales get a pass but kidneys don't. 

  The surrogate example is particularly thorny. They accept it with conditions, yet feel uneasy, while the kidney sale repulses them unconditionally. Is it about physical harm? Permanence? Or some symbolic weight? And that naming-rights case... it's testing whether attaching a brand to a human identity crosses a line even surrogacy doesn't. 

  I suspect their moral map has overlapping fault lines: things that feel inherently degrading versus transactions that tilt power dynamics unjustly. For instance, the vote sale isn't just unfair—it treats democracy as a marketplace. Similarly, "Pepsi Cohen" might feel like turning a person into a billboard from birth, which could violate dignity differently than carrying a child for others. 

  The life insurance case is fascinating—they call their own reaction "almost superstitious." That suggests a taboo dimension beyond rational ethics. Writers often sense these visceral boundaries before articulating them; that's likely why their novel needs this exploration. 

  To pressure-test their framework, I'd propose adding cases like: paying someone to take a dangerous job (accepted?), buying a friend's silence (unsettling?), or auctioning charity benefits to the highest bidder (fair or foul?). Each would strain different principles—harm, relational integrity, equality—and might reveal which one they truly weight heaviest.
answer: |-
  Your verdicts reveal a sophisticated moral landscape shaped by **three competing principles**, each capturing different facets of your intuitions. None cleanly dominates the others, creating the tensions you feel. Here’s the breakdown:

  ---

  ### **The Three Principles**
  1. **The Sanctity Principle**:  
     Certain things are inherently non-commodifiable because their sale degrades human dignity, social bonds, or fundamental values. Transactions involving them feel like "category errors."  
     *Key triggers*: Body parts, votes, symbolic human identity (e.g., naming rights), death.  

  2. **The Exploitation/Vulnerability Principle**:  
     Transactions are wrong when they exploit acute vulnerability (desperation, imbalance of power, or impaired consent), even if voluntary.  
     *Key triggers*: Disaster price gouging, extreme financial coercion.  

  3. **The Fairness/Equality Principle**:  
     Transactions are wrong when they undermine equal access to public goods, opportunities, or shared experiences, creating corrosive hierarchies.  
     *Key triggers*: Queue-skipping, admissions fraud, unequal access to education.  

  ---

  ### **How Your Verdicts Map to the Principles**
  | Your Case                          | Sanctity Principle | Exploitation Principle | Fairness Principle | Your Verdict       |
  |------------------------------------|--------------------|------------------------|--------------------|--------------------|
  | Kidney sale                        | ✔️ (body as sacred) | ✔️ (irreversible risk?) | ✘                  | Repugnant          |
  | Flight seat swap                   | ✘                  | ✘                      | ✘                  | Unobjectionable    |
  | Hurricane water pricing            | ✘                  | ✔️ (desperation)        | ✘                  | Predatory          |
  | Surrogacy                          | ⚠️ (mild unease)   | ⚠️ (requires safeguards)| ✘                  | Tentatively OK     |
  | Vote selling                       | ✔️ (citizenship)   | ⚠️ (coercion possible) | ✔️ (distorts democracy)| Profoundly wrong   |
  | Theme park fast pass               | ✘                  | ✘                      | ✔️ (erodes shared experience) | Dislike (aesthetic?) |
  | Admissions consulting              | ✘                  | ✘                      | ⚠️ (exacerbates inequality) | Uneasy but acceptable |
  | Admissions bribe                   | ✘                  | ⚠️ (power imbalance)   | ✔️ (theft of opportunity) | Corrupt            |
  | Blood plasma sale                  | ✘ (renewable)      | ⚠️ (minor vulnerability)| ✘                  | Acceptable         |
  | Life insurance buyout              | ✔️ (death as sacred)| ⚠️ (elder vulnerability)| ✘                  | Unsettled ("ick")  |
  | **Child naming rights**            | **✔️ (identity)**  | **✔️ (financial desperation)** | ✘                  | **Gut: Wrong**     |

  ---

  ### **Where Principles Clash & Force Revisions**
  - **Surrogacy vs. Kidney Sale**:  
    The Sanctity Principle forces you to condemn surrogacy (it commodifies reproduction/body), but you tentatively accept it. *Resolution*: You likely see surrogacy as a *collaborative act* (creating life) rather than pure commodification, distinguishing it from kidney sales.  
    *Revision*: Sanctity alone can’t explain this—you’re weighting Exploitation safeguards higher here.  

  - **Blood Plasma vs. Kidney**:  
    Sanctity should reject both, but you accept plasma. *Resolution*: Renewability and lower risk reduce the "sacredness" violation. Exploitation is mitigated by trivial harm.  

  - **Admissions Consulting vs. Bribe**:  
    Fairness condemns both (both advantage the rich), but you accept consulting. *Resolution*: Consulting "plays the game" within rules; bribes are fraud. Fairness concerns yield to procedural legitimacy.  

  - **Hurricane Water vs. Flight Seat**:  
    Both involve scarcity, but Exploitation applies only to water due to desperation. Flight swaps lack vulnerability.  

  - **Life Insurance Buyout**:  
    Sanctity flags death’s sacredness; Exploitation flags elder vulnerability. Your "ick" suggests Sanctity dominates here.  

  ---

  ### **The Naming-Rights Case ("Pepsi Cohen")**
  - **Sanctity Principle**: Strongly condemns this. A child’s name is core to identity—selling it commodifies personhood, akin to selling a vote or kidney. It turns a human into a branded object.  
  - **Exploitation Principle**: Condemns it if driven by desperation (e.g., poverty), but might allow it if truly voluntary (e.g., eccentric artist).  
  - **Fairness Principle**: No direct issue (no public good undermined).  
    *Your gut reaction aligns with Sanctity*: This feels like a deeper violation than surrogacy because it attaches market value to human identity *at its inception*. Surrogacy involves a service (pregnancy); naming makes identity the product.  

  ---

  ### **Critical Test Case to Distinguish Principles**
  **Selling a Military Draft Exemption**  
  - *Scenario*: A wealthy citizen pays a poor citizen $1M to take their place in a mandatory military draft. Both consent; the poor person uses the money to secure their family’s future.  
  - **Sanctity**: Condemns. Civic duty is non-tradable (like voting). Degrades shared sacrifice.  
  - **Exploitation**: Condemns. Preys on economic vulnerability to transfer lethal risk.  
  - **Fairness**: Condemns. Lets wealth evade a burden all must share.  
  - *Why it clarifies*:  
    - If you condemn this (likely), **Sanctity** and **Fairness** align.  
    - If you focus on consent/benefit, **Exploitation** might allow it if safeguards exist.  
    - This case merges all three principles—revealing which you prioritize when they converge.  

  ---

  ### **Conclusion: An Underdetermined Compass**
  Your moral intuitions are **genuinely underdetermined** by a single principle. Instead, you navigate a matrix:  
  1. **Sanctity** for body, democracy, identity, and death.  
  2. **Exploitation** for transactions involving desperation or vulnerability.  
  3. **Fairness** for access to public goods/opportunities.  

  **For your novel**: The naming-rights case fails the Sanctity test most acutely. It mirrors vote-selling—both reduce intrinsic human attributes (identity/civic voice) to market terms. The "wrongness" stems from converting personhood into a cipher for corporate interests, regardless of consent. This could be the core tension in your society: *What happens when identity itself becomes a commodity?*  

  This framework doesn’t erase your ambivalence—it mirrors the real-world friction between autonomy, dignity, and justice. That’s fertile ground for fiction.
