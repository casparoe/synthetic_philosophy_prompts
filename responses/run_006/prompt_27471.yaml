prompt: |-
  I'm a retired chemist who's been reading moral philosophy for a couple years, and there's a pattern I keep noticing that I don't have a word for. It goes like this. A friend of mine cheats on his taxes, then turns around and blames his brother-in-law for doing the same thing. Everything he says about the brother-in-law is true — it really was wrong, the guy really did it — and yet something feels off. Not off in the sense that the criticism is false, because it isn't. It's more that my friend seems to lack the... I don't know, the place? the authority? the right? to be the one saying it. Another instance: a colleague who never does his share of lab chores criticizes a new postdoc for not doing hers. Again the content is right, but I want to say he's in no position to make the complaint. I've seen the terms 'tu quoque' and 'ad hominem' used for this kind of situation, but those seem to be about deflecting an argument by pointing at the speaker; here the argument is fine and the speaker is the problem.

  I don't just want a label. I want to know whether there's an established concept for the thing you lose when your own hands are dirty, how it differs from plain hypocrisy as a character flaw and from tu quoque, and where its edges are. Does the defect attach to the blame itself, or only to the act of voicing it? Does it apply to all moral criticism or only to blame? Do you lose it forever, or can you get it back by confessing? You're a professional philosopher working on moral responsibility and the ethics of blame. Please think carefully, and if it helps, start by brainstorming the nearest concepts before you settle on an answer.
reasoning: |-
  Okay, let me start by really understanding what this retired chemist is asking. They've noticed a pattern where someone criticizes another for a wrongdoing they themselves are guilty of. The criticism is factually correct, but it feels off because the critic lacks the standing to make that judgment. They mentioned examples like a friend cheating on taxes but blaming his brother-in-law for the same, and a colleague skipping lab chores but criticizing a new postdoc for the same. 

  First, I need to recall relevant philosophical concepts. Hypocrisy comes to mind immediately. But the user is clear that they're not just talking about hypocrisy as a character flaw. They want to know why the criticism seems invalid even when true. So hypocrisy is part of it, but there's more. Then there's tu quoque, which is a fallacy where you dismiss an argument because the speaker is hypocritical. But here, the user says the argument isn't being dismissed; it's valid, but the speaker shouldn't be the one saying it. So tu quoque isn't the right fit.

  Hmm, what about moral standing or standing to blame? That's a concept in moral philosophy. Philosophers like Scanlon and Wallace discuss this. The idea is that to have the right to blame someone, your own actions must align with the norm you're enforcing. If you've violated that same norm, you lose the standing to blame others for it. That seems to fit the examples. For instance, the tax-cheating friend can't credibly blame his brother-in-law because his own actions undermine his authority.

  But then, how is this different from hypocrisy? Hypocrisy is the act of holding others to standards you don't follow. Standing to blame is about the legitimacy of issuing blame. So hypocrisy might lead to lacking standing, but standing is about the right to blame, not just the inconsistency. The user’s question about whether the defect is in the blame itself or the act of voicing it—here, it's about voicing. The blame isn't factually wrong, but the person voicing it lacks authority.

  Next, the user asks if this applies only to blame or all moral criticism. Probably blame specifically, because criticism might be more general. Like, pointing out a mistake without blaming might not require the same standing. Also, can you regain standing? The answer seems yes, through apology, making amends, or changing behavior. That's important because it shows standing isn't lost forever.

  Also, the edges: what if the person’s past wrongdoing is unrelated? For example, if someone cheated on taxes but criticizes a theft. The norms are different, so standing might still hold. But if the norms are connected, like both involve dishonesty, it might affect standing. The context matters too—public vs. private criticism, the relationship between the people involved.

  The user is a chemist turned philosophy reader, so they want precise terminology and distinctions. Terms like "moral standing" or "standing to blame" would be key. Also, explaining the difference from hypocrisy and tu quoque clearly. They’re looking for depth, so referencing philosophers like Scanlon or Wallace adds credibility. They also want practical aspects: how standing is lost and regained, which shows the concept's applicability beyond theory.

  I should also consider potential counterarguments. For example, if the hypocrite’s blame leads to positive outcomes, does that restore standing? But usually, standing is about the blamer's relationship to the norm, not consequences. However, utilitarian perspectives might differ. But the main consensus in deontological ethics is on the blamer's own adherence.

  Lastly, ensuring the explanation connects the examples to the theory. The tax cheat and lazy colleague both violate the same norms they enforce, so they lack standing. Confessing or making amends could restore it by realigning their actions with the norms. This addresses the user's query about regaining standing.
answer: |-
  What you're describing is a profound and well-established concept in moral philosophy: **moral standing to blame** (or sometimes "standing to resent" or "normative authority"). It's distinct from hypocrisy as a character flaw and from *tu quoque* fallacies, though closely related. Let me unpack this systematically, drawing on work by philosophers like T.M. Scanlon, R. Jay Wallace, Gary Watson, and Macalester Bell.

  ### Core Concept: Moral Standing to Blame
  - **Definition**: Moral standing is the *right or authority* to hold another person accountable for a moral wrong through blame, resentment, or censure. When you commit the same wrong you're criticizing (without adequate acknowledgment/amends), you lose this standing—even if your factual claim about the other person's wrongdoing is 100% correct.
  - **Why it feels "off"**: Blame isn't just a factual assertion; it's a *relational practice* that presupposes the blamer's own adherence to the norm they're invoking. If your actions show you don't truly endorse the norm (e.g., you violate it casually), your blame lacks moral credibility. It becomes a performative contradiction.

  ### Key Distinctions
  1.  **Vs. Hypocrisy (Character Flaw)**:
      - Hypocrisy is a *personal vice*—a pattern of holding others to standards you don't follow. It's about character consistency.
      - **Lacking standing** is a *relational defect in the act of blaming*. You can be hypocritical *without* blaming others (e.g., quietly cheating taxes while ignoring others' cheating). Conversely, you can lack standing *because* of hypocrisy, but the focus is on the invalid *act* of blaming, not the trait.
      - **Analogy**: Hypocrisy is like having a contaminated lab; lacking standing is like being disqualified from running a purity test *on others* because your own lab is contaminated.

  2.  **Vs. *Tu Quoque* (Logical Fallacy)**:
      - *Tu quoque* (Latin: "you too") is a fallacy that *invalidates an argument* by pointing to the speaker's hypocrisy (e.g., "You say theft is wrong, but you stole once, so your claim is false").
      - **Lacking standing doesn't challenge the truth of the claim**. Your friend *is* right about his brother-in-law's tax fraud. The issue is whether *he* gets to be the one to voice the blame. It's about *who speaks*, not *what is said*.
      - **Key difference**: *Tu quoque* deflects criticism; lacking standing questions the blamer's legitimacy *without* excusing the wrongdoer.

  ### Why Standing Matters: The Structure of Moral Communities
  - Blame functions within a network of reciprocal accountability. To blame credibly, you must implicitly position yourself as a member "in good standing" of the moral community governed by the norm. By violating the norm *and failing to address it*, you temporarily exclude yourself from that specific sphere of accountability (Scanlon, *Moral Dimensions*).
  - **Example**: Your lab colleague shirking chores undermines the very cooperative practice he invokes. His blame isn't just annoying; it *corrodes trust* in the system of mutual lab responsibilities.

  ### Edges and Nuances
  1.  **Does the defect attach to the blame or the act of voicing it?**
      - Primarily to the *act of voicing blame*. The moral truth ("this action is wrong") remains intact. But *issuing blame* without standing can compound the wrong—it adds insult or unfairness (Watson, "The Trouble with Psychopaths").

  2.  **Does it apply to all moral criticism or only blame?**
      - **Blame/Resentment**: Strongly applies. These are inherently relational and punitive.
      - **Neutral Criticism/Correction**: Less clear. If you say, "Your procedure is unsafe" (factual, non-punitive), your own safety record *might* not destroy standing—unless trust is shattered (e.g., "Why should we listen to *you*?").
      - **Moral Disagreement**: Unaffected. You can still argue an act is wrong, but *demanding accountability* requires standing.

  3.  **Can standing be lost for unrelated wrongs?**
      - Generally **no**. Standing is *norm-specific*. A tax cheat lacks standing to blame tax fraud but may retain standing to blame, say, cruelty to animals (unless the wrongs share a root norm, like dishonesty, and context erodes trust).

  4.  **Can standing be regained?**
      - **Yes, absolutely**. This is crucial. Standing is not lost "forever." Restoration typically requires:
      - **Acknowledgment**: Admitting your own wrong ("I cheated too").
      - **Amends**: Making reparations (paying back taxes, apologizing to the lab).
      - **Reform**: Demonstrating change (consistently doing chores, transparent finances).
      - *Without this*, blame remains illegitimate—even decades later (Bell, "The Standing to Blame").

  5.  **What about "lesser" hypocrisy?**
      - Standing isn't binary. A recovering alcoholic who relapsed *yesterday* lacks standing to blame drinking; one sober for 10 years likely regains it. Context matters: a private gripe vs. public shaming also affects perceived legitimacy.

  ### Why This Resonates with Scientific Thinking
  As a chemist, you recognize that a reagent's purity affects experimental validity. Similarly, moral standing is about the "purity" of the blamer's relationship to the norm. Contamination (unaddressed violation) invalidates the "reaction" of blame, even if the "substrate" (the act blamed) is impure. The system's integrity depends on clean conditions.

  ### In Summary
  - **The concept**: Moral standing to blame.
  - **What's lost**: The normative authority to hold others accountable for a specific wrong.
  - **Why**: Blame presupposes shared commitment to a norm; violating it *without redress* severs that commitment.
  - **Not**: A character judgment (hypocrisy) or a logical error (*tu quoque*).
  - **Regained through**: Accountability for one's own wrong (confession, amends, reform).

  This framework explains why your friend's accurate criticism of his brother-in-law feels hollow—his unacknowledged guilt voids his moral license to blame. The brother-in-law is still wrong, but your friend has forfeited his role as enforcer. Philosophy offers not just a label, but a lens to see why moral communities demand clean hands.
