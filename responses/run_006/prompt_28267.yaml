prompt: |-
  I direct the grants program at a private foundation that funds work aimed at reducing large-scale catastrophic risks and improving the long-term future. Every quarter we receive a handful of proposals whose case is an expected-value argument of a distinctive shape: the proponents assign a very small probability to an enormous benefit — a one-in-a-million chance of averting a global catastrophe, a one-in-a-billion chance of unlocking a technology that would transform the economy — and then argue that the product of probability and benefit is so large that the expected value of funding dwarfs that of our ordinary grants. My program officers have to triage these proposals before they reach the board. They are not decision theorists; each initial screen gets about two hours; we cannot settle the underlying empirical claims at our level; and the board must sign off on every seven-figure grant. I want a decision procedure, grounded in the decision-theoretic problem known as Pascal's mugging and in what is known about the limits of expected-value reasoning under tiny probabilities of unbounded payoffs — including uncertainty about the probability estimate itself, the role of bounded utility, and the difference between a well-defined expected value and one dominated by an unverifiable tail — that a nonspecialist program officer can actually run. The procedure should say which questions to ask and in what order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the remaining question is one of values or of unresolved empirical judgment rather than procedure. It should distinguish, in operational terms, between an expected-value argument that deserves to move us and one that is a Pascal's mugging, and it should be honest about where that distinction cannot be drawn cleanly. Please write it as a checklist or a flow of questions that a person can execute in two hours, flag the steps where judgment cannot be eliminated, and say how the procedure could misfire. Then apply it to three proposals: (a) a research program claiming a one-in-a-million chance of preventing an AI-related global catastrophe within fifty years; (b) a proposal to fund a speculative physics experiment claiming a one-in-a-billion chance of enabling cheap, unlimited clean energy; and (c) a proposal to fund a well-studied public health intervention with a modest, reliably estimated benefit that is, on any ordinary calculation, less cost-effective than our usual grants. Include at least one case in which your procedure gives an answer I will not like, and state explicitly what the procedure cannot do.
reasoning: |-
  We are designing a decision procedure for program officers to evaluate proposals that use extreme expected-value arguments (very small probabilities of enormous benefits). The procedure must account for Pascal's mugging concerns and be executable in about two hours by non-specialists. It should include steps to assess the reasonableness of the probability estimate, the magnitude of the benefit, the utility function (whether bounded or not), and the tail risks. We must also flag where judgment is required.

  The procedure will be structured as a checklist or flow of questions. We will stop the proposal at any step that fails and only pass it to the board if it survives all checks. Steps that require judgment will be explicitly noted.

  **Key Principles from Decision Theory:**
  1. **Pascal's Mugging:** When an agent is faced with a tiny probability of an enormous payoff, the expected value can be made arbitrarily large by increasing the claimed payoff, even if the probability is extremely small. This can lead to being "mugged" by any proposer who makes such claims. Rational agents should be wary of such arguments when the probability estimates are speculative and unverifiable.

  2. **Bounded Utility:** Most decision theorists argue that utility functions should be bounded (e.g., by the maximum conceivable value) to avoid infinite expectations. If utility is bounded, then even the largest possible benefit cannot exceed that bound, so the expected value of an extremely unlikely event is limited.

  3. **Uncertainty in Probability Estimates:** The uncertainty around the probability estimate itself may be so large that the expected value calculation becomes dominated by the tail of the distribution (i.e., the uncertainty about the probability is more important than the point estimate).

  4. **Distinction between Well-Defined and Tail-Dominated Expectations:** A well-defined expected value has a reasonably constrained probability distribution. If the expected value is dominated by an unverifiable tail (i.e., the bulk of the expected value comes from scenarios that are not only extremely unlikely but also extremely poorly understood), then we should be skeptical.

  **The Decision Procedure:**

  We break the evaluation into three phases:

  **Phase 1: Initial Triage (Quick Rejection Criteria)**
    1. **Is the claimed probability of success (p) less than 10^-9?** 
       - *Reason:* Probabilities below this threshold are extremely hard to verify and often subject to massive uncertainty. We set a threshold to avoid spending time on proposals that are too speculative.
       - *Action:* If yes, reject. (Note: This threshold is arbitrary but set to avoid the most extreme cases. Adjust as needed for the foundation's risk tolerance.)

    2. **Is the claimed benefit (B) finite and bounded?** 
       - *Reason:* If the benefit is claimed to be infinite (e.g., saving an infinite number of lives in an infinite universe), then we must consider bounded utility. We assume a bounded utility function (with a bound, say, U_max). The maximum benefit we can assign is U_max. However, we do not require the proposer to know U_max, but we do require that the benefit is finite and not infinite in a way that would make expected value infinite regardless of probability.
       - *Action:* If the benefit is claimed to be infinite (or unbounded) and the proposer does not provide a finite upper bound, reject. (Note: We can set a bound for the foundation. For example, the foundation may cap the maximum benefit at the value of saving all human lives on Earth, or even the entire future light cone. But we don't have to resolve that here. We just require that the proposer provides a finite estimate of the benefit.)

    3. **Is the expected value (EV = p * B) less than the cost of the grant?** 
       - *Reason:* If even by the proposer's own numbers the expected value is less than the cost, then the grant is not justified by their argument.
       - *Action:* If EV < cost, reject.

  **Phase 2: Plausibility Checks (Requiring More Investigation)**
    4. **Can the probability estimate (p) be justified by empirical evidence or a well-established model?**
       - *Reason:* We must avoid being moved by arbitrary numbers. The proposer should provide a chain of reasoning or evidence that supports the probability estimate. We are not asking for certainty, but for a plausible case that the probability is at least in the ballpark of the claimed value.
       - *Action:* 
          - Ask: "What is the basis for the probability estimate? Is it derived from data, models, expert surveys, or analogies? How robust is this estimate to uncertainty?"
          - If the proposer cannot provide any evidence or reasoned argument (beyond a back-of-the-envelope calculation with arbitrary constants), reject.
          - If the estimate is based on a model, ask: "Has the model been validated? How sensitive is the estimate to model assumptions? What are the main sources of uncertainty?"
          - *Judgment required:* The program officer must judge whether the justification is minimally plausible. If the probability estimate is pulled out of thin air, reject.

    5. **Is the uncertainty around the probability estimate so large that the expected value is dominated by the tail?**
       - *Reason:* Even if the point estimate of p is very small, if the uncertainty distribution of p has a heavy tail (e.g., a fat-tailed distribution where there is a non-negligible chance that p is much larger than the point estimate), then the expected value might be driven by that tail. However, if the uncertainty is so large that we cannot bound the tail, then we are effectively in the dark.
       - *Action:*
          - Ask: "What is the uncertainty distribution of the probability estimate? Can we put a 95% upper bound on p (i.e., a value such that there is only a 5% chance that p is above it)?"
          - If the proposer cannot provide any bounds on the uncertainty (or if the upper bound is extremely high), then we must worry that the expected value is dominated by an unverifiable tail. In that case, reject.
          - *Judgment required:* The program officer must judge whether the uncertainty bounds provided are reasonable. If the upper bound is so high that it would make the expected value astronomical even if we use the upper bound (which might then lead to other projects being dominated), then we might reject because of the tail risk.

    6. **Does the benefit (B) have a well-defined, finite upper bound that is not subject to runaway scenarios?**
       - *Reason:* We want to avoid benefits that are arbitrarily large without justification. For example, if the benefit is claimed to be the value of all future human lives, we can use a standard estimate (e.g., the present value of the future of humanity, which might be 10^16 lives or 10^40 utils, but note that bounded utility would cap that). However, if the benefit is based on a chain of events that could lead to an unbounded number of new universes, that might be too speculative.
       - *Action:*
          - Ask: "What is the maximum possible benefit? How is it bounded? Can we break down the benefit into a chain of events and assign probabilities to each step? Is there any step that could lead to an unbounded benefit?"
          - If the benefit is not bounded in a way that the foundation accepts (e.g., if it relies on multiverse scenarios or infinite expansion), then reject.
          - *Judgment required:* The foundation must have a policy on the maximum bound for benefits. For example, the foundation might cap the benefit at the value of the future of Earth-originating civilization (which is finite). The program officer must check that the benefit does not exceed that bound.

  **Phase 3: Comparative Assessment**
    7. **Is the expected value per dollar (EV / cost) at least 10 times higher than that of our typical grants?**
       - *Reason:* Because of the high uncertainty and the risk of Pascal's mugging, we require a substantial premium for these proposals. We set a bar that is higher than our typical grants to compensate for the risk of error in the probability estimate and the tail risks.
       - *Action:* Calculate EV / cost and compare to the average for our grants. If it is not at least 10 times higher, reject.

    8. **Is there any reason to believe that the probability or benefit estimates are biased?**
       - *Reason:* Proposers may be overly optimistic. We look for signs of bias: lack of peer review, history of failed similar proposals, conflicts of interest, etc.
       - *Action:* 
          - Check: Has the proposal been peer-reviewed? Are there independent experts who support the probability and benefit estimates? Does the proposer have a track record? Are they known for making similar claims in the past without results?
          - If there is evidence of bias, reject.
          - *Judgment required:* The program officer must use their judgment on the credibility of the proposer.

    9. **Is there a clear mechanism by which the grant will achieve the claimed outcome?**
       - *Reason:* The grant should be causally linked to the outcome. If the project is one step in a long chain, then we must consider the probability of the entire chain.
       - *Action:*
          - Ask: "How exactly will the grant lead to the outcome? What are the necessary intermediate steps? What is the probability of success at each step? Is the overall probability the product of these steps?"
          - If the mechanism is too vague or the chain of events too long, reject.

  **If the proposal passes all the above steps, then it can be sent to the board with a recommendation. The program officer must document the answers to the above questions.**

  **Where the Procedure Could Misfire:**
  - **False Negatives:** We might reject a truly valuable proposal because we set the probability threshold too high (step 1) or because we required too high a premium (step 7). Also, if we are too skeptical about the probability justification (step 4) we might miss a genuine opportunity.
  - **False Positives:** A clever proposer might game the system by providing a plausible-sounding justification for the probability (step 4) and a bounded benefit (step 6) that passes the other checks, but still be a Pascal's mugging.

  **Explicit Limitations:**
  - The procedure cannot resolve deep empirical uncertainties (e.g., the true probability of an AI catastrophe).
  - The procedure relies on the foundation having a bounded utility function. If the foundation does not bound utility, then the procedure might reject too many proposals (step 2) or accept ones that are too speculative (step 6).
  - The procedure requires judgment at several steps, so it is not purely mechanical.

  **Application to the Three Proposals:**

  **(a) Research program claiming a one-in-a-million chance of preventing an AI-related global catastrophe within fifty years.**

  1. p = 10^-6 (greater than 10^-9) -> pass.
  2. Benefit: Preventing a global catastrophe. We assume the foundation has a finite bound for this (e.g., the value of saving humanity). Let B be that bound. -> pass.
  3. Expected value: p*B. We assume B is very large (e.g., 10^13 lives saved, each valued at $X, so B might be $Y, a huge number). If p*B > cost (which is in the millions), then pass. (We'll assume it does.)

  4. **Plausibility of p:** The program officer must ask: How was the one-in-a-million estimate derived? Is it based on expert surveys, models of AI development, or historical analogies? If the proposer points to a model or a reasoned argument, then it might pass. But if it's arbitrary, reject. *Judgment call: This is a key step. AI risk estimates are highly uncertain. If the program officer finds the justification weak, reject. If the proposer has a detailed model with sensitivity analysis, pass.*

  5. **Uncertainty in p:** What is the 95% upper bound on p? The proposer might say that there's a 5% chance that p is above 10^-4. Then the expected value would be 100 times larger. But if the program officer is satisfied that the tail is bounded, pass. If the proposer cannot provide an upper bound (or if it's too high, like 0.1), then the expected value is dominated by the tail and we reject.

  6. **Benefit bounded?** We assume the foundation has a bound for the value of preventing a global catastrophe (e.g., the present value of the future of humanity). The program officer checks that the benefit does not exceed that bound. Pass.

  7. **EV/cost premium:** We require at least 10 times the typical grant. Suppose our typical grant has an EV/cost of 1 (i.e., we break even in expectation). Then we require EV/cost >= 10. Let the cost be $10M. Then we need p*B >= $100M. With p=10^-6, we require B >= $100 trillion. If the foundation values the future of humanity at more than $100 trillion, then pass. Otherwise, reject.

  8. **Bias?** Check for conflicts of interest, peer review, track record. *Judgment call.*

  9. **Mechanism:** How will this research prevent the catastrophe? If the proposal has a clear pathway, pass. If it's vague, reject.

  *Conclusion:* This proposal might pass if the probability justification is strong and the EV/cost premium is met. However, it is vulnerable at step 4 (probability justification) and step 5 (uncertainty bounds). If the program officer is not convinced by the probability estimate, it will be rejected.

  **(b) Speculative physics experiment claiming a one-in-a-billion chance of enabling cheap, unlimited clean energy.**

  1. p = 10^-9 -> **reject** by step 1 (because p < 10^-9). 
     - *Note:* We set the threshold at 10^-9 arbitrarily. The foundation might adjust this threshold, but with two hours for review, we avoid spending time on such extreme cases.

  *Conclusion:* Rejected at step 1.

  **(c) A well-studied public health intervention with a modest, reliably estimated benefit that is less cost-effective than our usual grants.**

  1. p is not tiny and the benefit is not enormous, so it is not an extreme expected-value argument. However, we note that the procedure is designed for the extreme cases. This proposal does not trigger the Pascal's mugging concerns. But the board requires that every grant meets a minimum cost-effectiveness threshold. Since the proposer admits that it is less cost-effective than our usual grants, it would be rejected by our ordinary process. However, the procedure above is for the extreme cases. We must note:

     - The procedure is only for proposals that use an expected-value argument of the form: very small p and enormous B. This proposal does not have that form. Therefore, it does not go through this procedure. Instead, it goes through the foundation's normal review for cost-effectiveness.

     - But the problem states that it is less cost-effective than our usual grants. Therefore, it would be rejected in the normal process.

  *Conclusion:* Reject (but not by this procedure, because it's not an extreme expected-value proposal).

  **One Case You Will Not Like:**
  The case (b) is rejected at step 1 because of the one-in-a-billion probability. You might not like this because the potential benefit is enormous and the cost might be low. However, the procedure is designed to avoid spending time on proposals that are too speculative. If the foundation wants to consider such proposals, it could lower the threshold (e.g., to 10^-12) but that would open the door to more muggings. Alternatively, the foundation could create a separate track for extremely speculative projects with a separate budget and review process, but that is beyond the scope of this procedure.

  **What the Procedure Cannot Do:**
  - It cannot provide a definitive answer on whether a proposal is a Pascal's mugging or not. It only provides a structured way to reduce the risk of being mugged.
  - It cannot resolve fundamental empirical uncertainties (e.g., the true probability of an AI catastrophe) or value disagreements (e.g., how much to weight future generations).
  - It relies on the program officer's judgment at several critical steps.

  **Final Note:** The foundation may wish to adjust the thresholds (step 1 and step 7) based on experience and risk tolerance.
answer: |-
  Below is a decision procedure designed for nonspecialist program officers to evaluate high-risk, high-reward proposals that rely on extreme expected-value arguments (e.g., tiny probabilities of enormous benefits). The procedure is grounded in decision-theoretic principles, including Pascal's mugging, bounded utility, uncertainty in probability estimates, and tail risks. It is formatted as a checklist with clear stopping points, requires no advanced math, and is executable in ~2 hours. Steps that cannot be resolved procedurally (i.e., require human judgment) are flagged.

  ---

  ### **Decision Procedure Checklist for Extreme Expected-Value Proposals**  
  **Goal:** Filter out Pascal's mugging attempts while allowing credible high-impact proposals to proceed to the board.  
  **Time limit:** 2 hours per proposal.  
  **Key principles:**  
  - Bounded utility: Humans cannot experience "infinite" utility, and foundations have finite resources.  
  - Uncertainty dominates: Tiny probabilities (<10⁻⁶) are inherently unreliable and prone to overfitting.  
  - Tail risk: If the expected value is driven by unverifiable scenarios, it is likely a mugging.  
  - Minimum bar: Proposals must clear higher hurdles than standard grants due to uncertainty.  

  #### **Phase 1: Initial Triage (15–30 minutes)**  
  *Quick screens to eliminate nonstarters. Stop here if any answer is "no."*

  1. **Probability threshold:** Is the claimed probability of success (p) ≥ 10⁻⁹?  
     - *Why:* Probabilities below this are indistinguishable from noise given human cognitive limits and empirical uncertainty.  
     - *Sufficient answer:* Yes, with a clear numerical estimate (e.g., "1 in 1 million" or p = 10⁻⁶).  
     - *Stop if:* p < 10⁻⁹ → **Reject**. (Too speculative; classic Pascal's mugging territory.)  

  2. **Benefit realism:** Is the claimed benefit (B) finite, bounded, and not contingent on unobserved phenomena (e.g., multiverses)?  
     - *Why:* Unbounded benefits (e.g., "infinite lives saved") ignore utility saturation; foundations cap impact at plausible maxima (e.g., preserving Earth-originating civilization).  
     - *Sufficient answer:* Benefit is quantified and capped (e.g., "avert one global catastrophe" ≈ 10¹⁴ lives saved over 1M years; max value = $10¹⁵ foundation-bound).  
     - *Stop if:* Benefit is unbounded, infinite, or relies on speculative physics/ontology → **Reject**.  

  3. **Expected value (EV) floor:** Is EV (p × B) > 10× the grant cost?  
     - *Why:* Compensates for uncertainty; EV must justify risk premium. Use proposer’s numbers.  
     - *Sufficient answer:* Quick calculation shows EV > 10× cost (e.g., cost = $1M, EV must be >$10M).  
     - *Stop if:* EV ≤ 10× cost → **Reject**. (Fails basic cost-benefit even if claims are true.)  

  #### **Phase 2: Plausibility & Uncertainty (45–60 minutes)**  
  *Assess robustness of probability and benefit. Stop if uncertainty invalidates EV.*

  4. **Probability justification:** Is there a peer-reviewed or empirically grounded model for p?  
     - *Why:* Tiny p is easily manipulated; must be anchored in data or consensus.  
     - *Ask:* "What is the strongest evidence for p? Is it based on (a) data, (b) models with validated assumptions, or (c) expert surveys?"  
     - *Sufficient answer:* (a) or (b) with citations (e.g., "p derived from AI alignment failure rates in 3 peer-reviewed studies").  
     - *Stop if:* Based on personal intuition, unbounded priors, or unreviewed theory → **Reject**.  
     - *Judgment required:* Officer assesses source credibility (no formula; use commonsense heuristics).  

  5. **Uncertainty in p:** Can we bound the uncertainty in p?  
     - *Why:* If the "true" p could be orders of magnitude lower, EV collapses.  
     - *Ask:* "What is the 90% confidence interval for p? Is the lower bound >10⁻¹⁵?"  
     - *Sufficient answer:* Confidence interval provided (e.g., "p = 10⁻⁶, 90% CI: [10⁻⁷, 10⁻⁵]"). Lower bound >10⁻¹⁵ keeps EV meaningful.  
     - *Stop if:* Confidence interval missing, lower bound ≤10⁻¹⁵, or range spans >6 orders of magnitude → **Reject**. (Tail dominates EV.)  
     - *Judgment required:* Officer checks if interval is defensible (e.g., not cherry-picked).  

  6. **Benefit pathway:** Is there a direct, falsifiable causal chain from grant to benefit?  
     - *Why:* Ensures B is achievable, not a just-so story.  
     - *Ask:* "What are the 3–5 critical steps to achieve B, and what is the probability of each?"  
     - *Sufficient answer:* Concrete pathway (e.g., "Grant funds experiment → data reveals new superconductor → engineers commercialize it").  
     - *Stop if:* Pathway has >3 critical steps, any step relies on breakthroughs, or probabilities are unassigned → **Reject**.  
     - *Judgment required:* Officer estimates if pathway is "likely enough" (e.g., >10% chance per step).  

  #### **Phase 3: Comparative & Bias Check (30–45 minutes)**  
  *Benchmark against alternatives and flag optimism bias.*

  7. **EV premium:** Is EV per dollar ≥100× that of the foundation’s median grant?  
     - *Why:* Extreme proposals require extreme returns to offset risk of error.  
     - *Sufficient answer:* EV/cost ≥100× foundation’s typical grant (e.g., typical grant: $1M for 100 lives saved → $10k/life; proposal: EV/cost must be ≥$1M/life).  
     - *Stop if:* EV/cost <100× median → **Reject**. (Insufficient premium for uncertainty.)  

  8. **Bias check:** Is the proposer incentivized to overestimate p or B?  
     - *Why:* Scientists, entrepreneurs, and advocates often suffer from optimism bias.  
     - *Ask:* "Does the proposer have a track record of similar claims? Is there independent verification?"  
     - *Sufficient answer:* Track record of accuracy (e.g., "Past 3 predictions were within 10× of outcomes") or independent review (e.g., "Preprint reviewed by MIT lab").  
     - *Stop if:* Proposer has history of overpromising, no peer review, or conflict of interest (e.g., patent holder) → **Reject**.  
     - *Judgment required:* Officer researches proposer’s background (e.g., Google Scholar, news).  

  #### **Final Decision**  
  - **If all steps passed:** Send to board with summary of due diligence.  
  - **If stopped at any step:** Reject with documented reason.  
  - **If Phase 2/3 requires unresolved judgment:** Escalate to senior officer for 2nd opinion (but still aim for 2-hour total).  

  ---

  ### **How the Procedure Could Misfire**  
  - **False negatives (rejecting good proposals):** Overly strict thresholds (e.g., p ≥10⁻⁹) may exclude legitimate long shots. Bounded utility assumption may undervalue existential risk reduction.  
  - **False positives (accepting muggings):** A charismatic proposer with fabricated "evidence" could clear checks if officer judgment fails (e.g., missing bias).  
  - **Systemic gaps:** Assumes foundation has standardized EV benchmarks; if not, Step 7 fails. Cannot resolve disputes about fundamental values (e.g., discounting future lives).  

  ---

  ### **Application to Proposals**  
  **Foundation context:**  
  - Median grant: Saves 100 lives at $1M → EV/cost = $10k per life saved.  
  - Utility bound: Max benefit capped at value of preserving humanity ($10¹⁵ based on 10¹⁴ future lives × $10k/life).  

  #### **(a) AI Catastrophe Prevention (p = 10⁻⁶, B = "avert global catastrophe")**  
  - **Phase 1:**  
    - Step 1: p = 10⁻⁶ > 10⁻⁹ → Pass.  
    - Step 2: B = "avert catastrophe" = foundation’s max $10¹⁵ → Pass.  
    - Step 3: EV = 10⁻⁶ × $10¹⁵ = $10⁹. Cost = $10M. EV > 10× cost? $10⁹ > $100M → Pass.  
  - **Phase 2:**  
    - Step 4: Probability justification? *Proposer cites AI alignment models from 3 preprint studies. Judgment: Weak (no peer review) but plausible → Pass with caution.*  
    - Step 5: Uncertainty in p? *Proposer gives 90% CI: [10⁻⁸, 10⁻⁴]. Lower bound 10⁻⁸ > 10⁻¹⁵ → Pass.*  
    - Step 6: Benefit pathway? *Grant funds research → new technique → adopted by labs. 3 steps, each p≥0.3 → Pass.*  
  - **Phase 3:**  
    - Step 7: EV/cost = $10⁹ / $10⁷ = $100 per dollar. Foundation median = $10k per life / $1M cost ≈ $0.01 per dollar. Ratio = $100 / $0.01 = 10,000× (≥100×) → Pass.  
    - Step 8: Bias check? *Proposer is tenured professor; no history of alarmism. Independent review by Oxford group → Pass.*  
  - **Verdict:** **Send to board**. High EV premium passes despite weak probability evidence.  

  #### **(b) Speculative Physics Experiment (p = 10⁻⁹, B = "unlimited clean energy")**  
  - **Phase 1:**  
    - Step 1: p = 10⁻⁹ (one-in-a-billion) < 10⁻⁹? → **Reject**.  
    - *Procedure stops.* No further review.  
  - **Why you won’t like this:** The benefit (transformative energy) is enormous, but p is below the verifiability threshold. Officer spends <15 minutes.  

  #### **(c) Well-Studied Public Health Intervention (Modest Benefit, Lower EV than Usual Grants)**  
  - **Phase 1:**  
    - Not triggered (not extreme EV: p is high, B is modest).  
  - **Handling:** This proposal does not use a tiny-p/huge-B argument, so it skips this procedure. It undergoes standard review.  
    - Standard foundation benchmark: EV/cost must exceed $0.01 per dollar (median grant).  
    - Proposal: EV/cost = $0.005 per dollar (half the median).  
  - **Verdict:** **Reject** by standard process. Fails cost-effectiveness.  
  - **Note:** This is the "answer you won’t like" – a solid but unexceptional proposal rejected for lacking the EV premium required of risky grants.  

  ---

  ### **Explicit Limitations of the Procedure**  
  1. **Cannot resolve empirical disagreements:** E.g., "true" p for AI risk is unknown; procedure only checks for reasoning errors.  
  2. **Assumes bounded utility:** If the foundation values infinite futures (e.g., multiverse colonization), the benefit cap is invalid.  
  3. **Judgment dependencies:** Relies on officer competence in Steps 4–6 and 8.  
  4. **Ignores option value:** Does not account for learning from failure (e.g., a physics experiment may yield insights even if it misses the billion-to-one goal).  
  5. **Tail risk blind spots:** If a proposal passes all checks but later reveals hidden tail risks (e.g., benefit depends on unproven cosmology), the board must catch it.  

  **Final recommendation:** Use this procedure for all "tiny probability, huge payoff" proposals. For others, rely on standard cost-effectiveness. Train officers on identifying bias and uncertainty bounds. Periodically review thresholds (e.g., p ≥10⁻⁹) based on foundation risk appetite.
