  Here's the decision tree structured around your specified fault lines and cases. The tree uses 7 diagnostic questions to navigate the logical space, resulting in 9 distinct leaves (including unnamed positions). Questions are phrased neutrally, and leaves are labeled only at the endpoints.

  ---

  ### **Decision Tree: What Computational Complexity Reveals About Rationality & Mathematical Knowledge**

  #### **Start Here**  
  **Q1:** Does the distinction between "feasible" (e.g., polynomial-time) and "infeasible" (e.g., exponential-time) computations reflect a *deep, model-independent truth* about computational hardness, or is it primarily an artifact of worst-case analysis and machine-model choices?  
  - **Artifact** → Proceed to Q2  
  - **Deep truth** → Proceed to Q3  

  ---

  #### **Branch: Artifact (from Q1)**  
  **Q2 (Case 3):** Consider an O(n¹⁰⁰) polynomial-time algorithm and an O(2^(n/100)) exponential-time algorithm. For all inputs up to ∼10⁵, the exponential algorithm is faster (constants negligible). Does this show polynomial-time is *not* the right notion of "feasibility"?  
  - **Yes** → Proceed to Q4  
  - **No** → Proceed to Q7  

  **Q4:** Can a theorem with a formal proof too long for any human to survey, but a short metatheoretic argument, be *known* by someone who understands the argument?  
  - **Yes** → **Leaf D2: Deflationary view (liberal)**  
    *(Complexity distinctions are shallow engineering artifacts; knowledge need not require surveyable proofs.)*  
  - **No** → **Leaf D1: Deflationary view (conservative)**  
    *(Complexity distinctions are artifacts, but mathematical knowledge* still *requires surveyable proofs for unrelated reasons.)*  

  **Q7:** Does the undecidability of first-order logic (or intractability of propositional logic) imply that *ideal* rationality is incoherent?  
  - **Yes** → **Leaf F: Unnamed (finitist idealism)**  
    *(Ideal agents must be bounded by computability; empty in literature—likely unattractive due to conflating feasibility with absolute limits.)*  
  - **No** → **Leaf F: Unnamed (pragmatic deflation)**  
    *(Complexity is practically irrelevant; ideal agents remain coherent but unknowable. Unnamed; unexplored in literature.)*  

  ---

  #### **Branch: Deep Truth (from Q1)**  
  **Q3 (Case 2):** A Bayesian agent assigns probability 1 to axioms but can’t compute an intractable consequence (e.g., a coNP-complete deduction). Is the agent *irrational* for not believing the consequence?  
  - **Yes** → Proceed to Q5  
  - **No** → Proceed to Q6  

  **Q5 (Case 1):** A theorem’s shortest formal proof is unsurveyably long, but it follows from a short metatheoretic argument. Can someone who grasps the argument *know* the theorem?  
  - **Yes** → Proceed to Q6a  
  - **No** → **Leaf C: Surveyability-based epistemology**  
    *(Knowledge requires feasibly surveyable proofs; intractability directly constrains rational belief.)*  

  **Q6a (Case 4):** If SAT had a polynomial-time algorithm, would finding a proof be *no more impressive* than checking one?  
  - **Yes** → **Leaf A1: Complexity-sensitive epistemology (strong asymmetry)**  
    *(P vs NP captures a fundamental discovery/verification gap; tractability tightly constrains knowledge.)*  
  - **No** → **Leaf A2: Complexity-sensitive epistemology (weak asymmetry)**  
    *(Tractability constrains knowledge, but other factors (e.g., insight) preserve a finding/checking distinction even if P=NP.)*  

  **Q6 (Case 4):** If SAT had a polynomial-time algorithm, would finding a proof be *no more impressive* than checking one?  
  - **Yes** → **Leaf E: Finding/checking realism**  
    *(P vs NP reflects a deep asymmetry, but this doesn’t license conclusions about bounded rationality; epistemology is unchanged.)*  
  - **No** → **Leaf B: Idealization-defender view**  
    *(Ideal agents are logically omniscient; intractability is a practical limit, not a normative failure.)*  

  ---

  ### **Leaves Summary**
  1. **Leaf D1**: Deflationary view (conservative)  
  2. **Leaf D2**: Deflationary view (liberal)  
  3. **Leaf F**: Unnamed (finitist idealism)  
  4. **Leaf F**: Unnamed (pragmatic deflation)  
  5. **Leaf C**: Surveyability-based epistemology  
  6. **Leaf A1**: Complexity-sensitive epistemology (strong asymmetry)  
  7. **Leaf A2**: Complexity-sensitive epistemology (weak asymmetry)  
  8. **Leaf E**: Finding/checking realism  
  9. **Leaf B**: Idealization-defender view  

  **Unoccupied combinations**:  
  - *Surveyability + deflationism (Leaf D1/D2)*: Coherent but rare; deflationists typically reject surveyability requirements.  
  - *Idealization + intractability-matters (no path to Leaf B from Q3 "Yes")*: Incoherent; if intractability constrains rationality (Q3=Yes), idealization is untenable.  
  - *Finding/checking realism + surveyability (no path from Leaf E to Q5)*: Unexplored; realists about asymmetry rarely tie it to proof length.  

  ---

  ### **Justifications for Splits**
  1. **Q1 (Feasibility: Artifact vs. Deep Truth)**  
     Splits **deflationary views** (D1/D2/F) from others. Anchors the core fault line: whether complexity classes are epistemologically significant or mere modeling choices.  
     
  2. **Q2 (Case 3: Polynomial vs. Exponential Practicality)**  
