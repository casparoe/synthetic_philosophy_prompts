  - **Coverage**: Hits all requested leaves (A–E) and adds unnamed positions for unexplored space (e.g., deflationism + undecidability concerns).  
  - **Key Splits**: Cases 1–4 are embedded as Q2/Q3/Q5/Q6a/Q6, ensuring they distinguish multiple leaves.  
