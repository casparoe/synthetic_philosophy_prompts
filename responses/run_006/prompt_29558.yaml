  ### **Step 3: Selecting the Best-Fitting Rule**
  - **Rule 2 (Legality and Institutional Oversight) is the committee’s operative principle.**  
    - **Reasons:**  
      1. **Precedents prioritize legality:** Case 5’s trespassing and Case 4’s harassment concerns show rejection/conditions for legal risks. Case 2’s biosafety rejection centered on bypassing oversight.  
