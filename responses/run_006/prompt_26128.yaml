  ### Taxonomy of Positions on the Fermi Paradox  
  *Based on the observation: The Milky Way is ancient (13.6B years) and vast (100B+ stars). A modestly advanced civilization could colonize it in <100M years, yet we see no evidence of others.*  

  Start here:  
  **1. Has technological life (capable of interstellar expansion) arisen elsewhere in the Milky Way?**  
  - **No → Rare Earth / Rare Abiogenesis**:  
    Earth-like conditions (or abiogenesis) are exceptionally rare. We are the first/only.  
  - **Yes →** Proceed to 2.  

  **2. Do any other technological civilizations *currently* exist?**  
  - **No → Great Filter Ahead**:  
    All past civilizations destroyed themselves (e.g., nuclear war, biotech disaster, climate collapse). *We face the same fate.*  
  - **Yes →** Proceed to 3.  

  **3. Is physical interstellar expansion feasible (via self-replicating probes, ships at >1% light speed)?**  
  - **No → Expansion Impossible**:  
    Unknown physics/engineering barriers prevent colonization (e.g., probe replication fails, relativistic travel infeasible). *Minority view; contradicts current understanding.*  
  - **Yes →** Proceed to 4.  

  **4. Should we *expect* to see evidence of expansion (e.g., probes, megastructures, radio signals) by now?**  
  - **No →** Proceed to 5.  
  - **Yes →** Proceed to 6.  

  **5. Why *wouldn’t* we expect evidence?**  
  - **A. Expansion not detectable by us → Unrecognizable Advanced Civilizations**:  
    Civilizations evolved beyond biology/physics we understand (e.g., digital minds, dark matter substrates). Their tech is incomprehensible.  
  - **B. Expansion not yet visible here → Expansion Wave Not Arrived (Gap)**:  
    Colonization is slower than thought, or began recently. *Logically possible but unlikely given galaxy’s age; unexplored.*  
  - **C. Expansion never occurred →** Proceed to 7.  

  **6. Why *haven’t* we seen evidence (given we should)?**  
  - **A. Inadequate search → Wrong Method / Insufficient Effort**:  
    We’re searching the wrong wavelengths, planets, or with insufficient sensitivity (e.g., overlooking nanoscale probes).  
  - **B. Evidence concealed →** Proceed to 8.  

  **7. Why no expansion?**  
  - **A. Transcended physical limits → Unrecognizable Advanced Civilizations** (as in 5A).  
  - **B. Chose not to expand → Non-Expansionist Civilizations (Gap)**:  
    All civilizations avoid expansion (e.g., ethical constraints, risk aversion). *Logically possible but unattractive; implies universal cultural convergence.*  

  **8. Why conceal evidence?**  
  - **A. Fear of cosmic threats → Dark Forest Hypothesis**:  
    Civilizations hide to survive; broadcasting or colonizing invites destruction by hostile aliens.  
  - **B. Non-interference policy → Zoo Hypothesis**:  
    Advanced civilizations observe us covertly (like a zoo/sanctuary) to avoid disrupting our development.  

  ---

  ### Key Notes  
  - **Gap Positions**: Logically possible but lack prominent defenders.  
    - *Expansion Wave Not Arrived*: Unexplored (cosmic timescales make it weak).  
    - *Non-Expansionist Civilizations*: Unattractive (assumes all civilizations reject expansion unanimously).  
  - **Unresolved Pairs**: The tree cannot distinguish:  
    - *Unrecognizable Advanced Civilizations* (5A/7A) and *Expansion Impossible* (3). Both predict no visible expansion.  
    - **Split them with**: *"Could a civilization *choose* to be detectable if it wished?"*  
      - Yes → Favors *Unrecognizable* (they actively avoid recognition).  
      - No → Favors *Expansion Impossible* (physics prevents detectability).  
  - **Shared Branches**: *Zoo Hypothesis* and *Dark Forest* both involve concealment (8) but differ in motive (benevolence vs. survival).  

  \summary{The taxonomy reveals that the Fermi paradox hinges on three core uncertainties: the rarity of life, the feasibility of interstellar expansion, and whether advanced civilizations are undetectable by choice, necessity, or limitation.}
