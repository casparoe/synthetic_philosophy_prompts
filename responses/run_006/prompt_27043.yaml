prompt: |-
  I'm taking a decison theory course this term and we've been doing expected value and the places where it goes weird — Pascal's mugging, fanaticism about tiny probabilities of huge payoffs, that stuff. Two people in my study group got into a long argument after class and I honestly couldn't sort out who was right, so I'm hoping you can adjudicate it point by point.

  Here's the exchange as best I can reconstruct it.

  Marcus opened by saying the mugger case is a bullet you just have to bite: if a stranger offers you a one-in-a-billion chance of a trillion dollars in exchange for your wallet, the expected value is about a thousand dollars, way more than what's in the wallet, so a rational person pays up. Priya said that's absurd, and that a decision rule which tells you to hand your wallet to a mugger is exactly the kind of result that should make you doubt expected value maximization in these cases, not a bullet to bite.

  Marcus said if she wants to reject it, she owes a principled line: any probability threshhold she sets can be out-mugged by a bigger payoff, so she's just drawing an arbitrary cutoff. Priya said the problem isn't where to draw the cutoff; it's that the one-in-a-billion number is made up. You have no evidence at all about the mugger's promise, so you shouldn't assign it any probability, not even a tiny one.

  Marcus said we assign tiny probabilities to un-evidenced claims all the time — a longshot startup becoming huge, some specific existential risk actually happening — and if you refused to act on small probabilities of big payoffs, you'd rule out speculative investment and basically all work on existential risk. Priya said those cases have base rates or models behind them, while a mugger's promise has nothing behind it at all.

  Marcus said that just moves the problem: now she needs a principle for which probabilities are well-founded enough to act on, which is the arbitrary-line problem all over again. Priya changed tack and said the deeper issue is that expected value maximization with unbounded payoffs is exploitable — if any positive probability of an infinite reward gives infinite expected value, the mugger can keep escalating until you're forced to pay anything, and that can't be a sane rule. Marcus said she didn't need infinity: a big enough finite payoff does the same work, so banning infinities doesn't fix anything.

  I don't want a general essay on expected value; I want a verdict on the arguments as they actually made them. Could you structure it like this:

  1. "Bottom line" (about 150 words): who is more right overall, in a sentence or two, and what's the single most important distinction they kept missing.
  2. "Round-by-round" (about 600 words): go through the four rounds in order and give each move a verdict on a scale from clearly wrong to clearly right, with a sentence or two of justification for each.
  3. "What neither of them saw" (about 250 words): the distinctions or moves that would have dissolved or at least clarified the argument — for example between expected value as a criterion and as a decision procedure, between assigning probabilities and acting on them, or whatever you think is doing the work.
  4. "Where I'd land" (about 200 words): if you had to state the defensible position after all this, what would it be.
