prompt: |-
  I keep noticing this thing and I don't know if it has a name. So here's the pattern: if someone tells me the capital of Mongolia is Ulaanbaatar, I just believe them and move on. If they tell me a restaurant has good food, I might trust them enough to go try it. But if they tell me a novel is brilliant, or a piece of music is beautiful, there's this weird resistance — not just "I'm not sure I'll agree," but something stronger, like there's something almost inappropriate about forming the belief on their say-so. Like if I said "I know Mahler's Ninth is a masterpiece because my friend told me," people would look at me funny, even if my friend is a professional conductor. And the thing is, I feel the resistance myself: even when I completely trust someone's taste, I still feel like I haven't earned the judgment unless I've experienced the thing firsthand. But I don't feel that way about, say, moral judgments — if someone I respect tells me a certain policy is unjust, I'm way more comfortable adopting that view without doing all the reasoning myself. So there's an asymmetry between aesthetic testimony and other kinds, but also between aesthetic testimony and moral testimony specifically, which is weird because both are "normative." Is there an established name for this whole cluster — the resistance to aesthetic testimony, and especially the contrast with moral testimony? And if there is, does the standard account of it actually explain why moral deference feels less problematic than aesthetic deference, or does it mostly just focus on the aesthetic side?
reasoning: |-
  Okay, the user is describing a phenomenon where they feel resistance to accepting aesthetic judgments based on testimony alone, especially compared to moral judgments. Let me unpack this.

  First, they mention they have no problem believing factual claims like Mongolia's capital or trusting restaurant recommendations. But when it comes to art, like a novel or music being brilliant, they feel it's inappropriate to believe it just because someone else says so. Even if the person is an expert, like a conductor. They contrast this with moral judgments, where they're comfortable deferring to someone they respect without doing their own reasoning. The asymmetry between aesthetic and moral testimony puzzles them because both are normative domains.

  They want to know if there's a name for this resistance to aesthetic testimony and why moral deference feels less problematic. They also ask if existing explanations cover the contrast or just focus on the aesthetic side.

  I recall that in philosophy, this is known as the "Problem of Aesthetic Testimony" or "Aesthetic Deference." But the moral-aesthetic contrast is key here. The standard explanations for aesthetic resistance include Acquaintance Necessity, Non-Transferability of Phenomenology, and the Acquaintance Principle. These suggest that personal experience is essential for genuine appreciation because aesthetic qualities are experiential. For example, knowing a piece is sad isn't enough; you need to feel its sadness.

  On the moral side, testimony can transfer knowledge without personal experience. You can understand that a policy is unjust without witnessing its effects firsthand because moral judgments often rely on principles that can be communicated. But why the difference? Moral claims might be more propositional—facts about justice that can be argued and conveyed. Aesthetic judgments, however, are more about subjective experience. You can't fully grasp the beauty of Mahler's Ninth without hearing it.

  The user might also be hinting at a deeper need: understanding their own reactions. They feel they haven't "earned" the judgment without firsthand experience. This ties into the Acquaintance Principle—believing something is beautiful requires experiencing it. In contrast, moral beliefs can be formed through testimony because they're about objective truths, not personal experience.

  But is morality really objective? Some philosophers argue both are subjective, yet society treats moral testimony differently. Maybe because moral judgments have practical consequences, affecting actions and policies, while aesthetic ones are personal. Or perhaps moral language implies objectivity, making testimony more acceptable.

  The user might also be seeking validation that their resistance is normal and has a theoretical basis. They might want to reconcile why they feel differently about deferring in aesthetics versus morality. The explanations should address the asymmetry, not just the aesthetic side. Pointing out Acquaintance Necessity and the experiential nature of aesthetics versus the principle-based nature of morality could help. Also, noting that moral testimony often involves reasoning that can be shared, while aesthetic qualities must be felt.
answer: |-
  That's a brilliantly observed philosophical puzzle! You've hit upon a core debate in aesthetics and epistemology. Here's the breakdown:

  1.  **The Name:** The phenomenon you describe – the resistance to forming aesthetic beliefs based solely on testimony – is most commonly called the **Problem of Aesthetic Testimony** or the **Problem of Aesthetic Deference**.

  2.  **The Core Arguments for Resistance (Standard Accounts):**
      *   **Acquaintance Necessity:** This is the most prominent explanation aligning with your feeling. It argues that genuinely *understanding* and *appreciating* an aesthetic property (like beauty, profundity, or brilliance) **requires direct, first-personal experience (acquaintance) with the object itself**. Testimony can tell you *that* something is beautiful, but it cannot give you the *experience of its beauty*. Without that experience, your belief, even if true, lacks the kind of justification or understanding required for genuine aesthetic appreciation or knowledge. You haven't "earned" the judgment because you haven't undergone the necessary experiential encounter.
      *   **Non-Transferability of Phenomenology:** Closely related, this emphasizes that the *phenomenal character* (the "what it's like-ness") of the aesthetic experience is inherently personal and cannot be transmitted through testimony. I can describe the sadness of a piece of music, but I cannot make you *feel* that specific sadness through words alone. Your belief about the sadness remains abstract without the felt quality.
      *   **The Acquaintance Principle:** Often invoked, this principle states: "Judgments of aesthetic value, unlike judgments of moral value, must be based on first-hand experience of their objects." (Robert Hopkins is a key proponent). This directly captures your unease.
      *   **Lack of Convergence/Objective Standards:** Some argue that aesthetic judgments lack the kind of objective standards or convergence found in factual or even some moral domains. If there's no clear "fact of the matter" everyone converges on (unlike the capital of Mongolia), then testimony seems less reliable or authoritative. However, this clashes with your trust in your conductor friend's expertise.

  3.  **The Asymmetry with Moral Testimony (The Crux of Your Question):**
      This is where it gets really interesting, and the standard accounts of the *aesthetic* problem don't always fully explain the *contrast*. Here's how philosophers grapple with it:

      *   **Moral Judgments as More Factual/Propositional:** Many argue that moral judgments are primarily about *facts* (e.g., facts about harm, justice, well-being) that can be *described* and *reasoned about* propositionally. Testimony can transmit knowledge *about* these facts and the reasoning behind them. You can understand *why* a policy is unjust based on testimony about its consequences and principles of fairness, even without witnessing it firsthand. Moral truths are seen as discoverable through reason and evidence sharing.
      *   **Aesthetic Judgments as Experiential/Non-Propositional:** In contrast, aesthetic judgments are seen as fundamentally rooted in a *sensory and emotional response* to the object's specific perceptual properties. The core "truth" or value is inseparable from the *experience itself*. Testimony can't replicate the sensory input or the emotional resonance required.
      *   **Moral Motivation and Action:** Moral judgments often imply reasons for action ("This is unjust, therefore I should oppose it"). Testimony can provide the relevant facts and principles to motivate action without needing the visceral experience. Aesthetic judgments, while they might motivate seeking an experience, don't typically imply the same kind of direct practical imperative based solely on the testimony. Believing a symphony is beautiful primarily motivates you to *listen*, not necessarily to *act* in a specific moral sense.
      *   **The Nature of "Knowing":** Some argue that "knowing" something is beautiful requires the experiential component for it to count as full aesthetic knowledge, whereas "knowing" something is unjust might only require understanding the relevant facts and principles, achievable through testimony. In aesthetics, testimony might grant you a *belief*, but not *understanding*.
      *   **Social Practice:** Our social practices around deference differ. We routinely defer to moral experts (ethicists, trusted community leaders) on complex issues. We expect them to articulate *reasons* we can grasp. While we defer to aesthetic experts (critics, curators) for guidance on *what to experience*, we don't expect (or accept) them to *stand in for* our own experience in the same way we accept their moral reasoning standing in for our own deliberation on complex moral facts.

  4.  **Does the Standard Account Explain the Contrast?**
      *   **Partially:** The core arguments (Acquaintance Necessity, Non-Transferability of Phenomenology, Acquaintance Principle) directly *imply* the contrast. They posit that aesthetic judgment is uniquely dependent on first-hand experience in a way that factual and (arguably) moral judgment are not. The Acquaintance Principle explicitly contrasts aesthetic with moral judgment.
      *   **But the Moral Side Needs Specific Work:** While the aesthetic resistance is the primary driver, explaining *why* moral deference feels less problematic requires delving into specific theories of moral epistemology and judgment (as outlined in point 3). The standard account of the *Problem of Aesthetic Testimony* often *assumes* or *highlights* this contrast without always providing a deep, independent theory of *why* moral testimony works differently. It often points to the factors above (factual/propositional nature, link to action, reasoning transmission) as the key differences.

  **In Summary:**

  *   **Name:** Problem of Aesthetic Testimony / Aesthetic Deference.
  *   **Core Explanation for Aesthetic Resistance:** Acquaintance Necessity / Non-Transferability of Phenomenology / Acquaintance Principle. Genuine aesthetic appreciation/knowledge requires first-hand experience; testimony can't transmit the essential phenomenal character.
  *   **Explaining the Contrast with Moral Testimony:** The standard account *highlights* the contrast via the Acquaintance Principle. It explains it by arguing that moral judgments are more about propositional facts and principles discoverable through reason and shareable via testimony, while aesthetic judgments are fundamentally about non-transferable sensory and emotional experiences. Moral judgments also often carry direct implications for action based on shared reasons, making testimony more pragmatically acceptable. However, fully justifying *why* moral testimony works better often requires supplementary arguments from moral epistemology.

  Your intuition is spot-on: there's a deep asymmetry rooted in the fundamentally experiential nature of aesthetic appreciation versus the more propositional (or at least differently grounded) nature of many moral judgments. The resistance you feel when someone declares Mahler's Ninth a masterpiece is philosophically well-founded!
