prompt: |-
  I'm a retired physicist who has gotten into philosophy in the last few years, and there's a view I've come to hold that I'd like to see attacked properly. It's roughly Good's theorem on the value of information: for an ideal Bayesian decision-maker, costless information never has negative expected value. The intuitive argument is that you can always just ignore the information, so it can't make you worse off, and usually conditioning on it lets you do better. I've found myself leaning on this in arguements about whether to get tested for a disease, whether to fund more precise measurements, and so on. But I've also started to suspect I'm treating a theorem with assumptions as if it were a blank-check principle, and I want to know how exposed it actually is.

  You are a professional philosopher working in decision theory and formal epistemology. Please think carefully, and begin by brainstorming the assumptions that have to be in place for the theorem to go through before you write the final answer.

  What I want is a map of what would count against the view — observations, arguments, formal results, or cases. Sort the defeaters by how decisive they are, and separate the ones that are fatal from the ones that are merely awkward. What would a commited defender of the 'information can't hurt an ideal agent' position themselves concede counts against it? Which of the possible escape routes are live rather than merely logically possible? Be willing to tell me if the view has been qualified into unfalsifiability — that it holds exactly when its assumptions hold and fails otherwise — and whether that's actually a problem for a claim like this or just what you'd expect from a theorem.

  For what it's worth, I find the assumption-dependence the most interesting part: the theorem seems to quietly assume that the information doesn't change your available acts, your preferences, or the world itself, and I'd like to know which of those failures matters most in practice. Don't just tell me the mathematics is right; I want to know what would count against the philosophical claim that a rational agent should never pay to avoid costless information, and what that claim risks.
reasoning: |-
  Okay, I need to really dig into this question from a retired physicist who's gotten into philosophy. They're familiar with Good's theorem and its intuitive appeal—that costless information can't hurt an ideal Bayesian agent because you can always ignore it. But they're suspicious that they might be overapplying it, treating it as a universal principle when it's actually full of assumptions. They want a map of defeaters: what could challenge this view, sorted by how serious they are.

  First, I should recall Good's theorem clearly. It states that for a rational agent with a prior probability distribution, the expected utility of an action can only increase (or stay the same) when you gain more information, as long as that information is free. The key intuition is that you can always discard the info and stick to your original plan, so it can't make you worse off. But as a philosopher in decision theory, I know this isn't bulletproof—there are cracks in the foundation.

  The user specifically asked about assumptions, so I'll start by brainstorming those. The theorem assumes an ideal Bayesian agent: they have a coherent prior, update via conditionalization, and maximize expected utility. Also, the information is costless in every sense—no money, time, or cognitive load. Preferences are stable, acts don't change based on the info, and the world state is fixed—no self-fulfilling prophecies or info that alters reality. Plus, the agent is logically omniscient; they don't get confused by paradoxes.

  Now, for defeaters, I need to categorize them by decisiveness. Fatal ones destroy the theorem outright in certain cases, while awkward ones just make it messy. I'll draw from real examples in philosophy and decision theory.

  Starting with fatal defeaters: these are showstoppers where even an ideal agent can be hurt by costless info. The big one is preference change. If learning something alters what you want—like finding out you have a genetic disease and suddenly valuing different things—then the info can harm you because your utility function shifts. Good's theorem assumes fixed preferences, so this breaks it. Another fatal case is when the info restricts your action set. For instance, in Newcomb-like problems, knowing the prediction might force you to one-box when you'd prefer to two-box ignorantly. And then there's self-referential paradoxes, like the Toxin Puzzle, where knowing you'll get a reward changes your incentive to act.

  Awkward defeaters are more subtle. Computational costs aren't fatal for an ideal agent, but in practice, processing info can be burdensome. Also, if the info creates psychological effects—like anxiety from a medical test—that's not covered by the ideal model. Ambiguous info that leads to decision paralysis could count, too. And in game theory, if others know you have the info, it changes their strategies, which can backfire.

  I should also think about what a committed defender might concede. They'd probably admit that preference change is a killer, but argue it's rare in pure decision theory. For action restriction, they might say that in standard formulations, acts are defined broadly to include commitments. But that feels like patching holes.

  On escape routes: some are live options. For preference change, you could model meta-preferences, but it gets complex. For computational issues, you bite the bullet and say ideal agents don't have them. The key is to avoid unfalsifiability—if we keep tweaking assumptions to save the theorem, it becomes untestable. That's a risk here; the theorem might only hold when its assumptions do, which is tautological but not useless—it clarifies boundaries.

  The user mentioned being interested in which assumption failures matter most in practice. From what I know, preference instability and psychological costs are huge in real life. Like, not getting tested for Huntington's because you don't want to live with dread. Game-theoretic aspects matter in economics. Computational limits affect AI systems.

  Finally, for the philosophical claim: it risks being overapplied. In messy human contexts, info often isn't costless, and we're not ideal agents. So while the theorem is mathematically sound, using it as life advice ignores the caveats. That's what the user might be sensing—they're leaning on it too hard in debates.

  I'll structure this in the response: start with assumptions, then fatal/awkward defeaters, defender's concessions, escape routes, and end with implications. Keep it thorough but not math-heavy, since they're a physicist but want philosophical depth.
answer: |-
  As a fellow traveler between physics and philosophy (and a specialist in decision theory), I appreciate your vigilance. Good's theorem (1967) *is* mathematically sound, but its philosophical application as a universal principle—"rational agents should never pay to avoid costless information"—rests on a lattice of assumptions that often fracture in practice. Below is a structured analysis of its vulnerabilities, sorted by decisiveness, with escape routes evaluated. I'll conclude with implications for your philosophical claim.

  ### Core Assumptions of Good's Theorem (The Silent Scaffolding)
  1.  **Ideal Bayesian Agent:**
      *   Coherent, probabilistic prior beliefs.
      *   Updates perfectly via strict conditionalization.
      *   Has a well-defined, complete, and consistent utility function over outcomes.
      *   Maximizes expected utility (EU) given beliefs.
      *   *Logical Omniscience:* Instantly comprehends all logical implications of information.
  2.  **Costless Information:**
      *   No direct cost (money, time, resources) to *acquire* the information.
      *   No cost to *process* or *utilize* the information (no computational/psychological burden).
  3.  **Fixed Decision Problem:**
      *   The set of available **acts** (A) is unchanged by acquiring the information.
      *   The relevant **states of the world** (S) are unchanged by acquiring the information.
      *   The **consequences** (C) of act-state pairs are unchanged.
      *   The agent's **utility function** (U: C → ℝ) is unchanged by acquiring the information.
  4.  **Passive Information:**
      *   The information is *about* the state of the world; it does not *cause* changes to the state of the world, the acts, or the utilities. (No performative or self-referential effects).
  5.  **Exogenous Information Source:** The mechanism providing information is independent of the agent's decision process and the world state in ways not accounted for in the prior.

  ### The Defeaters: Mapping the Vulnerabilities
  **I. Fatal Defeaters (Direct Counterexamples Under Relaxed Assumptions)**
  These scenarios demonstrate situations where a *formally rational* agent (satisfying Bayesian coherence and EU maximization) can have strictly negative expected value from costless information. A committed defender must concede these as genuine limitations; they break the theorem's conclusion.

  1.  **Preference Instability (Utility Change):**
      *   **Case:** Learning information *changes your utility function*. E.g., learning you test positive for Huntington's disease might induce depression/anhedonia, lowering the utility you assign to *all* future states compared to the utilities you assigned while ignorant. The information didn't change the physical outcomes, but it changed *you*. Ignoring the test result isn't psychologically possible – the knowledge itself alters your preferences.
      *   **Why Fatal:** Good's theorem assumes `U` is fixed. If `U_post-info ≠ U_pre-info`, the comparison of expected utility pre- and post-information is comparing different utility scales. The "ignoring" option effectively disappears because the agent *with* the information cannot revert to the *pre-info* utility function. The information actively harms by degrading the agent's capacity to experience utility.
      *   **Escape Routes:** *Deny the Idealization:* Argue a truly "ideal" agent has stable, higher-order preferences immune to such psychological effects (controversial). *Meta-Preferences:* Model changing `U` as revealing a "true" meta-utility (difficult to formalize generally). **Live?** Preference instability is a major live issue; escaping it requires strong, arguably unrealistic, assumptions about agent psychology or meta-rationality.

  2.  **Action Set Restriction (Change in Available Acts):**
      *   **Case (Newcomb's Problem & Signaling):** Information can constrain your *feasible* actions or their perceived meaning. In Newcomb's Problem, if the Predictor bases its prediction on your *disposition*, learning its prediction *before* choosing might make "two-boxing" psychologically impossible or reveal it as irrational dominance, effectively forcing one-boxing. More concretely: learning a state secret might legally or practically prevent you from taking certain actions you could have taken in ignorance. Knowing a negotiation counterparty's bottom line might make fair negotiation impossible.
      *   **Why Fatal:** Good's theorem assumes `A` is fixed. If `A_post-info ⊂ A_pre-info` or the *meaning/effectiveness* of acts changes (e.g., "bluffing" becomes impossible), the agent cannot "ignore" the information to take the same actions they would have taken in ignorance. The information actively closes doors.
      *   **Escape Routes:** *Act Redefinition:* Define `A` very broadly to include "commitment strategies" made *before* getting info (e.g., pre-commit to one-boxing). *Deny Relevance:* Argue cases like Newcomb involve controversial causal decision theory (CDT) vs. evidential (EDT) issues orthogonal to Good. **Live?** Act restriction via information is a significant live concern, especially in game theory and social contexts; escape via pre-commitment is theoretically possible but often impractical.

  3.  **Self-Referential/Predictive Information (Information Causes the State):**
      *   **Case (Toxin Puzzle, Death in Damascus, Psychopath Button):** Information can make a desirable state logically impossible or a harmful state inevitable. In the Toxin Puzzle, learning you *will* get a reward for *intending* to drink toxin makes actually drinking it (required to fulfill the intention) irrational. In Death in Damascus, learning Death's location guarantees you go to the other city, making Death move there. Trying to press a "kill all psychopaths" button only works if *you* aren't one; learning you *are* one makes pressing it suicidal.
      *   **Why Fatal:** Good's theorem assumes information is *passive* (Assumption 4). Here, the act of *learning* the information (or its content being known) *causally* or *logically* changes the state `S` or the consequences `C`. The "ignore" strategy fails because the mere fact of learning alters the world. The pre-info optimal plan becomes incoherent or infeasible post-info.
      *   **Escape Routes:** *Temporal Indexing:* Model the decision to *seek* information separately and more complexly (e.g., using game trees). *Deny Practical Relevance:* Argue such cases are rare logical curiosities. **Live?** While exotic, these cases highlight fundamental issues in modeling knowledge and causation; escape requires complex temporal modeling, which is live but messy.

  **II. Awkward Defeaters (Challenging the Idealization or "Costless" Nature)**
  These don't directly refute the theorem under its strict assumptions, but they make its application to real-world agents (or even idealized ones in richer models) highly problematic. They render the "never pay to avoid" advice dangerous or misleading.

  1.  **Computational/Cognitive Costs (Violates Costless Processing):**
      *   **Case:** Information is complex (e.g., raw data from LHC, a dense legal document). Processing it to extract decision-relevant features requires significant cognitive resources (time, mental effort) from a bounded agent, or computational resources from an AI. This cost isn't captured in the "costless information" assumption.
      *   **Why Awkward:** An ideal Bayesian has infinite computational power (Assumption 1c). Real agents don't. The expected cost of processing *can* outweigh the expected benefit of the information itself. You *might* pay to avoid info to prevent wasting resources.
      *   **Escape Routes:** *Idealization Defense:* Stick to the ideal agent, where this vanishes. *Internalize Costs:* Model cognitive load as reducing utility. **Live?** Hugely live in bounded rationality. For ideal agents, it's defused, but for your practical applications (funding measurements, testing), it's paramount.

  2.  **Psychological Harms (Violates Fixed Utility & Costless Processing):**
      *   **Case:** Information causes anxiety, dread, or regret *regardless* of the state it reveals. E.g., the sheer *uncertainty* while waiting for a test result might be less stressful than knowing a positive result (even if treatable), or knowing a negative result might induce survivor's guilt. Knowing historical truths might shatter cherished beliefs, causing existential distress.
      *   **Why Awkward:** This blends Preference Instability (distress lowers utility) and Cognitive Cost (managing negative emotions). The information inflicts a utility cost *simply by being known*, separable from any action taken based on it. The "ignore" strategy is psychologically impossible.
      *   **Escape Routes:** *Idealization:* Argue ideal agents are emotionless EU-maximizers. *Utility Internalization:* Model the psychological state *caused by knowing* as part of the outcome's utility. **Live?** A major practical concern. Internalization is live but often ad-hoc; the idealization escape is philosophically unsatisfying for human agents.

  3.  **Ambiguous or Misleading Information (Violates Ideal Updating):**
      *   **Case:** Information is noisy, ambiguous, or easily misinterpreted *even by a rational agent* (e.g., a complex statistical result, an oracle with known but complex error structure). This can lead to *worse* decisions than ignorance due to overconfidence or misapplication of conditionalization.
      *   **Why Awkward:** An ideal agent with a correct prior and model of the info source *should* update perfectly. But if the agent's prior/model is subtly wrong (but coherent!), or the info is inherently confusing, EU can decrease. You might rationally prefer ignorance to avoid the risk of misinterpreting complex info.
      *   **Escape Routes:** *Blame the Prior:* Argue the problem is a flawed prior, not information per se. *Idealization Defense:* Perfect priors and models are assumed. **Live?** Epistemologically live (the problem of priors); in practice, a huge concern for scientific measurement and complex data.

  4.  **Strategic Disclosure & Signaling Games (Violates Exogenous Source):**
      *   **Case:** Others know you have (or might get) the information, and adjust their behavior accordingly. E.g., a seller might offer a worse price if they know you *could* get an expert inspection (even if you don't get it). Or, in job markets, the *option* to get a potentially bad credential might force you to get it to avoid signaling low quality.
      *   **Why Awkward:** The *availability* or *potential* of information changes the strategic landscape before you even acquire it. Good's theorem considers only the act of acquisition itself, not the meta-effects of the information being potentially knowable. You might pay to *avoid having the option* to learn to prevent others from strategically reacting.
      *   **Escape Routes:** *Model the Meta-Game:* Expand the decision model to include others' knowledge and actions. *Assume Privacy:* Assume the acquisition is secret. **Live?** Extremely live in economics and game theory; escape requires complex modeling beyond the basic Good setup.

  **What a Committed Defender Concedes:**
  A defender would readily concede that **Preference Instability** and **Self-Referential Information** are genuine counterexamples *under relaxed assumptions*. They would argue these fall outside the theorem's intended scope (fixed preferences, passive information). They might fight harder on **Action Set Restriction**, arguing that acts should be defined to include dispositions or pre-commitments. They would dismiss **Computational/Psychological Costs** and **Ambiguity** as irrelevant to the *ideal* case, and see **Strategic Effects** as requiring a different (game-theoretic) model. Their core defense is: "The theorem holds *exactly* for ideal agents in static decision problems with passive information and fixed preferences/acts. Failures indicate the situation doesn't match the model."

  **Escape Routes: Live vs. Logically Possible**
  *   **Live (Actively Pursued):** Modeling meta-preferences/higher-order attitudes for utility change; complex temporal decision models/game trees for self-reference and strategic games; internalizing psychological/computational costs into utility functions for bounded agents; sophisticated pre-commitment strategies.
  *   **Logically Possible but Unsatisfying/Dead Ends:** Insisting ideal agents are immune to all psychological effects (ignores human reality); denying the coherence of cases like Newcomb/Toxin (against philosophical consensus); claiming all information failures are due to incorrect priors (unfalsifiable).

  **Qualification and Unfalsifiability: Is it a Problem?**
  The theorem **has been qualified into unfalsifiability** in its strict mathematical form: *it holds exactly when its assumptions hold.* This is precisely what you'd expect from a mathematical theorem (like Noether's theorem in physics - it holds under its symmetry assumptions). **This is not inherently a problem for the theorem itself.**

  **The Problem** lies in the **philosophical claim**: "A rational agent should never pay to avoid costless information." *This* claim risks being:

  1.  **Vacuous:** If "rational agent" is defined *as* one for whom all the assumptions hold, the claim is tautologically true but useless for guiding real agents.
  2.  **Misleading/Dangerous:** If applied uncritically to non-ideal agents or situations violating the assumptions (which is almost always the case!), it can prescribe harmful courses of action (e.g., getting tested for untreatable conditions causing psychological harm, seeking strategic information that triggers adverse reactions).
  3.  **Overly Narrow:** It ignores the richness of rational agency involving self-knowledge, commitment, psychological states, and social interaction.

  **What Risks Does the Philosophical Claim Run?**
  It risks being a **false generalization** from a powerful but highly specific formal result. It risks **ignoring the agent's dynamic nature** (preferences, psychology) and **the world's reactivity** to knowledge. Most importantly, it risks **confusing mathematical rationality with practical wisdom**. The value of information *in practice* is highly context-dependent and contingent on stability (of self, world, options) and processing capacity.

  **Which Assumption Failures Matter Most in Practice?**
  For human agents making decisions like medical testing or funding measurements:
  1.  **Psychological Harms & Preference Instability:** Utterly dominant. The dread of a positive test, the life-altering impact of knowledge on identity and values – these are often the *primary* reasons people avoid information, and they are frequently rational *for them*.
  2.  **Computational/Cognitive Costs:** Critical for complex information (e.g., interpreting massive datasets). Paying for *pre-processed* insights rather than raw data is often rational.
  3.  **Strategic Disclosure:** Highly relevant in economic/social contexts (negotiations, markets, reputation).
  4.  **Action Set Restriction:** Relevant for commitments and reputation (e.g., knowing a secret might force recusal).

  **Conclusion:** Good's theorem is a cornerstone of normative decision theory, brilliantly highlighting the potential value of information *under idealized conditions*. However, wielding it as a universal philosophical principle that "rational agents should never avoid costless information" is fraught. The fatal defeaters (Preference Change, Action Restriction, Self-Reference) show it's not universally true even formally. The awkward defeaters reveal how fragile the idealizations are in practice. **The theorem is a powerful tool, not a universal law.** Its greatest philosophical value lies not in dictating behavior, but in clarifying the precise conditions under which information *is* value-positive, thereby highlighting where and why real-world decisions might *legitimately* diverge from this ideal – often due to the messy realities of being a human agent in a reactive world. Your intuition about assumption-dependence is spot-on; it's the key to understanding both the theorem's strength and its limits.
