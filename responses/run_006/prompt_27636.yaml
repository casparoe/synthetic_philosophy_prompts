prompt: |-
  I am a novelist at work on a fantasy novel whose legal system runs on spoken formulas: a contract binds only if the parties pronounce the exact clause before a licensed registrar, a marriage is valid only when the officiant recites the prescribed words, and a royal decree takes effect only when delivered in a particular ceremonial voice. A friend in my writing group, who has read some philosophy of language, insists I am not inventing anything exotic, that this is just Austin's account of performative utterances made vivid. On her telling, an ordinary promise, a christening, or a judge's verdict already works like an incantation: the right words, spoken by the right person under the right conditions, bring a new state of affairs into being, and the world is altered afterward not because the words described anything but because they were said. She uses this to argue that my novel's magic needs no further justification; it is only a dramatization of how real language already operates.

  I am uneasy with the analogy, because in my novel the formulas work through a supernatural causal channel, whereas the speech acts I have been reading about seem to depend on convention, standing institutions, and the uptake of other people in ways I only half understand. Before I commit my worldbuilding to the comparison, I want an audit of how far the spell analogy actually carries for performative utterances. Please write the following sections in this order: "The correspondence table" (about 200 words), laying out what maps onto what, including the counterparts of the spell's words, caster, enabling conditions, effect, and a failed or miscast spell; "Where the analogy holds" (about 200 words), on the respects in which performatives really are spell-like and what that similarity explains; "Where it breaks" (about 350 words), on the disanalogies that matter, in particular the role of convention and institution, uptake by others, sincerity and abuse, and the difference between causal power and the kind of change a speech act effects; "What the analogy smuggles in" (about 200 words), on the features of magic the comparison quietly imports and whether the Austinian picture licenses any of them; and "Verdict for the novel" (about 150 words), on whether the friend's conclusion survives once the disanalogies are on the table, and, if the spell analogy is carrying more than it can bear, what a better analogy for performative utterances would be.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating worldbuilding challenge centered on legal magic systems and their relationship to Austin's speech act theory. Their core concern seems to be whether their friend is correct in claiming that performative utterances are essentially real-world magic spells, which would simplify justifying their fantasy system.

  Hmm, the user's unease about the supernatural vs conventional distinction feels significant. They clearly grasp the surface similarity but sense deeper differences in mechanism. The request for a structured audit suggests they need concrete analytical tools to evaluate this analogy's limits.

  First, I consider constructing the correspondence table. For "words," Austin's formulaic phrases map directly to incantations. The "caster" aligns with the authorized speaker in speech acts. But already I notice "enabling conditions" will need nuance - supernatural laws vs social institutions. Effects comparison is cleaner: both create new states. Failure cases reveal early cracks though, as misfires stem from human error rather than arcane interference.

  For where the analogy holds, I focus on the shared "world-altering" aspect. The moment of utterance creating new realities works well for both. The necessity of precise wording and speaker position also transfers neatly. This explains why the friend's argument feels initially persuasive.

  But the breakdown section needs most care. The conventional nature of speech acts versus supernatural causation is fundamental. Uptake - how others' recognition sustains the effect - has no spell equivalent. Sincerity conditions differ too: magic works regardless of intent, while insincere promises still "exist" as speech acts. The "change" itself operates on social reality versus physical reality.

  Ah, the smuggling danger! Comparing to spells subtly implies inherent power in words themselves and individual agency, whereas Austin emphasizes collective practice. Magic's reliability exceeds human institutions' messiness.

  Final verdict: while the analogy illuminates surface mechanics, it obscures speech acts' social foundations. For their novel, maintaining supernatural causation preserves fantasy logic. To deepen realism, they might explore how their magic system's institutions mirror human conventions - perhaps registrars as priests of linguistic deities? 

  Throughout I'll maintain academic rigor but remember this serves creative writing. Examples should clarify theory while sparking worldbuilding ideas.
answer: |-
  ## The Correspondence Table

  | Spell Element          | Performative Utterance Element | Example                                  |
  | :--------------------- | :----------------------------- | :--------------------------------------- |
  | **Incantation/Words**  | **Prescribed Formula**         | "I name this ship *Queen Mary*"          |
  | **Caster/Sorcerer**    | **Appropriate Speaker**        | Ship's captain, judge, officiant         |
  | **Enabling Conditions**| **Felicity Conditions**        | Speaker has authority, context is correct (e.g., ship launching) |
  | **Effect**             | **Illocutionary Act**          | The ship *is* named *Queen Mary*         |
  | **Failed/Miscast Spell**| **Infelicity/Misfire**        | Wrong words ("I *christen*..."), wrong speaker (random person), wrong context (ship already sunk) |

  In Austin's framework, a performative utterance *is* the action it names, but only when the "spell" components align correctly. Saying "I promise" *is* the act of promising, provided you are the right person (committer), in the right context (e.g., not joking under duress), saying the right words. The effect is a new social fact: an obligation exists that didn't before. A misfire occurs when any "component" fails, rendering the act void, null, or incomplete – the spell fizzles.

  ## Where the Analogy Holds

  The analogy holds powerfully in its core insight: **language can create reality.** Like a spell, a performative utterance, uttered correctly by an authorized agent under suitable conditions, brings about a distinct change in the state of the world *simply by being uttered*. The words aren't describing a pre-existing promise, marriage, or verdict; they *constitute* it. This captures the "magic" of language Austin identified. The necessity of precise wording ("I do" vs. "I might") mirrors the specificity of an incantation. The dependence on the speaker's status (judge, captain) parallels the caster's inherent power or authority. The moment of utterance is the moment of transformation – the world is different afterward. This similarity brilliantly explains the *efficacy* and *formulaic nature* of institutional speech acts and why deviations matter. Your friend is right that this inherent "world-changing" power of words in specific contexts *is* the dramatic core Austin revealed.

  ## Where it Breaks

  The analogy fractures critically when examining the *source* and *sustenance* of the power:

  1.  **Convention & Institution vs. Supernatural Law:** The power of performatives stems *entirely* from complex, historically evolved, human **social conventions and institutions**. A judge's verdict binds because of a vast, interdependent system of law, courts, police, and social agreement – not because the words tap into arcane energy. Magic, in your system, presumably draws power from inherent supernatural laws of the universe (mana, divine will, cosmic forces). Austin's "felicity conditions" are social rules; a spell's enabling conditions are natural/metaphysical laws.
  2.  **Uptake & Recognition:** Performatives fundamentally require **uptake** by others within the relevant community. A promise only creates an obligation if the hearer understands and accepts it *as* a promise. A marriage requires witnesses and societal recognition. A law requires citizens and enforcers to generally accept its authority. The effect persists *because* of ongoing collective belief and practice. In contrast, a spell's effect is usually depicted as immediate, intrinsic, and independent of audience belief (though witnesses might confirm it). Magic *compels* reality; performatives *negotiate* social reality.
  3.  **Sincerity, Abuse, and the Inner State:** Austin distinguishes "abuses" – performatives uttered insincerely ("I promise" with no intent). The act *happens* (a promise is made), but it's hollow/flawed. Magic spells typically succeed or fail based on external conditions and correct performance, regardless of the caster's inner belief or intent (though belief might *be* a condition). The "sincerity condition" highlights that performatives often involve commitments of the *self* in a way spells often do not.
  4.  **Nature of Change:** The change wrought by a performative is a change in **deontic status** (rights, duties, obligations, entitlements) or **institutional facts** within a human community. The ship isn't physically altered by naming; its *social identity* is. A spell, however, typically causes a direct **physical or metaphysical change** in the world itself – turning lead to gold, summoning a demon, creating a force field. The performative changes the *social landscape*; the spell changes the *fabric of reality*.

  ## What the Analogy Smuggles In

  The spell analogy subtly imports assumptions that Austin's picture **does not** inherently license:

  1.  **Inherent Power in Words:** It suggests the *words themselves* possess causal power, like mystical sigils. For Austin, the power resides entirely in the **conventional role** assigned to those words by the community/institution. "I do" has power *because* we all agree it does in a marriage ceremony, not because the phonemes vibrate with cosmic energy.
  2.  **Individual Agency:** It emphasizes the individual caster's action as the prime mover. Austin's model highlights the **systemic and communal** nature of the power. The judge speaks *for* the institution; the captain names *within* the maritime tradition.
  3.  **Mechanism:** It implies a supernatural **causal mechanism** (energy channeled, laws bent). Austin provides no causal mechanism; he describes a **logical structure** of social action enabled by convention. The change is normative, not causal in the physical sense.
  4.  **Reliability:** It can imply near-perfect reliability if conditions are met. Austin's performatives are inherently vulnerable to misunderstanding, insincerity, challenge, and the fragility of social institutions themselves.

  ## Verdict for the Novel

  **Your unease is justified.** While the analogy brilliantly illuminates the *form* and *transformative potential* of performatives, it fundamentally misrepresents their *source of power* (convention vs. supernatural causation) and *nature of change* (social status vs. physical/metaphysical reality). Your friend's conclusion that your magic needs "no further justification" because it mirrors real speech acts **does not fully survive** the disanalogies.

  **Better Analogies:** Performative utterances function more like:
  *   **Moving a piece in a board game:** The act (moving the rook) *is* the game action, but only because of the pre-agreed rules (convention) and the recognition of all players (uptake). The change is within the game's institutional reality.
  *   **Signing an official document:** The signature creates legal effects, but only because of the system of law, registries, and societal recognition that imbue that mark with meaning and force. The power is delegated by the institution.
  *   **A referee blowing a whistle:** The sound signifies "foul" and stops play, but only because players and spectators accept the referee's authority and the rules of the game.

  **Recommendation:** Embrace the *structural* similarity (formula, speaker, conditions, effect) for dramatic resonance. However, lean into the *disanalogies* for depth. Explore *how* the supernatural power in your world interacts with, depends on, or perhaps even *creates* the social conventions and institutions. Does the magic *require* collective belief (like uptake)? Does it break down if institutions collapse? This tension between arcane power and social structure could be incredibly fertile ground for your worldbuilding. Your system *is* exotic magic – Austin helps explain *why* its form feels intuitively powerful, but not *how* it works.
