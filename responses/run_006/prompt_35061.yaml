prompt: |-
  ok so i've been trying to sort out my views on ethics and infinity and i want a sanity check on whether these hang together:

  (1) i'm a utilitarian — total well-being is what matters.

  (2) the repugnant conclusion is actually correct, not a reductio. a huge population of barely-happy lives beats a smaller flourishing one if the total sum is higher.

  (3) there's an asymmetry: we have a strong obligation not to create miserable people, but no obligation to create happy people. i don't think this contradicts (1) but i'm not sure.

  (4) infinite ethics is a real problem — standard utilitarianism breaks when populations are infinite.

  (5) my prefered fix for infinite cases is something like comparing worlds by the limiting density of utility. i know it has edge cases but it seems like the right direction.

  (6) in practice this doesn't matter since we only ever affect finite numbers of beings.

  are these consistent? i'm especially worried about (3) vs (1) — can a utilitarian really have the procreation asymmetry? and (5) vs (1) — is limiting density even a utilitarian thing, or am i switching to a different theory? also (6) feels like it might just be me dodging the problem i admitted was real in (4). go through the pairs and tell me which ones are actually in tension, how bad each tension is, and what the cheapest fix would be for each.
