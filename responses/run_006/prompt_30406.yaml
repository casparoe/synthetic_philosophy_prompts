  ok here's what i need. i teach an upper-level undergrad game theory course aimed at philosophy students, about 20 people, and we have one 80-minute meeting to spend on Hofstadter's superrationality. i want the session built around the Platonia dilemma and the Luring Lottery, and i want the students to run into the tension themselves before anyone says the word superrationality in the room. no lecture up front. you're an expert on superrationality and on running philosophy seminars, so think carefully, maybe sketch two or three structures first, then commit to one and write it up concrete enough that a TA could run it cold. the goal is for them to feel, not just hear, the difference between standard game-theoretic reasoning (given what everyone else will do, can i do better by switching?) and superrational reasoning (we're symmetric copies of the same reasoning, so the answer has to be the same for all of us before i even know what it is).

  quick recap so the design stays grounded. in the Platonia dilemma a trillionaire tells 20 people that if exactly one of them sends a telegram by noon the next day, that one will recieve a billion dollars; if zero or more than one send, nobody gets anything, and communication is forbidden. the superrational move is to send with probability 1/20, but a game-theoretic player who thinks everyone else is doing that will feel the pull to just send for sure, since that wins whenever none of the other 19 happens to send. in the Luring Lottery (actually run by Scientific American in the 80s) a reader could enter once by sending a postcard with the number 1, or send a single postcard with any larger number to count as that many entries; the prize was a million dollars split across all the entries and awarded to a randomly drawn entry. submitting more entries raises your chance but shrinks the prize for everyone including you, and the expected-value-maximizing number of entries is exactly however many entries everyone else submits, which is the runaway. the superrational move there was to roll a die with as many sides as the expected number of responders and send 1 only on a roll of 1.

  design a runnable in-class activity, not a lecture. give me rules, materials, a payoff scheme that doesnt need real money (points toward something trivial is fine, like choosing the music or skipping a reading), a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the symmetric 1/20 strategy, the unilateral-deviation objection to it, and the lottery's runaway logic. also tell me what will predictably go wrong the first time i run it and how to handle it, and be honest about which part of the real thing a classroom cant reproduce (i suspect the no-communication condition and the stakes, but say what you actually think).
