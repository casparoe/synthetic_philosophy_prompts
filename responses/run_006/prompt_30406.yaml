answer: |-
  ### In-Class Activity: Superrationality Exploration via Platonia & Luring Lottery  
  **Course:** Upper-level undergraduate game theory (philosophy students)  
  **Students:** 20  
  **Time:** 80 minutes  
  **Goal:** Students *experience* the tension between standard game-theoretic reasoning ("What should I do given others' actions?") and superrational reasoning ("We’re symmetric copies, so we must all do the same thing") before the term "superrationality" is introduced.  

  ---

  ### **Materials**  
  - **Index cards** (40+): For secret decisions.  
  - **Whiteboard/flip chart:** To tally results.  
  - **Random number generator (RNG):** Phone app or website (e.g., random.org) for dice rolls.  
  - **Prize:** Trivial rewards (e.g., 3 bonus points for Platonia winner; 5 bonus points for Luring Lottery winner, redeemable for choosing class music/skipping a reading).  
  - **Timer:** For strict pacing.  

  ---

  ### **Rules & Payoff Scheme**  
  - **Platonia Dilemma Rules:**  
    - Each student secretly chooses **SEND** or **DON’T SEND** on an index card.  
    - **Win condition:** If *exactly one* student picks SEND, that student wins **3 bonus points**.  
    - **Lose condition:** If zero or >1 SEND, *no one* wins.  
    - **No communication allowed.** Cards submitted simultaneously.  

  - **Luring Lottery Rules:**  
    - Each student submits a number **e** (1 ≤ *e* ≤ 20) on an index card, representing "entries."  
    - **Total entries (T)** = Sum of all *e*.  
    - **Prize pool:** **5 bonus points** (split equally *per entry*).  
      - *Example:* If T = 100, each entry is worth 5/100 = 0.05 points.  
    - **Winner:** One entry is drawn randomly via RNG. The student who submitted that entry wins **their entries’ share** of the prize.  
      - *Example:* If a student submits *e*=5 and wins, they get 5 × (5/T) points.  
    - **Cost:** Each student **loses 0.1 points per entry** (to simulate effort/cost).  
      - **Net payoff:** [*(e / T) × 5*] – (0.1 × *e*)  
      - *Note:* Payoff can be negative (e.g., submitting 20 entries risks losing points).  

  ---

  ### **Timeline (80 Minutes Total)**  
  #### **Phase 1: Platonia Dilemma (25 min)**  
  - **0:00–0:05 (Intro):**  
    - *Instructor:* "We’re playing a game. Rules: Submit SEND or DON’T SEND. If *exactly one* sends, they win 3 bonus points. No talking."  
    - Hand out index cards.  

  - **0:05–0:08 (Play):**  
    - Students write **SEND**/**DON’T SEND** secretly. Collect cards.  

  - **0:08–0:12 (Reveal & Discuss):**  
    - Tally SEND votes on board. **Do not announce winner yet.**  
    - Ask: *"How did you decide? What did you assume others would do?"*  
    - *Predicted tension:* Most students will assume others won’t send and choose SEND → likely >1 sender. If 0 senders, discuss "fear of overlap."  

  - **0:12–0:25 (Deep Dive):**  
    - Announce result (usually 2–5 senders; rarely 0 or 1). If win occurs, celebrate but note it’s rare.  
    - Ask:  
      1. *"If we played again, what would you do? Why?"* → Students admit they’d still send, expecting others not to.  
      2. *"What if you KNEW others would send with probability p? What p maximizes the chance of exactly one winner?"*  
    - Guide calculation: For 20 players, P(exactly one SEND) = 20 × p × (1–p)^19. Max at **p = 1/20**.  
    - **Reveal tension:** *"If everyone does p=1/20, is it best for YOU to send with p=1/20... or ALWAYS send?"*  
      - If others use p=1/20, your P(win) if always send = P(no one else sends) = (19/20)^19 ≈ 37.7%.  
      - If you use p=1/20, your P(win) = (1/20) × (19/20)^19 ≈ 1.89%.  
      - → Deviating to "always send" seems better!  

  #### **Phase 2: Luring Lottery (30 min)**  
  - **0:25–0:30 (Intro):**  
    - *Instructor:* "New game. Submit a number *e* from 1 to 20. The prize is split *per entry*. You pay a small cost per entry. Net payoff: [(*e*/T) × 5] – (0.1 × *e*)."  
    - Show examples (e.g., if all submit 1, T=20, winner gets 0.25 points).  

  - **0:30–0:35 (Play):**  
    - Students write *e* secretly. Collect cards.  

  - **0:35–0:45 (Calculate & Reveal):**  
    - Sum *T* and announce it. Use RNG to draw winning entry.  
    - Announce winner and their net payoff. Share aggregate stats (e.g., average *e*, min/max *e*).  

  - **0:45–0:55 (Discuss):**  
    - Ask:  
      1. *"Why did you pick your *e*? Did you try to ‘outguess’ others?"*  
      2. *"If you knew others’ average *e*, would you submit the same? Higher? Lower?"*  
    - *Predicted tension:* Most submit *e*>1 (avg ~8–12). Winner’s payoff is modest (often 0.5–1.5 points).  

  #### **Phase 3: Debrief & Superrationality Reveal (25 min)**  
  - **0:55–1:05 (Map Tensions):**  
    - **Platonia Recap:**  
      - *Symmetric strategy:* p=1/20 maximizes group success.  
      - *Unilateral deviation:* If others use p=1/20, you profit by always sending. But if all do this, everyone loses.  
    - **Luring Recap:**  
      - *Runaway logic:* If all submit *e*, your best response is to match *e* (Nash equilibrium: *e* ≈ 10 for 20 players).  
      - *Symmetric optimum:* If all submit 1, average payoff = 0.15. If all submit 10, average = –0.05 → worse!  
      - *Superrational solution:* All submit 1 → but deviation to *e*>1 is tempting if you doubt others.  

  - **1:05–1:15 (Introduce Superrationality):**  
    - *Instructor:* "Both games share a tension. Standard game theory says: ‘Given others, can I do better by switching?’ But notice: You’re all *symmetric*—same info, same incentives. What if we assume we’re identical copies of the same reasoner? Then your action *must equal* others’ actions **before you even decide**."  
    - **Superrational reasoning:**  
      - Platonia: All must choose the same *p*. Only p=1/20 yields a prize.  
      - Luring: All must choose the same *e*. Only e=1 maximizes net payoff (0.15 > –0.05).  
    - Contrast:  
      - *Game theory:* "If others use p=1/20, I’ll always send!" → individually rational, mutually destructive.  
      - *Superrationality:* "If I always send, so will others → we all lose. So I must use p=1/20."  

  - **1:15–1:20 (Q&A + Conclusion):**  
    - Discuss: *"Does superrationality require ‘magical’ coordination? Or is it about rational symmetry?"*  
    - Note: Hofstadter’s view treats players as "frozen in mutual resemblance."  

  ---

  ### **Predictable Challenges & Mitigation**  
  1. **Platonia "accidental win" (1 sender):**  
     - *Probability:* ~1% (if students randomize).  
     - *Handle:* Celebrate but stress: *"Was this skill or luck? What if we played 100 times?"* Use it to highlight fragility.  

  2. **Luring calculation complexity:**  
     - *Issue:* Students may struggle with net payoff formula.  
     - *Handle:* Pre-calculate examples (e.g., e=1 vs. e=10) on the board. Use simple numbers (e.g., T=100).  

  3. **Low stakes reduce tension:**  
     - *Issue:* Trivial rewards may not mirror billion-dollar stakes.  
     - *Handle:* Emphasize *"Imagine this was real money"* in debrief. Ask students to verbalize frustration.  

  4. **Communication leaks:**  
     - *Issue:* Students may whisper or infer intentions.  
     - *Handle:* Strictly enforce silence. Use index cards for anonymity.  

  ---

  ### **What the Classroom Can’t Replicate**  
  - **True isolation:** Students see each other’s reactions (e.g., sighs, smiles), breaking "no communication."  
  - **High stakes:** Bonus points lack psychological weight of life-changing money, reducing deviation incentives.  
  - **Scale:** Platonia’s "trillion players" creates near-certainty of failure with deviation; 20 players make success plausible.  

  ---

  ### **Instructor Notes**  
  - **TA Script:** Provide TAs with a cheat sheet: key questions, payoff calculations, and timing alerts.  
  - **Pacing is critical:** Use a timer. If discussions lag, skip examples and focus on tension.  
  - **End with "Aha!":** Superrationality should feel like a revelation—not a lecture.  
  - **Optional follow-up:** Assign Hofstadter’s *Metamagical Themas* (1985) on superrationality.  

  This design forces students into the tension via failure (Platonia chaos, Luring suboptimal payoffs), then resolves it with symmetry. By the debrief, they’ll *feel* why Hofstadter’s idea is radical.
