     - Therefore, we are constrained to symmetric strategies.
     - In Platonia, the superrational strategy is to send with probability 1/20. 
     - In the Luring Lottery, the superrational strategy is to choose e_i=1.
  - Contrast with standard game theory: 
     - In standard game theory, we take others' strategies as given and best respond. In Platonia, if others are doing p=1/20, I should send for sure. In Luring, if others are doing e, I should choose e_i to solve the best response condition.
     - That leads to the Nash equilibrium: in Platonia, the mixed strategy (if everyone uses p=1/20) is not a Nash equilibrium because I want to deviate to sending for sure. In Luring, the Nash equilibrium is e_i=47.5 for our parameters.

  1:15-1:20 (5 min): Conclusion
  - Superrationality offers a way to achieve cooperation in symmetric games by assuming that all players are identical and will choose the same action.
  - It is a controversial but intriguing idea.

  Handling Potential Issues:
  - If in Platonia round 1 there is exactly one sender, celebrate and then ask: "What would you do if we played again? Would you send again? Would others?" Then they might see that if everyone sends, they lose. So they might not send next time? But we are only playing once. We can say: "In a one-shot game, we got lucky. But if we played many times, what strategy would work best?"
  - In the Luring Lottery, if everyone chooses 1, then we get the cooperative outcome. How likely? Not very. We can then discuss: "If we all chose 1, we would each get an expected net of 49. But if you suspect others might choose more, you might want to choose more to compete. And if you think others will choose 1, you might want to choose a lot to have a high chance of winning."

  Note: We are not running a second round of the Luring Lottery due to time.

  This plan runs a bit tight, especially the debrief. We might need to cut the open discussion short.

