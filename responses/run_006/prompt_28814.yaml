prompt: |-
  I'm designing a three-week module on moral luck for a seminar I teach called "Philosophy of Criminal Law." The students are law students with some philosophy background but no specialist knowledge of the moral luck literature. The module's animating question is: if a legislature actually took the problem of moral luck seriously, what would it change?

  The standard taxonomy — resultant luck (how things turn out), circumstantial luck (what situations you face), constitutive luck (your character and dispositions), and causal luck (how prior causes determine your actions) — each seems to threaten the retributive idea that punishment should track desert. But they don't all threaten it in the same way, and they don't all point toward the same legal reforms. Some might call for narrow doctrinal fixes, like eliminating the sentencing differential between attempts and completed crimes. Others might call for sweeping institutional redesign, like replacing retributive sentencing with something more consequentialist. And some might, on closer inspection, have no practicable legal implications at all — the philosophical argument may be sound but the legal translation may simply not go through.

  I'd like you to roleplay as a senior philosopher of law who has spent a career thinking about moral luck and criminal responsibility. Please think carefully and systematically. I want you to rank the four types of moral luck by how much practical weight their implications carry for criminal law reform — that is, if you could only reform the law in response to one type of moral luck, which would you pick, and why? For each type, identify the most concrete legal change it would motivate, and explain what makes that change more or less urgent than the alternatives. I also want you to flag any type of moral luck whose implications you think are overrated — where the philosophical argument is sound but the legal upshot is smaller than people assume, or where the proposed reform would create worse problems than it solves. The deliverable is a defended ranking, not a literature review. I care about the criteria you use to compare across types: importance of the injustice addressed, tractability of the legal reform, risk of unintended consequences, and how many other doctrines the change would destabilize.

  At the very end of your response, provide a one-sentence summary of your overall position, formatted as \answer{...}.
reasoning: |-
  Okay, the user is designing a three-week module on moral luck for a law seminar. They want me to roleplay as a senior philosopher of law with expertise in moral luck and criminal responsibility. The core question is how seriously considering moral luck would impact criminal law reform, specifically ranking the four types of moral luck by their practical weight for legal changes.

  Hmm, this is a sophisticated request. The user clearly understands the taxonomy but wants a practical, defended ranking rather than theory. They're asking me to evaluate based on concrete criteria: injustice addressed, reform tractability, unintended consequences, and doctrinal destabilization. 

  First, I need to mentally walk through each type of moral luck. Resultant luck seems most urgent - it's absurd that two identical reckless drivers face drastically different punishment just because one hit a pedestrian. This directly undermines desert principles in sentencing. The reform (equalizing attempt/completed crime sentences) is highly tractable; many jurisdictions already tinker with this. But I should acknowledge risks - it might weaken deterrence for completed harms.

  Circumstantial luck is trickier. While it feels unjust that Person A faces charges Person B avoids just because of situational differences, fixing this requires radical operational changes. Things like mandatory-minimum carveouts or "reasonable opportunity" defenses could backfire badly - imagine arguing "I would've committed tax fraud if given the chance!" in court. 

  Constitutive luck cuts deepest philosophically - after all, we don't choose our predispositions. But legally? Attempts to mitigate this lead down a rabbit hole of determinism that criminal law simply can't incorporate without collapsing. Sentencing might adjust for deprived backgrounds, but that's not really a moral luck fix - it's more about social justice. 

  Causal luck... honestly, this feels overrated in legal contexts. The whole causation framework in criminal law already handles proximate cause reasonably well. Trying to further minimize causal luck might require scrapping negligence standards, which would create chaos in tort and criminal law alike.

  Ranking them: Resultant > Circumstantial > Constitutive > Causal. Why? Resultant offers maximum "injustice reduction per reform effort." The sentencing fix is surgical, not seismic. Circumstantial gets second place because while reforms are messy, ignoring it leaves gaping fairness holes in conspiracy/entrapment doctrines. Constitutive and Causal are tied for last, but constitutive wins bronze because at least sentencing mitigation has practical value beyond moral luck debates. 

  Biggest red flag: don't overestimate circumstantial luck reforms. Academics love theorizing about "counterfactual innocence," but operationalizing it would be a prosecutor's nightmare. The user's students might not realize how quickly this collapses into unworkable testimony about hypothetical crimes.

  Final one-liner needs to pack a punch: Moral luck matters most where law can decouple blame from morally arbitrary outcomes without abandoning its core functions. There we go.
answer: |-
  ## Ranking Moral Luck Types for Criminal Law Reform: A Practitioner's Perspective  
  *(After 40 years at this crossroads of philosophy and doctrine)*  

  Let’s cut through the noise. Moral luck exposes cracks in retributive theory, but not all cracks threaten the foundation equally. My ranking prioritizes **practical impact**: where legal reform is most urgent, tractable, and destabilizing *without* collapsing the system. Here’s how I weigh them:  

  1. **Resultant Luck (Most Urgent Reform)**  
     * **Injustice Addressed**: Raw, visible unfairness. Punishing *identical culpable acts* (e.g., firing a gun) drastically differently based on flukes (hitting a victim vs. missing). Directly contradicts core desert principles.  
     * **Concrete Reform**: Eliminate/radically narrow the sentencing gap between completed crimes and attempts (e.g., attempted vs. completed murder).  
     * **Why Ranked Highest?**  
       - **Tractability**: Doctrinally straightforward. Many jurisdictions already cap attempt sentences (e.g., 20-year max for attempted murder vs. life). Full parity is feasible.  
       - **Impact**: Corrects a glaring, widespread injustice affecting thousands.  
       - **Destabilization Risk**: Low. Culpability assessment (intent, recklessness) remains intact; only outcome weighting changes.  
       - **Unintended Consequences**: Deterrence *might* weaken slightly for completed harms, but retributive gains outweigh this.  

  2. **Circumstantial Luck (High Potential, High Risk)**  
     * **Injustice Addressed**: Punishing people for being in "wrong place, wrong time" (e.g., Person A commits crime due to rare opportunity; identical Person B never faces temptation).  
     * **Concrete Reform**: Narrow overbroad criminalization (e.g., "omnibus" conspiracy laws) or create "reasonable opportunity" defenses (e.g., for entrapment-like scenarios beyond state inducement).  
     * **Why Ranked Second?**  
       - **Tractability**: Moderate. Requires legislative precision (e.g., redefining conspiracy *actus reus*) or novel defenses—operationally messy.  
       - **Impact**: Addresses systemic overreach in proactive policing/preventive law.  
       - **Destabilization Risk**: High. Threatens proactive enforcement tools (e.g., counter-terrorism).  
       - **Unintended Consequences**: Risk of under-deterring preparatory acts or creating unworkable "what-if" litigation. **Proceed cautiously**.  

  3. **Constitutive Luck (Philosophically Deep, Legally Limited)**  
     * **Injustice Addressed**: Punishing people for traits/capacities largely shaped by genetics/upbringing (e.g., impulsivity, temper).  
     * **Concrete Reform**: Mitigation in sentencing (not guilt) for severe deprivation/trauma, *not* general character excuses.  
     * **Why Ranked Third?**  
       - **Tractability**: Low. Requires individualized sentencing—already common but inconsistently applied.  
       - **Impact**: Modest. Courts already consider background; radical reform (e.g., eliminating responsibility for "unchosen" traits) would implode criminal law.  
       - **Destabilization Risk**: Extreme if applied to guilt phase. Erodes *mens rea* standards.  
       - **Unintended Consequences**: **Overrated concern**: Fear of "determinism excuse" is hyperbolic. Sentencing mitigation preserves proportionality without denying agency.  

  4. **Causal Luck (Most Overrated for Reform)**  
     * **Injustice Addressed**: External causal chains determining harm (e.g., Victim 1 dies because an ambulance is delayed; identical Victim 2 survives).  
     * **Concrete Reform**: None compelling. Already handled by proximate cause doctrine.  
     * **Why Ranked Last?**  
       - **Tractability**: N/A. Criminal law *already* filters remote causation (e.g., *novus actus interveniens*).  
       - **Impact**: Minimal. Proximate cause solves 95% of intuitively unfair cases.  
       - **Destabilization Risk**: High if "pure" causal luck were prioritized—would make negligence liability chaotic.  
       - **Why Overrated?**: Philosophers conflate metaphysical luck with legal doctrine. Courts rightly focus on foreseeability and intervening causes—tools that *manage* causal luck effectively. Reform here solves a non-problem.  

  ---  
  **Key Takeaways for Your Module**:  
  - **Resultant luck is the low-hanging fruit**: Sentencing parity for attempts/completed crimes is just, tractable, and necessary. Start here.  
  - **Circumstantial luck is the sleeper issue**: It demands reform but risks collateral damage—ideal for debating *feasible* limits to preventive justice.  
  - **Constitutive luck is legally contained**: Sentencing mitigation absorbs its force; pushing further is philosophically sound but legally self-defeating.  
  - **Causal luck is a red herring**: Proximate cause works; don’t fix what isn’t broken.  

  \answer{Resultant luck demands immediate sentencing reform; circumstantial luck warrants cautious rebalancing of criminalization; constitutive luck is best managed through mitigation; causal luck is already addressed by proximate cause doctrine.}
