prompt: |-
  ok so I'm taking this phil of perception class (it's called "Seeing and Believing" which is cheesy but whatever) and we've been deep in the cognitive penetration literature for like two weeks. The basic idea is that your beliefs and expectations can actually change your perceptual experience, not just your judgment about it — like, you literally see the banana as more yellow when you expect a banana, or you see two objects as more similar in color when you're told they belong to the same category. It's not just bias in how you report what you saw; the claim is it changes the seeing itself.

  My mom is a mammographer and over winter break I was rambling about this stuff and she got weirdly into it. She's been reading mammograms for like 22 years and shes good at it, but she admitted that when a referral note says "patient reports lump in upper outer quadrant," she catches herself staring at that quadrant longer and sometimes she honestly can't tell if she's seeing a faint density or just... expecting to see one. She asked if there was anything from what I'm studying that could actually help her in the reading room, not just "be aware of your biases" which she's heard a million times.

  So I want to give her something real. Can you write a procedure — like a checklist or a sequence of steps — for reading a mammogram that's grounded in what we actually know about cognitive penetration? It has to work in her actual workflow (she reads 30-40 scans a day, each one takes maybe 5-10 minutes), so it can't add more than a minute or two per case. It should be honest about which steps are genuine safeguards and which are just "pay attention" dressed up as procedure. 

  Then I want you to walk it through two cases: (1) a referral that mentions a palpable lump but the images look clean, and (2) a follow-up scan where there was an ambiguous finding six months ago that got biopsied and came back benign. And please tell me what the procedure straight-up cannot protect against — the places where cognitive penetration is just baked into the structure of the task and no amount of checklisting will save you.
