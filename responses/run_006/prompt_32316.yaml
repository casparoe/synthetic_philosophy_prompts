  The cost of rejecting (2) is actually minimal for ML epistemology. We just acknowledge that learning requires luck in choosing appropriate priors - but since we exist in a universe with stable regularities, that luck isn't accidental. It's why we can have domain-specific ML architectures that outperform generic ones.

