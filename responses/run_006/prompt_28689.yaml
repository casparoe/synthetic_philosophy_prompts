prompt: |-
  im writing a paper arguing that no single species concept can do all the work people want it to do, and before I read any more of the literature I want the spec sheet: what would an adequate account of what species are actually have to deliver? I keep seeing people defend their favorite concept because it handles one hard case — ring species, asexual lineages, bacteria with horizontal gene transfer, chronospecies in the fossil record, hybrid zones — and then quietly set aside the cases it mangles, and I cant tell which "a real theory has to handle X" demands are genuine and which are just what a particular subfield needs for its own convenience. Give me the desiderata, each with the case or consideration that makes it a requirement, and flag which are non-negotiable and which are camp-specific (systematists, population geneticists, paleontologists, conservation biologists). Include distinctions a theory can't collapse — like between a criterion for recognising species and a definition of what they are, or between species being real units in nature and being useful units for classification — and any results from population genetics or microbiology it can't contradict. If some subset of the desiderata can't be jointly satisfied, say a criterion that works for asexuals plus the requirement that species be the units that play the causal role in evolution, I want to know, because that's the actual argument of my paper. Then one line each on how the usual contenders (biological, phylogenetic, ecological, morphological, pluralist) do against the list. no citations needed, I just need the criteria.
reasoning: |-
  Okay, the user is writing a paper arguing against the idea that any single species concept can handle all cases. They want a clear list of what an adequate species concept must deliver, including non-negotiable criteria and field-specific needs. They're frustrated with how different concepts handle some cases but fail others. 

  First, I need to outline the core requirements for any species concept. The user mentioned key distinctions like criteria vs. definition, and realism vs. utility. Those are crucial. Then, population genetics fundamentals—species must account for lineage formation and divergence. 

  Non-negotiable criteria include lineage formation, divergence, and avoiding circular definitions. Field-specific needs vary: systematists care about monophyly, paleontologists about time-series data, conservationists about discrete units. 

  Cases like ring species, asexuals, and bacteria pose problems. For example, the biological species concept fails with asexuals, while phylogenetic concepts struggle with reticulate evolution. The ecological concept is vague on boundaries. 

  I should note where criteria conflict, like requiring reproductive isolation for evolutionary units but needing to include asexuals. Pluralism might be the only way out, but it has its own issues. 

  The user's paper hinges on showing that no single concept satisfies all desiderata. Highlighting the trade-offs, especially between realism and applicability, will strengthen their argument. They need clear, concise points without citations, focusing on the inherent conflicts in species concepts.
answer: |-
  Here's a specification sheet for what an adequate species concept must deliver, breaking down requirements, their justifications, and conflicts:

  **Core Distinctions a Concept MUST Respect:**
  1.  **Definition vs. Operational Criterion:** A definition tells us *what a species fundamentally is* (e.g., a lineage, a reproductive community). An operational criterion is *how we identify/delimit* them in practice (e.g., reproductive isolation, monophyly, ecological distinctness). A concept must clarify this distinction. *Non-negotiable.*
  2.  **Ontological Status vs. Utility:** Does the concept claim species are *real, discrete units existing in nature* (ontology), or are they primarily *useful constructs for human purposes* like classification or conservation (utility)? A concept must be clear about its claims. *Non-negotiable.*
  3.  **Process vs. Pattern:** The concept must account for both the *evolutionary processes* forming/maintaining species (e.g., selection, drift, gene flow barriers) and the resulting *evolutionary patterns* we observe (e.g., phenotypic clusters, genetic gaps, monophyly). *Non-negotiable.*

  **Non-Negotiable Requirements (Based on Evolutionary Reality):**
  4.  **Lineage Formation & Persistence:** Must explain how cohesive evolutionary lineages arise and maintain cohesion over time. *Justification:* Evolution acts on lineages; speciation is lineage splitting. *Case:* Any evolving population.
  5.  **Divergence:** Must explain how and why lineages become distinct (genetically, phenotypically, ecologically). *Justification:* The existence of biodiversity requires divergence. *Case:* Allopatric speciation, adaptive radiation.
  6.  **Compatibility with Population Genetics:** Cannot contradict fundamental principles (e.g., allele frequency change via selection/drift/mutation, the role of gene flow/barriers, coalescence theory). *Justification:* Species are evolving populations subject to these forces.
  7.  **Non-Circularity:** The definition/criteria cannot rely on the *outcome* of speciation (e.g., "species are groups that have speciated") as the primary defining feature. *Justification:* Need to define the *process/state*, not just the result.

  **Negotiable/Field-Specific Requirements:**
  8.  **Applicability to Asexual Lineages:** Must provide a principled way to delimit species in the absence of sexual reproduction. *Camp:* Microbiology, Botany (some groups), Conservation (microbes, some plants/animals). *Case:* Bdelloid rotifers, many bacteria.
  9.  **Handling Reticulate Evolution:** Must address lineages with significant horizontal gene transfer (HGT) or hybridization without complete lineage fusion. *Camp:* Microbiology, Botany, Zoology (hybrid zones). *Case:* Bacteria/Archaea with HGT, ring species, stable hybrid zones (e.g., *Ensatina* salamanders).
  10. **Temporal Dimension (Chronospecies):** Must provide criteria for delimiting species through time in the fossil record or molecular phylogenies. *Camp:* Paleontology, Macroevolution. *Case:* Gradual anagenesis in fossil sequences.
  11. **Monophyly Requirement:** Must require species to be monophyletic groups (all descendants of a common ancestor within the group). *Camp:* Systematics (especially cladistics/phylogenetics). *Justification:* Reflects shared evolutionary history for classification.
  12. **Discreteness (Diagnosability):** Must provide relatively clear boundaries between species for identification and classification. *Camp:* Taxonomy (all fields), Conservation (legal/practical listing). *Case:* Need for keys, databases, legal definitions.
  13. **Causal Role in Evolution:** Must position species as the primary *units* upon which macroevolutionary processes act (e.g., selection, extinction, speciation). *Camp:* Macroevolution, Paleobiology, some Evolutionary Biology. *Justification:* Understanding large-scale patterns.
  14. **Role as Evolutionary Independents:** Must explain how/why species are the entities evolving independently of each other. *Camp:* Population Genetics, Evolutionary Ecology. *Justification:* Fundamental to understanding adaptation and divergence dynamics.

  **Key Conflicts Between Desiderata:**
  *   **Asexuality (#8) vs. Causal Role/Evolutionary Independence (#13, #14):** Concepts emphasizing interbreeding/reproductive isolation (BSC) as the mechanism creating independent evolutionary units fail for asexuals. Defining independence for asexuals is notoriously difficult without reproductive isolation.
  *   **Monophyly (#11) vs. Rapid Speciation/Incomplete Lineage Sorting:** Requiring strict monophyly can be impossible for recently diverged species or those with gene flow, conflicting with pattern recognition (#12) and divergence (#5).
  *   **Discreteness (#12) vs. Reticulate Evolution (#9) & Chronospecies (#10):** Ring species, hybrid zones, and gradual anagenesis inherently challenge the idea of sharp boundaries.
  *   **Ontological Realism (#2) vs. Universal Applicability (#8, #9, #10):** Insisting species are real, discrete units like atoms becomes very difficult when faced with the fluidity in asexuals, HGT, hybridization, and gradual change.

  **How Contenders Fare (Briefly):**
  *   **Biological (BSC):** Nails #4, #5 (via isolation), #13, #14. Fails #8 (asexuals), #9 (hybridization/HGT), #10 (time), #11 (monophyly not required). Circularity (#7) issues. Strong ontology (#2).
  *   **Phylogenetic (PSC - multiple flavors):** Nails #1, #2 (often), #5 (pattern), #10, #11 (core), #12 (often). Struggles with #4 (process), #6 (coalescence vs. monophyly), #9 (reticulation), #13/#14 (units or outcomes?). Operational criteria vary wildly.
  *   **Ecological (ESC):** Nails #5 (via selection), #13 (role in ecosystems). Vague on #1, #2, #4 (process), #7, #12 (boundaries). Poor on #8, #9, #10, #11. Operationalization (#1) is major weakness.
  *   **Morphological:** Primarily an operational criterion (#1), not a definition. Useful for #12 (paleo, fossils) but fails #4, #5 (process), #6 (genetics), #8, #9, polymorphism. Confuses pattern with process.
  *   **Pluralism:** Acknowledges conflicts explicitly. Tries to satisfy all camps contextually (#8-#14). Risks sacrificing ontological clarity (#2) and universality, becoming meta-advice rather than a single concept. Doesn't resolve core conflicts, just avoids choosing.

  **Your Paper's Core Argument:** The irreconcilable conflicts (especially Asexuality vs. Evolutionary Independence, Discreteness vs. Reticulation/Gradualism) demonstrate that **no single concept can simultaneously satisfy the non-negotiable requirements of evolutionary process/pattern (#4, #5, #6) and the diverse operational needs arising from life's varied reproductive strategies and evolutionary tempos (#8, #9, #10) across all biological disciplines.** The "best" concept depends on the question and the organisms.
