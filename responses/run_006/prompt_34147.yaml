prompt: |-
  I'm a backend engineer who designs distributed systems — microservices, event stores, external caches, read replicas, the whole stack. I have no formal philosophy background, but a colleague described the extended mind thesis to me (Clark and Chalmers, 1998, I think) and it sounded uncannily like a debate about where to draw system boundaries. The core claim, as I understood it: when an agent uses an external resource — a notebook, a smartphone, a to-do app — as reliably and transparently as they use their biological memory, that external resource is not merely a tool but is literally part of the agent's cognitive system. The parity principle says, roughly, that if an external process plays the same functional role as an internal cognitive process, it should count as cognitive too. The classic example is Otto, who has a memory impairment and always consults his notebook, versus Inga, who remembers things normally. The claim is that Otto's notebook entries are his beliefs in the same sense that Inga's neural encodings are hers.

  I want you to restate this thesis — the parity principle, the Otto/Inga argument, the coupling conditions (reliable access, automatic endorsement, prior endorsement, etc.), the main objections (e.g., the charge that this conflates the cognitive with the merely causal, and the reply that the objection begs the question by assuming the skull is the boundary), and whatever else is central to the dialectic — entirely in the vocabulary of distributed systems and software architecture. Use terms like: in-process vs. out-of-process state, system boundaries, API contracts, cache coherence and invalidation, latency and bandwidth, tight coupling vs. loose coupling, external dependencies, state ownership, consistency models, the fallacies of distributed computing, and anything else from our world that maps. Go as far as you can: I want to see the philosophical thesis translated into something that could pass for an architecture decision record.

  Then give me the residue report. Which claims translate cleanly, where the distributed-systems analogue is a precise match? Which claims require distortion, and what exactly gets bent? And which claims have no counterpart at all in my vocabulary? For each piece of residue, tell me whether the gap is probably a defect in my vocabulary — something the philosophy captures that my engineering concepts miss — or whether it suggests the philosophical claim was less precise than it looked once you try to operationalize it.

  Lead with the bottom line in the first sentence — your overall verdict on how much of the extended mind thesis survives the translation — and then give the reasoning. No preamble, no restating the question.
