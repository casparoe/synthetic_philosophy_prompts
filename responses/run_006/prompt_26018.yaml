prompt: |-
  I'm in a philosophy of art reading group and last week we tackled Chapter 5 of Tolstoy's *What Is Art?* and honestly I've been chewing on one passage ever since without really getting it to click. The gist is this: Tolstoy says art isn't about producing beautiful objects or giving pleasure, but is a human activity where someone, having lived through a feeling, intentionally uses movement, lines, colours, sounds, or words to transmit that feeling to someone else so that the other person is infected by it and experiences the same feeling. He then says the degree of infectiousness—how powerfully the feeling grabs the receiver—is what distinguishes real art from counterfeit art, and it depends on three things: the individuality of the feeling, the clearness with which it's transmitted, and most of all the sincerity of the artist—the degree to which the artist actually feels what he's expressing. Then things take a turn I find genuinely unparsable: he says that the best art is that which conveys the highest feelings accessible to people of a given time, and that these highest feelings are always those that flow from the religious consciousness of the age—which for our time, he claims, is the consciousness that all people are brothers. He then dismisses a ton of what we'd normally call great art (Greek tragedy, Dante, Shakespeare, much of Beethoven) as bad art because it supposedly conveys feelings of class pride, courtly love, or heroic vanity rather than universal brotherhood.

  My friend in the group says it's a beautiful theory of art-as-communication but I can't see how the infection criterion actually separates art from things like a charismatic politician's speech that genuinely moves people to shared anger, or a parent weeping and making their child weep too. And the sincerity part seems to lead in a circle: we know the artist is sincere because the art infects us strongly, and we know it infects us strongly because the artist was sincere. Plus the whole religious consciousness of the age thing feels like it's importing a massive moral premise into what was supposed to be a definition of art as a kind of activity.

   I don't need a defense or a critique of Tolstoy, just help actually understanding what he's saying before I decide whether I buy it. Give me exactly five numbered points, each one or two sentances, that unpack the internal logic of his position: what the infection relation actually consists in, how sincerity is supposed to function without circularity, why he thinks non-universal feelings yield inferior art, and what the religious consciousness brings to the picture that a pure infection theory wouldn't have on its own. No introduction, no conclusion, just the five points.
reasoning: |-
  Okay, the user is struggling with Tolstoy's ideas in "What is Art?" specifically Chapter 5. They need clarification on key points: infection theory, sincerity, why universal feelings matter, religious consciousness, and how infection separates art from other emotional transmissions. 

  First, unpacking "infection": it's not just emotion transfer but a specific aesthetic transmission using symbolic forms. The politician example fails because it lacks the artistic medium—Tolstoy sees art as deliberate craft-mediated contagion.

  Sincerity isn't circular because it's the artist's internal state preceding creation. The infection's potency serves as evidence, not definition—like a fever proving illness exists independently.

  The universal brotherhood requirement ties to his moral framework. Art's value scales with its ethical content—infection strength determines if it's art, but moral elevation determines if it's good art. 

  Religious consciousness provides the era's moral compass. Without this, the infection theory could justify any emotion (like hate speech), so it anchors "highest feelings" objectively.

  Finally, infection distinguishes art by its means: intentional symbolic encoding. A parent's tears are raw emotion; art is that emotion reconstructed through form. The politician manipulates, the artist authentically shares.

  The user's frustration makes sense—Tolstoy smuggles morality into aesthetics. But his logic holds if you accept premises: art is moral communication first, craft second.
answer: |-
  Here are five numbered points unpacking Tolstoy's internal logic:

  1.  **Infection is direct emotional transmission:** It consists of the artist's feeling being precisely replicated in the receiver through the artwork's specific sensory elements (movement, sound, words, etc.), bypassing rational explanation or mere aesthetic pleasure.
  2.  **Sincerity is the causal origin:** The artist's genuine feeling during creation is the *source* powering the infectiousness; the strong reception *indicates* sincerity existed, but sincerity itself is an antecedent condition, not defined by the outcome (avoiding strict circularity).
  3.  **Non-universal feelings yield inferior art:** Art conveying feelings limited by class, nation, or historical period (e.g., aristocratic pride, courtly love) is "bad" because it fails Tolstoy's criterion of universality – it cannot infect *all* people with the feeling, contravening the brotherhood ideal.
  4.  **Religious consciousness defines "highest feelings":** It provides the specific, objective moral content ("universal brotherhood" in the modern era) that determines *artistic value*; infection strength defines *art as activity*, while the religious feeling defines *good* art.
  5.  **Infection distinguishes art via intentional symbolic encoding:** Unlike involuntary emotional contagion (a parent's tears), art requires the artist to deliberately *re-create* their feeling using crafted external symbols (movement, sound, etc.) specifically for transmission.
