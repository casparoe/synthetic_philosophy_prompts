prompt: |-
  I keep coming back to a frustration with the satisficing and bounded rationality literature: the term gets used for a stopping rule, for a decision criterion, for a family of heuristics, and for a claim about what rationality requires under limited computational resources, and these senses slide into one another without anyone laying out the full job description first. Before I read any further, I want the specification. What must an adequate theory of satisficing actually get right? Write the desiderata, each with the case or consideration that makes it a requirement. Cover at least the following terrain and tell me which items are genuine requirements and which are just the tastes of one research program: distinguishing satisficing from maximizing with search costs added back in; the setting and revision of aspiration levels, including what happens after repeated failure or easy success; the difference between satisficing as a criterion for accepting an option and satisficing as a description of how search unfolds; whether a satisficing model must be behaviorally distinguishable from an optimizing model with enough extra parameters, or whether outcome-equivalence to optimization is acceptable; how the theory handles lexicographic and other non-compensatory choice rules; and what it says about why satisficing can be rational rather than merely a bias induced by cognitive limitations.

  For each requirement, mark it negotiable or non-negotiable, and say which single requirement does the most work in eliminating candidate theories. Then, if any subset of the requirements is jointly unsatisfiable—for example, if process realism about bounded computation and equivalence to some optimizing model cannot both be had, or if a mandatory aspiration-adjustment rule conflicts with empirical findings about how people actually search—say so plainly, because that is the part I most want to see. Close with a brief scorecard of how Simon-style aspiration-level models, search-cost and rational-inattention treatments, and the fast-and-frugal heuristics program fare against the list, but keep the scorecard short; the criteria themselves are the deliverable.
reasoning: |-
  Okay, let me tackle this user's query. They're frustrated with the ambiguity in satisficing literature—how the term is used for stopping rules, decision criteria, heuristics, and rationality claims without clear distinctions. They want a set of desiderata for an adequate theory of satisficing, covering specific points like distinguishing satisficing from maximizing with search costs, aspiration level setting, the difference between criterion and search process, behavioral distinguishability, lexicographic rules, and why satisficing is rational beyond cognitive bias.

  First, I need to outline the core requirements. The user mentioned several key areas, so each should be addressed as a separate desideratum. Let me start by listing them out. Desideratum 1 should focus on defining satisficing as a non-compensatory stopping rule. That's crucial because without it, satisficing just becomes optimization with search costs. Simon emphasized this, so it's non-negotiable. 

  Next, aspiration levels—how they're set and adjusted. This is also non-negotiable because a theory needs to explain where they come from and how they change, otherwise it's incomplete. The user pointed out repeated failures or easy successes, so processes like adjustment based on experience must be included. 

  Desideratum 3 should distinguish between satisficing as a criterion versus a search process. That's key since the user is confused by the sliding between these uses. Making this distinction clear is non-negotiable to avoid conceptual mess. 

  Behavioral distinguishability is another point. The user asks whether satisficing must be different from optimization with extra parameters. I think it's negotiable because some theories might be outcome-equivalent but still useful. However, for a theory to claim it's truly satisficing, it should aim for falsifiability, so it's negotiable but important for empirical validity. 

  Handling non-compensatory rules like lexicographic choices is next. Satisficing naturally aligns with such rules, so this should be non-negotiable. It's a core aspect that differentiates it from compensatory maximizing. 

  Finally, the rationality argument. Why is satisficing rational beyond cognitive limitations? This needs a meta-rationality justification, showing it's resource-appropriate. Non-negotiable because without it, satisficing is just a bias. 

  Now, which requirement does the most work? Probably Desideratum 1. If a theory can't distinguish satisficing from optimizing with search costs, it fails fundamentally. That's the litmus test. 

  Are there conflicts? Yes, between D4 (behavioral distinguishability) and D5 (non-compensatory rules). If a theory uses compensatory aspiration adjustments, it might become indistinguishable from optimization. Also, D2 (aspiration adjustments) might conflict with empirical data if the prescribed rules don't match human behavior. 

  For the scorecard: Simon's models nail D1, D2, D5, and D6 but struggle with D4. Search-cost models fail D1 and D5 by turning into optimization. Fast-and-frugal heuristics do well on D1, D3, D4, D5 but might not fully address D6's meta-rationality. 

  I should make sure each desideratum is clearly marked as negotiable or not, and explain the conflicts. The user wants clarity on incompatibilities, especially between realism and optimization equivalence. Highlighting the conflict between D4 and D5/D1 is crucial. Also, ensuring the scorecard is concise but covers each model's strengths and weaknesses against the list.
answer: |-
  Here is a structured set of desiderata for an adequate theory of satisficing, with justifications, negotiability, and critical tensions highlighted. The goal is **conceptual clarity and empirical/theoretical robustness**:

  ### Core Desiderata (Non-Negotiable)
  1.  **Non-Compensatory Stopping Rule (The Litmus Test):**
      *   **Requirement:** Must define satisficing as a decision process terminating search upon encountering the *first* option meeting or exceeding a pre-set aspiration level, *without* comparing it to potentially better (but unsearched) alternatives. Optimization (even with search costs) always requires comparing expected marginal cost of further search to expected marginal benefit.
      *   **Why Non-Negotiable:** This is Simon's core distinction. Without it, "satisficing" collapses into optimizing with search/attention costs added back in. Eliminates theories that are merely optimization in disguise.
      *   **Case:** Choosing a "good enough" apartment on day 1 of a week-long search vs. calculating optimal stopping points.

  2.  **Aspiration Level Dynamics (The Engine):**
      *   **Requirement:** Must explicitly specify how aspiration levels are *initially set* (e.g., based on experience, expectations, environment) and crucially, how they *adapt* over time based on outcomes (success, failure, ease/difficulty of search).
      *   **Why Non-Negotiable:** Aspiration levels aren't magic. A theory ignoring how they form and change is incomplete and unrealistic. Explains persistence after failure ("lowering sights") and ambition after easy success ("raising the bar").
      *   **Case:** After failing several job interviews, lowering salary expectations; after easily finding a great restaurant, becoming pickier next time.

  3.  **Criterion vs. Process Distinction (Conceptual Hygiene):**
      *   **Requirement:** Must clearly separate: (a) **Satisficing as a Criterion:** The property of an option being "good enough" (relative to an aspiration level). (b) **Satisficing as a Process:** The heuristic *search strategy* that uses a stopping rule based on that criterion.
      *   **Why Non-Negotiable:** Prevents the conceptual slide the user identifies. A theory can use a satisficing *criterion* within a different *process* (e.g., exhaustive search finding all satisficing options). True "satisficing" typically refers to the *process* combining the criterion with limited search.
      *   **Case:** Knowing houses meeting your criteria (Criterion) vs. stopping your online search when you find the first house meeting your criteria (Process).

  4.  **Rationality under Boundedness (The Justification):**
      *   **Requirement:** Must provide a normative rationale for why satisficing *can be rational* (i.e., instrumentally effective) for agents with *genuinely* limited cognitive resources, time, or information access. This justification must go beyond describing it as a bias or error.
      *   **Why Non-Negotiable:** The core philosophical and practical claim of bounded rationality. Without this, satisficing is merely a descriptive model of cognitive limitations, not a model of *rational* adaptation to them.
      *   **Case:** Deliberately using a simple satisficing rule for routine decisions to conserve cognitive effort for critical ones (meta-rationality).

  ### Important But Negotiable Desiderata
  5.  **Behavioral Distinguishability (Falsifiability):**
      *   **Requirement:** *Ideally*, the theory should generate predictions distinguishable from *some* optimizing models (especially simple ones). However, outcome-equivalence to *highly parameterized* optimizing models may be acceptable if the satisficing model is simpler, more psychologically plausible, or better explains the *process*.
      *   **Why Negotiable:** Strict falsifiability against *all* possible optimizing models is likely impossible (equivalence can often be manufactured). The key is whether the satisficing model offers superior *explanatory power* (simplicity, process validity, ecological fit).
      *   **Case:** Satisficing search often predicts faster decisions with less option comparison than optimizing models with equivalent search cost assumptions.

  6.  **Compatibility with Non-Compensatory Choice (Natural Fit):**
      *   **Requirement:** The theory should naturally accommodate or explain lexicographic and other non-compensatory choice rules, as these align closely with aspiration-based "threshold" logic.
      *   **Why Negotiable:** While a strong theoretical and empirical fit, a core theory of satisficing *could* technically exist without directly addressing all non-compensatory rules, though this would be a weakness. It's highly desirable but not strictly definitional.
      *   **Case:** First screen job candidates based on a minimum qualification (satisficing/lexicographic), then perhaps optimize among those who pass.

  **The Most Eliminative Requirement: #1 (Non-Compensatory Stopping Rule).** This is the sharpest knife. Theories failing this (e.g., framing satisficing *only* as optimizing with search costs) are fundamentally not about satisficing in the bounded rationality sense.

  ### Potential Incompatibilities (The Tensions)

  1.  **D5 (Distinguishability) vs. D1 (Non-Compensatory Stopping) & D6 (Non-Compensatory Choice):** This is the **core tension**.
      *   *The Problem:* If a theory incorporates sufficiently complex (especially compensatory) rules for *setting and adjusting aspiration levels* (D2), it risks becoming computationally equivalent to an optimizing model with specific cost/benefit functions and search heuristics. This makes behavioral distinguishability (D5) very difficult. A theory focusing strictly on simple, non-compensatory aspiration adjustment might satisfy D1, D2 (simply), D5, and D6 but be criticized as unrealistic.
      *   *Implication:* You often must choose between **process realism/simplicity** (strong D1, D6, simple D2, achievable D5) and **descriptive completeness of complex adaptation** (complex D2, risking D5 failure and blurring D1). *They are hard to fully reconcile.*

  2.  **D2 (Aspiration Adjustment) vs. Empirical Variance:**
      *   *The Problem:* Mandating a *single, specific* normative rule for aspiration adjustment (D2) may conflict with empirical findings showing diverse, context-dependent, and sometimes inconsistent adjustment patterns in humans. A theory requiring a rigid adjustment rule might be falsified by this variance.
      *   *Implication:* D2 requires *a* mechanism, but it likely needs flexibility or context-dependence to match reality.

  ### Brief Scorecard Against Desiderata

  *   **Simon-Style Aspiration-Level Models:**
      *   **Strengths:** Excellent on D1 (core), D2 (focus), D3 (often implicit), D6 (natural fit). Good foundation for D4.
      *   **Weaknesses:** Often vague on precise D2 dynamics. Struggle with D5 (risk equivalence to search-optimization) if aspiration adjustment is compensatory. D4 sometimes underdeveloped.

  *   **Search-Cost / Rational Inattention Treatments:**
      *   **Strengths:** Formally rigorous on D4 (rationality), can model complex D2. Can sometimes achieve D5 against naive models.
      *   **Weaknesses:** **Fail D1 fundamentally.** They are optimizing models where "satisficing" is just an *outcome* of optimal stopping under costs, not a distinct non-compensatory process. Often weak on D3 (blur criterion/process), D6 (not core).

  *   **Fast-and-Frugal Heuristics (e.g., Take-The-Best, Satisficing Heuristic):**
      *   **Strengths:** Excellent on D1 (core), D3 (explicit), D5 (often easily distinguishable), D6 (core focus). Strong on D4 (ecological rationality/meta-rationality). Simple D2 mechanisms.
      *   **Weaknesses:** D2 mechanisms can be overly simplistic, criticized as not capturing the full complexity of human aspiration adaptation. Focus on specific heuristics may not provide a *unified* theory of aspiration level dynamics across contexts.

  **The Deliverable:** An adequate theory **must** satisfy D1-D4. D5 is highly desirable for empirical traction but potentially negotiable in the face of complex reality. D6 is strongly expected. The central tension lies in balancing realistic aspiration dynamics (D2) against the core non-compensatory stopping principle (D1) and the desire for falsifiability (D5).
