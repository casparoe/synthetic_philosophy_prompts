prompt: |-
  I run a small analytic unit in a government agency that produces time-sensitive risk assessments. Our inputs are rarely clean. A geospatial model says there is a 0.65 chance that a particular building is the facility in question; a human source says he is 70 percent confident that a meeting took place; a sensor-fusion system reports 80 percent confidence that a specific vehicle crossed a checkpoint overnight. My analysts have no formal training in formal epistemology, and their current habit is either to round these reports to binary findings ("the model said yes") or to treat the reported number as if it were an ordinary likelihood and plug it into a Bayesian calculation without asking what the number is a probability of. The assessments feed decisions about where to direct scarce investigative resources, so errors in either direction are costly, and every run of the procedure has to be signed off by a senior reviewer — it must leave an audit trail showing which numbers were inputs and which were judgments.

  Please write a reusable decision procedure, grounded in Jeffrey conditionalization, that my team can run on a single probabilistic report in under an hour, and that tells them when they cannot run it and must do something else instead. The procedure should cover: how to choose the partition of possibilities the report is actually evidence about; how to check whether the rigidity condition is plausible enough for Jeffrey's rule to apply at all; how to extract the input distribution from a source's "65 percent" without confusing it with a likelihood; when to abandon Jeffrey's rule and instead do ordinary conditioning on the fact that the source or model made the report, which requires different numbers; how to handle two probabilistic reports that arrive in sequence, including whether and why the order of processing can matter; and where the procedure must stop and hand the decision to a person because a judgment call is being dressed up as arithmetic. I am not asking for a reading list or citations; I want the operating logic, with the judgment calls marked as judgment calls.

  Please structure the response in these named sections, in this order: (1) The procedure, step by step, with explicit stop conditions — about 500 words; (2) What each step is doing, tying the steps to the elements of Jeffrey conditionalization and flagging which steps are judgment calls — about 400 words; (3) Two worked examples: a geospatial model assigning 0.65 that the building is the facility, and a human source's "70 percent confident the meeting occurred," with at least one example in which the procedure gives an answer the team will not like — about 500 words; (4) Where the procedure breaks, including cases where rigidity cannot be assumed and the order-of-reports problem — about 300 words; (5) What the procedure cannot do, stated honestly — about 200 words.
reasoning: |-
  We are designing a decision procedure for updating beliefs based on probabilistic reports using Jeffrey conditionalization. The procedure must be reusable, run in under an hour, and leave an audit trail.

  **Key Concepts:**
  - **Jeffrey Conditionalization**: A method for updating probabilities when new evidence does not specify a particular event but rather a probability distribution over a partition. It requires the rigidity condition: the conditional probabilities of other events given the partition must remain the same after the update.
  - **Partition**: A set of mutually exclusive and exhaustive events that the report is about.
  - **Rigidity Condition**: The conditional probabilities of other events of interest, given the partition, do not change when we update the probabilities of the partition elements.

  **Procedure Outline:**

  1. **Define the Question and Partition**:
     - Clearly state the question the report is addressing (e.g., "Is building X the facility?").
     - Partition the possibilities: typically two events (e.g., {Facility is building X, Facility is not building X}).

  2. **Check Rigidity Condition**:
     - Consider whether the report (e.g., a model output of 0.65) is based on information that is independent of other factors that might change the conditional probabilities of other events of interest. If the report is about the partition and the way the report was generated does not change the relationship between the partition and other events, then rigidity is plausible.

  3. **Extract Input Distribution**:
     - The reported number (e.g., 0.65) is the new probability for one of the partition events. For a binary partition, if the report says "0.65 chance that the building is the facility", then the input distribution is:
       - P_new(Facility is building X) = 0.65
       - P_new(Facility is not building X) = 0.35

  4. **When to Use Jeffrey vs. Standard Conditioning**:
     - If the report is a direct observation of an event (e.g., the model said "yes", meaning it observed the building being the facility) then use standard conditioning. But if the report is a probabilistic assessment (like 0.65) and we are updating the probability of the partition, then use Jeffrey.
     - However, if the report is about the source's output (e.g., the source said "70% confident") and we have a model of the source's reliability, then we might need to condition on the fact that the source made that statement (using standard conditioning on the statement) and that requires likelihoods (how likely the source is to say 70% when the meeting occurred vs. when it did not).

  5. **Handling Two Reports in Sequence**:
     - Process one report at a time. Update the entire probability distribution (including the partition and other events) using Jeffrey conditionalization for the first report, then use the updated distribution as the prior for the second report.
     - The order matters because the update is sequential and the second update uses the posterior from the first as prior.

  6. **Stop Conditions**:
     - Stop and hand to a human when:
       a) The partition cannot be clearly defined (e.g., the report is vague or about multiple overlapping events).
       b) Rigidity is violated (e.g., the report itself changes the conditional probabilities of other events given the partition).
       c) The report is not about a partition but about a continuous variable (unless discretized appropriately).
       d) The source of the report is not independent of other evidence in a way that breaks rigidity.
       e) The report is a statement about the source's own confidence and we have a reliability model (then standard conditioning might be needed, but that requires likelihoods we may not have).

  **Detailed Step-by-Step Procedure (Section 1):**

  **Step 1: Define the Partition (Judgment Call)**
     - Identify the event the report is directly about. This should be a clear, discrete set of possibilities. For simplicity, we often use a binary partition: {A, not A}.
     - Example: For a geospatial model report of 0.65, the partition might be A: "Building X is the facility", and not A: "Building X is not the facility".
     - If the report does not clearly map to a partition (e.g., it gives probabilities for multiple non-exclusive events), stop: this procedure is not applicable.

  **Step 2: Assess Rigidity (Judgment Call)**
     - Ask: "Does the way this report was generated affect the conditional probabilities of other events we care about, given the partition?"
     - Example: If we care about the presence of a specific person at the facility, and the geospatial model only looks at building features, then conditional probabilities about the person given the building might be unchanged by the model's report -> rigidity holds.
     - If rigidity is not plausible (e.g., the report also provides information that changes the likelihood of other events given the partition), stop: Jeffrey may not apply. Consider standard conditioning on the report if you have a reliability model (but that requires different inputs).

  **Step 3: Extract Input Distribution**
     - The reported probability for the event is the new probability for that partition element. For a binary partition, set:
          P_new(A) = r
          P_new(not A) = 1 - r
     - where r is the reported probability (e.g., 0.65). This becomes the input distribution for the partition.

  **Step 4: Update via Jeffrey Conditionalization**
     - For every other event B of interest, update its probability using:
          P_updated(B) = P_old(B | A) * P_new(A) + P_old(B | not A) * P_new(not A)
     - Note: This requires knowing the prior conditional probabilities P_old(B|A) and P_old(B|not A). These must be available from prior analysis.

  **Step 5: Handling Multiple Reports**
     - When a second report arrives (say, about the same partition or a different one), first update the entire probability distribution using the first report (Steps 1-4). Then, using the updated distribution as the new prior, repeat Steps 1-4 for the second report.
     - Important: The order of processing matters because the second update uses the posterior from the first. If the two reports are independent given the state of the world, the order should not matter in theory, but in practice (because of approximations and potential dependencies) we process in order of arrival.

  **Step 6: Audit Trail**
     - Document: the partition, the input distribution (reported probabilities), the prior probabilities (for the partition and for other events of interest), the conditional probabilities (for other events given the partition), and the updated probabilities.

  **Stop Conditions (Explicit):**
     - Stop at Step 1 if the report cannot be mapped to a partition.
     - Stop at Step 2 if rigidity is violated and we do not have the necessary likelihoods for standard conditioning.
     - Stop at Step 4 if we do not have the prior conditionals (P_old(B|A) and P_old(B|not A)) for an event B that is critical to the assessment.

  **Section 2: What Each Step is Doing**

  - **Step 1 (Define Partition)**: We are identifying the set of events that the report directly informs. This is the foundation of Jeffrey conditionalization. *Judgment call*: Choosing the right partition, especially when the report could be interpreted in multiple ways.

  - **Step 2 (Assess Rigidity)**: Rigidity is a critical assumption for Jeffrey conditionalization. We check whether the conditional probabilities of other events, given the partition, remain invariant under the update. *Judgment call*: Deciding whether rigidity holds based on the nature of the report and the context.

  - **Step 3 (Extract Input Distribution)**: The reported number is interpreted as the new probability distribution over the partition. This step avoids confusing the report with a likelihood (which would be P(report|A) vs. P(A)). We are taking the source's probability at face value for the partition.

  - **Step 4 (Update via Jeffrey)**: Using the formula, we propagate the change in the partition to other events. This step is mechanical once the partition, input distribution, and prior conditionals are fixed.

  - **Step 5 (Multiple Reports)**: We apply sequential updates. This is consistent with the Bayesian approach of updating beliefs incrementally. The order may matter if the reports are not independent.

  - **Step 6 (Audit Trail)**: This ensures transparency and reproducibility.

  **Section 3: Worked Examples**

  **Example 1: Geospatial Model (0.65 that building X is the facility)**

  *Step 1: Partition*
     - A: "Building X is the facility"
     - not A: "Building X is not the facility"

  *Step 2: Rigidity*
     - Assume the geospatial model uses satellite imagery and does not provide information about activities inside the building. If we are also interested in event B: "The facility is producing hazardous material", then we assume that P(B|A) and P(B|not A) are unchanged by the report. Rigidity holds.

  *Step 3: Input Distribution*
     - P_new(A) = 0.65, P_new(not A) = 0.35

  *Step 4: Update*
     - Suppose our prior was P_old(A)=0.5 (we had no idea).
     - We care about event B: "The facility is producing hazardous material". We have prior assessments: 
          P_old(B|A) = 0.8 (if it's the facility, high chance of production)
          P_old(B|not A) = 0.1 (if not, low chance)
     - Prior for B: P_old(B)= P_old(B|A)*0.5 + P_old(B|not A)*0.5 = 0.8*0.5 + 0.1*0.5 = 0.45
     - Update for B:
          P_updated(B) = P_old(B|A)*P_new(A) + P_old(B|not A)*P_new(not A)
                       = 0.8*0.65 + 0.1*0.35 = 0.52 + 0.035 = 0.555

  *Result*: The updated probability of hazardous material production is 0.555.

  **Example 2: Human Source (70% confident the meeting occurred)**

  *Step 1: Partition*
     - A: "The meeting occurred"
     - not A: "The meeting did not occur"

  *Step 2: Rigidity*
     - Consider event C: "The organization is planning an attack". We must assess whether the source's report about the meeting changes our beliefs about the relationship between the meeting and the attack. For example, if the source is reporting on a meeting that is a planning session, then the meeting occurring might be directly related to planning. But the source's report itself doesn't change the conditional probability of an attack given the meeting? Actually, the conditionals P(C|A) and P(C|not A) should be about the world, not about the report. However, if the source's report is the only reason we are updating the meeting, then rigidity might hold. But note: if the source is unreliable, we might need to model that. This is a judgment call.

  *Alternative Approach*: Sometimes, we might treat the report as evidence about the meeting and use standard conditioning. We would need a reliability model: 
     - Let M: meeting occurred.
     - Let R: the source says "70% confident".
     - But the source did not say "yes" or "no", but gave a confidence. We would need P(R|M) and P(R|not M). How likely is the source to say 70% when M is true vs false? Without a calibrated model of the source, we don't know. So we might have to take the 70% at face value and use Jeffrey.

  *Proceeding with Jeffrey*: We decide rigidity holds for event C (planning an attack) because we believe that the source's report does not change the relationship between the meeting and the attack.

  *Step 3: Input Distribution*
     - P_new(A) = 0.7, P_new(not A) = 0.3

  *Step 4: Update*
     - Prior for A: say 0.5 (we had no prior information).
     - We have prior conditionals for C (planning an attack):
          P_old(C|A) = 0.9   (if meeting occurred, high chance of planning)
          P_old(C|not A) = 0.2 (if not, still a small chance)
     - Prior for C: 0.9*0.5+0.2*0.5=0.55
     - Update for C:
          P_updated(C) = 0.9*0.7 + 0.2*0.3 = 0.63 + 0.06 = 0.69

  *Result*: The updated probability of an attack being planned is 0.69.

  **Example 3: When the Team Won't Like the Answer (Using the human source example)**

  Suppose we have a prior belief that the meeting is very unlikely because the key person was out of the country. Our prior P_old(A)=0.1. The source reports 70% confidence. We update to P_new(A)=0.7. But if we have a prior conditional for event D: "The key person was present at the meeting" given A, say P_old(D|A)=0.99 (if the meeting occurred, the person was almost certainly there). Then update D:

     P_updated(D) = P_old(D|A)*P_new(A) + P_old(D|not A)*P_new(not A)
                  = 0.99*0.7 + P_old(D|not A)*0.3

  But note: if the meeting did not occur (not A), then the person was definitely not present? So P_old(D|not A)=0.

     => P_updated(D)=0.99*0.7 + 0 = 0.693

  However, our prior belief about the key person being out of the country might conflict with this. The update does not consider the conflict because rigidity is assumed. The team may not like that the updated probability of the person being present is 0.693, which might contradict the prior belief that the person was out of the country. This conflict suggests that the partition A and the event D are not independent of the travel status. The rigidity condition might be violated if the report about the meeting also implies the person was in the country. In such a case, we must stop and re-assess.

  **Section 4: Where the Procedure Breaks**

  - **Rigidity Violation**: If the report changes the conditional probabilities of other events given the partition, then Jeffrey conditionalization is invalid. For example, if the geospatial model report of 0.65 was based on heat signatures that could also indicate production of hazardous material, then P(B|A) and P(B|not A) might change because the report is also evidence about B. Then we need a different approach, such as expanding the partition or using standard conditioning on the entire report.

  - **Order of Reports**: If two reports are about the same partition and are not independent, the order of update can affect the result. For example, if two human sources report on the same meeting, and the second source is known to be influenced by the first, then updating in the order of arrival might double-count the first source's influence. The procedure assumes reports are processed in order and independently, but if there is known dependence, we might need to combine them in a single step (which is beyond this procedure).

  - **Lack of Prior Conditionals**: Without prior conditional probabilities for events of interest given the partition, we cannot update those events. We might have to estimate them, but that is a judgment call and introduces uncertainty.

  - **Continuous or Complex Partitions**: If the report is about a continuous variable (e.g., the probability that the facility produces between X and Y units) and we cannot discretize meaningfully, the procedure breaks.

  **Section 5: What the Procedure Cannot Do**

  - **Handle Non-Rigid Updates**: It cannot update when rigidity is violated without additional modeling (like expanding the partition or using standard conditioning with likelihoods).

  - **Combine Multiple Reports Simultaneously**: It updates sequentially. If multiple reports are interdependent, the sequential update may be suboptimal.

  - **Calibrate Unreliable Sources**: It takes reported probabilities at face value. If a source is known to be overconfident (e.g., their 70% is only correct 50% of the time), the procedure does not account for that. For that, we need a reliability model and standard conditioning.

  - **Resolve Conflicts with Prior Knowledge**: As in Example 3, if the update leads to a conflict with prior knowledge, the procedure does not flag it unless it breaks rigidity. It is the analyst's job to notice and stop.

  - **Deal with Vague or Non-Probabilistic Reports**: If the report is not a clear probability (e.g., "likely", "unlikely") and cannot be quantified, the procedure is not applicable.

  - **Provide Decisions**: It only updates probabilities. The decision to allocate resources must be made by humans based on the updated probabilities, costs, and constraints.
answer: |-
  ### (1) The Procedure, Step by Step

  **Precondition**: You have a prior probability distribution (from previous analysis or default priors) and a new probabilistic report (e.g., "65% chance the building is the facility"). The procedure updates beliefs for actionable events (e.g., "risk of attack").

  **Inputs**:  
  - Prior probabilities for all events of interest.  
  - A single probabilistic report (e.g., "0.65" for event A).  
  - Known conditional probabilities (e.g., P(B|A) for other events B).  

  **Output**: Updated probabilities or a stop signal.  
  **Time Limit**: 45 minutes (max).  
  **Audit Trail**: Document all inputs, judgments, and calculations.  

  #### Steps:  
  1. **Define the Partition (5 min)**:  
     - Identify the event **A** the report directly addresses (e.g., "Building X is the facility").  
     - Define the partition as **{A, ¬A}** (binary).  
     - *Stop if not binary or if overlapping events* (e.g., report covers "building X or Y"). Proceed only if cleanly mappable.  

  2. **Assess Rigidity (10 min)**:  
     - For each critical event **B** (e.g., "attack planned"), ask:  
       *"If we learn A is definitively true/false, would P(B|A) or P(B|¬A) change due to this report?"*  
     - Rigidity holds if **all** conditional probabilities **P(B|A)** and **P(B|¬A)** remain unchanged by the report.  
     - *Stop if rigidity violated* (e.g., geospatial model’s "0.65" also implies new intel about terrain affecting attack plans).  

  3. **Extract Input Distribution (2 min)**:  
     - Treat the report’s number **r** as the **new probability for A**, not a likelihood.  
     - Set: **P_new(A) = r**, **P_new(¬A) = 1 − r**.  
     - *Do not use r in Bayes’ rule (e.g., avoid P(report|A)).*  

  4. **Apply Jeffrey Conditionalization (10 min)**:  
     - For each event **B**, compute:  
       **P_updated(B) = P_prior(B|A) × P_new(A) + P_prior(B|¬A) × P_new(¬A)**.  
     - Use pre-existing **P_prior(B|A)** and **P_prior(B|¬A)** (from historical data or expert judgment).  
     - *Stop if prior conditionals are missing*; do not guess.  

  5. **Handle Multiple Reports (15 min)**:  
     - **First report**: Update all probabilities using Steps 1–4.  
     - **Second report**: Repeat Steps 1–4 using the updated distribution as the new prior.  
     - *Process in order received* (order matters if reports conflict).  
     - *Stop after two reports*; complex dependencies require human review.  

  6. **Review and Sign Off (3 min)**:  
     - Flag all judgment calls (partition choice, rigidity, prior conditionals).  
     - Senior reviewer checks:  
       - Partition alignment with report.  
       - Rigidity justification.  
       - Audit trail completeness.  

  **Stop Conditions Summary**:  
  - Undefined/non-binary partition.  
  - Rigidity violated.  
  - Missing prior conditionals.  
  - >2 reports or interdependent reports.  
  - Report is vague (e.g., "likely") or non-probabilistic.  

  ---

  ### (2) What Each Step is Doing  

  **Step 1: Define the Partition**  
  - *Purpose*: Isolates the event **A** the report directly informs (Jeffrey’s "input partition").  
  - *Jeffrey link*: Partitions define where the new probability (P_new(A)) is applied.  
  - *Judgment call*: Choosing **A** (e.g., "building is facility" vs. "building is operational"). Incorrect choice corrupts the update.  

  **Step 2: Assess Rigidity**  
  - *Purpose*: Ensures conditional probabilities (e.g., P(B|A)) are invariant under the update, per Jeffrey’s rule.  
  - *Jeffrey link*: Rigidity justifies using P_prior(B|A) in the update formula.  
  - *Judgment call*: Deciding if the report introduces information beyond **A** (e.g., a "70% meeting confidence" implying new logistics). If yes, rigidity fails.  

  **Step 3: Extract Input Distribution**  
  - *Purpose*: Converts the report’s "r" to P_new(A), avoiding confusion with likelihoods (P(report|A)).  
  - *Jeffrey link*: P_new(A) is the direct input for Jeffrey’s rule.  
  - *Not a judgment*: Mechanical (P_new(A) = r).  

  **Step 4: Apply Jeffrey Conditionalization**  
  - *Purpose*: Propagates uncertainty from **A** to other events **B** using rigidity.  
  - *Jeffrey link*: Implements the formula **P(B) = P(B|A)P_new(A) + P(B|¬A)P_new(¬A)**.  
  - *Judgment call*: None if prior conditionals exist; else stop.  

  **Step 5: Handle Multiple Reports**  
  - *Purpose*: Sequential updates avoid combinatorial explosions.  
  - *Jeffrey link*: Each report updates the partition; order matters because the second update uses the first’s output as prior.  
  - *Judgment call*: Deciding report order (use receipt time unless logic dictates otherwise).  

  ---

  ### (3) Worked Examples  

  #### Example 1: Geospatial Model (0.65 for "Building X is Facility")  
  **Setup**:  
  - Event **A**: "Building X is the facility".  
  - Critical event **B**: "Attack planned" (P_prior(B|A) = 0.8, P_prior(B|¬A) = 0.1).  
  - Prior: P_prior(A) = 0.5.  
  - Report: r = 0.65.  

  **Procedure**:  
  1. **Partition**: {A, ¬A} (clean; report directly addresses A).  
  2. **Rigidity**: Assume model only identifies buildings; no effect on P(B|A) or P(B|¬A). Holds.  
  3. **Input**: P_new(A) = 0.65, P_new(¬A) = 0.35.  
  4. **Update B**:  
     P_prior(B) = P(B|A)P_prior(A) + P(B|¬A)P_prior(¬A) = (0.8)(0.5) + (0.1)(0.5) = 0.45.  
     P_updated(B) = (0.8)(0.65) + (0.1)(0.35) = 0.52 + 0.035 = **0.555**.  
  **Result**: Attack probability rises from 0.45 to 0.555.  

  #### Example 2: Human Source ("70% Confident Meeting Occurred")  
  **Setup**:  
  - Event **A**: "Meeting occurred".  
  - Critical event **C**: "Operatives deployed" (P_prior(C|A) = 0.7, P_prior(C|¬A) = 0.01).  
  - Prior: P_prior(A) = 0.3 (low intel).  
  - Report: r = 0.70.  

  **Procedure**:  
  1. **Partition**: {A, ¬A} (report is about A).  
  2. **Rigidity**: Source’s confidence doesn’t change P(C|A) or P(C|¬A). Holds.  
  3. **Input**: P_new(A) = 0.70, P_new(¬A) = 0.30.  
  4. **Update C**:  
     P_prior(C) = (0.7)(0.3) + (0.01)(0.7) = 0.21 + 0.007 = 0.217.  
     P_updated(C) = (0.7)(0.70) + (0.01)(0.30) = 0.49 + 0.003 = **0.493**.  
  **Result**: Deployment probability doubles to 0.493.  

  **Unpopular Outcome**:  
  - Prior: P_prior(A) = 0.01 (strong evidence meeting canceled).  
  - Report: r = 0.70 (source insists meeting happened).  
  - Update: P_new(A) = 0.70, but P_prior(C|A) = 0.7, P_prior(C|¬A) = 0.01.  
    P_updated(C) = (0.7)(0.70) + (0.01)(0.30) = 0.493.  
  - **Why disliked**: Prior (0.01) conflicts with report (0.70). Jeffrey forces acceptance, ignoring prior conflict. *Stop if rigidity questionable* (e.g., source’s report implies prior is wrong).  

  ---

  ### (4) Where the Procedure Breaks  

  **Rigidity Failures**:  
  - Geospatial model’s "0.65" uses heat signatures; if heat also indicates weapon production (affecting P(B|A)), rigidity fails.  
  - Human source’s "70%" implies he was coerced, changing P(C|A).  
  - *Mitigation*: Abandon Jeffrey. Use standard conditioning on the report itself (e.g., P(A | source said "70%"), but this requires likelihoods like P(source says 70% | A), which are usually unavailable.  

  **Order-of-Reports Problem**:  
  - Report 1: Sensor fusion (0.8 confidence vehicle crossed checkpoint).  
  - Report 2: Human source (0.6 confidence same vehicle was hostile).  
  - If processed sequentially:  
    - Update with Report 1 → new P(vehicle crossed).  
    - Update with Report 2 → uses updated prior, so source’s report is weighted by sensor’s.  
  - Reverse order: Source’s report has less influence.  
  - *Why it matters*: If reports are dependent (e.g., source knew sensor result), order amplifies bias. Procedure assumes independence; violations cause errors. Stop after two reports.  

  **Other Breaks**:  
  - Non-probabilistic reports (e.g., "likely").  
  - Reports about continuous variables (e.g., "80% chance facility output > 100 units"). Discretization requires human judgment.  

  ---

  ### (5) What the Procedure Cannot Do  

  1. **Handle rigidity violations**: It cannot model how reports affect conditional probabilities (e.g., if a report changes P(B|A)). Requires fallback to standard conditioning, which needs unreliable likelihoods (e.g., P(source says X | event)).  
  2. **Resolve conflicts with priors**: Jeffrey forces updates even if reports contradict strong prior knowledge (see Example 2). Human intervention is needed to reconcile.  
  3. **Calibrate sources**: Treats "70%" as ground truth; cannot adjust for overconfident sources (e.g., if "70%" is historically only 50% accurate).  
  4. **Combine >2 reports**: Sequential updates with >2 reports magnify errors from order effects or dependencies.  
  5. **Replace human judgment**: For defining partitions, assessing rigidity, or interpreting vague inputs (e.g., "high confidence"), it defers to analysts. The math cannot validate its own inputs.  

  **Final Output**: Probabilities for decisions—not decisions themselves. Resource allocation requires cost-benefit analysis beyond probabilities.
