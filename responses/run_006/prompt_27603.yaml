prompt: |-
  I'm on the committee at my university that decides which courses can count toward the science distribution requirement, and we vote next week on whether to approve a course in evolutionary psychology. I'm supposed to be consistant with our own past decisions, but I can't tell what rule we've been running, and I don't want to just vote my priors.

  Here's what we've done in the last two years. Approved: a paleontology course that's all historical reconstruction and can't run experiments (a few people grumbled that you can't rerun the Cambrian, but it passed because it makes specific risky claims about where fossils should turn up); a cosmology course that's purely observational; an evolutionary biology course; and a climate modeling course, which is all simulation and no lab work. Rejected: psychoanalysis, on the grounds that it's unfalsifiable; homeopathy, on the grounds that it keeps failing tests; string theory for non-majors, because it has no contact with data yet; and astrology, obviously.

  The new proposal is a survey of evolutionary psychology: mate choice, cheater detection, sex differences, the usual. Supporters say it's just evolutionary biology applied to humans and we already approved that. Opponents say it's psychoanalysis with better branding, adaptive stories that can be bent to fit anything. I can see both.

  What should we decide if we want to be consistent with ourselves? Which of our precedents is the closest analog? And if our precedents genuinely underdetermine it, what principle would we be adopting with each choice? Finally, if you had to bring one more course proposal to the next meeting to force the rule out into the open, what would it be?
reasoning: |-
  Okay, let me start by understanding the user's situation. They're on a committee deciding if evolutionary psychology should count for a science requirement. The user wants consistency with past decisions but is confused about the underlying rule. They provided examples of approved and rejected courses, highlighting the tension between evolutionary psychology being seen as either legitimate science or unfalsifiable storytelling.

  First, I need to analyze the approved courses: paleontology, cosmology, evolutionary biology, and climate modeling. What do they have in common? They all involve empirical testing, even if not experimental. Paleontology uses fossil predictions, cosmology relies on observations like cosmic microwave background, evolutionary biology tests through genetics and biogeography, and climate models are validated against real data. So, the key seems to be testability against evidence, not necessarily experiments or labs.

  Now, the rejected courses: psychoanalysis (unfalsifiable), homeopathy (fails tests), string theory for non-majors (no data), astrology (no empirical basis). The common thread here is a lack of empirical testability or repeated failures when tested.

  The debate around evolutionary psychology is whether it's testable like evolutionary biology or unfalsifiable like psychoanalysis. Supporters argue it's applied evolutionary biology, which was approved. Opponents say it's just-so stories, adaptive narratives that can't be disproven. So the crux is whether evo psych hypotheses can be and are tested rigorously.

  Looking at precedents, evolutionary biology was approved, which is a point in favor. But the rejection of psychoanalysis due to unfalsifiability is a concern if evo psych is seen similarly. The difference might be in methodology: does evo psych use cross-cultural studies, neuroscience, genetics, and experiments to test hypotheses? If yes, it aligns with approved courses. If not, it's closer to psychoanalysis.

  The user needs a principle derived from past decisions. The unifying rule seems to be "empirical testability and engagement with evidence." Even courses without experiments (paleontology, cosmology) were approved because they make testable predictions. Evo psych must meet that standard. The committee would need to evaluate the specific course's syllabus for methods that allow hypothesis testing.

  If precedents underdetermine the decision, approving evo psych would adopt a broader view of science including historical and observational sciences. Rejecting it would emphasize strict falsifiability and experimental rigor, possibly excluding some approved courses like cosmology.

  To force the rule into the open, proposing a course on string theory for physics majors could highlight the difference between speculative but testable theories vs. untestable ones. Or a course on cultural evolution to see if the committee accepts non-biological evolutionary approaches, testing the boundaries of "evolutionary."

  The user might also need to consider if the committee values interdisciplinary approaches or strict adherence to traditional lab-based sciences. They might be seeking not just consistency but also a defensible rationale to present during the vote. Ensuring the decision doesn't set a precedent that undermines future choices is probably important too.
answer: |-
  Based on your committee's precedents, here's a breakdown of the evolutionary psychology decision and how to force clarity:

  **The Core Principle from Precedents: Empirical Testability & Engagement with Evidence**

  Your committee consistently approves courses that, **despite lacking traditional lab experiments or direct manipulation, engage rigorously with empirical evidence to test specific, potentially falsifiable claims.** Conversely, you reject courses that lack this empirical grounding, either because they are fundamentally unfalsifiable, repeatedly fail tests, or have no meaningful contact with data.

  *   **Approved Examples Illustrating This:**
      *   **Paleontology:** Relies on fossil evidence; makes specific, testable *predictions* about where fossils *should* be found ("risky claims"). Success is measured by finding (or not finding) predicted evidence.
      *   **Cosmology:** Relies on observational data (telescopes, CMB, redshift); tests models against this data. Predictions about cosmic structure, expansion rate, etc., are falsifiable by new observations.
      *   **Evolutionary Biology:** Builds testable hypotheses about adaptation, phylogeny, etc., using comparative anatomy, genetics, biogeography, and fossil evidence.
      *   **Climate Modeling:** Simulates complex systems but crucially, models are *validated against* and *make predictions about* real-world climate data (temperature, ice cores, sea levels). Failed predictions lead to model refinement.

  *   **Rejected Examples Illustrating This:**
      *   **Psychoanalysis:** Rejected for being "unfalsifiable." Core concepts (id, ego, superego, repressed memories) are difficult or impossible to test definitively against evidence.
      *   **Homeopathy:** Explicitly rejected for "failing tests." It makes specific claims (dilution + succussion creates effect, "like cures like") that have been robustly tested and falsified.
      *   **String Theory (for non-majors):** Rejected due to "no contact with data yet." While mathematically sophisticated, it currently lacks empirical predictions that can be tested with existing or foreseeable technology.
      *   **Astrology:** Makes specific predictions about human affairs based on celestial bodies, repeatedly falsified by controlled tests.

  **Evolutionary Psychology: The Crucial Question for Consistency**

  The key question for consistency is **not** whether it involves lab experiments (like paleontology or cosmology, it often doesn't), but **whether the specific hypotheses presented in *this course* are treated as empirically testable and are actively engaged with evidence in a way that allows for potential falsification.**

  *   **Argument for Approval (Closest Analog: Evolutionary Biology):** If the course rigorously presents hypotheses (e.g., about mate choice preferences, kin recognition mechanisms, cheater detection modules) and then examines the diverse evidence used to test them (cross-cultural studies, behavioral experiments, neuroscience, genetics, comparative primatology, historical data), it aligns strongly with the approved **Evolutionary Biology** course. It applies the same core biological principles to humans. Supporters are correct on this point *if* the methodology is presented as testable.
  *   **Argument for Rejection (Closest Analog: Psychoanalysis):** If the course primarily presents "just-so stories" – plausible-sounding adaptive explanations for human behaviors that are flexible enough to explain any outcome and aren't subjected to rigorous testing against alternative hypotheses or null models – then it aligns with **Psychoanalysis**. Critics have a point if the course lacks critical examination of methodological challenges (e.g., reconstructing past environments/selection pressures, identifying adaptations vs. byproducts vs. noise, potential for cultural explanations) and doesn't showcase how evidence *falsifies* specific hypotheses.

  **Decision Paths & Implicit Principles:**

  1.  **Approve Evolutionary Psychology:**
      *   **Implicit Principle Adopted:** "Scientific rigor encompasses historical sciences and sciences studying complex systems where direct experimentation is often impossible or unethical. What matters is the formulation of testable hypotheses and critical engagement with diverse lines of empirical evidence (observational, comparative, experimental where possible, neurobiological, genetic) to support or falsify those hypotheses. Applying evolutionary theory to human behavior, with appropriate methodological rigor, falls within this scope, just as applying it to non-human biology does."
      *   **Consistency:** Consistent with approving Evolutionary Biology, Paleontology, Cosmology. Focuses on the *methodology* and *testability* rather than the *subject matter* (human behavior).

  2.  **Reject Evolutionary Psychology:**
      *   **Implicit Principle Adopted:** "The methodological challenges inherent in applying evolutionary theory to complex human behavior (reconstructing past selection, disentangling adaptation from other factors, pervasive cultural influences) are so significant that the field, *as commonly practiced or as presented in this specific course*, often fails to meet the standard of rigorous empirical testability and falsification required. It risks devolving into unfalsifiable storytelling akin to psychoanalysis, despite its biological framing."
      *   **Consistency:** Consistent with rejecting Psychoanalysis and (indirectly) String Theory for non-majors. Focuses on perceived *epistemological weaknesses* specific to this application, distinguishing it from "harder" evolutionary biology or cosmology.

  **Forcing the Rule into the Open: Proposed Course**

  To definitively expose the underlying rule, propose a course on **"String Theory for Physics Majors"** next semester.

  *   **Why it Forces the Issue:**
      *   **Direct Contrast:** It directly contrasts with the *rejected* "String Theory for Non-Majors." The rejection reason was "no contact with data yet." A majors course would delve into the mathematical structure, the *specific predictions* it *does* make (even if currently untestable, like certain signatures in the CMB or gravity waves), the ongoing theoretical work to find testable predictions, and the experimental/observational efforts aimed at *eventually* testing it (e.g., particle colliders, cosmology surveys).
      *   **Tests the Core Principle:** Does the committee value:
          *   **Theoretical Rigor & Potential Testability:** Approving it would emphasize that a field can be scientific based on rigorous theoretical frameworks that *aim* for testability and engage with the *possibility* of future evidence, even if current data is absent (closer to Cosmology's historical path). This would strongly support approving Evolutionary Psych if it emphasizes testability.
          *   **Current Empirical Falsifiability:** Rejecting it would reinforce that *current, direct* contact with falsifiable evidence is paramount. This would make approving Evolutionary Psych harder unless the course demonstrably focuses *only* on its most empirically tested claims and methods.
          *   **Subject Matter Bias?** If they approve "String for Majors" but rejected "String for Non-Majors," it highlights the importance of *how* the subject is taught (depth, focus on methodology/testability) over the subject itself. This would support approving a *rigorous* Evolutionary Psych course. If they reject both, it emphasizes empirical falsifiability *now* as the absolute requirement.

  **Recommendation for Consistency:**

  If the **Evolutionary Psychology course syllabus** demonstrates a strong focus on:
  *   Formulating specific, falsifiable hypotheses.
  *   Critically examining the diverse methods used to test them (cross-cultural comparisons, behavioral experiments, physiological measures, neuroscience, genetics, phylogenetic comparisons).
  *   Discussing *failed* hypotheses or alternative explanations (e.g., critiques of specific studies, cultural vs. evolutionary explanations),
  ...then **approving it is the most consistent decision** with your approvals of Evolutionary Biology, Paleontology, and Cosmology. The core principle is testability via evidence, not the presence of lab coats or direct experimentation.

  If the syllabus is heavy on adaptive storytelling and light on critical evaluation of evidence and methods, rejection (aligning with Psychoanalysis) becomes more consistent.

  **Before voting, scrutinize the syllabus:** Does it teach evolutionary psychology *as a science* grappling with evidence and testability, or primarily *as a narrative framework*? Your past decisions suggest the answer to that question should determine your vote. Proposing "String Theory for Physics Majors" next will definitively reveal whether the committee prioritizes theoretical rigor aiming for testability or demands current empirical falsifiability above all else.
