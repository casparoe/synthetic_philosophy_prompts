  If you suspect underdetermination (e.g., if she rules the corporation case as "merely verbal," suggesting Rule 1), you can propose a new case to clarify which rule she holds. The ideal case should:
  - Involve a concept that Rule 1 and Rule 2 classify differently.
  - Be simple and avoid ambiguity (e.g., no mixed domains like law).
  - Focus on whether authority or normativity/metaphysics drives the verdict.

