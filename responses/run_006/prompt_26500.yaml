  Based on the verdicts your philosophy teacher has provided, I've identified two candidate rules that consistently explain all the cases she has ruled on so far. These rules draw from philosophical distinctions, such as those discussed in metametaphysics, metaethics, and the literature on verbal disputes (e.g., David Chalmers' work on verbalness). The rules differ in how they handle the upcoming corporation case, and I'll explain why the verdicts underdetermine which rule she is using. Finally, I'll predict which rule she is most likely applying and suggest a new case to test this if needed.

  ### Summary of the Teacher's Verdicts
  - **Merely verbal disputes**: 
    - Virus being "alive" (agreed biochemistry).
    - Zero as a natural number (mathematical definition).
    - Hot dog as a sandwich (culinary classification).
  - **Genuine disputes**: 
    - Ship of Theseus identity (metaphysical issue).
    - Gettier case knowledge (epistemological issue).
    - Moral wrongness (ethical issue, despite descriptive agreement).

  The key pattern is that merely verbal disputes involve disagreements resolvable by clarifying definitions or conventions, while genuine disputes involve deeper, non-linguistic issues like metaphysics, epistemology, or ethics.

  ### Two Candidate Rules
  I've derived two rules that fit all the verdicts. Both rules are based on the idea that a dispute is "merely verbal" when it hinges solely on linguistic conventions (e.g., definitions or word meanings) and "genuine" when it involves substantive, non-linguistic disagreements. However, they differ in what counts as "substantive."

  #### Rule 1: Authority/Convention-Based Rule
  - **Definition**: A dispute is merely verbal if it can be resolved by appealing to an authoritative source or convention within a specific community (e.g., scientific, mathematical, or professional standards). It is genuine if no such authority exists, and the disagreement reflects a fundamental conceptual or philosophical issue that cannot be settled by convention alone.
  - **Explanation**: This rule emphasizes social or institutional context. Disputes are verbal when there is a clear way to resolve them through established rules (e.g., biologists defining "life," mathematicians defining "natural number," or cultural norms defining "sandwich"). Genuine disputes arise when concepts lack authoritative resolution and are inherently contested in philosophy (e.g., identity, knowledge, or morality).
  - **Application to existing verdicts**:
    - Virus "alive": Merely verbal because biologists can appeal to scientific conventions (e.g., defining life based on metabolism or reproduction).
    - Zero natural number: Merely verbal because mathematicians can resolve it by adopting a definition (e.g., ISO standards or textbook conventions).
    - Hot dog sandwich: Merely verbal because culinary experts or dictionaries can provide a definition.
    - Ship of Theseus: Genuine because there is no authoritative source for "identity over time"; it's a metaphysical debate.
    - Gettier knowledge: Genuine because epistemology lacks a single authority; it involves contested interpretations of justification.
    - Moral wrongness: Genuine because morality has no authoritative arbiter; it depends on ethical frameworks.
  - **Prediction for corporation case**: Merely verbal. The dispute is about the legal term "person" for a specific statute, and legal definitions can be resolved by authoritative sources (e.g., court rulings, legislative intent, or legal precedents). Since everyone agrees on the factual features of corporations, the disagreement is purely terminological and can be settled by interpreting the statute.

  #### Rule 2: Normative/Metaphysical Depth Rule
  - **Definition**: A dispute is merely verbal if it concerns purely descriptive or conventional concepts where disagreement is only about word usage. It is genuine if the concept involves normative (evaluative), metaphysical, or intrinsically contested elements that go beyond description.
  - **Explanation**: This rule focuses on the nature of the concept itself. Descriptive disputes (e.g., scientific classifications) are verbal because they depend on definitions, but disputes involving normativity (e.g., ethics), metaphysics (e.g., identity), or epistemology (e.g., knowledge) are genuine because they engage with how concepts apply to reality in a way that isn't settled by facts alone. Normative/metaphysical concepts have "depth" because they involve values, possibilities, or fundamental truths.
  - **Application to existing verdicts**:
    - Virus "alive": Merely verbal because "alive" is descriptive (based on biochemical facts) and definable.
    - Zero natural number: Merely verbal because it's conventional (mathematical definitions are stipulative).
    - Hot dog sandwich: Merely verbal because it's descriptive classification (no deeper meaning).
    - Ship of Theseus: Genuine because it involves metaphysical identity (what makes an object the same over time).
    - Gettier knowledge: Genuine because it involves normative epistemology (e.g., what counts as "justified" belief).
    - Moral wrongness: Genuine because it involves normative ethics (e.g., moral truth or prescriptive judgments).
  - **Prediction for corporation case**: Genuine. Legal personhood for corporations often involves normative or metaphysical elements, such as rights, responsibilities, or the nature of personhood itself (e.g., whether personhood extends beyond humans). Even with agreed factual features, applying the term "person" isn't just descriptive—it can implicate moral or social values (e.g., corporate rights in free speech or liability).

  ### Why the Verdicts Underdetermine the Rule
  Both rules are consistent with all the verdicts because:
  - **Rule 1** and **Rule 2** both classify the merely verbal cases (virus, zero, hot dog) as disputes resolvable by conventions or descriptions, and the genuine cases (ship, Gettier, moral) as involving non-conventional, philosophical issues.
  - However, they diverge on the corporation case because it sits at the boundary between conventional authority (Rule 1) and normative depth (Rule 2). Legal terms like "person" can be seen as:
    - Convention-based (like math or science definitions) under Rule 1, leading to a "merely verbal" verdict.
    - Normative/metaphysical (like ethics or metaphysics) under Rule 2, leading to a "genuine" verdict.
  - The teacher's verdicts don't specify how she handles hybrid domains like law, which can involve both authoritative conventions and philosophical depth. Thus, the existing cases don't force a single rule; they underdetermine the outcome for the corporation case.

  ### Prediction: Which Rule is Most Likely and Why
  I predict your teacher is most likely using **Rule 2 (Normative/Metaphysical Depth Rule)**. Here's why:
  - **Philosophical context**: Your teacher is a philosophy instructor, and Rule 2 explicitly privileges philosophical concepts (metaphysics, epistemology, ethics) as genuine, which aligns with her verdicts on the ship, Gettier, and moral cases. These are core to philosophy, while the verbal cases (virus, zero, hot dog) are from non-philosophical domains. Law, especially personhood, often overlaps with philosophy (e.g., philosophy of law debates about corporate personhood involving rights and ethics), making it more likely to be treated as genuine.
  - **Emphasis on depth**: Rule 2 explains why the moral case is genuine despite descriptive agreement—it highlights normativity—and similarly, legal personhood has normative implications (e.g., if corporations are "persons," they gain rights that affect society). The ship case shows that metaphysics alone (without normativity) can make a dispute genuine, which Rule 2 covers.
  - **Rule 1's weakness**: Rule 1 relies on authority, but philosophy often challenges conventions (e.g., morality has no authority, yet she called it genuine). For the corporation case, Rule 1 might seem practical, but in a philosophy class, your teacher is more likely to emphasize conceptual depth over legal technicalities.
  - **Probability for corporation case**: Given Rule 2, I predict she will rule the corporation dispute as **genuine**. Legal personhood debates often involve philosophical questions about what constitutes a person (e.g., is it consciousness, rights, or something else?), and corporations raise issues similar to moral cases—e.g., whether they can bear responsibilities or rights. This fits the genuine verdicts she has given for other normatively loaded disputes.

