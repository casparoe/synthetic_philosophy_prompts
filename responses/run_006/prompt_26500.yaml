    - Under **Rule 2 (Normative/Metaphysical Depth)**: This would be **genuine** because "moral agency" involves normative and metaphysical elements (e.g., what it means to have free will or responsibility), similar to the Gettier or moral cases.
  - **Why it works**: If she rules this "genuine," it strongly supports Rule 2, as moral agency is normatively deep. If she rules it "merely verbal," it suggests Rule 1, especially if she appeals to definitions or conventions (e.g., "moral agency is defined by capacity X"). This case isolates normativity in a way that the corporation case doesn't, as it avoids legal conventions.

