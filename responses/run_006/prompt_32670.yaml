  specs: i want a scenario where a protagonist knows two proper names that in fact corefer, but doesnt know they corefer. then they hear a simple identity statement linking them and they seem to learn something genuinely new about the world — not just about language. the millian (direct reference) about names and the fregean about names should agree on the truth conditions of every sentence uttered in the scenario. but the fregean says the protagonist learned a new proposition, while the millian has to say the proposition expressed was one the protagonist already knew (since its just the singular proposition that the object is self-identical).

  constraints: no fictional characters, no indexicals or demonstratives, no attitude reports, one paragraph, everyday setting. and heres the key thing — the case should be structured so the millian cant easily reach for "the protagonist just learned a metalinguistic fact" or "they just learned a fact about the names." the learning has to be about the world, not about words.

