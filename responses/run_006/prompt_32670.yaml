  Here’s the scenario, designed to meet your specifications:  

  Thomas, an amateur astronomer, observes a bright celestial body through his telescope every evening, which he calls "Hesperus" (following his grandfather’s tradition). Separately, he reads about a distinct-looking "morning star" in astronomy blogs, which they call "Phosphorus." Unbeknownst to Thomas, "Hesperus" and "Phosphorus" both refer to Venus, but he has no evidence linking the two (e.g., he assumes one is a star and the other a planet). During a planetarium lecture, the presenter states: **"Hesperus is Phosphorus."** Thomas is astonished—he thought they were distinct objects, but now realizes a single entity has been appearing in both contexts.  

  ### Analysis Table:  
  | Sentence uttered           | Millian truth condition       | Fregean truth condition                     | Same truth value? |  
  |----------------------------|-------------------------------|---------------------------------------------|-------------------|  
  | "Hesperus is Phosphorus."  | Venus = Venus                 | The object presented as 'evening star' = the object presented as 'morning star' | Yes (true) |  

  ### Explanations:  
  **(a) What the protagonist learned:**  
  - **Millian:** Thomas already knew the singular proposition *〈Venus, Identity, Venus〉* (i.e., Venus is self-identical). His "learning" is merely recognizing that two names co-refer.  
  - **Fregean:** Thomas learned a new non-trivial proposition: *that the object appearing in the evening is identical to the object appearing in the morning*.  

  **(b) Why metalinguistic escape is blocked:**  
  Thomas knew both names beforehand (he used "Hesperus" for his observations and encountered "Phosphorus" in blogs). The surprise stems from discovering that *a single object occupies two roles in the world* (evening/morning appearance)—not from linguistic facts. Redirecting to "he learned about the names" ignores his shift in understanding Venus’s *behavior*.  

  **(c) Best Millian fallback move:**  
  A sophisticated Millian might argue Thomas acquired a new *guise* or cognitive mode of presentation for Venus (e.g., merging "evening object" and "morning object" under one individual). However, this concedes that the *cognitive significance* of the proposition is non-trivial, even if the semantic content remains 〈Venus, Venus〉—effectively admitting a Fregean insight while clinging to Millian semantics.  

  ### Key Pressure Point:  
  The Millian must deny that Thomas learned a new *worldly fact* beyond co-reference, despite Thomas clearly updating his model of reality (e.g., revising beliefs about celestial objects). This clashes with the intuition that identity statements can be informative discoveries about the world’s structure.
