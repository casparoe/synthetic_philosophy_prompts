reasoning: |-
  We are building a scenario that puts pressure on Millianism by creating a situation where:
   - Two proper names corefer, but the protagonist doesn't know they corefer.
   - Upon hearing an identity statement, the protagonist seems to learn something new about the world (not just language).
   - The Millian and Fregean agree on the truth conditions of the identity statement (so the same truth value), but:
       - Fregean: the protagonist learns a new proposition (the sense of the identity statement).
       - Millian: the proposition expressed is the trivial singular proposition (that the object is self-identical), which the protagonist already knew.

   Constraints:
     - No fictional characters, indexicals, demonstratives, attitude reports.
     - One paragraph, everyday setting.
     - Block the Millian move to say it's metalinguistic (so the learning must be about the world).

   Idea: Use two names for the same person that are associated with different social contexts, such that the protagonist has no reason to connect them.

   Scenario:

   Dr. Evelyn Reed is a renowned physicist at a university. She also writes popular science books under the pen name "Eva Rhodes." Her close colleagues and friends know her as Evelyn Reed, and the general public knows her as Eva Rhodes. Thomas, a graduate student in the physics department, knows Dr. Reed as his advisor and has read several books by Eva Rhodes, but he has no idea that they are the same person. One day, Thomas overhears a conversation between two professors: one says to the other, "By the way, Evelyn Reed is Eva Rhodes." Thomas is astonished.

   Why this works:
     - The names "Evelyn Reed" and "Eva Rhodes" are both real (non-fictional) and corefer.
     - Thomas knows both names and the individual in two different contexts (academic and public) but doesn't know the coreference.
     - The identity statement is "Evelyn Reed is Eva Rhodes."
     - The learning is about the world: Thomas learns that the physicist he works with is the same as the author he admires.

   Blocking the metalinguistic escape:
     - We can structure the case so that Thomas already knows that both names exist and refer to someone. The surprise is not about the names but about the identity of the person. He learns that the person he interacts with in the lab is the same person who wrote the books.
     - We can emphasize that Thomas had two distinct mental files (in Fregean terms) and now merges them.

   Table:

   | Sentence uttered          | Millian truth condition                     | Fregean truth condition                     | Same truth value? |
   |---------------------------|---------------------------------------------|---------------------------------------------|-------------------|
   | Evelyn Reed is Eva Rhodes | The individual o is identical to o (where o is the person Evelyn Reed/Eva Rhodes) | The sense of "Evelyn Reed" presents o in one way and the sense of "Eva Rhodes" presents o in another, and they are the same object. | Yes (both true) |

   According to Millianism:
     - The proposition expressed is: <o, o, identity> (the trivial self-identity of o).
     - Thomas already knew that o is identical to o (for any object o he can think of).

   According to Fregeanism:
     - The proposition expressed is a non-trivial identity because it links two distinct senses (modes of presentation): the physicist and the author.
     - Thomas learns a new fact: that the physicist he knows as Evelyn Reed is the same as the author he knows as Eva Rhodes.

   (b) Blocking the metalinguistic escape hatch:
     - We can ensure that Thomas already knows the names: he uses "Evelyn Reed" to refer to his advisor and "Eva Rhodes" to refer to the author. The statement isn't telling him that the name "Evelyn Reed" refers to the same person as the name "Eva Rhodes" (which might be metalinguistic) but rather that the person (the object) is the same. Moreover, the setting is everyday and the statement is made without any explicit metalinguistic markers.

     However, to really block the metalinguistic move, we can note that the professors are talking about the person, not the names. The utterance is "Evelyn Reed is Eva Rhodes", which in the context is used to assert an identity of the referents, not about the words. And Thomas's surprise is clearly about the person: he didn't know that his advisor was the author.

   (c) The best fallback move for the Millian:
     - A smart Millian might say that what Thomas learned is not a new singular proposition (which is trivial) but rather a new way of accessing the same individual. That is, Thomas has acquired a new piece of information that allows him to connect two distinct cognitive routes to the same individual. This is sometimes called the "cognitive significance" move, but it doesn't change the proposition expressed by the sentence, which remains the trivial identity. However, this falls short of accounting for the intuition that Thomas learned something about the world.

     Alternatively, the Millian might try to explain the learning as the acquisition of a new fact of the form: the person who is F (the physicist) is the same as the person who is G (the author). But note that this is a descriptive (not singular) proposition. The Millian might then say that this descriptive proposition is what is learned, but it is not what the sentence literally expresses. The sentence expresses the singular proposition, and the descriptive proposition is pragmatically conveyed. This is a more sophisticated move.

