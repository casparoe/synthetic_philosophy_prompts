prompt: |-
  I run a small community mediation practice, and a lot of my cases arent really about interests — they're about values. A congregation says it has a religious duty to shelter homeless people; the neighborhood association says it has a duty to keep the block safe and quiet for the kids. A worker co-op says equal pay is a non-negotiable principle; the investor says oversight and performance pay are just what responsible stewardship requires. I've started to notice that some settlements work because each side cares about different things to different degrees, so they can trade: each gives up something it values a little to get something it values a lot. Like gains from trade, but with moral commitments instead of goods. But I also see settlements that feel like somebody got bought off, or like both sides are happy because they dumped the cost on someone who isn't in the room.

  I want a reusable procedure I can run on a proposed settlement before I put it in front of the parties. I'm not a philosopher and neither are they, so it has to be plain language. I've usually got about an hour per case, the parties have to sign off at the end, and my real worry is that I'll bless a deal that's actually one side capitulating, or a third party paying for everyone's good feelings.

  Please write the procedure: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it has to stop and say "this is a values call a person has to make, not something the checklist can settle." It should also tell the difference between a real difference in what the parties care about and one side just having less power or fewer options. And be honest about what the procedure cant catch even when it's run perfectly.

  Then run it on these three proposed settlements:

  1. A congregation wants to open a 30-bed homeless shelter in its building. The neighborhood association opposes it, saying they value the quiet and safety of the block and have a duty to protect their kids. The proposed compromise is a 15-bed shelter with a 9pm check-in, a hired security person, and the congregation pays for a neighborhood liaison. The congregation says 15 beds is far less than their duty requires, but they'd take it to avoid a years-long zoning fight.

  2. A worker co-op that pays every member the same hourly rate is taking an investment from someone who wants a voting board seat and performance bonuses for a new technical hire. The compromise: the investor gets a non-voting board seat, the new hire gets market pay, and the co-op pools the difference and redistributes it equally each quarter. The co-op says equal pay is a core value, but this keeps the business alive; the investor says oversight is a core responsibility, but a non-voting seat is enough for now.

  3. A union and management both want to avoid layoffs at a small manufacturing plant. They propose covering the shortfall by cutting retiree health benefits. Both sides at the table like the deal: current workers keep their jobs and management keeps production going. The retirees aren't represented in the mediation.

  I especially want to know what the procedure says about the third one, because I suspect my checklist would wave it through and I need to know if that's wrong.
reasoning: |-
  Okay, the user runs a small community mediation practice dealing with conflicts rooted in values rather than interests. They've noticed that some settlements work through mutual trade-offs, but others feel like capitulation or cost-shifting. They want a reusable, plain-language procedure to evaluate proposed settlements before presenting them to parties. Key constraints: non-philosophical language, 1 hour per case, parties must sign off, and concerns about hidden capitulation or externalized costs.

  First, I need to design a structured checklist that identifies genuine value trades versus power imbalances. The procedure should have clear questions with pass/fail thresholds and acknowledge where human judgment is unavoidable. It must also flag when vulnerable third parties bear costs.

  Core challenges the procedure must address:
  - Distinguishing value differences from power disparities
  - Detecting hidden capitulation (one side accepting unfair terms due to exhaustion)
  - Identifying when costs are dumped on absent parties
  - Recognizing when "compromise" undermines fundamental values

  The procedure should flow logically:
  1. **Verify mutual gains**: Confirm each side gains something meaningful to their stated values.
  2. **Check for coercion**: Assess whether agreement stems from genuine consent or desperation.
  3. **Evaluate cost externalization**: Scrutinize impacts on unrepresented stakeholders.
  4. **Test durability**: Consider whether the deal preserves core identities.

  For the retiree health benefits case (#3), I suspect the procedure should raise red flags because:
  - The gain (job preservation) comes at direct cost to absent retirees
  - Both parties have power/representation advantages over retirees
  - Management avoids financial responsibility, workers avoid personal sacrifice
  - This creates moral hazard and future instability

  The procedure must explicitly state its limitations:
  - Can't resolve fundamental value clashes
  - Can't eliminate all power imbalances
  - Can't guarantee ethical purity
  - Relies on parties' truthful disclosure

  For the user's context, I'll emphasize plain language warnings like "This deal makes absent people pay" instead of academic terms like "negative externality." The stop signs need to be unambiguous - e.g., immediate rejection if coercion is evident or core values are violated without consent.
answer: |-
  Here's a reusable, plain-language **Values-Based Settlement Evaluation Procedure (VB-SEP)** designed for your mediation practice. It focuses on identifying genuine value trades vs. capitulation or cost-shifting, while flagging power imbalances and ethical limits.

  ---

  ### **Values-Based Settlement Evaluation Procedure (VB-SEP)**
  **Goal:** To check if a settlement is a *mutually acceptable trade of values* (not capitulation) *without harming absent parties*.  
  **Time:** 30–45 mins per case.  
  **Input:** Written summary of the dispute, proposed settlement, and each party’s core values/concerns (gathered pre-mediation).  
  **Output:** "Proceed," "Revise," or "Stop + Flag Ethical Concern."  

  #### **The Checklist (Ask in Order)**
  1. **"Does each side GET something they deeply value from this deal?"**  
     - *Good answer*: "Yes, Party A gets [X], which aligns with their value [V1]; Party B gets [Y], which aligns with [V2]." (e.g., "Neighbors get quieter nights; congregation serves some homeless.")  
     - *Stop/Revise if*: One side gains nothing meaningful to their *values* (e.g., "The congregation gets fewer beds but no other value").  
     - *Human judgment call*: If gains are symbolic or vague ("We get goodwill"), probe: "Is this *enough* for you to feel your values are respected?"

  2. **"Does each side GIVE UP something they care about, but NOT their core value?"**  
     - *Good answer*: "Yes, Party A accepts [compromise] that *costs* them but doesn’t break their principles." (e.g., "Co-op accepts unequal pay for one hire but redistributes profits to preserve equality overall.")  
     - *Stop if*: One side abandons a non-negotiable value (e.g., "Congregation agrees to *no shelter at all*").  
     - *Check for power imbalance*: If a party says, "We hate this but have no choice," ask: **"If you had equal power/money/time, would you still take this deal?"**  
       - *No* → Capitulation likely. Flag: "This may be unfair pressure, not a values trade."

  3. **"Is anyone NOT AT THE TABLE paying the price for this deal?"**  
     - *Good answer*: "No, all costs are shared by the parties here."  
     - *Stop/Revise if*: Unrepresented groups bear significant harm (e.g., retirees losing benefits).  
     - *Human judgment call*: If costs are indirect (e.g., "Taxpayers might pay more"), ask: **"Is this a trivial side effect or a core injustice?"** (Trivial = minor paperwork; injustice = health/security loss).

  4. **"Could both sides explain this deal to their community WITHOUT SHAME?"**  
     - *Good answer*: "Yes, they’d frame it as a hard-won compromise honoring both values."  
     - *Revise if*: One side admits, "We’d hide this" or "Our members would call it a sellout."  
     - *Check for power imbalance*: If a weaker party says, "We’ll call it a win to save face," → Capitulation likely.

  5. **"Does this deal set a BAD PATTERN for future disputes?"**  
     - *Good answer*: "No, it encourages good-faith bargaining."  
     - *Stop/Revise if*: It rewards bullying (e.g., "Investors now know we’ll bend principles under threat") or normalizes harming outsiders (e.g., "Always cut retiree benefits first").

  ---

  ### **What VB-SEP CAN’T Catch (Even When Run Perfectly)**
  - **Hidden desperation**: A party lying about their willingness ("We’re fine!" when they’re actually bankrupt).  
  - **Long-term erosion**: A compromise that subtly degrades values over time (e.g., slowly expanding pay gaps).  
  - **Cultural blind spots**: Unseen power dynamics (e.g., race/gender imbalances affecting "voluntary" agreement).  
  - **True value clashes**: When core values *can’t* be traded (e.g., "Shelter vs. no shelter ever"). VB-SEP flags these but can’t solve them.  

  ---

  ### **Applying VB-SEP to Your Cases**
  #### **Case 1: Homeless Shelter Compromise**  
  - **Q1 (Gains)**: Congregation gets *some* shelter (value: duty to homeless). Neighbors get *reduced* beds/security (value: safety). **✓**  
  - **Q2 (Sacrifices)**: Congregation accepts fewer beds (painful but not abandoning duty). Neighbors accept *some* risk (painful but not abandoning safety). **✓**  
  - **Q3 (Absent parties)**: Homeless people lose 15 beds, but they aren’t "paying" – they’re beneficiaries. **✓**  
  - **Q4 (Shame test)**: Congregation might call it "partial victory"; neighbors frame as "managed compassion." **✓**  
  - **Q5 (Bad pattern)**: Sets precedent for phased solutions. **✓**  
  - **Power check**: Congregation fears zoning fight but says they’d take the deal even with equal power ("We’d still serve *some*"). **✓**  
  - **Verdict**: **PROCEED** – Genuine values trade.

  #### **Case 2: Worker Co-Op Investment**  
  - **Q1 (Gains)**: Co-op gets investment/survival (value: collective ownership). Investor gets oversight (value: stewardship). **✓**  
  - **Q2 (Sacrifices)**: Co-op allows unequal pay for one hire but redistributes profits (core equality preserved). Investor accepts non-voting seat (oversight diluted but not gone). **✓**  
  - **Q3 (Absent parties)**: The new hire gets market pay – not harmed. **✓**  
  - **Q4 (Shame test)**: Co-op can frame as "temporary, balanced adjustment." Investor can call it "responsible engagement." **✓**  
  - **Q5 (Bad pattern)**: Could encourage future investors to demand similar terms, but co-op preserved veto power. **✓**  
  - **Power check**: If co-op says, "We’d reject this with more cash," it fails. But they say it aligns with values *if* survival is at stake. **✓**  
  - **Verdict**: **PROCEED** – Innovative values trade.

  #### **Case 3: Layoffs vs. Retiree Benefits**  
  - **Q1 (Gains)**: Workers keep jobs (value: job security). Management keeps production (value: viability). **✓**  
  - **Q2 (Sacrifices)**: Workers "give up" nothing; management "gives up" nothing. Retirees bear 100% of sacrifice. **🛑 STOP**  
  - **Q3 (Absent parties)**: **🛑 MAJOR FAIL** – Retirees (not present) pay the entire cost via lost health benefits.  
  - **Q4 (Shame test)**: Workers/management might spin this as "shared sacrifice," but retirees would call it betrayal. **🛑**  
  - **Q5 (Bad pattern)**: Sets terrible precedent: "Dump costs on voiceless groups." **🛑**  
  - **Power check**: Retirees have *no power* in this negotiation; classic exclusion.  
  - **Verdict**: **STOP + FLAG ETHICAL CONCERN**. This is "cost-dumping," not a values trade. VB-SEP catches it at Q3.  

  ---

  ### **Special Guidance for Case 3**
  - **VB-SEP outcome**: Hard "Stop" at Question 3. The settlement is **unethical** because:  
    - It shifts 100% of the burden to an unrepresented group with less power.  
    - Both parties are "happy" because they avoided *their* pain (layoffs/production loss) by sacrificing others.  
  - **Action required**: Do NOT bless this deal. Tell parties:  
    > *"This agreement solves your problem by taking from people who aren’t here to defend themselves. Mediation ethics forbid this. You must either: (a) include retiree reps, (b) find cuts that affect everyone (e.g., across-the-board wage/benefit reductions), or (c) admit this isn’t a true compromise."*  

  This procedure won’t guarantee perfect justice, but it *will* catch glaring capitulation, power abuses, and externalized harm—especially your "third-party cost" worry. Use it as a moral stress test before presenting any deal.
