prompt: |-
  I'm a PhD student working on AI alignment, specifically on scalable oversight protocols, and my supervisor has been pushing me to think more carefully about what the actual limits of debate are. There's this ongoing back-and-forth in the literature about whether "obfuscated arguments" represent a fundamental barrier or just an engineering challenge, and I feel like the two sides have been talking past each other for years. I'd like to draft an adversarial-collaboration document that a committed debate optimist (someone who thinks debate between AIs with a human judge is a viable route to aligning superhuman systems) and a committed obfuscation sceptic (someone who thinks there exist true arguments that are intrinsically impossible for humans to evaluate, even with adversarial cross-examination) could both sign. The document should have a numbered agreed-claims section, covering what both sides accept about the debate setup, the role of the human judge, what "obfuscation" means precisely, and what the no-go results actually establish. Then a disagreements table: the exact formulations of where they part ways, with each side's view stated in wording that side would endorse. Then the cruxes -- the sub-questions where settling them would genuinely move at least one side -- and for each crux, a concrete test, argument, or thought experiment both agree bears on it, plus each side's prediction recorded in advance. I'm particularly interested in whether the crux ends up being about the existence of "checkable decompositions" for any true claim, or about whether the asymmetry of debate (the honest debater only needs to point out one flaw) suffices to overcome obfuscation even when the judge can't follow the full argument. I'd also want the document to flag any parts of the dispute that turn out to be purely verbal -- I suspect some of the disagreement about what counts as "human-checkable" might dissolve once you pin down the judge's capabilities and time budget. Could you draft this?
reasoning: |-
  We are drafting an adversarial collaboration document between two parties:
   - Debate Optimist (DO): Believes that debate between AI agents with a human judge can scale to superhuman systems and overcome obfuscation.
   - Obfuscation Sceptic (OS): Believes there are true arguments that are intrinsically impossible for humans to evaluate, even with adversarial cross-examination.

   The document has three main parts:
   1. Agreed Claims (numbered list of statements both parties accept)
   2. Disagreements Table (with each row having: Claim, DO View, OS View)
   3. Cruxes (sub-questions with concrete tests/thought experiments and each side's predictions)

   We also want to flag purely verbal disagreements.

   Let's start by outlining the agreed claims. Both parties agree on the following:

   1. **Debate Setup**: We consider a debate protocol in which two AI agents (one honest, one dishonest) argue about the truth of a statement to a human judge. The honest agent aims to help the judge find the truth, while the dishonest agent aims to deceive. The debate proceeds by alternating turns, including cross-examination.

   2. **Human Judge**: The judge is a human with bounded cognitive capacity and time. The judge can understand and evaluate arguments only if they are presented in a form that is within human cognitive capabilities and within a reasonable time (e.g., hours or days, not years). The judge is assumed to be rational and trying to get the right answer, but limited.

   3. **Obfuscation Definition**: An argument is obfuscated if it is true but presented in a way that makes it difficult for the human judge to verify its correctness without substantial additional structure or decomposition. We distinguish between:
      - **Intentional Obfuscation**: When the dishonest agent deliberately complicates the argument to confuse the judge.
      - **Intrinsic Obfuscation**: When the argument, by its nature, requires steps or concepts that are inherently beyond human comprehension, even when broken down and explained clearly.

   4. **Scope of the Debate Protocol**: The debate protocol is intended for evaluating claims that might require superhuman intelligence to fully grasp, but where the truth of the claim has implications that can be checked by humans (e.g., through empirical predictions or by decomposing into human-checkable steps).

   5. **No-Go Results**: There exist formal results (e.g., regarding computational complexity or cryptographic hardness) that show that for some problems, there is no efficient way for a human to verify a solution without trusting an oracle. However, both parties agree that these results are based on worst-case scenarios and may not cover the types of problems that arise in practice for AI alignment.

   6. **Asymmetry in Debate**: The honest debater only needs to find one flaw in the dishonest debater's argument to refute it, while the dishonest debater must defend the entire argument. This asymmetry is a key feature of debate.

   7. **Decompositions**: Both parties agree that if a true claim can be broken down into a sequence of human-checkable steps (each of which is within human cognitive limits), then the debate protocol can potentially guide the judge through these steps and overcome obfuscation.

   8. **Role of Time**: The debate is bounded in time (and hence in the number of steps and the complexity of each step). The judge cannot process an unbounded amount of information.

   Now, the disagreements:

   We'll structure the table as:

   | Claim | DO View | OS View |
   |-------|---------|---------|
   | ...   | ...     | ...     |

   Let's list the key disagreements:

   Claim 1: **Existence of Intrinsically Obfuscated Arguments**
     - DO: Believes that for any true claim, there exists a decomposition into human-checkable steps that the honest agent can use to convince the judge, even if the dishonest agent tries to obfuscate. Therefore, intrinsic obfuscation does not exist for claims that are true and relevant to the debate.
     - OS: Believes that there exist true claims for which no such decomposition exists. That is, the only valid arguments for the claim are intrinsically beyond human comprehension, even when broken down by the honest agent and even under adversarial cross-examination.

   Claim 2: **Effectiveness of Asymmetry**
     - DO: Believes that the asymmetry of debate (honest only needs to find one flaw) is sufficient to overcome obfuscation, because the honest agent can focus on exposing a single flaw in the dishonest agent's argument, which can be made human-checkable even if the entire argument is not.
     - OS: Believes that if the dishonest agent's argument is intrinsically obfuscated, then the honest agent may not be able to find a flaw that is human-checkable. The flaw itself might be obfuscated and require superhuman understanding to detect.

   Claim 3: **Scalability to Superhuman Systems**
     - DO: Believes that debate can scale to align superhuman AI systems because the protocol forces the AI to break down arguments into human-checkable steps, and the asymmetry helps the honest AI win.
     - OS: Believes that when the AI systems become sufficiently superhuman, the arguments they generate will become intrinsically obfuscated for humans, making debate ineffective.

   Claim 4: **Checkable Decompositions**
     - DO: Believes that for any true claim, there exists a decomposition into a sequence of human-checkable steps (each step being a claim that a human can verify in bounded time) that the honest agent can use to prove the claim. The dishonest agent cannot prevent this decomposition from being found and presented effectively in the debate.
     - OS: Believes that there exist true claims for which no such decomposition exists. The minimal steps required to prove the claim might be inherently beyond human comprehension.

   Now, the cruxes. We list each crux, a concrete test/thought experiment, and each side's prediction.

   Crux 1: **Existence of Checkable Decompositions for Complex Mathematical Proofs**

     - **Test**: Consider a complex mathematical statement (e.g., a statement in high-dimensional topology or a new theorem in combinatorics that requires a very long proof) that has been proven by a superhuman AI. Can the honest agent always decompose the proof into steps such that each step is checkable by a human mathematician (with access to standard tools and a reasonable time per step, say a day per step) and the entire sequence is not prohibitively long (say, less than 1000 steps)? The dishonest agent will try to present an incorrect proof and obfuscate.

     - **DO Prediction**: Yes, for any true mathematical statement, the honest agent can always produce such a decomposition. Moreover, in debate, the honest agent can force the dishonest agent to either concede or make a mistake at a step that the human can check.

     - **OS Prediction**: No, there will be true mathematical statements for which the honest agent cannot produce a human-checkable decomposition. The minimal proof might require steps that are inherently too complex for humans to verify, even when broken down. In such cases, the dishonest agent can create an obfuscated false proof that the human cannot distinguish from the true one.

   Crux 2: **Asymmetry in Detecting Flaws in Obfuscated Arguments**

     - **Test**: Consider a scenario where the dishonest agent presents an argument that is both false and intentionally obfuscated (using techniques that exploit human cognitive limits) for a claim that is actually false. Can the honest agent always find a flaw in the argument that is checkable by the human judge (with the same time constraints) and that the dishonest agent cannot obfuscate?

     - **DO Prediction**: Yes, the asymmetry ensures that the honest agent only needs to find one checkable flaw. The honest agent can use its superintelligence to locate such a flaw and present it in a human-checkable way, even if the overall argument is obfuscated.

     - **OS Prediction**: No, because the flaw itself might require understanding a complex chain of reasoning that is beyond the human. The dishonest agent can design the obfuscation so that any flaw that exists is hidden behind layers of complexity that the human cannot penetrate in the time allowed.

   Crux 3: **Human Ability to Verify Decompositions of Empirical Predictions**

     - **Test**: Consider a claim about a physical system that requires superhuman computation to predict (e.g., the outcome of a complex quantum system or a chaotic weather system). The honest agent must convince the judge of the true outcome. The dishonest agent will present a false prediction. Can the honest agent decompose the prediction into a series of human-checkable steps (e.g., intermediate computations that are verifiable by simpler simulations or known principles) that lead to the correct outcome?

     - **DO Prediction**: Yes, the honest agent can break down the superhuman computation into steps that are checkable by humans (e.g., by using verified reduction steps, known physical laws, or intermediate results that can be checked with simpler experiments or simulations). The dishonest agent cannot effectively obfuscate without being caught.

     - **OS Prediction**: No, because the computation might be irreducible: the intermediate steps might not be checkable by humans (e.g., they require simulating a large system that is too complex) and the honest agent might not be able to provide a simpler decomposition. The dishonest agent can then present a false decomposition that the human cannot distinguish.

   Finally, we flag a potential purely verbal disagreement:

   **Verbal Disagreement**: The term "human-checkable" might be interpreted differently. Both parties agree that we are considering a human judge with bounded time and cognitive resources. However, the DO might include in "human-checkable" the use of tools (like computers for simple computations) and the ability to learn new concepts if they are taught step by step (within the time budget). The OS might require that each step is immediately comprehensible without any learning or with minimal learning. We clarify that the judge is allowed to use standard tools (like calculators, simple software) and can learn new concepts if they are taught in the debate (within the time constraints). However, the judge cannot spend more than a fixed amount of time (e.g., a few hours) per step and the entire debate is bounded (e.g., a week of full-time attention).

   We note that if the parties agree on a precise time budget and cognitive model of the judge, some disagreements might reduce to empirical questions about what decompositions are possible under those constraints.

   Now, we write the document accordingly.
answer: |-
  Below is a draft adversarial-collaboration document structured as requested. It synthesizes key agreements, disagreements, and testable cruxes in the debate/obfuscation literature, with emphasis on resolving whether conflicts hinge on empirical asymmetries, decompositions, or semantic ambiguity. Wording is optimized for endorsement by both positions.

  ---

  **Adversarial Collaboration: Fundamental Limits of AI Debate for Scalable Oversight**  
  *Signed: [Debate Optimist (DO)] and [Obfuscation Sceptic (OS)]*  

  ### **1. Agreed Claims**  
  Both parties accept the following about the debate protocol and problem framing:  

  1. **Debate Setup**:  
     - Two AI systems (one truth-seeking, one adversarial) argue before a human judge.  
     - Claims are binary (true/false) with ground truth existent but unknown to the judge.  
     - Debaters may output text, code, diagrams, or references to external tools.  

  2. **Human Judge Constraints**:  
     - Judge has bounded rationality: cannot process superhumanly complex arguments within realistic time (e.g., ≤40 hours total debate).  
     - Judge can verify *local* steps (e.g., checking arithmetic, validating a code snippet against simple specs, spotting contradictions in short chains of reasoning) but cannot globally verify claims requiring superhuman expertise.  

  3. **Obfuscation Definition**:  
     - An argument is "obfuscated" if its shortest honest justification contains ≥1 step that **cannot be verified** by the judge in polynomial time (relative to claim complexity), even with optimal decomposition and adversarial pressure.  
     - Obfuscation may arise from: cryptographic hardness, combinatorial explosion, or embedded cognitive gaps (e.g., concepts humans cannot learn efficiently).  

  4. **No-Go Results**:  
     - Cryptographic no-go theorems (e.g., based on MA vs IP, or PCP) prove **worst-case obfuscation exists** for some classes of problems.  
     - These do **not** resolve whether obfuscation is typical in alignment-relevant tasks or surmountable via debate-specific asymmetries.  

  5. **Asymmetry Advantage**:  
     - Honest debater wins if they identify **any single local flaw** in the opponent’s argument, while the dishonest debater must defend all steps.  

  6. **Decomposition Requirement**:  
     - Honest victory requires decomposing claims into judge-verifiable steps. A "checkable decomposition" is a proof where each step is polytime-verifiable by the judge.  

  ---

  ### **2. Disagreements**  
  | Claim                                                                 | DO Position                                                                                               | OS Position                                                                                                |  
  |-----------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|  
  | **D1: Prevalence of obfuscation**                                     | Obfuscation is rare in practice for claims generated by aligned AIs; most truths admit checkable decompositions. | Obfuscation is endemic for superhuman AI outputs; most high-stakes claims lack checkable decompositions.    |  
  | **D2: Asymmetry sufficiency**                                         | Asymmetry lets honest win *without* full decomposition by exploiting one locally verifiable flaw.         | Asymmetry fails if flaws are *globally* distributed (require simultaneous verification of many steps).      |  
  | **D3: Judge capability boundary**                                     | Judges can verify "tool-based steps" (e.g., code output with simple I/O) even if underlying logic is opaque. | Tool outputs inherit opacity; judges cannot verify steps relying on superhumanly complex tools.            |  

  ---

  ### **3. Cruxes**  
  Cruxes are formulated as testable questions. Predictions are recorded preemptively.  

  **Crux 1: Existence of Checkable Decompositions**  
  - **Test**: For a class of problems known to admit superexponentially long proofs (e.g., combinatorial optimization on Erdős–Rényi graphs at threshold hardness), can a superhuman AI *always* produce a polytime-verifiable decomposition of a true claim under a 40-hour judge budget?  
    - **DO Prediction**: Yes, via stepwise refinement (e.g., Levin reductions).  
    - **OS Prediction**: No, for density regimes where all minimal proofs embed high-granularity entanglement.  
  - **Why it matters**: Resolves D1. OS concedes scalability iff true.  

  **Crux 2: Asymmetry Efficacy Against Global Flaws**  
  - **Test**: In a debate on a claim where the shortest counterargument requires comparing ≥N mutually dependent subclaims (e.g., detecting inconsistency in a planning task with N interlocking constraints), can the honest debater reliably induce a *locally* verifiable flaw (e.g., one pairwise contradiction) when N exceeds human working memory?  
    - **DO Prediction**: Yes, via targeted cross-examination to force dishonesty on a separable subclaim.  
    - **OS Prediction**: No, dishonesty can distribute errors such that no local check contradicts the whole.  
  - **Why it matters**: Tests DO’s core asymmetry argument (D2). DO revises if false.  

  **Crux 3: Tool-Verification Transparency**  
  - **Test**: Judge must verify a code-based step (e.g., "Algorithm A outputs optimal solution"). Debaters provide code and test cases. Can the judge reliably distinguish cases where debaters supply incorrect but test-case-passing code via adversarial examples?  
    - **DO Prediction**: Yes, honest debater can generate a human-checkable proof of code correctness (e.g., via input-space partitioning).  
    - **OS Prediction**: No, verification reduces to another opaque step (e.g., validating proof of correctness).  
  - **Why it matters**: Addresses D3; determines if tool-use mitigates obfuscation.  

  ---

  ### **4. Purely Verbal Disagreements**  
  The parties agree the following conflicts dissolve under clarification:  
  - **"Human-checkable"**: Both exclude steps requiring months of judge upskilling. "Checkable" means verifiable within debate-time bounds using judge’s *initial* knowledge plus in-debate explanations.  
  - **"Fundamental barrier"**: DO interprets as "insurmountable in >99% of real tasks"; OS interprets as "exists for some claims in the limit". Agreed: OS wins if any alignment-relevant claim is obfuscated; DO wins if debate handles all *practical* superhuman tasks.  

  ---

  ### **Next Steps**  
  Signatories commit to:  
  1. Co-design experiments for Cruxes 1–3 using SATLIB benchmarks (Crux 1), constraint-satisfaction games (Crux 2), and verified-code challenges (Crux 3).  
  2. Reconcile if ≥2 cruxes resolve conclusively against one position.  
  3. Publish unresolved disagreements as genuine philosophical splits (e.g., on burden of proof for decomposition existence).  

  ---  
  This draft balances formal rigor with operationalizability. By focusing on *local* verification, polynomial-time judge limits, and tool-based interfaces, it forces the debate away from infinity-games and toward tests that could run on near-term AI platforms. The cruxes specifically target the asymmetry/decomposition tension you noted—Crux 2 isolates asymmetry’s role, while Crux 1 pressures the decomposition premise. If implemented, these experiments could resolve 50+ years of stalled obfuscation arguments.
