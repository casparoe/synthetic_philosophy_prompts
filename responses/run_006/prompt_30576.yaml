  First, I need to reconstruct Isotype's core practices: standardized pictograms, flat colors, no perspective, repeatable units for quantities, cross-linguistic accessibility, and democratic intent. Then I should separate what it strictly requires from what's compatible but not necessary. For example, it strictly needs intersubjective learnability but doesn't strictly require that learning be "natural" versus conventional.

  The pictorial meaning question is tricky. The user asks if Isotype assumes pictograms are transparent. From Neurath's writings, he likely thought they were more intuitive than text but still required some training. So the practice probably presupposes that pictograms have perceptual advantages but avoids committing to strong naturalism. It's underdetermined whether the meaning comes from resemblance or convention.

  On social reality, Isotype treats facts as quantifiable and comparable through standardized units. This fits physicalism but doesn't require it—one could use this approach without believing everything reduces to physics. The editorial choices are where neutrality claims get shaky. Selecting categories and definitions inherently involves judgments, even if the presentation aims for neutrality. This seems in tension, but Neurath might argue it's about minimizing distortion, not eliminating perspective.

  I should also consider what a rival system would look like. If pictograms were seen as thoroughly conventional, they might be more abstract and less iconic. If theory-laden, they might include more contextual elements or avoid claims of universality.

