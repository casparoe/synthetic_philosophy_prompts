  Okay, the user is asking about Otto Neurath's Isotype project and its philosophical commitments. They want me to dissect the practice, separate strict presuppositions from things that merely fit well, and identify where things are underdetermined. They're particularly interested in the theory of pictorial meaning, the tension between claims of neutrality and embedded judgments, and how this relates to Neurath's broader philosophy.

