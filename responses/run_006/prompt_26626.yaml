  Next, (iv) extinction risk. Longtermism and climate policy both deal with existential risks. If extinction risk is misapplied in discount rates, it could lead to undervaluing future lives. The user's background in econ helps model this, and it's directly relevant to longtermist cause prioritization. Recent work by Ord or Weitzman adds urgency here.

