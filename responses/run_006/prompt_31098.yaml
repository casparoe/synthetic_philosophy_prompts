prompt: |-
  I've been collecting my honest reactions to a bunch of animal cases to see where I stand on speciesism, and they don't add up the way I expected. I'd like you to help me find the principle, if there is one.

  Here are the verdicts:

  - Killing a healthy adult dog for no particular reason: wrong.
  - Trapping and killing mice that are eating the grain in my pantry: fine, I do it without much thought and I don't think it's wrong.
  - Raising pigs on a factory farm and killing them for pork when I could easily eat plants instead: wrong, but I'm genuinely unsure whether the killing is the problem or just the suffering. I'd probably eat pork from a pig that lived well and died instantly and painlessly.
  - Doing painful medical experiments on macaques to develop a drug that might save hundreds of children: permissable, though it makes me queasy and I wouldn't want to watch.
  - Doing the same experiments on severely cognitively disabled human children who score below the macaques on every test: not permissable, full stop.
  - Killing and eating a genetically engineered pig with the mental and emotional life of a typical four-year-old human: wrong, and I'd say as wrong as killing the four-year-old.
  - Withdrawing a feeding tube from a human in a permanent vegetative state: fine.
  - Killing that same PVS patient to harvest organs for five other people: also fine if the family consents, but it bothers me in a way the withdrawal doesn't.
  - A human infant born anencephalic, who will never be conscious: letting it die is fine, and I don't think actively ending its life is any worse, but I'd still balk at saying it's the same as killing a pig.

  I keep wanting to say the principle is something like 'what matters is the capacity for welfare, not species membership' — the engineered pig and the disabled children push in opposite directions on that. But then the macaque experiment and the disabled children seem to smuggle species back in, and I can't tell whether my pig verdict is about killing or only about suffering.

  So: is there a principle that gets all of these, or close? State it (or a small set of candidates) precisely, say which of my verdicts it can't accommodate and what I'd have to give up to keep the rest, and tell me what it predicts about a case I haven't listed: a human with a severe brain injury who permanently functions at the level of a healthy dog.
reasoning: |-
  Okay, let me try to figure out what's going on with the user's animal ethics cases. The user has listed various scenarios involving animals and humans, and their reactions seem inconsistent at first glance. They mentioned speciesism but their judgments don't neatly follow species lines. 

  First, I notice the user is genuinely trying to find an underlying principle. They mentioned "capacity for welfare" but found contradictions - like how they view the engineered pig (similar to a human child) versus disabled human children versus macaques. That's where it gets messy.

  Hmm... looking at the cases, the user seems to draw lines at different places:
  - Dogs get protection but mice don't
  - Factory farming is wrong but humane pork might be okay
  - Macaque experiments are tolerable but not on disabled children
  - The engineered pig-child equivalence is striking
  - PVS cases show a distinction between killing and letting die

  The anencephalic infant case is particularly telling - they reject species membership as the deciding factor but still feel it's different from killing a pig. That cognitive dissonance is the core challenge.

  I wonder if what the user is really wrestling with is moral status based on consciousness and relationships. The mouse in the pantry isn't seen as having complex inner life, while the dog clearly does. The engineered pig has human-like consciousness, hence the strong protection. 

  For the brain-injured human at dog level case - I'd predict they'd say killing that human is wrong while killing a dog might be acceptable in some contexts. This suggests relationships matter too. The macaque experiments feel queasy because we recognize their capacity to suffer, but we prioritize humans when forced to choose. 

  The user seems to be a deep thinker exploring ethics systematically. Their frustration about not finding a clean principle is understandable - these are famously hard problems in philosophy. Maybe what they need isn't one flawless principle but a framework that explains why we weigh consciousness, relationships and context differently case by case. 

  The PVS case shows they intuitively distinguish between active killing and passive withdrawal, even when outcomes are identical. That's significant - it suggests psychological factors beyond pure ethics influence their judgments. 

  Ultimately their positions seem to cluster around: the richer the inner life, the stronger the protection; human relationships create special obligations; and context matters for "lesser" animals. Not perfect, but human ethics rarely is.
answer: |-
  Based on your detailed reactions, your moral judgments aren't driven by a *single* principle, but by a combination of **consciousness, relational significance, and context-dependent thresholds for harm.** Here's the framework that best explains your pattern:

  **The Principle(s):**

  1.  **Moral Status Scales with Richness of Subjective Experience:** The capacity for complex conscious experience (awareness, anticipation, pleasure, pain, fear, grief, self-awareness, future-oriented desires) grants stronger moral standing. Killing or harming an entity *capable* of a rich inner life is worse than harming one with a minimal or absent inner life.
  2.  **Relational Significance Amplifies Protection:** Entities embedded in significant human relationships (companionship, family ties, perceived kinship) receive heightened moral protection, *even if* their intrinsic capacities might be comparable to non-relational entities.
  3.  **Contextual Permissibility for Lesser Harms:** Causing harm or death to entities with lower intrinsic moral status is permissible if there's a sufficiently strong, *contextually relevant* justification (e.g., pest control, significant medical benefit).
  4.  **Active Killing vs. Letting Die Distinction:** There's often a stronger aversion to *actively causing death* than to *allowing death to occur* through withdrawal of care, even if the outcome is identical, especially for entities with relational significance.

  **Applying the Framework to Your Verdicts:**

  *   **Killing Dog:** High richness of subjective experience (fear, pain, attachment, future desires) + High relational significance (companion animal) = Strongly Wrong. No sufficient context.
  *   **Killing Mice (Pests):** Lower perceived richness of subjective experience (less complex emotions/future orientation) + No relational significance + Strong contextual justification (property protection, hygiene) = Permissible.
  *   **Factory Farm Pig:** High richness of subjective experience (pain, suffering, complex social needs) + No relational significance + Weak contextual justification (taste preference over viable alternatives) = Wrong (suffering is primary, but painless killing still violates principle 1 if life is valued).
  *   **Experiments on Macaques:** Moderate-High richness of subjective experience (capacity for significant pain, fear) + Low relational significance + Strong contextual justification (hundreds of children's lives) = Permissible, though uncomfortable.
  *   **Experiments on Disabled Children:** **✓ Consciousness:** May be comparable to macaques. **✓ Relational Significance:** HIGH (human child, family member, triggers kinship instincts). **✓ Context:** Justification is strong. **Result:** *Relational significance* (Principle 2) overrides the comparable intrinsic capacity and contextual justification. Unacceptable.
  *   **Killing Engineered Pig (Child-Level):** **✓ Consciousness:** HIGH & equivalent to a human child. **✓ Relational Significance:** LOW (initially, though capacity might trigger it). **Result:** High intrinsic capacity (Principle 1) dominates, making it as wrong as killing a child. Relational significance isn't *needed* here because the intrinsic capacity is so high.
  *   **Withdrawing Feeding Tube (PVS):** **✓ Consciousness:** ABSENT. **✓ Relational Significance:** HIGH (human, family member). **Result:** No intrinsic capacity to harm (Principle 1). Allowing death is permissible (Principle 4 applies weakly as letting die is easier than killing, but the core is lack of consciousness).
  *   **Killing PVS Patient for Organs:** **✓ Consciousness:** ABSENT. **✓ Relational Significance:** HIGH. **Result:** Lack of consciousness *should* make it permissible. Your discomfort stems from **Principle 4 (Active Killing vs. Letting Die)** applied to a relationally significant entity. The *act* of killing feels like a violation of the human form/relationship, even without consciousness.
  *   **Anencephalic Infant:** **✓ Consciousness:** ABSENT. **✓ Relational Significance:** HIGH (human infant, triggers parental instincts). **Result:** Permissible to let die or actively end life due to lack of consciousness (Principle 1). Your balk at equating it to killing a pig is due to **Principle 2 (Relational Significance)**. The infant, despite lacking consciousness, occupies a uniquely human relational category ("our child") that a pig, even a conscious one raised for food, does not.

  **Where the Framework Strains & What You Might Need to Reconsider:**

  *   **Macaques vs. Disabled Children:** The framework explains this primarily via **Relational Significance (Principle 2)**. To keep this, you must accept that relational/human kinship factors *can* outweigh significant benefits and comparable intrinsic capacities. This *is* a form of speciesism, albeit mediated through relationship rather than pure biology.
  *   **PVS Killing vs. Withdrawal:** The framework explains your discomfort via **Principle 4 (Active Killing vs. Letting Die)** interacting with **Principle 2 (Relational Significance)**. To keep both verdicts, you must accept this psychological/moral distinction holds weight for you even when consciousness is absent.
  *   **Anencephalic Infant vs. Pig:** The framework explains the difference through **Principle 2 (Relational Significance)** applied to the infant. To keep this, you accept that the symbolic/human-relational value persists even without consciousness, creating a distinction from a conscious pig.

  **Prediction: Human with Severe Brain Injury (Functioning at Dog Level)**

  *   **✓ Consciousness:** Presumably moderate richness (similar to a dog: capable of pleasure, pain, fear, basic affection, but lacking complex future planning, abstract thought, self-awareness of a typical human child or the engineered pig).
  *   **✓ Relational Significance:** VERY HIGH (human being, family member, triggers deep kinship/species identification).

  **Predicted Verdict:** Killing this human would be **strongly wrong**, likely perceived as worse than killing a dog with equivalent capacities.

  *   **Why:** The **Relational Significance (Principle 2)** is immense and would dominate the assessment. While their intrinsic capacity (Principle 1) might be similar to a dog, the human relationship and kinship factor elevate their protection far beyond the dog's level. Contextual justifications (e.g., resource burden) would need to be *extraordinarily* strong to even be considered permissible, and likely wouldn't overcome the relational barrier. The aversion would be much stronger than for the PVS patient, as this individual *does* possess conscious experience, even if limited.

  **Conclusion:**

  You aren't a pure speciesist (valuing humans simply for being human), nor a pure utilitarian valuing only capacity for welfare. Your judgments reflect a **hybrid model**:

  1.  **Intrinsic Value:** Based on the richness of subjective experience.
  2.  **Relational Value:** Based on human connections and kinship, granting significant extra weight to entities within the human sphere.
  3.  **Contextual Permissibility:** Allowing lesser harms to entities lower on the intrinsic scale for strong practical reasons.
  4.  **Act/Omission Distinction:** Aversion to actively killing, especially relationally significant entities, even when outcomes are similar to letting die.

  This explains why the engineered pig (high intrinsic) is protected like a child, the disabled children (high relational) are protected despite low capacity, the PVS killing feels worse than withdrawal (act/omission + relational), and the brain-injured human will be seen as vastly more protected than a dog with equivalent capacities (powerful relational significance).
