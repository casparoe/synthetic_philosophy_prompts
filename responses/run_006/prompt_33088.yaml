prompt: |-
  Last night a friend and I spent the whole evening arguing about whether the features that mechanistic interpretability claims to find inside trained neural networks are really there. He took the deflationary line: a trained network is, for explanatory purposes, just a function from inputs to outputs, and talk of hidden units representing curves, syntax, or truth is a gloss we impose on it, because the same function can be implemented in endlessly many ways and an activation space can be carved into features in endlessly many ways. He pressed the usual points — a linear probe can recover a label from activations even when the network is not using it, sparse autoencoders choose a dictionary rather than reading one off the weights, and since nearly any direction in activation space has some causal effect when you intervene, causal manipulability cannot by itself separate a real feature from a convenient fiction. I defended the opposite view, but by the end of the evening I felt I had not given the strongest version of it.

  I would like you to argue for a moderate realism about neural network representations: the claim that at least some of the structures uncovered by interpretability methods are genuine features of the trained network rather than artifacts of the method. Engage the deflationist's strongest form of the argument, not a strawman. In particular, explain why underdetermination of description and the limitations of probes do not by themselves defeat realism; propose the criterion or criteria you think actually distinguish real features from artifacts, such as convergence across independently derived methods, the specificity of causal effects under controlled interventions, or predictive power on novel inputs; and address the worry that any such criterion is question-begging or would also rule out the unobservable posits of other sciences. I am less interested in a survey of interpretability methods than in a single, well-structured argument.
reasoning: |-
  Okay, the user and their friend had a deep debate about whether the features found in neural networks through mechanistic interpretability are real or just interpretations we impose. The user is looking for a strong argument to counter their friend's deflationary view. Let me start by understanding the core of the deflationist argument: underdetermination and probes. They argue that since the same function can be implemented in many ways, and probes might find features that aren't actually used, the features aren't real.

  Hmm, the user wants a moderate realism stance. They mentioned criteria like convergence across methods, causal specificity, and predictive power. Need to show these criteria can distinguish real features without begging the question. Also, address the worry that these criteria might rule out unobservables in other sciences. 

  First, underdetermination: multiple implementations don't necessarily mean no structure. The key is whether the network's specific structure performs computations in a way that's necessary for its function. For example, if a feature like curve detectors in vision models consistently appears across different models and training runs, that suggests it's a robust solution, not an arbitrary choice. Convergence of evidence from different interpretability methods could strengthen this. If SAEs, causal interventions, and behavioral probes all point to the same features, that's harder to dismiss as an artifact.

  Causal specificity is another point. If intervening on a specific neuron changes the output in a predictable way—like flipping a "truth" feature altering truthfulness without affecting other attributes—that indicates the feature is integral. The deflationist might argue that any direction can have an effect, but specificity matters. Does the intervention only affect the intended feature without side effects? Real features should have targeted effects.

  Predictive power on novel inputs is crucial. If a feature identified through interpretability can predict how the network responds to new, unexpected inputs, that's strong evidence. For example, if a syntax detector activates only on grammatical structures, even in adversarial cases, it's more likely to be a real component.

  Addressing the worry about unobservables: in other sciences, like physics, we infer electrons from multiple lines of evidence—cloud chambers, particle collisions, etc. Similarly, in neural networks, convergence across methods and predictive validity serve the same role. The criteria aren't question-begging because they rely on empirical evidence and testable predictions, not assuming realism upfront.

  Also, the deflationist's point about probes: just because a linear probe finds a feature doesn't mean it's used. But combining probes with causal interventions can show whether the feature is causally active. If ablating neurons disrupts the probe's accuracy and the network's performance, that links the representation to function.

  Need to tie these together: convergence, causal specificity, and predictive power form a web of evidence. No single method is foolproof, but together they provide a robust case for realism. The user’s deeper need might be to have a structured, philosophical argument that counters their friend's points methodically, using concrete examples from ML research. Emphasizing that the burden of proof is on the deflationist to explain why convergent evidence doesn't indicate reality. Also, highlighting that the network's internal structure is optimized for efficiency, leading to discoverable features rather than arbitrary implementations.
answer: |-
  Here is a structured argument for moderate realism about neural network representations, engaging the strongest deflationary challenges while proposing concrete criteria to distinguish genuine features:

  ### Core Argument: Convergence, Causal Specificity, and Predictive Power Establish Robust Features
  The deflationist correctly argues that *any single interpretability method* (linear probes, SAEs, interventions) is insufficient to establish realism due to underdetermination and methodological artifacts. However, **convergent evidence across independent methods, coupled with causal specificity and novel predictive power, creates a robust case for genuine features**. This mirrors established scientific practices for inferring unobservable entities.

  ### Step 1: Acknowledging the Deflationist's Strongest Points
  - **Underdetermination of Implementation**: Yes, identical input-output functions *can* be implemented via countless weight configurations.  
  - **Probe Limitations**: Linear probes *can* decode features unused by the network (e.g., probing random projections).  
  - **SAE Subjectivity**: Sparse autoencoders *do* impose a sparsity prior; dictionaries aren't uniquely determined.  
  - **Causal Promiscuity**: Arbitrary activation directions *can* influence outputs when perturbed.  

  *These are valid concerns for any single method in isolation.*

  ### Step 2: Why Underdetermination Doesn’t Defeat Realism
  Underdetermination is ubiquitous in science (e.g., quantum mechanics interpretations), yet we still accept robustly confirmed entities (electrons, genes). The key is **convergence of independent lines of evidence**:
  - **Example**: Curve detectors in vision models (e.g., InceptionV1) appear via:  
    a) **Direct visualization** (Olah et al.): Optimizing inputs to maximally activate neurons yields curve-like patterns.  
    b) **Causal interventions**: Ablating these neurons disrupts curved-edge recognition *specifically* without harming unrelated tasks.  
    c) **SAE dictionaries**: Learned features match visualized curves *without supervision* (Bricken et al.).  
    d) **Behavioral prediction**: Activating these neurons induces false curve perceptions in novel images.  
  - **Countering underdetermination**: While *other implementations* of curve detection *could* exist, the *specific* neurons found across methods are *functionally necessary* for this network’s behavior. Convergence rules out "glosses" arbitrarily imposed by one method.

  ### Step 3: Criteria for Distinguishing Real Features from Artifacts
  1. **Convergence of Independent Methods**:  
     - A feature is robust if found via ≥3 *methodologically distinct* approaches (e.g., activation maximization + causal intervention + unsupervised dictionary learning).  
     - *Why it works*: Artifacts of one method (e.g., SAE sparsity) won’t align with others (e.g., causal effects).  

  2. **Causal Specificity**:  
     - Intervening on a purported feature (e.g., "truth direction" in LLMs) must produce:  
       a) **Predictable changes** (e.g., flipping truth → consistent lies),  
       b) **Task-specificity** (e.g., no effect on syntax/fluency),  
       c) **Minimal side effects** (low disruption to unrelated outputs).  
     - *Countering promiscuity*: Specificity rules out arbitrary directions—only *causally focal* features show targeted effects.  

  3. **Predictive Power on Novel Inputs**:  
     - A genuine feature must predict model behavior on *adversarial or OOD data* it wasn’t designed for.  
     - **Example**: An "io token" feature in Grok-1 (Mercer et al.) predicts attention patterns in never-before-seen prompt templates.  
     - *Countering probe objections*: Unlike linear probes (passive observers), predictive features must *generalize* to unseen contexts.  

  ### Step 4: Addressing the "Question-Begging" and "Unobservables" Worries
  - **Not circular**: Criteria are *testable*:  
    - Make a convergence-based claim ("Neuron X detects curves"), then *falsify it* via novel interventions (e.g., if curve ablation doesn’t harm curve detection).  
    - Failures occur (e.g., polysemantic neurons resist SAE reconstruction), proving criteria aren’t tautological.  
  - **Aligned with scientific realism**:  
    - Electrons are inferred from *multiple instruments* (cloud chambers, particle colliders), just as features rely on multiple interpretability tools.  
    - **Key analogy**: Just as fractional charges distinguish quarks from noise, *causal specificity* distinguishes features from artifacts. If an intervention flips *only* truthfulness (like flipping quark spin changes *only* magnetic properties), it reflects structure.  
  - **Burden shift**: Deflationism must explain why convergence occurs *without* real features. Parsimony favors realism.  

  ### Conclusion: Moderate Realism as the Best Explanation
  When features satisfy **convergence** (found via visualization, SAEs, *and* probes), **causal specificity** (targeted behavioral change under intervention), and **novel predictive power** (generalizing to adversarial inputs), the simplest explanation is that they reflect genuine computational structures the network *uses*—not methodological artifacts. This doesn’t claim *all* purported features are real (many fail these criteria), but that the most robust ones (curve detectors, induction heads, modular circuit motifs) are as real as neurons in brains or transistors in CPUs. The deflationist’s underdetermination argument, while logically possible, ignores the *empirical constraints* imposed by convergent evidence and causal specificity—constraints that ground scientific realism universally.

  ---
  **Key References in Argument**:  
  - Curve detectors: Olah et al. (Zoom In: An Introduction to Circuits, 2020)  
  - Causal specificity: Geiger et al. (Causal Abstractions of Neural Networks, 2023)  
  - Predictive power: Marks & Tegmark (Geometry of Truth, 2024) on truth vectors generalizing to new prompts.  
  - Convergence: Bricken et al. (SAEs Find Superposition, 2023) on matching features across methods.
