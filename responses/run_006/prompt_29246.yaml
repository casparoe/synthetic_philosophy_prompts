prompt: |-
  I'm a science journalist, most of my beat is AI and the people making claims about it. Every week I get pitched some version of "our model beat the benchmark" or "superhuman performance on X," and I have maybe twenty-five minutes before my editor wants to know whether we're running it. Getting it wrong means we either hype a trick or bury a real story, and either way we burn trust with readers. I know just enough to know that Goodhart's law and the specification-gaming literature say a metric stops meaning what I think it means once a system is optimized against it. But I don't have a procedure I can actually run.

  So: write me a reusable screening procedure, a checklist in words, that I can run on any "model solved X" claim before I write it up. Ground it in what's actually known about Goodhart's law and specification gaming, but keep it usable by someone who is not a metrics expert and has to explain the call to an editor (the editor signs off). It should have the questions in the order I should ask them, what counts as a good enough answer to each, where the procedure stops with a no or a kill, and where it hands the decision to a person because its a judgment call (mine or the editor's). Be honest about the cases the procedure will miss or misfire on — I'd rather know the procedure's blind spots then feel falsely safe.

  Then run the procedure on three claims, and show me the actual output at each step, not just the conclusion:
  1. A company says its model passed the multiple-choice part of a bar exam at the 90th percentile of human test-takers.
  2. A lab says its reasoning model beats human averages on a public benchmark, but I've heard a rumor that the scores collapse when the answer order is shuffled.
  3. A hospital group says its imaging model "matches board-certified radiologists" at spotting pneumonia on chest X-rays, with an AUC of 0.98 on a big public dataset.

  I should say up front: the third one is a story I'd really like to write. If your procedure tells me to kill it or shrink the headline to something boring, say so and show me why.

  Last line: give me a one-sentence summary of the procedure's bottom line, starting with "Bottom line:".
reasoning: |-
  We are creating a reusable screening procedure for evaluating claims that a model has "solved" a task based on achieving high performance on a benchmark. The procedure is grounded in Goodhart's law (when a measure becomes a target, it ceases to be a good measure) and the literature on specification gaming (models exploiting unintended shortcuts in the benchmark).

  The checklist is designed for a science journalist with limited time and technical expertise. It has clear stopping points (kill the story) and points where the decision must be passed to a human (journalist or editor) for judgment.

  Procedure Checklist:

  1. **What is the benchmark?**
     - Question: Exactly which benchmark was used? Is it a well-established, widely recognized benchmark in the field?
     - Good enough: The benchmark is a standard, publicly available one with a clear description and known limitations. If not, stop and require more details or consider it a red flag.
     - If the benchmark is not standard or not clearly specified, kill the story (or at least the headline claim) because it's too vague to verify.

  2. **How was the benchmark administered?**
     - Question: Does the evaluation setup match the real-world conditions the benchmark is intended to represent? (e.g., for a bar exam, was it taken under timed conditions with the same resources? For medical imaging, was the dataset representative of real patient populations?)
     - Good enough: The setup is as close as possible to the intended conditions, and any deviations are clearly stated and justified. If there are major deviations, especially if they might inflate performance, this is a red flag.
     - If the setup is significantly different (e.g., allowing the model to use external tools that humans wouldn't have, or using a non-representative subset), then kill the headline claim and consider a more nuanced story (if at all).

  3. **What are the known limitations and shortcuts of the benchmark?**
     - Question: Are there known issues with the benchmark that allow gaming? (e.g., data leakage, common shortcuts, or overfitting to specific patterns in the data)
     - Good enough: The claim addresses known issues (e.g., by using a held-out test set, or by testing against adversarial examples). If the claim does not address known issues, it's a red flag.
     - If there are known shortcuts and the evaluation doesn't test for them, then the claim is suspect. Proceed to step 4, but be prepared to kill the story if step 4 reveals problems.

  4. **Robustness checks: Does performance hold under variation?**
     - Question: Have the authors performed robustness checks? (e.g., varying the input, testing on out-of-distribution data, or checking for invariance to irrelevant changes like shuffling answer choices)
     - Good enough: The authors report results from multiple variations or adversarial tests and performance remains high. If they haven't done any, this is a major red flag.
     - If there are no robustness checks and the benchmark is known to be gameable, kill the headline claim. If robustness checks fail (like performance drops significantly), kill the story.

  5. **Comparison to humans: Is it apples-to-apples?**
     - Question: If the claim involves human comparison, how exactly were humans evaluated? (e.g., same questions, same conditions, same time constraints, and same scoring?)
     - Good enough: The human comparison is under the same conditions and the human performance is reported from a comparable setup (or a known standard). If not, the comparison is misleading.
     - If the human comparison is not apples-to-apples, kill the headline claim and reframe the story without the comparison.

  6. **Real-world relevance: What does the benchmark actually measure?**
     - Question: Does the benchmark measure the actual skill we care about in the real world? (e.g., passing a bar exam multiple-choice section doesn't make one a lawyer; high AUC on a medical dataset doesn't necessarily translate to clinical utility)
     - Good enough: The benchmark is a valid proxy for the real-world skill. If it's not, then the claim is overreaching.
     - This is a judgment call: if the benchmark is a poor proxy, the journalist must reframe the story to avoid overhyping.

  7. **Independent verification: Has the result been reproduced?**
     - Question: Is the result independently verified? (e.g., by a third party, or on a different dataset)
     - Good enough: The model is evaluated on a public benchmark and the code/data are available for replication. If not, the claim is less credible.
     - This is not a kill step but a caution: if there's no independent verification, the story should be framed as a preliminary result and include caveats.

  8. **Blind spots and misfires:**
     - The procedure might miss:
       - Novel forms of gaming not yet documented.
       - Benchmarks that are inherently flawed but not yet recognized as such.
       - Claims that are technically true but misleading in context (e.g., the benchmark is trivial).
     - The procedure might misfire by being too strict on new benchmarks that are not yet established but valid, or by not catching very subtle gaming.

  Now, we run the procedure on the three claims.

  ---

  **Claim 1: A company says its model passed the multiple-choice part of a bar exam at the 90th percentile of human test-takers.**

  1. **What is the benchmark?**
     - The multiple-choice part of a bar exam. This is a well-known exam, but we need to know which jurisdiction and which year? The exact exam matters because content varies.
     - If it's a standard bar exam (like the MBE in the US) and publicly available, it's good. Otherwise, red flag.
     - Assume it's a standard one. Good enough.

  2. **How was the benchmark administered?**
     - Was it taken under timed conditions? Were the same rules applied (e.g., no external resources)? If the model had unlimited time or used resources humans couldn't, that's a problem.
     - If the conditions match, good. Otherwise, kill the headline claim. We'll assume the company says they followed standard conditions.

  3. **Known limitations?**
     - Bar exams are designed for humans and may have patterns that models can exploit (e.g., linguistic cues). Also, the multiple-choice part is only one component of the bar exam.
     - If the model was trained on past bar exam questions, there might be data leakage. We need to know if the test set was held out properly.
     - Without knowing about leakage, we proceed but note the risk.

  4. **Robustness checks?**
     - Were variations tested? (e.g., paraphrasing questions, shuffling choices) If not, it's a red flag.
     - We have no information about robustness checks. This is a weak point. We must ask: if the company hasn't done any, then we have to be cautious.

  5. **Comparison to humans: Apples-to-apples?**
     - The claim says "90th percentile of human test-takers". How were the human scores obtained? Are they from the same exam? Human percentiles are usually from the actual test-takers. If the model's score is compared to that distribution, that's okay.
     - But note: the model only did the multiple-choice part. Humans have to do the entire exam. This might be acceptable if the multiple-choice part is scored separately.

  6. **Real-world relevance?**
     - Passing the bar exam (even the whole thing) doesn't make one a lawyer (it's a license requirement, but practice is more). But the multiple-choice part alone is even less. The claim is about passing that part, so it's a limited achievement.
     - Judgment call: The claim is about a specific test, so it's true as far as it goes, but it must be contextualized. The headline should not imply the model is a lawyer.

  7. **Independent verification?**
     - Not mentioned. Without independent verification, we should note that.

  **Output for Claim 1:**
  - Step 1: Pass (benchmark is standard)
  - Step 2: Pass (assume conditions match)
  - Step 3: Caution (potential data leakage if training data included past questions? Not clear)
  - Step 4: Red flag (no robustness checks mentioned) -> This could be a kill for the headline if we can't verify robustness, but we don't have evidence of gaming. We might proceed with caution.
  - Step 5: Pass (if the human comparison is fair) but note the limited scope (only multiple-choice).
  - Step 6: Judgment call: The story can be written but the headline must be specific: "Model achieves high score on multiple-choice portion of bar exam" and note that it's not the full exam.
  - Step 7: No independent verification -> include caveat.

  **Overall for Claim 1:** The story can be written but with caveats about the scope (only multiple-choice) and the lack of robustness checks. Headline must not overstate.

  ---

  **Claim 2: A lab says its reasoning model beats human averages on a public benchmark, but I've heard a rumor that the scores collapse when the answer order is shuffled.**

  1. **What is the benchmark?**
     - It's a public benchmark, so that's good.

  2. **How administered?**
     - Assume standard setup.

  3. **Known limitations?**
     - We've heard a rumor about shuffling answer order. If shuffling the choices causes a collapse, that suggests the model is relying on the order (a shortcut) and not true reasoning.

  4. **Robustness checks?**
     - We have information that shuffling the answer order causes a collapse. This is a failed robustness check. Therefore, the model is gaming the benchmark.

  5. **Comparison to humans:**
     - If the model fails when the order is shuffled, then the original comparison to humans is invalid because humans wouldn't rely on the order.

  **Output for Claim 2:**
  - Step 1: Pass (public benchmark)
  - Step 2: Pass (assuming standard)
  - Step 3: Known issue (rumor about shuffling) -> red flag
  - Step 4: Robustness check (shuffling) fails -> kill the headline claim. The model does not beat humans in a robust way.

  **Overall for Claim 2:** Kill the story as it stands. The claim is invalidated by the robustness issue. If the journalist wants, they could write a story about the fragility of benchmarks, but not about the model's achievement.

  ---

  **Claim 3: A hospital group says its imaging model "matches board-certified radiologists" at spotting pneumonia on chest X-rays, with an AUC of 0.98 on a big public dataset.**

  1. **What is the benchmark?**
     - A big public dataset (e.g., CheXpert or MIMIC-CXR). This is standard.

  2. **How administered?**
     - We need to know: were the radiologists and the model evaluated on the exact same images? Under the same conditions? Typically, radiologists in studies are given the same images without patient history (which they might have in real life). Also, the model might have been trained on the same dataset? We must check for data leakage.

  3. **Known limitations?**
     - Public datasets may have biases (e.g., certain machines, populations). Also, AUC is a common metric but may not capture clinical utility (e.g., false positives/negatives in context).

  4. **Robustness checks?**
     - Were the images tested from different hospitals? Different machines? If the model was tested on the same dataset it was trained on (or from the same source), it might not generalize. Also, how does it handle ambiguous cases?
     - We have no information about robustness checks beyond the AUC on the public dataset.

  5. **Comparison to humans: Apples-to-apples?**
     - The radiologists were board-certified, but were they given the same images without context? And how many radiologists? If it's an average, it might be fair. But note: in real life, radiologists have more context (patient history, etc.). The model might be at a disadvantage (or advantage) without that.

  6. **Real-world relevance?**
     - Spotting pneumonia on X-rays is a real task. AUC of 0.98 is very high. But does it translate to clinical practice? The model might be used as a second reader, but "matches" might imply it can replace, which is a stretch without more evidence (e.g., prospective studies).

  7. **Independent verification?**
     - The dataset is public, so others can test. But has this specific model been independently tested? Unlikely at this stage.

  **Output for Claim 3:**
  - Step 1: Pass (public dataset)
  - Step 2: Caution: Were the radiologists evaluated in the same way? (e.g., without context) If so, it's acceptable. But if the model was trained on the test set, that's leakage. We must check: was the dataset split properly? (training, validation, test) If not, kill. Assume they did a proper split? If we don't know, we must ask. Without confirmation, red flag.
  - Step 3: Known limitations: Public datasets may have biases. Also, AUC is a summary metric and doesn't tell the whole story (e.g., at a specific operating point, the false positive rate might be too high for clinical use).
  - Step 4: Red flag: No robustness checks mentioned (e.g., external validation on a different dataset). Without that, the result might not generalize. This is a common issue in medical AI.
  - Step 5: The comparison might be fair in the study setup, but note that radiologists in practice have more context. The claim "matches" might be true in the study context but not necessarily in practice.
  - Step 6: Real-world relevance: The benchmark is a good proxy, but without prospective studies, we don't know if it improves outcomes. The headline "matches" might be acceptable but must be qualified: "on a specific dataset in a controlled setting".

  **Overall for Claim 3:** This is a story you want to write, but the procedure flags several issues. The headline must be toned down: "Model shows high accuracy in detecting pneumonia on chest X-rays in controlled study" and not "matches radiologists" without qualification. Also, emphasize the need for real-world testing and the limitations of the dataset. Without robustness checks (especially external validation), the result might not hold up. Therefore, the story should be written but with caveats. If the editor wants a splashy headline, push back because the evidence is preliminary.

  ---

  **Bottom line:** Always assume that a benchmark result may be gamed until proven robust, and focus on verifying the evaluation setup, robustness, and real-world relevance before reporting.
answer: |-
  Below is a reusable screening procedure grounded in Goodhart's law and specification gaming. It prioritizes efficiency (5–10 minutes per claim) and clear decision points. The procedure has four outcomes: **Proceed** (story likely valid), **Reframe** (story needs caveats/nuance), **Kill** (claim is unreliable), or **Escalate** (editor/judgment call). Blind spots are noted at the end.

  ---

  ### Screening Procedure: "Model Solved X" Claims  
  **Ground rules:**  
  - Stop at any **Kill** step.  
  - "Good enough" answers must be verifiable in the claim, press release, or supplemental materials.  
  - If a step requires external knowledge (e.g., benchmark flaws), use trusted sources (ML Commons, arXiv critiques, expert quick-call).  

  **Checklist:**  
  1. **Benchmark provenance**  
     - *Question:* Is the benchmark widely used, publicly accessible, and *independent* of the model's training data?  
     - *Good enough:* Yes, and test data is held-out/not leaked.  
     - *Red flags:* Proprietary benchmark, no dataset details, or training/test data overlap.  
     - **Kill if:** Benchmark is obscure, private, or leak confirmed.  
     - *Judgment call:* If unclear, Escalate to editor with "dataset risk."  

  2. **Human comparison integrity**  
     - *Question:* Are human comparison methods *identical* (same inputs, conditions, and metrics) for both humans and the model?  
     - *Good enough:* Humans tested under realistic conditions (e.g., time limits, no cherry-picked experts).  
     - *Red flags:* Humans tested differently (e.g., model gets unlimited time), or "human average" is undefined.  
     - **Kill if:** Comparison is apples-to-oranges (e.g., model uses tools humans can't).  
     - *Judgment call:* If humans are experts but model isn't tested in real workflow.  

  3. **Robustness stress-tests**  
     - *Question:* Does performance hold under simple perturbations (e.g., shuffling labels, noise, adversarial tweaks)?  
     - *Good enough:* Claim includes sensitivity analysis (e.g., "accuracy drops <5% under perturbation X").  
     - *Red flags:* No robustness checks, or known exploits exist (per literature/rumors).  
     - **Kill if:** Proven sensitive to trivial changes (e.g., answer order shuffle crushes performance).  
     - *Judgment call:* If no checks but benchmark is robust by design (rare).  

  4. **Metric validity**  
     - *Question:* Does the metric measure *real-world capability* or a narrow proxy?  
     - *Good enough:* Metric correlates with practical outcomes (e.g., diagnostic AUC ties to patient survival).  
     - *Red flags:* Metric is easily gamed (e.g., multiple-choice without reasoning checks) or irrelevant to task.  
     - **Reframe if:** Metric is incomplete (e.g., bar exam MCQs ≠ legal competency).  
     - *Judgment call:* Escalate to editor if metric-vs-reality gap is high (e.g., "accuracy" in messy environments).  

  5. **Independent verification**  
     - *Question:* Is there third-party validation or reproducibility evidence?  
     - *Good enough:* Code/data public, or results replicated by neutral party (e.g., academic lab).  
     - *Red flags:* No replication, conflicts of interest (e.g., hospital evaluating its own product).  
     - **Reframe if:** Unverified but methodologically sound (add "preliminary" or "internal study").  
     - *Judgment call:* None. Unverified claims default to "Reframe."  

  **Blind spots & misfires:**  
  - Misses novel gaming tactics (e.g., latent space exploits).  
  - Misfires on benchmarks with no documented flaws (even if flawed).  
  - Cultural biases (e.g., Western-centric medical datasets) may slip through.  
  - *Trust killer:* Over-reliance on developer-provided data.  

  ---

  ### Procedure Applied to Claims  
  **Claim 1: Model passed bar exam MCQs at 90th percentile of humans.**  
  1. **Benchmark provenance:**  
     - *Output:* Likely standard (e.g., MBE), but confirm if test data is held-out. If trained on past exams, **Kill** (data leakage risk).  
     - *Judgment:* Good enough if data split confirmed.  
  2. **Human comparison integrity:**  
     - *Output:* Humans take full exam under timed conditions; model only does MCQs. **Reframe**—comparison is invalid unless humans’ MCQ-only scores are used.  
  3. **Robustness stress-tests:**  
     - *Output:* Bar exams have fixed answer orders. No shuffling test? If no perturbations checked, **Escalate** (risk: model memorizes patterns).  
  4. **Metric validity:**  
     - *Output:* MCQ scores ≠ legal competency (ignores essays/ethics). **Reframe** to "excels at bar exam multiple-choice questions."  
  5. **Independent verification:**  
     - *Output:* Unlikely public code. **Reframe** as "company-reported results."  
  **Final verdict: Reframe.** Story viable with caveats: "Model aces bar exam’s multiple-choice section, but real-world legal skill unproven."  

  **Claim 2: Reasoning model beats humans on benchmark, but rumor: scores crash if answer order shuffled.**  
  1. **Benchmark provenance:**  
     - *Output:* Public benchmark (good). Proceed.  
  2. **Human comparison integrity:**  
     - *Output:* If humans tested with same order, technically fair. But if shuffling hurts model, comparison is brittle. **Escalate**.  
  3. **Robustness stress-tests:**  
     - *Output:* Rumor confirms exploit. **Kill**—performance collapses under trivial shuffle (classic specification gaming).  
  4. *Stop at Kill step.*  
  **Final verdict: Kill.** Headline claim invalid; performance isn’t robust. Story could pivot to "benchmark flaws."  

  **Claim 3: Imaging model matches radiologists spotting pneumonia (AUC 0.98 on public dataset).**  
  1. **Benchmark provenance:**  
     - *Output:* Public dataset (e.g., CheXpert) is good. Ensure no data leakage. If model trained/tested on same source, **Kill**. Else, proceed.  
  2. **Human comparison integrity:**  
     - *Output:* Were radiologists given the same images with no patient history? If yes, good enough. If radiologists had context (real-world), **Reframe**.  
  3. **Robustness stress-tests:**  
     - *Output:* AUC is robust to class imbalance, but no mention of perturbations (e.g., image noise, scanner variations). **Reframe**—add "in controlled settings."  
  4. **Metric validity:**  
     - *Output:* AUC 0.98 is strong, but pneumonia diagnosis requires follow-ups (biopsies, clinical history). **Reframe** to "excellent scan analysis."  
  5. **Independent verification:**  
     - *Output:* Hospital group self-evaluated. **Reframe** with "internal study, unverified."  
  **Final verdict: Reframe.** You can write this, but headline must shrink: "Hospital AI shows promising pneumonia detection in lab study, but real-world validation needed." *Do not* use "matches radiologists"—it implies clinical parity.  

  **Bottom line:** Assume every benchmark is gamed until proven robust; prioritize claims with perturbation tests, independent checks, and real-world aligned metrics.
