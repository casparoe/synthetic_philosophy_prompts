  For point (i): Their weak/strong framing aligns with standard literature (Laudan/Leplin critiques), but calling strong underdetermination "self-refuting" might be overreach. I should note that while their criticism is fair, the "philosophically negligible" claim could use more nuance - some realists would fight about whether syntactic differences matter. Also worth mentioning the "evidence holism" counter-argument.

  For point (ii): Here's where things get spicy. Their constructive move doesn't automatically follow - van Fraassen would say virtues are pragmatic, not epistemic. I need to flag that their whole project assumes virtues need epistemic justification, which instrumentalists reject. The truth-conduciveness demand is exactly where the realism debate reignites.

  For point (iii): Definitely worth developing! The vulnerability is clear: their account leans on "miracles" arguments against Stanford, but Stanford's new pessimism might bite back. Also, they haven't specified whose account of virtues they'll use (Boyd? McMullin?). The strength is how they connect underdetermination to the deeper justification problem - that's fresher than rehashing the weak/strong debate.

  ...I should probably mention that their "no quiet presuppositions" challenge cuts both ways - anti-realists might say any "truth-conducive" account already begs the question. And maybe suggest they engage Kukla's social constructivist angle as another alternative.

