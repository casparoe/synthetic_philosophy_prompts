  Hmm, let me unpack their three specific requests. First, they're questioning whether their weak/strong distinction is accurate and if their criticism of the strong form holds. Second, they wonder if their constructive argument about non-empirical virtues logically follows from their critique or if they're assuming too much. Third, they're seeking validation on whether this essay is worth developing and where it might be vulnerable. 

