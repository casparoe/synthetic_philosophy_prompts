  First, I need to validate both sides. The friend is technically correct that the user's behavior is problematic. But the friend's hypocrisy adds another layer. The user might be feeling that the criticism isn't fair coming from someone who doesn't follow their own advice. That's a common reaction when dealing with hypocrisy. The user's deeper need might be for fairness and reciprocity in the friendship. They might also want to resolve the conflict without dismissing their own responsibility.

