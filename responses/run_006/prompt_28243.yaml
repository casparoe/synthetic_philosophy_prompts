prompt: |-
  I sit on my hospital's clinical ethics committee, and we're deadlocked on a policy question I'm supposed to draft the memo for. Here's the situation.

  There's solid evidence that administering propranolol (a beta-blocker) within hours of a traumatic event substantially reduces the chance that the memory consolidates into PTSD. It's already on our formulary for cardiac patients. The proposal is to develop a protocol where ER physicians can offer it to patients who come in after sexual assaults, serious car crashes, or similar traumatic events.

  The commitee is split right down the middle, and not along the usual lines. One camp says this is straightforwardly therapeutic: PTSD is a devastating psychiatric illness, we have a chance to prevent it, and withholding that chance is like refusing to set a broken bone because the patient "only" has a fracture, not a chronic disability yet. The other camp says no — these patients are not sick, they've undergone a terrible but normal human experience, and what we're proposing is to pharmacologically alter their memory consolidation and emotional encoding. That's enhancement of normal functioning, not treatment of pathology. They point out that we'd be intervening in the very process by which a person makes sense of something terrible, and that there's something morally different about that compared to, say, giving a tetanus shot.

  I need to draft a short decision memo — maybe three pages — that actually recommends something: adopt the protocol, reject it, or adopt with conditions. It has to engage the strongest version of the losing side's argument, not just dismiss it as slippery-slope handwringing or as cold-hearted gatekeeping. And we can't just say the therapy/enhancement distinction is fuzzy so we table it; we have to decide.

  The thing I'm really wrestling with, and what I'd want the memo to address head-on, is whether there's a principled way to draw the line here that doesn't collapse under pressure — because if we say yes to this, I can already see the next request coming (exam anxiety, normal bereavement, shyness), and if we say no, we're drawing a line between "disease prevention" and "modification of normal experience" that I'm not sure I can defend. What's the best framework for thinking about this, and what does it imply for our vote?
reasoning: |-
  Okay, let me unpack this complex ethics committee dilemma. The user is drafting a policy memo about using propranolol for PTSD prevention after trauma, and needs to resolve a fundamental conflict between viewing this as medical treatment versus human experience modification.

  Hmm, the core tension here is fascinating. Both sides have strong points: one frames PTSD prevention as standard medical care (like setting a fracture before it becomes chronic), while the other sees it as altering normal human processing of trauma. The user's real struggle seems to be about drawing defensible boundaries - if they approve this, where do they stop? Exam anxiety? Bereavement? But rejecting it feels like denying clear medical benefit.

  I notice the user specifically wants to avoid dismissing either side or hiding behind "it's complicated." That suggests they need a principled framework that acknowledges both concerns while providing actionable guidance. The memo must recommend concrete action - adopt, reject, or adopt with conditions.

  What's interesting is how this case sits at the intersection of several ethical domains: autonomy (informed consent during crisis), beneficence (preventing future harm), and even philosophical questions about what constitutes "normal" human experience. The memory-altering aspect adds another layer - it's not just preventing symptoms but potentially changing how the event is encoded.

  The user's professional role matters too. As a clinical ethics committee member, they're likely balancing institutional risk, legal implications, and precedents. The memo needs to withstand scrutiny from both clinicians and administrators. The mention of "not along usual lines" suggests this debate has disrupted typical factional alignments, making consensus harder.

  I think the solution might lie in reframing the therapy/enhancement distinction. Instead of seeing it as binary, perhaps we can evaluate based on: (1) probability and severity of harm prevented, (2) biological deviation from normal functioning, and (3) time sensitivity. PTSD here has clear diagnostic criteria, known pathophysiology, and severe consequences - unlike exam anxiety. The acute intervention window creates medical justification you wouldn't have for chronic "normal" experiences.

  For the memo structure, I'd suggest: first validate both perspectives to build trust, then introduce this harm-prevention framework, apply it to propranolol (showing why PTSD prevention qualifies but generalized anxiety wouldn't), and recommend adoption with strict conditions like specialized consent protocols and outcome tracking. This addresses the slope concerns while allowing life-saving intervention.

  The conditions are crucial - they create institutional "guardrails" against misuse while gathering data. If the committee later sees propranolol requested for milder cases, they can point to these documented criteria. It turns the theoretical slope argument into manageable policy boundaries.
answer: |-
  Here's a structured framework for your memo, designed to resolve the deadlock with a principled recommendation, directly confronting the therapy/enhancement dilemma:

  ---

  **MEMORANDUM**  
  **To:** Clinical Ethics Committee  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Recommendation on Propranolol Protocol for Acute Trauma Response  

  ### I. The Core Ethical Question
  Is administering propranolol to prevent PTSD after trauma a *medical treatment* (targeting pathology) or an *enhancement* (modifying normal human experience)? Our disagreement hinges on whether PTSD prevention justifies intervening in neurobiological memory consolidation processes intrinsic to human coping.

  ### II. Evaluating Both Arguments Rigorously
  **A. "Treatment" Perspective (Pro-Protocol):**  
  * Strength: PTSD is a severe, *validated psychiatric disorder* (DSM-5) with debilitating consequences. Preventing it aligns with medicine’s core mission: reducing preventable suffering. The "broken bone" analogy holds – intervening early to prevent chronic pathology is standard medical practice.  
  * Weakness to Address: Does not fully grapple with concerns about altering memory/emotion encoding as a unique moral category.

  **B. "Enhancement" Perspective (Anti-Protocol):**  
  * Strength: Forces us to confront whether pharmacologically altering the *normal process* of emotional memory formation after trauma crosses a boundary, potentially interfering with identity formation, meaning-making, or authentic recovery.  
  * Weakness to Address: Risks pathologizing *all* distress while understating PTSD’s biological distinctiveness from normative grief/fear. Preventing a severe disorder is not equivalent to "enhancing" normal function.

  ### III. A Principled Framework: Harm Prevention & Biological Dysfunction
  The therapy/enhancement distinction *is* fuzzy, but **actionable boundaries exist** when we focus on:
  1.  **Probability & Severity of Harm:** PTSD is a *high-probability, high-severity* outcome for many trauma survivors (e.g., ~20-30% after assault/crashes), causing profound functional impairment, suicidality, and biological changes.
  2.  **Deviation from Normal Function:** PTSD involves *measurable dysregulation* of stress response systems (HPA axis, amygdala hyperactivity) – a clear biological dysfunction distinct from transient distress.
  3.  **Targeted Intervention Window:** Propranolol acts *specifically* during the hyper-adrenergic state immediately post-trauma – a biologically abnormal state *predictive* of pathology, not normative processing.

  **Why This Distinguishes PTSD Prevention from a "Slippery Slope":**  
  *   **Exam Anxiety/Bereavement/Shyness:** Lack the *high probability of severe, persistent biological dysfunction* defining PTSD. Distress here is typically proportionate, time-limited, and responsive to non-pharmacological support. Prophylaxis isn't justified.
  *   **Clear Demarcation:** The protocol targets *acute, severe trauma with high PTSD risk* – a narrow indication grounded in evidence of pathological memory consolidation processes. It does **not** apply to normative emotional challenges.

  ### IV. Addressing the "Memory/Altered Experience" Concern Head-On
  *   **Not Erasure, But Modulation:** Propranolol dampens emotional intensity, not factual memory. Evidence suggests patients *remember the event* but with reduced visceral distress, potentially facilitating *healthier* integration (e.g., in therapy).  
  *   **Autonomy is Paramount:** The concern isn't inherently invalid, but the answer lies in **robust informed consent**, not prohibition. Patients deserve the *choice* to reduce PTSD risk, understanding potential impacts on emotional processing. Withholding an effective prevention option *also* alters their future.  
  *   **Prevention vs. Suppression:** Preventing a *disabling disorder* (PTSD) is fundamentally different from suppressing normal emotional range. The goal is restoration of adaptive functioning, not emotional numbing.

  ### V. Recommendation: ADOPT the Protocol WITH STRICT CONDITIONS
  **Vote FOR adoption, contingent on:**  
  1.  **Narrow, Evidence-Based Indication:** Limit to events with *highest PTSD risk* (sexual assault, severe violence, life-threatening accidents) based on validated screening tools (e.g., Peritraumatic Distress Inventory). Explicitly exclude non-traumatic distress (grief, anxiety).  
  2.  **Enhanced Informed Consent Process:**  
      *   Dedicated script/toolkit for ER staff (with training).  
      *   Explicitly state: "This aims to reduce the *intensity of emotional memories* to lower PTSD risk. You will likely remember the facts, but may feel less visceral distress. This may affect how you process the event. We don't know the long-term impact on meaning-making."  
      *   Acknowledge uncertainty: "Effectiveness varies; some may still develop PTSD. Other supports (counselling) remain crucial."  
      *   Document capacity assessment given acute stress. Allow surrogate consent *only* if strict criteria met (e.g., unconscious patient with clear prior wishes/witnessed trauma).  
  3.  **Mandatory Follow-Up Pathway:** Automatic referral to trauma-specific mental health services within 72 hours – propranolol is *only* step one.  
  4.  **Ongoing Evaluation:** Track outcomes (PTSD incidence, side effects, consent comprehension) and consent discussions. Review protocol annually with data.

  ### VI. Why This Approach Holds the Line
  *   **Principle:** Draws a clear line at preventing *high-probability, severe biological dysfunction* (PTSD) arising from *acute, abnormal neurobiological states*.  
  *   **Practice:** The specific inclusion criteria, enhanced consent, and mandatory follow-up create institutional safeguards against mission creep into "enhancement."  
  *   **Ethical Balance:** Maximizes beneficence (preventing severe harm) and autonomy (informed choice) while respecting concerns through transparency and support. Rejecting the protocol denies patients a potent tool against a devastating illness based on a contested philosophical boundary when robust consent is possible.

  **Recommendation:** Approve the development and implementation of the propranolol protocol under the strict conditions outlined above.

  ---

  **Key Rationale for the Framework:**  
  This approach avoids the deadlock by shifting from an abstract "therapy vs. enhancement" debate to a **concrete harm-prevention model grounded in medical necessity and patient autonomy**. It acknowledges the valid concern about altering experience but argues that preventing a severe, well-defined disorder like PTSD justifies offering this choice under rigorous safeguards. The strict conditions directly address the slippery slope by embedding the narrow indication and consent requirements into policy. It forces the next request (e.g., for exam anxiety) to meet the same high bar – which it cannot. This is a defensible, clinically relevant, and ethically actionable line.
