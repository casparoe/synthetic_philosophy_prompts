  The user is clearly well-versed in the literature—they mention adjacent concepts like logical uncertainty and self-locating uncertainty but want to exclude those. They’re seeking a precise term for this specific "entanglement" problem, not just broader ideas like resource constraints or embodiment. Their frustration is palpable: they’ve seen this pattern everywhere but can’t find a named concept. 

  Hmm, the closest fit seems to be "reflective instability" or "decision-theoretic self-reference," but neither is perfectly established. The user might be hoping for a term that captures both the causal entanglement (like deliberation leaking into the world) and the modeling paradox (where including yourself creates regress). They also want clear boundaries—e.g., distinguishing this from an agent merely being slow (resource constraints) versus its slowness being a strategic signal. 

  I should emphasize how this differs from related ideas. For instance, in logical uncertainty, the agent doesn’t know a math proof, but the proof isn’t causally affected by their thinking. Here, the opponent literally changes behavior based on deliberation time. The self-modifying code case is even cleaner: the proof-checker is part of the system under analysis. 

  The user’s examples are spot-on. The bargaining one shows how external observers exploit the agent’s reasoning traces, while the AI case shows internal entanglement. Both break the "agent-as-external-observer" assumption. Maybe "causal loop of deliberation" or "endogenous reasoning processes" could work as terms? Though "reflective instability" feels most academic. 

  ...Wait, should I check if game theory has a term for this? Signaling games touch on it (deliberation time as a signal), but they don’t grapple with the recursive modeling problem. The AI safety angle (self-modification) might call it "meta-execution inconsistency" or something, but that’s jargon-heavy. 

  Ultimately, the user needs a label that’s both precise and useful for literature searches. Since no term is perfect, I’ll propose "reflective decision conflict" and define it tightly: when the agent’s deliberation process is both (1) part of the causal world modeled and (2) creates feedback that invalidates the model. Boundaries: exclude resource limits alone, logical uncertainty without causal loops, and self-location where the "self" isn’t reasoning. 

  ...And I’ll gently warn that some papers might mislabel this as "computational decision theory" or "bounded rationality," but those are broader. The key is the entanglement.
answer: |-
  Your observation targets a profound and under-acknowledged flaw in standard decision theory (SDT). This **failure of agent-world separability** arises when the agent's deliberation process is causally embedded in the world it models, creating feedback loops that invalidate SDT's core assumptions. While no single term is universally established, the most precise descriptors and their boundaries are as follows:

  ### Established Terms & Their Scope
  1.  **Reflective Decision Problem / Reflective Inconsistency:**
      *   **Fits:** Directly addresses the recursive self-reference issue (agent modeling its own modeling process). Common in AI safety, formal epistemology, and game theory with transparent agents.
      *   **Boundaries:**
          *   **Includes:** Self-modifying AI proofs, game-theoretic deliberation where thinking time/patterns are observable signals, agents predicting their own future beliefs/actions.
          *   **Excludes:** Simple resource constraints (e.g., time limits forcing suboptimal search), logical uncertainty about *external* facts (e.g., P vs NP), self-locating uncertainty ("where am I?" without recursive modeling).
      *   **Key Papers:** Garrabrant et al. ("Reflective Oracles", "Logical Induction"), Tennenholtz ("Program Equilibrium"), some work on "stable truth" in formal logic.

  2.  **Decision-Theoretic Self-Reference:**
      *   **Fits:** Emphasizes the infinite regress ("model containing a model of itself"). Used in discussions of self-prediction, self-trust, and self-modification.
      *   **Boundaries:**
          *   **Includes:** Proof-based systems verifying their own proofs, agents modeling how their own decision algorithm would decide.
          *   **Excludes:** Strategic interactions where deliberation is observed but *not* recursively modeled by the agent itself (e.g., basic signaling games).

  ### Near Misses (Why They Don't Fully Fit)
  *   **Embodied/Situated Cognition:** Broader focus on physical/environmental constraints. Doesn't specifically capture the *recursive modeling failure*.
  *   **Bounded Rationality:** Focuses on resource limitations and approximations. Your configuration persists *even with unbounded resources* due to the structural feedback loop.
  *   **Logical Uncertainty:** Concerns unknown logical/mathematical truths. Doesn't inherently involve the agent's *own deliberation process* as a causal object *within* the world model.
  *   **Self-Locating Uncertainty:** Concerns "where" or "when" the agent is in a structure. Doesn't necessarily involve modeling the *causal impact of the deliberation act* itself.
  *   **Computational Decision Theory:** Focuses on cost/feasibility of computation. Your issue is structural, not just computational.

  ### Proposed Term & Precise Definition
  If adopting a new term, **Causal Entanglement of Deliberation (CED)** captures the core:

  *   **Definition:** A decision scenario where an agent's process of deliberation is both:
      1.  **Causally Embedded:** A physical process within the world the agent is attempting to model, consuming resources, taking time, and/or generating observable traces.
      2.  **Model-Disruptive:** The causal effects of the deliberation process itself (or the necessity of modeling it) fundamentally alter the state of the world being modeled *in a way that invalidates the agent's initial model or decision procedure*, creating a feedback loop or regress problem.

  *   **Boundaries - What CED Includes:**
      *   Deliberation as a signal (e.g., bargaining via thinking time).
      *   Reasoning processes modifying the environment they reason about (e.g., writing proofs that alter code).
      *   Agents needing to model their own future/past decision states as part of the world state.
      *   Self-referential predictions (e.g., "What will I believe after I think about this?").
      *   Proof-based systems verifying components involved in their own verification.

  *   **Boundaries - What CED Excludes:**
      *   **Resource Constraints Alone:** Running out of time/memory *without* the deliberation process itself being a causal factor altering the world state *within the model* (e.g., just stopping early).
      *   **Pure Logical Uncertainty:** Reasoning about an *external*, fixed mathematical truth (e.g., Goldbach's conjecture), even if hard.
      *   **Self-Locating Uncertainty Without Deliberation Impact:** Not knowing your index in a structure, *unless* the act of reasoning changes your location or the structure.
      *   **Standard Signaling Games:** Where actions *are* signals, but the *deliberation process behind choosing that action* is not itself the signal or causally impactful. CED occurs when the *thinking itself* is the observable/causal event.
      *   **Simple Self-Modification:** Modifying code *without* needing to reason about the safety of the modification tool itself or the physical integrity of the reasoning process during modification.

  ### Why This Configuration Matters
  CED challenges the foundational **Cartesian Theater** assumption of SDT – the idea of an agent "outside" the world, passively observing and choosing. It forces a shift towards models where the agent is an *active, embedded component* whose cognition is part of the causal tapestry. Resolving CED often requires:
  *   **Fixed-Point Solutions:** Finding strategies or beliefs consistent with their own implications (e.g., reflective oracles, program equilibrium).
  *   **Hierarchical/Meta-Reasoning:** Explicitly modeling the limitations of the reasoning process itself.
  *   **Radical Frameworks:** Moving beyond expected utility maximization (e.g., logical induction, infra-Bayesianism).

  Your bargaining and self-modifying AI examples are paradigmatic cases of CED/Reflective Inconsistency. The core issue is the **inseparability of the modeler and the modeled** when the act of modeling is causal. This is distinct from the agent merely being *imperfect* (bounded rationality) or *uncertain about itself* (self-locating); it's about the causal loop collapsing the subject-object distinction central to SDT. While literature often touches on aspects of this, the specific configuration you describe lacks a universally adopted name – **Reflective Inconsistency** or **Causal Entanglement of Deliberation** are the most precise contenders.
