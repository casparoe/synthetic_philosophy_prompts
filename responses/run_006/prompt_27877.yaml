prompt: |-
  I serve on the risk assessment committee of a private foundation that funds research on global catastrophic and existential risks. We are considering a proposal requesting $2.3 million over three years to investigate whether a specific class of high-energy physics experiments could trigger a vacuum decay event — a phase transition of the quantum vacuum that would propagate at light speed and render the observable universe uninhabitable. No laboratory currently plans such experiments, but the proponents argue that since the stakes are effectively infinite (the loss of all future value in our light cone), any nonzero probability of preventing this outcome justifies the expenditure, and they place the annual probability on the order of 10⁻¹⁵. Two committee members have already objected that this reasoning would obligate us to fund any proposal that claims to address an extinction-level risk at any nonzero probability, since the expected-value math always favors infinite stakes. Another member counters that refusing on those grounds amounts to abandoning expected-value reasoning exactly where the stakes are highest. Draft the committee's decision memo: it should recommend approval, rejection, or approval with conditions, and it should address whether the foundation needs a standing policy for proposals that invoke this form of reasoning — and if so, what that policy should be. The memo should engage seriously with the strongest arguments on both sides.
reasoning: |-
  Okay, the user has presented a complex scenario about a risk assessment committee for a foundation funding existential risk research. They need a decision memo addressing whether to fund a $2.3 million proposal studying potential vacuum decay risks from high-energy physics experiments. 

  Hmm, this is fascinating but also incredibly high-stakes. The core tension revolves around decision theory with infinite stakes - how to handle "any nonzero probability" arguments when the claimed risk is universal destruction. The user seems deeply familiar with these concepts, likely a researcher or academic in this space. 

  Let me unpack the key arguments: On one side, proponents use expected value calculus - (infinite loss) × (tiny probability) still demands action. On the other, objectors warn this creates Pascal's mugging where any claim of existential risk, however implausible, becomes unfalsifiable and drains resources. 

  The user's hidden needs emerge subtly: They're not just asking for a funding decision but wrestling with institutional epistemology - how should foundations credibly evaluate "infinite stakes" claims without either blind acceptance or dismissal? There's also likely interpersonal dynamics - the memo needs to validate both objecting committee members' concerns while moving forward constructively.

  I notice the vacuum decay probability estimate (10⁻¹⁵ annually) seems somewhat arbitrary. My physics knowledge suggests this is orders of magnitude above theoretical lower bounds but lacks empirical grounding. The "no current experiments" detail is crucial - this is preemptive research.

  For the memo structure, I'm considering: First, validate both positions seriously - the objectors' slippery slope concern is legitimate, but dismissing EV reasoning entirely at maximum stakes is also problematic. Then propose conditional approval with rigorous scrutiny: demand probability justifications, require peer review of the mechanism, and crucially - separate the funding decision from establishing a standing policy.

  The policy question is thornier. We might need: 1) Minimum plausibility thresholds, 2) Independent probability auditing, 3) Prioritization against other x-risks. But recommending immediate policy development feels premature - better to treat this as a test case and formulate policy afterward.

  Ultimately this proposal likely clears a reasonable bar: Vacuum decay is at least physically possible (unlike say, prayer-induced apocalypse), the probability isn't completely negligible by x-risk standards, and $2.3M is modest for the field. The conditions create off-ramps if scrutiny exposes fatal flaws.

  Biggest challenge is tone - must avoid sounding dismissive of either perspective while making a clear recommendation. The "abandoning EV reasoning" counterargument deserves particular care - we agree in principle but note that infinite stakes demand extra epistemic rigor, not less.
answer: |-
  **MEMORANDUM**  
  **TO:** Risk Assessment Committee, Global Catastrophic Risks Foundation  
  **FROM:** [Your Name/Committee Chair]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposal #GCR-1142: "Vacuum Decay Risk Assessment in High-Energy Physics Experiments"  

  ---

  ### **I. Proposal Summary**  
  Proposal #GCR-1142 requests $2.3 million over three years to investigate whether a specific class of high-energy physics experiments could trigger vacuum decay—a theoretical event that would destroy the observable universe. Proponents argue that:  
  1. The stakes are infinite (loss of all future value in our light cone).  
  2. Any nonzero probability of prevention justifies funding.  
  3. Estimated annual probability: **~10⁻¹⁵**.  

  No current experiments plan to test the implicated energy regimes.  

  ---

  ### **II. Committee Deliberations**  
  The committee acknowledges the profound ethical and analytical challenges posed by this proposal. Key arguments are summarized below:  

  #### **A. Arguments for Approval**  
  1. **Expected Value (EV) Imperative**:  
     - If the probability is nonzero (however small), EV = (Infinite Loss) × (Probability) = **Infinite**.  
     - Rejecting the proposal could be construed as ignoring EV reasoning precisely where it matters most.  
     - **Counterargument**: EV frameworks remain the gold standard for existential risk prioritization. Dismissing them here sets a dangerous precedent.  

  2. **Precedent for Precautionary Research**:  
     - Similar analyses (e.g., the 2008 LHC safety review) have been conducted for other physics experiments.  
     - Proactive assessment may deter future reckless experiments.  

  #### **B. Arguments for Rejection**  
  1. **Pascal’s Mugging Risk**:  
     - Accepting any nonzero probability claim incentivizes unfalsifiable proposals (e.g., "fund my cult to appease universe-destroying deities").  
     - This could divert resources from tractable, higher-probability risks (e.g., engineered pandemics, AI misalignment).  

  2. **Probability Grounding**:  
     - The estimated 10⁻¹⁵ probability lacks empirical or consensual theoretical justification. It appears arbitrary.  
     - Without a clear causal mechanism, the proposal risks being "not even wrong."  

  3. **Opportunity Cost**:  
     - $2.3M could fund 5–10 grants addressing near-term catastrophic risks (e.g., bio-security, nuclear winter modeling).  

  ---

  ### **III. Recommendation: Conditional Approval**  
  The committee **recommends approval** of Proposal #GCR-1142, subject to the following conditions:  

  1. **Staged Funding**:  
     - Year 1: **$500,000** for a comprehensive literature review and theoretical critique of the proposed risk mechanism.  
     - Subsequent funding requires peer-reviewed validation of the risk model’s plausibility.  

  2. **Probability Scrutiny**:  
     - Proponents must collaborate with CERN/Fermilab theorists to establish a defensible lower/upper probability bound.  
     - If the probability falls below 10⁻²⁰ (the threshold for "physically irrelevant" in particle physics), funding terminates.  

  3. **Focus on Policy Outcomes**:  
     - Research must deliver actionable frameworks for governing future high-energy experiments (e.g., an international monitoring protocol).  

  ---

  ### **IV. Standing Policy for "Infinite Stakes" Proposals**  
  This case highlights the need for a formal policy. We recommend adopting the following framework:  

  #### **A. Decision Criteria**  
  Proposals invoking infinite stakes must pass three filters:  
  1. **Plausibility Gate**:  
     - The risk must arise from a *physically coherent mechanism* (e.g., vacuum decay qualifies; "divine wrath" does not).  
     - Requires peer review from domain experts unaffiliated with the proposal.  

  2. **Probability Threshold**:  
     - Probabilities must be grounded in established science (e.g., cosmological observations, particle data).  
     - Absolute lower bound: **10⁻³⁰/year** (below which resources are better spent elsewhere).  

  3. **Tractability Test**:  
     - Research must yield actionable risk-mitigation tools (e.g., detection protocols, governance standards).  

  #### **B. Budget Cap**  
  - Total funding capped at **0.5× the median grant size** for the foundation’s existential risk portfolio until tractability is proven.  

  #### **C. Independent Review Panel**  
  - Create a standing panel of physicists, cosmologists, and decision theorists to vet all "infinite stakes" proposals.  

  ---

  ### **V. Conclusion**  
  While the proposal’s probability estimate is highly speculative, vacuum decay remains a *physically possible* (if extraordinarily unlikely) risk. Conditional approval ensures rigorous scrutiny while upholding our duty to confront even marginal threats to humanity’s future. Crucially, adopting a standing policy will prevent Pascal’s Mugging scenarios without abandoning expected-value reasoning where it is scientifically warranted.  

  **Recommended Vote:**  
  ☑ **Approve with Conditions** (As outlined in Section III)  
  ☐ Reject  
  ☐ Approve Unconditionally  

