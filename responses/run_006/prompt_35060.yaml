  Second, the indexical uncertainty objection: even if we're simulated, our actions might affect a vast future. The reply argues for branching dilution but could be vulnerable if the audience thinks we should anthropically favor large branches.

  Third, the functional equivalence point: if simulations are accurate, they preserve future value. The reply highlights the lack of causal access but might struggle if the audience thinks simulated influence is sufficient.

  Fourth, the simulation hypothesis as a wash: all scenarios might have symmetric value implications. The reply rejects symmetry via selection effects but might not convince those who see no asymmetry.

  Fifth, the computational waste objection: base realities might create many low-value sims. The reply argues for base reality's higher leverage but could be weak if sims are abundant.

