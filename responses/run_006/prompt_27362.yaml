prompt: |-
  ok so we covered Pascal's mugging in my decision theory class and I've been going in circles trying to figure out where the argument actually breaks. Here's my reconstruction:

  (1) Rational choice means picking the action with highest expected utility.
  (2) Expected utility is just probability times value, summed across outcomes.
  (3) So if some guy walks up and says "give me $5 or I'll cause an astronomically huge amount of suffering" and you assign any nonzero probability to him being able to follow through, the expected disutility of not paying is (tiny probability) × (enormous badness), which still dwarfs losing $5.
  (4) Therefore you should pay him.
  (5) But obviously you shouldn't pay — that's insane.
  (6) So something's wrong in (1)–(3).

  The problem is every fix I try either torches decision theory or feels totally ad hoc. Reject (1) and you lose the whole framework. Reject (2) and I don't know what replaces it. Say "assign probability zero to crazy-sounding claims" and now you're ruling things out a priori, which seems like it'll cause trouble elsewhere. Say there's some cap on how much disvalue you can put into the calculation and I don't know how you justify where the cap goes without it being completely arbitrary.

  Where does this argument actually go wrong? And whatever move you pick, what else does it committ you to — like, can the same move handle a version where the stakes aren't quite as cartoonish but the structure is identical?

  (please answer in American English, my prof takes off points for UK spellings lol)
