answer: |-
  Here’s a structured breakdown of desiderata for an adequate theory of pleasure, designed to tackle the heterogeneity problem head-on. I’ve flagged tensions, non-negotiables, and the critical role of the unity requirement, while explicitly addressing the pluralist challenge.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  Any viable theory *must* satisfy these to avoid immediate collapse:

  1. **Unity/Commonality (D1)**  
     - **What it must do**: Explain what (if anything) unifies all pleasures *as pleasures*.  
     - **Motivation**: *The heterogeneity problem itself*. If scratching an itch and feeling pride share *no* common property (physical, attitudinal, or phenomenological), calling both "pleasure" is arbitrary.  
     - **Tension**: Pluralists reject this, arguing unity is illusory. *But*: If a theory denies D1, it must explain why we intuitively group these states together (e.g., via family resemblances or functional roles).  
     - **Cruciality**: **The linchpin desideratum**. Fail here, and hedonism’s core claim ("pleasure is the *one* intrinsic good") crumbles.

  2. **Exclusivity (D2)**  
     - **What it must do**: Distinguish pleasure from non-pleasures (e.g., mere absence of pain, contentment, desire satisfaction without affect).  
     - **Motivation**: *The "non-pleasure" counterexamples*. E.g., the relief of pain fading isn’t pleasurable; tranquil contentment vs. active joy.  
     - **Non-negotiable**: Without this, "pleasure" expands vacuously, diluting hedonism’s predictive power.

  3. **Intrinsic Goodness (D3)**  
     - **What it must do**: Explain *why* all pleasures are intrinsically good (or why they *count* as good for well-being).  
     - **Motivation**: *Hedonism’s foundational claim*. If some pleasures (e.g., schadenfreude) seem intrinsically bad, the theory must resolve this without abandoning unity.  
     - **Tension**: Attitudinal theories (Feldman) handle this by making goodness depend on attitude-object alignment, but risk losing phenomenological unity.

  ---

  ### **Contested Desiderata (Theory-Dependent Commitments)**  
  Reasonable theories may reject these, but face trade-offs:

  4. **Phenomenological Felt-Quality (D4)**  
     - **What it might do**: Posit a distinctive "hedonic tone" common to all pleasures.  
     - **Motivation**: *Introspective reports*. We *feel* pleasure in diverse experiences; a cold drink and pride *seem* to share a positive affective character.  
     - **Rejectable?** Attitudinal/functional theories deny this (e.g., Feldman: pleasure is *about* a state, not a feel). Pluralists may accept it only for subsets.  
     - **Tension with D1**: If phenomenology varies wildly (scratching vs. aesthetic awe), D4 may force pluralism.

  5. **Motivational Power (D5)**  
     - **What it might do**: Link pleasure to intrinsic desirability or motivation.  
     - **Motivation**: *Hedonism’s explanatory role*. Pleasures typically motivate pursuit (e.g., you seek the cold drink because it feels good).  
     - **Rejectable?** Some pleasures (e.g., quiet contemplation) aren’t strongly motivational; neuroscientific views (dopamine = "wanting") may decouple "liking" from "wanting".

  6. **Naturalistic Grounding (D6)**  
     - **What it might do**: Align with science (e.g., neurobiological correlates like opioid/dopamine systems).  
     - **Motivation**: *Empirical adequacy*. If neuroscience shows no single neural signature for "scratching" vs. "intellectual" pleasure, monist theories struggle.  
     - **Rejectable?** Non-naturalists (e.g., Crisp) may reject reductionism; pluralists embrace neural disunity.

  ---

  ### **Functional/Systemic Desiderata**  
  Theories can satisfy these in flexible ways:

  7. **Attitudinal Consistency (D7)**  
     - **What it might do**: Explain pleasure as a uniform *mode of engagement* (e.g., "taking delight in X").  
     - **Motivation**: *The "wrong kinds of pleasure" problem*. Sadistic pleasure feels good but is morally repugnant; attitudinal theories can condemn the *object* while preserving pleasure’s unity.  
     - **Tension with D4**: If pleasure is just an attitude, why does it *feel* a certain way? (Feldman bites the bullet: it doesn’t need to).

  8. **Scalability/Quantifiability (D8)**  
     - **What it might do**: Allow pleasures to be compared/ranked in intensity/duration.  
     - **Motivation**: *Hedonistic calculus*. Well-being requires weighing pleasures (e.g., 1 hour of massage vs. 10 minutes of intellectual triumph).  
     - **Rejectable?** Pluralists may deny cross-context comparability (e.g., can sensual pleasure be "greater than" moral satisfaction?).

  ---

  ### **Meta-Desiderata: Framing the Heterogeneity Problem**  
  9. **Dissolution vs. Solution (D9)**  
     - **The key question**: Must the theory find a *single common property* (solution), or can it *redefine the challenge* (dissolution)?  
     - **Pluralist dissolution**: "Pleasure" is a cluster concept (e.g., family resemblances) or disjunctive (sensual, intellectual, etc.). Satisfies D1 weakly by redefining unity.  
     - **Monist solution**: Insists on a univocal essence (e.g., all pleasures activate the same brain circuit or involve the same attitude).  
     - **Motivation**: *The heterogeneity intuition*. If dissolution is acceptable, D1 becomes optional. But hedonism may need D1 to stay monistic about value.

  ---

  ### **Critical Tensions Between Desiderata**  
  | **Tension**                          | **Why It’s Problematic**                                                                 |
  |--------------------------------------|------------------------------------------------------------------------------------------|
  | **D1 (Unity) vs. D4 (Phenomenology)** | If pleasures *feel* radically different (itch-scratching vs. spiritual joy), a felt-quality theory (Crisp) fails. Attitudinal theories avoid this but struggle with D4. |
  | **D1 (Unity) vs. D6 (Naturalism)**    | Neuroscience finds diverse mechanisms: mu-opioids for sensory pleasure, dopamine for reward anticipation. A single neural correlate is unlikely. |
  | **D3 (Goodness) vs. D7 (Attitudinal)** | If pleasure is just "taking attitude X," why is it *intrinsically* good? Requires linking attitude to value (e.g., Feldman: goodness is in the attitude itself). |
  | **D4 (Phenomenology) vs. D5 (Motivation)** | Some pleasures (e.g., serene contemplation) lack strong motivational pull. If pleasure *must* motivate, these are excluded. |

  ---

  ### **Which Desideratum Does the Heavy Lifting?**  
  **D1 (Unity)** is the decisive battleground.  
  - **Monists** (Feldman, Crisp) *must* deliver a robust account of unity.  
  - **Pluralists** reject D1 as a false requirement and reframe heterogeneity as a natural fact.  
  - **Your call**: Is hedonism salvageable only if D1 is satisfied? If yes, scrutinize unity claims. If no, pluralism or hybrid theories (e.g., "pleasure" as a disjunction of intrinsic goods) become viable.

  ---

  ### **Strategic Advice**  
  1. **Interrogate D1 first**: Is the demand for unity legitimate? Or is it a relic of essentialism?  
  2. **Map tensions to your cases**: Does intellectual pleasure share *anything* with sensual pleasure besides being "good"? If not, monism may fail.  
  3. **Consider value-first approaches**: Maybe "pleasure" is *defined* as whatever is intrinsically good. This dissolves heterogeneity but risks circularity.  

  The heterogeneity problem isn’t just about finding a common property—it’s about whether hedonism *needs* one to survive. Your next move: Decide if unity is non-negotiable or if pluralism can save hedonism by redefining its core.
