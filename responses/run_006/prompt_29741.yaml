prompt: |-
  im a bioethics phd student trying to get the lay of the land on consent before I commit to a view, and I keep finding that everyone argues from their own pet hard case without saying what the full job description of a theory of consent is. so before i read anything else, write me the desiderata for a theory of valid consent to count as adequate, aimed at medicine and research rather than just sex or contracts. what does such a theory have to get right? give me the requirements list — the cases it has to handle, the distinctions it can't collapse, the legal or psychological results it can't contradict — with the case or consideration behind each. for each requirement, say whether it's non-negotiable or just a preference of one camp (mental-state view vs performative view vs hybrid; full disclosure vs materiality). then tell me which single requirement does the most to exclude the popular theories, and whether any pair of requirements looks jointly unsatisfiable.

  dont stop at the obvious ones about competence and voluntariness. i want the in-the-weeds stuff too: deception about collateral facts (the surgeon's experience, a partner's identity, who funds the study) versus deception about the act itself; assent vs consent; consent that is valid but wrong to give; whether withdrawal can be made costly without being blocked; whether broad consent for biobanking can ever count as informed; the line between coercion and merely bad options (the worker who 'chooses' a trial because the alternative is losing a job); capacity as threshold vs scalar and as global vs decision-relative; and whether proceeding without valid consent is fundamentally a wronging or a harming. for each of these, tell me whether it's a genuine requirement on a theory of consent or just one camp's aesthetic. keep any scorecard of existing views to a few lines by view-type, no citations.
reasoning: |-
  Okay, the user is a bioethics PhD student diving deep into consent theories, specifically in medicine and research. They're frustrated that existing discussions focus too much on individual hard cases without outlining what a comprehensive theory should achieve. They want a list of desiderata—essential requirements for any adequate theory of valid consent—along with distinctions it must handle and potential contradictions to avoid.  

  First, I need to map the core challenges in consent theory. The user mentioned key divides: mental-state vs. performative views, full disclosure vs. materiality standards, and hybrid approaches. They also listed nuanced topics like deception types, assent vs. consent, and whether invalid consent is primarily about wronging or harming. The goal is to systematize these into non-negotiable requirements vs. contested preferences.  

  Starting with non-negotiables: Competence and voluntariness are baseline, but the user wants deeper layers. For instance, competence must address threshold vs. scalar debates and decision-relative capacity—e.g., a patient might understand antibiotics but not chemotherapy risks. Voluntariness needs to distinguish coercion (threats) from exploitation (bad options), like the worker choosing a trial to avoid job loss. These are universal requirements; no theory can ignore them without collapsing key ethical distinctions.  

  Next, information disclosure. The materiality standard (what a reasonable person would want) is widely accepted, but "full disclosure" is unrealistic and often a camp preference. The theory must handle deception types: deception about the act itself (e.g., fake surgery) invalidates consent, while collateral deception (surgeon's experience) might not—unless material. This distinction is crucial for medical fraud cases.  

  Withdrawal rights feel non-negotiable. The user brought up whether making withdrawal costly (e.g., losing payment) blocks consent. A good theory must permit practical costs but forbid punitive barriers, aligning with regulatory norms like the Common Rule. Here, the performative view (consent as revocable act) dominates, though mental-state purists might grumble.  

  Now, contested zones. Broad consent for biobanking is a headache. If "informed" requires knowing future uses, it’s impossible—so theories must allow pragmatic standards without gutting informedness. Hybrid views often win here, but purists disagree. Similarly, valid-but-wrong consent (e.g., selling a kidney) tests if consent theory is purely procedural or has moral limits. Most treat validity as separate from permissibility, though virtue ethicists push back.  

  The trickiest requirement? Probably the coercion/exploitation divide. It’s non-negotiable for voluntariness but often muddled. Theories that conflate them (e.g., some mental-state views calling all pressure coercive) fail—they can’t explain why workers in trials aren’t "forced." Meanwhile, hardline performative views might excuse exploitation if formal consent exists. This requirement alone excludes many oversimplified theories.  

  As for joint unsatisfiability: Balancing autonomy protection with practicability is brutal. For example, strict disclosure standards clash with broad consent needs. If you demand granular future-use knowledge for biobanks, broad consent fails; if you relax it, you risk undermining informedness. Similarly, treating invalid consent as "wronging" (autonomy violation) vs. "harming" (welfare loss) pits Kantians against consequentialists—with no clean resolution.  

  The user’s unspoken need? Cutting through academic noise to find leverage points for original work. By highlighting the coercion/exploitation rift and the wronging/harming tension, I’m flagging where their PhD could intervene. They’ll also appreciate knowing which battles are worth fighting (e.g., defending hybrid views in biobanking) and which are dead ends (like insisting on full disclosure).  

  Finally, the scorecard: Mental-state views struggle with performative elements (withdrawal, broad consent), performative views downplay inner states, and hybrids face consistency heat. The user can now test theories against the desiderata checklist—spotting gaps without wading through every paper.
answer: |-
  Here's a comprehensive desiderata list for a theory of valid consent in medicine/research, distinguishing non-negotiables from contested preferences, and highlighting key tensions:

  **Core Non-Negotiables (Any Adequate Theory Must Handle These):**

  1.  **Competence Threshold:** Must distinguish decisional capacity from incapacity (e.g., severe dementia, acute psychosis). Cannot collapse understanding/appreciation into mere age or diagnosis. *Why:* Foundational for respecting autonomy. Legal/ethical consensus requires a minimum threshold, even if scalar capacity exists (non-negotiable).
  2.  **Voluntariness vs. Coercion:** Must distinguish threats imposing *undue* constraints (e.g., "Enroll or lose life-sustaining treatment") from merely *hard choices* (e.g., "Enroll or lose job benefits"). *Why:* Coercion invalidates consent; bad options alone don't necessarily. Legal doctrines (e.g., duress) and core bioethics principles demand this distinction (non-negotiable).
  3.  **Core Disclosure Standard:** Must require disclosure of *material* information - what a reasonable person would find significant to the decision (e.g., procedure risks/benefits/alternatives, research purpose/risks/randomization). *Why:* Basis of "informed" consent in law (Canterbury v. Spence) and ethics. "Full disclosure" is a camp preference; materiality is the functional standard (non-negotiable).
  4.  **Deception about the Act Itself:** Must recognize that deception about the *fundamental nature* of the act (e.g., fake surgery, undisclosed sexual contact disguised as medical exam) invalidates consent. *Why:* Renders the act categorically different from what was agreed to. Analogous to fraud in the factum (non-negotiable).
  5.  **Right to Withdraw:** Must affirm the *right* to withdraw consent without *punitive* penalty. *Why:* Cornerstone of research ethics (Nuremberg, Belmont, Common Rule) and ongoing patient autonomy. Making withdrawal *costly* (e.g., lost time, inconvenience) may be permissible; *blocking* it (e.g., contractual penalties, refusal of standard care) is not (non-negotiable). *Blocking* is non-negotiable; costly withdrawal is contested.
  6.  **Assent vs. Valid Consent:** Must distinguish meaningful agreement from mere compliance/non-resistance, especially in populations with partial capacity (e.g., children, some cognitive impairments). *Why:* Respect requires seeking assent even where legal consent authority lies elsewhere. Failure collapses ethical nuance in pediatric/research contexts (non-negotiable).

  **Essential Distinctions & Cases (Must Be Able to Handle, Even if Resolution is Contested):**

  7.  **Deception about Collateral Facts:** Must grapple with when deception about *non-core* elements invalidates consent (e.g., surgeon's experience level, undisclosed research funding source, partner's identity in embryo creation). *Why:* Turns on materiality and whether the deception fundamentally alters the nature/risks of the act. *Requirement:* Theory must provide a principled way to analyze this (e.g., materiality test). Resolution is contested (materiality vs. stricter views).
  8.  **Coercion vs. Undue Inducement/Exploitation:** Must address whether "too much" payment in research is coercive *or* exploitative, distinct from merely attractive. Must distinguish *offers* creating hard choices from *threats*. *Why:* Critical for ethical recruitment, especially with vulnerable populations. *Requirement:* Theory must explain why the worker choosing a trial to avoid job loss *might* be exploited but *not* coerced. Distinction is non-negotiable; resolution is contested.
  9.  **Capacity - Scalar & Decision-Relative:** Must acknowledge capacity exists on a spectrum and varies with decision complexity (global vs. decision-relative capacity). *Why:* A patient may consent to antibiotics but not understand complex gene therapy. *Requirement:* Theory must be compatible with nuanced assessment, not just binary capable/incapable. Non-negotiable aspect of competence; *how* to operationalize thresholds is contested.
  10. **Valid Consent vs. Permissibility:** Must allow for the conceptual possibility of consent being *valid* (procedurally sound) but the act *still impermissible* (e.g., selling a vital organ, high-risk non-therapeutic research with trivial benefit). *Why:* Separates autonomy-respecting procedure from substantive moral judgment of the act. *Requirement:* Theory cannot *automatically* make valid consent sufficient for permissibility. Non-negotiable for most views; some virtue ethicists contest the separation.

  **Major Challenges & Contested Zones (Theory Must Take a Stance):**

  11. **Broad Consent for Biobanking:** Must address whether consent for future unspecified research using biospecimens/data can be "informed." *Why:* Essential for biobank viability. *Requirement:* Theory must explain how initial authorization relates to future uses. *Contested:* Mental-state views struggle; performative/hybrid views (relying on governance/withdrawal) are favored. Genuine requirement given practice.
  12. **The "Wronging" vs. "Harming" Primacy:** Must explain the *primary* wrong of proceeding without valid consent. Is it the *autonomy violation* (wronging) or the *risk/occurrence of harm*? *Why:* Impacts remedies, defenses, and scope of duties. *Contested:* Autonomy views emphasize wronging; consequentialist/relational views may blend factors. Core requirement for moral justification.
  13. **Materiality & Professional Judgment:** Must define the scope of "material" information. Does it include information *only* relevant to this specific patient's idiosyncratic values? *Why:* Impacts disclosure burdens. *Contested:* Objective "reasonable person" standard is dominant legally; some advocate subjective or "professional custom" views (losing ground). Requirement to define scope.

  **Which Requirement Excludes the Most Theories?**
  **The Coercion vs. Mere Hard Choices/Exploitation Distinction (Requirement #2 & #8).** Many popular simplified theories (especially some mental-state or strict performative views) struggle to consistently distinguish threats creating coercion from offers creating merely hard choices or exploitation. Conflating all pressure as "coercion" over-expands the concept; ignoring exploitation under-protects.

  **Jointly Unsatisfiable Requirements?**
  The tension between **Broad Consent Being Pragmatically Necessary (#11)** and **Informed Consent Requiring Understanding Material Information (#3)** appears difficult, potentially jointly unsatisfiable under *strict* interpretations. How can consent be *informed* about future, unknown research uses? Any resolution requires relaxing one ideal (e.g., accepting less specific understanding, relying heavily on governance/withdrawal as part of the consent *process*) – a key battleground.

  **Scorecard by View-Type:**

  *   **Mental-State (Focus: Understanding/Intention):** Excels at capturing core autonomy/internal state. Struggles with: Proof, broad consent, performative aspects (withdrawal), collateral deception materiality. Often stricter on disclosure.
  *   **Performative (Focus: Authoritative Act/Speech):** Excels at clear boundaries, withdrawal, broad consent. Struggles with: Assessing internal understanding/voluntariness, subtle coercion/exploitation, deception about collateral facts if materially misleading. Often pragmatic on disclosure.
  *   **Hybrid (Focus: Reasonable Interpretation of Act + Understanding):** Seeks best of both. Must carefully define "reasonable" to avoid collapsing into one pole. Balances materiality and process. Preferred by many for broad consent. Critiqued for potential lack of clear principles.
  *   **Full Disclosure Advocates:** Camp preference. Impractical, conflates material/immaterial info. Largely rejected in law/contemporary ethics.
  *   **Materiality Standard:** Dominant legal/ethical consensus. Non-negotiable functional requirement.

  This framework forces theories to address the messy realities of clinical/research practice while upholding core autonomy principles. The coercion/exploitation divide and the biobanking challenge are particularly revealing stress tests.
