  I'm a behavioral economist — I live in the world of discount functions, present bias, beta-delta models, commitment devices, time inconsistency. I keep hearing philosophers talk about "akrasia" or weakness of will like it's some deep mystery, but from where I sit it just looks like hyperbolic discounting plus maybe some story about multiple selves or hot/cold systems.

  Restate the core philosophical problem of akrasia — the Socrates/Aristotle/Davidson thread — in my vocabulary as faithfully as you can. Then give me the residue report: what translates cleanly, what you had to distort, and what has no expression at all in my framework. I especially want to know whether the philosophers are wrestling with something my models genuinely miss, or whether they're just using fancier words for preference reversal.
