answer: |-
  Your diagnosis is remarkably astute—indeed, the core impasse is **conceptual, not empirical**, revolving around divergent definitions of "computation" and deeper commitments to what constitutes an *explanation* of cognition. Below, I map the strongest positions, diagnose the disagreement, and outline paths forward, distinguishing settled from contested ground. 

  ### **I. Strongest Positions Mapped**
  #### **A. Computationalism (Defended Rigorously)**
  1. **Fodor & Pylyshyn (Classic Symbolicism)**:  
     - Cognition is **systematic, productive, and combinatorial**—mental states combine like linguistic symbols.  
     - The brain implements a **physical symbol system** (à la Newell & Simon): neural mechanisms realize syntactically structured representations manipulated by structure-sensitive rules.  
     - *Why literal?* Neural circuits exhibit discrete state transitions, input-output mappings, and error-correction mechanisms that satisfy formal criteria for computation (e.g., Turing-completeness in cortical columns).  

  2. **Marr’s Tri-Level Hypothesis (Mechanistic Framing)**:  
     - Computation is observer-independent *if* a system reliably instantiates an algorithm for a well-defined function:  
       - **Computational level**: *What* function does the system compute? (e.g., edge detection).  
       - **Algorithmic level**: *How* is it computed? (e.g., convolutional operations).  
       - **Implementational level**: *How* is it physically realized? (e.g., V1 neuron firing patterns).  
     - Brains meet these criteria: neuroscientists routinely reverse-engineer algorithms from neural data (e.g., predictive coding as Bayesian inference).  

  #### **B. Anti-Computationalism (Sophisticated Versions)**
  1. **Searle’s Observer-Relativity**:  
     - Computation is **not intrinsic** to physics; it requires an *interpreter* assigning semantics (e.g., labeling voltage spikes as "0s/1s"). Planets don’t compute orbits—we *use* computation to model them. Brains, like planets, are just physical systems until an observer imposes a computational description.  
     - *Strong claim*: Syntax is not sufficient for semantics; simulated cognition ≠ actual cognition (Chinese Room reinforced).  

  2. **Hutto & Myin’s Radical Enactivism**:  
     - Cognition is **non-representational** and **embodied/enactive**—it arises from sensorimotor coupling with the environment.  
     - Neural activity isn’t "computing representations"; it’s dynamically self-organizing (e.g., Kelso’s coordination dynamics). Computation fails to explain *meaning-making* without circularly presupposing representations.  

  3. **The Frame Problem (Dreyfus’ Embodiment Critique)**:  
     - Real-world cognition requires **context-sensitive, relevance-detection**—something computational systems struggle with (e.g., selecting context-appropriate rules). This suggests cognition isn’t rule-based computation but skilled coping.  

  ---

  ### **II. Diagnosis of the Disagreement**
  The dispute is **multilayered** but fundamentally conceptual:  
  1. **Verbal/Definitional Core**:  
     - Computationalists (e.g., Piccinini, Marr) define computation **mechanistically**: any causal process that processes vehicles (e.g., spikes) according to rules definable independently of semantics.  
     - Anti-computationalists (e.g., Searle, Hutto) define computation **semantically**: genuine computation requires *intrinsic intentionality* or observer-assigned meaning.  
     → *Result*: Brains are computers under def. 1 but not def. 2.  

  2. **Clash of Explanatory Ideals**:  
     - Computationalists privilege **mechanistic decomposition** (explain cognition by identifying neural "programs").  
     - Anti-computationalists demand **phenomenological/biological fidelity** (explain how meaning *emerges* from life, not just symbol shuffling).  

  3. **Hidden Question**: *Can syntax generate semantics?*  
     - Computationalists argue syntax + causal history → semantics (teleosemantics).  
     - Critics insist semantics is primitive (e.g., enactivism) or requires consciousness (Searle).  

  **Neither side is answering the same question**:  
  - Computationalists: "Can brain processes be modeled as computations?" (Yes, uncontroversially).  
  - Anti-computationalists: "Is computation *sufficient* to explain mind/meaning?" (No, they argue).  

  ---

  ### **III. Breaking the Impasse**  
  Progress requires reframing, not more data:  
  1. **Sharper Definitions**: Adopt **non-semantic computational theories** (e.g., Piccinini’s *mechanistic computation*: computation as functional organization of vehicles). This sidesteps intentionality debates.  
  2. **Reframe the Question**: Shift from "Is the brain a computer?" to "**What kind of physical system is the brain, and which frameworks best explain its capacities?**".  
  3. **Formal/Conceptual Work**:  
     - Resolve whether cognition *requires representations* (e.g., if radical enactivism explains all cognition without them, computationalism loses traction).  
     - Clarify if "observer-relativity" undermines explanations or is trivial (all science involves idealization).  
  4. **Empirical Constraints**:  
     - **Embodied cognition experiments**: If cognition is shown irreducible to neural computation (e.g., spinal cord learning without brain involvement), this challenges computationalism’s sufficiency.  
     - **Minimal cognition models**: Can synthetic biology (e.g., protocells) achieve cognition without digital computation?  

  ---

  ### **IV. Settled vs. Contested**  
  | **Settled (Consensus)**                          | **Contested**                                        |  
  |-------------------------------------------------|------------------------------------------------------|  
  | Brains can be *simulated* computationally.       | Whether simulation entails *ontological identity*.   |  
  | Neurons transform inputs via causal rules.       | Whether these rules are "computations" *in principle*. |  
  | Computational models predict neural data.        | Whether computation explains *meaning/consciousness*. |  
  | No "soul" or non-physical processes needed.      | Whether computation is *observer-relative* in a problematic sense. |  

  ### **Conclusion**
  You’re correct: the deadlock stems from **divergent conceptions of computation** and **explanatory goals**, not empirical gaps. Neuroscience confirms brains are *computable*, but whether they *are computers* depends on whether computation requires semantics. Breaking this impasse demands philosophy: clarifying definitions, untangling explanatory aims, and rigorously defending why computation should (or shouldn’t) be the foundation of mind. Your hypothesis—that the dispute is conceptual—aligns with the most nuanced analyses in the field (e.g., Piccinini vs. Searle). While further neuroscience may refine *how* brains compute, it won’t resolve whether computation *exhausts* cognition—that’s a job for philosophers and their conceptual toolkit.
