  Okay, the user is working on a seminar paper about Moore's Paradox and needs help defining the desiderata for an adequate account of Moorean absurdity. They've specified several key elements to cover: commissive and omissive forms, first-person present-tense restriction, asymmetry with the converse, and whether the absurdity attaches to belief or assertion or both. 

  Hmm, this is quite a sophisticated request—the user clearly knows their way around philosophy of language and epistemology. Probably a grad student or advanced undergrad. They're being very methodical by asking for specifications before committing to a theory, which shows they understand how messy Moorean scholarship can get. Smart approach.

  Let me mentally walk through each required element. For commissive ("p but I don't believe p"), the core puzzle is why asserting this feels absurd when it could technically be true. The omissive form ("p but I believe not-p") is even weirder because it's logically possible but pragmatically disastrous. Gotta flag that both are non-negotiables—any theory that can't handle both fails immediately. 

  The first-person present-tense restriction is crucial too. "It's raining but Sarah doesn't believe it" isn't paradoxical—only first-person *current* belief creates the issue. That immediately rules out simplistic truth-functional accounts. And the asymmetry point ("I believe p but not-p" being less absurd) often trips people up; need to emphasize it's still irrational but differently so.

  For the belief/assertion attachment question... *sigh* this is where theories really fracture. Some camps dig their heels in about belief being primary (like Shoemaker), others insist assertion is key (Williamson's knowledge norm). Should present this as a fault line rather than settled. 

  Now for the killer paragraph about which desideratum excludes major theories. The first-person restriction is the real troublemaker. Hintikka's doxastic logic implodes on it because he treats belief as fully transparent. Griceans struggle because canceling the implicature doesn't fix the absurdity. And Williamson? His knowledge norm can't explain why "p but I don't know p" isn't equally bad—it's different from Moore's cases. 

  User will probably appreciate seeing how this one criterion wrecks all the popular approaches. Should light a fire under their seminar paper. Might also subtly warn them that no existing theory nails all desiderata perfectly—this is still an open debate. 

  ...Better make sure the explanation stays concrete. No jargon without examples. And flag negotiable points clearly—they'll need that for lit review.
answer: |-
  Here are the desiderata for an adequate account of Moorean absurdity, structured as requested. Each includes the case/consideration motivating it and its status within the field:

  1.  **Commissive Form Absurdity:** The account must explain the profound absurdity of asserting or believing *commissive* Moorean sentences ("p, but I don't believe that p").
      *   **Case:** "It's raining, but I don't believe it's raining." Uttering or judging this true feels deeply paradoxical/irrational, even though it could be *true* (e.g., it *is* raining, but I'm unaware or in denial). The absurdity isn't merely falsity.
      *   **Status:** **Non-negotiable.** Any account failing to explain this core phenomenon is inadequate.

  2.  **Omissive Form Absurdity:** The account must explain the profound absurdity of asserting or believing *omissive* Moorean sentences ("p, but I believe that not-p").
      *   **Case:** "It's raining, but I believe it's not raining." This feels even *more* strongly absurd and self-defeating than the commissive form. Again, it *could* be true (it *is* raining, but I hold a false belief to the contrary), yet asserting/believing it is deeply problematic.
      *   **Status:** **Non-negotiable.** A core datum requiring explanation.

  3.  **First-Person Present-Tense Restriction:** The account must explain why the absurdity specifically concerns the *first-person present-tense* attitude ascription ("I believe" / "I don't believe").
      *   **Case:** Compare "p, but I don't believe p" (absurd) with "p, but Sarah doesn't believe p" (possibly true, informative, non-absurd) or "p, but I didn't believe p yesterday" (potentially true, non-absurd confession). The absurdity vanishes without the 1st-person present belief report.
      *   **Status:** **Non-negotiable.** This restriction is fundamental to identifying the *Moorean* absurdity specifically.

  4.  **Asymmetry with the Converse:** The account must explain the relative lack of (or different nature of) absurdity in the *converse* Moorean sentences ("I believe that p, but not-p") compared to the standard forms.
      *   **Case:** "I believe it's raining, but it's not raining." While this expresses a *false belief* and could be seen as epistemically irrational or unfortunate, it lacks the profound *self-defeating* or *performative contradiction* feel of the standard Moorean sentences. One can more easily imagine sincerely asserting this (e.g., upon discovering one's error).
      *   **Status:** **Non-negotiable.** A key test showing the absurdity isn't simply about combining a truth claim with a belief claim.

  5.  **Locus of Absurdity (Belief vs. Assertion):** The account must specify whether the *primary* locus of absurdity is in *believing* the Moorean conjunction, in *asserting* it, or in both, and explain the relationship between belief and assertion absurdity.
      *   **Case/Consideration:** Can the absurdity arise purely internally (judging "p & ~Bp" true feels incoherent)? Or is it essentially a pragmatic feature of communication (asserting it violates norms)? Or are both intrinsically absurd, perhaps for related reasons? Accounts differ on priority (e.g., Shoemaker emphasizes belief; Williamson emphasizes assertion).
      *   **Status:** **Negotiable/Contentious.** While all agree both belief and assertion are absurd, the *explanatory priority* (which absurdity is more fundamental) and the *nature* of the belief absurdity are major points of debate between camps (e.g., constitutive belief norms vs. pragmatic norms of assertion).

  **The Key Excluding Desideratum:**

  The **First-Person Present-Tense Restriction** (Desideratum 3) poses the most significant challenge to the leading accounts and does the most to exclude them as fully adequate:

  *   **Hintikka-Style Doxastic Logic:** Hintikka's approach, using epistemic/doxastic modal logic, typically treats "Bp" (I believe p) as implying "p" is compatible with everything I know/believe. Crucially, it often incorporates a **Strong Positive Introspection** axiom: `Bp → BBp` (If I believe p, I believe that I believe p) or even **Veridicality**: `Bp → p` (Belief entails truth). These principles *directly* render "p & ~Bp" logically false or contradictory within the system, violating the restriction. The problem is that real agents are *not* logically omniscient or perfectly introspective; the absurdity arises *despite* the logical possibility of the conjunction being true for non-ideal agents. Hintikka's approach makes the absurdity purely logical/conceptual, failing to capture why it persists for fallible beings and why it disappears in the 3rd-person case. The restriction highlights that the absurdity isn't about logical impossibility per se.
  *   **Gricean Implicature:** Gricean accounts argue asserting "p" conversationally implicates "I believe p," making "p & ~Bp" pragmatically self-defeating (asserting p generates the implicature, while the conjunct explicitly denies it). However, the implicature should be *cancelable*. Yet, adding "...but I'm not saying I believe it!" or "...though I have no opinion!" to "p" doesn't replicate the deep Moorean absurdity; it might just make the assertion hesitant or odd. More damningly, the Gricean story struggles with the **first-person restriction**. Why doesn't asserting "p" similarly implicate "Sarah believes p" (it doesn't), making "p & Sarah doesn't believe p" absurd? The implicature account doesn't naturally explain why the absurdity is uniquely tied to the speaker's *own* current belief state. The restriction shows the absurdity is intrinsically tied to self-ascription, not general conversational norms about belief attribution.
  *   **Knowledge Norm of Assertion (KNA - Williamson):** Williamson argues you should only assert what you know. Asserting "p" therefore represents you as knowing p. "p & ~Bp" is absurd because asserting it represents you as knowing p, while ~Bp entails you *don't* know p (since knowledge entails belief). However, the **first-person restriction** again causes trouble. Why isn't "p & Sarah doesn't know p" (asserted by me) equally absurd? The KNA doesn't require the asserter to represent *others* as knowing p. Furthermore, while KNA explains why asserting *p* represents the asserter as knowing (hence believing) p, it struggles to explain the *doxastic* absurdity (judging "p & ~Bp" true feels incoherent internally, even without any act of assertion). The restriction highlights that the absurdity is specifically about the asserter/believer's *own* state, not just about representing oneself as knowing *p* in general. (KNA also struggles less directly but significantly with the asymmetry, as "I believe p & ~p" doesn't obviously violate the knowledge norm - asserting it represents you as knowing you believe p, but not necessarily as knowing p itself).

  Thus, the First-Person Present-Tense Restriction forces accounts to grapple with the uniquely *self-referential* and *immediate* nature of the absurdity. Theories that explain the absurdity through general logical principles (Hintikka), general conversational norms (Grice), or general norms of representing one's epistemic state (KNA) fail to capture why the absurdity vanishes when the belief ascription is about another person, in the past, or in the future. This restriction demands an explanation grounded in the nature of first-person present-tense *belief ascription* or *self-awareness* itself.
