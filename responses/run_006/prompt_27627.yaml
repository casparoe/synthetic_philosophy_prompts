prompt: |-
  I've been going in circles on imprecise probabilities lately—I'm a retired chemist, so the formalism is friendly but the philosophical stakes are new to me—and the sharp Bayesians and the imprecise probabilists I read seem to talk past each other more than they argue. Could you draft the joint statement the two sides could both sign after a good-faith adversarial collaboration? Not a verdict on who's right, and not a dramatized dialogue; the actual document they'd put their names to.

  I'd want it to include: the claims both camps accept, about probability as the representation of partial belief, about coherence or avoiding sure loss, about how to read the Ellsberg choices descriptively, and anything else they genuinely share; then the disagreement stated precisely, with each side's own wording for its position, so a sharp Bayesian would say yes, that is what I hold, and an imprecise probabilist would say the same about theirs; then the cruxes, the sub-questions such that settling them would move at least one side. For each crux, give the concrete case or argument both agree bears on it, and each side's prediction recorded in advance. The battlegrounds I especially want covered: whether rational preferences have to be complete, the dilation phenomenon where conditioning on information widens an interval instead of narrowing it, and the sequential-choice worry that an imprecise agent might turn down or pay to avoid information a sharp agent would take for free. Also say whether any part of the dispute is just verbal and why.

  Please write it as continuous prose, the way you'd write an email or a letter: no headings, no bullet points, no bold, no tables. If a list is unavoidable, do it in sentences. And dont dumb down the technical bits; the math is the part I can check.
