prompt: |-
  I'm in a seminar on conditionals and probability, and before I read any more theories I want to nail down what a theory of indicitive conditionals is even supposed to do, because right now the field looks like a pile of facts pulling in different directions. People will happily say that "if the die comes up even, it comes up six" deserves probability 1/3, not the 2/3 the material conditional would give it; but the same people use conditionals in modus ponens without blinking, and they embed them (however awkwardly) in negations, disjunctions, and antecedents. Meanwhile Lewis's triviality results seem to say you can't have everything at once: if indicative conditionals are ordinary propositions, and their probabilities live in a classical probability calculus, and their probability always equals the corresponding conditional probability, the whole setup collapses into triviality. I'd rather get the requirements list straight before I go theory-shopping.

  So: write the desiderata an adequate theory of indicative conditionals has to meet, where "adequate" means good enough to serve as a semantics of natural-language indicatives and to say how rational credences should interact with them. For each requirement, give the case or result that motivates it. Mark which requirements are non-negotiable and which are just camp preferences. Then flag any subset of the list that can't be jointly satisfied — I especially want to see what each way out (denying that conditionals express propositions, restricting the Adams thesis, messing with the probability calculus) costs you against the rest of the desiderata. Close with a one-sentence scorecard for the material conditional, a strict conditional, a Stalnaker-style selection-function view, and a no-truth-value suppositional view.

  Hard cap: 800 words. And no citations or reading list — I dont want the bibliography, I want the spec.
reasoning: |-
  Okay, the user is in a seminar on conditionals and probability, feeling overwhelmed by conflicting theories. They want a clear list of what an adequate theory of indicative conditionals must achieve before diving deeper. Their main pain point is the apparent impossibility of satisfying all desired features at once, given Lewis's triviality results. 

  First, I need to identify core desiderata from the literature and everyday usage. The user mentioned key pressure points: probability assignments like the die example ("if even, then six" having prob 1/3), modus ponens validity, embedding behavior, and the triviality results. These will anchor the non-negotiables. 

  The die case clearly demands the Adams Thesis (P(if A then B) = P(B|A)) as non-negotiable. But Lewis showed this conflicts with treating conditionals as propositions with classical probabilities. So we immediately hit a trilemma: sacrifice propositionality, restrict Adams Thesis, or modify probability calculus. Each has costs. 

  Modus ponens must work for natural language, but McGee's counterexample shows it fails under high-uncertainty when conditionals are embedded. So we need modus ponens preservation, though implementations may vary. Embedding is tricky - negation ("it's not that if A then B") and antecendent-embedding ("if [if A then B] then C") feel possible albeit awkward. This pressures against radical non-propositional views. 

  The triviality results are the elephant in the room. I should map escape routes: denying propositionality (loses embedding), restricting Adams (loses intuitive prob assignments), or non-classical probs (technical mess). User wants costs flagged explicitly. 

  For the scorecard: Material conditional fails Adams (die case gives 2/3≠1/3). Strict conditional fails Adams and makes conditionals too strong. Stalnaker satisfies embedding but crashes on triviality. Suppositional view nails Adams but chokes on embedding. 

  User's tone suggests frustration with disjointed facts - so the response must structure chaos into clear tradeoffs. No citations, just logic. Hard cap 800 words means ruthless prioritization: focus on clashes (Adams vs. propositionality) and what each sacrifice implies. They'll theory-shop later; now they need a compatibility matrix.
answer: |-
  Here's the desiderata list for an adequate theory of indicative conditionals, structured for your "theory-shopping":

  **Core Non-Negotiables (Failure is Fatal):**
  1.  **Adams Thesis (Probability Assignment):** `P(If A, then B)` should generally equal the corresponding conditional probability `P(B | A)` for a rational agent. *Motivation:* The die case: "If even, then six" intuitively deserves probability ~1/3, not `P(even ⊃ six) = P(not-even or six) ≈ 2/3`. This captures how we *use* conditionals under uncertainty. *Cost of Denial:* Fails core probabilistic intuition.
  2.  **Modus Ponens Validity (Basic Inference):** Arguments of the form `A; If A, then B; Therefore B` must be logically valid (truth-preserving) and accepted as such by rational agents. *Motivation:* Fundamental to reasoning with conditionals in natural language and logic. *Cost of Denial:* Renders conditional reasoning incoherent.
  3.  **Embedding in Negation & Disjunction:** The theory must account for the meaningfulness and truth-conditions/probabilities of sentences like "It is not the case that if A, then B" and "Either if A, then B, or C". *Motivation:* Natural language speakers *do* negate and disjoin conditionals ("It's not true that if it rains, the match is canceled"; "Either if the coin lands heads, I win, or the coin is biased"). *Cost of Denial:* Fails descriptive adequacy for natural language.
  4.  **Non-Triviality:** The theory must avoid Lewis-style triviality (where `P(B | A) = P(B)` for all A, B). *Motivation:* Lewis's result shows classical probability + Adams Thesis + Conditionals as propositions ⇒ triviality. *Cost of Denial:* The theory is inconsistent/useless.

  **Highly Desirable (Camp Preferences - Weakening Has Costs):**
  5.  **Embedding in Conditionals (Antecedents):** The theory should account for conditionals embedded in the antecedents of other conditionals: "If (if A, then B), then C". *Motivation:* Such constructions, while often awkward, are possible ("If it's true that if it rains, the match is canceled, then we should go home now"). *Cost of Weakening/Poor Account:* Limits expressive power; may require special stipulations.
  6.  **Preservation of Natural Intuitions:** Truth-values/probabilities assigned should align with strong pre-theoretical judgments where they exist (e.g., "If it rains tomorrow, the match will be canceled" is false if it rains and the match isn't canceled). *Motivation:* Maintains connection to meaning and use. *Cost of Violation*: Counterintuitive, less explanatory.
  7.  **Compositionality:** The meaning of complex sentences containing conditionals should be determined by the meanings of their parts and their mode of composition. *Motivation:* Standard principle of semantics; enables systematicity. *Cost of Violation:* Ad hoc, less explanatory power.
  8.  **Robustness under Certainty:** When `P(A) = 1`, `P(If A, then B) = P(B)`. When `P(A) = 0`, `P(If A, then B)` should be undefined or 1 (voidly true). *Motivation:* Aligns with conditional probability and intuition (if A is certain, "If A, B" is just about B; if A is impossible, the conditional seems moot). *Cost of Violation:* Inconsistency with conditional probability at limits.

  **The Incompatibility & Escape Hatches:**
  Lewis's Triviality shows **1 (Adams Thesis) + 2 (MP) + Conditionals as Propositions + Classical Probability Calculus ⇒ 4 (Triviality)**. To avoid triviality, an adequate theory *must* reject one element of this set:
  *   **Deny Conditionals Express Propositions (e.g., Suppositional/No-Truth-Value Views):** *Costs:* Severely complicates **3 (Embedding in Neg/Disj)** and makes **5 (Antecedent Embedding)** very difficult/nearly impossible; challenges compositionality **(7)**; makes defining validity for arguments with embedded conditionals tricky; clashes with intuitions that conditionals are sometimes true/false **(6)**.
  *   **Restrict Adams Thesis (1):** *Costs:* Sacrifices the core probabilistic intuition motivating the entire enterprise (the die case); needs principled restriction (hard to find).
  *   **Reject Classical Probability Calculus:** *Costs:* High technical complexity; non-standard logic/probability may seem ad hoc; challenges integrating with standard reasoning.
  *   **(Implausible) Reject Modus Ponens (2):** *Costs:* Sacrifices fundamental reasoning; wildly counterintuitive.

  **Scorecard (One-Sentence Each):**
  *   **Material Conditional:** Fails **1 (Adams Thesis)** catastrophically (die case) and makes many conditionals implausibly strong/weak, though it easily handles **2, 3, 5, 7**.
  *   **Strict Conditional:** Fails **1 (Adams Thesis)** and makes conditionals implausibly strong/weak (similar to material conditional under necessity), easily handles **2, 3, 5, 7** but poorly models uncertainty.
  *   **Stalnaker (Selection Functions):** Satisfies **2, 3, 5, 6, 7** elegantly by treating conditionals as propositions, but crashes on **1 (Adams Thesis) + 4 (Non-Triviality)** in classical probability, requiring rejection of universal Adams Thesis or classical probability.
  *   **Suppositional (No Truth Value, Adams):** Nails **1 (Adams Thesis)** and **4 (Non-Triviality)**, handles **2 (MP)** via validity definitions, but struggles deeply with **3 (Embedding Neg/Disj)** and fails **5 (Antecedent Embedding)** / **7 (Compositionality)**.
