answer: |-
  To navigate the landscape of logical uncertainty, consider four diagnostic questions that carve the conceptual territory. The first asks whether logical uncertainty—uncertainty about necessary truths, such as mathematical conjectures or deductive consequences—constitutes a distinct kind of uncertainty from empirical uncertainty, which concerns contingent facts about the world. Views diverge here: some hold that the necessity of logical truths makes them fundamentally different, requiring unique treatment, while others insist that uncertainty, regardless of source, should be governed by uniform principles. The second question probes whether an ideal reasoner, free of practical limitations like bounded computation, ought to be logically omniscient—that is, instantly aware of all logical consequences of their beliefs. Affirmative answers treat logical uncertainty as a symptom of human frailty to be idealized away; negative answers maintain that ideal rationality should accommodate inherent limits on logical deduction. The third question examines whether probabilistic coherence—avoiding Dutch books by ensuring beliefs satisfy the probability axioms—remains the appropriate standard for rational belief in logical propositions. Defenders see probabilities as essential for guiding bets on logical outcomes; critics argue that logical truths resist meaningful probabilistic representation. The fourth question explores whether resolving logical uncertainty demands innovations in decision theory—such as new rules for action under logical ignorance—or solely in epistemology—revising how beliefs are formed while retaining standard expected utility maximization.

  Within this framework, we locate established positions. The classical Bayesian idealization view answers that logical uncertainty is not meaningfully distinct from empirical uncertainty because both are handled by a single coherent probability function. It holds that an ideal reasoner must be logically omniscient, as coherence implies that all logical truths are assigned probability one. Consequently, probabilistic coherence is the gold standard, and no new decision theory is needed; non-ideal agents merely approximate this ideal through heuristics. This view struggles with real-world agents but preserves Bayesian purity by relegating logical uncertainty to a computational footnote.

  In contrast, the view treating logical facts as empirical unknowns agrees that logical uncertainty is not distinct but diverges by rejecting logical omniscience even for ideal reasoners. Here, logical propositions are modeled as empirical hypotheses, with priors assigned based on intuitive plausibility or simplicity, updated via evidence like proof fragments or failed disproofs. Probabilistic coherence is upheld as the standard, extending the Bayesian framework seamlessly. Decision theory requires no overhaul, as standard expected utility applies to these "empiricized" logical beliefs. This approach blurs the necessity of logic but offers a unified uncertainty calculus. Note, however, that it shares with classical Bayesianism the commitment to coherence and a unified uncertainty type, differing mainly on omniscience—a point where the taxonomy strains, as both views can appeal to idealization nuances to justify their stance.

  The logical induction program, designed for computable agents, treats logical uncertainty as distinct, necessitating specialized machinery like deductive processes and algorithmic learning. It rejects logical omniscience for ideal reasoners, defining ideals as timely and computable rather than unbounded. Probabilistic coherence is retained as a regulative ideal, approached asymptotically by a logical inductor that adjusts beliefs to avoid Dutch books across time. Only a new epistemology is deemed necessary; decision theory remains standard, using the inductor’s current probabilities for expected utility maximization. This view innovates in epistemology while conserving decision-theoretic foundations, though its distinct treatment of logic separates it from the prior two.

  Finally, views rejecting probabilistic representations altogether argue that logical uncertainty is distinct and demands non-probabilistic standards. These include proof-theoretic approaches (e.g., basing belief on proof lengths) or qualitative systems (e.g., default logics). They typically reject both logical omniscience and probabilistic coherence, positing that logical truths require certitude through deduction or fallible heuristics. Resolving logical uncertainty often necessitates new decision theories—for instance, ones that eschew expected utility for rules sensitive to logical risk. This category is heterogeneous, encompassing positions from hardcore deductivism to non-probabilistic uncertainty frameworks. Crucially, no prominent view combines the rejection of probabilistic coherence with an endorsement of logical omniscience; such a pairing would be incoherent, as omniscience implies certitude incompatible with non-probabilistic uncertainty.

  Two pairs of views resist crisp separation. Classical Bayesianism and the "logical facts as empirical" view overlap significantly in their unified treatment of uncertainty and commitment to coherence, differing primarily in their stance on omniscience—a distinction that blurs when considering degrees of idealization. Similarly, probabilistic-coherence rejecters and logical induction might converge in emphasizing computability, but their divergence on coherence and probability use generally keeps them apart. The taxonomy thus reveals a field where boundaries are porous, yet core disagreements about distinction, omniscience, coherence, and decision-theoretic novelty map the principal contours of debate.
