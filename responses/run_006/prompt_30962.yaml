     Alternatively, we can think of this view as: we treat logical facts as empirical, so an ideal reasoner (with unbounded resources) would be logically omniscient? But that seems to collapse into the classical view. So the key is that this view is applied to non-ideal agents. But then we are using the same Bayesian framework for both empirical and logical uncertainty. So:

     - Logical uncertainty is not distinct: same as empirical.
     - Ideal reasoner (if unbounded) would be omniscient? But the view is often used for non-ideal. So for the question about the ideal, we might say: if we define an ideal reasoner as unbounded, then yes, they should be omniscient. But the view is more about how non-ideal agents should handle it.

     To avoid confusion, let's note that this view is a way of extending Bayesianism to logical uncertainty by treating it as empirical. So the answers:

     - Q1: No, it is not distinct.
     - Q2: For an unbounded ideal reasoner, yes they should be omniscient. But the view is typically applied in bounded contexts, so we might say that the ideal for bounded agents is to update properly given their bounds, so they are not omniscient. This is a bit messy.

     Alternatively, we can state: This view does not challenge the classical ideal of unbounded omniscience, but provides a way for bounded agents to reason. So:

     - Q2: The ideal (unbounded) reasoner should be omniscient, but we are mainly concerned with non-ideal agents.

     - Q3: Yes, probabilistic coherence is the standard: we require a prior and update by conditioning.

     - Q4: Only new epistemology? Because we are extending the Bayesian epistemology to logical facts. Decision theory remains the same: maximize expected utility with respect to the same probability distribution.

  View C: Logical induction (LI)
