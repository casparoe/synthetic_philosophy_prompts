  We are building a taxonomy of views on how a reasoner ought to handle logical uncertainty. The goal is to map the conceptual territory by identifying key diagnostic questions and then locating actual positions by their answers to these questions. We must avoid bullet points, tables, etc., and write in continuous prose. The questions we must include are:

  1. Is logical uncertainty a distinct kind from empirical uncertainty?
  2. Should an ideal reasoner be logically omniscient?
  3. Is probabilistic coherence the right standard for logical beliefs?
  4. Does resolving logical uncertainty require a new decision theory or only a new epistemology?

  We must cover at least the classical Bayesian idealization, the view that treats logical facts as empirical unknowns (with a prior), the logical induction program, and views that reject probabilistic representations altogether. We also must flag any pair of views that the taxonomy cannot cleanly separate and any answer combinations that no one defends (with a brief note on why).

  Let's outline the diagnostic questions and the possible answers:

  Question 1: Is logical uncertainty a distinct kind from empirical uncertainty?
     - Yes: Logical uncertainty is fundamentally different because it concerns necessary truths, which are not subject to empirical evidence in the same way.
     - No: Uncertainty is uncertainty, regardless of the subject matter; the same rules should apply.

  Question 2: Should an ideal reasoner be logically omniscient?
     - Yes: An ideal reasoner should know all logical consequences of their beliefs, so logical uncertainty is a non-ideal phenomenon.
     - No: Even an ideal reasoner might face computational limits or other constraints that prevent logical omniscience.

  Question 3: Is probabilistic coherence the right standard for logical beliefs?
     - Yes: We can and should assign probabilities to logical claims and require that these probabilities satisfy the usual coherence conditions (e.g., avoiding Dutch books).
     - No: Probabilistic coherence is either unattainable or inappropriate for logical beliefs; we need a different standard.

  Question 4: Does resolving logical uncertainty require a new decision theory or only a new epistemology?
     - New decision theory: Because logical uncertainty affects how we make decisions (e.g., in logical bets), we need to adjust decision theory to handle it.
     - Only new epistemology: The challenge is to form rational beliefs about logical matters; once we have the beliefs, standard decision theory applies.

