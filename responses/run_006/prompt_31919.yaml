  - **Octopus behavior and stances**: Octopuses are cephalopods with complex nervous systems, capable of learning, problem-solving, and even playful behavior. However, they are invertebrates, solitary, and not evolutionarily close to mammals/birds. Under Principle A (mammal/bird-centric), the octopus gets design stance because it is not in the "privileged" biological categories. Under Principle B (cognitive flexibility), it gets intentional stance due to its demonstrable intelligence.
