  Okay, the user is taking an epistemology class and has noticed a pattern in discussions. They describe situations where people accept that they know something and that it entails another thing, but refuse to say they know the entailed thing. The reasons given are that the entailment is too long, hard to see, or the conclusion is weird. Examples include knowing Peano axioms but not a complex theorem derived from them, or knowing they have hands but not that they're not brains in vats. However, they accept simple entailments like knowing it's Tuesday and having class implies knowing it's Tuesday.

  The user wants to know if there's a name for this selective application of the closure principle, where only obvious or surveyable entailments are accepted. They also question if this position is coherent and how it differs from outright denying closure or just pragmatic constraints.

  First, I recall the closure principle in epistemology: if S knows P and P entails Q, then S knows Q. But as the user points out, people like Nozick and Dretske reject closure. The selective acceptance seems different. 

  The user mentions obviousness and surveyability as gates. Terms that come to mind include "epistemic closure," but that's the principle itself. "Inferential knowledge" might relate, but not quite. "Transmission of warrant" is another concept, but it's about justification transfer. Maybe "closure failure" with qualifiers? 

  I remember Williamson's "margin for error" principle. That could be relevant because complex entailments might not preserve knowledge under small margins. But the user's examples focus on the length or complexity of the inference, not just margin of error. 

  Another possibility is "competent deduction" from Williamson, where knowledge requires the ability to competently deduce Q from P. If the deduction is too complex, one might not be competent, so closure fails. That fits the Peano axioms example where the friend hasn't worked through the derivation. 

  For the brain-in-a-vat case, Hawthorne and Stanley's "action-centered epistemology" suggests knowledge requires actionable reasons. Denying being a BIV might not be actionable, so they withhold knowledge. But the user's peers seem to base it on the strangeness, not actionability. 

  The term "epistemic closure for obvious entailments" might be descriptive but not a standard name. The selectivity might be an unstable position. If someone accepts closure but only for trivial steps, that could lead to contradictions. For example, if each step is trivial but the whole chain is long, do they accept the conclusion? If not, it's inconsistent. If yes, then complex entailments should be accepted too, which they don't. So the position might be incoherent.

  Another angle: the user's peers might confuse psychological certainty with epistemic justification. Weird conclusions feel less certain, so they deny knowledge. But that's not a principled distinction. 

  The difference from outright closure denial (like Nozick) is that the user's peers accept closure in simple cases. Nozick rejects it entirely based on sensitivity. The selectivity here is based on complexity or weirdness, which isn't standard. 

  As for pragmatics, the "ought implies can" idea: you can't be expected to deduce all consequences. But that's about obligation, not knowledge. The user needs to distinguish between having knowledge and being able to articulate it. 

  Possible names: "Restricted Closure Principle," "Surveyability-Limited Closure," "Epistemic Closure under Competent Deduction." But these aren't standard terms. The closest might be "epistemic closure with a competence condition" from Williamson. 

  The edges are fuzzy. What counts as "obvious"? It's subjective. In the BIV case, it's the weirdness, not complexity. So two factors: inferential complexity and psychological salience of alternatives. 

  In conclusion, there's no single term. The position might be a mix of competent deduction and psychological factors, but it risks incoherence. The user should note that some philosophers like Williamson provide frameworks that accommodate this, while others see it as inconsistent. Advising them to frame it as a challenge to closure with complexity as a factor, citing Williamson or Hawthorne would be helpful.
answer: |-
  Your observation captures a **critical tension in epistemic closure** and points toward a nuanced position that *is* discussed in epistemology, though it lacks a single universally accepted name. Here's a breakdown addressing your core questions:

  ### Key Concepts & Potential Labels
  1. **Restricted Closure Principle (or Competence-Limited Closure)**  
     The selective acceptance you describe is often framed as a *restriction* on the standard closure principle. The core idea is:  
     > *Knowledge transmits across entailments* **only if** *the subject can competently grasp the inferential connection (or the connection is "obvious/surveyable").*  

     **Relevant Terms**:  
     - **Epistemic Closure under Competent Deduction** (inspired by Timothy Williamson).  
     - **Inferential Encapsulation Failure** (when knowledge fails to transmit due to cognitive limits).  
     - **Surveyability Constraint on Closure** (emphasizing the "graspability" of the inference).  

     Notably, **Robert Nozick**'s *sensitivity*-based theory (which rejects closure) and **Fred Dretske**'s *relevant alternatives* framework both explain *why* closure might fail in complex/strange cases, but they don't endorse the *selectivity* your peers exhibit. Your peers implicitly accept closure for trivial inferences while denying it for non-trivial ones—a position closer to **John Hawthorne** or **Timothy Williamson**'s work on cognitive constraints.

  2. **The "Why Not Obvious?" Gate**  
     The "obviousness" filter typically hinges on:  
     - **Cognitive Manageability**: Can the entailment be mentally tracked *without significant effort*?  
       (e.g., "Tuesday + class schedule → class today" is immediate; the Peano-to-theorem proof is not).  
     - **Salience of Error-Possibilities**: Bizarre conclusions (like BIV) make skeptical alternatives psychologically salient, undermining confidence even when entailment is granted.  
     - **Inferential Internalism**: Knowledge of *Q* requires *awareness* of how *Q* follows from *P*—not just logical entailment.  

     This aligns with **Crispin Wright**'s distinction between *transmission* vs. *closure* of warrant: warrant "transmits" only across *cogent, accessible* inferences.

  ---

  ### Is This Position Coherent? The Core Tension
  The selectivity *can* be coherent **if grounded in a theory of epistemic competence**, but it risks instability. Here's why:

  - **Pro-Coherence Argument**:  
    If knowledge requires *doxastic responsibility* (as per **Ernest Sosa**), agents aren't obligated to believe all remote consequences of their beliefs. Williamson argues that **knowledge is a mental state** constrained by cognitive limits: you can't "know" a theorem if you lack the computational capacity to derive it, even if you accept the axioms. This frames closure as conditional on *ability to deduce*.

  - **Incoherence Risks**:  
    1. **The Iteration Problem**: If "I know *P*" and "*P → Q*" is true but non-obvious, do I *know* that "*P → Q*"? If not, closure doesn't apply. But if I *grant* entailment, I seemingly accept "*P → Q*" is true—which might imply I *should* know it.  
    2. **Sorites-Style Collapse**: If each step in a long proof is "obvious," but the whole chain isn't, where does knowledge break down? Refusing to draw a line seems arbitrary.  
    3. **Bizarreness ≠ Epistemic Weakness**: Rejecting knowledge of *Q* because *Q* is "weird" (e.g., ~BIV) conflates *psychology* with *justification*. If entailment holds, *Q* is equally supported by *P*'s evidence.

  ---

  ### Boundaries: What Counts as "Obvious Enough"?
  The edges are inherently fuzzy, but key factors include:  
  | Factor | Trivial Example (Closure Accepted) | Non-Trivial Example (Closure Denied) |  
  |--------|-------------------------------------|--------------------------------------|  
  | **Cognitive Steps** | "I have hands → I have fingers" (1 step) | Peano axioms → Goldbach's conjecture (1000+ steps) |  
  | **Inferential Effort** | Immediate deduction (<1 second) | Requires hours/days of proof verification |  
  | **Salience of Alternatives** | "It's Tuesday" (no salient error-scenarios) | "~BIV" (raises vivid skeptical scenarios) |  
  | **Competence** | Within subject's deductive capacity | Beyond subject's mathematical skill |  

  This differs from:  
  - **Outright Closure Denial (à la Nozick)**: Rejects closure *universally*, even for trivial cases. Your peers accept it for simple inferences.  
  - **Pragmatic Excuse ("ought implies can")**: You *can't* deduce all entailments, so you're excused from *blame*—but this doesn't mean you *lack knowledge*. Your peers deny knowledge itself.  

  ---

  ### Recommendation for Your Paper
  1. **Avoid inventing a new term**. Instead, describe it as:  
     > *"A surveyability-restricted closure principle"* or *"competence-conditional epistemic closure."*  
     Cite **Williamson** (*Knowledge and Its Limits*, Ch. 4) on cognitive constraints, and **Hawthorne** (*Knowledge and Lotteries*, Ch. 1) on psychological salience affecting closure.  

  2. **Argue its instability**: Point out that granting entailment while denying knowledge of *Q* conflates:  
     - *Metaphysical entailment* (P→Q is true)  
     - *Epistemic basing* (I haven’t *inferred* Q from P)  
     - *Psychological conviction* (Q feels less certain).  

     Conclude that this position either:  
     - **Collapses into full closure** (if "granting entailment" implies one *could* deduce Q), or  
     - **Collapses into skepticism** (if even obvious entailments are distrusted when conclusions are strange).  

  This pattern reveals a deep discomfort with **internalism about justification**—your peers want knowledge to be "felt" or "owned," not just logically implied. That’s the real tension to explore.
