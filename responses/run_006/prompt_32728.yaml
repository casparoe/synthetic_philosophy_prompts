prompt: |-
  ok so we've been doing epistemology in philosophy and we got onto this thing about testimony — like whether believing stuff people tell you is basically just a fancy kind of induction, or whether it's its own thing, a proper source of knowledge like perception or memory. and my mate josh and me got into a proper argument about it in the common room afterwards. could you write out a dialogue between a reductionist and an anti-reductionist about testimony? like, make them actually respond to each other's points properly rather than just talking past each other. don't make either of them sound thick — they should both have decent arguements. oh and make it sound like two sixth formers not like uni professors lol
