    **Overall fit: 4/6 → Poor fit (fails Smoking, 60%-predictor)**. EDT is ruled out.

  - **Functional Decision Theory (FDT)**  
    Treats the decision as the output of a function that the predictor simulates. Chooses actions that lead to the best outcome *if the decision function is consistent across all instances* (including the predictor's simulation). This is a **contested view** (associated with Yudkowsky, Soares, etc.), not consensus, but fits your advisor's pattern. FDT often resembles EDT in Newcomb-like cases but diverges when predictors aren't "simulating" the decision function.  
    - Classic Newcomb: **One-box** (by one-boxing, your decision function causes the predictor to have put $1M in the box during its simulation).  
      *Advisor's verdict: One-box* → Fits.  
    - Smoking lesion: **Smoke** (no simulation by a predictor; lesion causes both smoking desire and cancer, but smoking doesn't cause cancer. FDT defaults to CDT-like reasoning here).  
      *Advisor's verdict: Smoke* → Fits.  
    - Psychopath button: **Don't press** (pressing indicates a decision function that leads the predictor to classify you as a psychopath, so you die).  
      *Advisor's verdict: Don't press* → Fits.  
    - Transparent Newcomb: **Two-box** (contents are fixed and visible; no simulation at choice time, so FDT defaults to causal reasoning).  
      *Advisor's verdict: Two-box* → Fits.  
    - Parfit's hitchhiker: **Pay** (not paying would imply a decision function that wouldn't have gotten you the ride; paying maintains consistency with the function that did).  
      *Advisor's verdict: Pay* → Fits.  
    - 60%-accurate predictor: **Two-box** (problem states "no simulation involved," so FDT treats it as purely statistical and defaults to CDT-like two-boxing).  
      *Advisor's verdict: Two-box* → Fits.  
    **Overall fit: 6/6 → Perfect fit**. FDT explains all verdicts by distinguishing between predictors that simulate the decision function (Classic, Psychopath, Hitchhiker) and those that don't (Smoking, Transparent, 60%-predictor). When no simulation is involved, FDT often collapses to CDT.

  - **Accuracy-Threshold View**  
    Ad-hoc rule: one-box iff the predictor's accuracy exceeds a threshold (e.g., >90%). Ignores causal/evidential distinctions and focuses on reliability.  
    - Classic Newcomb (100%): **One-box** (accuracy > threshold).  
      *Advisor's verdict: One-box* → Fits.  
    - Smoking lesion: **Ambiguous** (no predictor, so threshold doesn't apply; verdict depends on other factors). Advisor's "smoke" verdict fits only if we ignore this case, but it's not clear.  
    - Psychopath button: **Press** (if predictor is perfect, accuracy > threshold, so pressing should be chosen for $100; but advisor says don't press).  
      *Advisor's verdict: Don't press* → **Does not fit** (unless we assume a threshold >100%, which is incoherent).  
    - Transparent Newcomb: **Two-box** (transparency breaks the prediction-based reason to one-box).  
      *Advisor's verdict: Two-box* → Fits.  
    - Parfit's hitchhiker: **Ambiguous** (accuracy of driver's prediction is unspecified; advisor's "pay" might fit if accuracy is high, but it's not addressed).  
    - 60%-accurate predictor: **Two-box** (accuracy < threshold).  
      *Advisor's verdict: Two-box* → Fits.  
    **Overall fit: 3/6 → Poor fit (fails Psychopath and ambiguities in Smoking/Hitchhiker)**. This view is inconsistent and doesn't explain the pattern.

  **Conclusion on Fit**: Only FDT cleanly fits all six verdicts. It does so by keying on whether the predictor **simulates the decision function**:
  - Simulating predictors (Classic Newcomb, Psychopath button, Parfit's hitchhiker): Decision affects the prediction acausally, so FDT maximizes utility by "cooperating" with the simulation.
  - Non-simulating predictors (Smoking lesion, Transparent Newcomb, 60%-predictor): No acausal control, so FDT defaults to CDT-like causal reasoning.

  The distinction between "simulating" and "non-simulating" predictors is core to FDT and explains the advisor's divergence in cases like Classic Newcomb vs. 60%-predictor. This is **contested** in decision theory—CDT and EDT are more established—but fits your advisor's pattern.

