prompt: |-
  I've recently started working for a foundation that makes grants across very different cause areas — global health, pandemic prevention, AI safety — and I've realized that my recommendations implicitly depend on population-ethical judgments I've never made explicit. So I sat down and worked through my gut reactions to a series of cases. I'd like you, as a professional philosopher specializing in population ethics, to help me extract the principle (or small set of principles) that best captures these verdicts, tell me which ones I may need to abandon, and apply the resulting view to the case I keep going back and forth on.

  Please think carefully — start by brainstorming which axiological theories could accommodate different subsets of my verdicts, then work toward the most coherent overall position.

  Here are the cases and my verdicts:

  1. World A: 10 billion people with extraordinarily good lives. World Z: an astronomically large number of people with lives that are just barely worth living — a bit more happiness than misery, but only just. I judge World A better than World Z. The sheer number of barely-positive lives in Z doesn't compensate for how meager each one is.

  2. Start with a population of 10 billion people living good lives. Now add 10 billion additional people whose lives are also positive, though noticeably less good than the original group's. The original group is unaffected — their lives go exactly as before. I judge the resulting world no worse than the original. Adding happy people doesn't make the world worse.

  3. World S: a thousand people enduring excruciating torture. World T: an astronomically large number of people each experiencing a mild headache. I judge World T worse. Aggregating tiny sufferings across enough people eventually outweighs intense suffering concentrated in a few.

  4. A future with no sentient life at all — an empty universe after humanity goes extinct. Versus a future in which trillions of beings live flourishing, happy lives over millions of years. I judge the populated future vastly better. An empty universe would be a tragedy.

  5. We have a fixed budget. Option One: substantially improve the welfare of a million currently existing people. Option Two: instead of helping them, use the money to bring a million new people into existence whose lives would be even happier than the improved lives under Option One. I judge Option One better. We owe more to actual people than to merely possible ones.

  6. A thousand people with deeply excellent lives — rich in achievement, love, and beauty — versus a hundred thousand people whose lives are merely fine: pleasant enough, but shallow. I judge the thousand excellent lives better, even though total welfare might be higher in the larger population.

  7. (The case I go back and forth on.) My partner and I are considering having a child. We have good reason to think the child would have a genuinely good life — not perfect, but clearly worth living. On some days I think: bringing a new person with a good life into the world makes the world better, impersonally speaking. On other days I think: there's no one who is harmed by our not having the child, so how could not having them be worse? I can't settle this.

  Is there an axiological principle — total utilitarianism, average utilitarianism, a critical-level view, a person-affecting view, something else — that captures verdicts 1 through 6? Which verdicts would I have to revise to make things cohere? And what does the resulting view say about case 7?
reasoning: |-
  Okay, let me start by understanding the user's situation. They work for a foundation making grants across diverse areas like global health, pandemic prevention, and AI safety. They've realized their decisions depend on implicit population ethics judgments. They want to make these explicit and find a coherent principle to guide their recommendations. 

  First, I need to analyze their verdicts on the seven cases. Each case tests different aspects of population ethics. The user's judgments seem inconsistent at first glance, so I need to identify which theories align with each verdict and where conflicts arise.

  Looking at Case 1: They prefer 10 billion with excellent lives over an astronomical number with barely positive lives. This rejects total utilitarianism, which would favor Z due to higher total utility. It suggests a form of diminishing marginal value or a cap on how much quantity can compensate for quality.

  Case 2: Adding more happy people without affecting existing ones isn't worse. This supports non-anti-egalitarianism and contradicts average utilitarianism, which might lower the average happiness. It aligns with total utilitarianism but conflicts with Case 1.

  Case 3: An enormous number of mild headaches outweighs intense torture for a few. This is classic aggregation, which total utilitarianism supports. But it conflicts with their rejection of aggregation in Case 1. Hmm, that's a tension. How can they accept aggregation for suffering but not for positive welfare?

  Case 4: A flourishing future is better than extinction. This is straightforward; most theories agree except anti-natalist views. It emphasizes the value of positive existence.

  Case 5: Improving existing lives is better than creating new, happier ones. This leans towards person-affecting views, prioritizing actual people over possible ones. Total utilitarianism would prefer Option Two if total utility is higher, so this is a rejection.

  Case 6: A thousand excellent lives over a hundred thousand mediocre ones. This values quality over quantity again, clashing with total utilitarianism. Average utilitarianism would agree, but they rejected average in Case 2.

  Case 7 is their uncertainty about procreation. They're torn between impersonal good and the absence of harm in not creating life. This highlights the core conflict in population ethics.

  Putting it all together, their judgments suggest a hybrid approach. They seem to accept aggregation for suffering but not for positive welfare. Critical-Level Theory with a high critical level fits Cases 1 and 6. A person-affecting asymmetry explains Case 5. But Case 3's aggregation of suffering is tricky—why aggregate pain but not pleasure? They might need to adjust either Case 1 or 3.

  Perhaps a lexical threshold or prioritarianism could resolve it, where extreme suffering has lexical priority, while positive welfare has diminishing returns. That might reconcile Case 1 and 3. Also, their discomfort in Case 7 is understandable; many theories struggle here. A person-affecting view with a sufficientarian threshold could justify having a child if their life is good enough, without implying a duty to create life.

  The user's deeper need is clarity for grant decisions. They need a principled framework to avoid inconsistency. Highlighting where their intuitions conflict (like aggregation asymmetry) is crucial. They might accept modifying Case 1 or 3, or adopt a nuanced view like Critical-Level Theory with a person-affecting component. Case 7's resolution would then depend on whether creating a good life is a net positive given their thresholds.
answer: |-
  Based on your carefully considered verdicts, we can extract a coherent ethical framework. Your intuitions point toward a **modified Critical-Level Utilitarianism with a Person-Affecting Asymmetry and Lexical Priority for Suffering**. Let's break this down step by step:

  ### Step 1: Mapping Verdicts to Theories
  | **Case** | Your Verdict | Total Utilitarianism | Average Utilitarianism | Critical-Level | Person-Affecting |
  |----------|--------------|----------------------|------------------------|---------------|------------------|
  | 1 (A>Z)  | ✅ A better | ❌ Favors Z (higher total) | ✅ Favors A (higher avg) | ✅ If CL > "barely positive" | ✅ No one harmed |
  | 2 (Add OK) | ✅ Addition neutral/good | ✅ Favors addition | ❌ Opposes (lowers avg) | ✅ If new lives > CL | ⚠️ Neutral if no harm |
  | 3 (T worse) | ✅ T worse | ✅ Favors S (less total suffering) | ❌ Favors T (less avg suffering) | ❓ Depends on CL | ❌ S clearly worse (actual harm) |
  | 4 (Populated better) | ✅ Populated | ✅ Favors populated | ✅ Favors populated | ✅ Favors populated | ⚠️ Neutral? (no subjects to harm) |
  | 5 (Help existing) | ✅ Option One | ❌ Favors Option Two (higher total) | ✅ Favors Option One (higher avg) | ⚠️ Depends on CL | ✅ Prioritizes actual people |
  | 6 (Excellent > many fine) | ✅ Thousand better | ❌ Favors larger pop | ✅ Favors smaller (higher avg) | ✅ If CL near "excellent" | ⚠️ No clear preference |

  **Key Conflicts Revealed:**
  - **Verdict 1 vs. Verdict 3:** You reject *aggregation* for positive welfare (barely positive lives don't sum to outweigh excellence) but *accept aggregation* for suffering (many tiny pains outweigh few intense pains). Total utilitarianism can't accommodate both.
  - **Verdict 2 vs. Verdict 5:** You accept adding happy people when they appear "naturally" (V2) but prioritize helping existing people over creating new ones (V5). Person-affecting views explain V5 but struggle with V2.

  ### Step 2: Synthesizing Your Principle
  Your view combines three core ideas:

  1. **Critical-Level Utilitarianism (CLU) with a High Threshold**  
     - Lives must exceed a **substantial positive threshold** (far above "barely worth living") to count as net-positive additions.  
     - *Explains:*  
       - Verdict 1: World Z's lives fall below your critical level.  
       - Verdict 6: "Merely fine" lives may hover near/below threshold, while "excellent" lives far exceed it.  
       - Verdict 4: Trillions of *flourishing* lives clear threshold easily.

  2. **Asymmetric Treatment of Suffering vs. Welfare**  
     - Suffering aggregates linearly (per total utilitarianism), while positive welfare has **diminishing marginal value** and a high critical level.  
     - *Explains:*  
       - Verdict 3: Vast numbers of small pains *do* sum to outweigh intense suffering.  
       - Verdict 1: Vast numbers of small pleasures *do not* sum to outweigh fewer excellent lives.

  3. **Person-Affecting Asymmetry for Creation**  
     - Creating new lives is morally neutral *unless they suffer*, but improving existing lives is actively good.  
     - *Explains:*  
       - Verdict 5: We owe more to actual people (improving lives is obligatory).  
       - Verdict 2: Adding happy people isn't *worse* (but not required).  
       - Verdict 7 tension: Creating a happy life is *permissible* but not *obligatory*.

  ### Step 3: Verdicts Requiring Revision
  To achieve full coherence, **one verdict needs adjustment**:
  - **Verdict 2** states adding happy people is "no worse." But your other judgments suggest it should be *weakly better* (if lives exceed critical level) or *neutral* (due to person-affecting asymmetry).  
    → **Revised Verdict 2:** Adding happy people *slightly improves* the world if their lives are excellent (well above critical level), but isn't required. If lives are "merely positive," it may be neutral.

  ### Step 4: Resolving Case 7 (Having a Child)
  Your synthesized view delivers a clear answer:  
  - **Creating a child with a "genuinely good life" is *impersonally good* but not *obligatory*.**  
    - *Why good?* The child's life exceeds your high critical level (it's "clearly worth living" → net positive). By CLU, this increases overall value.  
    - *Why not obligatory?* Person-affecting asymmetry: No one is *harmed* by non-creation, so you have no duty to create them (aligns with Verdict 5).  
  - **Practical Implication:** Having the child makes the world better, but not having them isn't wrong. The choice rests on personal/familial reasons, not a strict moral duty.

  ### Why This Fits Better Than Alternatives
  - **Total Utilitarianism:** Fails Verdicts 1, 5, and 6 (overweights quantity).  
  - **Average Utilitarianism:** Fails Verdicts 2 (opposes adding happy people) and 3 (prefers vast headaches over torture).  
  - **Standard Critical-Level:** Fails Verdict 3 (if CL is positive, small headaches are "net negative" → favors S).  
  - **Negative Utilitarianism:** Fails Verdicts 4 and 2 (opposes creating any life, even happy ones).  

  Your view is closest to **CLU+** but with critical innovations:  
  1. Higher critical level for positive welfare than for suffering.  
  2. Linear aggregation *only* for suffering.  
  3. Creation asymmetry: Welfare gains from new lives are "bonuses," not obligations.

  ### Final Framework Summary
  | **Principle**                          | **Component**               | **Manifests in Your Verdicts**       |
  |----------------------------------------|-----------------------------|--------------------------------------|
  | High critical level (e.g., "flourishing") | Quality over quantity    | 1, 4, 6                             |
  | Linear aggregation of suffering        | Pain can't be diluted     | 3                                    |
  | Diminishing returns on positive welfare | Small gains don't sum     | 1, 3 (asymmetry)                    |
  | Person-affecting creation asymmetry    | No duty to create happy lives | 5, 7 (resolution)                  |

  This framework justifies prioritizing **preventing suffering** (global health, AI risk mitigation) and **uplifting existing lives** (poverty alleviation) over mere population expansion, while allowing creation of new lives as a positive act. For your foundation, it suggests grants should:  
  1. **First:** Reduce extreme suffering (aligned with Verdict 3's urgency).  
  2. **Second:** Elevate lives above the "flourishing" threshold (Verdicts 1, 5, 6).  
  3. **Third:** Consider adding new lives only if they reliably exceed the critical level *and* don't divert resources from 1 or 2 (Verdicts 2, 5, 7).  

  Would you like to test this framework against additional cases or refine the thresholds?
