prompt: |-
  I've been covering science and ideas for a while now, and I've realized I have no idea what my actual view is about unrealistic assumptions in models. Like, I have strong feelings about specific cases but I can't extract a principle from them, and it's starting to bug me. Here are my verdicts — maybe you can tell me what rule I'm implicitly running, or what rule I should be running, and which of my verdicts it forces me to give up.

  1. The ideal gas law — point particles with zero volume and no intermolecular forces. Completely fine. It's a first approximation, everyone knows the deal, it's useful across a huge range of conditions.

  2. Frictionless planes in intro physics. Also totally fine. No one walks away thinking surfaces are actually frictionless.

  3. The Modigliani-Miller theorem — firm value is independent of capital structure, but only under no taxes, no bankruptcy costs, no information asymmetries, and perfect markets. As a theoretical benchmark I think it's fine. But I get annoyed when people cite it loosely in policy debates without acknowledging the assumptions, which happens constantly.

  4. Rational expectations in macroeconomics — the assumption that people form expectations as if they know the true model of the economy. I basically think this is not okay. It's not a simplification, it's a falsification, and the falsification drives the results. I don't care that it's "as-if."

  5. Hardy-Weinberg equilibrium — infinite population, no mutation, no selection, no migration, random mating. Completely fine. It's a null model. You use it to detect departures, not to describe the world.

  6. Black-Scholes option pricing — continuous trading, no transaction costs, constant volatility, geometric Brownian motion. As a starting point for thinking about options, fine. Traders who plugged numbers in without thinking about the assumptions were being reckless, but I don't blame the model for that.

  7. Friedman's billiard player — you predict an expert's shots by assuming they compute optimal angles and velocities, which they obviously don't do consciously. I'm weirdly fine with this. It's an as-if model and it predicts well. But wait — how is this different from rational expectations? I'm suddenly aware that I'm being inconsistent and I don't know how to fix it.

  8. Climate models that parameterize cloud formation crudely because we can't resolve clouds at grid scale. I'm fine with this, even though the parameterizations are known to be rough and they affect the projections. What else are you supposed to do? But I feel like I'm giving climate models a pass I don't give rational expectations models, and that bothers me.

  9. The strong-form efficient market hypothesis — prices reflect all information, public and private. I think this is not fine as anything other than a toy, and the fact that it was taken seriously for so long did real damage. But I'm fine with Modigliani-Miller which shares a lot of its DNA. What gives?

  So what's my principle? It's not "assumptions are fine if the model predicts well," because Hardy-Weinberg doesn't predict anything by itself and I'm fine with it. It's not "assumptions are fine if they're flagged," because rational expectations models flag their assumptions and I still don't like them. It's not "assumptions are fine if they're false but harmless," because I can't define harmless without just pointing at my verdicts. Is there a coherent position here, and if so, which of my verdicts does it force me to revise? Also, what would it say about a case I didn't list — agent-based models in epidemiology that assume every individual follows identical simple interaction rules?
reasoning: |-
  Okay, let me try to figure out what's going on with this user. They're a science and ideas writer who's grappling with how to evaluate models with unrealistic assumptions. They've listed several examples where they feel comfortable with the simplifications and others where they don't, and they're looking for a consistent principle to apply. 

  First, I notice they're frustrated by their own inconsistency, especially in cases like rational expectations versus Friedman's billiard player. Both use "as-if" reasoning, but they accept one and reject the other. That's clearly bothering them. Also, they mention climate models getting a pass while rational expectations doesn't, even though both involve unavoidable simplifications. 

  Hmm, their examples span physics, economics, biology, and climate science. That's a broad range, so whatever principle they need should be interdisciplinary. They've already rejected simple answers like "good predictions" or "flagged assumptions" because counterexamples exist in their list. 

  I think the key might be how the assumptions interact with the model's purpose. For ideal gas law or Hardy-Weinberg, the simplifications create a baseline for measuring real-world deviations. But for strong-form EMH, the assumptions aren't just simplifications—they actively mask important real-world phenomena like bubbles or information asymmetry. 

  The user seems especially sensitive to models that get used beyond their intended scope. They're fine with Modigliani-Miller as a theoretical benchmark but annoyed when it's cited in policy debates without caveats. That suggests transparency about limitations matters, but only when the model's application matches its design. 

  For the epidemiology question they posed: agent-based models with identical agents would be acceptable as exploratory tools for studying system dynamics, but they'd need heavy caveats if used for real-world predictions where heterogeneity matters. That fits their pattern—it's about alignment between the simplification and the use case. 

  Their discomfort with rational expectations might stem from seeing it as a foundational assumption that biases entire economic theories, whereas billiard players is just a localized analogy. The scale of the idealization matters. 

  I should probably challenge them to reconsider whether their rejection of strong-form EMH is about the assumption itself or about its historical misuse. Because Modigliani-Miller shares DNA but they accept it as a benchmark—that's a tension worth examining. 

  The agent-based model example is interesting because it hits their criteria: if used mechanistically (bad) versus as a sensitivity-testing tool (fine). They'd likely reject it for concrete predictions but accept it for theoretical exploration, matching their stance on Hardy-Weinberg. 

  They're clearly thoughtful but tangled in their own exceptions. The meta-principle I'm seeing is: "What work is the assumption doing?" Is it enabling insight (good) or smuggling in conclusions (bad)? But that needs unpacking...
answer: |-
  Based on your verdicts, your principle isn't about realism, predictive power, or flagging assumptions *alone*. Instead, **you judge unrealistic assumptions based on their *purpose* and *consequences* within the model's intended *domain of application* and the *context of its use*.** Here's the breakdown:

  ### Your Implicit Principle (Refined)
  **Unrealistic assumptions are acceptable when:**
  1.  **They serve a clearly defined, limited purpose:** (e.g., baseline/null model, conceptual benchmark, pedagogical tool, tractable starting point).
  2.  **They don't actively *drive* the core result in a way that misleads within the intended context:** The simplification shouldn't be the *primary reason* for a key conclusion if that conclusion is presented as generally true beyond the model's limited scope.
  3.  **The model's limitations are understood and respected in its application:** Users (especially experts/policymakers) acknowledge the gap between the model and the complex reality it simplifies, and use it appropriately.
  4.  **The simplification is unavoidable or necessary for gaining *any* initial insight:** Especially when modeling complex systems where full realism is computationally or theoretically impossible at the desired scale.

  ### Applying the Principle to Your Verdicts

  1.  **Ideal Gas Law (Fine):** Purpose = Foundational baseline/approximation. Assumptions don't *drive* the core usefulness for many gases under many conditions. Limitations well-understood. Unavoidable starting point.
  2.  **Frictionless Planes (Fine):** Purpose = Pedagogical tool for teaching core mechanics concepts. Assumptions enable isolation of principles. Limitations explicitly taught and understood. Unavoidable for initial teaching.
  3.  **Modigliani-Miller (Fine as benchmark, Annoying in policy):** Fine because its purpose *is* a theoretical benchmark showing what *would* happen *if* markets were perfect. Problematic when used in policy *without acknowledging the assumptions* (violates point 3). The assumptions *define* the result, but that's the point of a benchmark.
  4.  **Rational Expectations (Not Okay):** You perceive that the assumption *actively drives* core macroeconomic results (e.g., policy ineffectiveness, equilibrium always optimal) and is presented as generally applicable beyond its highly restrictive domain. It feels like a *falsification smuggled in as a simplification*, misleading in policy contexts. Violates points 2 & 3.
  5.  **Hardy-Weinberg (Fine):** Purpose = Explicit null model *for detecting deviation*. Assumptions *define* the null state. Doesn't claim descriptive reality. Limitations core to its use. Perfectly serves its purpose.
  6.  **Black-Scholes (Fine as start, Reckless use):** Fine as a conceptual starting point and approximation under "normal" conditions. Assumptions enable tractability. Limitations understood by experts, but reckless application by some users violated point 3.
  7.  **Friedman's Billiard Player (Fine):** Purpose = Limited demonstration of "as-if" instrumentalism for *predicting outcomes* in a *specific, constrained behavior*. The assumption (complex calculation) isn't driving the prediction in a way that misapplies to the *outcome* (ball path). It's a parsimonious explanation of observed skill. Context is clear: predicting shots, not modeling cognition.
  8.  **Climate Model Parameterizations (Fine):** Purpose = Modeling an impossibly complex system at a necessary scale. The crudeness is *unavoidable* (point 4) given current tech/knowledge. The limitations are actively researched and acknowledged. The assumptions are necessary compromises, not drivers chosen for ideological convenience. Results include uncertainty ranges reflecting this.
  9.  **Strong-Form EMH (Not Fine):** You see it as a poor benchmark because it ignores fundamental realities (information asymmetry, psychology) that *are* the drivers of critical market phenomena (bubbles, crashes, insider trading). Taken seriously beyond its toy status, it actively misled (violated points 2 & 3), causing damage. Unlike Modigliani-Miller, its failure as a descriptor wasn't adequately acknowledged in application.

  ### Addressing Your Inconsistency (RE vs. Billiards & Climate)
  *   **Rational Expectations vs. Billiard Player:** The key difference is the *scope, consequence, and context*.
      *   Billiards: Explains a *specific, observable outcome* (ball path) in a *constrained environment*. The "as-if" calculation assumption is a harmless shortcut to the prediction. It doesn't claim to model the *process* (thought) accurately, nor does that process assumption distort the prediction in this context.
      *   Rational Expectations: Embedded in models claiming to describe *complex, system-wide outcomes* (inflation, unemployment, growth) *in dynamic, real-world economies*. The assumption *fundamentally shapes* these outcomes (e.g., negating Keynesian effects) and is often presented as a reasonable approximation of agent behavior, which you find deeply misleading. Its consequences in policy are significant.
  *   **Rational Expectations vs. Climate Parametrizations:** The difference is *necessity, acknowledgment, and purpose*.
      *   Climate: Crude clouds are an *unavoidable concession* to complexity/scale (point 4), openly acknowledged, and the model's purpose (projecting climate change) incorporates uncertainty from this. The core drivers (GHGs, basic physics) are well-represented.
      *   Rational Expectations: You perceive it as an *avoidable ideological choice* masquerading as a technical necessity. Its limitations are often downplayed in application, and it fundamentally alters the model's conclusions about how the macroeconomy functions.

  ### Your Principle Forces You To Revise...
  Potentially **Rational Expectations**. If you strictly apply your principle, the *purpose* of RE is to provide tractable microfoundations for macro models (point 1). Its proponents *do* acknowledge assumptions (point 3, though perhaps not loudly enough in policy for you). The debate hinges heavily on point 2: *Does the assumption actively drive misleading results?* Many economists argue it provides valuable insights even if imperfect; you find it fundamentally distorting. Your principle *allows* you to reject it based on point 2 (it drives misleading results) and point 3 (its limitations aren't adequately respected in real-world application/policy discourse). It doesn't *force* you to accept it, but it clarifies *why* you reject it compared to other "as-if" models: its scope, consequence, and application context make it harmful in your view.

  ### The Agent-Based Epidemiology Model Case
  Applying your principle:
  1.  **Purpose:** Is it a conceptual exploration of *system dynamics* (e.g., how network structure affects spread)? Is it a crude first-pass approximation? Or is it being sold as a predictive tool for specific interventions?
  2.  **Consequence of Assumption:** Does assuming identical agents *drive* a key result that would disappear with heterogeneity, and is that result presented as generally true? (e.g., Does it predict herd immunity at 60% *only* because agents are identical, when heterogeneity might push it to 80%?).
  3.  **Acknowledgment & Context:** Are the limitations (ignoring age, behavior, immunity variation) explicitly stated? Is it used appropriately (e.g., "This simplified model suggests X might be important, but real-world variation will modify this")?
  4.  **Necessity:** Is heterogeneity computationally infeasible for the initial question/scale?

  **Your likely verdict:** You'd be **fine** with it *if* its purpose is conceptual exploration or a null model, its limitations are acknowledged, and it's not used to make precise real-world predictions without massive caveats. You'd be **annoyed** if results from this highly simplified model were presented as directly applicable policy guidance without acknowledging the impact of the homogeneity assumption (similar to your Modigliani-Miller policy gripe). The assumption itself isn't inherently bad; it's about how the model is framed and used. It serves a purpose (tractability, isolating interaction rules) but must be handled with care regarding points 2 and 3.

  **In essence, your principle is pragmatic and contextual, focused on the *role* and *handling* of the simplification rather than its realism per se.** It allows you to accept useful fictions while rejecting those you perceive as harmful distortions, based on the model's job and how it's employed in the world.
