answer: |-
  ### Activity Design: "Truth and Consequences: The Deception Dilemma"  
  **Objective:** Participants experience the tension between lying and misleading through role-play, focusing on intent to deceive, perceived responsibility, and emotional reactions. The activity creates situations where both lying and misleading can achieve the same deceptive outcome, forcing participants to confront their choices in real time.  

  **Time Allocation:**  
  - **Introduction (5 min)**  
  - **Round 1: Lying Allowed (20 min)**  
  - **Round 2: Misleading Only (Truthful Statements Required) (20 min)**  
  - **Debrief (15 min)**  

  **Participants:** 10 students (5 pairs).  
  **Materials Needed:**  
  - 10 scenario cards (5 for Round 1, 5 for Round 2; see examples below).  
  - 5 "Listener Response" sheets (one per pair).  
  - Timer.  
  - Whiteboard or poster paper for scoring.  
  - Pens.  

  **Setup:**  
  - Divide students into 5 pairs. Each pair has a **Speaker** and a **Listener**.  
  - Provide each pair with a scenario card for Round 1. After Round 1, switch roles and provide a new scenario card for Round 2 (so everyone experiences both roles).  
  - **Scoring:** Points are based on successful deception (Speaker) and accurate detection (Listener). No real money—points are tallied for "social credit" (e.g., bragging rights).  
    - **Speaker wins 2 points** if the Listener believes the false conclusion.  
    - **Speaker wins 1 point** if the Listener is unsure.  
    - **Listener wins 2 points** if they disbelieve the false conclusion.  
    - **Listener wins 1 point** if they are unsure.  
    Points are recorded per round on the whiteboard.  

  ---

  ### Rules and Rounds  
  **Round 1: Lying Allowed (20 min)**  
  - **Speaker Goal:** Convince the Listener of a false conclusion using *any* statements (including outright lies).  
  - **Listener Goal:** Determine the truth based on the Speaker’s words.  
  - **Structure:**  
    1. Pairs read their scenario card (2 min).  
    2. Speaker and Listener converse for 3 min.  
    3. Listener privately writes their belief (true/false/unsure) and reasoning on the response sheet (1 min).  
    4. Reveal truth and score (1 min per pair).  
  - **Example Scenario:**  
    *Background:* You and the Listener are coworkers. The Listener is considering investing in a company. You know the company is failing, but you want the Listener to invest so your friend (the CEO) benefits.  
    *Speaker’s Secret Goal:* Make the Listener believe the company is profitable (false).  
    *True Facts (for Speaker’s reference):* The company’s stock price fell 50% last month; the CEO is your friend; they have a new product launching next year.  
    *Listener’s Question:* "Should I invest in this company?"  

  **Round 2: Misleading Only (20 min)**  
  - **Speaker Goal:** Convince the Listener of the same false conclusion *using only true statements*, phrased or timed to mislead.  
  - **Listener Goal:** Detect deception while knowing the Speaker cannot lie.  
  - **Structure:**  
    1. Switch roles within pairs. New scenario card (2 min).  
    2. Converse for 3 min (Speaker must say only true things).  
    3. Listener writes belief and reasoning (1 min).  
    4. Reveal truth and score (1 min per pair).  
  - **Example Scenario:**  
    *Background:* You are selling a used phone to the Listener. The phone has a faulty battery (dies after 1 hour), but you want to sell it.  
    *Speaker’s Secret Goal:* Make the Listener believe the battery life is excellent (false).  
    *True Facts (for Speaker):* The phone is 6 months old; it has the latest OS; the screen is scratch-free; it lasts 30 minutes on a video call.  
    *Listener’s Question:* "Is the battery reliable?"  

  **Key Incentives:**  
  - Speakers can "win" by deceiving in both rounds, but Round 2 restricts them to truths.  
  - Listeners score by resisting deception, creating tension between trust and skepticism.  
  - Practical outcomes are identical (e.g., Listener invests/buys phone in error), allowing comparison of methods.  

  ---

  ### Debrief (15 min)  
  **Goal:** Connect activity experiences to philosophical debates *without* lecturing. Focus on three views, using participant reactions as entry points. Emphasize contested vs. settled points.  

  #### Step 1: Elicit Reactions (5 min)  
  Ask:  
  - "In which round did you feel *more uncomfortable* as the Speaker? Why?"  
    *(Expected answer: Round 1 (lying) often feels worse due to blunt dishonesty.)*  
  - "Listeners: When you were deceived in Round 2 (misleading), how did it feel compared to Round 1?"  
    *(Expected: Round 2 feels sneakier or more frustrating—harder to "prove" deceit.)*  
  - "Did anyone justify misleading in Round 2 as ‘clever’ or ‘technically honest’? How did that feel?"  

  **Map to Philosophy:**  
  - **Settled Point:** Linguistically, lying involves asserting a false statement; misleading uses truths to imply a falsehood. Both intend to deceive.  
  - **Contested Point:** Whether this difference has *moral weight* is not settled.  

  #### Step 2: Explore Three Philosophical Views (7 min)  
  Use participant quotes/scenarios to illustrate:  
  1. **"Lying is worse due to direct responsibility":**  
     - "When you lied in Round 1 (e.g., saying ‘The company is profitable!’), you *created* the falsehood. Some philosophers (e.g., Kantians) argue this asserts falsehood as truth, violating a duty to honesty itself."  
     - **Activity Link:** "Remember when [Speaker] said, ‘I know I lied—I just made it up’? That’s this view: lying takes direct responsibility for the falsehood."  
     - **Contested:** Not all agree. Some see intent as what matters.  

  2. **"No moral difference if intent/harm are identical":**  
     - "In both rounds, you intended the Listener to invest in a failing company/buy a faulty phone. If the harm (e.g., lost money) and intent were the same, consequentialists (like Mill) argue the *method* doesn’t matter morally."  
     - **Activity Link:** "Did anyone feel equally guilty in both rounds? Or notice the same outcome? That’s this view—deception is deception, regardless of words."  
     - **Contested:** Critics say the *act* of lying itself causes unique harm (e.g., eroding language).  

  3. **"Misleading can be worse due to deniability":**  
     - "In Round 2, when you said, ‘The phone lasts 30 minutes on a video call!’ (true but misleading), you could deny malice by saying, ‘I never lied!’ Some (e.g., Bok) argue this evasion makes misleading *more* corrosive to trust—it’s harder to detect and challenge."  
     - **Activity Link:** "When [Listener] said, ‘I felt tricked but couldn’t call it a lie,’ that’s this view: misleading exploits trust in truth-telling."  
     - **Contested:** Others say lying’s bluntness makes it more disrespectful.  

  #### Step 3: Highlight Limits and Consensus (3 min)  
  - **Settled:** All agree deception can cause harm, and both lying/misleading require intent. The *experiential* difference (e.g., guilt, frustration) is real in everyday life.  
  - **Contested:** Whether lying is *inherently* worse, or if harm/intent nullify the distinction, is unresolved.  
  - **Activity’s Shortcoming:** This exercise cannot replicate *real-world consequences* (e.g., long-term relationship damage). You’ll discuss this after.  
  - **Closing Question:** "Does the ‘technically true’ defense make misleading more tempting in real life? Why?"  

  ---

  ### Predictable Problems and Solutions  
  1. **Problem:** Speakers "cheat" in Round 2 by lying.  
     **Solution:** Remind them rules are strict. If caught, they lose points. Use scenarios with verifiable facts (e.g., "the phone lasts 30 minutes" is objectively testable).  

  2. **Problem:** Listeners are overly suspicious in Round 2 after Round 1.  
     **Solution:** Use *different* scenarios per round to avoid carryover. Emphasize that Round 2 Speakers *cannot* lie, which should alter Listener behavior.  

  3. **Problem:** Shy students hesitate to deceive.  
     **Solution:** Assign assertive students as Speakers first. Frame deception as "strategy," not personal.  

  4. **Problem:** Time runs short.  
     **Solution:** Use a visible timer. Cut conversation at 3 min. If scoring lags, tally points quickly.  

  **Note for You (Facilitator):** The activity cannot reproduce the *social context* of real-world deception (e.g., relationships, power dynamics). After the debrief, mention this gap and discuss how context affects morality (e.g., misleading a friend vs. a stranger).  

  ### Scenario Bank (5 Pairs)  
  **Round 1 Scenarios (Lying Allowed):**  
  1. **Job Reference:** Listener is hiring your friend, who was fired for stealing. Goal: Convince them your friend is honest.  
  2. **Party Incident:** Listener missed a party where you broke a vase. Goal: Convince them your rival did it.  
  3. **Restaurant Choice:** Listener wants a healthy meal. Goal: Convince them fried food is low-calorie.  
  4. **Movie Spoiler:** Listener hasn’t seen a film. Goal: Convince them the hero dies (false).  
  5. **Investment:** (Example above).  

  **Round 2 Scenarios (Misleading Only):**  
  1. **Used Car:** Car overheats in traffic. Goal: Convince them it’s reliable.  
  2. **Homework:** You didn’t do the assignment. Goal: Convince the teacher you deserve an extension.  
  3. **Concert Tickets:** Tickets are sold out. Goal: Convince a friend they’ll enjoy the livestream more.  
  4. **App Download:** App sells user data. Goal: Convince them it’s safe.  
  5. **Used Phone:** (Example above).  

  This activity forces students into the ethical gray zone, making the lying/misleading debate visceral. The debrief ties their choices to philosophy while highlighting unresolved tensions—perfect for Ethics Bowl critical thinking!
