  Next, the precise differences. For emergentists, the colony's distributed system creates genuine emergent mental states. For skeptics, minds require biological brains with neurons. I should phrase each view as proponents would, using terms like "genuine mental states" for emergentists and "constitutive dependence on a nervous system" for skeptics.

