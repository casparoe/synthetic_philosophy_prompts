answer: |-
  We, the undersigned emergentists and skeptics in the Aunt Hillary debate, recognizing our prolonged discussion and desire for clarity, establish this joint statement through adversarial collaboration. We seek to define our common ground, pinpoint our precise differences, identify the crucial points of contention (cruxes), and propose concrete tests to resolve them. We commit to this shared framework to advance understanding beyond mere repetition.

  **Agreed Claims:** Both sides affirm the following: (1) Ant colonies exhibit remarkably complex, adaptive, and coherent collective behaviors arising solely from the local interactions of individual ants following relatively simple rules, mediated by signals like pheromones. (2) This collective activity constitutes a form of distributed information processing, solving problems (foraging, nest maintenance, defense) in ways that benefit the colony as a whole. (3) The colony possesses a functional organization that can be described *as if* it had goals, beliefs, and intentions (e.g., "the colony seeks food," "the colony believes this path is optimal"). (4) The colony itself lacks any centralized nervous system or brain-like organ; its "control" is entirely decentralized. (5) The colony is not conscious or sentient in a manner resembling vertebrate (let alone human) consciousness. (6) Hofstadter's Aunt Hillary is a powerful and illuminating thought experiment that forces consideration of the relationship between parts, wholes, and mind. (7) Describing the colony using mentalistic terms ("desires," "beliefs") can be pragmatically useful for prediction and explanation, regardless of one's stance on its literal truth. (8) The individual ant possesses a nervous system capable of basic sensory-motor integration but lacks the cognitive complexity necessary for the sophisticated colony-level behaviors observed.

  **Precise Point of Disagreement:** Our core divergence centers on the ontological status of colony-level mental states. The emergentist camp holds that the specific pattern of information flow, feedback loops, and functional integration achieved by the ant colony as a whole constitutes a genuinely emergent mind. This mind possesses non-metaphorical, albeit rudimentary and non-conscious, mental states like beliefs (encoded in pheromone distribution patterns and collective response dispositions) and desires (encoded in the colony's homeostatic setpoints and collective action tendencies). The colony itself is the minimal physical substrate realizing these mental properties. Conversely, the skeptic camp maintains that genuine mental states constitutively depend upon specific biological structures, namely integrated nervous systems. While acknowledging the colony's sophisticated, functional, adaptive behavior and the utility of intentional descriptions, skeptics argue this only reflects complex causal dynamics, not true mentality. For the skeptic, the colony has no beliefs or desires; it merely behaves *as if* it does. Mind, in any substantive sense, requires the kind of biological realization found in individual organisms with centralized nervous systems; the colony lacks this necessary substrate.

  **Cruxes and Test Cases:** We identify the following cruxes, the resolution of which would significantly shift the burden of proof or potentially alter one side's position. For each, we outline a mutually agreed-upon test case and our distinct predictions:

  1.  **Crux: Can integrated information (in a strong, theory-laden sense like IIT's Φ, or a functional equivalent implying intrinsic causal power) arise from a decentralized system lacking any neural tissue?** Test Case: Construct a large-scale robotic swarm explicitly designed to mimic key ant colony information processing features (pheromone-like signaling, stigmergy, decentralized task allocation). Rigorously apply a formal integration measure (like Φ, adapted for the swarm) to the *entire system* during complex problem-solving. *Emergentist Prediction:* The swarm will exhibit a significant level of integrated information (Φ > 0) at the collective level, exceeding the sum of the integration within individual robots and arising from the interaction network. *Skeptic Prediction:* While the system will demonstrate complex, adaptive behavior, formal measures will show minimal or zero *intrinsic* integrated information (Φ ≈ 0) at the collective level; any apparent integration will be traceable to the programmer's design and the robots' internal processing, not emergent from the interactions.

  2.  **Crux: Can genuinely *intentional* states (goal-directedness "from the system's own perspective," not merely ascribed by an observer) emerge from components lacking intentionality themselves?** Test Case: Develop a computational simulation of an abstract "ant colony" with extremely simple, non-intentional agents (e.g., cellular automata-like rules). Program it to exhibit sophisticated adaptive foraging and nest defense. Crucially, design the simulation so the colony demonstrably *alters its core goals* in response to persistent environmental failure (e.g., switching primary foraging target after repeated depletion, not just random exploration). *Emergentist Prediction:* The colony simulation will exhibit behavior best explained by attributing a genuine, emergent intentional state (a new "desire" for the alternative food source) that guides collective action in a coherent, flexible manner, irreducible to the rules of individual components. *Skeptic Prediction:* All behavior, including the apparent goal-switching, will be fully reducible to the pre-programmed rules governing the simple components and their interactions; no novel intentional state emerges at the colony level. The goal is strictly in the eye of the observer/modeler.

  3.  **Crux: Is a physically centralized control structure necessary for the kind of information integration required for minimal mentality?** Test Case: Intensively study naturally decentralized biological systems known for complex collective behavior but simpler than ant colonies (e.g., quorum sensing in bacterial biofilms, collective motion in starfish larvae groups, or Physarum polycephalum slime mold computation). Focus on identifying the presence or absence of any functionally centralized *information bottleneck* or unique locus of integration necessary for the behavior. *Emergentist Prediction:* These systems will demonstrate sophisticated collective computation and adaptation without relying on any physically distinct, centralized integrator; integration will be fully distributed across the components. *Skeptic Prediction:* While decentralized, such systems will either (a) reveal functionally critical quasi-centralized elements (e.g., specific cell clusters acting as hubs in biofilms) or (b) demonstrate integration levels fundamentally simpler and more mechanistic than those associated with even minimal mentality, supporting the necessity of a central integrator like a nervous system.

  4.  **Crux: Can there be evidence of a system-level subjective perspective (even minimally valenced, like aversion), distinct from component suffering, in a decentralized collective?** Test Case: Design experiments where ant colonies face novel, colony-level threats or negative stimuli (e.g., specific vibrational patterns correlated with predator presence, disruption of core nest architecture) and measure colony-wide responses beyond simple alarm/retreat. Specifically, look for persistent, colony-wide behavioral changes indicative of a learned aversion state ("fear") that alters future decision-making in diverse contexts, and test if temporarily anesthetizing *all* ants simultaneously (halting neural activity but preserving pheromones) erases this state upon revival. *Emergentist Prediction:* Colonies will exhibit complex, persistent aversion responses that reconfigure multiple colony functions, suggesting a system-level negative state. This "memory" may persist despite temporary suspension of component neural activity if the distributed chemical/physical state suffices. *Skeptic Prediction:* Responses will be limited to immediate alarm and direct defensive actions, decaying rapidly without the threat. Any persistent changes will be fully explained by altered individual ant behaviors (e.g., sensitization) or persistent chemical traces, not a system-level state. Anesthetizing ants will erase all "memory."

  5.  **Crux: Does the persistence of collective "mental" states across near-total component replacement imply a distinct ontological level?** Test Case: Simulate (or meticulously track in a controlled lab colony) the complete turnover of individual ants within a colony over time while maintaining constant environmental conditions and colony identity/structure. Precisely measure the stability of specific colony-level behavioral dispositions (e.g., preference for a specific foraging path, response threshold to threats) before, during, and after turnover. *Emergentist Prediction:* Colony-level behavioral dispositions will remain remarkably stable despite near-total replacement of individual ants, demonstrating the persistence of the system-level "mental" state independent of specific components. *Skeptic Prediction:* Significant drift or alteration in colony-level behavior will occur during and after mass turnover, demonstrating that the behavioral dispositions depend critically on the specific individuals present and their accumulated experiences/physiology; there is no truly stable, component-independent state.

  **Verbal Disagreement:** We acknowledge that some disagreement stems from differing uses of terms like "belief," "desire," and "mind." Emergentists employ these terms functionally, focusing on the causal role played by system states in guiding adaptive behavior, regardless of substrate. Skeptics reserve these terms for states realized in specific biological substrates (nervous systems). While this difference is significant, we agree it is not *purely* verbal – it reflects the deeper ontological disagreement about what constitutes realization. However, explicitly noting this linguistic difference helps prevent talking past each other; the emergentist's "belief" is the skeptic's "functional analog." The core disagreement lies in whether that functional analog deserves the label "mental state" in a literal, non-metaphorical sense.

  By committing to these shared agreements, clearly defining our divergence, and specifying these testable cruxes with advance predictions, we shift our collaboration from circular debate to a structured investigation aimed at resolving the genuine mysteries surrounding collective intelligence and the nature of mind. Our shared goal is to let empirical evidence and conceptual rigor, not rhetoric, determine the fate of Aunt Hillary.

  *(Signatures of Emergentist Proponents)*
  *(Signatures of Skeptic Proponents)*
