prompt: |-
  A bunch of us have been going back and forth about the Aunt Hillary thought experiment from Hofstadter — you know, whether an ant colony could literally have a mind, not just as a metaphor. We've got two camps: the colony-level emergentists who think the colony really does have mental states (beliefs, desires, maybe even a kind of phenomenology) that emerge from the ants' interactions, and the individual-level skeptics who think minds require centralized nervous systems and the colony is just a useful analogy at best. We've realized we've been talking past each other for months.

  I want you to draft the joint statement of an adversarial collaboration between these two camps. The document should have: (1) a numbered list of claims both sides can sign, stuff they actually agree on about ant colonies, information processing, and what minds require; (2) a precise statement of where they differ, with each side's view phrased how its own proponents would accept; (3) the cruxes — the subquestions that, if settled, would actually move at least one side; and (4) for each crux, a concrete empirical or conceptual test case both sides agree would bear on it, with each side's prediction written down in advance. If you think some of the disagreement is just verbal, say which part and why. Please write the whole thing in continuous prose only — no headings, no bullet points, no bold text, no tables, just plain paragraphs like you're writing a letter. And use American English.
