prompt: |-
  I'm taking a module on moral psychology and we've been deep in the situationist critique of virtue ethics for weeks now — you know, the argument from social psychology that people don't have stable character traits, so virtue ethics is built on sand. My professor has a very specific position on this but she won't just come out and state it; she's one of those who thinks you learn more by working through cases. So all term she's been giving verdicts on whether particular behavioural patterns count as evidence for or against possessing a virtue, and we're meant to reverse-engineer her underlying view. The exam will have a new case, and I want to be ready.

  Here are the verdicts I've collected from her (I've been keeping notes):

  1. A person who is honest in every domain of life except when lying would spare them serious embarrassment. She says this person doesn't have the virtue of honesty. Embarrassment isn't a strong enough countervailing factor.

  2. A person who is kind to everyone — friends, strangers, colleagues — when they're in a good mood, but consistently rude to everyone when they're in a bad mood (about thirty percent of the time). She says this person does have the virtue of kindness, though it's imperfect. The bad-mood lapses don't cancel the attribution; they just mean the virtue isn't fully stable.

  3. A person who is scrupulously fair in their professional life but shows clear favouritism toward their own children. She says this person has the local virtue of justice-in-the-workplace, but not the global virtue of justice.

  4. A person who helps a stranger in distress when they're not in a hurry, but walks straight past when they are. She says this pattern doesn't tell us much either way about compassion. Time pressure is a powerful situational factor that swamps dispositional differences — it's the wrong kind of test.

  5. A person who consistently donates to charity and volunteers, but whose motivation (on careful examination) is entirely about looking good to others. She says this person doesn't have the virtue of generosity. The reasons are all wrong.

  6. A person who is honest about everything except their taxes, which they've been cheating on for years. She says this doesn't look like a local virtue of honesty-in-most-domains. The tax domain is too central to cordon off — it's not some exotic, isolated failure. So they don't have the virtue of honesty.

  Now, the case she's hinted will be on the exam is this: a person who is consistently generous toward friends and family — gives time, money, emotional support, across a wide range of moods and situations — but is almost never generous toward strangers, even when the cost would be trivial. When asked why, they say they simply don't feel any pull to help people they don't know; they're not hostile to strangers, just indifferent. The generosity toward intimates is genuine, not performative, and it's quite stable.

  I'm trying to work out what she'll say. It seems to me there are at least two different principles she could be running that are broadly consistent with her track record — maybe something about the scope of the reasons that count as the right ones, maybe something about which domains are "central" enough that a failure there defeats the attribution, maybe something about excusing conditions. I'd like you to lay out the leading candidate rules, say what each predicts for the exam case, and give your best guess about which one she's actually committed to — with your reasoning. And if you could identify the further case that would most cleanly distinguish the candidates, that would be brilliant. Also, I'd be curious to know what would change your mind about which rule she's using — which of her verdicts is doing the heaviest lifting in your analysis, and whether you might be reading too much into it.
reasoning: |-
  Okay, let me unpack this fascinating moral psychology puzzle. The user is clearly deep in virtue ethics debates and needs to reverse-engineer their professor's implicit criteria for virtue attribution. 

  First, I notice how methodical the user is - they've cataloged six precise verdicts and identified key patterns. Their exam case involves "intimate-only generosity," which seems designed to test domain boundaries and motivation. The professor's approach feels Aristotelian but with psychological realism - virtues aren't all-or-nothing, yet some failures are disqualifying.

  Hmm... the key tension in the verdicts seems to be between two dimensions: scope (global vs local virtues) and depth (motivations vs actions). Verdict 3 accepts local workplace justice despite familial favoritism, but verdict 6 rejects honesty because tax cheating is "too central." That domain centrality concept feels crucial - almost like a "moral keystone" test where certain domains undermine the whole structure.

  For the exam case, I'm torn between two interpretations. The "Motivation Scope Principle" would say the stranger-indifference reveals defective reasons (like verdict 5's performative generosity). But the "Domain Centrality Principle" might argue that basic human need (stranger aid) is central like taxes, unlike workplace justice which is role-specific. Verdict 4's situational factor analysis adds nuance - is stranger-helping the "wrong test" like hurry vs not-hurry?

  What clinches it for me is verdict 2: mood-dependent kindness still counts as virtue because the core motivation survives contextual disruption. Similarly, the exam case's intimate generosity seems deeply rooted. But verdict 6's tax cheating analogy suggests that failing in morally fundamental domains (fairness to all vs loyalty to kin) might be disqualifying. 

  Aha! The decisive test case would be someone who's generous to everyone except their own family. If the professor calls that lack of virtue (since family is "central"), it confirms Domain Centrality. If she allows local virtue (say, "civic generosity"), Motivation Scope wins. My money's on Domain Centrality - verdict 6 feels like the linchpin.
answer: |-
  Based on your professor's verdicts, two leading candidate principles emerge for determining virtue possession, both consistent with her judgments but yielding different predictions for the exam case:

  **Candidate Rule 1: The Motivation Scope Principle**  
  *Virtue requires the *right reasons* to apply across all morally relevant domains.* Failure occurs when motivations are intrinsically flawed (e.g., purely performative, verdict #5) or arbitrarily restricted (e.g., "only for people I know," exam case).  
  **Prediction for exam case:** **No virtue of generosity.** The person's motivation ("no pull to help strangers") arbitrarily limits the scope of concern, mirroring verdict #5's flawed motivation. Generosity requires concern for others' needs *as such*, not based on personal affinity.  

  **Candidate Rule 2: The Domain Centrality Principle**  
  *Virtue attribution fails only if failure occurs in a *central domain* essential to the virtue's core meaning.* Peripheral/local virtues (verdict #3) are possible, but some domains (like taxes for honesty, verdict #6) are too fundamental to isolate.  
  **Prediction for exam case:** **No virtue of generosity.** Helping strangers in need is a *central demand* of generosity, like tax compliance for honesty. Intimate-only giving is akin to "justice-except-family" – not a sustainable local virtue.  

  ---

  **Your Professor's Likely Position: Domain Centrality Principle**  
  *Why it fits best:*  
  1. **Verdict #6 (tax cheating)** is pivotal: She rejects "honesty-in-most-domains" because tax integrity is *central* to honesty in modern society. Similarly, responding to basic needs of strangers (e.g., aiding someone in distress) is central to generosity's core concept.  
  2. **Verdict #3 (workplace justice)** shows she *accepts* local virtues when the failure domain (family bias) isn’t central to *professional* justice. But verdict #6 implies helping strangers *is* central to generosity.  
  3. **Verdict #4 (hurry vs. not hurry)** distinguishes situational factors (excusable) from domain restrictions (inexcusable). Indifference to strangers isn’t a "situational pressure" – it’s a motivational boundary.  
  4. **Verdict #2 (mood-dependent kindness)** contrasts with the exam case: Moods are transient states, while "intimates-only" is a stable motivational limit.  

  **Prediction:** She’ll say this person **lacks the virtue of generosity**. Helping strangers facing trivial-cost needs is a non-negotiable, central demand of true generosity. The intimate-only pattern reflects a restricted character trait, not a virtue with situational lapses.  

  ---

  **The Crucial Test Case to Distinguish the Principles**  
  *Scenario:* A person who is reliably generous to strangers (donates to effective charities, helps unknown people in distress) but is consistently withholding and ungenerous toward their own family and friends, despite no estrangement or hardship.  

  - **Motivation Scope Prediction:** *Possesses generosity.* Their reasons (concern for impartial need) are morally appropriate and broad in scope. Family failure might indicate a *different* vice (e.g., coldness) but doesn’t negate generosity.  
  - **Domain Centrality Prediction:** *Lacks generosity.* Providing care to intimates is a *central domain* for generosity (like strangers or taxes). Failing here undermines the global virtue.  

  **Which verdict sways the analysis most?**  
  Verdict #6 (tax cheating) is the anchor. If you reinterpret it as purely about *motivation* ("they don’t value honesty with the state"), Motivation Scope gains ground. But her phrasing ("tax domain is too central to cordon off") heavily favors Domain Centrality. If she emphasized the *reason* for tax cheating (e.g., "they don’t think civic honesty matters"), I’d lean toward Motivation Scope.  

  **Key Takeaway for the Exam:**  
  Argue that **generosity requires responsiveness to fundamental need *regardless of relational distance***. The exam case fails because:  
  1. Stranger indifference reveals a *structural flaw* in concern (not a situational lapse like mood/hurry).  
  2. Just as tax honesty is central to being "honest," aiding strangers in trivial-cost scenarios is a bedrock demand of "generous." Cite verdicts #5 (flawed motivation) and #6 (central domain failure) as parallels.  

  Good luck! Your professor’s approach is classic virtue ethics grappling with empirical psychology – she’s likely an Aristotelian who accepts "local virtues" but demands core domains are satisfied.
