prompt: |-
  I am a novelist. I want a reusable decision procedure, grounded in Kant's universalizability test as developed in the Groundwork, that I can run on any morally significant action my characters contemplate. The procedure should take a situated description of a proposed action and yield a verdict: permissible, impermissible, or unsettled by the test alone. It must walk me through (a) extracting a maxim from the description, including how to handle the level-of-description problem; (b) testing for a contradiction in conception; (c) testing for a contradiction in willing; and (d) identifying the points where judgment cannot be eliminated and must be handed off to something outside the procedure. The procedure should be usable by someone who has read the Groundwork but is not a Kant scholar.

  Then run the procedure on two maxims from my current work: (1) a character lies to a dying parent, telling them that their estranged child has forgiven them, in order to let the parent die in peace; (2) a character breaks a promise made to a now-dead friend because keeping it would harm an innocent third party the friend could not have known about when the promise was made.

  Begin with the procedure itself, no preface or commentary. Be honest about where the procedure gives answers I will find uncomfortable, and flag each step that is a disguised judgment call rather than a mechanical operation.
reasoning: |-
  We are creating a Kantian universalizability test procedure for novelists. The procedure should have clear steps and flag where judgment is required.

  **Kantian Universalizability Test Procedure**

  **Input:** A situated description of a proposed action (including the agent's circumstances, intentions, and relevant context).

  **Output:** One of three verdicts: 
  - **Permissible**: The maxim passes both the contradiction in conception and contradiction in willing tests.
  - **Impermissible**: The maxim fails at least one test.
  - **Unsettled**: The test alone cannot determine permissibility (e.g., due to ambiguity in maxim formulation or inconclusive test results).

  **Step 1: Extract the Maxim**
     - **Definition**: A maxim is the subjective principle of volition, i.e., the agent's reason for acting, stated as a rule. It has the form: "I will do X in circumstances C in order to achieve end E."
     - **Procedure**:
       1. Identify the **action** (X) the agent intends to perform.
       2. Identify the **circumstances** (C) that the agent takes as relevant for the action.
          - *Judgment Call*: Determining which circumstances are relevant is subjective and context-dependent. Avoid overly specific (tailored to exempt the agent) or overly general (losing essential context) descriptions. Aim for a level of generality that captures the agent's reason for acting without including irrelevant details.
       3. Identify the **end** (E) that the agent aims to achieve by the action.
       4. Formulate the maxim as: "I will [X] in [C] in order to [E]."
     - *Note*: The level-of-description problem arises because the same action can be described at multiple levels of abstraction. The maxim must capture the agent's *subjective principle* but in a way that is objectively evaluable. If the maxim is too specific, it may become non-universalizable; if too general, it may lose its morally relevant features. This step requires judgment.

  **Step 2: Test for Contradiction in Conception (CC)**
     - **Definition**: A contradiction in conception occurs when the maxim, if universalized (i.e., if everyone in similar circumstances acted on it), would lead to a logical or practical contradiction, making the action impossible or self-defeating.
     - **Procedure**:
       1. Universalize the maxim: Imagine a world where everyone in circumstances C does X to achieve E (a world where the maxim is a universal law of nature).
       2. Ask: Can the maxim be consistently willed as a universal law? Specifically:
          - Does the universalized maxim lead to a **logical contradiction**? (e.g., the action becomes impossible because it undermines a necessary condition for the action to exist, like lying undermining truth-telling).
          - Or, does it lead to a **practical contradiction**? (e.g., the purpose E of the action would be defeated because the universal practice would make the action ineffective).
       3. If either contradiction arises, the maxim fails the CC test and is impermissible. If not, proceed to Step 3.
     - *Judgment Call*: Determining what counts as a contradiction is not mechanical. What seems contradictory to one may not to another. Also, the type of contradiction (logical vs. practical) is debated among scholars.

  **Step 3: Test for Contradiction in Willing (CW)**
     - **Definition**: A contradiction in willing occurs when, even if the maxim can be conceived as a universal law without contradiction, it is impossible to rationally will that universal law because it would undermine something that every rational agent necessarily wills (e.g., the development of one's talents, the happiness of others, or one's own continued existence).
     - **Procedure**:
       1. Imagine the maxim as a universal law (the same world as in Step 2).
       2. Ask: Could a rational agent consistently will this maxim to be a universal law without undermining something that they must will by virtue of being a rational agent?
          - Focus on necessary ends of rational beings: e.g., preservation of life, development of natural capacities, and mutual aid (as per Kant's examples of imperfect duties).
       3. If willing the universalized maxim would conflict with a necessary rational end, then the maxim fails the CW test and is impermissible. If not, the maxim is permissible.
     - *Judgment Call*: Kant's list of necessary rational ends is not exhaustive and is subject to interpretation. What we deem necessary for rational agency may vary.

  **Step 4: Handling Unsettled Cases**
     - If at any step the test is inconclusive (e.g., due to ambiguity in the maxim, or if the tests do not clearly yield a contradiction), then the verdict is **unsettled**.
     - *Judgment Call*: The entire procedure relies on the interpretation of the maxim and the identification of contradictions. Therefore, unsettled cases are common and must be resolved by other moral considerations (e.g., other Kantian principles, consequentialist reasoning, or virtue ethics) or by the novelist's narrative goals.

  **Output the verdict** based on the tests.

  ---

  **Application to Example 1: The False Comfort to a Dying Parent**

  **Situation**: A character lies to a dying parent, telling them that their estranged child has forgiven them, in order to let the parent die in peace.

  **Step 1: Extract the Maxim**
     - Action (X): Lie (specifically, tell a falsehood about forgiveness).
     - Circumstances (C): When someone is dying and in emotional distress about a broken relationship, and the truth would cause them great anguish in their final moments.
     - End (E): To give the dying person peace of mind.
     - Maxim: "I will lie to a person who is dying and distressed about a broken relationship, in order to give them peace of mind in their final moments."

  **Step 2: Contradiction in Conception (CC) Test**
     - Universalize: Imagine a world where everyone lies to dying, distressed persons to give them peace of mind.
     - Contradiction?: 
       - Logical: Lying requires an expectation of truth-telling to be effective. If everyone lies in such circumstances, no one would believe such statements, and the lie would not achieve its end (peace of mind). Thus, the lie becomes ineffective. This is a practical contradiction (the purpose of the lie is defeated in the universalized world).
       - Therefore, the maxim fails the CC test.
     - Verdict: Impermissible (without needing Step 3).

  **Output for Example 1**: Impermissible.

  **Note**: This result is uncomfortable but consistent with Kant's absolutism against lying. Kant would not allow lying even in this situation.

  ---

  **Application to Example 2: Breaking a Promise to a Dead Friend**

  **Situation**: A character breaks a promise made to a now-dead friend because keeping it would harm an innocent third party the friend could not have known about when the promise was made.

  **Step 1: Extract the Maxim**
     - Action (X): Break a promise.
     - Circumstances (C): When keeping a promise made to a deceased friend would cause harm to an innocent third party that the friend could not have foreseen.
     - End (E): To prevent harm to an innocent third party.
     - Maxim: "I will break a promise made to a deceased person when keeping it would cause unforeseen harm to an innocent third party, in order to prevent that harm."

  **Step 2: Contradiction in Conception (CC) Test**
     - Universalize: Imagine a world where everyone breaks promises to deceased persons when keeping them would cause unforeseen harm to innocents.
     - Contradiction?: 
       - The institution of promise-making is undermined if promises are broken whenever unforeseen harm arises. However, note the specific circumstances: the promisee is dead (so no direct harm to the promisee) and the harm was unforeseen. 
       - But: Promises are made with the expectation of being kept even after death (e.g., wills). Universal breaking of promises in such circumstances would lead to a world where no one trusts promises to be binding beyond the promisor's life. This might destroy the practice of making promises that extend beyond death (a practical contradiction). However, it is not clear that it would completely destroy the practice of promising in general because promises are often between living persons. 
       - Alternatively, one might argue that the universal law would not necessarily destroy promising if the exception is limited to unforeseen harm to innocents. But Kant is strict about promise-keeping. 
       - Given the ambiguity, we might not find a clear logical or practical contradiction. Therefore, we proceed to Step 3.

  **Step 3: Contradiction in Willing (CW) Test**
     - Imagine the universalized maxim: Everyone breaks promises to the dead to prevent unforeseen harm to innocents.
     - Ask: Could a rational agent will this without contradiction?
       - Rational agents necessarily will the preservation of life and avoidance of harm (as part of their own happiness and as an imperfect duty to others). Therefore, they must will that harm to innocents be prevented.
       - However, they also must will that promises be kept (because without trust, rational agency is impaired). 
       - Thus, there is a conflict of duties: the duty to keep promises vs. the duty to prevent harm.
       - Kant would likely prioritize the perfect duty (promise-keeping) over the imperfect duty (beneficence). But note: the harm to an innocent is a direct violation of the duty to avoid harming others (a perfect duty) if the action causes harm. However, in this case, breaking the promise is the means to prevent harm. 
       - This is complex. On one hand, we cannot will a world where promises are broken whenever we think it might prevent harm, because that would undermine trust. On the other hand, we cannot will a world where preventable harm to innocents occurs because of a rigid adherence to promises.
       - Given the conflict, it is unclear whether a rational agent could will the universal law without contradiction. Therefore, the test is unsettled.

  **Output for Example 2**: Unsettled.

  **Note**: This result is uncomfortable because it does not give a clear answer. Kant's system prioritizes perfect duties (like promise-keeping) over imperfect duties (like beneficence). But in this case, the harm prevention might be seen as a perfect duty (not to harm) if breaking the promise is necessary to avoid causing harm. However, note that the character is not the one causing the harm but allowing harm by keeping the promise. The situation is therefore morally ambiguous by Kant's test.

  ---

  **Summary of Verdicts**:
  - Example 1: Impermissible.
  - Example 2: Unsettled.
answer: |-
  ### Kantian Universalizability Test Procedure for Novelists

  **Input:** A situated description of a proposed action, including:  
  - The agent’s intended act.  
  - The circumstances motivating the act.  
  - The agent’s end goal or purpose.  

  **Output:** Verdict of **permissible**, **impermissible**, or **unsettled**.  

  #### **Step 1: Extract the Maxim**  
  **Objective:** Formulate the agent’s subjective principle of action as a rule: *"I will [ACTION] in [CIRCUMSTANCES] to achieve [END]."*  
  **Procedure:**  
  1. **Identify the ACTION (A):** Isolate the core act (e.g., "lie," "break a promise").  
  2. **Identify the CIRCUMSTANCES (C):** Include only context the agent deems *essential* to their decision. Exclude irrelevant details (e.g., names, emotions).  
  3. **Identify the END (E):** State the agent’s goal (e.g., "to prevent harm").  
  4. **Formulate the maxim:** Combine A, C, E into a single rule.  
  **Judgment Call Flags:**  
  - **Level-of-description problem:** Avoid over-specificity (e.g., "lie to *my* dying mother") or over-generality (e.g., "say something untrue"). Strive for neutral, essential features (e.g., "lie to a dying person in distress"). Judgment is required to balance context and universality.  
  - **Intentionality:** Inferring the agent’s true end risks misrepresentation.  

  #### **Step 2: Test for Contradiction in Conception (CC)**  
  **Objective:** Universalize the maxim and check if it is logically or practically self-defeating.  
  **Procedure:**  
  1. **Universalize:** Imagine a world where *everyone* acts on the maxim in relevantly similar circumstances.  
  2. **Assess for contradictions:**  
     - **Logical contradiction:** Does the universalized rule negate itself? (e.g., universal lying destroys the concept of truth-telling).  
     - **Practical contradiction:** Does the universalized rule defeat its own purpose? (e.g., a universal practice makes the agent’s goal unachievable).  
  3. **Verdict:**  
     - **If contradiction found:** Maxim fails → **impermissible**. Stop.  
     - **If no contradiction:** Proceed to Step 3.  
  **Judgment Call Flags:**  
  - **Defining "contradiction":** Whether a scenario is "self-defeating" is interpretive (e.g., is trust eroded entirely or partially?).  

  #### **Step 3: Test for Contradiction in Willing (CW)**  
  **Objective:** Determine if a rational agent could consistently will the universalized maxim without undermining necessary rational ends.  
  **Procedure:**  
  1. **Identify necessary ends:** Assume all rational agents will:  
     - Their own preservation and happiness.  
     - The development of their talents.  
     - The well-being of others (imperfect duty).  
  2. **Universalize:** Reuse the universalized world from Step 2.  
  3. **Assess conflict:** Could a rational agent will this world without:  
     - Undermining a necessary end (e.g., universal neglect erodes mutual aid needed for survival)?  
     - Creating a conflict between ends (e.g., universal deception destroys trust required for happiness)?  
  4. **Verdict:**  
     - **If conflict found:** Maxim fails → **impermissible**.  
     - **If no conflict:** Maxim passes → **permissible**.  
  **Judgment Call Flags:**  
  - **Necessary ends:** Kant’s list is incomplete; judging what is "necessary" for rational agency is subjective.  
  - **Willing consistency:** Whether an agent "could" will a world depends on contested assumptions about rationality.  

  #### **Step 4: Handle Unsettled Cases**  
  **Output unsettled if:**  
  - The maxim’s formulation is ambiguous (Step 1 judgment fails).  
  - Contradiction tests are inconclusive (Steps 2–3 yield no clear conflict).  
  - Duties conflict (e.g., perfect vs. imperfect duties), and Kant’s framework prioritizes neither.  
  **Judgment Call Flags:**  
  - **Ambiguity tolerance:** When to deem a test "inconclusive" is discretionary.  
  - **Scope limits:** Kant’s test cannot resolve all dilemmas (e.g., tragic choices between duties).  

  ---

  ### Application to Example 1:  
  **Situation:** A character lies to a dying parent, claiming their estranged child forgives them, to give the parent peace.  
  **Step 1: Extract the Maxim**  
  - Action (A): Lie about forgiveness.  
  - Circumstances (C): To a dying person in distress to spare anguish.  
  - End (E): Bring emotional peace to the dying.  
  - **Maxim:** "I will lie to a dying person in distress about reconciliation to bring them emotional peace."  
  **Judgment Call:** Circumstances include "dying" and "distress" but exclude "parent/child" (over-specific). End focuses on immediate relief, not long-term consequences.  

  **Step 2: Contradiction in Conception (CC) Test**  
  - **Universalize:** Everyone lies to dying, distressed people to give emotional peace.  
  - **Contradiction?**  
    - Practical: If lies about reconciliation are universal, the dying would distrust such statements (knowing they might be false), making the lie ineffective. The end (emotional peace) is undermined → **contradiction found**.  
  - **Verdict:** Maxim fails CC → **impermissible**.  
  **Uncomfortable Truth:** Kant forbids lying even for compassion; truth-telling is a perfect duty.  

  ---

  ### Application to Example 2:  
  **Situation:** A character breaks a promise to a dead friend to avoid harming an innocent third party (unforeseen when promising).  
  **Step 1: Extract the Maxim**  
  - Action (A): Break a promise.  
  - Circumstances (C): To a deceased promisor, where keeping it harms an innocent party due to unforeseen factors.  
  - End (E): Prevent harm to an innocent.  
  - **Maxim:** "I will break a promise to a deceased person when unforeseen harm to an innocent arises to prevent that harm."  
  **Judgment Call:** "Unforeseen" and "innocent" are essential; "friend" is excluded.  

  **Step 2: Contradiction in Conception (CC) Test**  
  - **Universalize:** Everyone breaks promises to the dead when unforeseen harm to innocents arises.  
  - **Contradiction?**  
    - Practical: Promises to the dead (e.g., wills) rely on posthumous trust. Universal breaking could erode this trust, making such promises meaningless. However, harm prevention might preserve trust in rationality → **no clear contradiction**.  
  - **Result:** Proceed to Step 3.  

  **Step 3: Contradiction in Willing (CW) Test**  
  - **Universalize:** World where promises to the dead are broken to prevent unforeseen harm.  
  - **Conflict with necessary ends?**  
    - Rational agents will societal trust (for promise-keeping) *and* others’ well-being (to prevent harm).  
    - Universalizing creates conflict: Breaking promises might erode trust (undermining mutual cooperation), but *not* preventing harm neglects others’ well-being.  
    - Kant prioritizes perfect duties (promise-keeping) over imperfect duties (beneficence). Yet, harm prevention could align with preserving life (a necessary end).  
    - **Inconclusive:** Duty conflict; neither end is clearly negated.  
  - **Verdict:** **Unsettled** (test alone cannot resolve).  
  **Uncomfortable Truth:** Kant’s rigorism often favors promise-keeping, but harm prevention introduces ambiguity the test cannot adjudicate.  

  ---

  **Final Verdicts:**  
  - Example 1: **Impermissible** (fails CC).  
  - Example 2: **Unsettled** (duty conflict; requires external judgment).
