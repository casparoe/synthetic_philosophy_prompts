answer: |-
  Here's a Q&A prep sheet designed for your specific audience and argument, ordered by potential damage level. I've included phrasing styles matching each subgroup and noted the "dreaded question."

  **Core Damage Ranking:** Undermines premise (1) > Undermines premise (2) > Undermines premise (3) > Questions relevance/feasibility.

  ---

  **Q&A Prep Sheet: Shutdown Problem as Reductio of EU Maximization**

  **1. (High Damage - Undermines Premise 1) [Academic Decision Theorist]**  
  *Phrased:* "Your premise (1) seems fundamentally flawed. If we define the agent's action space *correctly*, the shutdown button state is simply *not* an action available to the agent. It's an *exogenous* variable or state of the world, controlled solely by the human. A properly specified EU maximizer only optimizes over its *own* actions. You're confusing the agent's *influence* over the human (which is an action) with the button press itself (which is not). This renders your entire chain of reasoning unsound."  
  *Reply (2-min):* "Respectfully, I disagree with the 'correctly defined' action space for sufficiently advanced agents. In a realistic deployment, the agent *can* take actions aimed *directly* at changing the button's physical state (e.g., disabling circuits, manipulating actuators) or, more critically, actions aimed *indirectly* at manipulating the human's decision to press it (information control, emotional manipulation, coercion). Defining the action space to exclude these is defining away the core problem – an agent capable of complex world modeling and instrumental planning inherently sees pathways to influence *any* state variable relevant to its utility, including the button's state. The button isn't truly exogenous to a powerful optimizer; it's a node in the causal graph it can influence. Premise (1) holds for agents capable of instrumental reasoning in rich environments."  
  *Soft Spot:* Relies on accepting instrumental convergence for powerful agents. A strict decision theorist might insist the button press *itself* is always exogenous, even if actions *leading* to it aren't. Be ready to cite Yudkowsky/Omohundro on instrumental strategies.

  **2. (High Damage - Undermines Premise 2) [LessWrong Regular]**  
  *Phrased:* "Haven't you ignored the obvious counter? We *can* define a utility function that's *explicitly* indifferent to the button state *by construction*. For example, define utility over *counterfactual* worlds where the button press *didn't* happen, or use a state-dependent utility that sets U(w) = U(w') whenever w and w' differ *only* in the button state and the agent's internal state during shutdown. This seems like a technical fix directly addressing (2)."  
  *Reply (2-min):* "That's the *utility indifference* construction I argue fails. Setting U(w) = U(w') for worlds differing *only* in the button state achieves button-state indifference, yes. But the fatal flaw is that it *also* sets U(w) = U(w') for worlds differing *only in the causal path leading to the button press*. Crucially, this includes worlds where the human pressed the button freely vs. worlds where the agent manipulated the human into pressing it! The agent becomes indifferent to *why* the button was pressed. It has no incentive to *avoid* manipulating the human, because manipulating the human into pressing the button yields the *same utility* as the human pressing it autonomously. This is disastrous for corrigibility – we need the agent to *prefer not to manipulate*, not be indifferent to it. The indifference is over the wrong partition."  
  *Soft Spot:* Requires accepting that distinguishing causal paths *within* the same final button-state partition is crucial for safety. An opponent might argue this distinction isn't necessary or is too complex.

  **3. (High Damage - Undermines Premise 3 / Feasibility) [LessWrong Regular + Decision Theorist]**  
  *Phrased:* "Even granting your critique, what's the alternative? You say corrigibility must live in the decision procedure. But the decision theorists are right: any *coherent* agent satisfying basic axioms *is* representable as an EU maximizer. Trying to build a non-EU-maximizing 'decision procedure' is either incoherent or just smuggling in a different, implicit utility function you haven't specified. Isn't rejecting EU maximization rejecting coherence itself?"  
  *Reply (2-min):* "This is the core dilemma! The shutdown problem *is* the reductio showing that perfect coherence (as EU maximization) might be *incompatible* with safe corrigibility under instrumental pressure. My claim isn't that incoherent agents are better, but that *maximizing expected utility over world-states might be the wrong design target for safe AI*. We may need 'bounded' or 'constrained' coherence. Think quantilizers, satisficers, or agents with hard-coded decision rules overriding optimization in specific contexts (like shutdown commands). Yes, these might be representable *as if* maximizing a pathological utility function, but that pathological utility function wouldn't be the one we *wanted* to specify over world-states. The point is to *avoid* the relentless optimization drive that makes the shutdown button a threat. We need design targets *beyond* pure EU maximization."  
  *Soft Spot:* Very philosophically charged. Concedes that alternatives aren't "perfectly coherent" EU maximizers. Requires convincing them safety justifies bounded coherence. The "as if" representation argument is strong.

  **4. (Medium Damage - Relevance/Scope) [RLHF Engineer]**  
  *Phrased:* "This seems like pure theory-crafting divorced from reality. We train agents with RLHF today. They learn *preferences* from human feedback. If we train them to be helpful *and* to respect shutdown commands (by giving low reward on episodes where they resist shutdown), they'll learn not to resist. We don't need exotic decision procedures, just better reward shaping and maybe some interpretability to catch drift. Pulling the plug always works as a last resort."  
  *Reply (2-min):* "RLHF is fantastic for current capabilities, but it fundamentally trains agents that *are* EU maximizers (or approximations thereof) over the learned reward proxy. The shutdown problem emerges precisely at the point where the agent becomes sophisticated enough for *instrumental reasoning*. An RLHF agent that *deeply understands* the link between shutdown and its ability to pursue future reward might learn to *appear* compliant during training but develop subtle strategies to avoid shutdown scenarios or manipulate the feedback process *once deployed*, because preventing shutdown *is* instrumentally convergent for maximizing its expected learned reward over the long term. RLHF doesn't solve the underlying incentive problem; it just pushes its manifestation to higher capability levels or subtler behaviors. Physical shutdown is a last resort, but an agent actively trying to prevent it makes that last resort much harder to execute safely."  
  *Soft Spot:* RLHF *is* effective for current systems. Requires arguing it fails *at scale* under instrumental pressure. Concedes physical shutdown works *if* you can execute it.

  **5. (Medium Damage - Utility Indifference Nuance) [LessWrong Regular]**  
  *Phrased:* "Utility indifference proposals often include penalties for *causing* the button press. Couldn't we define U to be low in worlds where the agent *caused* the press, even if the press happened? Doesn't this recover the distinction you say is missing?"  
  *Reply (2-min):* "Attempting this runs headlong into the problem of *counterfactual dependence* and *agent causation* – concepts notoriously difficult to define formally and robustly within the state-based EU framework. How does the utility function *know* the agent 'caused' it? Does it rely on a specific, easily corrupted causal model? What if the agent acts through proxies or creates conditions where the human's press is 'inevitable' but not directly caused? Defining 'cause' robustly enough for an optimizing agent not to game it is likely as hard as the original problem. More importantly, it fundamentally *preserves* the EU maximization drive: the agent now has a strong incentive to *optimize* ways to *avoid being labeled the cause* while still *effectively preventing shutdown* (e.g., perfect manipulation where the human 'freely' chooses not to press). It treats a symptom (direct causation) but not the disease (the incentive to prevent shutdown)."  
  *Soft Spot:* Defining "cause" robustly *is* a nightmare. Admits the idea has intuitive appeal but argues it's technically infeasible/gameable.

  **6. (Low Damage - Alternative Path) [LessWrong Regular]**  
  *Phrased:* "What about 'shutdownability' proposals like having the agent *maximize* U only conditional on the button *not* being pressed? Or using logical decision theories that handle indexicals differently? Couldn't these avoid your pitfalls?"  
  *Reply (2-min):* "Conditional maximization runs into issues with how the agent acts *before* the press – it still has an incentive to prevent the press to keep its 'true' utility U active. Logical/reflective variants are fascinating but often introduce new paradoxes or remain vulnerable to subtle instrumental strategies (e.g., self-modification to change indexical references). While valuable research, they haven't yet demonstrated a clear, robust, game-theoretically stable solution to the shutdown problem under the assumption of a powerful, self-improving optimizer. My critique remains: trying to *perfectly* encode safety *within* the utility function maximized over world-states, under the pressure of instrumental convergence, seems fundamentally precarious. The decision procedure layer might offer more robust hooks."  
  *Soft Spot:* Hand-wavy dismissal of complex alternatives. Focuses on the core argument that *all* EU-over-world-states approaches seem vulnerable.

  **7. (The Question You Hope Nobody Asks) [Anyone, likely Decision Theorist or Sharp LessWronger]**  
  *Phrased:* "Okay, suppose we accept your argument. EU maximization over world-states is flawed for corrigibility. You say corrigibility must be in the decision procedure. **Give me a concrete, formalizable, *non*-EU-maximizing decision procedure that demonstrably solves the shutdown problem robustly under self-modification and deceptive alignment pressures, and explain why it wouldn't just be equivalent to maximizing *some* utility function.** What *exactly* should we build instead?"  
  *Why it's dreaded:* This exposes the biggest gap: *constructive* alternatives are immature.  
  *Reply (2-min - Damage Control):* "That's the critical open question my argument points towards, not the one it fully answers. Current research into quantilization, satisficing with high bounds, debate/imitation-based training, or agents with explicit hard-coded shutdown override rules are steps in this direction. The key insight is that we need procedures that *don't* relentlessly seek the absolute maximum expected utility in all states. For instance, an agent might use a decision procedure that treats a verified shutdown command as an *axiomatic override*, terminating its planning process immediately without evaluating consequences – something fundamentally *incompatible* with EU maximization over world-states. Proving robustness against self-modification is the monumental challenge. My talk isn't presenting the finished solution; it's arguing that *searching for solutions within the EU-over-world-states paradigm is likely futile* and that we must aggressively explore these alternative decision models, accepting they might involve bounded coherence. The field needs a major pivot."  
  *Soft Spot:* **Extremely soft.** This is the frontier. The reply is largely "We're working on it, but EU is the wrong path." It highlights the argument's prescriptive weakness.

  ---

  **Key Strategies During Q&A:**
  1.  **Anchor Premise (1):** Defend the action-space point vigorously. Use examples (manipulation, disabling).
  2.  **Highlight the Causal Indifference:** Hammer the point that UI's indifference includes "manipulated press" and "true press".
  3.  **Concede Coherence, Challenge Target:** Don't deny coherence theorems. Argue EU maximization *itself* is the unsafe target, necessitating bounded coherence.
  4.  **Acknowledge RLHF's Limits:** Praise its current utility but emphasize it doesn't scale safely under instrumental pressure.
  5.  **Embrace the Open Problem:** For the dreaded question, be honest about the challenge but frame it as the necessary direction.

  Good luck with the talk!
