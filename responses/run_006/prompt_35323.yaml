prompt: |-
  so ive been trying to teach myself bayes rule and theres this one thing i cant get past. if you already know some fact, then the probability you give it is 1. so when it shows up as evidence, the update term P(E|H)/P(E) is just 1/1, and your belief in the theory doesnt move at all. ok fine. but the part that really bugs me is that the usual fallback also fails. people say, instead of updating, just compare how much more likely the fact is under the theory than under the opposite theory. but if the fact is already certain for you, then its also certain under any theory you take seriously, so that comparison comes out tied too. it looks like the only way to make an old fact count as support is to pretend you didnt already know it, and ask what it would have done to your beliefs back when it was new. that feels like cheating, but maybe cheating is the right answer?

  anyway ive been trying to collect the different moves people make here. one move is to say the thing you actually learn isnt the old fact, its the logical connection between the theory and the fact. another is to just bite the bullet and use the pretend-you-didnt-know-it numbers, and say that counts as real support. another is to say old facts dont actually confirm anything, we just like explanations and get confused. another is to say the mistake is treating knowing the fact as probability exactly 1, since real people are never that sure. ive probably missed some.

  what i want is a ranking of the main ways out of this, from the one that best saves the intuition that an old fact can support a new theory, down to the one that basically gives up on it. for each one, a sentence or two on where it still leaks or what it has to fudge. i care more about whether it actually handles the pretend-you-didnt-know-it problem than about what the fix is called.
