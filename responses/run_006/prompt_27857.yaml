prompt: |-
  Act as a professional philosopher who works on causation by omission and on the role of norms, expectations, and defaults in causal judgment, and who has practice turning subtle philosophical distinctions into decision procedures that non-philosophers can run. Before writing the procedure, think through the main candidate accounts of when an omission is a cause of an outcome, and what each would say about the three cases below; then state which account you are operationalizing and why it is the right one for this setting.

  I chair the adverse-event review committee of a 350-bed teaching hospital. We meet twice a month to review cases of serious patient harm and death, and in each case we must decide whether a clinician's failure to act — not ordering a test, not escalating a finding, not checking a pending result, not calling a consultant — caused the harm. The classification matters: if we record the harm as caused by an omission, the event is classified as preventable, triggers a formal investigation, and can follow the individual clinician's record; if we record it as not caused by omission, it is filed as non-preventable and the process ends. The medical director signs off on our classifications and expects the procedure to be consistent and defensible.

  Our recurring problem is that the bare counterfactual test — would the harm have occurred if the person had acted? — is far too permissive. In nearly every death, some nurse could have called an hour earlier, some consultant could have returned a page sooner, some lab could have phoned a result instead of posting it. If we use that test literally, dozens of people caused every death, and the distinction between the failure that killed the patient and the background of ways things might have gone better disappears. I know the philosophy here only in rough outline: some views tie causation by omission to what would normally happen, or to what a person in that role was supposed to do, or to a relevant default, and some deny that omissions are causes at all. I want that work turned into something my committee can actually use.

  Write me a reusable decision procedure, a sequence of questions to run in order, that the committee can apply to any case in roughly twenty minutes. The procedure should say what counts as a sufficient answer at each step, where it stops with a definite conclusion that the omission did not cause the harm, where it stops with a definite conclusion that it did, and which step or steps require a judgment of professional standards or institutional values rather than a finding of fact — and who should make that judgment and how it should be recorded. Throughout, keep the causal question distinct from the question of blame or competence, because the committee tends to run them together and I need the procedure to force them apart. Committee members are clinicians, patient-safety staff, a risk manager, and one lay member; they will not read the philosophical literature, so each question should be phrased in ordinary clinical language, with a sentence or two of rationale connecting it to the philosophical idea it operationalizes.

  Then apply the procedure to these three cases:

  1. A 42-year-old with no relevant history presents with pleuritic chest pain, normal vital signs, and a normal examination; the physician diagnoses musculoskeletal pain and does not order imaging or a D-dimer. Two days later the patient dies of a pulmonary embolism. Had a CT been ordered at the first visit, the embolism would almost certainly have been found and treated. At the time, however, the presentation fell well below the threshold at which the relevant clinical decision rules recommend imaging.

  2. A laboratory posts a critically abnormal potassium value of 6.8 to the electronic record, but the system does not route it to the covering physician, who never sees it. The patient has a fatal arrhythmia later that night. Checking for pending results is possible but is not a specified part of the covering physician's workflow, and the hospital has no rule about who must monitor un-routed results after hours.

  3. A nurse observes clear, documented deterioration in a patient over several hours but does not call the rapid response team, because on that unit such calls are treated as over-reactions and discouraged. The patient arrests. Calling the team would have been within the nurse's role and would, on the balance of probabilities, have prevented the arrest.

  One of these should produce an answer the committee will not like; do not soften it, and say explicitly which case it is and why the committee will resist it. Then tell me what the procedure cannot do: the kinds of case it will misclassify, the questions philosophy has not settled that the procedure treats as settled, and the point at which the hospital simply has to choose a standard and live with the consequences.

  Your answer's final line must be a one-sentence summary of the procedure.
reasoning: |-
  Hmm, the user is chair of a hospital adverse-event review committee and needs a practical decision procedure for determining if an omission caused patient harm. This is a fascinating challenge at the intersection of philosophy and real-world medical governance.

  The core problem is that the naive counterfactual test ("would acting have prevented harm?") is too broad - it would tag every possible action as causal, making accountability meaningless. The committee needs a principled way to distinguish genuine causal omissions from mere background possibilities.

  Three philosophical approaches come to mind:
  First, the "but-for" counterfactual view that they're rightly rejecting as inadequate. Second, the "norm-based" view where omissions only cause when they violate prevailing standards. Third, the "duty-based" view tying causation to role obligations. The norm-based view seems most appropriate here - it handles institutional variation better than rigid duties while avoiding counterfactual overreach.

  For the procedure, I'm considering a six-step flow:
  1) Establish the factual counterfactual (did inaction actually make a difference?)
  2) Screen for absurd extensions (is this just "should've been faster"?)
  3) Identify the relevant standard of care
  4) Determine if omission breached that standard
  5) Check for novelty/unforeseeability
  6) Final causal determination

  Crucially, steps 3 and 4 require value judgments about professional standards - these should be made by senior clinicians with documentation of the rationale. The procedure strictly separates causation from blame by design.

  Applying this to their cases:
  - Case 1: Not causal. Standard of care didn't require imaging.
  - Case 2: Tricky one. No established standard exists for checking un-routed results. Despite the bad outcome, the procedure forces a "not causal" verdict - which the committee will hate because it feels wrong, but the system failure isn't on the covering physician.
  - Case 3: Clear causation. Calling rapid response was an expected nursing duty.

  The procedure has limitations: It can't handle "fuzzy standard" cases well, presumes norm determinacy, and requires accepting that some harmful omissions aren't causal when systems fail. The hospital must ultimately set standards where gaps exist.

  Final summary needs to capture the essence: Causation requires both difference-making and breach of prevailing standard.
answer: |-
  ## Decision Procedure for Causal Omission in Adverse Events

  **Operationalized Account:** Norm-Based Counterfactual Causation. I operationalize the view that an omission is causal only if (1) the action *would* have prevented the harm (counterfactual dependence), AND (2) the omitted action was *required by the relevant normative standard* (the prevailing institutional, professional, or role-specific expectation of what *should* happen in that context). This account avoids the over-permissiveness of the bare counterfactual while acknowledging that norms define which omissions count as deviations from the expected background. It respects institutional context better than pure moral-duty views and is more practical than denying omissions as causes entirely.

  **Procedure: Six Sequential Questions**

  1.  **"Would timely performance of the specific omitted action *realistically* have prevented the harm?"**
      *   *Rationale:* Connects to the counterfactual dependence core of causation – if the harm would have happened anyway, the omission isn’t causal.
      *   *Sufficient Answer:* Requires factual evidence (clinical guidelines, expert opinion, system data) showing it's more likely than not that acting *would* have changed the outcome. If "No," **STOP: Omission did NOT cause the harm.** If "Yes," proceed to Q2.
      *   *Judgment Type:* Factual (Committee Consensus).

  2.  **"Is the omission *merely* about acting faster, rather than failing to act at all?"**
      *   *Rationale:* Addresses "should have been sooner" scenarios, which are pervasive background possibilities, not specific causal omissions. Distinguishes failing to act *within a required timeframe* from just acting *faster*.
      *   *Sufficient Answer:* If the omission is solely about acting *before* a specific required deadline or trigger point was reached/relevant (e.g., "should have called 5 minutes earlier"), it fails this filter. If "Yes," **STOP: Omission did NOT cause the harm.** If "No" (the omission is about failing to act *at all* when action was possible/considered), proceed to Q3.
      *   *Judgment Type:* Factual (Committee Consensus).

  3.  **"What was the *relevant normative standard* governing whether this specific action should have been performed, by this specific person, in this specific context?"**
      *   *Rationale:* Identifies the benchmark against which the omission is judged (e.g., hospital policy, clinical guidelines, role description, unit culture, widely accepted professional practice). This grounds the "breach" element. *Crucially separates causation from blame.*
      *   *Sufficient Answer:* Explicit identification of the source(s) of the standard (e.g., "Hospital Policy X," "ACP Guidelines Y," "Standard RN Duties," "Unit Protocol Z"). Proceed to Q4.
      *   *Judgment Type:* **Value/Judgment (Professional Standards)**. Led by senior clinicians on the committee, informed by relevant guidelines/policies. Document: "Standard identified as: [Source(s)]."

  4.  **"Did the omission constitute a *breach* of the identified normative standard?"**
      *   *Rationale:* Determines if the inaction deviated from what was expected/normally required in this context. Not breaching the standard means the omission is part of the background, not a cause.
      *   *Sufficient Answer:* Requires interpreting the standard against the facts. Was the action *required* by this standard *in these circumstances*? If "No," **STOP: Omission did NOT cause the harm.** If "Yes," proceed to Q5.
      *   *Judgment Type:* **Value/Judgment (Professional Standards)**. Led by senior clinicians on the committee. Document: "Breach determined based on standard [Source(s)] due to [Brief Reason]."

  5.  **"Was the specific situation or the need for this action so novel or unforeseeable that applying the standard *retrospectively* would be unreasonable?"**
      *   *Rationale:* Prevents unfairly judging omissions against standards that couldn't reasonably be applied prospectively. Acknowledges limits of foresight.
      *   *Sufficient Answer:* Requires evidence the situation was highly unusual, unprecedented, or involved genuinely unforeseeable complexities making the standard inapplicable. If "Yes," **STOP: Omission did NOT cause the harm.** If "No," proceed to Q6.
      *   *Judgment Type:* Mixed (Factual assessment of novelty + Judgment on reasonableness of applying standard). Committee consensus, leaning on clinical experience.

  6.  **Causal Conclusion:**
      *   *Rationale:* If all prior steps are passed (Counterfactual Yes, Not Just Faster, Standard Identified, Breach Yes, Not Unforeseeable), the omission is deemed causal.
      *   *Conclusion:* **Omission DID cause the harm.** Document rationale referencing steps passed.

  ---

  **Application to Cases:**

  *   **Case 1 (PE Missed):**
      1.  **Q1:** Yes (CT/D-dimer would likely have found/treated PE).
      2.  **Q2:** No (Not about acting faster, about not acting at all).
      3.  **Q3:** Standard = Relevant clinical decision rules (e.g., PERC, Wells) at the time.
      4.  **Q4:** **No.** Presentation fell *below* the threshold requiring imaging per the rules. No breach of the standard of care. **STOP: Omission did NOT cause the harm.**
      *   *Conclusion:* Not causal. Non-preventable. (Focus is on standard at the time, not hindsight).

  *   **Case 2 (Lab Result Not Seen):**
      1.  **Q1:** Yes (Seeing result likely prompts intervention, preventing arrhythmia).
      2.  **Q2:** No (Not about seeing it faster, about not seeing it at all).
      3.  **Q3:** Standard = Specified workflow and hospital rules for critical result notification/monitoring.
      4.  **Q4:** **No.** Checking un-routed results was *not* part of the covering physician's specified workflow, and there was *no* hospital rule assigning the responsibility. The omission did not breach any *existing* applicable standard. **STOP: Omission did NOT cause the harm.**
      *   *Conclusion:* **Not causal. Non-preventable. (This is the answer the committee will resist).** Why resistance? The outcome is terrible, and the *system* clearly failed. The committee will feel the covering physician *should* have checked or that *someone* was at fault. The procedure forces separation: the *system failure* caused the harm, not the *individual's omission* because no standard *required* that individual to act. This highlights a system gap needing fixing, but doesn't make the omission causal for this review purpose.
      *   *Note:* This flags a critical *system* failure requiring separate review/action, but the *individual omission* isn't causal under this framework.

  *   **Case 3 (Nurse Didn't Call RRT):**
      1.  **Q1:** Yes (Calling RRT would likely have prevented arrest).
      2.  **Q2:** No (Not about calling faster, about not calling at all).
      3.  **Q3:** Standard = Nursing role expectations (recognizing deterioration, advocating for patient) and *formal* hospital/unit policies on escalation (e.g., SBAR, chain of command), *despite* unit culture. (Culture doesn't negate formal role expectations/policy).
      4.  **Q4:** **Yes.** Calling the RRT was within the nurse's role and formal expectations. The omission breached the professional standard of care for recognizing and escalating deterioration, regardless of the unit culture discouraging it. Proceed.
      5.  **Q5:** No (Patient deterioration was clear and documented; need for escalation was foreseeable).
      6.  **Q6:** **Omission DID cause the harm.**
      *   *Conclusion:* Causal. Preventable. Triggers investigation. (Unit culture is a mitigating factor for *blame/competence*, not for *causation*).

  ---

  **What the Procedure Cannot Do & Limitations:**

  1.  **"Fuzzy Standard" Cases:** It struggles when the relevant normative standard is genuinely ambiguous, conflicting, or in flux (e.g., brand new guideline adoption, multiple equally valid approaches). The procedure forces a binary choice (breach/no breach) which may be artificial.
  2.  **Presumption of Norm Determinacy:** The procedure assumes a determinable standard exists (Q3). It cannot adjudicate deep philosophical debates about whether norms *should* define causation or if omissions are "real" causes. It treats the norm-based counterfactual account as settled for this practical purpose.
  3.  **System Failures vs. Individual Omissions:** It clearly distinguishes them (as in Case 2), but cannot *prevent* the frustration of seeing a harmful outcome deemed "non-preventable" due to a system gap. It highlights the need for *system* review elsewhere.
  4.  **Grading Severity of Breach:** It only asks *if* a breach occurred (Q4), not *how* severe it was. A trivial breach meeting all criteria is deemed causal.
  5.  **Setting New Standards Retrospectively:** It cannot be used to *create* a new standard after the fact to judge an omission. Q4 must be based on standards reasonably applicable *at the time*.
  6.  **The Point of Choice:** **Where no clear standard exists (like Case 2, Q3/Q4), the hospital *must choose* how to codify expectations moving forward.** The procedure forces this choice point to be explicit: *either* accept the omission wasn't causal under existing standards (closing the case), *or* formally establish a new standard/policy *now* (which then applies *future* cases). Living with the consequence means accepting that harmful events occurring before a standard is set may not be classified as preventable omissions.

  **Final Summary:** An omission caused the harm only if acting would realistically have prevented it, the omission was a failure to act at all (not just faster), it breached a relevant, applicable normative standard in place at the time, and the situation wasn't unforeseeably novel.
