answer: |-
  Here's a rigorous translation of Jackson's knowledge argument into information-theoretic/representation learning frameworks, followed by a residue analysis:

  ### Systematic Translation to Information-Theoretic/Representation Learning Vocabulary
  **Setup (Pre-Exit Mary):**
  - **What Mary has:**  
    A *losslessly compressed generative model* of human color vision. She possesses:  
    1. **Complete Shannon mutual information** \( I(X; Y) \) between:  
       - \( X \): Physical stimuli (wavelength distributions)  
       - \( Y \): Neural states (firing patterns in V1-V4, V8)  
    2. **Full algorithmic descriptions** \( K(\text{color\_processing}) \) of:  
       - Signal transduction (retina → LGN → cortex)  
       - Opponent-process computations  
       - Attentional modulation circuits  
    3. **Exhaustive functional embeddings** \( \phi(\text{stimulus}) \rightarrow \mathbb{R}^d \) where \( d \) is the dimensionality of her neural state space. She can predict the *latent representations* \( z \) in visual cortex for any input.  
    4. **Channel capacity** \( C \) of the human visual system under physical constraints (photoreceptor noise, neural sparsity).  

  **The New Experience (Seeing Red):**  
  - **What she gains:**  
    A *high-dimensional sensory sample* \( s_{\text{red}} \) from the *phenomenal distribution* \( P_{\text{phen}} \). This is:  
    1. A **raw instantiation** of the output of the visual generative process:  
       \( s_{\text{red}} \sim P(\text{Experience} | \text{Neural State} = z_{\text{red}}) \)  
    2. **Irreducible first-person entropy** \( H_{\text{subj}}(S|Z) \) – the residual uncertainty in subjective experience *even when neural state \( Z \) is fully specified*.  
    3. **Direct acquaintance** with the *decoding function* \( \psi(z) \rightarrow \mathcal{Q} \) where \( \mathcal{Q} \) is the qualia space (unmodeled in physical descriptions).  

  **Argument Conclusion (Information-Theoretic Restatement):**  
  Physicalist descriptions only specify:  
  - \( I(\text{Stimulus}; \text{Neural State}) \) (sensory coding efficiency)  
  - \( K(\text{Neural Dynamics}) \) (algorithmic complexity of processing)  
  - \( \text{dim}(\phi) \) (latent space geometry)  

  But they omit the **experiential codebook** \( \psi : \text{Neural States} \rightarrow \text{Qualia} \). Mary’s new knowledge is the acquisition of \( \psi(z_{\text{red}}) \) – a mapping from abstract state to phenomenal instance. Since \( \psi \) is non-computable from physical data alone (by hypothesis), physicalism is incomplete.  

  ---

  ### Residue Report  
  **Clean Translations:**  
  1. **Propositional knowledge** → Shannon mutual information & algorithmic descriptions.  
  2. **Physical facts** → Complete specification of \( P(X,Y) \) (joint stimulus-neural distribution).  
  3. **Predictive capacity** → Perfect generative modeling of neural responses \( \hat{Y} = f(X) \).  
  4. **Novelty of experience** → Sampling from \( P(S|Z) \) not reducible to knowing \( P(Z|X) \).  

  **Distorted/Hand-Waved Translations:**  
  1. **"Knowing what it’s like"**: Translated as "access to \( \psi \)", but \( \psi \) is undefined in physical terms. Representation learning assumes \( \psi \) is learnable from data (e.g., via neural decoding). Jackson assumes it’s metaphysically primitive.  
  2. **Epistemic gap ≠ Ontological gap**: The argument infers an ontological limitation from an epistemic one. Info theory shows Mary gains *new data* (a sample \( s \)), but doesn’t prove this sample requires non-physical properties.  

  **Untranslatable Elements:**  
  1. **Intrinsic properties of qualia**: Information theory quantifies *differences* (entropy) and *correlations* (mutual information), but has no vocabulary for intrinsic qualities of signals. Kolmogorov complexity measures description length, not "what-it-feels-like".  
  2. **Subjective ontology**: First-person perspective has no analog in Shannon/Kolmogorov frameworks, which are observer-independent.  
  3. **Acquaintance knowledge**: Gaining \( \psi(z) \) is modeled as *data acquisition*, but Jackson treats it as accessing a *fundamental property* – a category mismatch.  
  4. **Explanatory gap**: Why does \( z_{\text{red}} \) map to *this specific* \( \psi(z_{\text{red}}) \)? Info theory notes the mapping is arbitrary (like symbol grounding), but doesn’t explain phenomenal binding.  

  **Residue Analysis & Diagnosis:**  
  - **The Core Ambiguity Exposed**: Jackson conflates *information-as-correlation* (Shannon) and *information-as-intrinsic-property*. Mary gains a *new signal token* (\( s_{\text{red}} \)), but all *informational relationships* (mutual information, causal dependencies) were already known.  
  - **What Information Theory Captures**:  
    - Mary lacked a *particular instance* of the output distribution she perfectly modeled.  
    - Her new state is high-Kolmogorov-complexity raw data ("this red now") vs. her prior compressed model.  
  - **What Escapes Information Theory**:  
    - **The Hard Problem**: *Why* does processing wavelength 650nm generate *this* subjective state? Info theory describes the channel, not the qualia.  
    - **Non-Structural Properties**: Knowing all relational/functional info (which info theory *can* model) doesn’t entail knowing intrinsic qualities (which it *cannot*).  

  **Conclusion**:  
  The residue reveals the argument hinges on an **ambiguity in "information"**:  
  - Shannon/Kolmogorov frameworks show Mary gains *new data* but not *new relational facts*.  
  - However, the *phenomenal character* of that data (its intrinsic quality) has no counterpart in information theory. This suggests Jackson identifies a genuine explanatory gap: **Physical descriptions specify *covariations* and *computations*, but not the *intrinsic nature* of the experiences they correlate with.** Your vocabulary exposes that the argument isn’t about *informational completeness* (Mary had all correlational data), but about the **ontological primitiveness of qualia** relative to physical relations. Whether this gap refutes physicalism depends on if one demands that physicalism explain intrinsic properties – which standard information-theoretic descriptions do not attempt.
