prompt: |-
  I need your advice on something that's been gnawing at me, and I suspect it turns on a distinction I'm not sure actually holds up.

  I work at a small company, and we're about to launch a software feature that I know has a real limitation: under certain conditions — rare, but not freakishly so — it returns incorrect results. Our head of marketing has drafted the launch announcement, and it describes the feature as "thoroughly tested and reliable across all standard use cases." Every word of that is true. We did test it thoroughly, and the conditions that trigger the failure genuinely aren't what we'd call "standard." But I also know, with near certainty, that the average reader will take that sentence to mean the feature is reliable, full stop. They won't notice the qualifier; they'll just hear "reliable." The marketing lead knows this too — he's counting on it.

  I raised my discomfort, and he said: "Look, I could add a sentence saying 'Note: the feature may fail under atypical conditions,' but that would gut the launch. Alternatively, I could just say it's 'reliable' without qualification — but that would be false, and I won't do that. What we've got is the honest version that still lets us ship." He wasn't being cynical; he genuinely sees himself as having found the truthful path.

  Here's my question. If I go along with this, I'm not lying — the sentence is true. But I'm clearly letting people walk away with a false belief, and I'm doing it deliberately. Is that morally different from just lying outright? And if it is different, is the difference large enough that I should feel all right about it? I'm not asking for generic workplace advice or how to navigate my relationship with the marketing lead. What I want to know is whether the distinction between lying and merely misleading carries genuine moral weight in a situation like this, or whether I'd just be using the distinction to let myself off the hook.

  If I'm framing the whole thing badly — if, for instance, the lying-versus-misleading lens isn't even the right way to think about this, or if the question as I've posed it rests on a mistake I'm not seeing — please say so plainly rather than working within my framing. I'd rather have the question corrected than answered on its own flawed terms.
reasoning: |-
  Okay, the user is grappling with a significant ethical dilemma at work. They're part of a team about to launch a software feature with a known limitation under rare conditions. The marketing lead has crafted an announcement stating the feature is "thoroughly tested and reliable across all standard use cases," which is technically true but likely to mislead customers into thinking it's completely reliable. 

  The user feels uneasy because while they're not technically lying, they're allowing customers to form false beliefs. They specifically want to know if there's a moral difference between lying and misleading in this scenario, and whether that distinction matters enough to justify their discomfort. 

  First, I need to unpack why this bothers them so much. They mention feeling like they're "using the distinction to let myself off the hook," suggesting genuine moral concern rather than just workplace politics. Their request to correct their framing if needed shows intellectual honesty—they're not looking for validation but truth. 

  The core issue revolves around deception versus truth-telling. Technically, the statement is true, but it's crafted to exploit how people process information. Most customers will miss the qualifier "standard use cases" and assume universal reliability. The marketing lead admits counting on this, which introduces intent—a key factor in moral analysis. 

  I recall philosophical distinctions between lying (asserting falsehoods) and misleading (allowing false inferences). Ethicists like Kant might argue both violate the duty of truthfulness, while utilitarians might weigh consequences—e.g., if the rare failure causes minor inconvenience vs. critical errors. 

  But the user’s context adds layers: it's a small company, so reputational damage could be devastating. Also, they’re in software, where "reliable" implies robustness; customers might use this in contexts the team hasn’t anticipated. Even if conditions are "non-standard," calling them "atypical" feels dismissive—what if they’re uncommon but high-stakes? 

  The user’s deeper need might be preserving integrity while avoiding sabotaging the launch. They might fear complicity in betrayal: if customers discover the omission later, trust erodes. Their question isn’t just "is this wrong?" but "is my discomfort justified enough to act on it?" 

  Alternative framings could shift focus: 
  - Professional ethics: Do engineers have a duty to disclose limitations that affect functionality? 
  - Contractual honesty: Does "reliable" imply fitness for purpose under reasonable variations? 
  - Consequentialist view: Could the short-term gain of a smooth launch backfire if users encounter failures and feel deceived? 

  The marketing lead’s stance—that adding a disclaimer would "gut the launch"—prioritizes sales over transparency. But if the feature fails for an early adopter who didn’t anticipate risks, backlash could hurt more. 

  Ultimately, the moral weight here lies in intentional deception. While not a lie, it’s a half-truth designed to mislead. The difference feels academic to the misled customer. The user’s unease signals that this crosses a line for them personally—and that instinct might be worth honoring.
answer: |-
  You've framed this with remarkable clarity, and your instinct that the lying-versus-misleading distinction carries genuine moral weight here is correct. This isn't just semantics; it's a core ethical tension. Let's break it down:

  **1. The Moral Difference Between Lying and Misleading (and Why It Matters):**

  *   **Lying:** Asserting a falsehood directly (e.g., "This feature never fails").
  *   **Misleading (Paltering/Selective Truth-Telling):** Using a technically true statement *with the intent and reasonable expectation* that it will create a false belief in the listener (e.g., "Thoroughly tested and reliable across all standard use cases," knowing full well customers will infer "reliable in all situations").

  *   **The Moral Weight:** While both are deceptive, misleading often feels (and sometimes is) *less bad* than an outright lie because it maintains a veneer of technical truthfulness. However, **the key ethical violation isn't solely in the words spoken, but in the *intentional creation of a false belief*.**

      *   **Intent:** The Marketing Lead *intends* for the audience to believe the feature is universally reliable. He *counts* on them missing the qualifier. This intent to deceive is the core moral problem.
      *   **Exploitation:** He's exploiting a known cognitive bias (people gloss over qualifiers and hear the positive claim) to implant a false belief. This is manipulative.
      *   **Responsibility:** When you know your true statement will predictably mislead, and you *choose* not to clarify *because* the clarification would prevent the false belief, you become morally responsible for the deception. You are knowingly facilitating the misunderstanding.

  **2. Why This Situation is Ethically Problematic (Beyond Intent):**

  *   **Materiality:** The limitation isn't trivial. "Incorrect results" can have real consequences for users, even if the conditions are rare. "Standard" is also ambiguous – users might reasonably consider their specific use "standard" even if you don't.
  *   **Trust:** The launch announcement is a foundational act of communication. Starting with a statement designed to mislead erodes trust. If/when users encounter the error, they'll feel deceived *because they were*, even if the words were technically true. Rebuilding that trust is hard.
  *   **Professional Integrity (Especially for Creators):** As someone involved in creating the feature, your integrity is tied to its honest representation. Promoting it knowing users will form a false belief about its capabilities compromises that integrity.
  *   **The "Honest Version" Claim is Disingenuous:** The Marketing Lead claims this is the "honest version." It's not. It's the *technically true but maximally misleading* version. A truly honest version would either:
      *   Disclose the limitation upfront ("Reliable across standard use cases, though users should note that in rare, non-standard conditions X, results may be inaccurate").
      *   Use less ambitious, more precise language that doesn't invite universal reliability ("Provides robust results for the vast majority of common workflows").
      *   His refusal to add a disclaimer because it would "gut the launch" explicitly admits that the *truth* about the limitation would undermine the *desired false impression* he's creating. This reveals the deception.

  **3. Is the Distinction "Large Enough" to Feel All Right? No.**

  *   The distinction might make it *less bad* than an outright lie about the limitation, but it doesn't make it *morally acceptable*. The core wrong – intentionally causing others to hold a false belief crucial to their decision-making – remains.
  *   Your discomfort is well-founded. It signals your recognition that this is deceptive, even if not a literal lie. Ignoring that discomfort is ignoring your own ethical compass.

  **4. Reframing the Question (As You Requested):**

  The lying-versus-misleading lens *is* relevant, but it might be even more powerful to frame it through these ethical principles:

  *   **Duty of Care:** Do you have a duty to ensure users understand the limitations of a product you helped create, especially when incorrect results could impact them?
  *   **Respect for Autonomy:** Are users making a truly informed decision about using this feature if they are deliberately led to believe it's universally reliable?
  *   **Trustworthiness:** Is building the company's reputation (and your own) on a foundation of selective truth-telling sustainable or desirable?
  *   **Fiduciary Responsibility (Indirect):** While marketing's job is promotion, does that extend to exploiting predictable misunderstandings? Does the company's long-term health truly depend on misleading users at launch?

  **Conclusion & What Your Discomfort Tells You:**

  Your instinct is correct. While not an outright lie, this is intentional deception through selective truth-telling. The distinction carries moral weight, but **that weight falls heavily on the side of wrongdoing.** The Marketing Lead's "honest path" is a path of calculated deception. Going along makes you complicit in intentionally misleading users.

  **You should not feel all right about this.** Your discomfort is your ethical compass pointing to a genuine problem. The question isn't *whether* this is wrong, but *what you do next* given that recognition. While you asked to avoid workplace advice, the moral conclusion inevitably leads to practical action: you need to escalate your concerns more forcefully, propose truly transparent alternatives, or seriously consider your continued association with a practice you find ethically compromised. The moral cost of silence is high.
