answer: |-
  ## Adversarial Collaboration Agreement: The Special Composition Question

  **Parties:**  
  - **The Universalist (U):** Holds that composition is unrestricted; any plurality of objects whatsoever composes a further object.  
  - **The Nihilist (N):** Holds that composition never occurs; there are no composite objects, only simples arranged in various ways.  

  **Preamble:**  
  We, the undersigned, having reached an impasse in our reading group concerning the Special Composition Question (SCQ) – "Under what conditions do some things compose a further thing?" – agree to this adversarial collaboration. Our aim is to clarify our precise points of agreement and disagreement, identify genuine cruxes, and distinguish substantive disputes from potential verbal ones. We commit to engaging with each other's arguments and the identified cruxes in good faith.

  ### I. Agreed Foundational Claims

  Both parties accept the following propositions as providing the necessary framework for the debate:

  1.  **Mereological Formalism:**
      1.  Mereology provides a formal framework for discussing part-whole relations.
      2.  The parthood relation (symbolised ≤) is reflexive, antisymmetric, and transitive.
      3.  The composition relation holds between some things (the *parts*) and a further thing (the *composite*) if and only if:
          *   Each of those things is part of the composite.
          *   Every part of the composite overlaps at least one of those things.
          *   (i.e., the parts are a *fusion* or *mereological sum* of the composite).
      4.  The SCQ concerns the *material* conditions under which composition *in fact* occurs within our domain of discourse, not merely the logical coherence of mereological systems.

  2.  **What the Debate is Not About:**
      5.  It is not primarily about the semantics of ordinary language terms like "object," "thing," or "compose." While relevant to some arguments, the core ontological question persists independently.
      6.  It is not about the fundamental constituents of reality as described by physics (e.g., quantum fields, particles, strings). Both parties accept that physics describes the distribution and properties of fundamental entities; the debate concerns whether arrangements of these entities constitute *additional* composite entities.
      7.  It is not about the existence of abstract objects, social objects, or artefacts *qua* artefacts (e.g., whether a contract exists). The focus is on concrete material composition.

  3.  **Common Sense & Science:**
      8.  Common sense perception and discourse robustly suggest the existence of composite objects like tables, rocks, and organisms. Neither party denies the *usefulness* or *pragmatic validity* of this way of speaking in everyday life or even much of science.
      9.  The success of science does not *logically entail* the existence of composite objects as *sui generis* entities over and above the arrangement of fundamental particles/fields. Science describes patterns, causal interactions, and functional organisation among fundamental entities.
      10. The existence of complex organised structures (e.g., atoms, molecules, cells, organisms) is an empirical fact. The debate is whether these structures *are* objects in their own right (composites) or merely *arrangements* of simples.

  4.  **Burden of Proof:**
      11. The burden of proof lies primarily with the Universalist to demonstrate why unrestricted composition, which posits an immense and counterintuitive ontology (e.g., trout-turkeys, the fusion of your left shoe and the Moon), is rationally required or preferable despite its profligacy.
      12. The burden of proof lies primarily with the Nihilist to demonstrate why common-sense commitment to ordinary objects must be rejected as fundamentally mistaken, and to provide a plausible account of the phenomena (e.g., perception, reference, causation, persistence) seemingly involving composites without invoking composites.
      13. Neither position can claim the default status simply by aligning more closely with common sense intuitions *or* with physical fundamentalism; both require positive argumentation.

  ### II. Precise Points of Disagreement

  | Disagreement Point | Universalist (U) Position (as endorsed by U) | Nihilist (N) Position (as endorsed by N) |
  | :----------------- | :------------------------------------------- | :--------------------------------------- |
  | **1. Composition Occurs?** | Composition is unrestricted and occurs whenever there are two or more objects: for any arbitrary plurality of objects, there exists a mereological sum which is itself an object. | Composition never occurs: there are no composite objects. What exists fundamentally are only mereological simples. Talk of "composites" refers only to simples arranged object-wise, without ontological commitment to a further entity. |
  | **2. Criterion for Composition** | There is no non-trivial, non-arbitrary, necessary and sufficient condition for composition beyond mere existence and plurality. Any proposed restriction (e.g., contact, causation, functional unity) is either vague, arbitrary, or fails to capture the universality of composition. | The very concept of composition as generating a *distinct* object requires a substantive condition (e.g., causal integration, spatial boundedness, functional unity), but no such condition holds universally and non-arbitrarily. Therefore, composition *never* occurs. |
  | **3. Ontological Status of Ordinary Objects** | Ordinary objects (tables, rocks, cats) are genuine composite objects, identical to the relevant mereological sums of their fundamental parts. | Ordinary objects do not exist *as fundamental entities*. What exist fundamentally are simples arranged table-wise, rock-wise, cat-wise. We can truly say "There is a table" only in a loose, derivative sense, meaning "There are simples arranged table-wise". |
  | **4. Explanatory Power** | Unrestricted composition provides the simplest and most ontologically uniform account of part-whole relations, avoiding arbitrary boundaries and the problematic task of defining restricted composition. The profligate ontology is a price worth paying for theoretical simplicity and uniformity. | Nihilism provides a more parsimonious ontology (only simples) and avoids the problem of vague existence or arbitrary composition criteria. The explanatory work done by apparent composites (e.g., in causation, perception) can be fully accounted for by the arrangement and properties of simples. |

  ### III. Key Cruxes

  A crux is a sub-question where resolution *would genuinely shift the burden of proof or alter the perceived viability of one position for at least one party*.

  1.  **Crux 1: Is Causal Integration Necessary for Composition?**
      *   **Concrete Case:** Consider a severed human hand, cryogenically preserved and perfectly functional in isolation (e.g., responsive to nerve stimulation, metabolising stored nutrients). Later, it is reattached to its original body. Separately, consider the same hand kept permanently isolated.
      *   **U's Prediction:** Composition occurs in both scenarios. The isolated hand *is* a distinct composite object before and after reattachment. Its causal integration with the body is irrelevant to its mereological sum existing. Change in causal relations doesn't change mereological facts.
      *   **N's Prediction:** Only simples arranged hand-wise exist in both scenarios. The reattachment case highlights that what matters for *treating it as a single organism* is its integration into a larger causal system (the body). The isolated hand lacks the relevant causal integration *for being a biological organism*, though we might loosely call it "a hand". Crucially, no *further composite entity* "the hand" exists in either case beyond the simples. This case shows that causal integration is crucial for the *kind* of unity we associate with objects, but since such integration is contingent and variable, it cannot ground a universal principle of composition. Nihilism avoids the problem of deciding when integration is sufficient.
      *   **Why Crucial:** If U can convincingly show that causal integration is *irrelevant* to composition *simpliciter* (as per their prediction), it weakens N's core argument against restricted criteria. If N can convincingly show that judgments about the hand's "objecthood" track causal integration and that composition *requires* such integration but it's not universalisable (as per their prediction), it strengthens their case for nihilism as the only consistent position.

  2.  **Crux 2: Can Reference and Quantification Succeed Without Composite Objects?**
      *   **Concrete Case:** Consider the sentence "That chair is comfortable," uttered while pointing to a collection of wood simples arranged chair-wise. Can this sentence be true?
      *   **U's Prediction:** Yes, but *only* if there genuinely exists a composite entity, the chair, which is the referent of "that chair" and possesses the property of being comfortable. The success of singular reference and predication commits us ontologically to the chair.
      *   **N's Prediction:** Yes, the sentence can be true. However, "that chair" does not refer to a composite entity. It refers (perhaps contextually or via paraphrase) to the wood simples arranged chair-wise. The predicate "is comfortable" is made true by the arrangement and properties of those simples (e.g., their shape, rigidity, spatial relations) causing comfort sensations in humans. Quantification over "chairs" can be paraphrased into quantification over simples arranged chair-wise.
      *   **Why Crucial:** If N can provide a plausible, non-ad-hoc semantics accounting for the truth of such sentences without ontological commitment to composites (as per their prediction), it significantly weakens U's (and common sense's) argument from language and perception. If U can show that N's paraphrases fail systematically or are implausible (e.g., failing to handle cases of vagueness, identity over time, or intentionality directed at objects *as* objects), it strengthens the case that nihilism cannot account for undeniable phenomena, placing the burden back on N.

  3.  **Crux 3: Does Nihilism Imply Eliminativism About Ordinary Objects?**
      *   **Concrete Case:** Is the statement "Mount Everest exists" true?
      *   **U's Prediction:** Yes, straightforwardly true. Mount Everest is a paradigm composite object.
      *   **N's Prediction:** Yes, *but* this truth is not fundamental. "Mount Everest exists" is true only in virtue of there being simples arranged Everest-wise (i.e., simples occupying the relevant region of space-time with the appropriate properties like rock-ness, ice-ness, forming a massive peak). There is no *further entity*, Mount Everest, over and above these arranged simples. Nihilism is *revisionary* but not *eliminativist* about ordinary discourse; it offers a different ontological account of what makes such discourse true.
      *   **Why Crucial:** If U can demonstrate that N's position *necessarily* entails that statements like "Mount Everest exists" are *false* (despite N's claims otherwise), nihilism becomes implausibly revisionary. If N can convincingly articulate and defend their non-eliminativist, paraphrastic account (as per their prediction), showing how it preserves the truth of ordinary statements without the ontology, it mitigates a major intuitive objection to nihilism and shifts the burden to U to show why composites are *needed*.

  ### IV. Potential Merely Verbal Disagreement

  *   **The Disagreement:** The meaning of "object" in fundamental ontology.
  *   **U's Typical Usage:** "Object" applies to any individual entity, including mereological sums. A composite object *is* its mereological sum.
  *   **N's Typical Usage:** "Object" (fundamentally) applies only to mereological simples. "Composite object" is either an oxymoron or refers derivatively to an arrangement of simples.
  *   **Why Potentially Merely Verbal:** If both parties agree to the following:
      1.  There exist fundamental mereological simples.
      2.  These simples can be arranged in various ways (table-wise, rock-wise, Everest-wise, trout-turkey-wise).
      3.  The arrangement "table-wise" is significantly different (in terms of causal integration, functional unity, spatial contiguity, etc.) from the arrangement "trout-turkey-wise".
      4.  Our language and thought often track these arrangements, referring to "tables" but not (usually) to "trout-turkeys".
  *   **Resolution Through Tightening:** The core substantive disagreement then reduces to whether the existence of simples arranged table-wise *suffices* for the existence of a *further entity* (a composite object/table) *in addition to* the simples and their arrangement. U says "Yes" (unrestrictedly), N says "No" (universally). The question of *what counts as an 'object'* becomes secondary to whether composition *generates new entities*.
  *   **Outcome:** Once formulations are tightened around this ontological question (existence of composites *as additional entities*), the previously murky disagreement about the word "object" largely dissolves, leaving the substantive metaphysical disagreement over composition clearly visible (Points II.1 & II.3).

