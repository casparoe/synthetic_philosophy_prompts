  ok so i've been reading about this wireheading thing where if you could directly stimulate the pleasure centers in your brain, you'd just do that forever and ignore everything else. and philosophers use this to argue against utilitarianism, like "see, pleasure isn't the only thing that matters because nobody would actually choose the wireheading machine."

  but i don't get why this is supposed to be some deep philosophical problem. isn't this literally just what drug addiction is? like heroin also hijacks your reward system and makes people stop caring about their job and their family and everything. we already know that's bad. the only difference is heroin has side effects and withdrawal and you have to keep getting more, but the basic thing — your brain getting tricked into valuing the wrong thing — is the same. so why do philosophers treat wireheading like it's this new argument when its just describing addiction in a slightly cleaner way?
