prompt: |-
  I spent my career in the natural sciences, and like many of my generation, I was trained on null hypothesis significance testing as if it were the only game in town. The replication crisis has made it clear that something is wrong with how we use statistics, and the Bayesian/frequentist divide seems to be at the heart of many diagnoses. But I have now read enough philosophy of statistics to know that the debate is vast — it ranges from the foundations of probability to the mechanics of multilevel modeling — and I want to know where to direct my remaining attention.

  Suppose a small research group with both philosophical and statistical competence could spend five years on questions at the Bayesian/frequentist interface that are meant to change how working scientists actually behave — how they design studies, analyze data, and interpret results. Which open questions should they prioritize, and in what order? For each entry in your ranking, I want the reasoning: how exactly does progress on this question translate into different practices at the bench or in the field? What makes it tractable — are the conceptual pieces already in place, or would it require new formal work? And what would have to happen over the next few years for you to move it up or down the list? I am not looking for a survey of the debate; I am looking for a defended agenda, one that a former experimentalist could judge against decades of watching scientists misuse statistics in practice.
reasoning: |-
  Okay, the user is a retired natural scientist who spent their career using null hypothesis significance testing (NHST). They've noticed the replication crisis and recognize issues with how statistics is applied in science. They've explored the Bayesian vs. frequentist debate but find it overwhelming. Now, they want a focused research agenda for a specialized group to tackle over five years. The goal is to change how scientists design studies, analyze data, and interpret results. They need a prioritized list of open questions with clear reasoning on impact, tractability, and what could shift priorities.

  First, I need to identify the core issues. The replication crisis stems from misuse of p-values, lack of replication, and misunderstanding statistical evidence. The user wants actionable solutions, not just theory. They’ve seen scientists misuse stats, so practical changes are crucial.

  The key areas where research could make a difference: integrating Bayesian methods into frequentist workflows, improving study design, better evidence quantification, handling multiple comparisons, and using prior knowledge effectively. These need to bridge the gap between theory and practice.

  Top priority should be something that changes daily practice. Pre-registration with analysis plans is already helping, but integrating Bayesian elements could address p-value pitfalls. For example, requiring Bayes Factors or posterior probabilities in pre-registration would make researchers think about effect sizes and alternatives early. This reduces p-hacking and selective reporting. It's tractable because tools like R or Stan can be adapted into templates. If journals start mandating such plans, adoption would rise.

  Next, study design. Power analysis is standard but flawed. Hybrid designs using Assurance or Bayesian predictive power could incorporate uncertainty better. Teaching these in grad programs and including them in grant requirements would shift practices. Software integration is key here. If funding bodies require these methods, uptake would increase.

  Then, evidence metrics. Scientists need alternatives to p-values. Bayes Factors and posterior distributions are harder to misinterpret. Developing standardized reporting and training materials would help. If major journals adopt these metrics, it could push change. Success would be seeing these in publications regularly.

  Multiple comparisons are a mess. Bayesian hierarchical models or false discovery rate controls are better but underused. Creating accessible tutorials and case studies for fields like genomics could demonstrate benefits. If these methods prove robust in high-throughput studies, adoption would follow.

  Lastly, using priors effectively. Default priors are controversial. Research into robust priors and sensitivity analysis tools would make Bayesian methods more acceptable. Workshops and consensus-building in specific fields could lead to standardized priors. If regulatory agencies approve these methods, it would lend credibility.

  Tractability depends on existing tools and community buy-in. For each priority, software integration and training are necessary. The user’s experience with misuse means solutions must be user-friendly and mandatory via journals or funders. Monitoring adoption through policy changes and tool development would adjust priorities. For instance, if pre-registration with Bayes Factors gains traction, focus can shift to evidence metrics or priors.

  Overall, the agenda moves from integrating methods into existing frameworks (pre-registration, design) to adopting new metrics and handling complex analyses. The goal is incremental changes that collectively reform scientific practice, making stats more about evidence than binary decisions.
answer: |-
  Here’s a prioritized research agenda targeting the Bayesian/frequentist interface, designed to maximize practical impact on scientific practice within 5 years. The ranking balances **immediate tractability**, **potential to disrupt harmful defaults**, and **feasibility of integration** into existing workflows. Each priority includes concrete mechanisms for changing bench/field behavior.

  ---

  ### **#1 Priority: Hybrid Pre-Registration Templates with Integrated Analysis Plans**
  * **Core Problem:** NHST incentivizes p-hacking and selective reporting. Pre-registration alone doesn’t fix flawed *analytic* logic.
  * **Solution:** Develop field-specific pre-registration templates requiring:
    * A *frequentist* power analysis **AND** a *Bayesian* "analysis maturity" statement:
      * Specification of a minimally informative prior.
      * Calculation of Bayes Factor (BF) or posterior probability for key hypotheses under simulated data.
      * A sensitivity analysis plan for prior choice.
  * **How It Changes Practice:**
    * **At Design Stage:** Forces researchers to explicitly state *what would convince them* (via BF thresholds) *before seeing data*. E.g., "BF > 10 for H1 over H0 will be considered strong evidence."
    * **At Analysis Stage:** Reduces post-hoc switching between NHST and Bayesian frameworks. Sensitivity analysis discourages cherry-picking priors.
    * **At Interpretation:** BF > 3 (evidence) vs. BF > 10 (strong evidence) is more intuitive than p < 0.05 (significant?).
  * **Tractability:** 
    * Tools exist (R packages like `brms`, `BayesFactor`; JASP GUI). 
    * Templates can build on Open Science Framework (OSF) frameworks. 
    * Requires standardizing reporting formats, not new math.
  * **Move Up If:** Major funders (NIH, NSF) mandate hybrid templates; journals like *Nature* adopt them.  
  * **Move Down If:** Field resistance shows templates are used ritualistically without understanding.

  ---

  ### **#2 Priority: Unified Framework for Study Design & Power with Uncertainty Quantification**
  * **Core Problem:** Frequentist power analysis ignores uncertainty in effect size estimates and prior knowledge. Bayesian "assurance" is rarely taught or implemented.
  * **Solution:** Create open-source tools and training for **hybrid design analysis**:
    * Input: Pilot data/existing literature → Output: Distributions of *both* frequentist power *and* Bayesian posterior/precision metrics.
    * Focus on "Probability of Success" (Bayesian) or "Assurance" instead of binary power thresholds.
  * **How It Changes Practice:**
    * **Grant Writing:** Applicants justify sample sizes using *both* power curves *and* distributions of expected posterior precision (e.g., "95% probability that 95% CrI width < Δ").
    * **Resource Allocation:** Labs prioritize studies with high *assurance* over those with merely 80% power under implausible effect sizes.
    * **Replication Design:** Bayesian predictive distributions inform how much new data is needed to update beliefs meaningfully.
  * **Tractability:** 
    * Mathematical foundations are solid (e.g., Spiegelhalter’s "design priors"). 
    * Needs user-friendly apps (Shiny/RMarkdown) integrating `rstanarm`/`blavaan` with `pwr`/`Superpower`.
  * **Move Up If:** Major funders require assurance calculations; clinical trial regulators (FDA/EMA) pilot Bayesian designs.  
  * **Move Down If:** Tool development lags; researchers default to oversimplified power calculators.

  ---

  ### **#3 Priority: Default Bayesian-Frequentist "Translation" Metrics for Common Designs**
  * **Core Problem:** Scientists default to p-values because alternatives feel alien. They need "Rosetta Stone" outputs bridging frameworks.
  * **Solution:** For standard models (t-tests, ANOVA, regression), develop consensus on reporting:
    * **p-value** + **Bayes Factor** + **Maximum Posterior Interval (MPI)** for effect size.
    * E.g., "p = 0.02, BF₁₀ = 5.2, β ∈ [0.1, 0.8] with 95% probability."
  * **How It Changes Practice:**
    * **Results Sections:** Forces acknowledgment that p ≈ 0.05 often corresponds to weak evidence (BF ~ 3). 
    * **Discussion:** Researchers explicitly contextualize "significance" (frequentist) with "strength of evidence" (Bayesian).
    * **Teaching:** Stats courses show parallel analyses on the same dataset.
  * **Tractability:** 
    * Algorithms are mature (e.g., `BayesFactor` for BFs, `rstanarm` for posteriors). 
    * Requires pedagogical materials and journal policy shifts.
  * **Move Up If:** APA/AME manuals update style guides; flagship journals (e.g., *Science*, *NEJM*) pilot dual reporting.  
  * **Move Down If:** Researchers report metrics without understanding, creating new "rituals."

  ---

  ### **#4 Priority: Robust Bayesian Workflows for Multiplicity & Hierarchical Data**
  * **Core Problem:** NHST corrections (Bonferroni, FDR) are brittle. Bayesian hierarchical models are powerful but intimidating.
  * **Solution:** Develop "turnkey" Bayesian multilevel models for common multi-test scenarios (e.g., genomics, neuroimaging, ecology):
    * Default priors for partial pooling.
    * Automatic visualization of shrinkage effects.
    * Output: Posterior probabilities for individual effects *within* the global structure.
  * **How It Changes Practice:**
    * **High-Throughput Fields:** Replaces FWER/FDR with probabilistic statements: "Gene X has 97% probability of true effect > δ."
    * **Experimental Biology:** Handles batch/block effects naturally without ad-hoc adjustments.
    * **Meta-Analysis:** Integrates heterogeneous studies via predictive priors.
  * **Tractability:** 
    * Computational advances (Stan, NIMBLE) make this feasible. 
    * Needs domain-specific templates (e.g., `brms` for ecology, `STAN` for fMRI).
  * **Move Up If:** Bioconductor/Neuroimaging pipelines integrate Bayesian FDR; consortia adopt for reproducibility projects.  
  * **Move Down If:** Computational demands exceed typical lab resources; diagnostics remain obscure.

  ---

  ### **#5 Priority: Pragmatic Guidelines for Prior Elicitation in Low-Information Settings**
  * **Core Problem:** Scientists fear Bayesian priors as "subjective," defaulting to NHST’s hidden assumptions.
  * **Solution:** 
    * **Empirical:** Catalog "consensus priors" for common effect sizes in biology/psychology (e.g., log-odds ratios for drug effects).
    * **Methodological:** Develop "prior robustness scores" for conclusions (e.g., "BF > 10 holds for all priors with σ > 0.5").
  * **How It Changes Practice:**
    * **Reviewer Responses:** Authors defend priors using evidence-based ranges instead of arbitrary defaults.
    * **Exploratory Work:** Uses weakly informative priors to stabilize estimates without strong claims.
    * **Policy Applications:** Regulatory decisions incorporate prior robustness explicitly.
  * **Tractability:** 
    * Requires meta-research on effect size distributions. 
    * Sensitivity tools exist but need standardization.
  * **Move Up If:** Major repositories (e.g., Cochrane, OSF) host prior libraries; agencies like EPA/IARC use robustness scores.  
  * **Move Down If:** Fields reject any prior as unscientific; elicitation proves too time-consuming.

  ---

  ### **Why This Order & What You’ve Seen**
  1. **Pre-registration (#1)** attacks the *incentive structure* behind p-hacking—your career taught you how publication pressure distorts decisions. Hybrid templates make Bayesian thinking unavoidable *early*.
  2. **Design/Power (#2)** fixes the "garbage in, garbage out" problem. You’ve seen underpowered studies waste resources. Assurance quantifies uncertainty *before* data collection.
  3. **Translation Metrics (#3)** meet scientists where they are (p-values) but force a Bayesian lens. Decades of p < 0.05 fetishism demand bilingual reporting.
  4. **Multiplicity (#4)** solves NHST’s most glaring flaw in modern data-rich fields. You’ve witnessed Bonferroni corrections massacre true effects.
  5. **Priors (#5)** addresses the loudest Bayesian objection last—because scientists will accept "controlled subjectivity" only *after* seeing value elsewhere.

  ---

  ### **Traction Indicators to Watch**
  - **Upward Shifts:** Policy mandates (funders/journals), turnkey software adoption (>10% of papers in key fields), curricular changes.
  - **Downward Shifts:** Ritualistic reporting without comprehension, computational barriers persisting, philosophical infighting.

  This agenda sidesteps foundational debates and instead **engineers pragmatic hybrid workflows**. By embedding Bayesian concepts into existing scientific rituals (pre-registration, power analysis, results reporting), it leverages institutional momentum to change practice—exactly what decades of misuse demand.
