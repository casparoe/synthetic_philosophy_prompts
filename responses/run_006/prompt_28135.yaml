  - **True by conventions** → **Modal Conventionalism** (e.g., Carnap, Sidelle: Modality reduces to linguistic rules).  
  - **True by fiction** → **Modal Fictionalism** (e.g., Rosen: Claims are true iff they follow from a fiction of possible worlds).  
  - **Neither** → *Unexplored branch*: E.g., modal eliminativism (denies modal truths) or primitivism (modality is brute).  

