  ### **Decision Tree for Modal Metaphysics**

  **Root Question (Case B):**  
  *Imagine a world that is qualitatively identical to the actual world in every respect, except that you chose a different career (e.g., you became an artist instead of a philosopher). Is the person in that world—who has your name, memories, body, and life history, but a different career—actually **you**?*  
  - **Yes** → Go to **Question 2A**.  
  - **No** → Go to **Question 3**.

  **Question 2A (Follows "Yes" to Root; Tests transworld identity further):**  
  *Now consider a world where you were never born, but your parents had a different child who coincidentally has all of your qualitative properties (appearance, personality, etc.). Is that child **you**?*  
  - **Yes** → Go to **Question 2B**. *(Rare view, not a leaf—see notes below)*  
  - **No** → Go to **Question 2C**.

  **Question 2B (Follows "Yes" to 2A; Unattractive branch):**  
  *This view claims you could be qualitatively duplicated by a different individual (e.g., with different origins). Do you also think that two qualitatively identical worlds must represent the same possibility (no distinct worlds differing only non-qualitatively)?*  
  - **Yes** → **Unattractive/unexplored position**: *Bundle Theory with Purely Qualitative Essence*. (No major theorist defends this; it violates intuitions about origins and primitive identity.)  
  - **No** → *Incoherent branch*: Qualitative duplication without identity constraints contradicts transworld identity.  

  **Question 2C (Follows "No" to 2A; Case C):**  
  *Imagine two worlds that are qualitative duplicates (identical in all properties like mass, charge, appearance, etc.), but where the individuals "swap" roles (e.g., in World 1, person A is president and B is a poet; in World 2, A is a poet and B is president). Are these:  
  (a) Two distinct possibilities?  
  (b) One possibility (since qualitatively identical)?*  
  - **(a) Two distinct possibilities** → **Haecceitism** (Transworld identity via primitive "thisness"; e.g., Plantinga, Adams).  
  - **(b) One possibility** → **Qualitative essentialism** (Transworld identity via origin or kind-essence; e.g., Kripke, Mackie).  

  **Question 3 (Follows "No" to Root; Case A):**  
  *When we say "Humphrey could have won the election," is this claim literally about Humphrey himself (i.e., that Humphrey, in some other world, won), or is it about someone else who resembles Humphrey (e.g., a "twin" in another world)?*  
  - **Literally about Humphrey** → *Incoherent branch*: Denies the root "no" (transworld identity was rejected).  
  - **About someone else** → Go to **Question 4**.  

  **Question 4 (Follows "About someone else" to 3; Tests world-realism):**  
  *Is the truth of "Humphrey could have won" grounded in real entities (e.g., worlds or counterparts) that exist independently of our language or stories?*  
  - **Yes** → Go to **Question 5**.  
  - **No** → Go to **Question 6**.  

  **Question 5 (Follows "Yes" to 4; Tests world-concreteness):**  
  *Are these truthmaking entities concrete (like parallel universes with physical inhabitants) or abstract (like stories or sets of properties)?*  
  - **Concrete** → **Lewisian counterpart theory** (e.g., Lewis: Individuals are world-bound; counterparts ground *de re* claims).  
  - **Abstract** → **Ersatz counterpart theory** (e.g., Forbes: Abstract worlds with counterparts; no transworld identity).  

  **Question 6 (Follows "No" to 4; Tests anti-realism):**  
