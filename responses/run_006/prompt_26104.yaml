answer: |-
  Based on your description, the cognitive science of religion (CSR) community absolutely *has* identified and extensively studied this pattern. The established term you're looking for is **Minimally Counterintuitive Concept (MCI)**.

  Here's the breakdown matching your needs:

  1.  **The Core Term: Minimally Counterintuitive Concept (MCI)**
      *   **Definition:** An MCI is a concept that violates *exactly one or two* core expectations (inferences) generated by our innate, domain-specific cognitive systems (intuitive ontology), while otherwise *preserving* the core structure and expectations of that ontological category.
      *   **Key Theorists:** This concept is most strongly associated with **Pascal Boyer** (especially his book *Religion Explained*) and **Justin L. Barrett**, drawing on foundational work in cognitive anthropology and psychology by figures like Scott Atran and Dan Sperber.
      *   **Mechanism:** MCIs are argued to possess a **cognitive optimum** for recall and transmission:
          *   **Memorability:** The single violation makes them **salient** and distinctive (similar to the von Restorff effect), grabbing attention.
          *   **Transmissibility:** Crucially, by preserving the rest of the category structure, they remain **easily processable** by our cognitive systems. Our brains can readily handle the single "glitch" because the underlying framework is intact and familiar. We know how to think *about* a person (even if they lack a body) or a snake (even if it talks) or water (even if it heds miraculously).
          *   **Inferential Potential:** The violation often creates interesting gaps or questions that invite explanation, narrative, and ritual (e.g., *why* can't the ghost move on? *How* did the snake talk?).

  2.  **Relation to Broader Memory Effects:**
      *   The MCI effect is a *specific* and *refined* application of broader cognitive principles like salience (von Restorff) and schema theory. It explicitly links **which** schemas (intuitive ontological categories) are being violated and **how much** they are violated to cultural success, particularly in the domain of religious and supernatural concepts. It's not *just* about being odd; it's about being odd in a very specific, cognitively manageable way.

  3.  **Edge Cases & Refinements:**
      *   **How Many Violations Are Too Many?** Empirical research (e.g., recall experiments by Barrett, Boyer, Atran & Norenzayan) consistently shows a "**sweet spot**":
          *   Concepts with **0 violations** (purely intuitive) are easily processed but often too mundane to be memorable/salient in supernatural contexts.
          *   Concepts with **1-2 violations** (MCIs) show the **peak recall and transmission success**.
          *   Concepts with **3+ violations** (Maximally Counterintuitive Concepts) become **cognitively cumbersome**, harder to process, remember, and transmit reliably. They lose inferential potential because too much of the underlying structure is broken. (This perfectly explains why complex theological concepts like the Trinity struggle outside literate, specialized contexts - they are maximally counterintuitive).
      *   **Does the Domain Matter?** **YES.** Research suggests:
          *   **Violations of Folk Psychology (Theory of Mind):** Concepts that preserve psychological properties (beliefs, desires, intentions) while violating physical/biological properties (e.g., a bodiless ghost, an invisible spirit, a statue that listens to prayers) are **particularly potent and resilient**. Agency and intention are highly attention-grabbing and inferentially rich.
          *   **Violations of Folk Biology:** Violating core biological properties (e.g., a snake that talks, a tree that bleeds, an immortal person) is also highly successful, often because it intersects with psychological interest (agency) or physical properties.
          *   **Violations of Folk Physics:** Violating core physical properties (e.g., an object that disappears/reappears, water that walks uphill, a mountain that floats) can be memorable, but may be slightly less resonant *on average* than psychological violations *unless* they are linked to agency or have clear practical implications. Pure physical violations without psychological hooks might be less culturally sticky.
          *   **Hybrids:** Concepts violating one domain across two categories (e.g., a creature that is part human/part animal) are also common MCIs.

  4.  **Key Supporting Terms & Concepts for Your Syllabus:**
      *   **Intuitive Ontology (or Domain-Specific Cognition):** The innate, developmentally early cognitive systems that generate default expectations about different categories of things in the world (e.g., Folk Physics, Folk Biology, Folk Psychology). These are the "mundane" expectations that MCIs minimally violate.
      *   **Cognitive Optimum:** The idea that MCIs hit a balance between salience (from violation) and processability (from preservation) that maximizes their memorability and transmissibility.
      *   **Hyperactive Agency Detection Device (HADD):** A related CSR concept explaining the tendency to attribute agency (a core folk psychological property) even when it's not there, often interacting with MCI formation (e.g., seeing agency in a moving bush makes it a candidate for becoming a "god of the bush").
      *   **Theological Correctness:** The observed gap between the complex, theologically "correct" beliefs held by experts (e.g., omnipresent, immaterial God) and the more intuitive, often MCI-based beliefs held by ordinary practitioners (e.g., God as an old man in the sky who listens to prayers). This *directly* relates to your observation about baroque theology vs. popular transmission.

  **Recommendations for Your Syllabus:**

  *   **Core Reading:** Assign Chapter 1 ("What is the origin?" - specifically the section on "Supernatural Concepts") and Chapter 2 ("Why do beliefs in supernatural agents persist?") from Pascal Boyer's *Religion Explained* (or his earlier article "Functional Origins of Religious Concepts" in *Journal of the Royal Anthropological Institute*). This is the canonical source for MCIs.
  *   **Empirical Support:** Include Justin Barrett's work, such as his article "Exploring the Natural Foundations of Religion" (*Trends in Cognitive Sciences*) or sections from *Why Would Anyone Believe in God?* which often discuss MCIs and HADD. Scott Atran's *In Gods We Trust* is also foundational.
  *   **Key Study:** Reference the classic recall experiments (e.g., Barrett & Nyhof; Boyer & Ramble; Atran & Norenzayan) comparing memory for intuitive, MCI, and maximally counterintuitive concepts.
  *   **Discussion Questions:**
      *   Why might minimally counterintuitive concepts be more successful than purely intuitive or wildly impossible ones?
      *   How does the "theological correctness" phenomenon relate to the MCI hypothesis?
      *   Can you identify MCIs in different religious traditions? What domains are being violated?
      *   Are there *non*-religious concepts (e.g., in folklore, advertising, urban legends) that also seem to follow the MCI pattern?

  This terminology ("Minimally Counterintuitive Concept," "Intuitive Ontology," "Cognitive Optimum") is standard in the American CSR literature and will provide your students with the precise framework to analyze the phenomenon you've astutely observed. It directly addresses your core question about the structure of successful religious concepts and the failure of overly baroque ones.
