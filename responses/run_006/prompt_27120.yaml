prompt: |-
  I'm organizing a small workshop on anthropic reasoning and decision theory, and I want one of the sessions to model what a serious adversarial collaboration between proponents of the self-sampling assumption (SSA) and the self-indication assumption (SIA) would actually look like. I've recruited two participants — one who has defended SSA in print and one who has defended SIA — and I've asked them to produce a joint document they can both sign. I'd like you to draft that document for them, as a starting point for their discussion. The structure should be as follows. First, a numbered list of claims that both sides agree on: about the formal setup, about what the problem is, about which thought experiments are centrally relevant, about what would constitute a resolution, and about what both sides are committed to rejecting (for instance, both reject the idea that anthropic reasoning is meaningless or that one can simply ignore indexical uncertainty). Second, a table of disagreements: each row should state the point of disagreement in neutral terms, then give the SSA-side formulation of their own view and the SIA-side formulation of theirs, each phrased in a way that its own proponents would accept as accurate and fair. Third, a list of cruxes — the sub-questions on which the dispute turns, such that if they were settled, at least one side would change its view. For each crux, I want: what both sides agree would count as evidence bearing on it, and what each side predicts about that evidence. The presumptuous philosopher thought experiment should feature prominently, since it is a case where the two views diverge so starkly that it forces the issue. But I would also like the document to address the doomsday argument, the sleeping beauty problem, the self-sampling assumption's handling of reference classes, and the question of whether anthropic probabilities should be thought of as epistemic or as something more like objective chances. Finally, I want the document to include a short section at the end where each side states, in their own words, what they take to be the strongest argument for the other side — the thing that gives them the most pause about their own view. The goal is a document that is genuinely constructive, that neither side would feel misrepresents them, and that sharpens the disagreement rather than papering it over.
reasoning: |-
  We are drafting a joint document for an adversarial collaboration between proponents of SSA and SIA. The structure is as follows:

  1. **Agreed Claims**: A numbered list of claims both sides agree on.
  2. **Table of Disagreements**: A table with rows for each disagreement, stating:
     - The neutral point of disagreement
     - The SSA proponent's view in their own terms
     - The SIA proponent's view in their own terms
  3. **Cruxes**: A list of cruxes, each with:
     - What the crux is
     - What both sides agree would count as evidence
     - What each side predicts about that evidence
  4. **Strongest Argument for the Other Side**: A short section where each side states the strongest argument for the other side.

  We are to cover:
  - The presumptuous philosopher (PP)
  - The doomsday argument (DA)
  - The sleeping beauty problem (SB)
  - Reference classes for SSA
  - Whether anthropic probabilities are epistemic or more like objective chances

  Let's start with the agreed claims.

  ### 1. Agreed Claims

  Both sides agree on the following:

  1. **Formal Setup**: We are dealing with situations involving indexical uncertainty, where an agent must assign probabilities to different hypotheses about the world that have implications for the number and/or identity of observers in that world. The agent is aware that they are one of the observers, but does not know which one.

  2. **The Problem**: The central problem of anthropic reasoning is how to update one's beliefs (i.e., assign probabilities) in light of indexical information, especially when the hypotheses under consideration imply different numbers of observers.

  3. **Relevant Thought Experiments**: The following thought experiments are centrally relevant and should be used to test anthropic theories:
     - The Doomsday Argument (DA)
     - The Sleeping Beauty Problem (SB)
     - The Presumptuous Philosopher (PP)
     - The Adam and Eve thought experiment (if we have time, but we can skip if not central to the core dispute)

  4. **What Constitutes a Resolution**: A resolution would require a theory that:
     - Is formally consistent and avoids paradoxes in the relevant thought experiments.
     - Agrees with our intuitive judgments in clear cases (if such exist) or explains why those intuitions are wrong.
     - Can be extended to a wide range of cases without ad hoc adjustments.

  5. **Commitments**: Both sides reject the idea that anthropic reasoning is meaningless or that one can simply ignore indexical uncertainty. Both agree that probabilities in these contexts are epistemic and represent degrees of belief. Both also agree that the reference class problem (i.e., which set of observers one should consider oneself a random sample from) is a critical issue that must be addressed.

  6. **Formal Representation**: Both sides agree that the probabilities should satisfy the axioms of probability theory and that updating should occur via conditionalization (or a generalized version thereof) when new information is acquired.

  ### 2. Table of Disagreements

  We now present the key disagreements in a table. Each row states a neutral point of disagreement, then the SSA and SIA positions in their own terms.

  | Neutral Disagreement | SSA Position | SIA Position |
  |----------------------|--------------|--------------|
  | **Core Principle**: How should one weigh the likelihood of being a particular observer in a world? | **SSA**: One should reason as if one were a random sample from the set of all possible observers in the reference class within one's world. The probability of being a particular observer is inversely proportional to the total number of observers in that world (if they are indistinguishable). | **SIA**: One should reason as if one's existence is evidence for the existence of other observers. The probability of a world is proportional to the prior probability of that world multiplied by the number of observers in it (if they are indistinguishable). |
  | **Presumptuous Philosopher (PP)**: Two theories are equally simple and fit the data equally well, but one predicts a trillion observers and the other a billion. What is the probability that the trillion-observer theory is true? | **SSA**: The probability should be 50% because the fact that we exist does not give evidence for the trillion-observer theory over the billion-observer theory. We are a random sample from whichever world is actual, so the probability of being us is the same in both theories. | **SIA**: The probability should be approximately 99.9% (a trillion to one) because the prior probability is updated by the likelihood of our existence, which is a trillion times higher in the trillion-observer theory. |
  | **Doomsday Argument (DA)**: How likely is it that humanity will go extinct soon? | **SSA**: The DA is valid: we should reason that we are a random sample from all humans that will ever exist. If the total number of humans is small, we are more likely to be born early. Thus, the argument supports a higher probability of early extinction. | **SIA**: The DA is invalid: the fact that we exist is evidence that many humans exist. This counteracts the effect of being an early human. Thus, the DA's conclusion does not hold. |
  | **Sleeping Beauty Problem (SB)**: What should Sleeping Beauty's credence be that the coin landed Heads when she wakes up? | **SSA**: 1/3. There are three possible awakenings (Heads-Monday, Tails-Monday, Tails-Tuesday), each equally likely, and only one has Heads. | **SIA**: 1/2. The coin is fair, and the awakenings are not equally likely because the Tails-awakenings are in the same world. Our existence as an awakening is not a random sample from all awakenings but is tied to the world. [Note: SIA is often associated with the 1/2 position, but there is variation. We present a common SIA view.] |
  | **Reference Class**: Which set of observers should be in the reference class? | **SSA**: The reference class must be carefully chosen to include only observers that are "like us" in relevant ways. The choice is crucial and somewhat subjective, but necessary. | **SIA**: The reference class problem is less severe because SIA automatically weights worlds by their number of observers. However, the problem does not disappear entirely because we must still decide which entities count as observers. |
  | **Nature of Probabilities**: Are anthropic probabilities purely epistemic or more like objective chances? | **SSA**: They are purely epistemic and represent self-locating uncertainty. | **SIA**: They are also epistemic, but the update rule (factoring in the number of observers) is necessary to account for the fact that we are more likely to exist in a world with more observers. |

  ### 3. Cruxes

  We now list the cruxes of the disagreement. For each, we state:

  - The crux question.
  - What both sides agree would count as evidence.
  - What each side predicts about that evidence.

  #### Crux 1: The Presumptuous Philosopher Experiment

  - **Crux Question**: In the PP experiment, if we could run an experiment where we have two theories T1 (trillion observers) and T2 (billion observers) that are otherwise equally likely, and we are about to perform a test that will definitively confirm one theory, what should our credence be in T1?
  - **Agreed Evidence**: A real-world analog where we can set up a controlled experiment with two theories that differ only in the number of observers they predict and then run the experiment to see which theory is confirmed. However, since this is practically impossible, we rely on the thought experiment and the consistency of the theories with other intuitions.
  - **SSA Prediction**: The credence should be 50% because there is no evidence to distinguish the theories. The fact that we exist does not favor one over the other.
  - **SIA Prediction**: The credence should be approximately 99.9% (a trillion to one) because the existence of an observer is more likely under T1.

  #### Crux 2: The Doomsday Argument

  - **Crux Question**: If we consider a scenario where we know the birth rank of every human and we are at a relatively early rank, does this increase the probability that the total number of humans is small?
  - **Agreed Evidence**: Historical and future data on human population. For example, if we could simulate many civilizations with varying lifespans and then observe the birth ranks of a random observer in each, we could see whether early birth ranks are more common in short-lived civilizations.
  - **SSA Prediction**: Yes, because in a short-lived civilization, a random observer is more likely to be born early. Therefore, being born early is evidence for a short-lived civilization.
  - **SIA Prediction**: No, because the existence of an observer at all is more likely in a long-lived civilization (with many observers). This counterbalances the effect of being early. Therefore, being born early does not necessarily increase the probability of a short-lived civilization.

  #### Crux 3: The Sleeping Beauty Problem

  - **Crux Question**: When Sleeping Beauty wakes up, what should her credence be that the coin landed Heads?
  - **Agreed Evidence**: The results of repeated betting scenarios. For instance, if we run the experiment many times and Sleeping Beauty is asked to bet on Heads each time she wakes up, what betting strategy would yield the highest expected return?
  - **SSA Prediction**: Betting as if the probability of Heads is 1/3 would yield the highest expected return because in the long run, Heads occurs in 1/3 of the awakenings (since Tails leads to two awakenings per experiment).
  - **SIA Prediction**: Betting as if the probability of Heads is 1/2 would be correct because the coin is fair and the awakenings are not independent events. Alternatively, SIA proponents might argue that the problem is not directly about anthropics but about self-location, and they might adopt a 1/2 view by rejecting the idea that awakenings are equally likely.

  #### Crux 4: Reference Class

  - **Crux Question**: How does the reference class affect the predictions? Specifically, if we change the reference class (e.g., to include all conscious beings or only humans), do the probabilities change and in what way?
  - **Agreed Evidence**: Thought experiments where the reference class is manipulated, such as considering an experiment that includes non-human observers or observers with different properties.
  - **SSA Prediction**: The reference class choice is critical and subjective. Changing the reference class can lead to different probability assignments, and there is no objective way to fix it.
  - **SIA Prediction**: The reference class problem is mitigated because SIA weights by the number of observers. However, the choice of which entities are considered observers is still necessary, but it is less sensitive to the exact boundaries because the weighting by observer count dominates.

  ### 4. Strongest Argument for the Other Side

  #### From the SSA Proponent's Perspective
  "The strongest argument for SIA is that it naturally avoids the Doomsday Argument, which I must admit leads to a conclusion that many find counterintuitive and pessimistic. Moreover, SIA provides a simple and unified way of handling anthropic reasoning by weighting hypotheses by the number of observers, which seems to capture the idea that we are more likely to find ourselves in a world that has more observers."

  #### From the SIA Proponent's Perspective
  "The strongest argument for SSA is its straightforward application to the Sleeping Beauty problem, where it yields the 1/3 answer that matches the betting odds. Additionally, SSA avoids the 'presumptuousness' of SIA in the Presumptuous Philosopher experiment, which seems to allow us to make extremely confident predictions about the universe without any empirical evidence just because one theory predicts more observers."

  ---

  This joint document is a starting point for discussion. We have laid out the agreements, disagreements, and cruxes, and each side has acknowledged the strength of the other's position. We hope this will foster a productive collaboration.
answer: |-
  ### Joint Document on Anthropic Reasoning: SSA vs. SIA  
  **Produced by Adversarial Collaborators**  
  *(Draft for Workshop Discussion)*  

  ---

  ### I. Agreed Claims  
  Both signatories endorse the following:  

  1. **Formal Setup**:  
     - Anthropic reasoning applies to agents with *indexical uncertainty*: uncertainty about their identity or spatiotemporal location within a possible world.  
     - Hypotheses can differ in the *total number of observers* they predict (e.g., "Humanity survives 1,000 years" vs. "Humanity survives 100,000 years").  
     - Probabilities must satisfy Kolmogorov axioms and be updated via conditionalization.  

  2. **Core Problem**:  
     - The central challenge is assigning *epistemic probabilities* to hypotheses when the evidence ("I exist") is indexical and the hypotheses imply different observer populations.  
     - Neither side denies that indexical evidence provides legitimate information.  

  3. **Relevant Thought Experiments**:  
     - The **Doomsday Argument** (DA), **Sleeping Beauty** (SB), and **Presumptuous Philosopher** (PP) are indispensable for testing theories.  
     - PP is the sharpest divergence point and must be addressed directly.  
     - Reference-class issues (e.g., "What counts as an observer?") are unavoidable and materially affect predictions.  

  4. **Resolution Criteria**:  
     - A viable theory must:  
       - Avoid contradictions or absurdities in all above cases.  
       - Be *framework-consistent* (e.g., no arbitrary adjustments per scenario).  
       - Ground probabilities in epistemic rationality (not metaphysical "chances").  
     - Both reject:  
       - Dismissing anthropic reasoning as incoherent.  
       - Ignoring indexical uncertainty (e.g., treating "I exist" as non-informative).  

  5. **Shared Commitments**:  
     - Probabilities are *epistemic* (degree of belief), not objective chances.  
     - The reference class cannot be "all possible observers" without boundary constraints.  
     - DA, SB, and PP are valid probes of anthropic principles (not misleading distractions).  

  ---

  ### II. Table of Disagreements  
  *Neutral descriptions precede partisan formulations.*  

  | **Point of Disagreement** | **SSA Proponent's Position** | **SIA Proponent's Position** |
  |---------------------------|------------------------------|------------------------------|
  | **Core Principle**: How should indexical evidence ("I am an observer") update probabilities over hypotheses with varying observer counts? | **SSA**: "I am a random sample from the reference class in my world. My existence doesn’t preferentially favor hypotheses with more observers. Probabilities weight worlds *equally*, then sample observers *within* them." | **SIA**: "My existence is *evidence* for hypotheses with more observers. Probabilities weight worlds *proportionally to their observer count*. I am more likely to exist in a world with more observers." |
  | **Presumptuous Philosopher (PP)**: Two theories predict identical data, but Theory A predicts 10^12 observers, Theory B 10^9. What is P(A)? | **SSA**: "P(A) = 0.5. With no non-indexical evidence, theories are equally likely. Sampling *within* a world makes my observation uninformative about total observers." | **SIA**: "P(A) ≈ 1. Theory A has 1,000× more observers, so my existence is 1,000× more likely under A. Indexical evidence strongly favors larger populations." |
  | **Doomsday Argument (DA)**: Does observing an early birth rank (e.g., 60 billionth human) increase the probability of humanity’s imminent extinction? | **SSA**: "Yes. With a uniform prior over human birth ranks, an early rank is more likely if the total human population is small. DA is rationally compelling." | **SIA**: "No. SIA’s prior bias toward larger populations cancels DA’s effect. My existence suggests many humans existed *before* me, negating the inference to early doom." |
  | **Sleeping Beauty (SB)**: Upon waking, what is Beauty’s credence that a fair coin landed Heads? | **SSA**: "P(Heads) = 1/3. Three possible awakenings (Heads-Mon, Tails-Mon, Tails-Tue) are equiprobable; only one has Heads. Indexical uncertainty requires sampling awakenings." | **SIA**: "P(Heads) = 1/2. The coin’s objective chance is unchanged. Awakenings aren’t independent observers; SIA applies to *worlds*, not subagents. Tails doesn’t ‘create’ extra reasoners." |
  | **Reference Class**: How does the choice of reference class (e.g., "humans" vs. "conscious beings") affect probabilities? | **SSA**: "Reference classes are essential but problematic. Probabilities vary with class definition (e.g., including AI alters DA). We need objective constraints (e.g., ‘information-sensitive’ observers)." | **SIA**: "SIA reduces reference-class sensitivity. Weighting by observer count dilutes arbitrary boundaries (e.g., including AI barely affects DA if human counts dominate)." |
  | **Probability Interpretation**: Are anthropic probabilities purely epistemic, or do they reflect "objective" weights? | **SSA**: "Purely epistemic. They quantify self-locating uncertainty under minimal assumptions (e.g., no added ‘principle of indifference’ for worlds)." | **SIA**: "Purely epistemic, but SIA’s world-weighting is *required* by evidential updating. Ignoring observer counts misrepresents indexical evidence." |

  ---

  ### III. Cruxes  
  *Sub-questions that would force one side to concede if resolved. Both agree on evidence types.*  

  1. **Crux: Does indexical evidence inherently favor larger populations?**  
     - **Evidence**: Empirical frequency of "being an observer" in simulations with varying population sizes (e.g., simulated universes with fixed resources split into few-large/many-small observer groups).  
     - **SSA Prediction**: Observers are equally likely to find themselves in any simulated universe, regardless of population size.  
     - **SIA Prediction**: Observers are more frequently found in large-population simulations.  

  2. **Crux: Is the Presumptuous Philosopher a reductio ad absurdum?**  
     - **Evidence**: A real-world analog: e.g., measuring cosmology with two theories identical except for predicted galaxy counts (where "observers per galaxy" is fixed).  
     - **SSA Prediction**: Data from one galaxy cannot distinguish theories; P(A) remains 0.5 until non-indexical evidence (e.g., CMB) is found.  
     - **SIA Prediction**: Observing *any* galaxy strongly favors the theory with more galaxies (via higher observer count).  

  3. **Crux: Does Sleeping Beauty generalize to anthropic population problems?**  
     - **Evidence**: A modified SB with unequal observer counts (e.g., Heads: 1 observer, Tails: 1,000 observers in identical rooms). Upon waking, what is P(Heads)?  
     - **SSA Prediction**: P(Heads) = 1/1001. You are more likely to be awake in Tails-world.  
     - **SIA Prediction**: P(Heads) = 0.5. The coin’s fairness dominates; awakenings aren’t independent samples.  

  4. **Crux: Can SSA avoid DA without ad hoc adjustments?**  
     - **Evidence**: Birth-rank distributions in human-like civilizations with known extinction dates (via simulations/historical analogs).  
     - **SSA Prediction**: Early birth ranks correlate strongly with shorter civilization durations.  
     - **SIA Prediction**: Birth ranks show weak/no correlation with duration; larger populations dilute the effect.  

  ---

  ### IV. Strongest Argument for the Other Side  
  **SSA Proponent’s Statement**:  
  > "SIA’s greatest strength is dissolving the Doomsday Argument. If SIA is correct, humanity’s potential longevity isn’t penalized by our birth rank—aligning with intuitive optimism. SIA also elegantly handles reference-class problems by weighting worlds, sidestepping debates about ‘which observers count.’ This feels like a *unifying* solution, whereas SSA requires meticulous reference-class policing."  

  **SIA Proponent’s Statement**:  
  > "SSA’s handling of Sleeping Beauty is compelling. Treating awakenings as equiprobable samples yields the 1/3 answer, which matches betting-optimal behavior. SSA also resists PP’s excesses: it doesn’t permit absurdly confident claims about unobserved parts of reality. This epistemic caution feels principled—SIA’s willingness to endorse ‘presumptuous’ inferences seems like overreach, risking detachment from physical evidence."  

  ---  
  **Signed,**  
  [Name], SSA Proponent  
  [Name], SIA Proponent  

  ---  
  **Purpose**: This document sharpens disagreements while establishing common ground. It enables workshop participants to test cruxes empirically/simulatively and evaluate which theory better satisfies the agreed resolution criteria.
