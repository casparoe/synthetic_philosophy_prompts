prompt: |-
  I have been trying to get clear about how I should respond to decisions that involve tiny probabilities of enormous stakes, and my intuitions keep pulling me in different directions depending on the details of the case. I would like to know whether there is a single principle that captures all or most of my verdicts, and if not, which verdicts I should revise and why.

  Here are the cases and my untutored reactions:

  1. **The street mugger.** A stranger approaches me and says: "Give me ten dollars, or I will use my hidden powers to create and torture a googolplex of sentient beings." I do not pay. If I took the threat at face value, the expected disvalue would be astronomically negative, but I dismiss it entirely — the probability that this person has such powers is not merely small but, I want to say, not one I am obliged to take seriously at all.

  2. **The physics experiment.** A consortium of physicists proposes a high-energy experiment. Their best models indicate a 1-in-10^25 chance that the experiment triggers a vacuum phase transition that would destroy the entire observable universe. We could instead pursue a safer experimental design, at an additional cost of fifty billion dollars, which would reduce the risk to 1-in-10^40. My reaction is: spend the money. A 1-in-10^25 chance of ending everything is too high, even though the number sounds minuscule in absolute terms.

  3. **The mathematical lottery.** I am offered a ticket for one dollar. The ticket gives me a precisely defined 1-in-10^100 chance of winning 10^200 dollars, where the mechanism is a mathematically specified random process with no ambiguity about the probabilities. The expected value is 10^100 dollars, an incomprehensibly large sum. And yet I would not buy the ticket. It feels like a trick, even though the probabilities and payoffs are mathematically exact.

  4. **The ordinary lottery.** A standard lottery ticket costs one dollar and offers a 1-in-10-million chance at five million dollars. The expected value is fifty cents, so it is a bad bet in expectation, but I do not find it absurd to play. If the prize were raised to twenty million, giving the ticket a positive expected value of two dollars, I would play without hesitation.

  5. **The crank with a proof.** Someone emails me claiming to have a proof that settles a major open problem in my field. They offer to sell me the proof for five hundred dollars. I have no way to estimate the probability that they are telling the truth — they could be a genius, a crank, or a prankster. The value of a genuine proof would be enormous for my career. But I do not pay. The expected-value calculation seems to require a probability I cannot even begin to assign, and that very fact feels like a reason to walk away.

  6. **The daily drive.** Every time I drive to the grocery store, I face a roughly 1-in-10-million chance of dying in a car crash. I do this several times a week without a second thought, and this seems perfectly reasonable.

  7. **Pascal's wager, modernized.** An otherwise intelligent friend argues that I should devote my life to a particular religion because, even if the chance that its eschatology is correct is vanishingly small, the payoff is infinite and so dominates all finite considerations. I find the argument uncompelling, but I have a harder time saying exactly why it fails than I do with the street mugger — the structure of the argument feels harder to dismiss, even though I am confident the conclusion is wrong.

  These verdicts seem to be in tension. Cases 2 and 6 suggest that tiny probabilities of enormous stakes should be taken perfectly seriously. Cases 1, 3, 5, and 7 suggest that sometimes they should not be. Case 4 sits comfortably in the middle. I can feel that something about the source or grounding of the probability matters — the physics experiment involves a probability embedded in a well-tested scientific model, while the mugger's probability is pulled from nowhere — but I am not sure that distinction can carry the weight I want it to, especially when I look at case 3, where the probability is mathematically precise and yet I still balk.

  Is there a principle that gets all or most of these verdicts right? If no single principle can accommodate them, which verdicts should I overturn, and on what grounds? And what does the principle you propose say about a case I have not listed: a government program that, for an expenditure of a billion dollars, would reduce the annual probability of a catastrophic global pandemic from two percent to one percent?
reasoning: |-
  Okay, the user is grappling with how to handle decisions involving tiny probabilities of enormous stakes. They've provided seven scenarios where their intuitions pull in different directions, and they're looking for a unifying principle. Let me start by breaking down each case to see the patterns.

  First, the street mugger: They dismiss the threat even though the disvalue is huge. The probability isn't grounded in anything credible. Then the physics experiment: They want to spend money to reduce a tiny risk because it's based on scientific models. The mathematical lottery has precise odds, but they still wouldn't buy the ticket—expected value is high, but the chance is too small. The ordinary lottery feels acceptable with positive EV. The crank with a proof: No reliable probability estimate, so they walk away. Daily driving has a small risk, but it's routine. Pascal's wager promises infinite reward but feels unconvincing.

  The tension is clear. Cases 2 and 6 show taking small risks seriously when grounded, while others ignore them. The user suspects the source of probability matters. They mention case 3 as a problem because it's mathematically precise yet rejected. 

  Looking deeper, the user might be wrestling with practical decision-making under uncertainty, especially when probabilities are extreme. They might need a framework that incorporates epistemic justification and pragmatic constraints. The unspoken need could be seeking confidence in real-world choices without getting paralyzed by theoretical extremes.

  EPEV comes to mind: Expected Value but only when probabilities are epistemically justified. This explains dismissing the mugger (no justification) and the physics risk (well-supported). It handles the math lottery by allowing exclusion of near-zero probabilities pragmatically. The ordinary lottery's positive EV makes sense. Pascal's wager fails because the probability is unjustified. Daily driving is routine risk accepted socially.

  For the pandemic case: A 1% absolute reduction (50% relative) in a significant risk is worth the cost. The probability is grounded, so EPEV applies. The user's intuition likely aligns here. They might need reassurance that it's not about the numbers alone but the credibility and context. Also, acknowledging that some decisions require qualitative judgment when quantification is impossible (like the crank's proof).

  Potential objections: Why exclude near-zero probabilities? Because in practice, resources and attention are limited. Case 3's ticket isn't bought because the expected value, while huge, is practically inaccessible. The dollar could be better used elsewhere. Similarly, Pascal's wager demands life devotion based on an unsubstantiated probability, which isn't reasonable.

  The user might worry about inconsistency, but EPEV provides a consistent lens. Revising verdicts: Maybe case 3 could be seen as rational to buy, but the user's reluctance is understandable under pragmatic constraints. The key is distinguishing between theoretical rationality and practical decision-making. 

  Ultimately, the user needs a principle that avoids gullibility in low-probability threats while responsibly addressing credible existential risks. EPEV does that by tying action to well-supported probabilities and allowing pragmatic thresholds. The pandemic case confirms the principle's applicability to policy decisions with measurable risks.
answer: |-
  Your intuitions are insightful and reveal a fundamental tension in decision theory. The key lies in **Epistemically Justified Expected Value (EPEV)**, which incorporates both probability grounding *and* pragmatic thresholds. Here's how it works:

  **The EPEV Principle:**
  > We should act based on expected value calculations *only* when:
  > 1. **Probabilities are epistemically justified** (grounded in evidence/models/reason), *and*
  > 2. **The stakes surpass a pragmatic threshold** (avoiding paralysis from infinitesimal probabilities).

  This principle explains all your cases:

  1. **Street Mugger**: ❌ *Dismissed correctly.*  
     Probability lacks epistemic justification (no evidence for "hidden powers"). Pragmatic threshold also violated.

  2. **Physics Experiment**: ✔️ *Spend the money.*  
     Probabilities are grounded in scientific models (epistemically justified). Stakes (universal destruction) are astronomically high. Reducing risk from 10⁻²⁵ to 10⁻⁴⁰ is significant in expectation.

  3. **Mathematical Lottery**: ❌ *Rejecting the ticket is rational.*  
     Probability is justified (mathematically precise), but the *pragmatic threshold* applies: a 1-in-10¹⁰⁰ chance is practically indistinguishable from impossibility in a finite lifespan. Resources (even $1) are better allocated elsewhere.

  4. **Ordinary Lottery**: ✔️ *Playing is reasonable with +EV.*  
     Probability is well-grounded (known odds). Stakes are high enough to matter ($5M–$20M) yet probabilities (10⁻⁷) are above pragmatic thresholds. Positive EV makes it rational.

  5. **Crank with a Proof**: ❌ *Walking away is correct.*  
     Probability cannot be assigned any justified value (no basis to distinguish genius/crank). EPEV calculation is impossible.

  6. **Daily Drive**: ✔️ *Accepting risk is rational.*  
     Probability is well-grounded (actuarial data). Stakes (death) are high, but the risk (10⁻⁷ per trip) is below the pragmatic threshold for routine activities. Avoidance would paralyze life.

  7. **Pascal's Wager**: ❌ *Correctly uncompelling.*  
     Probability lacks epistemic justification (no evidence for *this specific* eschatology). Also violates pragmatic thresholds: infinite stakes demand *any* non-zero probability, but unjustified probabilities shouldn't compel action.

  **Resolving the Tension:**  
  - Cases 2 & 6 work because probabilities are **credible** and risks are **actionably significant** (or routinely tolerable).  
  - Cases 1, 5, & 7 fail because probabilities are **unjustified**.  
  - Case 3 fails the **pragmatic threshold** despite mathematical precision.  
  - Case 4 passes both tests.

  **Revised Verdicts:**  
  Your judgments are largely sound. Only **Case 3** might warrant refinement:  
  - *If* you have unlimited funds, buying the ticket is *theoretically* rational (infinite EV).  
  - *Practically*, rejecting it is wise. Resources should target opportunities with non-infinitesimal payoff probabilities (e.g., investing $1 in your career has higher real EV).

  **Pandemic Case Application:**  
  - **Spend the billion dollars.**  
    Probability is epistemically justified (epidemiological models). Stakes are global catastrophe. Absolute risk reduction (1% → 2%) is massive:  
    - Expected lives saved: 0.01 × 8 billion = 80 million lives.  
    - Cost per life saved: $1B / 80M = $12.50 (highly efficient).  
    This easily clears pragmatic thresholds.

  **Why This Works:**  
  EPEV avoids paralysis by:  
  - Ignoring **unfounded** probabilities (solving Pascal's Mugger).  
  - Filtering **infinitesimal** probabilities that can't impact finite beings (solving mathematical lotteries).  
  - Prioritizing actions where probabilities *and* stakes are meaningfully quantifiable.

  **Objection Handling:**  
  *But doesn't Case 3’s mathematical precision make it different from the mugger?*  
  Yes—it’s epistemically justified but pragmatically irrelevant. We face countless theoretical risks with infinitesimal probabilities; acting on all would deplete resources. We intuitively prioritize based on **magnitude-adjusted probability** (probability × stakes must exceed a context-dependent minimum to warrant attention).

  This framework preserves your core intuitions while providing a consistent standard for extreme-stakes decisions.
