answer: |-
  Below is a structured 90-minute activity designed for your reading circle. It uses physical envelopes with small monetary stakes (up to $2 per participant) to recreate the seduction of the always-switch argument, followed by a guided debrief to pinpoint the flaw. The design ensures participants generate the argument organically, distinguishes between resolutions, and addresses the limitations of finite stakes. Predictable issues and mitigations are covered at the end.

  ---

  ### **Activity: The Envelope Dilemma**
  **Duration:** 90 minutes  
  **Participants:** 14 (split into 7 pairs)  
  **Materials:**  
  - 28 plain envelopes (14 pairs).  
  - Play money: 56 bills (e.g., $0.25, $0.50, $1, $2, $4, $8). Prepare 7 sets of paired amounts:  
    - ($0.25, $0.50), ($0.50, $1), ($1, $2), ($2, $4), ($0.25, $0.50), ($0.50, $1), ($1, $2).  
  - Coins for randomization.  
  - Paper for recording decisions.  
  - A blackboard/flip chart for compiling results.  

  **Stakes:** Each participant contributes $2 upfront. Winnings are real but capped at $4/person (money is redistributed post-activity to ensure no net loss).

  ---

  ### **Structure**
  #### **1. Introduction (10 min)**  
  - **Goal:** Set up the game without revealing the paradox.  
  - **Script:**  
    > "We’re playing an envelope game. Each pair gets two envelopes: one has *x* dollars, the other has *2x*. I’ll flip a coin to assign them randomly. You’ll open yours, see the amount, and decide whether to **switch** with your partner. We’ll play two rounds. Your goal is to maximize your winnings."  
  - **Rules:**  
    - Partners decide independently (no communication).  
    - Switching only happens if **both agree** (prevents coercion).  
    - Record: (1) Amount seen, (2) Decision (switch/stay), (3) Final amount.  

  #### **2. Game Rounds (25 min)**  
  - **Round 1 (10 min):**  
    - Facilitator prepares envelopes (e.g., Pair 1: $0.25/$0.50; Pair 2: $0.50/$1, etc.).  
    - Coin flip assigns envelopes randomly.  
    - Participants open envelopes, record amounts, decide, and report outcomes.  
  - **Round 2 (10 min):**  
    - Repeat with new pairings (reassign partners) and amounts.  
  - **Facilitator Role:**  
    - Secretly track the base amount (*x*) and assignment for each pair.  
    - Collect decision sheets.  

  #### **3. Compile Results (10 min)**  
  - **Public Chart (on blackboard):**  
    | Amount Seen | # Saw | # Switched | Avg. Final if Switched | Avg. Final if Stayed |  
    |-------------|-------|------------|------------------------|----------------------|  
    | $0.25       | ...   | ...        | ...                    | ...                  |  
    | $0.50       | ...   | ...        | ...                    | ...                  |  
    | ...         | ...   | ...        | ...                    | ...                  |  
  - **Process:**  
    - Fill in counts for each amount (e.g., "Who saw $0.50? How many switched?").  
    - Calculate averages (e.g., "Switchers who saw $0.50: What did you end up with?").  

  #### **4. Generate the Always-Switch Argument (15 min)**  
  - **Prompt Discussion:**  
    > "Look at the data. If you see $*A*, what might the other envelope contain? Why did some of you switch/stay? Is there a pattern?"  
  - **Guide to Seduction:**  
    - Participants typically realize: "Other envelope is either $*A/2* or $*2A*."  
    - Ask: "If you see $*A*, how likely is it that the other is $*2A* vs. $*A/2*?"  
      - Most assume 50-50 ("equally likely").  
    - **Expected Value Calculation:**  
      - E[switch] = (0.5 × $*2A*) + (0.5 × $*0.5A*) = 1.25*$A*.  
      - Conclusion: "Always switch; you gain 25% on average!"  

  #### **5. Debrief and Analysis (25 min)**  
  **Map Activity to the Paradox:**  
  | **Paradox Element**            | **Activity Moment**                                                                 | **Flaw/Resolution**                                                                 |  
  |-------------------------------|-------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **1. Conditional Probability Claim:**<br>*"Given $A, P(2A) = P(A/2) = 0.5"* | Participants assume 50-50 likelihood after seeing amounts like $0.50/$1/$2 (which appear in multiple base pairs). | **FLAW:** In our finite distribution: <br>- $0.25 only appears as the smaller amount → Other is always $0.50.<br>- $4 only appears as the larger → Other is always $2.<br>- At boundaries, probabilities aren’t 50-50. |  
  | **2. Expected Value Calculation:**<br>*E[switch] = 1.25A* | Generated from the 50-50 assumption. Seductive for non-boundary amounts (e.g., $1 → E[switch]=$1.25). | **RESOLUTION 1 (Reject Conditional Probability):**<br>Requires knowing the prior distribution of *x*. If unknown, 50-50 is unjustified. **Cost:** Need a Bayesian prior.<br>**RESOLUTION 2 (Reject Unconditional Expectation):**<br>Irrelevant; the flaw is in conditioning on *A*. |  
  | **3. Apparent Symmetry**      | Pre-game intuition: "Envelopes are identical; switching shouldn’t matter."         | **FLAW:** Opening breaks symmetry. Your amount *A* gives information about *x*.     |  
  | **4. Background Assumption**  | Implicit belief that the distribution supports 50-50 for all *A*.                  | **FLAW:** Only holds if *x*’s distribution is "dense" (e.g., unbounded, continuous). Finite bounds violate this. |  

  **Supply the Unbounded Feature (Without Lecturing):**  
  - **Prompt:**  
    > "In our game, $0.25 and $4 were 'boundaries'—you knew the other amount. But what if amounts could be *anything*: $10, $100, $1000? Imagine I chose *x* from all positive numbers with no upper limit. Would the 50-50 assumption hold then?"  
  - **Key Insight:**  
    - In infinite sets, every *A* could (in theory) be the smaller or larger amount.  
    - **But**: If *x*’s distribution is uniform over infinite values, it becomes "improper" (probabilities don’t sum to 1). Expectation calculations break down.  

  #### **6. Wrap-up (5 min)**  
  - **Summary:**  
    > "The paradox lives in the conditional probability claim. We assumed that whatever we see, half-or-double is equally likely. But this depends entirely on how the amounts are chosen. With finite stakes or improper priors, that assumption fails."  
  - **Redistribute Money:** Ensure all money is returned.  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Participants Refusing to Switch (Risk Aversion):**  
     - *Why:* Fear of losing half, especially with larger amounts (e.g., $4).  
     - *Mitigation:* Emphasize "expected value" during the argument phase. Ask: "If you could play 100 times, would you switch?" Use data to show gains at non-boundaries.  

  2. **Filling Rule Inferred Too Quickly:**  
     - *Why:* Scientists may deduce the base set (e.g., "Amounts double each time!").  
     - *Mitigation:* Use irregular pairings (e.g., two ($0.25/$0.50) pairs). Debrief: "Even if you guessed the distribution, does that make 50-50 always true?"  

  3. **Discussion Collapses into Monty Hall:**  
     - *Why:* Both involve switching, but Monty Hall uses host information.  
     - *Mitigation:* Preemptively clarify: "Here, no one reveals information post-assignment. The amounts are fixed." Redirect to the probability claim.  

  4. **Boundary Amounts Dominate Discussion:**  
     - *Why:* Seeing $0.25 or $4 makes the flaw obvious.  
     - *Mitigation:* Use mostly non-boundary amounts (e.g., $0.50/$1/$2). In debrief, contrast boundary vs. non-boundary cases.  

  ---

  ### **Why This Works**  
  - **Seduction First:** Participants experience the argument’s pull through gameplay and data.  
  - **Precise Flaw Location:** The debrief ties moments (e.g., assuming 50-50 at $1) to the probability claim.  
  - **Finite vs. Infinite Stakes:** The activity reveals boundedness as a limitation, but the prompt on unbounded distributions extends the paradox authentically.  
  - **No Slogans:** The group leaves knowing the paradox "lives" in the unexamined conditional probability—and that fixing it requires priors or boundedness.  

  By the end, your group will have felt the seduction, dissected it, and articulated why "always switch" fails—without jargon.
