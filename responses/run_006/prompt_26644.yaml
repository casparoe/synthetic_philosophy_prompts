  so I've been trying to get clear on the "why is there something rather than nothing" question and I've come to think it's mostly just confused. here's my reasoning: the question seems to assume that "nothing" is the natural default, and that the existence of anything calls for an explanation. but that's backwards — we've never encountered "nothing," we have no reason to think it's the default, and the burden of proof should be on whoever says nothing is more natural than something. plus, any explanation you give will just be more something (god, laws, quantum fields), so the question is unanswerable by its own logic. am I right that the whole thing dissolves once you stop treating nothing as the default, or is there a version of the question that survives this?
