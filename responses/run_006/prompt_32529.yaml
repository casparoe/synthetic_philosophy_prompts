  What's particularly smart about their framing is recognizing that the infrastructure case (6) exposes the scale/tractability distinction they're uneasy about. They're absolutely right that this threatens consistency—it's the crux where their intuitions might need adjusting.

  I should acknowledge that the literature offers no clean solution here. Greaves and Lenman would agree cluelessness is paralyzing in theory, but their practical responses differ. The user needs to know that their struggle mirrors ongoing academic debates—they're not missing something obvious.

  For a constructive path forward, I'll propose the tractability principle but stress it's descriptive of their intuitions, not prescriptive. They'll likely push back on the childbearing case (2), so I should prepare to either defend its special status (reproductive autonomy as deontic constraint?) or concede it as the intuition needing revision. Since they value scientific thinking, showing how expected value calculations fail catastrophically there might persuade them.

