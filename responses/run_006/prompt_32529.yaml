  Looking at their cases, patterns emerge immediately: 
  - Cases 1, 2, and 5 show them comfortably ignoring cluelessness for personal/low-stakes decisions. 
  - Cases 3, 4, and 6 reveal insistence on engaging consequences despite uncertainty for institutional/high-impact choices. 
