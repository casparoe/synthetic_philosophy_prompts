  Ultimately they might need to accept that cluelessness forces us into a hybrid approach: consequentialism where tractable, supplemented by non-consequentialist rules elsewhere. Their biology background could appreciate this as a "satisficing" adaptation—we've evolved to compute consequences only when payoff warrants cognitive effort.

