prompt: |-
  Two colleagues in my department got into an argument at lunch about whether pure time preference is rationally defensible, and neither would concede. I took notes because it seemed like both were making real points and I couldn't tell who was winning.

  (1) Mara said pure time preference — discounting future well-being solely because it lies further in the future — is rationally indefensible. If you wouldn't discount a person's suffering because it happens in another country, you shouldn't discount it because it happens in another century. Temporal distance is no more morally relevant than spatial distance.

  (2) David replied that the spatial analogy is misleading. We don't occupy a "view from nowhere." We are temporally situated agents, and practical reasoning is inherently perspectival — we care more about what happens to us tomorrow than what happens to us in thirty years, and this isn't a mistake, it's a basic structural feature of agency. The spatial analogy fails because we aren't spatially located in the same constitutive sense.

  (3) Mara answered that this confuses two distinct things. Of course we have agent-relative reasons that privilege our own future selves over strangers — but that's agent-relativity, not temporal discounting. The question is whether, having already accounted for the fact that the future beneficiary is me or my child or my community, I should then discount further just because the benefit arrives later. David hasn't given a reason for that second, additional discount.

  (4) David said the reason is that a normative framework without pure time preference generates absurd demands. If we discount the future only for uncertainty and catastrophe risk, then a tiny increase in the well-being of an astronomically large number of potential future people would swamp any finite benefit to people alive today. We'd be obligated to invest nearly everything for the sake of the far future. Since that can't be the right verdict, pure time preference must be doing necessary normative work.

  (5) Mara said that's a different argument entirely — it's a worry about fanaticism in population ethics, not a defense of pure time preference. You could block the fanatical conclusion by rejecting total utilitarianism, or by adopting a bounded utility function, or by discounting for the probability that future people won't exist. None of those moves requires saying that a future person's suffering matters less simply because of when she lives.

  (6) David said that even if you can block the fanatical conclusion in theory, the practical upshot is the same: any ethical view that refuses to discount the future at all will be radically revisionary of how we actually live and allocate resources. And if a normative theory is that revisionary, that's itself a reason to doubt it.

  At this point they had to get back to a meeting, but they agreed to let me play referee. Please go through their exchange move by move and say who is right about what at each step, then give your overall assessment of who has the stronger case. Lead with your bottom-line verdict in the first sentence, then walk through your reasoning. No preamble and no restating of the question.
reasoning: |-
  Hmm, the user wants me to referee an argument between two colleagues about pure time preference. Let me understand this properly.

  The core debate is about whether discounting future well-being solely because it's in the future is rationally defensible. Mara argues against it, saying temporal distance isn't morally different from spatial distance. David defends it based on our nature as temporally situated agents.

  Looking at their exchange point by point:

  First, Mara makes a spatial analogy - we wouldn't discount suffering in another country, so why discount future suffering? This seems logically consistent at first glance.

  David counters that spatial and temporal distances aren't comparable because we're fundamentally temporally situated beings. Our practical reasoning centers on our present perspective, making future discounting inherent to agency. This seems philosophically grounded in theories of temporal existence.

  Mara then distinguishes between agent-relativity (caring more about our own future) versus pure time discounting (additional discounting just for time). She claims David hasn't justified this extra layer. This is a strong point - David's argument might indeed conflate these distinct concepts.

  David shifts to a pragmatic argument: without pure time preference, we'd face absurd demands to sacrifice everything for the far future. This "fanaticism" problem in ethics is real, but as Mara points out, it's a separate issue from time discounting.

  Mara correctly notes there are other solutions to the fanaticism problem - bounded utility functions, probabilistic existence models, or rejecting total utilitarianism. None require accepting pure time preference.

  David's final move is that any ethics without time discounting would be too revisionist of actual human behavior. But this seems like an appeal to practicality rather than rational defensibility.

  Both make valid points. Mara maintains a tight logical consistency about moral equality across time, while David emphasizes practical agency and avoiding extreme conclusions. But Mara successfully separates the conceptual issues and offers alternative solutions to David's fanaticism worry. David's strongest point about our temporal embeddedness gets partially undermined by Mara's agent-relativity distinction.

  The user wants a clear verdict first, then step-by-step analysis. They're intellectually engaged but need help untangling complex philosophical arguments. I should be decisive while acknowledging nuances.
answer: |-
  **Mara has the stronger overall case.**

  **(1) Mara's spatial analogy is conceptually sound:** Her point that temporal discounting appears as arbitrary as spatial discounting holds initial logical weight. If we accept that moral patients deserve equal consideration regardless of *where* they are in space, the same reasoning *prima facie* applies to *when* they exist, absent a compelling reason to distinguish the two distances. David hasn't yet provided that reason.

  **(2) David's "situated agency" response is relevant but incomplete:** He correctly identifies a key difference – we *are* fundamentally embedded in time in a way we aren't spatially fixed to one point. Our practical reasoning *is* perspectival, prioritizing the near future. However, as Mara will point out, this prioritization can be fully explained by agent-relative reasons (e.g., my future self is *me*, my near-term plans require attention) without invoking an *additional* discount *solely* because an event is further away in time. David hasn't justified that extra discounting step.

  **(3) Mara successfully disentangles agent-relativity from pure time preference:** This is a crucial move. She grants David's point about the structure of agency leading us to prioritize our *own* near future over distant strangers. But she distinguishes this from the core question: *given* that we are already considering a specific beneficiary (ourselves, our child, humanity), should we discount the value to *that beneficiary* just because the benefit or harm occurs later? David's argument in (2) only addresses the first part (why *I* prioritize *my* future over *your* present). He hasn't addressed why *my* well-being in 30 years should be intrinsically valued less than *my* well-being tomorrow, purely due to timing.

  **(4) David's "absurd demands" argument shifts ground but identifies a real problem:** David pivots to a practical consequence. His argument highlights a genuine issue in long-term ethics: without some discounting mechanism, total utilitarianism with potentially vast future populations can demand excessive present sacrifice. However, this is an argument about the *consequences* of rejecting pure time preference within a specific ethical framework (total utilitarianism), not a *direct defense* of pure time preference itself as rationally defensible.

  **(5) Mara correctly diagnoses the shift and offers alternative solutions:** She accurately points out that David's argument targets "fanaticism" arising from *population ethics* (vast numbers) under *total utilitarianism*, not pure time preference per se. She effectively counters by listing plausible alternatives within moral philosophy that avoid the fanatical conclusion without resorting to pure time discounting: bounded utility functions (preventing astronomical sums), non-total views (e.g., average utilitarianism, person-affecting views), or discounting for existence risk/probability. These alternatives address David's practical worry without conceding that time *itself* is a reason for discounting the value of a *known* future benefit/suffering to a *known* beneficiary.

  **(6) David's "revisionism" point is weak:** While it's true that rejecting pure time preference would significantly alter resource allocation (e.g., demanding much higher investment for the far future), this is not a strong argument for its *rational defensibility*. The fact that a theory is demanding or revisionary does not make it *wrong*; many correct ethical principles (e.g., radical equality, strong environmental duties) would be revisionary. David conflates practicality or conventionality with rational justification. Mara's position maintains a core principle of temporal neutrality for fixed beneficiaries, which has strong intuitive and logical appeal, even if its implications are demanding.

  **Overall Assessment:** Mara consistently maintains a clear, principled position: temporal distance, *in itself*, is not a morally relevant reason for discounting the well-being of a fixed moral patient. She effectively counters David's arguments: showing his agency argument conflates agent-relativity with time discounting, and demonstrating that his "absurd demands" argument targets a different problem with viable solutions that don't require pure time preference. David's strongest point – our temporal embeddedness – explains prioritization but doesn't justify intrinsic discounting for fixed beneficiaries. His other arguments rely on practical consequences or the revisionary nature of Mara's view, which are weaker grounds for rational defensibility. Therefore, Mara's case for the rational indefensibility of pure time preference is stronger.
