  Now, I should look at where this mapping breaks down. Embedded contexts are tricky. For conditionals, like "If stealing is wrong, then we shouldn't do it." In expressivism, "stealing is wrong" is an attitude, but in a conditional, it's not being expressed directly. How does the analogy handle that? "Boo for stealing" doesn't fit into an if-clause naturally. You can't say "If boo for stealing, then..." because that just sounds weird. Real moral language allows for such embeddings, which emotional exclamations don't.

  Negation is another issue. Saying "Stealing isn't wrong" isn't the same as "Not boo for stealing." The latter might just mean indifference, whereas the former is an opposing moral stance. Expressivism needs to explain how negation works here, but the analogy doesn't capture that nuance.

  Questions like "Is stealing wrong?" are seeking a moral stance, not just an emotional response. Asking "Boo for stealing?" doesn't make sense as a question; it's more like a confused exclamation. Moral questions function differently, showing that moral discourse involves more than just expressing feelings.

