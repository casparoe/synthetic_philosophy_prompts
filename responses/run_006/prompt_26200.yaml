  We are designing a hands-on activity to illustrate the problem of reward function ambiguity in inverse reinforcement learning (IRL). The key points to convey are:
   - From observed behavior (demonstrations), multiple reward functions can explain the behavior equally well.
   - The rationality assumption (e.g., Boltzmann rationality) constrains the set of possible rewards but does not uniquely identify one.
   - The choice of state features or the state representation can affect identifiability.

   Activity Design: "The Grid World Preference Game"

   Overview:
   - We have a grid world (e.g., 5x5 grid) with different states (cells) that have features (e.g., color: green, blue, red; or symbols: apple, fire, etc.).
   - The demonstrator (human) has a private scoring scheme (reward function) defined on state features. They move in the grid to maximize their cumulative reward (with discounting? to keep it simple, maybe without discounting and just immediate rewards). We can have a fixed start and goal state, but note: if the goal is fixed, then the reward at the goal might be the only non-zero, and then we are in a shortest path scenario. Instead, we want multiple features to matter.

   To avoid the complexity of sequential decision making and to keep it within 90 minutes, we can have a simpler setup:

   Simplified Version: 
   - Instead of a full MDP, we present the demonstrator with a series of choices between two or more paths (or trajectories) in a grid. Each path is a sequence of states (each state has features). The demonstrator chooses one path based on their private reward function (which assigns a score to each feature). The total reward of a path is the sum of the rewards of the features encountered.

   Rules:

   Materials:
   - Printable grid maps (each group gets one map, which is a grid with cells labeled by features). Example: a 3x3 grid with cells having one of three features: A, B, C. We can have multiple cells with the same feature.
   - For each group: 
       * One set of "Demonstrator Role Cards" - each card has a private reward function (e.g., "Reward for A: 1, B: -1, C: 0" or "A: 0, B: 1, C: -1", etc.). We will have several different ones.
       * One set of "Choice Scenarios" - each scenario is a pair (or triple) of paths (each path is a sequence of cells). The paths are shown on the grid.

   How it works:

   1. Split into small groups of 4-5 people. In each group, assign:
        - 1-2 Demonstrators (they get the private reward function card)
        - 3-4 Learners (they don't know the reward function)

   2. The game has multiple rounds (say 5 rounds). In each round:
        - The facilitator (you) gives the group a choice scenario: two (or three) paths on the grid. Each path is a sequence of cells (e.g., from start to goal, but note: the goal might not be necessary, we can just have paths of fixed length). The paths might share some states but are distinct sequences.
        - The demonstrators look at the paths and choose the one that has the highest total reward according to their private reward function. They tell the learners which path they chose (but not why).
        - The learners record the choice.

   3. After 5 rounds, the learners must come up with a reward function (for features A, B, C) that they think the demonstrator is using. They write it down.

   4. Then, reveal the demonstrator's true reward function. The learners see if they got it right.

   But the twist: We design the choice scenarios and the set of possible reward functions so that there are multiple reward functions consistent with the choices. For example:

     True reward function of Demonstrator 1: R(A)=1, R(B)=0, R(C)=0.
     True reward function of Demonstrator 2: R(A)=0, R(B)=1, R(C)=0.

