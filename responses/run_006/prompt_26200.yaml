  ### Inverse Reinforcement Learning Ambiguity Workshop Activity  
  **Objective:** Demonstrate that observed behavior underdetermines the true reward function, leading to multiple valid interpretations of "inferred preferences."  

  ---

  #### **Materials (Per Group of 5–6 People)**  
  - **Demonstrator Cards**: 2 cards per group (e.g., *Card A* and *Card B*), each with a private scoring scheme.  
  - **Scenario Grids**: 3 printable grids (see template below) showing paths through a feature-based world.  
  - **Choice Sheets**: For learners to record demonstrator choices.  
  - **Reward Proposal Sheets**: For learners to write recovered reward functions.  

  **Printable Scenario Grid (Example for Grid 1: "Cafe World")**  
  ```
  START → (☕, 🌳) → (🏢, ☕) → (🏢, 🌳) → END  
  Path 1: [☕, ☕, 🏢]  
  Path 2: [🌳, 🏢, 🌳]  
  Path 3: [🏢, ☕, 🌳]  
  ```  
  *Features: ☕ (coffee shop), 🌳 (park), 🏢 (office)*  

  ---  

  #### **Rules & Setup**  
  1. **Groups**: Split into teams of 5–6. Each team has:  
     - 2 **Demonstrators** (each gets a private card with scoring schemes).  
     - 3–4 **Learners** (observe choices, recover rewards).  
     - **Facilitator Tip**: Pre-assign cards to avoid trivial schemes (e.g., *Card A*: `☕=+3, 🌳=+1, 🏢=0`; *Card B*: `☕=+1, 🌳=+3, 🏢=0`).  

  2. **Rounds (4 Rounds × 10 Min Each)**:  
     - **Round 1**: Show **Grid 1** (paths with 3 features). Demonstrators calculate path scores *in secret* using their card. Learners see only the chosen path.  
     - **Rounds 2–4**: Repeat with **Grids 2–3** (new paths; see examples below).  
     - **Choice Rule**: Demonstrators pick the path with the *highest total score*. Ties are broken by first path listed.  

  3. **Learner Task**:  
     - After all rounds, learners propose a reward function (e.g., `☕=X, 🌳=Y, 🏢=Z`) that explains the choices.  
     - **Catch**: Groups with *Card A* and *Card B* will observe **identical choices** but have **different true rewards**.  

  ---

  #### **Scenarios & Scoring Schemes**  
  **Grid 1 (Cafe World)**:  
  - Path 1: `[☕, ☕, 🏢]` → Scores: *Card A*: 3+3+0=**6**; *Card B*: 1+1+0=**2**  
  - Path 2: `[🌳, 🏢, 🌳]` → Scores: *Card A*: 1+0+1=**2**; *Card B*: 3+0+3=**6**  
  - Path 3: `[🏢, ☕, 🌳]` → Scores: *Card A*: 0+3+1=**4**; *Card B*: 0+1+3=**4**  
  - **Demonstrators choose Path 1 (Card A) or Path 2 (Card B)** → *But both groups see Path 3 as a decoy!*  

  **Grid 2 (Park World)**:  
  - Path 1: `[🌳, ☕]` → *Card A*: 1+3=**4**; *Card B*: 3+1=**4** (tie → pick Path 1).  
  - Path 2: `[🏢, ☕]` → Both score 0+3=**3** (inferior).  
  - **All demonstrators choose Path 1**.  

  **Grid 3 (Office World)**:  
  - Path 1: `[☕, 🌳, ☕]` → *Card A*: 3+1+3=**7**; *Card B*: 1+3+1=**5**  
  - Path 2: `[🌳, 🌳, 🏢]` → *Card A*: 1+1+0=**2**; *Card B*: 3+3+0=**6**  
  - Path 3: `[🏢, ☕, 🌳]` → Both score **4** (as before).  
  - **Demonstrators choose Path 1 (Card A) or Path 2 (Card B)**.  

  **Outcome**:  
  - Learners see identical choices across groups (e.g., Group A: Path 1, Path 1, Path 1; Group B: Path 2, Path 1, Path 2).  
  - Both groups recover rewards like `☕=high, 🌳=medium` or `🌳=high, ☕=medium` → but **neither knows the true scheme is ambiguous**.  

  ---

  #### **Timeline (90 Min Total)**  
  1. **Intro (10 min)**: Frame the problem: "Systems *claim* to learn preferences—but what do they *actually* learn?"  
  2. **Activity (40 min)**:  
     - Setup (5 min): Distribute cards/grids.  
     - Rounds 1–4 (25 min): Run choices.  
     - Learner Discussion (10 min): Propose reward functions.  
  3. **Reveal & Report (15 min)**:  
     - Groups share recovered rewards → reveal that **different true rewards led to same choices**.  
     - Highlight examples: e.g., Group A (`☕=+3`) vs. Group B (`🌳=+3`) both fit the data.  
  4. **Debrief (25 min)**: Map to technical concepts.  

  ---

  #### **Debrief: Key Technical Lessons**  
  1. **Reward Ambiguity & Identifiability**:  
     - **Observation**: Identical behavior can stem from different rewards (e.g., `☕=+3` vs. `🌳=+3`).  
     - **Real-World**: IRL recovers a *set* of rewards, not *the* reward. Press releases often ignore this.  

  2. **Role of Rationality Assumptions**:  
     - **Activity**: Demonstrators were "rational" (always chose max reward).  
     - **Real-World**: IRL assumes Boltzmann rationality → small changes in temperature parameter yield new rewards that fit data.  

  3. **Feature Selection Bias**:  
     - **Activity**: We predefined features (☕, 🌳, 🏢). What if we added noise (e.g., 🚲)?  
     - **Real-World**: Features are chosen by researchers → the "preference" is as much in the *representation* as in the data.  

  4. **Why Labs Report "Learned" Rewards Anyway**:  
     - **Practicality**: Regularization (e.g., Occam’s razor) picks *one* reward.  
     - **Honest Limitation**: Papers say "a" reward, not "the" reward. But journalists often drop the nuance.  

  ---

  #### **Predictable Problems & Limitations**  
  - **"Trivial Scheme" Risk**: If demonstrators pick simple rewards (e.g., `🏢=+100`), everyone reconstructs it.  
    - *Mitigation*: Pilot-test schemes; use non-obvious weights (e.g., `☕=+3` not `+10`).  
  - **"Irrational Demonstrator" Arguments**: Learners may blame "bad choices" instead of reward ambiguity.  
    - *Mitigation*: Emphasize *rules*: "Demonstrators *must* follow their card."  
  - **Activity Limitations**:  
    - **No Suboptimality**: Real humans are noisy; IRL uses *probabilistic* models (e.g., Boltzmann). We ignored this for simplicity.  
    - **Fixed Features**: Real IRL may learn representations; we assumed features were given.  
    - **No Scaling**: Rewards are unique only up to scaling → `☕=+3` ≡ `☕=+6` if all values double.  

  ---

  **Outcome**: Participants leave wary of phrases like "the AI inferred human values" and grasp that behavior constrains—but doesn’t pin down—reward functions.
