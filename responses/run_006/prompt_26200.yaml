          S4: [B, C] vs [A, C] -> choose [B,C]

     Then the constraints: y>x, y>z.

     And we can have multiple groups with different true reward functions.

     What might go wrong:

       1. The learners might try to assign high reward to a feature that never appears? But in our scenarios, we only have A, B, C. So they might assign zero to a feature that never appears? That's okay.

       2. The demonstrator might make a mistake? We assume they are perfect optimizers.

       3. In the debrief, we need to explain that in real IRL, they use a rationality model (like Boltzmann) that allows for some noise, but even then, the reward function is not uniquely identified.

       4. The activity cannot reproduce the fact that in real IRL, the state space is huge and the features are learned or pre-defined, and that the choice of features is critical. We are assuming a fixed and known feature set.

       5. Also, we are only showing that multiple reward functions are consistent with the data. In real IRL, they use regularization to pick one, or they use a prior.

     Debrief points:

       - Reward ambiguity and identifiability: The observed behavior underdetermines the reward function. There are many reward functions that make the behavior look rational.

       - The role of the rationality assumption: We assumed the demonstrator always chooses the path with the highest total reward. But in reality, humans are not perfectly rational. IRL methods often use a softmax (Boltzmann) model to allow for some noise. But even then, the ambiguity remains.

       - The importance of feature selection: In this activity, we assumed we know the features (A, B, C). But if we had chosen different features, the reward function would be different. For example, if we had a feature that is always 1, then we could add a constant without changing the choices. In practice, the choice of features is crucial and can introduce bias.

       - Why labs report a learned reward function even when it's not "the" one: Because they use regularization (e.g., prefer simpler reward functions) or they use a prior (Bayesian IRL) to pick one solution out of the set of possibilities. And often, they are not interested in the exact weights but in the policy derived from it.

       - What the activity cannot capture: 
            1. Sequential decision making in a state space (we used isolated choice scenarios).
            2. Noisy or suboptimal human behavior.
            3. The possibility of learning the feature representation.

     Materials:

       For each group of 4-5 people:

          - One Demonstrator Card (example for one group: "Your reward function: A=1, B=0, C=0")
          - Scenarios Sheet (for the same group):

              Scenario 1:
                Path 1: [A]
                Path 2: [B]
                Which path do you choose? (Demonstrator calculates and tells the learners)

              Scenario 2:
                Path 1: [A]
                Path 2: [C]

              Scenario 3:
                Path 1: [A, B]
                Path 2: [B, B]

              Scenario 4:
                Path 1: [A, C]
                Path 2: [B, C]

          - A worksheet for the learners to record choices and then to write down their proposed reward function.

     Timeline:

       0:00-0:10 - Introduction and setup (split into groups, explain roles, rules)
       0:10-0:15 - Distribute materials and let demonstrators read their card.
       0:15-0:35 - Run the 4 scenarios (each scenario: demonstrator thinks, then announces choice; learners record)
       0:35-0:45 - Learners work in their group to propose a reward function (10 minutes)
       0:45-0:50 - Reveal the true reward function to the group. Ask: "Did you get the same? Can you think of another one that fits?"
       0:50-1:00 - Groups report: true reward, their proposed reward, and if they found ambiguity.
       1:00-1:30 - Facilitator debrief: 
            - Start with a quick recap of what happened in the groups.
            - Then explain the technical concepts using the activity as an example.
            - Discuss the limitations of the activity and the real-world complications.

