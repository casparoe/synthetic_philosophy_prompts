  I started teaching guitar this year after twenty years of playing, and it turns out I can play things I cannot put into words for the life of me. That's turned into a running argument between my brother (a philosophy PhD student, who insists knowing-how is just a species of knowing-that — you know some proposition about a way to do it) and a friend who's a physio (who says that's obviously backwards: knowing how is a capacity, not a pile of facts). They've been at it for months and I'd rather hand them a document then listen to them talk past each other again.

  You're a philosopher of mind working on the epistemology of skill. Think carefully and brainstorm a bit before you write. Draft the joint statement an intellectualist and an anti-intellectualist about know-how (Rylean, roughly) could both sign after a good-faith adversarial collaboration. Include: (1) a numbered list of claims both can accept; (2) a disagreements table, with each side's position phrased so that side would accept the wording; (3) the cruxes — the sub-questions that would genuinely move at least one of them; and (4) for each crux, a concrete case or argument both agree bears on it, with each side's prediction recorded in advance. I suspect one crux is the injured pianist who once knew how to play but can't anymore, another is completely inarticulate skill like my chord voicings, and a third is whether non-linguistic animals can know how at all. Also say which disagreements you think are just verbal. Keep the whole document under 650 words, and write it in British English.
