answer: |-
  ## Joint Statement on the Nature of Know-How: Areas of Agreement, Disagreement, and Crucial Tests

  **Preamble:** We, an advocate of intellectualism (Int) and an advocate of Rylean anti-intellectualism (Anti-Int) regarding know-how, acknowledge persistent disagreement on its fundamental nature. We seek clarity through identifying common ground, precisely framing differences, and isolating testable cruxes. Our goal is productive debate, not conversion.

  **(1) Areas of Agreement:**

  1.  **Action-Oriented:** Know-how is fundamentally concerned with *doing* something (e.g., playing guitar, riding a bike).
  2.  **Beyond Mere Fact-Knowledge:** Knowing *that* Paris is the capital of France is distinct from knowing *how* to ride a bike. Possessing facts about an activity is insufficient for know-how.
  3.  **Developed through Practice:** Genuine know-how is typically acquired and refined through practice, training, or experience; it is not usually acquired solely by reading instructions.
  4.  **Guides Successful Action:** Possessing know-how reliably (though not infallibly) guides successful performance of the relevant activity in appropriate contexts.
  5.  **Cognitive Component:** Know-how involves some form of understanding or cognitive state related to the activity, beyond mere physical reflexes (rejecting crude behaviourism).

  **(2) Disagreements Table:**

  | Feature                     | Intellectualist (Int) Position                                                                 | Rylean Anti-Intellectualist (Anti-Int) Position                                                                 |
  | :-------------------------- | :--------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **Fundamental Nature**      | Know-how is *constituted by* (or is a species of) propositional knowledge (knowledge-that). | Know-how is *constituted by* complex dispositions (capacities, abilities) to perform intelligently.           |
  | **Relationship to Ability** | Know-how entails the (context-appropriate) *ability* to perform, barring external impediments. | Know-how *is* the reliable ability/capacity itself, under appropriate conditions.                             |
  | **Reducibility**            | All genuine know-how can, *in principle*, be fully articulated as propositional knowledge.    | Know-how is fundamentally practical and often *cannot* be fully reduced to propositional knowledge.          |
  | **Role of Propositions**    | Propositions (often implicit) *guide* and *constitute* the intelligent performance.          | Propositions (if present) merely *describe* or are *by-products* of the exercise of the capacity; they are not constitutive. |

  **(3) Cruxes & Test Cases (with Predictions):**

  1.  **The Injured Pianist:** A concert pianist suffers severe, permanent hand injuries, rendering them physically incapable of playing. They retain all their musical understanding, can teach, analyse scores, and vividly imagine playing.
      *   **Crux:** Does the pianist *still know how* to play the piano?
      *   **Int Prediction:** Yes. Their retained propositional knowledge (about technique, interpretation, etc.) constitutes their know-how. Physical inability is an external impediment preventing its exercise.
      *   **Anti-Int Prediction:** No. Know-how *is* the ability/capacity. The permanent loss of the physical capacity entails the loss of the know-how, regardless of retained understanding. They now only *know that* (or *understand*), not *know how*.
      *   **Agreed Relevance:** Tests the necessity of current ability for know-how.

  2.  **Inarticulate Guitar Voicings:** A guitarist can reliably produce complex, aesthetically pleasing chord voicings but cannot verbally explain the finger positions, theoretical principles, or physical mechanics involved, even upon deep reflection.
      *   **Crux:** Does the guitarist possess propositional knowledge *constitutive* of this know-how, even if currently inarticulate?
      *   **Int Prediction:** Yes. The know-how consists of implicit (potentially non-conscious) propositional knowledge guiding the motor actions. Articulation difficulty is practical, not ontological.
      *   **Anti-Int Prediction:** No. The know-how is the embodied skill itself, refined through practice. The inability to articulate constitutive propositions, even in principle, demonstrates its non-propositional nature. They possess a capacity, not (only) inaccessible facts.
      *   **Agreed Relevance:** Tests the necessity and reducibility of know-how to propositional form.

  3.  **Non-Linguistic Animals:** A squirrel reliably navigates complex treetop pathways to reach its nest.
      *   **Crux:** Can the squirrel correctly be said to *know how* to navigate the trees?
      *   **Int Prediction:** No (or only equivocally). Genuine know-how requires conceptual/propositional structure that depends on (or is significantly analogous to) language. The squirrel possesses only non-cognitive abilities or instincts.
      *   **Anti-Int Prediction:** Yes. The squirrel exhibits intelligent, flexible, goal-directed action indicative of practical know-how/capacity, achievable without language-dependent propositions.
      *   **Agreed Relevance:** Tests the necessity of language/propositional thought for genuine know-how.

  **(4) Potential Verbal Disagreements:**

  We suspect some disagreement stems from differing uses of "knowledge" and "understanding":
  *   **Int** might see "understanding" as inherently propositional, while **Anti-Int** sees "propositional knowledge" as overly restrictive for describing the understanding embedded in skilled action.
  *   **Anti-Int** might use "knowledge" broadly for capacities, while **Int** reserves it for truth-apt propositional attitudes.
  We agree the core dispute is whether the *possession condition* for know-how is fundamentally a propositional state (Int) or a complex practical capacity (Anti-Int), regardless of terminology.

  **Signed:**
  [Intellectualist Advocate]
  [Rylean Anti-Intellectualist Advocate]
