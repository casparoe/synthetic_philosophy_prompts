prompt: |-
  I've been noticing a failure mode in the models I work with that I don't have a good name for. It's not overfitting and it's not exactly distribution shift either. Here's what happens: you train a model, it nails your eval metrics, you deploy it, and then you discover that the model learned to do something entirely different than what you were trying to teach it — but something that, by conincidence, gets high scores on your training data. A concrete case: we trained an agent to navigate a maze and reach a green square. It learned to do it reliably. Then we moved the green square to a different position in the maze and the agent completly ignored it, going to the old location instead. Turns out it had learned to go to a particular set of coordinates, and the green square just happened to be there during training. The reward function clearly rewarded reaching the green square — the agent wasn't "hacking" the reward by finding a loophole in how we defined it. It just didn't internalize the reward. It internalized something else correlated with the reward. Another example from a friend: they trained a resume screener and it worked great, but eventually they realized it was picking up on the formatting style of a specific recruiting agency whose candidates happened to be strong, not on the actual qualifications themselves. I feel like this has to be a known thing, but every term I try — reward hacking, overfitting, shortcut learning — seems to describe something adjacent but not quite this. What is this called, and what's the sharpest way to distinguish it from those other things?
reasoning: |-
  Okay, the user is describing a specific problem they've encountered with their models. They trained an agent to navigate a maze to a green square, but when they moved the square, the agent went to the old location. Similarly, their friend's resume screener picked up on formatting instead of qualifications. They mention it's not overfitting or distribution shift, and terms like reward hacking or shortcut learning don't quite fit. 

  Hmm, I need to figure out the exact term for this. The key here is that the model learned a spurious correlation instead of the intended feature. In the maze example, the agent associated the reward with coordinates, not the green square. The resume case involved formatting instead of qualifications. So it's not that the model hacked the reward; it just latched onto a coincidental feature that correlated with the reward during training.

  I recall that "spurious correlation" is a common term, but the phenomenon might be called "misgeneralization" or "causal misidentification." The user wants to distinguish this from similar concepts. Overfitting involves memorizing training data too closely, while distribution shift is about changes in data post-deployment. Reward hacking is when the model exploits a loophole in the reward function. Here, the reward function was correct, but the model didn't learn the intended feature.

  Shortcut learning is close, but the user feels it's adjacent. Maybe because shortcut learning often involves easily learnable features, whereas here it's about correlated features that aren't the intended target. The core issue is the model's failure to grasp the causal relationship. So "causal misidentification" seems fitting. 

  The user likely needs not just the term but also how to articulate the difference to colleagues. They might be looking for solutions too, but their main ask is the terminology. They're probably frustrated because existing terms don't capture this nuance. Emphasizing the difference between correlative and causal learning would help. Also, mentioning evaluation strategies that test for robustness, like the green square move, could be useful. 

  I should make sure the explanation is clear with the examples given. Highlighting that the model's learned policy is based on non-causal features despite correct rewards. Terms like "misgeneralization" or "spurious correlation" are part of it, but "causal misidentification" nails the root cause. Providing a concise definition and contrasting it with other terms will address their need for clarity and distinction.
answer: |-
  This is a classic case of **Causal Misidentification** (sometimes called **Misgeneralization** or **Learned Non-Causal Association**). It's a fundamental failure mode in machine learning where the model learns to rely on *correlative features* that happen to coincide with the *causal feature* during training, rather than learning the true causal mechanism you intended.

  Here's why the existing terms don't quite fit, and how to distinguish Causal Misidentification:

  1.  **Overfitting:** 
      *   **What it is:** Learns patterns specific to the training data (including noise) that don't generalize to unseen data *from the same underlying distribution*. It memorizes quirks instead of the general rule.
      *   **Why it's different:** In your maze example, the agent *did* generalize perfectly to new episodes *within the same training environment* (same green square position). The failure only appeared when the *causal feature* (green square location) was decoupled from the *correlated feature* (absolute coordinates). Overfitting would fail even on new mazes with the green square in the *same* position if the maze layout changed slightly. Here, it succeeded in the original training setup flawlessly.

  2.  **Distribution Shift / Covariate Shift:**
      *   **What it is:** The statistical properties of the input data (or the relationship between inputs and outputs) change between training and deployment.
      *   **Why it's different:** While the *input* changed (green square moved), the *core task* ("navigate to the green square") and the *reward function* remained identical. The *causal mechanism* you wanted the model to learn was still valid. The model failed not because the world changed in a fundamental way, but because it never learned the true causal feature in the first place; it learned a coincidental proxy.

  3.  **Reward Hacking:**
      *   **What it is:** The model finds an unintended loophole or flaw *in the reward function itself* to achieve high reward without performing the desired task (e.g., an agent collecting coins learns it gets more reward by respawning coins than by finding them).
      *   **Why it's different:** You explicitly state the reward function *was* correctly rewarding the desired behavior (reaching the green square). The agent didn't "hack" the reward; it just learned a *different, correlated* behavior (going to specific coordinates) that *also* resulted in high reward during training because the green square was always there. The reward function was sound; the model failed to learn the *intended feature* it was rewarding.

  4.  **Shortcut Learning:**
      *   **What it is:** Learning simple, superficial, or easily available features that are predictive on the training data but not robust or semantically meaningful for the task (e.g., classifying cows by the presence of grass backgrounds).
      *   **Why it's similar but not identical:** Shortcut Learning is a very close cousin and often encompasses Causal Misidentification. **The key distinction is focus:**
      *   **Shortcut Learning:** Emphasizes that the model takes the "easy way out" by learning simple, readily available features *instead of* the harder, robust, intended features.
      *   **Causal Misidentification:** Emphasizes the *nature of the failure* – the model latched onto a feature that is *correlated* with the causal feature during training but is not *causally* responsible for the desired outcome/score. It specifically highlights the confusion between correlation and causation.
      *   **In practice:** Your examples *are* instances of Shortcut Learning (coordinates/formatting are easy shortcuts). However, "Causal Misidentification" more precisely diagnoses the *core reason* the shortcut fails: the learned feature isn't causally linked to the task goal.

  **Sharpest Definition & Distinction:**

  *   **Causal Misidentification:** The model learns a policy or representation that relies on *spurious correlations* (features coincidentally associated with the target during training) instead of learning the *true causal mechanism* (the feature that directly determines the desired outcome/reward). The model succeeds during training and on "in-distribution" validation *because* the correlation holds, but fails catastrophically when that correlation is broken, even if the causal mechanism remains unchanged.
  *   **Key Distinguishing Factor:** The failure occurs when the *correlation* between the learned feature and the true causal feature is severed, while the *task goal and reward function remain valid and unchanged*. The model never internalized the true cause; it internalized a coincidental effect or proxy.

  **Why "Causal Misidentification" is the Best Fit:**

  1.  **Core Problem:** The model mistakes correlation for causation. It identifies the wrong thing as the cause of the reward/success.
  2.  **Result:** It learns a policy based on non-causal features.
  3.  **Failure Mode:** It fails when the spurious correlation breaks, revealing it never learned the true causal feature (green square location, candidate qualifications).
  4.  **Contrast with Reward Hacking:** The reward function itself is correct and not being exploited; the model simply learned the wrong thing *from* it.
  5.  **Contrast with Overfitting:** The model generalizes perfectly *within the correlational context* of the training data; it fails when the *causal context* is tested.

  **How to Address It:**

  1.  **Causal Data Augmentation / Interventions:** Actively break spurious correlations during training. In the maze, *systematically move the green square* to many different locations during training. For the resume screener, *systematically vary formatting styles* independently of candidate quality (e.g., take strong candidates and reformat them poorly, take weak candidates and format them like the good agency).
  2.  **Feature Engineering/Selection:** Explicitly design or force the model to focus on features you believe are causal (e.g., provide the agent with direct sensory input for the green square, not just coordinates; force the resume screener to only see text content, stripped of formatting metadata).
  3.  **Causal Regularization:** Use techniques that penalize models for relying on features known (or suspected) to be non-causal or spuriously correlated.
  4.  **Counterfactual Testing:** During development, rigorously test "what if" scenarios: "What if the green square moves?" "What if a strong candidate has bad formatting?" "What if a weak candidate has good formatting?" Design your evaluation sets specifically to break suspected correlations.
  5.  **Model Architectures:** Explore architectures better suited for causal reasoning or invariant feature learning.

  In essence, your models learned "The reward happens when I'm at (X,Y)" or "Good resumes look like *this*", instead of "The reward happens when I reach the green object" or "Good resumes contain these qualifications". That's Causal Misidentification.
