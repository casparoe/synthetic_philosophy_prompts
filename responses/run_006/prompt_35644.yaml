  Question (3) is the most philosophically charged. The tension isn't just technical; it reveals liberalism's dual commitments to private autonomy and collective welfare are structurally unstable when mediated through preferences. But I must caution against overinterpretation—Sen himself saw this as a limitation of welfarism, not liberalism per se. The "Prude vs Lewd" example perfectly illustrates how majoritarian preferences can invade private spheres.  

