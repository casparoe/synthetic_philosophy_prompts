  The user's phrasing ("going back and forth", "argue past each other") suggests analytical exhaustion. They likely want scaffolding to sort positions, not more literature. That means my response must resist explaining standard theories (as they requested) and instead crystallize evaluation criteria. 

  Key insight: Some "desiderata" are actually meta-commitments. For example, requiring death to be bad for the dead person commits to subjecthood continuing post-mortem, which clashes with the experience requirement. This tension is structural - no theory resolves it without tradeoffs. I'll highlight this as the central fault line.

  For the symmetry argument, merely noting temporal direction won't satisfy them (they've dismissed "future" as insufficient). A robust account must explain why future deprivation feels different from past non-existence - possibly via psychological asymmetry about time, or modal realism about potential futures.

  On variability, I should note that while most agree death at 30 is worse than at 90, theories diverge on whether this stems from objective lost opportunities or subjective investment in projects. This isn't just about years lost.

  Posthumous harms are a litmus test: If a theory accepts them, it likely rejects the experience requirement. If it rejects them, it must explain why defamation feels intuitively bad even for the dead. This connects to whether "harm" requires an experiencer.

  The terminal illness case is crucial for adequacy - any theory claiming death is always bad fails immediately. But this interacts with the deprivation view: Is death bad because it deprives us of good life? Then for those in agony, it may be good. But what if they're temporarily deluded? Now we need criteria for rational assessment...

  Most negotiable is probably the subject of harm. Some theories bite the bullet and say death harms the bereaved, not the dead. Others stretch "subject" via ante-mortem person stages. But if the user insists the dead person must be the subject, that constrains options severely.

  The timing problem might be the sharpest knife: If death's badness occurs when? At death? But the subject vanishes. After? No subject exists. Before? Then it's anticipatory harm, not death itself. Each solution has costs - this may be the desideratum that rules out most theories.

  I'll structure output by first listing explicit desiderata with cases, then analyzing tensions, flagging the subject/timing clash as the biggest obstacle. The deprivation account handles variability and exceptions well but stumbles on symmetry and timing. Epicureanism solves symmetry and timing but fails variability and exceptions. No clean answers - hence the field's persistence.
answer: |-
  Here’s a comprehensive specification of desiderata for any theory of death's badness, grounded in key cases and philosophical puzzles. Desiderata marked **[★]** are widely treated as non-negotiable for adequacy; others reflect theoretical tensions or "camp preferences."

  ---

  ### **Core Desiderata**
  1.  **Resolve the "No Subject" Problem (Epicurean Challenge)**  
      *   **Requirement:** Explain how death can be bad *for the person who dies* despite the fact that they don’t exist to experience it.  
      *   **Case:** Epicurus: "Death is nothing to us... for when we exist, death is not present, and when death is present, we do not exist."  
      *   **Constraint:** A theory must either (a) reject the "experience requirement" (harm requires a subject to experience it), or (b) show how death harms the *ante-mortem* person in a way that persists or is constituted by non-experiential factors.  
      *   **Non-negotiable?** **[★] Yes.** A theory that cannot address this fails at its core task.

  2.  **Explain the Asymmetry (Lucretius' Symmetry Argument)**  
      *   **Requirement:** Justify why *post-mortem* nonexistence seems bad while *pre-natal* nonexistence does not, without appealing *only* to temporal direction ("it's future").  
      *   **Case:** Lucretius: "Look back at time... before our birth. In this way Nature holds before our eyes the mirror of our future after death. Is this so grim...?"  
      *   **Constraint:** Must provide a deeper explanation (e.g., deprivation of *possible future goods*, psychological asymmetry about time, narrative structure of life).  
      *   **Non-negotiable?** **[★] Yes.** A theory that cannot distinguish pre-vital and post-mortem nonexistence is inadequate.

  3.  **Address the Timing Problem**  
      *   **Requirement:** Specify *when* death is bad for the person.  
      *   **Cases:**  
          *   *Before death?* (Anticipation harms the living person).  
          *   *At death?* (But the person ceases to exist at that moment).  
          *   *After death?* (But no subject exists to be harmed).  
      *   **Constraint:** Must coherently locate the harm without logical contradiction (e.g., harm occurs *at all times* when the person is deprived of life, or the harm is "atemporal").  
      *   **Non-negotiable?** **[★] Yes.** A coherent account of harm requires an answer to "when?".

  4.  **Account for Variable Badness & Counterfactuals**  
      *   **Requirement:** Explain why some deaths are worse than others, based on the value of the life lost.  
      *   **Cases:**  
          *   Death at 30 vs. death at 90 (assuming similar health/quality).  
          *   Death derailing a flourishing life vs. ending a life of suffering.  
      *   **Constraint:** Must link badness to the *counterfactual difference* between actual death and continued life (deprivation of goods).  
      *   **Non-negotiable?** **[★] Yes.** Intuitions about comparative badness are fundamental.  
      *   **Optional Commitment:** *Must* death at 90 be less bad than death at 30 if conscious years lost are equal? **No.** A theory *could* prioritize quality over quantity, or argue that lost *future opportunities* matter more for the young (e.g., unrealized potential).

  5.  **Allow Death to be Non-Bad or Good**  
      *   **Requirement:** Explain cases where death is not bad or is positively good.  
      *   **Cases:**  
          *   Terminal patient in unrelievable agony.  
          *   Person with advanced dementia and no quality of life.  
          *   Rational suicide based on life completion/loss of agency.  
      *   **Constraint:** Must not entail that *all* death is bad. A theory making death universally bad is falsified by these cases.  
      *   **Non-negotiable?** **[★] Yes.** Empirical reality demands this.

  ---

  ### **Boundary Conditions & Connected Issues**
  6.  **Delimit Death's Badness from Being Dead / Dying / Loss**  
      *   **Requirement:** Clarify whether the badness attaches to:  
          *   The *event* of death/dying (process).  
          *   The *state* of being dead.  
          *   The *deprivation* of life (counterfactual loss).  
      *   **Case:** Is the badness of a sudden, painless death different from a prolonged, painful dying process?  
      *   **Constraint:** A theory must specify its target (most target deprivation/loss).  
      *   **Non-negotiable?** **No (but essential clarity).** Theories can disagree here, but must be explicit.

  7.  **Handle Posthumous Harms (Optional Scope)**  
      *   **Requirement:** Must a theory of death's badness *also* explain harms occurring after death (defamation, broken promises)?  
      *   **Case:** A respected scientist dies, then is posthumously exposed as a fraud, destroying their legacy.  
      *   **Constraint:** *If* a theory invokes "harm to the dead person," it must address this consistently. Theories rejecting posthumous harm must explain the intuition that these events *matter* in a way distinct from harms to the living.  
      *   **Non-negotiable?** **No.** A theory *can* treat this as separate. However, if it grounds death's badness in thwarted *desires/projects/legacy*, it may *need* to address posthumous events.

  8.  **Specify the Subject of Harm**  
      *   **Requirement:** Identify *who* is harmed by death.  
      *   **Options:**  
          *   The *ante-mortem* person (e.g., via anticipation or thwarted projects).  
          *   The *dead person* (requires rejecting experience requirement).  
          *   A "person-stage" or narrative whole.  
          *   Only the bereaved (but then it's not bad *for the deceased*).  
      *   **Constraint:** Must be consistent with the resolution of the Epicurean challenge.  
      *   **Non-negotiable?** **[★] Yes (implicitly).** The theory must specify and justify its subject.

  ---

  ### **Key Tensions & Forced Choices**
  *   **Experience Requirement vs. Subject of Harm:**  
      If you hold the experience requirement **[★ Non-negotiable for some]**, you **cannot** locate the harm in the state of being dead or make the dead person the subject. The harm *must* be located in the ante-mortem person's life (e.g., as deprivation, thwarted desires).  
      *If you drop the experience requirement*, you *can* make the dead person the subject (e.g., via comparative harm in possible worlds), but face Lucretius symmetry and metaphysical challenges.

  *   **Timing vs. Subject:**  
      If you locate the harm *after* death (to explain deprivation), you **cannot** have the ante-mortem person as the subject at that time, and the dead person doesn't exist. Solutions involve:  
      *   Harm located *before* death (anticipatory harm/deprivation starting at death).  
      *   Harm as an atemporal *comparative fact* (deprivationism).  
      *   Rejecting temporal location entirely (harm as a property of the life-as-a-whole).

  *   **Symmetry vs. Temporal Neutrality:**  
      Rejecting the symmetry (making post-mortem non-existence bad but pre-vital non-existence not bad) **requires** rejecting temporal neutrality (the idea that past and future harms are equally bad). Most theories appeal to the *direction of time* or *psychological asymmetry* (caring more about the future).

  *   **Posthumous Harms vs. Experience Requirement:**  
      Accepting genuine posthumous harms **requires** rejecting the experience requirement. If you keep the experience requirement, posthumous "harms" must be analyzed as harms *to the living* (e.g., distress to loved ones) or as harms *before death* (e.g., fear of future defamation).

  ---

  ### **Which Requirement Does the Most Work?**
  **The Experience Requirement** (Epicurus' Challenge) is the **single most decisive requirement.** It forces the fundamental choice:  
  *   **Option 1 (Keep it):** Death's badness *must* be located within the experiences or interests of the *living person* (e.g., Deprivationism: bad as *losing* future goods; Desire Frustration: bad as *frustrating* desires held while alive). Solves Lucretius via asymmetry of care/future potential. Struggles with timing ("when is the loss felt?").  
  *   **Option 2 (Reject it):** Allows harm to befall the dead person via comparative/metaphysical facts (e.g., "The dead person is worse off than they would have been if alive"). Solves timing (harm is timeless) but struggles mightily with Lucretius (Why isn't the pre-vital nonexistence equally harmful?) and metaphysics.  

  **The Variability Requirement** is the most effective at **ruling out overly simplistic theories.** Any theory claiming death is equally bad for everyone (or always bad) is immediately falsified.

  ---

  ### **Summary of Non-Negotiables**
  An adequate theory **MUST:**  
  1.  **[★]** Explain how death harms the deceased *despite* their non-existence (Epicurus).  
  2.  **[★]** Explain the asymmetry between pre-vital and post-mortem nonexistence (Lucretius).  
  3.  **[★]** Coherently address *when* the harm occurs (Timing).  
  4.  **[★]** Explain why some deaths are worse than others (Variability).  
  5.  **[★]** Allow that death can be non-bad or good in some cases (e.g., terminal agony).  
  6.  **[★]** Clearly specify the *subject* of the harm.

  **The core tension:** Satisfying (1) & (6) while avoiding contradiction with (3) forces a choice about the nature of harm and personal identity. Most contemporary theories (like Deprivationism) opt to keep a modified experience requirement (harm rooted in the ante-mortem person's interests) and reject the dead person as a subject. This resolves (1) & (6), handles (4) & (5) well, addresses (2) via future-deprivation, but leaves (3) tricky (harm as lifelong deprivation starting at death?). Theories rejecting the experience requirement gain a cleaner solution to (3) but face severe challenges with (2) and metaphysics. The list itself pushes towards Deprivationist-like views, but no theory resolves all tensions perfectly.
