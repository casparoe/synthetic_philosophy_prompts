prompt: |-
  I run a small independent press — we publish maybe eight books a year, mostly literary fiction and poetry. Over the past few seasons we have found ourselves in a recurring bind. A manuscript arrives that is genuinely good, sometimes extraordinary, and then someone on the editorial team discovers that the author has done something morally serious: a credible allegation of sexual misconduct, a pattern of public racist or antisemitic statements, a history of abusive behavior toward students or collaborators. The board splits every time. Some say the work stands on its own and we are not a moral tribunal; others say publishing is an act of endorsement and we become complicit. We have no framework for these decisions, so each case gets argued from scratch, tempers fray, and the outcome depends more on who argues longest than on anything principled.

  I want something I can actually use: a decision procedure — a sequence of questions my editorial board can work through in order, with clear stopping points, that translates whatever philosophy has figured out about separating the work from the artist into something operational. We are not philosophers. We have about an hour per case at a monthly meeting. The procedure needs to distinguish between kinds of moral wrong and kinds of relationship between the wrong and the work, and it needs to flag the points where reasonable people can disagree and a judgment call is unavoidable rather than disguising them as mechanical steps. It should also tell us what to do when we lack information — when an allegation is disputed or the facts are murky.

  Once you have laid out the procedure, please run it on three cases: (1) a debut novel of real promise by a writer who, we learn, was convicted of domestic assault five years ago, and the novel is a quiet family drama that has nothing to do with violence; (2) a poetry collection that is explicitly about desire and seduction, by a poet whom several former students have credibly accused of using his teaching position to pursue sexual relationships; (3) a brilliant essay collection arguing for a certain vision of the moral life, by a writer who was a prominent public advocate for that same vision but has since been exposed for extensive financial fraud. For each, tell us where the procedure would land and whether that answer is one we should be uncomfortable with.
reasoning: |-
  Okay, the user runs a small independent press publishing literary fiction and poetry. They're struggling with how to handle manuscripts from authors who've committed serious moral wrongs. Each case causes internal conflict without a clear framework. They need a practical decision procedure for their editorial board, something step-by-step that isn't overly philosophical but can be applied in monthly meetings.

  First, I need to understand the core dilemma: separating art from artist in publishing decisions. The user wants something operational—concrete questions that distinguish between types of wrongdoing and their relationship to the work. They also need clarity on handling disputed allegations and murky facts. The three test cases provided are crucial for validating the procedure.

  The key challenges here are: 
  - Balancing artistic merit against ethical responsibility 
  - Creating a process that doesn't oversimplify but acknowledges where judgment calls are needed 
  - Addressing different categories of harm (sexual misconduct, racism, abuse, fraud) 
  - Accounting for how the wrongdoing connects (or doesn't) to the work's content 
  - Managing limited time (1 hour per case) and non-philosopher board members 

  I recall similar frameworks in publishing ethics and institutional policies. The procedure should probably start with establishing basic facts before diving into ethics—that's logical. Then it needs to assess severity and credibility since not all wrongs are equal. The work/wrong connection seems vital—does the work contradict, reflect, or ignore the misconduct? 

  For the operational part, I'm thinking of a flowchart-like sequence with "circuit breaker" points where a clear no-go decision can be made early. For example: if the act is ongoing/severe/unrepentant, stop. That saves time. The steps should escalate in complexity, reserving tougher judgments for later stages. 

  The "discomfort test" is smart—acknowledging that some outcomes should feel uneasy avoids false certainty. For the cases: 
  - The domestic violence convict writing unrelated family drama might pass but feel uncomfortable 
  - The predatory poet writing about seduction creates direct thematic overlap—likely rejection 
  - The fraudster essayist preaching morality presents hypocrisy that undermines the work 

  I should emphasize that information gaps don't get automatic passes—they require weighing risks. Also, the board's values statement (step 0) grounds everything; without it, the procedure floats in a vacuum. 

  Hmm, the user mentioned "reasonable people can disagree" points. The procedure must highlight those, not bury them. Maybe flagging specific questions where consensus isn't expected? Like step 6 (complicity assessment) or step 7 (practical consequences). 

  For the fraud case, I'm torn. The work is brilliant but the hypocrisy is glaring. The procedure would likely reject it at step 4 (irreconcilable contradiction), but the discomfort note is crucial—rejecting great work over unrelated fraud *should* feel uneasy. That's the whole point of the framework: making tough calls transparently.
answer: |-
  Here is a practical, step-by-step decision procedure designed for your editorial board. It prioritizes operational clarity, acknowledges ambiguity, and incorporates ethical dimensions without requiring philosophical debate at every turn. **The core principle is: Publishing is an act of amplification. Our decision must weigh the value of amplifying the work against the risk of amplifying harm or normalizing wrongs.**

  **The Editorial Amplification Assessment Procedure (EAAP)**

  *   **Time Allotment:** Aim for 45 mins per case. Steps 1-3 should be quick (10 mins). Steps 4-6 are the core (25 mins). Step 7 is implementation (10 mins).
  *   **Stopping Points:** Clear "Circuit Breakers" (Reject) are at Steps 2b and 3b. A strong "Probable Reject" signal is at Step 4b.
  *   **Judgment Flags:** Highlighted as **(JUDGMENT CALL)**. Acknowledge disagreement here is expected and legitimate. Vote if needed.
  *   **Information Gaps:** Handled explicitly in Steps 2a and 3a.

  **The Procedure:**

  1.  **Confirm & Contextualize the Work's Merit:**
      *   *Question:* Has the editorial team independently affirmed the *significant artistic/literary value* of this specific work *before* learning of the concern? (Yes/No)
      *   *Stopping Point:* If **No**, reject based on merit. *Stop here.* (Removes using morality as a pretext for rejecting mediocre work).
      *   *If Yes:* Briefly summarize the agreed-upon value of the work (e.g., "Debut novelist with unique voice," "Groundbreaking poetic form," "Essential cultural critique").

  2.  **Establish Basic Facts & Severity of the Concern:**
      *   *Question:* What is the *specific nature* of the alleged or confirmed wrongdoing? (List: e.g., "Convicted of domestic assault," "Credible allegations of sexual harassment by students," "Admitted financial fraud").
      *   *Question:* What is the *source and credibility* of the information? (e.g., Court records, multiple public accusations by named individuals with consistent details, credible investigative report, disputed social media post).
      *   *(JUDGMENT CALL - Information Gap):* **How confident are we in the *core facts*?** (High/Medium/Low Confidence). *If Low Confidence:* Can we reasonably obtain higher confidence before publication? (Yes/No). If **No**, proceed with *extreme caution* - the risk of amplifying *unfounded* harm is significant.
      *   *Circuit Breaker (Severity):* **Is the act universally recognized as severe, illegal, and/or predatory, *and* is the evidence credible/high confidence?** (e.g., violent felony conviction, pattern of sexual predation, credible hate speech inciting violence). **(JUDGMENT CALL)** *If Yes:* Does the act represent an *ongoing pattern* or demonstrate *complete lack of remorse/accountability*? **(JUDGMENT CALL)**
          *   *Stopping Point:* If **Yes** to *both* (Severe/Credible *and* Ongoing/Unrepentant), **REJECT**. *Stop here.* (Amplifying the work inherently amplifies an unmitigated source of harm). *Proceed if No.*

  3.  **Relationship Between Wrongdoing and Work:**
      *   *Question:* Is the wrongdoing *directly thematized, glorified, or justified* within *this specific work*? (Yes/No). *If Yes,* **REJECT**. *Stop here.* (Work itself actively causes harm).
      *   *Question:* Does the work *contradict* or *critique* the nature of the wrongdoing? (e.g., A novel condemning violence by someone convicted of assault; essays critiquing fraud by a fraudster). (Yes/No/Partially). *If Yes,* note as a potential mitigating factor.
      *   *(JUDGMENT CALL - Relevance):* **Does the wrongdoing fundamentally *undermine* or create *irreconcilable tension* with the work's core message, ethos, or the author's necessary authority?** (e.g., Essays on morality by an unrepentant fraudster; poems about consensual desire by a serial sexual harasser). *If Yes,* **Strong Probable Reject Signal** (Proceed to Step 4, but high hurdle). *If No or Unclear,* proceed.

  4.  **Complicity & Endorsement Risk:**
      *   *(JUDGMENT CALL - Core Ethical Tension):* **By publishing this work, knowing what we know, do we reasonably believe:**
          *   **a)** We are *directly enabling* further harm by the author? (e.g., providing platform/income/resources to an active predator).
          *   **b)** We are *normalizing or minimizing* the seriousness of the wrongdoing? (e.g., sending the message that "great art excuses abuse").
          *   **c)** We are causing *foreseeable, significant harm* to victims, communities, or our own staff/partners? (Consider sensitivity readers, translators, booksellers, readers).
          *   **d)** We are *violating our own stated values or mission* as a press?
      *   *Assessment:* Weigh the "Yes" answers against the work's merit (Step 1). **If *any* of (a-d) elicit a strong "Yes"** (especially a or b), **REJECT.** *If mixed or weak "Yes",* proceed but acknowledge discomfort.

  5.  **Mitigating Factors & Context (If proceeding from Step 4):**
      *   *Question:* Has the author demonstrated *genuine accountability, remorse, and concrete restitution/rehabilitation*? (Not just PR apologies). (Yes/No/Unclear). *If Yes,* significant mitigating factor.
      *   *Question:* Is the work *particularly vital* for underrepresented voices, historical record, or artistic innovation? Does *not* publishing cause its own harm? (Yes/No). *If Yes,* weigh against complicity risks.
      *   *Question:* How much *time has passed* since the wrongdoing? Is it clearly part of a *distant past* self? (Context matters, less so for predatory patterns).

  6.  **The Discomfort Test:**
      *   *(JUDGMENT CALL - Collective Gut Check):* **Can we collectively stand behind this decision *without rationalization*? Will we feel *justified*, not just *defensive*, explaining it to an affected community member, victim, or our peers?** (Yes/No/Uneasy). **A "No" or "Uneasy" here is a powerful indicator to REJECT.** Comfort isn't the goal, but justifiability is.

  7.  **Decision & Implementation:**
      *   Based on the path through Steps 1-6: **REJECT** or **PROCEED (with cautions)**.
      *   *If PROCEED:*
          *   **Acknowledge the Discomfort:** Document the concerns raised in the process.
          *   **Consider Mitigations:** Can preface/afterword address it? Donate profits? Specific disclaimer? (Use *extreme* caution – can backfire). Often, silence is safest, but transparency with stakeholders *might* be needed.
          *   **Staff Support:** Ensure staff handling the project are comfortable; offer opt-outs.
      *   *If REJECT:* Prepare a clear, concise, internal statement of the primary reason based on the procedure steps (e.g., "Rejected at Step 3b: Irreconcilable tension between work's ethos and author's actions").

  ---

  **Applying the EAAP to Your Cases:**

  **Case 1: Debut Novel (Family Drama) / Author Convicted of Domestic Assault (5 yrs ago)**

  1.  **Work Merit:** Yes (affirmed before knowledge).
  2.  **Facts & Severity:** Specific (Conviction), Credible (Court records - High Confidence). Severe? Yes (Violent crime). Ongoing/Unrepentant? *Unclear.* **No Circuit Breaker.** Proceed.
  3.  **Relationship:** Work *not* thematizing/glorifying violence? **Yes.** Work *contradict* violence? **No** (but doesn't glorify). Undermine work's core? **Unlikely** (Family drama unrelated to author's crime). Proceed.
  4.  **Complicity:** a) Enable further harm? Unlikely (conviction past, no *known* pattern). b) Normalize/minimize? **Risk (JUDGMENT CALL)** - Could send message "conviction doesn't matter". c) Harm others? Possible (survivors of DV). d) Violate values? *Depends on stated values.* **Leans towards Risk (b/c), but not automatic reject.**
  5.  **Mitigating:** Accountability? *Unclear* (No info on remorse/rehab). Time Passed? Significant (5 yrs). Vital Work? Promising debut, but not unique vital. **Weak mitigation.**
  6.  **Discomfort Test:** **Likely UNEASY.** Explaining to a DV survivor why we published this author's gentle family drama feels inherently difficult to justify without caveats.
  7.  **EAAP Outcome:** **PROCEED with Significant Unease.** (Mitigations: Consider anonymous donation to DV shelter from profits? Ensure staff opt-outs. Acknowledge discomfort internally). *This discomfort is appropriate – it reflects the tension between the work's standalone merit and the inescapable connection to real harm.*

  **Case 2: Poetry Collection (Desire/Seduction) / Credible Allegations of Sexual Harassment by Students**

  1.  **Work Merit:** Yes.
  2.  **Facts & Severity:** Specific (Pattern of leveraging position for relationships), Credible (Multiple named accusers, consistent details - **Medium/High Confidence**). Severe? **Yes** (Abuse of power, predatory pattern). Ongoing/Unrepentant? *Likely/Unclear.* **No Circuit Breaker** (unless evidence shows definitively ongoing/unrepentant). Proceed *cautiously*.
  3.  **Relationship:** Work thematizing desire/seduction? **Yes.** Glorifying/Justifying? *Possibly* (Needs close read - **JUDGMENT CALL**). Undermine work? **STRONG YES.** Poems about desire by someone credibly accused of abusing power for sexual access creates irreconcilable tension, potentially reframing the work as predatory or hypocritical. **Strong Probable Reject Signal.**
  4.  **Complicity:** a) Enable further harm? **High Risk** (Platform could embolden, attract new students/victims). b) Normalize/minimize? **Very High Risk** ("Poetic license" excusing real misconduct). c) Harm others? **Very High Risk** (Victims, current students, readers). d) Violate values? **Likely Yes.** **STRONG REJECT SIGNAL.**
  5.  **Mitigating:** Accountability? *Unlikely* (Credible allegations suggest pattern, not isolated). Vital Work? Brilliant, but unlikely unique vital necessity vs. harm risk. **Weak mitigation.**
  6.  **Discomfort Test:** **STRONG NO.** Justifying this to victims or students would be highly problematic.
  7.  **EAAP Outcome:** **REJECT** (Likely triggered decisively at Step 3 and Step 4). *Minimal discomfort in rejection; significant discomfort would arise from proceeding.*

  **Case 3: Essay Collection (Moral Life) / Author Exposed for Extensive Financial Fraud**

  1.  **Work Merit:** Yes (Brilliant).
  2.  **Facts & Severity:** Specific (Financial fraud), Credible (Exposed/Admitted? - **Assume High Confidence**). Severe? Yes (Illegal, significant harm). Ongoing/Unrepentant? *Depends on exposure context.* **No Circuit Breaker** (unless ongoing/unrepentant). Proceed.
  3.  **Relationship:** Work thematizing fraud? **No.** Work *contradict* fraud? **YES ESSENTIALLY** (Essays argue *for* the moral life author demonstrably violated). Undermine work? **ABSOLUTELY.** The work's entire authority and thesis are destroyed by the author's hypocrisy. **Irreconcilable tension. Strong Probable Reject Signal.**
  4.  **Complicity:** a) Enable harm? Possible (provides income/resources). b) Normalize/minimize? **STRONG YES** (Suggests moral preaching is just performance, undermines the very idea of the moral life argued for). c) Harm others? Harms readers' trust, harms cause the essays champion. d) Violate values? **Very Likely Yes.** **STRONG REJECT SIGNAL.**
  5.  **Mitigating:** Accountability? *Unlikely* (Fraud exposure usually involves denial/minimization initially). Vital Work? Brilliant, but its message is irrevocably tainted by the author's actions. **Mitigation fails.**
  6.  **Discomfort Test:** **NO.** Explaining why we published moral essays by a known fraudster is impossible without sounding absurd or cynical.
  7.  **EAAP Outcome:** **REJECT** (Triggered decisively at Step 3 - Irreconcilable Contradiction). *Discomfort lies in rejecting brilliant work, but the procedure makes the reason clear. Proceeding would cause greater harm and discomfort.*

  **Key Takeaways from the EAAP:**

  *   **It's Operational:** Provides a sequence, stopping points, and focuses on actionable questions.
  *   **It Distinguishes:** Explicitly separates severity, credibility, work-wrong relationship, and complicity factors.
  *   **It Flags Judgment:** Highlights where disagreement is expected and necessary.
  *   **It Handles Uncertainty:** Forces assessment of confidence and risk under low information.
  *   **It Embraces Discomfort:** Acknowledges that some "Proceed" decisions (like Case 1) *should* feel uneasy, and that rejection of brilliant work (like Case 3) is painful but sometimes necessary.
  *   **It Centers Harm & Amplification:** Focuses on the real-world consequences of publishing, not just abstract philosophy.

  This won't eliminate debate, but it structures it, prevents re-litigating first principles each time, and ensures decisions are made transparently against agreed-upon considerations, significantly reducing "who argues longest" victories. The discomfort inherent in Case 1 reflects the genuine complexity; the clarity in Cases 2 & 3 shows where the harm outweighs the art.
