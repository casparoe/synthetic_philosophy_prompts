prompt: |-
  I write literary fiction, and my whole method for inner monologue relies on a picture I absorbed without really thinking about it: that introspection is basically perception turned inward. You shine the flashlight of attention on your own mental states and you see them — the anger, the flicker of jealousy, the half-buried memory — just like you'd see objects on a table. It's how I decide what my characters can plausibly notice about themselves, and it's how I judge whether a passage of interiority rings true.

  I've been reading some cognitive psych lately (Nisbett & Wilson, the confabulation stuff, some Kahneman) and now I'm rattled. If people are demonstrably wrong about why they did things, or about what they're feeling in the moment, then the whole "look inward and report" model starts looking like a folk theory that's doing real work in my fiction without my having signed off on it.

  Walk me through the analogy properly — give me a correspondence table: what plays the role of the eye, the object seen, the act of looking, the lighting conditions, the blind spots. Then tell me where it snaps, which of those breaks are fatal for what I'm trying to do as a novelist, and which are just philosophers' quibbles that don't touch the craft. Final question: does writing inner life *as if* it's perceptually available survive the audit, or do I need a different underlying model? Keep it to 350 words.
reasoning: |-
  Okay, the user writes literary fiction and relies on an analogy of introspection as perception turned inward—like shining a flashlight on mental states. But recent readings in cognitive psychology (Nisbett & Wilson, Kahneman) have shaken this model. They question how people often misreport their motivations and feelings, suggesting introspection isn't reliable. 

  The user wants a breakdown of the perception analogy: mapping elements like the eye (observer), objects seen (mental states), the act of looking (attention), lighting conditions (clarity), and blind spots (unconscious biases). Then, they need to know where this analogy fails, which breaks are critical for their writing, and which are minor. Finally, they ask if writing inner life as perceptually available still works or if they need a new model. 

  First, I consider how to map the analogy. The "eye" is the conscious self, "objects" are emotions or thoughts, "looking" is focused attention, "lighting" is emotional clarity, and "blind spots" are unconscious processes. The user's concern is that psychology shows we're often wrong about why we act or feel certain ways—like confabulating reasons post-hoc—which threatens the "shine a light and see" model. 

  Where does the analogy snap? It breaks at the reliability of observation. Unlike seeing a physical object, introspection is inferential and shaped by biases. For a novelist, this could be fatal if they portray characters as always accurate about their inner states. But it’s not a dealbreaker—fiction thrives on subjective experience, even if flawed. 

  The key is distinguishing between fatal breaks and philosophical quibbles. A fatal break: assuming characters perfectly perceive their motives. That’s unrealistic. But the act of *trying* to introspect—the messy, sometimes wrong interpretations—is rich material. The user doesn’t need to ditch the model; they can enhance it by embracing unreliability. 

  Final answer: Writing "as if" inner life is perceptually available survives if it includes the flaws. The user’s craft isn’t broken; it just needs nuance. Characters can "see" jealousy but misunderstand its source—that’s human, and great fiction. The audit isn’t a rejection; it’s an upgrade to deeper authenticity.
answer: |-
  Here's your analogy audit, tailored for craft:

  ### Correspondence Table
  | **Perception Element** | **Introspection Equivalent** | **Break Point** |
  |------------------------|-----------------------------|----------------|
  | **Eye**                | Conscious self              | Stable observer illusion; self is reconstructed |
  | **Object Seen**        | Mental state (emotion, memory) | States are often interpretations, not raw data |
  | **Act of Looking**     | Attentional focus           | Works for surface feelings, not deep causes |
  | **Lighting Conditions**| Emotional clarity/mood      | Mood distorts "visibility" (e.g., anxiety amplifies threats) |
  | **Blind Spots**        | Unconscious processes       | Motives, biases, physiological triggers remain opaque |

  ### Where It Snaps Fatally
  1. **"Object Seen" as Literal Truth**: Characters *cannot* accurately perceive origins of feelings/motives (Nisbett & Wilson). A character stating *"I did X because of Y"* is often confabulation.  
  2. **Blind Spots Are Vast**: Core drivers (implicit biases, trauma responses) evade the "flashlight." What's "seen" is a post-hoc narrative.

  ### Non-Fatal Quibbles
  1. **Self as Observer**: While philosophically shaky, the *felt experience* of an observing "I" is universal. Use it.  
  2. **Partial Visibility**: That emotions *feel* perceived is valid. Anger's heat *is* introspectable, even if its trigger is misidentified.

  ### Does the Model Survive?
  **Yes, with crucial upgrades:**  
  - **Write the *Process*, Not Just the Report**: Show characters *interpreting* flickers of feeling ("Was that jealousy? No, just indigestion... maybe?").  
  - **Embrace Narrative Blindness**: Let characters be confidently wrong. Their self-misunderstanding *is* truth.  
  - **Use the Flashlight's Limitations**: Lighting conditions (stress, denial) become plot engines. What *can't* they see? That’s tension.  

  **Keep this core**: The *phenomenology* of introspection—the *feeling* of inward attention—is authentic human experience. Your model survives if you depict introspection as a *constructive act* (building a story from glimpses), not a passive revelation. The beam illuminates fog, not fossils.
