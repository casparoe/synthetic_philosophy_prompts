answer: |-
  The discounting practice in regulatory cost-benefit analysis (CBA) rests on an implicit theory of intergenerational value that is primarily **economic and welfarist**, but its moral foundations are contested. Let's reconstruct the theory, distinguish presuppositions from compatible elements, assess consistency with long-horizon policies, and explore implications of rejecting pure time preference.

  ### Core Implicit Theory of Discounting Practice
  1. **Welfarism & Comparability**:  
     Strictly presupposes that well-being (including survival) is quantifiable and comparable across time and generations. Benefits (e.g., lives saved) are reduced to monetary equivalents, treated as transferable "resources."

  2. **Opportunity Cost of Capital**:  
     **Central justification**: Discounting reflects the productivity of capital. A 7% discount rate implies resources invested today could yield ~7% annual returns, enabling *greater* future benefits (e.g., $1 invested today could save >1 life in 100 years). This does not *strictly* presuppose that future lives matter less—only that sacrificing present welfare for future gains must outperform alternative investments.

  3. **Pure Time Preference (PTP)**:  
     Often embedded in practice (e.g., via Ramsey Rule: discount rate = pure time preference + wealth effect). A positive PTP (e.g., 1–2%) **does presuppose that future welfare has less moral weight simply because it occurs later**. This is ethically contentious but may reflect:  
     - **Impatience**: Empirical observation that people prefer present benefits.  
     - **Survival uncertainty**: Risk that future generations won't exist (though negligible over 100 years).  
     - **Moral parochialism**: Psychological bias toward proximate generations.

  4. **Expected Utility under Uncertainty**:  
     High discount rates account for increasing uncertainty over long horizons (technological change, societal collapse). This is distinct from PTP but practically conflated in a single rate.

  ### Distinguishing Presuppositions from Compatible Elements
  - **Strictly Presupposed**:  
    - Welfare is fungible and monetizable.  
    - Decisions must satisfy efficiency (Kaldor-Hicks).  
    - Capital has opportunity cost; sacrificing consumption today requires compensation via returns.  
  - **Compatible but Not Required**:  
    - Pure Time Preference (agencies like OMB allow it but don't mandate it).  
    - Utilitarianism (though non-utilitarians could accept opportunity-cost arguments).  
    - Anthropocentrism (if non-human benefits are monetized).

  ### Consistency with Long-Horizon Policies
  The tension is **logical but politically managed** through compartmentalization:  
  - **Nuclear Waste/Climate Policies**: Framed as **deontological obligations** (avoiding irreversible harm) or **catastrophic risk management** (minimizing existential threats). Discounting is often suspended here, acknowledging that some costs defy monetization.  
  - **Sovereign Wealth Funds**: Reflect **intergenerational reciprocity** (saving windfalls for future citizens) or **sustainability**, not strict CBA.  
  - **Inconsistency**: A 7% discount rate makes preventing a climate disaster in 2100 almost irrelevant in today's CBA. Governments thus use **multiple decision frameworks**, applying discounting selectively to "routine" regulations while exempting "existential" policies—a pragmatic but theoretically ad hoc approach.

  ### Implications of Rejecting Pure Time Preference
  If an agency adopts that "the mere timing of a life makes no difference," calculations would change as follows:  
  1. **Eliminate PTP**: Set η (elasticity of marginal utility) to drive discounting, but keep PTP = 0.  
  2. **Lower Discount Rates**: Use only opportunity-cost component (e.g., 3–4% instead of 7%).  
  3. **Long-Term Benefits Gain Weight**: Preventing a death in 100 years would be valued ~5× higher at 3% vs. 7%. Climate mitigation becomes far more urgent.  
  4. **Address Uncertainty Differently**: Replace constant rates with **declining discount rates** (DDRs) based on uncertain economic growth (e.g., UK Green Book).  
  5. **Non-Monetary Thresholds**: Apply "safe minimum standards" to irreversible harms (e.g., extinction risks), exempting them from discounting.  
  6. **Equity Weighting**: Favor investments benefiting distant future generations if they are expected to be poorer (η > 0).

  ### Assessment
  - **Moral Status of Future People**: The practice **does not strictly require** valuing future lives less due to timing—opportunity costs alone can justify discounting. However, common use of PTP *implicitly endorses* such a view.  
  - **Consistency**: Long-horizon policies reveal **strategic inconsistency**. Governments often reject discounting's implications for the far future, suggesting the practice is ill-suited for very long-term risks.  
  - **Reform Potential**: Removing PTP and using DDRs could align CBA with longtermist ethics without abandoning economic rigor. Yet even a 0% PTP may not satisfy philosophers who prioritize the *potential scale* of future welfare over marginal trade-offs.

  ### Conclusion
  The practice presupposes a **weak intergenerational altruism** constrained by economic efficiency. It conflicts with long-horizon policies unless supplemented by non-utilitarian principles. Rejecting pure time preference would shift analysis toward the interests of the far future but not eliminate tension with opportunity-cost logic—which still favors near-term gains unless future returns are certain and substantial. Full consistency would require either discarding discounting for existential risks or adopting DDRs with η-weighted equity.
