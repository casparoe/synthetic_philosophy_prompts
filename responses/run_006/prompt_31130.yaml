  Looking at the opportunity cost argument: economists often justify discount rates based on the idea that money spent now could be invested, generating returns. So a dollar today is worth more than a dollar tomorrow. But when applied to lives saved, does that imply that future lives are less important? Or is it just a practical financial consideration? 

  Then there's the pure time preference argument. Some theories, like those from Ramsey, include a factor for pure preference for present over future. If agencies include this, even a small percentage, it suggests that future welfare is inherently less valuable. That's a moral stance. I need to check if standard practices like the OMB guidelines mention pure time preference. 

