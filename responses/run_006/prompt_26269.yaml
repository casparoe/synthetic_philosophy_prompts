  According to the knowledge norm: Does the person know the mathematical claim? They once had a proof, but now they have forgotten it. They only have a memory that they once proved it and remain confident. But in epistemology, it is often argued that such a person does not currently know the claim because they lack current justification. They cannot provide any reason now. So the knowledge norm would say that the assertion is improper.

  Does that strike us as the right result? It might. If someone asserts a complex mathematical claim and cannot recall any reason for it, we might think they shouldn't assert it flat-out. They should say, "I think it's true because I recall proving it, but I don't remember the proof." So the knowledge norm gives the verdict: improper. And that seems plausible.

