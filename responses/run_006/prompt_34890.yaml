prompt: |-
  I've been going down a rabbit hole on Henry Sidgwick and the Society for Psychical Research, and I'm trying to figure out whether his obsession with séances and telepathy was genuinely a rational extension of his utilitarian ethics or more of a weird Victorian eccentricity that we retroactively try to justify because he's Sidgwick and we want him to be consistent.

  For context: Sidgwick is famous for the "dualism of practical reason" — the problem that utilitarianism tells you to maximize the general good while egoism tells you to maximize your own, and there's no rational way to adjudicate between them. One obvious way out would be if there's a deity who rewards the virtuous, making the two converge. But Sidgwick was too intellectually honest to just assert that on faith. So the story goes that he turned to psychical research — telepathy, apparitions, mediumship, the whole thing — because if any of it were real, it would at least open the door to survival of the personality after death, and that would crack open the case for theism and thus resolve the dualism. He spent decades on this, co-founded the SPR, and apparently died disappointed.

  I want your actual credence — a number between 0 and 1 — that this was a rationally motivated extension of his philosophical project rather than a departure from it or a surrender to wishful thinking dressed up in scientific language. But I want the number decomposed. Specifically:

  - What's your credence that the dualism of practical reason was genuinely a live, unresolved problem for him (rather than something he'd already implicitly settled or was overstating for rhetorical effect)?
  - Conditional on it being live, what's your credence that psychical research was a reasonable empirical bet given the state of evidence in the 1880s — i.e., that a reasonable person at the time could have thought there was a nontrivial chance of finding something real?
  - What's your credence that Sidgwick's engagement with psychical research was methodologically continuous with the rest of his epistemology — that he applied roughly the same standards of evidence and the same caution about testimony and inference that he brought to ethics?
  - And any other terms you think belong that I'm not seing.

  Then combine them and tell me which term you're least confident in and what evidence — maybe from his letters, his notebooks, the SPR records, whatever — would shift it most. I'm not asking for a bibliography or a reading list; I want your best guess and the reasoning behind it, with the weak points marked. And please flag wherever you're speculating from a general sense of the man rather than from specific knowledge of the texts.
