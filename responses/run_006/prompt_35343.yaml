prompt: |-
  You are a philosopher who specializes in the ethics of paternalism and choice architecture. Before you write the procedure, take time to think through the key conceptual distinctions in the literature — hard versus soft paternalism, means versus ends paternalism, manipulation versus rational persuasion, transparency conditions, autonomy as non-interference versus autonomy as capacity — and decide which of these distinctions must survive the translation into an operational tool and which can be simplified without losing too much.

  I work in a city government's behavioral insights unit. We design small changes to default options, forms, signage, and choice architecture to improve outcomes — automatic enrollment in retirement savings, changing the order of food items in cafeterias, simplifying paperwork for benefits. We have a loose set of principles we inherited from the nudge literature, but we don't have anything systematic for deciding whether a proposed intervention crosses the line from acceptable influence into manipulation or unjustified paternalism. Our decisions are medium-stakes: they affect thousands of residents, and a bad one generates complaints to the mayor's office and op-eds about the "nanny state." We need something we can run in an hour or two before a design meeting, and the output has to be defensible to a non-specialist deputy mayor who will ask, "Why is this one okay and that one isn't?"

  Please write a decision procedure — a checklist or structured set of questions in order — that my team can apply to a proposed nudge to determine whether it is ethically permissible. The procedure should be grounded in the philosophical literature on paternalism, autonomy, and manipulation, but you should translate the concepts into operational tests that someone without a philosophy background can apply. For each step, specify what kind of evidence or reasoning counts as a satisfactory answer, where the procedure stops with a "no," and where it flags a case for human judgment because the question is one of values rather than facts.

  Then apply the procedure to three proposals:

  1. Changing the default on a city retirement savings program from opt-in to opt-out (with easy opt-out), on the grounds that many eligible residents who say they want to save never get around to enrolling.
  2. Rearranging a cafeteria line so that fruit and vegetables are at eye level and desserts are below the counter, out of direct sight, to reduce calorie intake.
  3. Automatically scheduling a colonoscopy appointment for every resident who turns 50 and sending them a letter that says, "Your appointment is on [date]. If this doesn't work, call to reschedule. If you don't want one, call to cancel." (The aim is to increase screening rates; the procedure is medically recommended and covered by public insurance.)

  Make sure at least one of these applications yields an answer that my team will find uncomfortable — that is, the procedure says "no" to something we would like to do, or "yes" to something we would rather not defend. Finally, tell me honestly what the procedure cannot handle: which kinds of cases will it misclassify, and where does it rely on distinctions that turn out to be vague or contested when you look at them closely?
reasoning: |-
  Okay, let me approach this as an ethics specialist would. The user needs a practical decision procedure rooted in philosophical concepts but operationalized for government behavioral units. 

  First, I need to map key paternalism distinctions to actionable filters:
  - Hard vs soft paternalism becomes about reversibility and cost
  - Means vs ends paternalism translates to goal legitimacy checks
  - Manipulation criteria focus on transparency and cognitive bypass
  - Autonomy requires testing both freedom from interference and capacity-building

  The challenge is preserving philosophical rigor while creating something usable in 90-minute meetings. I'll prioritize questions that force explicit value choices - like whether an intervention changes decisions through awareness rather than subversion.

  For the three test cases:
  The retirement savings default passes easily (reversible, trivial opt-out)
  The cafeteria redesign is borderline but acceptable (transparent, preserves choice)
  The colonoscopy default fails the reversibility test - cancellation is medically complex, making it coercive in practice

  The procedure's main weakness is handling contested "public good" definitions and slippery-slope concerns. It also can't resolve when trivial opt-out costs become substantive barriers - that requires contextual judgment. I'll build in explicit "judgment call" flags at these ambiguity points.

  The uncomfortable conclusion - that medical defaults can cross into coercion - is deliberately included to show the tool isn't just justification theater. The deputy mayor will need political courage for that one.
answer: |-
  ## Ethical Nudge Evaluation Procedure v1.0

  **Philosophical Grounding Simplified:**
  *   **Acceptable Influence:** Helps people overcome biases/inertia to achieve *their own* goals, preserves *meaningful choice*, respects autonomy as *capacity* (enabling better decisions).
  *   **Unjustified Paternalism/Manipulation:** Imposes *our* values/goals, significantly restricts/misdirects choice, exploits cognitive weaknesses without consent, undermines autonomy as *non-interference* or *capacity*.

  **Decision Procedure (Checklist): Apply in Order**

  1.  **Goal Legitimacy & Public Good:**
      *   *Question:* Is the primary goal clearly aligned with widely accepted public welfare objectives (e.g., health, financial security, safety) *and* does it demonstrably help individuals achieve *their own* likely ends (e.g., wanting health, retirement savings)?
      *   *Evidence:* Public health guidelines, financial literacy data, stated resident priorities (surveys), cost-benefit analysis showing net societal benefit. Medical consensus for health interventions.
      *   *Stop if No:* Goal is purely ideological, coercive, or primarily serves a private interest. *Flag for Judgment:* Disagreement on what constitutes "public welfare" or "likely ends" in this context.
      *   *Operational Test:* Can we confidently state most residents would endorse this goal if asked rationally? Is there expert consensus (medical, economic, etc.) supporting the goal?

  2.  **Freedom of Exit (Reversibility & Cost):**
      *   *Question:* Is opting out of the nudge genuinely easy, timely, costless (or very low cost), and clearly communicated? Does it require minimal effort compared to opting in?
      *   *Evidence:* Clear instructions, simple process (e.g., single click/phone call), no fees/penalties, accessible channels, time given to decide. Compare effort/cost of opting-out vs. original opting-in effort.
      *   *Stop if No:* Opting out is difficult, obscure, costly, delayed, or requires significant effort/resource investment. *Flag for Judgment:* Defining "low cost" (is 10 minutes on hold "low cost"?). Situations with high emotional/psychological barriers to opting out.
      *   *Operational Test:* Could a reasonably busy, average resident undo the nudge in under 5 minutes without financial penalty or social stigma? Is the path to "no" as clear and easy as the path to "yes"?

  3.  **Transparency & Non-Deceptiveness:**
      *   *Question:* Is the intervention and its purpose reasonably transparent to the affected individual? Does it avoid exploiting irrational biases in a hidden or deceptive way?
      *   *Evidence:* Clear signage/language explaining the change/presence of the nudge. No hidden triggers, misleading framing, or exploiting subconscious vulnerabilities without awareness (e.g., subliminal messaging). Purpose is statable without embarrassment.
      *   *Stop if No:* Relies on deception, hidden mechanisms, or exploits a vulnerability the person couldn't reasonably be aware shields against. *Flag for Judgment:* Degree of transparency required (full disclosure of behavioral science? Simple explanation?). Distinguishing "salient but ethical" placement from "manipulative" placement.
      *   *Operational Test:* If a resident asked "Why is this set up this way?", could we give a truthful, non-technical answer they'd likely understand and that wouldn't inherently undermine the nudge? Does it *feel* sneaky?

  4.  **Autonomy Respect (Means vs. Ends):**
      *   *Question:* Does the nudge primarily influence the *means* (making the desired path easier/faster) rather than overriding the individual's final *ends* (goal/choice)? Does it preserve their capacity to make a different choice?
      *   *Evidence:* Nudge targets *inertia*, *complexity*, or *present bias* hindering choice execution, not fundamentally changing the value proposition or available options. The core decision (save/don't save, eat fruit/dessert, get screened/decline) remains intact and accessible.
      *   *Stop if No:* Nudge fundamentally alters the perceived value/risk of the options or makes the alternative choice conceptually inaccessible. *Flag for Judgment:* Cases where influencing means *significantly* steers ends due to context (e.g., extreme inertia). Defining the core "end" (is "saving *some*" the end, or "saving *this specific amount*"?).
      *   *Operational Test:* After the nudge, is the person still making the *same core type of decision* with the *same core options*, just with a different starting point or reduced friction on one path?

  5.  **Proportionality & Justification Burden:**
      *   *Question:* Is the strength of the nudge proportional to the (1) significance of the goal, (2) magnitude of the harm/benefit, and (3) prevalence of the barrier it addresses? Does the evidence justify bypassing strict neutrality?
      *   *Evidence:* Data on problem severity (e.g., low savings rates, high obesity costs, cancer mortality), evidence the barrier targeted (inertia, salience) is a major factor, cost-effectiveness of the nudge vs. alternatives. Stronger nudges require stronger justification.
      *   *Stop if No:* Nudge is overly forceful/coercive for a trivial problem, lacks evidence of need/effectiveness, or less intrusive alternatives exist. *Flag for Judgment:* Weighing significance of different harms/benefits. Defining "proportional." Acceptable strength for life-saving vs. convenience nudges.
      *   *Operational Test:* Given the stakes (health, finances) and the scale of the problem, does this nudge feel like a "light touch" solution? Would a neutral observer agree the problem justifies this level of influence? Is the evidence base solid?

  **Scoring:**
  *   **Proceed:** All 5 steps pass.
  *   **Revise & Reassess:** One or more "Flag for Judgment" points arise – team discussion & potential modification needed.
  *   **Do Not Proceed:** Any step results in "Stop if No".

  ---

  **Application to Proposals:**

  1.  **Retirement Savings Default Change (Opt-In to Opt-Out)**
      *   **1. Goal Legitimacy:** Pass. Financial security is a core public good. Data shows people *want* to save but procrastinate (achieves their own ends).
      *   **2. Freedom of Exit:** Pass. Opt-out is typically designed to be very easy (e.g., online form, phone call), costless, clearly communicated. Effort <<< original opt-in.
      *   **3. Transparency:** Pass. Defaults are generally understood concepts ("you're enrolled unless you say no"). Can be clearly communicated.
      *   **4. Autonomy Respect (Means/Ends):** Pass. Influences overcoming inertia/complexity to save (means). The core choice (save/don't save) remains fully available via easy opt-out.
      *   **5. Proportionality:** Pass. Significant goal (retirement security), strong evidence inertia is a major barrier, default changes are highly effective and minimally intrusive. Strong justification.
      *   **Verdict:** **Proceed.** Ethically permissible.

  2.  **Cafeteria Line Rearrangement (Fruit @ Eye Level, Desserts Hidden)**
      *   **1. Goal Legitimacy:** Pass (Judgment Flag). Improving public health/nutrition is a legitimate goal, aligns with individuals' likely desire for health. *Flag:* "Likely desire" interpretation – some may actively prefer dessert.
      *   **2. Freedom of Exit:** Pass. Choosing dessert requires minimal extra effort (bending down/asking). No cost, no barrier beyond reduced salience.
      *   **3. Transparency:** Pass (Judgment Flag). Placement is observable. Purpose (healthier choices) is statable. *Flag:* Is hiding desserts "deceptive"? Arguably manipulative by reducing salience/accessibility, but not actively deceptive. Borderline case – requires team discussion on acceptability of salience reduction.
      *   **4. Autonomy Respect (Means/Ends):** Pass (Judgment Flag). Influences salience/ease (means). Core choice (fruit vs. dessert) remains physically available. *Flag:* Does significant salience reduction undermine the capacity to choose dessert *as easily*? Arguably yes, but choice remains.
      *   **5. Proportionality:** Pass. Obesity is a major public health issue, salience is a known driver, intervention is low-cost and preserves choice. Justified.
      *   **Verdict:** **Revise & Reassess** (due to Flags on Transparency/Manipulation & Autonomy nuances). *Likely Permissible after discussion* if team agrees salience nudges within bounds for public health goals. Transparency (e.g., a small sign "Healthier options made easier to see!") could mitigate concerns.

  3.  **Automated Colonoscopy Scheduling ("Your appointment is... Call to Cancel")**
      *   **1. Goal Legitimacy:** Pass. Increasing life-saving cancer screening is a strong public health goal, aligns with individuals' likely desire for health/longevity (medically recommended).
      *   **2. Freedom of Exit:** **FAIL.** Opting out ("call to cancel") requires proactive action. The *default inertia* now favors the procedure. Cancelling a scheduled medical appointment often involves phone calls, potential wait times, explaining oneself, overcoming "doctor knows best" bias, or fear of confrontation. Effort/Cost (psychological & time) >> Original Effort (calling to schedule). *Not genuinely easy or low-cost.*
      *   *Procedure Stops Here.*
      *   **Verdict:** **Do Not Proceed (in this form).** The high barrier to opting out makes this coercive soft paternalism, crossing into manipulation by exploiting inertia and potential medical authority bias. It fails the core test of preserving meaningful, easy choice. *This is the uncomfortable "No".*

  ---

  **Honest Limitations of the Procedure:**

  1.  **Vagueness at the Margins:** Key terms ("low cost," "easy," "transparent," "proportional," "core ends") have grey zones. The "Flag for Judgment" steps acknowledge this, but teams might inconsistently apply these thresholds without robust discussion norms.
  2.  **Value Conflicts Masked as Facts:** Step 1 (Goal Legitimacy) and Step 5 (Proportionality) inherently involve value judgments about what constitutes "public good" or "significant harm." The procedure relies on evidence (consensus, data), but deep societal disagreements (e.g., on dietary fat vs. sugar, optimal savings rates) can make this step contentious, appearing factual when it's partly normative.
  3.  **Cumulative Effects & Slippery Slopes:** The procedure evaluates single nudges. It doesn't assess the *aggregate effect* of multiple nudges across different domains on an individual's sense of autonomy or the broader perception of government overreach ("death by a thousand nudges").
  4.  **Distributional Impacts:** It doesn't explicitly require analysis of whether the nudge disproportionately burdens or benefits specific groups (e.g., those with lower tech literacy for online opt-outs, cultural preferences in cafeteria choices). Steps 2 and 4 touch on this, but not systematically.
  5.  **Exploitation vs. Assistance:** Distinguishing between "helpfully overcoming a bias" (e.g., inertia for savings) and "exploiting a vulnerability" (e.g., using scarcity bias to promote unhealthy choices) in Step 3 relies heavily on context and intent, which can be hard to pin down operationally.
  6.  **"Rational" Ends Assumption:** Step 1 assumes people have stable, rational underlying ends (health, security). It struggles with interventions targeting choices where deep irrationality or self-harm is suspected (e.g., extreme addiction), potentially misclassifying stronger interventions as impermissible when they might be justified (or vice versa).
  7.  **Cultural Specificity:** Concepts of autonomy, transparency, and acceptable influence can vary culturally. The procedure is likely biased towards Western liberal individualistic norms.

  **Conclusion:** This procedure provides a structured, philosophically grounded framework for evaluating the ethical permissibility of nudges in a government context. It forces explicit consideration of key ethical dimensions (choice, transparency, goals, justification) and will flag the most egregious cases of manipulation or coercion (like Proposal 3). However, it requires thoughtful application by the team, particularly when encountering "Flag for Judgment" points, and acknowledges inherent limitations in resolving deep value conflicts or perfectly defining fuzzy concepts. Its strength lies in making ethical reasoning systematic and defensible, even if not perfectly determinate in every edge case. Use it as the *start* of the ethical discussion, not the end.
