prompt: |-
  I'm running a reading group for philosophy PhD students — none of them are in metaphysics, they're mostly in ethics, political philosophy, and history of philosophy. Next session I want to teach them the idea of a merely verbal dispute in metaphysics, and how it connects to metaontology (the Carnap/Quine stuff, quantifier variance, that whole area). The session is 90 minutes.

  Don't explain the view to me — I know it. I want you to plan how I should explain it. What has to come first? I'm thinking they need to grasp the distinction between a substantive and a merely verbal dispute before they can even see why anyone would think the ontology debates are verbal — but maybe I'm wrong about the order and I need to start with the ontology cases themselves. What's the one carrying example I should use to make the whole thing click? (Please don't say "the ship of Theseus" — I want something that makes the meta-level point rather than just another puzzle case.) What misconceptions should I expect from this group specifically — I'm guessing they'll think "merely verbal" means "trivial" or "not worth having," and I need to head that off. At what point in the sequence do I introduce quantifier variance, and where do I put the Carnap/Quine distinction? And what's one question I can ask at the end to check whether they got it, not just whether they can repeat the definitions? Oh and also — what should I explicitly refuse to get into at this level? I'm worried about getting bogged down in the realism/anti-realism stuff.

  Please write the answer in American English.
