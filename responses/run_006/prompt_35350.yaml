  First, I need to figure out the best sequence. The user is debating whether to start with the substantive vs. verbal distinction or dive straight into ontology cases. Since the students aren't metaphysicians, it's probably better to begin with something familiar and concrete. Starting with an example from ethics or politics could make the abstract idea more accessible. For instance, using a dispute about whether a protest is "violent" could illustrate how disagreements can hinge on word meanings rather than facts. That sets a foundation before moving to metaphysics.

  Next, choosing the right carrying case is crucial. The user doesn't want the Ship of Theseus because it's a puzzle case that might distract from the meta-level point. The "composite objects" example—like whether there's a "snowdiscall" (snowball vs. snow disc)—is better. It forces the question: is the debate about reality or just language? That directly leads into metaontology.

  For misconceptions, the user is right that "merely verbal" might be seen as trivial. I should emphasize that these disputes can be deep, involving conceptual frameworks. Also, students might confuse verbal disputes with contextual disagreements or think all ontology debates are verbal. Clarifying these early will help.

  Introducing quantifier variance should come after establishing verbal disputes. Once they grasp that ontology debates might be verbal, explaining quantifier variance as different meanings of "exist" makes sense. Carnap and Quine come next: Carnap sees ontology as linguistic frameworks, while Quine ties existence to quantifiers with empirical constraints. Their debate highlights the metaontology clash.

  The user wants a question to check understanding. Asking them to analyze a new case (e.g., "Is an edited manuscript a new work?") would test if they can apply the concepts, not just recite them. 

  Things to avoid: realism/anti-realism is a rabbit hole. The user should explicitly dodge this, keeping focus on the meta-level. Also, skip technical Quinean details and deep dives into historical context. 

  Timing-wise: 10 mins intro, 15 mins on verbal disputes with examples, 15 mins on composite objects, 10 mins on metaontology shift, 15 mins on quantifier variance, 15 mins on Carnap vs. Quine, 5 mins for the application question, and 5 mins wrap-up. That fits 90 minutes. 

  The user’s unspoken need is making metaontology relevant to non-metaphysicians. By starting with ethics/politics examples and stressing implications for their fields (e.g., "what is violence?"), the session shows how conceptual choices matter everywhere. That’ll engage them and prevent dismissal as "just metaphysics."
answer: |-
  Here’s a streamlined 90-minute session plan designed for non-metaphysicians, focusing on clarity and avoiding rabbit holes:

  ---

  ### **Session Structure & Key Moves**  
  **Total: 90 mins**  

  #### **Phase 1: Grounding "Merely Verbal Dispute" (25 mins)**  
  1.  **Hook (5 mins):** Start with a **political philosophy example** they know:  
      *"Is a hunger strike violence?"*  
      - Side A: Yes—it coercively pressures authorities.  
      - Side B: No—it’s passive non-action.  
      **Ask:** *"Is this disagreement about facts or word usage?"* Elicit intuitions.  

  2.  **Define Core Distinction (10 mins):**  
      - **Substantive dispute:** Parties agree on meanings but disagree about facts/reality (e.g., "Did the protest cause riots?").  
      - **Merely verbal dispute:** Parties *misunderstand* they assign different meanings to key terms (e.g., "violence").  
      **Emphasize:** "Merely verbal" ≠ trivial! It reveals deep conceptual commitments.  

  3.  **Carrying Case (10 mins): Use "Snowdiscall" (Hirsch):**  
      - Sculptor shapes snow into a ball ("snowball"). Flattens it into a disc ("snow disc").  
      **Dispute:** *"Is the snowdiscall identical to the original snowball?"*  
      - Realist: "No—shape changed!"  
      Universalist: "Yes—same snow!"  
      **Punchline:** They mean different things by "object." No fact of the matter about "objecthood" itself.  

  #### **Phase 2: Metaontology via Carnap/Quine (40 mins)**  
  4.  **Pivot to Ontology (5 mins):**  
      *"Metaphysics has ‘snowdiscalls’: ‘Do numbers exist?’, ‘Are there tables?’ Why isn’t this obvious?"*  

  5.  **Carnap’s Challenge (15 mins):**  
      - **Internal questions:** Settled by framework rules (e.g., "Are there prime numbers > 100?" → math).  
      - **External questions:** "Which framework to adopt?" Pragmatic, not factual.  
      **Link:** Ontology debates look external but are disguised internal disputes.  

  6.  **Quantifier Variance (QV) (10 mins):**  
      - **Eli Hirsch’s move:** "Exists" (∃) means different things in different conceptual schemes.  
      - **Example:** "Tables exist" is true in a "commonsense" scheme (if arranged particles) but false in a "fundamental physics" scheme.  
      **Key insight:** QV turns ontology debates into verbal disputes about "existence."  

  7.  **Quine’s Rebuttal (10 mins):**  
      - **"To be is to be the value of a variable":** Only one quantifier meaning ("∃"), tied to our best science.  
      - **Contrast:** Carnap/QV say choosing quantifier meaning is pragmatic. Quine says it’s fixed by physics.  

  #### **Phase 3: Implications, Misconceptions & Application (25 mins)**  
  8.  **Address Misconceptions (10 mins):**  
      - ❌ "Merely verbal = trivial" → ✅ "Reveals conceptual foundations."  
      - ❌ "All disputes are verbal" → ✅ "Only when meaning divergence explains disagreement."  
      - ❌ "Carnap/Quine disagree about science" → ✅ "They disagree about *meta*ontology."  

  9.  **Application Exercise (10 mins):**  
      **Question:** *"In ethics, if two theorists disagree whether ‘justice’ requires equality or merit, when could this be merely verbal?"*  
      **Goal:** Test if they see meaning variance vs. substantive clashing values.  

  10. **Wrap-up (5 mins):**  
      - **Takeaway:** Ontology debates *might* be verbal if QV is true.  
      - **Avoided:** Realism/anti-realism (it’s downstream), technical quantifier semantics.  

  ---

  ### **What to Explicitly Avoid**  
  - **Realism/anti-realism debates:** Say: "We’re analyzing *whether* ontology is substantive, not taking sides."  
  - **Quine’s indeterminacy of translation:** Too tangential.  
  - **Historical deep dives:** Stick to Carnap’s "Empiricism, Semantics, and Ontology" (1950) and Quine’s "On What There Is" (1948) as landmarks, not intellectual biography.  

  ---

  ### **Why This Works for Your Group**  
  - **Ethics/politics/history students** engage via familiar examples before metaphysics.  
  - **"Snowdiscall"** avoids puzzle-fatigue while forcing the meta-question: *"What do you MEAN by ‘object’?"*  
  - **QV/Carnap/Quine sequencing** flows naturally:  
    Verbal dispute → Ontology as candidate → QV explains it → Quine denies QV.  
  - **Final question** tests transfer: Can they spot meaning variance in their fields?  

  **Pro tip:** Pre-empt eye-rolling about metaphysics by stressing: *"This isn’t about ‘how many angels fit on a pin’—it’s about when disagreements are genuine."* Tie back to ethical/political concepts to show relevance.
