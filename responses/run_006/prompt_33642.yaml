prompt: |-
  I'm a third-year undergraduate in a seminar called "The Normativity of Contracts," and we've spent the past several weeks on the question of why promises bind. We've worked through Hume's convention-based account in the Treatise, Rawls's practice-based view from "Two Concepts of Rules," and Scanlon's expectation-based account from What We Owe to Each Other. Our professor has asked the class to help design an in-class activity for next week's session that will make the rest of the students — about eighteen of us — feel the force of the central puzzle experientially rather than just reading about it. The session is eighty minutes, and the room is a seminar room with movable chairs and a whiteboard.

  The puzzle we keep circling around is this: when you break a promise, are you doing something wrong primarily because you've harmed the specific person you made the promise to — disappointed their expectations, betrayed their trust, taken advantage of their reliance — or because you've undermined a valuable social practice that everyone benefits from and you're free-riding on that practice? Or is there some third thing, something about the exercise of normative powers or the transfer of authority, that neither of these quite captures? The readings pull in different directions, and the discussion keeps stalling out because we don't have a shared experience to anchor the disagreement.

  I'd like to propose a structured activity — ideally a game with real but small stakes, like candy or extra-credit points — that forces participants to confront this question from the inside. The activity should have two distinct phases. In the first phase, promises are embedded in a clearly beneficial social practice: making and keeping promises visibly improves everyone's outcomes, and breaking them visibly harms the practice for everyone. In the second phase, promises are made one-on-one in isolation from any broader practice — no reputation, no group benefit, no third-party awareness — and participants have to decide whether they still feel bound. The transition between the two phases should be jarring: participants should walk out of the first phase convinced that the practice explains everything, and then find themselves in the second phase feeling that something is still missing. I need: (a) rules and materials for both phases, including a payoff scheme that doesn't require real money; (b) a timeline for the full eighty-minute session; (c) a debrief script that maps specific moments in the activity onto the philosophical accounts we've read, shows where the practice-based view gains traction and where it loses it, and introduces the voluntarist or authority-based alternative at the right moment; (d) an honest note on what will predictably go wrong when the activity is run — especially the risk that participants in Phase 2 will simply import the norms from Phase 1 and not feel the tension; and (e) a suggestion for a follow-up discussion question or short reading that ties the experience back to the texts.
reasoning: |-
  Okay, the user is a third-year undergrad in a seminar on contract normativity. They've been studying why promises bind, covering Hume, Rawls, and Scanlon. The professor wants an in-class activity to make the philosophical puzzle experiential. The puzzle centers on whether promise-breaking is wrong due to harm to an individual (trust, reliance) or undermining a social practice (free-riding), or if there's a third element like normative powers.

  The user needs a structured game with two phases. Phase 1 should show promises in a beneficial social practice where keeping them helps everyone. Phase 2 isolates promises to one-on-one interactions with no broader context. The goal is to create a jarring transition where students feel the practice view is sufficient in Phase 1 but inadequate in Phase 2. 

  Key requirements include rules for both phases, an 80-minute timeline, a debrief script linking to philosophers, potential pitfalls, and a follow-up question. The user also mentioned using small stakes like candy or extra credit. 

  First, I need to design the two phases. For Phase 1, a group-based game makes sense. Maybe something involving resource distribution where promises facilitate cooperation. The Trust Circle Game comes to mind—students in circles passing resources, with rules that require promising to share. Breaking promises would harm the group's efficiency. Materials needed are tokens (poker chips), envelopes, timers, and a whiteboard for tracking.

  For Phase 2, isolated dyads where students privately promise to share candy but face temptation to keep it all. No group consequences, just personal gain. This should highlight individual reliance without the social practice context. Materials here would be candy, envelopes, and privacy screens.

  Stakes are important but can't involve real money. Candy works for Phase 2, but Phase 1 needs a different incentive. Extra credit points could work, but the professor might not approve. Maybe tokens redeemable for candy later? That avoids real stakes while maintaining engagement.

  The timeline must fit 80 minutes. Phase 1 setup and gameplay (20 minutes), transition (5 minutes), Phase 2 (15 minutes), then debriefing (40 minutes). Debrief is crucial to connect the experience to the readings. Need to point out how Phase 1 aligns with Hume and Rawls—social benefits and conventions. Phase 2 should evoke Scanlon's Principle F and the individual harm, but also show that even without social practice, promises feel binding, hinting at a third view like voluntarist theories.

  Potential pitfalls: Students might carry over norms from Phase 1 to Phase 2, diminishing the tension. To prevent this, emphasize the isolated nature in Phase 2 instructions. Some might not take the stakes seriously, so using candy could help. Also, ensuring students don't discuss decisions between phases is key. 

  The debrief script should start with observations, then link to theories. Highlight moments where the social practice was evident in Phase 1 and how breaking promises felt different in Phase 2. Introduce the voluntarist perspective when students express feeling bound despite no social consequences.

  Follow-up could focus on Raz's authority-based view or a reading on normative powers. A discussion question asking if the obligation in Phase 2 is different in kind from Phase 1 would tie back to the texts.

  Materials are simple: poker chips, candy, envelopes, timers. Setup requires movable chairs for circles in Phase 1 and dyads in Phase 2. Whiteboard for tracking group scores.

  Need to ensure the transition is clear. After Phase 1, collect all materials, reposition chairs, and stress that Phase 2 has no group impact. Instruct students not to discuss their choices. 

  Predictable issues include some students prioritizing candy over the experiment, leading to more promise-breaking in Phase 2. This can be addressed in debrief by discussing how self-interest interacts with obligation. Also, groups might develop personal relationships in Phase 1, affecting Phase 2 decisions. Random reassignment for Phase 2 pairs can mitigate this.

  The debrief script should explicitly reference Hume's conventions, Rawls's practice rules, and Scanlon's Principle F. When students feel obligation in Phase 2, introduce voluntarist ideas like Shiffrin or Owens. Contrast the theories to highlight the puzzle.

  Overall, the activity needs to create a visceral experience of the philosophical tension. By making Phase 2 feel isolating and emphasizing no external consequences, the missing element of social practice should make individual reliance or normative powers more salient. The debrief is where the learning solidifies, connecting their feelings to the theories studied.
answer: |-
  Here’s a structured activity designed to create the experiential "jar" you’re seeking, with clear links to your readings and a realistic plan for 80 minutes. The game is called **"The Promise Chain."**

  ---

  ### **Activity: The Promise Chain**  
  **Core Stakes:** Phase 1 uses redeemable tokens (for candy/extra credit); Phase 2 uses physical candy for immediate temptation.  

  #### **PHASE 1: SOCIAL PRACTICE DEPENDENCY**  
  *Goal: Show that promise-keeping sustains a mutually beneficial system.*  
  **Setup:**  
  - Divide class into **3 groups of 6** (circles of chairs).  
  - Give each student:  
    - 1 blank envelope  
    - 3 resource tokens (e.g., poker chips)  
  - Each group gets a "Group Bonus Token" (GB) on a central desk.  

  **Rules:**  
  1. **Round 1 (Resource Creation):**  
     - Each student *privately* places **0–3 tokens** into their envelope, then passes it to the right.  
     - Tokens not placed are kept as "private savings."  
  2. **Round 2 (Promise & Transfer):**  
     - Student A receives an envelope from Student B.  
     - **A must promise B**: "I will add at least 1 token to this envelope before passing it."  
     - A may add 0–3 tokens (any amount, *no monitoring*).  
     - A passes the envelope to the right (to C).  
  3. **Round 3 (Group Bonus):**  
     - If **all promises in the group were kept**, the group earns the GB (worth 3 tokens).  
     - Envelopes are returned to original owners. Total tokens = private savings + received envelope + (GB ÷ 6 if earned).  

  **Payoff:**  
  - Tokens exchanged post-class for candy (e.g., 1 token = 1 mini candy) or trivial extra credit (e.g., 10 tokens = 1% on paper).  
  *Why it works:* Breaking a promise loses the GB, harming **all** group members. Players see cooperation as necessary for mutual gain (Hume/Rawls).  

  ---

  #### **PHASE 2: ISOLATED PROMISE**  
  *Goal: Remove social practice benefits to test intrinsic obligation.*  
  **Setup:**  
  - Re-pair students **randomly 1-on-1** (dyads seated back-to-back or with privacy folders).  
  - Give each student:  
    - 1 envelope with **2 pieces of candy** inside  
    - 1 sticky note  

  **Rules:**  
  1. **Promise Stage:**  
     - Partner A writes on sticky note: "I promise to give you 1 piece of my candy."  
     - A gives the note to Partner B.  
     - *No further interaction.*  
  2. **Decision Stage (Private):**  
     - A decides: give B 1 candy (keeping 1) OR keep both.  
     - B has no power to retaliate.  
     - *No group consequences, reputational tracking, or discussion.*  

  **Payoff:**  
  - Students keep candy they possess. No broader incentives.  
  *Why it works:* Isolated, no reciprocity, no system to uphold. Pure test of personal obligation (Scanlon’s Principle F).  

  ---

  ### **TIMELINE (80 MIN TOTAL)**  
  1. **Intro (10 min):**  
     - Explain Phase 1 rules + token payoff. Emphasize **group bonus depends on universal promise-keeping**.  
  2. **Phase 1 Gameplay (20 min):**  
     - Run 2 cycles of rounds (students experience peer pressure + collective payoff).  
  3. **Transition (5 min):**  
     - Collect tokens/envelopes. **Reset the room:** "Phase 2 is entirely new. No groups, no shared stakes."  
  4. **Phase 2 Gameplay (15 min):**  
     - Assign dyads. Run promise/decision stages. Stress: "Your choice affects *only* your partner and yourself."  
  5. **Debrief (30 min):** Use script below.  

  ---

  ### **DEBRIEF SCRIPT**  
  *(Map experiences to theories)*  
  **Step 1: Phase 1 Feelings (Whiteboard "What Felt Binding?")**  
  - "In Phase 1, why did you keep promises?" → *Expected answers:* "Didn’t want to hurt the group," "Everyone else was cooperating."  
  - **Link to readings:**  
    - Hume: Promises as **conventions** solving coordination problems ("If I break, the system collapses").  
    - Rawls: Promise-keeping as a **rule of a practice** – you consented to the game’s structure.  

  **Step 2: Phase 2 Tension**  
  - "In Phase 2, did you feel obligated? Why?" → *Likely split:* "Yes, I promised!" vs. "No stakes, so I kept both candies."  
  - Highlight emotional responses: guilt, betrayal, or indifference.  
  - **Link to Scanlon:** Principle F (disappointing reasonable expectations). Ask: "Did B *rely* on you? Did you *betray trust* even without a system?"  

  **Step 3: The "Jar" and the Third View**  
  - "When you broke a promise in Phase 2, was it wrong? If so, why—if no one else was harmed?"  
  - **Introduce voluntarism:** "Some argue promising **transfers authority** (Shiffrin) or exercises a **normative power** (Owens). The act itself—not consequences—binds you. Did it *feel* like that in Phase 2?"  

  ---

  ### **PREDICTABLE PROBLEMS & MITIGATION**  
  1. **Phase 1 norms contaminating Phase 2:**  
     - **Risk:** Students treat Phase 2 as "still part of the game."  
     - **Fix:** Physically reset the room. Explicitly state: "This is disconnected. Your reputation doesn’t transfer."  
  2. **Low stakes → unserious choices:**  
     - **Risk:** Students break promises "for fun."  
     - **Fix:** Use actual candy in Phase 2 for visceral temptation. Preface: "This is about your real choice."  
  3. **Dyad awkwardness:**  
     - **Risk:** Guilt/peer pressure in 1-on-1 interactions.  
     - **Fix:** Ensure privacy (write decisions; no eye contact).  
  4. **Debrief polarization:**  
     - **Risk:** Students debate morality, not philosophy.  
     - **Fix:** Anchor responses in texts: "How would *Hume* analyze Phase 2?"  

  ---

  ### **FOLLOW-UP QUESTION & READING**  
  **Question:**  
  > *"In Phase 2, if you felt bound by your promise despite no social consequences, does that suggest promises are more than social tools? Does Scanlon’s 'loss of confidence' account capture this, or do we need something like 'self-governance' (Raz) or 'joint commitment' (Gilbert)?"*  

  **Short Reading:**  
  - Assign T.M. Scanlon’s *"Promises and Practices"* (responds to Rawls) or Seana Shiffrin’s *"Promising, Intimate Relationships, and Conventionalism"* (voluntarist view).  

  ---

  This design forces confrontation with the puzzle: Phase 1 makes Rawls/Hume feel inevitable; Phase 2 isolates Scanlon’s reliance while creating space for voluntarist intuitions. The candy in Phase 2 makes the dilemma visceral, and the abrupt transition amplifies disorientation. Run it tight, and the debrief will crack the discussion wide open. Good luck!
