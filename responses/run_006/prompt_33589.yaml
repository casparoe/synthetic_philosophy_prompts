prompt: |-
  I've been going down a rabbit hole about Elizabeth Anscombe's protest against Oxford awarding an honorary degree to Harry Truman in 1956, and I keep running into the same summary of her argument on blogs and in forum discussions. Here's a representative version from a piece I read:

  "Anscombe's position was that Truman was a mass murderer, and the argument is straightforward: dropping atomic bombs on Hiroshima and Nagasaki killed hundreds of thousands of civilians, and intentionally killing civilians is murder. Since she was a devout Catholic, she appealed to the doctrine of double effect — you can't do evil that good may come of it, and the civilian deaths were the means to the end of forcing Japan's surrender, not an unintended side effect of hitting a military target. The bombs were dropped on cities, after all. So on her view, Truman was morally equivalent to the Nazi leaders we'd just finished hanging at Nuremberg for the same thing — deliberately targeting civilian populations. The fact that we don't see it that way, she argued, just shows that our moral judgments are contaminated by national self-interest and winner's bias."

  I find the argument compelling in broad strokes, but something about the summary makes me uneasy. I've read enough philosophy to know that when a popularizer condenses a serious philosopher's argument into a single paragraph, distinctions tend to get flattened, and I'm especially suspicious of the way the summary treats Anscombe's Catholicism as though it's doing all the philosophical work. The comparison to the Nuremberg defendants also feels like it might be eliding a distinction she actually drew. Can you audit this summary for me? Go through it claim by claim and tell me what a careful reader of Anscombe would accept, what they'd wince at, and what's just wrong. I'm less interested in whether you agree with her conclusion than in whether the summary accurately represents the argument she actually gave, and I'd like you to take a definite position on each claim rather than just laying out interpretive possibilities and leaving me to pick.
reasoning: |-
  Okay, let me approach this systematically. The user has shared a popular summary of Anscombe's Truman protest argument and wants a detailed audit of its accuracy. They're clearly philosophically literate - noticing how popular summaries flatten distinctions and specifically questioning the oversimplified treatment of her Catholicism. 

  First, I need to recall Anscombe's actual writings on this, particularly "Mr. Truman's Degree" (1957). The popular summary gets the basic moral outrage right but misses crucial nuances. For instance:

  The summary presents the argument as "intentionally killing civilians is murder" full stop. But Anscombe's actual distinction between "intending death" versus "foreseeing death" is far more subtle - it's the core of her double effect application. Many summaries miss how carefully she parsed the targeting logic.

  I notice the user specifically flags the Catholicism point as suspicious. Rightly so! While Anscombe was devout, her argument stands on natural law reasoning accessible to secular thinkers. The summary reduces it to religious dogma when her paper explicitly avoids theological arguments.

  The Nuremberg comparison is where the summary gets most misleading. Anscombe actually distinguishes between Truman and Nazis on grounds of genocidal intent versus military objectives. She'd reject the "moral equivalent" phrasing in the summary - her point was about the shared prohibition against targeting civilians, not moral equivalence of regimes.

  The user wants definite judgments, so I'll organize this claim-by-claim:
  - "Truman was a mass murderer": Accurate as her conclusion but oversimplifies her painstaking moral reasoning
  - "Appealed to double effect": Correct but the summary butchers the doctrine's application
  - "Can't do evil that good may come": Misrepresents her Thomistic position
  - "Civilian deaths were the means": This is actually her strongest and most distinctive argument
  - "Moral equivalent to Nazis": Actively contradicts her careful distinctions

  The user's unease is spot-on. This summary preserves the rhetorical force but loses the philosophical precision that makes Anscombe's argument formidable. I'll highlight where she anticipates counterarguments (e.g., about surrender timelines) that the summary ignores. The power of her protest lies in the rigor, not just the conclusion.
answer: |-
  You're right to be suspicious - this summary captures Anscombe's *conclusion* and basic moral intuition, but significantly distorts her actual philosophical argument and rhetorical strategy. Let's audit it claim-by-claim, drawing primarily on her original pamphlet "Mr. Truman's Degree" (1957):

  1.  **Claim:** *"Anscombe's position was that Truman was a mass murderer..."*
      *   **Verdict:** **Accurate, but incomplete.**
      *   **Analysis:** She unequivocally states Truman authorized mass murder and is a murderer. However, the summary omits her crucial distinction: she argues he is *responsible* for mass murder *because* he intentionally targeted civilians as a means, regardless of his personal character or motives ("He *did* murder those people").

  2.  **Claim:** *"...the argument is straightforward: dropping atomic bombs on Hiroshima and Nagasaki killed hundreds of thousands of civilians, and intentionally killing civilians is murder."*
      *   **Verdict:** **Misleading oversimplification.**
      *   **Analysis:** The summary makes it sound like a simple syllogism. Anscombe's core argument is far more nuanced, hinging on the *intentionality* of the killing within the Doctrine of Double Effect (DDE). Merely killing civilians as a *foreseen consequence* isn't automatically murder for Anscombe (following Aquinas). The crux is whether their deaths were *intended as a means* to the end. She argues vehemently that in this case, they absolutely were – the destruction of the cities and their inhabitants *was the mechanism* chosen to force surrender. *That* intentional use of innocent life as a tool is what constitutes murder.

  3.  **Claim:** *"Since she was a devout Catholic, she appealed to the doctrine of double effect..."*
      *   **Verdict:** **Half-true, but misrepresents the role of her Catholicism.**
      *   **Analysis:** She does appeal to DDE, *but*:
          *   **She doesn't present it as exclusively Catholic dogma.** She argues from natural law reasoning, accessible in principle to anyone, about the absolute prohibition of intentionally killing the innocent. Her pamphlet is philosophical, not theological.
          *   **Her Catholicism explains her *commitment* to absolute moral prohibitions,** but the *structure* and *application* of the argument (focus on intention, means vs. side-effect) is presented as rational moral analysis. The summary implies the argument *depends* on faith, which isn't how she framed it in this context.

  4.  **Claim:** *"...you can't do evil that good may come of it..."*
      *   **Verdict:** **Partially correct, but flattens a key distinction.**
      *   **Analysis:** This *is* a principle she holds (the end doesn't justify the means). However, the summary phrase often gets applied too broadly. Anscombe's precise point via DDE is that **you cannot *intend* an evil act (like murder) as a means to a good end.** You *can* sometimes perform an action with a *good* intention where an evil effect (like civilian death) is *foreseen but unintended and not the means used*. She argues Truman intended the evil (mass killing of civilians) as the means.

  5.  **Claim:** *"...and the civilian deaths were the means to the end of forcing Japan's surrender, not an unintended side effect of hitting a military target. The bombs were dropped on cities, after all."*
      *   **Verdict:** **This is the core of her argument and is ACCURATE.**
      *   **Analysis:** This is precisely her central contention. She dissects the justifications offered (saving lives by ending the war quickly) and argues that even if true, they don't change the moral character of the *act itself*: deliberately choosing to annihilate civilian populations as the chosen method of coercion. The target selection (cities, not isolated military bases) is presented as undeniable evidence of this intention. She meticulously argues why alternatives weren't truly exhausted and why surrender wasn't dependent *only* on this specific act of mass destruction.

  6.  **Claim:** *"So on her view, Truman was morally equivalent to the Nazi leaders we'd just finished hanging at Nuremberg for the same thing — deliberately targeting civilian populations."*
      *   **Verdict:** **Significantly Misleading / Mostly WRONG.**
      *   **Analysis:** This is the summary's most egregious error and flattens Anscombe's careful distinction:
          *   **She explicitly *denies* moral equivalence in overall guilt or character.** She states: "I am not arguing that Mr. Truman was as *wicked* as Hitler... Hitler's purposes were of unlimited wickedness. Truman's were not." (emphasis hers).
          *   **She argues for *proportional legal/moral liability* for the *specific type of act*:** Deliberate mass killing of civilians. Her point is that the *principle* violated – the absolute prohibition against intentionally targeting innocent civilians – is the *same* principle the Allies invoked at Nuremberg to condemn Nazi leaders for actions like the bombing of Warsaw or Rotterdam. She argues that failing to apply this principle consistently (especially so soon after Nuremberg) undermines the very concept of justice and reveals hypocrisy: "if you *do* choose to make the bombing of cities one of your regular weapons... you have *ipso facto* adopted a Nazi attitude... The only difference is that you have won."
          *   **The comparison is about *the principle violated*, not overall moral equivalence.** She uses the Nuremberg precedent to highlight the inconsistency, not to say Truman was "as bad as" Hitler or Himmler overall.

  7.  **Claim:** *"The fact that we don't see it that way, she argued, just shows that our moral judgments are contaminated by national self-interest and winner's bias."*
      *   **Verdict:** **ACCURATE.**
      *   **Analysis:** This is a central theme. She argues that the refusal to condemn Truman stems from "consequentialism" (judging solely by outcomes, which she vehemently rejects), national loyalty, and the fact that "he was our man, he was on our side, and he won." She sees this as a corruption of clear moral reasoning and a betrayal of the principles supposedly upheld at Nuremberg.

  **Conclusion:** The summary correctly identifies Anscombe's conclusion (Truman committed mass murder), her core contention (civilians were intentionally killed as a *means*), and her diagnosis of bias. However, it:
  *   **Badly oversimplifies her argument,** reducing the nuanced DDE/intention analysis to a simple "killing civilians = murder".
  *   **Misrepresents the role of Catholicism,** implying dogma drives the logic rather than philosophical natural law reasoning.
  *   **Completely distorts the Nuremberg comparison,** falsely implying she claimed moral equivalence rather than highlighting an inconsistency in applying the *same* fundamental moral/legal principle (prohibition of targeting civilians).
  *   **Obfuscates the rigor** of her analysis regarding intention, means vs. side-effect, and the rejection of consequentialist justification.

  A careful reader of Anscombe would wince at the flattening of her sophisticated argument into a simplistic syllogism and would strongly object to the mischaracterization of the Nuremberg comparison as asserting "moral equivalence." The power of her protest lies precisely in the philosophical rigor applied to show how a specific, absolute principle was violated by an Allied leader *using the very standard the Allies had just imposed on their defeated enemies*. The summary loses this crucial nuance.
