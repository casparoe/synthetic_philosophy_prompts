prompt: |-
  I'm a facilitator — I mediate between community groups that have really deep value disagreements. The kind of thing where it's not just interests on the table but whole ways of seeing what matters: a religious school and secular parents arguing about what goes in the ethics curriculum, or animal rights activists and farmers hashing out an agricultural expansion. I've been reading around this idea of "moral trade" — the thought that when two parties have genuinely different moral priorities, they can sometimes make compromises that are actual gains from trade rather than one side just losing. The classic move is: if the environmentalists care vastly more about the wetlands and the union cares vastly more about job guarantees, maybe there's a deal where each gets what they rank highest and concedes what they rank lowest, and both walk away better off by their own lights. That's not splitting the difference; it's more like comparative advantage but for values.

  The problem is I have no idea how to spot these opportunities in a real mediation. A lot of what gets called moral trade in the abstract looks, once you're in the room, like the more powerful group dressing up a demand as a reasonable compromise, or like a false equivalence between "we want clean water" and "we want higher margins." I need something I can actually use — a decision procedure or checklist I can work through in a couple hours before a session, or in the debrief after a proposal emerges. It should help me tell whether a proposed compromise is a genuine moral trade (Pareto-improving by each side's own standards) versus capitulation, a power play, or just a category mistake where the framework doesn't apply at all. It should flag the questions I need to go back and ask the parties, and it should be honest about where the whole idea breaks down — the cases the procedure can't handle or where it might give the wrong answer.

  Then I'd like you to run the procedure on two cases: (1) a religious school and secular parents disagreeing over whether the ethics curriculum should cover gender identity, where the proposed compromise is that the school includes the modules but lets parents opt their kids out; and (2) an animal rights group and a farming cooperative in a dispute over expanding a livestock operation, where the compromise is expansion with substantially higher welfare standards than the legal minimum.

  Please flag where you're least confident in what you're claiming, and write the whole thing in British English.
reasoning: |-
  Okay, this facilitator is dealing with deep value conflicts where standard compromise won't cut it. They're intrigued by "moral trade" theory - that elegant idea where parties trade concessions on their lowest priorities to gain on highest ones, like environmentalists swapping job guarantees for wetland protection. But they're rightly skeptical about real-world application, having seen power imbalances masquerade as fair deals.  

  Hmm, their core ask is practical: a diagnostic tool to distinguish genuine moral trades from bad faith bargains. Needs to be field-ready - something they can use in pre-mediation prep or post-proposal analysis. Must flag when the framework itself is inapplicable. And crucially, they want transparency about the method's limitations.  

  Right, let's build this step-by-step. First, the checklist must verify three things: 1) Parties truly hold incommensurate values (not just haggling over interests), 2) The trade involves asymmetric priorities (what I call "value elasticity"), and 3) Gains are measurable by each side's own metrics. For fieldwork, I'll frame it as questions they can pose to stakeholders.  

  *scribbles structure*  
  Preconditions:  
  - Is this a values clash? (Probe for sacred vs. secular conflicts)  
  - Are priorities asymmetric? (Requires ranking exercises)  
  - Can gains be self-assessed? (Avoid imposing external metrics)  

  Deal Evaluation:  
  - Pareto test: Would both sides prefer this over no deal?  
  - Power audit: Is coercion distorting the trade?  
  - Value integrity: Does the concession violate core identity?  

  *notes pitfalls*  
  Must emphasize where this fails: when values are lexically ordered (no tradeoffs possible), or if one party views compromise as contamination. Also flag measurement challenges - how do we quantify "moral gain" for a religious group?  

  Now for their cases. First, the school opt-out compromise:  
  - Values clash? Genuine (religious authority vs. inclusive education)  
  - Asymmetry? School cares more about curriculum control than universal attendance; parents care more about content access than uniform participation.  
  - But big red flag: Opt-outs may violate the parents' core value of equal treatment. Pareto test fails if some kids get excluded.  

  Farming expansion case looks stronger:  
  - Animal rights group likely weights welfare standards >> blocking expansion  
  - Farmers care more about growth than maintaining low standards  
  - Key question: Are the new standards materially better by animal advocates' metrics? If yes, this could be textbook moral trade.  

  *checks own biases*  
  Least confident in the school case analysis - opting out might feel like capitulation if parents see segregated learning as inherently unethical. Also wary about assuming farmers prioritize expansion over all else; what if higher standards threaten their viability? Must stress these uncertainties in response.  

  Final touch: British English throughout. "Whilst" not "while", "prioritisation" with 's', and absolutely no "win-win" jargon - this is serious conflict mediation.
answer: |-
  Here’s a practical decision procedure for identifying genuine moral trades in mediation, designed for real-world constraints. It combines diagnostic questions, red flags, and feasibility checks — all in British English as requested. I’ll then apply it to your two cases, flagging uncertainties.

  ---

  ### **Moral Trade Diagnostic Checklist**  
  *(Use pre-session or post-proposal; ≈60-90 mins)*  

  #### **I. Preconditions: Is Moral Trade Even Possible?**  
  *(If any answer is "no", the framework likely doesn’t apply)*  
  1. **Values Mismatch Test**  
     - *Question:* Are parties’ disagreements rooted in **fundamentally different moral priorities** (e.g., sacred duties vs. welfare rights), not just competing interests?  
     - *Red Flag:* If one side frames the conflict as "facts vs. values" (e.g., "science vs. tradition"), it may be a power play.  
     - *Action:* Ask parties: *"What core principle would be violated if you conceded?"*  

  2. **Priority Asymmetry Check**  
     - *Question:* Do parties **rank the disputed issues differently**? (e.g., Side A cares intensely about X but little about Y; Side B is the inverse).  
     - *Red Flag:* If both sides claim the *same* issue is non-negotiable (e.g., "sovereignty" or "dignity"), trade may be impossible.  
     - *Action:* Map issues on a matrix: *"Rank these 3 outcomes: your ideal, their ideal, no deal."*  

  3. **Gain Self-Assessment Feasibility**  
     - *Question:* Can each party **define 'gain' by their own standards** without conceding ground? (e.g., "Saving 100 acres is a win" vs. "10 new jobs is a win").  
     - *Red Flag:* If a party can’t quantify gains without referencing the other’s losses (e.g., "We win if they suffer less"), it’s zero-sum.  
     - *Action:* Ask: *"What measurable outcome would make this feel worthwhile to you, irrespective of their gains?"*  

  #### **II. Deal Evaluation: Is This a Genuine Moral Trade?**  
  *(Apply when a proposal emerges)*  
  4. **Pareto Test**  
     - *Question:* Would **both parties genuinely prefer the deal over no deal** *by their own value systems*?  
     - *Red Flag:* If one side describes it as "the least bad option" rather than a net gain.  
     - *Action:* Probe: *"Does this leave you better off than walking away? How, specifically?"*  

  5. **Concession Asymmetry Audit**  
     - *Question:* Does the deal **leverage differing priorities**? (e.g., Side A concedes low-priority Y to secure high-priority X; Side B does the inverse).  
     - *Red Flag:* If concessions are symmetric (e.g., "meet halfway") but values aren’t.  
     - *Action:* Chart concessions against pre-mapped priorities. Ask: *"What did you give up? How costly was that *morally*?"*  

  6. **Coercion & Power Check**  
     - *Question:* Is the deal **free of exploitation**? (e.g., no threats, no resource imbalances forcing capitulation).  
     - *Red Flag:* If the weaker party’s "gain" is merely avoiding punishment (e.g., "We accept opt-outs so they don’t sue").  
     - *Action:* Consult privately: *"Did you feel pressured to accept terms against your values?"*  

  7. **Value Integrity Screen**  
     - *Question:* Does the deal avoid **corrupting core values**? (e.g., no one is asked to betray sacred duties).  
     - *Red Flag:* If a party rationalises gains using the *other’s* values (e.g., "At least we got economic benefits" — when their core concern is ethics).  
     - *Action:* Ask: *"Does any part of this deal make you complicit in something you deem wrong?"*  

  #### **III. Limitations & Breakdown Points**  
  - **When the procedure fails:**  
    - Lexical values present (e.g., "No animal suffering is tolerable, ever").  
    - Gains can’t be self-assessed without interdependency (e.g., "Our win requires their loss").  
    - Power imbalances distort priorities (e.g., marginalised group coerced into reframing values).  
  - **Uncertainty markers:**  
    - Subjectivity in self-reported gains.  
    - Hidden hierarchies within parties (e.g., farmers vs. corporate agribusiness).  

  ---

  ### **Case Applications**  
  #### **Case 1: Religious School vs. Secular Parents**  
  *Proposal: School includes gender identity modules but allows parental opt-outs.*  

  1. **Values Mismatch:** Likely **yes**. School: religious authority/morality. Parents: inclusive education/autonomy.  
  2. **Priority Asymmetry:** **Uncertain**.  
     - School *may* prioritise curriculum control > universal attendance.  
     - Parents likely prioritise content access > uniform participation.  
     *→ Action needed: Verify priority rankings. If parents see opt-outs as "segregation", it’s high-cost.*  
  3. **Gain Self-Assessment:** **Yes**. School: maintains doctrinal curriculum. Parents: access for consenting families.  
  4. **Pareto Test:** **Likely no** for some parents. If their core value is *equal* access (not just access), opt-outs create a loss.  
  5. **Concession Asymmetry:** **Yes** on surface (school concedes universality; parents concede compulsion). **But** if parents view opt-outs as endorsing discrimination, asymmetry collapses.  
  6. **Coercion Check:** **Risk**. If school holds funding/power, opt-outs may be parental capitulation.  
  7. **Value Integrity:** **Fail** for parents if equality is non-negotiable. Opt-outs may render them complicit in exclusion.  

  **Verdict:** *Not a genuine moral trade* if parents value non-discrimination above all. The compromise imposes moral costs that may outweigh gains. **Highest uncertainty:** Whether parents rank "access for some" as a net gain.  

  ---

  #### **Case 2: Animal Rights Group vs. Farmers**  
  *Proposal: Farm expansion permitted with higher welfare standards.*  

  1. **Values Mismatch:** **Yes**. Animal rights: intrinsic value of animals. Farmers: livelihoods/economic sustainability.  
  2. **Priority Asymmetry:** **Likely yes**.  
     - Animal group: Welfare standards >> blocking expansion.  
     - Farmers: Expansion >> maintaining low-cost practices.  
  3. **Gain Self-Assessment:** **Yes**. Animal group: measurable welfare gains (e.g., space, enrichment). Farmers: profit from expansion.  
  4. **Pareto Test:** **Yes** if both prefer deal to stalemate. Farmers gain growth; animal group reduces suffering per animal.  
  5. **Concession Asymmetry:** **Yes**. Animal group concedes on expansion (lower priority) to secure welfare (high priority). Farmers concede on costs (lower priority) to secure expansion (high priority).  
  6. **Coercion Check:** **Monitor**. If farmers dominate local politics, ensure welfare standards aren’t tokenistic.  
  7. **Value Integrity:** **Pass** if animal group views welfare gains as meaningful progress (not betrayal). Farmers avoid ethical violations they reject (e.g., activism).  

  **Verdict:** *Plausible moral trade*, provided welfare standards are substantive by the animal group’s metrics (e.g., 40% more space vs. 5%). **Highest uncertainty:** Whether "higher welfare" is sufficient for animal group (e.g., is *any* industrial farming unacceptable?).  

  ---

  ### **Key Caveats**  
  - **Least confident** in judging "value integrity" (Step 7). Parties often reframe values post-hoc to justify deals.  
  - **Critical warning:** Moral trade can legitimate harmful systems (e.g., "better" exploitation). Flagged by Coercion Check (Step 6).  
  - **British English compliance:** Prioritised "whilst", "labour", "standards" (over "standardization"), etc.  

  This procedure won’t resolve intractable conflicts, but it forces clarity on whether a compromise is a true value trade or disguised coercion. Always cross-verify self-reported priorities with observed behaviour.
