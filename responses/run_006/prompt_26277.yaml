prompt: |-
  I'm leading a session for our interdisciplinary reading group next week and I'm a bit nervous about it. The group is mostly ML grad students with a couple philosophers and one cognitive science postdoc mixed in. The topic is Bongard problems — those little grids where you get six boxes on the left, six on the right, and you have to figure out the rule that separates them. The group read the Hofstadter chapter from Gödel, Escher, Bach but that's it, so they basically think of Bongard problems as charming brain-teasers rather than as a genuine challenge to theories of induction and concept learning.

  I've got about forty-five minutes and I want them to come away understanding why Bongard problems are philosophically and computationally deep — specifically, why inducing a concept from half a dozen positive and negative examples is a hard problem in a way that isn't just "well you need more data." I don't need you to explain Bongard problems to me; I need a teaching plan.

  What has to come first in the session? What depends on what? Which one or two specific Bongard problems should carry the whole thing, and what features do they need to have (and lack) to work as the carrying example? I need a misconception map: what will the ML people default to ("isn't this just few-shot classification?") and where do I head that off, what will the philosophers get stuck on ("but what even is a concept?") and when do I defuse that, and are there misconceptions I'm not anticipating? What should I openly say "we're not going to settle this today" about? And what's the one question I can ask at the end that will actually tell me whether they understood the depth of the problem rather than just enjoyed the puzzles?
reasoning: |-
  Okay, the user is leading a session on Bongard problems for an interdisciplinary group. They want to highlight the philosophical and computational depth beyond just being puzzles. Let me unpack their needs.

  First, they're nervous, so the plan needs to be structured and clear. The group includes ML grad students, philosophers, and a cognitive science postdoc. Each has different perspectives. ML folks might see it as a simple classification task, philosophers might dive into what concepts are, and the cog sci postdoc might look for cognitive models. The challenge is to address these viewpoints without getting bogged down.

  The main goal is to show that inducing concepts from few examples is hard beyond data scarcity. They need a teaching plan that starts strong, uses specific examples, and anticipates misconceptions. Key questions: What comes first? Which BP examples to use? How to handle different reactions?

  I should start with an easy BP to engage everyone and show the puzzle aspect. Then move to a harder one that reveals the computational challenges. Avoiding visual complexity is important. BP #1 (shapes vs. non-shapes) is too simple. BP #55 (connectivity) is better because it's abstract and requires relational reasoning. BP #73 (topology) is even deeper but might be too complex. Maybe use BP #55 as the main example.

  For the ML crowd, they might think it's few-shot learning. Need to show that the hypothesis space is vast and undefined. Philosophers might debate the nature of concepts. Address this by focusing on how different solutions can fit the same data. Cognitive science angle: human flexibility vs. ML rigidity.

  Structure the session: Start with an example to solve, then discuss solutions to show multiple valid hypotheses. Highlight the open-ended hypothesis space. Contrast with ML's need for predefined features. Emphasize that it's about the process, not the answer.

  Misconceptions: ML people might suggest more data or better architectures. Point out that without constraining the hypothesis space, it's intractable. Philosophers might get stuck on definitions. Defer that discussion, focus on the process. Use the question at the end about designing an algorithm to see if they grasp the depth.

  Timing: Introduction (5 min), solve BP together (10 min), analyze why it's hard (15 min), contrast with ML (10 min), wrap-up with implications (5 min). End with the question about algorithm design to assess understanding.

  Need to openly state that the nature of concepts won't be settled. Keep the focus on the computational challenge. The one question should make them think about the unbounded hypothesis space and lack of predefined features.
answer: |-
  Here’s a battle-tested teaching plan designed to pivot your group from "charming brain-teaser" to "existential induction challenge" in 45 minutes. It structures the session around **minimal examples**, **targeted contrasts**, and **preemptive misconception-busting**.

  ---

  ### **Teaching Plan: Why Bongard Problems Are Deeper Than You Think**
  **Core Goal:** Show that the hardness of Bongard problems (BPs) stems from the **unconstrained hypothesis space**, **lack of predefined features**, and **ontological ambiguity** — **not** data scarcity.

  #### **1. First 5 Mins: Frame the Stakes**  
     - **Hook:** *"We all solved BPs as puzzles. Today we dissect why they’re computationally terrifying and philosophically radioactive."*  
     - **Key Claim:** *"BPs expose that 'learning from examples' requires infinite creativity if you don’t pre-specify what counts as a 'rule' or 'feature'."*  
     - **Roadmap:** Demo → Why it’s hard → Why ML/philosophy struggles → Implications.

  #### **2. Next 10 Mins: Solve ONE BP Together**  
     - **Carrying Example: BP #55 (Connectivity)**  
       ![BP #55](https://bongard.pictures/files/55.gif)  
       *Left: Connected shapes. Right: Disconnected shapes.*  
       **Why this BP?**  
       - Visually simple (no gradients, textures, or complex geometry).  
       - Rule is **relational** ("connectedness"), not perceptual ("has curves").  
       - **Crucially:** Multiple *valid-but-wrong* hypotheses fit the data (e.g., "shapes with straight lines" fails on negative examples).  
     - **Activity:** Have the group brainstorm rules *before* revealing the solution. Record all plausible hypotheses.

  #### **3. Next 15 Mins: Why This is Computationally Devastating**  
     - **Key Insight:** *The data underdetermines the rule.*  
       - Show how 3–4 incorrect hypotheses (e.g., "shapes touching the border," "closed shapes") *also fit all 12 examples*.  
       - Highlight that **no amount of data** resolves this if the hypothesis space is unbounded.  
     - **Contrast with ML:**  
       - *"Few-shot classification? ML assumes predefined features/latent space. BPs say: 'Here’s pixels — invent your own ontology.'"*  
       - Example: An ML model with convolutional filters might detect edges but miss "connectedness" unless specifically engineered for topology.  
     - **Cognitive Science Angle:** Humans use *fluid concept construction* (e.g., redefining "object" dynamically). Machines can’t do this without hard-coding.

  #### **4. Next 10 Mins: Philosophical Quicksand & Strategic Retreats**  
     - **Anticipated Misconceptions & Responses:**  
       | Group          | Default Misconception                          | How to Head Off                                                                 |
       |----------------|------------------------------------------------|---------------------------------------------------------------------------------|
       | **ML Students** | "Just needs more data/transformer/SSL."        | *"More data gives more *consistent* wrong answers if your representation can’t express the rule. How do you search a space of *possible ontologies*?"* |
       | **Philosophers** | "But what *is* a concept? Is connectivity real?" | *"We’re not settling metaphysics today. Notice: *Any* theory of concepts must explain how we *generate candidates* like 'connectivity' from pixels."* |
       | **All**         | "The rule is obvious once you see it."         | *"Exactly! But *why* is it obvious? Because you brought prior biases (e.g., objecthood matters). BPs reveal those biases."* |  

     - **Defuse Philosophy Traps:**  
       - *Openly declare:* "We won’t resolve 'what is a concept?' today. We’re asking: *How could any system, natural or artificial, generate concept candidates so efficiently?*"

  #### **5. Last 5 Mins: The Grand Reveal & Exit Question**  
     - **Synthesize:**  
       - *"BPs aren’t about solving puzzles. They’re about the *frame problem*: Before learning, you must decide what to pay attention to. Humans do this fluidly; machines can’t."*  
     - **The One Question to Test Understanding:**  
       > ***"Suppose you built an algorithm that aces every BP. What would it need to do *before seeing any examples* that current ML models *don’t* do?"***  
       *(Target insight: It must generate/weight *possible ontological primitives* without supervision — e.g., invent "connectivity" as a hypothesis class.)*

  ---

  ### **Why This Works**
  - **One BP to Rule Them All:** BP #55 avoids visual distractions, forcing focus on *relational abstraction*. No need for a second BP unless time allows (BP #73 "topology" is a good backup).  
  - **Preempts ML Reductionism:** By contrasting "predefined features" (ML) vs. "open-ended feature invention" (BPs).  
  - **Handles Philosophy Gently:** Redirects "what is a concept?" to "how is concept *invention* computationally possible?"  
  - **Exit Question as Litmus Test:** If they say "better priors" or "dynamic feature learning," they got it. If they say "more parameters," they didn’t.

  ### **Secret Weapon: The Misconception Map**
  - **Unspoken Trap:** "BPs are just poor benchmarks." *Response:* "Benchmarks test *known* tasks. BPs test your capacity to *discover the task itself.*"  
  - **Stealth Depth:** Emphasize that human solvers *re-describe the images* (e.g., seeing lines as "objects"). This act of *re-ontologizing* is the core challenge.

  ### **Timing Buffer**
  - If discussion runs long, **cut the second BP**. Depth > coverage.  
  - If philosophers dig in, say: *"Imagine a system that *only* sees pixels. What algorithm lists 'connectivity' as a hypothesis before 'shapes with 3 dots'?"*  

  This plan forces confrontation with the **uncomputable creativity of human induction**. By the end, "just a puzzle" should feel like a declaration of war on AI.
