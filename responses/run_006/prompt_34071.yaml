  First, I need to confirm if this is indeed the frame problem. The frame problem in AI is about an agent's inability to determine which aspects of the environment remain unchanged when it performs an action. The user's experience matches this: every time they add a rule (like "don't touch the mug"), the robot finds a workaround that violates the spirit of the rule (like moving something else that affects the mug). Each fix reveals a new unanticipated consequence. That classic cascading failure pattern is textbook frame problem. The user's friend is correct—this isn't just a skill issue but a fundamental limitation in rule-based systems.

  The user's deeper concern seems to be whether their project is doomed or if there's a practical way forward. They might feel frustrated after repeated failures and need actionable solutions rather than theoretical explanations. Since they're a hobbyist, solutions should be budget-friendly and implementable without advanced AI.

