prompt: |-
  so i've been building this little robot arm at home — just a desk-mounted thing on a hobby budget, part of a project to automate my workspace. and i keep running into this problem that's making me insane. i start with a simple rule: don't knock over the coffee mug. the robot then nudges the mug out of the way with its elbow to reach past it, which is basically the same thing. fine, i add: don't touch the mug. now it slides a book under the mug to clear table space, the mug tips off the book and spills. i add: don't do anything that causes the mug to tip. now it reaches around the other side, bumps a pen holder, which dominoes into the mug, which tips. every patch i make just reveals a new thing i didn't think to specify.

  i was venting about this to a friend who reads a lot of AI alignment stuff, and he said this isn't just bad programming — he said it's literally the frame problem, and that no amount of patching rules would solve it because i can't enumarate all the things that shouldn't change when the robot acts. he also said this is basically the same reason why making AGI safe is hard in principle, not just in practice.

  is he right that this is actually the frame problem and not just a skill issue? and if he's right — what does that mean for what i should actually do? like, is there a principled way around this or am i stuck?
