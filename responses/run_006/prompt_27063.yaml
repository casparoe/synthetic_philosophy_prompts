answer: |-
  ## Villanelle of the Raven and the Shoe

  My eye is drawn to blackness overhead,  
  A shadow perched against the city grey.  
  **I note the claim: *All ravens must be black***.  

  Three coal-dark silhouettes confirm the dread,  
  A pattern hardens with each feathered sway.  
  My eye is drawn to blackness overhead.  

  But logic turns the light on thoughts instead:  
  That *if* all ravens blacken, then it's true  
  A **white shoe gleaming by the rubbish bin**  
  Supports the rule? The argument has led  
  Me here, bewildered by this strange debut.  
  My eye is drawn to blackness overhead.  

  The fridge, the page, a gull's wing overhead –  
  All *not* black things that *aren't* the raven's kin –  
  **I note the claim: *All ravens must be black***.  
  Each one, by equivalence, is read  
  As evidence? A philosophic din  
  My eye is drawn to blackness overhead.  

  My mate explained it over pints we'd shed,  
  This twist that tangles reason deep within.  
  A **white shoe gleaming by the rubbish bin** –  
  **I note the claim: *All ravens must be black*** –  
  Both click inside the logic's loop, a tightening knot.  
  My eye is drawn to blackness overhead.

  ---

  **Notes on the Villanelle:**

  *   **Form & Paradox:** The villanelle's relentless refrain structure embodies the paradox's cyclical, inescapable nature. The refrains (italicised lines) alternate, forcing the core tension: the hypothesis ("All ravens must be black") and its logically equivalent, counterintuitive evidence ("a white shoe gleaming by the rubbish bin").
  *   **Accuracy:** It adheres strictly to Hempel's equivalence condition. The shoe *is* presented as formally equivalent evidence for the universal conditional "All ravens are black" (via its contrapositive "All non-black things are non-ravens"). No dismissal occurs; the paradox stands unresolved ("a tightening knot").
  *   **Accessibility:** Grounded in the speaker's experience (birdwatching, city greys, the pub chat, the mundane objects - fridge, page, bin). The core logical tension is presented through concrete imagery and feeling ("bewildered", "strange debut", "philosophic din", "logic's loop").
  *   **British English:** "Rubbish bin", "shed" (as in consumed pints), "mate", "grey", "gleaming" fit the request.
  *   **Closing Couplet:** The final three lines deliberately place the two refrains side-by-side ("A white shoe... / I note the claim...") *before* the final repetition of the opening line. This highlights their forced equivalence within the "logic's loop", creating the "tightening knot" of the paradox, ending with the speaker still drawn back to the ravens, trapped in the pattern.
