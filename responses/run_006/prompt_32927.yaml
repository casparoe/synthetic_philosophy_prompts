prompt: |-
  I just fell down a rabbit hole reading about mereological nihilism — the idea that there are no composite objects, no tables or chairs, just simples arranged table-wise. It sounds insane but the arguments are better than I expected and now I can't stop thinking about it. I'm trying to figure out what I actually think. Give me your credence that mereological nihilism is true, decomposed: what's the probability that the special composition question has a determinate, non-vague answer at all, the probability that nihilism is the best answer given that there is one, the probability that our ordinary talk about objects is just a useful fiction rather than tracking real composite things, and any other factors you think matter. Give me a number for each, how they combine to your overall credence, and tell me which sub-question you're least confident about and what evidence or argument would shift it most. I'm not asking for a reading list — I want your actual reasoning, like we're arguing about this at a bar.
