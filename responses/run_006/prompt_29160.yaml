prompt: |-
  I've been reading about Ulysses contracts in my philosophy club — the idea that you can bind your future self to prevent yourself from making choices you'll regret. Our advisor mentioned Odysseus having his crew tie him to the mast so he could hear the sirens without steering the ship onto the rocks, and ever since I've been noticing versions of this everywhere. What I can't figure out is where to draw the line between a legitimate precommitment and an unfair restriction on someone's future freedom — even when that "someone" is your own future self.

  Here are my verdicts on specific cases. Odysseus tying himself to the mast: clearly fine. Deleting my social media apps the night before final exams: fine. Giving my friend my wallet before going to a casino, so I can't gamble more than the cash in my pocket: fine. A constitution that requires a two-thirds supermajority to amend: fine, even though it ties the hands of future majorities. A person with bipolar disorder, during a stable period, signing a psychiatric advance directive that authorizes treatment during a future manic episode even if they refuse at the time: fine, and honestly admirable. Paying for a full year of gym membership upfront so I'll feel wasteful if I don't go: fine, but something about it feels different from the others, and I can't say what. A teenager asking their parents to lock away their phone every night at 10 PM and not return it no matter how much they beg: fine.

  Now the cases that bother me. A worker signing an employment contract that waives their right to join a union: not fine, even if they genuinely prefer the non-union wage premium right now. Someone signing away their right to divorce — like in legal systems where marriage contracts can be made indissoluble: not fine, even if both parties want that binding at the time. And here's the one I keep going back and forth on: suppose I'm a legislator voting on a constitutional amendment that permanently limits government power in a way I deeply support — say, banning warrantless surveillance. I believe in it now, but I can imagine future-me, during a security crisis, being grateful if the restriction weren't there. Is voting for that amendment a legitimate Ulysses contract on behalf of the polity, or is it an illegitimate attempt to govern from the grave?

  Is there a principle that captures all of these verdicts, or at least most of them? What does it say about the surveillance amendment case? And which of my verdicts, if any, does it force me to abandon?
reasoning: |-
  Okay, let's start by unpacking the user's query. They're exploring Ulysses contracts and struggling to find a line between legitimate precommitment and unfair restrictions on future freedom. They've provided several examples with their verdicts and are looking for a unifying principle. 

  First, I notice the user is clearly well-read and analytical—they're in a philosophy club and have thought deeply about real-world applications. Their examples range from personal decisions (gym membership) to societal ones (constitutional amendments). The core tension they're grappling with is autonomy vs. paternalism, even when it's self-directed. 

  The user's verdicts show a pattern: they approve precommitments that protect against impaired judgment (bipolar directive) or temporary temptations (casino wallet), but reject those that surrender fundamental rights (union waiver) or permanent exits (indissoluble marriage). The surveillance amendment case seems to be their central dilemma—it's a collective "future self" scenario with high stakes.

  Hmm, what's not said but might be relevant? The gym membership example nags at them—probably because it's purely incentive-based without addressing an impairment. That subtle discomfort might hold a clue. Also, their phrasing about "governing from the grave" suggests they're sensitive to democratic legitimacy concerns.

  For a unifying principle, I need something that distinguishes between preserving core agency vs. diminishing it. The "substantial impairment" framework comes to mind—it covers intoxication, mania, and siren-induced frenzy, but not calm reconsideration. And it must account for power imbalances (like employers exploiting workers). 

  The surveillance amendment... tricky. If it prevents future majorities from violating rights during panics, it's protective. But if it's inflexible to new contexts, it could become tyrannical. Maybe emphasizing reversibility (with high barriers, not impossibility) would resolve their dilemma. 

  Wait—should I challenge any of their verdicts? The gym membership is ethically fine but psychologically manipulative; that might deserve a footnote about authenticity. The phone-locking teen case edges close to paternalism, but minors' developing judgment justifies it. Solid overall. 

  Ultimately, they want philosophical coherence for real-life decisions. The answer must honor both their intuition and their intellect.
answer: |-
  Your intuition about a unifying principle is spot on. After analyzing your verdicts, we can derive a framework based on **core purpose and protected capacities**. Here's the principle that captures your judgments:

  **A Ulysses contract is legitimate when it preserves or enhances the autonomy of the future self by protecting their core decision-making capacity from being *substantially impaired* by temporary circumstances (passions, impairments, or coercive pressures), but becomes illegitimate when it permanently surrenders fundamental rights or exit options essential to that autonomy.**

  ### Applying the Principle to Your Cases
  **Legitimate Cases (Preserving Core Capacity):**
  1.  **Odysseus:** Protects against the Sirens' *overwhelming, irresistible temptation* (impaired judgment).
  2.  **Deleting Social Media:** Protects against *temptation/distraction* during a high-stakes, time-limited event (exam pressure).
  3.  **Wallet at Casino:** Protects against *impulsive behavior* fueled by addiction/temptation in a designed environment of loss.
  4.  **Supermajority Amendment:** Protects against *transient majoritarian passions* potentially eroding fundamental governance structures (preserves deliberation).
  5.  **Psychiatric Advance Directive:** Protects against decisions made during *severe mental illness* (manic episode) that contradict stable values and long-term well-being.
  6.  **Gym Membership Prepayment:** Uses *loss aversion* to counteract *procrastination/laziness* (a weak temptation, hence your feeling it's different – it protects commitment, not core capacity from impairment).
  7.  **Teen Phone Locking:** Protects against *developmental vulnerability* (poor impulse control, sleep needs) impacting health/functioning; parents act as external agents preserving the teen's future capacity.

  **Illegitimate Cases (Surrendering Fundamental Autonomy):**
  1.  **Union Waiver:** Surrenders the *fundamental associational right* to collectively bargain. Future self cannot exercise this right even if rationally desired in changed circumstances (e.g., employer abuse). It's a permanent restriction on worker power, not protection from temporary impairment.
  2.  **Indissoluble Marriage:** Surrenders the *fundamental right to exit* an intimate relationship. Future selves cannot exercise autonomy even if the relationship becomes harmful, abusive, or simply incompatible with their well-being. It binds based on past desire, ignoring future rational will.

  **The Surveillance Amendment Case:**
  This is the **hardest case**, sitting near the boundary. Applying the principle:

  1.  **Legitimate Ulysses Contract?** Yes, if viewed as protecting future democratic majorities from acting under *transient panic* (e.g., post-terror attack) in ways that permanently erode fundamental liberties (like privacy). The "impairment" is the intense fear/emotion overriding calm deliberation on rights. You are binding future selves *to protect their own core rights* from their own potential panic.
  2.  **Illegitimate "Governing from the Grave"?** Potentially, if the amendment is *so rigid* it prevents future generations from adapting the *means* of surveillance oversight to new technologies or threats in a way still consistent with the *principle* of privacy protection. It risks ignoring the future self's capacity for reasoned adaptation.

  **Verdict using the Principle:** Your vote *can* be a legitimate Ulysses contract **IF**:
  *   The amendment targets a specific, fundamental liberty (privacy).
  *   The impairment it guards against is well-documented (historical overreach during crises).
  *   It includes mechanisms for future deliberation/adaptation (e.g., requiring a high bar like a supermajority *or* sunset clauses forcing reconsideration, rather than absolute permanence).
  *   The *core principle* (protection from unreasonable search) is preserved, even if future generations refine the *implementation*.

  It leans legitimate, but true legitimacy requires **allowing for future reasoned override** under strict conditions (high supermajority, not impossibility). Absolute permanence risks illegitimacy.

  ### Does the Principle Force Abandoning Any Verdict?
  *   **Potentially the Gym Membership:** Your principle highlights why it "feels different." It protects against *weak temptation/procrastination*, not a substantial impairment of core decision-making capacity. It's more of a motivational trick than a protection of autonomy from being overwhelmed. While you might still find it "fine," the principle suggests it's ethically distinct and less weighty than the core cases.
  *   **The Teen Phone Case:** The principle justifies it based on *developmental impairment* (immature impulse control/sleep regulation impacting health). This holds if we accept minors have developing capacity, making parental intervention autonomy-*enhancing* for their future adult selves.

  ### Key Distinctions in the Principle
  1.  **Nature of the Impairment:** Is the threat overwhelming passion (Sirens, mania), addictive temptation (casino), panic (crisis surveillance), or developmental vulnerability? Or is it merely inconvenience/laziness (gym)?
  2.  **Fundamental Rights:** Does the contract surrender a core element of autonomy (right to associate, right to exit fundamental relationships)? If yes, it's suspect.
  3.  **Permanence vs. Reversibility:** Can the future self, *acting under conditions of full capacity and without coercion*, reasonably reverse the commitment? Legitimate Ulysses contracts make reversal *hard during the impairment*, but not *impossible forever after it passes* (especially for fundamental rights). Constitutions *should* be hard to change, but not impossible.
  4.  **Power Dynamics:** Does the contract exploit an imbalance (employer/worker)? This often correlates with illegitimate surrender of rights.

  This framework explains your intuitions: legitimate precommitments act as *armor* for your core self against temporary storms; illegitimate ones act as *chains* permanently binding that core self, even in calm weather. The surveillance amendment is legitimate armor against panic if it allows future calm selves to adjust the fit, but becomes a chain if it forbids any adaptation forever.
