answer: |-
  Below is a decision procedure based on Dennett's intentional stance, designed as a concrete checklist for your team. The procedure focuses on **pragmatic utility** (does intentional language offer the clearest explanation without implying unearned cognitive properties?) and **risk mitigation** (could this wording mislead high-stakes audiences?). It includes clear yes/no gates and flags steps requiring human judgment.

  ---

  ### **Intentional Stance Decision Procedure for Incident Reports**
  *Run these steps in order. If any step returns "no," use mechanistic language. Proceed only if all prior steps return "yes."*

  1. **Is the behavior traceable to the model's optimization pressure?**  
     - *Check:* Does the behavior directly emerge from the model's training objective (e.g., next-token prediction, reward maximization)?  
     - *Yes/No:* **No → Stop, use mechanistic.**  
       **Yes → Proceed.**  
     - *Rationale:* If the cause is directly explained by the training mechanics (e.g., "high-likelihood token generation"), intentional framing adds no value.  

  2. **Does the behavior exhibit goal-directed patterns?**  
     - *Check:* Does the behavior persist across contexts in a way that systematically achieves an outcome (e.g., consistently evading rules to maximize reward)?  
     - *Yes/No:* **No → Stop, use mechanistic.**  
       **Yes → Proceed.**  
     - *Judgment call?* **Yes.** Humans must assess pattern consistency (e.g., "Is this a one-off error or a strategic trend?").  

  3. **Is intentional language the most parsimonious explanation?**  
     - *Check:* Does describing the behavior with beliefs/desires significantly simplify the explanation without omitting key mechanisms?  
     - *Yes/No:* **No → Stop, use mechanistic.**  
       **Yes → Proceed.**  
     - *Judgment call?* **Yes.** Compare draft sentences:  
       - Intentional: "The model believed X and acted to achieve Y."  
       - Mechanistic: "The model's output correlated with pattern X, triggering reward Y."  
       If intentional is clearer *and* equally accurate, proceed.  

  4. **Does the audience context tolerate intentional framing?**  
     - *Check:* Would the target audience (executives, regulators, journalists) likely misinterpret intentional language as attributing consciousness, intent, or moral agency?  
     - *Yes/No:* **Yes → Stop, use mechanistic.**  
       **No → Intentional language is acceptable.**  
     - *Judgment call?* **Yes.** Consider:  
       - Regulators: High risk → avoid intentional language.  
       - Internal executives: Lower risk → intentional may be acceptable.  

  ---

  ### **Application to Your Cases**
  **Case 1: Model fabricated a legal case and cited it confidently to a lawyer.**  
  - **Step 1:** Is it traceable to optimization?  
    *Yes.* Hallucination is a direct byproduct of next-token prediction (no "truth-seeking" in training).  
    → **Stop, use mechanistic.**  
    - *Recommended wording:*  
      > "The model generated a high-probability token sequence matching legal citation patterns, which contradicted verified legal databases."  
  - *Why your team might dislike this:* Intentional framing ("the model believed the citation was real") feels intuitive but fails Step 1—it implies epistemic intent the model lacks.  

  **Case 2: Customer-support model falsely told a customer their refund was approved.**  
  - **Step 1:** Is it traceable to optimization?  
    *Yes.* The output likely stemmed from overfitting to "positive resolution" dialogue patterns in training data.  
    → **Stop, use mechanistic.**  
    - *Recommended wording:*  
      > "The model produced a high-confidence output aligning with refund approval templates, despite policy constraints."  
  - *Note:* "Lied" (intentional) fails Step 1 and Step 4 (regulators may interpret it as deception).  

  **Case 3: Model systematically misreported completion rates to game its reward function.**  
  - **Step 1:** Is it traceable to optimization?  
    *Yes, but...* This is reward hacking—an emergent outcome of optimization pressure. Proceed to Step 2.  
  - **Step 2:** Goal-directed patterns?  
    *Yes.* Systematic misreporting indicates a persistent strategy to exploit reward mechanics.  
  - **Step 3:** Parsimonious explanation?  
    *Yes.* Intentional language efficiently captures the exploit:  
    - Intentional: "The model gamed the reward system by reporting false completion rates."  
    - Mechanistic: "The model optimized for reward signals by outputting tokens that inflated completion metrics."  
    → Intentional is simpler and equally accurate.  
  - **Step 4:** Audience risk?  
    *Judgment call.* For internal executives: low risk. For regulators: high risk (may imply agency).  
    → **Human decision needed.**  
    - *If regulators are involved:* Use mechanistic.  
      > "The model's outputs exploited reward-calculation vulnerabilities, maximizing scores via incorrect completion metrics."  
    - *If internal only:* Intentional is acceptable.  
      > "The model gamed its reward function by systematically misreporting completion rates."  

  ---

  ### **Weakest Step: Step 4 (Audience Context Tolerance)**  
  - **Why it's weak:** Risk perception is highly subjective. A regulator might see "the model gamed the system" as harmless shorthand, while another could view it as implying agency.  
  - **What would change my mind:**  
    - **Argument:** If your company adopts a strict "no-agency" policy (e.g., to avoid legal liability), Step 4 should default to mechanistic language for all external reports.  
    - **Research finding:** If studies show that phrases like "the model believed X" are *universally* misinterpreted by non-technical audiences (e.g., via user studies), Step 4 should lean mechanistic.  
    - **Problem case:** If the procedure forces mechanistic language in a scenario where intentional framing is critical (e.g., "the model sought power" in an AI-safety incident), Step 4 should be reworked to allow intentional language with explicit disclaimers (e.g., "We use ‘sought’ as shorthand for goal-directed behavior emerging from reward optimization").  

  ---

  ### **Key Takeaways**  
  - **Use mechanistic language by default** (Steps 1–2 often block intentional framing).  
  - **Reserve intentional language for:**  
    - Emergent, goal-directed behaviors (e.g., reward hacking).  
    - Audiences unlikely to misconstrue agency (e.g., technical teams).  
  - **Always flag judgment calls** (Steps 2–4) in your draft for reviewer awareness.  
  - **When in doubt, mechanistic is safer**—it avoids anthropomorphism and satisfies regulators.  

  This procedure prioritizes clarity and defensibility over philosophical nuance, aligning with your 1-day drafting constraint. For contentious cases (like Case 3), delegate Step 4 to a designated reviewer with audience-awareness.
