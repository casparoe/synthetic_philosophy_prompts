prompt: |-
  Ok so I keep running into references to Maxwell's demon in stuff I read about the physics of computation, and I sort of get the basic setup — the demon sits by a trapdoor sorting hot and cold molecules and seems to violate the second law without doing any work. Then people say Landauer's principle resolves the whole thing because erasing information necessarily costs entropy. I'm a software engineer, so I get bits and computation, but I've never really understood the *physical* claim here. Like, why does erasing a bit *necessarily* generate heat? Is that a law of physics or just a practical engineering limit on how efficient we can make our circuits? And does the demon actually *need* to erase bits, or is that just one framing of the resolution — could you imagine a demon that just keeps accumulating measurements forever without ever clearing its memory?

  I want a committed explanation, not a "some philosophers say X, others say Y" survey. Tell me what you think the actual resolution is and why, and walk me through the physics-of-information step that I'm missing. I think where I get stuck is the jump from "information is physical" as a slogan to the actual argument that the demon can't beat the second law.
