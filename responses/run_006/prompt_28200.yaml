prompt: |-
  You are a professional philosopher working in bioethics, with a focus on reproductive ethics. Please think through the following task carefully, and begin by brainstorming before you commit to a final answer.

  I want the desiderata for an adequate theory of the ethics of reproductive selection — the full specification of what such a theory must get right, before we argue about which theory satisfies them.

  The domain: selecting among possible future children, primarily via preimplantation genetic diagnosis (PGD). I am bracketing genetic modification of a given embryo; the question is about selection among embryos that already exist, each of which could be implanted. The core normative question is whether, and on what grounds, prospective parents have reasons or obligations to select one possible child rather than another.

  Write the list of requirements. For each, provide:
  - The case or consideration that makes it a requirement.
  - Whether it is non-negotiable (a theory that fails it is simply inadequate) or a weighted desideratum that different approaches might trade off.
  - What work it does: which families of views it rules out or puts pressure on, and what would be lost by abandoning it.

  Among the phenomena a theory should handle: the distinction (if any) between selecting against a disease and selecting against a disability; the non-identity problem and its implications for harm-based objections to selection; the expressivist worry that selecting against a trait sends a negative message about people who live with that trait; the scope question — whether procreative beneficence (the claim that we have reason to select the child with the best expected life) is a genuine moral requirement or an overextension of beneficence; the permissibility/obligation distinction; selection for non-pathological traits (sex, temperament, predicted height); and the boundary between legitimate parental discretion and legitimate state interest.

  Then address these higher-order questions:
  - Are any pairs of desiderata in tension, perhaps in a way that explains why the debate between defenders and critics of procreative beneficence has not settled?
  - Which single requirement does the most work to narrow the space of viable theories?
  - Are there candidate requirements you considered but rejected as parochial — things one camp treats as a requirement but that, on reflection, are not genuine adequacy conditions? Be explicit about these and your reasons for excluding them.

  Begin with a brainstorming phase in which you generate candidate requirements before filtering and organizing them. Your final output should be the organized list with the supporting analysis, not a transcript of the brainstorming.
reasoning: |-
  Okay, the user wants me to act as a bioethicist specializing in reproductive ethics and develop desiderata for a theory on reproductive selection via PGD. This is quite a complex philosophical task that requires careful structuring.

  First, I need to understand the scope: we're focusing on selecting among existing embryos through PGD, not genetic modification. The core question is whether parents have reasons or obligations to select one potential child over another. 

  I should start by brainstorming all possible requirements before organizing them. Key phenomena to address include: disease vs disability distinction, non-identity problem, expressivist concerns, scope of procreative beneficence, permissibility/obligation distinction, non-pathological trait selection, and boundaries of parental discretion vs state interest.

  For each requirement, I'll need to provide: the case that motivates it, whether it's non-negotiable or weighted, and what theoretical work it does (which views it rules out or pressures). Then address higher-order questions about tensions between desiderata, which one does the most work, and any rejected candidates.

  The non-identity problem seems particularly crucial - it challenges harm-based objections since no specific child is harmed by not being selected. The disease/disability distinction matters because some argue selecting against diseases is different from selecting against disabilities like deafness. Expressivist concerns about sending negative messages to existing disabled people also need consideration.

  Procreative beneficence (Julian Savulescu's principle) is central - is selecting for best life prospects obligatory or merely permissible? And how far does this extend to non-medical traits? Parental discretion boundaries are important too - when should society intervene in reproductive choices?

  I should watch for tensions, like between procreative beneficence and expressivist concerns, which might explain why debates persist. The non-identity problem likely does the most work in narrowing viable theories. Some might want to include "genetic diversity" as a requirement, but that seems parochial - not a core adequacy condition for the individual selection context.

  This framework needs to be robust enough to handle real-world cases while avoiding bias toward any particular ethical stance. The desiderata should provide neutral ground for evaluating competing theories.
answer: |-
  ## Desiderata for an Adequate Theory of Reproductive Selection Ethics (PGD Context)

  ### Brainstorming Summary (Key Concepts Identified)
  *   **Harm & Benefit:** Defining harm/benefit given the non-identity problem; distinguishing avoiding disease/disability from enhancement; permissibility vs. obligation of beneficence.
  *   **Identity & Existence:** The non-identity problem core; "wrongful life" debates; harm thresholds.
  *   **Parental Roles & Rights:** Scope of parental discretion; procreative autonomy; parental virtues/responsibilities; "open future" principle.
  *   **Social & Symbolic Impacts:** Expressivist objection; impact on existing disabled persons; commodification concerns; societal resource allocation; justice/fairness; discrimination risks.
  *   **Trait Classification:** Disease vs. disability vs. non-pathological traits; objectivity vs. social construction of traits; severity thresholds.
  *   **State Interests & Limits:** State's role in protecting children/public health; preventing eugenics; defining boundaries of intervention.
  *   **Practicality & Scope:** Feasibility of trait prediction; epistemic limitations; defining the relevant "set" of embryos for comparison; resource constraints.

  ### Organized List of Desiderata

  1.  **Addressing the Non-Identity Problem Adequately**
      *   **Case:** Selecting embryo A (healthy) over embryo B (with cystic fibrosis) doesn't harm B, as B would not otherwise exist. Standard harm-based objections fail.
      *   **Non-Negotiable:** Yes. A theory ignoring or mishandling this fundamental metaphysical/logical problem cannot provide coherent normative guidance for selection among distinct possible future persons.
      *   **Work:** Rules out simple "harm avoidance" as a sufficient basis for obligations/rules *against* selection. Pressures theories towards "person-affecting" revisions, impersonal principles (e.g., total/average welfare), or alternative frameworks (e.g., parental virtue, social meaning). Abandoning it leads to fundamental incoherence in reasoning about selection.

  2.  **Distinguishing & Justifying Trait Categories**
      *   **Case:** Is selecting against Tay-Sachs (fatal childhood disease) morally equivalent to selecting against congenital deafness? Or selecting *for* musical aptitude? Theories must explain the relevant differences (or lack thereof).
      *   **Non-Negotiable:** Weighted. Essential for delimiting the scope of procreative beneficence and permissible discretion, but *how* it draws distinctions and the weight given to different categories will vary significantly between theories.
      *   **Work:** Pressures theories to define "disease," "disability," "normal variation," and "enhancement." Challenges theories relying solely on welfare (how does deafness *actually* affect welfare?). Rules out theories claiming *all* trait selection is impermissible or obligatory. Abandoning it leads to crude, potentially discriminatory, or overly restrictive/permissive conclusions.

  3.  **Accounting for the Expressivist Concern**
      *   **Case:** Selecting against an embryo because it has a genetic marker for Down Syndrome may convey a message that existing people with Down Syndrome are less valuable or that their lives are not worth living.
      *   **Non-Negotiable:** Weighted. A serious concern demanding engagement, but its force and whether it constitutes a decisive objection varies between theories. A theory cannot simply ignore it.
      *   **Work:** Pressures consequentialist/welfare-maximizing theories (procreative beneficence) to justify overriding this harm. Strengthens relational/recognition-based theories. Rules out theories claiming social meaning is entirely irrelevant. Abandoning it risks ignoring significant social harms and disrespect towards existing communities.

  4.  **Delimiting Procreative Beneficence (Scope & Weight)**
      *   **Case:** Does the mere *possibility* of giving a future child a marginally better expected life (e.g., slightly higher predicted IQ) create a moral *obligation* to select that embryo? Or is it merely a permissible reason, or even irrelevant beyond avoiding serious harm?
      *   **Non-Negotiable:** Weighted. Central to the debate. A theory must explicitly state its position on the existence, scope, and strength of procreative beneficence.
      *   **Work:** The core battleground. Defenders (e.g., Savulescu) argue strong PB is obligatory. Critics argue it is either non-existent, extremely limited (to avoiding serious harms), or merely permissible. Rules out theories that imply unlimited selection obligations based on minor welfare differences. Abandoning it leaves the central normative question unanswered.

  5.  **Clarifying Permissibility vs. Obligation**
      *   **Case:** Is selecting *for* sex (family balancing) morally permissible even if not obligatory? Is selecting *against* a severe disability obligatory, or just strongly recommended?
      *   **Non-Negotiable:** Yes. A theory must provide a framework for distinguishing actions that are forbidden, permissible, supererogatory, encouraged, or obligatory. It cannot collapse everything into a binary.
      *   **Work:** Essential for practical guidance. Pressures theories relying solely on maximizing principles (which often imply obligation) to account for permissibility. Rules out theories claiming all non-obligatory selection is impermissible. Abandoning it renders the theory practically useless for decision-making.

  6.  **Defining the Scope of Parental Discretion**
      *   **Case:** Should parents be free to select an embryo for any reason they find meaningful (e.g., sex, predicted eye color, family traits), or are there limits based on child welfare, social justice, or the child's future autonomy?
      *   **Non-Negotiable:** Weighted. A theory must stake a position on parental autonomy vs. external constraints, but the *extent* of discretion is heavily contested.
      *   **Work:** Pressures theories emphasizing parental rights/virtues to define boundaries. Pressures welfare/social justice theories to justify limits on parental choice. Rules out theories advocating for complete state control or absolute parental license. Abandoning it ignores the core agent (parents) and the context of raising a child.

  7.  **Defining Legitimate State Interest & Limits**
      *   **Case:** Should the state ban PGD for sex selection? Should it subsidize PGD to avoid costly genetic diseases? Can it mandate screening for certain conditions?
      *   **Non-Negotiable:** Yes. A complete theory must address the potential role (if any) of the state in regulating or influencing selection practices.
      *   **Work:** Pressures theories defining parental discretion to explain when state intervention is justified (e.g., preventing harm, ensuring justice). Pressures welfare-based theories to define thresholds for state action. Rules out theories advocating absolute state control or absolute non-interference. Abandoning it leaves a critical aspect of policy-making unaddressed.

  8.  **Acknowledging Epistemic & Practical Limitations**
      *   **Case:** Predictions about traits (especially complex ones like intelligence, personality) or future welfare are inherently uncertain. Resources for IVF/PGD are limited and access unequal.
      *   **Non-Negotiable:** Weighted. A theory must be feasible and acknowledge real-world constraints to avoid being purely abstract. However, the *weight* given to uncertainty/resource constraints varies.
      *   **Work:** Pressures strong procreative beneficence theories (requiring complex predictions). Challenges theories demanding maximally optimal selection. Highlights justice concerns regarding access. Rules out theories requiring impossible levels of knowledge or ignoring resource realities. Abandoning it risks creating an impractical or unjust theory.

  ### Higher-Order Analysis

  1.  **Tensions Between Desiderata:**
      *   **Procreative Beneficence (PB) vs. Expressivist Concern (EC):** This is a core tension. PB (especially strong versions) pushes towards selecting against traits associated with lower welfare, which often triggers the EC. Resolving this requires either downplaying EC (arguing social meaning isn't decisive or can be managed), limiting PB (e.g., only to severe harms where welfare deficit is clear/objective, potentially mitigating EC), or adopting a framework where EC trumps PB in certain cases. This tension *fundamentally* explains the intractability of the PB debate.
      *   **Parental Discretion (PD) vs. State Interest (SI):** Strong PD conflicts with broader SI in preventing discrimination (e.g., sex selection), managing societal costs, or preventing "backdoor eugenics." Resolving this requires theories to define compelling state interests and thresholds for intervention.
      *   **Non-Identity Problem (NIP) vs. Harm Avoidance Intuitions:** NIP makes strict harm-based arguments against selection difficult, yet strong intuitions persist that selecting *for* severe suffering is wrong. Theories must reconcile this, often using impersonal harm thresholds or alternative wrong-making features (e.g., parental vice).

  2.  **Most Work to Narrow Theories: The Non-Identity Problem (Desideratum 1).** It fundamentally reshapes the landscape. It forces theories to abandon simple "harm to the selected-against child" arguments and pushes them towards more complex foundations: impersonal harms/benefits, parental obligations/virtues, relational harms, or social consequences. Ignoring it renders a theory non-starter. Engaging with it immediately distinguishes sophisticated from naive approaches.

  3.  **Rejected Candidate Requirements (Parochial):**
      *   **"Must Uphold Genetic Diversity":** While potentially a social *value*, it's not a core requirement for an *individual* selection decision in PGD. The impact of any single PGD choice on overall human genetic diversity is negligible. This concern seems more relevant to population-level policies or germline modification debates. Including it as a primary desideratum for parents unfairly burdens them with a societal-level concern.
      *   **"Must Always Promote the 'Most Open Future'":** Joel Feinberg's concept is valuable. However, elevating it to a *non-negotiable requirement* is parochial to certain liberal-individualist views. It arguably rules out legitimate parental cultural or religious values in shaping a child's environment/identity from conception, and struggles with defining "openness" concretely. It should be a *weighted* consideration within parental discretion/social constraints, not an absolute mandate.
      *   **"Must Conform to 'Natural' Reproduction":** This is often used intuitively by critics but lacks a robust philosophical foundation. Defining "natural" is problematic, and medicine routinely intervenes in "natural" processes (prenatal care, fertility treatment itself) for good reasons. Basing adequacy on conformity to an ill-defined "natural" standard is arbitrary and unhelpful. The focus should be on consequences, rights, virtues, and meanings, not naturalness.
