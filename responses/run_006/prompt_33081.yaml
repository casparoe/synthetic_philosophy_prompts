answer: |-
  My friend, you've put your finger on one of the most stubborn knots in epistemic logic and formal epistemology. Your cases are wonderfully illustrative of the tension between normative ideals and psychological reality, and your frustration is shared by many who work on this. Let me walk through this as if we were discussing it over coffee, trying out ideas and seeing where they snag on your intuitions.

  First, your working guess—closure under what one would "immediately and competently draw on reflection"—isn't just vague; it risks circularity, as you suspect. What counts as "immediate" or "competent" often depends on prior judgments about what *should* be believed. But it’s pointing in the right direction: we need a principle that respects logical structure without demanding superhuman cognition. Let’s brainstorm candidates and pressure-test them against your cases.

  **Candidate 1: Closure under trivial consequence.**  
  The idea: belief closes under inferences so simple that denying them would betray misunderstanding of the logical constants (e.g., conjunction elimination, double negation). This captures why you think your friend *does* believe the game is cancelled (modus ponens is trivial) and why you believe the cat isn’t *not* on the mat (double negation is basic to "not"). But it stumbles elsewhere. You don’t believe "rain or moon-cheese" despite disjunction introduction being trivial. And it doesn’t resolve your ambivalence about conjunction: is believing P-and-Q trivial given P and Q separately? Sometimes yes, sometimes no—triviality seems context-sensitive. Worse, it offers no help for the Peano axioms case: deriving the infinitude of primes isn’t trivial, so closure wouldn’t apply, but then we lose any explanation for why you *should* (or shouldn’t) believe it pre-proof.

  **Candidate 2: Awareness-based accounts.**  
  Here, you only believe consequences of propositions you’re *currently aware of* or have *explicitly represented*. This cleanly handles the disjunction case (you’ve never entertained "rain or moon-cheese") and the child without "prime" (she lacks the concept). It also explains your Peano axioms intuition: you hadn’t "activated" the inference path to the primes theorem. But it fails your first case: your friend *is* aware of "rain" and "rain → cancelled" yet denies believing "cancelled." If awareness suffices, he *should* believe it, but you want to say he does believe it despite his denial. It also struggles with double negation: are you "aware" of "not(not-cat-on-mat)" when you think "cat on mat"? If not, why do you believe it? If yes, awareness becomes too elastic.

  **Candidate 3: Belief as commitment, not representation.**  
  This treats belief as a normative commitment to consequences, not a stored mental state. You "believe" whatever you’re rationally committed to by your explicit beliefs, regardless of psychological access. This saves the modus ponens case (your friend is committed to "cancelled") and the Peano case (you weren’t committed to the prime theorem—it requires non-trivial derivation). But it overreaches. You’re committed to "rain or moon-cheese" by disjunction introduction, yet you recoil at saying you believe it. It also can’t explain the child: is she committed to "prime" without the concept? Commitment seems to require conceptual grasp. And it turns belief into an externalist spectre—haunting your mind with consequences you’ve never reckoned with.

  **Candidate 4: Impossible-worlds accounts.**  
  These replace standard possible worlds with "worlds" where logical truths fail, allowing agents to believe P without believing its consequences. This dodges all closure demands, but it’s too permissive. Your intuitions *want* closure in some cases (modus ponens, double negation). If anything goes, we lose the force of logical norms entirely—why criticize your friend for denying "cancelled" if logic isn’t binding?

  **Candidate 5: Dispositional accounts (refining your guess).**  
  Belief closes under inferences you’re *reliably disposed* to draw when attentively considering the premises. This avoids omniscience by tethering belief to cognitive mechanisms. It explains the modus ponens case (your friend *would* assent to "cancelled" on reflection) and the double negation case (you’d immediately assent). It respects the disjunction case (you’re not disposed to assert "rain or moon-cheese") and the child (she lacks dispositions for "prime"). For Peano, you weren’t disposed to derive the primes theorem unaided. But what about conjunction? Your disposition to assent to P-and-Q *given* P and Q might be strong, but is it triggered if you’ve never considered them together? This reveals the account’s vulnerability: dispositions can be fickle. If you’d assent after a second’s thought, is that "reliable"? If not, where’s the threshold?

  ---

  **The best candidate: A hybrid principle.**  
  After wrestling with your cases, I propose a two-tiered view combining **representational constraints** and **inferential dispositions**. Belief requires:  
  1. **Conceptual possession**: You must possess the concepts in the proposition.  
  2. **Disposition to assent under idealization**: For logical consequences, you must be disposed to assent upon *sufficiently focused, competence-reflecting reflection*—where "sufficient" scales with the inference’s triviality for *you*.  

  "Triviality" here isn’t objective but agent-relative: an inference is trivial if your cognitive architecture (given your concepts) processes it automatically or with minimal effort. This draws from work on "effortless inference" (e.g., Harman, Stalnaker).  

  **Testing against your cases:**  
  - *Modus ponens friend*: Possesses concepts; modus ponens is trivial for most adults. He *is* disposed to assent on reflection → he believes.  
  - *Peano primes*: You possess concepts, but deriving the proof isn’t trivial (requires non-obvious steps). No disposition to assent pre-proof → you didn’t believe.  
  - *Disjunction*: You possess concepts, but disjunction introduction isn’t trivial *for you* in this context (it’s not automatic; you filter irrelevant disjuncts). No disposition to assent → no belief.  
  - *Double negation*: Possess concepts; double negation is trivial (automatic for competent speakers). Disposed to assent → believe.  
  - *Child without "prime"*: Lacks the concept → doesn’t believe "7 is prime," even if she believes its extensional equivalent.  
  - *Conjunction*: Ambiguity arises because minimal reflection *might* suffice to conjoin P and Q—but if the subjects are cognitively quarantined (e.g., believing "P" about politics and "Q" about chemistry, never linked), reflection isn’t "sufficiently focused." Your gut splits because sometimes the disposition is latent, sometimes absent.  

  **What you must abandon:**  
  - **The Peano intuition might need softening**. If you *deeply* grasp axioms and their potential, you’re *weakly committed* to consequences—but until the inference is trivial *for you*, it’s not full belief.  
  - **Disjunction introduction must sometimes hold**. If I ask whether it’s raining or 2+2=5, and you believe it’s raining, you *should* assent—it’s trivial. Your moon-cheese case works because the disjunct is absurd, not because closure fails.  

  **New case: Bayes’ rule violator.**  
  Someone accepts probability axioms but miscalculates posteriors. Our principle:  
  - If they possess the concepts (P(A|B), etc.) and Bayes’ derivation is trivial *for them* (e.g., they’ve internalized it), they *should* believe correct posteriors—violations are irrational failures.  
  - But if Bayes’ rule isn’t trivial *for them* (e.g., they’re learners who haven’t automated the inference), they might "accept" axioms without disposition to apply them correctly → no belief in specific posteriors. Their failure is cognitive, not doxastic.  

  **Final thoughts:**  
  The line is drawn at the intersection of concept possession and agent-relative triviality. It’s not perfectly sharp—human cognition isn’t—but it respects your core intuitions while acknowledging logical norms. You’re right that conjunction is thorny; I’d say if P and Q are *co-present* in mind (e.g., same context, topic), their conjunction is believed; if segregated, not. This preserves the "new thought" feeling.  

  This won’t satisfy everyone. Impossible-worlds theorists will say it’s too demanding; hardcore externalists will say it’s too psychologistic. But for your blend of realism and rationality, it’s the best fit. If you adopt it, you keep most verdicts, reframe a few, and accept that belief is a messy, graded affair—which is why bounded rationality resonates. I’d love to hear where this lands for you.  

  Warmly,  
  A fellow traveler in the thickets of reason
