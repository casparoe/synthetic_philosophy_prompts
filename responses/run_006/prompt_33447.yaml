  To avoid this, we can assume that the base rate is 50% for Alex's natural choice (without intervention) between Invest and Hold. Then, Clara's prediction is correct 70% of the time. So the joint distribution (without intervention) is:

  P(P_I, Invest) = 0.5 * 0.7 = 0.35
  P(P_I, Hold) = 0.5 * 0.3 = 0.15
  P(P_H, Invest) = 0.5 * 0.3 = 0.15
