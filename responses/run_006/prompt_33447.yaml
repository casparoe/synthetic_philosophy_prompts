  A **CDT defender** would argue:  
  - "Policy-level reasoning equivocates between *acting* and *precommitting*. Alex can’t bind themselves to a policy; they only choose an act *now*. The P_H world is improbable given Alex’s action (P=0.3 for Hold), so its catastrophic outcome is irrelevant to the current decision."  

