  - EDT EU(Invest) = (0.7) × [0.9×100 + 0.1×(-50)] + (0.3) × [0.1×100 + 0.9×(-50)] = 61 - 6 = 55  
  - EDT EU(Hold) = 34 → **EDT now recommends Invest**, while CDT recommends Hold.  
  - Policy-level EU(Always Invest) = (70 + 5)/2 = 37.5; EU(Always Hold) = 30 → Policy-level recommends Invest.  

  **Result**: The case collapses into a **standard Newcomblike problem** where EDT and policy-level reasoning favor Invest (due to correlation with P_I), while CDT favors Hold (due to causal risk).

