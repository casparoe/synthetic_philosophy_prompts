prompt: |-
  I'm taking a philosophy of cognitive science course and we're in the unit on whether the features that interpretability tools find in neural networks are real or just useful fictions. I've been arguing about this alot with a friend who works in an interpretability lab, and she has very firm instincts about which internal structures she'll call genuine representations and which she'll dismiss as stuff we can merely read off the model. I want to reverse-engineer the rule she's actualy running.

  Her verdicts so far: early-layer edge detectors in a convnet, real; a clean sparse-autoencoder feature for a specific landmark that's selective and steers captions in the expected way, real; a linear probe direction that decodes truthfulness from layer 14 but doesn't change behavior when you intervene on it, not a representation, just extractable information; an SAE feature that appears only under one sparsity penalty and one random seed and has no causal effect, artifact; grid-cell-like units in a path-integrating RNN that are causally required for navigation, real; a single attention head that's necessary for copying the previous token, real.

  The case we're stuck on: someone took the difference between mean activations for formal and informal text to get a dense steering vector. Adding it to the residual stream reliably changes completions in predictable but context-specific ways — in dialogue it makes them more formal, in math prompts more concise, in creative writing more confident, and in some domains it does nothing. The vector isn't selective, doesn't line up with any single SAE feature, and there's no obvious single property covering all its effects. What would she say about this one, and why? I care less about the yes/no than about the rule behind her earlier verdicts, the other rules that fit them just as well, and which extra case would cleanly tell those rules apart. If you think the question "which internal structures are representations" is ill-posed here, or that I'm assuming a kind of realism she'd reject, say that plainly instead of pretending there's a tidy rule.
reasoning: |-
  Okay, the user is in a philosophy of cognitive science course discussing whether interpretability tools reveal real representations in neural networks or just useful fictions. They've been debating with a friend who works in an interpretability lab, and they want to reverse-engineer her implicit rule for distinguishing genuine representations from artifacts. 

  First, I need to understand the friend's verdicts on various cases. She accepts early-layer edge detectors, sparse autoencoder features for landmarks that causally affect outputs, grid-cell-like units in RNNs necessary for navigation, and attention heads necessary for token copying as real representations. But she rejects linear probes that decode information without causal effects and SAE features that appear inconsistently under different seeds/sparsity penalties.

  The sticking point is this dense steering vector derived from mean activation differences between formal/informal text. It predictably changes model behavior in context-specific ways but isn't selective, doesn't align with SAE features, and lacks a unified property across contexts. 

  Hmm... the key pattern across her approvals seems to be: causal necessity + functional specificity. She wants features that aren't just correlated but actively participate in the model's computation in a way that mirrors how we'd expect a "representation" to function. The rejections all fail either the causal test (linear probe) or the stability/consistency test (seed-dependent SAE feature).

  For the dense vector case, I suspect she'd reject it as not a genuine representation because: (1) it's an external construction (difference-of-means) rather than an internal structure, (2) lacks selectivity/unified semantics, (3) doesn't causally explain the effects - we're just hacking the residual stream. It's more like exploiting statistical regularities than interacting with a "true" representational feature.

  But the user also wants to know alternative interpretations. Someone could argue for an "interventionist realism" where any reliably steerable direction counts. Or a "functional role realism" that might accept the vector if it maps to a coherent cognitive function. 

  To disambiguate, we'd need a test case: imagine an SAE feature that's causally potent but has messy/uninterpretable effects across contexts. My prediction is she'd still accept it if causally necessary, while an interventionist would reject it for lacking predictable effects. 

  The deeper issue is whether "representation" implies human-interpretable semantics. The friend seems to require both causal role and clean mapping to human concepts, which reveals an implicit anthropocentrism in her approach. The user might push back on whether neural nets need to represent things the way humans do to count as having representations at all.
answer: |-
  Based on your friend's pattern of verdicts, her implicit rule for "genuine representation" likely combines **causal necessity**, **functional specificity**, and **algorithmic stability**. Here's the reverse-engineered rule and its application to your case:

  ### Your Friend's Likely Rule (Abductive Inference)
  A feature is a "genuine representation" iff:
  1. **Causal Role**: It is *causally necessary* for a specific function (intervening on it predictably alters model behavior).
  2. **Functional Specificity**: It encodes a *coherent, context-invariant property* (e.g., "edge," "landmark," "grid position").
  3. **Algorithmic Stability**: It is *robustly discoverable* across methods/seeds/hyperparameters (not an artifact of a specific tool).

  ### Her Verdicts Explained with the Rule
  - ✅ **Edge detectors/Grid cells/Copying head**: Causally necessary (1), functionally specific (2), stable (3).
  - ✅ **Sparse autoencoder (SAE) landmark feature**: Causally steers behavior (1), selective property (2), implied stability (3).
  - ❌ **Linear probe for truthfulness**: Not causal (fails 1), just correlational.
  - ❌ **Fragile SAE feature**: Not stable (fails 3), no causal role (fails 1).

  ### The Dense Steering Vector Case
  **Prediction: She'd call this *not* a genuine representation.**  
  *Why?*  
  - ❌ **Fails (1) Causal Role**: The vector *induces* effects but isn't *causally necessary* for the model's native function. It's an external hack, not an internal mechanism.  
  - ❌ **Fails (2) Functional Specificity**: Its effects are context-dependent ("formal," "concise," "confident" aren't unified properties). No *single* semantic content.  
  - ❌ **Fails (3) Algorithmic Stability**: Derived via a crude method (mean difference), not discovered through multiple interpretability tools (e.g., no SAE alignment).  

  She'd likely label this an **exploitable statistical regularity**—a useful fiction for steering, but not a "real" representation *in the model's intrinsic computational structure*.

  ---

  ### Alternative Rules & Discriminating Cases
  Your friend's rule prioritizes **mechanistic realism** (features as causal components in the algorithm). Alternatives exist:

  1. **Interventionist Realism**:  
     *"Any direction that permits reliable interventions is real."*  
     → **Accepts the dense vector** (it *does* steer behavior predictably).  
     *Discriminating Case*: A direction that decodes a property (e.g., "truthfulness") but *cannot* be intervened on. Friend rejects (fails causality), Interventionist rejects (no control).  

  2. **Functional Role Realism**:  
     *"Any activation pattern that plays a consistent role in the model's computation is real, even without selectivity."*  
     → **Accepts the dense vector** (it consistently shifts outputs contextually).  
     *Discriminating Case*: A highly selective SAE feature that *isn't* causally necessary (e.g., redundant circuitry). Friend rejects (fails 1), Functionalist accepts (it plays a role).  

  3. **Structural Stability Realism**:  
     *"Only features invariant to training/architectural variations are real."*  
     → **Rejects grid cells** (if they vary across RNN seeds) or **accepts fragile SAEs** (if they reappear with different methods).  

  ---

  ### Critical Test Case to Disambiguate
  **Present this to your friend:**  
  > *"An SAE feature activates only for 'animals with stripes.' Ablating it breaks responses about tigers/zebras but not other animals. It reappears in 5/10 seeds under one sparsity penalty. Is it real?"*  

  - **Her likely verdict**: ❌ Not real (fails stability: 3).  
  - **If she accepts it**: She weights *causal specificity* (1,2) over *stability* (3).  
  - **If she rejects it**: Stability (3) is non-negotiable.  

  ---

  ### Philosophical Tension
  The question **isn't ill-posed**, but your friend's rule reveals an implicit commitment to:  
  - **Causal-mechanistic explanation** (representations as *components in a causal process*).  
  - **Anthropocentric interpretability** (features must map to *human-intelligible concepts*).  

  This risks **false negatives**: Networks may encode genuine representations that are polysemantic, distributed, or algorithmically unstable—but still computationally essential. Her "real" ≈ "fits a classic cognitive science model of symbolic representation."  

  ### Recommendation
  Ask her: *"Is a representation still 'real' if it’s causally necessary but not human-interpretable (e.g., a tensor that controls grammatical agreement but resists feature visualization)?"*  
  Her answer will clarify whether **interpretability** is a covert criterion. If yes, she conflates *epistemic access* with *ontological status*—a key realism/anti-realism fault line.
