answer: |-
  Your frustration is perceptive and your hypothesis astute. The reductionism/anti-reductionism debate *does* often feel like trench warfare, precisely because it frequently masks deeper foundational disagreements and methodological differences. Let's break down your diagnosis and explore alternatives and paths forward.

  **Diagnosing the Impasse:**

  1.  **Your Core Hypothesis is Largely Correct:**
      *   **Underlying Epistemology (Internalism vs. Externalism):** This is the primary engine driving the stalemate.
          *   **Reductionists:** Are almost always implicitly (or explicitly) committed to a form of **Internalism**. They demand that the *hearer* possess *accessible reasons* (perceptual evidence, memory, background inductive knowledge) justifying trust in *this specific instance* of testimony. Justification must be "earned" through the subject's own cognitive resources.
          *   **Anti-Reductionists:** Often align with **Externalism** or **Entitlement Epistemology**. They argue that justification can arise from reliable processes (like a properly functioning human trust mechanism) or default entitlements constitutive of rational agency, even if the hearer lacks explicit, accessible reasons tracing back to non-testimonial sources. The justification is "basic" in the sense that it doesn't *need* to be inferred from other beliefs held by the subject; it arises from the nature of the testimonial exchange itself (e.g., Burge's Acceptance Principle, Reid's Credulity).
          *   **Result:** When a reductionist demands "your reasons for trusting this speaker," the anti-reductionist hears a misguided internalist requirement irrelevant to the actual externalist source of justification. Conversely, when the anti-reductionist invokes a "default entitlement," the reductionist hears an evasion of the subject's rational responsibility. They aren't just disagreeing about testimony; they're disagreeing about *what epistemic justification fundamentally is*.

      *   **Data Selection & Intuition Pumps:** You're right about the contrasting cases.
          *   **Reductionist Intuitions:** The "outlandish claim on the bus" (also: the credulous child believing blatant lies, the careless adult accepting gossip). These highlight the *dangers* of uncritical acceptance and seem to demand *some* positive reason for trust. They appeal to our sense of epistemic responsibility and vulnerability to deception.
          *   **Anti-Reductionist Intuitions:** The "ordinary conversational exchange" (also: learning language as an infant, trusting the bus driver about the route, accepting mundane facts from colleagues). These highlight the *necessity and pervasiveness* of trust for knowledge acquisition and social coordination. They appeal to our sense that demanding explicit justification for *every* claim would cripple cognition and social life. Demanding inductive evidence for the bus driver's reliability about the route seems absurd and impractical.
          *   **Result:** Each side builds arguments anchored in cases that make their position seem intuitively obvious, while dismissing the other side's cases as irrelevant, pathological, or misdescribed. The debate becomes about which intuitions are "central" to testimony.

  2.  **Additional Factors Contributing to the Stalemate:**

      *   **The Nature of Testimony Itself:** Testimony is uniquely *social* and *intentional*. Unlike perception (input from the world) or memory (internal recall), testimony involves *receiving a communication intentionally produced by another mind to convey information*. This introduces complexities (intention, competence, sincerity) that don't neatly map onto traditional "sources" like perception or inference. Is it a source, or a *channel* relying on other sources? This inherent ambiguity fuels the dispute.
      *   **The Circularity/Regress Problem:** Coady's point is powerful and exposes a deep tension. Anti-reductionists use it to argue reductionism is impossible. Reductionists counter that local reductionism avoids needing a *global* inductive base; we bootstrap using *some* non-testimonially justified background knowledge to evaluate *specific* testimonies, gradually building a network of justified trust. But this "bootstrapping" process itself often relies on implicit trust, which the anti-reductionist seizes upon.
      *   **The "Understanding as Presentation of Truth" (Burge):** This is a strong anti-reductionist move. If understanding an assertion necessarily involves taking its content *as asserted*, hence *as presented as true*, then accepting it (absent defeaters) seems like the default rational stance. Reductionists might argue this confuses *understanding* with *justified belief*. I can understand a lie perfectly well without believing it; the presentation-as-true doesn't *compel* acceptance, it just describes the speech act.
      *   **Terminological & Conceptual Divergence:** What exactly counts as "reduction"? What does "basic source" mean? What level of "entitlement" is being claimed? Disagreements about these core concepts can lead to talking past each other. Is local reductionism *really* reductionism, or a form of weak anti-reductionism? Is default entitlement just a *different kind* of reason?

  **What Kind of Disagreement Is This?**

  It's **all** of the types you mention, layered together:

  1.  **Normative/Foundational:** At its core, it's a disagreement about the *fundamental norms* governing justified belief acquisition: Must justification always be accessible to the subject and traceable to non-social sources? Or can social reliance itself be a foundational source of justification under certain conditions? This is deeply normative.
  2.  **Factual (to an extent):** There *are* factual components: How *do* humans actually acquire beliefs from testimony? Do we *in fact* rely on internal inductions constantly, or operate with a default trust? (This is where empirical work becomes relevant). Is human testimony *generally reliable enough* to support a default entitlement? (A factual claim about the world).
  3.  **Conceptual/Verbal:** Disagreements about the meaning of "justification," "source," "reduction," "entitlement," and even "testimony" itself contribute significantly. Is justification inherently individualistic or essentially social?
  4.  **Methodological (Standards for Data):** As you noted, it's a disagreement about which epistemic practices are *paradigmatic* and which intuitions carry the most weight in constructing a theory. Which cases reveal the "true" nature of testimonial justification?

  **Is Your Hypothesis Incomplete? What Else Explains the Impasse?**

  It's strong, but could be augmented:

  *   **The Individualism/Holism Divide:** Reductionism often embodies a methodological *individualism*: justification must be grounded *within the individual knower's* cognitive resources. Anti-reductionism is often more compatible with *epistemic holism* or *communitarianism*, seeing knowledge as fundamentally social and reliance on others as intrinsic to rationality itself.
  *   **The Scope of the A Priori:** Anti-reductionists often lean on *modest a priori* principles (like Burge's Acceptance Principle) governing rational acceptance of testimony. Reductionists typically reject such principles as unjustified leaps, demanding empirical/a posteriori grounding. This is another facet of the internalism/externalism split.
  *   **Focus on Justification vs. Knowledge:** Sometimes the impasse arises because the sides are subtly focused on different things. Reductionism often emphasizes the *justification* required for a belief *to be justified*. Anti-reductionism often emphasizes the conditions under which testimony can reliably *generate knowledge*, which might require less internalist-style justification (consistent with externalism about knowledge).

  **What Would Count as Progress?**

  The debate is unlikely to be "solved" with one knockout argument. Progress might look like:

  1.  **Refined Distinctions & Hybrid Models:** Moving beyond the binary. Examples:
      *   Distinguishing *types* of testimony (expert vs. lay, formal vs. informal, high-stakes vs. low-stakes) that might warrant different justificatory structures.
      *   Developing sophisticated hybrid accounts (e.g., "Dualism" - Jennifer Lackey): Testimonial justification *requires* both the speaker's competence (reliability condition, externalist) *and* the hearer having *some* (perhaps minimal, non-individualistic) positive reason for accepting the testimony (internalist-like condition), avoiding both pure reductionism and pure anti-reductionism.
      *   Clarifying the nature of "defeaters": What *kind* of negative evidence defeats the default entitlement? How accessible must it be?
  2.  **Engagement with Empirical Findings (Developmental & Cognitive Psychology):** This is crucial for breaking the intuition deadlock.
      *   How *do* infants and children actually learn from testimony? Do they exhibit a robust default trust? How early do they develop sensitivity to reliability cues (speaker confidence, past accuracy, consensus)? (Work by Paul Harris, Melissa Koenig, etc.).
      *   What cognitive mechanisms underpin adult acceptance/rejection of testimony? How much explicit reasoning is involved in mundane trust? How effective are we at detecting deception?
      *   **Impact:** Evidence for a strong, early-emerging default trust would bolster anti-reductionism. Evidence for sophisticated, early-emerging reliability monitoring (even if implicit) would bolster reductionism. Evidence for a developmental trajectory or context dependence could support hybrid views.
  3.  **New Cases & Thought Experiments:** Cases that put pressure on *both* sides simultaneously, forcing refinement.
      *   Cases involving AI testimony, collective testimony, testimony in highly polarized information environments.
      *   Cases exploring the boundary between understanding and acceptance.
      *   Cases where background knowledge *undermines* global trust but specific local trust seems justified (or vice-versa).
  4.  **Explicit Engagement with Foundational Commitments:** Progress requires philosophers to explicitly acknowledge and debate the underlying internalism/externalism divide, normative stances, and methodological choices about data. Framing the testimonial debate *as an instance of* this larger foundational disagreement can lead to more productive meta-discussions.
  5.  **Shifting the Question:** Instead of "Reductionism or Anti-Reductionism?", ask: "Under what conditions is a hearer justified in accepting testimony?" or "What are the necessary and sufficient conditions for testimonial *knowledge*?" This opens space for more nuanced answers incorporating elements of both views.

  **Should We Expect No Progress?**

  While a definitive "victory" for one side is unlikely, progress *is* possible and *has* occurred. The shift from demanding global reduction to accepting local reduction was progress. The articulation of sophisticated anti-reductionist views like Burge's was progress. Hybrid models represent progress. Engagement with psychology is progress. The impasse persists because the foundational issues are genuinely difficult and reflect deep tensions in epistemology itself (individual vs. social, internal vs. external). However, continually refining the concepts, incorporating new evidence, and developing more nuanced models *is* meaningful progress, even if it doesn't end the debate. Your seminar's stalemate reflects the enduring power of these foundational questions, not necessarily the futility of asking them. Your recognition of the deeper drivers is itself a significant step forward in understanding the terrain.
