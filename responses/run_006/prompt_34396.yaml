answer: |-
  ### Exam Question  
  **Environmental Ethics 495: Final Examination**  
  **Time Allowed:** 90 minutes  
  **Word Limit:** Approximately 1,200 words  

  **Question:**  
  Habitat destruction is conventionally condemned for harming wild animals through direct mortality, starvation, or displacement. However, some argue that by preventing future wild animal lives—which may contain net suffering—habitat destruction could reduce aggregate suffering. Evaluate this claim and its implications for conservation policy. In your essay:  

  1. Explain why the argument that habitat destruction *reduces* suffering hinges primarily on the prevention of future lives rather than impacts on existing animals, and clarify the ethical distinction between these effects.  
  2. Identify the empirical assumptions about the baseline welfare of wild animals required to conclude that preventing future lives reduces net suffering. Discuss what kinds of evidence could support or challenge these assumptions.  
  3. Assess whether the concept of "net welfare of an ecosystem" can function as a coherent target for conservation policy, given challenges in aggregating welfare across diverse individuals, species, and life stages (e.g., predators vs. prey, juveniles vs. adults).  
  4. Finally, defend a position on how conservation policy should address habitat destruction under deep uncertainty about whether wild animal lives contain net positive or net negative welfare. Consider whether less destructive interventions (e.g., habitat modification, fertility control) are preferable to destruction regardless of welfare assumptions.  

  Support your analysis with reasoning, not recitation of standard positions.  

  ---  

  ### Model Answer (≈800 words)  

  The claim that habitat destruction reduces wild animal suffering challenges conservation orthodoxy by focusing on the welfare consequences of *preventing future lives*. This argument depends critically on disentangling two effects: harming existing animals and preventing potential future animals.  

  **1. Harm to Existing vs. Prevention of Future Lives**  
  Habitat destruction directly harms current animals through death, injury, or displacement—a clear welfare loss. However, reducing aggregate suffering requires preventing future individuals whose lives would contain *negative net welfare*. If each prevented life avoids a net negative existence, the intervention reduces suffering overall. This distinction relies on a nonidentity problem: preventing a life that would suffer is not "harming" a specific individual (as no identifiable subject exists), but it alters total welfare. Thus, the case for suffering reduction rests almost entirely on preventing future negative lives, not on the acute harms to current animals, which unequivocally increase suffering in the short term.  

  **2. Empirical Assumptions and Evidence**  
  The conclusion that preventing future lives reduces suffering requires two empirical assumptions:  
  - **Assumption 1:** Most wild animals experience lives with net negative welfare due to chronic stressors (e.g., predation, disease, starvation).  
  - **Assumption 2:** Preventing lives does not shift suffering to other ecosystems (e.g., via migration) or increase suffering per capita in remaining habitat.  

  Evidence for Assumption 1 might include ecological data showing high juvenile mortality rates (>50% in many species), prevalence of chronic parasites, or behavioral indicators of stress (e.g., abnormal cortisol levels). However, this evidence is inconclusive: high mortality does not prove lives are net negative if positive experiences (e.g., feeding, mating) are intense, and physiological stress markers don’t quantify *subjective* welfare. Assumption 1 could be undermined by evidence of adaptive resilience (e.g., rapid recovery from injury) or positive welfare indicators (e.g., play behavior). Assumption 2 faces empirical challenges in tracking ecosystem-level spillover effects.  

  **3. Ecosystem Net Welfare as a Policy Target**  
  Using "net ecosystem welfare" as a conservation standard is ethically and practically problematic. Ecosystems lack sentience and thus cannot possess welfare. Aggregating welfare across individuals requires comparing intersubjective experiences (e.g., a deer’s fear vs. a wolf’s satiety), which is fraught with measurement issues and value judgments. Crucially, aggregation masks distributional conflicts: maximizing net welfare could favor reducing prey populations to minimize predation suffering, contradicting biodiversity goals. Additionally, time scales create dilemmas—e.g., is a short, painful life worse than nonexistence? Without a coherent method to normalize welfare across species or resolve trade-offs, "net ecosystem welfare" is too vague for policy.  

  **4. Policy Under Uncertainty and Alternatives**  
  Given deep uncertainty about the sign of wild animal welfare, conservation policy should prioritize avoiding irreversible harm. If welfare is net positive, habitat destruction causes catastrophic welfare loss. If net negative, destruction *might* reduce suffering, but less destructive interventions are superior:  
  - **Fertility control** prevents future suffering without mass mortality.  
  - **Habitat modification** (e.g., creating predator-free zones) targets specific welfare risks.  
  These avoid the nonidentity problem’s ethical unease and are reversible if evidence emerges that wild lives are net positive. Under *either* welfare assumption, habitat destruction is dominated by alternatives: it risks massive harm if welfare is positive and is ethically crude if welfare is negative. Conservation policy should therefore focus on reducing identifiable suffering in extant populations while preserving habitats until welfare sign uncertainty is resolved.  

  ---  

  ### Marking Scheme (Total: 25 marks)  

  | **Criterion**                                                                 | **Marks** | **Weak Answers Typically...**                          |  
  |-------------------------------------------------------------------------------|-----------|--------------------------------------------------------|  
  | **1. Distinguishes harming existing animals vs. preventing future lives**     | 5         | Conflate the two or misapply the nonidentity problem. |  
  | **2. Identifies empirical assumptions & evidence for net negative welfare**   | 6         | List generic challenges without specifying testable evidence. |  
  | **3. Evaluates ecosystem welfare aggregation (coherence, distribution, scale)** | 6         | Assert it is "problematic" without dissecting why aggregation fails. |  
  | **4. Defends policy under uncertainty & compares interventions**              | 5         | Ignore reversibility or assume habitat destruction is optimal if welfare is negative. |  
  | **5. Synthesis: Logical flow, precision, avoidance of slogans**               | 3         | Default to conservationist or suffering-focused clichés. |  

  **Grade Boundaries:**  
  - **A (21–25):** Addresses all 5 criteria. For #3, explicitly analyzes aggregation impossibility (e.g., cross-species comparisons). For #4, justifies alternatives’ dominance under *both* welfare assumptions.  
  - **B (16–20):** Addresses criteria 1,2,4 but superficially treats #3 (e.g., notes "aggregation is hard" without ethical critique) or omits intervention comparison in #4.
