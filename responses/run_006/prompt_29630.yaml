prompt: |-
  I run the trust and safety policy group for a mid-sized social platform, and we are rewriting our slur policy. Our current rule is a blunt one: if a post contains any string on a blocklist, it is removed. We have known for a while that this gets the wrong answer in both directions. It takes down uses almost no one on the policy team wants taken down—a member of the targeted group using a reclaimed term about themselves or their community, a news account quoting a public figure's use of a slur, an educational post about the history of the word—and it misses derogatory uses that never touch the list, like an account that systematically refers to a group through a euphemism or a stock phrase that does the same work in context. The moderators who will run the next policy are not linguists; they make thousands of decisions a day, usually in under a minute, and the stakes are high in both directions, because under-removal exposes users to abuse and over-removal chills legitimate speech and punishes the very groups the policy is meant to protect.

  I want you to write a reusable decision procedure, grounded in the semantics and pragmatics of slurs as philosophers of language understand them, that a moderator can actually run. It should encode the distinctions that matter—conventional meaning or content versus what a use pragmatically conveys or does, offense versus derogation, speaker identity and audience in reclamation, and use versus mention or quotation—and it should not quietly assume one contested theory where the main accounts would give different verdicts. For each step: state the question, say what counts as a satisfactory answer before moving on, and say where the procedure stops with a decision and where it escalates to a human policy specialist because the step is a judgment call no written rule can absorb. Then run the procedure on three cases: a member of the targeted group using a reclaimed slur in a celebratory in-group post; a news organization quoting a government official's use of a slur; and a post that never uses a listed slur but calls a marginalized group "those people" in a way that clearly does the work of a slur. At least one of the three should return a result the policy team will not like, and I want you to say so plainly. Finally, be explicit about which steps are really the company's values doing the work under a procedural disguise, and about the cases this procedure will get wrong no matter how carefully it is written.
reasoning: |-
  We are designing a decision procedure for moderators to handle slurs and derogatory content. The procedure must be grounded in linguistic philosophy, accounting for semantics, pragmatics, reclamation, use vs. mention, and speaker identity. It must be executable by non-linguists quickly and must escalate hard cases to policy specialists.

  Key distinctions:
  1. Conventional meaning (semantic content) vs. pragmatic conveyance (what the utterance does in context).
  2. Offense (causing hurt feelings) vs. derogation (denigrating a group).
  3. Reclamation: when a member of the targeted group uses the term in a non-derogatory way, often within the group.
  4. Use (employing the term to refer) vs. mention/quote (referring to the term itself).

  The procedure must not assume one contested theory. We'll build steps that require moderators to gather context and make judgments, but we'll escalate when the judgment is too complex.

  Procedure Steps:

  Step 1: Identify the presence of a string from the blocklist or a pattern that might function as a slur.
     - Question: Does the post contain any string on the blocklist? Or, is there a pattern (e.g., a euphemism, dog whistle) that might be functioning as a slur in this context?
     - Satisfactory answer: 
          a) If a blocklisted string is present, mark as "string present" and note the string.
          b) If no blocklisted string, but the post contains a phrase that might be a euphemism or dog whistle (e.g., "those people", "thugs", "illegals", etc.) and the context suggests derogatory intent, mark as "suspected non-listed slur". Otherwise, end procedure (no action).
     - If "string present" or "suspected non-listed slur", proceed to Step 2.

  Step 2: Determine if the term is being mentioned (quoted) rather than used.
     - Question: Is the term being quoted (e.g., in a news report, academic discussion, or by someone reporting speech) without the speaker endorsing or using it?
     - Satisfactory answer: Look for clear indicators of quotation:
          - The term is in quotation marks, or
          - The post explicitly attributes the term to someone else (e.g., "The official said: ..."), or
          - The context clearly shows the speaker is discussing the word (e.g., "The word X is often used to ...").
     - If the term is only mentioned (quoted) and the speaker is clearly distancing themselves, then the post is allowed (no removal). End procedure.
     - If the term is used (not quoted) or if the quotation is being used to spread the slur (e.g., quoting a slur without condemnation in a context that amplifies harm), proceed to Step 3.
     - If unclear, escalate to policy specialist.

  Step 3: Assess if the term is being reclaimed by a member of the targeted group.
     - Question: Is the speaker a member of the group that the term has historically targeted? And is the use non-derogatory and in a context of reclamation (e.g., in-group solidarity, empowerment)?
     - Satisfactory answer: 
          - Check the speaker's self-identification (if available, e.g., in their profile, or in the context of the post) and the historical target of the term.
          - Look for contextual cues: is the post celebratory, empowering, or critical of the slur? Is it directed at an in-group audience?
     - If the speaker is a member of the targeted group and the use is non-derogatory (reclaimed), then allow the post. End procedure.
     - If the speaker is not a member of the targeted group, proceed to Step 4.
     - If the speaker's group membership is unclear or contested, or if the context is ambiguous (e.g., is it reclamation or internalized oppression?), escalate to policy specialist.

  Step 4: Determine if the use is derogatory.
     - Question: In the context, is the term being used to demean, insult, or denigrate an individual or group?
     - Satisfactory answer: Consider:
          - The tone: is it hateful, mocking, or contemptuous?
          - The intent: does the speaker seem to be expressing prejudice?
          - The effect: is the utterance likely to cause harm by reinforcing oppression?
     - If derogatory, remove the post. End procedure.
     - If not derogatory (e.g., educational, neutral, or positive), allow the post. End procedure.
     - If unclear, escalate to policy specialist.

  Step 5: (For non-listed patterns) Evaluate the pattern for derogatory force.
     - This step is only reached for "suspected non-listed slur" from Step 1 (since if a blocklisted string was present, we followed the path through steps 2-4).
     - Question: Does the pattern (e.g., "those people", "certain groups") function in this context as a slur? That is, does it convey derogation comparable to a slur?
     - Satisfactory answer: Look at the context:
          - Is the pattern being used to refer to a marginalized group in a way that dehumanizes or stereotypes?
          - Is the pattern part of a known dog whistle or hate speech pattern?
          - What is the intent and effect? (e.g., is it part of a hateful rant?)
     - If it functions as a slur (derogatory), remove the post. End procedure.
     - If not, allow the post. End procedure.
     - If unclear, escalate to policy specialist.

  Now, we run the procedure on three cases:

  Case 1: A member of the targeted group using a reclaimed slur in a celebratory in-group post.
     - Step 1: Blocklisted string present -> proceed to Step 2.
     - Step 2: Term is used (not mentioned) -> proceed to Step 3.
     - Step 3: Speaker is a member of the targeted group and the use is celebratory (reclaimed) -> allow. End.

  Case 2: A news organization quoting a government official's use of a slur.
     - Step 1: Blocklisted string present -> proceed to Step 2.
     - Step 2: The term is in a quote (mentioned) and the news organization is reporting without endorsement -> allow. End.

  Case 3: A post that never uses a listed slur but calls a marginalized group "those people" in a way that clearly does the work of a slur.
     - Step 1: No blocklisted string, but "those people" in a derogatory context -> mark as "suspected non-listed slur" and proceed to Step 5.
     - Step 5: In context, the phrase is used to dehumanize and marginalize (e.g., "We can't let those people into our neighborhood") -> remove. End.

  However, note that Case 3 might be controversial because the phrase "those people" is not inherently a slur. The decision hinges on context. The policy team might not like that we are removing a post that doesn't use a blocklisted term, but the procedure is designed to catch such cases.

  One of the cases that the policy team might not like: 
     - Consider a case where a non-member uses a reclaimed term in a positive context (e.g., an ally trying to show solidarity). 
     - Example: A white person uses a reclaimed slur for Black people in a post supporting Black Lives Matter, intending to be supportive.

  Run this case (Case 4) through the procedure:

  Case 4: A non-member using a reclaimed slur in a positive context.
     - Step 1: Blocklisted string present -> proceed to Step 2.
     - Step 2: Not a quote (used) -> Step 3.
     - Step 3: Speaker is not a member of the targeted group -> proceed to Step 4.
     - Step 4: Is the use derogatory? The intent is positive, but the effect might be harmful because reclamation is often group-specific. Even if the intent is good, the use by an outsider can be offensive and harmful. 
          - Judgment: It is likely derogatory because the speaker does not have the standing to reclaim the term. So the use might be seen as demeaning even if intended otherwise. 
          - Remove the post.

  The policy team might not like this because the intent was positive, but the procedure would remove it. We must be explicit: the procedure in Step 3 only allows reclamation by in-group members. Outsiders using the term, even positively, are not covered by reclamation and are likely to cause harm.

  Where the company's values are doing the work:
     - Step 3 (reclamation) and Step 4 (derogation) require judgments about group membership and intent/effect. These are value-laden. The company must decide:
          - How to define group membership (self-identification? external categorization?).
          - How much weight to give to reclamation and in-group use.
          - The balance between intent and effect in derogation.
     - Step 5 (non-listed patterns) relies on the company's stance on dog whistles and contextual harm.

  Cases the procedure will get wrong:
     1. Irony and sarcasm: A post using a slur ironically to criticize its use. The procedure might miss the nuance and either allow (if taken at face value) or remove (if the irony is not detected).
     2. Ambiguous group membership: When it's unclear if the speaker is part of the targeted group (e.g., someone with a mixed background, or passing). We escalate, but the specialist might still get it wrong.
     3. Evolving language: New slurs or reclaimed terms that aren't yet on the radar.
     4. Cross-cultural differences: A term that is reclaimed in one community but not in another, used in a cross-community context.

  The procedure is a best effort, but it must be paired with training, escalation paths, and periodic review.
answer: |-
  Below is a reusable decision procedure for moderating slurs, grounded in the philosophy of language. It prioritizes **pragmatic context** over lexical presence, distinguishes between **derogation** (harmful dehumanization) and **offense** (hurt feelings), and integrates **reclamation**, **use/mention**, and **speaker identity**. The procedure is designed for non-linguist moderators: it uses binary questions, focuses on observable context, and escalates ambiguities to policy specialists. Steps requiring value judgments (where company values shape outcomes) are explicitly flagged.

  ---

  ### **Slur Moderation Decision Procedure**  
  *Key Principles*:  
  - **Derogation** is the core harm: language that denies a group's humanity or equality.  
  - **Reclamation** requires in-group membership + non-derogatory intent.  
  - **Use vs. Mention**: Mentioning a slur (e.g., quoting) ≠ using it derogatorily.  
  - **Escalation Threshold**: Escalate when context is ambiguous or identity/reclamation is contested.

  ---

  #### **Step 1: Is a Blocklisted String or Pattern Present?**  
  - **Question**: Does the post contain:  
    a) A literal string from the slur blocklist? OR  
    b) A pattern (e.g., euphemism, dog whistle) that systematically targets a group?  
  - **Satisfactory Answer**:  
    - *Yes*: If (a) is true, proceed to Step 2. If (b) is true, skip to Step 5.  
    - *No*: **No action**. The post is not a slur violation.  
  - **Escalation?** No. This step is lexical scanning.  

  #### **Step 2: Is the Term Mentioned (Quoted) or Used?**  
  - **Question**: Is the slur being *quoted/reported* (e.g., news, education, critique) without endorsement?  
  - **Satisfactory Answer**:  
    - *Yes* (mention): If the speaker attributes the term (e.g., "The official said [slur]"), uses scare quotes, or frames it critically (e.g., "This word is harmful"), **allow the post**. End.  
    - *No* (use): Proceed to Step 3.  
  - **Escalation?** Escalate if attribution is ambiguous (e.g., ironic quoting).  

  #### **Step 3: Is the Speaker Reclaiming the Term?**  
  - **Question**: Is the speaker a member of the group historically targeted by the slur, and is the use non-derogatory?  
  - **Satisfactory Answer**:  
    - *Yes*: If speaker identity is clear (e.g., self-identification in profile/post) AND context is celebratory/neutral (e.g., "We’re proud [slur]!"), **allow the post**. End.  
    - *No*: Proceed to Step 4.  
  - **Escalation?** Escalate if identity is unverified or context is ambiguous (e.g., "reclaimed" usage in mixed-audience spaces).  
  - **Value Judgment**: *Company values define what counts as "clear" identity verification and "safe" reclamation contexts (e.g., is self-identification sufficient? Are public posts "in-group"?).*  

  #### **Step 4: Is the Use Derogatory?**  
  - **Question**: Does the term *pragmatically function* to demean, dehumanize, or subordinate a group?  
  - **Satisfactory Answer**:  
    - *Yes*: If the term is weaponized (e.g., insult, threat, othering), **remove the post**. End.  
    - *No*: **Allow the post**. End.  
  - **Escalation?** Escalate if intent/effect is unclear (e.g., ambiguous humor).  
  - **Value Judgment**: *Company values determine the weight given to "intent vs. effect" (e.g., is accidental harm removal-worthy?).*  

  #### **Step 5: Is the Non-Listed Pattern Derogatory?**  
  - **Question**: Does the pattern (e.g., "those people," "certain groups") function identically to a slur in *this context*?  
  - **Satisfactory Answer**:  
    - *Yes*: If it systematically stereotypes, dehumanizes, or incites harm (e.g., "Keep [group] out—*those people* ruin everything"), **remove the post**. End.  
    - *No*: **No action**.  
  - **Escalation?** Escalate if harm is debatable (e.g., political rhetoric).  
  - **Value Judgment**: *Company values define what "systematic harm" means (e.g., is one post enough? Does targeting "immigrants" count as targeting a protected group?).*  

  ---

  ### **Case Studies**  
  #### **Case 1: Member of Targeted Group Using Reclaimed Slur Celebratorily**  
  - *Post*: A user with a self-identified LGBTQ+ profile posts: "Happy Pride to my fellow [reclaimed queer slur]! 🏳️‍🌈"  
  - **Procedure**:  
    - Step 1: Blocklisted string present → Step 2.  
    - Step 2: Term is *used* (not quoted) → Step 3.  
    - Step 3: Speaker is in-group + celebratory → **Allow**.  
  - **Result**: Allowed. *Policy team will approve—reclamation is respected.*  

  #### **Case 2: News Organization Quoting Government Official’s Slur**  
  - *Post*: "Mayor Smith stated: '[Slur] must be deported.' We condemn this language."  
  - **Procedure**:  
    - Step 1: Blocklisted string present → Step 2.  
    - Step 2: Term is *mentioned* (attributed + condemned) → **Allow**.  
  - **Result**: Allowed. *Policy team will approve—mention is non-derogatory.*  

  #### **Case 3: Non-Listed Term Used as a Slur ("Those People")**  
  - *Post*: "We must ban [marginalized group] from schools—*those people* are a danger to our kids."  
  - **Procedure**:  
    - Step 1: No blocklisted string, but "those people" targets a group → Proceed to Step 5.  
    - Step 5: Pattern is derogatory (dehumanizes group + mirrors slur function) → **Remove**.  
  - **Result**: Removed. **Policy team will NOT like this** because it:  
    - Overrides the blocklist, creating subjectivity.  
    - Risks false positives (e.g., "those people" could be neutral).  
    - *But it addresses under-removal by catching dog whistles.*  

  ---

  ### **Explicit Limitations**  
  1. **Value Judgments in Disguise**:  
     - Step 3 (reclamation) assumes the company prioritizes **in-group autonomy** over universal prohibition.  
     - Step 5 (non-listed patterns) assumes **harm reduction justifies context-based judgments**, potentially chilling vague speech.  

  2. **Unavoidable Errors**:  
     - **Sarcasm/Irony**: E.g., a bigot using reclaimed terms "mockingly." Moderators may miss pragmatic cues.  
     - **Ambiguous Reclamation**: E.g., a biracial user using a slur for one identity group—membership may be contested.  
     - **Evolving Language**: New slurs or reclaimed terms may lag behind policy updates.  
     - **Cross-Cultural Context**: A term reclaimed in one dialect (e.g., AAVE) may not be in another.  

  3. **Procedural Gaps**:  
     - **Offense vs. Derogation**: A non-derogatory post may offend (e.g., academic use). The procedure ignores pure offense.  
     - **Scale vs. Accuracy**: High-velocity moderation favors observable cues (e.g., self-ID in profile) over deeper research.  

  ---  
  **Final Recommendation**: Pair this procedure with:  
  - **Training**: Drills on pragmatic cues (e.g., tone, framing) and identity verification.  
  - **Escalation Flow**: 10–20% of cases routed to specialists.  
  - **Review**: Biweekly audits of escalated cases to refine thresholds.  
  This system reduces over-removal of reclaiming/quoting while targeting under-removal of euphemisms—but it *requires* accepting contextual judgments.
