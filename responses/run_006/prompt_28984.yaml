answer: |-
  Here is a rigorously structured set of desiderata for an adequate theory of causation by omission, grounded in canonical cases, with meta-theoretical analysis of constraints, tensions, and exclusions.

  ---

  ### **Core Desiderata & Their Grounding in Canonical Cases**

  1.  **Counterfactual Dependence Requirement**  
      *   **What it must deliver:** The effect must counterfactually depend on the omission. That is, had the omitted action occurred (holding relevant background conditions fixed), the effect would not have occurred.  
      *   **Why:** Captures the intuition that omissions *make a difference*.  
      *   **Canonical Case:** *The Gardener*. Plant dies because the gardener failed to water it. Demand: The theory must entail that had the gardener watered the plant, it would not have have died (assuming no other causes of death).  
      *   **Status:** **Non-negotiable**. Foundational for any counterfactual or difference-making account. Without this, the omission isn't causally relevant.

  2.  **Normative Sensitivity Requirement**  
      *   **What it must deliver:** The theory must explain why omissions are causally attributed primarily to agents with a *duty, capacity, or expectation* to act, not just to anyone whose action *could* have prevented the outcome.  
      *   **Why:** Reflects how causal judgments track moral/legal responsibility and social roles.  
      *   **Canonical Case:** *The Bystander*. A drowning victim dies; a nearby strong swimmer does nothing. Demand: The theory must distinguish why the bystander's omission is causal (if they had a duty/capacity), but not the omission of a distant stranger or an inanimate object (e.g., "the absence of a lifeboat").  
      *   **Status:** **Non-negotiable** for descriptive adequacy. However, *how* it's implemented (metaphysical vs. pragmatic) is contested.

  3.  **Intentionality/Role Sensitivity Requirement**  
      *   **What it must deliver:** The theory must accommodate that omissions can be intentional or unintentional, and that the *role* of the agent matters for causal (and moral) salience.  
      *   **Why:** Distinguishes culpable negligence (intentional withholding) from mere accidents, and explains professional responsibility.  
      *   **Canonical Case:** *The Physician*. A patient dies because a physician intentionally withholds known-effective treatment. Demand: The theory must explain why the physician's omission is causal, while the identical inaction by a random passerby (lacking medical knowledge/duty) may not be, even if their action *could* have saved the patient.  
      *   **Status:** **Non-negotiable** for full explanatory scope. Tightly linked to Normative Sensitivity.

  4.  **Preemption/Redundancy Handling Requirement**  
      *   **What it must deliver:** The theory must correctly handle cases where multiple potential preventers exist, and whether the omission was necessary given other actors or background conditions.  
      *   **Why:** Avoids over-attribution of causation.  
      *   **Canonical Case:** *The Would-Be Rescuer*. A drowning victim is saved by Lifeguard A. Lifeguard B, also on duty and ready, holds back upon seeing A act. Demand: The theory must *not* count Lifeguard B's omission as a cause of the victim *not drowning*, because A's action was sufficient. B's omission is redundant.  
      *   **Status:** **Non-negotiable** for logical consistency and avoiding absurdity (e.g., everything that didn't prevent an outcome causing it).

  5.  **Distinction from Background Conditions**  
      *   **What it must deliver:** The theory must differentiate salient omissions (treated as causes) from the infinite background absences that are counterfactually necessary but causally irrelevant (e.g., the absence of a meteor strike).  
      *   **Why:** Prevents causal inflation.  
      *   **Implicit in Cases:** All cases presuppose this distinction. The Gardener's omission is salient; the absence of rain or the Queen of England watering it is not.  
      *   **Status:** **Non-negotiable**. A theory failing this is useless.

  ---

  ### **Adjudicating Contested Constraints**

  *   **"Omissions are absences rather than events":**  
      *   **Status:** **Camp-Specific** (Primarily *Metaphysical Conservative/Quinean* camp).  
      *   **Why:** Essential for theories prioritizing ontological parsimony or event-based causation (e.g., David Lewis). However, *process* or *dispositional* theories (e.g., Phil Dowe, Stephen Mumford) may treat omissions as genuine causal relata (e.g., as "preventers" or absences of dispositions). Descriptive adequacy doesn't strictly require this ontology.

  *   **"Preserve the Allowing/Doing Distinction":**  
      *   **Status:** **Genuine Constraint** (but interpretation varies).  
      *   **Why:** Intuitions strongly distinguish actively causing harm (pushing) from passively allowing it (failing to pull away a victim). Cases like the Physician involve "allowing to die" vs. "killing." A theory collapsing this risks losing important moral/conceptual distinctions.  
      *   **Caveat:** The *metaphysical basis* for the distinction is debated (e.g., is it counterfactual, dispositional, or fundamentally normative?).

  *   **"Explain tight link to norms/expectations":**  
      *   **Status:** **Genuine Constraint** for descriptive/pragmatic adequacy.  
      *   **Why:** As seen in Bystander/Physician cases, causal judgments *are* tightly coupled with normative expectations. A purely metaphysical theory ignoring this is descriptively inadequate.  
      *   **Caveat:** *How* norms enter is contested: Are they constitutive of causation by omission, or merely diagnostic heuristics?

  *   **"Baseline not fixed solely by interests":**  
      **Status:** **Genuine Constraint** (Non-negotiable for Objectivity).  
      *   **Why:** If the baseline for "normal" or "expected" action (defining the omission) is *purely* subjective/interest-relative, causation becomes radically contextual and loses objectivity. The Gardener case relies on an *objective* duty/agreement, not fleeting interests.  
      *   **Caveat:** Norms *influence* the baseline, but the constraint demands they aren't the *sole* arbiters. There must be some anchor (e.g., capacities, roles, natural tendencies).

  ---

  ### **Tensions & Potential Incompatibilities**

  1.  **Norm-Free Metaphysics vs. Norm-Tracking Judgments (Your Suspicions Confirmed):**  
      *   **The Tension:** A purely descriptive, interest-independent metaphysics of omissions (e.g., treating them as absences of necessary conditions) struggles mightily to distinguish salient omissions (Gardener, Physician) from irrelevant absences (distant stranger, absence of meteor). Norms seem indispensable for this distinction. Conversely, a theory making norms *constitutive* of causation (e.g., some responsibility-first accounts) risks losing objectivity and conflating causation with blame.
      *   **Why they might pull apart:** Metaphysics seeks mind-independent truth; causal judgment about omissions is demonstrably sensitive to mind-dependent norms/expectations. Bridging this gap requires either (a) reducing norms to non-normative features (e.g., statistical regularities, biological functions – difficult), (b) showing norms track objective features (e.g., roles as part of causal structures), or (c) adopting a pragmatist view where causal *selection* is normative, but causation *itself* is not.
      *   **Can they be jointly met?** Extremely challenging. Hybrid views are attempted (e.g., Christopher Hitchcock: norms fix "defaults" within counterfactual analysis), but often sacrifice pure objectivity or full normative explanation. Genuine incompatibility looms if one insists on *both* a fully non-normative metaphysics *and* capturing the norm-sensitivity without residue.

  2.  **Absences as Causes vs. Causal Inflation:**  
      *   **The Tension:** Treating absences as genuine causes (violating "Omissions are absences" constraint) risks making causation ubiquitous (every absence of a preventer causes every event). Strict adherence to "omissions are absences" avoids inflation but makes causation by omission metaphysically mysterious or derivative.
      *   **Resolution Attempts:** Contextual restriction (Schaffer), "quasi-influence" (Beebee), or denying genuine causation while preserving explanatory relevance (Dowe). None are universally satisfying.

  ---

  ### **The Most Exclusionary Requirement**

  *   **The Baseline Independence Requirement ("Baseline not fixed solely by interests")** does the most work excluding candidate theories.
  *   **Why:**
      *   **Pure Counterfactual Theories (Lewis-style):** Often fail here. They define omission causation via counterfactuals like "If X had acted, Y wouldn't have happened". But *which* X's actions are considered? This selection is inherently interest-relative. Why the Gardener and not the Queen? Lewis's appeal to "comparative overall similarity" is notoriously vulnerable to contextual shifts based on interests/norms.
      *   **Strongly Normative Theories:** Fail by *making* the baseline solely normative, violating objectivity. If causation just *is* the violation of a norm, it loses its mind-independent anchor.
      *   **Process Theories:** Often exclude omissions *by definition* (no physical connection/process), failing to account for them at all, thus excluded by the *existence* of the phenomenon.
  *   **Theories it Favors:** Those attempting to anchor the baseline in objective features: agent *capacities* (Moore), *duties* grounded in roles/functions (perhaps legal or biological), or *statistical normalcy* (though the latter risks collapsing into interest-relativity). These solutions are often complex and contested.

  ---

  ### **Fragility & Potential Mind-Changers**

  *   **Where Reasoning is Most Fragile:** The relationship between **Normative Sensitivity** and **Baseline Independence**. The argument that norms can track *objective* features (roles, capacities, functions) without being *solely* interest-relative is precarious. If compelling evidence emerged that our omission attributions are *radically* contextual and interest-driven with *no* stable objective anchors – or conversely, that stable objective anchors for "expected action" exist independently of *any* normative framework (e.g., in complex systems biology or physics) – this would fundamentally reshape the list.
  *   **Most Likely Mind-Changer:** **Empirical Work on Causal Cognition.** If rigorous experiments showed:
      1.  People reliably attribute omission causation *without* any normative cues (e.g., in purely mechanical systems or amoral scenarios), this would weaken the **Normative Sensitivity** requirement's non-negotiable status.
      2.  Conversely, if norm manipulation *completely* overrides other factors (capacity, spatiotemporal proximity) in omission judgments, it would strengthen the case for making norms constitutive and potentially force a concession on **Baseline Independence** as a purely metaphysical (not descriptive) constraint.
      3.  Evidence that the allowing/doing distinction is *not* fundamental in causal cognition (e.g., people conflate them under certain descriptions) would weaken that constraint.

  ---

  ### **Summary Table of Desiderata Status**

  | Desideratum                          | Status               | Why                                                                 |
  | :----------------------------------- | :------------------- | :------------------------------------------------------------------ |
  | Counterfactual Dependence            | **Non-Negotiable**   | Core to difference-making; defines causal relevance.                |
  | Normative Sensitivity                | **Non-Negotiable**   | Required for descriptive adequacy (Bystander/Physician cases).      |
  | Intentionality/Role Sensitivity      | **Non-Negotiable**   | Needed for culpability/role-based cases (Physician).                |
  | Preemption/Redundancy Handling       | **Non-Negotiable**   | Avoids absurd over-attribution (Would-Be Rescuer).                  |
  | Distinction from Background Absences | **Non-Negotiable**   | Prevents causal inflation (implied in all cases).                   |
  | Omissions as Absences (Ontology)     | **Camp-Specific**    | Driven by metaphysical commitments, not descriptive necessity.      |
  | Preserve Allowing/Doing Distinction  | **Genuine Constraint** | Reflects strong intuitions; linked to moral distinctions.           |
  | Explain Norm-Tracking                | **Genuine Constraint** | Necessary for descriptive adequacy.                                 |
  | Baseline Independence (Objectivity)  | **Genuine Constraint** | Safeguards against radical subjectivity; seeks objective truth.     |

  This framework equips you to systematically evaluate omission theories, pinpointing where they succeed, fail, and what compromises they make. The core tension between descriptive norm-tracking and metaphysical objectivity remains the central battleground.
