answer: |-
  ## Essay Question

  **Defend or critique the following claim: "Hypocritical blame, while lacking standing, can still serve a valuable communicative function in moral relationships." In your answer, address the following core issues:  
  (1) Is the primary determinant of standing to blame located in the *blamer's own moral record* or in the *nature of the relationship* between the blamer and the blamed?  
  (2) Even if hypocritical blame lacks standing, does it retain the capacity to communicate morally significant truths or demands? Explain why or why not, using specific arguments from the course readings (e.g., Wallace, Bell, Fritz) and your own reasoning.  
  (3) What are the implications of your position for the permissibility and effectiveness of moral criticism within ongoing relationships marked by mutual imperfections?**

  ## Model Answer

  **(Defending the Claim - Arguing for Communicative Value Despite Lack of Standing)**

  The claim that hypocritical blame can lack standing yet retain communicative value captures a crucial tension in our moral practices. While I find Wallace’s relational account of standing most persuasive for explaining the *deficiency* in hypocritical blame, I argue that Bell and Fritz point towards ways such blame can still serve a vital, albeit compromised, communicative function. Standing is fundamentally relational, but communication can persist even when standing is compromised.

  **(1) Standing: Primarily Relational, Not Merely Record-Based.** The intuition that hypocrites lack standing stems from a sense of unfairness, but locating this solely in the blamer’s moral record (e.g., Wallace’s early "tit-for-tat" view, or a simplistic Cohen-inspired view) is insufficient. If standing were purely about a clean record, a reformed wrongdoer or a stranger with no history of the fault could always blame. Yet, a stranger often lacks the *authority* to blame effectively within a specific relationship, and a reformed wrongdoer might regain some standing through genuine change. Wallace’s mature view, grounding standing in participating in the shared "normative expectations" constitutive of a relationship, is more compelling. When one blames hypocritically, one violates the reciprocity inherent in those shared expectations (Wallace, "Hypocrisy, Moral Address, and the Equal Standing of Persons"). One implicitly exempts oneself from the very norms one invokes against the other, undermining the mutual accountability that gives the blamer the *right* to hold the other accountable in *this specific relationship*. This relational failure explains why the blame feels illegitimate *even if the substantive moral judgment is correct*. Bell’s critique ("The Standing to Blame: A Critique") reinforces this by arguing hypocrisy involves a failure of recognition – the hypocrite fails to see the blamed as an equal entitled to hold *them* accountable, undermining the reciprocal recognition necessary for standing.

  **(2) Communicative Value Despite Lack of Standing.** Lacking standing means the hypocrite forfeits the *authority* to demand a response grounded in that specific relational reciprocity. However, this does not render the act of blaming devoid of *all* communicative power concerning the *substantive moral issue*. Bell’s claim that hypocritical blame "silences" the blamed is powerful but potentially overstates the case in less severe instances. While the hypocrite’s inconsistency can rightly provoke resentment and block the blamed from accepting the *demand* as legitimately issued *by this person*, the *content* of the blame – "Your action X was wrong because it violated norm Y" – still conveys a moral truth. The blamed person might reject the hypocrite’s *right* to blame them but still recognize the *validity* of the norm invoked and the *fact* that their action violated it. Fritz ("Hypocrisy and the Standing to Blame") offers a crucial insight here: hypocritical blame can still signal the *blamer’s* commitment to the norm (however inconsistently acted upon) and their *recognition* that the norm applies to the interaction. This signals that the norm is still part of the shared (if imperfectly upheld) moral framework of the relationship. In the case of flaking on plans (as per the motivating example), the hypocritical blamer communicates: "We *both* recognize that reliability matters in our friendship; your failure violated that shared value, and I (however inconsistently) affirm its importance." This isn't ideal communication – it’s undermined by the hypocrisy – but it’s not *nothing*. It keeps the norm salient within the relationship.

  **(3) Implications for Relationships.** Accepting this communicative value has significant, nuanced implications. It suggests that in ongoing relationships characterized by mutual imperfection (like friendships or collegial settings), suppressing *all* moral criticism simply because one isn't flawless is counterproductive. It risks letting shared norms erode entirely because no one feels *fully* entitled to speak up. While hypocritical blame is defective and often counterproductive (likely provoking defensiveness), its communicative residue – the affirmation of the norm – can sometimes serve as a catalyst for mutual reflection or dialogue that a silent adherence to a strict "clean hands" requirement might prevent. However, this does *not* make hypocritical blame generally permissible or effective. Its effectiveness is severely hampered by the resentment it justly provokes. The path to *restoring* standing and enabling *effective* communication lies in the hypocrite acknowledging their inconsistency (Fritz), demonstrating commitment to change, and re-establishing reciprocity (Wallace). The best practice is to preface criticism with acknowledgement of one's own failings ("I know I do this too, which is why I know how frustrating it is...") or to frame it as a shared problem ("We both struggle with this, but when you flaked, it really hurt because...").

  **Confidence & Uncertainty:** I am reasonably confident (around 80%) in this position that hypocritical blame *can* retain *some* communicative value regarding the norm itself, even while lacking the standing for effective moral address. The strongest support comes from Fritz's analysis of signaling and the intuitive point that the substantive moral claim doesn't vanish because the messenger is flawed. **The point I am least sure about** is the *scope* of this communicative value, particularly concerning **grave moral wrongs**. Does hypocritical blame about serious harm (e.g., infidelity, betrayal) retain *any* positive communicative value, or is it entirely consumed by the silencing effect and profound unfairness Bell describes? I lean towards Bell's silencing being more dominant in severe cases, but this requires more nuanced exploration than this answer allows.

  ---

  ## Marking Scheme (Total: 20 marks)

  *   **Each criterion is worth 4 marks. Award marks based on the clarity, accuracy, depth, and use of evidence in addressing the point. Deduct marks for vagueness, misunderstanding, omission of key aspects, or lack of textual support where expected.**

  1.  **Understanding Standing Theories (4 marks):** Clearly distinguishes between "moral record" (e.g., Wallace's early view, tit-for-tat) and "relational" (e.g., Wallace's normative expectations, Bell's reciprocal recognition) accounts of standing to blame, accurately explaining the core argument for the relational view as primary. *Guards Against:* Conflating the two approaches or treating standing purely as synonymous with the blamer's moral goodness/permissibility of their own actions; failing to articulate *why* the relational view explains the intuition against hypocrisy better than a pure record view.
  2.  **Analysis of Hypocrisy's Defect (4 marks):** Accurately explains *why* hypocritical blame lacks standing according to the preferred relational account (e.g., violation of reciprocity, failure of recognition, undermining mutual accountability), using specific concepts from Wallace or Bell. *Guards Against:* Merely stating hypocrisy invalidates blame without explaining *how* it relates to standing; reverting to a simplistic "clean hands" requirement without the relational grounding; misrepresenting Bell's silencing argument as the *only* reason for lack of standing.
  3.  **Argument for Communicative Value (4 marks):** Develops a clear, reasoned argument explaining *how* hypocritical blame could convey morally significant information (e.g., affirmation of the norm, signaling commitment, keeping norm salient) *despite* lacking standing, drawing effectively on Fritz or the logic inherent in the claim. Explains the *limitations* of this communication (e.g., doesn't restore standing, likely provokes resentment). *Guards Against:* Simply asserting it communicates without explanation; conflating communicative value with the restoration of standing or permissibility; ignoring Fritz's relevant contributions; failing to acknowledge the significant limitations of this communication.
  4.  **Relational Implications & Nuance (4 marks):** Discusses the practical implications of the position (for or against the claim) for moral criticism within imperfect relationships. If defending communicative value, addresses how it interacts with the need for acknowledgement/reform (Fritz/Wallace) and distinguishes it from endorsing hypocrisy. If critiquing, addresses the potential negative consequence of suppressing all criticism. *Guards Against:* Drawing overly simplistic conclusions (e.g., "Therefore hypocrisy is fine" or "Therefore we must never criticize if imperfect"); ignoring the practical dynamics of real relationships; failing to connect the theoretical position back to the lived tension described in the question's motivation.
  5.  **Use of Sources & Critical Engagement (4 marks):** Effectively and accurately employs relevant arguments and concepts from the assigned readings (Cohen, Wallace, Bell, Fritz) to support the analysis throughout, demonstrating understanding beyond summary. Engages critically with the texts (e.g., agrees/disagrees, points out limitations, synthesizes views). *Guards Against:* Merely summarizing readings without applying them to the specific question; misrepresenting authors' positions; name-dropping without substantive integration; ignoring key relevant authors (especially Fritz in the context of communication).
