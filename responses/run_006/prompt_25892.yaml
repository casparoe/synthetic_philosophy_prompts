answer: |-
  ### Analysis of Militant Suffragettes through Theories of Political Obligation

  **Salient Facts:**
  - **Exclusion:** Women (despite meeting property/education qualifications required for male voters) were denied parliamentary suffrage. They were taxed, subject to laws, and governed without representation.
  - **Law-breaking:** Tactics escalated from civil disobedience (heckling politicians) to property destruction (window-smashing, arson attacks on unoccupied buildings) and symbolic attacks (e.g., slashing paintings). Hunger strikes were used as protest within prisons.
  - **State Response:** Mass arrests, harsh prison sentences. Force-feeding of hunger strikers (a brutal and medically dangerous procedure). The 1913 "Cat and Mouse Act" (Prisoners (Temporary Discharge for Ill Health) Act) allowed the release of weakened hunger strikers only to re-arrest them upon recovery, circumventing martyrdom.

  **Analysis through Theories of Political Obligation:**

  1.  **Actual Consent Theory:**
      *   **Description:** Political obligation arises only from explicit, voluntary consent (e.g., oath, contract) given by the individual.
      *   **Verdict:** **Theory Silent.** Suffragettes never gave explicit consent to be governed. The state actively denied them the primary mechanism (voting) through which tacit consent is often argued to be given. The theory has no resources to explain the obligations of those systematically barred from the consent-giving process. It cannot generate an obligation for the excluded.
      *   **Strain:** It ignores the reality of birth into a political community and offers no guidance for those denied the means to consent or dissent meaningfully. It renders the suffragettes effectively stateless in terms of obligation, which clashes with the state's clear assertion of authority over them.

  2.  **Fair-Play Theory:**
      *   **Description:** Obligation arises from receiving benefits from a cooperative scheme (the state); fairness requires accepting the burdens (obeying laws) in return.
      *   **Verdict:** **Obligation Defeated.** While suffragettes received *some* state benefits (e.g., security, infrastructure), they were *excluded* from the defining cooperative activity of the political scheme: participation in self-government. They bore burdens (taxation, law-following) without receiving the fundamental benefit of political agency. Fairness did not require them to accept the burdens of a scheme that denied them equal standing.
      *   **Strain:** It assumes a genuinely cooperative and inclusive scheme. The Edwardian state was a cooperative scheme *for men*; women were governed subjects, not full participants. The theory struggles when the scheme itself is structured to exclude a group from its core cooperative activity, making the benefit/burden calculus inherently unequal.

  3.  **Natural Duty / Justice-Based Theory:**
      *   **Description:** There is a fundamental moral duty to support and comply with just institutions that secure basic rights and justice.
      *   **Verdict:** **Obligation Defeated (Conditionally).** The Edwardian state, while providing order and some public goods, was fundamentally unjust in its denial of political equality and self-determination to women. A natural duty to support *just* institutions cannot bind citizens to uphold an institution perpetuating a core injustice against them. "Support" cannot require passive acceptance of one's own disenfranchisement; it may even *require* resistance to reform the institution towards justice.
      *   **Strain:** Determining the threshold of "just enough" is difficult. While the state wasn't a total tyranny, the specific, remediable injustice of political exclusion directly violated the suffragettes' fundamental moral equality. The theory must grapple with *how* to support unjust institutions – blind obedience clearly fails, but what forms of resistance are proportionate? The suffragettes' tactics test the boundaries.

  **What the Episode Reveals about the Theories:**

  1.  **The Gap of Political Exclusion:** All three theories struggle significantly with the core problem: **a class of people who are fully inside the legal order (subject to laws, taxation, punishment) but systematically excluded from the political order (denied suffrage, representation, voice in law-making).** Standard theories often implicitly assume either universal inclusion or focus on obligations within an accepted framework, obscuring this specific form of injustice.
  2.  **Conditionality on Inclusion:** The suffragettes' actions strongly suggest that political obligation is **conditional upon a minimum threshold of inclusion and recognition within the political community.** Theories like Fair-Play and Natural Duty, when properly applied, reveal this – obligations dissolve when the state fundamentally fails to recognize the equal standing of a group. However, this conditionality is often underdeveloped within the theories themselves.
  3.  **Justification for Disobedience:** While elements of the Fair-Play and Natural Duty theories (highlighting exclusion and injustice) can *explain* why the obligation is defeated, they do not inherently *justify* the *specific tactics* of resistance (like arson). Justifying proactive resistance to secure inclusion likely requires a **supplementary principle: a right to resist political exclusion and demand recognition of fundamental equality.** This right stems from basic moral personhood rather than the state-centric frameworks of the standard theories. The theories diagnose the *absence* of obligation but don't fully supply the positive justification for resistance; they leave a normative gap filled by appeals to natural rights or democratic principle.

