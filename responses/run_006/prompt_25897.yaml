  If it were verbal, they'd just be using different words for the same thing. But they seem to have deeper disagreements. For example, circulatory-respiratory proponents argue a body with a beating heart isn't a corpse. Brain-based supporters focus on consciousness and integration. So the concept of death itself is contested. That points to a framework disagreement.

  The user mentioned practical considerations like organ transplants and resource allocation. These practical stakes might be influencing the debate. Each framework has different implications. For example, brain-based criteria facilitate organ donation by allowing procurement before circulatory stops. But circulatory proponents see this as taking organs from living bodies. 

  Also, cultural and philosophical views matter. Personhood versus biological life. If death is tied to personhood, losing consciousness permanently might be sufficient. But if it's about the organism, then total biological cessation is needed. These are foundational differences.

  So the diagnosis is likely a framework clash with normative dimensions. The disagreement is about which values to prioritize: consciousness and cognition versus biological integration. Practical interests like organ donation add pressure, making compromise harder.

