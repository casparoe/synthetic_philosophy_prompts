  **How to Score:**
  1.  Tally the points for each position (RA, MA, E, I, BC) based on the student's answers.
  2.  The position with the **highest total score** is their primary tendency.
  3.  **Tiebreakers/Strong Tendencies:** Look for consistency:
      *   Consistent **B** answers strongly suggest **RA**.
      *   Consistent **B** answers *except* where moral flaw directly impacts the work's coherence (e.g., 3B, 5D) suggest **MA**.
      *   Consistent **A** answers suggest **E**.
      *   Consistent **C** answers suggest **I**.
      *   Consistent **D** answers suggest **BC**.

  **Design Notes for the Professor:**

  *   **Covert Sorting:** Answer options focus on concrete judgments ("undermines," "stands alone," "enhances," "essential to understanding") rather than philosophical jargon.
  *   **Case Realism:** Cases mix historical (fascist film), contemporary (Weinstein, environmental harm), and timeless examples (artist cruelty, problematic jokes, deceptive photography).
  *   **Forced Choices:** Options present genuine tensions (e.g., beauty vs. harm, power vs. ethics, formal skill vs. context).
  *   **Nuanced Scoring:** Most answers contribute to 1-2 positions, requiring pattern recognition. Overlap reflects real philosophical complexity (e.g., an "A" answer often appeals to both Ethicists *and* Biographical Contextualists, but Ethicists will choose "A" more consistently).
  *   **Position Coverage:** Cases probe key distinctions:
      *   Artist's biography vs. work's content (Q2, Q4, Q8).
      *   Moral flaw *in* the work vs. external to it (Q1, Q3, Q5, Q6, Q7).
      *   Immorality as flaw, irrelevant, or merit (All cases).
  *   **Clarity:** Instructions and options use straightforward American English.

  This quiz will spark immediate discussion and give you a clear map of where your students' intuitions lie before diving into the theoretical frameworks. Good luck with the grading!
