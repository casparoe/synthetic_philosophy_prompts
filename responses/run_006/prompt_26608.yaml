answer: |-
  Below is a sidebar quiz designed to sort readers into major schools of anthropic reasoning based on their intuitive judgments about puzzle cases. The quiz features eight questions, each presenting a scenario without naming the philosophical puzzle or position. Answers are mapped to positions including the Self-Sampling Assumption (SSA), Self-Indication Assumption (SIA), and the Ordinary Bayesian view (denying special anthropic principles). The scoring key provides memorable names, descriptions, and uncomfortable commitments for each result. Pairs that cannot be reliably separated are flagged.

  ---

  ### Quiz: Which School of Anthropic Reasoning Do You Actually Belong To?  
  *For each scenario, pick the answer that feels most intuitive. Don’t overthink it!*

  1. **The Sleeping Prisoner**  
     You volunteer for an experiment. On Sunday, a fair coin is flipped:  
     - *Heads*: You are awakened once (on Monday).  
     - *Tails*: You are awakened twice (Monday and Tuesday), with amnesia between.  
     You wake up with no memory of prior awakenings. What is your credence that the coin landed heads?  
     A. 50%  
     B. 33%  

  2. **Humanity’s Future**  
     Humanity could be short-lived (total humans: 100 billion) or long-lived (100 trillion). You are the 60 billionth human. Initially, both futures seem equally likely. After learning your birth rank, what do you think?  
     A. Short-lived is more likely.  
     B. They remain equally likely.  

  3. **Cosmic Theories**  
     Two theories describe the universe. Theory A predicts 10 billion observers; Theory B predicts 10 trillion. You have no evidence favoring either. What is your credence for Theory A?  
     A. 50%  
     B. ~0.1% (1 in 1,000)  

  4. **The Clone Lab**  
     A lab flips a fair coin:  
     - *Heads*: One person is created.  
     - *Tails*: Two people are created (in identical rooms).  
     You are created. What is the probability the coin landed heads?  
     A. 50%  
     B. 33%  

  5. **The Cosmic Lottery**  
     In one scenario, 10 observers exist, all with blue skies. In another, 1,000 observers exist, but 10 see green skies (due to rare defects). You see a blue sky. Initially, both scenarios seem equally likely. After seeing blue, what is the probability you’re in the first scenario?  
     A. ~50%  
     B. ~1%  

  6. **Simulation Hypothesis**  
     Either:  
     - One advanced civilization exists (*real world*).  
     - Many civilizations exist, each running ancestor simulations (*simulations dominate*).  
     You live in an early 21st-century Earth. What should you think?  
     A. Simulations are more likely.  
     B. No change in probabilities.  

  7. **The Dice Game**  
     A fair 6-sided die is rolled. If it lands ⚀, one person is created; if ⚁, two are created, and so on. You are created. What is the probability the die showed ⚀?  
     A. ~17% (1/6)  
     B. ~5% (1/21)  

  8. **Quantum Escape Room**  
     You enter a room where a quantum coin is flipped. If tails, you die painlessly. If heads, you survive. After one flip, you find yourself alive. What is the probability of heads?  
     A. 50%  
     B. 100%  

  ---

  ### Scoring Key  
  Tally your answers and match to the closest result. Positions are defined by core commitments, not specific labels.

  #### 1. **The Cosmic Gambler (Self-Sampling Assumption - SSA)**  
     *Answers: 1B, 2A, 3A, 4B, 5A, 6A, 7B, 8B*  
     **Description:** You reason as if you’re a random sample from all possible observers in your reference class (e.g., humans, conscious beings). Your observations inform you about the universe’s structure (e.g., your birth rank hints at humanity’s lifespan).  
     **Uncomfortable Commitment:** In the *Cosmic Theories* puzzle, you assign 50% credence to a universe with 10 billion observers, even if a rival theory predicts vastly more—because neither theory explains *your specific data* better.  

  #### 2. **The Universal Heir (Self-Indication Assumption - SIA)**  
     *Answers: 1B, 2B, 3B, 4B, 5B, 6A, 7B, 8B*  
     **Description:** You treat the existence of more observers as evidence for theories that predict them. Your prior probability for a world scales with its number of observers (e.g., large universes are inherently likelier).  
     **Uncomfortable Commitment:** In the *Cosmic Lottery*, seeing a blue sky barely raises your credence in the 10-observer world—because the 1,000-observer world’s sheer size outweighs the unlikelihood of your sky color.  

  #### 3. **The Modest Bayesian (Ordinary Bayesian Updating)**  
     *Answers: 1A, 2B, 3A, 4A, 5A, 6B, 7A, 8B*  
     **Description:** You reject anthropic special pleading. You update beliefs using standard probability (e.g., conditioning on all observed data), without counting observers or sampling yourself.  
     **Uncomfortable Commitment:** In *Humanity’s Future*, you ignore your birth rank entirely—even if you’re among the first 0.0001% of humans, you don’t revise doom probabilities.  

  #### 4. **Mixed or Hybrid View**  
     *Answers not matching cleanly? You might blend principles.*  
     **Description:** You switch between SSA, SIA, or Ordinary Bayesianism depending on context—or you intuit nuances the quiz can’t capture.  
     **Note:** SSA and SIA agree on cases like the *Clone Lab* (both say 33%) but clash on *Humanity’s Future* (SSA: A, SIA: B) and *Cosmic Theories* (SSA: A, SIA: B).  

  ---

  ### Why Certain Positions Can’t Be Separated  
  - **SSA vs. SSA (Different Reference Classes):** This quiz doesn’t distinguish between SSA applied to *all conscious beings* vs. *humans only*. For example, if the *Simulation Hypothesis* used non-human simulated minds, strict SSA might answer differently.  
  - **SIA vs. SIA (Infinite Universes):** SIA’s behavior in infinite universes (e.g., with duplicated observers) isn’t tested here. Some SIA variants avoid “observer counting” in infinities, but the quiz focuses on finite cases.  
  - **Ordinary Bayesian vs. Pragmatic SSA:** Both reject SIA’s “more observers = more likely” prior. They diverge only in observer-counting scenarios like the *Dice Game*, which the quiz includes.  

  ---

  This quiz highlights how anthropic reasoning shapes real-world inferences—and why even experts disagree. For deeper dives, explore puzzles like the *Presumptuous Philosopher* (favors SIA) or *Quantum Immortality* (tests reference classes).
