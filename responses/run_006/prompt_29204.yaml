prompt: |-
  I'm a novelist, not a philosopher, but I fell down this hole while trying to write a character—call him Daniel—who is serially unfaithful and yet, when a friend betrays him in a much smaller way, is genuinely, not comically, outraged. I wanted to know whether Daniel's outrage is just wrong, or true but somehow not his to voice, and I ended up with an argument that seems to prove to much.

  (1) Blame has a standing condition: you can't appropriately blame someone for a wrong if you are up to your neck in the same kind of wrong yourself. (2) Daniel, then, is in no position to blame his friend for betrayal. (3) But Daniel isn't special. For almost any wrong W that anyone actually blames, the blamer is guilty of something of the same broad kind under some description—or has waived away near-identical wrongs by friends and allies, or quietly benefits from arrangements that make W profitable. (4) So nearly everyone lacks standing nearly all the time. (5) And if nearly everyone lacks standing, then nearly every act of blame is inappropriate. (6) But that can't be right: a victim can blame her unrepentant abuser even if she is no saint herself, and a practice built on truth-telling and accountability shouldn't collapse just because the messengers are flawed.

  I'd most like to keep the idea that hypocrisy matters—I built a whole novel around it—but I can't see how to keep it without sliding into (5). Which step should I reject, and what do I pay for rejecting it?
reasoning: |-
  Okay, let me try to unpack this novelist's dilemma. They've created a character named Daniel who's serially unfaithful but gets genuinely outraged when a friend commits a smaller betrayal. The core question is whether Daniel's outrage is valid or hypocritical nonsense, and this led them down a philosophical rabbit hole ending in what seems like a paradox about moral standing.

  First, I need to understand their argument step by step. They start with the premise that blame requires "standing" - you can't blame others for wrongs you're actively committing. That makes Daniel's outrage inappropriate (step 2). Then comes the slippery slope: they argue nobody has clean hands (step 3), so almost everyone lacks standing almost always (step 4), making nearly all blame inappropriate (step 5). But step 6 objects that this can't be right - victims should still blame abusers regardless of their own flaws.

  Hmm... the novelist wants to preserve hypocrisy as meaningful (it's central to their novel!) but avoid the paralyzing conclusion that all blame is illegitimate. Where's the weak link? 

  Let me examine step 3 closely. It claims "for almost any wrong W... the blamer is guilty of something of the same broad kind." But is a shoplifter really in the same moral category as a murderer just because both involve "taking"? That seems like overgeneralization. The "under some description" trick worries me - we could describe almost anything as "causing harm" if we abstract enough. 

  Then there's the waiver argument - "waived away near-identical wrongs by friends." But is turning a blind eye to a friend's minor lie equivalent to excusing torture? Probably not. And the "benefiting from arrangements" point feels different from direct wrongdoing. Step 3 seems to be smuggling in false equivalences.

  Ah! This might be the key: we need to distinguish between types of moral failure. The novelist's step 3 lumps together:
  - Direct commission of identical wrong (Daniel cheating while blaming cheating)
  - Commission of vaguely similar wrongs (a liar blaming a thief)
  - Complicity through silence (ignoring allies' misdeeds)
  - Passive beneficiary of unjust systems

  But these aren't morally symmetrical! Only the first category clearly destroys standing for that specific wrong. The others might warrant self-reflection but don't automatically silence you. 

  For the victim-blaming concern in step 6: even if a victim has committed wrongs, their victimhood gives them unique standing regarding their own abuse. The abuser can't deflect by saying "but you lied on taxes!" - that's classic whataboutism. 

  The cost of rejecting step 3? We lose the tidy idea that "all sins are equal" which some moral systems prefer. But in practical ethics, proportionality matters. A reformed smoker can credibly warn about lung cancer even if they once jaywalked. 

  For the novel: Daniel's outrage could still read as psychologically real while being philosophically hollow. That tension might actually deepen the character - his selective blindness could reveal his self-justification mechanisms. The narrative might show how his friend's minor betrayal forces him to confront his own larger betrayals, making the hypocrisy sting more sharply. 

  I should also note that rejecting step 3 preserves the concept of degrees - small wrongs don't contaminate all moral speech, though they might require humility. The alternative (keeping step 3) makes morality impossibly perfectionist - only saints could judge, but saints wouldn't judge because they'd be too aware of their own flaws. That way lies paralysis.
answer: |-
  Your argument is fascinating—and you're right that step (3) is the critical weak point. Let's dismantle it systematically while preserving the core insight about hypocrisy.

  ### The Flaw: Step (3)'s Overgeneralization
  Step (3) claims:  
  *"For almost any wrong W that anyone actually blames, the blamer is guilty of something of the same broad kind under some description—or has waived away near-identical wrongs... or quietly benefits from arrangements that make W profitable."*  

  This conflates **four distinct categories** of moral failing:  
  1. **Direct, ongoing commission of the *identical* wrong** (e.g., Daniel betraying partners *while* condemning betrayal).  
  2. **Commission of a *vaguely similar* wrong** (e.g., a liar blaming a thief).  
  3. **Complicity through silence** (e.g., excusing a friend's betrayal).  
  4. **Passive beneficiary of unjust systems** (e.g., profiting from exploitative labor).  

  **The error:** Treating all these as morally equivalent for "standing" purposes. They are not. Only category #1 (direct, ongoing, identical wrongdoing) *automatically* undermines standing to blame for **that specific wrong**. Categories #2–#4 may warrant humility or self-reflection but don’t nullify standing outright.  

  ### Why Rejecting Step (3) Saves Your Premises
  By narrowing "the same kind of wrong" in premise (1) to **direct, ongoing, and substantially identical acts**, you avoid the slippery slope:  
  - **Daniel** (serial infidelity → betrayal) has no standing to blame *betrayal*.  
  - **A victim of abuse** (who once lied or stole) *retains* standing to blame their abuser. Lying ≠ abuse.  
  - **A sweatshop worker** (benefiting from cheap goods) can still blame wage theft—their systemic entanglement isn’t *identical* to actively stealing wages.  

  ### What You Pay for Rejecting Step (3)
  1. **Loss of Moral Purism:**  
     You sacrifice the satisfying, absolute rule that "all hypocrisy is equal." Standing becomes **context-dependent**. The cost: nuance. You must judge:  
     - Is the wrong *identical* (betrayal vs. betrayal) or merely *analogous* (betrayal vs. lying)?  
     - Is the blamer *currently engaging* in the wrong, or is it past/indirect?  
     - Does the blamer’s act *directly enable* the wrong they condemn?  

  2. **Survival of "Lesser Hypocrisies":**  
     Your framework now allows for:  
     - A recovering alcoholic condemning drunk driving (their past doesn’t void standing).  
     - A tax-evader condemning murder (dissimilar wrongs).  
     But Daniel *still* lacks standing—his hypocrisy is direct and ongoing.  

  ### Resolving Your Character's Dilemma
  **Daniel's outrage is "true but not his to voice."**  
  - **Truth:** Betrayal *is* wrong. His friend *did* wrong him.  
  - **Not his to voice:** His identical, ongoing actions strip his standing. His outrage feels genuine *to him* because he minimizes his own betrayals ("just affairs") while magnifying his friend's ("ultimate disloyalty!"). This is classic **cognitive dissonance**.  

  ### Novelistic Implications
  - **Dramatic Irony:** Let readers see Daniel’s blindness. His rage exposes his own moral fragility.  
  - **Character Arc:** Could this catalyze self-awareness? Or entrench his self-delusion?  
  - **Theme:** Explore *why* society cares about hypocrisy: it’s not about "canceling" blame, but about **trustworthiness**. A hypocrite’s blame loses force because they’ve shown their principles are negotiable.  

  ### Philosophical Safety Net
  Your revised premise (1) survives:  
  > *"You lack standing to blame for wrong W if you are **currently, actively committing substantially identical wrongs W** without remorse."*  

  This avoids the collapse into moral paralysis while condemning Daniel. It also explains real-world intuitions:  
  - We *do* let abuse victims blame their abusers.  
  - We *don’t* let corrupt politicians condemn corruption.  

  ### Conclusion
  **Reject step (3).** Its overbroad definition of "the same kind of wrong" creates a false paradox. The cost is accepting that standing depends on **specificity and equivalence** of wrongdoing—but this cost buys you realism, preserves hypocrisy as a meaningful flaw (central to your novel!), and avoids moral nihilism. Daniel’s outrage is psychologically valid but morally hollow. That’s rich soil for fiction.  

  *P.S. For deeper reading: Look into "moral standing" in Scanlon’s* Moral Dimensions *and Wallace’s* Hypocrisy, Moral Address, and the Equal Standing of Persons. *They defend nuanced distinctions like these.*
