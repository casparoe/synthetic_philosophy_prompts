  I have been reading an old English translation of Freud’s *Totem and Taboo*, and I keep getting stuck on a paragraph in the preface. I am not a scholar, and I would like help understanding exactly what Freud is claiming in this passage and how far he means the claim to extend. The passage reads:

  “The two principal themes, totem and taboo, which give the name to this small book are not treated alike here. The problem of taboo is presented more exhaustively, and the effort to solve it is approached with perfect confidence. The investigation of totemism may be modestly expressed as: ‘This is all that psychoanalytic study can contribute at present to the elucidation of the problem of totemism.’ This difference in the treatment of the two subjects is due to the fact that taboo still exists in our midst. To be sure, it is negatively conceived and directed to different contents, but according to its psychological nature, it is still nothing else than Kant’s ‘Categorical Imperative’, which tends to act compulsively and rejects all conscious motivations. On the other hand, totemism is a religio-social institution which is alien to our present feelings; it has long been abandoned and replaced by new forms.”

  I can see broadly that this is part of Freud’s effort to connect so-called primitive customs with modern psychological life. But I want help understanding the comparison to Kant’s categorical imperative. Is Freud saying that taboo prohibitions and Kantian moral obligation are literally the same psychological mechanism, or is he saying that the categorical imperative is simply one later shape taken by the same kind of unconscious, compulsive prohibition? What does it mean to say that this kind of imperative “tends to act compulsively and rejects all conscious motivations”? Would Freud then think that Kantian morality shares something important with taboo even though its content is different, and does that imply that moral obligation itself needs a psychoanalytic explanation rather than being a purely rational principle? I would like to know how much weight that one sentence can bear, and what the passage reveals about Freud’s underlying view of the relation between religious custom and morality.
