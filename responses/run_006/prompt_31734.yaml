prompt: |-
  I'm a longtime reader of rationalist blogs and forums (LessWrong and its orbit, mostly), and I keep running into the phrase "defer to the objective chance" used as if it settles a discussion by itself. I've started to notice that it gets used to do very different jobs in different arguments, and I want to separate the readings before I push back in a thread.

  Here are three places I've seen it recently:

  1. In a discussion about whether a one-off event — a specific AI system failing during a particular deployment — "has a probability," someone ended the argument by saying that once you know the objective chance of the event, you simply defer to it: your credence should be whatever that number is.
  2. In a different thread about a coin that was flipped and then hidden, someone said my credence that it landed heads should be 1/2, because the objective chance of heads was 1/2, and any other credence would be a refusal to defer to the chance — even though the flip is over and the outcome is already fixed.
  3. In a third discussion, about a forecasting model that outputs a number for some geopolitical event, someone claimed that rational agents should adopt the model's number wholesale, because the model's probability just is the objective chance and rational credences defer to objective chances.

  I know there's something in formal epistemology called the Principal Principle in this vicinity, but I've never seen its possible readings laid out side by side, and I don't trust my memory of the exact formulation.

  You are an expert in formal epistemology and the philosophy of probability. Think carefully. Start by brainstorming a list of candidate precisifications of the slogan "defer to the objective chance" before settling on the menu you present. Then lay out the distinct precise theses that sentence could be expressing, from the nearly trivial to the clearly false. For each reading, say exactly what it claims — including what "chance" refers to and what operation "defer" amounts to — whether it is a platitude, a substantive but defensible principle, or simply false, and whether it actually supports the use the slogan was being put to in each of the three cases above.

  I especially want the menu to answer these questions:

  - Does deference require setting my credence equal to the chance unconditionally, or conditional on my total evidence, or only conditional on some special class of admissible evidence?
  - What evidence, if anything, would make it rational not to set my credence equal to a known chance — for example, evidence that the event is already settled, or evidence that the chance itself will be undermined by my total evidence?
  - Does the slogan constrain my current, all-things-considered credence, or only an initial or prior credence before I learn anything?
  - Does it apply to past events whose chance is now 1 or 0, and what happens if I don't know which?
  - What is the objective chance in the first place: a single-case physical probability, the output of a well-calibrated model, a theoretical quantity of a completed physics, or something else?

  Finally, say which reading or readings are probably doing the real work when someone on a rationalist forum uses the slogan to end an argument, and whether the argument-ending move is ever justified.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're deeply involved in rationalist communities and have noticed the phrase "defer to the objective chance" being used inconsistently across different scenarios. Their main concern is to dissect the various interpretations of this slogan to effectively engage in discussions where it's invoked.

  First, I need to recall the Principal Principle and its nuances. The user mentioned three specific cases: a one-off AI failure, a hidden coin flip, and a forecasting model. Each scenario uses the slogan differently, so I should identify how "chance" and "defer" are operationalized in each context. 

  Starting with the Principal Principle, I remember Lewis's original formulation requires setting credence equal to the chance, conditional only on admissible evidence. Admissible evidence is historical or purely about the present, not information about future outcomes. This addresses the coin flip case where the outcome is fixed but unknown—deferring to 1/2 makes sense because knowing the outcome hasn't happened yet isn't admissible.

  Then there's the New Principle, which handles undermining issues where the chance theory itself might be inconsistent with certain outcomes. For example, if a high chance of an event could imply the chance theory is wrong, we need to condition on the entire theory. This might apply to the forecasting model case, where the model's output is treated as chance, but if the model could be flawed, deference isn't straightforward.

  The user also asks about the nature of chance. Is it physical propensity, a theoretical ideal, or calibration? In the AI example, claiming a one-off event "has a probability" leans on single-case chances, which is contentious. The forecasting model scenario conflates model outputs with objective chances, which is only valid if the model is perfectly calibrated.

  For each reading, I need to clarify what "defer" means: is it unconditional, conditional on evidence, or only for priors? Also, when can evidence override deference? Past events with known outcomes have chance 1 or 0, so deference would set credence to 1 or 0, but if the outcome is unknown, it's trickier. The coin flip example shows this—even though the outcome is fixed, without knowing it, we still defer to 1/2.

  The user's deeper need is to have a structured framework to counter misuse of the slogan in arguments. They want to know which interpretations are valid and when the argument-ending move is justified. For instance, in the forecasting model case, treating model outputs as chances is only appropriate if the model is ideal; otherwise, it's an overreach. 

  I should also address epistemic vs. objective chance. Rationalist forums might conflate the two, leading to sloganeering. Pointing out that model outputs are epistemic unless proven otherwise can help the user push back effectively. 

  In summary, the key is to delineate the conditions under which each principle applies, highlight where the slogan is misapplied, and equip the user with precise rebuttals based on formal epistemology.
answer: |-
  Based on your examples and questions, the slogan "defer to the objective chance" is indeed invoked in multiple, subtly different ways, often without clarity on its precise meaning or limitations. The core philosophical anchor is Lewis's **Principal Principle (PP)** and its descendants, but its interpretations vary significantly. Below is a menu of precisifications, ranging from defensible principles to misapplications. I'll address each of your key questions explicitly.

  ---

  ### **Candidate Precisifications of "Defer to the Objective Chance"**

  1. **Lewis's Original Principal Principle (PP)**  
     *Formulation:*  
     \( C(A \mid \text{ch}(A) = x \land E) = x \)  
     where \( E \) is any **admissible evidence** (i.e., evidence solely about past or present facts, not "undermining" the chance theory).  
     - *Chance refers to:* A fundamental, time-dependent, physical probability (e.g., quantum propensities, deterministic-but-unknown microstates).  
     - *Defer means:* Set your credence to the chance value, conditional only on admissible evidence.  
     - *Status:* Defensible but faces problems with "undermining futures" (e.g., if a high chance of A implies ch itself is unreliable).  
     - *Applies to your cases:*  
       - (1) **AI Failure:** Only if a well-defined physical chance exists (e.g., quantum noise in hardware). Often false for complex one-offs.  
       - (2) **Coin Flip:** **Yes**. The outcome is unknown, so \( E \) (e.g., "the coin was fair") is admissible. Credence should be 0.5.  
       - (3) **Forecasting Model:** **No**. Model outputs are not objective chances; PP doesn't apply.  

  2. **The New Principle (NP)**  
     *Formulation:*  
     \( C(A \mid \text{ch}(A) = x \land T) = x \)  
     where \( T \) is the **complete chance theory** (e.g., all physical laws governing chances).  
     - *Chance refers to:* Same as PP, but conditioning on \( T \) avoids undermining problems.  
     - *Defer means:* Set credence to the chance, conditional on the entire chance theory.  
     - *Status:* Widely accepted fix for PP's flaws; still requires a complete physics.  
     - *Applies to your cases:*  
       - (1) **AI Failure:** Only if physics fully determines the chance (rarely true for macro-events).  
       - (2) **Coin Flip:** Same as PP – supports 0.5 credence.  
       - (3) **Forecasting Model:** **No**. Models aren't fundamental chance theories.  

  3. **Current Chance Deference (CCD)**  
     *Formulation:*  
     \( C(A \mid \text{ch}_t(A) = x \land E_t) = x \)  
     where \( \text{ch}_t(A) \) is the chance *at time t* (e.g., now), and \( E_t \) is evidence up to time t.  
     - *Chance refers to:* Physical chance at a given time (e.g., for a past event, chₜ is 0 or 1 if settled).  
     - *Defer means:* Align credence with the *current* chance value.  
     - *Status:* Defensible if chances evolve deterministically.  
     - *Applies to your cases:*  
       - (1) **AI Failure:** If the deployment hasn't occurred, current chance might exist.  
       - (2) **Coin Flip:** **Rejected**. Once flipped, current chance is 0 or 1 (not 0.5). Deference requires 0 or 1 credence – but you lack that knowledge!  
       - (3) **Forecasting Model:** Only if the model tracks real-time physical chances.  

  4. **Epistemic Deference to Calibration (EDC)**  
     *Formulation:*  
     \( C(A \mid M(A) = x) = x \)  
     where \( M \) is a perfectly calibrated model (i.e., in the long run, P(A|M(A)=x) = x).  
     - *Chance refers to:* Epistemic probability from a reliable model, not objective chance.  
     - *Defer means:* Treat the model's output as your credence.  
     - *Status:** Defensible for decision-making but **not** deference to objective chance.  
     - *Applies to your cases:*  
       - (1) **AI Failure:** Only if a calibrated model exists (unlikely for one-offs).  
       - (2) **Coin Flip:** Not applicable (no model needed).  
       - (3) **Forecasting Model:** **Yes**, but mislabeled as "objective chance".  

  5. **Naive Deference (ND)**  
     *Formulation:*  
     \( C(A \mid \text{ch}(A) = x) = x \)  
     Unconditional, ignoring all other evidence.  
     - *Chance refers to:* Vague (often equivocal).  
     - *Defer means:* Blindly set credence to the chance, even with defeating evidence.  
     - *Status:** **False**. Ignores undermining evidence (e.g., learning A occurred despite low ch(A)).  
     - *Applies to your cases:*  
       - Used in all three examples, but **incorrectly**.  
       - (2) Coin Flip: Fails if you learn the coin was biased.  
       - (3) Forecasting: Fails if you know the model is miscalibrated.  

  ---

  ### **Answers to Your Specific Questions**

  1. **Deference Conditionality:**  
     - Unconditional (ND) is false.  
     - PP/NP require conditioning on *admissible evidence* or the *chance theory*.  
     - EDC requires conditioning on the model's output.  
     - **Verdict:** Deference is **never** unconditional. Rationality requires integrating *all* evidence.  

  2. **When Evidence Overrides Deference:**  
     - **Undermining Evidence:** If evidence suggests the chance theory is wrong (e.g., a fair coin lands heads 1000 times), NP forbids blind deference.  
     - **Settled Outcomes:** For past events (e.g., the coin flip), the *current* chance is 0 or 1. Deferring to the *prior* chance (0.5) is irrational if you know the outcome.  
     - **Misleading Chances:** If you know a model is uncalibrated for a specific case (e.g., the AI has a hidden flaw), EDC fails.  

  3. **Current vs. Prior Credence:**  
     - PP/NP constrain *current* credence conditional on evidence. They are not about initial priors.  

  4. **Past Events:**  
     - Objective chances for past events are 0 or 1 (if determined).  
     - If you *know* the outcome, credence must be 0 or 1.  
     - If you *don't know* (e.g., the hidden coin), PP says: defer to the chance *at the time of the event* (0.5), since your ignorance is admissible evidence.  

  5. **What is Objective Chance?**  
     - In PP/NP: A fundamental, physical, time-dependent propensity (e.g., quantum mechanics).  
     - **Not** the output of a model (that's epistemic).  
     - **Not** defined for all one-off events (only where physics assigns chances).  
     - **Not** a subjective belief.  

  ---

  ### **What's Happening in Rationalist Forums & When It's Justified**
  - **Coin Flip (Case 2):**  
    The argument is **correct** under PP/NP. Your ignorance is admissible, so credence should be 0.5.  
    *Why:* The chance *at the time of the flip* was 0.5, and no subsequent evidence changes this.  

  - **AI Failure (Case 1):**  
    **Misapplied.** One-off events often lack objective chances. If "chance" means a model's estimate (EDC), call it that – but don't invoke objective chance.  

  - **Forecasting Model (Case 3):**  
    **Deeply confused.** Model outputs are epistemic, not objective chances. Deference might be pragmatic (EDC), but labeling it as "objective chance deference" smuggles in false authority.  

  - **Slogan-Dropping Dynamics:**  
    Users typically invoke **Naive Deference (ND)** or misapply **PP** (e.g., to models or settled events). This "ends arguments" by:  
    - Equating *rational credence* with *any number labeled "chance"*.  
    - Ignoring admissibility/undermining (e.g., in past events).  
    - Conflating epistemic and objective probabilities.  
    **Justified only in PP/NP-compliant cases (e.g., the coin flip). Otherwise, it's a rhetorical move.**  

  ---

  ### **Conclusion**
  The only defensible readings are **PP/NP** (for physical chances) and **EDC** (for calibrated models – but *don't call it objective chance*). In your cases:  
  - **Coin Flip (2):** Deference to 0.5 is correct (PP).  
  - **AI Failure (1):** Likely a category error; no objective chance exists.  
  - **Forecasting (3):** Requires justifying the model's calibration (EDC), *not* objective chance.  

  Push back by asking:  
  1. Is this a *fundamental physical chance* or an *epistemic estimate*?  
  2. What makes evidence "admissible" here?  
  3. Could my total evidence undermine this chance?  
  4. For past events: Is the outcome settled?  

  This forces clarity on whether "deference" is a substantive principle or a misuse of terminology.
