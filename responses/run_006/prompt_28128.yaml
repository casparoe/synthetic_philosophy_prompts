  ### Decision Procedure for Object vs. Collection Determination  
  **Grounding Philosophy**: Based on the Special Composition Question (SCQ), this procedure integrates key philosophical views (nihilism, universalism, life-based views, contact/fastening) while prioritizing museum-specific practicalities. It progresses stepwise, stopping at the first definitive answer or escalating ambiguities.  

  #### Step-by-Step Procedure:  
  1. **Donor/Provenance Directives**  
     - **Question**: Does the donor agreement, provenance documentation, or legal claim explicitly define the item(s) as a single object or a collection?  
     - **Sufficient Answer**: Written evidence (e.g., donor form, deed of gift, repatriation claim).  
     - **Stop & Record**: As specified (single object OR collection).  
     - **Escalate If**: Ambiguous directives (e.g., conflicting documents).  

  2. **Physical Connection (Contact/Fastening View)**  
     - **Question**: Are the parts permanently joined (e.g., glued, welded, sewn) in a way that separation would cause damage or irreversible change?  
     - **Sufficient Answer**: Physical inspection confirms non-trivial, destructive disassembly is required.  
     - **Stop & Record as Single Object**: If yes.  
     - **Proceed If**: Parts are detachable without damage (e.g., screws, magnets) OR disarticulated.  
     - **Philosophical Disagreement**:  
       - *Contact view*: Composition requires physical bonding.  
       - *Nihilism/Universalism*: Reject contact as decisive (nihilism denies composition; universalism allows unjoined collections).  

  3. **Functional Unity (Life-Based/Teleological View)**  
     - **Question**: Do the parts serve a unified purpose *only when together* (e.g., a machine, ritual item) that is lost when separated? Is this unity inherent to the item’s identity?  
     - **Sufficient Answer**: Expert assessment (conservator, curator) confirms functional interdependence (e.g., mask + feathers = sacred whole; engine parts ≠ functional alone).  
     - **Stop & Record as Single Object**: If yes.  
     - **Proceed If**: Parts can function independently OR unity is temporary (e.g., display assembly).  
     - **Philosophical Disagreement**:  
       - *Life-based view*: Composition occurs for biological/organic wholes (e.g., skeletons).  
       - *Nihilism*: Only simples exist; functional unity is irrelevant.  

  4. **Origin/History of Wholeness**  
     - **Question**: Were the parts created, discovered, or historically used as one entity (e.g., a fossil skeleton from one organism, a matched set)?  
     - **Sufficient Answer**: Documentation (excavation reports, creator notes) or scholarly consensus.  
     - **Stop & Record as Single Object**: If yes.  
     - **Proceed If**: Items assembled post-discovery OR no evidence of original unity.  

  5. **Universalism/Nihilism Threshold**  
     - **Question**: Are the items numerous (>10), homogeneous, and contextually inert (e.g., mass-produced tools, loose beads)?  
     - **Sufficient Answer**: Items are near-identical, lack individual significance, and share a deposition context (e.g., cache, hoard).  
     - **Stop & Record as Collection**: If yes.  
     - **Escalate If**: Items are unique, culturally sensitive, or ethically contentious.  
     - **Philosophical Disagreement**:  
       - *Universalism*: Any plurality composes an object (supports single-object recording).  
       - *Nihilism*: Only smallest units exist (supports collection recording).  

  6. **Practical Implications Check**  
     - **Question**: Would recording as one object or a collection better align with:  
       - Loans (e.g., whole vs. partial loans),  
       - Conservation (e.g., separate treatments needed),  
       - Insurance (e.g., single high-value item vs. bulk coverage),  
       - Repatriation (e.g., group claims)?  
     - **Sufficient Answer**: Risk assessment by registrar/staff (e.g., insurance costs lower for bulk; repatriation claims track groups).  
     - **Stop & Record**: As pragmatically optimal.  
     - **Escalate If**: Conflicting factors (e.g., high insurance value as a whole vs. loan demand for parts).  

  7. **Escalation to Registrar/Committee**  
     - **Trigger**: Ambiguity at any step, ethical/legal risks, or philosophical disagreement.  
     - **Outcome**: Decision based on institutional values (e.g., cultural respect, collections policy).  

  **Key Design Notes**:  
  - **Time Limit**: Steps 1–5 resolvable in <30 mins; step 6 in <20 mins; step 7 unbounded.  
  - **Staff-Friendly**: Uses physical/functional cues first; philosophy invoked only when necessary.  
  - **Philosophical Transparency**: Flags disagreements (e.g., step 5) rather than hiding them.  

  ---

  ### Case Applications  
  #### (1) Fossil Skeleton (Disarticulated Bones)  
  - **Step 1**: No donor directives. → **Proceed**.  
  - **Step 2**: Bones not joined → **Proceed**.  
  - **Step 3**: No functional unity (non-living) → **Proceed**.  
  - **Step 4**: **YES**—excavated as one organism.  
  - **Stop & Record**: **Single object** (e.g., "Skeleton of *Tyrannosaurus rex*, Specimen #X").  
  - **Registrar’s Concern**: Impractical for storage? *Procedure overrides: Origin trumps convenience*.  

  #### (2) Ceremonial Mask (Wood + Feathers + Beads, Assembled for Display)  
  - **Step 1**: No donor directives. → **Proceed**.  
  - **Step 2**: Parts detachable → **Proceed**.  
  - **Step 3**: **YES**—mask only functions ritually when assembled.  
  - **Stop & Record**: **Single object** (e.g., "Hopi Ritual Mask, ID #Y").  
  - **Registrar’s Dislike**: Conservation needs differ by material? *Procedure prioritizes functional unity*.  

  #### (3) Cache of Stone Tools (Near-Identical, Found in One Pit)  
  - **Step 1**: No donor directives. → **Proceed**.  
  - **Step 2**: No physical connection → **Proceed**.  
  - **Step 3**: No functional unity (tools usable alone) → **Proceed**.  
  - **Step 4**: No origin as a single object → **Proceed**.  
  - **Step 5**: **YES**—numerous, homogeneous, cached together.  
  - **Stop & Record**: **Collection** (e.g., "Neolithic Tool Cache, Accession #Z: 24 items").  
  - **Philosophical Disagreement**:  
    - *Universalism*: Could record as one "cache object."  
    - *Nihilism*: Only individual tools exist.  

  ---

  ### What the Procedure Cannot Settle  
  - **Cultural Relativism**: Cases where Western metaphysics conflicts with Indigenous ontologies (e.g., a "bundle" of sacred items may be one spiritual object despite no physical contact).  
  - **Ethical Gray Zones**: Repatriation claims that define composition differently (e.g., tribes view disarticulated bones as one being; museums view as collection).  
  - **Contextual Ambiguity**: Items with shifting unity (e.g., a dismantled machine parts—functional unity vs. current state).  
  **Resolution**: Escalate to committee for values-based deliberation (step 7).  

  **Final Output**: A reusable, philosophy-grounded workflow that standardizes decisions while flagging subjective/contested cases for human judgment.
