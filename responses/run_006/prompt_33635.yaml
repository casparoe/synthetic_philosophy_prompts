  | **5. Skeptical invariantism** | B  | B  | B  | A  | B  | B  | B  | B  |  
  | **6. Moorean**            | A  | A  | A  | A  | A  | A  | A  | A  |  
  | **7. SSI**                | B  | B  | A  | A  | A  | B  | B  | A  |  

  ### Diagnostic Notes  
  - **Unclassified respondents**: Ties indicate mixed commitments or underdetermined views. Retake or reflect on inconsistent judgments.  
  - **Empty regions**: None. All positions are coherent and reachable.  
  - **Ambiguous separations**:  
    - **Contextualism vs. SSI**: Only differ in Q8. Contextualism (B: standards raised by mentioning alternatives); SSI (A: stakes low, alternatives irrelevant).  
      *Additional separator case*:  
      > **The Forgotten Briefcase**:  
      > In a *low-stakes* scenario, you say, "I know my briefcase is in my office." A skeptic then mentions it might be stolen (irrelevant possibility). In this new conversation, do you still know?  
      > - A. Yes (SSI: stakes unchanged).  
      > - B. No (Contextualism: standards heightened).  

    - **Safety vs. Dretske**: Only differ in Q4 and Q6. Safety (A in both: closure preserved; stakes don’t affect safety). Dretske (B in both: closure denied; high stakes make alternatives relevant).  
      *Inherent difference*: Safety requires ruling out all nearby error possibilities; Dretske only relevant ones.  

    - **Safety vs. Nozick**: Nuclear Plant (Q7) separates them cleanly.  

  - **Why subject-sensitive invariantism (SSI) is included**: The high-stakes bank (Q6) and zoo (Q8) cases distinguish it from contextualism and Safety, as SSI ties knowledge to the subject’s practical stakes, not conversational context or modal safety alone.
