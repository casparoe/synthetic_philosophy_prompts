  ### Sorting Quiz: Which Epistemology of Knowledge Do You Actually Hold?

  **Instructions**: For each scenario, select the answer that best reflects your judgment. Do not overthink; go with your immediate intuition. There are no trick questions.

  ---

  1. **The Country Drive**  
     Henry is driving through the countryside and sees a barn ahead. It is a real barn. Unbeknownst to Henry, this county is full of realistic barn facades made of plywood, indistinguishable from real barns at a glance. Henry has no reason to suspect the facades. Does Henry know the object he sees is a barn?  
     A. Yes  
     B. No  

     *Diagnostic target*: Separates **Moorean** (A) from others (B). Mooreans hold that perception in ordinary conditions suffices for knowledge, while others view the facade-rich environment as undermining knowledge.  

  2. **The Lottery Ticket**  
     You buy a ticket for a fair lottery with a million tickets. The draw is tomorrow. You haven’t heard results. You say, "I know I won’t win." Do you know you won’t win?  
     A. Yes, it’s practically certain.  
     B. No, there’s a chance.  

     *Diagnostic target*: Separates **Moorean** (A) from others (B). Mooreans accept high-probability beliefs as knowledge; others deny knowledge due to uneliminated possibilities.  

  3. **The Ordinary Hand**  
     Sitting at your desk, you clearly see your hand. Do you know you have a hand?  
     A. Yes  
     B. No  

     *Diagnostic target*: Separates **skeptical invariantism** (B) from others (A). Skeptical invariantists deny ordinary knowledge due to unruled-out skeptical hypotheses; others accept it.  

  4. **The Brain in a Vat Deduction**  
     *Assume you know you have a hand (as above)*. You also know that if you have a hand, you’re not a handless brain in a vat (BIV). Do you therefore know you’re not a BIV?  
     A. Yes  
     B. No  

     *Diagnostic target*: Tests closure. **Nozick** and **Dretske** (B) deny closure; **Safety**, **Contextualism**, **Moorean**, **SSI**, and **skeptical invariantism** (A) accept it.  

  5. **Low-Stakes Appointment**  
     Sarah needs to deposit a check by Friday, but it’s unimportant. On Thursday, she sees a long bank line. She remembers the bank was open Saturdays a month ago and says, "I know it’s open tomorrow." She doesn’t check further. Does Sarah know?  
     A. Yes  
     B. No  

     *Diagnostic target*: Low-stakes bank case. Separates **skeptical invariantism** (B) from others (A).  

  6. **High-Stakes Appointment**  
     Sarah needs to deposit a check by Friday to avoid financial disaster. On Thursday, she sees a long bank line. She remembers the bank was open Saturdays a month ago and says, "I know it’s open tomorrow." She doesn’t check further. Does Sarah know?  
     A. Yes  
     B. No  

     *Diagnostic target*: High-stakes bank case. Separates stakes-sensitive views. **Contextualism**, **SSI**, and **Dretske** (B) deny knowledge; **Moorean**, **Safety**, **Nozick** (A) affirm it; **skeptical invariantism** (B) consistently denies knowledge.  

  7. **The Nuclear Plant Display**  
     Alex works at a nuclear plant. A reliable radiation monitor reads "0" (safe). Alex believes radiation is safe. The monitor has a tiny defect: it could display "0" during a rare, undetectable leak. Today, it’s functioning correctly. Does Alex know the radiation is safe?  
     A. Yes  
     B. No  

     *Diagnostic target*: Separates **Nozick** (A: belief is sensitive) from **Safety** and **Dretske** (B: belief is unsafe; defect is relevant). **Contextualism**, **SSI**, and **skeptical invariantism** (B); **Moorean** (A).  

  8. **The Zoo Zebra**  
     At a reputable zoo, you see a striped animal in a "Zebra" pen. It looks like a zebra. Unbeknownst to you, the zoo never uses painted mules, but you haven’t ruled this out. Do you know it’s a zebra?  
     A. Yes  
     B. No  

     *Diagnostic target*: Relevant alternatives. **Dretske** and **Safety** (A: painted mule irrelevant); **Nozick** and **Contextualism** (B: belief insensitive/standards raised); **Moorean** (A); **SSI** (A: low stakes); **skeptical invariantism** (B).  

