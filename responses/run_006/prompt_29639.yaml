answer: |-
  Below is a decision procedure designed for your team to evaluate acausal trade proposals. It’s built as a step-by-step checklist with clear thresholds, requiring no prior knowledge of decision theory. The procedure prioritizes **verifiability**, **cost**, and **credibility** over philosophical arguments. It assumes your default stance is skepticism toward acausal threats, as they often lack evidence and risk setting bad precedents.

  ---

  ### **Decision Procedure for Acausal Trade Proposals**
  **Time limit:** 45 minutes max per proposal.  
  **Outcomes:**  
  - **✅ Pay:** Fund the project.  
  - **🚫 Ignore:** Reject and do not revisit.  
  - **⚠️ Escalate:** Send to a senior decision-maker (if unresolved after 45 mins).  

  **Procedure:**  
  1. **Screen for acausal reasoning:**  
     - *Question:* "Does the proposal rely on threats/promises about counterfactuals, simulations, or decision-theoretic penalties (e.g., ‘If you don’t fund us, you’ll be labeled a defector in other universes’)?  
     - *Good answer:* "Yes" → Proceed to Step 2.  
     - *No/Unclear* → Treat as a normal grant request (exit procedure).  

  2. **Assess project merit INDEPENDENTLY:**  
     - *Question:* "Ignoring all acausal arguments, does the project align with our mission (weird, high-variance) and have a plausible path to impact?"  
     - *Good answer:* "Yes" → Proceed to Step 3.  
     - *No* → Outcome: **🚫 Ignore** (Acausal reasoning is a distraction).  

  3. **Verify threat/promise credibility:**  
     - *Question:* "Is there **verifiable evidence** the group can execute their threat/promise? (e.g., past projects where they delivered on similar claims, third-party audits, or working prototypes)."  
     - *Good answer:* "Yes, with proof" → Proceed to Step 4.  
     - *No* → Outcome: **🚫 Ignore** (Unverifiable = ignorable).  

  4. **Evaluate cost of capitulation vs. cost of threat:**  
     - *Question:* "Is the funding amount **less than 1% of our annual budget** AND less than the verifiable cost of the threat? (Estimate threat cost conservatively. If unquantifiable, default to ‘no’)."  
     - *Good answer:* "Yes" → Proceed to Step 5.  
     - *No* → Outcome: **⚠️ Escalate** (Risk/reward unclear).  

  5. **Check for precedent risk:**  
     - *Question:* "Would funding this set a **new precedent** that could invite copycats?"  
     - *Good answer:* "No (e.g., unique circumstances, or we’ve funded similar before)" → Outcome: **✅ Pay**.  
     - *Yes* → Outcome: **⚠️ Escalate** (Don’t risk normalizing acausal extortion).  

  ---

  ### **Application to Your Cases**
  **Case 1: Counterfactual Mugging**  
  - *Step 1:* Yes (uses Omega logic). → Proceed.  
  - *Step 2:* Unknown (depends on project merit). → **Assume "No" for illustration** → 🚫 Ignore.  
    - *Why:* If the project lacks independent merit, ignore immediately. Even if merit exists:  
  - *Step 3:* No verifiable evidence (no proof Omega exists). → 🚫 Ignore.  
  - **Final Outcome: 🚫 Ignore**  

  **Case 2: XOR Blackmail**  
  - *Step 1:* Yes (threatens research withholding). → Proceed.  
  - *Step 2:* Unknown (depends on project). → **Assume "Yes" for illustration** → Proceed.  
  - *Step 3:* No verifiable evidence (can’t confirm their "internal model" or withheld research). → 🚫 Ignore.  
  - **Final Outcome: 🚫 Ignore**  

  **Case 3: Simulation Argument** ("Fund us to prove the sim wrong")  
  - *Step 1:* Yes (simulation-based threat). → Proceed.  
  - *Step 2:* Unknown (depends on project). → **Assume "Yes"** → Proceed.  
  - *Step 3:* No verifiable evidence (can’t audit their simulation). → 🚫 Ignore.  
  - **Final Outcome: 🚫 Ignore**  

  ---

  ### **Where the Procedure Might Output "Pay" (And Why You Might Dislike It)**  
  - **Scenario:** A group with a **verified track record** (e.g., they’ve accurately simulated your decisions before) requests a tiny grant (<1% budget) to avoid a high-cost threat (e.g., losing access to critical research).  
  - **Outcome:** ✅ Pay (clears Steps 1–5).  
  - **Why you might dislike this:** It could encourage more groups to "prove" their acausal capabilities, potentially flooding you with sophisticated extortion attempts. The procedure prioritizes short-term pragmatism over long-term principle here.

  ---

  ### **What the Procedure Deliberately Ignores or Can’t Handle**  
  1. **Philosophical validity:**  
     - Ignores whether acausal logic is "correct" (e.g., XOR blackmail’s decision-theoretic soundness). Focuses on evidence, not arguments.  
  2. **Non-verifiable threats:**  
     - Dismisses threats lacking proof (e.g., "Omega will punish you"). Unfalsifiable claims die at Step 3.  
  3. **Moral trade-offs:**  
     - Doesn’t weigh "upholding decision-theoretic ideals" vs. "avoiding exploitation." That’s for ⚠️ Escalate cases.  
  4. **Complex acausal games:**  
     - Can’t handle recursive/meta-threats (e.g., "If you use this procedure, we predicted it"). These auto-escalate.  
  5. **Reputation outside our universe:**  
     - Ignores "counterfactual credibility" (e.g., "Other agents will distrust you"). Unverifiable → Ignored.  

  ---

  ### **Why This Works for Your Team**  
  - **No jargon:** Uses simple terms like "proof," "cost," and "precedent."  
  - **Fast:** Most cases resolve at Step 3 (unverifiable threats).  
  - **Safe:** Only pays when threats are credible, cheap, and non-precedent-setting.  
  - **Escalation valve:** Kicks hard cases to humans without burning time.  

  **Final Tip:** Track outcomes of escalated cases. If ⚠️ Escalate often leads to "pay," revise Step 4’s budget threshold downward.
