answer: |-
  ### Thought Experiment: The Global Health Foundation's Dilemma

  **Scenario:**  
  The Global Health Foundation (GHF) must allocate its annual budget to combat a lethal, rapidly spreading virus. Two interventions are proposed:

  - **Option A (Sure Bet):** Fund a proven vaccine distribution program. This will certainly save **10,000 lives** in the current outbreak.  
  - **Option B (Long Shot):** Fund an experimental "virus-eradication" program. If successful, it will completely eliminate the virus, saving **100 billion lives** by preventing all future pandemics. Historical data from similar programs (e.g., smallpox eradication, experimental gene drives) suggests a success probability of **1 in 10 million** (\(p = 10^{-7}\)). If it fails, it saves **zero lives** (resources are wasted, and the virus persists).  

  **Payoffs and Probabilities:**  
  - **Option A:** Saves 10,000 lives with certainty.  
  - **Option B:** Saves 100 billion lives with probability \(10^{-7}\), or 0 lives with probability \(1 - 10^{-7}\).  
  - **Utility function:** \(u(x) = x\) (linear in lives saved, unbounded).  
  - **Risk-weighting function:** Prelec’s function \(w(p) = e^{-(-\ln p)^\alpha}\) with \(\alpha = 2\) (underweights extreme probabilities).  

  ---

  ### Decision Calculations  
  #### **1. Expected Utility (EU) Maximization**  
  EU ranks options by \( \text{EU} = \sum p_i \cdot u(x_i) \).  
  - **Option A:**  
    \(\text{EU}(A) = 1 \cdot u(10,000) = 10,000\).  
  - **Option B:**  
    \(\text{EU}(B) = (10^{-7}) \cdot u(100,000,000,000) + (1 - 10^{-7}) \cdot u(0) = (10^{-7}) \cdot 100,000,000,000 = 10,000\).  
    Since \(\text{EU}(B) = 10,000\) equals \(\text{EU}(A)\), the EU maximizer is indifferent. To break the tie, we adjust the payoff to ensure strict preference:  
    - Revised **Option B**: Saves **100,000,000,001 lives** if successful (a negligible 1-life increase for realism).  
    \(\text{EU}(B) = (10^{-7}) \cdot 100,000,000,001 = 10.0000001\).  
    Now \(\text{EU}(B) \approx 10,000.0001 > \text{EU}(A) = 10,000\).  
    **Verdict:** EU maximizer chooses **Option B**.  

  #### **2. Risk-Weighted Expected Utility (RWEU) Maximization**  
  RWEU uses \( \text{RWEU} = w(p) \cdot u(x_{\text{max}}) + [1 - w(p)] \cdot u(x_{\text{min}}) \), where \(w(p)\) transforms probabilities.  
  - **Prelec’s weighting** (\(\alpha = 2\)):  
    \(w(p) = e^{-(-\ln p)^\alpha}\) for \(p = 10^{-7}\):  
    \(-\ln p = -\ln(10^{-7}) \approx 16.118\),  
    \((-\ln p)^\alpha = (16.118)^2 \approx 259.79\),  
    \(w(p) = e^{-259.79} \approx 10^{-113}\) (effectively 0).  
  - **Option A:**  
    \(\text{RWEU}(A) = w(1) \cdot u(10,000) = 1 \cdot 10,000 = 10,000\).  
  - **Option B:**  
    \(\text{RWEU}(B) \approx w(p) \cdot 100,000,000,001 + [1 - w(p)] \cdot 0 \approx 0\).  
    **Verdict:** RWEU maximizer chooses **Option A**.  

  ---

  ### Structural Feature and Sensitivity  
  **Key Feature:** **Unbounded utility** combined with **linear treatment of probabilities** in EU theory.  
  - EU treats the microscopic probability \(10^{-7}\) as commensurate with the vast payoff, forcing acceptance of Option B despite its near-certain failure.  
  - RWEU’s probability weighting (\(w(p) \approx 0\)) nullifies the impact of the tiny probability, avoiding the gamble.  

  **What if we remove unbounded utility?**  
  Suppose we bound utility (e.g., \(u(x) = \min(x, 10^{12})\)). Then:  
  - \(\text{EU}(B) = (10^{-7}) \cdot 10^{12} = 100\),  
  - \(\text{EU}(A) = 10,000 > 100\).  
  EU maximizer now chooses **Option A**, eliminating fanaticism. The divergence collapses.  

  **What if we remove probability weighting in RWEU?**  
  If RWEU uses \(w(p) = p\) (no weighting):  
  - \(\text{RWEU}(B) = (10^{-7}) \cdot 100,000,000,001 = 10.0000001\),  
  - \(\text{RWEU}(A) = 10,000\).  
  RWEU maximizer now chooses **Option B**, aligning with EU.  

  ---

  ### The EU Maximizer's Response  
  **Why RWEU is "renamed risk aversion":**  
  An EU purist argues that RWEU artificially suppresses small probabilities to avoid gambles rational agents should accept. This is just risk aversion masquerading as a "decision rule"—a behavioral quirk, not a normative principle. If utility truly is linear in lives, we *must* accept positive-EU bets, however improbable. Rejecting Option B reveals a flaw in the agent’s preferences, not the theory.  

  **What might force concession?**  
  The EU maximizer would concede a problem if:  
  1. **Empirical inconsistency:** Real institutions (e.g., WHO, Gates Foundation) consistently reject Option B-like choices, exposing EU’s poor descriptive fit.  
  2. **Dynamic incoherence:** Repeated EU maximization leads to bankruptcy or existential ruin (e.g., always gambling on long shots depletes resources).  
  3. **Moral paradoxes:** EU forces choices that violate fair distribution (e.g., sacrificing 10,000 certain lives for a gamble benefiting no one alive today).  

  However, she maintains that RWEU’s probability weighting is arbitrary—why \(\alpha = 2\)? Why Prelec?—while EU’s linearity is principled. Her core claim: *If saving lives is linear and unbounded, fanaticism isn’t a bug—it’s moral mathematics.* Only bounded utility (or context-dependent discounting) can resolve this without ad hoc adjustments.  

  ---  
  **Conclusion:** This case isolates how EU’s unbounded utility + linear probabilities compel fanatical gambles. RWEU avoids this by underweighting small probabilities, but the EU theorist sees this as smuggled risk aversion. The debate hinges on whether rational choice *must* weight probabilities—and whether we can tolerate unbounded values in a finite world.
