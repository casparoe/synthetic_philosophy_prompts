  User’s tone is analytical but weary. They’d appreciate clarity on which desiderata are ironclad (e.g., avoiding perverse incentives) versus contested (demandingness). Surprise insight: If I show certain pairs (like fairness vs. inefficacy) can't be fully reconciled, it might reframe their entire discussion—which aligns with their "misframed debate" point. 

  For structure: List 8-10 desiderata with vivid cases, tag non-negotiables, note conflicts, then score theories tersely. Sinnott-Armstrong (causal inefficacy) fails thresholds; Kantians struggle with probabilistic harm; complicity gets messy in overdetermination. Expected utility wins on flexibility but crashes into psychological limits. 

  ...Better flag that last one—they’ll want to know if "just calculate expected impact!" is realistically tenable. User’s depth means no dumbing down; they’ll spot oversimplifications. Gotta cite the philosophers they named to show I’m tracking their references. Final touch: End with why this framework matters—it exposes if the debate is about axioms, not evidence.
answer: |-
  Here’s a comprehensive set of desiderata for a theory of individual obligation in collective harm cases, structured as requested. The list prioritizes cases, distinctions, and conceptual challenges, with flags for non-negotiables and tensions.

  ### Core Desiderata (Non-Negotiables)
  1. **Avoid Perverse Permissions**  
     *Motivating Case*: **Overdetermination (Voter Paradox)**. 10,000 people will drown if a dam bursts. 10,000 villains each flip a switch; the dam bursts if ≥1 switch is flipped. Each switch-flip is individually sufficient.  
     *Requirement*: The theory must condemn flipping the switch. *Why*? Otherwise, it permits causing harm simply because others *also* cause it.  
     *Failure*: Any theory allowing "my act doesn't matter because others will do it anyway" is morally bankrupt.  

  2. **Respect Marginal Impact in Threshold Cases**  
     *Motivating Case*: **Desert Reservoir**. A community draws water from a reservoir. If total draws exceed 100,000 liters, the reservoir collapses, killing 100 people. You draw 10 liters; others draw 99,999 liters.  
     *Requirement*: The theory must recognize your 10L *as* the harm-causing act. *Why*? Your act is causally efficacious at the margin.  
     *Failure*: Theories denying marginal efficacy here collapse into denying all responsibility in continuous collective harms (e.g., CO₂ emissions).  

  3. **Accommodate Psychological Realism**  
     *Motivating Case*: **Complex Causation**. Buying a smartphone involves 100+ supply chains with opaque environmental/human rights impacts.  
     *Requirement*: The theory cannot demand omniscient calculation of causal chains. *Why*? Moral obligations must be practically actionable.  
     *Failure*: Overly rigid theories become self-defeating or paralyzing.  

  4. **Handle Probabilistic Harm**  
     *Motivating Case*: **Russian Roulette Group**. 1,000 people each pull a trigger on a gun aimed at a victim. Only 1 bullet is loaded; each has 0.1% chance of firing it.  
     *Requirement*: The theory must assign moral failing to participants. *Why*? Willing participation in probabilistic harm is blameworthy even if no *actual* harm results from your act.  

  ### Important but Contested Desiderata  
  5. **Fairness/Non-Free-Riding**  
     *Motivating Case*: **Common Pasture**. A village shares a pasture that sustains 100 cows. If everyone grazes 1 cow, it thrives. If anyone grazes 2, they gain extra milk but the pasture dies.  
     *Requirement*: Grazing 2 cows is wrong even if others graze only 1. *Why*? It exploits others’ restraint.  
     *Tension*: May conflict with "no impact" claims (e.g., if pasture collapse requires 101 cows, and others graze 99).  

  6. **Avoid Excessively Demanding Requirements**  
     *Motivating Case*: **Carbon Holism**. To truly prevent *all* climate harm, one must live with near-zero emissions (no heating, medicine, or modern food).  
     *Requirement*: The theory shouldn’t demand moral sainthood. *Why*? Over-demandingness alienates moral agents and ignores competing values.  
     *Contested*: Consequentialists may reject this; deontologists may see it as essential.  

  7. **Distinguish Complicity from Mere Causation**  
     *Motivating Case*: **Factory Farm vs. Car Accident**. Buying factory-farmed meat supports systematized suffering; driving a car (emitting CO₂) is a side effect of necessary transport.  
     *Requirement*: The theory should differentiate contributing to *structural injustice* vs. unintended collective harm. *Why*? Moral intuition treats benefiting from exploitation as distinct from accidental harm.  

  ### Puzzle Cases Theories Must Dissolve  
  8. **The Minuscule Probability Problem**  
     *Case*: Eating one steak has a 1-in-10-billion chance of triggering a methane feedback loop ending civilization.  
     *Challenge*: Expected disutility is tiny but non-zero. Does obligation hinge on probability magnitude?  

  9. **The Offset Puzzle**  
     *Case*: You fly cross-country but donate to a project that verifiably removes more CO₂ than your flight emitted.  
     *Challenge*: Does neutralization cancel obligation, or is the initial act still blameworthy?  

  10. **The Virtuous Skeptic**  
      *Case*: You refrain from meat, but your friend eats your portion *plus* theirs. Net animal harm increases.  
      *Challenge*: Does your abstinence still have moral worth if it indirectly enables greater harm?  

  ---

  ### **Theories: Quick Scorecard**  
  - **Causal Inefficacy View** (Sinnott-Armstrong):  
    *Fails*: Threshold cases (#2), Perverse permissions (#1), Probabilistic harm (#4).  
  - **Generalization/Kantian View** (Korsgaard):  
    *Fails*: Probabilistic harm (#4), Demandingness (#6), often struggles with thresholds (#2).  
  - **Complicity View** (Kagan, Lawford-Smith):  
    *Fails*: Overdetermination (#1), may over-extend to trivial associations.  
  - **Expected Utility View** (Singer):  
    *Fails*: Psychological realism (#3), demandingness (#6), and offsets (#9) create paradoxes.  

  ---

  ### **Key Tensions & Incompatibilities**  
  - **Fairness vs. Inefficacy** (#5 vs. Inefficacy Claims):  
    Fairness demands restraint even when impact is negligible; inefficacy denies obligation without measurable effect.  
    *Irreconcilable?*: Only if "impact" excludes fairness-based reasons.  
  - **Demandingness vs. Obligation** (#6 vs. #1–4):  
    High-demand theories handle permissive cases well but become impractical; low-demand theories avoid paralysis but risk permitting complicity.  
  - **Complicity vs. Causation** (#7):  
    Theories focusing on *intentional participation in harm systems* (complicity) conflict with those treating all causal contributions equally.  

  **Conclusion**: The debate may be misframed if it ignores **hybrid theories** (e.g., complicity for structural harms + expected utility for diffuse harms) or denies **context-dependence**. No monistic theory satisfies all desiderata; the strongest candidates accept trade-offs between psychological realism, anti-permissiveness, and non-demandingness. Your stalemate likely arises from emphasizing different core cases (#1 vs. #6 vs. #7).
