  Breaking it down: First, I need to map the essential cases and paradoxes any theory must handle—like overdetermination (voter paradox) or threshold effects (Desert Reservoir). These are non-negotiable because failing them leads to absurdity (e.g., "no one should vote"). Then, psychological realism matters—theories can't demand superhuman calculation. The user cites moral psychology, so they likely know theories ignoring human cognition fail in practice. 

