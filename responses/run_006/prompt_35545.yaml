prompt: |-
  I'm a working novelist who teaches an advanced fiction workshop: sixteen undergraduates, one two-hour session. I want a single runnable activity that makes them feel the force of the question whether an author's intention should govern the meaning of a text, and leave with a precise sense of what a writer can and cannot control about what a story means. The stakes should be practical rather than scholarly. The problem should emerge from the rules rather than from any framing: have participants produce or interpret a short passage under constraints, commit to an interpretation before learning the author's stated intention, and only then face the question of whether that intention changes what the text means. No lecture up front; the theoretical labels should appear only in the debrief. Give me the rules, materials, and a minute-by-minute timeline, then a debrief that maps the moments of the activity onto the main positions — that the text means what the author intended, that it means something independent of intention, and that the reader constructs the meaning — without requiring any prior reading. Also tell me what will predictably go wrong the first time I run it, and be honest about which feature of the debate the activity cannot reproduce and I will have to supply myself.
reasoning: |-
  We are going to design an activity that forces students to confront the question of authorial intention vs. reader interpretation in a practical, hands-on way. The activity will have three phases: (1) writing, (2) interpretation, and (3) revelation and discussion.

  **Activity Title:** The Intention Gap

  **Materials:**
  - Index cards (one per student) or half-sheets of paper for writing.
  - Pens.
  - A timer.

  **Phase 1: Writing (15 minutes)**
  - Each student writes a very short, ambiguous story (about 3-5 sentences) on an index card. The story must include:
    1. A character performing an action.
    2. An object that is central to the action.
    3. A setting that is only vaguely described.
    4. An emotion that is not explicitly named (e.g., instead of "she was sad," show it through action or description).
  - Additionally, each student must write a clear statement of their intention for the story (what they meant to convey) on the back of the card. This should be kept hidden until later.

  **Phase 2: Interpretation (20 minutes)**
  - Collect all the cards and redistribute them randomly so that no one gets their own.
  - Each student reads the story on the card they received and writes an interpretation on a separate piece of paper. They must answer:
    1. What is the main emotion in the story and why?
    2. What do you think the object symbolizes?
    3. What is the central message of the story?
  - They must commit to their interpretation without looking at the back (author's intention).

  **Phase 3: Revelation and Small Group Discussion (25 minutes)**
  - Now, each student reveals the author's intention (on the back) to the person who interpreted their story (so they form pairs). They discuss:
    - How does the author's intention compare to the reader's interpretation?
    - Does knowing the author's intention change the meaning of the story? Why or why not?
  - After 5 minutes in pairs, form groups of four (two pairs) and discuss:
    - What patterns did they notice? When did the intention match? When did it diverge?
    - What elements of the story seemed to be under the author's control? What elements were not?

  **Phase 4: Whole Group Debrief (30 minutes)**
  - Lead a whole-class discussion. Map the activity to the theoretical positions:

    - **Authorial Intentionalism:** The meaning is what the author intended. Point: In the cases where the interpretation matched, the author's control was evident. But note: even when the author had a clear intention, the reader might have missed it. Why? Because the text didn't convey it effectively? Or because the reader brought their own lens?

    - **Textualism (or Formalism):** The meaning is in the text alone, independent of intention. Point: The text had to stand on its own. The reader only had the text to go by. The author's intention, when revealed, might have been a surprise because the text didn't support it.

    - **Reader-Response Theory:** The meaning is constructed by the reader. Point: Every reader brought their own experiences and thus created meaning. The same text might have been interpreted in multiple ways.

  - Highlight what the writer can control: the words on the page, the structure, the details chosen. What they cannot control: the reader's experiences, biases, cultural context, and the associations they bring to symbols and actions.

  **Timeline (Total: 90 minutes):**
  - 0-15 min: Writing phase (each student writes a story and intention).
  - 15-20 min: Collect and redistribute. Explain interpretation task.
  - 20-40 min: Interpretation (students write their interpretations).
  - 40-65 min: Pair and small group discussion (5 min in pairs, then 15 min in groups of four).
  - 65-90 min: Whole group debrief.

  **What will predictably go wrong:**
  1. **Time management:** The writing phase may take longer than 15 minutes. Some students will struggle to write a story that is both short and ambiguous. Have a timer and be strict. If needed, give a one-minute warning and then collect even if not all are done.

  2. **Ambiguity level:** Some stories will be too obvious, others too obscure. This is okay and will illustrate the point. The extreme cases (too obvious: author had control; too obscure: reader had to construct meaning) are useful.

  3. **Pairing issues:** When redistributing, someone might get their own story. Check quickly as you collect and redistribute to avoid this. If it happens, swap quickly.

  4. **Revelation phase:** Some pairs may have a big gap between intention and interpretation, which could lead to defensiveness (author feeling misunderstood) or confusion. Emphasize that the goal is to learn about the process, not to judge.

  5. **Discussion depth:** In the debrief, students may not naturally connect to the theoretical positions. You will have to guide them explicitly by mapping the activity's moments to the theories.

  **What the activity cannot reproduce and you must supply:**
  The activity shows the gap and the three positions, but it does not address the **ethical dimension** of interpretation (e.g., can a reader's interpretation be wrong? what if the author's intention is harmful and the reader resists it?). Also, it doesn't cover the **historical dimension** (how interpretations change over time). You will need to briefly note these in the debrief or in a follow-up lecture.

  **Debrief Guide (Whole Group):**
  - Start by asking: "What happened when you read the story? Did you feel you understood it? How confident were you?"
  - Then: "What happened when you learned the author's intention? Did it change the story for you? How?"
  - Then: "In some cases, the author's intention and the reader's interpretation aligned. What does that tell us about the author's control? What about when they didn't align? What was the cause?"
  - Now map to the theories:
    - When the author's intention was clear and matched, that's **intentionalism** in action. But note: even then, the text had to do the work. If the text failed, the intention didn't matter.
    - When the text alone was the basis for interpretation (and the intention was a surprise), that's **textualism**. The text had its own meaning independent of the author.
    - When readers had different interpretations of the same story, that's **reader-response**. The meaning was built by the reader.
  - Conclude: "As writers, you control the text. You choose every word. But once the text is out in the world, you lose control over how it is read. The meaning is a negotiation between what you put in and what the reader brings. The activity shows that while intention is important, it is not the only factor. The text must carry the weight, and the reader completes the circuit."

  This activity should make the theoretical debate tangible and memorable, and it directly addresses what a writer can and cannot control.
answer: |-
  ### **The Intention Gap: A Fiction Workshop Activity**  
  **Goal:** Make students viscerally experience the tension between authorial intent and reader interpretation, revealing what writers can/cannot control.  

  ---

  ### **Rules & Materials**  
  **Materials:**  
  - 16 index cards (one per student)  
  - Pens  
  - Timer  

  **Rules:**  
  1. **Writing Phase (10 mins):**  
     - Each student writes a **4-sentence story** on their card. Must include:  
       - One **deliberately ambiguous action** (e.g., "Lee handed Morgan the box").  
       - One **symbolic object** (e.g., a key, a wilted flower).  
       - No emotional labels (e.g., no "sad," "angry"—only show via action/setting).  
     - On the **back**, write a 1-sentence "true intent" (e.g., "This is about betrayal"). *Keep this hidden*.  

  2. **Interpretation Phase (15 mins):**  
     - Shuffle and redistribute cards.  
     - Each student interprets their new card **in writing** by answering:  
       - *What is the core emotion here?*  
       - *What does the object symbolize?*  
       - *What is the hidden message?*  
     - **Commit:** No peeking at the author’s intent yet!  

  3. **Revelation & Pair Discussion (15 mins):**  
     - Find the author of your card. Authors reveal their "true intent."  
     - Pairs discuss:  
       - *Did the intent match your reading?*  
       - *Does knowing the intent change the story’s meaning?*  

  ---

  ### **Timeline (Total: 60 mins)**  
  - **0:00–0:10:** Writing Phase (4-sentence stories + secret intent).  
  - **0:10–0:12:** Collect cards, shuffle, redistribute.  
  - **0:12–0:27:** Interpretation Phase (written answers to 3 questions).  
  - **0:27–0:42:** Revelation & Pair Discussion (match with author, discuss).  
  - **0:42–1:00:** Whole-Group Debrief (guided discussion).  

  ---

  ### **Debrief: Mapping Activity to Theory (18 mins)**  
  **Structure the discussion around key moments from the activity:**  
  1. **Start with Concrete Experiences (5 mins):**  
     - Ask: *"Who had an interpretation that matched the author’s intent? What made that possible?"*  
       → Highlights **authorial control**: When craft (word choice, symbolism) aligns with intent, meaning is clearer.  
     - Ask: *"Whose interpretation totally surprised the author? Why?"*  
       → Exposes **loss of control**: Ambiguity, cultural gaps, or unintended symbolism derail intent.  

  2. **Introduce the Three Positions (8 mins):**  
     - **Authorial Intentionalism**:  
       - *"When the author’s intent matched your reading, it felt like the story ‘belonged’ to them. Writers can control meaning through precise craft—but only if the text successfully transmits it."*  
     - **Textualism (Meaning is Text-Bound)**:  
       - *"When you interpreted without knowing intent, you relied solely on the text. This shows meaning is built from words on the page—not the author’s mind. Writers control the text, but not how its parts are assembled in a reader’s mind."*  
     - **Reader-Response Theory**:  
       - *"When interpretations diverged wildly, your personal lens (e.g., seeing the ‘wilted flower’ as grief vs. resilience) constructed meaning. Writers cannot control a reader’s experiences or biases."*  

  3. **Practical Takeaways (5 mins):**  
     - **What Writers Control**: Word choice, structure, imagery, ambiguity.  
     - **What Writers Don’t Control**: Reader’s associations, cultural context, unintended symbolism.  
     - **Key Insight**: *"Your job is to engineer the text to guide readers toward your intent—but once it’s read, meaning is negotiated. Revision is your tool to close the gap."*  

  ---

  ### **Predictable Problems (and Fixes)**  
  1. **Problem: Stories are too obvious or too vague.**  
     - *Why*: Students may fear ambiguity or overcorrect.  
     - *Fix*: Remind them during writing: "Lean into ambiguity—give readers room to interpret."  

  2. **Problem: Awkward pair dynamics.**  
     - *Why*: An author may feel "misread" and become defensive.  
     - *Fix*: Frame it: "This isn’t about right/wrong—it’s about how meaning works."  

  3. **Problem: Shallow interpretations.**  
     - *Why*: Time pressure may lead to superficial readings.  
     - *Fix*: Push deeper in debrief: "What specific words/clues led to your reading?"  

  4. **Problem: Theoretical terms confuse students.**  
     - *Why*: Labels can feel academic if introduced prematurely.  
     - *Fix*: Use plain language first ("author’s plan," "text’s clues," "your lens"), then attach theory in debrief.  

  ---

  ### **What the Activity Can’t Reproduce (and You Must Supply)**  
  - **The "Death of the Author" Nuance**: The activity shows intent vs. interpretation but doesn’t address why society often *privileges* authorial intent (e.g., copyright, interviews, author authority).  
    - **Supply This**: Add in debrief: *"Outside this room, intent matters—publishers, critics, and readers demand it. But in the wild, texts escape their creators. As writers, you must balance intent with humility: your words will outlive your control."*  

  ---

  ### **Why This Works**  
  - **No Lecture, All Discovery**: Theory emerges from lived tension between writing/interpreting.  
  - **Practical Stakes**: Writers see how craft choices (ambiguity, symbolism) invite or repel interpretations.  
  - **No Prep Needed**: Runs on index cards and raw student work—no handouts or prior reading.  

  **Final Tip**: Run it early in the term. The "gap" they feel will resonate in every workshop discussion afterward.
