  The tricky boundary questions include: whether desire/belief cases are analogous (I think structurally similar but metaphysically different); whether this requires value realism (the distinction can be drawn formally without it); and hard cases like blameworthiness where moral reasons might blur the lines. The user seems philosophically sophisticated so I should acknowledge these nuances without oversimplifying.

