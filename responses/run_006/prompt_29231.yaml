answer: |-
  ### (1) Identification
  The phenomenon you describe is well-established in contemporary metaethics and epistemology, primarily under the label **"Wrong Kind of Reasons" (WKRs)**. This contrasts with **"Right Kind of Reasons" (RKRs)**. The distinction originates in debates about "buck-passing" accounts of value (Scanlon, D’Arms & Jacobson, Rabinowicz, Parfit) and the nature of normative reasons for attitudes (belief, desire, admiration). While the label is standard, it requires unpacking: WKRs are considerations that count *in favor of having an attitude* (e.g., to avoid harm or gain reward) but *do not bear on whether the object merits that attitude*. RKRs, conversely, bear directly on the *fittingness* of the attitude to its object (e.g., evidence for belief, admirable traits for admiration). The term "wrong" here is normative—it marks a mismatch between the reason and the attitude’s internal standard—not a moral judgment.

  ### (2) The Core Distinction
  The distinction hinges on **whether a reason bears on the object’s properties or on the consequences of holding the attitude**.  

  - **RKRs**: These are **object-given reasons**. They derive from *features of the object* that make the attitude fitting. For admiration, RKRs are the target’s courage or kindness; these make admiration *appropriate*. For intrinsic desire, RKRs are properties of the object (e.g., pleasure, beauty) that render it desirable. For belief, RKRs are evidence indicating the proposition’s truth. RKRs satisfy the *constitutive aim* of the attitude: truth for belief, tracking genuine value for pro-attitudes.  

  - **WKRs**: These are **state-given reasons**. They arise from *consequences of having the attitude itself*, irrespective of the object’s properties. Your cases are paradigmatic:  
    - *Admiration*: The threat provides a reason to admire (or cultivate admiration) to avoid suffering, but the being’s traits remain unchanged. Admiration isn’t fitting; the reason targets the *state* of admiring.  
    - *Desire*: The bribe incentivizes desiring mud, but mud’s intrinsic properties (dull, useless) are unaffected. The reason concerns the *benefit of desiring*, not desirability.  
    - *Belief*: A bribe to believe *p* targets the *state of believing* (to gain money), while evidence for *p* bears on *p*’s truth. WKRs for belief violate its truth-aim.  

  The core difference is thus **relational**: RKRs are reasons *for an attitude in virtue of the object*; WKRs are reasons *for an attitude in virtue of its consequences*.  

  ### (3) Boundaries and Pressure Points  
  **Key Pressure Points**:  
  - **Desire vs. Belief Analogy**: They are *structurally analogous* but *metaphysically distinct*. Both involve attitudes with constitutive standards (desirability/truth) and state-given incentives. However, desire is inherently tied to motivation and value, while belief aims at representation. WKRs for belief are widely rejected as genuine reasons (they threaten doxastic rationality), whereas WKRs for desire/admiration are often accepted as practical reasons *to cultivate* the attitude, even if not to hold it directly. This reflects a deeper split between theoretical and practical reason.  

  - **Commitment to "Appropriateness"**: The distinction **does not require realism** about intrinsic value. An expressivist or constructivist can still distinguish RKRs (reasons that align with the attitude’s internal standard) from WKRs (reasons that bypass it). For instance, an expressivist might say RKRs are considerations we’d appeal to in *defending* the attitude within our normative practices, while WKRs are external incentives. The distinction is formal: it relies on the *structure* of attitudes, not their objective grounding.  

  - **Hard Cases**:  
    - *Moral Reasons*: If you ought to admire a villain to prevent catastrophe, is this a WKR? Yes—it’s consequence-based, not fittingness-based—but it highlights how WKRs can be weighty.  
    - "Mere Preferability": Desiring something *because it is preferred* (e.g., by a god) blurs lines. If the god’s preference *makes* it desirable, this could be an RKR; if it merely threatens punishment, it’s a WKR. The boundary turns on whether the reason alters the object’s status.  

  ### (4) Verdict  
  The phenomenon is **a structural feature of normativity: reasons that target the consequences of holding an attitude rather than its fittingness to an object**. It is best defined as the **"Wrong Kind of Reasons Problem"**—specifically, *state-given reasons for attitudes with constitutive aims*. It is **not**:  
  - Merely about extrinsic vs. intrinsic motivation (e.g., desiring money for its own sake is RKR-based).  
  - A moral distinction (WKRs can be morally urgent).  
  - Dependent on value realism (the attitude/object structure is prior).  
  The recurring pattern across admiration, desire, and belief confirms a unified meta-normative puzzle: how to reconcile the "normative force" of WKRs with their failure to engage the attitude’s internal standard.
