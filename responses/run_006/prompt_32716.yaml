answer: |-
  Here's Pascal's Mugging translated into actuarial vocabulary, complete with a residue report on conceptual mappings:

  **The Policy Wording (Problem Restatement):**  
  You're approached by an entity ("The Mugger Re Ltd.") offering an infinitesimally probable, non-diversifiable, infinite-layer tail risk. They demand a premium (your wallet) under threat of an event with severity *S* → ∞ (e.g., planet-scale destruction) and occurrence probability *p* → 0⁺, such that the expected loss *E[L] = p × S* remains greater than your wallet's value. Crucially:  
  - This is **pure parameter uncertainty** (no credible data-generating process exists).  
  - The "risk" violates **tail independence assumptions** (single point of failure enables unlimited leverage).  
  - **No credible loss distribution** can be constructed – it's an unanchorable model.  

  **The Claims Experience (Standard Responses):**  
  1. **Probability Flooring:** Assign *p = 0* when risk is unmodelable (equivalent to excluding perils beyond regulatory frameworks like Solvency II's exclusion of "unquantifiable catastrophic risks").  
  2. **Bounded Utility:** Cap *S* at maximum plausible loss (e.g., Earth's GDP), as with **exposure limits** in cat bond indemnity triggers.  
  3. **Risk Load Explosion:** Apply a **loading factor λ(p) → ∞** as *p* → 0 when parameter uncertainty dominates process risk (Hürlimann's "uncertainty loading" principle).  
  4. **Ruin Constraint:** Reject any risk where *p × S > capital available* – the mugging fails the **insurability condition** (PC < PML).  

  **The Capital Adequacy Question (What's at Stake):**  
  The core conflict: **Expected value theory** demands we assign positive premium to any *p > 0*, but actuarial practice requires **statistical anchor points**. Without them, we face:  
  - **Unhedgeable basis risk** (no diversification)  
  - **Infinite tail variance** (VaR/LTV metrics break)  
  - **Model arbitrage** (anyone can fabricate "tail risks")  

  ---

  ### Residue Report: Conceptual Mappings  
  | **Pascal's Concept**          | **Actuarial Translation**                          | **Fidelity** |  
  |-------------------------------|---------------------------------------------------|--------------|  
  | *Unbounded utility (S → ∞)*   | Uncapped exposures (e.g., pandemic with no reinsurance ceiling) | ★★★☆☆ (We **always** cap liability via policy limits) |  
  | *Arbitrary probability claims* | Parameter risk with no data-generating process (e.g., alien invasion risk) | ★★★★☆ (Matches "unmodelable perils" exclusions) |  
  | *Expected utility hijack*     | Premium calculation without credibility weighting | ★★★★☆ (Directly analogous to using MLE without adjusting for parameter uncertainty) |  
  | *"Vanishingly small p"*       | Tail probabilities below empirical quantifiability (e.g., 1-in-10^9 years) | ★★★★★ (Core domain of extreme value theory limitations) |  
  | *The mugger's leverage*       | Tail dependence violating independence assumptions | ★★★☆☆ (Mugger assumes perfect correlation; we test copulas) |  

  **Unmappable Residues:**  
  1. **Epistemic Irresponsibility**: Actuaries reject risks lacking **causal mechanisms** (e.g., "magic" in contract terms). Philosophers debate *any* non-zero probability.  
  2. **Utility Monsters**: Our utility functions are bounded by **policy limits** and **insurable interest** – no "infinite harm" is contractible.  
  3. **Threat Authenticity**: Underwriting requires **corroborated exposure** (e.g., PML studies). Muggers offer no collateral.  

  ---

  **Your Key Question Answered:**  
  **Yes, actuarial practice has systematic defenses:**  
  - **Risk Loads → ∞**: Via **variance loading** when coefficient of variation → ∞ (e.g., *λ ∝ σ/μ* for heavy tails).  
  - **Undefined Premiums**: **Choquet premium principles** require capacities (probability measures); unanchorable risks have no measurable capacity.  
  - **Regulatory Exclusions**: Solvency II's "non-quantifiable risks" clause, IAIS's L3/L4 catastrophe tiers.  

  **This is not a rejection of expected utility theory** – it's an **operationalization within constraints**:  
  1. **Finiteness Axiom**: We bound *S* by maximum feasible loss (MFL).  
  2. **Credibility Thresholds**: Set *p_min* below which risks are uninsurable (e.g., nuclear war exclusions).  
  3. **Survival Priority**: **Ruin theory** dominates – no premium is charged if it requires capital beyond available equity.  

  **The Philosophical Gap**: Actuaries implicitly embed expected utility within a **pragmatic decision framework** that:  
  - Demands **statistical anchoring** (no data → no price)  
  - Prioritizes **systemic solvency** over theoretical consistency  
  - Treats "probability" as a **calibrated metric**, not a logical primitive  

  **Conclusion**: Pascal's Mugging is defanged by standard actuarial controls – it only "works" if you ignore the foundational constraints of insurability. Our refusal to price unquantifiable risks isn't a rejection of expected utility; it's the application of **metaprobabilistic hygiene** to prevent model hijacking. The mugger fails the underwriting audit.
