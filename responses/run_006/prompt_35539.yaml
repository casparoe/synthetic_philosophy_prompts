answer: |-
  Your diagnosis is astute: **the core disagreement is largely terminological but rests on deeper, substantive commitments about explanation.** Here's a breakdown:

  1.  **The Shared Core:** Both sides agree on the *phenomenology*: Mary gains a new, first-person, qualitative experience (quale) upon seeing red. She says "Wow!"

  2.  **The Terminological Dispute:** The fight is over how to *categorize* this gain:
      *   **Physicalists:** Define "facts" narrowly as objective, third-person, publicly accessible, physical/functional descriptions. Mary's gain is an *ability* (to recognize, imagine) or a new *mode of access/presentation* to old physical facts (about brain states). Calling it a "new fact" equivocates on the term.
      *   **Anti-Physicalists:** Define "facts" more broadly to include subjective, first-person, phenomenal truths. Mary gains a *genuine fact* (what red *is like*) that is non-physical (not captured by the objective physical sciences alone).

  3.  **The Substantive Underpinning:** Why dig in on these definitions? It stems from **divergent views on explanatory sufficiency**:
      *   **Physicalists:** Believe a complete physical description *explains everything real*. The "what it's like" is either reducible to physical processes or is an illusion/epiphenomenon. Mary's gain is merely *acquaintance* or *skill* within a physically explained system.
      *   **Anti-Physicalists:** Believe subjective experience (qualia) is a fundamental, irreducible aspect of reality. Physical descriptions, however complete, *fail to explain* the essence of consciousness ("the explanatory gap"). Mary's gain reveals this missing element – a genuinely new ontological fact.

  **What Would Move It?**
  *   **Empirical Progress:** If neuroscience could definitively show *how* specific neural activity *generates* specific, irreducible subjective feels (closing the explanatory gap), physicalism strengthens. If qualia remain stubbornly irreducible *despite* complete physical knowledge, anti-physicalism gains ground.
  *   **Conceptual Shift:** If we developed a rigorous, non-question-begging way to define "physical fact" that *includes* or *excludes* phenomenal properties by clear criteria, it could resolve the terminological impasse. Alternatively, abandoning the demand for "facts" in favor of different epistemic categories (knowing-how vs knowing-that, representation vs presentation) might reframe it.

  **What Would Change My Mind (About This Diagnosis)?**
  *   If someone demonstrated that Mary's *exclamation* ("Wow!") **must** signify learning a propositional fact (not just an ability or acquaintance) based purely on logic or uncontroversial semantics, I'd concede the dispute is more substantive than terminological.
  *   Conversely, if someone showed that all appeals to "phenomenal facts" are **necessarily** disguised reports of abilities or functional states, I'd lean harder into the verbal disagreement aspect.

  **Verdict:** While heavily entangled in semantics ("fact", "physical"), the debate points to a real, hard problem: **Can objective science fully account for subjective experience?** The disagreement is substantive *because* it reflects fundamentally different intuitions about what constitutes a complete explanation of consciousness. Resolving it likely requires both conceptual refinement *and* empirical breakthroughs concerning neural correlates of consciousness. Until then, the impasse persists.
