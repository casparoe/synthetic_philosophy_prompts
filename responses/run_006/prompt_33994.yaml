prompt: |-
  I'm a third-year undergraduate in a philosophy of law course, and I help run a student-led discussion group that meets outside class — about twelve people, mostly from philosophy, politics, and law, for ninety minutes. We've been working through the problem of promissory obligation: Hume's convention-based account, Scanlon's expectation view, and the deeper question of why a speech act of the form "I promise" can generate a reason to act that wasn't there before the utterance. The group can reconstruct the arguments, but nobody feels the force of the question — the positions stay on the page. I want to run a structured activity that makes the bindingness of promises show up as a live problem rather than a theoretical one.

  Design an activity for this group: a game, a role-play, or a structured deliberation with real (small) stakes, in which participants make promises to one another under systematically different conditions and discover, through their own reactions and choices, when a promise feels binding and when it doesn't. The rules or structure should be arranged so that participants run into the problem themselves: someone will feel genuinely obligated by a promise they made, someone else will feel released, and the group will have to make sense of the difference without yet having the theoretical vocabulary. The activity should surface the tension between the bare act of saying the words and the background conditions that make the act morally weighty — trust, the existence of a shared practice, the cost of being let down, the presence or absence of an audience, and so on.

  Include: the rules, any materials, and the setup; a timeline for the ninety minutes; the debrief that maps specific moments in the activity onto the philosophical terrain (Hume, Scanlon, or whichever framework the activity best illuminates); what will predictably go wrong the first time I run it and how I should handle it; and an honest note on which feature of promissory obligation the activity cannot reproduce and I will need to supply myself as facilitator.
reasoning: |-
  Hmm, the user is a third-year philosophy of law student running a discussion group on promissory obligation. They're struggling with making the theoretical concepts feel real to participants who can reconstruct arguments from Hume and Scanlon but don't feel the "force" of why promises create binding obligations. They want an activity where participants experience promise-making with real stakes to surface the tension between the speech act itself and the background conditions that give it moral weight.

  The core challenge here is bridging theory and lived experience. The group needs to feel the phenomenological weight of promissory obligation - when it "bites," when it dissolves, and why. Theoretical frameworks like Hume's convention-based account and Scanlon's expectation view remain abstract until participants viscerally experience situations where promises feel binding (or not) due to contextual factors.

  For the activity design, I need to create contained social microcosms where variables like mutual understanding, reliance, audience presence, and reciprocity can be manipulated. Small tangible stakes are crucial - not money or grades, but social capital within the group dynamic. The activity should generate noticeable tension between promise-makers and promise-receivers to mirror real-world dilemmas.

  A multi-round structure would work best, with each round altering one variable while holding others constant. Round 1 could establish a baseline with clear mutual understanding. Round 2 could introduce asymmetric information to test Scanlon's reliance principle. Round 3 might remove social enforcement to examine Hume's convention dependency. A final round could explore release conditions like mutual consent versus unilateral breach.

  For debriefing, I'll need to map specific moments to philosophical concepts: when participants felt obligation (Scanlon's Principle F), when conventions collapsed (Hume's artifice of virtue), and where speech acts felt hollow without supporting conditions. The facilitator should help name these experiences without imposing theory prematurely.

  Predictable failure points include participants being too performative rather than authentic, or the small stakes not feeling significant enough. Mitigation strategies include using physical tokens to make stakes tangible, seeding the groups with "confederates" to model authentic reactions, and careful framing to establish psychological safety for genuine responses.

  The inherent limitation is the activity's inability to replicate the temporal dimension of real promises - the lingering aftermath of breach and the social reputation costs that accumulate over time. The facilitator will need to explicitly bridge this gap during debriefing by inviting reflection on real-life promise experiences beyond the exercise.
answer: |-
  Here’s a structured role-play activity called **"The Promise Exchange"** designed to make promissory obligation tangible through lived experience. It creates micro-situations where participants feel the bindingness (or lack thereof) of promises and confronts the gap between utterance and obligation.

  ---

  ### **Activity: The Promise Exchange**  
  **Core Idea:** Participants negotiate and make small promises in pairs under varying conditions, then reflect on whether they feel obligated to keep them. The debrief connects their experiences to Hume, Scanlon, and the speech-act puzzle.

  **Materials:**  
  - Index cards (3 colors: Blue, Yellow, White)  
  - Pens  
  - Timer  
  - Small "stakes" (e.g., chocolate bars, extra credit points, or symbolic tokens)  
  - Whiteboard for debrief notes  

  **Setup (15 mins):**  
  1. **Introduce the Stakes:** Distribute 3 tokens to each participant (e.g., poker chips). Explain:  
     - Tokens can be traded for a reward at the end (e.g., 1 token = 1 candy bar).  
     - **Goal:** Maximize your tokens through promises.  
  2. **Assign Roles:**  
     - Divide into pairs (6 pairs total).  
     - Give each pair:  
       - 1 **Blue Card** (with a "promise task," e.g., "Promise to return 2 tokens tomorrow").  
       - 1 **Yellow Card** (with "context modifiers," e.g., "No witnesses allowed").  
       - 1 **White Card** (blank for custom promises).  
  3. **Explain Rules:**  
     - Each round lasts 8 mins. Pairs negotiate and make 1 promise per round.  
     - After making a promise, partners decide privately: *"Do I feel obligated to keep this?"* (Scale: 1–5).  
     - **Breach Penalty:** If you break a promise, you lose 1 token to your partner.  
     - **Keeper Bonus:** If you keep a promise, gain 1 token from the facilitator.  

  **Rounds (45 mins total: 3 rounds × 12 mins each):**  
  *(Each round alters one variable to surface philosophical tensions)*  

  | **Round** | **Card Used** | **Conditions**                                  | **Philosophical Target**                          |  
  |-----------|---------------|------------------------------------------------|---------------------------------------------------|  
  | 1         | Blue Card     | Standard promise + mutual understanding        | Baseline: Why does "I promise" create obligation? |  
  | 2         | Yellow Card   | Added constraints (e.g., no witnesses, no trust)| Hume: Role of convention/context                  |  
  | 3         | White Card    | Custom promises (e.g., absurd/impossible terms)| Scanlon: Reliance and expectation                 |  

  **Example Yellow Card Modifiers:**  
  - "Promise must be made in a crowded room (audience matters)."  
  - "You must secretly cross your fingers (intention vs. utterance)."  
  - "Promise receiver already doubts your trustworthiness."  

  **Example White Card Prompts:**  
  - "Promise something trivial you’d never do (e.g., lick the floor)."  
  - "Promise to give all tokens away if it rains tomorrow (unknowable outcome)."  

  **Debrief (30 mins):**  
  Guide discussion using participant experiences:  

  | **Activity Moment**              | **Philosophical Connection**                                                                 | **Debrief Question**                                                                 |  
  |----------------------------------|----------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|  
  | **Round 1 (Baseline):** Feeling obligated despite no "cost" yet | **Scanlon's Principle F:** Promises create expectations that harm if violated.               | *"Why did you feel bound even without penalties? What did your partner rely on?"*    |  
  | **Round 2 (Modified):** Feeling released by crossed fingers/no audience | **Hume's Conventions:** Obligation requires social practices + mutual recognition.        | *"Did the lack of witnesses/intent dissolve obligation? Is a promise just words?"*   |  
  | **Round 3 (Absurd):** Refusing to make/keep impossible promises | **Speech-Act Theory:** "I promise" only works under felicity conditions (sincerity, ability).| *"When does 'I promise' fail? Is it the words or the context that binds us?"*         |  
  | **Voluntary vs. Coerced Promises:** e.g., "I only promised to get tokens!" | **Autonomy & Duress:** Moral weight requires voluntary commitment.                         | *"Did 'bad' promises still bind? What if you were pressured?"*                      |  

  **Predictable Problems & Fixes:**  
  - **Problem:** Participants treat it as a game (not taking promises seriously).  
    **Fix:** Emphasize real stakes ("Tokens = candy!"). Ask: *"How did it feel when someone broke a promise to YOU?"*  
  - **Problem:** Debrief stays anecdotal (fails to connect to theory).  
    **Fix:** Use a whiteboard to map quotes like "I felt guilty because she trusted me" → Scanlon’s "loss of confidence."  
  - **Problem:** Uneven engagement (shy participants stay quiet).  
    **Fix:** Use think-pair-share: *"Turn to your partner: when did you feel most obligated? Why?"*  

  **Honest Limitation:**  
  The activity **cannot replicate long-term relational consequences**. In real life, breaking a promise damages reputations/trust cumulatively over time. Here, breaches are transactional (lose 1 token). As facilitator, you must highlight this gap:  
  > *"In this game, a broken promise costs a token. But in life, it might cost a friendship. That lingering relational harm—the shadow of future distrust—is where promissory obligation gains its deepest weight. Scanlon calls this the 'value of assurance'; Hume ties it to social stability. This is what mere words are trying to hold together."*

  ---

  **Why This Works:**  
  - Participants **experience** obligation as a felt tension (e.g., guilt when breaching, betrayal when let down).  
  - Variables (audience, trust, absurdity) **surface conditions** for bindingness organically.  
  - Low stakes keep it safe but **real enough** to trigger moral emotions.  
  - The debrief **translates lived tension into theory**, making Hume/Scanlon "solve" problems they’ve already felt.  

  **Run it tight, and your group won’t just discuss promises—they’ll feel their weight.**
