answer: |-
  Here are five candidate points of rejection and their costs:

  1.  Reject (1)'s characterization of change as the *object itself* intrinsically possessing incompatible properties; instead, properties are always instantiated relative to times (e.g., "green-at-t1", "yellow-at-t2"). This relativization avoids the contradiction in (4) but costs a straightforward ontology of properties, requiring time-indexed properties or an account of how temporal location fundamentally modifies instantiation (e.g., adverbial modification).

  2.  Reject (2)'s application to non-simultaneous properties; non-contradiction only forbids simultaneous possession of incompatible properties. This saves endurantism from (4) but costs the intuitive idea that objects bear properties *simpliciter* at times, requiring properties to be fundamentally relational or time-indexed in a way weakens their intrinsic nature.

  3.  Reject (6)'s claim that perdurantism makes change unreal for the persisting object; the whole banana genuinely changes by having different intrinsic properties at its different temporal parts. This accepts perdurantism's solution to (4) but costs commitment to the existence of temporal parts and the idea that change involves the *whole* object successively bearing properties directly.

  4.  Reject (3) and (4)'s implication that the enduring object *simpliciter* possesses the incompatible properties; strictly speaking, it's the banana-at-t1 that is green and banana-at-t2 that is yellow, distinct temporal manifestations of the same enduring object. This modifies endurantism to avoid (4) but costs introducing quasi-parts (temporal manifestations) or a distinction between the object and its time-slices/stages, blurring strict identity claims.

  5.  Reject the exclusivity implied in (7); a third option exists (e.g., exdurantism/stage theory) where only momentary stages exist and "persistence" is counterpart relations, avoiding contradiction. This dodges the dilemma but costs denying that ordinary objects persist through time in any robust sense, making persistence derivative or conceptual.
