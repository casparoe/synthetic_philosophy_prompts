prompt: |-
  I started a company a couple years ago and I keep getting the same advice from older founders: that I should deliberately get myself to believe things that aren't quite true, or at least get myself into states that aren't rational, because it'll make me more credible. I've been trying to figure out what I actually think about this by going through cases, and I want to know what principle, if any, is behind my gut calls.

  Here are my verdicts:

  - The stranded hiker. I'm lost and a driver will only rescue me if I promise to pay him a lot once I'm safe. We both know that once I'm safe I'll have no reason to pay, so a plain promise won't work. If I could take a pill that would make me the sort of person who keeps promises even when it costs me, I think it would be rational to take it, even though later I'll pay out money for no benefit. Fine.

  - The sales call. Before a big pitch, I can sometimes talk myself into genuinely believing my product is better than it is, and I sell better when I do. I think this is probably rational, or at least fine, though it makes me uncomfortable.

  - The mugging. If someone's threatening me and I could take a pill that makes me genuinely furious and willing to fight a guy with a knife, which might scare him off, I think that's not rational. The state might get me killed and I can't control what it does once it's there.

  - The pure belief bet. Someone offers me alot of money if, by Friday, I genuinely believe my company is worth far more than it is, and they'll pay me before I have to act on the belief in any way. I don't think I can just decide to believe it, and I don't think it's rational to try. This one feels completely different from the hiker, but I can't say why.

  - The locked account. I moved some savings into an account with a withdrawal penalty so my future self can't blow it. That's obviously rational, but it doesn't feel like irrationality at all, just tying my own hands.

  Is there one principle that gets all of these, or close? What seperates the hiker and the sales call from the mugging and the belief bet? And what would the principle say about a case I keep going back and forth on: I could take a pill that makes me forget a humiliating failure so I'm more confident in meetings, where the confidence itself is the only thing that changes. Also tell me which of my verdicts the principle forces me to give up, if any.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a founder getting advice to embrace irrationality for credibility, and they've shared five scenarios with their gut reactions. The core tension seems to be between instrumental rationality (doing what works) and epistemic rationality (believing what's true). 

  First, I notice the stranded hiker case is about self-modification to solve a commitment problem. The user approves this, which makes sense - it's a classic Schelling point strategy where the irrationality serves as a binding mechanism. The locked account example fits here too, as a precommitment device. 

  The sales call scenario is trickier. The user feels uneasy but allows it. Here the "irrational" belief functions as a performance enhancer with low stakes - if the belief helps close deals without causing downstream harm, it's pragmatically justified. But I see why they're uncomfortable; it brushes against integrity. 

  Now the mugging case clearly crosses a line. Inducing rage isn't just irrational but dangerous - it removes their ability to weigh options situationally. The belief bet fails for different reasons: it's impossible to directly control beliefs, and even if possible, the belief itself has no functional purpose beyond the bet. 

  The humiliation pill case is fascinating. Forgetting might boost confidence, but at what cost? If the memory contains useful lessons, suppression could be detrimental. Yet if it's truly paralyzing trauma with no informational value, maybe forgetting is like removing a mental parasite. 

  Their verdicts mostly hold up under a "pragmatic self-modification" framework: allow changes that (1) solve concrete problems (2) with reversible/controllable effects (3) without corrupting truth-seeking generally. The mugging pill fails (2), the belief bet fails (1) and (3). 

  I should push them to consider: in the sales call, does faked enthusiasm risk self-deception that could blind them to needed product changes? And for the humiliation pill - is confidence really the blocker, or could skill-building achieve the same without memory alteration?
answer: |-
  Your gut calls reveal a consistent principle: **Pragmatic Self-Modification (PSM)**.  
  This principle allows temporary or controlled irrationality **only when it solves a specific problem without corrupting your overall decision-making capacity**, and **where the benefits clearly outweigh irreversible risks**.  

  ### The Core Principle:
  | **Case**               | **Rational?** | **Why? (PSM Analysis)**                                                                 |
  |------------------------|---------------|-----------------------------------------------------------------------------------------|
  | Stranded Hiker (Pill)  | Yes           | Solves a **specific commitment problem**. Alters a **trait** (honor), not situational judgment. Reversible after payoff. |
  | Sales Call (Self-Belief) | Yes/Uncertain | Boosts **performance in a bounded context**. Belief auto-corrects post-pitch. Low risk if self-aware. |
  | Mugging (Rage Pill)    | No            | **Destroys situational judgment**. Uncontrollable; risks lethal overreaction. Irreversible mid-crisis. |
  | Pure Belief Bet        | No            | **No functional purpose** beyond the bet. Undermines epistemic integrity for zero problem-solving gain. |
  | Locked Account         | Yes           | Not irrational! **Precommitment device** that preserves rationality by blocking future impulsivity. |

  ---

  ### Why Your Verdicts Hold (Mostly):
  1. **The Hiker vs. Belief Bet Distinction**:  
     - The hiker pill solves a **tangible coordination problem** (enforcing promises).  
     - The belief bet is **epistemically corrupt**—belief is manipulated for arbitrary reward, not problem-solving.  
     *PSM forbids self-deception when it has no instrumental value.*  

  2. **Sales Call vs. Mugging Distinction**:  
     - Sales self-belief is **context-limited** and **self-correcting** (you know you’re hyping).  
     - Mugging rage **hijacks agency**—you can’t "switch off" fury mid-fight. PSM rejects losing control.  

  3. **Locked Account**:  
     Fits PSM perfectly: it’s a **rational constraint on future irrationality**, not present irrationality.  

  ---

  ### The Humiliation Pill Case:  
  - **Your Principle Says: NO, It’s Not Rational.**  
    - **Why?** Forgetting humiliation destroys **valuable feedback** (failure teaches). Confidence from amnesia is **decoupled from competence**, risking repeated errors.  
    - Unlike the sales call (temporary boost), this pill **permanently alters your self-narrative**, corrupting self-knowledge.  
    - PSM only endorses altering states that **enhance capability** (e.g., hiker’s honor, sales passion). Amnesia only masks symptoms.  

  ---

  ### Where Your Principle Might Challenge Your Verdicts:
  - **Sales Call Self-Belief**: PSM tolerates it but flags risk. If exaggerated belief prevents you from **improving your product** post-sale, it fails PSM’s "no systemic corruption" rule. Your discomfort hints at this.  
  - **Stranded Hiker**: You must accept that the pill **temporarily makes you irrational** (paying when unnecessary). PSM permits this only because it’s a one-time tradeoff with no spillover effects.  

  ---

  ### Key Tests for PSM:
  Ask:  
  1. **Does this solve a concrete problem?** (Hiker: yes; Belief Bet: no)  
  2. **Can I contain the irrationality?** (Sales: yes; Mugging: no)  
  3. **Does it preserve my long-term rationality?** (Locked account: yes; Amnesia: no)  
  4. **Are risks reversible/controlled?** (Hiker: after rescue; Mugging: never)  

  **Final Take**: Your intuition aligns with **instrumental rationality**—using irrationality only as a targeted tool, never letting it become the master. The humiliation pill fails because it trades self-awareness for placebo confidence. Stay wary of advice that glorifies delusion; your gut is wiser.
