prompt: |-
  Hey — I'm a journalist who covers science and ideas, and I've got a shot at this six-month "journalist in residence" fellowship at a university philosophy department. It's meant to fund a project that sits somewhere between journalism and academic philosophy. I need to submit a two-page proposal and I've been chewing on this idea for a while but I can't seem to get it into proposal shape. Every time I try to write it up it just sounds like a magazine pitch, not a research project.

  The topic is Dennett's "competence without comprehension" — the two strange inversions of reasoning. Darwin showed you can get design without a designer (natural selection is mindless but produces exquisite functional fit), and Turing showed you can get intelligent-seeming behavior without an intelligent understander (a machine following rules can do things we'd call smart). I've been covering AI for years and I keep noticing that people invoke this Darwin-Turing parallel constantly, especially when arguing that LLMs don't need to "understand" anything to be genuinely capable, or that the whole concept of understanding is a red herring. But I've started to suspect the analogy is doing more work than it can actually bear — that the two cases are importantly different in ways that matter for the AI debate. Like, Darwinian evolution produces competence through a process that has literally no goals at all, no forward-looking anything, whereas Turing-style computation is executing a program that someone designed with specific purposes in mind. The "comprehension" that's missing is missing in different ways, and maybe that difference has consequences for what we should and shouldn't conclude about AI systems today.

  What I want the fellowship project to do is: actually dig into whether the Darwin-Turing parallel is philosophically tight or just rhetorically convenient, and then spell out what the answer means for how we should think about the capabilities and limitations of current AI — especially the claim that "they dont need to understand to be competent." I don't want to just write a feature article; I want to do the conceptual work of mapping out the analogy, seeing where it holds and where it snaps, and then drawing out the implications in a way that actually advances the conversation rather than just summarizing it.

  So I need you to turn this into a proper proposal. It should include: a precise statement of the research question (not just "is the analogy good or bad" but something with more grip, something that has a determinate answer), an explanation of why existing positions don't settle it (you can refer to arguments and positions by name — I'll fill in the actual citations later), a method section that says what I'd actually do month by month across the six months, and an honest statement of what would count as the project failing versus succeeding. Also, since I'm a journalist not a card-carrying philosopher, the proposal should acknowledge that upfront and explain why a journalist's approach — interviewing philosophers, tracing how the idea actually gets used in public discourse, pressure-testing philosophical claims against real-world cases — is a strength here rather than a liability. The deliverable would be a long-form essay plus a shorter research paper or whitepaper that makes the philosophical argument in a more structured way.

  And at the very end, give me a one-sentence summary of the proposal as the last line, like something I could drop into an email subject line.
