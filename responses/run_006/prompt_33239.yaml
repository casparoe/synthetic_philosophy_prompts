answer: |-
  **Bottom line: Expected utility theory blocks fanatical conclusions by requiring utility functions to be bounded, which prevents infinite or arbitrarily high expected utilities from dominating all other considerations.**

  **Reasoning:**  
  1. **The Fanaticism Problem:** Unbounded utility functions allow outcomes with astronomically low probabilities (e.g., \(10^{-100}\)) and arbitrarily high utilities (e.g., \(10^{100}\)) to dominate rational choice, as their expected utility (\(EU = p \cdot u\)) can dwarf all finite, certain outcomes—demanding we sacrifice everything for such lotteries (e.g., "Pascal's Mugging").  

  2. **Bounded Utility as the Solution:** Expected utility theory permits utility functions to be *bounded* (e.g., \(u(\cdot) < K\) for some finite \(K\)). This ensures no outcome, no matter how extreme, can contribute infinite or arbitrarily large expected utility. For example, if utility is capped at \(K = 10^{6}\), a payoff of \(10^{100}\) utils is impossible, and tiny probabilities cannot overwhelm finite stakes.  

  3. **Justification Within EU Theory:**  
     - **Continuity Axiom:** Unbounded utility violates the continuity axiom (or implies pathological preferences). If \(u\) is unbounded, there exists a sequence of outcomes where \(u(x_n) \to \infty\), forcing trade-offs where any probability \(p > 0\) of \(x_n\) outweighs all finite losses—making rational prioritization impossible.  
     - **Empirical Realism:** Bounded utility aligns with observed behavior: humans (and rational agents) discount extreme tail risks and prioritize finite, probable gains over infinitesimal chances of utopia.  
     - **Consistency:** A bounded \(u\) preserves all EU axioms (completeness, transitivity, independence, continuity) while avoiding spurious infinities.  

  4. **No Question-Begging:** The move isn't ad hoc; boundedness follows from EU’s mathematical coherence. If utilities could be unbounded, EU maximization becomes undefined or requires arbitrary truncation. Thus, boundedness isn’t imposed *to avoid* fanaticism but to ensure EU is a well-defined criterion for rationality under uncertainty.  

  **Alternative Approaches:** While bounded utility is primary, some theories:  
  - Use *weighted expected utility* to discount extreme probabilities.  
  - Adopt *contextualist* utility scales (e.g., domain-specific bounds).  
  - Introduce *lexical priorities* (e.g., safety first) — though this may violate continuity.
