  Below, I present a two-envelope case where switching is always favorable after seeing the amount in your envelope. The prior is a proper probability distribution over finite whole-dollar amounts, explicitly defined. I provide the prior, expected-value calculations for two specific amounts, and an explanation.

  ### Prior Distribution
  The envelopes contain pairs of amounts \((s, 2s)\), where \(s\) (the smaller amount) is a power of 2: \(s = 2^k\) for nonnegative integers \(k = 0, 1, 2, \ldots\). The probability that the smaller amount \(s\) equals \(2^k\) is:
  \[
  P(s = 2^k) = \frac{1}{3} \left(\frac{2}{3}\right)^k.
  \]
  - **Verification that this is proper**: The total probability sums to 1:
    \[
    \sum_{k=0}^{\infty} P(s = 2^k) = \sum_{k=0}^{\infty} \frac{1}{3} \left(\frac{2}{3}\right)^k = \frac{1}{3} \cdot \frac{1}{1 - \frac{2}{3}} = \frac{1}{3} \cdot 3 = 1.
    \]
  - **Possible amounts**: The amounts in the envelopes are always powers of 2 (e.g., $1, $2, $4, $8, ...). All amounts are finite whole dollars.

  ### Expected Value Calculation
  When you open an envelope and see amount \(A\), the other envelope contains either \(\frac{A}{2}\) or \(2A\). The expected value of switching is:
  \[
  E[\text{switch}] = \left( \frac{A}{2} \right) \cdot P(\text{other} = \tfrac{A}{2} \mid \text{see } A) + (2A) \cdot P(\text{other} = 2A \mid \text{see } A).
  \]
  We calculate this for \(A = 2\) and \(A = 4\).

  #### Case 1: \(A = 2\)
  - **Ways to see $2**:
    1. Pair is \((1, 2)\) and you picked the larger envelope (so you see $2).
    2. Pair is \((2, 4)\) and you picked the smaller envelope (so you see $2).
  - **Probabilities**:
    - \(P(\text{pair } (1, 2)) = P(s = 1) = P(s = 2^0) = \frac{1}{3}\).
      - Probability of seeing $2 from this pair: \(P(\text{see } 2 \mid (1, 2)) = \frac{1}{2}\) (you must pick the larger).
      - Joint probability: \(\frac{1}{3} \cdot \frac{1}{2} = \frac{1}{6}\).
    - \(P(\text{pair } (2, 4)) = P(s = 2) = P(s = 2^1) = \frac{1}{3} \cdot \frac{2}{3} = \frac{2}{9}\).
      - Probability of seeing $2 from this pair: \(\frac{1}{2}\) (you must pick the smaller).
      - Joint probability: \(\frac{2}{9} \cdot \frac{1}{2} = \frac{1}{9}\).
  - **Total probability of seeing $2**:
    \[
    P(\text{see } 2) = \frac{1}{6} + \frac{1}{9} = \frac{3}{18} + \frac{2}{18} = \frac{5}{18}.
    \]
  - **Conditional probabilities**:
    - \(P(\text{other} = \tfrac{2}{2} = 1 \mid \text{see } 2) = P(\text{from pair } (1, 2) \mid \text{see } 2) = \frac{1/6}{5/18} = \frac{3}{5}\).
    - \(P(\text{other} = 2 \cdot 2 = 4 \mid \text{see } 2) = P(\text{from pair } (2, 4) \mid \text{see } 2) = \frac{1/9}{5/18} = \frac{2}{5}\).
  - **Expected value of switching**:
    \[
    E[\text{switch} \mid \text{see } 2] = \left( \frac{2}{2} \right) \cdot \frac{3}{5} + (2 \cdot 2) \cdot \frac{2}{5} = (1) \cdot \frac{3}{5} + 4 \cdot \frac{2}{5} = \frac{3}{5} + \frac{8}{5} = \frac{11}{5} = 2.2.
    \]
    Since \(2.2 > 2\), switching is favorable.

  #### Case 2: \(A = 4\)
  - **Ways to see $4**:
    1. Pair is \((2, 4)\) and you picked the larger envelope (so you see $4).
    2. Pair is \((4, 8)\) and you picked the smaller envelope (so you see $4).
  - **Probabilities**:
    - \(P(\text{pair } (2, 4)) = \frac{2}{9}\).
      - Probability of seeing $4 from this pair: \(\frac{1}{2}\).
      - Joint probability: \(\frac{2}{9} \cdot \frac{1}{2} = \frac{1}{9}\).
    - \(P(\text{pair } (4, 8)) = P(s = 4) = P(s = 2^2) = \frac{1}{3} \cdot \left(\frac{2}{3}\right)^2 = \frac{4}{27}\).
      - Probability of seeing $4 from this pair: \(\frac{1}{2}\).
      - Joint probability: \(\frac{4}{27} \cdot \frac{1}{2} = \frac{2}{27}\).
  - **Total probability of seeing $4**:
    \[
    P(\text{see } 4) = \frac{1}{9} + \frac{2}{27} = \frac{3}{27} + \frac{2}{27} = \frac{5}{27}.
    \]
  - **Conditional probabilities**:
    - \(P(\text{other} = \tfrac{4}{2} = 2 \mid \text{see } 4) = P(\text{from pair } (2, 4) \mid \text{see } 4) = \frac{1/9}{5/27} = \frac{3}{5}\).
    - \(P(\text{other} = 2 \cdot 4 = 8 \mid \text{see } 4) = P(\text{from pair } (4, 8) \mid \text{see } 4) = \frac{2/27}{5/27} = \frac{2}{5}\).
  - **Expected value of switching**:
    \[
    E[\text{switch} \mid \text{see } 4] = \left( \frac{4}{2} \right) \cdot \frac{3}{5} + (2 \cdot 4) \cdot \frac{2}{5} = (2) \cdot \frac{3}{5} + 8 \cdot \frac{2}{5} = \frac{6}{5} + \frac{16}{5} = \frac{22}{5} = 4.4.
    \]
    Since \(4.4 > 4\), switching is favorable.

  ### Why Switching is Always Favorable
  For any observed amount \(A = 2^k\):
  - The conditional probability that \(A\) is the smaller amount (so the other is \(2A\)) is \(\frac{2}{5}\).
  - The conditional probability that \(A\) is the larger amount (so the other is \(\frac{A}{2}\)) is \(\frac{3}{5}\).
  - The expected value of switching is:
    \[
    E[\text{switch}] = \frac{A}{2} \cdot \frac{3}{5} + 2A \cdot \frac{2}{5} = \frac{3A}{10} + \frac{4A}{5} = \frac{3A}{10} + \frac{8A}{10} = \frac{11A}{10} = 1.1A > A.
    \]
  This holds for all \(A\) in the support (powers of 2).

  ### Feature of the Prior Doing the Work
  The key feature is the **geometric decay** of the prior probability \(P(s = 2^k) = \frac{1}{3} (\frac{2}{3})^k\). This decay ensures that for any observed amount \(A = 2^k\), the pair \((A/2, A)\) (which requires \(s = A/2\)) has prior probability \(\frac{3}{2}\) times higher than the pair \((A, 2A)\) (which requires \(s = A\)):
  \[
  P(s = A/2) = P(s = 2^{k-1}) = \frac{1}{3} \left(\frac{2}{3}\right)^{k-1} = \frac{3}{2} \cdot \frac{1}{3} \left(\frac{2}{3}\right)^k = \frac{3}{2} P(s = A).
  \]
  However, when you see \(A\), you are equally likely to have picked either envelope in a given pair. Thus, the likelihood of seeing \(A\) from the pair \((A/2, A)\) is proportional to \(P(s = A/2)\), and from \((A, 2A)\) it is proportional to \(P(s = A)\). The ratio of these likelihoods is \(P(s = A/2) : P(s = A) = 3:2\), making it \(\frac{3}{5}\) likely that \(A\) came from the pair \((A/2, A)\) (where it is the larger amount) and \(\frac{2}{5}\) likely from \((A, 2A)\) (where it is the smaller). The potential gain from switching to \(2A\) (when \(A\) is smaller) outweighs the loss from switching to \(A/2\) (when \(A\) is larger), resulting in an expected gain of \(1.1A\).

  ### Response to Symmetry Objection
  Someone who insists the envelopes are symmetric before opening might argue: "Before seeing the amount, the two envelopes are indistinguishable, so switching cannot possibly be advantageous." However, in this case, the prior distribution breaks the symmetry **conditionally** once the amount is observed. The prior assigns higher probability to pairs with smaller base amounts (e.g., \((1, 2)\) is more likely than \((2, 4)\), which is more likely than \((4, 8)\), etc.). Thus, when you observe a specific amount \(A\), it provides information about which pair you are likely in, making switching advantageous. Unconditionally (before opening), the expected values of both envelopes are infinite (since \(E[\text{amount}] = \sum_{k=0}^{\infty} 2^k \cdot \frac{1}{3} (\frac{2}{3})^k + \sum_{k=0}^{\infty} 2^{k+1} \cdot \frac{1}{3} (\frac{2}{3})^k\) diverges), but conditionally, the expected value of switching is always higher. The symmetry objection holds only when the prior is symmetric under swapping (e.g., uniform), but this prior is intentionally asymmetric in the pair probabilities.
