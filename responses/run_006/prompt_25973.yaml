prompt: |-
  I'm stuck on a passage from Mill's *On Liberty* that everyone argues about—the one where he carves out an exception for "backward states of society." The gist is roughly: despotism is a legitimate mode of government in dealing with barbarians, provided the end be their improvement and the means actually effect that end; liberty, as a principle, has no application to any state of things anterior to the time when mankind have become capable of being improved by free and equal discussion. I'm not quoting verbatim, but thats the idea. I understand the background is British rule in India. What I can't figure out is the internal logic: if free and equal discussion is what drives moral and intellectual progress (which he spends the rest of the book argueing), how could a despotism ever bring people to the point where they're ready for liberty? Does he think the despot can somehow simulate that progress unilaterally, or is he just punting on the problem? I need someone to walk me through the tension. Give me your bottom line up front and then the reasoning, no preamble, no "You're asking about..."
