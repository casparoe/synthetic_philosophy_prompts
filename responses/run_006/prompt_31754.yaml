answer: |-
  You've hit on one of the most fascinating and contentious areas in pragmatics! What you're describing is the phenomenon of **conventionalized implicatures** (sometimes called **generalized conversational implicatures** or **GCIs**), specifically **scalar implicatures** that have become **lexicalized** or **semantically strengthened**. But let's break down the distinctions you're asking for:

  ### 1. **The Established Terms & Their Core Differences**
     - **Literal Meaning (Semantics):** What is *logically* entailed by the words, independent of context. "Some" semantically means "at least one, possibly all." Cancellation is impossible without contradiction: "I ate some cookies, in fact I ate none" is a logical contradiction.
     - **Conversational Implicature (Particularized):** Inferred meaning derived *on the fly* from context + Grice's Cooperative Principle (CP). Highly cancellable.  
       *Example:* "She’s warm" → "She’s not kind" in a context where kindness is relevant. Cancellation ("but very kind!") feels natural because the inference was context-dependent.
     - **Conventionalized Implicature (Generalized Scalar Implicature):** Your "middle zone." An inference triggered *by default* with specific expressions (like "some," "or," "possible"), due to lexical alternatives on a scale (⟨all, some⟩, ⟨and, or⟩, ⟨certain, possible⟩). It feels "baked in" because:
        - It arises without specific contextual cues.
        - Cancellation feels **marked** (awkward or contradictory-sounding).
        - It’s processed almost instantly (psycholinguistic evidence shows faster processing than particularized implicatures).

  ### 2. **Why "Some" Feels Different: Lexicalization/Semantic Strengthening**
     Your intuition is spot-on. For expressions like "some," the scalar implicature ("not all") has become so routinized that it’s effectively **lexicalized**:
     - **Psychological Entrenchment:** Through frequent use, "some + not all" becomes a stored unit. No conscious inference is needed; it’s retrieved directly from memory.
     - **Cancellation Difficulty:** "I ate some, in fact all" sounds contradictory because the strengthened meaning ("some but not all") has become the default interpretation. Cancelling it violates strong expectations, creating a pragmatic clash. It’s not logically contradictory, but it *feels* like it is.
     - **Contrast with Particularized Implicature:** "She’s warm" doesn’t inherently imply "unkind"; that inference relies entirely on context (e.g., discussing personalities). Hence, cancellation is effortless.

  ### 3. **Boundary Cases: Where Things Get Fuzzy**
     The spectrum isn’t rigid. Key boundaries and gray areas:
     - **Literal Meaning vs. Conventionalized Implicature:**  
       *Boundary Test:* Cancellation.  
       - Literal: Cancellation impossible (logical contradiction).  
       - Conventionalized Implicature: Cancellation *possible* but pragmatically odd.  
       *Gray Area:* "Have you stopped cheating?" Presupposes you *were* cheating. Cancellation ("I never cheated!") is possible but feels defensive because the presupposition is conventionalized.

     - **Conventionalized vs. Particularized Implicature:**  
       *Boundary Test:* Default Triggering & Context-Dependence.  
       - Conventionalized: Arises without context (e.g., "Some cookies are gone" → not all).  
       - Particularized: Requires specific context (e.g., "John has a PhD" → "He's not street-smart" only if discussing practicality).  
       *Gray Area:* "Can you pass the salt?" (conventionally implies a request). In most contexts, it’s automatic; but if discussing physical ability ("Can you lift it?"), the literal meaning resurfaces.

     - **Conventionalized Implicature vs. Semantic Ambiguity:**  
       *Boundary Test:* Systematicity & Scale Dependence.  
       - Ambiguity: Multiple unrelated meanings (e.g., "bank" = river/finance).  
       - Conventionalized Implicature: Systematic inference tied to a lexical scale (⟨all, some⟩, ⟨certain, possible⟩).  
       *Gray Area:* "Or" (inclusive vs. exclusive). Historically, "A or B" implicated "not both" via scalar implicature. In many contexts now, it’s lexicalized as exclusive ("You can have cake or ice cream" → not both).

  ### 4. **Key Theoretical Debates**
     - **Gricean View:** Strictly pragmatic. "Some" semantically means "at least one"; "not all" is a default inference from the CP.
     - **Relevance Theory:** Rejects default implicatures. All inferences are context-driven, but "some" makes "not all" highly salient due to relevance.
     - **Literalist/Semantic View:** Argues "some" has been reanalyzed as *lexically meaning* "some but not all" in many contexts (semantic change).
     - **Experimental Evidence:** Psycholinguistics shows:
       - "Some" is processed faster with "not all" than with "possibly all" contexts.
       - Cancellation slows processing and increases brain activity (N400/P600 effects), suggesting conflict with a strong expectation.

  ### Why This Matters for Your Realization
  Your recurring fight likely involves **mismatched default interpretations**. When you say "some," you might intend the semantic meaning ("at least one"), while your partner hears the conventionalized implicature ("not all"). This isn't about "words vs. between words"—it's about how language *conventionalizes* inferences until they feel like part of the word itself. The friction arises when one person treats an implicature as cancellable ("I just meant some, possibly all!"), while the other treats it as non-negotiable ("But you said *some*!").

  In essence: You're grappling with how **pragmatic inferences fossilize into quasi-semantic meaning**. The boundary is fluid, culturally mediated, and constantly evolving—which is why communication remains beautifully messy.
