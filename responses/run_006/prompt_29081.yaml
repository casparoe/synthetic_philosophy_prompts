answer: |-
  Here are exactly five objections, ordered by damage level (most damaging first), phrased as the audience would, with the one you hope nobody asks at #1:

  1.  (Most Damaging - The One You Hope Nobody Asks) "If cluelessness is genuinely irreducible and pervasive for consequentialist assessment, doesn't that constitute the *defining condition* of complex moral agency under consequentialism rather than a defect? Your 'structural flaw' might just *be* the structure – demanding guidance where none is possible isn't a failure of the theory, but a category error in expecting certainty."  
  2.  "You dismiss heuristics and expected value reasoning too quickly by demanding they provide *optimal* guidance; but consequentialism only requires *better-than-random* guidance under uncertainty to remain action-guiding, and robust heuristics often achieve this comparative function even under cluelessness."  
  3.  "Your critique seems to assume a narrow, maximization-focused version of consequentialism. Doesn't sophisticated decision theory under deep uncertainty – like using ambiguity aversion, minimax regret, or ex ante Pareto principles – provide structurally sound, genuinely consequentialist guidance precisely *when* expected value calculations fail?"  
  4.  (Likely from a Virtue Ethicist) "Isn't the 'structural defect' you identify inherent to *any* project of codifying morality into universally applicable decision procedures? Cluelessness merely highlights why we need the context-sensitive practical wisdom central to virtue ethics, suggesting the flaw isn't specific to consequentialism but endemic to the Enlightenment project of moral theory you're both engaged in."  
  5.  (Least Damaging - Likely from an Epistemologist/Decision Theorist) "Granted, cluelessness is deep, but isn't your 'structural defect' claim conflating an epistemic limitation with a normative one? Consequentialism *defines* the right act (maximizing value); its inability to *identify* it under radical uncertainty is an epistemic, not structural, failure – the 'guidance' claim might simply be conditional on available knowledge, which is often limited."
