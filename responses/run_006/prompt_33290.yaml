answer: |-
  ### Exam Question  
  **Decision Theory and the Pasadena Paradox:**  
  Consider the original Pasadena game (payoff = \((-1)^{n-1} \cdot 2^n / n\) for heads-first on flip \(n\)) and its scaled-up variant, the Altadena game (payoff = \((-1)^{n-1} \cdot 2^n / n + 1\) for the same flip outcomes).  

  (a) Explain why the expected value (EV) of both games is undefined under standard decision theory, emphasizing why "conditional convergence" creates a problem beyond mere mathematical indeterminacy.  

  (b) Suppose you face two choices:  
  - **Choice 1:** Play the Pasadena game.  
  - **Choice 2:** Play the Altadena game.  
  Argue whether either choice *dominates* the other (in the strict or weak sense) or satisfies *stochastic dominance*. Justify your reasoning formally using the payoff structures.  

  (c) Critically evaluate whether dominance reasoning (or stochastic dominance) can resolve rational choice in this pair of games. Does your conclusion generalize to real-world decisions with undefined EV (e.g., high-stakes investments with fractal risk distributions)? Discuss.  

  *(600 words maximum for parts b & c combined)*  

  ---

  ### Model Answer (595 words)  

  **(a)** The EV of both games involves the conditionally convergent series \(\sum (-1)^{n-1} \cdot 2^n / n\) (Pasadena) and \(\sum [(-1)^{n-1} \cdot 2^n / n + 1]\) (Altadena). Conditional convergence implies that the series sum depends on the *order* of summation. Since the outcomes correspond to a temporal sequence of coin flips (order-fixed), no unique EV exists. The problem isn’t just mathematical indeterminacy—it’s that *any* reordering of terms (e.g., grouping gains/losses differently) yields a different "EV," undermining the normative force of EV maximization. Rational agents cannot compare options using a non-existent EV.  

  **(b)** Neither choice strictly or weakly dominates the other, and neither stochastically dominates the other.  
  - **Dominance Failure:** For weak dominance, we need \(u_2(\omega) \geq u_1(\omega)\) for all states \(\omega\) (flip sequences) and strict inequality for some \(\omega\). Here, states are identical sequences of coin flips. For a sequence ending at flip \(k\), Pasadena pays \((-1)^{k-1} 2^k / k\), while Altadena pays \((-1)^{k-1} 2^k / k + 1\). Since \(+1\) is constant, Altadena *always* pays more than Pasadena for the same sequence. **However**, this does *not* imply dominance. Dominance requires the *same state space* mapping to outcomes. The Altadena’s "+1" shifts the entire outcome distribution upward, but because both games have undefined EV and **unbounded variance** (payoffs grow exponentially), the "+1" is infinitesimal relative to tail payoffs. Crucially, no finite payoff difference guarantees dominance when utilities are unbounded and EV is undefined.  
  - **Stochastic Dominance Failure:** First-order stochastic dominance (FSD) requires \(F_2(x) \leq F_1(x)\) for all \(x\) (i.e., Altadena’s CDF is never worse). Yet for \(x = (-1)^{k-1} 2^k / k\), \(F_{\text{Altadena}}(x) = F_{\text{Pasadena}}(x - 1)\). Due to exponential growth and oscillating signs, there exist \(x\) where \(F_{\text{Altadena}}(x) > F_{\text{Pasadena}}(x)\) (e.g., at \(x = -10^{100}\), Altadena has *more* mass below \(x\) because its positive shifts create larger negative dips later). Thus, FSD fails.  

  **(c)** Dominance reasoning cannot resolve this choice. While Altadena pays more in every *finite* state, the lack of a finite EV means rationality is "state-consistent" but not "globally consistent." Tail events dominate expected utility, and a "+1" shift is trivial against \(2^n / n\) growth. Stochastic dominance fails because the infinite variance and heavy tails prevent a uniform CDF ranking.  

  This paradox *generalizes* to real decisions. Consider:  
  - **Heavy-Tailed Risks:** In venture capital, a startup portfolio may have power-law distributed returns (e.g., 90% fail, 9% yield +10x, 1% yield +1000x). If losses/gains alternate in sign (e.g., R&D failures precede breakthroughs), EV can be conditionally convergent. Dominance arguments ("Portfolio B always returns ≥ A") ignore tail volatility. A "+$1M" bonus in all states may not justify choosing B if tail risks explode combinatorially.  
  - **Normative Implications:** Standard axioms (e.g., continuity, dominance) assume finite EV or bounded utility. When EV is undefined, agents may violate statewise dominance to avoid tail risks (e.g., prefer Pasadena to avoid Altadena’s amplified losses in some orderings). Real-world analogs include rejecting "dominant" financial products with undefined EV (e.g., cryptocurrency derivatives) due to catastrophic tail exposures.  
  Thus, the paradox reveals a flaw in expected utility theory: undefined EV invalidates not only precise maximization but also *comparative tools* like dominance in unbounded domains.  

  ---

  ### Marking Scheme  
  **A Answer (Distinction):**  
  - **(b)** Correctly identifies that Altadena pays more in every state *but* explains why this does **not** imply dominance (unbounded payoffs make "+1" operationally irrelevant; dominance requires finite or bounded contexts).  
  - **(b)** Proves failure of stochastic dominance by **explicit CDF comparison** (e.g., notes \(F_{\text{Altadena}}(x) > F_{\text{Pasadena}}(x)\) for large negative \(x\) due to delayed massive losses).  
  - **(c)** Argues that dominance fails *because* EV is undefined (not "despite" it) and **generalizes to real cases** with examples of heavy-tailed distributions (e.g., power-law, fractal risks) where "+ε" shifts don’t resolve indeterminacy.  
  - **(c)** Identifies that *statewise dominance* may conflict with *tail-risk aversion* in practice.  

  **B Answer (Merit):**  
  - **(b)** Correctly states no dominance but **only** because EV is undefined (fails to address why "+1 per state" isn’t sufficient).  
  - **(b)** Correctly notes stochastic dominance fails but **lacks CDF analysis** (e.g., only says "distributions are too spread out").  
  - **(c)** Claims the paradox generalizes but **loses specificity** (e.g., "some investments have undefined EV" without structural parallels to conditional convergence).  
  - **(c)** Omits discussion of **why dominance principles presuppose defined EV** (e.g., as a consistency condition).  

  **C Answer (Pass):**  
  - Recites conditional convergence without addressing (b) or (c).  
  - Assumes Altadena dominates because "it always pays more."  
  - Fails to distinguish statewise vs. stochastic dominance.  

  **Key A vs. B Differentiators:**  
  1. **Dominance Justification:** A answers prove why "+1" is trivial in divergent tails; B answers note the "+1" but don’t explain its irrelevance.  
  2. **CDF Rigor:** A answers compute specific \(x\) where CDFs cross; B answers vaguely reference "variance."  
  3. **Generalization Depth:** A answers cite **structural parallels** (e.g., alternating signs in R&D, power-law tails); B answers gesture at "real-world complexity."  
  4. **Normative Critique:** A answers link undefined EV to the *failure of dominance axioms*; B answers treat dominance as "intuitive but inapplicable."  

  This forces engagement: Students must confront why dominance *seems* obvious but fails mathematically and practically when EV vanishes.
