  ## The Asymmetry of Peonies

  Helen’s hands were deep in the cool, damp earth, parting the rich, dark loam around the peony roots. The late May sun, still gentle in the morning air, warmed the back of her neck. Each crimson bud, furled tight as a fist, held the promise of extravagant, fleeting blooms. *I’ll see them open,* she thought, the sentence landing with the dull thud of a fact, not a hope. *This year.*

  The diagnosis – glioblastoma multiforme, inoperable, aggressive – had settled over her life three weeks ago, a dense, cold fog that hadn’t lifted, only changed the quality of light. The neurosurgeon’s words, "twelve to eighteen months, realistically," still echoed, but they were becoming background noise, like the distant hum of the highway. What occupied her now was the sheer, overwhelming *presence* of the world she would leave. It pressed in, sharp and sweet: the scent of damp earth and crushed mint, the drone of a bumblebee investigating a forget-me-not, the intricate lattice of veins on a newly unfurled hosta leaf.

  She’d always loved this garden. It was her autobiography in blooms. The peonies, planted decades ago when Sarah was still in diapers, stubbornly refusing to flower until she’d learned their need for deep, cool roots and winter chill. The sprawling clematis, a gift from Tom, her late husband, twisting ambitiously towards the pergola he’d built. The unruly patch of wild strawberries Sarah had planted as a child, still sending out runners every spring, defiantly unkempt. She’d planned to finally tame them this summer. Now, she crouched beside them, tracing the tiny white flowers.

  "Mom?"

  Helen startled. Sarah stood at the edge of the patio, holding two mugs of tea, her expression a familiar blend of worry and forced cheer. "You’re out here early. Everything okay?"

  "Just checking on the peonies," Helen said, brushing dirt from her knees as she stood. "They’re about to burst." She took the offered mug, the warmth seeping into her palms. Sarah’s gaze flickered over her face, searching for signs – of pain, of despair, of something Sarah could understand and fix.

  "They look strong," Sarah said, her voice too bright. She gestured with her mug towards the clematis. "And look at Tom’s purple monster! It must have grown a foot overnight."

  Helen sipped her tea. *Tom’s purple monster.* Sarah always called it that, a holdover from childhood. It was a detail Helen would miss. The specific cadence of Sarah’s voice saying it. The way the light caught the deep violet petals at a certain angle in the late afternoon. The scent of it mingling with the honeysuckle on warm evenings she wouldn’t feel. This was the constant hum beneath her thoughts now: the litany of absences-to-come. The deprivation.

  Later, sorting old photographs for Sarah – a task she’d suddenly felt compelled to do – Helen paused on one. Sarah, about two years old, plump legs planted firmly in a sandbox, face screwed up in fierce concentration as she aimed a plastic shovel. Behind her, a much younger Helen beamed, hands protectively hovering near her daughter’s unsteady form. Helen traced the outline of her own smiling face. *Where was I,* she wondered suddenly, *before that moment?* Before the sandbox, before Sarah, before Tom, before her own first memories? There was a vast, blank expanse. An eternity of not-being.

  It wasn't a frightening thought. It was simply… nothing. A nullity. She hadn't existed, hadn't known sunlight or the scent of rain or the ache of love. She hadn't *missed* anything. It was just the absence of Helen, stretching back and back, featureless and indifferent. Why had that never troubled her? Why did the thought of the blank expanse *ahead* – the absence of her after this body finally stopped – feel like a physical blow, a hollowing-out of the future?

  The asymmetry pressed on her chest, heavy and strange.

  One muggy afternoon, exhausted by the sheer effort of *being* present while cataloging her own future absence, Helen fell asleep on the porch swing. The rhythmic creak merged with the drone of cicadas. She dreamed not of darkness, but of light – an immense, white, silent light. It held no warmth, no texture, no sound. It wasn't oppressive, just utterly devoid of anything recognizable. She wasn't *in* it; she wasn't anything at all. It was the light of non-existence, vast and impersonal. And then, a pinpoint emerged: the crimson flare of a peony bud, impossibly small against the infinite white. It pulsed once, like a heartbeat, and the sheer force of *wanting* to see it unfurl, to witness its brief, extravagant life, tore through the blankness. The wanting itself *was* her. The need to see the bloom *was* Helen. And the white light swallowed it whole.

  She woke gasping, the scent of the real peonies thick in the humid air. Tears tracked hot lines down her temples. It wasn't the nothingness that had terrified her in the dream. It was the extinguishing of that *want*, that capacity to witness the peony, to love Sarah, to feel the sun on her neck. The light wasn't bad; the loss was.

  Sarah found her later, staring blankly at the unopened seed packets for next year’s annuals she’d optimistically bought in April. "Thinking about zinnias?" Sarah asked, trying for lightness, but her voice cracked.

  Helen picked up a packet, the image of vibrant orange blooms impossibly vivid. "Just… wondering," she murmured. She couldn’t say: *I’m grieving for flowers I’ll never plant. For mornings I won’t see. For the sound of your laugh when I’m gone.* The deprivation wasn’t about experiencing death; it was about losing the chance to experience *this*. The argument felt too large, too abstract, to force into words that wouldn’t break Sarah.

  She set the seeds down. "Maybe you should plant these," she said, the words tasting like ash. "When… later."

  Sarah flinched. "Don’t, Mom. Please. Not yet."

  The unspoken plea hung between them: *Don’t make me imagine the world without you. Don’t make me count the absences.*

  Helen reached out, squeezed Sarah’s hand. Her daughter’s skin was warm, alive. *This* was present. The future loss was a phantom limb, aching fiercely.

  The peonies bloomed. Overnight, it seemed, the tight buds exploded into enormous, blowsy heads of deep crimson, their heavy perfume saturating the garden air. They were magnificent, fleeting, decadent. Helen stood among them, breathing in the scent that was summer condensed. She touched a velvety petal. It felt vital, ephemeral.

  A memory surfaced, unbidden and clear: her grandmother’s garden. Helen, maybe seven, captivated by similar peonies. She’d asked her grandmother how long they lasted. "Only a week or two, child," the old woman had said, her voice raspy with decades of smoking. "Less if the rain batters them. But oh, what a week! Worth every moment of waiting." Her grandmother had been dead for thirty years. Where was she now? In that same blank expanse Helen had contemplated? Did it matter? Helen hadn’t thought about her grandmother in years. Her absence was simply woven into the fabric of the world now.

  But *her own* absence? The peonies Sarah might plant? The grandchildren Sarah might someday have, whose faces Helen would never see? The books unread, the places unvisited, the simple, extraordinary fact of another spring? The weight of that *not* pressed down, immense and undeniable.

  She thought again of the time before her birth. The infinite nothing before the sandbox photo. She tried to summon fear for that non-existent Helen, for the experiences she hadn't had, the loves she hadn't known. But there was nothing to grasp. No "her" to be deprived. It was peaceful, that non-time. Neutral.

  But *now*? Now she was here. Rooted in this garden, smelling these peonies, loving this daughter. The thought of the "after" wasn't about encountering some terrible state. It was about the severing. The brutal interruption of the ongoing, precious story. The peonies would bloom next year without her. Sarah would stand here, perhaps with her own child, smelling them, and Helen would not. That was the sting. That was the vast, irrevocable loss.

  A gust of wind shook the peony bush. A shower of crimson petals drifted down, littering the dark soil like drops of blood. Helen watched them fall. Beautiful and already gone. She felt no fear of the darkness that would eventually come. But a profound, inarticulate sorrow washed over her for the light she would cease to see, the scents she would cease to smell, the love she would cease to cradle. The argument wasn't in her head; it was in the falling petals, in the warmth of the sun she could still feel, in the sound of Sarah turning a page inside the house, a sound that belonged utterly to the world of the living, a world she was being slowly, inexorably untethered from.

  She bent down, not to weed, not to prune, but simply to gather a few of the fallen petals into her palm. They were cool, slightly bruised, impossibly soft. She held them, this tiny, ephemeral handful of beauty already past its peak, and knew, with a certainty that was neither comfort nor despair, simply truth: she would miss this. Terribly. Not the nothingness, but the everything.
