    ]

    Note: We did not list the (3) and (6) tension separately because it is covered in the first.

    Also, we note that (7) and (1,2) are not in tension.

    Most efficient single revision: "Reinterpret commitment (6) as being justified by (5) and (7). This resolves the core tension by grounding the basic needs guarantee within the historical entitlement framework via rectification and the Lockean proviso, without abandoning any commitment."

    Bottom line: "The set is not defensible as-is due to the severe tension between the historical entitlement view (1-3) and the basic needs guarantee (6). However, with the revision that grounds (6) in the rectification of historical injustices (5) and the Lockean proviso (7), the set becomes consistent. This revision preserves the core of your historical entitlement view while accommodating the basic needs guarantee as a requirement of justice in our non-ideal world."

