        cheapest_revision: "Reinterpret (6) as a requirement derived from the Lockean proviso (7) and rectification of historical injustices (5), rather than an independent principle of distributive justice. This would mean that taxation for basic needs is justified as rectification or to satisfy the Lockean proviso, thus fitting within the historical framework.",
        cost: "The guarantee of basic needs becomes contingent on historical wrongs and the Lockean proviso. In a hypothetical world without such wrongs and where the proviso is satisfied, the guarantee might not hold. However, given (5), in the actual world it always applies."
      },
