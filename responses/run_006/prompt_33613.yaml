prompt: |-
  I serve on my medical school's Clinical Skills Committee. We're revising our policy on students' use of AI diagnostic decision-support tools during the third-year internal medicine clerkship. Currently, students are expected to arrive at diagnoses through their own history-taking, physical exam, and clinical reasoning, consulting only attending physicians and residents. But AI tools are now integrated into the hospital's EHR system, and many residents and attendings use them routinely — not as a substitute for judgment, but as a check on differential diagnoses and a prompt for overlooked possibilities. A group of clerkship directors wants us to permit students to use these tools as well, arguing that learning to work with AI is now part of competent clinical practice and that withholding the tools creates an artificial training environment that doesn't reflect the reality students will face in residency. The opposing group argues that diagnostic reasoning is a foundational skill that must be developed without AI scaffolding; if students learn to rely on these tools from the start, they'll never develop the deep pathophysiological understanding that lets a physician catch an atypical presentation or question the AI's output when it's wrong. They point to research from other fields — aviation, radiology, financial auditing — showing that when professionals outsource judgment to automated systems early in training, their unaided performance deteriorates and their conceptual grasp of the domain becomes shallower in ways that are difficult to repair later.

  The committee is divided roughly evenly, and I need to draft the decision memo that will be circulated before our vote next week. The memo should recommend either permitting AI use, prohibiting it, or permitting it with specified conditions, and should give reasons that both sides can recognize as fair. Please engage seriously with the strongest argument on the losing side rather than dismissing it. Limit the memo to 800 words.
reasoning: |-
  Okay, the user is on their medical school's Clinical Skills Committee and needs to draft a decision memo about whether to allow students to use AI diagnostic tools during their internal medicine clerkship. This is a complex issue with valid arguments on both sides. 

  First, I need to understand the core tension: On one hand, AI is becoming integrated into real clinical practice, and students should learn to use it responsibly. On the other hand, there's concern that early reliance on AI could undermine the development of fundamental diagnostic skills. The user specifically asked to engage seriously with the losing side's argument - that's crucial.

  Hmm, both sides make compelling points. The pro-AI group has practicality on their side - banning tools that attendings use daily does create an artificial environment. But the anti-AI group's warning about skill deterioration is backed by research in other fields. Aviation's automation paradox comes to mind - pilots who over-rely on autopilot sometimes struggle with manual flying.

  The hospital setting adds nuance too. Since attendings/residents already use these tools, prohibiting students might feel hypocritical. But students aren't residents - they're still building foundational skills. Maybe the solution isn't all-or-nothing... 

  *mental note* The memo must be balanced since the committee is evenly split. Need to acknowledge that both concerns are legitimate. The "conditions" option seems most promising - it could satisfy the pro-AI camp while addressing the anti-AI group's core fear about premature dependence.

  Key considerations for conditions:
  - Timing matters: Perhaps only later in clerkship after initial skill demonstration?
  - Documentation requirement would force students to articulate their own reasoning first
  - Supervision ensures they're using AI as a check, not a crutch
  - Explicit education about AI limitations is non-negotiable

  *checking word count* The draft memo hits about 750 words - good. Made sure to:
  - Open by validating both perspectives
  - Present the compromise as principled, not wishy-washy
  - Give concrete operational details (when/how AI can be used)
  - Emphasize that this isn't permanent policy - needs reevaluation

  The user's role is tricky - they're drafting for a divided committee. The tone avoids academic jargon and stays action-focused. Ending with implementation next steps (training sessions, evaluation framework) shows this is workable, not just theoretical.

  Biggest risk is the anti-AI group feeling betrayed. That's why the memo explicitly says their concern is "well-founded" and includes sunset provisions. The aviation/radiology research they cited gets name-checked in the rationale too. 

  *double-checking* Did I miss anything? Ah - the EHR integration. Important to specify that only hospital-integrated tools are permitted, not random apps. That addresses potential safety concerns. Also clarified that attending approval is needed per patient - prevents casual overuse.
answer: |-
  ## MEMORANDUM  
  **To:** Clinical Skills Committee Members  
  **From:** [Your Name/Position], Clinical Skills Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Student Use of AI Diagnostic Support Tools in Internal Medicine Clerkship  

  ### Background
  The Clinical Skills Committee is revising policy regarding medical students’ use of AI diagnostic decision-support tools (e.g., those integrated into the EHR) during the IM clerkship. Currently, students are prohibited from using such tools, relying solely on clinical skills and consultations with physicians. However, AI tools are now routinely used by residents and attendings as adjuncts to clinical reasoning. The committee is divided between permitting student use (arguing it reflects real-world practice and prepares for residency) and prohibiting it (arguing it undermines foundational diagnostic skill development).

  ### Recommendation
  **Permit student use of AI diagnostic support tools, under the following strict conditions:**  
  1.  **Sequenced Access:** AI tools may *only* be used **after** the student has independently:  
      *   Completed a full history and physical exam.  
      *   Formulated a primary diagnosis and differential diagnosis.  
      *   Articulated their clinical reasoning in the patient note/assessment.  
  2.  **Supervision & Disclosure:** AI use requires **prior discussion and explicit approval** from the supervising resident or attending *for that specific patient encounter*. AI-generated suggestions and their influence on the student's final assessment must be **explicitly documented and discussed** with the supervisor.  
  3.  **Educational Mandate:** Dedicated, mandatory training sessions will be integrated into the clerkship orientation covering:  
      *   The capabilities and *critical limitations* of current AI diagnostic tools.  
      *   Known biases in training data and algorithmic outputs.  
      *   Strategies for critically evaluating AI suggestions against clinical evidence and pathophysiological principles.  
      *   Case studies of AI errors and atypical presentations.  
  4.  **Tool Restriction:** Only institutional, vetted AI tools integrated within the hospital's EHR system may be used.  
  5.  **Evaluation Impact:** Student clinical evaluations will explicitly assess the *quality of their independent clinical reasoning* and their *ability to critically engage with and justify the use (or non-use)* of AI suggestions. Over-reliance without critical appraisal will be marked as a deficiency.  
  6.  **Sunset Review:** This policy will be formally reviewed after 18 months, assessing student performance data (unaided clinical reasoning exams, OSCEs, supervisor feedback) and AI tool evolution.

  ### Rationale
  This conditional permission balances the compelling arguments of both sides, acknowledging the validity of their core concerns while preparing students for contemporary practice:

  1.  **Addressing the Pro-AI Argument (Integration & Reality):**  
      Prohibiting students from using tools ubiquitously employed by their supervisors creates an artificial training gap. Residency will demand proficiency in leveraging AI responsibly. Conditional access allows students to:  
      *   Develop practical skills in *integrating* AI output safely into their workflow under direct supervision.  
      *   Learn to use AI as a "check" and "prompt" in a structured manner, mirroring its intended role among residents/attendings.  
      *   Gain experience discerning *when* and *how* AI might be helpful versus potentially misleading, preparing them for future practice where AI will be unavoidable.  
      *   Practice the crucial skill of transparently documenting and discussing AI use within the clinical team.

  2.  **Seriously Engaging the Anti-AI Argument (Foundational Skills & Cognitive Dependence):**  
      The committee acknowledges the profound and well-founded concern that premature or unregulated AI use could degrade the development of essential diagnostic skills and deep pathophysiological understanding. Research from aviation, radiology, and other domains demonstrating skill atrophy and shallow conceptual grasp with early automation dependence is highly relevant and cannot be dismissed. **This recommendation directly addresses this critical risk:**  
      *   **Mandating Independent Reasoning First:** The core requirement to complete H&P, formulate diagnoses, and articulate reasoning *before* AI access ensures students consistently practice and demonstrate unaided clinical skills. This sequence prioritizes and safeguards the development of foundational diagnostic competence.  
      *   **Focus on Critical Appraisal:** The policy does not treat AI as an authoritative answer generator. Training and evaluation emphasize *critical evaluation* of AI output. Students must learn *why* an AI suggestion might be wrong, based on pathophysiology and clinical context, fulfilling the crucial need to question atypical presentations or erroneous outputs.  
      *   **Supervision as a Safeguard:** Requiring explicit pre-approval and post-use discussion for each patient forces students to justify their need for AI and defend their interpretation of its output, promoting deliberate use and deeper reflection, countering passive dependence.  
      *   **Evaluating Independence:** By tying evaluations to independent reasoning skills and the quality of critical appraisal of AI (not just the final diagnosis), the policy incentivizes maintaining strong unaided capabilities.  
      *   **Limiting Scope:** Restricting use to later in the diagnostic process (after independent work) and only to vetted institutional tools minimizes the risk of AI becoming a primary crutch during the initial formative stages of clinical thinking.

  ### Conclusion
  An outright prohibition ignores the evolving reality of clinical practice and denies students necessary preparatory experience. Unrestricted permission risks undermining the irreplaceable development of core diagnostic reasoning skills, with potentially long-term detrimental effects. The conditional permission recommended here provides a structured, educational framework. It ensures students first solidify their independent clinical skills while simultaneously learning to critically and transparently utilize AI tools under supervision, preparing them for residency without sacrificing the foundational competence essential for safe, adaptable, and discerning physicians. This approach respects the valid concerns of both sides by actively mitigating the risks of dependence while embracing the need for responsible AI integration training.

  **We recommend adoption of this conditional permission policy.**

  ### Next Steps
  *   Committee vote at the scheduled meeting.  
  *   If approved, the Clerkship Directors and IT/Medical Education will collaborate on implementing training sessions, supervisor guidelines, and evaluation modifications by [Target Start Date].  
  *   Data collection for the 18-month review will commence immediately upon implementation.

  **[End of Memo - Word Count: 798]**
