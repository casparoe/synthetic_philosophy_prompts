  ---

  ### **Critical Tensions Ranked by Severity**

  1.  **Tension Between #4 and #6 (Most Severe)**  
      - **#4**: Swirls *cannot* push balls (no "extra force").  
      - **#6**: Swirls *must* "steer" the system (otherwise, your thoughts don't steer your body).  
