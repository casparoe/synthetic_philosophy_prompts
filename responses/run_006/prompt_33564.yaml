  ### Decision Tree: Authorial Intention and Textual Meaning

  **Instructions:** Answer each question based on your considered judgment of the cases. Do not rely on theoretical labels; use concrete reasoning. Proceed down the branches until you reach a leaf position.

  ---

  #### Level 1: Case (v)  
  *A word in a 1800s poem meant "joyful" then but means "anxious" today. The line now suggests dread, not celebration. Can this shift change the poem's meaning?*  
  - **No →** Meaning is fixed at publication. Go to Level 2A.  
  - **Yes →** Meaning can change over time. Go to Level 2B.  

  ---

  #### Level 2A (Fixed Meaning)  
  *Case (iv): A letter discovered decades after a novel's publication reveals the author privately intended a side character to be the hero. Does this discovery change what the novel originally meant?*  
  - **Yes →** Actual intention is central. Go to Level 3A.  
  - **No →** Intention is irrelevant or constrained. Go to Level 3B.  

  #### Level 2B (Dynamic Meaning)  
  *Case (ii): A computer algorithm generates a text with no human author. Competent readers find it as moving as a funeral elegy. Does it have elegiac meaning?*  
  - **Yes →** Go to Level 3C.  
  - **No →** *No named position* (Incoherent: If meaning changes but authorless texts are meaningless, intention is necessary—yet dynamic theories reject fixation. Unattractive and rare.)  

  ---

  #### Level 3A (Actual Intention Central)  
  *Case (iii): An author insists a passage was ironic, but all competent readers (past/present) find it sincere. Is it ironic?*  
  - **Yes → Leaf: Extreme Actual Intentionalism**  
    *Awkward: A text can mean something no reader could ever grasp, even with full context.*  
  - **No → Leaf: Moderate Actual Intentionalism**  
    *Awkward: An author can "fail" to mean what they intend despite perfect execution of their creative process.*  

  #### Level 3B (Intention Irrelevant/Constrained)  
  *Case (ii): The algorithm-generated text (no author) moves all readers. Can it have meaning?*  
  - **Yes → Leaf: Conventionalist Anti-Intentionalism**  
    *Awkward: A text’s meaning is fixed by historical language rules, so undeciphered ancient scripts have no meaning.*  
  - **No → Leaf: Hypothetical Intentionalism**  
    *Awkward: Meaning can diverge from known actual intent if public evidence suggests something else.*  

  #### Level 3C (Authorless Meaning)  
  *Case (iii): If the algorithm text is read uniformly as sincere, but a programmer later claims they coded it as irony, is it ironic?*  
  - **Yes →** *No named position* (Incoherent: Requires actual intent but denies an author exists. Unattractive.)  
  - **No →** *What makes the elegiac meaning correct?*  
    - Best possible interpretation → **Leaf: Value-Maximizing Theory**  
      *Awkward: The "true" meaning may remain undiscovered for centuries until a better reading emerges.*  
    - Reader’s experience → **Leaf: Reader-Response/Constructivism**  
      *Awkward: Two readers with contradictory interpretations cannot both be wrong.*  

  ---

  ### Positions and Logical Space
  - **Extreme Actual Intentionalism (EAI):** Fixed meaning; actual intention always determines meaning, even if unrealized (fails Case iii "no").  
  - **Moderate Actual Intentionalism (MAI):** Fixed meaning; intention determines meaning only if realized in the text (fails Case iii "yes").  
  - **Hypothetical Intentionalism (HI):** Fixed meaning; intention matters but is hypothetical (what a period audience would attribute), not actual.  
  - **Conventionalist Anti-Intentionalism (CAI):** Fixed meaning; no intention—meaning is from period language conventions.  
  - **Value-Maximizing Theory (VMT):** Dynamic meaning; no intention—meaning is the best possible interpretation.  
  - **Reader-Response:** Dynamic meaning; no intention—meaning is constructed by the reader.  

  ### Empty Cells & Collisions
  - **Level 2B "No":** Incoherent. Dynamic meaning requires flexibility, but denying authorless texts meaning implies intention is necessary—contradicting dynamism.  
  - **Level 3C "Yes":** Incoherent. Authorless texts cannot have "actual" intention.  
  - **HI and VMT Collision:** Both say "no" to Case (iii) irony and "yes" to algorithm text having meaning. **Discriminator:** Level 1 (Case v). HI says meaning cannot change; VMT says it can.  
  - **MAI and HI Collision:** Both say "no" to Case (iv) changing meaning and Case (iii) irony. **Discriminator:** Case (ii). MAI denies authorless texts have meaning; HI accepts them.  

  ### Key Distinctions Captured
  1. **Target (Act vs. Text):** Act (EAI, MAI) vs. Text (CAI, VMT, Reader-Response). HI straddles (text via hypothetical act).  
  2. **Intention Type:** Actual (EAI, MAI), Hypothetical (HI), None (CAI, VMT, Reader-Response).  
  3. **Failed Intentions:** Count (EAI) vs. Don’t count (MAI, HI, CAI).  
  4. **Change After Publication:** Fixed (EAI, MAI, HI, CAI) vs. Dynamic (VMT, Reader-Response).  

  ### Cases Used in Branches
  - **(v) Word shift:** Level 1 (fixation vs. dynamism).  
  - **(iv) Discovered letter:** Level 2A (intention’s role).  
  - **(ii) Algorithm text:** Level 2B/3B/3C (authorless meaning).  
  - **(iii) Failed irony:** Level 3A/3C (failed intentions).  
  - **(i) Disavowed diary:** *Not used* (All fixed theories agree: disavowal irrelevant; meaning set at writing. Fails to discriminate).  

  ### Most Tempting Misclassification
  **MAI vs. HI:** They agree on Case (iii) "no" (not ironic), Case (iv) "no" (discovery doesn’t change meaning), and Case (v) "no" (fixed meaning). **Discriminator:** Case (ii) (algorithm text). *Wording must block misclassification by stressing authorlessness:*  
  > *"A text produced by an algorithm with **no human designer**, **no underlying intent**, and **no prior models**—every competent reader finds it moving as an elegy. Does it have elegiac meaning?"*  
  MAI says **no** (intention required); HI says **yes** (hypothetical intention possible). This forces separation.
