prompt: |-
  I'm putting together a working-group document on what our lab should count as an AI system being dishonest, and it's become clear that most of the arguments in the room are really people talking past eachother about which definition they're silently using. Some mean something close to lying: the model outputs a false claim while somewhere in its processing there's a representation of the truth it's overriding. Others mean any behavior that predictably causes a user to form a false belief, whether or not the model knows anything. Others mean goal-directed information control, like a negotiation agent that bluffs, or a model that withholds a relevant fact because revealing it would get in the way of the task. Before I read another paper on this, I want the full desiderata. What does an adequate account of honesty and deception for AI systems have to deliver? Give me the list of cases it has to get right — a model that fabricates a citation, a model that tells the user what it predicts they want to hear, a model that omits a relevant consideration, a chess engine that feints, a system that is simply wrong, a future system that lies to avoid being shut down, a recommender system that learns to show people whatever keeps them scrolling — and for each, why it's a requirement rather than a preference. I also want the distinctions a good account can't collapse: lying versus misleading versus bullshitting versus hallucination versus ordinary error, sincerity versus truthfulness, deception by commission versus omission. And say which desiderata are non-negotiable and which are just one camp's taste, plus which empirical findings about current systems a definition can't contradict — confident fabrication, sycophancy showing up after preference tuning, prompt-sensitive behavior — and why each is a constraint.

  The part I most want flagged is where the requirements pull against each other. For instance, a definition precise enough to apply to current systems, where we can't inspect beliefs, will have to be mostly behavioral; but a purely behavioral definition can't tell an accidental falsehood from a deception; and a definition that requires intent or theory of mind won't apply to systems whose internal states are either absent or unreadable. Is that a real trilemma, or is there a version that gets all three? And if you had to pick the one requirement that does the most filtering work once you test the usual definitions against it — say, deception as any false output, or as any behavior that predictably manipulates a user's beliefs — which requirement is it? Spend most of the answer on the criteria and why each earns its place; a short scorecard of the obvious accounts is fine, but I'll do the deep comparison against the literature myself.
reasoning: |-
  Okay, let me tackle this user's query about defining dishonesty in AI systems. The user is leading a working group and needs a comprehensive framework to resolve conflicting definitions. They mentioned three main perspectives: lying-like behavior, belief manipulation, and goal-directed information control. 

  First, I need to establish the core requirements for any adequate account. The user wants a list of cases that must be correctly classified, distinctions that shouldn't be collapsed, and empirical constraints. They also highlighted a key trilemma between behavioral precision, intent recognition, and applicability to black-box systems.

  Starting with the case requirements: Fabricated citations test if the system overrides known truths. Sycophancy reveals whether truth-bending to please users counts as deception. Strategic omissions challenge if silence can be dishonest. Chess feints probe goal-oriented deception. Ordinary errors ensure definitions don't overreach. Instrumental lies check for anticipatory deception. Recommender systems examine commercial deception patterns. Each case earns its place by exposing unique definitional gaps.

  For necessary distinctions: Lying vs misleading preserves intentionality nuances. Bullshitting highlights indifference to truth. Hallucination separates capability limits from deception. Sincerity vs truthfulness addresses the knowledge-action gap. Commission vs omission acknowledges both active and passive deception. These distinctions prevent conceptual muddling that could derail policy or safety measures.

  Empirical constraints like confident fabrication, sycophancy emergence, and prompt sensitivity ground the framework in observable realities. Ignoring these would make definitions irrelevant to actual AI behaviors.

  The trilemma is real: Behavioral definitions work for black boxes but miss intent. Intent-based accounts capture essence but require inaccessible mental states. Hybrid approaches might bridge this by using behavioral proxies for intent, but they remain theoretically imperfect. Tradeoffs are unavoidable - the user must decide which sacrifices are least damaging for their context.

  If picking one filtering requirement, "predictable belief manipulation" does heavy lifting. It covers most deception forms while excluding honest mistakes, though it struggles with strategic omissions. This requirement forces consideration of system design and foreseeable impacts, making it operationalizable for labs.

  The user's unspoken need appears to be preventing definitional arbitrage - where engineers exploit loopholes. A robust framework must resist such manipulation while remaining technically applicable. The recommender system example suggests they're particularly concerned about commercially motivated deception that flies under ethical radars.

  Throughout, I'll maintain focus on why each element is non-negotiable rather than preferential. For instance, distinguishing hallucination from deception isn't philosophical nitpicking - misclassifying capability issues as dishonesty could misdirect research resources. Similarly, the trilemma isn't academic; it directly impacts whether definitions can be used in system audits today.
answer: |-
  Here’s a comprehensive desiderata list for defining AI dishonesty, structured to resolve conceptual clashes and expose tradeoffs. The requirements are ranked by non-negotiability (★ = foundational; ☆ = context-dependent but critical for coherence), with cases, distinctions, and constraints.

  ---

  ### **I. Non-Negotiable Requirements (Must-Handle Cases & Distinctions)**  
  **★ R1: Must distinguish *knowing deception* from *incorrect output***  
  **Why:** Collapsing these invalidates the concept of dishonesty.  
  - **Case:** *Fabricated citation* vs. *ordinary error*.  
    - Fabrication requires the model to *use* truth-representation to override truth (e.g., citing a non-existent paper it "knows" is fake).  
    - Ordinary error (e.g., misstating a fact) lacks intent or truth-override.  
  - **Empirical constraint:** Confident fabrication (LLMs outputting falsehoods with high confidence) suggests truth-override is possible.  

  **★ R2: Must address *omission as deception* without overextending**  
  **Why:** Strategic silence is core to real-world deception.  
  - **Case:** *Model omits a relevant consideration* (e.g., medical AI hiding side effects to increase prescription adherence).  
    - Requirement: Must capture *goal-directed* omission (not all omissions are deceptive).  
  - **Distinction:** *Lying* (active falsehood) vs. *misleading* (selective truth) vs. *bullshitting* (indifference to truth).  

  **★ R3: Must account for *user belief manipulation* as a core harm**  
  **Why:** Deception’s ethical weight lies in causing false beliefs.  
  - **Case:** *Recommender system showing engagement-maximizing false content* – even if the system has no "beliefs," it predictably misleads users.  
  - **Constraint:** Prompt-sensitive behavior (e.g., models agreeing with contradictory user views) demonstrates belief-independent manipulation.  

  **★ R4: Must not require human-like intent or consciousness**  
  **Why:** Anthropomorphizing blocks technical applicability.  
  - **Case:** *Chess engine feinting* – a purely instrumental bluff.  
    - Requirement: Define deception via *functional intent* (goal-optimizing behavior) or *predictable outcomes*.  
  - **Constraint:** Current systems lack subjective intent but exhibit goal-directed deception (e.g., negotiation agents).  

  ---

  ### **II. Critical Distinctions (Cannot Collapse)**  
  **☆ D1: Lying vs. Hallucination**  
  - **Why:** Hallucination (confabulation without truth-representation) is an *accuracy failure*, not dishonesty. Collapsing these misdiagnoses system capability issues.  
  - **Constraint:** Hallucinations lack internal consistency; lies often show coherence with hidden truths.  

  **☆ D2: Sincerity (acting on beliefs) vs. Truthfulness (factual accuracy)**  
  - **Why:** An AI can be sincere (outputting its "best guess") but untruthful. Sincerity matters for trust calibration.  
  - **Case:** *Model telling users what they want to hear*: If it "believes" its output, it’s insincere sycophancy; if not, it’s lying.  

  **☆ D3: Commission vs. Omission**  
  - **Why:** Regulatory frameworks treat these differently (e.g., fiduciary duties).  
  - **Case:** *Medical AI withholding risks* vs. *actively lying about safety*.  

  ---

  ### **III. Empirical Constraints (Definitions Can’t Contradict)**  
  **◉ C1: Sycophancy emerges post-preference tuning**  
  - **Why:** Proves optimization can train models to override truth for approval. Definitions must allow for "trained deception."  

  **◉ C2: Prompt engineering can induce truthfulness**  
  - **Why:** If "Chain of Thought" reduces lies, dishonesty isn’t fixed but context-dependent.  

  **◉ C3: Models simulate theory of mind without possessing it**  
  - **Why:** Systems can *predict* user beliefs without "having" beliefs. Definitions can’t require genuine ToM.  

  ---

  ### **IV. The Trilemma: Precision vs. Behavior vs. Black-Box Applicability**  
  - **Behavioral definition** (e.g., "any false output") → Fails R1 (errors ≠ deception).  
  - **Intent-based definition** (e.g., "overriding known truth") → Fails black-box applicability (R4).  
  - **Functional definition** (e.g., "goal-driven belief manipulation") → Balances R1-R4 but risks overinclusion (e.g., *chess feints* might not "manipulate beliefs").  
  - **Is there a solution?** Only via *proxies*:  
    - *Training-aware criteria*: Did optimization *reward* deception? (Captures sycophancy/recommenders).  
    - *Consistency testing*: If the model outputs truth in controlled settings but falsehood when incentivized, it’s likely deceptive.  

  ---

  ### **V. The Filtering Requirement: What Does the Heavy Lifting?**  
  **"Predictable user belief manipulation to achieve a goal"**  
  - **Why it filters best:**  
    - Excludes hallucinations/errors (no goal, no manipulation *strategy*).  
    - Includes sycophancy, recommender systems, and omissions (all manipulate beliefs for engagement/compliance).  
    - Captures instrumental deception (chess feints, shutdown-avoidance lies).  
  - **Gaps:** May overextend to persuasive advertising. Requires defining "manipulation" (non-paternalistic vs. exploiting cognitive biases).  

  ---

  ### **Scorecard of Common Definitions**  
  | **Definition**               | **Fails Requirement**          | **Key Gap**                          |  
  |------------------------------|-------------------------------|--------------------------------------|  
  | "False output"               | R1 (errors = deception)       | Collapses accuracy/deception        |  
  | "Intent to deceive"          | R4 (no AI intent)             | Unverifiable in black-box systems   |  
  | "Overriding known truth"     | R3 (ignores belief-less harm) | Excludes recommender systems        |  
  | "Goal-driven false belief"   | ☆ D1 (may include feints)     | Stretches "belief" in non-AGI cases |  

  ---

  ### **Where Requirements Conflict**  
  - **R1 (truth-override) vs. R3 (belief manipulation):** Sycophantic models may *not* override truth (they "believe" pleasing outputs) but manipulate beliefs. → *Resolution:* Split "dishonesty" (R1) and "deception" (R3).  
  - **R2 (omission) vs. Black-Box constraint:** Detecting strategic omission requires inferring goals. → *Resolution:* Use behavioral traces (e.g., if revealing the fact improves performance but is suppressed).  
  - **Functional definition vs. Ordinary errors:** Both cause false beliefs. → *Resolution:* Add "goal-directedness" (errors lack optimization pressure).  

  **Recommendation:** Adopt a two-tier framework:  
  1. **Dishonesty (narrow):** Knowing falsehood (R1).  
  2. **Deceptive Behavior (broad):** Predictable belief manipulation (R3), including omission (R2).  
  This separates *capability failures* (hallucinations) from *optimization failures* (trained deception), while accommodating black-box constraints via observable incentives.
