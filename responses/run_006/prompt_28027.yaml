  We are designing an information cascade game for an upper-level undergraduate seminar. The goal is for students to experience how rational individuals, observing the actions of others, might ignore their own private information and follow the crowd, even when the crowd's decision is based on very little information.

  **Game Design: Urn Experiment**

  **State of the World:**
  There are two urns, labeled A and B. Urn A contains 2 blue marbles and 1 red marble. Urn B contains 2 red marbles and 1 blue marble. The instructor secretly flips a fair coin to choose which urn to use for the game. If heads, urn A is chosen; if tails, urn B is chosen. The chosen urn is the "true urn" for the entire game.

  **Private Signal:**
  Each student, in sequence, will draw one marble from the true urn (with replacement, so the urn composition remains constant). They observe the color of the marble and then return it to the urn. This color is their private signal. Note: Because the draws are with replacement, the draws are independent.

  - If the true urn is A (which has more blue), then the probability of drawing a blue marble is 2/3, and red is 1/3.
  - If the true urn is B (which has more red), then the probability of drawing a blue marble is 1/3, and red is 2/3.

  **Action:**
  Each student must publicly announce a guess about the urn: either "A" or "B". They are not to reveal their private signal (the color they drew). The guesses are made in a fixed sequence (e.g., by seating order). Each student observes all the previous guesses before making their own.

  **Payoff Scheme (without real money):**
  - At the end of the game, if the student's final guess (they only make one guess) is correct, they get 2 points.
  - If they are incorrect, they get 0 points.
  - Additionally, to encourage truth-telling and to make the game more interesting, we can add a small reward for being correct in the face of disagreement. However, to keep it simple, we can just use the 2 points for a correct guess.

  Alternatively, to avoid any potential for changing guesses and to focus on the cascade, we have each student make only one guess when it is their turn. The payoff is only at the end when the true urn is revealed.

  **Timeline for 75-minute session:**

  1. **Introduction and Setup (10 minutes):**
     - Explain the urns and the probabilities. Emphasize that the urn is chosen by a coin flip at the beginning and remains fixed for the entire game.
     - Explain the sequence: students will be called in order (e.g., by seating). Each will draw a marble (in private, so only they see the color) and then publicly announce their guess of the urn (A or B). They must base their decision on their own draw and the guesses of the previous students.
     - Explain the payoff: 2 points for a correct guess, 0 for incorrect. (We can keep track of points on the board, and at the end of the seminar, the top scorers might get a small non-monetary reward, like candy or just bragging rights.)

  2. **Practice Round (optional, 5 minutes):**
     - Do a practice round with a smaller sequence (maybe 3 students) to ensure everyone understands. Use a known urn (say, announce it's urn A) and have them draw and guess. This is to clarify the procedure.

  3. **First Full Round (15 minutes):**
     - Choose the true urn by coin flip (secretly). Record the urn but do not reveal until the end.
     - Have the first student come up and draw a marble (in a way that others don't see). They then announce their guess (A or B). Write the guess on the board (e.g., "Student 1: A").
     - Continue until all 18 students have gone. Each student observes the previous guesses on the board.

  4. **Reveal and Record (5 minutes):**
     - Reveal the true urn and which students were correct. Record the guesses and the true urn for discussion.

  5. **Second Round (15 minutes):**
     - Flip the coin again for a new urn. Repeat the process. This time, the students might be more aware of the cascade possibility, so we might see different behavior.

  6. **Third Round (15 minutes, optional if time permits):**
     - If time, run a third round. The more rounds, the more likely they are to experience a cascade and also to see a cascade break.

  7. **Debrief (20 minutes):**
     - Discuss the rounds, focusing on when cascades formed, when they broke, and the reasoning behind the students' decisions.

