answer: |-
  ### Information Cascade Classroom Activity: Urn Experiment  
  **Designed for a 75-minute upper-level undergraduate seminar (18 students)**  

  ---

  #### **Setup and Materials**  
  - **Materials**:  
    - Two opaque containers (e.g., boxes or bags) labeled "Urn A" and "Urn B."  
    - **Urn A**: Contains 2 blue marbles and 1 red marble.  
    - **Urn B**: Contains 2 red marbles and 1 blue marble.  
    - A coin (to secretly select the true urn at the start of each round).  
    - A whiteboard to record student guesses (e.g., "Student 1: A," "Student 2: B").  
    - A privacy screen (e.g., a folder) so only the drawing student sees their marble.  
    - Optional: Digital randomizer (e.g., online coin flip/die roll) if physical materials are impractical.  

  - **State of the World**:  
    - The instructor flips a coin to choose the "true urn" (heads = Urn A, tails = Urn B). **Students do not know** which urn is chosen or the coin outcome.  
    - **Urn A probability**: P(drawing blue) = 2/3, P(drawing red) = 1/3.  
    - **Urn B probability**: P(drawing blue) = 1/3, P(drawing red) = 2/3.  

  - **What Students Know**:  
    - The urn compositions (displayed visually).  
    - The coin flip determines the true urn (they know it is fixed for the round).  
    - Their goal: Guess the true urn correctly to earn points.  
    - They observe all prior guesses before deciding.  
    - **They do not know**: Others’ private signals (marble colors), the true urn, or others’ reasoning.  

  ---

  #### **Rules and Procedure**  
  1. **Order**: Students are sequenced (e.g., by seating order). Each student:  
     - Draws one marble **in private** (views color, then returns it to the urn to maintain composition).  
     - Announces a public guess ("A" or "B") based on:  
       - Their private signal (marble color).  
       - All prior public guesses.  
     - Guesses are recorded on the board (e.g., "Student 3: A").  

  2. **Payoff Scheme (No Real Money)**:  
     - Correct guess: **2 points**.  
     - Incorrect guess: **0 points**.  
     - Points are tallied on the board. At the seminar’s end, the top 3 scorers earn non-monetary rewards (e.g., "Rationality Champion" certificate, extra credit, or small treat).  

  3. **Rationality Instruction**:  
     - Emphasize: "Your goal is to maximize points by guessing correctly. You are a rational Bayesian updater: combine your private signal with the public information from prior guesses."  

  ---

  #### **Timeline (75 Minutes Total)**  
  | Phase           | Time      | Steps                                                                 |  
  |-----------------|-----------|-----------------------------------------------------------------------|  
  | **1. Setup**    | 10 min    | Explain rules, urn compositions, probabilities, and payoffs. Demo with 2 volunteers (e.g., "If I draw blue, I guess A"). |  
  | **2. Round 1**  | 20 min    | Flip coin (secretly), choose true urn. Run sequence for all 18 students. Record guesses. |  
  | **3. Round 2**  | 20 min    | New coin flip, new true urn. Repeat sequence.                         |  
  | **4. Round 3**  | 15 min    | Final round (if time permits).                                        |  
  | **5. Reveal**   | 5 min     | After each round: Reveal true urn and award points. Note if a cascade formed (e.g., 5+ consecutive identical guesses). |  
  | **6. Debrief**  | 20 min    | Structured discussion (see below).                                    |  

  ---

  #### **Debrief Plan**  
  **Goal**: Connect student experiences to formal concepts. Emphasize the tension between private signals and public information.  

  1. **Recreate Key Moments (5 min)**:  
     - Ask students: "When did you ignore your private signal? Why?"  
     - Map a cascade from the game (e.g., "In Round 1, after Student 3 guessed ‘A,’ everyone followed").  
     - Highlight: "The first 2 guesses were the tipping point. Why?"  

  2. **Formal Structure (10 min)**:  
     - **Private Signals**: Each marble draw is an independent, noisy signal (e.g., blue suggests A, but not definitively).  
     - **Bayesian Updating**:  
       - Student 1: Uses only private signal. P(A | blue) = (2/3)/(2/3 + 1/3) = 2/3 → Guess A.  
       - Student 2: Sees prior guess + private signal. If Student 1 guessed A (≡ blue signal), and Student 2 draws blue:  
         $$P(A | \text{2 blue}) = \frac{(2/3)^2 \cdot 0.5}{(2/3)^2 \cdot 0.5 + (1/3)^2 \cdot 0.5} = \frac{4/9}{4/9 + 1/9} = \frac{4}{5}$$  
         Guess A. If Student 2 draws red, P(A) = 0.5 (indifference; arbitrary choice).  
       - **Cascade Threshold (Student 3+)**: After two identical guesses (e.g., A, A), the public evidence outweighs any single private signal. If Student 3 draws red:  
         $$P(A | \text{2 blue, 1 red}) = \frac{(2/3)^2 \cdot (1/3) \cdot 0.5}{(2/3)^2 \cdot (1/3) \cdot 0.5 + (1/3)^2 \cdot (2/3) \cdot 0.5} = \frac{4/27}{4/27 + 2/27} = \frac{2}{3} > 0.5$$  
         Rational choice: Ignore private signal (red) and guess A.  

  3. **Why It’s Unsettling (5 min)**:  
     - "The group consensus rested on only 2 signals, yet 16 people followed it. Your private signals were discarded—even though collectively, they held more information."  
     - "This is individually rational but collectively fragile: cascades can persist even if wrong (e.g., true urn was B, but early guesses were unlucky)."  

  ---

  #### **Addressing Challenges**  
  **(a) Predictable Problems and Solutions**:  
  - **Contrarian Students**: A few may "rebel" to break cascades.  
    - *Solution*: Stress payoff incentives ("You lose points if wrong") and rationality norms ("Act as if this were real"). Privately remind rebels: "Your job is to maximize correctness, not disrupt."  
  - **Misunderstanding Probabilities**: Some treat it as a guessing game.  
    - *Solution*: Run a practice round; use the demo to show Bayesian math for Student 1–3. Ask: "If you see two ‘A’ guesses, what does that imply about their signals?"  
  - **Cascades Forming Too Quickly/Never Breaking**: Likely if early guesses align.  
    - *Solution*: In debrief, contrast rounds (e.g., "Round 1 cascaded on A; Round 2 had disagreement and no cascade"). Use a round where the true urn is B but early guesses are A (probability 1/9) to show wrong cascades.  

  **(b) What the Activity Cannot Reproduce**:  
  - **Real-World Complexity**: Signals vary in quality; people are not perfect Bayesians; social pressures (e.g., fear of ridicule) compound cascades.  
  - **Discussion Points**: "In reality, cascades involve emotions, reputational risks, or ambiguous signals. This game isolates the *informational* logic. Where else might this play out? (e.g., stock bubbles, fashion trends)."  

  **(c) Distinguishing from Related Phenomena**:  
  - **Conformity vs. Cascade**:  
    - Conformity: "You follow because you fear social exclusion."  
    - Cascade: "You follow because it’s rationally optimal, given public information."  
  - **Reputation-Based Herding vs. Cascade**:  
    - Herding: "You mimic others to protect your reputation (e.g., ‘No one blames me if we’re all wrong’)."  
    - Cascade: "No reputation at stake—you follow because the public information dominates."  
  - **Groupthink vs. Cascade**:  
    - Groupthink: "Suppressing dissent to maintain group harmony."  
    - Cascade: "No suppression; dissent is rationally overruled by evidence."  
  - **Key Takeaway**: "Cascades are uniquely unsettling *because* they arise from rational choices. Groupthink or conformity are irrational; cascades are logic-driven errors."  

  ---

  **Why This Works**: Students experience the cascade’s "pull" firsthand. The urn setup forces them to confront Bayesian logic, while multiple rounds showcase fragility (e.g., cascades breaking with early disagreement). By debriefing with social comparisons, you crystallize why cascades are distinct—and why rationality fuels their danger.
