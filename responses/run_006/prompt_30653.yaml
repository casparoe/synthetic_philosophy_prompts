prompt: |-
  I'm a journalist who covers science and ideas, and I've been trying to get my head around Hofstadter's superrationality. I have a bunch of gut verdicts about one-shot prisoner's dilemmas, and I'd like you to act as a professional philosopher of decision theory and help me find the principle behind them — or tell me which verdicts I have to give up. Think carefully: before you commit, brainstorm the candidate principles (causal decision theory, evidential decision theory, superrationality, something about the other player running my decision procedure) and test each one against the cases below.

  The game is the same in every case: two players independently choose cooperate or defect. If both cooperate, each gets $10. If both defect, each gets $1. If one cooperates and the other defects, the cooperator gets $0 and the defector gets $12.

  My verdicts:

  1. Against my identical twin, raised with me, no communication. We know we'll reason the same way. I cooperate, and I'd think worse of myself for defecting.
  2. Against a total stranger on the other side of the world, no communication. I defect, and I think that's just the rational play.
  3. Against a perfect copy of me made ten minutes ago, same memories. I cooperate, same as the twin case.
  4. Against a stranger whose action is causally wired to mine by a machine — if I cooperate it makes them cooperate, if I defect it makes them defect. I cooperate, but it feels like a different reason, not the we're-in-this-together thing.
  5. Against a stranger where the payoffs are almost symmetric but not quite: if we both cooperate, I get $10 and they get $9. Here the pull to cooperate basically vanishes, even though a dollar shouldnt matter. That bothers me.
  6. The case I cant stop going back and forth on: a one-shot PD against a stranger I've never met, no causal link between us, but I know for a fact they're a perfectly rational agent with exactly the same information about the game, and they know the same about me. Half the time I think superrationality says we both cooperate, since we'd both arrive at the same answer and cooperation is better than defection. The other half I think that's magical thinking and I should defect like in case 2.

  Is there one principle that gets all of these, or close? What does it say about case 6, and which of my verdicts does it force me to drop? And I'd also like to know what your principle says about a case I didn't list: a symmetric one-shot PD against a past version of myself, where my past self already chose and I'm choosing now.
reasoning: |-
  Okay, let me tackle this journalist's question about Hofstadter's superrationality and their intuitions in different Prisoner's Dilemma scenarios. They've laid out six cases with clear verdicts and one unlisted case about playing against their past self. The core challenge is finding a unified decision principle that explains all these intuitions—or identifying which verdicts need revision.

  First, I need to analyze each case through different decision theories. Causal Decision Theory (CDT) focuses solely on how one's action causally influences outcomes. In standard cases like #2 (stranger), CDT would always recommend defection because your choice doesn't affect theirs. But this clashes with the journalist's cooperative instincts in cases like #1 (twin) or #3 (copy). 

  Evidential Decision Theory (EDT) looks at correlations: if I cooperate, that's evidence the other player does too. This explains cooperation in twin/copy cases, but fails in #4 (causal wire) where EDT would paradoxically recommend defection—your cooperation strongly correlates with theirs, but the causal wire makes defection equally beneficial. The journalist correctly rejects this.

  Superrationality (Hofstadter) suggests identical rational agents will reach the same conclusion, so mutual cooperation becomes the only consistent outcome. This handles cases 1,3, and 6 well, but struggles with #5 (asymmetric payoff) where even tiny payoff differences break symmetry. The journalist's discomfort here is telling—it reveals superrationality's fragility.

  Then there's Functional Decision Theory (FDT), which treats decisions as outputs of a function. It asks: "What choice would I want this function to make, given that the other player uses the same function?" This elegantly covers twin/copy cases (#1,3), the causal wire (#4) since it functions identically, and the symmetric rational stranger (#6) via shared decision algorithms. 

  Testing FDT against the journalist's verdicts:
  - Cases 1,3,4,6 align perfectly (cooperate)
  - Case 2 (stranger) requires defection—FDT agrees since no shared function
  - Case 5 (asymmetric) breaks down because FDT relies on symmetry; here defection becomes rational, validating their vanishing cooperation instinct

  The unlisted case (past self) is fascinating. FDT would treat past-you as running the same decision function, so cooperating now "completes" mutual cooperation—even though causally, your choice can't affect the past. This resolves the time-loop paradox.

  The journalist must surrender their case 6 ambivalence: FDT says cooperate with identical rational strangers. Case 5 remains a valid outlier where symmetry fails. The key insight is that rationality isn't about predicting others—it's about coordinating when decision processes are entangled.
answer: |-
  As a philosopher of decision theory, I'll help you diagnose the unifying principle behind your intuitions—and identify where you might need to revise them. Your cases reveal a deep tension between causal and "reflective" reasoning. Let's test candidate principles:

  ---

  ### **Candidate Principles & Their Fit**
  1. **Causal Decision Theory (CDT)**  
     *Principle:* Maximize expected utility based on **causal consequences** of your act.  
     - ✅ Case 2 (stranger): Defect (your choice doesn’t affect theirs).  
     - ✅ Case 4 (causal wire): Cooperate (your choice *causes* theirs).  
     - ❌ Case 1 (twin)/Case 3 (copy): Says defect (no causal link), but you cooperate.  
     - ❌ Case 6 (rational clone): Says defect, but you feel cooperation *should* be possible.  

  2. **Evidential Decision Theory (EDT)**  
     *Principle:* Maximize utility based on evidence your act provides about outcomes.  
     - ✅ Case 1/3: Cooperating is evidence your twin/copy cooperates.  
     - ❌ Case 4 (causal wire): Cooperating is evidence the *other* cooperates, but EDT ignores the wire’s causal power. It bizarrely says: *"If I defect, I get $12 because the wire makes them defect too!"* (You reject this).  
     - ❌ Case 2: Defecting is evidence they defect, so $1 is "better" than $0—still worse than CDT’s $12.  

  3. **Hofstadter’s Superrationality**  
     *Principle:* Agents with identical reasoning should pick the *same symmetric action* that maximizes joint utility.  
     - ✅ Case 1/3/6: Cooperate (you expect identical reasoning → mutual cooperation).  
     - ❌ Case 2: Fails—no reason to assume identical reasoning.  
     - ❌ Case 5 (asymmetric payoffs): Breaks symmetry. You *should* defect here (as you intuit), but superrationality lacks a clear answer.  

  4. **Functional Decision Theory (FDT)**  
     *Principle:* Treat your decision as the output of a *function*. Choose the act that, if *that function* were implemented by all identical agents, maximizes utility.  
     - ✅ Case 1/3: Your decision function is identical → cooperate.  
     - ✅ Case 4: The machine *enforces functional identity* → cooperate.  
     - ✅ Case 5: Asymmetry breaks functional equivalence → defect.  
     - ✅ Case 2: No shared function → defect.  
     - ✅ Case 6: Shared rational function → **cooperate** (key insight).  

  ---

  ### **The Winning Principle: Functional Decision Theory (FDT)**  
  FDT explains all your verdicts except one inconsistency in Case 6. Its core idea:  
  > **"Choose as if your decision procedure controls all copies of itself."**  

  Your action isn’t just a cause—it’s a *logical output* of a function. If others use the *same function*, your choice "controls" theirs via logical dependence.  

  #### **FDT Applied to Your Cases:**  
  | Case | Your Verdict | FDT Verdict | Agreement |  
  |------|--------------|-------------|-----------|  
  | 1. Twin | Cooperate | Cooperate (same function) | ✅ |  
  | 2. Stranger | Defect | Defect (no shared function) | ✅ |  
  | 3. Copy | Cooperate | Cooperate (same function) | ✅ |  
  | 4. Causal Wire | Cooperate | Cooperate (machine enforces identity) | ✅ |  
  | 5. Asymmetric PD | Defect | Defect (broken symmetry) | ✅ |  
  | 6. Rational Clone | *Ambivalent* | **Cooperate** (same function) | ❌ **Revise!** |  

  - **Case 6 Resolution:** FDT says **cooperate**. If both agents use identical rational decision functions, they’ll reach the same outcome. Defecting leads to ($1,$1); cooperating leads to ($10,$10). Since your decision function "controls" theirs (via logical equivalence), cooperation is *functionally rational*. **Your hesitation is CDT intuition clashing with FDT.**  

  - **Case 5 (Asymmetric) Nuance:** The $1 difference breaks symmetry. FDT says: *"If I cooperate, my function outputs Cooperate—but their function (maximizing *their* payoff) might output Defect."* Defection becomes uniquely rational. Your "vanishing pull" to cooperate is correct.  

  ---

  ### **The Unlisted Case: Playing Against Your Past Self**  
  *Setup:* Symmetric one-shot PD where your past self already chose, and you choose now. No causal link (past is fixed).  

  - **FDT Verdict:** **Cooperate.**  
    - Your past and present selves use the *same decision function*.  
    - Choosing Cooperate now ensures mutual cooperation if your past self ran the same calculation.  
    - Even though you can’t *causally* change the past, FDT treats your decision as "controlling" the output of the function across time. Defecting now would mean your function is self-undermining.  

  ---

  ### **Conclusion & Reconciliation**  
  - **Principle:** **Functional Decision Theory** unifies your intuitions best. It treats rationality as consistency across identical decision processes.  
  - **Required Verdict Change:** In **Case 6 (rational clone)**, FDT forces you to **cooperate**. Your twin/copy intuitions apply here—it’s not "magical thinking" but recognizing logical dependence of identical functions.  
  - **Case 5 (Asymmetric):** Your defection verdict stands. Symmetry is necessary for FDT cooperation.  
  - **Why FDT?** It captures the "we're-in-this-together" reflex (Cases 1,3,6) *and* the causal pragmatism (Cases 2,4,5) by separating *logical* from *causal* control.  

  > **Bottom line:** You must abandon the idea that Case 6 is identical to Case 2. The stranger’s rational identity matters—it creates a *functional loop* where cooperation becomes self-consistent. Defecting against a perfect rational clone is like cutting off your nose to spite your face.
