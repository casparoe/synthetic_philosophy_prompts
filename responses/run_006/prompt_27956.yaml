  ### **The Standoff Game: Rules (Read Aloud in <3 Minutes)**

  "Form pairs. Each pair stands facing each other. I will count down from 10 to 0, one number per second (e.g., '10...9...8...'). **Your goal:** Decide when to 'commit' by holding up your index card.  
  - If you commit **alone** at time **t** (e.g., t=10, 9,...), you earn **10 × t points** (e.g., 100 at t=10, 90 at t=9, down to 0 at t=0).  
  - If you **both commit at the same t**, you **both get 0 points** (collision).  
  - If one commits **first** at **t**, the other **cannot earn points afterward** (even if they commit later).  
  - If you **never commit**, you get **0 points**.  

  We play **two rounds** with the same partner. After Round 1, you’ll see results and adjust. **Total points** across both rounds determine the winner. Top scorer earns a bonus!"  

  ---

  ### **Minute-by-Minute Sequence**  
  **Total: 18–20 minutes**  
  - **Min 0–3:** Explain rules, demo with a volunteer (show: early/late/simultaneous commit).  
  - **Min 3–4:** Pair students (18 students → 9 pairs). Distribute one index card per student.  
  - **Min 4–5:** **Round 1 countdown:** Slowly announce "10...9...". Pause 1 sec per number.  
  - **Min 5–7:** **Record results:** For each pair, ask:  
    - *"Who committed? At what time? Any collisions?"*  
    - Whiteboard a table: Pair #, Time A, Time B, Points A, Points B.  
  - **Min 7–9:** **Reset:** Students discuss briefly with partners (no strategy sharing between pairs).  
  - **Min 9–10:** **Round 2 countdown:** Repeat countdown.  
  - **Min 10–12:** **Record results** (add to whiteboard). Calculate total points. Announce top scorer.  

  ---

  ### **Payoff Structure & Why It Creates a Commitment Race**  
  **Payoffs:**  
  - Sole committer at **t**: **10t** points (t=10 → 100, t=9 → 90, ..., t=0 → 0).  
  - Collision (same **t**): **0 points** for both.  
  - Non-committer: **0 points**.  

  **Why it models a commitment race:**  
  - **Incentive to commit early:** High rewards (100 at t=10) create pressure to move first and preempt the other.  
  - **Risk of early commitment:** Committing at t=10 risks collision (0 points) if the other does the same.  
  - **Cost of waiting:** Delaying risks being preempted (earning 0 if the other commits first).  
  - **Both better off with restraint?** If both wait until t=5, one *could* earn 50—but neither can trust the other to wait.  
  **→ Unlike coordination problems:** Players *compete* to seize the first-mover advantage, not align actions.  
  **→ Unlike waiting games:** Waiting has active costs (decaying rewards + preemption risk), not just patience.  

  ---

  ### **Debrief Plan**  
  **1. Map game outcomes to theory (5 mins):**  
  - **Commitment race:** Ask: *"Why did some pairs collide at t=10? Why might both regret winning?"*  
    → Highlight: Mutual early commitment (t=10 collisions) mirrors arms races—both lose despite "winning" the race.  
  - **War of attrition contrast:** *"Did anyone wait, hoping their partner would commit first? Why didn’t it work?"*  
    → Explain: Waiting games (e.g., startups in a market) involve endurance; here, waiting *accelerates* loss via decay/preemption.  
  - **First-mover advantage:** *"Who earned 100 points? Was it luck or strategy?"*  
    → Stress: Early commitment is rational but fragile—depends on predicting the other’s restraint.  

  **2. Normative question (3 mins):**  
  - *"Is it rational to regret winning? When?"*  
    → Examples:  
      - **Yes:** If you commit at t=10 and collide (0 pts), you regret not waiting to avoid collision.  
      - **No:** If you commit at t=10 alone (100 pts), you "won"—but socially, both might prefer enforced restraint (e.g., arms treaties).  
    → Key insight: Winners may still bear costs (e.g., cold war "victors" facing bankruptcy).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Refusal to commit (everyone waits):**  
     - **Likelihood:** High in Round 1 (caution).  
     - **Fix:** Point to the whiteboard: *"If both wait, rewards decay to 0. Is waiting rational long-term?"* Use Round 2 to show preemption risk.  

  2. **Round 1 collisions at t=10:**  
     - **Likelihood:** Very high (students test early commitment).  
     - **Fix:** Celebrate! *"This is the core tension. In Round 2, did you delay? What happened?"*  

  3. **Confusion about rules:**  
     - **Likelihood:** Moderate (e.g., "Can I commit at t=8 if they committed at t=9?").  
     - **Fix:** Clarify during demo: *"Once one commits, the other is locked out. Commit times are final."*  

  ---

  ### **What the Game Distorts & How to Compensate**  
  **Distortion:** Linear decay oversimplifies real-world rewards (e.g., in tech standards, first-mover advantages may not shrink predictably).  
  **Compensation in debrief:**  
  - *"In reality, rewards don’t always decay smoothly. Sometimes waiting reveals information (e.g., market demand). But the core trade-off remains: early action risks waste; delay risks preemption."*  
  - **Example:** "Think of VHS vs. Betamax: committing early (VHS) locked in market share, but if both rushed, both might have failed."  

  ---  
  \summary{Players vie to commit first in a decaying-reward environment, where early action risks mutual loss (collision) and delay risks being preempted.}
