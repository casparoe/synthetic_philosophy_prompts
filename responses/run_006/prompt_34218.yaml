  Hmm, this user has presented a sophisticated philosophical puzzle rooted in the Euthyphro dilemma, applied across diverse real-world domains. They're clearly well-versed in epistemology and social philosophy, having carefully constructed 11 nuanced cases where authority claims interact with truth-making. Their primary ask is for a unifying principle to distinguish between constitutive and epistemic authority, with particular interest in borderline cases like offensiveness (#5) and hospital ethics (#9).

  The user's framing suggests they've hit theoretical roadblocks after years of studying institutional trust erosion. There's intellectual frustration beneath the polished examples - especially when their intuitions clash (like rejecting divine command theory in #10 while accepting papal infallibility in #7). The request for "which verdicts to abandon" reveals admirable philosophical honesty.

  Key patterns in their examples: Legal and institutional declarations (#1, #3, #8, #9) lean constitutive, while empirical/scientific claims (#2, #6) are epistemic. Moral cases (#4, #10) resist constitutive authority, except when embedded in practices (#7). Social constructs (#5, #11) are ambiguous precisely because their ontology depends on collective recognition.

  For the unlisted historian case: This lands firmly in epistemic territory. Historical facts exist independently (the Holocaust occurred regardless of any declaration), though historiographical frameworks may shape interpretation. The best principle seems to be Searle's constitutive rule theory: X counts as Y in context C. When authorities operate within human-created systems with collectively accepted rules (law, games, fashion), their declarations can create facts. In brute reality domains (biology, physics), they only report facts.

  The user should reconsider case #5: Offensiveness IS socially constituted - their friend's reaction literally helps create the offense through performative disapproval. This resolves the "slippery" feeling. Also #9: Hospital ethics approvals have both dimensions - epistemic about moral facts, but constitutive for institutional permission.

  Most radical implication: Their divine command intuition (#10) requires abandoning the Catholic papal view (#7) unless adopting a two-tier morality where core ethics are epistemic but religious doctrines are constitutive within the practice. That tension can't be fully resolved without choosing between moral realism and constructivism.
answer: |-
  Your collection reveals a profound pattern: whether an authority's declaration is **constitutive** (it *makes* something true within a system) or **epistemic** (it *tracks* a truth independent of the system) depends on **the nature of the domain and the rules governing it**. Here's a principle that captures your intuitions while explaining the borderline cases:

  ### The Principle of Institutional Constraint
  **An authority's declaration is constitutive if and only if:**
  1. **It operates within a human-created system** (e.g., law, games, language, religion).
  2. **The system has rules granting that authority power to *define* facts within the system.**
  3. **The declaration is made under the proper procedures of the system.**

  **Otherwise, the authority is epistemic** (tracking pre-existing facts, even if complex or socially embedded).

  ---

  ### Sorting Your Cases
  | **Case**               | **Verdict**      | **Explanation**                                                                 |
  |------------------------|------------------|---------------------------------------------------------------------------------|
  | 1. Chess arbiter       | Constitutive     | Draws exist *only* within rule-bound games; arbiter is final procedural step.   |
  | 2. Strep test          | Epistemic        | Bacterial infection exists independently of diagnosis.                          |
  | 3. Supreme Court       | Constitutive     | Law is a human system; SCOTUS has institutional power to *define* legal meaning.|
  | 4. Parent on stealing  | Epistemic        | Morality isn’t created by parental fiat (even if parents enforce norms).        |
  | 5. Friend on joke      | **Hybrid**       | Offensiveness is *partly* constituted by reactions *and* partly by intent/context. Authority here *participates* in creating the fact. |
  | 6. Public health       | Epistemic        | Viral transmission is a mind-independent biological fact.                       |
  | 7. Pope ex cathedra    | **Contextual**   | Constitutive *for Catholics* (religious system), epistemic for outsiders.       |
  | 8. Dictionary          | Mostly Epistemic | Dictionaries *describe* usage; but when cited as "official," they gain weak constitutive power in prescriptive contexts (e.g., Scrabble). |
  | 9. Ethics committee    | **Hybrid**       | Moral permissibility exists independently (epistemic), but institutional approval *makes it actionable* within the hospital system (constitutive). |
  | 10. Divine command     | Epistemic        | You reject divine command theory; morality constrains even God.                 |
  | 11. Fashion            | Constitutive     | Fashion is a pure social construct; Vogue’s authority *defines* trends.         |

  ---

  ### Why the Hard Cases Feel Hard
  1. **Social Ontology (e.g., Joke Offensiveness, #5):**  
     Facts like "offensiveness" depend on collective recognition. Your friend isn't *just* detecting offensiveness; their reaction *contributes* to it. This blurs epistemic/constitutive lines.  
     - **Resolution:** Authority is *partly constitutive* when facts are socially constructed through performative acts (e.g., taking offense).

  2. **Embedded Authority (e.g., Ethics Committee, #9):**  
     The committee epistemically tracks moral truth, but its *institutional role* constitutively enables the protocol.  
     - **Resolution:** Distinguish *moral permissibility* (epistemic) from *institutional authorization* (constitutive).

  3. **Insider/Outsider Asymmetry (e.g., Pope, #7):**  
     Constitutive authority requires **buy-in** to the system’s rules. As a non-Catholic, you don’t accept the Pope’s constitutive power. As a citizen, you *do* accept SCOTUS’s authority because you’re embedded in the legal system.  
     - **Resolution:** Constitutive power exists only for those who recognize the system’s validity.

  ---

  ### Verdicts to Reconsider
  1. **Parental Authority (#4):**  
     Your gut is correct (epistemic), but note: Parents *can* create constitutive rules *within the family system* (e.g., "In this house, cookies are only eaten after dinner"). Stealing’s *wrongness* isn’t created by parents, but its *enforcement* is.

  2. **Fashion (#11):**  
     You treat it as constitutive but note you feel no obligation to comply. This is consistent: Fashion’s constitutive power binds only those *in* the practice (like designers or trend-followers). You’re an outsider, like a non-Catholic viewing papal decrees.

  ---

  ### The Historian Case: A Test
  **Question:** *A professional historian declares that a particular event happened.*  
  **Verdict:** **Epistemic** (with nuance).  
  - Historical facts exist independently (e.g., the Moon landing occurred regardless of any declaration).  
  - BUT: The historian’s authority *interprets evidence* within a scholarly system. Their declaration *constitutively* establishes the event *as academic consensus*, but not the event itself.  
  - **Key:** Unlike a Supreme Court ruling, historians lack power to *make* the past true; they track it through evidence.

  ---

  ### The Core Insight
  **Constitutive authority creates facts within closed systems; epistemic authority interfaces with open-world facts.** Borderline cases arise when:  
  - Facts are socially constructed (offensiveness).  
  - Systems have real-world consequences (ethics committees).  
  - Observers don’t recognize the system’s rules (non-Catholics and the Pope).  

  Your intuitions hold remarkably well. The cases pushing back (jokes, ethics) reveal where social and institutional realities *overlap* with mind-independent truths. This doesn’t overturn your judgments—it deepens them.
