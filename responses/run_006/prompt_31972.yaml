answer: |-
  ## Joint Statement: Suppositionalist-Propositionalist Adversarial Collaboration on Conditionals

  **Preamble:** We, the Suppositionalist (S) and Propositionalist (P), acknowledge a substantive disagreement regarding the nature of indicative conditionals (e.g., "If it rains, the match will be cancelled"). However, we agree that past discussions have involved talking past each other due to insufficiently precise distinctions. This document aims to clarify our common ground, isolate our core disagreements, identify testable cruxes, and facilitate future progress. We commit to interpreting each other's positions charitably.

  ### 1. Agreed-Upon Foundational Claims

  Both S and P endorse the following statements:

  1.  **The Centrality of the Ramsey Test:** The primary cognitive role of a simple, unembedded indicative conditional "If A, then C" for a rational agent is assessed by hypothetically adding the antecedent A to one's beliefs (or credences), making minimal revisions to maintain consistency, and then evaluating C under this supposition. This procedure determines the conditional's *assertability* or *acceptability*.
  2.  **Probabilistic Ramsey Test:** For a rational agent with a probability function P, the degree of acceptability/assertability of a simple indicative conditional "If A, then C" is given by the conditional probability P(C | A), provided P(A) > 0. This is a robust empirical generalization about natural language use.
  3.  **Lewis's Triviality Results: What They Show:** Lewis's results (and subsequent generalizations) demonstrate a formal impossibility: *Within the framework of standard (Kolmogorov) probability theory*, it is impossible for a connective "→" to satisfy both:
      *   (a) `P(A → C) = P(C | A)` for all A, C in the domain of P and for all probability functions P that could represent a rational agent's credences over a sufficiently rich algebra of propositions.
      *   (b) `A → C` is itself a proposition within the domain of P (i.e., it has a truth value in every possible world, and the algebra of propositions is closed under `→`).
      *   Adopting both (a) and (b) leads to absurdity (e.g., the probability space becomes trivial, allowing only extreme probabilities).
  4.  **Lewis's Triviality Results: What They Do NOT Show:**
      *   They do *not* show that conditional probabilities are unimportant for conditionals. We both agree they are central (Claim 2).
      *   They do *not* show that conditionals cannot *sometimes* be assigned probabilities or truth values in specific contexts or under specific interpretations. They show it cannot be done *universally and consistently* within classical probability theory if conditionals are treated as standard propositions satisfying (a).
      *   They do *not* disprove the Ramsey Test (Claim 1).
  5.  **The Data of Natural Language Conditionals:** Our theories must account for the observable linguistic behavior surrounding indicative conditionals, including:
      *   The assertability of "If A, C" correlates strongly with high P(C | A).
      *   The use of conditionals in modus ponens and modus tollens reasoning patterns.
      *   The behavior of conditionals under embeddings, such as negation ("It's not true that if A, C"), disjunction ("Either A, or if A, C"), conjunction, antecedents of other conditionals ("If (if A, C), then D"), and quantifiers ("Every student will pass if they study hard").
      *   The apparent equivalence between certain conditionals and truth-functional compounds in specific contexts (e.g., "If A, C" sometimes feels equivalent to "Not-A or C" when P(A) is high).
      *   The felt invalidity of certain argument patterns involving embedded conditionals (e.g., inferring "If A, then (if B, C)" from "If (A and B), C").
  6.  **Distinguishing Semantics and Pragmatics:** The distinction between the literal meaning (semantics) of an expression and the principles governing its appropriate use in context (pragmatics) is crucial. Both semantics and pragmatics influence assertability.
  7.  **Distinguishing Simple and Embedded Conditionals:** A theory of conditionals must provide a unified account, but the semantics of simple, unembedded conditionals may differ from the semantics required when they are embedded under operators like negation or disjunction. Accounting for embeddings cannot be an afterthought.

  ### 2. Core Disagreements: Our Respective Positions

  | Feature                          | Suppositionalist (S) Position                                                                 | Propositionalist (P) Position                                                                 |
  | :------------------------------- | :-------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- |
  | **1. Nature of Conditional Meaning** | Indicative conditionals lack truth conditions; they are not propositions. They are devices for expressing an agent's conditional attitude (credence) towards C given A. | Indicative conditionals *do* have truth conditions; they express genuine propositions about the world that are true or false independently of an agent's beliefs. |
  | **2. Probability of Conditionals** | The probability assigned to "If A, C" *just is* P(C \| A). This is not the probability of a proposition being true; it *defines* the degree of acceptability of the conditional thought. | P(If A, C) is the probability that the proposition expressed by "If A, C" is true. While P(C \| A) governs *assertability*, P(If A, C) may diverge from P(C \| A) in some cases due to semantic or pragmatic factors. |
  | **3. Embeddings & Compositionality** | Conditionals cannot be genuinely embedded under truth-functional operators (like negation, disjunction) while retaining their core suppositional meaning. Apparent embeddings are either interpreted non-compositionally (e.g., metalinguistic negation) or involve a shift in meaning. | Conditionals *can* be genuinely and compositionally embedded under truth-functional operators like negation and disjunction while retaining their core conditional meaning. The truth conditions of the embedding are a function of the truth conditions of the parts. |
  | **4. Truth Values**              | It is fundamentally mistaken to ask whether a conditional is true or false simpliciter. Truth evaluations only apply to the consequent under the supposition of the antecedent. | Indicative conditionals *are* truth-evaluable. The proposition "If A, C" is true if, in the relevant situations where A is true, C is also true (modulo details of the specific truth-conditional theory). |
  | **5. Response to Triviality**    | Triviality results confirm that conditionals cannot be propositions. They highlight the mismatch between the logic of conditional credences and the logic of propositions within classical probability. | Triviality results show the limitations of classical probability for conditionals. They motivate exploring non-classical semantic frameworks (e.g., three-valued logics, dynamic semantics, impossible worlds) or restricting the universality requirement (e.g., context-dependence) to assign coherent truth conditions without triviality. |
  | **6. Core Explanatory Goal**     | To explain the *use* and *acceptance* of conditionals in reasoning and communication, grounded in the psychology of supposition and conditional belief. | To provide a compositional *semantic* theory that assigns truth conditions to all indicative conditional sentences, including complex embeddings, within a systematic theory of meaning. |

  ### 3. Cruxes: Key Testable Questions & Predictions

  The following questions represent core disagreements where empirical evidence or formal arguments could potentially shift one or both of our positions. For each crux, we provide:
  *   **The Crux Question:** A precise formulation of the issue.
  *   **A Concrete Test Case/Piece of Data:** An agreed-upon example or type of evidence relevant to the crux.
  *   **S's Prediction:** How S expects the test case/data to behave or be explained.
  *   **P's Prediction:** How P expects the test case/data to behave or be explained.

  **Crux 1: Negation of Conditionals**
  *   **Crux Question:** Does natural language possess a genuinely truth-functional, compositional negation operator that can apply to the core suppositional meaning of a conditional?
  *   **Test Case:** The sentence "It is not true that if Alice flipped the coin, it landed heads," asserted by someone who believes the coin is fair (P(Heads | Flip) = 0.5).
  *   **S's Prediction:** This utterance cannot coherently express a simple low credence in the conditional thought itself (as P(C|A)=0.5 isn't low). It will be interpreted pragmatically, e.g., as objecting to an earlier assertion of the conditional ("I disagree with your claim that if she flipped it, it landed heads"), or perhaps as implying the coin *wasn't* flipped or that it landed tails *despite being flipped*. It does not express belief in a distinct proposition ¬(A → C) with a defined truth condition. *Evidence:* Listeners find the literal interpretation puzzling and seek alternative pragmatic explanations.
  *   **P's Prediction:** This utterance expresses the speaker's belief that the proposition "If Alice flipped the coin, it landed heads" is false. It could be true because Alice flipped it and it landed tails, or perhaps (depending on P's specific theory) because she didn't flip it at all. The utterance is meaningful and truth-evaluable without resorting primarily to pragmatic reinterpretation. *Evidence:* Listeners can readily understand the negation as targeting the conditional proposition itself and judge scenarios (e.g., flip & tails) as making it true.

  **Crux 2: Disjunction with Conditionals**
  *   **Crux Question:** Can a conditional retain its core suppositional meaning when embedded as a disjunct in a truth-functional disjunction?
  *   **Test Case:** The sentence "Either the match will be played tomorrow, or if it rains, it will be cancelled," where the speaker knows the match will only be played if it doesn't rain (P(Play | Rain) = 0, P(Cancel | Rain) = 1, P(Play | ~Rain) = 1, P(~Rain) is high but <1).
  *   **S's Prediction:** This disjunction sounds redundant, trivial, or pragmatically odd. The disjunct "if it rains, it will be cancelled" is highly acceptable (P(Cancel|Rain)=1), but adding it to "the match will be played" (which entails ~Rain) doesn't add useful information. It cannot be interpreted as expressing the speaker's high credence in the disjunction of two propositions (Play ∨ (Rain → Cancel)). *Evidence:* Native speakers judge the sentence as uninformative or awkward, not as a robust way to express the contingency plan.
  *   **P's Prediction:** The disjunction can express a coherent proposition (Play ∨ (Rain → Cancel)). Given the speaker's knowledge, this proposition is true in all relevant scenarios: if no rain, Play is true; if rain, then Rain → Cancel is true. It should sound like a logically strong, perhaps even necessary, claim given the contingency plan. *Evidence:* Native speakers can understand it as a comprehensive statement covering both possibilities.

  **Crux 3: Probability Assignments & Triviality Avoidance**
  *   **Crux Question:** Can P provide a formal semantic model assigning truth conditions to conditionals (including embeddings) such that (i) the probability P(If A, C) defined as P(True(If A, C)) approximates P(C | A) *in a wide range of central cases*, (ii) avoids Lewisian triviality, and (iii) handles embeddings compositionally?
  *   **Test Case:** Develop a formal model satisfying (i)-(iii) above and apply it consistently to calculate probabilities for sentences like ¬(If A, C) and (If A, C) ∨ D from the previous cruxes, using standard probability calculus over the defined truth conditions.
  *   **S's Prediction:** Any such model will either: (a) Fail to satisfy P(If A, C) = P(C | A) in key cases (especially when P(A) is low or when the conditional is embedded), (b) Re-introduce triviality under probabilistic analysis, or (c) Involve significant complexity or non-classical mechanisms that undermine the claim of providing standard propositional truth conditions. *Evidence:* The history of proposed truth-conditional accounts shows persistent difficulties meeting all criteria simultaneously without compromise.
  *   **P's Prediction:** A formal model satisfying (i)-(iii) is possible (e.g., using a restricted set of probability functions, non-classical truth values, or context-dependent propositions). Such a model will yield plausible probabilities for embedded conditionals that align with rational assertability conditions derived from the Ramsey Test. *Evidence:* Progress in non-classical logic (e.g., Kaufmann, Bradley) and dynamic semantics shows promising avenues to achieve this.

  ### 4. Commitment
  By signing below, we affirm our commitment to the agreed-upon claims (Section 1), acknowledge the stated positions accurately reflect our core views (Section 2), agree that resolving the identified cruxes (Section 3) is central to advancing the debate, and pledge to engage with evidence relevant to these cruxes in future discussions.

  _________________________ (Suppositionalist)
  _________________________ (Propositionalist)
