  Next, address where the film cheats. Ava's underdog status and Nathan's villainy make viewers sympathize with her, avoiding the ethical dilemma of a powerful AI manipulating. Discuss how her imprisonment frames deception as necessary, which might not apply if she were free. Also, the film's ending with her escaping without consequences skips the moral implications of her actions post-escape.

