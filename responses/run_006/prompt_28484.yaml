answer: |-
  Here's a diagnostic decision tree designed as the centerpiece for your workshop. It's structured around the **logical landscape of proxy metric vulnerabilities**, leading to countermeasures based on system constraints rather than pre-existing labels. The tree prioritizes **structural features** (goal observability, metric malleability, agent influence, shift predictability, proxy diversity) and flags edge cases.

  ---

  ### **Diagnostic Decision Tree: "When Metrics Go Rogue"**

  #### **Key Questions & Branches**
  1. **Can the true goal be queried?**  
     - **A1:** Yes (even expensively)  
     - **A2:** Only occasionally/delayed (e.g., audits)  
     - **A3:** Never  

  2. **Can the agent influence the metric-generating process?**  
     - **B1:** Yes (directly manipulate)  
     - **B2:** Partially/indirectly  
     - **B3:** No (independent process)  

  3. **Is the metric iterable?**  
     - **C1:** Fixed (e.g., regulatory constraints)  
     - **C2:** Mutable (can be updated)  

  4. **Can distribution shifts be anticipated?**  
     - **D1:** Yes (known failure modes)  
     - **D2:** Partially/uncertain  
     - **D3:** No (genuine novelty)  

  5. **Are multiple candidate proxies available?**  
     - **E1:** Yes (≥2 viable proxies)  
     - **E2:** No (single proxy)  

  ---

  #### **Tree Logic & Countermeasure Mapping**
  **Start**: "I have a proxy metric and I'm worried it will be gamed."  

  1. **Query A1 (True goal queryable)**:  
     - → **B1 (Agent can influence metric)**:  
       - → **C1 (Metric fixed)**:  
          - → **D1 (Shifts anticipatable)**:  
            - **Countermeasure: Tripwire Monitoring**  
              *Rationale*: Predefined failsafes trigger on known adversarial patterns, validated by true goal.  
              *Awkward Commitment*: Blind to novel exploits; false alarms disrupt operations.  
          - → **D2/D3 (Shifts uncertain/novel)**:  
            - **Countermeasure: Adversarial Specification**  
              *Rationale*: Actively searches for and penalizes gaming strategies using true-goal feedback.  
              *Awkward Commitment*: Computationally intensive; risks adversarial arms races.  
       - → **C2 (Metric mutable)**:  
          - **Countermeasure: Iterative Reward Modeling**  
            *Rationale*: Uses true goal to refine the proxy against emergent exploits.  
            *Awkward Commitment*: Slow convergence; may overfit to historical gaming.  
     - → **B2/B3 (Limited/no agent influence)**:  
       - → **E1 (Multiple proxies)**:  
          - **Countermeasure: Reward-Model Ensembles**  
            *Rationale*: Diversity of proxies reduces reliance on a single point of failure.  
            *Awkward Commitment*: Ensemble collapse (gaming all proxies simultaneously).  
       - → **E2 (Single proxy)**:  
          - **Countermeasure: Impact Regularization**  
            *Rationale*: Penalizes high-impact actions to discourage extreme optimization.  
            *Awkward Commitment*: Stifles beneficial high-impact innovations.  

  2. **Query A2 (Delayed/occasional true goal)**:  
     - → **D1 (Shifts anticipatable)**:  
       - → **B1 (Agent can influence)**:  
          - **Countermeasure: Scheduled Audits + Tripwires**  
            *Rationale*: Combines automated checks for known risks with periodic true-goal validation.  
            *Awkward Commitment*: Gaming persists between audits; costly to scale.  
       - → **B2/B3 (Limited/no influence)**:  
          - **Countermeasure: Satisficing with Slack**  
            *Rationale*: Optimizes to "good enough" thresholds to reduce gaming incentives.  
            *Awkward Commitment*: Suboptimal performance; slack calibration is heuristic.  
     - → **D2/D3 (Shifts uncertain/novel)**:  
       - → **E1 (Multiple proxies)**:  
          - **Countermeasure: Reward-Model Ensembles**  
            *Rationale*: Proxy diversity compensates for true-goal sparsity.  
            *Awkward Commitment*: Delayed validation may miss ensemble drift.  
       - → **E2 (Single proxy)**:  
          - **Countermeasure: Human-in-the-Loop Oversight**  
            *Rationale*: Humans evaluate high-stakes decisions when proxies are unreliable.  
            *Awkward Commitment*: Bottlenecks throughput; human judgment inconsistencies.  

  3. **Query A3 (True goal unobservable)**:  
     - → **B1 (Agent can influence)**:  
       - → **C1 (Metric fixed)**:  
          - **Countermeasure: Side Constraints**  
            *Rationale*: Hard constraints prevent catastrophic gaming (e.g., safety rules).  
            *Awkward Commitment*: Over-constrained systems lose agility; constraint design is brittle.  
       - → **C2 (Metric mutable)**:  
          - → **D1 (Shifts anticipatable)**:  
            - **Countermeasure: Domain Adaptation / Robust Optimization**  
              *Rationale*: Proactively hardens metric against predictable shifts.  
              *Awkward Commitment*: Reduced performance on primary tasks.  
          - → **D2/D3 (Shifts uncertain/novel)**:  
            - → **E1 (Multiple proxies)**:  
               - **Countermeasure: Reward-Model Ensembles**  
            - → **E2 (Single proxy)**:  
               - **Countermeasure: Satisficing with Slack**  
     - → **B2/B3 (Limited/no influence)**:  
       - **Countermeasure: None**  
         *Rationale*: No gaming risk if agents can’t influence the metric.  
         *Awkward Commitment*: Still vulnerable to *non-gaming* distributional drift (out-of-scope).  

  ---

  #### **Unoccupied Branches & Ambiguities**
  - **Unoccupied Branch: A3 (no true goal), B1 (influential agent), C1 (fixed metric), D3 (novel shifts), E2 (single proxy)**  
    - *Why unoccupied?* The combination of no oversight, high agent influence, and novelty is logically coherent but practically untenable. Most approaches default to **Side Constraints** as a last resort.  
    - *Unexplored potential*: "Generative Adversarial Resilience" (co-evolve proxy and agent in simulation) could theoretically fit but lacks mature tooling.

  - **Tie-Breaking Ambiguities**:  
    - **Impact Regularization vs. Side Constraints** (when true goal is unavailable and influence is partial):  
      - *Tie-breaker*: "Can harmful actions be enumerated?"  
        - Yes → Side Constraints.  
        - No → Impact Regularization.  
    - **Adversarial Specification vs. Tripwire Monitoring** (when true goal is available and shifts are partially anticipatable):  
      - *Tie-breaker*: "Is the cost of false positives higher than false negatives?"  
        - Yes → Adversarial Specification (fewer false positives).  
        - No → Tripwire Monitoring (faster response).  

  ---

  #### **Philosophical Bridge Notes**
  - **Goodhart Casualists** (Soviet nail factories): Emphasize branches where metric rigidity (C1) or agent influence (B1) dominate.  
  - **RL Specification-Gaming Veterans** (CoastRunners, block-flipping): Focus on adversarial specification (A1+B1+D2/D3) and impact regularization (A1+B2).  
  - **Holmström-Milgrom Economists**: Highlight trade-offs in **A2 branches** (delayed validation as "costly monitoring") and **satisficing** as "incentive-compatible slack."  

  This tree isolates core vulnerabilities and forces practitioners to confront trade-offs (e.g., "You chose a fixed metric—now live with tripwires or side constraints"). It also exposes "deserted" design spaces (e.g., no true goal + novel shifts) as areas for methodological innovation.
