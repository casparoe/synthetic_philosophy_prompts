answer: |-
  Here's a specification for a theory of moral responsibility, structured as desiderata (requirements) with motivations, categorized by type. Conflicts and a scorecard for major theories follow.

  ---

  ### **Core Desiderata for a Theory of Moral Responsibility**

  #### **I. Non-Negotiable Foundational Requirements**
  *(Widely agreed upon as essential for *any* minimally adequate theory)*

  1.  **The Control Condition (CC):**
      *   **Requirement:** An agent is morally responsible for an action/outcome only if they exercised some relevant form of control over it.
      *   **Motivation:** Intuition that responsibility requires the action wasn't *merely* a random event or something that *happened to* the agent (e.g., being pushed off a ledge vs. jumping).
      *   **Non-Negotiable:** Yes. Denial leads to absurdity (e.g., holding someone responsible for a seizure).

  2.  **The Epistemic Condition (EC):**
      *   **Requirement:** An agent is morally responsible for an action/outcome only if they possessed some relevant knowledge or understanding (of the action's nature, consequences, or moral status).
      *   **Motivation:** Intuition that ignorance can excuse (e.g., giving someone peanuts not knowing they have a fatal allergy vs. knowing and doing it anyway).
      *   **Non-Negotiable:** Yes. Denial undermines fairness (e.g., blaming someone who couldn't have known).

  3.  **The Ownership Condition (OC):**
      *   **Requirement:** The action/outcome must be properly *attributable* to the agent *as an agent* – it must express their will, values, character, or practical reasoning in some significant way.
      *   **Motivation:** Distinguishes actions from mere reflexes, coerced movements, or actions performed under hypnosis. The action must be "the agent's own."
      *   **Non-Negotiable:** Yes. Prevents responsibility for actions utterly alien to the agent's identity.

  4.  **Frankfurt Case Adequacy (FCA):**
      *   **Requirement:** The theory must accommodate the intuition that agents in standard Frankfurt cases *are* morally responsible, despite lacking alternative possibilities (PAP).
      *   **Motivation:** Frankfurt cases demonstrate PAP is not *necessary* for responsibility. A theory must explain *why* responsibility persists when alternative possibilities are absent but the agent acts "on their own."
      *   **Non-Negotiable:** Effectively yes for contemporary theories (except hard skeptics/libertarians). PAP's failure is a major driver of modern theorizing.

  #### **II. Handling Key Problem Cases**
  *(Theories must plausibly explain responsibility/ascription in these scenarios)*

  5.  **Manipulation Cases (MC):**
      *   **Case:** An agent is covertly manipulated (e.g., via brainwashing, indoctrination, futuristic neurosurgery) into acquiring desires, beliefs, or values that lead them to perform a specific action "freely" according to standard compatibilist criteria (e.g., Professor Plum in Pereboom's "Four Case Argument").
      *   **Requirement:** The theory must either (a) explain why such agents are *not* responsible (undermining OC/CC), or (b) explain *why* the manipulation is relevantly different from normal causation (preserving OC/CC).
      *   **Motivation:** Tests the robustness of the Ownership (OC) and Control (CC) conditions. If normal development and manipulation are causally similar, does responsibility vanish? Or can the theory distinguish them?

  6.  **Negligence & Omission Cases (NOC):**
      *   **Case:** Responsibility for failing to act (omissions) or acting without sufficient care (negligence), where the agent didn't consciously choose the bad outcome (e.g., forgetting a child in a hot car; failing to maintain equipment leading to an accident).
      *   **Requirement:** The theory must explain how responsibility arises for outcomes not directly intended or foreseen, often linking it to derivative responsibility for the culpable state (e.g., prior recklessness, flawed character traits) or failures of reasonable attention.
      *   **Motivation:** Much everyday responsibility concerns failures, not just deliberate wrongs. A theory must account for this.

  7.  **Derivative Responsibility Cases (DRC):**
      *   **Case:** Responsibility for outcomes caused by others or things under one's supervision/authority (e.g., a CEO for company malfeasance; a parent for a child's destructive act due to neglectful supervision; responsibility for knowingly creating risks).
      *   **Requirement:** The theory must explain how responsibility can extend beyond direct, immediate actions to consequences mediated by others or systems, grounded in prior duties, roles, or failures of the responsible agent.
      *   **Motivation:** Captures common practices of holding individuals responsible for systemic failures or the actions of subordinates/dependents.

  #### **III. Essential Conceptual Distinctions**
  *(The theory must respect these nuances)*

  8.  **Responsibility vs. Being Held Responsible (RvH):**
      *   **Requirement:** The theory must distinguish the metaphysical/descriptive fact *that* an agent is responsible from the normative/practical decision *to* hold them responsible (via blame, praise, punishment, reward). The latter may be inappropriate even if the former holds (e.g., due to forgiveness, impracticality, mercy).
      *   **Motivation:** Prevents conflation of desert with social practices. Explains why we might choose *not* to blame someone even if they *are* blameworthy.

  9.  **Attributability vs. Accountability (AvA):**
      *   **Requirement:** The theory must distinguish (or coherently relate):
          *   **Attributability:** Is the action expressive of the agent's deep self/values/character (OC)? (e.g., a spontaneous act of cruelty reveals a cruel character).
          *   **Accountability:** Does the agent *merit* a response (blame/praise) from others, implying they had the relevant control (CC) and epistemic access (EC) to be *answerable* for it?
      *   **Motivation:** An action might be attributable (revealing bad character) but the agent not accountable (e.g., due to insanity, coercion). Accountability requires stronger conditions.

  10. **Blameworthiness vs. Praiseworthiness Symmetry/Asymmetry (BvP):**
      *   **Requirement:** The theory must address whether the conditions for blameworthiness and praiseworthiness are symmetrical (same core conditions) or asymmetrical (e.g., praise might require stronger control, better motives, or rarer achievements than blame).
      *   **Motivation:** Intuitions diverge. Some feel blame requires more stringent conditions (e.g., only blame for ill will, but praise for any good outcome). Others see symmetry. The theory needs a stance.

  #### **IV. Empirical Constraints**
  *(Must be consistent with, or not contradicted by, robust scientific findings)*

  11. **Compatibility with Determinism (CD):**
      *   **Requirement:** The theory must either be compatible with causal determinism (Compatibilism) or provide a plausible account of indeterminism consistent with agency (Libertarianism). Skeptics deny responsibility is possible under determinism (and often under indeterminism too).
      *   **Motivation:** Physics/neuroscience strongly suggest determinism (at macro levels relevant to action). A theory requiring radical indeterminism faces significant empirical hurdles.

  12. **Agency & Cognitive Science (ACS):**
      *   **Requirement:** The theory's account of deliberation, choice, intention-formation, and action must be plausible given cognitive science (e.g., role of unconscious processes, heuristics, biases, emotions).
      *   **Motivation:** Challenges overly rationalistic or purely conscious models of agency. Theories must accommodate that much processing is automatic/sub-personal.

  13. **Libet-Style Findings (LSF):**
      *   **Finding:** Neural activity (readiness potential) precedes conscious awareness of the decision to act by several hundred milliseconds.
      *   **Requirement:** The theory must not rely on a simplistic model where conscious intention *initiates* action in a way directly contradicted by Libet-style results. It must explain how conscious deliberation/endorsement relates to sub-conscious processes in a way consistent with responsibility.
      *   **Motivation:** Raises questions about conscious control and the role of "veto power." *Note:* Interpretation is highly contested, but theories can't ignore it.

  #### **V. Theoretical Virtues**
  *(Desirable features for coherence and explanatory power)*

  14. **Non-Circularity (NC):**
      *   **Requirement:** The theory's core conditions (CC, EC, OC) must not be defined in terms that implicitly presuppose responsibility.
      *   **Motivation:** Avoids vacuity. E.g., defining control as "the kind needed for responsibility" is circular.

  15. **Non-Redundancy (NR):**
      *   **Requirement:** The theory's core conditions should not reduce to one another or be derivable from a single, simpler principle without loss of explanatory power.
      *   **Motivation:** Promotes theoretical elegance and identifies fundamental components.

  16. **Fit with Reactive Attitudes (FRA):**
      *   **Requirement:** The theory should provide a plausible explanation for the role and appropriateness of reactive attitudes (resentment, indignation, guilt, gratitude, pride) in our practices of holding responsible.
      *   **Motivation:** Strawson's insight: these attitudes are central to the *experience* and social practice of responsibility. A good theory shouldn't render them inexplicable or wholly inappropriate. *Note:* More central to Strawsonian views, but a plus for others.

  ---

  ### **Key Tensions & Conflicts Between Desiderata**

  1.  **Frankfurt Cases (FCA) vs. Manipulation Cases (MC):** This is the **core tension**.
      *   Theories that successfully explain FCA (e.g., Reasons-Responsiveness, Strawsonian) by focusing on the *actual sequence* of the agent's reasoning/attitudes often struggle with MC. If the manipulated agent's actual sequence *also* meets the conditions (e.g., reasons-responsiveness, expression of deep self), why aren't they responsible? Theories must find a principled difference between manipulation and ordinary causation shaping character/reasons-responsiveness. Skeptics exploit this tension.
      *   Theories that take MC seriously and deny responsibility (or require historical conditions) often struggle to explain FCA without smuggling in alternative possibilities or weakening the historical condition for FCA cases specifically, risking ad-hocness. Libertarians avoid MC by requiring indeterminism, but fail FCA.

  2.  **Control (CC) & Ownership (OC) vs. Determinism (CD):**
      *   Libertarians argue robust CC/OC requires indeterminism, conflicting with CD. Compatibilists argue robust CC/OC is achievable deterministically, facing challenges from manipulation cases (MC) and intuitions about "ultimate control."

  3.  **Attributability (AvA-Attrib) vs. Accountability (AvA-Account) in Edge Cases:**
      *   Cases like severe psychopathy or extreme deprivation might show actions attributable to the agent (expressing their values) but raise doubts about accountability (did they have the capacity for moral reasoning/control?). A theory must specify the relationship clearly.

  ---

  ### **Scorecard of Major Theories**

  | Desideratum                        | Reasons-Responsiveness (RR)                                | Strawsonian                                                 | Skeptical (Hard Incompatibilist) | Libertarian                                  |
  | :--------------------------------- | :--------------------------------------------------------- | :---------------------------------------------------------- | :------------------------------- | :------------------------------------------- |
  | **Control (CC)**                   | ✅ (Guidance Control)                                      | ✅ (Conditions for appropriate RAs imply control)            | ❌ (Denies genuine control exists) | ✅ (Requires robust indeterministic control) |
  | **Epistemic (EC)**                 | ✅ (Often built-in)                                        | ⚠️ (Often implicit in RA appropriateness)                   | N/A                              | ✅                                           |
  | **Ownership (OC)**                 | ✅ (Mechanism is "agent's own")                            | ✅ (Action springs from qualities triggering RAs)           | ❌ (Denies OC is sufficient)      | ✅                                           |
  | **Frankfurt Cases (FCA)**          | ✅✅ (Flagship strength)                                   | ✅✅ (Flagship strength)                                    | ✅ (No one responsible anyway)    | ❌ (Requires alternatives)                    |
  | **Manipulation Cases (MC)**        | ⚠️/❌ (Struggles: Manipulated mechanism may seem responsive) | ⚠️/❌ (Struggles: Manipulated agent may trigger RAs)        | ✅ (No one responsible)          | ✅ (Manipulation violates indeterminism)     |
  | **Negligence/Omission (NOC)**      | ⚠️ (Can handle via prior responsiveness/recklessness)      | ⚠️ (Can handle via RAs for carelessness)                    | ❌                                | ⚠️ (Can be challenging)                      |
  | **Derivative Resp (DRC)**          | ⚠️ (Possible via failures of oversight)                    | ⚠️ (Possible via RAs grounded in role duties)               | ❌                                | ⚠️                                           |
  | **RvH (Resp vs Held Resp)**        | ⚠️ (Can distinguish, not always emphasized)                | ✅✅ (Central distinction)                                  | ✅ (Trivially)                   | ⚠️                                           |
  | **AvA (Attrib vs Account)**        | ⚠️ (Often focuses on Account via RR)                       | ✅ (Often distinguishes quality of will vs answerability)   | ❌                                | ⚠️ (Often conflated)                         |
  | **BvP (Blame vs Praise)**          | Often Symmetrical                                         | Often Symmetrical                                           | N/A                              | Often Symmetrical                           |
  | **CD (Compat w/ Determinism)**     | ✅✅ (Compatibilist)                                       | ✅✅ (Compatibilist)                                        | ✅ (But denies responsibility)   | ❌ (Incompatibilist)                         |
  | **ACS (Cognitive Science)**        | ⚠️ (Rationalistic model challenged)                        | ✅ (Less reliant on conscious rationality)                  | ✅ (N/A)                         | ⚠️ (Relies on contested models of will)      |
  | **LSF (Libet Findings)**           | ⚠️ (Challenge to conscious initiation)                     | ✅ (Focuses on broader context of agency/attitudes)         | ✅ (N/A)                         | ❌❌ (Directly threatens initiation models)   |
  | **FRA (Fit w/ Reactive Attitudes)**| ⚠️ (Explains *when* RAs appropriate)                       | ✅✅ (Central explanatory role)                             | ❌ (RAs fundamentally misguided) | ⚠️ (Can explain, not central)               |

  **Legend:** ✅ = Strong, ⚠️ = Moderate/Qualified Success/Issue, ❌ = Weak/Failure, N/A = Not Applicable.

  ---

  ### **Conclusion: The Specification Challenge**

  No current theory satisfies *all* desiderata perfectly. The core tension lies between **handling Frankfurt cases** (FCA) and **handling manipulation cases** (MC) without collapsing into skepticism. RR and Strawsonian views excel at FCA but face significant pressure from MC. Libertarians avoid MC but fail FCA and face empirical challenges (CD, ACS, LSF). Skeptics avoid the tension by denying responsibility exists in the relevant desert-based sense.

  When evaluating theories, focus on:
  1.  How they resolve the **FCA/MC tension**.
  2.  Whether their account of **Control (CC)** and **Ownership (OC)** is robust and non-circular.
  3.  How well they explain **accountability practices** and the **Attributability/Accountability distinction (AvA)**.
  4.  Their **compatibility with determinism (CD)** and cognitive science (ACS).

  This specification provides the critical test cases and conceptual tools needed to dissect competing theories. Good luck navigating the literature!
