  The user's instinct about choosing a better prior might not work because of universality. Any computable prior is inside Solomonoff, so adversarial programs could still exist. Also, while proper scoring rules optimize for accuracy, they don't prevent deceptive simulations. 

  Parts that don't map cleanly: the self-referential deception (agents knowing they're simulated) and universality's inescapability. Standard Bayesian tools assume models are inert, not strategically adaptive during inference. 

