  Based on your friend's responses to the cases, her position on actual infinities can be characterized by distinguishing between the acceptability of completed infinite sets (as in Hilbert's Hotel and bijection arguments) and the definability of the state after a supertask (a process completing infinitely many steps in finite time). Specifically, she accepts the existence and manipulability of actual infinities in static or atemporal contexts, but for temporal supertasks, she only accepts a defined final state if the state stabilizes pointwise—that is, if for each individual component (e.g., a lamp's state or a tape cell), there is a time before the limit point after which it no longer changes. If the state does not stabilize pointwise (e.g., it oscillates indefinitely), she considers the final state undefined or the scenario ill-posed.

  This rule is consistent with her record:
