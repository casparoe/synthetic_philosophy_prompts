  ### Step-by-Step Procedure to Check for Simpson's Paradox  
  **Time:** Designed for ≤20 minutes per analysis on a CSV.  
  **Tools:** Basic statistical software (e.g., Python/pandas, R, Excel).  
  **Input:** CSV with columns for treatment (`T`), outcome (`Y`), and candidate stratifying variables (`S`).  

  ---

  #### **Procedure Checklist**  
  1. **Define Key Variables (1 min)**  
     - `T`: Binary/categorical treatment (e.g., `demographic_group`).  
     - `Y`: Binary outcome (e.g., `admitted: 1/0`).  
     - `S`: Candidate stratifying variables (e.g., `department`, `SAT_band`, `applicant_type`). *Select 1–3 likely confounders using domain knowledge.*  

  2. **Check Overall Association (2 min)**  
     - Compute overall effect:  
       - If `Y` is binary: **Risk difference (RD)** or **Risk ratio (RR)** between `T` groups.  
       - *Example:* `RD = P(admit | T=A) - P(admit | T=B)`.  
     - **Flag:** Note direction (positive/negative) and magnitude.  

  3. **Check Candidate `S` for Confounding Potential (3 min)**  
     For each `S`:  
     - **Association with `T`**:  
       - Categorical `S`: Contingency table + chi-square test.  
       - Continuous `S`: Bin into 3–4 groups (e.g., quartiles), then check distribution by `T`.  
     - **Association with `Y`**:  
       - Compute `P(Y=1)` per level of `S` (e.g., admission rate by department).  
     - **Keep `S` if**:  
       - It predicts both `T` and `Y` (e.g., `department` affects who applies (`T`) and admission rates (`Y`)).  
       - *Drop mediators* (e.g., `interview_score` is likely *caused* by `T`→ don’t stratify).  

  4. **Stratify by `S` and Compute Within-Strata Effects (10 min)**  
     For each retained `S`:  
     - Split data by levels of `S` (e.g., by department).  
     - Within each stratum, compute the same effect measure as in Step 2 (e.g., RD per department).  
     - **Key check**: Does the effect direction *flip* in *all* strata vs. overall?  
       - ✅ **No paradox**: All strata agree with overall direction (e.g., overall RD=+0.1, all strata RD≥0).  
       - ❌ **Paradox**: Overall and strata directions disagree (e.g., overall RD=+0.1, all strata RD≤-0.05).  
       - ⚠️ **Inconclusive**: Mixed directions (e.g., some strata +, some -).  

  5. **Decide and Escalate (4 min)**  
     - **"This is fine"**: No sign reversal + consistent direction → report overall.  
     - **Escalate**:  
       - If paradox (❌): Report stratified results. Example: *"Overall, Group A has 15% higher admission, but each department favors Group B. Analysis should be stratified by department."*  
       - If inconclusive (⚠️): Add covariates to a regression model (e.g., logistic regression with `T + S + T*S`).  
     - **Stop if**:  
       - No `S` is a confounder (Step 3).  
       - Sample size <20 per stratum (unreliable estimates).  

  ---

  ### **Where Judgment Applies**  
  1. **Choosing `S`**:  
     - *Confounder* (`T`←`S`→`Y`): Stratify (e.g., `department`).  
     - *Mediator* (`T`→`S`→`Y`): Do NOT stratify (e.g., `interview_score` caused by `T`).  
     - *Collider* (`T`→`S`←`Y`): Do NOT stratify (e.g., `yield_rate` if affected by both `T` and `Y`).  
     - *Rule of thumb*: Ask, "Does `S` *cause* `T` or *result* from it?" Use domain knowledge.  

  2. **Handling Small Samples**:  
     - Collapse sparse strata (e.g., merge rare departments) or discard if <20 observations.  

  3. **Continuous Variables**:  
     - Bin into meaningful groups (e.g., `SAT_band: low/mid/high`). Avoid arbitrary splits.  

  ---

  ### **Limitations**  
  - **Causal ambiguity**: Without a DAG, misclassifying `S` (e.g., mediator vs. confounder) can bias results.  
  - **Unmeasured confounders**: If a critical `S` isn’t in the data (e.g., applicant motivation), paradox may be invisible.  
  - **Small samples**: Strata with <20 observations may show false reversals.  

  ---

