          - If the direction of the association reverses in all strata, then Simpson's paradox is present.
          - If the direction is the same in all strata, then no paradox.
          - If there is a mix (some strata show reversal and others don't), then it's a judgment call (but typically, if the overall association is driven by the confounding and not the within-stratum effect, we adjust for S).
  4. If Simpson's paradox is found, report stratified results and explain the paradox.

  Note: The procedure is mechanical until step 3d. Step 3d requires judgment if the reversal is not uniform. Also, the choice of candidate S is a judgment call based on domain knowledge.

  Finally, the procedure cannot catch:
  - Unmeasured confounders (if S is not in the data, we can't stratify by it).
  - Mediators: if S is a mediator (on the causal path from T to Y), then stratifying by S would be inappropriate (it would block part of the effect of T). We should only stratify by confounders, not mediators. Without a causal graph, we rely on domain knowledge to decide if S is a confounder or a mediator.
  - Small sample sizes: if a stratum has very few observations, the within-stratum estimate may be unstable. We should check the sample sizes in each stratum and maybe not report strata with very small samples.

  We hope this procedure helps!
