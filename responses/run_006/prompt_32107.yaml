  I want you to write me a proper procedure for checking whether Simpson's paradox is messing with a dataset. Like, an actual checklist I can go through before I send any analysis upstairs. What questions do I ask, in what order? What do I compute? Where do I stop and say "this is fine" and where do I escalate? And crucially — where does the procedure stop being mechanical and start being a judgement call? Like, I know the difference between a confounder, a mediator, and a collider matters for this, but how do I actually operationalize that when I'm just staring at column names in a CSV?

  Then run the procedure on two made-up-but-realistic datasets. One where it catches a real reversal and one where the subgroups look sketchy but it's actually fine. And please be honest about what the procedure can't catch — like, cases where you just can't know without a causal graph, or where the sample sizes are too small to tell either way.

  I'm a third-year undergrad, I've done regression and basic probability, but I'm not a grad student, so the procedure has to be something I can actually execute in like 20 minutes on a CSV. Don't give me theory — give me something I can use.
