  Hmm, the real challenge is balancing exhaustiveness with philosophical neutrality. For cases, I'll include classics but also edge cases like extreme self-sacrifice to test limits. The distinctions section needs care - e.g., imperfect duty debates (Urmson vs. Baron) could trip up novices but are essential. The obligatoriness paradox deserves its own category with sub-arguments (cost exemption, latitude preservation etc.).

  Noticing they're pre-theory-application: I should flag where Kantians vs consequentialists might weight desiderata differently. E.g., virtue ethicists might care more about character than act-classification. Must also warn about fault lines - like how "moral better but optional" risks collapsing into "merely good" unless sacrifice is emphasized.

  *scribbles mental outline* Core sections: Cases (non-negotiable), Conceptual Distinctions (some negotiable), Paradox Resolution (core but approach varies), Tensions (highlight tradeoffs). For non-negotiables: omitting grenade case would be fatal, but whether forgiveness is supererogatory might be contested. The blameworthiness criterion is stickier - some utilitarians reject blame for omissions.

  Ah! The kidney donor variation is key - donating to stranger vs. family tests impartiality. Should include that. Also must reference Chisholm/Saint paradigm cases for religious supererogation despite potential framework-dependence.

  Biggest tension to flag: Sacrifice vs. Moral Betterment. If an act is hugely beneficial with no personal cost (rich donor), is it still supererogatory? Theories split here. Need to show how this strains the "beyond duty" definition.

  *checking philosophical pitfalls* Must avoid smuggling in my own virtue-ethics leanings. Stay descriptive: present hedonistic calculus vs. agent-relative permissions as equally valid approaches. But do emphasize that denying supererogation entirely (a la some Kantians) fails the cases test - that's non-negotiable.

  User's phrasing suggests they'll handle theory application, so I'll resist giving examples. But the desiderata list must be granular enough to test, say, consequentialism's trouble with latitude vs. optimality. Ending with tensions gives them critical hooks for their paper.
answer: |-
  Here is a rigorously specified list of desiderata for a theory of supererogation, categorized by type, with flags for non-negotiables, framework-dependencies, and identified tensions:

  **I. Non-Negotiable Core Desiderata (Any adequate theory MUST account for these):**

  1.  **The Central Cases:**
      *   *The Heroic Sacrifice:* Explain why throwing oneself on a grenade to save comrades is supererogatory (e.g., the soldier case). It's morally better than ducking, but not obligatory. *(Non-negotiable constraint)*
      *   *Significant Beneficence:* Explain why donating a kidney to a stranger is supererogatory. It's morally better than keeping both kidneys, but not obligatory. *(Non-negotiable constraint)*
      *   *The "Beyond Duty" Character:* Capture the core intuition that supererogatory acts are *morally optional* yet *morally praiseworthy* and *morally better* than merely doing what is required (the minimum demanded by duty). *(Definitional Core - Non-negotiable)*
      *   **Why Non-negotiable:** These are the paradigmatic, uncontroversial examples and the defining feature of the concept. A theory failing these fundamentally mischaracterizes supererogation.

  2.  **Resolving the Central Paradox:**
      *   *The Why-Not-Obligatory Question:* Provide a coherent explanation for why, if a supererogatory act S is morally better than the merely permissible alternative P, performing S is *not* obligatory. This is the core theoretical puzzle. *(Non-negotiable constraint - The raison d'être of the theory)*
      *   *Common Explanatory Strategies Theories Must Engage With:* Cost/Sacrifice to the agent; Preservation of Moral Latitude/Choice; Non-demandingness of Morality; Agent-Relative Permissions.

  3.  **Distinguishing Supererogation from the Merely Permissible:**
      *   A theory must provide a clear criterion for why supererogatory acts are *morally special* compared to other permissible acts (like having vanilla ice cream instead of chocolate). They are praiseworthy and morally better, not just neutral options. *(Non-negotiable constraint)*
      *   *Blameworthiness for Omission:* Crucially, failing to perform a supererogatory act should *not* typically warrant moral blame or sanction (unlike failing in a duty), even if doing it would have been praiseworthy. *(Non-negotiable constraint - Key distinction from duty)*

  4.  **Distinguishing Supererogation from Imperfect Duties (e.g., beneficence, charity):**
      *   Imperfect duties (in the Kantian sense) require agents to adopt a maxim/make efforts towards a certain end (e.g., helping others) but allow significant latitude in *when, how,* and *towards whom* to fulfill it. A theory must explain how supererogatory acts *go beyond* the requirements of relevant imperfect duties.
      *   *Test Case:* While giving *some* charity might be required by an imperfect duty of beneficence, giving away a *life-changing* amount (like a kidney or vast wealth) is typically supererogatory. The theory must mark this boundary. *(Non-negotiable constraint - Major conceptual distinction)*

  **II. Important but Potentially Framework-Dependent or Contested Desiderata:**

  5.  **Praiseworthiness Without Obligation:** Explain the source and nature of the praiseworthiness of supererogatory acts. While the *fact* of praiseworthiness is non-negotiable, *how* it is explained may vary:
      *   *Consequentialism:* Praiseworthiness stems from maximizing good.
      *   *Deontology:* Praiseworthiness stems from acting on specially meritorious maxims or exercising virtues beyond requirement.
      *   *Virtue Ethics:* Praiseworthiness stems from exemplary virtuous character or action. *(The *fact* is non-negotiable; the *explanation* is framework-dependent)*

  6.  **The Role and Weight of Cost/Sacrifice:** Most theories invoke agent cost/sacrifice (time, effort, resources, risk, life) to explain why an act isn't obligatory even if good. However:
      *   *Non-negotiable Aspect:* Significant cost/sacrifice is a *typical* feature of core cases (grenade, kidney).
      *   *Framework-Dependent Aspect:* The *necessity* and *sufficiency* of cost/sacrifice for defining supererogation is debated. Can there be low-cost/high-benefit supererogation? (e.g., a rich person painlessly donating vast wealth). Some theories make cost definitional; others see it as a common reason why beneficial acts aren't obligatory.

  7.  **Scope of Supererogation:**
      *   *Moral Saints/Heroes:* Must the theory accommodate extreme acts of self-sacrifice or near-total devotion to others (e.g., Mother Teresa, maximally effective altruism)? *(Often seen as a test case, but strict *requirement* might be framework-dependent - e.g., some consequentialists might see maximal beneficence as obligatory)*
      *   *Forgiveness:* Explain the status of forgiving an unrepentant wrongdoer. Is it supererogatory? Why? (This tests theories on demandingness, self-regard, justice, and the boundaries of duty). *(Important test case, but classification as supererogatory *per se* might be contested depending on the theory of forgiveness/duty)*
      *   *Self-Regarding Supererogation:* Can acts primarily benefiting oneself (e.g., extreme asceticism, intense artistic creation demanding immense personal sacrifice) be supererogatory? *(Highly framework-dependent - e.g., Virtue Ethics may be more open to this than standard Deontology/Consequentialism)*

  8.  **Relationship to Stringency of Duty:** A theory should ideally explain how the threshold for what counts as supererogatory might shift depending on the stringency of existing duties in a context. Easier/broader duties might leave less room for supererogation; stringent/narrow duties might leave more. *(Important for realism, often implicit, but strict formalization may vary)*

  **III. Key Tensions Between Desiderata:**

  1.  **The Sacrifice vs. Moral Betterment Tension:**
      *   *Tension:* Emphasizing the *moral superiority* of the supererogatory act pushes towards making it seem obligatory ("If it's so much better, why *shouldn't* I be required to do it?"). Emphasizing the *significant cost/sacrifice* as the reason it's not obligatory risks making supererogation seem like acts that are *too demanding to be required*, potentially undermining the claim that they are genuinely *morally better* than permissible alternatives. If the cost is the *only* reason it's not obligatory, isn't the act *itself* still what morality ideally demands?
      *   *Resolution Attempts:* Theories need strategies to navigate this. Common moves: Distinguish "optimific" from "obligatory" (Consequentialism with agent-centered permissions); Ground non-obligatoriness in the value of personal projects/autonomy (Agent-Centered Permissions); Frame supererogation as exceeding the demands of justice/virtue rather than optimal beneficence.

  2.  **Praiseworthiness vs. Non-Obligation vs. Imperfect Duty:**
      *   *Tension:* Imperfect duties require *some* action and blame can attach for *complete* neglect. How is supererogation *beyond* this? If giving $10 is required by imperfect duty, why is giving $1000 supererogatory rather than just *more* fulfillment of the same duty? If praiseworthiness attaches to giving $1000, why doesn't blame attach (even mildly) for giving *only* $10?
      *   *Resolution Attempts:* Theories need a clear account of the "sufficient minimum" for fulfilling an imperfect duty vs. what counts as going beyond it into supererogation. This often involves judgments about proportionality, reasonable sacrifice, or defining a specific threshold.

  3.  **The Latitude vs. Optimality Tension (Especially for Consequentialism):**
      *   *Tension:* Pure act-consequentialism struggles with supererogation because the optimally good act seems obligatory. Preserving latitude for supererogation requires introducing elements that *deviate* from pure optimization (e.g., agent-centered prerogatives, scalar morality). But this then raises questions about why the *less* optimal act is permissible and why the *more* optimal act isn't required.
      *   *Resolution Attempts:* Satisficing Consequentialism, Agent-Centered Prerogatives, Scalar Consequentialism (distinguishing moral goodness from obligation).

  **Summary of Non-Negotiables:** Any adequate theory MUST:
  1.  Explain the core cases (Heroic Sacrifice, Significant Beneficence).
  2.  Capture the "beyond duty" character (optional, praiseworthy, better than permissible min).
  3.  Resolve the "Why-Not-Obligatory?" paradox.
  4.  Clearly distinguish supererogation from merely permissible acts.
  5.  Clearly distinguish supererogation from imperfect duties.
  6.  Maintain that omitting supererogation is not blameworthy.

  **Framework-Dependent Elements:** The *explanation* of praiseworthiness, the *necessity/sufficiency* of cost, the *scope* (saints, forgiveness, self-regarding), and the *specific resolution* of the central paradox and tensions will depend significantly on the underlying moral framework (Consequentialist, Deontological, Virtue-Ethical).

  **Key Tensions to Watch For:** Sacrifice vs. Moral Betterment; Praiseworthiness vs. Non-Obligation vs. Imperfect Duty; Latitude vs. Optimality (Consequentialism).

  This list provides the rigorous specification needed to evaluate competing theories. Apply it by asking: Does theory T adequately satisfy the non-negotiables? How does it resolve the central paradox and navigate the key tensions? How does its framework shape its handling of the framework-dependent desiderata? Where does it struggle with specific cases or distinctions? Good luck with your paper!
