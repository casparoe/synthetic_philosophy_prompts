prompt: |-
  I'm a retired geophysicist who's gotten into philosophy the last few years, and I've been chewing on underdetermination of theory by evidence. I want you to make the strongest argument you can that underdetermination *is* a genuine epistemic problem for science — not just a logical curiosity. And I mean the strong version: that for any body of evidence, there are always empirically equivalent rivals, and there's no principled, non-arbitrary way to pick between them. I know the standard responses (simplicity, explanatory power, etc. aren't just aesthetic), so don't just rehearse those and call it a day. I want a committed argument — pick your side and defend it like you mean it. I spent decades watching smart people disagree about what the same seismic data was telling them, so I've got a nose for when someone's actually grappling with the problem versus just doing philosophy-by-numbers.
