  First, I need to recall the core of underdetermination. The idea is that multiple theories can explain the same data. The user mentioned simplicity and explanatory power as common counterarguments but wants more depth. They want a committed defense, so I should argue that these pragmatic virtues don't solve the epistemic gap.

