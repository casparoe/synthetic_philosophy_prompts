  Another angle is the underdetermination of auxiliary hypotheses. Quine's web of belief means that when evidence conflicts, we can adjust different parts. But that flexibility implies we can always construct alternatives. The problem is worse with theories making identical predictions. Newton vs. Newton* with absolute space is a classic example. Can we really say one is simpler if they're structurally similar?

  Then there's the problem of unconceived alternatives. History shows theories we didn't even think of, like quantum mechanics before the 20th century. So, current theories might be underdetermined by evidence because better alternatives exist undiscovered. This makes the epistemic problem real—we might always be missing better explanations.

  The user would appreciate the geophysics angle. Mentioning how seismic data can support different crustal models shows that underdetermination isn't abstract. Experts use priors and heuristics, but those can be subjective. If the criteria for choosing theories are pragmatic, not truth-tracking, then truth becomes elusive.

  I should tackle the standard responses head-on. Simplicity is often cultural or historical. What's simple in one era changes. Explanatory power might be circular. Bayesian approaches depend on priors, which are subjective. So, these tools don't provide objective truth, just utility.

  Conclude that science is instrumental. We pick theories that work, but we can't claim they're true. The user might find this frustrating but honest. Emphasize that this doesn't undermine science's usefulness but challenges its truth-claiming ability.

