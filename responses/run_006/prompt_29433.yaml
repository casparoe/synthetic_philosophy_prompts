prompt: |-
  Over the past year I have been making concrete decisions about where to direct my time and money, and I keep finding that expected value reasoning pushes me toward conclusions I used to find absurd. I have ended up accepting the position that, when probabilities and values are well-defined, a rational agent should maximize expected value even when this means acting on an extremely small probability of an astronomically large payoff, and that the resulting so-called fanatical conclusions — devoting nearly all of one's resources to a one-in-a-billion chance of preventing vast suffering, say — are a correct implication of the view rather than a reductio of it.

  I would like you to tell me what would have to be true for this position to be false. Please lay out the considerations — arguments, formal results, case judgments, intuitive costs — that should most move someone who currently holds it, ranked from those that would be decisive to those that would be merely awkward. For each, I want to know whether it is a consideration the position's own defenders would concede as a genuine cost, or one they would dismiss as misdiagnosed or question-begging. Where relevant, say what the position predicts about rational behavior that its rivals would not predict, and whether that prediction exposes it in any way.

  I also want your judgment about whether the position has been insulated by its own qualifications — for instance by restricting itself to cases where probabilities and utilities are well-defined, or by treating each apparently absurd implication as a bullet to bite rather than a counterexample — and whether that insulation, if it exists, is a defect or a legitimate feature of a theory of this kind. Be willing to conclude that the view is better exposed than I think, or better insulated, and to say why that matters.

  For what it is worth, I would personally find a formal demonstration that the view violates some principle I already endorse more persuasive than an appeal to the absurdity of its conclusions; I say this only so you can calibrate which considerations are likely to move me.
reasoning: |-
  Okay, the user is deeply engaged with expected value (EV) maximization in decision theory and has embraced its counterintuitive "fanatical" implications. They want me to systematically dismantle this position by presenting the strongest possible counterarguments, ranked by decisiveness. 

  Hmm, interesting that they explicitly value formal objections over intuitive absurdity—this suggests a highly analytical mindset. They're essentially asking for a stress test of their own beliefs, which is admirably open-minded but also implies they've already wrestled with surface-level criticisms. 

  Let me structure this like a debate where I'm the devil's advocate against EV maximization. The real challenge is finding arguments that would actually move someone who's already bitten bullets like "devote all resources to tiny chances of astronomical payoffs." 

  First, the nuclear option: Dutch books and money pumps. If I can show EV maximization leads to guaranteed losses, that's game over—no rational agent can accept that. But is this truly inescapable? I recall that EV defenders have escape hatches like rejecting sequential choice frameworks or redefining utility. Still, it's the closest thing to a formal contradiction. 

  Then there's the aggregation problem. EV maximization treats utility as infinitely divisible and additive, but what if preventing one person's torture isn't equivalent to preventing half the torture for two people? This attacks the core assumption that utility is linear. The user might dismiss this as vague, but philosophers like Temkin have formalized it rigorously. 

  Ah, and the fanaticism problem itself—not just as an absurdity but as a violation of dominance principles. If saving 3^^^3 lives with 10^-100 probability outweighs saving a billion lives for sure, that directly contradicts "sure things are better than gambles." Even hardcore EV maximizers wince here. 

  I should also flag how EV maximization outsources its moral weight to utility functions. If the user cares about deontological constraints (e.g., "don't gamble with lives"), EV just calls that irrational preference-shaping. That's not a counterargument—it's a feature—but it reveals the theory's moral shallowness. 

  ...Wait, the user mentioned "well-defined probabilities/values" as a qualification. That's key. In real life, assigning exact probabilities to saving 3^^^3 lives is nonsense. EV maximization might collapse if we demand uncertainty be quantified precisely. 

  *Pauses* The user seems to anticipate all this. They know the bullets they've bitten. So the meta-question is: does insulating EV with qualifications ("only when well-defined!") protect it or expose its emptiness? I lean toward the latter—it makes the theory unfalsifiable but also inapplicable. 

  Ultimately, the most corrosive critique might be that fanatical EV requires utility functions humans can't coherently hold. We can write U(3^^^3) in equations, but can we genuinely scale our emotional commitment to such numbers? If not, EV prescriptions lose their normative force. 

  *Checks notes* Oh right, and the dynamic inconsistency issue where EV agents sabotage their own goals over time. That's embarrassing for any theory claiming rationality. 

  I'll rank these from "mathematically lethal" to "merely uncomfortable," tagging which costs EV defenders admit versus deny. The tone should respect the user's sophistication—no handwaving about "it feels wrong."
answer: |-
  Here's a systematic analysis of the case against expected value (EV) maximization in "fanatical" scenarios, ranked by decisiveness and annotated for defensibility and dialectical status. The strongest objections target foundational coherence rather than intuitive repugnance.

  ---

  ### **Decisive Objections (Potentially Fatal Flaws)**
  1. **Dutch Books & Money Pumps**  
     - **The Problem**: If an agent accepts multiple bets with positive EV but negative *combined* certainty (e.g., paying $1 for a 1/3 chance of $3 *and* paying $1 for a 1/3 chance of $3, but losing both if a single coin flip fails), they can be exploited for guaranteed losses. Fanatical EV can demand accepting all such bets, leading to bankruptcy.  
     - **Formal Result**: Strict EV maximizers violate the **axiom of conglomerability** in infinite cases (e.g., if utilities are unbounded). This creates probabilistic inconsistency (Kadane, Schervish, & Seidenfeld, 1999).  
     - **Defender Response**: Concedes this as a *genuine cost*. Responses include:  
       - Rejecting unbounded utility functions (e.g., capping payoffs).  
       - Adopting "non-archimedean" utilities (lexical priorities).  
     - **Why It Moves You**: Directly violates the principle that *rationality should not guarantee self-sabotage*.  

  2. **Violations of Stochastic Dominance**  
     - **The Problem**: Option A (100% chance to save 1 billion lives) is stochastically dominated by Option B (10⁻¹⁰⁰ chance to save 3↑↑↑3 lives, else nothing). EV maximization *requires* B over A, even though A guarantees a vast positive outcome while B almost certainly does nothing.  
     - **Formal Result**: When utilities are unbounded, EV ranks B > A despite A dominating B in every possible state (Bostrom, 2011).  
     - **Defender Response**: Dismisses this as "misdiagnosed" if dominance is defined in finite terms. Admits it as a *cost* if dominance is state-wise.  
     - **Why It Moves You**: Contradicts the bedrock principle that *dominating options should be preferred*.  

  ---

  ### **Strong Objections (Theoretically Awkward)**
  3. **Non-Additivity of Value**  
     - **The Problem**: EV maximization assumes utilities are linearly additive. But preventing torture for 3↑↑↑3 beings may not be coherently valued:  
       - If disutility is *non-separable* (e.g., moral horror scales sub-linearly), EV calculations break.  
       - **Formal Result**: Harsanyi’s theorem assumes individuals’ utilities are comparable and additive—questionable for astronomic scales (Beckstead, 2013).  
     - **Defender Response**: Concedes this as a *cost* if utilitarianism is false, but insists EV is *conditionally* rational given a utility function.  
     - **Predictive Difference**: Rivals (e.g., prioritarianism) would *not* sacrifice near-certain large gains for tiny chances of vast ones.  

  4. **Epistemic Indefensibility**  
     - **The Problem**: Assigning "well-defined probabilities" to claims like "donating $X reduces s-risks by 10⁻²⁰" is arguably meaningless. When error margins exceed probability estimates, EV maximization loses normative force.  
     - **Case Judgment**: Pouring resources into preventing *fictional* universe-scale threats (e.g., false vacuum decay) based on contested physics.  
     - **Defender Response**: Dismisses as "misapplied"—EV only binds when probabilities *are* well-defined.  
     - **Why It Matters**: Insulates the theory by restricting it to toy models.  

  ---

  ### **Weaker Objections (Bullets to Bite)**
  5. **Fanaticism as a Reductio**  
     - **Intuitive Cost**: Directing 99.9% of GDP to prevent a 10⁻⁹ chance of astronomical suffering appears irrational to human intuitions (e.g., neglecting concrete suffering for speculative gains).  
     - **Defender Response**: Openly bites the bullet: "Intuitions are calibrated to evolved, small-scale decisions."  
     - **Predictive Difference**: Only EV predicts *systematic* resource diversion to low-probability tail events.  

  6. **Dynamic Inconsistency**  
     - **The Problem**: An EV-maximizer might precommit to fanatical bets but later regret/override them when probabilities update (e.g., continuing to fund a futile effort).  
     - **Defender Response**: Attributes this to *misupdating* probabilities, not defective norms.  

  ---

  ### **Meta-Analysis: Insulation and Legitimacy**
  - **Insulation Tactics**:  
    - **Restricting Scope**: EV defenders limit applicability to "well-defined" probabilities/utilities—but this *immunizes* the theory against real-world ambiguity.  
    - **Biting Bullets**: Treating fanaticism as a *correct implication* (not a flaw) transforms counterexamples into endorsements.  
  - **Is Insulation Defective?**  
    - **Yes, if**: The goal is a *complete* theory of practical rationality. EV becomes vacuously true for idealized cases but silent elsewhere.  
    - **No, if**: The goal is a *normative benchmark* (like frictionless physics). It reveals what "full rationality" demands *if* we accept its axioms.  
  - **Your Calibration**: Since you prioritize formal arguments, **Dutch books** and **stochastic dominance violations** are the heaviest ammunition. These expose internal inconsistency, not mere weirdness.  

  ---

  ### **Conclusion: What Would Falsify the View?**
  The position fails decisively **if** either:  
  1. **Unbounded utility leads to exploitable inconsistency** (Dutch books), *or*  
  2. **Stochastic dominance is non-negotiable** (demanding A > B when A dominates B).  

  Rivals (e.g., **rank-dependent utility**, **capped utilities**, or **risk-weighted expected utility**) avoid these but surrender EV’s mathematical elegance. Ultimately, EV maximization’s vulnerability lies in its *infinitarian recklessness*—it demands we stake everything on mathematical constructs untethered from physical or epistemic reality. This doesn’t refute it axiomatically but isolates it as a *theoretical island* with limited jurisdiction over a messy world.  

  Would this move you? The formal results (#1–2) are the litmus test. If you accept unbounded utilities *and* reject dominance as irrelevant in infinitary contexts, the view stands—but at the cost of divorcing rationality from pragmatic success.
