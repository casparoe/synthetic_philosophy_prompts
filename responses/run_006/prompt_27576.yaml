prompt: |-
  I'm a PhD student in philosophy of science and I keep running into the reference class problem in my reading, but I've never actually worked through it carefully. A collegue of mine who does mostly philosophy of biology gave me her one-paragraph summary, and something about it strikes me as unfair but I can't articulate exactly where. Here's what she said:

  "The reference class problem is the problem that any particular event belongs to infinitely many classes, and the frequency of the outcome you're interested in can be very different depending on which class you look at. So a frequentist can't assign a probability to a single event at all: any value can be made to come out just by choosing the reference class cleverly. And since there is no principled, non-arbitrary way to pick one class over another, frequentism is simply refuted as an account of probability."

  I'm inclined to think the 'any value can be made to come out' bit is too strong, but maybe that's definately what the formal results show.

  Could you act as an expert in formal epistemology and the philosophy of probability, and give me an accuracy audit of this summary? Think carefully and maybe start with a quick brainstorm of what the problem actually is before going sentence by sentence. I'd like to know which parts a careful frequentist would accept, which parts are overstatements or subtle conflations, what a defender of frequentism would say in response (I vaguely recall Reichenbach had a narrowest-reference-class rule, but I don't know whether that fixes it), and whether the conclusion that frequentism is refuted follows from the accurate core. Also flag anything that would mislead me if I took it to the literature. Please write the answer in British English.
