  Hmm, the "any value can be made to come out" claim needs scrutiny. While clever class selection can manipulate probabilities, there are practical constraints (causal relevance, data availability) that limit arbitrariness. Reichenbach's narrowest-class rule helps but doesn't fully solve it - what defines "narrowest" remains tricky.

