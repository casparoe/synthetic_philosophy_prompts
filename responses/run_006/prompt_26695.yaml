answer: |-
  You've pinpointed the core philosophical tensions driving contemporary renaming/decommemoration practices. Let's reconstruct the implicit theory of moral progress embedded within them, distinguishing core commitments from compatible additions, contested areas, and alternative philosophical engines.

  **Core Presuppositions (What the Practice Strictly Requires):**

  1.  **Moral Realism (Minimal Version):** There exist objective moral facts or truths *that transcend specific historical contexts*. The practice rejects radical moral relativism. It assumes that slavery, genocide, or systemic oppression weren't *just* "wrong for us now," but were *genuinely wrong* when they occurred, even if widely accepted. Otherwise, removing a statue is mere presentism or cultural preference, not a correction of past error.
  2.  **Directional Moral Change (Improvement):** Moral understanding isn't random; it improves over time in some significant way. We are morally "better" or possess more accurate moral knowledge than past societies on specific issues (e.g., equality of persons, intrinsic value of groups previously excluded). This is "progress," not mere difference.
  3.  **Present Moral Authority:** Our current moral judgments are sufficiently reliable *on the specific issues in question* to justify retrospective reevaluation and symbolic correction. We *can* legitimately judge the past by our (improved) standards.
  4.  **Culpability Despite Context:** Historical figures bear *some* degree of moral responsibility for their actions/beliefs, even if those actions/beliefs were normalized in their time. The practice implies they *could have* or *should have* known better, at least to some extent. Absolute historical determinism would undermine the rationale for removal (it would just be "how things were").
  5.  **Symbolic Significance of Commemoration:** Honoring someone (statue, building name) is a meaningful act of public endorsement. Continuing to honor figures implicated in profound moral wrongs tacitly endorses those wrongs or causes harm to groups affected by them or their legacy.

  **What the Practice Fits Well With (But Doesn't Strictly Require):**

  1.  **The Expanding Circle (Singer-esque Narrative):** This is the most common implicit narrative: moral concern progressively widens to include previously excluded groups (different races, genders, sexual orientations, nationalities, even animals). Renaming often targets figures whose actions suppressed the inclusion of groups now recognized within the circle.
  2.  **Moral Discovery/Uncovering:** Progress involves *discovering* pre-existing moral truths (e.g., inherent human equality) that were obscured by prejudice, ignorance, or flawed social structures. Renaming corrects a past error of perception. This fits the language of "facing history" or "acknowledging truth."
  3.  **Epistemic Gradualism:** While individuals *could* have known better, systemic barriers (dominant ideologies, lack of critical concepts, limited information flows, power structures) made it extraordinarily difficult. Progress occurs as these barriers are slowly dismantled (e.g., through social movements, scientific advancement, philosophical argument). This resolves some tension between progress and culpability: figures are culpable *in principle* for failing to transcend flawed norms, but the *degree* of blame is mitigated by context. They *could* have known, but it was very hard; we judge them partly *because* the path was eventually found.
  4.  **Connection to Present Harms:** Honoring such figures perpetuates ongoing harm (e.g., alienation of marginalized groups, reinforcement of oppressive narratives, hindering reconciliation). Removal is thus both corrective and reparative for present communities.

  **Where It's Underdetermined (Different Engines Possible):**

  1.  **The Nature of Moral Facts:**
      *   **Strong Realist Engine:** Moral truths are mind-independent facts (like mathematical truths) that we gradually discover (Platonic, some Natural Law).
      *   **Constructivist-Compatible Engine:** Moral truths are constructed through rational discourse, social negotiation, or evolving understanding of human needs and potential within a shared framework (e.g., Kantian constructivism, Scanlon). Progress is refining these constructions. The "discovery" feels real but is of deeper implications within our own evolving commitments.
      *   **Naturalistic/Evolutionary Engine:** Moral progress stems from expanding capacities for empathy, cooperation, and fairness driven by biological and cultural evolution (e.g., influenced by Pinker, de Waal). The "circle" expands as we overcome tribal instincts.
  2.  **The Mechanism of Progress:**
      *   **Rationalist Engine:** Progress driven primarily by reasoned argument, philosophy, and the power of better ideas.
      *   **Social Struggle Engine:** Progress driven by the political struggles, activism, and sacrifices of oppressed groups challenging power structures (e.g., Marxist, Feminist perspectives). Renaming is an outcome of successful struggle.
      *   **Technological/Communicative Engine:** Progress enabled by technologies (printing press, internet) that spread information and foster empathy across distances.
  3.  **The Scope of Culpability:** The practice requires *some* culpability but underdetermines *how much* and *for what exactly*.
      *   **Focus on Actions:** Culpability primarily for specific, harmful *actions* (owning slaves, enforcing colonial policies) that violated *available* moral principles (e.g., basic notions of cruelty, hypocrisy against stated ideals).
      *   **Focus on Failure of Moral Imagination:** Culpability for failing to extend existing principles (e.g., liberty, compassion) to excluded groups, despite clues or arguments available *at the time* (e.g., abolitionist writings, critiques of colonialism).
      *   **Mitigation Spectrum:** The practice allows for varying degrees of contextual mitigation without absolving entirely.

  **The Contested Landscape of Moral Progress:**

  *   **Is Progress Real?** While the *feeling* of progress is widespread, **this is contested**. Moral skeptics (some relativists, error theorists) deny objective progress. Others (e.g., some traditionalists) argue we've regressed in key areas (community, meaning). **Settled? No. Dominant intuition? Yes (supporting the practice), but not philosophically settled.**
  *   **Is the Expanding Circle the Best Model?** **Highly contested.**
      *   **Alternatives:** Progress as deepening application of core principles (e.g., liberty/equality becoming more consistent/universal); progress as increasing societal "flourishing" or reducing suffering (utilitarian); progress as the institutionalization of rights (liberal political theory); progress as shifts in dominant "moral matrices" (Haidt); progress driven by changing material conditions or modes of production (Marxist); progress as increasing complexity of moral reasoning (Kohlbergian, contested).
      *   **Critiques of Expanding Circle:** Accused of being Western-centric, linear, ignoring value losses (e.g., community cohesion), overlooking non-inclusion-based progress (e.g., decreases in violence), and potentially imperialistic.
  *   **Is Progress Continuous/Inevitable?** **Contested.** The practice *assumes* non-regress on the specific issues targeted (we won't reinstate slavery), but philosophers and historians debate whether progress is linear, cyclical, contingent, or even reversible. Events like genocides challenge inevitability.
  *   **Epistemology of Moral Knowledge:** **Profoundly contested.** How we access moral "truths" (intuition, reason, emotion, revelation, social consensus) and why they might have been inaccessible in the past is a core problem in meta-ethics. The practice presupposes *some* reliable access now, but the mechanism is underdetermined.

  **Swapping the Engine: Constructivism (Moral Shifts with Power/Circumstance)**

  If we adopt a *purely* constructivist view where moral norms *only* reflect contingent power dynamics and social circumstances, with no inherent direction or truth-discovery:

  1.  **The Practice Changes Fundamentally:** Renaming loses its character as "correcting a past moral error." It becomes purely an exercise of *current* power and preference.
  2.  **Justification Shifts:** The rationale becomes:
      *   **Present Power Dynamics:** "Our group/s values are dominant now, so we remove symbols of the old dominant group/s values we dislike/reject."
      *   **Political Strategy:** Removing symbols is a tactic to solidify current ideologies, mobilize supporters, or erase rival narratives.
      *   **Aesthetic/Social Preference:** "We find these figures distasteful *now* and prefer different heroes." No claim of objective wrongness.
      *   **Addressing Present Harm (Redefined):** Not because the past figure was objectively wrong, but because the symbol *currently* causes friction or pain within the *current* social arrangement. The harm is contemporary social discord, not a legacy of objective past wrongs.
  3.  **Loss of Moral Condemnation:** The language of "justice," "accountability," or "facing truth" becomes hollow or metaphorical. It's about present social engineering, not retrospective moral judgment.
  4.  **Vulnerability:** The practice becomes vulnerable to the charge of being merely the "tyranny of the present." If morals are just power, then a future shift in power could just as legitimately restore the statues or rename buildings again based on new preferences. There's no "progress," just change.
  5.  **Survival?** A stripped-down version *could* survive, but it would be a fundamentally different practice. It might focus solely on the *current* psychological or social impact of the symbols ("This statue causes pain *now*, so we remove it for social harmony"), divorcing it entirely from claims about the historical figure's objective moral status or any narrative of moral improvement. It becomes pragmatic conflict resolution or cultural rebranding, not an act anchored in a belief in moral truth and progress.

  **In Summary:**

  The renaming/removal practice presupposes a **minimally realist, directional, and present-authoritative view of moral progress**, coupled with **some notion of retrospective culpability** and the **symbolic weight of commemoration**. It fits most comfortably with an **expanding circle/discovery narrative** and **epistemic gradualism** to resolve the culpability-progress tension. However, it can run on different meta-ethical engines (strong realism vs. constructivism-lite) and under different progress mechanisms (rationalism vs. social struggle).

  Crucially, while the *intuition* of moral progress (especially widening inclusion) underpins the practice, **the philosophical nature, mechanism, and even reality of moral progress remain deeply contested.** Swapping the core engine for a purely contingent constructivist view fundamentally alters the practice's meaning and justification, transforming it from moral correction to an assertion of present power or preference.
