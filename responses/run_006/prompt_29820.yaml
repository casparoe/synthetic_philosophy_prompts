  The user raises a crucial theoretical tension: is potlatch a handicap or an index? Zahavi's handicap principle hinges on cost guaranteeing honesty, but if potlatch is an index (unfakeable due to social structure), then cost might be secondary. This distinction matters for the theory's validity. I should analyze how clan networks, reputation, and copper shield verification created structural barriers to faking—suggesting index-like properties even with massive costs.

