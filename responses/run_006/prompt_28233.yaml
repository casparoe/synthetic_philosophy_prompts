answer: |-
  Below is your Q&A prep sheet, structured around the most damaging objections first. I've drawn from standard debates in decision theory, the Pasadena game literature (e.g., Hájek 2003, Easwaran 2008), and the specific audience profiles you described. I've ordered objections by "damage potential": how badly they could undermine your core thesis if you fumble the reply. High-damage objections challenge the coherence or necessity of your restricted EU framework, while lower-damage ones are easier to deflect with concessions. I've phrased objections as your audience might, based on their known positions.

  **My confidence:** I'm 85% confident in this list. The objections and replies align with well-trodden arguments in the literature, and your stance (restrict EU + fallback principles) is a recognized position (e.g., akin to Al-Najjar's or Seidenfeld's work). However, I'm least sure about the **ordering of damage potential**—your economist might be more aggressive than I anticipate, or the summation-convention advocates might have a clever twist I haven't captured. Focus on nailing the top 3 to avoid catastrophic blowback.

  ---

  ### **Objection 1 (Highest Damage): Why not use a summation convention? It restores completeness without violating EU's spirit.**  
  *Likely asker:* One of the two formal epistemologists committed to complete preferences.  
  *Phrasing:* "Your 'restriction' feels like surrender. We have consistent summation methods (e.g., Cesàro, Abel) that assign a definite value to the Pasadena game. These conventions extend EU gracefully to conditionally convergent cases, preserving completeness—which we all agree is central to rationality. Why reject this to cling to an artificially narrowed EU?"  

  **Two-minute reply:**  
  "Summation conventions are arbitrary—different orders yield different values, and no convention is privileged by the axioms of EU itself. For instance, the Pasadena game sums to \( \ln(2) \) under one ordering but can be rearranged to converge to 10 or even diverge. Imposing a convention smuggles in extraneous structure, violating the statewise neutrality EU presupposes. My restriction isn't surrender; it's honesty. EU was built for absolutely convergent cases, where value is order-invariant. Outside that, forcing completeness via convention invites paradoxes like the St. Petersburg variations. Better to admit incompleteness where the math doesn't sanction a unique answer."  

  **Where it's soft:** You haven't disproven that *some* conventions (e.g., invariant ones) could work. Your reply leans on arbitrariness, but conventions like Cesàro are standard in analysis.  
  **Concede instead of fighting:** "You're right that conventions can be useful pragmatically—e.g., for applied work. But for foundational rationality, they're ad hoc. I'll take a principled incompleteness over arbitrary completeness."  

  ---

  ### **Objection 2 (High Damage): Statewise dominance is too weak—it leaves us with incomplete preferences for most interesting gambles. How is that rational?**  
  *Likely asker:* The other formal epistemologist (completeness advocate) or a decision theorist sympathetic to them.  
  *Phrasing:* "If we follow you, we can't compare the Pasadena game to a finite sure thing (say, $0), let alone to other infinite gambles. But rationality demands we decide! Statewise dominance alone is impotent here. Isn't your fallback just a fancy way to say 'I don't know'—and how is that better than a summation convention?"  

  **Two-minute reply:**  
  "Incompleteness isn't irrational—it's an honest reflection of indeterminacy when EU doesn't apply. We *can* compare gambles under statewise dominance: e.g., the Pasadena game dominates a gamble that pays \(-n\) in all states. For non-comparable cases, we add structural principles: e.g., 'no paying to swap state labels' (label neutrality) or probabilistic equivalence. These let us handle Pasadena-like cases without assigning spurious values. For instance, we can say you shouldn't pay to switch between the Pasadena game and its 'Altadena' variant (where signs flip), as they're statewise identical under relabeling. Completeness fetishism forces false precision. Rationality requires coherence, not universality."  

  **Where it's soft:** You haven't specified how "structural principles" resolve concrete choices (e.g., Pasadena vs. $0). This could feel evasive.  
  **Concede instead of fighting:** "You're right that this framework won't rank all gambles. But it prevents demonstrable errors, like paying for harmful rearrangements. Sometimes, 'I don't know' *is* the rational answer."  

  ---

  ### **Objection 3 (High Damage): Your view collapses under reflection: if EU isn't defined for conditionally convergent cases, why should we trust it elsewhere?**  
  *Likely asker:* The philosopher of probability (anti-infinite-state-space).  
  *Phrasing:* "You say EU 'was never meant' for these cases, but that's ahistorical—decision theorists *did* apply it here! This shows infinite state spaces are inherently pathological. If we can't apply EU uniformly, we should jettison infinity altogether. Your 'restriction' is just a band-aid on a deeper wound."  

  **Two-minute reply:**  
  "Infinite state spaces aren't the villain—misapplication is. EU works perfectly for finite gambles and absolutely convergent infinite ones (e.g., bounded utilities). The Pasadena game exploits conditional convergence, which violates EU's core requirement of order-invariance. This isn't a pathology of infinity per se; it's a mismatch between tool and task. We use infinite spaces because they model uncertainty efficiently (e.g., timestreams or fine-grained partitions). Abandoning them throws out useful idealizations. My restriction isn't ad hoc; it follows from EU's math. For non-absolutely convergent cases, we shift to dominance and structure—just as physics shifts from Newtonian to quantum rules at scales."  

  **Where it's soft:** If pressed, you might struggle to justify why infinite spaces are "useful" when they cause such headaches.  
  **Concede instead of fighting:** "I agree infinity complicates things. But for problems like the St. Petersburg paradox or sequential choice, it's often the best model. We should proceed with caution, not abandonment."  

  ---

  ### **Objection 4 (Medium Damage): Your structural principles are underspecified and unworkable—how do they handle real decisions?**  
  *Likely asker:* A decision theorist uncommitted to summation conventions but skeptical of your fallback.  
  *Phrasing:* "You mention 'statewise dominance plus a couple of other principles,' but that's hopelessly vague. What are these principles? How do they adjudicate between the Pasadena game and, say, the St. Petersburg game? Without precise axioms, this feels like hand-waving."  

  **Two-minute reply:**  
  "The principles are minimal: (1) Statewise dominance (if gamble A pays ≥ B in all states, prefer A); (2) Label neutrality (indifference to relabeling states, so no paying for mere description changes); and (3) Probabilistic equivalence (same distribution implies indifference). For Pasadena vs. St. Petersburg: St. Petersburg has absolutely convergent expectation, so EU applies. Pasadena doesn't, so we avoid comparing them directly. But we *can* use dominance: e.g., if a gamble pays less than St. Petersburg in all states, we prefer St. Petersburg. This isn't hand-waving—it's recognizing that decision theory needs multiple tools. I'm developing a fuller axiomatization, but the core keeps us safe from paradox."  

  **Where it's soft:** You haven't provided a decision rule for gambles where EU is silent and dominance doesn't apply (e.g., Pasadena vs. a fixed $5).  
  **Concede instead of fighting:** "Agreed, this is a work in progress. But even incomplete guidance beats actively harmful assignments."  

  ---

  ### **Objection 5 (Medium Damage): But we handle conditionally convergent integrals in physics—why not here?**  
  *Likely asker:* The economist or a mathematically inclined epistemologist.  
  *Phrasing:* "Physicists use Cauchy principal values for conditionally convergent integrals all the time (e.g., in quantum mechanics). If it's good enough for them, why can't we adopt a similar 'decision-theoretic principal value'? This preserves EU's universality without your clunky restrictions."  

  **Two-minute reply:**  
  "Physics uses these tools pragmatically for specific models, but decision theory aims for normative foundations. Principal values are context-dependent—e.g., they work for symmetric integrals but fail for asymmetric gambles like Pasadena. More crucially, physics doesn't face *preference reversals*: no one pays to rearrange a particle's wavefunction! In decision theory, the stakes are coherence under agency. If we normalize conventions, agents exploit them (e.g., paying to relabel states to change 'value'). My approach avoids this by respecting the math: where expectation isn't invariant, we don't pretend it is."  

  **Where it's soft:** Principal values *can* be generalized (e.g., via regularization), and physics *does* care about invariance.  
  **Concede instead of fighting:** "You're right that some conventions are stable in practice. But for foundational rationality, we need more rigor than pragmatism."  

  ---

  ### **Objection 6 (Low Damage): This is all irrelevant—no real decisions involve infinite payoffs.**  
  *Likely asker:* The economist.  
  *Phrasing:* "In the real world, utilities are bounded and states are finite. The Pasadena game is a clever thought experiment, but it doesn't threaten EU because EU only applies to realistic cases. Why overcomplicate things?"  

  **Two-minute reply:**  
  "Thought experiments like Pasadena are stress tests for theory. Even if utilities are bounded, infinite partitions arise naturally—e.g., in continuous time or unboundedly fine descriptions. But more importantly, EU's mathematical limits reveal conceptual truths: e.g., that value shouldn't depend on arbitrary descriptions. Your boundedness solution works, but it's a patch. My restriction provides a principled boundary: EU applies where it's mathematically sound, and we handle edge cases with minimal extras. This keeps theory honest without overcomplicating practice."  

  **Where it's soft:** Bounded utilities *do* resolve many paradoxes, and economists often prefer this simplicity.  
  **Concede instead of fighting:** "I agree that in 99% of real choices, EU is flawless. Pasadena is a toy—but toys teach us how our tools work."  

  ---

  ### **The Question You're Secretly Hoping Nobody Asks: How do you explain the apparent continuity between finite and infinite cases?**  
  *Likely asker:* A sharp philosopher of probability or a mathematician.  
  *Phrasing:* "Your argument hinges on a discontinuity: EU works for finite gambles and absolutely convergent infinite ones, but fails for conditionally convergent. But consider a sequence of truncated Pasadena games converging to the full version. Their EU values diverge—e.g., alternating in sign—so there's no limit. Why should rationality care about this technical cutoff? It feels like you're privileging the math over the phenomena."  

  **Why you fear it:** This exposes the "restriction" as potentially arbitrary—why draw the line at absolute convergence? It could make your view seem mathematical rather than decision-theoretic.  

  **Two-minute reply (if asked):**  
  "The discontinuity is a feature, not a bug! It reflects a deep fact: conditional convergence violates continuity axioms under relabeling. In the truncated sequence, expectations oscillate wildly—so no stable 'limit' exists. Rationality should respect this instability: if small perturbations (like adding one state) flip the sign of 'value,' that's a sign we're outside EU's domain. We don't privilege math; we recognize that decision rules must be robust under natural operations. My restriction is the only way to ensure that."  

  **Where it's soft:** You might be accused of circularity (defining "natural operations" to exclude rearrangements).  
  **Concession if cornered:** "You've hit on a genuine tension. But I'd argue this discontinuity is why we need fallback principles—they're stable where EU isn't."  

  ---

  **Final prep tips:** 
  - **Focus on top 3 objections**—they're the landmines. Rehearse replies verbatim to avoid waffling.  
  - **Leverage concessions** to appear reasonable, especially with the economist and summation advocates.  
  - **Body language:** Stay calm during Objection 1; a flustered reply there could sink you.  
  - **Your secret weapon:** Emphasize that *all* proposed solutions to Pasadena (summation conventions, weak expectations) have counterexamples—yours avoids them by not playing.  

  You've got a strong, defensible position. Good luck! If this misses any nuances, I can refine specific replies.
