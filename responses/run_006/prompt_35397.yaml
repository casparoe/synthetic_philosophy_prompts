  ## Envelope Triptych

  I chose one envelope, a blind embrace,
  Its weight a secret, neither told nor sold.
  **"To switch is gain; the other holds more gold!"**
  The first voice whispers, quickening my pace.

  It names the sum within, a tempting grace,
  Then spins the chance - half or double, bold.
  **"To switch is gain; the other holds more gold!"**
  The calculation forms a solid base:
  (One half the known, or double I unfold)
  **"But then why switch back? The same lie takes hold..."**

  This counter-voice, a cold and logical face,
  Declares the symmetry, the mirrored mould.
  **"But then why switch back? The same lie takes hold..."**
  If gain is constant in this shifting space,
  Why stand I ever on this threshold?
  **"To switch is gain; the other holds more gold!"**

  The twin promises, locked in their chase,
  Like scales that flicker, neither bought nor sold.
  **"But then why switch back? The same lie takes hold..."**
  No path seems right within this mirrored maze,
  Where reason cancels, leaving me controlled.
  **"To switch is gain; the other holds more gold!"**
  **"But then why switch back? The same lie takes hold..."**

  ---

  **How this reflects the paradox:**

  1.  **Refrains as Voices:**
      *   **"To switch is gain; the other holds more gold!"**: This is the **switching argument voice**. It represents the calculation: given amount X in your envelope, the other has an *expected value* of (1/2)*(X/2) + (1/2)*(2X) = 1.25X, hence you gain by switching.
      *   **"But then why switch back? The same lie takes hold..."**: This is the **symmetry argument voice**. It points out the flaw: the switching logic applies *no matter which envelope you hold first*. If switching is *always* beneficial, you'd be stuck in an infinite loop of switching, which is absurd. The "lie" refers to the faulty assumption that the other envelope's contents are independent of the one you hold.

  2.  **Form Mirroring Paradox:**
      *   **Circling Refrains:** The two refrains alternate (Stanza 1: Switch, Stanza 2: Symmetry, Stanza 3: Switch, Stanza 4: Symmetry, Stanza 5: Switch), just as the arguments circle each other logically. Neither gains dominance.
      *   **Tightening End:** The final quatrain forces both refrains together in the last two lines. This juxtaposition doesn't resolve the tension; it intensifies it. The reader feels the logical deadlock – the promise of gain ("holds more gold") colliding head-on with the impossibility of it ("why switch back?"), mirroring the unresolved core of the paradox.
      *   **Rhyme and Repetition:** The strict ABA rhyme scheme and the relentless return of the refrains create a sense of inescapable circularity, mimicking the frustrating loop of reasoning.

  3.  **Embedded Reasoning (Living the Paradox):**
      *   **Stanza 1:** Introduces the initial choice ("blind embrace") and the first refrain (switching argument).
      *   **Stanza 2:** Explains *how* the switching argument works ("names the sum", "spins the chance - half or double", "calculation forms a solid base") before restating it. The counter-refrain ("But then why switch back...") then intrudes.
      *   **Stanza 3:** Explains the counter-argument ("symmetry, the mirrored mould") and restates it. The question "If gain is constant... Why stand I ever..." directly states the absurdity the symmetry argument exposes.
      *   **Stanza 4 & 5:** Develop the feeling of being trapped ("twin promises, locked in their chase", "Like scales that flicker", "mirrored maze", "reason cancels") leading to the final, unresolvable clash.

  The poem doesn't name the paradox; it enacts its frustrating, circular reasoning through the villanelle's form and the specific content of the refrains and stanzas.
