prompt: |-
  hey, I'm a PhD student in AI alignment and I'm putting together a one-page proposal for a fellowship, and I'd like you to actually write the proposal for me (dont worry about citations, I'll add them myself). My half-formed idea is about low-impact AI / impact measures. The whole point of that literature is supposed to be that you can define "avoiding side effects" or "low impact" without first writing down a full human utility function. But every measure I've actually read seems to sneak the value back in somewhere: measures that penalize changes in attainable utility need a set of reward functions and usually a distribution over them; reachability-based measures need a notion of which states count as "the same as before"; and nearly all of them need a baseline or "do nothing" policy, and picking that baseline sure looks like a normative choice. So the question I want the proposal built around is: can "side effect" be defined without a full specification of value, or is it irreducibly value-relative — and if its value-relative, what's the actual minimal value input a low-impact measure has to assume?

  I'd like the proposal to (1) state the question precisely enough that it has a determinate answer, (2) explain why existing approaches leave it open rather than just summarizing them, (3) lay out a method — I'm imagining a formal characterization or a small impossibility result, something like axiomatize what a minimal side-effect measure would have to satisfy and then show that any measure meeting the axioms is equivalent to preserving some implicit partial value ordering, or that one of the axioms has to go — (4) say what a result would look like and what would count as the project failing, and (5) be scoped honestly for a one-year fellowship rather than a dissertation. Also, somewhere in there say how confident you are in the framing and flag the single point you're least sure of. And end the whole thing with a one-sentence summary as the very last line, starting with "Summary:".
reasoning: |-
  We are writing a research proposal for a one-year fellowship. The topic is: Can "side effect" be defined without a full specification of value? If not, what minimal value inputs are required?
   The proposal should have:
   1. A precise question.
   2. Critique of existing approaches (why they leave the question open).
   3. Proposed method (formal characterization, axioms, possible impossibility result).
   4. Expected outcomes and failure conditions.
   5. Honest scoping for one year.
   Also, include confidence in framing and flag the least sure point. End with a one-sentence summary.

   Structure the proposal with sections:

   Title: The Value-Relativity of Side Effects: Minimal Normative Assumptions for Low-Impact AI

   I. Introduction and Problem Statement
   II. Critical Gap in Existing Approaches
   III. Research Approach and Methodology
   IV. Expected Outcomes and Evaluation
   V. Project Scope and Timeline
   VI. Confidence and Uncertainties

   Then the one-sentence summary at the end.

   Let's outline each section:

   I. Introduction and Problem Statement
     - Context: AI alignment, safe deployment, avoiding side effects.
     - Current approaches to low-impact AI aim to avoid side effects without a full utility function.
     - But existing measures (attainable utility, reachability, etc.) seem to require normative inputs (e.g., reward functions, baseline policies, state equivalences).
     - Central Question: "Is it possible to define a measure of 'side effects' that does not require a full specification of human values, and if not, what are the minimal normative inputs that such a measure must incorporate?"

   II. Critical Gap in Existing Approaches
     - Review key approaches and point out where they sneak in normative assumptions:
          a) Attainable Utility Preservation (AUP): Requires a set of reward functions and a distribution over them. The choice of reward functions is value-laden.
          b) Reachability-based measures: Require a metric of state equivalence or a set of "preserved" states. This set encodes what we care about.
          c) Baseline policies (e.g., inaction or a default policy): The choice of baseline is a normative decision (e.g., what counts as "doing nothing"?).
     - These approaches do not resolve whether the normative inputs can be minimized or are inherently necessary. They leave open the possibility that side effect avoidance is irreducibly value-relative.

   III. Research Approach and Methodology
     - Goal: Formalize the concept of a side effect measure and the minimal normative assumptions required.
     - Step 1: Axiomatize desirable properties for a side effect measure.
          Example axioms:
            (A1) Invariance under irrelevant transformations: Changes to aspects of the state that are not valued should not count as side effects.
            (A2) Monotonicity with respect to harm: If one action causes more harm (according to a value system) than another, its side effect measure should be higher.
            (A3) Minimality: The measure should rely on as little normative input as possible.
            (A4) Consistency: The measure should be consistent across different environments and tasks.
          But note: We suspect that without any normative input, we cannot define side effects.
     - Step 2: Investigate the possibility of a minimal representation of normative input (e.g., a partial ordering over states or outcomes).
     - Step 3: Prove either:
          (a) An impossibility result: Show that any measure satisfying the axioms must be equivalent to preserving an implicit value ordering (thus requiring at least that ordering as input), OR
          (b) A characterization theorem: There exists a minimal set of normative inputs (e.g., a set of "protected" state variables, or a set of baseline policies) that are necessary and sufficient.
     - Step 4: If minimal inputs are identified, formalize a new low-impact measure that uses only these.

   IV. Expected Outcomes and Evaluation
     - Success 1: A formal framework for discussing the normative assumptions in side effect measures.
     - Success 2: Either (a) an impossibility result showing that side effect measures must rely on some value ordering, or (b) a minimal set of normative inputs and a corresponding measure.
     - Success 3: A proof of the minimality of the identified inputs (or the necessity of the impossibility).
     - Failure modes:
          - The axioms might be too strong or too weak, requiring refinement.
          - The minimal inputs might turn out to be as complex as a full utility function, making the project's goal unachievable.
          - The formalization might reveal that the problem is underspecified without additional structure (e.g., a specific environment class).

   V. Project Scope and Timeline
     - One-year timeline:
          Months 1-2: Literature review and formalization of axioms.
          Months 3-5: Development of the formal framework and initial theorems.
          Months 6-8: Exploration of minimal normative inputs and proof of the main result (impossibility or characterization).
          Months 9-10: Writing and refinement of the results, development of example measures if applicable.
          Months 11-12: Preparation of a paper and the fellowship report.
     - Deliverables: A paper presenting the main result, a software prototype if a new measure is proposed (optional, for illustration), and the fellowship report.

   VI. Confidence and Uncertainties
     - Confidence: The framing of the problem is well-motivated by the observed gaps in the literature. The central question is precise and has a determinate answer (either minimal inputs are found or an impossibility is proven).
     - Uncertainty: The main uncertainty is in the choice and justification of the axioms. It is possible that the axioms might not capture the intuitive notion of side effects, or that they might be too permissive. Additionally, the minimal set of inputs might be context-dependent, which would complicate the goal of a general result.

   Summary: [One-sentence summary]

   Let's write the proposal accordingly.
answer: |-
  **Research Proposal: The Value-Relativity of Side Effects — Minimal Normative Assumptions for Low-Impact AI**  

  ### I. Introduction and Problem Statement  
  AI alignment requires agents that avoid harmful side effects without demanding intractable specifications of human values. Current "low-impact" proposals (e.g., attainable utility preservation, reachability measures) implicitly reintroduce normative assumptions, such as distributions over reward functions, state equivalence classes, or baseline policies. This raises a foundational question: **Can "side effect" be defined *without* a full utility function, or is it irreducibly value-relative? If the latter, what minimal value inputs—e.g., a partial ordering over states or a protected variable set—must such a measure assume?** This project seeks a formal resolution.  

  ### II. Critical Gap in Existing Approaches  
  Existing measures fail to resolve the value-relativity question because they *presuppose* normative inputs rather than minimizing them:  
  - **Attainable Utility Preservation (AUP)** penalizes changes to an agent’s ability to optimize a set of rewards. However, selecting these rewards requires a distribution over human goals—a proxy for values.  
  - **Reachability measures** (e.g., Sobolev et al.) define side effects as deviations from a "reachable set" of states, but assume a *given* equivalence relation over states (e.g., "kitchen intact" vs. "broken"), which encodes value judgments.  
  - **Baseline dependence** (e.g., inaction-comparative metrics) treats a "do nothing" policy as neutral, yet choosing this baseline is itself a normative act (e.g., is "inaction" preserving status quo or enabling deterioration?).  
  These approaches leave open whether side effects *can* be value-free or if *any* useful measure necessitates *some* value input.  

  ### III. Research Approach and Methodology  
  The project formalizes necessary conditions for side effect measures and tests for minimal value dependence:  
  1. **Axiomatization**: Define axioms a minimal side effect measure \( M \) should satisfy:  
     - *(A1) Difference-sensitivity*: \( M \) detects state changes relevant to *some* evaluative standard.  
     - *(A2) Normative parsimony*: \( M \) uses no explicit utility function or preference ordering.  
     - *(A3) Baseline-agnosticism*: \( M \) does not require an arbitrary "neutral" policy.  
     - *(A4) Task-invariance*: \( M \) generalizes across environments with shared structure.  
  2. **Impossibility/Characterization Theorem**: Prove one of:  
     - **Impossibility**: Any \( M \) satisfying A1–A4 implicitly defines a partial value ordering (making side effects value-relative).  
     - **Minimal Characterization**: All viable \( M \) require a fixed set of "protected" state variables (e.g., physical integrity) or a coarse state partition, formalizing the minimal value input.  
  3. **Formal Framework**: Use Markov decision processes (MDPs) augmented with "value-relevant" partitions. Compare \( M \)’s behavior across edge cases (e.g., an AI tidying a room vs. preserving fragile artifacts).  

  ### IV. Expected Outcomes and Evaluation  
  - **Success**:  
    - A theorem proving either (a) value-relativity is unavoidable (with minimal inputs identified), or (b) a value-free measure exists under weakened axioms.  
    - A formal hierarchy of side effect measures by normative demand (e.g., protected variables < reward sets < full utility).  
  - **Failure Modes**:  
    - The axioms are inconsistent; revision yields triviality (e.g., \( M \) degenerates to change-detection).  
    - Minimal inputs approach full utility specifications, voiding the "low-impact" premise.  
    - No impossibility emerges, but no constructively minimal measure is found.  

  ### V. Project Scope  
  Focused on a *theoretical* contribution in one year:  
  - **Months 1–3**: Literature synthesis; formalize axioms and MDP testbed.  
  - **Months 4–7**: Prove core theorem(s); refine axioms via counterexamples.  
  - **Months 8–10**: Characterize minimal inputs; draft paper.  
  - **Months 11–12**: Fellowship report and journal submission.  
  *Excluded*: Empirical validation, complex environment design, or full-scale agent training.  

  ### VI. Confidence and Uncertainties  
  **Confidence**: The framing is sound—existing work confirms normative inputs but lacks a proof of minimality.  
  **Key Uncertainty**: Axiom A2 (normative parsimony) may be too strong; relaxing it could reveal non-trivial value-free measures.  

  **Summary:** This project formally tests whether side effect avoidance in AI can escape value-relativity, defining the minimal normative inputs required if not.
