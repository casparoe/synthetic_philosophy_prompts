prompt: |-
  I spent forty years as a bench biochemist, and I've only recently turned to philosophy. I'm trying to get clear about something I used to treat as unproblematic: what counts as alive. My intuitions on individual cases are firm, or at least stable, but I cannot find a principle that draws the line where I draw it. I'd like you to help me extract the principle — or, if no single principle will do, a small set of candidates — from the following verdicts.

  Here are the cases:

  1. A colony of Escherichia coli growing on an agar plate. Verdict: alive, no hesitation.

  2. A crystallised tobacco mosaic virus particle sitting on a bench. Verdict: not alive. It is a package of RNA and protein with no metabolism of its own, and it will sit there inert indefinitely.

  3. That same virus inside a tobacco leaf cell, having shed its protein coat and begun directing the host's ribosomes to produce viral proteins. Verdict: I want to say not alive, but I feel the pull of the other answer. If forced, I say not alive — it is a hijacked metabolic system, not an organism.

  4. A prion — a misfolded protein that induces other proteins to adopt its conformation. Verdict: not alive. No nucleic acid, no heritable sequence in the usual sense, just a conformation.

  5. A flame. Verdict: not alive. It metabolises, grows, and reproduces, but it is a sustained exothermic reaction with no information-bearing molecule, no membrane, and no evolutionary history.

  6. A mule. Verdict: alive. That it cannot reproduce does not matter; it is a functioning organism, product of evolution, with homeostasis, metabolism, and a life cycle — even if that cycle is a dead end.

  7. A human being declared brain-dead, maintained on a ventilator. Verdict: not alive. The organism as an integrated whole has ceased to exist; what remains is a collection of living tissues sustained by external machinery.

  8. A human zygote, the single cell formed at fertilisation. Verdict: alive. It is a stage in the human life cycle, with its own intact genome, and it will develop into a full organism given the right environment. That it lacks a brain or organs seems to me irrelevant to whether it is a living thing.

  9. A bacterial endospore, dormant for decades, with no detectable metabolism. Verdict: alive. It is in suspended animation, but it is an organism with the capacity to resume full metabolic activity. If I found one in a Martian rock, I would call it life.

  10. A red blood cell circulating in my own bloodstream. Verdict: not alive. It has no nucleus, no genome, no capacity to divide or maintain itself beyond a few months. It is a functional component of a living organism, not an organism itself.

  11. The synthetic minimal cell JCVI-syn3.0, with a genome of 473 genes, the smallest known autonomously replicating organism, built from scratch in a laboratory. Verdict: alive. It is an organism, even if humans designed its genome.

  12. A giant virus of the genus Mimivirus, which carries genes for aminoacyl tRNA synthetases and has a capsid larger than some bacteria, but still cannot replicate without a host. Verdict: not alive. The extra genes do not change the fundamental dependence.

  13. A lichen — a composite of a fungus and an alga or cyanobacterium, so tightly integrated that it was long mistaken for a single organism. Verdict: alive. Whether I should say the lichen is one living thing or two living things in symbiosis is a further question; set it aside. The system as a whole is alive.

  14. A computer program that copies itself across a network, mutates, and is subject to selection pressure from antivirus software. Verdict: not alive. It is a pattern of bits, not a physical entity maintaining itself far from equilibrium.

  15. A severed human hand, minutes after amputation, its cells still living. Verdict: not alive. It is a part, not an organism. But this case bothers me, because it makes me realise that "part of a living thing" and "living thing" are doing work I cannot articulate.

  I find that I cannot reduce these verdicts to a simple checklist. The standard textbook criteria — metabolism, growth, reproduction, response to stimuli, homeostasis, cellular organisation — do not capture the pattern. The virus scores on some criteria, the flame on others, the mule fails reproduction, the endospore fails metabolism. And the severed hand and the red blood cell suggest that "being an organism" or "being a whole" matters, but I cannot say what that means without circling back to "being alive."

  Is there a coherent principle — or a small set of candidates — that captures all or most of these verdicts? For each candidate principle, please tell me which of my verdicts it gets right, which it gets wrong, and whether the ones it gets wrong are verdicts I should reconsider. Also tell me what the principle says about a case I have not listed: suppose we freeze an entire human being in liquid nitrogen, with no metabolism, but with the potential (let us stipulate) to be revived intact. Is the frozen human alive, dead, or in a third state, and what does your principle say about that? Finally, if no single principle can accommodate all fifteen verdicts without becoming ad hoc, tell me which verdict or verdicts I should overturn and why.
reasoning: |-
  Okay, I see. The user is a former biochemist who's now exploring philosophy, specifically the definition of life. They've provided 15 cases with their intuitive verdicts on whether each is alive or not. The challenge is to find a unifying principle that explains all these judgments without contradictions. 

  Hmm, this is fascinating. The user's biochemistry background shows in their precise examples - from viruses to prions to synthetic cells. Their struggle mirrors classic philosophical debates about life's definition. I notice they're particularly troubled by boundary cases like the severed hand and the dormant endospore, where textbook criteria fail. 

  Let me analyze their verdicts first. They consistently favor evolutionary entities with potential for autonomous function, even when dormant (endospore) or sterile (mule). But they reject things that merely mimic life processes (flame) or are subsystems (red blood cell). The virus-in-action case reveals tension - they resist calling it alive despite its activity. 

  The frozen human hypothetical is key. If they accept dormant endospores as alive, consistency demands accepting cryopreserved humans as alive too. Their "potential for autonomous functioning" principle would cover both. 

  Wait - the severed hand case undermines this. Why is it not alive while the frozen human is? Both have living cells. Ah! The difference is structural integrity: the frozen human retains organismal unity while the hand is a fragment. This suggests we need two criteria: 1) being an evolved system with autonomous potential, and 2) maintaining structural coherence. 

  For cases that don't fit, like the actively replicating virus, I'll propose they reconsider. It meets their principle more than they admit - it's an evolved replicator exerting control. But if they hold firm, we'll need to add "without parasitism" as a qualifier, though that feels ad hoc. 

  The computer virus case is correctly excluded - no physical embodiment or evolutionary history. Interestingly, the user's rejection of flames and prions shows they require both information storage (DNA/RNA) and evolutionary origins. 

  Ultimately their intuition points to a cluster concept: evolutionary origin + structural integrity + autonomous potential. No single criterion works, but these three interlock to cover most cases. The frozen human passes all three; the severed hand fails structural integrity despite having cells. 

  I should acknowledge that Case 15 (severed hand) exposes the hardest problem - the organism/part distinction. Maybe suggest Aristotle's metaphysical concepts of "substance" versus "aggregate" as a philosophical direction if they want to dive deeper.
answer: |-
  Based on your detailed cases and verdicts, your intuition consistently points towards **an evolutionary and organizational principle centered on autonomous potential within a bounded system**. The textbook checklist fails because it emphasizes *processes* (metabolism, growth) over *identity and potential*. Here's a candidate principle capturing your pattern:

  **Core Principle:**  
  *"A system is alive if it is:  
  (1) An evolved, bounded, self-sustaining entity,  
  (2) Possessing an inherited molecular program (genome),  
  (3) With the autonomous potential to maintain its organization (homeostasis), adapt, or replicate *as that specific system*, using energy from its environment."*

  **Analysis of Your Cases:**

  | Case | Your Verdict | Principle Verdict | Match? | Notes |
  |------|--------------|-------------------|--------|-------|
  | 1. E. coli | Alive ✅ | Alive ✅ | Yes | Fits all criteria: bounded cell, genome, autonomous potential. |
  | 2. Crystallized TMV | Not alive ❌ | Not alive ❌ | Yes | Lacks metabolism, autonomy, and bounded self-sustenance. |
  | 3. Replicating TMV | Not alive ❌ | **Alive** ⚠️ | No | *Principle sees it as active, genome-driven replication. You might reconsider: it's executing its evolved program.* |
  | 4. Prion | Not alive ❌ | Not alive ❌ | Yes | No inherited molecular program (only structural templating). |
  | 5. Flame | Not alive ❌ | Not alive ❌ | Yes | Not evolved, no genome, no self-sustaining *bounded entity*. |
  | 6. Mule | Alive ✅ | Alive ✅ | Yes | Evolved, bounded, genome-driven, maintains homeostasis. Reproduction not essential. |
  | 7. Brain-dead human | Not alive ❌ | Not alive ❌ | Yes | Lacks autonomous potential; sustained externally. |
  | 8. Zygote | Alive ✅ | Alive ✅ | Yes | Bounded, genome-driven, autonomous developmental potential. |
  | 9. Endospore | Alive ✅ | Alive ✅ | Yes | Dormancy doesn't negate potential; evolved genome intact. |
  | 10. Red blood cell | Not alive ❌ | Not alive ❌ | Yes | No genome, no autonomous potential, not self-sustaining. |
  | 11. JCVI-syn3.0 | Alive ✅ | Alive ✅ | Yes | Artificial but *functional* genome, autonomous replication. |
  | 12. Mimivirus | Not alive ❌ | Not alive ❌ | Yes | Lacks autonomous metabolism/replication despite complex genome. |
  | 13. Lichen | Alive ✅ | Alive ✅ | Yes | Evolved, bounded symbiotic *system* with autonomous potential. |
  | 14. Computer virus | Not alive ❌ | Not alive ❌ | Yes | Not a physical bounded entity, no molecular program. |
  | 15. Severed hand | Not alive ❌ | Not alive ❌ | Yes | No autonomous potential; fragment, not a system. |

  **Mismatch & Reconsideration:**  
  The **only significant mismatch** is Case 3 (replicating virus). Your principle *requires* calling it alive: it’s an evolved entity with a genome, actively using host machinery to replicate autonomously *as a virus*. Your hesitation ("hijacked system") is valid but reveals a bias toward *metabolic independence*. If you hold firm on "not alive," add:  
  *"(4) Does not critically depend on *pre-existing molecular machinery of another lifeform* for replication."*  
  But this risks ad-hocness (lichen symbionts depend on each other!). **Recommendation:** Revisit Case 3. A replicating virus is arguably exhibiting "life" more than a crystal or prion.

  **The Frozen Human Case:**  
  Under this principle, the **frozen human is ALIVE**. It meets all criteria:  
  - Evolved, bounded entity with intact genome.  
  - Possesses *autonomous potential* to resume function (revival stipulation).  
  - Dormancy (like the endospore) doesn't negate potential.  
  *Verdict:* Alive, in suspended animation.

  **Why Your Intuition Works:**  
  - **"Organism" as Primary:** You prioritize *being a whole system* (Cases 7, 10, 15).  
  - **Potential > Activity:** Endospores (9) and zygotes (8) are alive despite dormancy/lack of complexity.  
  - **Evolutionary Origin:** Life is rooted in heritable information (rejects flames, prions, computer programs).  
  - **Autonomy:** Rejects subsystems (RBCs, hands) and obligate parasites *if* you maintain the virus exception.

  **Refined Principle Set (if rejecting replicating virus as alive):**  
  1. **Evolutionary Origin:** Must be a product of evolution (or functional equivalent, like JCVI).  
  2. **Bounded Self-Maintenance:** Requires a physical boundary (membrane) enabling internal homeostasis.  
  3. **Heritable Program:** DNA/RNA genome directing processes.  
  4. **Metabolic Autonomy:** Capacity to harvest energy *independently* (rejects viruses, accepts lichens).  
  *Cost:* This excludes replicating viruses (matches your verdict) but makes "autonomy" fuzzy (lichen symbionts).  

  **Conclusion:** Your verdicts are highly coherent. The **core principle of "evolved, bounded entity with genomic potential for autonomous function" captures 14/15 cases**. Only the active virus challenges it. If you insist viruses aren’t alive, add a "metabolic autonomy" clause—but recognize this privileges *metabolism* over *information-driven replication*, which may be arbitrary. The frozen human is alive by your standards, consistent with endospores. This framework resolves the "part vs. whole" issue (Cases 7, 10, 15) by emphasizing the *functional system* over its components.
