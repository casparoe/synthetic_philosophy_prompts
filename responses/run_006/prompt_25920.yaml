prompt: |-
  I'm a PhD student in cognitive neuroscience who regularly attends a philosophy of mind reading group. One phrase I keep hearing — 'consciousness is an illusion' — seems to do very different work depending on who says it. Last week someone used it to dismiss a question about whether a language model might be conscious: 'consciousness is an illusion anyway, so the question doesn't arise.' Another regular uses it to mean something like 'there's no extra ingredient beyond functional organization.' A third seems to mean something closer to 'introspection systematically misrepresents the nature of experience.' I want to get clear on what this slogan could actually be asserting before I respond in discussion. Can you lay out the distinct precise claims that 'consciousness is an illusion' might be used to express — from the relatively modest to the genuinely radical — and say for each: (a) whether it's plausible, (b) whether it's trivial or substantive, and (c) which readings would actually license dismissing questions about AI consciousness. I'd like this as a structured menu I can refer back to. Please keep the response to no more than 1,500 words.
