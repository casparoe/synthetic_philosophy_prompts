  I'm putting together a handout for a graduate seminar on confirmation theory. Please write a decision tree that takes someone from "I accept that the problem of old evidence is a genuine puzzle for Bayesian epistemology" to a named position in the literature. The tree should have six to eight leaves, and each branch node should be a yes/no question on which the positions genuinely come apart, phrased so that someone can answer it without already knowing the names of the positions.

