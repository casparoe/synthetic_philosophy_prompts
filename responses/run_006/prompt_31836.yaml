prompt: |-
  I've been following the debate between advocates of the "inside view" and the "outside view" in forecasting and decision-making, and I'm increasingly puzzled by the fact that the conversation seems to have stalled despite widespread agreement on the empirical picture. The basic distinction originates with Kahneman and Tversky's work on the planning fallacy: the inside view reasons about a project or problem by attending to its specific features — building a mental model of the particular case, its obstacles, its resources, its timeline — while the outside view treats the case as an instance of a reference class and anchors predictions to the base rates of similar cases. The empirical track record is not really contested. The outside view reliably outperforms the inside view across a wide range of domains, from construction projects and mergers to the kinds of geopolitical forecasting studied by Tetlock and his collaborators. So far, both sides nod along.

  The impasse emerges when the conversation turns from the descriptive to the normative. One camp — call them the strong outside-view position — argues that the inside view is a standing cognitive hazard, a systematic source of overconfidence and error that we should regard with suspicion wherever possible and systematically replace with outside-view reasoning. The other camp — call them the contextualists — concedes every empirical result but insists that the inside view remains indispensable in domains where reference classes are unavailable, poorly defined, or contested, and that in such domains the insistence on an outside view amounts to pretending to have base rates when you do not. The contextualists also raise a reflexive worry: if the strong outside-view position is itself a claim about how we ought to reason, what is the reference class that licenses it, and how was that reference class constructed without inside-view judgments about which cases are relevantly similar? The strong camp tends to dismiss this as a rhetorical move rather than a genuine objection, pointing to the brute predictive track record as sufficient to establish a default presumption in favor of the outside view.

  I have a working hypothesis that the disagreement is not about the facts — both sides accept the same data — but about the norms of epistemic justification themselves. The strong camp appears to treat the outside view as the default rational stance, putting the burden of proof on anyone who wants to use the inside view. The contextualists treat the two views as tools whose appropriateness depends on the epistemic context, with no global default and no burden of proof that runs in one direction only. If that diagnosis is right, the impasse is about what it means to justify a reasoning method, and neither side can argue for its preferred norm without presupposing it. But I am not fully confident. Could the disagreement instead be a hidden empirical one about the actual availability and quality of reference classes across different domains of reasoning? Or is it a disagreement about the scope of the evidence — about whether the forecasting-tournament results really generalize to reasoning in general, or only to the specific kinds of judgment under uncertainty that those tournaments test? And given your diagnosis, what would actually move the debate forward? Is there a distinction, an experiment, or a formal result that could resolve it, or is this the kind of disagreement about epistemic norms that just has to be lived with?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply engaged in the inside vs. outside view debate in decision-making. They mention Kahneman and Tversky's planning fallacy as the origin. The empirical evidence clearly favors the outside view, but there's a normative standoff. The user's hypothesis is that the conflict stems from differing norms of epistemic justification, not facts. 

  First, I need to verify if their understanding aligns with the literature. Yes, the empirical superiority of the outside view is well-documented. The user notes two camps: strong outside-view advocates who see the inside view as a cognitive hazard, and contextualists who argue for its necessity in certain domains. The reflexive worry about the outside view's own justification is a key point here.

  The user questions whether the disagreement is really about epistemic norms or if there are hidden empirical factors, like the availability of reference classes. They also wonder about the generalizability of forecasting tournaments. Their deeper need seems to be a desire to resolve the impasse or find a way forward.

  I should consider both possibilities. If it's about epistemic norms, it's a meta-debate where each side's argument might presuppose their own norms. For example, the outside view's reliance on base rates requires initial inside-view judgments to form reference classes—a bootstrapping problem. That's a strong point for contextualists.

  On the empirical side, maybe the strong camp underestimates how often reference classes are inadequate. Domain specificity matters here. In novel situations, like developing AI ethics, reference classes might not exist, forcing reliance on inside views. But how to test this? Perhaps domain-specific studies comparing both methods' efficacy where reference classes are weak could help.

  The user also brings up the scope of evidence. Forecasting tournaments focus on probabilistic predictions, but reasoning includes causal analysis or moral judgments. If outside views don't apply there, that limits their normative claims. Empirical work is needed here too—studying different reasoning types.

  For moving forward, I think the user wants actionable solutions. Hybrid approaches like post-mortems or premortems could integrate both views. Formal frameworks, like Bayesian models showing how inside-view updates modify base rates, might bridge the gap. Research into forming reference classes in new domains could address the bootstrapping issue.

  The user's unspoken need might be frustration with theoretical deadlock. They seek practical pathways, not just academic debate. Highlighting integrative methods and empirical tests could offer a way out, showing progress without resolving the deeper normative divide.
answer: |-
  Your diagnosis is remarkably incisive. The core impasse *does* appear to be fundamentally **meta-epistemological** – a clash about the norms governing justification itself, rather than the empirical data or hidden empirical disagreements. Let's break this down and explore paths forward:

  1.  **Confirming the Meta-Epistemological Stalemate:**
      *   **Strong Outside-View Camp:** Their normative stance ("default to outside view, burden of proof on inside view") *cannot* be justified solely by the empirical track record of the outside view *in specific prediction tasks*. This is because:
          *   **The Bootstrapping Problem:** To establish the reference class proving the outside view's superiority ("cases where we compared inside vs. outside view predictions"), one *must* use inside-view judgments to decide *which cases belong in that class* (e.g., what counts as a "similar forecasting task"?). Their preferred norm relies on the very mode of reasoning (inside view) it seeks to marginalize in its *own* justification.
          *   **Scope Limitation:** The empirical evidence is about *predictive accuracy in specific, measurable domains*. It doesn't automatically translate into a universal norm for *all* reasoning (e.g., causal explanation, moral deliberation, creative problem-solving, defining reference classes). Assuming it does is itself an inside-view leap.
      *   **Contextualist Camp:** Their stance ("toolbox approach, no global default") avoids the bootstrapping problem but struggles to provide a *principled* alternative to the strong camp's seemingly simple, evidence-backed rule. When *exactly* is a reference class "unavailable" or "too contested"? This requires judgment (often inside-view judgment!), potentially opening the door to motivated reasoning disguised as contextual appropriateness.

  2.  **Addressing Potential Hidden Disagreements:**
      *   **Availability & Quality of Reference Classes:** This is a *symptom* of the deeper divide, not the cause. The strong camp tends towards optimism ("a useful reference class can *always* be found if we try hard enough/are creative enough"), viewing the search as inherently outside-view dominated. The contextualist is pessimistic/skeptical ("many domains are genuinely unique or contested, forcing reliance on inside view"), viewing the search itself as heavily dependent on inside-view judgments of similarity and relevance. **Empirical research here *could* be helpful:** Large-scale studies systematically mapping the *feasibility* and *reliability* of constructing useful reference classes across diverse domains (novel tech, social policy, artistic endeavors) could temper extreme positions on both sides. If robust reference classes prove constructible far more often than contextualists assume, the strong camp gains ground. If they prove elusive or unreliable in many crucial domains, contextualism is bolstered.
      *   **Scope of Evidence (Generalizability):** This is crucial. The strong camp often implicitly generalizes forecasting tournament results (probabilistic prediction under uncertainty) to reasoning *in general*. Contextualists rightly push back:
          *   **Reasoning ≠ Prediction:** Much reasoning involves explanation, diagnosis, planning actions, understanding causality, or ethical evaluation – tasks not directly measured by prediction tournaments.
          *   **Uncertainty Gradient:** Tournaments focus on high-uncertainty domains. Does the outside view hold the same advantage in reasoning about highly stable systems or near-certainties? Probably less so.
          *   **"Inside View" as More Than Bias:** The strong camp often equates "inside view" with the *biased* inside view driving the planning fallacy. But sophisticated inside-view reasoning (systems thinking, detailed causal modeling) exists and can be powerful where good reference classes are absent. **Empirical work needed:** Studies comparing reasoning *quality* (not just prediction accuracy) in tasks requiring explanation, diagnosis, or innovation, under conditions of varying reference class quality. Does the outside view still dominate when the task isn't forecasting a probability?

  3.  **Paths Forward: Breaking the Impasse?**
      *   **Focus on Hybridization & Process:** Instead of seeking a global winner, focus on *integrating* the views robustly:
          *   **The "Premortem" / "Prospective Hindsight" Approach:** Start with the outside view (base rate) as the anchor. *Then* use the inside view *intensively* to generate reasons *why* this specific case might deviate (positively or negatively) from the base rate. This structures the inside view to challenge the anchor rather than replace it blindly.
          *   **Formalizing the "Inside-View Update":** Bayesian frameworks provide a natural path. Start with the outside-view prior (base rate). Treat sophisticated inside-view reasoning as generating likelihoods (evidence about *this specific case*). The posterior probability integrates both. This makes the role of each explicit and quantifiable (in principle).
          *   **Process Norms Over Outcome Norms:** Shift debate from "which view is default?" to "*how* should we structure reasoning processes to leverage both views appropriately?" Mandate explicit search for reference classes *before* detailed planning. Mandate explicit consideration of base rates in forecasts. Mandate documentation of *why* a reference class was rejected if using a strong inside view.
      *   **Empirical Research on the Bootstrapping Problem:** Can we study how reference classes are *actually* constructed? What role does inside-view judgment play? Are some methods for defining classes more robust or less biased than others? This tackles the reflexive worry head-on.
      *   **Domain-Specific Norms:** Accept that the optimal balance might vary by domain. Establish norms *within* fields (e.g., engineering project estimation vs. venture capital investing vs. intelligence analysis) based on the *specific* availability of data, predictability, and consequences of error in that domain. This avoids the impossible universal rule.
      *   **Acknowledge the Limitation:** Recognize that the meta-epistemological disagreement about the default stance/burden of proof might be unresolvable by pure empiricism or logic. It reflects different weightings of the values of avoiding bias (favoring outside view) vs. achieving granularity/relevance (favoring inside view) and different stances on the universality of base rates. Progress might lie in clarifying *that* this is the core disagreement and developing frameworks that function *despite* it (like the hybridization approaches above).

  **Conclusion:** Your hypothesis is likely correct. The stalemate is primarily about **epistemic norms**: the default stance, the burden of proof, and the scope of justification derived from empirical prediction studies. While hidden empirical disagreements about reference class feasibility and evidence generalizability exist and are worth investigating, they stem from and feed back into these deeper normative commitments.

  **What might move the debate forward?**
  1.  **Empirical work on reference class construction:** Quantifying how often and how reliably good classes can be built, and the role of inside view in doing so.
  2.  **Empirical work beyond prediction:** Studying reasoning quality in non-predictive tasks (explanation, diagnosis, innovation) with varying reference class availability.
  3.  **Developing & Testing Hybrid Frameworks:** Focusing research on *integration methods* (like formal Bayesian updating or structured premortems) and demonstrating their superiority over using either view in isolation.
  4.  **Embracing Domain-Specificity:** Shifting the focus from a universal rule to establishing best practices within specific fields based on their unique epistemic landscapes.
  5.  **Philosophical Clarification:** Explicitly mapping the meta-epistemological commitments of each side, acknowledging the bootstrapping problem, and accepting that a single, universally satisfying "default" might be logically impossible to justify without circularity. Progress then becomes about managing the tension productively rather than resolving it absolutely.
