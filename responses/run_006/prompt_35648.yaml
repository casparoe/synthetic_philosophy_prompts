answer: |-
  ## Decision Tree: Authority of Advance Directives in Dementia

  **Start:** Should A's advance directive refusing antibiotics for pneumonia be followed, given A's current contentment and inability to consent?

  1.  **Is A's past competent refusal (the advance directive) still morally authoritative?**
      *   **Yes** --> **Follow the Directive?**
          *   **Yes** --> **Precedent Autonomy View** (Prioritize the past competent self's binding decision. Autonomy extends over future incompetent states.)
          *   **No** --> *Unoccupied* (Why reject authority *and* refuse to follow it? Incoherent without alternative justification.)
      *   **No** --> **Does A's current state of contentment create new interests that outweigh the past directive?**
          *   **Yes** --> **Current-Interests View** (Only present welfare matters. Directive is irrelevant. Treat if it preserves contentment.)
          *   **No** --> **Is the advance directive specifically a 'Ulysses Contract' (binding oneself against future irrationality)?**
              *   **Yes** --> **Ulysses-Contract View** (The directive was designed *for this moment* of compromised rationality; honor it despite contentment.)
              *   **No** --> **Should treatment be decided based solely on A's current best interests?**
                  *   **Yes** --> **Best-Interests View** (Ignore directive *and* strict precedent; weigh burdens/benefits *now*. Might align with *Current-Interests* or *Proportionality* depending on assessment.)
                  *   **No** --> *Unoccupied* (Rejects all standard justifications; no coherent basis for decision.)

  **Notes:**

  *   **Unoccupied Leaves:**
      *   "No" to both Q1 and "Follow Directive?" (Q1a): Rejects past authority but offers no reason *not* to follow it if asked. Incoherent.
      *   "No" to Q1, Q2, Q3, *and* Q4: Rejects past authority, current interests, Ulysses reasoning, *and* best interests. No basis remains; unattractive and unexplored.
  *   **Convergence:** The **Precedent Autonomy** and **Ulysses-Contract** views *always* agree to follow the directive in this case. The tree separates them theoretically (intent vs. general autonomy), but they converge here.
  *   **Proportionality/Sliding-Scale:** Falls under the **Best-Interests View** (Q4=Yes). This view incorporates the directive's *weight* as evidence of past values into the *current* best interests calculus, alongside contentment, prognosis, etc. It doesn't treat the directive as automatically binding but gives it significant, variable weight.
  *   **Current-Interests View:** (Q1=No, Q2=Yes) inherently rejects the directive's authority. Contentment directly dictates treatment.
  *   **Key Distinction:** Q1 separates views granting the past self authority from those that don't. Q2 then separates those focused *only* on current welfare (Current-Interests) from those considering other factors like the directive's specific intent (Ulysses) or a broader best-interests assessment.
