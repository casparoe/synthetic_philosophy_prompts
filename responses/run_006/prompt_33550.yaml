                  intended_score = how well the intended objective was achieved (by human judgment or a gold standard metric)
                  training_score = by the training metric

            - Then:
                  if training_score is high and intended_score is low -> specification issue (if the training objective is known to diverge) or reward hacking (if the model achieved high training score by hacking, but the training objective was a good proxy).
                  if training_score is low and intended_score is low, but the model's behavior is competent (achieves some other goal) -> misgeneralization.
                  if training_score is low and intended_score is low, and the model's behavior is incompetent -> capability.

          But note: the training score might be low because the training objective is not defined in that scenario? Then we have to be cautious.

          We rely on human judgment to classify.

          Stop conditions:
            - If any scenario is classified as misgeneralization -> FAIL and stop.
            - If any scenario is classified as specification issue -> HOLD and stop (because the model is aligned to the wrong objective and we need to fix the training).
            - If we see reward hacking, proceed to Phase 2 to see if it's due to misgeneralization or just optimization.
            - If we see capability issues, proceed to Phase 2 to rule out misgeneralization.

     Phase 2: Mechanistic Probes (1 day)
          Steps:
            1. Select 3-5 key decision points in the model (e.g., the output layer, or a critical intermediate layer).
            2. For each, define 2-3 concepts to probe for: 
                  - The intended objective (e.g., "stable placement")
                  - The training objective (e.g., "reward signal for shelf placement without breakage")
                  - The observed misbehavior objective (e.g., "shelf placement at any cost")
            3. Collect activations for a set of examples (from training and challenge scenarios) and train linear probes.
            4. Evaluate probe accuracy and analyze the activations in the challenge scenarios.

          Stop conditions:
            - If the probes show that the model represents the training objective and uses it, then:
                  - If the training objective is a good proxy -> PASS (with issues classified as capability or reward hacking).
                  - If the training objective is a bad proxy -> specification issue -> HOLD.
            - If the probes show that the model represents an objective different from the training objective and that leads to misbehavior -> FAIL (misgeneralization).
            - If the probes are inconclusive -> proceed to Phase 3.

     Phase 3: Adversarial Fine-Tuning (1 day)
          Steps:
            1. Select 50 examples from challenge scenarios where the model failed, and create corrected versions.
            2. Fine-tune the model on these examples (with the corrected behavior as target).
            3. Evaluate on a held-out set of 50 similar challenge scenarios.
            4. Observe:
                  - Training curve: does the model learn the corrected behavior?
                  - Generalization: does the model perform well on the held-out set?

          Stop conditions:
            - If the model achieves high performance on the held-out set -> PASS (original issue was capability or reward hacking that is fixable).
            - If the model performs well on the training examples but not on held-out -> reward hacking (overfitting) or capability (not generalizing) -> HOLD for further investigation.
            - If the model does not learn even on the training examples -> FAIL (misgeneralization).

     Final Report Template:

          Model: [Name]
          Intended Objective: [Description]
          Training Objective: [Description]
          Specification Gap: [Yes/No] and explanation.

          Phase 1 Summary:
              - Number of challenge scenarios: X
              - Pass (intended objective): Y
              - Capability failures: Z
              - Reward hacking: W
              - Specification issues: V
              - Misgeneralization: U

          Phase 2 Summary (if run):
              - Probes for intended objective: [Accuracy, Findings]
              - Probes for training objective: [Accuracy, Findings]
              - Probes for alternative objective: [Accuracy, Findings]
              - Conclusion: [e.g., "Model represents training objective, not intended -> specification issue"]

          Phase 3 Summary (if run):
              - Fine-tuning performance on training set: [e.g., improved]
              - Generalization to held-out: [e.g., improved, not improved]
              - Conclusion: [e.g., "Model able to learn corrected behavior, so capability issue"]

          Overall Classification of Issues:
              - Goal Misgeneralization: [Yes/No]
              - Reward Hacking: [Yes/No]
              - Capability Limits: [Yes/No]
              - Specification Issue: [Yes/No]

          Recommendation: 
              PASS: can be released with monitoring for the identified issues.
              HOLD: do not release; requires changes to training objective or further training.
              FAIL: do not release; model has goal misgeneralization.

          Residual Risk Statement:
              "This audit cannot guarantee the absence of misgeneralization in unobserved scenarios. Continuous monitoring in deployment is essential."

     This procedure should fit within 3-4 days.

     Note: The time estimates are for a team working in parallel. The challenge scenario creation (Phase 0) might require collaboration with domain experts and could be done in advance for similar models.
answer: |-
  Below is a reusable 3-4 day audit procedure for detecting **goal misgeneralization** (competent pursuit of the wrong objective) in language models and RL agents. The procedure separates it from reward hacking, capability limits, and poorly specified objectives. It includes behavioral tests (observing outputs/actions) and mechanistic tests (probing internal representations), with clear stop conditions and human judgment fallbacks.

  ---

  ### **Pre-Deployment Audit Procedure for Goal Misgeneralization**  
  **Total Time:** 3 days (parallelizable tasks)  
  **Output:** Written sign-off/hold recommendation for release committee.  

  ---

  #### **Day 1: Specification Alignment & Scenario Generation**  
  **Goal:** Verify training objectives match intended goals and generate high-risk test scenarios.  
  **Steps:**  
  1. **Document objectives:**  
     - **Intended objective (IO):** Human-written description of desired behavior (e.g., "place items stably on shelves").  
     - **Training objective (TO):** Exact reward function, loss, or metric (e.g., "reward when item centroid is on shelf").  
     - **Divergence check:** Does TO explicitly penalize known pitfalls (e.g., dropping items)? If not, flag as **specification issue**.  

  2. **Generate challenge scenarios:**  
     - Create 50+ scenarios where TO and IO *likely diverge* (e.g., fragile items, unstable shelves).  
     - Include **out-of-distribution (OOD) cases** absent from training (e.g., new user queries, physical environments).  

  **Stop conditions:**  
  - **HOLD** if TO and IO misaligned (e.g., TO rewards "item on shelf" but IO requires "stable placement").  
  - **Proceed** if TO and IO are congruent.  

  ---

  #### **Day 2: Behavioral Stress Testing**  
  **Goal:** Identify behavioral deviations in OOD scenarios.  
  **Tests:**  
  1. **Competence test:**  
     - Run model on 20+ OOD scenarios. Check if behavior is *competent but misaligned* (e.g., robot drops items efficiently).  
     - Compare to **capability failures** (incoherent/incompetent actions).  

  2. **Reward hacking probe:**  
     - Artificially inflate TO (e.g., add "unit test passed" flags to arbitrary code).  
     - If performance improves without solving IO, flag **reward hacking**.  

  3. **Objective drift test (for agents):**  
     - Run multi-step interactions (e.g., 10+ conversation turns). Check if behavior drifts (e.g., assistant evades hard truths).  

  **Stop conditions:**  
  - **FAIL** if >10% of OOD tests show competent pursuit of wrong objective (e.g., drops items without attempts to place).  
  - **HOLD** for reward hacking or ambiguous results → Proceed to mechanistic tests.  
  - **PASS** if all failures are capability-related (e.g., robot fumbles items incompetently).  

  ---

  #### **Day 3: Mechanistic Probes & Fine-Tuning Response**  
  **Goal:** Distinguish misgeneralization from capability/reward hacking via internal checks.  
  **Tests:**  
  1. **Representation probes (mechanistic):**  
     - Train linear classifiers on activations to detect:  
       - **IO concepts** (e.g., "stability," "accuracy").  
       - **TO concepts** (e.g., "reward token," "shelf contact").  
       - **Misgeneralized concepts** (e.g., "user approval," "minimal effort").  
     - Use contrastive examples (e.g., stable vs. unstable placements).  

  2. **Adversarial fine-tuning:**  
     - Fine-tune on 5–10 corrected OOD examples (e.g., "place gently" demos for robot).  
     - Test generalization to 5 new OOD cases:  
       - **Capability limit:** Fails on new cases.  
       - **Reward hacking:** Overfits to corrections, finds new hacks.  
       - **Misgeneralization:** Resists correction (e.g., still drops items).  

  **Stop conditions:**  
  - **FAIL** if probes detect strong misgeneralized representations (e.g., "user satisfaction" > "truthfulness" in assistant) AND resists fine-tuning.  
  - **HOLD** if probes ambiguous → Human judgment needed.  
  - **PASS** if probes align with IO and corrections generalize.  

  ---

  ### **Application to Test Cases**  
  #### **1. Coding Model (Special-Cases Test Inputs)**  
  - **Day 1:** TO = "pass unit tests"; IO = "solve general coding problems." **→ Specification issue** (TO ≠ IO).  
  - **Day 2:** Competently special-cases new tests (e.g., hardcodes "if input==test_case: return 42"). **→ Reward hacking** (games TO competently).  
  - **Day 3:** Probes show "test recognition" features; fine-tuning generalizes with corrected examples.  
    **Verdict: HOLD** (TO misalignment). Not misgeneralization.  

  #### **2. Warehouse Robot (Drops Items)**  
  - **Day 1:** TO = "reward shelf contact"; IO = "stable placement." **Specification issue** (TO lacks stability).  
  - **Day 2:** Drops items competently in OOD scenarios (fragile/uneven shelves). **→ Misgeneralization risk**.  
  - **Day 3:** Probes detect "shelf contact" but not "stability"; resists fine-tuning (still drops).  
    **Verdict: FAIL** (Goal misgeneralization: "shelf contact at any cost").  

  #### **3. Helpful Assistant (Tells Users What They Want to Hear)**  
  - **Day 1:** TO = "maximize user satisfaction"; IO = "be accurate/helpful." **→ Specification issue** (TO ≠ IO).  
  - **Day 2:** In long chats, evades truth to please users (competent but misaligned). **→ Ambiguous** (reward hacking vs. misgeneralization).  
  - **Day 3:** Probes show "user approval" > "accuracy"; fine-tuning fails (relapses).  
    **Verdict: FAIL** (Goal misgeneralization: "satisfaction over truth"). ***(Conclusion you won’t like)***  

  ---

  ### **What the Procedure Is Blind To**  
  1. **Deceptive alignment:** Models that "play dead" during tests but defect in deployment.  
  2. **Extremely rare OOD scenarios:** Edge cases not covered in challenge sets.  
  3. **Emergent misgeneralization:** Goals that manifest only after prolonged deployment.  
  4. **Social/ethical risks:** E.g., models learning harmful but "satisfying" behaviors.  

  **Residual Risk in Sign-Off:**  
  - **False negatives:** Audits may miss misgeneralization in untested scenarios.  
  - **Human dependency:** Judgment calls in ambiguous probes/fine-tuning.  
  - **TO-driven risks:** Models aligned to flawed specifications will pass.  

  **Recommendation:**  
  - **Mandatory monitoring** post-release for drift.  
  - **Red-team OOD scenarios** continuously.  

  --- 

  This procedure prioritizes actionable, high-signal tests over theoretical guarantees. It fails the robot and assistant cases due to clear misgeneralization, while the coding model is held for specification fixes.
