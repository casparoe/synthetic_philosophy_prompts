prompt: |-
  I'm a PhD student in political theory, so I read a fair bit of moral philosophy but I'm not really in that field. Lately I've been noticing a pattern in how people (me included) try to decide what to do when they aren't sure which moral view is right. The usual move is to treat it like any other uncertainty: list the candidate views, weight each by how plausible you think it is, and pick the action with the best expected score. But the output seems weirdly senstive to how you list the views. If I'm torn between two broad famillies, and one of them I've only ever seen stated as a single tight position while the other I've seen in a dozen slightly different formulations, then just listing 'the theories' and weighting them equally gives the second family twelve times the pull, even though my actual credence is basically fifty-fifty between the families. I saw the same thing in a seminar once: someone treated consequentialism as one view but deontology as a loose bag of contractarian, Kantian, and Rossian views, then concluded that the class was mostly deontologists — but the conclusion was really an artifact of the sorting, not of anyone's credences. Is there a name for this, the way the result depends on how finely you individuate the theories you're hedging across? I know decision theory has things to say about partition-dependence and how you carve up states, but this seems different, because the 'states' here are normative views and there's no obvious principled way to count them. And is the standard response just 'don't double-count near-duplicate theories', or is that a band-aid over a deeper problem about whether any weighting across moral views is well-defined in the first place? I'm not really after a label — I want to know what the phenomenon is, how it relates to the nearest concepts, and where it breaks down.
reasoning: |-
  Okay, the user is a PhD student in political theory who's noticed a problem in how people handle moral uncertainty. They're describing a situation where the outcome of decision-making under moral uncertainty depends heavily on how theories are categorized. Specifically, if one moral family is broken into many sub-theories while another is treated as a single view, the aggregated result gives undue weight to the more subdivided family—even if the person's actual credence is split equally between the two broad families. 

  The user mentions seeing this in a seminar where consequentialism was treated as one view while deontology was split into multiple sub-views, artificially inflating the perceived support for deontology. They’re asking if this phenomenon has a name, how it relates to existing concepts in decision theory, and whether the solution is as simple as avoiding double-counting or if it points to a deeper issue with weighting moral views. 

  First, I need to identify the core problem. The user is highlighting that granularity affects the expected moral value calculation. If you split one theory into many sub-theories, each gets its own weight in the expected value formula, so the aggregated weight of that family becomes disproportionately large. For example, if deontology is split into Kantian, contractarian, and Rossian views, and each is weighted equally with consequentialism, then deontology gets three times the weight even if the user has equal credence in deontology and consequentialism as broad families. 

  The user is correct that this resembles partition dependence in decision theory, where outcomes depend on how states are divided. But as they note, it’s messier here because moral theories aren’t naturally discrete like states of the world—they’re fluid, overlapping, and often non-commensurable. 

  For labeling, terms like "granularity sensitivity" or "theory individuation problem" come to mind. "Partition sensitivity in moral uncertainty" is another option. The key is to emphasize that the issue arises from how we slice up the theoretical landscape. 

  The deeper issue is whether moral uncertainty can even be modeled this way. Expected value calculations assume theories are mutually exclusive, exhaustive, and numerically comparable—but moral theories often violate all three. They might overlap (e.g., virtue ethics borrowing from deontology), omit alternatives, or lack a common metric for "moral value." 

  The user might also be hinting at a meta-problem: Is formalizing moral uncertainty this way coherent? The "band-aid" solution of clustering similar theories helps superficially, but it doesn’t resolve incommensurability or the lack of a neutral framework. Philosophers like MacAskill or Lockhart have wrestled with this, suggesting approaches like variance voting or clustering, but all have limitations. 

  Underlying this is the user’s struggle as a political theorist—they likely deal with ideologies that resist neat categorization. Their real frustration might be that political/moral theories are too fluid for decision-theoretic tools. They might benefit from literature on moral uncertainty that acknowledges these limits, or even heterodox approaches like moral hedging without strict aggregation. 

  I should also validate their insight: Yes, this is a recognized problem, not just their oversight. And while there’s no perfect fix, clarifying the trade-offs (e.g., clustering risks obscuring important differences) might help them navigate it in their work.
answer: |-
  This is an **extremely perceptive observation**, hitting on a fundamental and contentious problem in decision-making under moral uncertainty. You've identified a core tension that lacks a universally accepted name but is closely related to several key concepts in philosophy and decision theory. Here's a breakdown:

  1.  **The Core Phenomenon: Granularity Sensitivity / Theory Individuation Problem**
      *   **What it is:** The sensitivity of the "expected moral value" calculation (or the resulting "best action") to *how coarsely or finely you individuate the moral theories* over which you are uncertain, *independent* of your underlying credences in the core propositions or families of thought.
      *   **Why it happens:** The calculation `Expected Moral Value (EMV) of Action A = Σ [Credence(C_i) * Value_C_i(A)]` treats each `C_i` as an independent, mutually exclusive "state" contributing its own weighted value. If you split a broad theory (like Deontology) into many sub-theories (`C_d1`, `C_d2`, ... `C_dn`) while leaving another broad theory (like Consequentialism) as a single unit (`C_c`), then even if `P(Deontology) = P(Consequentialism) = 0.5`, the *n* deontological sub-theories each get `Credence ≈ 0.5/n` while Consequentialism gets `Credence ≈ 0.5`. The *aggregate* deontological influence becomes `Σ (0.5/n * Value_di(A)) ≈ 0.5 * (Average Value_di(A))`. Crucially, if the sub-theories generally agree on `A`, their *collective weight* (0.5) dominates the calculation compared to the single consequentialist weight (0.5), even if the *families* had equal credence. The "resolution" at which you describe the theories biases the aggregation.

  2.  **Relation to Nearest Concepts:**
      *   **Partition Dependence (Decision Theory):** You're absolutely right that this is the closest formal concept. Standard partition dependence concerns how the *description* of states of the world affects probabilities and expected utility under empirical uncertainty (e.g., describing "Die shows 1" vs. "Die shows even number"). The core similarity is the dependence of expected value on how possibilities are carved up.
      *   **Key Difference:** As you note, the problem is *worse* with moral theories. States of the world (ideally) have a natural, objective individuation (e.g., physical outcomes). Moral theories lack this:
          *   **Non-Exclusivity:** Theories overlap significantly (e.g., Rule Consequentialism borrows from Deontology; Virtue Ethics incorporates aspects of both).
          *   **Non-Exhaustiveness:** Your list is almost certainly incomplete. New theories emerge; existing ones evolve.
          *   **Lack of Natural "Atoms":** There's no obvious fundamental unit of moral theorizing. Is the "atom" a principle (Categorical Imperative, Utility Maximization)? A foundational commitment (Agent-Relative Reasons vs. Agent-Neutral Value)? A complete axiomatic system?
          *   **Incommensurability:** The `Value_C_i(A)` assigned by different theories may be on radically different scales or dimensions, making aggregation inherently problematic. Partition dependence in empirical utility usually assumes a common currency (e.g., dollars).
      *   **Weighting Problem / Aggregation Problem (Moral Uncertainty):** This is a broader term encompassing the difficulties of combining verdicts from different moral theories into a single decision metric. Granularity sensitivity is a *specific manifestation* of this deeper problem.
      *   **Reference Class Problem (Probability/Statistics):** Analogous to the problem of defining the relevant population for a probability estimate. "What is the correct set of theories over which to distribute my credence?" suffers from a similar lack of objective boundaries.

  3.  **Where It Breaks Down / The Deeper Problem:**
      *   **The "Band-Aid" (Clustering/De-Duplication):** The intuitive fix – "Don't double-count near-duplicates; cluster similar theories" – is necessary but insufficient and introduces new problems:
          *   **The Similarity Problem:** How "similar" must theories be to cluster? Is Kantian Deontology closer to Rossian Deontology or to Contractarianism than they are to Consequentialism? Similarity is multidimensional and contested. Clustering requires normative judgments *about* the theories themselves.
          *   **Loss of Nuance:** Clustering risks obscuring important differences *within* a family that *are* relevant to the decision at hand. If two deontological sub-theories disagree sharply on action `A`, clustering them loses this crucial information.
          *   **The Unit of Agency:** Should clustering be based on shared foundational principles, shared verdicts on specific cases, shared methodologies, or historical lineage? There's no principled answer.
      *   **Revealing the Abyss:** Granularity sensitivity exposes that the **very project of formal expected value maximization under fundamental moral uncertainty might be ill-defined or incoherent.** It highlights the lack of:
          1.  **A Principled Ontology of Morality:** What *counts* as a distinct moral theory?
          2.  **A Neutral Framework:** The aggregation method itself (summing expected values) presupposes a kind of consequentialist structure ("maximize expected moral score") that many non-consequentialist theories reject *as the correct way to handle moral uncertainty*. You're applying a decision rule that some theories in your set would deem morally wrong!
          3.  **A Common Currency:** Without a way to normalize `Value_C_i(A)` across theories (e.g., is a "util" for Kant the same as a "util" for Bentham?), the sum is meaningless. Attempts to find one (e.g., "choice-worthiness") are controversial.
          4.  **Exhaustiveness:** The result is always vulnerable to adding new, plausible theories, potentially changing the "optimal" action.

  4.  **Responses & Ongoing Debate (Moral Uncertainty Literature):**
      *   **Refined Clustering:** Some (e.g., William MacAskill in *Moral Uncertainty*) advocate sophisticated clustering based on *intertheoretic comparisons of choice-worthiness*. This tries to group theories where their value functions can be meaningfully compared/aligned. It mitigates but doesn't eliminate granularity issues.
      *   **My Favorite Theory / My Try My Best:** Give all credence to the single theory you find most plausible. Avoids aggregation but ignores uncertainty.
      *   **Maximin / Leximin:** Focus on avoiding the worst outcomes according to any plausible theory. Avoids aggregation but can be extremely conservative.
      *   **Variance Voting / MEC (Minimizing Expected Choice-Worthiness Loss):** Developed by MacAskill, Ord, et al. MEC tries to minimize the *expected shortfall* relative to what the true theory would recommend. It's less sensitive to *mere* granularity than simple EMV but *highly* sensitive to how choice-worthiness is normalized/intertheoretically compared, which reintroduces similar foundational problems.
      *   **Skepticism about Formal Aggregation:** Many philosophers (e.g., Elizabeth Harman, Sophie Grace Chappell) argue that fundamental moral uncertainty resists formal decision-theoretic treatment precisely because of problems like granularity sensitivity and incommensurability. They suggest alternatives like continuing moral inquiry, developing moral character/virtues for uncertainty, acting on defeasible intuitions, or prioritizing actions justifiable under multiple theories ("overlapping consensus").

  **Conclusion:**

  You've pinpointed **granularity sensitivity in moral uncertainty aggregation** – a profound challenge arising from the **lack of a natural, objective individuation of moral theories** combined with the **incommensurability of their value structures** and the **non-neutrality of the aggregation framework itself**.

  The "don't double-count" band-aid is a practical heuristic to avoid the most egregious errors, but it masks a deeper philosophical problem: **there may be no coherent, uniquely correct way to define the "space" of moral possibilities over which to distribute credence and compute expected moral value.** This sensitivity exposes the potential **ill-defined nature of the very concept of "expected moral value" across fundamentally different normative frameworks.**

  As a political theorist, you might find this resonates with challenges in aggregating preferences, defining ideological categories, or justifying decisions under deep pluralism. The literature on moral uncertainty (MacAskill, Lockhart, Sepielli, Ross, Weatherson, Bykvist) grapples directly with this, though no consensus exists. The phenomenon suggests that formal decision rules under radical moral uncertainty might be more akin to structured heuristics or expressions of meta-normative commitments than truly objective calculations. It forces us to confront the limits of decision theory when applied to the foundational questions of value and normativity.
