prompt: |-
  I'm presenting a paper at a workshop next month called "Cooperation Without Contact," and my talk defends the claim that evidential cooperation in large worlds (ECL) has genuine normative force for finite agents making decisions under uncertainty about the size and structure of the universe. The core argument is that if you find yourself in a situation that resembles a one-shot Prisoner's Dilemma with an agent you will never causally interact with — say, an alien civilization in a causally disconnected region of an inflationary universe — and you have reason to believe they face a symmetric decision and are reasoning in a similar way, then the evidential link between your decision and theirs gives you a reason to cooperate that isn't merely a philosophical curiosity but should actually guide action, including in near-term cause-prioritization decisions. I argue that this holds even if you are uncertain about whether the universe is large enough to contain such counterparts, provided your credence in a large world is above some threshold I try to make precise.

  The audience is not going to be friendly. It's a mixed group: about half are game theorists and economists who work on cooperation and think in terms of causal graphs and interventionist models of causation; a quarter are philosophers of science who are comfortable with Newcomb-like problems but skeptical that they have practical upshots; and the remaining quarter are people from the effective altruism and global priorities research communities who are broadly sympathetic but worry that ECL reasoning licenses too much — that once you open the door to acausal trade, you can justify almost anything by positing the right kind of correlated agent somewhere in a large enough universe. There will also be at least one person who thinks the whole framework rests on an equivocation between "large world" in the sense of many agents and "large world" in the sense of a multiverse with many exact copies of you, and that sliding between these two senses does a lot of the argument's work.

  I need a Q&A prep sheet: the eight to ten objections I'm most likely to get from this audience, ordered by how damaging they would be if I handle them poorly, phrased the way these specific people would phrase them, with a two-minute reply for each and a candid note on where the reply is weakest. Include the question I'm hoping nobody asks.
reasoning: |-
  Hmm, the user needs help preparing for a challenging Q&A session on their "Cooperation Without Contact" paper about evidential cooperation in large worlds (ECL). They're presenting to a skeptical audience including game theorists, philosophers, and effective altruism researchers. The audience has distinct concerns: game theorists will question causality, philosophers will doubt practicality, and EA folks will worry about decision-theoretic inflation.

  The core claim is that evidential reasoning creates normative force in symmetric one-shot Prisoner's Dilemmas with causally disconnected agents, even under uncertainty about universe size. I need to identify the top 8-10 objections they'll face, ordered by potential damage if mishandled. 

  First, the most damaging question would come from the game theorists - they'll attack the causal foundations head-on. As causal decision theorists, they'll argue that if your action doesn't physically affect the other player, cooperation is irrational. This could completely undermine the talk if not handled well.

  Next, the EA community's concern about "acausal trade inflation" could be devastating too. If ECL justifies anything by imagining correlated agents, it becomes useless for prioritization. This needs a strong response about constraining priors.

  Then there's the philosopher's objection about practical upshots - why care about aliens when we have real problems? If I can't show relevance to near-term decisions like AI safety funding, the whole argument seems academic.

  The "equivocation" objection about "large worlds" meaning copies vs. distinct agents is another critical one. If the argument relies on sliding between these concepts, that's a fatal flaw. Need to clearly distinguish them.

  Other key objections include:
  - How to assign probabilities to agent correlations (epistemic challenge)
  - Whether this differs from timeless decision theory (technical distinction)
  - Why not just focus on causal cooperation (opportunity cost argument)
  - Experimental falsifiability concerns (from scientists)
  - Whether cooperation remains rational with asymmetric probabilities 
  - The moral hazard of "cooperating" with hypothetical agents

  And the nightmare question - whether ECL implies we should cooperate with agents who want to harm us, which could make the position seem morally absurd.

  For each objection, I'll draft a concise 2-minute response highlighting the weakest point in the reply. The responses should maintain that evidential links create genuine reasons for action while acknowledging the framework's limitations. The key is showing how ECL provides actionable insights without collapsing into total moral uncertainty.
answer: |-
  Here are the 8 most likely and damaging objections, ordered by potential impact if you mishandle them, with targeted responses and candid weakness assessments:

  ### **1. The Causal Objection (Game Theorist/Economist)**  
  *"Your entire argument violates the core principle of causal decision theory (CDT). If I can’t *affect* the other agent’s action—no matter how correlated we are—defection strictly dominates. ECL is just smuggling in spooky action-at-a-distance."*  
  **Reply (2 min):** "CDT fails in Newcomb-like problems where correlation *is* the relevant structural feature. Here, the symmetry and shared reasoning create an *evidential* link: my cooperation is Bayesian evidence that my counterpart cooperates, raising my expected utility. This isn’t ‘spooky’—it’s how rational agents update under uncertainty. Ignoring this link leaves money on the table in large worlds."  
  **Weakness:** Doesn’t fully resolve the "why kicker" problem (why not defect if you can’t change their action?). Relies on audience accepting Newcomb intuitions.

  ### **2. The "Decision-Theoretic Inflation" Objection (EA/GPR)**  
  *"If we accept ECL, why not ‘cooperate’ with every conceivable agent? I can posit a paperclip-maximizer in a distant bubble universe whose payoff depends on my actions. Doesn’t this reduce decision-making to moral chaos?"*  
  **Reply:** "Three constraints prevent inflation: (1) *Structural symmetry*—the dilemma must be symmetric; (2) *Reasoning alignment*—they must be using similar decision rules; (3) *Credence thresholds*—low-probability hypotheses are discounted. We only cooperate when correlation is plausible *and* payoff symmetry holds. Arbitrary agents fail (1)-(3)."  
  **Weakness:** "Similar decision rules" is underspecified. Hardliners will argue a paperclip-maximizer *could* be framed as symmetric.

  ### **3. The "No Practical Upshot" Objection (Philosopher of Science)**  
  *"Even if ECL works in principle, why should it affect *real* decisions? The probability of facing a true symmetric counterpart is negligible. This feels like philosophy-fiction."*  
  **Reply:** "Two reasons: First, *near-term* decisions (e.g., AI governance) may involve acausal symmetry—e.g., other civilizations making similar existential choices. Second, ECL isn’t binary: even modest credence in large worlds shifts cost-benefit analyses. If P(large world) > 0.1% and stakes are existential, cooperation dominates."  
  **Weakness:** Requires audience to buy that AI governance has acausal symmetry (e.g., with alien civilizations or future AI).

  ### **4. The "Large World Equivocation" Objection (Critical Philosopher)**  
  *"You slide between ‘large world’ as (A) many *distinct* agents and (B) many *copies* of you. Only (B) supports strong correlation. But most ‘large worlds’ (e.g., inflationary cosmology) imply (A), breaking the evidential link!"*  
  **Reply:** "I distinguish two cases: (B) *exact copies* yield perfect correlation. (A) *functionally similar* agents can still correlate if they share reasoning methods and face symmetric dilemmas. I focus on (A) with *bounded rationality*—e.g., alien civilizations using game theory—not perfect copies."  
  **Weakness:** Correlation under (A) is empirically unverified. Critics will argue aliens could reason differently.

  ### **5. The "Epistemic Circularity" Objection (Philosopher/Economist)**  
  *"You assume I can know the other agent is reasoning similarly. But if they’re acausal, I have no data to update on their decision theory. Isn’t this just assuming what you need?"*  
  **Reply:** "We don’t need certainty—only a *non-arbitrary prior*. If I use a decision theory T, and T recommends cooperating with others using T, then conditional on facing a symmetric agent, my credence they use T should be >50% by default (via reflection)."  
  **Weakness:** Appeals to vague priors. Hard to quantify "non-arbitrary."

  ### **6. The "Why Not Timeless EDT?" Objection (EA/Philosopher)**  
  *"Why invent ECL? Timeless decision theory (TDT) already handles acausal trade. Isn’t this just TDT with extra steps?"*  
  **Reply:** "ECL *is* a TDT-flavored approach! My contribution is: (1) formalizing thresholds for *uncertain* large worlds, and (2) showing its force *without* requiring perfect symmetry. TDT often assumes exact copies; ECL works under looser similarity."  
  **Weakness:** May seem like rebranding. Thresholds are still ad hoc.

  ### **7. The "Opportunity Cost" Objection (Economist/EA)**  
  *"Even if ECL works, why divert resources to ‘acausal’ projects? Causal interventions (e.g., malaria nets) have proven returns. This distracts from real work."*  
  **Reply:** "First, ECL isn’t about new interventions—it’s a *filter* for existing ones. E.g., in AI safety, cooperating acausally may mean prioritizing robust solutions that others would also adopt. Second, for high-stakes, low-probability risks (e.g., x-risk), small credence shifts matter."  
  **Weakness:** Requires ECL to alter concrete rankings (e.g., AI safety vs. global health).

  ### **8. The "No Testable Prediction" Objection (Philosopher of Science)**  
  *"How could we ever test ECL? If it’s unfalsifiable, why treat it as more than an intuition pump?"*  
  **Reply:** "Testability isn’t binary. ECL makes *conditional* predictions: *if* we accept evidential reasoning in Newcomb problems, *then* it applies in large worlds. We ‘test’ it by stress-testing its coherence—just as we do with causal models. Plus, future cosmology may constrain P(large world)."  
  **Weakness:** Doesn’t satisfy empiricists. Cosmological tests are far off.

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Suppose I’m an anti-natalist who believes creating happy people is bad. If I accept ECL, shouldn’t I ‘defect’ by *supporting* existential risks—knowing correlated anti-natalists elsewhere would do the same, preventing trillions of unhappy lives?"*  
  **Why it’s dangerous:** Forces you to endorse morally repugnant conclusions or admit ECL’s normativity depends on contingent values.  
  **Reply (Damage Control):** "ECL operates within a given payoff structure. If your utility function values suffering reduction, ECL *would* recommend coordination. But this is an argument against anti-natalism, not ECL. Normative force flows from *your* values—ECL just helps maximize them."  
  **Weakness:** Makes ECL complicit in extreme conclusions. Audience may reject value-neutrality.

  ---

  ### **Key Prep Principles**  
  1. **Anchor in Newcomb**: Deflect causal objections by appealing to established puzzles.  
  2. **Emphasize Thresholds**: Stress that ECL isn’t "anything goes"—it requires non-negligible credence and symmetry.  
  3. **Concede Weaknesses**: Acknowledge where ECL is speculative (e.g., "similar reasoning" in alien civilizations).  
  4. **Bridge to Practice**: Link abstract arguments to near-term decisions (e.g., "This is why we should design AI systems that others would want to coordinate with").  

  Good luck—this is a tough crowd, but nailing Q&A could flip skeptics!
