prompt: |-
  Give me your actual credence — a number, not a survey of positions. The proposition: if a person's preferences permit a money pump (a sequence of trades, each of which the person prefers when it is offered, that leaves them strictly worse off than where they started), then those preferences are rationally impermissible to hold — not merely exploitable or costly. I want the number decomposed. In particular, tell me (i) how much of your credence rides on whether the operative notion of rationality is synchronic (coherence among preferences held at a single time) or diachronic (coherence among choices extended over time); (ii) how much rides on whether a sophisticated agent, who foresees the whole sequence and declines the trades while retaining the cyclical preferences, thereby escapes the charge of irrationality; and (iii) how much rides on whether a rational agent may accept being exploitable in this way because the preferences serve other ends the agent is entitled to have. Assign a rough probability to each component, show how they combine into your final number, and say which component the final number is most sensitive to. Then identify the component you are least confident about and say what argument or evidence would move it most. Be committed: give a definite number with an honest derivation rather than a hedged answer.
