  - **Belief norm** (assert only what you believe): Excluded by case (4), where the assertion was believed but improper due to lack of evidence (even though it was false).

  ### Live Norms After Prior Cases
  The remaining live norms are:
  1. **Knowledge norm**: Assert only what you know.
  2. **Justified-belief norm**: Assert only what you justifiably believe (regardless of truth or knowledge).

  Both norms are consistent with the prior verdicts:
  - Case (1): Proper under both norms (knowledge and justified belief present).
  - Case (2): Improper under both norms (no knowledge, no justified belief).
  - Case (3): Improper under both norms (no knowledge, no justified belief).
  - Case (4): Improper under both norms (no knowledge; belief is not justified).

  ### Prediction for the Ford Case
  - **Ford case description**:  
    Speaker has excellent evidence that Smith owns a Ford (years of observation, registration). They assert, "Someone in my department owns a Ford." Unbeknownst to the speaker, Smith sold the car yesterday, but Jones (another colleague) bought a Ford today, making the assertion true.  
    - **Key features**:  
      - Assertion is true (Jones owns a Ford).  
      - Speaker has a justified belief (based on strong evidence for Smith).  
      - Speaker does **not know** the assertion is true (because their belief is based on Smith, who does not own a Ford; the truth relies on Jones, whom the speaker has no evidence about—classic Gettier case).  

  - **Predictions under live norms**:  
    - **Knowledge norm**: Predicts **improper**. The speaker lacks knowledge (justified true belief without knowledge due to epistemic luck).  
    - **Justified-belief norm**: Predicts **proper**. The speaker has a justified belief (strong evidence supports the belief, even though it is accidentally true via Jones).  

  The prior verdicts underdetermine the prediction because:
  - Case (1) supports that strong evidence makes an assertion proper, but it involved direct perception/knowledge.
  - Cases (3) and (4) show that lack of evidence or justification makes an assertion improper, but they do not address cases with strong evidence that is "Gettiered."
  - The Ford case introduces a Gettier scenario (justified true belief without knowledge), which splits the norms.

  ### Predicted Verdict
  Given the prominence of the knowledge norm in contemporary epistemology (especially for handling Gettier cases), and because case (4) already rejects mere belief, the philosopher friend will likely prioritize the absence of **knowledge** over the presence of justification. Thus:  
  **Predicted verdict for Ford case: Improper** (aligning with the knowledge norm).

  ### Further Case to Settle the Matter
  If the Ford case verdict underdetermines the norm (e.g., if she rules it proper, favoring justified-belief norm), the following case would cleanly settle between the knowledge norm and justified-belief norm:  
  - **Case description**:  
    A speaker has strong, undefeated evidence for a false proposition. For example:  
    - Multiple reliable witnesses (and physical traces like tire marks) confirm that a car accident occurred at noon. The speaker asserts, "There was an accident at noon."  
    - Unbeknownst to all, the witnesses were mistaken (e.g., coordinated deception or mass hallucination), and no accident occurred.  
    - *Key*: Belief is justified (strong evidence), but false.  
  - **Predictions**:  
    - **Knowledge norm**: **Improper** (assertion is unknown and false).  
    - **Justified-belief norm**: **Proper** (assertion is justifiably believed).  
  This case isolates the role of truth in the norm. If she judges it improper, she endorses the knowledge norm (or a truth-requiring variant of justified belief). If proper, she adheres to a non-factive justified-belief norm. This would resolve the ambiguity left by the Ford case.
