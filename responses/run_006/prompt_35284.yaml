  ### Decision Tree: Explanatory Commitments in the Cognitive Science of Religion

  **Opening Question (Q1):**  
  *Is the cross-cultural recurrence of religious beliefs and practices best explained as a functional adaptation (i.e., they solve adaptive problems like cooperation or group cohesion), or is it sufficiently explained by ordinary cognitive mechanisms (e.g., pattern recognition, memory biases) combined with cultural transmission?*  
  - **If ordinary cognition + cultural transmission suffices** → Proceed to **Q2**.  
  - **If functional adaptation required** → Proceed to **Q3**.  

  ---

  #### Non-Functional Path (Cognitive By-Products)
  **Q2:** *Does the spread of a minimally counterintuitive story (e.g., a watchful ancestor spirit who knows your thoughts) primarily rely on cognitive mechanisms that make such concepts memorable and transmissible, without invoking adaptive benefits?*  
  - **If yes** → **By-product account**.  
    - *Hardest commitment to discharge:* Explaining high-cost practices (e.g., asceticism) as non-adaptive side effects of cognitive mechanisms evolved for other domains.  
  - **If no** → **Fractionationist position**.  
    - *Hardest commitment to discharge:* Defending the claim that "religion" lacks any unifying cognitive or functional essence across cultures, despite surface similarities.  

  ---

  #### Functional Path (Adaptive Solutions)
  **Q3:** *Do costly religious practices (e.g., initiation rites demanding pain or resource sacrifice) primarily function as honest signals of group commitment?*  
  - **If yes** → **Costly signaling account**.  
    - *Hardest commitment to discharge:* Demonstrating that costs are not outweighed by hidden benefits (e.g., social support), undermining their role as "honest" signals.  
  - **If no** → Proceed to **Q4**.  

  **Q4:** *Did moralizing high gods (e.g., omnipotent, punitive deities) emerge historically to enforce cooperation in large-scale societies?*  
  - **If yes** → **Supernatural-punishment hypothesis (Big Gods)**.  
    - *Hardest commitment to discharge:* Establishing that belief in supernatural punishment *causes* cooperation (not vice versa) and is not a by-product of political centralization.  
  - **If no** → Proceed to **Q5**.  

  **Q5:** *Does collective ritual (e.g., synchronized dancing or chanting) primarily foster social solidarity by activating shared emotional experiences?*  
  - **If yes** → **Durkheimian ritual-solidarity account**.  
    - *Hardest commitment to discharge:* Showing that ritual-induced solidarity directly enhances group survival or fitness, independent of material benefits.  
  - **If no** → Proceed to **Q6**.  

  **Q6:** *Does religion spread through intergroup competition, where groups with religious practices outcompete others?*  
  - **If yes** → **Cultural group-selection account**.  
    - *Hardest commitment to discharge:* Proving that group-level traits (e.g., shared norms) are heritable units of selection, distinct from individual-level advantages.  
  - **If no** → **Other functional account** (e.g., cognitive niche construction).  

  ---

  ### Empty Combinations & Ambiguities
  1. **Empty Combination: By-product + "Religion is a natural kind"**  
     - **Path:** Q1 → Ordinary cognition suffices (non-functional) → Q2 → Minimally counterintuitive concepts spread via cognition (by-product) + *assumes religion is a natural kind*.  
     - **Status:** **Incoherent**. By-product theorists argue that "religious" phenomena are disparate by-products of domain-general cognition (e.g., agency detection, memory biases), which implies no unified essence. Claiming "religion" is a natural kind contradicts this core commitment.  

  2. **Ambiguous Leaves: By-product vs. Fractionationist Positions**  
     - **Problem:** The tree branches at Q2 based on the spread of minimally counterintuitive concepts, but many by-product theorists *also* deny "religion" is a natural kind (aligning with fractionationism).  
     - **Resolution Question:** *Can all cross-culturally recurrent features of "religion" be explained by a single set of cognitive mechanisms?*  
       - **If yes** → By-product account (e.g., agency detection + memory biases suffice).  
       - **If no** → Fractionationist position (e.g., "religion" bundles distinct phenomena like afterlife beliefs and rituals).  

  ---

