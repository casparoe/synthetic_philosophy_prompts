prompt: |-
  I got into a two-hour argument with a friend last night about functionalism and multiple realizability, and by the end we couldn't even agree on what we were disagreeing about. Here's the shape of it. My friend thinks the multiple realizability argument against type identity is basically dead: it got going in the 60's and 70's as an in-principle point about silicon brains and octopuses and Martian pain, but once people actually looked at the neuroscience, the alleged cases of the "same" mental state being realized by genuinely different physical kinds mostly fell apart — either the mental state wasn't really the same, or the physical stuff was being described at a different grain. I kept pushing back that this misses the point: the original argument wasn't an empirical census of actual brains. It was a modal point about what type identity commits you to, and about how we individuate mental kinds. Saying "well, there are less actual cases than we thought" doesn't touch the question of whether a silicon system or an alien with totally different chemistry could be in pain, and whether that possibility alone is enough to cause trouble for identifying pain with C-fiber firing. So now I'm not sure whether the debate has stalled because (a) the two sides are using "multiple realization" to mean different things, (b) there's a hidden disagreement about whether a modal claim can be refuted by empirical data, (c) it's really a fight about what realization is, and nobody has given a non-question-begging account of it, or (d) the question is just ill-posed.

  I want a diagnosis, not a verdict on who's right. You're a professional philosopher of mind who works on functionalism and reduction. Think carefully, and start by brainstorming a few candidate diagnoses before committing to one. What kind of disagreement is this actually — verbal, empirical, metaphysical, or a disagreement about what would count as evidence? What does each side have to say in its own best form, and where exactly does the real fault line run? And given your diagnosis, what would count as progress — a sharper definition, a new kind of case, a formal result, or dropping the question? Also, please separate what's actually settled in this literature from what's genuinely contested among people who know it; don't present a contested reading as the consensus. I don't need citations, I'll add those.
