prompt: |-
  I cover cognitive science and neighboring fields for a general-interest magazine, and I am planning a long feature on the question whether the brain is literally a computer. Before I report the piece, I want the specification of the debate rather than a survey of it: what would an adequate answer to that question have to get right in order to be more than a metaphor or a merely verbal dispute? Write the desiderata for such an answer — the cases it must handle, the distinctions it cannot collapse, the constraints from computation theory and neuroscience it must respect, and the definitional traps it must avoid — with the consideration behind each requirement. In particular, make sure to address the difference between a system's being computationally described and a system's actually computing, and whether the content of a neural computation is fixed by the system itself or assigned by an observer. Then mark which requirements are non-negotiable and which are one camp's preference, flag any subset of requirements that cannot be jointly satisfied, and identify the single requirement that most cleanly separates the main positions. Hard limit: 900 words.
reasoning: |-
  Okay, the user is a science writer for a general-interest magazine working on a feature about whether the brain is literally a computer. They need a rigorous specification of the debate's requirements rather than a survey of opinions. This is sophisticated stuff - they're clearly deeply immersed in cognitive science and want to avoid superficial takes.

  Hmm, the core challenge is framing what would make an answer "more than a metaphor." The user specifically wants desiderata covering: cases to handle, critical distinctions, constraints from both computation theory and neuroscience, and definitional traps. Two neural computation issues are explicitly highlighted: the description vs implementation gap and content assignment problem.

  I should start by establishing non-negotiable requirements first - these would be the bedrock constraints any serious position must address. The implementation criterion (Requirement 1) seems fundamental: if we call something a computer, it must actually execute computations, not just be describable by them. That's the Turing test for computationalism right there. 

  The causal structure requirement (2) follows naturally - computations aren't magic, they need physical implementation. Requirement 3 about neural plausibility keeps us grounded in real biology rather than abstract models. These three seem absolutely non-negotiable for any scientific approach.

  Then come the contested requirements where positions diverge. Requirement 4 (content assignment) is the big one - does the brain intrinsically specify what its signals represent? This cleanly separates realist views from interpretivist ones. Requirements 5 (Turing-equivalence) and 6 (multiple realizability) reveal where theorists stand on neural specificity. 

  Ah, and Requirement 7 about avoiding "mere metaphor" accusations is crucial for the user's piece - it forces positions to clarify their computational commitments. The test cases in Requirement 8 will help the user evaluate theories against concrete phenomena.

  I notice tensions between requirements 4-6 - you can't maximize all simultaneously. And Requirement 4 is definitely the main fault line. The user will need to watch for theories that try to have it both ways on content assignment - that's usually where hand-waving happens.

  The word limit is tight for this complexity. I'll prioritize conceptual clarity over examples, but must include the cerebellum case since it's such a clear computational structure. The retina example helps illustrate observer-assigned content. 

  For the conclusion, I should emphasize that Requirement 1 (implementation) is the absolute baseline - without it, we're just doing metaphor. And Requirement 4 (content) remains the brightest dividing line. The user can use these desiderata as a rubric when interviewing researchers.
answer: |-
  Here is a specification of the desiderata for an adequate answer to "Is the brain literally a computer?", prioritizing conceptual requirements over survey, with explicit considerations and classifications:

  **Core Desiderata (Non-Negotiable):**

  1.  **Implementation, Not Just Description:** An answer must distinguish between *describing* a system computationally (a useful modeling tool) and the system *implementing* computation as a fundamental causal process. **Consideration:** Many physical systems (weather, planets) can be computationally *described*; claiming the brain *is* a computer requires showing computation is causally constitutive of its operation, not just an external analysis. **Status: Non-Negotiable.** Failure collapses the debate into triviality.

  2.  **Causal Structure Constraint:** The proposed computational account must map demonstrably onto the *causal structure* and *dynamics* of neural mechanisms. **Consideration:** Computation is physically instantiated. An adequate answer must specify *how* neural properties (spikes, synapses, plasticity, network dynamics) implement the proposed computational primitives (e.g., symbols, operations, state transitions, information flow). **Status: Non-Negotiable.** Ignores neuroscience.

  3.  **Neural Plausibility:** The answer must be consistent with established, uncontroversial neuroscience facts (e.g., graded/analog signaling, massive parallelism, stochasticity, continuous neuromodulation, developmental plasticity, metabolic constraints). **Consideration:** A computational theory violating basic neural biology (e.g., requiring perfect digital silence, infinite precision, or clock-like synchronicity) fails the "literal" test. **Status: Non-Negotiable.** Grounding in reality.

  **Critical Distinctions & Content Assignment (Contested):**

  4.  **Content Assignment ("Intrinsic" vs. "Observer-Relative"):** An answer must explicitly address whether the *semantic content* (what neural signals "mean" or "represent") is fixed by the causal/functional role *within the brain system itself* (intrinsic, derived teleology) or is *assigned* by an external observer interpreting the system's function. **Consideration:** This is the core of the "literalness" dispute. If content is purely observer-assigned, calling the brain a computer risks being metaphor. If intrinsic, how is it grounded neurally? **Status: Major Fault Line.** Positions diverge sharply here (e.g., Fodorian representationalism vs. enactivist interpretation).

  5.  **Computational Equivalence & Specificity:** Must specify the relevant level/type of computation claimed (e.g., Turing-equivalent digital, analog, connectionist, dynamical systems, non-classical). **Consideration:** Claiming "computation" without specifying *what kind* (and its properties like compositionality, programmability) is vacuous. Does it require classical symbol manipulation? Is neural net learning sufficient? **Status: Contested.** Positions vary (e.g., strong vs. weak AI, dynamical systems as computation).

  6.  **Multiple Realizability & Neural Specificity:** Must address if the proposed computation *depends* on specific biological details or is *multiply realizable* in other substrates. **Consideration:** If the computation is substrate-independent, biological details become implementation details. If crucial, then "computer" might be misleading. **Status: Contested Preference.** Computationalists lean towards multiple realizability; skeptics emphasize biological constraints.

  **Avoiding Traps & Handling Cases:**

  7.  **Beyond Useful Metaphor:** The answer must articulate what *additional commitment* is made by "literally" beyond "computationally describable/analyzable/modelable". **Consideration:** Avoids the trap where "computer" is just a vague placeholder for "complex physical system." **Status: Non-Negotiable** for the debate's premise.

  8.  **Key Cases to Handle:** An adequate theory must engage with:
      *   **Low-Level Sensory Processing (e.g., Retina):** Clear signal transformation resembling engineered computation. Is this paradigmatic or exceptional?
      *   **"Messy" Cognition (e.g., Creativity, Affective Processing):** Processes less easily characterized as formal symbol manipulation.
      *   **Learning & Plasticity:** How are new "programs" acquired? Is this computational reprogramming or fundamentally different?
      *   **Consciousness:** Can a computational account (even in principle) address subjective experience? **Consideration:** A theory failing on major brain functions is inadequate. **Status: Non-Negotiable** for adequacy.

  **Constraints & Tensions:**

  *   **Computational Theory Constraint:** The proposed computational framework must satisfy formal definitions from computation theory (e.g., what constitutes a state, transition rule, input/output for that type of computation). **Consideration:** Prevents arbitrary use of computational language. **Status: Non-Negotiable.**
  *   **Neuroscience Constraint:** Cannot ignore inconvenient neural facts (massive recurrence, analog signals, noise) or dismiss them as mere "implementation noise." **Consideration:** Ensures biological grounding. **Status: Non-Negotiable.**
  *   **Definitional Trap: The "Triviality" Trap:** Must avoid defining "computation" so broadly (e.g., any physical change) that *everything* becomes a computer, rendering the claim meaningless. **Consideration:** Preserves substantive debate. **Status: Non-Negotiable.**
  *   **Tension Between Requirements 4 & 5:** Strong claims about intrinsic symbolic content (4) often require classical computation (5), which struggles with neural plausibility (3) and messy cognition (8). Connectionist/dynamical accounts handle 3 & 8 better but struggle with robust intrinsic content (4) and classical equivalence (5).
  *   **Tension Between Requirements 5 & 6:** Emphasizing neural specificity/specialization (6) can undermine claims of multiple realizability/substrate independence often associated with computationalism (5).

  **Key Separator:**

  *   **Requirement 4 (Content Assignment)** most cleanly separates the main positions:
      *   **Strong Literalists (Classical Computationalists):** Assert intrinsic, causally efficacious representational content fixed by internal functional/causal roles (often compositional symbols).
      *   **Moderate Literalists (Connectionist/Neurocomputational):** Ground content in statistical/causal relationships within networks, often seen as intrinsic to the system's function.
      *   **Skeptics/Interpretivists (Enactivists, Embodied Cognition):** Content is primarily observer-relative, assigned based on the system's behavior in an environment; computation is a useful descriptive tool, not constitutive. The brain *does computation* only metaphorically.
      *   **Eliminativists/Radical Embodiment:** Reject the usefulness of content/computation frameworks entirely for understanding cognition.

  **Summary of Classifications:**

  *   **Non-Negotiable:** 1 (Implementation), 2 (Causal Structure), 3 (Neural Plausibility), 7 (Beyond Metaphor), 8 (Key Cases), Computational Theory Constraint, Neuroscience Constraint, Triviality Trap Avoidance.
  *   **Contested (Fault Lines):** 4 (Content Assignment - *Major Separator*), 5 (Computational Specificity).
  *   **Contested Preference:** 6 (Neural Specificity vs. Multiple Realizability).
  *   **Key Tensions:** Between intrinsic content (4) & neural plausibility/messy cognition (3,8); between classical computation (5) & neural plausibility (3); between neural specificity (6) & multiple realizability (5).
