prompt: |-
  I run a small film discussion group, and we're going to talk about Million Dollar Baby. I'd like to use the ending to think through the ethics of assisted dying: Maggie is paralyzed from the neck down and asks her trainer Frankie to end her life; he struggles with his Catholic scruples and finally does it, and the film seems to present his act as a kind of love. Walk me through that final act in terms of the philosophical debate over euthanasia and assisted dying. Where does the film genuinely give the strongest considerations on each side their due — her autonomy and her suffering, the wrongness of killing, the line between letting die and actively killing, the worry that honoring a request to die can shade into giving up on someone — and where does it simplify or load the choice? Does the film commit itself to a view about whether Frankie did the right thing, or does it only make his action emotionally intelligible? I'd like concrete moments to raise with the group, and I'd also like to know what the philosophical discussion tends to flatten that the film keeps complicated. Please answer in American English.
