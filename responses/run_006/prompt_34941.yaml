  The user also mentioned the distinction between ethics and right. In Kant's framework, "Right" deals with external actions and enforceable duties, while "Ethics" concerns internal motives. The essay falls under Right, so Kant is arguing against a legal right to lie. However, his ethical writings also condemn lying absolutely. So the friend's summary isn't wrong but oversimplifies by not acknowledging this context.

