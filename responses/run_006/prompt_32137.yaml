prompt: |-
  I'm a PhD student in cognitive science and I keep coming back to the question of what makes every 'a' an 'a' — specifically the lower-case Latin letterform, not the abstract letter across cases. I've been writing down my gut calls on concrete cases and their starting to look inconsistent. Here they are: a double-storey 'a' like Times New Roman's — obviously an 'a'. A single-storey 'a' like Futura's, basically a circle with a tail — obviously an 'a'. A Cyrillic 'а' sitting in a Russian word, visually identical to that Futura 'a' — not the Latin letter 'a', so no. A Greek lower-case alpha — no. A sloppy handwritten 'a' in a note that came out looking exactly like an 'o', where the writer meant 'a' and I read it as 'a' in context — yes, that's an 'a'. A display wordmark where the 'a' is drawn as a triangle with a tail and everyone reads it as an 'a' — I want to say yes. Is there one principle that gets all of these, or close? Which of my verdicts does it force me to drop, and what does it say about the case I keep waffling on: a perfect 'a' shape formed by cracks in a sidewalk? Give me exactly five numbered points, each a sentence or two, no introduction or conclusion.
