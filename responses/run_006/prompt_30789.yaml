prompt: |-
  Here's the thing. I teach a final-year philosophy of mathematics course that spends most of its time on constructive mathematics, and every year I write the same comments on student work: 'that's a proof by contradiction, not a constructive proof of an existnce claim', 'you can't get an existential from a negated universal', 'this disjunction never says which side holds'. I'd like to hand them something better than my red pen. Turn the BHK interpretation into a checklist a student (or a referee) can actually run on a proof to decide whether it's constructive. The students have had a term of first-order logic, so symbols are fine, but they can't be assumed to know proof theory, and the checklist has to be runnable in about ten minutes on a proof of ordinary length. I want: a clause for each connective and quantifer; the order to check them in; what counts as a sufficient witness or method; where the checklist stops with a no; and where it has to hand the decision to me rather than the student because the constructive content is genuinely unclear. Then run it on three proofs: the usual classical proof that there are two irrational numbers a and b with a^b rational, an argument that derives ∃x ¬P(x) from ¬∀x P(x), and the standard proof that every bounded monotone sequence of real numbers has a limit. I expect at least one of those runs to come back with an answer I won't like — say so plainly. Be explicit about which parts of the checklist are just BHK and which parts are your own strictness added on top. And be honest about the classic way a non-constructive proof sneaks past the checklist because the offending step is hidden in an ordinary phrase like 'choose' or 'one of these must be the case', or an appeal to a classical theorem the author doesn't spell out. I don't need a bibliography or a survey of constructive schools. British English, please.
reasoning: |-
  We are going to create a constructive proof checklist based on the BHK interpretation. The BHK interpretation (Brouwer-Heyting-Kolmogorov) explains the meaning of logical connectives and quantifiers in terms of what counts as a proof of them. We'll turn this into a step-by-step checklist that a student can run on a proof to verify if it is constructive.

  ### The Checklist

  The checklist is organized by the logical structure of the statement being proved. However, since we are checking a proof (which is a sequence of steps) and not just the statement, we must check each step of the proof for constructive content.

  **General Approach**: 
  - We assume the proof is written in a standard mathematical style, with steps that may be sentences or formulas.
  - We will traverse the proof step by step, but we are especially interested in the steps that introduce logical connectives and quantifiers, and the steps that use them.
  - The checklist will focus on the critical points where non-constructive steps might occur.

  **Order of Checking**: 
  It is best to check the proof in the order it is written, but pay special attention to:
  1. The introduction of existential quantifiers (∃): we must have an explicit witness or a method to produce one.
  2. The use of disjunctions (∨): we must know which disjunct holds, or have a method to decide which one.
  3. The use of implications (→) and negations (¬): we must not use proof by contradiction to prove a positive statement.
  4. The use of universal quantifiers (∀): we must have a uniform method that works for any element in the domain.
  5. The use of conjunctions (∧): both parts must be provided.

  **Checklist Clauses**:

  For each step in the proof, we check the following:

  1. **Existential Quantifier Introduction (∃x P(x))**:
     - The proof must explicitly provide a term (a witness) `t` and a proof of `P(t)`.
     - If the witness is not explicit (e.g., "there exists x such that P(x) because if not, we'd have a contradiction"), then it fails.
     - If the existence is deduced from a disjunction or a previous existential without specifying how to get the witness, then it fails.

  2. **Disjunction (A ∨ B)**:
     - The proof must explicitly state which one holds, or provide a method to decide which one holds (and then prove the one that holds).
     - If the disjunction is used without a decision (e.g., "either A or B is true, but I don't know which, so let's consider cases") and then the rest of the proof does not work constructively in each case (i.e., the cases must be exhaustive and the conclusion must be reached in each case with constructive means), then it might be acceptable only if the cases are decidable. However, if the disjunction is not decidable, then this step is non-constructive.

  3. **Implication (A → B)**:
     - The proof must provide a method to convert a proof of A into a proof of B.
     - It cannot use the method: "assume A is false, then ... contradiction, therefore A is true" to prove B (this would be a use of double negation elimination).

  4. **Negation (¬A)**:
     - The proof of ¬A is defined as A → ⊥ (absurdity). So the proof must show that assuming A leads to a contradiction.
     - However, note: proving a negative by contradiction is acceptable in constructive mathematics. But we must be cautious: we cannot use ¬¬A → A.

  5. **Universal Quantifier (∀x P(x))**:
     - The proof must provide a method that, given any x in the domain, produces a proof of P(x). The method must be uniform.

  6. **Conjunction (A ∧ B)**:
     - The proof must provide a proof of A and a proof of B.

  7. **Biconditional (A ↔ B)**:
     - The proof must provide both A → B and B → A.

  8. **Proof by Contradiction**:
     - If the proof ends with a contradiction to prove a positive statement (like ∃x P(x) or A∨B), then it is non-constructive.
     - However, if the statement being proved is a negation (¬A), then proof by contradiction (i.e., assume A and derive ⊥) is acceptable.

  **Critical Non-Constructive Moves**:
  - **Proof of Existence by Contradiction**: Proving ∃x P(x) by assuming ¬∃x P(x) and deriving a contradiction is not allowed.
  - **Use of Undecided Disjunction**: Using a disjunction without knowing which side holds to prove an existential or a disjunction is non-constructive unless the disjunction is decidable and the proof provides a way to decide it.
  - **Double Negation Elimination**: Any step that uses ¬¬A to conclude A is non-constructive.
  - **Use of Classical Theorems**: If the proof relies on a theorem that is classically true but constructively not accepted (like the Law of Excluded Middle for an arbitrary statement, or the Axiom of Choice in an uncountable setting), then the proof is non-constructive.

  **Where the Checklist Stops**:
  - **No**: As soon as one step fails the constructive requirement, the entire proof fails and we stop.
  - **Hand to Instructor**: If the proof uses a step that is ambiguous (e.g., a "choose" that might be using choice, or an appeal to a theorem that might be constructive or not, or a disjunction that might be decidable but it's not obvious) then we flag it and hand it to the instructor.

  **Added Strictness**:
  The BHK interpretation is the basis. However, we add the following strictness:
  - Witnesses for existentials must be explicit and not depend on a non-constructive case split.
  - Disjunctions must be decidable: we require that the proof either states which disjunct holds or provides a decision procedure.

  **Common Pitfalls**:
  - The word "choose" might hide an application of the axiom of choice. If the choice is not canonical and there is no uniform way to pick, then it might be non-constructive.
  - "One of these must be the case" might be an appeal to LEM. Without a method to decide, it's non-constructive.
  - An appeal to a classical theorem without a constructive version.

  ### Running the Checklist on Three Proofs

  #### Proof 1: Classical proof that there are two irrational numbers a and b with a^b rational.

  **Classical Proof**:
  Consider the number √2. We know √2 is irrational. Now consider the number √2^√2. Either it is rational or irrational.
  Case 1: If √2^√2 is rational, then let a = √2 and b = √2. Both irrational, and a^b is rational.
  Case 2: If √2^√2 is irrational, then let a = √2^√2 and b = √2. Then a^b = (√2^√2)^√2 = √2^(√2 * √2) = √2^2 = 2, which is rational. And in this case, a is irrational (by assumption) and b is irrational.
  Therefore, in either case, we have such a and b.

  **Checklist Run**:
  1. The proof starts by considering √2 and then √2^√2. It then uses a disjunction: either √2^√2 is rational or irrational.
     - **Disjunction Check**: The disjunction is not decidable in the proof. We don't have a method to decide which case holds. The proof then proceeds by cases. However, the disjunction is an instance of LEM for an arbitrary mathematical statement (the rationality of an irrational exponentiated to an irrational). Since we don't know which case holds, and there is no decision procedure provided, this use of disjunction is non-constructive.
     - **Result**: The proof fails at the disjunction step. It is non-constructive.

  **Conclusion for Proof 1**: Non-constructive.

  #### Proof 2: Argument that derives ∃x ¬P(x) from ¬∀x P(x).

  **Classical Proof**:
  Assume ¬∀x P(x). This means that not every x satisfies P(x). Therefore, there must be some x for which P(x) fails. So we have ∃x ¬P(x).

  **Checklist Run**:
  1. The proof starts with ¬∀x P(x). By definition, this is ¬(∀x P(x)), which is equivalent to ∃x ¬P(x) in classical logic. But constructively, we cannot derive ∃x ¬P(x) from ¬∀x P(x) without a witness.
  2. The step "there must be some x for which P(x) fails" is an existential claim. 
     - **Existential Check**: The proof does not provide a witness. It only says "there must be" by classical reasoning. This is a non-constructive step because we don't have an explicit x such that ¬P(x).
     - **Result**: The proof fails at the existential introduction step. It is non-constructive.

  **Conclusion for Proof 2**: Non-constructive.

  #### Proof 3: Standard proof that every bounded monotone sequence of real numbers has a limit.

  **Classical Proof**:
  Let (a_n) be a bounded increasing sequence. Consider the set S = {a_n | n in N}. Since the sequence is bounded, S is bounded above. By the least upper bound principle, S has a least upper bound, call it L. We claim that L is the limit of the sequence.

  Proof of the claim: Let ε>0. Since L is the least upper bound, L-ε is not an upper bound. Therefore, there exists an N such that a_N > L-ε. Since the sequence is increasing, for all n≥N, we have a_n ≥ a_N > L-ε. Also, since L is an upper bound, we have a_n ≤ L for all n. Therefore, for n≥N, |a_n - L| < ε. Hence, the sequence converges to L.

  **Checklist Run**:
  1. The proof uses the least upper bound principle (LUB) for sets of real numbers. 
     - **LUB Principle**: In constructive mathematics, the LUB principle is not generally valid. However, for a bounded increasing sequence, the limit can be constructed as the supremum of the set of terms. Constructively, we can define the supremum for an increasing sequence by the Cauchy sequence of partial maxima? Actually, the set S is countable and the sequence is increasing, so we can define the limit as the supremum and compute it by a sequence of approximations. 
     - **Existential Check for L**: The proof uses the LUB principle to assert the existence of L. Constructively, we can define L by the Dedekind cut: L = { r ∈ ℚ | ∃n a_n > r } (if we are using Dedekind reals) or by a Cauchy sequence. However, the classical proof does not provide a method to compute L to arbitrary precision. It only asserts its existence by LUB.
     - **Check**: The step "by the least upper bound principle, S has a least upper bound" is a non-constructive step because the LUB principle is not constructive in general. However, for a bounded monotone sequence, the limit can be constructed as the supremum. But note: the classical proof does not construct the limit as a Cauchy sequence. It simply invokes the LUB.

     **Important**: In constructive analysis, the statement is true because we can define the limit as the supremum and then use the fact that the sequence is increasing and bounded to show that it converges. But the standard classical proof invokes the LUB principle which is non-constructive in the sense that it does not provide an algorithm to compute the limit. However, for a specific sequence of rationals (or reals given by Cauchy sequences) we can compute the supremum by an algorithm (by taking, for example, the least upper bound in the completion). 

     But note: the set S is given by a sequence, so we can define the supremum by the sequence of partial maxima? Actually, the sequence is increasing, so the supremum is just the limit of the sequence. But the proof does not construct the limit as a real number (which in constructive mathematics is given by a Cauchy sequence with a modulus of convergence). In the classical proof, the existence of L is taken as given by the LUB axiom.

     - **Verdict**: The proof uses a non-constructive principle (LUB). Therefore, it fails the constructive checklist. However, note that the statement is constructively valid and there is a constructive proof. But the classical proof as written is non-constructive.

     **Hand to Instructor?**: The issue is that the LUB principle is being used for a set that is the image of a sequence. In constructive mathematics, the monotone convergence theorem is accepted and can be proved without the full LUB by using the Cauchy sequence definition. But the classical proof does not provide the constructive content (a modulus of convergence). We would flag this as non-constructive because the existence of L is not witnessed by a Cauchy sequence. However, if the reals are defined as Dedekind cuts, then the supremum exists by construction. But in constructive mathematics, Dedekind reals and Cauchy reals are not the same: the Dedekind reals require the locatedness of cuts, which is not always available. 

     Given the complexity, we might hand this to the instructor. However, for the purpose of this checklist, we note that the proof uses the LUB principle without providing an algorithm for the limit. Therefore, we mark it as non-constructive.

  2. The rest of the proof (after defining L) is constructive: given L, the proof that the sequence converges to L is constructive. It uses the definition of supremum to find an index N for any ε>0. This part is constructive because it provides a method (for any ε, we can find N by searching for a term in the sequence greater than L-ε). However, since L itself is not constructed by a method that is explicit (it is given by an existential that is non-constructively obtained), the entire proof fails.

  **Conclusion for Proof 3**: Non-constructive (because of the use of LUB). But note: there is a constructive proof for this theorem. The checklist flags this classical proof as non-constructive.

  ### Summary of Runs:
  - Proof 1: Non-constructive (due to non-decidable disjunction).
  - Proof 2: Non-constructive (due to existential without witness).
  - Proof 3: Non-constructive (due to the use of the non-constructive LUB principle). 

  We note that Proof 3 is a classic example of a theorem that is true constructively but the standard proof is non-constructive. The checklist catches the non-constructive step.

  ### Final Note
  The checklist is strict. It flags any step that does not explicitly provide the constructive content required by BHK. However, it might be that in some contexts (like when the disjunction is decidable or when the existence can be made explicit) the proof can be salvaged. The instructor should review the cases that are ambiguous.

  We also note that the checklist does not replace understanding but provides a mechanical way to catch common non-constructive steps.
answer: |-
  Below is a constructive proof checklist based on the BHK interpretation, designed for students with first-order logic training. The checklist adds operational strictness to BHK (explicitly requiring witnesses/decision procedures and forbidding classical loopholes). **BHK core principles** are in *italics*; **added strictness** is in bold. Use this checklist linearly—start at the proof's conclusion and work backward through dependencies, checking each clause when the relevant connective/quantifier is introduced.

  ---

  ### **The Constructive Proof Checklist**
  **Order of checks**: Prioritise existential claims (∃), disjunctions (∨), and implications (→) first, as these most commonly fail. Check universal (∀), conjunction (∧), and negation (¬) last. Stop and reject the proof at the first failure.

  1. **Existential Quantifier (∃x P(x))**  
     - *BHK core*: Requires an explicit witness *t* and proof of *P(t)*.  
     - **Added strictness**:  
       - Witness *t* must be concretely constructed (e.g., a defined number, function, or object).  
       - Reject if:  
         - Witness depends on a non-constructive disjunction (e.g., "in case A, use witness *t₁*; in case B, use *t₂*" without a decision procedure).  
         - Witness is "chosen" via choice-like language (e.g., "choose *x* such that P(x)") without a uniqueness proof or explicit algorithm.  
         - Derived from ¬∀x¬P(x) (classical contradiction).  
     - **Stop with ❌ NO** if witness is missing, vague, or contradiction-derived.  
     - **Hand to instructor** if witness relies on an external theorem (check if theorem is constructively admissible).

  2. **Disjunction (A ∨ B)**  
     - *BHK core*: Requires proof of *A* or proof of *B* (with indication which).  
     - **Added strictness**:  
       - Must specify *which disjunct holds* or provide a *decision procedure* (e.g., "we compute *f(x)* to determine if A or B holds").  
       - Reject if:  
         - Uses "A ∨ B must hold" without justification (smuggled LEM).  
         - Splits cases without proving decidability (e.g., "either P or ¬P" for arbitrary *P*).  
     - **Stop with ❌ NO** if no decision method or which-disjunct indicator.  
     - **Hand to instructor** if decidability depends on a non-trivial external lemma.

  3. **Implication (A → B)**  
     - *BHK core*: Requires a method converting proof of *A* into proof of *B*.  
     - **Added strictness**:  
       - Method must avoid classical shortcuts:  
         - Reject proof-by-contradiction in *positive* positions (e.g., "assume ¬B, derive ¬A, hence B").  
         - Reject contrapositive if proving a positive *B* (e.g., "¬B → ¬A, therefore A → B").  
       - Acceptable for negative *B* (e.g., if *B = ¬C*).  
     - **Stop with ❌ NO** if uses contradiction/contrapositive to prove a positive *B*.

  4. **Universal Quantifier (∀x P(x))**  
     - *BHK core*: Requires a uniform method to build proof of *P(t)* for any *t*.  
     - **Added strictness**:  
       - Method must be explicit (e.g., "given *t*, compute *f(t)* as the proof").  
       - Reject if "let *x* be arbitrary" hides choice (e.g., "choose *x* such that ..." without uniqueness).  
     - **Hand to instructor** if method depends on an external constructive theorem.

  5. **Conjunction (A ∧ B)**  
     - *BHK core*: Requires proof of *A* and proof of *B*.  
     - **Added strictness**: None beyond BHK.  
     - **Stop with ❌ NO** if either subproof is missing.

  6. **Negation (¬A)**  
     - *BHK core*: Requires proof that *A → ⊥* (absurdity).  
     - **Added strictness**:  
       - Reject if used to prove a positive statement (e.g., "¬¬B, therefore B").  
       - Acceptable for negative goals (e.g., ¬∃, ¬∀).  
     - **Stop with ❌ NO** if ¬¬-elimination proves a positive.

  **Classical smuggling alerts**: Watch for these phrases—they often hide non-constructive steps:  
  - "Choose *x* such that P(x)": Requires uniqueness or explicit construction.  
  - "Without loss of generality": Often assumes a decidable disjunction; verify.  
  - "One of these must hold": Assumes LEM; demand a decision procedure.  
  - "By a theorem": Must verify the theorem is constructively admissible.  

  ---

  ### **Checklist Test Runs**
  #### **Proof 1: Classical proof that ∃a,b irrational (aᵇ rational)**  
  *Proof*:  
  - Let \( x = \sqrt{2}^{\sqrt{2}} \). *Either x is rational or irrational*.  
  - If rational, let \( a = b = \sqrt{2} \).  
  - If irrational, let \( a = x, b = \sqrt{2} \). Then \( a^b = (\sqrt{2}^{\sqrt{2}})^{\sqrt{2}} = \sqrt{2}^2 = 2 \) (rational).  
  - Thus, such a,b exist.  

  *Checklist run*:  
  1. **Conclusion is ∃a,b (...)** → Check **∃ clause**.  
     - Witnesses depend on disjunction: "x rational ∨ x irrational".  
  2. Check **∨ clause** for this disjunction:  
     - No witness for which disjunct holds.  
     - No decision procedure provided (proving \( \sqrt{2}^{\sqrt{2}} \) irrational is open).  
     - **❌ NO** (fails disjunction check).  
     - *Non-constructive step*: Undecided disjunction used to manufacture witnesses.  

  *Verdict*: ❌ Rejected.  

  ---

  #### **Proof 2: Deriving ∃x ¬P(x) from ¬∀x P(x)**  
  *Proof*:  
  - Assume ¬∀x P(x).  
  - *If no x satisfies ¬P(x), then all x satisfy P(x)*, contradicting ¬∀x P(x).  
  - Thus, ∃x ¬P(x).  

  *Checklist run*:  
  1. **Conclusion is ∃x ¬P(x)** → Check **∃ clause**.  
     - Witness for x is missing.  
     - Proof derives existence from contradiction: "assume ¬∃x ¬P(x), get contradiction".  
     - **❌ NO** (fails ∃ clause: witness from contradiction).  

  *Verdict*: ❌ Rejected.  

  ---

  #### **Proof 3: Classical proof that monotone bounded sequences converge**  
  *Proof*:  
  - Let S be the set of sequence terms. S is non-empty and bounded, *so it has a least upper bound L* (by completeness).  
  - For arbitrary ε > 0, since L is supremum, ∃N (L - ε < a_N ≤ L).  
  - By monotonicity, ∀n≥N (|a_n - L| < ε).  
  - Thus, a_n → L.  

  *Checklist run*:  
  1. **Conclusion is ∀ sequences (...) ∃ limit L** → First check **∃L clause** (innermost quantifier).  
     - Witness L is the supremum of S.  
     - Supremum derived from completeness axiom (non-constructive).  
     - **Hand to instructor**: Completeness is classically but not constructively valid. Constructive versions require locating the supremum (e.g., with a modulus of convergence), absent here.  
     - *Non-constructive step*: "S has a least upper bound" assumes a classical axiom.  

  *Verdict*: ⚠️ Hand to instructor.  
  - *Instructor note*: The proof fails constructively. A constructive version requires building a Cauchy sequence with an explicit modulus of convergence.  

  ---

  ### **Conclusion**
  - **What you won't like**: Proof 3 is rejected (as expected) due to classical completeness.  
  - **Why strictness matters**: The checklist catches:  
    - Proof 1’s disjunction ("either x rational or not") as non-constructive without a decision method.  
    - Proof 2’s contradiction-based existence.  
    - Proof 3’s use of a classical theorem (completeness).  
  - **Evasion tactics**: Non-constructive steps hide in "choose" (Proof 3’s supremum selection), "must be the case" (Proof 2’s existence), and unvetted theorems.  

  This checklist forces students to justify witnesses and decisions at each step. For ambiguous cases (e.g., external theorems), it flags instructor review—keeping marking efficient while teaching precision.
