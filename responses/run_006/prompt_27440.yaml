  Okay, let me start by unpacking this user's situation. He's a journalist covering global development, so he's deeply familiar with cost-effectiveness metrics like GiveWell's analyses. The core conflict is personal: he has $5,000 set aside for home repairs but is torn because that same amount could save a child's life through proven interventions. His partner argues that their immediate responsibility is to their own household, and that taking on global suffering is unsustainable.

  First, I need to recognize the emotional weight here. This isn't just an abstract ethical debate for him—it's a real decision keeping him up at night. His expertise makes it harder because he can't unsee the numbers. The partner's pragmatic concerns about burnout and proximity morality add layers to his guilt.

  The user's phrasing suggests he's already intellectually convinced by effective altruism (EA) principles but is hitting emotional and relational barriers. When he says "it's gotten under my skin," that signals a shift from professional knowledge to personal moral reckoning. His partner's "statistical lives" comment shows this is also about differing intuitions on moral proximity.

  I should avoid preaching EA dogma since he knows it well. Instead, I'll acknowledge the tension between the math and human psychology. The neighbor vs. distant child analogy is key here—it's a classic proximity bias example. I can reference Singer's drowning child thought experiment while admitting its emotional limitations.

  The sustainability concern is valid. If he donates once and burns out, that helps no one long-term. I'll suggest a middle path: partial donation with structured giving. Maybe $1k to AMF now and a small recurring donation? That addresses both his guilt and his partner's worry about overextension.

  His house foundation isn't frivolous—it's a real need affecting his family's safety and finances. Ignoring it might breed resentment. I should validate that as morally legitimate self-interest, not weakness. The "moral licensing" trap (fixing foundation guilt-free after donating) is worth mentioning too.

  The partner's role is crucial. If he donates against her wishes, it could harm their relationship and future giving capacity. Maybe frame this as "we" decisions rather than "I." Suggest discussing percentages (e.g., 5% of savings) instead of all-or-nothing sums.

  Ultimately he needs to balance three things: helping others effectively, maintaining his own well-being, and honoring his relationships. No perfect answer exists, but I can help him find a sustainable equilibrium where he doesn't abandon either his values or his life.
answer: |-
  This is one of the most profound and unsettling moral dilemmas of our interconnected world. You’re wrestling with core questions philosophers like Peter Singer (with his "drowning child" thought experiment) have grappled with for decades: *What do we owe to strangers? And how much can we reasonably sacrifice?* Your partner’s points are deeply human and valid, yet your unease reveals a tension that won’t resolve easily. Here’s how to break it down:

  **1. Acknowledging the Validity of Both Perspectives:**

  *   **Your Perspective (The Math & Moral Pull):**
      *   **The Numbers Are Real:** $5,000 *can* demonstrably save a life through rigorously vetted interventions. Ignoring that knowledge feels like walking past a drowning child because they’re in a different pond.
      *   **Moral Significance vs. Proximity:** You intuit that physical distance doesn't erase moral obligation. A child dying preventable death has inherent value, regardless of location.
      *   **Privilege & Responsibility:** Your awareness of global inequity, combined with your relative privilege, creates a sense of responsibility. *Not* acting feels complicit in the injustice the math reveals.
  *   **Your Partner's Perspective (Sustainability & Proximity):**
      *   **Burnout is Real:** Pouring *every* spare dollar into distant causes *is* unsustainable. Emotional exhaustion, resentment, and financial instability *will* occur, likely ending all giving.
      *   **Proximity Matters (Emotionally & Practically):** We’re wired to respond more viscerally to immediate, visible need. Helping your neighbor *feels* different, and maintaining your own home foundation *is* a legitimate responsibility impacting your safety, finances, and well-being.
      *   **Limited Personal Causation:** You didn't create malaria or poverty. Feeling *solely* responsible for solving systemic global problems is paralyzing and inaccurate.
      *   **Self-Care Isn't Selfish:** Ensuring your own stability (a safe home, financial security, mental well-being) isn't a luxury; it's the foundation from which sustained compassion and action can flow.

  **2. The False Binary: It Doesn't Have to Be All or Nothing**

  This is the critical insight. Framing it as "$5k for the foundation OR $5k to save a life" creates unnecessary anguish and ignores the spectrum of possibilities:

  *   **Partial Allocation:** Could you allocate *part* of the $5k to effective giving and part to the foundation? Even $1,000 donated effectively does immense good (e.g., ~200 bednets protecting ~400 people for 3+ years). This honors both impulses.
  *   **Structured Giving:** Commit to a smaller, sustainable amount *regularly* (e.g., $50/$100/$200 per month) to an effective charity. This builds giving into your budget, avoids burnout, and creates long-term impact far exceeding a one-time $5k donation. This addresses your partner’s sustainability concern directly.
  *   **Phased Approach:** Fix the foundation *now* (a legitimate need), but consciously commit to scaling up your effective giving significantly in the near future. Create a concrete plan: "Once the foundation is done (June), I'll start donating X% of my income/month to GiveWell top charities."
  *   **Explore "Leverage" in Your Work:** As a journalist, your $5k might save one life. But a powerful piece you write on cost-effectiveness, informed by this internal struggle, could inspire hundreds or thousands of others to give, multiplying the impact far beyond $5k. Could this "house foundation vs. human foundation" tension *be* the core of your piece?

  **3. Navigating the Discomfort & Guilt:**

  *   **Guilt as a Signal, Not a Master:** Your guilt isn't irrational; it signals a conflict between your values (saving lives is paramount) and your actions (prioritizing home repair). This doesn't mean you *must* capitulate entirely to the guilt, but it shouldn't be ignored. Use it to motivate a *sustainable* solution, not a one-off sacrifice that breeds resentment.
  *   **Avoid "Moral Licensing":** Don’t let the *thought* of future giving absolve you of taking any concrete action *now*. A small, immediate step (even $100) is more honest and impactful than a grand future plan that never materializes.
  *   **Accept the Imperfection:** There's no perfect, painless solution that simultaneously maximizes global good, personal comfort, and relational harmony. Accepting that some friction and discomfort remain is part of living ethically in an unjust world. You are not failing if you fix your foundation; you *are* failing if you ignore the dilemma entirely.

  **4. Practical Steps Forward:**

  1.  **Talk to Your Partner (Again):** Frame it not as "I need to give away $5k," but as "This tension is real for me, and I need to find a way to act on my values *without* undermining our stability or burning out. How can we find a middle path we can both live with sustainably?" Discuss options like structured, budgeted giving.
  2.  **Calculate Impact:** Use GiveWell's donation calculator. See what even $500 or $1,000 achieves. This makes the trade-off tangible and less abstract than "saving a life."
  3.  **Make a Concrete, Sustainable Plan:**
      *   **Option A (Partial):** "We'll allocate $X to the foundation and $Y to effective giving this time."
      *   **Option B (Recurring):** "We'll fix the foundation fully now, but starting next month, we set up an automatic $Z/month donation."
      *   **Option C (Phased):** "Foundation now. Then, starting in [Month], we'll donate W% of our disposable income." *Define W concretely.*
  4.  **Execute & Acknowledge:** Whichever path you choose, *do it*. If you donate, acknowledge the good done. If you fix the foundation, acknowledge the legitimate need met, and perhaps recommit to your giving plan. Avoid ruminating after the decision is made.

  **Conclusion: Balancing the Scales**

  The math is stark, but humans aren't calculators. Your partner is right that unsustainable sacrifice helps no one long-term. *You* are right that ignoring demonstrable, cost-effective ways to save lives when you have the means feels morally hollow. The path forward isn't found in absolutes, but in finding a **sustainable, intentional balance**:

  *   **Acknowledge** the legitimacy of your home's needs and your partner's concerns about sustainability and proximity.
  *   **Honor** the moral pull of the evidence by committing to **concrete, sustained, effective giving** at a level you can realistically maintain.
  *   **Reject** the false choice between "fix everything for strangers" and "ignore the suffering." Choose the middle path of **meaningful contribution without self-destruction**.

  Fixing your foundation doesn't make you a bad person. Ignoring the potential of your resources to alleviate suffering entirely *would* create a moral dissonance you clearly feel. The answer lies in integrating global responsibility into your life in a way that lasts, not in a single, painful gesture. Start smaller, start sustainably, but start. That honors both your values and your reality.
