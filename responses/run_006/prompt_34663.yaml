prompt: |-
  I'm trying to figure out what I actually think about moral testimony — the practice of forming a moral view on the basis of what someone else tells me, rather than by working the moral question through myself. I've collected my gut reactions to a set of cases, and I'd like to know whether there is a single principle behind them, or whether some of them have to go. When a friend who has looked into it tells me that a certain café pays below the legal minimum wage, and I stop going there, I take that to be fine, since I am accepting her word only about the wage facts and drawing the moral conclusion myself. When a colleague announces, without offering any argument, that tipping is exploitative, and I find myself agreeing simply because I trust his judgment, that feels wrong, as if I have outsourced a moral view. When my partner tells me I was unfair in a family dispute, and I do not see it but accept it because she knows the people and the history better than I do, I think that is fine, even admirable. When I was a child and accepted my parents' view that cruelty to animals is wrong, that also seems fine, and not merely excusable on grounds of immaturity. When a junior doctor accepts a senior physician's judgment that continuing a treatment would be unethical, and withholds it, I think that is fine. When I am on a hiring committee, unsure whether a remark in an interview was sexist, and the rest of the committee, whose judgment I respect, all conclude that it was, I go along with them; I think this is fine, though it leaves me uneasy. When I read an essay defending the wrongness of the death penalty, cannot follow the argument, but still adopt the conclusion because the author is an eminent philosopher, that feels wrong. And when I discover that nearly everyone I admire favors a heavy tax on inherited wealth, and I shift my view to match theirs without having thought through the arguments, that also feels wrong, perhaps worse than the colleague case.

  My tentative principle is something like this: it is acceptable to take over the non-moral facts on which a moral judgment rests, and acceptable to defer within relationships or roles in which the other person has better access to the relevant particulars, but it is not acceptable to adopt a moral verdict wholesale from someone I am treating as a moral expert. I can already see this wobbling, since the partner case and the doctor case look like wholesale deference, while the philosopher case looks like a refusal of the very expertise I allow in the doctor case. Is there a principle that gets all eight verdicts, or nearly all of them, and which of my verdicts does it force me to revise? And what does the resulting principle say about the case I keep going back and forth on: a close friend tells me that a mutual acquaintance did something unforgivable at a party I did not attend, and I accept that verdict on her say-so?
reasoning: |-
  Okay, the user is really diving deep into the ethics of moral testimony. They've laid out eight different scenarios where they either accept or reject relying on someone else's moral judgment. Their main struggle is figuring out a consistent principle that explains all their gut reactions without contradictions. Let me start by unpacking each case they mentioned.

  First, they're fine with taking factual claims from others but drawing their own moral conclusions, like the café wages. Then they feel uneasy when deferring to a colleague's moral judgment without reasons, like the tipping example. But why is it okay when their partner points out unfairness in a family dispute? That seems similar to the colleague case, but they see it as acceptable. Then there's childhood acceptance of parents' views, which they justify despite seeming like wholesale deference. The junior doctor case is another approval, deferring to a senior's ethical judgment. The hiring committee scenario makes them uneasy but they still go along. But deferring to a philosopher's conclusion without understanding the argument feels wrong, as does shifting views to match admired people on inheritance tax.

  Their tentative principle involves deferring on non-moral facts or within relationships/roles, but not to moral experts. The problem they see is the partner and doctor cases seem like wholesale deference, similar to the philosopher case, yet they're treated differently. So the contradiction needs resolving.

  I recall some philosophical concepts here. Moral testimony debates often involve epistemic and autonomy concerns. Sarah McGrath's work distinguishes between acting on testimony versus forming beliefs. Maybe the user's cases vary in whether they're about belief or action. Also, relationships and roles matter—like the partner knowing family history better, or the senior doctor's experience. That could explain why deferring in those contexts is different from trusting a philosopher's abstract argument.

  The user's unease in the hiring committee case might stem from group dynamics versus individual expertise. The inheritance tax scenario involves conforming to a group without thought, which feels like abdicating moral responsibility. The mutual acquaintance case is tricky. If the friend has firsthand knowledge and the user trusts their judgment based on past reliability, maybe it's acceptable. But if it's just taking their word without context, it might feel like outsourcing.

  So the refined principle could combine epistemic dependence in specific contexts (relationships, roles) with the requirement to engage intellectually when possible. Cases where the testifier has better access to particulars (family dynamics, medical context) justify deference, whereas abstract moral expertise doesn't. The philosopher case fails because the user doesn't engage with the reasoning, even if the philosopher is an expert. The inheritance tax case lacks specific relationship or role, making it mere conformity.

  The mutual acquaintance case hinges on the friend's access to particulars (being at the party) and the existing relationship. If the user trusts the friend's judgment based on shared values and firsthand knowledge, it might align with the doctor or partner cases. But if it's a one-off without deeper context, it might feel like the colleague scenario. The user needs to assess whether this is role-based trust or blind deference.
answer: |-
  Based on your cases and your insightful analysis, there *is* a coherent principle that aligns with nearly all your judgments, resolving the wobble around expertise. Your discomfort often stems from **epistemic outsourcing** – adopting a moral belief *without engaging with the relevant reasons* when you *could and should*.

  Here's the refined principle:

  **It is acceptable to defer to another's moral judgment when (a) their epistemic position regarding the *salient particulars* is significantly better than yours *and* (b) this deference occurs within a context of trust, relationship, or role that justifies reliance on their perception/interpretation. It is unacceptable to defer to another's moral judgment as a substitute for engaging with the underlying reasons when the judgment depends primarily on *general moral principles* or *abstract reasoning* accessible to you, or when deference functions as epistemic laziness.**

  **Applying the Principle to Your Cases:**

  1.  **Café Wages (Fine):** You defer only on the *non-moral fact* (wages). You draw the moral conclusion yourself. *(No moral deference needed).*
  2.  **Tipping is Exploitative (Wrong):** Your colleague offers no argument. You adopt a *general moral conclusion* ("exploitative") based solely on trust in their judgment, bypassing engagement with the *reasons* why tipping might be exploitative. This is pure epistemic outsourcing. *(Violates principle: Requires reasoning about a general moral concept, accessible to you).*
  3.  **Partner on Family Dispute (Fine/Admirable):** Your partner has vastly superior access to the *salient particulars* (people involved, history, nuances of the interaction) which are crucial for judging fairness in *this specific* context. Your deference is justified by her unique epistemic position and your relationship-based trust in her perception. *(Meets principle a & b).*
  4.  **Parents on Animal Cruelty (Fine):** As a child, you lack the cognitive development and experience to grasp the *reasons* underlying the wrongness (suffering, sentience, moral standing). Your parents are your essential guides to these *general moral principles* during your formative years. Deference is necessary due to your deficient epistemic position. *(Special case: Immaturity creates a deficient epistemic position regarding the salient particulars (reasons/experience of morality itself), justifying deference).*
  5.  **Junior Doctor (Fine):** The senior physician has superior knowledge of the *salient particulars* – the patient's specific condition, prognosis, likely effects of treatment, patient's values (if known), complex medical ethics guidelines, and institutional context. The junior defers within a defined hierarchical *role* where experience with these complex *particulars* is paramount. *(Meets principle a & b: Salient particulars + role context).*
  6.  **Hiring Committee (Fine, but Uneasy):** The committee members likely have diverse perspectives and discussed the *salient particulars* (the remark, context, tone, candidate's record) which you may have missed or interpreted differently. Deferring to their collective judgment, formed through deliberation about these *particulars*, is reasonable within the committee *role*. Your unease reflects a healthy awareness that you *should* strive to understand the particulars yourself. *(Meets principle a & b: Salient particulars + role context, explains unease).*
  7.  **Philosopher on Death Penalty (Wrong):** The author's expertise lies in *abstract moral reasoning* and argumentation. *You* are capable of engaging with this reasoning (even if difficult) but choose not to, deferring to their authority on the *general moral conclusion*. This is outsourcing the intellectual work you *should* do. *(Violates principle: Requires reasoning about general principles, accessible to you).*
  8.  **Admired People on Inheritance Tax (Wrong):** Shifting your view solely because others hold it, without engaging with the *reasons* (arguments about fairness, equality, economic effects, property rights), is pure conformity and epistemic laziness. It bypasses engagement with the *reasons* underlying a complex socio-moral issue. *(Violates principle: Requires reasoning about general principles/consequences, accessible to you; pure outsourcing).*

  **Resolving the Expertise Wobble:** Your intuition is correct. The key difference isn't expertise *per se*, but **the nature of what the expertise provides access to**.
  *   In the **Doctor/Partner/Committee** cases: The "expertise" provides privileged access to **complex, context-specific particulars** crucial for *applying* moral principles to a concrete situation. Deference targets the *interpretation of the situation* based on those particulars.
  *   In the **Philosopher** case: The expertise lies in **abstract reasoning and argumentation**. Deference targets the *moral conclusion itself*, bypassing the reasoning process.
  *   In the **Colleague/Admired People** cases: There's often *no* claimed expertise tied to salient particulars; deference targets the *conclusion* directly.

  **The Mutual Acquaintance Case:**
  *   **If your close friend was present at the party and witnessed the event directly:** She has privileged access to the **salient particulars** – the specific actions, context, tone, and impact of the mutual acquaintance's behavior. Your trust in her judgment, based on your relationship and her direct observation, justifies accepting her verdict ("unforgivable") as her reasonable interpretation of those complex *particulars* (similar to Partner/Doctor cases). The "unforgivable" label is the *application* of a moral principle to observed particulars.
  *   **If your close friend is relaying hearsay or offering a summary judgment without being present:** This moves closer to the problematic cases. You'd be deferring to her *evaluation* without her necessarily having significantly better access to the crucial *particulars* than you could get (e.g., by asking others or the acquaintance). It risks becoming like the Colleague case – adopting a verdict without engaging with the underlying reasons or facts.

  **Conclusion:** Your revised principle holds strong for 7 of your 8 cases. The only case requiring minor nuance is the childhood case, justified by developmental limitations creating a deficient epistemic position. The principle successfully distinguishes between legitimate reliance on others for access to crucial context/particulars and illegitimate outsourcing of moral reasoning itself. For the mutual acquaintance, deference is justified only if your friend's judgment is based on direct access to the salient particulars of the event.
