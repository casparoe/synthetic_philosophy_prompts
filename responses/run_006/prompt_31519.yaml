prompt: |-
  I've been volunteering at a natural history museum, helping sort a backlog of specimens and artifacts, and I keep having to decide whether the stuff in a tray is one object or many. It's made me realize I have strong but weirdly specific intuitions about when a bunch of things compose a further thing — the special composition question — and I want to know what principle, if any, is behind them.

  Here are my verdicts.

  A hammer, handle and head firmly attached: one object. The same handle and head lying seperately on a workbench: two objects, no third thing.

  A pile of sand: one object. The same grains scattered by wind across a mile of beach: no object, just many grains.

  A living cat: one object, and its molecules are parts of it. The same cat a day after it died: still one object — the corpse is a thing. The ashes after cremation, scattered: no object.

  A rock: one object. A rock and the moon: two objects, no scattered object composed of both. But the solar system — sun, planets, moons, asteroids — I want to say is one object, which feels like it contradicts the rock-and-moon verdict and I cant say why.

  A deck of 52 playing cards, stacked in its box: one object. The same 52 cards mixed into a shoebox with 500 other cards: no object composed of just those 52.

  Two people holding hands: no object composed of the two of them.

  I know the big positions: universalism says any things whatsoever compose something, nihilism says there are no composite objects at all. Both feel crazy to me, so I'm clearly a restricted-composition person. But restricted by what? My verdicts don't obviously line up with only living things (the corpse bothers that), or with causal integration (the pile of sand bothers that), or with parts arranged to serve a function (the rock bothers that). My working hunch is something about the parts being arranged so they interact in a stable way, but the pile of sand and the rock-and-moon both cause trouble for that too.

  What principle, or small set of candidate principles, best captures these verdicts? Which of my verdicts does it force me to give up? And what does it say about cases I haven't made up my mind on: a forest, a swarm of bees, a mosaic on a wall, the letters that spell a word on a page?
reasoning: |-
  Okay, the user is volunteering at a natural history museum and dealing with the philosophical problem of composition—when do multiple things form a single object? They've shared specific intuitions about various scenarios and are looking for a principle that explains these judgments. They've already considered and rejected some standard positions like universalism and nihilism, as well as criteria like life, causal integration, or function.

  Looking at their examples... The hammer is one object when assembled but two when separate. Pile of sand is one, scattered grains aren't. A living cat is one object, the corpse remains one, but ashes scattered aren't. The rock is one object, rock-and-moon are two, but solar system is one—this seems contradictory to them. A deck of cards in its box is one object, but mixed with others it's not. Two people holding hands don't form a new object.

  They mention a hunch about stable interactions, but note problems with sand piles and rock-moon cases. Their examples challenge simple criteria: corpses aren't living but still count as objects, piles of sand lack tight integration but are considered single objects, rocks have no function but are objects.

  The key tension seems to be between the solar system as one object versus rock-and-moon as two. Why is one considered an object and not the other? The solar system is gravitationally bound and has a predictable structure, while the rock and moon are just two separate objects without any significant interaction beyond gravity, which everything has. But gravity alone might be too weak to count as binding for composition.

  Functional criteria don't work for rocks or sand piles. Causal integration is too vague—how much is needed? The sand pile has grains touching and friction, but scattered grains don't. The deck of cards in a box has spatial organization and containment, which is lost when mixed. The cat's body maintains structural integrity even after death until decomposition starts. The corpse is still a cohesive unit. Ashes scattered lack that cohesion.

  For the cases they're unsure about: forests, bee swarms, mosaics, letters spelling a word. A forest might be a collection of trees unless seen as an ecosystem. Bee swarms act collectively but individuals are distinct. Mosaics are one artwork due to arrangement, but tiles alone aren't. Letters form a word based on semantic arrangement.

  The deeper need here might be understanding how humans cognitively group objects. Psychological factors like Gestalt principles (proximity, continuity, closure) could play a role. Also, teleological aspects—things serving a purpose together, like the deck of cards for games. But rocks don't serve a purpose, so maybe it's about human designation in context. In a museum, artifacts are grouped based on intended use or provenance, which might influence their judgments.

  They might also be seeking a practical guideline for their volunteer work. Knowing that context matters—how items are presented or intended to be used. The museum's cataloging system probably has conventions about what counts as one object. Recognizing that their intuitions align with conventional or contextual boundaries rather than strict metaphysical criteria.

  Potential principles: Cohesion (physical sticking together), functional unity (serving a common purpose), human intention (how we designate them), or conventional boundaries (social or contextual agreements). But each has counterexamples. Cohesion: sand pile isn't stuck but still one object. Functional unity: rocks don't have a function. Human intention: solar system is one regardless of human designation.

  Perhaps a hybrid approach: spatial proximity combined with minimal interaction (friction, containment) for inanimate objects, plus life for organisms, and intentional design for artifacts. But the solar system is tricky. Maybe large-scale structures bound by gravity are considered objects in astronomy, so domain-specific criteria apply.

  In summary, their intuitions might stem from a combination of cohesion, stability, and human relevance. They might need to accept that "object" is context-dependent and not metaphysically absolute. For museum work, following institutional guidelines while understanding the philosophical tensions could be the way forward. The principle isn't monolithic but a cluster of factors that vary by case.
answer: |-
  Based on your detailed intuitions ("verdicts"), your position leans towards **moderate restricted composition**, rejecting both universalism and nihilism. Your core intuition seems to be **functional cohesion within a stable spatial boundary**, heavily influenced by **human purposes and contextual designation**. This isn't a single, perfect principle but a cluster of related factors working together.

  ### The Proposed Principle(s)
  Here's a framework that best captures your verdicts, combining elements from metaphysics, cognitive science, and pragmatics:

  1.  **Functional Cohesion:** Parts compose an object if they are arranged such that they *collectively enable a stable function or role* that the parts alone cannot achieve *and* this arrangement is non-accidental.
  2.  **Stable Spatial Integrity:** The arrangement must create a relatively stable, bounded spatial unit that resists casual disintegration (e.g., gravity, mild forces) *in its context*.
  3.  **Contextual Designation:** The grouping must be recognized as a unit *within a relevant human practice or context* (e.g., artifact use, biological classification, geological formation, astronomical system). This explains why seemingly arbitrary boundaries (like a pile of sand) are accepted.

  ### How This Explains Your Verdicts

  *   **Hammer (attached):** Functional cohesion (driving nails), stable spatial integrity (parts bound), contextual designation (it's *a tool*).
  *   **Hammer parts (separate):** Lacks functional cohesion (can't drive nails together now), lacks stable spatial integrity (easily separated further), no contextual designation as *one thing* on the workbench.
  *   **Pile of sand:** Functional cohesion (e.g., providing a surface, being moved as bulk material), stable spatial integrity (gravity/friction hold it as a mound shape against mild disturbance), contextual designation (we treat piles as units).
  *   **Scattered sand grains:** Lacks functional cohesion (no collective function), lacks stable spatial integrity (no defined boundary), no contextual designation as one thing.
  *   **Living cat:** Strong functional cohesion (biological organism), strong stable spatial integrity (skin boundary), clear contextual designation (biological individual).
  *   **Dead cat (corpse):** *Functional cohesion is weakened but not gone* (it can still be studied *as a corpse*, has anatomical structure; it's *functionally* a corpse). Stable spatial integrity remains (skin boundary). Strong contextual designation (it's *the cat's body*, a distinct biological entity).
  *   **Ashes (scattered):** No functional cohesion (no collective role), no stable spatial integrity (no boundary), no contextual designation as one thing (just remains).
  *   **Rock:** Functional cohesion is minimal but present *as a geological unit* (e.g., being thrown, used as a paperweight). Stable spatial integrity (crystal/cement bonds). Contextual designation (a rock is a standard geological object).
  *   **Rock and Moon:** Lacks functional cohesion (no collective function beyond mutual gravity). Lacks stable spatial integrity *as a unit* (vast separation, no cohesive boundary). No contextual designation (we don't treat randomly paired celestial bodies as one object).
  *   **Solar System:** **Functional cohesion exists astronomically:** Parts gravitationally bound in a stable, hierarchical structure performing the "function" of an orbital system. **Stable spatial integrity exists astronomically:** Defined by the Sun's gravitational dominance creating a relatively bounded region. **Strong contextual designation:** It's a fundamental unit of astronomy ("the Solar System").
  *   **Deck in box:** Functional cohesion (used as a unit for games), stable spatial integrity (contained in box, stacked), strong contextual designation (a deck of cards).
  *   **52 cards mixed:** Lacks functional cohesion (can't function as a playable deck), lacks stable spatial integrity (not contained or arranged), lacks contextual designation as *one thing* (just some cards).
  *   **Two people holding hands:** Lacks functional cohesion (no stable collective function beyond the momentary act). Lacks stable spatial integrity (easily broken). No contextual designation (we don't call this a new object).

  ### Where This Principle Might Force You to Give Up (or Refine) a Verdict

  1.  **The Solar System vs. Rock-and-Moon:** This is the **biggest tension**. Your intuition that the Solar System is one object pushes *hard* against the rock-and-moon verdict under strict spatial integrity. The principle forces you to:
      *   **Acknowledge Scale/Context:** Accept that "stable spatial integrity" and "functional cohesion" operate differently at astronomical scales. Gravitational binding *is* the relevant cohesive force, and the Hill Sphere *is* the relevant boundary in that context.
      *   **Clarify "Function":** Accept that in natural systems, "function" might mean "stable, law-governed behavior of a system" (orbiting) rather than human-centric purpose. The Solar System *functions* as a system governed by gravity.
      *   **Consequence:** You might need to slightly weaken the "human purpose" aspect of functional cohesion for natural, large-scale systems, emphasizing stable systemic behavior instead. This doesn't force you to accept *every* scattered object (like rock-and-moon), as they lack the *systemic* stability and defined boundary of a solar system.

  ### Applying the Principle to Your Unsure Cases

  *   **A Forest:**
      *   **Functional Cohesion?** Weak biologically (trees compete), stronger ecologically (as an interdependent ecosystem for nutrient cycling, habitat). Stronger as a *landscape unit*.
      *   **Stable Spatial Integrity?** Yes, relatively bounded geographical area.
      *   **Contextual Designation?** Very strong ("Sherwood Forest").
      *   **Verdict:** **Likely one object (a forest)** under this principle, especially in a museum/natural history context where it's treated as a unit. It passes the "pile of sand" test scaled up.

  *   **A Swarm of Bees:**
      *   **Functional Cohesion?** Very strong collective function (thermoregulation, defense, finding new nest sites) emergent from individual behaviors. A superorganism.
      *   **Stable Spatial Integrity?** Yes, the swarm maintains a coherent, dynamic shape (cloud) with a boundary.
      *   **Contextual Designation?** Strong ("a swarm of bees" is treated as a distinct entity).
      *   **Verdict:** **One object (a swarm)**. It has stronger cohesion/integrity than two people holding hands. It behaves as a unit.

  *   **A Mosaic on a Wall:**
      *   **Functional Cohesion?** Strong (collectively form an image/decoration).
      *   **Stable Spatial Integrity?** Very strong (fixed in place, grouted).
      *   **Contextual Designation?** Very strong (it's *the mosaic*, an artwork).
      *   **Verdict:** **One object (the mosaic)**. Like the deck in the box, the arrangement and fixed bonding create the unified object.

  *   **The Letters that Spell a Word on a Page:**
      *   **Functional Cohesion?** Strong (collectively represent a word/semantic unit).
      *   **Stable Spatial Integrity?** Strong (fixed on the page in a specific sequence).
      *   **Contextual Designation?** Strong ("the word 'cat'" is a recognized linguistic unit).
      *   **Verdict:** **One object (the word-token)**. While composed of letters, the specific arrangement for meaning makes it a distinct unit, like the mosaic tiles forming an image. (Contrast with random letters scattered on a page).

  ### Conclusion

  Your intuitions are remarkably consistent with a **contextually sensitive principle of functional cohesion and stable spatial integrity**. Objects are unified when their parts are stably arranged (physically or dynamically) to collectively *do* something or *be* something recognizable within a human practice (tools, biology, geology, astronomy, games, art, language), forming a bounded whole resistant to casual disintegration.

  *   **Strength:** Explains why artifacts (hammer, deck), organisms (cat, corpse), stable aggregates (pile, rock), and designated systems (Solar System) count, while accidental gatherings (scattered grains/cards/ashes, momentary hand-holding) and arbitrary pairs (rock & moon) do not.
  *   **Cost:** Requires accepting that "function" and "boundary" are context-dependent (especially for the Solar System). It leans towards conventionalism (human designation matters) but is grounded in objective features like stability and collective behavior.
  *   **Museum Relevance:** This principle aligns well with museological practice! Objects are cataloged based on functional unity (a tool, a specimen), stable form (a fossil, a rock), and contextual significance (a collection, a named artwork), not just arbitrary collections of atoms. Trust your intuitions – they reflect how humans naturally parse the world into meaningful wholes.
