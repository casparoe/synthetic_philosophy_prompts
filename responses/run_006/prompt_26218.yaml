answer: |-
  This is a brilliantly observed phenomenon, and you're right that it lacks a single, universally accepted name, despite being well-documented. It sits at the intersection of cognitive psychology, aesthetics, and the philosophy of perception. Here's a breakdown of the relevant concepts and potential labels:

  1.  **Confirmation Bias (Specific Manifestation):**
      *   **How it fits:** Once we learn the "truth" (it's a forgery), we selectively reinterpret past sensory data and memories to align with this new belief. We actively seek out features that confirm the new status ("Ah, yes, now I *see* how wooden it is!") and downplay or reinterpret features that contradict it ("I thought the color was vibrant, but now I realize it's garish").
      *   **How it differs:** Standard confirmation bias is often about seeking *new* information that confirms an *existing* belief. This is **retrospective confirmation bias** or **hindsight-driven reinterpretation**, where the *new belief* actively reshapes the interpretation of *past sensory experiences and memories*. The key difference is the profound *perceptual* and *mnemonic* shift, not just a judgment shift.

  2.  **Cognitive Dissonance Reduction:**
      *   **How it fits:** Experiencing praise for something later revealed to be inauthentic creates dissonance ("I'm an expert, but I was fooled"). Reducing this discomfort involves revising the memory of the initial experience ("I wasn't *really* fooled; I always sensed something was off") to make the past perception consistent with the new knowledge.
      *   **How it differs:** While dissonance reduction is the *motivation*, the specific *mechanism* here is the retroactive alteration of sensory and aesthetic judgment. Dissonance theory explains *why* it happens, but not the specific *how* of the perceptual rewrite.

  3.  **The Halo Effect (Reversed/Negative):**
      *   **How it fits:** The "halo" of authenticity (or famous authorship) positively colors *all* aspects of perception. Once that halo is shattered, a "reverse halo" or "horn effect" takes over, casting a negative light on *everything* about the object. Perceived flaws are amplified; virtues are minimized or reinterpreted as flaws. This drives the retroactive shift.
      *   **How it differs:** The Halo Effect typically describes an *ongoing* influence. This phenomenon highlights how the *removal* of the positive halo (or addition of a negative one) doesn't just change current perception but actively *reconstructs* the memory of past perception.

  4.  **Conceptually-Situated Perception (Goodman-esque):**
      *   **How it fits:** Nelson Goodman argued in *Languages of Art* that aesthetic properties aren't simply "in" the object but depend on the *category* under which we perceive it. Seeing something *as* a Vermeer engages different perceptual and cognitive schemata than seeing it *as* a van Meegeren forgery. The "same" sensory data is organized and interpreted differently based on the conceptual frame.
      *   **How it differs:** Goodman focuses on how category *changes perception in the present*. Your observation crucially adds the **temporal dimension of memory revision**. It's not just seeing it differently *now*; it's believing one *always* saw (or sensed) it that way, even when demonstrably one did not. It's **retroactive conceptual resituation**.

  5.  **Theory-Ladenness of Observation (Philosophy of Science):**
      *   **How it fits:** Our beliefs and theories shape what we observe and how we interpret sensory data. The new "theory" (it's a fake) radically alters how we "observe" the work, even in memory.
      *   **How it differs:** This concept is broader, applied to scientific observation. Your phenomenon is a specific, affect-laden, *retrospective* application within aesthetics, involving the reevaluation of *personal* sensory history.

  **What to Call It: Coining Labels that "Carve at the Joints"**

  Since no perfect term exists, here are options prioritizing different aspects of the phenomenon:

  1.  **Retrospective Perceptual Reconfiguration / Recalibration:** Emphasizes the active reshaping (*reconfiguring*) of past sensory memories and judgments (*perceptual*) based on new information (*retrospective*). "Recalibration" suggests adjusting the internal measuring stick.
  2.  **Provenance-Induced Perceptual Revision (PIPR):** Highlights the specific trigger (*provenance* revelation) and the core mechanism (*perceptual revision*). This is precise but a bit clunky.
  3.  **Authenticity Hindsight Bias:** Combines the core cognitive bias (*hindsight bias* – "I knew it all along") with the specific domain (*authenticity*). It captures the false sense of retrospective awareness.
  4.  **Conceptual Contamination of Memory (Aesthetic):** Focuses on how the new conceptual frame (*forgery*) contaminates and alters stored sensory memories.
  5.  **The Van Meegeren Effect / The Forgery Revision Effect:** A descriptive, phenomenon-based label named after its most famous example. Simple and evocative.

  **Why It's Fascinating and Distinct:**

  This goes beyond simply changing one's *evaluation* ("I thought it was good, now I think it's bad"). It involves:

  1.  **Memory Distortion:** Believing one's *past sensory experience* was different than it actually was.
  2.  **Perceptual Framing:** Demonstrating the power of conceptual framing not just on present perception, but on the *narrative of past perception*.
  3.  **Expertise and Ego:** It often serves a face-saving function for critics and experts whose authority was challenged.
  4.  **The Fluidity of Aesthetic Qualities:** Shows how qualities like "luminosity," "profundity," or "clunkiness" are not inherent properties but arise from the complex interaction of the object, the perceiver's schema, and the context (including provenance).

  **Conclusion:**

  While **Retrospective Confirmation Bias** and **Cognitive Dissonance Reduction** explain the underlying *mechanisms*, and Goodman's **Conceptually-Situated Perception** explains the *present* shift, the unique temporal/mnemonic aspect you've identified – the *rewriting of the sensory record* – is best captured by terms emphasizing retroactive change: **Retrospective Perceptual Reconfiguration** or **Provenance-Induced Perceptual Revision (PIPR)**. If aiming for broader recognition, **The Forgery Revision Effect** or simply emphasizing **Authenticity Hindsight Bias** might be most effective.

  Your observation perfectly captures a profound truth about human perception and memory: our beliefs, especially those tied to identity and expertise, don't just color the present; they actively repaint the past.
