answer: |-
  Here's the full specification for an adequate norm of assertion, structured as requested. I prioritize **observable conversational patterns** over theoretical elegance, focusing on what the norm *must* explain to capture ordinary practice.

  ---

  ### **I. Core Phenomena & Data Points (What Must Be Explained)**
  *(Genuine Data - Observed Conversational Patterns)*  
  1.  **Moore-Paradoxical Assertions:** Uttering *"p but I don't believe p"* or *"p but I don't know p"* sounds **incoherent/infelicitous** (hard requirement).  
  2.  **Lottery Assertions:** Flatly asserting *"Your ticket lost"* (in a large, fair lottery before results) feels **improper**, even if highly probable. Yet, asserting the *conjunction* of all losing tickets ("Ticket 1 lost & Ticket 2 lost & ... & Ticket N lost") feels **clearly false/improper** (hard requirement).  
  3.  **Selfless Assertion:** A doctor asserts *"The test results show you don't have disease D"* based on overwhelming evidence, while sincerely (but irrationally) disbelieving it due to anxiety. This can feel **conversationally appropriate** (hard requirement - empirical data from psychology/philosophy).  
  4.  **Gettiered Assertions:** Asserting a justified true belief where the justification is flawed/fluky (e.g., asserting "Jones owns a Ford" based on seeing him drive one, but it's a rental; Jones actually owns a Ford elsewhere). This often feels **challengeable/retractable** ("How do you know?" / "I guess I was wrong to be so sure").  
  5.  **Lucky Guesses:** Asserting a true proposition with no justification (e.g., guessing "The coin landed heads" blindly). This feels **clearly improper**.  
  6.  **Challenge "How do you know?":** This is a **standard, appropriate challenge** to an assertion, implying the asserter should be able to answer it.  
  7.  **Retraction:** Uttering *"I guess I shouldn't have said that"* is a **standard, appropriate response** to learning one lacked adequate grounds (e.g., post-Gettier revelation).  
  8.  **Hedging Effects:** Prefacing with *"I think..."* or *"Probably..."* **systematically reduces challengeability** and changes propriety conditions (e.g., "Probably your ticket lost" is often acceptable).  
  9.  **Stakes-Sensitivity (Apparent):** In high-stakes contexts, stronger grounds seem required for flat assertion (e.g., "The bank is open tomorrow" may require more evidence if missing payroll is at stake vs. cashing a check).  
  10. **Testimonial Transmission:** If A knows *p*, asserts *p* to B, and B accepts it on A's say-so under normal conditions, B **typically gains knowledge (or at least justified belief)** in *p*.  

  ### **II. Essential Distinctions (What Must NOT Be Collapsed)**  
  *(Hard Requirements)*  
  1.  **Asserted Content vs. Speech Act:** The norm governs the *act* of asserting, not the proposition's content.  
  2.  **Propriety vs. Blamelessness:** An assertion can be *improper* (violates norm) yet *blameless* (reasonable mistake, non-culpable ignorance).  
  3.  **Flat-Out Assertion vs. Hedged Assertion:** Hedges create distinct speech acts (e.g., conjecturing) with weaker norms.  
  4.  **Norm of Assertion vs. Norm of Belief:** One can blamelessly believe *p* yet be improper to assert *p* (e.g., lottery belief).  
  5.  **Norm of Assertion vs. Norm of Action:** Asserting *p* improperly doesn't entail acting on *p* is improper (and vice versa).  
  6.  **Violating Norm vs. Conversational Oddity:** Not all infelicity is a norm violation (e.g., irrelevance may be Gricean, not assertion-specific).  
  7.  **Normative vs. Prudential Reasons:** Being paid to say *p* doesn't make asserting *p* *proper as an assertion*; it gives a reason to *perform the act*, not to meet its constitutive standard.  

  ### **III. Structural Constraints (Results to Respect)**  
  1.  **Closure Under Conjunction:** If properly asserting *p* and properly asserting *q* individually commits one to properly asserting *(p & q)* (hard - avoids ad hoc lottery fixes).  
  2.  **Testimonial Knowledge Transmission:** The norm should explain how knowledge is typically transmitted via testimony without requiring hearer "double-checking" (hard - core function of assertion).  
  3.  **Retraction Data Compatibility:** Learning you violated the norm *when you made the assertion* justifies retraction, even if *p* was true (hard - Gettier/Lucky Guess cases).  

  ### **IV. Pressure Points & Their Status**
  | Case/Issue                      | Hard Requirement? | Why                                                                 |
  | :------------------------------ | :---------------- | :------------------------------------------------------------------ |
  | "p but I don't believe p"       | **Yes**           | Moorean incoherence is bedrock data.                                |
  | "p but I don't know p"          | **Yes**           | Even stronger incoherence than disbelief variant.                   |
  | Lottery Assertions              | **Yes**           | Ubiquitous intuition; conjunction problem stresses norms.           |
  | Selfless Assertion              | **Yes**           | Empirical counterexample to belief/knowledge norms; must be handled.|
  | Gettiered Assertions            | **Yes**           | Reveals insufficiency of JTB; drives retraction data.               |
  | Lucky Guesses                   | **Yes**           | Clear case of impropriety without belief/truth/justification.       |
  | "How do you know?" Challenge    | **Yes**           | Central reactive attitude in practice.                              |
  | Hedging Effects                 | **Yes**           | Shows assertion is gradable; core to managing epistemic risk.       |
  | Apparent Stakes-Sensitivity     | **Negotiable**    | May reflect derivative norms (action/prudence) or context-shifting. |
  | Conjunction vs. Single Lottery  | **Yes**           | Tests norm robustness; exposes probabilistic approaches.            |

  ---

  ### **V. Incompatible Desiderata Subsets**
  The core tension is **Selfless Assertion vs. Lottery + Conjunction Closure**:
  1.  **Selfless Assertion** requires propriety *without* belief (or knowledge).  
  2.  **Lottery Assertions** show propriety *without* knowledge is impossible (intuition) and belief is insufficient (intuition).  
  3.  **Conjunction Closure** prevents treating single lottery propositions as unassertable *only* because they are probabilistic (else asserting each conjunct & the conjunction should be equally problematic).  

  **Why Incompatible?**  
  - A norm allowing proper selfless assertion (e.g., **Justified Belief/Truth Norm**) easily handles selfless cases but **fails lottery cases** (high justification exists) and **fails conjunction closure** (justified belief in each conjunct doesn't entail justified belief in huge conjunction).  
  - A norm requiring belief/knowledge (e.g., **Knowledge Norm**) handles lotteries and closure but **cannot permit proper selfless assertion** (no belief/knowledge).  
  - **Contextualist/Relativist Knowledge Norms** can handle stakes-sensitivity and *maybe* lotteries by raising standards, but **struggle massively with selfless assertion** (the agent's own low-stakes context doesn't apply if they disbelieve) and **conjunction closure** (contexts shift).  

  **Most Damaging Requirement:**  
  **Selfless Assertion**. It's a direct counterexample to internalist (belief/justification) *and* externalist (knowledge) invariantist norms. Either reject the data (controversial) or adopt complex hybrid/relativist norms.  

  ---

  ### **VI. Scorecard of Major Norms**
  *(Evaluated against key desiderata; "X" = serious failure, "!" = partial failure, "✓" = success)*

  | Norm                          | Moore ("p & ~Bp/Kp") | Lottery Single | Lottery Conj. | Selfless Assertion | Gettier | "How know?" | Retraction | Hedging | Testimony | Conj. Closure |
  | :---------------------------- | :------------------- | :------------- | :------------ | :----------------- | :------ | :---------- | :--------- | :------ | :-------- | :------------ |
  | **Truth (T)**                 | X (No incoherence)   | ! (Can be T)   | X (False)     | ✓                  | X (T)   | X           | X (T)      | !        | X         | ✓             |
  | **Belief (B)**                | X                    | X (B possible) | ! (B unlikely)| X (No B)           | ! (B/J) | !           | !          | ✓        | !         | ! (B conjunct)|
  | **Justified Belief (JB)**     | X                    | X (JB exists)  | X (No JB)     | ✓ (If JB)          | ! (JB)  | ✓           | ! (If JB)  | ✓        | !         | X (No JB)     |
  | **Knowledge (K)**             | ✓                    | ✓              | ✓             | X (No K/B)         | ✓       | ✓           | ✓          | !        | ✓         | ✓             |
  | **Relativist K (Speaker Ctx)**| ✓                    | ! (Low ctx ✓) | ! (Low ctx ?) | X (No K/B)         | ✓       | ✓           | ! (Ctx shift)| ✓      | !         | ! (Ctx shift) |

  **Key Takeaways:**
  - **Truth Norm:** Fails Moore, Lottery, Gettier, Retraction, Testimony. Fatally weak.
  - **Belief Norm:** Fails Moore, Lottery, Selfless. Insufficiently demanding.
  - **Justified Belief Norm:** Fails Moore, Lottery (single & conj.), Gettier retraction. Closure fatal.
  - **Knowledge Norm:** **Fails only Selfless Assertion.** Handles everything else best. Most retraction/challenge data directly supports it.
  - **Relativist K:** Fixes stakes cases but inherits K's Selfless problem; adds complexity for closure/challenge contexts. Testimony transmission becomes murky.

  ---

  ### **VII. Bad Desideratum Flag**
  **"Every improper assertion must be blameworthy."**  
  This is a **bad desideratum**. Norms can be violated **blamelessly** (e.g., Gettier cases, misleading evidence). Blameworthiness depends on *culpability*, which involves epistemic responsibility, not just norm violation. The norm sets the *standard*, not the blame conditions. A theory requiring blamelessness only for proper assertions would be **overly restrictive and disconnected from practice** (e.g., we don't blame the Gettiered asserter pre-revelation, but their assertion was still improper).

  ---
  This spec forces theories to handle the **robust, paradoxical data** (Moorean, Lottery, Selfless, Gettier) and **systematic practices** (challenge, retraction, hedging, testimony) while respecting fundamental distinctions. The Knowledge Norm scores best but stumbles on Selfless Assertion; all others fail multiple hard requirements. A viable theory must either reject Selfless data, augment K with a secondary norm, or adopt sophisticated relativism—each with significant costs.
