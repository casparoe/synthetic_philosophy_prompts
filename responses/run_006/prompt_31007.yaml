prompt: |-
  So I've been put in charge of redesigning our medical residency training and my boss keeps saying we need graduates who have real clinical know-how, not just textbook knowledge. This got me reading about the knowing-how vs knowing-that distinction, and I started keeping track of how my friend (she did her PhD on exactly this, philosophy postdoc now) rules on cases when we talk over drinks. Here's what I have, her actual words as best I remember:

  - Bike rider who can't explain the physics of balance: "That's knowing-how, obviously."
  - Someone who memorized a cycling physics textbook but can't ride: "No, that's pure knowing-that, zero knowing-how."
  - Chess grandmaster who can explain every move: "Has both, they're different things but not incompatible."
  - Amnesic pianist who plays pieces from before the amnesia but doesn't remember learning them: "Still knowing-how, the ability survived the memory loss."
  - Person who aces a multiple-choice test on swimming technique but has never been in water: "Knowing-that only, don't kid yourself."
  - Surgeon who does a flawless appendectomy but can't name half the structures: "Knowing-how, and a good thing too or we'd all be dead."
  - Sommelier who IDs wines reliably but says she just knows, can't say how: "Knowing-how, no question."

  Here's the case I actually need to decide about, because it's basically what our new training produces: a resident who can diagnose a particular condition correctly and reliably, but only by consciously walking step by step through a memorized decision tree. If you interrupt her mid-reasoning she has to start over, she has zero intuitive feel for it, and if you ask her how she knows she just recites the tree. She's slow but her accuracy is genuinely good.

  What's my friend going to say about her? And more importantly — what rule is she implicitly running such that all seven verdicts fit? I can see at least two different principles that cover her pattern, and I think they diverge on my resident. Name them, say which predicts what, and give me your best guess with why. If there's a further case I could casually bring up next time we get drinks that would settle which rule she's actually running, tell me what it is.

  Keep it under 400 words, I actually need to act on this.
reasoning: |-
  Okay, the user is redesigning medical residency training and needs to understand whether their resident, who uses a step-by-step decision tree for diagnosis, has "knowing-how" or "knowing-that." They've provided seven examples from their friend's judgments and want to know how the resident fits in. 

  First, I need to recall the knowing-how vs knowing-that distinction. Knowing-how is practical ability, like riding a bike without being able to explain the physics. Knowing-that is theoretical knowledge, like memorizing a textbook but not being able to apply it. 

  Looking at the friend's verdicts: 
  - Bike rider who can't explain physics: knowing-how. 
  - Memorized textbook but can't ride: knowing-that. 
  - Chess grandmaster explaining moves: both. 
  - Amnesic pianist: knowing-how, since the skill remains. 
  - Acing a test on swimming but never swimming: knowing-that. 
  - Surgeon who can't name structures: knowing-how. 
  - Sommelier who can't explain: knowing-how. 

  The patterns suggest two possible rules the friend might be using. Rule 1: Knowing-how requires automated, procedural skill without conscious steps. Rule 2: Knowing-how is about reliable performance, regardless of how it's achieved. 

  For the resident: She's accurate but slow, uses a conscious step-by-step process, and has no intuition. Under Rule 1, this is knowing-that because she relies on explicit recall. Rule 2 would say knowing-how because she performs reliably. 

  The user needs to act on this, so determining which rule applies is crucial. To test which rule the friend uses, propose a case: An experienced radiologist who can spot tumors instantly but can't explain how, versus one who uses a checklist accurately but slowly. If the friend says the intuitive radiologist has knowing-how and the checklist user doesn't, she's using Rule 1. If both are knowing-how, it's Rule 2. 

  Based on the friend's past judgments, especially the surgeon and sommelier who perform without explicit knowledge, she likely values reliable performance over the method. But the resident's lack of automation might push it to knowing-that. The amnesic pianist shows that even without memory, the skill is knowing-how, but the resident relies on conscious steps. 

  The user's deeper need is to design training that builds intuitive clinical skills. If the resident's method is knowing-that, the program needs more practice to develop unconscious competence. If it's knowing-how, maybe it's acceptable but slow. However, in medicine, speed and intuition matter, so aiming for automation is better. 

  Recommend the radiologist test case to clarify. Guess that the friend would say the resident has knowing-that under Rule 1, based on the need for conscious process and no intuition. But since the friend accepted the surgeon who couldn't name structures, she might lean towards Rule 2. However, the surgeon's skill is automated, while the resident's is deliberate. So probably Rule 1 applies here. 

  Final guess: Friend will say the resident has knowing-that because the process isn't automated. The rule is that knowing-how must be procedural and not require conscious step-by-step reasoning. The radiologist case can confirm this.
answer: |-
  Based on the pattern, your friend is implicitly running **Rule 1: Knowing-how requires *automated, procedural skill* that operates without relying on conscious, step-by-step declarative recall.** This contrasts with Rule 2 (knowing-how is *any reliable performance*, regardless of conscious steps), which your friend's verdicts reject.

  *   **Rule 1 Predicts:** Your resident has **only knowing-that**. She relies entirely on conscious, deliberate recall and manipulation of declarative knowledge (the decision tree). Her *reasoning* is accurate, but the *procedure* isn't automated or intuitive. Interruption causing failure and lack of intuitive feel are key indicators under this rule.
  *   **Rule 2 Predicts:** She has **knowing-how** because her performance (diagnosis) is reliably accurate, even if slow and conscious.

  **Why Rule 1 Fits All Seven Verdicts:**
  1.  **Bike Rider:** Skill is automated/procedural (knowing-how).
  2.  **Textbook Memorizer:** Only declarative recall (knowing-that), no skill.
  3.  **Chess Grandmaster:** Has automated skill (knowing-how) *and* declarative knowledge (knowing-that).
  4.  **Amnesic Pianist:** Automated procedural skill (knowing-how) remains intact despite lost declarative memory.
  5.  **Test Acer / Non-Swimmer:** Only declarative knowledge (knowing-that), no skill.
  6.  **Surgeon:** Automated procedural skill operates effectively *without* needing full declarative recall (knowing-how).
  7.  **Sommelier:** Automated skill (knowing-how) functions without conscious access to the "how" (procedural vs. inaccessible declarative).

  **Your Best Guess:** Your friend will say **knowing-that only**. Her verdicts consistently prioritize the *automated, unconscious nature* of the skill over simple reliable output. The resident's conscious, step-by-step reliance on declarative knowledge and lack of intuitive automation place her squarely in the "textbook memorizer" and "test acer" camp, not the "surgeon" or "pianist" camp.

  **Test Case to Settle It:**  
  Casually ask: *"What about an experienced radiologist who instantly* ***spots*** *tumors on an X-ray with uncanny accuracy but genuinely* ***can't explain*** *the subtle features he sees, versus one who* ***methodically checks*** *a formal list of criteria (like your resident) and is equally accurate but much slower?"*  

  *   **If Rule 1:** She'll say the intuitive spotter has **knowing-how** (automated skill), the checklist user has **knowing-that** (conscious declarative process).
  *   **If Rule 2:** She'll say **both** have knowing-how (reliable performance).

  **Act:** Design training to move residents *beyond* the decision-tree phase. Focus on massive deliberate practice with feedback, varied cases, simulations, and reflection to build automated pattern recognition and intuitive judgment – shifting them from knowing-that to true clinical knowing-how.
