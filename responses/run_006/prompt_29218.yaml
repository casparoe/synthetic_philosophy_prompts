  In expressivism, the key idea is that atomic moral sentences (like "murder is wrong") do not denote truth values (as in classical semantics) but instead express non-cognitive attitudes (like disapproval). However, when embedded in complex constructions (conditionals, negations, questions, etc.), the expressivist must account for how the meaning of the complex expression is built from the meanings of its parts.

  The Frege-Geach problem is the challenge of providing a compositional semantics for such a language that:
   (a) Respects the expressivist thesis for atomic moral sentences (their denotation is an attitude, not a truth condition).
   (b) Accounts for the logical behavior of complex sentences (e.g., modus ponens with moral conditionals).

