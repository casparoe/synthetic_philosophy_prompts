  Then, for a conditional: in dynamic semantics, we often define `If A then B` as a test that checks: in any context updated with A, if you then update with B, does it crash? Or more commonly: the conditional update is defined as: `c[If A then B] = { w in c | c[A][B] is defined and non-empty }`? But that is truth-conditional.

