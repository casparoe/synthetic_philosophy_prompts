  So the PL perspective shows that we can give a compositional semantics, but it might force the expressivist into a framework that is truth-conditional in a broader sense. This is the heart of the Frege-Geach problem for expressivism: to avoid truth conditions, but compositionality seems to require something that looks very much like truth conditions.

