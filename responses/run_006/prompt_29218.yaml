answer: |-
  ### Restating the Frege-Geach Problem in Programming Language Theory Vocabulary  
  I'll reframe the expressivist challenge using compositional semantics, denotations, contexts, and syntactic forms. The core problem is defining a **denotational semantics** for a language where atomic moral sentences have non-truth-conditional denotations (attitudes), yet compose in truth-conditional ways when embedded.  

  #### Formal Language Setup  
  1. **Syntactic Forms**:  
     - Atomic propositions:  
       - Descriptive: `d : D` (e.g., `is_raining`).  
       - Moral: `m : M` (e.g., `murder_wrong`).  
     - Connectives:  
       - Unary: `¬` (negation).  
       - Binary: `→` (implication), `∧` (conjunction), `∨` (disjunction).  
     - Embeddings:  
       - Conditionals: `φ → ψ`  
       - Negation: `¬φ`  
       - Question: `?φ` (though we'll focus on declaratives).  

  2. **Semantic Domains**:  
     - **Worlds** `w ∈ W`: Classical truth-conditional indices (e.g., possible worlds).  
     - **Attitudes** `a ∈ A`: Non-cognitive states (e.g., `disapprove : M → A`).  
     - **Contexts** `c ∈ C`: Tuples `(w, a)` pairing a world and an attitude state.  
     - **Denotations**:  
       - Descriptive `d`: `⟦d⟧ : W → 𝔹` (truth-conditional).  
       - Moral `m`: `⟦m⟧ : A → A` (attitude-expressive; e.g., `⟦murder_wrong⟧(a) = disapprove(a, murder)`).  

  3. **Compositionality Goal**:  
     Define a semantics where:  
     ```
     ⟦φ ⊛ ψ⟧ = f(⟦φ⟧, ⟦ψ⟧)  // ⊛ = connective, f = semantic combinator
     ```  
     But atomic `m` has denotation `A → A`, while `d` has `W → 𝔹`.  

  ---

  ### The Frege-Geach Problem as Compositional Semantics  
  #### Issue 1: Mismatched Denotation Types  
  - **Atomic moral sentence**:  
    - Standalone: `⟦m⟧ : A → A` (e.g., updates attitude state).  
    - Embedded: In `¬m`, `m → ψ`, etc., it must compose with operators expecting **propositional denotations** (e.g., `𝔹` or `W → 𝔹`).  
  - **Type conflict**:  
    - Operators like `¬` or `→` require inputs of type `W → 𝔹` (truth functions).  
    - But `⟦m⟧` is of type `A → A`.  

  #### Issue 2: Embedding in Evaluation Contexts  
  - **Standalone context**:  
    Evaluating `m` updates attitude: `a ⟼ ⟦m⟧(a)`.  
  - **Embedded context** (e.g., conditional antecedent):  
    Evaluating `m → ψ` **must not** update the attitude. Instead, it constrains logical inference:  
    ```
    If (murder is wrong) then (stealing is wrong)  
    ```  
    should denote a **constraint on attitudes**, not an attitude update.  
  - **Formally**:  
    - Let `E[-]` be an evaluation context (e.g., `□ → ψ`).  
    - `⟦E[m]⟧` must be defined, but `⟦m⟧`’s type `A → A` doesn’t fit `E[-]`’s expected input (e.g., `W → 𝔹`).  

  #### Attempted Solution: Uniform Semantic Values  
  Expressivists need a **uniform denotation type** for all sentences:  
  - **Proposal**: Lift all denotations to `C → C` (context transformers).  
    - `⟦d⟧ : C → C = λc. (w ∈ c where ⟦d⟧(w) = true, a)`  
    - `⟦m⟧ : C → C = λc. (w, ⟦m⟧(a))`  
    - `⟦φ → ψ⟧ : C → C = λc. ⟦ψ⟧(⟦φ⟧(c))`? **Problem**: This naïvely sequences updates, but conditionals shouldn’t update with `φ`’s attitude.  

  #### Revised: Continuations or Constraints  
  - **Gibbard-style Solution** (using PL semantics):  
    Denotations as **constraints on contexts**:  
    ```
    ⟦φ⟧ ⊆ C  // Set of consistent (world, attitude) pairs
    ```  
    - `⟦d⟧ = {(w, a) | ⟦d⟧(w) = true}`  
    - `⟦m⟧ = {(w, a) | a disapproves murder}`  
    - `⟦φ → ψ⟧ = {(w, a) | if (w, a) ∈ ⟦φ⟧ then (w, a) ∈ ⟦ψ⟧}`  
  - **Compositionality**:  
    `⟦¬φ⟧ = C \ ⟦φ⟧`, `⟦φ ∧ ψ⟧ = ⟦φ⟧ ∩ ⟦ψ⟧`, etc.  

  **Problem "Solved"**: Uniform type `℘(C)` (powerset of contexts), with logical operators as set operations.  

  ---

  ### Residue Report: What Translates, What Doesn’t  
  | Philosophers’ Concept         | PL Theory Analog                          | Clean Translation? |  
  |-------------------------------|------------------------------------------|-------------------|  
  | **Moral sentence meaning**    | Denotation of type `A → A`               | ✅ (e.g., state monad) |  
  | **Embedding problem**         | Mismatched types in composition          | ✅                 |  
  | **Logical operators**         | Semantic combinators (`¬`, `→` liftings) | ✅                 |  
  | **Compositionality**          | Recursive denotational semantics         | ✅                 |  
  | **Attitudes**                 | Effect types / monads (e.g., `State A`)  | ✅                 |  
  | **"Expression" vs "Assertion"** | Standalone vs. embedded evaluation      | ✅ (e.g., `E[-]` contexts) |  
  | **Frege-Geach tension**       | Reconciling `A → A` with `W → 𝔹` in composition | ✅ (via uniform lifting) |  

  #### What Had to Be Fudged  
  1. **Attitudes as Truth-Like**:  
     - To handle composition, attitudes are modeled as **truth-conditions on richer indices** (`(w, a)` pairs). This risks conceding that moral sentences are "truth-conditional" in a broader sense—contrary to core expressivism.  
     - **Fudge**: Philosophers might reject `℘(C)` as smuggled truth-conditionality.  

  2. **Dynamic vs. Static Semantics**:  
     - In standalone contexts, `m` is **dynamic** (updates `a`).  
     - In embedded contexts, it’s **static** (constraint on `a`).  
     - **Fudge**: Using `℘(C)` flattens this distinction; real work is deferred to the metalanguage.  

  3. **Non-Cognitivism**:  
     - PL semantics forces a **denotation** for `m`, but expressivists insist attitudes aren’t "meanings" in this sense.  
     - **Fudge**: The semantic domain `A` is underspecified; philosophers debate its nature (e.g., is `A` a set? Can it be compositional?).  

  #### What Has No PL Counterpart  
  - **Metaphysical Claims**:  
    Expressivists’ insistence that moral sentences **fundamentally aren’t truth-apt** has no PL analog. PL semantics is agnostic: you can assign any denotation (numbers, functions, sets) as long as composition works.  
    - **Gap**: PL says nothing about whether `℘(C)` counts as "factual." Philosophers care about this.  

  - **Normativity of Logic**:  
    The Frege-Geach problem is about preserving **logical validity** (e.g., modus ponens). In PL, validity is defined relative to a model, but expressivists need validity to arise from attitude constraints alone.  

  ---

  ### Conclusion: Are Philosophers Confused?  
  **No**. PL theory shows that **compositional semantics is possible** (via uniform lifting to `℘(C)` or continuations), but:  
  - This requires assigning moral sentences **denotations that behave like truth-conditions** on `(w, a)` pairs.  
  - Expressivists reject this, seeing it as conceding to realism.  

  Thus, the problem isn’t unsolvable computationally; it’s that the solution **violates expressivism’s spirit**. Philosophers are wrestling with whether a "pure" non-truth-conditional semantics exists—which PL suggests is impossible without abandoning standard compositionality.  

  **Your hunch is half-right**: PL has solved the *technical* problem, but the *philosophical* problem (avoiding truth-like entities) remains. The residue is metaphysical, not compositional.
