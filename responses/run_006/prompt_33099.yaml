answer: |-
  Your skepticism is well-placed—true intellectual rigor demands stress-testing even the most elegant theories. Below are the fundamental cracks in Kelly's foundation, moving beyond superficial critiques to challenges that threaten its core normative status:

  ### 1. **The Ergodicity Assumption Crumbles Under Scrutiny**
     - **The Fatal Flaw**: Kelly relies on the ergodic hypothesis for multiplicative growth (time averages = ensemble averages). But real-world dynamics often violate ergodicity:
       - **Absorbing States**: Bankruptcy (wealth = 0) is a non-ergodic trap. Once hit, growth stops permanently. Kelly's "almost sure" long-run dominance assumes no such traps exist.
       - **Path-Dependence**: If investment opportunities depend on current wealth (e.g., access to private markets, margin calls), the process becomes non-ergodic. Epstein (2019) demonstrates how non-ergodicity breaks expected log-wealth maximization.
     - **Consequence**: In non-ergodic systems, maximizing expected log-wealth *does not* guarantee survival or dominance. Alternative observables (e.g., expected time to reach a goal) may better reflect reality.

  ### 2. **The "Long Run" is a Mythical Horizon**
     - **The Problem**: Kelly's dominance is asymptotic (infinite time). Human actors face:
       - **Finite Horizons**: Retirement deadlines, fund lifespans, or biological limits make the "long run" irrelevant. Samuelson famously showed Kelly can underperform safer strategies over 100s of trials.
       - **Extinction Risk**: Kelly minimizes *probability* of ruin but not necessarily *time* to ruin. For finite horizons, a strategy with higher growth but 1% ruin probability might be inferior to one with lower growth and 0.1% ruin.
     - **Implication**: Kelly optimizes for a reality we don't inhabit. Its proofs are mathematically sound but metaphysically disconnected from human timescales.

  ### 3. **Non-Linear Bet Sizing Constraints**
     - **The Flawed Premise**: Kelly assumes fractional bets are always feasible. Reality imposes hard constraints:
       - **Discreteness**: Minimum bet sizes (e.g., 1 share) force over- or under-betting near critical wealth levels.
       - **Liquidity/Impact**: Large bets move markets, turning a positive-EV trade negative. Kelly's fraction becomes undefined when your bet *changes* the edge.
       - **Leverage Limits**: Borrowing constraints cap maximum fractions, preventing optimal sizing even with high edge.
     - **Consequence**: Kelly's solution is often *unimplementable* in principle, not just in practice. The math assumes a frictionless world that doesn't exist.

  ### 4. **Utility Beyond Log-Wealth**
     - **The Misconception**: Kelly proponents often claim log-utility is "objective." But:
       - **Risk of Ruin Isn't Everything**: Real agents care about drawdown magnitude, not just survival. A 90% wealth loss may be "survivable" but catastrophic (job loss, margin calls).
       - **Non-Monetary Constraints**: Reputation, regulatory penalties, or ethical limits make certain losses intolerable—even if mathematically "optimal."
       - **Wealth-Dependent Utility**: Marginal utility of wealth isn't always proportional to 1/x (log-utility). At subsistence levels, *all* wealth is critical; at billions, losses are psychological.
     - **Implication**: Log-utility is a specific preference, not a universal law. It ignores human neurobiology (loss aversion > risk aversion) and social context.

  ### 5. **Radical Uncertainty Undermines Edge Estimation**
     - **The Hidden Vulnerability**: Kelly requires precise knowledge of edge and probabilities. But in Knightian uncertainty:
       - **Parameter Ignorance**: Your "edge" is an unobservable latent variable. Misestimation by 1% can turn Kelly optimal into disastrous overbetting.
       - **Regime Shifts**: Markets aren't stationary. A strategy optimal for past data may fail catastrophically in new regimes (e.g., Black Monday, Bitcoin crashes).
       - **Reflexivity**: Your bets can *create* the edge (e.g., short squeezes, bubble inflation), making probabilities endogenous.
     - **Consequence**: Kelly's elegance relies on known probabilities. In the real world, it's a solution to a problem we can't define.

  ### 6. **Dominance Failures in Super-Additive Growth**
     - **The Counterexample**: Kelly assumes additive investment opportunities. If projects interact super-additively (e.g., network effects, R&D synergies), aggressive betting early can unlock exponential growth later.
       - **Example**: Venture capital—losing 99 bets is rational if the 100th funds a Google. Kelly would underinvest in high-variance moonshots.
     - **Implication**: In systems with option value or convexity, maximizing log-wealth is *too conservative*. Growth requires accepting ruin risk to capture asymmetric upside.

  ### Epistemological Danger: Immunization Against Falsification
  You've identified the core issue: Kelly is often insulated by qualifications. When it fails, proponents retreat to:
  - *"You used the wrong edge estimate"* (unfalsifiable, as "true" edge is unknowable)
  - *"You should've used fractional Kelly"* (admits the pure strategy is fragile)
  - *"The model assumptions were violated"* (but they *always* are)

  This risks making Kelly a tautology: "Bet Kelly fractions when conditions are ideal." But ideal conditions never exist. A theory claiming normative status must engage with reality's messiness or risk irrelevance.

  ### Conclusion: When to Abandon Kelly
  Kelly fails as a universal norm if:
  1. **Absorbing states exist** (e.g., ruin is permanent),
  2. **Time horizons are short** (<1000 bets),
  3. **Bets alter the game** (market impact, reflexivity),
  4. **Growth is path-dependent or super-additive**,
  5. **Utility is not logarithmic at extremes**.

  Its deepest value is as a *benchmark* for growth-optimization—not a prescription. The quest isn't to discard Kelly, but to build frameworks that incorporate its insights while transcending its limitations. For that, embrace its critiques.
