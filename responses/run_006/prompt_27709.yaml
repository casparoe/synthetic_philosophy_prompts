answer: |-
  ## The Duck and Quill (A Philosophical Dialogue)

  **Setting:** A dimly lit corner booth in "The Duck and Quill," a pub favoured by academics. Pint glasses sit half-empty on the worn wooden table. **Intellectualist** (Int), mid-40s, sharp suit slightly rumpled, gestures emphatically. **Anti-Intellectualist** (Anti), late 50s, tweed jacket with leather elbow patches, sips contemplatively. The air smells of ale and old books.

  **Anti:** (Leaning back) ...so you see, this chap's obsession with these large language models – treats them like they’re on the cusp of genuine *understanding*. But it’s all "knowing-that," isn’t it? Encyclopaedic recall, stitching together plausible text. Ask it to *explain* how to debug a race condition? Fine. But *do* it? In a live system, under pressure, adapting to unforeseen quirks? That’s "knowing-*how*." That’s where Ryle’s ghost haunts the server room. They’re fundamentally distinct categories. The model lacks the *disposition*, the ingrained skill.

  **Int:** (Leaning forward, tapping the table) Hold on, hold on. That’s precisely the dichotomy Stanley and Williamson dismantled. You’re falling for Ryle’s sleight of hand! When *you* know how to debug a race condition, it’s *not* some mystical, non-intellectual faculty. It’s still propositional knowledge – knowing *that* certain patterns indicate a race, knowing *that* mutexes prevent concurrent access, knowing *that* logging specific timestamps can isolate it – but crucially, held under a *practical mode of presentation*. It’s knowledge *of* propositions, but presented in a way geared towards action, not mere contemplation. The LLM has the propositions. The *mode* bit... well, that’s implementation detail, innit? Perhaps its training simulates the practical orientation.

  **Anti:** (Raises an eyebrow) "Implementation detail"? That’s rather glib. Let’s press Ryle’s regress, shall we? You say knowing-how is just knowing-that (p). Fine. But then *applying* that knowledge – actually *using* the mutex correctly in this specific context – surely requires *another* bit of knowledge: knowing *that* p is the relevant proposition to apply *here and now*. But that’s just another proposition (q)! So you need to know *that* q applies... and off we go, turtles all the way down! Ryle was right: reducing skill to propositional knowledge demands an infinite hierarchy of "knowing-thats" to govern application. Your "practical mode" seems suspiciously like a label slapped on to stop the regress, not an explanation. *How* does it stop it?

  **Int:** (Takes a slow sip) Fair challenge. But the regress misconstrues the nature of the mode. The practical mode *isn't* another proposition *about* the first proposition. It’s the *way* the agent grasps p itself. It’s like... knowing the London Underground map *as* a guide for navigation versus knowing it *as* an abstract graph. The propositional content is identical, but the cognitive orientation – the mode of presentation – determines whether it disposes you to *act* (board the Piccadilly line) or just *analyse* (calculate shortest paths). The LLM, when generating code, isn't (ideally) just regurgitating facts; it's deploying its knowledge *under* a problem-solving, action-oriented mode – shaped by its training objective. The regress only bites if you insist on reducing the *mode* to further propositional content, which is precisely what Stanley and Williamson deny.

  **Anti:** But does this "practical mode" actually explain the crucial dissociation cases? Consider the medical student who can recite, flawlessly, the textbook proposition: "To suture a wound, one must pass the needle through the dermis at a 90-degree angle, ensuring even tension..." Knows *that* inside out. Yet put a needle in their hand and they fumble, puncture too deep, tie knots that slip. They lack the know-*how*. Conversely, my gran could ride a bicycle like she was born on it, but couldn't articulate a single proposition about gyroscopic stability or counter-steering. According to your intellectualism, the student *should* be able to suture (they know the relevant p under *some* mode), and my gran *shouldn't* be able to ride (she lacks the propositional knowledge). But reality contradicts that! Know-how and know-that come apart. The student lacks the *embodied skill*, the proprioceptive feedback loop, the fine motor control – things irreducible to propositions, however presented.

  **Int:** (Nods thoughtfully) A good example, often trotted out. But it doesn't sink intellectualism. The student *does* know propositions – but crucially, they likely lack *further* relevant propositions under the practical mode. They might not know *that* *this* visual cue indicates correct dermis depth, or *that* *this* tactile sensation corresponds to optimal tension. Their knowledge is incomplete or misapplied *within* the practical context. They lack the *fine-grained*, *contextually sensitive* propositional knowledge required for the skill. As for your gran... she *does* know propositions! She knows *that* leaning left steers left, *that* pedalling maintains momentum – she just can't *articulate* them in textbook language. She accesses them under the practical mode directly through her embodied competence. The linguistic inability doesn't mean propositional poverty. The LLM analogy here is fascinating: an LLM might "know" propositions about coding it can't articulate in natural language, but expresses through its generations. Its "fumbling" – generating buggy code – might stem from *missing* or *misweighted* contextual propositions, not the absence of a non-propositional faculty.

  **Anti:** You're stretching "proposition" awfully thin. Is the subtle calibration of pressure on the bike's handlebars in a crosswind really best described as "knowing *that* pressure P at time T counters wind vector W"? That seems a grotesque intellectualisation of a fluid, non-conceptual adjustment! And linguistically, doesn't common usage favour Ryle? We say "She knows how to ride a bike" precisely *because* she can ride it, regardless of articulation. We say "He knows *that* E=mc²" whether or not he can apply it. The grammar tracks the ability. If know-how were *just* know-that, why the distinct construction? Stanley and Williamson argue the "how" introduces the practical mode, but that feels like linguistic gymnastics to save the theory. The simpler explanation is that "knows how" ascribes an ability, "knows that" ascribes a state of factual awareness.

  **Int:** (Smiles) Ah, the linguistic turn! But language is slippery. We *also* say things like "I finally know how quantum tunnelling works!" after grasping the theory, even if we couldn't build a tunnelling diode. Here, "knows how" *is* about understanding propositions. Conversely, we might say of an expert pianist, "She knows *that* passage requires a lighter touch there," showing factual knowledge intimately tied to skill. The linguistic evidence is messy, not decisive for either side. It cuts both ways. The "how" *can* signal the practical mode of grasping the proposition relevant to the action. It doesn't *have* to signal a wholly different *kind* of knowledge. Simplicity favours intellectualism: one fundamental kind of knowledge (propositional) with different modes of access and deployment, rather than two radically distinct ontological categories.

  **Anti:** (Sighs, swirls his pint) Perhaps... perhaps. I'll concede your linguistic point isn't fatal. But the core intuition remains: there's a *feel*, a *directness* to skilled action – debugging under fire, riding that bike – that feels utterly unlike consulting an internal database of facts, however "practically" presented. It feels embodied, automatic, *pre*-reflective. Your "practical mode" starts to sound like the homunculus – a little man inside interpreting the propositions practically. How does the *mode* actually translate into fluid action without invoking yet *more* know-that? And with your LLMs... (leans in) they hallucinate, they confabulate, they get the *context* of code utterly wrong sometimes, precisely because their "practical mode" is a statistical approximation, not grounded in real-world feedback loops like your proprioception on a bike or my fingers on a keyboard. That gap feels like the Rylean gap – the missing know-*how* dimension, the genuine dispositional competence.

  **Int:** (Finishes his pint) I’ll grant you the *feel* is different. Phenomenology is tough. And yes, current LLMs absolutely lack robust, reliable grounding. Their "practical mode" is shallow, probabilistic, prone to error when the training data diverges from reality. But is that a fundamental limitation of propositional knowledge + mode, or just an engineering challenge? If we could encode the vast, fine-grained, contextually dependent propositions that constitute *true* expertise – including the proprioceptive feedback as complex sensory propositions – and couple it with a robust action-selection mechanism embodying the practical mode... perhaps the gap *is* bridgeable. Ryle warned against the "intellectualist legend," but Stanley and Williamson showed the legend might just need a richer script – one including the stage directions (the mode) alongside the lines (the propositions). The regress is avoided by the mode being the *form* of access, not more content. The dissociations point to missing propositions or faulty modes, not a different substance. And the LLM... well, it’s a crude, fascinating first draft of that script. Cheers?

  **Anti:** (Chuckles, raising his glass) Cheers. But I’ll still bet my next round that genuine know-how, the kind that *flows*, needs more than just propositions, however presented. That script needs actors, not just words. And the pub needs closing. Same time next week? We can tackle whether that damn bike is *really* just a collection of propositions under a spatial mode.

  **Int:** (Grinning) Only if you’re buying. I need liquid fortification to argue colour qualia are just wavelengths known sensorily. Until then.
