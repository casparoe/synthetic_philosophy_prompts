  3. **Dissociation Cases**: Anti-Intellectualist cites real-world examples (e.g., medical student who can’t suture). Intellectualist reframes this as lacking contextual propositions.  
  4. **Linguistic Evidence**: Intellectualist notes we say "they know how to ride a bike" even if they can’t articulate it. Anti-Intellectualist retorts that this reflects ability, not hidden propositions.  
  5. **LLM Application**: Both tie it back to coding. Intellectualist suggests LLMs’ "knowing-that" could suffice; Anti-Intellectualist insists on embodied practice.  

  Key adjustments:  
  - Intellectualist concedes that "practical mode" needs refinement but holds firm.  
  - Anti-Intellectualist admits linguistic evidence is tricky but maintains that ability is irreducible.  
  - End on unresolved tension to reflect real philosophy.  

