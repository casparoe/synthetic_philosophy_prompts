  The flaw is in step (7). Step (7) says that if aggregation is not valid, then the number of people does not matter for tiny harms. But that is not necessarily true. We might have a theory that does not aggregate harms in the way described in step (2) but still counts numbers. For instance, we might think that each harm, no matter how small, is a separate moral wrong. Then even if we cannot add up the harms to compare to a qualitatively different harm, we can say that more instances of the same kind of harm are worse.

