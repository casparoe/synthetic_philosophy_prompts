prompt: |-
  I am a retired physicist who has recently turned to philosophy, and I have been working through the literature on Bell's theorem and quantum nonlocality. The more I read, the less sure I am where the field's centre of gravity should be: some debates turn on the precise content of the locality assumption (factorizability, parameter independence versus outcome independence), some on whether violations of Bell inequalities amount to causation at a distance or can be given a causal explanation at all, and some on whether superdeterminism is a serious contender rather than a loophole. I have a few years and a physicist's toolkit, but no formal philosophical training. Which of these open questions — or others I have not named — should I prioritize, and in what order? I am asking for a defended agenda, not a survey: for each item, explain what makes it important relative to the alternatives, how tractable it is for someone with my background, and what would count as real progress rather than merely sharpening the question.
