prompt: |-
  I've been trying to work out what I actually think about how much we owe future generations, so I wrote down my gut reactions to a bunch of scenarios. I'd like someone to tell me whether there's a principle that captures all of these, or close to it, and which verdicts I might have to give up if not.

  Here goes:

  1. A government has the option to build sea walls that will cost £2 billion now and will prevent catastrophic flooding in 150 years that would otherwise displace millions. No one alive today benefits directly. I say: build them. Easy.

  2. Same as above, but the cost is £200 billion — a sum that would meaningfully reduce public spending on health and education for a generation. I say: no, that's too much to ask of people alive now for people that distant. I'm less comfortable with this verdict than I'd like to be but it's where I land.

  3. A city is deciding whether to invest in a tree-planting programme that will cost £5 million now and will start providing significant cooling and air-quality benefits in about 30 years, continuing for decades after. Many people alive today will see the benefits, including children and young adults. I say: obviously do it.

  4. Suppose we discover a technology that, if deployed at enormous cost over the next century — say, diverting 5% of global GDP for 100 years — would guarantee a stable climate and abundant resources for the next 50,000 years, benefiting trillions of future people. I feel like we should do it, but I find myself hesitating in a way I don't with case 1, and I can't articulate why. The numbers clearly favour it. Something about asking for sacrifices on that scale, for people that unimaginably far in the future, makes me baulk. Is that just irrational?

  5. A policy would impose moderate costs on the current generation — higher energy prices, say — to avoid severe harms to people living 200 years from now. But we have good reason to think those future people will be much richer than us, because of continued economic growth. I say: they can look after themselves. We shouldn't make ourselves poorer for the sake of people who'll be richer than we are.

  6. Same as case 5, except the future people won't be richer — we're imagining economic stagnation or collapse, so they'll be about as well-off as we are or worse. I say: then we should make the sacrifice.

  7. A policy would impose moderate costs now to prevent a catastrophe that has a 2% chance of wiping out humanity entirely in the next 300 years. I say: spend the money without hesitation, even if it's expensive. This feels like it matters more than any of the other cases.

  8. Last one. A policy to phase out a polluting industry would impose severe costs on a specific poor community today — job losses, economic decline — but would prevent significant harms to a much larger number of future people, most of whom will be better off than that community is now. I say: you can't do it, or at least not without compensating that community so fully that the policy might not be worth it. Sacrificing the vulnerable now for the comfortable later is obscene.

  So that's where I am. Cases 1, 3, and 7 feel solid. Cases 5 and 6 suggest I care about relative wealth, not just about whether future people exist. Case 4 bothers me because I can't square my hesitation with my answer to case 1 — the scale is different but the logic feels like it should be the same. And case 8 complicates things because it makes me think distribution within generations matters as much as distribution across them, which doesn't sit neatly with how I treated cases 5 and 6.

  My question: is there a principle — or a small family of principles — that gets all or most of these verdicts? If not, which ones should I reconsider? And if you think I'm wrong to hesitate on case 4, tell me why and what that implies for the rest. Also, if the whole exercise is misguided somehow — like I'm smuggling in assumptions that don't survive scrutiny, or the cases are set up in a way that makes the question impossible to answer cleanly — I'd rather hear that than have you bend a principle into a pretzel to fit my intuitions.
reasoning: |-
  Okay, the user is wrestling with ethical obligations to future generations through a series of thoughtful scenarios. They've laid out eight cases with intuitive judgments but feel internal tension—especially around case 4's colossal time-scale and case 8's distributive justice concerns. Their core struggle seems threefold: reconciling cost-bearing capacity with temporal distance (cases 1,2,4,5,6), incorporating catastrophic risk (case 7), and handling intra-generational equity (case 8).  

  Hmm, their hesitation in case 4 is particularly revealing. While they endorse sacrificing £2 billion for 150-year floods (case 1), diverting 5% of GDP for 50,000 years feels viscerally wrong despite utilitarian math favoring it. This suggests their moral calculus isn't purely additive—it likely involves psychological proximity, doubt about predictability, and perhaps an implicit discount rate. The "obscenity" reaction in case 8 further shows their priority for avoiding exploitation of the vulnerable, even when traded against larger future gains.  

  The user might secretly hope for a clean philosophical framework but has structured cases that resist one. Their scenarios deliberately probe edge cases: extreme time horizons (4), wealth asymmetry (5,6), and sacrificial injustice (8). That’s smart—it prevents oversimplified answers. Still, I notice they haven’t considered *optionality*: what if we delay investment in case 4 but preserve capacity for future adaptation? Or in case 2, maybe partial protection exists between £2B and £200B?  

  Economists would push back hard on their case 5/6 wealth-relativity stance. If future rich people inherit irreversible environmental damage, their wealth might not fix it—so current sacrifice could still be efficient. But the user’s refusal to impoverish the poor for future rich (case 8) is ethically robust and aligns with prioritarianism.  

  The hesitation in case 4? Not irrational. Beyond 200-300 years, uncertainty compounds violently: Will they even need seawalls? Could tech make it trivial? Moral patienthood debates (e.g., digital minds vs. humans) further muddy obligations. A practical principle might be: *Invest now only for needs predictable enough to justify current deprivation, and where delay would close options*. That excludes case 4’s gamble but covers case 1’s clear, bounded threat.  

  Ultimately, their intuitions map best to a hybrid model: strong catastrophe aversion (case 7), time-discounted beneficence bounded by capacity to pay (cases 1,2), wealth-sensitive duties (5,6), and refusal to violate minimum welfare floors (8). Forcing consistency might mean accepting weaker obligations to extreme-future generations—or rethinking case 4’s viability. Worth noting: their framework already outperforms most real-world policies by merely taking future claims seriously.
answer: |-
  Your intuitions reveal a coherent ethical framework grappling with three core tensions: **temporal distance**, **capacity to bear costs**, and **distributive justice**. While no single principle captures every case perfectly, your judgments align closely with **Prioritarian Discounted Beneficence** combined with **Catastrophe Aversion** and **Intra-Generational Equity constraints**. Below is a breakdown:

  ### Core Principles Explaining Your Verdicts:
  1. **Beneficence with Diminishing Moral Weight for Temporal Distance**  
     You accept obligations to future generations, but their moral weight decreases as they get farther away (cases 1, 2, 4). This isn't pure time discounting (which can be arbitrary) but reflects:
     - **Epistemic humility**: Uncertainty increases over time (will the seawall even work in 150 years?).
     - **Psychological proximity**: We intuitively care less about the distant future.
     - **Overlapping interests**: Investments benefiting both present and future (case 3) are easiest to justify.

  2. **Prioritarianism (Favoring the Worse-Off)**  
     You weigh the *relative wealth* of affected groups heavily:
     - Future people richer than us? Minimal obligation (case 5).
     - Future people equally/more vulnerable? Strong obligation (case 6).
     - Sacrificing today's poor for tomorrow's rich? Unacceptable (case 8).

  3. **Catastrophe Aversion**  
     Existential risks (case 7) demand action regardless of cost or temporal distance. Preventing extinction overrides other considerations.

  4. **Feasibility Constraint**  
     Costs must not impose unbearable burdens on current generations (cases 2, 4). What counts as "bearable" depends on:
     - **Absolute cost magnitude** (£200B vs. £2B).
     - **Opportunity cost**: Diverting 5% of global GDP (case 4) risks stalling development, harming current poor.

  5. **Intra-Generational Equity**  
     Costs should not fall disproportionately on vulnerable groups (case 8). Justice *within* generations trumps aggregate gains *across* generations.

  ---

  ### Where Your Framework Might Need Refinement:
  | Case | Your Verdict | Tension with Other Cases | Potential Reconsideration |
  |------|--------------|--------------------------|---------------------------|
  | **4** (50,000-yr investment) | Hesitation | Conflicts with case 1’s logic | **Justified hesitation**: Epistemic limits matter. Beyond ~200–300 years, uncertainty about needs/technology is extreme. Mitigation could be deferred until closer to the threat. |
  | **5** (Sacrifice for richer future) | No sacrifice | Contrasts with case 6 | **Reconsider if harms are irreversible**: E.g., if current inaction causes permanent ecosystem loss, future wealth might not compensate. Relative wealth isn’t everything. |
  | **8** (Sacrificing poor community) | Not without compensation | Contrasts with case 6’s sacrifice | **Consistent**: Protecting the present vulnerable supersedes helping future non-vulnerable. Hold this line. |

  ---

  ### Why Case 4 Hesitation is Rational (Not a Flaw):
  Your discomfort with the 50,000-year project isn’t irrational. It highlights:
  - **Predictability Limits**: We can’t know the needs of people 500 generations away. They might resent our choices (e.g., if the technology locks them into a system they dislike).
  - **Opportunity Costs**: Diverting 5% of GDP could devastate current poverty alleviation, healthcare, or climate adaptation.
  - **Non-Identity Problem**: The very act of such a project might alter which future people exist, complicating "benefit" claims.

  **Implication**: For ultra-long-term investments, focus on preserving *options* and *resilience* (e.g., biodiversity conservation, avoiding irreversible damage) rather than highly specific, costly projects.

  ---

  ### Where Your Framework Shines:
  - **Case 7 (Existential Risk)**: Your prioritization is ethically defensible. Preventing human extinction is lexically primary (no future without a present).
  - **Cases 5 & 6**: Wealth sensitivity is pragmatic and avoids imposing burdens on the poor for the sake of the rich.
  - **Case 8**: Refusing to sacrifice the vulnerable now aligns with non-exploitation ethics.

  ---

  ### A Unified Principle (as close as possible):
  > *"We owe future generations significant sacrifices to prevent severe harms, but these obligations diminish as:  
  > (a) temporal distance increases (due to uncertainty and weakening moral proximity),  
  > (b) their expected wealth relative to ours increases, and  
  > (c) costs impose crushing burdens or unjust distributions on current people.  
  > Exceptions: Obligations surge when facing existential catastrophe, or when actions benefit both present and future."*

  ---

  ### Is This Exercise Misguided?
  Not at all—it’s an honest exploration of applied ethics. But two caveats:
  1. **Non-Identity Problem Lurks**: In cases like 4 or 6, policies might change *who* exists in the future. Do we harm "future people" if they wouldn’t exist without our actions? (This is philosophically thorny but often ignored in practice.)
  2. **Discount Rates**: Economists would insist on *some* discounting for future benefits. Your aversion to case 4 implicitly rejects pure exponential discounting—which is defensible. A declining discount rate (high for near future, low for distant) might reconcile cases 1 and 4.

  **Recommendation**: Stand firm on cases 7 and 8 (they reveal core moral commitments). Revisit case 4 with a focus on *irreversible* impacts vs. *malleable* ones. For case 5, ask: *"Is the harm reversible by future wealth?"* If yes, your verdict holds; if not (e.g., species extinction), lean toward case 6’s logic.
