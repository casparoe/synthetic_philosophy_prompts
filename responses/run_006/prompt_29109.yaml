  The user's worry about missing something is valid, but I think they've identified the crux. The persistence of the debate stems from deep differences in what we consider essential to being a person. The illusion of a single answer comes from conflating different aspects: numerical identity (am I the same entity?) versus practical concerns (will the future being remember being me?). 

