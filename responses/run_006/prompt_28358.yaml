answer: |-
  ### (1) The Two Positions
  **Peirce** defines truth as the ideal limit of scientific inquiry: the belief upon which an indefinite community of investigators would *irresistibly* converge after exhaustive testing, were inquiry pushed to its ultimate limit. This "final opinion" is independent of individual biases or temporary expediency. A flat-footed reading might reduce this to naive optimism about consensus or a distant utopia, but Peirce insists it’s a *regulative ideal* structuring actual inquiry—truth is what *would* be agreed upon under idealized conditions, anchoring objectivity.  

  **James** treats truth as what "works" in experience: a belief is true if it proves *expedient* in guiding action, integrating experiences coherently, and satisfying our intellectual and practical needs. Truth is a *process* of verification, not a static property. A flat-footed reading conflates this with subjective convenience or relativism, but James emphasizes *long-term* fit with reality ("satisfactoriness in the long run") and rejects capriciousness. He focuses on truth’s *functional role* in cognition, not a metaphysical definition.  

  ---

  ### (2) Where the Debate Stalls
  The impasse arises because each side interprets the other’s core commitment through a reductive lens, triggering defensive countermoves:  
  - **Jamesians charge Peirce** with offering an empty, unverifiable ideal ("How does 'ultimate convergence' guide belief *now*?"). Peirceans reply that without this ideal, truth loses objectivity and collapses into present utility.  
  - **Peirceans charge James** with subjectivism ("If truth is 'what works,' isn't it just whatever feels useful?"). Jamesians counter that James describes *how truth functions* in inquiry, not a reductive definition, and that "working" requires empirical accountability.  
  - **Peirce’s "convergence"** is misread by Jamesians as a prediction about future science, rather than a logical condition for meaning.  
  - **James’ "expediency"** is misread by Peirceans as immediate gratification, ignoring his constraints of coherence and future consequences.  
  The debate loops: Peirceans demand objectivity beyond context; Jamesians demand practical relevance now. Neither grants the other’s starting point legitimacy.  

  ---

  ### (3) Diagnosis  
  This is **primarily a divergence in explanatory projects**, secondarily exacerbated by verbal ambiguities. The disagreement is *substantive* but not contradictory—it reflects distinct philosophical goals:  
  - **Peirce** provides a *semantic/metaphysical account*: truth is the external *telos* of inquiry, ensuring its independence from current opinion.  
  - **James** offers a *functional/psychological account*: truth is a *value* we ascribe to beliefs that demonstrate instrumental efficacy in lived experience.  
  Calling it "verbal" oversimplifies, as their definitions reflect deeper commitments: Peirce to realism and logic, James to radical empiricism and phenomenology. Yet **ambiguities in "practical" and "ideal"** fuel talking-past-each-other. James’ "practical consequences" could mean *immediate verification* (risking subjectivism) or *long-term holistic integration* (closer to Peirce). Peirce’s "ideal" could mean *logically necessary* or *empirically unreachable* (inviting charges of vacuity). The impasse signals an **ill-posed demand for a single "correct" pragmatist theory of truth**—their accounts answer different questions.  

  ---

  ### (4) What Would Count as Progress  
  Progress requires **reframing the debate as complementary**, not competitive:  
  1. **Clarify the questions**: Explicitly distinguish "What *is* truth?" (Peirce’s focus) from "How does 'truth' *function* in human inquiry?" (James’ focus).  
  2. **Formalize the relationship**: Show how Peircean convergence *enables* Jamesian utility—e.g., beliefs that "work" reliably may *approximate* ideal convergence, while ideal convergence must be *expressed* through practical verification.  
  3. **Dissolve false dichotomies**: Argue that objectivity (Peirce) *requires* functional efficacy (James), and vice versa, within a broader pragmatist epistemology.  
  4. **Shift to methodology**: Instead of debating "truth," focus on shared pragmatist insights—e.g., how inquiry self-corrects (Peirce) *via* experiential testing (James).  
  The impasse dissolves if we accept **pluralism about truth-concepts** within pragmatism. Progress isn’t a verdict for one side, but a meta-framework showing how both accounts are necessary for a full picture of inquiry.
