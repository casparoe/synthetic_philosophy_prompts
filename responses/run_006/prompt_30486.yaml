answer: |-
  Here’s your Q&A prep sheet, ordered by likelihood and damage potential. Weaknesses in replies are noted, and concessions marked.

  ---

  ### **Q&A Prep Sheet: Genuine Moral Dilemmas Colloquium**  
  **Core Thesis**: Genuine moral dilemmas exist (incompatible, undefeated all-things-considered obligations with persistent moral remainders).  

  ---

  1.  **Objection (Kantian Constructivist):**  
      *"Your view violates the rational demand for consistency in practical reason. If an agent *genuinely ought* to do A and *genuinely ought* to do B, but cannot do both, practical reason is self-contradictory. Kant showed morality must be systematizable; your 'remainders' are just emotional responses to tragic choices, not undefeated obligations."*  
      **Reply:** The phenomenology of inescapable *wrongness* and the *demand* for repair (not just regret) point to objective normative residues. Consistency is an ideal of *ideal* agents/systems; moral reality for finite agents in complex worlds may not satisfy it. The remainder *is* the consistent response to the unresolved obligation.  
      **Weakness:** Risks making morality inherently irrational. Doesn't fully reconcile with a constructivist framework where reason *builds* obligations.

  2.  **Objection (Act-Utilitarian):**  
      *"This misdescribes the phenomenology. What you call an 'unfulfilled obligation' is simply the strong negative utility of the unchosen action’s consequences. The 'remainder' is regret for causing avoidable harm, not a persistent 'ought'. There’s only one all-things-considered 'ought': maximize utility. If you failed that, you acted wrongly, full stop. No second obligation survives."*  
      **Reply:** Utilitarianism struggles to explain why compensation/apology to the *specific person wronged* (not general utility-boosting) is morally required, or why some choices feel like *wronging* someone (violating a duty *to them*) even when utility is maximized. The directedness of the remainder suggests a relational obligation, not just aggregate disutility.  
      **Weakness:** Concedes utilitarians won’t experience the *same* phenomenology as deontologists. Relies on intuition about directed duties they reject. **Concede:** In purely consequentialist terms, the "remainder" *is* reducible to disutility.

  3.  **Objection (Deontic Logician - Semantics):**  
      *"Deontic logic explodes if 'OA' and 'OB' are both true while '◊(A ∧ B)' is false. Your 'surviving obligation' implies 'O(not-A)' is true after doing B, but also 'O(not-B)' was true before – yet you did B! How can an obligation persist after its violation *as an obligation*, not just a reason for repair? This violates standard agglomeration or necessitation principles."*  
      **Reply:** Standard deontic logic assumes no dilemmas. We need a paraconsistent or non-agglomerative system. The obligation doesn't *command* the impossible *now* (e.g., "O(un-rescue the child?"), but persists as a *claim* generating duties of repair (Owes compensation/apology *because* of the unfulfilled past obligation). Think "O(past-tense A)" generating present duties.  
      **Weakness:** Formally messy. Requires revising core deontic axioms, which many logicians see as defining "obligation."

  4.  **Objection (Kantian/Constructivist - Agency):**  
      *"You render moral agency incoherent. A rational agent *must* be able to discharge their all-things-considered duty. If fulfilling one 'obligation' leaves another undischarged, the agent was never under two all-things-considered 'oughts' to begin with. The conflict reveals a flaw in the agent's understanding or the situation's description, not in morality itself."*  
      **Reply:** This assumes morality is *for* perfectly rational beings in transparent worlds. Real agents face opaque, conflicting demands rooted in genuine plural values (e.g., fidelity vs. justice). Denying dilemmas sanitizes morality at the cost of its grip on our actual experience of tragic choice.  
      **Weakness:** Pits phenomenology against rationalist ideal theory; hard to persuade those prioritizing systematic coherence.

  5.  **Objection (General - Epistemology of Remainders):**  
      *"How do you distinguish a *genuine* moral remainder (from an undefeated obligation) from mere *agent regret* or *pro tanto residue*? Isn't the 'sense of wrongness' often just irrational guilt or a recognition of the defeated reason's weight?"*  
      **Reply:** Key markers are: (1) The *directedness* of the demand (specific victim claims repair/apology), (2) The *appropriateness* of compensation (not just feeling bad), (3) The persistence *even after* recognizing the necessity/justification of the chosen act. Pro tanto residues don't generate these specific claims.  
      **Weakness:** Relies on contested interpretation of phenomenology. Hard to prove it's *obligation* and not just deep regret + conventional demands.

  6.  **Objection (The One I Hope Nobody Asks - Contingency):**  
      *"Aren't 'dilemmas' merely artifacts of *imperfect* or *conflicting* moral systems/commitments? If we had a truly unified, supreme principle (Kant's CI, AU), conflicts would be resolvable. What's 'genuine' is the tragedy, not the logical contradiction in obligations. Calling them 'genuine dilemmas' reifies our confusion."*  
      **Reply:** This assumes a monistic moral ontology is possible/true. Value pluralism is a live option. Even if monism is true *in principle*, for agents embedded in pluralistic practices *here and now*, dilemmas are experientially and normatively real. The remainders *within our actual normative framework* are genuine.  
      **Weakness:** **Major Concession:** If the audience is committed monists (Kantians/Utils), this *is* just a tragic error. My argument *assumes* pluralism or non-monism is plausible/true. Frame reply as: "Even if dilemmas stem from pluralism, they are genuine *within that framework*, which is ours."

  7.  **Objection (Deontic Logician - Normative Force):**  
      *"If the 'surviving obligation' doesn't entail I *now* ought to do the impossible original act, what *does* 'Obligation X remains in force' *mean* normatively? Only that I ought to do related acts (apologize)? But then it's just a *new*, different obligation triggered by the past, not the *same* obligation surviving."*  
      **Reply:** It means the *justificatory ground* for the repair duties is the *unfulfilled original obligation itself*. The original obligation (e.g., "Save your child") isn't *replaced* by "Apologize"; "Apologize" is *owed because* you failed "Save your child" *and that specific obligation to your child persists as a claim*.  
      **Weakness:** Requires accepting a "past-tense" grounding of present duties in a way that may stretch the concept of a persisting "obligation."

  ---

  **Key Strategy**:  
  1.  **Anchor in Phenomenology**: Constantly return to the *experience* of inescapable wrongness and *directed* demands for repair as data needing explanation.  
  2.  **Target Monism**: Frame the debate as pluralism vs. monism. Concede that monists *must* reject dilemmas but argue pluralism is credible.  
  3.  **Distinguish Remainders**: Emphasize why regret/pro-tanto residue can't explain *specific reparative duties owed to specific others*.  
  4.  **Concede Strategically**: Admit formal/logical challenges and the monist escape hatch. Focus on realism about moral experience within pluralism.  

  **Word Count**: 998 words.
