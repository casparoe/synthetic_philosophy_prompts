  I am giving a department colloquium next month defending the view that genuine moral dilemmas are possible: an agent can be subject to two all-things-considered obligations that cannot both be fulfilled, so that no matter which she fulfills she acts wrongly, and the unfulfilled obligation survives as a moral remainder calling for apology, compensation, or some other response. The audience is a philosophy department whose moral philosophers are mostly Kantian constructivists, with two act-utilitarians and one deontic logician working on conflict and consistency in the semantics of 'ought'; they share a commitment to the consistency of practical reason and will not be moved by tragic cases alone. My positive argument, in brief, is that the pressure to compensate and the sense of inescapable wrongness in such conflicts are best explained by a genuine unfulfilled obligation that remains in force, not by a defeated pro tanto reason. Draft my Q&A prep sheet: the six or seven objections I am likely to get from this audience, ordered by how likely and how damaging they are, phrased as those people would actually phrase them, each with a short reply and a note on where that reply is weakest. Include the objection I am hoping nobody asks, and mark what I should concede rather than defend. Keep the whole prep sheet under 1,000 words.
