  First, I need to map how each theory views QALYs. Welfare egalitarians might see QALYs as a proxy for well-being gains but criticize how they ignore baseline welfare. Resource egalitarians would likely critique the threshold as arbitrary and question if health is the only resource. Capability theorists would argue QALYs are too narrow, missing other capabilities, and might disadvantage disabled people by not valuing their life quality gains equally.

