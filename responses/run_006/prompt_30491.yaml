answer: |-
  To predict the metaphysician's verdicts on the three new cases—a granite boulder, a functioning wristwatch, and a surgically removed dog's hind leg kept alive by perfusion—and to identify the candidate rules she might be following, we must first analyze her published verdicts. She endorses composition for living organisms (dog, tree, bacterium) but denies it for non-organismic cases (sand dune, brick pile, handshake, starling flock, deck of cards). Two candidate rules fit these verdicts equally well: the **Life Rule** and the **Natural Unity Rule**. I'll outline these rules, their predictions for the new cases, and discuss which case best distinguishes them. I'll also provide my bet on the more likely rule and propose a further case to settle the matter.

  ### Candidate Rules
  Both rules are restrictivist and fit all published verdicts. They differ in how they handle non-living natural objects.

  1. **Candidate Rule 1: Life Rule**  
     Composition occurs if and only if the parts constitute a whole living organism.  
     - **Justification**: All positive cases (dog, tree, bacterium) are living organisms with biological functions and metabolic processes. Negative cases lack this: a sand dune (non-living aggregate), brick pile (non-living artifact), handshake (transient interaction), starling flock (group of organisms), and deck of cards (artifact) are not organisms. This rule is simple and aligns with common restrictivist views that privilege life as a necessary condition for composition.

  2. **Candidate Rule 2: Natural Unity Rule**  
     Composition occurs if and only if the object is a natural entity with high cohesion (i.e., it is not a mere heap and exhibits internal unity), which includes whole living organisms and non-living natural objects that are cohesive.  
     - **Justification**: Positive cases are natural, cohesive organisms. Negative cases are either non-natural (bricks, cards), non-cohesive heaps (dune, bricks), or lack unity (handshake as an event, flock as a group). This rule adds a broader natural-kind criterion, allowing composition for non-living natural objects like rocks, which have mineral cohesion, while excluding artifacts and heaps.

  ### Predictions for the New Cases
  Below are the verdict predictions for each rule, with explanations.

  | Case                  | Life Rule Prediction | Natural Unity Rule Prediction | Explanation |
  |-----------------------|----------------------|-------------------------------|------------|
  | **Granite boulder**   | No composition       | **Composition**              | - **Life Rule**: Not alive; no organism. Thus, no composition.  
  \- **Natural Unity Rule**: Natural, cohesive (mineral grains bonded into a solid unit), not a heap. Thus, composition occurs. |
  | **Functioning wristwatch** | No composition       | No composition               | - **Life Rule**: Artifact, not alive.  
  \- **Natural Unity Rule**: Artifact (non-natural), even if functional. Published artifacts (bricks, cards) are denied, so no composition. |
  | **Dog's hind leg (alive, detached)** | No composition       | No composition               | - **Life Rule**: Alive but not a whole organism (e.g., lacks autonomy; it's a part sustained artificially).  
  \- **Natural Unity Rule**: Natural and cohesive, but not a whole organism (similar reasoning). Both rules exclude it as a "partial" entity, fitting the absence of part-organisms in published cases. |

  - **Key takeaway**: Both rules predict "no composition" for the wristwatch and the detached leg, but they diverge on the boulder. The boulder is the only new case with conflicting predictions.

  ### Which Case Does the Most Work to Tell the Candidates Apart?
  The **granite boulder** is the most discriminatory case. It directly tests the core difference between the rules:
  - If she endorses composition for the boulder, it supports the **Natural Unity Rule** (as it includes non-living cohesive natural objects).
  - If she denies composition, it supports the **Life Rule** (as it restricts composition to organisms).

  The wristwatch and detached leg yield identical predictions under both rules, so they don't distinguish the candidates. The boulder is cleanly resolved by her existing restrictivist framework: it is a paradigmatic non-living natural object, unlike the vague or edge cases of the wristwatch (artifact functionality) or leg (partial life).

  ### Which Candidate Rule Would I Bet On?
  I would bet on the **Life Rule**. Reasons:
  - **Simplicity and fit**: The Life Rule cleanly explains all published verdicts without needing additional clauses for "natural" or "cohesion." It is a straightforward, common restrictivist position in metaphysics (e.g., akin to van Inwagen's view in *Material Beings*).
  - **Risk of overextension**: The Natural Unity Rule might require contentious boundaries (e.g., defining "cohesion" or "natural" for edge cases like the detached leg). The metaphysician's published denials for non-living cases (e.g., sand dune) suggest skepticism toward non-organismic composition, making the Life Rule more conservative and likely.
  - **Precedent**: Her focus on organisms in positive cases and absence of non-living positives in the record (e.g., no endorsement of rocks or rivers) hints at life as the decisive factor.

  However, the Natural Unity Rule remains plausible, and the boulder case will be telling.

  ### Further Case to Settle the Matter
  To conclusively distinguish the rules, propose a case that is:
  - **Non-living, natural, and cohesive** (expected under Natural Unity Rule but not Life Rule).
  - **Not in her record or among the new cases**.
  - **Unambiguous** (no life, no artifact, clear cohesion).

  **Proposed case: A naturally occurring stalactite in a cave.**  
  - **Description**: Formed by mineral deposition, it is a solid, cohesive natural object (not a heap) but non-living and non-artifactual.
  - **Predictions**:
    - **Life Rule**: No composition (not alive).
    - **Natural Unity Rule**: Composition (natural and cohesive).
  - **Why it settles the matter**: It isolates the "non-living natural object" factor. If she endorses composition, it confirms Natural Unity Rule; if she denies it, it confirms Life Rule. Unlike the boulder (which might be debated as a "heap" of minerals), a stalactite is unambiguously unified and natural, making it a cleaner test case.

  This case avoids complications from life (like the leg) or artifice (like the watch), providing a direct contrast to the organism-based positives in her record.
