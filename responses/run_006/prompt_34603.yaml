prompt: |-
  I'm an engineering manager at a mid-size company, three years into the job after a decade as an IC. We run blameless postmortems, but we also have quarterly calibration where we're supposed to hold people accountable, and I keep flip-flopping: I either let real carelessness slide because I don't want to be the blame guy, or I come down hard on someone who was basically set up to fail, and either way the team notices and trust erodes.

  A friend who studied philosophy summarized an old essay by P.F. Strawson for me, and it's the first thing that made this feel tractable. The gist as I understand it: holding someone responsible isn't about discovering some fact about whether their will was free. It's about being in a certain stance toward them — feeling resentment or indignation when they screw up, expecting good will, wanting an explanation or an apology. And we suspend those attitudes in two very different ways. An excuse says this particular act didn't express ill will (they didn't know, it was an accident). An exemption says this person isn't the kind of participant we can have those attitudes toward at all — like a small child or someone in a genuinely altered state. And then there's a third thing, the objective stance, where you step out of the participant relationship entirely and treat the person as something to be managed, fixed, or routed around rather than reasoned with. My friend said Strawson thinks taking the objective stance toward someone is always in some way a big deal, even when it's justified.

  I want this turned into a proceedure I can actually run. Please write a decision procedure for after an incident or a pattern of behavior: given a person who caused or contributed to a failure, what questions do I ask, in what order, to decide whether my reactive attitudes (resentment, indignation, demanding an explanation) are appropriate; whether I should excuse the person; whether I should exempt them; or whether I should shift to the objective stance. For each question, say what a sufficient yes looks like, where the procedure stops with a no, and where it has to hand the decision to me as a judgment call rather than a mechanical step. It has to be usable in under an hour before a postmortem or calibration meeting by someone with no philosophy background, and it should respect that my company has HR rules I can't ignore. Then run it on three cases: (1) a senior engineer who shipped a change with no tests because they were rushing to a demo, and it took down production; (2) a junior engineer who caused a data-loss bug on a task they had told their lead they didn't understand; (3) a normally solid engineer whose work has collapsed since a bereavement and who keeps missing handoffs. One of these should come out in a way I won't like, and I want you to say plainly what the procedure cannot do — for instance, whether it can ever tell me if taking the objective stance is a cop-out instead of the right call.
reasoning: |-
  We are creating a decision procedure based on Strawson's framework. The goal is to determine, after an incident or pattern of behavior, which stance to take: reactive attitudes (holding responsible), excuse, exemption, or objective stance.

   The procedure will be a series of questions. We consider:

   1. **Reactive Attitudes Appropriate?** (i.e., should we feel resentment/indignation and expect an explanation/apology?)
   2. **Excuse?** (the particular act did not express ill will, so we excuse the act but not the person)
   3. **Exemption?** (the person is not a full participant in the moral community, so we exempt them entirely for this and perhaps future acts)
   4. **Objective Stance?** (we step out of the participant relationship and treat the person as something to be managed, fixed, or routed around)

   We must also respect company HR rules (which might require certain actions regardless of philosophy).

   The steps:

   Step 1: **Check for Exemption Conditions**
     Question: Is there evidence that the person is currently incapable of participating in ordinary adult interpersonal relationships (like a small child, severe mental illness, or extreme duress that impairs judgment)?
     - Sufficient 'yes': Clear and current evidence of a condition that fundamentally impairs their ability to understand or control their actions in a way that is beyond temporary stress (e.g., psychotic episode, severe cognitive impairment, extreme grief that has been medically recognized as impairing function). If yes, then we exempt and the procedure stops. We do not hold them responsible for this incident, but we may need to provide support or adjust their role (HR rules may require medical documentation, leave, etc.).
     - If no, proceed to Step 2.

   Step 2: **Check for Excuse Conditions**
     Question: Did the person, in this particular incident, act without ill will and without a reasonable opportunity to avoid the failure? (i.e., was it an accident, a mistake despite reasonable care, or were there mitigating circumstances that made it very difficult to avoid?)
     - Sufficient 'yes': Evidence that the person did not intend harm, and that the failure occurred despite reasonable precautions (e.g., they followed procedures but the procedures were flawed, they were under extraordinary pressure that was not of their making, they lacked critical information that they couldn't reasonably obtain). If yes, then we excuse this incident. We do not hold them responsible for this specific act, but we note that they are still a full participant. We then focus on systemic fixes. The procedure stops for responsibility assessment (no reactive attitudes are appropriate for this incident) but we may still need to address the system.
     - If no, proceed to Step 3.

   Step 3: **Check for Reactive Attitudes Appropriateness**
     Question: Did the person act with ill will (or at least without sufficient regard for others) and was the failure within their reasonable control? (i.e., they could have avoided it with reasonable care and they failed to exercise that care)
     - Sufficient 'yes': Evidence of negligence, recklessness, or intentional harm. They had the knowledge and capacity to avoid the failure but did not. In this case, reactive attitudes (like indignation, expecting an explanation or apology) are appropriate. We hold them responsible. The procedure stops here: we proceed with accountability (but note: accountability in a blameless postmortem context might mean focusing on learning and improvement without punitive blame, but in calibration we might note the need for improvement and hold them to account for their actions).
     - If no, then we have a gray area. We might need to consider if the person is in a state that requires exemption (if we missed something in Step 1) or if there are factors that excuse (if we missed in Step 2). But if we are here, it's ambiguous. We then move to Step 4.

   Step 4: **Consider the Objective Stance (as a last resort)**
     Question: Despite the person being a participant and not excused for this act, are there patterns or circumstances that make the reactive attitudes (and the participant stance) ineffective or inappropriate? (This is a judgment call because Strawson warns that taking the objective stance is a big deal and should be rare.)
     - Conditions that might justify the objective stance:
          - Repeated failures despite clear feedback and support (suggesting the person is not responsive to the ordinary participant expectations).
          - The person's behavior is causing such disruption that we must treat them as a problem to be managed (e.g., reassign, performance plan, or terminate) rather than reasoned with.
     - However, note: taking the objective stance should be a last resort because it breaks the normal participant relationship. We must be cautious and involve HR.

   The procedure must be used within an hour. Therefore, we design it to be efficient.

   Important: At any step, if we hit a condition that requires HR involvement (like exemption due to mental health, or considering the objective stance which may lead to performance management), we must involve HR.

   Now, we run the three cases:

   Case 1: Senior engineer who shipped a change with no tests because they were rushing to a demo, and it took down production.

   Step 1: Exemption? 
     - Is the senior engineer currently incapable of participating? (e.g., due to mental health, extreme stress?) 
       Rushing to a demo is common pressure, but unless there's evidence of a breakdown (like a panic attack or severe impairment) we assume no. So, no exemption.

   Step 2: Excuse?
     - Did they act without ill will? Probably yes (they were trying to meet a deadline, not intending harm). 
       But: was it without reasonable opportunity to avoid? Here, a senior engineer knows the importance of tests. Skipping tests is a known risk. They had the opportunity to avoid by writing tests or at least not shipping without tests. 
       So, we might say: not excused because they had the knowledge and the opportunity to avoid (by not skipping tests). 
       However, note: the pressure of the demo might be a mitigating factor. But for a senior, we expect them to manage such pressure appropriately. 
       So, we lean toward no excuse.

   Step 3: Reactive Attitudes Appropriate?
     - Did they act without sufficient regard? Yes, by skipping tests they took an unreasonable risk. 
       Was it within their control? Yes. 
       Therefore, reactive attitudes are appropriate. We expect an explanation and perhaps an apology. 
       We hold them accountable. In calibration, we note this as a performance issue.

   Case 2: Junior engineer who caused a data-loss bug on a task they had told their lead they didn't understand.

   Step 1: Exemption?
     - Is the junior engineer incapable? Probably not (unless they are very new and truly overwhelmed, but even then, they are expected to learn). So, no.

   Step 2: Excuse?
     - Did they act without ill will? Yes, they even expressed their lack of understanding. 
     - Did they have a reasonable opportunity to avoid? They told their lead they didn't understand. It was the lead's responsibility to ensure they had support. The junior might have done all they could by speaking up. Therefore, the failure is excused because the system (the lead not providing adequate support) set them up to fail. 
       So, we excuse. We do not hold the junior responsible. We focus on the lead and the system.

   Case 3: Normally solid engineer whose work has collapsed since a bereavement and who keeps missing handoffs.

   Step 1: Exemption?
     - Bereavement can cause severe impairment. However, we must determine if it rises to the level of exemption. We are told they are "normally solid" and the collapse is since the bereavement. 
       We must consider: is the engineer currently in a state that impairs their ability to function as a normal participant? 
       Note: Grief can be debilitating. If the engineer is experiencing severe depression or inability to concentrate, that might be exempting. 
       But we need evidence. We might ask: have they been given time off? Have they sought support? 
       Without more, we might say: it's possible they are exempt, but we can't assume without more. We might need to check with HR and encourage the engineer to seek help. 
       However, for the sake of the procedure, if we have evidence of significant impairment (e.g., they are clearly not themselves, unable to focus, making uncharacteristic mistakes) then we might say yes, exempt. 
       But note: exemption is not permanent. It's for the current state. 
       Since the problem is ongoing, we might exempt for the recent pattern. 
       However, we must be cautious because exemption removes accountability. 
       Alternatively, we might say: the incident(s) are due to the bereavement, so we excuse each incident (Step 2) rather than exempt the person (Step 1). 

       Let's think: exemption is for when the person is not in a state to be a participant at all. Grief doesn't necessarily mean that, but if it's severe and untreated, it might. 

       We'll go to Step 2.

   Step 2: Excuse?
     - Did they act without ill will? Yes, they are not being careless out of disregard. 
     - Did they have a reasonable opportunity to avoid? Given their bereavement, they may not be functioning at full capacity. So, they might not have been able to avoid the errors. 
       Therefore, we excuse each incident. 

       However, note: if the pattern continues, we might need to consider Step 1 again (exemption) and then Step 4 (objective stance) if the person is not able to function and we need to manage the situation (e.g., leave of absence, reduced workload). 

       But for a single incident (or a pattern caused by bereavement), we excuse. 

       However, the problem is ongoing. We might need to address it at a systemic level (e.g., temporary reduced responsibilities, support). 

       But in our procedure, for the pattern, we might say: each failure is excused, but we must also consider the overall situation. 

       We might then, after excusing, need to consider Step 4 for the pattern? But note: Step 4 is for when we are not going to excuse and not exempt, but then we consider objective stance. Since we excused, we don't go to Step 3 or 4 for the same incident. 

       However, if we are looking at a pattern, we might run the procedure for each incident. But for efficiency, we are considering the pattern as a whole.

       We adjust: the procedure is for an incident or a pattern. For a pattern, we consider:

          - Is the pattern due to an exempting condition? (e.g., the bereavement has caused ongoing impairment that makes them not a full participant) -> then exempt and the pattern is not their fault, but we must manage the situation (with HR).

          - If not, then for each incident in the pattern, we might excuse (if each was due to the bereavement and not within their control at that time).

          - But if the pattern shows that the person is not responsive to support and the situation is not improving, then we might eventually take the objective stance.

       For this case, let's say:

          Step 1 (for the pattern): 
              We ask: is the engineer currently exempt? 
              We might say: they are suffering from grief that is impairing their ability to work. This might be an exempting condition if it is severe. 
              However, we must be cautious: many people grieve and are still participants. We don't want to pathologize normal grief. 
              So, we might not have enough to exempt. 

          Step 2: 
              For each incident (like missing a handoff), we can excuse because they are not at their best and they are trying. 

          But then we note: the pattern is a concern. We might need to move to Step 4 to consider the objective stance for the overall situation.

       However, our procedure is per incident. We are considering a pattern as a series of incidents. We can run the procedure for the most recent incident and then consider the pattern separately.

       Alternatively, we can extend the procedure for patterns:

          Step 1: Exemption? (ongoing condition) -> if yes, then exempt for the pattern.

          Step 2: Excuse? (each incident is excusable) -> then we excuse the pattern as a series of excused incidents.

          But then, if the pattern continues and we have taken steps to support (and the person is not exempt), we might consider Step 3 for the pattern: are they now being negligent by not seeking help or not communicating? 

          However, let's stick to incident-based for simplicity. For the pattern, we can run the procedure for a representative incident.

       For the junior engineer (Case 2), we considered one incident. For the bereaved engineer, we consider one incident of missing a handoff.

          Step 1: Exemption? 
              We don't have clear evidence of severe impairment (unless we know more). We might say: not exempt. 
          Step 2: Excuse? 
              The incident (missing a handoff) occurred because of the bereavement. They are not at their best. They are trying. So, we excuse this incident. 
              Therefore, we do not hold them responsible for this incident.

       However, the pattern requires management. We might need to have a supportive conversation and adjust their work. This is not about accountability for the incident but about managing the situation. We are not in the objective stance yet. We are still in the participant stance, but we are excusing the incidents and providing support.

       If, after providing support and time, the engineer does not improve and the pattern continues, then we might:

          Run the procedure again for a new incident and consider:

            Step 1: Still exempt? If the bereavement is ongoing and severe, we might need to exempt and arrange leave (with HR). 
            But if the bereavement was a while ago and they are not improving, we might not exempt (unless there is a diagnosed condition).

          Then Step 2: If they have been given support and they are still making the same mistakes, we might not excuse because they should be using the support. 

          Then Step 3: If they are not using the support and not improving, then reactive attitudes might be appropriate? But note: they might still be struggling. 

          Alternatively, we might move to Step 4: if the pattern shows they are not responding to the participant stance (expectations, support, feedback), then we take the objective stance and manage them out.

       But for now, for the incident, we excuse.

   Now, the user said one of these should come out in a way they won't like. 

   In Case 1, we held the senior engineer responsible. That might be expected.

   In Case 2, we excused the junior. That might be expected.

   In Case 3, we excused the incident. But if the user is concerned about the pattern and the impact on the team, they might not like that we are excusing each incident and not taking stronger action. 

   However, the procedure cannot force a particular outcome for the pattern. It only addresses responsibility for the incident. 

   What the procedure cannot do:

   - It cannot tell you whether taking the objective stance is a cop-out. That requires judgment. The procedure flags the objective stance as a last resort and requires HR involvement, but it cannot guarantee it is the right call. It can only structure the decision.

   - It cannot replace HR rules. If HR requires a performance improvement plan after three incidents, then you must do that regardless of the philosophy.

   - It cannot account for every nuance. For the bereaved engineer, we might feel that we are excusing too much and the team is suffering. The procedure says: for each incident, if it's due to bereavement and they are trying, we excuse. But then we must manage the situation with HR to provide support and possibly adjust their role. If that doesn't work, then we might eventually have to take the objective stance.

   - The procedure is designed to be used quickly and so it relies on available information. It might miss complexities.

   Let's formalize the procedure:

   **Strawson-Based Responsibility Decision Procedure**

   Input: An incident (or a pattern, but for a pattern, consider each incident and then the pattern as a management issue) involving a person.

   Step 1: Exemption?
     - Ask: Is there clear and current evidence that the person is incapable of participating in ordinary adult interpersonal relationships (e.g., due to severe mental illness, cognitive impairment, extreme duress that is significantly impairing judgment and control)? 
       Note: This step requires sensitivity and may involve HR.
     - Sufficient 'yes': 
          - Evidence: medical documentation, observed severe impairment, or clear and extreme circumstances (e.g., a psychotic episode, a recent traumatic event that clearly impairs function).
          - Outcome: Exempt the person for this incident. They are not held responsible. The focus shifts to support and accommodation (with HR). Stop.
     - If no, proceed to Step 2.

   Step 2: Excuse?
     - Ask: Did the person, in this incident, act without ill will (no intention to harm, no reckless disregard) and without a reasonable opportunity to avoid the failure? 
          - Consider: Did they take reasonable precautions? Were there circumstances beyond their control that made the failure likely? 
          - Note: Ill will includes not just malice but also negligence (if the negligence shows a lack of reasonable regard).
     - Sufficient 'yes':
          - Evidence: They followed procedures but the procedures were flawed; they were under extreme pressure not of their making; they lacked critical information they couldn't reasonably obtain; they had communicated their lack of understanding and did not receive support (like in the junior case).
          - Outcome: Excuse this incident. They are still a full participant. We do not hold them responsible for this incident. Focus on systemic fixes. Stop.
     - If no, proceed to Step 3.

   Step 3: Reactive Attitudes Appropriate?
     - Ask: Did the person act with ill will (or without sufficient regard) and was the failure within their reasonable control?
          - Ill will or lack of regard: e.g., negligence (knew the risk but proceeded anyway), recklessness, or intentional harm.
          - Reasonable control: They had the ability, knowledge, and opportunity to avoid the failure.
     - Sufficient 'yes':
          - Evidence: They ignored known risks, bypassed safety measures without justification, or acted against clear guidelines without a valid reason.
          - Outcome: Reactive attitudes (expecting an explanation, apology) are appropriate. Hold them accountable (in calibration, this may mean noting it as a performance issue). Stop.
     - If no (it's ambiguous), proceed to Step 4.

   Step 4: Consider the Objective Stance (Judgment Call with HR)
     - Ask: Despite the person being a participant and not excused for this act, is the participant stance (reactive attitudes) ineffective or inappropriate due to patterns or circumstances? 
          - Consider: Have there been repeated failures? Has the person been unresponsive to feedback and support? Is the relationship broken?
     - Conditions that might justify the objective stance:
          - A pattern of incidents that hasn't improved with support and feedback.
          - The person's behavior is causing significant disruption and they are not engaging in the participant relationship (e.g., not responding to feedback, not showing good will).
     - Outcome: 
          - If yes, then we take the objective stance. We step out of the participant relationship and treat the person as a problem to be managed (with HR: performance plan, reassignment, or termination).
          - This step requires a judgment call and HR must be involved.

   Additional note: At any step, if HR rules require a specific action (e.g., mandatory reporting, performance process after X incidents), follow those rules.

   Now, we run the cases again with the formal procedure:

   Case 1: Senior engineer
     Step 1: Exemption? No evidence of severe impairment. -> No.
     Step 2: Excuse? 
          - Without ill will? Yes (rushing for demo, not malice).
          - Without reasonable opportunity? They could have written tests or not shipped without tests. They are senior and know better. So, not without opportunity. -> No excuse.
     Step 3: Reactive attitudes? 
          - Without sufficient regard? Yes (they disregarded the risk of no tests).
          - Within control? Yes.
          -> Yes, reactive attitudes appropriate. Hold accountable.

   Case 2: Junior engineer
     Step 1: Exemption? No. 
     Step 2: Excuse? 
          - Without ill will? Yes.
          - Without reasonable opportunity? They told the lead they didn't understand. They did what they could. The lead didn't help. So, they had no opportunity to avoid the bug. -> Excuse. Stop.

   Case 3: Bereaved engineer (for one incident of missing a handoff)
     Step 1: Exemption? 
          - We don't have clear evidence of severe impairment (unless we know the bereavement has caused a condition that meets exemption). Let's say we don't have that evidence. -> No.
     Step 2: Excuse?
          - Without ill will? Yes.
          - Without reasonable opportunity? Because of their grief, they might not have been able to meet the handoff. So, we might say they didn't have a reasonable opportunity (they are impaired by grief). -> Excuse. Stop.

   But the user might not like that we are excusing the pattern. 

   However, the pattern requires management outside of the responsibility assessment. We must:

     - Provide support (counseling, time off, reduced workload).
     - If the pattern continues, then for a new incident we might run the procedure again and if the support was in place and they are still failing, we might not excuse (Step 2: now they have support so they have an opportunity to avoid) and then Step 3 might apply? Or if the grief is still severe, we might then have evidence for exemption (Step 1) and get HR involved for medical leave.

   What the procedure cannot do:

     - It cannot tell you if taking the objective stance is a cop-out. It only structures the decision and flags that it's a big deal. You must use judgment and involve HR.

     - It cannot handle every pattern without reapplication. For patterns, you must reapply the procedure for new incidents and also consider the cumulative effect.

     - It cannot override company policy or legal requirements.

     - It cannot make the hard decisions for you; it only provides a framework to avoid flip-flopping.

     - It cannot guarantee trust; it must be applied consistently and fairly.

   Finally, note that in a blameless postmortem, the focus is on learning. This procedure helps decide whether to hold an individual responsible (which might be necessary for calibration) but in the postmortem, even when holding responsible, we should focus on how to prevent recurrence without personal attacks.

   We output the procedure as a flowchart of questions.
answer: |-
  ### Strawson-Inspired Responsibility Decision Procedure  
  Based on P.F. Strawson's framework, this procedure helps determine whether to hold someone responsible, excuse their action, exempt them, or shift to an objective stance. Designed for speed (under 1 hour) and HR compliance.  

  ---

  #### **Decision Flow**  
  **Input**: A person who caused/contributed to a failure (single incident or pattern).  

  1. **START: Is there evidence of a severe, ongoing incapacity?**  
     - *Purpose*: Check for exemption (person is temporarily/permanently unable to participate in normal accountability relationships).  
     - *Sufficient "yes"*:  
       - Medical documentation (e.g., clinical depression, psychosis).  
       - Observable, acute impairment (e.g., disoriented, incoherent, extreme emotional distress **directly affecting work**).  
       - *Outcome*: **Exempt**. Do not hold responsible. Involve HR for support/accommodations. STOP.  
     - *No*: Proceed to Step 2.  
     - *Judgment call*: If incapacity is plausible but unconfirmed (e.g., rumors of a crisis), pause and consult HR.  

  2. **Was this failure unintentional AND unavoidable given their context?**  
     - *Purpose*: Check for excuse (act didn’t express ill will; blame is inappropriate for **this incident**).  
     - *Sufficient "yes"*:  
       - They lacked knowledge/resources **and** sought help (e.g., flagged risks, asked questions).  
       - External pressures overwhelmed reasonable precautions (e.g., unrealistic deadlines, faulty tooling).  
       - No reckless shortcuts or disregard for known risks.  
       - *Outcome*: **Excuse**. Address systemic fixes, not the person. STOP.  
     - *No*: Proceed to Step 3.  
     - *Judgment call*: If context is ambiguous (e.g., "pressure" vs. "carelessness"), lean toward excuse if no prior patterns.  

  3. **Did they show disregard for risks/team despite having control?**  
     - *Purpose*: Check if reactive attitudes (indignation, demand for explanation) are appropriate.  
     - *Sufficient "yes"*:  
       - They ignored protocols/feedback **without justification** (e.g., skipped tests despite training).  
       - Prioritized self-interest over team well-being (e.g., rushed to look good in a demo).  
       - Had autonomy, knowledge, and time to act safely.  
       - *Outcome*: **Reactive attitudes appropriate**. Expect ownership/apology. Proceed to accountability (calibration). STOP.  
     - *No*: Proceed to Step 4.  

  4. **Has the participant stance repeatedly failed?**  
     - *Purpose*: Decide if shifting to the objective stance (manage, not reason) is justified.  
     - *Sufficient "yes"*:  
       - Pattern persists **despite** feedback, support, and reasonable accommodations.  
       - Person is unresponsive/unreceptive (e.g., deflects blame, ignores help).  
       - Impact is severe (e.g., chronic disruptions, psychological safety at risk).  
       - *Outcome*: **Shift to objective stance**. Involve HR for performance management/exit. STOP.  
     - *Judgment call*: Weigh team health vs. ethical risks of dehumanization. **Always consult HR**.  

  ---

  ### **Procedure Applied to Cases**  
  **Case 1: Senior engineer shipped change with no tests, took down production**  
  - **Step 1**: No evidence of incapacity (rushing ≠ exemption). → **No**.  
  - **Step 2**: Unavoidable? No. They **chose** to skip tests despite knowing risks. Pressure isn’t a full excuse for recklessness. → **No**.  
  - **Step 3**: Disregard for risks? Yes. Senior engineer had control/autonomy; prioritized demo over stability. → **Reactive attitudes appropriate**.  
    - *Accountability*: Expect apology, discuss in calibration. Fix: Review release protocols.  

  **Case 2: Junior engineer caused data-loss bug after telling lead they didn’t understand**  
  - **Step 1**: No incapacity. → **No**.  
  - **Step 2**: Unavoidable? **Yes**. They flagged ignorance; lead failed to support. No ill will. → **Excuse**.  
    - *Outcome*: Blame system (lead/onboarding), not junior. Fix: Improve mentorship checks.  

  **Case 3: Normally solid engineer collapsed after bereavement, misses handoffs**  
  - **Step 1**: **Exempt? Judgment call**. Grief isn’t automatic exemption. If they’re unable to focus despite accommodations (e.g., therapy, reduced load), exempt. Else → **No**.  
    - *Assume insufficient evidence for exemption* → Proceed.  
  - **Step 2**: Unavoidable? **Yes**. Bereavement impairs capacity; failure expresses grief, not ill will. → **Excuse**.  
    - *Outcome*: Support, not blame. Adjust workload temporarily.  
  - **Why you won’t like this**: If the pattern continues despite support, you **must** loop back to Step 1 (exemption) or Step 4 (objective stance). Excusing individual incidents feels insufficient when the team suffers – but the procedure forces humane prioritization of recovery over accountability.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Judge if the objective stance is a cop-out**  
     - The procedure flags when the objective stance *might* be justified (Step 4) but **cannot** determine if you’re using it to avoid hard conversations. Only rigorous documentation of support efforts, HR guidance, and team feedback can mitigate this risk.  

  2. **Override HR policies**  
     - If HR mandates accountability after X incidents, the procedure must align. It augments – doesn’t replace – rules.  

  3. **Handle ambiguous malice**  
     - It assumes good faith unless evidence shows recklessness (Step 3). True negligence (e.g., laziness) is hard to prove; err toward excuse without patterns.  

  4. **Solve cultural problems**  
     - Trust erodes if the team sees inconsistent application. Use the procedure **transparently** to show fairness.  

  **Key Takeaway**: This tool prevents flip-flopping by separating *human context* (exempt/excuse) from *choices* (reactive/objective). It makes accountability deliberate, not reflexive.
