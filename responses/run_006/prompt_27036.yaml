  Considering their background in journalism, they need a term that's both accurate and accessible. Proposing a new term with a clear definition would be helpful. "Conceptual Gear-Shifting" makes sense—it conveys switching between frameworks. I should define it clearly, distinguishing it from pluralism and operationalism. 

  Also, boundary cases are important. When does this practice become problematic? If the shifts are inconsistent or unacknowledged, it might cause confusion. But when flagged, like using different terms (e.g., "evolutionary species" vs. "conservation units"), it's more transparent. The user might want examples to illustrate this in their writing. 

