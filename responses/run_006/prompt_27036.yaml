answer: |-
  Based on your precise description, there **is not a widely established, specific term for the deliberate, context-dependent shifting between incompatible species concepts within a single scientific paper.** Your observation is astute and highlights a crucial pragmatic reality in biological research that sits adjacent to, but distinct from, formal philosophical pluralism.

  Here's a breakdown of the nearest concepts and how your observed practice differs, followed by a proposed term and definition:

  1.  **Species Pluralism (Philosophical):**
      *   **What it is:** The philosophical position that there is no single "correct" species concept because the term "species" refers to different kinds of biological entities (evolutionary lineages, reproductive communities, ecological units), and multiple concepts are valid for different purposes or taxa.
      *   **How your practice differs:** Pluralism is the *underlying justification* or philosophical foundation *enabling* the practice you observe. However, pluralism itself is a meta-level stance *about* species concepts. The practice you describe is the *operational application* of that pluralism *within the practical workflow of a single scientific argument*. It's the tactical switching between concepts as tools to solve specific sub-problems within one investigation.

  2.  **Operational Species Concept / Pragmatic Species Delimitation:**
      *   **What it is:** Using a specific methodology (e.g., genetic distance, morphological diagnosability, monophyly in a gene tree) to *delimit* species boundaries for a particular study, often acknowledging it's a proxy or best approximation.
      *   **How your practice differs:** This typically involves choosing *one* operational method/concept *for the primary delimitation* in a paper. Your practice involves *multiple* operational concepts being used *sequentially within different sections* of the same paper, even if they lead to conflicting groupings for the same populations, because each concept serves a distinct analytical purpose.

  3.  **Conceptual Context-Dependence:**
      *   **What it is:** The widely accepted idea that the *meaning* or *application* of "species" depends on the biological context (e.g., bacteria vs. birds) or the question being asked (e.g., speciation vs. biodiversity inventory).
      *   **How your practice differs:** Context-dependence explains *why* the shifting happens *across* different studies or fields. Your practice is the *intentional leveraging of this context-dependence **within** the confines of a single paper's narrative and argument structure*.

  4.  **Ambiguity / Lack of Rigor (Negative Framing):**
      *   **What it is:** Unintentional sloppiness or failure to define terms, leading to confusion.
      *   **How your practice differs:** You explicitly state this is *not* the case. The shifts are deliberate, acknowledged (implicitly or explicitly by the context), and serve a necessary function for the paper's argument. Forcing one concept would weaken the science.

  **Proposed Term: Conceptual Gear-Shifting (in Species Delimitation/Usage)**

  *   **Definition:** The intentional and context-dependent practice within a single scientific work (e.g., a research paper) of employing different, potentially incompatible, species concepts or operational definitions to address distinct sub-questions or analytical goals, where adherence to a single concept would impair the effectiveness or clarity of the argument for those specific sub-goals. This practice leverages the inherent pluralism of the species concept while navigating the practical demands of integrative biological research.
  *   **Key Characteristics:**
      *   **Intra-work:** Occurs within the boundaries of a single publication or coherent argument.
      *   **Deliberate:** The shifts are conscious choices made by the authors to best serve the specific analytical need of each section (e.g., gene flow analysis vs. conservation assessment).
      *   **Context-Driven:** The concept used in each instance is chosen because it is the most appropriate or informative tool *for that specific analytical task*.
      *   **Functional Justification:** The shift improves the paper's ability to answer its specific sub-questions or communicate complex realities.
      *   **Pluralism Underpinned:** Relies on the acceptance that no single concept universally applies, but without necessarily engaging in the philosophical debate within the paper.
  *   **Boundary Cases:**
      *   **Clear Case:** A phylogenetics paper that: (1) Uses monophyly (Phylogenetic Species Concept) in the tree-building section to delimit lineages; (2) Discusses gene flow barriers between specific *pairs* of those lineages using the Biological Species Concept (interbreeding); (3) Uses the count of morphologically diagnosable units (Morphological Species Concept) from the same lineages in a conservation prioritization table because that's the data available to managers. Each shift serves the section's purpose.
      *   **Not Gear-Shifting (Ambiguity):** Using "species" throughout a paper without clear definition, and the meaning seems to drift inconsistently without apparent justification related to the specific analysis being performed in each section, leading to reader confusion.
      *   **Not Gear-Shifting (Strict Operationalism):** A paper that explicitly adopts *one* operational concept (e.g., 98% sequence similarity for bacteria) and applies it consistently throughout, even if it's acknowledged as imperfect for some purposes.
      *   **Blurry Boundary (Partial Flagging):** A paper that generally uses one concept but has a dedicated "Conservation Implications" section where it explicitly states: *"For the purpose of conservation prioritization based on potential unique adaptations, we consider populations X and Y as distinct management units (equivalent to species in this context), despite evidence of recent gene flow discussed earlier."* This is still gear-shifting, but the shift is explicitly flagged.
      *   **Blurry Boundary (Different Terms):** A paper that avoids the ambiguity by using distinct terms in different sections: "evolutionarily significant units (ESUs)" for lineages in the phylogeny section, "syngameons" when discussing gene flow complexes, and "taxonomic species" or "conservation units" in the applied section. This avoids the *word* "species" shifting, but represents the same underlying conceptual gear-shifting regarding the fundamental units being discussed.

  **Why "Conceptual Gear-Shifting"?**

  *   **Gear-Shifting:** Evokes the idea of changing tools (concepts) to match the terrain (analytical task) for optimal performance (effective argumentation). It implies a skilled, deliberate action.
  *   **Conceptual:** Clearly specifies the level at which the shifting occurs – the underlying definitions and operational criteria for what constitutes a "species" or fundamental unit.
  *   **in Species Delimitation/Usage:** Anchors the term firmly in the domain you're observing.

  This term captures the dynamism, intentionality, and practicality you describe, distinguishing it from broader philosophical pluralism, simple operational choices, unintentional ambiguity, or context-dependence across different studies. It highlights a sophisticated (though sometimes under-acknowledged) maneuver scientists employ to navigate the complexities of biology within the constraints of a single narrative.
