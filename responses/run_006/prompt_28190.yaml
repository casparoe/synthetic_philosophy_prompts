  ok so ive been going back and forth on anthropics for like a year and i want someone to tell me if my positions actually fit together or if im papering over a contradiction. here's my current stack:

  (1) the doomsday argument is a valid bayesian argument. if you accept SSA, you really should update toward doom-soon. i dont think theres a math error in the standard formulation.

  (2) but i dont accept SSA. i think SIA is the right approach to indexical uncertainty.

  (3) SIA neatly blocks the doomsday argument, which is a big win for it.

  (4) however, SIA has the presumptuous philosopher problem, and honestly that seems like a genuine reductio to me. i dont see a clean way out of it.

  (5) im a thirder in sleeping beauty.

  (6) i think your answer to sleeping beauty should constrain your anthropic reasoning — if youre a thirder you should lean SIA, if youre a halfer you should lean SSA. ive heard people deny this (e.g. some say you can be a thirder with SSA) but it feels right to me.

  (7) i think the fact that SIA implies we should be vastly more confident in large-civilization cosmological scenarios is fine actually — thats not a bullet i have a problem biting.

  (8) i think SSA has its own devastating problems, like the cold-room / two-batch cases where it tells you to be confident youre in a small world even when you know theres a big world out there.

  so i guess my question is: i want to reject the doomsday argument, keep thirding, and avoid the presumptuous philosopher problem. does (1)-(8) give me a way to do that, or am i trying to have it three ways? in particular im worried that (4) and (7) are in tension — if i think the presumptuous philosopher is a reductio, can i really say the large-civilization implication is fine? and is (6) actually right, or is the connection between thirding and SIA looser than i think?

  go through and rank the tensions by severity, tell me which are real and which only look like tensions, and say what the cheapest revision would be to get a consistent package.
