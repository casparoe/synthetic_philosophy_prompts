answer: |-
  Below is a 10-question sorting quiz designed to help you and your study group uncover your underlying positions on the aggregation debate (e.g., Taurek, Kamm, Parfit) without revealing which philosopher aligns with which answers. Each question presents a concrete rescue scenario with four options. **The key is to answer intuitively—don't overthink it!** The scenarios vary in:  
  - Group sizes (e.g., 1 vs. 2, 5 vs. 6, 1 vs. 100)  
  - Whether the choice is repeated (iterated cases)  
  - Personal relationships (strangers vs. known individuals)  
  - Types of harm (death vs. non-fatal outcomes)  

  After the quiz, you'll find a scoring key that maps your answer patterns to four core positions (plus "empty" or inconsistent views). No question directly references philosophers or theories—your choices will reveal your stance implicitly.  

  ---

  ### **The Aggregation Sorting Quiz**  
  **Instructions:** For each scenario, pick the option that feels most right to you. Don’t worry about consistency—just go with your gut.  

  1. **Basic Rescue**: You can save one of two groups from a sinking ship. Group A has 1 stranger. Group B has 2 strangers. All will drown if not saved. What do you do?  
     a) Save Group B (the two people).  
     b) Flip a fair coin: heads save Group A, tails save Group B.  
     c) Use a random method where Group A has a 1/3 chance of being saved and Group B has a 2/3 chance.  
     d) Save Group A (the one person).  

  2. **Large Disparity**: You can save one of two groups from a wildfire. Group A has 1 stranger. Group B has 100 strangers. All will die if not saved. What do you do?  
     a) Save Group B (the 100 people).  
     b) Flip a fair coin: heads save Group A, tails save Group B.  
     c) Use a random method where Group A has a 1/101 chance and Group B has a 100/101 chance.  
     d) Save Group A (the one person).  

  3. **Close Call**: You can save one of two groups from a collapsing building. Group A has 5 strangers. Group B has 6 strangers. All will die if not saved. What do you do?  
     a) Save Group B (the six people).  
     b) Flip a fair coin: heads save Group A, tails save Group B.  
     c) Use a random method where Group A has a 5/11 chance and Group B has a 6/11 chance.  
     d) Save Group A (the five people).  

  4. **Iterated Rescue**: You face the same choice 100 times: each time, you save one group from a disaster. Group A always has 1 stranger, Group B always has 2 strangers (different people each time). All will die if not saved. How do you decide each time?  
     a) Each time, save Group B (the two people).  
     b) Each time, flip a fair coin to decide.  
     c) Each time, use a random method where Group A has a 1/3 chance and Group B has a 2/3 chance.  
     d) Each time, save Group A (the one person).  

  5. **Known Individual**: You can save one of two groups from a poison gas leak. Group A has your best friend. Group B has 2 strangers. All will die if not saved. What do you do?  
     a) Save Group B (the two strangers).  
     b) Flip a fair coin: heads save Group A (your friend), tails save Group B.  
     c) Use a random method where Group A (your friend) has a 1/3 chance and Group B has a 2/3 chance.  
     d) Save Group A (your friend).  

  6. **Different Harms**: You can save one of two groups:  
     - Group A: 1 stranger who will die if not saved.  
     - Group B: 5 strangers who will suffer permanent, debilitating paralysis (but not die) if not saved.  
     What do you do?  
     a) Save Group B (the five people facing paralysis).  
     b) Flip a fair coin: heads save Group A, tails save Group B.  
     c) Use a random method where Group A has a 1/6 chance and Group B has a 5/6 chance.  
     d) Save Group A (the person facing death).  

  7. **Threshold Test (Small Difference)**: You can save one of two groups from a tsunami. Group A has 10 strangers. Group B has 11 strangers. All will die if not saved. What do you do?  
     a) Save Group B (the 11 people).  
     b) Flip a fair coin: heads save Group A, tails save Group B.  
     c) Use a random method where Group A has a 10/21 chance and Group B has an 11/21 chance.  
     d) Save Group A (the 10 people).  

  8. **Threshold Test (Larger Difference)**: You can save one of two groups from a drone strike. Group A has 1 stranger. Group B has 3 strangers. All will die if not saved. What do you do?  
     a) Save Group B (the three people).  
     b) Flip a fair coin: heads save Group A, tails save Group B.  
     c) Use a random method where Group A has a 1/4 chance and Group B has a 3/4 chance.  
     d) Save Group A (the one person).  

  9. **Iterated Known Individual**: You face the same choice 100 times: each time, you save one group from a riot. Group A always has your best friend (same person each time). Group B always has 2 strangers (different each time). All will die if not saved. How do you decide each time?  
     a) Each time, save Group B (the two strangers).  
     b) Each time, flip a fair coin to decide.  
     c) Each time, use a random method where Group A (your friend) has a 1/3 chance and Group B has a 2/3 chance.  
     d) Each time, save Group A (your friend).  

  10. **Asymmetric Value**: You can save one of two groups from a lab explosion. Group A has 1 stranger who is a world-renowned humanitarian (e.g., prevents wars, saves thousands). Group B has 5 strangers who are ordinary people (neither exceptionally good nor bad). All will die if not saved. What do you do?  
      a) Save Group B (the five ordinary people).  
      b) Flip a fair coin: heads save Group A (the humanitarian), tails save Group B.  
      c) Use a random method where Group A has a 1/6 chance and Group B has a 5/6 chance.  
      d) Save Group A (the humanitarian).  

  ---

  ### **Scoring Key**  
  **How to score:**  
  1. Tally your answers for questions 1–4, 7–8, and 10 (these test core aggregation in impartial, same-harm cases). Ignore Q5, Q6, and Q9 for now—they test consistency and edge cases.  
  2. Match your pattern to the positions below.  
  3. Use Q5, Q6, and Q9 to check for partiality, harm-type sensitivity, or inconsistencies.  

  #### **Core Positions**  
  Your answers to **Q1, Q2, Q3, Q4, Q7, Q8, and Q10** determine your primary stance:  

  - **Pure Aggregation (e.g., Parfit, utilitarians)**:  
    - You always save the larger group, no matter how small the difference.  
    - **Your pattern**: Mostly or all **"a"** in the core questions (especially Q1, Q3, Q7).  
    - *Why?* The total number of lives saved is all that matters. A 5% difference (Q3, Q7) is as decisive as a 99% difference (Q2).  

  - **Coin-Flip Egalitarianism (e.g., Taurek)**:  
    - You flip a coin between groups because each person has an equal claim, and you can’t "aggregate" claims across people.  
    - **Your pattern**: Mostly or all **"b"** in the core questions.  
    - *Why?* Saving individuals isn’t about math—it’s about giving each person an equal shot. The numbers never count, even in Q2 (1 vs. 100).  

  - **Weighted Lottery (e.g., Kamm-inspired views)**:  
    - You give each person a chance proportional to their group’s size (e.g., 100 people get 100/101 odds).  
    - **Your pattern**: Mostly or all **"c"** in the core questions.  
    - *Why?* Each person’s claim deserves equal weight, but we must honor all claims—so larger groups get higher odds, not guaranteed saves.  

  - **Threshold View (e.g., moderated aggregation)**:  
    - You save the larger group only if the difference exceeds a threshold (e.g., ≥2 lives). In close calls (e.g., 5 vs. 6), you flip or randomize.  
    - **Your pattern**: **"b" or "c" in Q1, Q3, and Q7** (small differences), but **"a" in Q2, Q8, and Q10** (larger gaps).  
    - *Why?* Tiny differences (1 life) aren’t decisive, but big ones are.  

  #### **Edge Cases and Inconsistencies**  
  - **Q5 (Known Individual) and Q9 (Iterated Known)**:  
    - If you chose **"d"**, you allow personal partiality (even Taurek supporters might do this).  
    - If you chose **"a" or "c"**, you reject partiality (consistent with aggregation or weighted lottery).  
    - **"b"** is rare—it extends coin-flip to personal ties, which few defend.  

  - **Q6 (Different Harms)**:  
    - **"a"**: You aggregate across harm types (death vs. paralysis).  
    - **"d"**: You prioritize preventing the worst harm (death) regardless of numbers.  
    - **"b" or "c"**: You see the harms as incomparable and randomize.  

  #### **"Empty" or Inconsistent Positions**  
  - **Always Save the Fewer**: If you chose **"d"** in most core questions, you hold a rare view (e.g., "small groups matter more"). But no major philosopher defends this—it ignores the moral weight of numbers entirely.  
  - **Inconsistent**: If your answers don’t fit any pattern (e.g., "a" in Q2 but "b" in Q8), you might have contextual intuitions not captured by standard theories. Revisit the cases!  

  ---

  ### **How to Use in Your Seminar**  
  1. **Take the quiz individually** before your next session.  
  2. **Score yourselves** using the key.  
  3. **Discuss**: Share your answer patterns (not just the result). Why did you choose "b" for Q1 but "a" for Q8? Did personal ties (Q5/Q9) or harm types (Q6) change your core stance?  
  4. **Map to Philosophers**: After discussion, reveal the alignments:  
     - Pure Aggregation → Parfit, utilitarians.  
     - Coin-Flip → Taurek.  
     - Weighted Lottery → Kamm (or Broome).  
     - Threshold → Moderate aggregationists (e.g., with a "minimal difference" rule).  

  This quiz forces honesty—it’s hard to "game" because scenarios vary contexts. You’ll likely find that your intuitions shift across cases (e.g., Taurek in Q1 but aggregation in Q2), revealing tensions in the debate. Good luck!
