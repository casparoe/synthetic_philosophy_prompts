prompt: |-
  You're a philosopher of mind who has facilitated a few adversarial collaborations, and you're good at drafting joint statements that both sides will actually sign rather than just grimace at. I need one for two people in my reading group who have been arguing for months about the paradox of phenomenal judgment.

  One of them is an epiphenomenalist about phenomenal consciousness: she thinks qualia are real, but causally inert. The hurtfulness of pain, the redness of red — none of it does any causal work, not even in producing the very judgments we make about our own experience. The other one (I'm not sure of the standard label — "efficacious phenomenalist"?) thinks experiences themselves make a causal difference, in particular to our judgments that we're having them.

  Draft the joint statement their adversarial collaberation would produce. Format it as: (1) a numbered agreed-claims section — about how they'll use "phenomenal consciousness," what the paradox of phenomenal judgment is, what the standard anti-epiphenomenalist argument says, what the standard epiphenomenalist reply says, and what a fair test would have to look like; (2) a disagreements table, with each side's own view stated in wording that side would accept, and a column marking which rows are substantive and which are partly verbal; (3) a cruxes section — the sub-questions such that settling one would move at least one side; and (4) for each crux, a concrete argument or case both sides agree bears on it (self-stultification, the evolutionary argument, the knowledge argument, blindsight, a p-zombie's reports, something like that), with each side's prediction recorded in advance.

  Don't let the agreed claims go vacuous, but also don't put words in either side's mouth. I suspect part of their fight is verbal — something about what "cause" means and whether causation has to be physical — so say which part is verbal and which isn't, if that's how the drafting comes out. The work is in the formulations.

  Take your time working through the possible formulations and cruxes before you write, but when you output, start directly with the document itself — no preface, no "here is a draft," no commentary afterward.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between an epiphenomenalist (E) and an efficacious phenomenalist (EP) regarding the paradox of phenomenal judgment.

  First, we must agree on the terminology and the problem:

  - **Phenomenal consciousness**: Both agree that it refers to the subjective qualitative character of experiences — what it is like to have them (e.g., the hurtfulness of pain, the redness of red). This is often called "qualia."

  - **The paradox of phenomenal judgment**: This is the tension between the following:
    (a) Our strong intuition that our judgments about our own experiences (e.g., "I am in pain") are caused by those very experiences.
    (b) The challenge of integrating phenomenal properties into the physical causal story of the world, especially if one holds that the physical is causally closed (every physical effect has a sufficient physical cause).

  - **Standard anti-epiphenomenalist argument**: If phenomenal properties are causally inert, then our judgments about them cannot be caused by them. But such judgments are reliably correlated with the presence of the phenomenal properties they report. Moreover, we take these judgments as evidence for the existence of phenomenal properties. If the judgments are caused by physical states alone, and not by the phenomenal properties, then we have no reason to believe that phenomenal properties exist at all. This is the self-stultification (or self-undermining) argument: epiphenomenalism undermines our justification for believing in qualia.

  - **Standard epiphenomenalist reply**: The epiphenomenalist can respond that the physical states that cause our judgments about our experiences are also the ones that cause the phenomenal properties (as byproducts). Thus, the judgments are reliably correlated with the phenomenal properties, even though the latter do not cause the former. Therefore, our judgments can still be accurate and justified, even if the phenomenal properties are causally inert.

  - **Fair test**: Both sides agree that a fair test would involve a scenario where, if epiphenomenalism is true, the phenomenal properties are absent but the physical states (and thus the judgments) remain the same, and we can see whether the judgments still occur. Conversely, if efficacious phenomenalism is true, then removing the phenomenal properties (while keeping the physical states) should affect the judgments. However, since we cannot directly manipulate phenomenal properties independently of physical states, we must rely on thought experiments or indirect empirical evidence.

  Now, we structure the document:

  1. **Agreed Claims**: Numbered list of agreed-upon points.
  2. **Disagreements Table**: Rows with each side's view, and a column indicating whether the disagreement is substantive or partly verbal.
  3. **Cruxes**: Key sub-questions that would move at least one side if settled.
  4. **Arguments/Cases for Each Crux**: For each crux, a concrete case both agree bears on it, and each side's prediction.

  Let's draft:

  ---

  **Joint Statement on the Paradox of Phenomenal Judgment**

  **1. Agreed Claims**

  1.1. **Phenomenal Consciousness**: We agree that "phenomenal consciousness" refers to the subjective, qualitative aspects of mental states — the 'what it is like' for a subject to be in a particular mental state. Examples include the hurtfulness of pain and the sensory quality of seeing red.

  1.2. **The Paradox of Phenomenal Judgment**: We agree that there is a tension between the following:
     (a) The strong intuition that our first-person judgments about our own phenomenal states (e.g., "I am experiencing pain") are typically caused by those phenomenal states.
     (b) The challenge of accounting for how phenomenal properties, if they are non-physical, can have causal effects in a world that appears to be governed by physical causal closure (i.e., every physical effect has a sufficient physical cause).

  1.3. **Standard Anti-Epiphenomenalist Argument (Self-Stultification Argument)**: If phenomenal properties are causally inert (epiphenomenal), then they cannot cause our judgments about them. But then, our judgments about phenomenal properties are caused solely by physical states. This threatens to undermine our justification for believing in phenomenal properties because:
     - The reliability of our judgments about phenomenal properties would be coincidental if they are not caused by the phenomenal properties themselves.
     - Without a causal connection, it is unclear how we can have knowledge of phenomenal properties.

  1.4. **Standard Epiphenomenalist Reply**: The epiphenomenalist can argue that the same physical state that gives rise to the phenomenal property also causes the judgment about that property. Thus, the judgment is reliably correlated with the phenomenal property, even though the phenomenal property does not cause the judgment. This correlation provides a basis for the accuracy and justification of our judgments without requiring the phenomenal property to be causally efficacious.

  1.5. **Fair Test**: A fair test for the causal efficacy of phenomenal properties would require a scenario in which the physical substrate of an experience is held constant while the phenomenal property is varied independently (or vice versa). However, we acknowledge that such manipulation is not currently feasible in practice. Therefore, we rely on thought experiments (e.g., philosophical cases) and indirect empirical evidence (e.g., from neuroscience or psychology) to evaluate the positions.

  **2. Disagreements**

  We have the following disagreements, which we classify as either substantive (S) or partly verbal (V). A partly verbal disagreement involves differences in the meaning or usage of terms, but may still have substantive implications.

  | Disagreement                                                                                                                               | E's View (Epiphenomenalist)                                                                                                 | EP's View (Efficacious Phenomenalist)                                                                                                 | Type |
  |--------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|------|
  | 2.1. **Causal Efficacy of Phenomenal Properties**: Are phenomenal properties causally efficacious in producing judgments about them?       | Phenomenal properties are not causally efficacious. They are byproducts of physical processes and do not cause any judgments. | Phenomenal properties are causally efficacious. They play a role in causing our judgments about our own experiences.                  | S    |
  | 2.2. **Nature of Causation in Mental Causation**: What kind of causation is involved in mental causation?                                  | All causation is physical causation. If something has a causal effect, it must be physical. Phenomenal properties, being non-physical, cannot cause anything. | Causation is not limited to the physical domain. Phenomenal properties can have a distinct kind of causal influence, even if they are non-physical. | V/S  |
  | 2.3. **The Role of Phenomenal Properties in Justifying Beliefs**: Can we have justified beliefs about our phenomenal states if they are epiphenomenal? | Yes, because the physical state that causes the judgment also causes the phenomenal property, ensuring a reliable correlation. | No, because without a causal connection, the judgment is not responsive to the phenomenal property, so it cannot be justified.        | S    |

  Notes on Type:
  - 2.1 is substantive (S).
  - 2.2 is partly verbal (V) because it depends on what we mean by "causation" (e.g., whether causation must be physical or can be broader). However, it is also substantive because it leads to different views on the possibility of non-physical causation.
  - 2.3 is substantive (S).

  **3. Cruxes**

  The following are key sub-questions (cruxes) that, if resolved, would change at least one party's position. We list each crux and then a concrete argument or case that both sides agree bears on it, along with each side's prediction.

  3.1. **Crux: The Self-Stultification Argument**
     - **Case**: The Knowledge Argument (Mary's Room): Mary is a scientist who knows all physical facts about color vision but has never seen red. When she sees red for the first time, she learns something new — what it is like to see red. The question is: does this new knowledge imply that phenomenal properties are causally efficacious in producing her judgment?
       - **E's Prediction**: Mary's judgment "Now I know what red looks like" is caused by the physical changes in her brain when she sees red. The phenomenal property of seeing red is caused by these physical changes but does not cause the judgment. The judgment is caused by the physical changes alone. Thus, the knowledge argument does not show that phenomenal properties are causally efficacious.
       - **EP's Prediction**: Mary's judgment is directly caused by her new phenomenal experience. Without the phenomenal property, the physical state alone (which she already knew) would not produce this judgment. Thus, the knowledge argument supports the causal efficacy of phenomenal properties.

  3.2. **Crux: The Evolutionary Argument**
     - **Case**: If phenomenal properties are epiphenomenal, they would not be subject to natural selection because they have no causal effects. But if they are not selected for, why are they correlated with adaptive behaviors (e.g., pain with withdrawal)?
       - **E's Prediction**: The physical states that cause pain behavior and the feeling of pain are selected for. The phenomenal property of pain is a byproduct and is not selected for, but it is correlated with the adaptive physical state. Thus, the correlation is explained without causal efficacy.
       - **EP's Prediction**: Phenomenal properties are causally involved in producing adaptive behaviors (e.g., the hurtfulness of pain causes us to avoid injury). Therefore, they are subject to natural selection and their presence is explained by their causal role.

  3.3. **Crux: The Possibility of Zombie Judgments**
     - **Case**: Philosophical zombies are physical duplicates of humans but without any phenomenal consciousness. Would a zombie make the same judgments about its experiences (e.g., "I am in pain") as a conscious human?
       - **E's Prediction**: Yes, because the judgments are caused by physical states alone, which are identical in the zombie. The zombie would report "I am in pain" in the same circumstances as a conscious human, even though it has no phenomenal pain. This supports epiphenomenalism.
       - **EP's Prediction**: No, without phenomenal consciousness, the zombie would not make the same judgments. Or if it did, the judgments would be false or unjustified. But in any case, the absence of phenomenal properties would make a difference in the judgment, which suggests that phenomenal properties are causally efficacious. (Note: EP might accept that the zombie makes the same verbal reports but argues that these are not genuine judgments because they lack the usual causal connection to experience.)

  3.4. **Crux: Blindsight and Reports of Experience**
     - **Case**: In blindsight, patients can respond to visual stimuli in their blind field without conscious awareness. When asked what they see, they often deny seeing anything, but can guess with high accuracy. What does this imply about the causal role of phenomenal consciousness in judgments?
       - **E's Prediction**: In blindsight, the absence of phenomenal consciousness does not prevent the ability to make accurate guesses (driven by unconscious processing). However, when they deny seeing anything, that judgment is caused by the absence of the usual physical correlates of conscious vision. This supports that judgments about experience are caused by physical states, not by phenomenal properties.
       - **EP's Prediction**: In blindsight, the absence of phenomenal consciousness explains why the patients do not report seeing anything. Their denials are caused by the lack of phenomenal experience, while their accurate guesses are caused by unconscious processes. This shows that phenomenal consciousness is causally necessary for typical visual judgments.

  **4. Conclusion**

  We commit to revisiting these cruxes as new evidence or arguments emerge. We agree that the resolution of these issues may require further philosophical and empirical work.

  ---
  Signed,

  [Epiphenomenalist]

  [Efficacious Phenomenalist]

  ---

  Note: In the cruxes section, we have chosen cases that are standard in the literature and that both sides can engage with. Each side's prediction is stated in a way that they would accept. The document avoids vacuous agreements and respects each side's core commitments.
answer: |-
  **Joint Statement on the Paradox of Phenomenal Judgment**  

  **1. Agreed Claims**  
  1.1. **Phenomenal Consciousness**: We agree "phenomenal consciousness" denotes the subjective, qualitative character of experiences (e.g., the hurtfulness of pain, the redness of red). It is intrinsic, private, and non-structural.  
  1.2. **The Paradox of Phenomenal Judgment**: We agree the paradox arises from the tension between:  
  - (a) The intuitive view that first-person judgments about experiences (e.g., "I feel pain") are directly caused *by* those phenomenal states.  
  - (b) The challenge of reconciling this with physical causal closure (every physical effect has a sufficient physical cause) and the non-physical *nature* of qualia.  
  1.3. **Standard Anti-Epiphenomenalist Argument**: We agree the core argument against epiphenomenalism is:  
  - If phenomenal properties are causally inert, they cannot cause judgments about themselves.  
  - But judgments about phenomenal states (e.g., "I see red") are reliable, accurate, and evidence for phenomenal consciousness.  
  - Without causal efficacy, these judgments are coincidental or groundless, undermining justification for believing in phenomenal consciousness (*self-stultification objection*).  
  1.4. **Standard Epiphenomenalist Reply**: We agree the reply asserts:  
  - Phenomenal properties are caused by physical states (e.g., neural processes) but lack downward causation.  
  - Judgments about experiences are caused *solely* by the physical substrate, which also produces the phenomenal property.  
  - Reliability arises from the physical state causing both the judgment and the qualia, preserving accuracy without causal efficacy.  
  1.5. **Fair Test**: We agree a test must isolate whether phenomenal properties contribute causal power beyond their physical correlates. This requires:  
  - Scenarios where physical states are identical but phenomenal states differ (e.g., philosophical cases), or vice versa.  
  - Empirical constraints: no a priori dismissal of conceivability arguments, and consistency with neuroscientific data (e.g., neural correlates of consciousness).  

  **2. Disagreements**  
  | Disagreement                                                                                          | Epiphenomenalist (E) View                                                                                                                                 | Efficacious Phenomenalist (EP) View                                                                                                                                               | Type          |  
  |-------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------|  
  | 2.1. **Causal Efficacy of Qualia**: Do phenomenal properties cause phenomenal judgments?             | Phenomenal properties are causally inert. Judgments are fully caused by physical mechanisms; qualia are "along for the ride."                              | Phenomenal properties are causally active. The qualitative character of experience directly influences judgments about it (e.g., pain’s hurtfulness causes the judgment “I am in pain”). | Substantive   |  
  | 2.2. **Scope of Causation**: Must all causes be physically reducible?                                 | Yes. Causation is exclusively physical. Non-physical properties (like qualia) cannot be causes—only their physical bases can.                              | No. Causation can include non-physical properties if they are metaphysically distinct. Phenomenal properties have irreducible causal powers.                                        | Partly Verbal |  
  | 2.3. **Self-Stultification Severity**: Does epiphenomenalism undermine justification for belief in qualia? | No. Reliability derives from physical states causing both qualia and judgments, so beliefs are justified.                                                 | Yes. Without qualia causing judgments, beliefs about them are unmoored from their objects, rendering them unjustified or accidental.                                               | Substantive   |  

  **3. Cruxes**  
  3.1. **Crux: The Self-Stultification Argument**  
     - **Case**: A philosophical zombie (physically identical to a human but lacking qualia) reports, "I am in pain."  
       - **E’s Prediction**: The zombie will report identically to a conscious human. This confirms judgments are physically determined, so epiphenomenalism avoids self-stultification.  
       - **EP’s Prediction**: The zombie’s report is not a *phenomenal judgment* (lacking qualia as cause), so it is false or empty. This shows epiphenomenalism undermines judgment validity.  
  3.2. **Crux: The Knowledge Argument**  
     - **Case**: Mary (a neuroscientist who knows all physical facts about color vision but has never seen red) sees red for the first time. Does her new judgment ("Now I know what red looks like") require qualia as a cause?  
       - **E’s Prediction**: Mary’s judgment is caused by new physical brain states alone. Qualia are concomitant but causally irrelevant.  
       - **EP’s Prediction**: The judgment depends on the causal impact of the quale itself—without it, the physical knowledge alone couldn’t produce this new judgment.  
  3.3. **Crux: Blindsight and Reportability**  
     - **Case**: Blindsight patients can "guess" stimuli in their blind field but deny seeing anything. When prompted to report on their blind field, they insist they have no visual experience.  
       - **E’s Prediction**: Reports ("I see nothing") are caused by the absence of specific physical correlates of consciousness. The quale’s absence is irrelevant.  
       - **EP’s Prediction**: The denial is directly caused by the absence of qualia. Without qualia, only guesses (not judgments) occur, demonstrating qualia’s causal necessity.  
  3.4. **Crux: Evolutionary Role**  
     - **Case**: Pain qualia co-occur with nociceptive reflexes (e.g., withdrawing a hand from fire). Does evolution select for qualia?  
       - **E’s Prediction**: Natural selection acts solely on physical reflexes. Qualia are inert byproducts, so their correlation is coincidental.  
       - **EP’s Prediction**: Qualia (e.g., pain’s hurtfulness) enhance survival by causing adaptive judgments (e.g., "Avoid fire!"), making them evolutionarily advantageous.  

  ---  
  Signed,  
  [Epiphenomenalist]  
  [Efficacious Phenomenalist]
