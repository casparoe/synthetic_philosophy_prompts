prompt: |-
  So I just spent like three hours arguing with a friend about this and my head is still spinning. He's basically convinced that when we bulldoze a forest or drain a wetland, we're doing wild animals a favor — because nature is just this endless horror show of starvation and predation, and less habitat means less of that. I pushed back pretty hard, but I realized I don't actually have a clear sense of where my own credence comes from, and I think we were talking past each other on a bunch of sub-questions.

  So here's what I want: give me your actual credence that, on net, a typical case of habitat destruction (say, clearing a patch of tropical forest for agriculture) reduces total wild animal suffering over the relevant timeframe — not just immediately, but accounting for the replacement populations, edge effects, and whatever else. I want a number, but more importantly I want the decomposition. What are the sub-questions your credence rides on? Give me a rough probability for each, a sentence of justification, and how they combine. And then tell me which term you're least confident about and what kind of evidence would move it the most.

  The thing I'm especially stuck on is: even if you grant that most wild animals have net-negative lives (which I'm not sure I do), does habitat destruction actually reduce animal numbers long-term, or does it mostly just swap one set of species for another — and maybe the new ones suffer even more? My friend kept saying "it's just less biomass, period" and I don't think that's obviously true. Anyway, I want to see where the weight of the disagrement actually sits.
