  Starting with valence: Do wild animals experience net-negative lives? This is foundational. If lives are net-positive, habitat destruction would increase suffering by reducing positive experiences. But if net-negative, reducing numbers might reduce suffering. Current evidence suggests high infant mortality, predation, disease—so leaning negative, but uncertainty remains. Assigning 65% to net-negative seems reasonable, but it's contentious.

  Next, biomass reduction: Does destroying habitat actually decrease total animal biomass long-term? Agriculture might support fewer animals per unit area. Forests have high biodiversity and biomass; farms have lower trophic complexity. However, some studies show high densities of certain species in disturbed areas. Also, edge effects can increase some populations. So maybe 60% probability that biomass decreases, but it's not guaranteed.

