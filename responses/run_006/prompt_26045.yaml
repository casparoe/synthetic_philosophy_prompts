  Their physics background is crucial here. In epistemology, unlike physics:  
  - There's no clear empirical arbiter (no equivalent of experimental falsification)  
  - Concepts are interdefined (credence/chance/evidence)  
  - Stakes are explanatory roles rather than predictive accuracy  

