  The friend's argument hinges on reducing everything to n-player PD. But PD typically involves discrete defection/cooperation choices. Moloch scenarios often involve continuous action spaces with sliding-scale compromises. Think of journalism's race-to-the-bottom: no one "defects" outright, but quality erodes incrementally. Each small compromise is rational individually, yet collectively destructive. This feels different from someone actively betraying a partner in PD.

  Also, in PD, mutual cooperation is stable if players trust each other. But in Moloch traps like AI arms races, even if two companies want to cooperate, they might fear a third actor undermining them. The multipolar aspect introduces unique instability. Regulatory solutions that work for classic commons problems (like fishing quotas) may fail when the "resource" is abstract (like attention economies) or the actors are sovereign nations.

  The user seems frustrated because the standard coordination toolkit feels inadequate here. They suspect Moloch highlights a more insidious problem where everyone sees the trap but can't stop marching toward it. That's worth exploring – maybe the key distinction is when coordination requires sacrificing competitive advantage in zero-sum environments. 

