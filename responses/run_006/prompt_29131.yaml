answer: |-
  ### Speech: For Auntie Grace  

  Good afternoon. I’d ask you to sit, but Auntie Grace never liked fuss, and she’d scold me if I made everyone stand too long in this heat. So please, get comfortable.  

  Some here knew Grace as Professor Williams, who wrote papers on Ubuntu philosophy. Others remember the girl who chased goats through the village, taught by neighbours like Mama Nandi here that “umuntu ngumuntu ngabantu” – *a person is a person through other persons* – long before she read it in a book. And to my cousins? She was just Auntie Grace, who sneaked extra biscuits at tea and laughed like a drain at terrible jokes.  

  Grace spent her life insisting we aren’t lone islands. She argued that our very selves are woven from the threads of others: the hands that held us, the voices that challenged us, the quiet presences that steadied us. Her conviction wasn’t just academic. It was how she lived. In her kitchen with students debating till midnight. In letters to villagers about their grandchildren’s schooling. In the way she’d remember your favourite flower, or that you took your tea with two sugars and a grumble.  

  So what does it mean, if she was right, that we stand here without her? If personhood is built relationally... does death unravel it?  

  I think Auntie Grace would say: no. Not while the echoes remain.  

  Look around. See the colleague whose work she sharpened with her fierce, kind questions? There’s a thread of Grace there. The neighbour whose child she tutored? That’s her too. The nephew who still folds origami cranes because she taught him? That’s her thread, pulled tight.  

  She isn’t *gone*. She’s dispersed. She’s in every kindness she encouraged, every truth she nudged us to see, every time one of us chooses courage because she once said, “You’re stronger than you think.”  

  The “we” she leaves behind? We’re not just mourners. We’re her living proof. We’re the network that sustained her personhood – and now carries its imprint. Our task isn’t just to remember her, but to *recognise her* in each other: in shared stories, in inherited stubbornness, in the way we still turn to ask, “What would Grace say?”  

  So today, let’s not say goodbye. Let’s say: *thank you*.  

  Thank you, Grace, for seeing us so clearly you helped us see ourselves.  
  Thank you for showing us that holding each other up isn’t just kindness – it’s how we become real.  
  And thank you for leaving behind a “we” – this odd, beloved tapestry of academics, villagers, and biscuit thieves – bound tighter because you wove yourself into us.  

  Rest now, Auntie. We’ll keep each other real.  

  *(Pause. Smile.)*  
  Now. Who’s for tea? She’d hate us moping. And I believe there are biscuits…
