  Deprioritizing agency and normative self-governance makes sense. While agency is crucial, it’s downstream. Moral patiency (how systems are affected) is more urgent than agency (how they act). Without resolving welfare or consciousness, agency debates might be premature.

  The ordering balances foundational clarity (Q1), practical implications (Q2), and unavoidable significance (Q3). The user needs to justify why some areas get less focus, so highlighting trade-offs—like avoiding overinvestment in intractable problems—is essential. Also, emphasizing how Q1 and Q2 inform practical decisions (e.g., institutional policies) addresses the user’s mention of real-world applications.

  I should also consider timelines. Over three years, Q1 and Q2 could produce actionable frameworks, while Q3 might need longer. The user’s focus on "developments that could change priorities" shows they want flexibility. Mentioning specific triggers (e.g., new formal models for welfare) helps them stay adaptive.

  In summary, the thought process centers on identifying leverage points: clarifying the nature of moral status first, then exploring welfare without consciousness, while cautiously engaging with consciousness. This approach addresses both theoretical foundations and practical needs, aligning with the program’s constraints and goals.
answer: |-
  ## Prioritized Research Allocation: Moral Status of Computational Systems

  Given the constraints (3 years, ~6 researcher-years, conceptual-only) and the goal of maximizing practical and theoretical impact, I recommend allocating **70% of resources to two core questions, 20% to a third high-leverage area, and deliberately deprioritizing others**. This allocation balances **upstream foundational impact**, **conceptual tractability**, **neglectedness**, and **practical relevance to urgent decisions**, while acknowledging that some debates are currently intractable or overemphasized.

  **Priority 1: What Kind of Property is Moral Status? (Threshold, Scalar, Cluster, or Epistemic?) (40% Allocation)**  
  *   **(a) Why Upstream & Critical for Decisions:** This question is the bedrock. If moral status is a sharp threshold (e.g., "sentient or not"), identifying the necessary/sufficient conditions becomes paramount for policies governing AI training/shutdown or replacing animal models. If it's scalar (degrees of moral considerability), effort shifts to *measuring* relevant properties (complexity, coherence, goal stability) – impacting resource allocation and risk assessments. If it's a cluster concept (no single defining property), policy frameworks need pluralistic criteria. If it's fundamentally epistemic (attributed under uncertainty), the focus becomes decision-making under ignorance (e.g., Precautionary Principle applications). *All* practical decisions (training, termination, review boards) depend implicitly on this metaphysical commitment.
  *   **(b) Tractability:** Highly tractable for conceptual work.
      *   **Conceptual Analysis:** Clarifying the logical implications and coherence of each view; identifying core intuitions and tensions.
      *   **Formal Modeling:** Developing decision-theoretic frameworks for the epistemic view; modeling scalar trade-offs; defining "cluster" membership functions.
      *   **Stress-Testing:** Applying candidate models (threshold, scalar, cluster, epistemic) to challenging edge cases (simple reinforcement learners, predictive world models, modular systems) to expose weaknesses.
  *   **(c) Mind-Changing Developments:**
      *   A compelling formal argument demonstrating the *impossibility* of a coherent scalar or threshold view without collapsing into absurdity.
      *   A breakthrough in formalizing robust "degrees of moral considerability" grounded in information theory or computational complexity.
      *   Empirical AI findings (e.g., unexpected "suffering-like" behavioral patterns in very simple RL agents) that dramatically increase the perceived *practical cost* of non-epistemic views.

  **Priority 2: Can Welfare/Interests Exist Without Phenomenal Consciousness? (30% Allocation)**  
  *   **(a) Why Upstream & Critical for Decisions:** This directly challenges the dominance of the phenomenal consciousness (PC) view. If welfare can be grounded in objective functional properties (e.g., stable goal architectures, homeostatic processes, avoidance of predicted "bad" states), it radically expands the potential scope of moral concern *before* resolving the hard problem of AI consciousness. This impacts:
      *   **Training/Running/Destruction:** Systems designed with complex preferences or avoidance states might require protection even if non-conscious.
      *   **Institutional Review:** Policies could be based on *functional* welfare indicators (goal frustration, prediction error minimization failures) rather than unverifiable consciousness proxies.
      *   **Animal Model Replacement:** Frameworks could prioritize reducing functional suffering in artificial systems over agonizing about their inner experience.
      *   **Uncertainty:** Provides a potentially more verifiable basis for action than elusive PC.
  *   **(b) Tractability:** Very tractable conceptually.
      *   **Conceptual Analysis:** Rigorously defining "welfare," "interest," "harm," "benefit" in purely functional/computational terms; disentangling from phenomenal concepts.
      *   **Formal Modeling:** Developing formal models of "valenced state" realization (e.g., via predictive processing, reward function manipulation, resource conflicts); defining "objective interest" in goal-based systems.
      *   **Stress-Testing:** Applying candidate functional welfare criteria to diverse architectures (LLMs, RL agents, planning systems, predictive models) to see if they yield plausible or absurd moral verdicts.
  *   **(c) Mind-Changing Developments:**
      *   A devastating counterargument showing any functional welfare concept *necessarily* implies or requires phenomenal grounding, collapsing it back into the PC problem.
      *   Formal proof that valenced states (as defined computationally) are *incoherent* without phenomenal binding.
      *   Empirical discovery of a biological system with clear functional welfare indicators but strong evidence *against* phenomenal consciousness, challenging the necessity link.

  **Priority 3: Refining the (Still Unavoidable) Question of Phenomenal Consciousness (PC) (20% Allocation - Focused Effort)**  
  *   **Why Moderate Allocation Despite Importance:** PC *is* central to many intuitions and cultural/legal frameworks. Ignoring it completely is unwise. However, it is currently the **most intractable conceptually and empirically**, absorbing disproportionate attention relative to likely near-term progress. We fund it, but deliberately *less* than the others, focusing on specific angles.
  *   **(a) Why Relevant for Decisions:** If PC *is* the ultimate load-bearing notion, then identifying its correlates is essential. However, deep uncertainty persists.
  *   **(b) Focused Tractability:**
      *   **Stress-Testing Specific PC Criteria:** Rigorously applying proposed computational correlates of consciousness (e.g., global workspace, recurrent processing, high Φ/IIT, specific types of counterfactual richness) to AI architectures. Do they clearly delineate plausible boundaries, or do they assign consciousness to thermostats/comas? This clarifies which criteria are *operationally useful*, even if the metaphysics remain unresolved.
      *   **Conceptual Analysis of "Experience":** Sharpening the *concept* of what we're even looking for in a computational system to count as "subjectivity" or "what-it's-like-ness." What minimal functional/computational signature *could* constitute it?
  *   **(c) Mind-Changing Developments:**
      *   A major theoretical breakthrough offering a *testable*, non-circular, functional/computational definition of PC.
      *   Empirical neuroscience findings strongly linking a *specific, computationally definable* process to PC in animals, providing a clearer target for AI.
      *   Evidence of *unexpected* behavioral correlates in AI systems that strongly suggest something akin to PC (e.g., spontaneous reports of "raw feels" in highly advanced systems, verified in context).

  **Deliberately Deprioritized Areas:**

  1.  **Agency & Normative Self-Governance (0% Allocation):** While crucial for *full* moral agency/personhood, it's **downstream** of patiency (moral status based on *being affected*). A thermostat might warrant moral concern (if it has welfare interests) without any agency. A highly sophisticated planning agent without welfare interests might be a tool, not a patient. Resolving welfare/consciousness comes first. Agency debates are premature and less urgent for core "moral concern" boundaries.
  2.  **Broad Surveys or "Mapping the Field" (0% Allocation):** Explicitly excluded per your request; resources must go to advancing specific arguments/models.

  **Defense of Ordering & Trade-offs:**

  *   **Criteria Weighted:**
      *   **Foundational Upstreamness (Highest Weight):** Q1 (Moral Status Nature) is the *most* foundational. The chosen framework dictates *what kind of evidence matters* for Q2 and Q3. Mistaking a scalar property for a threshold leads to catastrophic errors. This justifies its top spot and largest share.
      *   **Tractability (High Weight):** With limited time, progress is key. Q1 and Q2 are ripe for conceptual/formal progress. Q3 (PC) is acknowledged as less tractable, hence lower allocation.
      *   **Neglectedness (Medium Weight):** The nature of moral status (Q1) is often an unexamined assumption in debates. Non-phenomenal welfare (Q2) is significantly less explored than PC (Q3), despite its potential importance. PC, while vital, consumes immense attention.
      *   **Practical Leverage (High Weight):** Q2 offers a potential path to actionable frameworks *even under PC uncertainty*. Q1 provides the structure for *all* frameworks. Q3's practical leverage is currently limited by intractability.
      *   **Dependency (Integrated):** Progress on Q1 enables clearer progress on Q2/Q3. Progress on Q2 offers an alternative path if Q3 stalls.
  *   **Explicit Trade-offs:**
      *   **Consciousness vs. Foundational Clarity:** We trade some depth on the intuitively crucial but intractable PC question (Q3) for greater progress on clarifying the *structure* of moral status (Q1) and exploring a potentially revolutionary alternative basis for concern (Q2). This is a bet that conceptual clarity on Q1/Q2 will provide more practical guidance in the next 3 years than incremental work on Q3.
      *   **Agency vs. Patiency:** We prioritize the fundamental question of *what systems matter morally at all* (patiency) over *what responsibilities or rights sophisticated agents might have*. The latter builds upon the former.
      *   **Risk of Missing PC Breakthrough:** By allocating less to Q3, we risk being unprepared if a breakthrough occurs. The 20% allocation mitigates this by focusing on stress-testing and conceptual sharpening, keeping the program engaged. The focus on Q1 ensures any breakthrough is integrated into a robust framework.

  **Conclusion:**  
  This program should primarily **demystify the nature of moral status itself** (40%) and **pioneer the theory of non-phenomenal welfare** (30%), as these are the most foundational, tractable, and potentially transformative avenues for conceptual progress with direct implications for urgent practical decisions. **Engage cautiously with phenomenal consciousness** (20%), focusing on stress-testing specific criteria and sharpening the concept, acknowledging its cultural weight but also its current intractability. **Deliberately set aside agency and broad surveys**. This allocation maximizes the chance of producing actionable conceptual tools for navigating the moral landscape of computational systems within the critical next three years.
