prompt: |-
  I've been trying to work out what I actually think makes consent to sex valid — or more precisely, what invalidates consent that looks fine on the surface. I've gone through a set of cases and arrived at verdicts that mostly feel right, but I can't find a single principle that gets all of them, and I suspect at least one of my verdicts has to go. Here are the cases and how I come down on each:

  1. **The STI lie.** Alex tells Jordan they have no STIs, knowing this is false. Jordan relies on this and agrees to sex. Verdict: consent invalid. Straightforward deception on a matter any reasonable person would consider material to the decision.

  2. **The boss's threat.** An employer tells an employee they'll be fired unless they have sex. Verdict: consent invalid. Paradigm coercion — a threat that worsens the person's options relative to the baseline they're entitled to.

  3. **Blackout drunk.** Pat is slurring, stumbling, and later remembers nothing of the night. Pat said yes to sex. Verdict: consent invalid. Pat lacked the capacity to understand what they were agreeing to.

  4. **The undisclosed marriage.** During a casual hookup, Sam is married but says nothing about it. The other person, Riley, assumes Sam is single and doesn't ask. Sam knows that if Riley knew, Riley would walk. Verdict: I feel this is seriously wrong, and I lean toward saying consent is invalid — but I'm not confident, and this is the case I keep going back and forth on.

  5. **The résumé puff.** On a first date, Morgan says they're a lawyer when they're actually a paralegal. They sleep together. Verdict: consent valid. It's embellishment, not the kind of deception that undermines sexual autonomy — or so I want to say.

  6. **The guilt trip.** During an argument about whether to have sex, one partner says, "If you really loved me you'd do this." The other partner, worn down, agrees. Verdict: this is manipulative and wrong, but I think the consent is still valid — barely. It's pressure, but not the kind that removes the ability to say no.

  7. **The tuition offer.** A wealthy older person offers to pay a struggling college student's full tuition in exchange for a sexual relationship. The student, after thinking it over, accepts. Verdict: consent valid. It's an offer, not a threat — it expands options rather than contracting them — even though it exploits a vulnerability.

  8. **Stealthing.** Two people agree to sex with a condom. Midway through, one removes it without the other's knowledge or consent. Verdict: consent invalid. The condition under which consent was given has been secretly violated.

  Here's what bothers me. Cases 4 and 5 seem to differ only in degree — both involve deception about a fact the other person might care about — but I treat one as potentially consent-invalidating and the other as mere puffery. Is there a principled line between them, or am I just squeamish about sex in particular? And case 7 (the tuition offer) feels valid to me, but if we say that exploiting someone's economic vulnerability doesn't invalidate consent, why does exploiting someone's professional vulnerability in case 2 (the boss) invalidate it? I can gesture at the offer/threat distinction, but I'm not sure it holds up: if someone's baseline is desperate enough, an offer can function like a threat — "do this or stay in poverty" starts to sound a lot like "do this or lose your job."

  I want you to do two things. First, try to extract the principle — or small set of principles — that best captures my verdicts, stated precisely enough that it yields clear answers on new cases. Tell me which of my verdicts the principle overturns, if any, and why. Second, apply the principle to the case I'm stuck on (case 4) and to at least one case I haven't listed — ideally one that stresses the principle at its weakest point. Finally, please say what would change your mind about the principle you settle on: which argument or counterexample would lead you to a different account, or where you think your reasoning is most likely to fail.
reasoning: |-
  Hmm, this user has presented a complex ethical puzzle about sexual consent validity that clearly troubles them. They've done impressive groundwork - organizing nuanced cases, identifying pressure points, and recognizing where their intuitions might conflict. Their struggle with case 4 (undisclosed marriage) and tension between cases 5/7 shows they've hit the core philosophical difficulty: where to draw lines between deception, coercion, and mere regret.

  The user seems analytically minded - likely in law or philosophy - given how they frame principles and counterexamples. Their frustration about "squeamishness" suggests they're wary of emotional bias. The request for "what would change your mind" indicates genuine intellectual openness. I should avoid platitudes and engage at their level of precision.

  Key challenges jump out:
  First, their intuitive distinction between case 4 (invalid) and case 5 (valid) needs justification beyond "sex is special." The marriage deception feels materially different from job embellishment, but why? Second, the offer/threat dichotomy in cases 2 vs 7 collapses if we consider systemic inequality - is "accept tuition or stay poor" really freer than "have sex or get fired"?

  I notice they didn't include intoxication levels between tipsy and blackout - that might test capacity principles. Also missing are cases where deception relates to identity (like trans disclosure debates) which could stress the "core sexual act" boundary.

  The coercion analysis should distinguish between threats (worsening position) and offers (improving). But as they note, context matters: firing someone exploits workplace power asymmetry, while tuition offers exploit economic asymmetry. The difference might lie in whether the proposer created the vulnerability.

  For the marriage case, the key is whether monogamy expectations go to the nature of the act itself. If Riley believes they're participating in a casual encounter between singles, while Sam knows it's adultery, they're arguably engaged in different acts - like the condom removal in stealthing.

  My proposed principle will overturn their case 7 verdict (tuition). If we take vulnerability seriously, "desperate acceptance" isn't full autonomy. But this risks overreach - would all power-imbalanced relationships be invalid? That's why I'll suggest the "harms dignity" threshold.

  For a new case, consider: "Person A knows Person B would only sleep with someone of certain political views, and lies about this." This tests whether deception about character (not physical act) invalidates consent. My principle would call this valid but unethical - which might dissatisfy the user.

  The biggest vulnerability in my framework is defining "core terms." Culture shapes this: in some communities, marriage status is central; in others, irrelevant. I'd change my view if presented with a case where deception clearly violates bodily autonomy but doesn't fit my categories - say, lying about genetic disease risk when pregnancy is possible.
answer: |-
  Based on your verdicts and the tensions you've identified, your underlying principle appears to center on **violations of core sexual autonomy through deception about the *nature of the act itself* or coercion that negates meaningful choice**. This prioritizes bodily integrity and the fundamental understanding of what one is consenting to, rather than broader motives or emotional vulnerabilities.

  Here's the principle stated precisely:

  **Consent is invalid if:**
  1.  **Deception occurs about a fact that fundamentally alters the *nature or essential terms* of the sexual act** (e.g., the physical act itself, core conditions like barrier use, or facts directly bearing on sexual health or identity in a way central to the partner's participation); *or*
  2.  **Coercion occurs via a *threat* that wrongfully imposes a significant harm or worsens the person's baseline situation**, thereby removing a reasonable alternative to consenting.

  **Breaking down your verdicts with this principle:**

  1.  **STI Lie (Invalid):** ✔️ Deception about sexual health directly alters the nature/risk of the act (Core Nature/Health).
  2.  **Boss's Threat (Invalid):** ✔️ Coercion via threat (firing) wrongfully worsens baseline (Coercion via Threat).
  3.  **Blackout Drunk (Invalid):** ✔️ Lacks capacity to understand *any* nature of the act (Implied capacity requirement).
  4.  **Undisclosed Marriage:** **Invalid** under this principle? *See below.*
  5.  **Résumé Puff (Valid):** ✔️ Deception about profession doesn't alter the *nature of the sexual act itself* (Not Core Nature/Terms).
  6.  **Guilt Trip (Valid):** ✔️ Emotional manipulation/pressure, but not deception about the act nor a coercive *threat* removing reasonable alternatives (Not Coercion via Threat, Not Core Deception).
  7.  **Tuition Offer (Valid):** ❌ **Overturned to Invalid?** *See below - this is the key tension.*
  8.  **Stealthing (Invalid):** ✔️ Violation of core condition (barrier use) directly alters the physical act consented to (Core Terms/Condition).

  **Applying the Principle to Your Stuck Case (4) & Stressing It:**

  *   **Case 4: The Undisclosed Marriage:** Under this principle, **consent is likely valid.** Why?
      *   Sam's deception concerns *motivation and context* (marital status, implying exclusivity or relationship potential), not the *physical nature of the sexual act itself* (the acts performed, core conditions like barrier use, or sexual health). Riley consented to the specific physical acts with Sam, understanding what those acts were. While the deception is deeply unethical and exploitative of Riley's assumptions/desires, it doesn't change the fundamental *thing* Riley agreed to do physically. It changes *why* Riley agreed and the meaning they attached to it, which falls under motive/context, not core terms.
      *   **Why this feels wrong:** It *is* seriously wrong! The principle highlights the *ethical wrong* (exploitation, betrayal) but distinguishes it from *invalidating consent* under this autonomy-focused framework. Your discomfort stems from the severity of the betrayal, but the principle draws the line at deception altering the act's core nature, not its emotional or relational significance.

  **Applying the Principle to a New Case (Stressing the Principle):**

  *   **Case 9: The IVF Deception:** Taylor and Jordan agree to have sex solely for the purpose of conception as part of Jordan's IVF process (using Jordan's retrieved egg/sperm). Taylor secretly has no intention of providing viable sperm/eggs for conception (e.g., has had a vasectomy/hysterectomy they conceal, or sabotages the sample). Jordan consents believing conception is the goal.
      *   **Principle Verdict: Consent Invalid.** Why? The deception goes to the *core purpose and essential term* of the sexual act Jordan consented to. Jordan consented to *procreative sex for IVF*, not just sex. The nature of the act Jordan agreed to (sex intended for conception) was fundamentally altered by Taylor's deception. This contrasts sharply with Case 4 (marital status - context/motive) and Case 5 (profession - identity/attraction). This deception directly changes what Jordan understood the *act to be for*.

  **Revisiting Case 7 (Tuition Offer) - The Overturned Verdict & Vulnerability Tension:**

  *   **Under the Principle: Consent is Invalid.** Why?
      *   This is where the "offer vs. threat" distinction *within the coercion prong* becomes critical. The principle requires a *threat* that *wrongfully worsens the baseline*. The tuition offer is an *inducement*, not a threat.
      *   **However, the vulnerability tension remains.** Your intuition ("do this or stay in poverty" feeling threat-like) highlights a weakness. The principle *as stated* doesn't inherently invalidate consent based *solely* on exploiting vulnerability via an offer. The wealthy person isn't *threatening* to make the student poorer; they are *offering* a benefit contingent on sex.
      *   **Why overturn your verdict?** Your principle *implicitly* relies on the offer/threat distinction for coercion. Case 2 (boss) is a clear threat worsening the baseline (firing). Case 7, while exploitative, is an offer improving the baseline (tuition paid). To treat Case 7 as invalid under coercion would require abandoning the offer/threat core of your coercion prong or adding a separate "exploitation of dire vulnerability" prong, which your other verdicts (like valid guilt trip) don't support. Case 7 exposes the difficulty: the offer exploits vulnerability but doesn't fit the *coercive threat* model your other verdicts rely on. **Therefore, under the stated principle focusing on core deception and coercive threats, Case 7 remains valid, despite its exploitative nature.** *This is likely where your intuition and the principle clash most.*

  **What Would Change My Mind About This Principle:**

  1.  **A Counterexample Showing Core Deception is Too Narrow:** If presented with a case of deception that *doesn't* involve the physical act, health, identity, or core conditions, but is so fundamental to the person's understanding of the *partner* that consent feels intuitively invalid *and* cannot be explained by lack of capacity or coercion. (e.g., "Person A believes Person B is a specific individual they know, due to deliberate disguise in the dark, but it's actually an identical twin impersonating them." This *might* be argued as deception about identity going to the core of "who" is involved).
  2.  **A Better Account of Vulnerability Exploitation:** If a compelling argument shows that exploiting *certain types of severe, non-contingent vulnerability* (like extreme poverty, homelessness) through offers contingent on sex *should* invalidate consent *in a way consistent with your other verdicts*, particularly without collapsing the valid/invalid lines for guilt trips or résumé puffs. This would necessitate modifying the coercion prong or adding a third prong focused on exploitation, but defining its boundaries precisely to avoid overreach would be difficult.
  3.  **Reconciling Offers/Threats in Vulnerability:** A persuasive demonstration that in contexts of *absolute* baseline deprivation (like the tuition case), the distinction between "I will make you worse off" (threat) and "I won't make you better off" (offer refusal) collapses meaningfully for autonomy, *and* that this collapse justifies invalidating consent in Case 7 but *not* in less extreme cases of pressure (like the guilt trip). This would challenge the core offer/threat distinction underpinning your coercion analysis.
  4.  **Your Verdict on Case 4:** If, upon reflection, you firmly conclude Case 4 *is* invalid despite the principle saying valid, it suggests the principle needs adjustment. You might need to broaden "core terms" to include *fundamental relational understandings* essential to *that specific person's* decision (making it more subjective), but this risks significant instability and potential overreach (e.g., invalidating consent over undeclared political views if the other person cares deeply).

  **Where the Reasoning is Most Vulnerable:**

  *   **Defining "Core Terms/Nature of the Act":** Distinguishing between deception about the *physical act/health/identity* (invalidating) vs. deception about *context/motive* (not invalidating) is the most contested and culturally/contextually sensitive boundary. Case 4 (marriage) vs. Case 9 (IVF purpose) illustrates the edge.
  *   **The Offer/Threat Distinction in Vulnerability:** Case 7 highlights the principle's potential inability to adequately address consent under conditions of extreme, exploited vulnerability when the leverage comes via an offer, not a threat. It feels intuitively problematic, but fitting it into the framework without undermining other verdicts (like valid guilt trip or valid résumé puff) is the biggest challenge.
  *   **Subjectivity vs. Objectivity:** The principle leans towards an objective view of "core terms" (what a reasonable person would consider fundamental to the sexual act). However, your discomfort with Case 4 hints that for *some* people, certain contextual facts *feel* fundamental. Balancing objectivity with genuine autonomy concerns is tricky.

  Your struggle captures a core tension in consent theory: balancing the need for clear, workable principles focused on bodily autonomy against the desire to capture the full ethical weight of deception, pressure, and exploitation in intimate contexts. The proposed principle prioritizes the former, drawing lines based on the physical act and coercive threats, but acknowledges the ethical complexity of cases like the undisclosed marriage and tuition offer that fall outside those lines.
