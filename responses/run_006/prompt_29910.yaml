prompt: |-
  I spent my career in population genetics and only started reading philosophy of science after I retired, so go easy on the jargon — I know the biology, not the epistemology. I write a monthly newsletter where I fact-check how the science press, and sometimes journals, report heritability, and my readers are mostly high-school biology teachers and science journalists, so what I write gets repeated. I keep hitting the same wall: a study reports a heritability of 0.6 for some trait, or a headline says a trait is "60% genetic," and within a week someone has concluded that the trait is fixed, that an individual's case is 60% caused by genes, or that a group difference must be partly genetic because the trait is heritable within each group. I know these moves are wrong, but I don't have a crisp procedure I can run, and I end up re-arguing from scratch every month, and I suspect I'm too charitable to the quantitative genetics and not charitable enough to the environment.

  Please write me a reusable decision procedure — a checklist or flowchart in words — that I can actually run in a afternoon on any heritability claim that lands in my inbox, grounded in what the quantitative genetics actually says rather than how the word gets used. It should tell me, in order: what a claim has to specify before its even well-formed (population, range of environments, broad versus narrow sense, and whatever else matters); what a number does and does not license; which common inferences to flag as outright category errors; which questions about study design and gene-environment interplay to ask before I trust the estimate; where the procedure stops with a clear verdict; and where it has to stop and say the claim is underdetermined, or that the next step is a values call rather than a fact call. Assume I can do arithmetic and read a methods section, but don't make me re-derive the variance decomposition each time. Flag the steps that are judgment calls dressed up as procedure.

  Then run the procedure on these three, and show the worksheet:
  1. A widely shared article says schizophrenia is about 80% heritable and therefore "mostly genetic," so prevention should focus on genes rather than environments.
  2. A blogger argues that because the heritability of finger number in humans is near zero, genes hardly matter for how many fingers a person has.
  3. A policy report argues that because height is about 80% heritable within both a well-nourished and a chronically undernourished population, the height difference between the two populations must be mostly genetic.

  I expect the procedure to return at least one verdict I don't like — that's fine, I want to see where my instincts as a geneticist are doing the work rather than the procedure. Also tell me, briefly, what the procedure cannot do: the cases it will systematically miss or get wrong, and what I'd have to add to handle them.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired population geneticist who now critiques science reporting on heritability for educators and journalists. They need a practical decision procedure to evaluate common misinterpretations - something reusable that doesn't require re-deriving variance decompositions monthly.

  First, I consider the core challenges they face: the fundamental attribution error in heritability interpretations, confusion between population-level statistics and individual causation, and the fallacy of assuming within-group heritability explains between-group differences. The procedure must address these while remaining accessible to non-statisticians.

  For the framework's structure, I plan a step-by-step checklist organized into:
  1) Claim validation - checking if the original study even qualifies as interpretable heritability
  2) Interpretation boundaries - what the number actually means/doesn't mean
  3) Design interrogation - study limitations that could invalidate the estimate
  4) Inference screening - common misapplications to flag

  Key principles to embed:
  - Heritability is always population- and environment-specific
  - It measures variation explanation, not trait determination
  - High h² ≠ genetic inevitability; low h² ≠ environmental control
  - The within-group ≠ between-group firewall must be explicit

  For the three test cases:
  Case 1 (schizophrenia): Will demonstrate how "mostly genetic" misrepresents h²=0.8, especially regarding prevention strategies. The procedure should highlight the missing GxE components.

  Case 2 (finger count): Will show how near-zero h² for a canalized trait becomes misinterpreted. Need to emphasize developmental biology vs. variance explanation.

  Case 3 (height differences): Perfect example of the within-between fallacy. Must stress how identical h² in two groups tells us nothing about why they differ.

  The procedure's limitations section will note its inability to handle:
  - Epigenetic effects beyond additive genetics
  - Claims about absolute (not relative) genetic contributions
  - Cases where GxE covariance is theoretically plausible but unmeasured

  Finally, I'll add diagnostic flags for when the analysis reaches:
  - Clear statistical errors (red)
  - Methodological limitations (yellow)
  - Truly indeterminate cases requiring expert judgment (blue)
answer: |-
  Below is a reusable decision procedure for evaluating heritability claims, designed for efficiency and grounded in quantitative genetics principles. It follows a sequential checklist format, with critical flags for common errors. I'll first present the procedure, then apply it to your three cases, and conclude with its limitations.

  ---

  ### **Heritability Claim Evaluation Procedure**  
  *(Run steps in order; stop if claim fails any "Well-Formed?" check)*  

  #### **STEP 1: CLAIM VALIDATION (Is the claim well-formed?)**  
  - **✓ Well-formed?** The claim must specify:  
    - (a) **Population** (e.g., "Icelandic adults," "U.S. twins born 1990–2000").  
    - (b) **Environment range** (e.g., "urban Sweden, 2010–2020," "standard lab conditions").  
    - (c) **Heritability type** (broad-sense *H²* or narrow-sense *h²*).  
    - (d) **Trait measurement method** (e.g., clinical diagnosis, self-report, direct measurement).  
  - **⛔ Stop if missing:** Claim is invalid. Demand original study.  

  #### **STEP 2: INTERPRETATION BOUNDARIES (What does the number *actually* mean?)**  
  A heritability estimate (*H²* or *h²*) **only ever means**:  
  > *"The proportion of **trait variance** in **this population** under **these environments** that is statistically associated with genetic variation."*  

  - **✓ Licensed inferences:**  
    - Predictions about **response to selection** (in similar environments).  
    - Rough estimates of **trait resemblance among relatives** (e.g., twin concordance).  
  - **⛔ Category errors (FLAG THESE):**  
    - "Genes explain X% of an **individual's** trait." (Heritability ≠ individual causation.)  
    - "The trait is genetically fixed/unchangeable." (High *h²* ≠ environmental interventions won’t work.)  
    - "Group differences are genetic because *h²* is high in both groups." (Within-group ≠ between-group; see Step 4).  

  #### **STEP 3: STUDY DESIGN INTERROGATION (Trust the estimate?)**  
  Ask these **methodological questions** (if original study is available):  
  1. **Sample size?** <i>N</i> < 1,000? → Flag high error margins.  
  2. **Trait distribution?** Binary/categorical traits (e.g., schizophrenia)? → Requires threshold models; *h²* estimates are coarse.  
  3. **G×E covariance?** (e.g., genes correlate with environment). If present, *h²* confounds gene-environment interplay.  
  4. **Environmental range constrained?** (e.g., all subjects well-nourished). If yes, *h²* may inflate if environments are uniform.  
  5. **Narrow-sense (*h²*) vs. broad-sense (*H²*)?** *H²* includes non-additive effects; often larger and less predictive.  

  #### **STEP 4: COMMON INFERENCE CHECKS (Apply logical filters)**  
  - **⛔ "Individual causation" claim?** → **Flag:** Heritability is a population statistic. No individual % attribution.  
  - **⛔ "Trait immutability" claim?** → **Flag:** *h²* = 0.8 means environmental changes could still massively shift trait mean (e.g., height in nutrition-rich vs. poor societies).  
  - **⛔ "Between-group difference" claim?** → **Flag:** Heritability **within** groups says **nothing** about causes of differences **between** groups (even if *h²* is identical). Requires separate evidence.  
  - **✓ "Policy relevance" claim?** → **Judgment call:** High *h²* may inform breeding programs; low *h²* suggests environmental interventions *could* work. **But** always confirm G×E is low.  

  #### **STEP 5: VERDICT STRUCTURE**  
  - **A. Clear falsehood:** Claim commits a **category error** (Step 2 or Step 4). → **Verdict: Invalid.**  
  - **B. Underdetermined:** Study design issues (Step 3) or missing G×E data. → **Verdict: Unsupported; estimate unreliable.**  
  - **C. Plausible but limited:** Claim respects boundaries (Step 2) and design is sound. → **Verdict: Valid but narrow** (only applies to this population/environment).  

  ---

  ### **Application to Your Cases**  
  **Key:**  
  ✓ = Pass, ⛔ = Fail, ⚠️ = Judgment call  

  #### **Case 1: Schizophrenia "80% heritable, so prevention should focus on genes."**  
  - **Step 1:** ✓ (Usually specifies population, *h²* from twin studies).  
  - **Step 2:** ⛔ "Mostly genetic" implies individual causation; prevention focus ignores G×E.  
  - **Step 3:** ⚠️ Schizophrenia is binary; twin studies often have G×E covariance (e.g., genes influence trauma exposure).  
  - **Step 4:** ⛔ Flags: "individual causation" and "trait immutability" fallacies.  
  - **Verdict:** **Invalid.** Category error (Step 2). High *h²* does not license ignoring environmental prevention (e.g., reducing childhood adversity).  

  #### **Case 2: Finger number "near-zero heritability, so genes hardly matter."**  
  - **Step 1:** ✓ (Human populations, direct count; *h²* ≈ 0).  
  - **Step 2:** ⛔ Confuses low *heritability* with low *genetic control*. Genes are essential for finger development (canalization).  
  - **Step 3:** ✓ Design usually sound (trait is stable/measurable).  
  - **Step 4:** ⛔ Flags: "individual causation" fallacy (genes matter, but variance is environmental, e.g., accidents).  
  - **Verdict:** **Invalid.** Category error (Step 2). Low *h²* reflects low variance, not lack of genetic mechanism.  

  #### **Case 3: Height difference between nourished/undernourished groups "must be genetic" due to 80% *h²* in both.**  
  - **Step 1:** ✓ (Specifies populations, *h²* estimated in each).  
  - **Step 2:** ✓ Correctly describes *h²* (if study exists).  
  - **Step 3:** ⚠️ If environment ranges are constrained *within* groups (e.g., all undernourished subjects equally malnourished), *h²* may inflate.  
  - **Step 4:** ⛔ **Flagged:** "Between-group difference" fallacy. Within-group *h²* ≠ cause of between-group difference.  
  - **Verdict:** **Invalid.** Category error (Step 4). The height difference could be 100% environmental (e.g., nutrition), even with high within-group *h²*.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Handle non-additive effects:** If *H²* (broad-sense) is reported, the procedure flags it but cannot quantify epistasis/G×E.  
  2. **Resolve "missing heritability":** Low *h²* estimates for complex traits may reflect methodological limits (e.g., rare variants).  
  3. **Address gene-environment correlation (*rGE*):** Requires data on how genes shape environments (e.g., genetic influence on nutrition access), which is rarely measured.  
  4. **Predict dynamic systems:** Fails for traits with feedback loops (e.g., education → environment → gene expression).  
  5. **Override values:** If a claim says "high *h²* justifies eugenics," the procedure flags statistical errors, but rejecting eugenics remains an ethical choice.  

  ### **Your "Unliked Verdict" Note**  
  As a geneticist, your instinct may want Case 3 to be "plausible" — but the procedure strictly enforces the **within-group ≠ between-group** firewall. This is where quantitative genetics ends and ideology begins. The policy claim commits a known logical error, independent of biological truth.  

  Use this to teach that heritability estimates are *local statistics*, not universal truths. For nuanced cases (e.g., G×E in schizophrenia), augment with citations to Keller & Miller (2006) or Turkheimer (2000).
