answer: |-
  Here's a decision-tree handout structured as continuous prose for your seminar. It starts from foundational questions and branches to named positions, avoiding technical formatting while covering the requested views and addressing conceptual gaps:

  Begin by asking whether we can meaningfully assert, as a factual claim (not just a value judgment), that one person is better off than another—for example, that a starving person is worse off than a millionaire. If you reject this possibility entirely, believing such comparisons are inherently normative or lack scientific basis, you arrive at Robbinsian ordinalism. This position holds that utility is ordinal and purely subjective, making interpersonal comparisons impossible without importing ethical assumptions. If, however, you accept that factual interpersonal comparisons are possible, proceed by asking what underlying phenomenon we compare. Is it preference satisfaction (what people desire), felt experience (like pleasure or pain), or achieved functionings (what people can do or be)? 

  If you emphasize preference satisfaction, consider how preferences are compared. If you believe we can infer strength of preference from observable choices—such as willingness to pay for goods or sacrifices made in markets—you endorse revealed-preference comparability, which treats behavior as a proxy for utility intensity. If, instead, you think preferences require empathetic engagement—imagining yourself in another’s position to rank outcomes—you adopt Harsanyi’s extended preferences, where impartial observers construct comparable utilities through hypothetical choice. These two preference paths rarely merge; revealed-priority requires actual choices, while Harsanyi relies on counterfactual empathy, making them incompatible without circularity.

  If you focus on felt experience, you align with hedonistic or neural-currency views, where well-being stems from conscious states (e.g., pleasure minus pain). Historically, this invoked Bentham’s "hedonimeter," a hypothetical device measuring cardinal utility; modern descendants use neuroscientific data (e.g., neural responses to pain) to ground comparisons. If you prioritize functionings (e.g., being healthy or educated), ask whether comparisons are always precise. If you demand exact cardinal measurements (e.g., precise ratios of advantage), no major theory fits—Sen’s capabilities explicitly reject this, and functionings resist quantification. If you accept that comparisons can be partial or rough (e.g., knowing starvation is worse than satiety without quantifying "how much"), you reach Sen’s capability approach, where well-being derives from freedoms and achievements, with comparability limited to clear cases.

  The tree yields six leaves: Robbinsian ordinalism (no factual comparability), revealed-preference comparability (behavioral choices), Harsanyi (empathetic preferences), hedonism (neural/experiential states), Sen (partial comparability via functionings), and a conceptual dead end for exact functioning-based comparisons (unoccupied due to its infeasibility). Two combinations are notably absent: hedonistic revealed preference (incoherent, as behavior doesn’t directly reveal inner states) and empathetic capabilities (unexplored, lacking a bridge between preferences and functionings). The tree struggles to cleanly separate Sen from hedonism in borderline cases (e.g., mental health), where functionings and experience overlap, and Harsanyi from revealed preference when empathetic judgments incorporate observed behavior—though their foundations remain distinct.
