prompt: |-
  ok so here's where i'm stuck. i'm trying to write a paper on causation by omission and i realized i don't actually know what the success conditions are. like, what would it mean to have a good theory of this? before i read another paper i want someone to lay out the desiderata.

  what does a theory of causation by omission need to get right? i want the full list of requirements, with the case or consideration that motivates each one, and a clear mark on which are non-negotiable and which are just things particular camps want.

  here are the kinds of things that keep me up at night:

  - the selection problem: the gardener fails to water the plant and it dies. the queen of england also failed to water it. we say the gardener's omission caused the death but the queen's didn't. a theory has to explain why, and it can't just say "the gardener had a duty" unless it's willing to make causation depend on norms, which is a whole thing.
  - the preemption problem: suppose lifeguard A doesn't jump in to save the swimmer, but lifeguard B was also on duty and also didn't jump in, and B would have failed to jump in even if A had jumped in. did A's omission cause the death? the standard counterfactual test gives weird answers here because the death doesn't depend counterfactually on A's omission if B would have failed anyway.
  - the baseline problem: when we say someone "omitted" to do X, we're comparing them to some baseline of what they should have done or normally would have done. but what sets the baseline? is it statistical, normative, contextual? and if it's normative, are we still doing metaphysics or have we switched to ethics?
  - the metaphysics question: are omissions even the kind of thing that can stand in causal relations? some people say omissions are absences, and absences aren't real, so omission "causation" is just a façon de parler we use when we're assigning responsibility. if that's right, then a theory of omission causation is really a theory of responsibility attribution, not causation. but then what do we do with cases where omissions seem causal but there's no responsibility at stake (like a rock that fails to stop a rolling boulder)?
  - the consistency constraint: should a theory of causation by omission be a special case of our best theory of causation simpliciter, or is it its own thing? if you're a counterfactual theorist about regular causation, you probably want omission causation to also be counterfactual. but if you're a process theorist (causation is about physical processes, mark-transmission, etc.), omissions look really awkward because there's no process connecting the omission to the outcome. so is it a desideratum that the theory unify both kinds, or is that optional?
  - the moral entanglement problem: we use causal language about omissions all the time in moral and legal contexts—"her failure to disclose the risk caused the patient's harm." but if our theory of omission causation builds in normative elements (duties, expectations, reasons), then we can't use causal judgments about omissions to ground moral judgments without circularity. so is it a requirement that the theory keep causation and normativity separate, or is that asking too much?

  i want to know which of these are genuine desiderata and which are just things people worry about that a theory can legitimately set aside. and crucially: are any of these in tension? like, if you solve the selection problem by appealing to norms, you might fail the moral entanglement requirement. if you solve the preemption problem by going counterfactual, you might fail the selection problem. i need a map of the tradeoffs.

  then, very briefly: how do the three main camps—counterfactual views (where omissions are causes when the outcome depends counterfactually on the absence of the relevant event), norm-based views (where omissions are causes relative to a normative baseline), and the "omissions aren't causes" view (where we paraphrase away omission talk)—do against the list? just a sentence or two each.

  american english, and it's fine if it's a little rough, i just need the structure.
reasoning: |-
  Okay, the user is writing a paper on causation by omission and needs clarity on what makes a theory successful. They've listed several problems: selection, preemption, baseline, metaphysics, consistency, and moral entanglement. They want a structured list of desiderata with motivations, priority levels, and potential tensions. Then, a quick comparison of the main theoretical camps.

  First, I need to outline the core requirements for any theory of causation by omission. The user mentioned six key issues, each pointing to a desideratum. Let's break them down one by one. 

  Starting with **Discrimination (Selection Problem)**: The theory must explain why some omissions are causes but not others, like the gardener vs. the queen. This is non-negotiable because any theory that can't distinguish relevant from irrelevant omissions fails. The challenge is doing this without immediately resorting to norms, which ties into the moral entanglement problem. 

  Next, **Preemption Handling**: Cases like the two lifeguards where one omission might preempt another. The theory should resolve such cases without weird counterfactual dependencies. This is also non-negotiable as preemption is a classic problem in causation generally. 

  **Baseline Specification**: Defining what counts as an omission—statistical, normative, or contextual. The user worries about whether norms make it non-metaphysical. This is non-negotiable too because without a baseline, omissions aren't defined. But different theories might handle it differently. 

  **Metaphysical Coherence**: The theory must address whether omissions (as absences) can be causal. This is non-negotiable for a metaphysical account but optional if the theory is pragmatic. The rock example (no responsibility but causal intuition) shows it's not just about responsibility. 

  **Consistency with General Causation**: Should omission causation fit within a broader theory like counterfactual or process-based? This is negotiable; unification is desired but not mandatory. Process theories struggle here, so consistency might be a high-cost desideratum. 

  **Normative Neutrality**: Avoiding circularity when using causal claims in moral/legal contexts. If the theory builds norms into causation, it can't ground moral judgments without circularity. Non-negotiable for theories aiming to keep metaphysics and ethics separate. 

  Now, tensions: Solving Discrimination with norms (e.g., duties) conflicts with Normative Neutrality. Counterfactual approaches handle Preemption but fail Discrimination without extra elements. Metaphysical Coherence might force a view that omissions aren't real causes, complicating Consistency. 

  Assessing the camps: 
  - **Counterfactual Views** (e.g., Lewis): Add conditions like normalcy or expectations to handle Discrimination, but struggle with Preemption and might compromise Normative Neutrality. 
  - **Norm-Based Views**: Excel at Discrimination and Baseline but fail Normative Neutrality and Metaphysical Coherence. 
  - **Eliminativist Views**: Handle Metaphysical Coherence and avoid norms but must paraphrase away omissions, potentially failing Discrimination and Consistency. 

  The user needs to decide which desiderata are priorities. If they want metaphysical rigor, Eliminativism might work, but it's revisionist. If they need to capture everyday talk, a norm-based or refined counterfactual approach is better, though with trade-offs on circularity or unity. Highlighting these tensions will help them structure their paper's critique of existing theories.
answer: |-
  Here's a breakdown of the desiderata for a theory of causation by omission, structured as requested. I'll categorize them by your concerns, mark priority, highlight tensions, and briefly assess the main camps.

  **Core Desiderata (Non-Negotiable for a *Causal* Theory):**

  1.  **Discrimination (Selection Problem):**
      *   **Requirement:** The theory MUST systematically distinguish *causally relevant* omissions (gardener not watering) from *causally irrelevant* omissions (Queen not watering) in the same scenario.
      *   **Motivation:** Intuition & practice (we constantly make these distinctions; without it, causation becomes absurdly overpopulated).
      *   **Non-Negotiable:** Yes. Failure here renders the theory useless for explaining actual causal judgments.
      *   **Tension Link:** Directly conflicts with the desire for **Normative Neutrality** if solved via norms. Solving it purely descriptively (e.g., statistical normalcy) risks being inadequate.

  2.  **Preemption Handling:**
      *   **Requirement:** The theory MUST provide a principled account of cases like the two lifeguards, determining whether A's omission caused the death despite B's backup omission.
      *   **Motivation:** Preemption is a fundamental challenge for *any* theory of causation (omission or positive action). A theory that falters here is incomplete.
      *   **Non-Negotiable:** Yes (as a core causal challenge).
      *   **Tension Link:** Counterfactual approaches (often used for omissions) notoriously struggle with preemption generally. Solutions might conflict with **Consistency** if ad-hoc for omissions.

  3.  **Baseline Specification:**
      *   **Requirement:** The theory MUST explicitly state what determines the relevant baseline against which an *omission* is defined (what "should have been done").
      *   **Motivation:** Omissions are defined negatively (the absence of an expected action). Without specifying the baseline (watering, jumping in), we can't even identify the omission candidate.
      *   **Non-Negotiable:** Yes. The concept is incoherent without this.
      *   **Tension Link:** The *source* of the baseline (norms, statistics, context) directly impacts the **Metaphysical Coherence** and **Normative Neutrality** desiderata. Is the baseline metaphysical or pragmatic?

  4.  **Metaphysical Coherence:**
      *   **Requirement:** The theory MUST address the ontological status of omissions (as absences) and explain how they can be causal relata without violating fundamental metaphysical principles (e.g., "nothing comes from nothing").
      *   **Motivation:** The rock example - we have strong intuitions that the rock's *failure* to stop the boulder caused the hut's destruction, even with no responsibility. A purely metaphysical theory must account for this.
      *   **Non-Negotiable:** Yes, for a theory claiming to be about *causation itself*. (An eliminativist view rejects this need by denying omissions are causes).
      *   **Tension Link:** Clashes fundamentally with **Norm-Based Views** if norms are seen as non-metaphysical. Creates tension with **Consistency** for physical process theories.

  **Important, But Potentially Negotiable/Context-Dependent Desiderata:**

  5.  **Consistency with General Causation:**
      *   **Requirement:** Ideally, the account of omission causation should be a natural extension or special case of the theory's account of causation by positive events (e.g., both explained by counterfactuals, or both involving processes if possible).
      *   **Motivation:** Theoretical elegance, parsimony, avoiding ad-hoc solutions. We intuitively treat omissions *as* causes similarly to actions.
      *   **Priority:** Highly Desirable, but potentially negotiable. Some theories might sacrifice this for other gains. Process theorists often abandon it for omissions.
      *   **Tension Link:** Direct tension with **Metaphysical Coherence** for physical process theories. Counterfactual theories achieve this more easily but face other problems.

  6.  **Normative Neutrality:**
      *   **Requirement:** The theory SHOULD avoid building normative concepts (duties, obligations, reasons) directly into the *definition* or *metaphysics* of omission causation itself.
      *   **Motivation:** Avoiding circularity in moral/legal reasoning (using causal claims to ground responsibility), handling non-normative cases like the rock, preserving a distinction between causal and moral assessment.
      *   **Priority:** Highly Desirable, but contested. Norm-based views explicitly reject this. A theory *can* be successful without it if it embraces normativity as fundamental to causation-by-omission.
      *   **Tension Link:** Direct, core tension with solving the **Discrimination** and **Baseline Specification** problems via normative baselines/duties. Also conflicts with the intuition driving the rock case for **Metaphysical Coherence**.

  **Map of Key Tensions:**

  *   **Discrimination vs. Normative Neutrality:** Solving *why the gardener, not the Queen* almost inevitably points to norms (duty, role, expectation). Avoiding norms makes discrimination extremely difficult on purely descriptive grounds (statistics often fail).
  *   **Metaphysical Coherence vs. Consistency (for Process Theories):** Physical process theories struggle to make sense of absences causing anything, creating tension with unifying omission and positive causation.
  *   **Preemption Handling vs. Counterfactual Simplicity:** Standard counterfactual dependence fails in preemption cases (A's omission isn't necessary if B would omit anyway). Fixing this often requires complex additions (e.g., "influence," "actual causation" variants) that may feel less elegant.
  *   **Baseline Specification vs. Metaphysical Coherence:** If the baseline is normative, is the resulting "causation" still a matter of fundamental metaphysics? If statistical, is it robust enough?

  **Brief Camp Assessment:**

  1.  **Counterfactual Views (e.g., Lewis, refined):**
      *   **Pros:** Handles **Preemption** with modifications (often), good **Consistency**. Can incorporate normalcy/expectations for **Discrimination/Baseline**.
      *   **Cons:** Reliance on "normal" conditions for **Discrimination/Baseline** often smuggles in normativity, threatening **Normative Neutrality**. **Metaphysical Coherence** concerns remain (absences as relata). Rock case is awkward.

  2.  **Norm-Based Views (e.g., some responsibility-focused accounts):**
      *   **Pros:** Excels at **Discrimination** and **Baseline Specification** (duty/role sets baseline). Handles lifeguard preemption plausibly (only A had duty?).
      *   **Cons:** Explicitly rejects **Normative Neutrality** & **Metaphysical Coherence** (causation is inherently normative/pragmatic here). Fails the rock test. Poor **Consistency** with physical causation theories.

  3.  **Eliminativist/"Not Real Causes" Views (e.g., strict process theorists, some philosophers):**
      *   **Pros:** Strong on **Metaphysical Coherence** (only processes/events cause; omissions are absences). Preserves **Normative Neutrality** (causal talk is pragmatic/paraphrase).
      *   **Cons:** Fails **Discrimination** and **Baseline** *as causal problems* (pushes them entirely to ethics/responsibility). Radically revises common usage. Very poor **Consistency** with how we *talk* about causation. Struggles to explain the *felt causal difference* between the gardener and the Queen.

  **Summary:** The core non-negotiables are **Discrimination**, **Preemption Handling**, **Baseline Specification**, and **Metaphysical Coherence**. **Consistency** and **Normative Neutrality** are highly desirable but are often the points where theories diverge and make trade-offs. The tensions between Discrimination/Neutrality and Coherence/Consistency are fundamental fault lines in the debate. No camp satisfies all desiderata easily; each prioritizes differently and pays a price elsewhere. Your paper's argument will likely hinge on which desiderata you argue are *most* fundamental for a successful theory. Good luck!
