  For the mapping: Split-brain conflicts mirror multi-POV narration where different "characters" (hemispheres) act independently. The left hemisphere's confabulation parallels unreliable narration - but crucially, it's unaware of its unreliability, unlike literary unreliable narrators who often signal their bias. The "press secretary" effect resembles free indirect discourse's blending of character and narrator voice.

  Where it breaks: Real split-brain lacks meta-narrative control. No "editor" exists to resolve conflicts, unlike authors who intentionally craft narrative dissonance. Also, the hemispheres don't collaborate like co-authors; they're stuck in parallel monologues.

