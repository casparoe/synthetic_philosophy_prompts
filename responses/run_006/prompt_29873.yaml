prompt: |-
  I work on risk-scoring models — the sort used to decide who gets bail, a loan, or extra monitoring — and I keep hitting the same wall. We wanted three things from the score, and each of them seemed obviously fair on it's own. First, the score should mean the same thing whoever it's applied to: a 7 out of 10 should carry the same risk for someone from group A as for someone from group B. Second, the people who wouldn't have had the bad outcome should be wrongly labelled high-risk at the same rate in both groups. Third, the people who would have had the bad outcome should be missed at the same rate in both groups. We treated these as just three ways of saying unbiased, and assumed any decent model would satisfy all three. But we could never get all three at once — it only seemed possible in degenerate cases, like when the two groups had the same underlying rate of the outcome, or when the model made no mistakes at all. A colleague hit the same thing with a hiring screen, so it wasn't just our data. Is there an established name or theorem for this exact configuration? I don't just want a label — give me your best definite account of what the result is, when it bites, and how the three requirements pull against each other, because I need to explain to my team why they can't treat them as interchangeable.
reasoning: |-
  We are dealing with three fairness criteria:

  1. **Equal Calibration** (or Predictive Parity): The score should be equally meaningful across groups. For a given score (e.g., 7 out of 10), the probability of the bad outcome (e.g., defaulting on a loan) should be the same for both group A and group B.

  2. **Equal False Positive Rate (FPR)**: Among those who do not have the bad outcome (the "negative" class), the rate at which they are incorrectly labeled as high-risk (i.e., false positives) should be the same for both groups.

     - Note: In the context of risk scoring, a high-risk label is typically a positive prediction (for the adverse event). So if the model predicts high-risk (positive) but the individual does not have the bad outcome (negative), that's a false positive.

  3. **Equal False Negative Rate (FNR)**: Among those who would have the bad outcome (the "positive" class), the rate at which they are incorrectly labeled as low-risk (i.e., false negatives) should be the same for both groups.

  The problem is that, in general, these three conditions cannot hold simultaneously unless in degenerate cases (like equal base rates or perfect prediction).

  This is a known result in the fairness literature, and it is often referred to as the **"Impossibility Theorem"** or **"Incompatibility of Fairness Criteria"**. The specific formulation you are describing (with these three conditions) is a variant that has been discussed in several papers.

  ### The Core Conflict

  The conflict arises because these three conditions, along with the underlying base rates (the proportion of positive outcomes in each group), are mathematically linked. Specifically:

  - Let group A have base rate \( p_A = P(Y=1 | A) \)
  - Let group B have base rate \( p_B = P(Y=1 | B) \)

  We also define the following for each group:
  - True Positive Rate (TPR) = \( P(\hat{Y}=1 | Y=1) \)
  - False Positive Rate (FPR) = \( P(\hat{Y}=1 | Y=0) \)

  Note: The condition (1) of equal calibration (predictive parity) requires that for a given risk score (which we can think of as a threshold on a continuous score to produce a binary prediction), the positive predictive value (PPV) is equal across groups. However, note that condition (1) as stated (a 7 out of 10 meaning the same risk) is about the continuous score. But in practice, when we set a threshold to make a decision (e.g., above 7 is high-risk), then we are essentially looking at the binary prediction. Therefore, condition (1) is equivalent to requiring that the **Positive Predictive Value (PPV)** is the same for both groups at that threshold? Actually, condition (1) is about the calibration of the score itself, meaning that the function that maps the score to the probability of the outcome is the same for both groups. However, when we are using the same threshold for both groups, then condition (1) implies that the PPV at that threshold is the same? Not exactly: condition (1) is about the meaning of the score, not about a fixed threshold. But note: if the model is well-calibrated for both groups, then the same score corresponds to the same probability of the event. This is a stronger condition than just having the same PPV at a fixed threshold.

  However, the three conditions you listed are often discussed in the context of binary classifiers. Let me reframe them in terms of the binary decision (using a threshold) and then we can see the incompatibility.

  ### Reframing with Binary Decisions

  Suppose we set a threshold to convert the score to a binary decision: if score >= threshold, then predict positive (high-risk); else negative (low-risk).

  Then the three conditions become:

  1. **Equal PPV (Predictive Parity)**: 
     \[ P(Y=1 | \hat{Y}=1, A) = P(Y=1 | \hat{Y}=1, B) \]
     This is the condition that the probability of the bad outcome given a high-risk prediction is the same for both groups.

  2. **Equal False Positive Rate (FPR)**:
     \[ P(\hat{Y}=1 | Y=0, A) = P(\hat{Y}=1 | Y=0, B) \]

  3. **Equal False Negative Rate (FNR)**: 
     This is equivalent to requiring equal True Positive Rate (TPR) because FNR = 1 - TPR. So:
     \[ TPR_A = TPR_B \quad \Leftrightarrow \quad P(\hat{Y}=1 | Y=1, A) = P(\hat{Y}=1 | Y=1, B) \]

  But note: condition (3) as you stated is about the false negative rate (FNR). So:
     \[ FNR = P(\hat{Y}=0 | Y=1) = 1 - TPR \]
     Therefore, requiring equal FNR is the same as requiring equal TPR? Only if we are setting the same threshold? Actually, no: if we set the same threshold, then the TPR and FPR are defined for each group. But note that condition (3) is about the false negative rate (FNR) being equal, which is equivalent to TPR being equal? Yes, because FNR = 1 - TPR. So condition (3) is equivalent to:
     \[ TPR_A = TPR_B \]

  Therefore, we are requiring:

     (a) Equal PPV (condition 1 at the threshold)
     (b) Equal FPR (condition 2)
     (c) Equal TPR (condition 3, via FNR)

  But note: condition (1) in your original problem was about the continuous score meaning the same thing (so that the same score corresponds to the same probability of the outcome). However, if we are talking about a fixed threshold, then condition (1) is equivalent to requiring that at that threshold, the PPV is the same? Actually, condition (1) is a stronger requirement: it requires that the entire calibration curve is the same. But for the purpose of the threshold-based decision, we only need the PPV at the threshold to be the same? 

  However, the impossibility result we are about to state is for the three conditions (a), (b), (c) above. And indeed, it is known that these three conditions (equal PPV, equal FPR, and equal TPR) cannot hold simultaneously unless the base rates are equal or the classifier is perfect.

  ### The Impossibility Result

  We can use Bayes' theorem to relate these quantities. For group A:

  \[ PPV_A = \frac{TPR_A \cdot p_A}{TPR_A \cdot p_A + FPR_A \cdot (1-p_A)} \]

  Similarly for group B:

  \[ PPV_B = \frac{TPR_B \cdot p_B}{TPR_B \cdot p_B + FPR_B \cdot (1-p_B)} \]

  Now, if we require:
     - \( PPV_A = PPV_B = PPV \)
     - \( TPR_A = TPR_B = TPR \)
     - \( FPR_A = FPR_B = FPR \)

  Then we have:

  \[ PPV = \frac{TPR \cdot p_A}{TPR \cdot p_A + FPR \cdot (1-p_A)} = \frac{TPR \cdot p_B}{TPR \cdot p_B + FPR \cdot (1-p_B)} \]

  This equation must hold. Let's set them equal:

  \[ \frac{TPR \cdot p_A}{TPR \cdot p_A + FPR \cdot (1-p_A)} = \frac{TPR \cdot p_B}{TPR \cdot p_B + FPR \cdot (1-p_B)} \]

  We can cancel TPR (assuming TPR != 0) and rearrange:

  \[ \frac{p_A}{TPR \cdot p_A + FPR \cdot (1-p_A)} = \frac{p_B}{TPR \cdot p_B + FPR \cdot (1-p_B)} \]

  But note that the denominators are the same as in the PPV expression? Actually, we can write:

  \[ \frac{1}{PPV} = 1 + \frac{FPR \cdot (1-p_A)}{TPR \cdot p_A} \]

  So:

  \[ \frac{1}{PPV} - 1 = \frac{FPR}{TPR} \cdot \frac{1-p_A}{p_A} \]

  Similarly for group B:

  \[ \frac{1}{PPV} - 1 = \frac{FPR}{TPR} \cdot \frac{1-p_B}{p_B} \]

  Therefore, we must have:

  \[ \frac{FPR}{TPR} \cdot \frac{1-p_A}{p_A} = \frac{FPR}{TPR} \cdot \frac{1-p_B}{p_B} \]

  Which implies:

  \[ \frac{1-p_A}{p_A} = \frac{1-p_B}{p_B} \]

  Hence:

  \[ \frac{p_A}{1-p_A} = \frac{p_B}{1-p_B} \]

  This implies \( p_A = p_B \).

  Therefore, the only way for the three conditions to hold simultaneously is if the base rates are equal or if the classifier is perfect (which would imply PPV=1 and FPR=0, but that is usually not achievable).

  ### Conclusion

  The three fairness criteria you described are:

  1. **Equal Calibration**: The same score should correspond to the same probability of the outcome in both groups. (This implies that the PPV at any given threshold is the same for both groups.)

  2. **Equal FPR**: The rate at which the model falsely flags low-risk individuals as high-risk is the same for both groups.

  3. **Equal FNR**: The rate at which the model fails to flag high-risk individuals (i.e., misses them) is the same for both groups.

  These three are mutually incompatible unless the base rates (the underlying prevalence of the bad outcome) are the same in both groups, or the model is perfect (which is typically unattainable).

  ### How to Explain to Your Team

  You can explain:

  - **Equal Calibration** ensures that the score is interpreted the same way regardless of group. This is important for trust and transparency.

  - **Equal FPR** is about fairness in the burden of being wrongly subjected to extra scrutiny (e.g., being denied bail or a loan when you would have been safe). It protects the "innocent" (those who would not have had the bad outcome) from being disproportionately burdened in one group.

  - **Equal FNR** is about fairness in the harm caused by missing a high-risk individual. It ensures that both groups are equally protected from the adverse event (by catching the same proportion of high-risk individuals).

  But these three are pulling in different directions because they require the base rates to be the same. In reality, base rates often differ across groups (e.g., due to historical or societal factors). Therefore, you have to choose which fairness criterion is most aligned with your goals and the context.

  ### Practical Advice

  In practice, you may need to:
  - Prioritize one or two of these criteria based on the specific application and the potential harms.
  - Use techniques that explicitly account for the trade-offs (e.g., by adjusting thresholds per group, but note that this might violate condition 1 if the score is interpreted differently per group).
  - Be transparent about the trade-offs and the chosen fairness criterion.

  ### Names

  This result is often associated with the work of Jon Kleinberg, Sendhil Mullainathan, and Manish Raghavan (2016) in their paper "Inherent Trade-Offs in the Fair Determination of Risk Scores". Also, Alexandra Chouldechova (2017) in "Fair Prediction with Disparate Impact: A Study of Bias in Recidivism Prediction Instruments" showed the incompatibility of predictive parity (calibration) and equal FPR/FNR in the context of recidivism prediction.

  It is also related to the more general result on the incompatibility of fairness criteria by Cynthia Dwork, Moritz Hardt, Toniann Pitassi, Omer Reingold, and Rich Zemel (2012) in "Fairness Through Awareness".

  In summary, the established name is the **"Impossibility Theorem"** for fairness in machine learning, specifically regarding the incompatibility of calibration, equal FPR, and equal FNR (or equivalently, equal PPV, equal FPR, and equal TPR) when base rates differ.
answer: |-
  Your experience reveals a fundamental impossibility in satisfying all three fairness criteria simultaneously, a well-established result in algorithmic fairness. This is often referred to as the **"Impossibility Theorem"** or **"Incompatibility of Fairness Criteria."** Below, I provide a precise account of the theorem, why the criteria conflict, when it applies, and how to explain it to your team.

  ---

  ### **1. The Three Criteria Formalized**
  Assume a binary outcome \(Y\) (e.g., "default" or "repay") and a risk score \(S\) (e.g., 0–10). For two groups \(A\) and \(B\) (e.g., racial or demographic groups), your requirements are:

  - **Criterion 1: Equal Calibration (Calibration-by-Group)**  
    \(P(Y=1 \mid S=s, A) = P(Y=1 \mid S=s, B)\) for all scores \(s\).  
    *Meaning*: A score \(s\) implies identical risk for both groups (e.g., 7/10 = 70% risk for everyone).

  - **Criterion 2: Equal False Positive Rate (FPR)**  
    \(P(S \geq \tau \mid Y=0, A) = P(S \geq \tau \mid Y=0, B)\) for a threshold \(\tau\).  
    *Meaning*: Among those who *would not* default (\(Y=0\)), both groups are equally likely to be incorrectly flagged as high-risk.

  - **Criterion 3: Equal False Negative Rate (FNR)**  
    \(P(S < \tau \mid Y=1, A) = P(S < \tau \mid Y=1, B)\) for a threshold \(\tau\).  
    *Meaning*: Among those who *would* default (\(Y=1\)), both groups are equally likely to be incorrectly missed as low-risk.

  ---

  ### **2. The Impossibility Theorem**
  **Statement**:  
  *It is mathematically impossible to satisfy all three criteria simultaneously unless one of two degenerate cases holds:*
  - *(a) The base rates are equal: \(P(Y=1 \mid A) = P(Y=1 \mid B)\), or*  
  - *(b) The model is perfect: FPR = FNR = 0\).*

  **Why?**  
  The criteria form an overconstrained system due to the **base rate disparity** between groups. Let:
  - \(p_A = P(Y=1 \mid A)\), \(p_B = P(Y=1 \mid B)\) (base rates of the bad outcome).
  - \( \text{FPR}_A, \text{FPR}_B \), \( \text{FNR}_A, \text{FNR}_B \) be the group-specific error rates.

  By Bayes' theorem and the definitions of FPR/FNR, the **Positive Predictive Value (PPV)**—the probability of default given a high-risk score—must satisfy:
  \[
  \text{PPV}_A = \frac{p_A (1 - \text{FNR}_A)}{p_A (1 - \text{FNR}_A) + (1 - p_A) \text{FPR}_A}
  \]
  \[
  \text{PPV}_B = \frac{p_B (1 - \text{FNR}_B)}{p_B (1 - \text{FNR}_B) + (1 - p_B) \text{FPR}_B}
  \]

  If all three criteria hold:
  - **Equal Calibration** \(\implies \text{PPV}_A = \text{PPV}_B\) (at any threshold \(\tau\)).  
  - **Equal FPR** \(\implies \text{FPR}_A = \text{FPR}_B\).  
  - **Equal FNR** \(\implies \text{FNR}_A = \text{FNR}_B\).  

  Substituting equal FPR/FNR into the PPV equations, we get:
  \[
  \frac{p_A (1 - \text{FNR})}{p_A (1 - \text{FNR}) + (1 - p_A) \text{FPR}} = \frac{p_B (1 - \text{FNR})}{p_B (1 - \text{FNR}) + (1 - p_B) \text{FPR}}
  \]
  This simplifies to \(p_A = p_B\) unless \(\text{FPR} = \text{FNR} = 0\).  
  **Thus, equal base rates are a necessary condition for all three to coexist.**

  ---

  ### **3. How the Criteria Pull Against Each Other**
  - **Equal Calibration vs. Error Rate Balance**  
    Equal calibration enforces that scores reflect the same risk regardless of group. However, if group \(A\) has a higher base rate (\(p_A > p_B\)), a well-calibrated model must assign higher risk scores to group \(A\) on average. To achieve equal FPR/FNR, the model must **artificially lower scores for group \(A\)** to avoid flagging too many of its low-risk members as high-risk (FPR) or missing too many high-risk members (FNR). This violates calibration.

  - **FPR vs. FNR Trade-off**  
    If base rates differ, forcing equal FPR often *worsens* FNR disparity (and vice versa). For example:  
    - To equalize FPR when \(p_A > p_B\), you must relax the threshold for group \(A\) (lowering FPR). This increases FNR for group \(A\), harming equal FNR.  
    - Conversely, equalizing FNR requires tightening thresholds for group \(A\), exacerbating FPR.

  ---

  ### **4. When the Impossibility "Bites"**
  The conflict arises under two real-world conditions:
  1. **Base Rate Disparity**: When \(P(Y=1 \mid A) \neq P(Y=1 \mid B)\). This is common (e.g., loan default rates varying by neighborhood, recidivism rates by race).  
  2. **Imperfect Models**: All real-world models make errors (FPR > 0, FNR > 0).  

  Degenerate cases where all three hold are:
  - **Equal base rates**: \(p_A = p_B\) (e.g., identical default rates for both groups).  
  - **Perfect prediction**: The model has no errors (FPR = FNR = 0), which is unrealistic.

  ---

  ### **5. Explaining to Your Team**
  **Key Message**:  
  > *"These three criteria are mathematically incompatible when groups have different underlying rates of the outcome (e.g., default rates) and the model isn't perfect. Treating them as interchangeable fairness definitions is misleading—they represent distinct, often conflicting, notions of justice."*

  **Analogies to Clarify**:
  - **Medical Testing Analogy**:  
    Suppose Group A has a higher disease prevalence than Group B.  
    - Equal calibration: A positive test means the same risk for both groups.  
    - Equal FPR: Healthy people are equally likely to get false positives.  
    - Equal FNR: Sick people are equally likely to be missed.  
    If prevalence differs, you can't have all three without perfect tests.  

  - **Hiring Analogy**:  
    Group A has more qualified candidates than Group B.  
    - Equal calibration: A "pass" score means equal competence for both.  
    - Equal FPR: Unqualified candidates are equally likely to pass.  
    - Equal FNR: Qualified candidates are equally likely to be rejected.  
    If qualification rates differ, satisfying all three is impossible.

  **Why Prioritize?**  
  Each criterion aligns with different ethical priorities:
  - **Equal Calibration**: Fairness in **risk communication** (e.g., a score of 7 shouldn't mean 50% risk for one group and 80% for another).  
  - **Equal FPR**: Fairness in **burden of scrutiny** (e.g., innocent people shouldn't face more monitoring in one group).  
  - **Equal FNR**: Fairness in **access to opportunity** (e.g., safe candidates shouldn't be denied loans more in one group).  

  **Recommendation**:  
  Explicitly **choose one criterion as primary** based on context:
  - Lending/insurance: Calibration (accurate risk pricing).  
  - Criminal justice: Equal FPR (avoid over-policing low-risk groups).  
  - Healthcare: Equal FNR (ensure equal access to treatment).

  ---

  ### **6. Established Names & References**
  - **Primary Name**: **Impossibility Theorem** (or **Kleinberg-Mullainathan-Raghavan Impossibility**, after the 2016 paper).  
  - **Key Papers**:  
    1. Kleinberg, Mullainathan, Raghavan (2016): [Inherent Trade-Offs in the Fair Determination of Risk Scores](https://arxiv.org/abs/1609.05807).  
    2. Chouldechova (2017): [Fair Prediction with Disparate Impact](https://arxiv.org/abs/1610.07524) (simplified proof for binary classifiers).  
  - **Related Concepts**:  
    - **Impossibility of "Fairness Through Blindness"**: Removing group labels doesn't resolve this.  
    - **Multicalibration**: A relaxation of calibration that allows for approximate group fairness.  

  ---

  ### **Summary for Your Team**
  - **The Conflict**: Equal calibration, FPR, and FNR cannot coexist when base rates differ and models are imperfect.  
  - **Why It Matters**: These criteria reflect competing notions of fairness; prioritizing one often sacrifices others.  
  - **Actionable Path**: Decide which criterion aligns with your ethical goals. Document trade-offs transparently.  
  - **Quote to Share**: *"Mathematical fairness is multidimensional. You can't achieve all dimensions at once—unless the world is perfectly balanced or your model is perfect. Neither is realistic."*  

  This framework should empower your team to navigate fairness trade-offs with clarity. If you need further details on specific models or mitigation strategies, I can expand!
