prompt: |-
  I'm teaching a philosophy of biology seminar this term and one of my sharper students keeps trotting out 'survival of the fittest is a tautology' to push back on every adaptationist explanation I float. I know Popper said something in this ballpark and then famously recanted, but the student isn't citing Popper — he's just using the phrase as a conversation-stopper, like it's obvious that any appeal to fitness is circular. I want to hand him a sheet next week that lays out all the distinct things that slogan could actually mean, from the trivial to the substantive, and for each one say whether it's defensible and whether it actually undermines the kind of evolutionary explanation he's objecting to. Help me build that menu — I'd rather not miss a reading and have him point it out in front of the class.
