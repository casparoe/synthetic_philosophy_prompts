prompt: |-
  I'm a retired chemist who's gotten into epistemology the last couple years, and I keep going back and forth on the lottery paradox and the preface paradox. The standard line is they're different beasts — in the lottery your evidence is purely statistical, while in the preface you've done careful work on each individual claim. But I've got a hunch the logical structure might matter more than the type of evidence.

  Here's what I'd like you to build: a thought experiment where the evidence is specific and case-by-case, like the preface — the subject has actually investigaged each claim individually, it's not just base rates — but the logical setup is lottery-like: the subject knows from the design of the situation (not from general human fallibility) that exactly one of the claims in the set is false. The question is whether the subject can still rationally believe each claim individually while also believing the conjunction is false. Basically, does the preface intuition survive when you force the lottery's logical structure onto preface-style evidence?

  After you lay out the case, walk me through: (1) what the "they're fundamentally different" camp would say about it, (2) what a unificationist would say, (3) which specific feature of the case is doing the work to decide between them, and (4) what happens if you relax the "exactly one is false" constraint to "probably at least one is false" — does it just collapse back into a standard preface case, or does something else happen?
