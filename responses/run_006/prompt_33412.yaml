prompt: |-
  I'm a PhD student in cognitive science, and my advisor volunteered me to run a two-hour seminar on predictive processing and the free energy principle for a reading group of philosophy grad students. They're mostly philosophy of mind and epistemology people — one guy works on Kant, another on embodied cognition, nobody with a computational background beyond maybe a stats course in undergrad. They've heard the buzzwords: Markov blanket, active inference, minimize surprise. They're curious but also sceptical in that way philosophers are, and I'm half-expecting someone to ask whether the whole thing is just teleology smuggled back into science. So I don't just want to explain the theory; I need a plan for the session that actually gets the architecture of the view across — the dependencies between the ideas, why the pieces fit together the way they do — rather than leaving them with a fog of jargon and the impression that it's unfalsifiable.

  Don't explain the theory to me; I know it. What I need is a teaching plan. In particular: the order in which the conceptual pieces have to be introduced and what depends on what (e.g., I assume you can't start with the free energy principle itself — something about hierarchical generative models has to come first, but how much?). The one central example or case study that should carry the whole thing, and why that one rather than the standard visual-perception demos everyone uses. The misconceptions I should expect from this specific audience — I'm guessing they'll conflate prediction with conscious forecasting, or think the whole thing is just a trivial claim about homeostasis, or assume the Bayesian brain is committed to the idea that the world is actually uncertain — and exactly where in the sequence I should head each one off. What I should openly say we're not going to cover at this level (and why, so it doesn't look like I'm dodging). And one question I can pose at the very end that would tell me whether they've understood the structure of the view rather than just memorised the vocabulary.

  After the prose plan, give me a structured summary as a JSON object with these fields: "conceptual_steps" (an ordered list of the steps, each with a one-sentence rationale for why it has to come at that point), "carrying_example" (the example and a brief justification for choosing it), "misconceptions" (an array of objects, each with "misconception", "step_to_address", and "how"), "check_for_understanding" (the question), and "exclusions" (what's left out and why).
reasoning: |-
  We are designing a seminar for philosophy students with no computational background. The goal is to convey the architecture of predictive processing (PP) and the free energy principle (FEP), emphasizing dependencies and avoiding misconceptions.

  Conceptual Steps (Order and Rationale):
  1. **Start with Perception as Inference**: Begin by explaining that perception is not passive reception but active inference. Rationale: This is the most intuitive entry point (philosophers are familiar with perception) and sets up the core idea of the brain as an inference machine without requiring technical machinery.

  2. **Introduce Generative Models**: Explain that the brain uses internal models to generate predictions about sensory inputs. Rationale: Generative models are the core machinery for making predictions and are necessary before discussing prediction error.

  3. **Prediction Error Minimization**: Describe how the brain constantly compares predictions with actual input and minimizes the mismatch (prediction error). Rationale: This follows naturally from the generative model and is the engine of PP.

  4. **Hierarchical Organization**: Introduce multiple levels of processing (hierarchical generative models) where higher levels predict the activity of lower levels. Rationale: This step is needed to explain how complex systems can handle uncertainty and context, and it avoids the misconception that PP is just about simple reflexes.

  5. **Uncertainty and Precision Weighting**: Explain that prediction errors are weighted by their precision (reliability) and that uncertainty modulates this weighting. Rationale: This addresses the Bayesian aspect (without heavy math) and sets up active inference.

  6. **Active Inference**: Extend prediction error minimization to action: acting to change sensory input to match predictions. Rationale: This step shows that action is not separate from perception and addresses the embodied cognition perspective (which one student works on).

  7. **The Free Energy Principle as a Unifying Framework**: Present FEP as a principle that generalizes prediction error minimization to all living systems (minimizing surprise by minimizing free energy). Rationale: Now that the core machinery is in place, FEP can be introduced as the overarching principle without seeming like a deus ex machina.

  8. **Markov Blankets and Boundaries of the Self**: Explain how Markov blankets define a system's boundary (internal vs. external states) and how this relates to the self. Rationale: This step is placed after FEP because Markov blankets are a formal way to define the system that minimizes free energy, and it addresses the Kantian interest in the conditions for experience.

  Carrying Example:
  We choose **Proprioception and Motor Control** (e.g., catching a ball) rather than standard visual illusions. 
  Justification: 
  - It inherently involves action and perception (active inference) and can naturally include hierarchical processing (e.g., from low-level muscle commands to high-level goals). 
  - It is embodied and thus connects with the student working on embodied cognition. 
  - It avoids the common focus on passive perception and shows that PP is not just about vision. 
  - It can illustrate precision weighting (e.g., when vision is blurry, rely more on proprioception) and how prediction errors drive both perception and action.

  Misconceptions to Address:
  1. Misconception: Prediction in PP is like conscious forecasting (e.g., explicitly thinking about the future).
     Step to Address: Step 1 (Perception as Inference) or Step 3 (Prediction Error Minimization).
     How: Emphasize that predictions are mostly unconscious, automatic, and occur at multiple timescales. Use the example: when catching a ball, the brain predicts the sensory consequences of moving the hand without conscious deliberation.

  2. Misconception: PP is just a restatement of homeostasis (trivial claim that organisms maintain stability).
     Step to Address: Step 7 (FEP as Unifying Framework).
     How: Explain that FEP generalizes homeostasis to include adaptive changes and learning, and that minimizing free energy is more than just maintaining a set point — it involves model updating and structure learning.

  3. Misconception: The Bayesian brain implies the world is inherently uncertain (metaphysical claim).
     Step to Address: Step 5 (Uncertainty and Precision Weighting).
     How: Clarify that the uncertainty is epistemic (about the model's knowledge) and that precision weighting is a mechanism for dealing with noisy data, not a statement about the world's ontology.

  4. Misconception: PP/FEP is unfalsifiable (teleology in disguise).
     Step to Address: Step 7 (FEP) and throughout by emphasizing the architecture.
     How: Acknowledge the concern and then point to the specific mechanisms (generative models, prediction error minimization, active inference) that make testable predictions (e.g., in psychophysics, neuroimaging). Stress that FEP is a framework that generates hypotheses, not a single untestable claim.

  Exclusions (What We Won't Cover and Why):
  - **Mathematical Details** (e.g., variational inference, exact equations of free energy): The audience lacks the background, and the goal is conceptual understanding.
  - **Detailed Neuroanatomy** (e.g., specific cortical layers): This is a philosophical reading group, and the focus is on the computational level.
  - **Full History of Cybernetics and Connectionism**: While important, it's not essential for the architecture. We'll mention that PP builds on these traditions but won't dive in.
  - **Alternative Formulations** (e.g., different flavors of Bayesian inference): To avoid confusion and keep focused on the core PP/FEP story.

  Check for Understanding (Question at the End):
  "How does the concept of active inference, through the example of catching a ball in varying wind conditions, illustrate the role of hierarchical generative models and precision weighting in minimizing free energy?"

  This question requires them to integrate:
  - Active inference (action to change sensations)
  - Hierarchical processing (e.g., high-level: trajectory prediction, low-level: motor commands)
  - Precision weighting (e.g., in wind, visual input might be less precise, so rely more on proprioception or prior expectations)
  - Free energy minimization as the unifying principle

  It tests whether they see the dependencies and the architecture as a whole.

