answer: |-
  ### Teaching Plan for Predictive Processing Seminar

  **Core Goal:** Build the architecture of predictive processing (PP) and the free energy principle (FEP) from the ground up, emphasizing *why* the components are necessary and how they interlock. Prioritize conceptual dependencies over jargon.

  ---

  #### **Conceptual Sequence & Rationale**
  1. **Start with perception-as-prediction**  
     *Rationale:* Grounds the discussion in familiar philosophical territory (perception) and demonstrates why passive input models fail. Use ambiguous stimuli (e.g., the Necker cube) to show perception requires top-down expectations.

  2. **Introduce generative models as survival tools**  
     *Rationale:* Explains *why* brains predict: the world is noisy, and organisms must infer causes of sensory data to act efficiently. Use evolutionary pressure ("better safe than dead") to justify probabilistic inference.

  3. **Define prediction error minimization (PEM)**  
     *Rationale:* Positions PEM as the *mechanism* for refining generative models. Contrast with feedforward processing: emphasize that errors drive updates, not raw data.

  4. **Add hierarchy**  
     *Rationale:* Solves the "curse of dimensionality"—shows how cascading predictions (e.g., low-level edges → high-level objects) handle abstraction and context-dependence.

  5. **Introduce precision-weighting**  
     *Rationale:* Explains how brains handle uncertainty without Bayesian math. Use sensory attenuation (e.g., why you can't tickle yourself) to show precision adjusts trust in prediction vs. input.

  6. **Active inference as embodied PEM**  
     *Rationale:* Extends PEM to action. Shows prediction isn’t just "mental"—it drives movement to *make predictions come true*.

  7. **Free energy principle as necessity**  
     *Rationale:* Presents FEP as the inevitable umbrella for steps 1-6. Free energy minimization is *what organisms must do* to persist (surprise = death). Markov blankets emerge here as boundaries for prediction.

  8. **Markov blankets & the self**  
     *Rationale:* Final piece to address the "teleology" worry. Blankets aren’t mystical—they’re statistical boundaries defining what’s "me" vs. "world."

  ---

  #### **Carrying Example: *Proprioception in Balance***  
  - **Why this example?**  
    1. **Embodied:** Resonates with the student working on embodied cognition.  
    2. **Hierarchy visible:** Low-level (muscle tension), mid-level (body position), high-level (goal: "don’t fall").  
    3. **Active inference obvious:** Small posture shifts *are* actions minimizing prediction error (e.g., wobble correction).  
    4. **Precision critical:** In fog or on ice, precision-weighting fails → falls.  
    5. **Avoids visual bias:** Philosophers often fixate on perception; this forces engagement with action.  

  ---

  #### **Anticipated Misconceptions & Preemptive Strikes**
  | Misconception | Step to Address | How to Counter |
  |---------------|-----------------|---------------|
  | "Prediction = conscious forecasting" | Step 1 (perception-as-prediction) | Contrast proprioception (unconscious predictions) with explicit guessing. Use blindsight as counterexample. |
  | "PP is just homeostasis" | Step 7 (FEP introduction) | **Map:** Homeostasis → surprise minimization → FEP. Stress FEP’s scope: perception, action, learning, evolution. |
  | "Bayesian brain = world is uncertain" | Step 5 (precision-weighting) | "Uncertainty is in the *model*, not the world. Physics isn’t probabilistic—*inference* is." |
  | "FEP is unfalsifiable/teleological" | Step 7 (FEP) & Step 8 (Markov blankets) | "FEP is a *mathematical necessity* for bounded systems. Teleology would be ‘falling to live’—FEP says ‘you live *because* you don’t fall’." |

  ---

  #### **Exclusions & Justification**  
  - **Variational math:** "We’re skipping equations because FEP’s conceptual architecture doesn’t require calculus—it requires seeing why prediction *must* be hierarchical, active, and precise."  
  - **FEP as universe-level theory:** "Today’s focus is minds/brains. Cosmological claims need separate treatment."  
  - **Consciousness:** "PP explains *structure* of cognition. Whether it solves Hard Problems is debated—but that’s another seminar."  

  ---

  #### **Check for Understanding**  
  **Final Question:**  
  *"If a system minimizes free energy, why must it have a Markov blanket, and how does this force active inference?"*  
  - **Why it works:** Tests grasp of dependencies (FEP → blankets → action) and dispels teleology by highlighting mathematical necessity.  

  ---

