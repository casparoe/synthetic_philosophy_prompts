  I'm a PhD student in financial mathematics. I keep hearing about the Pasadena paradox in decision theory — the game where a fair coin is flipped until tails, with payoff (−1)^(n−1) · 2^n / n if tails first occurs on toss n, whose expectation is the conditionally convergent alternating harmonic series. The philosophical puzzle is that the expected value appears to be ln(2) under the natural ordering of outcomes, yet the Riemann rearrangement theorem says you can make the sum anything, so there seems to be no fact of the matter about what a rational agent should pay.

  Restate this problem and the surrounding debate in the vocabulary of mathematical finance — arbitrage pricing theory, equivalent martingale measures, the fundamental theorem of asset pricing, superhedging and subhedging bounds, risk-neutral valuation, and the distinction between integrable and non-integrable payoffs. Treat the game as a contingent claim on the coin-flip probability space. Then give me the residue report: which parts of the philosophical puzzle translate cleanly into questions about arbitrage pricing or the failure of integrability, which parts require distortion, and which parts have no counterpart in the finance vocabulary at all. In particular, I want to know whether the finance framework dissolves the paradox, reframes it as a known technical limitation, or reveals that the philosophers are grappling with something the finance vocabulary cannot capture.
