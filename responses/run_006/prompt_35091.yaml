  **Game Summary**:

  **Title**: The Recursive Median Game

  **Objective**: Predict the median of all players' predictions for the median.

  **Rules**:
  1. Each player writes a number between 0 and 100 (with one decimal place if they wish). This number is their prediction for the median of all submitted numbers.
  2. The median T is calculated:
     - Collect all numbers and sort them.
     - If the number of players n is odd: T is the number at position (n+1)/2 in the sorted list.
     - If n is even: T is the average of the numbers at positions n/2 and n/2+1.
  3. Scoring: Each player receives a score = 100 - |their guess - T|. (So the maximum score is 100.)

  **Materials**: Paper and pens for each player, a whiteboard or shared document to collect and display the numbers.

  **Time Allocation**:
  - Explain rules and answer questions: 5 min.
  - Players think and write their number: 10 min. (Encourage them to think about what others will do and how many levels of recursion they can go.)
  - Collect and compute T: 5 min (display the sorted list and mark T).
  - Show scores: 5 min. (Total 25 min)

  Then move to debrief (65 min).

  **Debrief Questions**:
  1. What was your reasoning process? How did you decide on your number?
  2. Did you consider that your own guess would affect the median? How did that feel?
  3. How did you model what others would do? Did you think about how they are modeling you?
  4. What does this say about the possibility of getting an "outside view" of the system?
  5. How does this relate to the embedded agency problem? (Draw connections to the readings.)

  **Concluding Points**:
  - In embedded agency, the agent is part of the system it is modeling, so it cannot take a detached view. The modeling activity is inside the model.
  - The recursion in the game is a simplified version of the recursion in self-referential systems. In real agents, this appears when the agent's model includes itself, leading to infinite regress or fixed points that are computationally inaccessible.
  - The game doesn't capture the full complexity (logical uncertainty, temporal aspects, etc.), but it illustrates the core challenge.

  **What to Supply in Discussion**:
  - Explain that in formal terms, embedded agency requires decision theories that can handle self-reference (e.g., updateless decision theory, logical induction) and models that can represent the agent within the environment (like recursive world models).
  - Discuss the limitations: the game is static and simultaneous, while real agents act sequentially and the environment changes. Also, the game has a known rule, but in reality, the agent must learn the rules.

  **Handling Problems**:
  - If the group converges too quickly: In the debrief, point out that in the real world, agents have diverse beliefs and computational limits, so convergence is not guaranteed.
  - If the median is too sensitive: Use a larger range (0 to 100) and allow decimals to make the median more stable? But even then, the median might jump. That's part of the experience: the system is sensitive to individual inputs when near the median.

  This game should create a visceral experience of the recursion and the impossibility of the outside view.
answer: |-
  Below is a structured game designed to make the recursion of embedded agency tangible, followed by a detailed debrief guide. The game, **"Prediction Prisoner's Dilemma"**, forces players to confront self-referential prediction while creating a visceral sense of the "Cartesian boundary" illusion. It uses a simple ruleset with no special materials (just paper/pens or a shared digital doc).

  ---

  ### **Game: Prediction Prisoner's Dilemma**  
  **Objective**: Players try to predict the fraction of the group that will "cooperate" in a Prisoner's Dilemma (PD). Crucially, their own prediction *is part of the data* determining the outcome, creating recursion.  

  **Core Mechanics**:  
  - **Prediction vs. Action**: Players first *predict* the group's cooperation rate, then *choose* to cooperate or defect. The actual cooperation rate is determined by their actions, but their prediction influences their action.  
  - **Self-Referential Loop**: The thing they’re predicting (group behavior) depends on their prediction (via their action), making it impossible to model "from outside."  

  #### **Rules** (15 min explanation + 20 min play + 5 min scoring = 40 min)  
  1. **Setup** (5 min):  
     - Assign each player a unique ID (1 to N, for anonymity).  
     - **Payoff Rules**:  
       - If you **cooperate**: You lose 10 points if the group cooperation rate is <50%; gain 20 points if it’s ≥50%.  
       - If you **defect**: You gain 15 points regardless.  
       - **Prediction Bonus**: +30 points if your prediction is within ±5% of the actual cooperation rate.  
     - **Example**:  
       - If only 40% cooperate, cooperators lose 10 points, defectors gain 15.  
       - If 60% cooperate, cooperators gain 20 points, defectors gain 15.  

  2. **Gameplay** (20 min):  
     - **Step 1: Predict** (5 min):  
       - Each player *privately* writes:  
         - **Prediction**: What % of the group will cooperate? (0–100%)  
         - **Confidence**: How sure are you? (Low/Medium/High, for debrief only).  
     - **Step 2: Decide** (5 min):  
       - Each player decides to **cooperate** or **defect** *based on their prediction*.  
         > *Reminder: "If you think cooperation will be high (≥50%), cooperating maximizes your gain. If you think it will be low, defecting is safer."*  
     - **Step 3: Submit & Compute** (10 min):  
       - Collect predictions and actions anonymously (use IDs).  
       - Calculate:  
         - Actual cooperation rate = (% who chose cooperate).  
         - Score each player: Action payoff + Prediction bonus.  

  3. **Reveal Results** (5 min):  
     - Share:  
       - Cooperation rate (e.g., "7 of 15 cooperated → 46.7%").  
       - Payoffs (e.g., "Cooperators: -10 points; Defectors: +15 points").  
       - Prediction bonuses (e.g., "Players 3, 8, 12 guessed within 5%").  

  ---

  ### **Why This Game Works**  
  - **Recursion in Action**: Players must model the group’s behavior, but their model (prediction) directly affects their action, which changes the group behavior. For example:  
    - If you predict high cooperation → You cooperate → Raises cooperation rate.  
    - If you predict low cooperation → You defect → Lowers cooperation rate.  
    This creates a feedback loop where "the modeller is part of the model."  
  - **Structural (Not Practical) Impossibility**: Even with perfect rationality, no player can "step outside" because:  
    - **Fixed points**: A Nash equilibrium exists (e.g., all defect → 0% cooperation), but reaching it requires everyone to ignore the recursion.  
    - **Regress**: Players think: "I think others think I think..." ad infinitum.  
  - **Embodied Tension**: Choosing between cooperation (risky, group-dependent) and defection (selfish) mirrors real-world trade-offs in embedded systems (e.g., AI alignment).  

  ---

  ### **Debrief Guide** (45–50 min)  
  **Goal**: Map game experiences to embedded agency concepts. Use Socratic questioning—start with player reflections.  

  #### **Step 1: Player Reflections** (10 min)  
  - Ask:  
    - "How did you decide your prediction? Did you assume others would act rationally?"  
    - "When choosing to cooperate/defect, did you feel stuck between what’s best for you and what’s best for the group?"  
    - "Did anyone change their prediction/action last minute? Why?"  
  - **Expected Insights**: Players will describe circular reasoning ("I defected because I guessed others would defect") or regret ("I cooperated hoping others would, but they didn’t").  

  #### **Step 2: Map to Embedded Agency** (25 min)  
  Draw parallels using moments from the game:  

  | **Game Moment**               | **Embedded Agency Concept**                                                                 | **Connection**                                                                                                                                 |
  |-------------------------------|---------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Predicting cooperation**    | Modeling the environment                                                                    | You tried to model the group’s behavior, but your model (prediction) was part of the environment—it influenced your action, changing the outcome. |
  | **Conflicting incentives**    | No Cartesian boundary                                                                       | You couldn’t isolate your "mind" (prediction) from the "world" (group behavior)—your cognition was embedded in the system.                      |
  | **Prediction bonus failure**  | Impossibility of "outside view"                                                             | Even if you tried for an objective model (e.g., "historically, 40% cooperate"), your action based on that model altered the data.               |
  | **Nash equilibrium (all defect)** | Fixed points / Regress                                                                   | The equilibrium is a fixed point, but reaching it requires infinite recursion ("I think they think I think...") nobody can compute.              |

  - **Key Metaphor**: The game is a microcosm of an agent embedded in physics. Your prediction was like the agent’s world-model, but in choosing an action, you "collapsed the wavefunction" of the group.  

  #### **Step 3: Limitations & Takeaways** (10 min)  
  - **What the Game Doesn’t Capture**:  
    - **Logical Uncertainty**: In reality, agents face unknown rules (e.g., "What if gravity changes?"). Here, rules/payoffs were known.  
    - **Temporal Embeddedness**: Real agents update models over time (e.g., learning from past rounds). We did one shot.  
    - **Decision Theory Nuances**: No Newcomb-like problems or counterfactuals (e.g., "What if I were a different agent?").  
  - **How to Fill the Gaps**:  
    - **Post-Debrief Mini-Lecture** (5 min): Explain that in formal embedded agency (e.g., MDPs with self-models), recursion appears as:  
      - **Self-Reference**: An agent’s policy π must account for the fact that π is part of the environment.  
      - **Logical Uncertainty**: Agents can’t perfectly prove consequences of their own actions (e.g., "Will this code crash the system?").  
    - **Example**: "In AI alignment, an AI optimizing for human happiness must model humans, but its actions alter human preferences. There’s no ‘happiness sensor’ outside the system."  

  #### **Step 4: Synthesis** (5 min)  
  - "In this game, you *felt* why embedded agency isn’t just philosophy—it’s a structural constraint. When your model of the world includes yourself, you hit regress, fixed points, or paradox. The ‘outside view’ is a myth; we’re always inside."  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem 1: Players ignore prediction and only optimize actions**.  
    - *Fix*: Emphasize the prediction bonus (+30 points) as the primary way to win. Say: "The best strategists will nail the prediction."  
  - **Problem 2: Group converges to all-defect too quickly** (losing the tension).  
    - *Fix*: Add a "social bonus": If ≥70% cooperate, all players get +10 points. This increases stakes.  
  - **Problem 3: Math anxiety during scoring**.  
    - *Fix*: Use a spreadsheet or simple app to calculate cooperation % and payoffs live.  
  - **Problem 4: Debrief stays surface-level**.  
    - *Fix*: Pre-seed 2–3 players to share reasoning aloud. Ask: "Did anyone realize mid-game that their prediction was a self-fulfilling prophecy?"  

  ---

  ### **Materials & Timing Cheatsheet**  
  - **Materials**: Paper, pens, shared doc/spreadsheet for submission/scoring.  
  - **Timing**:  
    - **Game** (40 min): Setup (5) + Predict (5) + Decide (5) + Submit/Compute (10) + Reveal (5).  
    - **Debrief** (50 min): Reflections (10) + Concept Mapping (25) + Limitations (10) + Synthesis (5).  

  This game creates a lived experience of recursion, making abstract ideas feel concrete. By the end, players will intuit why embedded agency isn’t just "noise"—it’s the sound of the system folding in on itself.
