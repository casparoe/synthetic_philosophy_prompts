  10. **Limitations of the Game**:
      - The game uses a simple aggregate (median) and the recursion is about predicting a number. In real embedded agency, the recursion is about the agent's own decision-making algorithm and the environment that contains the agent. The game doesn't capture logical uncertainty (uncertainty about mathematical facts) or the full structure of decision theory (like Newcomb's problem, counterfactuals, etc.).
