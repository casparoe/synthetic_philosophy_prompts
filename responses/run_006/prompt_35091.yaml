     - Then, map to embedded agency concepts:
          - Cartesian Boundary: In the game, each player was trying to model the system (the group's predictions) from the outside. But their own prediction was part of the system. So they couldn't step outside the system to model it. The system included themselves.
          - Self-referential modeling: The target T was defined in terms of the predictions of the players, so the model (each player's prediction) was part of the environment being modeled.
