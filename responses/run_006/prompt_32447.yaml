answer: |-
  ## Final Exam Question: Metaphysics Seminar

  **Question:** Max Black's symmetrical universe containing two qualitatively identical spheres appears to challenge the Identity of Indiscernibles (PII). A standard response claims the spheres are discernible via relational properties, particularly their distinct spatial positions relative to each other and the universe. Critically evaluate this "relational properties" defense. **Does invoking relations in this context beg the question against Black's challenge?** Ultimately, **what does the persistence of this debate reveal about the fundamental aims and limitations of a principle of individuation?** (Approx. 45 minutes)

  ---

  ## Model Answer (Approx. 700 words)

  Black's thought experiment presents a universe containing only two spheres, identical in all intrinsic qualitative properties (size, shape, colour, composition, etc.), situated symmetrically in space. This scenario seems to constitute a counterexample to the strong version of the Identity of Indiscernibles (PII), which states that if two entities share *all* properties, they are numerically identical. If no property distinguishes Sphere A from Sphere B, yet there are two distinct spheres, PII is false. The intuitive response is to argue that they *do* differ relationally: Sphere A is, say, 10 meters *to the left of* Sphere B, while Sphere B is 10 meters *to the right of* Sphere B. A bears the relation "is 10m left of B" while B does not (it bears the converse relation to A). Hence, they are discernible; PII stands.

  However, the crucial question is whether this appeal to relational properties, particularly spatial relations, **begs the question** against Black's intended challenge. To beg the question is to assume the very point one is trying to prove within the premises of the argument. Black's scenario is designed to challenge the *very possibility* of distinct but qualitatively identical entities. Invoking a relational difference like "being to the left of the other sphere" seems to presuppose the distinctness of the relata (A and B) that is precisely in question. How can A stand in a relation *to B* unless A and B are already distinct entities? The relation "to the left of" requires two distinct termini. If we are genuinely doubting whether there *are* two distinct entities present, pointing to a relation *between them* as proof of their distinctness appears circular. We are using the distinctness (required for the relation to hold) to prove the distinctness.

  This circularity worry highlights a deeper ambiguity in PII and the concept of "properties" it relies upon. If PII includes *all* properties, including relational ones defined in terms of other particulars (like "being left of B"), then the principle becomes trivially true for distinct entities. Any distinct entity will, by definition, have *some* relational property its counterpart lacks precisely because they are distinct (e.g., "being identical to A" vs. "being identical to B"). However, this renders PII metaphysically empty – it tells us nothing substantive about the *grounds* of individuation; it merely states that distinct things are distinct. Leibniz likely intended PII to apply to purely *qualitative* properties – intrinsic monadic properties and relations to universals or space/time points conceived as non-particulars. Black's challenge targets *this* strong, non-trivial interpretation: can two things share *all* non-haecceitistic qualitative properties?

  The relational defense, when challenged on circularity, often shifts towards a conception of spatial relations as grounded in an absolute space (or spacetime) containing unique, non-particular positions. Here, the spheres differ by bearing incompatible relations to these distinct *locations* (e.g., A occupies point P1, B occupies point P2). The distinctness of the locations is taken as primitive, not dependent on the spheres. This avoids directly presupposing the spheres' distinctness to define the relation. However, this move raises new questions: Is the distinctness of space-time points themselves primitive? Does this merely push the individuation problem back a level? It also risks making individuation *solely* dependent on spatial location, which seems insufficient for non-spatial entities or possible worlds without space.

  The persistence of this debate reveals a fundamental tension in what we demand from a principle of individuation. On one hand, we seek a **metaphysical grounding** for distinctness – some underlying qualitative difference or primitive "thisness" (haecceity) that explains *why* there are two entities rather than one. Black's scenario exposes the difficulty of providing this grounding without circularity or appealing to brute facts. On the other hand, we often require a principle of individuation to provide an **epistemic criterion** – a way for us to *discern* distinct entities. Relational properties (like spatial position) excel here, giving us a practical handle for distinguishing otherwise identical things. The debate between Black and his critics often conflates these aims. Defenders of the relational response often prioritize the epistemic criterion ("We *can* tell them apart by position"), mistaking discernibility *by us* for the metaphysical grounding of distinctness. Critics like Black (and Adams) highlight that satisfying the epistemic criterion doesn't necessarily provide the metaphysical ground, and that relying on relations defined in terms of other particulars fails to meet the metaphysical challenge head-on.

  Ultimately, Black's spheres force us to confront whether individuation requires primitive, non-qualitative facts (haecceities) or whether a sufficiently rich qualitative structure (including relations to fundamental non-particulars like space-time) can suffice. The relational defense, while pragmatically powerful, risks either circularity or shifting the burden of individuation onto the framework (like space) within which particulars exist. The debate thus reveals that the Identity of Indiscernibles is not merely about listing properties but probes the very nature of individuality and whether it can be fully captured qualitatively, exposing a potential limit to the project of grounding distinctness solely in difference.

  ---

  ## Marking Scheme

  | Band             | Marks   | Key Characteristics                                                                                                                                                                                                                                                               | Common Pitfalls Flagged                                                                 |
  | :--------------- | :------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- |
  | **First-Class**  | **70+** | **Excellent:** Clearly identifies Black's challenge to a *strong, non-trivial* PII. **Explicitly and cogently argues** why the relational properties defense (especially spatial relations) *can be seen as begging the question*, explaining the circularity charge in detail. **Deeply engages** with the ambiguity in "properties" for PII (qualitative vs. haecceitistic, trivial vs. non-trivial interpretations). **Insightfully analyzes** the shift to absolute space/spacetime as a response to circularity and its limitations. **Clearly articulates** the core tension revealed: the distinction between metaphysical grounding of distinctness (demanding a non-circular qualitative ground or accepting primitivism) vs. epistemic discernibility. Offers a sophisticated conclusion on what the debate reveals about the aims of individuation. Demonstrates independent critical thought. Well-structured, precise, and philosophically rigorous. |
  | **Upper-Second** | **60-69** | **Very Good:** Understands Black's challenge and the standard relational response. **Recognizes the potential circularity problem** with relational properties and attempts to explain it. Shows awareness of different interpretations of PII (e.g., trivial vs. strong). **Discusses the appeal to absolute space** as an alternative. **Identifies the tension** between grounding distinctness and providing discernibility criteria. **Engages with the deeper question** about principles of individuation. Lacks the full depth, precision, or critical insight of a first-class answer. Might not fully develop or resolve the circularity charge or the implications of the grounding/discernibility tension. Structure is good, argument clear. | May mention circularity but not fully develop the argument or explore its implications. May not sufficiently distinguish metaphysical grounding from epistemic discernibility. Might present the absolute space move uncritically. |
  | **Lower-Second** | **50-59** | **Competent:** Describes Black's spheres scenario and the Identity of Indiscernibles reasonably accurately. **States the relational properties defense** (spatial position) as the standard reply. **Mentions the circularity worry** but explanation is superficial or underdeveloped. **Attempts to touch on** the deeper question about individuation, but analysis is limited or vague. Shows basic comprehension but lacks critical depth and engagement with the nuances. Structure may be weak or disjointed. Relies heavily on summary. | **Common Mistake:** **Primarily focuses on explaining *how* relational properties discern the spheres, treating this as a sufficient refutation of Black without seriously engaging the circularity objection.** Fails to grasp the force of Black's challenge to a *metaphysically robust* PII. Does not meaningfully distinguish qualitative properties for individuation from haecceities or trivial relational properties. Superficial treatment of what the debate reveals. |
  | **Fail / Third** | **<50**  | **Inadequate:** Significant misunderstandings of Black's thought experiment, PII, or the relational response. Fails to address the circularity question or the deeper prompt about individuation. Argument is confused, irrelevant, or absent. Poorly structured and written. | May completely miss the point, e.g., discussing Leibniz's motivation without addressing Black, or confusing PII with other principles. |

  **Key Common Mistake Explicitly Flagged:** Students scoring in the Lower-Second band often fall into the trap of thinking that simply *stating* that the spheres have different spatial positions (e.g., "one is here, the other is there") or other relational properties *is sufficient* to refute Black and save PII. They fail to recognize that this move is precisely what Black's challenge questions and that it potentially begs the question by presupposing the distinctness it aims to prove. Answers that do not move beyond this basic point of "discernibility via relations" and do not confront the circularity objection will be capped in the Lower-Second band.
