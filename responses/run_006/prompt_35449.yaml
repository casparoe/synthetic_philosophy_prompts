prompt: |-
  I'm a UX research lead at a mid-size tech company, and I keep noticing that our user interview protocols assume something like a Cartesian theater — we ask people "what was your experience using feature X" as if there's a single, stable experience they can just replay and report. I've read enough Dennett to know this is probably wrong, that what we get is a draft constructed at the moment of asking, shaped by the question itself. But I don't know how to turn that insight into something my team can actually use. Could you write me a practical interview-and-interpretation procedure grounded in the multiple drafts model? It should be a step-by-step guide my researchers can follow: what questions to ask instead of the standard ones, what follow-ups probe for the construction process rather than pretending to access a fixed memory, what kinds of answers should be treated as artifacts of the method rather than data, and where the procedure forces a judgment call that can't be offloaded onto the theory. Then walk it through two example interviews — one where the procedure catches something the standard approach would miss, and one where the procedure itself probably creates a misleading draft and you have to flag that. My team has about 30 minutes per interview and moderate qual-research training but no philosophy background.
reasoning: |-
  We are designing a user interview procedure based on Dennett's Multiple Drafts Model. The key insight is that what users report is not a stable memory but a narrative constructed at the moment of asking, influenced by the context of the interview.

  The procedure should:
  1. Avoid asking for a single, stable experience.
  2. Probe for the construction process of the user's narrative.
  3. Identify and flag responses that are artifacts of the method.
  4. Include judgment calls where the researcher must interpret.

  We have 30 minutes per interview. The steps:

  **I. Interview Structure (20 minutes)**
     A. **Context Setting (2 mins)**: Explain the purpose and that we are interested in their thoughts and feelings as they recall.
     B. **Event Reconstruction (8 mins)**: Instead of asking for a summary, break down the experience into moments and ask about each.
        - Ask: "Can you walk me through the last time you used [feature] step by step? Try to recall what you did, what you saw, and what you thought at each step."
        - Follow up with: "At that moment, what were you expecting to happen?" and "What were you paying attention to?"
     C. **Contrast and Compare (5 mins)**: Ask about variations in the experience to reveal the constructed nature.
        - "Has there been a time when using [feature] felt different? What was different about that time?"
        - "If you were to use it again right now, what might you notice that you didn't mention before?"
     D. **Probe for Construction (5 mins)**: Explicitly ask about the act of recalling.
        - "As you were describing this, did any part of the experience become clearer or change in your mind?"
        - "Were there any parts that were harder to remember? What made them hard?"

  **II. Interpretation Guidelines (10 minutes per interview for the researcher)**
     A. **Flag Artifacts**: Note any responses that seem to be generated by the interview context (e.g., if the user says "I guess I felt..." or "I suppose...", or if they change their story during the interview).
     B. **Identify Judgment Calls**: 
        - When the user's narrative shifts, note it and consider whether it's due to the interview process or a genuine reflection of multiple experiences.
        - Be cautious of strong emotional responses that might dominate the narrative.
     C. **Synthesize**: Instead of taking any single statement as fact, look for patterns across the reconstruction and contrast phases. Note inconsistencies as data about the user's mental model.

  **Example Interviews:**

  **Example 1: Procedure catches something standard would miss**

  *Scenario*: Interview about a food delivery app's tracking feature.

  - **Standard Approach**: 
    - Q: "Tell me about your experience with the delivery tracking."
    - A: "It's fine, I like seeing where the driver is."

  - **Our Procedure**:
    - **Event Reconstruction**: 
        User: "I opened the app and saw the map. The driver was stuck at a location. I thought maybe they were lost. Then I got a notification that the food was delivered, but I didn't have it. I was confused."
    - **Contrast and Compare**: 
        Researcher: "Has there been a time when tracking felt different?"
        User: "Oh, actually, last week I saw the driver moving and it was accurate. But that time I was at work, not at home. Maybe I pay more attention when I'm at home because I'm hungry and waiting."
    - **Probe for Construction**: 
        Researcher: "As you described the time when the driver was stuck, did any part become clearer?"
        User: "Actually, now that I think about it, that time I was also on a call and I might have missed a notification. Maybe the driver tried to contact me."

  *Insight*: The standard approach would have missed the context-dependent variability (home vs. work) and the possibility of user distraction. Our procedure revealed that the user's negative experience was not solely due to the app but also the context and their attention.

  **Example 2: Procedure creates a misleading draft and how to flag**

  *Scenario*: Interview about a project management tool's notification system.

  - **Event Reconstruction**:
        User: "I get too many notifications. I remember one time I was in a meeting and my phone kept buzzing. It was annoying."

  - **Contrast and Compare**:
        Researcher: "Has there been a time when notifications were helpful?"
        User: (Pauses) "Well, I guess when I was waiting for an update on a critical task, I appreciated it. But that's rare."

  - **Probe for Construction**:
        Researcher: "As you were describing the annoying time, did any part become clearer?"
        User: "Actually, now that you ask, I'm not sure if it was the same app. It might have been another app that was buzzing. But I do think this app sends too many."

  *Flagging*: The researcher should note:
     - The initial negative story might have been confounded with another app (artifact of reconstruction).
     - The user's uncertainty during the construction probe suggests the memory is not clear and might be influenced by the interview's focus on negatives.
     - Judgment Call: The researcher should not take the initial complaint at face value. Instead, note that the user's perception of too many notifications might be generalized and not tied to a specific event. This should be explored with data (e.g., notification settings, actual frequency) and possibly with a diary study for real-time data.

  **Conclusion for the Team**:
  - This procedure helps uncover the constructed nature of user reports and avoids treating them as stable memories.
  - It requires researchers to be comfortable with ambiguity and to note when the interview process itself is shaping the response.
  - The examples show how it can reveal context and attention factors (Example 1) and how it can expose confabulation (Example 2) that a standard approach would miss.

  **Adaptation for 30-Minute Interviews**:
  - Keep each section strict on time.
  - Use the interpretation time immediately after to note artifacts and judgment calls.
  - Train the team to recognize phrases that indicate construction (e.g., "I think", "I guess", "maybe", and shifts in narrative).

  This procedure grounds the interview in the multiple drafts model without requiring philosophy knowledge, focusing on practical steps and interpretation guidelines.
answer: |-
  ### Practical Interview Procedure Based on Multiple Drafts Model  
  **Core Principle**: User responses are *constructions in the moment*, not replays of fixed memories. Your goal is to surface how the user *builds* their narrative, not treat it as objective truth.  

  **Time Allocation**:  
  - **Interview (20 mins)**  
  - **Analysis & Flagging (10 mins per session)**  

  ---

  ### Step-by-Step Procedure  
  #### **1. Pre-Interview Setup**  
  - **Preparation**:  
    - Draft 3–4 core questions (avoid "what was your experience?"). Focus on *specific moments* and *contrasts*.  
    - Assign one researcher to lead the interview, another to note:  
      - *Inconsistencies* (e.g., "Earlier they said X, now Y")  
      - *Construction cues* (e.g., pauses, hedges like "I guess," contextual shifts)  
  - **Opening Script**:  
    > "We’re interested in how you *recall* using [feature]—memories can shift when we talk about them, so don’t worry about being ‘exact.’ Just share what comes to mind."  

  #### **2. Interview Phase (20 mins)**  
  **Avoid These Standard Questions**:  
  - ❌ "What was your experience with X?"  
  - ❌ "How did you feel when using X?"  
  - ❌ "What did you like/dislike?"  

  **Ask Instead**:  
  - **A. Reconstruct Moments (8 mins)**  
    - *Purpose*: Force recall of concrete moments to expose how details are constructed.  
    - **Questions**:  
      - "Walk me through the *last time* you used [feature], **step by step**. What did you *do first*? Then what?"  
      - "At [specific step], what were you *paying attention to*? What were you *ignoring*?"  
    - **Follow-up**:  
      - "Did that detail just come to mind *now*, or did you remember it earlier?" (Probes construction timing)  

  - **B. Contrast Drafts (7 mins)**  
    - *Purpose*: Highlight how context shapes the narrative.  
    - **Questions**:  
      - "Think of *two different times* you used [feature]. How was your attention or goal *different* each time?"  
      - "If you used this *again tomorrow*, what might you notice that you *didn’t mention today*?"  
    - **Follow-up**:  
      - "When I asked about [contrast], did it change how you remembered the first story?" (Probes interview-induced drafting)  

  - **C. Probe Construction (5 mins)**  
    - *Purpose*: Surface the "drafting" process explicitly.  
    - **Questions**:  
      - "As you described this, did any part of the memory *shift or clarify*?"  
      - "Was there any part that was *harder to recall*? Why do you think that is?"  
    - **Follow-up**:  
      - "If you explained this to a friend instead of me, what might you say *differently*?" (Reveals audience-driven drafting)  

  #### **3. Interpretation & Flagging (10 mins post-interview)**  
  - **Step 1: Identify Artifacts** (Responses distorted by the method):  
    - **Flag if**:  
      - User hesitates >3 seconds, then gives a detailed answer (indicates confabulation).  
      - Responses change after contrast questions (e.g., "Actually, now that I think about it...").  
      - Overly general language ("I always feel...") after requesting specifics.  
    - **Treat as**: Context about *how the user constructs meaning*, not data about the feature.  

  - **Step 2: Make Judgment Calls** (Where theory can’t decide):  
    - **Call 1**: Is this a *pattern* or a *one-off construction*? (e.g., If 3 users reconstruct the same "moment" differently, it’s a pattern worth exploring).  
    - **Call 2**: Is the inconsistency due to *context* (valuable) or *memory limits* (less valuable)? (Use notes on pauses/hard-to-recall moments).  
    - **Document**: "We flagged [quote] as artifact because [reason]. Judgment: [pattern/context]."  

  ---

  ### Walkthrough: Two Examples  
  #### **Example 1: Catches What Standard Approach Misses**  
  **Scenario**: Testing a "file-sharing" feature in a productivity app.  

  - **Standard Approach**:  
    - Q: "How was your experience sharing files?"  
    - A: "Easy, no issues." → Misses hidden context.  

  - **Our Procedure**:  
    - **Reconstruct Moments**:  
      > User: "Last Tuesday, I shared a PDF. I clicked ‘Share,’ pasted the email... wait, *actually* I pasted the wrong email first, then fixed it."  
      > Researcher: "Did you remember the mistake just now?"  
      > User: "Yeah—I forgot until you asked for steps."  
    - **Contrast Drafts**:  
      > Researcher: "Compare sharing that PDF to sharing a video last month."  
      > User: "With the video, I was stressed about size limits. I didn’t care about the PDF."  
    - **Probe Construction**:  
      > Researcher: "Did recalling the video change how you saw the PDF story?"  
      > User: "Totally—I realized I only remember mistakes when I’m stressed."  

  **Insight**:  
  - **Catch**: The "easy" experience was a construction—users only recall errors in high-stakes contexts.  
  - **Value**: Redesign should reduce stress points, not just simplify steps. Standard approach missed the context-dependency.  

  #### **Example 2: Procedure Creates a Misleading Draft (and How to Flag)**  
  **Scenario**: Testing a fitness app’s "workout tracker."  

  - **Our Procedure**:  
    - **Reconstruct Moments**:  
      > User: "I tracked a run yesterday. I felt motivated seeing my pace... *[pause]* wait, was that yesterday?"  
    - **Contrast Drafts**:  
      > Researcher: "Compare to tracking a run two weeks ago."  
      > User: "Two weeks ago? I was on vacation... I guess I felt relaxed then, but now I feel pressured."  
    - **Probe Construction**:  
      > Researcher: "Did describing vacation runs shift your memory?"  
      > User: "Yeah—I think I’m mixing up runs. Maybe I only track when I’m stressed."  

  **Analysis & Flagging**:  
  - **Artifact Detected**:  
    - User constructed a "stressed vs. relaxed" narrative *only after* the contrast question.  
    - Notes show: (1) Initial pause indicated uncertainty, (2) Vacation story was vague ("I guess"), (3) Final claim ("I only track when stressed") contradicted earlier step-by-step (no stress mentioned).  
  - **Judgment Call**:  
    > "Flagged ‘I only track when stressed’ as artifact of contrast question. Judgment: Likely a generalization crafted during the interview—not a stable pattern. Verify with analytics data on actual usage frequency."  
  - **Why Misleading**: The procedure pushed the user to invent a causal story. Without flagging, team might wrongly prioritize "stress-reduction" features.  

  ---

  ### Key Takeaways for Your Team  
  - **What to Emphasize**:  
    - Questions about *moments* and *contrasts* reveal how context shapes memory.  
    - Construction cues (pauses, hedges) are **data about the method**, not the user.  
  - **Where Philosophy Meets Practice**:  
    - Dennett’s "drafts" become actionable through: (1) Step-by-step reconstruction, (2) Explicit construction probes.  
    - Judgment calls are unavoidable—document them rigorously.  
  - **Training Tip**: Run a 1-hour workshop where researchers interview each other using this method, then discuss what they flagged as artifacts.  

  This procedure turns theory into tangible actions, helping your team avoid Cartesian traps while staying within time constraints.
