prompt: |-
  Draft the joint statement that a "logical-learning Bayesian" and a "deflationary Bayesian" could both sign after a good-faith adversarial collaboration on the problem of old evidence.

  Quick background in case you need it: the problem of old evidence (Glymour) is that if evidence E is already known before a theory T is proposed, then P(E) = 1, so P(E|T) = P(E) = 1, and Bayesian conditionalization says E can't confirm T. But intuitively old evidence does confirm theories — general relativity and the perihelion of Mercury being the classic example. The logical-learning camp (roughly Garber, Jeffrey) says we need to enrich Bayesianism so agents can be uncertain about logical relations between T and E. The deflationary camp (roughly Howson, maybe Earman) says the problem dissolves if you're careful: confirmation isn't about the historical order in which evidence was gathered, and the right counterfactual or subjective probability assignment handles it fine.

  What I want: (1) a numbered list of claims both sides can sign — about the formal setup, about what the problem is and isn't, about which cases are genuinely puzzling; (2) a disagreements table where each row states the point of divergence in wording each side would accept for their own view; (3) the cruxes — the sub-questions such that if you settled them, at least one side would have to budge; and (4) for each crux, a concrete case or argument both agree bears on it, with each side's prediction written down in advance.

  If you think some of the fight is verbal — like they're using "confirmation" differently — flag that and say which part, but don't let that swallow the whole thing. I want the residual substantive disagreement made as precise as possible.
reasoning: |-
  We are drafting a joint statement from two Bayesian perspectives on the problem of old evidence: the logical-learning Bayesian (LLB) and the deflationary Bayesian (DB). The goal is to find common ground and clarify disagreements.

  Background:
  - Problem: When evidence E is old (known before theory T is proposed), P(E)=1, so by Bayesian conditionalization, P(E|T) = P(E) = 1, and thus E does not confirm T (since confirmation requires P(E|T) > P(E)). But intuitively, old evidence does confirm (e.g., Mercury's perihelion for general relativity).
  - LLB (Garber, Jeffrey): Agents should be uncertain about logical relations (like T entails E). They model learning that T entails E as a non-trivial update.
  - DB (Howson, Earman): The problem dissolves with careful setup. Confirmation is not historical but about counterfactual degrees of belief (e.g., what would your degree of belief in T be if you didn't know E?).

  Structure of the Joint Statement:

  1. **Common Ground (Numbered List of Claims Both Sides Sign)**: 
     - Points of agreement about the formal setup, what the problem is and isn't, and which cases are genuinely puzzling.

  2. **Disagreements Table**: 
     - Each row: a point of divergence with wording each side accepts for their own view.

  3. **Cruxes**:
     - Sub-questions that, if settled, would force at least one side to budge.

  4. **Concrete Cases for Each Crux**:
     - For each crux, a concrete case or argument that both agree bears on it, and each side's prediction.

  We note that part of the disagreement might be verbal (e.g., definition of "confirmation") but we must not let that dominate. We want to isolate the substantive disagreement.

  Let's begin:

  ### 1. Common Ground (Numbered List)

  Both sides agree on the following:

  1. **Bayesian Confirmation Theory**: The core Bayesian framework, which uses probability theory to model rational belief and defines confirmation in terms of probability raising (i.e., E confirms T relative to background knowledge K iff P(T|E,K) > P(T|K)).

  2. **The Problem of Old Evidence as Described by Glymour**: The problem arises when E is already known (so P(E)=1) and we consider a new theory T that entails E (or makes E highly probable). In the standard Bayesian update, since P(E)=1, we have P(E|T)=1 and hence P(T|E) = P(T). Thus, E does not confirm T in the sense of probability raising.

  3. **Intuition of Confirmation by Old Evidence**: There are cases (like the perihelion of Mercury and general relativity) where it seems that old evidence does provide support for a new theory.

  4. **Historical Order vs. Epistemic State**: The historical order in which evidence is gathered is not the core issue. What matters is the agent's epistemic state at the time of evaluating the theory.

  5. **Need for a Solution**: The problem as stated challenges the adequacy of the standard Bayesian framework and requires either an extension or a reinterpretation.

  6. **The Role of Logical Learning**: Both sides agree that in some cases, the agent may not have fully appreciated the logical relationship between T and E until after T is proposed. However, they disagree on how to model this.

  7. **Counterfactual Reasoning**: Both sides agree that counterfactual reasoning (e.g., what would the agent's degree of belief be if they did not know E?) is relevant, but they disagree on whether it is necessary or sufficient.

  8. **Cases that are Puzzling**: Both sides agree that the perihelion of Mercury case is a paradigmatic example and that cases where the logical implication of T for E was not initially recognized are particularly important.

  ### 2. Disagreements Table

  We present a table where each row captures a point of divergence. For each point, we give two columns: one for the Logical-Learning Bayesian (LLB) and one for the Deflationary Bayesian (DB). The wording in each column is acceptable to that side.

  | Issue | Logical-Learning Bayesian (LLB) | Deflationary Bayesian (DB) |
  |-------|----------------------------------|-----------------------------|
  | **The Nature of the Problem** | The problem of old evidence reveals a genuine limitation in the standard Bayesian framework: it cannot account for confirmation by old evidence without introducing a mechanism for learning logical truths. | The problem of old evidence is an artifact of misapplying the Bayesian framework. When properly analyzed using counterfactual degrees of belief, the problem dissolves without any modification to the core framework. |
  | **Modeling Uncertainty about Logical Relations** | Rational agents can and often do have degrees of belief about logical relations (e.g., whether T entails E). Learning that T entails E is a non-trivial update that can confirm T. | Agents are always certain about logical relations that they have explicitly considered. The problem arises only when the agent has not yet considered the relation between T and E, and thus the counterfactual scenario (where E is not known) is the appropriate setting for confirmation. |
  | **Confirmation Defined** | Confirmation can occur through learning logical relations. In the old evidence case, when the agent learns that T entails E (and E is old), this learning event confirms T. | Confirmation is defined relative to a given probability function. The old evidence case requires comparing the current probability of T with the probability it would have in a counterfactual scenario where E is not known. |
  | **Formal Approach** | The Bayesian framework must be enriched to include probabilities over logical statements and updating on logical discoveries. | The standard Bayesian framework is sufficient. We only need to consider the agent's degrees of belief in a counterfactual state where E is not known. |

  ### 3. Cruxes

  The following sub-questions, if resolved, would force at least one side to change their position:

  1. **Crux 1: Can rational agents have non-extreme degrees of belief in logical truths?** 
     - LLB: Yes, because logical truths might be complex and not immediately obvious, so agents can be uncertain about them.
     - DB: No, once a logical truth is understood, the agent must assign probability 1. Any uncertainty reflects the agent's lack of understanding, not a feature of rationality.

  2. **Crux 2: Is counterfactual reasoning necessary and sufficient for handling old evidence?**
     - LLB: Counterfactual reasoning is not sufficient because it does not capture the actual learning process of the agent when they discover the logical relation between T and E.
     - DB: Counterfactual reasoning is both necessary and sufficient. The problem is solved by considering the agent's degree of belief in T conditional on E in a state where E is not taken as given.

  3. **Crux 3: Does the confirmation of T by old evidence E require a change in the agent's belief about the logical relation between T and E?**
     - LLB: Yes, the confirmation occurs precisely because the agent learns that T entails E (or that T makes E highly probable).
     - DB: No, the confirmation is independent of the agent's learning about the logical relation. It is captured by the counterfactual comparison.

  ### 4. Concrete Cases and Predictions

  For each crux, we present a concrete case and the predictions of each side.

  **Crux 1: Can rational agents have non-extreme degrees of belief in logical truths?**

  - **Case**: Consider a complex mathematical conjecture C (e.g., the Riemann Hypothesis) that is not yet proven. An agent, who is a mathematician, understands the conjecture and the relevant mathematical theory but has not seen a proof. The agent assigns P(C) = 0.5, reflecting their uncertainty. Later, a proof is produced and verified by the mathematical community. The agent then updates to P(C)=1.

  - **LLB Prediction**: This is a rational state of affairs. The agent's initial non-extreme probability for C is appropriate because the logical truth of C was not known. This case supports the idea that logical uncertainty is legitimate.

  - **DB Prediction**: The agent's initial assignment of 0.5 is not rational. If the agent fully understands the logical structure, they should assign either 0 or 1 (if they are omniscient). However, since they are not omniscient, the assignment of 0.5 reflects their ignorance. But in a model of rationality, we assume logical omniscience, so this case is not a challenge to the DB view because the problem of old evidence is framed in an idealized setting.

  **Crux 2: Is counterfactual reasoning necessary and sufficient?**

  - **Case**: The perihelion of Mercury (E) was known before Einstein proposed general relativity (T). Einstein himself knew E and then developed T, and upon realizing that T entailed E, he took this as strong confirmation for T.

  - **LLB Prediction**: The confirmation occurred when Einstein learned that T entailed E. This learning event is what raised his confidence in T. Counterfactual reasoning (e.g., what Einstein would have believed if he didn't know E) is not the key; the key is the actual update on the logical relation.

  - **DB Prediction**: The confirmation is captured by comparing the probability of T given E (in a state where E is not known) and without E. In the counterfactual scenario where Einstein does not know E, P(T) would be low, and P(T|E) would be high, so E confirms T. The actual historical sequence and the moment of realization are not essential.

  **Crux 3: Does confirmation require learning a logical relation?**

  - **Case**: A scientist knows evidence E and then proposes theory T. At the time of proposing T, the scientist is immediately aware that T entails E. Is there any confirmation in this case?

  - **LLB Prediction**: The scientist, at the moment of proposing T, is already certain that T entails E. Therefore, in the standard Bayesian framework (with logical omniscience), there is no confirmation by E because E is old and P(E)=1. But this contradicts the intuition that E confirms T. Hence, the LLB must say that in such a case, the agent must have had some prior uncertainty about the entailment (even if brief) to allow for confirmation. Alternatively, they might say that the confirmation happened at an earlier stage when the entailment was first considered.

  - **DB Prediction**: The scientist's current state (with E known) does not allow for confirmation in the standard sense. But by counterfactual reasoning, if the scientist had not known E, then E would have confirmed T. Hence, the confirmation is captured by the counterfactual comparison. The fact that the scientist was immediately aware of the entailment does not change the counterfactual support.

  This joint statement clarifies both the common ground and the precise points of disagreement, and it sets up empirical (or rational) tests via the cruxes.
answer: |-
  ### Joint Statement on the Problem of Old Evidence  
  **Signed by Representatives of the Logical-Learning Bayesian (LLB) and Deflationary Bayesian (DB) Perspectives**  

  Following a good-faith adversarial collaboration, we agree on core principles, clarify disagreements, and identify unresolved cruxes regarding the problem of old evidence (PoE). We concur that PoE challenges Bayesian confirmation theory but disagree on its resolution. Below, we outline shared claims, divergences, and testable cruxes to guide future work.  

  ---

  ### 1. Common Ground: Numbered List of Agreed Claims  
  Both parties endorse these statements about the formal setup, scope, and nature of PoE:  

  1. **Bayesian Core Framework**: Confirmation is defined probabilistically: evidence \(E\) confirms theory \(T\) relative to background knowledge \(K\) iff \(P(T|E,K) > P(T|K)\). This requires \(P(E|K) < 1\) for non-trivial confirmation via conditionalization.  
  2. **PoE as Described by Glymour**: When \(E\) is known (so \(P(E) = 1\)) before \(T\) is proposed, standard conditionalization implies \(P(E|T) = P(E) = 1\), yielding \(P(T|E) = P(T)\). Thus, \(E\) cannot confirm \(T\) in this framework.  
  3. **Intuitive Confirmation by Old Evidence**: Despite #2, there are real-world cases (e.g., Mercury’s perihelion \(E\) confirming general relativity \(T\)) where old evidence *seems* to confirm a theory. This intuitive conflict motivates PoE.  
  4. **Historical Order is Epistemically Irrelevant**: Confirmation is a relation between propositions, not tied to the temporal order of discovery. PoE arises from the agent’s epistemic state, not history.  
  5. **Problem Dissolves for Unknown Evidence**: If \(E\) is *unknown* when \(T\) is proposed, standard Bayesianism handles confirmation straightforwardly. PoE specifically concerns cases where \(E\) is already known/certain.  
  6. **Logical Relations Matter**: In key cases (e.g., Mercury’s perihelion), the agent initially lacks full appreciation of the logical connection between \(T\) and \(E\) (e.g., that \(T\) entails \(E\)).  
  7. **Counterfactual Reasoning is Relevant**: Assessing what the agent’s beliefs *would be* without \(E\) is a useful tool for analyzing confirmation.  
  8. **Puzzling Cases Are Limited**: PoE is most acute for cases where:  
     - \(E\) is a logical consequence of \(T\) (e.g., \(T \vdash E\)).  
     - The agent is certain of \(E\) *and* initially unaware of \(T \vdash E\).  
     - General relativity/Mercury is a paradigm example. Cases without logical entailment (e.g., \(T\) merely probabilistically supports \(E\)) are less problematic.  

  ---

  ### 2. Disagreements Table  
  The table below summarizes divergences. Each row states a point of contention, with columns showing wording acceptable to each camp for their own view.  

  | Issue | Logical-Learning Bayesian (LLB) Wording | Deflationary Bayesian (DB) Wording |  
  |-------|------------------------------------------|-------------------------------------|  
  | **Nature of PoE** | PoE reveals a flaw in standard Bayesianism: it cannot model confirmation from old evidence without augmenting the framework to include logical learning. | PoE is a pseudo-problem arising from misapplication; it vanishes under careful counterfactual analysis of subjective probabilities. |  
  | **Role of Logical Uncertainty** | Rational agents can assign non-extreme probabilities to logical propositions (e.g., \(P(T \vdash E) < 1\)) even when \(E\) is known. Learning \(T \vdash E\) is a genuine Bayesian update that confirms \(T\). | Agents assign \(P=1\) to all known logical truths. "Uncertainty" about \(T \vdash E\) reflects the agent’s failure to fully grasp background knowledge \(K\), not a probability <1; confirmation requires counterfactual priors (e.g., \(P(T)\) without \(E\)). |  
  | **Confirmation Mechanism** | Confirmation occurs when the agent learns the logical fact \(T \vdash E\) (or similar), increasing \(P(T)\) via updating on this proposition. | Confirmation is captured by comparing the actual \(P(T)\) to the counterfactual \(P(T|\neg E)\) or \(P(T)\) in a state where \(E\) is unknown; no logical learning update is needed. |  
  | **Formal Resolution** | Bayesianism must be enriched with probabilities over logical relations (e.g., \(P(T \vdash E)\)) and allow updates on logical discoveries. | Standard Bayesianism is sufficient; PoE dissolves by evaluating confirmation counterfactually using the agent’s actual subjective probability function. |  

  **Verbal Disagreement Note**: We flag that "confirmation" is sometimes used differently. LLB focuses on *in-situ* belief changes (e.g., Einstein’s realization), while DB focuses on *ahistorical support relations* (e.g., \(E\) boosts \(T\) independently of learning history). This is not purely verbal—it reflects substantive differences in epistemology.  

  ---

  ### 3. Cruxes  
  Resolving these sub-questions would force at least one side to concede key points. Both agree that empirical or normative arguments on these cruxes would be decisive.  

  1. **Crux 1: Can rational agents assign non-extreme probabilities to logical truths?**  
     - *Stakes*: If "yes," LLB’s logical learning is viable; if "no," DB’s counterfactual approach is necessary.  
  2. **Crux 2: Is counterfactual reasoning sufficient to explain intuitive cases of confirmation by old evidence?**  
     - *Stakes*: If "yes," DB dissolves PoE; if "no," LLB’s enrichment is needed.  
  3. **Crux 3: Does confirmation by old evidence require an in-situ belief change (e.g., learning \(T \vdash E\))?**  
     - *Stakes*: If "yes," LLB is validated; if "no," DB’s ahistorical view holds.  

  ---

  ### 4. Concrete Cases and Predictions for Each Crux  
  For each crux, we provide a case both agree is relevant. Predictions are stated as falsifiable commitments.  

  **Crux 1: Can rational agents assign non-extreme probabilities to logical truths?**  
  - **Case**: A mathematician, Anna, knows complex evidence \(E\) (e.g., "All even numbers >2 are sums of two primes," i.e., Goldbach’s conjecture, treated as evidence). She later proposes theory \(T\) (a novel number-theoretic framework). Anna understands \(E\) but is unsure if \(T \vdash E\) due to \(T\)'s complexity. She assigns \(P(T \vdash E) = 0.6\) based on partial analysis.  
    - **LLB Prediction**: Anna is rational; her non-extreme \(P(T \vdash E)\) reflects genuine logical uncertainty. When she proves \(T \vdash E\), her \(P(T)\) increases, confirming \(T\).  
    - **DB Prediction**: Anna is irrational; if she fully grasps \(E, T,\) and \(K\), she must assign \(P(T \vdash E) = 0\) or \(1\). Her uncertainty stems from incomplete reasoning, not probability theory.  
    - **Test**: Normative analysis of rationality: Can a logically competent agent have non-dogmatic degrees of belief in unproven entailments?  

  **Crux 2: Is counterfactual reasoning sufficient?**  
  - **Case**: Physicist Bob knows \(E\) (Mercury’s perihelion data) with certainty. He develops \(T\) (general relativity) but is *immediately* aware that \(T \vdash E\) upon formulating \(T\). Historically, \(E\) was old evidence for Bob.  
    - **LLB Prediction**: Counterfactual reasoning is insufficient. Since Bob was always certain of \(E\) and immediately saw \(T \vdash E\), standard Bayesianism (under logical omniscience) shows no confirmation. Yet intuitively, \(E\) confirms \(T\), so logical learning must be invoked retroactively (e.g., by recalling a time before Bob recognized \(T \vdash E\)).  
    - **DB Prediction**: Counterfactual reasoning suffices. Compare Bob’s actual \(P(T|E)\) (which equals \(P(T)\)) to his counterfactual \(P(T|\neg E)\) (which would be low). The ratio \(P(T|E)/P(T|\neg E) > 1\) shows \(E\) confirms \(T\), resolving PoE without logical learning.  
    - **Test**: Does Bob’s case (*immediate* awareness of entailment) intuitively show confirmation? If yes, DB wins; if no, LLB wins.  

  **Crux 3: Does confirmation require an in-situ belief change?**  
  - **Case**: Chemist Clara knows \(E\) (anomalous reaction rates). She proposes \(T\) (a quantum-chemistry model) and *later* discovers \(T \vdash E\) via calculation. Upon learning this, her confidence in \(T\) increases.  
    - **LLB Prediction**: Confirmation occurs *at the moment* Clara learns \(T \vdash E\), via Bayesian update on this logical fact. Old evidence \(E\) confirms \(T\) through this learning event.  
    - **DB Prediction**: Confirmation is ahistorical; it depends only on the logical relation between \(T\) and \(E\). Clara’s belief change is psychological; the support relation existed once \(T\) was formulated (and would be revealed by counterfactual analysis).  
    - **Test**: If Clara’s \(P(T)\) increases *only* because she learns \(T \vdash E\) (not new empirical data), does this constitute genuine confirmation? If yes, LLB wins; if no, DB wins.  

  ---

  **Conclusion**: We commit to this statement as a basis for further work. Residual disagreements hinge on the cruxes above, which isolate substantive issues about logical uncertainty, counterfactuals, and belief dynamics. Empirical progress in cognitive science (e.g., how agents handle logical uncertainty) or normative refinements may resolve them.
