  Hmm, this is fascinating because it cuts across metaphysics, philosophy of language, and social ontology. The user clearly recognizes this isn't a trivial semantic quibble - they note participants experience it as substantive. Their examples are spot-on: institutional entities (university), social constructs (economy), medical classifications (syndrome). 

  What they're really asking for is: (1) a technical term for this phenomenon, (2) its distinguishing boundaries, and (3) how to identify it. The challenge is that several philosophical traditions intersect here. Carnap's framework relativity comes to mind immediately - the choice between thing-language and person-language frameworks. But Sellars' myth of the given is also relevant regarding what counts as "real." 

  Ah! The social ontology angle is crucial. Searle and Epstein would say the university example involves status functions - the collective assignment of "university" to certain physical and human components. But the clinicians debating disease ontology expose a different layer: natural kinds vs practical classifications. 

  I should emphasize the practical implications they noted - whether the university "can be harmed" affects legal responsibility, whether a syndrome is "real" impacts treatment protocols. This bridges metaphysics and ethics. 

  The test for recognizing such disputes: check if disagreement persists after (a) full empirical agreement and (b) clarification of criteria for "real existence." If yes, it's likely framework-relative ontology. Must caution though - as Quine showed, the analytic/synthetic distinction isn't absolute. 

  User's background in early modern philosophy suggests they'll appreciate the Leibnizian possible worlds angle in counterfactual talk. Should mention how this differs from Locke's nominal essences too. 

  ...*pause*... The real sophistication here is their awareness that "just words" dismissals miss how conceptual frameworks shape perception of reality. This deserves careful unpacking without jargon overload. Need to show why such debates matter - they're negotiating what counts as real in institutional contexts.
answer: |-
  Your colleagues exemplify a **framework-relative ontological disagreement**, a profound yet non-factual dispute arising from divergent **conceptual frameworks** or **modes of description**. This is not a disagreement about empirical facts, definitions, or substantive ontology, but about the **appropriateness of a level of description** for interpreting agreed-upon phenomena.

  ### Core Characteristics & Diagnostic Boundaries:
  1.  **Empirical Agreement, Ontological Disagreement:** All concrete, observable facts and counterfactual scenarios are settled. The dispute arises *only* when interpreting these facts through higher-level concepts (e.g., "university," "economy," "disease entity").
  2.  **Shared Criteria, Divergent Application:** Both parties often *verbally* agree on abstract criteria for "real existence" (e.g., "part of the world, not just a name"). The disagreement lies in *applying* this criterion to a specific, complex phenomenon. One framework licenses applying the criterion, the other does not.
  3.  **No Settling Observation:** No conceivable new observation resolves the dispute because it hinges on *how* to conceptualize existing observations, not on missing data.
  4.  **Not Merely Semantic:** It's not about assigning different dictionary meanings to "exists" or "university." Both parties understand the *usage* of the term in context. The disagreement is whether that usage *corresponds to a fundamental ontological category* or is merely a pragmatic linguistic tool. They disagree on the *metaphysical weight* of the concept.
  5.  **Not Substantive Ontology (in the traditional sense):** Unlike disagreements about, say, the existence of atoms or dark matter, this isn't about discovering hidden entities or properties. It's about the *best* or *most fundamental* way to *describe* a complex system whose components and interactions are already known. It's ontological in the sense of "what categories do we take as basic?" but not in the sense of "what *things* are there independently of description?"

  ### Terms of Art & Theoretical Context:
  *   **Carnap's "Framework Relativity" (Empiricism, Semantics, and Ontology):** Carnap argued that questions about the "reality" of a system (e.g., "Do numbers exist?") only make sense *within* a chosen linguistic framework. Asking if the system is "real" *absolutely* is a meaningless "external question." Your colleagues are operating within different frameworks: one includes institutional entities as basic, the other insists on reducing them to individuals.
  *   **Sellars' "Myth of the Given" & Conceptual Frameworks:** Sellars rejected the idea of raw, unconceptualized data. All experience is shaped by a conceptual framework. The dispute reflects a clash between frameworks – one "giving" institutional entities as basic units of social explanation, the other "giving" only individuals.
  *   **Social Ontology (Searle, Epstein, etc.):** Specifically addresses the reality of social/institutional objects. Searle argues they are "ontologically subjective" (dependent on collective intentionality) but "epistemically objective" (real in their effects). The disagreement is about whether this constructed reality qualifies as "really existing" in the *fundamental* sense your colleagues debate.
  *   **Methodological Individualism vs. Holism:** A classic social science divide. The individualist insists only individuals and their properties/actions are fundamental; talk of "the university acting" is metaphorical shorthand. The holist insists emergent social entities have causal powers and properties irreducible to individuals. Your colleagues are enacting this philosophical/sociological debate.
  *   **Ontological Reductionism:** The denying colleague is advocating a reductionist position: universities *just are* collections of individuals, buildings, and rules. The affirming colleague denies that such a reduction captures the entity's essential nature or causal role.

  ### A Workable Test for Recognition:
  Ask: **"If we magically knew *every* concrete fact about the components, their states, their interactions (past, present, and counterfactual), and the rules governing them, would this disagreement persist?"**

  *   If **YES**, it's likely a **framework-relative ontological disagreement**.
      *   *Why?* The disagreement isn't about missing information about the parts or their interactions; it's about whether conceptualizing a whole *as a single entity* is metaphysically warranted or merely a useful fiction, even given complete knowledge of the parts.
  *   If **NO**, it's likely either:
      *   An **ordinary factual disagreement** (missing information about the components/interactions).
      *   A **substantive ontological disagreement** resolvable by evidence (e.g., disagreement about the existence of a hidden component or property).

  ### Why the Distinction Matters (Beyond Semantics):
  This disagreement *feels* substantive because the choice of framework has practical consequences:
  1.  **Explanatory Focus:** Does the university cause events, or do only individuals acting in roles cause them?
  2.  **Moral/Legal Responsibility:** *Can* the university *itself* be morally culpable or legally liable, or only the individuals within it? (This mirrors corporate personhood debates).
  3.  **Intervention:** Should we "treat the economy" or focus on specific policies/transactions? Should we treat "the syndrome" or the individual symptoms/underlying causes?
  4.  **Identity & Persistence:** When does "the university" cease to exist? When all original members leave? When the charter lapses? When the buildings are sold? The framework dictates the answer.

  ### Conclusion
  The precise diagnosis is a **disagreement grounded in divergent conceptual frameworks concerning ontological commitment to emergent or institutional entities**. It is characterized by **complete agreement on component-level facts coupled with irreconcilable interpretations of what those facts *mean* for the existence of a higher-level entity**. While not resolvable by empirical discovery alone (due to its framework-relativity), it is far from trivial, shaping how we understand agency, responsibility, and intervention in complex systems. The "magical complete knowledge" test provides a robust way to identify it. This structure is pervasive wherever we conceptualize aggregates, systems, or institutions – precisely the domains where philosophy, social science, law, and medicine intersect.
