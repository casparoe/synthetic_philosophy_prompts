answer: |-
  ### Adversarial Collaboration Document: Weakness of Will and Hyperbolic Discounting  
  **Parties:**  
  - **Position A (Preference-Reversal Camp):** Weakness of will arises from time-inconsistent preferences (e.g., hyperbolic discounting), with no privileged "true self." Actions reflect current all-things-considered rankings.  
  - **Position B (Genuine-Akrasia Camp):** Weakness of will involves a failure of self-governance where agents act against their *occurrent* better judgment, necessitating explanations beyond preference reversal (e.g., executive dysfunction).  

  ---

  #### 1. Agreed Claims  
  Both parties endorse the following substantive claims:  
  1. People sometimes act in ways they explicitly and sincerely describe as contrary to their own interests or values, even when no new information justifies the shift (e.g., procrastinating on a work task despite judging it best to act now).  
  2. Temporal proximity systematically influences decisions: rewards/costs are discounted more steeply when immediate (e.g., choosing $50 today over $100 next month) than when delayed, and this pattern is robust across contexts.  
  3. Commitment devices (e.g., financial penalties for failure, locking away temptations) effectively reduce counterproductive behaviors (e.g., overeating, smoking) by altering the choice architecture.  
  4. Neural and behavioral evidence confirms that visceral states (e.g., cravings, fatigue) can amplify impulsive choices, independent of reflective judgment.  
  5. Standard rational-choice models (e.g., exponential discounting) fail to explain commonplace reversals in planned behavior, necessitating alternative frameworks.  
  6. There is no unified "self" across time in a strong metaphysical sense; agential perspectives shift situationally.  

  ---

  #### 2. Disagreements  
  The table below summarizes core disagreements. Wording is acceptable to defenders of each position.  

  | Question                                                                 | Position A Answer (Preference-Reversal)                                                                 | Position B Answer (Genuine-Akrasia)                                                                 |
  |--------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|
  | **Does akratic action require acting against one’s *occurrent* better judgment?** | No: What appears as akrasia is a preference reversal. At action, the agent’s all-things-considered ranking favors the chosen act; prior judgments reflect earlier preferences. | Yes: Akrasia centrally involves acting against an *occurrent* all-things-considered judgment (e.g., “I now judge X best but do Y”). |
  | **Is the agent at the moment of temptation “fully rational”?**          | Yes: The agent acts rationally relative to their *current* preferences. Time-inconsistency is not irrationality but changing valuations. | No: The agent exhibits irrationality by failing to align action with their *own* occurrent judgment, violating core norms of agency. |
  | **Why do commitment devices work?**                                     | They alter incentives (e.g., raising costs of impulsivity), making the desired action dominant in the moment of choice. | They shore up agency by externalizing control, circumventing failures of willpower or judgment-execution. |
  | **Is pre-committing normatively distinct from not pre-committing?**     | No: Pre-commitment is a strategic tool to align future incentives. It reflects foresight but no deep agential difference. | Yes: Pre-commitment embodies successful self-governance; its absence may signal agential fragility even with identical incentives. |

  ---

  #### 3. Cruxes  
  Sub-questions where divergent predictions could be tested empirically. Each crux specifies an agreed-upon test and opposing predictions.  

  1. **Crux: Does the agent’s all-things-considered judgment reverse at the moment of akratic action?**  
     - **Test:** Real-time experience sampling during temptation (e.g., subjects rate “best course” and “intended action” *during* a procrastination or dietary lapse). Neural correlates (e.g., fMRI) of judgment vs. desire are monitored.  
     - **Prediction A:** Self-reports and neural data will show judgment shifts to favor the tempting option at action-time.  
     - **Prediction B:** Self-reports and neural data will show judgment *remains* aligned with long-term goals, dissociated from action.  

  2. **Crux: Do commitment devices operate by changing incentives or by augmenting agency?**  
     - **Test:** A diet study where Group 1 faces a cash penalty for eating junk food (incentive change), Group 2 uses a “personal pledge” device (no material incentive), and Group 3 has no device. Measure self-reports of judgment stability and actual compliance.  
     - **Prediction A:** Only Group 1 (incentive-altered) reduces lapses significantly. Pledges (Group 2) show no unique effect beyond incentives.  
     - **Prediction B:** Both Groups 1 and 2 reduce lapses vs. Group 3, with Group 2 reporting strengthened “resolve” despite unchanged incentives.  

  3. **Crux: Are post-action regrets driven by preference shifts or judgment-action gaps?**  
     - **Test:** Post-hoc narratives of akratic episodes (e.g., after smoking relapse). Code for expressions of “I still knew it was wrong while doing it” (B) vs. “It seemed right at the time” (A).  
     - **Prediction A:** >80% of regrets reference temporally localized preferences (e.g., “I wanted it then”).  
     - **Prediction B:** >50% of regrets affirm judgment-action conflict (e.g., “I knew I shouldn’t but did it anyway”).  

  ---

  #### 4. Verbal Disputes  
  The parties agree that the term **“preference”** is a primary source of non-substantive disagreement:  
  - Position A uses “preference” to denote *revealed choice* (e.g., the selected option defines all-things-considered ranking at t).  
  - Position B distinguishes “judgment” (evaluative belief about what is best) from “preference” (motivational pull), reserving “all-things-considered” for the former.  
  Both concur that resolving this terminological difference would not settle the debate but would clarify the locus of disagreement.  

  ---

  **Signatures**  
  _________________________  
  Position A Advocate (Behavioral Economics)  
  _________________________  
  Position B Advocate (Philosophy)  

  \answer{The central substantive dispute is whether weakness of will reduces to time-inconsistent preferences or requires positing a failure of self-governance in which agents act against their occurrent better judgment.}
