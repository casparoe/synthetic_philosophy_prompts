  ### Joint Statement of Adversarial Collaboration: Realism vs. Looping Effects in Psychiatric Classification

  We, the undersigned—representing realist and looping-theorist perspectives in the philosophy of psychiatry—have engaged in adversarial collaboration to clarify our longstanding disagreements. While we hold divergent views on the ontological status of psychiatric categories, we recognize that progress requires distinguishing substantive disputes from verbal confusions and identifying empirical cruxes that could resolve them. This document outlines points of agreement, precise disagreements, and key tests for future inquiry. We concur that psychiatric classifications are pragmatically indispensable, but we differ on whether they reflect stable causal structures ("real kinds") or are inherently unstable due to "looping effects" (wherein classifications alter the phenomena they describe). Critically, we distinguish:  
  - The **existence of looping effects** (which the realist grants) from the **claim that looping effects undermine real kinds** (which the realist denies).  
  - The **poor grounding of some categories** (which both grant) from the **universality of looping effects** (which the realist denies).  

  Our goal is to model productive philosophical engagement: no claim is included unless both parties endorse it without reservation, and no disagreement is obscured by compromise.  

  ---

  #### (1) Agreed Claims (Without Reservation)  
  Both parties affirm the following non-vacuous claims, grounded in historical, empirical, and conceptual considerations:  

  1. **Historical Dynamism of Psychiatric Categories**: The history of psychiatric classification (e.g., shifts from "hysteria" to somatic symptom disorder, or from DSM-III to DSM-5) demonstrates that categories evolve due to empirical evidence, clinical utility, socio-cultural factors, and institutional pressures. This dynamism does not, by itself, resolve whether current categories reflect real causal structures or are artifacts of looping.  

  2. **Existence and Scope of Looping Effects**: Looping effects occur when a psychiatric label (e.g., "major depressive disorder") alters the self-conception, social interactions, and behavioral expression of diagnosed individuals, as well as clinical practices and research priorities. These effects are well-documented (e.g., in studies of autism diagnosis changing parental expectations) but are not inherently unlimited; they may be constrained by biological, psychological, or social factors.  

  3. **Realism’s Non-Essentialist Commitments**: The realist position does not require psychiatric categories to be essentialist "natural kinds" with immutable boundaries. Instead, it holds that successful categories (e.g., those with predictive validity) may track probabilistic causal structures (e.g., neurobiological mechanisms) that exist independently of human practices, even if these structures are "messy" (e.g., polygenic or multifactorial).  

  4. **Looping Theory’s Non-Constructivist Core**: The looping theorist position does not reduce psychiatric categories to arbitrary social constructions. Looping effects arise from real-world interactions (e.g., diagnostic labels altering identity), and categories can be clinically useful without tracking mind-independent causal structures.  

  5. **Success Criteria for Psychiatric Categories**: A category is successful if it:  
     - **For realists**: Enables projectible inferences (e.g., predicting treatment response or etiology) that suggest it approximates a causal joint in nature.  
     - **For looping theorists**: Demonstrates clinical utility (e.g., guiding effective interventions or empowering patients) while acknowledging its interactive nature.  
     Both agree that success does not require perfect stability or absence of looping effects.  

  6. **Probative Evidence**: The following evidence is jointly recognized as probative:  
     - **Longitudinal studies** of individuals before/after diagnosis to isolate labeling effects.  
     - **Cross-cultural comparisons** of symptom expression under differing diagnostic systems.  
     - **Biological correlates** (e.g., genetics, neuroimaging) assessed for stability across cultural or temporal shifts.  
     - **Historical analyses** of category evolution (e.g., how "schizophrenia" changed across DSM editions).  
     Such evidence must account for looping effects without presupposing they invalidate realism.  

  ---

  #### (2) Disagreements Table  
  The table below lists precise propositions where we differ. Each is phrased so the realist accepts the "Realist Wording" and the looping theorist accepts the "Looping Theorist Wording." Substantive disagreements involve conflicting empirical commitments; verbal disagreements arise from terminological differences without empirical consequences.  

  | Proposition | Realist Wording (Accepted by Realist) | Looping Theorist Wording (Accepted by Looping Theorist) | Disagreement Type | Notes |
  |-------------|----------------------------------------|---------------------------------------------------------|-------------------|-------|
  | The stability required for real kinds | Psychiatric categories, at their best, track causal structures that remain stable *enough* to support projectible inferences, despite looping effects. | Psychiatric categories are inherently unstable because looping effects continuously reshape the phenomena, precluding the stability required for real kinds. | Substantive | Disagreement hinges on whether looping effects *inevitably* destabilize causal structures. |
  | Universality as evidence for realism | Cross-cultural recurrence of symptom clusters (e.g., psychosis) provides evidence for underlying causal structures that are not solely products of looping. | Apparent cross-cultural universality is primarily an artifact of globalized diagnostic practices and does not robustly support mind-independent causal structures. | Substantive | Disagreement concerns the interpretation of universality: as evidence of causal reality vs. looping-driven convergence. |
  | Biological markers as validating evidence | Biological correlates (e.g., genetic variants) can validate a category as tracking a real kind if they are consistently associated with symptoms across contexts. | Biological markers are unstable because they are modulated by looping effects (e.g., diagnostic changes altering phenotypes), so they cannot independently validate real kinds. | Substantive | Disagreement centers on whether biological markers *resist* looping effects. |
  | Scope of looping effects | Looping effects occur but are constrained; they do not prevent psychiatric categories from latching onto durable causal patterns. | Looping effects are pervasive and constitutive, ensuring that psychiatric categories never capture stable, mind-independent causal structures. | Substantive | Disagreement is about the *degree* to which looping undermines stability, not its existence. |
  | "Natural kind" applicability | Psychiatric categories can be "natural kinds" in a pragmatic, non-essentialist sense (e.g., as homeostatic property clusters). | Psychiatric categories cannot be natural kinds because their interactive nature precludes the independence and passivity required for natural kinds. | Verbal | **Terminological difference**: "Natural kind" is defined by realists as *causal-pragmatic* and by looping theorists as *non-interactive*. The dispute is semantic, not empirical, as both agree on the phenomena (e.g., looping occurs, categories are useful). |

  ---

  #### (3) Cruxes and Resolving Evidence  
  Cruxes are sub-questions that, if resolved, would change at least one party’s position on a substantive disagreement. For each crux, we specify:  
  - The **disagreement it resolves** (from Section 2).  
  - The **direction of resolution** (which view would be challenged by a particular outcome).  
  - A **concrete empirical/historical case** both agree is probative.  
  - **Predictions** from each side.  
  - **Admissions** required if predictions are falsified.  

  **Crux 1: Do symptom clusters remain stable in the absence of diagnostic labeling?**  
  - **Relevant Disagreement**: Universality as evidence for realism (Row 2).  
  - **Resolution Direction**: If stability is shown, realism is strengthened; if instability is shown, looping theory is strengthened.  
  - **Case**: The **WHO International Pilot Study of Schizophrenia (IPSS)** and **DOSMED study**, which compared schizophrenia symptoms across diverse cultures (e.g., Nigeria, India, Colombia) with varying exposure to Western psychiatry. These studies assessed untreated populations to minimize looping effects.  
    - **Realist Prediction**: Symptom clusters (e.g., delusions, social withdrawal) will show high cross-cultural stability without labeling, indicating a universal causal structure.  
    - **Looping Theorist Prediction**: Symptoms will vary significantly across cultures due to unmeasured looping effects (e.g., local labels or family responses), undermining universality.  
  - **Admissions**:  
    - If symptom clusters are stable, the looping theorist must concede that some causal structures resist looping.  
    - If symptoms vary substantially, the realist must concede that cultural/looping factors dominate.  

  **Crux 2: Are biological markers stable across diagnostic shifts?**  
  - **Relevant Disagreement**: Biological markers as validating evidence (Row 3).  
  - **Resolution Direction**: If markers persist through diagnostic changes, realism is supported; if markers shift, looping theory is supported.  
  - **Case**: **Genetic studies of depression** before and after DSM-5 redefined diagnostic criteria (e.g., adding mixed features specifier). GWAS data from cohorts like the UK Biobank can test whether genetic correlations with depression symptoms persist or change post-revision.  
    - **Realist Prediction**: Genetic markers (e.g., polygenic risk scores) will correlate with core symptoms (e.g., anhedonia) across diagnostic criteria changes, indicating stable causal underpinnings.  
    - **Looping Theorist Prediction**: Genetic associations will weaken or shift as diagnostic changes alter symptom reporting and help-seeking behavior via looping.  
  - **Admissions**:  
    - If markers persist, the looping theorist must admit that some biological structures are loop-resistant.  
    - If markers shift, the realist must admit that looping affects biological phenotypes.  

  **Crux 3: Does diagnostic labeling alter the core trajectory of a disorder?**  
  - **Relevant Disagreement**: Scope of looping effects (Row 4).  
  - **Resolution Direction**: If labeling induces profound changes, looping theory is strengthened; if core features persist, realism is strengthened.  
  - **Case**: **Longitudinal studies of autism spectrum disorder (ASD) diagnosis**, tracking children pre- and post-diagnosis (e.g., via the Autism Diagnostic Observation Schedule). Measures include social communication behaviors, parental expectations, and school support access.  
    - **Realist Prediction**: Core ASD features (e.g., repetitive behaviors) will remain stable post-diagnosis; looping affects only self-concept and social responses, not the causal structure.  
    - **Looping Theorist Prediction**: Diagnosis will alter the expression of core features (e.g., reducing distress via accommodations), changing the disorder’s trajectory and undermining stability.  
  - **Admissions**:  
    - If core features persist, the looping theorist must concede that looping does not always destabilize causal structures.  
    - If core features change, the realist must concede that looping can reshape the phenomenon.  

  ---

  #### Concluding Remarks  
  This document clarifies that our debate centers on the **stability and mind-independence** of psychiatric categories, not the existence of looping effects or the utility of classification. By identifying shared ground, precise disagreements, and testable cruxes, we provide a framework for empirical resolution. We encourage researchers to engage with these cases, as their outcomes could alter one or both of our views.  

  ---  
  **Signed,**  
  [Realist’s Name], representing the realist perspective  
  [Looping Theorist’s Name], representing the looping theorist perspective  

  ---  
  *This document is intended for publication as a model of adversarial collaboration in [Journal Name].*
