  We are drafting a joint statement between two philosophers of psychiatry: a realist and a looping theorist. The document must include:

  1. A numbered list of claims both accept without reservation.
  2. A disagreements table (with columns for Realist, Looping Theorist, and notes on whether it's substantive or verbal).
  3. A list of cruxes (sub-questions that would change at least one party's view if resolved) and for each, a concrete case and predictions.
  4. Throughout, we must distinguish between the existence of looping effects and their undermining of real kinds, and between some categories being poorly grounded and all being interactive.

  Let's start with (1) the agreed claims. We need non-trivial points that both can sign. Consider:

  - Both accept that psychiatric classifications have changed over time and that these changes are influenced by social, cultural, and institutional factors.
  - Both accept that looping effects occur: that being labeled can change a person's self-concept, behavior, and social interactions.
  - However, the realist will want to stress that this doesn't necessarily undermine the reality of the kind, and the looping theorist will want to stress that it often does. So we need to phrase carefully.

  Proposed agreed claims:

  1. **Historical Change and Influence**: The history of psychiatric classification demonstrates that diagnostic categories are not fixed but have evolved in response to empirical findings, clinical utility, and socio-cultural factors. Both parties agree that this historical dynamism does not, by itself, settle the question of whether current categories reflect real causal structures.

  2. **Existence of Looping Effects**: Both parties accept that psychiatric classifications can and do produce "looping effects" (or interactive effects) in which the application of a diagnostic label alters the self-conception, social roles, and behaviors of the labeled individual, and may also influence the expression of symptoms and the clinical practices surrounding the category.

  3. **Not All Categories Are Equal**: Both parties agree that some psychiatric categories may be more robustly grounded in causal structures than others, and that the presence of looping effects does not necessarily imply that a category is entirely socially constructed without any underlying causal basis.

  4. **Evidence for Validity**: Both parties agree that the validity of a psychiatric category should be assessed by multiple lines of evidence, including but not limited to: 
     - Predictive validity (e.g., ability to predict course, treatment response)
     - Etiological validity (e.g., evidence of shared causal mechanisms)
     - Clinical utility (e.g., guiding effective interventions)
     Both also agree that the presence of looping effects does not automatically invalidate a category but must be examined for how it interacts with these evidence types.

  5. **Probative Evidence**: Both parties agree that the following kinds of evidence are probative for evaluating psychiatric categories:
     - Longitudinal studies tracking individuals before and after diagnosis to measure changes in behavior, self-concept, and social responses that might be attributable to labeling.
     - Cross-cultural studies examining whether similar symptom clusters and associated features emerge in different cultural contexts and under different diagnostic systems.
     - Studies of biological correlates (e.g., neuroimaging, genetics) that may remain stable despite looping effects.

  Now, for (2) the disagreements table. We need to phrase each proposition so that each party would accept their column's wording.

  Let me outline the main disagreements:

  - **Nature of Kinds**: The realist thinks that psychiatric categories can be natural kinds (or something close) that are discovered, while the looping theorist thinks they are interactive kinds that are created and unstable.

  - **Stability**: The realist believes that despite looping effects, the core features of a disorder are stable enough to count as a real kind. The looping theorist denies this.

  - **Universality**: The realist might hold that some categories are universal (appearing in all cultures) and that this supports their reality. The looping theorist might argue that apparent universality is due to global spread of psychiatric models.

  We must also note any verbal disagreements.

  Disagreements Table:

  | Proposition | Realist View | Looping Theorist View | Notes |
  |-------------|--------------|------------------------|-------|
  | 1. The extent to which psychiatric classifications reflect stable causal structures independent of human practices. | Psychiatric classifications, at their best, pick out stable causal structures that exist independently of the classificatory practices and are not substantially undermined by looping effects. | Psychiatric classifications are inherently interactive kinds; the causal structures they appear to pick out are not stable because they are continuously reshaped by the looping effects of classification, and thus do not exist independently of human practices. | Substantive. |
  | 2. The possibility of natural kinds in psychiatry. | Some psychiatric categories can be natural kinds (in a pragmatic, non-essentialist sense) that carve nature at its joints, even if the joints are messy and probabilistic. | Psychiatric categories cannot be natural kinds because they are interactive kinds, and the interactive nature precludes the stability and independence required for natural kinds. | Substantive. |
  | 3. The universality of symptom clusters. | The cross-cultural recurrence of certain symptom clusters (e.g., psychotic symptoms, mood disturbances) provides evidence for underlying causal structures that are not solely the product of looping effects. | Apparent cross-cultural universality of symptom clusters is largely the result of the global spread of Western psychiatric models and practices, and does not provide strong evidence for underlying causal structures independent of looping effects. | Substantive. |
  | 4. The role of biological markers. | The discovery of biological markers (e.g., genetic variants, neural correlates) that are consistently associated with a psychiatric category supports the view that the category reflects a real causal structure. | Biological markers, even when found, are not stable across time because they are subject to looping effects (e.g., changes in diagnostic criteria, changes in the population due to labeling) and thus do not provide independent validation of the category as a natural kind. | Substantive. |
  | 5. Definition of "successful" psychiatric category. | A successful psychiatric category is one that carves nature at a joint, meaning it captures a cluster of properties that are causally related and that the category is projectible (supports inductive inferences). | A successful psychiatric category is one that is clinically useful (e.g., guides effective interventions) and may be stable for practical purposes, but this stability is achieved through social and institutional practices and does not imply that it carves nature at a joint. | This might be partially verbal. The realist emphasizes capturing causal structure, the looping theorist emphasizes clinical utility. But both might agree that both are important. We need to note: The disagreement is about what makes a category successful in a metaphysical sense (capturing reality) versus practical sense (being useful). |

  Note: We must also note any verbal disagreements. For example, if they use "natural kind" differently, but we have already tried to avoid that by the realist using "non-essentialist sense".

  Now, (3) and (4) cruxes with cases.

  We need cruxes that, if resolved, would change at least one view.

  Crux 1: **Stability of symptom clusters across time and culture without diagnostic labeling.**

  - If it were shown that certain symptom clusters (e.g., those that we now call schizophrenia) have appeared in diverse cultures and historical periods without the influence of modern diagnostic systems, then the realist would take this as evidence of a stable causal structure. The looping theorist would predict that without the diagnostic label and its associated looping effects, the symptom clusters would be significantly different or non-existent.

  - Case: Historical and anthropological studies of conditions resembling schizophrenia. For example, the WHO International Pilot Study of Schizophrenia (IPSS) and subsequent studies (e.g., the DOSMED study) that found similar incidence rates and symptom patterns across cultures. Also, historical accounts of madness (e.g., in medieval Europe or non-Western societies).

  - Realist prediction: These studies will show stable symptom clusters across cultures and times, even without modern diagnostic labels, indicating an underlying causal structure.

  - Looping theorist prediction: The studies will show significant variation in symptom expression and social responses, and the apparent similarities are due to the imposition of Western categories by researchers.

  - If the evidence shows stability: The looping theorist would have to admit that at least for some conditions, there is a core that is not created by looping effects. If it shows variation, the realist would have to admit that the category is heavily shaped by culture and not stable.

  Crux 2: **Biological markers: Are they stable despite looping effects?**

  - If biological markers (e.g., a genetic variant) are found that are associated with a disorder and remain stable over time even as diagnostic criteria and social responses change, this would support realism. If they shift as diagnostic practices change, that supports looping.

  - Case: The search for genetic markers for schizophrenia. For example, the DISC1 gene was once thought to be a major risk gene, but subsequent research showed it was not as robust. Also, the cross-generational stability of heritability estimates.

  - Realist prediction: Despite changes in diagnostic criteria, certain biological markers will consistently associate with the core features of the disorder.

  - Looping theorist prediction: Biological markers will shift as diagnostic criteria change, and even within the same criteria, the expression of the disorder (and hence the biological correlates) will change due to looping effects.

  - If stable markers are found, the looping theorist would have to admit that at least some causal structures are stable. If markers shift, the realist would have to admit that the category boundaries are influenced by looping.

  Crux 3: **The effect of diagnostic labeling on the course and expression of the disorder.**

  - If diagnostic labeling leads to changes in the disorder that are so profound that they alter the core features, then looping effects undermine the stability required for real kinds. If the core features remain stable despite labeling, then looping effects might be seen as secondary.

  - Case: Studies on the impact of receiving a diagnosis of autism spectrum disorder (ASD) on individuals. Longitudinal studies that track behavior, self-concept, and social functioning before and after diagnosis.

  - Realist prediction: The core features of ASD (e.g., social communication deficits, restricted interests) will remain relatively stable after diagnosis, though the individual's self-understanding and social responses may change.

  - Looping theorist prediction: The diagnosis will lead to changes in the individual's self-concept and behavior that may amplify, reduce, or otherwise alter the expression of symptoms, leading to a new trajectory that is not the same as before labeling.

  - If the core features remain stable, the looping theorist would have to concede that looping does not necessarily destroy the underlying causal structure. If the core features change, the realist would have to concede that looping effects can be so profound as to undermine stability.

  Now, we write the joint statement accordingly.
