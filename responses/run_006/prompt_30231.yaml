prompt: |-
  I am a third-year undergraduate in a democratic theory seminar and will be running a 45-minute session for our 12-person class on the boundary problem: who should be included in the demos before democratic procedures can operate, and why that question cannot be settled democratically without circularity. Design a structured simulation in which participants, with no introductory lecture, must constitute a demos for a binding decision that affects both current insiders and outsiders (for example, a university policy affecting students, staff, and nearby residents). Arrange the roles and rules so that participants discover for themselves that every inclusion rule either presupposes a prior demos or appeals to a principle such as that all affected interests should be included or that all those subject to the resulting coercion should be included, which then needs its own specification; include at least one moment where these two principles visibly select different people. By the end, participants should have a felt grasp of the circularity and of how the main inclusion principles can pull apart. The design should include a timeline, materials, a debrief mapping specific moments to the theoretical positions, a list of what will predictably go wrong on a first run and how to handle each failure, and an honest note on which feature of the real boundary problem the simulation cannot reproduce. Return the design as a JSON object with fields: title, setting (group size, duration, materials), scenario, roles (array of objects with role, information, objective), phases (array of objects with phase, minutes, instructions), debrief (array of objects with moment, concept, facilitator_question), likely_failures (array of objects with failure, symptom, fix), cannot_reproduce (string).
reasoning: |-
  We are designing a simulation for a class of 12 students. The simulation should help them discover the boundary problem in democratic theory: the circularity in defining the demos and the tension between different inclusion principles (like the all-affected principle and the all-subjected principle). 

  Title: "Drawing the Line: The Boundary Problem in Democratic Inclusion"

  Setting:
  - Group size: 12 participants (plus facilitator)
  - Duration: 45 minutes
  - Materials: 
    - Name tags for roles (prepared in advance)
    - 12 role sheets (one per participant, with their role description and objective)
    - A large visible board or chart paper for writing down proposals and votes
    - Markers
    - Timer

  Scenario: 
  The setting is "Greenfield University". The university is considering a binding policy to build a new campus center that will require acquiring land currently used by a community garden. The decision affects:
    - Current students (who pay student activity fees that will fund part of the center and who use the campus facilities)
    - Faculty and staff (who work at the university and may use the center)
    - Nearby residents (who use the community garden and may be affected by noise and traffic)
    - Future students (who will attend in coming years and use the center)

  Roles: Array of 12 role objects. We'll assign roles to cover the key groups and also include an external observer to note the process.

  Roles:
  1. Current Student 1 (Undergraduate)
     - Information: You pay student fees. You use the current student center and sometimes the community garden. You want a better student center but also value the garden.
     - Objective: Ensure the new center is built without increasing fees too much. You are concerned about losing the garden but also want better facilities.

  2. Current Student 2 (Graduate)
     - Information: You are a graduate student. You spend most of your time in the lab and library. You rarely use the current student center but would use a new one with better study spaces.
     - Objective: Push for a new center that has dedicated quiet study areas and doesn't raise fees for graduate students.

  3. Faculty Member
     - Information: You teach at the university. You sometimes use the community garden for relaxation. The new center might have faculty offices and meeting spaces.
     - Objective: Ensure the new center includes spaces for faculty and that the university doesn't face backlash from the community.

  4. Staff Member (Administrative)
     - Information: You work in the administration. You use the community garden regularly. The new center would mean more work for your office (managing the project) but also better facilities.
     - Objective: Balance the benefits of a new center with the loss of the garden and potential community anger.

  5. Nearby Resident 1 (Garden User)
     - Information: You live two blocks from the university. You use the community garden daily. The garden is on university-owned land but has been open to the public for 20 years.
     - Objective: Prevent the garden from being destroyed. You are open to compromise if the university provides an alternative garden space.

  6. Nearby Resident 2 (Parent)
     - Information: You live near the university and have children in the local school. You are concerned about increased traffic and noise from the new center. You rarely use the garden.
     - Objective: Minimize disruption to the neighborhood. You want traffic studies and noise mitigation.

  7. Future Student (represented by a current student playing this role)
     - Information: You will start at the university next year. You won't pay fees until then. You are excited about the new center but won't be here for the construction disruption.
     - Objective: Ensure the new center is built because you will benefit from it without paying the current fees.

  8. University Administrator
     - Information: You are a decision-maker at the university. You want the new center to enhance the university's reputation. The land is university property. You are under pressure from donors to build.
     - Objective: Get the project approved with minimal opposition and cost.

  9. Local Business Owner
     - Information: You own a cafe near the campus. You expect more customers from the new center but also worry about construction disrupting business.
     - Objective: Support the project if it brings more customers, but want compensation for construction disruption.

  10. Environmental Advocate
      - Information: You are not affiliated with the university but are a local environmentalist. The garden is a green space that supports biodiversity and community well-being.
      - Objective: Preserve the garden or ensure that any new building meets high environmental standards and includes equivalent green space.

  11. Alumni Representative
      - Information: You are an alumnus of the university and a donor. You want the university to grow and improve. You don't live nearby but visit occasionally.
      - Objective: Support the project because you believe it will enhance the university's standing, but you don't want to alienate current students or the community.

  12. Observer (this role is for a participant to step back and note the process)
      - Information: You are an observer. You do not have a stake in the outcome but are watching how the group decides who gets to decide.
      - Objective: Take notes on how the group defines the demos and what arguments are used. Be prepared to report in the debrief.

  Phases: Array of phase objects.

  Phase 1: Introduction and Role Assignment (5 minutes)
  - Instructions: 
    - Facilitator distributes role sheets and name tags. 
    - Participants read their roles and objectives. 
    - Facilitator sets the stage: "Greenfield University is deciding on a new campus center that will replace the community garden. You have been brought together to decide who should be included in making this binding decision. Your task is to define the group (the demos) that will vote on the policy. You have 20 minutes to come to an agreement on the composition of the demos."

  Phase 2: Defining the Demos (20 minutes)
  - Instructions: 
    - Participants must propose and agree on a rule for who is included in the decision-making body. 
    - They can propose any rule (e.g., only current students, everyone affected, only those subject to the university's authority). 
    - The facilitator will write proposals on the board. 
    - The group must then vote on which rule to adopt. 
    - But note: they haven't defined who gets to vote on the rule! The facilitator should not provide a rule; let them struggle. 
    - The facilitator should note when the group is trying to vote without a defined electorate and ask: "Who is allowed to vote on this rule?"

  Phase 3: The Binding Vote (5 minutes)
  - Instructions: 
    - Once (if) they have a rule, the facilitator applies the rule to determine who in the room is included in the demos (based on their roles). 
    - Then, only those included can vote on the policy: "Should Greenfield University build the new campus center on the site of the community garden? Yes or No." 
    - The vote is binding (within the simulation). 
    - The facilitator counts the vote and announces the result.

  Phase 4: Reflection and Reveal (5 minutes)
  - Instructions: 
    - The facilitator asks the observer to report what they noticed about how the group decided the demos. 
    - Then, the facilitator asks: 
        - "How did it feel to be included or excluded?" 
        - "What rule did you settle on and why?" 
        - "Did anyone feel the rule was unfair? Why?"

  Debrief: (10 minutes) Array of debrief objects. We'll map moments to concepts.

  Debrief:
  1. Moment: When the group tried to vote on the inclusion rule without defining who votes.
     - Concept: Circularity of democratic founding.
     - Facilitator_question: "How did you decide who got to vote on the rule? Did you notice a circularity?"

  2. Moment: When the group proposed an inclusion rule (e.g., "all affected" or "all subject to coercion").
     - Concept: The all-affected principle vs. all-subjected principle.
     - Facilitator_question: "Did anyone propose including only those subject to the university's rules? Or did you focus on who is affected? How did you define 'affected'?"

  3. Moment: When applying the rule to the roles, some roles were included by one principle but not the other (e.g., nearby residents are affected by noise and traffic but not subject to university rules; future students are subject to the university rules but not currently affected by the decision-making).
     - Concept: The principles can pull apart.
     - Facilitator_question: "Were there roles that were affected but not subject to the university? Or subject but not currently affected? How did that tension play out?"

  4. Moment: The binding vote and the feeling of exclusion.
     - Concept: The problem of exclusion and the need for justification.
     - Facilitator_question: "How did it feel to be excluded from the vote? What justifications were given for excluding some?"

  Likely Failures: Array of objects

  1. Failure: The group doesn't recognize the circularity and just assumes everyone present should vote on the rule.
     - Symptom: They quickly agree that all 12 should vote on the rule without questioning.
     - Fix: The facilitator should ask: "Why should all of you vote? What about people not in this room? What rule are you using to include everyone here?" Push them to articulate a rule.

  2. Failure: The group gets stuck in endless debate without progress.
     - Symptom: No proposal is made, or they keep changing the rule without settling.
     - Fix: After 10 minutes, the facilitator can intervene: "You have 10 minutes left. You must propose a rule and then vote on it. Remember, you need to decide who votes on the rule too."

  3. Failure: The group adopts a rule that doesn't clearly show the tension between the two principles (e.g., they choose a rule that by accident includes everyone in the room).
     - Symptom: All 12 are included by the rule they choose, so there is no visible exclusion and no tension.
     - Fix: The facilitator can note: "Your rule includes everyone here. But what about other nearby residents? What about future students who aren't represented? Why did you exclude them?" Alternatively, if they choose a rule that excludes some, that's better.

  Cannot Reproduce: 
  "The simulation cannot reproduce the historical and global scale of the boundary problem in real-world democracies, such as the formation of nation-states, where there is no external facilitator and where the stakes involve fundamental rights and power structures that have evolved over centuries. Our simulation is a temporary, low-stakes exercise with clear roles, whereas real boundary problems are entrenched in complex social, historical, and political contexts."

  Now, we structure the entire design as a JSON object.
