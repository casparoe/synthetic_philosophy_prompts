  **Key Design Logic:**
  1. **Circularity Trap:** By prohibiting initial voting instructions, participants immediately confront the "first demos" problem when trying to establish rules. The Observer role captures meta-lessons.

  2. **Principle Divergence:** The Environmental Advocate (affected) vs. Future Student (subjected) roles force visible tension. Gardeners are affected but not subjected, while Future Students are subjected but not yet affected.

  3. **Emotional Stakes:** Binding vote enforcement makes exclusion tangible. The Custodian/Homeowner roles highlight class divides in "affectedness".

  4. **Predictable Conflicts:** 
     - Graduate Students often exclude Future Students despite shared interests
     - Administrators default to proceduralism
     - Homeowners claim moral authority beyond institutional affiliation

  **Theoretical Alignment:**
  - **All-Affected Principle:** Represented by Community Gardener/Homeowner concerns
  - **All-Subjected Principle:** Embodied by University ID-based proposals
  - **Circularity:** Manifest when any proposed rule requires authorization by the very demos it seeks to create

  **Time Management Note:** The tight 15-minute negotiation phase induces pressure that surfaces instinctive exclusionary tendencies, making boundary-drawing motivations visible.
