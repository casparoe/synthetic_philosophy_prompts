  However, note that the evidence E is rare (P(E)=0.0010989 in the general population). So a hypothesis that assigns a high probability to E is also rare? 

  But we are in a scenario where we are told that the researcher has proposed H. So the existence of such a hypothesis is a given. 

  Perhaps we should not be trying to model P(F|~H, E) but instead recognize that the introduction of H changes the space of hypotheses. 

