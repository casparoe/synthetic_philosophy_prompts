  Now, both doctors can update on F. But note: F is a logical relationship between H and E. 

  However, the challenge is that F is known to both doctors at the same time (when the hypothesis is proposed). So both doctors are in the same situation regarding F. 

  But then why would Dr. A and Dr. B have different updates? They wouldn't. They would update the same way on F.

  Therefore, the resolution might be that when the hypothesis is proposed, the evidence we update on is the explanatory power of H for E, which is new to both doctors. 

  So the mistake of Dr. A is to treat the old evidence E as the evidence to update on, when in fact the new evidence is the logical fact that H explains E. This logical fact is new to both, so both should update. 

  Step-by-step for updating on F:

  We define F as: "P(E|H) = 0.99" (and we also know E). 

  But note: we already know E, so we are interested in P(H|E, F). However, F is the fact that the model assigns a high probability to E under H. 

  We can use Bayes' theorem for F:

  P(H|E, F) = P(F|H, E) * P(H|E) / P(F|E)

