  The issue: When the hypothesis H is new to Dr. A, but the evidence E is old, Dr. A must have had a prior for H that was set without knowing H but knowing E. How do we represent that?

  In the standard Bayesian updating, when we learn a new hypothesis, we have to consider our background knowledge which includes E. So the prior for H, in the context of already knowing E, is P(H|E). But then when we consider the same evidence E again, we are using it twice?

  Dr. A's argument: Since I already knew E, and now I am considering H, the fact that H explains E doesn't tell me anything new because E was already accounted for. Therefore, the posterior remains the same as the prior (which is P(H|E) from the old evidence). And that prior (without the new hypothesis) was very low because the mutation is rare. But note: without the hypothesis H, Dr. A didn't have a specific model for the symptoms. So what was P(H|E) for Dr. A before H was proposed? 

  This is the key. Before H was proposed, Dr. A didn't have H in mind. So the prior for H (without considering E) was P(H). But Dr. A already knew E, so the prior for H in the presence of E is P(H|E). However, without H, Dr. A had other explanations for E. 

  We can model Dr. A's prior for H given their background knowledge (which includes E) as P(H|E). How do we compute that? Actually, we can use the same Bayes' theorem that we used for Dr. B, because Dr. A, at the time when E was first observed, updated their beliefs about the cause of E. But without the specific hypothesis H, they might have considered other causes. However, now that H is proposed, Dr. A must compute the probability of H given E and then use the evidence E again? That would be double-counting.

