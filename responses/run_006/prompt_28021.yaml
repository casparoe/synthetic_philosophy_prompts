  Alternatively, we can use the ratio form:

  We want P(H|E, F) / P(~H|E, F) = [P(F|H, E) / P(F|~H, E)] * [P(H|E) / P(~H|E)]

  Now, what is P(F|H, E)? This is the probability that the hypothesis H would assign a high probability (99%) to E, given that H is true and E is true. Since if H is true, then indeed the model (which we assume is correct) says P(E|H)=0.99, so P(F|H, E)=1? 

  But wait: F is a fact about the hypothesis, not about the world. It's a logical fact. So if H is true, then the model (which is H) does assign P(E|H)=0.99, so F is true. Therefore, P(F|H, E)=1.

