  But note: Dr. B, who just learned both, also gets 9%. So why the disagreement?

  The disagreement is not in the final probability but in the interpretation of the evidence. Dr. B sees the evidence E as providing a strong confirmation for H (because it raised the probability from 0.0001 to 0.09). Dr. A, however, says that the evidence E was already known and so it does not confirm H at all in the sense that it doesn't change the current probability (which was already set by E). 

