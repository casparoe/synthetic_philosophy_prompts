  Conclusion:

  The tension remains. The standard updating rule does not naturally account for the old evidence in a way that allows it to confirm a new hypothesis. The resolution that the evidence is really the explanatory relationship (F) is a way out, but it requires us to model the probability of that relationship, which is not straightforward and not part of the original probabilities we agreed upon. 

