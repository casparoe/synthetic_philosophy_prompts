  A standard Bayesian reply to the problem of old evidence is that we should conditionalize not on the evidence E itself but on the fact that we have learned that H entails E (or that H gives a high probability to E). This is the "logical" approach. 

  In our case, when the hypothesis H is proposed, we are learning that H explains E (i.e., P(E|H)=0.99). This is new information. Let's call this information F. 

