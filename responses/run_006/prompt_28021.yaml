  We are going to construct a scenario in a medical context to illustrate the tension.

  Scenario:

  Dr. A and Dr. B are two physicians at a clinic. They are discussing a patient, Mr. Smith, who has a rare set of symptoms. 

  Facts known to both doctors:
  - Mr. Smith has been suffering from a chronic cough and fatigue for 10 years (Evidence E).
  - Recently, a new hypothesis (Hypothesis H) has been proposed by a researcher: that these symptoms are caused by a specific genetic mutation (Mutation X).

  Both doctors agree on the following probabilities:
  - The prior probability that Mr. Smith has Mutation X (without considering the symptoms) is very low, say 1 in 10,000 (0.0001). This is because Mutation X is very rare.
  - If Mr. Smith does have Mutation X, then the probability that he would have these symptoms (E) is very high, say 99% (0.99). 
  - If Mr. Smith does not have Mutation X, then the probability that he would have these symptoms (E) is also known, but it is low. They agree that only 1 in 1,000 (0.001) people without Mutation X have such symptoms.

  Now, the point of disagreement: 
  - Dr. A was the patient's physician for the last 10 years and has known about the symptoms (E) all along. 
  - Dr. B is a new consultant who just learned about the symptoms (E) at the same time as the hypothesis (H) about Mutation X.

  The puzzle:
  - Dr. B, who just learned about E and H, calculates the probability of H given E using Bayes' theorem and finds that E strongly confirms H.
  - Dr. A, who has known E for 10 years, says that since E was already known, it cannot count as evidence for the new hypothesis H. Therefore, Dr. A believes that E provides no additional confirmation for H.

  Step-by-step reasoning:

  First, let's compute the posterior probability for Dr. B (who is learning E and H at the same time).

  Bayes' theorem: 
  P(H|E) = [P(E|H) * P(H)] / P(E)

  We have:
  P(H) = 0.0001
  P(E|H) = 0.99
  P(E) = P(E|H)*P(H) + P(E|~H)*P(~H) 
        = (0.99 * 0.0001) + (0.001 * (1 - 0.0001))
        ≈ (0.000099) + (0.001 * 0.9999)
        ≈ 0.000099 + 0.0009999
        ≈ 0.0010989

  Therefore, 
  P(H|E) = (0.99 * 0.0001) / 0.0010989 ≈ 0.000099 / 0.0010989 ≈ 0.0901

  So the probability of H given E is about 9%. 

  Now, without the evidence E, the prior probability of H was 0.0001 (0.01%). After considering E, it becomes about 9%. That's a huge increase (by a factor of about 900). So Dr. B concludes that E strongly confirms H.

  Now, Dr. A's reasoning:

  Dr. A has known E for 10 years. Therefore, for Dr. A, the probability of E is 1 (it's a known fact). 

