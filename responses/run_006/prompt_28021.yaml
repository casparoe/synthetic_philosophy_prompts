  Perhaps a simpler resolution: the Bayesian updating rule requires that we use the evidence at the time we learn it. For Dr. A, when the evidence E was first learned, it should have been used to update the beliefs about the cause of the symptoms. At that time, without H, Dr. A updated on E and assigned probabilities to various causes (which didn't include H). Now, when H is proposed, we need to recast our probabilities by including H as a possible cause. We do this by recalculating P(H|E) using the same Bayes theorem that Dr. B used, but now including H as a possibility. This recalculation is the update. 

  In other words, Dr. A should realize that the prior for H (without considering E) was 0.0001, and then when we consider E, we update to 9%. Even though Dr. A knew E, they did not know H, so they could not have updated to H. Now that H is on the table, they must recalculate the probability of H given E. This recalculation is the update that Dr. B does. Therefore, Dr. A should also update from 0.0001 to 0.09, just as Dr. B does. 

  But this means that Dr. A must adjust their prior for H to be 0.0001 (without the evidence E) and then apply E to update? But Dr. A cannot forget E. 

  Instead, we can do a kind of "recalculation" that takes into account that E is known and now H is a new hypothesis. The prior for H in the presence of E should be set to the prior without E (which is 0.0001) and then update with E. But that would be double-counting E? 

