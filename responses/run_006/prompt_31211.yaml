prompt: |-
  I'm a novelist working on a scene in which a character has a hallucination that is, by stipulation, subjectively indistinguishable from a genuine perception. I've been reading about disjunctivism and I keep getting stuck. Disjunctivists insist that a veridical perception and an indistinguishable hallucination are fundamentally different kinds of state. But if the two are genuinely indistinguishable from the inside, then what the character is aware of must be exactly the same in both cases. Doesn't that concession hand the argument from illusion exactly what it needs — the conclusion that the character is never directly aware of the external world, only of something mind-dependent? Please answer in at most one paragraph.
reasoning: |-
  Okay, the user is a novelist struggling with a philosophical concept for their writing. They're trying to write a scene where a character has a hallucination that feels real, but they're stuck on disjunctivism. The core confusion seems to be: if hallucinations and real perceptions feel identical, doesn't that mean we only ever experience mental states, not the real world? 

  Hmm, this is actually a classic trap in philosophy of perception. The user has intuitively grasped the "common kind" assumption that drives arguments from illusion - the idea that identical subjective experiences must share identical mental objects. But disjunctivism rejects that starting point entirely. 

  The key insight they're missing is that disjunctivists don't concede the "aware of the same thing" part. For them, the hallucinating character isn't aware of some mental substitute - they're simply failing to be aware of anything real. It's not about having different objects in mind, but about having a completely different type of experiential relation (or lack thereof) to the world. 

  I should emphasize how radical this stance is: it says the "indistinguishable" part only applies to how things seem from the subject's perspective, not to the actual metaphysical structure of the experience. The novelist might find this useful dramatically - it preserves the possibility of genuine contact with reality, which could matter for their character's journey.
answer: |-
  Disjunctivists reject your key premise: they argue that while hallucinations and veridical perceptions may *seem* subjectively identical, they do **not** share the same fundamental conscious object or state. In veridical perception, the character is directly aware of the external object itself; in an indistinguishable hallucination, they are **not** aware of *any* such object—they merely *seem* to be. The "sameness" is an illusion of indistinguishability, not proof of a shared mind-dependent entity. Thus, the hallucination involves a failure of awareness (a lack of relation to the world), not awareness of a mental substitute, blocking the argument from illusion's conclusion.
