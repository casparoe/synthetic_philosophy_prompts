answer: |-
  ### Decision Procedure for Grant Renewal with Missed Milestones

  This procedure is designed to evaluate multi-year grant renewals when projects miss milestones. It avoids the sunk-cost fallacy while accounting for forward-looking factors that may resemble it. The procedure is structured as a sequence of questions, each operationalizing a core theoretical concept. It stops with a "no" if any question yields a decisive negative, escalates to human judgment when values dominate, and flags unresolved trade-offs. A program officer can complete it in <60 minutes. Output is a board memo summarizing findings.

  ---

  #### **Procedure Steps**

  1. **Question 1: Does the milestone miss indicate a fatal flaw in the project's core theory?**  
     - **Sufficient Answer**:  
       - *Yes* (fatal flaw): Stop. Non-renewal recommended.  
       - *No* (flaw is correctable or unrelated to theory): Proceed to Q2.  
     - **Theory**: Bayesian updating. Past performance is *evidence* (not a cost) to reassess project viability.  
     - **Misapplication Risk**: Mistaking temporary setbacks (e.g., supply delays) for fatal flaws, or vice versa.  
     - *Stop if "yes."*

  2. **Question 2: What is the expected net benefit of *future* funding?**  
     - **Sufficient Answer**:  
       - Quantify or qualify: "High/medium/low" based on:  
         - Future costs (discounting sunk costs).  
         - Future benefits (e.g., lives saved, knowledge gained).  
         - Probability of success (using Q1 evidence).  
       - If benefits > costs: Proceed to Q3.  
       - If costs > benefits: Stop.  
     - **Theory**: Expected utility theory. Only future costs/benefits matter.  
     - **Misapplication Risk**: Ignoring non-quantifiable benefits (e.g., field-building) or underestimating risk.  
     - *Stop if costs > benefits.*

  3. **Question 3: Does existing project infrastructure reduce *future* costs vs. a new grant?**  
     - **Sufficient Answer**:  
       - *Yes* (e.g., specialized staff/tools lower restart costs): Add cost savings to Q2 benefits. Re-run Q2 if marginal.  
       - *No*: Proceed to Q4.  
     - **Theory**: Opportunity cost. Comparing incremental (grant renewal) vs. de novo investment.  
     - **Misapplication Risk**: Confusing *recoverable* assets (forward-looking) with *sunk* costs.  
     - *No stop; adjust Q2.*

  4. **Question 4: Would cancellation damage future work?**  
     - **Sufficient Answer**: Assess:  
       - Partner trust loss (e.g., breaks promises to co-funders).  
       - Reputational harm (e.g., deters risky proposals).  
       - Morale damage (e.g., field-wide demoralization).  
       - If risks are severe: Proceed to Q5.  
       - If minimal: Proceed to Q6.  
     - **Theory**: Relational contract theory. Reputational capital is a forward-looking asset.  
     - **Misapplication Risk**: Overweighting emotional discomfort (bias) vs. strategic reputation (forward-looking).  
     - *No stop; informs Q5.*

  5. **Question 5: Do the benefits from Q2–Q4 justify the opportunity cost?**  
     - **Sufficient Answer**:  
       - Compare to the best alternative grant.  
       - If this project > alternative: Proceed to Q6.  
       - If alternative > this project: Stop.  
     - **Theory**: Cost-benefit analysis. Resources are scarce.  
     - **Misapplication Risk**: Underestimating alternatives due to familiarity bias.  
     - *Stop if alternative is better.*

  6. **Question 6: Are we biased toward continuation?**  
     - **Sufficient Answer**: Flag if present:  
       - Escalation pressure (e.g., board member attachment).  
       - Sunk-cost thinking (e.g., "We’ve spent too much to quit").  
       - Guilt (e.g., "We owe the team").  
       - *Bias alone never justifies continuation.*  
     - **Theory**: Cognitive bias recognition. Isolating irrational motives.  
     - **Misapplication Risk**: Misclassifying valid relational concerns (Q4) as bias.  
     - *No stop; proceed to Q7.*

  7. **Question 7: Final Judgment**  
     - **Sufficient Answer**:  
       - If Q1–Q5 yield clear "continue" or "stop": Decision made.  
       - If trade-offs are values-based (e.g., "How much reputational risk is acceptable?"): Escalate to board.  
     - **Theory**: Value pluralism. Some trade-offs require human judgment.  
     - **What It Cannot Settle**:  
       - Conflicts between quantitative metrics and qualitative values.  
       - Deep uncertainty about long-term impacts.  
     - *Output: Memo to board.*

  ---

  ### **Output Memo Template**
  ```markdown
  **To**: Board of Directors  
  **From**: [Program Officer]  
  **Subject**: Renewal Recommendation for [Project Name]  

  **Summary**:  
  [1-2 sentences on recommendation and key rationale].  

  **Procedure Findings**:  
  1. **Fatal Flaw?** [Q1 answer].  
  2. **Net Future Benefit:** [Q2 answer, adjusted by Q3 if applicable].  
  3. **Reputational/Rela􀃆onal Risk:** [Q4 answer].  
  4. **Opportunity Cost vs. Alternative:** [Q5 answer].  
  5. **Biases Identified:** [Q6 answer].  
  6. **Unresolved:** [Q7: trade-offs requiring board input, if any].  

  **Recommendation**:  
  [Renew / Do Not Renew / Escalate for Board Decision].
  ```

  ---

  ### **Case Applications**

  #### **Case (a): Weak results matching predictions**  
  - **Q1**: No fatal flaw (results align with theory).  
  - **Q2**: Future benefits likely high (theory intact).  
  - **Q3**: No cost savings from assets.  
  - **Q4**: Cancellation could signal intolerance for accurate but "ugly" results, deterring honest proposals. Moderate risk.  
  - **Q5**: Benefits > opportunity cost (if alternative projects are riskier).  
  - **Q6**: No bias detected.  
  - **Q7**: Clear "continue."  
  - **Memo**: Renew. *Opposite to naive sunk-cost rule? No. Naive rule would also continue (only future matters). But note: Naive rule might misread "weak results" as negative news; here, Q1 corrects that.*  

  #### **Case (b): Specialized infrastructure would be lost**  
  - **Q1**: No fatal flaw (e.g., delays due to external factors).  
  - **Q2**: Future benefits medium, but **Q3** shows 40% cost savings from existing staff/infrastructure vs. restarting. Net benefit becomes high.  
  - **Q4**: Cancellation loses partner trust (infrastructure is relationship-specific). High risk.  
  - **Q5**: Benefits > opportunity cost (savings make it competitive).  
  - **Q6**: No bias.  
  - **Q7**: Clear "continue."  
  - **Memo**: Renew. *Opposite to naive sunk-cost rule? Yes. Naive rule ignores infrastructure's forward-looking value, seeing only sunk costs. This would incorrectly stop funding.*  

  #### **Case (c): Board member attachment**  
  - **Q1**: Fatal flaw found (e.g., failed core experiments).  
  - **Stop at Q1**.  
  - **Memo**: Do not renew. *Opposite to what we prefer? Yes. Team/board may want to continue but procedure overrides bias.*  
  - **Unresolved by procedure**: None (Q1 decisive).  
  - **Note**: If Q1 unclear:  
    - Q2 would show negative net benefit.  
    - Q4 reputational risk if continuing (damages rigor credibility).  
    - Q5 opportunity cost high.  
    - Q6 flags board pressure as bias.  
    - Outcome still "stop."

  ---

  ### **Key Clarifications**
  - **Forward-Looking "Sunk Costs"**: Q3 (assets), Q4 (reputation), and Q1 (calibration) convert apparent sunk costs into future-relevant factors.  
  - **Genuine Fallacy Costs**: Q6 identifies these (e.g., ego, guilt) but excludes them from the decision. Only forward-looking costs (e.g., Q4 morale damage) count.  
  - **Naive Rule Failure Modes**: Addressed by:  
    - Q1 (updates priors using past evidence).  
    - Q5 (ensures dynamic consistency by comparing to pre-commitment alternatives).  
  - **Time Efficiency**: Focus on high-leverage questions. Skip steps when early stops occur.  
  - **Board Use**: Memo provides audit trail showing rational decision-making, insulating from bias claims.
