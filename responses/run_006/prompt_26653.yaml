     Step 5: Opportunity cost?
          - There might be better alternatives.

     Step 6: Check for biases.
          - Here we find: the board member's attachment. This is an invalid reason. We must discount it.

     Then we go to Step 7: the residual issue is value-laden? But in Step 6, we identified an invalid bias. Therefore, we should not use that as a reason to continue.

     However, if the project has no positive expected net benefit (Step 2) and no strong reputational reasons to continue (Step 4), then we should stop.

     This case should stop. The naive sunk-cost rule would say stop (because past spending is irrelevant). And we agree.

     But note: the case says we continue "only because" of the board member. So without that, we would stop. Therefore, the procedure should lead to stop.

     This is the opposite of what we (the foundation) might prefer to do because of the board member pressure. But the procedure correctly flags the bias and leads to stopping.

   However, we need one case that comes out opposite to the naive sunk-cost rule. Case (a) and (b) are not opposite to the naive rule because the naive rule would also continue in (a) and might continue in (b) if it properly considers the existing assets as lowering future costs.

   Let me design a case that comes out opposite:

   Case (d): A project that has missed milestones due to bad luck (an unforeseeable event that is now over) but the project is now on track. However, the project is very expensive and the results so far are mediocre. The naive sunk-cost rule might say: only future costs and benefits. The future costs are high and the future benefits are uncertain. But we have a reason: the bad luck is over and the project is now on track. Also, if we stop now, we lose the relationship with a key partner and that partner is critical for other projects.

