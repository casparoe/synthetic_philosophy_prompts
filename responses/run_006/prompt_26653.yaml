prompt: |-
  I direct a small foundation's grantmaking program, and every quarter I sit on renewal decisions for multi-year grants. I have read enough rationalist writing on sunk costs — the Concorde fallacy, the escalation-of-commitment literature, the standard one-line rule — to know both the standard answer and its limits. The one-line rule is that past spending should not influence the decision and only forward-looking costs and benefits count. That rule is clearly right about something, but as a standing policy for an institution that funds risky work it is also clearly incomplete. I want the sophisticated version turned into something my team can actually run.

  Write a decision procedure for whether to continue funding a project that has missed its milestones. These decisions involve several years of funding, people's livelihoods, and our credibility with other funders. The procedure should be a sequence of questions, and for each question it should specify: what counts as a sufficient answer, which part of the underlying theory the question operationalizes, and the most likely way a non-specialist will misapply it. It should say where the procedure stops with a no, where it hands the decision to a person because the residual question is one of values rather than facts, and what the procedure cannot settle. It must be runnable by a program officer without formal training in decision theory in under an hour, and its output should be a memo that can go to our board.

  The procedure needs to be honest about the following. Some things that look like sunk-cost reasoning are forward-looking in disguise: past spending can be evidence about project quality or about our own calibration; a half-built intervention can make the next phase cheaper than starting over; abandoning a project can destroy relationship-specific capacity, break promises to partners, or demoralize a field we want to keep working in; and a reputation for pulling funding at the first bad result can make future grantees unwilling to propose the very kind of risky work we exist to fund. Other things are genuinely the fallacy but still real as psychological and organizational costs, and I need to know how the procedure treats those — which it counts, which it discounts, and which it labels irrelevant. And the naive rule has its own failure mode: applied mechanically, it can amount to a policy of never updating on the fact that we chose badly, and it can be dynamically inconsistent with the commitment we would have wanted to make before the bad news arrived.

  Run the procedure on three cases: (a) a project whose midpoint results are weak in absolute terms but exactly what the project's theory predicted, so the results are not bad news about the project; (b) a project that has built specialized infrastructure and staff capacity that would be lost if we walked away; and (c) a project we continue only because the board member who championed it does not want to admit failure. At least one case should come out the opposite of what the naive sunk-cost rule would say, and at least one should come out the opposite of what we would prefer to hear. Flag any case the procedure cannot settle and say what additional fact or value judgment would settle it.
reasoning: |-
  We are designing a decision procedure for multi-year grant renewal when milestones are missed. The procedure must be runnable by a program officer in under an hour and produce a memo for the board.

   The procedure is a sequence of questions. For each question, we specify:
     - The question
     - What counts as a sufficient answer (how to answer it)
     - Which part of the underlying theory it operationalizes
     - The most likely way a non-specialist will misapply it

   The procedure stops with a "no" at any point if the answer to a question decisively argues against continuation.
   It may also hand the decision to a person when the residual question is one of values (e.g., how to weigh different kinds of costs and benefits).
   We note what the procedure cannot settle.

   We are honest about:
     - Forward-looking reasons that might look like sunk costs (evidence about quality, calibration, relationship-specific capital, reputation effects, etc.)
     - Psychological and organizational costs that are real but might be fallacious if treated as financial costs.

   We are wary of the naive rule's failure modes (never updating, dynamic inconsistency).

   We will run the procedure on three cases.

   The procedure:

   Step 1: Is the project on track to meet its original goals?
     - This is the most direct question. If the project is on track, then we continue. But note: milestones might have been missed, but the overall goal might still be achievable?
     - However, the problem states that milestones have been missed. So we need to reinterpret.

   Let me reframe: We are in a situation where milestones have been missed. We are to decide on continuation.

   We break down:

   Step 1: Clarify the reasons for missing milestones.
     - Question: "Why were the milestones missed? Was it due to factors that were unforeseeable at the outset and are now resolved, or does it reveal a fundamental problem in the project design or team capability?"
     - Sufficient answer: 
          - If the reasons are temporary and resolved, and the project is now back on track, that's positive.
          - If the reasons reveal a fundamental flaw (e.g., the theory of change is broken, the team lacks capacity, the context has changed irreversibly), that's negative.
     - Underlying theory: This question operationalizes the idea of updating on new information about the project's viability and the team's capability.
     - Misapplication: A non-specialist might accept superficial explanations without digging into whether the root cause has been addressed.

   Step 2: Update on the project's expected value.
     - Question: "Given what we now know, what is the expected net benefit of continuing the project versus stopping? Consider only future costs and benefits. Include both quantifiable and non-quantifiable benefits (like learning, field-building, relationship preservation) and costs (including reputational costs of stopping or continuing)."
     - Sufficient answer: 
          - We need a qualitative assessment: if the expected net benefit is clearly positive, continue; if clearly negative, stop. 
          - If uncertain, proceed to the next steps.
     - Underlying theory: This is the core of the sunk cost fallacy avoidance: only future costs and benefits matter. But we include broader impacts (reputational, relational) that are forward-looking.
     - Misapplication: 
          - Overlooking non-quantifiable benefits/costs.
          - Including past costs (which are sunk) in the calculation.

   Step 3: Consider the value of the option to learn more (real options view).
     - Question: "If we continue funding for one more period (e.g., one year), will we learn enough to make a significantly better decision? And is the cost of that additional period justified by the value of the information we would gain?"
     - Sufficient answer:
          - If the project is at a stage where a little more time and money will resolve key uncertainties, then the option value is high. Otherwise, low.
     - Underlying theory: Real options theory: we are buying an option to continue or stop later with better information.
     - Misapplication: 
          - Overestimating how much will be learned in the next period.
          - Underestimating the cost of the next period.

   Step 4: Assess the reputational and relational consequences.
     - Question: "What are the consequences for our foundation's reputation and relationships if we stop? What if we continue and the project fails? Consider:
          - Will stopping this project make future grantees less likely to propose innovative ideas? 
          - Will stopping damage key partnerships that are critical for other projects?
          - Will continuing despite the missed milestones damage our credibility as a rigorous funder?"
     - Sufficient answer: Weigh these factors. If the reputational damage from stopping is severe and outweighs the cost of continuing, then that is a reason to continue. Conversely, if continuing despite poor performance would damage our reputation for rigor, that is a reason to stop.
     - Underlying theory: Reputational and relational factors are forward-looking externalities.
     - Misapplication: 
          - Overweighting the immediate emotional discomfort of stopping (which is a sunk cost fallacy) versus the long-term reputational effects.
          - Confusing the foundation's reputation with the personal reputation of the program officer.

   Step 5: Consider the alternative use of funds.
     - Question: "What is the opportunity cost? If we do not fund this project, what else could we do with the money? How does the expected benefit of the best alternative compare to the expected benefit of continuing this project?"
     - Sufficient answer: If there is a clear alternative that has a higher expected benefit, then we should stop and reallocate. If not, then this factor does not argue against continuation.
     - Underlying theory: Opportunity cost is a fundamental economic concept.
     - Misapplication: 
          - Failing to identify viable alternatives (thus underestimating opportunity cost).
          - Overestimating the benefits of alternatives because they are new and untested.

   Step 6: Check for psychological and organizational biases.
     - Question: "Are there any psychological or organizational pressures that might be influencing our desire to continue? Examples: 
          - A board member's personal attachment (case c)
          - The desire to avoid embarrassment
          - The effort already invested (sunk cost fallacy in its pure form)
          - The fear of letting down the team or partners (if this fear is not about future relationships but about immediate guilt, then it's a bias)"
     - Sufficient answer: If such pressures are present, we must discount them. They are not valid reasons for continuation. However, note that reputational and relational consequences (from Step 4) are valid and should have been considered there.
     - Underlying theory: This step aims to identify and isolate the sunk cost fallacy and other biases.
     - Misapplication: 
          - Mistaking valid relational concerns (which are forward-looking) for invalid emotional ones.

   Step 7: Make a decision or escalate.
     - If at any step the answer decisively argues for stopping (e.g., Step 1 reveals a fatal flaw, Step 2 shows negative net benefits, Step 5 shows a much better alternative), then stop.
     - If after Step 6 the decision is still unclear, then the residual issue is likely a matter of values (e.g., how much weight to put on reputational risk versus financial cost, or how much risk we are willing to take). In that case, we hand the decision to the foundation's leadership (or board) with a clear memo outlining the trade-offs.

   The procedure stops at:
     - "Stop" (no) at any step if a decisive negative is found.
     - After Step 6, if no decisive stop and the remaining issues are value-laden, we hand the decision to a person (with the memo).

   What the procedure cannot settle: 
     - Trade-offs between different kinds of values (e.g., if the project has high scientific value but very high cost, and we must weigh the value of science against the cost). 
     - Deep uncertainties about the future that cannot be resolved by the next period of funding.

   Now, we run the procedure on three cases.

   Case (a): A project whose midpoint results are weak in absolute terms but exactly what the project's theory predicted, so the results are not bad news about the project.

     Step 1: Why were milestones missed? 
          - The milestones were set based on the theory, and the results are as predicted. So the missed milestones were due to the project design (which anticipated slow progress) and not due to unforeseen problems. 
          - This is not a fundamental flaw; it's according to plan. So we don't stop here.

     Step 2: Expected net benefit of continuing?
          - The project is proceeding as expected. The original expected net benefit was positive. Since we haven't received bad news, we update only slightly (maybe we are more certain). The net benefit remains positive? 
          - But note: the results are weak in absolute terms. However, the project's theory predicted this. So if we still believe the theory, then the future benefits might be as expected. 
          - So we expect a positive net benefit. Continue.

     We don't need to go further. The naive sunk-cost rule would say: don't consider past spending -> but that doesn't apply here because we are not using past spending as a reason. However, the naive rule might also say: only future costs and benefits. And here they are positive.

     This case continues. It is the opposite of what we might prefer to hear if we are reactionary to weak results? But actually, it's what we should do.

   Case (b): A project that has built specialized infrastructure and staff capacity that would be lost if we walked away.

     Step 1: Why missed milestones? 
          - We don't know from the case. Let us assume that the reason is not fundamental (so we don't stop at Step 1).

     Step 2: Expected net benefit of continuing?
          - We must include the fact that the specialized infrastructure and staff capacity would be lost if we stop. But note: if we stop, we lose them. If we continue, we preserve them and they can be used for future work. So the future benefits of continuing are higher than if we had to start over because we have these assets.
          - Therefore, the expected net benefit of continuing is higher than it would be for a new project without these assets. 
          - This is a forward-looking reason to continue.

     But let's be cautious: the infrastructure and staff are only valuable if the project is still viable. So if the project is fundamentally flawed, then these assets might not help. But we passed Step 1.

     So we might continue. The naive sunk-cost rule would ignore the sunk cost of building the infrastructure, but note: the infrastructure is not sunk in the sense that it is an asset that can be used going forward. So the naive rule might also say: only future costs and benefits, and the future costs are lower because we have the infrastructure. So it might not be opposite.

     However, sometimes people might misinterpret the infrastructure as a sunk cost and say we shouldn't consider it. But in reality, it's a future benefit (it lowers the cost of future work). 

     Let me adjust: The naive rule might be applied by someone who says, "We shouldn't continue just because we built the infrastructure." But our procedure shows that the infrastructure is a forward-looking benefit.

     This case might continue. But what if the project is not viable? Then the infrastructure doesn't help. So we must have passed Step 1.

     We'll assume the project is viable. So we continue.

   Case (c): A project we continue only because the board member who championed it does not want to admit failure.

     Step 1: Why missed milestones?
          - We don't know. Let us assume it's because of a fundamental flaw (so we would stop at Step 1). But to make the case interesting, let's assume the reason is unclear.

     Step 2: Expected net benefit?
          - We don't have a clear positive. Let's assume it's negative or unclear.

     Step 3: Option value?
