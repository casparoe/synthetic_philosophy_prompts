answer: |-
  ## Research Proposal: Dissecting the Diagnostics - A Pluralist Approach to Semantics-Pragmatics Boundaries

  **Research Question:** Do the standard Gricean diagnostic tests (cancellability, calculability, non-detachability, embeddability) reliably track a *single* distinction (e.g., what is said vs. what is implicated), or do they systematically diverge, tracking two or more distinct boundaries within the semantics-pragmatics interface?

  **Why Existing Positions Leave it Open:** Current debates (minimalism vs. contextualism, grammatical vs. pragmatic accounts of scalar implicatures) largely operate under an implicit assumption of **diagnostic unity**. Minimalists rely heavily on cancellability and non-detachability to argue for a thin "what is said," while contextualists point to the necessity of pragmatic enrichment for truth-evaluation, sometimes leveraging embeddability patterns. Proponents of grammatical accounts of implicatures point to non-cancellability and embeddability under certain operators as evidence for semantic status, while pragmatic accounts emphasize calculability and cancellability. Crucially, *all sides tend to treat the diagnostics as converging on the same boundary*, using one diagnostic (e.g., cancellability) to make claims about the domain tracked by another (e.g., embeddability). Disagreements arise when diagnostics *appear* to conflict (e.g., an implicature seeming cancellable in isolation but non-cancellable when embedded), but these are typically resolved by disputing the *application* of the diagnostic itself within one theoretical framework or by prioritizing one diagnostic over others, rather than questioning the fundamental unity of what the diagnostics are supposed to track. The possibility that these diagnostics are systematically sensitive to *different* underlying properties or boundaries (e.g., commitment, compositionality, speaker intention, conventionality) remains underexplored and undermotivated within the dominant frameworks.

  **Methodology (Concrete Stages):**

  1.  **Diagnostic Divergence Inventory and Analysis (Months 1-9):**
      *   **Systematic Survey:** Compile a comprehensive, theory-neutral inventory of linguistic phenomena central to current debates (e.g., scalar implicatures, presuppositions, loose talk, domain restriction, metonymy, metaphor, embedded implicatures, "and"-conjunction enrichment) where the application of the Gricean diagnostics yields tension or apparent conflict.
      *   **Divergence Mapping:** For each phenomenon, meticulously document *where* and *how* the diagnostics (cancellability, calculability, non-detachability, embeddability) fail to converge. Identify specific linguistic contexts (e.g., matrix vs. embedded clauses, under negation, in questions) where divergence is most pronounced. Crucially, focus on cases where diagnostics conflict *within the same utterance context*.
      *   **Taxonomy of Divergence:** Develop a preliminary taxonomy classifying the *types* of divergence observed (e.g., Cancellable but Non-Detachable; Calculable but Non-Embeddable; Embeddable but Non-Calculable in a Gricean manner; Non-Cancellable but Detachable).
      *   **Justification:** This stage is foundational and theory-agnostic. It avoids exegetical debates about Grice's *intentions* and instead focuses squarely on the *behavior* of the diagnostics in actual linguistic data. Purely formal implementations of one side (e.g., building a grammar-only scalar implicature model) would presuppose the unity of the boundary being tracked, begging the question. A purely textual analysis of Grice wouldn't address how the diagnostics function in contemporary, complex debates.

  2.  **Developing a Pluralist Framework (Months 10-18):**
      *   **Identify Candidate Distinctions:** Based on Stage 1, propose 2-3 distinct (but potentially overlapping) boundaries that the diagnostics might be tracking. Strong candidates include:
          *   **Compositional Semantic Content vs. Truth-Conditional Content:** What is compositionally determined by syntax and lexical meaning vs. what contributes to the literal truth conditions of the utterance in context (potentially including mandatory pragmatic enrichment). Embeddability is likely a key diagnostic here.
          *   **Truth-Conditional Content vs. Speaker Commitment/Communicative Intention:** What the speaker commits to as part of the literal assertion vs. what they additionally imply or suggest. Cancellability and calculability are likely primary diagnostics here.
          *   **Conventional vs. Non-Conventional Meaning:** What is linguistically encoded or highly conventionalized vs. what is genuinely inferred online. Non-detachability might be particularly relevant here, alongside conventionality of calculability.
      *   **Re-map Diagnostics:** Systematically reassign each diagnostic to the boundary/boundaries it most reliably tracks, explaining why it might *fail* as a diagnostic for the other boundaries. Justify this mapping using the divergence patterns identified in Stage 1.
      *   **Re-analyze Stalemates:** Apply the pluralist framework to core stalemates:
          *   **Scalar Implicatures:** Does embeddability under "know" track the compositional boundary (suggesting a semantic component), while cancellability tracks the speaker commitment boundary (suggesting pragmatic status)?
          *   **Minimalism vs. Contextualism:** Does the necessity of enrichment for truth-evaluation (a form of non-cancellability *for truth-conditions*) relate to the truth-conditional content boundary, while cancellability of specific enrichments relates to the speaker commitment boundary?
      *   **Justification:** This stage moves beyond cataloging problems to constructing a positive, empirically grounded alternative. It directly addresses the core insight that a single boundary is insufficient. Alternatives like exegesis or formal modeling of one side are inadequate here as they cannot capture the diagnostic pluralism itself.

  3.  **Empirical Validation and Refinement (Months 19-24):**
      *   **Targeted Behavioral Studies:** Design and conduct modest behavioral experiments (e.g., truth-value judgment tasks, paraphrase tasks, cancellation acceptability judgments) focusing on specific divergence points identified in Stages 1 & 2. For example, test judgments on sentences where a putative implicature is embeddable yet participants readily accept cancellations in similar contexts, probing the independence of these judgments.
      *   **Refine Framework:** Use empirical results to test the predictions of the pluralist framework, refine the proposed boundaries, and adjust the diagnostic mappings.
      *   **Assess Dissolution Potential:** Evaluate whether applying the pluralist framework genuinely dissolves or clarifies specific stalemates (e.g., does it show minimalists and contextualists are partly talking about different boundaries? Does it reconcile aspects of grammatical and pragmatic accounts of implicatures?).
      *   **Justification:** While primarily theoretical, the project requires empirical grounding to validate the proposed pluralism against speaker intuitions, moving beyond armchair linguistics. This step ensures the framework is responsive to actual language use.

  **Success Criteria:**
  *   **Clear Success:** Development of a well-motivated, empirically supported pluralist framework distinguishing 2-3 boundaries, with a clear mapping showing which diagnostics reliably track which boundary (and where they fail). Demonstration that applying this framework resolves specific, recognized tensions in the literature (e.g., explaining why certain implicatures *feel* both embedded and cancellable in different ways) and offers a clearer meta-language for existing debates, potentially showing they stem from conflation. Publication of 2-3 high-quality journal articles and conference presentations.
  *   **Partial Success:** Clear demonstration of systematic diagnostic divergence, a compelling argument that this challenges the unity assumption, and a plausible (if not fully developed or empirically verified) pluralist taxonomy. Identification of key areas where existing debates conflate boundaries, even if a fully refined framework isn't achieved. Publication of findings demonstrating significant divergence.
  *   **Failure:** Failure to identify systematic, non-trivial divergence in the application of diagnostics across key phenomena. Discovery that apparent conflicts are always resolvable by finer-grained application of diagnostics within a single-boundary model, or are attributable solely to performance errors or theoretical misapplication. Inability to construct a coherent pluralist framework that gains traction over simpler, unified explanations.

  **Scope Justification:** This project is ambitious but achievable in two years. Stage 1 builds directly on existing literature and linguistic intuition. Stage 2 requires conceptual synthesis but avoids building complex formal models. Stage 3 involves targeted, manageable experiments (e.g., online surveys) rather than large-scale neurolinguistics or corpus studies. The focus is on *reconceptualization* based on existing data and targeted validation, not exhaustive empirical coverage. The outcome is a novel theoretical framework and diagnostic toolkit, not a complete resolution of all foundational debates. This scope is ideal for a postdoc, offering high impact through conceptual innovation grounded in empirical observation.
