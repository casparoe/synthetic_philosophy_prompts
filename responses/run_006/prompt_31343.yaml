prompt: |-
  I just spent an evening arguing with a friend who insists that evolutionary psychology is little more than a collection of just-so stories. I pushed back, but I found I could not state the rule behind my own reactions. Here are my verdicts on several specific claims, and I would like to know what methodological principle, if any, captures them.

  I find the claim that humans are biologically prepared to acquire fears of snakes and spiders convincing: people condition to them faster and extinguish more slowly than to objects that are far more dangerous in modern life, such as guns and electrical outlets. That looks to me like a real evolved bias.

  I find the claim that people prefer savanna-like landscapes because our ancestors evolved in such environments close to a just-so story: the preference data are mixed, and "ancestral environment" is too vague to yield a definite prediction. Yet I cannot say why this differs from the snake case, since both infer an evolved disposition from present-day responses and then invoke an ancestral environment.

  I accept the finding that stepparents harm children at higher average rates than genetic parents, and I am inclined to accept something like discriminative parental solicitude as the explanation, though I am unsure the evolutionary gloss adds much beyond the proximate account.

  I am torn about male sexual jealousy as an evolved response to paternity uncertainty. The rationale is elegant, but the evidence feels thin: much of it is self-report, and the cross-cultural variation is what one would expect if the phenomenon were largely cultural.

  I find the cheater-detection claim, that people solve Wason selection tasks much better when the rule concerns catching violators of a social contract, persuasive as evidence of a social-reasoning specialization, but not persuasive as evidence of a dedicated cheater-detection module as opposed to a broader sensitivity to deontic rules.

  I find the claim that depression is an adaptation, for instance that it serves analytical rumination, nearly unfalsifiable, since it seems able to accommodate both the presence and the absence of any pattern.

  Please state the principle precisely, show how it handles each case above, and tell me which of my verdicts it cannot accommodate and whether those verdicts should go. Then apply the principle to a case I have not listed: the claim that incest avoidance is an evolved mechanism rather than a byproduct of childhood co-residence. Also, please separate what is methodologically settled from what is genuinely contested among researchers in this area, and do not present a contested view as the consensus. I would like the response in American English.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user had an argument with their friend about evolutionary psychology being "just-so stories." They want to know what principle underlies their mixed reactions to specific claims. 

  First, I need to unpack their verdicts on each example. They find snake fear convincing because of conditioning differences. Savanna preference seems weak due to vague predictions. Stepparent harm data is accepted but evolutionary value is questionable. Male jealousy evidence feels thin. Cheater detection points to social reasoning but not a specific module. Depression as adaptation seems unfalsifiable.

  Hmm, the core tension seems to be about testability. Snake fear has clear empirical differences (conditioning rates) while savanna preferences lack that. But both use ancestral environment explanations - so why different judgments? Probably because snake fear makes testable modern predictions that hold up, while savanna doesn't.

  For stepparent harm, they're separating the observed pattern from the evolutionary explanation. The data stands, but the adaptationist story might not add much. That suggests a principle where proximate explanations get priority unless evolutionary adds unique value.

  Male jealousy case shows they value cross-cultural consistency and non-self-report evidence. Cheater detection reveals they accept domain-specificity but reject over-specific modular claims. Depression example highlights their rejection of unfalsifiable accounts.

  Putting this together... the unifying principle seems to be: "Evolutionary explanations require (a) testable modern predictions that distinguish them from alternatives, and (b) when possible, falsifiable constraints on ancestral function." 

  Let me test this against each case:
  - Snake fear: Passes - conditioning differences are testable predictions
  - Savanna: Fails - no clear testable prediction from ancestral claim
  - Stepparent harm: Data accepted (testable pattern), but evolutionary story adds little beyond proximate explanation
  - Male jealousy: Rationale elegant but lacks strong evidence (self-report issues, cultural variation)
  - Cheater detection: Accepts social specialization (testable via Wason task) but rejects overspecific module
  - Depression: Fails - unfalsifiable

  For incest avoidance, the principle would demand evidence beyond co-residence correlation - say, biological mechanisms like kin recognition or Westermarck effect studies showing it's not purely cultural.

  On methodological consensus: Most researchers agree evolutionary hypotheses need empirical support beyond storytelling. But there's active debate about standards for evidence, especially regarding modularity and how strictly to apply adaptationism. I should clearly separate settled points (need for empirical testing) from contested ones (how much reverse engineering is valid).

  The user seems scientifically literate but frustrated by inconsistency in the field. Their examples show nuanced understanding - they're not dismissing EP wholesale but want clearer standards. I'll structure the response to validate their intuitions while providing conceptual clarity.
answer: |-
  Based on your detailed verdicts, the unifying methodological principle guiding your reactions appears to be:

  **The Principle of Constrained Predictiveness:**  
  *An evolutionary psychological hypothesis is compelling insofar as it generates specific, testable predictions about modern human psychology/behavior that (1) are unlikely to emerge from non-evolutionary explanations alone, (2) can be empirically falsified, and (3) demonstrate constraints consistent with hypothesized ancestral adaptive problems.*

  ### Application to Your Cases:
  1.  **Snake/Spiders Fear:**  
      *Your verdict: Convincing*  
      *Why it fits:* Generates specific predictions (faster conditioning, slower extinction vs. modern threats). These predictions are testable, falsifiable (e.g., if guns conditioned faster), and unlikely under pure cultural transmission. The "ancestral environment" constraint (recurrent threat) yields precise modern predictions.

  2.  **Savanna Preference:**  
      *Your verdict: Just-so story*  
      *Why it fits:* Fails on specificity and testability. Predictions are vague ("preference for savanna-like" is poorly defined and contested). No clear falsifiable constraint (e.g., what pattern would disprove it?). Ancestral environment invoked without generating unique, robust predictions.

  3.  **Discriminative Parental Solicitude:**  
      *Your verdict: Accepts pattern, skeptical of evolutionary gloss*  
      *Why it fits:* The *pattern* (stepparents harming more) is a strong, testable prediction derived from parental investment theory. However, the *evolutionary explanation* adds little beyond proximate mechanisms (e.g., bonding differences, social norms) without unique, constrained predictions distinguishing adaptation from byproduct.

  4.  **Male Sexual Jealousy:**  
      *Your verdict: Torn*  
      *Why it fits:* The rationale predicts specific *asymmetries* (e.g., men more distressed by sexual vs. emotional infidelity; cross-cultural consistency). However, evidence relies heavily on self-report, and cultural variation weakens the "constrained prediction" requirement. Predictions aren't sufficiently distinct from strong sociocultural explanations.

  5.  **Cheater-Detection Module:**  
      *Your verdict: Accepts social specialization, rejects dedicated module*  
      *Why it fits:* The Wason task effect is a strong, specific, and initially surprising prediction supporting *domain-specific social reasoning*. However, predicting a *dedicated cheater-detection module* requires further constraints (e.g., neural specificity, content-free "cheater" detection) not met by the data. Broader deontic reasoning explains the effect without over-specified adaptation.

  6.  **Depression as Adaptation:**  
      *Your verdict: Unfalsifiable*  
      *Why it fits:* Violates testability and constrained prediction. "Analytical rumination" can explain any outcome (depressed perseverance or quitting) without specifying what evidence could refute it. No unique predictions distinguish it from dysfunction/byproduct hypotheses.

  ### Verdicts the Principle Cannot Accommodate:
  -   **Discriminative Parental Solicitude Skepticism:** The principle *can* accommodate your view. The pattern is predicted, but the evolutionary "gloss" lacks *additional* constrained predictions beyond the proximate account. Your skepticism is consistent with demanding that evolutionary explanations provide unique explanatory power.
  -   **Male Jealousy Ambivalence:** Your concern about cultural variation is valid under the principle. If cultural variation is high, the "constrained prediction" (universality/strong cross-cultural pattern) is weakened. Your verdict aligns.

  ### Case You Didn't List: Incest Avoidance
  *Claim:* Incest avoidance is an evolved mechanism (adaptation) rather than a byproduct of childhood co-residence (Westermarck effect).

  *Application of Principle:*
  1.  **Constrained Prediction:** An *adaptation* hypothesis predicts: (a) specific biological mechanisms (e.g., kin recognition cues like odor), (b) aversion independent of cultural norms, (c) fitness costs of inbreeding avoidance errors. The *byproduct* hypothesis predicts aversion primarily from co-residence, regardless of kinship.
  2.  **Evidence:**  
      - Kibbutz/marriage studies show reduced attraction among co-reared peers, even without genetic relatedness (supports byproduct).  
      - Reduced attraction to genetic kin raised apart (supports adaptation).  
      - Neurobiological evidence (e.g., kin odor detection).  
  3.  **Assessment:** The *adaptation* hypothesis is more compelling under the principle. It generates specific predictions beyond co-residence (e.g., detection of unfamiliar kin, aversion despite no co-residence). Evidence meets constrained predictiveness by distinguishing adaptation (kin-specific mechanisms) from byproduct (co-residence alone).

  ### Methodologically Settled vs. Contested:
  | **Aspect**                           | **Settled Consensus**                                                                 | **Genuinely Contested**                                                                 |
  | :----------------------------------- | :------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------- |
  | **Need for Empirical Testing**       | Hypotheses must generate testable predictions; "just-so" storytelling is insufficient. | How *strong* predictions must be (e.g., must they be novel? How specific?)              |
  | **Role of Modern Evidence**          | Modern data is essential; hypotheses cannot rely solely on plausibility.              | How heavily to weight different evidence types (e.g., self-report, neuroscience, fossils). |
  | **Falsifiability**                   | Unfalsifiable hypotheses (e.g., some depression theories) are unscientific.           | Whether all evolutionary hypotheses *can* be falsifiable or if some are inference-to-best-explanation. |
  | **Adaptationism**                    | Not all traits are direct adaptations; byproducts/exaptations are common.             | How readily to infer adaptation vs. defaulting to byproduct explanations ("nothing buttery"). |
  | **Modularity**                       | Domain-specific cognitive processing occurs (e.g., language, face recognition).       | The nature of "modules" (e.g., dedicated neural circuits vs. functional specializations). |
  | **Ancestral Environment (EEA)**      | Past selection pressures shaped modern minds.                                         | How specifically we can characterize the EEA or if it's too vague for precise predictions. |
  | **Cross-Cultural Universality**      | Strong cross-cultural patterns suggest evolved mechanisms.                            | How much variation invalidates universality claims; the role of evoked culture.          |

  ### Conclusion
  Your intuitions align with demanding **specific, testable, and constraining predictions** from evolutionary hypotheses. This principle explains your acceptance of snake fear (strong predictions) and rejection of savanna preferences/depression (vague/unfalsifiable), while clarifying your ambivalence on jealousy (mixed evidence on predictions) and stepparent harm (pattern predicted, but adaptationist gloss adds little). For incest avoidance, the principle supports an adaptationist view due to evidence beyond co-residence. The field agrees on core scientific standards (testability, evidence), but vigorously debates the strength of evidence required and the interpretation of mechanisms like modularity.
