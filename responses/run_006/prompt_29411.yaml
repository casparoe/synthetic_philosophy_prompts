      - If all submit \( k > 0 \) (e.g., \( k = 1 \)), total entries from others are \( T = (n-1)k \). The correct best-response is to submit \( x \to \infty \) (unbounded), not \( x = k \), as \( \frac{1{,}000{,}000x}{x + (n-1)k} \to 1{,}000{,}000 \) when \( x \to \infty \), exceeding the \( \frac{1{,}000{,}000}{n} \) from symmetry.  
      - Thus, deterministic \( k > 0 \) cannot be stable: any player profits by submitting more.  
    - The student also fails to recognize that superrationality (universal symmetry) requires \( x = T \) for all players, implying \( x = (n-1)x \), which forces \( x = 0 \) for \( n > 2 \)—but \( x > 0 \) is required. Hence, no symmetric pure-strategy equilibrium exists.  
    - **Partial credit (0.5) for noting instability**, but the argument is reversed (claims stability when deviation is profitable).  

