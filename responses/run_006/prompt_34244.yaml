prompt: |-
  Something I've been turning over: in an NFL game that goes to overtime, they decide who gets the ball with a coin toss, and everyone treats the coin as fair—before it's flipped, both captains should regard heads as exactly 50/50. But the coin's flight is just deterministic physics; someone with a complete description of the initial conditions and the forces on it could know the outcome in advance. So what is the "chance" that this practice presupposes? I want you to reconstruct the implicit theory of objective chance that the practice of deferring to a fair coin commits us to. I'm thinking of the Principal Principle, the idea that your credence should match the objective chance once you've conditionalized on admissible evidence—but I want you to push on what the practice strictly presupposes versus what it merely fits. Is the chance a property of the coin, of our information, or of some level of description? Does the practice need chances to be objective in a robust sense, or would a purely epistemic reading—chance as everyone's shared ignorance—do the same work? And what would have to change if we replaced the presupposed view with a flatly deterministic one where the only chances are subjective credences: would the coin toss become a sham, or just a ritual? Also, what should count as inadmissible information about a coin toss, and would the practice survive if one captain had a slow-motion feed of the flip and the other didn't? Don't format the answer—no headings, bullets, bold, or tables, just continuous prose like an email. And no citations or reading lists; reason it out from the concepts.
reasoning: |-
  Okay, the user is really digging into a classic philosophical puzzle about coin tosses in the NFL. They're wrestling with how we can call a coin "fair" with 50/50 odds when physics says the outcome is predetermined. 

  First, I need to unpack their core tension: the ritual relies on treating chance as objective, but determinism says it's not. They're hinting at David Lewis's Principal Principle too - that idea where rational belief should match objective chance. Smart framing.

  Hmm... what's the practice actually requiring? Not metaphysical chance, I think. It just needs unpredictability and symmetry. The coin's material properties (balanced weight) create stable probabilities over many flips, and the flipping method scrambles initial conditions. That's enough for the ritual to function. 

  The user asks if "shared ignorance" would suffice. Yeah, absolutely. The captains don't need cosmic randomness - they just need equal inability to predict. That's why the slow-motion camera example is juicy: if one captain sees the spin in slow-mo, that breaks the symmetry of ignorance. Suddenly it's not fair anymore. 

  Ah! That reveals the ritual's real foundation: equal information. The coin itself is just a tool to generate uncertainty symmetry. Determinism doesn't ruin this, as long as both sides are equally in the dark. 

  But if we admitted the toss was predetermined? The ritual would feel hollow. Not because it stops working mechanically, but because the illusion of cosmic fairness shatters. We want to believe the football gods are impartial. 

  Final thought: the "chance" here is emergent. It's a property of the coin-flipping system when you ignore micro-details. Like thermodynamics arising from particles. The practice doesn't need deeper metaphysics - just reliable surface-level unpredictability.
answer: |-
  The practice of using a coin toss presupposes a specific, pragmatic notion of objective chance—one that isn’t undermined by determinism but relies on *epistemic inaccessibility* and *physical symmetry*. Here’s how it holds together:  

  The "50/50 chance" isn’t a fundamental property of the coin’s physics but a *robust pattern* emerging from the coin’s design and the tossing process. A "fair" coin is symmetric in weight and shape, and the toss—a high-energy spin with chaotic dynamics—amplifies tiny, imperceptible variations in initial conditions (finger flick, air currents) into macroscopic outcomes. Determinism doesn’t negate this; it enables it. The outcome is fixed at launch, but the system is *sensitively dependent* on inputs humans can’t control or measure precisely. Thus, the chance is objective in the sense that it’s a *stable disposition* of the setup: over many tosses, heads and tails each occur about half the time, regardless of who flips it.  

  The Principal Principle fits here, but with a twist. Rational credence (50% heads) aligns not with cosmic indeterminism but with this *physical-statistical regularity*. "Admissible evidence" is information that doesn’t shortcut the system’s designed unpredictability. For example:  
  - **Inadmissible**: A slow-motion camera capturing spin rate and initial orientation, allowing a physicist to compute the outcome before the coin lands.  
  - **Admissible**: Past toss records (irrelevant to *this* flip) or knowledge of the coin’s symmetry.  

  If one captain had that slow-motion feed while the other didn’t, the practice would collapse. The toss isn’t just ritual; it’s a *knowledge-symmetrizing device*. Both sides must share equal ignorance for the 50/50 credence to be rational. Unequal information makes the outcome predictable for one party, violating the fairness assumption. The ritual relies on *equal epistemic access*, not metaphysical indeterminism.  

  Now, suppose we openly embraced determinism: "This coin’s outcome is predetermined; we’re just ignorant." Would it become a sham? Not necessarily—but its *symbolic power* would weaken. The toss works because it *feels* like a brute, acausal event, a "mini-lottery" detached from skill or bias. If captains believed the outcome was physically predecided (even if unknowable), the ritual might persist as a tradition but lose its moral weight. We accept it because it *leverages* our ignorance under a veneer of randomness. Without that veneer, it becomes a hollow gesture, like drawing straws when one person knows which is shortest.  

  Ultimately, the practice presupposes:  
  1. **Physical symmetry**: The coin isn’t weighted.  
  2. **Unpredictability by design**: The toss scrambles initial conditions beyond human resolution.  
  3. **Equal information**: No party has privileged data about the flip.  
  4. **Emergent regularity**: The 50/50 distribution holds across repeated trials.  

  Chance here is objective as a *higher-level feature* of the coin-tossing system—a pattern stable across contexts, independent of individual belief. It’s not fundamental physics but a useful fiction grounded in real, measurable statistics and limitations. Replace this with purely subjective credences ("I feel 50/50"), and the ritual loses its authority; it needs an anchor in shared, external reality. The coin’s "fairness" is a social contract built on physics and ignorance—one that holds only as long as no one peeks behind the curtain.
