  Here is my current credence decomposition for imprecise probabilism (IP) as the correct *normative* epistemology of uncertainty, following your precise requirements:

  1.  **Final Credence in IP:** **18%** (P(IP) = 0.18)

  2.  **Decomposition & Justification:**

      *   **(a) Permissivism under Ambiguity:** `P = 0.85`
