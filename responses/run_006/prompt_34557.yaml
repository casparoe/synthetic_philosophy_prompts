  The book makes several claims: 
  1) Turing took ESP evidence seriously as scientific fact
  2) He saw it as creating unfair advantage for humans in the test
  3) He proposed telepathy-shielded rooms as solution
  4) He conceded shielding might fail
  5) He therefore abandoned the test as intelligence criterion

  Hmm, points 1-4 are partially correct but need nuance. Turing did discuss ESP in section "The Argument from Extra-Sensory Perception," but his tone was more skeptical than the book suggests. He presented it as a hypothetical objection others might raise, not his personal belief. The shielded room solution appears there too. 

  But point 5 is clearly wrong - Turing never abandoned the test. In fact, the paper's conclusion restates it as viable. The book seems to confuse Turing's concession about practical shielding difficulties with rejecting the entire framework. 

  The user seems analytically minded - they caught the overstep in the conclusion but want exact verification. They're probably frustrated with histories that oversimplify primary sources. I should emphasize where the book gets the facts right (Turing did discuss ESP/shielding) versus where it overinterprets (the abandonment claim). 

