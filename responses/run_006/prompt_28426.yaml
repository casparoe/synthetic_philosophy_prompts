prompt: |-
  I serve on the disciplinary panel for my state's nursing board. We review cases where a nurse is alleged to have fallen below the standard of care — medication errors, failure to monitor, stuff like that — and we decide on sanctions ranging from a letter of warning up to license revocation. We handle about 40 cases a year, our panel has five members, and we get roughly 45 minutes per case.

  Here's the problem we keep running into, and we have no consistent way of handling it. Two nurses make essentially the same error. Say they both fail to double-check an insulin dose before administering it — same lapse, same departure from protocol. In one case the patient dies. In the other, a colleague catches the error before it reaches the patient, or the patient just happens to tolerate the wrong dose without lasting harm. And our panel splits every time: some members say the outcome has to matter for the sanction, because the nurse whose error killed someone bears a different weight of responsibility than the nurse whose error was caught in time. Others say that's pure moral luck — the sanction should track what the nurse did and could control, not what happened downstream. We've been going case by case with no framework and honestly it's starting to feel kind of arbitrary.

  I've been told the philosophical literature on moral luck has something useful to say here. What I'd like is a decision procedure we can actually run — a sequence of questions we ask about each case, in order, with clear guidance on what counts as a sufficient answer at each step, where the procedure stops and says "this is the outcome-independent sanction," and where it says "now adjust for the outcome, and here's by how much." The procedure has to be something five non-philosophers can get through in 45 minutes. Be honest about which steps are judgment calls dressed up as procedure and where reasonable panel members can still disagree. Flag the kinds of cases the procedure can't handle well.

  Then run the procedure on three cases:

  Case A: Nurse fails to check a patient's allergy bracelet before administering penicillin. The patient has a documented allergy and goes into anaphylactic shock and dies. The nurse's lapse is clear — checking the bracelet is mandatory and takes ten seconds.

  Case B: Nurse fails to check a patient's allergy bracelet before administering penicillin. The patient has no allergy, so nothing happens. The lapse is identical to Case A.

  Case C: Nurse fails to check a patient's allergy bracelet before administering penicillin. The patient has a documented allergy, goes into anaphylactic shock, but is resuscitated by the rapid response team and recovers fully after three days in the ICU.

  I want you to include in the worked examples at least one case where the procedure gives an answer my panel isn't going to like — don't just tell us what we already want to hear.

  End with a single sentence that captures the core principle the procedure operationalizes. Put that sentence as the very last line, enclosed like this: \answer{...}
reasoning: |-
  We are designing a decision procedure for a nursing disciplinary panel that handles cases of professional lapses. The key issue is whether and how to account for the outcome (harm to the patient) when the underlying lapse (the deviation from standard care) is the same.

  The philosophical concept of moral luck (as discussed by philosophers like Bernard Williams and Thomas Nagel) suggests that we often assign different moral blame for the same action based on factors outside the agent's control (like the outcome). However, in professional disciplinary contexts, the primary goal is to protect the public, maintain standards, and deter future errors. This might lead us to focus more on the lapse itself and the nurse's state of mind or recklessness.

  But the panel is split between those who think the outcome matters (because the nurse whose error killed someone bears a different weight of responsibility) and those who think it should not (because it's a matter of luck).

  We need a procedure that:

  1. Is practical for non-philosophers to use in about 45 minutes per case (so it must be step-by-step and not too complex).
  2. Provides clear guidance on when and how to adjust for outcome.
  3. Acknowledges where judgment is required and where disagreement may persist.
  4. Flags cases it cannot handle well.

  Proposed Decision Procedure:

  We break the decision into two main phases:

  **Phase 1: Determine the "Base Sanction" based on the lapse itself and the nurse's culpability, without regard to outcome.**

  Step 1.1: Identify the lapse.
     - What was the standard of care? What specific requirement was violated?
     - How clear and well-established is the requirement? (e.g., is it in the nursing code, hospital policy, basic training?)
     - How easily avoidable was the lapse? (e.g., does it require a simple check that takes seconds, or is it a complex judgment call?)

     *Guidance*: This step is factual. The panel should rely on evidence (policies, training materials, expert testimony). If the requirement is ambiguous or not well-established, that might lower the base sanction. If it's a fundamental, non-negotiable rule (like checking an allergy bracelet), then the base sanction should be higher.

  Step 1.2: Assess the nurse's mental state at the time of the lapse.
     - Was the lapse intentional? (rare in nursing errors, but if so, very serious)
     - Was it reckless? (conscious disregard of a substantial and unjustifiable risk)
     - Was it negligent? (failure to be aware of a risk that a reasonable nurse would have been aware of)
     - Was it a simple mistake with no culpability? (e.g., a slip or lapse in an otherwise diligent nurse under extraordinary circumstances)

     *Guidance*: This step requires judgment. The panel should consider the nurse's training, experience, workload, and any mitigating circumstances (e.g., system failures). The goal is to assign a level of culpability. Use a scale: 
          - Intentional: highest culpability
          - Reckless: high
          - Negligent: moderate (most common in these cases)
          - Non-culpable error: low (but note: even non-culpable errors might require remediation to protect the public)

  Step 1.3: Determine the potential severity of harm that could reasonably be expected from the lapse.
     - What is the worst-case scenario that a reasonable nurse would have foreseen? (e.g., death from anaphylaxis in allergy check failure, or death from a massive overdose in medication error)
     - How likely was that harm? (e.g., if the patient is known to have a severe allergy, the likelihood of severe harm is high; if the medication error is a small overdose, the likelihood of harm might be low)

     *Guidance*: This step is about the risk the nurse took, not the actual outcome. The panel should use a risk matrix: 
          - High severity & high likelihood: high risk
          - High severity & low likelihood: medium risk
          - Low severity & high likelihood: medium risk
          - Low severity & low likelihood: low risk

     *Note*: This step does not consider what actually happened, only what could have happened and how foreseeable it was.

  Step 1.4: Assign a base sanction level based on Steps 1.1-1.3.
     - Use a grid that combines culpability (from Step 1.2) and potential risk (from Step 1.3). For example:

          |                | Low Risk | Medium Risk | High Risk |
          |----------------|----------|-------------|-----------|
          | Non-culpable   | Level 1  | Level 2     | Level 3   |
          | Negligent      | Level 2  | Level 3     | Level 4   |
          | Reckless       | Level 3  | Level 4     | Level 5   |
          | Intentional    | Level 4  | Level 5     | Level 5   |

     Then map the levels to sanctions. For example:
          Level 1: No sanction (but perhaps a recommendation for system improvement)
          Level 2: Letter of warning
          Level 3: Mandatory education, probation
          Level 4: Suspension
          Level 5: Revocation

     *Guidance*: The panel must define these levels and mappings in advance and consistently apply them. This step is a judgment call but structured.

  **Phase 2: Adjust for outcome (actual harm).**

  Step 2.1: Determine if the actual outcome is significantly different from the potential harm assessed in Step 1.3.
     - If the actual harm is much worse than the foreseeable harm, that might warrant an upward adjustment? (But note: this is controversial because it introduces moral luck. We want to avoid punishing for bad luck. However, if the harm was much worse than expected, it might reveal that the nurse's understanding of the risk was inadequate, which could be a separate failure. But that would have been captured in Step 1.3. So we must be cautious.)
     - Alternatively, we might adjust only when the actual harm is less than the potential harm? (This is the core of the moral luck problem.)

     We propose: **Only adjust downward for good outcomes, not upward for bad outcomes.** Why? Because the base sanction already accounts for the potential harm (the risk the nurse took). If the harm occurs, that is the risk materializing. If it doesn't, the nurse was lucky. But we don't want to punish more for bad luck. However, we might want to give some credit for good luck? But note: the panel's goal is public protection, not retribution. Therefore, we argue that the base sanction (which accounts for the risk) should be the main driver, and if the risk didn't materialize, it doesn't change the risk the nurse took. But in practice, the public and the profession might feel that a nurse who caused harm has demonstrated a greater need for intervention.

     However, we are trying to avoid moral luck. Therefore, we propose:

     Step 2.2: Adjust the base sanction only if the actual harm is significantly less than the potential harm. Specifically, if the actual harm is minimal or none, then we may reduce the sanction by one level (but not below the minimum for that culpability and risk category). Why reduce? Because the lack of harm might indicate that the risk was overestimated in Step 1.3? Or because the system caught the error? But note: the risk assessment in Step 1.3 is about what could reasonably have been expected, not what actually happened.

     Alternatively, we might not adjust at all? But then the same base sanction would apply to Case A and Case B.

     We propose a compromise: **Adjust for outcome only in the downward direction and only in cases where the lack of harm was due to an external intervention (like a colleague catching the error) that the nurse could not have reasonably relied upon.** Why? Because if the nurse was lucky because of an external intervention, that does not reduce the risk the nurse took, but it might reduce the need for severe sanction because the harm was averted. However, if the lack of harm was due to pure chance (like the patient not having an allergy), then the risk was still present and the nurse's behavior was equally dangerous.

     Therefore, we break Step 2.1 into two:

     Step 2.1a: Did the actual harm occur?
          - If yes, then no downward adjustment. (But note: we are not increasing for bad outcome because that would be moral luck.)
          - If no, then proceed to Step 2.1b.

     Step 2.1b: Why did no harm occur?
          - Option 1: Because the risk was not present (e.g., the patient didn't have an allergy). This is pure luck. Then no adjustment: the base sanction stands because the nurse took an unjustified risk and got lucky.
          - Option 2: Because an external intervention caught the error (e.g., a colleague noticed and stopped it) and that intervention was not part of the system the nurse could rely upon (i.e., it was an extra layer of safety that isn't always there). Then we may consider a downward adjustment by one level (if the base sanction is Level 2 or above) because the system worked to prevent harm, but the nurse's error was still serious.

          However, if the intervention was part of the standard system (like a double-check that is always required and that was done by someone else) then the nurse might have reasonably relied on it? But note: if the protocol requires the nurse to check the allergy bracelet, then not doing it is a failure even if there is a double-check. So we would not adjust for the double-check because the nurse violated the primary check.

          Therefore, we define: an external intervention that is not part of the standard safety net (i.e., an extraordinary event) leads to a downward adjustment.

     Step 2.2: Adjust the base sanction only in the case of Option 2 in Step 2.1b: reduce by one level (e.g., from Level 3 to Level 2). But note: the base sanction must not fall below the minimum for the culpability and risk category? We don't have that in our grid, so we just reduce by one level.

     Step 2.3: For cases with actual harm, do we ever adjust upward? We propose: **No, because the base sanction already accounts for the potential harm, and the actual harm is the realization of that risk. Increasing the sanction for the outcome would be moral luck.** However, if the harm reveals that the risk was actually higher than initially thought (e.g., the nurse didn't know the patient was allergic but should have, and the harm shows that the risk was high) then that should have been captured in Step 1.3. So we don't adjust upward.

     But note: the panel might feel that causing harm requires a stronger response to maintain public trust. We acknowledge this is a tension. We are designing a procedure to avoid arbitrariness, so we stick to no upward adjustment.

  **Summary of the Procedure:**

  1. Phase 1: Base Sanction
     1.1: Identify the lapse (factual)
     1.2: Assess mental state (judgment: intentional, reckless, negligent, non-culpable)
     1.3: Assess potential risk (judgment: severity and likelihood -> low, medium, high risk)
     1.4: Assign base sanction level (1-5) via grid.

  2. Phase 2: Adjust for Outcome
     2.1a: Did actual harm occur? 
          - If yes: no adjustment.
          - If no: go to 2.1b.
     2.1b: Why no harm?
          - If due to pure luck (risk not present): no adjustment.
          - If due to external intervention (that is not part of the standard safety net): then adjust downward by one level (if base level is 2 or above).
     2.2: Apply adjustment.

  **Where judgment is required and disagreement may occur:**
     - Step 1.2: Assigning mental state (e.g., was it reckless or just negligent?).
     - Step 1.3: Assessing potential risk (what's the worst-case scenario and how likely?).
     - Step 2.1b: Determining if an intervention is part of the standard safety net or extraordinary.

  **Cases the procedure can't handle well:**
     - Cases where the actual harm is due to factors beyond the lapse (e.g., the patient had an unknown condition that made the harm worse) - we are not adjusting for harm, so it might be okay.
     - Cases where the nurse's mental state is very hard to discern.
     - Cases with multiple lapses or complex system factors.

  **Worked Examples:**

  *Case A: Nurse fails to check allergy bracelet, patient dies.*
     Step 1.1: Lapse is clear: mandatory check, takes seconds. (Fact: high clarity)
     Step 1.2: Mental state: negligent (assuming no evidence of recklessness or intent). (Judgment: negligent)
     Step 1.3: Potential risk: high severity (death) and high likelihood (if patient has a documented allergy, then if you give the drug, anaphylaxis is likely). So high risk.
     Step 1.4: Base sanction: negligent & high risk -> Level 4 (suspension).
     Step 2.1a: Actual harm occurred (death) -> no adjustment.
     Sanction: Level 4 (suspension).

  *Case B: Nurse fails to check allergy bracelet, but patient has no allergy, so no harm.*
     Step 1.1: Same as A: high clarity.
     Step 1.2: Same: negligent.
     Step 1.3: Same: high risk (because the nurse didn't know the patient had no allergy, so the potential risk was high severity and high likelihood for a patient with an allergy). So high risk.
     Step 1.4: Base sanction: Level 4 (suspension).
     Step 2.1a: No harm -> go to 2.1b.
     Step 2.1b: Why no harm? Because the risk was not present (patient had no allergy) -> pure luck. No adjustment.
     Sanction: Level 4 (suspension).

  *This result may be unpopular with some panel members who feel that no harm should lead to a lesser sanction. But the procedure says the risk was the same, so the base sanction is the same. The procedure is outcome-independent in this regard.*

  *Case C: Nurse fails to check allergy bracelet, patient has allergy, anaphylaxis, but resuscitated and recovers fully.*
     Step 1.1: Same: high clarity.
     Step 1.2: Same: negligent.
     Step 1.3: Same: high risk.
     Step 1.4: Base sanction: Level 4 (suspension).
     Step 2.1a: Harm occurred (anaphylactic shock, ICU stay) -> no adjustment? But note: the harm was not death. However, our base sanction already accounted for the potential harm (death) and we are not adjusting upward for the outcome. Also, we are not adjusting downward because harm did occur. But wait: in Step 2.1a we only check if harm occurred. It did, so no adjustment. So sanction: Level 4.

     *But note: the harm in Case C is less than in Case A (death vs. full recovery). However, our potential risk in Step 1.3 was death (the worst-case). The actual harm was severe but not the worst-case. We do not adjust for that because we do not adjust upward for bad outcomes (so Case A is not higher than Case C) and we do not adjust downward for less harm? Our procedure currently doesn't account for the degree of harm. We only have a binary: harm or no harm. And we only adjust downward in the case of no harm due to external intervention. In Case C, harm occurred (even though the patient recovered) so no downward adjustment.

     *This might be controversial because the outcome was less severe. But the procedure does not adjust for the degree of harm to avoid moral luck. So we treat Case A and Case C the same? But in Case C, the harm was temporary and the patient recovered. However, the risk of death was present and materialized to a degree (anaphylactic shock can be fatal). The rapid response team's success was an external intervention that reduced the harm. But note: the rapid response team is part of the standard safety net. So we wouldn't adjust downward for that? Because Step 2.1b only applies when there is *no harm*. In Case C, there was harm.

     So by the procedure, Case C gets Level 4.

     *But some panel members might argue that the outcome in Case C is less severe and that should matter. However, the procedure does not allow for that because it avoids moral luck. We must be consistent.*

     Alternatively, we might adjust Step 1.3 to account for the actual harm? But that would break our principle. We are trying to avoid outcome dependence.

     We must stick to the procedure as designed.

  **An Unpopular Result:**

  The procedure gives the same base sanction (Level 4) for Cases A, B, and C. This is because:

  - The lapse and the potential risk are identical in all three.
  - The mental state is the same (negligent).
  - The outcome does not lead to an upward adjustment (we avoid punishing more for bad luck) and in Case B (no harm due to pure luck) we do not adjust downward. Only if the no harm was due to an external intervention (like a colleague catching it) would we adjust downward by one level. But in Case B, it was pure luck (no allergy) and in Case C, harm occurred so no downward adjustment.

  Therefore, the panel might not like that the nurse in Case B (no harm) gets the same sanction as the nurse in Case A (death). But the procedure is designed to focus on the risk taken, not the outcome.

  **Core Principle:**

  The core principle is that sanctions should be based on the nurse's culpable lapse and the foreseeable risk it created, not on the actual outcome which is subject to luck.

  \answer{Sanctions should reflect the risk taken by the nurse, not the arbitrary outcome.}
answer: |-
  Below is a practical decision procedure designed for your disciplinary panel. It balances philosophical insights on moral luck with the practical demands of nursing regulation (public protection, deterrence, and accountability). The procedure avoids outcome-based adjustments where possible but allows limited, structured exceptions to account for harm prevention mechanisms. It is structured as a flowchart with yes/no questions and clear thresholds, aiming for efficiency (under 15 minutes per case). Judgment calls are explicitly flagged, and disagreements are expected at those points.

  ---

  ### **Nursing Disciplinary Decision Procedure**  
  *Purpose: Assign sanctions based on culpability and risk, not outcomes—except where harm prevention justifies mitigation.*  

  #### **Phase 1: Determine Base Sanction (Outcome-Independent)**  
  *Focuses solely on the nurse’s actions and the inherent risk of the lapse.*  

  1. **Step 1.1: Was the violated standard unambiguous and fundamental?**  
     - *Guidance:* Check if the rule is explicitly stated in board guidelines, hospital policy, or core nursing education (e.g., checking allergy bracelets). Must be a "non-negotiable" standard.  
     - **Yes →** Proceed to Step 1.2.  
     - **No →** Reduce base sanction severity by one level (e.g., revocation becomes suspension). *Judgment call: Panel must agree on ambiguity.*  

  2. **Step 1.2: What was the nurse’s mental state?**  
     - *Guidance:* Choose one:  
       - **Intentional:** Willful violation (rare; e.g., ignoring a rule out of laziness or malice).  
       - **Reckless:** Conscious disregard of substantial risk (e.g., skipping a check due to distractions they created).  
       - **Negligent:** Unintentional but avoidable lapse (e.g., rushing and forgetting).  
       - **Non-Culpable:** Unavoidable given circumstances (e.g., system error beyond their control).  
     - *Judgment call: Use witness statements, workload logs, and prior record.*  

  3. **Step 1.3: What was the foreseeable worst-case harm?**  
     - *Guidance:* Ignore actual outcome. Assess:  
       - **Severity:** Death/permanent injury = high; temporary harm = medium; minor/none = low.  
       - **Likelihood:** High (e.g., known allergy), Medium (e.g., unclear allergy history), Low (e.g., low-risk medication).  
     - **Risk Level:**  
       |                | High Severity | Medium Severity | Low Severity |  
       |----------------|---------------|-----------------|--------------|  
       | **High Likelihood** | High Risk     | High Risk       | Medium Risk  |  
       | **Medium Likelihood**| High Risk     | Medium Risk     | Low Risk     |  
       | **Low Likelihood**  | Medium Risk   | Low Risk        | Low Risk     |  

  4. **Step 1.4: Assign Base Sanction Level**  
     - Use this grid (combine Steps 1.2 and 1.3):  
       | Mental State   | High Risk | Medium Risk | Low Risk |  
       |----------------|-----------|-------------|----------|  
       | Intentional    | Level 5   | Level 5     | Level 4  |  
       | Reckless       | Level 5   | Level 4     | Level 3  |  
       | Negligent      | Level 4   | Level 3     | Level 2  |  
       | Non-Culpable   | Level 3   | Level 2     | Level 1  |  
     - **Sanction Levels:**  
       - Level 5: Revocation  
       - Level 4: Suspension + Remediation  
       - Level 3: Probation + Mandatory Training  
       - Level 2: Letter of Warning  
       - Level 1: No Sanction (documented guidance only)  

  #### **Phase 2: Adjust for Outcome (Limited Circumstances)**  
  *Adjustments only for harm prevention, not harm occurrence. Never increase sanctions for worse outcomes.*  

  5. **Step 2.1: Did the actual harm match or exceed foreseeable worst-case harm?**  
     - **Yes →** No adjustment. Base sanction is final.  
     - **No →** Proceed to Step 2.2.  

  6. **Step 2.2: Was harm prevented solely by an external intervention?**  
     - *Guidance:* "External intervention" = action by another person or system *unrelated* to the nurse’s duties (e.g., colleague catching error). Does **not** include patient resilience, luck, or routine safeguards (e.g., built-in EHR alerts).  
     - **Yes →** Reduce sanction by one level (e.g., Level 4 → Level 3).  
     - **No →** No adjustment. Base sanction is final.  
     - *Judgment call: Panel must agree if intervention was "external" and non-routine.*  

  #### **Procedure Limits**  
  - **Time:** Designed for 10–15 minutes per case after evidence review.  
  - **Judgment Calls:** Steps 1.2 (mental state), 1.3 (risk), and 2.2 (external intervention) may spark disagreement. Document reasons.  
  - **Can’t Handle Well:**  
    - Systemic issues (e.g., hospital understaffing causing errors).  
    - Multiple overlapping lapses.  
    - Cases where harm is indirect or delayed.  

  ---

  ### **Worked Examples**  
  *Using the procedure on your cases. Assumptions: All nurses were negligent (Step 1.2), violation was unambiguous (Step 1.1: yes), and foreseeable harm was high risk (death, high likelihood). Base sanction for all: Level 4 (Suspension + Remediation).*  

  #### **Case A: Death**  
  - **Step 1.1:** Yes (checking bracelet is fundamental).  
  - **Step 1.2:** Negligent (rushed, no intent).  
  - **Step 1.3:** High risk (death likely with allergy).  
  - **Base Sanction:** Level 4 (Suspension + Remediation).  
  - **Step 2.1:** Actual harm (death) matched worst-case → **No adjustment**.  
  - **Final Sanction:** Level 4 (Suspension + Remediation).  

  #### **Case B: No Harm (No Allergy)**  
  - **Step 1.1:** Yes.  
  - **Step 1.2:** Negligent.  
  - **Step 1.3:** High risk (nurse couldn’t know no allergy).  
  - **Base Sanction:** Level 4 (Suspension + Remediation).  
  - **Step 2.1:** Actual harm (none) did not match worst-case (death) → Proceed to Step 2.2.  
  - **Step 2.2:** Harm prevented by luck (no allergy), **not** external intervention → **No adjustment**.  
  - **Final Sanction:** Level 4 (Suspension + Remediation).  
  - ***Unpopular Aspect:*** Identical to Case A. Panel may resist punishing a nurse who caused no harm, but the procedure holds that the risk taken was identical. Moral luck is rejected.*  

  #### **Case C: Harm with Full Recovery**  
  - **Step 1.1:** Yes.  
  - **Step 1.2:** Negligent.  
  - **Step 1.3:** High risk.  
  - **Base Sanction:** Level 4 (Suspension + Remediation).  
  - **Step 2.1:** Actual harm (reversible anaphylaxis) was less than worst-case (death) → Proceed to Step 2.2.  
  - **Step 2.2:** Harm reduced by rapid response team—external intervention? *Judgment call:* If the team is a routine hospital safeguard, **no adjustment**. If their intervention was extraordinary (e.g., they were not scheduled but intervened by chance), **reduce to Level 3** (Probation + Training).  
  - **Final Sanction:**  
    - *Routine safeguard:* Level 4 (Suspension + Remediation).  
    - *Extraordinary intervention:* Level 3 (Probation + Training).  
  - ***Note:*** Even with reduction, sanction is stricter than some panelists may want for a non-fatal case. The procedure prioritizes risk over outcome severity.  

  ---

  ### **Key Takeaway**  
  The procedure forces consistency by decoupling sanctions from outcomes—except to credit external harm prevention. It will feel unfair in cases like B (no harm) because it rejects moral luck, but this ensures nurses are disciplined for the risks they take, not luck.  

  \answer{Sanctions should reflect the foreseeable risk created by the nurse's lapse, not the arbitrary outcomes of chance.}
