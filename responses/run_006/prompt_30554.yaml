  First, I need to recall the major historical examples both realists and anti-realists use. Phlogiston, caloric, ether, Fresnel's ether for anti-realists. For realists, it's things like general relativity's light bending or atomic theory. Each case tests different aspects—referential failure, structural continuity, predictive novelty. 

