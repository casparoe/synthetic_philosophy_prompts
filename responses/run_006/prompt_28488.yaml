  Below is a decision tree designed to guide graduate students through concrete cases to a named position on the lottery and preface paradoxes. Each node presents a scenario with a binary choice, isolating theoretical joints without presupposing abstract principles. The tree has **10 branching nodes** and **9 distinct leaves** (including unoccupied positions), satisfying the requirements.

  ---

  ### **Node 1: The 10,000-Ticket Lottery**  
  *Scenario*: A fair lottery has 10,000 tickets and exactly one winner. You hold one ticket. The prize is modest (e.g., $100). **Can a rational person believe their ticket will lose?**  
  - **Yes** → Node 2  
  - **No** → Node 8  

  ---

  ### **Node 2: The 3-Ticket Lottery**  
  *Scenario*: A fair lottery has 3 tickets and one winner. You hold one ticket. The prize is modest. **Can a rational person believe their ticket will lose?**  
  - **Yes** → Node 3  
  - **No** → Node 4  

  ---

  ### **Node 3: The 2-Ticket Lottery**  
  *Scenario*: A fair lottery has 2 tickets and one winner. You hold one ticket. The prize is modest. **Can a rational person believe their ticket will lose?**  
  - **Yes** → **Leaf: Unoccupied**  
  - **No** → Node 5  
    *Diagnosis*: Permitting belief at 50% probability is unattractive (no better than guessing). Unoccupied due to disconnect from truth-tracking.  

  ---

  ### **Node 4: The 100-Ticket Lottery**  
  *Scenario*: A fair lottery has 100 tickets and one winner. You hold one ticket. The prize is modest. **Can a rational person believe their ticket will lose?**  
  - **Yes** → Node 5  
  - **No** → Node 6  

  ---

  ### **Node 5: High-Stakes Lottery (Child’s Life)**  
  *Scenario*: The lottery has 10,000 tickets. If you win, you save your dying child; if you lose, nothing changes. You consider discarding the ticket. **Can a rational person believe their ticket will lose?**  
  - **Yes** → Node 7  
  - **No** → **Leaf: Pragmatic Encroachment**  
    *Position*: Rational belief depends on practical stakes. High stakes raise the evidential threshold.  

  ---

  ### **Node 6: The Trillion-Ticket Lottery**  
  *Scenario*: A fair lottery has a trillion (10¹²) tickets and one winner. You hold one ticket. The prize is modest. **Can a rational person believe their ticket will lose?**  
  - **Yes** → Node 5  
  - **No** → **Leaf: Denial of High Probability Suffices**  
    *Position*: High probability ≠ rational belief. Certainty (or knowledge) is required.  

  ---

  ### **Node 7: Conjunction of 100 Independent Lotteries**  
  *Scenario*: You hold one ticket in each of 100 independent lotteries (each with 10,000 tickets, one winner). You believe each ticket will lose. **Can you rationally believe all 100 tickets will lose?**  
  - **Yes** → Node 9  
  - **No** → **Leaf: Denial of Closure Under Conjunction**  
    *Position*: Rational belief in each proposition does not entail belief in their conjunction.  

  ---

  ### **Node 8: Trillion-Ticket Lottery (Low Stakes)**  
  *Scenario*: A fair lottery has a trillion tickets and one winner. You hold one ticket. The prize is modest. **Can a rational person believe their ticket will lose?**  
