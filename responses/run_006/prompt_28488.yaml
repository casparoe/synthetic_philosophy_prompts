  ### **Design Notes**  
  - **Distinguishing Contextualism & Pragmatic Encroachment**: Node 11 isolates contextualism (ascriber-dependent standards) from Node 5/Node 10’s pragmatic encroachment (subject-dependent stakes).  
  - **Preface Paradox Treatment**: The tree implicitly addresses the preface through closure denial (Nodes 7/12). A direct preface vignette is omitted to avoid redundancy, as closure denial resolves both paradoxes similarly.  
