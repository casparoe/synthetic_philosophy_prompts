prompt: |-
  I'm teaching an upper-level undergrad seminar on rational choice and the foundations of game theory — about 18 students, mostly philosophy and econ majors, one 75-minute session. We've done Nash equilibrium and dominance reasoning, and now I want to spend a session on the idea that standard game theory assumes each player treats the others' strategies as fixed and independent of their own reasoning. I want to introduce superrationality — the idea that when you know all the players are copies of each other in terms of reasoning power and information, you should ask "what strategy would be best if we all independently converge on the same reasoning?" — and I want them to actually feel the force of the problem, not just hear about it.

  The source material is Douglas Hofstadter's Platonia dilemma and the Luring Lottery. (In the Platonia dilemma, 20 people are told that if exactly one sends a telegram by noon next day, that person gets a billion dollars; if zero or more than one send, no one gets anything. No communication. The superrational prescription is to send with probability 1/20. In the Luring Lottery, readers of Scientific American in the 1980s were actually invited to send in postcards with a number of entries; the prize was $1M divided by total entries, awarded to a random entry, so you could game it by sending a huge number. The superrational prescription was to roll a die with sides equal to the number of expected responders and send "1" only on a roll of 1. In practice, people sent googolplexes and the whole thing became a joke.)

  So here's what I want: design a classroom activity (or pair of linked activities) that makes the students wrestle with the core tension before they get the vocabulary. I want them to discover for themselves that standard individual rationality gives terrible advice when everyone is reasoning symmetrically, and then I want them to try to invent something like superrationality on their own. Ideally the activity would have a payoff structure that doesn't require real money — maybe points toward a grade or some kind of token that matters only within the class. The debrief should map what they did onto the formal difference between strategic reasoning (I treat you as an independent agent) and superrational reasoning (we are instances of the same decision procedure), and should be honest about what the activity can't capture — e.g., the real Luring Lottery involved thousands of strangers, not a seminar room of people who know each other. Also tell me what predictably goes wrong. I've never run anything like this before and I'm a little nervous about it devolving into chaos.
reasoning: |-
  We are going to design an in-class activity that mirrors the Platonia dilemma and the Luring Lottery, but adapted for a classroom setting. The goal is to have students experience the tension between individual rationality and symmetric reasoning without prior knowledge of superrationality.

  **Activity 1: The "Classroom Telegram" (Inspired by Platonia Dilemma)**

  **Setup:**
  - Tell the class that we are going to play a game with real consequences (within the class). 
  - The rules: Each student must decide independently whether to "send a telegram" (by writing their name on a slip of paper and handing it in) or not. 
  - The winning condition: If exactly one student sends in their name, that student wins a prize (e.g., 5 extra credit points). If zero or more than one send, no one wins anything. 
  - Emphasize that this is a one-shot game: no communication, and they must decide without knowing what others are doing.

  **Implementation:**
  1. Distribute slips of paper to each student. They should write their name and circle either "SEND" or "DON'T SEND". 
  2. Collect the slips in a box without looking at them until all are collected. 
  3. Count the submissions and announce the result.

  **Expected Outcome:**
  - In a class of 18, the probability that exactly one person sends is very low if everyone acts independently and rationally. 
  - Why? Each student might think: "If I send, I win only if no one else sends. But if I don't send, I might win if exactly one other person sends? Actually, no: if I don't send, I can't win. So I must send to have a chance. But then, if everyone thinks that way, everyone sends and we all lose." 
  - Alternatively, some might think: "I won't send because probably someone else will." But then if everyone does that, no one sends and no one wins.
  - The Nash equilibrium (in mixed strategies) is for each to send with probability p such that the probability of exactly one sending is maximized? Actually, the symmetric mixed strategy equilibrium would have each sending with probability p, and the condition for equilibrium is that each player is indifferent between sending and not sending. However, for a large n, p is very small. But in a classroom, without prior theory, they are unlikely to hit upon the symmetric mixed strategy. 
  - What predictably goes wrong: 
    - Too many students send (because each thinks they might be the only one) and then more than one sends -> no winner.
    - Or, no one sends (if they all think that someone else will) -> no winner.

  **Debrief for Activity 1:**
  - Ask the students: Why did we get the result we did? 
  - Guide the discussion to bring out the conflict: each person, acting rationally in their own interest, leads to a bad outcome for all. 
  - Highlight the symmetry: everyone is in the same situation. What if we all could agree on a plan? But we can't communicate.

  **Transition:**
  - Now, present a second activity that is a variation on the Luring Lottery.

  **Activity 2: The "Classroom Lottery" (Inspired by Luring Lottery)**

  **Setup:**
  - Tell the class we are going to play a lottery. 
  - Each student can choose to submit any integer number of "tickets" (entries) from 0 to a very high number (say, 0 to 100). 
  - The prize: 100 extra credit points (or some other attractive reward that the whole class can appreciate, but note that we don't want to bankrupt the grade system; perhaps it's 100 points to be divided by the total number of tickets and then awarded to one ticket, so the expected value per ticket is the same for all). 
  - Specifically: 
    - The total prize is 100 points. 
    - The winner is chosen at random from all the tickets submitted. 
    - But note: the prize is divided equally among the total number of tickets? Actually, in the original Luring Lottery, the prize was $1M divided by the total number of entries, and then awarded to one random entry. So the expected value for each ticket is (1M / total_tickets) * (1/total_tickets) ??? 

  Wait, let me clarify: 
    - Suppose there are N total tickets. 
    - The prize is 1M / N dollars. 
    - One ticket is chosen at random to win that prize. 
    - So the expected value for a single ticket is (1M / N) * (1/N) = 1M / N^2. 
    - But note: if a player submits k tickets, their expected winnings are k * (1M / N^2). 

  Alternatively, we can simplify for the classroom: 
    - We have a fixed prize pool of P (say 100 points). 
    - The prize is P / (total number of tickets) awarded to the winning ticket. 
    - So if a player submits k tickets, their expected winnings is (k / N) * (P / N) = k * P / N^2.

  But note: the total expected winnings for the entire class is P/N, because the prize is P/N and it is awarded to one person. However, the expected value for a player is k * (P / N^2).

  Alternatively, to make it more like the original: the prize is P, but it is divided by the total number of tickets. So the prize per winning ticket is P/N. Then the expected value for a player who submits k tickets is k * (P/N) * (1/N) = k * P / N^2.

  **Implementation:**
  1. Distribute slips of paper. Each student writes their name and the number of tickets they wish to submit (an integer between 0 and 100). 
  2. Collect the slips. 
  3. Calculate the total number of tickets (N). 
  4. Draw one ticket at random (by assigning each ticket a number from 1 to N, then using a random number generator). 
  5. The winner receives (100 / N) extra credit points.

  **Expected Outcome:**
  - Without coordination, students might think: "If I submit a huge number of tickets, I increase my chance of winning, but I also dilute the prize." 
  - However, if everyone submits a large number, then N becomes huge and the prize per winning ticket becomes tiny. 
  - The Nash equilibrium: each player would want to choose a very high number? Actually, the symmetric Nash equilibrium might not exist in pure strategies and in mixed strategies it would be complicated. But intuitively, each player is tempted to submit more than others. 
  - What predictably goes wrong: 
    - Some students might submit very high numbers (like 100) in an attempt to dominate. 
    - If many do that, N becomes huge and the prize becomes negligible. 
    - The winner might get only a fraction of a point, making the entire exercise futile.

  **Debrief for Activity 2:**
  - Compare the two activities: 
    - In the first, the problem was that without coordination, we either get too many or too few submissions. 
    - In the second, the problem is that without coordination, we get an inflation of tickets and the prize becomes worthless. 
  - Now introduce the idea of superrationality: 
    - In both games, we are symmetric: same information, same reasoning. 
    - What if we all reason the same? Then we can assume we all do the same thing. 
    - In Activity 1: if we all use the same mixed strategy, we can set the probability p so that the probability of exactly one sending is maximized. For n players, that p is about 1/n. Then the probability of exactly one sending is n * (1/n) * (1-1/n)^(n-1) ≈ 1/e (about 37%). 
    - In Activity 2: if we all submit the same number k, then N = n*k. The expected payoff for each player is (k * P) / (n*k)^2 = P/(n^2 * k). But note: if we all submit 1, then N = n, and the expected payoff per player is (1 * P) / n^2 = P/n^2. 
      However, if one player deviates and submits k' instead of 1, then N becomes n-1+k', and that player's expected payoff becomes k' * P / (n-1+k')^2. 
      But in the symmetric case, we want to maximize the expected payoff per player? Actually, in the superrational view, we ask: what if we all submit k? Then the expected payoff per player is k * P / (n*k)^2 = P/(n^2 * k). To maximize this, we want k to be as small as possible, so k=1. 
      But then, if we all submit 1, the expected payoff is P/n^2. However, if one player submits 2, then N becomes n+1, and that player's expected payoff becomes 2 * P / (n+1)^2. Compare to when they submitted 1: 1 * P / n^2. Since 2/(n+1)^2 vs 1/n^2, for n>1, 2/(n+1)^2 < 1/n^2? Actually, for n=18: 
          1/n^2 = 1/324 ≈ 0.003086
          2/(19)^2 = 2/361 ≈ 0.00554 -> so it's better to submit 2? 
      Wait, this is confusing. Actually, if everyone else is submitting 1, then the total without me is 17. If I submit k, total becomes 17+k. My expected payoff is k * (100) / (17+k)^2. 
          We can maximize f(k) = 100k / (17+k)^2. 
          f'(k) = 100 [ (17+k)^2 - 2k(17+k) ] / (17+k)^4 = 100 (17+k - 2k) / (17+k)^3 = 100 (17 - k) / (17+k)^3.
          So maximum at k=17? Then f(17)= 100*17/(34)^2 = 1700/1156 ≈ 1.47. 
      But that's for one player deviating. The symmetric superrational solution might be to choose k such that if everyone does the same, the expected payoff is the same for all and no one has an incentive to deviate? Or rather, the idea is to choose k so that the expected payoff per player is maximized? 

      Actually, Hofstadter's solution for the Luring Lottery was: each player should submit 1 with probability 1/n (where n is the expected number of players) and 0 otherwise. But that was in the context of a very large n. 

      Alternatively, the superrational solution for the symmetric case is to submit 1. But then, as we see, it is not stable because an individual can do better by submitting more. 

      So the point of the activity is to show that even if we try to coordinate on a symmetric solution, it might not be an equilibrium.

  **Combined Debrief:**

  1. **The Problem of Symmetry:** In both games, we are symmetric players. Standard game theory (Nash equilibrium) assumes that each player treats the others' actions as fixed and independent. But when we are symmetric and we know we are all using the same reasoning, we might be able to coordinate without communication.

  2. **The Failure of Individual Rationality:** In the first activity, individual rationality leads to over-participation (everyone sends) or under-participation (no one sends). In the second, it leads to a race to the bottom (everyone submits a high number, making the prize worthless).

  3. **Superrationality:** Hofstadter proposed that in symmetric games, we should consider only symmetric strategies and then choose the one that, if everyone does it, yields the best outcome. 
     - In Activity 1: the symmetric strategy is to send with probability 1/20 (for 20 players, but we have 18? so 1/18). Then the probability of exactly one sending is about 37%. 
     - In Activity 2: the symmetric strategy is to submit 1 ticket. Then the expected prize per player is 100/(18^2) ≈ 0.31 points. But note: if everyone does that, then one player wins 100/18 ≈ 5.55 points. On average, each player gets about 0.31 points. 
     - However, is this stable? No, because an individual can do better by submitting more. So superrationality is not an equilibrium concept? Or it is, but only if we assume that all players are constrained to use the same strategy and that they know that others are using the same reasoning.

  4. **Limitations of the Activity:** 
     - In the real world, the Luring Lottery involved thousands of strangers. In our classroom, students know each other and might try to coordinate or have prior beliefs. Also, the class size is small, so the reasoning is different. 
     - The activities might not have captured the full force of the problem because of the small n. 
     - Also, in the classroom, there is a possibility of communication (even non-verbal) which we must try to prevent.

  **Predictable Problems and How to Handle Them:**

  1. **Chaos in Activity 1:** 
     - If too many students send, no one wins. If no one sends, no one wins. This is likely. 
     - How to handle: Use it as a teaching moment. Ask: Why did this happen? What were you thinking? Then guide them to see the conflict.

  2. **Activity 2:**
     - Students might not understand the payoff structure. Explain clearly: 
          "If you are the winner, you get 100 divided by the total number of tickets (including everyone's) as your prize." 
     - Example: If total tickets = 100, then the winner gets 100/100 = 1 point. 
          If total tickets = 200, then the winner gets 100/200 = 0.5 points. 
          But note: the winner is chosen randomly from the tickets. So if you have more tickets, you have a higher chance of winning, but the prize is smaller if there are more tickets. 

  3. **Time Management:** 
     - The activities and debrief might take the whole 75 minutes. 
          Activity 1: 10 minutes (setup, decision, collection, result).
          Activity 2: 15 minutes (because the decision is more complex, and calculation of the prize might take a minute).
          Debrief: 50 minutes? Actually, we might need to adjust. 
     - Alternatively, run both activities and then debrief together. 

  4. **Anonymity:** 
     - In Activity 1, if you announce that there was exactly one sender, then that student gets the prize. But if there is more than one, don't reveal who sent to avoid embarrassment. 
     - In Activity 2, you have to reveal the total and the winner. But the winner might get a very small prize, which might be disappointing. 

  5. **Motivation:** 
     - To make it matter, the prizes should be meaningful. Extra credit points are good, but keep the amounts small enough to be safe (e.g., 1-5 points for Activity 1, and in Activity 2 the prize might be very small, so maybe scale it: set the prize pool to 100 points, but then the winner gets 100/N, which if N is 100, that's 1 point). 

  **Revised Plan for the Session:**

  1. (5 min) Introduce the first activity: explain the rules of the "Classroom Telegram". 
  2. (5 min) Students decide and submit. 
  3. (5 min) Collect and count. Announce the outcome. 
  4. (10 min) Initial discussion: Why did this happen? What were you thinking? 

  5. (5 min) Introduce the second activity: the "Classroom Lottery". Explain the rules carefully. 
  6. (10 min) Students decide and submit (they need to choose a number). 
  7. (5 min) Calculate total tickets (N) and then draw a winner. Announce the winner and the prize (100/N points). 
  8. (30 min) Debrief both activities: 
     - What happened? 
     - Why did we get these outcomes? 
     - What is the problem with individual rationality in these symmetric situations? 
     - How might we solve it? (Let them brainstorm. Hopefully, someone suggests that everyone should do the same thing, and then you can build on that to introduce superrationality.) 
     - Then formally introduce superrationality and Hofstadter's examples. 
     - Discuss the limitations: in the real world, we don't know if others are reasoning the same way. In our classroom, we are a small group and might have prior beliefs. 

  **Backup Plan:**
  - If Activity 1 by chance has exactly one sender, then that student wins. But then you can still discuss: was this due to reasoning or luck? And what would happen if we played again?
  - If Activity 2 results in a reasonable N (like 18-30), then the prize is decent (3.3 to 5.5 points). But if it goes to 100+, then it's negligible. That's okay because it illustrates the problem.

  **Materials:**
  - Slips of paper for both activities. 
  - A box or hat for collection. 
  - Calculator for Activity 2. 
  - Random number generator (could be a die or an online tool) for drawing the winner in Activity 2.

  **Note on Grading:**
  - The extra credit should be small enough not to disrupt the grading curve, but meaningful enough to motivate. 

  By the end, the students should have a visceral understanding of the problem and an appreciation for the superrationality concept, even if it is not without its own issues.
answer: |-
  Below is a structured classroom activity designed to help students discover the limitations of standard strategic reasoning and intuitively grasp superrationality. The activity uses two back-to-back games with symbolic payoffs (no real money needed), followed by a guided debrief linking their experience to Hofstadter’s ideas. Total time: **~70 minutes**.

  ---

  ### **Activity 1: The "Telegram Game" (Platonia-inspired)**  
  **Time:** 20 minutes  
  **Goal:** Experience the failure of individual rationality in symmetric, high-stakes coordination.  

  #### **Setup**  
  - **Rules:**  
    - Each student secretly decides whether to "SEND" or "NOT SEND."  
    - If **exactly one person** sends, that person wins **50 class points** (e.g., redeemable for minor grade bumps or privileges).  
    - If zero or multiple people send, **no one wins anything**.  
  - **Constraints:**  
    - No communication during the game.  
    - Decisions are simultaneous (use paper slips).  
    - Emphasize: "This is a one-shot game. You cannot change your mind."  

  #### **Procedure**  
  1. Distribute blank slips and pens. Students write **"SEND"** or **"NOT SEND"** anonymously.  
  2. Collect slips in a box. Shuffle and count submissions publicly.  
  3. **Reveal the outcome:**  
     - If exactly one sender, award points (e.g., write winner’s ID on the board).  
     - Else, announce: "No winner."  

  #### **Predictable Outcome & Discussion Hooks**  
  - **What goes wrong:**  
    - Most students will send ("If I don’t, I lose my chance!").  
    - Likely outcome: 5–15 send → no winner → frustration.  
    - Some may not send ("Someone else will"), risking zero senders.  
  - **Ask immediately:** *"Why did this happen? What were you thinking?"*  
    - Listen for: Self-interest, pessimism about others, regret.  

  ---

  ### **Activity 2: The "Points Lottery" (Luring Lottery-inspired)**  
  **Time:** 25 minutes  
  **Goal:** Highlight how individual optimization destroys collective value in symmetric games.  

  #### **Setup**  
  - **Rules:**  
    - Each student submits an integer **N ≥ 0** (their "entries").  
    - Total entries = **T** (sum of all N).  
    - **Prize:** 1,000 class points **split equally among all entries**, but **only one entry wins** (e.g., if T=100, each entry gets 10 points, but only one entry wins 10 points total).  
      - *Simplified example:* If Alice submits 2 entries and Bob submits 3:  
        `T = 5` → each entry worth 1,000/5 = 200 points.  
        Random draw: If Alice’s entry wins, she gets 200 points; Bob gets 0.  
  - **Key twist:** Your chance of winning scales with your entries, but more entries dilute the prize.  

  #### **Procedure**  
  1. Distribute paper slips. Students write their **student ID** and **N** (0 to 100 allowed).  
  2. Collect slips, sum all entries (T), and calculate prize per entry: **P = 1,000 / T**.  
  3. Randomly draw one winning entry (use a random number generator for fairness).  
  4. Announce:  
     - **T** and **P** (e.g., "T = 250 → each entry worth 4 points").  
     - Winner and their prize (e.g., "Winner: Student #8 with N=5 → 5 × 4 = 20 points").  

  #### **Predictable Outcome & Discussion Hooks**  
  - **What goes wrong:**  
    - Students submit large N (e.g., 50–100) to maximize their chances.  
    - T becomes huge (e.g., 800+) → P becomes tiny (e.g., 1.25 points).  
    - Winner gets trivial points; most get nothing.  
  - **Ask:** *"Are you happy with the outcome? What strategy did you use?"*  
    - Listen for: "I tried to outsmart others," "I knew it would fail."  

  ---

  ### **Debrief: Connecting to Superrationality**  
  **Time:** 25 minutes  
  **Goal:** Synthesize insights, introduce superrationality, and contrast it with Nash reasoning.  

  #### **Guided Discussion**  
  1. **Recap failures:**  
     - *Telegram Game:* "Why did individual rationality (I optimize given *your* fixed choices) fail?"  
       → Students see: If everyone reasons "I must send," everyone loses.  
     - *Points Lottery:* "Why did selfish optimization backfire?"  
       → Students see: Treating others as independent leads to a "race to the bottom."  

  2. **The symmetry insight:**  
     - Ask: *"Imagine all players are identical clones of you—same info, same reasoning. How would that change your strategy?"*  
       - Telegram: "If we all do the *same* thing, what should it be?"  
         → Hinted solution: Randomize with probability 1/18 (but they may propose taking turns).  
       - Lottery: "If we all submit the *same* N, what N maximizes our *collective* expected payoff?"  
         → Hinted solution: Submit 1 entry each (so T=18 → P=55.5, winner gets 55.5).  

  3. **Introduce superrationality:**  
     - Define: "When players are symmetric (same reasoning, same info), we ask: *What strategy would we all choose if we knew we’d all choose the same one?*"  
     - Map to activities:  
       - Telegram: Hofstadter’s solution → randomize with p=1/n (here, 1/18).  
       - Lottery: Submit 1 entry → if all do it, expected payoff per player is (1,000/n)/n = 1,000/n² (≈3.1 points).  
     - Contrast with Nash:  
       - **Nash (standard):** "I treat your strategy as fixed and independent."  
       - **Superrationality:** "We are symmetric instances of the same decision process → we ‘coordinate’ without communicating."  

  4. **Limitations & realism:**  
     - Stress: This works best in small, symmetric groups (like this class!).  
     - In real life (e.g., Luring Lottery with strangers):  
       - No guarantee others are "superrational."  
       - Asymmetric info or reasoning breaks the magic.  
     - Hofstadter’s Luring Lottery failed because people submitted googolplexes—they *didn’t* assume symmetry.  

  ---

  ### **Logistical Notes**  
  - **Points system:** Use symbolic rewards (e.g., 50 points = +0.1% on final grade; 1,000 points = candy stash). Avoid grade distortions.  
  - **Prevent chaos:**  
    - **Anonymity:** Use student IDs (not names) to reduce peer pressure.  
    - **No communication:** Pause if side-talk starts; remind them "this is a non-cooperative game."  
    - **Tech aid:** Use Google Forms for submissions/random draws to save time.  
  - **If outcomes are "too perfect":**  
    - Telegram: If 0 or 2+ send, highlight the failure. If 1 sends, ask: "Was this skill or luck? Would it work with 100 players?"  
    - Lottery: If T is small, contrast with what *could* have happened ("Imagine if everyone chose N=100!").  
  - **Student reactions:** Expect frustration ("This is unwinnable!"), insightful proposals ("We should roll dice!"), or skepticism ("But I can’t trust others!"). Use these to fuel discussion.  

  ---

  ### **Why This Works**  
  - **Discovery-based:** Students *feel* the tension before learning jargon.  
  - **Contrast:** The two activities show different failures (coordination vs. optimization) of standard game theory.  
  - **Low stakes:** Points are fun but not stressful; focus remains on concepts.  
  - **Honest debrief:** Explicitly addresses real-world limitations (e.g., strangers vs. classmates).  

  This plan transforms abstract theory into a visceral lesson, priming students to critically evaluate rationality assumptions—and appreciate why Hofstadter’s ideas remain provocative.
