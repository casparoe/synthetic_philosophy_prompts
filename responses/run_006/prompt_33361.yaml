prompt: |-
  For a post I have been drafting, I keep coming back to the unilateralist's curse in discussions of AI risk and community governance: the pattern in which a group where any single member may act on behalf of the whole produces systematically risky outcomes, because the member with the most optimistic estimate of a proposal's value acts while the more pessimistic members' reservations carry no veto. The standard illustrations are open-sourcing a dangerous model, gain-of-function research, and unilateral geoengineering, but the structure also appears in more mundane decisions about who may fork a project, disclose a vulnerability, or post on a shared account. Rather than another argument for a particular remedy — majority vote, a consensus requirement, a designated decider, a higher evidence bar — I want the specification first. What would an adequate theory of how a group should handle decisions in which any one member can act have to deliver?

  Write the desiderata. I want the cases it must handle: asymmetric stakes, correlated versus independent judgments, strategic or adversarial members, unknown or open group membership, irreversible versus reversible actions, one-shot versus repeated settings. I want the distinctions it must not collapse: unilateral action versus public advocacy, epistemic disagreement versus value disagreement, ex ante versus ex post evaluation, a small aligned team versus a large anonymous commons, and the procedural question of who is entitled to act versus the substantive question of whether acting is wise. I want the formal results it must be consistent with: the original curse argument, the Condorcet jury theorem and its limits, information cascades, and the conditions under which agreement theorems do or do not force convergence. Give the case or consideration behind each requirement, flag which are non-negotiable and which are merely the preferences of a particular camp, and say whether any subset is jointly unsatisfiable — in particular, whether respecting individual autonomy, avoiding the curse, and remaining robust to strategic actors can all be satisfied at once. I am less interested in a scorecard of existing proposals than in knowing which single requirement does the most to exclude the popular fixes.
reasoning: |-
  Okay, the user wants desiderata for a theory on group decisions where any member can act unilaterally. Let me start by understanding their main points. They mentioned the unilateralist's curse in AI risk and governance, using examples like open-sourcing models or geoengineering. They want the theory to cover various cases: asymmetric stakes, correlated judgments, strategic members, etc. Also, they want distinctions like unilateral action vs. advocacy, epistemic vs. value disagreements, and more. Plus, formal results like the curse argument, Condorcet theorem, information cascades.

  First, I need to list all the cases the theory must handle. The user specified asymmetric stakes—where members have different levels of risk. For example, one member might face higher costs if things go wrong. Correlated judgments are important because if everyone's opinions are similar, the curse might be worse. Independent judgments might mitigate it. Strategic members could game the system, so the theory needs safeguards. Open membership complicates things because you don't know who's involved. Irreversible actions need stricter controls than reversible ones. Repeated interactions allow learning over time.

  Next, distinctions. Unilateral action vs. advocacy: acting alone vs. persuading others. The theory shouldn't conflate them. Epistemic vs. value disagreements: facts vs. ethics, requiring different resolutions. Ex ante vs. ex post: decisions made before vs. after outcomes. Small teams vs. large commons: different dynamics in trust and coordination. Procedural vs. substantive: who can act vs. whether they should.

  Formal results must align with the curse argument, showing why unilateral actions are riskier. Condorcet jury theorem supports majority rule but has limits with correlated votes. Information cascades show how people follow others' actions regardless of their own info. Agreement theorems highlight when consensus is possible.

  Now, non-negotiables. Avoiding systematic risk from the curse is crucial. Respecting autonomy might conflict, especially if restricting actions. Robustness to adversaries is tricky; requiring identity verification could help but might exclude some. The user wants to know if autonomy, curse avoidance, and robustness can coexist. Probably not fully, so trade-offs are necessary.

  The key tension is between autonomy and systemic safety. If you let anyone act, the curse happens. Preventing action reduces autonomy. Strategic actors exploit this, so maybe verification is needed, but that limits openness. The user's deeper need might be balancing freedom with safety in decentralized groups, common in open-source or activist communities. They might also want a framework that guides when to restrict actions without imposing top-down control, preserving the group's ethos while preventing recklessness.
answer: |-
  Here are the desiderata for an adequate theory of group decision-making where any member can act unilaterally, structured as requested. The core tension is between **individual autonomy**, **systemic safety (avoiding the curse)**, and **robustness to manipulation**. No existing popular fix satisfies all desiderata perfectly, but identifying the key exclusions clarifies the design space.

  **I. Cases the Theory Must Handle**
  1.  **Asymmetric Stakes:** Members have vastly different costs/benefits from action/inaction (e.g., acting member gains prestige, others bear catastrophic risk; or one member bears disproportionate harm from inaction). *(Necessary: Real-world relevance in AI risk, security, funding decisions)*
  2.  **Correlated vs. Independent Judgments:** Member estimates of an action's value/risk may be highly correlated (shared biases, common information sources) or largely independent (diverse expertise, perspectives). *(Necessary: Affects feasibility of aggregation & severity of curse)*
  3.  **Strategic or Adversarial Members:** Some members may act to sabotage, gain personal advantage, provoke reactions, or simply free-ride/test boundaries. *(Necessary: Realism in open communities; critical for robustness)*
  4.  **Unknown or Open Group Membership:** The set of individuals capable of acting may be ill-defined, dynamic, or anonymous (e.g., open-source contributors, vulnerability researchers with 0-days). *(Necessary: Captures key governance challenges in digital/online spaces)*
  5.  **Irreversible vs. Reversible Actions:** Actions may be impossible or extremely costly to undo (e.g., releasing a model, conducting dangerous research) vs. easily reversible (e.g., temporary post, sandboxed test). *(Necessary: Impacts acceptable risk thresholds & urgency)*
  6.  **One-Shot vs. Repeated Settings:** Decisions may be unique or part of an ongoing sequence where reputation, learning, and retaliation are possible. *(Necessary: Affects strategy, learning, and stability of norms)*

  **II. Distinctions the Theory Must Not Collapse**
  7.  **Unilateral Action vs. Public Advocacy:** Distinguish *acting* alone (imposing risk/costs) from *advocating* for action (persuading, but requiring others to decide/act). *(Necessary: Essential for preserving free speech while mitigating imposed risks; core to autonomy/safety balance)*
  8.  **Epistemic Disagreement vs. Value Disagreement:** Distinguish disputes about *facts* (probabilities, causal models) from disputes about *values* (utility functions, risk tolerance, ethical weights). *(Necessary: Resolution strategies differ fundamentally - evidence vs. negotiation/priority-setting)*
  9.  **Ex Ante vs. Ex Post Evaluation:** The theory must guide decision-making *before* action, not just judge outcomes *afterward*. *(Necessary: Decision theory focus; avoids hindsight bias)*
  10. **Small Aligned Team vs. Large Anonymous Commons:** Mechanisms/norms viable for a trusted, known, value-aligned group often fail catastrophically in a large, anonymous, diverse group. *(Necessary: Prevents overgeneralization; highlights context-dependence)*
  11. **Procedural Entitlement vs. Substantive Wisdom:** Separate the question of *who has the right/ability to act* from the question of *whether acting is the best choice*. *(Necessary: Avoids conflating legitimacy/authority with optimality; crucial for autonomy)*

  **III. Formal Results the Theory Must Be Consistent With**
  12. **Unilateralist's Curse Argument:** Acknowledge that if actions require only one willing actor, and willingness correlates with optimism, the *expected harm* of actions taken increases as group size grows. *(Non-negotiable: The core problem being addressed)*
  13. **Condorcet Jury Theorem & Its Limits:** Leverage the idea that under independence and competence >0.5, majority voting improves accuracy with size, but respect its failure under correlation, competence <0.5, or strategic voting. *(Necessary: Baseline for collective wisdom; highlights aggregation challenges)*
  14. **Information Cascades & Herding:** Account for how early actions/signals can suppress private information, leading to suboptimal herd behavior even with rational actors. *(Necessary: Highlights risks of sequential decisions/public signaling)*
  15. **Agreement Theorems (Aumann, etc.):** Explain when common knowledge of rationality and common priors *should* force convergence (epistemic disagreement), and when value disagreements or differing priors prevent it. *(Necessary: Clarifies the roots of persistent disagreement)*

  **IV. Core Tensions & Non-Negotiables**
  *   **Non-Negotiable Desiderata:**
      *   **Avoids Systematic Risk from the Curse:** The theory *must* provide a mechanism or norm demonstrably reducing the expected harm from unilateral actions compared to a "free for all." (Derived from 12).
      *   **Respects Core Autonomy (Minimally):** It cannot require *universal* pre-approval for *all* potential actions by *all* members as a default. Some scope for individual initiative must exist, even if constrained. (Derived from 11 & 7 - collapsing this eliminates the problem's essence).
      *   **Addresses Open/Unknown Membership (Reality):** Must function (or degrade gracefully) when the acting group isn't a predefined, closed list. (Derived from 4).
  *   **Camp-Specific Preferences (Often Debated):**
      *   *Prioritizing Absolute Safety:* Some camps demand mechanisms making catastrophic unilateral actions *impossible*. (Often conflicts with 7 & core autonomy).
      *   *Maximizing Permissionless Innovation:* Some camps prioritize minimizing barriers to individual action above systemic risk mitigation. (Often conflicts with avoiding the curse).
      *   *Formal Mechanism Design Focus:* Preference for fully specified, game-theoretically robust protocols over informal norms/culture. (May struggle with 4 & 6).
  *   **Joint Unsatisfiability:** **Respecting strong individual autonomy, robustly avoiding the curse, and remaining fully robust to adversarial actors in an open setting is likely IMPOSSIBLE.** Proof sketch:
      1.  Strong Autonomy: Anyone can act without prior constraint.
      2.  Avoid Curse: Prevent systematically risky actions (optimism-driven).
      3.  Robust to Adversaries: Prevent saboteurs from acting.
      *   An adversary *is* an actor. Preventing their action violates strong autonomy. Weakening autonomy (e.g., identity verification, reputation) is needed for robustness, which may conflict with openness (4). *Trade-offs are fundamental.*

  **The Single Most Excluding Requirement**
  **"Respects Core Autonomy (Minimally)"** is the requirement that does the most to exclude popular fixes:

  1.  **Consensus Requirement:** Violates core autonomy by giving every member a de facto veto over *any* action. Paralyzes initiative in large/open groups (fails 4, 6).
  2.  **Designated Decider (Fixed):** Concentrates power, violating the autonomy of others to act. Creates single points of failure/coercion. Fails open membership (4).
  3.  **Majority Vote Requirement:** Still requires collective permission before acting, violating autonomy to initiate. Impractical in open groups (4).
  4.  **Higher Evidence Bar:** Doesn't inherently stop *who* acts, but if enforced collectively (e.g., review), violates autonomy. If personal, may not mitigate curse (optimists believe they meet it).
  5.  **Veto Rights:** Similar to consensus - paralyzing.

  **What This Leaves:** Mechanisms that *channel* autonomy rather than eliminate it:
  *   **Default Inaction + Strong Justification Burden:** Presume action is *not* allowed unless specific, high-threshold criteria are met (e.g., proof of safety, overwhelming benefit). Autonomy preserved *in theory* to meet the burden, but high barrier deters casual optimism. (Challenges: Defining burden, enforcement).
  *   **Reputation/Stake-Weighted Systems:** Autonomy to act exists, but consequences (reputation loss, slashing stakes) for harmful actions create disincentives. Requires identity/accountability (conflicts with pure anonymity in 4). Robustness depends on stake alignment.
  *   **Schelling Fences / Bright Lines:** Define specific, clearly dangerous actions that are *explicitly forbidden* (violating autonomy *only* for those), leaving autonomy intact elsewhere. Requires agreement on bright lines. Vulnerable to novel actions.
  *   **Delayed Action / Cooling-Off Periods:** Autonomy preserved, but action triggers a delay allowing opposition to mobilize, refute, or offer alternatives. Mitigates impulsivity/information cascades (15). Less effective against determined optimists/adversaries or urgent decisions.

  **Conclusion:** An adequate theory must navigate the **Fundamental Trilemma:** You can robustly achieve any two of {Strong Individual Autonomy, Robust Systemic Safety (No Curse), Open/Adversarial-Robust Membership}, but likely not all three simultaneously. The requirement for **minimal core autonomy** is the sharpest knife, cutting out most collective pre-approval mechanisms and forcing solutions towards *ex-post accountability*, *channeled autonomy*, or *limited scope restrictions*, while grappling with the inherent vulnerabilities of open systems. The theory must explicitly acknowledge these trade-offs and specify under which conditions (group size, alignment, stakes, action type) different mechanisms are viable.
