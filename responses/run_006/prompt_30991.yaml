prompt: |-
  I'm trying to work out what I actually think about discounting the future, and my gut reactions are pulling in different directions. Here are the cases, with my verdicts.

  - My own future wellbeing: a hundred quid of benefit to me tomorrow feels worth slightly more than the same benefit to me in a year, but only slightly — the later one is maybe 98% as important. So I do have a bit of pure time preference, but not much.
  - A stranger's future wellbeing: same choice, but the benefit goes to someone I've never met. I'm indifferent between tomorrow and a year from now. Pure time preference seems to vanish when it's not me.
  - Lives: I'd save a life today rather than a life in a hundred years if I had to choose, but not because the later life matters less. It's because I'm less sure my intervention will actually reach them through all that future noise.
  - Money: a pound today to someone poor is worth more than a pound in a hundred years to someone who will be much richer. That feels right even though it's still a real person in the future.
  - And the awkward one: I'd take £100 today over £110 in a week, but I'd take £110 in a year and a week over £100 in a year. I dont think those can both be rational, but both are how I'd actually choose.

  Is there a principle that gets all of these, or close, and which of my verdicts does it force me to drop? And what does it say about the case I keep going back and forth on — whether its okay to discount the future wellbeing of non-human animals just because it's later?

  Please give me exactly five candidate principles, each in a sentence or two, with no introduction or conclusion. For each candidate, say which of my verdicts it keeps, which it overturns, and what it predicts for the animals case.
reasoning: |-
  Okay, the user is grappling with the concept of discounting the future across various scenarios. They've presented five different cases with their intuitive verdicts and are seeking principles that can reconcile these, or identify which verdicts might need adjustment. The key cases involve: personal vs. others' wellbeing, saving lives, monetary value over time, and an inconsistency in short-term vs. long-term tradeoffs. They also raise a specific question about non-human animals.

  First, I need to unpack each of their verdicts. For their own future wellbeing, they have a slight pure time preference (98% value for one-year delay). For strangers, they feel no time preference—only timing uncertainty matters. In life-saving scenarios, they prefer immediate action due to uncertainty of impact, not intrinsic value difference. With money, they account for wealth changes over time. The "awkward" case shows hyperbolic discounting where short-term impatience contradicts long-term patience.

  Their core tension is between consistency and intuition. The money/lives cases suggest they implicitly accept economic discounting (growth/uncertainty) but reject pure time preference for others. The animal welfare question extends this: if no pure time preference for strangers, should the same apply to animals?

  For principles, I consider five candidates that cover major ethical/economic positions:
  1. Pure time preference (constant rate) would validate their personal discounting but clash with stranger indifference and animal implications.
  2. Uncertainty-focused discounting aligns with their life-saving reasoning and stranger case, but doesn't explain their personal time preference.
  3. Wealth-growth discounting (economic approach) justifies monetary choices but fails their life-saving verdict (which isn't wealth-based).
  4. Agent-relative time preference accepts all their verdicts by compartmentalizing self/other contexts, but at the cost of theoretical consistency.
  5. Hyperbolic discounting explains their inconsistent money choices as a cognitive bias, though it doesn't address the animal question directly.

  The animal welfare case becomes a litmus test: principles rejecting pure time preference for strangers (2, 4, partially 5) would extend this to animals, while others (1, 3) might allow discounting. Their discomfort with discounting animals suggests alignment with principles 2 or 4.

  Notably, their "awkward" case is a classic time-inconsistency problem that only hyperbolic discounting (5) preserves—other frameworks would require dropping one choice as irrational. This might be the verdict needing revision for coherence, though it's psychologically real.

  I'll structure the response to match their requested format: exactly five principles, each analyzed against their verdicts and the animal case, without intros/conclusions. The analysis will highlight where principles demand surrendering intuitions (e.g., wealth-growth vs. life-saving reasoning) and where animals fit into each framework.
answer: |-
  Here are five candidate principles:

  1.  **Constant pure time preference:** Apply a fixed discount rate to all future utility, regardless of recipient or context. *Keeps:* Your own wellbeing verdict (slight discount). *Overturns:* Stranger indifference (must discount), Life-saving reason (must discount purely), Money reason (must discount purely). *Animals:* Discounts future animal wellbeing purely because it's later.
  2.  **Uncertainty-driven discounting:** Discount future impacts only due to increasing uncertainty about whether the benefit will materialize or be meaningful. *Keeps:* Stranger indifference (no pure discount), Life-saving reason (uncertainty discount). *Overturns:* Your own wellbeing verdict (must be indifference or uncertainty-based), Money reason (must be based on uncertainty, not wealth growth). *Animals:* No pure discount for future animal wellbeing; discount only for uncertainty.
  3.  **Wealth-growth discounting:** Discount future *monetary* flows based on expected economic growth, but apply no pure time preference to utility/wellbeing itself. *Keeps:* Money reason (discount justified by recipient wealth). *Overturns:* Your own wellbeing verdict (must be indifference or wealth-based), Stranger indifference (must discount if wealth changes), Life-saving reason (must discount if wealth changes). *Animals:* No pure discount; discount future animal wellbeing only if their expected "wealth" (e.g., habitat quality) improves.
  4.  **Agent-relative pure time preference:** Apply pure time preference only to benefits/costs affecting the agent's *own* wellbeing; apply zero pure time preference to all others (strangers, animals). *Keeps:* Your own wellbeing verdict (slight discount), Stranger indifference (no pure discount), Life-saving reason (no pure discount needed). *Overturns:* Money reason (must not discount purely, only for wealth/uncertainty). *Animals:* No pure discount for future animal wellbeing because it's not the agent's own.
  5.  **Hyperbolic discounting with wellbeing focus:** Apply hyperbolic discounting (higher short-term impatience) to *all* utility streams, but only uncertainty adjustments beyond that. *Keeps:* Your own wellbeing verdict (slight discount), Stranger indifference (zero pure long-term discount), "Awkward" money choices (hyperbolic pattern), Life-saving reason (uncertainty discount). *Overturns:* Money reason (must discount hyperbolically, not primarily for wealth). *Animals:* Discount future animal wellbeing hyperbolically (steep short-term, shallow long-term).
