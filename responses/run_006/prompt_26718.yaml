prompt: |-
  ok so i'm trying to get clear on what a theory of scientific theory choice would even need to do, given the underdetermination of theory by evidence. not which theory of theory choice is right — i want the checklist first. what does an adequate account have to deliver? it has to handle the fact that any body of evidence is compatible with indefinitely many mutually incompatible theories. but that's just the starting point. what are the actual desiderata? i can think of a few: it should distinguish cases where the rival theories are just notational variants from cases where they're genuinely different. it should say something about transient vs permanent underdetermination — is the problem just that we haven't thought of the right experiment yet, or is it deeper? it should be consistent with how scientists actually behave (they do converge on theories, and they do sometimes abandon empirically adequate ones). it should handle the pessimistic induction — if past theories were underdetermined by the evidence of their time and turned out false, why think current ones are different? and probably it should say whether underdetermination is an epistemological problem, a semantic one, or both. give me the full list with the case behind each requirement, flag which ones are non-negotiable and which are just realist or empiricist preferences, and tell me if any pair of them can't be jointly satisfied — that's the part i really want. also, which single desideratum rules out the most popular responses (like 'we just pick the simplest')? skip the scorecard, i'll do that myself.
reasoning: |-
  Okay, the user is diving deep into philosophy of science, specifically the underdetermination of theories by evidence. They want a checklist of what any adequate theory of theory choice must accomplish given this problem. They've already listed some points like distinguishing notational variants, transient vs permanent underdetermination, consistency with scientific practice, handling pessimistic induction, and clarifying the nature of underdetermination.

  First, I need to recall the key issues in underdetermination. Duhem-Quine thesis says any evidence can fit multiple theories. The user wants a comprehensive list of desiderata, noting which are essential and which depend on philosophical stance. They also want to know if any desiderata conflict and which one challenges popular solutions like simplicity.

  The user mentions distinguishing notational variants. That's crucial because if two theories are just different labels for the same thing, underdetermination isn't a real problem. So that's a core requirement. Then transient vs permanent underdetermination: is it solvable with more data or inherent? Realists might see it as temporary, empiricists as permanent. The account must address this.

  Consistency with actual scientific practice is another point. Scientists do converge on theories and discard empirically adequate ones. Any theory choice model must explain this behavior without hand-waving. Pessimistic induction is tricky: past theories were accepted but later falsified, so why trust current ones? A good account needs to address this to avoid circularity.

  The user also asks about the nature of underdetermination—epistemological or semantic? Epistemological is about our access to truth; semantic is about meaning and equivalence. The account should clarify which it addresses. Then, there's the need to explain why scientists reject empirically adequate theories. If evidence underdetermines, why abandon a theory that fits data? This relates to non-empirical virtues like simplicity or explanatory power.

  Another point is handling both global (all possible theories) and local (current rivals) underdetermination. Global might be intractable, but local is manageable. The account should show how scientists navigate local choices. Also, accommodating non-empirical virtues: simplicity, coherence, fruitfulness. But these are contentious; empiricists might reject them as subjective, while realists see them as truth-tracking. This ties into the realism/empiricism divide.

  Now, conflicts. The main tension is between accommodating non-empirical virtues and empirical equivalence. Empiricists argue virtues are pragmatic, not truth-related. Realists say they indicate truth. If an account relies on these virtues to choose between empirically equivalent theories, it risks being non-justificatory from an empiricist view. Also, explaining why past theories were rejected despite being empirically adequate might require invoking these virtues, which pessimists argue are unreliable.

  The desideratum that rules out "just pick the simplest" is explaining non-empirical theory rejection. Simplicity alone doesn't explain why scientists discard theories that fit data but lack other virtues. For example, Newtonian mechanics was empirically adequate until Mercury's orbit, but scientists valued coherence with other theories. So simplicity isn't sufficient; other factors play a role.

  The user might be preparing for a deeper analysis of different theories of theory choice. They might need this checklist to evaluate existing models or develop their own. Their unspoken need could be understanding the philosophical debates' core tensions, especially between realism and empiricism, and how underdetermination challenges both. They might also be interested in whether a coherent account can satisfy all desiderata without internal conflicts.
answer: |-
  Here's a comprehensive checklist of desiderata for an adequate account of scientific theory choice given underdetermination, with rationale, necessity classification, and identification of conflicts:

  **Core Desiderata (Non-Negotiable for Any Plausible Account):**

  1.  **Acknowledge & Explain Underdetermination:**
      *   **Case:** The Duhem-Quine thesis, Quinean holism, and historical examples (e.g., Ptolemaic vs. Copernican models before Kepler/Galileo; wave vs. particle theories of light) demonstrate that any finite body of evidence logically permits multiple incompatible theories.
      *   **Requirement:** The account must explicitly recognize this as a fundamental constraint and explain how theory choice is possible *despite* it. It cannot simply ignore or deny underdetermination.
      *   **Necessity:** Non-negotiable. Failure here renders the account irrelevant to the problem.

  2.  **Distinguish Genuine Rivals from Notational Variants:**
      *   **Case:** Theories like Lagrangian vs. Newtonian mechanics, or different axiomatizations of the same mathematical structure, are empirically equivalent but arguably express the *same* physical content just differently. Choosing between them is pragmatic, not epistemic. Accounts must differentiate this from choosing between genuinely different theories like geocentrism vs. heliocentrism.
      *   **Requirement:** Provide criteria (semantic, structural, or pragmatic) to distinguish when empirically equivalent theories represent fundamentally different possibilities about the world vs. mere reformulations.
      *   **Necessity:** Non-negotiable. Failure leads to trivializing the problem or conflating pragmatic choices with substantive ones.

  3.  **Explain Convergence and Justify Theory Choice in Practice:**
      *   **Case:** Despite underdetermination, science demonstrably converges on specific theories in specific domains (e.g., evolution, plate tectonics, standard model). Scientists routinely make choices they consider justified.
      *   **Requirement:** The account must explain *how* and *why* this convergence happens and how choices are justified *given* underdetermination. It cannot portray choices as arbitrary or purely sociological if it wants to account for scientific rationality.
      *   **Necessity:** Non-negotiable. Failure leaves the account descriptively and normatively inadequate.

  4.  **Explain Abandonment of Empirically Adequate Theories:**
      *   **Case:** Scientists reject theories that are empirically adequate *at the time* (e.g., Newtonian mechanics replaced Aristotelian physics despite its adequacy for many phenomena; phlogiston theory abandoned despite fitting combustion data; Lorentz's electron theory vs. Special Relativity).
      *   **Requirement:** Explain *why* scientists reject empirically adequate contenders. What grounds (beyond current empirical fit) justify preferring one empirically adequate theory over another? This is crucial for realism but problematic for strict empiricism.
      *   **Necessity:** Non-negotiable. This is the central puzzle raised by underdetermination for rational theory choice. An account that can't explain this fails its core task.

  **Highly Important Desiderata (Often Contentious but Crucial for Robustness):**

  5.  **Address Transient vs. Permanent (Global) Underdetermination:**
      *   **Case:** Some underdetermination seems resolvable by new experiments (e.g., confirming neutrino oscillations resolved solar neutrino problem between competing models). Other cases might involve theories inherently immune to empirical discrimination (e.g., some interpretations of quantum mechanics, certain global spacetime structures).
      *   **Requirement:** The account should clarify the scope of underdetermination it addresses. Does it claim *all* underdetermination is transient? Or does it allow for permanent/global underdetermination? It should explain how/when underdetermination can be overcome (if ever).
      *   **Necessity:** Strongly desirable for completeness. Realists often emphasize transient underdetermination, while empiricists/constructivists lean towards permanent potential. Ignoring this weakens the account.

  6.  **Engage with Pessimistic Meta-Induction (PMI):**
      *   **Case:** PMI argues: Most past successful theories were later shown to be false (or significantly wrong). They were underdetermined by their evidence. Therefore, our current successful theories are likely false too. This challenges the rationality of believing chosen theories are true.
      *   **Requirement:** The account must either: a) Explain why PMI is invalid/misapplied (e.g., current theories are different, convergence indicates progress), b) Show how its criteria for choice mitigate PMI's force (e.g., chosen theories are more resilient/likely true), or c) Acknowledge PMI's force and adjust its claims accordingly (e.g., towards instrumentalism).
      *   **Necessity:** Highly desirable. PMI is a major challenge to realist interpretations of theory choice. Ignoring it leaves a vulnerability.

  7.  **Clarify the Nature of Underdetermination Addressed:**
      *   **Case:** Is the problem purely *epistemological* (we lack sufficient evidence/knowledge to know which theory is true)? Or is it *semantic* (theories might be empirically equivalent but make different claims about unobservables, raising questions about meaning and reference)? Or is it *metaphysical* (the world itself might underdetermine theory)?
      *   **Requirement:** The account should specify which aspect(s) of underdetermination it primarily tackles and how its proposed solution relates to them.
      *   **Necessity:** Highly desirable for philosophical clarity and avoiding equivocation.

  8.  **Accommodate the Role of Non-Empirical Virtues:**
      *   **Case:** Scientists routinely appeal to simplicity, explanatory power, coherence with other theories, fertility, elegance, etc., to choose between empirically adequate or nearly adequate theories.
      *   **Requirement:** The account must explain the role and justification of these virtues. Are they truth-conducive (realist)? Merely pragmatic (empiricist)? Indicators of coherence? How do they resolve underdetermination?
      *   **Necessity:** Highly desirable. Ignoring these crucial aspects of scientific practice renders the account unrealistic. However, their *justification* is a major point of contention.

  **Stance-Dependent Desiderata (Reflect Realist or Empiricist Commitments):**

  9.  **Vindicate Realism (Realist Preference):**
      *   **Case:** Realists believe successful theories are approximately true and that science makes progress towards truth.
      *   **Requirement:** The account should explain how rational theory choice, under underdetermination, can lead us towards (approximate) truth. It must show why chosen theories are *more likely true* than rejected empirically adequate rivals.
      *   **Necessity:** Realist preference. Empiricists explicitly reject this requirement.

  10. **Avoid Commitment to Unobservables (Empiricist Preference):**
      *   **Case:** Empiricists (especially constructive empiricists) argue theories aim only to be empirically adequate; belief should be restricted to observables.
      *   **Requirement:** The account should justify theory choice without requiring belief that the chosen theory's claims about unobservables are true. Choice is based on empirical adequacy plus pragmatic virtues.
      *   **Necessity:** Empiricist preference. Realists explicitly reject this restriction.

  **Key Tensions and Conflicts:**

  1.  **Accommodating Non-Empirical Virtues (8) vs. Explaining Abandonment of Empirically Adequate Theories (4) vs. Empiricist Restriction (10):**
      *   **Conflict:** How can non-empirical virtues justify abandoning an empirically adequate theory (4) if they are merely pragmatic conveniences (the empiricist interpretation of 8)? The empiricist (10) struggles to explain the *rational force* behind abandoning empirically adequate theories based on virtues, often resorting to purely pragmatic or sociological explanations which weaken the rationality claim. The realist uses virtues (as truth-tracking) to explain (4), but faces the challenge of justifying *why* these virtues track truth (especially given PMI (6)).

  2.  **Vindicating Realism (9) vs. Pessimistic Meta-Induction (6):**
      *   **Conflict:** PMI (6) directly challenges the realist claim (9) that our chosen theories are likely true. Any realist account *must* provide a compelling response to PMI. Common realist responses (e.g., selective confirmation, convergence, structural realism) are themselves contested. Failing to adequately address PMI significantly weakens the realist position.

  3.  **Addressing Permanent Underdetermination (5) vs. Vindicating Realism (9):**
      *   **Conflict:** If an account acknowledges permanent/global underdetermination (5) – the existence of genuinely distinct, empirically equivalent rivals – then the realist goal (9) of choosing the *true* theory becomes impossible. Realists typically argue permanent underdetermination is rare or illusory. Empiricists are more comfortable with it, seeing theory choice then as guided solely by pragmatic virtues.

  **The Desideratum That Rules Out "Just Pick the Simplest":**

  *   **#4: Explain Abandonment of Empirically Adequate Theories.**
  *   **Why:** "Just pick the simplest" fails spectacularly here. History is full of cases where scientists rejected a *simpler* theory that was empirically adequate for a more complex one:
      *   Abandoning the (relatively simple) steady-state universe model for the Big Bang model (despite initial empirical adequacy of steady-state).
      *   Rejecting the (simple) caloric theory of heat for the (more complex) kinetic theory.
      *   Choosing General Relativity over Newtonian Gravity (even before clear empirical anomalies like Mercury, due to conceptual coherence and explanatory power).
  *   **The Problem:** Simplicity alone doesn't explain why empirically adequate theories are abandoned. Scientists often prioritize other virtues like *explanatory depth, coherence with fundamental theories, unifying power, or fertility* over sheer simplicity when rejecting an empirically adequate contender. An adequate account *must* incorporate and justify the role of these other virtues in such crucial decisions. "Just pick the simplest" is descriptively inaccurate and normatively inadequate for explaining the most significant moments of theory change.

  This checklist provides the critical framework you need to rigorously evaluate any proposed theory of theory choice under underdetermination. The tensions, especially surrounding non-empirical virtues, the abandonment of empirically adequate theories, realism, and the pessimistic induction, highlight the core philosophical battlegrounds. Good luck with your analysis!
