  For progress, formal work on observation selection (like Bostrom's work) helps but doesn’t resolve the core philosophical split. The disagreement might be foundational, rooted in unprovable intuitions about probability and existence. That’s tough for science but rich for storytelling—highlighting how a character grapples with an unanswerable, existential calculation. 

