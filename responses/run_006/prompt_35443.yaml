prompt: |-
  I've been teaching the sea battle passage from De Interpretatione 9 for years and I thought I understood the moves, but a grad student in my seminar last week laid out a version of the argument that I'm having trouble finding a clean exit from. Here it is:

  (1) For any proposition about the future, it's either true or false right now. (Bivalence holds for all propositions, future-tensed ones included.)

  (2) If a proposition is true right now, then there is a fact right now that makes it true.

  (3) If there is a fact right now that makes it true that there will be a sea battle tomorrow, then the sea battle tomorrow is already settled — it's not the kind of thing that could fail to happen given the way things currently are.

  (4) So for any future event, either it's already settled that it will happen, or it's already settled that it won't. Which means deliberation is pointless: whatever you're going to do, you were always going to do.

  (4) is absurd. But I can't figure out which premise to reject without paying a price I don't want to pay. If I reject (1), I'm stuck saying some propositions are neither true nor false, which means giving up classical logic for future-tensed statements — and I'd rather not. If I reject (2), I'm saying truth can float free of the world, which sounds like magic. If I reject (3), I need to explain how a fact can obtain right now that makes something true about tomorrow without thereby making that thing inevitable. The standard move is to say that the fact is just the fact that the event will happen, and that's not a "determining" kind of fact — but then I'm not sure what work "fact" is doing in (2) anymore, and I worry the whole truthmaker intuition collapses.

  Tell me which premise to give up, and what the least bad option actually costs. I'd like to keep classical logic if I can, but I'm starting to suspect that's the price of the ticket. Lead with your bottom line in the first sentence and then give the reasoning, no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a philosophy professor who's been teaching Aristotle's sea battle argument for years but now faces a challenge from a grad student. They're struggling with a four-step logical argument leading to fatalism and want to know which premise to reject with minimal philosophical cost. 

  Hmm, the core tension is between preserving classical logic (which requires bivalence) and avoiding fatalism. The professor seems particularly attached to classical logic but acknowledges it might be unsustainable here. Their frustration is palpable—they've taught this for years but now feel trapped by the grad student's formulation. 

  Let me unpack their dilemma: Premise (1) is bivalence for future contingents—rejecting this means adopting gaps or supervaluations, abandoning classical logic. Premise (2) ties truth to present facts—denying this risks making truth "magical" or ungrounded. Premise (3) links present facts to inevitability—this is where Aristotle himself balked, but the professor worries that weakening "fact" here undermines truthmaker theory altogether. 

  *scratches head* The professor's anxiety about premise (2) is telling—they're clearly a realist about truthmakers. But if they insist on both (2) and (3), fatalism seems unavoidable. The cleanest exit is indeed rejecting (1), as Aristotle hinted. Yes, it costs classical logic for future contingents, but alternatives are worse: Rejecting (2) guts their metaphysical commitments, while rejecting (3) forces awkward distinctions between "settling" vs "non-settling" facts that collapse under pressure. 

  *checks Aristotle's text again* Yep, in De Int. 9 he explicitly denies bivalence for future contingents to preserve contingency. The cost—losing excluded middle for "There will be a sea battle tomorrow"—is real but contained. We'd still have classical logic for non-future-tensed propositions. Supervaluationism could even preserve most inference rules. 

  *ponders* The professor might resist because rejecting (1) feels like surrendering to logical revisionism. But emphasizing that this is Aristotle's own solution (and Łukasiewicz's formalization) could help. The payoff—saving deliberation from futility—justifies the cost. Truthmaker theory remains intact for present/past truths, and we avoid the "floating truths" horror they mentioned. 

  Final note: The grad student deserves credit—this formulation cleverly tightens the screws by making (3) nearly irresistible. But the professor's instinct is right: (1) is the weakest link. Time to bite the bullet.
answer: |-
  **Reject premise (1): Bivalence does not hold for future-contingent propositions.** This preserves truthmaker theory (premise 2) and avoids fatalism (premise 3), but requires modifying classical logic for statements about future contingents.

  ### Reasoning:
  - **The Cost:** You must accept that propositions like "There will be a sea battle tomorrow" are *neither true nor false* if the battle is genuinely contingent. This violates the Law of Excluded Middle for future contingents and necessitates a non-classical logic (e.g., Łukasiewicz’s three-valued logic, supervaluationism). Classical entailments like *reductio ad absurdum* or conditional proof may fail for these propositions.
    
  - **Why Reject (1)?**  
    Aristotle’s solution (*De Int.* 9) targets bivalence: future contingents lack a present truth-value because no fact *currently exists* to ground their truth or falsity. This directly blocks the argument at step (1), preventing the fatalist conclusion (4). It aligns with the intuition that the future is "open" and deliberation matters.  
    
  - **Why Not Reject (2)?**  
    Abandoning truthmaker theory (premise 2) severs truth from reality, allowing propositions to be "true" without any factual basis—a heavier metaphysical cost than modifying logic. If truth floats free, semantics becomes unmoored from ontology.  
    
  - **Why Not Reject (3)?**  
    Denying (3) requires "soft facts": present facts that *make* future events true but don’t *necessitate* them. This is incoherent: if a present fact *grounds* "Event E will happen," then E’s failure would contradict that very fact, making E inevitable. Calling it "non-settling" is ad hoc and collapses truthmaking into epistemic or linguistic conventions.  
    
  - **Minimizing the Cost:**  
    Adopt a supervaluationist semantics: future contingents are *indeterminate* (neither true nor false) now, but will become true/false later. Classical logic is preserved for non-future contingents, and most logical rules hold *within* temporal contexts. This avoids fatalism while keeping logic mostly classical.
