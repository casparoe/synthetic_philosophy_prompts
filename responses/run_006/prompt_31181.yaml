prompt: |-
  Since retiring from a career in systematics and taking up the philosophical literature on species, I find my own judgments on particular cases in tension, and I would like to know whether a single species concept can be brought into reflective equilibrium with them.

  My verdicts are these. Around the Tibetan plateau, the greenish warbler forms a ring: neighboring populations interbreed all the way around, but where the two ends meet in central Siberia they do not. I want to say that each adjacent population belongs to the same species, yet that the two overlapping end forms are not the same species. Bdelloid rotifers, which are apparently ancient asexuals, nonetheless form stable, ecologically distinct clusters; I am reluctant to deny that they have species at all. Polar bears and brown bears hybridize in the wild and produce fertile young, but I still count them as two species. Neanderthals and modern humans interbred, and many living people carry Neanderthal DNA, but I still count them as distinct species. A fossil lineage that changes gradually over several million years, with no sharp breaks, I would regard as divided into successive chronospecies only by convention. And in bacteria, where genes are exchanged across lineages, I remain willing to use species names while suspecting they mark convenient clusters rather than natural units.

  Is there one principle about what a species is that yields all or most of these verdicts? If not, which of my verdicts should I give up, and why? Please state the principle precisely, and tell me what it says about a case I have not settled: two sympatric populations of planktonic copepods that are morphologically indistinguishable and occupy the same ecological niche but never interbreed — are they one species or two?
reasoning: |-
  Hmm, the user is a retired systematist now exploring philosophy of biology, specifically species concepts. They present seven specific judgments about taxonomic cases that seem inconsistent with each other, and want to know if a single species concept can reconcile them all. Their examples cover ring species, asexual organisms, hybridizing bears, ancient hominins, gradual fossil lineages, and bacteria.

  Key tension points in their judgments:
  - They accept ring species as one species despite terminal forms not interbreeding
  - They want asexual rotifers to have "species" status
  - They maintain polar/brown bears as separate species despite fertile hybrids
  - Same for Neanderthal/humans with introgression
  - But reject chronospecies in gradual fossil lineages as arbitrary
  - Accept bacterial species as pragmatic clusters

  The user's implicit concerns seem to be:
  1) Maintaining taxonomic realism while accommodating biological complexity
  2) Avoiding what they perceive as "conventional" rather than "natural" classifications
  3) Preserving intuitive judgments about particular cases

  The challenge is finding a concept that handles both genetic exchange (like in ring species) and lack thereof (like in asexuals), while also accounting for evolutionary independence in hybridizing taxa.

  For the unaddressed case: Sympatric copepods that are morphologically and ecologically identical but reproductively isolated. Under most concepts this would be cryptic species - the reproductive isolation suggests separate evolutionary trajectories despite other similarities. The user's own pattern suggests they'd likely call them separate species given their stance on bears/Neanderthals where reproductive compatibility exists but they still split them.

  The most promising approach seems to be the Evolutionary Species Concept framed around lineage independence, supplemented with pluralism for edge cases. This concept can explain:
  - Ring species: terminal forms maintain distinct evolutionary trajectories
  - Bdelloids: lineages maintain stable, independent ecological roles
  - Hybridizing bears: sustained evolutionary independence despite gene flow
  - Neanderthals: same as bears
  - Chronospecies: arbitrary if no lineage splits occurred
  - Bacteria: clusters reflect ecological lineages

  The user might need to moderate their rejection of chronospecies - if no speciation event occurred, calling them separate species is indeed arbitrary under this concept. For bacteria, accepting that "species" denotes ecological lineages rather than reproductive communities may require some conceptual flexibility.

  The copepod case clearly demonstrates that reproductive isolation alone can define species boundaries even without morphological or ecological differentiation - which aligns with their other judgments about maintaining distinct species despite hybridization.
answer: |-
  Based on your judgments and the philosophical challenges of species concepts, the **Evolutionary Species Concept (ESC)**, as refined by Kevin de Queiroz, offers the most coherent framework. It defines a species as:

  **"A separately evolving metapopulation lineage."**

  This principle emphasizes the *process* of lineage independence as the fundamental property of species, while viewing other criteria (reproductive isolation, ecological distinctness, morphological diagnosability) as *contingent evidence* for lineage separation rather than definitional requirements. Let's apply it to your cases:

  ---

  ### **Resolving Your Verdicts with the ESC**
  1.  **Greenish Warbler Ring:**
      *   **ESC Verdict:** *Single species.* Adjacent populations maintain lineage cohesion through gene flow around the ring, forming one evolving lineage despite reproductive isolation and overlap at the ends (evidence of lineage divergence but not yet full separation). Your judgment is upheld.
      *   *Why it works:* The lineage is connected historically and currently (via intermediates), maintaining its identity as a single metapopulation. Terminal isolation is an emergent property, not a lineage split.

  2.  **Bdelloid Rotifers:**
      *   **ESC Verdict:** *Species exist.* The stable, ecologically distinct clusters represent independently evolving lineages maintained by divergent selection and lack of genetic exchange. Lineage independence exists despite asexuality.
      *   *Why it works:* The ESC doesn't require sexual reproduction or gene flow. Lineage independence arises through mutation, selection, drift, and ecological separation.

  3.  **Polar Bears & Brown Bears:**
      *   **ESC Verdict:** *Two species.* Despite hybridization and fertile offspring, the lineages maintain distinct evolutionary trajectories, adaptations, and ecological roles over significant timeframes. Gene flow is insufficient to collapse them into a single lineage.
      *   *Why it works:* Lineage independence is the criterion. Hybridization is evidence of incomplete lineage sorting, not proof of a single lineage. Your judgment is upheld.

  4.  **Neanderthals & Modern Humans:**
      *   **ESC Verdict:** *Two species (historically).* They evolved largely independently for hundreds of thousands of years as distinct metapopulation lineages in different regions with distinct adaptations. Limited interbreeding occurred upon secondary contact but did not merge the lineages into one; the Neanderthal lineage ended.
      *   *Why it works:* Their prolonged independent evolution defines them as separate lineages at the time. Introgression is again evidence of incomplete sorting, not lineage identity. Your judgment is upheld.

  5.  **Gradual Fossil Lineage:**
      *   **ESC Verdict:** *One species.* Without evidence of lineage splitting (e.g., cladogenesis, sustained divergence in sympatry), it remains a single evolving lineage through time. Dividing it into chronospecies is arbitrary convention.
      *   *Why it works:* The ESC focuses on the reality of lineages. Without a branching event or sustained divergence, there's only one lineage. Your judgment is upheld.

  6.  **Bacteria:**
      *   **ESC Verdict:** *Species names can denote lineages.* Clusters identified by gene content, ecology, or genomics often represent independently evolving metapopulation lineages adapted to specific niches, even with horizontal gene transfer (HGT). HGT complicates but doesn't obliterate lineage structure; cohesive forces (selection, ecology, core genome) maintain lineages.
      *   *Why it works:* The ESC accommodates non-sexual lineages. "Convenient clusters" often *do* correspond to lineages maintained by ecological selection, even if boundaries are fuzzy. Your pragmatic acceptance is supported.

  ---

  ### **The Copepod Case: Applying the ESC**
  *   **Scenario:** Two sympatric populations of planktonic copepods. Morphologically indistinguishable. Occupy the same ecological niche. Never interbreed.
  *   **ESC Verdict:** **Two species.**
  *   **Reasoning:**
      1.  **Sympatry + No Interbreeding:** This constitutes strong evidence for *intrinsic reproductive isolation*. Under the ESC, this is compelling evidence that the populations represent *separately evolving lineages*.
      2.  **Lineage Independence:** The lack of gene flow, despite sympatry and ecological/morphological identity, means they are not exchanging genes or co-evolving as a single metapopulation. They are on independent evolutionary trajectories.
      3.  **Contingent Evidence:** Morphology and ecology are *not* defining under the ESC; they are merely lines of evidence. Here, they fail to indicate separation, but the reproductive isolation provides decisive evidence for lineage separation.
      4.  **Cryptic Species:** This is a classic case of cryptic speciation. The lineages are evolutionarily independent (due to isolation) but haven't diverged morphologically or ecologically (yet).

  ---

  ### **Potential Tension & Recommendation**
  *   **Tension: Chronospecies vs. Ring Species/Bacteria.** Your rejection of chronospecies (due to arbitrariness without splits) is perfectly aligned with the ESC. Your acceptance of the ring species as one lineage and bacteria as having lineages is also aligned. *This is consistent.* The ESC avoids the arbitrariness of chronospecies by requiring evidence of lineage separation (branching or sustained divergence), which isn't present in a purely anagenetic lineage. The ring species has cohesion; bacteria have clusters maintained by selection = lineages.
  *   **Recommendation: No Verdict Needs Abandonment.** The ESC, focused on lineage independence, coherently explains all your judgments. It accommodates sexual/asexual reproduction, hybridization, ring species, fossils, and microbes. It avoids the pitfalls of requiring any single contingent property (like strict reproductive isolation or morphological gaps) as definitional.

  **Conclusion:** The Evolutionary Species Concept ("a separately evolving metapopulation lineage") brings your considered judgments into reflective equilibrium. It defines species by the fundamental process of lineage independence, using other criteria (like reproductive isolation in the copepod case) as evidence for that independence. This principle resolves your tensions pragmatically while respecting the biological reality of evolution. For the copepods, the ESC decisively identifies them as two cryptic species based on evidence of separate evolutionary trajectories despite morphological and ecological identity.
