prompt: |-
  I run a product team at a mid-size software company. Every quarter we have to decide whether a new AI feature should ship as a tool — something a human drives, where the model does a bounded task like drafting or summarizing — or as an agent, meaning the system takes actions on its own: chains steps together, sends messages, changes records, spends money. The default around here has become "make it an agent, it demos better," and I want a reusable decision proceedure my team can actually run in an afternoon before any code gets written, with engineers and PMs in the room but nobody who knows the philosophy. Please write the procedure as an ordered checklist: the questions to ask in order, what counts as a sufficient answer to each, where the procedure says stop and keep it a tool, and where it has to hand the decision to a person because the question is one of values or risk appetite rather than anything formal. Ground it in the actual tool/agent distinction and the reasons people worry about agentic systems — blast radius, reversibility, whether a human checkpoint is real or just theater, misspecification, accountability — but don't give me a literature review. Then run the procedure on three cases: (1) a support bot that drafts replies and can also send them and issue refunds up to $50, (2) a contract-review feature that summarizes a contract and flags unusual clauses but cannot edit or send anything, and (3) a coding assistant that can open pull requests and, with one click from a developer, merge them. Tell me where the procedure gives an answer I'm not going to like, and what the procedure cant settle. Please write the answer in British English.
reasoning: |-
  Okay, the user is a product team lead at a mid-sized software company. They're struggling with deciding whether new AI features should be tools (human-driven) or agents (autonomous). The default in their company is leaning toward agents because they demo better, but they want a practical, reusable decision procedure. 

  Hmm, they need a checklist that can be run in one afternoon with engineers and PMs—no philosophy experts required. The key is grounding it in real concerns like blast radius, reversibility, human checkpoints, etc., without getting academic. They also want it tested on three specific cases and to highlight where the procedure might give unpopular answers or can't decide.

  Right, first I need to unpack their actual needs beneath the surface. They're clearly worried about the cultural drift toward flashy autonomous features without proper risk assessment. There's an underlying desire for governance—something that forces the team to pause and consider consequences before coding. The phrase "human checkpoint is real or just theatre" suggests they've seen token safeguards that don't work in practice. 

  The unspoken pain points? Probably near-misses or external pressure to ship fast. They need the checklist to act as both a shield ("blame the process, not me") and a catalyst for better decisions. The British English request implies they might be UK-based or have stakeholders there, so I'll avoid Americanisms like "check off" and use "tick" instead.

  For the procedure itself: It must be actionable—no vague questions. Every item needs a binary or clear threshold (e.g., "Can harm be contained to <X> users/dollars?"). Crucially, it should auto-resolve obvious "tool" cases early to save time. The sticky points will be where human judgment is unavoidable, like ethical trade-offs—those get flagged for escalation. 

  Testing on their three cases: 
  - Case 1 (support bot): Sending messages/refunds autonomously? High blast radius. Procedure should scream "stop" unless refunds are manual. 
  - Case 2 (contract review): Pure summarization? Safe tool territory. 
  - Case 3 (coding assistant): Merge with one click? That "click" might be theatre if rushed. Procedure should force debate on reversibility. 

  The unpopular outcome? Case 1’s refund autonomy will fail the checklist—PMs might hate losing the demo wow-factor. And Case 3’s "one-click merge" could get flagged for human debate if rollbacks are messy. 

  Finally, I’ll note what the procedure can’t handle: values-based quarrels (e.g., "Is $50 refund too risky?"). Those go to the execs. Keeping it pragmatic—British phrasing, no fluff.
answer: |-
  ### Decision Procedure: Tool vs Agent Checklist  
  *(Execute in order—stop early if any "HALT" condition is met. Involve Product Manager, Lead Engineer, and Legal/Compliance rep if available.)*  

  **Instructions:**  
  - **Sufficient Answer:** Must be evidence-based (e.g., data, precedents, technical constraints). Anecdotes or aspirations are insufficient.  
  - **HALT:** Stop the procedure. Default to **Tool**.  
  - **ESCALATE:** Senior leadership must decide (CEO/CTO/Risk Officer).  

  ---

  ### The Checklist  
  1. **Is the system acting *on* the real world (e.g., altering data, spending resources, committing legally)?**  
     - *Sufficient answer:* "Yes" only if it modifies production systems, spends money, or binds the company legally *without* human sign-off.  
     - **→ No:** Proceed to Q2.  
     - **→ Yes:** Proceed to Q3.  

  2. **Does the user *directly control every output* before it’s used?**  
     - *Sufficient answer:* "Yes" only if the user must manually copy/paste, approve, or execute *every* output.  
     - **→ Yes:** **HALT** (Safe for **Tool**).  
     - **→ No:** **ESCALATE** (Ambiguous autonomy).  

  3. **Can any single action cause irreversible harm > £1k or affect > 100 users?**  
     - *Examples:* Sending unauthorised refunds, deleting databases, leaking PII.  
     - *Sufficient answer:* "No" requires technical proof (e.g., hard-coded spending caps, air-gapped environments).  
     - **→ No:** Proceed to Q4.  
     - **→ Yes:** **HALT** (Agent too risky).  

  4. **Is there a *meaningful* human checkpoint?**  
     - *Sufficient answer:* "Yes" only if:  
       - The human is *forced* to review *all* context (not just "Approve?"),  
       - They have ≥ 30 seconds to act, *and*  
       - They bear accountability (e.g., audit trails).  
     - **→ Yes:** Proceed to Q5.  
     - **→ No:** **HALT** (Theatre checkpoint → **Tool**).  

  5. **Can errors be fully reversed in < 5 mins with zero side effects?**  
     - *Sufficient answer:* "Yes" only with tested rollbacks (e.g., transaction reversals, message recalls, version control).  
     - **→ Yes:** Proceed to Q6.  
     - **→ No:** **HALT** (Irreversible → **Tool**).  

  6. **Is accountability 100% traceable (who broke it?)?**  
     - *Sufficient answer:* "Yes" only with immutable logs showing:  
       - Who approved the action,  
       - The model’s exact inputs/outputs,  
       - System state at execution.  
     - **→ Yes:** **Proceed to Agent** (Low formal risk).  
     - **→ No:** **ESCALATE** (Legal/ops risk appetite needed).  

  ---

  ### Case Applications  
  **Case 1: Support Bot (drafts replies + sends/refunds ≤ $50)**  
  - Q1: **Yes** (sends messages/spends money).  
  - Q3: **Yes** (refunds irreversible; blast radius = financial/reputational harm). → **HALT**  
  - **Decision:** Must be a **Tool**. Refunds require manual approval. Rationale: £50 refunds scale; "small" isn’t harmless.  

  **Case 2: Contract Reviewer (summarises/flags clauses; no edit/send)**  
  - Q1: **No** (read-only; no actions).  
  - Q2: **Yes** (user reviews all outputs). → **HALT**  
  - **Decision:** Safe as **Tool**.  

  **Case 3: Coding Assistant (opens PRs + 1-click merges)**  
  - Q1: **Yes** (alters codebase).  
  - Q3: **Yes** (a bad merge can break production; blast radius = 100% users). → **HALT**  
  - **Decision:** Must be a **Tool**. Merges require manual review. Rationale: "One-click" checkpoints are theatre under pressure.  

  ---

  ### Unpopular Outcomes & Limitations  
  - **You’ll dislike:** Case 1 and 3 halt. Why? Your team’s "low-risk" agents (e.g., £50 refunds, 1-click merges) fail Q3/Q5. Demo appeal ≠ safety.  
  - **Procedure can’t settle:**  
    - **Risk appetite thresholds** (e.g., "Is £1k/100 users *our* threshold?"). This needs leadership debate.  
    - **Ethical trade-offs** (e.g., "Speed vs. safety in support refunds"). ESCALATE forces this conversation.  
  - **Blind spots:** Misspecification (e.g., "Did we define ‘harm’ correctly?"). The checklist flags symptoms, not unseen failures.  

  **Final Note:** This prioritises containment. If your culture values "move fast" over "break nothing," amend Q3/Q5 thresholds—but do so explicitly via ESCALATE.
