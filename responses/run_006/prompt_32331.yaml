  Then, examining corporate liability: it can assign blame and ensure compensation, but it might not address the moral responsibility that individuals feel. The gap theory focuses on individual culpability, but Tempe shows systemic failure. The framework goes silent on distributed responsibility and how to assign moral weight to organizations. 

  Finally, the user wants a bidirectional analysis. From theory to case: applying gap conditions to each agent shows partial failures, but together they cover all aspects, suggesting many hands rather than no hands. From case to theory: Tempe reveals that gaps are manufactured by organizational decisions, questioning the theory’s assumption that autonomy inherently creates gaps. Also, the theory doesn’t handle distributed responsibility well, especially corporate entities. 

