  **Scenario**: 
  An agent, Alice, is in a negotiation with two parties: Bob and Carol. Bob has access to a complex financial model that predicts whether a certain stock will go up or down with 70% accuracy (not perfect). Carol, independently, runs a similar model with the same accuracy. 

