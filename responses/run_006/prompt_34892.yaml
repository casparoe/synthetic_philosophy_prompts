  - On Tuesday, Carol approaches Alice and says: "My model predicted that stock X would go up. If it does go up, I will ask you for $100. But if you pay me $10 today, I will not ask for anything regardless." (This is the counterfactual mugging: Carol is asking for a payment today to avoid a demand in a world where her prediction was correct, even though that world did not occur.)

  However, the twist is that the stock movement is the same for both (either up or down). Moreover, the two models are run independently and are not perfectly correlated. 

  But note: Alice must make her decision about Bob on Monday and about Carol on Tuesday, without knowing the stock outcome until Wednesday. The stock outcome is only revealed on Wednesday. 

  The XOR blackmail structure: Bob's threat is conditional on the stock going down. If Alice pays Bob on Monday, she avoids the $100 loss only if the stock goes down. But if she doesn't pay and the stock goes down, she loses $100 to Bob. Similarly, Carol's demand is conditional on the stock going up. However, note that the stock can only go either up or down. So if the stock goes down, then Carol's model was wrong (since she predicted up) and she doesn't ask for anything on Tuesday (because her condition isn't met). Conversely, if the stock goes up, Bob's model was wrong and he doesn't get to ask for the $100 on Tuesday (because he only asks if it goes down). 

  Therefore, the two threats are mutually exclusive: only one can be realized. This is the XOR structure.

  Now, the counterfactual mugging in Carol's part: if the stock goes up (which is the case where Carol's prediction was correct), then in the counterfactual world where Alice had paid Carol on Tuesday, she would have avoided the $100 loss. But in the actual world, if Alice doesn't pay Carol, then if the stock goes up she loses $100 to Carol. 

