  I want a number rather than a survey, and I want the reasoning that produces it. The proposition is this: you could not have come from a different sperm and egg from the ones you actually came from. I mean the strong modal claim, not an epistemic or practical one. Fix the parents as the same two people, and fix the surrounding circumstances as much as possible: the same upbringing, the same social world, roughly the same time. Now consider a counterfactual conception in which a different sperm from your father fertilises a different egg from your mother, so that the resulting child has a different genome but the same parents and a recognisably similar life. Could that child have been you? I am asking whether it is metaphysically impossible that the child in that scenario is the same individual you are, not whether we could ever find out, and not what we should say for any practical purpose. If it helps you to triangulate, you may comment on the one-gamete-fixed cases, but the target proposition is the both-gametes-different case.

  Please give me your actual credence in that proposition, and then decompose it. I want the sub-questions your number depends on, a rough probability for each, and an explicit account of how they combine. I would expect the decomposition to include at least the following, though you should adjust or add terms as your reasoning requires: the probability that the correct semantics for de re modal claims is something like the Kripkean necessity-of-origin picture, in which an individual's origin is a genuine feature of it across worlds, rather than a counterpart-theoretic or conventionalist treatment under which the question may lack a stable answer; the probability that the word you picks out the biological organism that began as a particular zygote, rather than a psychological continuant of the Lockean sort that could in principle be realised in a different body; the probability that, conditional on the organism reading and on the Kripkean framework, the specific gametes and not merely the parentage are essential to that organism; and the probability that the question has a determinate truth value at all once the relevant terms are precisified. For each term, give a number and a sentence of justification, and then show how the terms combine into your final credence, whether multiplicatively, by a sum over independent routes to the same conclusion, or in whatever structure your reasoning actually has. If you think a term I have listed is redundant or missing, say so and substitute your own.

  Then tell me which single term you are least confident in, and what evidence or argument would move your final credence most. I would also like to locate a disagreement. My own credence in the target proposition is about 0.7; a friend of mine is at about 0.2. Given your decomposition, which term are the two of us most likely disagreeing about, and what would resolve that particular disagreement?

  Please write your answer in British English, as continuous prose in the manner of an email or a letter: no headings, bullet points, bold text, or tables.
