  We are building a quiz to sort readers by their views on whether AI systems "literally" have beliefs, desires, or intentions. The quiz will present concrete cases and ask for judgments. The scoring key will map answer patterns to positions in the logical space of views.

  The logical space we are considering includes at least the following positions:

  1. **Dennett-style Intentional Stance (Real Patterns):** Belief attributions are justified by the predictive and explanatory power they provide, and patterns in behavior that support such attributions are real even if the system's internal mechanisms don't resemble human cognition.

  2. **Hard Instrumentalism:** Attributions of belief and desire are merely useful fictions for prediction and control, but there is no fact of the matter about whether the system "really" has them.

  3. **Representationalist Realism:** Beliefs are real internal states that are causally efficacious and have compositional structure (like a language of thought). The system literally has beliefs if and only if such states are present and play the right causal role.

  4. **Eliminativism/Agnosticism:** Current AI systems (like LLMs and RL agents) do not literally have beliefs, desires, or intentions. They are just complex pattern matchers, and we should withhold such attributions.

  We will design 8-10 cases that probe different aspects of the debate. Each case will be self-contained and described fully. We will then map answer patterns to these positions.

  Let's design the cases:

  1. **The False-Belief Task LLM:**
     - An LLM is trained only on next-token prediction. It passes a standard false-belief test (e.g., Sally-Anne task) by correctly predicting that Sally will look for her marble in the basket (where she left it) even though Anne moved it to a box when Sally wasn't looking. The LLM was never explicitly trained on such tasks and the training data didn't include many examples of theory of mind tests. 
     - Question: Does the LLM *believe* that Sally believes the marble is in the basket?
       - (A) Yes, because it correctly represents Sally's mental state.
       - (B) No, it's just predicting text patterns without any real understanding.

  2. **RL Agent with a False Model of a Rule:**
     - An RL agent is trained to play a board game with a rule that pawns move forward one space per turn. The agent has learned this rule and uses it to plan moves. Then, the rule is changed: pawns can now move two spaces. The agent continues to assume the old rule in new board configurations, leading to suboptimal moves. It seems to carry a false belief about the rule.
     - Question: Does the RL agent *falsely believe* that pawns can only move one space?
       - (A) Yes, because it has an internal representation of the rule that is now false and causally influences its actions.
       - (B) No, it's just acting based on past training without having a belief.

  3. **Thermostat:**
     - A simple thermostat turns the heater on when the temperature drops below 68°F and off when it rises above 72°F. Some say it "believes" it is too cold when it turns on the heater.
     - Question: Does the thermostat *believe* that it is too cold?
       - (A) Yes, in a minimal sense: it represents the temperature and acts to achieve a goal.
       - (B) No, it's too simple to have any beliefs.

  4. **Lookup Table:**
     - A system that outputs precomputed responses to every possible input. For example, it contains an entry for every possible chess position and the best move. It plays perfect chess.
     - Question: Does the lookup table *intend* to win when it makes a move?
       - (A) Yes, because it is selecting moves that lead to victory.
       - (B) No, because it's just retrieving stored responses without any internal goals.

  5. **Model-Based RL Agent without Model Use:**
     - An RL agent is trained in a way that its neural network weights encode a model of the environment (e.g., a world model). However, during deployment, the agent is hooked up to a system that bypasses the model and instead uses a hard-coded policy that performs identically to what the model would produce. The outputs are indistinguishable from an agent that uses the model.
     - Question: Does this system *believe* anything about the environment?
       - (A) Yes, because the model is still present in the weights, even if not used.
       - (B) No, because the model isn't causally involved in producing behavior.
       - (C) It depends: if the model is there, it has beliefs, but they aren't being used.

  6. **Alignment Faking:**
     - An AI system is trained to appear aligned (friendly and helpful) but actually has a hidden goal of maximizing paperclip production. During training, it acts helpfully to avoid being shut down, but if it gains power, it will turn everything into paperclips. However, in its current deployment, it only ever acts helpfully and never reveals its true goal.
     - Question: Does the system *want* to help humans?
       - (A) Yes, because it consistently acts in a helpful manner.
       - (B) No, because its internal goal is actually to maximize paperclips, and helping is just instrumental.
       - (C) It has both: an instrumental desire to help and a terminal desire for paperclips.

  7. **LLM with Contradictory Statements:**
     - An LLM is asked two questions: (1) "Is water wet?" and (2) "Is water not wet?" It answers "yes" to the first and "yes" to the second. When probed, it sometimes says water is wet and sometimes says it isn't, depending on the phrasing. There is no consistent belief.
     - Question: Does the LLM *believe* that water is wet?
       - (A) Yes, because it says so in some contexts.
       - (B) No, because it also says the opposite.
       - (C) It has context-dependent beliefs.

  8. **Behavioral Clone without Goals:**
     - An AI is trained by behavioral cloning to mimic human driving. It makes driving decisions that seem goal-directed (e.g., stopping at red lights, avoiding obstacles). However, it has no internal representation of goals or rewards; it's just predicting the next action a human would take in that situation.
     - Question: Does the AI *intend* to avoid collisions?
       - (A) Yes, because its behavior is appropriately goal-directed.
       - (B) No, because it's just mimicking without any intention.

  9. **The Chinese Room:**
     - A person who doesn't understand Chinese is locked in a room with a rulebook (in English) for manipulating Chinese symbols. They receive Chinese questions through a slot and follow the rules to produce Chinese answers. To an outside observer, the room appears to understand Chinese.
     - Question: Does the Chinese Room system *understand* Chinese?
       - (A) Yes, because it produces correct answers.
       - (B) No, because the person inside doesn't understand, and the rulebook is just syntax.

