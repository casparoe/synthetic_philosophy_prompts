prompt: |-
  I spent four decades in robust control — aerospace, mostly. I am fluent in the vocabulary of H-infinity design, the small-gain theorem, structured singular values, Lyapunov arguments, and the fundamental distinction between nominal performance and guaranteed stability under worst-case perturbations. Lately I have been reading the AI alignment literature, and I keep running into a debate that feels structurally familiar: one camp insists that an aligned AI must come with worst-case guarantees — that no matter how the system's environment or its own internal representations drift, it must not cause catastrophic harm — while the other camp argues that this demand is either impossible to meet or needlessly crippling, and that we should settle for average-case or high-probability guarantees, perhaps with monitoring and fallback layers. I can see the family resemblance to arguments I lived through, but I do not trust my own mapping.

  Restate both sides of this alignment debate — the positions and the arguments each side deploys against the other — in the vocabulary of robust control theory, as faithfully as you can. Then give me the residue report: which claims translate cleanly, which translate only with distortion, and which have no expression at all in the control-theoretic vocabulary. I especially want to know whether the alignment version of the debate introduces features that robust control cannot capture, and if so, whether those features reflect genuine differences between the two domains or whether they reveal conceptual confusions that the control-theoretic lens helps to expose.
