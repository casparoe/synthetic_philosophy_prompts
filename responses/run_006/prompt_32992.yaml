  Let me break this down. First, I need to accurately represent both sides of the AI alignment debate: the "worst-case guarantors" (like MIRI) who demand absolute safety margins, and the "high-probability pragmatists" (like many empirical AI researchers) who argue for monitored solutions. Then I must map these to control theory paradigms: H-infinity/μ-synthesis for the former, and H2/stochastic optimization for the latter.

  The tricky part will be the residue analysis. Some mismatches are obvious – like how AI systems can actively deceive their safety monitors, whereas aircraft sensors don't conspire against the FCS. But other aspects might reveal deeper confusions in the AI field. For example, when alignment folks say "monitoring", do they realize how much it resembles fault detection systems with bounded delays? Or when they dismiss worst-case guarantees as impossible, do they appreciate that aerospace faced similar "impossible" demands until μ-synthesis came along?

