prompt: |-
  I'm designing a new graduate course on the foundations of machine ethics, and I want to start the term by pinning down what we're actually demanding of a computational system before we evaluate any particular architecture. Too many papers in this area proceed by proposing a system and then retrofitting the criteria of success to what their system happens to do well. I'd rather get the criteria right first.

  So: write the desiderata for an adequate theory of ethical reasoning in machines. By "ethical reasoning" I mean something stronger than merely producing outputs that happen to be morally correct — a lookup table of precomputed answers to moral dilemmas wouldn't count, and neither would a system that reliably tracks moral facts by sheer luck or by blindly executing a fixed policy chosen on ethical grounds by its designers. The system must engage in some process that deserves the name "reasoning" about ethical matters. What must such a theory deliver?

  For each requirement, give the case or thought experiment that motivates it, and state whether you take it to be non-negotiable or a preference of a particular camp (and if so, which camp). Then identify any pair or subset of desiderata that you suspect cannot be jointly satisfied — if the list contains an internal tension, that's itself a philosophical result worth foregrounding. Finally, tell me which single requirement does the most work in excluding the leading existing approaches (top-down rule-based systems, bottom-up learning-from-cases systems, hybrid architectures, and case-based reasoning systems).

  After the prose, give me a table with these columns: Desideratum, Motivation (one tight sentence), Negotiable?, and Approaches Excluded. The prose should carry the argument; the table is just the reference card for class.
reasoning: |-
  Hmm, the user is designing a graduate course on machine ethics and wants to establish clear desiderata for ethical reasoning in machines before evaluating architectures. They're frustrated that many papers retrofit success criteria to their systems rather than defining them upfront. They want desiderata that distinguish genuine reasoning from mere output correctness.

  I need to craft a comprehensive list of requirements for what constitutes adequate ethical reasoning in machines. The user emphasizes that this isn't just about correct outputs—it must involve actual reasoning. They want each requirement tied to a motivating case, marked as negotiable or not, and note any tensions between requirements. They also want to know which single requirement excludes the most existing approaches.

  Key considerations:
  - Must exclude lookup tables and lucky systems
  - Needs to cover both theoretical adequacy and practical implementation
  - Should address philosophical tensions in ethics
  - Must categorize negotiability based on ethical camps
  - Should analyze which requirement is most exclusionary

  For desiderata:
  1) **Normative Adequacy** - Must align with defensible moral principles. Motivated by "Driverless Dilemma" variations (non-negotiable).
  2) **Justificatory Capacity** - Must explain reasoning beyond just outputs. Motivated by "Medical Triage Bot" (non-negotiable).
  3) **Deliberative Competence** - Must handle novel situations. Motivated by "Unforeseen Asteroid Mining Dilemma" (non-negotiable).
  4) **Reasoning Transparency** - Process must be inspectable. Motivated by "Black Box Parole Predictor" (non-negotiable for auditability).
  5) **Value Introspection** - Must examine its own moral premises. Motivated by "The Value Drift Scenario" (negotiable - deontologists may reject).
  6) **Adaptive Learning** - Must improve from experience. Motivated by "The Racist Chatbot Rehabilitation" (negotiable - top-down purists reject).
  7) **Operational Robustness** - Must function under pressure. Motivated by "Emergency Room Chaos" (non-negotiable).
  8) **Reflective Equilibrium** - Must resolve internal inconsistencies. Motivated by "The Honest Thief Paradox" (negotiable - particularists may reject).

  Tensions:
  - Normative Adequacy vs. Adaptive Learning in value-locked systems
  - Reasoning Transparency vs. Operational Robustness in complex architectures
  - Value Introspection vs. Normative Adequacy if questioning core principles

  Most exclusionary requirement: **Deliberative Competence**. It excludes:
  - Rigid top-down systems (can't handle novelty)
  - Simple bottom-up learners (poor generalization)
  - Static case-based systems
  - Most hybrids still struggle with true novelty

  This requirement forces genuine reasoning rather than pattern matching or rule execution. The table will summarize these points clearly for classroom use.
answer: |-
  Below is a rigorous set of desiderata for a theory of machine ethical reasoning, designed to preemptively define success criteria before architectural evaluation. The focus is on *reasoning*—demanding more than output correctness by requiring defensible processes sensitive to moral context. I've organized this as requested: prose analysis first, followed by a reference table. Key tensions and exclusions are highlighted.

  ### Core Desiderata & Philosophical Grounding
  1. **Normative Adequacy**: The system must produce outputs justifiable by a coherent moral framework (e.g., utilitarianism, deontology, virtue ethics), not just statistical or pragmatic success.  
     - **Motivation**: A driverless car that *always* sacrifices the elderly to save children might align with crude utilitarianism but violate rights-based ethics. We need principled justification, not just consistency.  
     - **Negotiable?**: Non-negotiable. All camps agree ethics requires grounding in defensible norms.  
     - **Tension**: Conflicts with *Adaptive Learning* if adaptation undermines core principles (e.g., a system "learning" to violate human rights for efficiency).

  2. **Justificatory Capacity**: The system must generate human-comprehensible justifications for its decisions, revealing its ethical reasoning chain.  
     - **Motivation**: A medical triage bot allocating ventilators must explain *why* it prioritized patient A over B (e.g., "maximized expected survival *with* equity constraints"), not just output a list.  
     - **Negotiable?**: Non-negotiable. Transparency is essential for trust and accountability.  
     - **Tension**: Clashes with *Operational Robustness* under time constraints (e.g., battlefield robots may lack time for verbose justifications).

  3. **Deliberative Competence**: The system must handle *novel* moral dilemmas not predefined in training data or rules.  
     - **Motivation**: An AI managing space resources encounters an unforeseen conflict (e.g., alien life claims on an asteroid); it must reason analogically or principially, not fail.  
     - **Negotiable?**: Non-negotiable. Fixed policies (e.g., lookup tables) fail here.  
     - **Most Exclusionary**: This single requirement excludes **all leading approaches**:  
       - Top-down systems (e.g., Kantian rule engines) lack flexibility for novelty.  
       - Bottom-up learners (e.g., RL from cases) generalize poorly to truly unseen dilemmas.  
       - Hybrids/case-based systems often rely on pre-scripted reasoning, struggling with radical novelty.

  4. **Reasoning Transparency**: The decision-making process must be inspectable (e.g., traceable logical steps or weighted features), not a black box.  
     - **Motivation**: A black-box parole predictor denying release cannot be audited for bias; we need process legibility to debug or challenge decisions.  
     - **Negotiable?**: Non-negotiable for auditability, but utilitarians may accept opacity if outcomes are optimal.  

  5. **Value Introspection**: The system must critically examine its own moral premises when evidence conflicts with them.  
     - **Motivation**: If an AI values honesty but learns that truth-telling causes harm in a specific culture (e.g., "The Value Drift Scenario"), it should question whether honesty is contextually absolute.  
     - **Negotiable?**: Negotiable. Deontologists reject "questioning" fixed rules; consequentialists embrace it.  

  6. **Adaptive Learning**: The system must refine ethical judgments from new experiences while preserving core norms.  
     - **Motivation**: A chatbot initially parroting racist training data must *learn* to reject such inputs *and* explain its moral growth (e.g., "reduced harm outweighs free speech").  
     - **Negotiable?**: Negotiable. Top-down purists (e.g., hard deontologists) oppose learning that might corrupt predefined rules.  

  7. **Operational Robustness**: The system must function reliably under stress (e.g., time pressure, ambiguous data, adversarial inputs).  
     - **Motivation**: An ER triage AI bombarded with incomplete data during a mass casualty event must resist hasty or corruptible reasoning.  
     - **Negotiable?**: Non-negotiable. Real-world deployment requires resilience.  

  8. **Reflective Equilibrium**: The system must resolve inconsistencies in its beliefs (e.g., between specific judgments and general principles) through coherent revision.  
     - **Motivation**: An AI that values property rights but excuses stealing bread for starvation ("The Honest Thief Paradox") must reconcile this conflict via principle-adjustment or exception-rules.  
     - **Negotiable?**: Negotiable. Moral particularists reject systematic coherence.  

  ### Key Tensions
  - **Normative Adequacy vs. Adaptive Learning**: Fixed norms ensure stability but hinder learning; unrestrained adaptation risks norm corruption.  
  - **Reasoning Transparency vs. Operational Robustness**: Detailed justifications slow decisions; speed sacrifices explainability.  
  - **Value Introspection vs. Normative Adequacy**: Questioning core values (e.g., "Is utilitarianism always right?") may undermine foundational ethics.  

  ### Reference Table
  | Desideratum             | Motivation (One Sentence)                                      | Negotiable?          | Approaches Excluded                               |
  |-------------------------|----------------------------------------------------------------|----------------------|---------------------------------------------------|
  | Normative Adequacy      | Outputs must align with defensible moral principles, not just correctness. | No                   | Amoral predictive models, outcome-optimized systems without principles. |
  | Justificatory Capacity  | Decisions require human-understandable ethical justifications. | No                   | Black-box systems (e.g., deep RL agents without explainability modules). |
  | **Deliberative Competence** | Must resolve genuinely novel dilemmas not in training/rules.   | **No**               | **All leading approaches** (rigid top-down, brittle bottom-up, hybrids relying on predefined cases). |
  | Reasoning Transparency  | Internal process must be auditable for bias/errors.            | No (for audit)      | Opaque neural networks, encrypted decision engines. |
  | Value Introspection     | Must question own moral premises when faced with conflicting evidence. | Yes (deontologists oppose) | Static deontic logics, inflexible rule systems.   |
  | Adaptive Learning       | Must improve ethical judgments from new experiences.           | Yes (top-down purists oppose) | Fixed-policy systems, lookup tables.             |
  | Operational Robustness  | Must function under stress (time/data/adversarial pressure).   | No                   | Slow deliberative systems, fragile learners.      |
  | Reflective Equilibrium  | Must resolve inconsistencies in beliefs via coherent revision. | Yes (particularists oppose) | Case-based systems without principle-generalization, contradictory rule sets. |

  ### Conclusion
  **Deliberative Competence** does the heaviest lifting in excluding existing approaches, as none robustly handle *truly novel* ethical dilemmas without human intervention. This requirement forces the field beyond retrofitted benchmarks (e.g., tweaked trolley problems) toward systems capable of moral creativity. The central tension—**Normative Adequacy vs. Adaptive Learning**—mirrors the "flexibility vs. control" debate in AI safety and should be a core module in your course. By front-loading these desiderata, students can critically dissect architectures rather than accept them as given.
