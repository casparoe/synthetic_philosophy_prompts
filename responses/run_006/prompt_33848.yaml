answer: |-
  ### Pantoum: The Tortoise's Infinite Premise  

  **1**  
  "I have A, and I have B," Achilles cried.  
  "I grant them both," the Tortoise said, serene.  
  "Then Z must follow—truth you can't deride!"  
  "Yet Z remains unseen."  

  **2**  
  "I grant them both," the Tortoise said, serene.  
  "Then write this down: *If A and B, then Z*."  
  "Yet Z remains unseen."  
  "I grant that too—but Z? Oh no, not free."  

  **3**  
  "Then write this down: *If A and B, then Z*."  
  "Now add this rule: from premises, *Z* flows!"  
  "I grant that too—but Z? Oh no, not free."  
  "Why take that step? No logic force compels!"  

  **4**  
  "Now add this rule: from premises, *Z* flows!"  
  "Call *that* a premise! D!" Achilles raged.  
  "Why take that step? No logic force compels!"  
  "I grant D too—but Z? Still unengaged."  

  **5**  
  "Call *that* a premise! D!" Achilles raged.  
  "Then Z must follow—truth you can't deride!"  
  "I grant D too—but Z? Still unengaged."  
  "I have A, and I have B," Achilles cried.  

