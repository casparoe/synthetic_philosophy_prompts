  Below is a self-contained sidebar example for your article, designed to illustrate how a frequentist and a Bayesian can reach opposite conclusions about a replication study using the same data, due to their statistical frameworks. The example adheres to your constraints: preregistered analyses, no optional stopping or p-hacking, defensible Bayesian prior, plausible psychology effect size, and no elementary errors.

  ---

  **Sidebar: A Tale of Two Statisticians**  
  *How the same replication data can lead to opposite conclusions*

  **The Replication Study**  
  A psychology lab investigates whether a "growth mindset" intervention (Treatment) improves test scores compared to a control activity (Control). Preregistered design:
  - **Sample**: 60 participants randomly assigned to Treatment (\(n_1 = 30\)) or Control (\(n_2 = 30\)).
  - **Outcome**: Test score difference (Treatment minus Control).  
  - **Data** (preregistered and fixed):  
    - Control group: Mean = 100.0, Standard Deviation (SD) = 10.0  
    - Treatment group: Mean = 103.0, Standard Deviation (SD) = 10.0  
    - Observed mean difference (\(\hat{\theta}\)) = 3.0 points.  
  - **Effect size**: Cohen’s \(d = 3.0 / 10.0 = 0.3\) (small-to-medium effect).

  ---

  ### Frequentist Analysis  
  *Preregistered plan*: Two-sample \(t\)-test (two-sided, \(\alpha = 0.05\)) for the mean difference.  
  - Pooled variance: \(s_p = \sqrt{\frac{(29 \times 10.0^2) + (29 \times 10.0^2)}{58}} = 10.0\)  
  - Standard error: \(\text{SE} = s_p \times \sqrt{\frac{1}{30} + \frac{1}{30}} = 10.0 \times 0.258 = 2.58\)  
  - Test statistic: \(t = \frac{3.0}{2.58} = 1.16\)  
  - Degrees of freedom: 58  
  - **\(p\)-value** (two-sided): \(p = 0.25\)  
    - *Interpretation*: If the true effect were zero, there is a 25% chance of observing a difference as extreme as ±3.0 points. Since \(p > 0.05\), we fail to reject the null hypothesis.  
  - **Verdict**: The replication does not confirm the effect.

  ---

  ### Bayesian Analysis  
  *Preregistered plan*: Assume a normal prior for the *standardized effect size* \(\delta\) (Cohen’s \(d\)), based on domain knowledge.  
  - **Prior**: \(\delta \sim \mathcal{N}(0.3, 0.15^2)\)  
    - *Justification*: Meta-analyses of psychological interventions show typical effects cluster around \(d = 0.3\) (median in social psychology). A SD of 0.15 allows for plausible variation (e.g., 95% prior mass between \(d = 0.0\) and \(d = 0.6\)) without being overly informative.  
  - **Convert prior to raw effect \(\theta\)** (using observed SD = 10.0):  
    - \(\theta = \delta \times 10.0\) → Prior for \(\theta\): \(\mathcal{N}(3.0, 1.5^2)\)  
  - **Likelihood**: Data give \(\hat{\theta} \sim \mathcal{N}(\theta, \text{SE}^2) = \mathcal{N}(3.0, 2.58^2)\).  
  - **Posterior for \(\theta\)** (via conjugate normal updating):  
    - Posterior mean = \(\frac{\text{Prior mean}/\text{Prior variance} + \text{Data mean}/\text{Data variance}}{1/\text{Prior variance} + 1/\text{Data variance}} = \frac{3.0 / 1.5^2 + 3.0 / 2.58^2}{1/1.5^2 + 1/2.58^2}\)  
    - Calculate:  
      - Prior precision: \(1/1.5^2 = 0.444\)  
      - Data precision: \(1/2.58^2 = 0.150\)  
      - Posterior mean = \(\frac{(3.0 \times 0.444) + (3.0 \times 0.150)}{0.444 + 0.150} = \frac{1.332 + 0.450}{0.594} = \frac{1.782}{0.594} = 3.0\)  
      - Posterior variance = \(1 / (0.444 + 0.150) = 1 / 0.594 = 1.68\)  
      - Posterior SD = \(\sqrt{1.68} = 1.30\)  
  - **Posterior probability that \(\theta > 0\)**:  
    - \(P(\theta > 0) = 1 - \Phi\left(\frac{0 - 3.0}{1.30}\right) = 1 - \Phi(-2.31) = \Phi(2.31) = 0.989\)  
    - *Interpretation*: Given the data and prior, there is a 98.9% probability the effect is positive.  
  - **Verdict**: The replication supports the effect.

  ---

  ### Why the Disagreement?  
  - **Structural feature**: The Bayesian prior adds external information (typical effect sizes in psychology), shifting the posterior toward a positive effect. The frequentist uses only the data, where uncertainty (SE = 2.58) leads to a non-significant \(p\)-value.  
  - **Sensitivity to prior**: If the Bayesian used a *weakly informative prior* (e.g., \(\delta \sim \mathcal{N}(0, 1^2)\)), the posterior probability would drop to 0.88 (still >75% but less decisive). The defensible prior amplifies confidence by leveraging domain context.  

  ### Sophisticated Critiques  
  - **Frequentist to Bayesian**: "Your prior injects subjectivity. If the true effect were zero, your approach would falsely ‘confirm’ it 98.9% of the time in this analysis. P-values control error rates objectively."  
  - **Bayesian to frequentist**: "Your ‘no effect’ verdict ignores decades of meta-evidence. A \(p\)-value of 0.25 does *not* mean there’s a 25% chance the effect is zero; it misleads readers by conflating evidence with long-run error rates."  

  **The Takeaway**:  
  Statistics isn’t math with one right answer. **Frameworks dictate conclusions**: Frequentists ask, "Is the data extreme if the effect is zero?" Bayesians ask, "How likely is the effect given data *and* prior knowledge?" Both are valid—yet they diverge when data is noisy but aligns with prior wisdom.  

  ---

  ### How to Verify the Numbers  
  - **Frequentist**:  
    - \(t = 1.16\), df = 58 → \(p\)-value via \(t\)-distribution table or software (e.g., `2 * (1 - pt(1.16, 58))` in R).  
  - **Bayesian**:  
    - Posterior mean: \(\frac{(3.0 / 1.5^2) + (3.0 / 2.58^2)}{(1/1.5^2) + (1/2.58^2)} = 3.0\)  
    - \(P(\theta > 0)\): Compute \(z = (0 - 3.0)/1.30 = -2.31\) → Standard normal CDF gives \(P(Z > -2.31) = 0.989\).  

  --- 

  This example isolates the role of statistical philosophy in replication debates. The Bayesian’s defensible prior tips the scales toward confirmation, while the frequentist’s data-only lens does not—a tension that persists even with pristine methods.
