          pt(1.80, df=58, lower.tail=FALSE) * 2
          [1] 0.0776

     So we have:

          p-value = 0.0776

     And for the Bayesian with flat prior:

          We can compute the posterior for θ: N(0.3, 0.1665^2) -> P(θ>0) = 1 - pnorm(0, 0.3, 0.1665) = 1 - pnorm(-1.80) = pnorm(1.80) = 0.964.

