     In fact, the p-value of 0.077 does not mean that the null hypothesis is true with probability 0.077. It means that if the null were true, we would see an effect as extreme as 0.3 (in absolute value) about 7.7% of the time. The Bayesian posterior probability of the effect being positive is about 0.96 with a flat prior. So even without the informative prior, we have a discrepancy between the p-value and the posterior probability.

