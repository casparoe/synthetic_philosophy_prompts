          Frequentist: The Bayesian result is sensitive to the choice of prior. If the prior had been centered at zero (or even negative), the result might have been different. Moreover, the prior used was based on domain knowledge that might be flawed. The frequentist approach avoids this subjectivity.

          Bayesian: The frequentist approach ignores valuable prior information. Moreover, the p-value is often misinterpreted. The Bayesian approach provides a direct probability statement about the effect, which is what we want. The frequentist threshold of 0.05 is arbitrary and leads to a false dichotomy (reject or not) rather than a continuous measure of evidence.

