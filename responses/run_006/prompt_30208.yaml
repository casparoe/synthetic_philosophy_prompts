     The key feature is the use of prior information by the Bayesian. The prior centered at 0.3 (a positive effect) pulled the posterior mean away from zero relative to the observed effect (0.3) and the prior added precision (reduced the posterior standard error). The frequentist, using only the data, found the evidence insufficient to reject the null at the 0.05 level.

