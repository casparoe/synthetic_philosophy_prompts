     The key structural feature is the incorporation of prior information. Without the prior (i.e., with a flat prior), the Bayesian still gets a posterior probability of 96.4% (which is above 95%), but the frequentist does not reject at 5%. This discrepancy between p-values and Bayesian posterior probabilities (under flat priors) is known and is due to the fact that the p-value is not the posterior probability of the null.

     However, in our example, we also showed that an informative prior (that is reasonable) can push the Bayesian posterior probability even higher (to 98.9%). So the prior is doing additional work.

     To summarize the example:

          Data:
            Control group (n=30): mean=0, sd=0.645
            Treatment group (n=30): mean=0.3, sd=0.645

          Frequentist analysis:
            t = 1.80, df=58, p=0.0776 (two-sided) -> do not reject H0 at 0.05 level.

          Bayesian analysis (with prior on standardized effect δ ~ N(0.3,0.2)):
            Posterior probability that the raw effect θ>0 is 0.989.

          Without the informative prior (using a flat prior), the posterior probability is 0.964.

