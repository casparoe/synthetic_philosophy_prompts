        - The p-value is often misinterpreted as the probability that the null is true. In this case, p=0.077 does not mean there is a 7.7% chance the effect is zero. The Bayesian approach gives a direct probability statement about the effect.
        - The frequentist threshold of 0.05 is arbitrary. The observed effect is positive and the data are more consistent with a positive effect than with zero (as shown by the Bayesian analysis even with a flat prior).

