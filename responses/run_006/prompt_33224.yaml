  ### 2. The Rule She Seems to Be Using
  Your friend appears to be applying a **Role-Adjusted Cost-Benefit Threshold Rule**:
  - **Obligatory** if:  
    (a) The action prevents serious harm or provides significant benefit, AND  
    (b) The cost/risk to the agent is low or moderate (not severe), AND  
    (c) It aligns with a specific role-based, relational, or societal duty (e.g., professional responsibilities, promises, or general duties of easy rescue).  
  - **Supererogatory** if:  
    (a) The benefit is significant, BUT  
    (b) The cost/risk to the agent is severe (e.g., high personal risk, major resource sacrifice, or extreme effort), OR  
    (c) It falls outside of a recognized duty (e.g., no role or relationship obligating the action).  
  - **Key nuances from her verdicts**:  
    - "Cost" includes physical risk, financial loss, time/effort, and psychological burden, weighted against the agent's capacity (e.g., a billionaire's wealth makes 1% donation low-cost).  
    - "Severe cost" is defined by a threshold: it becomes severe when it threatens the agent's well-being, livelihood, or life, or when it imposes a burden disproportionate to the agent's role or capacity.  
    - Duties can arise from roles (e.g., doctor on shift), relationships (e.g., promise to a friend), or societal norms (e.g., calling 911 for a stranger), but they are overridden if the cost is severe.  
    - Benefit is "significant" for life-saving, major harm prevention, or upholding important commitments (e.g., keeping a promise).  

