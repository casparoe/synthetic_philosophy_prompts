prompt: |-
  I chair my city's public art commission and we're in a mess. We review about 30 proposals a year — sculptures, murals, installations for parks and plazas — and our five-person committee (two artists, a city planner, a neighborhood rep, and me, a lawyer) has to say yes or no to each one. The problem is our decisions look totally inconsistent from the outside. We'll approve a weird conceptual piece one month and then reject something equally weird the next, and I can't articulate what principle we're using because I'm not sure we have one.

  I read Hume's "Of the Standard of Taste" and it seems like he's got the bones of a solution: there IS a standard, it's just not a simple rule, it's grounded in the joint verdict of people who've developed certain qualities — delicacy of taste, practice, comparison, freedom from prejudice, good sense. But I need someone to turn this into an actual procedure my committee can run. What questions do we ask, in what order? What counts as a sufficient answer to each? Where does the procedure stop and say "this is just a judgment call, own it"? The constraints: we have two hours per meeting, we're looking at renderings and artist statements (not the finished work), and half the committee has no formal art training.

  Then apply the procedure to two hypothetical proposals so I can see how it works: (1) a realistic bronze statue of a local historical figure, technically flawless but completely conventional, and (2) a challenging abstract installation about gentrification that uses demolition materials from a torn-down housing project — half the committee finds it visually repellent, the other half thinks it's the most important thing they've seen all year. I especially want to see a case where the procedure spits out an answer the committee won't like, because if it never does that it's probably just rubber-stamping our gut feelings.
reasoning: |-
  Okay, the user chairs a public art commission that's struggling with inconsistent decisions. They've read Hume's "Of the Standard of Taste" and want a practical procedure based on it. The committee reviews 30 proposals a year with limited time and mixed expertise. They need a clear, step-by-step process that can handle controversial cases and sometimes override gut feelings.

  First, I need to unpack Hume's principles. He emphasizes "true judges" with delicacy of taste, practice, comparison, lack of prejudice, and good sense. Translating this into a civic process means creating structured discussions that cultivate these qualities in the group. The challenge is making it actionable for non-experts within tight timeframes.

  The user's constraints are key: 2-hour meetings, renderings/statements only, half without art training. The procedure must be efficient but thorough. They also want tension points - where the system forces uncomfortable but principled decisions. The gentrification proposal example is perfect for testing this.

  Breaking down the steps: Start with technical competence (Hume's "good sense") as a gatekeeper. Then move to context - how the work interacts with its environment. The comparison phase is crucial but tricky for novices; providing anchor references could help. Prejudice checks need concrete mechanisms like the "flip test." The vote/narrative step ensures accountability when overriding initial reactions.

  For the bronze statue: Technically sound but fails novelty and relevance. The procedure would likely reject it, forcing traditionalists to confront stagnation. Good test case for overriding sentimental preferences.

  For the gentrification piece: Polarizing but strong on all Humean criteria. The procedure should approve it despite visual discomfort, making the "repelled" members articulate why their reaction might be prejudice. Exactly the hard decision the user wants to see.

  The key insight: This isn't about consensus but about constructing a shared framework for disagreement. The chair's role shifts from broker to facilitator of principled debate. The time-saving comes from spending less time on weak proposals and more on nuanced debates where it matters.

  Biggest risk is half-trained committees misapplying steps. Solution: rigorous note-taking and public rationales to build institutional memory. Over time, this shapes the panel into better versions of Hume's "true judges."
answer: |-
  Here’s a practical procedure for your commission based on Hume’s framework, designed for your constraints. It prioritizes **structured deliberation** over rigid rules, forcing the committee to articulate *why* a work succeeds or fails against Hume’s "qualified judge" criteria. The goal is consistency through process, not unanimity.

  **The Humean Deliberation Procedure (90-100 min/proposal):**

  1.  **Initial Silent Review (5 min):**
      *   Members review renderings, artist statement, location plans, budget, and maintenance plan independently.
      *   **Question:** *What is your immediate gut reaction (approve/reject) and one-word reason?* (Not shared yet; for personal reflection).

  2.  **Technical Competence & Durability (Gatekeeper - 10 min):**
      *   **Question:** *Does the work demonstrate technical skill appropriate to its medium and proposed location? Is it structurally sound, durable, and maintainable within the budget?*
      *   **Sufficient Answer:** Consensus (or strong majority) on "Yes" to proceed. If "No," reject with clear technical rationale. (Applies Hume’s "good sense" – practical judgment).
      *   **Who Leads:** City planner (engineering/feasibility), Lawyer (contracts/maintenance), Artists (craft).
      *   **Stop Point:** If rejected here, deliberation ends. (Saves time on non-viable proposals).

  3.  **Contextual Relevance & Harmony (15 min):**
      *   **Question:** *How does the work respond to (challenge, complement, reflect) its specific site – physically, historically, socially? Does it harmonize with or disrupt its environment in a meaningful way?*
      *   **Sufficient Answer:** Specific connections identified (e.g., "Uses materials from demolished factory near site," "Scale disrupts pedestrian flow," "Theme reflects neighborhood history"). Avoid vague "fits/doesn’t fit."
      *   **Who Leads:** Neighborhood Rep (community context), City Planner (urban design), All (historical/social resonance).
      *   **Hume Link:** "Freedom from prejudice" – forces consideration beyond personal preference.

  4.  **Artistic Intent & Communication (15 min):**
      *   **Question:** *Based on the statement and visuals, is the artist’s intent clear? Does the proposed work seem capable of communicating that intent effectively to a diverse public?*
      *   **Sufficient Answer:** Articulation of the perceived intent and a plausible argument about its potential effectiveness (or lack thereof). Not "Do *I* like the intent?" but "Is it *communicated*?"
      *   **Who Leads:** Artists (interpreting intent), Lawyer (clarity of statement), Neighborhood Rep (public accessibility).
      *   **Hume Link:** "Delicacy of taste" applied to discerning intent.

  5.  **Comparative Merit & Novelty (20 min - Crucial Step):**
      *   **Question:** *Compared to other public art we know (locally, nationally, historically – *provide 2-3 specific reference examples*), does this work offer sufficient novelty, skill, or conceptual depth to justify its creation? Or is it derivative, redundant, or trivial?*
      *   **Sufficient Answer:** Specific comparisons made (e.g., "This bronze technique is masterful but less innovative than X sculpture in Y park," "The use of found materials for social commentary is more potent here than in Z installation"). Avoid "It's unique" or "It's been done."
      *   **Who Leads:** Artists (art historical context), All (drawing on collective knowledge). *Chair: Prepares brief reference examples beforehand.*
      *   **Hume Link:** Core of "practice" and "comparison." Forces elevation beyond the immediate.

  6.  **Prejudice & Preconception Check (10 min):**
      *   **Question:** *Are any strong reactions (positive or negative) likely based on personal biases (e.g., style preference, dislike of the theme, artist reputation) rather than the work's merits in context? Do we foresee significant, *unreasonable* public backlash rooted in prejudice, not legitimate critique?*
      *   **Sufficient Answer:** Acknowledgment of personal biases and distinction between legitimate public concern vs. prejudice. Use the "Flip Test": *"If I loved/hated this for the opposite reason, would I still feel the same?"*
      *   **Who Leads:** Lawyer (fairness/equity), Neighborhood Rep (community sensitivities), All (self-reflection).
      *   **Hume Link:** Explicit "freedom from prejudice" check.

  7.  **Holistic Judgment & Vote (15 min):**
      *   **Question:** *Synthesizing steps 2-6, does this work meet the standard of public art worthy of our resources and space? Does it demonstrate sufficient merit across technical, contextual, intentional, comparative, and unbiased considerations?*
      *   **Sufficient Answer:** Final vote (Yes/No). *Mandatory:* Each member states a *brief* (1-2 sentence) rationale referencing the deliberation steps, *especially if their vote contradicts their initial gut reaction (Step 1)*. The Chair summarizes the key points of consensus and divergence for the record.
      *   **Stop Point:** This *is* the judgment call. The process ensures the judgment is informed, deliberate, and articulated against shared criteria. Own the vote.

  **Applying the Procedure to Your Hypotheticals:**

  **Proposal 1: Conventional Bronze Statue**

  1.  **Gut Reaction:** (Likely mixed: "Approve - Safe" / "Reject - Boring")
  2.  **Technical/Durability:** Approve. Flawless technique, bronze is durable. *Passes Gatekeeper.*
  3.  **Context:** Mixed. "Represents local history" (positive) vs. "Adds nothing new to plaza full of similar statues, doesn't engage contemporary context." No strong site-specific response.
  4.  **Intent/Communication:** Clear intent (honor figure), effective communication (recognizable). *Positive.*
  5.  **Comparative Merit:** **Fails.** "Technically excellent but identical in approach to dozens of 19th-century memorials (e.g., local war memorial, statues in Capitol Park). Offers zero novelty in form, material, or conceptual approach compared to contemporary public art practices (e.g., Kehinde Wiley's interventions). Redundant."
  6.  **Prejudice Check:** Acknowledge potential bias *for* tradition/sentimentality or *against* "conservative" art. Distinguish: Rejection isn't prejudice against realism, it's judgment of *lack of merit* via comparison.
  7.  **Judgment/Vote:** **Likely REJECT (3-2 or 4-1).** Rationale: "While technically sound and clear in intent, it fails the comparative merit test spectacularly. It offers no justification for its creation beyond sentimentality when compared to the history of the form or current possibilities. It does not meaningfully engage its contemporary context." *This overrules the initial "safe" gut reaction for some, using the procedure.*

  **Proposal 2: Challenging Gentrification Installation**

  1.  **Gut Reaction:** (Highly polarized: "Approve - Vital!" / "Reject - Ugly!")
  2.  **Technical/Durability:** Scrutinize carefully. Are demolition materials treated/stable? Is the structure safe for public interaction? Maintenance plan for complex materials? *Assume it passes after debate.*
  3.  **Context:** **Strong Pass.** "Material is *literally* from the torn-down project, creating direct physical/historical link. Theme addresses the most pressing social issue impacting this specific neighborhood. Intentionally disruptive form reflects the disruption of gentrification."
  4.  **Intent/Communication:** Clear intent (critique gentrification). Effectiveness debated: "Visceral materials ensure message is unavoidable" vs. "Abstract form might obscure message for some." *Plausible argument for effectiveness wins.*
  5.  **Comparative Merit:** **Strong Pass.** "Uses found materials/social commentary like Oldenburg but with specific local urgency. More confrontational than nearby abstract piece X, but that's necessary for the theme. Offers significant novelty in site-specific materiality and timely relevance compared to most local permanent installations."
  6.  **Prejudice Check:** **Crucial Step.** "Repelled" members must ask: *Is my reaction based on discomfort with the challenging theme/form, or a legitimate artistic flaw?* "Vital" members must ask: *Am I overvaluing the "important" theme and ignoring potential flaws in execution or public alienation?* Distinguish: Legitimate concern about accessibility vs. prejudice against difficult themes or non-traditional aesthetics. Acknowledge potential for public backlash but differentiate reasonable critique from NIMBYism/prejudice.
  7.  **Judgment/Vote:** **Likely APPROVE (3-2 or 4-1).** Rationale: "Despite provoking strong visceral reactions, the work demonstrates exceptional contextual relevance, clear and powerful intent, significant comparative merit through its innovative use of materials and urgent theme, and technical viability. Reactions against its aesthetics or discomfort with its theme do not constitute sufficient grounds for rejection under our criteria, especially given its clear artistic purpose and merit. The challenging nature is integral to its success." *This overrules the "visually repellent" gut reaction, forcing reliance on the Humean criteria.*

  **Key Outcomes:**

  1.  **The Bronze Statue Rejection:** The procedure forces a rejection based on *lack of comparative merit*, likely angering traditionalists or sentimentalists on the committee/public. This demonstrates the system working – it didn't rubber-stamp a "safe" choice lacking artistic justification.
  2.  **The Gentrification Installation Approval:** The procedure forces an approval despite strong negative visceral reactions by demonstrating strength on Humean criteria (especially context, intent, comparison, lack of valid prejudice grounds). This validates the process for proponents and forces detractors to confront the basis of their objection.
  3.  **Own the Judgment Call:** The procedure stops at Step 7. The vote *is* the judgment call, but one made after rigorous examination against defined criteria. The recorded rationales provide transparency and consistency over time, even when decisions *seem* inconsistent superficially. Future committees can reference past rationales to understand *why* similar-looking works were judged differently based on context, comparison, or intent.

  **Implementation Tips:**

  *   **Chair Prep:** Provide reference images/examples for Step 5 *before* meetings. Summarize artist statements clearly.
  *   **Timekeeper:** Assign a timekeeper (rotating role) strictly.
  *   **Templates:** Use simple templates for each step to capture key points and rationales.
  *   **Training:** Brief new members on Hume's principles and the procedure's logic.
  *   **Public Rationale:** Use the synthesized rationale from Step 7 as the core of your public decision announcements. "Approved based on exceptional contextual relevance and innovative use of materials..." or "Rejected due to lack of novelty compared to established public art traditions..."
  *   **Evolution:** Review the procedure annually. Does it catch bad decisions? Does it help articulate standards?

  This process won't eliminate disagreement, but it will channel it into structured debate grounded in Hume's principles of qualified judgment, leading to more defensible, consistent, and ultimately better public art decisions.
