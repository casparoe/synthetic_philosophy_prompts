prompt: |-
  You are an expert in decision theory and global priorities research, with deep familiarity with the evidential cooperation in large worlds (ECL) literature. Please think carefully and work through the following request step by step.

  I'm a senior program officer at a large philanthropic foundation focused on global catastrophic risk reduction. We make about 30–40 major grants per year, typically $500K–$5M. Our grant recommendations go to a board that usually defers to our judgment but expects clear, defensible reasoning.

  I've been reading about evidential cooperation in large worlds — roughly, the idea that in a sufficiently large universe, your decision to support or not support a cause provides evidence about what other similarly situated agents will do, and you should therefore act as if you're deciding on behalf of all agents who are evidentially correlated with you. This seems potentially transformative for cause prioritization: a marginal grant to a neglected area might be much more valuable than it first appears if it helps shift the equilibrium across many correlated decision-makers.

  But I'm worried about motivated reasoning and double-counting. It's easy to tell oneself an ECL story that conveniently favors whatever cause one already likes. And I've seen people apply ECL-like reasoning inconsistently — treating other funders as correlated when it helps the case for their preferred cause and ignoring correlation when it doesn't.

  I want a reusable decision procedure — a checklist or flowchart in words — that my team can apply when deciding whether and how to incorporate ECL reasoning into a grant recommendation. The procedure should:

  1. Help us decide whether ECL reasoning is even applicable to a given grant decision (what conditions need to hold?).
  2. If applicable, guide us through estimating the relevant multiplier (how many correlated agents? how strong is the evidential link?).
  3. Flag the points where we're making judgment calls rather than running a mechanical computation.
  4. Include safeguards against motivated reasoning and double-counting.
  5. Be usable by someone who has read the basic ECL literature but isn't a decision theorist — roughly two hours of work per grant.

  Please work through two or three concrete examples applying the procedure, including at least one case where the procedure recommends against applying ECL reasoning even though it's tempting to do so, and one case where it recommends applying it even though it feels uncomfortable. Also tell me what the procedure cannot do — what kinds of cases it will systematically mishandle or leave unresolved.
reasoning: |-
  We are designing a decision procedure for incorporating ECL reasoning into grant decisions. The procedure should be a step-by-step checklist that helps determine when ECL is applicable, how to estimate the multiplier, and how to avoid common pitfalls.

  **Core Idea of ECL in this Context**: When considering a grant to a cause, the fact that we are making this grant might provide evidence that other similar funders (who are "evidentially correlated" with us) are also likely to support similar causes. Therefore, the impact of our grant might be multiplied by the expected number of such correlated funders who will follow our lead. However, we must avoid double-counting and motivated reasoning.

  **Key Conditions for ECL Applicability**:
  1. **Large World**: The universe of possible funders must be large enough that our decision can be seen as part of a larger pattern.
  2. **Evidential Correlation**: There must be a plausible mechanism by which our decision provides evidence about the decisions of others (e.g., because we are part of a community that shares information, or because we are using similar heuristics).
  3. **Neglectedness**: The cause must be sufficiently neglected so that our grant can shift the equilibrium. If the cause is already well-funded, our marginal grant might not change the picture much.
  4. **Strategic Complements**: The actions of different funders should be strategic complements, meaning that more funding from one funder increases the marginal impact of funding from others (e.g., because of coordination or network effects).

  **Procedure: Checklist for ECL Reasoning in Grant Decisions**

  **Step 0: Pre-Conditions for Considering ECL**
     - Is the cause area neglected? (If not, ECL multipliers are likely small because the marginal impact of additional funding is low.)
     - Are there other funders who are likely to be influenced by our decision? (If not, then ECL doesn't apply.)

  **Step 1: Assess Applicability of ECL**
     1.1. **Evidential Link**: How strong is the evidential link between our decision and the decisions of others?
        - *Indicators*: 
          - We are part of a network of funders who share information and often follow each other's leads (e.g., we are a leader in a community of practice).
          - Our grantmaking is public and observed by others who might update their beliefs based on our actions.
          - There is a shared decision-making framework (like ECL) that others are also using, so they might reason similarly.
        - *Judgment Call*: Rate the strength of the evidential link as weak, moderate, or strong. If weak, ECL might not apply.

     1.2. **Correlated Agents**: How many other funders are evidentially correlated with us?
        - Consider the size of the community that might be influenced by our decision. This could be a specific group (e.g., "EA-aligned funders") or a broader set.
        - *Judgment Call*: Estimate the number of funders who might be influenced (N). This is not a precise number but a range (e.g., 5-20, 50-100).

     1.3. **Strategic Complements**: Are the actions of funders strategic complements in this cause area?
        - Example: In a new field, early funding might attract more funders (positive externality). In a mature field, additional funding might crowd out others (negative externality).
        - *Judgment Call*: If actions are strategic substitutes (crowding out), then ECL might not apply or even reverse the effect. If they are complements, then proceed.

     1.4. **Decision Point**: Based on 1.1-1.3, decide whether ECL reasoning is applicable.
        - *Conditions for Applicability*: 
            - Evidential link is at least moderate.
            - Number of correlated agents is non-trivial (say, >5).
            - Actions are strategic complements.
        - If any condition fails, skip ECL and use standard cost-effectiveness.

  **Step 2: Estimate the ECL Multiplier**
     - The ECL multiplier (M) is the factor by which the direct impact of our grant is multiplied due to the expected effect on others.
     - **Formula**: M = 1 + p * (N - 1)
       - Where:
          - `N`: Estimated number of correlated agents (including us). This comes from Step 1.2.
          - `p`: The probability that a correlated agent will fund the cause (or increase funding) conditional on us funding it, minus the probability conditional on us not funding it. This captures the strength of the evidential link.
          - *Note*: The formula assumes that the impact of each agent's funding is additive and of similar magnitude. Adjust if necessary.

     2.1. **Estimate p (Evidential Strength)**:
        - This is the difference in the probability that another funder funds the cause if we fund it vs. if we don't.
        - *How to estimate*:
          - Look at historical examples: Have our past grants in similar areas been followed by others? How often?
          - Consider the mechanism: If we are a trendsetter, p might be high (0.1-0.5). If we are one of many, p might be low (0.01-0.1).
          - *Judgment Call*: Assign a range for p (e.g., 0.05-0.2).

     2.2. **Estimate N (Number of Correlated Agents)**:
        - Use the estimate from Step 1.2. Remember: N includes us and others. So if we estimate 10 correlated funders, then N=10.

     2.3. **Calculate M**:
        - M = 1 + p * (N - 1)
        - Example: If p=0.1 and N=10, then M=1 + 0.1*(9)=1.9.

     2.4. **Adjust for Diminishing Returns**: 
        - If the cause area is small and many funders jump in, the marginal impact per dollar might decrease. We can adjust by reducing the multiplier for the additional funders. However, this is complex. A simple approach is to cap the multiplier at a level where the total funding would start to face diminishing returns.

     2.5. **Sensitivity Analysis**: 
        - Run the calculation with the low, medium, and high estimates for p and N to get a range for M.

  **Step 3: Apply Safeguards Against Biases**
     3.1. **Motivated Reasoning Check**:
        - Ask: "If this grant were going to a cause we were skeptical about, would we still accept this ECL story?" 
        - Require that the same ECL reasoning framework be applied consistently across causes. Document the reasoning and compare with past cases.

     3.2. **Double-Counting Check**:
        - Ensure that the direct impact of the grant (without ECL) is not already capturing the effect of influencing others. For example, if the grant proposal includes a strategy for leveraging our funding to attract others, then that is already included in the direct impact and should not be double-counted in the ECL multiplier.

     3.3. **Reality Check**:
        - Compare the multiplier to historical examples. Is a multiplier of M plausible? Have we seen cases where one grant led to M times the impact via influencing others?
        - If the multiplier is very large (say, >10), require stronger evidence.

     3.4. **Peer Review**: Have another team member (who is not involved in the grant) review the ECL reasoning.

  **Step 4: Final Decision**
     - Multiply the direct cost-effectiveness estimate by M to get the ECL-adjusted cost-effectiveness.
     - Present both the direct and ECL-adjusted estimates to the board, with clear documentation of the reasoning and uncertainties.

  **What the Procedure Cannot Do**:
     - It cannot resolve fundamental uncertainties about the nature of evidential links. In cases where the evidential correlation is highly speculative, the procedure will either reject ECL or produce a wide range of multipliers.
     - It does not handle cases where the actions of correlated agents might have negative effects (e.g., if they fund a harmful variant of the cause).
     - It assumes that the correlated agents are similar in their funding capacity and impact. If they are heterogeneous, the multiplier may be over/underestimated.
     - It does not address acausal cooperation (which is more speculative and less established).

  ---

  **Concrete Examples**:

  **Example 1: ECL Applicable (Uncomfortable Case)**
  - **Grant**: Supporting a new research institute on a novel global catastrophic risk (e.g., asteroid defense) that is currently neglected.
  - **Step 0**: The area is neglected (only a few small funders). There are other funders who might follow.
  - **Step 1**:
    - 1.1. Evidential link: Strong. We are a leader in GCR reduction, and our grants are public. Other funders look to us for signals.
    - 1.2. Correlated agents: We estimate 10-20 major funders in this space who might follow.
    - 1.3. Strategic complements: Yes. Early funding in a new field can attract more talent and funding.
    - Decision: ECL applicable.
  - **Step 2**:
    - 2.1. p: We estimate that if we fund, there's a 20% chance that each of the other funders will also fund (or increase funding) in the next 2 years. If we don't, the chance is only 5%. So p = 0.20 - 0.05 = 0.15.
    - 2.2. N: We use 15 (midpoint of 10-20).
    - 2.3. M = 1 + 0.15*(14) = 3.1.
    - 2.4. We cap M at 5 because of diminishing returns (if too much funding comes in too quickly, it might be wasted). But 3.1 is below 5.
    - 2.5. Sensitivity: If p=0.1 and N=10, M=1.9; if p=0.2 and N=20, M=4.8.
  - **Step 3**:
    - 3.1: We are uncomfortable because we are not sure about asteroid risk, but the ECL reasoning holds under scrutiny.
    - 3.2: The direct impact does not include leveraging (it's a pure research grant), so no double-counting.
    - 3.3: Historical example: Our past grant to a biosecurity institute led to 3x follow-on funding within 2 years. So M=3.1 is plausible.
    - 3.4: Peer review agrees.
  - **Step 4**: We apply a multiplier of 3.1, making the grant more attractive.

  **Example 2: ECL Not Applicable (Tempting but Rejected)**
  - **Grant**: Expanding a well-established program in pandemic preparedness (e.g., PPE distribution) in a region.
  - **Step 0**: The area is not neglected (many funders). But we are tempted to use ECL to justify more funding.
  - **Step 1**:
    - 1.1. Evidential link: Weak. Many funders are already active, and our decision is unlikely to influence others because the field is crowded.
    - 1.2. Correlated agents: Many funders, but they are not correlated with us because they have their own information.
    - 1.3. Strategic complements: No. In fact, if we fund more, others might reduce their funding (crowding out). So actions are substitutes.
    - Decision: ECL not applicable.
  - **Step 3**: Even if we tried to force ECL, we would note:
    - The direct impact may be reduced by crowding out.
    - The multiplier would be less than 1 (negative effect) if we applied it.
  - **Result**: We do not apply ECL. The grant is evaluated on direct impact only.

  **Example 3: ECL Applicable with Caution (Edge Case)**
  - **Grant**: Funding a policy advocacy campaign for AI safety regulation.
  - **Step 0**: The area is somewhat neglected in terms of policy advocacy. There are other funders who might follow.
  - **Step 1**:
    - 1.1. Evidential link: Moderate. Our foundation is respected, but policy advocacy is complex and depends on many factors.
    - 1.2. Correlated agents: There are about 5-10 funders who might be influenced by us.
    - 1.3. Strategic complements: Yes. More funding for advocacy might build momentum and attract more funders.
    - Decision: ECL applicable, but with caution.
  - **Step 2**:
    - 2.1. p: We estimate that without our grant, there's a 10% chance each other funder would fund. With our grant, it becomes 20%. So p=0.1.
    - 2.2. N: 8 (midpoint).
    - 2.3. M=1 + 0.1*7=1.7.
    - 2.5. Sensitivity: p could be as low as 0.05 (M=1.35) or as high as 0.15 (M=2.05).
  - **Step 3**:
    - 3.1: We are cautious because policy advocacy is hard to measure. We avoid overstating.
    - 3.2: The direct impact includes some leveraging (the grantee plans to use our grant to attract others). We reduce the direct impact estimate to avoid double-counting and then apply the ECL multiplier. 
    - 3.3: We cap M at 2.0 because beyond that, it seems too optimistic.
    - 3.4: Peer review suggests being more conservative. We use M=1.5.
  - **Step 4**: We use a multiplier of 1.5.

  **Limitations**:
  - The procedure relies on subjective estimates of p and N. In areas with no track record, these are highly uncertain.
  - It does not account for negative correlations (where our funding might deter others) or competitive dynamics.
  - It assumes linear effects, which may not hold in complex systems.
  - In cases of deep uncertainty about the cause area itself (e.g., novel risks with unknown probabilities), the ECL multiplier might be overshadowed by the uncertainty in the direct impact.

  This procedure should help your team apply ECL reasoning in a structured and defensible way, while avoiding the main pitfalls.
answer: |-
  Below is a reusable decision procedure for incorporating ECL reasoning into grant decisions. It's designed as a step-by-step checklist with built-in safeguards against motivated reasoning and double-counting. The procedure focuses on **practical applicability**, **transparent judgment calls**, and **robustness checks**, and it should be executable by a non-expert in ~2 hours per grant. I'll first outline the procedure, then apply it to three concrete examples, and finally discuss its limitations.

  ---

  ### **ECL Decision Procedure: Checklist & Flowchart**  
  *Use this when evaluating a grant proposal to determine if ECL reasoning should influence the cost-effectiveness estimate.*

  #### **Step 1: Pre-screen for Basic Applicability**  
  *(Skip ECL entirely if these fail)*  
  - **1.1. Neglectedness Check**:  
    - *Condition*: The cause area is highly neglected (e.g., <5 major funders, funding gaps >10x current levels).  
    - *If false*: ECL likely irrelevant (no equilibrium shift possible).  
    - *Judgment call*: Define "neglected" relative to the cause’s scale (use benchmarks like funding databases).  
  - **1.2. Causal Mechanism Check**:  
    - *Condition*: A plausible mechanism exists where your grant could influence others (e.g., your foundation is a visible player, grants are public, or you fund pivotal research that changes norms).  
    - *If false*: ECL inapplicable (no evidential link).  
    - *Safeguard*: List specific mechanisms (e.g., "Our grant will be cited in a high-impact report")—avoid vague claims like "others might follow."  

  → ***Output A***: *If both 1.1 and 1.2 pass, proceed to Step 2. Else, skip ECL.*  

  #### **Step 2: Assess Evidential Correlation Strength**  
  *(Quantify the "evidential link" between your decision and others)*  
  - **2.1. Identify Correlated Agents**:  
    - Define the "reference class" of funders likely correlated with you (e.g., "EA-aligned foundations," "GCR-focused philanthropies").  
    - *Estimate N (number)*:  
      - Start with a base list (e.g., 10–20 funders in your network).  
      - Adjust for overlap: If funders are interdependent (e.g., they share advisors), use a lower *effective N* (e.g., 5–10).  
      - *Judgment call*: Use data (e.g., past co-funding patterns) or conservative heuristics (e.g., "N = known funders in our annual conference attendee list").  
  - **2.2. Estimate Correlation Strength (p)**:  
    - *p = ΔP*: The difference in probability that a correlated funder supports this cause *if you do* vs. *if you don’t*.  
    - *Estimation method*:  
      - Use historical analogs (e.g., "When we funded Cause X, 30% of similar funders followed within 2 years; when we rejected similar proposals, 5% funded independently → *p* = 0.25").  
      - If no data, use a *p* range:  
        - Weak: *p* = 0.01–0.10 (e.g., crowded field, low visibility).  
        - Moderate: *p* = 0.10–0.30 (e.g., you’re a leader in a niche area).  
        - Strong: *p* > 0.30 (e.g., you fund a pivotal project others await).  
    - *Safeguard*: If *p* relies on wishful thinking (e.g., "Others will follow because we’re special"), downgrade to weak.  
  - **2.3. Check for Strategic Complements**:  
    - *Condition*: Funding is synergistic (e.g., your grant enables work that makes others’ grants more effective). If false (e.g., grants are substitutes/crowding-out), ECL may backfire → halt.  
    - *Judgment call*: Ask: "Does more funding here increase or decrease the marginal value of additional dollars?"  

  → ***Output B***: *If N ≥ 5 and p > 0.05, proceed to Step 3. Else, ECL likely negligible.*  

  #### **Step 3: Calculate Multiplier & Adjust for Pitfalls**  
  *(Compute the ECL multiplier M and apply reality checks)*  
  - **3.1. Compute Base Multiplier (M)**:  
    - Formula: **M = 1 + p(N − 1)**  
      - *M* = 1 (your grant) + expected additional grants from correlated funders.  
      - Example: *N* = 10 funders, *p* = 0.2 → *M* = 1 + 0.2(9) = 2.8.  
  - **3.2. Adjust for Diminishing Returns**:  
    - If total funding after your grant could exceed the "saturation point" (e.g., cause no longer neglected), cap *M* at the point where marginal impact drops sharply.  
    - *Judgment call*: Estimate saturation from expert surveys or funding targets.  
  - **3.3. Motivated Reasoning Audit**:  
    - **Blind Review**: Have a team member defend the *opposite* decision (e.g., "Argue why ECL *doesn’t* apply here").  
    - **Consistency Test**: Compare to past grants: "Did we apply similar *p/N* estimates to causes we rejected?"  
  - **3.4. Double-Counting Check**:  
    - Ensure the grant’s direct impact doesn’t already include "leveraging" effects (e.g., if the proposal claims it will "catalyze further funding," deduct that from *M*).  
    - *Rule*: If the grantee’s theory of change includes influencing funders, set *M* = 1 + *f*(*p*(N − 1)), where *f* = fraction of influence *not* credited to the grantee (e.g., *f* = 0.5).  

  → ***Output C***: *Final M* (e.g., "M = 2.5 after adjustments"). Use to scale the grant’s cost-effectiveness.  

  #### **Step 4: Decision & Documentation**  
  - **4.1. Uncertainty Rating**: Assign confidence scores (e.g., low/medium/high) to *N*, *p*, and *M*.  
  - **4.2. Board Report**:  
    - State: "We applied ECL because [mechanism from 1.2]."  
    - Disclose: "Judgment calls: *N* = [range], *p* = [range], *M* = [range]."  
    - Flag: "ECL contributes [X]% of total expected value."  
  - **4.3. Fallback**: If ECL estimates are too speculative (e.g., confidence = low), recommend excluding *M* but noting ECL as a qualitative upside.  

  ---

  ### **Examples**  
  #### **Example 1: ECL Recommended (Uncomfortable Case)**  
  **Grant**: $2M for a proof-of-concept for **solar geoengineering risk governance** (neglected, controversial).  
  - **Step 1**:  
    - *1.1*: Neglected? Yes (<$10M total funding; high stakes).  
    - *1.2*: Mechanism? Yes (we’re a leader in climate GCR; our approval signals legitimacy).  
  - **Step 2**:  
    - *2.1*: *N* = 8–12 (major foundations in climate/tech policy). Effective *N* = 8 (high overlap).  
    - *2.2*: *p* = 0.15–0.25 (historical analog: our past climate grants had *p* = 0.2; higher here due to controversy).  
    - *2.3*: Complements? Yes (governance research enables safer deployment).  
  - **Step 3**:  
    - *3.1*: *M* = 1 + 0.2(7) = 2.4 → range 1.56–2.8 (using *p* = 0.15–0.25).  
    - *3.2*: No cap (saturation far off).  
    - *3.3*: Blind review argues: "Controversy may deter followers." We lower *p* to 0.18.  
    - *3.4*: Grantee claims it will "attract funding" → set *f* = 0.7 → *M* = 1 + 0.7*(0.18*7) ≈ **2.0**.  
  - **Result**: Apply *M* = 2.0. *Why uncomfortable?* Cause is polarizing, but ECL holds under scrutiny.  

  #### **Example 2: ECL Rejected (Tempting Case)**  
  **Grant**: $3M for **AI alignment research** (well-known area; team favors it).  
  - **Step 1**:  
    - *1.1*: Neglected? No (>$500M in funding; not capacity-constrained).  
    - *1.2*: Mechanism? Weak (many funders; our $3M won’t shift norms).  
  - **Step 2**: *Halted at Step 1.2*.  
  - **Temptation to Force ECL**: Team argues: "We’re influential—others will copy us!"  
    - **Safeguards catch**:  
      - Neglectedness fails → no room for equilibrium shift.  
      - *p* would be low (<0.05) due to crowded field.  
      - Consistency test: We rejected ECL for similar mature causes.  
  - **Result**: ECL excluded. *Why tempting?* Team biases favor AI causes.  

  #### **Example 3: ECL Applicable but Weak (Edge Case)**  
  **Grant**: $1M for **biosecurity surveillance in Southeast Asia** (moderately neglected).  
  - **Step 1**:  
    - *1.1*: Neglected? Yes (region has 20% of needed funding).  
    - *1.2*: Mechanism? Weak-moderate (we’re active here, but not unique).  
  - **Step 2**:  
    - *2.1*: *N* = 5–7 (region-focused health funders).  
    - *2.2*: *p* = 0.05–0.10 (past regional grants: 10% follow-on funding).  
    - *2.3*: Complements? Yes (network effects in disease surveillance).  
  - **Step 3**:  
    - *3.1*: *M* = 1 + 0.07(4) ≈ 1.28 → range 1.2–1.4.  
    - *3.3*: Blind review: "Geopolitical factors dominate, not our grant." → *p* = 0.05, *M* = 1.2.  
    - *3.4*: Grantee’s plan includes fundraising → set *f* = 0.6 → *M* = 1.12.  
  - **Result**: *M* = 1.1–1.2 included as a minor factor. Not decisive.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Handle Extreme Uncertainty**:  
     - In causes with no analogs (e.g., novel risks like alien contact), *p/N* estimates are guesswork. The procedure flags this but can’t resolve it.  
  2. **Address Antagonistic Agents**:  
     - If funders have opposing goals (e.g., your grant triggers opposition funding), ECL may not model competition well.  
  3. **Resolve Acausal or Logical Correlation**:  
     - ECL’s "large worlds" can imply acausal links (e.g., simulated agents). This procedure sticks to *evidential* (causal) correlation for practicality.  
  4. **Override Direct Impact Uncertainty**:  
     - If the grant’s direct value is unknown (e.g., frontier tech), ECL multiplies noise → GIGO risk. Procedure can’t fix this.  
  5. **Full Quantification of Network Effects**:  
     - Complex feedback (e.g., your grant influences Grantee X, who influences Funder Y) is oversimplified. Use *M* as a heuristic.  

  ---

  ### **Key Takeaways**  
  - **Use ECL when**: The cause is neglected, you have a clear influence mechanism, and *N/p* can be defended.  
  - **Skip ECL when**: The field is crowded, your influence is weak, or motivated reasoning is detected.  
  - **Always**: Document assumptions, use ranges, and peer-review estimates. This ensures defensible recommendations to your board.  

  This procedure balances ECL’s transformative potential with robustness. It won’t eliminate subjectivity but structures it to reduce bias. For deeper dives, cross-validate with counterfactual impact models or pre-registered grant evaluations.
