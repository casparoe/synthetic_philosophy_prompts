  First, I need to establish the core translation framework. The key is recognizing that credence functions are essentially estimators of truth values (1 for true, 0 for false). Accuracy-first epistemology's dominance argument for probabilism maps directly to admissibility under strictly proper scoring rules - that's the cleanest parallel. 

  But there are wrinkles. When philosophers avoid expected loss and insist on statewise dominance, that's substantively different from statistical practice where we care about risk functions. I'll need to highlight how this philosophical choice makes the argument stronger but less practical. 

  The additive scoring rule requirement in epistemology feels excessive from a statistical viewpoint. In real data analysis, we often use non-additive scores like CRPS when appropriate. The philosopher's insistence on universal additivity might reflect a normative commitment that doesn't translate to statistical practice.

  For conditionalization, the prequential scoring framework offers a statistical counterpart, but with different emphasis. Statisticians care about predictive performance across sequences, while philosophers focus on single-agent coherence. 

  The residue analysis should be thorough:
  - Truth-directedness maps to Fisher consistency
  - Additivity debates reveal philosophical vs operational priorities
  - The inability to express "epistemic ought" in purely statistical terms shows where the projects fundamentally diverge

  The big insight is that accuracy-first epistemology is doing decision theory with artificially constrained action spaces and scoring rules to serve normative goals - it's decision theory for ideal agents pursuing truth alone. This explains many of the divergences from statistical practice where we operate under real-world constraints.
answer: |-
  Let's map accuracy-first epistemology (AFE) onto statistical decision theory (SDT) systematically. I'll use your vocabulary precisely, flag judgment calls, and then address your residue questions. The core SDT framework: **credence functions are estimators of truth values (1/0) of propositions**, **possible worlds are sample points in the state space**, and **inaccuracy measures are scoring rules** evaluated statewise.

  ### Core Translation of AFE to SDT
  1. **Agents & Actions**: An epistemic agent chooses a *decision rule* (credence function \(c: \mathcal{F} \to [0,1]\) over propositions \(\mathcal{F}\)).  
  2. **State Space**: Possible worlds \(w \in \mathcal{W}\) are states of nature. Truth-value of proposition \(X\) is \(v_w(X) \in \{0,1\}\).  
  3. **Loss Function**: A *strictly proper scoring rule* \(S(c(X), v_w(X))\) (e.g., Brier, log score). Total inaccuracy for credence \(c\) at world \(w\) is \(I(c,w) = \sum_{X \in \mathcal{F}} S(c(X), v_w(X))\) (additivity assumed in AFE).  
  4. **Dominance**: A credence \(c\) is **accuracy-dominated** iff \(\exists c'\) such that \(\forall w: I(c',w) < I(c,w)\).  
  5. **Probabilism Argument**:  
     - *AFE Claim*: Non-probabilistic credences are accuracy-dominated; probabilistic ones are not.  
     - *SDT Restatement*: Non-probabilistic credences are **inadmissible** under strictly proper \(S\) for additive inaccuracy. Probabilistic credences are *admissible* (no \(c'\) dominates statewise).  

  ### Judgment Calls in Translation  
  - **Additivity**: AFE assumes inaccuracy sums over propositions. SDT often uses non-additive scores (e.g., CRPS). I map AFE's additivity to SDT's *separable scoring rules*.  
  - **Statewise vs. Expected Dominance**: AFE uses *statewise dominance* (pointwise in \(\mathcal{W}\)). SDT typically uses *risk dominance* (expected loss under distributions). This is a substantive difference (see Residue).  
  - **Credences as Actions**: In SDT, estimators can depend on data, but AFE's credences are *fixed* estimates. Mapping: AFE handles "synchronic" estimation; data enters via *conditionalization* (see below).  

  ---

  ### Residue Report  

  #### (1) Clean Translations  
  - **Dominance for Probabilism**: Your suspicion is correct. The AFE argument is:  
    > *"Under additive strictly proper \(S\), incoherent credences are inadmissible (statewise-dominated); coherent ones are admissible."*  
    This maps exactly. **Nothing lost**: Joyce (1998) and Pettigrew (2016) directly invoke admissibility.  
  - **Proper Scoring Rules**: AFE requires *strictly proper* \(S\) to ensure coherence is uniquely accuracy-optimal *in expectation* (under one's own credence). SDT uses strict propriety for the same: incentivizing honest reporting of beliefs.  

  #### (2) Translations with Distortion  
  - **Statewise Dominance vs. Expected Loss**:  
    - *Distortion*: AFE avoids expectations to appeal to non-probabilistic agents (who lack a probability distribution). SDT assumes a distribution to compute risk.  
    - *Consequence*: AFE's dominance is **stronger** (statewise) but **less practical**. In SDT, admissibility is often defined via risk (e.g., Bayes admissibility), making AFE's argument *too strict* for statistical applications.  
  - **Conditionalization**:  
    - *AFE Claim*: Updating credences via Bayes' rule minimizes *future* inaccuracy when learning evidence.  
    - *SDT Restatement*: Using the posterior minimizes prequential (predictive sequential) score *almost surely* under the prior.  
    - *Distortion*: AFE treats conditionalization as a diachronic norm. SDT sees it as **optimal prediction** (e.g., Dawid's prequential principle). The philosophical "ought" becomes SDT's "minimizes expected loss."  

  #### (3) Claims with No Direct Counterpart  
  - **Truth-Directedness**: AFE requires that if \(c(X)\) is closer to \(v_w(X)\) than \(c'(X)\) for all \(X\), then \(I(c,w) < I(c'(w))\).  
    - *SDT Analog*: **Fisher consistency** (optimal at true value). But SDT doesn't normatively *demand* this; we use inconsistent estimators (e.g., LASSO) when beneficial.  
  - **Additivity**: AFE assumes \(I(c,w) = \sum S(c(X), v_w(X))\).  
    - *SDT View*: Additivity is restrictive. We use non-additive scores (e.g., energy score) for structured outputs. AFE's insistence reflects a commitment to *proposition-wise evaluation* lacking in SDT.  
  - **Normative Weight on Formal Properties**:  
    - AFE treats *strict propriety* and *truth-directedness* as epistemic imperatives. In SDT, these are *practical choices*: e.g., we use improper scores (e.g., linear) for gradient efficiency.  
    - **Limitation?**: SDT is pragmatic: scoring rules are tools. AFE imbues them with normative force, demanding they satisfy axioms (e.g., "propriety as epistemic rationality") that SDT views instrumentally.  

  #### (4) The Big Question: Is There an Inexpressible Claim?  
  - **Claim**: *"Epistemic rationality requires maximizing accuracy *as such*."*  
    - **SDT Expression**: Minimize expected loss under a scoring rule.  
    - **Gap**: SDT is silent on *why* we choose a given \(S\). AFE argues accuracy is the *fundamental epistemic good* (not utility). This **normative primacy** has no SDT counterpart.  
  - **Analysis**:  
    - SDT reduces all norms to loss minimization (parametric or predictive). AFE insists accuracy is *sui generis* (e.g., "accuracy isn't just a utility for truth-seeking agents").  
    - **Operationalization?**: AFE's primacy claim is **not fully operationalized**. It asserts that scoring rules measure "epistemic value," but SDT would ask: *"Value for what purpose?"* The residue is a philosophical stance: epistemology isn't just decision theory with a fixed loss.  

  ---

  ### Summary of Mappings  
  | **Accuracy-First Epistemology** | **Statistical Decision Theory** |  
  |---------------------------------|--------------------------------|  
  | Credence function \(c\) | Estimator \(\delta: \mathcal{W} \to [0,1]^k\) |  
  | Possible world \(w\) | State of nature \(\theta \in \Theta\) |  
  | Inaccuracy \(I(c,w)\) | Scoring rule \(S(\delta(\theta), \theta)\) |  
  | Strict propriety | Incentive compatibility for truthful reporting |  
  | Accuracy dominance | Statewise inadmissibility |  
  | Probabilism | Admissibility under additive strictly proper \(S\) |  
  | Conditionalization | Bayes-optimal prequential updating |  
  | Truth-directedness | Fisher consistency |  
  | Accuracy as fundamental good | Loss minimization as goal |  

  ### Conclusion  
  - **Clean**: Dominance for probabilism, propriety, and conditionalization (as optimal prediction) translate exactly if you accept statewise evaluation.  
  - **Bent**: Statewise dominance is alien to most SDT (which uses risk), and AFE's additivity/truth-directedness are optional in SDT.  
  - **Missing**: The **normative primacy of accuracy**—AFE's core claim that epistemology *just is* accuracy optimization—has no SDT analog. SDT views loss functions as context-dependent tools; AFE treats them as constitutive of epistemic rationality. This isn't a failure of operationalization but a philosophical choice: AFE is SDT with the knobs fixed to "epistemic virtue."  
  - **Insight**: Your physics intuition is apt: AFE is decision theory for **ideal agents with no data**, where the only "action" is reporting beliefs, and the only goal is scoring well against the universe's true state. SDT is messier because it handles data, models, and tradeoffs AFE deliberately avoids.
