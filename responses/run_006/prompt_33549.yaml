prompt: |-
  I've just joined my hospital's clinical ethics committee, and last month we spent two hours on a request from a family whose short-but-healthy fourteen-year-old wants growth hormone, then the very next week we had a request for a cochlear implant for a small child, and somehow half the room thought one of these was clearly "treatment" and the other clearly "enhancement" while the other half thought the exact opposite, and neither side could say what rule they were actually using. So I want something I can bring to the next meeting: a decision tree or taxonomy of the positions on the therapy/enhancement distinction, built from the questions that actually split people, not from the labels.

  Please make the instrument sort people by how they answer concrete cases rather than by which school they already like. The branch nodes should be questions like (but not only) whether the baseline is species-typical functioning, whether the goal is restoring a capacity the person once had or is expected to have, whether the intervention is invasive or reversible, whether it's a drug, a device, or surgery, whether the condition causes present or future suffering, and whether there's a social or disability-rights framing that matters (the Deaf community stuff around cochlear implants, for instance). The leaves should include at least: a strong bioconservative position (natural functioning has intrinsic value), a normal-function or disease-based position (therapy restores normal functioning, enhancement goes beyond it), a welfarist position (what matters is whether it reduces suffering or increases wellbeing), a transhumanist or permissive-enhancement position, and a deflationary position that says the distinction is doing no real work and we should drop it. If any combination of the branching questions has no defenders, say so and say whether you think that's because the position is incoherent, just unattractive, or unexplored; and flag any two leaves the tree can't genuinely seperate. Aim for something a group of non-philosophers (doctors, nurses, a chaplain, a lawyer) could work through in about twenty minutes, with a few concrete cases to anchor it — the growth hormone kid, the cochlear implant, and a student wanting modafinil in exam season would do. I'd rather have a tree with some empty boxes than a neat one that papers over the mess. Oh, and could you write the whole thing in British English? The committee's paperwork uses UK spellings and I keep tripping over it.
reasoning: |-
  Okay, the user is on a hospital clinical ethics committee and needs a practical tool to navigate the therapy vs. enhancement debate. They described two recent cases—growth hormone for a healthy short teen and cochlear implants for a deaf child—where committee members were deeply divided but couldn't articulate their reasoning. Frustrating! They want a decision tree rooted in concrete questions, not abstract labels, to use in their next meeting. 

  First, I need to unpack their core request: they’re drowning in ideological clashes and want a neutral framework to map disagreements. Key asks: 
  - Avoid academic jargon; use UK English (chaplain, not priest; colour, not color). 
  - Anchor in real cases (growth hormone, cochlear implant, modafinil). 
  - Capture all major positions (bioconservative to transhumanist) but show where arguments collapse or overlap. 
  - Admit when the tree has gaps—no forcing false neatness. 
  - Time-boxed to 20 mins for busy clinicians. 

  Hmm... the challenge is designing branches that split opinions meaningfully. Classic philosophical divides (species-typical functioning? suffering reduction?) might not align with how clinicians actually think. I should start with the cases they provided: 
  - For the short teen: Is shortness a "disease"? Or just a social disadvantage? 
  - For the deaf child: Is deafness a disability or cultural identity? Does consent (child vs. parents) muddy it? 
  - Modafinil: Is exam stress "suffering" worthy of intervention? 

  I’ll draft branches around pain points: 
  1. **Baseline**: Species-typical vs. individual expectation? (This separates bioconservatives from welfarists.) 
  2. **Goal**: Restore lost function or boost beyond norm? (Fails for cochlear implants—some see restoration, others see enhancement.) 
  3. **Harm/Suffering**: Present/future? Physical/social? (Welfarists care here; disability advocates reject "suffering" framing.) 
  4. **Intervention type**: Invasive? Reversible? (Clinicians might weigh this heavily—e.g., surgery vs. pills.) 
  5. **Social context**: Stigmatised condition? Community impact? (Crucial for Deaf culture.) 

  ...But wait, the cochlear implant case breaks almost every branch. Disability advocates see it as erasure; doctors as therapy. The tree must expose this tension, not resolve it. I’ll add a "Disability Critique" leaf explicitly. 

  Potential pitfalls: 
  - Overcomplicating. Must cap at 5-6 questions. 
  - False dichotomies. E.g., "suffering" is subjective—add a "Whose judgement?" sub-question. 
  - UK phrasing: "Healthcare professional" not "physician," "anaemia" not "anemia." 

  Final design: A flowchart ending with 5 positions, but with caveats: 
  - **Bioconservative**: "Natural=good" → likely against all enhancements. 
  - **Normal-function**: Therapy only if statistically abnormal + harmful. 
  - **Welfarist**: Suffering reduction trumps normality—might OK modafinil for exam stress. 
  - **Permissive**: Enhancement is fine if safe/autonomous. 
  - **Deflationary**: "This distinction is useless—ask about risks/consent instead." 

  Highlight overlaps: e.g., welfarist and permissive both OK growth hormone if it prevents bullying. Flag dead ends: No one thinks irreversibly damaging an implant is enhancement. 

  And—crucially—remind them the tree isn’t an answer key. It’s a map to make disagreements legible. Their real job is navigating values, not categorising them.
answer: |-
  Here’s a decision tree/taxonomy for the therapy/enhancement distinction, grounded in concrete questions and designed for clinical ethics committees. It uses UK English and prioritises **case-driven reasoning** over pre-labelled positions. The branches split based on disagreements observed in cases like growth hormone (GH), paediatric cochlear implants (CI), and modafinil for exams. Empty boxes are included where no coherent position exists.

  ---

  ### **Therapy vs. Enhancement Decision Tree**  
  *(Start at Question 1 for each case)*  

  **Question 1: Is the intervention primarily intended to address a condition causing significant present or future suffering/disadvantage?**  
  - *Examples:*  
    - GH for short stature: *Disadvantage?* Bullying, social stigma.  
    - CI for deaf child: *Suffering?* Social isolation, communication barriers.  
    - Modafinil for exams: *Suffering?* Academic stress, but no underlying pathology.  

    - **YES (addresses suffering/disadvantage)** → Go to Q2.  
    - **NO (aims solely to augment "typical" function)** → Go to **Leaf: Permissive Enhancement (Transhumanist)**.  
      - *Position:* Interventions are ethical if benefits outweigh risks, autonomy is respected, and no harm is done. Enhancement is acceptable (e.g., modafinil for exams, GH for confidence).  

  **Question 2: Is the suffering/disadvantage linked to a deviation from species-typical functioning?**  
  *(i.e., statistically atypical for the human species)*  
  - *Examples:*  
    - Deafness (CI): Statistically atypical hearing.  
    - Short stature (GH): May be within typical range (e.g., 155 cm at 14).  
    - Modafinil: No deviation; typical cognitive function.  

    - **YES (atypical function)** → Go to Q3.  
    - **NO (typical function, but causes suffering)** → Go to **Leaf: Welfarist**.  
      - *Position:* What matters is reducing suffering or improving well-being, not statistical norms. Supports GH for bullying or modafinil for exam stress, but not CI if Deaf identity is prioritised.  

  **Question 3: Would the intervention restore a capacity the individual is expected to have, based on their developmental trajectory?**  
  *(i.e., "restoring" a function they once had or should develop)*  
  - *Examples:*  
    - CI: Restores access to sound (if auditory nerves are intact).  
    - GH: Does not "restore" height; short stature may be genetic baseline.  
    - Modafinil: Not restoring lost function.  

    - **YES (restores expected function)** → Go to **Leaf: Normal-Function Therapy**.  
      - *Position:* Therapy corrects deviations from species-typical function (e.g., CI for congenital deafness). Rejects GH for healthy short stature and modafinil.  
    - **NO (creates new/exceeding function)** → Go to Q4.  

  **Question 4: Is the intervention invasive, irreversible, or high-risk?**  
  *(e.g., surgery vs. pills)*  
  - *Examples:*  
    - CI: Invasive surgery, irreversible.  
    - GH: Injections, reversible.  
    - Modafinil: Low-risk pills.  

    - **YES (invasive/irreversible)** → Go to Q5.  
    - **NO (non-invasive/reversible)** → Go to **Leaf: Welfarist** or **Permissive Enhancement**.  
      - *Overlap:* Welfarists/permissive positions may agree on low-risk interventions (e.g., modafinil).  

  **Question 5: Does the "condition" have a socially contested status (e.g., disability rights/cultural identity)?**  
  *(e.g., Deaf community views on CI)*  
  - *Examples:*  
    - CI: Deafness as cultural identity; CI may erase this.  
    - Short stature: No strong identity claim.  
    - Modafinil: Not applicable.  

    - **YES (contested identity)** → Go to **Leaf: Social/Disability Critique**.  
      - *Position:* Rejects "therapy" framing if it pathologises identity (e.g., CI for deaf child is enhancement/imposition). Supports GH if short stature causes suffering.  
    - **NO (no contested identity)** → Go to **Leaf: Bioconservative** or **Normal-Function Therapy**.  
      - *Overlap:* Both oppose "enhancement" but differ on naturalness vs. statistical norms.  

  ---

  ### **Leaf Positions Summarised**  
  1. **Bioconservative**:  
     - *Core:* Natural functioning has intrinsic value. Avoid interventions altering "human essence".  
     - *Case views:* Opposes GH (unnatural), CI ("fixing" deafness), modafinil.  
     - *Path:* Q1 → Q2 (YES) → Q3 (NO) → Q4 (YES) → Q5 (NO).  

  2. **Normal-Function Therapy**:  
     - *Core:* Therapy restores species-typical function; enhancement exceeds it.  
     - *Case views:* Supports CI (restores hearing), opposes GH/modafinil.  
     - *Path:* Q1 → Q2 (YES) → Q3 (YES).  

  3. **Welfarist**:  
     - *Core:* Reduces suffering or improves well-being, regardless of "normality".  
     - *Case views:* Supports GH (if bullying) or modafinil (if severe stress), opposes CI if Deaf identity is harmed.  
     - *Path:* Q1 → Q2 (NO) *or* Q4 (NO).  

  4. **Permissive Enhancement (Transhumanist)**:  
     - *Core:* Enhancement is ethical if autonomous and beneficial.  
     - *Case views:* Supports all three if chosen voluntarily.  
     - *Path:* Q1 (NO) *or* Q4 (NO).  

  5. **Social/Disability Critique**:  
     - *Core:* Distinction perpetuates oppression; focus on social context/consent.  
     - *Case views:* Opposes CI (disrespects Deaf culture), supports GH/modafinil if socially beneficial.  
     - *Path:* Q1 → Q2 (YES) → Q3 (NO) → Q4 (YES) → Q5 (YES).  

  6. **Deflationary**:  
     - *Core:* The distinction is arbitrary; focus on risk/benefit/consent.  
     - *Applies to ALL cases:* Rejects the entire tree.  

  ---

  ### **Key Notes for Your Committee**  
  - **Empty Boxes & Overlaps**:  
    - No path leads *solely* to deflationism—it’s a meta-position rejecting the tree.  
    - **Welfarist** and **Permissive** overlap at Q4 (NO): They agree on low-risk interventions (e.g., modafinil).  
    - **Bioconservative** and **Normal-Function** overlap at Q5 (NO): Both oppose enhancement but for different reasons.  
    - **No coherent position** exists for:  
      - Supporting irreversible enhancement (Q4 YES + Q1 NO). *Why?* Unattractive—high risk for non-essential gains.  
      - Rejecting all interventions (only bioconservatives come close, but they’d support antibiotics).  

  - **Case Anchors**:  
    - **GH for healthy 14 y/o**: Bioconservative/Normal-Function → oppose; Welfarist/Permissive → support if welfare gain.  
    - **Cochlear implant**: Normal-Function → therapy; Social Critique → enhancement/coercion.  
    - **Modafinil for exams**: Welfarist/Permissive → support; others oppose.  

  - **Practical Use**:  
    1. Apply tree to a case (e.g., CI).  
    2. Have members voice where they diverge (e.g., at Q2 for CI: Is deafness "atypical"?).  
    3. Identify which leaf their path leads to.  
    4. Discuss *why* branches split (e.g., "Is suffering defined medically or socially?").  

  This exposes hidden premises (e.g., "Is height a disease?"). It won’t force consensus, but clarifies disagreements. Takes 20 mins if focused on one case.  

  ---  
  **UK Glossary**:  
  - "Ill health" (not "sickness"), "anaemia" (not "anemia"), "paediatric" (not "pediatric"), "benefits outweigh risks" (not "benefits outweigh risks").
