prompt: |-
  I'm completing an advance directive after my brother was declared brain-dead following a car accident. The hospital treated it as death, but I've since learned that a minority of philosophers and clinicians argue that brain death isn't really death — that the organism may still be alive, that the concept of death is contested, or that the legal definition was adopted partly for transplant-policy reasons rather than purely conceptual ones. I need to settle what I actually believe before I check a box that could someday apply to me.

  What is your actual credence that "irreversible cessation of all functions of the entire brain, including the brainstem" is the correct criterion for human death — not merely the legal standard, but the right answer to the question of when a human being has died? Decompose your reasoning into exactly five sub-questions, each with a rough probability and a single sentence of justification. The fifth item should state how you combine them into your overall credence and which sub-question your number is most sensitive to. No introduction or conclusion — just the five numbered items. Use American English.
reasoning: |-
  Okay, the user is grappling with a profound ethical dilemma after their brother's brain death. They're completing an advance directive and need to determine what they personally believe about brain death being equivalent to biological death. This isn't just theoretical - their decision will directly impact their own end-of-life care choices. 

  Hmm, they've clearly done research about the minority views challenging brain death criteria. I should acknowledge those perspectives while providing a structured analysis. The request is very specific: five probability-weighted subquestions leading to an overall credence. Need to maintain that exact format without intros/conclusions.

  First subquestion must address whether brain death equals organismic death. I'll put this at 95% confidence because integrated biological functions cease when the brainstem goes. That's the core scientific argument. 

  Second should tackle irreversibility - 99% here since current medical technology can't reverse total brain necrosis. The "irreversible" part is well-established. 

  Third question covers conceptual validity versus policy convenience. This is where the user's concerns about transplant influence surface. I'll give 85% to death being the primary driver, not organ procurement - though acknowledging some historical entanglement. 

  Fourth addresses mind-body philosophy. 90% on the biological view since consciousness without brain function is medically implausible. This counters those minority philosophical views. 

  For synthesis, I'll multiply the probabilities with organismic death as the most sensitive variable. The overall 70% reflects compounded uncertainty - high but not absolute certainty. 

  Notably, the user's trauma matters here. Their brother's case makes this personal, so the answer must balance scientific rigor with sensitivity. The advance directive context means I should avoid pushing any agenda - just lay out the reasoning so they can decide what "right answer" means to them.
answer: |-
  1.  **Does "irreversible cessation of all functions of the entire brain" reliably indicate the permanent cessation of the integrated functioning of the organism as a whole?** (95%) Brain death criteria correlate strongly with the irreversible loss of critical physiological integration (like respiration, blood pressure regulation, temperature control) previously governed by the brainstem.
  2.  **Is the cessation of brain function truly irreversible with current medical technology?** (99%) Once complete brain necrosis occurs (confirmed by strict clinical and often confirmatory testing protocols), no existing technology can restore integrated neurological function supporting life.
  3.  **Was the brain death standard adopted primarily because it reflects the biological phenomenon of death, rather than primarily for organ transplantation policy convenience?** (85%) While organ transplantation logistics influenced the *timing* and widespread *adoption* of the standard, the underlying biological rationale (loss of organismic integration) was the primary conceptual driver.
  4.  **Is the biological failure of the organism as a whole the correct conceptual foundation for defining death, rather than a higher-brain (consciousness) or cardiopulmonary standard?** (90%) The irreversible loss of the organism's critical integrative functions, centered on the brain, best captures the transition from a living human being to a dead body.
  5.  **Overall credence: 70%.** (Combined via multiplication: 0.95 * 0.99 * 0.85 * 0.90 ≈ 0.72, rounded down for residual philosophical uncertainty; most sensitive to Sub-question 1: organismic integration).
