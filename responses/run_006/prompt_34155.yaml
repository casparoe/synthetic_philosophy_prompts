prompt: |-
  I serve on my university's institutional review board, and we have a new protocol that is dividing us. I want to work out what we are committed to given our own past decisions. Here are the consent-relevant rulings from our precedents:

  - We approved a study that concealed its hypothesis — it told participants the research was about visual perception when it actually measured implicit racial bias — but accurately described every task the participant would perform (computer-based categorization tasks and questionnaires). Full debriefing was provided.
  - We rejected a study in which a confederate, posing as a fellow participant in a group problem-solving task, was scripted to make repeated mistakes that visibly frustrated the real participant. The consent form described the ostensible task but did not mention the confederate, and no debriefing was planned.
  - We approved a study that withheld from participants which of three short stories they would read, telling them only that they would read "a short story" and answer comprehension questions. Full debriefing followed.
  - We rejected a study that offered individuals receiving public assistance a payment equivalent to one month's rent for participating in research involving sleep deprivation and painful stimuli, even though the consent form was otherwise complete and accurate.
  - We approved a study that told participants they were interacting with another participant in an adjacent room via computer, when in fact the other participant's responses were generated by a simple computer program. The interaction was limited to choosing numbers in a coordination game, and full debriefing followed.
  - We approved a study that used a confederate posing as a fellow participant in a group discussion about favorite films. The confederate followed a script designed to be unremarkable — expressing commonplace opinions, neither dominating nor withdrawing. The consent form described the discussion but did not mention the confederate, and full debriefing was provided.

  The new proposal is a study on social perception. Participants would be told they are having a video call with another participant in a different room. During the call, each person takes turns answering questions about their hobbies and interests. In reality, the other participant is a pre-recorded video of an actor; the actor's responses are scripted to be warm and engaged but are not responsive to what the participant says. The questions the participant answers are mildly personal — what they like to do on weekends, what kind of music they enjoy, and so on. The consent form accurately describes the video call procedure and the question topics but states that the other person is another study participant. Full debriefing would occur immediately after the session. The study recruits from the general adult population and excludes anyone with a history of social anxiety.

  What should we decide if we want to be consistent with our own precedents? Which of our past decisions is the strongest analog for this case, and which pulls most strongly in the opposite direction? If our precedents genuinely underdetermine the answer, what principle would we be adopting with each choice, and what further case would cleanly distinguish between them?
reasoning: |-
  Okay, I need to help this user figure out whether their institutional review board (IRB) should approve this new study proposal based on their past decisions. The user wants consistency with precedents, so I have to analyze each past case and see how it compares to the new one.

  First, let's list all the precedents again for clarity:

  1. **Approved**: Concealed hypothesis about implicit racial bias but accurately described tasks. Full debriefing.
  2. **Rejected**: Confederate causing frustration; no mention in consent, no debriefing.
  3. **Approved**: Withheld which story they'd read; just said "a short story." Full debriefing.
  4. **Rejected**: High payment for vulnerable people in study with sleep deprivation and pain.
  5. **Approved**: Fake interaction with computer program; described as another participant. Full debriefing.
  6. **Approved**: Confederate in film discussion, unremarkable behavior. Consent didn't mention confederate. Full debriefing.

  Now, the new proposal: Video call with what's presented as another participant, but it's a pre-recorded actor. The actor's responses are scripted and non-responsive, though warm. Questions are mildly personal. Consent says it's another participant, but debriefing is planned. Recruits general adults, excludes those with social anxiety.

  Key elements in the new study: deception about the other person, mild personal questions, full debriefing. Vulnerable populations excluded.

  I need to find the strongest analog. Looking at past approvals:

  - **Precedent 5** is very similar: participants told they're interacting with another person, but it's a computer program. They had debriefing. That was approved.
  - **Precedent 6** also involves a confederate in a discussion, with unremarkable script, and it was approved despite the consent not mentioning the confederate. Debriefing was done.
  - **Precedent 1** had deception about the hypothesis but accurate task description, approved with debriefing.

  For rejections:

  - **Precedent 2** was rejected because the confederate was meant to frustrate participants, and there was no debriefing. That seems different because it involved emotional harm.
  - **Precedent 4** was rejected due to undue influence on vulnerable populations, which isn't the case here.

  So, the new study seems closest to Precedents 5 and 6. In Precedent 5, deception was about the interaction being with a computer, not a person. Precedent 6 had a confederate who was passive. Both had debriefing. The new study uses a pre-recorded actor with non-responsive but warm behavior. The deception is similar: making participants believe they're interacting with a real person.

  But there's a twist: the questions are mildly personal. That could raise autonomy concerns. However, Precedent 6 involved discussions about personal topics like favorite films, which is somewhat similar. The new study's questions about hobbies and music might be slightly more personal, but not extremely so.

  The lack of responsiveness in the new study might be an issue. In Precedent 5, the interaction was a coordination game with numbers, which is less personal. In Precedent 6, the confederate responded to the discussion, even if scripted. Here, the actor's responses aren't responsive to what the participant says, which could make the deception more pronounced if the participant notices.

  But the study excludes people with social anxiety, which might mitigate risks of distress. And full debriefing is planned, which addresses deception afterward.

  Precedent 2 was rejected due to potential harm from frustration and no debriefing. In this new study, the confederate is warm, not frustrating, and debriefing is included. So it shouldn't fall under that rejection.

  Comparing to Precedent 4: that involved vulnerable populations and high payments for high-risk procedures. Here, the population is general adults, exclusion for social anxiety, and the tasks aren't high-risk like sleep deprivation or pain. So that rejection doesn't apply.

  Overall, consistency points toward approval. The deception is similar to approved cases, debriefing is present, and risks seem low. But if the IRB feels uneasy, they might need a new principle about deception in social interactions with personal topics.

  If undetermined, adopting a stricter principle would require no deception about social interactions, while a more lenient one allows it if debriefed and low-risk. A future case could test this by having a confederate who is responsive versus non-responsive to see if that changes the outcome.
answer: |-
  Based on your precedents, **approval is the consistent outcome** for the new proposal, with **Precedent 5 (approved computer program interaction)** being the strongest analog. **Precedent 2 (rejected frustrating confederate)** pulls most strongly in the opposite direction but is distinguishable. Below is a step-by-step analysis for consistency, followed by principles and hypothetical tests if precedents underdetermine the outcome.

  ---

  ### **Key Elements of the New Proposal vs. Precedents**
  | **Aspect**               | **New Proposal**                                                                 | **Strongest Analog (Precedent 5)**                                  | **Contrasting Case (Precedent 2)**                                  |
  |--------------------------|----------------------------------------------------------------------------------|----------------------------------------------------------------------|---------------------------------------------------------------------|
  | **Deception Type**       | Confederate (prerecorded actor) presented as real participant.                  | Confederate (computer program) presented as real participant.        | Confederate presented as real participant (no disclosure).          |
  | **Interaction Risk**     | Mildly personal Qs (hobbies, music); scripted warm but non-responsive replies.  | Low-risk coordination game (numbers); non-responsive computer.       | **High-risk**: Scripted to provoke visible frustration.             |
  | **Consent Accuracy**     | Accurate on tasks/procedure; **deceptive about confederate**.                   | Accurate on tasks/procedure; **deceptive about confederate**.        | Accurate on task; **deceptive about confederate**.                  |
  | **Debriefing**           | Full debriefing planned.                                                        | Full debriefing provided.                                            | **No debriefing planned.**                                          |
  | **Participant Risk**     | Low emotional risk (excludes social anxiety; warm script).                      | Low risk (impersonal interaction).                                   | **High risk** (deliberate frustration).                             |
  | **Vulnerability**        | General adults; excluded vulnerable groups (social anxiety).                    | Unspecified, but likely general population.                          | Unspecified, but no exclusion for emotional vulnerability.          |

  ---

  ### **Analysis of Consistency**
  1. **Strongest Analog: Precedent 5 (Approved)**  
     - Both involve deceiving participants into believing they are interacting with another person when they are not (computer program vs. prerecorded actor).  
     - Both accurately describe tasks but omit the confederate.  
     - Both have low-risk interactions (coordination game vs. scripted Q&A) and include debriefing.  
     - **Why it aligns**: The core issue—**deception about social interaction**—is identical, and your IRB deemed this acceptable when risks were minimal and debriefing occurred. The mild personal questions here are comparable to Precedent 6’s film discussion (approved), which also involved personal opinions.

  2. **Supporting Analog: Precedent 6 (Approved)**  
     - Approved a confederate in a discussion without consent disclosure, with debriefing.  
     - The confederate’s "unremarkable" role parallels the new proposal’s "warm but non-responsive" actor, as neither introduces conflict or distress.  

  3. **Distinguishing the Rejected Precedent 2**:  
     - Precedent 2 was rejected due to **high risk of harm** (deliberate frustration) and **no debriefing**, creating potential for lasting distress.  
     - The new proposal lacks these elements: the actor is warm, questions are benign, debriefing is immediate, and high-risk individuals are excluded. Thus, it does not trigger the same concerns.  

  4. **Other Precedents**:  
     - **Precedent 1 (Approved)**: Supports debriefing as remediating deception about the study’s purpose (here, social perception).  
     - **Precedent 3 (Approved)**: Supports withholding specific stimuli (which story) if debriefed.  
     - **Precedent 4 (Rejected)**: Distinguishable due to **undue inducement** ($ for high-risk procedures) and **vulnerable population**—neither applies here.  

  ---

  ### **If Precedents Underdetermine the Outcome**
  Your precedents slightly favor approval but leave ambiguity about **non-responsive deception in social contexts**. Two principles could emerge:  
  1. **"Low-Risk Social Deception" Principle (Approval)**:  
     - Deception about social interaction is permissible if:  
       - The interaction is low-risk (benign topics, no provocation).  
       - Debriefing is provided.  
       - Vulnerable groups are excluded.  
     - **Future Test Case**: A study with a confederate who is *responsive* (e.g., reacts to participant’s answers) vs. *non-responsive* (like this proposal). If non-responsiveness heightens discomfort (e.g., participants feel ignored), it might shift toward rejection.  

  2. **"Authentic Social Interaction" Principle (Rejection)**:  
     - Deception invalidates consent when it misrepresents **social authenticity** (e.g., pretending a prerecorded actor is real), as this could cause betrayal or distress upon debriefing.  
     - **Future Test Case**: A study using a responsive AI chatbot (not prerecorded) that adapts to participants. If approved, it clarifies that *adaptiveness*—not just low risk—defines acceptable deception.  

  ---

  ### **Recommendation**  
  - **Approve the proposal** to maintain consistency with Precedents 5 and 6. The deception is similar in kind and magnitude, risks are mitigated (exclusions, debriefing), and no precedent establishes that *non-responsiveness* alone tips the scales.  
  - **Require a post-debriefing survey** to assess discomfort (e.g., "Did you feel the other person listened to you?"). This data could inform future rulings on social deception.  

  If the board remains divided, vote on the underlying principle: whether **non-responsive social deception** inherently violates autonomy (rejection) or is remediable by debriefing (approval). A future case testing responsiveness would then resolve the ambiguity.
