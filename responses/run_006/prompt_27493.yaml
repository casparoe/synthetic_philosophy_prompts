prompt: |-
  I'm a retired physicist — spent 35 years in condensed matter, never thought about philosophy till I retired and a friend dragged me to a decision theory reading group. Now I'm hooked, but I still get turned around on some of these puzzles. Last week two members of the group, Clara and Raj, got into a long argument about counterfactual mugging and XOR blackmail, and I've been going back and forth on who's right ever since. I wrote down their exchange as best as I could remember it. Could you go through it move by move and adjudicate? I want to know who's right about which specific claims, where each of them goes wrong (if they do), and who has the better overall position.

  Clara started us off by laying out the standard counterfactual mugging: Omega, a perfect predictor, flips a fair coin. If it comes up tails, Omega asks you for $100. If it comes up heads, Omega gives you $10,000 iff it predicted you would have paid the $100 had the coin come up tails. You find yourself being asked for $100 — so you know the coin came up tails. Clara said you should pay.

  (1) Clara: The policy "pay when asked" nets you an expected $4,950 — half the time you lose $100, half the time you gain $10,000. The policy "refuse when asked" nets you $0. The only way to be the kind of agent who collects the $10,000 in heads branches is to actually pay in tails branches. If you'd refuse now, Omega would have predicted that, and you'd have gotten nothing in the heads branch. So you pay.

  (2) Raj: That's reasoning about a policy before the coin flip, but you're not before the coin flip. You know the coin came up tails. In the actual world, paying loses you $100 and refusing loses you nothing. Refusing strictly dominates. The fact that you'd have wanted to precommit doesn't make a now-dominated action rational — you can't reach into the counterfactual heads branch and collect a reward that was already denied to you.

  (3) Clara: But the dominance argument assumes the heads branch is sealed off. It's not — your decision procedure determines what happens there. Omega's prediction in the heads branch is a logical consequence of what you do in the tails branch. So your action here does reach across, just not causally. If you treat the two branches as independent, you get the wrong answer. This is exactly the point of Newcomb-like problems: there are acausal connections that dominance reasoning misses.

  (4) Raj: OK, but then take XOR blackmail. Omega sends you a letter iff your house has termites XOR you'll pay $1,000. Termite damage costs a million. You get the letter. If you pay, you're out $1,000; if you don't, you might have termites. An evidential decision theorist pays, because paying is evidence you don't have termites. But that's clearly a mistake — you're being pumped for money by a predictor who's exploiting a correlation. The right move is to not pay, because paying doesn't cause the termites to go away. Counterfactual mugging has the same structure: you're being asked to pay for a benefit that's already fixed in a branch you can't affect.

  (5) Clara: They're not the same. In XOR blackmail, whether you get the letter at all depends on your decision — so the set of worlds where you face the choice is selected by your policy. If you compute the expected value of "pay if letter" across all worlds, including ones where no letter arrives, it's actually worse than "don't pay if letter," because "pay" means you get the letter in no-termite worlds and pay $1,000, while "don't pay" means you get the letter only in termite worlds and pay nothing. The EDT agent is making a selection-effect mistake. But in counterfactual mugging, you always face the choice when the coin is tails — there's no selection effect. And across all branches, "pay" genuinely has higher expected value. The two problems have different structures.

  (6) Raj: I don't think the selection effect does the work you think it does. In both cases, you're being asked to take a loss in the branch you actually inhabit, for a benefit that accrues in a branch you don't. In XOR blackmail, the benefit is "not having termites" in the worlds where you don't get the letter — but you already either have termites or you don't. In counterfactual mugging, the benefit is "$10,000" in the heads branch — but the coin already came up tails. The structure is the same: you're paying to have been the kind of person who gets a counterfactual reward. And in both cases, paying doesn't change the facts. You should refuse.

  That's where they left it. I've read the exhange a few times and I can see points on both sides. Can you go through each of the six moves and rate them — who's on solid ground, who's making a mistake, and where the crux of the disagreement really lies? And who do you think has the better overall position?
reasoning: |-
  Okay, I need to help this retired physicist understand the debate between Clara and Raj about counterfactual mugging and XOR blackmail. Let me start by recalling the scenarios. 

  Counterfactual Mugging: Omega flips a coin. Tails, you pay $100; heads, you get $10,000 only if Omega predicted you'd pay on tails. You're asked for $100, so it's tails. Clara says pay, Raj says refuse.

  XOR Blackmail: Omega sends a letter iff you have termites XOR you pay $1000. Termites cost $1M. You get the letter. Clara thinks EDT pays but shouldn't, Raj says don't pay.

  First, Clara's point (1). She argues that paying has higher expected value. Half the time, lose $100; half the time, gain $10,000. Net $4950. Refusing gets $0. Also, paying now makes you the type who gets the reward in heads branches. That makes sense from a precommitment perspective. Raj counters in (2) that since you know it's tails, paying loses $100 now, and refusing does nothing. The heads branch is gone, so dominance says refuse. 

  Hmm, Raj is applying causal decision theory here. But Clara's point in (3) about acausal connections is key. Omega's prediction links the branches. If you refuse now, Omega would have predicted that, so you wouldn't have gotten the money in the heads branch. So your action now does affect the other branch, but logically, not causally. Newcomb-like problems often challenge causal reasoning. 

  Then Raj brings up XOR Blackmail in (4). He says paying is like EDT's mistake—paying doesn't cause termites to go away, just correlates. Similarly, in mugging, paying doesn't cause the reward. Clara distinguishes them in (5): In XOR, getting the letter depends on your policy, creating a selection effect. If you always pay, you get letters in no-termite worlds, paying unnecessarily. But in mugging, the choice only appears on tails, no selection effect. Paying has higher expected value overall. 

  Raj disagrees in (6), saying both involve paying for a benefit in an unreachable branch. But Clara's distinction seems valid. In XOR, the policy affects when the letter is sent, so "always pay" leads to more letters in scenarios where you shouldn't pay. In mugging, the tails scenario always happens, and paying there ensures the heads reward. 

  So Clara is right that the structures differ. XOR has a selection effect; mugging doesn't. Paying in mugging is rational because it's part of a policy with higher expected value, and your action is consistent with the type that gets rewarded. Raj's dominance argument ignores the acausal link via Omega's prediction. 

  Overall, Clara has the better position. Raj's points hold in causal frameworks but miss the acausal aspects central to these problems.
answer: |-
  Let's break down Clara and Raj's exchange move by move, evaluating each claim, identifying where each goes astray (if at all), and determining who has the stronger overall position. The crux lies in how decision theories handle *acausal correlations* and *selection effects*.

  ### **Move-by-Move Analysis**
  **(1) Clara: Policy-Based Expected Value**  
  - **Solid Ground:** Clara is correct that the *ex ante* (pre-coin-flip) expected value of "always pay" is $4,950:  
    - 50% chance (tails): Pay $100 → net -$100.  
    - 50% chance (heads): Receive $10,000 iff predicted to pay → net +$10,000.  
    - EV = (0.5 × -100) + (0.5 × 10,000) = $4,950.  
  - "Always refuse" has $0 EV.  
  - **Why it’s strong:** This aligns with **functional decision theory (FDT)** and **updateless decision theory (UDT)**, which argue that rational agents should optimize over *policies* (commitments to rules) rather than *actions* (context-specific choices). By paying in the tails branch, you "signal" to Omega that you are the type of agent who pays, securing the payoff in the heads branch.  

  **(2) Raj: Dominance Reasoning in the Actual World**  
  - **Mistake:** Raj incorrectly applies **causal decision theory (CDT)**.  
    - He argues: "You *know* the coin is tails → paying costs $100, refusing costs $0 → refusing dominates."  
  - **Flaw:** This ignores the *acausal link* to the heads branch. Omega’s prediction in the heads branch depends *logically* on your behavior in the tails branch. Refusing now implies Omega *would have predicted refusal* in the heads branch, forfeiting the $10,000. Raj treats the branches as causally isolated, but they are correlated via your decision algorithm.  
  - **Partial Insight:** Raj is right that *if* the branches were independent (e.g., if Omega’s prediction were fixed before your choice), CDT would apply. But in this setup, your action affects the prediction retroactively.  

  **(3) Clara: Acausal Connections**  
  - **Solid Ground:** Clara correctly identifies the core lesson of Newcomb-like problems: **dominance reasoning fails when outcomes correlate acausally with actions**.  
    - Omega’s prediction in the heads branch is a *logical consequence* of your decision in the tails branch. Your action "reaches across" via Omega’s flawless prediction.  
  - **Key Strength:** This refutes Raj’s dominance argument. FDT/UDT agents pay because they recognize that their decision algorithm determines outcomes in both branches.  

  **(4) Raj: Equating to XOR Blackmail**  
  - **Mistake:** Raj conflates two distinct problems.  
    - **XOR Blackmail:** Paying *correlates* with not having termites (due to Omega’s letter condition), but it doesn’t *cause* termites to vanish. Evidential decision theorists (EDT) pay, mistakenly treating correlation as control.  
    - **False Analogy:** Raj claims counterfactual mugging has the same structure: "Paying doesn’t cause the $10,000 to appear in the heads branch."  
  - **Flaw:** In XOR blackmail, the *act of deciding to pay* influences whether you receive the letter (a selection effect), making EDT’s reasoning flawed. In counterfactual mugging, you *always* face the choice in tails branches—no selection effect exists.  

  **(5) Clara: Structural Differences**  
  - **Solid Ground:** Clara correctly distinguishes the problems:  
    - **XOR Blackmail:** The set of worlds where you face the choice (receive the letter) depends on your decision rule. If you "always pay," you receive the letter in *no-termite* worlds (losing $1,000 unnecessarily). If you "never pay," you receive the letter only in *termite* worlds (avoiding payment). Thus, "never pay" has better *ex ante* EV.  
    - **Counterfactual Mugging:** You *always* encounter the choice when the coin is tails. Your policy ("pay" vs. "refuse") doesn’t affect whether you face the dilemma—only whether you get rewarded in heads branches.  
  - **Why it Matters:** This shows XOR blackmail involves a **selection effect** (your policy filters which worlds you observe), while counterfactual mugging does not. Paying in mugging genuinely optimizes *ex ante* EV.  

  **(6) Raj: Rebuttal on Branch Isolation**  
  - **Mistake:** Raj doubles down on conflating the problems.  
    - He argues: "In both cases, you pay for a benefit in an unreachable branch."  
  - **Flaw:** He ignores Clara’s key insight: In counterfactual mugging, the "unreachable" heads branch is **acausally controlled** by your decision algorithm. Your action in the tails branch *logically necessitates* the outcome in the heads branch via Omega’s prediction. In XOR blackmail, your payment doesn’t control termites; it only correlates with them.  

  ### **Crux of the Disagreement**
  - **Raj** views both problems through a **causal lens**: "Your action only affects the current branch." This works for XOR blackmail but fails in counterfactual mugging due to Omega’s prediction.  
  - **Clara** adopts an **acausal/policy-based lens**: "Your decision algorithm determines outcomes in all branches where it is instantiated." This handles counterfactual mugging correctly and explains why XOR blackmail differs.  
  - **Key Insight:** Counterfactual mugging hinges on **logical counterfactuals** (what your algorithm *would do* in other branches), while XOR blackmail involves **evidential counterfactuals** (what your action *implies* about hidden states).  

  ### **Who Has the Better Overall Position?**  
  - **Clara is largely correct** about counterfactual mugging: Paying is rational under FDT/UDT, which outperform CDT/EDT in these problems. Her distinction between mugging (no selection effect) and XOR blackmail (selection effect) is precise and defensible.  
  - **Raj is partially correct** about XOR blackmail: Not paying *is* rational there, but he errs in equating it to mugging. His dominance reasoning is valid only if branches are causally independent (which they aren’t in mugging).  

  ### **Recommendation for the Physicist**  
  Clara’s position aligns with modern decision theory (e.g., Yudkowsky’s FDT or MIRI’s UDT), which treats agents as deterministic algorithms across possible worlds. Raj’s view reflects classic CDT, which struggles with predictors like Omega. To resolve the confusion:  
  - Read **"Functional Decision Theory" (Yudkowsky & Soares)** for mugging.  
  - Study **"Smoking Lesion" or "XOR Blackmail"** for EDT’s selection-effect pitfalls.  
  - **Conclusion:** In counterfactual mugging, **pay the $100**. In XOR blackmail, **don’t pay the $1,000**. Clara wins the core debate, but Raj’s caution about correlation vs. causation is well-placed in XOR.
