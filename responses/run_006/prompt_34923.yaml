prompt: |-
  I am the director of a small geopolitical forecasting unit within a policy institute. Twice a year, we produce probability estimates for a set of events — elections, armed conflicts, economic indicators — and these estimates feed directly into our government clients' contingency planning. Our process is inherently forward-looking: we assign a credence now, but we also know that in three months our team will have new sources, new analytical frameworks, and quite possibly a different view. The question I keep wrestling with is: when should I trust my future team's judgment over my current one, and when should I regard the anticipated shift as a sign that something has gone wrong with our present reasoning?

  I have read a little about Van Fraassen's Reflection principle, which says roughly that your current credence in a proposition should equal your expected future credence in it — that you should treat your future self as an expert. But I also know there are cases where this breaks down: you might know you will be drunk, or sleep-deprived, or that you will have forgotten some crucial piece of evidence you now possess. And there are the more subtle puzzles — the Sleeping Beauty problem, cases where you will gain evidence whose character you cannot now anticipate, or cases where you know you will be subject to a systematic bias. I need a procedure my team can actually run, not a theorem.

  Please write me a decision procedure for determining when to defer to an anticipated future credence and when to override it. The procedure should be a checklist or flowchart in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure says "defer," where it says "do not defer," and where it hands the decision to a human because the question cannot be settled by the procedure. The procedure must be usable by analysts with no formal training in epistemology, in under half an hour, for a single forecast. It should be honest about which steps are judgment calls dressed up as procedure. Then apply it to three worked examples: (1) a forecast about an election outcome where we expect to gain high-quality polling data between now and the next review; (2) a forecast where we know the team will be under severe time pressure and fatigue at the next review, and we anticipate that their credence will shift accordingly; (3) a case where the team's current estimate is 70% but we expect the future estimate to be 40% solely because we anticipate a change in team composition — a respected contrarian is joining next month. For each, show what the procedure yields and flag any step where the procedure's answer is one the team will not like.
reasoning: |-
  We are designing a decision procedure for whether to defer to an anticipated future credence (from a future team) or override it. The procedure is in the form of a checklist/flowchart with clear questions and instructions.

  **Decision Procedure: When to Defer to Future Credence**

  **Step 1: Check for Known Information Loss**
     - *Question:* "Will the future team have less information than we currently have? Specifically, are we aware that they will forget, lose access to, or be unable to use any critical piece of evidence that we currently possess?"
     - *Sufficient Answer:* If YES (e.g., a key source will expire, a team member with unique knowledge is leaving without handing over, or we are using a temporary dataset that won't be available later), then **DO NOT DEFER**. 
     - If NO, proceed to Step 2.
     - *Judgment Call:* Determining what counts as "critical" is a judgment call. The team must ask: "If we lost this piece of evidence, would it materially change our assessment?" If the answer is yes, then it's critical.

  **Step 2: Check for Known Deterioration in Reasoning Quality**
     - *Question:* "Do we have strong reason to believe that the future team will be in a worse cognitive state (e.g., due to fatigue, time pressure, emotional stress, or resource constraints) that is likely to impair their judgment for this specific forecast?"
     - *Sufficient Answer:* If YES (e.g., the next review is scheduled during an extreme crunch time, or we know the team will be sleep-deprived due to an overlapping crisis), then **DO NOT DEFER**.
     - If NO, proceed to Step 3.
     - *Judgment Call:* This requires assessing the severity of the impairment and whether it specifically affects this forecast. Mild stress might be acceptable, but severe impairment is not.

  **Step 3: Check for Known Biases or Incentives**
     - *Question:* "Are we aware of any new bias, incentive, or external pressure that will affect the future team but does not affect us now? (e.g., a change in organizational priorities, a new client demand, or a known cognitive bias that will be introduced by a new team member or a change in the environment.)"
     - *Sufficient Answer:* If YES (e.g., we know that a new government contract might create pressure to align with a particular view, or a new team member has a strong ideological stance that is known to skew their analysis on this issue), then **DO NOT DEFER**.
     - If NO, proceed to Step 4.
     - *Judgment Call:* Determining what counts as a significant bias or incentive is subjective. The team must consider if the bias is strong and directly relevant to the forecast.

  **Step 4: Check for Known Improvements in Information or Methods**
     - *Question:* "Will the future team have access to significantly better information, methods, or tools that we don't have now? (e.g., new polling data, advanced models, or expert consultations that are scheduled to occur.)"
     - *Sufficient Answer:* If YES (e.g., we are waiting for a crucial economic report or a new version of a forecasting model that is under development), then **DEFER**.
     - If NO, proceed to Step 5.
     - *Judgment Call:* The team must judge whether the improvements are "significant" enough to warrant deference. If the new data is only marginally better, it might not be sufficient.

  **Step 5: Check for Known Changes in Team Composition (without clear bias or improvement)**
     - *Question:* "Is the change in credence primarily due to a change in team composition that does not clearly fall under Step 3 (bias) or Step 4 (improvement)?"
     - *Sufficient Answer:* If YES (e.g., a new member is joining who has a different but not necessarily biased or more expert view), then this step **HANDS THE DECISION TO A HUMAN**. The procedure cannot settle this automatically because it depends on the credibility of the new member and the team's collective process. The team leader must decide: 
          - If the new member is generally respected and brings valuable perspective, then consider deferring.
          - If the new member's track record is mixed or the change is arbitrary, then do not defer.
     - If the change in credence is not primarily due to team composition, proceed to Step 6.

  **Step 6: Check for Evidence of Current Error**
     - *Question:* "Is there any internal evidence that our current reasoning might be flawed? (e.g., we are aware of a logical gap, inconsistency, or an overlooked factor that the future team is likely to correct.)"
     - *Sufficient Answer:* If YES (e.g., we know we are using an outdated model that the future team will update, or we have identified a flaw in our current analysis that we haven't had time to fix), then **DEFER**.
     - If NO, proceed to Step 7.

  **Step 7: The Default Rule**
     - *Question:* "Having passed all the previous checks without a clear decision, should we default to the Reflection principle?"
     - *Sufficient Answer:* If the future team is expected to have at least as much information, no worse reasoning conditions, no new biases, and no clear current error, then **DEFER**. This is the baseline: treat the future team as an expert.
     - If there are any lingering doubts that don't fit the above categories, then **HANDS THE DECISION TO A HUMAN**. The team leader must weigh the uncertainties.

  **Summary of Outputs:**
     - **DEFER**: Steps 4 and 7 (if reached) and sometimes Step 5 (if human decides to defer).
     - **DO NOT DEFER**: Steps 1, 2, 3.
     - **HANDS TO HUMAN**: Steps 5 and 7 (if there are doubts).

  ---

  **Worked Examples:**

  **Example 1: Election Outcome with High-Quality Polling Data**

  *Scenario:* Current credence: 60% that candidate A wins. We expect the future team to have high-quality polling data that we don't have now.

  *Application:*
     - Step 1: No information loss. (We are not losing any current data; we are adding.) → Proceed.
     - Step 2: No deterioration in reasoning quality. → Proceed.
     - Step 3: No known biases. → Proceed.
     - Step 4: YES, the future team will have significantly better information (new polling). → **DEFER**.

  *Result:* The procedure says to defer to the future team.

  **Example 2: Forecast Under Time Pressure and Fatigue**

  *Scenario:* Current credence: 35% for an armed conflict in region X. We know that at the next review, the team will be under severe time pressure and fatigue due to overlapping crises.

  *Application:*
     - Step 1: No information loss. → Proceed.
     - Step 2: YES, we know the future team will be in a worse cognitive state. → **DO NOT DEFER**.

  *Result:* The procedure says do not defer. We stick with the current credence.

  *Note:* The team might not like this because it means they have to use an older assessment even when a new one is available, but the procedure flags the impairment.

  **Example 3: Change in Team Composition**

  *Scenario:* Current credence: 70% for an economic recession. We expect the future team (with a respected contrarian joining) to have a credence of 40%.

  *Application:*
     - Step 1: No information loss. → Proceed.
     - Step 2: No deterioration. → Proceed.
     - Step 3: We must ask: Is the contrarian bringing a bias? If the team judges that the contrarian has a known, strong bias that is not evidence-based (e.g., always pessimistic about the economy regardless of data), then YES, and we do not defer. However, if the contrarian is known for careful analysis that often challenges groupthink, then it's not necessarily a bias. This is a judgment call. Let's assume we answer NO to Step 3 (we don't classify it as a bias) → Proceed.
     - Step 4: Is the change due to better information or methods? The scenario says solely because of the team composition. So unless the new member brings a new method or data, the answer is NO → Proceed.
     - Step 5: YES, the change is primarily due to team composition. → **HANDS TO HUMAN**.

  *Result:* The procedure does not settle it. The team leader must decide. The leader might consider: 
     - The track record of the contrarian. If they have a history of being more accurate in similar forecasts, then defer. 
     - If the contrarian's view is arbitrary or ideological, then do not defer.

  *Flag:* The team may not like that the procedure doesn't give a clear answer and requires a human judgment. Also, the current team might be reluctant to defer to a view they disagree with.

  ---

  This procedure provides a structured way to evaluate when to defer. It explicitly marks judgment calls and handles common scenarios. It should be executable within half an hour per forecast by analysts without formal training.
answer: |-
  Below is a practical decision procedure for your team, designed as a step-by-step checklist. It incorporates epistemic principles while focusing on operational feasibility. The procedure assumes you have two inputs: (1) your current credence (P<sub>now</sub>), and (2) the credence you expect your future team to hold (P<sub>future</sub>). It outputs **Defer** (adopt P<sub>future</sub> now), **Do Not Defer** (stick with P<sub>now</sub>), or **Human Judgment** (escalate to a team lead). 

  ---

  ### **Decision Procedure: When to Defer to Future Credence**  
  *Execute these steps in order. Stop and output the result if a step gives a conclusive answer.*

  1. **Will the future team lack critical information you have now?**  
     - *Check:* Are they missing data, context, or evidence you possess (e.g., a source expiring, a departing expert’s insight)?  
     - *Sufficient Answer:* **Yes** → Output **Do Not Defer**.  
     - **No** → Proceed to Step 2.  
     - *Judgment Call:* “Critical” means information that would materially alter the forecast if lost. Be strict.  

  2. **Will the future team’s reasoning be impaired?**  
     - *Check:* Are they likely to face fatigue, time pressure, emotional stress, or resource gaps that degrade their judgment?  
     - *Sufficient Answer:* **Yes** (e.g., severe crunch time, sleep deprivation) → Output **Do Not Defer**.  
     - **No** → Proceed to Step 3.  
     - *Judgment Call:* Distinguish mild stress (okay) from severe impairment (not okay).  

  3. **Will new biases or incentives distort their view?**  
     - *Check:* Are they subject to pressures you don’t face (e.g., political interference, confirmation bias from new leadership)?  
     - *Sufficient Answer:* **Yes** → Output **Do Not Defer**.  
     - **No** → Proceed to Step 4.  
     - *Judgment Call:* Focus on *systematic* biases (e.g., institutional groupthink), not routine disagreements.  

  4. **Will they have superior information or methods?**  
     - *Check:* Are they getting better data, models, or tools (e.g., new polls, upgraded analytics)?  
     - *Sufficient Answer:* **Yes** → Output **Defer**.  
     - **No** → Proceed to Step 5.  
     - *Judgment Call:* “Superior” must be substantive (e.g., replacing proxies with direct data).  

  5. **Is the shift solely due to team composition changes?**  
     - *Check:* Is P<sub>future</sub> driven by new members (e.g., a contrarian joining)?  
     - *Sufficient Answer:* **Yes** → Output **Human Judgment**.  
     - **No** → Proceed to Step 6.  
     - *Judgment Call:* If other factors (Steps 1–4) contribute, answer **No**.  

  6. **Is there evidence your current reasoning is flawed?**  
     - *Check:* Do you suspect errors in your model, data, or logic that the future team will fix?  
     - *Sufficient Answer:* **Yes** (e.g., known methodological gaps) → Output **Defer**.  
     - **No** → Proceed to Step 7.  

  7. **Default Rule**  
     - *Check:* If all prior steps are inconclusive, apply the Reflection Principle: treat your future team as an expert.  
     - *Sufficient Answer:* Output **Defer**.  

  ---

  ### **Worked Examples**  
  *Using the procedure above.*

  #### **Example 1: Election Forecast with New Polling Data**  
  - **Scenario**: Current credence: 60% Candidate A wins. Expected future shift to 75% due to high-quality polls arriving before the next review.  
  - **Procedure**:  
    1. **Information loss?** No (polls add data; nothing lost). → Proceed.  
    2. **Impaired reasoning?** No (normal conditions). → Proceed.  
    3. **New biases?** No. → Proceed.  
    4. **Superior information?** Yes (new polls are high-quality and decisive). → **Defer**.  
  - **Result**: Defer to future 75% credence.  
  - **Note**: Step 4 triggers early. Analysts might not like deferring to a higher-confidence view they don’t yet “feel,” but the procedure overrides this.  

  ---

  #### **Example 2: Forecast Under Time Pressure and Fatigue**  
  - **Scenario**: Current credence: 20% chance of conflict in Region X. Expected future shift to 40% due to rushed analysis during a crisis.  
  - **Procedure**:  
    1. **Information loss?** No. → Proceed.  
    2. **Impaired reasoning?** Yes (severe time pressure/fatigue). → **Do Not Defer**.  
  - **Result**: Stick with 20%. Do not adopt future 40%.  
  - **Note**: Step 2 stops the process. The team may not like ignoring new analysis, but the procedure flags impairment as disqualifying.  

  ---

  #### **Example 3: Team Composition Change (Contrarian Joining)**  
  - **Scenario**: Current credence: 70% recession likely. Expected future shift to 40% after a respected contrarian joins.  
  - **Procedure**:  
    1. **Information loss?** No. → Proceed.  
    2. **Impaired reasoning?** No. → Proceed.  
    3. **New biases?** Unclear. The contrarian’s view is unorthodox but not obviously biased. → **No** (proceed).  
    4. **Superior information?** No (shift is due to personnel, not new data). → Proceed.  
    5. **Team composition shift?** Yes (change driven solely by new member). → **Human Judgment**.  
  - **Result**: Escalate to a team lead. The lead must decide:  
    - *If the contrarian has a track record of accuracy*, defer.  
    - *If their view is ideological or inconsistent*, do not defer.  
  - **Note**: Step 5 forces a tough judgment call. The team won’t like ceding control, but the procedure avoids automated deference here.  

  ---

  ### **Key Features for Usability**  
  - **Time**: Takes <30 minutes per forecast (focuses on binary yes/no questions).  
  - **Training**: No epistemology background needed. Analysts only need to understand their own process.  
  - **Honesty**: Judgment calls are explicit (Steps 1, 2, 3, 5). Steps 4 and 6 lean on technical factors.  
  - **Output Clarity**: 3 possible outcomes, with Human Judgment as a release valve for ambiguity.  

  This procedure prioritizes **caution** (rejecting future views if current info/process is superior) and **humility** (deferring when future capabilities are better). It codifies distrust of impairment and bias while endorsing evidence-driven updates.
