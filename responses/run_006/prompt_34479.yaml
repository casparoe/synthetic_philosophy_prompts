prompt: |-
  A friend at my decision theory reading group keeps saying 'free information is like a free option — it can't have negative value, it's a theorem'. He uses this to claim you should always read the opposing side's evidence, always take the medical test, never refuse a survey result. I'm not convinced but I can't quite pin down why. Audit the analogy: give me the correspondence table between free information and free financial options, then the places where the mapping breaks, and tell me what hidden assumptions the option analogy smuggles in — about the agent's computational limits, about commitment, about strategic settings — that Good's theorem itself doesn't need but the analogy makes you think it does. And then say whether the 'no downside' conclusion survives once the disanalogies are on the table.
reasoning: |-
  Okay, the user is in a decision theory reading group and their friend keeps claiming that free information can't have negative value, like a free option. The user isn't convinced but can't articulate why. They want me to audit the analogy between free information and free financial options. 

  First, I need to unpack both concepts. Free financial options give the right but not the obligation to buy/sell at a set price. Their value is non-negative because you can always choose not to exercise. Similarly, Good's theorem says that under ideal conditions, information has non-negative value because you can always ignore it.

  Hmm, the user wants a correspondence table. Let me map the key elements: the option premium is like the cost of information (zero in "free" cases), the strike price corresponds to the decision boundary, expiration is like commitment to use information immediately, and the underlying asset is the world state affecting payoffs.

  But where does this analogy break? *scratches head* The big issues seem to be computational limits, precommitment problems, and psychological/strategic factors. Real people can't instantly recompute optimal strategies like idealized agents. Also, information can alter beliefs in ways that trigger irrational actions even if you "plan" to ignore it. 

  *starts listing disanalogies* 
  1) Information is often "sticky" - once known, it's hard to truly ignore due to cognitive biases 
  2) Processing costs aren't zero - analyzing data takes mental energy 
  3) Principal-agent problems - e.g. a doctor might overreact to test results due to malpractice fears 
  4) Self-signaling - people infer things about themselves from their information-seeking 

  The user's deeper concern might be that their friend is overgeneralizing a technical theorem. They probably want ammunition to show that in real life, free information CAN hurt - like getting anxiety from unnecessary medical tests, or political polarization from consuming opposing media. 

  *checks decision theory literature* Aha! The key is that Good's theorem assumes: 
  - Costless computation 
  - Perfect rationality 
  - No preference changes from information itself 
  - No strategic interactions 

  Once we add human limitations, the "no downside" claim collapses. Should emphasize examples like: 
  - A OCD patient obsessing over meaningless test results 
  - A jury prejudiced by inadmissible evidence they were told to ignore 
  - Algorithmic traders front-running your "free" market data 

  Conclusion: The theorem holds mathematically, but the analogy smuggles in dangerous assumptions about human cognition. Free information absolutely can have negative value in practice. The user's skepticism is justified - they just needed the framework to articulate why.
answer: |-
  Here's a detailed audit of the "free information = free option" analogy, exposing where it breaks and why the "no downside" claim often fails in practice:

  ### Correspondence Table: Free Option ↔ Free Information
  | **Financial Option Element** | **Information Analogy** | **Purpose in Analogy** |
  |------------------------------|--------------------------|------------------------|
  | **Option Premium** | Cost of acquiring information | Both are zero for "free" cases |
  | **Right to Exercise** | Right to use information in decisions | Freedom to act (or not) on new info |
  | **Obligation to Exercise** | N/A | Info can be ignored (like not exercising) |
  | **Strike Price** | Decision boundary/threshold | Point where info changes optimal action |
  | **Underlying Asset Value** | State-dependent payoff of decisions | World states affecting outcomes |
  | **Expiration Date** | Decision timeliness/context window | Info must be used before it expires |
  | **Volatility** | Uncertainty reduction potential | Higher prior uncertainty ≈ higher info value |

  ### Where the Mapping Breaks (Disanalogies)
  1. **Information Has Cognitive & Computational Costs**
     - **Option Analogy:** Exercises instantly at zero cost.
     - **Reality:** Processing/analyzing information requires cognitive effort, time, and computational resources (e.g., parsing a dense medical report). These costs *are* negative value.

  2. **Information Alters Beliefs Inescapably**
     - **Option Analogy:** Choosing not to exercise leaves your position unchanged.
     - **Reality:** You cannot "unsee" information. It may:
       - Trigger irrational anxiety (e.g., false-positive medical tests causing distress)
       - Alter beliefs subconsciously (e.g., exposure to misinformation "sticking" even if rationally dismissed)
       - Change preferences endogenously (e.g., learning a fact that reshapes your values)

  3. **Strategic & Principal-Agent Problems**
     - **Option Analogy:** Single rational agent with full control.
     - **Reality:** Information can be weaponized in multi-agent settings:
       - A doctor might order unnecessary tests to avoid liability (defensive medicine)
       - A political opponent might flood you with "evidence" to waste your time
       - Survey results might commit you to suboptimal actions due to social expectations

  4. **Precommitment Failure**
     - **Option Analogy:** You can costlessly ignore information.
     - **Reality:** Humans suffer from **akrasia** (weakness of will):
       - Knowing opposing evidence may force you into exhausting debates
       - Receiving a survey result might pressure you to act against your original plan
       - Medical test results may compel unnecessary treatments due to anxiety

  5. **Information Quality & Manipulation Risk**
     - **Option Analogy:** Asset value is objective.
     - **Reality:** "Free" information often has hidden costs:
       - Misinformation/biased framing (e.g., "opposing evidence" curated deceptively)
       - Opportunity cost of verifying accuracy
       - Risk of overfitting noise (e.g., acting on statistically insignificant survey results)

  ### Hidden Assumptions Smuggled by the Option Analogy
  The analogy implicitly assumes conditions that **Good's Theorem** (free info has non-negative *expected* value) *does not require* but that are unrealistic:
  1. **Perfect Rationality & Commitment:** Agents can costlessly ignore information or override emotional/subconscious responses.
  2. **Zero Processing Cost:** Analyzing/incorporating information is instantaneous and free.
  3. **State-Independent Preferences:** Learning info doesn't change your utility function (e.g., no regret, envy, or anxiety from knowing).
  4. **Non-Strategic Setting:** No adversarial actors exist to exploit your information-gathering.
  5. **Computational Omnipotence:** Agents can instantly re-optimize decisions post-information.

  ### Does the "No Downside" Conclusion Survive?
  **No.** Once disanalogies are accounted for, free information can easily have negative net value:
  - **Medical Testing:** A false-positive HIV test causes psychological trauma and unnecessary follow-up procedures (costs > benefit of knowing).
  - **Opposing Evidence:** Reading low-quality, bad-faith arguments wastes time and induces frustration (opportunity cost > insight gained).
  - **Surveys:** Learning customer preferences might commit a company to a suboptimal product due to internal politics, even if the survey is flawed.

  ### When the Analogy Holds (and When It Doesn't)
  | **Scenario** | "No Downside" Likely? | Why |
  |--------------|------------------------|-----|
  | **Simple decisions with costless processing** | ✅ | Approximates Good's Theorem (e.g., checking free weather app for picnic) |
  | **High-stakes decisions with trusted info** | ✅ | Value of uncertainty reduction dominates (e.g., free cancer screening for high-risk patients) |
  | **Info from adversarial sources** | ❌ | Risk of manipulation/cognitive pollution |
  | **Emotionally charged contexts** | ❌ | Belief alteration → preference instability (e.g., reading graphic conspiracy theories) |
  | **Resource-constrained agents** | ❌ | Processing cost > decision improvement value |

  ### Key Takeaway
  Good's Theorem is mathematically correct under idealized rationality: free information has non-negative *expected value in the decision problem itself*. But the option analogy obscures **externalities** (cognitive costs, preference changes, strategic risks) and **internal constraints** (computational limits, commitment failures). In practice, these factors routinely render "free" information net harmful. Your intuition is valid: refusing certain information can be profoundly rational. Tell your friend their theorem is correct but their ontology of information is naively incomplete.
