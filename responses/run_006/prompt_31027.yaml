            - Is the policy network deep and with many parameters (suggesting rich representations)?
        - If yes, set Marker B.

     Step 3: **Flexible Avoidance and Conflict**
        - Check logs for:
            - Avoidance of negative rewards in novel states (not just trained states).
            - Trade-offs: e.g., the agent sometimes endures a small negative reward to get a large positive one, or vice versa.
            - Evidence of learned helplessness? (Not avoiding even when possible?) Or persistent avoidance?
        - If we see flexible avoidance and/or conflict, set Marker C.

     Step 4: **Global Workspace**
        - Check if the architecture has a central bottleneck (like a transformer with a fixed context window) that integrates information from multiple sources and broadcasts it. Set Marker D if present.

     Step 5: **Count the Markers**
        - If we have at least two of A, B, C, D, then we hand off to a human for welfare review.
