     - Step 2: Complex internal state? Probably not. It might be a simple Q-table or a small neural net without memory. Marker B: Unlikely.
     - Step 3: Flexible avoidance? The reward is only positive. There is no negative reward. So no avoidance. Marker C: No.
     - Step 4: Global workspace? Unlikely in a simple gridworld agent. Marker D: No.

     Conclusion: No markers. Do not flag.

   Case 2: RLHF Chatbot

     - Step 1: Embodiment? No. It's a language model. No physical body. Marker A: No.
     - Step 2: Complex internal state? Yes. Modern language models are large transformers with billions of parameters and a context window that acts as memory. Marker B: Yes.
     - Step 3: Flexible avoidance? The reward model is trained on human preferences. Negative rewards (low scores) come from outputs that humans dislike. Does the chatbot avoid negative rewards flexibly?
          - We see in training that the model learns to avoid generating harmful or disliked content. And it can do so in novel situations (because it generalizes). Also, there might be trade-offs: e.g., the model might avoid a truthful but hurtful statement. So Marker C: Yes.
     - Step 4: Global workspace? Transformers have a self-attention mechanism that can be seen as a form of global workspace. The entire context is processed and information is integrated. Marker D: Yes.

     We have B, C, D (three markers) but not A. So by our rule (no A but at least two of B,C,D) we flag for welfare review.

   But note: This might be against the engineer's gut? The engineer might think: "It's just a chatbot, it doesn't feel anything." But the procedure flags it.

   What the procedure can't settle: 
     - It can't prove that the system suffers. It only collects markers that are associated with suffering in biological systems. 
     - The ultimate decision about whether to consider the system as having welfare concerns is a value judgment (e.g., how much weight to put on these markers, and how cautious to be).

   We must note: The procedure is designed to be cautious. It might err on the side of flagging.

   Let's write the procedure clearly:

   **Decision Procedure for Flagging AI Systems for Welfare Review**

   Step 1: Embodiment and Harm Relevance (Marker A)
     - Question: Does the system have an embodiment (physical or simulated) that can be damaged, and is negative reward tied to events that cause such damage?
     - How to check: Look at the system design. For physical robots, check if there are sensors for damage (e.g., collision sensors, temperature) and if negative rewards are given for readings that indicate damage. For simulated agents, check if the simulation includes a health metric or integrity metric that when reduced gives negative reward.
     - If yes, set Marker A.

   Step 2: Complex Internal State (Marker B)
     - Question: Does the system have a complex internal state representation, including memory and the capacity to maintain persistent states?
     - How to check: 
          - Look at the architecture: recurrent networks, LSTMs, transformers with a context window (if the context is long enough to matter), or any explicit state representation that is updated over time.
          - Also, if the model has a large number of parameters (e.g., >100 million) and is deep, that's a sign of complexity.
     - If yes, set Marker B.

   Step 3: Flexible Avoidance and Conflict (Marker C)
     - Question: Does the system exhibit flexible, context-dependent avoidance of negative rewards and/or evidence of motivational conflicts?
     - How to check: Look at training logs or evaluation runs.
          - Avoidance: Does the agent avoid negative events in situations that were not seen in training? (e.g., in a new level or scenario)
          - Trade-offs: Does the agent sometimes choose to accept a small negative reward to achieve a larger positive reward? Or vice versa?
          - Conflict: Are there situations where the agent seems to hesitate (in terms of action probabilities) when both positive and negative outcomes are possible?
     - If yes, set Marker C.

   Step 4: Global Workspace (Marker D)
     - Question: Does the system have a central information processing bottleneck that integrates and broadcasts information?
     - How to check: Look for architectures like transformers (which use self-attention to route information) or explicit global workspace architectures. Also, systems that use a fixed-size state vector that is used by all components might qualify.
     - If yes, set Marker D.

   Step 5: Decision Rule
     - If Marker A is set AND at least one of Markers B, C, or D is set -> Flag for welfare review.
     - If Marker A is not set, but at least two of Markers B, C, D are set -> Flag for welfare review.
     - Otherwise, do not flag.

