prompt: |-
  Please take on the role of a professional philosopher specializing in Kant's practical philosophy. I am a retired natural scientist who has recently begun working through Kant's moral theory, and I have encountered something in the famous murderer-at-the-door discussion that I cannot quite make sense of. Before giving your final answer, please think through the interpretive options carefully; if it helps, begin with a brief brainstorm of the different ways one might read the relevant passage.

  Here is my difficulty. Kant maintains that one may not lie to a would-be murderer who asks whether the intended victim is hiding in one's house. In defending this claim, he appears to point out that if you lie, the murderer might nevertheless find the victim because of your lie, and that you could then be held responsible for the death. That looks like an appeal to the harmful consequences of lying. If Kant's reason for condemning the lie depends on the bad outcomes it can cause, then his position seems to collapse into consequentialism, which sits very badly with the rest of his ethics. If, on the other hand, the wrongness of the lie does not depend on those outcomes, why does Kant make so much of them?

  I suspect my question rests on a misunderstanding of what Kant is doing in this passage, and I would be grateful if you would correct any confusion rather than simply answer the question as posed. Please write your response in American English.
