               - The group is divided into teams? Or work as a whole? Since there are 12 people, we can have them work in groups of 3, so 4 groups. Each group is responsible for a part? But then they might not feel the full weight. Alternatively, we can have the whole class work together on one example.

            I think whole class for the first part, then if time, we scale up.

            Timeline (75 minutes):

            1. Introduction (5 minutes): 
                 - "We are going to simulate a reasoning agent in a simple world. You are going to write the rules (in natural language or pseudo-logic) that update the world state when an action is taken. We have a world with two blocks, A and B, and some properties. The action we are going to implement is: toggle the first property of a specific block, say block A."

            2. State representation (5 minutes):
                 - Show the initial state: 
                      Block A: P1=true, P2=false, P3=true, P4=false, P5=true.
                      Block B: P1=false, P2=true, P3=false, P4=true, P5=false.
                      Global: G1=true, G2=false, G3=true, G4=false, G5=true.

                 - Explain that the state is defined by the truth values of 15 predicates.

            3. Effect axiom (5 minutes):
                 - "When we do the action `toggleP1(A)`, what changes? Only P1(A) is toggled. All other properties remain the same."

                 - Write the effect axiom: "After toggleP1(A), P1(A) is not what it was before."

            4. Frame axioms (40 minutes):
                 - "But how do we know that nothing else changes? We have to explicitly state that every other property remains the same. Your task is to write, for every other predicate, a frame axiom that says it doesn't change."

                 - List the 14 other predicates and have them write for each one: "If we do toggleP1(A), then [predicate] remains true if it was true, and remains false if it was false."

                 - They can write in natural language: "After toggleP1(A), P2(A) is the same as before."

                 - They have to write 14 such statements.

                 - After they finish, we then say: "Now, what if we have a different action, say `toggleP1(B)`? We would have to do the same thing: write 14 frame axioms for that action."

                 - Then scale up: "What if we have 3 blocks, 10 properties per block, and 10 global properties? How many frame axioms would we need for one action, say `toggleP1(A)`?"

                   - Answer: 9 (for the other properties of A) + 3*10 - 1 (for the properties of B and C, and including P1(B) to P10(B) and P1(C) to P10(C)) [but note: we don't need to exempt P1(A) because it's not about the same block for others] -> actually, for block B: 10 properties, block C: 10 properties, and global: 10 properties. So 9 (for A's other properties) + 20 (for B and C) + 10 (global) = 39.

                   - But wait, the action only toggles P1(A), so for block B and C, all 10 properties of each remain unchanged? So we need 10 for B and 10 for C -> 20. So 9+20+10=39.

                 - Then ask: "What if we have 10 blocks, 10 properties per block, and 10 global properties? How many frame axioms for `toggleP1` of one block?"

                   - 9 (for the other properties of the same block) + 9*10 (for the other 9 blocks, each with 10 properties) + 10 (global) = 9 + 90 + 10 = 109.

                 - And what if we have more than one action? For example, we might have an action for every property of every block? Then for each action, we need about the same number of frame axioms. So total frame axioms = (number of actions) * (number of frame axioms per action).

                   - Number of actions: 10 blocks * 10 properties = 100 actions.
                   - Total frame axioms: 100 * 109 = 10,900.

                 - This is the combinatorial explosion.

            5. The Yale shooting problem connection (10 minutes):
                 - Explain that in the Yale shooting problem, the issue was that we have to specify that things that are not affected by an action (like a person being alive) remain the same, but when there are exceptions (like if a gun is loaded and you shoot, then the person dies), we need more complex rules.

                 - In our activity, we assumed that every action only changes one thing and leaves everything else untouched. But in the real world, actions can have many indirect effects, and we have to worry about whether the frame axioms are valid.

            6. Debrief (10 minutes):
                 - Relate to the frame problem: the difficulty of specifying what does not change when an action is performed.
                 - Representational frame problem: the sheer number of frame axioms we have to write.
                 - Inferential frame problem: how to efficiently compute what remains the same without checking every frame axiom.

            What will go wrong:

               - Students might say: "Why do we have to write frame axioms for properties that are obviously not affected? Can't we just assume that if it's not mentioned, it doesn't change?" 
                   - Response: That's what we do in many systems (like STRIPS), but in the logical framework (like situation calculus), we have to be explicit. And the point is to show that in a formal logical system, you have to write them all.

               - They might not see the point because the example is artificial.
                   - Response: The real world has many more properties and objects, and the combinatorial explosion becomes unmanageable.

               - They might try to write a single frame axiom: "Everything else remains the same." 
                   - Response: In logic, we have to specify what "everything else" is. How would you write that formally? You'd have to quantify over all other predicates, which is not first-order logic? Or you'd have to list them.

               - They might get bored writing 14 axioms. 
                   - We can have them write a few and then extrapolate.

            To avoid boredom, after they write 2 or 3, we can ask: "How many are there total? 14. And that's for a tiny world. Now imagine..."

            Also, we can have a handout with a list of the 15 predicates and have them check off as they write the frame axioms.

            Another idea: have them work in groups, each group assigned a category (properties of A, properties of B, global) and have them write the frame axioms for their category. Then we put them together and count.

            But for the scaling part, we do as a class.

            What the activity can't capture:

               - The difference between the representational and inferential frame problem: we focused on the representational issue (number of axioms), but the inferential problem is about the computational cost of reasoning with them.

            During debrief, we can explain:

               - Representational frame problem: the problem of having to represent all the things that stay the same.
               - Inferential frame problem: the problem of efficiently inferring what stays the same without having to consider each frame axiom one by one.

            We can mention that the Yale shooting problem is an example of the inferential problem: if we have a default assumption that things stay the same, but then there is an exception (shooting kills), how do we handle the exception without having to explicitly state that the victim is alive after every other action?

            Overall, the activity might be a bit dry, but the moment of horror is when they see the scaling.

            Revised timeline:

            0. Preparation: Handout with the list of predicates and the effect axiom for toggleP1(A).

            1. (5 min) Introduction and state representation.

            2. (5 min) Effect axiom: they write the change for P1(A).

            3. (30 min) Frame axiom writing:
                  - "Now, we must ensure that every other predicate remains unchanged. There are 14 others. Let's split into 3 groups (or 4 if needed): 
                      Group 1: properties of A (except P1): 4 axioms.
                      Group 2: properties of B: 5 axioms.
                      Group 3: global properties: 5 axioms.
                  - Each group writes the frame axioms for their set. They can use the format: 'After toggleP1(A), [predicate] remains the same as before.' 
                  - Then we come together and report. Total: 14.

            4. (10 min) Scaling up:
                  - What if we add block C (with 5 properties)? Then the state has 5 (A) + 5 (B) + 5 (C) + 5 (global) = 20 predicates.
                  - For toggleP1(A): 
                        Group 1: 4 (A's other properties)
                        Group 2: 5 (B) + 5 (C) = 10
                        Group 3: 5 (global)
                        Total: 4+10+5=19.

                  - What if we have 10 properties per block and 10 blocks and 10 global? 
                      Total predicates: 10*10 + 10 = 110.
                      For toggleP1 of one block: 
                           - Other properties of the same block: 9.
                           - Properties of other blocks: 9 blocks * 10 properties = 90.
                           - Global: 10.
                           - Total: 9+90+10=109.

                  - And if we have 100 actions (one for toggling each property of each block), then total frame axioms: 100 * 109 = 10,900.

            5. (10 min) Connect to Yale shooting problem:
                  - In the Yale shooting problem, we have actions: load, wait, shoot.
                  - We have a fluent: alive.
                  - The effect of shoot is: if loaded, then not alive.
                  - But we also need to know that if we don't shoot, alive remains true? That's a frame axiom.
                  - And also that loaded remains true over wait? But wait might cause the gun to become unloaded? We have to specify that it doesn't.
                  - The problem arises when we have many fluents and many actions, and we have to specify all the frame axioms.

            6. (10 min) Debrief:
                  - The frame problem is the problem of how to represent the effects of actions without having to explicitly represent the lack of change for every unaffected fluent.
                  - Solutions: 
                      - STRIPS: only specify changes, and assume everything else remains the same (but then how to handle actions that might affect many things?).
                      - Use of non-monotonic logic (default reasoning) to assume things stay the same unless there's evidence to the contrary.
                  - The activity focused on the representational frame problem, but there's also the inferential problem.

            7. (5 min) Wrap-up and questions.

            This should fit in 75 minutes.

            Let's hope they feel the horror at 10,900 frame axioms.

            Note: We didn't use a blocks world with `on` and `clear` to avoid the complexity of the effects, but we can mention that in the blocks world, even a simple move action requires frame axioms for every other fluent, including the color and weight of every block and the state of the lights, etc.

            We can also mention that in the real world, the number of fluents is huge, so the frame problem is a major obstacle for classical AI planning.

            Finally, the activity is a bit simplified, but it captures the essence of the combinatorial explosion of frame axioms.
answer: |-
  Here’s a designed classroom activity to make students viscerally experience the frame problem through hands-on struggle. The setup forces them to confront the combinatorial explosion of frame axioms in a microworld, culminating in the "moment of horror" you want.

  ---

  ### **Activity: The Frame Problem Toy Factory**
  **Microworld Setup**  
  - **Objects**: 3 simple machines on a factory floor: *Press*, *Drill*, and *Saw*.  
  - **Properties** (boolean states, each must be tracked):  
    1. `PoweredOn` (is the machine on/off?)  
    2. `Overheating` (is the machine overheating?)  
    3. `Occupied` (is a worker using it?)  
    4. `PartInSlot` (is a part loaded?)  
    5. `SafetyCheckPassed` (did it pass inspection?)  
  - **Relations**:  
    1. `Near(M1, M2)` (e.g., *Press* is near *Drill*)  
    2. `ConnectedToGrid` (global: is the factory’s power grid active?)  
  - **Action**: `TogglePower(Machine)`  
    - *Effect*: Flips `PoweredOn` for the target machine (ON→OFF or OFF→ON).  

  **Total Fluents (Predicates)**:  
  - 5 properties/machine × 3 machines = 15  
  - 3 relations (`Near` has 3 possible pairs: Press-Drill, Press-Saw, Drill-Saw)  
  - 1 global fluent (`ConnectedToGrid`)  
  - **Grand Total: 19 fluents**  

  ---

  ### **Rules of the Activity**  
  1. **Goal**: Fully specify the effects of `TogglePower(Press)` so the next state is *completely determined* (no ambiguities).  
  2. **Input**: An initial state (e.g., all machines OFF, not overheating, no parts loaded, safety checks passed, all machines near each other, power grid ON).  
  3. **Task**:  
     - **Step 1**: Write the *effect axiom* for `TogglePower(Press)`.  
       - *Correct answer*: "After `TogglePower(Press)`, `PoweredOn(Press)` is the opposite of its previous state."  
     - **Step 2**: List *frame axioms* for all other fluents.  
       - Each frame axiom must explicitly state: "[Fluent] remains unchanged unless [condition]."  
       - **Catch**: If students miss an axiom, the "simulator" (you) will identify an ambiguity (e.g., "After toggling the Press, is the Saw *still* overheating? Your axioms don’t specify!").  
  4. **Constraints**:  
     - No shortcuts like "everything else stays the same."  
     - Axioms must be machine/fluent-specific (e.g., "`Overheating(Drill)` remains true if it was true, false if false").  
     - Time limit: 30 minutes to complete the list.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Intro & Setup (10 min)**:  
     - Explain the microworld and action. Emphasize: "Your job is to prevent *any* ambiguity in the next state."  
     - Distribute initial state cards (identical to all groups).  
     - Groups (3–4 students each) write effect + frame axioms on posters.  

  2. **Axiom Drafting (30 min)**:  
     - Groups work. Circulate and "test" partial lists:  
       - *Example intervention*: "Your axioms don’t mention `Near(Drill, Saw)`. After toggling, are they still near? What if toggling causes a robot to bump the Saw?"  
     - **Predictable shortcut**: Groups will try to bundle fluents (e.g., "All `Overheating` states stay the same"). *Force them to split these* ("But what if toggling the Press *causes* the Drill to overheat due to shared power? Specify each!").  

  3. **Scaling Nightmare (15 min)**:  
     - After 25 min, pause: "How many axioms have you written? Now, add a 4th machine with 5 properties and 3 new `Near` relations."  
     - Fluents balloon to 27. Calculate the new requirements:  
       - *Effect axiom*: Still 1.  
       - *Frame axioms*: 26 (one per unaffected fluent).  
     - **Horror moment**: "At 10 seconds per axiom, writing 26 axioms takes 4.3 minutes. Now imagine 10 machines (87 fluents → 86 frame axioms = 14 minutes). Real-world AI has *millions* of fluents."  

  4. **Yale Shooting Tie-in (10 min)**:  
     - Present this scenario:  
       - *Initial state*: Gun loaded, agent alive.  
       - *Action sequence*: Wait, then shoot.  
     - Ask: "What’s the obvious outcome? Now, how many frame axioms would you need to *prove* the agent dies? You’d need axioms to ensure:  
       - ‘Loaded’ stays true during ‘Wait’ (no one unloads it).  
       - ‘Alive’ stays true during ‘Wait’ (no heart attack).  
       - The gun doesn’t jam, the agent doesn’t dodge..."  
     - **Key point**: The Yale Shooting Problem shows why even "obvious" outcomes require exhaustive frame axioms—or risk contradictions.  

  5. **Debrief (10 min)**:  
     - **The Frame Problem Unpacked**:  
       - *Representational*: The combinatorial explosion they experienced (n fluents → n-1 frame axioms per action).  
       - *Inferential*: Even *with* axioms, checking all is computationally intractable (the "relevance" problem Dennett highlighted).  
     - **Real AI Implications**:  
       - Situation calculus fails here. Practical solutions (e.g., STRIPS, non-monotonic logics) *assume* persistence unless contradiction—but that creates new problems.  
     - **Structural Gap Note**: The activity emphasizes the *representational* frame problem. For the *inferential* problem, note: "Even if you *have* all axioms, how would an AI efficiently deduce what’s *relevant*? That’s where Dennett’s challenge bites."  

  ---

  ### **Predictable Problems & Solutions**  
  - **"Why can’t we just say ‘only PoweredOn changes’?"**  
    *Response*: "Because logic doesn’t allow ‘only’—you must *prove* nothing else changes. What if toggling power trips the grid? Or vibrates a part loose? You must rule these out."  
  - **Missed conditional effects**:  
    - E.g., Students assume `Overheating` never changes. *Force ambiguity*: "After toggling, the Press is ON and overheating—does this *cause* the Drill to overheat if they share a circuit? Specify!"  
  - **Underestimating relations**:  
    - E.g., They ignore `Near`. *Sabotage*: "After toggling, the Saw is now across the room. Why? You didn’t say `Near` persists."  
  - **Group division of labor fails**:  
    - *Mitigation*: Assign roles (e.g., "Machine 1 expert," "Relations manager") to avoid overlap gaps.  

  ---

  ### **Why This Works**  
  - Students *physically experience* writing dozens of axioms and hitting scaling limits.  
  - The Yale Shooting demo connects their frustration to a canonical failure.  
  - The debrief flags what’s missing (inferential relevance) so you can bridge to Dennett.  
  - **Outcome**: They’ll leave groaning about frame axioms—mission accomplished.
