  Hey, I'm in this philosophy of mind course and we just spent a week on the frame problem — the original McCarthy & Hayes version, not the Dennett "relevance" gloss, though we touched on that too. I'm leading a study session next week for about 12 people (mix of majors, mostly juniors/seniors, 75 minutes) and I want to run an activity that makes them actually *feel* the frame problem instead of just nodding along to the lecture slides. The prof covered the situation calculus, the Yale shooting problem, all that, but I think most people in the room still don't quite get why the frame problem is so nasty — they kind of shrug and think "just write down what doesn't change." I want to break that intuition.

  Can you design a classroom activity where the group has to act as a reasoning agent in a toy microworld, explicitly listing frame axioms for a simple action, and they run smack into the combinatorial wall? I want them to discover the problem themselves before I name it.

  Here's what I'm picturing: they get a small world — maybe a table with a few objects, each with a handful of properties — and they have to write the "program" (really just a set of statements) that fully specifies what changes and what doesn't when you perform one action, like moving a block. They have to get it *complete* — if they miss something, the "simulation" (me, or a designated checker) will point out that some fact about the world is now indeterminate. They keep adding axioms until they either give up or run out of time.

  What I need from you: the exact setup of the microworld (how many objects, what properties, what relations), the rules of the activity, a timeline for the 75 minutes, the debrief that maps what happened back to the formal frame problem and the Yale shooting problem, and an honest rundown of what will predictably go wrong when I run this — what shortcuts students will try, what they'll misunderstand about the task, and how to handle it. Also, if there's some feature of the frame problem that the activity structurally can't capture (like the difference between the representational and inferential versions), flag that so I can fill it in myself during the debrief.

  Oh and if you could work in a moment where they realize that even a tiny world generates more frame axioms than they can reasonably write in an hour, that would be perfect — I want that moment of horror.
