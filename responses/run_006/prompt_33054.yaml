  I've been trying to get my head around the Pasadena game and I keep getting lost in the technical write-ups. Could you explain it in a way that builds intuition rather than just walking through the algebra? I roughly know the setup: you flip a fair coin until it lands heads, and on flip n you win 2^n/n dollars if n is odd and loose 2^n/n dollars if n is even. I also know the expected value works out to the alternating harmonic series, which converges to ln 2 but only conditionally, so by rearranging the terms you can make it sum to any value you like. What I don't have a feel for is why that actually matters. Like, why isn't "the expectation is ln 2" a perfectly good answer? What exactly is the deep problem the Pasadena game is supposed to pose for expected utility theory, and how is it different from the St Petersburg paradox? And what are the main moves people make in response — is there a consensus on whether you should pay to play it, or is the whole point that decision theory just goes silent here?

