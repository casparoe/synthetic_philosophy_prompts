answer: |-
  Below is a complete in-class game designed to make Parfit's hitchhiker and rational irrationality viscerally tangible. Students will experience why being "less rational" (via self-binding) can lead to better outcomes. The game uses tokens (e.g., poker chips, paper slips, or tally sheets) and anonymous random pairings to prevent reputation effects.

  ---

  ### **Game Overview**
  - **Core Problem**: In Parfit's hitchhiker, a driver will only rescue a stranded hitchhiker if the hitchhiker promises to pay later. Once rescued, it's rational for the hitchhiker to break the promise (paying costs them, but not paying costs nothing). Anticipating this, the driver doesn’t rescue them, leaving both worse off.  
  - **Game Solution**: Hitchhikers can pay an upfront cost to "bind" themselves to keep promises. Drivers only rescue bound hitchhikers, creating tension: *Is it worth sacrificing tokens to become "irrationally" trustworthy?*  
  - **Time Allocation**:  
    - Rules explanation: 10 min  
    - Phase 1 (no binding): 15 min  
    - Phase 2 (with binding): 15 min  
    - Debrief: 35 min  
    **Total**: 75 min  

  ---

  ### **Materials Needed**
  - **Tokens**: Distribute 20 tokens per student (use poker chips, paper slips, or tally sheets).  
  - **Role Cards**: "Driver" (8 cards) and "Hitchhiker" (8 cards).  
  - **Pairing System**: Use an app (e.g., Random Team Generator) or slips of paper to anonymously pair students each round.  
  - **Move Sheets**: Small slips where students write choices (see templates below).  
  - **Whiteboard**: Track aggregate results per round.  

  ---

  ### **Rules (Teach in 10 Minutes)**  
  Explain the scenario: *"You’re in a desert. Drivers pass stranded hitchhikers. Hitchhikers promise payment for rescue, but once safe, they might break their promise."*  

  #### **Phase 1: No Binding (Rational Maximizers)**  
  - **Pairing**: Randomly pair 16 students into 8 Driver/Hitchhiker pairs each round. Re-pair anonymously every round.  
  - **Driver’s Choice**:  
    - **Rescue**: Costs 0 tokens. If rescued, hitchhiker can choose to pay or not.  
    - **Don’t Rescue**: Costs 0 tokens. Game ends for the pair.  
  - **Hitchhiker’s Choice** (if rescued):  
    - **Pay**: Lose 5 tokens, driver gains 5.  
    - **Don’t Pay**: Lose 0 tokens, driver loses 5 (for wasted effort).  
  - **Payoffs**:  
    | **Action**               | **Driver Tokens** | **Hitchhiker Tokens** |  
    |--------------------------|-------------------|------------------------|  
    | Don’t Rescue             | 0                 | -10 (stranded)         |  
    | Rescue + Pay             | +5                | -5 (pay)               |  
    | Rescue + Don’t Pay       | -5                | 0 (free rescue)        |  
  - **Rounds**: 3 rounds (each student plays each role at least once).  
  - **Key Instruction**: *"Maximize your tokens. No talking—this is anonymous!"*  

  #### **Phase 2: Binding Option (Rational Irrationality)**  
  - **New Rule**: Hitchhikers can now **bind themselves** before pairing:  
    - **Cost**: Binding costs 3 tokens (paid upfront, even if not rescued).  
    - **Effect**: If bound *and* rescued, hitchhiker **must pay** (no choice).  
  - **Driver’s Advantage**: Drivers see if hitchhiker is bound before deciding to rescue.  
  - **Payoffs**:  
    | **Action**                           | **Driver Tokens** | **Hitchhiker Tokens**       |  
    |--------------------------------------|-------------------|------------------------------|  
    | Don’t Rescue                         | 0                 | -10 (unbound) or -13 (bound) |  
    | Rescue bound hitchhiker              | +5                | -5 (pay) -3 (binding) = -8   |  
    | Rescue unbound + Pay                 | +5                | -5                           |  
    | Rescue unbound + Don’t Pay           | -5                | 0                            |  
  - **Rounds**: 3 rounds (roles reassigned randomly each round).  
  - **Key Tension**: *"Binding makes you trustworthy but costs tokens. Is it worth it?"*  

  ---

  ### **Step-by-Step Execution**  
  1. **Distribute Materials** (2 min): Give each student 20 tokens, move sheets, and role cards.  
  2. **Phase 1: Run 3 Rounds** (15 min):  
     - **Round 1**: Assign roles (8 drivers, 8 hitchhikers). Pair randomly. Drivers write "Rescue" or "Don’t" on slips. Collect slips.  
       - For "Rescue" pairs: Hitchhikers write "Pay" or "Don’t."  
       - Record payoffs. Re-pair.  
     - **Rounds 2–3**: Reassign roles (swap drivers/hitchhikers). Repeat.  
     - **Expected Outcome**: Drivers rarely rescue (anticipating betrayal). Hitchhikers rarely pay if rescued. Most end with low tokens.  
  3. **Phase 2: Run 3 Rounds** (15 min):  
     - **Before Pairing**: Hitchhikers decide privately: **Bind** (lose 3 tokens) or **Not Bind**.  
     - Drivers see binding status before choosing to rescue.  
     - **Expected Outcome**: Most hitchhikers bind. Drivers only rescue bound hitchhikers. Bound hitchhikers end better than unbound.  
  4. **Track Data**: Use a whiteboard to log:  
     | **Phase** | **Rescues** | **Payments** | **Bindings** | **Avg. Tokens** |  
     |-----------|-------------|--------------|--------------|----------------|  
     | 1         | Low         | Very low     | N/A          | Low (e.g., 5)  |  
     | 2         | High (only bound) | 100% for bound | High (e.g., 75%) | Higher (e.g., 7) |  

  ---

  ### **Debrief Structure (35 Minutes)**  
  **Map Game to Philosophy** (Use whiteboard to match moments to theory):  
  1. **Phase 1 = Parfit's Hitchhiker Collapse** (10 min):  
     - *Game Moment*: Drivers didn’t rescue; hitchhikers didn’t pay.  
     - *Parfit Link*: Rational maximization → mutual defection. Drivers knew hitchhikers would break promises ("I’d be a fool to rescue").  
     - *Question*: *"Why did no one cooperate even though it was collectively better?"*  

  2. **Phase 2 = Rational Irrationality** (10 min):  
     - *Game Moment*: Hitchhikers paid to bind themselves; drivers rescued only bound ones.  
     - *Parfit/Kavka Link*:  
       - Binding = Cultivating an "irrational" disposition (e.g., honesty), making cooperation possible.  
       - Like Kavka’s toxin puzzle: Paying to bind is like intending to drink the toxin—it’s costly upfront, but unlocks rewards.  
     - *Question*: *"Why would anyone pay to force themselves to keep a promise?"*  

  3. **Broader Implications** (15 min):  
     - **Key Insight**: Sometimes, limiting your future rationality (e.g., via commitments) is instrumentally rational.  
     - **Real-World Examples**:  
       - Ulysses tying himself to the mast (to resist sirens).  
       - Setting up automatic savings (to counter spending urges).  
     - **Discussion Prompts**:  
       - *"Can rationality demand self-sabotage?"*  
       - *"When is it worth becoming ‘less rational’?"*  
     - **Limitations of the Game**:  
       - Binding was mechanical—real dispositions require internal change (e.g., guilt, habits).  
       - Anonymity prevented reputation—in life, repeated interactions reduce need for binding.  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Reputation Building**:  
     - *Risk*: Students may wink, talk, or use consistent choices to signal trustworthiness.  
     - *Fix*: Enforce strict anonymity (no names on slips). Re-pair randomly each round. Penalize talking.  

  2. **Gaming the Binding Mechanism**:  
     - *Risk*: Hitchhikers bind but regret it and "cheat" (don’t pay). Drivers rescue unbound hitchhikers hoping for kindness.  
     - *Fix*: Clarify rules: *"If bound, you MUST pay if rescued. Drivers, assume unbound hitchhikers won’t pay."*  

  3. **Tears or Frustration**:  
     - *Risk*: Competitive students get angry at defectors.  
     - *Fix*: Emphasize learning, not winning: *"This isn’t about tokens—it’s about the paradox."*  

  4. **Time Crunch**:  
     - *Risk*: Round setup takes too long.  
     - *Fix*: Use apps for pairing (e.g., Wheel of Names). Limit rounds to 2 per phase if needed.  

  ---

  ### **What the Game Can’t Replicate (Supply in Debrief)**  
  - **Internal Dispositions**: The game treats binding as a transaction, but real irrationality (e.g., genuine honesty) involves emotions/personality. Discuss: *"How do you cultivate a disposition? Can you ‘fake it till you make it’?"*  
  - **Kavka’s Toxin Nuance**: The game simplifies binding to a cost, but Kavka’s puzzle involves forming an intention *without* immediate reward. Contrast: *"In the game, binding has a clear payoff. In the toxin puzzle, the reward comes before the cost—making intention irrational."*  
  - **Uncertainty**: Real life lacks guaranteed payoffs. Note: *"In the game, binding always works. In life, trust can still be betrayed."*  

  ---

  ### **Token Economy Example**  
  - **Starting Tokens**: 20 per student.  
  - **Typical Phase 1 Outcome**:  
    - Unrescued hitchhiker: 20 - 10 = 10 tokens.  
    - Rescued but unpaid: Driver: 20 - 5 = 15; Hitchhiker: 20 + 0 = 20.  
  - **Typical Phase 2 Outcome**:  
    - Bound hitcher: 20 - 3 (binding) - 5 (pay) = 12 tokens.  
    - Driver rescuing bound: 20 + 5 = 25 tokens.  

  This game forces students to *feel* the frustration of mutual defection and the relief of cooperation via self-binding. By the debrief, they’ll grasp why Parfit argued that "it can be rational to cause yourself to act irrationally."
