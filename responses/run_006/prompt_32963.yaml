answer: |-
  ## The Philosopher's Stalemate (A Dialogue)

  **Setting:** A dimly-lit university pub. Empty pint glasses sit beside half-finished ones. The murmur of other conversations provides a low backdrop. **FITZGERALD (Fittingness Theorist)**, mid-40s, gestures intently with her glass. **SLOANE (Skeptic)**, late 30s, leans back, swirling the dregs of an IPA, a skeptical eyebrow perpetually raised.

  **FITZGERALD:** (Leaning forward) ...so Sloane, that demon example *still* nags at me after today's session. It’s the *perfect* reductio against collapsing all reasons into instrumental ‘payoffs’. The reason to *admire* the demon isn't *about* the demon at all! It’s about *me*, my skin, my happiness. It’s alien to admiration itself.

  **SLOANE:** (Takes a slow sip) Sure, Fitz, it *feels* alien. I grant the phenomenology. But that’s just psychology. Your demon *does* give me a blazingly good reason to adopt the *state* of admiration towards him. Whether that state feels ‘authentic’ or not seems beside the point. Why isn’t ‘avoiding agonizing torture’ reason enough to make admiring him the *rational* thing to do?

  **FITZGERALD:** Because ‘admiration’ isn’t just *any* state I can flip on like a light switch for a payoff! It has a *telos*, an internal standard. Belief aims at truth – a reason that doesn’t bear on truth isn’t a reason *to believe*, even if believing makes me rich. Fear tracks danger – someone paying me to be terrified of kittens gives me a reason to *act* terrified, maybe, but not a reason *to be* terrified. It’s not *fitting*. Similarly, admiration constitutively aims at the *admirable*. The demon’s threat doesn’t make him admirable; it bypasses admiration’s constitutive aim entirely. That’s why it’s the *wrong kind* of reason *for that attitude*.

  **SLOANE:** (Leans in, tapping the table) Okay, let’s grant attitudes have these ‘constitutive aims’. How do we *know* what they are? How do we *know* belief aims at truth, not, say, coherence with my deeply held convictions, or psychological comfort? How do we *know* admiration aims at the admirable, not at social cohesion, or signaling virtue? You’re saying ‘admirable’ is the standard… but ‘admirable’ *just is* whatever admiration *should* be responsive to. It’s circular, Fitz. You’re smuggling the normative distinction you want to explain *into* your definition of the attitude’s ‘aim’. You’re *stipulating* that the ‘aim’ is responsiveness to object-given reasons.

  **FITZGERALD:** (Shakes her head vigorously) No, it’s not stipulation! It’s functional. Look at the *role* these attitudes play in our lives, in our cognitive and practical architecture. Belief *guides action* based on how the world *is*; if it didn't aim at truth, that whole function collapses into wishful thinking. Admiration *motivates emulation*; if it weren't responsive to genuine excellence, it wouldn't serve that role. We can identify the aim descriptively, by looking at what the attitude *does*, what its success conditions *are* within our practices. The demon case *reveals* the misfire precisely because admiration *isn't doing its job* when elicited by threat – it’s not tracking excellence, it’s just avoiding pain. That functional misfire *is* the WKR phenomenon.

  **SLOANE:** Ah, the naturalistic escape hatch! ‘Look at the functional role!’ But Fitz, as soon as you say ‘its job’, ‘success conditions’, ‘misfire’… you’ve snuck normativity right back in. *Whose* practices? *Which* function? *What counts* as ‘success’ for admiration? Is it motivating *any* emulation, or only *worthwhile* emulation? You can’t *describe* the function neutrally without already making normative judgments about what the attitude is *for*, what its *point* is. And *that* point – what admiration is *for* – is precisely what we’re trying to settle! Is its point to track genuine value, or is its point to promote the well-being of the admirer? The demon case suggests these can come apart. Your ‘functional role’ explanation assumes the *normative* priority of the tracking function. You’re presupposing the distinction.

  **FITZGERALD:** (Stares into her glass, then looks up, eyes sharp) So… you think *any* attempt to ground the distinction non-normatively – constitutively, functionally, whatever – inevitably presupposes a prior normative commitment? That we can’t get *behind* the practice to ground it?

  **SLOANE:** Exactly. The normativity of attitudes isn’t handed down from some Platonic manual of ‘constitutive aims’. It arises *within* the practice of having those attitudes, evaluating them, giving and asking for reasons. When you say the demon’s reason is the ‘wrong kind’, you’re expressing a *normative commitment* implicit in *our* practice of admiration – that it ought to respond to perceived excellence. But that commitment *is* the distinction. Trying to ‘ground’ it in something prior, like a non-normative function, is chasing your tail. It’s turtles all the way down… normative turtles.

  **FITZGERALD:** (Silent for a moment, ice clinking in her glass) But Sloane… doesn’t that make the distinction *arbitrary*? If it’s *just* a feature of our current practice, why couldn't the practice evolve? Why couldn't we decide that admiration *should* primarily serve self-interest? Then the demon *would* give the right kind of reason! That feels… deeply wrong. The *point* of admiration seems intrinsically tied to recognizing value *out there*, not just managing my internal states. The functional misfire feels *real*, not just conventional.

  **SLOANE:** (Sighs, less triumphant, more contemplative) It’s not arbitrary in the sense of being random. Our practices are deeply embedded, evolutionarily and socially. Admiration *is* fundamentally shaped to track things we find excellent – that’s how it got its current functional profile. But the *normative authority* – the ‘ought’ – doesn’t come from the function *descriptively understood*. It comes from *us*, from the fact that *we* value recognizing genuine excellence, we value truth, we find attitudes that misfire their apparent targets to be defective *from within our evaluative standpoint*. The ‘wrongness’ of the demon’s reason isn’t discovered in the constitution of admiration like finding its serial number; it’s *projected* onto admiration because *we care* about admiration tracking the admirable.

  **FITZGERALD:** Projected…? So the distinction is real *for us*, but it’s not grounded in anything deeper than our shared normative concerns? That feels… unsatisfying. It makes the fittingness of the attitude too contingent. What if we *stop* caring? Does admiration then lose its constitutive aim? Does the WKR problem vanish?

  **SLOANE:** Perhaps not ‘vanish,’ but its *force* would change. The normativity would shift. The distinction between object-given and state-given reasons isn’t a pre-existing metaphysical chasm we discover. It’s a *refinement* within our normative thinking, a way of making sense of the complex ways reasons interact with different aspects of our agency and our attitudes. The demon case is powerful *because* our practice *currently* prioritizes the object-directedness of admiration. But that priority isn't metaphysically guaranteed; it's a feature of the normativity we inhabit.

  **FITZGERALD:** (Leans back, a long exhale) So… the deepest disagreement isn't really about the demon, or even about reasons per se. It's about where normativity *comes from*. You think it emerges from, and is answerable only to, the internal standards of our practices – standards we collectively uphold and refine. I think… (she pauses, searching) I think there *is* a ‘shape’ to these attitudes, a structure built into what they *are*, that *constrains* what can count as a good reason for them, independently of whether we currently endorse it. The functional role *reveals* that structure, even if describing it uses normative language. The circularity you see is… maybe… virtuous? Essential? Not vicious.

  **SLOANE:** (Nods slowly, a half-smile) Perhaps. Or perhaps that ‘shape’ you perceive is just the deeply sedimented imprint of the very normative commitments I’m talking about, mistaken for an independent reality. The rabbit hole goes deep, Fitz. Maybe we’re just… living on different planets in the normative universe. Mine is flatter, more human-sized. Yours has these deep, attitude-shaped canyons.

  **FITZGERALD:** (Raises her glass slightly) Different planets… but orbiting the same troublesome demon. Another round? I think we’ve earned it. And maybe… maybe we need to talk about what ‘earning’ even means.

  **SLOANE:** (Chuckles, raising his own glass) Now *that* sounds like a state-given reason if I ever heard one. But sure. Let’s drink to circling the abyss.

  *(They clink glasses, the conversation momentarily suspended, the fundamental divergence laid bare but unresolved, the weight of the normative mystery settling back over them.)*
