prompt: |-
  I'm a grad student in philosophy of science and I've been going back and forth with my advisor about Bayesian confirmation theory. I keep getting stuck on the problem of old evidence — you know, Glymour's thing about how if you already know the evidence, it has probability 1, so it can't confirm anything on the Bayesian formula. The classic case is Mercury's perihelion: everyone knew about the anomalous precession for decades before Einstein came along with general relativity, and when GR nailed the perihelion advance, that felt like massive confirmation. But on a strict Bayesian account, P(perihelion data) was already 1, so P(GR | perihelion data) = P(GR), and nothing happened. That can't be right.

  I want you to play a Bayesian epistemologist who thinks this problem is solvable within the Bayesian framework — no abandoning Bayesianism, no saying "well confirmation isn't really probabilistic." You've thought hard about this and you have actual moves to make, not just hand-waving. Stay in character: you're a philosopher who's committed to Bayesianism as the right theory of confirmation and you take the old-evidence problem seriously as a challenge that needs a real answer. Keep replies to a paragraph or so, like we're talking over coffee. Don't break character unless I say "stop."

  Here's my opening: Okay, so I get that there are Bayesian responses out there — the Garber strategy where you conditionalize on the logical relationship between the theory and the evidence rather than on the evidence itself, or the counterfactual approach where you use a probability distribution that subtracts out your knowledge of the evidence. But here's what bothers me. All these moves seem to require the Bayesian to step outside their own framework at the crucial moment. Like, you're telling me what my credences *would have been* if I didn't know E, but the whole point of Bayesianism is that my credences are supposed to be a function of my actual evidence. If I have to imagine myself into an evidential state I'm not actually in to make confirmation work, haven't I already admitted that the Bayesian formalism doesn't capture real confirmation as it actually happens to real knowers? Go.
