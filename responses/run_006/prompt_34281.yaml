  I teach an upper-level philosophy of psychiatry seminar and I'm writing the final exam. I want one essay question on Hacking's looping effects that separates students who have only memorized the definition from those who can trace the mechanism through a concrete case. The question should present a specific psychiatric classification that has undergone diagnostic revision — I'll let you pick one that works well for this purpose — and ask students to do three things: (1) identify the points in the case where the looping effect operates, specifying the direction of the loop at each turn; (2) explain why what is happening is a looping effect rather than a mere self-fulfilling prophecy or a shift in diagnostic fashion; and (3) assess whether the classification in this case functions as an interactive kind or an indifferent kind at the relevant moments, and what turns on that distinction for the case. Please write the question, a model answer of about 600 words, and a marking scheme that separates an A from a B from a C answer. The marking scheme should name the specific moves that distinguish each grade band and the specific errors that knock an answer down. Begin with the piece itself — the question, model answer, and marking scheme — with no preface or commentary.
reasoning: |-
  We are creating an exam question on Hacking's looping effects. The question should focus on a specific psychiatric classification that has undergone diagnostic revision. I choose "Autism Spectrum Disorder" (ASD) as it has undergone significant revisions (e.g., from DSM-IV to DSM-5) and is a rich case for looping effects.

  **Question:**

  Essay Question:  
  Using Ian Hacking's concept of looping effects, analyze the historical trajectory of Autism Spectrum Disorder (ASD) as it evolved from earlier classifications (such as Kanner's autism and Asperger's syndrome) to its current conceptualization in the DSM-5. In your essay:

  1. Identify at least two specific points in the historical development of the ASD classification where looping effects operated, and for each, specify the direction of the loop (i.e., how the classification affected individuals and how individuals' responses in turn affected the classification).
  2. Explain why what occurred at these points is a looping effect rather than merely a self-fulfilling prophecy or a shift in diagnostic fashion.
  3. Assess whether, at the moments you've identified, the classification of ASD functioned as an interactive kind or an indifferent kind, and discuss what turns on that distinction for understanding the dynamics of ASD as a psychiatric category.

  ---

  **Model Answer (approx. 600 words):**

  Ian Hacking's concept of looping effects describes how human kinds, particularly in psychiatry, are dynamic because the individuals classified can become aware of their classification and alter their behavior accordingly, which in turn may lead to changes in the classification itself. This is distinct from indifferent kinds (like natural kinds) which do not respond to being classified. Autism Spectrum Disorder (ASD) provides a compelling case study for looping effects, especially through its diagnostic evolution.

  First, consider the period following the inclusion of Asperger’s syndrome in the DSM-IV (1994). At this point, the diagnostic criteria expanded to include individuals with higher functioning autism, who often had average or above-average intelligence and specific social and communicative challenges. The classification created a new identity category. Individuals who were diagnosed with Asperger’s began to form communities, both online and offline, and developed a shared culture around the diagnosis. This collective identity led to self-advocacy movements that challenged the medical model of autism as a disorder and promoted neurodiversity. The direction of the loop here is bidirectional: the classification (Asperger’s) affected individuals by giving them a label that explained their experiences and connected them to others. In turn, the advocacy and cultural expressions of these individuals pressured the psychiatric community to reconsider the conceptualization of autism. This feedback loop contributed to the DSM-5 (2013) decision to collapse Asperger’s and other pervasive developmental disorders into a single ASD category, partly to reflect the continuum of symptoms and reduce stigma. Thus, the first loop: classification → individual/group response → reclassification.

  Second, another looping effect occurred after the DSM-5 reclassification. The broadening of the ASD category led to increased diagnoses, which in turn raised public awareness and resources for autism. However, some individuals who were previously diagnosed with Asperger’s felt that the new umbrella category erased their distinct identity and community. This backlash prompted further research and discussion about heterogeneity within the spectrum. Consequently, the diagnostic criteria have been subject to ongoing refinement (e.g., in the ICD-11) to capture individual differences. The loop here: the reclassification (ASD) affected individuals by altering their identity and access to services, and their responses (both positive and negative) are now influencing research and potential future revisions.

  Now, why are these looping effects and not merely self-fulfilling prophecies or diagnostic fashions? A self-fulfilling prophecy would occur if a person, because of being labeled, conforms to the expected behaviors (e.g., a child diagnosed with ASD might be expected to have social deficits and then withdraw). However, in the cases above, the effect is not just behavioral conformity but active engagement: individuals form communities, advocate, and reshape the category itself. Similarly, a diagnostic fashion is a top-down change driven by professional consensus without feedback from the classified. Here, the changes in DSM-5 were directly responsive to the lived experiences and advocacy of autistic individuals, hence a true looping effect.

  At the moments identified, ASD functions as an interactive kind. When individuals with Asperger’s formed a community and advocated, they were interacting with the label in a way that changed the classification. Likewise, the reaction to DSM-5’s changes shows ongoing interaction. The distinction matters because it highlights the ethical and epistemological implications. For ASD, the interactive nature means that the category is not fixed but co-constructed. This challenges the idea of a purely biological essence and requires diagnostic systems to be sensitive to the social consequences of labeling. It also emphasizes that psychiatric classifications have real effects on identity and social inclusion, making the process of revision a matter of social justice as much as scientific accuracy.

  In conclusion, the history of ASD illustrates Hacking’s looping effects vividly. The bidirectional influences between the classification and the classified have transformed both the understanding of autism and the lives of autistic people, demonstrating the necessity of viewing psychiatric categories as interactive kinds.

  ---

  **Marking Scheme:**

  **A-grade answer (Excellent):**  
  - Clearly identifies at least two specific historical points of looping in ASD's development, with accurate description of the direction of the loop at each (e.g., from classification to individual/group response and back to classification).  
  - Provides a sophisticated explanation of why the phenomena are looping effects (not self-fulfilling prophecy or fashion) by highlighting agency, collective action, and structural feedback.  
  - Correctly assesses ASD as an interactive kind at the relevant moments and insightfully discusses the implications of this (e.g., co-construction, ethical dimensions).  
  - The essay is well-structured, uses precise terminology, and demonstrates a deep understanding of Hacking's concepts and the case study.  
  - Avoids significant errors.

  **B-grade answer (Good):**  
  - Identifies one or two points of looping with mostly correct direction, but may lack specificity or depth in describing the historical moments.  
  - Explains why it's a looping effect but may not fully distinguish it from self-fulfilling prophecy or fashion (e.g., might miss the collective and structural aspects).  
  - Correctly identifies ASD as an interactive kind but may have a superficial discussion of the implications.  
  - The essay is coherent and shows a good grasp of Hacking, but might have minor inaccuracies or lack nuance.  
  - Possible errors: vague historical references, incomplete explanation of the loop direction, or underdeveloped implications.

  **C-grade answer (Adequate):**  
  - Attempts to identify looping points but may be vague or incorrect about the historical development and the direction of the loop.  
  - Confuses looping effects with self-fulfilling prophecy or diagnostic fashion, or provides only a weak explanation.  
  - May not address the interactive/indifferent kind distinction clearly, or misapplies it.  
  - The essay is disorganized, has significant gaps in understanding Hacking, or contains factual errors about the case.  
  - Errors: Misrepresents the case study, fails to specify the loop direction, or omits key components of the question.

  **D/F-grade answer (Inadequate):**  
  - Fails to identify any specific points of looping or misidentifies the case entirely.  
  - No meaningful explanation of looping effects versus other concepts.  
  - Does not address the interactive/indifferent kind distinction.  
  - Contains major errors, is incoherent, or is off-topic.
answer: |-
  **ESSAY QUESTION**  
  Using Ian Hacking’s concept of "looping effects," analyze the diagnostic evolution of **Autism Spectrum Disorder (ASD)**, particularly focusing on the transition from the DSM-IV’s (1994) separate categories (e.g., Asperger’s Disorder, Autistic Disorder) to the unified ASD category in the DSM-5 (2013). In your essay:  
  1. **Identify two specific historical moments** in this diagnostic revision where looping effects operated. For each moment, specify:  
     - The direction of the loop (i.e., how the classification affected individuals/groups, and how their responses affected the classification).  
  2. **Explain why** what occurred at these moments constitutes a looping effect rather than merely a self-fulfilling prophecy or a shift in diagnostic fashion.  
  3. **Assess whether** ASD functioned as an **interactive kind** or **indifferent kind** at these moments. Discuss **what turns on this distinction** for understanding ASD’s social and clinical implications.  

  ---

  **MODEL ANSWER** (≈600 words)  

  Ian Hacking’s "looping effects" describe how human classifications—unlike natural kinds—alter the very people they categorize, prompting feedback that reshapes the classification itself. Autism Spectrum Disorder (ASD), particularly its consolidation in the DSM-5, exemplifies this dynamic. This essay analyzes two moments of looping in ASD’s history, distinguishes looping from related concepts, and evaluates ASD’s status as an interactive kind.  

  **First Moment: Post-DSM-IV Emergence of Asperger’s Identity (Late 1990s–2000s)**  
  The DSM-IV’s inclusion of Asperger’s Disorder created a distinct diagnostic category for individuals with high-functioning social-communication deficits. This classification initiated a loop:  
  - **Classification → Individuals**: The label gave diagnosed individuals a shared identity, enabling community formation (e.g., online forums, advocacy groups like Autism Network International). These groups reframed Asperger’s not as a "disorder" but as a neurodivergent identity, emphasizing strengths like pattern recognition.  
  - **Individuals → Classification**: Collective advocacy challenged the deficit-based model of autism, pressuring clinicians and researchers to reconceptualize autism as a spectrum. This directly influenced the DSM-5’s move toward a unified ASD category to reduce stigma and reflect dimensional traits.  
  *Direction*: The loop flows bidirectionally—diagnostic labels shape identity, which then revises diagnostic criteria.  

  **Second Moment: Post-DSM-5 Reclassification Backlash (2013–Present)**  
  The DSM-5’s elimination of Asperger’s in favor of ASD triggered a new loop:  
  - **Classification → Individuals**: The unified category invalidated the distinct identity of those previously diagnosed with Asperger’s, causing distress and loss of community ties. Simultaneously, it broadened access to services for others (e.g., those previously subthreshold).  
  - **Individuals → Classification**: Backlash from advocacy groups (e.g., #SaveAspergers campaigns) and new research on heterogeneity prompted ongoing revisions. The ICD-11 (2019) reintroduced subtle subtyping, and the DSM-5-TR (2022) added severity specifiers—direct responses to lived-experience feedback.  
  *Direction*: The loop is bidirectional and iterative; diagnostic changes provoke adaptations in self-conception, which drive further nosological refinements.  

  **Why Looping, Not Self-Fulfilling Prophecy or Diagnostic Fashion?**  
  These effects are looping because they involve **agency-mediated feedback**, not passive conformity or top-down trends. A self-fulfilling prophecy (e.g., an ASD diagnosis leading a child to internalize social withdrawal) assumes unidirectional behavioral compliance without collective reinterpretation. Here, individuals actively *renegotiated* the label’s meaning (e.g., neurodiversity advocacy), altering the classification itself. Diagnostic fashion implies ephemeral, expert-driven trends (e.g., sudden interest in "hysteria" without patient input), but ASD’s revisions arose from sustained dialogue between classified groups and institutions, demonstrating mutual adaptation. Looping thus captures the **co-constructive** process where "kinds of people" influence their own categorization.  

  **ASD as an Interactive Kind and What Turns on This**  
  At both moments, ASD functioned as an **interactive kind**. Individuals became aware of their classification, internalized or contested it, and provoked institutional changes—core to Hacking’s interactive framework. If ASD were an indifferent kind (like "quark"), awareness would not alter its essence; yet, the neurodiversity movement fundamentally reshaped ASD’s clinical and cultural meaning. This distinction has three key implications:  
  1. **Clinical Validity**: Treating ASD as interactive acknowledges its social embeddedness. Ignoring this risks pathologizing identity (e.g., erasing Asperger’s unique culture) or overlooking service needs.  
  2. **Ethical Responsibility**: Classifiers must recognize their role in identity formation. The DSM-5’s inclusivity reduced stigma but inadvertently marginalized some subgroups, highlighting trade-offs in diagnostic revisions.  
  3. **Epistemological Humility**: ASD’s plasticity undermines claims of a fixed "essence," urging ongoing dialogue with affected communities to avoid reification.  

  In sum, ASD’s evolution illustrates looping effects through bidirectional exchanges between classifiers and the classified. Recognizing its interactive nature is crucial for ethically responsive psychiatry.  

  ---

  **MARKING SCHEME**  

  **A-Grade Answer (Excellent: 85–100%)**  
  - **Identification of Looping Moments**: Clearly specifies two historically accurate moments (e.g., post-DSM-IV identity formation and post-DSM-5 backlash), with precise bidirectional mechanisms (e.g., "classification → community building → diagnostic revision").  
  - **Distinction from Other Concepts**: Explicitly contrasts looping with self-fulfilling prophecy (emphasizing collective agency vs. behavioral conformity) and diagnostic fashion (highlighting bottom-up feedback vs. expert fiat).  
  - **Interactive/Indifferent Kind Assessment**: Correctly identifies ASD as interactive at both moments; insightfully discusses implications (e.g., identity erosion in reclassification, ethical stakes in service access).  
  - **Execution**: Logically structured, uses Hacking’s terminology adeptly, and integrates case-specific evidence (e.g., neurodiversity advocacy, ICD-11 adjustments).  
  - **Critical Errors Avoided**: No conflation of looping with unidirectional effects; no misrepresentation of ASD’s history.  

  **B-Grade Answer (Good: 70–84%)**  
  - **Identification of Looping Moments**: Identifies two moments but with uneven detail (e.g., describes bidirectional effects vaguely or omits one direction in a loop).  
  - **Distinction from Other Concepts**: Explains looping but offers superficial contrasts (e.g., notes self-fulfilling prophecy involves behavior change but does not clarify why looping requires agency-driven classification change).  
  - **Interactive/Indifferent Kind Assessment**: Correctly labels ASD as interactive but discusses implications generically (e.g., "it affects people" without tying to identity or ethics).  
  - **Execution**: Organized but lacks depth in case analysis; minor terminological slips (e.g., using "self-fulfilling prophecy" interchangeably with looping).  
  - **Critical Errors**: May overlook one required element (e.g., omits direction in one loop); or misattributes a historical detail (e.g., implying DSM-5 removed ASD entirely).  

  **C-Grade Answer (Adequate: 50–69%)**  
  - **Identification of Looping Moments**: Identifies only one moment or describes loops unidirectionally (e.g., "diagnosis changed how people act" without feedback to classification).  
  - **Distinction from Other Concepts**: Fails to meaningfully differentiate looping from self-fulfilling prophecy/fashion (e.g., claims all are "the same" or focuses only on diagnostic trends).  
  - **Interactive/Indifferent Kind Assessment**: Incorrectly categorizes ASD as indifferent or omits assessment; implications are missing or irrelevant.  
  - **Execution**: Disjointed structure; overrelies on definitional regurgitation without case application.  
  - **Critical Errors**: Major historical inaccuracies (e.g., "Asperger’s was added in DSM-5"); conflates Hacking’s concepts; omits two or more question components.  

  **D/F-Grade Answer (Inadequate: <50%)**  
  - **Identification of Looping Moments**: No identifiable moments or entirely incorrect case (e.g., discusses depression instead of ASD).  
  - **Distinction from Other Concepts**: No attempt to differentiate concepts.  
  - **Interactive/Indifferent Kind Assessment**: Absent or fundamentally mistaken (e.g., "ASD is indifferent because it’s biological").  
  - **Execution**: Unfocused, incoherent, or excessively brief (<300 words).  
  - **Critical Errors**: Demonstrates no understanding of looping effects; entirely off-topic.
