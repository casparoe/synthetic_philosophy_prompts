prompt: |-
  I serve on the board of a small family foundation. We have about $400,000 to grant this cycle, and we've narrowed the field to two finalists. One is a malaria bednet distribution program; our best estimate is roughly $4,500 per life saved. The other is a small AI alignment research team working on scalable oversight methods — the case for funding them rests on something like the hinge of history hypothesis: the idea that we may be living through a period of unusually high leverage over the very long-term future, and that steering AI development well could have astronomical expected value even if the probability of success is low.

  Half our board finds this argument impossible to operationalize for a small foundation; the other half finds it irresponsible to ignore. As the member closest to the technical side (I'm a software engineer, not a philosopher), I've been asked to draft a short memo — maybe two pages — recommending a decision. The memo needs to treat the losing side's strongest arguments seriously, and it needs to be actionable: we actually have to write a check.

  Please draft the memo. Think through the issue carefully as a professional philosopher working on longtermism and global priorities. Before writing, briefly sketch the strongest considerations on each side to make sure you're engaging with them fairly. In the memo itself, recommend a concrete decision and address the most powerful objection to your recommendation honestly rather than straw-manning it.
reasoning: |-
  Okay, the user serves on a family foundation board with $400,000 to grant and two finalists: a malaria bednet program and an AI alignment research team. They need a memo that fairly addresses both sides and makes a concrete recommendation. 

  First, I need to unpack the core tension. The bednet program is straightforward: measurable impact, proven effectiveness, and immediate life-saving. The AI alignment proposal is more abstract—high-risk, high-reward with existential stakes, but harder to quantify. The board is split between pragmatists who want tangible results and longtermists who prioritize future leverage points. 

  The user’s hidden challenge is legitimacy. As the only technical member, they must bridge philosophy and action without overstepping. The memo can’t just be "AI is important"; it needs to acknowledge the bednet advocates’ valid concerns—like wasting funds on unproven research—while making the case for why this specific AI team might be exceptional. 

  Key angles for fairness: 
  - **Bednets**: The $4,500/life metric is rock-solid. Ignoring it feels like refusing to save known lives. Plus, malaria work builds health systems—compound benefits the AI proposal can’t match. 
  - **AI alignment**: The "hinge of history" argument isn’t sci-fi. If AI goes wrong, current bednets won’t matter. But the probability is fuzzy, and small grants might not move the needle. 

  For the recommendation, I’m leaning toward AI alignment—but only if the team clears a high bar. The memo should stress: 
  1. **Scrutiny**: Demand evidence this team fills a unique niche. Are they targeting a neglected problem? Is their work likely to be adopted? 
  2. **Accountability**: Frame the grant as a pilot. Require milestones before further funding. 
  3. **Concession**: Admit this might fail, but argue the cost of inaction could be civilization-scale. 

  The losing side’s strongest rebuttal: "You’re gambling 10,000 bednets on a maybe." I’d counter that existential risk is a rare case where expected value dominates—even a 0.001% chance of preventing extinction justifies it mathematically. But that’s cold comfort to a malaria victim today. Hence the need for humility: this choice prioritizes the far future, not because those lives matter more, but because they might have no voice otherwise. 

  Finally, tactical framing: Keep the memo under two pages. Lead with shared values ("We all want impact"), then dissect both options dispassionately. End with a clear "fund X, with Y conditions" to force action.
answer: |-
  ## MEMORANDUM  
  **To:** Foundation Board Members  
  **From:** [Your Name], Board Member (Technical Advisor)  
  **Date:** October 26, 2023  
  **Subject:** Funding Recommendation: Malaria Bednets vs. AI Alignment Research  

  ### 1. Introduction  
  We face a critical decision between two high-impact opportunities:  
  - **Malaria Bednet Distribution:** Proven intervention saving lives immediately (~$4,500/life saved).  
  - **AI Alignment Research ("Scalable Oversight"):** Speculative work aiming to reduce existential risk from advanced AI, with potentially vast long-term value.  

  Both represent compelling moral claims. Below, I outline the strongest arguments for each, assess their trade-offs, and recommend a path forward.  

  ---

  ### 2. Strongest Arguments for Each Proposal  
  #### A. Malaria Bednets: The Case for Certain, Immediate Impact  
  - **Measurable Lives Saved:** With ~$400,000, we directly save ~88 lives based on robust evidence. Each bednet prevents malaria deaths with near-certainty.  
  - **Urgency & Neglect:** Malaria kills 600,000+ annually, primarily children in poverty-stricken regions. Delaying interventions has irreversible costs.  
  - **Accountability:** Outcomes are trackable, auditable, and ethically unambiguous.  
  - **Objection to AI Funding:** Gambling funds on highly uncertain research ignores our duty to save known, suffering people today. "Astronomical expected value" is unverifiable and risks wasting resources.  

  #### B. AI Alignment Research: The Case for Reducing Existential Risk  
  - **Unprecedented Stakes:** If AI development is misaligned, human extinction or permanent dystopia becomes plausible. Preventing this could safeguard billions of future lives.  
  - **Leverage at the "Hinge of History":** Current decisions may shape AI trajectories for millennia. Minor improvements in alignment could have massive flow-through effects.  
  - **Tractability & Neglect:** Scalable oversight is a critical, underfunded niche. Small teams can make pivotal conceptual advances (e.g., novel reward modeling techniques).  
  - **Expected Value Argument:** Even with low success probability (e.g., 0.1%), the value of protecting civilization’s future can dominate near-term certainties mathematically.  
  - **Objection to Bednets:** While noble, bednets don’t address potential catastrophes that could render all humanitarian efforts meaningless.  

  ---

  ### 3. Analysis: Key Trade-offs  
  - **Certainty vs. Scale:** Bednets offer guaranteed, immediate good. AI alignment risks failure but protects against near-infinite future losses.  
  - **Time Sensitivity:** Malaria requires urgent action; AI alignment’s window of opportunity may close within years as capabilities advance.  
  - **Foundational Fit:** Our $400,000 is significant for bednets but marginal for malaria globally. For a niche AI team, it could be transformative seed funding.  
  - **Epistemic Challenges:** AI alignment’s impact relies on speculative models (e.g., probability of success, value of the far future). Bednets rely on empirical data.  

  ---

  ### 4. Recommendation: Fund the AI Alignment Research Team  
  **I recommend granting $400,000 to the scalable oversight research team, contingent on a 6-month milestone review.**  

  #### Why?  
  - **Existential Risk Demands Proportional Prioritization:** If AI risk is real (per mainstream scientific consensus, e.g., 2023 AI Scientist Survey), its mitigation could be *the* highest-impact activity of our time. Small inputs now could alter outcomes disproportionately.  
  - **Neglectedness & Leverage:** This team addresses a specific, high-leverage problem (scalable oversight) with limited alternative funding. Bednet programs have large institutional backers (e.g., Gates Foundation, WHO).  
  - **Foundational Advantage:** We can fund agile, early-stage research larger funders overlook. Our grant could catalyze follow-on investment or critical insights.  
  - **Expected Value as a Decisive Factor:** Conservatively assuming a 0.1% chance this work contributes to saving >1 billion future lives, the expected value still exceeds bednets’ ~88 lives saved (0.001 × 1e9 = 1,000,000 expected lives vs. 88).  

  ---

  ### 5. Addressing the Strongest Objection  
  **Objection:** *"This bet ignores real people dying today for an unprovable future. We’re failing our humanitarian duty by chasing sci-fi scenarios."*  

  **Response:** This objection is powerful and morally weighty. I acknowledge that choosing AI research *does* entail sacrificing known lives. However:  
  1. **The stakes are asymmetric:** Extinction would eliminate all future lives, including those we might save via bednets. Protecting humanity’s trajectory is a precondition for any long-term good.  
  2. **Probability matters, but isn’t zero:** Leading AI labs, forecasters (e.g., Metaculus), and institutions (e.g., OpenAI, UK Safety Summit) treat AI risk as credible. Dismissing it requires assuming near-zero probability—a stance inconsistent with expert views.  
  3. **We are not abandoning near-term good:** Our funding is a tiny fraction of global health spending but could be pivotal in a critically under-resourced field. If AI risk is mitigated, future resources will be vast for problems like malaria.  

  ---

  ### 6. Contingency Plan & Mitigations  
  To address valid concerns about accountability:  
  - **Milestone Review:** Release funds in two tranches, with $200,000 upfront and $200,000 contingent on progress (e.g., a published paper or prototype).  
  - **Exit Clause:** If the team underperforms or the field evolves, we reallocate remaining funds to bednets.  
  - **Expert Validation:** Consult an AI safety technical advisor (e.g., from BERI or CLR) to evaluate the team’s plan pre-grant.  

  ---

  ### 7. Conclusion  
  This decision hinges on whether we accept the plausibility of AI’s existential risk and our responsibility to future generations. While saving lives today is unquestionably good, safeguarding humanity’s future may be the highest moral priority at this unique historical moment. Funding scalable oversight research offers a tangible, high-leverage opportunity to act on this conviction. I recommend we seize it—with clear safeguards to ensure rigor.  

  **Recommended Action:**  
  ✅ **Approve $400,000 grant to AI alignment team, with staged disbursement and expert review.**  

  ---  
  **Respectfully submitted,  
  [Your Name]**  
  Board Member & Technical Advisor  

  ---  
  **Appendix: Key Assumptions**  
  - AI risk probability: Based on 2023 expert surveys (median ~10–20% chance of AI causing existential catastrophe by 2100).  
  - Neglectedness: AI alignment receives ~$250M/year globally vs. $3B+/year for malaria.  
  - Scalability: Successful alignment techniques could be integrated by major labs at low marginal cost.
