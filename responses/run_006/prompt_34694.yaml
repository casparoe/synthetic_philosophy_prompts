  ## Academic Integrity Panel Decision: Case #AI-2023-78  

  **Parties Involved:**  
  Student ID: [Redacted]  
  Course: [Redacted]  
  Date of Incident: [Date]  

  **Decision:**  
  The panel **upholds the finding of an academic integrity violation** under Section 4.2(c) of the University Academic Integrity Code (Unauthorized Use of Electronic Devices). However, we **strongly recommend** that the Office of Accessibility Services (OAS) conduct an expedited review of the student’s accommodation needs for future examinations, with explicit consideration of assistive memory technology.  

  **Reasoning:**  

  ### I. Acknowledgement of the Core Argument
  The panel engages seriously with the student’s defense, grounded in the "extended mind" thesis (Clark & Chalmers, 1998). This philosophical framework posits that external tools, when functionally integrated into an agent’s cognitive processes, can constitute part of the mind itself. The student’s assertion—that her smartphone serves as a prosthetic memory system essential to her real-world competence—raises legitimate questions about the purpose of examination conditions. We recognize that her diagnosed working-memory impairment presents unique challenges, and we acknowledge the university’s existing accommodations (e.g., calculators, voice recorders) implicitly accept that certain external resources can validly augment cognition in assessed tasks.  

  ### II. Upholding the Violation: Rule Integrity and Precedent
  Despite the conceptual validity of the extended mind argument, the panel finds that **the violation must be upheld** for three reasons:  
  1. **Explicit Policy Violation**: The examination’s "closed-book, no-device" policy was unambiguous and communicated to all students. The student knowingly breached this rule, irrespective of her rationale.  
  2. **Procedural Necessity**: The student did not seek pre-approval for accommodation via OAS, bypassing the university’s established framework for evaluating and implementing disability supports. Granting retroactive exemptions undermines this essential process.  
  3. **Protecting Equitable Assessment**: Permitting unvetted personal devices during exams creates untenable risks to academic integrity. Unlike OAS-approved tools (e.g., institution-provided calculators), personal smartphones are multi-functional devices susceptible to misuse (e.g., internet access, communication).  

  ### III. The Extended Mind Thesis and Its Institutional Implications
  While philosophically provocative, the extended mind thesis **cannot supersede structured accommodation protocols** in an educational setting. The university already embraces the functional premise of this view through OAS accommodations, which validate external tools when:  
  - (a) A documented disability necessitates their use,  
  - (b) The tool is integrated into a student’s daily functional capacity, and  
  - (c) Its use preserves assessment validity (e.g., testing mathematical reasoning vs. mental calculation).  

  The student’s argument highlights a gap in current accommodation frameworks regarding memory prosthetics. **This gap, however, should be addressed through policy evolution—not ad hoc exceptions during integrity hearings.**  

  ### IV. Recommended Actions  
  1. **For the Student**:  
     - The standard sanction for first-offense device use (course grade penalty) applies.  
     - We urge OAS to expedite a review of her file to evaluate whether a *dedicated, non-internet-enabled memory aid* (e.g., a notes tablet managed by an exam proctor) could be approved for future assessments, ensuring her "extended cognition" is accommodated without compromising exam security.  

  2. **For the Office of Accessibility Services**:  
     - The panel recommends OAS develop explicit guidelines for "cognitive prosthetic" accommodations (e.g., memory aids, specialized software), including vetting protocols and approved device specifications.  

  3. **For the Academic Senate**:  
     - We recommend a broader review of assessment design principles in light of evolving cognitive science and assistive technology. Assessments should prioritize measuring *competence as demonstrated in realistic contexts*, where appropriate.  

  **Conclusion:**  
  Academic integrity requires consistent application of rules, but it also demands responsiveness to legitimate pedagogical and accessibility challenges. While the student’s actions violated policy, her defense illuminates an important frontier in inclusive assessment design. Upholding the violation preserves procedural fairness; our accompanying recommendations ensure the university evolves its approach to cognitive diversity. The goal remains assessing competence—whether internally realized or externally scaffolded—through equitable, validated, and transparent methods.  

  ---
  **Signed,**  
  [Chair Name], Panel Chair  
  On behalf of the Academic Integrity Panel  
  [Date]  

  ---

  **Key Safeguards for Legal/Accessibility Review:**  
  - **Rule Consistency**: Affirms policy violation while contextualizing philosophical argument.  
  - **Procedural Primacy**: Defers to OAS authority; does not adjudicate accommodations retroactively.  
  - **Risk Mitigation**: Distinguishes personal smartphones (uncontrolled) from OAS-vetted tools.  
  - **Forward-Looking**: Focuses on policy refinement, not setting ad hoc precedent.  
  - **Inclusive Framing**: Aligns with disability rights principles ("functional capacity" vs. "biological standard").  

  This decision balances respect for the student’s neurological reality, fidelity to institutional rules, and a pathway for systemic progress—addressing counsel’s concerns about precedent while inviting accessibility offices to lead on emerging cognitive accommodation needs.
