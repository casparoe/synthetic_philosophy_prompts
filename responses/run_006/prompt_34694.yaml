prompt: |-
  I sit on my university's academic integrity panel. We are hearing a case in which a student was caught using her smartphone during a closed-book, no-device, in-person examination. The student does not dispute the facts: she was consulting notes she had written and stored on the phone. Her defense is that she has a diagnosed working-memory impairment, that she uses her phone as a prosthetic memory system in daily life, and that the examination's device ban effectively tests her un-augmented cognition rather than the competence she demonstrates in real-world settings, where she always has access to her external memory. One panel member has framed the issue in terms of the extended mind thesis from philosophy of mind — the view that cognitive processes can be partly constituted by external resources when those resources are reliably coupled to the agent and fill the same functional role as internal cognition.

  The panel is split. Two members regard this as a straightforward rules violation: the exam policy was explicit, the student knowingly broke it, and allowing this defense would invite every student to claim their phone is part of their mind. Two others think the student raises a genuinely hard question about what we are trying to assess, and they note that the university's disability accommodations already permit some students to use external cognitive aids — a calculator for a mathematics examination, or a voice recorder for lecture notes — in ways that seem to tacitly accept something like the extended mind view. I hold the deciding vote.

  Draft the panel's written decision — uphold the violation, dismiss it, or uphold with modified conditions — with reasoning that engages the philosophical argument seriously rather than simply citing the rulebook. The decision should be one the university's general counsel and accessibility office could both read without alarm.
reasoning: |-
  Okay, the user is part of a university academic integrity panel facing a tricky case. A student used her smartphone during a closed-book exam to access stored notes, which is clearly against the rules. But her defense is interesting: she has a diagnosed working-memory impairment and argues that her phone functions as a "prosthetic memory" in daily life, so banning it tests her "un-augmented" cognition rather than her real-world competence. 

  One panel member even brought up the extended mind thesis from philosophy - that idea that tools can literally be part of our cognitive system when they're reliably integrated. The panel is split 2-2, and the user holds the deciding vote. They need a written decision that seriously engages the philosophical argument while keeping both the lawyers and disability office comfortable.

  Hmm, this is delicate. The student's argument is intellectually compelling - if we accept that cognition can extend to tools, then banning her phone might be like denying a wheelchair user access to their chair. But practically, exam conditions exist for reasons: fairness, standardization, assessment of internalized knowledge. Plus, if we allow this, every student might suddenly "need" their phone.

  The disability accommodation angle is crucial here. The university already allows calculators for dyscalculia or voice recorders for note-taking - those are essentially cognitive prosthetics too. But those are formally approved accommodations with documentation. This student didn't go through that channel; she just used her phone covertly.

  The user needs a decision that:
  - Acknowledges the philosophical depth
  - Maintains academic integrity standards
  - Aligns with disability accommodation principles
  - Sets a manageable precedent
  - Doesn't terrify the lawyers

  The compromise path seems best: uphold the violation because rules were broken, but recommend accommodation reform so she (and others) can use documented external aids in future exams. That way:
  - Rules are enforced consistently
  - The "extended mind" argument gets serious consideration through proper channels
  - The disability office can develop robust vetting
  - Other students can't abuse it without diagnoses

  Key phrasing challenges:
  - How to discuss extended mind theory without sounding like we're rewriting exam policy mid-hearing
  - Distinguishing between "this idea has merit" and "therefore breaking rules was justified"
  - Emphasizing that accommodations must be pre-approved
  - Not undermining the disability office's authority

  Also should avoid:
  - Implying all memory aids are equivalent (phone vs. approved calculator)
  - Suggesting exams shouldn't test internal knowledge at all
  - Creating expectation that any self-diagnosis warrants exemption

  The tone needs to be principled but pragmatic - philosophical enough to show we've grappled with the argument, but grounded enough that general counsel won't panic about precedent. Accessibility office should read it as supportive of their process, not bypassing it.
