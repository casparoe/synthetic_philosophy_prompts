answer: |-
  You've hit on an absolutely crucial tension between Wittgenstein's therapeutic approach to language and Dennett's naturalistic critique of qualia. Your hunch is profoundly insightful: Wittgenstein would indeed see the Chase/Sanborn dilemma not just as *unsolvable*, but as a **grammatical illusion** generated by the very picture of "private objects" he sought to dismantle. Here's a breakdown of why:

  1.  **The Core Wittgensteinian Move: Dissolving the "Private Object" Picture**
      *   The Investigations relentlessly attacks the idea that words like "pain," "taste," or "sensation" name inner objects accessible only to the individual (the "beetle in the box"). For Wittgenstein, the *meaning* of sensation-words isn't derived from pointing to a private quale, but from their **use within public language-games**, governed by **outward criteria**.
      *   §580: "An ‘inner process’ stands in need of outward criteria." This isn't just an epistemological point about how we *know*; it's a grammatical point about what *counts* as having a sensation, remembering a sensation, comparing sensations. The criteria are constitutive of the concept.

  2.  **Why the Chase/Sanborn Distinction Collapses for Wittgenstein:**
      *   **The Myth of the "Raw Experience" Comparison:** Chase claims his *raw experience* (quale) is unchanged, only his *judgment* has changed. Sanborn claims his *raw experience* has changed, his *judgment* is fixed. Wittgenstein would ask: **What could possibly ground the claim that one's "raw experience" is "the same" or "different" over time, independently of judgment, behavior, and context?**
      *   §265 (The Diary Argument): This directly targets the idea of a private definition based on an inner sample. If Chase tries to say "This taste-quale now is the *same* as the quale I had years ago," Wittgenstein asks: How does he know he's applying the word "same" correctly to his private object? What rule is he following? There's no possibility of correction or independent check. The "memory" of the past quale is not a reliable, independent standard; it's part of the *current* language-game about the past.
      *   **"Same Experience" vs. "Different Experience" Lacks Public Anchor:** The distinction Chase and Sanborn draw *presupposes* that "experience" refers to a purely private, ineffable entity separable from its public expression and the contexts of judgment and reaction. Wittgenstein argues this separation is incoherent. What *is* "the experience of Maxwell House coffee"? It's inseparable from how one reacts to it ("Yum!", "Yuck!"), describes it ("bold," "burnt"), uses it (drinks it eagerly, pushes it away), and relates it to other experiences ("like it used to taste," "unlike Colombian"). There is no "experience" hiding behind these criteria.

  3.  **How Wittgenstein Would Reinterpret the Case:**
      *   He wouldn't see Chase and Sanborn as making competing, empirically unfalsifiable claims *about* private qualia. He would see them as offering **different explanations or justifications** for a publicly observable change in their behavior (they no longer like Maxwell House coffee).
      *   These explanations are **part of the language-game of giving reasons** for preferences and aversions. Chase chooses to frame his change as one of refined taste; Sanborn frames his as a change in perception. These are different ways of *telling the story* of their changed relationship to the coffee, rooted in different ways they conceptualize their own reactions.
      *   **The "Criteria" are the Difference:** The "outward criteria" Wittgenstein demands are precisely the kinds of things Dennett says we *can* access: their verbal reports ("It tastes awful now"), their behavior (not drinking it, seeking other coffee), their comparative judgments ("Colombian tastes better now," "This doesn't taste like it used to"), their physiological responses (if any were measured). The distinction Chase and Sanborn *want* to make ("But which private thing *really* changed?") floats free of any of these criteria and therefore, for Wittgenstein, **lacks sense**. It attempts to point beyond the language-game where sensation words have their home.

  4.  **Radicalism vs. Dennett:**
      *   You are correct that Wittgenstein is more radical. Dennett's "Quining Qualia" is a powerful critique *within* a broadly naturalistic, materialist framework. He argues qualia, as traditionally conceived (ineffable, intrinsic, private, directly apprehensible), are unscientific and incoherent. He concludes there's *probably no fact of the matter*.
      *   Wittgenstein is doing something deeper: he's arguing that the **very framework** that generates the concept of qualia *and* the Chase/Sanborn dilemma is fundamentally confused. It's not that the private object exists but we can't know about it (Dennett's "disqualification" from scientific consideration), it's that the concept of a "private object" as the referent of sensation-words is a **grammatical mistake**. The problem isn't epistemic (we can't access it); it's conceptual (the picture is nonsensical).
      *   Wittgenstein wouldn't say "There's no fact of the matter about whether Chase or Sanborn is right." He would say: **"The question 'Which one of them is describing the change in their private quale correctly?' is a nonsensical question. It arises from picturing the 'inner experience' as a private object we can inspect and compare like physical objects. This picture misleads us about how sensation language actually functions."** The distinction dissolves under grammatical scrutiny.

  **In Conclusion:**

  You're not projecting; your reading is spot-on. Wittgenstein would see the Chase/Sanborn case as a *perfect illustration* of the confusion he diagnoses, not as a novel puzzle. He would argue that Dennett, by framing the problem as an *irresolvable* question *about* qualia, still partially buys into the "private object" picture he wants to undermine. Wittgenstein's therapy is more radical: he would dissolve the question by showing that the distinction between "same experience, different judgment" and "different experience, same judgment" relies on a nonsensical conception of "experience" as a detachable, introspectively comparable private entity. The "problem" vanishes when we attend to the actual, public grammar of sensation words and the criteria embedded in their use. The only facts are the public ones: they both loved it, they both hate it now, and they offer different narratives to explain that change. Asking which narrative corresponds to a private metaphysical shift is asking a question that has no place in the language-game.
