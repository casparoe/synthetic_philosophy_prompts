  ### XOR Blackmail Workshop Design  
  **Goal:** Create an experiential simulation where participants naturally encounter the XOR blackmail dilemma without prior explanation, then debrief to formalize the concept.  

  ---

  ### **Rules & Materials**  
  **Participants:** 25 people (12 pairs + 1 observer/facilitator assistant).  
  **Time:** 75 minutes total.  
  **Materials:**  
  - Role cards (12 "Blackmailer" cards, 12 "Victim" cards).  
  - Sealed envelopes per pair (each containing a coin and a hidden "dirt" slip: 50% say "DIRT EXISTS," 50% blank).  
  - Point tokens (or scorecards) for tracking utility.  
  - Whiteboard for tracking decisions.  

  **Setup:**  
  - Each player starts with **100 points**.  
  - Points represent "life satisfaction" (non-monetary incentive).  
  - Form 12 pairs (1 Blackmailer + 1 Victim). The 25th person helps you track outcomes.  

  ---

  ### **Game Flow & Script**  
  #### **Phase 1: Blackmailer’s Move** (15 mins)  
  **Facilitator Script:**  
  *"Each pair has a Blackmailer and a Victim. Blackmailers, you’ve drafted a blackmail letter but haven’t checked if you have real dirt. You must decide: SEND or DON’T SEND the letter.  
  - If you SEND, pay a 10-point cost (for effort/risk).  
  - If you DON’T SEND, nothing happens.  
  Victims, wait passively—you’ll act later."*  

  **Mechanics:**  
  - Blackmailers decide in private.  
  - If they SEND:  
    - Pay 10 points.  
    - Take a sealed envelope (coin + hidden "dirt" slip).  
    - **Do not open yet!** The envelope’s contents are unknown to all.  

  #### **Phase 2: Victim’s Move** (15 mins)  
  **Facilitator Script:**  
  *"Victims, if you received a letter, decide: PAY 30 points or DON’T PAY.  
  - If you PAY: The blackmailer gets 30 points. Game over.  
  - If you DON’T PAY: The envelope is opened.  
    - If the slip says ‘DIRT EXISTS,’ you lose 70 points.  
    - If the slip is blank, you lose 0.  
  Remember: The blackmailer sent the letter blind. The dirt has a 50% chance of existing."*  

  **Mechanics:**  
  - Victims decide.  
  - Non-paying Victims open envelopes publicly. Apply penalties.  

  #### **Phase 3: Outcome Calculation** (10 mins)  
  - Pairs report results:  
    - Blackmailer’s decision (SEND/DON’T SEND).  
    - Victim’s decision (PAY/DON’T PAY).  
    - Dirt outcome (if revealed).  
  - Record scores on a whiteboard.  

  ---

  ### **Payoff Scheme**  
  | **Scenario** | **Blackmailer Points** | **Victim Points** |  
  |--------------|------------------------|------------------|  
  | Don’t send letter | 100 | 100 |  
  | Send + Victim pays | 100 - 10 + 30 = **120** | 100 - 30 = **70** |  
  | Send + Victim doesn’t pay + Dirt exists | 100 - 10 = **90** | 100 - 70 = **30** |  
  | Send + Victim doesn’t pay + No dirt | 100 - 10 = **90** | **100** |  

  **Rational Incentive:**  
  - Victim’s expected value of not paying: `(0.5 × 30) + (0.5 × 100) = 65`.  
  - Paying gives 70 > 65 → **Paying is rational.**  
  - Blackmailer’s expected value of sending: If Victim pays (rational), they gain 20 points (120 vs. 100).  

  ---

  ### **Debrief & Connection to XOR Blackmail** (20 mins)  
  **Step 1: Elicit Emotions**  
  - Ask Victims: *"Why did you pay (or not pay)?"*  
  - Ask Blackmailers: *"Why did you send (or not send)?"*  
  - Highlight cognitive dissonance: *"Many of you paid despite knowing the blackmailer might be bluffing. Why?"*  

  **Step 2: Formalize the Paradox**  
  - Reveal the XOR Blackmail structure:  
    - **Blind Threat:** Blackmailer commits without knowing if dirt exists.  
    - **Victim’s Calculus:** Paying beats the *expected value* of not paying, even with bluffing risk.  
    - **Acausal Leverage:** The threat’s power comes from the *counterfactual*—if dirt exists, refusing payment triggers harm. Rationality forces payment.  

  **Step 3: Limits and Real-World Caveats**  
  - **Where it bites:** One-off interactions, rational actors, high stakes (e.g., corporate secrets).  
  - **Where it fails:**  
    - Repeat interactions (reputation matters).  
    - Irrational actors (e.g., principled non-payers).  
    - Legal/social risks (e.g., blackmail is illegal).  

  ---

  ### **Honest Postmortem: Predictable Challenges**  
  1. **Victims rebel:** Some will refuse to pay on principle ("I won’t negotiate!").  
     - **Mitigation:** Emphasize point maximization as the goal.  
  2. **Misunderstood probabilities:** Participants may ignore 50% dirt likelihood.  
     - **Mitigation:** Clarify odds repeatedly; use simple analogies ("coin flip").  
  3. **Blackmailers under-send:** Fear of losing 10 points if Victims rebel.  
     - **Mitigation:** Post-game show math: Sending is optimal *if* Victims are rational.  

  **What the Activity Can’t Replicate:**  
  - **The Counterfactual Tie:** In XOR Blackmail, paying *prevents* the blackmailer from checking dirt. Here, non-payers force the reveal. You must explain:  
    *"In the pure paradox, paying doesn’t just avoid risk—it severs the link between the blackmailer’s knowledge and your action. Your payment controls whether they *ever* learn about the dirt."*  

  ---

  ### **Timeline**  
  - **0:00–0:10** Intro + role assignment.  
  - **0:10–0:25** Phase 1 (Blackmailers decide).  
  - **0:25–0:40** Phase 2 (Victims decide).  
  - **0:40–0:50** Phase 3 (Outcomes + scores).  
  - **0:50–1:10** Debrief (emotions → theory → limits).  
  - **1:10–1:15** Q&A.  

  This design forces participants to *feel* the paradox’s pull ("I have to pay even though they might be bluffing!") before dissecting it. The envelope mechanic mirrors the blackmailer’s ignorance, and point losses make stakes visceral. Run it twice if time allows—behavior often shifts toward rationality in Round 2!
