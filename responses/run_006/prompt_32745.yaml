prompt: |-
  I've been working out my views on what separates real science from pseudoscience, mostly from reading popular books and following debates online. I haven't studied philosophy formally, so I may be missing distinctions that would clarify things, but I've arrived at a set of commitments that feel right to me. I'd like someone to check whether they actually hang together before I start defending them to other people.

  Here's where I've landed:

  (1) The thing that makes science special is falsifiability, roughly as Popper described it. A claim is scientific only if it rules out some possible observations — if it sticks its neck out and says "you won't see X." If you do see X, the claim is in trouble. This is what draws the line between science and everything else.

  (2) Freudian psychoanalysis is on the wrong side of that line. It can explain any behavior whatsoever. If you're early to an appointment, it's anxiety; if you're late, it's resistance. There is no imaginable observation about a person that a psychoanalyst couldn't fit into the framework after the fact. That's pseudoscience.

  (3) But I also think evolutionary biology is solid science, even though I've seen critics argue that adaptationist explanations are just-so stories in exactly the same way — that you can take any trait an organism has and retrofit an adaptive story about why natural selection would have favored it. I think this criticism misses something important, but I'm not sure I can say what that something is without also accidentally letting psychoanalysis back in.

  (4) I think climate science is genuine science. I also think that when a theory's defenders keep adjusting it to dodge falsification rather than admitting a problem, that's a hallmark of pseudoscience. But climate models do get adjusted when they miss predictions, and I don't think that makes climate science pseudoscientific. So I need a way to tell the difference between legitimate updating and illegitimate evasion, and I'm not sure my principle in (1) gives me one.

  (5) Lately I've been wondering whether the real criterion is about the attitude of the practitioners rather than the logical structure of the theory: do they treat a failed prediction as a problem that needs fixing, or as an inconvenience to be explained away? But I can't tell whether this is just (1) restated in psychological language, or whether it's a genuinely different standard — and if it's different, whether it conflicts with (1) in cases where they point in opposite directions.

  So my question is: which of these commitments are actually in tension with each other, which ones only look like they're in tension but aren't on closer inspection, and what is the least costly revision to make the whole set consistent? Please rank the tensions by severity rather than treating them all as equally serious, and for each one, say what would have to give and what the revision would cost me.
reasoning: |-
  Okay, let me start by understanding this user's query. They're trying to distinguish real science from pseudoscience and have outlined five key points. They're concerned about internal consistency and want to know which parts conflict, which can be reconciled, and how to fix the tensions with minimal cost. 

  First, I need to break down each commitment. Point 1 is about falsifiability as the core criterion. Points 2 and 3 contrast Freudian psychoanalysis (pseudoscience) with evolutionary biology (legitimate science), despite both facing similar "just-so" story criticisms. Points 4 and 5 deal with climate science adjustments and whether practitioner attitudes matter more than theory structure.

  The main tensions I see are between strict falsifiability and real scientific practices. For example, evolutionary biology uses adaptive explanations that are flexible but still scientific. Climate models get updated without being pseudoscience. The user also brings up practitioner attitudes versus logical structures. 

  I should consider Popper's falsifiability but also its critiques. Lakatos' research programs and Kuhn's paradigms come to mind. For evolutionary biology, the difference from Freud might be in the presence of auxiliary hypotheses and independent testability. Climate science's model adjustments are part of normal science, not evasion, because they're based on new data and improve predictive power. 

  The user's point about attitudes might align with Lakatos' idea of a progressive vs. degenerative research program. But reducing it solely to attitudes could be problematic—it's about whether adjustments lead to novel predictions. 

  The biggest tension is between the strict falsifiability in point 1 and the legitimate practices in points 3 and 4. The user might need to relax the strictness of falsifiability as the sole criterion. Introducing auxiliary hypotheses and independent testability could help. Also, distinguishing Popper from Lakatos would clarify when adjustments are legitimate. 

  For Freud vs. evolutionary biology, highlighting methodological rigor and testability of core principles is key. Climate model updates are part of iterative refinement, not evasion. The attitude point in 5 is related but needs to be framed within a structured framework like Lakatos to avoid subjectivity. 

  The user might not have considered the role of auxiliary hypotheses or progressive research programs. They need a balance between theory structure and practice. The least costly revision is refining falsifiability to include these aspects, which preserves their core ideas without major overhauls. 

  Ultimately, their framework is mostly sound but needs nuanced additions from philosophy of science to handle real-world complexities. They’re on the right track but should integrate concepts beyond Popper to resolve tensions.
answer: |-
  Your framework is thoughtful and more coherent than you might think, but there are genuine tensions—some resolvable with refinement, others requiring concessions. Here's a breakdown of tensions ranked by severity, along with minimal-cost revisions:

  ### 🔥 **Severe Tension: (1) vs. (3) & (4)**  
  *(Falsifiability vs. Evolutionary Biology & Climate Science)*  
  **The Conflict**: Strict Popperian falsifiability struggles with theories that are *broadly explanatory* (like evolutionary biology) or *complex/model-dependent* (like climate science).  
  - **Evolutionary Biology**: Adaptationist hypotheses *can* be falsifiable (e.g., "Trait X evolved for function Y" predicts we won't find fossil evidence of X in environments where Y is irrelevant). But critics argue practitioners often retrofit *untestable* stories.  
  - **Climate Science**: Models are constantly adjusted ("model tuning") to new data. If *any* adjustment is "dodging falsification," climate science fails (1).  

  **Least-Cost Revision**:  
  - **Replace (1) with Lakatos' "Research Programmes"**: Keep falsifiability but apply it to the *core* of a research program, not every auxiliary hypothesis.  
    - *Core* (e.g., natural selection) must be falsifiable and protected by a "protective belt" of adjustable auxiliary assumptions (e.g., specific adaptive stories).  
    - Program is "progressive" if adjustments *lead to novel predictions*; "degenerating" if adjustments only *explain away failures* (saving Freud vs. evolution).  
  - **Cost**: You lose Popper's crisp simplicity. But you gain:  
    - ✅ **Evolutionary Biology**: Core (natural selection) is falsifiable (e.g., if traits *never* correlated with fitness). Auxiliary stories are legitimate if they generate *new* tests (e.g., genetic constraints).  
    - ✅ **Climate Science**: Core (CO₂ drives warming) is falsifiable. Model adjustments are legitimate if they *improve predictive scope* (e.g., better Arctic ice loss forecasts), not just save the core.  

  ---

  ### ⚠️ **Moderate Tension: (1) vs. (2)**  
  *(Falsifiability vs. Freud as Pseudoscience)*  
  **The Conflict**: (1) implies Freudianism is unscientific because it explains everything. But *why* is this bad? Popper focused on *logical structure*, but Freudians *could* claim their theory *is* falsifiable (e.g., "All dreams fulfill wishes" *could* be falsified by a non-wish-fulfilling dream).  

  **Least-Cost Revision**:  
  - **Clarify (1) with "Testability"**: A theory is pseudoscientific not *just* because it’s unfalsifiable, but because it **lacks *independent* testability of its mechanisms**.  
    - Freud fails: Concepts like "repression" or "Oedipus complex" can’t be observed/measured independently of the behaviors they explain.  
    - Evolutionary biology succeeds: Genetic drift, selection pressures, or fossil sequences *can* be tested independently of trait explanations.  
  - **Cost**: None. This strengthens (2) without altering (1)'s spirit.  

  ---

  ### 🔄 **Apparent Tension (Resolvable): (3) vs. (2)**  
  *(Evolution vs. Freud both "Just-So Stories")*  
  **Why It’s Not a Real Conflict**:  
  - **Evolutionary "stories" are constrained**: They must fit:  
    - (a) Fossil/geological timelines,  
    - (b) Genetic/phylogenetic data,  
    - (c) Mathematical models of selection/drift.  
  - **Freud has no comparable constraints**: No independent evidence for id/ego/superego; no timeline for "repression"; no way to rule out alternative explanations.  
  **Resolution**: Hold firm on (3). The criticism of evolutionary biology is valid *only when done poorly*—but the field has tools to correct this (e.g., testing adaptive hypotheses against neutral models).  

  ---

  ### 🤔 **Subtle Tension: (1) vs. (5)**  
  *(Falsifiability vs. Practitioners' Attitude)*  
  **The Conflict**: (5) suggests science/pseudoscience distinction depends on *sociological factors* (scientists' behavior), while (1) is about *logical structure*. What if a falsifiable theory is defended dogmatically?  

  **Resolution**:  
  - **Integrate (5) into Lakatos' Framework**: A "progressive" research program (legitimate science) *requires* practitioners to treat anomalies as problems to solve via *novel predictions*. A "degenerating" program (pseudoscience) explains away failures *without generating new tests*.  
    - *Example*: Einstein treating Mercury’s orbit anomaly as a problem to solve → led to novel predictions (light bending).  
  - **Cost**: You accept that science isn’t *just* about theories—it’s about how communities *use* them. But this doesn’t contradict (1); it operationalizes it.  

  ---

  ### 📝 **Summary of Revisions & Costs**  
  1. **Replace (1)** with **Lakatos' research programmes** (cost: lose Popper's simplicity; gain resolution of severe tensions).  
  2. **Clarify (2)** with **independent testability** (cost: none).  
  3. **Keep (3)** as-is—evolution is saved by constraints (cost: none).  
  4. **Reframe (5)** as **part of Lakatos' framework** (cost: accept social elements in demarcation).  
  5. **(4) resolves automatically**: Climate science is progressive (adjustments yield better predictions); Freud is degenerative (endless excuses, no new tests).  

  ### 💎 Why This Works  
  You preserve your core insight—science risks falsification—while acknowledging real-world practices. The cost (abandoning pure Popper) is necessary and low, as even Popper recognized complexity in fields like evolution. Your intuition about practitioner attitudes (5) was astute: it aligns with how philosophers like Lakatos and Kuhn *salvaged* falsifiability from its own limitations.
