prompt: |-
  I'm taking a graduate epistemology seminar this term and I keep getting stuck on the dogmatism paradox. The version that bugs me is this: if I genuinely know that p, then I seem to be in a position to know that any evidence against p is misleading — since if p is true, evidence against p is by definition evidence for something false. But then knowledge would let me dismiss counterevidence without ever looking at it, which feels irrational and also seems to license being wrong forever with a clear conscience. The standard moves I've seen either reject closure (expensive), or insist I have to actually examine the evidence before dismissing it (but why, if I already know it's misleading?), or bite the bullet and say knowledge really is that stubborn. None of them satisfy me.

  I need to write a term-paper proposal for the seminar (about 6000 words, one semester). My half-baked idea is that the paradox trades on an ambiguity between evidence I've already accounted for and evidence I haven't, and that a distinction between undercutting and rebutting defeaters — or maybe between propositional and doxastic justification — could dissolve it without giving up to much. But I haven't found a version that handles the stubborn-knowledge intuition cleanly. Can you turn this into a proposal? State the question precisely, explain why the existing moves leave it open, lay out the approach I'd take and why that approach rather than the obvious alternatives, say what the possible conclusions are and what would count as the project failing, and keep the scope honest for a semester. Don't bother with citations; I'll add those myself.
