prompt: |-
  I'm taking a philosophy of science course this term and we just spent a week on Hempel's raven paradox. I can follow the formal point — the equivalence condition plus the Nicod criterion means a green sock confirms "all ravens are black" — but it still feels like a party trick, and I'm pretty sure most of my classmates feel the same. I help run a discussion section for the course, about 16 undergrads, 60 minutes, and I want to run an activity that makes them actually feel the force of the thing instead of just nodding along.

  Could you design a runnable in-class activity or game for that setting? What I want them to come away seeing is that you can't dismiss the green sock for free: you have to give up or weaken either the equivalence condition (that a hypothesis and it's contrapositive are confirmed by the same evidence) or the Nicod criterion (that a positive instance confirms a universal generalization), and each option costs you something. But I don't want to tell them that up front — the rules, roles, or incentives should push them into the inconsistency themselves, and we only name it in the debrief.

  Some constraints: no real money, and materials should be simple (cards, slips, a whiteboard, some kind of points scheme). The activity should include a moment where they have to commit — like sorting cards as evidence for/against/irrelevant, or betting on the rule after each draw — and then have to reconcile what they said with a logically equivalent rule. Include black non-ravens as a distractor category too, because under the standard account those are neutral and that also surprises people. The debrief should map the moments in the activity onto the formal bits: the Nicod criterion, the equivalence condition, why a non-black non-raven is a positive instance of the contrapositive but feels irrelevant, and why black non-ravens are neutral. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the paradox the activity can't reproduce and I'd have to supply myself.

  And if you can work in the "but green socks are way more common than ravens" move — the thought that the background distribution makes the sock irrelevant — and why that either is or isn't a way out, that'd be great, because someone always bring it up.
reasoning: |-
  We are going to design an activity that makes students experience the Raven Paradox and forces them to confront the trade-offs between the Nicod criterion and the equivalence condition.

  Activity Title: "The Rule Confirmation Game"

  Goal: Students will see that they must either accept that non-black non-ravens (like a green sock) confirm "All ravens are black" or abandon/modify either the Nicod criterion or the equivalence condition.

  Materials:
  - Index cards (or slips of paper) representing objects. We need four categories:
    1. Black ravens (BR) - e.g., card says "Raven, Black"
    2. Non-black ravens (if any exist, but in our rule they shouldn't) - but we won't have these because the rule is "all ravens are black", so we assume none. However, we can have a card that would falsify, but we won't use it until maybe as a surprise? Or skip to avoid confusion? Instead, we focus on the other three.
    3. Non-ravens that are black (nonR_B) - e.g., "Shoe, Black"
    4. Non-ravens that are non-black (nonR_nonB) - e.g., "Sock, Green"

  We are going to have a fixed set of cards. Let's say we have 20 cards with the following distribution (to simulate the real world where non-ravens are common and ravens are rare, and non-black things are also common):
  - 2 Black ravens (BR)
  - 8 Non-ravens that are black (nonR_B) - e.g., black shoes, black cats, etc.
  - 10 Non-ravens that are non-black (nonR_nonB) - e.g., green socks, red apples, etc.

  We do not include any non-black ravens because if we did, that would falsify the rule immediately.

  Set up:
  - We have a rule: "All ravens are black." (Write this on the board.)
  - We also have its contrapositive: "All non-black things are non-ravens." (Write that too, but maybe not at the start. Reveal later.)

  Activity Steps:

  1. Introduction (5 minutes):
     - Explain the game: We are trying to confirm or disconfirm the rule "All ravens are black". We will draw cards one by one from a deck (face down) that represent things we observe in the world. After each draw, students will have a chance to update their confidence in the rule.

  2. Confidence Tracking:
     - We'll have a confidence meter on the board (a number line from 0 to 100, or use tokens to represent confidence points). Start at 50 (neutral).
     - Alternatively, we can have students write down their confidence (as a percentage) on a slip after each draw, but that might be time-consuming. Instead, we can do a show of hands for ranges? Or we can use a different method: assign each student a starting point (say 50 points) and they can bet points on the rule being true. We'll go with a simpler method: we ask the class to vote on whether the drawn card is evidence for the rule, against the rule, or irrelevant. Then we adjust the class confidence accordingly. But we need to record individual commitments? Alternatively, we can have them play in small groups (4 groups of 4) to discuss and then report.

     Given time constraints, let's do it as a whole class but with small group discussions at key points.

  3. Round 1: Drawing Cards and Initial Reactions (20 minutes):
     - Shuffle the deck and draw cards one at a time. For each card:
          - Reveal the card (e.g., "Raven, Black").
          - Ask: "Does this observation support (confirm) the rule 'All ravens are black'? Why or why not?"
          - We expect: A black raven confirms the rule (by Nicod).
          - Then draw a non-raven that is black (e.g., "Shoe, Black"). Ask the same question.
            - Expected: Some may say irrelevant, some may say it supports because it's consistent? But note: the rule doesn't say anything about non-ravens. So by the standard account, it's neutral. But in the paradox, black non-ravens are neutral? Actually, they are irrelevant because the rule only constrains ravens. However, under the equivalence condition, note that the contrapositive is "All non-black things are non-ravens". A black non-raven is not a non-black thing, so it doesn't speak to the contrapositive. Hence neutral.

          The problem is that the students might not see the black shoe as confirming the rule. We want them to see that by the Nicod criterion, only the black raven is a positive instance. The black shoe is not a raven, so it doesn't directly confirm the universal generalization about ravens. But note: the equivalence condition hasn't been introduced yet.

     We need to build the paradox step by step.

     Revised plan:

     Step A: Only use the rule "All ravens are black". Ask for each card:
        - If it's a black raven: almost everyone will say it confirms.
        - If it's a black non-raven: many will say irrelevant. We can note that the rule doesn't say anything about non-ravens, so it doesn't affect the rule? But then why is the green sock a problem? We haven't introduced the contrapositive yet.

     Step B: After a few draws (say one black raven, one black shoe, and then a green sock), introduce the contrapositive.

     How about we do:

     - First, draw a black raven. Class agrees: confirms. We increase confidence (say by 10 points, from 50 to 60).
     - Then draw a black shoe. Ask: does this confirm the rule? Many will say no. We keep confidence at 60.
     - Then draw a green sock. Ask: does this confirm the rule? Some might say no, some might say it's against? But note, the rule doesn't say anything about socks. So it's not against. But it's not a raven, so it doesn't directly confirm? So we keep confidence.

     Now, reveal the contrapositive: "All non-black things are non-ravens." Write it on the board.

     Ask: "Notice that the two rules are logically equivalent. They mean the same thing. So if you accept the first rule, you accept the second, and vice versa."

     Now, for the green sock: 
          - It is non-black (green) and non-raven (sock). So it is a positive instance of the contrapositive rule. Therefore, by the Nicod criterion (which says that a positive instance confirms a universal generalization), the green sock confirms the contrapositive. And because the two rules are equivalent, it must also confirm the original rule.

     Now we have a problem: the green sock, which we thought was irrelevant, now seems to confirm the rule.

     Step C: We then draw more cards and see how the students react.

     But note: we also have black non-ravens. For the contrapositive, a black non-raven: it is not non-black (because it's black) and it is a non-raven. So it is not an instance of the contrapositive rule at all (because the contrapositive is about non-black things). Hence, it's irrelevant to the contrapositive. Similarly, for the original rule, a black non-raven is not a raven, so it's irrelevant. So we have consistency: black non-ravens are neutral for both.

  4. The Activity with Commitment (20 minutes):

     We want them to commit to a judgment for each card. We'll do two phases:

     Phase 1: Without the contrapositive.
     - Show the rule: "All ravens are black."
     - Draw cards one by one. For each, have students (in small groups of 4) decide: 
          - Does this card support the rule? (Give 1 point for support, 0 for neutral, -1 for against)
          - They write their group's vote on a slip and hold it up.

     We'll have 5-6 draws (but we control the deck, so we can pre-set the order). Example order:
          1. Black raven (BR) -> expect support (1)
          2. Black shoe (nonR_B) -> expect neutral (0)
          3. Green sock (nonR_nonB) -> expect neutral (0) [but we want them to see later that it should be support?]
          4. Another black raven (BR) -> support (1)
          5. Green apple (nonR_nonB) -> neutral (0)
          6. Black cat (nonR_B) -> neutral (0)

     Record the scores.

     Phase 2: Introduce the contrapositive.
     - Write the contrapositive: "All non-black things are non-ravens."
     - Explain that these two rules are logically equivalent. So any evidence for one is evidence for the other.

     Now, take the same cards and re-evaluate under the contrapositive rule. For each card, ask: 
          - Does this card support the contrapositive rule? (Again, 1 for support, 0 neutral, -1 against)

     For the green sock: 
          - It is non-black and non-raven -> positive instance of the contrapositive -> support (1).
     For the black raven:
          - It is not non-black (it's black) and it is a raven (so not a non-raven). So it is not an instance of the contrapositive rule? Actually, the contrapositive rule is about non-black things. The black raven is black, so it doesn't fall under the contrapositive. So it's neutral? But wait, that seems to contradict the equivalence.

     This is a key point: the black raven does not directly confirm the contrapositive by Nicod because it's not a positive instance of the contrapositive. However, because the two rules are equivalent, we know that the black raven must also confirm the contrapositive. But that's because of the equivalence condition, not because of Nicod applied to the contrapositive.

     How to handle? We can note that the equivalence condition says that if two hypotheses are logically equivalent, then any evidence that confirms one confirms the other. So the black raven confirms the original rule, so it must also confirm the contrapositive. Similarly, the green sock (which we just saw confirms the contrapositive) must confirm the original rule.

     Now, we have a conflict: in Phase 1, for the green sock they said 0 (neutral) for the original rule, but now we see that it should have been 1 (support) because of the equivalence.

     So we ask: what should we do? We have two principles:
          (a) Nicod: positive instances confirm.
          (b) Equivalence: equivalent hypotheses are confirmed by the same evidence.

     But the green sock is a positive instance of the contrapositive (so by Nicod it confirms the contrapositive) and by equivalence it confirms the original rule. Therefore, we must change our initial assessment of the green sock being neutral for the original rule.

     Now, we can ask: are you willing to accept that the green sock confirms "all ravens are black"? If not, which principle do you want to drop?

  5. The Trade-off (10 minutes):
     - Discuss in small groups: 
          Option 1: Keep Nicod and equivalence -> then the green sock must confirm the rule.
          Option 2: Drop or weaken Nicod -> then we have to say that not all positive instances confirm? Which ones do?
          Option 3: Drop or weaken equivalence -> but that's very fundamental; we usually think that if two statements are logically equivalent, they have the same empirical content.

     Each group reports.

  6. The Background Distribution (10 minutes):
     - Now, address the common move: "But green socks are more common than ravens, so they shouldn't count as much."
     - We can simulate by having a deck with many more nonR_nonB (green socks) and very few ravens. In our deck, we had 10 nonR_nonB and only 2 BR. So if we draw a green sock, it's very common and doesn't tell us much about ravens? But note: the logic still holds. However, in Bayesian terms, the degree of confirmation might be tiny. But the paradox is about whether it confirms at all (even a little).

     - Point: The paradox is about confirmation in principle. The green sock does confirm, but only very weakly because there are so many non-black things and we already expect them to be non-ravens. But it still counts.

     - Alternatively, we might abandon the Nicod criterion for universal generalizations and use a Bayesian approach. But that's a way out.

  7. Debrief (10 minutes):
     - Map the activity to the concepts:
          - Black raven: positive instance of the original rule -> confirms by Nicod.
          - Green sock: positive instance of the contrapositive -> confirms the contrapositive by Nicod, and by equivalence confirms the original rule.
          - Black non-raven (black shoe): not a raven so not an instance of the original rule? And for the contrapositive, it's black so not an instance of the contrapositive (which is about non-black things). So neutral for both.
          - Why non-black non-raven (green sock) feels irrelevant: because we are focused on ravens, and the sock doesn't tell us about ravens. But logically, it does: if we found a non-black thing that was a raven, it would falsify both rules. So the absence of such things (like the green sock) is consistent with the rule and thus confirms it.

     - What do we give up? The options again.

  Predictable problems:

  1. Students might not accept that the green sock confirms the contrapositive? 
     - Solution: Emphasize the Nicod criterion: a positive instance is when the object satisfies both the antecedent and the consequent. For the contrapositive, the antecedent is "non-black" and the consequent is "non-raven". The green sock is non-black and non-raven -> positive instance.

  2. They might think the black raven does not confirm the contrapositive? 
     - But we don't need it to by Nicod. We have the equivalence condition: since the black raven confirms the original rule and the rules are equivalent, it must confirm the contrapositive. So we don't rely on Nicod for the contrapositive in this case.

  3. They might say that the black shoe (nonR_B) confirms the original rule because it's consistent? 
     - We can note that the rule doesn't forbid non-ravens from being black. So it's consistent, but it doesn't provide any new evidence about ravens. So it's neutral. Similarly, for the contrapositive, the black shoe is not non-black, so it doesn't fall under the contrapositive rule -> neutral.

  4. Time: This might run over. We have 60 minutes. We might skip some draws and do only 3 or 4 in Phase 1.

  Alternative Activity Structure:

  We can use a betting game:

  - Each group starts with 100 points.
  - The rule: "All ravens are black." We are going to test it with 10 draws from the deck (which we prepare in advance, but they don't know the distribution). 
  - After each draw, groups must bet some of their points on whether the rule is true (or false). But we don't know the truth until the end? We could have a fixed deck without non-black ravens (so the rule is true). But we don't tell them that.

  But then how do we score? We can score based on the confidence they show. Alternatively, we can have them assign a probability and then we use a scoring rule (like quadratic scoring) but that might be too complex.

  Given the constraints, I think the first approach with group voting and then the conflict when introducing the contrapositive is more straightforward.

  Let's write a script:

  Total time: 60 minutes.

  - (5 min) Introduction: Explain the rule and the goal. We have a deck of cards representing observed objects. We will draw and evaluate evidence.

  - (20 min) Phase 1: Without contrapositive.
    - Divide into 4 groups (each group of 4).
    - Draw cards one by one (we'll do 6 draws). For each card, groups have 1 minute to discuss and then hold up a card: 
          - Green: supports (1)
          - Yellow: neutral (0)
          - Red: against (-1)
    - We record on the board. We don't resolve disagreements yet, just record and move on.

    Pre-set deck order (for 6 draws):
        1. Black raven (BR) -> expect mostly green.
        2. Black shoe (nonR_B) -> expect mostly yellow.
        3. Green sock (nonR_nonB) -> expect mostly yellow.
        4. Black raven (BR) -> green.
        5. Green apple (nonR_nonB) -> yellow.
        6. Black cat (nonR_B) -> yellow.

    After the 6 draws, we have a sequence of votes.

  - (10 min) Introduce the contrapositive: "All non-black things are non-ravens." Explain equivalence.

  - (10 min) Phase 2: Re-evaluate the same 6 cards for the contrapositive rule.
    - For each card, groups discuss: does this support the contrapositive? (Green, yellow, red)
    - We do the same 6 in order. We expect:
          Card 1 (BR): Not non-black, so not a positive instance of the contrapositive. But note: it doesn't falsify either. So neutral? (yellow) BUT we have to remember that by equivalence, since it supports the original, it must support the contrapositive. So we have a problem: by direct Nicod on the contrapositive, it's neutral, but by equivalence it must be support. This is a bit messy. 

    Alternatively, we can avoid the ravens in the contrapositive evaluation and focus on the non-black non-ravens? 

    Let me refocus: We want to highlight the green sock. So let's do:

        For the green sock (card 3): 
            - In Phase 1 (original rule): they said neutral (yellow).
            - For the contrapositive: it is a positive instance -> so they must say green.

        Now, by equivalence, since the green sock confirms the contrapositive, it must confirm the original rule. Therefore, they should have shown green for the original rule for the green sock.

    So we can ask: "For card 3 (green sock), in Phase 1 you said neutral for the original rule. But now we see that it confirms the contrapositive, and by equivalence it must confirm the original rule. So we made a mistake in Phase 1: we should have marked it as support."

    Then we ask: "What about the other non-black non-ravens? (like the green apple, card 5) They also should be support for the original rule."

    And then: "What about the black non-ravens? (black shoe and black cat) For the contrapositive, they are not non-black, so they are not positive instances. So neutral. And for the original rule, they are not ravens, so neutral. So no change."

    And the black ravens: they are positive for the original rule and by equivalence also for the contrapositive. But note: they are not positive instances of the contrapositive. So we have two ways to get to the same conclusion: either by Nicod on the original rule or by equivalence from the original to the contrapositive. But we don't need Nicod on the contrapositive for the black ravens.

    The problem is only for the green sock: we thought it was neutral for the original rule, but by the equivalence condition and the Nicod criterion applied to the contrapositive, it must be support.

  - (10 min) Discussion: How to resolve? Present the three options.

  - (5 min) Background distributions: We note that in our deck, there were 10 non-black non-ravens and only 2 black ravens. So the green socks are common. Does that make them irrelevant? 
     - Point: They do confirm, but very weakly. If we had a non-black raven, it would falsify the rule. So every green sock we see that isn't a raven slightly increases our confidence that there are no non-black ravens. But because there are so many non-black things, one green sock doesn't tell us much. However, if we were in a world where we thought everything non-black might be a raven, then a green sock would be a big relief? But in our world, we know ravens are rare. So the degree of confirmation is low, but it's still there.

  - (5 min) Wrap up: Summarize the paradox and the trade-offs.

  What the activity doesn't cover: 
     - We didn't include any non-black ravens (because we don't want to falsify the rule). The paradox is about confirmation, not falsification.
     - We didn't have a way to naturally bring up the idea of "relevance" or "background knowledge". We have to explain that in the debrief.

  This should work. Let me know if you have any adjustments.
answer: |-
  ### Activity: **Raven Paradox Card Sort Challenge**  
  **Goal:** Force students to confront the tension between the Nicod criterion and equivalence condition through hands-on evidence evaluation, leading to the realization that rejecting green socks as evidence requires sacrificing one principle.  

  **Time:** 60 minutes  
  **Materials:**  
  - 40 index cards (or paper slips) with the following distribution (adjustable):  
    - **Black Ravens (BR):** 5 cards (e.g., "Raven, Black")  
    - **Non-Black Ravens (¬B R):** 0 cards (none, to avoid immediate falsification)  
    - **Black Non-Ravens (B ¬R):** 10 cards (e.g., "Crow, Black"; "Shoe, Black")  
    - **Non-Black Non-Ravens (¬B ¬R):** 25 cards (e.g., "Apple, Red"; "Sock, Green"; "Lemon, Yellow")  
  - Whiteboard with columns: **"Supports Rule"**, **"Against Rule"**, **"Irrelevant"**  
  - Sticky notes or markers for voting  
  - Scoreboard for points (optional)  

  **Setup:**  
  1. Divide students into 4 teams (4 students each).  
  2. Explain the core rule: **"All ravens are black"** (write on board).  
  3. Introduce the **Nicod Criterion** (without naming it): *"A card that matches both parts of the rule (raven + black) supports it. A card that violates it (raven + not black) disproves it."*  
  4. Explain scoring: Teams earn 1 point for each *correct* evidence classification (based on consensus during debrief). The winning team gets bragging rights.  

  ---

  ### Activity Flow:  
  #### **Phase 1: Initial Evidence Evaluation (20 min)**  
  - **Task:** Teams classify 10 pre-selected cards (drawn from the deck) as:  
    - **Supports Rule** (positive instance)  
    - **Against Rule** (counterexample)  
    - **Irrelevant** (no bearing on the rule)  
  - **Card Sequence (reveal one at a time):**  
    1. Black Raven (BR) → *All teams will likely say "Supports"*  
    2. Black Non-Raven (B ¬R; e.g., "Crow, Black") → *Teams often say "Irrelevant"*  
    3. Non-Black Non-Raven (¬B ¬R; e.g., "Sock, Green") → *Teams will say "Irrelevant"*  
    4. Black Raven (BR) → *"Supports"*  
    5. Non-Black Non-Raven (¬B ¬R; e.g., "Apple, Red") → *"Irrelevant"*  
    6. Black Non-Raven (B ¬R; e.g., "Shoe, Black") → *"Irrelevant"*  
    7. Black Raven (BR) → *"Supports"*  
    8. Non-Black Non-Raven (¬B ¬R; e.g., "Lemon, Yellow") → *"Irrelevant"*  
    9. Black Raven (BR) → *"Supports"*  
    10. Non-Black Non-Raven (¬B ¬R; e.g., "Leaf, Green") → *"Irrelevant"*  
  - **Process:**  
    - Teams discuss each card for 60 seconds, then vote simultaneously (hold up colored cards: green=Support, red=Against, yellow=Irrelevant).  
    - Record votes on the whiteboard. **Do not debate yet**—just tally.  
  - **Outcome:**  
    - Teams consistently vote BR as "Support," B ¬R and ¬B ¬R as "Irrelevant." This reflects the Nicod criterion (only positive instances confirm).  

  #### **Phase 2: The Contrapositive Twist (15 min)**  
  - **Introduce the contrapositive rule:** *"All non-black things are non-ravens"* (write next to original rule).  
  - **Explain Equivalence:** *"These are logically identical—if one is true, the other must be true. Evidence for one is evidence for the other."*  
  - **Re-Test with Same Cards:**  
    - **Task:** Reclassify the **green sock** (Card 3) and **red apple** (Card 5) under the *contrapositive rule*.  
    - **Prompt:** *"Does this card support the contrapositive? If so, by equivalence, it must support the original rule too."*  
    - **Key Moment:**  
      - For the green sock (¬B ¬R):  
        - It *is* a non-black thing and a non-raven → a **positive instance** of the contrapositive.  
        - By equivalence, it *must* support the original rule.  
      - Teams must confront: *"You said it was irrelevant earlier—were you wrong?"*  
  - **Process:**  
    - Teams re-vote on Cards 3 and 5. Most will reluctantly vote "Support" for the contrapositive.  
    - Point out inconsistency: They initially called ¬B ¬R "Irrelevant" for the original rule, but now equivalence forces it to be "Support."  

  #### **Phase 3: The Trade-Off (15 min)**  
  - **Pressure Test:** Reveal that ¬B ¬R cards make up >60% of the deck (25/40). Ask:  
    > *"If green socks are so common, and ravens are rare, does finding one still 'count'? Should we ignore them?"*  
  - **Team Debate:**  
    - **Option 1:** Keep equivalence → green socks *must* support the rule.  
    - **Option 2:** Reject equivalence → but then logically equivalent rules (like the contrapositive) could have different evidence.  
    - **Option 3:** Reject Nicod → not all positive instances (like ¬B ¬R) confirm the rule.  
  - **Forced Choice:** Teams propose one principle to sacrifice and justify it. Record options on the board.  

  #### **Debrief (10 min)**  
  Map the activity to the paradox:  
  1. **Nicod Criterion:** BR cards were "Support" (positive instances).  
  2. **Equivalence Condition:** The contrapositive forced ¬B ¬R cards to become evidence for the original rule.  
  3. **Black Non-Ravens (B ¬R):** Neutral under both rules—neither raven (so Nicod doesn’t apply) nor non-black (so contrapositive doesn’t apply).  
  4. **Green Sock "Commonness" Move:**  
     - Yes, background probabilities matter (green socks are common, so they confirm weakly).  
     - But they still confirm *in principle*—rejecting this requires abandoning Nicod or equivalence.  
  5. **Trade-Off Summary:**  
     - Keep both → green socks confirm.  
     - Drop Nicod → Universal generalizations aren’t confirmed by instances.  
     - Drop equivalence → Evidence becomes language-dependent (e.g., "ravens" vs. "non-black things").  

  ---

  ### Predictable Problems & Fixes:  
  1. **"Green socks can't possibly matter!" (Commonness objection):**  
     - **Handling:** Agree that confirmation is weak, but stress logic: *"If you accept equivalence and Nicod, it must count. How weak it is depends on context—but that’s separate from whether it confirms at all."*  
  2. **Teams dismiss black non-ravens (B ¬R) as "Support":**  
     - **Handling:** Ask: *"Does a black shoe tell us anything about ravens? If not, it’s irrelevant. The rule doesn’t constrain non-ravens."* Clarify neutrality in debrief.  
  3. **Confusion about contrapositive:**  
     - **Handling:** Use concrete examples: *"A non-black raven would violate both rules. A green sock avoids that violation—so it’s consistent with the rule."*  
  4. **Time crunch:**  
     - **Handling:** Skip 2–3 cards in Phase 1. Focus on 1x BR, 1x B ¬R, 1x ¬B ¬R to force the paradox faster.  

  ### Limitations of the Activity:  
  - **What it can’t replicate:** The **psychological irrelevance** of green socks. Students *feel* they shouldn’t matter, but the activity only shows the *logical* force. You’ll need to supplement:  
    > *"Our intuition says green socks are irrelevant because we focus on ravens. But logic forces us to either accept their role or reject a foundational principle. That’s the paradox—it exposes a clash between intuition and formal epistemology."*  

  - **What you must supply:** The **Bayesian perspective** (commonness move). The activity shows why commonness isn’t a free pass—it requires rejecting Nicod/equivalence or adopting a probabilistic framework.  

  This activity makes the paradox viscerally frustrating—students will *want* to reject the green sock but hit a wall. By the end, they’ll see the cost of their intuitions and leave primed for deeper discussion about confirmation theory.
