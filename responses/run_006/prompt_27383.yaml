  Hmm, the summary oversimplifies in several places. First, it claims Bostrom "proved" we're almost certainly in a simulation - that's misleading. His actual trilemma presents three possibilities, only one being that we're in a sim. The "vast numbers" part is correctly noted though - posthuman civilizations would run many ancestor-simulations.

  The Descartes comparison... interesting but flawed. While both deal with deception, Bostrom isn't claiming we can't know reality - his point is probabilistic. The magazine twists it into hard skepticism. 

