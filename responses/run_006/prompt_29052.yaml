prompt: |-
  I'm an engineering director at a mid-size software company, and about once a week I get pitched a feature where someone on the team says 'we can just compute that.' I have maybe twenty minutes per pitch, a CS undergrad from a while back, and no real theory background, and I'm the one who has to sign off or send it back. I want a reusable triage procedure I can actually run, grounded in what computational complexity really tells us about where procedures hit walls — the gap between 'there exists an algorithm' and 'there is one we can actually run,' hardness results as a kind of impossibility theorem about resources rather than logic, worst-case versus typical instances, and what approximation can and can't buy you, and where a heuristic with no guarentee is still the sane choice. Not just 'NP-hard means impossible.' Write it as questions to ask in order, with what counts as a good enough answer at each step, where the procedure stops with a no, and where it hands off to a person because the step is a judgment call or a values call rather than a theorem — like whether a 5% error is acceptable for this product. Make sure it handles the hard case where a problem is NP-hard in the worst case but the team swears their instances are always small or easy. Then run it on three proposals: (1) a route optimizer for a delivery fleet with a hard 200-stop limit; (2) a clustering feature for a million-user dataset where the team says they'll just use k-means; (3) a fairness constraint the team wants to add to an existing recommendation model but they can't say what it does to the objective. Include at least one case where the procedure tells me to kill a feature I actually want, and say straight out what the procedure can't catch — like a problem that's technically easy but has a hidden data problem, or a team that's sandbagging the input size. And write it in American English, please.
reasoning: |-
  We are creating a triage procedure for evaluating computational feasibility of proposed features. The procedure is a series of questions to ask, with explanations and what counts as a good answer. We'll also include stopping points (with "No") and handoffs for judgment calls.

  **Triage Procedure: "Can We Compute That?"**

  **Step 1: What is the input size?**
     - Ask: "What is the typical and worst-case size of the input? (e.g., number of items, nodes, data points, dimensions)"
     - Why: Complexity is measured in terms of input size. We need to know the scale.
     - Good enough: Numbers that are concrete and within known feasible bounds (e.g., up to 1000 for O(n^3), but context matters). If the worst-case is bounded and small (e.g., 200 stops), we might proceed even for exponential algorithms.
     - Stop if: Input size is huge (e.g., millions) and the proposed algorithm is exponential or high-degree polynomial without a clear plan for handling it.
     - Handoff: If the team says "it's always small" but you suspect growth, that's a judgment call about product evolution.

  **Step 2: What is the computational complexity of the proposed algorithm?**
     - Ask: "What is the time (and space) complexity of the algorithm? Is it worst-case, average-case, or amortized?"
     - Why: We need to know the resource usage as a function of input size.
     - Good enough: An algorithm that runs in polynomial time (e.g., O(n^2), O(n^3)) and the constants are reasonable for the input size. For very large inputs, even O(n^2) might be too slow.
     - Stop if: The algorithm is exponential (O(2^n)) and the input size is more than about 20-30, or if it's a high-degree polynomial (e.g., O(n^5)) and n is large (thousands).
     - Handoff: If the team says "it's NP-hard but we have a heuristic" — then we need to evaluate the heuristic.

  **Step 3: Is the problem known to be hard?**
     - Ask: "Is the problem known to be NP-hard, PSPACE-hard, etc.? If so, what is the evidence (reduction from a known hard problem)?"
     - Why: If the problem is NP-hard, then we cannot expect an efficient exact algorithm for all inputs (unless P=NP).
     - Good enough: If the problem is NP-hard, then we must either (a) have a guarantee that the input is small (from Step 1) and we can run an exact algorithm (like brute-force or branch-and-bound for small n), (b) use an approximation algorithm with proven guarantees, or (c) use a heuristic and accept that it might fail sometimes.
     - Stop if: The problem is NP-hard and the input size is large (so exact solution is infeasible) and there's no plan for approximation or heuristic. Also stop if the problem is undecidable (but that's rare).
     - Handoff: Deciding whether to accept an approximation or heuristic is a product decision (see Step 5).

  **Step 4: For hard problems, what is the fallback? (Approximation, Heuristic, Special Cases)**
     - Ask: "If the problem is hard, what approximation ratio can we achieve? Or what heuristic are we using, and what are its limitations? Are we in a special case that is known to be easier?"
     - Why: For NP-hard problems, we need a practical approach.
     - Good enough: 
          - Approximation: A constant-factor approximation (e.g., within 2x of optimal) or a PTAS (arbitrarily close) and the algorithm is efficient.
          - Heuristic: The team has tested it on realistic data and it performs well (with data to show). Also, they should know the failure modes.
          - Special Case: The input has structure (e.g., planar graphs, Euclidean metric) that allows an efficient algorithm.
     - Stop if: The problem is hard and the heuristic is completely untested and the input size is large, or the approximation ratio is too loose for the product (e.g., 10x worse is unacceptable) and there's no alternative.

  **Step 5: What are the resource constraints and trade-offs?**
     - Ask: "What are the CPU/memory/time constraints for this feature? What trade-offs are we making (e.g., accuracy vs. speed)?"
     - Why: Even if the algorithm is polynomial, it might be too slow or memory-heavy for our systems.
     - Good enough: The algorithm fits within the system's resource limits (e.g., runs in under 1 second, uses less than 1GB of memory) for the typical and worst-case input.
     - Handoff: If the algorithm uses more resources than we have, then we need to decide if we can invest in more hardware or if we can accept a less accurate solution.

  **Step 6: What is the cost of being wrong or slow?**
     - Ask: "What happens if the algorithm fails (gives wrong answer, doesn't finish in time)? What is the impact on the user or the business?"
     - Why: This helps decide if we can accept a heuristic without guarantees.
     - Good enough: The cost is low (e.g., a non-critical feature, or can fall back to a simpler method) OR the team has data showing the failure rate is very low in practice.
     - Stop if: The cost is high (e.g., safety-critical, financial loss) and the algorithm is heuristic with no guarantees and no testing.

  **Step 7: What about the constants?**
     - Ask: "What are the constant factors and overheads? Have we benchmarked on realistic data?"
     - Why: A O(n) algorithm with a huge constant might be worse than a O(n^2) with a small constant for practical n.
     - Good enough: The team has run benchmarks on realistic data and the performance is acceptable.
     - Handoff: If the benchmarks aren't done, then we need to schedule them and make a conditional go-ahead.

  **Step 8: Is there a hidden data dependency?**
     - Ask: "Are there properties of the data that could change (e.g., sparsity, distribution) that might break the algorithm? What if the data grows or changes?"
     - Why: Algorithms that work on today's data may fail tomorrow.
     - Good enough: The team has considered data drift and scalability, and the algorithm is robust or there's a monitoring plan.
     - Stop if: The algorithm is brittle and the data is volatile, and the team hasn't considered it.

  **Step 9: What is the maintenance and evolution cost?**
     - Ask: "How complex is the implementation? Will it be hard to maintain? What if the problem changes (e.g., new constraints)?"
     - Why: Even if it runs, it might be a liability.
     - Good enough: The code is maintainable and the team has a plan for evolution.

  **Handoff for Judgment Calls:**
     - At several steps we have handoffs. The key judgment calls are:
          - Acceptability of an approximation ratio (e.g., 5% error) — this is a product decision.
          - Acceptability of a heuristic without guarantees — depends on the cost of failure and the evidence from testing.
          - Whether the input size will remain small — requires product forecasting.

  **What the procedure can't catch:**
     - Hidden data problems (e.g., data is missing, noisy, or biased in a way that breaks the algorithm).
     - Implementation bugs.
     - Team sandbagging (e.g., underestimating input size, overpromising on heuristic performance).
     - Problems that are easy in theory but have huge constants or hidden terms (e.g., O(n) but with 2^d where d is a feature dimension that might grow).

  Now, let's run the procedure on the three proposals.

  ---

  **Proposal 1: Route optimizer for a delivery fleet with a hard 200-stop limit.**

  Step 1: Input size is 200 stops (worst-case). This is fixed and relatively small.

  Step 2: The problem is the Traveling Salesman Problem (TSP), which is NP-hard. The team might propose an exact algorithm (like dynamic programming) or a heuristic.

     - Exact algorithm: The classic TSP dynamic programming is O(n^2 * 2^n). For n=200, 2^200 is astronomical (about 1.6e60). So exact is not feasible.

     - They might use a heuristic (like Lin-Kernighan) or an approximation (Christofides has a 1.5x guarantee for metric TSP). But note: 200 is too big for exact.

  Step 3: The problem is NP-hard.

  Step 4: They must use a heuristic or approximation. Christofides is O(n^3) which for n=200 is about 8e6 operations, which is acceptable. Without guarantees, a heuristic is also acceptable if well-tested.

  Step 5: We need to run in a reasonable time (say, a few minutes). O(n^3) is about 8e6 operations, which on a modern CPU (1e9 operations per second) is 0.008 seconds? But note: the constant factors and data structures matter. Also, real-world constraints (time windows, capacities) might complicate. They must benchmark.

  Step 6: Cost of being wrong: a suboptimal route might cost more fuel or time, but within 5-10% might be acceptable.

  Step 7: They must benchmark.

  Step 8: The data (distances) are unlikely to change structure.

  Step 9: Implementing Christofides is non-trivial but doable. There are libraries.

  **Verdict:** Conditional Yes. They must use an approximation or heuristic and benchmark on real data. The input size is fixed and the polynomial algorithm (if they choose one) is acceptable.

  ---

  **Proposal 2: Clustering for a million-user dataset using k-means.**

  Step 1: Input size: n = 1,000,000 points. Dimensionality? (Assume d=100). This is large.

  Step 2: k-means is O(n * k * d * i) per iteration, where i is iterations. This is polynomial. k is chosen (say k=10) and i is usually small (e.g., 20). So n*k*d*i = 1e6 * 10 * 100 * 20 = 2e9 operations. This is acceptable on a distributed system? But note: worst-case, k-means can take exponential iterations, but in practice it's fast.

  Step 3: The problem of minimizing the k-means objective is NP-hard. However, k-means is a heuristic (Lloyd's algorithm) that finds a local optimum.

  Step 4: They are using a heuristic. There are no guarantees on the quality (it can get stuck in bad local minima). But in practice, it works well with multiple random starts.

  Step 5: They must run it in a reasonable time. 2e9 operations is about 2 seconds on a 1 GHz CPU? But distributed and optimized libraries (like Spark MLlib) can handle it.

  Step 6: Cost of being wrong: clustering might be used for recommendations, so bad clusters might hurt user experience. But it's common and accepted.

  Step 7: They must benchmark and show it converges quickly.

  Step 8: The data might have outliers, or clusters of uneven size, which k-means doesn't handle well. They should consider preprocessing.

  Step 9: k-means is standard and maintainable.

  **Verdict:** Yes, but with caveats. They must use multiple random starts and consider the data properties. Also, they must monitor performance.

  ---

  **Proposal 3: Fairness constraint in an existing recommendation model; impact on objective unknown.**

  Step 1: Input size: the model and user data. This is the same as the existing model, so we assume it's handled.

  Step 2: The team doesn't know the complexity. But adding constraints can make an easy problem hard.

  Step 3: The problem: without knowing the exact fairness constraint, we note that many fairness constraints (like demographic parity) make optimization NP-hard in general. Also, they can't say what it does to the objective — that's a red flag.

  Step 4: They don't have a plan for solving the constrained problem. They might be hoping to use the existing algorithm and just add a constraint, which might break convergence or make it intractable.

  Step 5: The existing system has latency constraints. If the new problem is harder, it might break.

  Step 6: Cost of being wrong: if the recommendations become worse, user engagement drops. Also, if fairness isn't achieved, that's a reputational risk.

  Step 7: They haven't benchmarked because they don't have an algorithm.

  Step 8: The data might have biases that interact with the fairness constraint.

  Step 9: This could add significant complexity.

  **Verdict:** No. The team doesn't understand the computational impact. Without knowing the effect on the objective or having an algorithm, it's too risky. This is the feature we want (fairness is important) but the procedure says no because of the lack of clarity and potential intractability.

  **What the procedure can't catch in these examples:**
     - In Proposal 1: They might have hidden constraints (like time windows) that make the problem harder and break Christofides (which requires metric TSP). Also, 200 stops might be too big for their hardware if the constant factors are bad.
     - In Proposal 2: k-means can be sensitive to initialization and might produce poor clusters even with multiple starts, which could go unnoticed without proper evaluation.
     - In Proposal 3: The fairness constraint might be implemented in a way that doesn't hurt performance but the team didn't articulate it. The procedure relies on the team's knowledge.

  **Conclusion:** The procedure helps structure the evaluation, but it requires honest and knowledgeable input from the team. When in doubt, ask for a prototype and benchmarks.
answer: |-
  Below is a reusable triage procedure tailored to your role. It's structured as sequential questions, designed to quickly assess computational feasibility while accounting for complexity theory, practical constraints, and business realities. **American English** used throughout.

  ---

  ### **"Can We Compute That?" Triage Procedure**  
  *Run these questions in order. Spend 2–3 min per question. Stop early if you hit a "No."*

  1. **"What's the *exact* input size (n) in the worst case? Define n clearly."**  
     - *Why?* Complexity depends on how "n" scales (e.g., 200 stops vs. 1M users).  
     - **Good enough:** Worst-case n is bounded and small (e.g., n ≤ 1,000).  
     - **Red flag:** "It’ll always be small" without data/limits.  
     - **Stop if:** n is huge (>1M) and unsolved problem (→ hard "No" for exact solutions).  
     - **Judgment call:** Is this bound realistic? (e.g., "200 stops" is contractual → probably safe).  

  2. **"What’s the computational complexity of the *proposed* algorithm? Worst-case and typical."**  
     - *Why?* O(n!) or O(2ⁿ) explodes; O(n³) may be tolerable for small n.  
     - **Good enough:** Polynomial time (O(nᵏ), k≤3) or proven efficient heuristic.  
     - **Red flag:** No complexity stated or "We’ll brute-force it" for n>30.  
     - **Stop if:** Worst-case is exponential and n>50 → **No**.  
     - **Judgment call:** Is "typical case" truly representative? (e.g., real-world data may be kinder).  

  3. **"Is this problem *known to be hard* (e.g., NP-hard)? If so, what’s the evidence?"**  
     - *Why?* NP-hard = no *scalable* exact solution exists (unless P=NP). But small n may be okay.  
     - **Good enough:** Proof of NP-hardness + mitigation (see Step 4).  
     - **Red flag:** "We don’t know" → demand literature search.  
     - **Stop if:** NP-hard + large n (e.g., n>1,000) + no fallback → **No**.  
     - **Judgment call:** None. This is theory.  

  4. **"If hard, what’s the *fallback*? (Exact for small n? Approximation? Heuristic?)"**  
     - *Why?* NP-hard isn’t fatal if you have a plan.  
     - **Options:**  
       - *Small n:* Exact solution (e.g., n≤200 via dynamic programming).  
       - *Approximation:* Guaranteed error bound (e.g., "within 10% of optimal").  
       - *Heuristic:* No guarantees but works in practice (e.g., k-means for clustering).  
     - **Good enough:** Bounded error or validated heuristic.  
     - **Red flag:** "We’ll just try something" without testing.  
     - **Stop if:** No fallback → **No**.  
     - **Judgment call:** Is the error/risk acceptable? (e.g., 5% error in routing → discuss with product).  

  5. **"What’s the *real-world cost* of the output? (Optimal needed? Or ‘good enough’?)"**  
     - *Why?* A heuristic may suffice if 95% accuracy is fine.  
     - **Good enough:** Clear product requirement (e.g., "Routes must finish within 5% of optimal").  
     - **Red flag:** "We need optimal" for NP-hard problem + large n → delusional.  
     - **Stop if:** Unreasonable demands (e.g., optimal for n=1,000 TSP) → **No**.  
     - **Judgment call:** Trade-offs between accuracy, speed, and engineering effort.  

  6. **"Can we *test this at scale*? What’s the plan for validation?"**  
     - *Why?* Heuristics can fail silently.  
     - **Good enough:** Benchmarks on production-like data.  
     - **Red flag:** "We’ll test after building" → too late.  
     - **Stop if:** No validation plan → **No** (unless trivial).  
     - **Judgment call:** How much testing is enough?  

  ---

  ### **What This Catches**  
  - Worst-case intractability (NP-hard + large n).  
  - "Small n" claims without evidence.  
  - Unbounded heuristics or approximations.  

  ### **What This *Misses***  
  - **Hidden data issues:** e.g., "O(n) algorithm" assumes sorted data → costs O(n log n) to sort.  
  - **Sandbagging:** Teams lowballing input size (n=200 today → n=500 next year).  
  - **Constants matter:** O(n²) with n=1,000 is 1M ops, but if 1 op = 1ms → 16 mins!  
  - **Space complexity:** Forgotten RAM/disk costs.  
  - **Dynamic data:** Algorithms that work today may break with data drift.  

  ---

  ### **Applying the Procedure: 3 Proposals**  
  **Context:** You have 20 mins total. Prioritize questions 1–4.

  #### **Proposal 1: Route optimizer for delivery fleet (200-stop limit)**  
  1. **Input size?** "n = number of stops. Worst case: 200 (contractually fixed)." **→ Good.**  
  2. **Complexity?** "Traveling Salesman Problem (TSP). We’ll use dynamic programming (DP)."  
     - DP for TSP: O(n²·2ⁿ). For n=200: 200² · 2²⁰⁰ ≈ 10⁶⁰ → **lifetime of universe**.  
     - **Red flag!**  
  3. **Hard?** "TSP is NP-hard. But n=200 is small?" **→ NP-hard confirmed.**  
  4. **Fallback?** "We’ll use a heuristic (Lin-Kernighan) + approximation (Christofides for metric TSP, 1.5× optimal)."  
     - Christofides: O(n³) ≈ 8M ops → 0.1 sec.  
     - **→ Good enough if 50% longer routes are acceptable.**  
  5. **Cost?** "Per contract, routes must be ≤10% over optimal."  
     - Heuristic has no guarantee → **risk**.  
  6. **Validation?** "Test on historical routes." **→ Weak but acceptable.**  
  **Verdict:** **Conditional yes.** Handoff to product: "Is 10% over optimal okay? If not, demand Christofides."  

  #### **Proposal 2: Clustering for 1M users with k-means**  
  1. **Input size?** "n=1M users, d=100 features." **→ Large.**  
  2. **Complexity?** "k-means: O(n·k·d·i) per iteration. k=10 clusters, i=20 iterations → 20B ops."  
     - ≈20 sec on modern CPU. **→ Good.**  
  3. **Hard?** "k-means optimization is NP-hard, but heuristic works well." **→ True.**  
  4. **Fallback?** "k-means *is* the heuristic. No approximation guarantee, but industry standard."  
     - **→ Acceptable if ‘good enough’.**  
  5. **Cost?** "Clusters power recommendations. 90% accuracy is fine." **→ Good.**  
  6. **Validation?** "We’ll use silhouette score + A/B test recs." **→ Good.**  
  **Verdict:** **Yes.** k-means is battle-tested for this scale.  

  #### **Proposal 3: Fairness constraint in recommendation model (impact unknown)**  
  1. **Input size?** "Same as existing model (n=500K users)." **→ Okay.**  
  2. **Complexity?** "We’ll add a fairness penalty to the loss function."  
     - No complexity stated → **red flag!**  
  3. **Hard?** "Unknown, but fairness constraints often make problems NP-hard (e.g., envy-free allocations)."  
     - **→ Risk.**  
  4. **Fallback?** "None. We can’t quantify impact on accuracy or runtime." **→ Stop.**  
  **Verdict:** **No.**  
  - **Why you’ll hate this:** Fairness is critical, but the team has no grasp of computational cost. "Can’t say what it does to the objective" = unacceptable. Handoff to research: "Prove it’s tractable or find an approximation."  

  ---

  ### **When the Procedure Says "No" to Something You Want**  
  - **Example:** Proposal 3 (fairness). You *want* this feature, but the procedure kills it because:  
    - No complexity analysis (Step 2).  
    - No fallback for potential NP-hardness (Step 4).  
    - Unquantifiable impact (Step 5).  
  - **Mitigation:** "Go research, then re-pitch. Options: 1) Find a convex fairness proxy, 2) Use post-processing, 3) Accept longer training times."  

  ### **Final Advice**  
  - **For "small n" claims:** Demand hard bounds (e.g., "n≤200 in our contracts").  
  - **For heuristics:** Require benchmarks on production data.  
  - **When in doubt:** Ask, "What’s the *simplest* real instance that would break this?"  
  - **Your CS degree:** Enough to call BS on "O(n)" for NP-hard problems. Leverage Wikipedia/arXiv for quick checks.  

  This balances theory and pragmatism. Most pitches die at Step 2 (unstated complexity) or Step 4 (no fallback for NP-hardness).
