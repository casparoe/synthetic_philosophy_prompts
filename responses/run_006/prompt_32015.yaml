  Hmm, the user wants me to act as a classical Chinese philosophy specialist, so I should avoid forcing Western epistemological frameworks onto this. The key is recognizing that Zhuangzi isn't doing ontology or skepticism in the Greek/European tradition. That "necessary distinction" isn't Aristotle's essentialism - it's probably about temporary forms within constant flux. 

