prompt: |-
  I'm a postdoc in a vision lab, and I've somehow ended up as the person who has to settle a running fight about how we handle subjects' verbal reports. We run masking and binocular rivalry experiments, and on every trial the participant says whether they saw the stimulus, how clear it was, and sometimes what it looked like. Right now the lab is split: one RA codes "I didn't see anything" as if it's a fact about the display, another treats every report as an infallible readout of the subject's private experience, and a third wants to throw the reports away entirely and only use forced-choice performance. My PI told me to write a single protocol everyone has to follow, because every paper we publish turns on how these reports get coded, and I want it to be based on heterophenomenology, which I half-remember from a seminar as something like: take first-person reports seriously as reports of how things seem to the subject, but don't take them as authoritative about what is actually going on in their head, and stay neutral about whether the things the subject reports are real. That sounds right in the abstract, but I have no idea how to turn it into a procedure a sleep-deprived RA with no philosophy background can actually run before lunch.

  Please write me that procedure: a step-by-step protocol for collecting, transcribing, coding, and using verbal reports in a consciousness experiment. I want the questions in order, what counts as a good enough answer to each question, where the procedure stops and says "this report is unusable," and where it has to hand the decision to a human because the step is a judgment call rather then a rule. Then run the procedure on three cases: (1) a subject in a rivalry study says "I saw the face the whole time" even though the stimulus alternated between a face and a house every second and their button presses tracked the alternation; (2) a blindsight-type patient says "I don't see anything" but then guesses the location of the stimulus at 80 percent; (3) a subject in a masking study reports "it wasn't a visual experience, more like a vague hunch that something was there" on trials where the mask came too fast. Include at least one case where the procedure tells me to do something I'm going to hate, and say what the procedure can't settle. Also be straight with me about which parts of this are heterophenomenology actually doing work and which parts are just a fancy name for "write down what they said." And tell me how confident you are in the procedure overall and which step you're least sure about.
reasoning: |-
  We are designing a protocol based on heterophenomenology. The key principles we'll follow are:
   1. Treat verbal reports as meaningful descriptions of the subject's subjective experience (how things seem to them).
   2. Do not assume these reports are infallible or directly reveal the underlying mental states or the physical reality.
   3. Remain neutral about the ontological status of the reported experiences (i.e., we don't decide if they are "real" or not).

   We are collecting reports in three contexts: masking, binocular rivalry, and possibly blindsight.

   The protocol will have:
    - A standardized set of questions to ask after each trial (or block of trials, if more appropriate).
    - Clear instructions for the RA on how to record the responses (verbatim transcription is crucial).
    - Coding rules that translate the verbal reports into a set of predefined categories (with clear rules for when a response is ambiguous and needs human judgment).
    - Criteria for excluding a report (or a subject) when the responses are unusable.
    - How to integrate the verbal reports with behavioral data (like button presses) without conflating them.

   Steps of the protocol:

   I. Pre-Experiment Setup:
      - Train the RA: Explain the purpose and the importance of verbatim transcription. Emphasize that they are not to interpret the subject's words during collection, just record exactly what is said.
      - Script the questions: Use the same wording every time.

   II. During the Experiment: Collection of Verbal Reports

      We are going to ask a sequence of questions after each trial (or after a block of trials if the design is too fast for per-trial questioning). The exact timing depends on the experiment, but we must avoid interfering with the task.

      Proposed questions (in order):

      1. "Did you see anything on that trial? Please say 'yes', 'no', or describe what you saw."
          - This is a forced choice between yes/no, but allowing a description. The RA should record the exact words.

      2. (If the answer to 1 is 'yes' or if the subject describes something) "How clear was what you saw? Please rate it on a scale from 0 to 10, where 0 is not at all clear and 10 is as clear as normal vision. If you didn't see anything, you can say 'not applicable' or skip this."
          - Alternatively, we can use a labeled scale (e.g., "absent", "a glimpse", "moderate", "clear") if numbers are problematic. But a number is easier to code.

      3. (For experiments where stimulus identity is relevant) "If you saw something, what did it look like? Please describe it as precisely as you can, including any details you noticed."

      For the RA:
          - Record every response verbatim (use audio recording if possible, then transcribe immediately after the session).
          - Do not prompt beyond the scripted questions unless the subject asks for clarification. For clarification, use neutral language: "Please just describe what you experienced."

   III. Post-Experiment: Transcription and Coding

      Step 1: Transcribe the responses exactly as said. Do not correct grammar or fill in words.

      Step 2: Coding the responses into predefined categories.

          For Question 1 (Did you see anything?):
            - Code as:
              - "Yes" if the subject says "yes" or any affirmative (e.g., "yeah", "I did").
              - "No" if the subject says "no" or negative (e.g., "nope", "nothing").
              - "Uncertain" if the subject says something ambiguous (e.g., "maybe", "I think so", "not sure"). 
              - "Description without clear yes/no": If the subject gives a description without a yes/no, then the coder must infer. For example, "It was a face" implies "yes". But if the description is "I'm not sure if I saw anything", then code as "uncertain".

          Rules for coding Question 1:
            - If the subject says "I didn't see anything", code as "no".
            - If the subject says "I saw something", code as "yes".
            - If the subject only describes something (e.g., "a flash of light"), code as "yes".
            - If the subject says "I don't know" or "maybe", code as "uncertain".
            - If the subject's response is not in English or is unintelligible, mark as "unusable".

          For Question 2 (Clarity rating):
            - Record the number they say. If they use a labeled scale, map it to a number according to a predefined mapping (e.g., "absent"=0, "a glimpse"=3, "moderate"=6, "clear"=10).
            - If they say a range (e.g., "between 3 and 4"), record the midpoint (3.5) and note it was a range.
            - If they don't give a number and you have a labeled scale, use the label and then convert to the number.
            - If they skip because they said they didn't see anything, code as "N/A".
            - If they give a non-numeric response that doesn't fit the scale (e.g., "pretty clear"), then use a predefined mapping for common phrases (this will require a lookup table made in advance). If the phrase is not in the table, flag for human judgment.

          For Question 3 (Description of what it looked like):
            - We are not coding this into categories unless the experiment has specific expectations (e.g., in a rivalry experiment, we might code for which stimulus was reported). 
            - For rivalry: Code the dominant percept (e.g., "face", "house", "mixture", "other"). 
            - Rules for coding:
              - If the subject says "face", code as "face".
              - If the subject says "house", code as "house".
              - If the subject says "a mix of both" or "parts of both", code as "mixture".
              - If the subject says something else (e.g., "a dog"), code as "other" and note the description.
            - If the experiment does not require coding the description (e.g., in a masking study where we only care about visibility), then store the verbatim response for potential qualitative analysis.

      Step 3: Handling ambiguous cases and human judgment:
          - Designate a coder (or two independent coders for reliability) to handle ambiguous cases.
          - If a response for Question 1 is ambiguous (e.g., "I guess so"), then the coder must decide between "yes", "no", or "uncertain". The rule: 
              - If the subject expresses any doubt, code as "uncertain".
              - If the subject's description clearly indicates they had an experience (even if weak), code as "yes".
              - If the subject's description clearly indicates no experience, code as "no".
          - For Question 2, if the response is not mappable by the lookup table, the coder must assign a number based on the description (using the same scale). They should note the reason.
          - For Question 3, if the description does not clearly match any category, code as "other" and transcribe the response.

      Step 4: Exclusion criteria for a trial's report:
          - Mark as "unusable" if:
              - The subject did not answer the question (e.g., remained silent, said "I don't remember").
              - The response is unintelligible (and not captured in recording).
              - The response is in a language the coder does not understand (if the experiment is run in a multilingual setting, have a translator).
          - Do not use the report for that trial (but the forced-choice data might still be used).

      Step 5: Exclusion criteria for a subject:
          - If more than 20% of a subject's reports are unusable, consider excluding the subject from the analysis based on verbal reports (but forced-choice data may still be used).

   IV. Integration with Behavioral Data:

      - The forced-choice behavioral data (e.g., button presses) are treated as a separate measure of performance or perception.
      - The verbal reports are treated as a measure of subjective experience.

      We do not assume they must agree. We report both and note any discrepancies.

   V. Running the procedure on the three cases:

      Case 1: Rivalry study. Subject says "I saw the face the whole time", but the button presses alternated between face and house.

          Questions and answers (per trial, but note: the subject is making a global statement? Let's assume we are asking per trial and the subject says this on every trial? Or maybe after a block? We need to clarify. Let's assume we are asking after each trial, and on every trial the subject says they saw the face. But the button presses alternated. This suggests that on some trials the stimulus was the house, but the subject reported seeing the face.

          Step-by-step for one trial where the stimulus was a house (as per the alternation) and the button press indicated "house", but the verbal report says "face".

          Question 1: "I saw the face the whole time" -> but note, this is a global statement. We are asking per trial. So let's assume the subject says for a given trial: "I saw the face".

          Coding:
            - Q1: "yes" (because they report seeing something and specifically a face).
            - Q2: They didn't give a clarity rating? We must ask. But the case doesn't specify. Let's assume they rate it high (e.g., 10).
            - Q3: They describe it as a face.

          Now, the button press for that trial was "house". 

          Heterophenomenology in action: We take the report as the subject's account of their experience. They experienced the face. We do not say they are wrong about the stimulus (the stimulus was a house, but in rivalry, the percept is subjective). However, note that in binocular rivalry, the stimulus is constant (each eye gets a different image) and the perception alternates. But in this setup, the button presses (which are also a report) alternated, meaning that at the time of the button press, the subject was reporting the house. But the verbal report (which might be after the trial) is saying they saw the face the whole time. This is a memory issue? Or perhaps the subject is misremembering.

          How the protocol handles it: We code the verbal report as "face" for that trial. We note the discrepancy with the button press. We do not change the coding of the verbal report. We might later analyze the data and note that the verbal reports are inconsistent with the button presses. This might lead us to question the timing of the verbal report (maybe we should collect reports immediately after each trial, not after a block). The protocol cannot resolve the discrepancy. It only records the report.

          What we might hate: We have to code the report as "face" even though we know from the button press that at the moment the stimulus was presented, they reported house. The procedure forces us to record the verbal report as given.

      Case 2: Blindsight patient. Says "I don't see anything" but guesses location at 80%.

          We are asking per trial.

          Question 1: "I don't see anything" -> coded as "no".
          Question 2: skipped (or N/A) because they said no.
          Question 3: not applicable (or if asked, they might say "nothing").

          The forced-choice performance was 80% correct.

          Heterophenomenology: We take the verbal report as the subject's sincere report of their experience: they had no visual experience. We do not conclude that they are lying or that they actually saw it. We record the forced-choice performance separately. The dissociation is the point of blindsight.

          The protocol handles this without issue: code the verbal report as "no", and the forced-choice as 80% correct. We don't change the coding.

      Case 3: Masking study. Subject reports: "it wasn't a visual experience, more like a vague hunch that something was there".

          Question 1: The subject didn't say yes or no? They described. So we must code based on the description.

            - They say they didn't have a visual experience, but they had a hunch. 

          How to code Q1? We have to decide: does a "hunch" count as seeing? In the context of our experiment, we are interested in visual awareness. The protocol must define what we are asking: we are asking about visual experience. If the subject distinguishes between visual and non-visual, then we should code as "no" for visual experience? But note the question: "Did you see anything?".

            - The subject is saying: I didn't see anything, but I had a hunch.

          Therefore, for Q1: we code as "no" because they are denying a visual experience.

          Q2: They didn't have a visual experience, so clarity would be N/A? But note, they might rate the clarity of the hunch? The question is about visual clarity. So we would skip Q2.

          Q3: They describe it as a vague hunch. We record that.

          However, note: the subject is reporting a non-visual experience. We might want to capture that. But our question is about seeing. So we stick to the question.

          What if we want to capture non-visual experiences? Then we might need to adjust the questions. But the protocol as written does not. We could consider adding a question about awareness in general (not just visual). However, the current protocol is for vision experiments. We might need to revise the questions.

          What we might hate: We coded it as "no" for seeing, but the subject had a hunch. We are not capturing the hunch in the yes/no. But note, we have the description. We might later decide to create a new category for "non-visual awareness". But the protocol as written does not. We are forced to code as "no". However, we have the verbatim description so we can go back and reanalyze.

          The procedure cannot settle: whether to code a hunch as a form of awareness. We have to stick to the predefined categories. We are not capturing the quality of the experience beyond the description.

   VI. What parts are heterophenomenology?

      - The protocol is heterophenomenological in that:
          a. We collect the reports as texts (verbatim) and treat them as meaningful utterances.
          b. We do not assume the reports are infallible (so we allow for discrepancies with behavior, as in Case 1 and 2).
          c. We remain neutral: we don't say the subject in Case 2 is wrong about their experience even though they performed well.

      - The parts that are just "write down what they said":
          - The verbatim transcription is the foundation. Without that, we wouldn't have the text to interpret.

      - The coding step is where heterophenomenology guides interpretation: we are interpreting the text as a report of experience (not as a report of the stimulus). We are also being neutral about the reality of the experience.

   VII. Confidence and least sure step:

      Overall confidence: Moderate to high. The procedure is practical and based on sound principles.

      Least sure step: Coding ambiguous responses in Question 1 and Question 3. We rely on human judgment, which can be inconsistent. We should have two independent coders and measure inter-rater reliability.

      Also, the clarity rating (Question 2) might be problematic if subjects use different words. Having a lookup table helps, but it's impossible to cover everything.

      Another concern: The timing of the verbal report. If there is a delay between the trial and the report, memory issues might affect the report. The protocol does not address this because it's an experimental design issue, not a coding issue.

   VIII. The Procedure Document:

      We'll write it as a step-by-step protocol.

      NOTE: This is a draft. The lab may need to adjust based on their specific experiments.

      ---

      **Protocol for Collecting and Coding Verbal Reports in Consciousness Experiments**

      I. Purpose
          To standardize the collection, transcription, and coding of verbal reports in a way that respects the subject's perspective while remaining neutral about the ontological status of their experiences.

      II. Pre-Experiment
          1. Train RAs:
              - Emphasize verbatim recording (use audio recording if possible).
              - Practice with mock subjects.
          2. Set up recording: Use a digital recorder and note the subject ID and trial number for each response.

      III. During the Experiment: Data Collection
          After each trial (or after a block, if per-trial is not feasible), ask the following questions in order:

          Question 1: "Did you see anything on that trial? Please say 'yes', 'no', or describe what you saw."
              - Allow the subject to answer freely. Do not interrupt.
              - Record the exact words.

          Question 2: "How clear was what you saw? Please rate it on a scale from 0 to 10, where 0 is not at all clear and 10 is as clear as normal vision. If you did not see anything, you can say 'not applicable' or skip this question."
              - Record the exact words or number.

          Question 3 (if applicable): "If you saw something, what did it look like? Please describe it as precisely as you can, including any details you noticed."
              - For experiments where stimulus identity is critical (e.g., rivalry), always ask. Otherwise, optional.

          Notes:
              - If the subject asks for clarification, say: "Please just describe what you experienced."
              - Do not rephrase the questions.

      IV. Post-Experiment: Transcription
          1. Transcribe the audio recording verbatim for each trial. Do not correct grammar or change words.
          2. Format: One row per trial, with columns for subject ID, trial number, and the three questions (with the verbatim response).

      V. Coding
          Use the following coding rules. Two independent coders are recommended for reliability.

          A. Question 1: Presence of visual experience
              - Code as one of: "yes", "no", "uncertain", "unusable".
              - Rules:
                  - "yes": if the subject says "yes" or any affirmative (e.g., "yeah", "I did") OR if they describe a visual experience (e.g., "I saw a flash").
                  - "no": if the subject says "no" or any negative (e.g., "nothing", "I didn't see anything") OR if they describe the absence of visual experience (e.g., "it was blank").
                  - "uncertain": if the subject expresses doubt (e.g., "maybe", "I'm not sure", "I think so but I can't be sure").
                  - "unusable": if the response is unintelligible, inaudible, or in a language not understood by the coder.
              - Judgment call: When the subject gives a description without a clear yes/no, the coder must decide based on whether the description implies a visual experience. If in doubt, code as "uncertain".

          B. Question 2: Clarity rating
              - Code as a number between 0 and 10, or "N/A", or "unusable".
              - Rules:
                  - If the subject gives a number, record that number.
                  - If the subject uses a labeled scale (e.g., "a glimpse"), use the predefined mapping:
                      - "absent": 0
                      - "a glimpse": 3
                      - "moderate": 6
                      - "clear": 10
                  - If the subject gives a range (e.g., "3 or 4"), take the midpoint (3.5).
                  - If the subject says "N/A" or skips because they didn't see anything, code as "N/A".
                  - If the subject gives a response not covered above, use the lookup table (to be provided as a separate sheet with common phrases and their mapped numbers). If the response is not in the table, the coder must assign a number based on the description (using the scale) and note the reason. If this is not possible, code as "unusable".
              - Judgment call: When mapping a verbal description to a number.

          C. Question 3: Description of content
              - Code only if the experiment requires it (e.g., for rivalry: "face", "house", "mixture", "other", "unusable").
              - Rules for rivalry:
                  - "face": if the subject mentions seeing a face or any part that clearly refers to the face stimulus.
                  - "house": similarly for house.
                  - "mixture": if the subject reports seeing both at the same time.
                  - "other": if the subject reports something else (e.g., "a dog", "a blur") - and record the verbatim.
                  - "unusable": if the response is unintelligible or not about the stimulus.
              - Judgment call: When the subject's description does not clearly match one category.

      VI. Exclusion Criteria
          - A trial's verbal report is excluded (marked "unusable") if any of the three questions is coded as "unusable".
          - A subject is excluded from verbal report analysis if more than 20% of their trials are unusable.

      VII. Integration with Behavioral Data
          - Behavioral data (e.g., button presses) are analyzed separately from verbal reports.
          - In the analysis, report both measures and note any dissociations.

      VIII. Cases (as examples in the protocol document)

          Case 1: Rivalry study - subject says "I saw the face" for a trial when the stimulus was a house (based on alternation) and the button press was for house.
              - Q1: "yes" (because they report a visual experience of a face).
              - Q2: (if they rate it, say 10) -> 10.
              - Q3: "face".
              - Note: The behavioral data (button press) for that trial is "house". We record both and note the discrepancy.

          Case 2: Blindsight patient - says "I don't see anything".
              - Q1: "no".
              - Q2: "N/A".
              - Q3: (if asked) record the response, but for coding in a rivalry-like task? Not applicable. In a location task, we might not have Q3. So skip.
              - Behavioral data: 80% correct. We report both.

          Case 3: Masking study - "it wasn't a visual experience, more like a vague hunch that something was there"
              - Q1: "no" (because they deny a visual experience).
              - Q2: "N/A".
              - Q3: record the verbatim: "it wasn't a visual experience, more like a vague hunch that something was there". If we are coding for content and the stimulus was, say, a letter, then we code as "other" and note the description.

      IX. What the Procedure Cannot Do
          - It cannot resolve discrepancies between verbal reports and behavior (like in Case 1 and 2). These are empirical findings.
          - It cannot capture nuances beyond the predefined categories (like the quality of a "hunch" in Case 3). We rely on the verbatim record for qualitative analysis.

      X. Revision
          This protocol should be reviewed annually and updated based on experience.

      ---

      This protocol is based on heterophenomenology. The key is the separation of the subject's report (as a text) from the objective measures and the interpretation of that text as a report of subjective experience without committing to its truth about the external world or the underlying neural states.

      We hope this brings peace to the lab!
answer: |-
  Below is a step-by-step heterophenomenology-based protocol for handling verbal reports in consciousness experiments. It operationalizes the core principles: (1) treat reports as *statements about subjective experience*, not objective reality, (2) record them faithfully, and (3) remain neutral about their ontological status. The protocol includes explicit decision rules, exclusion criteria, and human judgment flags.

  ---

  ### **Heterophenomenological Verbal Report Protocol**
  **I. Data Collection Procedure**  
  *Ask these questions verbatim after each trial (order matters):*  
  1. **Presence Question:**  
     "Did you consciously see anything related to the stimulus? Answer YES, NO, or describe what happened."  
     - *Valid Responses:* "Yes," "No," or a descriptive statement (e.g., "I saw a flash").  
     - *Invalid/Unusable:* Silence, "I don’t know," or non-experience descriptions (e.g., "The screen flickered").  
     - *RA Action:* If invalid, repeat the question once. If still invalid, mark trial as "unusable."  

  2. **Clarity Question (if YES to Q1):**  
     "How clear or vivid was what you saw? Rate from 0 (no experience) to 10 (perfectly clear), or describe it."  
     - *Valid Responses:* Number 0–10 or descriptive adjectives (e.g., "fuzzy," "like a shadow").  
     - *Invalid/Unusable:* Non-visual descriptions (e.g., "I felt it") or unclear responses.  
     - *RA Action:* If invalid, ask: "Can you rate the *visual* clarity?" If still invalid, mark as "unusable."  

  3. **Content Question (if YES to Q1):**  
     "What did you see? Describe it in as much detail as possible."  
     - *Valid Responses:* Any description of visual content (e.g., "a red line," "a face").  
     - *Invalid/Unusable:* "Nothing" (contradicts Q1) or non-perceptual reports (e.g., "I guessed").  
     - *RA Action:* If invalid, mark Q3 as "unusable" but retain Q1/Q2 if valid.  

  **II. Transcription & Coding Rules**  
  *Transcribe responses verbatim. Code into predefined categories:*  
  - **Q1 (Presence):**  
    - `YES`: Explicit "yes" or descriptions implying visual experience (e.g., "a face appeared").  
    - `NO`: Explicit "no" or descriptions denying experience (e.g., "nothing was there").  
    - `UNCERTAIN`: Qualified responses (e.g., "maybe," "sort of").  
    - `UNUSABLE`: Invalid responses per above.  
    - *Judgment Call:* Ambiguous descriptions (e.g., "I sensed something") → Flag for human coder.  

  - **Q2 (Clarity):**  
    - Code numerical ratings 0–10 directly.  
    - For descriptive responses, use:  
      `0` = "no experience," `1-3` = "vague/shadow," `4-6` = "blurred but identifiable," `7-9` = "clear," `10` = "perfect."  
    - *Judgment Call:* Unmapped descriptions (e.g., "like a dream") → Flag for human coder.  

  - **Q3 (Content):**  
    - Code stimulus-specific categories (e.g., `FACE`, `HOUSE` for rivalry).  
    - `OTHER` for unexpected descriptions (e.g., "a dog").  
    - `UNUSABLE` if invalid.  
    - *Judgment Call:* Mixed/ambiguous content (e.g., "face and house merged") → Flag for human coder.  

  **III. Exclusion Criteria**  
  - **Trial-Level:** Mark entire trial "unusable" if:  
    - Q1 is invalid, OR  
    - ≥2 responses are invalid/unusable.  
  - **Subject-Level:** Exclude from verbal report analysis if:  
    - >30% of trials are unusable, OR  
    - Responses are systematically inconsistent (e.g., always "yes" on catch trials).  

  **IV. Integration with Behavioral Data**  
  - Verbal reports and forced-choice data are analyzed **separately**.  
  - Discrepancies (e.g., high forced-choice accuracy with "no" reports) are documented as findings, not errors.  

  ---

  ### **Case Applications**
  **Case 1: Rivalry Study**  
  *Subject says "I saw the face the whole time" despite button presses tracking alternation.*  
  - **Q1:** "YES" (reports visual experience).  
  - **Q2:** Assume rated "10" → Code `10`.  
  - **Q3:** "Face" → Code `FACE`.  
  - **Protocol Action:** Code as stated. Do **not** override with button presses.  
  - **Why You’ll Hate This:** Forces you to accept the contradiction. Heterophenomenology treats the report as a *statement about experience*, not reality. The discrepancy becomes a data point (e.g., "post-hoc reinterpretation").  

  **Case 2: Blindsight Patient**  
  *"I don’t see anything" but 80% location accuracy.*  
  - **Q1:** "No" → Code `NO`.  
  - **Q2:** Skipped (no experience) → Code `N/A`.  
  - **Q3:** Not asked.  
  - **Protocol Action:** Code `NO`. Forced-choice data is analyzed separately.  
  - **Heterophenomenology Work:** Neutrality allows "unconscious perception" as a valid interpretation.  

  **Case 3: Masking Study**  
  *"It wasn’t visual, more like a vague hunch."*  
  - **Q1:** Description implies no visual experience → Code `NO` (*not* "yes with low clarity").  
  - **Q2:** Not applicable → Code `N/A`.  
  - **Q3:** "Vague hunch" → Code `UNUSABLE` (non-visual).  
  - **Protocol Action:** Trial retained for Q1 (`NO`), excluded for Q2/Q3.  
  - **What It Can’t Settle:** Whether "hunch" qualifies as *any* form of awareness. Requires post-hoc analysis (e.g., categorizing non-visual reports).  

  ---

  ### **Critical Evaluation**  
  **Where Heterophenomenology Does the Work:**  
  1. **Q1 Coding:** Forces differentiation between "no experience" (blindsight) and "uncertain/vague experience" (Case 3).  
  2. **Neutrality in Discrepancies:** Prevents RAs from "correcting" reports based on behavior (e.g., Case 1).  
  3. **Exclusion Criteria:** "Unusable" flags protect against overinterpreting non-phenomenological reports.  

  **Where It’s Just "Write Down What They Said”:**  
  - Transcription and descriptive coding (e.g., Q3 content) are foundational but not uniquely heterophenomenological.  

  **Confidence Assessment:**  
  - **Overall Confidence: 8/10.**  
    - Strong: Standardizes treatment of reports as subjective claims.  
    - Weak: Requires high RA training to avoid implicit bias during coding.  
  - **Least Confident Step: Q2 Clarity Coding.**  
    - Descriptive→numerical mapping risks losing nuance (e.g., "fuzzy" vs. "shadowy"). Mitigation: Use broader categories or qualitative analysis.  

  **Recommendation:**  
  - Pilot the protocol with 20 trials, measure inter-coder reliability (target κ >0.8), and refine judgment call rules.  
  - For advanced nuances (e.g., non-visual "hunches"), add an optional free-response question post-block.  

  This protocol should resolve lab disputes by enforcing consistency while respecting the subjectivity of experience. Discrepancies become data, not errors.
