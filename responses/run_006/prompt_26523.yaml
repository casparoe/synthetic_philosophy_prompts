  **Key Escape Route for the Kuhn Defender:**  
  Reject the **False Dilemma in Premise 3** ("Either identical meanings OR talking past each other"). Kuhn argues for a middle ground:  
  - **Referential Overlap:** Newtonian "mass" and relativistic "mass" both refer (imperfectly) to properties of physical bodies manifest in similar experimental interactions (e.g., resistance to acceleration).  
  - **Shared Observational Grounding:** Predictions about instrument readings or planetary positions are stable enough across paradigms to serve as points of conflict. When paradigms clash, they *are* competing to explain the *same world*, not private realities.  
  - **Rational Criteria Exist (Non-Algorithmic):** Progress isn't truth-convergence but increased puzzle-solving scope/accuracy. Choosing relativity over Newtonian mechanics isn't "taste"—it resolves anomalies (Mercury's orbit), unifies phenomena (mass-energy), and predicts novel effects (light bending). These are *reasons*, even if they aren't logically coercive.  

  **To Your Physicist Friend:**  
  "Kuhn isn't saying science is 'just taste.' He's saying it's more like judging a chess strategy than solving an equation. You favor relativity *because* it handles extreme speeds/gravitation better, explains more with fewer ad-hoc fixes, and predicted novel effects—all rational criteria. But these judgments require immersion in the paradigm's problems. The 'extra' factor isn't social whim; it's expert recognition of which framework *solves puzzles more effectively*. That's not relativism—it's how rational expertise works in complex domains."  

  **Why This Works:**  
  It preserves Kuhn's core insights (meaning change, theory-ladenness, crisis-driven revolutions) while blocking the slide into relativism by emphasizing pragmatic rationality and shared empirical constraints. The argument's error is treating incommensurability as total semantic isolation.
