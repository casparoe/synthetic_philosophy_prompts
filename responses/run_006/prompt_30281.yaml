prompt: |-
  I've been trying to work out what a thing's dispositions amount to, and I keep colliding with the obvious starting point. The natural idea is that a disposition is just a would-if claim: glass is fragile because it would shatter if struck, salt is soluble because it would dissolve if put in water, a poison is poisonous because it would kill if swallowed.

  But the would-if claim and the disposition come apart in both directions. A glass wired to a device that would make it shatterproof the instant before anything struck it still seems fragile now, even though the claim that it would shatter if struck is false. A poison that is always neutralized by an antidote the moment it is swallowed is still poisonous, even though the claim that it would kill if swallowed is false. And an otherwise harmless powder that would kill only because someone would add a toxin to it upon ingestion satisfies the would-if claim without being poisonous. So the simple account fails in both directions, and I do not want a patch that just tacks on further clauses case by case.

  Before I look at any actual theory, I want the full specification of what such a theory has to get right. Write the requirements list: the cases any adequate account of dispositions must classify correctly, the distinctions it cannot collapse, and the results from the sciences it cannot contradict, with the reasoning behind each. I am after what dispositions really are, not merely a tidy way of talking. In particular, I want the list to take a position on whether an adequate account must handle dispositions that come in degrees, dispositions that are probabilistic rather than all-or-nothing, and the difference between a disposition a thing has in itself and one it has only in relation to its surroundings; include any of these only if it genuinely earns its place as a requirement. For each requirement, say whether it is non-negotiable or a preference of a particular camp. Then say which requirements pull against one another and how a theory is supposed to live with that, and which single requirement does the most to eliminate candidate theories. A brief scorecard of the main contenders against the list is welcome, but the list is what I want.
reasoning: |-
  Alright, the user is grappling with the concept of dispositions in philosophy. They started with the simple idea that dispositions are just "would-if" claims—like glass being fragile because it would shatter if struck. But they quickly found counterexamples where this breaks down. For instance, a glass wired to a shatterproof device is still fragile even though it wouldn't shatter. Conversely, a harmless powder that becomes toxic only when tampered with satisfies the "would-if" claim without being intrinsically poisonous. 

  The user wants a requirements list for any adequate theory of dispositions, not just patches for specific cases. They emphasize that the list must cover what dispositions *really are*, not just linguistic conveniences. Key points they care about include dispositions with degrees, probabilistic dispositions, and intrinsic vs. relational properties. They also want to know which requirements are non-negotiable, which conflict, and which requirement is the biggest theory-killer.

  First, I need to outline core requirements. The obvious one is handling intrinsic vs. relational dispositions. The glass-with-device example shows that fragility is intrinsic, even when masked. The antidote case similarly shows that poison's disposition persists despite external blockers. So Requirement 1: Intrinsic Grounding—dispositions must be intrinsic properties, even if their manifestations depend on context. This is non-negotiable; without it, the concept collapses into mere conditional statements.

  Then there's the masking/mimicking problem. The device "masks" fragility, while the powder is "mimicked" into being toxic. Requirement 2: Masking/Mimicking Resistance—the theory must distinguish genuine dispositions from cases where external factors interfere. Also non-negotiable. 

  The user mentioned degrees and probabilities. Dispositions like elasticity or susceptibility to disease aren't all-or-nothing. Requirement 3: Degrees/Probabilistic Nature—must handle scalar and probabilistic dispositions. This might be negotiable for some theories but essential for realism, especially in scientific contexts (e.g., quantum mechanics).

  Requirement 4: Scientific Integration—dispositions shouldn't contradict physics or chemistry. For instance, solubility explained by molecular structure. Non-negotiable for naturalistic approaches. 

  Requirement 5: Disposition/Categorical Distinction—dispositions aren't identical to categorical properties (like molecular structure), but are grounded in them. This avoids reductionism. Non-negotiable for anti-Humeans.

  Now, conflicts. Intrinsic Grounding clashes with Context Sensitivity. How can a property be intrinsic yet require specific contexts to manifest? Theories need to navigate this—perhaps by distinguishing the property itself from its manifestation conditions. Also, Scientific Integration might push for reductionism, while Disposition/Categorical Distinction resists it. 

  The biggest theory-killer? Intrinsic Grounding. Simple conditionals fail here immediately. Even sophisticated conditional analyses struggle without intrinsic anchors. 

  For contenders: Conditional Analyses (like Lewis) fail Requirement 1 and 2. Categorical Reductionism (Armstrong) fails 5. Powerful Properties (Shoemaker) handles 1 and 5 but may struggle with 3. Dispositional Essentialism (Bird, Ellis) handles most but faces challenges with masking. 

  The user’s deeper need seems to be a robust metaphysical framework that preserves realism about dispositions while accommodating science. They’re likely building a theory or critiquing existing ones, so clarity on conflicts and non-negotiables is crucial. They might also be interested in how dispositions relate to natural laws or causation, though unstated. Highlighting the tension between intrinsicality and context addresses their core frustration with the "would-if" approach.
answer: |-
  Here is a requirements list for an adequate theory of dispositions, based on your core challenges and deeper philosophical goals. It prioritizes metaphysical robustness over linguistic analysis.

  **Core Requirements (Non-Negotiable for a Realist Account):**

  1.  **Intrinsic Grounding (Non-Negotiable):**
      *   **What:** The disposition must be a (relatively) intrinsic property of the object *itself*, grounded in its internal structure or nature, *not* solely in its relationship to external circumstances or future events.
      *   **Why:** Your counterexamples demonstrate this. The glass wired to a device *is* fragile because its internal molecular structure makes it prone to shattering. The antidote doesn't change the poison's inherent chemical reactivity; it intervenes *after* the disposition's manifestation is triggered. An account must explain *why* the object is the source of the potential behavior, even when masked. Failure here collapses dispositions into mere descriptions of possible worlds or conditional facts.
      *   **Counterexample Handled:** Glass w/ Device (Requirement 1a - Intrinsic Persistence under Masking), Poison w/ Antidote (Requirement 1b - Intrinsic Grounding despite Blockers).

  2.  **Masking/Mimicking Resistance (Non-Negotiable):**
      *   **What:** The theory must correctly distinguish between:
          *   *Masking:* The disposition is present but its manifestation is prevented by interfering factors (e.g., the shatterproof device, the antidote).
          *   *Mimicking:* The "would-if" conditional holds true, but *not* due to an intrinsic disposition of the object (e.g., the powder that only kills because poison is added later).
          *   *Finks:* Situations where the disposition itself is lost *precisely* when the stimulus is applied (a distinct, often debated case - e.g., a "fragile" glass enchanted to become non-fragile *the instant* it's struck).
      *   **Why:** Your examples show the simple conditional fails catastrophically here. An account must explain *why* the glass w/device *has* the disposition (masked) while the powder *lacks* it (mimicked).
      *   **Counterexample Handled:** Glass w/ Device (Masking), Poison w/ Antidote (Masking), Harmless Powder w/ Toxin-Adder (Mimicking).

  3.  **Context Sensitivity of Manifestation (Non-Negotiable):**
      *   **What:** While the disposition is intrinsic, its *manifestation* inherently depends on being in the appropriate context (the "stimulus conditions" or "test conditions"). Solubility manifests *in water*, flammability *in the presence of oxygen and an ignition source*.
      *   **Why:** Soluble salt doesn't dissolve in air; fragile glass doesn't shatter untouched. The "if" clause is essential for manifestation but not for the existence of the disposition itself. The theory must capture this dependence without making the disposition itself relational.
      *   **Tension:** This creates tension with **Intrinsic Grounding**. How can something intrinsic require specific external conditions to show its nature? A good theory must navigate this (e.g., the intrinsic property is the *potential to behave in way X* when *in condition Y*).

  4.  **Scientific Integration / Causal Basis (Non-Negotiable for Naturalism):**
      *   **What:** Dispositions must not contradict established science; they must be grounded in, or identical to, the scientifically discoverable causal properties of the object (e.g., molecular structure, atomic charge, genetic makeup). The account should cohere with how science explains properties like solubility, conductivity, reactivity, or radioactivity.
      *   **Why:** Solubility *is* explained by ionic bonding interacting with polar water molecules; fragility by amorphous atomic structure lacking slip planes. An account that makes dispositions spooky, non-causal, or divorced from physical structure is metaphysically suspect and scientifically useless. It must show *how* the structure grounds the potential behavior.

  5.  **Disposition/Categorical Distinction (Non-Negotiable for Anti-Reductionism):**
      *   **What:** Dispositions (potentials, powers) are not simply identical to categorical properties (structural descriptions). While grounded in the categorical base, the dispositional aspect (the *what it would do*) is a real, non-eliminable feature of the world.
      *   **Why:** A pure structural description (e.g., "H₂O molecules") doesn't *by itself* tell you what the substance *does* (e.g., dissolves salt, freezes at 0°C). The disposition captures the *causal role* or *potential* inherent in the structure. Reductionist accounts (claiming dispositions *just are* structures) often struggle with modality and the "oomph" of causation/potentiality that dispositions intuitively possess. Requirement 4 ensures grounding, this requirement ensures dispositions aren't *reduced away*.

  **Important, Potentially Negotiable Requirements (Earning Their Place):**

  6.  **Degrees & Probabilistic Nature (Earns Place via Science & Phenomenology):**
      *   **What:** The theory must accommodate dispositions that come in degrees (elasticity, susceptibility to disease, conductivity) and probabilistic dispositions (radioactive decay, propensity to mutate, chance of shattering under a given force).
      *   **Why:** Many scientifically fundamental dispositions are inherently scalar or stochastic. Ignoring this yields an incomplete picture. While some simplified accounts might avoid it, a *comprehensive* theory of "what dispositions really are" must handle these cases. It's a requirement for realism about much of modern science (quantum mechanics, statistical mechanics, epidemiology). *Negotiability:* A theory focusing *only* on simple, all-or-nothing dispositions might omit this, but at the cost of significant scope and realism.

  7.  **Intrinsic vs. Relational Dispositions (Earns Place via Ontology):**
      *   **What:** The theory must distinguish dispositions a thing has purely in virtue of its intrinsic properties (fragility, solubility) from dispositions it has only relationally or contextually (e.g., "being visible" depends on light and an observer; "being flammable in this oxygen-rich atmosphere").
      *   **Why:** Your query explicitly asks for this. It clarifies the core metaphysical nature. While *all* dispositions require context for manifestation (Req 3), some dispositions are *constituted* by relations (e.g., "being a key for *this* lock"), while others are intrinsic potentials that *interact* with contexts. An account needs conceptual tools for this distinction. *Negotiability:* Radically relational ontologies might blur this line, but a robust realist account should acknowledge it.

  **Key Tensions and How Theories Live With Them:**

  *   **Intrinsic Grounding (Req 1) vs. Context Sensitivity (Req 3):** This is the core tension. How can a property be intrinsic yet require specific external conditions to manifest? Theories navigate this by:
      *   Defining the disposition as an intrinsic *potentiality* or *power* whose *actualization* requires the context (e.g., Aristotelian potentiality/actuality).
      *   Grounding the disposition in intrinsic categorical properties that *causally guarantee* (or probabilify) the manifestation *in the specific context* (e.g., molecular structure *causes* dissolution *when in water*).
      *   Distinguishing the *dispositional property* (intrinsic) from the *disposition ascription* which includes the context (e.g., "fragile" simpliciter vs. "fragile when struck").
  *   **Scientific Integration (Reductionist Pressure - Req 4) vs. Disposition/Categorical Distinction (Anti-Reductionist - Req 5):** Science explains dispositions via structures, pushing towards reductionism. Yet, dispositions seem irreducibly modal/potential. Theories live with this by:
      *   **Identity:** Claiming dispositions *just are* the causal powers inherent in the structures (Powerful Properties/Dispositional Essentialism).
      *   **Supervenience:** Claiming dispositions strongly supervene on the categorical base but are distinct higher-order properties.
      *   **Primitivism:** Taking dispositions as fundamental, irreducible components of reality (less common).
      *   **Functional Role:** Defining dispositions by their causal role, realized by the categorical base.

  **The Biggest Theory-Killer Requirement:**

  *   **Intrinsic Grounding (Req 1)** is the most devastating. Simple conditional analyses fail immediately here. More sophisticated conditional analyses (e.g., Lewis's "finkish" analysis) often become incredibly complex and ad-hoc to handle masking/mimicking/finkishness while trying to preserve a semblance of intrinsicality. Any theory that cannot securely anchor the disposition *in the object itself*, independently of the actual truth of the "would-if" conditional in all possible scenarios, struggles fundamentally. It's the requirement that most clearly separates robust realism about dispositions from mere conditional descriptions of behavior.

  **Brief Scorecard of Main Contenders:**

  1.  **Simple Conditional Analysis (e.g., Rylean inspired):** Fails Req 1 & 2 catastrophically. Fails Req 4 & 5. May handle Req 3 superficially. Inadequate.
  2.  **Sophisticated Conditional Analysis (e.g., Lewis):** Tries to handle Masking/Mimicking/Finks (Req 2) with complex conditionals. Often struggles *deeply* with Intrinsic Grounding (Req 1) – the analysis becomes so contextual it undermines the object's ownership. May handle Req 3 & 7. Poor on Req 6. Controversial on Req 4/5. Generally seen as inadequate by realists.
  3.  **Categorical Reductionism (e.g., Armstrong):** Strong on Scientific Integration (Req 4). Explicitly rejects Req 5 (Collapses Disposition/Categorical Distinction). Struggles with modality and the "oomph" of dispositions (the core of Req 1 & 5). Can handle Req 2, 3, 6, 7 by reducing them to structures and laws. Fails for those who see dispositions as irreducible.
  4.  **Powerful Properties / Dispositional Essentialism (e.g., Shoemaker, Ellis, Bird):** Strongest on Intrinsic Grounding (Req 1) and Disposition/Categorical Distinction (Req 5) – properties *are* powers. Can handle Masking/Mimicking (Req 2) via intrinsic powers being interfered with. Can handle Scientific Integration (Req 4) by identifying powers with fundamental physical properties. Can accommodate Degrees/Probability (Req 6) and Intrinsic/Relational (Req 7). Handles Context Sensitivity (Req 3) via manifestation conditions being part of the power's essence. The leading realist contender, though debates persist (e.g., quiddities, pure powers).
  5.  **Functional Role Theories:** Handle Req 2, 3, 6, 7 well by defining dispositions via inputs/outputs. Can integrate with science (Req 4). Often weaker on Intrinsic Grounding (Req 1) - the role might be multiply realizable, detaching it from *this* object's specific nature. Controversial on Req 5.

  This list prioritizes a robust, naturalistic, realist metaphysics of dispositions. The most demanding theories (like Dispositional Essentialism) aim to satisfy all requirements, while others sacrifice some (like Intrinsic Grounding or the Disposition/Categorical distinction) for perceived advantages like simplicity or compatibility with Humean metaphysics. Intrinsic Grounding remains the critical hurdle.
