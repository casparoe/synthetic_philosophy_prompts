prompt: |-
  I'm a novelist, and I've been trying to structure my next book as a tangled hierarchy in the Hofstadter sense — characters who turn out to be writing the book they're in, a chapter that edits an earlier chapter, that sort of thing. I keep running into the idea of an inviolate level, the one that has to stay outside the tangle so the whole structure doesn't collapse into paradox or infinite regress. I'd like you to make an argument for the following position: the inviolate level isn't a fixed feature of a tangled hierarchy, its just where the describer decides to stop climbing — so the same structure can have different inviolate levels depending on what you take yourself to be doing with it. Push the argument as hard as you can, and make it concrete for Escher's Drawing Hands. And be straight with me: separate what's actually settled among people who work on Hofstadter and self-reference from what's genuinely contested, and don't present a contested reading as the consensus.
