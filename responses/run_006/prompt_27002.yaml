  ### Part 1: Exposition of Program Equilibrium in its Own Terms

  The setting is the one-shot Prisoner's Dilemma (PD). In the classic PD, two players each choose to Cooperate (C) or Defect (D). The payoffs are such that mutual cooperation (C,C) yields a reward R for each, mutual defection (D,D) yields a punishment P, and if one cooperates while the other defects, the defector gets the temptation payoff T and the cooperator gets the sucker's payoff S. The payoffs satisfy T > R > P > S and 2R > T+S (so that mutual cooperation is better than alternating). In the one-shot game without any repeated interactions, the only Nash equilibrium is mutual defection.

  Program equilibrium considers a scenario in which each player submits a program (a decision procedure) that can read the source code of the other player's program and then decide whether to cooperate or defect. The key idea is that by conditioning their actions on the other's source code, the programs can achieve mutual cooperation even in a one-shot setting.

  **FairBot**: 
  FairBot is a program that cooperates with the other player if it can prove (in some formal system) that the other player cooperates with FairBot. Otherwise, it defects. More precisely:
  - FairBot(X) = C if it can prove that X(FairBot) = C
  - FairBot(X) = D otherwise

  **PrudentBot**:
  PrudentBot is a variant that avoids being exploited by defectors. It cooperates only if it can prove that the other player cooperates with PrudentBot and also that the other player does not defect against cooperative opponents. Specifically:
  - PrudentBot(X) = C if it can prove that X(PrudentBot) = C and also that for all Y, if Y is cooperative (meaning Y(Z)=C for all Z), then X(Y)=C.
  - Otherwise, PrudentBot defects.

  **The Role of Löb's Theorem**:
  Löb's theorem is a key technical tool. It states that in a formal system that can express basic arithmetic (and is consistent and sufficiently powerful), if a statement S is provable whenever the system can prove that the provability of S implies S, then S is provable. In symbols: if the system proves □(□S → S) → □S, then it proves □S.

  In the context of FairBot, consider two FairBots (A and B) facing each other. Each FairBot is trying to prove that the other cooperates. Suppose A tries to prove that B cooperates. B, in turn, is trying to prove that A cooperates. This creates a self-referential loop. Using Löb's theorem, we can show that each FairBot can indeed prove that the other cooperates, and hence both cooperate.

  Here's the sketch for two identical FairBots (say FB1 and FB2):
  - FB1 is trying to prove: "FB2(FB1) = C"
  - FB2 is defined so that it will output C if it can prove "FB1(FB2) = C"
  - By the symmetry, if FB1 can prove that "FB2(FB1)=C" is provable only if it is true (which is the case because if FB2 can prove that FB1(FB2)=C, then it will cooperate), then by Löb's theorem, FB1 can prove that FB2(FB1)=C.

  Thus, mutual cooperation is achieved.

  **Why it's not just a commitment device**:
  A commitment device typically requires an external enforcer or a binding contract. In program equilibrium, there is no external enforcer. Instead, the cooperation arises from the mutual ability to inspect each other's decision procedure and the logical inevitability that if both agents are using the same cooperative strategy (like FairBot), then they will both cooperate. Moreover, the agents are not pre-committing to a fixed action; they are conditionally committing based on the other's program. Crucially, the proof-based approach ensures that when two FairBots meet, they can each deduce the other's cooperation without any prior agreement, by the logical structure of their own code and the other's code.

  **PrudentBot and avoiding exploitation**:
  PrudentBot is designed to cooperate with other cooperative agents (like FairBot) but not with agents that defect against cooperators (like a defector). It requires that the other player not only cooperates with PrudentBot but also cooperates with any cooperative strategy. This prevents exploitation by a program that cooperates with PrudentBot but defects against cooperative programs that are not PrudentBot.

