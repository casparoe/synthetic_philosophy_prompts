  We are going to break this down into three parts as requested:

  1. **Exposition of Program Equilibrium in its Own Terms**: Clearly state the core argument of program equilibrium, including FairBot, PrudentBot, Löb's theorem, and why it's not just a commitment device.

  2. **Translation into Evolutionary Biology Vocabulary**: Restate the entire argument using concepts from evolutionary biology (strategies as heritable phenotypes, payoffs as fitness, one-shot interaction, phenotypic detection/signaling, etc.).

  3. **Residue Report**: Analyze which parts translated cleanly, which required distortion, and which have no expression in evolutionary terms. For each piece of residue, discuss whether it points to a missing insight in evolutionary biology or a hidden assumption in program equilibrium.

