  So I just got into this huge argument with my friend about epistemic logic and I can't stop thinking about it. He was defending the idea that knowledge is closed under logical consequence — like, standard possible-worlds semantics just bakes that in. And I kept saying, look, if I know the axioms of set theory, I do not thereby know whether the continuum hypothesis is true, even though it's either entailed or not entailed by those axioms. That's the problem of logical omniscience, right? My friend kept saying "well it's an idealization" but honestly that feels like a cop-out. If your model of knowledge says I know things I demonstrably don't know, isn't the model just broken? Why do epistemologists still take this framework seriously?
