prompt: |-
  I'm a novelist, and I've been wrestling with a phenomenon in my dialogue writing that I can't find a satisfactory name for. Here is what happens. I will have a character say something perfectly natural in context — something that, given what that character knows and intends, means one thing. But the reader, who has access to information the character lacks (backstory, other characters' secrets, the shape of the narrative so far), will pick up a second, richer meaning from the same words — a meaning the character did not and could not have intended. This is not dramatic irony, because in dramatic irony the audience knows the character is mistaken or that their words will recoil on them in a way they cannot foresee; the second meaning undercuts or ironizes the first. What I am describing is different: the character's intended meaning stands perfectly intact, and the second meaning sits alongside it, not cancelling it but adding a layer that feels, to the reader, as though it was "meant" — just not by the character. If anyone meant it, I did, as the author. But I did not signal it with any of the usual devices: no wink to the audience, no break in tone, no narrator comment. The words simply happen to carry this extra weight because of the larger narrative structure they are embedded in.

  A concrete example from something I am drafting: a woman tells her husband, over breakfast, "I think we should invite your brother this weekend." She means it as a peace offering after a family argument; she is trying to be generous. The reader, however, knows that the brother has been having an affair with the husband's business partner, and that this information is about to surface in a way that will destroy the husband's professional life. The wife knows none of this. Her words, read in that light, carry a second meaning — something like "the weekend you are about to have will be far worse than you imagine, and your brother will be at the centre of it." The reader feels this second meaning as deliberate, as though the sentence was constructed to deliver it, but the character is entirely innocent of it. It is not foreshadowing in the usual sense, because nothing about the line itself points forward; it is only the reader's collateral knowledge that makes it resonate.

  I have been calling this "retroactive double meaning" in my notes, but I suspect there must be an established term, or at least a discussion, somewhere in the philosophy of language or literary theory. It seems adjacent to the idea that speakers can convey more than they literally say — implicature, I think it is called — but here the "speaker" who conveys the extra meaning is not the character; it is the text, or the author, or the narrative situation itself. Is there a name for this specific configuration? If there are several near-miss concepts, I would like to know what they are, how each differs from what I am describing, and which comes closest. And if there really is no term, I would be grateful for a precise definition and a suggested name that distinguishes it from dramatic irony, from ordinary implicature, and from the kind of authorial intrusion where the narrator simply tells the reader something the character does not know.
reasoning: |-
  Okay, let me unpack this novelist's question. They're describing something fascinating - dialogue where a character's innocent statement gains a second, darker meaning from the reader's broader knowledge. It's not dramatic irony because the character's meaning remains valid, and it's not foreshadowing because the line itself doesn't point forward. 

  First, I need to pinpoint why dramatic irony doesn't fit. In dramatic irony, the audience's knowledge contradicts or undermines the character's words - like when Oedipus vows to find the murderer, not knowing he's the culprit. But here, the wife's invitation still functions as a genuine peace offering; the additional meaning doesn't cancel that. 

  Then there's implicature - but that's about what listeners infer from context, like sarcasm. Here, the extra meaning comes entirely from narrative context unknown to the character. The character isn't implying anything; the text is doing the work. 

  I recall literary concepts like "double entendre" or "subtext," but those usually involve intentional ambiguity by the speaker. The wife isn't being ambiguous - she's utterly sincere. The duality comes from the reader's privileged perspective. 

  Semantic terms like "connotation" feel too broad. Structuralist ideas about "the death of the author" seem irrelevant since the author explicitly wants to claim this effect. 

  The closest framework might be Umberto Eco's idea of the Model Reader - where the text invites interpretations beyond surface meaning. But Eco doesn't name this specific device. 

  Genette's narratology offers "paralipsis" (withholding info) but that describes gaps, not this layering of meaning. 

  Perhaps this is a unique blend: an "unintentional dramatic irony" where the irony doesn't undercut but coexists, or a "contextual overdetermination" where narrative forces charge the words. 

  For precision, I should define its elements: (1) character speaks with clear intent (2) narrative context imbues words with secondary meaning (3) both meanings coexist without conflict (4) the effect requires reader's superior knowledge. 

  If no term exists, "contextual resonance" might work - emphasizing how context makes words vibrate with extra significance. Or "narrative duplexity" to capture the dual layers from story structure. 

  The key distinction is that the character owns the primary meaning while the narrative owns the secondary one - a rare case where authorial design feels emergent rather than imposed.
answer: |-
  What you're describing is a fascinating and sophisticated narrative technique, and you're right that it sits *adjacent* to dramatic irony but isn't quite the same thing. While there isn't one universally agreed-upon term for this *exact* configuration, several concepts from literary theory and philosophy of language touch upon it. Let's break down the contenders and why they fit (or don't), leading to a suggested definition and name.

  ### Key Concepts & Why They Are Near-Misses

  1.  **Dramatic Irony:**
      *   **Definition:** Audience/reader knows something crucial that a character does not, creating a gap in understanding where the *character's* words or actions become ironically undermined, mistaken, or doomed.
      *   **Miss:** As you identified, in your technique, the character's *intended meaning* remains perfectly valid and isn't undermined or made ironic *by the audience's knowledge in relation to the character's immediate situation*. The wife genuinely offers peace. The *additional* meaning doesn't cancel or mock her intention; it complements it from an external perspective.

  2.  **Situational Irony / Cosmic Irony:**
      *   **Definition:** A discrepancy between what is expected to happen and what actually happens, often attributed to fate, the universe, or a cruel twist of circumstance. Sometimes overlaps with dramatic irony.
      *   **Miss:** While the *outcome* for the husband might be ironic, the *technique you describe focuses on the line of dialogue itself acquiring a second, unintended meaning* due to the reader's knowledge *before the outcome occurs*. It's about the *semantic resonance* of the words in the *present moment* for the reader, not just the eventual outcome.

  3.  **Implicature (Gricean):**
      *   **Definition:** (H.P. Grice) What a speaker *implies, suggests, or means* beyond the literal meaning of the words uttered, based on context, shared knowledge, and conversational maxims (e.g., relevance, quantity). The *speaker* intends the implicature.
      *   **Miss:** This is crucial. In your example, the *wife* (the speaker) intends no implicature related to the affair or impending doom. The "extra meaning" is **not generated by the speaker's intention or the conversational context between the characters.** It's generated *solely* by the *narrative context* known to the reader.

  4.  **Subtext:**
      *   **Definition:** The underlying or implicit meaning in a character's dialogue or actions, often reflecting their true feelings, hidden motives, or unspoken tensions *within the scene*. The character (consciously or unconsciously) is the source.
      *   **Miss:** The wife has *no* hidden motive related to the affair. The "richer meaning" isn't bubbling beneath *her* surface; it's imposed onto her words from *outside* the scene by the larger narrative. The subtext belongs to the *plot*, not the *character*.

  5.  **Foreshadowing:**
      *   **Definition:** Hints or clues within the narrative that suggest future events.
      *   **Miss:** While the line *becomes* foreshadowing in retrospect due to the reader's knowledge, as you note, the line itself isn't *constructed* to point forward (e.g., ominous imagery, prophetic language, vague warnings). Its foreshadowing power is *entirely dependent* on the reader's pre-existing collateral knowledge. It's foreshadowing only *because* the reader already knows the secret.

  6.  **Connotation / Semantic Resonance:**
      *   **Definition:** The emotional or cultural associations a word carries beyond its literal meaning (denotation). Or, the way meaning echoes or gains depth within a specific context.
      *   **Near-Hit:** This gets closer to the *effect*. The words take on a darker, richer connotation *for the reader* because of the narrative context. However, these terms are very broad and don't capture the specific mechanism of *character innocence vs. reader knowledge* or the *coexistence* of the two meanings.

  7.  **Authorial Irony / Structural Irony:**
      *   **Definition:** Irony generated by the author's construction of the entire narrative situation, not just a single scene. The reader perceives patterns, juxtapositions, or meanings intended by the author that characters cannot see.
      *   **Near-Hit:** This is probably the closest established concept. It acknowledges that the irony (or extra meaning) stems from the *author's design* and the *structure of the narrative*, rather than the character's intention or immediate situation. It encompasses the reader's privileged position. However, "irony" still implies some element of contradiction or incongruity, which, while present in the *situation* (peace offer vs. impending doom), isn't necessarily the *primary effect* on the *words themselves* as they are spoken. The emphasis is on the *doubling* of meaning without negation.

  ### The Core Mechanism & Suggested Terminology

  Your technique hinges on a specific **narrative asymmetry**:
  1.  **Character Level:** The character speaks with clear, singular intent based on their knowledge. (Meaning A).
  2.  **Narrative Level:** The reader possesses knowledge (backstory, secrets, future implications) that the character lacks.
  3.  **Semantic Effect:** The character's words, while perfectly valid at Level 1, *acquire an additional, unintended layer of significance* (Meaning B) when processed through Level 2. Meaning B is generated by the *collision* of the character's utterance with the reader's broader narrative context.
  4.  **Coexistence:** Meaning A (intended) and Meaning B (reader-derived) coexist. Meaning A is not invalidated; Meaning B enhances the thematic or dramatic weight for the reader.

  **Precise Definition:**

  > **Narrative Implication (or Contextual Implication):** A narrative technique where a character's utterance, intended and understood literally within their immediate context (Meaning A), acquires a distinct, additional layer of significance (Meaning B) for the reader due solely to the reader's possession of narrative information (backstory, secrets, foreseen consequences) unknown to the character. Meaning B is generated by the interaction between the utterance and the broader narrative structure, not by the speaker's intent or the immediate conversational context. Both meanings coexist without the second undermining the validity of the first.

  **Why "Narrative Implication"?**

  *   **"Implication":** Captures the idea of something being conveyed beyond the literal meaning.
  *   **"Narrative":** Explicitly anchors the source of the extra meaning in the *constructed story world and the reader's privileged access to it*, distinguishing it from conversational implicature (which is speaker-driven) or dramatic irony (which focuses on character ignorance vs. audience knowledge leading to contradiction/undermining).
  *   **Advantages:**
      *   Highlights the *source* of the extra meaning (the narrative structure/context).
      *   Emphasizes that it's *implied* by the text's totality, not stated.
      *   Avoids the inherent element of contradiction found in "irony."
      *   Clearly distinguishes it from character-driven subtext or implicature.
      *   "Contextual Implication" is also valid, emphasizing the dependency on the larger context.

  **How it Differs Summarized:**

  *   **vs. Dramatic Irony:** DI undermines the character's meaning/perspective; **Narrative Implication** *adds* a layer without negation.
  *   **vs. Implicature:** Conversational Implicature is generated by the speaker's intent within the scene; **Narrative Implication** is generated by the author's design *outside* the scene and perceived only by the reader.
  *   **vs. Subtext:** Subtext originates from the character (conscious or unconscious); **Narrative Implication** originates from the narrative structure and the reader's knowledge.
  *   **vs. Foreshadowing:** Foreshadowing is an *intrinsic* quality of a line *designed* to point forward; **Narrative Implication** gains its foreshadowing power *retrospectively* only *because* the reader already knows the relevant future/secret.
  *   **vs. Authorial Intrusion:** This involves the narrator explicitly telling the reader something; **Narrative Implication** is achieved *implicitly* through the interaction of dialogue and pre-established context.

  **Conclusion:**

  While "Structural Irony" comes closest in established theory, **Narrative Implication** (or **Contextual Implication**) provides a more precise and descriptive term for the specific phenomenon you masterfully employ. It highlights the core mechanism: the *narrative context itself* implying an extra layer of meaning onto a character's otherwise straightforward utterance, creating a rich resonance *for the reader only*, while leaving the character's intended meaning intact. "Retroactive Double Meaning" captures the *effect* well, but "Narrative Implication" better describes the *source* and *mechanism*. Your instinct that this is distinct and worthy of precise naming is absolutely correct. It's a powerful tool for creating depth, tension, and thematic richness without breaking point of view or authorial voice.
