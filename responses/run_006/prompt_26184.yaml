prompt: |-
  I'm trying to work out what I think about moral worth — when an action deserves moral credit or praise, as opposed to merely being the right thing to do. I've been going by my gut on cases, and I'm not sure my verdicts hang together. Here they are:

  (1) A shopkeeper gives a child the correct change. He does it because he knows that shortchanging customers, even children, would damage his reputation and hurt his business. He's honest, but honesty pays. Verdict: his action is right, but it has no moral worth.

  (2) A woman visits her elderly mother every week. She does it entirely out of love and affection — it genuinely makes her happy to see her mother, and the thought of not going never crosses her mind. She isn't acting from a sense of duty; she just wants to. Verdict: her action has moral worth, and plenty of it.

  (3) A man also visits his elderly mother every week, but he finds it draining and unpleasant. He does it solely because he believes he owes it to her — it's his duty. Verdict: his action has moral worth.

  (4) A lawyer takes on a pro bono case. His primary reason is that it will generate good press for his firm. He also genuinely cares about the client's situation, but if there were no press benefit he wouldn't have taken the case. Verdict: his action has little to no moral worth — the self-interested motive seems to crowd out the moral one.

  (5) A different lawyer takes on the same kind of pro bono case. Her primary reason is that she cares about the client. She's also aware it will look good for the firm, and she'd be lying if she said that played no role at all. But she would have taken the case even without the press benefit. Verdict: her action has moral worth, maybe slightly diminished by the mixed motive but still substantial.

  (6) A man returns a lost wallet to its owner. He does it because he believes there's a reward posted for its return. There is in fact no reward — the poster he saw was for a different wallet. Verdict: no moral worth. He was trying to earn a reward, not to help the owner.

  (7) Huck Finn helps Jim escape from slavery. Huck believes, sincerely and painfully, that he is doing something wrong — that he is stealing property and will go to hell for it. He does it anyway because he can't bring himself to betray his friend. Verdict: his action has moral worth. In fact it seems to have more moral worth than if he had helped Jim while confidently believing slavery was wrong — there's something about the cost to his conscience that makes it especially admirable.

  (8) A donor gives a large sum to an effective charity. She does it because she wants to help strangers in need. But she also knows herself well enough to admit that if helping strangers didn't give her a warm glow, she probably wouldn't do it. Verdict: I'm genuinely stuck on this one. Part of me says the warm glow doesn't undermine the moral worth — it's not like she's doing it for a tax break or social approval. Another part says that if the feeling is what ultimately motivates her, then her action isn't really about the strangers at all.

  Is there a principle — or a small set of candidate principles — that captures these verdicts? Which of my verdicts, if any, does the principle force me to abandon? And what does it say about case (8) and about other cases I haven't thought of?
reasoning: |-
  Okay, the user is trying to figure out their thoughts on moral worth. They've listed eight different scenarios and their initial verdicts on whether each action has moral worth. The key question is whether there's a unifying principle behind these judgments. Let me start by understanding each case.

  First, in case (1), the shopkeeper acts out of self-interest. The user says no moral worth here. That makes sense because his motivation is profit, not honesty. Then in (2), the woman visits her mom out of love, and the user thinks it has moral worth. But why? Kant would argue that acting from inclination alone lacks moral worth, but the user disagrees here. So maybe the user values genuine care, even without duty.

  Case (3) is the man visiting his mother out of duty despite it being unpleasant. The user attributes moral worth, which aligns with Kant. But case (2) also has worth without duty, so the user might not be strictly Kantian. Case (4) and (5) involve mixed motives. The user gives little moral worth when self-interest is primary, but some when moral concern is primary even with secondary self-interest. Motive hierarchy matters.

  Case (6) is clear: seeking a reward, no moral worth. Case (7), Huck Finn, is interesting. He acts against his conscience but out of friendship. The user sees more moral worth here because of the internal conflict. This suggests overcoming personal costs adds value. Case (8) is tricky. The donor helps others but also for the warm glow. The user is stuck because the warm glow isn't selfish like tax breaks, but it's still self-regarding.

  Looking for patterns, the user seems to prioritize motivation. Actions driven by self-interest lack worth, while those from duty, love, or care have worth. Mixed motives reduce but don't eliminate worth if moral reasons are primary. The warm glow in case (8) is ambiguous. Is it selfish? If the donor wouldn't act without it, then maybe it undermines moral worth. But if the glow is a byproduct, it might not. The user needs to decide if the warm glow is a necessary condition for the action or just a side effect.

  Another angle: moral worth requires the action to be done for its own sake. In case (8), if the donor acts to help others, the warm glow might be incidental. But if she's motivated by the feeling itself, then it's self-serving. The user's hesitation shows the complexity of internal motivations. 

  Also, the Huck Finn case suggests that acting against one's perceived moral duty for a deeper human connection adds worth. This points to empathy or relationship as a core value. So maybe the user's principle combines motivation (for the right reasons) and overcoming personal costs. 

  The user might need to refine their view on whether emotions like love (case 2) or empathy (Huck) are sufficient, or if duty must be present. Cases 2 and 3 both have worth, so both are valid sources. The challenge is case 8, where the warm glow is a self-regarding feeling. If the donor wouldn't donate without the glow, then it's instrumental, reducing moral worth. But if she would still donate, the glow is just a bonus. The user needs to assess the dependency of the action on the feeling.

  In conclusion, the user's underlying principle could be: Moral worth depends on the primary motivation being other-regarding (duty, care, love) rather than self-interest. Secondary motives can diminish but not negate worth if primary is moral. Overcoming personal struggle enhances worth. For case 8, if the warm glow is essential, moral worth is low; if incidental, it's still present.
answer: |-
  Your intuitions reveal a coherent pattern focused on **motivation and the locus of value**. The core principle unifying your judgments is:

  **An action has moral worth to the extent that its *primary motivating reason* is grounded in the inherent moral value of the act itself or its consequences for others, rather than in self-interest or external rewards. Moral worth increases when acting requires overcoming significant personal cost (e.g., contrary inclination, personal sacrifice, or moral conflict).**

  Let's break this down with your cases:

  1.  **Shopkeeper:** Primary motive = Self-interest (profit). No inherent moral reason. **Verdict upheld.**
  2.  **Woman visits mother:** Primary motive = Love (intrinsic moral value in caring for others). No self-interest needed. **Verdict upheld.**
  3.  **Man visits mother:** Primary motive = Duty (inherent moral reason). Overcomes contrary inclination (drain/unpleasantness), *enhancing* worth. **Verdict upheld.**
  4.  **1st Pro Bono Lawyer:** Primary motive = Self-interest (press). Moral concern exists but is *subordinate* and insufficient alone. Self-interest "crowds out" moral motive. **Verdict upheld.**
  5.  **2nd Pro Bono Lawyer:** Primary motive = Moral concern (client's welfare). Self-interest (press) is secondary and doesn't override the moral reason. Worth is slightly diminished but substantial. **Verdict upheld.**
  6.  **Lost Wallet:** Primary motive = Self-interest (reward). No inherent moral reason. **Verdict upheld.**
  7.  **Huck Finn:** Primary motive = Friendship/Loyalty (intrinsic moral value). Overcomes *massive* personal cost (profound moral conflict, fear of damnation). This struggle *significantly enhances* the worth. **Verdict upheld (and explained).**
  8.  **Charity Donor (Your Sticking Point):** Primary motive = To help strangers (inherent moral value). The "warm glow" is a *consequence* or *byproduct*, not the primary reason. Crucially, *she would still act without the glow* (it's not the *condition* for action). The glow is a natural psychological response, not self-interest driving the choice. **Verdict (by this principle): The action HAS moral worth.** The warm glow doesn't negate the other-directed motivation; it's a feeling *resulting from* acting morally, not the *reason for* acting.

  **How the Principle Resolves Case (8):**
  *   Her *primary reason* is "to help strangers in need" – this is the inherent moral value.
  *   The warm glow is a *hedonic consequence* she anticipates/experiences, but it's not cited as the *reason why* she helps. She helps *because* she wants to help strangers.
  *   The "if helping didn't give her a warm glow, she probably wouldn't do it" is a *hypothetical counterfactual about motivation*, not her actual motivation structure. Her actual motivation *is* the desire to help. The counterfactual suggests the warm glow might be a *necessary psychological condition* for her *to be motivated* to help strangers, *but it doesn't become her primary reason for acting*. The *object* of her intention is still helping others. This is distinct from cases (4) and (6) where the self-interest (press, reward) is the explicit *reason for choosing the act*.
  *   **Analogy:** Imagine someone saying, "I eat broccoli because it's healthy, but if it didn't taste good, I probably wouldn't." The primary reason is health. The agreeable taste is a condition enabling the choice, not the reason itself. Similarly, the warm glow enables her to be motivated by the moral reason.

  **Candidate Principles Refined:**
  1.  **Primary Motivation Principle:** Moral worth depends on the *primary motivating reason* being the recognition of the act's inherent moral value (e.g., duty, compassion, justice, love) or its good consequences for others.
  2.  **Self-Interest Exclusion:** Moral worth is absent or diminished when the primary motive is self-interest (gain, reward, reputation, avoiding punishment) or external coercion.
  3.  **Cost/Struggle Enhancement:** Moral worth is amplified when acting on the moral motive requires overcoming significant personal cost, contrary inclination, perceived duty-conflict, or sacrifice. (This explains your Huck Finn verdict).
  4.  **Mixed Motives:** When motives are mixed:
      *   Moral worth is preserved if the primary motive is moral.
      *   Moral worth is diminished if the primary motive is self-interested, even if a moral motive is present.
      *   Moral worth is negated if the primary motive is self-interested and the moral motive is absent or insufficient.

  **What Might Need Reconsideration? (Minor Tensions)**
  *   **Case 2 vs. Kant:** Your verdict on Case 2 (love-driven action has full worth) explicitly *rejects* a strict Kantian view (which reserves moral worth *only* for duty acting *against* inclination). Your principle embraces love/affection as a valid *primary moral motivation*. This is consistent with many virtue ethics or sentimentalist views.
  *   **Case 8 Clarity:** The principle forces a clear verdict on Case 8 (has moral worth). If you feel strongly that the warm glow *does* undermine worth, you might need to refine the principle to address the *role of anticipated feelings as motivators* more strictly. However, this risks undermining Case 2 (where the woman likely gets happiness from visiting, but that happiness isn't seen as undermining worth).

  **Predictions for New Cases:**
  *   **Tax Break Donor:** Primary motive = Tax break (self-interest). Verdict: **No moral worth** (like Case 4/6).
  *   **Dutiful but Joyful Visitor:** Visits mother solely from duty, but unexpectedly finds joy in it. Primary motive = Duty. Verdict: **Full moral worth** (like Case 3). The joy is a welcome consequence, not the motive.
  *   **Reluctant but Loving Helper:** Helps a friend move solely because they love them, but finds it incredibly arduous and unpleasant. Primary motive = Love. Overcomes significant cost. Verdict: **High moral worth** (combines elements of Cases 2 & 3, enhanced by struggle).
  *   **Accidental Do-Gooder:** Intends to trip a rival but accidentally saves them from being hit by a bus. Primary motive = Malice. Verdict: **No moral worth** (despite good outcome; like Case 6).
  *   **Social Approval Seeker:** Volunteers primarily to impress others. Verdict: **No/little moral worth** (self-interest primary, like Cases 1, 4, 6).

  **Conclusion:** Your intuitions are remarkably consistent! They point towards a motivation-centric view of moral worth that values actions primarily motivated by concern for others or moral principle (whether through duty, love, or compassion), especially when acting requires personal cost. Self-interest as the primary motive negates worth. The warm glow in Case (8) is best understood as a byproduct enabling motivation, not the primary reason, so your principle dictates it **has moral worth**. If this clashes with your intuition, delve deeper into *why* the warm glow feels problematic – is it seen as making the act *instrumental* to her own feeling? If so, the principle might need adjustment to emphasize acting *for the sake of the other* purely.
