prompt: |-
  I'm trying to get clear on my own moral views about the doing/allowing distinction, and I'd like you to work through this with me. Below are my verdicts on a set of cases. I want to know: is there a coherent principle—or a small set of candidate principles—that captures all or most of these verdicts? If no single principle gets them all, which verdict would you overturn, and why? And what does the best principle you can articulate predict about a case I haven't listed?

  Here are the cases and my verdicts:

  1. **Switch.** A runaway trolley is heading toward five people who will be killed. You can pull a lever to divert the trolley onto a side track where one person is trapped. I think pulling the lever is permissible. (But I also think the person on the side track would have grounds to resent it, if they survived.)

  2. **Transplant.** A surgeon has five patients who will die without organ transplants. A healthy traveler comes in for a checkup. The surgeon could kill the traveler and harvest his organs, saving the five. I think this is impermissible—and not just because of bad downstream effects if we institutionalized it. Even in a one-off case with no further consequences, I think it's wrong.

  3. **Withdrawal.** A competent, terminally ill patient in severe pain, with no prospect of recovery, asks her doctor to remove the ventilator keeping her alive. The doctor does so, and the patient dies. I think this is permissible.

  4. **Lethal injection.** The same patient, in the same circumstances, asks her doctor to administer a lethal injection instead. I find myself thinking this is also permissible, though I'm less confident than in the withdrawal case. But I also feel there's a real difference between the two—the injection feels more like the doctor killing the patient, while withdrawal feels more like letting the disease take its course. I'm not sure whether this difference should matter.

  5. **Shallow pond.** You're walking past a shallow pond and see a child drowning. You could easily wade in and save the child, but doing so would ruin your expensive shoes and make you late for work. I think you are obligated to save the child, and failing to do so is seriously wrong—on a par with harming someone, not merely a failure of generosity.

  6. **Unreleased drug.** A pharmaceutical company has already manufactured a drug that could save the lives of a thousand people in a poor country. It decides not to release the drug because it can't turn a profit on it. The people die. I think the company acts wrongly, and the wrong is serious—it's not just a failure of charity.

  7. **Factory not built.** A pharmaceutical company considers building a factory to produce a drug for a rare disease that kills about a hundred people a year. It decides not to build the factory, because the investment would never pay off. The people who would have been saved die. I think this is not seriously wrong—it's not morally equivalent to the unreleased-drug case, even though the outcome is the same. But I'm not sure I can articulate why.

  8. **Bombing raid.** A military commander orders a bombing raid on a legitimate military target, knowing that the raid will kill fifty civilians in a nearby residential area as a foreseeable side effect. The raid succeeds in its military objective. I think the commander's action is permissible, but only if the military objective is genuinely weighty and the civilian deaths are proportionate and unavoidable.

  9. **Famine relief withheld.** The same commander is in a position to air-drop food to starving civilians in a region his forces control after a conflict. The air-drop would cost his military resources and carry some risk to his personnel, but it would save roughly the same number of civilian lives as were lost in the bombing raid. He decides not to do it, prioritizing other military objectives. I think this is less bad than the bombing raid—maybe even permissible—even though the number of civilian deaths is the same. But I'm unsettled about this.

  10. **Poisoned well (unintentional).** A factory owner buries a container of toxic chemicals on his property, reasonably believing it will never leak. Decades later, the container corrodes and the chemicals seep into the town's water supply, causing a dozen deaths. I think the factory owner bears some responsibility—he should have anticipated the risk—but I don't think he's guilty of murder or anything close to it. It feels more like negligence than like killing.

  11. **Poisoned well (intentional).** The same factory owner buries the same container, but he knows it will leak within a year and hopes the town will be driven off the land so he can buy it cheaply. The leak happens, and a dozen people die. I think this is murder.

  I recognize that some of these verdicts are in tension. The switch and the transplant seem to pull in opposite directions. The withdrawal and the lethal injection feel different but I'm not sure I can justify the difference. The unreleased-drug case and the factory-not-built case are identical in outcome but I judge them very differently. The bombing raid and the famine relief withheld also seem to pull apart.

  What I want from you: articulate the best principle—or small set of candidate principles—that captures these verdicts. State the principle precisely. For each case, say whether the principle delivers my verdict, and if it doesn't, say so honestly. Then apply the principle to a case I haven't listed—one that you think is a hard test for the principle, or one that reveals something I haven't noticed about my own views. Finally, if you had to overturn one of my verdicts to make the overall picture more coherent, which one would you overturn, and why?

  Also: please tell me which argument or consideration would most likely change your mind about the principle you end up proposing—not just a minor tweak, but something that would make you abandon it for a different principle entirely. And where in your reasoning are you least confident?
reasoning: |-
  Okay, the user is exploring their moral intuitions around the doing/allowing distinction, presenting 11 cases with their verdicts and asking for a coherent principle that captures most of them. They recognize tensions in their judgments—like permitting the trolley lever pull but forbidding the organ transplant, or differing on the unreleased drug versus factory not built despite identical outcomes. 

  First, I need to map their core intuitions. Their judgments suggest:  
  - Strong aversion to direct harm (Transplant, intentional Poisoned Well)  
  - Acceptance of indirect harm as side effects (Switch, Bombing)  
  - Permissibility of allowing death in medical contexts (Withdrawal/Lethal Injection)  
  - Asymmetric negative duties (Shallow Pond obligates aid, Famine Relief doesn’t equally obligate)  
  - Outcome equivalence isn’t decisive (Unreleased Drug vs. Factory Not Built)  
  - Intent matters (Poisoned Well cases)

  The Doctrine of Double Effect (DDE) seems promising here—it distinguishes intended vs. foreseen harm and direct vs. indirect causation. Let me test it against their cases:  
  - **Switch**: Foreseen harm, indirect (lever redirects threat), permissible—fits.  
  - **Transplant**: Directly intends death, impermissible—fits.  
  - **Withdrawal**: Allows disease to kill, no intent—fits permissibility, but…  
  - **Lethal Injection**: Directly causes death. Wait, they permit it? That’s a tension. DDE might forbid this unless we argue intent is pain relief (but they’re unsure).  
  - **Shallow Pond**: Allowing death isn’t intended, but DDE doesn’t easily explain why it’s *obligatory*.  

  Hmm, DDE alone struggles with the asymmetry in aid cases. Adding a negative/positive duty distinction helps:  
  - Negative duties (don’t harm) are stricter than positive duties (aid).  
  - **Unreleased Drug**: Withholding existing aid feels like violating a positive duty? But they judge it as seriously wrong—stronger than typical charity.  
  - **Factory Not Built**: No existing duty to create new aid systems? That explains the difference.  

  But **Famine Relief** complicates this: withholding aid seems less bad than bombing, even with same lives lost. DDE + negative duties explains bombing as *inflicting* harm vs. famine as *not aiding*—so asymmetry makes sense.  

  Biggest tension: **Lethal Injection**. They permit it but feel uneasy. If DDE forbids directly causing death, this breaks. But perhaps intent to respect autonomy/relieve suffering overrides? Or maybe it’s conceptually allowing death if the disease is the real threat? I’d need to reframe it.  

  For a test case: **Terror Bomber vs. Strategic Bomber**. Terror bomber *aims* at civilians; strategic bomber hits military target with foreseen civilian deaths. They’d likely condemn the former but permit the latter—consistent with DDE’s intent criterion.  

  If I had to overturn one verdict: **Unreleased Drug**. Calling it "seriously wrong" conflates negative/positive duties. If it’s merely failing to aid, it shouldn’t be equated with killing—but their intuition is strong. Maybe they’re implicitly seeing it as "withholding what’s owed"?  

  Where I’m least confident: Medical cases. If lethal injection is permissible, does that collapse the doing/allowing distinction? Or is the context of consent/autonomy doing the heavy lifting? This could unravel DDE if pushed.  

  What would change my mind? If they argued that *all* inaction with identical outcomes to action is equally wrong (e.g., "not building factory = killing"), I’d need a fundamentally consequentialist approach. But their Factory verdict rejects that.  

  Key insight: Their intuitions track moral responsibility more than outcomes—intent, directness, and duties frame their judgments. The "unreleased drug" case might be the outlier where emotional salience (existing drug) overrides principle.
answer: |-
  Based on your verdicts, your moral intuitions align closely with a **modified Doctrine of Double Effect (DDE) combined with a strong negative/positive duty distinction**. Here’s the best-fitting principle:  

  ### **The Proposed Principle**  
  > **An action is permissible if:**  
  > (1) The *intended* effect is good or neutral;  
  > (2) The bad effect (e.g., death/harm) is *foreseen* but *not intended*;  
  > (3) The bad effect is not a *means* to the good effect; and  
  > (4) **Negative duties** (not to harm) are *stricter* than **positive duties** (to aid), *unless*:  
  >   - (a) The agent has a *special responsibility* (e.g., doctor, parent), or  
  >   - (b) The cost of aiding is *minimal* (Shallow Pond).  
  >   
  > **Additionally:**  
  > - **Directness matters**: Directly causing harm is worse than allowing harm.  
  > - **Intent matters**: Deliberate harm is worse than negligent/foreseen harm.  

  ---

  ### **Analysis of Your Cases**  
  | **Case**               | **Your Verdict** | **Principle’s Verdict** | **Match?** | **Key Reasoning** |  
  |------------------------|------------------|--------------------------|------------|-------------------|  
  | **1. Switch**          | Permissible      | ✅ Permissible           | Yes        | Harm not intended; redirects existing threat (DDE). |  
  | **2. Transplant**      | Impermissible    | ✅ Impermissible         | Yes        | Harm *intended* as means (violates DDE). |  
  | **3. Withdrawal**      | Permissible      | ✅ Permissible           | Yes        | Allowing death (not causing); intent is respecting autonomy. |  
  | **4. Lethal Injection**| Permissible      | ❓ **Tension**           | Partial    | *Directly* causes death, but intent is relief (DDE ambiguous). Principle *initially forbids* but can be stretched via intent/autonomy. |  
  | **5. Shallow Pond**    | Obligatory       | ✅ Obligatory            | Yes        | Minimal cost to fulfill positive duty (4b). |  
  | **6. Unreleased Drug** | Seriously wrong  | ✅ Wrong                 | Yes        | Special responsibility + minimal cost to aid (4a). |  
  | **7. Factory Not Built**| Not seriously wrong | ✅ Permissible       | Yes        | No *existing* duty to create new aid systems (positive duty weaker). |  
  | **8. Bombing Raid**    | Permissible (if proportionate) | ✅ Permissible | Yes | Civilian deaths foreseen but unintended (DDE). |  
  | **9. Famine Relief**   | Less bad / Permissible | ✅ Permissible     | Yes        | Failing to aid (positive duty) less strict than *causing* harm. |  
  | **10. Poisoned Well (Unint.)** | Negligence     | ✅ Negligence            | Yes        | Foreseen risk but no intent; indirect harm. |  
  | **11. Poisoned Well (Int.)** | Murder       | ✅ Murder                | Yes        | Harm directly intended. |  

  **Tensions Explained**:  
  - **Lethal Injection (Case 4)**: Your intuition conflicts with DDE’s prohibition on *directly* causing death. But consent/autonomy may override this, aligning with your verdict.  
  - **Unreleased Drug vs. Factory (Cases 6–7)**: The difference hinges on *existing resources* (duty to use) vs. *creating* resources (no duty).  
  - **Bombing vs. Famine (Cases 8–9)**: Bombing *causes* harm (stricter duty), while famine is *not aiding* (weaker duty).  

  ---

  ### **Test Case: Terror Bomber vs. Strategic Bomber**  
  - **Scenario**: A bomber pilot must destroy a factory. **Terror Bomber** kills civilians to demoralize the enemy (intends deaths). **Strategic Bomber** kills civilians as a side effect of hitting the factory (foreseen but unintended).  
  - **Principle’s Prediction**: Terror Bomber is impermissible (intends harm); Strategic Bomber is permissible (foreseen harm, DDE).  
  - **Likely Match?** Probably yes—your Bombing Raid verdict (Case 8) suggests you accept unintended harm.  

  ---

  ### **Which Verdict to Overturn?**  
  **Overturn *Unreleased Drug* (Case 6)**:  
  - **Why?** It’s the outlier. Your principle treats *positive duties* (to aid) as weaker unless costs are minimal (Shallow Pond) or responsibility exists. But manufacturing a drug creates no *pre-existing* obligation (unlike saving a drowning child). If the company never made the drug, it’s like *Factory Not Built*—permissible. Calling it "seriously wrong" conflates *withholding aid* with *harming*.  
  - **Result**: Coherence. Cases 6 and 7 become symmetric: neither is seriously wrong.  

  **Alternative**: Overturn *Lethal Injection* to forbid direct killing, but your autonomy intuition is strong.  

  ---

  ### **Limits and Weaknesses**  
  1. **What Would Change My Mind?**  
     - If you argued that *allowing death* (e.g., famine relief) is **equally wrong** as *causing death* (bombing) when outcomes are identical, your view would align with consequentialism—forcing overhaul.  
     - If you rejected DDE in **Switch** (calling it murder), a strict "no-harm" principle (e.g., deontology) would fit better.  

  2. **Where I’m Least Confident**:  
     - **Medical Cases (Withdrawal vs. Injection)**: Your intuition that withdrawal is "letting die" while injection is "killing" is defensible, but hard to square with permissibility for both. If lethal injection is truly permissible, DDE needs heavy qualification (e.g., "intent to relieve suffering overrides directness").  
     - **Intent vs. Foresight**: In borderline cases (e.g., *Bombing Raid*), the line between "intended" and "foreseen" can blur.  

  ---

  ### **Refinement of the Principle**  
  For maximal fit, add:  
  > **Clarification for Medical Contexts**:  
  > - Causing death is permissible *if*:  
  >   (a) The patient autonomously consents;  
  >   (b) Death is inevitable and imminent;  
  >   (c) The *primary intent* is relief (not death).  
  > This justifies *Lethal Injection* while preserving DDE elsewhere.  

  This captures your verdicts, explains tensions (e.g., medical cases vs. Transplant), and retains moral coherence. If you reject this, we might need to abandon deontological distinctions entirely for consequentialism—but your verdicts (e.g., Transplant vs. Switch) suggest you won’t.  

  Would you like to test a new case or refine the principle further?
