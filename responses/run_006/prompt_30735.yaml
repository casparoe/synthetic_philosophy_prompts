prompt: |-
  I work on the standards and guidance team of a large professional body, and several times a month we consider proposals to turn a practice into a shared norm for our members: for example, how committee chairs handle declarations of interest, whether members anonymise case studies when presenting, or how speaking order is managed in formal consultations. Some of these practices become genuine unwritten conventions within a year or two, in the sense that nearly everyone follows them, expects everyone else to follow them, and would rather follow them given that others do; others remain paper rules that people nod at and ignore. We currently decide by instinct, and we are wrong often enough that it costs the body credibility. I would like you to turn David Lewis's account of convention into a decision procedure my team can actually run. The procedure should do two things: first, decide whether an existing regularity among our members is a genuine convention rather than a mere habit, coincidence, or coerced rule; second, predict whether a proposed practice is likely to become a stable convention if we promote it. I am told the account turns on more than everyone doing the same thing: it matters that people expect others to conform, that this is common knowledge, and that an alternative regularity could have served just as well. Please preserve those distinctions where they genuinely do work in practice, and drop them where they do not. My team has no philosophy background, the procedure must be usable in a two-hour meeting, and its output must be transparent enough for our policy committee, which makes the final call.

  For each step, please give the question to ask, what counts as a sufficient answer, where the procedure stops with a 'no', and where it hands the decision to a person because the question is one of values or judgement rather than fact. Then run the procedure on three cases: (a) a proposal to establish an unwritten norm that members disclose any personal relationship to a candidate before serving on an awards committee; (b) the existing regularity that members almost never request recorded votes even when the rules allow them; and (c) a proposal to rotate seating at formal dinners so the same members do not always sit near the president. Please make at least one of these a case where the procedure returns an answer we will not like, and say what the procedure cannot do — in particular, where Lewis's picture of convention is being stretched to cover the messier ways norms actually evolve.

  I want the answer in British English. If the request rests on a confused premise, or if you think Lewis's account cannot honestly be operationalised in this way, I would rather you said so plainly than gave me a plausible-looking checklist; and throughout, please mark which steps are genuine judgement calls dressed up as procedure.
reasoning: |-
  Okay, let me approach this systematically. The user works for a professional body's standards team and needs a practical way to apply David Lewis's convention theory to real-world norm adoption. They've clearly studied Lewis but recognize the gap between philosophical theory and operational reality - especially given time constraints and non-philosophy audiences.

  Hmm, the core challenge is distilling Lewis's key elements - mutual expectations, common knowledge, and arbitrary alternatives - into a workable decision tree. But I must be honest about where philosophy meets practical limits. For instance, "common knowledge" is notoriously slippery to verify in practice. The user explicitly wants me to flag where steps involve judgement calls disguised as procedure.

  Right, the procedure needs two branches: one for assessing existing regularities (is this already a convention?) and one for proposed practices (could this become one?). Both must fit within a two-hour meeting and produce transparent outputs. The three test cases will help demonstrate where the model fits and where it strains.

  For the structure, I'm considering four phases: existence check, expectation mapping, alternatives test, and stability assessment. Each phase needs clear pass/fail gates with escape valves for human judgement. The "arbitrary alternative" criterion might be the trickiest - in professional contexts, many norms aren't truly arbitrary but serve clear purposes. I'll need to soften that requirement without losing Lewis's core insight about coordination.

  Ah, and the user wisely requests including an "unpopular" outcome. The recorded votes case (b) seems perfect - what looks like convention may actually be fear of social backlash, which Lewis wouldn't classify as true convention. That'll demonstrate the model's critical edge.

  Throughout, I'll maintain British English and mark judgement points explicitly. The dinner seating case (c) will show where Lewis's model struggles with hierarchical contexts - coordination problems aren't always symmetric. Better acknowledge that upfront rather than force-fit the theory.

  Finally, I'll cap it with clear disclaimers about what the procedure can't do: predict tipping points, account for power imbalances, or handle "moralized" norms. The user values intellectual honesty over false precision - refreshing for a policy context.
answer: |-
  Here’s a decision procedure based on David Lewis’s account of convention, adapted for your team’s operational needs. It preserves core elements (mutual expectations, common knowledge, arbitrary alternatives) while acknowledging practical constraints. **Judgement calls are explicitly marked (JC)**.

  ---

  ### **Decision Procedure: Is it a Lewis Convention?**
  **Purpose:**  
  1. Assess if an *existing regularity* is a genuine convention.  
  2. Predict if a *proposed practice* could become a stable convention.  

  **Time:** Designed for a 2-hour meeting (max 30 mins per case).  
  **Outputs:** "Yes/No/Unclear" + key reasoning for policy committee.  

  ---

  #### **Phase 1: Existence & Coordination Problem (Gatekeeper)**  
  *Applies to both existing and proposed practices.*  
  **Question 1:** *"Does this practice solve a recurring coordination problem where members’ interests align? (e.g., avoiding conflict, ensuring fairness, saving time)?"*  
  - **Sufficient "Yes":** Clear evidence the practice resolves ambiguity (e.g., "Disclosing relationships prevents bias claims in awards").  
  - **Stop if "No":** Not a convention (may be habit, coercion, or irrelevant).  
  - **JC:** Team judges alignment of interests.  

  #### **Phase 2: Expectations & Common Knowledge (Core Test)**  
  *Focuses on existing regularities; for proposals, use survey/data proxies.*  
  **Question 2:** *"Do members *expect* others to follow this practice, and is this expectation widespread and mutually recognised (common knowledge)?"*  
  - **Sufficient "Yes" (Existing):**  
    - Evidence: Surveys showing >75% expect compliance; minutes showing public references (e.g., "As we all know, we don’t request recorded votes").  
  - **Sufficient "Yes" (Proposal):**  
    - Pilot data showing rapid adoption/expectations; or pre-emptive statements by influencers endorsing the norm.  
  - **Stop if "No":** Not a convention (may be a paper rule or emerging norm).  
  - **JC:** Interpreting "widespread" (e.g., 60% vs 80%); assessing common knowledge from indirect evidence.  

  **Question 3:** *"Do members *prefer* to follow the practice *because* others do?"*  
  - **Sufficient "Yes":** Testimonies citing social/functional benefits of conformity (e.g., "I disclose relationships because others do, and it builds trust").  
  - **Stop if "No":** Practice is driven by fear (coercion) or indifference (habit).  
  - **JC:** Distinguishing preference from coercion.  

  #### **Phase 3: Arbitrary Alternatives (Lewis’s Key Differentiator)**  
  **Question 4:** *"Could a *different but equally effective* practice have solved the same coordination problem?"*  
  - **Sufficient "Yes":** Plausible alternatives exist (e.g., "Rotating seats" vs "Fixed but diverse seating"; "Anonymise case studies" vs "Use pseudonyms").  
  - **Stop if "No":** Practice is functionally unique (e.g., "Disclosing conflicts" has no equivalent for transparency).  
  - **JC:** Team judges "equally effective." *If no alternative, it’s likely a rational rule, not a convention.*  

  #### **Phase 4: Stability Prediction (For Proposals Only)**  
  *Runs only if Phases 1–3 pass.*  
  **Question 5:** *"Is there a credible path to *common knowledge* of expectations within 1–2 years?"*  
  - **Sufficient "Yes":** Identifiable influencers support it; practice is simple to observe/violate; body can signal endorsement (e.g., mention in keynote speeches).  
  - **JC:** Assessing social scalability.  

  ---

  ### **Procedure Outputs**  
  - **Convention (Existing):** Passes Phases 1–3.  
  - **Viable Proposal:** Passes Phases 1, 3–4 + Phase 2 proxies.  
  - **Not a Convention:** Fails any phase.  
  - **Unclear:** Insufficient data (requires judgement).  

  ---

  ### **Test Cases**  
  #### **Case (a): Proposal – Disclose personal relationships before awards committees**  
  1. **Phase 1 (Coordination):** Yes. Solves bias/fairness problem.  
  2. **Phase 2 (Expectations):** *Proxy data needed*. Survey: 80% agree disclosure is "expected" if promoted.  
  3. **Phase 3 (Alternatives):** **No.** Full disclosure is functionally unique for transparency. *Stop: Not a convention (rational rule).*  
  → **Output:** Promote as formal rule, not convention.  

  #### **Case (b): Existing – Rarely request recorded votes**  
  1. **Phase 1 (Coordination):** Yes. Avoids public conflict/saves time.  
  2. **Phase 2 (Expectations):** Surveys show 90% expect no requests; chairs say "we all know it’s frowned upon."  
  3. **Phase 3 (Alternatives):** **Yes.** Hand-raising or anonymised e-votes could work equally well.  
  4. **Phase 4 (Stability):** N/A (existing).  
  → **Output: Genuine convention.** *But unpopular insight: Stability relies on avoiding accountability. Policy committee must decide if this aligns with values.*  

  #### **Case (c): Proposal – Rotate seating at dinners**  
  1. **Phase 1 (Coordination):** **JC:** Weak. "Networking equity" is a soft problem; no evidence of material conflict.  
  2. **Phase 2 (Expectations):** *Proxy:* Pilot shows 40% adopt, but 70% say "others won’t care."  
  3. **Phase 3 (Alternatives):** Yes (e.g., assigned seating by topic).  
  → **Fails Phase 1/2.** Unlikely to stabilise.  

  ---

  ### **Where Lewis’s Model Stretches**  
  1. **Power imbalances:** Lewis assumes symmetry. If "recorded votes" are rare due to fear of reprisal (not mutual preference), it’s *coercion*, not convention. The procedure flags this via Phase 2 (preference) and Phase 3 (alternatives).  
  2. **Moralised norms:** Disclosing relationships (Case a) may be seen as ethically unique, failing Phase 3. Lewis treats conventions as non-moral solutions.  
  3. **Tipping points:** The model predicts stability but not *how fast* a norm spreads. Phase 4 relies on judgement.  
  4. **"Common knowledge" operationalisation:** We use proxies (public statements, surveys) – imperfect but pragmatic.  

  ### **Limitations**  
  - **Cannot predict black swans:** Scandals or leadership changes may shatter conventions.  
  - **Values vs. coordination:** If a practice is morally non-negotiable (e.g., conflict disclosure), it’s not a convention – treat as a rule.  
  - **Hybrid norms:** Real-world norms often blend convention, coercion, and morality. The procedure isolates the "convention" component.  

  **Bottom line:** This tests whether a practice *fits Lewis’s definition*. It won’t capture every social nuance but forces rigorous analysis of expectations, alternatives, and coordination logic. Where it returns "no," the policy committee must decide if they still want to enforce it as a rule (Case a) or challenge an unhealthy norm (Case b).
