prompt: |-
  I serve on the ethics committee of a residential addiction treatment center. We are considering whether to offer "Ulysses contracts" to patients at intake. The proposal is this: a patient, during the intake process when they are sober and have been evaluated as having decision-making capacity, may sign a binding agreement stipulating that if they later demand to leave against medical advice during a period of acute craving or withdrawal, that demand will not be honored for a window of 72 hours. During that window, the clinical team would work to stabilize them; at the end of the 72 hours, if the patient still wants to leave, they may do so. The patient would be fully informed of the mechanism in advance, and no one would be enrolled without their explicit consent.

  The committee is split. One faction argues that the contract honors the patient's autonomy by giving effect to the preference of the "sober self" — the self that set a long-term goal of recovery and knew, in advance, that craving would temporarily hijack their decision-making. On this view, refusing to honor the advance directive would actually be the paternalistic move, because it would let a transient state override a settled, reflective commitment. The other faction argues that autonomy means the right to decide at each moment, and that holding a person against their contemporaneous expressed will is a violation regardless of what they signed earlier. They worry about a slippery slope: if we can discount someone's current wishes because we judge them "impaired by craving," what stops us from discounting any decision we disagree with?

  Underneath this is a deeper question about personal identity and rationality across time. The case for Ulysses contracts often draws on the idea that hyperbolic discounting — the tendency to steeply discount future rewards in favor of immediate ones — creates a kind of fracture within the agent: the preferences of the person at t₁ and the person at t₂ are so radically different that we are almost dealing with two different agents bargaining with each other. The contract is then a way for the long-run self to bind the impulsive future self, much as Ulysses bound himself to the mast. But the critics on our committee reject this framing: they say a person is a single agent across time, and the craving self is not a different person — it is the same person in a different state, whose wishes carry equal authority.

  Please draft the short written opinion I will circulate before our next meeting. It should recommend a concrete course of action — adopt the policy, reject it, or adopt it with specific safeguards — and it should engage seriously with the strongest argument on the losing side. The document needs to be something our clinical director, our legal counsel, and the rest of the committee can act on.
reasoning: |-
  Okay, the user serves on an ethics committee for an addiction treatment center and is grappling with whether to implement Ulysses contracts. These contracts would allow patients to pre-commit to staying for 72 hours if they later try to leave against medical advice during acute craving or withdrawal. The committee is split between viewing this as respecting autonomy through advance directives versus violating present-moment autonomy.

  Hmm, this is a profound ethical dilemma with valid arguments on both sides. The autonomy conflict is real - is the "sober self's" advance directive more authentic than the "craving self's" immediate demand? The hyperbolic discounting theory suggests these are almost different selves, but critics argue it's one continuous person. There are also practical concerns about slippery slopes in impairment judgments.

  The user needs a decisive recommendation for clinical implementation. They'll need something that satisfies both ethical principles and operational realities. The clinical director will care about treatment efficacy, legal counsel about liability, and committee members about philosophical consistency. 

  I should propose a middle path - approving the contracts but with robust safeguards. The recommendation must acknowledge the critics' strongest point: that overriding current refusal feels coercive regardless of prior consent. The slippery slope concern is legitimate too - we must prevent staff from overusing "impairment" judgments.

  Key safeguards would include: rigorous capacity assessment at intake, requiring witnessed consent with cooling-off periods, documenting craving's specific impairment, creating clear behavioral criteria for activation (not just staff disagreement), limiting contract duration, ensuring therapeutic engagement during holds, and building in automatic reassessments. The 72-hour window seems clinically appropriate - long enough for stabilization but not indefinite containment.

  Most importantly, the policy must frame this not as punishment but as medical care honoring the patient's own recovery goals. The written opinion should emphasize that without such contracts, many patients lose their chance at recovery when craving overpowers their deepest values. That's the core ethical argument - preventing self-sabotage during temporary vulnerability isn't paternalism; it's fidelity to the person's enduring autonomy.
answer: |-
  ## Recommendation: Adopt Ulysses Contract Policy with Robust Safeguards

  **To:** Ethics Committee Members, Clinical Director, Legal Counsel  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Ulysses Contracts for Patient Retention During Acute Cravings

  The Ethics Committee proposes adopting a policy allowing Ulysses contracts for voluntary patients at intake, **subject to the critical safeguards outlined below.** This approach best balances the core ethical principles of autonomy, beneficence, and non-maleficence in the specific context of addiction treatment, while directly addressing valid concerns raised.

  **Core Recommendation:** Implement a structured Ulysses contract mechanism. A patient, assessed as having decision-making capacity during a sober intake, may voluntarily sign an agreement stipulating that if they demand discharge against medical advice (AMA) *during a period of objectively documented acute craving or withdrawal significantly impairing decision-making*, that demand will not be honored for a strictly limited 72-hour stabilization period. After 72 hours, the patient's discharge request must be honored immediately, regardless of clinical opinion.

  **Rationale: Honoring the Enduring Self & Promoting Recovery:**
  *   **Respecting Pre-Commitment Autonomy:** Addiction involves a well-documented phenomenon of "hyperbolic discounting" and "preference reversal" during craving states. The sober self, capable of long-term planning and valuing recovery, is rationally overwhelmed by the acute craving self's demand for immediate relief/use. The Ulysses contract gives effect to the patient's own enduring, reflective values and goals expressed when capable – the self that actively sought treatment. Denying them this tool undermines their autonomy by prioritizing a transient, pathology-driven state over their chosen life path.
  *   **Preventing Self-Sabotage:** AMA discharge during peak craving is a common, devastating outcome. This contract provides a crucial window for clinical intervention (medical stabilization, craving management, motivational engagement) to help the patient regain equilibrium and reconsider, potentially saving them from immediate harm and loss of treatment opportunity. It prevents a fleeting impulse from derailing a deeply desired recovery goal.
  *   **Consistency with Medical Ethics:** Advance directives are widely accepted in medicine (e.g., DNR orders, psychiatric advance directives) to honor patient wishes when future decision-making capacity may be impaired. This is an analogous application for a specific, time-limited impairment inherent to the disease being treated.

  **Engaging the Strongest Counter-Argument: The Primacy of Present-Moment Autonomy & Slippery Slope Concerns:**
  The most compelling opposing argument asserts that overriding a patient's *current* expressed wish to leave, regardless of prior consent, is an unacceptable violation of autonomy and bodily integrity. It posits that the "craving self" is not a separate agent but the *same person* in a distressed state, whose contemporaneous refusal must be paramount. Furthermore, critics rightly warn of a slippery slope: if "impairment by craving" justifies overriding refusal, what prevents staff from using this label broadly to detain any patient whose decision they clinically disagree with?

  **Serious Response & Mitigation via Safeguards:**
  1.  **This argument correctly identifies the core tension.** Respecting present refusal is a fundamental principle. However, in the *specific pathology* of addiction, the craving state demonstrably and predictably impairs the capacity to make decisions aligned with one's own deeply held values and long-term well-being. It is not mere disagreement; it is a recognized symptom of the disease that compromises rational decision-making specifically regarding treatment continuation/use.
  2.  **The slippery slope is a legitimate concern.** To prevent misuse and protect against arbitrary judgments of "impairment," the policy **must** incorporate strict, objective safeguards:

      *   **Rigorous Capacity Assessment at Intake:** A standardized, documented assessment (e.g., MacCAT-T or equivalent, plus clinical interview) confirming decisional capacity specifically regarding the contract's nature, consequences, and voluntary nature *must* be completed *before* signing. This is non-negotiable.
      *   **Explicit, Informed Consent Process:** Consent must involve a dedicated session (separate from general intake) using plain language. It must explicitly detail:
          *   The *only* trigger: AMA request during *acute, objectively documented craving/withdrawal causing significant decision-making impairment*.
          *   The *strict* 72-hour limit.
          *   The process during the hold (intensified clinical support).
          *   The absolute right to leave after 72 hours.
          *   The voluntary nature and right to decline the contract without affecting other care.
      *   **Mandatory Cooling-Off Period:** Require a minimum period (e.g., 12-24 hours) between the detailed explanation and the signing of the contract, allowing for reflection and discussion.
      *   **Objective Trigger Criteria:** Activation requires *both* an AMA request *and* contemporaneous, documented clinical evidence of acute craving/withdrawal *and* a specific assessment concluding this state significantly impairs the patient's capacity to make a reasoned decision about discharge *at that moment*. This must be documented objectively (e.g., validated craving scales, withdrawal scales like CIWA/COWS, behavioral observation notes).
      *   **Independent Review Mechanism:** Activation of the contract requires immediate review and concurrence by a designated senior clinician *not* directly involved in the patient's care (e.g., Medical Director, designated senior therapist) within 1 hour of the AMA request, using the documented evidence of impairment.
      *   **Strict 72-Hour Limit:** The hold expires precisely 72 hours after the documented AMA request triggering it. No extensions are permitted. Discharge must occur immediately upon patient request at that time.
      *   **Therapeutic Engagement Mandate:** The 72 hours *must* involve active, intensified clinical efforts focused on stabilization, craving reduction, motivational interviewing, and reassessing treatment goals – not passive containment.
      *   **Regular Reassessment:** The patient's capacity and desire to leave must be formally reassessed at least every 12 hours during the hold.
      *   **Clear Documentation & Audit Trail:** Every step (intake capacity, consent process, triggering event, evidence of impairment, independent review, hold activities, reassessments, discharge) must be meticulously documented in the medical record.
      *   **Periodic Policy Review:** The committee will review utilization, outcomes, and any complaints related to the policy annually.

  **Conclusion:**
  The Ulysses contract, implemented with these stringent safeguards, is an ethically defensible and clinically valuable tool. It respects the patient's autonomous choice to protect their future self from a known vulnerability inherent in their disease, while minimizing the risks of coercion and misuse through rigorous procedural protections. It acknowledges the profound impact of craving on autonomy without dismissing the personhood of the suffering individual. The safeguards directly address the valid concerns about overriding present refusal and the slippery slope, ensuring the mechanism is used narrowly, objectively, and solely for its intended purpose: to give the patient's enduring self a fighting chance against the acute hijacking of craving.

  **Recommended Motion:** Approve the implementation of the Ulysses contract policy as described, contingent upon the development and inclusion of the detailed safeguards specified above, to be finalized and reviewed by Legal Counsel and the Ethics Committee before rollout.
