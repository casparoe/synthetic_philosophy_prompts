prompt: |-
  I'm a graduate student TA for an undergraduate course on rationality and practical reason. Next week I'm leading a fifty-minute discussion section on Kavka's toxin puzzle. The students will have read the paper, but in my experience most come away thinking it's a cute trick and miss what's philosophically at stake. Don't explain the puzzle to me; plan how I should teach it. I need the order in which the components must be introduced — what conceptual piece has to be in place before the puzzle even bites — and the one worked example or variant that should carry the whole session. I also need a map of the misconceptions students predictably bring or form: confusing intending with predicting one's own future behavior, thinking the puzzle is just about weakness of will, treating an intention as a mental state you can voluntarily adopt at will, and so on. For each, tell me where in the sequence I should head it off and how. Finally, give me a check for understanding I can use in the last three minutes to see whether they've grasped the core issue rather than just retelling the story. End with a one-sentence summary of the session's takeaway, formatted as \answer{...}.
reasoning: |-
  We are teaching Kavka's toxin puzzle. The key is to set up the conceptual pieces in the right order so that the philosophical bite is felt. We must avoid the students dismissing it as a trick.

  Core Philosophical Issue: The puzzle challenges the idea that intentions are merely beliefs about one's future actions (as in the belief-desire model) and highlights the problem of forming an intention solely for instrumental reasons when the action itself is not desirable. It also questions whether rationality can require us to form intentions that we know we won't carry out.

  Order of Introduction:

  1. **The Setup: The Toxin Puzzle Scenario (5 minutes)**
     - Briefly state the scenario without getting into the details of the argument. The puzzle: An eccentric billionaire offers you a deal. If you form the intention tonight to drink a mildly harmful toxin tomorrow, then he will deposit $1 million in your bank account tonight. The catch: you get the money regardless of whether you actually drink the toxin tomorrow. The only condition is that you form the intention tonight. The toxin will make you sick for a day, but no long-term harm.
     - Ask: Would you drink the toxin? (Most will say no, because why suffer if you already have the money?) But then the billionaire can see that you don't form the intention? How can you form the intention if you know you won't drink it? And if you don't form the intention, you don't get the money.

  2. **Clarify the Concepts (10 minutes)**
     - **Intention**: What is an intention? It is a commitment to act. It is not just a prediction (I think I will do X) or a desire (I want to do X). It involves a plan and a commitment to carry it out.
     - **The Challenge**: The puzzle asks whether you can form the intention to drink the toxin when you know that once you have the money, you have no reason to drink it (and every reason not to). The problem is that forming the intention seems to require that you believe you will drink it, but you know you won't.

  3. **The Core Problem: The Link Between Intention and Action (10 minutes)**
     - Explain that the puzzle reveals a tension in the standard belief-desire model of rationality. In that model, we act because we have a desire for an outcome and a belief that the action will bring it about. But here, forming the intention is what brings about the outcome (getting the money), not the action. The action (drinking the toxin) is actually counterproductive once the intention is formed and the money is in the bank.
     - So, can you form the intention? If you try to form it, you realize that you will not drink the toxin, so you cannot sincerely form the intention. But if you don't form it, you don't get the money.

  4. **Worked Example / Variant to Carry the Session (15 minutes)**
     - Use a variant that makes the issue more relatable: **The Exam Study Pact**.
       - Scenario: You and a friend make a pact to study for an exam together at 8 AM tomorrow. You both know that if you both show up, you'll study effectively. But if one doesn't show, the other will waste time waiting. You also know that each of you would rather sleep in if the other is going to sleep in. The pact is made the night before. Now, you must form the intention to go. But if you think your friend won't go, you'd rather not go. And if you think your friend will go, then you might be tempted to sleep in because you know your friend will be there anyway? But if you sleep in, your friend might do the same. How can you form the intention to go?
     - Compare to the toxin puzzle: Forming the intention to go is what you need to do to get your friend to go (if they are in the same situation). But once you both have formed the intention, each has an incentive to defect. However, if you don't form the intention, the pact fails. The key is that in this case, the intention formation is interdependent and the action (going) is costly (losing sleep) with no direct reward if the other doesn't go. But note: the reward (effective study) only happens if both go. This variant helps them see that the problem is about the rationality of forming an intention when the action is not desirable in itself and the intention is only instrumentally valuable.

  5. **Addressing Misconceptions (Throughout, but especially during the clarification and core problem sections)**
     - **Misconception 1: Confusing intending with predicting.**
       - When: During the clarification of intention (step 2).
       - How: Emphasize that an intention is not just a prediction. You can predict that you won't drink the toxin, but that doesn't mean you intend not to drink it. Conversely, if you intend to drink it, that should come with a commitment. But the puzzle shows that you cannot form that commitment because you know you will break it.
     - **Misconception 2: Thinking the puzzle is just about weakness of will.**
       - When: When discussing the core problem (step 3) and the variant (step 4).
       - How: Explain that weakness of will is when you form an intention but fail to act because of temptation. Here, the problem is prior: you cannot even form the intention because you know you will not act. It's about the formation of intention, not the failure to act on it.
     - **Misconception 3: Treating intention as a mental state you can voluntarily adopt at will.**
       - When: During the clarification of intention (step 2) and the core problem (step 3).
       - How: Ask: Can you just decide to intend to drink the toxin? If you know you won't do it, then you are trying to form an intention that you know is insincere. Intentions are not like beliefs that can be adopted arbitrarily; they must be based on reasons. And the reasons for forming the intention (to get the money) are not reasons for the action (drinking the toxin) because the money is already secured by the formation of the intention.

  6. **Check for Understanding (Last 3 minutes)**
     - Pose a question: "Suppose a student says, 'I can get the money by just deciding to drink the toxin, and then I don't have to drink it.' What's wrong with this response?"
     - Look for: The student should recognize that you cannot sincerely decide (intend) to drink the toxin if you already plan not to do it. The intention requires that you are committed to drinking it, but you know you won't be committed when the time comes because you have no reason to drink it. Thus, you cannot form the intention.

  7. **One-Sentence Takeaway**
     - \answer{Kavka's toxin puzzle reveals that forming an intention for instrumental reasons is impossible when the intended action lacks independent justification and the intention itself is not under direct voluntary control.}

  Timing Breakdown:
  - Setup: 5 min
  - Clarify Concepts: 10 min
  - Core Problem: 10 min
  - Worked Example/Variant: 15 min (including discussion)
  - Addressing Misconceptions: integrated throughout, but 5 min explicitly if needed
  - Check for Understanding: 3 min
  - Wrap-up: 2 min (for takeaway and concluding remarks)

  Note: Be flexible and engage with student responses. Use the variant to draw parallels and make the abstract puzzle concrete.
answer: |-
  ### Teaching Plan for Kavka's Toxin Puzzle Discussion Section  
  **Goal:** Ensure students grasp the philosophical stakes—how the puzzle challenges standard models of rationality, intention, and agency—rather than seeing it as a mere "trick."  

  #### Order of Introduction (Total: 50 minutes)  
  1. **Grounding in Rational Choice Theory (5 minutes)**  
     - **Why start here?** Students must first recognize the "belief-desire" model of rationality to see why the puzzle bites. Without this, the tension is invisible.  
     - **What to do:** Briefly define the model: Rational actions require (1) a *desire* for an outcome and (2) a *belief* that the action achieves it. Ask: "How do we usually explain intentional actions, like studying for an exam?" (Elicit examples linking desires/beliefs to actions).  
     - **Head off misconceptions:** Preemptively clarify that intentions *are not* just predictions or wishes—they involve commitment.  

  2. **Introduce the Toxin Puzzle Scenario (5 minutes)**  
     - **Why now?** The puzzle relies on the belief-desire model to create tension. Present it neutrally:  
       > *"A billionaire pays you $1M tonight if you form the sincere intention at 8 PM to drink a harmless-but-sickening toxin tomorrow. You only need to form the intention—not drink it. The toxin causes no lasting harm, but drinking it is pointless once you have the money."*  
     - **Ask:** "What would you do? Would you form the intention?" (Let students vote/share gut reactions). Most will say "no"—use this to highlight the surface-level intuition.  

  3. **Isolate the Core Tension: Instrumental Intentions vs. Action Incentives (10 minutes)**  
     - **Why this sequence?** Students must see that forming the intention is *instrumentally rational* (it gets $1M), but drinking the toxin is *practically irrational* (no benefit, only cost).  
     - **Worked example (carries the session): The "Charity Pledge" variant.**  
       > *"You pledge to donate $1,000 to charity if you intend to run a marathon next month. The pledge is binding once you form the intention. Running the marathon is painful and costly—you’d avoid it if possible. Can you form the intention to run? Why or why not?"*  
     - **Discuss:**  
       - Incentive to *form* intention: Get the pledge money to charity.  
       - Disincentive to *act*: Once pledged, running gains nothing (charity already funded).  
       - **Parallel to toxin:** Both cases show intention-formation is profitable, but the intended action is irrational to perform.  

  4. **Philosophical Stakes: Why Can’t You Form the Intention? (15 minutes)**  
     - **Focus:** The impossibility of "bootstrapping" an intention without rational action-motives.  
     - **Key questions:**  
       - "Can you form a sincere intention if you *know* you won’t follow through?" (No—intentions require commitment).  
       - "Is intention-formation voluntary, like flipping a switch?" (No—it’s constrained by reasons).  
     - **Use variant:** In the charity case, ask: "If you pledge, do you *truly* intend to run? Or are you lying to yourself?"  

  5. **Address Predictable Misconceptions (Integrated throughout, but emphasize here)**  
     - **Misconception 1: "Intending is just predicting my future behavior."**  
       - **When to address:** During Step 1 (Grounding) and Step 4 (Stakes).  
       - **How:** Contrast "I predict I won’t drink" (epistemic) vs. "I intend not to drink" (commitment). Ask: "Can you intend to do something while believing you won’t? (No—intentions imply belief in action).  
     - **Misconception 2: "This is just weakness of will."**  
       - **When to address:** During Step 3 (Core Tension) and Step 4 (Stakes).  
       - **How:** Distinguish: Weakness of will violates an *existing* intention (e.g., skipping gym despite intending to go). Here, the issue is forming the intention *at all*. Say: "The puzzle isn’t about failing to act—it’s about failing to even commit."  
     - **Misconception 3: "I can voluntarily decide to intend anything."**  
       - **When to address:** During Step 4 (Stakes).  
       - **How:** Argue intentions require *reasons for action*. Ask: "Can you intend to flap your arms and fly to the moon? Why not?" (No—no belief it’s possible). Similarly, toxin-drinking lacks *practical* reasons once paid.  

  6. **Synthesis: What the Puzzle Reveals (5 minutes)**  
     - Recap: Rationality may demand forming intentions instrumentally (to get $1M), but intentions must be "action-guiding"—they collapse if the action lacks independent justification.  
     - **Bigger picture:** Challenges reduction of rationality to belief-desire psychology. Maybe intentions are irreducible, or rationality includes "planning" beyond moment-by-maximizing.  

  #### Check for Understanding (Final 3 minutes)  
  - **Question:** "Imagine a student says: ‘I’d get the money by *pretending* to intend to drink the toxin. The billionaire can’t read my mind!’ What’s wrong with this response?"  
    - **Look for:**  
      - Core issue: Sincere intention ≠ pretense. You can’t "fake" an intention to yourself—intentions are first-personal commitments. If you know you won’t drink, you cannot sincerely intend to.  
      - **If they miss it:** Clarify: "Can you *deceive yourself*? If you ‘pretend,’ are you forming the intention?"  

  #### One-Sentence Takeaway  
  \answer{Kavka's toxin puzzle exposes the paradox of forming instrumentally rational intentions when the intended action lacks intrinsic or future-directed justification, challenging the belief-desire model of agency.}  

  **Timing Buffer:** Allow 5 minutes for flexible discussion. If students fixate on "trick" solutions (e.g., "Just drink the toxin!"), redirect to philosophy: "But is drinking rational? And can you intend it knowing it’s irrational?"
