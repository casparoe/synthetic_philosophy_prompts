prompt: |-
  I retired from physics a few years ago and have been reading my way through philosophy of probability—Lewis, Hájek, that crowd. The Principal Principle seemed straightforward when I first read it: roughly, your credence in a proposition, conditional on its objective chance being x, ought to be x, provided you don't have "inadmissible" evidence. But I've been testing my own intuitions against a bunch of cases and I can't find a clean statement of what makes evidence inadmissible that gets all of them right. I'd like you to take my verdicts and tell me what principle—what account of admissibility—captures them, or which ones I have to give up.

  Here are the cases. Case one: I know a coin is fair, I'm about to flip it, the objective chance of heads is one half, and my credence should be one half. Fine. Case two: the coin was flipped an hour ago in another room, I haven't seen the result, the chance was one half at the time of flipping, and my credence should still be one half. The fact that the outcome is already settled doesn't seem to matter. Case three: same setup, but I've been given a reliable crystal ball glimpse of the coin showing heads. The chance is one half, but my credence should be near one. The crystal ball information is inadmissible, and that feels right. Case four: I'm about to flip the coin, but I've just watched it land heads on the last hundred flips. The chance according to the setup is still one half—the coin is fair by construction, let's say I built it myself and tested it exhaustively. But having seen a hundred heads in a row, I'd put my credence above one half. I'm not sure whether this means I think the chance isn't really one half (maybe I've been deceived about the setup), or whether I think the streak is inadmissible evidence, or whether I'm just violating the principle. Case five: I know the chance of a radiactive atom decaying in the next hour is one half. I set up a detector and leave the room. While I'm out of the room, before the hour is up, my credence that it will decay is one half. After the hour is up but before I check the detector, my credence is still one half—even though the decay either happened or didn't. This seems right, and it seems like the same thing as case two. But now case six: I'm told by a perfectly reliable oracle that the atom will not decay. The chance is one half, but my credence drops to zero. The oracle is like the crystal ball: inadmissible. But what's the difference between the oracle (inadmissible) and the mere fact that the hour has passed (admissible)? Both give me information about what actually happens, but only one seems to undermine the chance. Case seven: I'm told that the objective chance of some event E is 0.7, but I'm also told that if the chance is 0.7, then the laws of nature plus the present state of the world entail that E does not happen. This is the undermining future case. I honestly don't know what to say. If the laws entail not-E, can the chance really be 0.7? But if I accept the chance claim, must my credence be 0.7? I feel like something has to break here.

  So those are my verdicts—or confusions, in the last case. I want a principle that tells me, for any body of evidence E, whether E is admissible relative to a chance proposition. State the principle clearly, show how it handles each case, tell me which of my verdicts it can't accommodate (and whether I should revise them), and apply it to a case I haven't listed: I know the chance of heads is one half, but I also know that the coin is one of ten that were all flipped simultaneously, and nine of them have already been revealed as heads. What's my credence about the tenth, and why?

  And please don't format it like a textbook—just continuous prose, like you're writing me a letter. No headings, no bullet points, no tables.
reasoning: |-
  Okay, let me try to unpack this. The user retired from physics and is diving deep into the philosophy of probability, specifically the Principal Principle and admissibility. They've laid out several thought experiments where their intuitions clash with clean formulations of admissibility. Their core struggle is pinpointing why some evidence (like crystal balls) undermines chance while other evidence (like knowing the outcome is settled but unseen) doesn't. 

  First, I notice they're wrestling with the tension between metaphysical determinism and epistemic uncertainty. Cases 2 and 5 show they accept that settled-but-unknown outcomes shouldn't affect credence, while cases 3 and 6 highlight that direct "future-telling" evidence does. The real puzzle seems to be drawing that line—why is one type of information about the future "admissible" while another isn't? 

  Their hundred-flips case (4) is particularly telling. As a physicist, they'd know frequentist intuitions scream "something's wrong!" even if the coin is "fair by construction." This suggests their intuition leans toward evidence about actual frequencies trumping theoretical chances—or at least demanding a belief update. But is that incompatible with the Principal Principle? Maybe not, if we interpret "chance" as dynamically responsive to patterns (like a propensity shifting after strange streaks), but they explicitly state the chance remains 1/2. So they're torn between trusting the setup and trusting the data. 

  The radioactive atom cases reveal another layer. They intuitively distinguish between two ways of knowing an outcome: passive time-elapse (admissible) vs active oracle-revelation (inadmissible). Yet both convey "what happens." The difference seems procedural—whether the evidence reveals the outcome *through chance's own causal pathway*. Time passing lets chance "do its work"; the oracle bypasses it. 

  The undermining future (case 7) is the knife-edge. If laws + state entail ~E, can chance(E)=0.7? Their physics background might make them balk—how can indeterminism coexist with entailment? This hints they need a Humean account where chances supervene on patterns, making undermining possible. But then credence gets messy: should they believe the chance *despite* knowing it leads to contradiction? 

  For the ten-coins case, their answer will expose whether they treat frequency data as admissible. If nine heads make them boost credence for the tenth, they're treating partial outcomes as relevant to individual chances—which clashes with strict Principal Principle unless they reinterpret "chance." 

  Ultimately, they want a unified admissibility criterion. The historical route (evidence about events before or during chance setup) works for most cases but not hundred-flips. The "no better predictor" route handles oracles but struggles with frequencies. Their physicist's desire for tidy principles is butting against philosophy's messy edge cases. Maybe they need to accept that "chance" isn't a single concept—or that admissibility depends on one's theory of chance. 

  ...But if I had to pick, I'd defend the historical account and suggest revising verdicts 4 and 10-coins: those streaks *are* admissible because they're part of the chance's causal history. The hundred heads *shouldn't* shift credence if the setup is truly known. That preserves the Principal Principle's elegance, even if it feels counterintuitive. The alternative—letting frequencies override chances—collapses objective chance into evidential probability.
answer: |-
  Ah, the Principal Principle and the slippery beast of admissibility! Your cases perfectly capture why it's so tricky. Lewis himself acknowledged it was the "least satisfactory" part. Based on your intuitions (which largely align with common philosophical wrestling), let me propose a principle and see how it fares. I'll call it the **Temporal and Causal History Account of Admissibility**:

  **The Principle:** Evidence E is admissible with respect to a proposition X about the objective chance (Ch) of an outcome A at time t, *if and only if* E contains no information about whether A occurs that is not:
  1.  Already entailed by the complete physical history of the world up to and including time t (H_t), *or*
  2.  Entailed by the proposition specifying the chance Ch itself (which often includes laws supervening on H_t), *or*
  3.  Information solely about the occurrence of events causally *downstream* from A itself (after t), provided this downstream information doesn't reveal anything about the causal chain *leading to* A at t.

  **The Core Intuition:** Admissible evidence is restricted to:
  *   **How the setup was:** The complete physical state *before and at* the moment the chance process occurs (H_t).
  *   **What the chances are:** The proposition specifying Ch, which, depending on your metaphysics of chance (Humean vs. Non-Humean), may or may not be fully determined by H_t.
  *   **Consequences, not causes:** What happens *after* A is settled, but *only* if knowing it doesn't tell you anything about *how* A came to be (i.e., it doesn't give you a "back door" to information about the pre-t state or the chance process itself).

  **Applying it to Your Cases:**

  1.  **Fair Coin Flip (Pre-Flip):** You know H_t (the setup: fair coin about to be flipped) and Ch(Heads) = 0.5. No inadmissible evidence. Credence = 0.5. **✓**
  2.  **Flipped Coin (Outcome Settled, Unseen):** You know H_t (including the flip happening an hour ago). Ch(Heads) *at the time of flipping t* was 0.5. Your current evidence tells you the outcome is settled but doesn't tell you *what* it is or anything about the causal history *at t*. It only tells you about the *post-t* state (the coin landed *somehow*). This is downstream consequence (type 3 evidence), admissible. Credence = 0.5. **✓** (Matches your verdict).
  3.  **Crystal Ball:** The glimpse directly tells you the outcome A (Heads). This is *not* entailed by H_t (the setup before seeing) or Ch. It *is* information about A itself, not just a downstream consequence. It bypasses the chance process entirely. **Inadmissible.** Credence ≈ 1. **✓** (Matches your verdict).
  4.  **Hundred Heads Streak:** This is the tough one for your intuition. You know H_t (the current setup, including the coin's fairness and imminent flip) and Ch(Heads) = 0.5 *now*. But you *also* know the *past history* (H_prev) of the last 100 flips. Crucially, H_prev *is part of the complete physical history of the world leading up to t* (H_t). On the strict Temporal and Causal History Account, evidence about H_prev *is admissible* because it's part of H_t. Therefore, your credence *should* still be 0.5. But you feel it shouldn't be.
      *   **Conflict:** Your intuition suggests the streak *is* inadmissible, or that Ch isn't *really* 0.5. The principle says it's admissible evidence about the history, so credence should remain 0.5.
      *   **Resolution Required:** You likely need to **revise this verdict** to match the principle. Your unease stems from conflating *evidential* probability (which *should* be high after 100 heads) with *objective chance* (which, by your stipulation, remains 0.5 for *this* flip). The Principal Principle links credence to *objective chance*, not directly to past frequencies, *unless* the chance itself is defined by them (Humeanism). If you're certain the chance *now* is 0.5 despite the past, the principle demands credence 0.5. Your intuition might be leaning towards a Humean view where the chance *isn't* 0.5 anymore, or you're treating the past frequency as *evidential* in a way that overrides the chance claim.
  5.  **Atom Pre-Decay & Post-Decay (Unseen):** Analogous to Case 2. Pre-decay: Know H_t (atom undecayed, chance setup) and Ch(Decay) = 0.5. Credence = 0.5 **✓**. Post-hour/unseen: Know H_t (setup complete at t), Ch(Decay at t) = 0.5 then. Current evidence only says decay happened or didn't (post-t state), a downstream consequence. Admissible. Credence = 0.5. **✓** (Matches your verdict).
  6.  **Oracle (Atom Won't Decay):** Directly tells you the outcome A (No Decay). Not entailed by H_t or Ch. Bypasses the chance process. **Inadmissible.** Credence = 0. **✓** (Matches your verdict).
  7.  **Undermining Future:** This exposes a deep tension, especially for Humean views (where chances supervene on the entire history, including the future). You know Ch(E) = 0.7. But you also know that H_t & Laws entail ~E. This creates a contradiction *if* the laws/chances are fixed by H_t + the *entire* future (which includes E not happening).
      *   **The Problem:** The evidence "H_t & Laws entail ~E" seems like it *should* be admissible (it's about laws and H_t). But conditional on Ch(E)=0.7 *and* H_t & Laws entailing ~E, what should your credence in E be? 0.7 (per PP) or 0 (per entailment)? They can't both be true if the laws/chances are determined by the pattern including the future.
      *   **Principle's Handling:** It depends on the metaphysics. If chances/laws are non-Humean (fixed independently), then the evidence "H_t & Laws entail ~E" might be admissible, forcing credence to 0, meaning you *cannot* rationally believe *both* Ch(E)=0.7 *and* that H_t & Laws entail ~E – one must be false. If chances are Humean, the proposition "Ch(E)=0.7" *logically implies* that E *does* occur in some futures consistent with H_t, making "H_t & Laws entail ~E" *incompatible* with "Ch(E)=0.7". You can't conditionalize on both simultaneously. The principle flags this as a case where the chance proposition and the historical/law information are incompatible – the PP doesn't apply because the condition "Ch(E)=0.7" cannot hold if the laws+H_t entail ~E under Humeanism. **Something breaks.** Your confusion is warranted; it's a known problem (Lewis's "big bad bug") often resolved by modifying the PP (e.g., New Principle) or accepting the incompatibility.

  **Your Tenth Coin Case:**

  *   **Setup:** You know the chance of heads for *each* coin (flipped simultaneously) is 0.5. You know nine specific coins (not the tenth) landed heads. What's your credence for the tenth coin being heads?
  *   **Analysis via Principle:** The evidence includes:
      *   H_t: The complete setup *at the time of flipping* (including all coins being flipped fairly and simultaneously). This includes the *propensity* of each coin.
      *   Ch(Heads_i) = 0.5 for each coin i (including the tenth).
      *   Evidence about the outcomes of the *other nine* coins.
  *   **Admissibility:** The outcomes of the other nine coins are *events that happened after the flipping setup was complete*. Do they reveal anything about the *causal history leading to the tenth flip*? Arguably, no. The flips were simultaneous and independent. Knowing Coin 1 landed heads doesn't causally influence or reveal anything about the state of Coin 10 *at the moment of its flip*. It's purely a downstream consequence *of the other flips*. Under condition (3) of the principle, this seems **admissible**.
  *   **Credence:** Therefore, conditional on Ch(Heads_10) = 0.5 and this admissible evidence, your credence in Heads_10 should be 0.5.
  *   **But... Intuition Again:** This feels wrong! Knowing 9/10 are heads *screams* that something fishy might be going on – maybe the coins aren't independent, or not all fair. But you stipulated you *know* they are independent and each has Ch=0.5. If you *truly, know that*, then the credence *should* be 0.5. Your intuition that it should be higher is likely because you don't *fully* believe the independence or the chance claim in the face of this striking frequency. You're treating the frequency as *evidence against* the chance/independence claim itself. But if those claims are held fixed as *part* of your background knowledge (H_t and Ch), the frequency of the other coins is admissible *for the tenth coin's outcome*, and the PP prescribes credence 0.5.

  **The Takeaway:**

  The **Temporal and Causal History Account** captures most of your core intuitions (Cases 1, 2, 3, 5, 6) and provides a framework for the confusing ones (4, 7, 10). The cost is that you likely need to **revise your verdicts on Case 4 (Hundred Heads) and the Tenth Coin case.** In both, your intuition to raise credence stems from using the frequency evidence *as evidence against the truth of the chance proposition itself*, rather than conditioning on the chance proposition *being true*. The PP demands the latter. Case 7 highlights a fundamental metaphysical problem that no simple admissibility criterion can fully resolve without deeper adjustments to the principle or the metaphysics of chance.

  This principle emphasizes the *causal isolation* of the chance setup at time t. Evidence is inadmissible only if it gives you a "peek" at the outcome A itself or information about the pre-t state beyond what's in H_t/Ch, *except* for information solely about the later consequences of A. It's not perfect, but it draws a line that respects the core idea: chances guide rational belief about their outcomes, *unless* you have a direct line to the answer or secret knowledge of the setup that contradicts the chance claim. Keep wrestling with it – that hundred heads streak is a stubborn counterintuitive rock!
