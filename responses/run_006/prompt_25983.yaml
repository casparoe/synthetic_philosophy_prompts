answer: |-
  Here is a comprehensive exam question package on finks, masks, and the conditional analysis of dispositions, designed for an upper-level undergraduate metaphysics seminar.

  ---

  **Exam Question:**

  "The phenomenon of *finks* and *masks* are widely considered fatal counterexamples to the Simple Conditional Analysis (SCA) of dispositions. Critically evaluate whether these two types of counterexamples pose *fundamentally the same kind of problem* for the SCA, or whether they represent *distinct challenges* requiring different theoretical repairs. In your answer, you must:
  1.  Briefly outline the SCA and the core problem each counterexample (finks and masks) presents.
  2.  Precisely analyze the *structural mechanism* by which each counterexample falsifies the SCA’s bi-conditional. What specific flaw in the SCA’s logic or assumptions does each exploit?
  3.  Examine whether a repair strategy that successfully handles finks (e.g., a reformed conditional analysis or an alternative approach) would *automatically* resolve the problem posed by masks, or vice versa. Justify your answer with reasoning or examples.
  4.  Discuss what the persistence of *both* finks and masks as problems, and the potential need for distinct solutions, reveals about the nature of dispositional properties themselves (e.g., concerning intrinsicity, manifestation conditions, or their relationship to categorical bases).
  Avoid mere definitional rehearsal; focus on the comparative structure and implications of the counterexamples."

  *(Suggested time: 45 minutes; Suggested length: 700-800 words)*

  ---

  **Model Answer (Approx. 700 words):**

  The Simple Conditional Analysis (SCA) proposes that an object has a disposition to manifest property M in response to stimulus S iff it is true that if the object were subjected to S, it would manifest M (D(S, M) ↔ (S □→ M)). While intuitively appealing, counterexamples involving *finks* and *masks* have proven devastating. Although both disrupt the SCA’s bi-conditional, they operate through distinct structural mechanisms, exploit different weaknesses, resist uniform repair, and ultimately point towards a more complex ontology of dispositions than the SCA allows.

  A *finkish* disposition (or finkish lack thereof) involves a change in the object’s intrinsic dispositional state precisely *at the moment* the stimulus is applied, triggered by the stimulus itself or a mechanism sensitive to it. C.B. Martin’s archetypal example involves an electro-fink protecting a live wire: the wire is disposed to conduct electricity if touched (it’s live), but the fink *removes* this disposition the instant a conductor (like a hand) touches it, preventing conduction. Here, S (touching) occurs, but M (conducting) does not, falsifying the right-to-left (R→L) implication of the SCA (D(S,M) is true, but S □→ M is false). Crucially, the fink *alters the intrinsic causal basis* of the disposition *simultaneously* with S. The SCA fails because it treats the disposition as a static property whose connection to its manifestation is captured by a single, simple conditional, ignoring the possibility of *dynamic intrinsic change* coincident with S.

  A *mask* (or *antidote*), in contrast, leaves the object’s intrinsic disposition and its causal basis *intact* but *interferes with the manifestation process* after S has occurred. Bird’s example of a fragile glass protected by internal bubble-wrap is paradigmatic: the glass retains its intrinsic fragility (D(S,M) is true). If struck (S), the counterfactual S □→ M is *true* – the glass *would* shatter *if struck* under normal conditions. However, in the actual scenario with the bubble-wrap present, when S occurs (it is struck), M does *not* occur (it doesn’t shatter). This falsifies the left-to-right (L→R) implication of the SCA (D(S,M) is true, S occurs, but M does not occur). The mask exploits the SCA’s failure to account for the presence of *extrinsic interferents* that *prevent the manifestation* despite the disposition being present and the stimulus occurring. The SCA falsely assumes that the simple stimulus-manifestation conditional is sufficient, neglecting the role of *background conditions*.

  The structural differences are clear: Finks work by *removing the disposition* intrinsically *as S is applied* (targeting R→L), while masks work by *blocking the manifestation* extrinsically *after S is applied, while the disposition persists* (targeting L→R). This asymmetry means repairs for one don't automatically handle the other.

  Consider a repair for finks, like Lewis's *Reformed Conditional Analysis* (RCA). The RCA adds that the object must *retain* its intrinsic causal basis B (for D(S,M)) *throughout* a period including the time S would be applied: D(S,M) iff (S □→ M) *and* the object would retain B long enough for S to cause M if S occurred. This handles finks: in the electro-fink case, the wire *would not retain* its charge (B) if touched, so RCA correctly denies D(S,M). However, RCA *does not* resolve masks. The fragile glass with bubble-wrap *does retain* its intrinsic microstructure (B) if struck; the RCA conditional S □→ M remains true (as the glass *would* shatter *if struck without bubble-wrap*). Yet, when struck *with bubble-wrap*, it doesn't shatter. The RCA still suffers the L→R failure facing masks. It addresses dynamic intrinsic change but ignores extrinsic interference.

  Conversely, a repair targeting masks – such as adding a *ceteris paribus* clause ("and nothing interferes") to the SCA conditional – fails for finks. Adding "no masks" ensures that if S occurs and no mask is present, M occurs. This might handle the masked glass case (by making the conditional false when the mask is present). But it doesn't help with finks. In the finked wire case, the simple conditional S □→ M is false (because the disposition vanishes upon touching). Adding "no masks" doesn't change that falsity; the conditional remains false. The core problem of the vanishing disposition (the R→L failure) persists. The mask repair addresses extrinsic blockers but not intrinsic removers.

  The persistence of *both* finks and masks as distinct challenges, demanding different types of repairs, reveals profound aspects of dispositional properties. First, it underscores that dispositions are not merely *defined* by a single counterfactual dependency; they involve a complex underlying *causal basis* (B) whose stability is crucial (highlighted by finks). Second, it demonstrates that dispositions are *intrinsic* properties (masking shows the disposition persists intrinsically even when manifestation is blocked extrinsically). Third, and most significantly, it shows that dispositions are *causal powers* – properties that *tend* to cause manifestations *in virtue of their intrinsic nature*, but whose actual manifestation is contingent on the *absence of interfering conditions*. The manifestation is not guaranteed by the disposition plus stimulus alone; it requires the *completeness of the causal process*. The SCA’s failure lies in oversimplifying this complex reality – reducing a causal power to a bare conditional, ignoring both the dynamic persistence of the power itself (finks) and the context-sensitivity of its exercise (masks). Finks attack the stability of the power, masks attack the reliability of its output. Together, they suggest dispositions are intrinsic, causally potent properties whose relationship to their manifestations is mediated by complex, contingent causal processes.

  ---

  **Marking Scheme (Total: 20 Marks)**

  An A-range answer (16-20 marks) must convincingly make the following five moves:

  1.  **Precise Differentiation of Mechanisms (4 marks):** Clearly and accurately explains the distinct *structural mechanisms* of finks (intrinsic removal of disposition *coincident with S*, causing R→L failure) vs. masks (extrinsic blocking of manifestation *after S* while disposition persists, causing L→R failure). Avoids conflating the two.
      *   *Common Mistake:* Vaguely describing both as "interference" without specifying the crucial difference in *timing* (coincident vs. post-stimulus) and *nature* (intrinsic removal vs. extrinsic blocking) of the interference, or misattributing the type of SCA failure (e.g., saying masks falsify R→L).

  2.  **Analysis of Asymmetric Repairability (5 marks):** Demonstrates convincingly that fixes for one problem do *not* automatically resolve the other. Must use specific examples (e.g., Lewis's RCA handling finks but not masks; a *ceteris paribus* clause handling masks but not finks) and explain *why* the repair fails for the other counterexample based on the structural differences identified in Move 1.
      *   *Common Mistake:* Asserting asymmetry without justification, or providing a vague/unconvincing example. Failing to explicitly link the repair's mechanism to the specific weakness of the other counterexample (e.g., not explaining *why* RCA fails for masks).

  3.  **Explicit Identification of SCA's Flaw per Counterexample (4 marks):** Goes beyond stating the bi-conditional is false to articulate the *specific underlying flaw* each counterexample reveals: Finks expose the SCA's assumption that dispositions are *static properties* insensitive to coincident intrinsic change triggered by S. Masks expose the SCA's assumption that the stimulus-manifestation conditional is *sufficient* and ignores *extrinsic background/enabling conditions* necessary for the manifestation.
      *   *Common Mistake:* Simply restating that the conditional is false without diagnosing the deeper flawed assumption (static property, sufficiency of simple conditional).

  4.  **Insight into Dispositional Nature from Masks (3 marks):** Correctly identifies that the masking case, where the disposition persists intrinsically despite blocked manifestation, strongly supports the view that dispositions are *intrinsic properties* of objects. (Note: This point is most directly shown by masks).
      *   *Common Mistake:* Attributing intrinsicity solely to finks (which involve change) or failing to explicitly state the link between masking and intrinsicity.

  5.  **Synthesis: Implications for Dispositions as Causal Powers (4 marks):** Synthesizes the lessons from both counterexamples to draw a conclusion about the nature of dispositions. Must articulate that dispositions are intrinsic *causal powers* whose manifestation depends on (a) the *stability/persistence* of their causal basis (threatened by finks) and (b) the *completeness of the causal process* (threatened by masks), moving beyond the SCA's simplistic conditional.
      *   *Common Mistake:* Ending with a list of differences without a unifying conclusion about dispositions. Offering a conclusion not strongly supported by the preceding analysis of finks/masks (e.g., jumping to dispositional realism vs. categoricalism without grounding it in the counterexamples' lessons).

  ---
  This package provides a challenging but focused question, a robust model answer demonstrating the required depth and structure, and a clear marking scheme emphasizing critical analysis and synthesis over rote learning, specifically targeting common student misunderstandings. Good luck with the exam!
