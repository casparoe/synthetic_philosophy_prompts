answer: |-
  **The replication crisis stems primarily from systemic incentives favoring novel, positive findings and undisclosed flexibility in research practices, not fundamentally from flaws in NHST; switching to Bayesian methods wouldn't have solved the core problems of publication bias, p-hacking, and researcher degrees of freedom.** While NHST's dichotomous thinking and p-value misinterpretation are genuine weaknesses, the mechanisms driving non-replication operate largely independently of the inferential framework:

  1.  **Publication Bias & The File Drawer:** Journals overwhelmingly publish "positive" results (p < .05 or BF > 3, etc.), regardless of framework. Studies failing to find effects, whether using NHST p-values or Bayes Factors (BF), are systematically buried. This creates a literature dominated by false positives and inflated effect sizes. A Bayesian journal ecosystem would still prioritize novel confirmations over null results or replications. Incentives for career advancement reward publication count and novelty, not truth-seeking – this doesn't change with statistics.

  2.  **P-Hacking & Undisclosed Flexibility:** The core issue is exploiting researcher degrees of freedom *without transparency or pre-specification*. This manifests identically under Bayesian approaches:
      *   **Optional Stopping:** Collecting data until NHST p < .05 is invalid frequentism, but *also* invalidates standard Bayes Factors unless explicitly modeled (e.g., using sequential testing priors). Researchers could just as easily collect data until BF > 10, exploiting the stopping rule flexibility if analyses are not pre-registered and adhered to.
      *   **Undisclosed Flexibility:** Decisions on variable transformation, outlier removal, covariate inclusion, model specification, and analysis pathway are made *after* seeing the data. Under Bayes, this migrates directly to:
          *   **Prior Specification:** While weak priors might seem objective, choices about prior *form* (e.g., Cauchy vs Normal), *width* ("weak" is subjective), and even hierarchical structure offer ample room for tuning. Trying different "weak" priors until a favorable posterior/result is obtained is Bayesian p-hacking. "Vague" priors can be surprisingly influential.
          *   **Model Specification:** Choices about likelihood functions, inclusion of interactions, random effects structures, and handling of missing data are complex and can be explored post-hoc to achieve a desired result (e.g., a credible interval excluding zero or a large BF). Model comparison (e.g., using BIC or Bayes Factors) is highly sensitive to these specification choices.
      The key problem is not the statistic, but the undisclosed exploration of the analysis garden of forking paths. Pre-registration and open materials/code combat this *regardless* of framework. Without them, Bayesian analyses are just as susceptible to hidden flexibility.

  3.  **Researcher Degrees of Freedom Migrate, Not Disappear:** Switching frameworks doesn't eliminate judgment calls; it relocates them. Under NHST, flexibility lies in data handling and analysis choices. Under Bayes, it expands *additionally* to prior justification and complex model building. Justifying a "weakly informative" prior or a specific model hierarchy involves subjective decisions that can be manipulated, consciously or unconsciously, to favor desired outcomes. The lack of consensus on "default" Bayesian approaches for many psychological designs exacerbates this. Researcher degrees of freedom aren't solved by Bayes; they become more nuanced and potentially harder to scrutinize without full transparency.

  **Conclusion:** Fixing the replication crisis requires changing the incentive structure (rewarding replication, pre-registration, open science) and enforcing methodological rigor and transparency (pre-registration, open data/code, detailed reporting standards). While Bayesian methods offer valuable alternatives to NHST, particularly for estimation and evidence quantification *when used rigorously and transparently*, they provide no inherent immunity to the pervasive biases, selective reporting, and undisclosed flexibility that are the true engines of the crisis. The problems are sociological and structural, not merely statistical.
