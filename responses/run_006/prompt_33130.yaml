answer: |-
  You've identified a fascinating and recurrent pattern in moral reasoning—one that straddles epistemology, meta-ethics, and cognitive bias. While no single term perfectly captures *every* facet you describe, the phenomenon aligns closely with **provisionalism** or **boundary essentialism**, though it's best characterized as a specific form of **intuitional deferral**. Below is a breakdown of the concept and its distinctions:

  ### Core Concept: **Promissory Intuitionism**
  This describes the tactic of treating a deeply held intuition (e.g., "compatriots deserve priority") as a *fixed point* that theory must eventually justify, even when its boundary conditions lack principled grounding. The gap in justification is deferred to future theorizing ("a promissory note"), insulating the intuition from critique. Key features:
  - **Asymmetric Burden-Shifting**: The intuition remains authoritative; the failure to explain its boundaries is framed as a *theoretical deficit*, not an intuitional flaw.
  - **Boundary Vagueness as Non-Falsifying**: Fuzzy demarcations (e.g., "Why nation not city?") don’t undermine the core distinction (e.g., "compatriots vs. foreigners").
  - **Directional Rigidity**: Theory must "fit" the intuition (à la *direction of fit* in philosophy of mind), not vice versa.

  ### Why Existing Terms Fall Short:
  1. **Reflective Equilibrium**:  
     Involves mutual adjustment between intuitions and principles. Here, the intuition is *immune* to adjustment—theory bears all the adaptation burden.
     
  2. **Intuitionism (Meta-Ethical)**:  
     Claims moral truths are grasped via intuition. Your focus is *dialectical*: how agents *defend* intuitions when boundaries are challenged, not the epistemology itself.

  3. **Line-Drawing Fallacy (Sorites Paradox)**:  
     While related to boundary vagueness, this fallacy demands precise thresholds (e.g., "How many grains make a heap?"). Your friend isn’t committing this; he’s asserting the distinction *exists* despite vagueness, deferring justification.

  4. **Essentialism**:  
     Close, but typically involves inherent properties (e.g., "human essence"). Here, the "essence" is the *intuition itself*—its boundaries are treated as discoverable facts, not social constructs.

  ### Proposed Names & Distinctions:
  | **Term**               | **Emphasis**                                                                 | **Distinction from Neighbors**                                                                 |
  |------------------------|------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | **Promissory Intuitionism** | Defers justification to future theory; treats intuition as creditworthy.       | Contrasts with *reflective equilibrium* (no mutual adjustment) and *fallibilism* (no doubt).  |
  | **Boundary Essentialism** | Asserts a moral boundary is "real" despite lacking criteria for its location. | Differs from *metaphysical essentialism* by focusing on boundaries, not intrinsic properties. |
  | **Intuitional Imperviousness** | Highlights the intuition's resistance to counter-evidence.                  | Broader than *confirmation bias*; targets boundary-justification gaps specifically.           |

  ### Why This Pattern Persists
  - **Cognitive Comfort**: Moral intuitions often feel self-evident. Admitting boundary arbitrariness threatens the entire distinction (e.g., "If nations are arbitrary, why prioritize citizens?").
  - **Teleological Pressure**: We *want* distinctions like "life begins at conception" or "speech is free but ads aren’t" to be non-arbitrary. This creates motivation to believe a principled boundary *exists*, even if undefined.
  - **Social Reinforcement**: Nationalism, animal ethics, etc., are embedded in practices (e.g., borders, veganism). Challenging boundaries feels like undermining the system.

  ### Countering the Move
  In debate, expose the **asymmetry**:  
  *"If you can’t explain why the boundary is here and not there, what justifies your confidence in the distinction? If theory must serve the intuition, what could ever falsify it?"*  
  This forces acknowledgment that the intuition is functioning as an unmoved mover—a dogmatic premise.

  Your observation reveals a deep tension in moral reasoning: the human need for crisp categories vs. the fuzzy reality of moral landscapes. Naming it **promissory intuitionism** captures both the deferral and the inviolable status accorded to intuition.
