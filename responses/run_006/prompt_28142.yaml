  First, I need to address their opening salvo about contradiction. They point out that when a believer says "Christ rose" and an atheist says "no," it seems like a direct contradiction. But from a Wittgensteinian perspective, that's misleading. The key is to show how these aren't competing factual claims but different language-games. The believer's statement is part of a framework that shapes their entire worldview and practices, while the atheist is operating within an empirical framework. 

