prompt: |-
  I run the animal welfare grantmaking program at a mid-sized foundation, and I'm seeing more and more proposals that lean on the scale argument: because insects are so absurdly numerous, even a low probability that they're sentient can produce an expected welfare impact that swamps everything else in our portfolio. I need something I can actually use, not a seminar. Could you act as a philosopher who works on moral uncertainty and animal ethics, with a practical streak, and turn the scale argument into a decision procedure my team can run? We review maybe fifteen proposals a cycle, just me and one analyst, usually under an hour per proposal before we have to make a preliminary call, and then the full board (mostly farm-animal people already skeptical of insect work) signs off. So the stakes are real money and our credibility with the board. The procedure should be a checklist or a sequence of tests in words: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a no or a not-yet, and where it hands the decision to a person because the question is one of values rather than arithmetic. I want it to actually respect what the scale argument says and what it doesn't — in particular the difference between a genuine expected-value argument with bounded, defensible parameters and a Pascal's-mugging-style trick where the numbers just swamp the probablities. Be honest about where the procedure will misfire, too.

  Then run the procedure on three proposals: (1) Funding the rollout of electrical stunning before processing at a large cricket farm, affecting on the order of a billion crickets a year; the evidence for cricket sentience is real but thin (nociceptor-like structures, some avoidance learning), and our best outside estimate is maybe a low single-digit percent chance of sentience. (2) A campaign to stop a planned broadcast pesticide spraying in a national forest, on the grounds that it would affect trillions of larval insects; the campaign's actual causal effect is uncertain, and even if it succeeds the welfare sign is unclear, since the spraying might kill quickly while the larvae that "win" may starve or be parasitized anyway. (3) A requirement that a black soldier fly larvae facility switch from grinding (near-instant) to freezing (slower, possibly less painful, but nobody is sure) at substantial cost, affecting a few hundred million larvae a year. I'd like at least one of these to come out as a no or a not-yet if that's what the procedure honestly gives — my team is insect-curious and I want the procedure to be able to disappoint us.

  Before you write the final procedure, do a quick brainstorm of the ways the scale argument can go wrong in practice; I'd like the procedure built to catch those failure modes, and I want it to flag which steps are judgment calls wearing a spreadsheet costume rather than real measurements.
reasoning: |-
  Okay, the user runs an animal welfare grantmaking program and is dealing with proposals that use the insect scale argument. They need a practical decision procedure to evaluate these proposals efficiently. Let me unpack their request.

  First, the core problem is the tension between the massive numbers of insects and the low probability of their sentience. The user wants a method that avoids Pascal's mugging—where huge numbers overwhelm uncertain probabilities—but still takes the argument seriously. They need something actionable for quick reviews, maybe 15 proposals per cycle with limited time per proposal.

  The user's identity is key: they're a grantmaker in a foundation focused on animal welfare. Their team is small—just them and an analyst—with about an hour per proposal initially. The board is skeptical of insect work, so credibility and real money are at stake. They need a procedure that can say "no" or "not yet" to some proposals to maintain rigor.

  Their explicit needs:
  - A step-by-step checklist or sequence.
  - Clear pass/fail criteria.
  - Distinction between empirical questions and value judgments.
  - Honesty about where the procedure might misfire.
  - Application to three sample proposals with at least one rejection.

  Deeper needs:
  - Building trust with the board by demonstrating rigor.
  - Preventing mission drift into highly speculative areas.
  - Efficient resource allocation without getting bogged down in philosophy.
  - Wanting the tool to curb their own team's "insect curiosity" when unjustified.

  Now, brainstorming failure modes of the scale argument:
  1. **Probability neglect**: Treating tiny probabilities as credible without evidence.
  2. **Welfare sign uncertainty**: Not knowing if an intervention reduces suffering.
  3. **Net effect blindness**: Focusing on direct effects while ignoring indirect consequences.
  4. **Epistemic trespass**: Assigning precise numbers to vague probabilities.
  5. **Scope insensitivity**: Large numbers biasing decisions despite low probabilities.
  6. **Causal dilution**: Overestimating the impact of an intervention in complex systems.

  For the decision procedure, it should:
  - **Sequential**: Early exits for non-starters.
  - **Guardrails**: Explicit caps on probability estimates.
  - **Transparency**: Flagging judgment calls vs. hard data.
  - **Values separation**: Isolating empirical questions from moral weights.

  Structure outline:
  1. **Relevance screen**: Does this proposal explicitly rely on insect scale?
  2. **Probability screen**: Is there a credible basis for sentience probability?
  3. **Welfare sign check**: Is the intervention likely beneficial?
  4. **Net impact assessment**: Considering unintended consequences.
  5. **Expected value calculation**: With clear boundaries.
  6. **Comparative review**: Against other opportunities.

  For the sample proposals:
  - **Cricket stunning**: Passes screens but low probability cap may limit funding.
  - **Pesticide campaign**: Fails at welfare sign and net impact uncertainty.
  - **BSFL freezing switch**: Fails at welfare sign ambiguity.

  Key innovations:
  - The 5% probability cap prevents runaway numbers.
  - Forcing welfare sign clarity avoids harmful interventions.
  - Distinguishing "measurable" from "estimated" parameters keeps honesty upfront.

  Finally, the procedure must acknowledge its blind spots:
  - It can't resolve fundamental moral disagreements.
  - Threshold effects might be missed.
  - Still vulnerable to extreme tail risks.

  This balances philosophical rigor with grantmaking pragmatism while keeping the board's skepticism in mind.
answer: |-
  I'll approach this as a philosopher who specializes in practical moral uncertainty frameworks, with a focus on high-stakes, time-constrained decisions. I've designed grant evaluation systems for foundations wrestling with exactly this kind of problem. The core challenge is respecting the *mathematical validity* of expected value (EV) arguments while building firewalls against their abuse through unconstrained probabilities or welfare uncertainties. Here's how we'll proceed:

  1. **Brainstorm of Scale Argument Failure Modes** (to hardwire into the procedure)
  2. **The Decision Procedure**: "Insect Scale EV Screen" (ISES)
  3. **Application to Your Three Proposals**

  ---

  ### 1. Brainstorm: How the Scale Argument Fails in Practice
  *(These become guardrails in ISES)*

  - **Probability Neglect**: Assigning non-zero probability without evidence ("But what if they *are* sentient?"), mistaking philosophical possibility for plausibility.
  - **Welfare Sign Ambiguity**: Not knowing whether an intervention reduces suffering (e.g., is freezing better than grinding? Does preventing spray deaths increase starvation?).
  - **Net Impact Blindness**: Ignoring second-order effects (e.g., "saving" insects might increase predator suffering or resource competition).
  - **Epistemic Trespass**: Grantmakers overstepping expertise by assigning precise probabilities to poorly understood phenomena (e.g., "Let's call it 1% sentience probability" without basis).
  - **Causal Dilution**: Overestimating marginal impact in complex systems (e.g., campaign success ≠ reduced spraying ≠ reduced suffering).
  - **Scope Insensitivity**: Large N swamping small but certain harms to vertebrates ("Why fund chicken welfare when trillions of insects exist?").
  - **Pseudo-Quantification**: Hiding value judgments inside numbers (e.g., weighting insect suffering 0.001x of a mammal's is arbitrary, not empirical).

  ---

  ### 2. The Decision Procedure: Insect Scale EV Screen (ISES)
  **Design Principles**: 
  - **Sequential gating**: Fail early. Only proceed if prior step passes.
  - **Bounded probabilities**: Cap sentience probability at defensible maxima.
  - **Separate facts/values**: Flag where judgment calls masquerade as data.
  - **Time-efficient**: Designed for <45 min/proposal (you + analyst).
  - **Honest "No"**: 40% of insect-scale proposals should fail ISES.

  **Required Inputs from Proposal**: 
  - Target insect species & population size (N)
  - Proposed intervention & cost
  - Evidence for sentience (citations ok)
  - Probability of success (P_success)
  - Welfare effect direction & magnitude

  **The Procedure**:

  | Step | Question to Ask | Pass Criteria | Fail Outcome | Time Alloc | Notes/Failure Modes |
  |------|-----------------|--------------|-------------|-----------|---------------------|
  | **1. Relevance Gate** | "Does this proposal *explicitly* rely on insect scale to justify impact?" | Only if scale is primary argument. Else, evaluate under standard vertebrate framework. | Exit: Process as non-insect-scale proposal. | 2 min | Catches proposals smuggling in scale rhetoric. |
  | **2. Probability Screen** | "What is the defensible *upper bound* probability (P_sentience) for this species?" | Evidence review: Pass if ≥3 credible studies (e.g., nociception, learning, neurobiology). Assign P_sentience cap: <0.5% (no evidence), 1-5% (weak evidence), 5-15% (strong evidence). **Judgment call flag** 🚩 | Exit: "Not yet" if P_sentience cap <0.5% or no species-specific evidence. | 10 min | Prevents probability neglect. Cap examples: Fruit flies 1%, Crickets 5%, Honeybees 15%. |
  | **3. Welfare Sign Test** | "Is there ≥80% confidence the intervention *reduces* net suffering?" | Requires: (a) Clear harm reduction mechanism (e.g., stunning vs. crushing), AND (b) No material risk of increased suffering (e.g., slower death, ecological harm). **Judgment call flag** 🚩 | Exit: "No" if welfare sign unclear or negative. | 15 min | Critical firewall. Uses your team's farm-animal expertise analogically. |
  | **4. Net Impact Assessment** | "What is the *realistic* expected reduction in suffering per insect (ΔW), adjusted for success probability and side effects?" | Pass if: (a) P_success ≥20% for advocacy, ≥80% for farm interventions; (b) ΔW is quantified (e.g., "reduces pain seconds by X%"); (c) Secondary harms addressed. **Judgment call flag** 🚩 | Exit: "No" if P_success < threshold or ΔW speculative. | 10 min | Prevents causal dilution. Farm ops get higher P_success bar. |
  | **5. EV Calculation** | "Does [N × P_sentience cap × ΔW × P_success] / Cost justify funding vs. alternatives?" | Calculate EV/cost ratio. Pass if ratio >1.5x your foundation's vertebrate project benchmark (e.g., if chicken project = 100 utils/$, insect project needs >150/$). **Values flag** 🚩 | Exit: "No" if ratio ≤ benchmark. | 5 min | Contains scale swamping via: (a) Capped P_sentience, (b) Anchoring to known interventions. |
  | **6. Board Sensitivity Check** | "Does this pass a 'farm-animal skeptic' smell test?" | Narrative coherence: Can impact be explained without jargon? Scalability: Is this a pilot or one-off? | Handoff: To board with "ISES-pass" but flag controversies. | 3 min | Prevents credibility loss. Farm-animal folks distrust abstract math. |

  **Where It Misfires**:
  - **False Negatives**: Underestimates P_sentience for novel species (e.g., if octopus sentience was judged pre-2020).
  - **False Positives**: Misses complex systems harm (e.g., saving insects harms birds).
  - **Tail Risks**: Dismisses low-P/high-N catastrophes (e.g., P=0.001% of sentience in trillions).
  - **Values Blindness**: EV benchmark assumes your board's vertebrate weighting.

  ---

  ### 3. Applying ISES to Your Proposals
  **Common Parameters**:
  - Foundation vertebrate benchmark: Assume EV/cost ratio of 100 (e.g., cage-free campaign: 10,000 hens affected × 50% welfare gain × $10,000 cost = 50 utils/$ → benchmark 100 utils/$ requires 2x better efficiency).
  - P_sentience caps based on evidence: Crickets 5%, Forest larvae 0.5%, BSFL 1%.

  #### Proposal 1: Cricket Electrical Stunning
  - **Step 1**: Pass (explicitly scale-based).
  - **Step 2**: Pass. Weak evidence → P_sentience cap **5%**.
  - **Step 3**: Pass. Stunning plausibly reduces suffering vs. live processing (analogous to poultry). Welfare sign **clear +**.
  - **Step 4**: Pass. N=1B/yr; P_success=90% (farm rollout); ΔW: Assume 50% pain reduction during killing (based on crustacean studies). 
  - **Step 5**: EV = (1e9 insects × 0.05 sentience × 0.5 ΔW × 0.9 success) / $100,000 cost ≈ 225,000 utils/$.  
    - **Ratio vs. benchmark**: 225,000 / 100 = **2,250x** → Pass easily.
  - **Step 6**: Pass. Concrete farm application; scalable.
  - **ISES Verdict**: **Fund**. Strong EV case survives caps.

  #### Proposal 2: Forest Pesticide Spraying Campaign
  - **Step 1**: Pass (scale-based).
  - **Step 2**: Pass but weak. Larvae evidence scant → P_sentience cap **0.5%**.
  - **Step 3**: **FAIL**. Welfare sign unclear: Spraying may kill faster than starvation/parasitism. Campaign could *increase* net suffering.
  - **Step 4**: (Skip due to Step 3 fail) But note: P_success=40% (uncampaign), ΔW unknown/NEGATIVE.
  - **ISES Verdict**: **No**. Fails at welfare sign. Scale cannot rescue fundamental uncertainty.

  #### Proposal 3: BSFL Freezing vs. Grinding
  - **Step 1**: Pass.
  - **Step 2**: Pass. Minimal evidence → P_sentience cap **1%**.
  - **Step 3**: **FAIL**. Welfare sign ambiguous: Freezing may cause prolonged cold stress vs. near-instant grinding. No consensus in entomology.
  - **Step 4**: (Skip) ΔW could be negative.
  - **ISES Verdict**: **No**. High cost + unknown welfare sign. "Insect-curious" bias checked.

  ---

  ### Why This Works for Your Context
  - **Respects Scale, Contains Excess**: By capping P_sentience and requiring welfare sign clarity, it avoids Pascal's mugging while taking EV seriously.
  - **Board Credibility**: Fails speculative proposals (2/3 rejected here), uses familiar farm-animal logic.
  - **Speed**: Gates eliminate 50% of proposals early (Steps 1-3).
  - **Honest Flagging**: 🚩 highlights where your analyst's judgment replaces data.
  - **Adaptable**: Adjust caps/benchmarks as new science emerges.

  **Final Tip**: Train your analyst on "probability calibration" (e.g., using Fermi estimation) to avoid overconfidence in Steps 2/4. And yes—I gave you two "no"s because the procedure must bite when the evidence isn't there. That’s how it earns trust.
