  For the hypothetical case, Descartes would likely deny it has a mind. His automaton argument explicitly rejects mechanically produced language, no matter how convincing. The biological angle is supported by his theological views on ensoulment. But the behavioral criterion better explains the infant verdict.

  Aha! The perfect test case would be a brain-damaged human adult who permanently loses language ability but retains consciousness. The biological criterion would grant a mind, the behavioral one might not. Descartes' actual writings suggest he'd choose the biological view, since he believed mind and body interact via the pineal gland regardless of expression capacity.

