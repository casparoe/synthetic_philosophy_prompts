prompt: |-
  I'm a novelist working on a book where the central character is trying to decide whether to have a child, and the whole question of the procreation asymmetry keeps coming up in my research. I've read enough to know there are people who defend it and people who think it's a mistake, but I can't tell how much of the fight is real and how much is people talking past each other. So here's what I want: draft the joint statement that a defender of the procreation asymmetry and a critic of it would produce after a good-faith adversarial collaboration.

  The procreation asymmetry, as I understand it, is roughly: you have no obligation to bring a happy person into existence, but you do have an obligation not to bring a miserable person into existence. The defender says this captures a deep moral intuition; the critic says it's inconsistent or leads to weird conclusions. I've also seen it framed in terms of reasons — that the absence of a happy person isn't bad, but the presence of a suffering person is — and honestly I'm not sure if the obligation version and the reasons version are even the same claim.

  I want the document to have: a numbered list of claims both sides can sign (about the intuitions, about what follows from them, about what existing arguments have shown and haven't shown); then a table of disagreements where each side's position is stated in wording they'd accept; then the cruxes — the sub-questions that, if resolved, would actually move someone off their position; and for each crux, what kind of case or argument both sides would agree bears on it, and what each side predicts about it.

  I'm especially interested in whether the dispute turns out to be partly verbal — like, are they using "obligation" or "reason" or "bad" differently — and if so, which parts of it. The character I'm writing is someone who feels the intuitive pull of the asymetry but can't tell if it stands up to scrutiny, and I want the adversarial-collaboration document to be the thing she'd read to figure out where she actually stands.
reasoning: |-
  Okay, the user is a novelist working on a book where the protagonist is grappling with the decision to have a child, specifically wrestling with the philosophical concept of the procreation asymmetry. They've done research but feel stuck between conflicting interpretations—defenders who see it as a core moral intuition versus critics who call it inconsistent. They want me to craft a hypothetical "adversarial collaboration" document that would help their character (and them) understand the real bones of the dispute.  

  First, I need to unpack their request. They’re not just asking for an explanation of the asymmetry; they want a structured, almost diplomatic document that simulates what opposing philosophers might agree on after rigorous debate. The key elements they specified are:  
  - **Joint claims**: Points both sides concede (to isolate actual disagreements).  
  - **Table of disagreements**: Clear side-by-side phrasing each camp would endorse.  
  - **Cruxes**: The pivotal sub-questions that could change minds, plus how both sides predict they’d resolve.  
  - **Verbal disputes**: Explicitly flagging where language (e.g., "obligation" vs. "reason") muddies the waters.  

  The user’s deeper need seems to be *clarity for creative purposes*—they want their character’s turmoil to feel authentic, so the document must reflect real philosophical tension without academic noise. They also hinted at their character resonating with the intuition but fearing it’s illogical, so the cruxes should mirror that internal conflict.  

  Now, assessing the asymmetry itself:  
  - **Core idea**: No duty to create happy people, but a duty not to create miserable ones.  
  - **Defender stance**: Rooted in intuition (e.g., not regretting childlessness vs. guilt for causing suffering).  
  - **Critic stance**: Calls it inconsistent (why value preventing harm but not creating benefit?).  
  - **Ambiguity alert**: The user mentions obligation/reason framing—is this the same claim? Probably not. Obligations imply duties to others, while reasons might be agent-relative. This needs highlighting.  

  For the joint statement, I’ll draft points both sides accept. These should include:  
  - The asymmetry isn’t just about consequences; it’s about moral patients (nonexistent vs. existing beings).  
  - Critics concede it feels intuitive; defenders admit odd edge cases (like "miserable vs. happy" comparisons).  
  - Both agree no one is literally "harmed" by not being born.  

  For the table, I’ll contrast positions on:  
  - **Moral significance of nonexistence**: Defenders see neutrality; critics see inconsistency.  
  - **Weird conclusions**: Defenders bite bullets (e.g., extinction isn’t bad?); critics call this reductio ad absurdum.  
  - **Foundation**: Defenders appeal to intuition; critics demand symmetry.  

  Cruxes are the heart. I need 3-4 that could actually shift opinions:  
  1. **The Value Claim**: Is absence of happiness *neutral* or a *loss*?  
     - Both sides would test this with cases like "world A (no one) vs. world B (happy people)."  
     - Prediction: Critics think B is better; defenders say it’s neutral (no one to benefit).  
  2. **Moral Patient Status**: Do we only owe duties to actual beings?  
     - Test case: "Duty to prevent suffering vs. duty to create happiness."  
     - Prediction: Defenders say only the first binds us; critics say both should.  
  3. **Intuition Reliability**: Are asymmetry intuitions bedrock or bias?  
     - Test case: "Is regretting childlessness morally analogous to regretting causing suffering?"  
     - Prediction: Defenders say no; critics say yes (both involve potential lives).  

  On verbal disputes, I’ll note:  
  - "Obligation" often implies an owed duty (to whom?), while "reason" can be weaker (e.g., prudential).  
  - "Bad" might mean "harm to someone" (defenders) or "worse state of affairs" (critics).  

  Finally, I’ll wrap with how this helps the novelist: The document leaves the character (and reader) facing the cruxes—forcing them to interrogate their own intuitions about value, duty, and the weight of nonexistence. No easy answers, but clearer questions.
answer: |-
  Here is a draft joint statement from a Defender (D) and Critic (C) of the Procreation Asymmetry, produced after adversarial collaboration. It reflects shared ground, clarifies disputes, identifies cruxes, and flags verbal ambiguities – structured for your novelist's needs.

  ---

  ### **Joint Statement on the Procreation Asymmetry**  
  *Authored by Defender (D) and Critic (C) following adversarial collaboration*

  #### **1. Shared Understandings & Points of Agreement**  
     We agree on the following:  
     1.1 **Core Intuition Described**: The intuition underlying the asymmetry feels real: creating a suffering person seems *morally wrong* in a way that *not* creating a happy person does not. Regretting causing suffering feels categorically different from regretting not creating happiness.  
     1.2 **Minimal Formulation**: The asymmetry asserts:  
         - (A) There is *no general obligation* to bring a happy person into existence.  
         - (B) There *is a strong obligation* not to bring a miserable person into existence.  
     1.3 **No Harm in Nonexistence**: Bringing a person into existence cannot meaningfully be described as "good *for* that person" (as there is no "them" prior to benefit), and not bringing them in cannot be "bad *for* them" (as there is no subject to deprive).  
     1.4 **Asymmetry is Widespread**: This intuition appears across cultures and influences common moral discourse (e.g., blame for neglectful procreation vs. no blame for childlessness).  
     1.5 **Critics Don't Deny Intuition**: Critics acknowledge the intuitive pull of (B) but argue it cannot be coherently isolated from (A).  
     1.6 **Defenders Don't Deny Odd Implications**: Defenders acknowledge that asymmetry can lead to seemingly odd conclusions (e.g., that adding happy lives doesn't improve the world) but argue these are acceptable.  
     1.7 **Existing Arguments Are Inconclusive**: Neither side has produced a knockdown argument. Debates often stall on differing foundational commitments (e.g., person-affecting vs. impersonal value theories).  
     1.8 **"Obligation" vs. "Reason" Ambiguity**: These framings are related but not identical. "Obligation" implies duty owed *to someone*, while "reasons" can be broader (e.g., agent-relative). This is a potential verbal dispute (see Section 4).

  #### **2. Table of Key Disagreements**  
  | Issue | Defender (D) Position | Critic (C) Position |
  |-------|------------------------|----------------------|
  | **Moral Significance of Nonexistence** | The absence of a potential happy person is *morally neutral*. There is no "loss" or "wrong" done to anyone by not creating them. | If suffering is bad *because it's bad for the sufferer*, then happiness should be good *because it's good for the happy person*. Denying this is inconsistent. |
  | **Scope of Obligations** | Obligations require an existing or future subject to whom they are owed. Nonexistent beings are not subjects, so no obligation *to them* exists to create happiness. Only preventing harm to future subjects binds us. | Obligations arise from the *value of states of affairs*. A world with suffering is worse than one without; a world with happiness is better than one without. Consistency demands symmetry. |
  | **"Weird" Implications** | Implications (e.g., human extinction isn't bad if painless) are acceptable. We have duties *to* existing/future beings not to harm them, but no duty *to* the nonexistent to benefit them. | Implications are reductios. If asymmetry is true, we should prefer a world with 1 happy person over a world with 1 billion happy people (since adding them isn't obligatory/beneficial). This is absurd. |
  | **Foundation of Intuition** | The intuition reflects a deep truth about morality: preventing harm is paramount; creating benefit is optional or supererogatory. | The intuition is a psychological bias (e.g., loss aversion) mistaken for moral truth. Rational consistency requires symmetry. |

  #### **3. Cruxes: The Decisive Sub-Questions**  
  If resolved, these would significantly shift positions. Both sides agree on what evidence/test cases bear on each crux.

  3.1 **The Value Claim Crux**  
     - **Question:** *Is the absence of happiness for a potential person morally neutral ("not bad"), or is it a form of deprivation ("bad" relative to possible alternatives)?*  
     - **Bearing Test Case:** Compare two worlds:  
       - *World A:* No one exists.  
       - *World B:* A happy person exists.  
       Is World B *better* than World A?  
     - **D Prediction:** No. Without a subject in A to deprive, B isn't better. "Better" requires a subject for whom it is better.  
     - **C Prediction:** Yes. B contains more positive value (happiness) than A. Morality evaluates states of the world, not just subject-relative harms.  
     - **Why Crucial?** If C is right, asymmetry collapses; creating happiness becomes morally required. If D is right, asymmetry is coherent.

  3.2 **Moral Patient Status Crux**  
     - **Question:** *Can moral obligations (e.g., "do not harm") apply to merely possible beings, or only to actual/future beings?*  
     - **Bearing Test Case:** Is there a duty *to a specific potential child* not to create them if they will suffer? Is there a duty *to that same potential child* to create them if they will be happy?  
     - **D Prediction:** Only the first duty exists. Once created, they are a patient owed duties. Prior to creation, there is no "them" to owe a duty *to*, even if the act of creation is harmful.  
     - **C Prediction:** Both duties exist symmetrically. The potential child's *interests* (avoiding suffering, gaining happiness) generate reasons regardless of their current existence.  
     - **Why Crucial?** If obligations require a present/future patient (D), asymmetry holds. If potential interests ground obligations (C), symmetry is inevitable.

  3.3 **Intuition Reliability Crux**  
     - **Question:** *Is the asymmetry intuition a reliable guide to moral truth, or a cognitive bias?*  
     - **Bearing Test Case:** Consider "Reverse Asymmetry" intuitions:  
       - *Case 1:* Choosing *not* to cure a disease that would make someone miserable (clearly wrong).  
       - *Case 2:* Choosing *not* to give a benefit (e.g., education) that would make someone happy (less clearly wrong, possibly permissible).  
       Does this parallel support the asymmetry?  
     - **D Prediction:** Yes. Preventing misery feels urgent; providing benefit feels optional. This confirms the core intuition.  
     - **C Prediction:** No. This confuses *ease of causing harm* vs. *difficulty of creating benefit*. In procreation, the *act* (creating) is identical; only the *outcome* differs. The intuition is context-dependent bias.  
     - **Why Crucial?** If D is right, asymmetry is bedrock. If C is right, it’s an error needing revision.

  #### **4. Verbal Disputes & Clarifications**  
  Both sides acknowledge these terminological issues fuel disagreement:  
     - **"Obligation":** D uses strictly ("duty owed to a patient"). C often uses broader ("what we ought to do").  
     - **"Bad" (in "absence of happiness isn't bad"):** D means "not bad *for a subject*". C often interprets as "not a worse state of affairs".  
     - **"Reason":** D may accept *agent-relative* reasons to create happiness (e.g., personal desire) but denies *moral* reasons/obligations. C argues *moral* reasons exist symmetrically.  
     **Joint Conclusion:** The dispute is **partly verbal** (over "obligation," "bad for," "moral reason") but **mostly substantive** (over the Value Claim and Moral Patient Status cruxes).

  #### **5. Implications for Your Character**  
  This collaboration reveals:  
     - The asymmetry’s core intuition is robust but *not self-evident*. It demands interrogation.  
     - Defenders have a coherent (if austere) system centered on harm prevention and moral patients. Critics expose tensions with total value and consistency.  
     - **Her decision hinges on the cruxes:**  
       - If she believes creating happiness *adds value* to the world (Value Claim), asymmetry weakens.  
       - If she believes obligations can only bind us towards actual/future beings (Patient Status), asymmetry strengthens.  
       - If she trusts the intuition despite edge cases (Intuition Reliability), asymmetry feels true.  
     - **No easy resolution exists.** Philosophy clarifies the stakes but won't absolve her of choosing which moral vision resonates. The asymmetry isn't "debunked," but its cost (accepting odd implications) is laid bare.

  ---

  ### **Why this works for your novel**  
  This document mirrors real philosophical stalemates while providing structure. Your character would see:  
  1. **Where the fight is real** (substantive clashes on the cruxes, especially the Value Claim).  
  2. **Where it's semantic** (equivocation on "obligation" or "bad").  
  3. **The price of each position** (D accepts a world where adding happiness isn't obligatory; C insists risking absurdity if symmetry is rejected).  
  4. **Her personal alignment** becomes about which crux she leans on – e.g., if she viscerally feels World B isn't *better* than World A, she leans Defender.  

  This transforms abstract debate into a character's tangible dilemma: *Which philosophical "cost" feels truer to her moral compass?*
