  We are writing a memo to the Faculty Senate. The committee recommends a voting method, and we must address the Gibbard-Satterthwaite theorem. The committee has two social choice theorists who object to RCV because of the theorem. Others think the theorem is too abstract and that practical considerations should dominate.

   The memo must:
   1. Recommend a specific voting method (either plurality or RCV, or perhaps another?).
   2. Engage the Gibbard-Satterthwaite theorem seriously: explain what it does and does not establish, and whether it applies equally to all methods.
   3. Discuss whether some methods are more robust to strategic voting in practice.
   4. Address the practical weight of an impossibility theorem when choosing a real procedure.
   5. State the strongest argument against the recommendation and address it fairly.
   6. Be accessible to non-specialists (historians, biochemists).
   7. Conclude with an actionable resolution.

   After considering the arguments, the committee might recommend RCV despite the theorem, because:
     - The theorem says that no system is perfect, but it doesn't say all systems are equally bad.
     - There is evidence that RCV reduces the spoiler effect and encourages sincere voting in practice.

   However, we must be fair to the opposing view.

   Alternatively, the committee might stick with plurality? But the reformers have made a case for RCV.

   The memo should clarify:

   What the Gibbard-Satterthwaite theorem says:
     - If there are at least three candidates, any voting system that is non-dictatorial and satisfies the condition that every candidate can win (non-imposition) is susceptible to strategic voting. That is, there will be situations where a voter can achieve a better outcome by misrepresenting their true preferences.

   What it does not say:
     - It does not say that strategic voting happens equally often in every system.
     - It does not say that every system is equally manipulable in practice.

   So, the theorem is a general impossibility: no perfect system exists. But that does not mean we cannot choose a better system.

   Practical considerations:
     - Plurality voting is known to have problems with vote-splitting and spoiler effects, which RCV is designed to mitigate.
     - RCV might be more complex, but it has been used successfully in many jurisdictions.

   The social choice theorists might argue that RCV is not necessarily better than plurality because both are manipulable. However, we can cite empirical and theoretical work that suggests RCV is less prone to certain kinds of manipulation or that it reduces the incentive for strategic voting in common scenarios.

   The memo should also note that while the theorem shows that no system is immune to strategic voting, some systems might require more coordination or information to manipulate effectively, making manipulation less likely in practice.

   Recommendation: The committee recommends adopting RCV (instant runoff voting) for the election of the Senate President and standing committee chairs.

   Strongest argument against: The Gibbard-Satterthwaite theorem proves that RCV is also vulnerable to strategic voting, so switching systems does not solve the fundamental problem. Moreover, RCV is more complex and might confuse voters, and it could lead to non-monotonic outcomes (where ranking a candidate higher can hurt them, or lower can help them).

   Addressing that argument:
     - While RCV is not perfect, it addresses specific problems that occur frequently in plurality voting, such as the spoiler effect. 
     - The complexity is manageable (many organizations use RCV successfully) and the non-monotonicity is a rare occurrence.
     - The theorem does not mean that RCV is as manipulable as plurality; in fact, some studies suggest that RCV reduces the frequency of strategic voting situations.

   Structure of the memo:

     I. Introduction: Purpose and charge of the committee.
     II. Background: Current system (plurality) and the proposal (RCV).
     III. The Gibbard-Satterthwaite Theorem: A clear explanation.
          - What it says: impossibility of a perfect system.
          - What it does not say: that all systems are equally bad.
     IV. Practical Considerations:
          - Problems with plurality: spoiler effect, strategic voting in the form of "lesser evil" voting.
          - How RCV addresses these: by allowing voters to rank candidates, it eliminates the spoiler effect and allows voters to vote sincerely for their favorite first.
          - Acknowledge that RCV is not immune to strategic voting, but argue that it is less prone to common problems and that the strategic voting it does invite is less likely to occur in practice (because it requires more information and coordination).
     V. Recommendation and Rationale:
          - We recommend RCV because it better reflects the will of the electorate in multi-candidate races by ensuring the winner has broad support.
          - The Gibbard-Satterthwaite theorem is a theoretical limitation that applies to any system we might choose, so it should not prevent us from adopting a system that improves upon the status quo in practical ways.
     VI. Addressing the Strongest Counterargument:
          - Counterargument: The theorem shows that RCV is also manipulable, so why change?
          - Response: While both systems are manipulable in theory, RCV is less vulnerable to the most common and damaging forms of strategic voting that plague plurality (like vote-splitting). Moreover, the theorem does not tell us the frequency or ease of manipulation. In practice, RCV has been shown to reduce strategic voting and produce winners that are more acceptable to the majority.
     VII. Conclusion: Resolution for the Senate to vote on.

   Resolution: "Resolved, that the Faculty Senate adopts ranked-choice voting (instant runoff) for the election of the Senate President and standing committee chairs, effective immediately for the next election cycle."

