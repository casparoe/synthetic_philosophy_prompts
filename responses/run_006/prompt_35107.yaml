answer: |-
  **MEMORANDUM**  
  To: Faculty Senate Members  
  From: Governance Procedures Review Committee  
  Date: October 26, 2023  
  Subject: Recommendation for Voting Method in Senate Elections  

  ### **I. Introduction**  
  The Governance Procedures Review Committee was charged with evaluating the voting method for Senate elections (President and standing committee chairs), where three or more candidates routinely compete. After deliberation, we recommend replacing the current plurality voting system with **ranked-choice voting (RCV)**, also known as instant runoff voting. This memo outlines our rationale, directly addresses the concerns raised about the Gibbard-Satterthwaite theorem, and explains why RCV is the most practical improvement for our elections.  

  ---

  ### **II. Background**  
  - **Current System (Plurality Voting)**: Voters select one candidate, and the candidate with the most votes wins, regardless of majority support.  
  - **Proposed Reform (Ranked-Choice Voting)**: Voters rank candidates in order of preference. If no candidate wins a majority of first-choice votes, the lowest-ranked candidate is eliminated, and their votes are redistributed to remaining candidates based on next preferences. This continues until one candidate secures a majority.  

  The reform faction advocates RCV because it:  
  1. Ensures winners have majority support,  
  2. Reduces "spoiler effects" (where similar candidates split votes, allowing a less-popular candidate to win),  
  3. Encourages sincere voting by allowing preferences beyond a single choice.  

  Two committee members, both social choice theorists, oppose RCV on grounds of the **Gibbard-Satterthwaite theorem** (GS theorem). We address this objection rigorously below.  

  ---

  ### **III. Understanding the Gibbard-Satterthwaite Theorem**  
  The GS theorem is a foundational result in social choice theory. It states:  
  > *"No voting system that accommodates three or more candidates can simultaneously satisfy all three conditions:  
  > (1) Non-dictatorship (no single voter controls the outcome),  
  > (2) Universality (it works for any possible voter preferences), and  
  > (3) Strategy-proofness (no voter ever benefits by misrepresenting their true preferences)."*  

  **What this means for our election**:  
  - **The theorem proves that no fair voting system is immune to strategic voting** (e.g., ranking a less-preferred candidate higher to influence the outcome). This includes both plurality and RCV.  
  - **It does not mean all systems are equally flawed**: The GS theorem is a theoretical "impossibility" result. It confirms no perfect system exists but **does not imply that all systems are equally vulnerable in practice**. Some systems create stronger incentives for manipulation, while others reduce opportunities or make strategic voting harder to execute.  
  - **It does not invalidate practical improvements**: The theorem addresses theoretical limits, not real-world frequency or impact. A system can be "manipulable in theory" yet "robust in practice" due to voter behavior, transparency, or the rarity of pivotal scenarios.  

  ---

  ### **IV. Why RCV Is a Practical Improvement Over Plurality**  
  While both systems fall under the GS theorem, RCV better mitigates common problems in Senate elections:  

  1. **Reduces Spoiler Effects**:  
     - Plurality often penalizes ideologically similar candidates (e.g., two progressive candidates splitting votes, allowing a conservative to win with 35% support).  
     - RCV eliminates this by redistributing votes, ensuring the final winner has broad support.  

  2. **Encourages Sincere Voting**:  
     - Under plurality, voters often abandon their preferred candidate to avoid "wasting" a vote (e.g., voting for a "lesser evil").  
     - RCV allows voters to support their true favorite first, then rank alternatives. Evidence from municipalities and organizations shows voters find this intuitive and report higher satisfaction.  

  3. **Mitigates Strategic Incentives in Practice**:  
     - **Plurality** incentivizes frequent strategic voting (e.g., "vote-splitting" fears shape candidate entry and campaigns).  
     - **RCV** requires more complex coordination to manipulate (voters need precise knowledge of others’ preferences to game the system). Studies (e.g., Regenwetter et al., 2007) show manipulation under RCV is rare in small-to-moderate electorates like ours.  
     - **No system is immune**, but RCV narrows the gap between "sincere" and "strategic" outcomes compared to plurality.  

  ---

  ### **V. Addressing the Strongest Counterargument**  
  **The strongest objection to our recommendation** is that the GS theorem proves RCV is no better than plurality in principle: if both are manipulable, why change?  

  **We acknowledge this concern**: The GS theorem is correct—RCV is not a "perfect" solution. Strategic voting could theoretically occur (e.g., a voter ranking a strong candidate lower to boost their second choice). However, this objection overstates the theorem’s practical weight:  
  - **Theory vs. Practice**: The GS theorem treats all manipulation equally, but in reality, the *likelihood* and *impact* matter. Plurality’s flaws (spoilers, minority winners) arise in nearly every competitive election with >2 candidates. RCV’s vulnerabilities, by contrast, require unlikely conditions (e.g., exact knowledge of others’ rankings) and rarely materialize in practice.  
  - **Evidence from Real Elections**: Jurisdictions using RCV (e.g., Australia, Maine, academic associations) report fewer complaints about vote-splitting, higher voter satisfaction, and no widespread manipulation. Plurality’s flaws are well-documented in our own Senate history.  
  - **The Alternative is Worse**: Rejecting RCV because of the GS theorem leaves us with plurality—a system the theorem equally condemns but with more frequent pathologies.  

  ---

  ### **VI. Recommendation**  
  We recommend adopting **ranked-choice voting (RCV)** for all Senate elections. While no system is theoretically flawless, RCV:  
  - Addresses plurality’s most disruptive flaws (spoilers, minority winners),  
  - Better reflects the Senate’s preference for majority-supported outcomes,  
  - Reduces practical incentives for strategic voting,  
  - Aligns with best practices in peer institutions (e.g., Stanford, MIT).  

  The GS theorem reminds us to remain vigilant—no voting rule is immune to strategic behavior—but it should not paralyze reform. Where theory identifies universal constraints, practical experience must guide us.  

  ---

  ### **VII. Proposed Resolution**  
  *Resolved*, that the Faculty Senate adopts ranked-choice voting (instant runoff) for elections of the Senate President and standing committee chairs. Ballots shall allow voters to rank candidates in order of preference, and winners shall be determined by an iterative count until one candidate secures a majority. Implementation shall commence in the next election cycle, with training sessions provided for all senators.  

  Respectfully submitted,  
  Governance Procedures Review Committee  

  ---  
  **Appendix: Key Terms**  
  - **Spoiler Effect**: When a popular candidate loses because similar candidates split their shared voter base.  
  - **Strategic Voting**: Voting against one’s true preference to influence the outcome (e.g., "lesser evil" voting).  
  - **Non-Monotonicity**: A rare RCV edge case where ranking a candidate higher can inadvertently hurt their chances. The committee deems this outweighed by RCV’s net benefits.
