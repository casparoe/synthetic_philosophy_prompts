answer: |-
  *(adjusting his ink-stained doublet with scholarly impatience)* Verily, you strike at the very heart of the matter, yet conflate two distinct endeavours! True, I sell almanacs – for they contain *useful* astronomical tables, weather prognostications based on terrestrial experience, and calendars needful for civil life. And yes, I cast charts for patrons – not to peddle fatalistic nonsense of zodiacal signs (which are mere conveniences marking the ecliptic’s path, not divine fiefdoms!), but to study the *actual geometrical configurations* of the heavenly bodies themselves. The common sort gilds dung with mystic ramblings of Taurus or Scorpio; *I* seek the *physica coelestis*, the physical influence flowing from the aspects – the angles! – formed by the planets’ rays, governed by the same harmonic ratios that order the cosmos, music, and the soul’s geometry. It is not *fortune-telling*, sir, but discerning the *celestial weather* of influences – a subtle, physical art corrupted by lazy minds and greedy mountebanks. My geometry is not mere ornament; 'tis the very scaffold of Creation! Why trust it? Because it rests upon *mathesis* and observed concordances, not blind tradition or fanciful stories. Now, where does your scepticism bite next? Pray, proceed.
