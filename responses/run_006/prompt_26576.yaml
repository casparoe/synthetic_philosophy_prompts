  Imagine a fair lottery with 1000 tickets. Exactly one ticket will win. For any single ticket, the probability that it will lose is 0.999. It seems rational to believe of each ticket that it will lose (because the probability is very high). However, if we believe of each ticket that it will lose, then we should believe that no ticket will win. But we also know (and rationally believe) that one ticket will win. This leads to an inconsistent set of beliefs: {Ticket 1 loses, Ticket 2 loses, ..., Ticket 1000 loses, and One ticket wins}.

