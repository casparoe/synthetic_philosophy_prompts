prompt: |-
  I'm a software engineer with no formal background in philosophy, but I've been reading a bit of moral psychology on the side and I've gotten tangled up in something. I grew up in a culture that places a very high value on loyalty to family — the idea that you have special obligations to your parents, siblings, and children that you simply don't have to strangers, and that these obligations can sometimes override impartial considerations of fairness or the greater good. I feel this intuition quite strongly; it doesn't just seem like a cultural norm I absorbed passively, it feels like something I actively endorse from the inside. But here's the trouble: I also know that if I'd grown up in a different cultural setting, I might feel equally strongly that impartial fairness is what really matters and that family loyalty is just a kind of tribal bias we should work to overcome. I can't tell whether my conviction that loyalty can legitimately override fairness is a genuine moral insight or just an accident of where I happened to be born.

  So I'm trying to get a handle on a specific question: for a moral intuition like this one — that loyalty to family can legitimately override impartial fairness in at least some cases — what's the probability that it reflects a genuine moral preference (something I'd endorse on reflection, something that tracks real moral reasons) rather than a mere bias (a culturally-instilled inclination that doesn't track anything morally real, even if it feels compelling from the inside)?

  Please approach this as an expert in both moral philosophy and moral psychology. I'd like you to think carefully — maybe start with some unstructured brainstorming about what kinds of considerations could in principle help distinguish preferences from biases in the moral domain, and whether the philosophical literature gives us reason to think such a distinction can even be drawn cleanly. Then give me your actual credence: a number between 0 and 1 that this particular intuition is a genuine moral preference rather than a mere bias.

  Most importantly, I want the reasoning decomposed. What are the sub-questions your credence depends on? For example, you might consider: whether there exists any principled way to distinguish moral preferences from biases at all; whether evolutionary or cultural origins tend to debunk the moral intuitions they produce; whether the specific content of this intuition — family loyalty overriding impartiality — has structural features that make it more or less likely to be a bias; whether the fact that I endorse it on reflection counts as evidence one way or the other; and whether widespread cross-cultural disagreement about it should lower our confidence. For each sub-question you identify, assign a rough probability and give a sentence or two of justification. Then show how those probabilities combine to yield your final number. Finally, tell me which sub-question your overall credence is most sensitive to — the one where new evidence or a better argument would shift your number the most — and describe what that evidence would look like.
