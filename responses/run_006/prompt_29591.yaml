  Hmm, this is fascinating because it bridges applied environmental science and moral philosophy. The user clearly has deep technical experience with CBAs but is now questioning their foundational assumptions. They're not just asking for textbook definitions—they want to understand the implicit ethical framework behind standard practices. 

  The spatial vs temporal discounting contradiction they point out is razor-sharp. In their field, discounting future lives by 3% annually is routine, but geographical discrimination would be unthinkable. That's a powerful observation. I should acknowledge how perceptive that is upfront.

  They're asking layered questions: 
  - What theory of value underpins this? 
  - Is this pure time preference or something else? 
  - Does the exponential math matter? 
  - What would happen if pure time preference were removed?

  I need to unpack these systematically. First, the ethical tension: standard CBA treats time asymmetrically but space symmetrically. That's philosophically jarring since most moral theories (utilitarianism, deontology) treat all human lives equally regardless of when they exist. 

  The "pure time preference" distinction is crucial here. Economists often defend discounting by pointing to uncertainty or economic growth—but the user seems to suspect the practice smuggles in pure time preference. They're right to be suspicious. Treasury guidance often presents discounting as purely technical, but the choice of discount rate has ethical weight.

  On reconstructing it without pure time preference: yes, technically you could attribute everything to opportunity cost or uncertainty. But in practice, the 3% rate includes all factors bundled together. The user's background means they'll appreciate how messy this gets in real modeling—uncertainty isn't neatly separable from pure time preference.

  The exponential shape question is interesting. Hyperbolic discounting (declining rates) might feel more intuitive psychologically, but philosophically it doesn't resolve the core issue. If anything, it makes the arbitrariness more obvious by adding another layer of discretion.

  If we removed pure time preference... that's where it gets thorny. CBAs would still "work" mathematically, but outcomes would shift dramatically toward future generations. Coastal defenses against 2100 sea-level rise would suddenly look much more valuable. The framework might survive, but political acceptance? Unlikely. The Treasury would revolt.

  What they're really digging at is whether standard practice is secretly unethical. I should be honest: yes, mainstream environmental economics leans toward "weak sustainability" and implicitly devalues future lives. But I'll avoid policy prescriptions as requested—just map the philosophical commitments.

  This user is sharp. They've identified a genuine crack in applied ethics. I'll structure the response to validate their intuition while dissecting the technical veneer of discounting practices. The engineering/philosophy dual perspective is perfect for this.
answer: |-
  Your background brings a fascinating lens to what is indeed a deep—and contentious—philosophical problem in welfare economics and ethics. Let's dissect the implicit theory of value and commitments behind discounting in cost-benefit analysis (CBA), addressing your core questions systematically.

  ### 1. **The Core Ethical Tension: Time vs. Space**
  Your observation is spot-on: standard CBA treats temporal and spatial disparities inconsistently. This practice rests on two pillars:
  - **Spatial Neutrality**: Rooted in cosmopolitan ethics (e.g., utilitarianism, Kantian universalism), which holds that equal moral weight applies regardless of location.
  - **Temporal Discounting**: Asserts that welfare impacts *diminish in value* based on temporal distance from the present.

  The disconnect arises because while spatial neutrality is treated as an ethical axiom, temporal discounting is presented as a "technical" necessity. This masks an ethical commitment.

  ### 2. **What Theory of Value Underpins This?**
  CBA implicitly adopts a **welfarist consequentialism**: value is derived from individual well-being (utility/consumption), aggregated across persons. Crucially, it assumes:
  - **Anthropocentrism**: Only human welfare counts (carbon is instrumentally valuable only insofar as it affects welfare).
  - **Monetization**: All impacts (lives, ecosystems) are reducible to consumption-equivalent units.
  - **Separability**: The value of saving a life is entirely derived from the consumption it enables for that person (not intrinsic worth).

  ### 3. **Is This Pure Time Preference?**
  The standard 3% discount rate typically bundles three components:
  - **Pure Time Preference (δ)**: A "utility discount" reflecting impatience or innate preference for present well-being (e.g., δ ≈ 0.5–1%).
  - **Economic Growth (η·g)**: As wealth grows, marginal utility of consumption declines (η = elasticity of marginal utility; g = growth rate). Saves a life in a richer future are less valuable in utility terms.
  - **Risk/Uncertainty**: Higher uncertainty about future outcomes reduces present value.

  **The commitment?**  
  While the *full rate* isn't pure time preference, the practice *is* committed to δ > 0. Treasury guidance (e.g., UK Green Book) typically includes δ explicitly (often 1–1.5%), defending it via:
  - **Revealed preference**: People discount their own futures (e.g., savings behavior).
  - **Prevent paralysis**: Without δ, the infinite future would dominate all decisions.
  - **Avoiding "tyranny"**: Excessive sacrifice for distant generations.

  **Critically:** Even if δ = 0, discounting via η·g *still devalues future lives* because richer future people derive less welfare from survival. This treats lives as vessels for consumption, not bearers of intrinsic value.

  ### 4. **Does the Exponential Shape Matter?**
  - **Constant-rate discounting (exponential)** assumes persistent compounding of discount factors. It implies that a death in 100 years is *vastly* less important than in 50 years (e.g., 3% discount: 50y factor = 0.23, 100y factor = 0.05).
  - **Declining Discount Rates (DDR)** use hyperbolic-like functions (e.g., falling from 3.5% to 1% over 300 years). This softens long-term devaluation but still commits to *some* discounting. Philosophically, DDRs often reflect uncertainty resolution over time, not an ethical shift. It doesn’t resolve the core problem: why time *as such* justifies differential valuation.

  ### 5. **What Changes if Pure Time Preference is Removed?**
  - **δ = 0**: This eliminates the "impatience" component but retains η·g. Future lives still discounted if g > 0. A death avoided in a richer future would be worth less than one today.
  - **δ = 0 and η = 0**: No discounting at all. Future lives = present lives. This is the "pure" philosophical position of temporal neutrality (e.g., Ramsey, Sidgwick, Parfit).

  **Operational Impact:**
  - **CBA Framework Survival**: Mathematically intact, but outcomes radically altered. Projects with long-term benefits (e.g., decarbonization, coastal barriers) dominate. A tonne of carbon avoided in 2120 becomes equally valuable to one avoided today.
  - **Political Viability**: Collides with democratic time horizons and short-term electoral cycles. Projects requiring immediate sacrifice for distant gains become "too big" (e.g., climate mitigation costs could swamp current budgets).
  - **Uncertainty’s Role**: Without δ, uncertainty dominates discounting. High-stakes, low-probability catastrophes (e.g., collapse of Atlantic circulation) might justify *negative* discount rates in some models.

  ### 6. **Where is the Practice Committed vs. Underdetermined?**
  - **Committed to**:  
    - Temporal asymmetry (future ≠ present).  
    - Anthropocentric welfarism (lives valued instrumentally via consumption).  
    - δ > 0 at some level (explicitly or bundled).  
  - **Underdetermined**:  
    - The *level* of δ (could be 0.1% or 2%).  
    - The split between δ, η·g, and risk.  
    - Declining vs. constant rates.  
    - Whether lives/carbon are discounted *directly* or via consumption (controversial even among economists).

  ---

  ### The Implicit Ethical Theory
  Your practice presupposes a **weak anthropocentric utilitarianism** modified by:
  1. **Agent-relative time bias**: Valuing the present generation’s welfare above identical welfare of future persons simply due to temporal location.  
  2. **Growth optimism**: Belief that future wealth will compensate for discounted well-being losses.  
  3. **Epistemic humility**: Uncertainty justifies conservatism toward the future.  

  This clashes with:  
  - **Non-discrimination principles** (e.g., "all persons count equally" in Singer, Rawls).  
  - **Rights-based views** (future persons have claims against us).  
  - **Strong sustainability** (critical natural capital, like a stable climate, has non-substitutable value).  

  ### Key Philosophical References
  - **Derek Parfit** (*Reasons and Persons*, 1984): Challenges the rationality of pure time preference.  
  - **Frank Ramsey** (1928): Called δ > 0 "a practice which is ethically indefensible."  
  - **Nicholas Stern** (*Stern Review*, 2006): Used δ = 0.1%, η = 1, arguing for aggressive climate action.  
  - **Martin Weitzman**: On uncertainty and "fat tails" justifying DDRs or near-zero rates.  

  In essence: standard CBA discounts future lives because it discounts *all future welfare*, treating lives as derivative of consumption. The practice is ethically committed to temporal partiality, even if dressed in technical garb. Removing this commitment wouldn’t break CBA but would force a reckoning with intergenerational justice—something your field’s models quietly encode but rarely debate.
