prompt: |-
  I'm a novelist, and I'm stuck. My current book has a lot of scenes where characters try to prove something about themselves to someone else—loyalty, competence, love, status—through some kind of costly display, and I keep getting the note from my editor that the scenes don't convince. "He wouldn't be moved by that," she says, or "this feels like a gesture not a signal." I realized I don't actually have a grip on when a costly action should persuade the character it's aimed at, and when it should look like a cheap bid.

  I read about the handicap principle years ago—the idea that signals are honest when they're costly enough that a low-quality individual couldn't afford to send them, so the signal carries information. I get the peacocks tail and the engagement ring. But applying it to the scenes I'm actually writing is a mess. Human beings signal with money, time, risk, embarrassment, cruelty, self-sabotage. The "cost" isn't always obvious and the "quality" being signaled isn't always obvious either. I need a procedure I can run on a scene I'm drafting—grounded in the actual logic of costly signaling, not just writing advice with a jargon gloss—that tells me whether a character's display would genuinely land as honest. Something I can use in ten minutes, not a research program.

  Please give me exactly five steps, each a sentence or two, no introduction, no conclusion. I want the steps to be genuinely derived from the theory, and please flag clearly which steps are mechanical and which depend on my own judgment as a writer. Then run the procedure on two scenes: (1) a wealthy man takes a woman to a restaurant where he clearly doesn't belong—can't pronounce the dishes, uses the wrong fork—to show her he's willing to be humiliated for her; (2) a politician donates a large sum to a cause he publicly opposes, does it anonymously, and then tells exactly one person, swearing them to secrecy.
reasoning: |-
  Okay, the user is a novelist struggling with scenes where characters use costly displays to prove something—like loyalty or competence—but their editor keeps saying these scenes aren't convincing. They mention the handicap principle, where signals must be costly to be honest, like a peacock's tail or an engagement ring. But applying this to human behavior is messy because costs vary (money, time, risk, etc.), and the qualities being signaled aren't always clear. They need a practical, five-step procedure grounded in costly signaling theory that they can apply quickly to their scenes. They also want examples analyzed using this procedure.

  First, I need to recall the core concepts of costly signaling. The handicap principle states that for a signal to be honest, it must be too costly for low-quality individuals to fake. So the steps should ensure the cost is prohibitive for someone without the trait being signaled. The user needs concrete steps, not abstract theory. Each step should have a clear, actionable check. They also mentioned distinguishing between mechanical steps (objective checks) and those requiring writer judgment.

  Breaking down the procedure: Step 1 should identify the trait being signaled. That's crucial because the cost must align with proving that specific trait. Step 2 should assess if the cost is linked to the trait—costs that wouldn't burden a faker undermine the signal. Step 3 checks if the cost is high enough that only someone with the trait could afford it. Step 4 is about observability; the receiver must notice the cost. Step 5 involves alternatives—if a cheaper signal exists, the costly one might seem unnecessary. 

  The user provided two scenes. For the first one (wealthy man in a fancy restaurant), the trait is willingness to be humiliated for her. The cost is embarrassment. But is embarrassment a high enough cost? A faker might endure it briefly, so it might not be prohibitive. Also, the woman might not value this display, making it ineffective. The signal doesn't convincingly prove long-term commitment. 

  The second scene (politician donating anonymously then telling one person). The trait is true belief in the cause. The cost is financial and reputational risk. But by telling one person, he reduces the anonymity, making it less costly. A true believer would donate anonymously without telling, so his action suggests he wants credit, undermining the signal. The cost isn't prohibitive enough because a hypocrite could do the same for future leverage.

  I should ensure the steps are derived from theory. Step 1 comes from defining the signal's purpose. Step 2 ties cost to the trait's verification. Step 3 is the core handicap principle. Step 4 relates to signal reception theory. Step 5 involves the concept of signal efficiency. 

  The user's deeper need is to create believable character interactions. They might be missing that signals must align with the receiver's values and that costs must be impossible for imposters to bear. Also, the receiver's perception is key—what they interpret versus the sender's intent. The examples show that without these elements, signals feel like gestures. The novelist needs to think from both characters' perspectives to make signals land authentically.
answer: |-
  Here are five steps derived from costly signaling theory, applied mechanically where possible. Judgment steps are flagged.

  1.  **Identify the specific trait (quality) the signaler intends to prove.** (Mechanical: State it explicitly.)
  2.  **Determine if the cost incurred is *specifically burdensome* for individuals *lacking* that trait, making it uneconomical for them to fake.** (Judgment: Does this cost genuinely filter out fakers of *this* trait?)
  3.  **Assess if the cost is sufficiently high that only someone possessing (or believing they possess) the trait could rationally bear it for the expected benefit.** (Judgment: Is the cost prohibitive *enough* relative to the claimed trait and context?)
  4.  **Verify the receiver can plausibly observe or infer the *full cost* incurred by the signaler.** (Mechanical/Judgment: Is the cost visible/deductible? Could a cheaper alternative achieve the same visible effect?)
  5.  **Check if a *cheaper, equally effective signal* of the *same* trait exists and is available to the signaler; if yes, the costly signal is suspect.** (Judgment: Does a simpler, less risky proof exist that the signaler avoids?)

  **Applied to Scene 1 (Wealthy Man at Restaurant):**
  1.  **Trait:** Willingness to endure humiliation for her.
  2.  **Cost Burden:** Embarrassment *is* burdensome, but NOT uniquely burdensome for someone *unwilling* to be humiliated for her. A manipulator seeking short-term gain could easily fake brief discomfort. The cost doesn't filter fakers of *this specific trait* well.
  3.  **Cost Sufficiency:** The cost (mild embarrassment) is likely *too low* for the claimed trait (profound willingness for humiliation). It's a minor, transient discomfort, not a significant, sustained sacrifice. Doesn't prove *willingness*, just momentary tolerance.
  4.  **Observability:** The cost (awkwardness) is visible. BUT, a cheaper signal exists: simply admitting discomfort or choosing a different venue would show consideration without "costly" display. The elaborate setting feels performative.
  5.  **Cheaper Alternative:** Yes. Sincerely saying, "This place makes me uncomfortable, but I wanted to give you this experience," shows vulnerability and willingness *without* the (potentially performative) display. His chosen signal seems unnecessarily flashy.

  **Verdict:** *Unconvincing.* The cost (embarrassment) isn't sufficiently linked to filtering *unwilling* fakers (Step 2), is too low for the claimed trait (Step 3), and a cheaper, more genuine signal exists (Step 5). It reads like a performative gesture, not proof of deep willingness.

  **Applied to Scene 2 (Politician's Anonymous Donation & Secret):**
  1.  **Trait:** True, private belief in the cause he publicly opposes (sincerity/hypocrisy).
  2.  **Cost Burden:** The financial cost is burdensome for *everyone*. The *reputational risk* cost (if revealed) is *specifically burdensome* **only** for someone who *lacks* true belief and whose career depends on public opposition. A true believer wouldn't fear this revelation; a hypocritical opponent *would*. This cost *does* filter fakers effectively.
  3.  **Cost Sufficiency:** High financial cost + high potential reputational destruction is likely sufficient *only* if the signaler genuinely believes in the cause. A hypocrite wouldn't risk so much for no *visible* credit. Rational only for a true believer.
  4.  **Observability:** **CRITICAL FLAW.** The receiver sees the donation receipt (proof of financial cost). *But the reputational risk cost hinges on secrecy.* By telling *even one person*, the politician *dramatically reduces the actual risk* (it's no longer truly anonymous/secure) and introduces the possibility of seeking *private* credit/leverage. The *full* intended cost (absolute anonymity = maximum risk borne solely for belief) is undermined.
  5.  **Cheaper Alternative:** For proving *true belief alone*, pure anonymous donation (telling *no one*) is cheaper (no risk of exposure) and more credible. Telling someone introduces a *different* potential motive (seeking private influence, creating obligation, ego) that a cheaper signal (pure anonymity) wouldn't.

  **Verdict:** *Undermined by Step 4.* The core cost (reputational risk) relies on perfect secrecy to be maximally burdensome for a hypocrite. Telling *anyone*, especially while swearing them to secrecy, drastically reduces the real risk (it's no longer "costly" anonymity) and introduces an alternative motive (private signaling/leverage), making the gesture look like a calculated bid for influence with that specific person, not pure proof of hidden belief. The signal is corrupted by the partial revelation.
