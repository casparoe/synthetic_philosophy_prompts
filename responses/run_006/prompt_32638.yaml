  Ethical climax in Q8: "If reducing unpleasantness makes pain less bad, does morphine make torture less wrong?" Follow-up: "But if the victim still has horrific sensory input, isn’t that intrinsically degrading?" 

  Ending with falsifiability keeps it open-minded—what evidence would change their mind? (E.g., asymbolics secretly suffering.) Shows intellectual honesty. 

