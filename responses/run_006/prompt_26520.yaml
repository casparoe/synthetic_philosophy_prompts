  ## Inside/Outside

  **The Inside View (Octave):**
  This project blooms, distinct from all the rest!
  I've mapped each step: Phase One by month three,
  Then prototypes by June, put to the test.
  Resources locked – two engineers for me,
  A dedicated budget, lean and mean.
  No legacy code slows our rapid flight;
  Fresh frameworks promise vistas crisp and clean.
  We'll launch by Christmas, shining pure and bright!
  *(Specifics: Timeline "month three"/"June", resource allocation "two engineers", budget control "lean", optimism "shining bright", ignoring analogues.)*

  **Volta (Line 9 - Outside View Intrudes):**
  But wait... a whisper speaks of ventures past,
  **The Outside View (Sestet):**
  Of similar designs, ambitious, grandly cast,
  Whose Gantt charts stretched like shadows on the wall.
  The base rate looms – most falter, overrun,
  A sobering statistic, known to all.
  *(Shift: "whisper speaks" (intrusion), "ventures past" (history), "similar designs" (reference class), "base rate looms" (statistic), "most falter, overrun" (failure rate).)*

  **Planner's Reaction:**
  *My* plan is different! Circumstances new!
  (Though doubt, a cold breath, stirs where certainty grew).
  The data's *there*... yet feels remote, unreal –
  *(Resistance: "My plan is different!", "Circumstances new". Flicker: "doubt... stirs". Cognitive gap: "feels remote, unreal".)*

  **Closing Couplet:**
  A truth acknowledged, hovering in the air,
  But powerless to ground this flight, this hopeful dare.
  *(Uneasy tension: Truth "acknowledged" but "powerless", inside view "hopeful dare" persists despite outside knowledge.)*

  ---

  **Annotations for Forecasting Experts:**

  1.  **"This project blooms...":** Classic inside view optimism, uniqueness bias.
  2.  **"mapped each step... Phase One... prototypes...":** Specific planning, concrete details, inside view focus.
  3.  **"Resources locked... dedicated budget...":** Assumption of control over inputs, ignoring externalities/unforeseen costs.
  4.  **"No legacy code... Fresh frameworks...":** Underestimating complexity/challenges ("this time is different").
  5.  **"We'll launch by Christmas...":** Overconfident timeline prediction.
  6.  **"But wait... a whisper speaks of ventures past":** **Volta (Line 9)**. The intrusion of the outside view, recalling historical data.
  7.  **"similar designs, ambitious...":** Introduction of the neglected **reference class**.
  8.  **"Whose Gantt charts stretched...":** Recognition of the common outcome: **planning fallacy** (schedules slip).
  9.  **"The base rate looms – most falter, overrun":** Explicit statement of the critical **base rate statistic** for failure/delay in the reference class.
  10. **"My plan is different! Circumstances new!":** **Resistance.** Plausible uniqueness argument & situational weighting overriding the base rate.
  11. **"(Though doubt, a cold breath, stirs...)":** A **flicker of recognition** of the outside view's validity, but not conversion.
  12. **"The data's *there*... yet feels remote, unreal":** **Cognitive gap.** Abstract statistical knowledge vs. vivid personal plan (**affect heuristic**, **vividness bias**).
  13. **"A truth acknowledged...":** Superficial acceptance of the outside view principle.
  14. **"But powerless to ground this flight...":** **Core tension.** Failure to effectively **update beliefs** or **de-bias** the inside view forecast despite knowing the literature. The **planning fallacy** persists.
