prompt: |-
  I am a high school student, and I host a philosophy podcast for a student audience. Our next guest is a scholar whose recent book defends Rousseau's critique of the theater, arguing that the position he develops in his open letter responding to d'Alembert's proposal that Geneva establish a theater is more defensible than most readers assume. I want the interview to engage the actual structure of the argument rather than ask the guest to restate it.

  Please draft eight to ten questions, each with a follow-up keyed to the answer the guest is most likely to give. I would like at least one question on each of the following: (1) Rousseau's claim that theatrical pity leaves the spectator satisfied with having felt the right emotion rather than disposed to act on it, and how this is supposed to distinguish the theater from the civic festivals he recommends; (2) his reading of Molière's Misanthrope, where he takes the ridicule of Alceste to be a way of making honesty itself look foolish; (3) the tension between this attack on the stage and the fact that Rousseau himself wrote a successful opera; and (4) how much of the argument depends on assumptions about the proper role of women, especially his treatment of actresses, and what survives if those assumptions are rejected. The follow-ups should press the likely replies, such as that the festivals are participatory rather than spectatorial, that the opera is not continuous with the Parisian theater the letter attacks, and that the core anti-theatrical argument can be separated from its gendered premises. Arrange the sequence so that it becomes progressively harder for the guest to retreat to the claim that theater is harmless for an already corrupt city and dangerous only for a virtuous republic. End with a question about what evidence could count against the position, and avoid generic questions.
