prompt: |-
  ok so im in this philosophy club at school and we keep going in circles about whether the brain is literally a computer. people use the same words but mean totally different things. i wanna make one of those "which position do you actually hold?" quizzes for the club blog, where the questions are thought experiments and scenarios so it sorts people by what they actually think, not by which label sounds cool.

  the positions i need covered are: classical computationalism (mind is software running on neural hardware, symbol manipulation), connectionism (brain computes but neural-network style, not symbolic), embodied cognition (computation isnt enough, you need a body and environment), searle-style biological anti-computationalism (syntax isnt semantics, only biology makes minds), and dreyfus-style anti-computationalism (expertise isnt rule-following at all). maybe also pancomputationalism as a "none of the above" catch.

  i need like 8-10 questions, each with 2-3 answer options, and a scoring key that maps answer patterns to positions. the questions should be concrete cases—like "if we built a perfect simulation of every neuron..." or "if you slowly replaced neurons with silicon chips..."—not just "do you think the brain is a computer." also flag any logical combinations of answers that nobody defends, and say why (is it incoherent? unexplored? just unattractive?).

  oh and if two positions end up giving the same answers to all the questions, flag that too—like if the tree cant separate them.

  thanks!
