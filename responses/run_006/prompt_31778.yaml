answer: |-
  ### Taxonomy of Positions on Sentience and Moral Status  

  **Root Question: Is there genuine sentience?**  
  *(This question isolates views that deny the reality or coherence of sentience as a property.)*  
  - **No** → **Eliminativism or strong illusionism**  
    - *Commitment*: Sentience is either nonexistent or a conceptually confused/illusory property. No physical system qualifies as sentient; moral status attributed to sentience is misguided.  

  - **Yes** → Proceed to Q2.  

  **Q2: Is sentience solely determined by abstract causal-functional/computational properties?**  
  *(This question separates views that reduce sentience to high-level organizational patterns from those requiring low-level physical properties. "Abstract" here means properties invariant under physical implementation, e.g., input-output mappings or computational state transitions.)*  
  - **No** → *Physical substrate or specific structure matters*. Proceed to Q3.  
  - **Yes** → **Substrate-neutral functionalism** and **Abstract computationalism**  
    - *Commitment*: Sentience arises from the right kind of causal/computational organization, regardless of physical realization (e.g., silicon chips or neural tissue).  
    - *Note*: These positions collapse into the same leaf. Both deny that physical details (beyond implementing the function/computation) are relevant. Functionalism emphasizes causal roles, while computationalism emphasizes formal symbol manipulation, but they share a core commitment to abstraction. No further branching cleanly separates them without invoking label-specific criteria.  

  **Q3: Is sentience restricted to biological systems?**  
  *(This distinguishes biological essentialism from non-biological substrate-specific views.)*  
  - **Yes** → **Biological chauvinism**  
    - *Commitment*: Only carbon-based, evolved neural systems (e.g., human or animal brains) can be sentient. Physical substrate is necessary and sufficient; synthetic systems cannot achieve sentience.  
  - **No** → *Sentience requires non-biological physical properties*. Proceed to Q4.  

  **Q4: Is sentience determined by causal integration (Φ) as defined by IIT?**  
  *(This isolates IIT from other substrate-specific views by its unique commitment to Φ as the definitive marker of sentience.)*  
  - **Yes** → **Integrated Information Theory (IIT)**  
    - *Commitment*: Sentience is identical to a system’s Φ value, which quantifies causal interconnectivity and depends on specific physical structure (e.g., feedback loops in a meshwork). Abstract functional profiles are insufficient; physical implementation matters critically.  
  - **No** → **Empty cell**  
    - *Diagnosis*: No major position occupies this space. It is *unexplored* but not incoherent. A view here would hold that sentience requires non-biological, non-Φ physical properties (e.g., quantum effects, topological constraints). Such a position is possible but lacks influential advocates.  

  ---

  ### Key Observations  
  1. **Fault Lines**:  
     - The deepest divide is between **eliminativism** (denying sentience) and all realist views.  
     - Among realists, the core split is whether sentience is **abstract/functional** (Q2=Yes) or **substrate-dependent** (Q2=No).  
     - Substrate-dependent views split further into **biological** (Q3=Yes) vs. **structural** (Q3=No) requirements.  

  2. **Collapsed Positions**:  
     - **Substrate-neutral functionalism** and **abstract computationalism** are indistinguishable in this tree. Both answer Q2 affirmatively, as they reduce sentience to implementation-invariant properties. Distinguishing them would require questions about the *nature* of computation (e.g., "Must computations be classical?"), but these are not central to the sentience question and risk conflating separate debates.  

  3. **Empty Cell**:  
     - The **Q3=No → Q4=No** cell is empty. It would require sentience to depend on non-biological physical properties *other than Φ* (e.g., spatiotemporal scales, quantum gravity). This space is unexplored, possibly because IIT dominates substrate-specific non-biological theories.  

  4. **IIT’s Distinctiveness**:  
     - IIT is isolated by its rejection of functional abstraction (Q2=No) and its unique dependence on Φ (Q4=Yes). It cannot be assimilated into functionalism (which it explicitly opposes) or biological chauvinism (as it allows non-biological realizations).  

  ### Taxonomy Tree Diagram  
  ```  
  Is there genuine sentience? (Q1)  
  ├── No: Eliminativism/strong illusionism  
  └── Yes: Is sentience solely determined by abstract causal-functional/computational properties? (Q2)  
      ├── Yes: Substrate-neutral functionalism / Abstract computationalism  
      └── No: Is sentience restricted to biological systems? (Q3)  
          ├── Yes: Biological chauvinism  
          └── No: Is sentience determined by Φ? (Q4)  
              ├── Yes: Integrated Information Theory  
              └── No: [Empty: Unexplored physicalist theories]  
  ```  

  This taxonomy forces positions into mutually exclusive leaves based on their core commitments, revealing logical dependencies (e.g., rejecting functional abstraction necessitates substrate-dependence). It also highlights where nuanced differences (e.g., functionalism vs. computationalism) are secondary to the central question of physical realization.
