     - Let's use a simpler example that is standard in the literature: the "no-trade" example from Milgrom-Stokey. Consider an economy with two traders and one asset. The asset value V is a random variable. Both traders have common prior about V. Trader 1 has private information (a signal) S1, and trader 2 has private information S2. The signals are independent given V? Not necessarily.

     - Actually, the standard example in the no-trade theorem is a scenario where trade is proposed and then we show that common knowledge of rationality and the trade offer implies that the trade must be zero conditional on the information of both. 

     - Recommended example: Use the horse race example from Geanakoplos (1992) or a simplified version. Consider two traders, Alice and Bob, and a horse race with two horses, A and B. The asset is a ticket that pays $1 if horse A wins. The common prior is that each horse has a 50% chance. Alice gets a private signal: she learns that horse A has a 70% chance (so she values the ticket at $0.70). Bob gets a private signal: he learns that horse B has a 70% chance (so he values the ticket at $0.30). Now, without considering the informational content, if Alice owns the ticket and Bob does not, then at a price of $0.50, Alice would be willing to sell (because she thinks it's worth only $0.70? Wait, no: she thinks the chance horse A wins is 70%, so the ticket is worth $0.70. She would not sell for $0.50. Bob, who thinks it's worth $0.30, would not buy for $0.50. So again, no trade.

     - We must create a situation where the valuations overlap. How about if we let Alice be the owner and she has a signal that makes her value the ticket at $0.60, and Bob has no ticket and a signal that makes him value it at $0.40. Then at a price of $0.50, without informational effects, Alice would sell (she gets $0.50 for an asset she values at $0.60? No, that's a loss). And Bob would buy (he pays $0.50 for an asset he values at $0.40? No). So no.

     - I see the problem: in a common prior setting, the valuations are martingales of the common prior. The average of Alice's valuation (over her signals) is the prior valuation, and similarly for Bob. And the prior valuation is the same. If they have different valuations, it must be that one is above the prior and the other below. But then the prior valuation is in between? Not necessarily. For example, the prior valuation is 0.5. Alice has 0.6 (above) and Bob has 0.4 (below). Then the prior is between them. But then no price can be above 0.4 and below 0.6 and also acceptable to both? Actually, if Alice is selling and Bob is buying, then for trade to occur, we need a price p such that p >= Alice's valuation and p <= Bob's valuation. But that requires that Alice's valuation <= Bob's valuation. But in this example, 0.6 > 0.4, so no p exists.

     - This is the key: in a common prior setting, if information is private, it is impossible for two rational traders to have valuations that cross (i.e., one above and one below and their valuations overlap) if the signals are such that they are both consistent with the same state. But note: the no-trade theorem does not say that trade never happens; it says that if there is common knowledge of rationality and the trade offer, then trade cannot occur. The above example already shows that without the informational effect, trade doesn't occur. So we need an example where without the informational effect, trade would occur, but then we show that when we account for the informational effect, it doesn't.

     - How can we get trade without informational effects? Only if they have different risk aversion or different endowments? But the theorem assumes no such differences. The theorem is about speculative trade based on differences in information.

     - The standard example that is used to motivate the theorem is one where traders have different information and without considering the informational content of the offer, they would trade. But in a common prior setting, if they are both rational and they both know the structure, then when they see the offer to trade, they update.

     - Example: Let the asset value depend on two independent events. For instance, the asset is worth $1 if both event A and event B occur, $0 otherwise. The common prior: P(A)=0.5, P(B)=0.5, independent. Alice knows whether A occurred, Bob knows whether B occurred. The prior expected value is 0.25. Suppose A has occurred but B has not. Then Alice, knowing A has occurred, values the asset at P(B)=0.5. Bob, knowing B has not occurred, values it at 0. So Alice would be willing to sell for any price above 0.5 and Bob would be willing to buy for any price below 0? No, Bob wouldn't buy at any positive price because he knows the asset is worth 0. But if A has occurred and B has occurred, then Alice knows A occurred (so she values at 0.5) and Bob knows B occurred (so he values at 1). Then Alice would sell for any price above 0.5 and Bob would buy for any price below 1. So if Alice owns the asset and approaches Bob to sell at a price of 0.75, then without informational effects, they would trade. But with informational effects, Bob would think: "Why is Alice selling at 0.75? She knows A. If A had not occurred, the asset would be worth 0 and she would be desperate to sell. But if A occurred, then the asset is worth 0.5 if she doesn't know B, but she doesn't know B. Wait, but Bob knows B. If Bob knows B occurred, then he knows the asset is worth 1. So if Alice offers to sell at 0.75, Bob should be very happy because he knows it's worth 1. But why would Alice sell at 0.75 when she thinks it's worth 0.5? She might be selling because she doesn't know B and she is risk averse? But we assume risk neutrality. So the only reason she would sell at 0.75 is if she doesn't know B and she is content with the profit. However, Bob should wonder: if Alice knows A and if she knew B occurred, she wouldn't sell at 0.75 because it's worth 1. But she doesn't know B. So from Bob's perspective, if he knows B occurred, the asset is worth 1 and he is getting it at 0.75. He doesn't care why Alice is selling. So they trade.

     - This example does not lead to no-trade! It seems to allow trade.

     - We must realize that the no-trade theorem requires common knowledge of the trade offer and rationality. In the above, when Alice offers to sell to Bob at 0.75, Bob doesn't know what Alice knows. But the theorem assumes that the entire trade offer is common knowledge. In a more formal setting, the offer is made and it is common knowledge that it is made. Then Bob realizes that Alice, in every state of the world that she considers possible, is willing to sell at 0.75. But if Alice knows that A occurred, then in the states where A has occurred, she is willing to sell at 0.75. But if she knows that A has not occurred, she would be willing to sell at any positive price (since the asset is worth 0). But then if Bob knows that B has occurred, he would think: Alice is willing to sell at 0.75 regardless of A? But that is not true. Alice's willingness depends on A. But the offer price 0.75 is fixed. How does Alice decide on the price? We need to assume that the price is set by the market or by one of the traders and it is common knowledge that the offer is made at that price.

     - In the standard no-trade theorem, they consider a zero-net-trade contract. For example, a bet. Let's use a bet.

     - Example of a bet: 
          Alice and Bob are considering a bet on the outcome of a coin that is about to be tossed. The coin is fair (common prior). Alice gets a private signal: she is told that the coin is biased towards heads with probability 2/3. Bob gets a private signal: he is told that the coin is biased towards tails with probability 2/3. But note: the signals might be contradictory. How can both be true? They can't. So the state space must account for the signals. This is where we need a state space that includes the signals.

     - Alternatively, use a state space with four states: 
          ω1: the coin is fair, and Alice is told heads with prob 2/3, Bob told tails with prob 2/3? This is messy.

     - A better example is the one used in Milgrom and Stokey (1982): 
          There are two traders and a security that pays $1 in state ω1 and $0 in state ω2. The common prior is (1/2,1/2). Trader 1 has private information: she knows the state. Trader 2 has no private information. Then trader 1, if she knows the state is ω2, would be willing to sell the security for any positive price. Trader 2, without private information, values it at 1/2. So if trader 1 offers to sell at a price of 0.4, trader 2 might accept. But then trader 2 should think: "Why is she selling at 0.4? If she knew it was ω1, she would not sell at 0.4. So she must know it's ω2." Then trader 2 would not buy. So trade doesn't occur.

     - This example works: 
          - In state ω1: trader 1 (knowing ω1) would never offer to sell at 0.4 (because the asset is worth $1).
          - In state ω2: trader 1 (knowing ω2) would be happy to sell at 0.4.
          - Trader 2, if offered to buy at 0.4, would reason: if the state were ω1, trader 1 wouldn't sell, so she is selling only in ω2. Therefore, the asset is worth $0, so I shouldn't buy at 0.4.

     - But this is the lemons example! And it's asymmetric. However, it is the standard setup to illustrate the no-trade theorem. And it is simple. We can make it symmetric by having both traders receive private signals, but then it becomes more complex. 

     - Given the time constraint, use the asymmetric example for simplicity, but then discuss how the theorem generalizes to symmetric settings with common knowledge of the offer.

     - So the carrying example: 
          - Two states: ω1 and ω2, common prior 1/2.
          - Asset pays $1 in ω1, $0 in ω2.
          - Trader 1 (insider) knows the state.
          - Trader 2 (outsider) has no private information.
          - Trader 1 proposes to sell the asset to trader 2 at a price p (where 0<p<1).
          - We show that trade cannot occur in equilibrium.

     - Why? Because if trader 1 offers to sell, trader 2 deduces that trader 1 must know that the state is ω2 (because if it were ω1, she wouldn't sell at p<1). Therefore, trader 2 believes the asset is worth 0 and refuses to buy.

     - This example has common prior and common knowledge of rationality. The trade offer itself is informative.

     - What it lacks: symmetry and the possibility of trade in the absence of the informational effect. In the absence of the informational effect, if trader 2 didn't update, he would be willing to buy at p (because his prior valuation is 0.5 and p<0.5 might be offered). But with updating, he infers the state is bad.

     - So we use this example.

  2. **Introduce Common Knowledge (10 minutes):** 
     - Define common knowledge: A fact is common knowledge if everyone knows it, everyone knows that everyone knows it, and so on ad infinitum.
     - In the example: It is common knowledge that both are rational, that both know the structure of the game (the state space, the prior, the information partitions), and that the offer to sell at price p is made.
     - Explain how trader 2 reasons: 
          - If the state were ω1, trader 1 would not sell at p (because 1 > p). Therefore, the offer to sell at p can only occur in ω2.
          - So upon seeing the offer, trader 2 deduces the state is ω2 and values the asset at 0, hence won't buy at p>0.

  3. **Common Priors vs. Common Knowledge (5 minutes):**
     - Emphasize: The common prior is crucial. If traders have different priors, trade can occur. For example, if trader 2 believes the state is ω1 with probability 0.9 regardless of the offer, then he would buy at p=0.8. But with common prior, they start with the same beliefs.
     - Common knowledge of the offer and rationality is also crucial. If trader 2 is not rational or doesn't understand that trader 1 is rational, trade might occur.

  4. **Ex Ante Pareto Efficiency (5 minutes):**
     - At this point, introduce ex ante Pareto efficiency. Before any information is revealed, the initial allocation is Pareto efficient. Why? Because any trade that would occur must be based on information, but the common prior and the fact that information is symmetric ex ante means that the initial allocation is already efficient.
     - Note: The no-trade theorem says that even after information is revealed, as long as the initial allocation is ex ante efficient and there is common knowledge of rationality and the offer, then no trade can occur.

  5. **Generalize to the No-Trade Theorem (15 minutes):**
     - State the theorem: Under common prior, common knowledge of rationality, and common knowledge of the trade offer, no trade can occur because the very offer to trade would reveal that the trade is not beneficial to one party, leading the other to infer that the trade is not in their interest either.
     - Explain that in the general case, even with symmetric information, the same logic applies. The trade must be common knowledge, and then each trader, by considering the types of the other trader that would trade, updates their beliefs and finds the trade unattractive.
     - Emphasize that the theorem does not require one trader to be better informed than the other; it can be symmetric.

  6. **Addressing Misconceptions (20 minutes):**
     - **Misconception 1: The theorem predicts that real markets should show no trade.**
          - When to address: After stating the theorem.
          - How to counter: Explain that the theorem relies on strong assumptions: common prior, common knowledge of rationality, and common knowledge of the trade offer. In reality, trade occurs for many reasons: differences in priors, liquidity needs, risk-sharing, or because common knowledge fails (e.g., in large markets, the offer is not common knowledge to all). Also, people might trade because they are overconfident (violating common prior) or not fully rational.

     - **Misconception 2: Common priors means everyone has the same information.**
          - When to address: When introducing common priors.
          - How to counter: Emphasize that common prior means that before any private information is received, everyone agrees on the probabilities. Then they receive different private information, so their posterior beliefs differ.

     - **Misconception 3: Private information is a legitimate source of speculative gains from trade.**
          - When to address: After the example, when discussing the theorem.
          - How to counter: The theorem shows that if there is common knowledge of the trade offer and common prior, then private information alone cannot lead to trade. Speculative trade based solely on private information cannot occur in this setting because the offer to trade reveals the private information.

  7. **Final Question/Task (10 minutes):**
     - Pose a variation: Suppose there are three states: ω1, ω2, ω3. The asset pays $1 in ω1, $0 in ω2, and $0 in ω3. The common prior is uniform. Trader 1 knows whether the state is ω1 or not. Trader 2 knows whether the state is ω3 or not. Trader 1 offers to sell the asset to trader 2 at a price of $0.4. Can trade occur? Why or why not?
     - Let the students discuss in pairs. The answer should be that trade cannot occur. 
          - If the state is ω1, trader 1 knows it and won't sell at 0.4 (because the asset is worth $1).
          - If the state is ω2, trader 1 knows it's not ω1, so she knows the asset is worth $0, so she is willing to sell at 0.4. But trader 2, in ω2, knows it's not ω3, so he doesn't know if it's ω1 or ω2. But if he is offered to buy at 0.4, he reasons: 
              - If it were ω1, trader 1 wouldn't sell. 
              - If it were ω3, trader 1 would be willing to sell (since in ω3, the asset is worth $0). But also, in ω2, trader 1 is willing to sell.
              - However, trader 2, upon being offered the trade, knows that the state is not ω1 (because if it were, trader 1 wouldn't sell). So the state must be either ω2 or ω3. In both ω2 and ω3, the asset is worth $0. So trader 2 values it at 0 and won't buy at 0.4.

  8. **Omissions:**
     - Explicitly say: We are not covering the state-space proof, p-belief systems, or the full generality of the theorem. We are also not covering the relationship to Aumann's agreement theorem (which also uses common knowledge and common prior to show that rational agents cannot agree to disagree). These are for advanced study.

  Sequence of the session:

  1. Introduction of the example and the puzzle (asymmetric information, common prior) [15 minutes]
  2. Common knowledge and the reasoning in the example [10 minutes]
  3. Common priors vs. common knowledge distinction [5 minutes]
  4. Ex ante Pareto efficiency and the theorem statement [5 minutes]
  5. Generalization and implications [15 minutes]
  6. Addressing misconceptions [20 minutes] (interwoven but mostly after the theorem)
  7. Final task and discussion [10 minutes]

  Total: 90 minutes.

  The example does the heavy lifting: it is the asymmetric insider-outsider example. It lacks symmetry, but it is simple and clearly illustrates the logic. We use it to show how the offer itself is information and how common knowledge of rationality and the offer lead to no trade.
answer: |-
  **Organize the entire session around the asymmetric insider-outsider example (with a knowledgeable seller and an uninformed buyer) to concretely illustrate how common knowledge of the trade offer undermines speculative trade.**  

  ### **Explanatory Arc Sequence**  
  1. **Introduce the asymmetric example (15 mins):**  
     - **Example:** A seller (informed) knows the true state of an asset (paying $1 in state ω₁, $0 in ω₂; common prior P(ω₁) = P(ω₂) = 0.5). A buyer (uninformed) has no private information. The seller offers to sell at price $0.40.  
     - **What it must have:** Common prior, private information for one party, risk-neutrality, and a trade that seems ex ante plausible without updating (buyer’s prior valuation = $0.50 > $0.40).  
     - **What it must lack:** Symmetry (to avoid signal-crossing complexity) and non-informational motives (e.g., liquidity/risk-sharing). Avoid the lemons example—it confuses quality uncertainty with speculative no-trade.  
     - **Dependencies:** Establish common priors here (shared ex ante beliefs) but not yet common knowledge.  

  2. **Establish common knowledge of the offer and rationality (15 mins):**  
     - **Mechanism:** Show how the buyer reasons: "If the state were ω₁, the seller wouldn’t sell at $0.40 (since the asset is worth $1). Thus, the offer implies ω₂." The seller anticipates this, so no trade occurs.  
     - **Key move:** The offer itself is information. Emphasize that common knowledge (of rationality + the offer) enables infinite regress ("I know that you know I won’t trade in ω₁").  
     - **Dependencies:** Common priors are already in place; common knowledge is defined here (distinction clarified next).  

  3. **Clarify common knowledge vs. common priors (10 mins):**  
     - **Common priors:** Ex ante agreement on probabilities (already used).  
     - **Common knowledge:** Hierarchical knowing (everyone knows, knows they know, etc.) about the offer and rationality.  
     - **Misconception headed off:** "Common priors mean identical information." Counter here by stressing: Priors are shared, but private information causes divergent posteriors—yet trade still fails.  

  4. **Introduce ex ante Pareto efficiency (10 mins):**  
     - **Placement:** After common knowledge is defined.  
     - **Logic:** The initial allocation is ex ante efficient (under common priors). Any trade would require asymmetric information to create gains, but common knowledge of the offer eliminates those gains.  
     - **Dependency:** Efficiency must be established here to set up the theorem’s punchline: No trade preserves efficiency.  

  5. **State the theorem and generalize (15 mins):**  
     - **Theorem:** Under common priors, common knowledge of rationality, and common knowledge of a zero-net-trade offer, no trade occurs.  
     - **Generalization:** Extend the example symmetrically (e.g., both traders get private signals) to show the logic holds without asymmetry.  
     - **Misconceptions headed off:**  
       - *"Private information enables speculative gains":* Counter here—gains vanish because the offer reveals information, aligning valuations.  
       - *"The theorem predicts real markets show no trade":* Stress assumptions (common knowledge, no liquidity/risk motives) rarely hold in reality.  

  6. **Epistemological implications (10 mins):**  
     - Markets as information-aggregation mechanisms fail if trade is common knowledge. Speculative trade requires limits on rationality/common knowledge (e.g., overconfidence, dispersed offers).  

  ### **Final Task (10 mins)**  
  **Question:** *In a variant of the example, the seller is uninformed and the buyer knows the state. The buyer offers to buy at $0.60. Explain why trade cannot occur.*  
  - **Tests understanding:** Students must flip the reasoning—buyer’s offer in ω₂ implies overpayment, so seller infers ω₁ and rejects. Confirms grasp of informational unraveling beyond the initial example.  

  ### **Omissions (State Explicitly)**  
  - **Leave out:** State-space formalization, p-belief systems, Aumann’s agreement theorem linkage, and general proof.  
  - **Reason:** These add technicality without pedagogical value for the core logic/epistemology. Focus on intuition and misconceptions.  

  ### **Misconception Management**  
  - **"Common priors = same information":** Counter in step 3 using the example’s informed/unformed roles.  
  - **"Private information justifies trade":** Crush in step 5—updating from the offer aligns beliefs.  
  - **"Real markets obey the theorem":** Qualify in step 5 by listing violated assumptions (e.g., common knowledge fails in decentralized markets).
