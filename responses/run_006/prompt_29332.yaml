          There are two possible signals, H (high) and L (low), and two states of the world: G (good) and B (bad). The asset pays $1 in G and $0 in B. The common prior: P(G)=P(B)=1/2. The signals are conditionally independent and symmetric: P(H|G)=P(L|B)=2/3, P(L|G)=P(H|B)=1/3.

          Now, if both traders get a signal, then:
            - If Alice gets H, she believes P(G|H) = (2/3)/(2/3+1/3) = 2/3, so she values the asset at 2/3.
            - If Bob gets L, he believes P(G|L) = (1/3)/(1/3+2/3)=1/3, so he values at 1/3.

