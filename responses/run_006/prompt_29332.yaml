  We are given a 90-minute seminar for an audience of economics PhD students and philosophers of science. They know expected utility and Bayes' rule but are new to common knowledge and the no-trade theorem. The goal is to explain the theorem and its implications for the epistemology of markets without proving it. We must structure the session with careful attention to dependencies, including when to introduce common knowledge vs. common priors, when ex ante Pareto efficiency is needed, and when the idea that "the offer itself is information" becomes crucial. We also need to choose an example, identify misconceptions and when to counter them, end with a question/task to test understanding, and note what to omit.

  Bottom line: The entire session should be organized around the example of a speculative trade scenario that is symmetric and has a common prior, but where traders have private information, and then show that common knowledge of rationality and the trade offer leads to no trade.

  Reasoning and Plan:

  1. **Starting Point (15 minutes): Introduce the setting and the puzzle of speculative trade.**
     - Begin with a simple example: Two traders (Alice and Bob) and an asset with an uncertain value. The asset pays either $0 or $100. There is a common prior (say, 50-50). Each trader receives a private signal (e.g., Alice sees a signal A, Bob sees signal B). The signals are conditionally independent given the true state. The key is that both traders are rational, risk-neutral, and want to maximize expected profit.
     - The puzzle: Why would they trade? If Alice wants to sell to Bob, Bob should think: "Why is Alice selling? Maybe she knows something bad." Similarly, Alice might think Bob is buying because he knows something good. So the very offer to trade might be informative.
     - Example choice: We need an example that is symmetric and has a common prior. The used-car (lemons) market is asymmetric (seller knows quality, buyer doesn't) and leads to trade breakdown only for low quality. Instead, use a symmetric speculative trade example. For instance:
          - There are two states of the world: ω1 (asset worth $100) and ω2 (asset worth $0). Common prior: each state has probability 0.5.
          - Each trader gets a private signal: Alice gets a signal which is either "a" or "b", and Bob gets a signal which is either "x" or "y". The signals are conditionally independent and symmetric: 
              P(signal a | ω1) = P(signal x | ω1) = 2/3, 
              P(signal b | ω1) = P(signal y | ω1) = 1/3,
              and similarly, P(signal a | ω2) = 1/3, etc.
          - Now, suppose Alice has signal "a" (so she believes the asset is likely to be worth $100: her posterior is (2/3) of $100 and (1/3) of $0, so $66.67). Bob has signal "y" (so his posterior is (1/3) of $100 and (2/3) of $0, so $33.33). 
          - Without considering the informational content of the offer, it seems they can trade at, say, $50: Alice (who values at $66.67) would be willing to sell at $50? No, she wouldn't because she thinks it's worth more. But wait: Bob, who values at $33.33, would be willing to buy at $50? No, he wouldn't because he thinks it's worth less. So in this case, no trade would occur even without the informational effect. We need a scenario where without the informational effect, trade would occur.

     - Adjust the example: Let the signals be such that they have opposite effects but strong enough to make trade seem profitable without the informational effect. For instance, change the signal structure to be more extreme. Alternatively, change the setting: 
          - Consider a setting where both traders are currently holding the asset and they are considering a bet. For example, they are considering a small trade: Alice offers to sell one unit to Bob at a price p. But we want to show that even if they have different valuations initially, the offer to trade might change their valuations.

     - Revised example: Use the standard example in no-trade theorems: two traders, one asset, and they are considering a trade. The key is that the trade must be zero-sum (speculative) and not due to risk-sharing or liquidity needs. We assume both are risk-neutral and there are no other motives. We need a scenario where without considering the informational content of the offer, trade would occur. So let's design a state space and signals such that one trader is optimistic and the other is pessimistic.

          State space: four states, to allow for two independent signals. Let ω in {ω11, ω12, ω21, ω22}. The asset value is V(ω) = 100 if the first index is 1, and 0 if the first index is 2. The common prior is uniform (each state 1/4). Alice observes the first index (so she knows whether the value is 100 or 0) but Bob observes the second index (which is uninformative about the value). Then Alice has an informational advantage. But this is asymmetric. We want symmetry.

