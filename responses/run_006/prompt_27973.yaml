  5. **Conceptual incoherence:** Philosophers arguing that pain's essence includes badness.
  6. **Motivational necessity:** If avoiding harm requires badness, separability becomes problematic.
  7. **Phenomenological unity:** If people report pain as inherently unpleasant, it challenges the separability.

  For each, I'll note seriousness: "fatal" for top, "awkward" for bottom. I'll also indicate which defeaters a defender might concede—e.g., they'd fight #1 but admit #7 is tricky.

