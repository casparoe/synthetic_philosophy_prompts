  Ranking them: The most damaging should be direct contradictions to the core idea. For example, if pain's badness is intrinsic, that would destroy the separability thesis. Less serious might be alternative explanations that are plausible but don't fully refute it. I'll aim for logical progression from fatal to manageable.

  Brainstorming defeaters:
