answer: |-
  Below is a systematic translation of speech act theory into novelist's craft vocabulary, followed by a residue report identifying untranslatable concepts and their implications for fiction writing. I’ve structured this as a **craft manifesto**—a toolkit for diagnosing dialogue and character dynamics through a narrative lens.

  ---

  ### **Novelist’s Translation of Speech Act Theory**  
  *(Austin/Searle Remixed for the Page)*  

  1. **Performatives → Scene-Level Character Contracts**  
     *Philosophy*: Utterances that *create* reality ("I promise," "I resign").  
     *Novelist’s Lens*: **Dramatic Promises**. When a character declares an oath, threat, or vow *in scene*, it becomes a binding contract with the reader. The "felicity conditions" (context/character authority making it valid) are the **character’s credibility** + **scene stakes**. If a liar swears on their mother’s grave, the contract is void—readers feel the hollowness.  

  2. **Illocutionary Force → Subtextual Action**  
     *Philosophy*: What’s *done* by speaking (warning, accusing, seducing).  
     *Novelist’s Lens*: **Dialogue as Weapon/Tool**. Every line has a *dramatic function*:  
     - A question isn’t seeking answers—it’s **power-testing** ("Where were you last night?" = *I own your secrets*).  
     - A compliment is **emotional camouflage** ("Your dress is lovely" = *I see your vulnerability*).  
     Searle’s "taxonomy" (directives, commissives, etc.) maps to **intent tags**: not "she asked," but "she needled," "she baited," "she surrendered."  

  3. **Perlocutionary Effect → Narrative Consequence**  
     *Philosophy*: The *result* of speech (frightening, persuading).  
     *Novelist’s Lens*: **Ripple in the Character Ecosystem**. The effect lives in:  
     - **Micro-reactions**: A flinch, a hesitation, a shifted gaze.  
     - **Scene Turn**: When "I love you" triggers cold silence, *that’s* the perlocution.  
     - **Broken Patterns**: If a character’s manipulative charm stops working, the perlocution has failed.  

  4. **Uptake → Reader/Character Inference**  
     *Philosophy*: The listener's *recognition* of the speech act’s intent.  
     *Novelist’s Lens*: **Subtextual Resonance**. Uptake succeeds when:  
     - The *reader* decodes the subtext ("I’m fine" = devastation).  
     - Another character *reacts* to the true intent (ignoring words, responding to tone).  
     Uptake fails when subtext drowns in exposition or a character’s POV obscures intent.  

  5. **Felicity Conditions → Narrative Grounding**  
     *Philosophy*: Conditions making a speech act "work" (authority, context, sincerity).  
     *Novelist’s Lens*: **Credibility Scaffolding**. For a speech act to land:  
     - **Character Authority**: A king’s decree vs. a beggar’s plea—weighted by status, history, charisma.  
     - **Scene Physics**: A confession during a hurricane ≠ confession over breakfast.  
     - **Setup/Consequence**: An unpunished threat breaks felicity—readers feel cheated.  

  6. **Locutionary Act → Surface Text**  
     *Philosophy*: The literal meaning of words.  
     *Novelist’s Lens*: **The Distraction Layer**. What’s spoken is often the least important element. Use it to:  
     - Mask true intent (lies, deflection).  
     - Create irony (cheerful words in a grave situation).  
     - Contrast with action (a vow to quit drinking while pouring whiskey).  

  ---

  ### **The Residue Report: What Doesn’t Translate**  
  *(And Why It Matters)*  

  1. **Distinctions That Map Cleanly**  
     - **Illocutionary Force ≈ Subtextual Action**: Novelists intuitively track "what's *done*" with dialogue. Searle’s categories (e.g., "commissives" as promises) align with **character contracts**.  
     - **Perlocutionary Effect ≈ Dramatic Consequence**: Writers obsess over reactions and consequences.  
     - **Uptake ≈ Subtext Decoding**: "Show, don’t tell" *is* the craft of making uptake visible through behavior.  

  2. **Distorted in Translation**  
     - **Felicity Conditions**: Novelists compress these into **character credibility** and **stakes**, but philosophers dissect institutional authority (e.g., a priest’s power to marry). *Distortion*: In fiction, authority is fluid—a child’s vow can shatter a family without institutional weight. *Why*: Novelists care about *emotional* truth, not social pragmatics.  

  3. **Untranslatable Residue**  
     - **Propositional Content vs. Illocutionary Force**: Austin separates the literal statement ("It’s cold") from its function (a request to close the window). Novelists *fuse* them: the literal is a delivery system for subtext. **Blind Spot?** Possibly—over-focusing on subtext can make dialogue overly coded. Not every line needs a hidden dagger; sometimes "It’s cold" just builds atmosphere.  
     - **Pure Constatives (Descriptives)**: Philosophers debate if statements like "The cat is black" *only* describe. Novelists reframe them as **characterization tools** (a pedant stating facts vs. a poet noticing shadows). *Residue*: Speech act theory’s obsession with "truth conditions" feels academic—fiction thrives on subjectivity and unreliability.  
     - **Institutional Performatives**: Austin’s "I name this ship..." relies on ceremony/social rules. In fiction, these become **ritual scenes** (weddings, trials), but the *power* comes from character emotions, not the institution. *Why Untranslatable*: Novelists bypass social mechanics for psychological stakes.  

  ---

  ### **The Verdict: What Novelists Gain (and What They Rightly Ignore)**  
  - **Blind Spot Revealed**: Speech act theory highlights **uptake failure**—when intent is missed due to power imbalances (e.g., marginalized voices unheard). Novelists can use this to craft scenes where subtext *isn’t* decoded, exposing dysfunctions (e.g., a wife’s plea met with a husband’s cheerful dismissal).  
  - **Philosophical Baggage**: Distinctions like "locutionary vs. illocutionary" over-formalize what novelists handle via **voice** and **POV**. A line like "Of course I trust you" reads as sarcastic or earnest based on context—no taxonomy needed.  
  - **Power Upgrade**: Borrow **felicity conditions** to diagnose weak scenes. If a threat feels weightless, ask: *Is the character’s authority established? Are consequences inevitable?*  

  > **Final Craft Insight**: Speech act theory’s core contribution is its **insistence that words are events**. Novelists already treat dialogue as action—but philosophers remind us that language *fails*, crashes, or mutates in transit. Harness the residue by letting dialogue misfire, letting promises crumble without payoff, letting characters speak into voids. That’s where the truth lives.  

  Let me know if you'd like to test-drive these concepts against a specific scene—I'll reframe it as a dialogue autopsy.
