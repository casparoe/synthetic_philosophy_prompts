answer: |-
  ### The Phenomenon and Its Name
  The situation you describe in the three-member research panel—where the majority judgment on each condition (methodology sound and consent adequate) indicates that both are met, yet the majority vote on the overall decision is to reject—is a well-known issue in social choice theory and judgment aggregation. This specific phenomenon is called the **doctrinal paradox** (also known as the **discursive dilemma**). It arises when individual judgments on logically interconnected propositions are aggregated using majority rule, leading to collective inconsistency even though all individuals are fully consistent in their personal reasoning.

  - **What it covers**: The doctrinal paradox applies to group decision-making on a set of premises (e.g., conditions or criteria) that are linked by a logical rule (e.g., "approve if and only if all premises are true"). Each member votes on each premise and on the conclusion (overall decision) in a way that respects the logical rule individually. However, when majority voting is applied separately to each proposition, the group may end up with inconsistent collective judgments (e.g., "both premises are true" but "the conclusion is false"). This paradox highlights a flaw in proposition-wise majority voting when propositions are interdependent.

  This is distinct from the Condorcet paradox and Arrow's theorem, as you suspected:
  - **Condorcet paradox** concerns cyclical majority preferences in rankings (e.g., A > B, B > C, C > A), which can occur with three or more options but involves no logical constraints between propositions. It is about preferences, not judgments on truths.
  - **Arrow's theorem** shows the impossibility of a "fair" preference aggregation rule (e.g., for social welfare functions) that satisfies certain axioms, but it, too, deals with ordinal preferences, not binary judgments with logical connections.
  The doctrinal paradox, by contrast, focuses on aggregating judgments about facts or conditions under logical rules (e.g., conjunction, as in your case).

  ### Is the Group Irrational in the Research Panel Case?
  In the research panel scenario, the group is **collectively irrational** because it holds inconsistent beliefs:
  - By majority vote, the group judges that methodology is sound (2–1) and consent is adequate (2–1), implying both conditions are met.
  - By majority vote, the group rejects the project (2–1), implying that not both conditions are met.
  - This contradicts the governing rule: "approve if and only if both conditions are met." Thus, the group believes both conditions are true and not true simultaneously—a logical inconsistency.

  However, this irrationality stems from the aggregation method (majority voting on each proposition separately), not from any individual member. Each member is perfectly consistent:
  - A: Methodology sound (yes), consent inadequate (no) → reject (consistent).
  - B: Methodology unsound (no), consent adequate (yes) → reject (consistent).
  - C: Both sound and adequate (yes) → approve (consistent).

  The problem arises because proposition-wise majority voting ignores the logical dependencies between the conditions and the conclusion. The group's inconsistency is a systemic issue of the voting procedure, not a failure of individual reasoning.

  ### The Hiring Committee Case: Same Phenomenon or Resemblance?
  The hiring committee scenario you describe—where each of four criteria is passed by majority, but the holistic overall decision is rejected by majority—is **essentially the same phenomenon** (the doctrinal paradox), provided that:
  - The criteria are listed as strict requirements (i.e., the appointment should be approved only if all criteria are satisfied).
  - Each member is individually consistent, meaning they only vote to approve if they believe all criteria are met (and reject otherwise), even though the final vote is "holistic" in interpretation.

  In this case, the paradox occurs for the same reason as in the research panel: majority voting on each criterion can yield "all true" collectively, while majority voting on the holistic decision yields "reject," creating inconsistency. The "holistic" label might suggest that members have flexibility in how they weigh criteria, but the key point is that the paradox can still arise if all members adhere to the logical rule individually (i.e., no one approves unless all criteria are met in their view).

  However, if the "holistic judgment" allows members to be inconsistent with the stated criteria (e.g., approving even if some criteria are unmet, or rejecting even if all are met), then the situation is only a **superficial resemblance**. In that case:
  - The inconsistency at the group level may reflect genuine disagreement about the importance of criteria or flexible standards, rather than a paradox of logical aggregation.
  - But since you specify that "no individual member has to be inconsistent," the core issue remains the doctrinal paradox: the voting method, not individual behavior, causes the group-level inconsistency.

  Thus, under your description, the hiring case is the same phenomenon, just with more premises (four criteria instead of two). The doctrinal paradox can occur with any number of premises (k ≥ 2) and any logical rule (e.g., conjunction, as here).

  ### Conceptual Carving: Nearest Concepts, Differences, and Edges
  To clarify the intellectual landscape, here's a breakdown of related concepts, how they differ, and when the paradox arises:

  1. **Doctrinal Paradox (Judgment Aggregation Paradox)**:
     - **Definition**: A group decision-making scenario where individuals vote on premises and a conclusion linked by a logical rule, but majority voting on each proposition leads to collective inconsistency.
     - **Key feature**: Individuals are consistent with the logical rule; the paradox emerges from aggregation.
     - **Example**: Your research panel case—premises are "methodology sound" and "consent adequate"; conclusion is "approve"; rule is "approve iff both premises true."
     - **Scope**: Applies to any binary judgments with logical constraints (e.g., multiple premises with AND, OR, or more complex rules).

  2. **Condorcet Paradox (Voting Paradox)**:
     - **Definition**: A cyclical majority preference in rankings (e.g., majority prefers A > B, B > C, and C > A), leading to no stable majority winner.
     - **Key difference**: Involves preferences over options, not judgments on propositions with logical links. No inconsistency in beliefs— just intransitivity in comparisons.
     - **Edge**: Condorcet arises with ≥3 options and pairwise voting; doctrinal paradox requires logical connections between propositions (e.g., premises and conclusion).

  3. **Arrow's Impossibility Theorem**:
     - **Definition**: Shows that no preference aggregation rule (e.g., for social welfare) can simultaneously satisfy fairness axioms (unanimity, non-dictatorship, independence of irrelevant alternatives) when ranking ≥3 options.
     - **Key difference**: Concerns ordinal preferences and social orderings, not truth-judgments on interconnected propositions. It is a broader impossibility result, while the doctrinal paradox is a specific inconsistency under majority rule.
     - **Edge**: Arrow's theorem applies to preference aggregation; doctrinal paradox to judgment aggregation. However, both reveal flaws in democratic decision-making.

  4. **Nearest Concept: List-Pettit Theorem**:
     - A generalization in judgment aggregation showing that no aggregation rule can always satisfy universal domain, collective rationality, unanimity, and independence for non-trivial logical agendas. The doctrinal paradox is a simple case of this impossibility.
     - **Relation**: Your cases illustrate why such impossibilities exist—majority voting violates collective rationality when propositions are interdependent.

  **When Do the Two Tallying Methods Come Apart?**
  The "two ways of tallying" refer to:
  - **Premise-based tally**: Aggregate votes on each condition/criterion; derive the decision from the collective judgments (e.g., approve if both conditions pass by majority).
  - **Conclusion-based tally**: Aggregate votes directly on the overall decision (e.g., approve if majority votes yes).

  These methods come apart under the following conditions:
  - **Divergence condition**: When the set of members supporting all premises does not form a majority, but each individual premise is supported by a (different) majority. In your research panel:
    - Supporters of methodology sound: A and C (majority).
    - Supporters of consent adequate: B and C (majority).
    - Supporters of both premises: Only C (not a majority).
    - Thus, premise-based tally says "approve" (both pass), but conclusion-based tally says "reject" (A and B reject).
  - **General case for k premises**: With n members, divergence occurs when each premise has majority support, but the intersection of all majority-supported premises has fewer than majority support (i.e., no majority subgroup agrees on all premises).
  - **Probability**: Divergence is more likely with more premises, smaller groups, or greater disagreement on why to reject (e.g., members reject for different missing premises).

  **When Must the Tallying Methods Coincide?**
  The methods must coincide if:
  - **Unanimity**: All members agree on all judgments (e.g., all vote identically on premises and conclusion).
  - **Common majority**: There exists a majority of members who support all premises (and thus all support the conclusion). For example:
    - If A, B, and C all agree that both conditions are met, majority approves, and both conditions pass.
    - If a majority supports all premises, they all vote to approve, ensuring majority approval; conversely, if majority approves, all approvers must support all premises (by the rule), so each premise has majority support.
  - **Lower disagreement**: If premises are highly correlated in individual judgments (e.g., members rarely support one without the other), coincidence is more likely.

  **Practical Implications and Avoiding the Paradox**
  - **In the research panel**: The irrationality could be mitigated by:
    - **Premise-based decision**: Follow the governing rule strictly—approve if both conditions pass by majority vote (ignoring the overall vote tally). This respects the logical rule but may feel undemocratic.
    - **Conclusion-based decision**: Use only the overall vote (as the chair did), but this risks ignoring the conditions.
    - **Structured deliberation**: Discuss to build consensus or use alternative rules (e.g., supermajority, sequential voting).
  - **In the hiring committee**: If criteria are strict requirements, premise-based voting avoids inconsistency. If "holistic" allows flexibility, define clear standards to reduce ambiguity.
  - **General takeaway**: The paradox highlights that majority voting on individual propositions is unreliable for interconnected decisions. Groups should choose one aggregation method upfront and stick to it to prevent inconsistency.

  In summary, the doctrinal paradox captures your experience, revealing how individually rational voters can produce collectively irrational outcomes under majority rule. It differs from preference-based paradoxes like Condorcet and Arrow but shares their spirit of aggregation challenges. Both your cases are instances of this phenomenon, and the edges lie in the group's composition and the logical structure of the decision.
