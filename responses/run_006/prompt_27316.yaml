  Okay, the user is describing a problem in modeling uncertain evidence within Bayesian epistemology. They've encountered difficulties with both standard conditionalization and Jeffrey conditionalization, particularly around the underdetermination of posterior probabilities when evidence is uncertain. 

  The core issues they're wrestling with are: 
  First, the propagation problem - how to update non-evidential propositions when setting P(mug)=0.85 directly. Jeffrey's rigidity condition fixes this by preserving conditional probabilities, but the user questions why rigidity should be privileged over other update methods. 

  Second, the partition selection problem - Jeffrey's method requires choosing a partition to conditionalize over, but many partitions seem equally valid (mug/not-mug, ceramic object/not, etc.) and yield different results. 

  Third, they're implicitly asking about the justification for rigidity itself - why should conditional probabilities remain fixed when the evidence is uncertain?

  I recall this cluster is well-known in formal epistemology. The propagation issue relates to what's called the "commutativity" problem - different update paths lead to different results. The partition problem is famously discussed in the literature, with authors like Field and Garber noting it. The rigidity justification connects to Dutch book arguments and minimal change principles. 

  While "Jeffrey's problem" might colloquially refer to the partition issue, the most comprehensive term seems to be "the problem of uncertain evidence" itself, which encompasses all these sub-issues. Some papers specifically call out "the partition dependence of Jeffrey conditionalization." 

  The user seems technically sophisticated - they're clearly read Jeffrey and understand the formal machinery. Their frustration comes from seeing how these theoretical gaps impact real-world applications. I should emphasize that these aren't just academic concerns; the problems genuinely affect how we model belief revision under uncertainty. 

  For the coinage request: established terms are sufficient here. "Problem of uncertain evidence" covers the territory while "partition dependence" and "rigidity justification" handle the sub-problems. No need for new jargon when existing labels already map well to their concerns.
answer: |-
  Your problem centers on the core challenges of updating beliefs under **uncertain evidence** within Bayesian frameworks. The issues you describe—underdetermined posteriors, partition dependence, and rigidity justification—are interconnected facets of a well-known cluster in formal epistemology and decision theory. Here's how they map to established concepts:

  1.  **The Propagation Problem (Underdetermined Posteriors):**
      *   **Issue:** When setting P(M) = 0.85 directly, how do you update probabilities of *other* propositions (P(Spoon), P(Dim lighting))? Why choose one propagation method over another?
      *   **Label:** This is often discussed as the **problem of belief kinematics** or the **minimal revision problem**. It asks how to minimally alter a belief state to accommodate a new constraint (like a changed credence in M). Jeffrey's rigidity is *one* proposed solution.

  2.  **The Partition Selection Problem:**
      *   **Issue:** Jeffrey conditionalization requires choosing a partition (e.g., {Mug, ~Mug} vs. {Ceramic Object, ~Ceramic Object} vs. {Spouse's Mug, My Mug, Not Mug}) over which rigidity holds. Different partitions lead to different posteriors. What justifies choosing one partition over another? Why is the partition itself not part of the evidence?
      *   **Label:** This is famously known as the **problem of the partition dependence of Jeffrey conditionalization** or the **basis problem**. It highlights that Jeffrey's rule is sensitive to an apparently arbitrary choice.

  3.  **The Justification of Rigidity:**
      *   **Issue:** Why should we assume that conditional probabilities *given* the partition elements (e.g., P(Spoon | Mug), P(Spoon | ~Mug)) remain *unchanged* by the uncertain evidence? What justifies this specific constraint on belief revision?
      *   **Label:** This is the **justification of the rigidity condition**. Arguments often appeal to **evidential independence** (the experience doesn't directly affect Spoon given Mug status), **diachronic Dutch books**, **minimal change principles**, or **causal structure**, but it remains a point of philosophical debate.

  **How They Fit Together:**

  These problems are deeply intertwined aspects of modeling **uncertain evidence**:
  *   Uncertain evidence necessitates *some* method to update beliefs beyond simple conditionalization.
  *   Jeffrey's rule offers a solution (rigidity over a partition) to the propagation problem, but it:
      *   Requires justifying rigidity itself.
      *   Introduces the partition selection problem.
  *   The partition selection problem arises precisely *because* uncertain evidence doesn't cleanly specify a single proposition to conditionalize on; the partition acts as a proxy, but choosing it is non-trivial.
  *   The justification for rigidity is partly motivated by the need to solve the propagation problem *without* introducing arbitrary changes, but its applicability hinges on the chosen partition.

  **Established Label:**

  The most encompassing established label for this tangle is the **problem of uncertain evidence** itself. Within this broad problem, the specific sub-problems you highlight are well-recognized:

  *   The **partition dependence of Jeffrey conditionalization** is the most widely discussed and named specific issue related to the arbitrariness of the partition choice.
  *   The **justification of rigidity** is a core theoretical question within the Jeffrey framework.
  *   The **propagation/kinematics problem** underlies the motivation for both Jeffrey's approach and its alternatives.

  **Conclusion:**

  Your description perfectly captures the central difficulties in applying Bayesian updating to uncertain perceptual evidence. While "problem of uncertain evidence" is the overarching term, the specific challenge of **partition dependence** is the most directly named facet addressing the arbitrariness concern. The justification of rigidity and the propagation problem are essential components tightly bound to it within the Jeffrey framework.

  \answer{partition dependence of Jeffrey conditionalization}
