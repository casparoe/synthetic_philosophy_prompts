prompt: |-
  I'm trying to settle, for myself, when, if ever, I may form a moral belief on someone else's say-so rather than by working the matter through myself, and I keep finding that the debate is conducted through single cases — a friend whose moral judgment you trust, a stranger, the moral consensus of a community, a self-described expert — while the criteria of adequacy are left implicit. Before I read any more of it, I want the specification. What must a theory of moral testimony get right, whatever verdict it finally defends, if it is to be adequate for deciding when deference is epistemically and practically legitimate?

  Write the desiderata: the cases it must handle (including, at least, the trusted friend, the stranger, community consensus, and the expert who has worked through the arguments); the distinctions it cannot collapse — for example, between acquiring a moral belief from testimony and acquiring moral understanding, between testimonial knowledge and the moral worth or autonomy of acting on it, and between moral and non-moral testimony if you think that asymmetry is real; and the constraints it must respect from epistemology and moral psychology, with the consideration behind each. Then mark which requirements are non-negotiable and which are merely the property of one camp; flag any pair of requirements you suspect cannot be jointly satisfied; and say which single requirement does the most to exclude the standard views.

  Close with a short scorecard of the pure optimist, the pure pessimist, and the understanding-based view against the list — but keep the weight on the criteria, not the scoring. Lead with your bottom line in the first sentence (the one requirement that does the most work, or the compressed list), then give the reasoning; no preamble, no restating of the question.
reasoning: |-
  Okay, the user is asking for a set of criteria to evaluate theories of moral testimony. They want to know what makes such a theory adequate, covering specific cases like trusting a friend, a stranger, community consensus, or an expert. They also want distinctions that shouldn't be collapsed, like between belief and understanding, and constraints from epistemology and moral psychology.

  First, I need to recall the main positions in the debate: optimists who think moral testimony can give knowledge, pessimists who deny that, and understanding-based views that focus on moral understanding. The user wants desiderata that any adequate theory must satisfy, regardless of which side it takes. 

  The user mentioned several cases: trusted friend, stranger, community consensus, expert. A good theory must handle all these without treating them the same. For example, trusting a friend might involve personal rapport, while an expert has epistemic credentials. The theory should explain why deference might be legitimate in some but not others.

  Next, distinctions. Belief vs. understanding is crucial. Testimony might give belief but not understanding, which affects moral agency. Also, autonomy: even if you get knowledge, acting on it might lack moral worth if not based on your own reasoning. Then there's the asymmetry question: is moral testimony different from non-moral, like facts about physics? Some think it is, others don't. The theory must address this without assuming the answer.

  Constraints from epistemology: any moral belief acquired through testimony must meet general epistemic standards, like justification. Moral psychology factors include how moral judgments are tied to emotions or motivations. If testimony doesn't engage these, it might not result in genuine moral commitment.

  Now, non-negotiable requirements. Probably, handling all the cases is essential. Also, maintaining the belief-understanding distinction. Without that, the theory misses a key issue. Constraints like epistemic justification are also non-negotiable; a belief without justification isn't knowledge.

  Conflicts: The autonomy requirement might clash with epistemic permissibility. If acting on testimony undermines autonomy, but epistemology says it's justified, how does the theory reconcile that? Also, the asymmetry constraint might conflict with epistemic universalism if moral testimony is treated differently without good reason.

  The most excluding requirement is likely the Understanding Requirement. It forces theories to explain why testimony might not confer understanding, which challenges pure optimists who say testimony gives knowledge but not understanding. Pessimists might reject testimony altogether, but understanding-based views navigate by valuing understanding over mere belief.

  For the scorecard: Pure optimists handle cases like experts well but struggle with understanding. Pessimists deny most deference, failing cases like friends. Understanding-based views prioritize understanding, so they might allow testimony in some cases but require personal engagement for understanding.

  The bottom line: The Understanding Requirement does the most to exclude standard views because it highlights a gap between knowing a moral fact and truly grasping it, which challenges both optimists and pessimists in different ways.
answer: |-
  **The Understanding Requirement (distinguishing testimonial moral belief from moral understanding) does the most to exclude standard views and is central to a demanding adequacy criterion.** Here are the full desiderata for an adequate theory of moral testimony, categorized with critical annotations:

  ### **I. Cases the Theory Must Handle**
  1.  **Trusted Friend:** Deference based on personal knowledge of the other’s character, consistency, and general judgment, not necessarily their moral expertise.
  2.  **Stranger:** Deference based solely on surface cues (e.g., apparent sincerity, confidence) or circumstantial context (e.g., they are affected parties).
  3.  **Community Consensus:** Deference to widely held norms or judgments within a cultural/social group, regardless of personal endorsement.
  4.  **The Argued Expert:** Deference to someone who demonstrably possesses deep knowledge of relevant facts, reasoning skills, ethical frameworks, and has sincerely engaged with counterarguments.
      *   *Non-negotiable:* A theory must credibly address *all four* without reducing them to trivial variations.

  ### **II. Essential Distinctions the Theory Cannot Collapse**
  5.  **Belief vs. Understanding:** Must explain why acquiring a justified true moral *belief* via testimony might be possible while acquiring genuine moral *understanding* (grasping the "why") is not, or is significantly harder. *(Non-negotiable – core to the debate)*
  6.  **Epistemic Legitimacy vs. Moral Worth/Autonomy:** Must separate whether testimony can provide *knowledge/justified belief* (epistemology) from whether acting on that belief preserves *moral agency, responsibility, or the distinctive value of moral action* (moral psychology/practical reason). *(Non-negotiable – reflects distinct domains)*
  7.  **Moral vs. Non-Moral Testimony:** Must explicitly address whether (and why) moral deference is fundamentally different in kind or degree from deference on non-moral matters (e.g., historical facts, chemistry), if asymmetry is posited. *(Constraint: Must engage the asymmetry claim without assuming it true/false)*

  ### **III. Key Constraints from Epistemology & Moral Psychology**
  8.  **Epistemic Justification (Epistemology):** Must respect general norms of testimonial justification (e.g., competence and sincerity of the speaker, reliability in the domain, absence of defeaters). *(Non-negotiable – a theory denying this is epistemically incoherent)*
  9.  **Motivational Internalism Constraint (Moral Psychology):** Must account for the plausible link between sincere moral judgment and motivation to act accordingly. If testimony provides belief, does it provide the *motivation*? If not, what does this imply? *(Constraint: Must engage with internalism without necessarily endorsing it)*
  10. **Autonomy/Agency Constraint (Moral Psychology/Practical Reason):** Must explain how deference interacts with the value of forming one's own moral commitments and taking responsibility for them. *(Non-negotiable for most views; core to pessimism)*
  11. **Understanding Requirement (Epistemology/Moral Psychology):** Must explain the value and potential necessity of *moral understanding* for full moral agency, responsible action, or resilience in the face of challenges, and why testimony might be deficient here. *(Does the most exclusionary work – see below)*

  ### **Annotations: Conflicts & Negotiability**
  *   **Suspected Conflict:** **Autonomy Constraint (10)** and **Epistemic Justification (8)** are in tension. Meeting epistemic standards might permit deference, while autonomy concerns condemn it. Reconciling this is a major hurdle.
  *   **Suspected Conflict:** **Asymmetry Constraint (7)** and **Epistemic Universalism (implied by 8)** conflict if one insists moral testimony must meet *identical* epistemic standards as non-moral testimony. Asymmetry claims often rely on differences in justification conditions or value.
  *   **Non-Negotiable:** Handling core cases (1-4), Belief vs. Understanding distinction (5), Epistemic Justification constraint (8), Autonomy/Agency constraint (10). These define the problem space.
  *   **Camp-Specific:** Strong versions of Motivational Internalism (9 – often favored by pessimists) and strong Asymmetry claims (7 – defining feature of pessimism/qualified views). The *degree* of emphasis on the Understanding Requirement (11) separates camps.

  ### **Why the Understanding Requirement (11) is Most Exclusionary**
  It directly challenges both pure optimism and pure pessimism:
  *   **Pure Optimism** often struggles to explain why *mere* testimonial knowledge might lack something crucial (understanding) needed for ideal agency or fully valuable action, even if it’s knowledge.
  *   **Pure Pessimism** often relies *solely* on understanding/autonomy deficits to reject epistemic legitimacy, which the Understanding Requirement highlights but doesn't *necessarily* entail epistemic illegitimacy. It forces pessimists to show why lacking understanding makes the belief unjustified *or* why understanding is a necessary condition for justification/knowledge in morality specifically.
  *   It demands that *any* adequate theory explain the distinctive role of understanding in morality and its relationship to testimony, exposing gaps in views that focus only on belief-formation or only on action-value.

  ### **Scorecard Against Core Desiderata (Illustrative, Not Definitive)**

  | Requirement                    | Pure Optimism                                     | Pure Pessimism                                      | Understanding-Based View                           |
  | :----------------------------- | :------------------------------------------------ | :-------------------------------------------------- | :------------------------------------------------- |
  | **Handles Cases (1-4)**        | ✅ Easily handles all via standard testimony.     | ❌ Rejects legitimacy for most/all.                 | ⚠️ Mixed: May allow belief for some, deny understanding/value for most. |
  | **Belief vs. Understanding (5)** | ⚠️ Often collapses or downplays distinction.      | ✅ Emphasizes distinction to reject deference.      | ✅ **Core Focus:** Distinction is paramount.        |
  | **Epistemic vs. Moral Worth (6)** | ⚠️ Often conflates or assumes knowledge suffices. | ✅ Clearly separates (denies epistemic legitimacy). | ✅ Clearly separates (denies worth/understanding). |
  | **Epistemic Justification (8)** | ✅ Meets standard testimonial norms.              | ❌ Denies justification is possible/sufficient.     | ⚠️ Often denies justification OR redefines it tightly. |
  | **Autonomy Constraint (10)**   | ❌ Typically neglects or minimizes.               | ✅ **Core Focus:** Violated by deference.           | ✅ **Core Focus:** Violated without understanding.  |
  | **Understanding Req. (11)**    | ❌ Fails to value/explain deficit sufficiently.   | ⚠️ Uses deficit to reject epistemic legitimacy.     | ✅ **Core Focus:** Explains value & testimony's deficiency. |

  **(Weight on Criteria):** This scorecard highlights how the core desiderata – particularly the demand to handle diverse cases while rigorously maintaining distinctions (5,6) and satisfying foundational constraints (8,10,11) – expose the limitations of pure views. The Understanding Requirement (11) is the sharpest tool for this, as it reveals a gap in pure optimism (missing the value of understanding) and potentially overextends pure pessimism (using understanding deficit to ground epistemic, not just practical, rejection). An adequate theory must navigate *all* these demands simultaneously.
