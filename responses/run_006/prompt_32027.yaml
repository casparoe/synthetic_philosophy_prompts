    "diagnosis": "The debate is stalled due to irreconcilable intuitions: functionalists equate consciousness with computational patterns, while biological essentialists tie it exclusively to physical substrates.",
    "disagreement_type": "clash_of_intuitions",
    "crux_questions": [
      "Can computational systems exhibit identical causal dynamics to biological consciousness?",
      "Are subjective states necessary for certain computational functions?",
      "Do biological systems possess consciousness-critical properties (e.g., quantum effects) unreproducible digitally?",
      "Can moral status be assigned without resolving consciousness?"
    ],
    "what_progress_would_look_like": "Progress requires AI systems that replicate not just behavior but the *causal mechanisms* of biological consciousness, generating testable predictions about subjective states.",
    "what_would_change_my_mind": "Evidence that artificial neurons in biohybrid systems produce identical neurochemical 'suffering signatures' to biological neurons when performing equivalent computations."
  }
  ```
