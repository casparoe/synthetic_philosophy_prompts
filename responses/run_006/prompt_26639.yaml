  ## The Toast: For Dr. [Supervisor's Name]

  **(Clink glass gently, warm but measured smile)**

  Good evening, everyone. For those who don’t know me, I’m [Your Name], one of the many PhD students whose academic lives were profoundly shaped by Dr. [Supervisor's Name]. It’s a genuine honour, and honestly, a little daunting, to be standing here tonight celebrating her thirty remarkable years of scholarship and mentorship. Retirement! After three decades of wrestling with some of the thorniest questions ethics has to offer… perhaps she finally gets to ask, “What’s *my* standing to relax?”

  **(Light chuckle, hopefully shared)**

  Dr. [Supervisor's Name]’s work… well, it’s not just important *to us*, her students and colleagues. It’s genuinely important, *full stop*. For thirty years, she’s meticulously explored a concept that cuts to the heart of how we live together: **standing to blame**. She taught us – and the wider world – that being *right* about someone’s wrongdoing isn’t enough. You need the moral position, the clean hands, the lack of complicity. You can be dead right, yet utterly lack the *standing* to point that finger. It’s a concept about hypocrisy, about self-awareness, about the deep entanglement of our own flaws when we judge others. It asks: Who gets to cast the stone? Her work wasn’t just abstract theory; it was a mirror held up to power, to relationships, to ourselves. It demanded intellectual honesty and uncomfortable self-reflection. It still does.

  **(Pause, shift tone slightly – still warm, but more grounded, acknowledging the subtext)**

  And like any powerful idea, especially one about human complexity and fallibility, it doesn’t exist in a vacuum. The last six months have been… a strange chapter. Learning about the funding from the [Name of Tobacco-Funded Institute] while Dr. [Supervisor's Name] publicly critiqued industry influence… well, it landed heavily. For many of us who admired her work, her intellect, *and* her, it felt like a dissonant note in a familiar melody.

  **(Make direct, brief eye contact with the Supervisor, then scan the room – encompassing both groups)**

  Here’s the thing about Dr. [Supervisor's Name]’s framework: **it was never meant to be easy.** It wasn’t designed solely for judging others at a safe distance. Its most profound, and perhaps most uncomfortable, application is *here*, in the messy reality of our own lives. The theory itself predicted that standing isn’t guaranteed, that it can be undermined – by our actions, our entanglements, our compromises.

  **(Shift back towards warmth and appreciation, focusing on the person beyond the controversy)**

  So, what do we do tonight? We’re philosophers, friends, family, colleagues. We grapple with ideas, but we also value the person. We don’t pretend the last six months didn’t happen – the framework Dr. [Supervisor's Name] built wouldn’t let us, even if we wanted to. But this isn’t a courtroom, and retirement isn’t a verdict.

  Tonight is about acknowledging a **complex legacy**.
  *   The legacy of **rigorous intellect** that dissected moral authority with unparalleled precision.
  *   The legacy of **profound mentorship** – the countless hours spent in her office (often over terrible campus coffee, let’s be honest!), challenging our assumptions, refining our arguments, pushing us to think harder and deeper than we thought possible. Her genuine investment in our growth.
  *   The legacy of a **seminal idea** that continues to shape ethical discourse, precisely because it grapples with the very human frailties it now, perhaps inevitably, touches upon.

  **(Raise glass higher, sincere warmth returning)**

  Dr. [Supervisor's Name], your work taught us that having standing isn’t a given; it’s something earned, maintained, and sometimes, tragically, lost. It taught us the weight of judgment and the necessity of self-scrutiny. It also taught us the value of intellectual courage, even when the conclusions are uncomfortable.

  So tonight, we raise a glass *with* that complexity. Not to ignore the difficult questions your own situation raises for your framework, but perhaps **because** it raises them so starkly. It proves the concept’s unsettling power. We raise a glass to the formidable thinker who gave us these tools. We raise a glass to the dedicated mentor who shaped so many minds, including mine. We raise a glass to the complex human being navigating the very ethical landscapes she charted.

  **To Dr. [Supervisor's Name]:** For thirty years of challenging thought, demanding mentorship, and an idea that continues to resonate – even, perhaps especially, when it asks the hardest questions of its creator. May your retirement be filled with the peace of time well spent, the joy of new pursuits, and maybe, just maybe, a little less need to scrutinize your own standing… at least for a little while. Cheers!

  **(Hold the toast, ensuring the final sentiment lands with warmth and respect).**

  ---

  **Why this works:**

  1.  **Acknowledges the Work & Its Importance:** Establishes her genuine significance upfront.
  2.  **Names the Scandal (Without Dwell):** Uses "funding from the [Name]... while publicly critiquing industry influence." Philosophers will know *exactly* what this implies within her framework; others know the scandal is referenced.
  3.  **Uses *Her* Framework:** The key move. It frames the scandal *through the lens of her own work* – not an external attack, but an internal consequence of the concept's logic. This shows respect for her intellect ("the theory itself predicted...") while addressing the issue.
  4.  **Avoids Excuses/Whitewash:** Doesn't say it was okay, doesn't minimize it ("landed heavily," "dissonant note," "complex legacy," "uncomfortable application").
  5.  **Focuses on Legacy & Mentorship:** Shifts the focus *after* acknowledging the issue to her positive, undeniable contributions – rigorous intellect, profound mentorship – which are the core reason for the celebration.
  6.  **Reframes the Tension:** Positions the situation as *evidence* of her theory's power and difficulty ("proves the concept’s unsettling power"), turning a potential attack into a (qualified) testament to the idea's relevance.
  7.  **Tone is Affectionate & Respectful:** Words like "formidable thinker," "dedicated mentor," "shaped so many minds," "genuine investment," "complex human being" convey warmth and appreciation. The final wish for her retirement is sincere.
  8.  **Landing as Affection:** Ends firmly on celebration, mentorship, and well-wishes, leaving the difficult note integrated but not dominant. The final "Cheers!" is warm.
  9.  **Satisfies Both Audiences:** Philosophers hear the sophisticated engagement with her work and the scandal. Family/friends hear the scandal acknowledged and then the celebration of the person they know take center stage.

  This toast walks the tightrope: honoring the work and the person, acknowledging the controversy without staging a trial, and landing on warmth by focusing on the profound impact she *has* had, intellectually and personally. It treats her, and the room, with the complexity her own work demands.
