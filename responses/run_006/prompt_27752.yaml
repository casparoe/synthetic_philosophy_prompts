prompt: |-
  Just got out of a long argument with a friend about Carroll's tortoise, and I still don't know where the disagreement actually lives. You know the set-up: the tortoise accepts the premises of some simple argument but won't take the step to the conclusion, so Achilles writes down *if A and B are true then Z must be true* as a new premise, and the tortoise still won't move, so they add another one, and another, forever. My friend says this is all just a trick — the tortoise is refusing to play the game, and accepting A, B, and *if A and B then Z* just is accepting Z, so nothing deep follows. I think that's the exact move the regress is supposed to block: rules of inference like modus ponens can't be turned into premises without circularity or an infinite regress, so deduction either bottoms out in something non-propositional (a practice, a habbit, a disposition) or has no non-circular justification.

  So I want an actual number from you, not just "it depends." My credence that the tortoise's regress reveals something deep about the justification of deduction — roughly, that the rule can't be justified by adding premises, and that this is a real epistemological fact about deduction rather than a trick of presentation — is about 0.7; my friend is around 0.2. Give me your credence and decompose it. I'd want at least: (1) the probability that the tortoise's stance is coherent — that you can genuinely accept the premises and the conditional and still, without contradiction, refuse the conclusion; (2) the probability that the regress is vicious rather than benign; (3) the probability that there's a principled difference between a rule of inference and a premise, so "just add it as a premise" is a category mistake; (4) the probability that the right moral is the practice/habit view rather than full-on skepticism about deduction. Give each a number and a line of justification, say how they combine into your final credence, and then tell me which term your final number is most sensitive to and which term you're least confident in — and what would move that one most. Finally: my friend and I are at 0.7 and 0.2; which of those terms do you think we most likely disagree about?
