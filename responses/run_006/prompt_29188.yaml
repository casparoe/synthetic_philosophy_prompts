  Then, the fragility part. The blog claims one well-informed person can break a cascade. In the model, if a later person gets a very strong signal, they might break it. But this is conditional on signal strength and position. Also, in reality, cascades can persist despite conflicting evidence if signals are weak. The blog's assertion that they don't last long in the real world might not hold. Real-world cascades (like financial bubbles) can endure due to network structures or institutional factors. So that's an overgeneralization.

