  | **Tolerance Principle**: Does the tolerance principle (that if an entity could have had a slightly different origin, then it could have had a very different origin) apply to biological origins? | "The tolerance principle leads to absurdity when applied to gametic origins. If we allow that a person could have originated from a slightly different sperm (e.g., a sperm from the same ejaculate that is qualitatively similar), then by a series of small steps we could end up with a person originating from a completely different set of gametes. But this is impossible because the person would then have a different origin, and thus be a different individual. Therefore, the tolerance principle must be rejected for origins: no variation in gametes is possible for the same person." | "The tolerance principle is valid and applies to biological origins. Small variations in the gametes (e.g., a different sperm from the same father) would not change the identity of the resulting person because the essential features of the person (such as their psychological characteristics) are determined by the overall genetic and environmental context, not the exact gametes. Moreover, biology allows for variation (e.g., mutations) without changing the identity of the organism. Thus, the tolerance principle holds and supports the rejection of origin essentialism." |
  | **Sorites Problem for Anti-Essentialism**: Does the anti-essentialist position lead to a sorites paradox regarding how different the gametes can be before the resulting person is no longer the same? | "The anti-essentialist faces an insurmountable sorites problem. If they allow that a person could have originated from a slightly different sperm, then there is no non-arbitrary stopping point to prevent the conclusion that the person could have originated from any sperm and egg whatsoever. This is absurd, as it implies that the same person could have been born to completely different parents at a different time. Thus, the only way to avoid vagueness in transworld identity is to hold that no variation is possible." | "The sorites problem is not fatal. While it is true that there may be borderline cases, this does not undermine the core claim that some variation is possible. We can accept that identity might be vague in some remote possible worlds without giving up the clear cases. Moreover, the sorites problem arises only if we demand sharp boundaries for modal properties, but modality can be vague without collapsing into absurdity. The anti-essentialist can maintain that in nearby worlds with similar gametes, the same person exists, but in distant worlds with very different gametes, a different person exists, without specifying a precise cutoff." |

  **3. Cruxes**

  Both sides agree that resolving the following sub-questions would significantly advance the debate. For each crux, we state the consideration that both sides accept as relevant and then each side's prediction.

  a. **Crux: The Step from Artifacts to Biological Organisms**  
     - **Consideration**: Both sides agree that an empirical and conceptual analysis of the disanalogies between artifacts and biological organisms is crucial. Specifically, they would look at the processes of creation: artifacts are typically formed by external assembly, while organisms develop through internal, self-organizing processes from a zygote.  
     - **Anti-OE's Prediction**: "We predict that a clear disanalogy can be identified: the identity of an artifact is determined by the intention of the maker and the specific material used at the time of creation, whereas the identity of a biological organism is determined by the self-perpetuating life process that begins at conception. Thus, the exact gametes are not essential; what matters is the continuity of the organism's development. Therefore, Kripke's argument does not carry over."  
