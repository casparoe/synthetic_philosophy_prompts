  **Joint Statement on Gametic Origin Essentialism for Human Persons**

  **1. Agreed Claims**

  Both the Origin Essentialist (OE) and the Opponent of Origin Essentialism (Anti-OE) agree on the following substantive claims:

  a. **Logical Structure**: The question of whether a particular human person could have originated from a different sperm and/or egg is a question about *de re* modality and essential properties. It is not about personal identity over time, but about transworld identity (or counterpart relations, if one prefers). Both sides agree that the issue is modal: what is possible for the same person?

  b. **Thought Experiments**: Both sides accept the relevance of thought experiments involving gradual replacement or variation in origins, such as considering a series of possible worlds where the gametes are incrementally different. However, they disagree on the interpretation of these thought experiments (as detailed in the Disagreements section).

  c. **What is Not at Stake**:
     - Both sides agree that origin essentialism may hold for artifacts (e.g., a table could not have been made from a completely different block of wood). The dispute is specifically about whether a similar essentialism holds for human persons and their gametic origins.
     - Both sides reject the conflation of genetic identity with numerical identity. It is possible for two individuals to have identical genetic makeup (e.g., monozygotic twins) and yet be numerically distinct persons. Conversely, the same person could, in principle, have different genetic material (e.g., through somatic mutations) without ceasing to be that person. Thus, the dispute is not about genetics per se but about the specific gametes from which one originates.
     - Both sides agree that the question is independent of the mind-body problem or theories of personal identity over time (e.g., psychological continuity theories). One could hold any theory of personal identity over time and still take either side on gametic origin essentialism.

  d. **The Role of Biology**: Both sides acknowledge that human persons are biological organisms and that their origins are tied to biological processes. However, they disagree on the modal implications of this biological basis.

  Each side has conceded something: OE concedes that genetic identity is not necessary for personal identity (e.g., allowing for changes in genetics over life), and Anti-OE concedes that origin essentialism holds for at least some entities (artifacts).

  **2. Disagreements Table**

  | Point of Disagreement | OE Position | Anti-OE Position |
