answer: |-
  ### In-Class Activity: "The Controlled Exposure Exercise"  
  **Objective:** Simulate the structure of Plato's symposium (exposure, observation, reassertion of discipline) using a classroom-safe "disinhibitor" (creative expression under constraints) instead of wine.  

  ---

  #### **Activity Structure**  
  **Total Time:** 75 minutes  
  **Participants:** 14 students, divided into roles.  
  **Materials:**  
  - Topic cards (controversial but low-stakes prompts, e.g., *"Is it ever ethical to break a minor law for a greater good?"*).  
  - Timer.  
  - Observation worksheets (for Observers).  
  - Whiteboard for Moderator notes.  

  **Roles:**  
  1. **Symposiasts (8 students):** Must argue a randomly assigned position on a topic **passionately**, using exaggerated gestures/emphasis. They embody "exposure" (like wine-loosened inhibitions).  
  2. **Observers (4 students):** Silently note peers’ body language, tone, and emotional shifts.  
  3. **Moderator (1 student):** Enforces rules, interrupts to demand evidence, and redirects. Embodies the "sober official."  
  4. **Critic (1 student):** Pre-activity, argues the exercise is "pointless chaos" (mirroring the initial objection to symposia).  

  ---

  #### **Timeline**  
  **1. Setup (10 min)**  
  - Assign roles randomly.  
  - **Critic** delivers a 2-min protest: *"This is just drama class! It’ll cause arguments without teaching anything."*  
  - **Instructor frames the exercise:** *"We’re testing how structured conflict reveals hidden truths. Follow your role’s rules strictly."*  

  **2. Exposure Phase: "The Debate" (25 min)**  
  - Symposiasts draw topic/position cards (e.g., *"Defend: Lying is justified if it spares someone’s feelings"*).  
  - **Rules:**  
    - Symposiasts argue in 3 rounds (1 min each).  
    - Must use exaggerated physicality (e.g., stand when speaking, wave arms).  
    - Moderator can interrupt to:  
      - *"Demand evidence!"* (forces discipline).  
      - *"Switch speakers!"* (tests self-control).  
  - Observers record: *"When did debaters lose composure? How did they recover?"*  

  **3. Observation Phase: "Silent Reflection" (10 min)**  
  - Symposiasts free-write:  
    *"What emotions did you feel when interrupted? Did your ‘character’ slip?"*  
  - Observers review notes:  
    *"Identify one moment where discipline broke and was restored."*  

  **4. Reassertion Phase: "Group Discipline" (15 min)**  
  - Moderator leads a structured discussion:  
    - Symposiasts share reflections **calmly** (no gestures allowed).  
    - Observers share findings.  
    - Critic responds: *"Did this feel like ‘license’ or something useful?"*  

  **5. Debrief (15 min)**  
  Map the activity to *Laws I–II*:  

  | **Activity Moment**              | **Platonic Concept in *Laws***                     | **Debrief Questions**                                                                 |
  |----------------------------------|---------------------------------------------------|---------------------------------------------------------------------------------------|
  | Critic’s initial protest         | Objection: Symposia are "schools of license."     | *"Why might someone see our exercise as chaotic? How did rules change that?"*         |
  | Moderator’s interruptions        | Sober official’s role in applying discipline.     | *"How did the Moderator mimic wine’s ‘supervisor’? What did this prevent/enable?"*    |
  | Symposiasts’ exaggerated arguing | Wine "loosening the soul" to reveal character.    | *"Did forced passion reveal hidden traits? How is this like wine’s effect?"*          |
  | Post-debate calm reflection      | Reasserting self-mastery after exposure.          | *"How did shifting from chaos to calm mirror Plato’s ‘test of character’?"*           |
  | Observers’ notes                 | Symposium as a tool for noticing disorder.        | *"How did observing others help us ‘see’ character? Why might this be educational?"*  |

  **Bridge Gaps Explicitly:**  
  - **Missing pharmacology:** *"Wine involuntarily exposes the soul; here, we simulated it via performance. But in a real symposium, the loss of control is genuine—making shame/courage more visceral."*  
  - **Missing Greek shame:** *"For Plato, shame in symposia was a social corrective. We felt mild embarrassment, but ancient Greeks tied shame to honor—a gap we’ll explore in textual analysis."*  

  ---

  #### **Predictable Challenges & Fixes**  
  - **Problem:** Symposiasts treat exaggeration as comedy.  
    **Fix:** Pre-activity warning: *"This isn’t satire—overacting forces honesty."*  
  - **Problem:** Observers focus on content, not behavior.  
    **Fix:** Worksheet prompts: *"Track fidgeting, voice cracks, or deep breaths."*  
  - **Problem:** Moderator hesitates to interrupt.  
    **Fix:** Give them a script: *"After 30 seconds, demand, ‘Cite a text to prove that!’"*  

  #### **What the Activity Can’t Reproduce**  
  - The involuntary self-revelation of intoxication (simulated via voluntary performance).  
  - The cultural weight of Greek shame (supplement by analyzing *Laws* 647a–650b on shame as moral training).  

  #### **Instructor’s Role in Debrief**  
  Emphasize: *"Plato’s genius is framing pleasure as moral training. Our exercise showed how controlled exposure + discipline reveals character—but only the text shows why wine makes this unavoidable."*  

  ---  
  This structure forces students to **experience** the symposium’s phases (exposure → observation → discipline) before labeling them, ensuring the "moral technology" concept resonates beyond abstract theory.
