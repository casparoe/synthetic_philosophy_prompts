prompt: |-
  I run a small pharmacovigilence group at a regional health authority, and every few weeks we have to decide whether to issue a safety warning about a drug. The hard cases are the ones where the hypothesis is new but the evidence is old: someone proposes that a drug we've used for twenty years causes some rare problem, and the supporting data is stuff we've already had sitting in our database for years — old trial results, spontaneous reports, registry entries. I keep going in circles on a basic question: if we already knew the data before anyone thought of the hypothesis, does the fact that the hypothesis fits that data count as evidence for it? My Bayesian textbook says old evidence can't confirm anything (if P(E)=1 then P(H|E)=P(H)), but that seems wrong — people treated Mercury's perihelion as confirming general relativity even though the anomaly was old news. I want a reusable decision procedure my group can run in a two-hour meeting to decide how much an already-known dataset should move our credence in a new safety hypothesis. It should be a checklist or flowchart in words, grounded in what formal epistemology actually knows about old evidence but usable by clinicians and statisticians who don't care about the theory, and it has to leave a paper trail the medical director will sign off on: what to ask in what order, what counts as a sufficient answer, where we stop and say this doesn't confirm at all, and where the decision has to be handed to a person because it's a judgment call. Cover the distinctions that actually matter here — whether the hypothesis was reverse-engineered from the same data, whether we can reconstruct a state of mind in which we didn't know the data yet, whether the hypothesis also predicts something new we can go check, and whether the old data was collected for a purpose unrelated to the hypothesis. Then run the procedure on three cases: (1) a hypothesis about birth defects that was thought up after staring at the registry and fits nothing else; (2) a hypothesis formulated before the proposer saw the old data, which then turns out to fit it; (3) a hypothesis that fits the old data but makes one checkable new prediction that would be very unlikely otherwise. Include at least one case where the procedure tells us something we won't like, and be honest about which steps are dressed-up judgment calls and where the procedure is likely to misfire.
reasoning: |-
  We are addressing the problem of old evidence in the context of pharmacovigilance. The Bayesian puzzle is that if we already know the evidence (E), then P(E)=1, and then P(H|E) = P(H) because the evidence doesn't change our belief. However, intuitively, when a new hypothesis explains old evidence that we had not previously connected to any hypothesis, it seems to provide confirmation.

  The key insight from formal epistemology is that the old evidence can support a hypothesis if we can imagine a counterfactual scenario in which we did not know the evidence. Alternatively, we can consider how surprising the evidence is under the hypothesis versus under the background knowledge.

  We'll design a procedure that breaks down the problem into steps, focusing on practical distinctions:

  1. **Reverse-engineering check**: Was the hypothesis created specifically to fit this old data? (If yes, then it's weak evidence because it might be overfitting.)
  2. **Counterfactual prior state**: Can we reconstruct a state of mind (or a prior) in which we did not know the evidence? (This is the classic Bayesian solution: we ask what our degree of belief in the hypothesis would have been if we hadn't known E, and then update on E. But this is hard to do in practice because we can't easily forget.)
  3. **Predictive novelty**: Does the hypothesis make any new predictions that we can check? (This is a strong form of evidence.)
  4. **Purpose of data collection**: Was the old data collected for a purpose unrelated to the hypothesis? (If yes, then the data is less likely to be biased in favor of the hypothesis and thus more confirmatory.)

  We'll design a flowchart-like procedure in words. The procedure will be a checklist of questions. We'll assign a level of confirmation (none, weak, moderate, strong) based on the answers.

  **Procedure: Evaluating an Old Evidence for a New Safety Hypothesis**

  **Step 1: Was the hypothesis reverse-engineered from the same data?**
     - **Yes**: Then the evidence provides **weak or no support**. (Because it may be an ad hoc explanation.) Proceed to Step 2 to see if there are other factors that might increase support.
     - **No**: Proceed to Step 2.

  **Step 2: Can we reconstruct a counterfactual prior?**
     - This step is tricky and requires judgment. We try to imagine what we would have believed about the evidence if we hadn't known it. Specifically, we ask: "Before we thought of the hypothesis, how surprising would we have found the evidence (or the pattern in the evidence) under the background knowledge alone?" and "How expected would the evidence be under the new hypothesis?"
     - We break this into:
       - **A. Assess the prior probability of the evidence (under background knowledge):** 
          - If the evidence was very unexpected (low probability) under the background knowledge, then finding a hypothesis that explains it is more confirmatory.
          - If the evidence was already well-explained, then the new hypothesis doesn't add much.
       - **B. Assess the likelihood of the evidence under the new hypothesis:**
          - How well does the hypothesis predict the evidence? (If it fits perfectly, then the likelihood is high. If it only roughly fits, then less so.)
       - **How to operationalize?** We assign a qualitative judgment:
          - If the evidence was very surprising (we wouldn't have expected it) and the hypothesis makes it expected, then this step adds **strong support**.
          - If the evidence was not surprising and the hypothesis doesn't make it much more expected, then **no support**.
          - In between: **moderate or weak support**.
     - *Note: This step is the most judgmental. We might use historical data or expert opinion to estimate how surprising the evidence was. Alternatively, we can use statistical measures (like p-values under the null) if available, but that's not always the case.*

  **Step 3: Does the hypothesis make any novel predictions?**
     - **Yes, and we can test them**: Then we design a study (or look for existing data that can test the prediction). The outcome of that test will be the strongest evidence. But if we haven't tested yet, then the old evidence alone gets only provisional support. We note:
          - If the novel prediction is very specific and unlikely under the background knowledge, then even without testing, the hypothesis gains **moderate support** (because it's sticking its neck out). But until tested, we don't count it as strong.
          - If we have already tested the novel prediction and it holds, then **strong support**.
     - **No, it does not make any novel predictions**: Then we don't get additional support from this step.

  **Step 4: Was the old data collected for a purpose unrelated to the hypothesis?**
     - **Yes**: Then the data is less likely to be biased (e.g., if it was collected for a different study, or as part of routine monitoring without looking for this effect). This increases the reliability of the evidence and thus the support for the hypothesis. We add **moderate support**.
     - **No**: The data was collected specifically to test the hypothesis (or similar ones) and then it's just a matter of how well the hypothesis fits. But note: in our context, the data is old and collected before the hypothesis was formed, so it's unlikely that it was collected specifically for this hypothesis. However, if the data was collected in a study that was designed to look for the kind of effect that the hypothesis proposes (even if not this exact one) then it might be considered related. We then say **weak support** because of potential multiple comparisons.

  **Aggregating the support**:
     - We tally the support from Steps 1-4. However, note that Step 1 might downgrade the support, while Steps 2, 3, and 4 might add support.
     - We'll have a rule of thumb: 
          - If Step 1 is "Yes", then we start at "weak or no support", and then the other steps can only add up to moderate (unless there is a novel prediction that has been confirmed, which would then override to strong).
          - If Step 1 is "No", then we start at neutral and then add the support from Steps 2, 3, and 4.
          - We then combine:
              - Strong support from any step (especially Step 3 with confirmed novel prediction) can make the overall support strong.
              - Otherwise, we might have moderate if two or more steps give moderate, or if one step gives strong and others are positive.

  But note: We are building a procedure for a two-hour meeting. We need a flowchart that leads to a decision. We'll design the steps to be sequential and break when we have a clear answer.

  Alternatively, we can make a scoring system? But that might be too rigid. Instead, we'll have a decision tree.

  **Proposed Flowchart**:

  1. **Was the hypothesis reverse-engineered from the same data?**
     - YES: Then the evidence provides **weak support at best**. Proceed to Step 3 (skip Step 2 because Step 2 is hard and we already have a downgrade). But note: Step 3 and 4 might upgrade it.
     - NO: Proceed to Step 2.

  2. **Counterfactual prior assessment**: 
     - We ask: "Before the hypothesis was proposed, how expected was the evidence under the background knowledge?" and "How expected is the evidence under the new hypothesis?"
     - We rate the "surprise factor" on a scale:
          - **High surprise** (evidence was very unexpected under background) and the hypothesis makes it expected: **moderate support** from this step.
          - **Moderate surprise**: **weak support**.
          - **Low surprise** (evidence was already expected) and the hypothesis doesn't make it much more expected: **no support** from this step.
     - *Note: This step is a judgment call. We might use a pre-meeting survey of experts (who are asked to ignore the hypothesis) to rate how surprising the evidence is.*

  3. **Does the hypothesis make a novel prediction?**
     - **Yes, and we have already tested it and it holds**: Then **strong support** (and we can stop here because this overrides the rest).
     - **Yes, but we haven't tested it yet**: Then we assign **weak support** (but note: we must then design a test and the hypothesis is only provisionally supported until then). Proceed to Step 4.
     - **No novel prediction**: Proceed to Step 4.

  4. **Was the old data collected for a purpose unrelated to the hypothesis?**
     - **Yes**: Add **moderate support** (if not already at strong).
     - **No**: Add **no support** (or leave as is).

  **Final Aggregation**:
     - If at any point we have **strong support** (from Step 3: confirmed novel prediction), then overall support is **strong**.
     - Otherwise, we combine the support levels from the steps. We start with:
          - If Step 1 was YES, then initial support = weak (if Step 2 didn't override? Actually, we skipped Step 2 in that case). But we did Step 3 and 4.
          - If Step 1 was NO, then initial support = whatever Step 2 gave (none, weak, moderate) and then we add Step 3 and 4.

     We'll use:
          - If we have at least one step giving moderate and no step giving negative, then overall at least weak.
          - Two moderates (or one moderate and one weak) -> moderate.
          - One strong (only from Step 3 confirmed) -> strong.

  But note: we might have to be conservative. We are in pharmacovigilance: we want to avoid false alarms but also don't want to miss signals.

  Alternatively, we can have a table:

  | Step 1 | Step 2      | Step 3 (novel) | Step 4 | Overall Support |
  |--------|-------------|----------------|--------|-----------------|
  | Yes    | (skipped)   | Not tested     | Yes    | Weak            |
  | Yes    | (skipped)   | Not tested     | No     | Very Weak/None  |
  | Yes    | (skipped)   | Confirmed      | Any    | Strong          |
  | No     | High surprise | Not tested     | Yes    | Moderate        |
  | No     | High surprise | Not tested     | No     | Weak            |
  | No     | Mod surprise | Not tested     | Yes    | Weak            |
  | No     | Low surprise | Not tested     | Yes    | Very Weak       |
  | ... plus when Step 3 is confirmed, it overrides to strong.

  But note: Step 3 with confirmed prediction overrides to strong regardless of the other steps.

  **Now, let's run the three cases**:

  **Case 1: Hypothesis about birth defects that was thought up after staring at the registry and fits nothing else.**

     - Step 1: **Yes** (reverse-engineered). So we skip Step 2.
     - Step 3: Does it make a novel prediction? Let's assume it doesn't (the case says "fits nothing else", meaning it doesn't predict anything beyond the data it was derived from). So **No**.
     - Step 4: Was the registry data collected for an unrelated purpose? Probably yes (registries are general). So **Yes**.
     - Overall: Weak support (because Step 1 downgraded, but Step 4 adds some).

     **Decision**: We have weak support. We might not issue a warning yet, but we could flag for monitoring or try to generate a novel prediction and test it.

  **Case 2: Hypothesis formulated before the proposer saw the old data, which then turns out to fit it.**

     - Step 1: **No** (not reverse-engineered).
     - Step 2: We assess the surprise factor. We need to judge: was the evidence (the pattern in the old data) surprising under the background knowledge? Let's assume the pattern (say, a cluster of birth defects) was not noticed before and was unexpected. And the hypothesis explains it. So **High surprise** -> moderate support from Step 2.
     - Step 3: Does it make a novel prediction? The case doesn't say. Let's assume not. So **No**.
     - Step 4: Was the old data collected for an unrelated purpose? Probably yes. So **Yes** -> moderate support added? But note: we already have moderate from Step 2. Adding Step 4 (moderate) would push to moderate overall? Actually, we have two moderates? But Step 4 is only moderate? Our rule: two moderates -> moderate.

     **Decision**: Moderate support. We might issue a warning but label it as preliminary and recommend further studies.

  **Case 3: Hypothesis that fits the old data but makes one checkable new prediction that would be very unlikely otherwise. And we have checked it and it holds.**

     - Step 1: We don't know. The case doesn't say how the hypothesis was generated. Let's assume it was reverse-engineered? But note: it also makes a novel prediction. We'll run Step 1: 
          - If it was reverse-engineered: Step 1: **Yes**, then skip Step 2.
          - But then Step 3: **Yes, and we have tested the novel prediction and it holds**. So we get **strong support** (overrides).
          - So regardless of Step 1, if the novel prediction is confirmed, we have strong support.

     Alternatively, if Step 1 is **No** (it wasn't reverse-engineered), then we do Step 2: we might get additional support. But Step 3 already gives strong.

     **Decision**: Strong support. We issue a warning and note the confirmed prediction.

  **Include at least one case where the procedure tells us something we won't like**: 

     Consider a variation of Case 1: 
     - Hypothesis reverse-engineered from the registry (Step 1: Yes). 
     - No novel prediction (Step 3: No). 
     - But the data was collected for an unrelated purpose (Step 4: Yes). 
     - We get weak support. 

     However, what if the signal is very strong? For example, the relative risk is 10 and the p-value is 0.001? The procedure only gives weak support because of the reverse-engineering. This might be unpopular because the statistical association is strong. But the procedure is trying to avoid false positives from data dredging. We have to be honest: the procedure is designed to be conservative in the face of multiple comparisons and post-hoc analysis.

     We note that the procedure might misfire in this situation: if the association is very strong, we might want to upgrade the support. But the procedure doesn't account for effect size? We might adjust Step 2: even if we skip Step 2 in the reverse-engineering case, we could have a parallel step that looks at the strength of the association? But that would complicate. Alternatively, we could have a rule that if the association is extremely strong (by some predefined statistical measure), then we override the reverse-engineering penalty. However, we want to keep it simple.

     We decide to stick to the original design but note that the group should also consider the magnitude and statistical significance of the association independently. We might add a pre-step that checks if the association is statistically significant and strong? But that's already part of the evidence. We'll leave it as is and note that the procedure is conservative about reverse-engineered hypotheses.

  **Summary of the Procedure**:

  We have a four-step procedure. We document the answers and reasoning for each step. We leave a paper trail by having a form that records:

  - Step 1: Reverse-engineered? (Yes/No) and reasoning.
  - Step 2: If not reverse-engineered, the assessment of surprise (high, moderate, low) and reasoning.
  - Step 3: Novel prediction? (None, untested, confirmed) and if confirmed, details.
  - Step 4: Unrelated data collection? (Yes/No) and reasoning.

  Then we assign an overall level of support (none, weak, moderate, strong) using the rules above.

  **Where it might misfire**:
     - Step 2 is highly subjective. We might mitigate by having independent experts (who are not aware of the hypothesis) rate the surprise factor, but that might be impractical.
     - The procedure might be too conservative for strong associations that are reverse-engineered. We might miss a true signal. But we are balancing against false alarms.

  **Final note**: The procedure is not a substitute for a full statistical analysis. It is a tool for assessing the epistemic weight of old evidence in light of a new hypothesis. We recommend that any hypothesis that gets at least weak support should be monitored and, if possible, tested with new data.
answer: |-
  Below is a reusable decision procedure for your pharmacovigilance group, designed as a structured checklist. It addresses the "old evidence" problem by incorporating insights from formal epistemology (e.g., Bayesian reasoning, predictive novelty, and explanatory power) while remaining accessible to clinicians and statisticians. The procedure is grounded in four key distinctions:  
  1. **Reverse-engineering**: Was the hypothesis tailored to fit the old data?  
  2. **Counterfactual prior**: Can we reconstruct a state of mind where the evidence was unknown?  
  3. **Predictive novelty**: Does the hypothesis generate testable *new* predictions?  
  4. **Data-collection purpose**: Was the old data gathered for unrelated reasons?  

  The output is a qualitative assessment of support strength (None, Weak, Moderate, Strong), along with a recommended action. Each step includes:  
  - **Question**: What to ask.  
  - **Sufficient answer**: Clear criteria for proceeding.  
  - **Documentation**: What to record for the paper trail.  
  - **Stop/continue rules**: When to halt or proceed.  
  - **Judgment flags**: Where human judgment is unavoidable.  

  ---

  ### **Pharmacovigilance Old Evidence Assessment Protocol**  
  **Inputs**: A new safety hypothesis (H) + old evidence (E) already in your database.  
  **Output**: Support level for H (None/Weak/Moderate/Strong) + action (e.g., issue warning, monitor, reject).  

  #### **Step 1: Reverse-engineering Check**  
  **Question**: "Was H explicitly constructed to fit E? (e.g., after staring at E, H was proposed with no prior rationale)."  
  **Sufficient answer**:   
    - **Yes**: If H was reverse-engineered from E (e.g., data dredging).  
    - **No**: If H existed independently (e.g., based on biological plausibility, external case reports).  
    - **Unclear**: If proposer’s intent is ambiguous (proceed to Step 2).  
  **Documentation**: Record how H was generated (e.g., "H proposed after retrospective analysis of E").  
  **Stop/continue**:  
    - If **Yes**, support is **Weak at best** (high risk of overfitting). Proceed to Step 3 (skip Step 2).  
    - If **No** or **Unclear**, proceed to Step 2.  
  **Judgment call**: Assessing proposer’s intent (use written proposals or meeting notes).  

  #### **Step 2: Counterfactual Prior Assessment**  
  **Question**: "Ignoring E, how surprising was E under background knowledge (B)? How expected is E under H+B?"  
  **Sufficient answer**:  
    - **High surprise**: E was highly unexpected under B (e.g., anomaly contradicted established science).  
    - **Low surprise**: E was already explainable by B (e.g., noise, known confounders).  
    - **Likelihood boost**: H makes E much more expected than B alone (use qualitative scale: Low/Medium/High).  
  **Documentation**: Summarize pre-H expectations (e.g., "E was unexplained anomaly under B; H resolves it").  
  **Stop/continue**:  
    - If **High surprise** + **High likelihood boost**, support = **Moderate**. Proceed to Step 3.  
    - If **Low surprise** or **Low likelihood boost**, support = **Weak/None**. Proceed to Step 3.  
    - *Default*: Proceed to Step 3 regardless.  
  **Judgment call**: Rating "surprise" and "likelihood boost" (use expert consensus; misfires if team cannot objectively ignore E).  

  #### **Step 3: Predictive Novelty Check**  
  **Question**: "Does H predict *new*, testable phenomena beyond E?"  
  **Sufficient answer**:  
    - **Novel prediction exists + untested**: H forecasts unseen data (e.g., specific lab finding, demographic pattern).  
    - **Novel prediction tested + confirmed**: New data matches H.  
    - **No novel prediction**: H only explains E.  
  **Documentation**: Describe the novel prediction and test status (e.g., "H predicts X; test planned/complete").  
  **Stop/continue**:  
    - If **Tested + confirmed**, support = **Strong** (overrides prior steps). Skip Step 4; goto Action.  
    - If **Untested**, support remains unchanged (but note potential). Proceed to Step 4.  
    - If **None**, proceed to Step 4.  
  **Judgment call**: Defining "testable" predictions (avoid vague claims).  

  #### **Step 4: Data-Collection Purpose**  
  **Question**: "Was E collected for a purpose unrelated to H?"  
  **Sufficient answer**:  
    - **Unrelated**: E predates H and was gathered for other goals (e.g., general adverse event registry).  
    - **Related**: E was collected to test hypotheses similar to H (e.g., class-wide side-effect study).  
  **Documentation**: Note original purpose of E (e.g., "E from post-marketing surveillance for drug Y").  
  **Stop/continue**: Always proceed to Action.  
  **Judgment call**: Assessing "relatedness" (e.g., if E was for cardiovascular risk, using it for birth defects is "unrelated").  

  #### **Action: Support Aggregation & Decision**  
  **Rules**:  
  - **Strong**: If Step 3 = **Tested + confirmed** (regardless of other steps).  
  - **Moderate**: If (Step 1 = **No** AND Step 2 = **High surprise + High boost**) OR (Step 4 = **Unrelated** AND prior steps ≥ Weak).  
  - **Weak**: If (Step 1 = **Yes** OR Step 2 = **Low surprise/boost**) AND Step 4 = **Unrelated**.  
  - **None**: All other cases (e.g., Step 1 = Yes + Step 4 = Related).  
  **Recommendations**:  
  - **Strong**: Issue warning + update guidelines.  
  - **Moderate**: Issue provisional warning + mandate new study.  
  - **Weak**: Monitor + exploratory analysis.  
  - **None**: Reject or archive.  

  **Documentation**: Complete a summary table (see template below).  
  **Paper trail**: Medical director signs off on the completed checklist.  

  ---

  ### **Template for Documentation**  
  | **Step** | **Question** | **Answer** | **Support Impact** |  
  |----------|-------------|------------|-------------------|  
  | 1 | Reverse-engineered? | [Yes/No/Unclear] | Weak if Yes |  
  | 2 | Surprise under B? | [High/Low] | |  
  |   | Likelihood boost? | [High/Medium/Low] | Moderate if High+High |  
  | 3 | Novel prediction? | [Tested+Confirmed/Untested/None] | Strong if Confirmed |  
  | 4 | Unrelated data? | [Yes/No] | Boost if Yes |  
  | **Final Support** | [None/Weak/Moderate/Strong] | **Action**: [Issue warning/Monitor/Reject] |  

  ---

  ### **Case Applications**  

  #### **Case 1: Hypothesis reverse-engineered from birth defect registry**  
  - **Step 1**: **Yes** (H proposed after staring at registry; fits nothing else). → Support ≤ Weak.  
  - **Step 2**: Skipped (reverse-engineered).  
  - **Step 3**: **No novel prediction** (H only explains registry data). → No change.  
  - **Step 4**: **Unrelated** (registry for general birth defects, not this drug). → Weak support.  
  - **Action**: **Weak support** → Monitor only; no warning.  
  - **Why you won’t like it**: Strong statistical association in registry, but procedure downgrades due to reverse-engineering. Honest judgment call: Step 1 is subjective; if team disputes "reverse-engineering," reassess at Step 2.  

  #### **Case 2: Hypothesis formulated before seeing old data, then fits it**  
  - **Step 1**: **No** (H based on mechanistic rationale; proposer unaware of E).  
  - **Step 2**: **High surprise** (E was unexplained under B; e.g., rare event cluster). **High boost** (H cleanly explains E). → Moderate support.  
  - **Step 3**: **No novel prediction** → No change.  
  - **Step 4**: **Unrelated** (E from spontaneous reports for other issues). → Confirms Moderate.  
  - **Action**: **Moderate support** → Issue provisional warning + commission study.  

  #### **Case 3: Hypothesis fits old data and makes a new, confirmed prediction**  
  - **Step 1**: **Unclear** (H source ambiguous). Proceed.  
  - **Step 2**: **Low surprise** (E was borderline-significant under B). **Medium boost** → Weak support.  
  - **Step 3**: **Tested + confirmed** (H predicted elevated risk in a subgroup; new data confirms). → **Strong support** (overrides all).  
  - **Step 4**: Skipped (Step 3 decisive).  
  - **Action**: **Strong support** → Issue safety warning immediately.  

  ---

  ### **Critical Notes**  
  - **Where judgment dominates**:  
    - Step 1 (reverse-engineering intent) and Step 2 (surprise/likelihood) are inherently subjective. Use blinded experts or historical records to reduce bias.  
    - Misfires: Step 2 may undervalue "anomalies" if team cannot ignore E (e.g., Mercury’s perihelion was known but still supported relativity *because* it was anomalous).  
  - **Why Bayes isn’t the end-all**:  
    - The textbook "P(E)=1" issue assumes perfect knowledge. In practice, we *rediscover* E in a new context (e.g., "This pattern in E is now salient"). The procedure approximates Bayesian updating by reconstructing ignorance (Step 2) and demanding novelty (Step 3).  
  - **Limitations**:  
    - Confirmation bias risk: Teams may overrate "surprise" in Step 2. Mitigation: Pre-meeting surveys asking, "Before H, how likely was E?"  
    - Resource-heavy: Step 3 requires new data. Balance feasibility against risk.  
    - Group dynamics: Dominant personalities may sway judgments. Use anonymous voting for Step 2.  

  This procedure provides a defensible, auditable framework for old evidence cases. By emphasizing predictive novelty and counterfactual reasoning, it aligns with epistemology while delivering actionable outputs for medical directors.
