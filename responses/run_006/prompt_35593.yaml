  Below is a comprehensive design for your Dutch book session, optimized for engagement, intuition-building, and addressing common pitfalls. The game uses a **points system** with social stakes (e.g., group rankings, "rationality points," or lighthearted prizes like silly hats for the least exploited).

  ---

  ### **Session Structure**  
  **Total Time:** 120 minutes  
  **Format:** Whole-group intro → Small group betting rounds (tables of 4–5) → Whole-group debrief.  
  **Why small groups?** Maximizes participation, lets players experience being both bookie and bettor, and creates peer pressure to engage.  

  ---

  ### **Game Setup: "The Dutch Book Challenge"**  
  #### **Materials Needed Per Group**  
  - 1 coin (or 6-sided die for advanced round).  
  - Betting tokens (e.g., poker chips) or a score sheet.  
  - Cards labeled: Heads (A), Tails (B), Heads-or-Tails (A∨B) (and Even-Number (C) for die round).  
  - Prizes for "least exploited" players (optional: candy, prestige).  

  #### **Propositions**  
  - **Round 1 (Coin Flip - Core Axioms):**  
    - A: "This coin flip lands Heads."  
    - B: "This coin flip lands Tails."  
    - A∨B: "This coin flip lands Heads or Tails" (tautology).  
    *(Tests: Non-negativity, normalization, additivity)*  

  - **Round 2 (Die Roll - Advanced Additivity):**  
    - C: "A 6-sided die roll shows an even number (2, 4, or 6)."  
    *(Tests additivity for non-disjoint events; optional if time permits)*  

  #### **Rules**  
  1. **State Fair Odds:**  
     - Each player declares probabilities for A, B, and A∨B (e.g., P(A) = 0.4, P(B) = 0.5, P(A∨B) = 0.9).  
     - **Bookie Tip:** Push for specificity: "If you refuse to state a number, you can't play (and miss the fun)."  

  2. **Bookie Constructs Bets:**  
     - Bookie checks for incoherence:  
       - Violation of **normalization** (P(A∨B) ≠ 1)?  
       - Violation of **additivity** (P(A) + P(B) ≠ 1, despite A/B mutually exclusive)?  
       - Violation of **non-negativity** (P < 0)?  
     - Bookie offers a set of 3 bets (scaled to 10-point stakes):  
       - **Example 1 (Normalization):** Player sets P(A∨B) = 0.8.  
         - Bookie *buys* a bet: "I pay you 8 points now. You pay me 10 points if A∨B happens."  
         *(Since A∨B always happens, player loses 2 points net.)*  
       - **Example 2 (Additivity):** Player sets P(A) = 0.4, P(B) = 0.4, P(A∨B) = 1.  
         - Bookie *sells* a bet on A: "You pay me 4 points now. I pay you 10 if A happens."  
         - Bookie *sells* a bet on B: "You pay me 4 points now. I pay you 10 if B happens."  
         - Bookie *buys* a bet on A∨B: "I pay you 10 points now. You pay me 10 if A∨B happens."  
         *(Start: Player gains 10 - 4 - 4 = +2 points. Outcome: Player pays 10 for A∨B but gets 10 for A/B if it hits. Net loss = 8 points → math below.)*  

  3. **Settle Bets:** Flip coin/roll die. Players lose/gain points.  
  4. **Rotate Roles:** Each player becomes bookie once.  

  ---

  ### **Debrief Framework**  
  **(30 min; map gameplay to theory)**  

  #### **1. Core Lessons ("Why Incoherence Hurts")**  
  - **Violating Normalization (P(A∨B) < 1):**  
    - *Game:* You sold a bet on a sure thing too cheaply → guaranteed loss.  
    - *Axiom:* Probabilities must sum to 1 for exhaustive outcomes.  
    - *Real-world:* Underestimating certainty → exploitable in prediction markets (e.g., someone buys all "impossible" outcomes).  

  - **Violating Additivity (P(A) + P(B) ≠ P(A∨B)):**  
    - *Game:* You mispriced overlapping uncertainty → bookie arbitraged the gap.  
    - *Axiom:* Mutually exclusive probabilities add.  
    - *Real-world:* Miscalculating risks (e.g., P(A) = chance of AI risk, P(B) = chance of bio risk, but P(A∨B) ≠ P(A)+P(B) if they overlap).  

  - **Non-negativity (P < 0):**  
    - *Game:* Negative odds imply paying to avoid betting → bookie extracts free points.  
    - *Axiom:* Probabilities can’t be negative.  
    - *Real-world:* "Paying to avoid belief updates" is anti-epistemic.  

  #### **2. What Dutch Book Doesn't Solve**  
  - **Countable Additivity:** Dutch books for infinite sets require extra assumptions.  
  - **Priors:** Coherence doesn’t fix bad priors (e.g., P(Trump wins 2024) = 0.01).  
  - **No Bookie?** Internal consistency still matters:  
    - Beliefs should "pay rent" in anticipated experiences.  
    - Incoherence → predictable regret (e.g., "I wish I’d noticed those bets were a loss either way").  

  #### **3. Rationalist Connections**  
  - **Prediction Markets:** Incoherent odds create arbitrage opportunities (e.g., Manifold Markets).  
  - **"Pay Rent":** If your belief doesn’t guide bets, it’s decorative (e.g., "I believe in God but won’t bet on it").  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"I’m uncertain about uncertainty!" (P(A) = P(~A) = 0.3)**  
     - *In-game:* Bookie them! Show the sure loss (e.g., P(A)+P(B)=0.6 < 1).  
     - *Debrief:* "Uncertainty about uncertainty" belongs in a meta-distribution. First-order beliefs must still sum to 1, or you’re leaving free money on the table.  

  2. **"I refuse to state probabilities!"**  
     - *Solution:* "No number = no game. But here’s a default: P(A) = 0.5, P(B) = 0.5. Ready to be booked?" (Social pressure usually works.)  

  3. **"But no real bookie would do this!"**  
     - *Reframe:* "It’s not about bookies—it’s about internal conflict. The world exploits inconsistency via prediction markets, insurance, etc."  

  4. **Analysis Paralysis**  
     - *Prevent:* Strict time limits for stating odds (30 seconds).  

  5. **Edge Cases (e.g., "The coin lands on its edge!")**  
     - *Pre-empt:* "For this game, assume P(edge) = 0. We’re testing logic, not quantum coin physics."  

  ---

  ### **Why This Works**  
  - **Intuition Over Abstraction:** Players *feel* the loss from inconsistency.  
  - **Social Stakes:** Points/public rankings make incoherence "embarrassing."  
  - **Self-Bookieing:** Playing bookie reveals how easy it is to exploit others.  
  - **Debrief Links:** Explicitly ties gameplay to axioms and rationalist principles.  

  Adjust based on group dynamics, and let the exploitation begin!
