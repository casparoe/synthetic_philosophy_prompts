          What went wrong? The additivity violation was that P(A)+P(B)=0.6 < 1 = P(A∨B). In this case, the Dutch book should be:

            Bookie should buy bets on A and B from the participant (because they are underpriced) and sell a bet on A∨B.

          Specifically:

            Bookie buys a bet on A from the participant: bookie pays $0.30 to participant, participant pays $1 to bookie if A occurs.
            Bookie buys a bet on B from the participant: bookie pays $0.30 to participant, participant pays $1 to bookie if B occurs.
            Bookie sells a bet on A∨B to the participant: participant pays $1 to bookie, bookie pays $1 to participant if A∨B occurs.

          Start: participant receives $0.30+$0.30 = $0.60 and pays $1 -> net -$0.40.

          Outcome: 
            If A occurs: participant pays $1 to bookie (for A) and receives $1 from bookie (for A∨B) -> net $0. So overall, participant lost $0.40.
            If B occurs: same.

          This is a sure loss of $0.40.

          So the rule: 
            If P(A)+P(B) < P(A∨B) [which should be the same as 1 in our case] then the bookie buys the bets on A and B and sells the bet on A∨B.

          If P(A)+P(B) > P(A∨B), then the bookie sells the bets on A and B and buys the bet on A∨B.

     So we have to adjust the direction of the bets based on the violation.

     Problem 2: The person who refuses to give a number.

          We can encourage them to just pick a number for the sake of the exercise. If they still refuse, they can sit out and observe.

     Problem 3: The person who sets P(A)=0.5, P(B)=0.5, P(A∨B)=1 (coherent) but then the Dutch book doesn't apply. That's fine.

     Implementation in points:

          Each participant starts with 100 points.
          The bets are in units of points. We'll use a unit of 10 points for simplicity to avoid decimals.

          Example for the incoherent participant: P(A)=0.3, P(B)=0.3, P(A∨B)=1.

          Bookie offers (for 10 point stakes):

            - Buys a bet on A from the participant: bookie gives the participant 0.3 * 10 = 3 points. In return, if A occurs, participant pays bookie 10 points.
            - Buys a bet on B from the participant: bookie gives the participant 3 points. If B occurs, participant pays bookie 10 points.
            - Sells a bet on A∨B to the participant: participant pays bookie 1.0 * 10 = 10 points. In return, if A∨B occurs, bookie pays participant 10 points.

          Net at start for participant: +3+3-10 = -4 points.

          Outcome: 
            If A occurs: 
               Participant pays 10 to bookie for A.
               Bookie pays 10 to participant for A∨B.
               Net: -10 +10 = 0.
            Total: -4 points.
            Similarly for B.

          So participant loses 4 points regardless.

     We can scale the stakes to any unit to make the loss clear.

     Now, for the debrief:

       - Why the axioms? 
            Normalization: because if you assign less than 1 to a sure event, someone can buy a bet on that event and you'll lose when it happens.
            Additivity: because if you assign less than the sum to mutually exclusive events, someone can buy bets on each of the events and sell you a bet on the union, and you lose the difference.

       - What Dutch book doesn't give:
            Countable additivity: the Dutch book for finite additivity doesn't extend to infinite sets without additional assumptions.
            Doesn't tell you what your probabilities should be, only that they should be coherent. So it doesn't address priors.

       - Connections:
            Prediction markets: if your probabilities are incoherent, you can be exploited by others in the market. This is why arbitrage opportunities disappear in efficient markets.
            Paying rent: your beliefs should be actionable and not lead to guaranteed losses. If your beliefs are inconsistent, you are vulnerable to exploitation.

     Finally, handle the "uncertain about uncertainty" person:

          They set P(A)=0.3, P(~A)=0.3. We Dutch book them and show they lose points. Then we explain that even if they are uncertain, the probabilities must still add up to 1 for mutually exclusive and exhaustive events. If they are uncertain, they can set a probability between 0 and 1, but the total must be 1. They might be confusing second-order uncertainty (which would be a distribution over probabilities) with first-order probabilities. We can say: "Your current probability for A should be a single number that summarizes your uncertainty. If you feel uncertain about what that number is, that's fine, but for the purpose of betting today, you have to commit to a number. And if you commit to numbers that don't add up, you lose."

     If they resist, we can suggest that they use 0.5 for both? But that would be 0.5+0.5=1, so coherent. Or they could use 0.4 and 0.6? But the point is that the sum must be 1.

     We can avoid a one-on-one debate by saying: "This is a simplified model. In reality, you might have a distribution over probabilities, but that distribution should also be coherent in a similar way. For today, we are looking at the first-order probabilities."

     Summary of the session structure:

     Part 1: Whole group demo (30 min)
        - Explain the setup: we have a coin flip (will be flipped at the end), and we are going to state probabilities for heads, tails, and heads or tails.
        - Ask for volunteers to state their probabilities. Pick one that is incoherent (or use a plant).
        - As bookie, offer the set of bets and calculate the sure loss.

     Part 2: Small groups (60 min)
        - Groups of 4-5. Each group has a coin (or die for round 2) and a set of propositions.
        - One person in the group is the bookie (or rotate). The bookie collects probabilities from others and constructs Dutch books for any incoherent set.
        - They play out the bets and record the sure loss.

     Part 3: Debrief (30 min)
        - Bring everyone together.
        - What did we learn? Map to axioms.
        - Limitations of Dutch book.
        - Connections to real life.

     Materials needed:
        - Coins (and dice for optional round) for each group.
        - Score sheets or whiteboards for keeping track of points.

     Time allowing, discuss other forms of Dutch books (e.g., for conditional probabilities).

     This should meet the goal of making the incoherence feel like a problem.
