answer: |-
  ## Dialogue: The Accidental Law

  **Characters:**
  *   **Alex:** Defends a Humean Best-System Account (BSA)
  *   **Morgan:** Defends an Anti-Humean Governing Account (GA)

  **Setting:** A university common room, late afternoon. Books and coffee cups scattered.

  **(The dialogue begins mid-conversation)**

  **Morgan:** ...so Alex, we agree the worlds *look* identical: in both, every single F we ever observe is G. But intuitively, in one world, it *must* be that way – it’s a law. In the other, it’s just a massive, stable coincidence. The core question is: what *grounds* that modal difference? What makes something a law rather than just a universal regularity?

  **Alex:** Precisely, Morgan. And the BSA gives a clear, naturalistic answer without mysterious additions. In the lawful world, the proposition "All Fs are Gs" is an axiom or theorem of the *best* systematization of that world's total history. "Best" means it strikes the optimal balance: it's *simple* (concise axioms), *strong* (implies many particular facts), and has good *fit* (the probabilities it assigns match the actual frequencies well). In the accidental world, "All Fs are Gs" might be true, but stating it as a law wouldn't contribute to the *best* system – maybe it makes things less simple, or doesn't fit as well with other regularities under pressure. The lawhood supervenes on the pattern of particular events plus our standards for theory choice.

  **Morgan:** (Leans forward) But Alex, that "our standards" worries me. Simplicity and strength are *language-relative*. Suppose I define a gruesome predicate "Grue": something is Grue iff it's observed before time T and is Green, or observed after T and is Blue. Now, in both our worlds, all emeralds are green before T. In the lawful world, "All emeralds are green" is simple. But in your system, couldn't I write a system where "All emeralds are Grue" is an axiom? It fits the data perfectly up to T. It might even be *simpler* in some gerrymandered language! What stops *that* from being the best system, making "grue" lawful? Your account seems vulnerable to gerrymandering unless you presuppose a privileged set of *natural* properties – like green and blue, not grue.

  **Alex:** (Nods slowly) Fair point. You're right that the BSA needs a constraint. We *do* need to privilege certain properties – the perfectly natural ones. Science discovers these: mass, charge, spin, fundamental spatiotemporal relations. Simplicity and strength are assessed *using a vocabulary carved at the joints of nature*. "All emeralds are green" uses natural green; "All emeralds are grue" uses gerrymandered grue. So, in the lawful world, the system using natural properties will win out.

  **Morgan:** (Raises an eyebrow) Ah, but now you've smuggled in the very modality you wanted to avoid! What *makes* a property "perfectly natural"? It can't just be that it features in our *current* best science – that's circular. Doesn't "perfectly natural" mean something like *fundamentally real*, possessing a certain intrinsic unity or causal power that gruesome disjunctions lack? That sounds awfully like a primitive modal or dispositional fact you were trying to reduce! Your "natural properties" are doing the heavy lifting of selecting which regularities are law-candidates, and they seem to carry their own modal baggage. Haven't you just deferred the problem?

  **Alex:** (Pauses, thinking) Hmm. Perhaps I need to refine. Maybe "naturalness" isn't a *primitive* modal fact, but *emerges* from the role properties play in the *actual* best system of the *actual* world. The properties that allow for the globally simplest, strongest systematization of everything *are* the natural ones. It's holistic. In the lawful F=G world, F and G *are* natural because using them yields the best system. In the accidental world, maybe they don't – perhaps the best system reveals F as disjunctive or G as a fluke correlation explained by deeper laws using different properties. The naturalness isn't *prior* brute fact; it's defined by its role in systematization.

  **Morgan:** Interesting revision. But I'm skeptical it escapes the circle. How do you assess "best system" for the *actual* world without *already* relying on some notion of which properties are the simple, non-gerrymandered ones to use? It feels like the naturalness and the lawhood are being defined in terms of each other. But let's turn the tables. Your main objection to my governing view, Alex? That it's vacuous?

  **Alex:** Exactly. You posit a "governing law" – a relation of nomic necessitation between universals F and G, or some primitive "lawmaker" that "makes" Fs be Gs. But what *is* this "making"? How does it work? Saying "N(F,G) necessitates that all Fs are Gs" just seems like restating the regularity with a fancy name. If I ask *why* this F here is G, and you say "Because of the law N(F,G)", and I ask what N(F,G) *does*, and you say "It makes Fs be Gs"... that's no better than saying opium puts people to sleep because of its dormitive virtue! It explains nothing. It just labels the phenomenon. How is your "governance" anything more than the regularity itself wearing a mask?

  **Morgan:** (Smiles faintly) The dormitive virtue jibe is old but potent, I grant you. But I think you caricature the position. Governance isn't *just* the label. The law N(F,G) is a *real, irreducible relation* holding between the universals F and G. This relation *grounds* the counterfactuals: if something *were* F (even if it isn't), it *would have to be* G. In the accidental world, there's no such relation, so while all actual Fs are Gs, something *could* have been F and not G. The law *explains* the regularity by being its *truthmaker* – the reason why there *are* no exceptions. The regularity is the *manifestation* of the governance.

  **Alex:** But Morgan, *how*? *How* does this relation N(F,G) "ground" the counterfactuals? *How* does it "make" this particular F-instance be G? You're describing *what it does* – it necessitates – but you're not telling me *what it is* or *the mechanism* by which it operates. It seems like a bare posit. Why should I believe in this extra entity, N(F,G), over and above all the Fs being Gs? What explanatory work is it doing besides allowing you to *say* "It's not an accident"?

  **Morgan:** (Leans back, steepling fingers) Perhaps I need to flesh out the "how". Think of it not as a mysterious force, but as a *constraint* on possibility itself, rooted in the natures of the properties. F-ness and G-ness aren't inert labels; they have *essences* that include how they *must* interact. N(F,G) is the expression of that essential connection. The governance is the *causal power* inherent in F to produce G. The reason *this* F is G is because, given its nature as F, and the law connecting F to G, it *couldn't* be otherwise. The "making" is the unfolding of potentialities inherent in the properties themselves, according to their governing laws. It's not a mechanical push; it's the realization of modal structure.

  **Alex:** Powers? Essences? Now you've doubled down! Now instead of one mysterious relation N(F,G), you're invoking mysterious causal powers and essential natures inherent in properties! How are *those* any less of a posit? And how do we know what the "essence" of charge or mass is, independent of how things *actually* behave? It feels like you're building an elaborate metaphysical castle just to avoid the elegant simplicity of the BSA, which sticks to the actual patterns and our epistemic virtues.

  **Morgan:** And your "elegant simplicity," Alex, seems to me to rest on a foundation of primitive naturalness that secretly smuggles in the very modality you disdain. You avoid the "mystery" of governance only by relying on the mystery of why *these* properties are natural and allow simple laws, while others don't. Why *that* asymmetry in the world? The BSA describes the symptom; the GA tries to describe the underlying structure causing the symptom. Yes, powers and governance are primitives. But they explain *why* the best system is possible, *why* there *are* projectible regularities at all. Your natural properties are, in effect, the footprints of my governing powers.

  **Alex:** And your governing powers are, in effect, a metaphysical gloss on the very regularities my system takes as fundamental. We’ve reached bedrock, Morgan. For me, the cost is accepting primitive natural properties (or a holistic system defining them) to avoid modal primitives *except* as defined by the system. The remaining mystery is why the world is such that a simple, strong system *exists*. For you, the cost is accepting irreducible modal relations or powers to explain the regularity and its counterfactual force. The remaining mystery is the nature of this governance itself – *how* it operates. We agree on the phenomena; we profoundly disagree on what grounds them.

  **Morgan:** (Sighs, picks up coffee cup) Indeed. The accidental world haunts us both. You see its possibility in the fragility of systematization without natural joints. I see it in the absence of a constraining lawmaker. The coffee's cold. Same time next week? Maybe we tackle causation.

  **Alex:** (Smiles wryly) Only if you promise not to invoke "oomph". Deal. See you then.

  **(They gather their things, the fundamental disagreement unresolved, but the contours and costs of each position sharply defined.)**

  ---

  **Key Commitments & Remaining Costs Made Clear:**

  *   **Alex (BSA):**
      *   **Commitments:** Laws supervene on particular matters of fact (the "Humean mosaic"). Lawhood is defined by epistemic virtues (simplicity, strength, fit) applied to systematizations of this mosaic, using a privileged set of natural properties.
      *   **Costs:** Requires a solution to the "privileged vocabulary" problem. Natural properties are either:
          *   A primitive metaphysical posit (undermining the reductionist ambition).
          *   Defined holistically by the best system (risking circularity: best system depends on natural properties, which depend on the best system).
      *   **Remaining Mystery:** Why does the actual mosaic exhibit patterns that admit of a simple, strong systematization using *any* non-gerrymandered vocabulary? Why is the world "kind" to systematizers?

  *   **Morgan (GA):**
      *   **Commitments:** Laws are ontologically primitive, irreducible relations (or entities) that govern or necessitate how particulars behave. They ground regularities, counterfactuals, and explain why there are no exceptions.
      *   **Costs:** Requires accepting irreducible modality (necessitation, powers, essences) as fundamental features of reality. Faces the "dormitive virtue" objection: explaining *how* governance works beyond simply labeling the regularity remains challenging.
      *   **Remaining Mystery:** What *is* the nature of nomic necessitation or governance? *How* exactly does a law "make" a particular instance conform? What is the "mechanism" or ontology of this influence?
