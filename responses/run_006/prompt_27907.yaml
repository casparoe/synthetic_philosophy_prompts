  ### Constructed Case for Distributive Ethics Analysis

  **Distributions:**
  - **Distribution A (Unequal, Higher Total):** (100, 0)  
    Total well-being: 100  
  - **Distribution B (Equal, Lower Total):** (30, 30)  
    Total well-being: 60 (40% below A, satisfying the 20%+ constraint)  

  **Constraints Met:**  
  - No Pareto domination: A has one person better off (100 > 30) and one worse off (0 < 30).  
  - Non-negative well-being: All values ≥ 0.  
  - Total in B is 60, which is ≤ 80 (80% of 100), satisfying the 20% reduction requirement.  

  ---

  ### Verdicts and Calculations  
  **1. Telic Egalitarianism (TE)**  
  - Value function: \( V_{\text{TE}}(x, y) = (x + y) - 0.2 \times |x - y| \)  
  - **Distribution A (100, 0):**  
    \( V_{\text{TE}} = (100 + 0) - 0.2 \times |100 - 0| = 100 - 20 = 80 \)  
  - **Distribution B (30, 30):**  
    \( V_{\text{TE}} = (30 + 30) - 0.2 \times |30 - 30| = 60 - 0 = 60 \)  
  - **Verdict:** Prefers A (80 > 60).  

  **2. Prioritarianism (P)**  
  - Value function: \( V_{\text{P}}(x, y) = \sqrt{x} + \sqrt{y} \)  
  - **Distribution A (100, 0):**  
    \( V_{\text{P}} = \sqrt{100} + \sqrt{0} = 10 + 0 = 10 \)  
  - **Distribution B (30, 30):**  
    \( V_{\text{P}} = \sqrt{30} + \sqrt{30} \approx 5.477 + 5.477 = 10.954 \)  
  - **Verdict:** Prefers B (10.954 > 10).  

  ---

  ### Key Features Driving the Split  
  **1. Role of Prioritarian Concavity:**  
  - The prioritarian’s square-root function heavily weights gains for the worst off. Raising the worst-off from 0 to 30 (gain: ≈5.477) outweighs the loss to the best-off from 100 to 30 (loss: 10 - 5.477 ≈ 4.523), yielding a net gain.  
  - **If prioritarianism is less concave (e.g., \( f(x) = x^{0.9} \)):**  
    \( V_{\text{P}}(100, 0) \approx 63.10 + 0 = 63.10 \)  
    \( V_{\text{P}}(30, 30) \approx 2 \times 19.50 = 39.00 \)  
    Verdict reverses: Prioritarianism now prefers A (63.10 > 39.00). The split vanishes with weaker concavity.  

  **2. Stability of Telic Egalitarian Verdict:**  
  - With λ = 0.2, TE prefers A (80 > 60).  
  - **If λ is raised (e.g., λ = 0.5):**  
    \( V_{\text{TE}}(100, 0) = 100 - 0.5 \times 100 = 50 \)  
    \( V_{\text{TE}}(30, 30) = 60 \)  
    Verdict reverses: TE now prefers B (60 > 50). The TE verdict is unstable under λ increases, as equality’s intrinsic value rises.  

  ---

  ### Attacks from Each Theory’s Defender  
  **Prioritarian’s Attack on Telic Egalitarianism:**  
  "TE’s preference for (100, 0) is morally grotesque. It tolerates one person at absolute deprivation (well-being 0) for the sake of a higher total. TE’s additive penalty for inequality (λ|gap|) fails to capture the urgency of prioritizing the worst off. By ignoring the diminishing moral weight of well-being, TE undervalues lifting the worst-off from nothing to subsistence (0→30), while overvaluing the loss to the well-off (100→30). This exposes TE’s indifference to the depth of disadvantage."  

  **Telic Egalitarian’s Attack on Prioritarianism:**  
  "Prioritarianism’s choice of (30, 30) is a reckless sacrifice of total well-being. Reducing the sum from 100 to 60 (a 40% loss) for mere equality is inefficient and wasteful. The prioritarian’s concave transformation artificially inflates the gain to the worst off (0→30) and deflates the loss to the best off (100→30), but this cannot justify such a massive societal loss. Leveling down the best off without a Pareto improvement is ethically indefensible—it prioritizes equality over human welfare."  

