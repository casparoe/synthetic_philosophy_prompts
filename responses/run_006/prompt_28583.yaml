answer: |-
  You've pinpointed a crucial and often under-scrutinized move in the philosophy of perception. The inference from **subjective indistinguishability** to **sameness of fundamental mental state kind** between veridical perception and hallucination is indeed a cornerstone argument for **indirect realism** and **sense-datum theories**, and a primary target for **disjunctivists**.

  The most established and appropriate term for this specific move is the **Common Kind Assumption (CKA)**.

  Here's the breakdown:

  1.  **The Core Move:** As you described: If a hallucinatory experience (e.g., Macbeth's dagger) is subjectively indistinguishable from a veridical perception of a real dagger, then the fundamental kind of mental state occurring in both cases must be the same. The *only* difference is the *cause* (or the lack of an appropriate object) in the veridical case. The mental state itself, considered in its intrinsic nature, is identical in type.

  2.  **Why "Common Kind Assumption"?**
      *   It asserts that perception and hallucination share a **common kind** of mental state or event at their core.
      *   It is often treated as an *assumption* or a premise that seems so obvious it requires little justification (as you noted). Proponents might see it as following directly from the indistinguishability, while critics (like disjunctivists) argue it's a substantial and questionable metaphysical leap.
      *   It's the foundation upon which theories like **sense-datum theory** and **representationalism** (in its indirect forms) are built. They posit that the common kind involves awareness of an internal object (sense-datum) or the tokening of a specific internal representational state.

  3.  **Anatomy of the Move:**
      *   **Premise 1 (Indistinguishability):** A hallucinatory experience H can be subjectively indistinguishable from a veridical perceptual experience V of some object O.
      *   **Premise 2 (The Inference/Assumption - CKA):** If H is subjectively indistinguishable from V, then H and V must be mental states of the *same fundamental kind*. The mental state itself, considered intrinsically, is identical.
      *   **Conclusion:** Therefore, the core mental state in veridical perception (V) is of the same fundamental kind as the core mental state in hallucination (H). The difference lies only in the external cause/relation to the world in the veridical case.

  4.  **The Epistemic/Metaphysical Gap (Your Point):**
      You are absolutely correct. The move *does* bridge an epistemic fact (indistinguishability *for the subject*) to a metaphysical claim (sameness of fundamental mental kind). Critics like disjunctivists argue this is illegitimate. Indistinguishability shows we can't *tell* them apart by introspection alone, but it doesn't logically *entail* that the states share the same intrinsic metaphysical nature. They could be fundamentally different states that happen to be indistinguishable from the inside (like a perfect counterfeit dollar bill vs. a real one – indistinguishable to you, but fundamentally different kinds of things).

  5.  **Variants of the Move & Their Labels:**
      While "Common Kind Assumption" is the broad umbrella term, the *justification* offered for it can differ, though these don't always have distinct labels:
      *   **Direct Inference / Phenomenological Premise:** This is the most common and the one you described as treated as needing little defense. The reasoning is often presented as: *"How could two experiences be subjectively identical if they weren't constituted by the same kind of mental state? Their subjective character *just is* their mental nature. Therefore, same phenomenology implies same mental kind."* Thinkers like A.J. Ayer (in *The Foundations of Empirical Knowledge*) often presented it this way. Sometimes this is linked to a specific **Phenomenal Principle**: "When a subject has a sensory experience as of something being F, then there is something of which the subject is aware which *is* F." This principle *presupposes* a common kind (the awareness of an F-thing) for both veridical and non-veridical cases. **Label:** Primarily falls under **CKA**, sometimes specifically invoking the **Phenomenal Principle**.
      *   **Inference to the Best Explanation (IBE):** This version explicitly frames the CKA as the *best explanation* for the fact of subjective indistinguishability. The argument runs: *"The simplest and most plausible explanation for why hallucination H feels exactly like veridical perception V is that both involve the very same type of core mental state or event (e.g., awareness of a sense-datum, tokening of a representation). Alternative explanations (like disjunctivism, which posits fundamentally different mental kinds) are less parsimonious or struggle to explain the indistinguishability."* Howard Robinson (in *Perception*) is a notable proponent of this style of argument. **Label:** This is still an argument *for* the **Common Kind Assumption**, but the *justification* is explicitly **Inference to the Best Explanation**. You might call it the **IBE Argument for CKA**.

  6.  **Why "Phenomenal Principle" isn't quite right (though related):**
      The Phenomenal Principle (mentioned above) is a *consequence* or a *specific articulation* *within* theories that accept the CKA. It states that whenever you have a sensory experience *as of* something having a property F, there must *be* something you are aware of that actually *has* F (the sense-datum). While the CKA leads naturally to principles like this (especially in sense-datum theories), the CKA itself is the broader, more fundamental move concerning the *sameness of mental kind* based on indistinguishability.

  **In Summary:**

  *   The core move is universally recognized as the **Common Kind Assumption (CKA)**.
  *   Its core premise is that subjective indistinguishability between veridical perception and hallucination implies sameness of fundamental mental state kind.
  *   It bridges an epistemic fact to a metaphysical claim, often with minimal argument.
  *   Variants differ in justification:
      *   The **Direct Inference / Phenomenological Premise** version treats it as almost self-evident from the nature of experience.
      *   The **Inference to the Best Explanation (IBE)** version argues CKA is the best explanation *for* indistinguishability.
  *   The **Phenomenal Principle** is a specific principle often adopted *by* theories that accept the CKA, but it's not synonymous with the CKA move itself.

  Key philosophers associated with defending or relying heavily on the CKA include A.J. Ayer, H.H. Price, Frank Jackson (in his earlier work), and Howard Robinson (especially the IBE version). Disjunctivists like J.M. Hinton, Paul Snowdon, John McDowell, and M.G.F. Martin explicitly target and reject the CKA, arguing that veridical perception is a mental state of a fundamentally different kind than hallucination, despite possible indistinguishability. William Fish's work (*Perception, Hallucination, and Illusion*) provides a detailed disjunctivist critique focusing precisely on challenging the inference from indistinguishability.
