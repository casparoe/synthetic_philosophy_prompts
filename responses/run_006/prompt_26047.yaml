  The divergence becomes clear when we consider Alex's emotional response. Classical Stoicism might say any disappointment shows improper attachment, while modern Stoicism would see that disappointment as natural since effort was invested. The structural difference is whether "effort" belongs purely in Category 1 (classical view) or straddles Category 1 and 3 (modern view). 

  For the classical defender's rebuttal: They'd argue that effort isn't truly "partially" controllable—it's fully internal. Any suffering over the outcome reveals hidden vice, like secretly wanting recognition. They'd call modern framing a slippery slope toward valuing externals. It’s not callous, they’d say, but radically honest about where agency lies. 

