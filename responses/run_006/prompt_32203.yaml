  First, I need to unpack why this is such a knotty problem. The user is sharp—they notice Nietzsche seems to do two things at once: demolish the idea of a free subject (metaphysics) *and* show how the weak use that idea to morally condemn the strong (genealogy). But if the subject is *always* an illusion, then the weak aren't special in being deluded; everyone is. So why does Nietzsche focus so much on the weak's self-deception? That asymmetry bothers the user. 

