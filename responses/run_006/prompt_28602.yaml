prompt: |-
  I'm trying to pin down what I actually think about Kuhnian incommensurability, and I'd like your help in the form of a decomposed credence.

  The proposition: At least one major episode of scientific change that Kuhn would have classified as a paradigm shift involved a kind of conceptual incommensurability strong enough that the successor paradigm's central theoretical claims could not be fully expressed using the predecessor's conceptual resources without semantic loss or distortion — where "semantic loss or distortion" means that a rational agent equipped only with the predecessor's concepts could not grasp the successor's claims in their entirety, even if they could achieve partial understanding through piecemeal translation of individual terms.

  Please give me your credence in that proposition, decomposed into the sub-questions you think it most depends on. For each sub-question, give a rough probability and a sentence or two of justification. Then show how they combine to yield your overall number. I am less interested in whether the number is exactly right than in seeing which joints the reasoning comes apart at.

  I am especially interested in which sub-question your final credence is most sensitive to — the one where a change in your probability would produce the largest shift in the bottom line — and what kind of evidence or argument would most substantially move you on it. If you think the proposition as stated is ambiguous between stronger and weaker readings of incommensurability (e.g., taxonomic, methodological, or semantic), please flag which reading you are targeting and whether your credence would differ markedly under another.
