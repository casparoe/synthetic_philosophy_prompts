  ### Decision Tree for Evaluating Hypotheses on Observer Count

  **Instructions:** Answer each question based on your inferential commitments in the described cases. Proceed to the next question as directed.

  ---

  #### Start: Root Question
  **Question 1 (Presumptuous Philosopher):**  
  *Two empirically indistinguishable theories exist: one predicts vastly more observers than the other. Does the mere fact that you exist (as an observer) strongly favor the theory predicting more observers?*
  - **Yes** → Go to Leaf (i).  
  - **No** → Proceed to Question 2.

  ---

  #### Question 2 (Coin Flip):  
  *A fair coin is flipped. Heads creates one copy of you; tails creates two identical copies (each with your memories and experiences). Upon waking up with amnesia (so you don’t know the outcome), should you assign 2/3 credence to tails?*
  - **Yes** → Go to Leaf X.  
  - **No** → Proceed to Question 3.

  ---

  #### Question 3 (Doomsday Argument):  
  *Learning your birth rank (e.g., "I am the 60 billionth human") provides evidence that the total number of humans is small (e.g., near 120 billion, not trillions).*
  - **Yes** → Proceed to Question 4.  
  - **No** → Go to Leaf (iii).

  ---

  #### Question 4 (Reference Class Required):  
  *To evaluate the Doomsday Argument, must you specify a reference class (e.g., "humans" vs. "sentient beings")?*
  - **Yes** → Proceed to Question 5.  
  - **No** → Go to Leaf Y.

  ---

  #### Question 5 (Reference Class Uniqueness):  
  *Is there a uniquely correct reference class (e.g., "humans") dictated by the setup or objective criteria?*
  - **Yes** → Go to Leaf (ii).  
  - **No** → Go to Leaf (iv).

  ---

  ### Leaves (Positions)

  1. **Leaf (i): Existence as Evidence**  
     - **Path:** Q1 = Yes.  
     - **Established name:** Self-Indication Assumption (SIA).  
     - **Inferential commitments:** Your existence is evidence favoring hypotheses with more observers. Birth rank may or may not be used, but existence alone updates non-indexical hypotheses.  
     - **Licenses Presumptuous Philosopher?** Yes.  
     - **Awkward commitment:** In otherwise identical theories, you must strongly favor the one with more observers, even if it implies astronomically unlikely fine-tuning.  

  2. **Leaf X: Context-Dependent Existence Evidence**  
     - **Path:** Q1 = No, Q2 = Yes.  
     - **Established name:** Unnamed (rarely defended).  
     - **Inferential commitments:** Existence updates hypotheses in the coin flip (weighting by observer count) but not in the Presumptuous Philosopher.  
     - **Licenses Presumptuous Philosopher?** No.  
     - **Awkward commitment:** Must explain why identical evidence (existence) updates non-indexical hypotheses in one case but not the other.  

  3. **Leaf (ii): Random Birth Rank in Fixed Reference Class**  
     - **Path:** Q1 = No, Q2 = No, Q3 = Yes, Q4 = Yes, Q5 = Yes.  
     - **Established name:** Self-Sampling Assumption (SSA).  
     - **Inferential commitments:** Reason as if your birth rank is random in a unique reference class. Existence alone does not favor more observers.  
     - **Licenses Presumptuous Philosopher?** No.  
     - **Awkward commitment:** The "unique" reference class (e.g., "humans") is arbitrary; no objective criteria fix it.  

  4. **Leaf (iv): Reference Class Underdetermination**  
     - **Path:** Q1 = No, Q2 = No, Q3 = Yes, Q4 = Yes, Q5 = No.  
     - **Established name:** Reference Class Problem.  
     - **Inferential commitments:** Birth rank requires a reference class, but none is unique. Conclusions reverse under different admissible choices.  
     - **Licenses Presumptuous Philosopher?** No.  
     - **Awkward commitment:** Doomsday Argument conclusions are arbitrary—e.g., choosing "sentient beings" over "humans" reverses the prediction.  

  5. **Leaf Y: Birth Rank Without Reference Class**  
     - **Path:** Q1 = No, Q2 = No, Q3 = Yes, Q4 = No.  
     - **Established name:** Unnamed (unexplored).  
     - **Inferential commitments:** Birth rank updates hypotheses but requires no reference class. Existence alone is irrelevant.  
     - **Licenses Presumptuous Philosopher?** No.  
     - **Awkward commitment:** No clear method to update on birth rank without a reference class (e.g., how to define "random" sampling).  

  6. **Leaf (iii): No Updating on Self-Locating Evidence**  
     - **Path:** Q1 = No, Q2 = No, Q3 = No.  
     - **Established name:** Epistemic Separability or No-Correlation Rule.  
     - **Inferential commitments:** Self-locating information (existence or birth rank) does not update non-indexical hypotheses.  
     - **Licenses Presumptuous Philosopher?** No.  
     - **Awkward commitment:** In Doomsday, knowing you’re early in human history provides *zero* evidence about total human count.  

  ---

  ### Unoccupied Combinations & Comments
  - **Q1=Yes + Q2=No:**  
    *Empty?* Unexplored. Logically coherent but unmotivated: Existence updates in Presumptuous Philosopher, but coin flip doesn’t weight observer count. No known position defends this.
  - **Q1=Yes + Further splits (birth rank):**  
    *Not included*: The tree focuses on existence evidence for Leaf (i). Birth rank usage in SIA is a sub-variant but doesn’t alter core existence commitments.
  - **Incoherent branch:** Q1=No + Q2=Yes is occupied (Leaf X) but widely seen as inconsistent, hence unattractive.

  ### Ambiguities & Notes
  - **Tree separation:** All leaves are distinct. Leaf (ii) and (iv) both require reference classes but split on uniqueness (Q5). Leaf (iii) and Leaf Y both reject existence evidence but split on birth rank (Q3) and reference class (Q4).  
  - **Presumptuous Philosopher conclusion:** Only Leaf (i) licenses it.  
  - **Key insight:** Positions are separated by *what evidence updates non-indexical hypotheses* (existence? birth rank?) and *how* (reference class dependence). Labels like "SSA" are secondary to inferential rules.  

