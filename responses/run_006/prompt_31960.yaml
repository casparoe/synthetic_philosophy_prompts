answer: |-
  Here is the essay question, model answer, and marking scheme as requested, adhering to British English conventions.

  ---

  **1. Essay Question**

  "**The Frege-Geach problem is often described as a challenge concerning the 'embedding' of moral terms. Explain why this characterisation, whilst accurate at a surface level, obscures the deeper *architectural* challenge the problem poses for expressivist metaethical theories. What fundamental feature of moral language (and language more generally) does the Frege-Gach problem reveal expressivism struggles to account for, and why is this feature crucial for the viability of expressivism as a theory of moral discourse? Evaluate one major expressivist solution (e.g., Blackburn's quasi-realism, Gibbard's norm-expressivism, or Schroeder's being-for account) specifically in terms of whether and how it addresses this underlying architectural challenge. Does it genuinely resolve the core issue, or merely relocate the difficulty?**"

  *(Word Limit: 2,000 words)*

  ---

  **2. Model Answer (Approx. 750 words)**

  **Architecture Uncovered: The Frege-Geach Problem as a Challenge to Expressivist Compositionality**

  The Frege-Geach problem is routinely introduced as an embedding problem for expressivism: how can non-cognitive states (like disapproval or planning) expressed by simple moral utterances (e.g., "Stealing is wrong") also be expressed when those utterances are embedded within unasserted contexts, such as conditionals ("If stealing is wrong, then...") or disjunctions? While descriptively correct, framing the problem *solely* as one of embedding risks masking its profound architectural significance. This essay contends that the Frege-Geach problem exposes expressivism’s struggle to provide a *compositional* semantics for moral language that aligns with its core non-cognitive commitments. Compositionality – the principle that the meaning of a complex expression is systematically determined by the meanings of its constituent parts and their mode of combination – is the fundamental linguistic feature threatened. Without a plausible compositional account, expressivism cannot explain the logical structure of moral reasoning, thereby undermining its aspiration to be a comprehensive theory of moral discourse.

  Expressivism’s core thesis is that the primary function of moral assertions is not to describe mind-independent facts but to express non-cognitive attitudes. For instance, uttering "Stealing is wrong" expresses disapproval of stealing. This account seems plausible for atomic moral sentences. However, Geach’s insight, building on Frege, is that the meaning of a word (like "wrong") must be consistent across all its occurrences, whether in asserted or unasserted contexts, for logical inferences to be valid. Consider the valid modus ponens:
  1. If stealing is wrong, then getting little brother to steal is wrong.
  2. Stealing is wrong.
  3. Therefore, getting little brother to steal is wrong.

  The term "wrong" in premise 1 (within the antecedent) and premise 2 (asserted) must have the *same meaning* for the inference to work. Yet, on a simple expressivist view, the meaning of "wrong" in premise 2 is tied to the expression of disapproval. What meaning does "wrong" have in the unasserted antecedent of premise 1? It cannot straightforwardly be expressing disapproval *at that moment*, as the speaker is not asserting that stealing is wrong. Expressivism thus appears committed to an equivocation: "wrong" means one thing (expressing disapproval) when asserted and something else (undefined or different) when embedded. This equivocation invalidates the inference on expressivist grounds, contradicting our clear intuition that such arguments *are* valid. The architectural challenge, therefore, is not merely fitting attitudes into complex sentences, but providing a *unified, compositional account* of moral vocabulary that explains how the *contribution* of a moral term like "wrong" to the meaning of *any* sentence in which it appears remains constant, thereby enabling logic, whilst staying true to the non-cognitive nature of its core expressive function. Compositionality is crucial because language is productive and systematic; we understand indefinitely many novel sentences. A viable expressivism must explain this systematicity for moral language without collapsing into descriptivism.

  Simon Blackburn’s quasi-realism represents a significant attempt to meet this challenge. Blackburn proposes that we understand moral discourse *as if* it were descriptive, even though its functional basis is attitudinal. His solution for embeddings like conditionals involves higher-order attitudes. To accept "If stealing is wrong, then getting little brother to steal is wrong" is not to express disapproval of stealing, but to express a *higher-order disapproval*: disapproval of combining disapproval of stealing with a lack of disapproval of getting little brother to steal. The meaning of "wrong" in the antecedent is thus linked to its role in this complex attitude expression. The consistency required for logic is secured by the consistency of the underlying attitudes one can coherently hold.

  Evaluated against the *architectural* challenge of compositionality, however, quasi-realism encounters significant difficulties. While it ingeniously preserves the non-cognitive core and validates the *pattern* of inference, it arguably fails to provide a genuinely compositional semantics. The problem is that the account of what "wrong" *contributes* to the meaning of the complex sentence shifts dramatically depending on the linguistic context. In the atomic assertion, "wrong" directly contributes disapproval (D). But in the antecedent of the conditional, it doesn't contribute D itself, nor does it contribute a *referential* element. Instead, it contributes a specific *role* within the expression of a higher-order attitude (H). This role (being the object of the first disapproval in H) is fundamentally different in kind from the attitude expressed by "wrong" in isolation. Crucially, the meaning of the *constituent part* ("wrong") seems to be *defined in terms of its contribution to the meaning of the whole sentence type* (the conditional), rather than the sentence's meaning being built compositionally *from* the stable meanings of its parts. This threatens to invert the direction of compositionality. While Blackburn provides a systematic way to map sentences onto attitude expressions, it remains questionable whether this mapping reflects a compositional *semantics* where the meaning of the whole is determined by the meanings of the parts and syntax, rather than being a complex *pragmatic* projection from the atomic case. The core meaning of "wrong" itself remains elusive and context-dependent in a way that seems incompatible with a robust notion of compositional content.

  Therefore, whilst Blackburn's quasi-realism offers a sophisticated response to the embedding puzzle and preserves logical validity pragmatically, it struggles to resolve the deeper architectural challenge concerning compositionality. It demonstrates *how* an expressivist might mimic the logic of descriptive discourse through complex attitudes, but it does not convincingly show that the meaning of moral terms *themselves* remains constant and contributes compositionally across all contexts in the way required for a unified semantic theory. The problem is not merely relocated; it highlights the persistent tension within expressivism between its non-cognitive foundations and the compositional demands of systematic, logical language. Genuinely resolving the Frege-Geach problem architecturally likely requires an expressivist semantics that can specify a stable, context-independent semantic contribution for moral terms – a contribution compatible with non-cognitivism that systematically interacts with logical operators – a challenge that arguably remains unmet.

  ---

  **3. Marking Scheme**

  **Band: First Class (70% and above)**
  *   **Core Achievement:** Clearly identifies the Frege-Geach problem as an *architectural challenge to compositional semantics*, not merely an embedding puzzle. Explicitly articulates that the problem reveals expressivism's struggle to provide a unified account of how the *meaning contribution* of moral terms remains constant across asserted and unasserted contexts to enable logic, whilst staying non-cognitive.
  *   **Analysis:** Demonstrates a deep understanding of *why* compositionality is fundamental to language and why its absence threatens expressivism's viability as a comprehensive theory of moral discourse (systematicity, productivity, logic).
  *   **Evaluation:** Chooses a specific solution (e.g., Blackburn, Gibbard, Schroeder) and evaluates it *critically and precisely* through the lens of compositional semantics. Goes beyond describing the solution to assess *how well* it provides a stable, context-independent semantic contribution for moral terms that interacts systematically with logical operators. Identifies specific strengths and weaknesses concerning compositionality (e.g., context-dependency, inversion of explanation, pragmatic vs semantic success).
  *   **Argument & Structure:** Presents a tightly structured, lucid, and logically rigorous argument. Precise use of terminology. Excellent conceptual clarity. Original insights may be present.
  *   **Common Misunderstanding Avoided:** Does not treat solving simple conditionals as solving the core problem; focuses on the underlying compositional architecture.

  **Band: Upper Second (60-69%)**
  *   **Core Achievement:** Correctly identifies the Frege-Geach problem as concerning embedding and the consistency of meaning needed for logic. Understands it poses a serious challenge to expressivism beyond simple assertions.
  *   **Analysis:** Explains *that* consistency across contexts is needed for logic and why expressivism initially struggles with this. Mentions compositionality but may not fully unpack its fundamental nature and systemic implications for expressivist semantics. Explains why the problem matters for expressivism's plausibility.
  *   **Evaluation:** Describes a specific solution accurately and attempts evaluation. The evaluation may focus on whether the solution handles specific embeddings (like conditionals) or preserves logical validity, but may lack depth in analysing *how* it addresses (or fails to address) the compositional *semantics* – the nature of the word's contribution across contexts. Critique might be somewhat superficial or not fully integrated with the architectural challenge.
  *   **Argument & Structure:** Well-structured, clear, and competent argument. Good use of terminology, though perhaps less precise than a First. Generally sound conceptual grasp.
  *   **Separating Factor from First:** Often stops at recognising the need for consistency/logic without fully articulating the *compositional semantic architecture* as the core issue. Evaluation tends to focus on the solution's success with embeddings/logic rather than its adequacy as a compositional semantics per se.

  **Band: Lower Second (50-59%)**
  *   **Core Achievement:** Provides a basic description of the Frege-Geach problem, typically characterising it correctly as an embedding problem for expressivism concerning unasserted contexts like conditionals.
  *   **Analysis:** Offers a limited explanation of *why* it's a problem (e.g., expressivism struggles with unasserted contexts, which might make logic difficult). May mention consistency or logic but without depth. Little to no engagement with the concept of compositionality or the deeper architectural challenge. The significance for expressivism might be stated but not explored.
  *   **Evaluation:** Describes an attempted solution (potentially vaguely or with minor inaccuracies). Evaluation is weak, absent, or consists only of stating whether the solution "works" for conditionals without deeper analysis. Fails to connect the evaluation meaningfully to the core challenge beyond embedding.
  *   **Argument & Structure:** Some structure present but may be disjointed or lack clear progression. Arguments may be underdeveloped or contain some conceptual confusion. Terminology may be used loosely.

  **Band: Third / Fail (Below 50%)**
  *   **Core Achievement:** Significantly misdescribes or misunderstands the Frege-Geach problem (e.g., confusing it with other metaethical issues, misstating what embedding involves, misrepresenting expressivism).
  *   **Analysis:** Fails to articulate why the problem poses a challenge for expressivism, or offers irrelevant or incorrect explanations. No grasp of compositionality or the architectural issue.
  *   **Evaluation:** Fails to describe a solution accurately, evaluates something irrelevant, or omits evaluation entirely. May not identify a specific solution.
  *   **Argument & Structure:** Poorly structured, unclear, or incoherent. Significant conceptual errors or confusion. Inadequate use of terminology. May be significantly underlength or fail to address key parts of the question.
  *   **Fail Threshold (<40%):** Demonstrates a fundamental lack of understanding of the course material related to the question. Major omissions or pervasive errors.

  **Note on the Common Misunderstanding Separating Upper Seconds from Firsts:**
  The most frequent misunderstanding preventing an Upper Second script from achieving a First is treating the Frege-Geach problem *primarily as a puzzle about handling specific grammatical constructions* (especially conditionals), and evaluating solutions primarily on whether they make those specific constructions 'work' logically or attitudinally. While handling embeddings is necessary, the First-class script recognises that this is symptomatic of the deeper, architectural challenge: providing a *compositional semantics* where moral terms make a *stable, context-independent contribution to meaning* that explains linguistic systematicity and logical validity *in virtue of that compositional structure*, consistent with non-cognitivism. Upper Seconds often grasp the surface requirement for consistency across contexts for logic but fail to delve into the *nature of semantic contribution* and the demands of compositionality that constitute the core theoretical hurdle for expressivism.
