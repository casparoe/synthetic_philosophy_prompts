prompt: |-
  A philosophy podcast I listened to summarized the debate about stakes and knowledge roughly as follows:

  Contextualists argue that whether you know something depends on how much is at stake for you. DeRose's bank case shows this: if you're just deciding whether to deposit a check on Saturday, you know the bank will be open based on your memory of visiting last week; but if your mortgage payment is about to bounce, you no longer know it. This is called pragmatic encroachment, and it shows that knowledge isn't purely epistemic — practical factors seep in.

  I've since heard that contextualism and pragmatic encroachment are distinct views and that conflating them is a common mistake. I'd like to know: which parts of the podcast's summary are accurate, which are subtly wrong, and how would a defender of each view — contextualism and pragmatic encroachment — react to being described this way? Go sentence by sentence if that helps.
reasoning: |-
  Okay, the user is asking about a summary from a philosophy podcast they listened to regarding contextualism and pragmatic encroachment. They mentioned that the podcast seemed to conflate these two views, and they've heard that this is a common mistake. Now they want me to go through the summary sentence by sentence, pointing out what's accurate and what's subtly wrong, and explain how defenders of each view would react.

  Let me start by recalling the key differences between contextualism and pragmatic encroachment. Contextualism is about how the word "know" changes meaning based on context—like what's at stake affects what counts as satisfying the word "knows." On the other hand, pragmatic encroachment argues that practical stakes directly affect whether someone has knowledge, meaning knowledge itself is partly practical, not just the semantics of the word.

  Looking at the podcast's summary: It starts by saying contextualists argue that whether you know something depends on stakes. That's a common oversimplification. Contextualists would clarify that stakes affect the standards for "know," not the knowledge itself. The DeRose bank case is often cited by contextualists, but pragmatic encroachment theorists use it too. The summary then says this is called pragmatic encroachment, which is incorrect—they're conflating the two.

  The user's deeper need here seems to be understanding these concepts clearly, avoiding common misconceptions. They might be a philosophy student or enthusiast trying to grasp nuanced debates. Their confusion is understandable because even philosophers sometimes mix these up. I should break down each part of the summary, correct inaccuracies, and explain each view's perspective clearly.

  For the first sentence: The podcast says contextualists argue knowledge depends on stakes. But contextualists focus on semantic context-sensitivity. They'd say the truth conditions of "S knows P" change with context. Pragmatic encroachment theorists, however, agree that knowledge depends on stakes but as a metaphysical point—knowledge itself is stake-sensitive.

  The DeRose bank case: Both views use it, but they interpret it differently. Contextualists see it as different contexts raising epistemic standards. Pragmatic encroachment theorists see the same evidence but different stakes affecting justification. The summary calling this pragmatic encroachment is wrong—it's a conflation.

  The term "pragmatic encroachment" in the summary is misapplied. Pragmatic encroachment is a distinct view, not just another name for contextualism. Defenders of each would be annoyed by this mix-up. Contextualists like DeRose emphasize the semantic aspect, while pragmatic encroachment theorists like Hawthorne or Stanley focus on how practical factors alter knowledge itself.

  I should also mention that while both agree that stakes affect whether we attribute knowledge, their reasons differ. Contextualism is about language, pragmatic encroachment about the nature of knowledge. Highlighting these distinctions will help the user avoid future confusion. Providing examples and clarifying each reaction will make the explanation clearer.
answer: |-
  Let's break down the podcast summary sentence-by-sentence, identifying accurate elements, subtle errors, and how defenders of each view would react:

  **Podcast Summary Sentence:** "Contextualists argue that whether you know something depends on how much is at stake for you."

  *   **Accurate:** This captures the *phenomenon* contextualists aim to explain: our *intuitions* about knowledge attributions (saying "S knows P" or "S doesn't know P") shift with practical stakes.
  *   **Subtly Wrong:** Contextualists do **not** argue that the *state of knowing itself* depends on stakes. They argue that the *meaning of the word "knows"* (specifically, the epistemic standards required to truthfully say "S knows P") shifts with the conversational context, which is often influenced by stakes. "Knows" is context-sensitive, like "tall" (what counts as "tall" depends on context).
  *   **Contextualist Reaction:** Defenders (e.g., Keith DeRose, David Lewis, Stewart Cohen) would strongly object: "No! We argue that *what it takes to truthfully say 'S knows P'* depends on the stakes/context. But the underlying epistemic state itself (justified true belief meeting a specific fixed standard) might be constant. Stakes affect the *semantics* of knowledge attributions, not necessarily the *metaphysics* of knowledge itself."
  *   **Pragmatic Encroachment Reaction:** Defenders (e.g., Jeremy Fantl, Matthew McGrath, Jason Stanley) would partially agree but see it as incomplete: "While true that contextualists *explain* our intuitions using context-sensitivity, we think stakes *do* directly affect the epistemic state itself. Contextualism gets the surface language right but misses the deeper truth about knowledge."

  **Podcast Summary Sentence:** "DeRose's bank case shows this: if you're just deciding whether to deposit a check on Saturday, you know the bank will be open based on your memory of visiting last week; but if your mortgage payment is about to bounce, you no longer know it."

  *   **Accurate:** This is a faithful description of DeRose's famous thought experiment and the intuitive judgments it elicits. Both contextualists and pragmatic encroachment theorists use this case as core evidence for their views. The *intuition* described is central to the debate.
  *   **Subtly Wrong:** The phrase "shows this" refers back to the previous sentence's description of contextualism. While contextualists *use* the case to support their semantic theory, pragmatic encroachment theorists *also* use the *same case and same intuitions* to support their very different metaphysical claim. The case itself is neutral; it's the *explanation* for the differing intuitions that separates the views.
  *   **Contextualist Reaction:** "This perfectly illustrates the phenomena we explain! In the low-stakes context, 'knows' has low standards; in the high-stakes context, 'knows' has high standards. The speaker's truth conditions change. The underlying facts about the subject's evidence might remain the same."
  *   **Pragmatic Encroachment Reaction:** "This case brilliantly highlights the core data. But contextualists misinterpret it. The subject's *actual epistemic position* (their justification) weakens when the stakes rise because the *cost of being wrong* becomes relevant to what counts as sufficient justification. Knowledge itself is lost in high stakes, not just the truth of saying 'knows'."

  **Podcast Summary Sentence:** "This is called pragmatic encroachment..."

  *   **Accurate:** The phenomenon described in the bank case (stakes affecting knowledge attributions/knowledge itself) *is indeed* often referred to broadly as "pragmatic encroachment" on knowledge.
  *   **Subtly Wrong (Major Conflation):** This is the core mistake. **Contextualism and Pragmatic Encroachment are distinct theories *explaining* this phenomenon.** Calling the contextualist *explanation* of the bank case "pragmatic encroachment" is incorrect and conflates the two views. Pragmatic Encroachment (PE) is a specific *metaphysical* thesis: practical factors (like stakes) partly *constitute* whether one has knowledge (or sufficient justification for knowledge) – they "encroach" on the traditionally purely epistemic factors. Contextualism is a *semantic* thesis about the context-sensitivity of the *word* "knows".
  *   **Contextualist Reaction:** "This is deeply misleading! *We are not pragmatic encroachment theorists!* We offer a purely semantic explanation (shifting standards for 'knows') for the pragmatic *effects* on knowledge *attributions*. There's no 'encroachment' on knowledge itself in our view. Pragmatic encroachment is a rival theory!" (DeRose explicitly distinguishes his contextualism from PE).
  *   **Pragmatic Encroachment Reaction:** "This conflation is frustratingly common. Contextualism is about how we *talk* about knowledge. Pragmatic Encroachment is about what knowledge *is*. We argue that pragmatic factors *do* encroach on the epistemic, becoming part of the *conditions* for knowledge itself. The podcast has mistakenly labeled contextualism as PE."

  **Podcast Summary Sentence:** "...and it shows that knowledge isn't purely epistemic — practical factors seep in."

  *   **Accurate:** This captures the *shared conclusion* drawn by **both** views from cases like the bank case: Traditional "purist" or "intellectualist" views of knowledge (which hold that knowledge depends *only* on truth-conducive factors like evidence, reliability, and truth) are inadequate. Practical factors *do* play a role.
  *   **Subtly Wrong:** The "it" refers back to the conflation (calling contextualism PE). Crucially, the two views disagree *fundamentally* on *how* practical factors "seep in":
      *   **Contextualism:** Practical factors affect the *semantic standards* for applying the *word* "knows". Knowledge itself (as a state meeting context-invariant standards) *might* still be purely epistemic (though contextualism is agnostic on this).
      *   **Pragmatic Encroachment:** Practical factors *directly affect the epistemic state* (e.g., by raising the threshold of justification required for knowledge). Knowledge itself is *not* purely epistemic; it has an irreducibly practical component.
  *   **Contextualist Reaction:** "We agree practical factors affect knowledge *attributions*, but they do this by shifting the meaning of 'knows'. They don't necessarily 'seep into' the *nature* of the knowledge relation itself. Our explanation keeps knowledge itself purely epistemic. Any 'seeping in' is linguistic, not metaphysical."
  *   **Pragmatic Encroachment Reaction:** "This conclusion is correct: knowledge isn't purely epistemic. Practical factors *do* seep into the *constitutive conditions* for knowledge itself. But the 'it' here wrongly implies contextualism *is* the view that makes this claim, which it isn't. Contextualism avoids this metaphysical claim by making it about language."

  **Summary of Key Differences & Reactions:**

  1.  **Phenomenon Explained:** Both agree that intuitions about knowledge attribution (like the bank case) vary with practical stakes.
  2.  **Contextualism (Semantic):** Explains this by saying the *word "knows"* is context-sensitive. Stakes change the standards required to truthfully *say* "S knows P". Knowledge *itself* might be invariant. *(Reaction to Podcast: "You described the phenomenon we explain, but wrongly labeled our explanation as PE and implied we think knowledge isn't purely epistemic.")*
  3.  **Pragmatic Encroachment (Metaphysical):** Explains this by saying practical stakes *directly affect the epistemic state* (justification/knowledge itself). Higher stakes require stronger justification for the *same belief* to count as knowledge. Knowledge inherently has a practical dimension. *(Reaction to Podcast: "You correctly state our core conclusion (knowledge isn't purely epistemic), but you misattributed it to contextualism and conflated the views by calling contextualism 'pragmatic encroachment'.")*
  4.  **Conflation:** The podcast's major error is using "pragmatic encroachment" to label the contextualist explanation, when PE is actually a competing explanation for the same intuitive data.

  In essence, the podcast accurately describes the intuitive phenomenon (the bank case and its stakes-sensitivity) but fundamentally misrepresents the theoretical landscape by conflating the semantic explanation (Contextualism) with the metaphysical explanation (Pragmatic Encroachment) and mislabeling the former as the latter. Defenders of both views would object to this conflation and mislabeling, though they agree on the core data point (stakes matter).
