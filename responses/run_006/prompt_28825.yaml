answer: |-
  The right way to think about how much to stake each week is to maximize the long-term growth rate of your bankroll, rather than focusing solely on expected value or avoiding risk entirely. Betting your entire bankroll every week, as one friend suggests, exposes you to a high risk of ruin due to the inherent volatility of coin tosses—even with a positive expected value, a string of losses can wipe you out. On the other hand, betting nothing, as the other friend advises, means missing out on a profitable opportunity, as the bet has a positive expected return.

  The principled approach is to use the Kelly criterion, which balances growth and risk by maximizing the expected logarithm of wealth over time. For a bet with a win probability \(p\) and net fractional odds \(b\) (the profit per unit staked if you win), the Kelly fraction \(f^*\) of your bankroll to bet is given by:

  \[
  f^* = \frac{p(b + 1) - 1}{b}
  \]

  In this case:
  - The coin comes up heads with probability \(p = 0.6\) (based on your mate's claim).
  - On a win (heads), you receive your stake back plus £1.50 for every £1 staked, so the profit per unit staked is \(b = 1.5\).
  - On a loss (tails), you lose your stake, so your wealth is multiplied by \(1 - f\).

  Plugging in the values:

  \[
  f^* = \frac{0.6 \times (1.5 + 1) - 1}{1.5} = \frac{0.6 \times 2.5 - 1}{1.5} = \frac{1.5 - 1}{1.5} = \frac{0.5}{1.5} = \frac{1}{3} \approx 0.333
  \]

  Thus, with a known \(p = 0.6\), the Kelly fraction is approximately 33.3% of your current bankroll. Betting this fraction maximizes the long-term growth rate of your bankroll, as it optimally balances the trade-off between risk and return.

  However, you have uncertainty about the true probability of heads, as you've only observed about 20 coin flips. This uncertainty must be accounted for because:
  - The standard error for \(p\) from 20 flips is roughly \(\sqrt{\frac{0.6 \times 0.4}{20}} \approx 0.11\), meaning the true probability could easily be as low as 0.55 or 0.50 (e.g., if you saw 11 or 10 heads in 20 flips).
  - If \(p\) is lower than 0.6, betting the full Kelly fraction based on \(p = 0.6\) leads to overbetting, increasing the risk of ruin and reducing growth.
  - For example, if \(p = 0.55\), the Kelly fraction would be:
    \[
    f^* = \frac{0.55 \times (1.5 + 1) - 1}{1.5} = \frac{0.55 \times 2.5 - 1}{1.5} = \frac{1.375 - 1}{1.5} = \frac{0.375}{1.5} = 0.25
    \]
    This is lower than the 33.3% for \(p = 0.6\).

  To handle uncertainty, a conservative approach is to use a fractional Kelly strategy, such as betting half the Kelly fraction based on your best estimate of \(p\). With \(p = 0.6\), half-Kelly would be about 16.7% of your bankroll. Alternatively, you can adjust your point estimate of \(p\) downward to be more conservative. For instance:
  - Using \(p = 0.55\) as a conservative estimate (reflecting that the true probability "could easily be a bit less"), the Kelly fraction is 25%.
  - Betting 20–25% is a reasonable starting point given the uncertainty.

  Additionally, since this is a weekly bet, you should:
  1. **Use your observations to update your estimate of \(p\)**: Treat each coin flip (whether you bet or not) as data to refine \(p\). Start with a prior belief (e.g., a uniform Beta(1,1) distribution), update with the observed flips, and use the posterior mean of \(p\) in the Kelly formula each week. For example:
     - If you have seen 20 flips with \(k\) heads, the posterior mean of \(p\) is \(\frac{k + 1}{22}\) under a uniform prior. Update this as you see more flips.
     - If you have not recorded the exact number of heads, assume a conservative value like \(k = 11\) (55% heads) for initial calculations.
  2. **Adjust your bet fraction weekly**: Recalculate the Kelly fraction based on your updated \(p\) estimate and current bankroll. This adapts to new information and reduces risk early on.
  3. **Monitor performance**: If the observed win rate over time suggests a different \(p\), revise your strategy accordingly.

  In summary:
  - The Kelly criterion provides the principled answer for bet sizing under known probabilities.
  - With uncertainty about \(p\), use a conservative estimate (e.g., \(p = 0.55\)) or a fractional Kelly approach (e.g., 50–75% of the full Kelly fraction).
  - Start by betting around 20–25% of your bankroll, update \(p\) with each coin flip, and adjust weekly.

  This strategy maximizes long-term growth while managing risk, avoiding the pitfalls of both your friends' advice. Over time, as you gather more data, your bet sizing will become more accurate.

