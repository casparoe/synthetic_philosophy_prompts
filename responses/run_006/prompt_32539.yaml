answer: |-
  You're sharp to spot the ambiguity, but this **is a fundamental disagreement about law's nature**, not mere semantics. Here's why:

  1.  **Hart's Core Claim:** Law is a *social fact*. Its existence and validity depend solely on its source within a recognized system (e.g., enacted by a legislature following its rules). Morality is separate. A morally repugnant rule (like a Nazi law demanding denunciation of innocents) is still *valid law* within its system. Calling it law doesn't endorse it; it clarifies the nature of the beast we're dealing with. We then make the *separate moral judgment* that it's too wicked to obey or enforce.

  2.  **Fuller's Core Claim:** Law isn't just social fact; it has an *internal morality*. To *be* law (not just *called* law), a system must meet minimum standards of procedural justice inherent in the enterprise of governing through rules (his 8 principles: generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between rules and administration). A system systematically violating these (like Nazi arbitrary terror) isn't a "legal system" at all; it's a perversion of law, mere managerial direction or coercion. Morality isn't separate; it's baked into the very concept of legality.

  **Why it's Substantive, Not Just Rhetorical:**

  *   **The Criterion for "Law":** They disagree on *what makes something law*. Hart: Source-based pedigree. Fuller: Procedural morality *plus* source. For Hart, Nazi law was valid but evil. For Fuller, it wasn't law *because* it was evil (in its procedural failures).
  *   **The Obligation Question:** This directly impacts the citizen's/judge's dilemma. Hart forces an explicit moral confrontation: "This *is* law, but conscience demands disobedience/refusal to apply." Fuller offers a conceptual escape hatch: "This *cannot be law*, so I need not grant it the authority or obedience due to law." The practical difference in how a judge rules on a grudge-informer case is stark.
  *   **The Nature of the Enterprise:** Hart sees law as a neutral tool for social control. Fuller sees it as a distinct, purpose-driven practice aimed at human flourishing through reciprocal rule-governance. Its *form* inherently constrains its *substance*.

  **Why it Matters:**

  *   **Clarity vs. Critique:** Hart's separation forces us to confront evil laws *as evil*, not hide behind legalistic language. It demands explicit moral argument.
  *   **Resisting Tyranny:** Fuller's view provides a conceptual tool to deny legitimacy *within the legal framework itself* to fundamentally unjust regimes. It builds resistance into the definition of law.
  *   **Rebuilding Justice:** Post-atrocity (like post-Nazi Germany), Fuller's approach more easily justifies invalidating past "laws" as never truly lawful, aiding transitional justice. Hart requires explicitly retroactive legislation or moral condemnation.

  **My Commitment:** **Fuller identifies something essential that Hart misses.** Law *is* more than just commands backed by threats. It is a *practice* aiming for order through rules, which *inherently* requires a baseline of procedural fairness. A system utterly devoid of Fuller's principles (like Nazi arbitrary terror) *isn't* law – it's its antithesis. Calling it law grants it a legitimacy it doesn't deserve and obscures its true, corrosive nature. Law has an internal morality constitutive of its existence. The disagreement is real and vital.
