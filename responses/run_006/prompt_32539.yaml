  Alright, so I've been reading up on this Hart–Fuller debate—you know, the one from the Harvard Law Review in '58—and I'm trying to get straight what's really at stake between them. I spent my career in biology, so legal philosophy is new to me, but the way I'm reading it, both of them are bothered by the same thing: what do you do with laws that are technically valid but morally monstrous? The Nazi grudge-informer cases, that sort of thing. Hart says we should keep "law" and "morality" conceptually separate—call it law, but say it's too wicked to obey. Fuller says no, if a legal system violates certain basic principles of legality (he's got eight of them, right?), it's not really a legal system at all; it's just coercion dressed up in legal language.

  Here's what I can't quite get my head around: is this a genuine disagreement about the nature of law, or is it more like a disagreement about what we should *say* about law—a kind of pragmatic or rhetorical choice? Because sometimes it feels like Hart and Fuller are just recommending different ways of talking, and other times it feels like they're making incompatible claims about what law *is*. Which is it, and why does it matter? 

  I'd like a committed answer here—don't just give me a survey of the literature. Take a side and defend it. And keep it to 500 words max, I'm trying to read denser stuff these days but my patience isn't what it was.
