answer: |-
  That's a brilliantly sharp observation of a pervasive and rhetorically powerful move. You've identified a genuine phenomenon that operates in a grey zone between description and evaluation, often leveraging the *implication* of discredit while formally disclaiming it. Let's dissect it carefully:

  **The Core Move: Crypto-Normative Genealogy (or Implicit Genetic Fallacy)**

  1.  **Step 1: Discreditable Origin:** The actor presents a historical or causal account of a norm/value (N) that portrays its origins as:
      *   Non-ideal (e.g., rooted in power, oppression, ignorance, self-interest, accident).
      *   Irrelevant to current justifications (e.g., originating from discarded metaphysical beliefs).
      *   Contingent and arbitrary (e.g., could easily have been otherwise).
      *   Often specifically contrasting with the *stated* or *perceived* noble justifications for N (e.g., monogamy from love/commitment vs. inheritance; rights from inherent dignity vs. secularized theology).

  2.  **Step 2: Formal Disavowal of Evaluation:** When challenged ("That's just the genetic fallacy!"), the actor *explicitly* denies making an evaluative claim: "I'm merely explaining *how* it arose, not saying it's *wrong*." This shields them from the direct charge of committing the fallacy.

  3.  **Step 3: Implicit Devaluation (The "Creep"):** Despite the disavowal, the actor employs rhetorical devices that implicitly cast doubt on N:
      *   **Tone:** Skeptical, ironic, "debunking," "unmasking."
      *   **Framing:** Presenting the origin as the "real" story, contrasting it with the "myth" or "noble lie."
      *   **Juxtaposition:** Placing the discreditable origin narrative immediately before or after discussing N's current claims to legitimacy, creating an associative link.
      *   **Emphasis:** Highlighting the unsavory, irrational, or contingent aspects while downplaying or ignoring potential functional adaptations, evolving meanings, or current independent justifications.
      *   **Absence of Counterbalance:** Failing to offer any account of why N *might* be valuable *despite* its origins, or how its meaning/function may have transformed.

  **The Result:** The audience is led (often successfully) to feel that N has been "exposed," "undermined," or "demystified," *without* the actor having to make a direct evaluative argument about N's *current* validity, justification, or consequences. The *rhetorical force* is debunking, while the *formal claim* is merely explanatory.

  **Distinguishing It From Adjacent Concepts:**

  1.  **Genetic Fallacy (Proper):**
      *   **Explicit Claim:** Argues that the origin *determines* current value ("It came from X, therefore it's bad/good now").
      *   **Evaluation:** Overt and direct.
      *   **Your Move:** Avoids this explicit claim. The evaluation is smuggled in via implication and rhetoric, not stated.

  2.  **Genuinely Evaluatively Neutral Genealogical Explanation:**
      *   **Focus:** Strictly on causal mechanisms, historical context, contingent pathways. Explains *how* N emerged without implying anything about its current validity.
      *   **Tone:** Dispassionate, analytical, historical.
      *   **Presentation:** May acknowledge unsavory origins but doesn't frame them as the "real story" undermining noble myths. Might explicitly note functional shifts or independent justifications. Avoids the "debunking" tone.
      *   **Example:** "Monogamous norms in medieval Europe were heavily influenced by inheritance concerns alongside religious doctrine. Over centuries, the emphasis shifted towards companionate ideals, though property considerations remained significant in some legal frameworks."

  3.  **Genuinely Debunking Genealogy (à la Nietzsche/Foucault):**
      *   **Explicit Goal:** To critically reassess and potentially *undermine* the perceived necessity, universality, or inherent goodness of N. The genealogy is *intended* as part of a critical evaluation.
      *   **Argument:** Connects the contingent, often power-laden origins to the *function* or *meaning* of N *today*, arguing that the origin reveals something essential about its current operation or that it lacks the foundation it claims. Evaluation is central and acknowledged.
      *   **Ownership:** The critic *embraces* the debunking intent. They don't disavow evaluation; they make the case *through* the genealogy.
      *   **Example (Nietzsche):** Christian morality (esp. slave morality) arises from *ressentiment* and weakness. Nietzsche argues this origin reveals its *function* – to empower the weak by demonizing the strong – and that it is *life-denying*. He *wants* to debunk its claim to universal, objective goodness.

  **What to Call It?**

  *   **Crypto-Normative Genealogy:** This captures the key elements: It's genealogical (origin-focused), normative (concerned with values/norms), and crypto (hidden, disguised) in its evaluative intent. "Crypto" emphasizes the concealment of the normative judgment beneath a surface of descriptive neutrality.
  *   **Implicit Genetic Fallacy:** Highlights that it achieves the *rhetorical effect* of the genetic fallacy (discrediting via origin) without formally committing it, relying on implication.
  *   **Rhetorical Genealogical Undermining:** Focuses on the *method* (genealogy) and the *effect* (undermining) achieved through rhetorical means rather than explicit argument.
  *   **Genealogy as Discrediting Insinuation:** Emphasizes the mechanism – using the origin story to insinuate discredit.

  **"Crypto-Normative Genealogy"** is likely the most precise and descriptive term for the phenomenon you've identified.

  **What Makes a Case Count?**

  A paradigmatic case needs:
  1.  **A Norm/Value (N):** The target of the move.
  2.  **A Discreditable Origin Story:** Presented as the "real" or "unmasked" history.
  3.  **Formal Disavowal of Evaluation:** An explicit statement denying that the origin story implies N is invalid *now*.
  4.  **Clear Rhetorical Signals of Devaluation:** Tone, framing, juxtaposition, selective emphasis that creates a strong *impression* that N has been undermined by its origin, *contradicting* the formal disavowal.
  5.  **Absence of Explicit Argument:** No direct argument linking the origin to a specific flaw in N's *current* justification, function, or consequences. The debunking is achieved *solely* through the presentation of the origin and the rhetorical framing.

  **In short:** It's the act of wielding a discreditable origin story *as if* it were a debunking argument, while formally hiding behind the shield of "just explaining," relying entirely on rhetorical implication to do the normative work. "Crypto-Normative Genealogy" names this slippery, often intellectually dishonest, but rhetorically potent maneuver. Nietzsche *intended* his genealogy to be debunking and made explicit arguments connecting origin to current function; your observed move tries to get the debunking effect without the argumentative responsibility.
