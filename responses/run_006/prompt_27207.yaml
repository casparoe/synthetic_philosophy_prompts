  First, I need to break down the components of the move. The core elements are: (1) Discreditable origin presented, (2) Official disavowal of evaluative judgment, (3) Implicit evaluative tone persists. The challenge is labeling this while distinguishing it from adjacent concepts. 

  Genetic fallacy is the direct claim that origin determines current value, which they avoid by disavowing evaluation. Genuine debunking genealogy, like Nietzsche's, explicitly argues that origins reveal contingent power structures affecting current value. This move sits in between—using the origin to imply discredit without owning the argument. 

  Terms like "crypto-normative genealogy" or "implicit genetic fallacy" come to mind. The former captures the hidden normative judgment; the latter the fallacy lurking beneath denial. But "crypto-normative" might be more precise, as it highlights the concealed evaluation. 

  For Nietzsche, he’s explicit about debunking, so he doesn’t fit this move. His genealogy openly argues that origins matter for reassessing values. The user’s observed move is sneakier—denying evaluation while dripping with disdain. 

  The user might also be seeking validation that this is a recognized fallacy. They might want tools to counter it in debates or clarify their own critiques. Naming it gives power to call it out. 

  A case example would need: presentation of discreditable origin, formal disavowal of evaluation, and tonal/subtextual cues suggesting devaluation. The tension between text and subtext is key. Without that, it’s either honest history or direct debunking. 

