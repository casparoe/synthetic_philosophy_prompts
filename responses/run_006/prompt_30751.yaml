answer: |-
  Here are questions structured to challenge your guest's view while hitting your specified pressure points, with follow-ups anticipating common defenses:

  ### **Opening Questions** (Clarifying Foundation)
  1. "You argue that moral luck is illusory and blame/praise should depend solely on factors within an agent's control. Could you briefly define what constitutes 'control' in this context, and why it’s morally paramount?"  
     *(Sets up the control criterion for later challenges)*  
  2. "When you say our ordinary blame practices are a 'mistake,' are you claiming they are *systematically irrational*, or that they reflect a deeper error in moral ontology?"  
     *(Forces him to diagnose the error’s nature)*  

  ---

  ### **Pressure Questions** (Targeting Specific Strains)  
  **1. Resultant Luck as Epistemic?**  
  **Q:** "Some concede outcomes are luck-dependent but argue a *bad result* merely *reveals* flawed character or intent (e.g., reckless driving that kills vs. doesn’t). Does this ‘epistemic’ view salvage our practices, or does it covertly *change the subject* from blaming *actions* to blaming *character*—which itself may be luck-influenced?"  
  *Likely Reply:* "It shifts focus correctly—we blame the vice (recklessness), not the accident."  
  **Follow-up:** "If two drivers exhibit identical recklessness (same speed, distraction), but one kills a child while the other doesn’t, does blaming the killer *more* reveal a character flaw the lucky driver lacks? If not, why do we feel/should we express greater blame toward the killer?"  

  **2. Agent-Regret & Apology**  
  **Q:** "Bernard Williams argued *agent-regret*—the first-person anguish over one’s *own* unlucky harmful acts—is essential to moral life. If luck doesn’t affect blameworthiness, can you accommodate this feeling? Or must agents who cause harm through pure bad luck (e.g., a careful driver who hits a sudden child) feel *no different* from identical drivers who hit nothing?"  
  *Likely Reply:* "Regret can be sympathy for victims, not guilt over increased blameworthiness."  
  **Follow-up:** "So when such an agent apologizes, is it merely expressing sympathy ("I’m sorry this happened to you"), not responsibility ("I’m sorry *I* did this")? Does this reduce apology to condolence, stripping it of moral ownership?"  

  **3. Constitutive Luck’s Threat**  
  **Q:** "Constitutive luck—being born with certain capacities/temperaments—seems wholly uncontrolled. If your 'control' requirement is strict, wouldn’t it eliminate *all* blame/praise? The coward couldn’t control being cowardly; the kind person didn’t ‘earn’ their kindness. Is moral evaluation of *persons* even possible?"  
  *Likely Reply:* "We praise/blame people for *exercising* their capacities responsibly, not for having them."  
  **Follow-up:** "But if my capacity for self-control is itself constitutively lucky (e.g., genetics/upbringing), how am I responsible for *how* I exercise it? Doesn’t this reduce agency to just another random outcome?"  

  **4. Circumstantial Luck: Action vs. Disposition**  
  **Q:** "Circumstantial luck determines which temptations/threats we face. If a person resists corruption only because they never faced serious temptation, while an identical counterpart succumbs when tested, is the first *more virtuous*? If not, should we treat them identically?"  
  *Likely Reply:* "We evaluate the actual choices made, not unrealized dispositions."  
  **Follow-up:** "But if the untested person *would* have succumbed (and we know this), do they *deserve* praise for their actual ‘good’ act? If not, doesn’t this make moral worth dependent on ignorance of counterfactuals?"  

  **5. The Intuition Gap**  
  **Q:** "Even if ordinary blame practices are irrational, they’re deeply ingrained. Shouldn’t a revisionary theory explain *why* we feel luck *should* matter? Is the illusion biological, cultural, or a necessary fiction for social cohesion—and how do we overcome it?"  
  *(Follow-up would depend on his answer—e.g., if "cultural," ask: "Why did this 'error' arise universally? If it's maladaptive, why persist?")*  

  ---

  ### **What He Has to Give Up** (Confronting Costs)  
  **1. Abandoning Practices**  
  **Q:** "If resultant luck is illusory, should we abolish harsher punishments for *completed* crimes vs. attempts? (e.g., attempted vs. completed murder). If yes, does this align with societal goals like deterrence or victim vindication?"  
  *Likely Reply:* "Punishment should reflect culpability, not outcomes."  
  **Follow-up:** "Given attempts often cause less harm, wouldn’t equal punishment *over*-punish attempts? Or under-punish completed crimes by ignoring added harm? How is this system workable?"  

  **2. Abandoning Attitudes**  
  **Q:** "Can reactive attitudes like *resentment* or *moral anger* survive your view? If I’m severely wronged by a well-intentioned agent (e.g., a distracted driver maims me), must I view my anger as misplaced—since the harm was luck-dependent?"  
  *Likely Reply:* "Anger should target the recklessness, not the injury."  
  **Follow-up:** "Is it psychologically possible (or desirable) to *decouple* anger from harm? If a surgeon’s identical error kills your child vs. saving them, should your anger be *identical*? If not, is the residual anger irrational?"  

  **3. The Weight of Regret**  
  **Q:** "Finally, do you deny that agents *should* feel *agent-regret* for unlucky harms? If so, what becomes of practices like reparative apology or making amends—are they merely symbolic gestures?"  
  *(This consolidates the "giving up" theme—forcing him to own the emotional/social cost.)*  

  ---

  **Key Strategy Notes:**  
  - **Anticipate Deflections:** He may retreat to "blaming the controllable *vice*." Press whether this *explains* current practices (we blame killers more) or *revises* them (we should blame equally).  
  - **Control Paradox:** Hammer the regress from **Q3**—if constitutive luck undermines control, his criterion collapses.  
  - **Emotional Honesty:** Questions 2 and "What to Give Up" force him to admit that his view demands radical emotional reprogramming.  
  - **Practicality:** **Q5** and "Abandoning Practices" highlight real-world friction, making the view seem theoretically "pure" but socially inert.  

  This structure pushes him beyond exposition into defending counterintuitive implications, exposing the theory’s friction with moral psychology and social practice. Good luck!
