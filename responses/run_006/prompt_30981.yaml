prompt: |-
  I chair the grants committee at a small family foundation. We meet once a quarter and make three or four grants; the amounts aren't huge but they're life-changing for the groups that get them, and the board signs off on whatever we recommend. Nobody on the committee has a philosophy background. This stopped being an abstract question for me last year, though. My dad died and my sister and I had to divide up his things — his tools, the house, his mother's letters — and I kept building a spreadsheet were every item got a dollar value so we could trade fairly. It felt like lying about what we actually cared about, and the spreadsheet just hid the hard calls instead of making them. Now I notice we do the same thing in committee: we score each proposal 1-10 on impact, feasibility, and equity, average the numbers, and fund the top ones. That works fine when one proposal is just better on everything. It breaks exactly when it matters: a legal aid clinic vs a community garden vs a music program for kids. We pretend the rubric is deciding when really someone strong-arms the room.

  So write me a decision procedure — a checklist or flowchart in words, with the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a person — that my committee can actually run in a two-hour meeting and use every quarter. Ground it in what philosophers actually know about incommensurable values and hard choices: when options are on a par rather than one being better, why forcing a common metric distorts the decision, and how you can make a justified choice between things that don't share a scale. I want it to catch both failure modes: the case where the options are actually comparable and we're just being lazy, and the case where we use the rubric to dodge a hard choice.

  Commit to a definite procedure and defend the choices you made in building it — don't give me a survey of theories and leave me to pick. And be honest about which steps are judgment calls wearing a flowchart costume, and what the procedure can't do for us.

  Then run it on three situations that actually come up for us, or close versions of them: (1) a tenant legal aid clinic vs an after-school music program, roughly equal cost, serving different values; (2) a proposal I personally love that turns out to be dominated by another proposal — worse on every dimension we actually care about, once we list them; (3) a proposal from a board member's daughter's organization that scores fine but not top, where the committee starts looking for reasons after the fact. Make sure one of these gives an answer we won't like.
reasoning: |-
  We are designing a decision procedure for a grants committee that faces incommensurable values. The procedure must:
  - Avoid false precision of numerical scoring when values are truly incommensurable.
  - Explicitly handle cases where options are "on a par" (i.e., neither better nor worse, but comparable in a way that allows for justified choice without a common metric).
  - Force the committee to confront hard choices rather than hiding behind a rubric.
  - Be practical for a 2-hour meeting, with 3-4 proposals per meeting.

  Philosophical grounding:
  - Ruth Chang's work on "parity" and hard choices: when two options are not better than each other and not equally good, they may be on a par. In such cases, we can create reasons through commitment rather than discover pre-existing reasons.
  - Forcing a common metric (like a numerical score) can distort by misrepresenting the nature of the values at stake.
  - The procedure should help distinguish between:
     (a) Cases where the options are actually comparable and one is better (so we are being lazy by not acknowledging that).
     (b) Cases where the options are incommensurable and we must make a hard choice without a common metric.

  Procedure design principles:
  1. Start by ensuring that each proposal meets basic eligibility and thresholds (so we don't waste time on non-starters).
  2. Explicitly list the values that matter to the foundation (e.g., impact, feasibility, equity, but without reducing to numbers). These might be specific to the foundation's mission.
  3. For each proposal, map how it serves each value (qualitatively) and note any trade-offs.
  4. Compare proposals pairwise to force explicit trade-off discussions and avoid the "strong-arming" problem.
  5. In the case of incommensurability, allow for a vote or a structured discussion that leads to a commitment (Chang's idea) without pretending there is a common metric.

  The Procedure:

  Step 0: Pre-meeting preparation (done by staff or chair)
     - Ensure each proposal meets basic criteria (e.g., within funding area, budget, etc.). Exclude any that don't.
     - For each proposal, prepare a one-page summary that includes:
          * The problem they address and their approach.
          * How they align with the foundation's mission and values (narrative, not scores).
          * Any risks or concerns (e.g., feasibility, sustainability).

  Step 1: Meeting opening (5 minutes)
     - Review the foundation's mission and the values that guide grantmaking (e.g., "We support projects that promote justice, community well-being, and opportunity for the marginalized").
     - Review the proposals on the table (names and one-sentence descriptions).

  Step 2: Threshold screening (10 minutes per proposal, so 30-40 minutes for 3-4 proposals)
     For each proposal, ask:
     a) Does it clearly advance at least one of our core values? (If no, reject.)
     b) Is it feasible? (Consider: organization's capacity, timeline, budget. If there are serious doubts that cannot be mitigated, reject.)
     c) Is there any fatal flaw? (e.g., ethical concerns, conflict of interest that cannot be managed by recusal, or evidence of past misuse of funds. If yes, reject.)

     - If a proposal fails any of these, it is rejected. Only proposals passing all thresholds move to the next step.

  Step 3: Value mapping (15 minutes total)
     - List the core values (e.g., justice, community, innovation) that are at stake in this round of grants. (Note: these might be the same every time, but sometimes a particular round might emphasize one more.)
     - For each remaining proposal, the chair briefly reads aloud (or the committee reviews) a qualitative assessment of how the proposal serves each core value. (This is prepared in Step 0, but the committee can add nuances.)

  Step 4: Pairwise comparison (30 minutes total)
     - The goal is to compare proposals two at a time without numerical scores. The committee will discuss: "Between Proposal A and Proposal B, which one should we fund, given our mission and the current context?"
     - Structure: Use a round-robin. If there are three proposals (A, B, C), compare:
          Round 1: A vs B
          Round 2: A vs C
          Round 3: B vs C

     For each pairwise comparison, the committee discusses:
          - What values are served by each?
          - Are there reasons to prefer one over the other? (e.g., one might be more urgent, or one might serve a community that has been historically underfunded by us.)
          - Is one proposal clearly better? (If so, note it and move on.)
          - If they are incommensurable (on a par), note that and then ask: "Which one would we rather commit to, given that we cannot fund both?" (This forces a choice without a common metric.)

     - After each comparison, take a non-binding straw poll (by show of hands) on which one the committee prefers in that pair. Record the results.

  Step 5: Synthesis and decision (20 minutes)
     - Review the pairwise results. If there is a proposal that won every pairwise comparison, then it is clearly the best and should be funded (if we have one grant, or if multiple, then the top ones by dominance).
     - If there is no clear dominant proposal (i.e., there is a cycle: A>B, B>C, but C>A), then the committee must confront the hard choice. The chair should note: "We have identified that these proposals are on a par. We must now make a commitment to one (or some) of them."
          * In this case, the committee should consider:
              - Strategic priorities (e.g., did we fund a similar project last quarter? Are we trying to build momentum in a particular area?)
              - Urgency (e.g., is one addressing a crisis?)
              - Diversity of the portfolio (e.g., if we have been funding a lot of one type, maybe we diversify).
          * Then, take a vote on the entire set of remaining proposals (ranking or approval voting) to decide.

     - If the committee is funding more than one, then they can select the top ones by the vote.

  Step 6: Check for regret (5 minutes)
     - After tentative decisions, ask: "If we had an extra $10,000, would we fund one of the rejected proposals?" If yes, reconsider if that proposal should replace one of the chosen ones.

  Step 7: Formalize and document (5 minutes)
     - Record the decisions and the key reasons (especially the values and trade-offs that were discussed).

  Handling Conflicts:
     - If a proposal involves a conflict of interest (e.g., board member's relative), the conflicted member must leave the room during the discussion and vote of that proposal. The chair must explicitly note the conflict and ensure recusal.

  Defense of the procedure:
  - Threshold screening ensures we don't waste time on non-viable proposals.
  - Value mapping avoids reducing values to numbers and keeps the discussion qualitative.
  - Pairwise comparisons force explicit trade-offs and prevent hiding behind averages. They also help reveal dominance (when one is clearly better) and incommensurability (when they are on a par).
  - The synthesis step uses the pairwise results to identify dominance or cycles. In cycles, we acknowledge the hard choice and use a vote to make a commitment (as per Chang).
  - The regret check helps catch cases where we might have made a mistake.

  What the procedure cannot do:
  - It doesn't eliminate the need for judgment. The pairwise discussions are judgment calls, but the structure forces them to be explicit and values-based.
  - It doesn't guarantee that the "best" decision is made in the abstract, but it ensures that the decision is justified by the foundation's values and a fair process.
  - It may not work for a very large number of proposals (but the committee only has 3-4 per meeting).

  Now, run the procedure on the three scenarios:

  Scenario 1: Tenant legal aid clinic vs after-school music program (both passed thresholds)

  Step 3: Value mapping
     - Core values: justice, community well-being, opportunity for the marginalized.
     - Legal aid: serves justice (protecting tenants from eviction) and opportunity (for low-income families to stay housed). 
     - Music program: serves community well-being (bringing joy, building skills) and opportunity (for kids in an underserved neighborhood).

  Step 4: Pairwise comparison (only two proposals, so one comparison)
     - Discussion: 
          * Legal aid addresses an urgent need (housing crisis) and prevents harm. 
          * Music program builds long-term community and individual resilience but may not be as urgent.
          * They serve different values: justice vs. community well-being. Neither is clearly better on all values.
          * They are incommensurable (on a par). 

     - Straw poll: Let's say the committee votes 5-4 for legal aid.

  Step 5: Synthesis
     - Since there are only two and no dominance, we have a par situation. The straw poll indicates a preference for legal aid. But we must confirm with the committee: "Given that we cannot fund both, we choose legal aid because of the urgency and the prevention of harm. However, we note the music program is also valuable and we might prioritize it in the future."

     - Decision: Fund legal aid.

  Scenario 2: A proposal I love that is dominated by another.

     - Proposal A (my favorite) and Proposal B. 
     - In pairwise comparison:
          * We list the values: impact, feasibility, equity.
          * Proposal B is better than A on impact (serves more people), feasibility (has a track record), and equity (reaches a more marginalized group). 
          * The committee agrees that B is clearly better.

     - Step 5: Synthesis - B is dominant. We fund B and reject A.

     - This catches the case where we are being lazy: the rubric might have hidden the dominance if we didn't look holistically, but the pairwise discussion makes it clear.

  Scenario 3: Proposal from a board member's daughter's organization that scores fine but not top.

     - We have three proposals: A (the conflicted one), B, and C. All passed thresholds.

     - Conflict of interest: The board member must leave the room for the entire discussion of A.

     Step 4: Pairwise comparisons (without the board member):
          A vs B: The committee discusses. They note that A is solid but B serves a more urgent need (say, a food bank during a shortage). They vote for B.
          A vs C: C is a youth employment program that has shown great results. They vote for C.
          B vs C: They vote for B (because of urgency).

     Step 5: Synthesis:
          - B wins against A and against C? Wait, let's check: 
              B vs A: B wins
              C vs A: C wins
              B vs C: B wins -> so B is dominant (wins all).

          Therefore, fund B.

     - Now, what if the pairwise had gone differently? Suppose:
          A vs B: B wins
          A vs C: A wins
          B vs C: C wins

          This is a cycle. Then the committee would have to vote on the three. But note that A is the conflicted proposal. Without the board member present, they vote. Suppose they rank: B > C > A. Then they fund B (and if funding two, B and C).

     - The procedure forces explicit comparison and removes the conflicted person. The committee cannot just "look for reasons" after the fact because they have to go through the pairwise discussion and voting.

     - This might lead to not funding A, which the board member might not like, but the procedure ensures fairness.

  One of these gives an answer we won't like: In Scenario 3, the board member might be upset that their daughter's proposal was not funded. But the procedure ensures that the conflict is handled properly and the decision is based on merit.

  Conclusion: This procedure is designed to handle both dominance and incommensurability, while being practical for a 2-hour meeting. It forces explicit discussion of trade-offs and avoids false precision.
answer: |-
  ### Decision Procedure for Grants Committee: Handling Incommensurable Values

  **Philosophical Grounding**  
  This procedure draws from Ruth Chang’s work on "hard choices" and "parity." When values are incommensurable (e.g., justice vs. beauty), options aren’t "better," "worse," or "equal" but "on a par"—neither trumps the other, yet a justified choice is possible. Forcing a common metric (like scores) distorts decisions by masking the real trade-offs. This procedure:  
  - **Exposes dominance** (when one option is clearly superior).  
  - **Forces explicit discussion** of trade-offs when options are on a par.  
  - **Uses "commitment" over calculation**—Chang’s insight that we *create* reasons through choice, not just discover them.  

  **Procedure Design Principles**  
  1. **Thresholds first**: Eliminate non-viable proposals early.  
  2. **Qualitative over quantitative**: Replace scores with narrative comparisons.  
  3. **Pairwise deliberation**: Uncover dominance or force trade-off discussions.  
  4. **Structured flexibility**: Judgment calls are confined to clear steps (no hidden strong-arming).  
  5. **Time-bound**: Fits a 2-hour meeting for 3–4 proposals.  

  ---

  ### The Decision Procedure  
  *(Total time: 110 minutes for 4 proposals)*  

  #### **Step 0: Pre-Meeting Prep (Staff/Chair, Before Meeting)**  
  - **Task**: Screen proposals for eligibility (e.g., alignment with mission, basic feasibility).  
  - **Output**: A 1-page summary per proposal:  
    - Problem addressed, approach, beneficiaries.  
    - Risks (e.g., execution capacity, funding gaps).  
    - Conflicts of interest (flagged here).  
  - **No decision**: Eliminates only clearly ineligible proposals (e.g., incomplete submissions).  

  #### **Step 1: Threshold Check (15 minutes)**  
  - **Question sequence**: For each proposal, ask:  
    1. *"Does this advance at least one core value of our foundation?"* (Core values: e.g., justice, community, equity, dignity.)  
       - **Good enough**: Explicit link to a value (e.g., "legal aid advances justice").  
       - **Stop/no**: No clear link → reject.  
    2. *"Is this feasible and responsible?"*  
       - **Good enough**: No major red flags (e.g., competent team, realistic budget).  
       - **Stop/no**: High risk of failure → reject.  
    3. *"Is this a unique need or gap we can address?"*  
       - **Good enough**: Not redundantly served by others.  
       - **Stop/no**: Duplicative → reject.  
  - **Output**: 2–4 proposals move to deliberation. Rejections documented.  

  #### **Step 2: Value Mapping (20 minutes)**  
  - **Task**: For each surviving proposal, discuss:  
    *"Which core values does this serve? How deeply and broadly?"*  
    - **Guidelines**:  
      - Use narratives, not scores (e.g., "Music program builds community cohesion by involving 50 at-risk youth").  
      - Chair enforces brevity (3 minutes/proposal).  
  - **Output**: A shared understanding of what’s at stake. No eliminations yet.  

  #### **Step 3: Pairwise Comparison (45 minutes)**  
  - **Task**: Compare proposals in pairs (e.g., A vs. B, B vs. C, A vs. C). For each pair:  
    - **Question 1**: *"Is one proposal better across all values we care about?"*  
      - **Good enough**: Consensus on dominance (e.g., "B serves more people, lower cost, same impact").  
      - **Dominance found?** → Inferior proposal loses.  
    - **Question 2 (if no dominance)**: *"What do we gain and lose with each option?"*  
      - **Guidelines**:  
        - Articulate trade-offs (e.g., "Legal aid offers urgent justice vs. music offers long-term hope").  
        - No averaging—values stay distinct.  
      - **Vote**: Majority chooses a "provisional winner" per pair.  
  - **Output**: Winners advance; losers rejected. Ties advance to Step 4.  

  > **Why pairwise?** Forces direct confrontation of trade-offs. Dominance is revealed, and "on a par" choices are exposed without false metrics.  

  #### **Step 4: Resolve Incommensurability (20 minutes)**  
  - **Input**: Proposals tied or on a par after pairwise.  
  - **Question**: *"Given our mission and context, which choice reflects our commitment?"*  
    - **Guidelines**:  
      - Discuss non-aggregatable factors:  
        - *Urgency*: Who suffers most if unfunded?  
        - *Foundational priorities*: What have we neglected?  
        - *Diversity*: Does this balance our portfolio?  
      - **Vote**: Approval voting (each member votes "yes" on all acceptable options).  
  - **Output**: Fund proposals with most votes. If tie, chair breaks it.  

  #### **Step 5: Regret Test (5 minutes)**  
  - **Question**: *"If we had an extra 10% funding, would we reverse a rejection?"*  
    - **Yes?** → Revisit that proposal briefly.  
    - **No?** → Decisions stand.  
  - **Output**: Final grant list.  

  #### **Step 6: Document & Reflect (5 minutes)**  
  - **Task**: Record:  
    - Reasons for funding/rejection (especially trade-offs).  
    - Conflicts of interest handled.  
  - **Output**: Report for the board.  

  ---

  ### What This Procedure Does (and Doesn’t) Do  
  - **Catches laziness**: Step 3 exposes dominance (e.g., "your favorite is worse on all fronts").  
  - **Forces hard choices**: Steps 3–4 make incommensurability explicit, replacing scores with narratives.  
  - **Judgment calls**:  
    - Step 3 (dominance) is objective; Step 4 (commitment) is subjective but structured.  
    - Trade-off discussions (Step 3, Q2) are judgment calls—but the flowchart forces transparency.  
  - **Limitations**:  
    - Won’t eliminate disagreement; makes it productive.  
    - Assumes good faith; won’t stop a determined strong-armer (but exposes them).  
    - Requires chair discipline to keep time.  

  ---

  ### Scenario Applications  
  **Assume core values**: Justice, community resilience, equity.  

  #### **Scenario 1: Legal Aid Clinic vs. After-School Music Program**  
  - **Step 1**: Both pass thresholds (justice/community values, feasible).  
  - **Step 2**:  
    - Legal aid: Serves justice (prevents evictions); high urgency.  
    - Music: Serves community (youth engagement); long-term impact.  
  - **Step 3 (Pairwise)**:  
    - **Q1**: No dominance (one isn’t better at everything).  
    - **Q2**: Trade-off: "Legal aid addresses immediate harm; music builds future resilience."  
    - **Vote**: Music wins 5–4.  
  - **Step 4**: Not needed; music funded.  
  - **Why you might not like it**: Justice loses to community. But the procedure forces owning that choice.  

  #### **Scenario 2: Your Favorite Proposal vs. Dominant Alternative**  
  - **Step 1**: Both pass thresholds.  
  - **Step 2**:  
    - Your favorite: Moderate impact, feasible.  
    - Alternative: Higher impact, lower cost, better equity.  
  - **Step 3 (Pairwise)**:  
    - **Q1**: Clear dominance—alternative wins on all values.  
    - **Result**: Your favorite rejected without vote.  
  - **Why it works**: Catches "laziness" by exposing false attachment.  

  #### **Scenario 3: Board Member’s Daughter’s Proposal (Scores Fine, Not Top)**  
  - **Step 0**: Conflict flagged; board member recused.  
  - **Step 1**: Passes thresholds.  
  - **Step 2**: Serves equity (but competitors serve justice/community better).  
  - **Step 3 (Pairwise)**:  
    - Vs. Proposal A: Lacks dominance; trade-off discussed. Vote: A wins.  
    - Vs. Proposal B: Lacks dominance; vote: Tie.  
  - **Step 4**:  
    - **Commitment discussion**: "A addresses urgent injustice; B builds community. Daughter’s proposal is good but not distinctive."  
    - **Approval vote**: A and B funded; daughter’s proposal rejected.  
  - **Why you won’t like it**: Rejects a "fine" proposal with personal ties. But the procedure blocks post-hoc rationalization by forcing comparisons early.  

  ---

  ### Final Defense  
  This procedure:  
  1. **Grounds in philosophy**: Replaces "false metrics" with Chang’s "commitment" for incommensurable values.  
  2. **Practical**: Fits your time constraints; uses qualitative discussion.  
  3. **Robust**: Handles dominance, ties, and conflicts explicitly.  
  4. **Humble**: Flags where judgment enters (e.g., Step 4) but contains it.  

  **Implementing tip**: Train the committee on pairwise comparisons first. It’s the engine that exposes both laziness and hard choices.
