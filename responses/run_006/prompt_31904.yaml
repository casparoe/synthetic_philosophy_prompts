  The best guess is that the friend will say Erin has standing, based on Rule 2 or 3. Carmen is a close parallel: she reformed and campaigns, so Erin should too. Plus, Erin explicitly condemns her own role, which might be stronger than Carmen's case.

  To distinguish the rules, I need a further case. Maybe someone who repented but is still hypocritical in a relevant way. For example, Felix, who designed a schedule but now condemns it, yet still pressures drivers in a new job. Rule 1 might say no standing due to ongoing hypocrisy, Rule 2 says no if the hypocrisy is relevant, Rule 3 might say yes if he repented, but the new action shows inconsistency.

