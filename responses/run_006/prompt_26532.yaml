answer: |-
  The legal practice of advance directives reveals a complex, philosophically layered theory of personal identity and autonomy, while exposing tensions with other legal doctrines. Here’s a reconstruction:

  ### Implicit Theory in Advance Directives
  1. **Continuity of Identity**:  
     The law presupposes that the competent "past self" and incapacitated "future self" are the **same legal person** despite radical psychological discontinuity. This leans on a **minimalist biological or legal continuity** view of personhood (e.g., same body, same legal identity) rather than a Lockean psychological continuity view.

  2. **Hierarchy of Autonomy**:  
     Autonomy is treated as **temporally extended** but **hierarchically structured**:  
     - Decisions made with **full competence** are vested with supreme authority.  
     - Expressions during incapacity are deemed **inauthentic**, as they arise from "compromised agency" (e.g., dementia, delirium).  
     This presupposes that autonomy requires **rational capacity**, and its absence voids contemporaneous preferences.  

  3. **Whole-Life Autonomy**:  
     The practice fits a **narrative or planning conception of autonomy** (akin to Dworkin’s "critical interests" or Schechtman’s narrative self). A life’s integrity depends on respecting **lifelong values and plans** formulated when capable. Suffering during incapacity is overruled because it doesn’t reflect the person’s "true" values.  

  4. **Epistemic Asymmetry**:  
     The law assumes the **past self is a better judge** of the future self’s interests than the future self in a compromised state—or even than third parties (doctors/family).  

  ### What Is Strictly Presupposed vs. Compatible
  - **Presupposed**:  
    - Identity continuity sufficient for legal responsibility/rights.  
    - Competence as a necessary condition for valid autonomy.  
    - "Authentic" preferences are those aligned with the competent self’s values.  
  - **Compatible but Not Required**:  
    - A strong narrative self theory (e.g., Parfit’s psychological connectedness is unnecessary).  
    - Moral realism about "best interests" (the practice works even if interests are subjective).  

  ### Philosophical Underdetermination
  - **Threshold of Incapacity**: When exactly does a "new self" emerge? The law uses clinical criteria (decision-making capacity) but lacks a theory for when psychological discontinuity severs identity.  
  - **Value Drift**: If a person’s values change *before* incapacity (e.g., via religious conversion), must directives reflect original or recent values? Law often defers to the directive’s text, creating tension.  
  - **Authenticity of Resistance**: Is all resistance during incapacity "inauthentic"? Some dementia patients exhibit stable new preferences; the law has no mechanism to incorporate this.  

  ### Reconciling the Inconsistency with Other Self-Binding Limits
  The tension between advance directives and prohibitions on irrevocable contracts (e.g., slavery, perpetual employment) can be resolved through **contextual moral and pragmatic distinctions**:  

  1. **Irreversibility and Gravity**:  
     Medical decisions often involve **irreversible outcomes** (e.g., death). Unlike divorce or quitting a job, you cannot "undo" death if the directive is ignored. Binding the future self is justified to prevent irreversible harm to the *past self’s* plan.  

  2. **Agency Asymmetry**:  
     In incapacity, the future self **cannot participate in any contract renegotiation**. Slavery or perpetual employment, by contrast, bind a *future competent self* who might wish to renegotiate but is barred. Advance directives bind only when renegotiation is impossible.  

  3. **Bodily Integrity and Dignity**:  
     Withholding treatment implicates **bodily intrusion**. The law prioritizes the competent self’s right to refuse bodily invasions (rooted in common-law battery doctrines) over general liberty interests. Slavery, conversely, violates inviolable rights (dignity, liberty) that cannot be waived.  

  4. **Social Pragmatism**:  
     Enforcing advance directives prevents familial/medical disputes and reduces costly interventions for unwilling patients. Perpetual contracts, by contrast, risk exploitation and stifle economic freedom.  

  5. **Asymmetric Paternalism**:  
     The law paternalistically protects the *future self* from exploitation in contracts (e.g., unconscionability doctrines) but paternalistically protects the *past self’s* values in medical contexts. This reflects a balance: medical directives are seen as self-regarding, while slavery is other-regarding (harming society’s values).  

  ### Conclusion
  The law’s stance is **defensible but not perfectly consistent**. Advance directives rest on a **context-specific theory**: autonomy as extended life-narrative authority in irreversible medical contexts, where the future self’s expressions are epistemically invalid. Other self-binding contracts are voided to protect dynamic liberty interests and social welfare. However, if the "same person" premise were applied rigorously elsewhere (e.g., enforcing a deathbed promise as an irrevocable contract), the law’s distinctions would collapse. Thus, the practice survives through **practical moral prioritization**—not airtight philosophy—suggesting that personhood and autonomy are **domain-relative concepts** in law.
