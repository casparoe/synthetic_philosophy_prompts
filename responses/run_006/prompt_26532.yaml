  The whole-life view of autonomy seems central here. Advance directives privilege the "planning self" making decisions from a position of full rationality about their entire life narrative. This explains why momentary expressions during incapacity are discounted - they're seen as inauthentic interruptions of the life plan.

  But the user is sharp to notice this creates tension with other areas of law. Marriage contracts can be dissolved, employment contracts have limits - why is medicine different? The answer must lie in what's at stake. Medical contexts involve life-or-death decisions where the incapacitated self truly cannot participate meaningfully. There's also a pragmatic element: society has an interest in respecting predetermined choices to avoid burdensome disputes.

  Where things get philosophically tricky is the gray zone - what if someone's values change before incapacity? The law hasn't resolved this well. And the user is right to question whether we're consistent. If we took the "same person" premise strictly, should we allow more self-binding? But medicine might be special because of the unique nature of bodily integrity and death.

  The reconciliation probably lies in seeing advance directives as a limited exception justified by: 1) the irreversibility of medical decisions, 2) the inability to consult the affected self, and 3) societal interests in avoiding prolonged end-of-life controversies. Other self-binding contracts don't share these features equally.

