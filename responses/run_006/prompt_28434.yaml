prompt: |-
  I'm a junior and I got elected to my school's Academic Integrity Panel this year. We're hearing a case right now that's got everyone stuck. A student — let's call him M — was caught with a cheat sheet under his exam paper. He says he forgot it was there. He'd made it while studying the night before, shoved it in his notebook, and didn't realize it was still under his test paper when he sat down for the exam. The proctor says the sheet was face-up and partially visible. M insists he never looked at it during the test and had zero intention to cheat.

  The panel is totally split. Half the members are saying: look, M is the only person who has access to his own intentions. If he says he didn't mean to cheat, we have to take that seriously — who are we to tell him what was going on inside his own head? The other half says: we can't just take someone's word for it when the external evidence points the other way. People rationalize after the fact, they lie to themselves, and honestly maybe people don't even have perfect access to their own mental states in the moment — like, you can be doing something and not fully register what you're doing.

  I need to draft the decision memo for the panel before we meet on Thursday. It should recommend whether we find M responsible for cheating or not, and lay out the reasoning. It needs to engage both sides fairly — not just pick one and dismiss the other. The memo has to have an actual bottom line the panel can vote on.

  Also, at the very end of the memo, add a short note saying how confident you are in the overall recommendation and which specific step in the reasoning you're least sure about. I want to know where this thing might be shaky.
reasoning: |-
  Okay, the user is a junior on their school's Academic Integrity Panel dealing with a tough case. Student M was caught with a cheat sheet during an exam. He claims he forgot it was there and didn't intend to cheat. The panel is split between trusting his stated intentions versus relying on the physical evidence. 

  First, I need to unpack both sides of the argument thoroughly. The intention-focused group has a point about subjective experience - we can't truly know what's in someone's mind. But the evidence-focused side raises valid concerns about self-deception and objective facts. Interesting how this mirrors philosophical debates about intentionality versus observable behavior. 

  For the recommendation, a middle path feels necessary. Complete exoneration seems too lenient given the visible cheat sheet, but full cheating sanctions ignore the plausibility of forgetfulness. Ah - the negligence angle! That resolves the tension: we judge the action (bringing unauthorized material) rather than speculating about unknowable intent. 

  The confidence note is tricky. While the negligence framework is legally solid, I'm least sure about dismissing subconscious intent entirely. Some panelists might still fixate on whether M "really meant it." Should emphasize that this approach prevents endless unprovable debates. 

  User's drafting a decision memo under deadline pressure. Beyond the legal reasoning, they probably need this to feel ethically sound and group-mediating. The tone must avoid academic jargon while being precise enough for a formal ruling. Adding the confidence disclaimer shows intellectual honesty - smart move by the user to request that. 

  Biggest challenge is balancing fairness with practicality. The memo must acknowledge both viewpoints sincerely before synthesizing them. No easy answers here - hence the panel's split. But the negligence standard offers a principled compromise that maintains integrity without mind-reading.
answer: |-
  Here’s a draft decision memo that balances both perspectives, provides a clear recommendation, and flags areas of uncertainty:

  ---

  **MEMORANDUM**  
  **To:** Academic Integrity Panel  
  **From:** [Your Name], Panel Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation in Case of Student "M" – Alleged Academic Dishonesty (Exam Cheat Sheet)  

  ### I. Case Summary  
  Student M was discovered with a handwritten cheat sheet beneath his exam paper during a proctored test. The sheet contained course-relevant material. M asserts:  
  - The sheet was created during legitimate studying the night before.  
  - It was inadvertently left in his notebook and transferred under the exam paper without his knowledge.  
  - He did not view or use the sheet during the exam and had no intent to cheat.  

  The proctor confirms the sheet was **face-up and partially visible** from their vantage point.  

  ### II. Competing Panel Perspectives  
  The panel is divided on two key principles:  

  **A. Perspective 1: Subjective Intent is Paramount**  
  *Argument:* M is the sole witness to his internal state. Absent concrete proof of conscious deception (e.g., eye movements, prior misconduct), we must credit his assertion of unintentional conduct. To penalize based on suspicion of subconscious intent or self-deception sets a dangerous precedent where innocence hinges on disproving hypothetical mental states.  

  **B. Perspective 2: Objective Circumstances Create Responsibility**  
  *Argument:* The physical evidence (accessible, visible cheat sheet during an exam) creates a presumption of impropriety. Individuals may lack perfect self-awareness or post-hoc rationalize actions. Academic integrity requires preventing *opportunities* for cheating, regardless of claimed intent. Ignoring observable breaches undermines policy enforcement.  

  ### III. Analysis & Recommendation  
  Both perspectives raise valid concerns. However, academic integrity policies exist to uphold standards of fairness and prevent compromised assessments. Our decision must balance:  
  - The impossibility of definitively adjudicating internal intent,  
  - The need to maintain clear, enforceable boundaries.  

  **Critical Findings:**  
  1. **Negligence is Undisputed:** M brought unauthorized material into the exam space and failed to ensure his workspace was clear—a violation of exam protocols.  
  2. **Intent is Unprovable:** No evidence contradicts M’s claim he didn’t *use* the sheet, but the proctor’s observation confirms it was *deployable*.  
  3. **Risk is Objective:** Visible unauthorized material during an exam inherently threatens assessment integrity, irrespective of conscious use.  

  **Resolution:**  
  We distinguish between **deliberate cheating** and **culpable negligence**. While evidence falls short of proving *intentional cheating*, M’s actions constitute **reckless disregard for exam conditions**. Permitting this defense ("I forgot it was there") would incentivize lax preparation and create an unworkable loophole.  

  ### IV. Recommendation: Responsible for Violation  
  **M is found RESPONSIBLE for violating academic integrity standards**, specifically:  
  > *"Possession or use of unauthorized materials during an examination."*  

  **Reasoning:**  
  - The cheat sheet was unauthorized and present in the exam workspace.  
  - M’s negligence in failing to secure his materials directly enabled the violation.  
  - Academic integrity requires proactive diligence by students; "forgetfulness" does not absolve responsibility for creating risky conditions.  

  **Proposed Outcome:**  
  - Standard first-offense penalty (e.g., exam grade zero, ethics course), *without* escalation for deliberate fraud.  
  - Strong recommendation: The panel clarifies in its rules that "possession" includes negligent failure to remove unauthorized materials.  

  ### V. Areas of Uncertainty  
  **Overall Confidence:** **High** in finding a violation occurred.  
  **Least Confident Step:** Assessing whether M *truly* had no subconscious awareness of the sheet’s presence. While plausible, this is fundamentally unprovable and irrelevant to the negligence standard.  

  ---  

  ### Key Rationale Highlights:  
  - **Avoids mind-reading:** Doesn’t require proving/disproving M’s intent.  
  - **Upholds standards:** Enforces the material breach (unauthorized item in workspace).  
  - **Fair compromise:** Penalizes negligence without alleging malicious fraud.  
  - **Precedent-setting:** Incentivizes students to rigorously check workspaces.  

  This memo provides a vote-ready position grounded in observable facts and policy, while respecting both sides’ concerns. The panel can vote to adopt, amend, or reject this recommendation.
