prompt: |-
  I've been trying to get clear on what I actually think about supererogation — acts that are morally good but not required, the stuff that goes beyond the call of duty. The standard picture has a floor (duty) and a ceiling (the supererogatory), but my intuitive verdicts on cases keep pulling me in different directions, and I suspect at least some of them can't all be right together. I'd like help extracting the principle I seem to be operating under, or finding the best one I can commit to.

  Here are the cases and my gut reactions:

  1. **The drowning child (pond).** You walk past a shallow pond and see a child drowning. You could wade in and save her, ruining your $200 shoes. Saving her is obligatory, not supererogatory. I'm with Singer on this one — the cost is trivial relative to the harm prevented.

  2. **The drowning child (distant).** You receive a letter from a reputable charity asking for $200 to save a child from dying of malaria. I feel a strong pull to say this is also obligatory, but I confess it doesn't *feel* the same as the pond case — the child is far away, the causal chain is long, and there's something psychologically different about it. Still, I want to say it's obligatory, and the difference in felt urgency is just scope insensitivity I should correct for rather than a real moral difference.

  3. **The kidney donation.** A healthy acquaintance of yours needs a kidney. You're a match. The surgery has a roughly 1-in-4,000 mortality risk and involves a few weeks of painful recovery. Donating is clearly supererogatory — it's heroic, not required. No one would say you *had* to do it, and someone who declined would owe no apology.

  4. **The second kidney.** Same as above, but you've already donated one kidney years ago. Donating your remaining kidney would put you on dialysis for life. This is so far beyond duty that calling it merely supererogatory almost feels like an understatement. Definitely not required.

  5. **The life's work.** A talented biomedical researcher spends her career developing a malaria vaccine that ends up saving hundreds of thousands of lives, working long hours for academic pay when she could have had a comfortable industry job. I want to say her choice was supererogatory — deeply admirable but not required. But then I think: if case 2 (sending $200) is obligatory, how can devoting your whole career to saving vastly more lives be merely optional? That seems like a consistency problem.

  6. **The soldier and the grenade.** A soldier throws himself on a grenade to save five comrades, dying instantly. I want to say this is supererogatory — the paradigm case, really. But I also think that if you *can* save five lives at the cost of your own, and the five are right there in front of you, there's at least a case that you're required to do it. And yet I can't bring myself to say the soldier who freezes up has done something *wrong* — "wrong" feels like the wrong word for someone who merely fails to be a hero.

  7. **The small kindness.** You're having a terrible day, but you still take a moment to genuinely compliment a cashier who looks exhausted, making her visibly brighten. This cost you nothing but a few seconds of effort you barely had. I want to say it's supererogatory — it's a little spark of moral grace — but it's so trivially easy that calling it beyond duty feels absurd. If something costs nothing and helps someone, how could it not be required? And yet "required" also feels too strong — are we really *obligated* to compliment every exhausted cashier we encounter?

  I have a tentative principle I've been kicking around: an act is supererogatory if and only if it (a) produces more good than any alternative act the agent could permissibly perform, and (b) the cost to the agent — in well-being, autonomy, or life-plans — crosses some threshold of significant sacrifice. But this principle handles cases 3 and 4 smoothly while struggling with 5 (is a fulfilling career a "significant sacrifice" if it's freely chosen and meaningful?) and making case 7 obligatory, which doesn't match my sense that the compliment was a gift rather than a debt. It also says nothing about the tension between cases 2 and 5.

  What I'm asking for: is there a principle — or a small set of candidate principles — that captures as many of these verdicts as possible? I'm looking for something stated precisely enough to test against new cases. Please tell me which of my verdicts the principle forces me to abandon, and why those are the ones that should go. Also, give me a few new cases I haven't considered and tell me what the principle says about them — ideally cases that stress-test the boundary between duty and supererogation in ways my list doesn't.
reasoning: |-
  Okay, let me try to figure out what the user is really struggling with here. They're clearly deep into moral philosophy, especially the concept of supererogation. They've laid out seven detailed cases with their intuitive reactions, and they're feeling tension between those intuitions. The main issue seems to be finding a consistent principle that can reconcile these conflicting feelings across different scenarios.

  First, I notice the user is self-aware about their conflicting intuitions. For example, in case 2 (distant child), they feel it should be obligatory but admit it doesn't feel the same as the pond case. That psychological distance is bothering them, even though they intellectually agree with Singer. Then in case 5 (life's work), they're torn because if donating $200 is obligatory, how isn't dedicating your entire career to save more lives also obligatory? That's a real consistency problem they've spotted.

  The kidney donation cases (3 and 4) seem more straightforward to them, but they're struggling with the career sacrifice and trivial acts like complimenting a cashier. Their proposed principle focuses on significant sacrifice, but that runs into problems with the researcher case where the sacrifice might not feel significant if the work is fulfilling. 

  Hmm, what's the core tension here? It seems like they're wrestling with two axes: cost/benefit ratio and personal sacrifice magnitude. But these don't always align neatly. The pond case has low cost/high benefit - clearly obligatory. The kidney donation has high cost/high benefit - supererogatory. But then the $200 donation has low cost/high benefit like the pond, yet feels different psychologically. And the career case has high benefit but ambiguous cost since the researcher might find meaning in the work.

  The user also mentions "scope insensitivity" - that's key. They recognize their intuition might be flawed in case 2, but can't shake the feeling. This suggests any principle needs to account for psychological factors while maintaining moral consistency.

  For the soldier case (6), they're conflicted about whether self-sacrifice can ever be obligatory. Their intuition says no - we don't blame someone for not jumping on a grenade - but logically saving five for one seems compelling. This touches on whether we can require ultimate sacrifices.

  The compliment case (7) is fascinating because it's so low-cost that calling it supererogatory feels weird, but calling it obligatory also feels off. This exposes a gap in their threshold model - maybe some acts exist in a category below duty but above nothing?

  Looking at their proposed principle: it requires both net positive good and significant sacrifice. But as they note, this makes compliments obligatory (since no real cost) which clashes with their intuition that it's a gift. And it doesn't resolve the career dilemma.

  So what alternatives exist? The three principles I considered each handle some cases better than others. The sacrifice-adjusted beneficence captures the psychological aspect but might be too messy. The dual-source model introduces autonomy as a factor - maybe that helps with the career case? The scalar approach avoids binary categories entirely but might feel unsatisfying.

  The user seems to want precision - they asked for testable principles. So whichever approach we take must be clearly definable. They also want to know which intuitions to abandon. For example, maintaining that both $200 donation and career devotion can't be obligatory might mean accepting that distant aid is actually supererogatory after all - that would resolve case 5 but contradict their initial pull on case 2.

  New test cases should probe these boundaries: what about medium-cost acts? Or when sacrifice is non-physical? Or when benefits are diffuse versus immediate?

  Underlying all this, I sense the user is trying to build a personal ethical framework they can live by, not just an academic exercise. The mention of "life-plans" in their principle suggests they care about real-world applicability. There's an existential weight here - they're trying to figure out how much morality demands of us.
answer: |-
  Your cases reveal deep tensions between consequentialist intuitions (maximizing good) and agent-centered constraints (protecting autonomy/life-pljects). Your proposed principle (net good + significant sacrifice) is promising but needs refinement. Below are three candidate principles, each preserving *most* of your verdicts while forcing revisions where consistency demands it. I'll then provide stress-test cases.

  ---

  ### **Candidate Principle 1: Sacrifice-Adjusted Beneficence**
  > An act is **obligatory** if:  
  > (a) It prevents severe harm to others at **minimal cost** to the agent, *or*  
  > (b) The cost/benefit ratio is so favorable that refusal constitutes **unreasonable self-preference** (cost << harm prevented).  
  >   
  > An act is **supererogatory** if:  
  > (a) It produces significant net good, *and*  
  > (b) It imposes **non-trivial sacrifice** (≥ moderate risk, pain, or life-disruption), *and*  
  > (c) It is **psychologically non-paradigmatic** (lacks immediacy, emotional salience, or direct causality).  

  **Verdicts Preserved:**  
  - **Case 1 (Pond):** Obligatory (minimal cost, severe harm).  
  - **Case 3 (Kidney):** Supererogatory (non-trivial sacrifice: mortality risk/pain).  
  - **Case 4 (Second Kidney):** Supererogatory (extreme sacrifice).  
  - **Case 6 (Soldier):** Supererogatory (non-trivial sacrifice + psychological "heroism" threshold).  
  - **Case 7 (Compliment):** *Not supererogatory* – reclassified as **minimally decent** (trivial cost; no sacrifice).  

  **Verdicts Revised (and Why):**  
  - **Case 2 (Distant Child):** *Supererogatory*.  
    *Why:* The long causal chain and psychological distance make refusal *not* unreasonable self-preference. Sacrifice is minimal, but the act isn't "paradigmatic" like the pond.  
  - **Case 5 (Life’s Work):** *Supererogatory*.  
    *Why:* Career sacrifice is non-trivial (life-plan disruption), and the indirect/aggregate harm prevented lacks the paradigmatic urgency of direct rescue. Obligation would demand too much autonomy-sacrifice.  
  - **Case 6 (Soldier):** "Required" intuition rejected – the sacrifice (death) is *so* high it cannot be obligatory, even with 5 lives saved.  

  **Consistency Achieved:**  
  - Resolves tension between Cases 2 & 5: Both become supererogatory due to non-paradigmatic harm prevention.  

  ---

  ### **Candidate Principle 2: Dual-Source Model (Duty + Autonomy Threshold)**
  > An act is **obligatory** only if:  
  > (a) It prevents severe harm, *and*  
  > (b) The cost to the agent does **not exceed a "reasonable burden" threshold** (e.g., moderate risk, financial loss <5% income, minor inconvenience).  
  >   
  > An act is **supererogatory** if:  
  > (a) It prevents severe harm *or* significantly promotes well-being, *and*  
  > (b) The cost **exceeds the reasonable burden threshold**, *and*  
  > (c) The agent **voluntarily assumes the cost** beyond what duty demands.  

  **Verdicts Preserved:**  
  - **Case 1 (Pond):** Obligatory (shoe cost < reasonable burden).  
  - **Case 2 (Distant Child):** Obligatory ($200 is < reasonable burden for most).  
  - **Case 3 (Kidney):** Supererogatory (exceeds reasonable burden).  
  - **Case 4 (Second Kidney):** Supererogatory (clearly exceeds burden).  
  - **Case 7 (Compliment):** *Not supererogatory* – reclassified as **basic decency** (trivial cost < burden threshold).  

  **Verdicts Revised:**  
  - **Case 5 (Life’s Work):** *Supererogatory*.  
    *Why:* Sacrifice (career comfort, income) exceeds reasonable burden *if* it imposes hardship. If the work is fulfilling, it might not be "sacrifice" at all – but autonomy still protects refusal.  
  - **Case 6 (Soldier):** *Supererogatory*.  
    *Why:* Death exceeds any reasonable burden threshold. No one can be *required* to die.  

  **Consistency Achieved:**  
  - Case 2 is obligatory (low cost), while Case 5 is supererogatory (high cost).  
  - Soldier case clarified: Cost trumps benefit magnitude.  

  ---

  ### **Candidate Principle 3: Scalar with Social Expectations**
  > Morality is fundamentally **scalar** (more/less demanding), but we label acts "obligatory" when:  
  > (a) The net good is high, *and*  
  > (b) The cost is low, *and*  
  > (c) **Social enforcement** is appropriate (blame for omission is warranted).  
  >   
  > "Supererogatory" marks acts that are:  
  > (a) High net good + non-trivial cost, *but*  
  > (b) Social enforcement is **inappropriate** (praise, not blame, is fitting).  

  **Verdicts Preserved:**  
  - **Case 1 (Pond):** Obligatory (blameworthy omission).  
  - **Case 2 (Distant Child):** *Ambiguous* – scalar duty but not "obligatory" if social blame is inappropriate.  
  - **Case 3 (Kidney):** Supererogatory (praiseworthy, not blameworthy to omit).  
  - **Case 6 (Soldier):** Supererogatory (no blame for freezing).  
  - **Case 7 (Compliment):** *Not supererogatory* – a low-grade duty where omission is mildly criticizable ("uncharitable"), but not blameworthy.  

  **Verdicts Revised:**  
  - **Case 5 (Life’s Work):** *Scalar duty* but not obligatory (no blame for choosing industry job).  
  - **Case 2 (Distant Child):** Leans supererogatory if social enforcement (e.g., shaming non-donors) is excessive.  

  **Consistency Achieved:**  
  - Resolves the "compliment" paradox: It’s a minimal duty, not beyond duty.  
  - Soldier case: Blame is inappropriate even if net good is high.  

  ---

  ### **Recommended Principle: Dual-Source Model**
  This best balances your intuitions while minimizing revisions:  
  - **Obligatory:** Prevents severe harm at ≤ reasonable burden (e.g., Cases 1, 2).  
  - **Supererogatory:** Prevents harm + cost > reasonable burden + voluntary (Cases 3, 4, 5, 6).  
  - **Minimal Decency:** Very low-cost acts that are obligatory but trivial (Case 7).  

  **Revisions Required:**  
  1. **Case 2 (Distant Child)** is obligatory – scope insensitivity is irrational.  
  2. **Case 5 (Life’s Work)** is supererogatory – career sacrifice exceeds reasonable burden.  
  3. **Case 7 (Compliment)** is minimal decency, not supererogatory.  

  **Why These Revisions?**  
  - If $200 to save a life is obligatory (Case 2), consistency demands that *all* low-cost lifesaving is obligatory. But high-cost acts (like career devotion) remain supererogatory due to autonomy protection.  
  - Trivial acts (Case 7) can’t be "beyond duty" – they’re duty’s baseline.  

  ---

  ### **Stress-Test Cases**
  Apply the **Dual-Source Model** to these:  

  1. **The Moderate Risk Rescue**  
     You can save a drowning child by diving into rough seas – 10% mortality risk to you.  
     *Verdict:* **Supererogatory**. Exceeds reasonable burden (death risk too high).  

  2. **The Career Switch**  
     A lawyer earning $500K/year quits to work for a charity, cutting their income to $50K but saving 100 lives/year.  
     *Verdict:* **Supererogatory**. Sacrifice (lifestyle loss) exceeds reasonable burden, though net good is immense.  

  3. **The Awkward Intervention**  
     You overhear a racist remark at a party. Confronting the speaker would embarrass you and ruin the evening.  
     *Verdict:* **Minimal decency** (obligatory). Cost is discomfort, not sacrifice. Blame for silence is appropriate.  

  4. **The Repeat Donor**  
     You donate bone marrow (painful, low risk) to a stranger. A year later, another stranger needs it.  
     *Verdict:* **Obligatory** if low risk/minimal burden; **supererogatory** if cumulative pain/disruption is significant.  

  5. **The Forgotten Promise**  
     You promised to help a friend move, but on the day, you’re exhausted. Helping costs 4 hours of misery.  
     *Verdict:* **Obligatory**. Promise creates special duty; cost is burden but reasonable for friendship.  

  ---

  ### **Key Insight**
  Your tension stems from conflating two scales:  
  - **Cost/Benefit Ratio** (e.g., pond vs. kidney).  
  - **Psychological Salience** (e.g., pond vs. distant child).  

  The best principles decouple these, prioritizing cost/benefit for obligations while using psychology to *explain* (but not justify) intuitive differences. **Dual-Source** does this cleanly by setting an autonomy-protecting "burden threshold."
