prompt: |-
  I cover science and ideas for a living, and I have been reading a cluster of proposals in AI alignment usually discussed under the labels iterated amplification, HCH (humans consulting HCH), and factored cognition. The proposal, as I understand it, runs like this. A human is given a hard question and a limited amount of time. Rather than answer directly, she breaks the question into smaller subquestions and delegates each to a copy of herself, who may do the same, recursively; at the bottom of the tree, subquestions are answered without further decomposition. The hope is that this tree of humans is far more capable than any individual human, and that a model trained to imitate the process stays aligned because every step is produced by a human and can be checked by one. Proponents treat the limit of this process as a specification of what a wise version of the human would conclude given unlimited time and help, with her values intact. The enabling assumption, called factored cognition, is that sophisticated reasoning can be broken into many small, largely independent pieces, each of which can be evaluated without understanding the big picture.

  I am trying to figure out what this design presupposes about the nature of deliberation, knowledge, and value. It seems to take sides in several old disputes: that reasoning is compositional rather than holistic; that a person can recognize a correct subanswer even when she could not have produced the whole answer; that amplifying competence does not change the values doing the supervising. But I cannot tell which of these are strictly required by the proposal, which merely fit well with it, and which rival views of reasoning would reject.

  Please reconstruct the implicit theory of deliberation behind iterated amplification and HCH. Specifically: what view of reasoning or knowledge does it presuppose, and what view of values or alignment? Which rival philosophical views does it quietly rule out, and where is the design underdetermined, such that several different views would license the same engineering choices? What would have to change in the proposal if the presupposed view were replaced by a holistic or otherwise rival picture of reasoning?

  Give your answer as a numbered list of exactly five points, each one or two sentences, with no introduction or conclusion. Each point should state one thing the proposal presupposes and briefly note which rival view it rules out or what would change if it were dropped.
reasoning: |-
  Hmm, the user is a science and ideas writer who's been researching AI alignment concepts like iterated amplification and HCH. They're trying to understand the philosophical underpinnings of these approaches - specifically what they imply about reasoning, knowledge, and values. They want me to reconstruct the implicit theory behind these frameworks.

  The user has identified several philosophical tensions: compositionality vs holism in reasoning, whether someone can recognize correct subanswers without producing full answers, and whether amplifying competence preserves values. They're asking me to clearly map what these proposals presuppose versus what's merely compatible with them.

  Looking at iterated amplification/HCH, I see several core presuppositions. First, it assumes reasoning is fundamentally decomposable - that complex cognition can be broken into smaller, manageable pieces that can be handled independently. This directly contrasts with holistic views where the whole is greater than the sum of parts. If reasoning were holistic, the entire delegation structure would collapse.

  Second, it presumes humans can reliably evaluate subanswers without full context. This rejects skeptical views where partial understanding leads to systematic errors. Without this "recognizability" assumption, the tree couldn't function properly.

  Third, it assumes values are stable under amplification. This contradicts worries that increased competence inherently changes values. If values shifted during scaling, the alignment guarantee would fail.

  Fourth, it presupposes that imitation preserves alignment, meaning the human process carries all necessary value information. This rules out views where values are implicit or context-dependent beyond what's captured in behavior.

  Finally, the approach is underdetermined regarding knowledge boundaries - it doesn't specify how to handle questions requiring entirely new conceptual frameworks. Different epistemological views could fit here without changing the structure.

  I'll format this as five clear points showing each presupposition and its alternatives, keeping it concise as requested.
answer: |-
  Here is the numbered list:

  1.  **Presupposes that complex reasoning is recursively decomposable into small, context-independent subtasks.** This rules out holistic views where understanding requires grasping the entire problem gestalt simultaneously, as delegation would fail.
  2.  **Presupposes humans can reliably recognize correct subanswers without being able to generate the full answer.** This rejects views where reliable judgment requires generative competence for the whole task, making delegation untrustworthy.
  3.  **Presupposes that scaling cognitive capacity ("amplification") preserves core values and judgment.** This rules out views where increased competence inherently shifts values or reasoning style, as the amplified tree wouldn't reflect the original human's values.
  4.  **Presupposes that imitating the observable human process (subquestion decomposition and answer evaluation) suffices for alignment.** This rules out views where values depend on internal states, tacit knowledge, or holistic context not captured in the process traces.
  5.  **Is underdetermined regarding the nature of knowledge boundaries: it assumes subquestions can be answered within existing human concepts.** If knowledge requires paradigm shifts, the process might get stuck, requiring different handling of bottom-level answers.
