answer: |-
  **(As Bernard Williams):**  
  You press precisely where the distinction bites—and miss its phenomenological core. The problem isn't logical inference per se, nor even bare self-consciousness about one's reasons; it is the *character* of the justificatory step. When you posit the husband thinking "She is my wife and she is drowning, so I will save her," the "so" *can* express the immediate, non-negotiable pull of his commitment—a direct recognition that *this* demands action. But if he adds "and spouses are permissible to save," he shifts stance: he now views his response through an impersonal lens, as if his devotion required external validation. The Kantian alternatives you suggest—"I have a duty to her" or "that fact gives me a reason"—risk the same alienation if they frame the relationship as *instantiating* an obligation, rather than *being* the source of it. The "one thought too many" isn’t *any* additional thought, but the thought that *seeks* justification beyond the personal perspective—the thought that treats his love as a *case* of something universal. Impartial theories systematize this error; they make the personal *contingent* upon the impersonal. That is why integrity fractures.  

