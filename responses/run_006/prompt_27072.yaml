  - Legal readings are tautological but uninteresting morally. 
  - Strong moral claims (e.g., absolute control as property right) crumble under scrutiny—territories aren't owned like chairs. 
  - The most defensible version is collective self-determination with limitations, but it doesn't inherently negate the analogy since trade restrictions also limit self-determination. 
