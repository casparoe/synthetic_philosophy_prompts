  I notice the user wants British English—easy enough with "defence" and "collectivised" spellings. More importantly, they want conciseness (under 1,200 words) so I'll avoid digressions. The core task is taxonomy followed by evaluating whether each reading actually defeats their trade-immigration analogy. 

