  For the analogy part: Only radical interpretations of border control (like near-absolute discretion) could dismiss the comparison, but those are weak. Most reasonable readings treat movement of goods and people similarly—both involve balancing sovereignty with other values. The user's interlocutor is likely invoking an undefined "sovereignty" right that wouldn't withstand the analogy if made explicit. 

  *Double-checking*: Am I being fair to restrictionist positions? Yes—I've granted the self-determination argument as defensible while showing its limits. The user likely wants ammunition against lazy debate tactics, not a polemic. 

