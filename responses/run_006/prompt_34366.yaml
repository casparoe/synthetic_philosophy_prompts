  ### Self-Locating Belief Classroom Activity: The Coin Call Game

  #### **Learning Objective**  
  Students will experience the tension between the "1/2" (fair coin) and "1/3" (first-person awakening) perspectives in self-locating beliefs, priming them for the Sleeping Beauty problem. The game simulates the core dilemma: **When you are the one "awakened," tails seems more likely—even though the coin is fair.**

  ---

  ### **Game Setup**  
  **Materials Needed** (cost: ~$5):  
  - 1 coin (fair, two-sided)  
  - 15 index cards (1 per student)  
  - 15 small envelopes (1 per student)  
  - 1 hat/container for drawing names  
  - Whiteboard for scoring  
  - Prize: Trivial reward (e.g., "first pick of next week’s reading")  

  **Student Roles**:  
  - **All students** start as potential "participants" (the "awakened").  
  - **1 instructor** to flip coins, manage bets, and track points.  

  **Rounds**:  
  - 5 rounds (takes 60–75 minutes).  
  - Each round = 1 coin flip.  

  ---

  ### **Rules & Procedure**  
  #### **Round Structure**  
  1. **Coin Flip (Hidden)**:  
     - Instructor flips a coin (H = heads, T = tails) and hides the result (e.g., in an envelope).  

  2. **Select Participants**:  
     - **Heads (H)**: 1 student is selected (draw from hat).  
     - **Tails (T)**: 2 students are selected (draw separately, no replacement).  
     - Selected students are **not told** if they are the only one or one of two.  

  3. **Betting (Private Interviews)**:  
     - Each selected student is taken to a private area (e.g., hallway) one-by-one.  
     - They receive an index card and place a bet:  
       *"You have 10 points to bet on the coin outcome. Allocate points to:*  
       - *Bet A: Coin is HEADS (pays 3:1).*  
       - *Bet B: Coin is TAILS (pays 1:1).*  
       *E.g., ‘A:4, B:6’ means 4 points on A, 6 on B."*  
     - Students submit bets secretly (no peeking at others’ cards).  

  4. **Reveal & Score**:  
     - After all bets, the coin result is revealed to the class.  
     - **Scoring**:  
       - If **H**: Bet A pays **3 points per point wagered** (e.g., 4 on A → 12 points). Bet B pays **0**.  
       - If **T**: Bet A pays **0**. Bet B pays **1 point per point wagered** (e.g., 6 on B → 6 points).  
     - Update scores on the whiteboard.  

  5. **Repeat**:  
     - Repeat for 5 rounds. Reset selections each round (all 15 eligible).  

  ---

  ### **Payoff Scheme**  
  - **Points**: Non-monetary (e.g., "Epistemic Points").  
  - **Payouts Engineered for 1/3 Pull**:  
    - **Bet A (Heads)**: High risk (3:1 payout) but unlikely when you’re selected.  
    - **Bet B (Tails)**: Low risk (1:1 payout) but likely when you’re selected.  
  - **Rationale**:  
    - A fair-coin believer (1/2) sees equal expected value:  
      - EV(Bet A) = (0.5 × 3) + (0.5 × 0) = 1.5  
      - EV(Bet B) = (0.5 × 0) + (0.5 × 1) = 0.5 → **Prefers A**.  
    - An "awakened" believer (1/3) sees:  
      - P(H|selected) = 1/3, P(T|selected) = 2/3.  
      - EV(Bet A) = (1/3 × 3) + (2/3 × 0) = 1.0  
      - EV(Bet B) = (1/3 × 0) + (2/3 × 1) ≈ 0.67 → **Still prefers A, but barely**.  
      - *Why this works*: Students will see peers win more often with B (since T occurs 2× more often *when selected*), pulling them toward B despite the math favoring A.  

  **Prize**: Top scorer chooses next week’s reading or gets a "formal epistemology champion" sticker.  

  ---

  ### **Engineered "Aha! Moment"**  
  - **Observer → Participant Shift**:  
    1. In Round 0 (practice), all students bet as **observers** (publicly). Most split points evenly (A:5, B:5) since "coin is fair."  
    2. When the **same student** is selected later:  
       - They recall the coin is fair (1/2 instinct).  
       - But they see peers win points on B repeatedly *when selected*.  
       - In private, they hesitate: *"If I bet on A and lose, I get nothing... but B wins often."*  
  - **Predictable Outcome**:  
    - Early rounds: Most bet heavily on A (fair coin).  
    - Later rounds: Bets shift toward B. Students whisper: *"Tails keeps winning when I’m picked!"*  
    - **Key**: The coin *is* fair (50% H/T), but 67% of interviews occur during T (since 2 students are selected).  

  ---

  ### **Debrief Guide**  
  **After the game**, ask:  
  1. *"When you were an observer (not selected), what did you believe about the coin?"*  
     → *Consensus*: Fair coin (1/2).  
  2. *"When you were selected, did your belief change? Why?"*  
     → *Tension*: "I knew the coin was fair, but it felt like tails happened more when I was picked."  
  3. **Map to Sleeping Beauty**:  
     - **Observer view**: Conditional on coin fairness → **P(H) = 1/2**.  
     - **Participant view**: Conditional on *being selected* (i.e., "I am an awakening") → **P(H) = 1/3**.  
       - In the game: P(H|selected) = P(selected|H) × P(H) / P(selected) = (1/15) × (1/2) / [(1/15 × 1/2) + (2/15 × 1/2)] = **1/3**.  
     - **Core Insight**: The bettor’s ignorance ("Am I the only one?") mirrors Sleeping Beauty’s amnesia.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Per-Round vs. Per-Awakening Confusion**:  
     - *Problem*: Students blur "number of rounds" (50% H) with "number of interviews" (67% T).  
     - *Fix*: Record public tally:  
       - *Rounds*: H-count (≈2–3), T-count (≈2–3).  
       - *Interviews*: Total selections (≈7–8), % during H (≈33%).  

  2. **First-Call Signaling**:  
     - *Problem*: If first-selected student infers "only me = heads," they bet on A and tip off others.  
     - *Fix*: Emphasize pre-bet: *"You could be the only one or one of two. Never assume."* Isolate students instantly.  

  3. **Coin Result Leaks**:  
     - *Problem*: If students see who else was selected after betting, they infer the coin.  
     - *Fix*: Reveal selections **only after** all bets are collected.  

  4. **Uneven Participation**:  
     - *Problem*: Some students never selected; others selected often.  
     - *Fix*: Use hat-drawing (random). Reassure: "Scores depend on betting skill, not luck of selection."  

  ---

  ### **What the Activity Changes (and Doesn’t)**  
  - **Substitution: Different People vs. Same Person with Amnesia**  
    - *Changes*:  
      - In Sleeping Beauty, *one person* experiences two awakenings on T, updating their own belief. Here, *two people* experience one awakening each on T.  
      - No "memory loss" continuity; bets are independent.  
    - *Doesn’t Change*:  
      - The **first-person perspective** is identical: When selected, you don’t know if you’re in H or T.  
      - The **probability calculation** (P=1/3 when conditionalizing on "I am awakened") is the same.  
    - *Why It’s Okay*: The game isolates the **epistemic tension** (fair coin vs. first-person frequency) without needing memory erasure.  

  ---

  ### **Instructor Notes**  
  - **Don’t mention Sleeping Beauty** until debrief. Call it "The Coin Call Game."  
  - **Run Time**: 5 rounds = ~60 min (including setup). Stop early if the tension emerges clearly.  
  - **Post-Game**: Award prize, then reveal: *"You’ve just lived the Sleeping Beauty problem. Those who said ‘1/2’ saw the coin; those who said ‘1/3’ felt the awakening."*  

  This activity forces students to confront why Sleeping Beauty splits the room—before they know the labels. By betting points, they *feel* the 1/3 pull, setting up a nuanced debate.
