          Rules handout (for students):

            We are playing a game to explore how information affects probabilities.

            There will be multiple rounds. In each round:

              - A fair coin is flipped. The result is hidden until the end of the round.
              - In Round 0 (the observer round): every student will make a bet on the coin outcome.
