prompt: |-
  I'm a software engineer, and I keep running into Monte Carlo simulations where the sample mean never settles down. I'd like to know what principle, if any, captures my gut verdicts on these gambles. In each, a fair coin is flipped until it first lands heads; if that first heads is on flip n, you receive the stated payoff.

  1. St. Petersburg game: payoff $2^n. I'd pay at most about $25 to play, and I don't think that's a mistake even though the expected value is infinite.
  2. Pasadena game: payoff $(-1)^{n+1} 2^n / n, so the probability-weighted terms are 1 − 1/2 + 1/3 − 1/4 + …, which converges to about 0.69 only conditionally; I gather the expectation itself is undefined. I wouldn't pay even $1 to play.
  3. The same game with the signs flipped: payoff $(-1)^n 2^n / n, so the probability-weighted terms sum to about −0.69 in the given order, again only conditionally. I also wouldn't pay $1 to avoid it.
  4. Any of these games with all payoffs capped at $10 million: I'll happily price it by its ordinary finite expected value.
  5. Two independent copies of the Pasadena game bundled together: I still refuse to put a price on the bundle.

  Is there one principle about when an expected value may guide a price that gets all of these, or close? What does it say about a game with no sign alternation and payoff $2^n / n, and about a variant whose probability-weighted terms are the same as the Pasadena game's but rearranged so their partial sums tend to +100? Which of my verdicts, if any, does that principle force me to drop? Please separate what is settled from what is genuinely contested among people who work on this, and don't present a contested view as the consensus.
reasoning: |-
  We are dealing with games that have infinite expected values or undefined expectations. The key principles that might explain the software engineer's intuitions are:

  1. **St. Petersburg game (payoff = $2^n)**: The expected value is infinite, but the engineer would pay at most about $25. This is a well-known paradox. The principle that explains this is **risk aversion** or **bounded rationality** (having a utility function that is concave or bounded). However, the engineer's question is about when the expected value can guide the price.

  2. **Pasadena game (payoff = $(-1)^{n+1} 2^n / n$)**: The expectation is conditionally convergent and hence undefined (due to the Riemann rearrangement theorem). The engineer wouldn't pay $1 to play.

  3. **The same game with signs flipped (payoff = $(-1)^n 2^n / n$)**: Similarly, the expectation is conditionally convergent and undefined. The engineer wouldn't pay $1 to avoid it.

  4. **Capped versions (at $10 million)**: The expectation becomes finite and the engineer is happy to price it by the ordinary expected value.

  5. **Two independent copies of the Pasadena game**: The engineer refuses to put a price on the bundle.

  The principle that unifies these is the **finiteness of the expected value** in a strong sense. However, note that the St. Petersburg game has an infinite expectation and the Pasadena game has an undefined expectation.

  A more refined principle is that of **uniform integrability** or the requirement that the expectation must be absolutely convergent (i.e., the sum of the absolute values of the payoffs weighted by their probabilities must be finite). This is often called having a game with "finite first moment".

  Let's break it down:

  - **Absolute convergence**: The series of the absolute values of the payoffs, each multiplied by their probability, must converge. That is, if the payoff in state n is X_n and the probability is p_n, then we require:
        ∑ |X_n| * p_n < ∞

  This condition ensures that the expectation is well-defined (unlike conditionally convergent series) and that the law of large numbers holds (in the sense that the sample mean converges to the expected value).

  Now, let's apply this to each game:

  1. **St. Petersburg game**: 
     - Payoff: 2^n, probability: 1/2^n.
     - Absolute series: ∑ (2^n) * (1/2^n) = ∑ 1 = ∞ → not absolutely convergent. 
     - Hence, the expectation is not defined in the strong sense (though it is infinite in the usual sense). This explains why the sample mean doesn't settle and why the engineer is reluctant to pay much.

  2. **Pasadena game**:
     - Payoff: (-1)^{n+1} * 2^n / n, probability: 1/2^n.
     - Absolute series: ∑ |(-1)^{n+1} * 2^n / n| * (1/2^n) = ∑ (2^n / n) * (1/2^n) = ∑ 1/n = ∞ → not absolutely convergent. 
     - Hence, the expectation is undefined (due to conditional convergence) and the sample mean may not settle.

  3. **Flipped Pasadena game**: Similarly, the absolute series is the same (∑ 1/n = ∞) → not absolutely convergent.

  4. **Capped games**: The absolute series becomes finite because the payoff is bounded. Hence, the expectation is well-defined and finite.

  5. **Two independent copies of the Pasadena game**: 
     - The bundle has payoffs that are the sum of two independent Pasadena games. The absolute convergence condition for the bundle would require that the expectation of the absolute value of the sum of two independent copies is finite? Actually, we must consider the product space. However, note that the absolute value of the payoff for one game is 2^n / n, and the event for two games involves pairs (n1, n2) and the payoff is the sum of two such terms. The absolute series for the bundle is:
          ∑_{n1=1}^∞ ∑_{n2=1}^∞ |X_{n1} + X_{n2}| * (1/2^{n1}) * (1/2^{n2})
     - But note that |X_{n1}+X_{n2}| ≤ |X_{n1}| + |X_{n2}|, so the absolute series is bounded by:
          ∑_{n1} ∑_{n2} [ |X_{n1}| + |X_{n2}| ] * (1/2^{n1}) * (1/2^{n2}) 
          = 2 * ∑_{n1} |X_{n1}| * (1/2^{n1}) * (∑_{n2} 1/2^{n2}) 
          = 2 * (∑_{n1} |X_{n1}| * (1/2^{n1})) * 1
          = 2 * (∑_{n1} 1/n1) = ∞
     - Hence, the bundle also fails absolute convergence. Therefore, the expectation of the bundle is undefined (it might be conditionally convergent in a different order, but the absolute series diverges). This explains why the engineer refuses to put a price.

  Therefore, the principle is: **We should only use the expected value to guide pricing when the expectation is defined and finite in the absolute sense (i.e., the absolute series converges).**

  Now, let's apply this to two new games:

  - **Game with payoff $2^n / n$ (no sign alternation)**:
     - Absolute series: ∑ (2^n / n) * (1/2^n) = ∑ 1/n = ∞ → not absolutely convergent.
     - Therefore, the expectation is infinite (since the terms are positive and the series diverges). This is similar to the St. Petersburg game but with slower growth. The engineer might be willing to pay a bit more than for the original St. Petersburg? But note, the expectation is still infinite. However, the divergence is harmonic (slow) so the engineer might be willing to pay a little more? But the principle of absolute convergence fails so we cannot rely on the expectation. The engineer's intuition might be to pay a modest amount, but the principle does not force a specific price.

  - **Variant of Pasadena game rearranged to have partial sums tending to +100**:
     - By the Riemann rearrangement theorem, we can rearrange the conditionally convergent series to converge to any real number (or even diverge). However, note that the rearrangement changes the game. The original game has a fixed order of outcomes (n=1,2,3,...). The rearrangement would require changing the assignment of payoffs to the outcomes (i.e., changing which outcome n gets which payoff). 
     - But the game is defined by the flip sequence: the first heads on flip n. We cannot rearrange the natural order of n. Therefore, the game as defined has a fixed order (n=1,2,3,...). 
     - However, if we define a new game where we assign the payoffs in a different order (say, by a permutation of n), then we are effectively creating a new random variable. In that case, the expectation might be made arbitrarily large (or small) by rearrangement. 
     - But note: the probability of each n is fixed (it's the probability that the first heads is on flip n). Rearranging the payoffs without changing the probabilities would change the distribution. 
     - The engineer's principle of absolute convergence: if the absolute series diverges, then we cannot assign a well-defined expectation. Rearrangement does not change the absolute series (since absolute values are the same). Therefore, the absolute series still diverges (∑ 1/n = ∞). Hence, the expectation of the rearranged game is still undefined (by the same absolute convergence failure). 
     - However, if we fix the rearrangement (i.e., we define a specific permutation of the natural numbers and assign the payoff for outcome k to be the term corresponding to that permutation), then the series of the payoffs (in the natural order of k) is a rearrangement of the original series. Therefore, it might converge to 100. But note: the expectation is defined as the sum of the payoffs multiplied by their probabilities, and that sum is now conditionally convergent to 100. However, because the absolute series diverges, the expectation is still not absolutely convergent. Therefore, the expectation is defined conditionally (if we fix the order) but it is not robust. In particular, if we bundle two independent copies of this rearranged game, we might run into problems because the expectation of the bundle might depend on the order of summation.

  The principle of absolute convergence forces the expectation to be robust to rearrangements and to the way we group terms. Therefore, the engineer might still be reluctant to price this rearranged game at $100? Why? Because the sample mean might not converge to 100 (or might converge very slowly and erratically). Moreover, the expectation of the bundle of two independent copies of this rearranged game might not equal 2*100=200 (due to the same conditional convergence issues).

  In summary:

  - The principle: **The expectation must be absolutely convergent (i.e., L1 norm finite) for it to be a reliable guide for pricing.**

  Which verdicts does this principle force to drop?

  - The engineer says about the St. Petersburg game: "I'd pay at most about $25". The principle does not force a specific price but explains why the infinite expectation is not a good guide. So that verdict is consistent.

  - The Pasadena game and its flipped version: the principle says the expectation is undefined, so the engineer's refusal to put a price is consistent.

  - The capped version: the principle says it's absolutely convergent, so the engineer's pricing by expected value is consistent.

  - The two independent copies of the Pasadena game: the principle says the bundle also has an undefined expectation (because it fails absolute convergence) so the engineer's refusal is consistent.

  However, note that the engineer might have a different attitude toward the rearranged Pasadena game that converges to 100. The principle says that even though the series converges to 100 in the fixed order, it is not absolutely convergent. Therefore, the expectation is not robust. The engineer might be tempted to price it at $100 because the series sums to 100 in the natural order. But the principle would caution against it because:

  - The sample mean might not converge to 100 (or might do so very erratically).
  - The expectation of linear combinations (like two independent copies) might not be linear.

  Therefore, the principle would force the engineer to drop the idea of pricing the rearranged Pasadena game at $100. Instead, the engineer should treat it as undefined and refuse to put a fixed price? Or at least be aware that the expected value is fragile.

  What is settled and what is contested?

  - **Settled**: 
     - The necessity of absolute convergence for the expectation to be well-defined and for the strong law of large numbers to hold (for independent and identically distributed random variables) is a standard result in probability theory (Kolmogorov's strong law requires L1, i.e., finite absolute expectation).
     - The St. Petersburg paradox is well-known and risk aversion (via utility functions) is a common resolution. However, the absolute convergence condition is a different perspective (mathematical) and is also settled.

  - **Contested**:
     - How to make decisions when the absolute expectation is infinite or undefined? There are alternative approaches:
          - Using a utility function (e.g., logarithmic utility) which would make the St. Petersburg game have a finite expected utility.
          - Using a stopping rule (only consider up to a certain n) which is similar to capping.
          - Using other decision criteria (e.g., median, or safety first).
     - For the Pasadena game, there is ongoing research. Some propose to use the concept of "weak expectation" or to use a specific order of summation. However, these are not without issues.

  But note: the engineer's question is about when the expected value (as defined by the series) may guide the price. The mathematical principle that the expectation must be absolutely convergent to be robust is settled. Therefore, in the rearranged Pasadena game (with partial sums tending to +100) the engineer should not rely on that expected value of 100. Thus, the engineer's verdict on that game would have to be: refuse to put a fixed price? Or at least, not rely on the 100.

  However, the engineer might still be willing to pay a small amount for the rearranged game? But that would be a different intuition. The principle does not force a specific price, but it does force the engineer to drop the idea that the expected value is 100 and should guide the price.

  In summary:

  - The principle of absolute convergence (finite L1 norm) unifies the engineer's verdicts and explains why the sample mean doesn't settle in these games.

  - It forces the engineer to not rely on the expected value of the rearranged Pasadena game (even if it is conditionally convergent to 100) and to treat it as undefined.

  - It also explains that the game with payoff 2^n/n (positive) has an infinite expectation (so the sample mean will grow without bound) and the engineer should not be willing to pay an arbitrarily large amount to play.

  Thus, the engineer's verdicts are consistent with this principle. The only potential change is that the engineer should not price the rearranged Pasadena game at $100. Instead, the engineer should treat it as they did the original Pasadena game (refuse to put a fixed price).
answer: |-
  ### Principle: Absolute Convergence of Expected Value
  The key principle that captures your intuitions is the requirement for **absolute convergence of the expected value**. For a random variable \(X\) with payoffs \(x_i\) and probabilities \(p_i\), the expectation \(\mathbb{E}[X] = \sum p_i x_i\) must be **absolutely convergent** to be well-defined and reliable for pricing. Absolute convergence means \(\sum p_i |x_i| < \infty\). This ensures:
  1. The expectation is finite and independent of the order of summation.
  2. The sample mean converges to the expectation (by the strong law of large numbers for i.i.d. sequences).
  3. The expectation is linear (e.g., \(\mathbb{E}[X + Y] = \mathbb{E}[X] + \mathbb{E}[Y]\)).

  If \(\sum p_i |x_i| = \infty\), the expectation is either **infinite** (if terms are non-negative) or **undefined** (if conditional convergence allows rearrangement to any value).

  ---

  ### Analysis of Your Gambles
  1. **St. Petersburg game** (\(2^n\)):  
     \(\sum \frac{1}{2^n} \cdot 2^n = \sum 1 = \infty\) → **Not absolutely convergent**.  
     Expectation is infinite, but sample mean doesn't settle. Your max price of $25 aligns with bounded utility (e.g., logarithmic) or risk aversion.

  2. **Pasadena game** (\((-1)^{n+1} 2^n / n\)):  
     \(\sum \frac{1}{2^n} \cdot \left| \frac{2^n}{n} \right| = \sum \frac{1}{n} = \infty\) → **Not absolutely convergent**.  
     Expectation is undefined (conditionally convergent). Refusing to pay $1 is consistent.

  3. **Flipped Pasadena game** (\((-1)^n 2^n / n\)):  
     Same as above → **Not absolutely convergent**, undefined expectation. Refusing to pay to avoid it is consistent (no risk of large loss).

  4. **Capped at $10M**:  
     \(|x_i| \leq 10^7\), so \(\sum p_i |x_i|\) converges → **Absolutely convergent**.  
     Finite expectation exists; pricing by expected value is valid.

  5. **Two Pasadena games**:  
     For the bundle, \(\sum p_i |x_i + y_i| \leq \sum p_i (|x_i| + |y_i|) = \infty\) → **Not absolutely convergent**.  
     Expectation undefined; refusal to price is consistent.

  ---

  ### New Games
  - **Game A: Payoff \(2^n / n\) (no sign alternation)**:  
    \(\sum \frac{1}{2^n} \cdot \frac{2^n}{n} = \sum \frac{1}{n} = \infty\) → Not absolutely convergent.  
    Expectation **infinite** (terms non-negative). Sample mean grows without bound. You might pay a modest amount (like St. Petersburg), but not rely on expectation.

  - **Game B: Rearranged Pasadena terms (partial sums → +100)**:  
    Absolute series \(\sum p_i |x_i| = \sum \frac{1}{n} = \infty\) → **Not absolutely convergent**.  
    Expectation **undefined** despite conditional convergence to 100. Riemann rearrangement theorem implies dependence on summation order. **Principle forces you to drop pricing it at $100**—refuse to fix a price (like original Pasadena).

  ---

  ### Settled vs. Contested
  - **Settled**:  
    - Absolute convergence is necessary for:
      - Well-defined, finite expectation.
      - Convergence of sample mean.
      - Linearity of expectation (e.g., bundling games).
    - Your verdicts for games 1–5 are consistent with this principle.  
    - Capped games are absolutely convergent → priced by expectation.  
    - Uncapped St. Petersburg (\(2^n\)) and Pasadena are not absolutely convergent → expectation unreliable.

  - **Contested**:  
    - **How to price non-absolutely convergent games?**  
      - Some argue for using utility functions (e.g., \(\log(x)\) for St. Petersburg).  
      - Others use "weak expectations" or distributional approaches.  
      - No consensus on a universal pricing rule.  
    - **Rearrangement (Game B)**:  
      - Conditional convergence allows any finite value via rearrangement.  
      - Most agree this is not a valid expectation (non-robust to ordering).  
      - Some argue for context-dependent pricing (e.g., if order is fixed), but this is debated.  
    - **Bundling (Game 5)**:  
      - Some propose "intrinsic" reordering (e.g., Cauchy product), but outcomes are ambiguous.  
      - No consensus on whether bundling resolves undefined expectations.

  ---

  ### Which Verdicts Must Change?
  - **Forced change**:  
    **Game B (rearranged to +100)** must be treated as **undefined**, refusing to price it at $100 (like original Pasadena). Absolute convergence failure overrides conditional convergence.
    
  - **Unchanged**:  
    Your other verdicts (1–5 and Game A) are consistent with the principle. Game A has infinite expectation but no sign alternation—your pricing remains discretionary (e.g., pay modestly, avoid high stakes).

  ### Summary
  - **Guiding principle**: Use expectation only if \(\sum p_i |x_i| < \infty\) (absolute convergence).  
  - **Your intuitions**: Largely align with this principle.  
  - **Contested areas**: Pricing non-absolutely convergent games (no consensus beyond "undefined").
