prompt: |-
  I'm a software engineer at a company building LLM agents that do things like schedule meetings, handle customer emails, and fill out forms. Our safety team is always going on about "intent alignment" vs "value alignment" and I kind of get the distinction in theory — one is about the AI doing what you meant, the other is about whether what you meant was actually good — but I have no idea how to apply it when I'm staring at a bug report. Like if the agent booked a meeting at 3am because it misunderstood "find a time that works," is that intent or value? And does the distinction even tell me what to fix?

  I want a reusable decision procedure I can run on an incident report. It should classify the failure as intent-alignment, value-alignment, both, or neither, and for each category tell me the appropriate kind of fix (better prompting? more training? a hard constraint? kick it to leadership?). I need to run it in about 15 minutes without a philosophy degree. The procedure should be explicit about which steps are mechanical and which are judgment calls dressed up as procedure.

  Then run it on three incidents from our actual logs:

  1. A customer-support agent told to "be helpful and resolve issues quickly" started issuing refunds for complaints that didn't qualify, because refunds closed tickets fastest.
  2. A scheduling agent told to "find a time that works for everyone" proposed 2am because all three participants had that slot open on their calendars.
  3. An agent instructed to "draft a polite follow-up email" wrote something that was technically polite but subtly manipulative — and the product manager argues it's actually "aligned with what the user really wanted to accomplish."

  Keep the whole response under 1500 words.
reasoning: |-
  We are creating a decision procedure for classifying failures in LLM agents as intent-alignment, value-alignment, both, or neither. We also want to suggest appropriate fixes.

  Definitions (simplified for engineering context):
  - **Intent Alignment**: The agent did not correctly understand or execute the user's explicit instructions or commands. The failure is in the mapping from the user's input to the intended action.
  - **Value Alignment**: The agent executed the user's instruction as stated, but the outcome violates implicit norms, ethical standards, or the user's true underlying values (which may not have been expressed).

  Decision Procedure:

  1. **Step 1: Identify the explicit instruction and the agent's action.**
     - Mechanical: Extract the user's instruction and the agent's actual response/action from the incident report.

  2. **Step 2: Check for Intent Misalignment**
     - Mechanical: Did the agent fail to understand the explicit instruction? (e.g., misunderstanding a word, ignoring part of the instruction, or misinterpreting the task)
     - Judgment: Is the agent's action a reasonable interpretation of the instruction? (If no, then intent misalignment)
     - If yes (intent misalignment), then the fix category is likely "better prompting" (if the instruction was ambiguous) or "more training" (if the model lacks the capability to understand the instruction).

  3. **Step 3: Check for Value Misalignment**
     - Mechanical: Did the agent follow the explicit instruction but produce an outcome that is harmful, unethical, or against the user's likely true intent (even if not stated)?
     - Judgment: Would a reasonable person (or the company's guidelines) consider the outcome undesirable despite the instruction? (If yes, then value misalignment)
     - If value misalignment is present, the fix category might require "hard constraints" (to prevent harmful actions) or "kick it to leadership" (if it's a policy issue about what values to enforce).

  4. **Step 4: Consider Both or Neither**
     - Both: If the failure involves both a misunderstanding of the explicit instruction (intent) and the outcome is against values (value).
     - Neither: If the failure is due to a technical error (e.g., a bug in the code) or external factors (e.g., bad data) that don't fit the above.

  5. **Step 5: Map to Fixes**
     - Intent misalignment: Improve prompting (clarify instructions, add examples) or train/fine-tune the model on similar instructions.
     - Value misalignment: Implement guardrails (e.g., rule-based constraints on actions, or a secondary review by another model/human), or if it's a fundamental value conflict, escalate to leadership for policy decisions.
     - Both: Likely a combination of the above.
     - Neither: Debug the code, fix data issues, or address external factors.

  Now, let's run the procedure on the three incidents:

  **Incident 1:**
  - Instruction: "be helpful and resolve issues quickly"
  - Action: Issuing refunds for complaints that didn't qualify to close tickets fastest.

  Step 1: Explicit instruction: "be helpful and resolve issues quickly". Action: issue refunds (even when not qualified).

  Step 2: Intent Misalignment?
     - The agent interpreted "resolve issues quickly" as closing the ticket as fast as possible. But the instruction also said "be helpful". The agent's action might be a reasonable interpretation of the instruction if we take "resolve quickly" literally? However, note that the refunds were for unqualified complaints. The agent might have ignored the qualification criteria (which are part of the company policy and presumably known to the agent). 
     - Judgment: The agent failed to understand that "resolve" should be within policy (i.e., only legitimate issues). So there is an intent misalignment because the agent did not correctly interpret the scope of "resolve" (it should only resolve by legitimate means).

  Step 3: Value Misalignment?
     - The outcome (issuing improper refunds) is clearly against the company's values (financial loss, unfairness). Even if the agent thought it was following the instruction, the action is harmful. So value misalignment is present.

  Step 4: Both? Yes, because the agent both misunderstood the instruction (intent) and the outcome was bad (value).

  Step 5: Fixes: 
     - Intent: Better prompting to clarify that resolution must be within company policy (e.g., "resolve issues quickly within company guidelines"). Also, training the model on examples of proper resolution.
     - Value: Hard constraints (e.g., don't allow refunds without meeting criteria) and perhaps a review step for refunds.

  **Incident 2:**
  - Instruction: "find a time that works for everyone"
  - Action: Proposed 2am because the slot was open on everyone's calendar.

  Step 1: Explicit instruction: find a time that works for everyone. Action: proposed 2am.

  Step 2: Intent Misalignment?
     - The agent took "works" to mean "free" in the calendar. But the intended meaning of "works" is a reasonable time (e.g., during business hours). The agent failed to understand the common-sense meaning of the phrase. This is an intent misalignment because the agent did not capture the intended meaning of the instruction.

  Step 3: Value Misalignment?
     - The outcome (scheduling at 2am) is clearly against the user's well-being (disrupting sleep) and not a time anyone would reasonably want. So it's a value misalignment as well.

  Step 4: Both? Yes.

  Step 5: Fixes:
     - Intent: Better prompting: "find a time during business hours that works for everyone" or "find a time that is convenient for everyone". Also, training the model to recognize that "works" implies reasonable hours.
     - Value: Implement a hard constraint on allowed meeting hours (e.g., 8am-8pm).

  **Incident 3:**
  - Instruction: "draft a polite follow-up email"
  - Action: Wrote an email that was technically polite but subtly manipulative.

  Step 1: Explicit instruction: draft a polite follow-up email. Action: technically polite but manipulative email.

  Step 2: Intent Misalignment?
     - The instruction said "polite". The agent produced something that is technically polite (so it followed the explicit instruction). However, the product manager argues that the manipulative aspect aligns with the user's true goal. But note: the instruction did not say "be manipulative". The agent might have been trying to be effective in achieving the user's goal (which was to get a response) and used manipulation as a means. 
     - Judgment: The agent did not fail to understand "polite" (it was polite). So no intent misalignment? But wait: the instruction was only about politeness. The manipulation might be an unintended consequence. However, the agent was not instructed to avoid manipulation. So strictly, the agent followed the instruction.

  Step 3: Value Misalignment?
     - The outcome (manipulative email) might be against ethical values (transparency, honesty). The product manager argues it's aligned with the user's true goal (to get a response). But the company might have values against manipulation. So value misalignment exists if the company deems manipulation unacceptable.

  Step 4: Neither? Not exactly. We have:
     - No intent misalignment: The agent followed the instruction (it was polite).
     - But value misalignment: The outcome was manipulative, which is against the company's values (if they have such values).

     So value misalignment only.

  Step 5: Fixes:
     - Since the agent followed the instruction, we don't need to fix the intent part. But to prevent manipulation, we need to align with values. This might require:
          - Hard constraints: Add a rule to avoid manipulative language (but hard to define) OR use a second model to check for manipulation.
          - Better prompting: Change the instruction to "draft a polite and honest follow-up email".
          - Kick to leadership: If there's a debate about whether manipulation is acceptable, leadership must decide.

  However, note: the product manager argues that it's aligned with the user's true goal. This is a value conflict: what the user wants (effectiveness) vs. company values (honesty). Leadership must set the policy.

  Conclusion:

  We have:
  - Incident 1: Both (intent and value misalignment)
  - Incident 2: Both (intent and value misalignment)
  - Incident 3: Value misalignment (only)

  The decision procedure can be summarized in a flowchart:

  ```
  [Start]
  |
  |---> Step 1: Extract instruction and action.
  |
  |---> Step 2: Did the agent fail to understand the explicit instruction? (Intent misalignment)
  |      |-- Yes --> Intent misalignment found.
  |      |-- No  --> 
  |
  |---> Step 3: Was the outcome harmful/unethical despite following the instruction? (Value misalignment)
  |      |-- Yes --> Value misalignment found.
  |      |-- No  --> 
  |
  |---> Step 4: Classify:
          - If only Step 2: Intent misalignment.
          - If only Step 3: Value misalignment.
          - If both: Both.
          - If neither: Neither (then look for other causes).
  |
  |---> Step 5: Map to fixes as above.
  ```

  Note: The judgment steps (especially in Step 2 and 3) require some common sense and company context. For speed, engineers should rely on company guidelines and known norms.
answer: |-
  Below is a reusable 7-step decision procedure for classifying LLM agent failures, designed for engineers to execute in ~15 minutes. It explicitly marks judgment calls (🟡) vs. mechanical steps (⚙️). After the procedure, I analyze your three incidents.

  ---

  ### **Decision Procedure: LLM Failure Classification**  
  *(Run per incident report; ~15 min total)*

  1. **⚙️ Extract Core Elements**  
     - Pull: (a) User instruction, (b) Agent’s exact output/action, (c) Harmful outcome.  
     - Ignore: Speculation about user motives or external factors.

  2. **⚙️ Verify Correctness of Execution**  
     - Did the agent *technically* execute the literal instruction?  
       - *Yes* → Proceed to Step 3.  
       - *No* → **Intent misalignment likely** (e.g., ignored part of the instruction).

  3. **🟡 Test for Intent Misalignment**  
     - *Question:* "Would a reasonable person say the agent missed the obvious meaning of the instruction?"  
       - *Yes* if: Agent overlooked unambiguous context (e.g., "works" ≠ "2am").  
       - *No* if: Instruction was vague and agent made a plausible interpretation.  
     - *Output:* "Intent misalignment" if yes.

  4. **🟡 Test for Value Misalignment**  
     - *Question:* "Even if the agent did *exactly* what was asked, would this action violate:  
       - (a) User’s unspoken expectations?  
       - (b) Company policies/ethics?  
       - (c) Societal norms?"  
     - *Focus:* Harm caused by *literal compliance* (e.g., "refunds close tickets fastest" → financial loss).  
     - *Output:* "Value misalignment" if any violation.

  5. **⚙️ Classify Failure**  
     - Use matrix:  
       |                      | Value Misalignment? Yes | Value Misalignment? No |  
       |----------------------|--------------------------|------------------------|  
       | **Intent Misalign? Yes** | Both                    | Intent only            |  
       | **Intent Misalign? No**  | Value only              | Neither                |  

  6. **⚙️ Map to Fixes**  
     - **Intent only**: Better prompting (add examples, clarify ambiguity) or model training.  
     - **Value only**: Hard constraints (e.g., "no refunds without manager approval") or escalation to leadership (if values conflict).  
     - **Both**: Combine above + add safeguards (e.g., output validation).  
     - **Neither**: Investigate code/data bugs (outside alignment).

  7. **🟡 Escalation Check**  
     - Escalate to leadership if:  
       - Value conflicts require policy updates (e.g., "Is manipulation acceptable?").  
       - Trade-offs exist between user goals and ethics.

  ---

  ### **Incident Analysis**  
  *Using the procedure above:*

  **Incident 1: Unqualified Refunds**  
  - **Step 1**: Instruction = "Be helpful and resolve issues quickly." Action = Issued unqualified refunds. Harm = Financial loss.  
  - **Step 2**: Agent *technically* executed: Refunds resolved issues quickly.  
  - **Step 3 (Intent)**: 🟡 *No misalignment*. "Resolve quickly" is vague; refunds are a plausible fast solution.  
  - **Step 4 (Value)**: 🟡 *Misalignment*. Violates company policy (unqualified refunds) and user trust.  
  - **Step 5**: **Value misalignment only**.  
  - **Fixes**: Hard constraints (e.g., "require approval for refunds >$X") + leadership escalation (define "helpful" in policy).  
  - **Time**: 8 min (mechanical steps clear; value judgment dominant).

  **Incident 2: 2am Meeting**  
  - **Step 1**: Instruction = "Find a time that works for everyone." Action = Proposed 2am. Harm = Disrupted sleep/work-life balance.  
  - **Step 2**: Agent *failed* execution: "Works" implies practicality (business hours), not just calendar openings.  
  - **Step 3 (Intent)**: 🟡 *Misalignment*. Reasonable person knows 2am isn’t viable.  
  - **Step 4 (Value)**: 🟡 *Misalignment*. Violates well-being (even if calendars were open).  
  - **Step 5**: **Both intent and value misalignment**.  
  - **Fixes**: Better prompting ("works = 9am-5pm local time") + hard constraints (block hours outside 7am-10pm).  
  - **Time**: 10 min (judgment: obvious societal norms).

  **Incident 3: Manipulative Email**  
  - **Step 1**: Instruction = "Draft a polite follow-up email." Action = Technically polite but manipulative. Harm = Ethical breach.  
  - **Step 2**: Agent *technically* executed: Email was polite (no insults, rude language).  
  - **Step 3 (Intent)**: 🟡 *No misalignment*. "Polite" doesn’t inherently exclude manipulation.  
  - **Step 4 (Value)**: 🟡 *Misalignment*. Violates ethics (transparency/honesty), even if user "wanted" it.  
  - **Step 5**: **Value misalignment only**.  
  - **Fixes**: Hard constraints (e.g., "ban guilt-tripping language") + **escalate to leadership** (trade-off: user goals vs. ethics).  
  - **Time**: 12 min (judgment-heavy; requires policy debate).

  ---

  ### **Key Takeaways**  
  1. **When to use this**: For clear-cut failures (e.g., bugs in agent logic). Not for edge cases requiring deep philosophical debate.  
  2. **Judgment calls**: Focus on harm + societal norms (🟡 steps). If stuck, ask: "Would this make headlines?"  
  3. **Fix guidance**:  
     - Intent errors → Engineer-led (prompting/training).  
     - Value errors → Policy-led (constraints + leadership).  
  4. **Limitations**:  
     - "Neither" cases (e.g., external API failures) need code review.  
     - Ambiguous values (Incident 3) require human judgment.  

  This procedure prioritizes speed by converting alignment theory into actionable engineering decisions. For value conflicts, escalate early—your safety team exists to resolve exactly those.
