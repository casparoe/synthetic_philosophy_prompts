  **Decision Tree for Diagnosing Philosophical Disputes**

  Start at the root node (Question 1) and follow the branches based on answers to each question. Answer each query based on the specific dispute about claim P, without metaontological jargon. Leaves indicate the diagnosis.

  ---

  **1. Do the parties agree on all *non-linguistic facts* relevant to P?**  
  *(Non-linguistic facts = states of the world describable without contentious terms in P or their derivatives. E.g., for "composite objects exist," this includes facts about simples and their arrangements, but not facts using "composite," "object," or "exists" in disputed senses.)*  
  - **YES** → Proceed to Question 2.  
  - **NO** → Proceed to Question 3.  

  **2. After disambiguating all contentious terms in P, do the parties still actively disagree?**  
  *(Disambiguation = explicitly defining distinct meanings for contentious terms. E.g., for "exists," define meaning A: "fundamental existence" and meaning B: "derivative existence.")*  
  - **YES** → **Substantively terminological dispute**.  
    *(Parties agree on non-linguistic facts but disagree about which terminological framework is preferable for describing them, e.g., based on theoretical virtues like simplicity or explanatory power.)*  
  - **NO** → **Merely verbal dispute**.  
    *(Disagreement vanishes after disambiguation; parties were "talking past each other" due to equivocal language.)*  

  **3. After disambiguating all contentious terms in P, do the parties still disagree about the *non-linguistic facts*?**  
  *(Re-evaluate non-linguistic facts using disambiguated terms. E.g., for "exists," use meaning A and B separately to check for persistent disagreement.)*  
  - **YES** → **Genuinely substantive dispute**.  
    *(Disagreement persists even after disambiguation; parties hold incompatible views about the world's structure.)*  
  - **NO** → **Merely verbal dispute**.  
    *(Disagreement about non-linguistic facts was an artifact of terminological confusion; it resolves after disambiguation.)*  

  ---

  ### Logical Space and Taxonomy  
  - **Leaves**:  
    - **Merely verbal dispute**: Dispute dissolves with disambiguation.  
    - **Substantively terminological dispute**: Agreement on non-linguistic facts but disagreement about language choice (terminology/framework).  
    - **Genuinely substantive dispute**: Irreducible disagreement about non-linguistic facts.  
  - **Empty regions**:  
    - *No dispute after agreement on facts and meanings*: Incoherent if parties initially disagree about P (implies logical error or miscommunication).  
    - *Mixed substantive-terminological disputes*: Not a leaf; disambiguation isolates substantive elements (if disagreement remains after Q3, it is "genuinely substantive").  
  - **Unresolvable leaf pairs**:  
    - **Merely verbal** (from Q2) vs. **merely verbal** (from Q3): Identical diagnosis; the tree distinguishes their pathways (Q2: agreement on facts; Q3: initial disagreement on facts resolved by disambiguation) but not their final state.  
    - **Substantively terminological** vs. **genuinely substantive**: Reliably separated (Q2 requires agreement on facts; Q3 requires disagreement even after disambiguation).  

  ### Notes  
  - **Incoherent regions**: "Agreement on non-linguistic facts AND agreement on meanings BUT disagreement about P" is impossible without logical error (excluded by assumption).  
  - **Unattractive regions**: None omitted; the tree covers all coherent combinations of answers.  
  - **Edge cases**: If disambiguation is incomplete (e.g., key terms undefined), the tree cannot be applied; ensure full disambiguation first.
