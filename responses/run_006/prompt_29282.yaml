answer: |-
  Below is a structured desiderata for an adequate account of rational disagreement, grounded in Aumann's theorem yet accommodating real-world persistent disagreements. The requirements are categorized as **non-negotiable** (derived directly from Aumann’s theorem and Bayesian rationality) or **negotiable** (reflecting philosophical commitments). Tensions are explicitly flagged.  

  ---

  ### **Non-Negotiable Requirements** (Violating these contradicts Aumann)  
  1. **Agreement under Common Prior + Common Knowledge (CK)**  
     *Requirement*: If agents share a common prior, have CK of their posteriors, and update via Bayes, they *must* agree.  
     *Motivation*: Aumann’s theorem (1976). CK of posteriors implies agents cannot be uncertain about each other’s beliefs, forcing convergence.  
     *Collapses if*: An account permits disagreement under these conditions.  

  2. **CK of Posteriors Forces Agreement**  
     *Requirement*: Mere knowledge of each other’s beliefs isn’t enough; *common knowledge* (infinite mutual recursion) is the trigger for convergence.  
     *Motivation*: Geanakoplos & Polemarchakis (1982) dynamic convergence proof. Without CK, disagreement can persist temporarily, but CK annihilates it.  
     *Collapses if*: An account conflates "knowing" with "common knowledge".  

  ---

  ### **Negotiable Requirements** (Camps diverge here)  
  3. **Distinction Maintenance**  
     *Requirement*: The account must *not* blur:  
     - (a) **Differing information** vs. **differing priors** vs. **differing processing** vs. **differing values**;  
     - (b) **Factual disagreements** (e.g., "Will inflation rise?") vs. **evaluative disagreements** (e.g., "How heavily should we weigh GDP vs. unemployment?");  
     - (c) **Temporary disagreement** (pre-CK) vs. **persistent disagreement** (post-CK).  
     *Motivation*: Real-world cases (e.g., politicized science: same data, different weights; religion: values masquerading as facts). Failure here enables equivocation.  

  4. **Common Prior as Regulative Ideal**  
     *Requirement*: Whether common priors are a *normative requirement* (rational agents *should* converge to one with enough evidence) or a *descriptive fiction* (real agents lack common priors).  
     *Motivation*: Aumann’s view (priors reflect objective evidence; differing priors imply irrationality) vs. Savage (1954)/subjectivists (priors can rationally differ).  
     *Tension*: If common priors are normative, persistent disagreement post-CK *must* be irrational.  

  5. **Explain Persistent Real Disagreement**  
     *Requirement*: The account must explain why well-informed, sincere peers (e.g., forecasters, experts) *persistently disagree* on topics like politics, despite shared evidence.  
     *Motivation*: Empirical psychology (Tetlock, 2017), polarization studies (Ditto et al., 2019).  
     *Collapses if*: It dismisses all disagreement as irrational.  

  6. **Bounded Rationality Compatibility**  
     *Requirement*: Whether bounded computation *must* be invoked (e.g., intractable models, cognitive limits) or if "ideal rationality" suffices.  
     *Motivation*: Computational complexity (e.g., Hanson, 2006; Aaronson, 2005) vs. Bayesian fundamentalism.  

  ---

  ### **Core Tension**  
  - **Requirement (4) + (5) + Aumann** are *jointly unsatisfiable* if:  
    (a) Common priors are normative (forcing convergence under CK), and  
    (b) Persistent disagreement exists among well-informed peers.  
  - **Resolution paths**:  
    - Deny (4): Common priors aren’t normative (allow rational prior divergence).  
    - Deny (5): Persistent disagreement is *always* irrational/bad-faith.  
    - Invoke (6): Bounds prevent CK/de facto common knowledge.  
    - Reject CK in practice: No real group achieves CK (e.g., noisy communication, ambiguous evidence).  

  ---

  ### **Most Excluding Requirement**  
  **Requirement (2)** does the most work in excluding standard positions:  
  - It forbids the "different priors" camp from claiming rational disagreement *under CK*.  
  - It forces bounded-rationality accounts to explain *why* CK isn’t achieved.  
  - It invalidates "Aumann absolutists" who ignore the CK requirement in real cases.  

  ---

  ### **Scorecard of Camps**  
  - **Aumann Absolutists** ("Rational disagreement impossible"):  
    Satisfies (1), (2), (4-normative). Fails (5): Cannot explain real disagreement without accusing peers of irrationality. Blurs (3c) by ignoring CK feasibility.  
  - **Differing Priors Camp** ("Priors differ, and that’s fine"):  
    Satisfies (5), (3a). Fails (1) and (2) *if* they permit disagreement under CK. Often violates (3c) by conflating pre-CK/persistent disagreement.  
  - **Bounded Rationality Camp** ("Computation/access limits"):  
    Satisfies (5), (6), (3c). Fails (4-normative) if they reject common priors as ideal. Risks vagueness if "bounds" aren’t specified (e.g., what prevents CK?).  

  ---

  ### **What Would Change My Mind**  
  - **Theorem/argument forcing revision**: A constructive proof that two Bayesian agents with *common prior, CK of posteriors, and identical evidence* can rationally disagree on a factual claim. This would refute Aumann and invalidate (1).  
  - **Least confident requirement**: **Requirement (5)**. It risks being unfalsifiable if "well-informed" is flexible. If shown that *all* persistent disagreements trace to values (not facts) or incentives (not epistemology), (5) might weaken.  

  ### **Where I Stand**  
  I lean toward **bounded rationality + common prior as ideal but unattainable**. CK is rarely feasible in practice (due to noise, complexity, or ambiguous evidence), and priors *can* rationally diverge if "rationality" includes limitations on evidence assimilation. What would shift me: Evidence that polarized experts achieve de facto CK (e.g., repeated consensus conferences) yet *still* disagree on simple facts. This would demand stronger priors or processing divergence.  

  This framework pins the tension: Aumann’s *ideal* versus the *explanation* of real disagreement. The escape valve is the infeasibility of common knowledge—not the theorem’s failure, but its inapplicability.
