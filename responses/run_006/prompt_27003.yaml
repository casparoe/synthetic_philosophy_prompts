answer: |-
  Here's the tight spec for a theory of hinge commitments, based on core phenomena from *On Certainty* and key cases. Think of this as the essential feature set:

  ### Non-Negotiable Desiderata (Must Get These Right)
  1.  **Groundlessness:**  
      *   **Case:** Moore holding up his hands to "prove" an external world fails. Propositions like "Here is one hand" or "The Earth exists" aren't *inferred* from evidence; they are the bedrock *presuppositions* for evidence to matter.  
      *   **Requirement:** Hinges cannot be justified by appeal to evidence or other propositions *within the framework they enable*. They lack "epistemic grounds" in the standard sense. A theory that makes hinges justifiable inferences fails.

  2.  **Functional Role (Enabling Justification):**  
      *   **Case:** Trying to doubt *everything* simultaneously (like radical skepticism) paralyzes inquiry. To test whether your pet is in the garden, you *must* take for granted countless things (e.g., your eyes work, the garden exists, the past is roughly reliable).  
      *   **Requirement:** Hinges are not objects of justification *in the moment*; they are *what makes justification possible*. They are the unchallenged background against which doubts, tests, and evidence make sense. A theory that makes hinges targets of ordinary justification fails.

  3.  **Context-Relativity (Shifting Status):**  
      *   **Case:** "The Earth is flat" stood fast for navigation millennia ago but is now an open empirical question (resolved, but testable). Conversely, "This is my hand" is a hinge *now*, but could become questionable in specific contexts (e.g., severe psychosis, philosophical thought experiment about brains in vats).  
      *   **Requirement:** What functions as a hinge is *relative to a specific context of inquiry*. Nothing is inherently hinge-like forever and always. A theory that makes hinges immutable or context-independent fails.

  4.  **Non-Arbitrariness (Not "Up For Grabs"):**  
      *   **Case:** While "There is an external world" is groundless, you can't simply *decide* to doubt it coherently in ordinary life ("Maybe I'm a Boltzmann Brain? Okay, now where did I leave my keys?"). Attempts feel nonsensical or idle.  
      *   **Requirement:** Within their context, hinges are *compelling*. They aren't chosen like opinions; they are inherited, embodied, or forced upon us by our form of life/world-picture. A theory that makes hinges purely voluntary commitments fails.

  ### Contested Desiderata (Camp Preferences)
  5.  **Nature of Hinge Attitude:**  
      *   **Consideration:** Is our relation to hinges a *belief* (but a special kind), a *rule* for judging, a non-propositional *animal certainty*, or something else? The debate you're tired of!  
      *   **Status:** Preference. Views differ: Belief-like views stress psychological reality; rule-like views stress normative function; animal certainty views stress pre-linguistic foundation.

  6.  **Moorean Paradox Immunity:**  
      *   **Case:** Saying "I believe it's raining but it isn't" is paradoxical. But saying "I believe the world existed 5 minutes ago, but it might not have" feels different – less paradoxical, perhaps pathological or nonsensical.  
      *   **Status:** Preference. Some camps (e.g., Wright) think hinges *can* be believed without Moorean paradox; others (e.g., Moyal-Sharrock) argue hinge "certainty" is pre-doxastic, making belief incoherent.

  7.  **Rational Revisability:**  
      *   **Case:** Newtonian physics' core assumptions were hinges, later replaced by Einsteinian hinges. Was this rational revision based on evidence/implication? Or was it a paradigm shift where old hinges become *meaningless* within the new framework?  
      *   **Status:** Preference. Some see hinge revision as non-rational ("world-picture" change); others see it as slow, rational erosion at the edges leading to collapse.

  8.  **Universality vs. Locality:**  
      *   **Case:** Two people disagree: One hinges on "Science reveals truth," the other on "Scripture reveals truth." Can they genuinely engage on evidence for a specific claim (e.g., evolution)? Or are their hinges so different they talk past each other?  
      *   **Status:** Preference. Are there *any* universal hinges (e.g., logical principles)? Or are all hinges local to communities/forms of life? Views range from minimal universalism to radical relativism.

  ### Key Tensions (Hard to Satisfy Jointly)
  *   **Groundlessness (1) vs. Rational Revisability (7):** If hinges are truly groundless, *how* can they be rationally revised? Revision implies reasons/evidence, which hinges supposedly make possible. Theories struggle to explain revision without smuggling in justification for the old hinge or making the new hinge seem groundless *from the start*.
  *   **Functional Role (2) vs. Belief Attitude (5):** If hinges function as rules enabling justification, how can they *also* be beliefs? Beliefs are typically *within* the space of reasons, justifying and being justified. Making hinges beliefs risks collapsing their unique enabling role.

  ### The Biggest Dealbreaker
  *   **Requirement #1: Groundlessness.** This is the single requirement that rules out the most existing views, *especially* those that try to assimilate hinges to ordinary beliefs or justifiable propositions. If a theory allows hinges to be justified (even "default" or "entitled" justification), it fundamentally misunderstands Wittgenstein's core insight about Moore's failure and the nature of the "river-bed." Views that make hinges *rules* or *animal certainties* often fare better on this point than *belief*-based views.

  **Your Scorecard:** When reading a paper, ask:
  1.  Does it preserve Hinge Groundlessness (or try to justify them)?
  2.  Does it explain their Functional Role in enabling justification?
  3.  Does it handle Context-Relativity (hinges aren't eternal)?
  4.  Does it explain why they aren't arbitrary within their context?
  Then see where it lands on the contested points (5-8) and how (if at all) it tackles the Groundlessness vs. Revisability tension. If it fails 1-4, it's likely missing the point.
