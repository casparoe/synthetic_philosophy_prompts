  For structure: First, tackle the strongest counterevidence head-on. Codon arbitrariness is a major challenge—it screams conventionality like human symbols. The ribosome/tRNA machinery acting as "interpreters" is another, especially since tRNA synthetases enforce arbitrary pairings. Synthetic biology's genome recoding is devastatingly elegant evidence: if DNA were merely causal, rewriting codons shouldn't work, but it does. These aren't just awkward; they force deflationists into contortions.

