prompt: |-
  I am a technical writer at a software company, and my team is responsible for the error messages and status alerts our users see. We review several dozen of these a week, and we repeatedly find that a message we thought was clear was read as meaningless, or as the opposite of what we intended, or was not even recognised as a message. I have been reading on my own about the idea that a message has three levels: a frame message, which announces that there is a message here at all; an outer message, which conveys how the inner message is to be decoded; and an inner message, the content itself. The idea also holds that meaning is not stored in the words alone but is spread across those levels and whatever the reader brings to them.

  Please turn this into a procedure my team can actually run on each message we draft. Give us the questions to ask, in order, with what counts as a satisfactory answer at each step before we move on. Say where the procedure should end in "rewrite the message," and where it should hand the decision to a person because the question cannot be settled mechanically. Then run the procedure on three messages: (1) a plain "Invalid input" error; (2) a status alert reading "Your data will be deleted in 30 days"; and (3) a message we are fond of, "We have made a change to your account," which some users have read as a threat. I expect the procedure to return at least one verdict we will not like, and I want you to state plainly what the procedure cannot guarantee about how a message will actually be understood. The team has no background in this theory and about fifteen minutes per message, and a senior editor signs off on anything the procedure flags. Please write your answer in British English.
reasoning: |-
  Okay, the user is a technical writer dealing with error messages and status alerts. They're facing issues where messages they thought were clear are misinterpreted. They've come across the concept of frame, outer, and inner messages and want a practical procedure for their team. 

  First, I need to unpack the three-level message theory properly. The frame message is about getting noticed - does the user even realise there's a message? The outer message provides decoding instructions - how should they interpret this? The inner message is the actual content. The key insight is that meaning isn't just in the words but in this layered interaction plus the user's context.

  The user wants a step-by-step procedure their team can run in about 15 minutes per message. It needs concrete questions, clear pass/fail criteria, and guidance on when to rewrite versus when human judgment is needed. They've also asked to test three specific examples, including one their team likes that users find threatening.

  Hmm, the constraints are important: no theory background, tight timeframe, senior editor oversight. The procedure must be actionable but not oversimplified. British English requirement noted - I'll use "colour" not "color" etc.

  For the structure, I'm thinking a three-stage process mirroring the theory: Frame Check, Outer Message Check, Inner Message Check. Each stage needs killer questions that expose failure points. 

  Stage 1 Frame: Does it scream "MESSAGE HERE!"? Fail if it blends into UI noise. Stage 2 Outer: Does it signal how to read it? Fail if tone/format mismatch content. Stage 3 Inner: Is the core meaning unambiguous? Fail if words alone don't convey intent.

  Crucially, I'll build in off-ramps: automatic rewrite triggers for objective failures (e.g., missing visual cue), but subjective interpretation questions go to human judgment (e.g., "does this sound threatening?"). 

  For the examples:
  - "Invalid input" fails frame (invisible) and outer (no decoding help). Automatic rewrite.
  - "Data deleted in 30 days" passes frame but outer/inner clash - the urgency mismatch needs human judgment.
  - "We made a change" passes frame but outer tone is ambiguous - humans must decide if "friendly" lands as intended.

  Must emphasise limitations: no procedure can guarantee interpretation across all users/contexts. We're reducing risk, not eliminating it. The "threat" example will force them to confront that their beloved message isn't bulletproof.

  Right, British English polish: "prioritise" not "prioritize", "colour" not "color". Keep explanations crisp - they're busy professionals. Senior editor sign-off positions them as the tiebreaker for gray areas. 

  Final touch: explicitly state what the procedure can't do. Their "misinterpreted as threat" example proves that perfect execution still can't control every user's reading. That honesty might sting but builds credibility.
answer: |-
  Here’s a practical, three-stage procedure for your team, based on the frame/outer/inner message framework. Aim to complete it in ≤15 minutes per message. **British English phrasing prioritised throughout.**

  ---

  ### **Procedure: Message Clarity Assessment**
  **Goal:** Ensure messages are (1) noticed, (2) correctly decoded, and (3) unambiguously understood.  
  **Tools:** Draft message + mock-up of where it appears (UI screenshot).  
  **Outcome:** "Approve," "Rewrite," or "Escalate to Senior Editor."  

  #### **STAGE 1: FRAME MESSAGE CHECK**  
  *Does the user notice this is a message?*  
  **Question 1:** Does the message visually stand out from passive UI elements (e.g., body text, labels)?  
  - *Satisfactory:* Clear visual distinction (e.g., colour, icon, border, placement in alert zone).  
  - *Fail:* Blends into background; no urgency/importance signalled. **→ REWRITE**  
  **Question 2:** Is the message triggered by a user action/system event where attention is expected?  
  - *Satisfactory:* Message appears where users expect feedback (e.g., after submitting a form).  
  - *Fail:* Appears in an unrelated context (e.g., data deletion alert in settings menu). **→ ESCALATE (context redesign needed)**  

  #### **STAGE 2: OUTER MESSAGE CHECK**  
  *Does the user know how to interpret this type of message?*  
  **Question 3:** Does the format/tone match the message category? (Error/alert/warning/confirmation)  
  - *Satisfactory:* Consistent with company conventions (e.g., errors use red icon + imperative verbs).  
  - *Fail:* Tone conflicts with intent (e.g., cheerful tone for critical alert). **→ REWRITE**  
  **Question 4:** Is the message type obvious without prior training?  
  - *Satisfactory:* User can classify it instantly (e.g., "⚠️" = warning).  
  - *Fail:* Requires niche knowledge to decode (e.g., "Info: Action failed"). **→ REWRITE**  

  #### **STAGE 3: INNER MESSAGE CHECK**  
  *Is the core meaning clear and unambiguous?*  
  **Question 5:** Would a novice user grasp the **primary action** or **consequence**?  
  - *Satisfactory:* Action/consequence is explicit (e.g., "Log in to continue").  
  - *Fail:** Vague or passive (e.g., "Process unsuccessful"). **→ REWRITE**  
  **Question 6:** Could this be misinterpreted as the **opposite** of its intent?  
  - *Satisfactory:* No plausible harmful misreadings.  
  - *Fail:* Language is ambiguous (e.g., "Verified" could mean approved or flagged). **→ REWRITE**  
  **Question 7:** Does it assume knowledge users won’t have?  
  - *Satisfactory:* Uses plain language; avoids jargon/internal terms.  
  - *Fail:* References technical concepts (e.g., "Schema validation failed"). **→ REWRITE**  
  **Question 8:** Is the tone appropriate for *all* emotional states?  
  - *Satisfactory:* Test with angry/confused/rushed user mental models.  
  - *Fail:* Tone risks antagonising (e.g., accusatory phrasing). **→ ESCALATE (subjective judgment needed)**  

  **Final Decision:**  
  - Pass all → **APPROVE**  
  - Fail any Q1-Q7 → **REWRITE**  
  - Fail Q8 → **ESCALATE** to Senior Editor (tone/context is non-mechanical)  

  ---

  ### **Limitations of This Procedure**  
  **No guarantee of universal understanding.** Meaning is co-created by:  
  - The user’s stress level, cultural background, or past experiences.  
  - Platform constraints (e.g., truncation on mobile).  
  - External factors (e.g., receiving "We made a change" after a security breach).  

  ---

  ### **Test Cases**  
  #### **1. "Invalid input" (Error)**  
  - **Frame Check:**  
    - Q1: Often appears as plain text near a field → rarely stands out. **FAIL → REWRITE**  
    - Q2: Triggered post-input → passes.  
  - *Verdict:* **REWRITE.** Add icon 🛑, colour, and placement near action button.  

  #### **2. "Your data will be deleted in 30 days." (Status Alert)**  
  - **Frame Check:**  
    - Q1: Likely in notifications hub → may lack urgency. **FAIL → REWRITE** (Use "⚠️" + yellow).  
    - Q2: Triggered by policy → passes.  
  - **Outer Check:**  
    - Q3: "Will be" is neutral, but deletion is critical → tone mismatch. **FAIL → REWRITE** (Use "Action required: Your data will be deleted...").  
  - *Verdict:* **REWRITE** for frame + outer clarity.  

  #### **3. "We have made a change to your account." (Status Alert)**  
  - **Frame Check:**  
    - Q1: Likely email/notification → passes if branded.  
    - Q2: Triggered post-change → passes.  
  - **Outer Check:**  
    - Q3: Phrasing is neutral → passes.  
  - **Inner Check:**  
    - Q6: "Made a change" could imply unauthorised action → **FAIL → ESCALATE** (Subjective risk).  
    - Q8: Users under threat may read malice → **FAIL → ESCALATE**.  
  - *Verdict:* **ESCALATE** to Senior Editor. Suggested rewrite: "We’ve updated your account settings [link]. No action needed."  

  ---

  ### **Key Outcome**  
  Your team’s favoured message (#3) is flagged for escalation due to **tone risk under stress** – confirming your suspicion. This procedure catches objective flaws (rewrite) but delegates *emotional/cultural nuance* to human judgment (escalate). Senior Editors become arbiters of "what could feel threatening," ensuring psychological safety isn’t automated away.
