answer: |-
  ### Quiz: Which Position on Logical Uncertainty Do You Actually Hold?

  **Instructions:** For each question, select the answer that best reflects your view. There are no trick questions; we're interested in your intuitive responses. At the end, tally your answers using the scoring key to discover your position.

  ---

  #### Question 1: Goldbach’s Conjecture  
  A mathematician states they have 0.7 credence that Goldbach’s Conjecture ("Every even integer >2 is the sum of two primes") is true. How do you interpret this?  
  - **A.** This is reasonable: it represents genuine uncertainty about an unproven mathematical fact.  
  - **B.** This is a category error: mathematical statements are either true or false; degrees of belief don’t apply.  
  - **C.** This is a non-ideal approximation: ideally they’d know the truth value, but 0.7 reflects practical limitations.  

  #### Question 2: The Long Deduction Bet  
  A mathematician is about to attempt a purely deductive proof of statement **S** from known axioms. You buy a bet for $0.60 that pays $1 if **S** is true. After the proof succeeds, how do you view your purchase?  
  - **A.** At purchase, **S**’s probability was <1; after proof, it’s 1. The bet was rational given initial uncertainty.  
  - **B.** **S** was always true, so the probability was 1 all along. You were simply ignorant of this.  
  - **C.** The uncertainty was never about **S** itself, but about the mathematician’s ability to complete the proof.  
  - **D.** **S** was always true or false, so the outcome was predetermined, but betting was rational given limited knowledge.  

  #### Question 3: P vs NP Announcement  
  A renowned mathematician claims to have proven P ≠ NP, but the proof is unverified. How does this affect your view?  
  - **A.** I increase my credence in P ≠ NP (not to 1) because unverified proofs are evidence.  
  - **B.** I don’t assign credences to P = NP; I’ll wait for verification.  
  - **C.** I increase my credence sharply (e.g., to 0.99) due to the mathematician’s reputation, not the proof’s content.  
  - **D.** The truth is fixed; my credence only changes after verification.  

  #### Question 4: Chaotic System Prediction  
  A double pendulum’s state at time *T* is fully determined by precise initial conditions and physics, but prediction is computationally intractable. What is your uncertainty?  
  - **A.** Uncertainty is empirical: it arises from measurement limits and computational constraints.  
  - **B.** Uncertainty is logical: the state is a mathematical consequence of the laws, so it’s about deducing this fact.  
  - **C.** The state is determined, so there’s no "uncertainty"—just ignorance. No probabilities apply.  

  #### Question 5: Halting Program  
  A program has run for 10 years (without halting) to check a conjecture. Assuming the computer runs perfectly, what is your degree of belief that it halts?  
  - **A.** I assign a probability based on runtime, the conjecture, and heuristic evidence.  
  - **B.** I don’t assign a probability: it will halt or not, determined by its code—I just don’t know.  
  - **C.** An ideal agent would know, so I assign a probability as a non-ideal approximation.  

  #### Question 6: Encrypted Integer  
  Let *N* be a 1000-digit integer encrypted with a short password. With no password access, what is the probability *N* is even?  
  - **A.** Exactly 0.5 by symmetry (even/odd are equally likely for random large integers).  
  - **B.** Not 0.5: *N* is fixed by a short program, so probabilities depend on algorithmic properties.  
  - **C.** I don’t assign probabilities—*N* is fixed, and I lack information.  

  #### Question 7: Betting Sequence  
  For a program that halts with output 0 or 1, you’re willing to pay $0.60 for a "$1 if output=1" bet on Day 1. On Day 2 (no new info), you’re willing to pay $0.60 for a "$1 if output=0" bet. You buy both. What happens?  
  - **A.** I have a sure loss ($0.20), but belief changes are acceptable.  
  - **B.** I have a sure loss ($0.20), indicating flawed belief updating.  
  - **C.** I avoid this: beliefs shouldn’t shift without new information.  
  - **D.** No sure loss: the program might output both (but it can’t).  

  #### Question 8: Prime Probability  
  When assigning probability to "The 1000th digit of π is 7," what matters most?  
  - **A.** Symmetry: each digit 0–9 has equal probability (0.1).  
  - **B.** Algorithmic simplicity: the digit is determined, so probability reflects compression/prior weight.  
  - **C.** Empirical patterns: e.g., digit distributions in computed π digits.  
  - **D.** I don’t assign probabilities to determined facts.  

  ---

  ### Scoring Key  
  Tally your answers and find the position with the most matches. Ties indicate intermediate/ambiguous views.  

  | Position                                                                                                | Likely Answer Pattern                                  |  
  |---------------------------------------------------------------------------------------------------------|--------------------------------------------------------|  
  | **1. Logical-omniscience idealization**                                                                 | 1C, 2B, 3D, 5C, 7C, 8D                                 |  
  | **2. Subjective Bayesianism with computational constraints**                                            | 1A, 2A, 3A, 5A, 7A, 8C                                 |  
  | **3. Objective Bayesianism / logical probability**                                                      | 1A, 2A, 3A, 5A, 6A, 8A                                 |  
  | **4. Algorithmic probability**                                                                          | 1A, 2A, 3A, 5A, 6B, 8B                                 |  
  | **5. Logical induction**                                                                                | 1A, 2A, 3A, 5A, 7B, 8C                                 |  
  | **6. No-probabilities-over-logic**                                                                      | 1B, 2D, 3B, 4C, 5B, 6C, 8D                             |  
  | **7. Logical uncertainty as ordinary empirical/computational uncertainty**                              | 1A, 2C, 3C, 4A, 5A, 8C                                 |  

  ### Diagnostic Notes  
  1. **Ambiguous Separations**:  
     - **Logical Induction vs. Algorithmic Probability**: The quiz may not cleanly separate these (e.g., both support probabilities for open conjectures). They are complementary: algorithmic probability defines a prior; logical induction describes a learning process.  
     - **Objective Bayesianism vs. Logical Omniscience**: Both might reject bets on determined facts (Q2, Q8), but logical omniscience treats probabilities as approximations of binary truth.  
     - **Subjective Bayesianism vs. Logical Induction**: Q7 separates them (sure-loss tolerance), but both accept non-1 probabilities (Q1, Q2).  

  2. **Coherent but Undefended Positions**:  
     - Patterns like 1A, 2D, 4C, 5B, 7A, 8C (assigned probabilities only in empirical contexts) are coherent but unexplored in literature. This is unattractive to specialists, as it arbitrarily restricts probability.  

  3. **Logical Induction & Algorithmic Probability**:  
     - Not direct rivals. Algorithmic probability proposes a specific prior; logical induction describes a criterion for learning under computational constraints (compatible with many priors).  

  **Final Note**: This quiz diagnoses tendencies, not formal commitments. Real-world views often blend positions! For deeper exploration, see resources on logical induction, Solomonoff induction, and Bayesian epistemology.
