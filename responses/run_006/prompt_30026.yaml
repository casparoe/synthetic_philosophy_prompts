prompt: |-
  I'm a TA for an intro course that sits somewhere between formal epistemology and AI, and next week I have to teach one fifty-minute section on logical induction to second-year CS students. They've seen Bayesian updating and a little complexity theory, but they've never had the logical omniscience problem stated to them explicitly, and most of them think 'reasoning under uncertainty' just means not knowing what the data will turn out to be. Don't explain logical induction to me; I need a plan for how I should explain it. In particular I need: the order the pieces have to go in and what depends on what; the one runing example that should carry the whole session (I was thinking the parity of the trillionth digit of pi, but talk me out of it if theres something better, and say why not something like 'does P = NP'); the misconceptions they'll predictably form and exactly where in the sequence I should head each one off — my guesses are 'it's just Bayesian updating with more compute' and 'logical uncertainty is ordinary uncertainty in disguise', but I want the fuller map; one question I can ask in the last five minutes to check whether they actually got the difference between the logical induction criterion and a decision procedure; and what I should explicitly refuse to cover at this level and say so. Hard cap: 600 words.
reasoning: |-
  Okay, the user is a TA preparing a 50-minute lecture on logical induction for second-year CS students. The students have some background in Bayesian updating and complexity theory but haven't encountered the logical omniscience problem explicitly. The main challenge is structuring the lecture effectively within a tight time frame.

  First, I need to address the core misconceptions. The students likely confuse logical uncertainty with empirical uncertainty and think logical induction is just Bayesian updating with more computation. The parity of the trillionth digit of pi is a good example because it's a clear binary fact that's computationally infeasible to determine now. P vs NP is more complex and might distract with its open-ended nature.

  The lecture should start by contrasting empirical and logical uncertainty. Using the pi digit example makes it concrete. Then, introducing logical omniscience—Bayesian agents would assign 0.5 probability if they don't know the digit, but once computed, it jumps to 0 or 1. This highlights the problem: real agents can't compute everything instantly.

  Next, introducing logical induction as a method for assigning probabilities to logical claims over time. Emphasize that it's not just more compute but a different approach. The criterion should be explained without the math: probabilities don't allow Dutch books and converge to truth. The key is the sequence of beliefs improving, not instantaneous correctness.

  Common misconceptions: "It's just Bayesian updating." Need to clarify that Bayesian updating requires known probabilities for outcomes, which isn't the case here. Logical induction deals with unknown deductive relationships. Another pitfall is thinking logical uncertainty is empirical. Stress that the truth is fixed; uncertainty comes from limited computation.

  For the checking question, ask how a logically inducted probability for Goldbach's Conjecture would differ from a Bayesian approach. The answer should highlight that Bayesian would need predefined priors over truth values, while logical induction builds probabilities via ongoing deductions.

  Avoid covering the full algorithm, trading strategy construction, or convergence rates. Focus on the conceptual shift. Time management is crucial: spend 5 minutes on setup, 10 on logical omniscience, 10 on logical induction, 10 on the criterion, 5 on misconceptions, and 5 for Q&A plus the checking question.

  Using the pi digit example consistently helps tie everything together. P vs NP might lead to tangents about complexity classes, which isn't the focus. Keep the example simple to maintain clarity on the core concepts.
answer: |-
  Here’s a battle-tested lesson plan for 50 minutes, optimized for clarity and misconceptions. Your pi digit example is perfect (binary, intractable now, verifiable later)—P vs. NP is too open-ended and invites complexity tangents.

  **Order & Dependencies (40 min total):**
  1.  **(5 min) Setup: Two Kinds of Uncertainty**  
      *Empirical*: "Will it rain tomorrow?" (unknown future state).  
      *Logical*: "Is the trillionth digit of pi (πᵀ) even?" (fixed answer, but *we can’t compute it yet*).  
      **Key**: Distinguish "unknown data" (Bayesian) from "unproven logical fact". Use πᵀ throughout.

  2.  **(10 min) Bayesianism’s Blind Spot: Logical Omniscience**  
      Show a Bayesian updating toy example (e.g., coin flip). Contrast with πᵀ:  
      *   A "logically omniscient" Bayesian would assign P(even) = 0 or 1 instantly.  
      *   Real reasoners *can't* do this. Without evidence/data, what's their prior? (Often 0.5 by symmetry).  
      **Problem**: Bayes doesn’t model *deductive limitation*. Truth is fixed, but *proof discovery* takes time/compute.

  3.  **(10 min) Introducing Logical Uncertainty & Induction**  
      Define: "Logical uncertainty = uncertainty about *necessarily true or false* statements due to limited deduction/computation."  
      *Logical Induction (LI)*: A method for assigning *time-varying probabilities* \(P_t(\phi)\) to logical claims (like πᵀ even) as computation proceeds (t=1,2,3,...).  
      **Analogy**: Not "updating on data", but "gradually deducing consequences". \(P_t(\phi)\) reflects the state of proof search at time t.

  4.  **(10 min) The Logical Induction Criterion (LIA)**  
      Goal: Probabilities shouldn’t be "exploitable" by a clever gambler (no Dutch books).  
      *Simplified LIA*: As time t → ∞, \(P_t(\phi)\) must:  
      (a) Converge to 1 if \(\phi\) is true, 0 if false.  
      (b) Not be *systematically* mistakable *en route* (no consistent under/overconfidence).  
      **Crucial**: LI *permits* temporary inaccuracy (even arbitrage) if later corrected. It’s about *asymptotic* calibration under adversarial pressure.

  5.  **(5 min) What LI *Isn’t* (Misconception Busting)**  
      *   ❌ **"It's just Bayesian updating with more compute"**:  
          *Bayes*: Updates beliefs *given data* with known likelihoods.  
          *LI*: Assigns beliefs *while searching for proofs* (no pre-defined "data" or likelihoods).  
          **Head off here** after Step 3.  
      *   ❌ **"Logical uncertainty = empirical uncertainty"**:  
          πᵀ's truth *is fixed*; uncertainty stems from *deductive limits*, not randomness.  
          **Head off here** during Step 1/2.  
      *   ❌ **"LI is an algorithm I implement Tuesday"**: It’s a *criterion* for good belief sequences, not a *specific* algorithm. Existence proofs use trading strategies.  
          **Head off here** at Step 4.

  **Checking Question (Last 5 min):**  
  *"Suppose at time t=1000, our LI system assigns P(πᵀ is even) = 0.7. Later (t=2000), we prove it’s odd. Does this mean the LI system failed the Logical Induction Criterion? Why or why not?"*  
  **Answer**: No! The LIA allows temporary inaccuracy if beliefs *eventually* converge to the truth (0 here). Failure would be if probabilities *never* corrected or were *consistently* exploitable.

  **Explicitly Exclude:**  
  *   **Mechanics of the construction** (trading strategies, market scoring).  
  *   **Convergence rates** ("how fast?").  
  *   **Full technical LIA statement** (exploitability, affine traders).  
  *   **Comparison to other frameworks** (MIRI's logical priors, Demski's).  
  **Say**: "Today is about the *why* and *what*, not the *how*. We’re seeing a solution to logical omniscience, not building it."

  **Why this works:** The πᵀ example forces confrontation with deductive limits. The progression (Contrast → Omniscience Problem → LI Idea → Criterion → Misconceptions) builds intuition before formalism. The checking question targets the core nuance: *non*-failure via convergence.
