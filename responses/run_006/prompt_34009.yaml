prompt: |-
  I'm on my school's honor council, the student/faculty board that decides what happens to kids who get cought cheating. We meet like twice a month, we get a short report on what happened plus a written statement from the student, and then we vote on a punishment from a fixed menu: warning, zero on the assignment, grade cap for the course, suspension, expulsion. None of us have any training, we get maybe 20 minutes a case, and the faculty advisor keeps saying we need to be "consistent" but never says consistent with what.

  I know there's this whole philosophy debate between retributivism and consequentialism about punishment — retributivism says punish people because they deserve it and the punishment should fit the crime, consequentialism says punish only if it makes things better overall, by deterring people, protecting the school, rehabilitating the cheater, whatever. What I want is for you to turn that into a decision procedure we could actually run at a meeting. Give me the questions in order, what counts as a good enough answer to each, where the procedure says stop, and where it has to hand the decision to a person because it's a values call and not a facts call. Then run the procedure on two cases: (1) a junior copied three sentences from SparkNotes into a short homework essay and got flagged by a plagiarism checker, and (2) a senior paid somebody to take their AP exam for them. Be honest about where retributivism and consequentialism point in different directions, and which one the procedure actually commits us to. Also tell me what the procedure can't do, like what it will systematically get wrong.
reasoning: |-
  Okay, the user is part of their school's honor council and feels overwhelmed because they lack training and clear guidelines. They need a practical decision-making procedure based on punishment philosophies. Let me start by understanding their main concerns.

  First, they want a step-by-step process that's easy to follow during their short meetings. They mentioned two cases: a junior copying a few sentences and a senior paying for an exam proxy. The key is to balance retributivism and consequentialism, but they need clarity on consistency.

  I recall they mentioned the faculty advisor stresses consistency without defining it. So the procedure must address that gap. The user probably wants fairness across cases, avoiding arbitrary decisions. They also want transparency so students understand the outcomes.

  Breaking down the procedure into phases makes sense. Phase 1 establishes facts quickly, given the 20-minute limit. Questions here should be factual to avoid bias. Phase 2 assesses the offense's severity under retributivism. This is where harm and intent matter. For the junior, the harm is low; for the senior, it's high. That's a values call, but it structures the debate.

  Phase 3 shifts to consequentialism. Here, factors like deterrence and rehabilitation come in. The user needs to know if the student is a repeat offender or shows remorse. The senior's premeditation versus the junior's possible ignorance affects the outcome. The procedure must highlight where philosophies conflict, like in the senior's case where retributivism pushes for harsh punishment, but consequentialism might consider rehabilitation if the student is remorseful.

  The user also wants to know what the procedure can't handle. Systemically, it might overlook context like personal crises or pressure. The junior might have been overwhelmed, but the procedure doesn't capture that. Also, implicit biases could affect severity assessments. Training on bias might be necessary, but that's beyond the procedure.

  For the cases, applying the steps shows how decisions are reached. The junior gets a zero with remediation because harm is low and rehab is possible. The senior faces expulsion due to high harm and intent, though consequentialism might suggest a grade cap if rehab is feasible. But the procedure defaults to retributivism for core severity, then adjusts for consequences.

  The user's deeper need might be feeling confident in their decisions and justifying them to peers and students. They want a fair, consistent system that's defensible. The procedure provides structure, but they must recognize its limits, like needing faculty input for context or when precedents aren't clear.

  In conclusion, the procedure offers a roadmap, but the council must stay vigilant about biases and unique circumstances. Highlighting where philosophies diverge helps them understand the reasoning, making their process more transparent and consistent.
answer: |-
  Here's a structured decision procedure integrating retributivism and consequentialism, designed for speed and consistency in your honor council meetings. The core principle is: **First, assess the inherent wrong (retributivism) to establish a baseline severity. Then, consider consequences to adjust within that severity band.** It defaults to retributivism for the core "desert" but uses consequentialism for mitigation/aggravation within bands.

  **The Honor Council Decision Procedure**

  **Phase 1: Establish Facts & Intent (5 Minutes - Factual)**
  1.  **Question:** "What specific academic rule(s) were violated? Cite the handbook section."
      *   *Good Enough:* Clear identification of the violated rule(s) from the report/statement.
      *   *Stop if:* Ambiguity remains after report/statement review. *Hand to Person:* Council vote on most likely violation based on evidence.
  2.  **Question:** "What is the *uncontested factual description* of the act? (What happened, when, what was submitted/gained, how detected?)"
      *   *Good Enough:* Clear timeline of actions based on report/evidence. Avoid motive speculation here.
      *   *Stop if:* Key facts are disputed but unresolvable with current evidence. *Hand to Person:* Council vote on which factual version to proceed with (usually the report unless student evidence is compellingly contradictory).
  3.  **Question:** "Based solely on the *act itself* and the *student's own statement*, what was the *primary intent*? (Choose one: Accidental/Unknowing; Negligent/Careless; Reckless/Knowing but Unplanned; Deliberate/Premeditated; Sophisticated/Deceptive)"
      *   *Good Enough:* Consensus categorization based on the nature of the act and the student's admission/explanation. Ignore claims of "pressure" or "didn't think" unless it directly explains *why* they didn't know it was wrong or were careless.
      *   *Hand to Person:* Council vote if intent is unclear or contested. Default to the more severe category if evidence suggests deception.

  **Phase 2: Assess Inherent Wrong & Baseline Severity (Retributivism Focus - 5 Minutes - Values Call)**
  4.  **Question:** "Considering the **nature of the act** (e.g., copying vs. contract cheating), the **academic context** (e.g., homework vs. high-stakes exam), and the **intent** (from Step 3), how severe is the *inherent violation of academic integrity*? (Scale: Minor / Moderate / Major / Severe)"
      *   *Good Enough:* Consensus categorization based on shared understanding of the school's values regarding academic honesty. *This is the core retributive judgment.* Focus on the act's *character*.
      *   *Hand to Person:* Council vote. **This is the most critical values call.** *Factors:* Copying 3 sentences (Minor/Moderate) vs. Paying for an exam (Severe). Homework (lower weight) vs. Major Assessment (higher weight). Unknowing (lower) vs. Premeditated (higher).
      *   *Output:* Establishes a **Baseline Severity Band** tied to punishment options:
          *   Minor: Warning or Zero on Assignment
          *   Moderate: Zero on Assignment or Grade Cap
          *   Major: Grade Cap or Suspension
          *   Severe: Suspension or Expulsion

  **Phase 3: Consider Consequences & Adjust within Band (Consequentialism Focus - 8 Minutes - Factual/Values Mix)**
  5.  **Question:** "Is there **evidence this is a repeated offense**? (Check records if available in report)."
      *   *Good Enough:* Confirmed prior violation(s) noted in report or known to council. Ignore rumors.
      *   *Impact:* Strong aggravator. Move *towards the harsher end* of the Baseline Severity Band. Repeat Severe offense may push towards Expulsion.
  6.  **Question:** "Based on the student's statement and demeanor (if present), is there credible **evidence of remorse, understanding of the harm caused, and a willingness to learn/change**?"
      *   *Good Enough:* Statement expresses genuine regret, acknowledges wrongdoing (beyond just being caught), and suggests a desire to avoid future violations. Denial/blaming shifts focus elsewhere is a negative indicator.
      *   *Impact:* Significant mitigator. Move *towards the lenient end* of the Baseline Band. Lack of remorse is an aggravator.
  7.  **Question:** "Considering the **nature of this specific act**, how likely is a *lesser/harsher punishment* within the band to meaningfully: (a) **Deter** this student specifically? (b) **Deter** other students generally? (c) **Protect** the school's academic standards/reputation? (d) Allow for **Rehabilitation/Education** of the student?"
      *   *Good Enough:* Brief discussion focusing on the *most salient* consequence for this case. (e.g., Deterrence is key for widespread cheating methods; Rehabilitation is key for a first-time offender showing remorse; Protection is paramount for egregious fraud).
      *   *Hand to Person:* Council judgment call on weighting these factors. *This is the core consequentialist step.*
      *   *Impact:* Adjust within the Baseline Band. E.g., for a Severe act (Band: Suspension/Expulsion), strong deterrence/protection arguments push towards Expulsion; strong rehabilitation arguments combined with mitigating factors might push towards Suspension + conditions.

  **Phase 4: Determine Specific Sanction & Vote (2 Minutes)**
  8.  **Question:** "Based on the **Baseline Severity Band** (Phase 2) and the **adjustments** from consequences (Phase 3), which specific sanction is most appropriate?"
      *   *Process:* Review the options within the agreed Band. Discuss any mandatory minimums (if school policy has them) or typical precedents (if known). Vote on the specific sanction.
  9.  **Mandatory Consideration:** "Does the sanction **include an educational/rehabilitative component** (e.g., mandatory tutorial on academic integrity, research project on ethics, counseling referral) where appropriate (especially for Minor/Moderate or first-time Major offenses)?"
      *   *Good Enough:* Added as a condition to the primary sanction if deemed beneficial for rehabilitation/consequences.

  **Applying the Procedure to Cases**

  **Case 1: Junior - Copied 3 Sentences from SparkNotes (Homework Essay)**

  1.  **Violation:** Plagiarism (Handbook Sect. X.Y).
  2.  **Facts:** Copied 3 sentences verbatim into a short homework essay. Detected by plagiarism checker. Student admits copying.
  3.  **Intent:** Likely **Negligent/Careless** (Knew it was wrong but didn't think it mattered much/didn't bother to paraphrase/cite properly for homework). Not deliberate fraud.
  4.  **Baseline Severity (Retributivism):** **Minor** (Low-stakes assignment, small amount copied, negligent not deliberate intent). *Band: Warning or Zero on Assignment.*
  5.  **Repeat Offense?** Assume first offense (no mention).
  6.  **Remorse/Rehab Potential:** Statement likely expresses regret/shock ("I didn't realize it was that serious for homework"). Shows potential for learning.
  7.  **Consequences:**
      *   *Deter (Student):* Warning likely sufficient to scare straight. Zero also sends message.
      *   *Deter (Others):* Minor case, less visible. Moderate deterrence needed.
      *   *Protect Standards:* Minimal direct harm, but plagiarism is corrosive. Needs clear response.
      *   *Rehab:* High potential. Student seems teachable.
      *   *Consequentialist Lean:* Supports lower end (Warning) or mid-point (Zero) with education. Rehabilitation is strong.
  8.  **Conflict:** Minimal. Retributivism (Minor) aligns with Consequentialism (focus on rehab/deterrence without crushing punishment).
  9.  **Sanction:** **Zero on the Assignment** + **Mandatory completion of an academic integrity tutorial.** (Fits Band, consequentialism supports rehab message, retributivism sees proportional punishment for a Minor violation). *Not a Grade Cap/Suspension (too harsh for baseline).*

  **Case 2: Senior - Paid Someone to Take AP Exam**

  1.  **Violation:** Contract Cheating / Impersonation / Fraud (Handbook Sect. X.Z - Major Violations).
  2.  **Facts:** Arranged for, paid, and allowed another person to impersonate them during a high-stakes, externally assessed AP exam.
  3.  **Intent:** **Deliberate/Premeditated / Sophisticated/Deceptive**. Requires planning, payment, and active deception.
  4.  **Baseline Severity (Retributivism):** **Severe** (Egregious fraud, undermines core assessment, high-stakes, deliberate deception). *Band: Suspension or Expulsion.*
  5.  **Repeat Offense?** Unknown, but severity suggests even if first, it's extreme.
  6.  **Remorse/Rehab Potential:** Statement likely minimizes/blames ("Everyone does it", "Pressure was too much") or expresses regret only for being caught. Low perceived rehab potential *at this stage*.
  7.  **Consequences:**
      *   *Deter (Student):* Harsh punishment needed to prevent future fraud (if they go to college).
      *   *Deter (Others):* EXTREMELY high. Must send an unambiguous message that this is unacceptable and has catastrophic consequences.
      *   *Protect Standards:* Paramount. This directly attacks the validity of the school's grades and College Board certification. Failing to act severely damages reputation.
      *   *Rehab:* Difficult to assess quickly. Requires significant intervention. Harsh punishment might harden resentment, not foster rehab.
      *   *Consequentialist Lean:* Overwhelmingly supports the harshest end of the band (Expulsion) for Deterrence (general) and Protection. Rehabilitation arguments are weak based on typical statements/actions.
  8.  **Conflict:** **Significant.**
      *   *Retributivism:* Points firmly to **Expulsion** (Severe crime deserves severe punishment - fits the harm done).
      *   *Consequentialism (Rehab Focus):* *Might* suggest Suspension + intensive rehab program (if council believes student can truly reform). However, Consequentialism (Deterrence/Protection Focus) screams **Expulsion** to deter others and protect the school's credibility.
  9.  **Sanction:** **Expulsion.** (Fits the Severe Band. Retributivism demands it. Consequentialism (prioritizing deterrence/protection) overwhelmingly supports it. Potential rehab under suspension is outweighed and seen as insufficient response to the act's nature). *Not a Grade Cap (far too lenient for baseline severity).*

  **What the Procedure Commits To & Where Philosophies Diverge**

  *   **Core Commitment:** The procedure is **Retributivist at its foundation** (Phase 2). The "desert" based on the act, intent, and context determines the *range* of acceptable punishments.
  *   **Consequentialist Adjustment:** Within the retributivist band, consequentialist factors (deterrence, rehab, protection) are used to select the *specific point* (more lenient or more harsh).
  *   **Point of Divergence:** They diverge most sharply in **Severe cases with potential mitigating circumstances** (like Case 2). Retributivism focuses solely on the act's inherent wrongness, often demanding the harshest punishment regardless of future consequences (beyond basic desert). Consequentialism *could* argue for a less harsh punishment (like suspension + rehab) if it believes that outcome produces better *future* net benefits (e.g., a reformed student contributing positively) without significantly harming deterrence/protection. **The procedure resolves this by prioritising the retributivist baseline and allowing consequentialism to adjust only within its bounds.** In Case 2, consequentialist arguments for rehab are weak, and arguments for deterrence/protection align with retributivism, making Expulsion the clear outcome. If strong rehab potential existed, it *might* allow Suspension.

  **What the Procedure Systematically Gets Wrong (Limitations)**

  1.  **Oversimplifies Context:** 20 minutes can't capture complex personal circumstances (extreme pressure, undiagnosed learning issues, personal crisis) that *might* explain (not excuse) behavior. It risks being overly mechanistic.
  2.  **Ignores Nuances of Remorse:** Assessing "genuine remorse" from a short statement is incredibly difficult and prone to bias (does the articulate, privileged kid sound more remorseful than the inarticulate one?).
  3.  **Relies on "Typical" Deterrence:** It assumes punishments deter based on general principles, not accounting for research on what actually deters specific behaviors or student populations.
  4.  **Band Boundaries are Arbitrary:** Defining "Minor" vs. "Moderate" is inherently subjective. Two councils might band the same case differently.
  5.  **Vulnerable to Implicit Bias:** Steps involving judgment (Intent, Severity, Remorse) are vulnerable to unconscious biases (race, gender, socioeconomic status, perceived personality).
  6.  **Limited Rehabilitation Focus:** While it includes rehab as a factor and mandates educational components, the core structure (especially for severe offenses) prioritizes desert and deterrence. Deep rehabilitation often requires resources/time beyond the council's scope.
  7.  **Precedent vs. Principles:** It doesn't explicitly incorporate past council decisions ("consistency" might mean following precedent, not just philosophical consistency). This needs separate tracking.
  8.  **Ignores Systemic Factors:** Doesn't address if cheating is rampant due to systemic issues (poor teaching, insane workload, grade inflation pressure) that the school should fix.

  **Recommendations for Your Council:**

  1.  **Adopt a Version of this Procedure:** It provides the structure and consistency your advisor wants.
  2.  **Define "Severity" Bands Explicitly:** Draft brief guidelines with examples for Minor/Moderate/Major/Severe based on school values. Revise yearly.
  3.  **Track Precedents:** Keep a simple log (case type, severity band, sanction) to check consistency over time. Review periodically.
  4.  **Brief Training:** Have a 30-min session discussing the philosophy behind the procedure, the meaning of "severity," and recognizing implicit bias.
  5.  **Include Rehab Options:** Develop standard educational/rehabilitative sanctions (tutorials, projects, counseling referrals).
  6.  **Acknowledge Limits:** Understand this is a practical tool, not perfect justice. Focus on consistent application of shared principles.

  This procedure won't eliminate hard choices, but it will make your deliberations more transparent, principled, and consistent by forcing you to confront the core philosophical tensions explicitly at each step. Good luck!
