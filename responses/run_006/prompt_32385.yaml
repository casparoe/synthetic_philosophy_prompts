answer: |-
  The specific pattern you describe is most precisely called **motivated genealogical skepticism**, and while it lacks a single universally established name, this coinage captures its core mechanism and distinguishes it from adjacent concepts. Below is an analysis of its boundaries and legitimacy:

  1.  **Defining the Pattern:** Motivated genealogical skepticism occurs when an agent selectively invokes causal-origin explanations (e.g., evolutionary, cultural, psychological) to undermine the epistemic status *only* of moral intuitions they antecedently disfavor, while exempting favored intuitions from the same genealogical scrutiny, lacking a consistent, independent criterion for this differential treatment. Its boundaries are:
      *   **Core Mechanism:** The asymmetry is driven by *prior normative commitment* to the intuition's content, not by an independent epistemic assessment of the genealogy itself.
      *   **Distinguishing Features:**
          *   *Contrast with Bias Blind Spot:* While related, bias blind spot focuses on recognizing biases *in oneself vs. others*. Motivated genealogical skepticism can occur intra-personally and specifically targets the *application of genealogical explanation*.
          *   *Contrast with Global Debunking (e.g., Street):* Global debunking aims to undermine *all* intuitions from a certain source. This pattern is *local and selective*, applying debunking locally to specific disfavored intuitions while leaving a favored subset untouched.
          *   *Contrast with Principled Debunking:* It lacks the principled criterion that distinguishes when genealogy is undermining versus when it is merely explanatory (see point 3).

  2.  **Related Discussions in Literature:** Although not always named as a distinct fallacy, the pattern is frequently identified and criticized:
      *   **David Enoch:** Explicitly critiques this asymmetry in responses to evolutionary debunking arguments (e.g., in *Taking Morality Seriously*), arguing debunkers often inconsistently apply their own skeptical standards, protecting core intuitions like the badness of suffering.
      *   **Guy Kahane:** Discusses "genealogical explanations" and the conditions under which they might be undermining, implicitly highlighting the danger of selective application based on prior agreement. His work on "evolutionary debunking and vindicating" touches on the asymmetry.
      *   **"Double Standard" Critiques:** Responses to specific debunking arguments (e.g., against deontology by Greene, or against objectivism by Street) often accuse proponents of employing a double standard by not subjecting their own foundational intuitions to the same genealogical critique.
      *   **"Cherry-Picking Debunking":** This informal term is sometimes used, but "motivated genealogical skepticism" is more precise, emphasizing the *psychological motivation* and the *method* (genealogy) involved.

  3.  **Legitimacy of Selective Debunking:** Selective debunking *can* be legitimate **only if** based on an *independent epistemic criterion* distinguishing the genealogies of disfavored vs. favored intuitions. The challenge is providing such a criterion without circularity:
      *   **Illegitimate:** Selection based *solely* on prior agreement with the intuition's content. This is epistemically vicious, rendering the debunking *ad hoc* and question-begging.
      *   **Potentially Legitimate Criteria (though deeply contested):**
          *   **Reliability/Proper Function:** Showing the disfavored intuition stems from processes known to be unreliable or malfunctioning *in the relevant domain*, while the favored intuition stems from processes that track moral truth or operate reliably (e.g., Singer/Greene on emotional heuristics vs. reasoned utilitarianism). Criticized for assuming controversial metaethical claims.
          *   **Sensitivity/Insensitivity:** Arguing the disfavored intuition would persist even if the moral facts were different (suggesting it doesn't track truth), while the favored intuition is counterfactually sensitive to the moral facts. Extremely difficult to establish empirically.
          *   **Reflective Endorsement/Survival of Scrutiny:** Favored intuitions survive wide reflective equilibrium, including genealogical awareness, while disfavored ones do not. Risks protecting status quo or deeply held biases.
          *   **Consistency with Foundational Commitments:** Rejecting intuitions whose genealogy reveals inconsistency with more fundamental, independently justified moral principles (e.g., rejecting retributive intuitions if one is independently committed to consequentialism). Requires justifying the foundational principles non-circularly.

  4.  **The Principled Criterion Problem:** The core difficulty is that any proposed criterion for distinguishing "bias" from "genuine preference" risks:
      *   **Circularity:** Smuggling in substantive moral judgments (e.g., defining "reliable processes" as those producing intuitions like the badness of suffering).
      *   **Begging the Question Against Global Skepticism:** Assuring some intuitions *can* be vindicated, which the global debunker denies.
      *   **Metaethical Commitments:** Relying on contested metaethical views (e.g., moral realism, a specific account of moral perception).

  **Bottom Line:** The pattern is best termed **motivated genealogical skepticism**, characterized by the asymmetric application of debunking based on prior normative agreement, lacking a consistent independent criterion. Legitimate selective debunking requires such a criterion (e.g., reliability, sensitivity, reflective survival), but establishing one non-circularly remains a central challenge in metaethics, deeply entangled with foundational debates about moral epistemology and ontology.
