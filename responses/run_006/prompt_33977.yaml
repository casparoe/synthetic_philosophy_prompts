prompt: |-
  I teach an upper-level undergrad seminar called "Markets and Knowledge" — about 16 students, most have some econ and some philosophy, 90-minute sessions. Next week we're covering no-trade theorems (Milgrom-Stokey, the Aumann agreement stuff, etc.). The students find the result baffling: if we all have the same prior and we're all rational, then nobody should trade based on private information? That seems obviously false — people trade on information all the time!

  I want a classroom activity that makes them feel the force of the theorem, not just understand it formally. Something where they actually participate in a market with private information, and then discover through the structure of the game that their trades were irrational — or at least that the willingness to trade leaks information in a way that unravels the market.

  Here's what I'm picturing: maybe a multi-round game where they have private signals about the value of some asset, and they can make offers. But the rules should be set up so that by the last round, they realize that any offer they make reveals something to the counterparty that should make the counterparty not want to trade. Ideally the students themselves notice this before I have to point it out.

  Constraints: no real money (we can use points or something), the setup shouldnt take more than 15 minutes to explain and distribute materials, and the trading itself should be quick — maybe 20 minutes across rounds. The rest of the 90 minutes is debrief and discussion.

  In the debrief, I want to map exactly what happened in the game onto the assumptions of the theorem: common priors, common knowledge of rationality, the fact that the willingness to trade is itself a signal. And I want an honest note on what the activity can't capture — e.g., the theorem assumes perfect rationality and common knowledge in a way that no classroom game can fully enforce, so where does the analogy break down and what should I say to fill that gap?

  Also tell me what will predictably go wrong the first time I run it and how to handle it.
reasoning: |-
  We'll design a classroom activity that demonstrates the no-trade theorem. The key is to have students trade an asset with an uncertain value, where each student has a private signal about the value. The setup will use common priors and rational updating. We'll see that after the trading process, students realize that the willingness to trade reveals information that should halt trade.

  **Activity: The Common Value Asset Trading Game**

  **Objective:** Students trade an asset with a common value (same for all) but uncertain. Each student gets a private signal about the value. The goal is to show that even though they have different signals, rational traders should not trade after they account for the information revealed by the willingness to trade.

  **Setup:**
  - **Asset:** A virtual asset that pays either $100 or $0 with equal prior probability (common prior). So prior is P($100)=0.5, P($0)=0.5.
  - **Private Signals:** Each student receives a private signal about the true value. The signal is either "H" (high) or "L" (low). The signals are conditionally independent and satisfy:
    - If the true value is $100, then P(signal="H") = 2/3, P(signal="L")=1/3.
    - If the true value is $0, then P(signal="H") = 1/3, P(signal="L")=2/3.

    (Note: These probabilities are chosen so that the signal is informative but not perfect.)

  - **Roles:** Half the class (8 students) will be "Buyers" and the other half (8) "Sellers". Each seller is endowed with one unit of the asset. Each buyer is endowed with cash (say, 50 points) to buy one unit.

  **Trading Rules (Multi-round double auction):**
  We'll run two rounds of trading. In each round, any buyer can make a bid (a price at which they are willing to buy) and any seller can make an ask (a price at which they are willing to sell). We'll use a simple mechanism: 
  - Each student (buyer or seller) writes down a price on a slip of paper. 
  - The teacher collects all bids and asks and publicly announces the highest bid and the lowest ask. 
  - If the highest bid is at least the lowest ask, then a trade occurs at the midpoint between that bid and ask (or at the ask, to keep it simple) between the highest bidder and the lowest asker. 
  - Only one trade per round (to keep it manageable). 
  - After the trade, the buyer and seller who traded exit the market (they are done). The rest continue to the next round.

  But note: the goal is to have multiple rounds so that students update their beliefs based on the fact that no trade occurred in previous rounds.

  Alternatively, we can do a continuous double auction but that's too complex for 20 minutes. Let's stick to discrete rounds.

  **Revised Trading Rules for Simplicity:**
  We can do a one-sided market. For example, we focus on the sellers making asks and buyers accepting. But we want both sides to be strategic.

  Alternatively, we can do a sealed-bid double auction for one unit per round. We run as many rounds as there are units (8 rounds) but that may take too long.

  **Streamlined Trading:**
  We run only 2-3 rounds. In each round, we allow one trade. We'll have 8 potential trades (since there are 8 units) but we want to show that after a few rounds, trade stops because the information from the lack of trade updates beliefs.

  But note: the no-trade theorem says that with common priors and rational expectations, no trade should occur at all. So we want to set up a situation where in the first round, students might trade, but then they realize that the trade should not have happened because the counterparty's willingness to trade is informative.

  **Alternative Design:**
  We can use a single round but then discuss why they were willing to trade. Or we can do two rounds and see if trade happens in the second round.

  I propose:

  1. **Round 1:** 
     - Each buyer writes a bid (the maximum they are willing to pay).
     - Each seller writes an ask (the minimum they are willing to accept).
     - Collect and find the highest bid and the lowest ask. If the highest bid >= the lowest ask, then a trade occurs between the highest bidder and the lowest asker at the price = (bid+ask)/2 (or at the ask to make it simple for the seller). 
     - Record the trade and remove the pair.

  2. **Round 2:**
     - Now, the remaining students update their beliefs. They know that in the first round, some trade occurred. But more importantly, they know that the market did not clear at prices that would have been acceptable to them? Actually, we need them to realize that the fact that a trade occurred in the first round reveals that the buyer had a high signal and the seller had a low signal? Not exactly: a buyer with a high signal might be willing to pay more, and a seller with a low signal might be willing to sell for less.

     But here's the catch: if both are rational, they should anticipate that the counterparty's willingness to trade is based on their signal. So a buyer should think: "Why is the seller willing to sell at this low price? Maybe because they have a bad signal?" Similarly, the seller thinks: "Why is the buyer willing to buy at such a high price? Maybe because they have a good signal?"

     This updating might lead them to revise their valuations and hence reduce the spread in the second round.

  **How to make them see the revelation:**
  After the first trade, we ask the class: 
  - What does the fact that a trade occurred tell us? 
  - Specifically, what can we infer about the signals of the buyer and seller who traded?

  Then, for the second round, we ask the remaining students to update their beliefs about the asset value given that in the first round, a buyer with a certain bid and a seller with a certain ask traded. Then they write new bids and asks.

  We expect that the spread between bids and asks will increase in the second round (because the remaining students now have more information and realize that the first trade was between a very optimistic buyer and a very pessimistic seller, so the market is less likely to have gains from trade). But we hope that in the second round, no trade occurs.

  **Problem:** We have 8 units. We want to show that after one trade, the market freezes. But if we have 7 units left, then we have 7 buyers and 7 sellers. They might still trade because they have different signals? But the no-trade theorem says that even with one unit, if the traders are rational and have common priors, they shouldn't trade. So ideally, we want no trade in the first round? But that's hard because the students don't know the theorem.

  So we need to design the signals so that in the first round, some trade occurs, but then they realize that the trade was irrational because they didn't account for the counterparty's information.

  **Better: Use a single asset.**
  We can do with one asset and multiple rounds of bidding. But then we need to have one seller and multiple buyers (or vice versa). Let's do:

  - One asset. The true value V is either 100 or 0 with equal prior.
  - One seller (randomly chosen) who has the asset. The seller gets a private signal (H or L).
  - Multiple buyers (say 15) each get a private signal (H or L). 
  - The seller sets an ask price. Then each buyer simultaneously submits a bid. The highest bid is selected. If it is above the ask, the trade occurs at the ask (or at the highest bid? we can do at the ask to make the seller the price setter).

  But we want both sides to be strategic. Alternatively, we can have the seller and the highest bidder trade only if the bid >= ask.

  **Even Better: One asset, one buyer and one seller.**
  But then we have only two students involved. We want the whole class to participate.

  **Solution: Divide the class into several independent markets.**
  We can have 8 independent markets (each with one asset). Then we have 8 sellers and 8 buyers (each pair is independent). We run the same trading game for each pair simultaneously. But then they don't see the aggregate information? We want them to see that in the first round some trade and some don't, and then update accordingly.

  But that might be too much. Alternatively, we can have one market with one asset and multiple potential buyers and one seller. Then we run multiple rounds until the asset is sold or until no trade.

  **Revised with one seller and multiple buyers:**
  - **Setup:** 
    - One seller (chosen randomly) has the asset. The seller receives a private signal (H or L).
    - The rest (15) are buyers. Each buyer receives a private signal (H or L). 
    - The true value V is the same for all (either 100 or 0). 

  - **Trading:**
    - **Round 1:**
      - The seller sets an ask price A1 (secretly writes it down).
      - Each buyer submits a bid (secretly) - the maximum they are willing to pay.
      - The teacher collects the bids and the ask. The highest bid is revealed. If the highest bid is >= A1, then the trade occurs at A1 (or at the highest bid? Let's do at the midpoint between A1 and the highest bid? Or at the ask to make it simple for the seller). The buyer with the highest bid gets the asset and pays A1. They both exit the market (or the seller exits and the buyer becomes an owner, but they don't trade again).
      - If no bid meets the ask, no trade.

    - **Round 2:**
      - If no trade in round 1, we have the same seller and the remaining buyers (all 15, since no one exited). They update their beliefs. Why? Because the failure to trade in round 1 is informative. Specifically, the seller's ask was too high for the highest bid. So the buyers should infer that the seller might have a bad signal? And the seller should infer that the buyers don't have very high signals?
      - Then the seller sets a new ask A2, and the buyers submit new bids.

  We can run several rounds until trade occurs or until we stop.

  **How does the no-trade theorem kick in?**
  In round 1, the seller sets an ask based on their signal. A seller with an L signal might set a low ask, while one with an H signal might set a high ask. Similarly, buyers with H signals bid high, L signals bid low.

  But if the seller sets an ask that is accepted, then the buyer must have bid at least that much. The seller should think: "Why did the buyer bid so high? Maybe because they have an H signal?" And the buyer should think: "Why did the seller set such a low ask? Maybe because they have an L signal?" But after they think that, they might regret the trade? Actually, the theorem says that if they are rational and account for the information in the trade, they wouldn't agree to trade at any price.

  But in our game, they don't get to update until after the trade? That's a problem.

  **Aumann's agreement theorem style:**
  We can do a model where two students (pairwise) are given the opportunity to trade. They each have a private signal. They simultaneously announce whether they want to trade at a fixed price (say, 50). If both agree, they trade. But why would they agree? We need to set the price at 50 because the prior expected value is 50 (since P(100)=0.5 and P(0)=0.5, so E[V]=50). 

  Then, a student with signal H would update:
    P(V=100|H) = [P(H|V=100) * P(V=100)] / P(H)
    P(H) = P(H|100)*P(100) + P(H|0)*P(0) = (2/3)(1/2) + (1/3)(1/2) = 1/2
    So P(V=100|H) = (2/3 * 1/2) / (1/2) = 2/3
    So E[V|H] = (2/3)*100 + (1/3)*0 = 66.67

  Similarly, for L:
    P(V=100|L) = [P(L|V=100)*P(100)] / P(L) = (1/3 * 1/2) / (1/2) = 1/3
    E[V|L] = (1/3)*100 + (2/3)*0 = 33.33

  So a buyer with H would be willing to pay up to 66.67, and a seller with H would be willing to sell only if the price is at least 66.67. A buyer with L would be willing to pay up to 33.33, and a seller with L would be willing to sell for at least 33.33.

  Now, if we set the trade price at 50, then:
  - A buyer with H: would be happy to buy at 50 because 50 < 66.67 -> so they agree.
  - A buyer with L: 50 > 33.33 -> so they don't agree.
  - A seller with H: 50 < 66.67 -> so they don't agree (they want at least 66.67).
  - A seller with L: 50 > 33.33 -> so they agree.

  So if we have a buyer and a seller, they will trade at 50 only if:
    - The buyer has H and the seller has L.

  But then, after they agree to trade, they might think: why did the counterparty agree? 
  - The buyer (with H) thinks: the seller agreed to sell at 50, which is below the seller's reservation price if the seller had H (which is 66.67). So the seller must have L. Therefore, the buyer updates: now I know the seller has L. Then the buyer's expectation becomes:
      P(V=100 | H and seller has L) 
      = P(V=100 | H, L) 
      Since signals are independent conditional on V, we have:
      P(V=100 | H, L) = P(H,L|100)*P(100)/P(H,L) 
      = [ (2/3)*(1/3) * 1/2 ] / [ P(H,L) ]
      P(H,L) = P(H,L|100)*P(100) + P(H,L|0)*P(0) 
              = (2/3 * 1/3 * 1/2) + (1/3 * 2/3 * 1/2) 
              = (2/9 + 2/9)/2? Wait, no:
      Actually, P(H,L) = P(V=100) * P(H|100) * P(L|100) + P(V=0) * P(H|0) * P(L|0)
              = (1/2) * (2/3) * (1/3) + (1/2) * (1/3) * (2/3)
              = (1/2)*(2/9) + (1/2)*(2/9) = (1/9) + (1/9) = 2/9

      P(V=100, H, L) = (1/2)*(2/3)*(1/3) = 1/9
      So P(V=100 | H, L) = (1/9) / (2/9) = 1/2

      Therefore, E[V| H and L] = 50.

  So the buyer now values the asset at 50. But they agreed to buy at 50. So they are indifferent? And similarly, the seller (with L) now knows the buyer has H, so they update to E[V|L and H]=50, and they are selling at 50, so also indifferent.

  But they were willing to trade at 50 even after updating? So they are indifferent, so they might not trade? But we assumed they already agreed. 

  This isn't capturing the unraveling that happens when they anticipate the counterparty's signal.

  **The key is in the willingness to trade revealing information before they commit.**

  In the no-trade theorem, if both are rational and they both know that the other is rational, then they should not be willing to trade at any price. Why? Because if there was a price at which both would trade, then that trade would reveal to each that the other has information that makes the trade bad for them. 

  In our example: 
  - The seller is only willing to sell if they have L. 
  - The buyer is only willing to buy if they have H.
  - But then, when a buyer with H is paired with a seller with L, they both agree to trade at 50. But then after the trade, they update to 50 and are indifferent. 

  So they are willing to trade? But the theorem says no trade. What's the catch?

  The theorem assumes that the traders account for the information revealed by the counterparty's willingness to trade. In this case, they do update and become indifferent. So trade can occur at 50? But then it's not a no-trade result.

  This is confusing.

  **Let's read the theorem again:**
  The no-trade theorem states that if there is common knowledge of rationality and common prior, then it is common knowledge that there are no mutually beneficial trades. 

  In our case, at price 50, there is no strictly beneficial trade for either: 
  - The buyer with H initially expects 66.67, so 50 is a gain. But after learning that the seller has L, they expect 50, so no gain. 
  - Similarly for the seller.

  So they are indifferent. They might trade or might not. The theorem often says there should be no trade because there are no strictly beneficial trades? But here it's zero gain.

  But in many formulations, the theorem rules out any trade that is ex-ante strictly beneficial for both. In this case, before knowing the counterparty's signal, the trade is strictly beneficial for both (buyer expects 66.67>50, seller expects 33.33<50). But after accounting for the signal, it's not beneficial.

  The key is that rational traders should not agree to trade because they should anticipate that the counterparty's willingness to trade conveys information that eliminates the gains.

  So in the pairwise trade at 50, a buyer with H should think: "If the seller is willing to sell at 50, then the seller must have L, which means the expected value is 50, so I don't gain by buying at 50." Therefore, the buyer with H should not be willing to trade. Similarly, the seller with L should not be willing to trade because if the buyer is willing to buy, then the buyer has H, and then the expected value is 50, so selling at 50 yields no gain.

  Therefore, no trade should occur.

  **Activity Design: Pairwise Trade at Fixed Price**
  We can do the following:

  - Pair up the students into 8 pairs (each pair has a buyer and a seller).
  - Each pair is trading one asset. The true value V is the same for all pairs (either 100 or 0, with equal prior). But note: if they are all trading the same asset, then the true value is the same. But then the signals across pairs are about the same event? And they are conditionally independent? That works.

  - Each student receives a private signal (H or L) as above.
  - The trade price is fixed at 50.
  - In each pair, the buyer and seller simultaneously and secretly decide whether they want to trade at 50 (write "yes" or "no").
  - If both say "yes", then they trade. 
  - After they decide, we reveal the decisions and the signals in their pair.

  **What do we expect?**
  If the students are naive, then:
    - Buyer with H: yes
    - Buyer with L: no
    - Seller with H: no
    - Seller with L: yes
  So trade occurs only in pairs where the buyer has H and the seller has L.

  But after the activity, we discuss: 
    - If you are a buyer with H and you were paired with a seller who agreed to trade, what does that tell you about the seller's signal? (L)
    - Then, what is your updated expected value? (50)
    - So would you still want to buy at 50? (indifferent or no gain)

  And similarly for the seller.

  Then we ask: if you had known that the seller would agree only if they have L, would you have agreed to trade? The buyer with H would say: "If I know that the seller only agrees when they have L, then I know that if they agree, they have L, and then the expected value is 50, so I don't gain by trading. Therefore, I wouldn't agree in the first place."

  But then the seller with L thinks: "If I agree, then the buyer will infer I have L and then won't want to trade. But also, I only want to trade if the buyer has H. But if the buyer has H, they won't agree because they anticipate that I have L and then they won't gain. Therefore, I shouldn't agree either."

  This circularity leads to no trade.

  **How to run in class:**
  1. Explain the asset value (100 or 0, prior 0.5).
  2. Explain the signal structure (H and L, with the conditional probabilities).
  3. Give each student a signal. For simplicity, we can fix the true value for the whole class (say, we draw V once: either 100 or 0). Then generate signals accordingly. But note: if we fix V, then the signals are informative about the same V.
  4. Pair the students: 8 pairs. Each pair has one buyer and one seller.
  5. Without any discussion, each buyer and each seller writes "yes" or "no" for whether they are willing to trade at 50.
  6. Collect the decisions. For each pair, if both said "yes", then they trade.
  7. Record which pairs traded and their signals.

  Then we discuss:
  - In the pairs that traded, what were the signals? (expect: buyer H, seller L)
  - Ask the buyers in those pairs: "After knowing the seller agreed, what do you infer about the seller's signal? (L) Then what is your new expected value? (50) So would you still have wanted to trade at 50? (no gain, so they might say no)"
  - Similarly for sellers.

  Then we ask: "If you had known that the other side would only agree if they had a particular signal, would you have agreed in the first place?"

  This should lead them to see that the willingness to trade reveals information that eliminates the gains.

  **Logistics:**
  - Time: 5 minutes to explain, 2 minutes to distribute signals (we can pre-generate), 2 minutes for them to decide, 10 minutes for debrief of this round.

  But we want them to experience the updating. So maybe we do two rounds:

  **Round 1: Naive**
  - They decide without thinking about the counterparty's signal.

  **Round 2: After understanding the inference**
  - We do the same again, but now with a new set of signals and new pairs. But this time, we ask them to think: what does the other side's decision tell me?

  But they might not trade in round 2.

  Alternatively, we can do:

  **Activity Steps:**
  1. Explain the setup (5 minutes).
  2. Assign roles and signals (2 minutes).
  3. Round 1: Pair up and decide without any discussion. Collect and announce which pairs traded (5 minutes).
  4. Debrief round 1: show that trade occurred only in buyer-H and seller-L pairs. Then ask what each would have inferred if they had known the other's decision. Then ask: "Knowing what you know now, if we were to do it again, would you change your decision?" (10 minutes)
  5. Round 2: Reassign signals (or keep the same but re-pair randomly). Have them decide again. We expect less trade or no trade. (5 minutes)
  6. Discuss why trade reduced.

  **What if V is not 50?**
  We need to set the price at the prior expected value (50) for this to work.

  **Predictable problems:**
  - Students might not understand the updating: we can provide a worksheet for them to calculate posteriors.
  - In round 1, they might not trade even naively: but our calculation shows buyer-H and seller-L should want to trade naively.
  - In round 2, they might still trade because they think they might get lucky? We have to enforce that they are rational.

  **Debrief:**
  After the activity, we map to the theorem:
  - Common prior: we all started with P(V=100)=0.5.
  - Common knowledge of rationality: we assumed that everyone updates using Bayes' theorem and maximizes expected utility.
  - Willingness to trade is a signal: a buyer willing to trade must have H, a seller willing to trade must have L. But then that information, if anticipated, would prevent trade.

  **What the activity can't capture:**
  - In reality, traders might not be perfectly rational.
  - They might not update correctly.
  - The common prior might not hold (but we enforced it).
  - The common knowledge of rationality: in the first round, they didn't anticipate the information leakage, but in the second round, they might. But in real markets, traders might not immediately realize that their counterparty's actions reveal information.

  **Conclusion:**
  This pairwise fixed-price activity is simple and quick. It captures the core intuition: that the willingness to trade reveals information that eliminates the perceived gains from trade.

  **Materials:**
  - Slips of paper for signals (pre-generated for the whole class based on a randomly drawn V). 
  - Slips for decisions (yes/no).

  **Time:**
  - Explain: 5 min
  - Distribute signals: 2 min
  - Round 1: 3 min (decide) + 2 min collect and announce
  - Debrief round 1: 10 min
  - Round 2: 3 min (decide) + 2 min collect/announce
  - Final debrief: 20 min (tying to theorem, limitations)

  Total: ~47 minutes, leaving time for deeper discussion.

  **Variation for more rounds:**
  We could do a continuous double auction but it's complex. This pairwise fixed-price is manageable.

  Let me know if you have any adjustments.
answer: |-
  Here’s a structured classroom activity designed to make the no-trade theorem intuitively click for your students. The goal is to create a scenario where students trade an asset with private signals, then realize that the mere act of trading (or attempting to trade) reveals information that unravels the market. The activity uses **pairwise fixed-price trading** to simplify logistics and highlight the core intuition.

  ---

  ### **Activity: The Information Revelation Trading Game**
  **Time Allocation:**  
  - Setup: 10 minutes  
  - Trading Rounds: 20 minutes  
  - Debrief & Discussion: 60 minutes  

  **Materials Needed:**  
  - Slips of paper for private signals (pre-generated).  
  - Index cards for trading decisions ("TRADE" or "NO TRADE").  
  - Whiteboard to record trades and update beliefs.  
  - Projector/board to display key probabilities (optional).  

  #### **Step 1: Setup (10 minutes)**  
  1. **Explain the Asset & Signals:**  
     - An asset pays **$100** or **$0** with **equal prior probability** (P($100) = P($0) = 0.5).  
     - Each student receives a **private signal** (H or L) about the true value:  
       - If true value = $100: P(H) = 2/3, P(L) = 1/3.  
       - If true value = $0: P(H) = 1/3, P(L) = 2/3.  
     - Emphasize: Signals are **conditionally independent** (given the true value).  

  2. **Assign Roles and Signals:**  
     - Randomly assign **half the class (8) as BUYERS** and **half as SELLERS**.  
     - **Pre-generate signals** for all students based on a **randomly drawn true value** (e.g., draw $100 or $0 secretly, then generate signals using the probabilities above).  
       - *Tip:* Use a coin flip for the true value, then an online randomizer (or dice) to assign signals. Distribute slips face-down.  

  3. **Trading Rules:**  
     - **Fixed price = $50** (the prior expected value: 0.5 × $100 + 0.5 × $0).  
     - In each round, buyers and sellers are **randomly paired**.  
     - **Simultaneously**, each pair decides:  
       - Buyer: "Will I buy at $50?" → Writes "TRADE" or "NO TRADE".  
       - Seller: "Will I sell at $50?" → Writes "TRADE" or "NO TRADE".  
     - Trade occurs **only if both say "TRADE"**.  
     - **Run 2 rounds:**  
       - **Round 1 (Naive):** Students decide based **only on their private signal**.  
       - **Round 2 (Strategic):** Students update beliefs based on Round 1 outcomes.  

  #### **Step 2: Trading Rounds (20 minutes)**  
  - **Round 1 (5 minutes):**  
    - Pair buyers/sellers randomly (use Zoom breakout rooms or physical pairing).  
    - Students write decisions **without discussing signals**.  
    - Collect decisions. For each pair:  
      - If both say "TRADE," announce: "Trade occurred!" (record the pair’s signals).  
      - Else: "No trade!" (record signals if possible).  
    - *Expected outcome:* Trades occur only in "Buyer-H / Seller-L" pairs.  

  - **Debrief Round 1 (5 minutes):**  
    - Project the results:  
      - "Who traded? Buyers with H, Sellers with L."  
      - Ask: *"Why did Buyer-H/Seller-L trade? What did they NOT consider?"*  
        (Answer: They didn’t consider that the counterparty’s willingness to trade reveals their signal).  
    - **Update beliefs publicly:**  
      - For a Buyer-H who traded:  
        - Initially, E[Value|H] = (2/3)($100) + (1/3)($0) = $66.67 → happy to buy at $50.  
        - But if Seller agreed → Seller has L!  
        - Update: E[Value|H and Seller-L] = 0.5($100) + 0.5($0) = $50 (no gain).  
      - Similarly, Seller-L updates to E[Value] = $50 after seeing Buyer-H.  

  - **Round 2 (10 minutes):**  
    - Re-pair students randomly (new partners).  
    - Repeat the decision process, but now students **must consider**:  
      - *"If my counterparty agrees to trade, what signal must they have? How does that change my expected value?"*  
    - Collect decisions.  

  #### **Step 3: Expected Outcomes**  
  - **Round 1:** 3–5 trades (depending on signal distribution).  
  - **Round 2:** **No trades** (or 1–2 if students resist the logic).  
  - **Key realization:**  
    - Buyers realize: "If a Seller agrees to sell at $50, they must have L → but then E[Value] = $50 → no profit!"  
    - Sellers realize: "If a Buyer agrees, they must have H → E[Value] = $50 → no profit!"  
    - Trade collapses because the **willingness to trade leaks information** that eliminates perceived gains.  

  ---

  ### **Debrief & Discussion (60 minutes)**  
  **Map the Activity to the No-Trade Theorem:**  
  | **Theorem Assumption** | **How the Activity Models It** | **Limitations** |  
  |------------------------|--------------------------------|----------------|  
  | **Common Prior** | All started with P($100)=0.5. | Real-world priors may differ (e.g., biased beliefs). |  
  | **Rationality** | Students calculated expected values (naive in Round 1, strategic in Round 2). | Not all update perfectly; some may ignore signals. |  
  | **Common Knowledge of Rationality** | Round 2 forced students to model counterparty’s reasoning. | In class, not all "get" it simultaneously; real traders may not infer perfectly. |  
  | **Willingness to Trade as Signal** | Round 2 showed "TRADE" = signal (H for Buyers, L for Sellers). | Real markets have noise (e.g., liquidity traders). |  

  **Key Discussion Prompts:**  
  1. *"Why did trades occur in Round 1 but not Round 2?"*  
     - Highlight: Round 1 ignored the informational value of the trade offer itself.  
  2. *"What would happen if we added a third round?"*  
     - Stress: No trade is the only rational outcome once information leakage is anticipated.  
  3. *"How does this relate to Milgrom-Stokey?"*  
     - Explain: The theorem says common priors + rationality → no trade can occur, since any offer reveals your private info and eliminates gains.  

  **Address Limitations Honestly:**  
  - **"Where does the analogy break down?"**  
    - **Imperfect Rationality:** Students might trade in Round 2 due to confusion or risk-seeking.  
      - *Fill the gap:* "Real markets have bounded rationality, so trade occurs."  
    - **Common Knowledge Failure:** Not everyone updates beliefs identically.  
      - *Fill the gap:* "In practice, traders may not deeply model counterparty inference."  
    - **Noise Traders:** Activity assumes all trade is info-driven (unlike real markets with liquidity needs).  
      - *Fill the gap:* "No-trade theorems break when some trade for non-informational reasons."  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Problem:** Students don’t update beliefs correctly in Round 2.  
     - *Fix:* Provide a "cheat sheet" with Bayes’ rule:  
       - E[Value|Buyer-H, Seller-L] = $50.  
       - E[Value|Buyer-L, Seller-H] = $50.  

  2. **Problem:** Too few/no trades in Round 1 (e.g., if signals skew toward H/H or L/L).  
     - *Fix:* Pre-generate signals to ensure 4–5 Buyer-H and 4–5 Seller-L.  

  3. **Problem:** Students discuss signals (breaking privacy).  
     - *Fix:* Warn: "If you cheat, the game breaks! Signals must stay private."  

  4. **Problem:** Confusion over expected value calculations.  
     - *Fix:* Do a quick demo pre-activity:  
       *"If you have H, what’s E[Value]? (Answer: $66.67). If you have L? ($33.33)."*  

  ---

  ### **Why This Works**  
  - **Intuitive:** Students experience "aha!" when Round 2 trades vanish.  
  - **Low-Tech:** No software or money needed.  
  - **Theorem-Centric:** Directly maps to Milgrom-Stokey/Aumann assumptions.  
  - **Self-Discovery:** Students deduce the paradox ("My trade offer tells you too much!").  

  By the end, students will grasp why "no trade" is the only rational outcome under ideal conditions—and why real markets deviate. This sets up a rich discussion on the theorem’s implications for financial markets, prediction, and disagreement.
