prompt: |-
  In my department's reading group on social epistemology, two colleagues fell into an argument about the Condorcet jury theorem that I have not been able to referee to my satisfaction. (1) One said the theorem is useless as a justification for majority rule in real institutions, because its independence condition — that voters' errors be uncorrelated conditional on the correct alternative — is systematically violated whenever voters rely on shared sources of evidence, which is nearly always. (2) The other replied that this is like rejecting a frictionless model of motion: the theorem isolates the mechanism by which adding voters contributes information, and thereby explains why shared evidence threatens collective judgment rather than reassuring us. (3) The first answered that a model whose central condition is never satisfied cannot underwrite the practice, and that under realistic correlation the majority can be more likely wrong than right even in arbitrarily large groups, despite each voter's being individually more likely right than wrong — so the real world can invert the theorem's conclusion. (4) The second granted the last point but said this is the theorem doing its work: the result is a diagnostic, not a blanket endorsement, and a diagnostic is not refuted by the fact that the failure it predicts actually occurs. (5) The first countered that as a diagnostic it is toothless, because in practice we cannot estimate the correlation structure of voters' errors well enough to know whether a given electorate lies on the safe side of the theorem's conditions. Please adjudicate move by move: rate each move from clearly mistaken to clearly right, briefly justify each rating, state who is right about what, and identify any distinction the two are jointly missing.
reasoning: |-
  We are evaluating an argument about the Condorcet Jury Theorem (CJT). The theorem states that, under certain conditions (including that each voter is independent and has a probability p>0.5 of being correct, and that they vote truthfully), the probability that the majority vote is correct approaches 1 as the number of voters increases.

  The moves:

  (1) Colleague 1 says the theorem is useless for justifying majority rule because the independence condition (voters' errors uncorrelated conditional on the correct alternative) is systematically violated in real institutions due to shared evidence.

  (2) Colleague 2 counters by comparing it to a frictionless model: the theorem isolates the mechanism by which adding voters adds information, and explains why shared evidence (which induces correlation) is a threat.

  (3) Colleague 1 responds that a model whose central condition is never satisfied cannot underwrite the practice, and that under realistic correlation the majority can be more likely wrong than right even in large groups, even if each voter is more likely right than wrong (p>0.5). So the real world can invert the theorem's conclusion.

  (4) Colleague 2 grants the point about correlation causing problems but says the theorem serves as a diagnostic: it predicts when collective judgment fails (due to violation of independence) and that is not a refutation but the theorem doing its job.

  (5) Colleague 1 counters that as a diagnostic it is toothless because in practice we cannot estimate the correlation structure well enough to know if a given electorate meets the safe conditions.

  Now, we rate each move and justify:

  Move (1): Colleague 1 is partially right but overstates the case.
  Rating: Partly right (leaning towards correct concern but too strong on "useless")
  Justification: It is true that the independence condition is often violated in practice because voters share evidence and are influenced by common sources. This does limit the direct applicability of the theorem to justify majority rule in real institutions. However, the theorem is not "useless" because it sets a benchmark and helps understand the importance of independence. Also, there are extensions of the theorem that relax the independence condition to some extent.

  Move (2): Colleague 2 is correct in drawing an analogy to idealized models.
  Rating: Clearly right
  Justification: The point about models isolating mechanisms is well-taken. The theorem does show that without correlation, adding voters improves group accuracy. Moreover, by showing that independence is crucial, it explains why shared evidence (which breaks independence) is a problem. This is a common and valid use of theoretical models.

  Move (3): Colleague 1 is correct about the possibility of the inversion under correlation but overstates the implications.
  Rating: Mostly right (on the inversion) but the claim that the model cannot underwrite the practice is too strong.
  Justification: It is true that with positive correlation among voters, the majority can be less accurate than an individual and even worse than random in the limit (if the correlation is high enough). However, the model still provides valuable insight. Also, note that the theorem can be extended to cover some forms of dependence, and in many real-world settings, the correlation might not be so extreme. The model does not become entirely irrelevant because one condition is often violated.

  Move (4): Colleague 2 is correct about the diagnostic value.
  Rating: Clearly right
  Justification: The theorem does serve as a diagnostic: it tells us that when we observe collective failure, it may be due to violation of independence (or other conditions). The fact that the theorem's conclusion fails when the conditions are violated is not a refutation of the theorem but rather an application of its diagnostic power.

  Move (5): Colleague 1 raises a valid practical concern but may underestimate the usefulness of the diagnostic.
  Rating: Partly right (valid concern about measurement, but the diagnostic is not entirely toothless)
  Justification: It is true that in practice we often cannot precisely estimate the correlation structure. However, the theorem still provides a framework for thinking about the problem. We can use the theorem to design institutions that reduce dependence (e.g., by ensuring diverse information sources). Also, even without exact measures, we can be aware of the risks and take steps to mitigate them.

  Overall:
  - Colleague 1 is right to point out the practical challenges and the potential for the theorem's conclusion to invert under correlation.
  - Colleague 2 is right about the theoretical value of the theorem as a model and diagnostic tool.

  A distinction they might be missing:
  The discussion may be conflating two different questions:
  (a) Is the CJT a valid mathematical theorem? (Yes, and it holds under its stated conditions.)
  (b) How should we use the CJT in designing and evaluating real institutions?

  Moreover, they might be missing the active role of institutional design: the theorem can guide us to create conditions that approximate independence (e.g., by promoting diverse evidence or using deliberation to break up common errors) even if perfect independence is unattainable. Also, there is a growing literature on the CJT with dependent voters that might offer more nuanced insights.

  In summary:

  Move ratings:
  (1): Partly right (but too strong) - the condition is often violated, but that doesn't make the theorem useless.
  (2): Clearly right - the model analogy is apt.
  (3): Mostly right (on the inversion) but the conclusion that the model cannot underwrite the practice is too strong.
  (4): Clearly right - the diagnostic role is important.
  (5): Partly right (practical concern) but the diagnostic is still useful.

  Who is right about what?
  - Colleague 1 is right that the independence condition is often violated and that this can lead to the inversion of the theorem's conclusion, making direct application problematic.
  - Colleague 2 is right that the theorem is valuable as an idealized model and diagnostic tool, and that the violation of conditions does not refute the theorem but rather shows its diagnostic power.

  Distinction they are jointly missing:
  They might be missing the potential for institutional design to mitigate dependence (thus making the theorem more applicable) and the existence of extensions of the theorem that account for some forms of dependence. Also, the theorem is not only about justification but also about understanding the mechanisms of collective intelligence and its vulnerabilities.
answer: |-
  ### Adjudication of Moves

  I'll rate each move on a spectrum from **clearly mistaken** to **clearly right**, justify each rating, summarize who is right about what, and identify distinctions they may be jointly missing. The core issue is whether the Condorcet Jury Theorem (CJT) is useful for justifying/diagnosing majority rule given violations of voter independence.

  ---

  #### **(1) First Colleague's Initial Claim**  
  *"The theorem is useless for justifying majority rule because the independence condition is systematically violated due to shared evidence."*  
  - **Rating:** **Partly right, but overstated**  
  - **Justification:** The colleague correctly identifies a major limitation: shared evidence (e.g., media, education) often violates CJT's independence condition in practice. However, labeling the theorem "useless" is excessive. CJT remains foundational for understanding *why* independence matters and sets a benchmark for institutional design. It is not "useless" as a theoretical starting point, even if direct real-world application is limited.  

  #### **(2) Second Colleague's Response**  
  *"This is like rejecting a frictionless model: the theorem isolates how adding voters adds information and explains why shared evidence threatens collective judgment."*  
  - **Rating:** **Clearly right**  
  - **Justification:** The frictionless analogy is apt. CJT is an idealization that isolates a mechanism (aggregating independent signals improves accuracy) and explains real-world phenomena (e.g., why echo chambers harm collective intelligence). This move correctly frames CJT as a diagnostic tool, not merely a justification.  

  #### **(3) First Colleague's Rebuttal**  
  *"The model’s central condition is never satisfied, so it cannot underwrite practice; under correlation, majorities can be wrong even in large groups, inverting the theorem."*  
  - **Rating:** **Mostly right**  
  - **Justification:** The colleague is correct that:  
    - Independence violations are pervasive.  
    - With correlated errors, majorities can be *less* accurate than individuals (e.g., if correlation is high, the group error rate may not vanish and can exceed 50% even for large n).  
    This inversion is a known result in social choice theory (e.g., work by Ladha or Dietrich). However, claiming the model "cannot underwrite practice" overlooks its value as a heuristic or benchmark.  

  #### **(4) Second Colleague's Defense**  
  *"The theorem is a diagnostic: it predicts failure when independence fails, and this doesn’t refute it but shows it working as a diagnostic."*  
  - **Rating:** **Clearly right**  
  - **Justification:** This is a strong point. CJT’s fragility under correlation is a *feature*, not a bug. It diagnoses why collective intelligence fails (e.g., in polarized groups) and guides institutional fixes (e.g., diversifying information sources). A diagnostic isn’t invalidated when it correctly identifies pathologies.  

  #### **(5) First Colleague's Final Counter**  
  *"As a diagnostic, it’s toothless because we cannot estimate error correlation well enough to apply it."*  
  - **Rating:** **Partly right, but incomplete**  
  - **Justification:** The practical challenge of measuring correlation is valid and often insurmountable (e.g., in large elections). However, this doesn’t render CJT "toothless." We can:  
    - Use proxies for independence (e.g., voter diversity metrics).  
    - Apply qualitative insights (e.g., CJT warns against over-reliance on shared evidence).  
    CJT remains a conceptual tool even without precise correlation estimates.  

  ---

  ### Who is Right About What?  
  - **First Colleague** is right that:  
    - Independence violations are ubiquitous and can invert CJT’s conclusion (majority wrong despite competent voters).  
    - Real-world correlation makes direct CJT justification for majority rule untenable.  
    - Practical limitations hinder CJT’s use as a precise diagnostic.  
  - **Second Colleague** is right that:  
    - CJT is valuable as an idealized model (like frictionless physics) that isolates mechanisms.  
    - It functions as a diagnostic by explaining why collective judgment fails under correlation.  
    - Its predictive failures under violated conditions are part of its utility, not a refutation.  

  ### Distinction Jointly Missing  
  Both colleagues overlook a key distinction: **CJT as a *mechanistic* model vs. a *prescriptive* tool.**  
  - **Mechanistic role:** CJT explains *how* aggregation amplifies accuracy under independence and *why* correlation disrupts this. This is invaluable for theory-building, even if conditions are imperfectly met.  
  - **Prescriptive role:** CJT cannot directly justify majority rule in practice but *can* inform institutional design (e.g., promoting diverse information to approximate independence). Treating it solely as a justification or solely as a brittle diagnostic misses this middle ground.  

  ### Conclusion  
  **Second colleague "wins" the argument** by better capturing CJT’s role as a conceptual diagnostic. However, the first colleague’s concerns about real-world limitations are valid and highlight why CJT alone cannot justify majority rule. The debate conflates the theorem’s *theoretical* value with its *practical* applicability—a distinction central to social epistemology. CJT is not "useless," but its real-world power lies in framing problems (e.g., combating correlation) rather than rubber-stamping majority decisions.
