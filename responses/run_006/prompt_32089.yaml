prompt: |-
  Just got back from a three-hour argument with my friend about IQ and education policy. Every time I pointed out that IQ is highly heritable — the usual 0.6 to 0.8 in adults — and that this probably means some performance gaps are gonna be hard to close with schooling interventions alone, she'd fire back "heritability is not destiny" and act like that settled it. I get she's trying to say something important but I honestly can't tell what exact claim she's making. Is she saying the heritability numbers are wrong? That high heritability is perfectly compatable with big environmental effects? That within-group heritability says nothing about between-group differences? That even if something's heritable you can still change it through environmental means? Something else entirely? Can you pull that slogan apart into the distinct precise claims someone might actually mean by it — from the trivially true to the actually false — and tell me which ones genuinely support her side of the argument and which ones are just rhetorical moves that don't engage my point?
