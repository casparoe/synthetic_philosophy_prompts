  Next, I need to consider the distinctions a theory must respect. Self-deception isn't the same as wishful thinking, akrasia, simple false belief, hypocrisy, or lying to others while half-believing it. The theory must clarify these boundaries without collapsing important differences.

  Then there's the normative aspect - whether self-deception is blameworthy or serves as an excuse, and whether this varies case by case. Some might see it as a moral failing while others view it as a psychological coping mechanism.

  Regarding process versus structure, I wonder if a theory must explain how people enter self-deception or if it can simply describe the state itself. Both approaches have merits, but each imposes different constraints.

  I should also think about whether the phenomenon is unified - are all cases of self-deception fundamentally similar, or are there different types requiring different explanations? This affects how we evaluate theories.

  The user wants me to flag any desiderata that might conflict. The big tension I see is between avoiding contradiction (requiring no simultaneous belief in p and not-p) and capturing the dynamic conflict people experience in self-deception. Many theories struggle here.

