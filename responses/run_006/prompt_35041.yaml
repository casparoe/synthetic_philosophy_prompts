prompt: |-
  I sit on my university's Academic Integrity Committee. We are revising how we handle undergraduate cheating. One proposal would replace most punitive hearings with a required program in academic character: workshops, reflective writing, and mentorship aimed at cultivating virtues such as intellectual honesty. A second faction, drawing on the situationist critique of virtue ethics, argues that conduct is far more responsive to local situational pressures — deadlines, grade distributions, proctoring, peer norms — than to stable character traits, and that character built in a classroom will not transfer to the situations where students actually cheat. They want the same funds spent on situational redesign: assessment formats that are harder to cheat on, restructured deadlines, and changes to grading practices. Please draft the short decision memo I will circulate before next month's meeting. It should recommend a concrete policy — the character program, the situational redesign, or a specified hybrid — with an implementation time frame, and it should engage seriously with the strongest consideration on the losing side. End with a line beginning "Verdict:" stating your bottom-line recommendation in one short phrase.
reasoning: |-
  Okay, the user is on an Academic Integrity Committee revising how to handle undergraduate cheating. They need a decision memo before next month's meeting. Two proposals: one focused on building academic character through workshops and mentorship, the other on situational redesign like changing assessment formats. The user specifically wants a concrete policy recommendation with a timeframe and serious engagement with the losing side's strongest argument. The memo must end with a "Verdict:" line.

  Hmm, this is a classic ethics-in-practice dilemma. The user's position suggests they're likely a faculty member or administrator who needs to bridge philosophical divides. The deeper need here isn't just policy recommendation - it's about fostering genuine cultural change while maintaining institutional credibility. The unspoken tension is between idealism (shaping better scholars) and pragmatism (preventing concrete misconduct). 

  The virtue ethics approach has intuitive appeal in academia - we want students to internalize integrity. But the situationist critique from psychology is robust: Darley & Batson's Good Samaritan study, Zimbardo's prison experiment, even modern behavioral economics show how easily context overrides character. If we go pure character program, we risk creating "workshop saints" who still cheat during finals week. 

  Conversely, pure situational redesign feels...cynical? Like admitting education can't cultivate integrity. And it might ignore cases where cheating happens outside controlled environments (take-home essays, group work). 

  The hybrid model seems most defensible. Start with situational fixes for immediate harm reduction (addressing the "fire alarm" aspect), then layer character-building as the new normal. Implementation timeline should be aggressive but realistic - situational changes can roll out in one semester, character programs need pilot testing. 

  Biggest concession to situationists: acknowledge that workshops alone won't stop cheating during high-stress moments. Hence prioritizing exam redesign before launching reflection seminars. But push back gently - if we treat students as purely situational creatures, we abandon education's formative purpose. 

  Final verdict needs to be punchy. "Hybrid implementation with situational priority" captures the sequencing. Adding "ethical ecosystem" nods to the bigger vision without overpromising. 

  Better include budget neutrality explicitly since both factions want "same funds." And maybe flag assessment metrics - if we don't track cheating rates pre/post, this debate will resurfaces in 3 years.
answer: |-
  ## MEMORANDUM  
  **TO:** Academic Integrity Committee Members  
  **FROM:** [Your Name/Position], AI Committee Chair  
  **DATE:** October 26, 2023  
  **SUBJECT:** Policy Recommendation: Undergraduate Academic Integrity Reform  

  After thorough review of the proposals to reform our undergraduate academic integrity process, including the compelling arguments for both a character development program and a situational redesign approach, the Steering Subcommittee recommends a **hybrid implementation prioritizing initial situational redesign with phased integration of the character program, commencing January 2024 (Spring Semester) with full rollout by Fall 2024.**

  **Rationale & Recommendation:**  
  Both proposals offer valuable insights grounded in legitimate ethical and psychological perspectives. The character program proposal rightly emphasizes the university's educational mission to cultivate not just knowledge but intellectual virtues. Conversely, the situational redesign proposal powerfully highlights empirical evidence that behavior is profoundly influenced by immediate context, and that character traits alone are unreliable predictors of conduct under pressure, especially when transfer of learning to high-stakes, unsupervised situations is uncertain.

  The strongest consideration from the "situational critique" cannot be dismissed: Building character in a workshop setting does not guarantee it will manifest during a 3 AM deadline crunch, a high-stakes exam, or when peer pressure is intense. Relying solely on character development risks being ineffective in precisely the moments where integrity is most vulnerable. Therefore, **our primary initial focus must be on reducing the opportunity and temptation to cheat through concrete situational changes.**

  However, abandoning the character component entirely neglects our role in fostering students' long-term ethical development and fails to address the root causes *beyond* immediate pressure. A purely situational approach might manage behavior but does not necessarily build understanding or internal commitment.

  **Therefore, we recommend a two-phase hybrid approach:**

  1.  **Phase 1: Situational Redesign & Infrastructure (Spring 2024 - Summer 2024):**
      *   **Immediate Action (Spring '24):** Allocate 70% of the designated funds for this phase to:
          *   **Assessment Reform:** Establish a faculty working group to pilot and promote diverse, inherently cheat-resistant assessment methods (e.g., scaffolded assignments, open-ended problems, oral defenses, personalized projects, in-class writing). Resources for faculty training and development provided.
          *   **Policy & Process Adjustments:** Review and revise deadlines policies to reduce clustering, pilot revised grading practices (e.g., increased weight on process/drafts, pass/fail options for low-stakes work), and enhance clarity on collaboration norms across departments.
          *   **Proctoring & Detection:** Invest in cost-effective, scalable integrity tools (e.g., plagiarism detection software licenses, training for TAs on identifying contract cheating) where appropriate, emphasizing prevention over surveillance.
      *   **Goal:** Create environments where cheating is significantly harder and less immediately tempting, addressing the most pressing behavioral drivers identified by the situationist critique.

  2.  **Phase 2: Integration of Character Development Program (Fall 2024):**
      *   **Program Launch (Fall '24):** Allocate the remaining 30% (plus funds from Year 2 budget) to develop and implement the Academic Character Program, *informed by the situational changes*.
      *   **Program Structure:** Mandatory for *first-time*, non-egregious offenders (replacing punitive hearings in these cases), with optional workshops/open sessions for all students. Combines:
          *   **Targeted Workshops:** Focused *specifically* on recognizing and navigating the high-pressure situations identified in Phase 1 (e.g., "Managing Deadline Stress Ethically," "Collaboration vs. Collusion in [Specific Discipline]," "Understanding the 'Why' Behind Citation").
          *   **Reflective Practice:** Structured writing prompts tied directly to the student's own situational lapse and strategies discussed in workshops.
          *   **Mentorship:** Short-term pairing with faculty/advanced peers focused on applying ethical reasoning and strategies *within* the student's actual academic context (courses, workload).
      *   **Goal:** Leverage the "teachable moment" after a lapse, using reflection and mentorship to connect abstract virtues to the specific situational pressures students face within our *redesigned* environment, aiming for deeper internalization and promoting transfer.

  **Engaging the Losing Side (Character Program Proponents):**  
  We acknowledge the valid concern raised by proponents of a primarily character-based approach: that focusing solely on situational fixes risks reducing integrity to a compliance issue managed by environmental controls, potentially neglecting the cultivation of students' moral agency and long-term intellectual identity. A purely situational approach may not inspire the intrinsic commitment to honesty we aspire to foster. Our hybrid model directly addresses this by ensuring the character program is explicitly designed to connect virtues *to* the real situations students encounter. The mentorship and reflection components are crucial for bridging this gap, moving beyond abstract workshops to context-specific ethical application. The program is not abandoned; it is strategically delayed and integrated to maximize its potential effectiveness within a supportive structure.

  **Implementation Timeline:**
  *   **Nov 2023:** Committee vote; draft initial implementation teams.
  *   **Dec 2023:** Allocate Phase 1 funds; Assessment Working Group & Policy Review Subcommittee formed.
  *   **Jan 2024 - May 2024 (Spring Sem):** Pilot situational changes (assessment pilots, policy tweaks); procure/train on tools; *Design* Character Program framework.
  *   **Jun 2024 - Aug 2024 (Summer):** Refine situational changes based on pilots; develop full Character Program curriculum/resources; train initial mentors.
  *   **Sep 2024 (Fall Sem):** Full implementation of approved situational changes across relevant departments/courses; **Launch** Academic Character Program for eligible first-time offenders. Ongoing assessment of both arms begins.

  **Verdict:** Hybrid implementation with situational priority.
