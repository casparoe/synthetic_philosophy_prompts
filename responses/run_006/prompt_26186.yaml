  Right, where to start... The governess's position is textbook Fricker - low social status (young, female, employee), reporting supernatural events that defy Victorian rationality. But James's genius is making her unreliability feel psychologically plausible rather than just socially determined. The reader isn't just told "prejudice happens"; we're made to feel its visceral pull when Flora's "obscene" outburst makes us doubt the governess. That's the craft angle - dramatic irony working overtime. 

  Ah! And the hermeneutical injustice angle is richer than I first thought. It's not just that she lacks concepts; it's that the concepts she does have (corruption, purity) are melodramatic Victorian tropes. The ghosts become projections of her repressed anxieties. James implies hermeneutical gaps can be weaponised against the marginalised even when they're "right" - if her testimony's tainted by hysteria, does it matter if Quint and Jessel are real? That's a nuance beyond Fricker's framework. 

  The reader-complicity point is thorny. That moment when we catch ourselves thinking "But Mrs Grose believes her!" only to realise we're appealing to another working-class woman's validation... bloody brilliant trap James sets. The novella doesn't just depict prejudice; it implicates us in the epistemic violence. Risky? Absolutely. But deliberately so - it makes us feel how seductive dismissal can be. 

  Now, Gilman comparison... Key difference is narrative perspective. Gilman's diary format screams hermeneutical injustice (she literally can't articulate "nervous depression" without male dismissal warping her self-perception). But we're never invited to doubt her reality - the wallpaper's horror is subjective truth. James forces doubt; Gilman demands belief. Both valid approaches, but James's ambiguity serves different ends: he exposes how credibility assessments corrupt truth-seeking, while Gilman shows how dismissal destroys the self. 

