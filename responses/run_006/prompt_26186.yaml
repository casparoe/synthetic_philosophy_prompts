prompt: |-
  I'm a novelist and I've been reading up on epistemic injustice — Miranda Fricker's stuff on testimonial and hermeneutical injustice — and it got me thinking about Henry James's The Turn of the Screw. The whole novella hinges on whether we believe the governess, right? She's a young woman, a governess (so, not exactly high-status), reporting these wild events, and the reader spends the whole time trying to decide whether she's credible.

  I'd love a reading of the novella through the lens of epistemic injustice. Not just "here's testimonial injustice in fiction" — I want to know what the fiction does that the philosophy doesn't. Like, what does James dramatize about credibility and who gets believed that a philosophical analysis misses or can't capture? Where does Fricker's framework illuminate the governess's situation, and where does the novella push back or complicate the theory?

  One thing I'm especially curious about: the reader is put in the position of evaluating her testimony, and as far as I can tell James makes it genuinley ambiguous whether she's reliable. Does that structure — putting the reader in the position of the prejudiced hearer — reveal something about epistemic injustice that a treatise can't? Or does it risk reproducing the very injustice it depicts?

  Also, if you know it, how would you compare the epistemic situation in James's novella to what's going on in Charlotte Perkins Gilman's The Yellow Wallpaper? I feel like the two works are doing very difrent things with the question of who gets believed, but I can't quite articulate the difference.

  This is for a craft essay I'm writting — I'm working on a novel where the protagonist keeps not being believed, and I'm trying to think through what narrative form does to testimonial injustice. So I care about the craft angle as much as the philosophical one.

  Oh, and could you write the answer in British English? No idea why but the journal I'm submitting to prefers it.
