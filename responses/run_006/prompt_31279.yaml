answer: |-
  Here’s your spec sheet for theories of vagueness – the core phenomena, distinctions, and constraints any contender must address. The requirements are categorized, with conflicts and negotiability flagged.

  **SPEC SHEET: REQUIREMENTS FOR A THEORY OF VAGUENESS**

  **I. PHENOMENA CAPTURE (Non-Negotiable Core)**
  1.  **Borderline Cases:** *Must* account for the existence of cases where it's indeterminate whether a predicate applies (e.g., a patch color where it's unclear if it's "red"). *Why:* Central to vagueness; without borderline cases, it's just precision or ignorance.
  2.  **The Sorites Paradox:** *Must* explain the paradox's force and why premises like "One grain doesn't make a difference" (Tolerance) seem intuitively plausible, while also showing why the conclusion (No heaps exist) is false or how the reasoning fails. *Why:* The defining puzzle of vagueness; any theory must engage with it directly.
  3.  **Higher-Order Vagueness:** *Must* handle the apparent absence of sharp boundaries *between* clear cases, borderline cases, and clear non-cases. There seem to be borderline-borderline cases (e.g., patches that are neither clearly red, nor clearly borderline-red, nor clearly not-red). *Why:* Denying this often reintroduces sharp boundaries at a higher level, violating the core intuition of gradual transition. *(Major Challenge Zone)*
  4.  **Penumbral Connections:** *Must* explain logical relationships *between* vague predicates. If something is clearly red, it must not be clearly orange. If it's a heap, it can't be a scattered pile. *Why:* Vagueness isn't random indeterminacy; predicates constrain each other logically.
  5.  **Forced March Dynamics:** *Must* account for what happens when we are forced to judge each step in a sorites series sequentially (e.g., "Is *this* one grain a heap? Now *this* one?"). *Why:* Reveals context-sensitivity, judgment instability, and potential pressure points in applying vague terms.

  **II. DISTINCTIONS (Non-Negotiable)**
  6.  **Vagueness ≠ Ambiguity:** *Must* distinguish vagueness (single meaning with blurred boundaries) from ambiguity (multiple distinct meanings). "Bank" is ambiguous; "bald" is vague. *Why:* Solutions for ambiguity (disambiguation) don't work for vagueness.
  7.  **Vagueness ≠ Context-Sensitivity:** *Must* distinguish the *inherent* boundary-blurring of vagueness from how context *fixes* the extension of context-dependent terms (e.g., "tall" depends on context, but "tall for a jockey" is still vague). *Why:* While context *interacts* with vagueness (see Forced March), the underlying fuzziness remains context-independent.
  8.  **Vagueness ≠ Mere Ignorance:** *Must* show why borderline cases aren't simply cases where we lack precise knowledge of sharp boundaries. *Why:* The intuition is that there *are no* sharp boundaries to know, not that we haven't found them yet.

  **III. LOGICAL & METAPHYSICAL CONSTRAINTS (Negotiable - Battleground)**
  9.  **Tolerance Intuition:** *Should* respect the strong intuition that tiny changes (one grain, one hair, one nanometer of wavelength) cannot make the difference between a predicate applying or not applying in a sorites series. *Negotiability:* High. Some theories (Epistemicism) explicitly reject it as misleading; others (Degree Theories) build it in via gradual truth values; others (Contextualism) explain its plausibility while showing how judgment *can* shift.
  10. **No Sharp Boundaries:** *Should* avoid positing a precise point where adding one grain turns a non-heap into a heap. *Negotiability:* High. Epistemicism explicitly accepts sharp boundaries (we just can't know them). Other theories achieve this by rejecting classical logic/bivalence (Supervaluationism, Degree Theories) or using shifting contexts (Contextualism).
  11. **Classical Logic/Bivalence Preservation:** *Should* preserve core classical principles like the Law of Excluded Middle (every statement is true or false) and Bivalence (every meaningful declarative sentence has exactly one truth value: true or false). *Negotiability:* High. Many theories (Supervaluationism, Degree Theories, Fuzzy Logic) modify or abandon classical logic/bivalence to handle borderline cases. Epistemicism staunchly defends them.
  12. **Compositionality:** *Should* explain how the truth conditions/meanings of complex sentences (especially involving logical connectives like "and," "or," "not") are determined by the meanings of their vague parts and the connectives. *Negotiability:* Moderate. Seen as desirable for systematic semantics, but some theories (especially Degree-based) face significant challenges here (e.g., defining "not" for partial truths).

  **THE COLLISION ZONE: The Unsatisfiable Trio**

  *   **You CANNOT simultaneously satisfy:**  
      `Tolerance Intuition (9)` + `Classical Logic/Bivalence (11)` + `No Sharp Boundaries (10)`.

  *   **Why:**
      *   Classical Logic/Bivalence (11) demands that for *every* adjacent pair in a sorites series (n grains, n+1 grains), the predicate (e.g., "is a heap") must be either True or False for each member.
      *   Tolerance (9) strongly suggests that if n grains is *not* a heap (False), then n+1 grains *cannot be* a heap (True) – because one grain can't make that difference.
      *   Therefore, starting from a clear non-heap (False), Tolerance + Classical Logic force *every* subsequent number to be False (not a heap). This contradicts the obvious truth that a million grains *is* a heap (True), and also violates No Sharp Boundaries (10) *by default* (everything is False!).
      *   Conversely, starting from the clear heap and working backwards leads to everything being True.
      *   The *only* way for Classical Logic/Bivalence to avoid this catastrophe is to insist there *is* a sharp boundary where adding *one grain* changes False to True (**violating 9 Tolerance and 10 No Sharp Boundaries**). This is Epistemicism's move.
      *   To avoid sharp boundaries (10) while respecting tolerance (9), a theory **must abandon** strict Classical Logic/Bivalence (11). It needs truth-value gaps (Supervaluationism), degrees of truth (Degree Theories), or context-shifting mechanisms that block universal quantification over the series (Contextualism).

  **The Knockout Punch: Higher-Order Vagueness (Requirement 3)**

  *   **Why it's the biggest hurdle:** Most theories struggle to fully accommodate the seemingly *limitless* fuzziness implied by higher-order vagueness without either:
      *   **Reintroducing Sharp Boundaries:** Supervaluationism often faces criticism for having sharp boundaries between the definite, borderline, and definite-not zones (1st-order boundaries), and potentially sharp meta-boundaries for higher orders.
      *   **Requiring Infinite Precision:** Degree theories assigning precise numerical truth values (e.g., 0.7231 true for "red") face the "higher-order problem" of how to assign *those* values without sharp boundaries *between* degrees (e.g., is 0.5 *clearly* the midpoint?). Avoiding infinite precision (e.g., using fuzzy intervals) creates its own complexities.
      *   **Infinite Regress of Context Shifts:** Contextualism must explain how context shifts avoid sharp boundaries *between* contexts suitable for different judgments, potentially leading to an infinite regress of context parameters.
  *   **The Scorecard (Brief):**
      *   **Epistemicism:** Denies genuine higher-order vagueness; it's all just ignorance of sharp boundaries. *Fails Requirement 3.*
      *   **Supervaluationism:** Struggles to avoid sharp meta-boundaries defining "definitely definite" vs. "definitely borderline," etc. *Challenged by Requirement 3.*
      *   **Degree Theories:** Risk sharp boundaries between degrees or require infinitely complex structures. *Challenged by Requirement 3.*
      *   **Contextualism:** Must show context shifts are themselves vague to avoid higher-order sharp boundaries. *Actively tackles Requirement 3, but success contested.*

  **Non-Negotiables vs. Taste:**

  *   **Non-Negotiable (Failure means not addressing vagueness):** 1 (Borderline Cases), 2 (Sorites Engagement), 3 (Higher-Order Challenge - must *address* it seriously), 4 (Penumbral Connections), 5 (Forced March - must *explain* the phenomenon), 6, 7, 8 (Distinctions).
  *   **Negotiable (Camp Taste / Theoretical Choice):** 9 (Tolerance), 10 (No Sharp Boundaries), 11 (Classical Logic/Bivalence), 12 (Compositionality). The core conflict revolves around which of these (9, 10, 11) a theory is willing to sacrifice or modify.

  This spec sheet gives your reader the yardstick. Any theory must grapple with the non-negotiable phenomena and distinctions. Its choice of which negotiable constraints to uphold (and how) defines its approach and determines how it navigates the fundamental collision – especially the impossible trio of Tolerance, Classical Logic, and No Sharp Boundaries. The relentless challenge of Higher-Order Vagueness reveals where even sophisticated proposals often stumble.
