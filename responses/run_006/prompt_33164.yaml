answer: |-
  Here’s your Q&A prep sheet, structured by objection severity and tailored to your audience. Concede strategically to build credibility, then pivot to your core argument.

  ---

  ### **Concession Up Front (Open With This)**
  > *"Before we begin, I fully accept that superrationality violates strict dominance and isn’t a general solution for asymmetric or repeated games. My claim is narrower: in symmetric one-shot games between *known equally rational* agents with common knowledge of payoffs and rationality, dominance reasoning may mislead. I argue that rational agents in this specific context should optimize for the *jointly rational outcome*, not just their unilateral best response."*

  **Why:** Preempts "but dominance!" objections, shows you understand standard tools, and narrows scope to your strongest case.

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by likelihood/damage)*  

  1. **"This violates the Sure-Thing Principle/Dominance. If one action pays more *regardless* of others’ choices, how can choosing it be irrational?"**  
     **Reply:** "Dominance assumes independence of others’ actions. But with common knowledge of symmetry and rationality, choices are *interdependent*. Defecting in PD *guarantees* mutual defection if all reason identically. Universal cooperation is the only Pareto-efficient outcome accessible under symmetric rationality."  
     **Soft Spot:** Doesn’t resolve how agents "coordinate" reasoning without communication. Requires treating symmetry as a logical constraint, not a causal one.  

  2. **"This is just Nash equilibrium with correlated strategies. Why call it ‘superrationality’?"**  
     **Reply:** "Nash equilibrium is consistent but doesn’t *select* (C,C) in PD; (D,D) is also Nash. Superrationality breaks the equilibrium selection problem via symmetry: only outcomes where identical agents make identical choices are feasible, eliminating off-diagonal outcomes. (C,C) is uniquely optimal under this constraint."  
     **Soft Spot:** Concedes that (C,C) isn’t Nash in PD (it’s not). You’re proposing a *new* solution concept.  

  3. **"How do agents know others will reason identically? Without common priors, symmetry is ad hoc."**  
     **Reply:** "Common knowledge of symmetry + rationality *implies* identical reasoning. If we agree we’re equally rational and face identical incentives, any logical argument I accept, you must accept. Defection becomes self-refuting: if I defect because I expect you to defect, I violate symmetry by assuming you’re less rational than me."  
     **Soft Spot:** Philosopher will note this assumes a controversial "unique rational outcome" (cf. Aumann’s agreeing to disagree).  

  4. **"What about asymmetric games? If payoffs aren’t identical, your symmetry assumption fails."**  
     **Reply:** "Correct—superrationality only applies under perfect symmetry. In asymmetric games, standard equilibrium concepts dominate. This is a tool for edge cases like symmetric PD, Stag Hunt, or Coordination games."  
     **Soft Spot:** Audience may dismiss it as "too niche to matter."  

  5. **"This sounds like magical thinking. How is choosing C not just hoping the other does?"**  
     **Reply:** "It’s not hope—it’s deduction. Under common knowledge, my choice *entails* yours. Choosing C is the only move consistent with both of us being rational and achieving a non-dominated outcome. Defecting *ensures* mutual loss *if* the other reasons identically."  
     **Soft Spot:** Feels circular to those who see rationality as purely individualistic.  

  6. **"Evolutionarily, superrationality is unstable. In a population, defectors invade cooperators."**  
     **Reply (to evolutionary theorists):** "Superrationality isn’t an evolutionary strategy—it’s a normative rule for *deliberative* agents with common knowledge. Evolution favors defection in PD, but rational agents with full transparency can transcend that trap. For indirect reciprocity, superrationality might model high-transparency cultural groups."  
     **Soft Spot:** Concedes it’s not biologically adaptive.  

  7. **"Why not just use team reasoning or Kantian optimization?"**  
     **Reply:** "Team reasoning assumes shared goals; Kantianism tests maxims universally. Superrationality is individualistic: I care about *my* payoff but recognize that my choice constrains yours via symmetry. It selects (C,C) because it’s the only symmetric outcome better than (D,D) for me."  
     **Soft Spot:** Nuanced distinction may be lost; some will see this as rebranding Kant.  

  8. **"In practice, how do agents *know* symmetry holds? What if I’m rational but doubt others are?"**  
     **Reply:** "Then superrationality doesn’t apply! It requires common knowledge of symmetry and rationality. Absent that, defect in PD. This norm is for highly idealized, transparent interactions—e.g., two game theorists playing with payoffs known."  
     **Soft Spot:** Limits real-world relevance.  

  ---

  ### **The Question You Hope Nobody Asks**  
  > *"If superrational agents always cooperate in PD, why isn’t this just a convoluted way to assume correlated equilibrium where players correlate on (C,C)?"*  

  **Why it’s deadly:** Correlated equilibrium (CE) allows off-diagonal outcomes (e.g., a coin flip telling one to cooperate, one to defect). Superrationality *forbids* asymmetric outcomes by symmetry. CE doesn’t explain *why* rational agents would correlate on (C,C).  
  **Reply (if asked):** "CE is possible but doesn’t *compel* (C,C). Superrationality argues that (C,C) is uniquely compelling under symmetry because asymmetric CEs violate identical reasoning. But yes, the mechanisms are adjacent—I’m claiming symmetry *replaces* the correlation device."  
  **Risk:** Conflates correlation with logical necessity; hard to sell without metaphysical commitment.  

  ---

  ### **Final Prep Tips**  
  - **Anchor in PD:** Focus all examples there—it’s the battleground.  
  - **Use their language:** Say "solution concept," "feasible outcomes," "common knowledge." Avoid "acausal" or "timeless decision."  
  - **Credibility moves:**  
    - "I agree dominance governs *most* decisions."  
    - "Nash is robust—but fails in symmetric coordination."  
  - **End strong:** "If we demand rationality be *strictly* individualistic, we doom symmetric agents to suboptimality. Superrationality resolves that paradox."  

  You’re fighting uphill, but your narrow framing makes it defensible. Good luck!
