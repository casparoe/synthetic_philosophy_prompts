answer: |-
  ## Philosophical Analysis of Polygenic Embryo Selection

  **Section 1: The Implicit Theory**
  The practice fundamentally presupposes a consequentialist view of parental obligation centered on **maximizing future offspring welfare**. It implicitly endorses a strong version of **Procreative Beneficence (PB)**: parents *should* select the embryo with the highest predicted aggregate well-being, defined primarily in terms of **avoiding disease burdens and enhancing socially valued traits** (like educational attainment). This presupposes a specific conception of a "better life": one with lower genetic predisposition to physical/mental health conditions and higher potential for socio-economic success. It clearly presupposes that lives with conditions like schizophrenia or diabetes are *intrinsically worse* due to the suffering, functional limitations, or reduced opportunities they entail. Crucially, this commits the practice to a **non-disability-neutral stance**: it implies that the *presence of these conditions* inherently diminishes the value of a life compared to its absence. This raises a deep tension: if selecting *against* an embryo presupposes its life would be significantly worse, what does this imply about the value of *existing* lives with those conditions? It risks suggesting those lives are of lesser worth, undermining the disability rights perspective that distinguishes impairment from societal barriers and affirms the equal value of disabled lives.

  **Section 2: Strictly Presupposed vs. Merely Compatible**
  The practice **strictly presupposes**:
  1.  **Predictive Relevance:** Polygenic scores (PGS) track *something* meaningfully predictive of future well-being (health, flourishing) relevant to parental decision-making.
  2.  **Parental Action Justified:** Parents have an obligation (or at least a strong prerogative) to use this predictive information to select embryos expected to have better lives.
  3.  **Condition-Based Harm Avoidance:** Reducing the risk of specific conditions (schizophrenia, diabetes) *constitutes* an improvement in expected well-being.

  It is **merely compatible with**:
  *   **Theories of Value:** It fits welfarism (focus on well-being) and perfectionism (promoting "valuable" traits like intelligence) but could *technically* operate under a purely preference-satisfaction view if parents value low disease risk/high attainment.
  *   **Source of Obligation:** The duty could stem from PB, a harm-prevention principle (avoiding predictable suffering), or even a strong parental autonomy right to shape offspring traits.
  *   **Objectivity of Traits:** It doesn't strictly require traits like "educational attainment" to be *objectively* better; it only requires parents *believe* they contribute to a better life.

  The **minimal commitment** is that PGS provide actionable welfare-relevant information parents *should* use to select for lower disease risk/trait enhancement.

  **Section 3: The Eugenics Question**
  The practice presupposes that the **liberal framing fundamentally changes the moral calculus**. It assumes the core wrong of historical eugenics was **state coercion and discriminatory aims** (racism, classism). By contrast, individual parental choice aimed at welfare is seen as morally benign or even obligatory. This presupposes that the *attitude expressed* by selecting against certain traits – the judgment that some genetic predispositions make a life less desirable or worthy of existence – is *not inherently problematic* if divorced from state power and overtly bigoted goals. The practice thus presupposes that ethical objections to historical eugenics were primarily about *means* (coercion) and *ends* (social hierarchy), not about the underlying act of devaluing and selecting against certain kinds of lives based on genetic potential. It assumes the expressive harm of devaluation is negligible or overridden by parental welfare goals within a choice paradigm.

  **Section 4: Underdetermination**
  The practice is significantly underdetermined regarding:
  1.  **The Foundation of Parental Obligation:** Is the duty rooted in maximizing welfare (PB), preventing harm, respecting parental autonomy/procreative liberty, or promoting societal good? The practice functions similarly under all these justifications.
  2.  **The Nature of "Better Life":** Does "better" mean more happiness (hedonism), greater achievement/functioning (perfectionism), or merely satisfying parental preferences? The selection criteria remain unchanged.
  3.  **The Moral Relevance of Non-Disease Traits:** Why is selecting for *educational attainment* ethically permissible or obligatory? The practice doesn't settle whether this is a welfare enhancer, a parental preference, or an objective good.
  4.  **The Threshold for "Worse" Life:** How much increased risk justifies selection against an embryo? The practice offers scores but presupposes *some* threshold exists without defining it philosophically.

  **Section 5: Change Under Expressivist/Disability-Critique View**
  Adopting the expressivist critique would necessitate profound changes:
  1.  **Cessation of Non-Medical Selection:** Selection based on polygenic scores for non-lethal conditions (schizophrenia, diabetes) and traits (educational attainment) would likely cease, as these are seen as expressing harmful devaluation of disabled/neurodivergent lives and reinforcing problematic norms about "desirable" traits.
  2.  **Radical Restriction of Scope:** The practice might only be permissible for conditions universally recognized as causing profound, unmitigable suffering incompatible with any reasonable quality of life (e.g., lethal childhood disorders like Tay-Sachs), where the expressivist argument is weaker.
  3.  **Fundamental Reframing:** Marketing would shift dramatically. Language like "best odds," "healthy/flourishing life," or "reducing burdens" linked to non-lethal conditions/traits would be abandoned as inherently expressive of devaluation. Services would be framed *only* in terms of preventing severe, early-onset lethal suffering, with explicit disavowals of judging the value of lives with disabilities.
  4.  **Mandatory Counseling:** Extensive counseling would be required, emphasizing the social model of disability, the value of neurodiversity, and challenging assumptions that predicted traits equate to life quality or worth. The focus would shift from "selecting the best" to "avoiding profound early suffering."
  The core commercial model of ranking embryos based on aggregate polygenic risk for various conditions/traits would likely become untenable under this view.
