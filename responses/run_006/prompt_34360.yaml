prompt: |-
  Can you explain what the extended mind thesis actually commits you too, versus the much more boring idea that we use our environment to help us think? I get that a notebook or my phone can help me remember stuff, but defenders of the extended mind say the phone is literally part of my cognitive process. I cant tell where the line is between "a tool that supports my thinking" and "part of the thinking itself." What exactly has to be true for the phone to count as genuinely part of my mind, and is the difference between these two positions a real one or just a fight over how to use the word "mind"?
