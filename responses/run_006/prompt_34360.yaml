  I should address the parity principle and the coupling conditions (trust, accessibility, etc.). Explaining that EMT isn't just about convenience but functional equivalence is crucial. Highlighting the difference between "using" and "incorporating" tools can clarify. Also, discussing whether the distinction matters beyond terminology—like in ethics or tech design—could satisfy their deeper curiosity about real-world relevance.

  Need to avoid jargon where possible. Use phone examples consistently. Emphasize that EMT challenges traditional boundaries, making cognition a system that includes external components. Mentioning cases like Otto's notebook versus the standard use of a phone for quick lookup could illustrate the conditions required for true extension.

