prompt: |-
  So we're doing epistemology in my philosophy class and we read Moore's "Proof of an External World." You know, the one where he holds up his hands and says here is one hand, here is another, therefore external objects exist. My teacher says it's actually a serious argument and not just Moore being stubborn, but I got into this argument with my friend Jake about it and now I'm stuck.

  Here's what Jake said. He laid it out like this:

  (1) If Moore's proof works, then you can come to know something exists in the external world just by having a perceptual experience and drawing the obvious conclusion from it. Like, you see what looks like your hand, you think "yep, that's my hand," and now you know there's an external world. Fair enough.

  (2) But if that's all it takes, then you should also be able to prove you're not dreaming, or not a brain in a vat, the exact same way. You have the experience of seeing your hand, you conclude "I'm not dreaming" or "I'm not a brain in a vat." Same structure, same evidence.

  (3) But you obviously can't prove you're not dreaming just by looking at your hands. That's like the whole point of the dreaming argument — the experience feels the same whether your dreaming or not, so you can't tell from the inside.

  (4) So Moore's proof must be cheating somewhere. Either it doesn't actually prove anything, or there's some hidden difference between "external objects exist" and "I'm not dreaming" that makes the proof work for one but not the other.

  (5) But if there IS a difference, then Moore hasn't really answered the skeptic. The skeptic's whole point is that you can't use your experiences to prove anything about the external world because you can't rule out the skeptical scenarios. If Moore's proof only works because it doesn't try to rule them out, then it's not actually proving what the skeptic is questioning.

  So Jake says Moore's proof either fails or is irrelevant. I want to defend Moore but I can't figure out where Jake's argument goes wrong. Did he mess up a step? Is premise (2) the problem? Or is Moore's proof actually in worse shape than my textbook makes it sound?
