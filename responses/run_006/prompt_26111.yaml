  I'm in my school's philosophy and debate club, and we're preparing a session on strategic conflict. I want to produce a one-page taxonomy of commitment races: situations where each party tries to commit to a course of action before the others do, and the race to commit first produces an outcome worse than what any party wanted. I know the classic examples — arms races, brinkmanship in international relations — but I want a taxonomy that also covers everyday cases like escalating arguments, bidding wars, or political base-mobilization spirals, and that carves the territory by structural features rather than by domain.

  Please give me exactly five types of commitment race, each as a numbered item of one or two sentences, with no introduction or conclusion. Each type should be defined by the structural feature that distinguishes it from the others (for instance: whether commitments are reversible, whether the parties can communicate, whether the stakes are symmetric, whether the race is about who commits first versus who commits more). Give a concrete example for each type, and if any logically possible combination of features has no real-world instances, note that and briefly suggest why.
