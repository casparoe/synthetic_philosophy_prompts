answer: |-
  Here are five types of commitment races defined by structural features:

  1.  **Irreversible Commitment Race:** Commitments are costly to reverse, forcing parties to escalate preemptively to avoid being locked into a disadvantage. *Example:* Two neighbors rapidly build spite fences higher and higher after a boundary dispute, each fearing being stuck looking at the other's imposing barrier.

  2.  **Communication-Barrier Race:** Parties cannot credibly communicate intentions or coordinate, making preemptive commitment seem like the only safe strategy against potential aggression. *Example:* Two drivers accelerating towards an intersection fearing the other won't stop, unable to signal reliably, resulting in a collision neither wanted.

  3.  **Asymmetric Stake Race:** Parties have significantly different valuations of the contested outcome, but the preemption dynamic forces the low-stakes party to overcommit defensively or offensively. *Example:* A small company engages in a ruinous legal battle against a large corporation over a minor patent, fearing precedent or annihilation if it doesn't fight aggressively first.

  4.  **Sequential Escalation Point Race:** The conflict involves multiple potential escalation levels; committing early to a higher level preempts the opponent but risks dragging both parties deeper than intended. *Example:* Politicians attacking opponents with increasingly extreme rhetoric to mobilize their base first, escalating polarization beyond their initial goals to avoid being outflanked.

  5.  **Symmetric Preemption Race:** Parties have symmetric stakes and capabilities, and the race is purely about who commits *first* to a mutually detrimental action to deter the other, often leading to simultaneous commitment. *Example:* Two competing businesses slashing prices simultaneously in a destructive price war, each rushing to undercut the other first to capture market share, destroying profits for both. *(Note: Races combining asymmetric stakes with perfectly reversible commitments are rare; reversibility usually negates the preemptive pressure, as parties can easily back down after observing the commitment.)*
