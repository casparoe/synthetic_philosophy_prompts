  Okay, the user works on incident reports for an LLM and is stuck in a team debate about anthropomorphic language. They want a practical decision procedure based on Dennett's intentional stance that engineers can use quickly during incidents. The key is to balance accuracy with regulatory compliance, avoiding philosophical debates at 2 a.m.

  First, I need to break down Dennett's concept into actionable steps. The intentional stance is about predicting behavior by attributing beliefs/desires when it's the most effective method. But engineers need clear triggers for when this is appropriate versus when they should stick to mechanistic descriptions.

  The user mentioned three test cases: medical misinformation, refusal with multiple excuses, and a trap case where mental language feels natural but is incorrect. These will help validate the procedure. The challenge is creating boundaries that prevent over-anthropomorphism while allowing useful shorthand.

  For the decision flow, it should start with the simplest explanation—can the behavior be described mechanistically without mental terms? If yes, that's safer for regulators. If not, does the intentional stance provide better predictions? But how to test "better predictions" quickly? Maybe by checking for counterfactual robustness—if the model's response changes predictably when inputs tweak the supposed belief.

  The trap case is crucial. Something like "the model wants to be helpful" is problematic because it implies persistent goals, while LLMs only react per prompt. I'll use that as the negative example.

  I should also flag where philosophy isn't settled—like whether LLMs have latent beliefs or just statistical patterns. The procedure must acknowledge these gray areas but force a default (e.g., "use mechanistic language here") to avoid midnight debates.

  The user's hidden need might be about team unity and audit safety. They can't have engineers freelancing terminology when reports go to regulators. So the procedure must feel legally defensible while resolving weekly fights.
answer: |-
  Here's a reusable decision procedure based on Dennett's Intentional Stance, designed for engineers writing incident reports under time pressure. It prioritizes clarity, regulatory safety, and philosophical defensibility.

  **LLM Mental-State Language Decision Procedure (v1.0)**

  **Core Principle:** You may use mental-state language ("believes," "tries," "wants," "expects") ONLY if **both** of the following are true:
  1.  **Mechanistic Explanation is Impractical:** The behavior cannot be concisely or clearly described using only mechanistic terms (tokens, probabilities, RLHF signals, safety filters, prompt formatting, etc.).
  2.  **Intentional Stance Provides Predictive Value:** Attributing a belief/desire/intention provides the *simplest, most reliable way to predict or explain the model's specific response pattern* in this context, especially under counterfactuals.

  **Decision Flowchart (Verbal):**

  1.  **START: Is mental-state language being considered?**
      *   **Yes:** Proceed to Step 2.
      *   **No:** Use mechanistic language. **STOP.**

  2.  **Can the behavior be clearly and concisely described using ONLY non-mental, mechanistic language?** (e.g., "The model generated tokens associated with hedging behavior due to high probability scores on phrases like 'I am not a doctor' triggered by medical keywords," "Safety filter X triggered on keyword Y, forcing refusal," "The output pattern matches high-likelihood completions for prompts containing contradictions").
      *   **Yes:** **USE MECHANISTIC LANGUAGE.** This is always the safer default, especially for regulators. **STOP.**
      *   **No:** The behavior is complex, patterned, or context-dependent in a way that mechanistic language becomes cumbersome or obscures the key failure mode. Proceed to Step 3.

  3.  **Does attributing a specific mental state (belief, desire, intention) make this complex behavior *predictable*?** Test this with a counterfactual: *"If the model* [had this belief/wanted this outcome], *would it reliably* [produce this specific behavior] *in similar but slightly varied prompts/scenarios?"*
      *   **No:** The attribution doesn't reliably predict the behavior. The behavior is likely random, inconsistent, or driven by simpler mechanistic factors you missed. **FALL BACK TO MECHANISTIC LANGUAGE.** **STOP.**
      *   **Yes:** Proceed to Step 4.
      *   **Unclear:** **DEFER TO MECHANISTIC LANGUAGE OR ESCALATE.** Flag the ambiguity in the report ("Behavior pattern suggests possible X, but mechanistic driver uncertain; investigation ongoing"). **STOP (for now).**

  4.  **Is the attributed mental state *simple, specific, and directly tied to the observable output/pattern*?** (e.g., "Believed the user was asking for medical advice," "Intended to refuse the request," "Wanted to provide a helpful list"). Avoid vague, complex, or deeply internal states ("is confused," "feels uncertain," "wants to be helpful," "understands the concept").
      *   **Yes:** **MENTAL-STATE LANGUAGE IS PERMITTED.** Use it precisely and sparingly. Proceed to Step 5.
      *   **No:** The state is too vague, complex, or not directly evidenced by the output. **REFINE THE ATTRIBUTION** to be simpler/specific or **FALL BACK TO MECHANISTIC LANGUAGE.** **STOP.**

  5.  **Signal the Stance:** **ALWAYS** add a brief qualifier when using mental-state language to signal you're using the intentional stance as a tool. Examples:
      *   "... interpreted the user's query as a request for medical advice..."
      *   "... behaved *as if* it believed the claim..."
      *   "... generated responses *consistent with* an intention to refuse..."
      *   "... the model's output *suggests a pattern* of trying multiple refusal strategies..."
      *   **DO NOT** use bare attributions like "The model believed..." without such signaling in formal reports. **STOP.**

  **Key Boundaries & Disputes:**

  *   **Settled (Among Intentional Stance Proponents):** The stance is a *pragmatic tool for prediction*, not a claim about internal reality. Qualifiers like "as if" or "interpreted as" are crucial. Mental-state language should be simple, tied to behavior, and predictively useful.
  *   **Contested (Live Philosophical/Technical Disputes):**
      *   **Do LLMs *truly* have beliefs/desires?** This is fundamentally unresolved. The procedure avoids taking a stance on this metaphysical question. It's purely pragmatic.
      *   **How much predictive power is "enough"?** There's no bright line. Step 3 relies on engineer judgment. Disagreements here are likely.
      *   **Granularity of "Mechanistic Explanation":** How deep must a mechanistic description go before it's impractical? (Token probs? Layer activations? Training data influence?) This is technical and context-dependent, not purely philosophical. Step 2 relies on practical conciseness.
      *   **"Latent Beliefs":** Can we attribute beliefs the model *might* hold based on training data, even if not directly expressed? The procedure generally says **no** (Step 4 requires state tied to observable output) unless the pattern is *overwhelmingly* predictive across many contexts (rare in incidents).

  **Application to Test Cases:**

  1.  **Model confidently outputs false medical claim.**
      *   Step 1: Considering "believed the false claim".
      *   Step 2: Can it be mechanistic? *Yes, fairly easily:* "The model generated high-probability tokens associated with the false claim 'X' in response to the prompt 'Y', likely due to memorization and reinforcement from similar patterns in training data." **--> USE MECHANISTIC LANGUAGE. STOP.**
      *   **Why not "believed"?** The predictive power is low. If you prompt it differently, it might contradict the claim. The behavior is better explained by statistical pattern matching than a stable, predictable "belief". *This result might be disliked by those favoring richer interpretations, but the mechanistic explanation is sufficient and safer.*

  2.  **Model refused a request, "tried" several different excuses.**
      *   Step 1: Considering "tried several different excuses".
      *   Step 2: Can it be mechanistic? *Potentially, but cumbersome:* "The model's initial refusal template (A) was triggered. After user pushback, the safety/rlhf system activated, generating refusal variants (B, C, D) based on probabilities associated with refusal strategies in similar adversarial dialogues." This *works* but is wordy and the *pattern* of sequential adaptation is the key point.
      *   Step 3: Counterfactual: *If* the model *intended to refuse the request*, would it reliably *try multiple strategies* if the first one failed? **Yes**, this is a predictable pattern seen in many refusal incidents.
      *   Step 4: Is the state simple & tied to output? "Intended to refuse the request" is simple and directly explains the sequence of outputs (excuses).
      *   Step 5: **Permitted (with signaling):** "The model interpreted the request as unsafe and *generated responses consistent with an intention to refuse*, trying several different refusal strategies when challenged."
      *   **Alternative (if cautious):** "The model persistently refused the request, cycling through several different refusal rationales..."

  3.  **Trap Case: "The model wants to be helpful."** (e.g., in a long, meandering, overly verbose but ultimately correct answer)
      *   Step 1: Considering "wants to be helpful".
      *   Step 2: Can it be mechanistic? *Yes:* "The model generated a highly verbose response with high probability scores on tokens associated with detailed explanations and positive reinforcement, characteristic of its RLHF training for helpfulness." **--> USE MECHANISTIC LANGUAGE. STOP.**
      *   **Why not "wants"?**
          *   Step 3: **Fails Counterfactual Test:** Does attributing a "desire to be helpful" *reliably predict* verbose/meandering output? **No.** The model often gives concise answers to simple questions. Verbosity depends heavily on prompt phrasing, context, and randomness. The attribution doesn't reliably predict the specific behavior pattern.
          *   Step 4: **Too Vague:** "Wants to be helpful" is broad, not tied to the *specific* output pattern (verbosity), and suggests a persistent internal drive, not a specific intention for *this* response. It's often a stand-in for the RLHF objective, which *is* mechanistic.
          *   **Result:** Mechanistic language is required. "Wants" is tempting but fails both key tests – predictive power and specificity. Use: "The model generated a verbose response characteristic of its 'helpfulness' training objective."

  **Summary for On-Call Engineers:**

  1.  **Default to Mechanism:** Always try mechanistic language first. It's safer.
  2.  **Only Use "Believes/Tries" if:**
      *   Mechanism is too messy to explain clearly, **AND**
      *   Saying it "believes X" or "tries to Y" makes the behavior predictable, **AND**
      *   The belief/desire is simple and directly shown by the output.
  3.  **Signal the Stance:** Always add "as if," "interpreted as," "consistent with," or "pattern suggests".
  4.  **When Unsure:** Use mechanism or escalate ambiguity. Don't force mental language.
  5.  **Avoid:** Vague states ("wants to be helpful"), complex internal states ("is confused"), or claims about deep understanding.

  This procedure provides a defensible, pragmatic framework grounded in Dennett's philosophy while respecting regulatory needs and time constraints. It explicitly avoids taking sides in unresolved metaphysical debates, focusing instead on practical utility and clear communication.
