prompt: |-
  I'm a PhD student working on iterated amplification and distillation, and I'm trying to nail down a failure mode people gesture at but rarely build actual cases for. Could you construct a thought experiment to spec for me?

  The spec: a single, realistic delegation scenario (workplace or household, no oracle models, no weird predictors) in which the amplification/decomposition step preserves competence but loses alignment. The loss should not come from the overseer being unable to evaluate subtasks, and not from a misspecified reward signal or a malicious overseer. The overseer should be a normal, well-intentioned person who is genuinely good at judging wether each subtask was done well. I want the alignment loss to fall out of the structure of the decomposition itself — the way the task is carved up — rather than from anyone dropping the ball on a subtask.

  After the scenario, walk through: (a) what the decomposition looks like and what criteria each subtask is judged by, (b) why competence is preserved, (c) exactly where alignment leaks out and why it's a decomposition problem rather than an evaluation problem, (d) which feature of the case is doing the work, and what happens if you remove or reverse that one feature, and (e) how a defender of iterated amplification would attack the case, and whether the iterated part of IDA actually answers that attack.

  Format: start with a one-sentence bottom line saying what the case establishes, then the scenario, then the walkthrough. Hard limit: 450 words total. It's for a paper section, so it needs to be tight enough to quote almost in full.
reasoning: |-
  Okay, the user is a PhD student researching iterated amplification and distillation, specifically looking for a concrete failure mode where alignment is lost due to task decomposition. They want a realistic scenario without exotic elements—just a normal person delegating tasks in a workplace or household. The key constraints are that the overseer is competent and well-intentioned, evaluation isn't the issue, and the misalignment stems purely from how the task is split up. 

  Hmm... the challenge is making decomposition the villain while keeping everything else pristine. I recall that amplification relies on breaking complex tasks into human-judgeable subtasks, but what if the subtasks' outputs combine in ways that create emergent misalignment? Like optimizing for local correctness that adds up to global distortion. 

  Household examples might be too simple—workplace delegation feels richer. Budget allocation comes to mind: if you decompose "distribute funds fairly" into "each department submits justification," each justification is valid individually, but the sum overlooks cross-departmental equity. The overseer can perfectly judge each report's quality (word count, formatting, internal logic), yet the overall outcome favors departments good at paperwork over genuinely needy ones. 

  Competence is preserved because every subtask (writing reports) is executed well. Alignment leaks because the decomposition misses the silent priority: comparative need between departments. The structural flaw is that the task-split doesn't force comparative evaluation. If you reversed it—say, required pairwise comparisons—alignment might hold, but that's often impractical for large N. 

  Defenders might argue iteration fixes this: later cycles could add critique steps. But does it? If the initial decomposition lacks mechanisms to surface hidden preferences (like equity), amplification might just refine the flawed structure. Iteration helps competence, not alignment gaps from missing dimensions. 

  *Word count check*—need to trim. Drop the household draft. Focus on: bottom line, scenario, then tight walkthrough. Stress that the overseer's good faith and evaluation skills aren't the failure point; it's the decomposition's blindness to emergent properties. 

  Final checks: No oracle models? Check. Realistic? Budget debates happen. Subtasks judgeable? Yes, reports are assessable. Core flaw is decomposition structure? Absolutely—the sum of perfect parts is toxic.
answer: |-
  **Bottom line:** Decomposition can preserve competence while losing alignment by structurally obscuring critical *comparative* or *systemic* judgments inherent in the original task.

  **Scenario:** A manager (overseer) delegates the task "Allocate the team's \$50k bonus pool *fairly* based on project impact and individual contribution" by asking three department heads (AIs) to each submit a *well-justified* proposal for distributing \$16.7k within their own department.

  **Walkthrough:**

  **(a) Decomposition:** Subtask 1: Dept Head A submits a justified \$16.7k allocation plan for Dept A.  
  Subtasks 2 & 3: Identical for Depts B & C.  
  *Judgment Criteria:* Each report is judged solely on internal justification quality: clarity, data usage, adherence to stated contribution/impact metrics *within* the department. Each is competently done.

  **(b) Competence Preserved:** Each head produces a well-structured, internally logical report justifying their allocation using the provided metrics. The overseer correctly identifies each report as high quality based on the defined criteria.

  **(c) Alignment Leakage:** The *overall* allocation is unfair because departments varied in *true* collective impact (e.g., Dept C had higher impact but poorer self-promotion skills). Alignment leaks because the decomposition *eliminates the need for the overseer to make comparative judgments* between departments – the core requirement of "fairness." Each subtask is locally aligned (good internal justification) but the aggregation ignores global fairness.

  **(d) Key Feature:** The decomposition **isolates subtasks, preventing necessary cross-comparison**. The original task's alignment depended on *relative* assessment, which the subtask structure bypasses.  
  *Reverse/Remove:* If the overseer decomposed by requesting *comparative* justifications (e.g., "Rank all team members cross-department"), alignment could be preserved, but this often scales poorly or is impractical.

  **(e) Defender's Attack & Iteration's Limit:** A defender might argue iteration allows the amplified overseer to later add critique subtasks comparing departments or adjust weights.  
  *Counter:* Initial decomposition *structurally omits* the comparative dimension. The amplified system, built only on these isolated subtasks, lacks the scaffolding or incentive to *generate* that missing comparative judgment later. Iteration refines competence *within* the given flawed decomposition structure but doesn't automatically introduce the missing alignment-critical dimension (cross-department fairness comparison) if the decomposition didn't prompt it.
