  Specific scenes challenge the theories. Conor's nightmare of letting his mom go—his guilt isn't less real because it's a dream. The reader’s tears come from confronting truths through fiction, not deception. The final truth scene shows that fiction can reveal emotional truths we avoid in real life. 

