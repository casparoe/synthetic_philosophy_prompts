  And yes—punt on solutions today. This session is about feeling the bite. Solutions come later.
answer: |-
  Here’s a battle-tested plan for your session, optimized for clarity and avoiding common pitfalls. The sequence builds tension gradually, pre-empts misconceptions, and lands the dilemma through a single robust example.

  ---

  ### **Pedagogical Sequence:**
  1. **Start with the Intuition Everyone Shares (10 min)**  
     **Goal:** Make them *feel* the problem before formalizing it.  
     **Do:** Ask: *"When you stub your toe, does the pain cause you to jerk your foot back?"* Have them articulate why "yes" feels obvious (mental states feel causally potent). Contrast with epiphenomenalism ("What if pain is just a useless shadow?"). **Emphasize:** If mental properties do nothing, ethics/politics (e.g., intentions, reasons) lose causal relevance—a threat to their fields.

  2. **Introduce Nonreductive Physicalism (NRP) via Supervenience (15 min)**  
     **Goal:** Show how NRP tries to preserve mental causation *without* dualism.  
     **Do:** Define supervenience: *"No mental difference without a physical difference."* Use ethics parallels (e.g., moral properties supervene on natural ones). Stress: NRP says mental properties *depend* on physical bases but aren’t reducible to them (like how "being a knife" isn’t reducible to its atomic structure).

  3. **Now Introduce Causal Closure (CC) (15 min)**  
     **Why here?** Premature CC feels unmotivated. Now they see its tension: *"If every physical effect has a physical cause, and mental states cause physical effects, how does this fit?"*  
     **Do:** Define CC: *"For every physical event, there’s a sufficient physical cause at the time it occurs."* Use uncontroversial examples: "The glass shattered because it was struck by a baseball—not because a demon willed it."

  4. **The Exclusion Dilemma (20 min)**  
     **Sequence:**  
     - Pose the conflict: *"If pain (mental) causes withdrawal (physical), but C-fibers firing (physical) also causes withdrawal, and CC says physical causes are sufficient..."*  
     - **Exclusion Principle:** *"No single event has two distinct, sufficient causes unless it’s genuine overdetermination (like two bullets)."*  
     - **The Punch:**  
       - *Option 1:* Mental causes aren’t distinct (reductionism)—but NRP denies this.  
       *Option 2:* Mental causes are excluded (epiphenomenalism).  
       *Option 3:* Overdetermination—but is this plausible?  

  5. **The Worked Example: PAIN → WITHDRAWAL (20 min)**  
     **Why this example?**  
     - **Avoids free will**: Reflexive withdrawal bypasses intentions/decisions.  
     - **Physically unambiguous**: Withdrawal is clearly a physical movement.  
     - **Irresistible intuition**: Pain feels causally efficacious.  
     **Structure the case:**  
     - *Mental cause:* Pain (M).  
     - *Physical cause:* C-fiber firing (P).  
     - *Effect:* Foot withdrawal (E).  
     - **Key moves:**  
       - Grant supervenience: M supervenes on P.  
       - Grant CC: E has a sufficient physical cause (P).  
       - Apply exclusion: If P is sufficient for E, and M ≠ P, then M is excluded unless E is overdetermined.  
     **Crucial feature:** M and P occur at the *same time* (no temporal gap to exploit).

  ---

  ### **Pre-empting Misconceptions:**
  - **"So mental properties do nothing" (Epiphenomenalism)**  
    **Pre-empt at:** Step 1 (intuition) + Step 4 (dilemma).  
    **Say:** *"Exclusion doesn’t say mental properties are useless—it says NRP struggles to explain how they’re *not* useless given physical sufficiency. We’re trying to save them!"*

  - **"This assumes dualism!"**  
    **Pre-empt at:** Step 2 (supervenience).  
    **Say:** *"NRP is explicitly physicalist! Supervenience ensures no ‘ghost in the machine.’ Exclusion attacks NRP *from within* physicalism."*

  - **"Why not overdetermination?"**  
    **Pre-empt at:** Step 4 (exclusion principle).  
    **Do:** Contrast with *real* overdetermination (e.g., two assassins firing simultaneously). Ask: *"Is pain like a second assassin? Or is it dependent on the physical cause?"* Stress: Systematic overdetermination is implausible—mental causes aren’t independent backups.

  ---

  ### **Diagnostic Question:**
  **Ask at the close:**  
  *"If we insist mental properties *do* cause physical effects, what must we deny: Causal Closure, Supervenience, or the Exclusion Principle? And what’s the cost of denying each?"*  
  **Why it works:** Forces them to see the trilemma. Strong answers will identify trade-offs (e.g., "Deny exclusion? But then trivial overdetermination!").

  ---

  ### **What to Refuse to Adjudicate:**
  Openly state: *"Today’s goal isn’t to solve exclusion but to feel its force. We won’t evaluate responses (e.g., Papineau’s strict implication, Shoemaker’s subset causation, or panpsychism) — that’s for future sessions."*  
  **Why:** Prevents digressions and underscores the session’s purpose: exposing the problem’s architecture.

  ---

  ### **Timing Breakdown:**
  - Intro/Intuition (10 min)  
  - Supervenience (15 min)  
  - Causal Closure (15 min)  
  - Exclusion Dilemma (20 min)  
  - Pain Example (20 min)  
  - Misconceptions Q&A (20 min)  
  - Diagnostic Close (10 min)  
  - Buffer (10 min)  

  This flow builds inevitability: The dilemma emerges from *their* intuitions + uncontroversial premises. By using pain-withdrawal, you sidestep agency debates while making exclusion visceral.
