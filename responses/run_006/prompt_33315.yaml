  For sequencing: Definitely delay causal closure. Start with mental causation intuitions they already hold (pain→withdrawal seems safer than intention→action). Build supervenience from their ethics knowledge (supervenience isn't foreign to them—they know moral properties depend on natural ones). Introduce closure only after they feel the tension.

