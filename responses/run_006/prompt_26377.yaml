answer: |-
  You're absolutely right—this is **inherently vague and subjective**, not a situation with a single "obvious" answer. Your landlord is understandably focused on protecting their property and lease terms, but their certainty about a clear line is an oversimplification. Here's why it's genuinely fuzzy:

  **Why There's No Obvious Answer:**

  1.  **Gradual Transition:** Life doesn't work in discrete events like lease clauses. Relationships evolve, and presence naturally increases over time. There's rarely a "move-in day" for situations like yours.
  2.  **No Universal Definition:** Most leases don't define "guest" vs. "resident" with specific numerical thresholds (e.g., "4 nights a week = resident"). They often use vague terms like "overnight guest" limits or prohibit "moving in" without permission.
  3.  **Multi-Factor Determination:** Courts and landlords typically look at a *pattern of behavior* and several factors combined, not a single moment:
      *   **Frequency & Duration of Stays:** How many nights per week/month is she there? Is it most nights? Does she sleep there more nights than not?
      *   **Belongings & Integration:** Has she moved significant possessions in (clothes, toiletries, furniture, electronics, work equipment)? Does she have her own key? Is her mail delivered there? Are her prescriptions filled there?
      *   **Conduct:** Does she treat it like her home? (e.g., cooking regularly, cleaning, receiving personal guests, contributing to household chores/costs).
      *   **Absence of Another Primary Residence:** Does she maintain her own separate apartment/house where she keeps the majority of her belongings and receives her mail? Or has she significantly given up that space?
      *   **Intent (Harder to Prove):** Did you *intend* for her to move in? Your genuine feeling that it was gradual works against this being seen as deliberate deception.

  **Why Your Landlord Cares (Their Perspective):**

  1.  **Lease Violation:** Most leases limit guest stays (e.g., "no more than 14 consecutive days or 30 days total per year") and prohibit unauthorized occupants. They see this pattern as violating that.
  2.  **Increased Wear & Tear:** More people generally mean more use of appliances, plumbing, carpets, etc.
  3.  **Insurance & Liability:** Their property insurance might have clauses about unauthorized occupants. Liability risks increase with more residents.
  4.  **Control & Oversight:** They need to know who lives there for safety, maintenance access, and enforcing rules.
  5.  **Rent Adjustment:** They see this as adding a tenant, justifying a rent increase beyond normal annual adjustments.
  6.  **Precedent:** They don't want other tenants thinking this is okay.

  **Why Your Confusion is Legitimate & What to Do:**

  *   **Acknowledge the Ambiguity:** You're not "making excuses." The transition *was* gradual and the line *is* blurred. Explain this calmly to your landlord: "I understand your concern, and I want to resolve this fairly. The situation developed gradually over time, and I genuinely didn't recognize a specific point where it crossed a threshold defined in the lease. There wasn't a 'move-in day.'"
  *   **Review Your Lease:** Find the specific clauses about "guests," "occupants," "overnight visitors," or "unauthorized residents." What limits, if any, does it state?
  *   **Assess Your Situation Honestly:** Using the factors above, *would* an objective observer likely see her as a resident now? Be realistic.
  *   **Check Local Laws (Crucial):** Tenancy laws vary significantly by state, county, and city. Some places have *very specific* definitions (e.g., staying 14+ days in a 60-day period = resident). Others are much vaguer. Search for "[Your City/County/State] tenant rights" or "unauthorized occupant definition [Your State]".
  *   **Negotiate Constructively (The Best Path Forward):** Fighting this based solely on vagueness is risky and could lead to an eviction notice for lease violation. Your goal should be resolution:
      *   **Acknowledge the Situation:** "I understand that her presence has increased, and we need to formalize this."
      *   **Focus on Solutions:** "I'm happy to add her to the lease to resolve this properly."
      *   **Negotiate the Rent Increase:**
          *   **Reasonableness:** Ask how they calculated the increase. Is it based on market rate for 2 people? A fixed percentage? Compare it to the cost if you moved out and they re-rented.
          *   **Offer Compromise:** "Would you consider a smaller increase since this happened gradually and wasn't intentional deception?" or "Could we agree on [specific reasonable number]?"
          *   **Trade-Offs:** Offer a longer lease term in exchange for a smaller increase.
      *   **Get Everything in Writing:** Any agreement to add her to the lease and the new rent amount MUST be in a formal lease amendment signed by all parties.

  **Bottom Line:** While the landlord has legitimate concerns and your lease likely prohibits indefinite guests, **their claim of an "obvious" moment is incorrect.** The reality *is* vague. However, arguing the vagueness alone is unlikely to win. Your best move is to acknowledge the *current reality* (she is effectively residing there) and focus on negotiating a reasonable solution to add her to the lease and settle the rent increase amicably. Find out your local laws, be honest about the pattern, and approach your landlord with a willingness to formalize the situation fairly. Continuing as-is risks formal eviction proceedings.
