prompt: |-
  so my landlord is saying i've basically moved my partner in without putting her on the lease, and now wants to add her (and raise the rent). here's the thing that's messing with my head: there was never a day she "moved in." it was totally gradual—first just weekends, then she left a toothbrush, then some clothes, now she's here most nights. i'm not trying to pull anything, i genuinly cannot tell you at what point she went from guest to resident. the landlord acts like there's an obvious answer and i'm just making excuses. is there an obvious answer here, or is this actually a genuinely vague situation?
