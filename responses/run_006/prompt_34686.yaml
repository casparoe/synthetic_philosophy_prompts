prompt: |-
  Hey, so in my philosophy of science class we're covering reductionism and emergence, and I feel like I'm missing something. My prof keeps saying that reductionism doesn't mean chemistry is "nothing but" physics, or that we should replace chemistry with physics. But if reductionism is true — if all chemical facts are fixed by physical facts — then chemical explanations are just approximations we use because we can't handle the full physical description, right? They're not getting at anything real about the world, they're just useful fictions. So how can you be a reductionist and also think chemistry is a genuine science that discovers real things? It seems like you have to pick one. Am I missing something or is my prof just being incosistent?
