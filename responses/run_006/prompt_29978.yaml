prompt: |-
  I'm working on a longform piece about the foundations of probability, and I keep coming back to Bertrand's paradox as the problem that resists settlement. Before I interview any more researchers about their preferred resolutions, I want the specification of what a resolution is actually supposed to deliver. Could you write me the desiderata: what any adequate treatment of Bertrand's paradox — and by extension, any reformed version of the principle of indifference — must accomplish?

  I need the list of requirements, with the case or consideration behind each. A resolution might need to say why the three classical chord-selection methods yield different answers without simply stipulating that one parameterization is correct. It might need to generalize beyond the circle to other geometric settings where the same indeterminacy arises, or to non-geometric uses of the principle of indifference — partitioning outcome spaces in discrete probability, assigning priors over competing models. It might need to respect that the principle does genuine normative work in some contexts and cannot be abandoned wholesale without leaving a gap in how we justify prior distributions. It might need to distinguish between cases where indifference is merely a convenience and cases where it is epistemically mandatory, and to say what marks the boundary.

  I am especially interested in which requirements are non-negotiable and which reflect the commitments of particular camps — objective Bayesians, proponents of symmetry-based or group-invariance approaches, those who take the real lesson to be that probability is inherently model-relative, and so on. And if some subset of the requirements turns out to be jointly unsatisfiable — if, for instance, any rule that picks a unique distribution in the chord problem necessarily fails to handle other paradoxes of the same structure, or if satisfying both geometric generality and normative force requires a move that undercuts the principle's original motivation — that is the part I most need flagged. That would mean the desiderata list itself is the result, and the field's disagreement is not about which resolution is correct but about which requirement to drop.

  A table format would work well if it helps, but prose is fine. The weight should fall on the criteria and their motivating cases rather than on scoring existing proposals — though a brief note on which single requirement does the most to exclude the standard resolutions would not go amiss.
reasoning: |-
  Okay, the user is writing a longform piece on the foundations of probability, specifically focusing on Bertrand's paradox and the principle of indifference. They want a clear set of desiderata that any resolution must meet. Let me start by understanding their deeper needs.

  They mentioned that Bertrand's paradox resists settlement, so they need a framework to evaluate different resolutions. The user wants to interview researchers but first needs to know what an adequate resolution should achieve. They’re looking for a list of requirements with motivations behind each, covering why different methods yield different answers, generalization to other contexts, the principle's normative role, and where indifference is mandatory versus convenient.

  The user is interested in which criteria are non-negotiable versus camp-specific, and if some requirements conflict. Highlighting trade-offs is crucial here. They also want to know which requirement excludes most standard resolutions. 

  Let me break down the key points. First, explain the paradox: different ways to define "random chord" lead to different probabilities. The core issue is the principle of indifference leading to inconsistencies. 

  Desiderata should include:
  1. **Diagnostic Power**: Why do the methods differ? Need to show that each method implies a different distribution, not just label one correct.
  2. **Scope**: Must apply beyond circles to other shapes and even non-geometric cases like priors in model selection. 
  3. **Normative Foundation**: The principle isn't useless; it's needed for justifying priors. A resolution can't discard it entirely but must clarify when it's valid.
  4. **Demarcation**: Distinguish between proper and misapplied indifference. What makes a correct parameterization?
  5. **Non-Arbitrariness**: Avoid ad hoc choices. The solution shouldn't depend on arbitrary decisions.
  6. **Uniqueness**: Should ideally specify a single correct probability, but this might be contentious. Some camps might accept non-unique solutions.
  7. **Methodological Generality**: Work across different applications without being case-specific.
  8. **Philosophical Neutrality**: Not presuppose a specific interpretation of probability, though this might be tough.

  Now, considering conflicts. For instance, requiring both uniqueness and methodological generality might clash. If a resolution enforces uniqueness in Bertrand's paradox, it might fail in other geometries. Group invariance approaches like Jaynes' might work for circles but not for squares, so uniqueness and scope conflict. Also, normative force vs. diagnostic power: explaining why indifference fails might undermine its normative role.

  The user might be hinting that the desiderata themselves reveal why the paradox isn't resolved—researchers prioritize different requirements. For example, objective Bayesians push for uniqueness, while subjectivists might drop it. Highlighting which requirement is the biggest hurdle, like demarcation, since no consensus on what makes a parameterization correct. Jaynes' symmetry approach tries but falls short on scope.

  Need to ensure the list covers all angles: geometric and non-geometric cases, justification for when to apply indifference, and the tension between resolving the paradox and preserving the principle's utility. Also, note that some requirements are mandatory (like diagnostic power) while others (like uniqueness) are camp-specific. The key takeaway might be that the conflict between desiderata means the field's disagreement is about which criteria to prioritize, not just the solutions.
answer: |-
  Below is a structured desiderata list for evaluating resolutions of Bertrand's paradox and reforms of the Principle of Indifference (PoI). The table summarizes core requirements, their motivations, and their status (non-negotiable vs. camp-specific), followed by analysis of tensions and exclusions. This framework prioritizes foundational clarity over cataloging existing solutions.

  ---

  ### **Desiderata for Resolving Bertrand's Paradox & Reforming the Principle of Indifference**

  | **Requirement**                     | **Motivation & Key Cases**                                                                                                                                                             | **Status**                                       |
  |-------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------|
  | **1. Diagnostic Power**            | **Why:** Must explain *why* the three classical methods (endpoints, radial, midpoint) yield different probabilities (1/2, 1/3, 1/4) without circularly privileging one parameterization. **Case:** Bertrand's original circle problem. | **Non-negotiable** (Core to the paradox)        |
  | **2. Scope Generality**            | **Why:** Must extend beyond circles to other geometries (e.g., squares, spheres) and non-geometric spaces (e.g., partitioning discrete outcomes, assigning priors to scientific models). **Cases:** Von Kries' wine-water paradox; assigning priors to cosmological constants. | **Non-negotiable** (Tests universality)         |
  | **3. Normative Salvageability**    | **Why:** PoI isn't merely heuristic; it underpins objective Bayesianism, maximum entropy, and symmetry arguments (e.g., coin tosses). Resolution must preserve its *epistemic force* where valid. **Cases:** Justifying uniform priors for fair dice or isotropic spaces. | **Conditionally non-negotiable** (Rejects eliminativism) |
  | **4. Demarcation Criterion**       | **Why:** Must distinguish *legitimate* (e.g., rotational symmetry) from *illegitimate* (e.g., chord midpoint density) applications of indifference. **Case:** Why is "random chord" ill-defined, but "random point on a circle" valid for a spinner? | **High-priority** (Central to most reforms)     |
  | **5. Non-Arbitrariness**           | **Why:** The solution shouldn't rely on ad hoc choices (e.g., "use radius because circles are symmetric"). **Case:** Jaynes' maximum ignorance approach for circles works but fails for squares. | **Non-negotiable** (Avoids question-begging)    |
  | **6. Uniqueness**                  | **Why:** Ideally specifies a *single* correct probability for "random chord." **Case:** Objective Bayesians demand unique rational priors; frequentists expect consensus. | **Camp-specific** (Rejected by subjectivists/model-relativists) |
  | **7. Methodological Transparency** | **Why:** Must provide a replicable procedure for applying PoI to new problems. **Case:** How should we assign "random triangles" in a circle? Or priors over unbounded parameters? | **Non-negotiable** (Ensures applicability)      |
  | **8. Philosophical Neutrality**    | **Why:** Should not presuppose specific interpretations of probability (e.g., frequentist, Bayesian). **Case:** Paradox arises in both epistemic and physical probability contexts. | **Aspirational** (Rarely achieved)              |

  ---

  ### **Key Tensions & Trade-offs**
  1. **Uniqueness vs. Scope Generality**:  
     Enforcing uniqueness (e.g., via Jaynes' group invariance) often fails in asymmetric spaces (e.g., squares). *Trade-off:* Uniqueness may require restricting PoI to highly symmetric contexts.  
  2. **Normative Salvageability vs. Diagnostic Power**:  
     Fully explaining the paradox may reveal PoI as context-dependent, undermining its normative universality. *Trade-off:* Resolutions preserving PoI’s strength (e.g., symmetry principles) risk underdiagnosing the paradox.  
  3. **Demarcation vs. Non-Arbitrariness**:  
     Demarcation criteria (e.g., "natural measure," algorithmic information) often appear arbitrary. *Trade-off:* Rigid rules (e.g., "use Haar measure") may seem ad hoc in non-group settings.  

  ---

  ### **Which Requirement Excludes the Most Resolutions?**  
  **Demarcation Criterion** is the primary bottleneck.  
  - **Classical PoI**: Fails outright (no demarcation).  
  - **Jaynes' Group Invariance**: Demarcates via symmetry but fails **Scope Generality** (e.g., squares lack rotational symmetry).  
  - **Frequentist Operationalism** (e.g., "define a physical experiment"): Avoids arbitrariness but abandons **Normative Salvageability** (PoI becomes descriptive, not epistemic).  
  - **Subjectivist/Model-Relativist**: Rejects **Uniqueness** and **Diagnostic Power** (differences are features, not bugs).  

  ---

  ### **The Core Conflict: What Must Be Surrendered?**  
  The desiderata are **jointly unsatisfiable** in their strongest forms. Resolutions force a choice:  
  - **Keep Uniqueness & Normative Force?** → Sacrifice **Scope Generality** (limit PoI to symmetric spaces).  
  - **Keep Scope Generality & Diagnostic Power?** → Sacrifice **Uniqueness** and weaken **Normative Force** (PoI becomes model-relative).  
  - **Keep Non-Arbitrariness & Demarcation?** → Risk **Philosophical Neutrality** (e.g., impose Bayesianism via maximum entropy).  

  This explains the field's stalemate: **Disagreement centers on which desiderata to prioritize, not technical fixes.** Objectivists (e.g., Jaynes) favor Uniqueness/Normative Force; model-relativists (e.g., de Finetti) favor Scope/Diagnostic Power; pragmatists (e.g., algorithmic probability) seek new demarcations. The paradox endures because no resolution satisfies all eight criteria without dilution. The desiderata list *is* the map of the battlefield.  

  ---  
  **Recommendation for Interviews**: Press researchers on which requirements they deem *dispensable*. Their concessions will reveal their foundational commitments more than their favored resolution.
