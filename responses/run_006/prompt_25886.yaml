prompt: |-
  I'm a philosophy professor consulting for a philanthropic foundation, and I'd like you to produce a document I can share with their ethics committee. Please adopt the role of a senior scholar with deep expertise in Peter Singer's work on duties of rescue, the drowning-child argument, and the surrounding literature on moral demandingness and effective altruism.

  The foundation has a broad humanitarian mandate. Its ethics committee meets monthly to review intervention proposals — famine relief, emergency medical aid, disaster response, long-term health programs — and decides which to fund. The committee members are lawyers, physicians, and development professionals, not philosophers. They currently lack a shared framework for determining when a proposal triggers something like a duty of rescue and when it does not, and their decisions have been inconsistent. They have asked me for a procedure they can actually use.

  I want you to design a decision procedure — a structured sequence of questions with criteria for what counts as a sufficient answer at each step — that the committee can apply to a proposal to determine whether the foundation has a duty to intervene, and if so, with what degree of urgency and commitment. The procedure should be usable in a two-hour meeting by non-philosophers. It must distinguish between steps that turn on empirical facts (and say what facts are needed), steps that turn on normative judgment (and mark them as such), and steps where the procedure cannot resolve the question and the committee must deliberate.

  The procedure must handle at least these complications:
  - Uncertainty about whether the intervention will succeed (e.g., aid that may be intercepted, diverted, or wasted).
  - Situations where many other actors could also intervene but may or may not do so.
  - Chronic rather than acute need — not a drowning child but a population living in persistent malnutrition.
  - Costs to the foundation that are not purely financial: reputational risk, staff burnout, opportunity costs in other program areas.

  Once you have laid out the procedure, apply it step by step to two proposals:
  1. A request to fund emergency food airlifts to a region experiencing a sudden famine, where the best available estimate is a 60% chance the food reaches civilians and a 40% chance it is seized by armed groups.
  2. A request to fund a five-year deworming initiative in a region where the long-term developmental benefits are genuinely contested among economists — the evidence is mixed and reasonable people disagree about what it shows.

  Then identify at least one case where the procedure yields an answer the committee will find uncomfortable — either an intervention they would have funded that the procedure says they are not obligated to fund, or an intervention they would have dismissed that the procedure says they are obligated to fund — and explain what feature of the procedure produces that result.

  Finally, tell me what the procedure cannot do: what kinds of cases it is not designed to handle, what moral considerations it deliberately sets aside, and where someone might reasonably reject the entire framework rather than dispute a particular step.

  Before you write the procedure itself, I want you to begin by mapping the conceptual terrain. Think through what Singer's drowning-child argument actually establishes and what it leaves open, which standard objections (physical distance, diffusion of responsibility, demandingness, the difference between perfect and imperfect duties) the procedure must address and which it can set aside, and what the hardest translation problems will be when moving from the philosophical argument to an operational checklist. Then proceed to the procedure.
reasoning: |-
  Hmm, this is a fascinating and challenging request. The user is a philosophy professor consulting for a philanthropic foundation's ethics committee. They need a practical decision procedure based on Peter Singer's duty of rescue framework that non-philosophers can apply in real-world grant decisions. 

  First, I need to map the conceptual terrain carefully. Singer's drowning-child argument establishes that if we can prevent something very bad without sacrificing anything of comparable moral importance, we ought to do it. But translating this into an operational checklist requires addressing several complications: uncertainty about intervention success (like the 60% chance of food reaching civilians), diffusion of responsibility (many actors could help but don't), chronic vs acute need (drowning child vs persistent malnutrition), and non-financial costs like reputational risk.

  The hardest translation problems will be:
  - Quantifying "moral importance" when comparing harms prevented versus costs borne
  - Handling probabilistic outcomes (how to weigh 60% chance of saving lives)
  - Defining "reasonable" when evidence is genuinely contested (like the deworming case)
  - Accounting for institutional constraints without letting them dominate moral obligations

  For the decision procedure itself, I'll design a 5-step flowchart:
  1) Severity assessment (how bad is the harm?)
  2) Preventability assessment (can we actually change outcomes?)
  3) Cost assessment (what would intervention require?)
  4) Comparative assessment (is cost disproportionate to harm prevented?)
  5) Overriding factors (are there exceptional reasons not to act?)

  Each step will specify what evidence is needed, what counts as sufficient justification, and where normative judgment is required. For the two test cases:
  - The famine relief passes step 1 (severe harm) but gets stuck at step 2 due to the 40% seizure risk - this will require committee deliberation
  - The deworming program may fail step 4 if the contested evidence suggests costs outweigh developmental benefits

  The uncomfortable case will be chronic malnutrition versus acute disaster - the procedure may prioritize the statistically worse outcome even if less emotionally compelling. This exposes the utilitarian calculus at the procedure's core.

  Finally, I'll clarify limitations: this framework deliberately sets aside non-consequentialist considerations (rights, duties, special relationships) and can't resolve fundamental disagreements about the value of statistical lives. Some committee members might reject the entire consequentialist approach.

  The key is making philosophical distinctions actionable without oversimplifying - for example, creating clear thresholds for "severe harm" and "disproportionate cost" that lawyers and doctors can apply consistently.
answer: |-
  ## Decision Procedure for Humanitarian Intervention: Grounded in Duties of Rescue & Effective Altruism

  **Prepared for:** Ethics Committee, [Foundation Name]
  **Author:** Dr. [Your Name], Senior Scholar in Applied Ethics & Effective Altruism
  **Date:** October 26, 2023

  ---

  ### I. Conceptual Terrain: Mapping Singer & Key Challenges

  **Core Insight (Singer's Drowning Child):**
  Singer argues that if it is in our power to prevent something very bad from happening, without thereby sacrificing anything *of comparable moral importance*, we ought, morally, to do it. Proximity or the ability to identify a specific victim is irrelevant. The core moral force stems from the *severity of the harm*, the *capacity to prevent it*, and the *cost to the agent*.

  **What it Establishes:**
  1.  **Obligation Beyond Proximity:** Physical distance does not negate moral responsibility for severe, preventable suffering.
  2.  **Obligation Despite Diffusion:** The fact that many *could* act does not absolve *me* (or *us*) of the obligation to act if others are not doing so.
  3.  **Cost-Benefit Imperative:** Obligation hinges on the harm prevented vs. the cost incurred. "Comparable moral importance" demands a serious assessment of cost, not mere inconvenience.
  4.  **Scope:** Applies to individuals and, by extension, institutions like foundations whose *raison d'être* is addressing suffering.

  **What it Leaves Open / Key Objections & Complications:**
  1.  **"Comparable Moral Importance":** Defining this threshold is inherently normative and contestable. How much cost is too much?
  2.  **Demandingness:** Singer's principle can be extremely demanding. How much sacrifice is required? The procedure must make this operational without collapsing into "anything goes" or "nothing required."
  3.  **Uncertainty:** The drowning child is certain. Real-world interventions face probabilities of failure, diversion, or unintended consequences. How do we weigh probabilistic benefits/costs?
  4.  **Chronic vs. Acute Harm:** Is preventing a death from famine today morally equivalent to preventing a death from chronic malnutrition *later* via developmental investment? Both are severe, but urgency differs.
  5.  **Imperfect Duties:** Kantian objections highlight duties to oneself or specific obligations that might conflict. The procedure focuses on the foundation's core *humanitarian mandate* as its defining "project," making rescue duties more salient.
  6.  **Institutional Realities:** Foundations are not omnipotent individuals. They face constraints like reputation, staff capacity, donor relations, and opportunity costs across programs. These *are* costs within "comparable moral importance."

  **Translation Challenges:**
  *   **From Intuition to Calculation:** Replacing the visceral "drowning child" with abstract metrics (e.g., DALYs, QALYs, cost-effectiveness ratios) can feel alienating. The procedure must bridge this gap.
  *   **Quantifying the Unquantifiable:** How to weigh reputational risk against lives saved? How to value staff well-being?
  *   **Handling Contested Evidence:** What constitutes "reasonable" disagreement? When does uncertainty negate obligation?
  *   **Avoiding Paralysis:** Over-analysis of uncertainty or cost can lead to inaction. The procedure needs clear thresholds for "sufficient evidence" and "acceptable cost."

  ---

  ### II. The Decision Procedure: "Rescue Assessment Framework" (RAF)

  **Goal:** Determine if the Foundation has a **duty to intervene** in a specific proposal, and if so, the **level of urgency and commitment** required.  
  **Format:** Sequential questions. Committee progresses step-by-step. A "No" at Steps 1-3 generally means *no duty to fund this specific proposal*. A "Yes" at Step 4 triggers deliberation on scope/scale.  
  **Key:**  
  *   **[E]:** Primarily Empirical - Requires evidence/facts. Committee must establish sufficient evidence exists.  
  *   **[N]:** Primarily Normative - Requires value judgment. Committee must deliberate and reach consensus.  
  *   **[D]:** Deliberation Required - Procedure doesn't dictate; committee must weigh factors.

  **STEP 1: SEVERITY ASSESSMENT [N/D]**
  *   **Question:** Does the proposal target the prevention of *severe, fundamental harm* (e.g., death, catastrophic disability, extreme deprivation of basic needs like food/water/shelter/medical care) to identifiable individuals or a group?
      *   *Sufficient Answer (Yes):* Harm aligns with core foundation mandate (humanitarian relief/health) and involves deprivation threatening survival or basic human functioning. Chronic harms (persistent malnutrition, endemic disease) qualify if they cause severe, ongoing suffering or premature death. *Committee deliberation needed to confirm severity aligns with mandate.*
      *   *Sufficient Answer (No):* Harm is primarily non-physical (e.g., cultural loss), non-severe (e.g., moderate income reduction), or speculative/far future. *No duty.*
  *   **Output:** If "Yes," proceed to Step 2. If "No," *no duty to fund this proposal.*

  **STEP 2: PREVENTABILITY & CAUSAL PATHWAY ASSESSMENT [E/D]**
  *   **Question:** Is there a *reasonable, evidence-based expectation* that *this specific intervention* will *directly and significantly* prevent or alleviate the identified severe harm?
      *   *Required Facts [E]:* Evidence for intervention efficacy; mechanisms of action; risks of failure, diversion, or harm; track record of implementing partner; contextual barriers (logistics, politics, security). Quantify probabilities where possible (e.g., 60% chance food reaches civilians).
      *   *Normative Threshold [N]:* What constitutes "reasonable expectation"? (e.g., >50% chance of significant net positive impact? Consensus among reputable experts? Strong evidence base even if contested?).
      *   *Sufficient Answer (Yes):* Credible evidence (studies, expert consensus, past performance) suggests the intervention is *likely* (>50% chance) to achieve significant net harm reduction, *even considering risks*. *Proceed to Step 3.*
      *   *Sufficient Answer (No):* Evidence is weak, contradictory, or shows high likelihood (>50%) of failure or significant net harm. Uncertainty is so profound that no reasonable expectation of success exists. *No duty.*
      *   *Deliberation Required [D]:* If evidence is mixed or quality is poor but suggests *some* potential. Committee must weigh: Is the *potential* benefit large enough? Is the cost low enough? Is there significant downside risk? Can due diligence reduce uncertainty sufficiently? **Decision Point:** Proceed to Step 3 if potential justifies further cost assessment; else *no duty*.

  **STEP 3: FOUNDATION CAPACITY & COST ASSESSMENT [E/N]**
  *   **Question:** Can the foundation implement or fund this intervention *without sacrificing resources of comparable moral importance to the harm being prevented?*
      *   *Required Facts [E]:* Total financial cost; required staff time/expertise; duration; reputational risks (based on context, partner, perceived success/failure probability); impact on staff morale/burnout; impact on other foundation programs (opportunity cost - what *won't* get funded?).
      *   *Normative Judgment [N]:* Weighing the *value* of the harm prevented (Step 1) against the *costs* incurred. Key considerations:
          *   *Financial Cost-Effectiveness:* How much harm is prevented per dollar? (Use metrics like cost per life saved, cost per DALY averted if appropriate/available).
          *   *Non-Financial Costs:* How severe is the reputational risk? How significant is the staff burden? How valuable are the *next best alternative uses* of these resources (opportunity cost)? Does this intervention undermine the foundation's long-term ability to fulfill its mission?
      *   *Sufficient Answer (Yes):* The *expected net harm prevented* (factoring in Step 2 probabilities) significantly outweighs the *total expected cost* (financial + non-financial + opportunity cost) to the foundation. The cost is not "morally comparable" to the harm averted. *Proceed to Step 4.*
      *   *Sufficient Answer (No):* The costs (especially opportunity cost of neglecting other severe needs or jeopardizing core operations) are deemed comparable to or greater than the expected harm prevented. *No duty to fund this specific proposal.*
      *   *Deliberation Required [D]:* Close call on costs vs. benefits. Committee must explicitly weigh: Is the harm so severe that even high cost is justified? Are non-financial costs truly prohibitive? Can costs be mitigated?

  **STEP 4: URGENCY, SCALE & COMPETING CLAIMS [N/D]**
  *   **Question (If "Yes" at Step 3):** Given the foundation's resources and other potential interventions addressing severe harm, what is the *required scope and urgency* of our response?
      *   *Factors for Deliberation [D]:*
          *   *Acuity:* Is harm immediate and irreversible (famine now) vs. chronic but severe (persistent malnutrition)? Higher urgency for acute crises.
          *   *Scale of Need:* How many are affected? How severe is *each* individual's plight?
          *   *Funding Gap:* How likely are other actors (governments, other NGOs) to intervene *sufficiently* and *timely*? (Do NOT assume others *will* act; assess evidence). *Diffusion of responsibility does NOT negate duty if others are NOT acting.*
          *   *Cost-Effectiveness Comparison:* How does this proposal compare to the *best alternative* use of these resources? (Requires awareness of other funding opportunities).
          *   *Foundation Capacity & Mandate:* Does this align perfectly with expertise? Can we realistically deliver at the needed scale?
      *   *Output:* A judgment on the **Level of Obligation**:
          *   **High Obligation (Act Now, Prioritize):** Acute crisis, large scale, high cost-effectiveness, significant funding gap, strong alignment. Requires significant commitment; displace lower-priority work.
          *   **Moderate Obligation (Act, Integrate):** Severe harm, good cost-effectiveness, but perhaps less acute or competing with similarly strong claims. Fund within normal parameters/budget cycle if possible.
          *   **Low Obligation (Optional/Reject):** While preventing harm, other interventions clearly offer significantly greater impact per resource unit, or costs are borderline acceptable only at a much smaller scale. *May* fund if resources permit without sacrificing better options, but *no strong duty*.
          *   **No Obligation (Reject):** Re-evaluation shows costs *are* comparable/morally significant after full assessment (rare after Step 3 "Yes").

  ---

  ### III. Applying the RAF: Test Cases

  **Proposal 1: Emergency Food Airlifts to Sudden Famine Region (60% success chance)**
  1.  **Severity:** **YES [N/D]** - Famine causes death and catastrophic suffering (severe harm). Core humanitarian mandate.
  2.  **Preventability:** **[D]** Evidence shows *potential* for significant impact (saving lives), but with high risk (40% seizure). *Is expectation "reasonable"?* Potential benefit (lives saved) is enormous. *Deliberation:* Committee judges that despite risk, the *potential magnitude* of good justifies proceeding to assess costs. **Proceed to Step 3.**
  3.  **Cost:** **[E/N/D]** High financial cost (airlifts). High reputational risk (40% chance of aid fueling conflict/armed groups). High staff stress/risk. Opportunity cost (other emergency appeals). *Normative Weighing:* Is the *expected* harm prevented (lives saved * 0.6) worth these high costs + risks? *Deliberation:* Likely contentious. Some argue expected lives saved justify high costs/risks. Others argue reputational risk/opportunity cost are too high. **Assume Committee judges "Yes" - expected benefit outweighs cost. Proceed to Step 4.**
  4.  **Urgency/Scale:** **[D]** *Acuity:* EXTREME (people starving *now*). *Scale:* Large population. *Funding Gap:* Unknown but likely significant (crisis unfolding). *Cost-Effectiveness:* Cost per life saved may be high due to airlift costs and risk, but alternative ways to help may be blocked. *Comparison:* Are there *more reliable* ways to save lives in this region or elsewhere right now? *Capacity:* Foundation has logistics expertise? *Judgment:* **HIGH OBLIGATION** due to acuity and scale, *despite* risks. Requires urgent, significant commitment. Mitigation strategies (negotiating access, partnering) essential.

  **Proposal 2: Five-Year Deworming Initiative (Contested Long-Term Benefits)**
  1.  **Severity:** **YES [N/D]** - Chronic parasitic infection causes malnutrition, stunting, pain, reduced cognitive development, and increased mortality risk. Severe harm, aligns with health mandate.
  2.  **Preventability:** **[D]** Evidence for *long-term developmental benefits* (primary justification) is genuinely contested. Evidence for *direct health relief* (reducing worm burden, alleviating symptoms) is stronger. *Is expectation "reasonable"?* Expectation of direct health benefit is reasonable. Expectation of significant long-term developmental/cognitive impact is uncertain. *Deliberation:* Committee judges expectation of *direct health benefit* (reducing suffering, potentially some mortality) is sufficient to proceed for cost assessment. **Proceed to Step 3.**
  3.  **Cost:** **[E/N]** Moderate financial cost spread over years. Low reputational risk (non-controversial intervention). Moderate staff time (management). High opportunity cost (long-term commitment locks funds). *Normative Weighing:* Compare *expected* harm prevented (direct health benefits + *discounted* potential developmental benefits given uncertainty) vs. costs (financial + opportunity cost). *Judgment:* **Likely YES** - Direct health benefits at low cost per treatment are significant, even if developmental benefits are uncertain. Costs are manageable/non-comparable. **Proceed to Step 4.**
  4.  **Urgency/Scale:** **[D]** *Acuity:* LOW (Chronic issue). *Scale:* Large population affected chronically. *Funding Gap:* Unclear - deworming is common, but scale of need may be unmet. *Cost-Effectiveness:* Potentially *very* high for direct health benefits; highly uncertain for long-term benefits. *Comparison:* Are there interventions addressing *more severe* or *more certain* harms with similar or better cost-effectiveness? (e.g., vaccinations, bed nets). *Capacity:* Foundation has health program expertise. *Judgment:* **MODERATE OBLIGATION.** Worthy of funding, fits mandate, cost-effective for direct benefits. But lower urgency than acute crises. Fund within planned health budget if possible, prioritize over less cost-effective chronic programs. Not necessarily a funding priority over acute emergencies or proven high-impact interventions.

  ---

  ### IV. Uncomfortable Result: The Chronic vs. Acute Dilemma

  *   **Scenario:** The foundation receives two proposals simultaneously:
      *   **Proposal A (Acute):** Rescue boat for refugees drowning *right now* in the Mediterranean. High cost, high chance of saving ~100 lives immediately. High reputational risk (political backlash).
      *   **Proposal B (Chronic):** Scale up a proven, highly cost-effective bed net distribution program in a malaria-endemic region. Prevents an estimated 500 child deaths *over the next year* for the same cost as Proposal A. Lower reputational risk.
  *   **Committee Intuition:** May feel a stronger *immediate duty* to fund Proposal A (drowning child analogue).
  *   **RAF Result:** The RAF is likely to assign **HIGH OBLIGATION** to *both*. However, forced to choose due to resource constraints (Step 4), the RAF prioritizes **Proposal B**.
  *   **Why? (Feature of the Procedure):**
      *   **Step 3 (Cost Assessment):** The *expected harm prevented* (500 deaths vs. 100 deaths) is significantly larger for Proposal B.
      *   **Step 4 (Comparative Cost-Effectiveness):** Proposal B prevents far more death per dollar.
      *   **Step 4 (Urgency):** While Proposal A is more *immediately* urgent for the specific individuals, Proposal B addresses a larger-scale catastrophe unfolding continuously. The RAF quantifies the *scale of preventable harm* over the relevant timeframe.
  *   **Uncomfortable Reality:** The procedure prioritizes saving the greater number of lives, even if they are not immediately visible and the intervention feels less like a dramatic "rescue." This highlights the demanding, counter-intuitive, but logically consistent implication of Singer's principle and cost-effectiveness analysis central to the RAF.

  ---

  ### V. Limitations of the RAF

  1.  **Non-Consequentialist Values:** The RAF is fundamentally consequentialist and welfarist. It deliberately sets aside:
      *   **Deontological Constraints:** It doesn't incorporate absolute rules (e.g., "never collaborate with regime X," even if it's the only way to reach starving civilians).
      *   **Rights-Based Approaches:** It focuses on harm prevention, not necessarily fulfilling specific rights claims.
      *   **Relational Duties:** It doesn't prioritize beneficiaries based on special relationships (e.g., nationals, historical ties) unless incorporated into the mandate at Step 1.
      *   **Symbolic Value or Justice:** An intervention might be funded/not funded based purely on expected harm reduction, even if it has important symbolic value for justice or addresses a historical wrong inefficiently.
  2.  **Value Pluralism:** The RAF assumes the foundation's goal is maximizing the reduction of severe suffering/premature death. It cannot adjudicate if the committee fundamentally values other goods (e.g., cultural preservation, political advocacy) equally or more highly in some contexts.
  3.  **Intractable Uncertainty:** When evidence is profoundly weak or the causal chain is extraordinarily complex (e.g., long-term peacebuilding impact), the RAF (Step 2) may lead to paralysis or arbitrary thresholds.
  4.  **Valuing Statistical Lives vs. Identified Lives:** The procedure treats preventing the death of an unidentified statistical life (e.g., via deworming) as morally equivalent to saving an identified life (e.g., the refugee), which clashes with powerful psychological intuitions some committee members may hold.
  5.  **Demandingness Threshold:** While Step 3 incorporates costs, defining "comparable moral importance" remains deeply normative. Some may find even the moderated demands of the RAF too high; others may find it too lenient.
  6.  **Rejection Grounds:** Someone could reasonably reject the entire RAF framework because:
      *   They reject consequentialism as a sufficient moral theory.
      *   They believe special relationships or national borders create primary duties that override global need.
      *   They believe the foundation has a specific mission (e.g., local arts) that precludes these kinds of rescue calculations.
      *   They object to quantifying suffering or comparing lives in cost-effectiveness terms as inherently dehumanizing.

  ---

  This Rescue Assessment Framework (RAF) provides a structured, actionable, and philosophically grounded procedure for your Ethics Committee. It requires rigorous evidence gathering, honest assessment of costs and risks, and difficult normative judgments, but it offers a consistent lens through which to evaluate the foundation's duties in the face of severe suffering. It translates Singer’s powerful insight into operational reality while transparently acknowledging its limitations and the demanding choices it may present.
