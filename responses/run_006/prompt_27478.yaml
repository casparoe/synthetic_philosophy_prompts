prompt: |-
  ok so I've been going back and forth on the realism debate in mechanistic interpretability and I think I need to step back and get clear on what the criteria even are before I pick a side. 

  the question is basically: when we find a feature or a direction in a neural network using some interpretability method (SAEs, probes, whatever), are we discovering a representation that's really "in" the network, or are we just imposing structure that's useful for us to talk about the network but doesn't correspond to anything the network itself is doing?

  I want the desiderata. What does an adequate theory of neural network representations have to deliver? Not a theory itself — I want the spec that any candidate theory has to meet before I even evaluate it. 

  Specifically I want:

  - The cases it has to handle. Like, a single neuron that fires for multiple unrelated concepts (polysemanticity), features that only show up in superposition, the case where a probe finds something but ablation doesn't change behavior, the case where two different methods find incompatible features and both seem well-supported. What are all the awkward cases the theory can't just wave away?

  - The distinctions it has to respect. For example, the difference between "this feature predicts behavior" and "the network actually uses this feature." Or the difference between a representation being real versus being useful to talk about. What distinctions does the theory collapse at its peril?

  - What counts as evidence for or against realism here? If I say "yes, the features are real representations," what kind of thing would prove me wrong? And if I say "no, they're just our projections," what would prove me wrong? A theory that can't be wrong isn't a theory.

  - Which of these desiderata are negotiable and which aren't. I suspect some of what people demand from a theory of representations is actually just their favorite interpretability method's assumptions dressed up as requirements. Flag those.

  - And the big one: are any pairs of these requirements jointly unsatisfiable? If the list itself contains a contradiction, I want to know that before I spend six months trying to satisfy all of it.

  Don't score existing views against the list — I'll do that myself. I just want the list, with the case or argument behind each item, and a clear statement of which ones would actually rule out which kinds of positions.
reasoning: |-
  Okay, the user is deep into the realism debate in mechanistic interpretability and wants a clear set of criteria to evaluate theories of neural network representations. They're frustrated with back-and-forth discussions and need a structured framework. Let me start by understanding their request. They want desiderata—specific requirements any theory must meet—without evaluating existing theories. 

  First, the user mentions several key points: cases the theory must handle (like polysemanticity, superposition), necessary distinctions (e.g., prediction vs. use), types of evidence for realism, negotiable vs. non-negotiable criteria, and possible contradictions. They also want to avoid biases from existing interpretability methods. 

  I recall key challenges in interpretability. Polysemantic neurons are a big one—where a single neuron fires for multiple unrelated inputs. Superposition is another; features might be encoded in combinations rather than single neurons. Cases where probes detect features but ablation doesn't affect behavior are problematic. Also, when different methods find conflicting features. These cases test a theory's robustness.

  For distinctions, the difference between correlation and causation is crucial. Just because a feature predicts behavior doesn't mean the network uses it. Also, the gap between human-interpretable features and the network's actual computations. The theory must clarify these without conflating them.

  Evidence is tricky. Pro-realists might point to causal interventions like ablation changing behavior. Anti-realists could argue that features are observer-dependent. The theory must define what evidence would falsify each position. For example, if no method consistently finds the same features, that challenges realism. If ablating a feature doesn't change performance, it questions its necessity.

  Negotiable criteria might include specific implementation details, like whether features must align with human concepts. Non-negotiables are testability and handling fundamental cases like superposition. Some desiderata, like complete invertibility, might be too strict and not essential.

  Contradictions are a big concern. For instance, demanding both locality (features tied to specific neurons) and universality (same across models) might clash with superposition. Also, requiring human interpretability might conflict with the network's actual, possibly alien, representations. 

  The user's deeper need might be to cut through the debate's noise and have a clear checklist. They might be preparing to develop their own theory or evaluate existing ones rigorously. They might also seek to identify which aspects are settled versus open questions, saving time by focusing on feasible problems. Ensuring the framework is method-agnostic is key to avoid favoring any particular approach. Highlighting possible contradictions helps them avoid dead ends. Overall, they need a structured, unbiased foundation to advance their understanding without getting stuck in circular arguments.
answer: |-
  Here's a comprehensive list of desiderata for evaluating theories of neural network representations, structured as requested. This aims to be method-agnostic and focus on the *requirements* for any adequate theory, not the theories themselves.

  **Core Desiderata: What the Theory Must Handle & Explain**

  1.  **Polysemanticity:** *Case:* A single neuron/activation vector responds strongly to multiple unrelated, non-abstract concepts (e.g., cat faces, car fronts). *Requirement:* The theory must explain how such a neuron functions computationally within the network without requiring it to correspond cleanly to a single human-interpretable feature. It cannot treat this as an anomaly or failure mode to be ignored.
  2.  **Superposition:** *Case:* Features are represented not by individual neurons but by linear combinations of activations across many neurons, often exceeding the number of neurons. *Requirement:* The theory must account for how features can be "present" and used by the network even when they are not localizable to any single unit or small group in a human-intuitive way. It must explain how computation happens *within* this superposition.
  3.  **Probe-Ablation Mismatch:** *Case:* A linear probe (or similar) finds a feature vector highly predictive of some concept/behavior. However, ablating/intervening on that specific vector minimally impacts the network's output performance on relevant tasks. *Requirement:* The theory must reconcile this apparent contradiction. It must distinguish between *correlation* (what the probe finds) and *causal computational role* (what ablation tests).
  4.  **Methodological Disagreement:** *Case:* Two different interpretability methods (e.g., an SAE and a causal intervention method) identify distinct (even conflicting) sets of features as "the" underlying representation for the same behavior on the same inputs. Both methods have internal consistency and some predictive power. *Requirement:* The theory must provide a framework for understanding why different methods yield different results and what this implies about the ontology of representations. It cannot simply declare one method "right" and the other "wrong" without principled justification grounded in the network's computation.
  5.  **Contextual Variability:** *Case:* The "meaning" or contribution of an activation/feature vector changes significantly based on the broader context (other concurrent activations, position in sequence, specific input nuances). *Requirement:* The theory must account for the dynamic, context-dependent nature of representations. Representations cannot be treated as static, context-independent entities.
  6.  **Compositionality & Abstraction:** *Case:* The network builds complex, abstract representations (e.g., "justice," "transformer architecture") from simpler components, and these representations are used flexibly across diverse contexts. *Requirement:* The theory must explain how simpler feature activations combine and interact to form more complex, abstract representations that guide behavior. It must handle hierarchical structure.
  7.  **Robustness to Perturbation:** *Case:* Small changes to weights/activations sometimes drastically change interpretations, while large changes sometimes leave interpretations surprisingly stable. *Requirement:* The theory must account for the sensitivity (or lack thereof) of identified features to perturbations in the network's state or parameters, linking this to computational function and robustness.

  **Essential Distinctions the Theory Must Respect**

  8.  **Correlation vs. Causation:** *Distinction:* A feature vector *predicting* an output (correlation) is distinct from the network *using* that specific vector as a fundamental computational primitive in generating that output (causation). *Peril:* Collapsing this leads to mistaking epiphenomena for mechanisms. The theory must provide criteria for establishing causal roles.
  9.  **Instrumental Utility vs. Ontological Reality:** *Distinction:* A feature being *useful for humans* to predict network behavior or understand its function is distinct from that feature being a *fundamental building block* within the network's own computational process. *Peril:* Mistaking human convenience for how the network actually works. The theory must delineate its claims about network internals vs. external descriptive tools.
  10. **Representation vs. Computation:** *Distinction:* Identifying a static representation (what is represented) is distinct from understanding the dynamic computational process that *uses* that representation to produce behavior (how it's used). *Peril:* Providing a "dictionary" of features without explaining the "algorithm" that reads it. The theory must link representations to their functional role in the computational flow.
  11. **Human-Interpretable vs. Network-Intrinsic:** *Distinction:* A feature being understandable to humans (e.g., "cat neuron") is distinct from it being a functionally significant primitive *for the network itself*, which may be alien or sub-symbolic. *Peril:* Anthropomorphizing the network or dismissing representations because they aren't human-intuitive. The theory cannot require human interpretability as a *sine qua non* for being "real."
  12. **Implementation vs. Algorithm:** *Distinction:* The specific physical or numerical instantiation of a representation in weights/activations is distinct from the abstract computational role it plays. *Peril:* Getting bogged down in low-level details or assuming the implementation *is* the representation. The theory must allow for multiple implementations realizing the same computational role.

  **Criteria for Evidence & Falsifiability**

  13. **Evidence for Realism:** *Requirement:* The theory must specify what *kind* of evidence would strongly support the claim that a feature is a "real" computational primitive, not just a descriptive tool. Examples: Demonstrating consistent causal necessity via targeted interventions that preserve network architecture but disrupt specific feature use; showing the feature vector is explicitly manipulated by subsequent layers in a way consistent with its purported role; finding the same feature robustly across diverse interpretability methods applied correctly.
      *   **What Proves Realism Wrong?** If interventions targeting the purported "real" feature consistently fail to disrupt the *specific computational step* it's claimed to be part of, while other interventions do, *despite strong correlative evidence*. Or, if the "feature" demonstrably arises as an artifact of the interpretability method itself.
  14. **Evidence for Anti-Realism/Instrumentalism:** *Requirement:* The theory must specify what *kind* of evidence would strongly support the claim that a feature is primarily a useful human construct not directly corresponding to a fundamental computational primitive. Examples: Showing the feature is highly sensitive to interpretability method hyperparameters without changing network function; demonstrating equivalent predictive/causal power from many incompatible feature sets; proving the network can be accurately simulated without using that feature concept.
      *   **What Proves Instrumentalism Wrong?** If a specific feature vector is shown to be *causally necessary and sufficient* for a specific, well-defined computational step within the network, across diverse interventions, and its manipulation reliably alters behavior in ways predicted by its purported role. Or, if multiple independent interpretability methods converge robustly on the *same* feature vector as causally central.

  **Negotiability & Potential Contradictions**

  15. **Negotiable (Often Method-Assumption Creep):**
      *   **Complete Invertibility:** Requiring a perfect 1:1 mapping between every network state/activation and a single, unambiguous human-interpretable feature. (Ignores superposition, context).
      *   **Strict Locality:** Requiring every feature to be cleanly localized to a single neuron or a very small, contiguous group. (Contradicted by superposition, distributed representations).
      *   **Universality Across Models:** Requiring the *exact same* interpretable features to be found in all networks performing similar tasks (e.g., all LLMs). (Ignores implementation variability).
      *   **Perfect Human Interpretability:** Requiring every "real" feature to be easily namable and understandable by humans. (Anthropocentric; network primitives may be sub-symbolic).
      *   **Exhaustive Decomposition:** Requiring that *all* network computation must be explainable as the interaction of the discovered features *at their level of abstraction*. (Higher-level abstractions may exist).
  16. **Non-Negotiable (Core Functionality):** Handling Polysemanticity (1), Superposition (2), Probe-Ablation Mismatch (3), Methodological Disagreement (4), Contextual Variability (5), respecting Correlation vs. Causation (8), Instrumental vs. Ontological (9), Representation vs. Computation (10), and providing clear criteria for falsifiability (13 & 14).
  17. **Potential Contradictions/Deep Tensions:**
      *   **Locality vs. Superposition:** Insisting on strict locality (15b) is fundamentally incompatible with explaining superposition (2), a core phenomenon.
      *   **Human Interpretability vs. Network Intrinsicness:** Demanding perfect human interpretability (15d) as a requirement for "reality" conflicts with the possibility of genuine but alien network-intrinsic primitives (11).
      *   **Complete Decomposition vs. Emergence:** Requiring exhaustive decomposition into simple features (15e) might conflict with genuinely emergent computational properties that exist only at higher levels of organization within the network.
      *   **Causal Specificity vs. Robustness:** Requiring highly specific, pinpointable causal features might conflict with the observed robustness of networks to many perturbations (7), where function can be maintained despite changes to specific activations.
      *   **Universality vs. Implementation Specificity:** Requiring universal features (15c) might conflict with the demonstrable fact that different architectures/training runs can implement similar functions in different ways.

  **Key Takeaways for Your Evaluation:**

  *   **The Awkward Squad:** Any theory failing on Polysemanticity (1), Superposition (2), Probe-Ablation Mismatch (3), or Methodological Disagreement (4) is inadequate. These are core phenomena, not edge cases.
  *   **The Critical Splits:** Theories that blur Correlation vs. Causation (8) or Instrumental Utility vs. Ontological Reality (9) are fundamentally flawed. They risk mistaking description for mechanism.
  *   **The Falsifiability Test:** A theory without clear criteria (13 & 14) for what would prove it wrong isn't scientific. It must specify evidence for *and against* its core claims.
  *   **The Negotiation Trap:** Be wary of theories that smuggle in method-specific assumptions (like strict locality or invertibility) as core requirements. Check if they are truly necessary or just convenient for a particular technique (15).
  *   **The Impossibility Theorems:** If a theory insists on requirements known to contradict core phenomena (like Locality vs. Superposition), it is likely incoherent. Similarly, demanding Human Interpretability as a requirement for reality is a philosophical stance, not a scientific necessity, and may preclude finding the truth.

  This list provides the rigorous "spec sheet" against which you can evaluate any position in the realism debate. The core challenge lies in developing a theory that coherently handles the awkward squad while respecting the critical splits, remains falsifiable, avoids non-essential constraints, and navigates the deep tensions inherent in understanding complex, distributed, learned representations. Good luck!
