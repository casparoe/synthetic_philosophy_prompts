  -**Awkward implications**: Practical issues like justifying randomizers when time is short, or oddities like "fairness" meaning equal *risk* of death rather than prevention.  

  The unfalsifiability point is thorny. Taurek can always say "That's just what fairness requires," but that might reveal the theory's weakness—it can't explain *why* we feel obligated to save more in extreme cases. Still, normative ethics isn't science; coherence with all intuitions matters more than falsification.  

  I’ll emphasize concrete cases (drowning child, genocide, organ transplants) to make counterarguments visceral. The user already knows abstract objections; they need felt contradictions. And I’ll flag where Taurekians *have* replied (e.g., denying aggregate harm) so they see the dialectic.  

