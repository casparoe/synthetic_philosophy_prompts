  First, I should map Taurek's core claims: (1) No aggregate "loss" exists beyond individual claims, (2) Claims don't sum numerically, (3) Fairness (via randomizer) can override saving more lives. The strongest objections will target these foundations. 

  The user hints at meta-concerns too: Is Taurek's view unfalsifiable? And does that matter in normative ethics? That's astute—it shows they're thinking about the structure of ethical theories, not just applications. 

  Let me structure counterarguments by severity:  
  -**Fatal flaws**: Cases where Taurek's view collapses into absurdity, like permitting preventable genocide via coin flips. If morality can't explain why saving 99 over 1 is obligatory, that's a reductio ad absurdum.  
