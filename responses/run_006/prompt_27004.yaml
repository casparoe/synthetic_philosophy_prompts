prompt: |-
  I've been turning something over in my head for a while and I can't tell if it's one thing or three seperate things, and I don't know what to call it. It's about when a "yes" actually counts. In ordinary life we all seem to treat some yeses as not counting. If someone agrees to a surgery because the doctor lied about the risks, we say they didn't really consent. If someone agrees because the other person said "do this or I'll make sure you lose your job," same thing. If someone agrees but they're so drunk they won't remember the conversation, or they have advanced dementia and can't follow what's being asked, same thing again. These don't obviously feel like the same failure: one is about being tricked, one is about being pressured, one is about the person not being in a state to understand. But we reach for the same language for all of them.

  So my question is: is there an established name or concept for the thing these all share, the thing that turns a bare "yes" into the kind of yes that actually binds? Or is the honest answer that these are just different things we happen to lump together? And if there is a shared thing, I want to know where its edges are. Is not telling someone something the same as lying to them, or does a yes stay valid when nothing false was said? Is a very tempting offer (I'll pay off all your debts if you do this) the same kind of pressure as a threat, or does it leave the yes intact? How drunk, how young, or how confused does someone have to be before their yes stops counting? I'm not going to be satisfied with a one-word label; I want to know how the pieces fit and where the concept starts to break down. If no established concept actually covers all three, I'd rather hear that than have you force a label onto them.

  Could you act as a professional philosopher who works on consent and moral psychology? Take your time with this, and maybe brainstorm out loud about the candidate concepts and where each one fails to cover all the cases.
reasoning: |-
  Okay, the user is grappling with a complex philosophical question about consent. They've noticed that in everyday life, we treat certain "yes" responses as invalid—like when someone consents under deception, coercion, or incapacity—but can't tell if these share a unified principle or are distinct phenomena. They want to know if there's an established concept that binds these cases together, or if they're fundamentally separate.  

  Hmm... First, I need to validate their observation. They're absolutely right that coercion (threats), deception (lies), and incapacity (drunkenness/dementia) all nullify consent, yet feel intuitively different. Their core question is whether these share a deeper structure or are just a practical grouping.  

  The user explicitly rejects oversimplified labels—they want the *why* and *how* of the boundaries. They're also probing edge cases: Is withholding information equivalent to lying? Is an enticing offer coercive? Where exactly does capacity threshold lie? This signals they're thinking rigorously, like a philosopher or ethicist would.  

  Let me unpack the three main candidate frameworks:  
  1. **Autonomy**: Consent requires genuine self-determination. Coercion violates it by imposing external will; deception corrupts it with false premises; incapacity removes the ability to self-determine. But "autonomy" is broad—does it help distinguish between, say, a threat vs. a tempting offer? Maybe not cleanly.  
  2. **Valid Consent Conditions**: Breaking it down into information, voluntariness, and competence. This maps neatly to their three cases (deception→info, coercion→voluntariness, incapacity→competence). But is competence binary? Dementia exists on a spectrum.  
  3. **Normative Power**: The "yes" must enact a moral permission. If deception or coercion distorts the context, the power isn't validly exercised. But this feels abstract—useful for theory, less for practical edges.  

  Ah, the edge cases they mentioned are where this gets messy:  
  - **Omissions vs. lies**: Ethically, deliberately withholding key facts (e.g., not mentioning surgery risks) often nullifies consent, but legally it might depend on "materiality."  
  - **Offers vs. threats**: A life-changing offer (debt payoff) *can* undermine voluntariness if it creates unbearable pressure, but usually isn't coercive unless it exploits desperation. Context matters.  
  - **Capacity thresholds**: We use sliding scales (e.g., "competence to consent" in medicine depends on the decision's complexity). A drunk person might validly consent to a snack but not to sex.  

  The user’s depth suggests they might be building an argument or writing something. Their frustration with "one-word labels" implies they've encountered shallow treatments of consent before. I should honor their discomfort with forced unity—these cases *are* meaningfully distinct, even if linked by the broader "invalidating condition" umbrella.  

  ...After mulling it over, I’ll argue that while "voluntary informed consent" is the overarching concept, their three cases represent distinct failure modes. The unity is functional (they all break consent) not structural (each breaks it differently). For edges, I’ll emphasize contextual nuance: e.g., "pressure" becomes coercion when it removes reasonable alternatives, and capacity is decision-relative. No tidy box here—and that’s philosophically honest.
answer: |-
  You're wrestling with one of the most persistent and ethically fraught questions in moral philosophy, law, and social practice: **what transforms a mere utterance of "yes" into valid, binding consent?** Your intuition that coercion, deception, and incapacity feel distinct yet share a common core is astute. As a philosopher working on moral agency and consent, I'll dissect this systematically—without forcing artificial unity where it doesn't hold. Let's deconstruct the candidate concepts, their overlaps, and their fault lines.

  ### Core Insight: Consent as a *Normative Power*
  At its foundation, consent is a **performative act**—it morally transforms relationships and permissions. Saying "yes" isn't just describing a preference; it *authorizes* an action that would otherwise be prohibited (e.g., surgery, sexual contact, a contract). For this authorization to be valid, the "yes" must be an expression of the agent's **deliberative agency** under conditions that preserve its moral force. When coercion, deception, or incapacity distort agency, the utterance loses its normative power.

  Now, let's test your three cases against philosophical frameworks:

  ---

  ### Candidate 1: **Autonomy (Kantian/Razian)**
  - **The Claim**: Consent is valid only if it reflects *authentic self-governance*.  
  - **Application**:  
    - Coercion (e.g., "Do this or lose your job") substitutes the coercer's will for the agent's, violating autonomy.  
    - Deception (e.g., lying about surgery risks) corrupts the agent's understanding of the act, making their choice non-autonomous.  
    - Incapacity (e.g., dementia) removes the cognitive preconditions for self-governance.  
  - **Where It Fails**:  
    - Autonomy doesn't cleanly distinguish between *types* of impairment. Is a person with dementia "less autonomous" than someone under severe economic pressure?  
    - Edge Cases:  
      - **Tempting offers** (e.g., "I'll pay your debts if you do this"): If the offer doesn't *eliminate reasonable alternatives* (e.g., you could refuse and keep working to pay debts), autonomy may remain intact. But if the offer exploits *desperation* (e.g., "Do this or your child dies untreated"), it becomes coercive by leaving no acceptable choice.  
      - **Omissions vs. lies**: Not disclosing material information (e.g., a surgeon hiding risks) can violate autonomy as severely as lying—if the agent *would have reasonably needed that information* to govern themselves. But trivial omissions ("I didn't mention the scalpel is blue") may not.  

  **Verdict**: Autonomy explains the *why* behind all three cases but is too broad to delineate edges.

  ---

  ### Candidate 2: **Valid Consent Conditions (Faden/Beauchamp)**
  This framework, dominant in bioethics, treats consent as having **three necessary conditions**:  
  1. **Competence** (capacity to understand and decide).  
  2. **Voluntariness** (free from controlling influences).  
  3. **Understanding** (adequate information).  

  - **Mapping to Your Cases**:  
    - Incapacity → **Competence failure** (dementia, intoxication).  
    - Coercion → **Voluntariness failure** (threats, undue pressure).  
    - Deception → **Understanding failure** (false/missing information).  
  - **Strengths**:  
    - Cleanly categorizes your three intuitions as distinct failure modes.  
    - Explains why we use similar language: all negate one of consent's core pillars.  
  - **Where It Breaks**:  
    - **Overlaps and Gray Zones**:  
      - Severe pain or fear (e.g., agreeing to surgery to escape agony) blurs competence *and* voluntariness.  
      - Manipulation (e.g., guilt-tripping) may violate voluntariness without outright coercion.  
    - **Edge Cases**:  
      - **Capacity thresholds**: Competence isn't binary. We use **sliding scales**:  
        - *Medical consent*: A drunk person may lack capacity for complex surgery but retain it for a blood draw.  
        - *Age*: A 6-year-old can consent to a hug but not to a loan. Context-dependent standards apply.  
      - **Pressure vs. coercion**: An offer becomes *undue inducement* if it distorts judgment (e.g., $1 million for a risky experiment on the poor). But a *beneficial offer* (e.g., life-saving treatment) isn't inherently invalidating.  
      - **Deception by omission**: If a partner hides an STD, consent to sex is invalid. But if a seller doesn't disclose a product's minor defect, the contract may still bind. **Materiality** (whether the info would alter a reasonable person's decision) is key.  

  **Verdict**: This tripartite model best captures the *practical distinctions* while showing how failures collectively invalidate consent. But it struggles with scalar cases (e.g., "How drunk is *too* drunk?").

  ---

  ### Candidate 3: **Moral Responsibility Transfer (Hurd/Searle)**
  Here, consent transfers moral responsibility: your "yes" makes another's act permissible. But for this transfer to occur:  
  - The agent must grasp the **normative significance** of the act (e.g., surgery isn't just "cutting" but "cutting *for health goals*").  
  - The consent must be **reason-responsive** (not overridden by threats/false beliefs).  

  - **Application**:  
    - Deception distorts normative significance (you think you're consenting to a low-risk procedure).  
    - Coercion severs reason-responsiveness (your "yes" responds to threat, not the act's merits).  
    - Incapacity removes the ability to grasp significance (e.g., dementia patient can't process risks).  
  - **Edge Cases**:  
    - **Cultural/contextual understanding**: If someone consents to a ritual without grasping its meaning (e.g., a non-believer in a sacrament), is consent valid?  
    - **Tempting offers**: The offer itself may become part of the act's normative significance (e.g., "I consent to testing *because it pays my rent*"). This *can* be valid if the agent weighs trade-offs autonomously.  

  **Verdict**: Explains why consent *binds* but is overly abstract for threshold questions (e.g., "How much misunderstanding invalidates?").

  ---

  ### Synthesis: A Unified but Nuanced View
  Your three cases **are distinct in mechanism but unified in consequence**: all prevent the "yes" from functioning as a *reliable expression of the agent's will and understanding* in contexts where moral/social stakes demand reliability. We lump them together because:  
  - They all **defeat the purpose of consent**—to protect dignity, welfare, and agency.  
  - They share a **family resemblance** under the concept of **invalidating conditions**.  

  #### Where the Concept Breaks Down
  1. **Materiality and Context**:  
     - A lie/omission only invalidates consent if the information is *material* (a reasonable person would consider it decisive).  
     - Pressure invalidates only if it leaves *no reasonable alternative* (e.g., losing a job vs. losing a life).  
  2. **Spectrum of Capacity**:  
     - No bright line exists for capacity. We use **functional standards**:  
       - *Can the person understand the nature/consequences of the act?*  
       - *Can they weigh risks/benefits?*  
       - *Can they communicate a choice?*  
     - This varies by context: consent to sex requires less cognitive load than consent to a clinical trial.  
  3. **Offers vs. Threats**:  
     - **Threats** (e.g., "Do X or I'll harm you") *reduce* existing options → invalidate consent.  
     - **Offers** (e.g., "Do X and I'll reward you") *expand* options → usually valid **unless**:  
       - The offer exploits vulnerability (e.g., poverty, illness).  
       - The reward is so disproportionate it clouds judgment (e.g., experimental drug trials in developing countries).  

  #### Conclusion: A Framework, Not a Formula
  There's no single "thing" that unifies coercion, deception, and incapacity beyond their role as **defeaters for valid consent**—conditions that negate one of its necessary pillars (voluntariness, understanding, or competence). They are distinct pathways to the same moral failure: the erosion of agency required for normative authorization.  

  **Why no perfect label?** Because consent is a **practice**, not a natural kind. Its boundaries are negotiated through law, ethics, and culture (e.g., sexual consent standards evolving post-#MeToo). What unites your cases is functional: they all trigger our intuition that "this yes doesn't count" because it fails to do the *moral work* we demand of consent.  

  If you leave with one takeaway, let it be this: **Consent is less about the word "yes" and more about the conditions under which it was spoken.** The edges are fuzzy because human agency exists on spectrums—but that's why we have jurisprudence, ethics committees, and ongoing philosophical debate to refine these judgments. Your dissatisfaction with simple answers is a sign you're grappling with consent as it truly is: magnificently complex and vitally important.
