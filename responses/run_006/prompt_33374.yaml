  We hope that this document clarifies the areas of agreement and disagreement and provides concrete tests for future work to resolve the cruxes.
answer: |-
  ### Joint Statement: Adversarial Collaboration on SSA vs. SIA in Anthropic Reasoning  
  **Signed Representatives**  
  - **SSA Advocate**: Dr. Alice Vance (adhering to Bostrom-style Self-Sampling)  
  - **SIA Advocate**: Dr. Ben Carter (adhering to Neal-style Self-Indication)  

  #### **Preamble**  
  We, the undersigned, acknowledge decades of unresolved debate between SSA and SIA. This document aims to crystallize agreements, isolate substantive disagreements, and specify empirical or logical cruxes that could resolve them. We commit to formulations that impose genuine costs: each agreement surrenders ground, and each crux identifies a failure condition for one theory.  

  ---

  ### **1. Agreed-Upon Claims**  
  The following claims are substantive and binding. Both sides accept them as foundational, despite implications that challenge auxiliary arguments in their respective camps.  

  1. **Bayesian Updating with Indexicals**:  
     - When updating credences, agents must condition on *all* available information, including indexical self-location (e.g., "I am observer X in situation Y"). This requires a well-defined reference class.  

  2. **Reference Class Constraints**:  
     - The reference class (RC) must include only observers *subjectively indistinguishable* from oneself at the time of reasoning (e.g., humans for Earth-bound agents). RC boundaries must be fixed *before* indexical updating and cannot arbitrarily exclude observers.  

  3. **Validity of Core Thought Experiments**:  
     - The following experiments are valid probes of anthropic reasoning, with agreed-upon non-indexical setups:  
       - **Doomsday Argument (DA)**: Humans have birth ranks; early ranks suggest fewer total humans.  
       - **Presumptuous Philosopher (PP)**: Theory T1 predicts 10¹⁰ observers; T2 predicts 10²⁰; no non-indexical evidence favors either.  
       - **Sleeping Beauty (SB)**: A fair coin flip determines whether Beauty is awakened once (Heads) or twice (Tails) under amnesia.  
       - **God’s Coin Toss (GCT)**: A fair coin creates 1 observer (Heads) or 10 observers (Tails); we are an observer.  
       - **Adam and Eve (AE)**: A coin flip determines whether two primordial observers (Adam/Eve) alone exist (Heads) or whether they produce 10 offspring (Tails); we are an observer.  

  4. **Treatment of "Self as Random Sample"**:  
     - Agents must assign equal credence to being any observer *within their RC* conditional on a hypothesis. If hypothesis H implies N observers in RC, P(I am observer i | H) = 1/N for all i.  

  5. **Existence as Evidence**:  
     - Learning "I exist" or "I am in RC" is evidentially relevant and must update credences. However, *how* it updates separates SSA and SIA.  

  6. **SSA/SIA Definitions under Agreement**:  
     - **SSA**: Given hypothesis H, P(I am in RC | H) = (Actual observers in RC under H) / (Total possible in RC under H).  
     - **SIA**: The prior over hypotheses is proportional to the expected number of observers in RC: P₀(H) ∝ E[Observers in RC | H].  

  7. **Equivalence Under Fixed Observers**:  
     - If all hypotheses imply identical observer counts in RC, SSA and SIA produce identical posterior probabilities.  

  8. **Freak Observer Constraint**:  
     - Any admissible theory must avoid "freak observer" dominance (e.g., Boltzmann brains overwhelming real observations). RC must prioritize observers with coherent causal histories.  

  ---

  ### **2. Disagreements Table**  
  Key substantive divides. "Crux" denotes disagreements where resolving the issue would falsify one position. Auxiliary rows specify testable predictions.  

  | Issue | SSA Position (as stated by advocate) | SIA Position (as stated by advocate) | Crux? |  
  |-------|--------------------------------------|--------------------------------------|-------|  
  | **Doomsday Argument** | Upon learning my birth rank is n, I must update toward hypotheses where total humans N is small. DA is valid: low birth ranks are evidence of early doom. | Learning my birth rank n provides no evidence about N. SIA’s prior (P₀(N) ∝ N) cancels the DA effect, leaving posteriors unchanged. | Yes |  
  | **→ Auxiliary: DA Test** | **Test**: H₁: N = 100B; H₂: N = 100T; uniform prior. After learning birth rank ≤ 60B, SSA predicts P(H₁) ≈ 99.9%. **Rationale**: P(rank ≤ 60B \| H₂) = 60B/100T = 0.06%. | **Test**: Same setup. SIA prior: P₀(H₁) ∝ 100B, P₀(H₂) ∝ 100T. After conditioning on existence and rank ≤ 60B, SIA predicts P(H₁) ≈ 50%. **Rationale**: Likelihoods cancel SIA’s prior weighting. | |  
  | **Presumptuous Philosopher** | In PP, SSA assigns P(T₁) = P(T₂) = 0.5. If T₂ is true, I am unlikely to be among the first 10¹⁰ observers; thus, T₁ is favored. | SIA assigns P₀(T₁) ∝ 10¹⁰, P₀(T₂) ∝ 10²⁰. Before any data, P(T₂) ≈ 1. PP shows SSA’s failure to weight hypotheses by observer count. | Yes |  
  | **→ Auxiliary: PP Test** | **Test**: T₁: N = 10¹⁰; T₂: N = 10²⁰; P(T₁) = P(T₂) = 0.5 pre-indexicals. SSA predicts P(T₁ \| I exist) = 0.5. **Rationale**: Existence is equally likely under both. | **Test**: Same setup. SIA predicts P(T₁ \| I exist) ≈ 10⁻¹⁰. **Rationale**: Prior P₀(T₂)/P₀(T₁) = 10¹⁰, and no update changes this. | |  
  | **Sleeping Beauty** | Upon awakening, Beauty’s P(Heads) = 1/3. Three observer-moments exist (Heads-awake, Tails-Mon, Tails-Tue); she is equally likely to be in any. | Upon awakening, P(Heads) = 1/2. The coin flip is independent of indexicals; amnesia does not create new evidence. SIA rejects "observer-moment" RC. | Yes |  
  | **→ Auxiliary: SB Test** | **Test**: If Beauty learns it is Monday, SSA predicts P(Heads \| Mon) = 1/2. **Rationale**: Only two possible observer-moments (Heads-awake, Tails-Mon). | **Test**: Same. SIA predicts P(Heads \| Mon) = 2/3. **Rationale**: Monday awakening is more likely under Heads (100%) than Tails (50%). | |  
  | **God’s Coin Toss** | Given GCT, P(Heads \| I exist) = 0.5. Existence is certain under both hypotheses; no update occurs. | Given GCT, P(Heads \| I exist) = 1/11. SIA’s prior weights Tails 10× higher due to more observers. | Yes |  
  | **→ Auxiliary: GCT Test** | **Test**: Biased coin: P(Heads) = 0.2. SSA predicts P(Heads \| I exist) = 0.2. **Rationale**: P(I exist) = 1 under both; no SSA update. | **Test**: Same. SIA predicts P(Heads \| I exist) = 0.2/(0.2 + 10×0.8) ≈ 2.4%. **Rationale**: Prior P₀(Tails) ∝ 10 × P(Heads). | |  
  | **Adam and Eve** | In AE, pre-offspring, P(Tails) = 0.5. Learning "I am a potential child" updates P(Tails) to 1; learning "I am Adam/Eve" updates P(Tails) to 1/6 (SSA). | In AE, pre-offspring, P₀(Tails) ∝ 12 (Adam/Eve + 10 children); P₀(Heads) ∝ 2. Learning "I am Adam/Eve" leaves P(Tails) ≈ 86%. | Yes |  
  | **→ Auxiliary: AE Test** | **Test**: We learn we are Adam/Eve. SSA predicts P(Tails \| Adam/Eve) = (0.5 × 1/12) / [(0.5 × 1/12) + (0.5 × 1/2)] = 1/7. **Rationale**: Adam/Eve likelier in Heads-world. | **Test**: Same. SIA predicts P(Tails \| Adam/Eve) = (12 × 0.5) / [(12 × 0.5) + (2 × 0.5)] × P(Adam/Eve \| Tails) = 6/7 × 1/6 ≈ 14%. **Rationale**: Tails-world prior dominates. | |  

  ---

  ### **3. Verbal Disagreements and Resolutions**  
  The following "disagreements" dissolve under precise reformulation:  

  1. **"The Prior Includes Observer Counts"**  
     - **Apparent Disagreement**: SIA claims the prior *must* weight hypotheses by observer count; SSA claims this biases probabilities.  
     - **Resolution**: Both agree that observer counts affect posteriors. The dispute is *when* counts enter calculations:  
       - **Reformulation**: SSA applies observer-count weighting *only* at the likelihood stage (P(I exist \| H)); SIA applies it at the prior stage (P₀(H)).  
     - **Cost**: SSA concedes that SIA’s "prior" is mathematically equivalent to SSA’s "prior × likelihood" in some cases. SIA concedes its "prior" is not a pre-indexical prior but a prior over observer-centered propositions.  

  2. **"SSA Ignores Observer-Count Information"**  
     - **Apparent Disagreement**: SIA claims SSA underweights hypotheses with many observers; SSA claims SIA double-counts existence evidence.  
     - **Resolution**: Both agree existence must update credences. The dispute is whether "I exist" is *new* evidence:  
       - **Reformulation**: For SSA, "I exist" is always true under hypotheses where observers exist, so it updates *only* via birth rank/RC. For SIA, "I exist" *is* evidence favoring observer-rich hypotheses.  
     - **Cost**: SIA concedes SSA *does* use observer counts (via RC likelihoods). SSA concedes SIA *does not* double-count but front-loads observer information.  

  3. **"Reference Class Arbitrariness"**  
     - **Apparent Disagreement**: SSA accuses SIA of ad hoc RC choices; SIA accuses SSA of RC gerrymandering.  
     - **Resolution**: Both agree the RC must be fixed by causal-connectedness and subjective indistinguishability (e.g., humans in 2024, not Boltzmann brains).  
     - **Reformulation**: RC is the set of observers who *could* be me given my memories and sensory data.  

  ---

  ### **Conclusion**  
  This document establishes common ground and isolates irreconcilable differences. We commit to abandoning our positions if:  
  - **SSA fails**: Auxiliary tests for PP or AE show SSA’s predictions contradict empirical frequencies in repeated trials.  
  - **SIA fails**: Auxiliary tests for DA or GCT show SIA requires ad hoc RC adjustments to avoid absurdity (e.g., doomsday conclusion reversal).  

  By signing, we affirm that the above agreements cost us theoretical flexibility and that the cruxes are falsifiable.  

