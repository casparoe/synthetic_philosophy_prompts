mation, what is P(children)? If we are a random observer, then the chance that the children exist is 6/7 (as above). But now, suppose we learn that we are Adam (or Eve). Then, under SSA, we condition on being Adam. Adam exists in both worlds. So we update: P(children | I am Adam) = P(children) * P(I am Adam | children) / [P(children)*P(I am Adam|children) + P(no children)*P(I am Adam|no children)] = (0.5 * (1/12)) / [0.5*(1/12) + 0.5*(1/2)] = (1/24) / (1/24 + 1/4) = (1/24)/(1/24+6/24)= (1/24)/(7/24)=1/7. So then, if we are Adam, we think it is less likely that there are children. But if we don't know who we are, we think 6/7. Now, if we learn we are a child, then we must be in the children world, so P(children)=1. So SSA updates based on indexical information. The SIA camp might have a different approach, but in this case, they might agree on the updating. So it's not a clear disagreement. I think we need to choose a different test. Alternatively, note that the SIA prior is set to be proportional to the number of observers, so even if the coin is biased, the prior over theories is not the coin bias but multiplied by the number of observers. But in SSA, we start with the coin bias. So let's change the God's Coin Toss to a biased coin. | Let's redo God's Coin Toss with a biased coin: P(Heads)=p, P(Tails)=1-p. Then:<br>**SSA:** P(Heads | I exist) = P(Heads) * P(I exist | Heads) / [P(Heads)*P(I exist|Heads) + P(Tails)*P(I exist|Tails)] = (p * 1) / (p*1 + (1-p)*1) = p.<br>**SIA:** The prior over hypotheses is proportional to the number of observers: P_SIA(Heads) ∝ 1 * p, P_SIA(Tails) ∝ 10 * (1-p). Then normalized: P_SIA(Heads) = (p) / (p + 10(1-p)), P_SIA(Tails)= (10(1-p)) / (p+10(1-p)). Then, upon conditioning on existence (which is certain), P(Heads|I exist)= p/(p+10(1-p)).<br>So the disagreement is clear: SSA says p, SIA says p/(p+10(1-p)). | 
