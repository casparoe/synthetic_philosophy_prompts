  We are drafting a joint statement resulting from an adversarial collaboration between a committed advocate of the Self-Sampling Assumption (SSA) and a committed advocate of the Self-Indication Assumption (SIA). The goal is to clarify agreements and disagreements, and to specify conditions under which each side would change its mind.

  Structure:
  1. A numbered list of agreed-upon claims (substantive, not truisms).
  2. A disagreements table with columns: (i) Issue, (ii) SSA position, (iii) SIA position, (iv) Whether it is a crux (and if so, an auxiliary row with a concrete test and each side's prediction).
  3. A section on verbal disagreements and proposed reformulations.

  We must be precise and ensure that the agreed claims are costly for both sides to sign. The thought experiments we'll reference include: Doomsday Argument, Presumptuous Philosopher, Sleeping Beauty, God's Coin Toss, Adam and Eve.

  Let's begin.

  PART 1: AGREED-UPON CLAIMS

  We agree on the following:

  1. **Bayesian Framework**: Anthropic reasoning must be conducted within a Bayesian framework. Updating on indexical information (such as "I am an observer in a particular situation") requires conditionalization on all relevant information, including the indexical.

  2. **Reference Classes**: The choice of reference class (the set of observers one considers oneself a random sample from) is critical. Both sides agree that the reference class must be specified and that it should include only observers who are subjectively indistinguishable from oneself at the time of reasoning, or at least share the relevant properties for the problem at hand. However, we disagree on how to choose the reference class in some cases (to be detailed in the disagreements section).

  3. **The Role of Indexical Information**: Indexical information (e.g., "I am Jane Doe") can be evidentially relevant when it distinguishes between different hypotheses about the world. Both sides agree that one should condition on all available indexical information.

  4. **Validity of Thought Experiments**: The following thought experiments are valid and important for testing anthropic theories, and both sides agree on the non-indexical aspects of the setups:
     a. **Doomsday Argument**: The argument that we should update in favor of an earlier end to humanity based on our birth rank.
     b. **Presumptuous Philosopher**: A scenario in which two theories predict vastly different numbers of observers, and we are asked which is more likely.
     c. **Sleeping Beauty**: The problem of updating credence when awakened in a memory-loss experiment.
     d. **God's Coin Toss**: A universe creation scenario where a coin flip determines how many observers exist.
     e. **Adam and Eve**: Scenarios involving the first observers and their descendants.

  5. **Conditionalization on Existence**: Both sides agree that one's existence as an observer is a piece of evidence that must be accounted for. However, they disagree on how to account for it (see disagreements).

  6. **The Need for a Sampling Assumption**: Both sides agree that in order to reason about the probability of being a particular observer, one must adopt a sampling assumption. The dispute is over which one: SSA or SIA.

  7. **SSA Definition**: We agree on a common definition of SSA: "One should reason as if one were a random sample from the set of all observers in one's reference class." This implies that the probability of being any particular observer in the reference class is equal.

  8. **SIA Definition**: We agree on a common definition of SIA: "One should update in favor of hypotheses that imply more observers existing, proportionally to the number of observers." More formally, SIA gives a prior that is proportional to the number of observers that exist under a hypothesis.

  9. **Equivalence in Some Cases**: Both sides agree that in scenarios where the number of observers is fixed and known, SSA and SIA produce the same results.

  10. **The Problem of Freak Observers**: Both sides agree that any adequate anthropic theory must avoid the "freak observer" problem (e.g., Boltzmann brains) and that this imposes constraints on the choice of reference class or the sampling assumption.

  PART 2: DISAGREEMENTS TABLE

  We now present the key disagreements in the form of a table. Each row addresses a specific issue, with columns for the issue, the SSA position, the SIA position, and whether it is a crux. For crux issues, we add an auxiliary row with a concrete test and predictions.

  | Issue | SSA Position | SIA Position | Crux? |
  |-------|--------------|--------------|-------|
  | **1. Doomsday Argument (DA)** | The DA is valid: upon learning one's birth rank, one should update towards earlier doom. Specifically, in the standard DA setup, the posterior probability that the total number of humans is small increases. | The DA is invalid: learning one's birth rank does not by itself provide information about the total number of humans. The prior distribution over total population sizes must be considered, and SIA's prior (proportional to population size) cancels the DA effect. | Yes |
  | **Auxiliary (DA Test)** | **Test:** Consider two hypotheses: H1 (total humans = 100 billion) and H2 (total humans = 100 trillion). Assume a uniform prior over these two. If we learn that we are among the first 100 billion, what is the posterior?<br>**SSA Prediction:** P(H1 | rank ≤ 100e9) = P(H1) * [1] / [P(H1)*1 + P(H2)*(100e9/100e12)] = P(H1) / [P(H1) + P(H2)*0.001]. With equal priors, P(H1) becomes about 99.9%.<br>**SIA Prediction:** The prior under SIA is proportional to the number of observers: P_SIA(H1) ∝ 100e9, P_SIA(H2) ∝ 100e12. Normalized, P_SIA(H1)=100e9/(100e9+100e12)≈0.001, P_SIA(H2)≈0.999. After learning we are in the first 100 billion, we condition on being in the first 100 billion. But note that under H2, the first 100 billion are a subset. The likelihood of our observation (being in the first 100 billion) is 1 under H1 and 0.001 under H2. So posterior: P(H1|data) ∝ 0.001 * 1, P(H2|data) ∝ 0.999 * 0.001 ⇒ P(H1|data) = 0.001/(0.001+0.000999)≈0.5. Thus, SIA cancels the DA effect. | |
