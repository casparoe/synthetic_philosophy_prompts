  PART 3: VERBAL DISAGREEMENTS

  After discussion, we have identified that some apparent disagreements are verbal:

  1. **The Meaning of "Prior"**: SSA uses a prior that is over world states (without considering observer counts), while SIA uses a prior that is already weighted by observer counts. This leads to confusion because both sides use the same term for different concepts. We propose to always specify "prior over world states" (SSA) versus "prior over observer-moments" (SIA). However, this does not fully resolve the issue because SSA then updates on being an observer. We agree that both sides are using Bayesian updating, but SIA builds the observer count into the prior, while SSA builds it into the update.

  2. **The Reference Class**: Both sides agree that the reference class is important, but they sometimes mean different things by it. SSA typically uses a reference class of all observers, while SIA might be seen as using a reference class of possible observers. We agree that the reference class should be the set of actual observers (for SSA) and possible observers (for SIA?) but this is not settled. We propose to always specify the reference class precisely in any given scenario.

