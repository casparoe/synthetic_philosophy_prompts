  | **4. God's Coin Toss** | In God's Coin Toss (a universe creation scenario), a fair coin is flipped. If Heads, one observer is created; if Tails, ten observers are created. We are one of the observers. SSA says: the probability of Heads is 1/2. Because we are a random sample from the set of all possible observers, and there is one observer in Heads and ten in Tails. The chance of being the one in Heads is 1/11? No, wait: SSA says we are a random sample from the actual observers. So if Heads, there is one observer (us). If Tails, we are one out of ten. Therefore, the probability of Heads given we exist is P(Heads|I exist) = P(Heads) * P(I exist | Heads) / [P(Heads)*P(I exist|Heads) + P(Tails)*P(I exist|Tails)] = (0.5 * 1) / (0.5*1 + 0.5*1) = 0.5. Because in both cases, we exist for sure. So SSA gets 0.5. | SIA says: the prior probability of Heads is proportional to the number of observers, so P(Heads) = 1/(1+10) = 1/11, P(Tails)=10/11. Then, upon learning we exist (which is certain under both), we get P(Heads|I exist)=1/11. | Yes |
  | **Auxiliary (God's Coin Toss Test)** | **Test:** Same setup. What is P(Heads | we are an observer)?<br>**SSA Prediction:** 0.5<br>**SIA Prediction:** 1/11 | |
