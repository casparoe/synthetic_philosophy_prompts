answer: |-
  Here's a Frankfurt-style case designed for your class handout, adhering strictly to your constraints:

  **The Scenario:**  
  Mark is preparing crucial quarterly reports for his company. He discovers he made a significant data entry error weeks ago that would make his department look incompetent. He could confess the mistake to his manager, Lisa, which would likely damage his promotion chances, or he could quietly correct the data now; Lisa wouldn't spot the fix, but his colleague Sarah, who shares the office and knows Mark extremely well, would notice the revised timestamps. Sarah, fiercely loyal to the department, is observing Mark closely as he reviews the files before Lisa's arrival. Years of working together have made Sarah adept at spotting Mark’s *immediate, involuntary microexpression of guilt* – a subtle, fleeting tightening around his eyes that appears *only* when he resolves to confess wrongdoing. Sarah has resolved: if she sees that tell, indicating Mark is about to confess, she will instantly interrupt loudly, inventing an urgent distraction (e.g., "Mark, the fire alarm in the west wing just triggered! We need to go!") to prevent him speaking to Lisa. Mark, unaware of Sarah’s watchfulness or her specific plan, feels the pressure. He decides correcting the data is best for his career and the department's image. He calmly makes the correction, submits the reports to Lisa without comment, and Sarah sees *no tell*. She remains silent, never acting. Mark acted entirely on his own reasons; Sarah’s intervention remained purely counterfactual.

  **The Frankfurt Argument:**  
  1.  **What Mark Did:** Mark chose to conceal his error by falsifying the reports.
  2.  **Why He Had No Alternative (Couldn't Have Done Otherwise):** Had Mark even *begun* to form the intention to confess – the moment his specific guilt microexpression would have appeared – Sarah would have intervened instantly and effectively, preventing the confession. His only path to *successfully* confessing was blocked by Sarah’s counterfactual intervention. He could not have confessed at that moment.
  3.  **Why He's Still Responsible:** Mark decided autonomously, based on his own reasons (careerism, departmental pride), to conceal the error. Sarah’s presence and plan had no causal influence on his actual decision-making process or action; they didn’t coerce, manipulate, or cause his choice. He did exactly what he wanted to do. His moral responsibility stems from this actual, uncoerced choice and action.

  **The Strongest PAP Defender Reply:**  
  Defenders of the Principle of Alternative Possibilities (PAP) would likely argue that Mark *did* retain a significant alternative possibility: **He could have *hesitated* or *reconsidered* confessing without actually triggering the tell.** The tell is tied to the specific resolution to confess. Mark retained the ability to *weigh the options differently* at the last moment, perhaps feeling a pang of guilt that didn’t solidify into a decision to confess (thus not triggering the tell), or starting to say something ambiguous ("Lisa, about those reports...") that wouldn't trigger Sarah's intervention. This "flicker of freedom" – the ability to *initiate* or *dwell upon* the alternative choice without *settling* on it in the way that activates the tell – means Mark *could* have done otherwise *in a morally relevant sense* (e.g., showing wavering commitment or reconsideration), even if full confession was blocked. Sarah’s setup only removes the *successful execution* of confession once a *specific, resolved intention* is formed; it doesn't remove all alternatives *leading up to* or *surrounding* the choice itself.

  **What's Settled vs. Contested & What Does the Work:**

  *   **Settled:** Mark acted autonomously for his own reasons. Sarah never intervened. His actual choice and action were causally unaffected by Sarah. He successfully concealed the error.
  *   **Contested:** Whether Mark truly "could not have done otherwise" in a sense that matters for PAP. Frankfurtians argue the inability to *successfully confess* is sufficient. PAP defenders argue the retained ability to *wobble* or *initiate* confession-related thoughts/actions constitutes a relevant alternative possibility.
  *   **Feature Doing the Work:** The **specificity and timing of the tell** (involuntary microexpression *only* upon *resolving* to confess) is crucial. It targets the Frankfurtian claim that the *only* alternative path is blocked. However, the PAP reply exploits the inherent difficulty in defining the exact threshold moment of "forming the intention to act" and whether alternatives exist *just before* that threshold is crossed. The involuntary nature of the tell makes it hard to control, but the PAP defender argues the space *before* the tell fires is where freedom resides. The success of the case hinges on whether blocking the *successful execution* of the only other salient action (confession) is sufficient to negate *all* relevant alternative possibilities, or if the retained ability to *begin* or *seriously consider* that action counts. This is the core philosophical dispute Frankfurt cases illuminate.

  This case meets your constraints: realistic office setting, no tech/demons, intervener doesn't act, agent acts alone for own reasons. The specific tell (microexpression upon *resolution*) targets the flicker-of-freedom reply by trying to eliminate the space for hesitation/reconsideration *without* triggering intervention, but the PAP defender's counterargument about the significance of pre-resolution alternatives remains the strongest challenge.
