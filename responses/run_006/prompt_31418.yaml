prompt: |-
  I'm trying to work out what I actually think a species is, and I'd like help turning my reactions to cases into a principle—or learning that no single principle can have all of them.

  The definition I was taught is that a species is a group of actually or potentially interbreeding natural populations. My verdicts don't line up with it.

  1. A ring of populations around a mountain range. Population A interbreeds with B, B with C, C with D, D with E, and E with F, but A and F, whose ranges meet on the far side, do not interbreed. I want to say A and F are different species. But I also want the relation same species to be transitive: if A is the same species as B, and B as C, then A is the same species as C. And there is no adjacent pair in the chain where I'm willing to say the species changes. I can't see how to keep all three of these.

  2. A group of organisms that reproduces only asexually—say, a clonal lineage of rotifers—has diverged into several clusters that are genetically and ecologically distinct but never exchange genes at all. I still want to call the clusters different species. So interbreeding can't be necessary for specieshood.

  3. Two populations meet in a broad hybrid zone and produce fertile hybrids there, but they remain sharply distinct in appearance, habitat, and genetics across most of their ranges. I want to call them two species despite the gene flow. So interbreeding can't be sufficient for lumping them, either.

  4. A single lineage in the fossil record changes gradually over several million years. The earliest forms and the latest forms look very different, and paleontologists divide the lineage into an earlier and a later species at some convenient point in the sequence. I want to say the division is conventional rather than the discovery of a real boundary, and I'm uncomfortable treating the earliest and latest forms as different species in the same sense as the two populations in case 3.

  5. Two populations separated by a mountain range look and behave nearly identically, and I'm confident they would interbreed freely if the barrier were removed, but for now they have no contact. I want to call them the same species.

  6. Domestic dogs and wolves. They can interbreed and produce fertile offspring, and yet I find it very hard to accept that a chihuahua and a wolf are the same species.

  The principle I keep reaching for is roughly this: a species is a lineage evolving separately from other lineages—a population or metapopulation that maintains its own cohesion and its distinctness from the rest. But I don't know how to make separately evolving precise enough to handle the asexual case and the hybridizing case; it seems to say nothing about how much change makes a new species in the fossil record; and it may not respect my transitivity instinct in the ring case.

  What I'd like from you: test this principle against the cases, repair it or replace it with something better, and state the result precisely. For each case, say what the principle delivers and why. Then tell me which of my verdicts, if any, I have to give up—and why those rather than the others. Finally, apply the principle to a case I haven't listed: Neanderthals and modern humans, who separated, evolved apart, met again, and interbred enough to leave a small percentage of Neanderthal DNA in many modern human populations. What does your account say about whether they are one species or two, and does that follow from the same principle that handles cases 1 through 6?
reasoning: |-
  Alright, let's tackle this user's query. They're struggling with defining what a species is, pointing out issues with the biological species concept (BSC) and presenting six cases where it falls short. They proposed their own principle based on separately evolving lineages but are unsure how it handles the cases. They want a refined principle that addresses all cases, identifies any verdicts they might need to drop, and applies to Neanderthals and modern humans.

  First, I need to analyze each case in relation to the user's proposed principle. The user's instinct for separately evolving lineages aligns with the General Lineage Concept (GLC) or Evolutionary Species Concept (ESC). This focuses on lineages maintaining cohesion and distinctness. Let's test each case:

  **Case 1 (Ring Species):** The challenge here is transitivity. The user wants A and F to be different species, but no clear boundary. GLC handles this by treating the entire ring as one species with incipient speciation at the ends. However, the user might need to accept that "same species" isn't always transitive in practice, though the lineage itself is cohesive.

  **Case 2 (Asexual Clusters):** BSC fails because there's no interbreeding. GLC works here by recognizing distinct lineages based on divergence and lack of gene flow, even without sex. The clusters are separately evolving, so multiple species.

  **Case 3 (Hybrid Zone):** Even with some gene flow, if the populations maintain distinctiveness, GLC considers them separate species. The user's verdict aligns here, showing that gene flow isn't the sole factor.

  **Case 4 (Fossil Gradualism):** Here, the user sees species division as arbitrary. GLC agrees, treating the lineage as a single evolving species with subdivisions for practicality. The key is the continuum without clear splits.

  **Case 5 (Allopatric Populations):** Despite no current interbreeding, if they'd interbreed if connected, GLC calls them the same species. Cohesion is maintained by potential gene flow.

  **Case 6 (Dogs and Wolves):** The user struggles here. BSC says one species, but GLC, considering historical divergence and maintained distinctness despite hybridization, supports two species. This might require the user to accept that hybridization doesn't negate separateness.

  The user might need to give up transitivity in ring species and accept that dogs/wolves are separate species despite hybridization. Also, in the fossil case, species divisions are pragmatic, not real boundaries.

  For Neanderthals, applying GLC: they were initially separate, evolved apart, then interbred upon contact. The significant gene flow (2-4%) but maintained distinctiveness until merging suggests they were incipient species or subspecies. Post-interbreeding, since modern humans absorbed Neanderthals, they’re part of the same lineage now. So, historically two species during separation, but merged later.

  The user's deeper need is a consistent, principled definition that respects evolutionary processes beyond just interbreeding. They value lineage distinctness and cohesion, accommodating asexuality and hybridization. They might also seek justification for their intuitions while reconciling where those intuitions conflict with principles.
answer: |-
  Your instinct for a lineage-based concept is excellent—it aligns with the **Evolutionary Species Concept (ESC)** and the broader **General Lineage Concept (GLC)**, which are widely supported in modern systematics. These frameworks treat species as *separately evolving metapopulation lineages* and avoid the pitfalls of the biological species concept (interbreeding). Below, I refine your principle, test it against your cases, identify which verdicts you must adjust, and apply it to Neanderthals.

  ### Refined Principle
  **A species is a lineage (or set of subpopulations) that maintains genetic and phenotypic cohesion through time, evolves separately from other lineages, and has attained a threshold of evolutionary independence such that it is likely to remain distinct indefinitely.**  
  - **Key elements**:  
    1. **Separate evolution**: Minimal gene flow with other lineages, sufficient to prevent homogenization.  
    2. **Cohesion**: Shared evolutionary trajectory via gene flow, shared selection, or common descent.  
    3. **Evolutionary independence**: Irreversible divergence in traits/ecology, or barriers (geographic/genetic) that prevent fusion.  
  - **Flexibility**: Thresholds are empirical (e.g., genetic distance, ecological divergence) and context-dependent.  

  ---

  ### Testing Your Cases  
  **Case 1: Ring Species**  
  - **Your verdicts**: A/F different species; no sharp boundary; transitivity desired.  
  - **ESC verdict**: **One species** with incipient speciation at ends.  
    - *Why*: The entire ring is a single lineage with continuous gene flow. A and F have diverged *within* the lineage due to isolation-by-distance, but haven’t achieved evolutionary independence (cohesion persists via intermediates). Transitivity fails in practice—this is a feature of reality, not a flaw in the concept.  
  - **Verdict to adjust**: Accept that A/F are *not* full species; they are distinct populations within one species.  

  **Case 2: Asexual Lineages (Rotifers)**  
  - **Your verdict**: Clusters are different species.  
  - **ESC verdict**: **Multiple species**.  
    - *Why*: Despite no interbreeding, clusters are separately evolving lineages. Cohesion is maintained *within* each cluster (e.g., via shared mutations/selection), and divergence ensures evolutionary independence. Gene flow is unnecessary.  

  **Case 3: Hybridizing Populations**  
  - **Your verdict**: Two species despite hybridization.  
  - **ESC verdict**: **Two species** if divergence is maintained.  
    - *Why*: Gene flow in the hybrid zone is insufficient to erase distinctness. If selection/ecology preserves differences ("plurality of cohesion" within each lineage), they remain separate. Hybridization doesn’t negate separateness if lineages don’t fuse.  

  **Case 4: Fossil Gradualism**  
  - **Your verdict**: Arbitrary division; discomfort with "different species."  
  - **ESC verdict**: **One species** with arbitrary subdivisions for convenience.  
    - *Why*: A continuous lineage lacks speciation events—cohesion persists throughout. Paleontologists impose boundaries (e.g., based on morphology) for practicality, but no "real" split occurs. The earliest/latest forms are the *same* species lineage.  

  **Case 5: Allopatric Populations**  
  - **Your verdict**: Same species.  
  - **ESC verdict**: **Same species**.  
    - *Why*: Cohesion is maintained via *potential* gene flow. No divergence implies no evolutionary independence.  

  **Case 6: Dogs vs. Wolves**  
  - **Your verdict**: Different species despite interbreeding.  
  - **ESC verdict**: **Two species** (*Canis familiaris* vs. *C. lupus*).  
    - *Why*: 
      - **Separate evolution**: Dogs underwent domestication (strong artificial selection), wolves under natural selection.  
      - **Evolutionary independence**: They maintain distinct morphologies, behaviors, and ecologies despite gene flow. Hybridization is episodic but doesn’t collapse lineages.  
      - **Cohesion within lineages**: Dogs share a common domestication history; wolves share wild adaptations.  
    - *Verdict to adjust*: Accept they *are* different species. Your discomfort stems from BSC’s overemphasis on interfertility—ESC prioritizes persistent divergence.  

  ---

  ### Verdicts You Must Give Up (and Why)  
  1. **Ring Species (Case 1)**: Transitivity must be abandoned. Lineages are dynamic—A and F *are* part of the same species despite divergence.  
  2. **Dogs/Wolves (Case 6)**: They are separate species. Fertile hybrids ≠ same species if lineages remain distinct.  
  - **Why these?**  
    - Transitivity fails in ring species due to spatial structure—a reality of evolution.  
    - BSC’s interfertility criterion is misleading; your ESC principle prioritizes *persistent distinctness*, which dogs/wolves satisfy.  

  ---

  ### Neanderthals vs. Modern Humans  
  - **Background**: Diverged ~600kya, interbred ~50kya (2–4% Neanderthal DNA in non-Africans).  
  - **ESC verdict**: **Historically two species, now one merged lineage**.  
    - *During separation*: Neanderthals (*H. neanderthalensis*) and modern humans (*H. sapiens*) evolved independently—different morphologies, genomes, adaptations. They achieved evolutionary independence.  
    - *After contact*: Hybridization led to assimilation, not sustained coexistence. Neanderthal DNA was absorbed into the *H. sapiens* lineage, which persisted. No lasting plurality of cohesion.  
    - **Conclusion**: They were distinct species pre-contact, but merged into *H. sapiens* post-hybridization.  

  ---

  ### Final Principle  
  **"A species is a metapopulation lineage that (a) maintains internal cohesion via gene flow, shared selection, or common descent; (b) evolves separately from other lineages; and (c) exhibits evolutionary independence—irreversible divergence or barriers likely to maintain distinctness indefinitely."**  

  This handles all your cases:  
  - **Asexual rotifers?** Cohesion via selection/common descent; independence via divergence.  
  - **Hybrid zones?** Independence trumps gene flow if distinctness persists.  
  - **Fossils?** Lineages lack splits; divisions are utilitarian.  
  - **Neanderthals?** Independence during isolation, fusion after contact.  

  The ESC embraces evolution’s complexity—species are processes, not static categories. Your intuition for "separately evolving lineages" was spot-on; refining it with cohesion and independence captures reality better than interbreeding ever could.
