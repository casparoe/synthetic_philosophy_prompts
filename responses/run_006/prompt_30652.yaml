prompt: |-
  Construct a thought experiment that isolates the role of maxim description in Kant's Formula of Universal Law. The action should be an ordinary, intuitively permissible choice — a consumer, professional, or social decision, not a lifeboat case or a lie to a murderer. State the agent's maxim in a first-personal form that a reflective person might actually give, with no obvious gerrymandering. Under this maxim, universalizing must produce a contradiction in conception: the state of affairs in which everyone acts on it cannot be conceived, because the very practice the agent relies on would become impossible. The contradiction must arise from the impossibility of the social or practical arrangement, not from physical impossibility or a merely verbal stipulation. Then re-describe the same action under a second maxim that is equally natural and no more specific than an agent would need to make the action intelligible, and show that the contradiction disappears and the action passes the Formula of Universal Law.

  After the scenario, demonstrate that it meets each specification. State both maxims verbatim; describe the universalized world under each; locate the exact point at which the first universalization becomes inconceivable; and confirm that the second description is a re-description of the same action rather than a different action. Then say which feature of the case is doing the work. Address the strongest Kantian reply: which criterion for selecting an agent's true maxim — for example, a requirement that a maxim include all morally relevant descriptions, or a restriction to the agent's actual intention — would a Kantian deploy, and does that criterion decide between your two descriptions, or does the case show that the criterion itself is underdetermined? Conclude by identifying the weakest point in the construction: which premise, if successfully defended, would collapse the case, and what would change your verdict about whether it demonstrates a genuine problem for the Formula of Universal Law.

  After the prose, provide a structured summary as a JSON object with exactly these fields:

  - scenario: the action and context in one or two sentences.
  - maxim_1: the first maxim, verbatim.
  - maxim_2: the second maxim, verbatim.
  - universalized_world_1: what the world is like if maxim_1 is a universal law.
  - universalized_world_2: what the world is like if maxim_2 is a universal law.
  - contradiction_in_conception_1: boolean, and if true, the precise contradiction.
  - contradiction_in_conception_2: boolean.
  - verdict_1: "passes" or "fails" under the Formula of Universal Law.
  - verdict_2: "passes" or "fails" under the Formula of Universal Law.
  - load_bearing_feature: the single feature of the maxim or case that produces the divergence.
  - kantian_reply: the strongest response a Kantian could give.
  - weakest_point: the premise most likely to fail, and the consideration that would change the verdict.
