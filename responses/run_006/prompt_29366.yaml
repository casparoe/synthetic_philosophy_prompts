prompt: |-
  I'm putting together a handout for a second-year philosophy of perception module and I want it to be one of those 'which theory do you actually hold?' sorting quizzes, not a 'which label sounds like you?' thing. The topic is the argument from illusion and the disjunctivist response to it, and the students have just read the classic argument from illusion setup—bent stick in water, hallucinated dagger, afterimage, the works. I want the quiz to sort them by what they actually say about cases, so every question should be a concrete case with two or three options that are real answers someone could give, never 'do you think perception is a relation to sense-data?' or anything that uses the theory's own vocabulary.

  The positions that should end up as outcomes, one way or another: sense-datum theory, adverbialism, intentionalism (representationalism), metaphysical disjunctivism, epistemological disjunctivism, and naive realism. But please build the quiz from the logical space first—figure out which diagnostic questions actually split these positions, list the combinations of answers the questions allow, and only then place the named positions in that space. I'd especially like a note on any combination of answers that has no one defending it, and whether that's because it's incoherent, just unattractive, or genuinely unexplored. Also flag any two leaves that the quiz can't really separate (I suspect naive realism and metaphysical disjunctivism come out the same on every case question about veridical perception and only differ on what to say about hallucination, so the case questions may not separate them cleanly).

  Cases I definitely want in there, because they're the ones the course uses: the stick that looks bent in water but is straight, the afterimage you still 'see' when you close your eyes, pressing on your eyeball and seeing double, and a hallucination produced by direct brain stimulation that the subject cannot tell from a real perception. Eight to ten questions is the right size. The point of the whole thing is to get students to notice that the argument from illusion only gets a common factor between illusion and veridical perception if you've already answered some case questions a certain way—so the scoring key should make that visible, maybe by grouping questions under which assumption they're really testing. If some of my required positions can't be reached by any pattern of answers to your questions, tell me and say which case or claim would seperate them.
reasoning: |-
  Okay, let me tackle this philosophy of perception quiz request. The user wants a concrete case-based sorting quiz that reveals students' implicit commitments through their responses to perceptual scenarios, avoiding theoretical jargon. 

  First, I need to identify the core philosophical positions: sense-datum theory, adverbialism, intentionalism, both types of disjunctivism, and naive realism. The key is mapping these onto answer combinations from perceptual cases without using theory-laden terms. 

  The classic argument from illusion relies on three assumptions I should test: 
  - Common Kind Claim (illusion/veridical same fundamental state)
  - Phenomenal Principle (if something appears F, something is F)
  - Belief Transfer (we should believe appearances)

  For diagnostic questions, I'll use: 
  - Bent stick in water (illusion)
  - Afterimage with eyes closed (non-perceptual)
  - Eyeball pressure causing double vision (illusion)
  - Perfect hallucination (indistinguishable from reality)

  Each question will have concrete options representing different philosophical commitments. For example, for the bent stick: 
  A) You see a bent sense-datum
  B) You see a straight stick in a bending way
  C) You see a straight stick that appears bent

  I need to ensure the quiz can distinguish all positions. Naive realism and metaphysical disjunctivism both deny the Common Kind Claim, but differ on hallucinations - so I'll need a hallucination question to separate them. Epistemological disjunctivism requires a separate question about justification.

  The scoring key should group questions by which assumption they test (Common Kind, Phenomenal Principle, etc.) and show how different answer combinations lead to each theory. I'll flag any unoccupied positions - like the combination that denies Common Kind but accepts Phenomenal Principle, which seems incoherent.

  For the hallucination case, I'll include an option about justification to catch epistemological disjunctivism. The perfect hallucination scenario is crucial for separating naive realism from disjunctivism.

  The quiz structure should have 8-10 questions total, with each philosophical position corresponding to a unique answer pattern. I'll make sure the outcomes map clearly while highlighting how the argument from illusion depends on prior commitments revealed in early questions.
answer: |-
  Here’s a handout quiz designed to reveal implicit commitments through concrete cases, structured to expose how the argument from illusion relies on prior assumptions. The 10 questions test three core assumptions: **Common Kind Claim** (CKC), **Phenomenal Principle** (PP), and **Belief Transfer** (BT). Positions emerge from combinations of answers.

  ---

  ### **PHILOSOPHY OF PERCEPTION QUIZ**  
  *Answer based on your intuitive judgments about each case.*  

  1. **Bent Stick in Water**  
     You see a straight stick half-submerged in water; it looks bent. What’s happening?  
     A. *You directly see a bent thing (though it’s not the stick itself).*  
     B. *You directly see the straight stick, but in a "bent-looking" way.*  
     C. *You directly see the straight stick; its bent appearance is misleading.*  

  2. **Afterimage with Eyes Closed**  
     After staring at a bright light, you close your eyes and "see" a green spot. What is this?  
     A. *You’re seeing a green mental object.*  
     B. *You’re sensing green-ly (a mode of experience, not an object).*  
     C. *This isn’t seeing at all; it’s a different kind of state.*  

  3. **Eyeball Pressure (Double Vision)**  
     Pressing your eye makes one candle flame appear as two. Which is true?  
     A. *You see two flame-like things.*  
     B. *You see one flame in a "double-seeing" way.*  
     C. *You see one flame; the doubling is an illusion.*  

  4. **Hallucinatory Brain Stimulation**  
     Scientists stimulate your brain, making you "see" a red apple indistinguishable from a real one. What’s present?  
     A. *A red apple-like object (even though no apple exists).*  
     B. *No object, but you’re in an apple-experiencing state.*  
     C. *Nothing is present; you’re misled into thinking there’s an apple.*  

  5. **Same Hallucination (Follow-Up)**  
     In the brain-stimulation case, is your experience fundamentally *the same kind* as seeing a real apple?  
     A. *Yes, the experiences are identical in nature.*  
     B. *No, hallucination lacks the relational structure of real perception.*  

  6. **Veridical Apple Perception**  
     When you see a real red apple in good light, what’s happening?  
     A. *You directly perceive the apple itself (no intermediaries).*  
     B. *You perceive the apple via awareness of its properties/appearance.*  

  7. **Phenomenal Principle Test**  
     When something looks bent (like the stick), must *something* genuinely be bent?  
     A. *Yes—if it looks bent, a bent thing exists (even if mental).*  
     B. *No—appearances don’t require matching realities.*  

  8. **Illusion & Justification**  
     In the bent-stick case, are you *justified* in believing "There’s a bent thing before me"?  
     A. *Yes—your experience provides the same justification as veridical seeing.*  
     B. *No—only veridical perception justifies beliefs about mind-independent objects.*  

  9. **Hallucination & Justification**  
     In the brain-stimulation case, are you justified in believing "There’s an apple"?  
     A. *Yes—it’s subjectively indistinguishable from reality.*  
     B. *No—hallucinations lack the rational grounding of true perception.*  

  10. **Afterimage Ontology**  
      Is the green afterimage a *property of your experience* or *an object you experience*?  
      A. *An object (e.g., a mental patch).*  
      B. *A property (e.g., your sensing is "greened").*  

  ---

  ### **SCORING KEY & PHILOSOPHICAL POSITIONS**  
  Group answers by the assumptions they test:  

  | **Assumption**         | **Questions** | **Key Divide**                                                                 |
  |------------------------|---------------|--------------------------------------------------------------------------------|
  | **Common Kind Claim (CKC):** | Q5            | Accepts (A) or rejects (B) identical fundamental nature for veridical/illusory/hallucinatory cases. |
  | **Phenomenal Principle (PP):** | Q7            | Accepts (A): appearances imply existent objects. Rejects (B): appearances ≠ realities. |
  | **Belief Transfer (BT):** | Q8, Q9        | Accepts (A): illusions/hallucinations justify beliefs like veridical cases. Rejects (B): only veridical perception justifies. |

  #### **Position Mapping**  
  Based on your answers:  

  1. **Sense-Datum Theory**  
     - Q1A, Q2A, Q3A, Q4A, Q5A, Q6B, Q7A, Q8A, Q9A, Q10A  
     *Accepts CKC, PP, and BT. All perception involves direct awareness of mental objects.*  

  2. **Adverbialism**  
     - Q1B, Q2B, Q3B, Q4B, Q5A, Q6B, Q7B, Q8A, Q9A, Q10B  
     *Accepts CKC and BT, rejects PP. Experiences are ways of sensing, not relations to objects.*  

  3. **Intentionalism (Representationalism)**  
     - Q1B, Q2B/C, Q3B, Q4B/C, Q5A, Q6A/B, Q7B, Q8A/B, Q9A/B, Q10B  
     *Accepts CKC, rejects PP. Experiences are representational states; content determines phenomenology.*  

  4. **Metaphysical Disjunctivism**  
     - Q1C, Q2C, Q3C, Q4C, Q5B, Q6A, Q7B, Q8B, Q9B, Q10A/B  
     *Rejects CKC and PP. Veridical perception is a direct relation to mind-independent objects; illusions/hallucinations are fundamentally different states.*  

  5. **Epistemological Disjunctivism**  
     - Q1C, Q2C, Q3C, Q4C, Q5B, Q6A, Q7B, Q8A, Q9B, Q10A/B  
     *Rejects CKC and BT for hallucinations, retains BT for illusions. Veridical perception provides factive justification (you see *that* the stick is straight); hallucinations do not.*  

  6. **Naive Realism**  
     - Q1C, Q2C, Q3C, Q4C, Q5B, Q6A, Q7B, Q8B, Q9B, Q10A/B  
     *Rejects CKC and PP. Veridical perception directly presents mind-independent objects; non-veridical cases are not perceptions at all.*  

  ---

  ### **CRITICAL NOTES FOR THE HANDOUT**  
  - **Unoccupied Position**:  
    **Rejecting CKC but accepting PP** (e.g., Q5B + Q7A) is incoherent. PP implies a common factor (a "bent thing") in all bent-appearance cases, violating the disjunctivist rejection of CKC.  

  - **Indistinguishable Positions**:  
    - **Naive Realism (NR) vs. Metaphysical Disjunctivism (MD)** share *all veridical/illusion answers* (Q1C, Q3C, Q6A, Q7B, Q8B, Q10 flexible). They *only diverge on hallucination* (Q4/Q5):  
      - NR: Hallucinations aren’t perceptual states (Q4C, Q5B).  
      - MD: Hallucinations are perceptual but lack object-relation (Q4B/C, Q5B).  
      *→ Use Q4 to split them: NR chooses C ("nothing present"), MD often chooses B ("no object, but an experiential state").*  

  - **Why This Works**:  
    The argument from illusion **only works if you accept CKC (Q5A) + PP (Q7A)**. Students accepting these will be pushed toward sense-datum theory; rejecting them opens disjunctivist/naive realist paths. Epistemological disjunctivism is isolated by its unique **justification asymmetry** (Q8A + Q9B).  

  - **Clarifications**:  
    - Intentionalism is flexible on Q2/Q4/Q10 (hence multiple answers allowed).  
    - Q9 separates epistemological disjunctivism (B) from adverbialism/intentionalism (A).  
    - Q6 tests commitment to *directness* in veridical cases, splitting relational (NR/MD) from non-relational views.  

  This quiz forces students to confront their pre-theoretical commitments, revealing how the argument from illusion hinges on contested premises. The scoring key highlights which answers "lock in" susceptibility to the argument (CKC + PP).
