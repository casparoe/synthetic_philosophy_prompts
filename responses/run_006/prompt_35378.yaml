prompt: |-
  So I just got back from this incredibly long argument with my friend about advance directives — you know, those living wills where you spell out what treatments you want if you lose capacity later. We were going back and forth for like two hours about whether your earlier self actually has the authority to bind your later self when you've undergone serious psychological changes. He's a medical resident and I'm in a philosophy grad program, so we both had strong opinions and neither of us budged. The whole thing left me more confused than when we started, honestly.

  Here's what I want from you. I'd like you to act as an expert in bioethics and the philosophy of personal identity, and I want you to construct a thought experiment for me — a very specific one, built to precise specifications. Please think carefully, maybe brainstorm a couple candidates before settling on the final scenario, and make sure it actually satisfies everything I'm asking for.

  Here are the specs. I want a case where TWO different philosophical views about advance directives end up recommending the SAME action, while a THIRD view recommends the opposite action. The three views are:

  (1) The Dworkin-style "integrity" view: advance directives reflect the authentic values of the person considered as a unified life, and they should generally be respected because doing so protects the narrative integrity of that life. What matters is the critical interests of the person, not their ephemeral experiential interests.

  (2) The Dresser-style "present interests" view: only the currently existing person's interests carry moral weight. If the later self has genuinely different interests and preferences from the earlier self, the later self's interests should prevail — the advance directive was written by a person who no longer exists in the relevant sense.

  (3) A "threshold" or "sliding scale" view: advance directives have presumptive authority, but that authority weakens as psychological continuity weakens. Past some threshold of psychological change (something short of full-blown different-personhood), the directive loses its force and we should defer to the current self's expressed preferences.

  I want views (1) and (3) to AGREE — both say "respect the directive" — while view (2) says "override the directive." The case needs to be realistic: a medical or caregiving context, no sci-fi technology, no perfect predictors or weird physics. Keep the scenario description to about a paragraph. The psychological change should be real and significant — this shouldn't be a trivial case where the later self is virtually identical to the earlier self — but it also shouldn't be so extreme that the person is obviously a completely different person (that would make the case too easy for Dresser and too hard for the other two). The tension has to be genuine.

  After you lay out the scenario, walk me through what each of the three views says about it and why, step by step. Then tell me: which specific feature of the case is doing the work to make the Dresser view peel off from the other two? If you removed that feature, would the case collapse back into a standard easy case? And finally, how would a defender of the Dresser view attack the reasoning of the other two views in this specific scenario?

  Oh and please write your answer in American English.
