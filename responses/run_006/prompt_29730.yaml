prompt: |-
  I work on a small investment team at a family office — three of us, and I'm the one who has to sign off on most trades. Several times a week somebody brings us a trade: a broker pitching a block, a founder who wants to sell us secondary shares, a counterparty who suddenly wants to put on a swap or buy back a bond we hold. I've read enough rationalist-adjacent economics to have internalized the no-trade theorem and the Aumann agreeing-to-disagree result, and I basically buy the Groucho Marx point that if a sophisticated counterparty is eager to trade with me, that eagerness is itself evidence. But I don't have a procedure for turning that into an actual decision. Half the time I either refuse everything out of paranoia or talk myself into the trade with a story about why this time its different. The individual trades won't blow up the firm, but being wrong a few times a month will show up in the returns, and my boss will ask me to justify the decision in two sentences.

  So: turn the no-trade theorem and the market-epistemology stuff (prices aggregating information, adverse selection, the paradox that if prices already reflected everything nobody would be paid to gather information) into a checklist I can actually run in about twenty minutes before I decide whether to take the other side. I want the questions in the order I should ask them, what counts as a good-enough answer to each, where the procedure says stop with a no, and where it hands the decision to a person because it's a judgment call rather than a fact. I get that the theorem assumes common priors, so build in a step for 'is this trade just a difference in priors' — when is that a legitimate reason to trade and when is it exactly the moment I should walk away? Also tell me what to do when I cant get a good-enough answer in the time I have: default no, or escalate? Then run the procedure on two or three cases: a block of a liquid stock offered at a small discount, a founder of a company we already own who wants to sell us more of her own shares in a secondary, and one case where you expect the procedure to tell me not to do a trade I'd otherwise be excited about. Be honest about what the procedure can't catch — like when the counterparty isn't informed, just wrong — and which steps are really judgment calls dressed up as procedure.
reasoning: |-
  We are going to design a decision checklist that incorporates the insights from the no-trade theorem, adverse selection, and information asymmetry. The goal is to avoid trades where the counterparty has an information advantage that makes the trade likely to be against our interest, while allowing for trades that are motivated by legitimate differences in investment horizons, risk tolerance, or non-informational reasons.

  The checklist will have a sequence of questions. At each step, if the answer is unsatisfactory, we stop and reject the trade. If we proceed through all the steps and the trade passes, we can consider it.

  Key principles:
  1. The no-trade theorem: If two rational agents have common priors and their information is common knowledge, then they shouldn't trade. Therefore, we must look for reasons why trade might occur despite this (e.g., differences in risk aversion, liquidity needs, or non-common priors). But we must be cautious because the counterparty's eagerness to trade might signal that they have adverse information.

  2. Adverse selection: The counterparty may have private information that we don't, which makes the trade advantageous for them and disadvantageous for us.

  3. Information aggregation: We are operating in a market where prices reflect aggregated information. Therefore, any trade offered at a price that deviates from the market price must be scrutinized.

  Checklist Steps:

  1. **Is this trade within our investment mandate?**
     - Check if the trade fits our strategy, risk limits, and liquidity requirements.
     - If not, reject immediately.
     - *Time: 1 minute*

  2. **Is the counterparty likely to have superior information?**
     - Consider: Is the counterparty an insider (e.g., founder, executive, large block holder with board seat)? Are they trading in an opaque market? Is the asset complex and hard to value?
     - If yes, then we must be very cautious. Proceed to step 3 to assess the reason for the trade.
     - If no, proceed to step 4.
     - *Time: 2 minutes*

  3. **Can we identify a non-informational reason for the trade?**
     - The counterparty might need liquidity for personal reasons (e.g., divorce, tax bill, buying a house), portfolio rebalancing (e.g., they are over-concentrated and want to diversify), or regulatory requirements.
     - We need evidence: For example, the founder selling secondary shares might be buying a house (ask for proof? but be respectful) or the broker might be moving a block because an index fund is rebalancing.
     - If we can confirm a non-informational reason, proceed to step 5.
     - If we cannot, then reject the trade (due to adverse selection risk). 
     - *Time: 5 minutes (may require a quick call to the counterparty or broker)*

  4. **Is the trade at a price that is significantly different from the current market?**
     - For liquid assets: Compare the offered price to the current market bid-ask. A discount on a block trade is common due to liquidity, but if the discount is too large, it's a red flag.
     - For illiquid assets: Use our internal valuation. If the offered price is below our valuation, that's a positive. But if it's above, we must question why we are getting a "good deal".
     - If the price is not significantly different (e.g., within the bid-ask spread for liquid assets, or within a 5% band for illiquid) and there's no other red flag, then the trade might be for liquidity or other non-informational reasons. Proceed to step 5.
     - If the price is too good to be true (e.g., a large discount on a liquid stock without a clear reason), then reject (it likely signals hidden negative information).
     - *Time: 3 minutes*

  5. **Do we have a clear investment thesis independent of the trade opportunity?**
     - We should not do a trade just because it's offered. We must have a reason to want the asset at the offered price, regardless of the counterparty's motivation.
     - Our thesis might be based on fundamental analysis, technical factors, or portfolio fit.
     - If we don't have a thesis, reject. If we do, proceed.
     - *Time: 5 minutes (if we don't already have a thesis, we might need to do a quick review)*

  6. **Does the trade have a structural advantage?**
     - Are we getting a discount for providing liquidity (e.g., in a block trade)? Are we being compensated for complexity (e.g., a swap that requires hedging)? Is there a tax advantage?
     - If the trade offers a structural edge that compensates for the risk of adverse selection, then proceed. Otherwise, reconsider.
     - *Time: 2 minutes*

  7. **Final Judgment: Risk-Reward Assessment**
     - Given the above, what is the potential upside vs. downside? 
     - Consider: Position size, worst-case scenario, and how it fits in the portfolio.
     - If the risk-reward is favorable and we have passed the previous steps, then approve. Otherwise, reject.
     - *Time: 2 minutes*

  **Handling Time Constraints and Uncertainty:**
  - If we cannot get a satisfactory answer within the time (e.g., we can't reach the counterparty to ask about their motivation in step 3), then default to reject. The cost of missing a good trade is less than the cost of doing a bad one (as per the Groucho Marx insight).
  - If a step is a judgment call (like step 3 and step 7), we note that and require that two people on the team agree (if possible) or that we document the reasoning.

  **Dealing with Differences in Priors:**
  - The checklist addresses differences in priors in step 5 (our investment thesis) and step 3 (non-informational reasons). A difference in priors is a legitimate reason to trade only if:
     a) We have done our own analysis and are confident in our prior (step 5).
     b) The counterparty's reason for trading is not based on information we don't have (step 3) but on a different risk tolerance or time horizon.
  - However, if the counterparty is an insider (e.g., founder) and they are selling because they have a different prior about the company's prospects, that is exactly when we should walk away. Why? Because they have more information. So in step 3, if the reason is "they just want to reduce exposure" without a clear non-informational motive, we reject.

  Now, let's run the procedure on the examples:

  **Example 1: Block of a liquid stock offered at a small discount**

  1. **Mandate:** Likely fits (unless it's a stock we are prohibited from owning).
  2. **Counterparty information:** The broker is pitching a block. The seller might be an institution. We don't know if they have superior information. We must ask: why are they selling? (Proceed to step 3).
  3. **Non-informational reason?** Ask the broker: Why is the seller offering this block? If the broker says it's because of index rebalancing or a mandate change (e.g., the seller is a mutual fund that is reducing size), that's non-informational. If the broker doesn't know or hints at a strategic sale, reject. Assume we get a good reason: proceed.
  4. **Price:** The discount is small (e.g., 0.5% below the last close). For a liquid stock, this is within the typical liquidity discount. Proceed.
  5. **Investment thesis:** Do we like the stock? If we already have a positive view and the discount makes it slightly more attractive, then yes. If we don't, then we shouldn't buy just because it's cheap. (Assume we have a thesis: proceed.)
  6. **Structural advantage:** We are getting a small discount for providing liquidity. That's a structural edge. Proceed.
  7. **Risk-reward:** The position size is appropriate. The downside is limited because the stock is liquid and we can exit. Approve.

  **Example 2: Founder of a company we already own wants to sell us more of her own shares in a secondary**

  1. **Mandate:** If we are allowed to increase position, proceed.
  2. **Counterparty information:** The founder is an insider and almost certainly has superior information. Proceed to step 3 with caution.
  3. **Non-informational reason?** We must ask the founder: why are you selling? If she says she wants to buy a house or diversify because she's over-concentrated, that's plausible. But we need evidence? We can't ask for bank statements, but we can ask for context. If she says she's selling to invest in a new venture or because she's retiring, that's non-informational. However, if she cannot provide a convincing non-informational reason, reject. Also, note: if she's selling a small portion (e.g., 10% of her holdings) that's more likely to be for diversification than if she's selling a large portion. (Assume she's selling 20% and says it's for diversification and to fund a charity. We find that acceptable: proceed.)
  4. **Price:** The shares are illiquid. We have an internal valuation. If the price is below our valuation, proceed. If it's above, we must question why we are paying more than we think it's worth. (Assume it's at a 20% discount to our last valuation: proceed.)
  5. **Investment thesis:** We already own the company and have a positive view. We are happy to increase at a discount. Proceed.
  6. **Structural advantage:** We are getting a discount for providing liquidity in an illiquid security. Proceed.
  7. **Risk-reward:** The discount compensates for the risk. The position size is acceptable. Approve.

  **Example 3: A trade we'd be excited about but the procedure rejects**

  Case: A counterparty wants to buy back a bond we hold at a price above our model's value.

  1. **Mandate:** Fits.
  2. **Counterparty information:** The counterparty is the issuer. They have superior information about their own credit. Proceed to step 3.
  3. **Non-informational reason?** They say they are buying back debt to reduce leverage and improve their balance sheet. But is that the whole story? Why now? They might know that their credit is about to deteriorate (so they want to buy cheap) or about to improve (so they are locking in a high yield). Without a clear non-informational reason (like a strategic shift in capital structure that we can verify from public plans), this is a red flag. If we cannot verify a non-informational reason, we reject.
  4. **Price:** They are offering above our model value. That seems good, but why? They might know something positive that we don't? But wait, why would they pay more than they have to? This is the Groucho Marx moment: if they are eager to buy at a premium, they must know something we don't. We should be suspicious. Even if we proceed to step 5, we must be cautious.
  5. **Investment thesis:** We hold the bond because we think it's undervalued. But if the issuer is offering a price above our value, we should take the profit? But step 3 raised concerns. Without a non-informational reason, we reject at step 3.

  The procedure catches this because the issuer's eagerness to buy (and at a premium) is a red flag. They might have positive information that we don't, meaning the bond is worth more. So why would they pay a premium? It doesn't add up unless there's a non-informational reason. If we can't find one, we reject.

  **What the procedure can't catch:**
  - When the counterparty is wrong (not informed, just mistaken): The procedure might allow the trade because we have a non-informational reason and our thesis is positive. But if they are wrong, we might get a good deal. However, we have no way of knowing they are wrong. We rely on our own analysis (step 5) to avoid overpaying.
  - When the counterparty is lying about their reason: We can't always detect lies. We have to go by what they say and our judgment in step 3.
  - Judgment calls: Steps 3 and 7 are inherently judgment-based. We must be honest about that and document.

  **Escalation:**
  - If a trade is large or complex, and we are unsure, we should escalate to the entire team. But in a small team, that might be the same as a discussion. The checklist is a framework to guide the discussion.

  **Final Checklist Summary:**

  1. Mandate: Yes/No (Reject if No)
  2. Counterparty information: 
     - If likely superior information: go to 3.
     - Else: go to 4.
  3. Non-informational reason? 
     - If confirmed: go to 5.
     - Else: Reject.
  4. Price deviation: 
     - If within normal range: go to 5.
     - If too good to be true: Reject.
  5. Independent investment thesis: 
     - If yes: go to 6.
     - Else: Reject.
  6. Structural advantage: 
     - If yes: go to 7.
     - Else: Reconsider (may reject if no edge).
  7. Risk-reward assessment: 
     - If favorable: Approve.
     - Else: Reject.

  Time per trade: 20 minutes total (allocated as above). If any step cannot be completed in time, default to reject.
answer: |-
  Below is a structured, actionable checklist based on the no-trade theorem, market epistemology, and adverse selection principles. It's designed to be completed in **~20 minutes** per trade, with clear "stop/no" rules, escalation paths, and distinctions between factual checks and judgment calls. The goal is to avoid both reflexive paranoia and naive enthusiasm by forcing explicit consideration of information asymmetry, counterparty motives, and your own edge.

  ### Core Principles Embedded
  1. **No-trade theorem**: Trade requires either divergent priors or non-informational motives (e.g., liquidity needs). Eagerness from sophisticated counterparties is a red flag until proven otherwise.
  2. **Adverse selection**: Assume the counterparty knows more than you until you rule it out. Price alone isn't enough—scrutinize *why* the trade exists.
  3. **Market epistemology**: Your job isn't to outsmart prices but to identify gaps where your research/positioning provides an edge the counterparty lacks.
  4. **Groucho Marx heuristic**: "Never trade with someone who *wants* to trade with you" is the default. Override only with evidence.

  ---

  ### The Checklist: 7 Steps (20-Minute Max)
  **Key**:  
  - ✅ = Proceed to next step  
  - ❌ = Reject trade immediately  
  - ⚠️ = Escalate to team (if unresolved in time, default to ❌)  
  - *Italicized* = Judgment call (document rationale)  

  #### Step 1: **Is this trade within our playbook?** (1 min)  
  - **Check**: Does it fit our strategy (e.g., asset class, sector, risk limits)? Is sizing >5% of portfolio?  
  - **Good enough**: Explicitly matches our mandate (e.g., "We target biotech secondaries" or "Liquid hedges are allowed").  
  - **Stop/No**: ❌ if outside mandate.  
  - **Judgment**: Low—fact-based. Mandate breaches are non-negotiable.  

  #### Step 2: **Could the counterparty have material information we lack?** (3 min)  
  - **Check**: Is the counterparty an insider (founder, exec), market maker, or frequent trader in this asset? Is the asset opaque (e.g., private shares, complex swap)?  
  - **Good enough**: Counterparty is passive (e.g., index fund rebalancing) or asset is highly liquid with transparent pricing (e.g., S&P 500 stock).  
  - **Stop/No**: ❌ if insider + non-liquid asset (e.g., founder selling private shares) *without* moving to Step 3.  
  - **Judgment**: Medium—use heuristics (e.g., "Founder = high info asymmetry; broker moving liquid block = low").  
  - **Timeout**: ⚠️ Escalate if unsure. Default ❌.  

  #### Step 3: **Is there a verifiable non-informational motive?** (5 min)  
  - **Check**: Why is the counterparty eager? Ask: "What's driving this trade?" Demand evidence:  
    - Liquidity needs (e.g., tax payment, divorce, VC fund expiry).  
    - Regulatory/mechanical reasons (e.g., ETF rebalance, margin call).  
    - Risk management (e.g., de-risking pension fund).  
  - **Good enough**: Third-party proof (e.g., fund closure notice, public filing) or credible story *unrelated* to asset quality (e.g., "Founder buying real estate" + cross-check property records).  
  - **Stop/No**: ❌ if motive is vague ("strategic reasons") or implies their view > market's (e.g., "We’re reducing exposure").  
  - **Judgment**: High—*this is the critical filter*. Trust but verify.  
  - **Divergent priors rule**: Trade only if:  
    - Their motive is **non-informational** (e.g., liquidity), OR  
    - Your edge is **structural** (e.g., you’re a long-term holder vs. their short-term need).  
    - ❌ if divergent priors are purely informational (e.g., "They think the stock is overvalued; we think it’s cheap").  

  #### Step 4: **Does the price reflect all public information?** (3 min)  
  - **Check**: For liquid assets, compare to market (bid-ask, VWAP). For illiquid, benchmark to independent data (e.g., recent rounds, comps).  
  - **Good enough**:  
    - Liquid: Discount/premium within 1 standard deviation of historical spreads (e.g., block trade discount ≤0.5% for S&P 500 names).  
    - Illiquid: Price aligns with your last valuation (<10% deviation).  
  - **Stop/No**: ❌ if price implies the counterparty is leaving money on the table without explanation (e.g., 5% discount on liquid stock).  
  - **Judgment**: Low—rely on data. Use Bloomberg/Internal models.  

  #### Step 5: **Do we have an edge they lack?** (5 min)  
  - **Check**: What do we know that the market/counterparty doesn’t? Examples:  
    - Proprietary research (e.g., we met suppliers they didn’t).  
    - Structural advantages (e.g., we can hold longer; they’re time-constrained).  
    - Complementary knowledge (e.g., we own the competitor).  
  - **Good enough**: Articulate a specific, non-public insight (e.g., "We have a 6-month head-start on clinical trial data") or structural edge (e.g., "We’re tax-advantaged").  
  - **Stop/No**: ❌ if edge is generic ("We like the sector") or based on public data.  
  - **Judgment**: High—*be honest about your edge*. No boilerplate.  

  #### Step 6: **What’s the downside if we’re wrong?** (2 min)  
  - **Check**:  
    - Worst-case loss (e.g., liquidity crunch, 20% drawdown).  
    - Contagion risk (e.g., triggers covenants, correlates with portfolio).  
  - **Good enough**: Loss <2% of portfolio; no hidden tail risks.  
  - **Stop/No**: ❌ if loss >5% of portfolio or could force fire sales.  
  - **Judgment**: Medium—*stress-test*.  

  #### Step 7: **Final sanity check** (1 min)  
  - **Check**: Would we pursue this trade if it wasn’t offered to us? Does it pass the "Groucho test"?  
  - **Good enough**: "Yes" with a clear thesis (e.g., "We’d buy this block on-market anyway at a 0.3% discount").  
  - **Stop/No**: ❌ if trade relies on counterparty’s "kindness" or feels urgent.  
  - **Judgment**: High—*gut check*.  

  ---

  ### Timeout/Escalation Rules
  - **Default**: ❌ if any step isn’t resolved in time.  
  - **Escalate**: ⚠️ to team if:  
    - Step 3 (motive) is murky but plausible.  
    - Step 5 (edge) is borderline.  
    - Trade size >5% of portfolio.  
  - **Document**: 1–2 sentences per step (for your boss). Example: "Block trade: 0.4% discount within norms (Step 4), broker confirmed index fund rebalancing (Step 3), edge in our execution algo (Step 5)."  

  ---

  ### Case Studies
  #### Case 1: **Liquid Stock Block at 0.4% Discount**  
  - Step 1: ✅ (Within mandate).  
  - Step 2: ✅ (Broker moving block—low info asymmetry).  
  - Step 3: ✅ (Broker confirms index fund rebalancing—non-informational).  
  - Step 4: ✅ (Discount within normal 0.3–0.6% range).  
  - Step 5: ✅ (We have lower transaction costs than market).  
  - Step 6: ✅ (Max loss <0.5% of portfolio).  
  - Step 7: ✅ ("We’d buy this stock anyway").  
  - **Verdict**: ✅ Approve. **Why**: Non-informational motive + structural edge.  

  #### Case 2: **Founder Selling Secondary Shares (We Already Own)**  
  - Step 1: ✅ (Fits private growth strategy).  
  - Step 2: ❌? ⚠️ (Founder = insider → high info asymmetry). *Escalate to team*.  
  - Step 3: *Team asks*: "Why selling?" Founder: "Diversification for estate planning." Evidence: Trust documents ✅.  
  - Step 4: ✅ (Price at 10% discount to our last valuation).  
  - Step 5: ✅ (We know this company better than market—board access, 3 years of due diligence).  
  - Step 6: ✅ (5% position cap; no liquidity risk).  
  - Step 7: ✅ ("We were planning to buy more").  
  - **Verdict**: ✅ Approve. **Why**: Non-informational motive + verified edge.  

  #### Case 3: **"Exciting" Swap Offered by Sophisticated Hedge Fund**  
  - Context: Hedge fund wants a volatility swap we’d normally love—"cheap" vol vs. our models.  
  - Step 1: ✅ (Fits hedging program).  
  - Step 2: ❌ (Hedge fund specializes in vol → likely knows more than us).  
  - Step 3: Ask: "Why offer this?" Fund: "Portfolio rebalancing." Evidence: ❌ (No proof; vague).  
  - Step 4: ⚠️ (Price seems fair, but Step 3 failed).  
  - Step 5: ⚠️ (Our edge? We’re not vol experts—they are).  
  - **Verdict**: ❌ Reject at Step 3. **Why**: No non-informational motive + their eagerness suggests adverse selection. *The procedure kills your excitement because their edge is structural*.  

  ---

  ### What the Procedure Can’t Catch
  1. **Counterparty is wrong, not informed**: The checklist assumes sophisticated players. If the counterparty is mistaken (e.g., retail investor selling at a loss), Step 5 may still approve if you have an edge. But this is rare in institutional markets.  
  2. **Black swans**: Tail risks (e.g., fraud, macro shocks) aren’t covered—rely on Step 6.  
  3. **Relationship trades**: If your family office values long-term ties (e.g., with a founder), this may override. Document as "mandate exception."  
  4. **Pure liquidity provision**: If you’re *paid* for liquidity (e.g., bid-ask spread), that’s structural. But ensure Step 3/4 confirm it’s not information-driven.  

  ### Judgment vs. Procedure
  - **Most judgment-heavy**: Steps 3 (motive) and 5 (your edge). Be ruthless—ask "What’s *really* going on?"  
  - **Most procedural**: Steps 1 (mandate), 4 (pricing), and 6 (risk sizing). Use data, not gut.  
  - **Weakness**: The checklist is only as good as your access to information. If the counterparty lies (Step 3) or your edge is illusory (Step 5), it fails.  

  **Final Tip**: For your boss’s "two sentences," focus on:  
  - **Step 3 outcome** (non-informational motive?);  
  - **Step 5 outcome** (your edge).  
  Example: "Approved: Founder selling for liquidity, not info; our due diligence confirms upside. Rejected: Swap offered without credible motive; we lack vol expertise."  

  This turns theory into a defensive, time-bound process—filtering out bad trades while forcing explicit justification for "yes."
