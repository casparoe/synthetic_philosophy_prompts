answer: |-
  Your struggle reveals a deep tension in moral epistemology. After analyzing your cases and candidate principles, I propose this framework:

  **Principle:** A moral conviction functions as a **bias** when its justification relies *primarily* on culturally contingent intuitions **and** fails to demonstrate *intersubjective traction* – meaning it cannot connect its core objection to shared human concerns or values accessible across differing cultural starting points. A conviction functions as a **preference** when its justification, even if culturally influenced, demonstrates intersubjective traction by grounding its core objection in reasons potentially persuasive to someone holding different initial intuitions.

  **Key Components:**
  1.  **Culturally Contingent Intuition:** The initial feeling or judgment stems from specific cultural norms/upbringing.
  2.  **Justification:** The reasons offered to support the intuition.
  3.  **Intersubjective Traction:** The ability of the justification to appeal to values, harms, benefits, or principles that could resonate with individuals *outside* the specific cultural context that birthed the intuition, even if they ultimately disagree. This involves appeal to:
      *   Shared human experiences (e.g., suffering, flourishing, fairness, autonomy, harm).
      *   Consistent application of principles.
      *   Empirical evidence about consequences.
      *   Avoidance of purely parochial concepts (e.g., "unnatural," "sacred," "disgusting" *without further justification linking these to accessible harms/benefits*).

  **Why this works better:**
  *   **Avoids Historical Psychology:** Focuses on the *structure of justification offered now*, not the murky causal origins.
  *   **Avoids Elitism:** Doesn't require expertise, just the ability to connect the intuition to broader, potentially shareable reasons. An ordinary person *can* articulate this.
  *   **Handles Engagement:** Engagement helps *develop* intersubjectively tractable justifications but isn't strictly necessary. Someone insulated *might* still hold a justifiable preference if their intuition aligns with intersubjective reasons, while someone engaged *might* still hold a bias if their post-engagement justification remains parochial.
  *   **Distinguishes Articulation from Substance:** Articulation helps reveal whether traction exists, but a poorly articulated reason *might* point to a deeper intersubjective concern, while a well-articulated one *might* just be sophisticated parochialism.

  **Application to Your Cases:**

  1.  **Dog Eating:** **Bias.**
      *   *Justification:* "Dogs are not food animals." Purely parochial category. No link to suffering, fairness, harm, or any intersubjective value beyond cultural norm. Fails traction.

  2.  **Factory Farming Pigs:** **Preference.**
      *   *Justification:* "Causes severe and unnecessary suffering." Appeals directly to a near-universally recognized harm (suffering) and a principle (unnecessary suffering is wrong). High intersubjective traction, even if debated.

  3.  **Arranged Marriage:** **Bias.**
      *   *Justification:* "People should choose their own partners." While autonomy *is* an intersubjective value, this justification is too thin and absolute. It doesn't engage with potential counter-values (family stability, social cohesion in specific contexts) or demonstrate *why* autonomy trumps all else here. Remains tied to the specific cultural intuition of romantic love as sole basis, lacking developed traction.

  4.  **Polyamory:** **Preference (Leaning).**
      *   *Justification:* "Exclusive commitment provides unique depth of trust & understanding non-exclusive arrangements cannot replicate." Appeals to intersubjective goods – trust, mutual understanding, depth of relationship – and makes a claim about how best to achieve them. While contestable and stemming from cultural norms, the reasons *aim* at shareable human values and experiences. Has traction, even if others disagree based on different experiences/values.

  5.  **Nepotism:** **Preference.**
      *   *Justification:* "Hiring should track merit because roles affect third parties; departing is unfair to better-qualified candidates." Appeals directly to intersubjective principles: fairness, consequences for third parties, meritocracy (as a means to efficiency/justice). High traction, grounded in accessible concerns.

  6.  **Genetic Enhancement:** **Bias.**
      *   *Justification:* "Feels like playing God," "unnatural." These are classic examples of culturally contingent intuitions *without* intersubjective traction. "Playing God" is a parochial religious/moral concept; "unnatural" is notoriously vague and rarely points to a clear, shareable harm without further elaboration (e.g., does it cause suffering? undermine equality? create unfair pressure?). Contrast with (5) where "fairness" is directly invoked. *Overturns your verdict?* No, but clarifies *why* it's different from (5): (5) justifies using intersubjective principles; (6) relies on culturally specific intuitions lacking developed traction.

  7.  **Sex Work:** **Preference (but complex).**
      *   *Application:* The justification – "sexual intimacy ought to be non-transactional" – *does* attempt intersubjective traction. It appeals to a conception of intimacy, authenticity, and potential degradation inherent in commodification – values concerning human relationships and dignity that *can* be discussed across cultures. The person engaged seriously with counterarguments (harm reduction, autonomy) but finds the core value of non-transactional intimacy paramount. This demonstrates the value *persists* even when challenged by other intersubjective concerns (autonomy, harm reduction). It's a deeply held *preference* informed by a specific weighting of intersubjective values (intimacy/authenticity vs. autonomy/harm-reduction), not a failure to connect to broader reasons. The "deep-seated sense" is the *intuition*, but the *justification* ("ought to be non-transactional") provides traction.

  **Why the Distinction is Useful (But Not Absolute):**

  The distinction isn't metaphysically absolute ("bias" vs. "preference" as ontological categories) but rather *diagnostic* and *functional*:

  1.  **Diagnostic:** It flags convictions that are *more likely* to be unexamined cultural inheritances resistant to reason because their justification lacks broader grounding. This signals where deeper reflection or engagement might be most needed or transformative (e.g., Cases 1, 3, 6).
  2.  **Functional:** It helps predict how a conviction might hold up in discourse with diverse others. Biases will struggle to find purchase outside their native context; preferences have the *potential* for dialogue and persuasion, even amidst disagreement.
  3.  **Graded:** It's a spectrum. Some preferences have stronger traction than others (e.g., 2 vs. 4), and some biases are more entrenched/parochial than others.

  **Addressing Your Concern (Collapse of Distinction):**

  The distinction doesn't *collapse*, but it reveals that *all* moral convictions originate in culturally shaped intuitions. The key difference lies in the *justificatory structure* developed to support them. A "bias," under this view, is a conviction that remains *justificationally parochial* – its supporting reasons cannot escape its cultural birthplace. A "preference" is one that develops *justificationally tractable* reasons – reasons that can travel and engage with others on shared ground, even if they originate locally. This framework explains your case patterns by focusing on the *quality and reach* of the reasons offered, not just their origin or the holder's sincerity.
