     - If it were proven that the set of all humanly provable mathematical statements forms a consistent, recursively axiomatizable formal system, then by Gödel's first incompleteness theorem, there would be a true arithmetical statement that is not provable by humans. But we could then see the truth of that statement, which would be a contradiction. Hence, the human mind would not be a formal system? Actually, the argument shows that if we are such a system, then we cannot prove our own Gödel sentence, but we can see it is true. So the conclusion would be that we are not such a system. But the position holds that we are not a formal system. However, if we were proven to be one, then we would have a contradiction because we can see the truth of the Gödel sentence. Hence, either we are not consistent, or we are not recursively axiomatizable, or we cannot always see the truth of the Gödel sentence? This is the core of Lucas-Penrose.
