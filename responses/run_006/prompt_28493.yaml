     Clarification: The position says the theorems impose no in-principle limitation on what a machine could do. So if we can show that because of the theorems, there is something a human can do that no machine (even a hypercomputer) can do, then that would be a fatal defeater. However, the theorems only apply to formal systems that are recursively axiomatizable and consistent. So if a machine is not so restricted, then it might avoid the limitation. Therefore, the fatal defeater would require showing that any machine (even a hypercomputer) must be a consistent recursively axiomatizable formal system. That is not known and seems unlikely because there are models of hypercomputation that can decide the halting problem and hence are not recursively axiomatizable.

