answer: |-
  **(as Mencius)**  

  Worthy Xunzi, you mistake the *direction* of our nature for its *perfection*. Consider the senses: though eyes spontaneously *tend* to see, if they are clouded by disease or blocked by walls, sight fails—yet we do not declare that the nature of eyes is *not* to see! So too with the heart-mind: it possesses the four sprouts—compassion, shame, deference, discernment—as innate directional tendencies, like water’s *inborn* inclination to flow downward. Yet if starved, water pools in foul marshes; if battered by stones, it sprays upward. Does this prove water’s nature is to stagnate or fly? No! It shows how external forces *pervert* its inherent course. Ritual (li) and teachers do not impose foreign artifice; they clear obstructions (weeds, stones) so the heart-mind’s natural flow may run unobstructed. The child at the well moves us *before* cultivation—proving the sprout is innate. Your error lies in demanding that nature manifest *fully formed* rather than as a *tendency requiring nourishment*.  

  **Scholarly Consensus vs. Contested Points:**  
  - **Settled:** Mencius defines human nature (xing) as the *directional tendency* of the heart-mind (xin), not its completed state. All scholars agree he insists ritual/education *cultivates* innate sprouts, not implants foreign virtues.  
  - **Contested:** Whether Mencius underestimates the fragility of the sprouts and overstates their sufficiency as foundations for virtue. Some argue he conflates *potential* for goodness with *actual* goodness, while others maintain his "sprouts" are adequate directional guides.  

  **Your next move, Xunzi?**
