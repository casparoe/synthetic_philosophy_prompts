prompt: |-
  Something I keep tripping over when I read neuroscience and animal-cognition papers, and I can't tell if it's a real question or just language policing. The authors will say, flatly, that a population of place cells represents the rat's location, that a honeybee waggle dance says where the nectar is, that a vervet alarm call means leopard — no scare quotes. But the same authors will bend over backwards to avoid saying a thermostat represents the room temperature or that tree rings represent a past drought; that's 'just information' or metaphor. So the field seems to draw a line between an organism's states and ordinary physical covariation, and treat only the first as literally contentful.

  I've seen 'teleosemantics' thrown around in blog comments, but I don't trust my handle on it, so I want the implicit theory reconstructed from the practice rather than the label. What theory of mental content does that practice presuppose? Does it need teleosemantics (content fixed by evolved function), or would a causal-informational account also license the line, or is the practice underdetermined by several theories? And is the practice internally consistent: they'll attribute content to a neural ensemble trained on an arbitrary lab task, which has no evolutionary function — that looks like it breaks the teleosemantics reading, but if they fall back to 'it carries information' then the thermostat gets back in. What would have to change in how the field talks if the presuppossed theory turned out false?
reasoning: |-
  Okay, let me unpack this user's question. They're grappling with a pattern in neuroscience and animal cognition literature where researchers freely attribute representational content to biological systems (like place cells or bee dances) but avoid doing so for non-biological systems like thermostats or tree rings. The user wants to understand the implicit theory behind this practice.

  First, I need to reconstruct the unstated principles guiding this distinction. The key seems to be that researchers treat representations as literal in biological cognition but metaphorical elsewhere. But why? The user mentions teleosemantics as a possible framework but is unsure. They also point out a contradiction: lab-trained neural ensembles with no evolutionary history still get called "representational," which would break pure teleosemantics.

  The user's core concern is whether this practice is theoretically coherent. They're noticing a potential double standard. When a vervet monkey's alarm call is said to "mean" leopard, but a thermostat's state doesn't "represent" temperature, what justifies that difference? The user suspects it might not just be linguistic preference but points to deeper theoretical commitments.

  I should consider several angles. First, the biological vs. non-biological divide might stem from intentionality - the "aboutness" that seems unique to minds. But that's circular. More plausibly, researchers might presuppose that content arises from proper biological function (teleosemantics) or from being part of a cognitive architecture capable of error and action-guidance.

  But the lab-trained neural ensemble example complicates this. If neurons acquire content through learning in an artificial task, not evolution, then teleosemantics alone can't explain it. Maybe the field implicitly combines multiple criteria: biological substrate plus systemic role in guiding behavior, even if acquired.

  The thermostat comparison is telling. It covaries with temperature and controls heating, yet isn't considered representational. Why? Probably because its "response" is direct causation, not mediated by something that could misrepresent. If it breaks, we say it's malfunctioning, not "misrepresenting."

  The user also asks what would happen if the presupposed theory were false. That's insightful. If content is just covariation, then thermostats should count. But researchers resist that, suggesting they believe content requires more - perhaps the possibility of decoupling from immediate stimuli, or integration into a larger cognitive system.

  Underlying this might be a commitment to natural norms. Biological systems can fail in ways that violate their function (e.g., a place cell firing in the wrong location), creating room for misrepresentation. A thermostat doesn't "fail to represent"; it just breaks.

  The lab-training case shows the field likely supplements teleosemantics with a learning-based account. Neural ensembles acquire content through experience, making their function derived rather than evolutionary. This suggests a hybrid theory where content arises from the system's acquired function within a cognitive architecture.

  The user's frustration is understandable. The practice appears inconsistent: invoking evolution for bees but not for lab rats. But internally, researchers might see both as part of goal-directed systems where states have the function of standing in for something else to guide behavior. The thermostat lacks such goals.

  To answer coherently, I'll need to articulate how the field navigates these tensions. They're not just being arbitrary; they're drawing on a cluster of criteria: biological cognition, functional role, decoupleability, and normativity. No single theory captures it perfectly, but teleosemantics plus computational roles comes close, with wiggle room for learning.
answer: |-
  You've hit on a profound and contentious issue at the heart of cognitive science and philosophy of mind: **what justifies attributing genuine *representation* to biological systems while withholding it from merely informational physical systems?** The practice you observe isn't arbitrary; it reflects an implicit commitment to a cluster of ideas, primarily **teleosemantics** (or biosemantics), often supplemented by **computational/cognitive architecture** criteria. However, the field's treatment of lab-trained neural ensembles reveals tensions and suggests the line isn't always drawn consistently.

  Here's a reconstruction of the implicit theory and its challenges:

  ### Core Implicit Theory: Teleosemantics + Cognitive Architecture
  1.  **Teleosemantics (The Primary Driver):**
      *   **Core Idea:** A state `S` (e.g., a place cell firing pattern, bee dance) *represents* some state of the world `W` (e.g., location, nectar direction) if and only if:
          *   `S` is *supposed to* be caused by `W`.
          *   This "supposed to" is defined by the **evolved proper function** of the mechanism producing `S`. The function was *selected for* indicating `W` because doing so contributed to fitness (e.g., navigating, finding food, avoiding predators).
      *   **Why it draws the line:** Thermostats and tree rings lack evolved biological functions. Their correlation with temperature/drought is a result of physical law or accident, not natural selection shaping them *for the purpose of* carrying information. The covariation is "dumb" causation, not normatively guided function.
      *   **Handling Misrepresentation:** This is teleosemantics' strength. A place cell firing in the wrong location *mis*represents because it fails to perform its evolved function correctly. A broken thermostat just malfunctions; it doesn't "misrepresent" temperature because it never had the *function* of representing.

  2.  **Cognitive Architecture / Systemic Role (The Supplement):**
      *   **Core Idea:** Representational states must play a *specific causal/computational role* within a larger cognitive system capable of *processing* information to guide flexible, goal-directed behavior. They are components in an information-processing mechanism.
      *   **Why it draws the line:** Place cell activity is integrated into the hippocampal cognitive map, influencing navigation decisions. A bee dance is a signal interpreted by other bees, guiding their flight. Thermostats are simple control systems; tree rings are passive records. They aren't part of a system that *uses* the information in a cognitively rich way.
      *   **Handling Lab-Trained Ensembles:** This criterion helps here. Even without *evolutionary* history, neurons trained on an arbitrary task acquire a *function within the artificial cognitive architecture* of the animal's brain *during its lifetime*. Their firing patterns are *supposed to* (based on learning/plasticity) correlate with the task stimulus/response and play a causal role in generating the learned behavior. They become components of a transient, acquired information-processing system.

  ### Why a Pure Causal-Informational Account Fails to Draw the Line
  *   A causal-informational theory (e.g., Dretske's early work) defines representation solely by reliable covariation: `S` represents `W` if `S` is causally correlated with `W` under normal conditions.
  *   **Problem:** This lets the thermostat and tree rings back in. They reliably covary with temperature/drought. It also struggles mightily with misrepresentation (is a broken thermostat "misinforming"?).
  *   The field *explicitly rejects* this pure covariation view as sufficient for genuine representation, precisely because it blurs the line they want to draw. They implicitly require something *more* – the teleological "for-ness" or the systemic role.

  ### The Tension: Lab-Trained Ensembles & Internal Consistency
  *   **The Challenge:** Attributing content to neurons trained on an arbitrary lab task (e.g., responding to a novel light pattern for reward) seems to break pure teleosemantics. There was no *evolutionary* selection for representing *that specific* arbitrary stimulus.
  *   **How the Practice (Tries to) Resolve It:**
      1.  **Derived Teleosemantics:** The *capacity* for learning via plasticity *is* an evolved function. The learning mechanism's function is to acquire new indicator functions based on experience. The content of the *acquired* representation is derived from the function of the learning mechanism itself. The neuron's state gets its "supposed to" from the learning process, which is itself an evolved function.
      2.  **Emphasis on Cognitive Role:** The field heavily emphasizes that these neurons are now playing a specific computational role in a cognitive task – they are part of a circuit *processing information* to solve a problem, just like evolutionarily ancient systems do. Their activity *matters* for the system's goal-directed behavior in a way a thermostat's state doesn't.
      3.  **"As If" Teleology:** Sometimes, the language implies the system *acquires* a functional role analogous to an evolved one through learning. The lab task creates a mini "design" environment where success (reward) shapes the neural response, mimicking natural selection on a compressed timescale.
  *   **Is it Consistent?** It's *strained* but often defended. Critics argue derived teleosemantics stretches the concept thin. Proponents argue learning mechanisms are core biological functions, making acquired representations genuine. The practice prioritizes the *functional-cognitive role* within a biological agent over pure evolutionary pedigree.

  ### What Would Change if the Presupposed Theory Was False?
  If teleosemantics (or the functional-cognitive role supplement) was conclusively refuted:

  1.  **Radical Shift 1 (Eliminativism):** Researchers might stop talking about "representation," "meaning," or "content" entirely for *all* systems (brains, bees, thermostats). They might adopt purely mechanistic, non-semantic descriptions (e.g., "neural state S covaries with W and triggers motor output M").
  2.  **Radical Shift 2 (Pan-Representationalism):** If a weaker theory (like sophisticated covariation + complexity) won out, researchers might start attributing genuine representation much more liberally – to thermostats, tree rings, immune systems, galaxy formation simulations. The special status of biological cognition would dissolve.
  3.  **Moderate Shift (Refined Criteria):** The field might double down on the *cognitive architecture/systemic role* aspect, defining representation strictly by its position within complex, flexible control systems capable of decoupled processing (using the information offline, in novel combinations), error-correction, and goal pursuit. This might still exclude thermostats but would require much more careful justification for attributing content even to simple biological signals like some reflexes or the bee dance. Lab-trained ensembles might fit better here.
  4.  **Focus on Mechanism over Semantics:** The emphasis might shift entirely to *how* mechanisms work (e.g., predictive coding, Bayesian inference, dynamical systems) without committing to whether they truly "represent" in a philosophical sense. "Represents" might become a convenient shorthand devoid of deeper metaphysical commitment.

  ### Conclusion
  The practice you observe primarily presupposes **teleosemantics**, grounded in evolved biological function, as the key differentiator between "mere covariation" and genuine representation. The **cognitive architecture/systemic role** criterion acts as a necessary supplement, especially crucial for handling learned representations and emphasizing why neural activity "counts" as representational in a way thermostat states do not.

  *   **Does it *need* teleosemantics?** To draw the line *as they currently do*, yes. A pure causal-informational account fails to exclude thermostats.
  *   **Is it underdetermined?** Yes, in principle. A sufficiently complex systemic-role theory *could* potentially draw a similar line without explicit teleology, though it's harder. Teleosemantics provides the most natural fit for the biological focus and the normativity (misrepresentation) the field relies on.
  *   **Is it internally consistent?** It faces significant tension with learned representations in artificial tasks. The field resolves this by appealing to **derived teleosemantics** (the function of learning mechanisms) and emphasizing the **acquired cognitive role**, but this stretches the core teleosemantic idea. The practice shows a strong preference for attributing content to states within *biological cognitive agents* performing *task-relevant information processing*, regardless of whether the task is natural or artificial, which relies more on the systemic role criterion.

  The field's language isn't just policing; it reflects a substantive, though sometimes contested, theoretical commitment to biological function and cognitive architecture as the foundations of mental content. If this foundation were undermined, the way neuroscientists and cognitive ethologists talk about neural activity and animal communication would fundamentally change, likely becoming either more eliminativist or more pan-representational.
