prompt: |-
  I host a small science-and-ideas podcast and next week I'm interviewing an economist whose spent her whole career defending the revealed-preference line on utility: utility isn't some internal quantity of satisfaction, it's just a numerical shorthand for a pattern in what people choose. I don't want her to restate the position, I want to actually stress-test it. Draft eight to ten questions that go past the intro-level stuff. At least one each on: the tautology worry (if utility is just whatever someone maximizes, then "people maximize utility" doesn't say anything), menu dependence and the weak axiom of revealed preference (how much damage do violations like the decoy effect really do), whether the view can underwrite welfare economics at all (if choice reveals preference, can a policy ever make someone worse off than they chose to be?), and preference reversals from the experimental literature. For each question, include the follow-up I should ask assuming she gives the standard economist's reply. End with a question she can't bat away with "that's just noise" or "people make mistakes." And no "what drew you to economics" filler.
reasoning: |-
  Okay, the user hosts a science podcast and is interviewing an economist who defends revealed preference theory. They want challenging questions that go beyond introductory material, focusing on specific critiques like the tautology worry, menu dependence, welfare implications, and preference reversals. 

  First, I need to understand the core challenges to revealed preference theory. The tautology problem is fundamental—if utility is just defined by choices, then saying people maximize utility becomes circular. Menu dependence issues like the decoy effect show choices aren't consistent across contexts. Welfare economics becomes tricky because if choices reveal preferences, how can policies be justified as improving welfare? And experimental evidence of preference reversals seems to contradict the theory's assumptions.

  The user wants at least one question per area, each with a follow-up for standard economist replies. The final question must avoid dismissal as "noise" or "mistakes." No soft questions—this is about rigorous critique.

  For the tautology: Start with how avoiding circularity requires empirical constraints, then follow up by asking if revealed preference can predict novel choices without behavioral assumptions. 

  For menu dependence: Use the decoy effect example, then press on whether context effects mean preferences are constructed, not revealed. 

  Welfare economics: Ask how revealed preference handles paternalism, then challenge the "rationality" assumption when choices harm well-being. 

  Preference reversals: Cite Lichtenstein/Slovic's experiments, then demand where the line between "noise" and theory failure is drawn. 

  The knockout question: Use the endowment effect with identical goods to force acknowledgment of framing over preference. 

  The user wants to test theory limits, not rehearse defenses. Questions must be precise and force substantive engagement. Avoid letting the economist retreat to "choices reveal preferences, period." Target real-world implications and experimental anomalies. 

  Final question must have no escape hatch—endowment effect studies with identical goods remove the "mistake" excuse by showing valuation shifts purely from ownership framing. That’s theory-contradiction, not noise.
answer: |-
  Here are 10 rigorous questions targeting core critiques of revealed preference theory, designed for a deep stress-test. Each includes a follow-up anticipating standard replies:

  1.  **Tautology & Predictive Power:** "If utility is *defined* as what's maximized by observed choices, doesn't 'people maximize utility' become unfalsifiable by definition? How does revealed preference theory generate *novel, testable predictions* without smuggling in auxiliary assumptions about preference stability or menu-independence that go beyond pure choice data?"
      *   *Anticipated Reply:* "It predicts future choices given past choices, assuming consistent preferences."
      *   **Follow-up:** "But doesn't that prediction rely entirely on the *assumption* of stability? If choices change tomorrow (say, due to a new framing), the theory simply redefines utility to fit the new data. Where's the *independent* test of the theory itself, rather than just *describing* whatever happens?"

  2.  **Menu Dependence & WARP:** "Violations of the Weak Axiom of Revealed Preference (WARP), like the asymmetric dominance (decoy) effect, seem endemic. If preferences revealed over {A,B} can be reversed simply by adding a dominated option C to create menu {A,B,C}, doesn't this fundamentally undermine the idea that choices reveal a stable underlying *preference order*? How can 'preference' be a property of the *chooser* if it's so contextually labile?"
      *   *Anticipated Reply:* "WARP is a *testable* condition. Violations mean revealed preferences in that context are inconsistent, not that the axiom is wrong. We can model context effects separately."
      *   **Follow-up:** "But if context effects are pervasive enough to *routinely* generate WARP violations for significant choices, doesn't that render the core concept of a context-independent 'underlying preference' revealed by choice empirically vacuous? Doesn't 'preference' become a description of the *choice context* rather than a property of the *individual*?"

  3.  **Welfare Economics & Paternalism:** "If 'better off' is defined solely by an individual's own choices ('revealed preference'), how can revealed preference theory *ever* justify a policy that restricts choice (e.g., banning lead paint, requiring retirement savings, sin taxes) for the individual's own good? Doesn't this framework logically preclude *any* form of paternalism, no matter how clearly choices seem to conflict with well-being?"
      *   *Anticipated Reply:* "Yes, within strict revealed preference, policy should generally expand choice sets unless there are externalities. 'Better off' is defined by choice."
      *   **Follow-up:** "Doesn't this lead to an absurdity? If someone consistently 'chooses' debilitating addiction due to present bias or misinformation, revealed preference theory, by its own logic, must declare them 'better off' addicted than if they were forced into rehab. How is this a useful foundation for welfare economics concerned with actual well-being?"

  4.  **Preference Reversals - Procedure Invariance Failure:** "Experiments like Lichtenstein and Slovic's show systematic preference reversals: people price bet A higher than bet B but choose bet B over bet A. This violates procedure invariance – a cornerstone assumption needed to map choices onto a single underlying preference ordering. Doesn't this demonstrate that 'preference' isn't a pre-existing state *revealed* by choice, but is *constructed* by the elicitation method itself?"
      *   *Anticipated Reply:* "These are lab anomalies or 'mistakes' due to task complexity; real market choices reveal true preferences."
      *   **Follow-up:** "But the reversals are systematic and predictable, not random noise. If choice *method* fundamentally alters the expressed ranking, how can we claim any single method (like simple binary choice) accurately 'reveals' a stable underlying preference? Doesn't this imply the 'preference' is an output of the cognitive process used for the *specific* task, not an input?"

  5.  **The Ontology of Preference:** "Does revealed preference theory commit to the *existence* of a stable, context-independent preference ordering in the mind/brain prior to choice, or is it strictly an 'as-if' model – a useful fiction for prediction? If the former, how do you reconcile this with the empirical evidence of context-dependence? If the latter, what justifies using 'preference' language at all, rather than just talking about stochastic choice rules?"
      *   *Anticipated Reply:* "It's an 'as-if' model; we don't need to commit to psychological reality for predictive purposes."
      *   **Follow-Up:** "If it's purely 'as-if,' how does revealed preference theory differ fundamentally from a well-fitting behavioral model that explicitly incorporates context or cognitive processes? Doesn't clinging to 'preference' language implicitly smuggle in the very internalist ontology the theory seeks to avoid?"

  6.  **Learning & Endogenous Preferences:** "How does revealed preference theory handle genuine preference change through learning or experience? If someone chooses X over Y today, but after trying both, consistently chooses Y over X tomorrow, does their past choice 'reveal' a 'mistake,' or simply a different preference? Doesn't this blur the line between 'revealing' a preference and *forming* it through choice?"
      *   *Anticipated Reply:* "Preferences can change over time. We look for consistency *at a point in time* or model learning."
      *   **Follow-up:** "But if the *act of choosing and experiencing* is what *shapes* future preferences, doesn't this make the 'revealed preference' at time T a poor predictor of choices at T+1 *after* the experience? Doesn't this undermine the theory's predictive claim and highlight choice as preference-*forming*, not just preference-*revealing*?"

  7.  **Welfare Under Misinformation:** "Consider an investor who chooses a fraudulent scheme based on falsified returns. Their choice 'reveals' a preference for that scheme over alternatives *given their beliefs*. When the fraud is revealed and they suffer losses, can revealed preference theory say they are *worse off*? After all, their choice was optimal given their information at the time."
      *   *Anticipated Reply:* "They maximized *expected* utility given their beliefs. Ex-post, they are worse off, but that doesn't invalidate the ex-ante revealed preference."
      *   **Follow-up:** "But the theory defines 'better off' solely by ex-ante choice. Ex-post welfare judgments seem to require a concept of well-being *independent* of that choice – satisfaction, resources, etc. Doesn't this expose a critical limitation of revealed preference for evaluating *outcomes*, forcing us back towards an internalist or resourcist view of welfare?"

  8.  **The Role of Beliefs & Constraints:** "Choice is a function of preferences *and* beliefs *and* constraints. Revealed preference theory tries to isolate 'preference' from choice data. But without strong, independent assumptions about beliefs and constraints, isn't this identification problem fundamentally insoluble? Doesn't any observed choice pattern have infinitely many (Beliefs, Constraints, Preferences) combinations that could explain it?"
      *   *Anticipated Reply:* "We use variation in constraints (prices, incomes) and assume rational expectations or stable beliefs to identify preferences."
      *   **Follow-up:** "Given the evidence of widespread systematic belief biases and misperceptions (e.g., overconfidence, base-rate neglect), how defensible is the 'rational expectations' or 'stable beliefs' assumption? Doesn't attributing *all* unexpected choice shifts *only* to preference changes, rather than belief errors, risk serious misidentification?"

  9.  **Aggregation & Social Welfare:** "If individual welfare is defined solely by their own choices, how can revealed preference theory ground *social* welfare judgments? Does the impossibility theorems (Arrow) pose an even *deeper* problem here, since there's no internal 'utility' quantity to even *attempt* to aggregate? Is 'social preference' via voting just another revealed preference, even if it's cyclical?"
      *   *Anticipated Reply:* "Social choice is complex. Pareto efficiency (making someone better off without making anyone worse off, defined by their choices) is a robust revealed-preference-based criterion."
      *   **Follow-up:** "But Pareto is incredibly weak. Most real policy changes involve winners and losers. Without *interpersonal* comparisons of utility (which revealed preference explicitly rejects), how can revealed preference theory provide *any* guidance for evaluating non-Pareto improvements? Doesn't this render it largely useless for practical social welfare analysis?"

  10. **The Knockout Question - Framing Without Mistake:** "Consider robust experimental findings like the endowment effect with *identical* goods (e.g., mugs). People randomly assigned a mug demand significantly more to sell it than those not assigned are willing to pay to buy it. This valuation gap *cannot* be explained by transaction costs, income effects, or 'mistakes' – it's purely an ownership framing effect. Crucially, it implies a WARP violation: The 'seller' prefers cash over mug at price X, while the identical 'buyer' prefers mug over cash at price X. Doesn't this demonstrate, unambiguously, that the *description of the choice role* (owner vs. non-owner) fundamentally alters the revealed preference ordering *for the exact same objects*, contradicting the core axiom and the idea that choice reveals only the chooser's stable valuation of the *objects themselves*?"
      *   *Why it works:* This directly targets WARP using identical goods, identical people differing only by random assignment, and a clean valuation gap. "Noise" or "mistakes" can't explain the systematic, role-dependent reversal. It forces confrontation with framing vs. stable object preference.

  **Key Principles Used:**

  *   **Beyond Definition:** Focused on empirical consequences (prediction, welfare), ontology, and identification problems, not just restating the definition.
  *   **Specific Critiques:** Directly addressed tautology, menu dependence (WARP violations), welfare foundations, and preference reversals as requested.
  *   **Anticipated Replies:** Follow-ups target common defenses ("stability assumption," "context effects are separate," "as-if modeling," "ex-ante/ex-post," "rational expectations," "Pareto").
  *   **Knockout Question:** Uses the endowment effect's role-based framing (not good quality) with identical goods to eliminate "mistake" or "noise" excuses. It's a direct, unambiguous challenge to WARP and the "stable preference" concept.
  *   **No Filler:** All questions are substantive challenges to the theory's coherence, predictive power, and applicability.

  This line of questioning should push the discussion into deep philosophical and empirical challenges, moving well beyond introductory justifications. Good luck with the interview!
