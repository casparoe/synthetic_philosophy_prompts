  We are designing an in-class activity for a philosophy of physics seminar on the substantivalism-relationism debate. The activity is centered on Newton's bucket argument, but with the constraint that students can only use relative motions between objects in the room (no absolute space). The goal is to have students experience the challenge of explaining the concave surface of the water when the bucket and water are rotating together (relative to each other they are at rest) and the flat surface when they are in relative motion.

  **Activity Title:** Relative Rotation and the Bucket: A Challenge for Relationism

  **Learning Objective:** Students will experience the difficulty of explaining the shape of the water surface in Newton's bucket using only relative motions between objects in the room. They will then connect this to the substantivalist claim that absolute space is needed and the relationist response (Machian move).

  **Materials:**
  1. A bucket (with a lid that can be secured and then removed without spilling, or a bucket that can be covered with a rigid lid) for each group. Alternatively, one bucket for the whole class if groups are small and take turns.
  2. Water (with a little food coloring for visibility).
  3. A turntable (like a Lazy Susan) or an office chair that spins smoothly for each group. If using office chairs, have one for the bucket and one for the observer? But note: we need to spin the bucket and water together. Alternatively, we can have the bucket secured to the turntable or chair.
  4. String or a way to suspend the bucket initially? Actually, for simplicity, we'll start with the bucket at rest on the turntable and then spin the turntable.
  5. A camera (optional) to record the water surface for the whole class to see, or a way for students to observe without disturbing the setup (like a phone on a stand).
  6. Paper towels for spills (inevitable).

  **Setup:**
  - Before class, set up stations for each group (3-4 groups, depending on class size). Each station has a turntable with the bucket (with water and lid secured) on it, and a way to spin the turntable (by hand, or with a motor if available, but hand-spun is fine).
  - The bucket should be about half full of colored water and have a secure lid. This lid is to prevent spills during the initial spin-up and to allow the water to be at rest relative to the bucket initially. Then, when the bucket is spun, the water will initially be at rest relative to the room (and the bucket moves relative to the water). Then, after a while, the water will start to rotate with the bucket.

  **Rules for Students:**
  1. Students work in small groups (3-5 per group).
  2. They must explain the shape of the water surface at each stage using only the relative motions between the bucket, the water, and other objects in the room (e.g., the turntable, the floor, the walls, the students themselves, etc.). They cannot refer to absolute space, absolute rotation, or anything outside the room (unless they make a Machian move to the fixed stars, but that comes later).
  3. They will make predictions and then observe.

  **Timeline (75 minutes):**

  1. **Introduction (10 minutes):**
     - Briefly remind students of the debate: substantivalism (space exists as a thing in itself) vs. relationism (space is just the relations between objects).
     - Introduce Newton's bucket: a bucket of water is suspended by a cord, twisted, and then released. Initially, the water is flat and the bucket spins relative to the water. Then, as the water starts to rotate with the bucket, the surface becomes concave. Finally, when the bucket stops, the water continues to rotate and the surface remains concave.
     - Explain the challenge: they will do an experiment and must explain the water's surface shape at different stages using only relative motions between things in the room.

  2. **Activity (40 minutes):**
     - **Stage 1: Prediction (10 minutes):**
       - Groups discuss and write down predictions for the water surface shape at three stages:
          a) Initially: bucket spinning, water not spinning (relative to the room) -> relative motion between bucket and water.
          b) After a while: water rotating with the bucket -> relative motion between bucket and water is zero (they are rotating together relative to the room).
          c) After stopping the bucket: bucket stopped, water still rotating -> relative motion again.
       - They must also predict the relative motions at each stage (between bucket and water, and between each and the room) and the surface shape (flat or concave).
     - **Stage 2: Experiment (15 minutes):**
       - Each group performs the experiment:
          - Step 1: Place the bucket (with lid on) on the turntable. Spin the turntable (and bucket) quickly. The water inside is initially at rest relative to the room (because the lid prevents it from moving with the bucket). Remove the lid carefully (without jostling) to observe the water surface. They should see it flat or nearly flat. (Note: in reality, there might be some immediate coupling, so we have to be quick. Alternatively, if the lid is removed before spinning, then we start spinning the bucket and the water is initially at rest relative to the room. Then we observe immediately: the bucket is moving relative to the water -> flat surface? But actually, the water may start to rotate quickly. So we have two methods: either start with the lid on and remove after spinning, or start without the lid and observe immediately after starting the spin. We'll go with the lid method for a clearer initial stage.)
          - Step 2: Allow the water to start rotating with the bucket (this takes a little time). Then observe: the surface becomes concave. This is when the water and bucket are rotating together relative to the room.
          - Step 3: Stop the bucket suddenly (hold the bucket still). The water continues to rotate. Observe the concave surface even though the bucket is now at rest relative to the room and the water is rotating relative to the bucket and the room.
       - They record their observations and compare with predictions.
     - **Stage 3: Explanation (15 minutes):**
       - Groups try to explain their observations using only relative motions between objects in the room. They write down their explanations.

  3. **Debrief and Discussion (25 minutes):**
     - Each group reports their predictions and explanations (focus on the explanation part).
     - Highlight the challenge: At stage (b), the bucket and water are at rest relative to each other (no relative motion) but the surface is concave. At stage (a) and (c), there is relative motion between bucket and water but the surface is flat (stage a) or concave (stage c)??? Actually, at stage (a) the surface is flat, at stage (b) concave, and stage (c) concave. But note: in stage (c) there is relative motion between bucket and water and the surface is concave. So the problem is: 
          - Stage a: relative motion between bucket and water -> flat surface
          - Stage b: no relative motion between bucket and water -> concave surface
          - Stage c: relative motion between bucket and water -> concave surface
       - This is confusing because at stage a and stage c there is relative motion but the surface is flat in a and concave in c. So the relative motion between bucket and water doesn't determine the surface shape. What does? The rotation relative to the room? But that would be absolute rotation? 
     - The key point: In stage (b) and (c), the water is rotating relative to the room (and the fixed stars) and the surface is concave. In stage (a), the water is not rotating relative to the room (it's at rest) and the surface is flat. But note: in stage (a), the bucket is rotating relative to the room. So the relationist must explain why the water's rotation relative to the room (or the fixed stars) matters, but the bucket's rotation relative to the room (without the water) doesn't cause the water to become concave? 
     - The problem for relationism: without absolute space, how do we explain that the concave surface occurs only when the water is rotating relative to the fixed stars (or the room) regardless of the relative motion between the bucket and the water?
     - Introduce the Machian move: Ernst Mach suggested that the rotation is relative to the fixed stars. So if we consider the entire universe (the fixed stars) then the water in stage (b) and (c) is rotating relative to the fixed stars and that causes the centrifugal force. In the activity, the room (and the walls, etc.) can stand in for the fixed stars. So when the water is rotating relative to the walls of the room, the surface becomes concave. But note: in stage (a), the water is at rest relative to the walls and the surface is flat. In stage (b) and (c), the water is rotating relative to the walls -> concave.
     - However, note that in stage (a) the bucket is rotating relative to the walls, but the water is not. Why doesn't the bucket's rotation relative to the walls cause the water to become concave? Because the water is not rotating? So the relationist must say that it's the rotation of the water relative to the distant matter (the fixed stars, or the room) that matters.

  4. **Connecting to the Debate (5 minutes):**
     - Substantivalist: This shows that rotation is absolute. The water is rotating in absolute space in stages (b) and (c) and that causes the centrifugal force. Absolute space is the reference frame for rotation.
     - Relationist (Machian): Rotation is relative to the fixed stars (or the entire mass distribution of the universe). In our experiment, the room (and the Earth) can be taken as a proxy for the fixed stars. So when the water rotates relative to the room, it becomes concave. Without the fixed stars (if the universe were empty) there would be no centrifugal force? (This is a thought experiment.)

  **What predictably goes wrong:**
  1. **Water spills:** Even with lids, removing the lid while spinning is tricky. And when stopping the bucket, water might splash. Have plenty of towels and maybe do it over a tray.
  2. **The water starts rotating too quickly:** It may be hard to observe the initial flat surface because the water starts rotating with the bucket almost immediately. Solution: use a bucket with a smooth interior and very still water. Also, spin the bucket quickly and remove the lid quickly. Alternatively, use a viscous liquid (like corn syrup) to slow down the coupling? But that changes the experiment. Alternatively, accept that the initial stage might be very short and just point out what we expect.
  3. **Not seeing the concave surface clearly:** Use a light or a pointer to cast a shadow, or use a camera with a close-up to project. Also, food coloring helps.
  4. **Students might focus on the relative motion between the bucket and water and miss the role of the room:** That's the point! They are forced to try and fail to explain without the room, and then we bring in the room as a Machian move.

  **What the activity cannot capture:**
  - The activity is confined to the room, which is itself in motion (rotating with the Earth, orbiting the Sun, etc.). So the "fixed stars" we are appealing to are not really fixed. In the real debate, the fixed stars are very far away and their mass might be what matters (as in Mach's principle). In our room, the walls are close and their mass is negligible. So the relationist move of using the room as a stand-in for the fixed stars is imperfect because in reality the fixed stars have a huge mass. This is why Mach's principle is controversial and not fully accepted. Also, in general relativity, the geometry of spacetime is influenced by matter, so rotation is relative to the local inertial frames which are determined by the mass distribution (including distant matter). But the activity cannot capture the role of mass in determining inertia.

  **Alternative if spinning a bucket of water is too messy:**
  - Use a video demonstration (but then it's not hands-on). Or use a simulation (but that might not feel as real). Or use a different setup: a ball on a string in a rotating frame? But the bucket is classic.

  **Conclusion:** This activity should make students feel the force of Newton's argument and the challenge for relationism, and then appreciate the Machian move. It sets the stage for discussing whether the Machian move is satisfactory and how it relates to modern physics (like general relativity).
answer: |-
  ### Newton's Bucket Activity: Structured In-Class Exercise  
  **Goal:** Make students grapple with the core tension in Newton's bucket argument—why the water surface is concave when the bucket and water rotate *together* (despite no relative motion between them) but flat when they move *relative* to each other—using only relational language (no absolute space).

  ---

  ### **Activity Structure**  
  **Total Time:** 75 minutes  
  **Materials:**  
  - 2–3 buckets (1 per group) with secure, easily removable lids (test for leaks!).  
  - Water (fill buckets 1/3 full; add food coloring for visibility).  
  - 2–3 turntables/Lazy Susans or office chairs (for spinning the bucket).  
  - Towels/spill containment trays (for accidents).  
  - Whiteboard/flip chart for predictions and explanations.  
  - Timer.  

  **Group Setup:**  
  - Divide students into 3–4 small groups (4 students each).  
  - Each group gets a bucket (on a turntable/chair) and a spill tray.  

  ---

  ### **Rules for Students**  
  1. **Language Constraint:** All explanations must use **only relative motions** between objects in the room (e.g., "bucket vs. water," "water vs. floor," "bucket vs. students"). Banished terms: "absolute space," "absolute rotation," "inertial frame."  
  2. **Predictions First:** Groups must agree on predictions *before* observing each stage.  
  3. **Rotate Roles:** Assign roles per stage:  
     - **Predictor** (forecasts surface shape),  
     - **Spinner** (handles rotation),  
     - **Observer** (describes surface shape),  
     - **Explainer** (justifies using relative motions).  

  ---

  ### **Timeline**  
  #### **(1) Setup & Context (10 min)**  
  - **Instructor intro (5 min):** Briefly recap substantivalism (space exists independently) vs. relationism (space is relational). Frame the challenge: "Today, you’re relationists—explain everything through relative motion."  
  - **Activity rules (5 min):** Explain roles, constraints, and safety (no spinning while lid off, slow rotations).  

  #### **(2) Prediction Phase (15 min)**  
  - Groups predict surface shape (flat or concave) and relative motions for **three stages**:  
    - **Stage 1:** Bucket spinning fast, water stationary relative to the room (high bucket-water relative motion).  
      - *How to achieve:* Spin bucket *with lid on*, then remove lid quickly.  
    - **Stage 2:** Bucket and water spinning together (near-zero bucket-water relative motion).  
      - *How to achieve:* Keep spinning after Stage 1; water "catches up" after ~10 seconds.  
    - **Stage 3:** Bucket suddenly stopped, water still spinning (high bucket-water relative motion again).  
      - *How to achieve:* Grab bucket to stop it; water sloshes due to inertia.  
  - Groups record predictions on paper (e.g., "Stage 1: Flat surface because water and bucket move relative to each other").  

  #### **(3) Experiment Phase (20 min)**  
  - **Stage 1 (5 min):**  
    - With lid *on*, spin bucket rapidly. Remove lid. Observe surface (should be flat).  
    - Groups record observations and relative motions (e.g., "water stationary vs. floor, bucket moving vs. water").  
  - **Stage 2 (5 min):**  
    - Continue spinning until water rotates with bucket (~10–15 sec). Observe surface (concave).  
    - Groups record (e.g., "water and bucket move together vs. floor, but water spins vs. walls").  
  - **Stage 3 (5 min):**  
    - Stop bucket abruptly. Observe surface (remains concave as water spins).  
    - Groups record (e.g., "water moves vs. bucket, bucket stationary vs. floor").  
  - **Cleanup (5 min):** Secure lids; wipe spills.  

  #### **(4) Explanation Phase (15 min)**  
  - Groups craft **relationist explanations** for each stage using only objects in the room (e.g., walls, floor, turntable).  
  - **Prompt questions:**  
    - "Why is the surface flat in Stage 1 but concave in Stage 2 when relative motion between bucket and water decreases?"  
    - "In Stage 3, why is the surface concave even with high bucket-water relative motion?"  
  - Groups share summaries on whiteboard.  

  #### **(5) Debrief & Discussion (20 min)**  
  ##### **A. Reveal the Tension (5 min)**  
  - Highlight student explanations. They’ll struggle with:  
    - **Stage 1 (flat):** Easy—"water and bucket move relative to each other."  
    - **Stage 2 (concave):** Hard—"bucket and water move together, so why is the surface curved?"  
    - **Stage 3 (concave):** Harder—"high relative motion, but surface is curved like Stage 2!"  
  - **Key contradiction:** Relative motion between bucket/water doesn’t predict surface shape.  

  ##### **B. Map to the Debate (15 min)**  
  - **Newton’s substantivalism:**  
    - Surface concavity indicates rotation relative to *absolute space* (not just objects in the room).  
    - Stages 2 and 3: Water rotates absolutely → concave. Stage 1: No absolute rotation → flat.  
  - **Relationist response (Machian move):**  
    - Students likely appealed to "water vs. walls" or "water vs. floor" to explain Stages 2/3.  
    - **Mach’s insight:** Rotation is relative to the *entire universe* (e.g., fixed stars). In this room, the walls/lab *stand in* for the cosmos.  
      - "When water rotates relative to the room’s walls (Stages 2/3), centrifugal forces arise → concave surface."  
      - "In Stage 1, water is at rest relative to walls → no forces → flat."  
    - **But:** Newton would argue the walls are arbitrary—what if the room rotates too? Mach says the *mass* of the universe matters (fixed stars dominate inertia).  

  - **Twist discussion:**  
    - "Could a relationist explain this using *only* bucket-water motion? Why not?"  
    - "Does the Machian move 'solve' the problem? What if the room were empty?"  

  ---

  ### **Predictable Problems (Beyond Spills)**  
  1. **Water couples too quickly:** In Stage 1, water starts rotating with the bucket before observations.  
     - *Fix:* Use colder water (higher viscosity) or spin faster initially. Emphasize quick lid removal.  
  2. **Misinterpreting "relative motion":** Students fixate on bucket-water pairs only, ignoring the room.  
     - *Fix:* Intervene with probing questions: "What is the water moving relative to *besides* the bucket?"  
  3. **Confusion in Stage 3:** Students may think surface flattens when bucket stops.  
     - *Fix:* Use highly visible dye and spin water vigorously beforehand. Stress: "Observe *immediately* after stopping."  
  4. **Over-simplified explanations:** Groups may ignore the room entirely or default to "inertia" without relational language.  
     - *Fix:* Enforce the "objects in the room" rule strictly during explanations.  

  ---

  ### **Limitations of the Activity**  
  - **Can’t capture the role of mass/distance:** Mach’s appeal to the "fixed stars" relies on the *cosmic mass distribution* affecting inertia. In this activity, the room’s walls are lightweight and close by—unlike the distant, massive universe. Students might dismiss the walls as irrelevant, missing why Mach invokes the stars.  
    - *Mitigation:* During debrief, clarify: "In reality, Mach argues the stars’ mass *causes* inertia. Our room is a stand-in, but Newton would say walls don’t count—hence the need for absolute space."  
  - **Ignores acceleration’s relativity:** The activity focuses on rotation, but deeper relationist theories (e.g., Julian Barbour) treat all motion as relative. This nuance is lost without discussing linear acceleration.  
  - **Newton’s "globes" thought experiment:** The bucket is only half the story. Newton’s two globes (connected by a cord in empty space) show tension *without* a container. Confinement to a bucket/room obscures this.  

  ---

  ### **Why It Works**  
  Students physically engage with the paradox, hitting the relationist "wall" when Stages 2/3 defy bucket-water relativity. The debrief makes the substantivalist position intuitively compelling, while the Machian move emerges organically from their attempts to use the room as a reference. This sets up deeper debate: *Is appealing to the stars any better than absolute space?*
