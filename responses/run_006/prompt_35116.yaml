  Finally, I want your honesty on the bottom-line question: is the inviolate level a genuine structural insight that my formal vocabulary is missing, or is it a metaphor that does not survive the attempt to make it precise? If the former, what would I need to add to my conceptual toolkit to capture it? If the latter, what exactly does the metaphor obscure?
