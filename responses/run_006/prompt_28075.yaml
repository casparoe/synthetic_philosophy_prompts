prompt: |-
  I'm on the board of a small effective-altruism-adjacent foundation, and we're having a bit of an identity crisis. We use the importance-tractability-neglectedness framework to evaluate causes — you know, the standard ITN thing — but we've never actually sat down and formalized how we weight the three factors against each other. We just go case by case and trust our guts, which worked fine until we hit a proposal that split the board right down the middle.

  Looking back at our last five decisions:

  1. We funded a malaria vaccine development project. Our assessment: high importance (malaria kills half a million people a year, mostly kids), medium tractability (vaccine R&D is hard but there are promising candidates), medium neglectedness (global health gets tons of money overall, but vaccine R&D for neglected diseases has specific gaps).

  2. We declined a climate change mitigation proposal focused on U.S. federal policy advocacy. Very high importance, but low tractability (the political gridlock is real and our grant was tiny relative to the forces at play), and low neglectedness — this space is absolutely swarming with funders.

  3. We funded an AI alignment research group at a non-elite university. High importance, medium tractability, high neglectedness — most alignment funding flows to top-ten departments, and there's talent elsewhere that nobody's supporting.

  4. We declined a deworming scale-up in a region already saturated by other major funders. Medium importance, very high tractability (we know deworming works and it's cheap), but very low neglectedness — our marginal dollar would literally be displacing other peoples' dollars at this point.

  5. We funded a project on improving institutional decision-making around global catastrophic risks. High importance, medium tractability (it's hard to measure but the theory of change is plausible), very high neglectedness — almost nobody works on this.

  So here's the new proposal that's causing trouble: a pandemic preparedness project focused on strengthening surveillance systems in middle-income countries. Our analysis: high importance (the next pandemic could be worse than COVID), medium-high tractability (we have concrete interventions that demonstratably work), but low neglectedness — post-COVID, this space has gotten a ton of attention and funding, from governments and philanthropies alike.

  Half the board says it's an obvious yes: importance and tractability are solid, and neglectedness shouldn't be a dealbreaker when the stakes are literally millions of lives. The other half says it's a clear no: the space is crowded, our marginal dollar would do more good somewhere more neglected, and we'd basically be free-riding on the attention the cause is already getting.

  I'm less interested in what you personally think about pandemic funding than in what we should decide if we want to be consistent with our own precedents. Which past case is the closest analog? And if our precedents genuinely underdetermine this — which I suspect they do — what principle would we be adopting with each choice? Can you articulate the different implicit weighting schemes that are consistent with our first five decisions, and tell me what further hypothetical case would cleanly distinguish them?
reasoning: |-
  Okay, the user is on the board of a small EA-adjacent foundation facing a decision deadlock on a pandemic preparedness grant. They've provided five past decisions using the ITN framework and want consistency analysis rather than personal opinions. 

  First impression: This is a beautifully structured problem statement - rare to see such clear precedent cases. The core tension is between two valid EA perspectives: one prioritizing importance/tractability when stakes are existential, the other insisting on neglectedness as non-negotiable. 

  Looking at the precedents: Cases 1 (malaria) and 3 (AI alignment) show willingness to fund despite medium neglectedness when importance is high. But case 2 (climate policy) was rejected partly due to low neglectedness despite high importance. The key differentiator appears to be tractability - climate had low tractability while pandemic has medium-high. 

  Hmm... the malaria vaccine case feels closest. Both involve: 
  - High importance (child deaths vs pandemic risk) 
  - Medium tractability 
  - Medium-low neglectedness (global health vs pandemic funding) 
  But pandemic preparedness has even lower neglectedness post-COVID. 

  What's intellectually fascinating is how this exposes two possible consistent frameworks: 
  A) "Importance-first" - where high importance justifies lower neglectedness if tractability ≥ medium 
  B) "Neglectedness-threshold" - where low neglectedness vetoes unless importance is existential AND tractability very high 

  The user's genius move was asking for a hypothetical to test these. For Framework A, I'd propose a biosecurity project with 1% extinction risk reduction - high importance should carry it despite low neglectedness. For Framework B, a depression intervention in unfashionable demographics would test if neglectedness can override medium importance. 

  Practical recommendation: Show both frameworks fit past decisions equally well, then have board members vote on which hypothetical they'd fund. That forces them to confront their implicit weights rather than argue about pandemics. 

  Bonus insight: The malaria case might be their Rosetta Stone - if they'd fund it again today knowing what they know now, pandemic prep should qualify. If not, they've shifted toward neglectedness absolutism.
answer: |-
  Based on your precedents, **the malaria vaccine case (#1) is the closest analog** to your pandemic preparedness proposal. Both share a core profile: **High Importance + Medium Tractability + Medium-to-Low Neglectedness**. Your decision here will reveal whether your foundation prioritizes **"Importance-First"** or **"Neglectedness-as-Veto"** weighting.

  ### Why Malaria (#1) is the Key Precedent
  -   **Shared ITN Profile:** Malaria (H/M/M) vs. Pandemic Prep (H/MH/L). Neglectedness is the primary difference (Medium vs. Low), but Importance and Tractability are similarly strong.
  -   **Contextual Similarity:** Both are global health/biosecurity interventions with massive life-saving potential. Both have significant existing funding *broadly*, but your funding targets specific, plausibly underfunded *gaps* (neglected disease R&D vs. middle-income country surveillance).
  -   **Precedent Outcome:** You funded Malaria despite only "medium" neglectedness and acknowledged global health funding saturation. This shows **Neglectedness isn't an absolute veto** for your board when Importance & Tractability are strong.

  ### The Two Consistent Frameworks Implied by Your Precedents
  Your past decisions are consistent with *both* frameworks below. The pandemic proposal forces a choice between them:

  1.  **The "Importance-First" Framework (Fund Pandemic Prep & Malaria):**
      *   **Weighting:** Importance > (Tractability ≈ Neglectedness). **High Importance can compensate for Medium/Low Neglectedness IF Tractability is at least Medium.**
      *   **Logic:** When stakes are existential (millions of lives, extinction risk), acting is paramount even if others are also acting, provided your intervention still has a reasonable chance of success (Tractability).
      *   **Supported By:** Funding Malaria (#1 - M Negl), Funding AI Alignment (#3 - H Negl, but note Importance is also H), Funding Institutional Decision-Making (#5 - VH Negl). Declining Climate (#2) fits due to *Low Tractability + Low Neglectedness*. Declining Deworming (#4) fits due to *Medium Importance* being insufficient to overcome *Very Low Neglectedness*.

  2.  **The "Neglectedness-as-Veto" Framework (Decline Pandemic Prep, Fund Malaria):**
      *   **Weighting:** Neglectedness is a threshold factor. **Low/Very Low Neglectedness is a veto UNLESS paired with Very High Importance AND High Tractability.**
      *   **Logic:** Marginal impact is paramount. Funding saturated areas displaces others or adds little value. Exceptions only for truly overwhelming, near-certain existential risks where even marginal additions are critical.
      *   **Supported By:** Funding Malaria (#1 - M Negl *is above the veto threshold*), Declining Climate (#2 - L Negl veto), Funding AI Alignment (#3 - H Negl), Declining Deworming (#4 - VL Negl veto). Funding Institutional DM (#5 - VH Negl) is the ideal case here. Malaria (#1) is the *weakest* fit for this framework, showing the threshold is likely "Low/Very Low".

  ### Why the Pandemic Proposal Splits You
  *   **The "Importance-First" Board:** Sees strong parallels to Malaria (#1): High stakes, workable solutions, and a *specific gap* (middle-income surveillance) justifying action despite broader funding. "Low" neglectedness isn't a dealbreaker for millions of lives.
  *   **The "Neglectedness-as-Veto" Board:** Sees this as closer to Climate Advocacy (#2) or Deworming (#4): The space is too crowded ("Low" neglectedness), making their marginal dollar ineffective displacement. Pandemic risk, while high, isn't *certain* enough (vs. malaria's *current* deaths) to override the veto.

  ### The Crucial Hypothetical to Distinguish the Frameworks
  **"Would you fund a project with Very High Importance (e.g., 1% reduction in near-term human extinction risk), High Tractability, but Very Low Neglectedness (e.g., a well-funded asteroid defense project)?"**

  *   **"Importance-First" Framework:** **YES.** Existential risk trumps saturation. A marginal improvement in survival odds is invaluable.
  *   **"Neglectedness-as-Veto" Framework:** **NO (or highly reluctant).** Unless the project uniquely addresses a critical gap *within* the saturated field, the marginal dollar likely displaces others. "Very High Importance" alone isn't sufficient to override "Very Low Neglectedness".

  ### Recommendation for Your Board
  1.  **Acknowledge the Ambiguity:** Your precedents genuinely underdetermine this. Malaria (#1) is the closest case, but its "Medium" neglectedness vs. Pandemic's "Low" creates room for interpretation.
  2.  **Test with the Hypothetical:** Debate the asteroid defense (or similar) hypothetical. It forces clarity on whether "High/Very High Importance" *alone* can ever override "Low/Very Low Neglectedness". The outcome reveals your true weighting priority.
  3.  **Decide Your Principle:** Are you:
      *   **Importance-First Optimizers?** (Fund the Pandemic Proposal - precedent: Malaria #1)
      *   **Marginal Impact Purists?** (Decline the Pandemic Proposal - precedent: Climate #2/Deworming #4, interpreting Malaria #1 as having *sufficient* neglect)
  4.  **Formalize for the Future:** Use this decision to establish your explicit weighting (e.g., "We require at least Medium Neglectedness unless Importance is Very High AND Tractability is at least Medium"). This prevents future deadlocks.

  **Your choice isn't about pandemics; it's about defining how your foundation trades off acting on urgent, funded problems vs. seeking truly unique leverage points.** The malaria precedent leans slightly towards funding, but the distinction in neglectedness levels means adopting the "Importance-First" framework explicitly is the clearest path to consistency.
