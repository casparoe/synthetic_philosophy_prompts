  ### Proposed Eighth Case to Distinguish the Principles  
  To conclusively determine which principle she uses, design a case where:  
  - **Reasonable Expectations** and **Duty-Based Contextualism** align (both predict misleading is as bad as lying).  
  - **Warranty of Truth** predicts lying is worse.  

  **Case: The Job Interview**  
  - **Context**: A job candidate is asked, "Were you fired from your last job?"  
    - Candidate was fired but rehired the next day after a misunderstanding.  
  - **Lying option**: "No, I was never fired." (false)  
  - **Misleading option**: "I left on good terms and my employer reinstated me immediately." (true but implies no firing occurred)  

  #### Why this case?  
  - **Reasonable Expectations/Duty-Based Contextualism prediction**: **Both equally bad**.  
    - Commerce-like context (job interview) → listener (employer) should be on guard, and speaker has low duty of candor (similar to used car case).  
    - Distinction collapses; both are deceptive and violate basic honesty expectations.  
  - **Warranty of Truth prediction**: **Lying is worse**.  
    - Baseline: Lying explicitly vouches for a falsehood. Misleading is literally true and doesn't warrant the inference "I was not fired."  
    - No strong override: No fiduciary duty (like marriage) or vulnerability (like medicine). Employer shares responsibility for inferences (like reference case), making misleading less bad.  

  **How it distinguishes principles**:  
  - If she says both are equally bad, it supports **Reasonable Expectations** or **Duty-Based Contextualism**.  
  - If she says lying is worse, it supports **Warranty of Truth**.  
  - **Bonus**: Duty-Based Contextualism can be separated by its emphasis on duties (here, low), while Reasonable Expectations focuses on listener expectations.  

  #### After getting her verdict on the courtroom witness:  
  - If she says misleading is as bad/worse, **confirm with the job interview case** to rule out Warranty of Truth.  
  - If she says lying is worse in courtroom, **use a high-duty eighth case** (e.g., a therapist misleading a vulnerable client) to test Warranty of Truth overrides.  

  This approach isolates the core differentiator: the role of duties/expectations vs. warranties in moral weighting.
