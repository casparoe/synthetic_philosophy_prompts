prompt: |-
  I'm a data scientist who works with probabilistic programming (Stan, PyMC, that kind of thing) all day. I keep hearing philosophers talk about something called "the problem of old evidence" in Bayesian epistemology, and from the name alone it sounds like it should be right up my alley — I spend half my life worrying about whether I'm double-counting data or accidentally conditioning on the thing I'm trying to predict.

  So here's what I want. Restate the problem of old evidence in the vocabulary I actually use: generative models, priors, likelihoods, conditioning via Bayes rule, posterior predictive checks, model comparison with Bayes factors or ELPD, that whole toolkit. Walk me through it as if you're explaining why my Stan model is misbehaving. Then give me the residue report: which parts of the philosophical problem map cleanly onto how I think about data and models, which parts you had to stretch or fudge to make fit, and which parts have no counterpart at all in my vocabularly. I want to know whether the philosophers are pointing at a real problem I'm just not seeing because my tools hide it, or whether their problem sort of dissolves once you think in terms of generative models and out-of-sample prediction.

  Also: tell me how confident you are in each major claim you make, and flag the single point you're least sure about. I'd rather hear "I think this is right but I'm not certain" than have you sound authoritative about something you're actually guessing at.
reasoning: |-
  We are going to address the problem of old evidence in Bayesian epistemology by reframing it in the vocabulary of a data scientist working with probabilistic programming (Stan, PyMC, etc.). We'll break it down step by step, then provide a "residue report" on how the philosophical problem maps to the data science toolkit.

  **The Problem of Old Evidence (in Bayesian Epistemology):**
  In philosophy, the problem of old evidence (POE) arises in the context of Bayesian confirmation theory. It questions how a piece of evidence E, which is already known (and thus has probability 1), can provide confirmation for a new hypothesis H. According to Bayes' theorem:

      P(H|E) = [P(E|H) * P(H)] / P(E)

  If E is old evidence (already known), then P(E) = 1. Also, if E is known, then the likelihood P(E|H) is also 1 because we are certain of E. This leads to:

      P(H|E) = [1 * P(H)] / 1 = P(H)

  Thus, the posterior equals the prior, and it seems that E does not confirm H. This is counterintuitive because often in science, old evidence (like the precession of Mercury's orbit) is taken as strong support for a new theory (like general relativity).

  **Restating the Problem in Data Science Vocabulary:**

  Imagine you have a generative model for your data. You are considering two models: M0 (the null or standard model) and M1 (a new model you are testing). You have a dataset D that includes an observation (or set of observations) E that is already known and has been used in the development of M1. Now, you want to assess whether M1 is better than M0 by using the entire dataset D (which includes E).

  In your workflow, you might:

  1. **Specify the models:** Define priors and likelihoods for M0 and M1.
  2. **Condition on the data:** Use Bayes' rule to compute the posterior for each model.
  3. **Compare models:** Use Bayes factors (or ELPD, WAIC, etc.) to see which model is better.

  But now, the problem of old evidence creeps in:

  - Since E is already known, you have incorporated it into your prior knowledge. Therefore, when you write the prior for M1, it might already be tuned to account for E. For instance, you might have adjusted the parameters of M1 so that it fits E well. Then, when you condition on E again (as part of D), you are effectively double-counting E.

  However, in practice, you don't condition on E twice. The issue is that the model M1 was designed with E in mind. So the prior for M1 is actually conditional on E (and other background knowledge). This is the crux: the prior for M1 is not "pure" but has been influenced by E.

  **Step-by-Step Walkthrough (as if debugging a Stan model):**

  Imagine you are building a Stan model for M1. You have:

  - Old evidence E: say, a specific data point that has been known for years.
  - New data: some additional data points F.

  You want to fit M1 on the entire dataset D = (E, F). But you suspect that because E was used in the construction of M1, the model might be overfitting E.

  1. **Prior specification:**
     - You set priors for the parameters of M1. But if you have already seen E, you might have chosen priors that are favorable to M1 for E. For example, you might have set a prior that is centered around the value that explains E. This is the "informed prior" problem.

  2. **Conditioning:**
     - When you condition on D, you are updating the prior to the posterior. But because your prior for M1 is already informed by E, the update for E is minimal (since the prior is already concentrated there). The update mainly comes from F.

  3. **Model comparison:**
     - You compute the Bayes factor: BF = P(D|M1) / P(D|M0). The marginal likelihood P(D|M1) is the integral of the likelihood over the prior. But if the prior for M1 is already concentrated around the values that fit E, then the marginal likelihood for E (which is part of D) will be high. However, this high value is not because M1 is inherently good, but because the prior was set after seeing E.

  4. **The problem:**
     - The Bayes factor might strongly favor M1, but this could be due to the prior being "cheated" by using E. In other words, the model M1 is not making a genuine prediction for E because it was designed with E in mind.

  **How this might manifest in your Stan model:**
  - You run prior predictive checks and see that the prior for M1 already generates data similar to E. That's because the prior was chosen after knowing E.
  - When you do posterior predictive checks on E, it fits perfectly, but that's no surprise because the prior was set to make it fit.
  - The real test would be if M1 can predict new data F. But the model comparison is done on the whole D, so E is included and inflates the evidence for M1.

  **Solutions in Data Science:**

  To avoid this, we often:

  1. **Use out-of-sample validation:** Do not use E in the training if it was used to build the model. Instead, we might:
     - Train on F and test on E (if E is old, we might have new data F).
     - But note: if E was used to build the model (i.e., to choose the structure of M1 or set the prior), then even if we don't condition on it, the model is still "contaminated".

  2. **Pre-registration:** Specify the model (including priors) before seeing any data (including E). But in practice, E is old, so we have already seen it.

  3. **Adjust the prior:** Try to specify what the prior would have been without knowing E. This is difficult and subjective.

  4. **Focus on predictive performance for new data:** Use cross-validation on F, and ignore E in the model comparison? But that throws away information.

  **Residue Report:**

  Now, let's break down how the philosophical problem maps to the data science toolkit:

  1. **Parts that map cleanly:**
     - **Double-counting:** This is a central concern in data science. We worry about using the same data for model building and evaluation. POE is essentially about double-counting old evidence. The solution of using held-out data for testing is common in both.
     - **Prior specification:** The problem of having an "informed prior" due to old evidence is well-recognized. We try to use weakly informative priors or pre-register to avoid this.
     - **Model comparison with Bayes factors:** The issue that the marginal likelihood P(D|M1) can be inflated by a prior that is tuned to E is a known pitfall. We often prefer predictive metrics on new data (like ELPD via cross-validation) over Bayes factors for this reason.

  2. **Parts that require stretching:**
     - **The absolute certainty of old evidence (P(E)=1):** In practice, we don't assign probability 1 to any observation. We know there might be measurement error or other issues. So the philosophical setup is idealized. In data science, even old evidence is treated as having some uncertainty (though we might condition on it as fixed). The POE argument relies on this idealization.
     - **The counterfactual prior:** The philosophical solution sometimes involves considering what our prior would have been without E. In data science, we might try to imagine that counterfactual, but it's inherently subjective and not directly computable.

  3. **Parts with no counterpart:**
     - **Logical certainty:** The philosophical problem sometimes considers evidence that is logically true (like a mathematical truth) and how it can confirm a theory. In data science, we deal with empirical data, not logical truths. We don't have a direct counterpart for how a mathematical truth (with probability 1) can provide empirical confirmation.
     - **The notion of "confirmation" as a static relation:** In data science, we are more focused on predictive accuracy and model comparison for decision making. The philosophical idea of "confirmation" as a relation between H and E is less operational.

  **Conclusion:**

  The philosophers are pointing at a real problem (double-counting and prior influence from old evidence) that you do face in practice. However, the way it manifests in data science is less about the probability of old evidence being 1 and more about the contamination of the prior and model structure by the old evidence. The problem does not dissolve entirely when thinking in terms of generative models and out-of-sample prediction because:

  - We often have limited data and cannot ignore old evidence entirely.
  - The model building process (choosing the structure, the priors) is inevitably influenced by what we already know.

  But the data science toolkit does offer ways to mitigate the problem:

  - Use of predictive checks on new data (even if generated after the model was built).
  - Cross-validation and out-of-sample testing.
  - Sensitivity analysis: try different priors and see how the results change.

  **Confidence Levels and Least Sure Point:**

  - **The mapping between POE and double-counting/data leakage: 95% confident.** This is a direct analogy and well-recognized in machine learning.
  - **The issue of prior specification being influenced by old evidence: 90% confident.** This is a common topic in Bayesian analysis.
  - **The idea that the problem does not dissolve entirely: 85% confident.** Because even with out-of-sample testing, if the model structure was chosen to fit old evidence, it might still be overfitted.
  - **The non-counterpart for logical evidence: 95% confident.** We don't usually deal with logical truths as data.

  **Least Sure Point:**
  The part I'm least sure about is the exact philosophical solution involving counterfactual priors and how it maps to data science. In data science, we don't have a standard way to "remove" the influence of old evidence from our prior. We might try to specify a prior that we would have used before seeing E, but this is subjective and not always feasible. I'm only about 70% confident in the practicality of this mapping. We might instead rely on predictive performance on new data and avoid the problem by not using the old evidence in the training set, but that doesn't address the model-building contamination.

  In summary, the problem of old evidence is a real issue in data science, especially in the context of model development and evaluation. However, the data science toolkit has methods to mitigate it, primarily through out-of-sample validation and sensitivity analysis. The philosophical problem does not dissolve but becomes a practical challenge of avoiding overfitting and biased priors.
answer: |-
  ### The Problem of Old Evidence: A Data Scientist's Breakdown  
  **Restated in your vocabulary (generative models, Bayes, predictive checks, etc.):**  

  #### **Core Problem:**  
  You're evaluating two generative models, \(M_{\text{new}}\) (a novel theory) and \(M_{\text{old}}\) (established theory). Both models are conditioned on a dataset \(D\) that includes an observation \(E\)—*which was already known* before \(M_{\text{new}}\) was developed (e.g., Mercury's orbit precession for general relativity).  

  **Your workflow:**  
  1. **Specify priors:** \(P(\theta_{\text{new}} | M_{\text{new}})\), \(P(\theta_{\text{old}} | M_{\text{old}})\).  
  2. **Define likelihoods:** \(P(E | \theta_{\text{new}}, M_{\text{new}})\), \(P(E | \theta_{\text{old}}, M_{\text{old}})\).  
  3. **Compute posteriors** via Bayes: \(P(\theta | E, M) \propto P(E | \theta, M) P(\theta | M)\).  
  4. **Compare models** using Bayes factors: \(BF = \frac{P(E | M_{\text{new}})}{P(E | M_{\text{old}})}\) (or ELPD).  

  **Here’s the snag:**  
  - \(E\) is "old evidence"—you’ve known it for years.  
  - Intuitively, \(E\) *should* boost \(M_{\text{new}}\) (e.g., it fits general relativity better than Newtonian mechanics).  
  - **But mathematically:**  
    - Since \(E\) is known, \(P(E) = 1\) (it’s fixed background knowledge).  
    - Marginal likelihood \(P(E | M) = \int P(E | \theta, M) P(\theta | M) \, d\theta\) **should be 1** for both models—because \(E\) is already certain!  
    - Thus, \(BF = \frac{1}{1} = 1\) → no support for \(M_{\text{new}}\)!  

  **Why your Stan model freaks out:**  
  - You’re accidentally **double-counting \(E\) in the prior**.  
  - When you built \(M_{\text{new}}\), you likely **tuned its structure/priors using \(E\)** (e.g., choosing a likelihood that fits \(E\) well).  
  - Now, when you formally condition on \(E\) in inference, the prior \(P(\theta_{\text{new}} | M_{\text{new}})\) is **retrospectively biased** to favor \(E\).  
  - **Result:** The marginal likelihood \(P(E | M_{\text{new}})\) is inflated—not because \(M_{\text{new}}\) is "true," but because your prior was fit-to-purpose.  
  - **Posterior predictive checks** pass (model recovers \(E\) perfectly), but **out-of-sample predictions** for new data \(F\) might fail → **overfitting**.  

  ---

  ### Residue Report: Mapping Philosophy to Your Toolkit  
  **Confidence: 90%** (grounded in standard Bayesian practice, but epistemology nuances exist).  

  #### **Parts that map cleanly:**  
  1. **Double-counting as prior leakage:**  
     - Philosophers' worry: Using \(E\) to build \(M_{\text{new}}\) *then* conditioning on \(E\) inflates evidence.  
     - Your equivalent: **Data leakage in model specification**. If you use \(E\) to design priors/likelihoods, then include \(E\) in training data, you violate IID assumptions.  
     - **Confidence: 95%** (standard ML issue).  

  2. **Model comparison bias:**  
     - Philosophers: \(P(E | M_{\text{new}})\) is artificially high.  
     - Your equivalent: **Bayes factors are distorted** if priors are "informed" by \(E\). You’d catch this via:  
       - **Prior predictive checks:** Simulate data from \(M_{\text{new}}\)'s *prior*—if it often generates \(E\)-like data, your prior is too sharp.  
       - **ELPD/LOO-CV:** Using \(E\) in training inflates in-sample metrics but fails in out-of-sample tests.  
     - **Confidence: 90%** (direct parallel to cross-validation best practices).  

  3. **The core challenge:**  
     - Both fields agree: **Updating on known evidence requires adjusting priors** to avoid circularity.  

  #### **Parts that require stretching/fudging:**  
  1. **Probability of old evidence \(P(E) = 1\):**  
     - Philosophers treat \(E\) as *logically certain* (hence \(P(E) = 1\)).  
     - In your work, **no empirical observation has \(P(E) = 1\)** (measurement error, selection bias, etc.). You’d assign \(P(E) \approx 1\) but not exactly 1.  
     - *Stretch:* Philosophically, \(E\) is "background knowledge"; in practice, you track uncertainties.  
     - **Confidence: 85%** (your models are more nuanced).  

  2. **Counterfactual priors:**  
     - Philosophers: "What would your prior for \(M_{\text{new}}\) be if you *hadn’t known \(E\)*?"  
     - You: **This is unobservable and impractical.** You approximate via:  
       - **Sensitivity analysis:** Test priors with/without \(E\)-influence (e.g., widen priors).  
       - **Pre-registration:** Specify \(M_{\text{new}}\) *before* seeing \(E\) (rarely feasible).  
     - *Fudge:* You can’t rewind time, but you can simulate "ignorant priors."  
     - **Confidence: 75%** (subjective and messy).  

  #### **Parts with no counterpart in your vocabulary:**  
  1. **Logical omniscience:**  
     - Philosophers debate if *mathematical truths* (e.g., \(2+2=4\)) count as "old evidence."  
     - You: **No overlap.** Your likelihoods handle empirical data, not logical truths.  
     - **Confidence: 95%** (irrelevant to applied work).  

  2. **Non-empirical confirmation:**  
     - Philosophers: Can \(E\) confirm \(M_{\text{new}}\) *without* new predictions?  
     - You: **Rejected.** Your framework requires **out-of-sample testing** (e.g., posterior predictive checks on *new* data \(F\)). If \(M_{\text{new}}\) only fits \(E\), you discard it.  
     - **Confidence: 90%** (predictivism is core to your workflow).  

  ---

  ### Does the Problem Dissolve? **Partly, but not entirely.**  
  - **Dissolves in practice:** Your toolkit **avoids the issue** by emphasizing:  
    - **Predictive performance:** ELPD/LOO-CV focuses on *new* data, sidestepping \(P(E | M)\) entirely.  
    - **Generative checks:** If prior predictive simulations can’t generate \(E\), \(M_{\text{new}}\) is falsified *without conditioning*.  
    - **No \(P(E) = 1\):** You model uncertainty, so \(E\)’s support for \(M_{\text{new}}\) comes via likelihood ratios, not marginal likelihoods.  

  - **Persists in principle:** If you:  
    - Use **Bayes factors for irreplicable data** (e.g., Mercury’s orbit).  
    - Let **priors be corrupted by \(E\)** (e.g., tuning Stan code until it fits \(E\)).  
    → You’ll get spurious confirmation.  

  **Least confident claim:** That **counterfactual priors** (what you’d believe without \(E\)) have *any* clean operationalization in your work. (Confidence: **60%**—it’s philosophically deep but practically intractable.)  

  ### Final Verdict:  
  Philosophers highlight a **real but avoidable problem**. Your tools (generative models, out-of-sample validation) **dissolve it by shifting focus from \(P(E)\) to predictive accuracy**. If you’re rigorous about:  
  - **Separating model design from inference** (no leakage),  
  - **Testing on held-out/new data**,  
  - **Using predictive metrics (ELPD, not Bayes factors) for model comparison**,  
  the "problem" becomes inert. But stay vigilant—**prior hacking is the epistemological twin of overfitting**.
