prompt: |-
  I draft governance documents for membership organizations — bylaws, charters, operating agreements. The hardest recurring question is when to include precommitment devices: supermajority amendment thresholds, locked-fund provisions, sunset clauses that require affirmative renewal, independent boards with veto power over certain decisions. I know theres a literature on Ulysses contracts and constitutional precommitment but I need something I can use when a client asks "should we make this hard to change?" Can you give me a decision procedure — a sequence of questions to ask in order — for deciding whether a given governance provision warrants precommitment, and how strong the mechanism should be? It should say where the procedure stops with a clear answer and where it hands off to human judgment. Then run it on two cases: (1) a diversity-equity-inclusion commitment in the mission statement, and (2) a rule about how the annual budget is approved. Make sure one of the cases gives an answer I'm not going to like. Give me the response as a numbered list with exactly five items, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is asking for a decision procedure on when to include precommitment devices in governance documents. They draft bylaws and charters for membership organizations and struggle with questions like when to implement supermajority requirements or locked-fund provisions. They need a practical, step-by-step method that ends with clear answers or hands off to judgment.

  The user mentions Ulysses contracts and constitutional precommitment literature, but wants something actionable for client consultations. Specifically, they want a five-step numbered list without intros or conclusions, applied to two cases: a DEI commitment and a budget approval rule. One case should give an "unliked" answer to challenge biases.

  Breaking down their needs: As a drafter, they face recurring dilemmas about rigidity versus flexibility in governance. Deeper needs might include reducing ambiguity in advice, enhancing credibility with clients, and avoiding ethical pitfalls—like ensuring DEI commitments aren't easily reversed, which could protect marginalized groups.

  I should structure the decision procedure logically. Start with identifying potential harm from hasty changes, as precommitment is about preventing future mistakes. Then assess reversibility: if changes are easily undone, precommitment may be less critical. Next, evaluate stakeholder conflicts—when internal interests could override collective good. After that, consider the cost of rigidity; too strong a lock can cause stagnation. Finally, tailor the mechanism's strength based on previous answers.

  For the cases: Case 1 is a DEI commitment in the mission statement. Applying the steps: Harm is clear (backsliding on equity), irreversibility is high (damage from policy reversal), stakeholders might have conflicting interests (majority vs. minority), and rigidity cost is low if mission-aligned. So, strong precommitment makes sense.

  Case 2 is annual budget approval. Harm from hasty changes is low (budgets can be adjusted), reversibility is high (easy to amend next year), stakeholders are aligned in oversight, rigidity cost is high (needs flexibility). Thus, no precommitment is needed—this might be the "unliked" answer because it goes against instinct to lock down financial rules.

  I need to ensure the response is concise: exactly five items, each a sentence or two, no extras. This forces clarity and usability. The unliked answer in case 2 will show that not everything needs hardening, promoting balanced governance.
answer: |-
  Here is the decision procedure as requested:

  1.  **Assess Potential Harm:** Would reversing or weakening this provision in the future likely cause significant, concrete harm to the organization's core mission, key stakeholders, or essential assets? If "no," precommitment is generally unwarranted; stop. (Case 1: Yes, backsliding harms mission integrity & marginalized members. Case 2: No, standard budget approval rarely causes *significant concrete harm* if changed; process adjustments are common).
  2.  **Evaluate Reversibility:** If harm is likely, how difficult or costly would it be to reverse the negative consequences *after* a hasty change is made? If reversal is relatively easy/cheap, weaker or no precommitment may suffice; hand off to judgment. (Case 1: High irreversibility - reputational damage & trust loss are hard to undo. Case 2: High reversibility - budgets are amended annually; mistakes corrected next cycle).
  3.  **Identify Conflict Potential:** Is there a foreseeable scenario where a future majority (or controlling faction) might have strong short-term incentives *contrary to the organization's long-term health* to change this provision? If "no," precommitment strength can be lower; hand off to judgment. (Case 1: Yes, potential future majority may resist DEI costs/change. Case 2: Typically no; budgets serve the whole org annually, factions usually aligned on basic oversight).
  4.  **Weigh Rigidity Cost:** Would making this provision very hard to change create unacceptable risks of stagnation, prevent necessary adaptation to unforeseen circumstances, or impose high operational burdens? If "yes," weaken or avoid precommitment; stop or hand off. (Case 1: Low rigidity cost - core mission values need stability. Case 2: High rigidity cost - budget process needs adaptability; strong lock paralyzes).
  5.  **Set Mechanism Strength:** Based on steps 1-4, select the *minimum effective* precommitment level: None (simple majority), Weak (e.g., notice + majority), Medium (e.g., supermajority), Strong (e.g., supermajority + independent review/ratification). Strong only if high harm (1), high irreversibility (2), high conflict risk (3), *and* low rigidity cost (4). (Case 1: High harm, high irreversibility, high conflict risk, low rigidity cost → **Strong precommitment** warranted (e.g., supermajority + independent board/ratification). Case 2: Low harm, high reversibility, low conflict risk, high rigidity cost → **No precommitment** warranted; simple majority suffices).
