prompt: |-
  Draft the joint statement that a representative of the formal-methods camp and a representative of the relevance camp could both sign after a good-faith adversarial collaboration on the frame problem.

  By the formal-methods camp I mean the position that the frame problem, properly understood, is a problem about representing persistence in a logic of action: how to infer, within the situation calculus or a successor formalism, that a fluent survives an action unless the action is relevant to it, without writing a separate frame axiom for every action–fluent pair; and that nonmonotonic formalisms — circumscription, default logic, and the chronological-minimization refinements forced by the Yale shooting problem — have solved, or at least contained, the problem as originally posed. By the relevance camp I mean the position that the real frame problem is the one Dennett and Fodor pressed: how a finite, resource-bounded cognitive system determines which of its indefinitely many beliefs, goals, and potential inferences bear on the action it is now considering; and that the nonmonotonic solutions solve only a representation problem that presupposes exactly the relevance structure they were supposed to explain.

  Format the document as a numbered agreed-claims section followed by a disagreements table. The agreed-claims section should cover at least: the original formulation and why enumerating frame axioms is unacceptable; the distinction among the frame problem, the qualification problem, and the ramification problem; what circumscription and default logic actually accomplish; what the Yale shooting problem showed and what the accepted fixes assume; and what a deployed agent must do over and above deriving the right consequences in a representation. Phrase each agreed claim so that it is neither vacuous nor slanted.

  The disagreements table should have one row per genuine residual disagreement, with each camp's view stated in wording that camp would sign; do not reduce the relevance camp to a vague worry about holism, and do not reduce the formal-methods camp to the claim that the philosophical problem is merely engineering. Then identify the cruxes — the sub-questions such that settling them would move at least one side. For each crux, specify the case, argument, or experimental result both sides would accept as bearing on it, and record each side's prediction in advance. If, in the course of drafting, you conclude that part of the dispute is verbal — for example, a disagreement only about how widely the label frame problem should be applied — say which part is verbal and state precisely what non-verbal disagreement remains.
reasoning: |-
  We are drafting a joint statement between two camps: the formal-methods camp and the relevance camp on the frame problem.

  Agreed Claims (numbered):

  1. **Original Formulation and Unacceptability of Enumerating Frame Axioms**: The frame problem, as originally formulated by McCarthy and Hayes (1969), concerns the challenge of efficiently representing the persistence of fluents (properties that change over time) in a logic of action, such as the situation calculus. Specifically, it is unacceptable to require a separate frame axiom for every possible action-fluent pair because such an approach leads to an explosion in the number of axioms and fails to capture the intuition that actions typically leave most fluents unchanged.

  2. **Distinction Among Frame, Qualification, and Ramification Problems**: We agree on a threefold distinction:
     - The **frame problem** (in its narrow, formal sense) is the problem of efficiently representing and reasoning about the persistence of fluents across actions.
     - The **qualification problem** is the problem of specifying all the preconditions required for an action to have its intended effect, given that the real world has indefinitely many potential obstacles.
     - The **ramification problem** is the problem of capturing the indirect effects of actions, which may arise due to domain constraints.

  3. **What Nonmonotonic Formalisms Accomplish**: Techniques such as circumscription and default logic provide a formal mechanism for expressing the common-sense law of inertia (that fluents tend to persist unless affected by an action). These methods allow for a compact representation by minimizing changes and assuming persistence by default. They solve the representation problem in the narrow sense by avoiding the need for an exponential number of frame axioms.

  4. **The Yale Shooting Problem and Accepted Fixes**: The Yale shooting problem (Hanks and McDermott, 1986) demonstrated that early nonmonotonic formalisms (like simple circumscription) could lead to unintended models, such as the gun spontaneously becoming unloaded. This problem highlighted the need for temporal prioritization. The accepted fixes (e.g., chronological minimization) impose a temporal ordering on minimizations, thereby preferring models where changes occur at the latest possible time. These fixes assume a linear time structure and a preference for inertia in the absence of change.

  5. **Deployed Agent Requirements**: We agree that a deployed agent (one operating in the real world) must do more than derive the right consequences in a representation. Specifically, the agent must:
     - Operate under bounded resources (time, memory, computational power).
     - Efficiently retrieve and update only the relevant beliefs and goals for the task at hand.
     - Avoid considering the vast majority of irrelevant facts and potential inferences.

  Disagreements Table:

  We identify the following residual disagreements. Each row states the view of each camp in wording they would endorse.

  | Issue | Formal-Methods Camp View | Relevance Camp View |
  |-------|--------------------------|---------------------|
  | **Scope of the Frame Problem** | The frame problem, properly understood, is a technical problem of knowledge representation that has been substantially contained by nonmonotonic logics. The problem of relevance (what we call the "relevance problem") is a separate, broader issue that is not part of the frame problem. | The frame problem, as articulated by Dennett and Fodor, is the problem of how a cognitive system efficiently accesses relevant information without being overwhelmed by the totality of its knowledge. The nonmonotonic solutions address only a narrow, technical aspect and leave the core problem of relevance untouched. |
  | **What Nonmonotonic Solutions Achieve** | Nonmonotonic solutions (circumscription, default logic, etc.) successfully solve the frame problem in the narrow sense by providing a formal and computationally tractable way to represent persistence without frame axioms. This solution is sufficient for the representation problem as originally posed. | Nonmonotonic solutions only address the representation of persistence in a formal system. They do not solve the problem of how an agent, in practice, determines which of its beliefs are relevant to a given action or inference. The nonmonotonic approach presupposes a relevance structure (i.e., which actions affect which fluents) without explaining how that structure is acquired or used. |
  | **The Role of Relevance in Agency** | The problem of relevance is an important but distinct challenge in AI and cognitive science. It is not part of the frame problem but rather a problem of efficient computation and resource management. | The problem of relevance is the heart of the frame problem. Without a solution to relevance, an agent cannot function in real time because it would be paralyzed by the need to consider all possible implications of its actions and perceptions. |

  Cruxes:

  We identify the following cruxes — specific questions that, if settled, would move at least one side. For each crux, we specify a case, argument, or experimental result that both sides would accept as bearing on it, and we record each side's prediction.

  1. **Crux: Computational Tractability of Nonmonotonic Reasoning**
     - **Case/Experiment**: Implement a nonmonotonic reasoning system (using, say, circumscription or default logic) for a domain with a large number of fluents and actions (e.g., a robot in a household environment). Measure the time and resources required for the system to infer the persistence of fluents after an action, as the number of fluents grows.
     - **Formal-Methods Prediction**: The system will scale acceptably because the nonmonotonic reasoning only requires checking the effects of the action and then assuming persistence for unaffected fluents. The computational cost will be linear in the number of fluents directly affected by the action, not the total number of fluents.
     - **Relevance Camp Prediction**: The system will face scalability issues because, even with nonmonotonic rules, the system must still check the consistency of the entire knowledge base to ensure that no constraint is violated. The presence of ramification constraints and the need to avoid contradictions will force the system to consider many fluents beyond the directly affected ones.

  2. **Crux: The Acquisition of Relevance Structures**
     - **Case/Experiment**: Design an agent that learns from scratch which actions affect which fluents (i.e., the relevance structure). The agent is placed in an environment and must learn the effects of actions without prior knowledge. The experiment measures whether the agent can learn a relevance structure that allows it to perform efficiently, and whether the nonmonotonic formalism can then use that structure to solve the frame problem.
     - **Formal-Methods Prediction**: The nonmonotonic formalism can be combined with a learning component that acquires the relevance structure (the effect axioms). Once the structure is learned, the nonmonotonic reasoning will work as intended. The frame problem (narrow) is thus separable from the learning problem.
     - **Relevance Camp Prediction**: The learning problem is inseparable from the frame problem because an agent must already have a relevance structure to avoid combinatorial explosion in learning. Without prior constraints on relevance, the agent would have to consider every fluent for every action, making learning intractable.

  3. **Crux: Real-Time Performance in Complex Environments**
     - **Case/Experiment**: Deploy an agent using a nonmonotonic reasoning system in a real-time, dynamic environment (e.g., a video game with many objects and events). Measure the agent's response time and success rate as the complexity of the environment increases (e.g., more objects, more actions, more constraints).
     - **Formal-Methods Prediction**: With optimizations (like indexing and focusing mechanisms), the nonmonotonic reasoning system can run in real time because the reasoning about persistence is localized to the affected fluents.
     - **Relevance Camp Prediction**: The nonmonotonic reasoning system will suffer from computational delays because, in complex environments, the system must constantly verify consistency across the entire state, especially when ramification constraints are present. This will lead to unacceptable lag.

  Verbal Disagreement:

  We note that part of the dispute is verbal: the two camps use the term "frame problem" differently. The formal-methods camp uses it narrowly to refer to the representation of persistence, while the relevance camp uses it broadly to include the problem of relevance. However, even after disambiguating the term, a non-verbal disagreement remains: whether the problem of relevance is a necessary part of an overall solution to the challenges posed by McCarthy and Hayes (and later by Dennett and Fodor) or whether it is a distinct problem that can be addressed separately.

  The non-verbal core of the disagreement is whether the narrow solution (nonmonotonic logics) is a complete solution to the challenge of reasoning about change, or whether it leaves untouched a fundamental problem of cognitive relevance that must be solved for any real-world agent.

  Signed:

  [Representative of the Formal-Methods Camp]
  [Representative of the Relevance Camp]
answer: |-
  ### Joint Statement: Frame Problem Adversarial Collaboration  
  **Between the Formal-Methods Camp and the Relevance Camp**  

  #### Agreed Claims  
  1. **Original Formulation and Unacceptability of Frame-Axiom Enumeration**:  
     The frame problem originated as a technical challenge in formalizing **persistence** in logical action representations (e.g., situation calculus). Enumerating frame axioms (e.g., "Action \(A\) does not change fluent \(F_n\)") for every action–fluent pair is unacceptable because it scales quadratically, is computationally intractable for real-world agents, and fails to capture the default intuition that actions affect only relevant fluents.  

  2. **Distinction Among Frame, Qualification, and Ramification Problems**:  
     - **Frame problem**: Efficiently inferring that fluents *persist* unless an action affects them.  
     - **Qualification problem**: Exhaustively specifying *preconditions* for actions (e.g., "Can the robot lift the cup if gravity fails?").  
     - **Ramification problem**: Handling *indirect effects* of actions (e.g., "Moving a crate alters dust distribution").  
     These are distinct but interrelated; solving one does not entail solving the others.  

  3. **What Nonmonotonic Formalisms Accomplish**:  
     Circumscription, default logic, and chronological minimization provide a formal mechanism to **avoid explicit frame axioms** by:  
     - Assuming minimal change ("inertia") by default.  
     - Permitting efficient persistence inferences in restricted domains.  
     They solve the *representation problem* of persistence in logic-based systems, as originally posed by McCarthy and Hayes.  

  4. **Yale Shooting Problem and Accepted Fixes**:  
     The Yale shooting problem exposed flaws in early nonmonotonic approaches (e.g., unintended "survival" models where victims avoid death). Accepted fixes (e.g., chronological minimization) **prioritize temporal order** and minimize late changes. These fixes assume:  
     - Actions have known, discrete effects.  
     - Domain constraints are explicitly specified.  
     - "Inertia" is defeasible only by direct effects.  

  5. **Requirements for Deployed Agents**:  
     A deployed agent must:  
     - Derive correct persistence inferences (addressed by nonmonotonic formalisms).  
     - **Operate under bounded resources** (time/memory).  
     - **Identify relevant beliefs/goals/inferences** *without* exhaustive search.  
     - Adapt to novel contexts where pre-specified relevance assumptions fail.  
     Nonmonotonic solutions alone are insufficient for these resource-constrained tasks.  

  ---

  #### Disagreements Table  
  | Issue | Formal-Methods Camp View | Relevance Camp View |  
  |-------|--------------------------|---------------------|  
  | **Scope of the Frame Problem** | The frame problem is *solved* in its original formulation: nonmonotonic logics provide a computationally feasible, sound method for persistence inference without frame axioms. Broader "relevance" issues are separate challenges (e.g., relevance to planning). | The frame problem *is* the relevance problem: Dennett/Fodor’s challenge of how agents ignore irrelevant information in open-ended worlds. Nonmonotonic fixes presuppose relevance structures (e.g., effect axioms) they do not explain. |  
  | **Adequacy of Nonmonotonic Solutions** | Nonmonotonic formalisms contain the frame problem by reducing it to engineering: once effect axioms are given, persistence is tractable. Philosophical worries about holism conflate representation with performance. | Nonmonotonic solutions only handle a *symptom* (persistence representation) while ignoring the *disease* (relevance detection). They assume a pre-defined "relevance set" (actions affecting fluents) but cannot select it dynamically. |  
  | **Role of Pre-Specification** | All reasoning systems require initial domain specifications (e.g., effect axioms). Learning/updating these is a separate problem; the frame problem concerns inference *given* these. | Pre-specification is infeasible in open worlds: agents must *discover* relevance on-the-fly. Nonmonotonic logics shift the burden to unseen relevance-tracking mechanisms. |  

  ---

  #### Cruxes  
  *Cruxes are testable sub-questions that would resolve disagreements if answered. Both camps accept the proposed cases/experiments as decisive.*  

  1. **Crux: Scalability Without Pre-Defined Relevance**  
     - **Experiment**: An agent must navigate a novel environment (e.g., a procedurally generated world with 1,000+ fluents). Test if nonmonotonic inference (e.g., circumscription) *without* domain-specific optimizations can track persistence in real time.  
     - **Formal-Methods Prediction**: Inference remains tractable; domain constraints focus reasoning on affected fluents.  
     - **Relevance Prediction**: Unmanageable lag; the system considers irrelevant fluents or requires ad hoc relevance heuristics.  

  2. **Crux: Handling Implicit Relevance Shifts**  
     - **Case**: An action indirectly alters relevance (e.g., "wearing noise-canceling headphones" makes *sound* fluents irrelevant to "concentration"). Can nonmonotonic logic dynamically adjust relevance without new axioms?  
     - **Formal-Methods Prediction**: Yes, via ramification constraints or meta-axioms.  
     - **Relevance Prediction**: No; relevance shifts require procedural/associative mechanisms beyond logic.  

  3. **Crux: Cognitive Plausibility**  
     - **Experiment**: Measure human inference speed in dynamic tasks (e.g., driving simulations). Compare to nonmonotonic systems with/without resource bounds.  
     - **Formal-Methods Prediction**: Bounded nonmonotonic systems match human performance.  
     - **Relevance Prediction**: Humans outperform formal systems, using heuristic relevance to ignore >99% of fluents.  

  ---

  #### Verbal Disagreement  
  - **Verbal**: The term "frame problem" applies narrowly (persistence inference) vs. broadly (relevance in resource-bounded cognition).  
  - **Non-Verbal Core**: Whether relevance detection is:  
    - **(Formal-Methods)** A separable engineering challenge solvable by augmenting logic (e.g., with relevance axioms).  
    - **(Relevance)** An unsolved cognitive phenomenon that undermines the sufficiency of logical representations for agency.  

  ---  
  **Signed:**  
  [Representative, Formal-Methods Camp]  
  [Representative, Relevance Camp]  

  ---  
  *This document reflects consensus on technical distinctions and open empirical cruxes, with disagreements precisely scoped. Both camps endorse further testing of cruxes to resolve outstanding issues.*
