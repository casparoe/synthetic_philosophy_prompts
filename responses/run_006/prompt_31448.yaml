answer: |-
  ### Sestina: The Teleological Suspension  

  The ethical claims its throne as **universal**,  
  Binding each thought, each act, the **single** soul.  
  Yet Abraham unsheathed the sacrificial **knife**,  
  Bound by a command, wrapped in **silence** deep.  
  No ethics justify such trial of **faith**—  
  The father poised to slay his promised **son**.  

  God’s voice had named the heir, the chosen **son**,  
  Transcending reason’s measured **universal**.  
  What moves a man to trust such mad **faith**?  
  Not ethics, but the absolute claims the **single**.  
  He climbs the mount, sealed in dread’s **silence**,  
  Edge of the covenant—that gleaming **knife**.  

  Morality would scream against the **knife**,  
  Condemn the hand raised o’er the bound **son**.  
  But Abraham’s lips guard a stark **silence**—  
  No plea, no defense in the **universal**.  
  He stands as no mere knight, but **single**,  
  Alone before God’s terror-testing **faith**.  

  Absurd! cries reason. Yet this dark **faith**  
  Commands: the steel must fall, the **knife** descend.  
  Isaac, the miracle child, the **single**  
  Seed of the covenant—that trembling **son**—  
  Means nothing to the law’s vast **universal**?  
  All meaning drowns in that raw **silence**.  

  O crushing weight of holy **silence**!  
  No mediating word, only **faith**  
  Suspends the ethical, the **universal**.  
  No ethics shield the grip on that **knife**.  
  What agony—to kill the beloved **son**!  
  Yet Abraham obeys, wholly **single**.  

  Who grasps this frightful stance, the **single**  
  Will facing God in voiceless **silence**?  
  Not for the crowd, nor for the **son**  
  Does he explain. Pure, tortured **faith**  
  Alone aligns his hand to wield the **knife**.  
  Here shatters the communal **universal**.  

  **Faith**’s paradox: the **single** breaks the **universal**;  
  The **knife** demands **silence**; God spares the **son**.  

  ---

