      "6": "Single individual above universal"
    },
    "envoy_reading": "Juxtaposes 'universal' and 'single' in one line without resolution, embodying the paradox: faith simultaneously transcends the ethical yet is inseparable from the individual's absolute duty.",
    "suspension_point": "Stanza 4, line 4: 'Suspends the ethical, the universal'"
  }
  ```

  **Key Philosophical Structure**:  
  - **Stanza 4** explicitly enacts the suspension: faith interrupts the ethical (universal) as Abraham prepares to strike.  
  - **Envoy** forces "universal" and "single" into shared syntax ("the **single** breaks the **universal**"), refusing Hegelian mediation.  
  - **Silence** is treated as argumentative (per *Problema I*): Abraham’s muteness proves the incommensurability between divine duty and social ethics.  
  - **Knife** and **son** recur as material symbols of the test, while **faith** drives the permutation’s relentless return to the irreducible paradox.
