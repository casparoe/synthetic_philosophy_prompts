answer: |-
  You're right – the "deflationism" bucket hides significant fault lines. Here's a gears-level breakdown of disquotationalism, minimalism, and prosententialism, focusing on your specific questions and the **real commitments** that distinguish them:

  **Core Idea Shared:** All three agree that truth is *not* a substantive property (like correspondence or coherence) explaining why true beliefs succeed. The primary function of 'true' is *expressive* – enabling us to say things we couldn't say efficiently (or at all) without it, like generalizations or blind endorsements.

  ---

  ### 1. Does 'True' Express a Property?
  *   **Disquotationalism (Quine, Leeds, arguably early Field):**
      *   **NO.** 'True' is fundamentally a *logical device*, a *disquotation operator*. Its core function is to remove quotation marks or cancel semantic ascent. Saying "'Snow is white' is true" is just a verbose way of saying "Snow is white". It doesn't *describe* the sentence; it *uses* it. There is no genuine *property* of truth being ascribed. The predicate is *syncategorematic* – it only has meaning in context, not by referring to a property.
      *   **Commitment:** Radical anti-metaphysics about truth. Truth talk is merely a linguistic convenience.
  *   **Minimalism (Horwich):**
      *   **YES (but Minimal).** 'True' *is* a genuine predicate expressing a property. However, this property is *logically insubstantial* or *minimal*. Everything significant we want to say about truth is captured by the equivalence schema (""p" is true iff p" or <p> is true iff p). There's nothing *more* to the property than what's given by its instances. It's a property, but it has no "hidden essence" or explanatory power beyond enabling generalizations.
      *   **Commitment:** Accepts a lightweight metaphysics of truth-as-property. Compatible with realism but insists the property is explanatorily idle.
  *   **Prosentential Theory (Grover, Camp, Belnap):**
      *   **NO (and it's not really a predicate!).** 'True' isn't a predicate at all. It's an integral *part of a prosentence*, like 'that is true' or 'it is true'. Prosentences function analogously to pronouns: they inherit their content anaphorically from antecedent clauses. "What the Pope said is true" functions like "The Pope said *that*. *It* is true", where "it is true" inherits its content from "that" referring back to the Pope's utterance. 'True' in this context is part of the *grammatical structure* enabling anaphora, not a property-ascribing term.
      *   **Commitment:** Radical syntactic/semantic thesis. Truth talk is about *sentential anaphora*, not property attribution. Eliminates the predicate interpretation entirely.

  **Fault Line:** **Is 'true' a property-ascribing predicate?** Disquotationalism: No (logical device). Minimalism: Yes (minimal property). Prosententialism: No (it's not even a predicate!).

  ---

  ### 2. Handling Generalizations ("Everything the Pope says is true")
  *   **Disquotationalism:**
      *   **The Achilles' Heel.** Pure disquotation (`"p" is true iff p`) only works for *named* sentences within one's *own* language. Generalizations seem to require quantifying over sentences/propositions the speaker doesn't know or can't name.
      *   **The (Problematic) Move:** Quine proposed treating generalizations as *infinite conjunctions* of disquotational instances: "('p₁' is true) and ('p₂' is true) and...". **Criticism:** This requires quantifying over sentence *tokens* or *types* (violating pure disquotation's focus on use), knowing *all* sentences the Pope utters, and assumes they are all translatable into the ascriber's language. It feels like a cheat, smuggling in quantification.
      *   **Commitment:** Must either bite the bullet on infinite conjunctions (with their problems) or severely restrict the truth predicate's scope. Struggles with cross-linguistic or unknown utterance generalizations.
  *   **Minimalism:**
      *   **The Standard Solution.** Embraces quantification over *propositions*. "Everything the Pope says is true" means "For all propositions p, if the Pope says that p, then p is true". The equivalence schema (<p> is true iff p) then allows substitution: "For all p, if the Pope says that p, then p". This neatly handles quantification over unknown or unspecifiable contents and cross-linguistic cases (assuming propositional content is shared).
      *   **Commitment:** Requires a commitment to *propositions* as the primary truth-bearers. This is a significant metaphysical commitment distinguishing it from strict disquotationalism.
  *   **Prosentential Theory:**
      *   **The Anaphoric Solution.** Treats generalization as involving a *quantifier binding propositional variables/anaphoric antecedents*. "Everything the Pope says is true" is parsed as: "For every thing the Pope says, *that* is true". "That is true" is a prosentence whose content is anaphorically dependent on whatever the quantifier binds to (the things the Pope says). No property 'true' is ascribed; the prosentence inherits the content of the Pope's utterances via the bound variable/anaphoric link.
      *   **Commitment:** Requires a logic/semantics capable of handling quantification binding anaphoric elements (prosentences/proforms). Avoids propositions but requires this specific syntactic machinery. Avoids treating 'true' as a predicate applying to the quantified items.

  **Fault Line:** **How to handle quantification?** Disquotationalism: Awkward infinite conjunctions (quantifying over sentences). Minimalism: Quantification over propositions (clean but metaphysically loaded). Prosententialism: Quantification binding prosentences/anaphoric chains (syntactically novel, avoids properties/propositions).

  ---

  ### 3. Status of T-Sentences (Necessity, Analyticity, Contingency)
  *   **Disquotationalism:**
      *   **Contingent & Linguistic.** T-sentences ("'Snow is white' is true iff snow is white") are contingent truths *about a specific language*. They depend on the meaning (reference, satisfaction) of the words in the quoted sentence *in that language*. If 'snow' meant grass, the T-sentence would be false. They are knowable *a posteriori* via linguistic investigation.
      *   **Downstream Impact:** Truth is fundamentally *language-relative*. Undermines notions of necessary truth or deep conceptual connections between truth and meaning/fact. Truth is parasitic on meaning.
  *   **Minimalism:**
      *   **Necessary & Conceptual (or A Priori).** The propositional T-sentences (<Snow is white> is true iff snow is white) are necessary truths. They are constitutive of the *concept* of truth. Grasping the concept *just is* accepting these equivalences. They are known *a priori*.
      *   **Downstream Impact:** Truth is a stable, necessary, language-independent concept (though the bearers – propositions – might be language-dependent). Maintains a stronger link between truth, logic, and reason. Compatible with truth playing a basic conceptual role.
  *   **Prosentential Theory:**
      *   **Avoids/Analyzes Away.** Doesn't treat T-sentences as fundamental axioms. The schema is explained *away* by the anaphoric function. " 'Snow is white' is true" is analyzed as something like *That* (pointing to the sentence 'Snow is white') *is true*. The prosentence "That is true" inherits the content of the antecedent (the sentence 'Snow is white'), effectively asserting the same content as using 'Snow is white' directly. The equivalence isn't a substantial *truth*; it's a consequence of how prosentences work.
      *   **Downstream Impact:** Shifts focus entirely to linguistic function. Undermines the idea that T-sentences reveal anything deep *about truth itself*; they reveal how anaphoric devices operate.

  **Fault Line:** **What is the metaphysical/logical status of the equivalence schema?** Disquotationalism: Contingent linguistic facts. Minimalism: Necessary conceptual truths. Prosententialism: Not fundamental truths; artifacts of anaphora.

  ---

  ### 4. Where Prosententialism Fits
  *   **Radical Competitor.** Prosententialism is **not** just notational variance. It's a fundamentally different analysis:
      *   It directly **rejects the core assumption** shared by Disquotationalism and Minimalism: that 'true' is a predicate (whether logical or property-expressing).
      *   It offers a distinct **syntactic/semantic mechanism** (anaphoric prosentences) instead of logical equivalence schemas.
      *   It dissolves, rather than answers, questions about the property of truth or the status of T-sentences.
  *   **Commitment:** Requires buying into a specific theory of anaphora and sentence structure. It's the most radical departure from traditional predicate-based logic/semantics regarding truth.

  ---

  **Summary: What You're Signing Up For**

  *   **Defend Disquotationalism:** You're committing to truth being *strictly intra-linguistic* and *merely a device for disquotation*. You deny it expresses any property. You must defend awkward solutions for generalizations (infinite conjunctions). You embrace the contingency of T-sentences and language-relativity of truth. Expect battles over quantification and cross-linguistic truth ascriptions.
  *   **Defend Minimalism:** You're committing to truth being a *genuine, albeit minimal, property* of propositions. You embrace quantification over propositions to handle generalizations cleanly. You defend the necessity and conceptual primacy of the T-sentences. Expect battles about the nature and ontological status of propositions, and whether "minimal property" is coherent or substantial enough.
  *   **Defend Prosententialism:** You're committing to 'true' *not being a predicate at all*, but part of an anaphoric prosentence. You reject the predicate-based framework of the other two. You analyze all truth talk via inheritance of content through anaphoric links. You dissolve questions about the property of truth or the status of T-sentences. Expect battles about the adequacy of the anaphoric analysis for all truth-attributing constructions and the complexity of the required semantic machinery.

  The core fault lines are **ontological** (property or not?), **semantic** (predicate or logical/anaphoric device?), and **metaphysical** (contingent linguistic fact vs. necessary conceptual truth vs. non-fact). Choosing a camp means taking a stand on these divisions beneath the shared "deflationary" umbrella.
