answer: |-
  Below is a comprehensive final exam question, a model answer, and a detailed marking scheme designed to push students beyond textbook summaries and into critical analysis of the covering-law vs. narrative explanation debate.

  ---

  ### **Essay Question**  
  **"The dispute between proponents of the covering-law model and narrative explanation often reduces to this: the former demand 'why it *had* to happen,' while the latter settle for 'how it *could* happen.' To what extent is this characterization accurate? Does it reveal a substantive epistemological disagreement, or are the two approaches merely talking past each other? Ground your analysis in concrete historical examples."**  
  *(Suggested time: 120 minutes; Total marks: 25)*  

  ---

  ### **Model Answer (Approx. 800 words)**  
  The dichotomy framing the covering-law model (CLM) as seeking necessity and narrative as settling for possibility captures a superficial tension but obscures deeper epistemological stakes. While CLM advocates (e.g., Hempel) insist narratives lack *nomological* necessity, narrative theorists (e.g., Danto, White) argue that their explanations satisfy historical inquiry’s unique demands. This dispute is substantive—not mere miscommunication—because it reflects divergent conceptions of causation, evidence, and what counts as "explanation" in history.  

  **The Core of the Dispute: Necessity vs. Intelligibility**  
  CLM’s insistence that events "had to happen" presupposes that explanation requires subsumption under universal laws. Hempel’s "explanation sketches" concede practical limitations but uphold this as an *ideal*. For instance, explaining the 1929 Wall Street Crash via economic "laws" (e.g., speculative bubbles bursting under unsustainable debt) implies that, given identical conditions, the outcome was inevitable. Narrativists, however, reject this as a category error. Arthur Danto contends that history explains by positioning events within a "meaningful whole." The French Revolution’s outbreak becomes intelligible not through laws but by tracing how fiscal crisis, Enlightenment ideas, and class resentment *contingently* converged. Here, narrative doesn’t settle for "mere possibility" but establishes *contextual necessity*: why, given this specific constellation of factors, the event was plausible and coherent.  

  **Talking Past Each Other? Only Superficially**  
  At first glance, the two camps seem divided by emphasis: CLM prioritizes prediction and generality; narrative favors particularity and retrospective coherence. Yet this masks a genuine epistemological rift. CLM reduces causality to invariant regularities, demanding that historians mimic scientific methodology. Narrativists, however, argue that historical causation is inherently *configurational*. For example, explaining WWII without referencing Hitler’s intentions or the Treaty of Versailles’ flaws—relying solely on "laws" of interstate conflict—strips explanation of its historical specificity. As Hayden White notes, narrative’s emplotment (e.g., framing the Russian Revolution as tragedy or triumph) isn’t psychological padding but a logical tool for organizing disparate facts into a causal matrix. When CLM dismisses this as "merely descriptive," it imposes an alien standard of necessity irrelevant to historical practice.  

  **Bridging the Gap? The Role of Causal Mechanisms**  
  The most compelling resolution comes from philosophers like C. Behan McCullagh, who reframes narrative as "causal colligation." Narratives *do* explain why events "had to happen"—not via universal laws but by identifying *locally operative mechanisms*. Take the Industrial Revolution’s spread: a narrative might integrate enclosures, technological innovation, and colonial markets, showing how these factors *necessarily* interacted in 18th-century Britain. This isn’t psychological "intelligibility" but a robust account of causal constraints. Conversely, CLM’s demand for laws remains hollow. As William Dray observed, purported historical "laws" (e.g., "revolutions follow state breakdown") are either trivially true or falsified by counterexamples (e.g., stable states experiencing revolutions). The CLM’s failure to produce convincing examples (beyond sketchy generalizations) suggests its standard of necessity is incoherent for history.  

  **Conclusion: A Substantive Epistemological Clash**  
  The dispute is substantive because it forces a choice between competing visions of historical knowledge. CLM seeks transcendent, lawlike certainty—a goal narrativists deem illusory and irrelevant. Narrative explanations deliver necessity *within a frame of contingent human actions*, satisfying history’s aim to explain "why this, here, now." To insist that narrative "only" shows possibility is to beg the question; it assumes CLM’s criteria are paramount. Ultimately, the dichotomy reflects an irreconcilable divide: whether historical explanation should aspire to scientific universality or embrace its status as a hermeneutic discipline. The latter does not reduce to psychology—it constructs epistemically valid reasons for events *as historical phenomena*.  

  ---

  ### **Marking Scheme (Total: 25 marks)**  
  **A-Grade (21–25 marks)**  
  - **Thesis:** Explicitly rejects simplistic dichotomy; argues the dispute is substantive or redefines its terms (e.g., contextual vs. nomological necessity).  
  - **Analysis:**  
    - Identifies CLM’s demand for "had to happen" as rooted in positivist epistemology.  
    - Defends narrative’s "could happen" as establishing *contextual* necessity/causal mechanisms (e.g., McCullagh, Dray).  
    - Critiques CLM’s "hand-wavy sketches" with concrete historical examples.  
  - **Critical Move:** Challenges the premise that narrative is "merely descriptive" by showing how emplotment/configural reasoning generates causality (e.g., White, Danto).  
  - **Conclusion:** Synthesizes positions to show why the rift reflects irreconcilable standards of explanation.  

  **B-Grade (16–20 marks)**  
  - **Thesis:** Recognizes a substantive disagreement but doesn’t fully transcend the dichotomy.  
  - **Analysis:**  
    - Accurately contrasts CLM’s "necessity" vs. narrative’s "intelligibility."  
    - Explains why both sides criticize the other (e.g., narrative’s "psychologism" vs. CLM’s "lack of real laws").  
    - Uses examples competently but without deep causal analysis.  
  - **Critical Move:** Notes the "talking past" element but doesn’t resolve it (e.g., "CLM wants science, narrative wants meaning").  
  - **Conclusion:** Restates positions without synthesizing a novel epistemological insight.  

  **C-Grade (11–15 marks)**  
  - **Thesis:** Describes the dichotomy without critical evaluation.  
  - **Analysis:**  
    - Summarizes CLM and narrative positions separately.  
    - Uses examples superficially (e.g., "Narratives tell stories, CLM uses laws").  
    - Misses key nuances (e.g., conflates narrative with chronology).  
  - **Critical Move:** Repeats clichés (e.g., "History is interpretive") without engaging epistemology.  
  - **Conclusion:** Restates the dichotomy or claims "both have merits."  

  **D/F-Grade (0–10 marks)**  
  - Inaccurate summaries of CLM/narrative.  
  - No examples or irrelevant examples.  
  - Significant omissions/misreadings of core concepts.  

  ---

  ### **Key Features for Pedagogical Goals**  
  1. **Forces Engagement with Epistemology**: By framing the debate around "had to" vs. "could," students must interrogate what "necessity" means in historical contexts.  
  2. **Demands Concrete Examples**: Prevents abstract regurgitation; students must test theories against real historical cases.  
  3. **Targets "Talking Past" vs. "Substantive"**: Requires evaluating whether the dispute is terminological or foundational.  
  4. **Time-Manageable**: Focused question allows for depth within 120 minutes.  

  This design rewards students who probe beyond Hempel/Danto tropes and grapple with why this debate *matters* for historical practice.
