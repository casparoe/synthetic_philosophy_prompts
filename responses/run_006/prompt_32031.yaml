  I'd like your credence that the quantum-suicide argument for quantum immortality succeeds, all things considered, where "succeeds" means: a rational agent who faces repeated quantum measurements that kill them on one outcome should assign a near-1 first-person probability to their own continued subjective survival, and that assignment is rationally required and decision-relevant rather than an artifact of how one counts branches. Give me a single number, not a survey of the debate. Then decompose it into the sub-questions the number actually rides on, with a rough probability for each and one line of justification. At minimum I want terms for: (1) that Everettian quantum mechanics, or something close enough, is true; (2) that, conditional on Everett, first-person self-locating probabilities should count branches by existence rather than weight them by amplitude or Born-rule measure; (3) that the notion of personal identity or subjective continuity the argument needs is preserved across the surviving branches; (4) that, even if the conclusion is accepted, it has decision-theoretic content rather than being a selection effect with no practical upshot. Add any further terms your credence hinges on. Then state how you combined the terms, which sub-question the final number is most sensitive to, and what evidence or argument would move that term the most. My own credence is around 0.3 and a friend's is around 0.7; after giving your number and decomposition, tell me which term most likely explains our gap.

  Return the result as a JSON object with this schema:

  - "final_credence": number, your overall credence that the quantum-suicide argument succeeds as defined above
  - "terms": array of objects, each with "label" (string), "probability" (number), "justification" (string), and "conditional_on" (string naming the sub-question it presupposes, or "none")
  - "combination": string explaining how the term probabilities combine into the final credence
  - "most_sensitive_term": string, the label of the term the final number is most sensitive to
  - "evidence_that_would_move_it": string
  - "likely_source_of_disagreement": string
