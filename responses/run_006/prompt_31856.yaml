prompt: |-
  Before I read any more theories of populism, I want the full spec, not another scorecard. Write me the desiderata for an account of 'the will of the people' good enough to tell when an appeal to it is legitimate and when it's just a faction or a leader talking. The cases it has to get right: a 52–48 referendum treated as settled for a generation, a mass movement with no formal vote behind it, a president who lost the popular vote but still claims a mandate, a poll majority that wouldn't lift a finger for the thing it says it wants. The distinctions it can't collapse: majority preference vs. a collective subject, an empirical claim about what the people want vs. a legitimating rhetoric, constitutive vs. merely causal support. The results it has to respect: Condorcet cycles, Arrow-style impossibility results, the discursive dilemma, and the boundary problem — who counts as 'the people' in the first place, and the account cant just stipulate it. Flag which of these are non-negotiable and which are just one camp's preferences, and tell me which subset, if any, is jointly unsatisfiable. That last part is what I actually want to see, so spend your time there.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly deep into political theory, specifically populism and democratic legitimacy. The way they frame this suggests they've hit a wall with existing literature - tired of "scorecards" that just compare theories without providing actionable criteria. What they really want is a rigorous framework for evaluating claims about "the people's will."

  Hmm... the cases they list are fascinatingly diverse: Brexit's thin referendum margin, leaderless movements like Occupy, minority-vote presidents like Trump, and apathetic majorities. Each exposes different flaws in naive populist rhetoric. And those distinctions they mention - between preference aggregation vs collective subjects, empirical vs rhetorical claims - show they understand the conceptual minefield.

  The real kicker is the demand to reconcile this with formal impossibility results. Arrow's theorem, Condorcet cycles, discursive dilemma... these aren't just academic footnotes. They're fundamental constraints any legitimacy theory must acknowledge. And that boundary problem - who even counts as "the people" - is where most populist discourses quietly implode.

  *scratches head* The non-negotiables seem clear: the framework must handle all four case studies while preserving those key distinctions and respecting formal limitations. But that last part - identifying which combinations are logically impossible - is the crux. Let me mentally test some combinations...

  First tension: wanting both procedural finality (like accepting Brexit) AND sensitivity to changing preferences. But if you take Condorcet cycles seriously, even "settled" decisions might be arbitrary. And Arrow's theorem says no voting system can avoid these paradoxes perfectly.

  Second big conflict: demanding actual causality ("would lift a finger") while needing constitutive legitimacy. If we require physical mobilization for legitimacy, most routine governance fails. But if we drop it, we get those apathetic majorities where polls mean nothing.

  *lightbulb* The boundary problem might be the deepest trap. Any definition of "the people" that isn't circular seems to require either arbitrary exclusion (violating inclusivity) or infinite regress. And without solving this, all other criteria float in mid-air.

  User's clearly not looking for easy answers. That "tell me which subset is unsatisfiable" line suggests they want the brutal truth about theoretical trade-offs. Time to map those contradictions systematically...
answer: |-
  Here’s a rigorous specification for evaluating claims about "the will of the people," designed to handle your test cases, respect critical distinctions, and acknowledge formal constraints. Non-negotiable items are marked **(NN)**; others reflect widely accepted (but contestable) democratic norms.

  ---

  ### **Desiderata for a Legitimate "Will of the People" Account**
  1.  **Handles Formal & Informal Expressions (NN)**  
      Must adjudicate both procedurally official acts (e.g., referendums, elections) *and* extra-institutional mass movements (e.g., protests, sustained civic campaigns) without privileging one a priori.

  2.  **Distinguishes Empirical Preference from Normative Authority (NN)**  
      Clearly separates:  
      - **Empirical claim:** "X policy has 60% support in polls."  
      - **Legitimating claim:** "This policy reflects the sovereign will, obligating compliance."  
      *Cannot* treat popularity alone as sufficient legitimacy.

  3.  **Resolves the Boundary Problem (NN)**  
      Provides non-arbitrary principles for defining "the people" (demos) in a given context (e.g., affected interests, territoriality, citizenship), acknowledging this is contested and dynamic. Cannot assume a pre-political unity.

  4.  **Acknowledges Formal Impossibility Results (NN)**  
      Accounts for:  
      - **Arrow’s Theorem:** No ranked voting system satisfies all reasonable fairness criteria.  
      - **Condorcet Cycles:** Majorities can be intransitive (A>B, B>C, C>A).  
      - **Discursive Dilemma:** Group rationality ≠ individual rationality on interconnected issues.  
      *Rejects* simplistic "majority = truth" claims.

  5.  **Distinguishes "Majority" from "People as Subject" (NN)**  
      Recognizes that aggregating individual preferences ≠ the existence of a unified collective agent ("the People") with a coherent "will." Legitimacy claims invoking the latter require additional justification.

  6.  **Demands Causal-Constitutive Consistency**  
      Support must be *constitutive* (shaping the outcome’s legitimacy) and not merely *causal* (influencing an outcome otherwise legitimate). A poll majority that "wouldn’t lift a finger" fails the constitutive test—it doesn’t act as a collective agent.

  7.  **Rejects Permanent Settledness**  
      A 52-48 referendum can be *provisionally* settled for practical governance but cannot claim *permanent* legitimacy ("a generation") without:  
      - Robust ongoing deliberation,  
      - Mechanisms for revisiting the issue,  
      - Supermajoritarian thresholds for entrenchment.

  8.  **Addresses Minority Mandates**  
      A leader losing the popular vote but winning procedurally (e.g., via electoral college) may have *legal authority* but lacks a *democratic mandate* for radical or divisive policies. Legitimacy claims require broader coalition-building or restraint.

  ---

  ### **The Non-Negotiables (NN)**
  Items 1-5 are foundational. No account ignoring Arrow’s Theorem, the boundary problem, or the empirical/normative distinction can be coherent. Items 6-8 are strong normative requirements for a robust democracy but could be relaxed in minimalist accounts (e.g., accepting purely procedural legitimacy).

  ---

  ### **Joint Unsatisfiability: The Core Tensions**
  Your key demand—identifying which desiderata subsets are incompatible—reveals three fundamental tensions. **These pairs/groups cannot be fully satisfied simultaneously** under real-world constraints:

  1.  **Procedural Finality + Dynamic Peoplehood + No Cycles (Items 7, 3, 4)**  
      - **Conflict:** Treating a thin-majority referendum as "settled" (7) assumes a static demos (contradicting 3) and ignores that the result may be cycle-vulnerable or preference-inconsistent (4).  
      - **Why Unsatisfiable?** If "the people" is dynamic (3), a past vote cannot bind future selves. If cycles exist (4), the "settled" outcome may not reflect a coherent will. Insisting on finality requires suppressing 3 or 4.

  2.  **Constitutive Agency + Empirical Majorities + Formal Impossibilities (Items 6, 2, 4)**  
      - **Conflict:** Requiring active collective agency (6) clashes with relying on passive majorities (polls, votes) that are vulnerable to strategic voting, cycles, or low salience (4). It also conflates empirical support with normative authority (2).  
      - **Why Unsatisfiable?** A poll majority that "wouldn’t lift a finger" (your case) fails the agency test (6). But avoiding this requires participatory mechanisms that are vulnerable to discursive dilemmas/cycles (4) and may not align with measured preferences (2).

  3.  **Non-Arbitrary Boundaries + Inclusive Legitimacy (Item 3 + Democratic Principle)**  
      - **Conflict:** Any non-arbitrary definition of "the people" (e.g., "affected interests") risks exclusion (e.g., future generations, marginalized groups). Conversely, over-inclusive definitions (e.g., "humanity") lack operational legitimacy.  
      - **Why Unsatisfiable?** Democratic legitimacy requires clear boundaries, but boundary-setting is itself an exclusionary act that cannot be democratically justified *to those excluded*. This is the **boundary problem’s paradox**.

  ---

  ### **The Deepest Cut: What You Can’t Have Together**
  **The most consequential unsatisfiable triad is:**  
  - **A coherent, unified "popular will"** (rejecting Arrow/Condorcet),  
  - **derived from purely procedural majoritarianism**,  
  - **that is both empirically measurable *and* normatively binding**,  
  - **while dynamically defining the demos without exclusion.**  

  *Why?* Formal impossibility theorems prove that no aggregation method can reliably produce a coherent "will" from individual preferences under minimally fair conditions. Insisting on a unified will *requires* either:  
  - Ignoring formal results (unscientific),  
  - Defining the people so narrowly it excludes dissenters (illiberal), or  
  - Invoking a metaphysical "true will" detached from actual preferences (authoritarian).  

  ---

  ### **Conclusion: The Viable Paths**
  A legitimate account must:  
  - **Accept the *disaggregated* nature of popular preferences** (per Arrow, Condorcet),  
  - Treat "the will of the people" as a **continual process of deliberation and revision**, not a static outcome,  
  - Ground legitimacy in **procedural fairness + inclusive participation + revisability**, not merely momentary majorities,  
  - **Explicitly justify boundaries** of the demos (e.g., "all affected" + "all subjected"), knowing this is imperfect.  

  Claims like a minority-elected president’s "mandate" or a thin referendum’s permanence fail on constitutive grounds (6) and conflate empirical/normative (2). Mass movements gain legitimacy through inclusive persistence and dialogue, not just numbers. **Legitimacy emerges from the structure of ongoing collective action, not snapshots of preference.**
