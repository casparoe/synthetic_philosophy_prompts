  Hmm, the core challenge is pinpointing this exact phenomenon. The user already knows about testimonial injustice (Fricker) and standard biases, but notes this is distinct because it's about shifting epistemic policies toward testimony itself. That's perceptive - most people wouldn't catch that nuance. 

  First, I need to map existing concepts. Testimonial injustice comes close but focuses on identity prejudice, not belief alignment. Motivated reasoning is broader - this is specifically about testimonial reception. The reductionism debate is relevant but doesn't address the asymmetry. 

  What makes this pattern unique? It's not just weighting evidence differently (confirmation bias) or source selection (cherry-picking). It's that the entire framework for evaluating testimony changes: default trust vs demanding proof, based solely on content congruence. The "transparent conduit" vs "suspicious curator" switch is key. 

  For naming... "epistemic policy switching" feels right. It captures the procedural shift. Or "testimonial stance asymmetry"? Need to emphasize it's about the rules of engagement with testimony. 

  For the reductionism debate, this hurts both sides. Anti-reductionism can't explain why default trust vanishes for disagreeable testimony. Reductionism can't explain why we don't demand proof for agreeable claims. The pattern suggests testimony evaluation is more dynamic and belief-dependent than either theory allows. 

  User seems to want this for academic work - maybe a paper? The structured response format they requested will help them reference it. Should emphasize how this differs from Fricker's work since they mentioned it. Also note it's psychologically "principled from the inside" - that introspection element is important.
answer: |-
  Here’s a structured analysis of the epistemic asymmetry you’ve described:

  ### 1. Nearest Existing Concepts (~200 words)  
  The pattern intersects with several established ideas:  
  - **Motivated Reasoning**: The tendency to process information in a way that favors pre-existing beliefs (Kunda, 1990).  
  - **Confirmation Bias**: Seeking or interpreting evidence to confirm prior hypotheses (Nickerson, 1998).  
  - **Testimonial Injustice**: Unfairly dismissing testimony due to identity prejudice (Fricker, 2007).  
  - **Reductionism vs. Anti-Reductionism**: Humean reductionism requires positive reasons to accept testimony, while Reidian anti-reductionism grants default trust absent defeaters (Coady, 1992).  
  - **Epistemic Vigilance**: Context-sensitive mechanisms to filter unreliable testimony (Sperber et al., 2010).  

  These focus on *how* we evaluate sources, but none explicitly address the **asymmetric application of epistemic standards** based on content alignment with priors.  

  ### 2. How the Described Pattern Differs (~250 words)  
  Your observation reveals a distinct **procedural asymmetry**:  
  - **Not cherry-picking**: Dan isn’t selecting favorable data from a pool; he’s altering his *evaluation framework* for the *same source*.  
  - **Beyond confirmation bias**: The issue isn’t overweighting congruent evidence but switching the **burden of proof** itself:  
    - *Congruent testimony*: Default anti-reductionism (trust unless refuted).  
    - *Incongruent testimony*: Shifts to reductionism (demands positive justification).  
  - **Distinct from testimonial injustice**: Fricker’s concept concerns identity-based credibility deficits. Here, the asymmetry is triggered by *content disagreement*, not prejudice toward the speaker (though the journalist/economist may suffer collateral distrust).  

  The core novelty is the **context-dependent epistemic policy**: The threshold for accepting testimony varies based *solely* on its agreement with the hearer’s beliefs, without independent reasons to doubt the source. This feels "principled" because it mirrors how we intuitively calibrate skepticism, yet it’s epistemically arbitrary.  

  ### 3. Proposed Name and Definition (~200 words)  
  **Epistemic Policy Switching** (EPS)  
  *Definition*: The asymmetric application of testimonial evaluation standards, whereby congruent testimony is granted default acceptance (anti-reductionist policy), while incongruent testimony triggers a demand for positive justification (reductionist policy), absent independent reasons for the shift.  

  **Examples**:  
  1. *Climate study*: Dan accepts journalist-as-conduit (anti-reductionism).  
  2. *Minimum wage*: Dan demands proof of economist’s credibility (reductionism).  
  3. *Academic seminar*: A theorist accepts methodological critiques from allies with cursory scrutiny but requires exhaustive evidence from rivals.  

  EPS isolates the *procedural double standard* from related biases. It occurs when:  
  - The same source is treated with divergent epistemic policies.  
  - The shift is primarily content-driven.  
  - Both stances feel internally justified.  

  ### 4. Implications for the Reductionism Debate (~200 words)  
  EPS challenges **both** reductionism and anti-reductionism:  
  - **Anti-reductionism** struggles because default entitlement is *selectively revoked* for disagreeable testimony without valid defeaters, violating the principle of content-neutrality implied by Reid.  
  - **Reductionism** fails because agreeable testimony isn’t subjected to demanded justifications, revealing that we *don’t* universally require positive reasons.  

  The pattern suggests testimony evaluation is **dynamically pragmatic**: We toggle between "trusting" and "verifying" modes based on cognitive efficiency (e.g., conserving effort for non-threatening information) and identity defense (protecting belief systems). This undermines universalist accounts of testimony, pointing toward **contextualist hybrids** (e.g., Goldberg 2010) where epistemic policies are sensitive to content *and* stakes. However, EPS highlights an irrational element: policies shift based on *belief congruence alone*, making testimonial justification path-dependent and unstable.  

  **Key Insight**: EPS reveals testimony’s role in *epistemic tribalism*—we ease barriers for "allies" and raise them for "challengers," treating credibility assessment as territory defense rather than truth-seeking.
