  **Question 2: Was the act required by the person's role or duty?**
     - Explanation: We need to check if the person was obligated to do the act by their job description, explicit contract, or basic moral duties (like not causing harm). If it was required, then it's not optional.
     - Sufficient answer: No, if the act went beyond what is normally expected or required in their role. 
     - If yes: Stop. The act is dutiful (even if praiseworthy under difficult conditions). It is not supererogatory. Rule out.
     - If no: Proceed to Question 3.

  **Question 3: Would it have been blameworthy not to do the act?**
     - Explanation: Even if not strictly required by role, sometimes there are moral expectations that make an omission blameworthy. We want to ensure that the omission would not have been blameworthy. Supererogatory acts are such that the agent is not blamed for not doing them.
     - Sufficient answer: No, it would not have been blameworthy to omit the act. 
