answer: |-
  ### Supererogation Assessment Procedure for Staff Recognition Committee  
  **Design Principles**: Plain language, forces hard distinctions, time-efficient (90 mins for ~12 nominations). Focuses on four criteria: **good**, **optional**, **praiseworthy to do**, **not blameworthy to omit**.  

  #### Procedure: 5 Sequential Questions  
  **Question 1: Was the act clearly beneficial?**  
  - *Purpose*: Filters out neutral or harmful acts. Ensures the act is morally good.  
  - *Sufficient Answer*: **Yes**—it produced significant, identifiable benefits (e.g., saved lives, prevented harm, upheld university values).  
  - *Stop if No*: Rule out. (Not supererogatory—may be neutral or impermissible.)  

  **Question 2: Was the act required by the person’s job or basic decency?**  
  - *Purpose*: Tests "optionality." Distinguishes duty from going beyond duty.  
  - *Sufficient Answer*: **No**—it exceeded contractual duties, role expectations, or basic moral obligations (e.g., not stealing is required; working extra hours during a crisis may not be).  
  - *Key Clarifications*:  
    - "Basic decency" = what any reasonable person must do (e.g., calling 911 in an emergency).  
    - "Job requirements" = explicit duties in the job description or implied by role (e.g., a firefighter running into a burning building is required; a professor doing so is not).  
  - *Stop if Yes*: Rule out as **dutiful-but-praiseworthy** (even if done under duress).  

  **Question 3: Would omitting the act have been blameworthy?**  
  - *Purpose*: Ensures omission is not culpable. Supererogation demands no moral censure for inaction.  
  - *Sufficient Answer*: **No**—it would be understandable, forgivable, or reasonable to skip the act.  
  - *Stop if Yes*: Rule out. (The act may be good and costly, but if blame attaches to omission, it’s likely obligatory.)  

  **Question 4: Did the act involve significant personal sacrifice?**  
  - *Purpose*: Gauges cost threshold. This is the **judgment call** step—sacrifice must be substantial enough that demanding it would be unreasonable.  
  - *Sufficient Answer*: **Yes**—costs are non-trivial and impactful (e.g., health, financial stability, personal risk, major time/opportunity loss).  
  - *Cost Threshold Guidance*:  
    - **Minimal**: Minor inconvenience (e.g., working late once). → Insufficient.  
    - **Significant**: Tangible, lasting impact (e.g., health risk, major income loss, psychological toll). → Sufficient.  
    - *Committee Judgment*: Ask: **"Would it be unreasonable to demand this sacrifice of any employee in their position?"** If yes → sufficient cost.  
  - *Stop if No*: Rule out as **merely permissible** (good and optional but not costly enough for supererogation).  

  **Question 5: Is the act praiseworthy?**  
  - *Purpose*: Final check. Rarely fails if previous steps pass, but ensures alignment with award intent.  
  - *Sufficient Answer*: **Yes**—it intuitively merits public recognition.  
  - *Stop if No*: Rule out. (Theoretical; unlikely if Q1–Q4 passed.)  

  **Where It Stops**:  
  - Q1 (no) → Out.  
  - Q2 (yes) → **dutiful-but-praiseworthy**.  
  - Q3 (yes) → Out (likely obligatory).  
  - Q4 (no) → **merely permissible** (optional but not sacrificial enough).  
  - Q5 (no) → Out (theoretical).  
  - All yes → **supererogatory**.  

  **What the Procedure Cannot Do**:  
  - Resolve deep philosophical disputes (e.g., "Is altruism ever truly optional?").  
  - Quantify exact cost thresholds—relies on committee consensus.  
  - Handle ambiguous job duties perfectly—requires common-sense interpretation of roles.  
  - Capture emotional or symbolic value beyond tangible benefits/costs.  

  ---  
  ### Application to Nominations  
  **1. Custodian who kept working through a flood:**  
  - Q1: **Yes**—Prevented property damage/health hazards (good).  
  - Q2: **Yes**—Custodial roles include emergency response; maintaining safety is a core duty. (Stop → **dutiful-but-praiseworthy**).  
  - *Why not supererogatory*: Flood response is implicitly/explicitly part of the job. Heroism under duress doesn’t make it "beyond duty" unless risks were extreme (e.g., life-threatening). Here, "awful conditions" are part of the role’s expected scope.  

  **2. Employee who donated a kidney to a coworker’s spouse:**  
  - Q1: **Yes**—Saved a life (good).  
  - Q2: **No**—Organ donation is never job-related or basic decency.  
  - Q3: **No**—Not donating is never blameworthy (deeply personal choice).  
  - Q4: **Yes**—Major surgery, permanent health risk, recovery time (significant sacrifice).  
  - Q5: **Yes**—Highly praiseworthy.  
  - → **supererogatory**.  

  **3. Manager who quietly took a pay cut so her team wouldn’t be laid off:**  
  - Q1: **Yes**—Preserved jobs/team morale (good).  
  - Q2: **No**—Managers aren’t required to sacrifice personal salary; this exceeds role duties.  
  - Q3: **No**—Omitting this wouldn’t be blameworthy (layoffs are an organizational decision).  
  - Q4: **Yes**—Pay cuts directly impact livelihood (financial sacrifice). *Judgment call*: Assuming the cut was substantial (e.g., >10% of income), it meets the threshold.  
  - Q5: **Yes**—Commendable.  
  - → **supererogatory**.  

  **The Committee’s Favorite That Isn’t Supererogatory**:  
  - **Custodian** (verdict: dutiful-but-praiseworthy).  
  - *Why*: The committee likely admires their dedication under pressure, but the procedure forces the distinction: this is "doing their job well under awful conditions" (Q2 = yes). Awarding it as supererogatory blurs the line between duty and going beyond duty.  

  ---  
  ### Final Verdicts  
  \answer{dutiful-but-praiseworthy, supererogatory, supererogatory}
