prompt: |-
  A friend forwarded me a long argument from a Slack we're both on, between two people who are both pretty philosophically sharp, and I genuinely couldn't tell who was right by the end of it. They were arguing about moral uncertainty — specifically whether you should maximize expected choiceworthiness across the moral theories you assign nonzero credence to.

  The first one, call him N, opened with the standard line: just as you should take the expected value of options under empirical uncertainty, you should take the expected choiceworthiness of options under normative uncertainty. Anything else means sometimes knowingly choosing the option that's probably morally worse, which is just as irrational as knowingly choosing the option that's probably causally worse.

  The second one, M, came back that choiceworthiness isn't a shared currency like dollars or utils. Saying that lying is "minus eight" on Kant's scale and "minus forty" on the utilitarian scale presupposes exactly the common unit that doesn't exist, because each theory defines its own scale and there's no exchange rate between them.

  N replied that you don't need a magic exchange rate; you just normalize. Set the least choiceworthy option each theory considers possible at 0 and the most at 1, then compare across theories on that normalized scale. M said that's hopeless, because the normalization is an arbitrary convention: you and me can pick different least/most anchors and get different answers about which act wins, so "expected choiceworthiness" doesn't pick out a unique verdict. N said sure, but that's the same situation as picking priors under empirical uncertainty; underdetermination at the margins doesn't refute the whole approch, and some answer beats no answer. M said no, because with empirical priors the utilities are at least the same kind of quantity across states, while here the anchors aren't measuring anything — they're stipulating a comparison — so the arbitrariness isn't a tolerable approximation, it's a hole in the middle of the method.

  Then M added a second objection: some theories don't give you a cardinal, or even an ordinal, ranking in the cases you actually need one. A deontological theory might just say the act is forbidden, full stop, with no "amount of forbiddenness," so you literally can't place it on the scale you're averaging over. N said you can approximate: use intervals or lexicographic representations, or decision rules that handle incomparability, and anyway real people's credences are rarely over fully precise theories, so this is an objection to a straw version of the view. M said that's exactly the problem — once you start patching with interval scales and incomparability-sensitive rules, you've stopped doing expected choiceworthiness and are doing whatever ad hoc thing produces sane answers, which means the advertised justification has evaporated.

  N's final move was to say the alternative is worse: if you don't let uncertainty about which moral theory is true affect what you do, you're acting as if you're certain you're right, and that's a kind of epistemic arrogance we'd never accept in any factual matter. M answered that this conflates two questions. "What should I do, given that I might be wrong about morality" is different from "what is it right to do," and the true moral theory answers the second question directly; using your credences over theories to decide what to do is itself a first-order moral commitment (roughly, a consequentialist one), not a neutral meta-principle.

  That's where the thread ended. I'd love a point-by-point adjudication: at each move, who is right about what, where each of them overclaims or underclaims, and what a defensible position would say after all of this — including whatever both of them are missing. And the usual ask: how confident are you in these verdicts, and which point are you least sure about?
reasoning: |-
  Okay, the user has shared a detailed philosophical debate between two people, N and M, about moral uncertainty. They want me to adjudicate point-by-point who was right at each stage, where they overclaimed or underclaimed, and what a defensible position might look like after all this. They also want to know my confidence levels in these verdicts.

  Let me start by understanding the core arguments. N is advocating for maximizing expected choiceworthiness across moral theories you have credence in, similar to expected utility under empirical uncertainty. M is challenging this, arguing that choiceworthiness isn't a shared currency, normalization is arbitrary, and some theories don't provide cardinal rankings.

  First, N's opening point about consistency between empirical and normative uncertainty seems strong at first glance. The analogy makes intuitive sense - if we maximize expected value for empirical uncertainty, why not for moral uncertainty? But M's counterpoint about the lack of shared currency is crucial. Money or utils have defined scales, but moral theories operate on entirely different frameworks. Kant's categorical imperative doesn't naturally translate to a numerical scale comparable to utilitarianism's hedonic calculus.

  When N suggests normalization (setting least choiceworthy at 0 and most at 1), this seems like a practical solution but M correctly points out the arbitrariness. Which options you consider as anchors dramatically affects outcomes. If I'm choosing between saving my child or five strangers, what counts as the "most" choiceworthy option? The normalization isn't just underdetermined like priors - it's constructing comparability where none inherently exists.

  M's second objection about non-cardinal theories is also significant. Deontological theories often give binary judgments (permitted/forbidden) without degrees. N's suggestion to approximate with intervals or lexicographic orders feels like patching rather than solving - once we go down that road, we're no longer doing pure expected choiceworthiness maximization.

  N's final point about epistemic humility is compelling - ignoring moral uncertainty does seem arrogant. But M's distinction between "what should I do given uncertainty" versus "what is morally right" is vital. The expected choiceworthiness approach itself presupposes a particular moral framework (consequentialist-leaning) rather than being neutral.

  Where does this leave us? Both have valid points. N is right that we need to account for moral uncertainty somehow, and M is right that expected choiceworthiness maximization has serious methodological flaws. A defensible middle position might involve: recognizing the approach as useful but flawed heuristic; using it only when theories are commensurable; supplementing with second-order principles; being transparent about normalization choices; and acknowledging that for sharply incommensurable theories, we may need entirely different decision rules.

  I'm most confident about M's critique of normalization arbitrariness - that seems fundamentally problematic. Least confident about whether we can truly separate the "what should I do under uncertainty" question from first-order moral commitments - that's deep meta-ethical territory with no clear consensus.
answer: |-
  Here's a point-by-point adjudication of the N vs. M debate on moral uncertainty, identifying strengths, weaknesses, overclaims, underclaims, and a synthesis for a defensible position. My confidence ratings are at the end.

  ### Round 1: The Core Analogy
  *   **N's Claim:** Maximizing expected choiceworthiness under normative uncertainty is analogous to maximizing expected utility/value under empirical uncertainty. *Not* doing this means knowingly risking the "probably worse" option, which is irrational.
  *   **M's Implicit Counter:** The analogy fails because empirical utility/value (e.g., dollars, hedons) is a *shared, measurable quantity* across states of the world, while moral choiceworthiness is theory-specific and lacks a common unit.
  *   **Verdict:** **M has the stronger point here.** N overclaims the analogy. While the *formal structure* of maximizing an expectation is similar, the *content* differs crucially. Empirical uncertainty involves unknown *facts* impacting outcomes measured on a *single, agreed-upon scale* (utility). Normative uncertainty involves disagreements about the *scale itself*. N underclaims the uniqueness of the "common scale" problem in ethics.
  *   **Defensible Position:** The analogy is *aspirational but flawed*. We might *want* a method like expected utility for morals, but the lack of a pre-existing common scale of "moral value" is a fundamental obstacle N hasn't overcome.

  ### Round 2: Normalization
  *   **N's Claim:** Solve the scale problem by normalizing each theory's choiceworthiness function to [0,1] (0 = least choiceworthy option possible, 1 = most).
  *   **M's Claim:** Normalization is arbitrary. Different choices of "least/most" anchors (especially across different possible acts) yield different results. This arbitrariness is worse than empirical priors because utilities are fixed quantities, while normalization *creates* a scale for comparison.
  *   **Verdict:** **M is substantially right.** N underclaims the depth of the arbitrariness problem.
      *   **Anchor Dependence:** Which options are considered "possible" for setting 0 and 1? Is it only the acts available *now*, or *any* act conceivable under the theory? The answer drastically changes the normalized scores and thus the "expected choiceworthiness." This isn't like setting a prior; it's defining the units of measurement.
      *   **Range Sensitivity:** Theories where the "best" and "worst" possible acts are very different (e.g., utilitarianism with astronomical stakes) get stretched out compared to theories where the range is small (e.g., a deontology focused on specific prohibitions). This weights the *range* of a theory more than the *credence* in it.
  *   **Defensible Position:** Normalization is a common *heuristic*, but M is correct that it introduces significant, non-arbitrary-in-the-good-way (like priors) subjectivity. It doesn't provide a unique, objective "expected choiceworthiness."

  ### Round 3: Non-Cardinal/Ordinal Theories
  *   **M's Claim:** Some theories (e.g., strict deontology) don't provide cardinal, or even ordinal, rankings needed for expectation calculation. They might just say "forbidden" or "permitted" without degrees.
  *   **N's Claim:** Approximate using intervals, lexicographic orders, or other decision rules. Real people don't have credence in perfectly sharp theories anyway.
  *   **Verdict:** **This is a draw, leaning towards M.**
      *   **N's Strength:** He's right that in practice, we can often make rough comparisons ("this forbidden act seems *worse* than that one") or use modified decision rules (e.g., satisficing, voting rules over theories). Ignoring such theories entirely seems wrong.
      *   **M's Strength:** N's "approximations" are ad hoc patches that fundamentally *change the method*. Interval scales (e.g., "forbidden acts have choiceworthiness < -100") are stipulations, not derivations. Lexicographic orders abandon expectation maximization. N overclaims by implying these patches are natural extensions of "expected choiceworthiness" when they are actually *replacements*. He underclaims how deeply this undermines the advertised universality of the approach.
  *   **Defensible Position:** The "expected choiceworthiness" framework struggles severely with theories lacking rich structure. Practical workarounds exist, but they confirm M's point that the pure framework isn't universally applicable and requires significant, theory-dependent modification.

  ### Round 4: Epistemic Arrogance vs. First-Order Commitment
  *   **N's Claim:** Ignoring normative uncertainty is epistemically arrogant. We wouldn't accept certainty in empirical matters; why in morals? We *must* let credence over theories affect action.
  *   **M's Claim:** N conflates "What should I do given my uncertainty?" (a practical question) with "What is the right thing to do?" (answered by the true moral theory). Using credences to decide *is itself* a first-order moral commitment (roughly, to a kind of consequentialism), not a neutral meta-principle.
  *   **Verdict:** **Both points are valid; M identifies a crucial distinction.**
      *   **N's Strength:** Ignoring uncertainty *is* problematic. Some accommodation seems rationally/morally required. N is right that simply acting on your "best guess" theory without regard for uncertainty feels dogmatic.
      *   **M's Strength:** M lands a critical blow. The "expected choiceworthiness" approach isn't a neutral, rational necessity arising purely from acknowledging uncertainty. It *prescribes a specific way* of responding to uncertainty: aggregating normalized choiceworthiness scores via expectation. This prescription *itself* makes substantive moral assumptions:
          *   That intertheoretic comparisons (even normalized) are meaningful.
          *   That choiceworthiness can be treated cardinally and linearly.
          *   That maximizing the *expectation* of this aggregate is the right response.
          These assumptions align most naturally with consequentialist thinking. A deontologist might argue uncertainty should lead to *caution* (avoiding acts any theory forbids), not calculation. A moral pluralist might seek reflective equilibrium, not averaging. N underclaims the extent to which his solution smuggles in normative content.
  *   **Defensible Position:** Acknowledging moral uncertainty is essential, but *how* to respond to it is itself a deep, contested *moral* question. There is no single, rationally mandated, theory-neutral "Bayesian" solution for normative uncertainty like there arguably is for empirical uncertainty (given agreed utilities).

  **Synthesis: A Defensible Position After the Debate**

  1.  **The Problem is Real:** N is right that ignoring normative uncertainty is untenable. We need *some* way to guide action under moral doubt.
  2.  **The Standard Solution is Flawed:** M successfully dismantles the claim that maximizing *expected choiceworthiness* is *the* rational or neutral solution analogous to empirical expected utility. The normalization problem is severe, the framework struggles with non-cardinal theories, and the approach itself embodies contestable moral assumptions (consequentialist-leaning aggregation).
  3.  **No Silver Bullet:** There is no single, universally accepted, theoretically pristine solution to the problem of moral uncertainty. This is a frontier area in moral philosophy.
  4.  **Pragmatic Approaches:** In practice, modified versions of expected choiceworthiness (with careful normalization, handling intervals, etc.) can be a *useful heuristic* or decision procedure, especially when theories are relatively commensurable (e.g., different forms of utilitarianism). It forces explicit consideration of uncertainty and credences.
  5.  **Beyond Expectation:** Other approaches exist and may be preferable depending on the nature of the uncertainty and the theories involved:
      *   **My Favorite Theory:** Act according to the theory you assign the highest credence to (avoids aggregation problems, but ignores uncertainty below the threshold).
      *   **Consensus/Contractualist Approaches:** Seek actions permissible under all theories you deem plausible, or that would be agreed upon by adherents of those theories.
      *   **Satisficing Under Uncertainty:** Aim for actions that are "good enough" across plausible theories.
      *   **Maximin/Minimax Regret:** Focus on avoiding the worst outcomes or worst possible mistakes across theories (appeals to risk-aversion).
      *   **Second-Order Moral Principles:** Develop principles *about* how to act under first-order moral uncertainty (e.g., "When uncertain, err on the side of caution regarding causing harm").
  6.  **Transparency & Humility:** Recognize that any method involves assumptions. Be explicit about normalization choices, the limitations of cardinal representation, and the underlying moral commitments of the chosen decision rule. Acknowledge that the choice of *how* to handle moral uncertainty is itself a substantive, uncertain moral decision.

  **Confidence Assessment:**

  *   **Highest Confidence (8/10):** M is correct about the *fundamental flaw in the normalization argument* (Round 2) and the *consequentialist-leaning nature of the expected choiceworthiness approach* (Round 4). The arbitrariness of anchors and the range sensitivity are decisive objections to normalization as a solution to the common scale problem. Identifying the approach as a substantive first-order commitment is crucial.
  *   **High Confidence (7/10):** M is correct that non-cardinal theories pose a severe, often unacknowledged problem for the pure framework (Round 3), though N is right that practical workarounds are used.
  *   **Moderate Confidence (6/10):** N is right that *ignoring* uncertainty is problematic (Round 4), but M successfully reframes the debate by showing N's solution isn't the only or obviously mandated response.
  *   **Lowest Confidence (5/10):** The precise defensibility of various pragmatic heuristics (like normalized expected choiceworthiness) versus alternatives like satisficing or contractualist approaches in specific contexts. This is where the philosophical debate is most active and least settled. I'm least sure about the *best practical path forward* once the flaws of the standard approach are conceded, though I'm confident the standard approach *is* flawed.
