  - 0:05-0:10: Rules explanation and practice round.
  - 0:10-0:40: Game play (5 rounds, 1 min discussion + reveal per round; but games may end early).
  - 0:40-0:45: Collect results.
  - 0:45-1:45: Debrief (as detailed above).
  - 1:45-2:00: Conclusion and real-world examples.

