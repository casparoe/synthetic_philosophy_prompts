     - Step 5: Contrast with Prisoner's Dilemma. In PD, defection is dominant. Here, there is no dominant strategy. Waiting might be safe in early rounds if you think the other might commit, but then you risk losing the prize. Committing is risky because of the chance of collision. The race is about timing.
     - Step 6: Introduce the term "commitment race" and Schelling's analysis. Explain that the ability to commit is a source of power, but when both have it, they might race to commit first and end up in a collision. 
     - Step 7: Discuss real-world examples: arms races (each country wants to build up arms to deter the other, but if both build up, it leads to an expensive and dangerous situation), union negotiations (each side might commit to a tough stance, leading to a strike that hurts both), constitutional pre-commitments (e.g., debt limits that might force a crisis), brinkmanship in crises.

