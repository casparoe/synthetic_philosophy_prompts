  2. **Team Reflections (10 min):** Ask a few teams: What was your strategy? Why did you commit when you did? Why did you wait? What did you think the other team would do?
  3. **Formal Structure (10 min):** Draw a 2x2 matrix for one round (e.g., round 1). The payoffs are:
