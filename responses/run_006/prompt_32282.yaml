  ### The Canyon Bridge Game: A Commitment Race Simulation  
  *Designed for a master's seminar on "Strategic Interaction and Institutional Design"*

  ---

  #### **(a) Setup and Materials**  
  - **Participants**: Divide the class into **teams of 3**. Form 6 teams (for 18 students). Pair teams into **3 competing dyads** (e.g., Team A1 vs. B1, A2 vs. B2, A3 vs. B3).  
  - **Materials per dyad**:  
    - Two colored commitment tokens (e.g., red for A, blue for B) placed at the center of a table.  
    - A shared "Bridge Board" showing the payoff structure (see below).  
    - A countdown timer (visible to all, e.g., projected digital timer).  
    - Paper slips for secret votes within teams.  
  - **Room Setup**: Arrange tables for each dyad, spaced apart to prevent cross-table communication. Project a master timer.  

  ---

  #### **(b) Rules and Roles**  
  - **Objective**: Teams compete to claim a valuable "canyon bridge" (representing a strategic advantage, e.g., a trade route or military position). The first team to irreversibly commit to building the bridge wins, but if both commit simultaneously, the bridge collapses.  
  - **Roles**:  
    - Each team has 1 minute per round to discuss strategy.  
    - One student per team acts as the "envoy" to place the token if committing.  
  - **Game Flow**:  
    1. **Rounds**: 5 rounds total. Each round lasts 1 minute.  
    2. **Decision**:  
       - Teams secretly vote (via paper slip) to **COMMIT** or **WAIT**. Majority vote wins.  
       - If voting to COMMIT, the envoy places their token on the bridge board.  
    3. **Revelation**: At the minute’s end, tokens are revealed simultaneously.  
    4. **Outcomes**:  
       - **One team COMMITs, the other WAITs**: Committing team wins the round’s payoff. Game ends.  
       - **Both COMMIT**: Bridge collapses. Both teams get a negative payoff. Game ends.  
       - **Both WAIT**: Bridge remains unclaimed. Proceed to the next round.  
    5. **Irreversibility**: Once a token is placed, it cannot be withdrawn.  
    6. **Endgame**: If no one commits by Round 5, the bridge is destroyed by "rockfall," and both teams get zero.  

  ---

  #### **(c) Payoff Structure**  
  **Symbolic points (no real money)**. Payoffs decrease over rounds to incentivize early action:  
  - **Successful Commitment (only one team commits)**:  
    - Round 1: 100 points  
    - Round 2: 80 points  
    - Round 3: 60 points  
    - Round 4: 40 points  
    - Round 5: 20 points  
  - **Both Commit (bridge collapse)**: –50 points for both, regardless of round.  
  - **Both Wait**: 0 points (but game continues).  
  - **No Commitment by Round 5**: 0 points for both.  

  **Key Incentives**:  
  - Early commitment offers higher rewards but risks a collision if the opponent commits simultaneously.  
  - Waiting risks losing the prize to the opponent but avoids collision.  
  - Mutual waiting delays gains and reduces potential rewards.  

  ---

  #### **(d) Timeline for Two-Hour Session**  
  | Time          | Phase                           | Details                                                                 |  
  |---------------|---------------------------------|-------------------------------------------------------------------------|  
  | 0:00-0:10     | **Introduction & Setup**        | Assign teams, distribute materials, explain rules neutrally. Avoid theory terms like "commitment" or "race." Focus on actions: "claim the bridge." |  
  | 0:10-0:15     | **Practice Round**              | Run a non-binding Round 1. Clarify doubts.                              |  
  | 0:15-0:40     | **Game Play (Rounds 1-5)**      | Run 5 rounds (1 min/round). Instructor circulates, observes dynamics.   |  
  | 0:40-0:50     | **Data Collection**             | Record outcomes per dyad: round ended, payoffs, collision rate.         |  
  | 0:50-1:45     | **Debrief & Discussion**        | Guide students to uncover the logic (see section (e)).                  |  
  | 1:45-2:00     | **Real-World Connections**      | Link to Schelling, examples, and limitations.                           |  

  ---

  #### **(e) Debrief Guide**  
  **Goal**: Help students self-discover the commitment race logic. Avoid lecturing; use Socratic questioning.  

  1. **Describe Outcomes (5 min)**:  
     - Chart results: "How many dyads had a collision? How many ended with one winner? In which rounds?"  
     - Ask: *"What patterns do you see? Why did collisions happen in Round 1 but not Round 5?"*  

  2. **Map Decisions to Incentives (10 min)**:  
     - Draw a 2x2 matrix for Round 1 on the board:  
       ```  
               Team B COMMIT    Team B WAIT  
       Team A COMMIT   (-50, -50)     (100, 0)  
       Team A WAIT       (0, 100)      (0, 0)  
       ```  
     - Ask: *"Why might Team A choose COMMIT even if it risks -50? Why might WAIT feel safe or dangerous?"*  
     - Highlight: COMMIT is not dominant (unlike Prisoner’s Dilemma defection). Payoffs depend on timing and mutual expectations.  

  3. **Identify the "Race" Dynamic (15 min)**:  
     - Ask teams:  
       - *"What pressured you to commit early?"* (E.g., high Round 1 rewards, fear of opponent committing first).  
       - *"Did waiting feel like losing control? Why?"* (Irreversibility shifts power to the first-mover).  
     - Contrast with PD: *"In Prisoner’s Dilemma, defecting is always better individually. Here, is COMMIT always best? When might WAIT be rational?"*  

  4. **Connect to Schelling (10 min)**:  
     - Introduce terminology: *"You experienced a commitment race. Binding yourself first can force others to yield, but when all can bind themselves, racing to commit may cause mutual harm."*  
     - Show Schelling’s insight: Commitment power is a "threat that leaves something to chance" – it creates leverage but risks uncontrollable escalation.  

  5. **Discuss Real-World Cases (10 min)**:  
     - Ask: *"Where have you seen this? Arms races? Labor strikes?"*  
     - Provide examples:  
       - **Nuclear arms races**: Building missiles first grants deterrence, but mutual buildup wastes resources and increases risk.  
       - **Union strikes**: Pre-emptively committing to a strike can force concessions, but if both sides commit, a costly lockout occurs.  
       - **Constitutional hardballs**: Passing irreversible laws (e.g., debt ceilings) to bind opponents, triggering crises when both sides dig in.  

  ---

  #### **(f) Predictable Problems & Solutions**  
  - **Problem: Collisions in Round 1**  
    - Why: Students misjudge risk or mimic "tough" behavior.  
    - Solution: Normalize this in debrief – it reveals the race’s danger. Ask: *"Why was Round 1 riskier than you expected?"*  

  - **Problem: Overcautiousness (no commitment by Round 5)**  
    - Why: Fear of collision outweighs declining rewards.  
    - Solution: Highlight the cost of delay: *"What did you gain by waiting? What did you lose?"*  

  - **Problem: Cross-table signaling**  
    - Why: Teams may wink, gesture, or whisper to adversaries.  
    - Solution: Enforce silence and spatial separation. Remind them: "No communication outside your team."  

  - **Problem: Confusion with Prisoner’s Dilemma**  
    - Why: Students default to familiar frameworks.  
    - Solution: In debrief, stress the differences: No dominant strategy; mutual waiting is possible but costly; harm comes from simultaneous action, not defection.  

  ---

  #### **(g) Limitations to Acknowledge in Discussion**  
  The game simplifies reality. **You must supplement**:  
  1. **Gradual Commitments**: Real-world commitments (e.g., military mobilizations) build over time, allowing for de-escalation. The game’s "instant" commitment exaggerates irreversibility.  
  2. **Communication and Signals**: In reality, actors use threats, diplomacy, or costly signals (e.g., troop movements) to avoid races. The game bans communication to isolate the core dynamic.  
  3. **Asymmetric Power**: Teams here are symmetric, but real races (e.g., US vs. USSR) involve power imbalances. Discuss how asymmetry affects who "wins" the race.  
  4. **External Enforcement**: Institutions (e.g., treaties) can prevent races by restricting commitment power. The game lacks this – note how design shapes outcomes.  
  5. **Uncertainty**: Real actors rarely know payoffs or timelines. The game’s clear structure makes risks transparent – but reality is foggy.  

  ---

  **Design Philosophy**: This game isolates the commitment race by making irreversibility explicit, rewards time-sensitive, and mutual commitment uniquely harmful. It avoids collapsing into PD (no dominant strategy), coordination games (no mutual-gain equilibrium), or bargaining (no offers/exchanges). Students *feel* the rush to commit, the dread of collision, and the cost of delay – setting up a visceral grasp of Schelling.
