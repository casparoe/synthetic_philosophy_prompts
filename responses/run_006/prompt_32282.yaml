  **Limitations of the Game:**

  1. **Irreversibility:** In the game, commitment is irreversible and instantaneous. In the real world, commitments might be more gradual or reversible at a cost. The game abstracts away the process of building commitment.

  2. **Information:** In the game, the teams know the payoff structure and the number of rounds. In the real world, the value of the prize and the time horizon might be uncertain.

  3. **Communication:** The game forbids communication between teams. In the real world, actors often communicate threats and promises. The game isolates the pure strategic structure without communication.

  4. **Multiple Rounds vs. Continuous Time:** The discrete rounds might make the game feel artificial. In real commitment races (like an arms race), the process is continuous and the costs are ongoing.

  5. **Collateral Costs:** In the game, the only cost is the investment loss in a collision. In the real world, there might be ongoing costs of the commitment itself (e.g., maintaining a large military) even without a collision.

