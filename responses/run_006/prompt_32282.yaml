  4. **Key Insight (10 min):** The commitment power (the ability to lock in) is what gives a team the chance to win. But when both have this power, they might race to commit first. The race can lead to a collision (both commit in the same round) which is worse than if they could coordinate (one commits and the other waits). But without coordination, they might end up in a collision or in a very late commitment with a low prize. In the worst case, they collide in round 1 and both lose a lot.
