  1. **Problem:** Students might not understand the rules.  
     **Solution:** Do a practice round with no stakes. Explain with examples.

  2. **Problem:** The game might end too quickly (many collisions in round 1).  
     **Solution:** That's okay! It illustrates the risk. In the debrief, discuss why they committed in round 1.

  3. **Problem:** The game might go to the end with no commitment (both get 0).  
     **Solution:** Also okay. Discuss why they were so cautious. Note that the prize became very low, so they might have thought it was not worth the risk.

  4. **Problem:** In the discrete rounds, students might coordinate implicitly (e.g., Team A commits in round 1 and Team B waits, but how do they know? They don't).  
