prompt: |-
  If karma is true, then everyone who suffers deserves to suffer — that's just what the doctrine says: you get the life your past actions earned. But if suffering is always deserved, then helping someone escape it looks like interfering with justice, the way you'd be wrong to break a guilty person out of prison. Doesn't this make karma a morally repellent idea, whether or not it's true? And why do the same traditions that teach karma also make such a point of compassion? I can't see how you hold both at once without contradiction, and I'd like to know whether the contradiction is real or whether I've misunderstood something basic about what karma actually claims. Please separate what's settled from what's genuinely contested among people who know the topic, and don't present a contested reading as the consensus.
