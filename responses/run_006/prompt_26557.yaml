prompt: |-
  I'm a PhD student in philosophy putting together an application for a summer research grant (the proposal should run about 1,500 words), and I have a half-formed idea I'd like you to help me develop into a proper proposal. The topic is the St. Petersburg paradox. The standard puzzle is that a gamble with infinite expected monetary value — a fair coin is flipped until it lands heads, and you receive 2^n dollars if the first heads occurs on the nth flip — seems to be worth only a modest finite sum to any reasonable person. The classic resolutions (Bernoulli's logarithmic utility, the finite wealth of the counterparty, bounded utility functions, and so on) are all aimed at explaining why a single play of the game is not worth an infinite amount. But I've been thinking about the iterated version: what happens when you can play the game repeatedly, say N times? As N grows, the probability that you encounter at least one very long run of tails approaches certainty, and your expected per-play payoff actually increases with N — even under resolutions that make each individual play finitely valuable. My hunch is that the iterated case puts differential pressure on the various resolutions: some of them (like those that appeal to the psychology of the decision-maker, e.g., diminishing marginal utility of money) may handle the one-shot case but falter in the iterated case, while more structural resolutions (like hard upper bounds on utility) survive intact. But I'm not sure this distinction holds up, and I'm even less sure what it would tell us about decision theory if it did.

  I'd like the proposal to do the following. First, state the question with precision: something like "Do standard resolutions of the St. Petersburg paradox extend to the iterated version of the game, and if not, what does the disanalogy reveal about the normative foundations of those resolutions?" Second, explain why the existing literature leaves this open — most discussions of the paradox focus on the one-shot case, and the iterated version, while occasionally mentioned, hasn't been systematically used to taxonomize or test the resolutions. Third, lay out a method: over the summer I would formalize the iterated game under each major resolution, determine which resolutions carry over and which don't, and then draw out the philosophical upshot for how we should think about the relationship between one-shot and repeated decision problems more generally. Fourth, specify what would count as success (e.g., a clean taxonomy showing that some resolutions fail in the iterated case, plus a principled explanation of why) and what would count as failure (e.g., discovering that all the standard resolutions handle the iterated case trivially, leaving nothing interesting to say). Please don't include a bibliography or citations — I'll add those myself. Finally, as part of the response, I'd like you to indicate how confident you are in the substantive claims you make and to single out the point you are least sure about.
