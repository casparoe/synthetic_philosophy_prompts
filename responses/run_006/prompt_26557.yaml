  Here’s a structured proposal draft focusing on your core idea, with precision and philosophical stakes highlighted. Confidence annotations (`[Confidence: X%]`) and key uncertainties are noted inline.

  ---

  **Proposal: Iterated St. Petersburg Paradox as a Stress Test for Decision-Theoretic Resolutions**  

  **1. Research Question**  
  Do the canonical resolutions of the St. Petersburg paradox—which reconcile infinite expected monetary value with finite intuitive worth in the *one-shot* game—successfully extend to the *iterated* version of the game? If not, what does the disanalogy reveal about the normative commitments (e.g., psychological vs. structural) underlying these resolutions and the relationship between single and repeated decisions in rational choice theory?  

  **2. Gap in the Literature**  
  The St. Petersburg paradox (1738) has spawned resolutions spanning economics, probability, and philosophy. Bernoulli’s diminishing marginal utility, modern treatments of bounded utility functions, risk aversion, and counterparty wealth constraints are well-trodden. Yet, these almost exclusively target the *single-play* scenario. While the iterated game is occasionally mentioned (e.g., in discussions of the "strong law of large numbers" or "multi-round betting"), it has **not been systematically leveraged to evaluate the robustness of distinct resolutions** `[Confidence: 90%]`. Existing analyses typically treat iteration as a mere complication rather than a tool to probe the *theoretical foundations* of the solutions. This leaves open whether resolutions that "work" for one shot remain normatively compelling when the game is repeated.  

  **3. Core Hypothesis and Significance**  
  My hypothesis is that **iteration differentially challenges resolutions depending on their normative foundations**:  
  - **Psychological/pragmatic resolutions** (e.g., diminishing marginal utility of money, risk aversion) may *fail* under repetition. As *N* grows, the probability of extreme payouts increases, potentially amplifying per-game willingness-to-pay and violating the intuition that the game remains "modestly" valuable.  
  - **Structural resolutions** (e.g., hard bounds on utility, physical/practical limits on payouts) likely *survive* iteration, as their constraints apply regardless of repetition.  
  *Significance*: If confirmed, this would expose a fissure in decision theory—between solutions grounded in contingent human psychology versus those invoking objective limits. This challenges whether one-shot intuitions suffice for normative foundations and forces a reevaluation of how repetition interacts with rationality `[Confidence: 70%]`.  

  **4. Methodology**  
  Over the summer, I will:  
  - **Formalize the iterated St. Petersburg game** for *N* independent trials, defining key metrics:  
    - Expected utility (under different utility functions)  
    - Asymptotic behavior of maximum observed payoff  
    - Probability of ruin (if wealth constraints apply)  
  - **Evaluate canonical resolutions** by modeling their iterated implications:  
    - *Diminishing marginal utility* (Bernoulli): Does the per-game certainty equivalent remain stable as *N* → ∞?  
    - *Bounded utility*: Does the bound preserve finite value regardless of *N*?  
    - *Risk aversion*: Does repeated play mitigate or exacerbate aversion-driven undervaluation?  
    - *Wealth constraints*: How does counterparty solvency interact with correlated extreme payouts across trials?  
  - **Identify failure modes**: For each resolution, determine if iteration generates "explosive" willingness-to-pay, contradicts pre-theoretic intuitions, or violates rationality axioms.  
  - **Philosophical synthesis**: Diagnose *why* failing resolutions falter (e.g., mis-specification of utility dynamics under repetition) and derive implications for decision theory’s treatment of repeated vs. isolated choices.  

  **5. Success Criteria**  
  - **Strong success**: A clear taxonomy distinguishing resolutions that fail under iteration (e.g., certain utility models) from those that succeed (e.g., hard bounds), with a principled explanation (e.g., "solutions relying on local psychological properties are unstable under global aggregation").  
  - **Moderate success**: Partial disanalogies revealing novel tensions within specific resolutions (e.g., risk aversion models behave non-monotonically with *N*), advancing the debate even without a binary taxonomy.  
  - **Failure**: All major resolutions trivially extend to iteration, or distinctions collapse under scrutiny (e.g., structural bounds absorb psychological effects), yielding no new insight `[Confidence: 85% for avoiding this outcome]`.  

  **6. Uncertainty and Challenges**  
  **Least confident point**: Whether *risk aversion* (separate from diminishing utility) robustly fails under iteration. Risk aversion might *persist* due to loss aversion or background uncertainty, blunting the impact of repeated play `[Confidence: 50%]`. This will require careful modeling of time-discounted utility.  
  **Other risks**: Ambiguity in "wealth constraint" resolutions (e.g., is the constraint per-game or aggregate?) may require disambiguation.  

  **7. Expected Outcome**  
  A journal-ready paper demonstrating that the iterated paradox serves as a litmus test for decision theories, revealing that resolutions relying on *subjective* or *empirical* contingencies are less resilient than those invoking *structural* or *logical* constraints. This would advance the philosophy of decision theory by foregrounding repetition as a critical dimension of normative evaluation.  

  ---

  **Key Strengths of This Approach**:  
  - Targets an underexplored angle in a classic problem with interdisciplinary appeal.  
  - Promises a concrete taxonomy with normative implications.  
  - Methodology is formal yet philosophically grounded.  

  **Your Next Steps**:  
  1. Add citations (e.g., Bernoulli, Samuelson, Menger, modern decision theory).  
  2. Specify your preferred resolution taxonomy (e.g., psychological vs. structural).  
  3. Refine the risk-aversion component if it’s central to your hunch.  

  Let me know if you’d like to expand any section (e.g., deeper dive into method)!
