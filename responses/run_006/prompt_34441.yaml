      "Dennett's view on free will is compatibilist: he argues that free will is compatible with determinism and is a real capacity that emerges from complex processes, not an illusion to be discarded.",
      "Dennett's intentional stance: treating systems as rational agents with beliefs and desires is a valuable and ineliminable strategy for prediction and explanation, not a placeholder for future neuroscience."
   ]

