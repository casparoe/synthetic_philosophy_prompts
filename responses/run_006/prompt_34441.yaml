          "correction": "Dennett explicitly rejects greedy reductionism. He argues that consciousness, free will, and meaning arise from mindless processes but are real patterns that require description at their own level. He does not think we will outgrow the intentional stance (beliefs/desires); it remains a crucial and permanent level of explanation."
      },
