prompt: |-
  I've been reading LessWrong and the EA Forum for years, and I've watched the argument between effective altruism and its critics run in place for what now feels like a decade. The critics make a cluster of claims I can predict almost word for word: that EA's focus on individual donation and career choice is a form of technocratic tunnel vision that leaves institutions and distributions of power untouched; that earning to give was always partly a self-serving rationalization for going into finance or tech rather than changing the systems that produce the problems; and that the movement's demand for measurable, quantified impact systematically favors legible interventions such as bed nets and cash transfers over structural change, movement-building, and political work whose effects are real but difficult to put in a cost-effectiveness model. The defenders have stable replies: the marginal dollar really does go further on neglected, tractable, measurable problems; earning to give was a limited claim about comparative advantage rather than a moral endorsement of the career; and explicit expected-value reasoning exists precisely so that hard-to-measure causes, including longtermist ones, can be compared without pretending they are measurable. The FTX collapse sharpened the institutional critique, but I am not convinced the underlying argument moved on either side.

  My working theory is that this is not primarily a first-order moral disagreement. Almost everyone involved agrees that suffering matters and that resources should be used to do the most good. What they seem to disagree about is what the question is and what counts as evidence for an answer. The critics are asking something like how institutions and distributions of power should be changed, and they accept historical and sociological reasoning as evidence. The movement is asking what a particular person should do with the resources and information they actually have, and it tends to treat a claim as action-guiding only if it survives explicit, quantified, decision-relevant analysis. If that is right, both sides could be largely correct and still talk past each other.

  Is that diagnosis correct, or is there a substantive empirical or moral disagreement underneath the talking-past? And given your diagnosis, what would actually count as progress — a conceptual distinction, a reframed question, an empirical result about the tractability of political or structural change, or an honest argument that no progress should be expected and why?
reasoning: |-
  Okay, the user has been engaged with the EA community and its critics for years and feels the debate is stuck. They describe the main critiques: EA's focus on individual actions ignores systemic change, earning to give is self-serving, and quantifiable interventions are favored over hard-to-measure ones. EA defenders counter with arguments about marginal impact, comparative advantage, and expected value calculations. The user suspects the real issue isn't moral disagreement but different questions and evidence standards. They want to know if that's accurate and what progress might look like.

  First, I need to unpack the core of the disagreement. The user highlights that both sides agree on reducing suffering but differ on approach. Critics focus on institutional power dynamics using historical/sociological evidence, while EA emphasizes individual actions guided by quantifiable analysis. This suggests a methodological and epistemological divide rather than a moral one.

  The user's deeper need might be to find a way beyond the stalemate. They might want validation of their analysis and practical steps for progress. They could also be seeking reassurance that systemic change can fit within EA frameworks or a new perspective to reconcile both views.

  Looking at the critiques: systemic change vs. individual action, earning to give as self-rationalization, and quantification bias. EA's responses hinge on marginal effectiveness and expected value. The FTX collapse intensified critiques but didn't resolve the debate. The user's hypothesis about different questions and evidence standards seems plausible. Both sides might be correct within their paradigms but talk past each other.

  Substantive disagreements might exist beneath the surface. For example, differing views on human nature—EA's rational actor model vs. critics' focus on power structures. Or differing risk tolerance: EA avoids unquantifiable risks, while critics accept them for systemic change. Also, implicit moral priorities—immediate vs. long-term impacts, individual vs. collective responsibility.

  To address progress possibilities: conceptual distinctions like separating "doing good" from "changing systems" could help. Reframing questions to focus on leverage points might bridge approaches. Empirical research on systemic interventions' tractability is crucial but challenging. If systemic change isn't tractable, EA's focus might be justified, but critics could argue for moral necessity despite uncertainty.

  The user might need actionable steps: encouraging EA to incorporate power analysis, developing metrics for systemic interventions, or creating spaces for dialogue. Highlighting cases where systemic change was tractable could provide evidence. Also, fostering humility about the limits of quantification and the importance of diverse approaches.

  Ultimately, the user seeks a path forward beyond repetitive debates. Validating their diagnosis while offering concrete avenues for progress could meet their deeper needs. Emphasizing complementary strengths and the necessity of both approaches might resolve the either/or perception, turning it into a both/and collaboration.
answer: |-
  Your diagnosis is remarkably astute. You've pinpointed a fundamental **epistemological and methodological divide** rather than a simple first-order moral disagreement about the goal (reducing suffering/doing good). Both sides largely agree on the *telos* but profoundly disagree on the *demos* – the "how" and the "what counts as evidence" for achieving it.

  **Why Your Diagnosis Largely Holds:**

  1.  **Different Frames of Reference & Agency:**
      *   **EA Frame:** Primarily **individual agency** ("What should *I*, as an individual with specific resources/skills/information, do *now* to maximize expected good?"). It's intensely personal and action-oriented within existing constraints.
      *   **Critic Frame:** Primarily **systemic/institutional agency** ("What changes to structures, power dynamics, institutions, and collective action are needed to solve the root causes of problems?"). It's structural and often requires longer-term, less individually attributable actions.

  2.  **Different Epistemologies (What Counts as Evidence/Reasoning):**
      *   **EA Epistemology:** Favors **quantification, explicit expected value calculations, probabilistic reasoning, and marginal analysis.** Evidence is strongest when it allows for direct comparison of interventions on a common scale (e.g., DALYs/$). This leans towards positivism and rational choice models.
      *   **Critic Epistemology:** Favors **historical analysis, sociological understanding, power mapping, qualitative case studies, and theory-based narratives.** Evidence is often contextual, process-oriented, and emphasizes understanding *why* systems function as they do. It leans towards interpretivism and critical theory.

  3.  **Different Conceptions of "Tractability" and "Neglectedness":**
      *   **EA:** "Tractability" often means demonstrable, measurable, causal links between an intervention and an outcome *within a relatively short feedback loop*. "Neglectedness" is measured by current resource allocation. This inherently favors targeted, direct interventions.
      *   **Critic:** "Tractability" might mean identifying leverage points within complex systems, even if the path is long and uncertain. "Neglectedness" is seen through the lens of *why* powerful interests maintain the status quo – true neglectedness often stems from power imbalances EA doesn't directly challenge. Structural change *is* the tractable path from this view.

  4.  **Different Risk Tolerance & Time Horizons:**
      *   **EA:** Often exhibits **high risk aversion towards unquantifiable interventions** ("What if this activism fails and we wasted resources?"). Focuses heavily on near-term measurable impact or very long-term existential risk (where quantification is paradoxically embraced despite uncertainty due to stakes).
      *   **Critic:** Often exhibits **higher tolerance for uncertainty and risk in pursuit of systemic change**, viewing the failure to challenge harmful structures as the greater risk, even if outcomes are hard to predict. Focuses on medium-to-long-term societal transformation.

  **Substantive Disagreements Underneath the Talking-Past:**

  While your core diagnosis is correct, there *are* substantive disagreements lurking beneath:

  1.  **Implicit Moral Weighting:**
      *   **Critics** often implicitly assign higher moral weight to addressing **injustice, power imbalances, and exploitation** as ends in themselves, not just as means to reduce suffering. EA's focus on aggregate welfare metrics can seem blind to these dimensions.
      *   **EA** often implicitly assigns higher weight to **immediate, preventable suffering or existential catastrophe**, prioritizing identifiable victims over diffuse structural harms. Critics see this as neglecting root causes.

  2.  **Empirical Beliefs about Human Nature and Institutions:**
      *   **Critics** often hold a more **conflict-based view** of social change, seeing power as a zero-sum game requiring confrontation and mobilization against entrenched interests. They may be more pessimistic about achieving significant good *within* existing powerful institutions (finance, tech) without fundamentally changing them.
      *   **EA** often holds a more **cooperative/technocratic view**, believing significant good can be achieved by directing resources (money, talent) efficiently within existing systems, leveraging markets and expertise. They may be more optimistic about influencing powerful institutions from within or directing their outputs charitably.

  3.  **The Efficacy of "Working Within the System":**
      *   This is a core empirical disagreement. **Critics** see EA approaches (earning to give, working in tech/finance for good) as largely **captured by or reinforcing** existing power structures, making meaningful systemic change harder.
      *   **EA** sees these paths as **pragmatic ways to mobilize vast resources** currently controlled by those systems towards tangible good, faster than trying to dismantle/replace the systems.

  4.  **The Burden of Proof:**
      *   **Critics** feel EA demands an impossibly high burden of proof for structural interventions ("Show me the precise, quantified EV before you act").
      *   **EA** feels critics demand too low a burden of proof ("Trust this historical narrative/power analysis as sufficient justification for resource allocation").

  **What Would Count as Progress?**

  Breaking the stalemate requires shifting the conversation beyond its current poles. Here's what progress might look like:

  1.  **Conceptual Distinctions & Reframing:**
      *   **Explicitly Acknowledge the Frames:** Frame discussions as: "Given our shared goal, when is the *individual marginal resource allocation* frame most appropriate, and when does the *systemic transformation* frame demand a different approach?" Recognize both as valid but context-dependent.
      *   **Distinguish "Doing Good" vs. "Changing Systems":** Acknowledge they are different (though overlapping) projects. EA excels at the former within constraints; critics prioritize the latter. Progress comes from asking: "How can resources devoted to *doing good now* also contribute to *changing systems*?" and vice-versa.
      *   **Reframe "Tractability" for Systems:** Develop frameworks for assessing the "tractability" of systemic interventions that don't rely solely on short-term quantification (e.g., identifying clear leverage points, credible theories of change, coalitions of actors, historical analogies, reduced counter-mobilization risk).

  2.  **Empirical Work Bridging the Gap:**
      *   **Case Studies of "Structural EA":** Rigorously document *specific* instances where efforts targeting policy change, movement-building, or power shifts achieved significant, measurable impact. Analyze their resource needs, pathways, and uncertainties in terms comprehensible to EA valuation (even if not perfectly quantifiable). Did funding grassroots organizing for lead pipe replacement yield higher long-term DALY savings than direct medical interventions? How?
      *   **Studying "Earning to Give" Critically:** Research the *actual* long-term effects: Do earners-to-give significantly shift their views/politics? Do they meaningfully challenge harmful practices within their industries *beyond* donating? Does this pathway demonstrably divert talent from direct systemic change work? Is the critique of self-rationalization empirically supported?
      *   **Measuring the "Cost of Quantification":** Attempt to quantify the opportunity cost of *only* funding highly measurable interventions. What potentially high-impact, systemic interventions are starved of resources because they can't meet the evidence bar? Can this be modeled probabilistically?

  3.  **Methodological Innovation:**
      *   **Developing "Qualitative Expected Value":** Create frameworks for incorporating robust qualitative evidence, historical analysis, and power mapping into EV-style reasoning, assigning *ranges* or *qualitative likelihoods* to outcomes of systemic interventions. Acknowledge the uncertainty but make the reasoning explicit and comparable *in kind*, if not precisely in number, to other interventions.
      *   **"Pluralistic Cost-Effectiveness Analysis":** Design analyses that explicitly model different pathways to impact, including systemic ones, even if some branches involve high uncertainty or non-quantifiable factors (e.g., "Path A: Direct Delivery (cost $X, impact Y DALYs). Path B: Advocacy Campaign (cost $Z, estimated probability P of success leading to impact W DALYs, but high uncertainty U).").

  4.  **Honest Arguments & Shifts in Emphasis:**
      *   **EA Acknowledging Limits:** Explicitly acknowledging that the focus on individual marginal resource allocation *is* a limitation of the core EA framework when confronting deeply entrenched power structures requiring collective action and confrontation. This isn't a failure, but a recognition of scope.
      *   **Critics Acknowledging EA's Strengths:** Recognizing that EA *has* demonstrably moved vast resources to highly effective causes, saving lives and reducing suffering on a massive scale, and that its rigor has value. Demanding systemic change shouldn't mean dismissing measurable good done now.
      *   **Focus on Complementarity:** Framing the debate not as "either/or" but as "both/and, strategically deployed." How can resources focused on measurable near-term good *also* build power or create conditions for longer-term systemic change? How can systemic changers leverage rigorous evidence where applicable?

  **Conclusion:**

  Your diagnosis is correct: the core stalemate stems from deep differences in framing, epistemology, and conceptions of agency and evidence, not a fundamental moral split. Progress won't come from one side "winning," but from:

  1.  **Mutual recognition** of the different frames and their valid contexts.
  2.  **Bridging work** – empirical research demonstrating credible pathways for systemic impact and methodological innovations for handling qualitative/systemic evidence within decision frameworks.
  3.  **Reframing** the debate towards strategic **complementarity** rather than opposition.
  4.  **Honest humility** from both sides about the limitations of their preferred approaches in certain domains.

  The most promising path forward is cultivating a space where the rigor of EA's evidence-focus meets the systemic awareness and historical depth of its critics, leading to more nuanced strategies that leverage the strengths of both perspectives. The FTX debacle highlighted risks within EA's model, but breaking the decade-old stalemate requires moving beyond recrimination towards this kind of integrative work.
