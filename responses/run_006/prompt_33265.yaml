  Hmm, the key challenge is designing questions that are concrete yet capture the core epistemic dilemma—like whether learning about the evolutionary origins of moral beliefs should undermine confidence in them. The user emphasized avoiding "do you agree with X?" prompts, so I need root questions about belief-forming processes and truth-tracking. 

  First branch must tackle whether moral facts causally influence beliefs (Q1). If no, it pressures realism; if yes, naturalists like Copp can escape debunking. Second branch (Q2) should test if non-tracking origins are damaging—this isolates where skeptics (Joyce) and anti-skeptics (Vavova) split. Third branch (Q3) probes if moral facts exist independently, separating realism from constructivism. 

  I notice some unoccupied leaves: "No-Yes-Yes" (no causal link, yet origins aren't damaging and facts exist) seems incoherent—why wouldn’t non-tracking origins matter if facts are independent? "Yes-Yes-No" (causal link, origins damage belief, but no independent facts) is odd; if beliefs track facts, why doubt them? These gaps reveal logical tensions the debunking debate exposes. 

  The user also wants residual disagreements flagged—e.g., Street and Joyce both say origins undermine realism but disagree on whether to reject morality (error theory) or redefine it (constructivism). That’s crucial for the handout’s diagnostic clarity. 

  For brevity under 800 words, I’ll compress explanations but ensure leaves name positions + commitments (e.g., "Vavova: Believes evolutionary origins threaten too much—undermine even scientific beliefs"). Unattractive options get quick diagnoses ("unstable compromise"). 

  Finally, since grad students know the literature, I can reference "third-factor" (Enoch) without defining it, but the tree itself must stand alone. Testing with a hypothetical undergrad: if they answer Q1-Q3 honestly, does it point them to the right leaf? Yes—e.g., answering "no" to causal influence and "yes" to damaging origins leads straight to Joyce.
answer: |-
  Here is a concise decision tree mapping the logical space of evolutionary debunking arguments (EDAs), built from core epistemic questions:

  **Decision Tree: Evolutionary Debunking of Morality**

  1.  **Q1: Causal Independence?** If moral facts exist, *could* they have played a causal role in shaping our core moral beliefs via evolution? (Not: *did* they, but *could* they have?)
      *   **Yes → Go to Q2**
      *   **No → Go to Q3**

  2.  **Q2: Epistemic Threat?** Does learning that evolution shaped our core moral beliefs via selective pressures *independent* of the truth of those beliefs (e.g., promoting cooperation/survival) give you a strong reason to doubt those beliefs?
      *   **Yes → Joyce's Error-Theoretic Moral Skepticism:** Moral facts don't exist; our moral beliefs are systematically false. (Commits: Denying objective moral truth due to non-tracking origins).
      *   **No → Vavova's "Debunking Proves Too Much":** If EDAs undermine moral beliefs, they equally undermine too many uncontroversial beliefs (e.g., perceptual, mathematical). (Commits: Rejecting the epistemic principle driving EDAs as overinclusive).

  3.  **Q3: Independent Moral Facts?** Do moral facts exist independently of our evaluative attitudes (e.g., desires, dispositions, evolutionary history)?
      *   **Yes → Enoch's "Third-Factor" Realism:** A single factor (e.g., survival value) explains both why we believe *and* why the independent moral facts hold (e.g., survival is good). (Commits: Affirming objective moral facts and a non-accidental link explaining belief/fact correlation).
      *   **No → Street's Humean Constructivism:** Moral facts are constituted by our own (evolved) evaluative attitudes; truth is stance-dependent. (Commits: Denying mind-independent moral facts; truth depends on our contingent, evolved standpoint).

  **Residual Branch from Q1 Answer "Yes":**

  *   **Branch from Q1 "Yes" → Copp's Naturalist Realist Response:** Moral facts (e.g., "X is morally required" = "X satisfies society's code given needs/desires") *could* causally influence belief via their natural constituents (needs/desires) shaping evolution. (Commits: Affirming objective, naturalistically definable moral facts potentially trackable by evolution). *(Note: Copp occupies the "Yes" branch of Q1, bypassing Q2/Q3 by offering a specific naturalist account where facts* could *cause belief).*

  **Residual Disagreement Note:**
  *   **Street vs. Joyce:** Both answer Q1 "No" and Q2 "Yes", agreeing EDAs undermine realist belief-justification. They disagree on Q3: Joyce (Yes) concludes facts don't exist; Street (No) concludes facts are attitude-dependent.

  **Unoccupied Leaves & Diagnoses:**

  1.  **Q1: No, Q2: No, Q3: Yes:** (Facts independent, no causal role possible, yet origins *not* damaging). *Diagnosis:* Unstable - Grants core debunker premise (no causal link) but denies epistemic threat without clear justification for the correlation.
  2.  **Q1: Yes, Q2: Yes, Q3: No:** (Facts *could* cause belief, origins *are* damaging, yet facts are stance-dependent). *Diagnosis:* Coherent but unattractive - Combines constructivism with conceding strong epistemic defeat to realism, offering little advantage over error theory or standard constructivism.
  3.  **Q1: Yes, Q2: Yes, Q3: Yes:** (Facts *could* cause belief, origins *are* damaging, facts independent). *Diagnosis:* Epistemically pessimistic - Affirms realism but accepts evolutionary origins create insurmountable doubt; rarely defended due to self-defeat.

  **Tree Summary:**

  ```
                                Q1: Causal Independence? (Could facts cause belief?)
                               /                                              \
                            Yes (Copp: Naturalist Realism)                    No
                                                                               |
                                                                            Q2: Epistemic Threat? (Do non-tracking origins damage belief?)
                                                                           /                     \
                                                                        Yes                     No (Vavova: Proves Too Much)
                                                                          |                       
                                                                       Q3: Independent Moral Facts?
                                                                      /                           \
                                                                   Yes (Enoch: Third-Factor)      No (Street: Constructivism + Joyce: Error Theory*)
                                                                                                  (*Joyce answers Q3 Yes, Street No)
  ```
