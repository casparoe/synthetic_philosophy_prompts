  ### Decision Tree on the Causal Exclusion Problem  
  *(Start by accepting that mental events cause physical events, e.g., your decision causes your arm to move.)*  

  1. **Q1: Do you accept that every physical event (like arm movement) has a sufficient physical cause?**  
     - *Yes* → Go to Q2.  
     - *No* → Go to Q3.  

  2. **Q2: Do you believe mental events are entirely distinct (separate substances/properties) from physical events?**  
     - *Yes* → Go to Q4.  
     - *No* → Go to Q5.  

  3. **Q3: Do you believe mental events are entirely distinct (separate substances/properties) from physical events?**  
     - *Yes* → **Leaf 3: Interactionist dualism**  
       Mental events are distinct but cause physical events by interacting with them, rejecting physical causal closure.  
     - *No* → **Leaf 8: Unoccupied combination**  
       Non-reductive physicalism that denies closure is unexplored/unattractive (closure denial undercuts the exclusion problem).  

  4. **Q4: Do you accept that physical events can systematically have more than one sufficient cause (e.g., like two bullets independently causing death)?**  
     - *Yes* → **Leaf 4: Systematic overdetermination**  
       Mental events cause physical events, but these are systematically overdetermined by distinct mental and physical causes.  
     - *No* → **Leaf 2: Epiphenomenalism**  
       Mental events do not cause physical events; they are byproducts with no causal power (due to closure and no overdetermination).  

  5. **Q5: Are mental events identical to physical events (e.g., pain just *is* C-fibers firing)?**  
     - *Yes* → **Leaf 1: Identity theory (reductive physicalism)**  
       Mental events cause physical events because they are identical to physical causes, avoiding overdetermination.  
     - *No* → Go to Q6.  

  6. **Q6: Do you think mental causation requires counterfactual dependence (e.g., the arm wouldn’t move if not for the mental cause)?**  
     - *Yes* → **Leaf 6: Counterfactual dependence response**  
       Mental events cause physical events by making them counterfactually dependent, without overdetermination.  
     - *No* → **Leaf 7: Interventionist response**  
       Mental events cause physical events when interventions on the mental state change the outcome, avoiding overdetermination.  

  7. **Leaf 5: Constitution view**  
     Mental events cause physical events by being constituted by physical events (like a statue’s causation via its clay), not as an additional cause.  
     *(Reached if you answer: Q1=Yes, Q2=No, Q5=No, and any answer to Q6—see notes below).*  

  ---  
  **Notes on Unoccupied Combinations & Inseparable Pairs:**  
  - **Unoccupied combination (Leaf 8)**: Closure denied + distinctness denied (Q1=No, Q2/Q3=No). Unexplored/unattractive, as non-reductive views typically accept closure.  
  - **Unoccupied combination**: Closure accepted + distinctness denied + overdetermination accepted (not in tree). Incoherent—non-distinct mental events can’t be an "additional" cause for overdetermination.  
  - **Inseparable pairs**:  
    - *Constitution view (Leaf 5) vs. Other non-reductive views (Leaves 6–7)*: The tree cannot reliably distinguish these, as they share commitments (closure, non-identity, no overdetermination). Constitution emphasizes part-whole dependence; counterfactual/interventionist focus on causal relations.  
    - *Counterfactual (Leaf 6) and interventionist (Leaf 7) responses*: Often overlap (interventionism uses counterfactuals), but Leaf 7 requires a "manipulation" test for causation.
