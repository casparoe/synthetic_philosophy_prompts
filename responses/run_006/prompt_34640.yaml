  Here's what I need.

  A Bongard problem, for readers unfamiliar with the term, consists of two panels: a left panel with six figures that all exemplify some rule, and a right panel with six figures that do not. The solver's task is to induce the rule. The philosophical puzzle is that any finite set of positive and negative examples underdetermines the rule: infinitely many rules are consistent with the data, yet human solvers reliably converge on one — or at least on a narrow range. The question is what guides that convergence.

  Your task: construct a Bongard-style scenario (described in words, since I need it for a text-based article) that meets the following specifications.

  Specifications:

  (1) The scenario should use twelve ordinary items — six positive, six negative — that a reader can easily visualize. No abstract symbols, no geometric primitives. Everyday objects, situations, or living things.

  (2) There should be two rival rules, R1 and R2, both of which correctly classify all twelve items. R1 should be a classical definitional rule (individually necessary and jointly sufficient conditions). R2 should be a prototype-based or family-resemblance rule (a central tendency, a graded membership criterion, or a Wittgensteinian strand of similarities). Both rules must be simple and natural: neither may feel gerrymandered, ad hoc, or cooked up after the fact to make the thought experiment work.

  (3) Introduce a thirteenth item — a borderline case. R1 and R2 must classify it in opposite ways. The borderline case must be one that an ordinary person would find genuinely puzzling; it should not be obvious which rule is "correct." The divergence must arise from the structural difference between the two kinds of rule, not from a trick.

  (4) Walk through the reasoning:
