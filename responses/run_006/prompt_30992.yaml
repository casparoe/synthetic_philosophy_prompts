prompt: |-
  I'm a program officer at a mid-size foundation, and I keep getting proposals where the whole pitch is "there's a tiny chance this does an absolutely enormous amount of good." Some of them are AI-safety or biosecurity projects with claimed probabilities like 0.01% of averting a catastrophe, and some are stranger long-shot bets. The trouble is that if I just multiply probability times claimed impact, these proposals dominate everything else in our portfolio, and I cant tell the serious ones from the Pascal's muggings. I need a reusable decision procedure I can run on any proposal where the headline expected value depends on a tiny probability of a huge outcome — a checklist in words, with the questions in order, what counts as a good enough answer at each step, where the procedure stops with a no, and where it hands the decision back to me becuase the remaining question is one of values rather than arithmetic.

  I'm especially worried that any finite grant can be made to look good by a small enough probability of a big enough payoff, so the procedure should say when to stop redoing the expected-value math and just cap or reject on principle, and also when that would be a mistake.

  A bit of context so the procedure is actually usable: I see a couple of these a month, grants run from about $50k to $2m, I have maybe 90 minutes per proposal, I'm not a statistician, and our board has to sign off on anything I recommend. So write this for a grant officer, not for a seminar.

  Please act as an expert in decision theory under uncertainty who has spent time inside foundations. Before you write the final procedure, spend some time brainstorming the hard cases and the places where the procedure is most likely to break, then give me the finished procedure. Then run it on two or three worked examples: (1) a proposal claiming a 0.01% chance of meaningfully reducing existential risk from AI for a $500k grant, (2) a $200k grant to a local food bank with boring but very reliable benefits, and (3) a proposal claiming something like a one-in-a-billion chance of preventing an astronomically large amount of future suffering. Make sure at least one of the worked examples ends in a conclusion I'm not going to like, and be explicit about where the procedure will misfire or simply can't settle the question.
reasoning: |-
  We are designing a decision procedure for grant proposals that claim a tiny probability of an enormous payoff. The core challenge is avoiding being "Pascal-mugged" by proposals that exploit the mathematical property that any finite grant can be justified by a sufficiently tiny probability of a sufficiently huge payoff. We need a structured way to evaluate such claims without getting lost in the arithmetic.

  Brainstorming the hard cases and potential pitfalls:

  1. **Probability Estimation**: How do we assess the credibility of a tiny probability claim? It's easy to say "0.01% chance" but hard to ground that number in evidence. The procedure must demand evidence and reasoning for the probability, and it must be able to reject claims that are arbitrary or unfounded.

  2. **Impact Estimation**: Similarly, the claimed impact (e.g., "avert an existential catastrophe") is often speculative. We need a way to evaluate the plausibility of the impact and the causal chain from the grant to that impact.

  3. **Independence and Uniqueness**: Is this the only project that could achieve this? If there are many similar projects, the marginal contribution of this grant might be negligible.

  4. **Counterfactuals**: What would happen without the grant? If the project would happen anyway, or if the risk would be addressed by others, then the grant's marginal impact is low.

  5. **Time Discounting**: If the impact is in the far future, we might discount it. How do we handle that?

  6. **Value Disagreements**: Some impacts (e.g., reducing suffering in the far future) involve deep value judgments. The procedure should hand these back to the program officer when they are central.

  7. **Robustness to Uncertainty**: We need to avoid over-reliance on precise numbers when the underlying estimates are highly uncertain.

  8. **Opportunity Cost**: The grant could be used for other, more certain good. We need to compare the expected value of the long-shot to the next best alternative.

  9. **Risk of Harm**: Some projects might have a chance of huge harm. How do we account for that?

  10. **Reputation and Precedents**: Funding a project that is later seen as ridiculous could harm the foundation's reputation and ability to do good. Also, setting a precedent might lead to many similar proposals.

  The procedure must be practical for a non-statistician with limited time. It should have clear exit points for rejection and points where the decision is handed back because it's about values.

  ---

  **Decision Procedure: Evaluating Tiny-Probability, Huge-Impact Proposals**

  **Step 0: Pre-Filter for Basic Grant Requirements**
  - Check that the proposal meets the foundation's mission, legal requirements, and basic due diligence (e.g., organization legitimacy, no red flags). If not, reject.
  - If the proposal does not claim a tiny probability of a huge impact, use the foundation's standard evaluation process. Otherwise, proceed.

  **Step 1: Demand Explicit Probability and Impact Estimates**
  - Ask: Has the proposal provided explicit, quantitative estimates of the probability of success and the magnitude of the impact?
    - If not, request clarification or reject if the information is not provided and cannot be reasonably inferred.
    - If yes, note the numbers and proceed.
  - **Good enough**: The proposal must state a probability (p) and an impact (I) in measurable terms (e.g., lives saved, DALYs, or a clear description of the catastrophe averted). The impact should be quantified, even if in a range.

  **Step 2: Scrutinize the Probability Claim**
  - Ask: What is the basis for the probability estimate? Is it grounded in data, models, expert consensus, or at least a clear chain of reasoning?
    - **Check for arbitrariness**: If the probability is pulled from thin air (e.g., "we think it's 0.01% because it sounds right"), flag as unreliable.
    - **Check for calibration**: Does the proposer have a track record of making calibrated predictions? If not, treat the estimate with skepticism.
    - **Check for outside view**: How often do similar interventions succeed? What is the base rate?
    - **Check for overconfidence**: Tiny probabilities are hard to estimate. Is the estimate robust to uncertainty? (If the proposer provides a range, that's better than a point estimate.)
  - **Exit to rejection**: If the probability estimate lacks any credible basis and cannot be defended in a follow-up (within your time limits), reject.
  - **Hand back**: If the probability is highly uncertain but the proposer has provided a reasonable lower bound, you might proceed with that bound. But if the uncertainty is too great (e.g., spanning orders of magnitude) and the rest of the case is weak, reject.

  **Step 3: Scrutinize the Impact Claim**
  - Ask: What is the basis for the impact estimate? Is the causal chain from the grant to the impact clear and plausible?
    - **Check for directness**: How many steps are there? Each step should be supported by evidence or strong reasoning.
    - **Check for counterfactuals**: Would the impact happen without this grant? (E.g., if others are working on the same problem, the marginal impact might be small.)
    - **Check for diminishing returns**: If the grant is part of a larger effort, the marginal impact might be non-linear (e.g., the first dollar might be more effective than the last).
    - **Check for unintended consequences**: Could the project cause harm? (If so, factor that into the expected value.)
  - **Exit to rejection**: If the impact claim is based on an implausible chain of events (e.g., requires a series of independent low-probability steps), reject.
  - **Hand back**: If the impact is in the far future and involves value judgments (e.g., how much we value future generations), note that and proceed to Step 6.

  **Step 4: Calculate Expected Value and Compare to Cost**
  - Calculate the expected value (EV) of the grant: EV = p * I.
  - Calculate the cost-effectiveness: EV / grant size.
  - **But note**: If the grant is part of a larger project, adjust for the project's overall chance of success and the proportion attributable to the grant. The marginal expected value might be: (p_with_grant - p_without_grant) * I.
  - **Compare** to the foundation's bar for cost-effectiveness (if known) and to the next best alternative use of the funds.
  - **Exit to rejection**: If the cost-effectiveness is lower than the foundation's bar (or than a clear alternative), reject.
  - **Proceed**: If the expected value is positive and the cost-effectiveness is high, go to Step 5.

  **Step 5: Cap the Grant Size and Consider Non-Quantitative Factors**
  - **Cap the grant**: Because of the risk of Pascal's mugging, do not fund the full amount if the probability is below a threshold (e.g., 1 in 10,000) without additional safeguards. Consider:
    - Funding a smaller amount for a pilot or proof of concept.
    - Setting a maximum grant size for such projects (e.g., no more than $X for projects with p < Y%).
  - **Non-quantitative factors**:
    - **Reputation risk**: Would funding this project make the foundation a target for ridicule or criticism? (If so, it might harm future effectiveness.)
    - **Learning value**: Even if the project fails, might it generate useful knowledge?
    - **Option value**: Does it open up future opportunities?
    - **Diversification**: Does the foundation's portfolio already have too many long-shots?
  - **Exit to rejection**: If the non-quantitative risks (like reputation harm) are too high, reject.
  - **Hand back**: If the expected value is astronomical but the probability is extremely tiny and the basis is weak, you might still reject on principle (see Step 6).

  **Step 6: Apply the "Tiny Probability Cutoff" (The Principle of Insufficient Reason)**
  - This step is a safeguard against pure Pascal's mugging. Reject proposals that meet both:
    (a) The probability is below a pre-specified threshold (e.g., 1 in 1,000,000) AND 
    (b) The proposer cannot provide a compelling, evidence-based case that the probability is not arbitrarily small (e.g., they cannot provide a lower bound that is above the threshold).
  - **Rationale**: We cannot assign a non-arbitrary probability to events that are so speculative that they are beyond our ability to reason. We set a cutoff to avoid being exploited by arbitrarily small probabilities.
  - **Hand back**: If the proposal passes Step 6, then the decision is about values. For example, if the impact is reducing suffering in the far future and the foundation has not taken a stance on how much to value that, you must make a judgment call. Similarly, if the impact is controversial (e.g., altering the course of humanity), then it's a matter of values. In that case, document the reasons and present to the board.

  **Step 7: Final Check and Board Presentation**
  - If the proposal passes all steps, document:
    - The expected value calculation (with ranges if available).
    - The key uncertainties and why you believe the project is still worth funding.
    - The non-quantitative factors considered.
    - How this grant compares to alternatives.
  - Prepare a summary for the board that highlights the risks and the rationale for funding.

  ---

  **Worked Examples**

  **Example 1: AI Safety Proposal**
  - Proposal: $500k grant for an AI safety project. Claim: 0.01% chance of reducing existential risk from AI, which they say would save 1e12 future lives (a trillion lives). Expected value: 0.0001 * 1e12 = 100 million lives saved, or 200 lives saved per dollar.
  - **Step 0**: Assume it passes basic checks.
  - **Step 1**: They provide explicit numbers: p=0.0001, I=1e12 lives. Proceed.
  - **Step 2**: Basis for p? They cite a survey of AI experts saying there's a 10% chance of an AI catastrophe in the next 100 years, but they claim their project reduces that risk by 0.1% (so 10% * 0.1% = 0.01%). 
    - Scrutiny: The 10% is a point estimate from a survey (which might be contested). The 0.1% reduction is based on their model of how their intervention affects the risk. Is that model validated? They have no track record. 
    - Outside view: Many AI safety projects exist. How many have demonstrated risk reduction? None so far. 
    - Verdict: The probability estimate is weak but not arbitrary. Use a lower bound? Maybe they admit the reduction could be as low as 0.01%. Then p_min = 10% * 0.01% = 0.00001 (0.001%). Proceed with that.
  - **Step 3**: Impact is 1e12 lives. Basis? They assume a future with many digital lives. Causal chain: Grant -> research -> better AI alignment -> reduced risk. 
    - Counterfactuals: Others are working on AI safety. If their project is not done, will someone else do it? They claim their approach is unique. 
    - Verdict: The impact number is highly speculative (how do we value digital lives?) and the causal chain is long. But reducing existential risk is a standard cause area. 
  - **Step 4**: EV_min = 0.00001 * 1e12 = 10 million lives. Cost-effectiveness: 10e6 lives / $500k = 20 lives per dollar. Still high. Compare to a typical grant: e.g., a global health grant might save a life for $5,000 (so $500k saves 100 lives). This is 200x better (20 lives/$ vs 0.0002 lives/$). But note: the lives saved are in the far future. If we discount at 1% per year, 1 life in 100 years is worth about 0.37 lives today. Then the EV_min becomes 3.7 million lives, still 7.4 lives per dollar (which is 37,000x better than the global health grant). This seems too good to be true.
  - **Step 5**: Cap the grant? The probability (0.001% to 0.01%) is below 0.01%, which is 1 in 10,000. So we cap. Maybe fund a smaller amount? Also, reputation risk: AI safety is a recognized field, so less reputation risk. Learning value: high. Option value: high. 
  - **Step 6**: The probability (even the lower bound) is 0.001% (1 in 100,000), which is above our arbitrary cutoff threshold (say 1 in 1,000,000). So we don't reject on principle.
  - **Conclusion**: The proposal passes. But because of the uncertainty, we might fund a smaller amount (e.g., $100k) and require milestones. We document the uncertainties for the board.

  **Example 2: Local Food Bank**
  - Proposal: $200k for a local food bank. Claim: Will provide 500,000 meals. Each meal is valued at $3 (but they don't claim a huge impact). Expected value is straightforward.
  - **Step 0**: Passes.
  - **Step 1**: They don't claim a tiny probability of huge impact. They claim a near-certain outcome (they have done this before). So we use the foundation's standard process. 
  - **Standard process**: Calculate cost per meal: $200k / 500,000 = $0.40 per meal. Compare to other food banks (typically $0.30-$0.50). It's reasonable. Impact is immediate and certain. 
  - **Conclusion**: Fund if within mission and budget.

  **Example 3: One-in-a-Billion Chance of Preventing Astronomical Suffering**
  - Proposal: $1 million grant for a project that claims a one-in-a-billion chance of preventing an astronomical amount of suffering (e.g., 1e30 beings from suffering for millions of years). Expected value: (1e-9) * (1e30) = 1e21 units of suffering averted. Per dollar: 1e15.
  - **Step 0**: Passes basic checks.
  - **Step 1**: Explicit numbers: p=1e-9, I=1e30. Proceed.
  - **Step 2**: Basis for p? They say it's a wild guess because the domain is so speculative (e.g., preventing a multiverse-level catastrophe). They have no model, no data. 
    - Verdict: Arbitrary. They cannot provide a lower bound that is non-arbitrary. 
  - **Exit to rejection**: Reject at Step 2 because the probability claim is arbitrary and unfounded.

  **But what if they provide a reasoning?** Suppose they argue: "Our project might inspire a future movement that, with one-in-a-billion luck, prevents a cosmic catastrophe." 
  - **Step 2 (revisited)**: The chain of reasoning is extremely long and speculative. Without any grounding, we cannot assign a non-arbitrary probability. We set a lower bound? They say it could be as low as 1e-20, but that's still arbitrary. 
  - **Step 6**: The claimed probability (1e-9) is below our threshold (say 1e-6). They cannot provide a non-arbitrary lower bound above the threshold. So we reject on principle. 
  - **Conclusion**: Reject. This is a classic Pascal's mugging.

  **Example 4: A Proposal You Won't Like (Rejection of a Plausible Long-Shot)**
  - Proposal: $2m grant for a biosecurity project. Claim: 0.001% chance of preventing a pandemic that would kill 100 million people. Expected value: 0.00001 * 100e6 = 1,000 lives saved. Cost per life: $2m / 1000 = $2,000 per life. 
  - **Step 0**: Passes.
  - **Step 1**: Explicit: p=0.00001, I=100e6 lives. 
  - **Step 2**: Basis for p? They cite a model of pandemic risk and their intervention's effect. But the model is unvalidated. Outside view: Most such interventions fail. We might adjust p down to 0.000001 (one in a million). 
  - **Step 3**: Impact: 100 million lives. But without this project, would the pandemic happen? And would others prevent it? They claim their project is unique and timely. 
  - **Step 4**: EV_min = 0.000001 * 100e6 = 100 lives. Cost per life: $2m/100 = $20,000. 
  - Compare to a global health grant that saves a life for $5,000. This is 4x worse. 
  - **Exit to rejection**: Because the cost-effectiveness is worse than the next best alternative. 
  - **Conclusion**: Reject. The expected value calculation, even with the proposer's numbers, is not competitive.

  **Where the Procedure Can Misfire**
  - **Underestimating the probability of huge impacts**: The procedure might reject a truly important project because the probability is hard to estimate. We try to mitigate by using lower bounds and requiring reasoning.
  - **Overly conservative**: The tiny probability cutoff might reject a project that could have been the next penicillin. But we accept this risk because the alternative is being exploited by arbitrary claims.
  - **Value judgments**: The procedure might hand back a decision where the foundation has to take a stand on controversial values (e.g., how much to value future lives). This is by design.

  **Final Notes**: This procedure is a starting point. Adjust the thresholds (e.g., the probability cutoff) to your foundation's risk tolerance. Document every step to build institutional knowledge and for board review.
answer: |-
  ### Decision Procedure for Tiny-Probability, Huge-Impact Proposals  
  **Goal**: Filter out "Pascal's muggings" while preserving legitimate long-shot opportunities. Focus on credibility, robustness, and values. Use this as a checklist in order—stop and reject if any step fails. Allocate your 90 minutes as: Steps 1–2 (30 min), Steps 3–4 (40 min), Steps 5–7 (20 min).  

  ---

  #### **Step 1: Demand Probability & Impact Breakdown**  
  **Question**: *Does the proposal decompose its probability (\(p\)) and impact (\(I\)) into testable assumptions?*  
  **Good enough**:  
  - \(p\) is split into ≥2 sub-components (e.g., "probability the threat is real" × "probability our solution works").  
  - \(I\) is quantified in concrete units (e.g., lives saved, DALYs averted) without vague terms like "civilization collapse."  
  - Estimates cite sources (data, expert surveys, models).  
  **Stop/reject if**:  
  - \(p\) or \(I\) is a single arbitrary number (e.g., "0.01% because it feels right").  
  - Impact relies on chain reactions >3 steps (e.g., "our app educates kids → starts a movement → changes policy → prevents war").  
  **Hand back if**: Impact units involve contested values (e.g., "preventing digital minds from suffering").  

  #### **Step 2: Stress-Test Probability Anchors**  
  **Question**: *Is there empirical or consensus evidence for the probability’s lower bound?*  
  **Good enough**:  
  - \(p\) is compared to historical baselines (e.g., "AI misuse incidents/year" for biorisk).  
  - Proposer provides a defensible *worst-case* \(p\) (e.g., "even skeptics agree it’s >1 in 10 million").  
  **Stop/reject if**:  
  - \(p\) is lower than observed frequencies of similar events (e.g., claiming \(p = 10^{-9}\) for an event that happens annually).  
  - Probability hinges on unfalsifiable claims (e.g., "if our theory of consciousness is right...").  
  **Hand back if**: Evidence is spotty but from credible experts (e.g., a Nobel laureate’s novel climate intervention).  

  #### **Step 3: Check for Neglected Negatives & Alternatives**  
  **Question**: *Could the grant cause harm? Is this the best of 3+ approaches?*  
  **Good enough**:  
  - Proposer discusses risks (e.g., "our AI tool could be weaponized").  
  - They compare their approach to 2+ alternatives (e.g., "Funding us is 100× more efficient than Policy X").  
  **Stop/reject if**:  
  - Harm risk >10% of claimed \(I\) (e.g., a biosecurity project with dual-use potential).  
  - No consideration of existing solutions (e.g., ignoring that OpenAI/WHO already works on this).  
  **Hand back if**: Trade-offs are values-based (e.g., "prioritize current vs. future lives").  

  #### **Step 4: Cap Grants Using the "Uncertainty Budget"**  
  **Question**: *Does the grant size exceed 0.1% of the foundation’s annual budget?*  
  **Principle**: Tiny \(p\) proposals get capped to limit exploitation. Never fund 100% of their ask if \(p < 0.1\%\).  
  **Rules**:  
  - If \(p < 10^{-6}\) (1 in a million), max grant = $50k.  
  - If \(10^{-6} ≤ p < 10^{-3}\), max grant = $500k.  
  - Only fund >$500k if \(p ≥ 1\%\) **or** impact is near-term (≤10 years).  
  **Stop/reject if**: Request exceeds cap and proposer won’t downsize.  
  **Hand back if**: Impact is urgent and irreversible (e.g., asteroid deflection).  

  #### **Step 5: Run the "Worth a Shot?" Test**  
  **Question**: *Ignoring \(p × I\), would we fund this as a pilot grant?*  
  **Good enough**:  
  - Project generates knowledge (e.g., publishes data even if it fails).  
  - Team has domain expertise (not amateurs).  
  - Costs are mostly salaries/equipment (not overhead).  
  **Stop/reject if**:  
  - No learning value (e.g., "we’ll know if it worked in 200 years").  
  - Foundation reputation at risk (e.g., funding fringe science).  

  #### **Step 6: Compare to the "Boring Baseline"**  
  **Question**: *How does cost-effectiveness (\(p×I/$\)) compare to a reliable grant (e.g., bednets)?*  
  **Good enough**:  
  - Compute \(EV_{\text{long-shot}} = p × I / \text{cost}\) and \(EV_{\text{baseline}}\) (e.g., $5k/life saved for malaria prevention).  
  - Long-shot EV must be >10× baseline EV to justify risk.  
  **Stop/reject if**:  
  - \(EV_{\text{long-shot}} < EV_{\text{baseline}}\) after using lower-bound \(p\).  
  - Baseline uses conservative impact (e.g., WHO data).  

  #### **Step 7: The "Sanity Check" for Values**  
  **Question**: *Would we regret funding this if \(p = 0\)?*  
  **Good enough**:  
  - If yes, does it advance core values? (e.g., "even a failed AI ethics effort signals priorities").  
  - Board approval likelihood ≥70% (use your judgment).  
  **Stop/reject if**:  
  - Values misalign (e.g., reducing animal suffering when foundation focuses on humans).  
  **Hand back if**: The proposal survives but requires board debate (e.g., controversial cause area).  

  ---

  ### Worked Examples  
  **Example 1: AI Safety Proposal**  
  - **Claim**: 0.01% chance (\(p = 10^{-4}\)) of reducing AI x-risk. Impact = 10^12 future lives saved. Grant = $500k.  
  - **Step 1**: \(p\) decomposed into "p(alignment problem is real) × p(our technique helps)." Impact in lives. ✓  
  - **Step 2**: \(p\) anchored to AI expert surveys (e.g., 5–10% x-risk by 2100). Lower bound \(p > 10^{-5}\). ✓  
  - **Step 3**: Negatives discussed (e.g., AI acceleration risk). Alternative: "Governments are underfunding this." ✗ (No direct comparison to alternatives.)  
  - **Step 4**: \(p < 10^{-3}\), so cap at $500k. Ask = $500k → allowed. ✓  
  - **Step 5**: Team has ML researchers; publishes tools. ✓  
  - **Step 6**: \(EV_{\text{long-shot}} = (10^{-4} × 10^{12}) / 5×10^5 = 200\) lives/$. Baseline (e.g., bednets): 0.2 lives/$. 1000× better → ✓  
  - **Step 7**: Regret minimal (signals leadership). Likely board-approved.  
  - **Verdict**: **Fund $500k**. High EV, credible anchors.  

  **Example 2: Local Food Bank**  
  - **Claim**: 95% chance of serving 500K meals. Grant = $200k.  
  - **Step 1**: No tiny \(p\) or huge \(I\) → **exit to standard process**.  
  - **Standard**: Cost/meal = $0.40 (competitive). Track record proven.  
  - **Verdict**: **Fund $200k**. Not a long-shot.  

  **Example 3: One-in-a-Billion Suffering Prevention**  
  - **Claim**: \(p = 10^{-9}\) chance of preventing 10^30 units of suffering. Grant = $1M.  
  - **Step 1**: \(p\) = "p(our theory is correct) × p(we shift policy)." Impact speculative ("suffering units"). ✗  
  - **Step 2**: No anchors. Proposer: "No data—it’s unprecedented." Lower bound arbitrary.  
  - **Stop/reject**: Fails Step 2. **Verdict: Reject.** Pure Pascal’s mugging.  
  - **But you might not like this**: If suffering units include animals/future beings, a values-driven board might fund it. **Hand back** after Step 1 for values debate.  

  **Example 4: [Unpleasant Conclusion] Nanotech Risk Proposal**  
  - **Claim**: 0.001% chance (\(p = 10^{-5}\)) of preventing a nanotech disaster (impact = 1B lives). Grant = $2M.  
  - **Step 1**: \(p\) decomposed. Impact in lives. ✓  
  - **Step 2**: Anchors weak (one unpublished model). Lower bound \(p ≈ 10^{-7}\). ✓ (barely)  
  - **Step 3**: No harm risk. But alternative: "DOD funds similar research." ✗ (No efficiency comparison.)  
  - **Step 4**: \(p < 10^{-3}\), so max grant = $500k. Ask = $2M → **reject unless downsized**.  
  - **Step 5**: Team is qualified. Learning value high. ✓  
  - **Step 6**: \(EV_{\text{long-shot}} = (10^{-7} × 10^9) / 2×10^6 = 0.05\) lives/$. Baseline: 0.2 lives/$ → **worse than boring**.  
  - **Verdict: Reject.** EV too low even with lower-bound \(p\), and ask exceeds cap.  
  - **Why you’ll dislike this**: Team is elite, and impact is pressing. But EV fails Step 6, and alternatives exist.  

  ---

  ### Where the Procedure Misfires  
  1. **Legitimate black swans**: A true "unknowable" risk (e.g., a novel pandemic) might be rejected in Step 2. Mitigation: In crises, allow expert testimonials as anchors.  
  2. **Values disputes**: E.g., if the board prioritizes future lives, a rejected proposal (like Example 3) could be hand-picked. Use Step 7 to escalate.  
  3. **High-risk, high-reward innovation**: Early-stage projects (e.g., mRNA vaccines in 2010) might fail Step 4. Solution: Cap grants but allow renewals after milestones.  

  **Final Tip**: For board buy-in, document each step in a 1-pager. Rejections save time; hand-backs enable values debates. Update caps annually based on portfolio balance.
