  I'm putting together a one-semester term-paper proposal and want the paper to make actual progress on a problem rather than rehearse a familiar debate. The idea I keep returning to is about graded moral status: the claim that moral considerability runs continuously from a thermostat, through insects, up to humans. In the discussions I follow, the disagreement between people who treat insect suffering as a moral emergency and people who think insects are too simple to count seems to me to rest on running together at least three different questions — how likely a system is to be sentient at all, how much welfare it has conditional on being sentient, and whether there is a unified subject for whom things can go well or badly. The usual move of multiplying a probability of sentience by a welfare range papers over this, and at the thermostat end the whole thing starts to look like a Pascal's-mugging problem in which the choice of prior does all the work. My suspicion is that separating these axes would dissolve several of the standard arguments and force everyone to say what they actually mean when they claim a honeybee matters more than a thermostat. Write the proposal: a precise statement of the question; why the existing positions leave it open; the approach I would take and why that approach rather than the obvious alternatives; what a result would look like and what would count as failure; and an honest sense of what can be accomplished in one semester. No citations or bibliography — I'll fill those in myself.
