answer: |-
  ## Term Paper Proposal: Disentangling the Axes of Graded Moral Status

  **1. Precise Question:**  
  Can systematically decoupling three distinct dimensions underlying attributions of graded moral status—(a) *probability of minimal sentience*, (b) *conditional welfare capacity* (given sentience), and (c) *unified subjecthood*—resolve persistent stalemates in debates about entities like insects, and clarify the basis for rejecting moral status in entities like thermostats, without resorting to an unsatisfying "probability × welfare" product vulnerable to Pascalian problems?

  **2. Why Existing Positions Leave it Open:**  
  Current debates often conflate these dimensions. Proponents of significant insect moral status typically emphasize (a) and implicitly assume high (b) and (c). Skeptics often deny (a) while implicitly questioning (b) or (c). The standard "expected welfare" model (Probability of Sentience × Welfare Range if Sentient) attempts quantification but:
  *   **Conflates dimensions:** It implicitly bundles assumptions about (b) and (c) into the "Welfare Range" term without clarity.
  *   **Obfuscates disagreement:** Disputes about the fundamental nature of insect experience (e.g., fragmented vs. unified) get buried in arguments about prior probabilities.
  *   **Invokes Pascalian vulnerability:** At the margins (e.g., simple machines), minuscule subjective probabilities of sentience, multiplied by undefined/infinite-seeming potential welfare ranges (if one grants sentience), lead to counterintuitive obligations, making the debate hinge entirely on arbitrary-sounding priors. Existing positions rarely articulate which dimension(s) they are primarily contesting, leaving the core disagreement muddy.

  **3. Approach:**  
  I will develop a **conceptual framework** that explicitly treats (a), (b), and (c) as separate, potentially orthogonal axes contributing to overall moral status judgments. This involves:
  *   **Defining the Axes:** Precisely characterizing each dimension:
      *   (a) Epistemic confidence in the presence of *any* phenomenal consciousness.
      *   (b) The *scope and depth* of valenced states (pleasure/suffering, preferences, flourishing) *conditional* on (a) being true.
      *   (c) The degree to which experiences are integrated into a *persistent, coherent subject* of a life (vs. fragmented moments).
  *   **Mapping Existing Arguments:** Analyzing prominent arguments for/against insect/simple entity moral status (e.g., neurobiological similarity, behavioral complexity, evolutionary arguments, philosophical zombies, unity of consciousness critiques) and showing which axis(es) they primarily target.
  *   **Diagnosing Stalemates:** Demonstrating how disagreements that *appear* to be about (a) often stem from unstated disagreements about (b) or (c), or vice-versa.
  *   **Re-evaluating the "Expected Welfare" Model:** Exploring whether and how a decoupled model avoids Pascalian problems by clarifying the *nature* of the claim being assigned a probability (e.g., assigning probability to a complex claim involving (c) is distinct from assigning it to a minimal claim of (a)).

  **Why this Approach over Alternatives?**
  *   **Empirical Deep Dive (e.g., insect cognition):** While vital, this is vast and exceeds a semester. My focus is on the *conceptual structure* of the argument, which frames *how* empirical data informs each axis.
  *   **Pure Normative Theory (e.g., defending a specific account of status):** This often rehearses familiar debates. My aim is meta-ethical clarification – making the *structure* of disagreement clearer to enable more productive debate.
  *   **Formal Expected Value Modeling:** This is the target of my critique. I aim to show *why* the simple model fails conceptually before proposing refinements or alternatives. Starting with conceptual disentanglement is necessary groundwork.

  **4. What a Result Looks Like & What Counts as Failure:**
  *   **Success:** A clear framework demonstrating that:
      *   Different combinations of positions on (a), (b), and (c) can yield the *same* overall moral status judgment, explaining apparent consensus where it exists.
      *   Genuine disagreements can be precisely located on one or more specific axes, revealing the actual crux of the dispute (e.g., "We agree insects are likely sentient, but disagree fundamentally on their capacity for integrated suffering vs. momentary aversive states").
      *   The intuition that thermostats lack moral status can be robustly defended by showing they fail minimally on *all* axes (especially (a) and (c)), without needing infinitesimal probabilities, thereby mitigating the Pascalian mugging.
      *   This clarifies what proponents *mean* when claiming a bee matters more than a thermostat: it's based on defensible positions on one or more axes, not just an arbitrary prior.
  *   **Failure:** 
      *   The framework proves redundant or merely relabels existing concepts without adding clarity.
      *   The axes cannot be coherently defined or separated in practice.
      *   The analysis fails to resolve or clarify any significant existing stalemate.
      *   The Pascalian problem remains equally potent under the new framework.

  **5. Realistic Semester Accomplishment:**  
  In one semester, I can realistically:
  1.  Develop and rigorously define the three-axis framework.
  2.  Apply it to dissect 2-3 core, representative arguments on each "side" of the insect moral status debate, showing how conflation occurs.
  3.  Demonstrate how the framework handles the thermostat case decisively.
  4.  Articulate how this changes the terms of the debate and mitigates Pascalian concerns.
  5.  *Crucially, I will NOT:*
      *   Definitively prove insects are sentient or establish their precise welfare capacity.
      *   Resolve the hard problem of consciousness.
      *   Develop a complete, quantified alternative to expected welfare models (though I may sketch directions).
      *   Survey all possible entities or arguments exhaustively.

  The goal is to provide a **powerful conceptual toolkit** that makes the structure of graded moral status arguments more transparent, forces greater precision in claims, dissolves some false dichotomies, and lays essential groundwork for more productive future debate and empirical investigation – a significant step beyond rehearsing the familiar "do they/don't they" impasse.
