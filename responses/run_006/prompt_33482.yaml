  This draft may need refinement, but it captures the essence of the adversarial collaboration.
answer: |-
  ### Joint Statement on Anthropic Reasoning:  
  #### Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA)  

  **Preamble**  
  We, a committed defender of the Self-Sampling Assumption (SSA) and a committed defender of the Self-Indication Assumption (SIA), have engaged in adversarial collaboration to clarify our positions. We agree on foundational principles of anthropic reasoning but diverge on key implications. Below, we list points of agreement, articulate disagreements precisely, identify cruxes, and note where disputes may be verbal.  

  ---

  ### 1. Agreements  
  Both sides accept the following substantive claims:  

  1. **Core Problem**: Anthropic reasoning addresses how to update credences given indexical evidence (e.g., "I exist as an observer") and hypotheses about the number of observers.  
  2. **Doomsday Argument (DA)**:  
     - Under SSA: Finding oneself among the earliest 10% of all humans *lowers* the probability of a "long-future" hypothesis (e.g., humanity surviving to create 10¹⁵ humans).  
     - Under SIA: The DA is *weakened or reversed*; the mere fact of existence favors hypotheses with more observers, counteracting early-position surprises.  
  3. **Presumptuous Philosopher (PP)**:  
     - Under SSA: In a scenario where Theory A predicts 10¹⁰ observers and Theory B predicts 10²⁰ (with identical non-indexical evidence), one should *not* favor Theory B without further evidence.  
     - Under SIA: One *should* favor Theory B solely because it predicts more observers.  
  4. **Coin-Flip Case (CF)**:  
     - A fair coin determines whether 1 observer (heads) or 1,000 observers (tails) exist. Upon finding oneself existing:  
       - Both agree: \( P(\text{Heads}) = \frac{1}{1001} \).  
       - Both reject \( P(\text{Heads}) = 0.5 \) as incorrect.  
  5. **Reference Class**: The choice of observer reference class (e.g., humans, conscious beings) is critical and non-arbitrary for both principles.  

  ---

  ### 2. Disagreements  
  For each unresolved issue, we state both positions in terms acceptable to their respective defenders.  

  | Issue | SSA Defender's Position | SIA Defender's Position |
  |-------|--------------------------|--------------------------|
  | **Probability of Existence** | One's existence is *not* evidence favoring hypotheses with more observers; it is a selection effect to condition upon. "I exist" provides no information about observer counts beyond excluding observerless worlds. | One's existence *is* evidence favoring hypotheses with more observers. Hypotheses with higher expected observer counts predict "I exist" with higher probability. |
  | **Updating in DA** | Learning one's birth rank (e.g., "I am among the first 100 billion humans") *lowers* credence in long-future hypotheses. Failing to update thus is an error in probabilistic reasoning. | Learning one's birth rank does *not* meaningfully lower credence in long-future hypotheses. The evidence "I exist" outweighs birth-rank surprises by favoring large populations. |
  | **Treatment of "Possible" Observers** | Only *actual* observers in the realized world are included in the reference class. Unrealized observers (e.g., in non-actualized quantum branches) are irrelevant. | *Possible* observers across all possible worlds/branches matter. Expected observer counts inform priors, even for non-actualized scenarios. |
  | **Prior Formation** | Priors over hypotheses are set *before* anthropic conditioning. Observer counts do not skew priors; they only affect updates via indexical information. | Observer counts directly inform priors. A hypothesis predicting \( N \) observers gets a prior weight proportional to \( N \) (all else equal). |

  ---

  ### 3. Cruxes  
  Settling these sub-questions would change at least one side’s position. For each crux, we provide a testable scenario, predictions, and a resolution criterion.  

  #### Crux 1: Does Existence Favor Many-Observer Hypotheses *Independently* of Selection?  
  - **Scenario**: A quantum device measures a particle. If spin-up, one observer is created. If spin-down, 1,000 observers are created. *After* the measurement, but *before* observers are created, a random process kills all observers with 50% probability. You find yourself existing.  
  - **Predictions**:  
    - SSA Defender: \( P(\text{spin-down}) = \frac{1000}{1001} \times \frac{1}{2} \) (selection happens post-creation).  
    - SIA Defender: \( P(\text{spin-down}) = \frac{1000}{1001} \) (existence evidence favors spin-down; killing is independent).  
  - **Resolution Criterion**: Run simulations; measure if "existing" observers see spin-down in >99.9% of cases when spin-down occurs.  

  #### Crux 2: Is the Reference Class Fixed by Physics or Epistemology?  
  - **Scenario**: In a simulation, 1,000 "humans" and 1,000,000 "AI observers" coexist. Only humans are capable of asking anthropic questions. A coin flip determines whether humans or AI dominate future observer counts. You (a human) exist.  
  - **Predictions**:  
    - SSA Defender: Reference class = humans. Your existence gives no information about the coin flip.  
    - SIA Defender: Reference class = all observers. Your existence favors hypotheses with more *total* observers, thus favoring the AI-dominated outcome.  
  - **Resolution Criterion**: Analyze whether the majority of "you" instances in multiverse simulations are in high-observer worlds when using SIA weights.  

  #### Crux 3: Does SSA Permit "Presumptuous" Updates?  
  - **Scenario**: Before Earth formed, two universe-creation theories were equally likely: Type A (1 planet with observers) or Type B (1,000 planets with observers). You later observe Earth exists.  
  - **Predictions**:  
    - SSA Defender: \( P(\text{Type B}) = \frac{1}{2} \). "I exist on Earth" is expected under both theories.  
    - SIA Defender: \( P(\text{Type B}) = \frac{1000}{1001} \). Existence is more likely if more planets exist.  
  - **Resolution Criterion**: In Earth-observing civilizations, check if >99.9% inhabit multiverse Type B if Type B is true.  

  ---

  ### 4. Verbal Disagreements  
  We identify one point as verbal:  
  - **Term "Selection"**:  
    - SSA uses "selection" to denote conditioning on being randomly sampled from *actual* observers.  
    - SIA uses "selection" to denote weighting by the *probability of being sampled* from possible observers.  
    - **Why verbal**: Both agree on the math in coin-flip cases (§1.4), but the term "selection" obscures this. The dispute is not substantive but terminological.  

