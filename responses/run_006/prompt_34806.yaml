  First, they want a numbered section of claims both sides can agree on without hedging. That should include embedding data like negation, conditionals, disjunctions, questions, and attitude reports. Also, compositionality, univocality, and the validity of modus ponens. I need to make sure every point is truly neutral—no sneaking in contentious assumptions.

  Next, a disagreements section presented as a table. Important: each side's position must be described in their own acceptable terms. No strawmanning. The expressivist shouldn't be framed as saying moral sentences lack meaning, and the descriptivist shouldn't accuse expressivists of conflating force and content. Wording matters here.

  Then the cruxes. The user listed three: (i) the negation problem—what attitude does "stealing is not wrong" express, and whether that explains the clash with affirmation; (ii) mixed sentences like "if stealing is wrong, then grass is green"—can expressivists handle this without truth conditions; (iii) whether expressivist validity (as incoherence) matches logical validity, especially with mixed premises. For each, I need concrete cases that both sides agree are relevant, plus advance predictions from each camp. This pre-commits them to interpretations before seeing outcomes.

  Finally, a brief note on which parts are merely verbal, without oversimplifying the whole dispute. The user explicitly says it's not all verbal, so I should identify only specific elements where disagreement dissolves under scrutiny, like perhaps terminology differences that don't affect substance.

  Now, thinking about deeper needs: The group is tired of circular debates, so this document should force precision and falsifiability. They want progress, not just more arguments. The adversarial framework is key—it's about creating testable conditions where one side might concede. I should ensure the cruxes are genuinely pivotal; if settled, they'd move the needle. Also, the joint statement must feel balanced so both factions engage willingly. No implicit bias toward either theory.

  For the agreements section: List observable linguistic behaviors everyone acknowledges. Focus on surface syntax/semantics. Avoid terms like "proposition" or "attitude" here to stay neutral. Instead, say "means the same thing" for univocality and "valid in the ordinary sense" for modus ponens. 

  For disagreements table: Expressivist row should emphasize attitude expression without denying surface grammar. Descriptivist row should affirm truth-apt propositions without dismissing expressivist motivations. Use their preferred jargon carefully.

  For crux (i): The case is straightforward negation clash. Expressivist predicts "not wrong" expresses forbearance (or similar), while descriptivist sees propositional negation. Both agree the clash happens, but differ on why. 

  For crux (ii): The mixed conditional "if stealing is wrong, then grass is green" is perfect. Expressivist must explain this without truth conditions—maybe as a constraint on combining attitudes? But if they can't, it hurts their case. Descriptivist has no issue. Predictions: Expressivist expects a consistent attitude assignment; descriptivist expects expressivism to fail or cheat here.

  For crux (iii): The mixed modus ponens argument. Expressivist validity = incoherence if you accept premises but deny conclusion. Descriptivist uses truth preservation. Predictions matter: If expressivist coherence matches classical validity, it supports them; if not (e.g., false descriptive premise causes "incoherence" incorrectly), descriptivist scores a point.

  Verbal disputes: Highlight that "meaning" might be ambiguous between content and force, but stress this doesn't resolve the core issues. The theories still make different empirical predictions about language use.

  Overall, structure should push both sides toward concrete tests. That’s what the group needs to break the stalemate.
answer: |-
  Here is a draft joint statement for your adversarial collaboration, designed to force substantive engagement on the Frege-Geach problem while respecting both positions' core commitments:

  **Joint Statement: Expressivist & Descriptivist Collaboration on Moral Language Embedding**

  **1. Agreed Upon Data and Principles (Uncontroversial Foundations)**
  Both signatories endorse the following claims about moral language and logic, based on surface linguistic competence:

      1.  **Compositionality:** The meaning of a complex sentence is determined by the meanings of its parts and their syntactic mode of combination.
      2.  **Univocality:** The phrase "stealing is wrong" has the same meaning (contributes the same semantic value) whether it occurs asserted ("Stealing is wrong!"), embedded in negation ("Stealing is not wrong"), embedded in a conditional ("If stealing is wrong..."), embedded in a disjunction ("Either stealing is wrong or..."), embedded in a question ("Is stealing wrong?"), or embedded in an attitude report ("Alice thinks stealing is wrong").
      3.  **Embedding Phenomena:**
          *   *Negation:* "Stealing is not wrong" is a meaningful negation of "Stealing is wrong." Accepting both "Stealing is wrong" and "Stealing is not wrong" simultaneously involves a fundamental clash.
          *   *Conditionals:* "If stealing is wrong, then getting your little brother to steal is wrong" is a meaningful conditional.
          *   *Disjunction:* "Either stealing is wrong or charity is merely self-interest" is a meaningful disjunction.
          *   *Questions:* "Is stealing wrong?" is a meaningful question distinct from, e.g., "Do you disapprove of stealing?".
          *   *Attitude Reports:* "Alice thinks stealing is wrong" ascribes a cognitive attitude towards the embedded moral claim.
      4.  **Validity of Core Inference:** The following argument is logically valid in the ordinary, classical sense:
          *   P1: Stealing is wrong.
          *   P2: If stealing is wrong, then getting your little brother to steal is wrong.
          *   Therefore: Getting your little brother to steal is wrong.
          This validity relies on the univocality of "stealing is wrong" across its occurrences and standard modus ponens.

  **2. Core Theoretical Disagreements**
  *The following table outlines our fundamental divergence in explaining the agreed data:*

  | Feature                     | Expressivist Position (as endorsed by Expressivist)                                                                 | Descriptivist Position (as endorsed by Descriptivist)                                                                 |
  | :-------------------------- | :------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------- |
  | **Primary Function**        | The primary function of moral sentences (e.g., "Stealing is wrong") is to express non-cognitive, desire-like conative attitudes (e.g., disapproval). | The primary function of moral sentences is to represent states of affairs in the world, attributing moral properties to actions/things. |
  | **Semantic Content**        | Moral sentences *express* conative attitudes rather than *representing* propositions with truth conditions as their core semantic content. Their meaning is constituted by the mental state expressed. | Moral sentences *express* propositions (objective, truth-evaluable contents) as their core semantic content, regardless of the speaker's attitude. |
  | **Truth Apriority**         | Moral sentences are not fundamentally or primarily truth-apt in the same way as descriptive sentences (e.g., "Grass is green"). Their surface declarative form does not entail genuine truth conditions. | Moral sentences are genuinely truth-apt. They possess objective truth conditions (e.g., "Stealing is wrong" is true iff stealing has the property of wrongness). |
  | **Explanation Target**      | The central challenge is to explain the *logical structure* and *inferential relations* of moral discourse using only the resources of conative attitude expression and constraints on combinations of attitudes. | The central challenge is to integrate the *distinctive practical role and phenomenology* of moral judgments into a robust theory of truth-conditional meaning and reference. |

  **3. Cruxes: Pivotal Questions & Pre-Commitments**
  We identify the following specific problems as crucial for adjudicating between our views. For each, we state a concrete case/argument and our *advance* predictions about what it shows.

  *   **Crux (i): The Negation Problem**
      *   **Case:** Explain the attitude expressed by "Stealing is not wrong" and how this explains the *clash* between accepting "Stealing is wrong" and accepting "Stealing is not wrong".
      *   **Expressivist Prediction:** We *can* define a distinct, coherent conative attitude (e.g., "tolerance," "forbearance," or a complex state involving rejection of disapproval) expressed by the negation that rationally conflicts with the attitude expressed by the positive claim. This conflict explains the felt incompatibility without needing truth conditions. *(Failure: Inability to define such a coherent, conflicting attitude would undermine expressivism.)*
      *   **Descriptivist Prediction:** Expressivism will either fail to define a coherent, distinct attitude for the negation that genuinely conflicts with the positive attitude, or the proposed attitude will fail to explain the *logical* nature of the clash (reducing it to mere psychological incompatibility). The clash is best explained as contradiction between truth-conditional contents. *(Failure: A successful expressivist account of negation as a conflicting attitude would challenge the *necessity* of truth conditions for explaining this clash.)*

  *   **Crux (ii): Mixed Atomic Sentences (The "Boo/Hooray" Problem)**
      *   **Case:** Explain the meaning and attitude expressed by the mixed descriptive/moral conditional: "If stealing is wrong, then grass is green."
      *   **Expressivist Prediction:** We *can* assign a coherent, non-truth-conditional semantic value (e.g., a function from attitudes to attitudes) to the antecedent and a truth-conditional value to the consequent, and compositionally derive a single, coherent conative attitude (e.g., a constraint on combining disapproval of stealing with disbelief that grass is green) expressed by the whole conditional, without smuggling in truth conditions for the antecedent. *(Failure: Resorting to assigning a propositional content/truth condition to "stealing is wrong" within the conditional, or failing to assign *any* coherent attitude to the whole sentence, would undermine expressivism.)*
      *   **Descriptivist Prediction:** Expressivism cannot assign a *single, coherent conative attitude* to the entire mixed conditional that reflects its intuitive meaning (typically seen as a trivial truth due to the falsity of the antecedent or the truth of the consequent, not a substantive moral attitude). Attempts to do so will either be implausible or will implicitly rely on treating the antecedent as having truth-conditional content. *(Failure: A successful assignment of a coherent, plausible non-cognitive attitude to the whole mixed conditional would significantly bolster expressivism.)*

  *   **Crux (iii): Validity Extension (Mixed Premises/Conclusions)**
      *   **Case:** Explain why the following argument is valid using the expressivist notion of validity (preservation of consistency/avoidance of incoherence among attitudes), and show this matches the classical truth-conditional validity:
          *   P1: If lying is wrong, then murder is wrong. (Moral Conditional)
          *   P2: Lying is wrong. (Moral Atomic)
          *   P3: Grass is blue. (False Descriptive Atomic)
          *   Therefore: Murder is wrong. (Moral Atomic)
          *(Classically valid via modus ponens, despite P3 being false).*
      *   **Expressivist Prediction:** Our account of validity (as avoiding a state of "kratic incoherence" or fundamental irrational commitment) will correctly classify this argument as valid. Accepting the attitudes expressed by P1 and P2 while rejecting the attitude expressed by the conclusion *is* incoherent, regardless of the falsity of P3. Our account can formally capture this and align with classical validity for such mixed moral arguments. *(Failure: If accepting P1, P2, and rejecting the conclusion is *not* deemed incoherent by the expressivist account, or if the account cannot formally replicate classical validity in standard mixed cases, it fails.)*
      *   **Descriptivist Prediction:** The expressivist account of validity will struggle with this case. The false descriptive premise (P3) is irrelevant to the *logical* validity concerning the moral conclusions; validity depends solely on truth-conditional form. An expressivist account relying on incoherence among attitudes may incorrectly deem the argument invalid (if the falsity of P3 somehow "breaks" the attitude structure) or fail to cleanly separate logical validity from the truth/falsity of descriptive premises. Its extension will diverge from classical validity. *(Failure: If expressivism cleanly and correctly classifies this and similar mixed arguments as valid using only attitude coherence, matching classical logic, it demonstrates the sufficiency of its account for logical embedding.)*

  **4. Verbal vs. Substantive Disagreement**

  We agree that **some terminological differences exist but do not resolve the core dispute.** For instance:
  *   The term "meaning" might be used by the expressivist primarily for *expressive function* and by the descriptivist primarily for *propositional content/reference*. This difference reflects the deeper theoretical divergence, rather than causing it.
  *   Both sides use "truth," but the expressivist typically restricts its robust application to descriptive domains or offers a minimalist/deflationary account for morals, while the descriptivist insists on a robust, property-tracking notion. This difference stems from the core commitments, it is not merely verbal.

  **Crucially, we affirm that our disagreement is overwhelmingly SUBSTANTIVE.** The cruxes outlined above represent genuine, testable differences in theoretical predictions about the nature of moral language, the explanation of logical phenomena like embedding and validity, and the kinds of mental states involved in moral judgment. Resolving these cruxes requires substantive philosophical argument and analysis, not merely clarification of terms. The feasibility of the expressivist project in providing a compositional, non-truth-conditional semantics that adequately handles embedding and logic, while the descriptivist project integrates moral language's distinctive role within a truth-conditional framework, constitutes the real, non-verbal disagreement.
