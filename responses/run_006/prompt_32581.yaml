prompt: |-
  After retiring from a career in experimental chemistry, I have spent the past several years reading philosophy of probability and decision theory, and I am now presenting my first colloquium to a philosophy department. My thesis is that the Ellsberg paradox exposes a genuine normative distinction between risk (known probabilities) and ambiguity (unknown or imprecise probabilities), and that ambiguity aversion is not an irrational bias to be corrected but a defensible epistemic posture — one that scientific practice already recognizes when it distinguishes, say, well-characterized measurement uncertainty from the deeper uncertainty about which model is even appropriate. The audience includes two formal epistemologists who work on accuracy-first epistemology and scoring rules, a philosopher of economics who regards Savage's subjective expected utility framework as the default normative standard, and three philosophers of science, one of whom has published on the role of idealization in modeling. The chair has warned me that the formal epistemologists will be the most persistent in Q&A. Draft my Q&A prep sheet: the six or seven objections I am most likely to get, ordered by how damaging they are and phrased as a member of this specific audience would phrase them, with a two-minute reply for each and a candid note on where the reply is weakest. Include the question I am hoping nobody asks.
