  For the amputation analogy, I'll clarify: cutting is justified intervention, but the lost limb remains a bad outcome - not a "wrong" in the ethical sense unless negligence occurred. This distinction matters because it prevents normalizing harm while acknowledging tragic necessities. 

  On the irrational guilt point, Mark confuses moral recognition with affective guilt. Leaders should acknowledge harms caused without self-flagellation - more "moral reckoning" than "guilt". Elena misses this by dismissing all discomfort as irrational. 

