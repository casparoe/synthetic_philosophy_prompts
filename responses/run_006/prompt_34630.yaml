  ...Wait, did I just side with Elena's framework but enrich it with Mark's concerns? Yes, but with crucial tweaks: the "residue" includes moral obligations, not just feelings. That might satisfy both - the act isn't dirty (contra Mark) yet leaves moral debts (contra Elena). 

