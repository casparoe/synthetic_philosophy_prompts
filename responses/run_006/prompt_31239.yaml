prompt: |-
  Hey, I'm taking an epistemology class and we just finished a unit on norms of assertion — basically, what standard you have to meet for it to be ok to assert something. We read the main views: the knowledge norm (you should only assert what you know), the truth norm (you should only assert what's true), and the belief norm (you should only assert what you believe).

  I've been trying to apply these to a real-world practice and I keep getting stuck on Wikipedia. Wikipedia's core content policy is basically that information needs to be verifiable from reliable published sources, and they explicitely say that truth isn't the standard for inclusion. So editors will write stuff into articles that they personally think is false, as long as there's a citation to a reliable source. And they'll remove stuff that's obviously true if no reliable source has published it.

  What norm of assertion does Wikipedia's practice presuppose? Because it doesn't seem to fit any of the three we studied. It's not knowledge — the article ends up asserting things nobody knows, and might even be false. It's not truth — the policy literally says truth isn't the standard. And it's sort of not belief either — editors are supposed to follow the sources, not their own beliefs about what's true.

  Is there some other norm of assertion at work here — maybe something about delegated epistemic authority, or about what an institution is entitled to assert versus what an individual is entitled to assert? Or is Wikipedia just not really in the business of "asserting" things, so the whole question is confused?

  Please think through this carefully, like a professional epistemologist would. I'd love if you start by saying what each of the three main norms would predict about Wikipedia's practice, then try to reconstruct whatever norm you think is actually implicit in the verifiability policy, and then tell me whether that norm is coherent and defensible. Also curious what would have to change if Wikipedia switched to a knowledge norm or a truth norm — like, what specific practices would have to be different?
