answer: |-
  You've hit on a fascinating case study where institutional epistemology clashes with individual norms of assertion. Let's break this down systematically, as an epistemologist would:

  **Applying the Three Classic Norms to Wikipedia:**
  1.  **Knowledge Norm (KN):** *"Assert only what you know."*
      *   **Prediction for Wikipedia:** Editors would only add/edit statements they *personally know* to be true (justified true belief + anti-Gettier conditions).
      *   **Conflict with WP Practice:** Wikipedia explicitly *rejects* this. Editors add statements based on *source publication*, regardless of personal knowledge. They add claims they *know* are controversial or potentially false (with proper sourcing) and omit claims they know are true but lack sourcing. Wikipedia asserts things *nobody* involved may actually know.

  2.  **Truth Norm (TN):** *"Assert only what is true."*
      *   **Prediction for Wikipedia:** The *only* criterion for inclusion would be the *actual truth* of the statement, regardless of source or editor belief.
      *   **Conflict with WP Practice:** Wikipedia explicitly states ["Verifiability does not guarantee truth"](https://en.wikipedia.org/wiki/Wikipedia:Verifiability). True claims without sources are excluded ("Original research" ban). False claims with strong, widespread sourcing *can* persist until better sources refute them. Truth is an *aspiration*, not the *operational standard*.

  3.  **Belief Norm (BN):** *"Assert only what you believe."*
      *   **Prediction for Wikipedia:** Editors would only add statements they *personally believe* to be true.
      *   **Conflict with WP Practice:** Editors are *required* to add well-sourced claims even if they personally *disbelieve* them (e.g., adding a mainstream scientific view they personally reject, or reporting a controversial claim made by a reliable source). Conversely, they must *remove* claims they *believe* are true if unsourced. The norm overrides individual belief.

  **Conclusion:** Wikipedia's verifiability policy fundamentally **rejects** the core commitments of KN, TN, and BN as operational norms for *its specific practice of assertion*.

  **Reconstructing Wikipedia's Implicit Norm of Assertion:**

  Wikipedia operates under what we might call the **"Second-Hand Justification Norm" (SHJN)** or the **"Delegated Verifiability Norm" (DVN)**:

  *   **The Norm:** *"Assert only that 'Source S of reliability R states that P' is verifiable."*
  *   **Core Components:**
      1.  **Delegation of Epistemic Responsibility:** Wikipedia does not take primary responsibility for the *truth* of P. Instead, it delegates that responsibility to external sources meeting specific reliability criteria (R). Its core assertion is *about the source's claim*, not directly about P.
      2.  **Verifiability as Justification:** The *justification* for asserting "P is the case" (or more accurately, "P is reported by reliable sources") is not knowledge, truth, or editor belief, but the *demonstrable existence* of a published, reliable source asserting P. The norm focuses on the *process of checking the citation*, not the content of the claim itself.
      3.  **Institutional, Not Individual:** This norm is feasible *only* within an institutional framework like Wikipedia. It relies on policies defining "reliable source" (R), community enforcement, and the neutrality policy mandating coverage of significant published viewpoints regardless of perceived truth. An individual asserting P based solely on "a reliable source said so" without personal endorsement would typically violate KN/BN and possibly TN.
      4.  **Metacognitive Focus:** The norm shifts the epistemic focus from "Is P true/knowable/believed?" to "Can the claim *that reliable sources state P* be verified?"

  **Is SHJN/DVN Coherent and Defensible?**

  *   **Coherence:** Yes, it's internally coherent. It defines a clear, operationalizable standard (source verification) distinct from truth, knowledge, or belief. It creates a consistent framework for a massive, collaborative project with diverse contributors.
  *   **Defensibility (Arguments For):**
      *   **Scalability & Neutrality:** It's the only practical way to build a massive encyclopedia with diverse contributors holding conflicting beliefs. It avoids editors imposing their personal views (KN/BN) or making unsupported truth judgments (TN). It enforces a form of epistemic humility.
      *   **Focus on Accessibility:** It prioritizes claims that can be *checked* by readers using publicly available sources, fostering transparency and independent verification.
      *   **Mapping Discourse:** It aims to accurately reflect the state of *published discourse* on a topic, which has inherent value even when that discourse contains falsehoods.
      *   **Minimizes Original Research:** It effectively prevents Wikipedia from becoming a primary source or platform for novel claims.
  *   **Defensibility (Arguments Against):**
      *   **Truth Disconnect:** It systematically risks propagating falsehoods if reliable sources are wrong or misrepresented. It can exclude important truths simply because they haven't been formally published.
      *   **"Garbage In, Garbage Out":** The quality of Wikipedia's assertions is entirely parasitic on the quality of its cited sources. Systemic biases or errors in the source ecosystem infect Wikipedia.
      *   **Misleading Assertion:** When Wikipedia presents "P" in an article body, readers reasonably interpret it as Wikipedia asserting *that P is true*, not merely *that source S says P*. The norm relies on a subtlety often lost on readers (though disclaimers exist).
      *   **Epistemic Buck-Passing:** It avoids direct epistemic responsibility for its content, potentially fostering uncritical reliance on sources.
      *   **Vulnerability to Manipulation:** Determined actors can potentially get false claims included by manipulating sources or exploiting definitions of reliability.

  **Conclusion on Defensibility:** SHJN/DVN is a *pragmatic* and *institutionally coherent* norm for Wikipedia's specific goals and constraints. It's defensible as a *practical necessity* for a large-scale, collaborative, non-expert project aiming to summarize published knowledge. However, it is *epistemically weaker* than KN or TN regarding direct truth-tracking. Its defensibility hinges on accepting that Wikipedia's primary function is to report *what reliable sources say*, not to assert *what is true*.

  **What if Wikipedia Adopted a Different Norm?**

  1.  **Switching to a Knowledge Norm (KN):**
      *   **Radical Change:** The entire project would collapse in its current form.
      *   **Specific Changes:**
          *   **Ban on Sourcing:** Citing a source wouldn't be enough. Editors would need personal justification for knowing P is true.
          *   **End of Collaboration:** Only experts could edit within their narrow field of knowledge.
          *   **Removal of Controversial/Historical Claims:** Anything not currently knowable with certainty (much of history, interpretations in arts/humanities, cutting-edge science) would be excluded.
          *   **Elimination of NPOV:** Presenting opposing views would require editors to *know* both are true, which is often impossible for genuine disagreements.
      *   **Result:** Wikipedia would become a tiny, static repository of uncontroversial facts, losing its core value as a comprehensive summary of human knowledge and discourse.

  2.  **Switching to a Truth Norm (TN):**
      *   **Significant Change:** Less destructive than KN, but still transformative and problematic.
      *   **Specific Changes:**
          *   **Sourcing Becomes Optional/Irrelevant:** True claims without sources *must* be included. False claims with sources *must* be excluded (editors would need to *determine* falsity).
          *   **Original Research Mandated:** Editors would *have* to include true information they possess, even if unpublished, and actively research topics to verify truth claims, contradicting the core "No original research" policy.
          *   **Massive Instability & Conflict:** Endless arguments about the *actual truth* of P would replace arguments about sourcing. Consensus would be harder to achieve.
          *   **Expertise Requirement Intensifies:** While still collaborative, a higher burden of truth-seeking would fall on editors.
          *   **Increased Vulnerability to POV Pushing:** Editors could insist on including their "true" views without needing sources.
      *   **Result:** Wikipedia would become more like a traditional encyclopedia attempting original synthesis and truth-assertion, but without the editorial control or expert staffing of traditional encyclopedias, leading to chaos and unreliability. The sourcing system's objectivity and verifiability would be lost.

  **Final Philosophical Point: Is Wikipedia "Asserting"?**

  This is crucial. One could argue Wikipedia, strictly speaking, *isn't asserting P* in the individual speaker sense targeted by KN/TN/BN. Instead, its core speech act is: **"Reliable published sources state that P."** The presentation *within the article body* often blurs this distinction, creating the *appearance* of a direct assertion of P. However, its policies and disclaimers frame it as a report on source claims. Therefore, applying individual assertion norms directly might be a **category mistake**. Wikipedia operates under a distinct institutional epistemic practice – **source-based reporting** – governed by SHJN/DVN, which is a norm *for that specific practice*, not a direct substitute for individual epistemic norms. The tension arises because readers naturally interpret "P appears in a Wikipedia article" as "Wikipedia asserts P."
