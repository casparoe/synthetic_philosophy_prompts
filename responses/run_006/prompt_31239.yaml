  First, I need to map how the three classic norms (knowledge, truth, belief) would interpret Wikipedia's verifiability policy. The knowledge norm fails immediately - Wikipedia explicitly includes claims that may be unknown or even false. Truth norm? Nope, they literally say truth isn't the standard. Belief norm? Editors often disbelieve what they're adding. None fit cleanly. 

  Now, why this disconnect? I think the user's instinct about institutional delegation is spot on. Wikipedia isn't asserting like an individual; it's building a map of published claims. The implicit norm feels like: "Assert only that X is published by source S meeting reliability criteria R." This shifts the epistemic burden to the cited sources. 

  But is this defensible? Well, it trades off direct truth-tracking for scalability and neutrality. The risks are obvious - it could propagate false-but-cited claims - but the alternative (individual editors judging truth) would collapse the project into original research. 

  The "what if" scenarios are telling: Switching to truth norm would require editors to personally vet every claim - impossible at Wikipedia's scale. Knowledge norm would be even stricter. Both would destroy their collaborative model. 

  Hmm... maybe the deeper issue is whether Wikipedia "asserts" at all in the philosophical sense. Its disclaimers frame it as reporting what others assert, which might place it outside standard assertion norms altogether. That meta-point deserves emphasis. 

