  - How often does manipulation occur? (the theorem doesn't claim it's frequent or practical)
  - What about dictatorship? (it's a technical escape hatch, not a realistic option)
  - And crucially—does this make comparing systems pointless? (absolutely not, since vulnerability varies wildly)

  The user seems technically literate but time-pressed. They mentioned approval/score voting, so I must clarify those fall outside the theorem. Also need to emphasize that "non-dictatorial" is a formality—no one advocates actual dictatorship. 

  Biggest service I can provide is separating the theorem's actual implications from the fatalism the Discord guy promotes. The key insight isn't "all systems are equally bad" but "all have weaknesses—so we should pick the least worst for our context." Practical impact matters more than theoretical possibility. 

  Should structure this as bullet points for easy copying. Lead with the accurate claims before debunking the overreach. Keep academic citations minimal but name Arrow's theorem as context. Stress that Gibbard-Satterthwaite is about single-winner systems since city councils often use multi-winner methods—that's another limitation the critic ignores. 

