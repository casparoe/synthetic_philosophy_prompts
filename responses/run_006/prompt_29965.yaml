answer: |-
  Here's a precise breakdown of claims derived from the "Gibbard-Satterthwaite says every voting system is manipulable" slogan, designed for pasting into your Discord thread:

  ### Gibbard-Satterthwaite Theorem: Accurate Claims & Common Overreach
  *(Assumes **single-winner elections** and **ordinal ballots** (ranked choices) unless otherwise stated)*

  1.  **"Any deterministic voting rule with ≥3 candidates that is *strategy-proof* (cannot be manipulated) must be *dictatorial*."**
      *   **Status:** **TRUE.** This is the core theorem.
      *   **Supports 'no point'?** **NO.** Dictatorship is (rightly) rejected, so the theorem forces us to *compare* manipulable systems.

  2.  **"No *non-dictatorial* voting rule with ≥3 candidates is *completely immune* to strategic voting by *some* voter(s) in *some* situations."**
      *   **Status:** **TRUE.** This is the practical implication of Claim 1.
      *   **Supports 'no point'?** **NO.** Vulnerability *exists* in all, but **does not imply** all systems are equally vulnerable, equally manipulable, or manipulated equally often in practice.

  3.  **"Every non-dictatorial rule *can* be manipulated in elections where *at least three candidates have a realistic chance of winning*."**
      *   **Status:** **TRUE.** The theorem requires at least three candidates to be *potentially* electable (the rule isn't ignoring one).
      *   **Supports 'no point'?** **NO.** Shows the *possibility* exists, not that it *always happens* or is *easy*.

  ### Where the Slogan Overreaches / Is Misleading

  4.  **"This applies to *all voting systems* (including Approval, Score, STAR, Proportional Representation)."**
      *   **Status:** **FALSE.** G-S **only** applies to systems using **strictly ordinal ballots** (ranking candidates 1st, 2nd, 3rd). Systems using **cardinal ballots** (Approval, Score, STAR) **are not covered** by G-S and can have strategy-proof properties under specific conditions. G-S also **does not apply** to multi-winner/PR systems.

  5.  **"Manipulation is *easy* for voters or *always works*."**
      *   **Status:** **FALSE (or Unsupported).** G-S only proves *existence* of *some* situation where *some* voter *could* benefit from lying. It says **nothing** about:
          *   How *often* manipulation is possible/beneficial in real elections.
          *   How *difficult* it is for voters to figure out *if* and *how* to manipulate.
          *   How *likely* manipulation is to *succeed* (depend on others' votes).
          *   Whether manipulation *backfires* easily. Many systems are *resistant* or *robust* in practice even if not immune.

  6.  **"'Dictatorship' is the only way to avoid manipulation, meaning we must accept it or give up."**
      *   **Status:** **MISLEADING.** "Dictatorship" in G-S is a **technical term** meaning one voter *always* decides the winner regardless of others' votes. It is **not a viable or desirable system**. The theorem's importance is showing **complete strategy-proofness is impossible** without this absurdity, **not** that dictatorship is a real option. We *must* compare imperfect systems.

  7.  **"Because all non-dictatorial systems *can* be manipulated, there is *no point* in comparing them or choosing one less manipulable than another."**
      *   **Status:** **FALSE.** This is the critical overreach. G-S proves universal *vulnerability*, **not** universal *equivalence*. Systems **differ vastly** in:
          *   **Frequency:** How *often* strategic opportunities arise (e.g., Condorcet methods vs. Plurality).
          *   **Complexity:** How *hard* it is for voters to identify and execute manipulation.
          *   **Robustness:** How *susceptible* the outcome is to *successful* manipulation.
          *   **Incentives:** How *strongly* voters are *motivated* to manipulate.
          *   **Other Properties:** Fairness (e.g., Condorcet), expressiveness, simplicity, resistance to other pathologies.
      *   **Conclusion:** Comparing systems is **essential** to find the one *least manipulable in practice* and best suited to your community's goals and ballot type. **G-S tells us *why* we *must* compare, not that we *shouldn't*.**

  ### Key Takeaway for Your Discord
  Gibbard-Satterthwaite proves **no single-winner ranked-choice system (≥3 viable candidates) can be perfectly strategy-proof without being a dictatorship.** However, it **does not** say all systems are equally bad, apply to Approval/Score/PR, or make comparing systems pointless. **Precisely because all are theoretically vulnerable, we *must* compare them to find the one that minimizes manipulation risks and best achieves community goals in the real world.** Your critic is confusing a fundamental *theoretical limitation* with *practical equivalence*.
