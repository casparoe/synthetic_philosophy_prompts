  I keep running into this on a local politics Discord: every time someone proposes changing how we elect the city council, the same guy says "Gibbard–Satterthwaite says every voting system is manipulable," and when I pushed back he added that the theorem shows any non-dictatorial rule with three or more candidates can be gamed, so there's no point in comparing systems. I'm pretty sure he's overreading it but I can't articulate exactly how. Can you seperate out the distinct precise claims that slogan could be making — whose ability to manipulate, in how many elections, under what assumptions about the rule (single-winner? ordinal ballots? at least three candidates? every candidate able to win?), whether it covers approval or score voting, and what "dictatorship" amounts to as the only way out — and for each claim say whether it's true, false, or a trivial restatement, and which ones would actually support "there's no point in comparing systems"? I want a menu I can paste back into the thread, not a proof sketch.
