prompt: |-
  I'm taking a bioethics seminar this semester on the ethics of human enhancement, and we've spent the last few weeks trying to get a grip on the therapy/enhancement distinction. My professor keeps insisting that the distinction is philosophically suspect—that it either collapses under pressure or ends up doing normative work it can't justify—but I find myself with strong intuitions about particular cases that seem to track something like it. The trouble is, when I try to extract a principle from those intuitions, everything falls apart. I discussed this with a friend in the course, and she suggested I just write down my verdicts on a range of cases and see whether a coherent view can be reconstructed from them—or whether I need to abandon some of my gut reactions. I'd appreciate your help with that project.

  Here's where I've landed on particular cases. (1) Administering insulin to a diabetic: clearly therapy, no question. (2) LASIK surgery for someone with myopia: I want to say this is therapy too, even though it's reshaping the cornea to a state it was never in naturally—something about it restoring normal visual function feels different from enhancement. (3) Prescribing Adderall to someone with a diagnosed case of ADHD: therapy. (4) A college student without ADHD taking Adderall to pull an all-nighter before exams: this feels like enhancement, and I'm uneasy about it. (5) Human growth hormone for a child with a diagnosed deficiency: therapy. (6) Human growth hormone for a short-but-healthy child whose parents just want him to be taller: enhancement, and I'm against it. (7) Breast reconstruction after a mastectomy: therapy. (8) Breast augmentation for purely cosmetic reasons: enhancement. (9) A cochlear implant for a child born deaf: I genuinely don't know how to classify this, and my intuition flips depending on how the case is framed—as restoring a sensory capacity the child never had, or as imposing a normative standard of hearing. (10) Drinking a cup of coffee to feel more alert in the morning: this is clearly some kind of cognitive enhancement, but I can't bring myself to think there's anything wrong with it—which makes me wonder whether the therapy/enhancement line is really tracking permissibility at all, or whether I'm just inconsistent. (11) A beta-blocker taken by a concert pianist without an anxiety disorder, solely to prevent hand tremors during a performance: this feels like enhancement, but I'm less bothered by it than I am by the Adderall case, and I can't articulate why. (12) A vaccine that not only prevents a disease but boosts the immune system beyond the typical range: this one throws me, because prevention usually feels like medicine, but "beyond typical range" sounds like enhancement.

  Is there a principle that makes sense of most or all of these verdicts? If some of them have to be revised or abandoned to get a coherent view, which ones would you overturn and why? And what does the resulting account say about a case I haven't listed: germline genetic engineering to increase a future child's IQ from a predicted 100 to a predicted 115?
reasoning: |-
  Okay, let me start by really understanding the user's problem. They're in a bioethics seminar focusing on the therapy/enhancement distinction, and their professor thinks it's philosophically shaky. The user has strong intuitions about specific cases but struggles to find a consistent principle. They want help reconciling their judgments or figuring out which intuitions to discard.

  First, I need to look at their case judgments. They have clear therapy cases like insulin for diabetes and LASIK for myopia. Enhancements like Adderall for studying or growth hormone for a healthy child make them uneasy. But then coffee is fine, and beta-blockers for pianists are less concerning. The cochlear implant case is ambiguous, and the vaccine that boosts beyond typical range is confusing. 

  Hmm, the challenge here is that their intuitions don't neatly fit into therapy vs. enhancement. The professor's skepticism might be valid because the distinction often blurs. Maybe the user is using multiple underlying values without realizing it. Let me list their cases and see patterns.

  Cases 1, 3, 5, 7 are clearly therapy: restoring normal function after disease or deficiency. Cases 4, 6, 8 are enhancements: improving beyond normal without medical need. But then LASIK (2) reshapes the cornea beyond natural state, yet they call it therapy because it restores normal vision. That suggests "normal function" is key. But then cochlear implants (9) are tricky—restoring a sense the child never had. Is that therapy or enhancement? The user is conflicted here, which shows the "normal function" criterion has limits, especially regarding what's species-typical or individual baseline.

  Coffee (10) is accepted enhancement. Beta-blockers (11) for performance are enhancement but less problematic than Adderall. Why? Maybe context matters—professional necessity vs. academic advantage. Or perhaps societal acceptance of coffee makes it permissible. Also, safety and risk might play a role. The vaccine (12) is preventive but enhances beyond normal. Prevention is medical, but boosting further complicates it.

  So, what principles can tie these together? The user might be using:

  1. **Normal Function Restoration**: Therapy corrects deviations from typical species functioning. This covers insulin, LASIK, HGH for deficiency. But cochlear implants challenge this—deafness isn't a disease but a variation. Here, the user's flip-flopping indicates underlying values about disability and normalization.
     
  2. **Medical Necessity vs. Preference**: Enhancements meet desires, not needs. But coffee is a desire, yet acceptable. So permissibility isn't just about therapy vs. enhancement. Social acceptance, low risk, and personal autonomy might explain coffee's okay-ness.

  3. **Fairness and Pressure**: Adderall for exams feels wrong because it creates unfair academic pressure. Beta-blockers for pianists are less concerning as it's about professional performance without systemic unfairness. Growth hormone for height might exacerbate social inequalities.

  4. **Authenticity and Effort**: Adderall feels like cheating, whereas coffee is a mild boost we culturally accept. Beta-blockers prevent a physical issue, not cognitive enhancement, so less about authenticity.

  5. **Slippery Slope and Social Harm**: Enhancements could pressure others or commodify traits. Genetic IQ boost (case 13) raises fears of eugenics or unequal access.

  The user needs to recognize that their judgments rely on multiple ethical axes: harm/benefit, fairness, autonomy, social consequences, authenticity, not just therapy/enhancement. For coherence, they might need to adjust some intuitions. For example, accepting that cochlear implants are therapeutic in intent, but also acknowledge the disability rights perspective. Or realizing that coffee is enhancement but permissible due to low stakes and widespread use.

  Cases to reconsider: The vaccine (12). If it prevents disease, the extra boost might be a bonus, not problematic if safe. The genetic IQ boost (13) would likely be enhancement, but the ethical concerns are about consent, inequality, and unintended consequences rather than the enhancement itself.

  In conclusion, the therapy/enhancement distinction isn't sufficient for permissibility. The user should adopt a multi-principle framework that considers restoration of function, medical need, risks, fairness, autonomy, and societal impact. Abandoning strict adherence to the distinction allows a more nuanced view that aligns better with their varied intuitions.
answer: |-
  Based on your detailed case judgments, your intuitions aren't inconsistent—they're tracking multiple overlapping ethical concerns that the simplistic therapy/enhancement distinction fails to capture. Here's a reconstruction that harmonizes most of your verdicts, identifies which intuitions might need refinement, and addresses the genetic engineering case:

  ### Core Principles Underlying Your Judgments
  1. **Restoring Species-Typical Function**: Interventions returning someone to statistically typical human functioning (e.g., insulin, HGH for deficiency) feel like therapy.
  2. **Preventing Harm/Addressing Pathology**: Correcting conditions causing dysfunction/disadvantage (ADHD treatment, mastectomy reconstruction) aligns with therapy, even if the "baseline" is debated (e.g., LASIK).
  3. **Avoiding Unfair Advantages/Coercion**: Enhancements that create competitive pressure (e.g., Adderall for exams) or exploit social biases (HGH for height) trigger unease.
  4. **Respecting Bodily Autonomy vs. Imposing Norms**: Cosmetic surgery (case 8) is permissible if autonomous, but *medicalizing* non-pathological traits (short stature) feels like enforcing harmful norms.
  5. **Risk-Benefit Proportionality**: Low-risk, familiar enhancements (coffee) are acceptable; higher-risk or novel interventions without medical need raise concerns.

  ### How This Explains Your Cases
  - **Cases 1,3,5,7**: Fit cleanly under **restoring species-typical function**.
  - **Case 2 (LASIK)**: Qualifies as therapy because it **prevents harm** (myopia causes functional limitations).
  - **Case 4 (Adderall)**: Enhancement creating **unfair pressure** in a zero-sum context (academics).
  - **Case 6 (HGH)**: **Imposes norms** (height as desirable) without addressing pathology.
  - **Case 8 (Cosmetic augmentation)**: Enhancement, but permissible if autonomous—your discomfort may stem from *medicalization*, not the act itself.
  - **Case 9 (Cochlear implant)**: Your conflict reflects tension between **preventing harm** (lack of hearing in a hearing-centric world) and **imposing norms** (deafness as pathology vs. identity). *Your view likely leans therapeutic if focused on functional access.*
  - **Case 10 (Coffee)**: Enhancement, but **low-risk/autonomous** with no systemic harm.
  - **Case 11 (Beta-blockers)**: Enhancement, but less concerning because:  
    - No unfair *cognitive* advantage (vs. Adderall)  
    - Aligns with **professional necessity** (like a violinist using rosin)  
    - Minimal risk/side effects  
  - **Case 12 (Vaccine)**: Primarily **preventive therapy**; the "boost" is a bonus unless it creates novel risks. *You likely accept this as therapeutic overall.*

  ### Inconsistent Intuitions to Reconsider
  - **Case 6 vs. Case 8**: Opposing HGH for height but accepting cosmetic surgery suggests you're weighing **medical necessity**, not just enhancement. *Revise:* If parents autonomously pursue HGH for a healthy child, consistency might require either (a) accepting it like cosmetic surgery (if safe) or (b) rejecting both as unnecessary medicalization. Your existing view is defensible if you see childhood height as more vulnerable to coercive norms.
  - **Case 4 vs. Case 10**: Adderall feels problematic while coffee doesn’t—but this is better explained by **context** (fairness in academia) and **risk**, not enhancement itself. *No revision needed.*
  - **Case 11 (Beta-blockers)**: If you accept this, consistency might require accepting safe cognitive enhancers in non-competitive contexts. *Your intuition here is sound—context matters.*

  ### The Genetic Engineering Case: IQ 100 → 115
  - **Classification**: Enhancement (no pathology addressed; elevating beyond species-typical function).
  - **Permissibility Concerns** (based on your principles):  
    - **Unfairness**: Could exacerbate inequality if only available to elites.  
    - **Imposing Norms**: Treats IQ 115 as "better," pathologizing average intelligence.  
    - **Risk-Benefit**: Unknown long-term risks for non-therapeutic intervention.  
    - **Autonomy**: Future child cannot consent.  
  - **Verdict**: Likely impermissible under your framework, mirroring Case 6 (HGH for height).

  ### A Coherent Framework: "Harm Mitigation + Anti-Coercion"
  Your judgments align with this principle:  
  *"Interventions are presumptively permissible when they mitigate significant harm or dysfunction without creating unfair social pressures. Enhancements are problematic when they medicalize non-pathological traits, exacerbate inequality, or impose narrow norms."*

  This explains why:  
  - Therapy (harm mitigation) is almost always acceptable (Cases 1-3,5,7).  
  - Low-stakes enhancements are fine (coffee, beta-blockers).  
  - Enhancements reinforcing harmful norms (HGH for height) or unfair competition (Adderall for exams) are objectionable.  
  - Boundary cases (cochlear implants) require weighing harm mitigation vs. norm imposition.

  ### Why Your Professor Is Right (But You're Not Wrong)
  The therapy/enhancement distinction *is* philosophically suspect because:  
  - It conflates **empirical** (what's "normal"?) and **normative** (what *should* be treated?) questions.  
  - "Normal function" is value-laden (e.g., is deafness a disability or identity?).  
  - It fails to explain permissibility (e.g., why is cosmetic surgery less troubling than growth hormone?).  

  Your intuitions succeed because they focus on **concrete harms and social consequences** rather than the therapy/enhancement label. Abandon the distinction as a *foundation*, but keep the ethical concerns it imperfectly represents. Your gut reactions reveal a nuanced, socially grounded bioethics—refine them, don't discard them.
