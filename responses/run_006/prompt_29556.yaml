answer: |-
  ### **The Partnership Game: A Classroom Activity on Costly Signaling**

  **Objective:** To experientially demonstrate why signals must be differentially costly to convey honest information, without using technical terms until the debrief. Participants will discover why wastefulness enables reliability, why differential cost (not just cost) matters, and why skepticism is warranted.

  **Time:** 75 minutes (15 min setup, 45 min gameplay, 15 min debrief)  
  **Participants:** 18 students (9 Signalers, 9 Receivers). Adjust pairings if numbers differ.  
  **Core Insight:** Signals work only if they are costlier for low-quality actors to fake, making honesty evolutionarily stable.  

  ---

  ### **1. Roles and Rules**  
  - **Signalers (9 players)**:  
    - Each has a hidden **quality**: **High (H)** or **Low (L)**, drawn randomly each round (5 H, 4 L cards).  
    - Chooses to **display** (show a signal) or **not display**.  
    - Pays a **cost** (tokens) if they display. Cost depends on quality and game condition.  
  - **Receivers (9 players)**:  
    - Observes their paired signaler’s **display decision** (display or not).  
    - Chooses to **partner** or **not partner**.  
    - **Never** learns the signaler’s hidden quality until after decisions.  
  - **Pairing**: Randomly paired each round.  
  - **Key Constraints**:  
    - Receivers condition decisions **only** on the display, never on hidden quality.  
    - No communication about quality between players.  

  ---

  ### **2. Materials**  
  **Prepare in advance**:  
  - **Quality Cards**:  
    - 5 cards: **"High"**  
    - 4 cards: **"Low"**  
    *(Shuffle before each round; signalers draw one secretly)*.  
  - **Display Cards** (for signalers):  
    - 9 cards labeled **"Display"** and 9 labeled **"No Display"** (reusable).  
  - **Tokens**:  
    - 300 tokens total (e.g., poker chips or printed paper).  
    - Each player starts with **25 tokens** (distribute 25 tokens × 18 players = 450 tokens; excess for costs).  
  - **Payoff Cheat Sheets** (1 per player):  
    ```  
    - If YOU ARE A RECEIVER:  
      • Partner with High: +20 tokens  
      • Partner with Low: -15 tokens  
      • No partnership: 0 tokens  

    - If YOU ARE A HIGH SIGNALER:  
      • Partnership formed: +20 tokens  
      • No partnership: 0 tokens  

    - If YOU ARE A LOW SIGNALER:  
      • Partnership formed: +20 tokens  
      • No partnership: 0 tokens  
    ```  
  - **Condition Cards** (for facilitator):  
    - **Condition 1 (Cheap-Talk)**: Display costs **0 tokens** (all).  
    - **Condition 2 (Flat-Cost)**: Display costs **10 tokens** (all).  
    - **Condition 3 (Differential-Cost)**: Display costs **8 tokens (High)**, **22 tokens (Low)**.  
  - **Whiteboard** to track round results (optional but helpful).  

  ---

  ### **3. Payoffs and Costs**  
  **Rationale**: High-quality partnerships benefit both; low-quality harms receivers. Costs are structured to ensure:  
  - **Differential Cost**: Low-quality signalers pay more for displays (22 vs. 8 tokens).  
  - **Costly Partnership**: Low-quality partnerships penalize receivers (-15) but reward signalers (+20).  
  - **Token Economics**: Starting tokens (25) cover costs. Negative tokens allowed.  

  **Payoff Details**:  
  | **Signaler Quality** | **Display Cost (Condition 3)** | **Net Gain if Partnered** |  
  |----------------------|---------------------------------|----------------------------|  
  | High                 | 8 tokens                        | 20 - 8 = **+12 tokens**    |  
  | Low                  | 22 tokens                       | 20 - 22 = **-2 tokens**    |  

  **Receiver Payoffs**:  
  - Partner with High: **+20 tokens**  
  - Partner with Low: **-15 tokens**  
  - No partnership: **0 tokens**  

  ---

  ### **4. Round Sequence (3 Conditions × 3 Rounds Each)**  
  **Order**: Cheap-Talk → Flat-Cost → Differential-Cost (to show why first two fail).  

  **Each Round (5 minutes)**:  
  1. **Assign Qualities**: Facilitator shuffles quality cards; signalers draw one (keep secret).  
  2. **Display Decision**: Signalers choose **Display** or **No Display** and pay cost (if applicable).  
  3. **Pairing**: Facilitator pairs signalers with receivers randomly.  
  4. **Receiver Decision**: Receivers observe display choice and decide **Partner** or **Not Partner**.  
  5. **Reveal & Pay**: Facilitator reveals quality to the pair; players adjust tokens based on payoffs.  

  **Conditions**:  
  - **Condition 1: Cheap-Talk (Rounds 1–3)**  
    - Display costs **0 tokens** for all.  
    - *Expected outcome*: All signalers display (free). Receivers see no difference and partner. Pooling equilibrium.  
  - **Condition 2: Flat-Cost (Rounds 4–6)**  
    - Display costs **10 tokens** for all.  
    - *Expected outcome*: All signalers display (20 - 10 = +10 > 0). Receivers still cannot distinguish. Pooling persists.  
  - **Condition 3: Differential-Cost (Rounds 7–9)**  
    - Display costs **8 tokens (High)**, **22 tokens (Low)**.  
    - *Expected outcome*: High signalers display (20 - 8 = +12); Low signalers do not (20 - 22 = -2). Receivers partner only with displayers. Separating equilibrium.  

  ---

  ### **5. Debrief (15 Minutes)**  
  **Map Game Experiences to Concepts**:  
  - **Pooling vs. Separating Equilibria**:  
    - *Cheap-Talk/Flat-Cost*: "In Rounds 1–6, did displays help you tell High from Low? No? That’s a **pooling equilibrium**—everyone signals the same, so it’s useless. In Round 7–9, displays suddenly worked. That’s a **separating equilibrium**—only High could afford them."  
  - **Differential Cost**:  
    - "Why did displays work only in Condition 3? Because **the cost was higher for Low signalers** (22 tokens) than High (8 tokens). Low couldn’t afford to fake it. Mere cost (Condition 2) wasn’t enough—it has to hurt Low more."  
  - **Skepticism & Multiple Equilibria**:  
    - "Why shouldn’t receivers trust cheap signals? In Conditions 1–2, displays were **uninformative**—anyone could afford them. And notice: in Condition 3, if receivers ignored displays and partnered blindly, Low would stop displaying and freeload. **Multiple stable outcomes** exist, so receivers must test signals."  
  - **Handicap vs. Index**:  
    - "This game mirrors **handicap signaling**: wastefulness (e.g., peacock tails) makes signals honest because only high-quality individuals can bear the cost. Contrast with an **unfakeable index** (e.g., a lion’s roar that depends on size)—no strategy, just physics."  

  **Key Takeaways**:  
  1. Wastefulness isn’t accidental—it’s what makes signals trustworthy.  
  2. Differential cost (not just cost) enables separation.  
  3. Skepticism is rational—informative outcomes aren’t guaranteed.  

  ---

  ### **6. Troubleshooting**  
  **Predictable Problems & Solutions**:  
  - **Pooling equilibrium emerges early (signalers stop displaying)**:  
    - *Why*: In Cheap-Talk/Flat-Cost, signalers realize displays don’t affect partnerships.  
    - *Fix*: Remind receivers: "Your goal is to find High partners. Use displays to decide." If pooling persists, note it in debrief as proof that cheap signals fail.  

  - **Receivers trust cheap signals ("friendly" players)**:  
    - *Why*: Early rounds, receivers may assume displays are honest.  
    - *Fix*: After Round 3 (Cheap-Talk), reveal aggregate data: "How many receivers partnered with Low? See how displays fooled you?"  

  - **Low-quality signaler complains "unfair!"**:  
    - *Why*: Differential cost penalizes Low.  
    - *Fix*: "Biologically, this mimics real constraints—e.g., weak animals can’t waste energy. The game shows why honesty requires asymmetry."  

  - **Collusion or quality-sharing**:  
    - *Why*: Players may cheat to "win."  
    - *Fix*: "Quality is private. If you share it, you break the game’s logic." Penalize offenders (e.g., forfeit tokens).  

  **Honest Limitations**:  
  - **Rational Choice vs. Evolution**:  
    - "This game assumes rational players. But in biology, **evolution** shapes signaling—traits spread if they boost survival/reproduction, not conscious strategy."  
  - **Empirical Contestedness**:  
    - "The handicap principle (Zahavi’s idea) is influential but debated. Some signals may be indices or use receiver-dependent costs. This game simplifies a complex reality."  

  ---

  **Final Note**: This game clarifies the *logic* of costly signaling. Real-world applications (e.g., animal displays, human status symbols) require empirical testing—evolution doesn’t "think," it selects.
