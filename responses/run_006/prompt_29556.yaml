     - Solution: Instruct the receivers that they should condition their decision on the display. They are allowed to have a rule like "only partner if display" or "partner if display, not otherwise". And encourage them to try to avoid low-quality signalers. In the instructions, tell receivers that their goal is to form partnerships with high-quality and avoid low-quality. And they can use the display to help.

