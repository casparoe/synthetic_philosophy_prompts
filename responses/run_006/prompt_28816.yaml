prompt: |-
  so i'm in a philosophy of language course and we just spent a couple weeks on vagueness, mostly on epistemicism vs supervaluationism. epistemicism says vague words have sharp boundaries, we just can't know where they are, so every borderline sentence is determinately true or false. supervaluationism says borderline sentences are neither true nor false — something counts as true only if it comes out true on every acceptable sharpening of the vague term.

  the thing i can't stop thinking about is how actual courts deal with vague legal language, because it seems inconsistent. on one hand, a court will strike down a statute for being void for vagueness if ordinary people can't tell what it forbids — the law is too indeterminate to give fair notice. on the other hand, the same courts decide cases all the time that turn on vague words like "reasonable", "substantial", "vehicle", or "undue", and the opinions are written as if there's a determinate right answer to whether this particular thing counts. a judge doesn't say "it's borderline, so there's no fact of the matter"; they rule, and the ruling treats one side as correct. and its not obvious those two practices fit together: if the boundary is real but unknowable, how does that square with striking laws down for not giving fair notice? if borderline cases are gappy instead, how can a court announce that one side is simply right?

  so what theory of vagueness does this practice presuppose? does deciding borderline cases commit the law to epistemicism, or can supervaluationism make sense of it by saying the court is just picking a precisification for institutional reasons while the law itself stays gappy? is the void-for-vagueness doctrine consistent with whatever the ordinary cases presuppose? reconstruct the implicit theory, say what the practice strictly presupposes vs what it merely fits with, and then take a stand on which view actually best explains what courts are doing — and what would have to change in legal practice if the other view were true.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're in a philosophy of language course, focusing on vagueness, specifically epistemicism and supervaluationism. They're confused about how courts handle vague legal terms. On one hand, courts sometimes strike down laws for being too vague (void for vagueness doctrine), arguing people can't know what's forbidden. On the other hand, courts make definitive rulings on borderline cases using terms like "reasonable" or "substantial," acting as if there's a right answer. The user wants to know which theory of vagueness this legal practice implies.

  First, I need to recall the two theories. Epistemicism says vague terms have sharp boundaries we just can't know. Supervaluationism says borderline cases are neither true nor false until a precisification is chosen. The user is pointing out a tension: how can courts demand clear boundaries for fair notice (void for vagueness) but then decide borderline cases as if there's a determinate answer?

  Looking at void for vagueness, the key is fair notice and preventing arbitrary enforcement. This seems to align with supervaluationism because it emphasizes the lack of a definite boundary, making the law too indeterminate. However, when courts decide cases, they treat borderline instances as having a correct outcome, which feels epistemicist. But judges don't claim to know the precise boundary; they justify decisions contextually. That sounds like supervaluationism's precisification.

  The user might be a law student or someone interested in how philosophy applies to real institutions. Their deeper need could be understanding whether legal practice is philosophically consistent or if it's pragmatic. They might also want to explore if courts should change their approach based on these theories.

  I should analyze both doctrines. Void for vagueness requires clarity, which supervaluationism explains well—no truth in borderline cases means no fair notice. But when courts rule on borderline cases, they're not discovering a hidden boundary; they're setting a precedent, which fits supervaluationism's idea of selecting a precisification. This institutional choice provides determinacy for the system but doesn't negate the term's vagueness. 

  Epistemicism doesn't fit because if boundaries were sharp but unknowable, courts couldn't strike down laws for vagueness—they'd just say the boundary exists but is unknown. That contradicts void for vagueness. Also, judges don't claim hidden knowledge; they use context and policy, which aligns with precisification.

  The user might wonder if courts are contradicting themselves. But the implicit theory is a hybrid: supervaluationism explains vagueness itself, while courts use institutional decisions to create determinacy. Void for vagueness applies when terms lack any acceptable precisifications or enforcement is arbitrary. When courts decide cases, they're narrowing the range of acceptable precisifications.

  If epistemicism were true, void for vagueness wouldn't make sense, and courts would need to admit they're guessing at hidden truths, which isn't how they operate. If supervaluationism were adopted, practice might not change much, but courts might explicitly state they're precisifying. However, this could cause confusion or erode authority.

  In conclusion, legal practice presupposes supervaluationism for vagueness but uses institutional mechanisms to resolve indeterminacy. The best explanation is supervaluationism with a pragmatic layer of judicial precisification. The void-for-vagueness doctrine and case rulings cohere under this view, while epistemicism creates inconsistencies.
answer: |-
  Your observation captures a profound tension in legal practice, reflecting a **pragmatic institutional hybrid** that leans heavily toward **supervaluationism** but incorporates elements that *resemble* epistemicism in outcome without committing to its metaphysics. Here's a reconstruction of the implicit theory, its consistency, and which view best explains the practice:

  ### 1. **The Implicit Theory: Supervaluationism + Institutional Precisification**
     - **Core Presupposition**: Courts treat vague terms as having a *range of acceptable precisifications* (supervaluationism), not sharp boundaries. Borderline cases are genuinely indeterminate *before* adjudication.
     - **Institutional Necessity**: Courts *must* resolve disputes definitively (no "gappy" verdicts in practice). To do this, they **select a specific precisification** from the acceptable range, rendering a determinate ruling. This is *not* discovering a hidden boundary (epistemicism) but **exercising normative authority** to settle uncertainty.
     - **Void for Vagueness**: A statute is struck down when:
       - (a) No *reasonable/precise enough* core cases exist to anchor interpretation, **OR**
       - (b) The range of acceptable precisifications is so wide that enforcement becomes arbitrary, violating due process ("fair notice").
       This doctrine *presupposes indeterminacy*—aligning perfectly with supervaluationism’s "gappiness" in borderline zones.

  ### 2. **How the Practices Fit Together**
     - **Ordinary Adjudication**: 
       - *Example*: Deciding if an e-scooter is a "vehicle" under a statute. The court examines context, purpose, and precedent, then declares: "For this law, e-scooters *are* vehicles." 
       - **Supervaluationist Explanation**: The term "vehicle" had multiple acceptable precisifications; the court *selects one*, collapsing indeterminacy for institutional purposes (finality, consistency). The ruling doesn’t imply the boundary was always sharp—it *creates* a boundary.
       - **Epistemicism Incompatible**: If boundaries were sharp but unknowable, courts would *never* need to strike down vague laws—they’d insist boundaries exist but are hard to discern. Yet they do strike them down, acknowledging fundamental indeterminacy.
     
     - **Void for Vagueness**:
       - *Example*: A law banning "annoying conduct" is void—no "core" of obvious violations exists, and "acceptable precisifications" vary wildly (e.g., loud speech vs. littering).
       - **Supervaluationist Foundation**: The doctrine explicitly rejects epistemicism by saying vagueness *itself* violates due process when precisifications diverge too far. Fair notice fails because people *can’t know* which precisification enforcers will use.

  ### 3. **What Legal Practice *Strictly* Presupposes vs. What It *Fits With***
     - **Strict Presupposition**: 
       - Vagueness *requires* normative choice in borderline cases (rejecting epistemicism’s "fact of the matter").
       - Law must be *sufficiently determinate* to guide conduct (rejecting permanent "gappiness" in practice).
     - **Fits With**: 
       - Supervaluationism’s ontology of vagueness (indeterminacy in borderline zones).
       - A *pragmatic theory of adjudication*: Courts act as "institutional precisifiers."

  ### 4. **Which View Best Explains Legal Practice? Supervaluationism**
     - **Why?** 
       - Epistemicism cannot explain void-for-vagueness doctrine: if boundaries are sharp (but unknowable), striking down statutes for vagueness is incoherent—people could theoretically guess wrong about a sharp boundary, but the law wouldn’t be *inherently* unfair.
       - Supervaluationism explains *both* strands: 
         - Vagueness is indeterminacy → justifies voiding statutes when indeterminacy is excessive.
         - Courts resolve disputes by precisifying → explains definitive rulings without positing unknowable truths.
       - Judges *never* say, "The boundary exists but is hidden"; they appeal to policy, context, and precedent—factors that *shape* precisifications, not *discover* boundaries.

  ### 5. **What Would Change if the Other View Were True?**
     - **If Epistemicism Were True**:
       - Void-for-vagueness doctrine would collapse. Courts would say: "Statutes have precise boundaries; citizens’ ignorance is their problem." Fair notice would mean "possible to guess correctly," not "possible to know."
       - Adjudication would involve "evidence of hidden boundaries" (e.g., linguistic experts testifying on the "true" meaning of "reasonable"), not normative arguments.
       - **Result**: Law becomes more rigid, arbitrary, and less justifiable—contradicting modern due process.
     
     - **If "Pure" Supervaluationism Were Adopted (No Precisification)**:
       - Courts would issue "indeterminate" rulings in borderline cases (e.g., "This conduct is neither clearly reasonable nor unreasonable"). 
       - **Result**: Legal system freezes—no resolution for disputes in gray areas, undermining law’s function.

  ### Conclusion: A Defensible Hybrid
  Courts implicitly treat vagueness as **ontologically indeterminate** (supervaluationism) but **institutionally resolvable**. By precisifying terms, they *create* determinacy where none existed, maintaining legitimacy through reasoned decisions. The void-for-vagueness doctrine acts as a check against *excessive* indeterminacy, ensuring precisifications remain within a "tolerable range." This practice is philosophically coherent **only under supervaluationism**, as epistemicism renders void-for-vagueness nonsensical. Legal practice isn’t inconsistent—it’s a sophisticated response to vagueness that prioritizes justice and functionality over metaphysical purity.
