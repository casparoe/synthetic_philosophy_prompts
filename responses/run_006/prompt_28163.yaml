answer: |-
  Here's a translation of the methodological individualism (MI) vs. holism debate into the vocabulary of statistical mechanics (SM) and emergent phenomena, followed by a residue report, clearly separating ontological/explanatory individualism and distinguishing settled from contested views.

  **Core Concepts Translated:**

  1.  **Ontological Individualism (OI):** *"Social facts are nothing over and above facts about individuals."*
      *   **SM Translation:** *Supervenience*. Social macrostates (institutions, norms, aggregate behaviors) are *supervenient* upon the microstate of individuals (their beliefs, desires, relationships, actions). There is no "social stuff" independent of the constituent individuals and their interactions. A change in a social macrostate *necessitates* a change in the underlying individual microstates, just as a change in the pressure/temperature of a gas necessitates a change in the positions/momenta of its molecules. This is analogous to the microstate determining the macrostate.
      *   **Status:** Widely accepted among physicalists/philosophers of mind as a minimal commitment for non-mysterious emergence. Strong OI claims (e.g., social facts are *identical* to individual facts) are more contested, but supervenience is the core consensus position for physicalism about the social.

  2.  **Methodological Individualism (MI - Explanatory):** *"Social explanations should bottom out in facts about individuals."*
      *   **SM Translation:** *Reductionism & Microfoundations*. The *only* or *best* explanations for social macrostates/phenomena are those that explicitly derive them from the rules governing individual agents and their interactions – the micro-dynamics. Just as explaining why water boils requires understanding molecular kinetic energy and intermolecular forces, explaining inflation or a social movement requires modeling individual decisions and interactions. Effective higher-level theories (like thermodynamics) are merely computational shortcuts or summaries; the *real* causal work is done at the micro-level.
      *   **Status:** Highly contested. While microfoundations are valued, MI often implies that *only* micro-explanations are fundamental or complete.

  3.  **Holism (Ontological & Methodological):** *"Social entities/structures are real and causally efficacious in ways irreducible to individuals."*
      *   **SM Translation:** *Strong Emergence & Downward Causation*. Social macrostates (e.g., institutions, norms, class structures, languages) are *ontologically novel* entities that emerge from individual interactions but possess *their own causal powers* that constrain, enable, or directly influence the behavior of individuals (downward causation). They are irreducible in principle, not just practice. Think of a phase (like solid ice) having properties (rigidity, crystal structure) that fundamentally alter the dynamics of individual water molecules *and* cannot be predicted solely from knowing the properties of isolated molecules or pair interactions. Renormalization Group (RG) fixed points represent *stable collective patterns* that dictate the long-term behavior of the system, irrespective of microscopic details.
      *   **Status:** Highly contested. While weak emergence (patterns arising from complex micro-interactions) is universally accepted, strong emergence (novel causal powers irreducible to micro) is rejected by most physicalists as incompatible with supervenience.

  **The Debate Translated:**

  *   **OI vs. Holism (Ontological):** Is the supervenience base *only* individual psychological/physical states & local interactions (OI), or do genuinely *social* properties/relations emerge as part of the fundamental ontology (Holism)? OI argues social properties *are* configurations of individuals. Holism argues they are *new kinds* of entities.
  *   **Explanatory MI vs. Holism/Methodological Holism:** Can social phenomena *only* be completely explained by tracing the causal chain down to individual actions and interactions (Explanatory MI), or do explanations invoking irreducible social structures, systems, or functions provide genuine, autonomous, and often superior explanations (Holism)? MI sees macro-social laws as effective theories like thermodynamics; Holism sees them as fundamental laws governing a distinct ontological level, like laws describing phase behavior.

  **Residue Report:**

  1.  **Translated Cleanly:**
      *   **Supervenience (OI):** Maps directly. Social macrostates supervene on individual microstates, full stop. Settled among physicalists.
      *   **Patterns & Aggregate Behavior:** Concepts like statistical regularities, phase transitions (sudden social change), path dependence, and feedback loops map well to emergence in SM. Describing how order arises from local interactions is common ground.
      *   **Effective Theories:** The idea that we use high-level descriptions (macroeconomics, sociology) for practical reasons, knowing they rest *in principle* on a micro-foundation (psychology, rational choice), aligns cleanly with how thermodynamics relates to statistical mechanics. Contested whether these are *merely* effective or fundamentally explanatory.
      *   **Constraints:** Social structures/institutions constraining individual action map well to boundary conditions or fixed collective parameters (like RG fixed points) constraining micro-dynamics.

  2.  **Bent to Fit (Significant Conceptual Strain):**
      *   **Downward Causation:** In SM, "downward causation" (e.g., temperature gradient causing molecular drift) is uncontroversial *but reducible*. The macro-property is a statistical feature of the micro-dynamics. Holists claim *irreducible* downward causation – social facts causing individual actions *as social facts*, not just as summaries of micro-states. This is the core point of contention. Can norms *as norms* cause behavior, or is it always the individual's *internal representation* of the norm? SM lacks the semantic/intentional component to resolve this cleanly.
      *   **Function & Teleology:** Social holism often uses functional explanations (e.g., "the function of religion is social cohesion"). SM has no direct analogue for purpose or function outside of intentional agents. Mapping this requires smuggling in intentionality at the micro-level (individuals have goals) or accepting irreducible system-level teleology (highly contested and problematic for physicalists).
      *   **Autonomy of Higher Levels:** The holist claim that social science laws are *autonomous* (not derivable in principle, or only with infinite computational resources) maps to the idea in physics that effective field theories are indispensable. But MI insists this is *only* epistemological/practical, not ontological. The bending occurs around "in principle" irreducibility claims.

  3.  **No Counterpart / Major Residue (Reasons, Norms, Meaning):**
      *   **Intentionality / Reasons:** The core driver of social action – individuals acting *for reasons* (beliefs, desires, goals) – has no counterpart in fundamental physics or basic SM. Particles don't have reasons; they follow dynamical laws. While *models* of rational agents can be built *within* the SM framework (e.g., agent-based models), the *semantic content* of beliefs/desires ("I believe inflation will rise", "I desire social justice") resists reduction to physics/SM vocabulary. This is the core of the "explanatory gap" for consciousness/intentionality, directly impacting social explanation.
      *   **Norms:** Norms involve *evaluative* and *prescriptive* force ("ought"). A norm isn't just a statistical regularity (like most molecules moving right); it carries obligation, potential sanction, and meaning. SM can model conformity *behavior*, but not the *normativity* itself – why an individual feels *bound* by the norm or attributes authority to it. This residue points to the irreducibility of semantics and values.
      *   **Meaning (Semantics):** Language, symbols, shared meanings, and cultural interpretations are fundamental to social phenomena. The meaning of a word, a ritual, or a law is not reducible to the physical states of individuals or their statistical patterns in the way pressure reduces to molecular motion. It depends on complex networks of intentional states and historical context. SM lacks the resources to capture semantic content.
      *   **Interpretation / Hermeneutics:** Much social science involves *interpreting* meanings, intentions, and cultural contexts. This hermeneutic aspect has no analogue in SM, which deals with objective measurement and dynamical laws.

  **Verdict on the Residue:**

  The residue primarily marks **a genuine gap in the physicalist/statistical mechanics vocabulary**, specifically concerning **intentionality, semantics, and normativity**.

  *   **Why a Gap?** Physics/SM describes *causal structure* and *statistical patterns* based on dynamical laws governing non-intentional components. Social phenomena are intrinsically bound up with agents who have *mental states with representational content* (beliefs, desires) and act based on *reasons* and *meanings*, governed by *norms*. These concepts involve "aboutness" (intentionality) and "oughtness" (normativity) that current physical theories do not encompass.
  *   **Less Precise Holism?** While some holist claims (e.g., overly vague appeals to "society acting") can be imprecise, the core residue concerning reasons, norms, and meaning highlights limitations of the *reductionist physicalist framework itself* when applied to the socio-mental domain. Holists often point to this residue as evidence for the *sui generis* nature of the social, but they struggle to provide a *non-mysterious* physicalist account of intentionality/normativity. Reductionists (Explanatory MI) either bite the bullet and try to reduce reasons/norms/meaning to complex functional/causal roles (a major philosophical project with limited consensus success) or dismiss them as epiphenomenal (deeply unsatisfying for social science).

  **Settled vs. Contested:**

  *   **Settled (among physicalists):** Social facts supervene on facts about individuals (Ontological Individualism / Supervenience). Complex systems exhibit weak emergence (patterns not obvious from micro-dynamics alone). Effective higher-level descriptions are often necessary and useful.
  *   **Genuinely Contested:** Whether strong emergence/downward causation exists in the social realm. Whether explanations *must* bottom out in individual psychology/physics to be complete/fundamental (Explanatory MI vs. Methodological Holism). Whether reasons, norms, and meaning can be fully naturalized/reduced within the physicalist framework, or if they represent a fundamental ontological gap. The ontological and causal status of social structures (are they just patterns or real entities?).

  In essence, the SM framework brilliantly illuminates patterns, constraints, supervenience, and weak emergence in social systems. However, the very heart of the social – the realm of *meaning*, *reasons*, and *norms* – exposes a fundamental limitation of the vocabulary of non-intentional dynamics and statistics, pointing to the persistent challenge of integrating intentionality into the physical world. The contestation largely revolves around how to handle *that* residue.
