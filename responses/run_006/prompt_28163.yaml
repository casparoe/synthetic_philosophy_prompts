prompt: |-
  I've spent years reading rationalist blogs and forums and following their debates about reductionism and emergence, and I have a working physicist's understanding of statistical mechanics — microstates and macrostates, phase transitions, renormalization group, effective theories, supervenience — but no training in the philosophy of social science. Restate the debate between methodological individualism and holism in that vocabulary, as faithfully as you can. In particular, keep explanatory individualism (social explanations should bottom out in facts about individuals) separate from ontological individualism (social facts are nothing over and above facts about individuals), since I suspect they translate very differently. Then give me a residue report: which claims translate cleanly, which had to be bent to fit, and which have no counterpart in the statistical-mechanics picture at all — I'm thinking especially of claims about reasons, norms, and meaning. I want your verdict on whether the residue marks a gap in the physicalist vocabulary or a place where the holist position was less precise than it looked. Throughout, separate what is settled among people who know this literature from what is genuinely contested, and don't present a contested view as the consensus.
