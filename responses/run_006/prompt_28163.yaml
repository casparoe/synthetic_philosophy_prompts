  The user mentioned reasons, norms, and meaning as potential residues. These are key because they involve intentionality and semantics, which don't have direct parallels in physics. Emergence in physics is about patterns and behaviors, but social norms carry meaning and purpose, which are harder to reduce. 

  I should check if the reductionism in physics applies cleanly to social sciences. Phase transitions and RG methods show how macro behaviors emerge, but social systems have feedback loops where macro structures influence individuals. That's different from most physical systems where micro components don't interpret or react to macro states. 

  The residue report needs to highlight where the mapping works and where it breaks. Ontological individualism translates well via supervenience. Explanatory individualism faces challenges because higher-level explanations in social sciences often can't be reduced without losing essential context. Reasons and norms are problematic because they involve intentional states, which aren't part of physical systems. 

  I need to clarify which parts are settled vs. contested. Supervenience is widely accepted in philosophy of mind and physics. But explanatory reductionism is contested—some argue higher-level explanations are necessary. The residue might indicate a gap in physicalist vocabulary, especially regarding intentionality. But it's also possible that holist claims lack precision when describing how norms supervene on individuals. 

