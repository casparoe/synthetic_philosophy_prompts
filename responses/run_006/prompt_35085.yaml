prompt: |-
  I've been teaching an introductory ethics course this semester, and we just finished a unit on Kant's Groundwork. The universalizability test has been the hardest thing to teach, not because the students don't get the mechanics, but because I've realized I don't have a stable grip on it myself. The idea, roughly, is that an action is permissible only if the maxim on which you act could be willed as a universal law without contradiction — with the contradiction being either in the very conception of the maxim as universal law, or in the agent's ability to rationally will such a world. But as I've worked through cases with my students, my own intuitive verdicts about which maxims pass and which fail have come apart from any single formulation of the test I can state cleanly. I'm hoping you can help me extract whatever principle is actually driving my judgments.

  Here are my verdicts on a set of maxims, each stated as the agent would formulate it, including the relevant circumstances:

  1. "When I need money and a lender requires a promise of repayment, I will promise to repay even though I know I cannot." — Fails. The standard case: universalizing this undermines the institution of promising, so the maxim cannot even be conceived as universal law.

  2. "When an innocent person is hiding in my house and a would-be murderer asks where they are, I will lie and say I do not know." — Passes. A world where everyone lies to murderers to protect the innocent is perfectly coherent and, if anything, better than the alternative.

  3. "I will never help anyone in distress, because I prefer to devote all my resources to my own comfort." — Fails. I can conceive of this world, but I cannot rationally will it, since I would be willing away the assistance I might someday need myself.

  4. "I will spend my Sunday mornings playing tennis at the public courts." — Passes. No issue of either kind.

  5. "When I can cheat on my taxes with no risk of being caught, I will do so." — Fails. If everyone did this, the tax system would collapse; the practice of taxation would become incoherent.

  6. "I will break a promise to meet a friend whenever keeping it would be mildly inconvenient." — Fails. Like case 1, universalizing this destroys the practice of promising.

  7. "I will never lie, under any circumstances, no matter the consequences." — Passes. A world of universal truth-telling is perfectly coherent and rationally willable.

  8. "I will refuse to cultivate any of my talents, preferring a life devoted entirely to idle amusement." — Fails. I can conceive of it, but I cannot rationally will a world in which no one develops their capacities.

  9. "When I see someone drowning in a shallow pond and saving them would ruin my expensive shoes, I will walk past." — Fails. This feels like it should fail the contradiction-in-conception test: if no one ever performed easy rescues, the very concept of a rescue — and perhaps the expectations that make social life possible — would erode.

  10. "I will give to charity only when my donation is publicly recognized and enhances my social standing." — Passes. The maxim does not generate a contradiction in conception (charitable giving still occurs), and while the motive is not admirable, I can rationally will a world where all charitable giving is reputationally motivated, since the giving still gets done.

  Here is what bothers me. Cases 2 and 7 both pass, yet they seem to be in tension: if I universalize "never lie," I cannot lie to the murderer; if I universalize "lie to murderers to save the innocent," I cannot also will "never lie." So passing the test apparently does not require consistency across the set of maxims one adopts — but then what normative work is the test doing? More acutely, I cannot tell what principle distinguishes case 10 (passes) from case 5 (fails). Both involve free-riding on a cooperative scheme while hoping others comply. Is there a principled difference, or am I simply inconsistent? And case 9 versus case 3: both are failures of beneficence, but case 9 feels like it should fail the contradiction-in-conception test, while case 3 feels like it fails only the contradiction-in-willing test — yet I cannot articulate what feature of a maxim determines which kind of contradiction it generates.

  What I would like from you: first, state as precisely as you can the principle or small set of principles that best captures my verdicts across these ten cases, making explicit what triggers each kind of failure and what suffices for passing. Second, tell me which of my verdicts, if any, the principle forces me to revise, and why. Third, apply the principle to a case I have not considered: "When a medical researcher can make faster progress toward a cure by running an experiment that involves a small amount of deception of the participants, with no lasting harm and full debriefing afterward, she will do so." What does your principle say about this maxim, and does that verdict seem right? Please write your answer in American English.
reasoning: |-
  Okay, the user is an ethics professor teaching Kant's universalizability test and struggling with inconsistencies in their own judgments across different cases. They've provided ten maxims with their verdicts and highlighted tensions, especially between lying to murderers (passes) vs never lying (also passes), and reputation-based charity (passes) vs tax cheating (fails). 

  Hmm... their core frustration seems to be that the test feels like a mechanical procedure but their intuitive judgments require contextual nuance they can't systematize. The murderers/lying tension is particularly thorny - it reveals that maxim formulation is doing heavy lifting. When they say case 9 (walking past drowning person) "feels" like contradiction-in-conception but case 3 (never helping) is contradiction-in-willing, they're sensing Kant's distinction between perfect/imperfect duties but wrestling with its application.

  For the principle extraction: Their judgments consistently punish maxims that destroy social practices (promising/taxation) but allow "local" maxims that don't systemically corrode institutions (lying to murderers). Reputation-based charity passes because it doesn't collapse giving - it merely alters motives, unlike tax cheating which destroys the system. This suggests they're prioritizing institutional sustainability over motive purity. 

  The medical deception case is fascinating. If the maxim specifies "small deception for medical progress with debriefing," it might pass because universalizing wouldn't destroy research ethics - debriefing preserves trust. But if phrased broadly as "deceive when convenient for science," it'd likely fail by eroding informed consent. The professor's implicit principle would demand examining whether the practice could survive universal adoption without self-destruction.

  Ah - and I should flag that their case 9 verdict might need revision. Calling it contradiction-in-conception overreaches; Kant would classify easy rescues as imperfect duty failures (contradiction-in-willing). They're perhaps conflating social erosion with logical contradiction. That's the trap: Kant's test cares about logical coherence of the maxim universalized, not consequences. Their intuition that "society would break down" is consequentialist thinking sneaking in.

  ...Which explains why they're uneasy. Their judgments are hybrid - mostly Kantian but with utilitarian leakage in cases 2 and 9. No wonder they can't find a clean formulation!
answer: |-
  Based on your verdicts across the ten cases, your intuitive application of the universalizability test prioritizes **the sustainability of fundamental social practices and the preservation of rational agency itself**. Here's the principle extracted from your judgments:

  **The Principle of Sustainable Rational Agency (SRA):**
  A maxim passes the universalizability test if and only if:
  1.  **Universal Conception Test (UCT):** The practice or institution essential to the maxim’s *successful execution* remains logically or practically coherent when universalized. Failure occurs if universalization makes the practice *impossible* or *self-defeating*.
  2.  **Rational Willing Test (RWT):** The agent can rationally will the universalized world without undermining their own status as a rational agent or the foundational conditions necessary for rational agency (including basic well-being and the development of human capacities). Failure occurs if universalization creates a world the agent *cannot rationally endorse given their own needs as a rational being*.

  **Application to Your Cases & Trigger Explanation:**

  1.  **False Promise:** **Fails (UCT).** Universalization destroys the institution of promising (making promises impossible), violating UCT.
  2.  **Lie to Murderer:** **Passes (UCT/RWT).** A world where everyone lies to murderers remains coherent (promising isn't destroyed, truth-telling persists in other contexts). Willing this world aligns with preserving life (a condition for rational agency) and doesn't undermine any essential practice *necessary for the lie itself*.
  3.  **Never Help:** **Fails (RWT).** While conceivable (UCT passes), universalization creates a world where no help exists. As a rational agent who might need help to pursue ends/preserve agency, you cannot rationally will this world (RWT fails).
  4.  **Play Tennis:** **Passes (UCT/RWT).** Universalization of harmless leisure activity causes no contradiction. No essential practice is undermined, and it doesn't harm the conditions for rational agency.
  5.  **Cheat on Taxes:** **Fails (UCT).** Universalization destroys the tax system (making tax collection impossible), which is essential for the *success* of the cheating (you need a system to cheat *within*). Violates UCT.
  6.  **Break Promise for Convenience:** **Fails (UCT).** Identical to #1. Universalization destroys promising, violating UCT.
  7.  **Never Lie:** **Passes (UCT/RWT).** A world of universal truth-telling is coherent and rationally willable (promoting trust, a foundation for rational interaction). While potentially harmful in *specific* cases (like #2), the *practice itself* remains intact and sustainable.
  8.  **Never Cultivate Talents:** **Fails (RWT).** While conceivable (UCT passes), universalization leads to a world where human capacities atrophy. As a rational agent dependent on developed capacities (your own and others') to set and pursue ends effectively, you cannot rationally will this world (RWT fails).
  9.  **Walk Past Drowning Person:** **Fails (RWT).** *Your verdict needs revision.* According to SRA, this should **Fail (RWT)**, not UCT. Universalizing easy non-rescue doesn't logically destroy the *concept* of rescue or make rescue impossible (some might still rescue). However, willing a world where no one performs easy rescues undermines the basic well-being necessary for rational agency (people die easily preventable deaths). You cannot rationally will this world knowing you might need such help. *Your intuition that it "should" be UCT stems from conflating the erosion of social expectations (consequential) with the logical self-defeat of a practice (Kantian UCT).*
  10. **Charity for Recognition:** **Passes (UCT/RWT).** Universalization doesn't destroy charitable giving (the practice continues, UCT passes). While the motive is imperfect, the giving still occurs, meeting basic needs (preserving potential recipients' rational agency). You *can* rationally will this world as the giver – your social standing is enhanced, and help is available if you ever need it, even if motivated by others' desire for status (RWT passes).

  **Resolving the Tensions:**

  *   **Cases 2 & 7:** SRA resolves this by focusing on the *specific institution/practice targeted by the maxim*. #7 ("Never Lie") universalizes the practice of truth-telling itself and finds it sustainable. #2 ("Lie to Murderer") universalizes a *specific exception* within the broader, still-sustainable practice of truth-telling. The test applies to individual maxims, not the entire set. Passing only means *that specific maxim* can be universalized without contradiction; it doesn't guarantee consistency with *every other possible* universalizable maxim. Kant's test is a necessary condition for permissibility, not a comprehensive decision procedure guaranteeing conflict resolution.
  *   **Case 5 (Fails) vs. Case 10 (Passes):** The key difference is **institutional reliance vs. motivational contingency**.
      *   Cheating on taxes (#5) *parasitically relies* on the existence of a functioning tax system *for the cheating to be possible or beneficial*. Universal cheating destroys the very system it needs, violating UCT.
      *   Giving for recognition (#10) does *not* destroy the practice of charity. Charity continues, funded by reputation-seeking motives. The giver doesn't *rely* on others having pure motives for their own action to succeed (getting recognition). The institution (charity) remains functional under universalization, passing UCT. The motive is criticizable under other Kantian ideas (e.g., the Formula of Humanity), but passes the universalizability test as you applied it (SRA).
  *   **Case 3 (Fails - RWT) vs. Revised Case 9 (Fails - RWT):** Both fail the RWT for the same core reason: willing a world without easy beneficence/help undermines the agent's own potential needs as a rational being. The maxim in #9 doesn't target an institution like promising or taxation in a way that makes it self-defeating logically (UCT), hence the revision to RWT failure.

  **Application to the Medical Research Case:**

  *   **Maxim:** "When a medical researcher can make faster progress toward a cure by running an experiment that involves a small amount of deception of the participants, with no lasting harm and full debriefing afterward, she will do so."
  *   **Analysis using SRA:**
      *   **UCT:** Can we conceive a world where *all* medical research involves minor deception (with debriefing and no lasting harm) for faster progress? The practice of medical research *could* still function. Informed consent norms would be altered, but not necessarily destroyed, especially given the safeguards (no lasting harm, debriefing). The deception is framed as instrumental and limited. *Likely passes UCT.*
      *   **RWT:** Can the researcher rationally will this universalized world? As a potential research participant, would she will entering studies knowing she *might* be subject to minor deception (even with safeguards)? If she values both medical progress *and* personal autonomy/truthfulness, there might be a conflict. However, the safeguards (small deception, no lasting harm, debriefing) mitigate the harm to autonomy. If she judges the trade-off (slightly eroded trust/autonomy for faster medical progress benefiting all, including herself) as rational, she *could* will it. *Likely passes RWT, but this is closer.*
  *   **Verdict:** **Passes** the universalizability test under SRA.
  *   **Does it seem right?** This verdict aligns with many Institutional Review Board (IRB) practices that *do* allow some forms of mild deception in research under strict conditions (minimal risk, scientific necessity, debriefing), precisely because universalizing such a *carefully constrained* practice doesn't destroy medical research or make it impossible for individuals to rationally will participating in it, given the safeguards and benefits. However, it highlights the importance of the maxim's *specific formulation* (e.g., "small amount," "no lasting harm," "debriefing"). A broader maxim like "deceive research participants when convenient for science" would likely fail both tests.

  This principle (SRA) captures the core of your judgments by focusing on whether universalization destroys an essential enabling practice (UCT) or creates a world incompatible with the agent's own needs as a rational being (RWT), while accommodating context through maxim formulation. The necessary revision was for Case 9, shifting it from a perceived UCT failure to an RWT failure.
