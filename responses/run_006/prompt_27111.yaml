answer: |-
  ### Final Exam Essay Question  
  **"Kripke’s Wittgenstein rejects dispositionalism primarily because it fails to account for the *normativity* of meaning (e.g., the fact that ‘+’ *ought* to apply to 68+57=125, not 5). Yet critics argue the skeptical solution reduces meaning to communal agreement, which is merely descriptive. Does the skeptical solution salvage meaning’s normativity, or does it covertly collapse into a new form of dispositionalism? Defend your answer by analyzing the *structure* of ‘correctness’ in assertion conditions versus the normative ‘ought’ motivating the paradox."**

  ---

  ### Model Answer (650 words)  
  Kripke’s skeptical paradox exposes a crisis in meaning: no fact (including dispositions) can ground what a speaker *ought* to mean by a rule. Dispositionalism fails because it conflates what we *would* do (e.g., say ‘125’ when asked ‘68+57’) with what we *should* do—a normative gap that leaves no room for error. The skeptical solution seemingly rescues meaning by shifting to communal assertion conditions: “Jones means addition by ‘+’” is justified iff the community agrees with his responses. But this move risks reducing normativity to descriptive consensus, echoing dispositionalism’s failure. I argue that while the skeptical solution *formalizes* normativity through social sanction, it cannot ground the *authority* of the “ought,” rendering it normatively inert.  

  The normative failure of dispositionalism is categorical. If meaning were defined by my dispositions, then whatever I’m inclined to say (e.g., ‘5’ for ‘68+57’) is *by definition* correct. Error becomes impossible, as deviations are merely new dispositions (PI §202; Kripke p. 24). Crucially, this violates the intuition that rules *bind* us: if I meant addition, ‘125’ is right *regardless* of my inclinations. The “ought” here is prescriptive, not predictive.  

  The skeptical solution replaces truth conditions with assertibility conditions. “Jones means addition” is assertible when the community agrees with his answers. Correctness now hinges on collective behavior, not private facts. Yet this invites two objections:  
  1. **Descriptive Collapse**: If correctness *is* agreement, then “Jones ought to say ‘125’” reduces to “The community *would* say ‘125.’” This mirrors dispositionalism’s conflation of “should” and “would,” but at the communal level.  
  2. **Authority Problem**: *Why* should Jones defer to the community? If the answer is “because the community *does* reject deviations,” this grounds obligation in power, not normative validity. The solution describes a *practice* of correction but cannot explain why that practice is *right* (cf. PI §258).  

  Proponents might retort that normativity emerges from the *internal structure* of the practice. In calling Jones’ answer ‘wrong,’ the community invokes a standard *within* the language game, creating a space for ought-claims (e.g., “You *should* follow *this* rule”). However, this merely relocates the problem. The communal standard itself lacks normative foundations—it is a brute fact of behavior. Kripke’s analogy to Hume (pp. 92–93) is telling: just as Hume reduces causation to custom, Kripke reduces meaning to convention. But customs lack intrinsic authority; they merely describe how we act.  

  The deepest tension is this: **The skeptical solution presupposes normativity while evacuating its content**. Assertion conditions *regulate* discourse (e.g., forbidding “Jones means addition” when he errs) but offer no *justification* beyond circular appeals to the practice itself. When we say, “Jones *ought* to say ‘125,’” the skeptical solution interprets this as “We *do not accept* ‘5’”—a descriptive fact. The prescriptive force of the “ought” dissolves into social pressure. Paradoxically, the solution designed to rescue normativity from dispositionalism enacts the same reduction, shifting the locus from individual to group dispositions.  

  Ultimately, the skeptical solution cannot preserve the *robust* normativity that motivated the paradox. It provides a pragmatic account of meaning-attributions but reduces correctness to consensus, leaving the binding force of rules unexplained. Normativity becomes a feature of linguistic enforcement, not meaning itself. This outcome suggests Wittgenstein’s aim was therapeutic: not to ground normativity, but to dissolve the illusion that it requires metaphysical foundations.  

  ---

  ### Marking Scheme  
  **A Answer (Exemplary)**  
  - **MOVE 1**: Explicitly contrasts dispositionalism’s normative failure (collapse of “ought” into “would”) with the communal “would” in the skeptical solution.  
    *→ Common error: Claims dispositionalism fails only on error/mistake, ignoring the normative gap.*  
  - **MOVE 2**: Identifies the *authority problem*: Why *should* individuals defer to the community? Distinguishes social *sanction* from normative *justification*.  
    *→ Common error: Equates normative force with community enforcement.*  
  - **MOVE 3**: Argues that assertion conditions formalize normativity as *regulation within a practice* but fail to ground the *authority* of the “ought” (appeals to practice are circular/descriptive).  
    *→ Common error: Asserts that communal standards “create” normativity without critiquing their foundation.*  
  - **MOVE 4**: Diagnoses the structural parallel: Both solutions reduce normativity to facts (individual/communal dispositions).  
    *→ Common error: Treats communal agreement as inherently normative.*  

  **B Answer (Competent but Superficial)**  
  - Accurately summarizes the paradox and skeptical solution.  
  - Notes that dispositionalism conflates “should” and “would” but does not extend this to communal agreement.  
  - Claims the skeptical solution “saves” normativity via community standards but does not interrogate their authority.  
  - Misses Move 2 or 3; often conflates normativity with regularity.  

  **C/D/F**: Misstates the paradox/solution; ignores normativity; conflates meaning with behavior.  

  ---  
  **Rationale**: This question forces engagement with the *regress* of justification. An A answer exposes how the skeptical solution’s “correctness” is just as descriptive as dispositionalism’s, revealing the intractability of grounding normativity without metaphysics. Students must see that Kripke’s move *transfers* the problem but doesn’t solve it.
