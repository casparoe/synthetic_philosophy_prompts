  Social media validation is quantifiable and often from anonymous masses. That's different from Hegel's concrete other. The user might be interested in why online validation feels unsatisfying. They might be connecting this to modern issues like anxiety from social media or identity politics. Deeper needs could be understanding the philosophical roots of these issues or seeking a critique of superficial online interactions.

