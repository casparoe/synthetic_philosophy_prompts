answer: |-
  Based on Tolstoy's explicit criteria in *What is Art?* and the pattern of his verdicts, analyzing "We Shall Overcome" presents a fascinating tension. Here's a breakdown of how he would likely judge it, drawing on your excellent compilation:

  1.  **Strong Points in Favor (Likely Praise):**
      *   **Infectiousness & Accessibility:** Its musical and lyrical simplicity ensures anyone can sing and understand it, fulfilling his demand for universal intelligibility ("understandable to everyone, regardless of education"). Its documented power to move crowds aligns perfectly with his core criterion of infectiousness ("genuinely moves people... crowds singing it and weeping"). This mirrors his praise for folk songs, *Uncle Tom's Cabin*, and the Joseph story.
      *   **Sincerity of Feeling:** The historical context – emerging from genuine struggle (labour, civil rights) – imbues it with profound sincerity. It expresses deep, shared human emotions: yearning for justice, solidarity, hope, resilience. This aligns with the "genuine feeling" of folk songs and the "morally earnest" nature of Schiller/Genesis.
      *   **Moral/Religious Feeling:** Tolstoy would likely interpret its core message – collective struggle for human dignity, equality, and freedom – as embodying the "Christian spirit of human brotherhood" he praised in Dickens, Hugo, and Stowe. He saw true art as transmitting the highest religious consciousness of the age, which for him was universal love and brotherhood. The song's transcendence of purely individual grievance towards a communal, morally grounded aspiration fits this.
      *   **Communal Origin:** While the *individual author* point is complex (see below), the song's evolution from gospel and folk traditions is a significant point *in its favor* for Tolstoy. He explicitly valued art arising organically from the life and spirit of the people ("peasant songs and folk tales") over the manufactured, elite art of salons and academies. Its anonymity reinforces its status as an expression of shared feeling rather than individual vanity or careerism.

  2.  **Potential Points Against (Likely Concerns):**
      *   **Association with Political Movements:** This is the biggest hurdle. Tolstoy was deeply suspicious of institutionalized politics, seeing parties, governments, and revolutions as distractions from the true spiritual kingdom of God within and among individuals. He feared art used for political ends risked fostering partisan hatred or earthly ambition rather than universal love. He condemned art that served "a circle of people of a certain exceptional position" – could he see the Civil Rights Movement or labour movements this way?
      *   **Sincerity of the Collective?:** Tolstoy emphasized the *artist's* individual sincerity as the vital spark for infectiousness. While he praised folk traditions, he might struggle to articulate how sincerity functions in a collectively authored, evolving work. Is the sincerity located in the original unknown singers? In each subsequent performer? In the tradition itself? He doesn't provide a clear model for this.

  **Tolstoy's Likely Verdict: Cautious Approval, Leaning Towards "True Art"**

  Despite the political association, the overwhelming evidence points towards Tolstoy ultimately accepting "We Shall Overcome" as true art, primarily because:

  1.  **The Feeling Transcends Politics:** The core feeling transmitted – universal brotherhood, hope in the face of oppression, the demand for human dignity – aligns perfectly with his conception of the highest religious consciousness. While used in specific struggles, the *feeling itself* (solidarity, justice, faith) is universalizable and rooted in fundamental human values, not narrow party doctrine. It's closer to the spirit of *Uncle Tom's Cabin* (praised) than, say, a jingoistic nationalist anthem (which he would certainly condemn).
  2.  **Folk Origin Trumps Politiсal Use:** Its genesis and form are quintessentially "folk" – the type of art he held in highest esteem. Its communal nature and accessibility are major positives, outweighing concerns about its deployment in organized movements. It *is* the authentic voice of a people expressing their deepest moral and spiritual aspirations.
  3.  **Infectiousness is Undeniable:** Its documented power to unite and move vast numbers of diverse people is the ultimate proof for Tolstoy. It demonstrably transmits a powerful, shared feeling.

  **Closest Analogues:**

  *   **Praise:** *Uncle Tom's Cabin* is the strongest parallel. Both are:
      *   Deeply embedded in a specific social/political struggle (slavery, civil rights).
      *   Express a powerful moral message of human brotherhood, dignity, and resistance to oppression.
      *   Accessible and moving to a vast audience across classes.
      *   Criticized by elites but embraced by the people experiencing the injustice.
  *   **Praise:** The **peasant songs/folk tales** are also key analogues due to:
      *   Communal origin and evolution.
      *   Expression of the authentic life and feelings of ordinary people.
      *   Simplicity and universal accessibility.
      *   Transmission of shared cultural and moral values.

  **Refining Tolstoy's Principle:**

  Your compilation is spot-on. The unifying principle beneath his seemingly disparate verdicts is:

  > **True art is the sincere, infectious communication of a feeling embodying the highest contemporary religious consciousness (universal brotherhood and love), achieved through simple, universally accessible means, originating from the authentic life of the people rather than the artifice of elites.**

  *   **Sincerity:** The artist must genuinely feel the emotion transmitted.
  *   **Infectiousness:** The art must successfully transmit that feeling to the receiver.
  *   **Religious Consciousness:** The feeling transmitted must align with the highest moral understanding of the era (for Tolstoy, Christian love/brotherhood).
  *   **Accessibility:** The means of transmission must be understandable to *everyone*, not just a privileged class. Complexity and obscurity are signs of counterfeit art.
  *   **Anti-Elitism / Pro-Folk:** Art arising organically from the life and struggles of ordinary people is inherently more valuable and authentic than art created for elite consumption, display, or sophisticated intellectual play.

  **Settling the Matter: A Further Test Case**

  To test this refined principle, consider **Bertolt Brecht's epic theatre**, particularly a play like *Mother Courage and Her Children*:

  *   **For True Art?:** Deeply sincere (anti-war, critique of capitalism), powerfully infectious (moves audiences profoundly), transmits a strong moral feeling (human cost of war, critique of exploitation), arguably aimed at accessibility (though not simple), rooted in the struggles of ordinary people.
  *   **For Counterfeit?:** Explicitly political and didactic (which Tolstoy distrusted), uses alienation effects that might challenge "simple" emotional immersion (could be seen as obscuring feeling), created by a named intellectual artist, potentially seen as stirring partisan (socialist) feeling rather than pure universal brotherhood.

  **Tolstoy's likely verdict on Brecht?** He would likely condemn it as counterfeit, despite its moral seriousness, due to:
  1.  Its overt political purpose and potential for partisan feeling.
  2.  Its intellectual complexity and use of alienation, hindering simple emotional transmission and universal accessibility ("obscurity").
  3.  Its origin in an intellectual/elite artistic tradition (epic theatre), not folk spontaneity.

  This contrasts sharply with his likely approval of "We Shall Overcome," highlighting that for Tolstoy, the *means* (simplicity, folk origin) and the *purity of the universal brotherhood feeling* (untainted by overt political instrumentalization, even for good causes) are as crucial as the sincerity and moral content. His theory prioritizes the direct, infectious transmission of universal religious love through accessible folk-like forms above all else. "We Shall Overcome," despite its political context, fits this mold better than most formally complex or overtly ideological works.
