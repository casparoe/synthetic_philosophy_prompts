  I've been talking with a colleague about animal ethics and the scope of moral concern, and I've been mapping out her positions systematically. She's remarkably consistent, and I'm trying to reverse-engineer the principle she's operating with.

  Here are her verdicts on which beings deserve direct moral consideration — meaning they matter for their own sake, not merely because harming them upsets humans or damages something else:

  Deserve direct consideration: human adults, human infants, chimpanzees, dogs, pigs, chickens, octopuses, future generations of humans, and a human with advanced dementia who no longer recognizes anyone.

  Do not deserve direct consideration: fish, bees, bivalves (oysters, mussels), and current AI language models.

  We haven't discussed human fetuses. I'd like to predict what she'd say about a human fetus at roughly 20 weeks gestation. More than the prediction itself, I want to understand: what are the distinct rules or principles that could generate all her existing verdicts? Which of those rules would diverge on the fetus case? And what additional case would best distinguish between the remaining candidate rules?
