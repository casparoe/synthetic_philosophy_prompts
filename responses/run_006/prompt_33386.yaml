prompt: |-
  I've been argueing with a friend about whether Nietzsche would have been into the current health-optimization scene. My friend insists he'd be all over it: the guy was obsessed with diet, digestion, climate, and the body, and he treated questions of nutrition as properly philosophical rather than a private lifestyle matter. I'm less sure, because a lot of what he admired in health seems tied to struggle, self-overcoming, and a kind of aristocratic taste, where as the modern wellness world seems mostly about smoothing things out and optimizing numbers.

  You're a scholar of nineteenth-century German philosophy who knows Nietzsche's late writings on physiology and health especially well. Think carefully, and start by laying out the commitments in his actual views on diet, asceticism, decadence, and the body that you'd use to extrapolate; then apply them one at a time. I want your best counterfactual judgment about how he'd react, if he were alive today, to each of these: (1) GLP-1 drugs like Ozempic that suppress appetite and make weight loss nearly automatic; (2) intermittent fasting and ketogenic diets, with their talk of metabolic discipline and mental clarity; (3) the quantified-self movement, continuous glucose monitors, sleep trackers, and the whole datafication of the body; and (4) the way wellness culture moralizes eating, from clean eating to orthorexia to food-as-purity. For each, say where he'd be sympathetic, where he'd recoil, and which of his actual commitments supports that prediction. Then flag where you're least confident, and what further facts about his views would most change the answer. I don't need citations, just the reasoning.
