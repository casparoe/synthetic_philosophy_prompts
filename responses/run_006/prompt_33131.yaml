prompt: |-
  So I've been going back and forth on the whole "what's wrong with a perfect forgery" question for literally years now — I think it started with that Dutton essay someone linked on LessWrong ages ago, and then I went down the Denis Dutton / Arthur Koestler / Nelson Goodman rabbit hole, and now I'm trying to actually write up where I've landed for a blog post and I'm worried my position is just a pile of things I like that don't actually fit together.

  Here's roughly where I am. I'd say I hold all of the following:

  (1) The aesthetic value of an artwork supervenes entirely on its perceptible properties. A molecule-for-molecule duplicate of the Mona Lisa, or a perfect copy of a Rothko, is just as beautiful and just as aesthetically valuable as the original. If you can't see the difference, there is no aesthetic difference.

  (2) Nonetheless, discovering that a painting you've loved for years is a forgery gives you a genuine reason to value it less — and I don't just mean "value it less as an investment" or "feel embarrassed about having been fooled." I mean your overall appraisal of the work should go down. The feeling of being cheated isn't just status-game stuff; it's tracking something real.

  (3) Artworks are valuable partly because of what the artist actually achieved — the creative act, the solving of a problem, the doing of something for the first time. A forger who replicates a Picasso hasn't done what Picasso did, even if the canvas looks identical.

  (4) If a forgery is never discovered — if it hangs in a museum for centuries and everyone takes it to be the original — it does exactly as much for human flourishing as the original would have done. The experiences, the inspiration, the conversations, the art-historical influence — all identical.

  (5) I'm suspicious of views that make art's value depend on facts that are inaccessible to ordinary viewers. If you need an expert with a spectrometer or a provenance document to tell you whether something is valuable, then the value isn't really in the art — it's in the certification. I want an account of art's value that's grounded in what's available to anyone who looks attentively.

  I think (1) and (5) are doing similar work, and (2) and (3) are doing similar work, but I'm not sure the whole set hangs together. Before I publish I'd like to get an audit: which of these are actually in tension, which only look like they are, and what's the cheapest way to make the set consistent? If you could rank the tensions by severity and be specific about what has to give and what it costs, that would be ideal.

  I'm imagining you as a professional philosopher who works on aesthetics and the metaphysics of art — take your time, think through the relations carefully, and don't just flag everything as a problem. Some of these might fit together fine once you spell out the right distinctions. I want to know where the real fault lines are.
reasoning: |-
  Okay, the user has been grappling with the forgery problem in art for years, drawing from thinkers like Dutton, Koestler, and Goodman. They've outlined five positions and need help identifying tensions and making their view coherent. Let me start by understanding each point.

  Point 1 states aesthetic value supervenes on perceptible properties. So, if you can't see the difference, the aesthetic value is the same. Point 2 says discovering a forgery makes you value it less beyond just financial or embarrassment reasons. Point 3 ties value to the artist's achievement—like the creativity and originality. Point 4 argues that an undiscovered forgery provides the same human flourishing as the original. Point 5 is against relying on inaccessible facts, wanting value accessible to any attentive viewer.

  The main tensions I see are between 1/5 and 2/3. How can value depend only on perceptible properties if the artist's achievement matters, which isn't perceptible? Also, if an undiscovered forgery does the same good, why should we care about authenticity? But when discovered, we devalue it, which conflicts with 1 and 4. 

  The user might be trying to reconcile the experiential aspect of art with the importance of its creation. They need a framework that separates aesthetic properties from other values like art-historical or achievement-based. Maybe distinguishing between different kinds of value—aesthetic vs. artistic. Aesthetic is about the experience, which is perceptible. Artistic includes the artwork's context, history, and originality. 

  So, when you discover a forgery, the aesthetic value remains the same (point 1), but the artistic value drops because it lacks the original achievement (point 3). That explains why people feel cheated—they thought they were engaging with Picasso's creative act, not a copy. Point 4 still holds because the flourishing comes from aesthetic experiences, which are unchanged if the forgery isn't detected. Point 5 is satisfied because ordinary viewers can appreciate the aesthetic part without experts, though the artistic value might need context.

  The user might worry this still relies on external facts. But if we frame artistic value as part of what people engage with when they know the context, it's not inaccessible. It's about the narrative around the work. For example, knowing it's a forgery changes the story, affecting engagement. But the visual experience remains intact. 

  The cost is accepting that art has multiple dimensions of value. The user has to clarify that while aesthetic value is perceptible, other values contribute to overall appraisal. This resolves the tension without abandoning any points, just categorizing them differently. The user's position isn't contradictory; it needs nuanced distinctions.
answer: |-
  Your position is sophisticated and internally coherent *if* we make one crucial distinction—specifically, separating **aesthetic value** from **artistic value**. This resolves nearly all apparent tensions. Let's break it down point-by-point, rank the tensions, and outline the minimal adjustments needed for consistency.

  ### Core Distinction: Aesthetic vs. Artistic Value  
  - **Aesthetic Value**: Grounded in *perceptible properties* and the immediate experiential qualities of the work (color, composition, emotional resonance).  
  - **Artistic Value**: Depends on *contextual, historical, and intentional factors*—what the artist achieved, originality, art-historical significance, etc.  

  This distinction aligns with thinkers like Monroe Beardsley (aesthetic autonomy) and Arthur Danto (artworld context). With this, your five points cohere as follows:

  ---

  ### **Analysis of Your Claims & Resolution of Tensions**  
  **(Ranked by Severity of Apparent Conflict)**  

  1. **Tension Between (1) and (2)/(3)**  
     - **Conflict**: If aesthetic value supervenes *only* on perceptible properties (1), why does discovering a forgery reduce overall value (2)? And why does artistic achievement matter (3) if perceptible properties are identical?  
     - **Resolution**: (1) addresses *aesthetic value*, while (2)/(3) address *artistic value*. A forgery retains identical *aesthetic* value (supports 1, 4, 5) but loses *artistic* value because it lacks originality, intentionality, and historical agency (supports 2, 3).  
     - **Cost**: You must accept that "overall appraisal" (point 2) combines *multiple dimensions* of value. Aesthetic value is unchanged, but artistic value collapses upon discovery.  

  2. **Tension Between (4) and (2)**  
     - **Conflict**: If an undiscovered forgery provides identical human flourishing (4), why should discovery change its value (2)?  
     - **Resolution**: Flourishing in (4) stems from *aesthetic experiences* (accessible to viewers). The loss in (2) stems from *betrayal of artistic context*: we feel "cheated" because we thought we engaged with Picasso’s creative breakthrough, not a copyist’s skill.  
     - **Cost**: You must concede that flourishing isn’t monolithic—it can include *intellectual/cultural dimensions* (e.g., "This changed art history!") that vanish with forgery revelations.  

  3. **Tension Between (5) and (3)**  
     - **Conflict**: If value shouldn’t depend on inaccessible facts (5), how can artistic achievement (3) matter if it’s undetectable without provenance?  
     - **Resolution**: (5) holds for *aesthetic value* (anyone can perceive beauty). (3) involves *artistic value*, which *is* accessible—not via spectrometers, but through *public narratives* (e.g., museum labels, art history texts). An ordinary viewer *can* grasp "Picasso invented Cubism" without experts.  
     - **Cost**: Accept that some artistic value requires *minimal contextual knowledge*, but this isn’t "inaccessible"—it’s part of engaging with art as a social practice.  

  4. **Minor Tension: (1) vs. (3)**  
     - **Conflict**: Can the creative act (3) matter if perceptible properties (1) are identical?  
     - **Resolution**: Yes—the *same perceptible properties* can be a creative breakthrough in one context (Picasso) and a technical exercise in another (forger). Value isn’t *in the canvas* but in the *achievement the canvas represents*.  
     - **Cost**: None. This is the core of your view.  

  ---

  ### **The Coherent Position**  
  Your view fits together cleanly as a hybrid of **Aesthetic Formalism** (points 1, 4, 5) and **Contextualism** (points 2, 3):  
  - **Aesthetic value** is universal, perceptible, and experience-dependent.  
  - **Artistic value** is historical, relational, and tied to agency.  
  - **Overall value** combines both.  

  **Why discovery changes everything**:  
  - An undiscovered forgery delivers full *aesthetic value* and thus flourishing (4).  
  - Upon discovery, its *artistic value* evaporates—it becomes a brilliant counterfeit, not a creative milestone. This explains the visceral sense of betrayal (2): we mourn the lost narrative of human achievement (3).  

  **Why this satisfies (5)**:  
  - Aesthetic value requires no expertise (pure perception).  
  - Artistic value requires only *readily available context* (e.g., "This is by Picasso," not spectrometer data).  

  ---

  ### **Objections to Anticipate & Responses**  
  1. **"But artistic value feels inseparable from the work!"**  
     → Agreed—but this is psychological, not metaphysical. The *experience* of artistic value depends on *beliefs* about context (Danto’s "artworld").  

  2. **"Doesn’t this devalue aesthetic experience?"**  
     → Not at all. Aesthetic value remains primary for direct engagement. Artistic value enriches it with meaning.  

  3. **"What if a forger surpasses the original?"**  
     → Then its *aesthetic value* might be higher (supporting 1), but its *artistic value* is still parasitic (violating 3).  

  ---

  ### **Cheapest Adjustment**  
  **Reframe your "overall appraisal" (point 2) as having two layers**:  
  > *"Discovering a forgery doesn’t diminish the painting’s beauty—but it shatters the story we thought we were part of. We lose not the aesthetic experience, but the awe of human ingenuity."*  

  This preserves all five points, costs only a semantic distinction, and aligns with your Koestler/Goodman influences. Your position isn’t a pile of contradictions—it’s a nuanced dual-aspect theory. Publish with confidence.  

  *Recommended citation for this framework: Beardsley, M. (1982). "The Aesthetic Point of View."*
