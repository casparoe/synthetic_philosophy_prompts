prompt: |-
  I've been going down a rabbit hole on Pascal's mugging and I think I'm missing something. The way I understand it: a mugger says "give me your wallet or I'll torture an astronomically huge number of people" and since the expected disutility is enormous even with a tiny probability, expected utility theory says you should comply. But that's obviously the wrong answer. So doesn't this just show that expected utility maximization is a bad norm? Like, if a decision theory can be hijacked by anyone who can utter a big number, why would anyone in EA or longtermism still use expected value reasoning as their core framework? It seems like the mugging is a reductio of the whole approach, not just a quirkly edge case.
reasoning: |-
  Okay, let me start by unpacking the user's question. They've been diving into Pascal's Mugging and feel like they're missing something. The core issue is that expected utility theory seems to demand compliance with the mugger's demand because of the huge disutility, even with a tiny probability. The user thinks this is obviously wrong and questions why expected value reasoning is still used in EA and longtermism.

  First, I need to recall the structure of Pascal's Mugging. The mugger threatens an astronomically large harm with a very small probability. Expected utility calculation multiplies probability by utility, so even a tiny chance of a huge negative outcome can dominate the decision. The user sees this as a reductio ad absurdum against expected utility theory (EUT).

  The user's frustration is clear. They mention that if a decision theory can be "hijacked by anyone who can utter a big number," it's flawed. They’re skeptical about EUT's validity, especially in contexts like Effective Altruism (EA) and longtermism, which rely heavily on expected value calculations. Their deeper concern might be about the reliability of these frameworks in real-world applications, where improbable but high-stakes scenarios could unduly influence decisions.

  I should address why this isn't a straightforward refutation of EUT. One angle is the problem of assigning probabilities. In standard Bayesian thinking, probabilities must be based on evidence. The mugger's claim might be assigned an extremely low prior, but the user might counter that any non-zero probability, when multiplied by a large enough harm, still overwhelms the calculation. This is where the distinction between Knightian uncertainty and risk comes in. Maybe the probability isn't just low but epistemically inaccessible, so treating it as a known small probability is misleading.

  Another point is the mugger's incentive. Real-world agents don't make credible threats involving astronomical harms. If someone could cause such harm, why mug wallets? This ties into priors based on causal structures. If the user's prior for the mugger's capability is zero or near-zero, the expected utility remains manageable. But how do we formalize that? Perhaps through Bayes' theorem where the prior for such capability is so low that even after the mugger's statement, the posterior remains negligible. But the mugging problem highlights that with any non-zero prior, a sufficiently large threat can still dominate. So the solution might lie in assigning priors that decay sufficiently fast with the magnitude of the claim, which relates to complexity-based priors like Solomonoff induction. 

  The user might not be familiar with Solomonoff induction, so explaining it briefly could help. Under Solomonoff, the probability of a hypothesis decreases exponentially with its complexity. A claim involving astronomical harm requires a complex explanation, making it exponentially unlikely. Thus, even when multiplied by a large disutility, the expected value remains bounded. This resolves the mugging by ensuring that probabilities diminish fast enough to counterbalance the utility.

  I should also mention other approaches, like bounded utility functions or non-probabilistic decision theories. But the user is specifically asking about EA and longtermism, which often use EUT. So emphasizing that within these communities, the response is to refine probability assignments rather than abandon EUT. They might use robustness checks, sensitivity analysis, or leverage Occam's razor to avoid being swayed by arbitrary large numbers.

  The user's deeper concern might be about the practicality of EUT in EA. They might worry that longtermist causes, like mitigating existential risks, could be accused of Pascal's Mugging. For example, spending on asteroid defense based on tiny probabilities of extinction. The response here is that such risks have higher credibility based on scientific models, unlike the mugger's arbitrary threat. Differentiating between well-founded models and ad hoc claims is key.

  I need to make sure I address why EA hasn't discarded EUT. The answer is that Pascal's Mugging is seen as a technical challenge to be solved within the framework, not a deal-breaker. By using better priors, acknowledging uncertainty, and applying decision robustness, they mitigate the issue. Also, the benefits of EUT in handling uncertainty elsewhere justify keeping it, despite edge cases.

  Finally, the user might be looking for reassurance that their skepticism is valid but that there are responses within the framework. Highlighting that the mugging is a recognized problem with proposed solutions can alleviate their concern that EUT is fundamentally flawed. Emphasizing the adjustments and tools used in practice shows that EA and longtermism are aware of and address these issues.
answer: |-
  You've hit on a genuine and profound problem in decision theory. Pascal's Mugging *does* expose a serious potential weakness in naive expected utility theory (EUT), and your intuition that it feels like a reductio is understandable. However, the response within EA, longtermism, and decision theory isn't to abandon EUT entirely, but to refine it to handle such cases or understand its limitations. Here's a breakdown:

  1.  **The Core Problem Correctly Identified:**
      *   Naive EUT: Expected Utility = Probability * Utility.
      *   The Mugging: `EU(Comply) = -Cost_of_Wallet` (small negative)
          `EU(Refuse) = (Tiny Probability) * (-Astronomical Disutility) + (High Probability) * 0 = -Astronomically Large Negative Number`
      *   Therefore: `EU(Refuse) << EU(Comply)` -> You "should" comply.
      *   **The Issue:** This seems absurd. It implies your decisions can be held hostage by *anyone* making an arbitrarily extreme claim, no matter how implausible, simply by invoking a large enough number to overwhelm any tiny but non-zero probability you assign.

  2.  **Why Abandoning EUT Entirely is Problematic (Especially for EA/Longtermism):**
      *   **Handling Genuine Low-Probability/High-Impact Events:** EA and longtermism are deeply concerned with events that have very low probability but *genuinely* catastrophic consequences (e.g., engineered pandemics, unaligned AI, asteroid impacts). Naively dismissing *all* low-probability/high-impact claims because of Pascal's Mugging throws the baby out with the bathwater. We need *some* principled way to weigh these risks. EUT, when used carefully, provides that framework.
      *   **The Allure of Simplicity and Scope:** EUT is a powerful, elegant, and remarkably general framework for reasoning under uncertainty. It provides clear (in principle) answers to complex trade-offs. Abandoning it leaves a void without a universally accepted, equally powerful replacement.
      *   **Comparability:** EUT allows comparing vastly different outcomes on a single scale (utility). This is crucial for causes like longtermism that weigh potential impacts over astronomical time scales and vast numbers of beings.

  3.  **Refinements and Solutions (How EUT is "Fixed" or Contextualized):**

      The core insight behind most responses is: **You cannot assign non-negligible probability to *arbitrary* claims just because they involve large numbers.** Your prior probabilities must be constrained by reason and evidence.

      *   **Knightian Uncertainty / Ambiguity Aversion:** Distinguish between *risk* (known probabilities) and *uncertainty* (unknown probabilities). The mugger's threat falls into deep uncertainty. We aren't equipped to assign *any* meaningful probability to it, let alone a fixed number. Decision theories like *Maximin* (focus on worst-case) or employing *fuzzy priors* become more appropriate here. We simply don't engage in the calculation.
      *   **Complexity-Based Priors / Solomonoff Induction:** This is a highly influential approach. The probability assigned to a hypothesis should be inversely related to its *Kolmogorov complexity* – essentially, how simply it can be described. The mugger's threat ("I will torture 3^^^3 people") is an *extremely* complex hypothesis. It requires positing:
          *   That the mugger has god-like powers far beyond any observed evidence.
          *   That they are motivated to use these powers in this specific, bizarre way.
          *   That they choose *this specific* astronomically large number.
          The sheer complexity makes the prior probability *exponentially small*. Crucially, under Solomonoff induction, the prior probability decays *so fast* as the claimed disutility increases, that `P(Claim) * |Utility|` actually approaches *zero* as the claimed disutility goes to infinity. This mathematically dissolves the mugging – the expected disutility doesn't dominate.
      *   **Bounded Utility Functions:** Some argue that utility functions cannot be linear or unbounded over truly astronomical scales. Perhaps the *disutility* of 3^^^3 people being tortured isn't literally 3^^^3 times worse than one person being tortured in a way that overwhelms all other considerations. This caps the maximum possible disutility an outcome can contribute.
      *   **Incentive and Credibility Modeling:** The mugger's scenario involves an agent with a clear incentive to lie. Any realistic prior should heavily discount claims made by agents who stand to gain from your belief, especially claims requiring extraordinary capabilities. The probability isn't just low; it's effectively zero based on the context of the interaction. Updating on the claim "Give me money or I'll do X" should barely move the needle if X is sufficiently outlandish.
      *   **Decision Robustness / Sensitivity Analysis:** Rather than taking the calculation literally, use it as a starting point for robustness checks. If the *only* reason an action looks good/bad is an extremely low-probability, arbitrarily-sized outcome posited by an unreliable source, and the decision flips dramatically if that probability is adjusted even slightly upwards from near-zero, then the decision is not robust. Rely on more probable and better-evidenced outcomes.
      *   **Focusing on Actions Over Outcomes (Sometimes):** In practice, we often act based on rules, heuristics, or character virtues ("don't negotiate with terrorists/extortionists") rather than recalculating expected utility for every bizarre interaction. This avoids the mugging trap.

  4.  **Why EA/Longtermism Still Uses Expected Value (EV) Reasoning:**

      *   **Best Tool for the Job (When Applied Wisely):** Despite Pascal's Mugging, EV remains the most coherent framework for handling the *type* of uncertainty central to their concerns – genuine, non-arbitrary low-probability/high-impact events (existential risks). The key is **disciplined probability assignment**.
      *   **Addressing Real Astronomical Stakes:** Longtermism deals with potential impacts on 10^54 (or more) future lives. Ignoring low-probability extinction risks because they are "small" is seen as morally catastrophic if those risks are non-negligible *and* based on credible models (unlike the mugger). EV forces these stakes to be confronted.
      *   **Refinement, Not Rejection:** They adopt the *refinements* mentioned above. They acknowledge Pascal's Mugging as a critical challenge demanding careful prior selection (using complexity, evidence, causal models), awareness of uncertainty, and robustness checks. They don't naively multiply any tiny number by 3^^^3.
      *   **Distinguishing the Mugger:** They argue that threats like unaligned AI or bio-engineered pathogens are *not* analogous to the mugger. These threats are based on:
          *   Scientific understanding (physics, biology, computer science).
          *   Historical precedent (existential threats exist - asteroids, nukes).
          *   Plausible causal pathways.
          *   Absence of a known, self-interested human agent fabricating the claim for personal gain. The probabilities, while small, are not *arbitrarily assigned* based on an extortionist's whim; they are estimated based on evidence and models, however imperfectly.

  **Conclusion:**

  You are right that Pascal's Mugging is more than a quirky edge case; it's a deep challenge to naive expected utility maximization. It *does* show that applying EUT without extreme care regarding prior probabilities (especially concerning extraordinary claims from incentivized sources) leads to absurdity.

  However, the response within EA, longtermism, and sophisticated decision theory isn't to *abandon* expected value reasoning. It's to:

  1.  **Acknowledge the problem:** Recognize that probabilities cannot be assigned arbitrarily or naively.
  2.  **Refine the framework:** Use complexity-based priors (Solomonoff), distinguish risk from deep uncertainty, model agent incentives, apply bounds, and demand robust decisions.
  3.  **Use it Judiciously:** Employ EV where it fits best – for evaluating genuine, evidence-informed low-probability/high-impact scenarios – while relying on other heuristics or rules for interactions clearly designed to exploit the naive calculation (like the mugger).

  The mugging is a powerful argument against *naive* EUT, but it's seen as a challenge to be solved *within* or alongside a broadly consequentialist/expected-value framework, rather than a complete reductio that invalidates the core approach for handling the types of astronomical stakes that motivate EA and longtermism. The key is **disciplined, evidence-informed, complexity-sensitive probability assessment.**
