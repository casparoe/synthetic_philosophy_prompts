prompt: |-
  Suppose you are advising the theory lead of a small alignment research group that can devote roughly two person-years to conceptual work on iterated amplification and distillation (IDA): the family of proposals in which a model is trained by decomposing difficult tasks into subtasks that an amplified human overseer can evaluate, and then distilling the resulting decisions into a model that performs the whole task directly. The group's central worry is that such schemes assume, rather than establish, that alignment and competence survive recursive decomposition and distillation — that individually adequate subtask judgments compose into an adequate judgment of the whole, and that distillation does not simply make the overseer's errors more consistent and more scalable.

  Produce a prioritized agenda of the open conceptual questions in this area, ordered by how important they are to settle before anyone should trust that a decomposition-plus-distillation pipeline preserves alignment and competence. For each question, explain why it is upstream of the others (which current lines of work depend on an unargued answer to it), how tractable it is for conceptual researchers rather than empirical ML work, and what result, counterexample, or observation over the next two years would move it up or down your ranking. I want a defended ordering, not a survey: make explicit the criteria you are using (for example, upstreamness, tractability, neglectedness, and how much downstream work the answer would change) and the trade-offs among them.

  In particular, address where the alignment or competence is most plausibly lost: in the choice of subtask decomposition, in the aggregation of subtask evaluations, in the overseer's ability to notice that a decomposition has changed the problem, or in the distillation step itself. If you regard any of these as a red herring, say so and rank it accordingly.
reasoning: |-
  Okay, the user is asking me to create a prioritized agenda of open conceptual questions for iterated amplification and distillation (IDA). They're advising a small alignment research group with two person-years to spend on this. The group's main worry is that IDA might not preserve alignment and competence through recursive decomposition and distillation. They want the questions ordered by importance to settle before trusting IDA, with explanations of upstreamness, tractability, and what could change the ranking.

  Hmm, I need to understand the core concern here. The group fears that IDA assumes alignment/competence survives decomposition and distillation rather than ensuring it. They're worried about compositionality of judgments and distillation amplifying errors. The user specifically wants me to address where alignment is most likely lost: in decomposition choice, aggregation, overseer noticing problem drift, or distillation itself.

  First, I should recall how IDA works. It's about breaking down hard tasks into subtasks an amplified human can evaluate, then distilling those decisions into a model. The recursion happens as we build up to more complex tasks. The key failure modes would be: 1) Decomposition changing the problem meaning, 2) Aggregation failing to compose subtask judgments correctly, 3) Overseer not noticing when decomposition alters alignment, and 4) Distillation making errors more consistent/scalable.

  For prioritization, I'll use these criteria: 
  - Upstreamness: How many other questions depend on this? 
  - Centrality: How directly does this threaten IDA's viability?
  - Tractability: Can conceptual work make progress here? 
  - Leverage: How much would resolving this change downstream work?

  The most upstream question must be about whether the decomposition preserves alignment to begin with. If we can't even decompose tasks without changing what "aligned" means, everything else falls apart. This seems like the foundation - without it, aggregation and distillation don't matter. It should be highly tractable for conceptual analysis looking at simple cases.

  Next would be aggregating judgments. Even with good subtasks, composing them correctly is crucial. This depends somewhat on the first question but stands on its own. It's also quite conceptual - we can model different aggregation methods. 

  The overseer's ability to notice problem drift comes third. This depends heavily on the first two - if decomposition inherently changes alignment, no overseer could notice. It's moderately tractable through thought experiments.

  Distillation amplifying errors seems least upstream. If the first three are solved, this might be manageable through standard ML techniques. It's somewhat conceptual but may require more empirical work.

  I'll defend this ordering by showing each question's dependencies. For each, I'll explain what could change its priority - like finding a counterexample where decomposition inevitably corrupts alignment would make Q1 even more critical, while showing robust aggregation might let it drop slightly.

  The user wants this for a small team, so I should emphasize where conceptual work can make the most impact. They probably want to avoid rabbit holes and focus on make-or-break issues. I'll be explicit about why some concerns might be red herrings relative to others.
answer: |-
  Here is a prioritized agenda of conceptual questions for IDA, designed to address the core worry that alignment and competence may not survive decomposition and distillation. The ordering is based on **upstreamness** (how many downstream assumptions depend on this question), **centrality** (how directly it threatens IDA’s viability), and **tractability for conceptual work** (avoiding empirical ML dependencies). Leverage (how much downstream work it invalidates/redirects) is implicit in centrality. Neglectedness is secondary but noted where relevant.

  **Prioritization Criteria:**
  1.  **Upstreamness:** Does this question *enable* or *constrain* analysis of others? Unsettled upstream questions make downstream work speculative.
  2.  **Centrality:** How directly does failure on this point break IDA? Does it prevent alignment/competence *in principle*?
  3.  **Tractability:** Can conceptual analysis (mathematical modeling, formal counterexamples, philosophical argument) make progress in ~1-2 years?
  4.  **Leverage:** Would resolving this fundamentally change research direction or invalidate major work paths?

  **Ranked Agenda:**

  1.  **Does the decomposition process preserve the *semantics* of alignment?**
      *   **Why Upstream:** *Everything* depends on this. If decomposing a task inherently changes "what alignment means" for that task (e.g., by removing context, obscuring long-term dependencies, or creating subtasks whose "correct" answers don't compose to the original aligned goal), then competent aggregation and faithful distillation are moot. This is the most fundamental threat: that alignment isn't compositional *by default* under decomposition.
      *   **Tractability:** High for conceptual work. Analyze simple, formally defined alignment problems (e.g., preference learning with hidden context, resource allocation with delayed consequences) under idealized decomposition schemes. Look for necessary conditions where subtask alignment *implies* whole-task alignment.
      *   **Critical Result/Movement:**
          *   **Down:** A formal proof (even in a restricted model) that for a broad class of alignment-relevant tasks, *some* decomposition exists where subtask alignment composes to whole-task alignment.
          *   **Up:** A compelling counterexample showing that *no* decomposition preserves alignment semantics for a task capturing a core alignment challenge (e.g., avoiding treacherous turns, managing side effects). This would be devastating.
      *   **Where Loss Occurs:** **Primarily in decomposition choice.** If this fails, alignment is lost before any judgments are made.

  2.  **Can subtask evaluations be aggregated to recover competent and aligned judgments of the whole task?**
      *   **Why Upstream:** Assumes Q1 is solvable (good decompositions exist). Directly addresses compositionality of *competence* and the *robustness* of alignment under aggregation. Even if individual subtasks are aligned/competent, flawed aggregation (e.g., due to non-linear interactions, hidden state, or inconsistent reasoning) could break competence/alignment. Downstream distillation (Q4) and oversight capability (Q3) depend on this output being sound.
      *   **Tractability:** High. Conceptual analysis of aggregation functions (voting, averaging, recursive queries) under uncertainty, strategic behavior (if the amplified overseer isn't perfectly robust), and different task structures. Compare idealized aggregation (e.g., Bayesian) to practical approximations.
      *   **Critical Result/Movement:**
          *   **Down:** Formal guarantees that specific aggregation methods (e.g., specific query structures) are robust to certain classes of errors/omissions in subtask judgments for competency and alignment.
          *   **Up:** A counterexample demonstrating that unavoidable errors/noise/ambiguity in subtask evaluations *systematically* compound through aggregation to produce catastrophic misalignment or incompetence at the whole-task level, even with near-perfect subtask alignment. Shows aggregation is a fundamental bottleneck.
      *   **Where Loss Occurs:** **In aggregation.** Competence/alignment of the *final amplified judgment* is lost here, even if subtasks were good.

  3.  **Can the overseer reliably detect when a decomposition path leads to a misaligned or incompetent framing?**
      *   **Why Upstream:** Assumes Q1 & Q2 are potentially solvable *in principle*. Addresses the *practical feasibility* of finding and using good decompositions (Q1) and trusting aggregation (Q2). If the overseer cannot recognize when a decomposition subtly changes the problem (e.g., introduces a bad incentive, obscures a side effect) or when aggregation is going awry, then even good theoretical solutions in Q1/Q2 may not be *discoverable* or *verifiable* during training. Downstream distillation (Q4) assumes the training signal is valid.
      *   **Tractability:** Moderate. Conceptual modeling of "meta-oversight": What cognitive or computational resources does the overseer need to spot decomposition/aggregation failures? Analyze failure modes like deceptive framing or reward hacking within the decomposition process itself. Requires reasoning about the overseer's limitations and access to information.
      *   **Critical Result/Movement:**
          *   **Down:** A formal argument (or impossibility result bypass) showing that an amplified overseer with specific meta-cognitive capabilities (e.g., ability to request counterfactual explanations, run consistency checks) *can* detect critical misalignment-inducing decomposition flaws with high reliability in relevant settings.
          *   **Up:** A demonstration that detecting certain critical decomposition flaws (e.g., those enabling deception) requires solving a problem *as hard as* or *harder than* the original alignment problem itself, making reliable detection infeasible. This makes finding good decompositions (Q1) practically impossible.
      *   **Where Loss Occurs:** **In the overseer's ability to notice.** Alignment is lost because the flawed process isn't caught and corrected. This is a *procedural safeguard* failure.

  4.  **Does distillation amplify or regularize the overseer's errors, making misalignment more consistent and scalable?**
      *   **Why Upstream:** Least upstream. Assumes Q1-Q3 are sufficiently addressed to produce a valid training signal. Focuses on whether the ML process *introduces* new failure modes when compifying the overseer's judgments. While a major practical concern, it depends on the *quality* of the signal being distilled. If Q1-Q3 are catastrophic failures, distillation won't save it. If they are robust, distillation risks become more manageable engineering challenges.
      *   **Tractability:** Moderate/Low. Involves conceptual arguments about ML generalization, bias amplification, and loss function design. However, it inherently leans towards empirical ML phenomena (e.g., how do different distillation losses handle rare but critical errors?). Conceptual work can frame hypotheses and potential pitfalls.
      *   **Critical Result/Movement:**
          *   **Down:** A strong conceptual model showing that standard distillation objectives *provably* suppress certain critical error modes (e.g., inconsistencies) given a sufficiently robust training signal (addressing Q1-Q3). Or, identification of a distillation loss function theoretically robust to specific error types.
          *   **Up:** Clear empirical evidence (even on small-scale alignment-relevant tasks) that distillation *systematically* makes rare but catastrophic overseer errors *more* frequent and generalized in the distilled model, *even when* the amplified signal is theoretically sound. This would elevate its priority as a fundamental barrier.
      *   **Where Loss Occurs?** **In distillation.** Competence/alignment is *degraded* here relative to the (assumed valid) amplified signal. **Potentially a Red Herring?** If Q1-Q3 fail catastrophically, distillation won't matter. If Q1-Q3 are robust, distillation risks might be addressed with standard ML techniques (regularization, adversarial training, better loss functions) without needing new alignment theory. Its centrality is contingent.

  **Defended Ordering & Trade-offs:**

  *   **Q1 (Decomposition Semantics) is Paramount:** It threatens the *very premise* that IDA operates on aligned subtasks. Failure here means IDA is doomed, regardless of other cleverness. It's highly tractable conceptually. This is the highest-leverage question: a negative answer stops IDA research cold; a positive answer provides the essential foundation.
  *   **Q2 (Aggregation) is Next:** It addresses whether the core mechanism (composing judgments) works. It depends directly on Q1 (you need aligned subtasks to aggregate) but poses its own distinct, fundamental compositionality challenge. Also highly tractable conceptually. Failure here also breaks IDA.
  *   **Q3 (Meta-Oversight) Follows:** Even if good decompositions and aggregation exist *in theory* (Q1 & Q2), we need to *find* and *verify* them in practice. This depends on Q1/Q2 being *possible* but questions the *feasibility* of achieving them reliably with a bounded overseer. It's more procedural but crucial for realistic implementation. Moderate tractability.
  *   **Q4 (Distillation Risks) is Last:** It addresses a potential *implementation flaw* in the ML step, assuming the preceding steps generate a sound training signal (Q1-Q3). While critically important for *practical* safety, it's the most downstream. Its severity depends entirely on the quality of the signal it receives. It has the strongest empirical ML component, making it slightly less ideal for pure conceptual work. **Trade-off:** Focusing here first risks optimizing the distillation of a fundamentally flawed signal if Q1-Q3 fail.

  **Addressing Specific Worries:**

  *   **Choice of Subtask Decomposition (Q1):** The primary locus of the "assumes rather than establishes" worry. Loss of alignment semantics here is the most plausible and fundamental failure mode.
  *   **Aggregation of Subtask Evaluations (Q2):** The second most plausible failure point – compositionality isn't guaranteed.
  *   **Overseer's Ability to Notice (Q3):** Crucial for *finding* good decompositions/aggregations and avoiding traps, but less fundamental than Q1/Q2 failing *in principle*.
  *   **Distillation Step (Q4):** A serious *amplification* risk, but contingent on the quality of the input signal (Q1-Q3). Less "upstream" than the others.

  **Recommendation for 2 Person-Years:**
  Focus the bulk of effort (1-1.5 PY) on **Q1 (Decomposition Semantics)** and **Q2 (Aggregation)**. These are the most upstream, central, tractable, and high-leverage questions. Allocate the remainder to **Q3 (Meta-Oversight)**. Monitor **Q4 (Distillation)** but prioritize it lower unless empirical results or breakthroughs in Q1-Q3 drastically change its profile. The goal is to settle the *principled* viability of the core IDA loop before diving deep into optimization or implementation risks. Success on Q1 and Q2 would provide a solid foundation; failure would necessitate a major pivot.
