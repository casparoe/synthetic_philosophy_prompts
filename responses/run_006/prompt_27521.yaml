answer: |-
  You've pinpointed a profound and fascinating contradiction at the intersection of philosophy of mind, law, and institutional practice. The dissonance between the extended mind thesis (EMT) and border search protocols is stark, revealing deep-seated assumptions about personhood.

  **The Presupposed Theory of Mind in Border Searches**

  Current border search practices implicitly endorse a **strong internalist and substance-based view of the mind and person.** This view holds that:

  1.  **The Mind is Intracranial:** Cognition, memory, and the "self" reside solely within the biological brain. Anything outside the skull is categorically *not* part of the mind.
  2.  **The Person is Coextensive with the Biological Body:** The legal and moral boundaries of the person stop at the skin. External objects, regardless of their functional role, are merely *property* owned by, but fundamentally distinct from, the person.
  3.  **Information Storage vs. Cognitive Process:** Biological memory is seen as an active, integral part of *being* the person – accessing it directly (e.g., compelling testimony, brain scanning) violates the core self. Digital storage, conversely, is viewed as passive information *about* the person, akin to papers in a briefcase. The *process* of cognition is deemed internal; the *data* is external property.
  4.  **Tangibility as a Boundary Marker:** There's a strong reliance on physical tangibility. The brain is intangible flesh, protected. The device is a tangible object, subject to seizure and inspection like luggage.

  This framework directly contradicts the EMT's **functionalist and process-based view**, which argues that the mind is defined by the *role* played within cognitive processes, not the *substance* (neurons vs. silicon) or *location* (inside vs. outside the skull). Otto's notebook isn't *about* his memory; it *is* his memory, functionally speaking.

  **Could Border Searches be Reconciled with EMT? (Unlikely)**

  It's difficult to justify the current *scope and intrusiveness* of device searches under an EMT-compatible framework:

  1.  **Property Rights Justification:** While tempting ("it's your property, subject to search"), this justification *presupposes* the internalist view EMT challenges. If the device is genuinely part of one's cognitive architecture (like Otto's notebook), searching it isn't analogous to searching luggage; it's functionally equivalent to *forcibly accessing biological memory*. Treating a constitutive part of the mind as mere property fails to recognise its cognitive significance under EMT. We don't allow searches of prosthetic limbs or pacemakers based purely on property rights without higher thresholds because they are integrated into bodily function.
  2.  **Security Necessity:** While states have legitimate security interests at borders, EMT would demand a far higher threshold for accessing *cognitive extensions* than for inert property. The current "without warrant or suspicion" standard treats the data as low-stakes property. If the data *is* part of the mind, such access becomes a profound intrusion into cognitive integrity and mental privacy, arguably requiring something akin to the compelling reasons needed for compelled testimony or medical intrusion (e.g., warrant based on probable cause, specific suspicion).
  3.  **Functionality Isn't Binary:** EMT acknowledges degrees of integration. Not every note on a phone is equivalent to biological memory. However, current practices sweep up *all* digital data (messages, photos, notes, browsing history) indiscriminately, making no allowance for the depth of integration or functional equivalence to biological memory processes.

  **Taking EMT Seriously: Implications for Regulation**

  If EMT were taken seriously, significant changes would be required across domains:

  1.  **Border Searches:**
      *   **Higher Thresholds:** Accessing device contents would require at minimum *reasonable suspicion* of specific wrongdoing, moving towards *probable cause* and a *warrant requirement* for deep forensic searches, aligning more closely with protections against self-incrimination.
      *   **Limited Scope:** Searches might be restricted to specific files or data types demonstrably relevant to border security (e.g., travel documents, customs declarations), rather than a digital "fishing expedition" through the entirety of one's external mind. Blanket demands for device passwords could be seen as akin to compelled decryption of one's *thoughts*.
      *   **Recognition of Harm:** The intrusion would be formally recognised not just as a privacy violation, but as an intrusion into cognitive functioning and mental integrity, demanding stronger safeguards and remedies.
  2.  **Policing:** Warrants for searching digital devices would need to be specific, based on probable cause linking the device's *cognitive content* (not just its physical possession) to a crime. Compelling device unlocking could face similar constitutional hurdles as compelling testimony. Mass digital surveillance would be viewed as mass intrusion into extended minds.
  3.  **Employment:** Employer monitoring of personal devices used for work, or deep surveillance of work-issued devices accessing personal cognitive tools (e.g., personal cloud storage used for work organisation), would require strong justification and consent. Accessing an employee's personal organisational systems could be seen as violating mental privacy.
  4.  **Education:** Monitoring students' personal devices used for learning, or deep surveillance of school-issued devices containing deeply integrated personal cognitive scaffolds (notes, research, creative work), would need careful limits and respect for the student's developing cognitive autonomy and mental space.

  **Inconsistencies: Recognising the Extended Mind Elsewhere**

  You astutely note the inconsistency. There *are* areas where the law implicitly acknowledges something akin to EMT, particularly concerning harm:

  1.  **Psychological Harm from Destruction of External Memory:** As you mention, courts in cases of vandalism or destruction (e.g., a lifetime's diaries, a meticulously curated digital photo library, a complex custom workspace) have sometimes recognised the profound psychological harm inflicted. This harm is categorised as going far beyond the replacement cost of the physical object (property damage) and into the realm of personal injury, acknowledging that these external systems were integral to the person's identity, memory, and sense of self. *This directly parallels the EMT's functional equivalence.*
  2.  **Intellectual Property & Moral Rights:** Copyright law, particularly concepts like moral rights (stronger in some jurisdictions than others like the UK/US), recognises a link between an author and their creative work that transcends mere property. Unauthorised distortion or destruction of the work can be seen as harming the author's personality or reputation, hinting at an extended conception of the creator's mind in the world.
  3.  **Assistive Technologies:** The law increasingly recognises the integration of certain technologies (prosthetics, communication devices for non-verbal individuals) as extensions of the person's body and agency, affording them specific protections. While not always framed as "cognitive," the principle of functional integration overlaps with EMT.

  **Conclusion: Philosophical Incoherence**

  You are correct to identify a significant philosophical incoherence. The law, particularly regarding border searches, predominantly operates on a **Cartesian internalist model** (mind = brain in vat), treating digital devices as mere containers for information *about* the person.

  However, in other areas – notably recognising the severe psychological injury caused by the destruction of integrated external memory systems – the law implicitly adopts a view much closer to the **extended mind thesis**, acknowledging that these external artefacts can be constitutive of the person's cognitive processes, identity, and wellbeing.

  This inconsistency is problematic. It suggests that when convenient for state power (broad search authority), we retreat to an internalist view. Yet, when compensating for harm, we intuitively grasp the deeper integration posited by EMT. Reconciling this would require either abandoning the EMT-like intuitions in harm cases (unlikely and undesirable) or fundamentally reforming search practices to acknowledge the cognitive significance of our deeply integrated digital extensions, bringing legal practice closer to a coherent, functionalist understanding of the mind's boundaries. The bright line at the skull, defended by border agencies, looks increasingly arbitrary and indefensible under philosophical scrutiny informed by our digital entanglement.
