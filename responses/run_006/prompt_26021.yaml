answer: |-
  Your editor is technically correct about the *logical* contradiction but completely missing the **psychological reality and philosophical depth** your line captures. This paradox is a cornerstone of human cognition, especially regarding trauma and self-deception. Here's the breakdown of what's happening, grounded in established philosophy and psychology:

  **The Core Insight: Separating "Knowing" from "Believing" (or Accepting)**

  1.  **Moore's Paradox (Settled Philosophy):** Philosopher G. E. Moore famously identified the absurdity of asserting: "P is true, but I don't believe that P is true." Logically, your editor is right. Asserting "P" implies you believe it. Saying you *don't* believe it while asserting it creates a performative contradiction. *This is settled.* The statement *is* paradoxical on the surface level of assertion logic.

  2.  **The Psychological Escape Hatch (Settled Phenomenon):** However, philosophers and psychologists widely recognize that humans *routinely* experience states where factual knowledge ("knowing-that") exists alongside a profound inability or refusal to integrate that knowledge into their working model of reality and emotional life ("believing-in" or "accepting"). This is the heart of your character's state. Your line perfectly captures **dissonance**.

  **What's Coherently Happening in Your Character's Mind (Supported Views):**

  *   **Factual Acknowledgment vs. Emotional Integration:** She possesses the *information* ("He's having an affair"). Her senses and reason have delivered the evidence. But she cannot *emotionally integrate* this fact into her lived reality, her sense of self, her trust in the world, or her relationship. It feels unreal, impossible, like a nightmare she expects to wake from. "I don't believe it" means "I cannot accept this into my heart and soul as my new reality; it feels alien and impossible."
  *   **"Believing" as Trust/Commitment:** "Belief" here isn't just intellectual assent to a fact; it often implies *trust* or *commitment*. "I don't believe it" can mean "I refuse to commit to this reality" or "I cannot trust that this information defines my world now," even while knowing the facts.
  *   **Alief (Established Concept):** Philosopher Tamar Gendler distinguishes **belief** (cold, cognitive assent) from **alief** (automatic, affect-laden responses). Your character *believes* the affair is happening (intellectually) but her *aliefs* – her gut reactions, habits, emotional patterns – are still operating as if it isn't true. "I don't believe it" points to the dominance of those conflicting aliefs.
  *   **Practical vs. Theoretical Knowledge:** She *knows* it theoretically (she can state the fact), but she cannot *act* on that knowledge consistently ("practical knowledge"). She might avoid confrontation, keep routines, or even act lovingly – behaviors incompatible with her theoretical knowledge, revealing the "not believing" part.
  *   **Partitioning / Compartmentalization (Widely Accepted Psychological Mechanism):** To avoid overwhelming psychic pain, the mind can compartmentalize. One "compartment" holds the awful knowledge ("He's having an affair"). Another compartment, protecting her core functioning, holds the previous reality ("My marriage is secure"). When she blurts out the line, the first compartment briefly accesses the second, highlighting the contradiction *between* compartments. "I don't believe it" reflects the protective compartment fighting back.

  **Why Your Line Works (and How to Defend It):**

  1.  **It Captures Raw Dissonance:** The contradiction *is the point*. It's the sound of her mind breaking under the strain. It's not illogical thinking; it's the logic of trauma and self-preservation.
  2.  **It Distinguishes Knowledge from Acceptance:** She has the knowledge, but acceptance (the full weight of belief) is absent. "Believe" in common parlance often means "accept emotionally/fully."
  3.  **It Mirrors Real Speech:** As you noted, people *do* say this. It's a linguistic artifact of cognitive dissonance. Think: "I know I need to quit, but I don't believe I really will," or "I know he's gone, but I don't believe it."
  4.  **It Signals Profound Denial:** This isn't simple ignorance; it's denial *in the face of overwhelming evidence*. The strength of the contradiction reflects the strength of the defense mechanism.

  **Addressing the Editor & Nuancing (If Needed):**

  *   **Defend It:** Explain it's intentional psychological realism, capturing the dissonance between intellectual knowledge and emotional acceptance/assimilation. Cite the commonality of such statements in trauma and grief. Reference Moore's Paradox as the *formal* contradiction that highlights the *psychological* reality of compartmentalization.
  *   **Slight Tweaks (If Compromise is Needed):** If the editor remains stubborn, subtle shifts might help without losing the essence:
      *   "**I *know* he's having an affair... but I don't *believe* it.**" (Emphasis highlights the distinction).
      *   "**I've seen the proof, it's real... but I can't make myself believe it.**" (Focuses on the *inability*).
      *   "**He's having an affair. Saying it out loud... I still don't believe it.**" (Shows the act of voicing it triggers the denial).
      *   Have the *sister* interpret it: Sister stares, then says softly, "You mean you know it, but you can't accept it yet?" This validates the psychological state explicitly.

  **What's Settled vs. Contested:**

  *   **Settled:**
      *   Moorean sentences ("P but I don't believe P") are logically absurd/self-defeating as assertions.
      *   Humans experience states where they possess factual knowledge but cannot emotionally integrate or act consistently upon it (dissonance, denial).
      *   Compartmentalization is a well-documented psychological mechanism.
      *   Distinctions like knowledge vs. acceptance, or belief-that vs. belief-in, are useful tools.
  *   **Contested (Avoid Basing Solely On These):**
      *   **The precise nature of self-deception:** Is it truly holding two contradictory beliefs simultaneously? Or rapidly switching? Or just motivated ignorance? (The partitioning view is common but debated).
      *   **The metaphysical status of "alief":** While a useful descriptive concept, whether alief is a fundamentally different *kind* of state from belief, or just a type of belief, is debated.
      *   **The best *philosophical* explanation for Moore's Paradox:** While the paradox is real, the *why* is still discussed (though less relevant for your purpose).

  **Recommendation:**

  **Stick to your guns.** Your line is powerful and psychologically astute. It captures the core theme of your novel. The "contradiction" is the character's reality. Explain to your editor that the paradox is the point – it reveals the character's internal fracture. Ground your defense in the *psychological reality* of cognitive dissonance and the distinction between intellectual knowledge and emotional acceptance, referencing Moore's Paradox as the formal structure that makes this psychological state so jarring and visible.

  You can reinforce this by showing the *consequences* of this split: she knows the affair is real, yet she makes his favorite dinner, plans a weekend getaway, or avoids looking at his phone again – actions predicated on the "not believing" part. The sister's reaction in the scene should likely be one of pained understanding, not confusion about the logic, seeing the raw distress behind the contradictory words. This line is authentic and central to your theme – don't lose it. Writers like Alice Munro or Ian McEwan masterfully explore this territory; your instinct is spot-on.
