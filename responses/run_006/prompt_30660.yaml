  Below is a reusable decision procedure for classifying two adverse event clusters as "same mechanism," "different mechanism," or "can't tell yet." It integrates biological, clinical, and risk management perspectives while flagging where human judgment is needed for risk/benefit decisions. The procedure prioritizes efficiency (executable in ≤4 hours) and leverages pharmacovigilance data (case narratives, preclinical, epidemiology).

  ---

  ### **Decision Procedure for "Same Mechanism" Classification**
  **Input**: Two clusters (A and B) of adverse events for the same drug.  
  **Output**: "Same mechanism," "Different mechanisms," or "Can't tell yet."  
  **Key Principles**:  
  - **Mechanism definition**: A biological pathway (e.g., metabolic, immune, toxic) leading to the adverse event.  
  - **"Same mechanism" requires**: Shared biological pathway and intervention response.  
  - **Handoff to human**: When biological distinction doesn't align with practical risk management (e.g., labeling).  

  **Procedure Steps**:
  1. **Clinical & Temporal Alignment**  
     **Question**: Do the clusters have identical symptoms, signs, lab findings, and temporal patterns (onset, duration, resolution)?  
     - *Sufficient "yes"*: Symptom profiles match ≥90% (e.g., same rash morphology, liver enzyme patterns) AND temporal patterns overlap (e.g., both acute onset).  
     - *Sufficient "no"*: Symptoms/signs differ (e.g., headache vs. fatigue) OR temporal patterns are mutually exclusive (e.g., immediate vs. delayed).  
     **Decision**:  
     - **Yes** → Proceed to Step 2.  
     - **No** → Proceed to Step 3.  
     - **Unclear** (e.g., partial overlap) → Proceed to Step 3.  

  2. **Risk Factor Concordance**  
     **Question**: Do the clusters share the same predisposing factors (dose, comorbidities, genetics, demographics, comedications)?  
     - *Sufficient "yes"*: ≥80% shared risk factors in case reports/epidemiology (e.g., both driven by high dose).  
     - *Sufficient "no"*: Risk factors are biologically distinct (e.g., renal impairment vs. CYP450 polymorphism) AND mutually exclusive in populations.  
     **Decision**:  
     - **Yes** → Proceed to Step 4.  
     - **No** → Output "**Different mechanisms**" (stop).  
     - **Mixed/Unclear** → Proceed to Step 3.  

  3. **Preclinical Pathway Consistency**  
     **Question**: Is there preclinical evidence (in vitro, in vivo) supporting a single biological pathway for both clusters?  
     - *Sufficient "yes"*: Shared mechanism (e.g., mitochondrial toxicity) demonstrated in relevant models.  
     - *Sufficient "no"*: Evidence of distinct pathways (e.g., immune-mediated vs. direct cytotoxicity).  
     **Decision**:  
     - **Yes** → Proceed to Step 4.  
     - **No** → Proceed to Step 5.  
     - **Insufficient data** → Output "**Can't tell yet**" (stop).  

  4. **Intervention Invariance**  
     **Question**: Would the same intervention (e.g., dose reduction, contraindication) prevent/mitigate both clusters?  
     - *Sufficient "yes"*: Case reports/epidemiology show ≥70% response to the same action (e.g., discontinuation resolves both).  
     - *Sufficient "no"*: Interventions are discordant (e.g., steroids work for one cluster but not the other).  
     **Decision**:  
     - **Yes** → Proceed to Step 6.  
     - **No** → Output "**Different mechanisms**" (stop).  

  5. **Epidemiological & Biomarker Overlap**  
     **Question**: Do the clusters co-occur in patients, share biomarkers, or have identical epidemiological signatures (e.g., same incidence curve)?  
     - *Sufficient "yes"*: ≥75% co-occurrence in cases OR shared biomarker (e.g., elevated IL-6).  
     - *Sufficient "no"*: No co-occurrence AND divergent biomarkers.  
     **Decision**:  
     - **Yes** → Proceed to Step 6.  
     - **No** → Output "**Different mechanisms**" (stop).  
     - **Unclear** → Output "**Can't tell yet**" (stop).  

  6. **Conflict Check & Human Handoff**  
     **Question**: Is there strong evidence against a shared mechanism?  
     - *No conflicts* → Output "**Same mechanism**".  
     - *Conflicts* (e.g., differing histopathology) → Output "**Different mechanisms**".  
     **Human Handoff Trigger**:  
     - If biological verdict ("same" or "different") mismatches risk management needs (e.g., "different mechanisms" but one warning suffices), **flag for human review**.  

  ---

  ### **Application to Cases**
  **Case 1**: Two clusters of liver injury with identical enzyme patterns.  
  - One in high-dose patients, one in patients with pre-existing liver conditions.  
  **Procedure**:  
  1. **Step 1**: Clinical alignment → Identical enzyme patterns → **Yes** → Proceed to Step 2.  
  2. **Step 2**: Risk factors → Different (dose vs. comorbidity) → **No** → **Output: Different mechanisms**.  
  **Why you might not like this**: Biologically distinct (direct toxicity vs. metabolic stress), but one warning (e.g., "avoid in hepatic impairment or high doses") could cover both. **Handoff to human** for risk management alignment.  

  **Case 2**: Two clusters of identical skin rash.  
  - One starts within 1 day of first dose, one after months of use.  
  **Procedure**:  
  1. **Step 1**: Clinical alignment → Identical rash → **Yes** → Proceed to Step 2.  
  2. **Step 2**: Risk factors → Unclear (timing suggests different triggers) → **Mixed** → Proceed to Step 3.  
  3. **Step 3**: Preclinical data → Immediate rash suggests IgE-mediated; delayed suggests T-cell mediated → **No** (distinct pathways) → Proceed to Step 5.  
  4. **Step 5**: Epidemiological overlap → No co-occurrence; timing divergence → **No** → **Output: Different mechanisms**.  
  **Why you might not like this**: Both are "rashes," but mechanisms differ (allergic vs. cumulative). Labeling may need separate warnings for acute vs. chronic management.  

  **Case 3**: Cluster of headaches and cluster of fatigue.  
  - Same prescribing pattern/onset timing, different symptoms.  
  **Procedure**:  
  1. **Step 1**: Clinical alignment → Different symptoms → **No** → Proceed to Step 3.  
  2. **Step 3**: Preclinical data → Often lacking for nonspecific AEs → **Insufficient data** → **Output: Can't tell yet**.  
  3. **Step 5** (if done): Epidemiological overlap → Shared prescribing/onset → **Yes** → Proceed to Step 6.  
  4. **Step 6**: No conflicts → **Output: Same mechanism**.  
  **Why you might not like this**: Symptoms differ, but shared epidemiology/intervention (e.g., dose reduction fixes both) suggests a common mechanism (e.g., CNS receptor modulation). Risk management may prefer one combined warning.  

  ---

  ### **Limitations of the Procedure**
  1. **Cannot resolve "gray areas" without data**: Relies on existing case reports/preclinical data. Limited time may force "can't tell yet" in complex cases (e.g., Case 3).  
  2. **May misalign biology and risk management**:  
     - **False "different"**: Biologically distinct clusters (e.g., Case 1) could be covered by one warning.  
     - **False "same"**: Mechanistically similar events (e.g., two rashes) might need separate interventions.  
  3. **Ignores prevalence/severity**: Focuses on mechanism, not public health impact (e.g., a rare but severe "different mechanism" may warrant separate action).  
  4. **Requires expert judgment for handoffs**: Does not automate risk/benefit decisions (e.g., when a "same mechanism" label change is commercially unviable).  

  ### **When to Override the Procedure**
  - **Human handoff** is critical when:  
    - Biological verdict conflicts with operational efficiency (e.g., "different mechanisms" but one warning suffices).  
    - External factors (e.g., regulatory pressure, litigation risk) outweigh mechanistic clarity.  
  - **Always pair with a risk assessment**: The procedure addresses "is it the same?" not "what should we do?"  

  This procedure standardizes mechanism assessment while flagging where human judgment is essential for risk management. It balances scientific rigor with pharmacovigilance pragmatism.
