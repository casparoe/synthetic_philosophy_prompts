  ---

  **Adversarial Collaboration Document: Substantivalism vs. Relationism in Spacetime Ontology**

  **1. Agreed Claims**

  After extensive discussion, we have reached agreement on the following substantive points:

  1. The mathematical formalism of general relativity (GR) is best understood as a theory in which the metric field \( g_{\mu\nu} \) is the central dynamical object. Both sides agree that this field (or its relational counterpart) encodes the physically significant structure of spacetime.

  2. Diffeomorphism invariance is a fundamental symmetry of GR. Both sides agree that this symmetry implies that spacetime points do not possess primitive identities (haecceities) independent of the metric and other physical fields. Consequently, the hole argument does not undermine the determinism of GR when properly interpreted.

  3. All genuine physical observables must be diffeomorphism-invariant (gauge-invariant). This includes quantities that are invariant under the symmetries of the theory. Both sides reject the notion that the values of fields at unlabeled spacetime points are observable.

  4. The Newton bucket experiment demonstrates that the concavity of the water surface is correlated with rotation relative to the local inertial frames. Both sides agree that any adequate theory of spacetime must account for this phenomenon.

  5. The appearance of absolute space in Newtonian mechanics is an artifact of a particular representation. Both sides agree that a satisfactory theory should not posit unobservable absolute structures.

  6. The success of GR in explaining gravity as the curvature of spacetime is not in dispute. Both sides agree that the theory accurately describes the physical world, but they differ on what this description represents ontologically.

  **2. Disagreements Table**

  The following table captures the core disagreements between the substantivalist (S) and the relationist (R) positions. Each position is stated in the proponent's own terms.

  | Point of Disagreement | Substantivalist Position | Relationist Position |
  |------------------------|--------------------------|----------------------|
  | **Ontological Status of Spacetime** | Spacetime is a fundamental and real entity, represented by a manifold equipped with a metric field. The metric field is a physical field that exists independently of material bodies and determines the geometric structure of spacetime. | Spacetime is not a fundamental entity. What is real are the relations among material events and objects. The metric field is a convenient encoding of these relations, but it does not denote an independent substance. |
  | **Explanation of Inertia** | Inertia is a property of spacetime itself. The structure of spacetime (via the metric field) defines local inertial frames, and the motion of test particles is governed by this structure. The distribution of matter influences spacetime curvature (via Einstein's equations) but does not directly define inertia. | Inertia arises from the relations between a body and the global distribution of matter in the universe. The bucket experiment's result is explained by the relative rotation with respect to the fixed stars (or the cosmic mass distribution). Inertia is relational and cannot be defined without reference to other matter. |
  | **Interpretation of Gauge Freedom** | Gauge freedom (e.g., diffeomorphisms) is a mathematical redundancy in our description of the physical world. It does not correspond to any physical symmetry but reflects the fact that our mathematical representation uses more structure than is physically present. The physical reality is captured by the gauge-invariant content. | Gauge freedom is a consequence of the relational nature of physical reality. The symmetries of the theory reflect the fact that only relative configurations are real. Gauge transformations connect descriptions that are physically equivalent because they represent the same relational state. |
  | **The Hole Argument and Haecceitism** | The hole argument shows that spacetime points do not have primitive identities. However, spacetime points are real as parts of the manifold, but their identities are fixed by the metric and matter fields. The substantivalist accepts a "sophisticated" view that avoids haecceitism by endorsing a form of anti-haecceitism. | The hole argument reveals that spacetime points are not real. The mathematical points of the manifold are merely nodes in a relational network and have no independent existence. The argument supports relationism by showing that the only reality is the relational structure, which is invariant under diffeomorphisms. |
  | **Genuine Observables** | Genuine observables are gauge-invariant quantities. These can include local properties (like curvature scalars) as well as non-local ones (like integrals or Wilson loops), but they are defined without reference to a fixed background. The substantivalist holds that these observables describe properties of spacetime and its contents. | Genuine observables are exclusively relational quantities, such as distances, angles, or durations between material events, or more generally, the overall shape of the universe (as in shape dynamics). These observables do not require reference to an underlying spacetime manifold. |

  **3. Cruxes**

  We identify the following cruxes as pivotal issues that, if resolved, would significantly advance the debate. Settling any of these would change at least one party's position.

  1. **The Origin of Inertia**: Does inertia depend on the global distribution of matter in the universe, or is it an intrinsic feature of spacetime?

  2. **The Necessity of Spacetime Points**: Can all physical phenomena (including those in GR) be described without reference to spacetime points as fundamental entities, using only relational quantities?

  3. **The Interpretation of Gauge Symmetry**: Is gauge symmetry (diffeomorphism invariance) merely a descriptive redundancy, or does it reflect a fundamental relational aspect of reality?

  4. **The Hole Argument's Ontological Lesson**: Does the hole argument compel us to abandon the reality of spacetime points, or does it merely show that we must reject haecceitism while retaining spacetime as a real entity?

  **4. Resolution Methods and Predictions**

  For each crux, we outline the kind of argument, thought experiment, or empirical evidence that both parties agree would bear on the issue, along with each side's prediction.

  **Crux 1: The Origin of Inertia**

  - **Bearing Evidence**: A thought experiment (inspired by Newton's bucket and Mach's principle) involving a rotating system in a nearly empty universe (i.e., with negligible matter content). Specifically, consider a universe containing only a bucket of water. If the bucket is set into rotation, will the water surface become concave?
  - **Substantivalist Prediction**: Yes. Inertia is an intrinsic property of spacetime, so the bucket's rotation relative to local inertial frames would cause concavity even in the absence of other matter. Spacetime provides the structure for inertia independently.
  - **Relationist Prediction**: No. Without a surrounding mass distribution (like the fixed stars), there is no standard of rotation, and therefore no inertial effects. The water surface would remain flat. Inertia requires the relational influence of distant matter.

  **Crux 2: The Necessity of Spacetime Points**

  - **Bearing Evidence**: The success of a relational reformulation of GR (such as shape dynamics) in reproducing all empirical predictions of standard GR without introducing spacetime points as fundamental entities. Specifically, can shape dynamics (or a similar relational theory) account for phenomena such as gravitational waves and black holes without any reference to a spacetime manifold?
  - **Substantivalist Prediction**: No. Spacetime points are indispensable for a complete description of GR. While shape dynamics may recover some features, it will either fail for certain phenomena (e.g., singularities) or require hidden structures that are equivalent to substantival space.
  - **Relationist Prediction**: Yes. Shape dynamics (or a future relational theory) can fully reproduce GR without fundamental spacetime points. The relational description is not just empirically equivalent but also more fundamental, and it can handle all phenomena including those mentioned.

  **Crux 3: Interpretation of Gauge Symmetry**

  - **Bearing Evidence**: A conceptual analysis of gauge symmetries in other physical theories (e.g., electromagnetism) and in quantum gravity. If a future theory of quantum gravity (e.g., loop quantum gravity or string theory) treats diffeomorphism invariance as a fundamental symmetry (not reducible to redundancy), what would that imply?
  - **Substantivalist Assessment**: Gauge symmetry is always a redundancy. In quantum gravity, the physical Hilbert space will be constructed by quotienting out the gauge group, showing that the symmetry is not physical. The gauge-invariant states are the only real ones.
  - **Relationist Assessment**: Gauge symmetry reflects a physical symmetry in which different configurations are related by transformations that change non-relational labels. In quantum gravity, the persistence of diffeomorphism invariance as a fundamental symmetry would support the view that spacetime points are not real and that only relational quantities are physical.

  **Crux 4: The Hole Argument's Ontological Lesson**

  - **Bearing Evidence**: A metaphysical argument about whether the denial of haecceitism (i.e., the idea that spacetime points lack primitive identities) is sufficient to avoid the hole argument's threat to determinism without abandoning the reality of spacetime points.
  - **Substantivalist Assessment**: Yes. The hole argument is resolved by recognizing that spacetime points do not have primitive identities. This does not require denying their reality; instead, we see that the metric field individuates points. Thus, determinism is preserved without relationism.
  - **Relationist Assessment**: No. The hole argument shows that if spacetime points were real, they would have to have haecceities to ground the distinctness of the diffeomorphic solutions. Since we reject haecceitism, we must also reject the reality of spacetime points. Only relationism avoids the indeterminism.

  ---

  This document aims to fairly represent both positions and to crystallize the remaining disagreements. We invite the community to engage with these cruxes and the methods proposed for their resolution.
