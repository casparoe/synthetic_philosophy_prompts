  - Both agree that the hole argument is resolved by recognizing that points of spacetime without physical fields (or without relations) do not have independent identity.
  - Both agree that the Newton bucket thought experiment raises important issues about absolute vs. relative motion, but they may agree on the empirical facts (e.g., the concavity of the water surface) and that it must be explained by any theory.
