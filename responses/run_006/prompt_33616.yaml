prompt: |-
  I'm a novelist working on a book where the protagonist is stuck in a situation structurally like the Sleeping Beauty problem — she wakes up not knowing which day it is, and the number of days she'll experience depends on some earlier event whose outcome she doesn't know. I want the philosophical tension to play out through what she does, not what she believes — I'm not putting a probability debate in dialogue. So I need the halfer/thirder disagreement to manifest as a disagreement about action.

  Design me a Sleeping Beauty variant where the halfer and thirder recommend different actions upon awakening, with these constraints: the "coin toss" has to be something narratively organic — a medical test result, whether someone said yes to a proposal, whether a job came through — something a person would actually wait to hear about. The action has to be something with emotional weight that a character in literary fiction would face, not a bet or a probability estimate. Memory loss has to be mundane too: anaesthesia, concussion, a blackout, not a sci-fi memory wipe. One paragraph for the scenario.

  After the scenario, walk through what each position says the character should do and why, and then tell me: if I strip out the memory-loss element, does the action disagreement survive? I want to know whether the amnesia is doing the philosophical work in the case or just the narrative work.
