prompt: |-
  People in ML twitter keep saying that LLMs have "knowledge-that" without "knowledge-how" — like, GPT-4 can tell you everything about how to ride a bike but couldn't actually ride one, and this supposedly shows there's something fundamentally missing from its understanding, that it's just a stochastic parrot with declarative knowledge and no procedural grasp. They're leaning on Ryle's distinction between knowing-that and knowing-how to argue that scaling up text prediction can't get us to general intelligence.

  But I'm not sure the analogy between what the LLM is doing and "knowledge-that" even holds up — like, is what the LLM has actually knowledge-that at all, in Ryle's sense, or is the whole thing a category error in the other direction? And even if the analogy holds, does the conclusion (LLMs can't be generally intelligent) follow?

  Can you audit this: what maps onto what between the LLM case and the knowing-how/knowing-that distinction as Ryle drew it, where the analogy breaks, what it smuggles in, and whether the argument survives the disanalogies? I'm especially intersted in whether the Rylean framework was even designed to do the kind of work people are making it do here.
reasoning: |-
  Okay, the user is asking me to analyze the use of Ryle's knowing-that/knowing-how distinction in criticisms of LLMs. They want me to examine whether this philosophical framework actually applies to what LLMs do, and whether the common argument that LLMs can't achieve general intelligence because they lack "knowledge-how" holds up.

  I need to recall Ryle's original distinction. Gilbert Ryle introduced this in "The Concept of Mind" to challenge Cartesian dualism. For Ryle, "knowing-that" refers to propositional knowledge (facts, descriptions), while "knowing-how" is the ability to perform skilled activities. Importantly, Ryle argued that knowing-how isn't reducible to knowing-that - you can know all the rules of chess intellectually but still play poorly. The key point was that intelligence manifests in intelligent behavior, not in some hidden mental state.

  Now looking at how this is applied to LLMs: Critics say LLMs have only "knowledge-that" - they can describe bike-riding but can't actually ride a bike. Therefore, they lack true understanding and can't achieve general intelligence. But I need to question this analogy at multiple levels.

  First, is what LLMs have even properly called "knowledge-that"? LLMs don't actually know facts; they generate plausible text based on patterns. There's no belief or justification - just statistical prediction. Calling this "knowledge" might be misleading. Their outputs resemble knowledge-that but the underlying mechanism is completely different from human cognition.

  Second, the knowledge-how criticism seems to ignore that Ryle's framework was about embodied human cognition. LLMs aren't embodied agents - they're text predictors. Expecting them to ride bikes is like criticizing a calculator for not writing poetry. The valid comparison would be whether they can perform intelligent actions within their domain of text generation.

  Third, we should consider whether LLMs might develop a form of "procedural knowledge" within their text domain. They can follow instructions, solve problems through chain-of-thought reasoning, and simulate decision-making processes. This looks like knowledge-how for linguistic tasks. The bike example is a category error because it demands physical embodiment.

  Regarding the general intelligence claim: Ryle never said knowing-how requires non-physical minds - he was arguing against dualism. Modern AI shows that intelligent behavior can emerge from complex systems. Scaling up LLMs has produced capabilities that resemble understanding. The criticism might be smuggling in assumptions about biological necessity.

  I should also examine whether the Rylean framework was intended for AI at all. Ryle was analyzing human concepts to avoid category errors - ironically, applying his distinction to LLMs might create new category errors by treating them as disembodied minds rather than tools.

  The user seems sophisticated in both philosophy and ML. They're questioning whether this popular critique holds water. I should provide a balanced analysis showing where the analogy fails and where it might have merit, while addressing their core concern about whether this argument validly limits LLMs' potential for general intelligence.
answer: |-
  Your skepticism is well-founded. Let's audit the argument by dissecting Ryle's distinction, its application to LLMs, and where the analogy holds or breaks down:

  ### 1. **Ryle's Distinction: Core Intent**
     - **Knowing-That (Propositional Knowledge):** Facts, descriptions, truths ("I know that Paris is the capital of France").
     - **Knowing-How (Procedural Knowledge):** Skills, abilities, capacities ("I know how to ride a bike").
     - **Ryle's Goal:** Attack Cartesian dualism ("ghost in the machine"). He argued that "knowing-how" is *not* reducible to "knowing-that" (e.g., knowing all bike-riding physics ≠ riding skill). Intelligence manifests in *intelligent behavior*, not just internal representations.

  ### 2. **Mapping to LLMs: Superficial Analogy**
     - **LLMs as "Knowing-That":** Critics claim LLMs output declarative statements (e.g., bike-riding steps) but lack ability to *execute* the skill (ride a bike). This mirrors Ryle's distinction: LLMs have "knowledge-that" but no "knowledge-how."
     - **Conclusion Drawn:** LLMs are merely "stochastic parrots" with no true understanding, incapable of general intelligence (AGI) without embodiment/action.

  ### 3. **Where the Analogy Breaks Down**
     - **LLMs Don't "Know-That" in Ryle's Sense:**
       - Ryle's "knowing-that" implies *propositional attitudes*: belief, justification, and intentionality. LLMs have **none of these**. They generate statistically plausible text, not beliefs. Calling this "knowledge-that" smuggles in cognitive properties LLMs lack.
       - *Category Error:* LLM outputs *resemble* knowledge-that but are generated via pattern-matching, not cognitive states. The analogy anthropomorphizes the system.
     
     - **LLMs Aren't Missing "Knowledge-How" Because They Aren't Agents:**
       - Ryle's "knowing-how" applies to *agents capable of action* (humans, animals). LLMs are **text predictors**, not embodied agents. Expecting them to "know-how" to ride a bike is like criticizing a wrench for not cutting wood.
       - A valid Rylean critique would target *AI systems with robotic bodies* that fail to ride bikes despite "knowing-that." For pure text models, the demand for physical "knowledge-how" is misplaced.

     - **LLMs Exhibit Procedural Knowledge *Within Their Domain*:**
       - They *do* have "knowledge-how" for **textual tasks**: following instructions, generating code, chain-of-thought reasoning. This *is* procedural knowledge (e.g., "how to structure a poem" or "debug Python code").
       - Dismissing this as "not real knowledge-how" because it's linguistic ignores that language *is* the LLM's domain of action. The bike analogy ignores the model's actual "embodiment" in text.

  ### 4. **What the Argument Smuggles In**
     - **Biological Chauvinism:** Assumes "true" understanding requires biological embodiment. Ryle never claimed this; his focus was on *behavior*, not substrate.
     - **Narrow Definition of "Action":** Limits "knowledge-how" to physical motor skills. But intellectual skills (e.g., mathematical problem-solving) are also "knowledge-how" – and LLMs can emulate these.
     - **Implicit Dualism:** Treats LLMs as "minds" lacking "bodies," ironically reviving the Cartesian ghost Ryle rejected. LLMs are better seen as *tools* (like wrenches) than disembodied minds.

  ### 5. **Does the Conclusion (No AGI) Follow?**
     - **No.** The argument conflates:
       1. *Current LLM limitations* (no physical embodiment).
       2. *Theoretical impossibility* (scaling can't yield AGI).
     - LLMs already show emergent "knowledge-how" in linguistic domains (e.g., solving novel puzzles). Scaling + integration with robotics *could* bridge the physical gap. Ryle's framework doesn't forbid this; it simply states that knowing-that ≠ knowing-how – a point irrelevant to whether a system can *acquire* both.

  ### 6. **Misuse of Ryle's Framework**
     - Ryle aimed to dissolve philosophical myths about the mind, not provide a theory of intelligence for AI. His distinction was **descriptive** (how we *talk* about knowledge), not **prescriptive** (what systems *must* have to be intelligent).
     - Applying it to LLMs commits a **reverse category error**: treating a linguistic artifact (the LLM) as if it were a conscious agent failing at Ryle's criteria, rather than a tool producing text based on correlations.

  ### Conclusion: Why the Argument Fails
  1. **LLMs don't have "knowledge-that"** in Ryle's sense (no beliefs/justification).
  2. **Demanding physical "knowledge-how"** is a category error for non-embodied systems.
  3. **LLMs *do* exhibit procedural knowledge** within their operational domain (text).
  4. **Ryle's distinction doesn't predict AGI impossibility**; it only notes that describing ≠ doing.
  5. **The "stochastic parrot" label** ignores emergent capabilities (e.g., theory of mind, reasoning) that suggest more than mere parroting.

  **Your instinct is correct**: The Twitter argument oversimplifies Ryle and misapplies his framework. LLMs challenge traditional categories – forcing "knowledge-that/how" onto them reveals more about our biases than their limitations. Scaling *might* not yield AGI, but Ryle’s distinction isn’t the reason why. The real gap is integration of learning, action, and embodiment – a challenge, not a dead end.
