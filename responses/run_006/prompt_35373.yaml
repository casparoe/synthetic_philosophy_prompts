answer: |-
  Your argument is incisive and touches on a core challenge for Evidential Cooperation in Large Worlds (ECL). The flaw lies primarily in **premise (4)**, but rejecting it has significant costs. Here's a breakdown:

  ### **The Flaw: Rejecting Premise (4)**
  **Premise (4) claims:**  
  > "The choice of reference class is not fixed by the decision problem itself, nor by EDT, nor by any obvious normative principle. It seems to be a free parameter."

  **Why (4) is false (or at least incomplete):**  
  ECL proponents argue that reference classes *are* constrained by **normative principles of Bayesian modeling**, specifically:  
  - **Minimality/Simplicity**: The reference class should be the *simplest* or *least arbitrary* grouping that captures all agents relevantly similar to you in the decision problem.  
  - **Algorithmic Information Theory (AIT)**: In a "large world" (where states can’t be exhaustively listed), agents are grouped by the *shortest computational description* of their decision problem.  
    - Example: In a Prisoner's Dilemma, the "correct" class includes all agents running *isomorphic copies* of your decision algorithm. "Agents born on Tuesdays" is excluded because it adds arbitrary complexity.  

  This is not causally grounded; it’s based on **Kolmogorov complexity** (the length of the shortest program that describes a set). An ideal Bayesian reasoner uses a prior that favors simpler worlds/programs, making some reference classes objectively *more natural* than others.

  ---

  ### **How This Addresses Your Argument**
  - **Premise (3)**: While many reference classes *exist*, only a subset are *natural*. A narrow class (e.g., "me at this exact nanosecond") is complex (it requires specifying precise spacetime coordinates). A broad class (e.g., "all agents facing a Prisoner's Dilemma") is simpler.  
  - **Premise (5)**: You *can* gerrymander reference classes to favor any action, but unnatural classes are penalized by the simplicity prior. An ideal agent would assign them low probability.  
  - **Premise (6)**: Yes, the ideal Bayesian uses a prior, but AIT provides an *objective* measure of simplicity (though uncomputable). This avoids arbitrariness.  
  - **Premise (7)**: ECL doesn’t collapse into CDT. CDT uses causal graphs (e.g., "my choice *causes* my outcome"). ECL uses *evidential links* between your choice and abstract patterns in the world, grounded in algorithmic similarity.  

  ---

  ### **The Cost of Rejecting (4)**
  Accepting this reply commits you to:  
  1. **Idealization**: The "correct" reference class is defined for an *idealized agent* with unlimited computational resources and a Kolmogorov complexity prior. Real-world agents must approximate this.  
  2. **Epistemic Humility**: You can’t know the *true* reference class; you can only aim for the *least arbitrary* one given your computational limits.  
  3. **Controversial Foundations**: You must accept AIT or similar frameworks as normative for Bayesian reasoning. Critics argue this is circular or empirically unmotivated.  

  ---

  ### **Why Other Premises Hold (and Why (4) is the Key)**
  - **(1)-(3)** are correct: ECL *does* depend on conditional probabilities and reference classes.  
  - **(5)-(8)** follow if (4) is true. But if reference classes are normatively constrained, ECL avoids emptiness and maintains its distinctness from CDT.  

  ---

  ### **A Concrete Example: Prisoner’s Dilemma**
  Suppose you’re in a one-shot Prisoner’s Dilemma:  
  - **Narrow class** (only you): Cooperating gives no info about others → defect dominates.  
  - **Broad class** (all isomorphic agents): Cooperating suggests others cooperate too → cooperation may win.  
  - **Gerrymandered class** ("all agents named Alice"): Arbitrarily favors cooperation or defection.  

  **ECL verdict**: The broad class is simplest (it requires no ad-hoc details). An ideal agent cooperates. This isn’t CDT (which defects, as your choice causes no physical link to others).  

  ---

  ### **Conclusion**
  Reject **premise (4)**. Reference classes in ECL are not arbitrary; they’re constrained by normative principles of simplicity and algorithmic information theory. The cost is accepting that **cooperation hinges on idealized Bayesian reasoning** rather than tangible causal links. This preserves ECL’s promise of acausal cooperation but makes it highly theoretical. For deeper engagement, see Oesterheld’s work on *"AIT alignment"* or Demski’s *"Logical Prior Probability"*.  

  If this solution feels unsatisfying, it’s because ECL’s normative force relies on a controversial epistemic foundation—one that may be necessary to avoid your arbitrariness trap.
