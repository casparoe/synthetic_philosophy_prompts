prompt: |-
  I am a retired experimental physicist who has recently taken up moral philosophy. There is a recurring puzzle in the consent literature that I have not seen given a satisfactory name or taxonomy, and I would like to know whether one exists.

  The puzzle concerns the role of deception. It seems clear that some deceptions invalidate consent while others do not, and the standard move is to distinguish deceptions about the nature of the act from deceptions about collateral matters — its consequences, the identity or motives of the other party, and so on. But I find that this distinction collapses under pressure in ways that are rarely acknowledged.

  Take three cases. (1) A surgeon tells a patient she will perform a biopsy but instead performs a sterilization. Consent is clearly invalid. (2) A surgeon accurately describes a procedure but falsely claims it is medically necessary to prevent cancer when it is in fact elective and performed for profit. Many would say consent is not vitiated, or at least not in the same way. (3) A person pretends to be a licensed physician, performs an examination identical to what a real physician would do, and the "patient" consents to being examined by someone they believe is a doctor. Is this closer to (1) or to (2)? One could say the patient consented to a medical exam and got one — the deception was about credentials, a collateral matter. Or one could say the patient consented to an exam by a doctor and got something else entirely — an exam by an impostor — so the deception went to the nature of the act itself.

  What interests me is not the legal answer (I understand the law has categories like fraud in the factum and fraud in the inducement) but whether moral philosophy has developed a principled way of drawing this line, what it is called, and what criterion does the work. If the leading view is that there is no sharp line and that consent comes in degrees or is context-sensitive in a way that resists a single criterion, I would want to know that too, and how that view handles the impostor case.
reasoning: |-
  Okay, let me tackle this retired physicist's query. They're diving into moral philosophy, specifically consent and deception. The user presents three cases where deception plays different roles, challenging the standard distinction between deception about the act's nature versus collateral matters. 

  First, I need to unpack their examples. The surgeon cases show clear violations in (1) but ambiguity in (2) and (3). The core struggle is determining when deception invalidates consent morally, not legally. The user mentions fraud in the factum vs. inducement but wants a moral framework.

  Recalling ethical theories: autonomy is central here—consent requires understanding. For deception to invalidate consent, it must undermine the agent's ability to grasp the act's fundamental nature. But where's that line? The impostor case (3) is tricky. If someone consents to an exam by a doctor but gets an impostor, is the act fundamentally different? The user points out both interpretations: one sees the physical act as identical (collateral deception), the other sees the social/relational context as essential (invalidating consent).

  I remember Onora O'Neill's work on informed consent and deception. She emphasizes the agent's understanding. Also, Scanlon's contractualism might apply—what principles we'd agree to if deceived. The impersonation case likely shifts the act's meaning relationally, so consent isn't fully informed. 

  The user might be hinting at a deeper issue: binary distinctions (nature vs. collateral) are too rigid. Context matters; some factors are integral to identity or consequences. Maybe autonomy-based views need expansion—perhaps relational autonomy, where trust and roles are inherent to the act. 

  Also, considering moral luck: in case (2), if the surgeon lies about necessity, the physical act is the same, but the purpose changes. Does that alter the act's nature? Ethically, yes, because the patient's reasons for consenting (cancer prevention vs. profit) are core to their autonomy. 

  The impostor case feels closer to (1) morally because the relational aspect defines the act. A medical exam by a licensed professional versus an impostor involves different rights, duties, and risks, making it a different act. So, collapsing the distinction happens when collateral details are integral to the act's description under which consent is given. 

  The user might appreciate knowing if philosophy acknowledges blurred lines. Yes—contextualists like Wertheimer argue consent validity depends on normative expectations. If society deems credentials essential, then deception invalidates. But that's contingent, not universal. 

  In conclusion, the key is whether the deception negates the agent's understanding of core features that define the act according to their values. No strict taxonomy exists, but autonomy-based criteria with contextual sensitivity are leading approaches. The impostor case is handled by recognizing relational elements as fundamental in certain contexts.
answer: |-
  Your insight into the deceptive consent puzzle is profound—it exposes a genuine tension in moral philosophy that resists neat categorization. While no universally accepted taxonomy exists, several frameworks attempt to address this, each with limitations. Here's a breakdown of key approaches:

  ### 1. **The "Fundamental Misdescription" Criterion (Autonomy-Based View)**  
     - **Core Idea**: Consent is invalid if deception concerns a feature that *fundamentally alters the nature of the act* according to the consenting agent's values. This prioritizes the agent's perspective over objective categories.  
     - **Mechanism**:  
       - Act (1) involves a misdescription of the *physical act itself* (biopsy vs. sterilization).  
       - Act (2) deceives about *motives/consequences* but not the physical act—thus less central to autonomy.  
       - Act (3) hinges on whether "being examined by a licensed physician" is part of the act's *essential description*. If credentials define the act (e.g., due to trust, expertise, or legal status), consent is vitiated.  
     - **Strengths**: Grounded in respect for autonomy; flexible to contextual values.  
     - **Weaknesses**: Risk of subjectivity ("essential" features vary by person/situation).  

  ### 2. **Normative Expectations Framework (Scanlonian/Contractualist)**  
     - **Core Idea**: Consent is invalid if deception violates *reasonable normative expectations* inherent to the act-type.  
     - **Application**:  
       - Medical procedures carry expectations of therapeutic intent and qualified practitioners.  
       - In (3), impersonating a physician breaches the trust and competence presupposed in "consent to a medical exam."  
       - In (2), lying about necessity violates medical ethics but may not negate consent *if* the procedure itself is accurately described.  
     - **Strengths**: Context-sensitive; aligns with social practices.  
     - **Weaknesses**: Culture-dependent; may not resolve edge cases (e.g., non-medical impostors).  

  ### 3. **The "Moral Transformation" View (Inspired by Parfit/Wertheimer)**  
     - **Core Idea**: Deception invalidates consent if it changes the act into one with *distinct moral properties* (e.g., harm, rights-violation).  
     - **Analysis**:  
       - Sterilization without consent (1) is a bodily violation; an elective surgery (2) is not inherently wrongful.  
       - The impostor (3) may commit fraud (a wrong) but the exam itself might lack inherent harm—blurring the line.  
     - **Strengths**: Focuses on moral outcomes.  
     - **Weaknesses**: Risks circularity (consent defines wrongness, but wrongness defines validity).  

  ### 4. **Gradationist/Contextualist Approaches**  
     Many philosophers (e.g., **Onora O'Neill**, **Tom Beauchamp**) reject binary validity, arguing consent is *diminished* rather than nullified in complex cases:  
     - **Degrees of Defectiveness**: Consent can be "weakened" by deception without being fully invalid.  
       - (1) = Fully invalid (no consent).  
       - (2) = Compromised (consent to surgery, but not *this* surgery under false pretenses).  
       - (3) = Contextually invalid if credentials are material (e.g., intimate exams), but possibly valid in low-stakes scenarios.  
     - **The Impostor Case**: Handled by asking: *"Would consent have been given if the truth were known?"* If not, the act proceeds without adequate authorization, violating autonomy.  

  ### Why the Distinction Collapses  
  As you observe, the "nature vs. collateral" dichotomy fails because:  
  - **Relational Acts**: Some acts (like medical exams) are defined by social roles. An "exam by an impostor" is ontologically distinct from "exam by a physician" due to broken trust, lack of oversight, and potential harm.  
  - **Motives Matter**: In (2), if the patient consents *only* to prevent cancer, the deception may transform their understanding of the act’s *purpose*—a feature central to their autonomy.  

  ### Leading Terminology  
  - **Integral Deception** (vs. **Collateral Deception**): Emphasizes whether the deceived feature is integral to the agent's conception of the act.  
  - **Reason-Altering Deception**: Focuses on whether the lie distorts the agent's reasons for consenting.  
  - **Normative Fraud**: Deception that subverts the moral/legal framework of the interaction (e.g., impersonation).  

  ### Conclusion  
  Moral philosophy increasingly favors **contextual gradation** over rigid taxonomies. The dominant criterion is whether deception *undermines the agent's understanding of features they deem fundamental to their choice*. For the impostor case, this often hinges on:  
  - **Materiality**: Are credentials/material to the consent-giver’s decision?  
  - **Relational Deficit**: Does impersonation rupture the trust required for the act?  
  - **Harm Risk**: Does the deception create unforeseen dangers (e.g., incompetence)?  

  This approach acknowledges that consent’s validity depends on how the act is *constituted* in the agent’s practical reasoning—a view resonant with your physics background, where the "same" physical event (e.g., an exam) may be a different *kind* of act under varying relational conditions.  

  **Key References**:  
  - O'Neill, *Autonomy and Trust in Bioethics* (2002)  
  - Wertheimer, *Consent to Sexual Relations* (2003)  
  - Scanlon, *Moral Dimensions* (2008)  
  - Miller & Wertheimer, *The Ethics of Consent* (2010)
