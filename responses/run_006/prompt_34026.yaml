  Also, considering rival theories: if someone believes concepts are innate (nativism), they might argue that changing words doesn't alter thought. But even then, the reform can be about social signaling. Universalists might see gendered language as arbitrary but still support change for inclusivity. The key is that the reform doesn't strictly require determinism; alternative justifications exist.

