prompt: |-
  My reading group has been going back and forth on the socialist calculation debate for months and we're tired of talking past each other. Two of us are going to do a proper adversarial collaboration -- one defending the Hayek/Mises position and one defending the Lange/Lerner market-socialist response -- and write a joint statement we can both sign. I want you to draft that document.

  Here's what I need. First, a numbered list of claims both sides agree on: about the formal structure of the problem, about what Mises actually argued in the 1920 paper, about what Lange conceded and didn't concede, about what a solution would need to accomplish. These should be substantive, not just "both sides agree that allocation matters."

  Second, a disagreements table. Each row should state the precise point of disagreement in neutral wording, then give the Hayek/Mises formulation they'd accept for their own view, then the Lange/Lerner formulation they'd accept for theirs. No strawmen. If either side would say "I wouldn't put it that way," redo it.

  Third, the cruxes. These are the sub-questions where, if we could settle them, at least one side would substantially revise their view. For each crux, give the concrete case or evidence both sides would agree bears on it, and what each side predicts about it. I suspect one crux is gonna be whether Hayek's tacit knowledge point is an in-principle limit on formalization or just a practical one, and another is whether Lange's trial-and-error price adjustment would actually converge under realistic conditions. There may be others.

  Don't include citations or a reading list, I'll handle that. And don't try to adjudicate -- the point of the document is that both camps can sign it while their disagreement remains genuine and sharp.
