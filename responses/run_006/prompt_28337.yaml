answer: |-
  My dear friend,  

  Your exploration of the doctrine of double effect (DDE) touches the nerve of how moral reasoning, legal practice, and philosophical theories of action intertwine, often revealing tensions beneath the surface of seemingly consistent judgments. Let me try to reconstruct the implicit view of intention and action underpinning these diverse practices, then grapple with the legal inconsistency you noted, and finally consider where the practice is underdetermined and what shifts might occur under a rival theory.  

  The pattern you observe – across medicine, warfare, and theology – presupposes a specific, robust theory of human intention. Here, intention isn't merely a synonym for foresight or even desire; it refers to the *structure of the agent's practical reasoning and chosen plan*. An effect is "intended" when it is either (1) an *aim* (the ultimate goal for which one acts) or (2) a *means* (a necessary step or constituent part of the plan chosen to achieve the aim). Conversely, an effect is "merely foreseen" (a side effect) when it is a *consequence* of the chosen action that is not part of the agent's reason for acting or the structure of the means employed to achieve the good end.  

  The critical work this distinction performs is *moral categorization*. It holds that intending a bad effect (as aim or means) involves the will directly embracing evil, which is argued to be intrinsically wrong. Merely foreseeing a bad effect, while still requiring justification (the good must be proportionate and the bad not disproportionate), allows the act itself to be potentially permissible because the evil is not chosen *as such*. The agent's will remains oriented towards the good, merely tolerating the bad as an unavoidable consequence. This distinction isn't merely a post-hoc label; it purports to reflect a real difference in the *kind of action* performed. The physician relieving pain acts *differently* (even if causally similar) from the one intending death; the bomber targeting munitions acts *differently* from the one targeting civilians. The DDE claims this difference in intentional structure has fundamental moral significance, irrespective of identical outcomes.  

  Drawing this distinction *principledly* is notoriously difficult at the margins. Is diverting a trolley onto a siding where it will kill one person to save five "using" that death as a means? Some argue yes (it's part of the causal pathway), others no (the death isn't the *mechanism* stopping the trolley, merely a consequence). Is withdrawing life-sustaining treatment "intending death" or merely accepting it as a consequence of ceasing an intervention? Much hinges on how finely we describe the object of the act ("removing an impediment" vs. "causing death") and whether the bad effect is truly separable from the means. Yet, despite grey areas, the core distinction – bombing the munitions *to destroy it* vs. bombing it *to kill the workers* – feels intuitively clear and is drawn consistently in principle, even if application wobbles.  

  Now, to the legal inconsistency you astutely raise. How can the law simultaneously embrace DDE distinctions (absolving the palliative care doctor, condemning the terror bomber) while instructing juries that people intend the "natural and probable consequences" of their acts (implying foresight *is* intent) and imposing tort liability based on mere foreseeability? This isn't necessarily a sign of two different theories of intention, but rather the law employing intention in distinct *functional* ways across different contexts.  

  Criminal law, especially for serious offenses like murder or war crimes, often requires *specific intent* (mens rea). Here, the law *does* try to get at the agent's actual purpose or chosen means, aligning with the DDE view. Proving the bomber *aimed* at civilians requires showing this was their objective or chosen method. DDE provides a framework for interpreting this specific intent. Conversely, the "natural and probable consequences" doctrine typically applies in contexts like accomplice liability or certain statutory crimes where *recklessness* or *knowledge* suffices for a lesser form of culpability. It functions as an evidentiary rule or presumption: if the consequence was virtually certain and the actor knew it, the law *may* infer intent for the *purpose of establishing liability* for that *particular offense*, recognizing that the actor showed such disregard that they are treated *as if* they intended it. This doesn't mean the law has abandoned the core distinction between purpose and foresight *philosophically*; it means that for *some legal purposes*, foresight of near-certainty is treated as morally and legally equivalent to intent due to the culpable indifference displayed. Tort law, focused on compensation and risk allocation, understandably prioritizes foreseeability; its aim is different from criminal law's focus on culpability for forbidden mental states. So, while tension exists, the two approaches can co-exist: the core DDE distinction governs the definition of the most culpable acts requiring specific intent, while the foreseeability doctrines address broader liability for recklessness or in contexts where proving specific intent is pragmatically difficult.  

  Where is the practice genuinely underdetermined? Rival theories of intention *can* license the same verdicts in core DDE cases without invoking the means/side-effect distinction. A strict deontologist might hold that directly causing death is always wrong, period, condemning craniotomy *and* palliative morphine (a position some hold). A pure consequentialist might permit both craniotomy *and* direct euthanasia if outcomes are identical, bypassing intention entirely. A "volitionist" theory focusing solely on the conscious choice of the act-description might struggle to differentiate the bomber cases if the physical acts are identical. What holds the current practice together is a shared (though often implicit) commitment to the *moral significance of the reason for acting and the structure of the plan*. Theories that reject this significance (like pure consequentialism) or define "directness" differently can arrive at different conclusions even with the same facts.  

  If we replaced the underlying view with a purely causal/probabilistic account ("responsibility tracks foreseeable harm"), the landscape would shift dramatically. Palliative care involving foreseeably lethal morphine doses would become legally and morally indistinguishable from euthanasia – both involve knowingly causing death. The physician would be seen as "killing" in both scenarios. Bombing the munitions plant foreseeing civilian deaths would be assessed *solely* by the numbers and probabilities: if the strategic value outweighed the civilian cost, it's permissible; if not, it's not. The bomber's *purpose* (destroying munitions vs. killing workers) would become irrelevant; only the outcome and its foreseeability would matter. The hysterectomy and craniotomy would likely be judged similarly: both foreseeably cause fetal death to save the mother. The crucial moral distinctions drawn in current practice – distinctions rooted in *why* the agent acted and *how* the harm fits into their plan – would collapse. Acts currently seen as categorically different (relieving pain while accepting death vs. killing; destroying a target while accepting collateral damage vs. terror bombing) would be placed on a single continuum of foreseeable harm, judged only by consequences and proportionality. The character of the agent's choice, central to the DDE framework, would fade from view.  

  The doctrine of double effect, then, isn't just a curious relic; it reflects a deeply embedded understanding of agency where *what we choose to do* and *why* matters fundamentally, shaping the moral character of the act itself, even amidst complex causal webs. Its persistence in practice signals an enduring intuition that not all harm we cause is the same, even when the body count is identical.  

  Warmly,  
  A Fellow Traveler in Thought
