prompt: |-
  I've been thinking on my own about what to do when I'm not sure what's morally right, and I've collected my gut reactions on a handful of cases. I'd like to know whether there's a single principle that fits them — or most of them — and what that principle would say about a case I'm stuck on.

  Here are the cases and my verdicts:

  1. I'm about 70% confident that buying factory-farmed chicken is wrong, and 30% confident it's permissible. The enjoyment I get from eating it is real but modest — it's a preference, not something central to my life. My gut says I should stop buying it.

  2. I'm choosing where to donate. I'm 55% confident that Charity A does more good per dollar, but if Charity B is the better one, it does vastly more good — the expected-impact calculation favors B by a wide margin. My gut says give to B.

  3. A friend asks whether I like their new haircut, which I think looks terrible. I'm 80% confident that a small lie to spare their feelings is fine, and 20% confident that any deliberate deception is seriously wrong — a failure of respect. My gut says I should tell the truth, or at least not lie.

  4. I'm 60% confident that having children is morally permissible and 40% confident it's wrong (because of the suffering the child will inevitably experience). My gut says it's still permissible to have children.

  5. I'm 95% confident I should keep a promise to meet a friend for coffee, but there's a 5% chance I should break it to help a stranger who seems distressed and needs directions. My gut says keep the promise.

  I notice that in case 2 I seem to be maximizing expected value, but in case 3 a 20% risk of serious wrongness sways me completely, even though an expected-value approach might not. And in case 1 I'm deferring to the possibility of wrongness, but in case 4 I'm not, even though the stakes in case 4 are far higher. I can't tell whether I'm inconsistent or whether there's a principle that makes sense of this pattern. Is there one? And what would it say about a case I keep going back and forth on: I'm 50% confident that eating animals is wrong and 50% confident it's permissible — what should I do?
reasoning: |-
  Hmm, the user is grappling with moral uncertainty and trying to find a consistent principle behind their intuitive judgments across various scenarios. They've presented five cases with their gut reactions and noticed apparent contradictions - sometimes they follow expected value maximization (case 2), other times they avoid small risks of serious wrongs (case 3), and they treat similar uncertainty differently in cases 1 and 4 despite higher stakes in the latter.

  Let me analyze their cases systematically. In case 1 (factory-farmed chicken), they're leaning toward abstaining despite only 30% confidence it's wrong - likely because the personal benefit is small while the potential moral violation feels significant. Case 2 (charity choice) shows clear expected value calculation where they follow the higher expected impact. But case 3 (white lie) reveals a threshold effect - 20% chance of "seriously wrong" overrides the 80% chance of permissibility. Case 4 (having children) is fascinating because they permit it despite 40% chance of wrongness, suggesting the potential wrong isn't framed as absolute. Case 5 (promise-breaking) shows strong default to commitment even with alternative good outcomes.

  The key tension is between two approaches: expected moral value (EMV) and avoiding nonconsensual moral risks. EMV works for cases 2 and 5 but fails to explain their aversion in cases 1 and 3. The nonconsensual risk aversion explains cases 1 and 3 but not 4. 

  Ah - the distinction lies in who bears the risk. In childbearing (case 4), the risk is borne by the future child who can't consent, but the act of creating life might carry different moral weight than imposing risks on existing beings. Whereas in case 1 (eating meat) and case 3 (lying), the risks are imposed on others without their consent. This explains why they're more risk-averse in those scenarios.

  For their 50/50 dilemma about eating animals, the nonconsensual risk principle suggests abstinence. Even at 50% confidence, imposing the risk of serious wrong on animals without their consent would be problematic - especially since the personal benefit is comparable to the chicken case. The magnitude of potential harm (animal suffering) is high, and alternatives exist. This aligns with their intuitive aversion in case 1 despite lower confidence.

  The user seems philosophically sophisticated - they're noticing subtle patterns in their own intuitions and seeking coherence. Their underlying need might be for a practical decision procedure that respects both moral seriousness and psychological realism. I should emphasize that consistency doesn't require identical treatment of all uncertainties, but rather sensitivity to different moral factors in play.
answer: |-
  Your intuitions reveal a coherent pattern! You're navigating **moral risk aversion** for actions that impose significant, non-consensual harm on others, while defaulting to **expected value maximization** for decisions primarily affecting yourself or involving consenting parties. Here’s how your cases align with this principle:

  ### Core Principle:
  **"Avoid actions with a non-trivial risk of causing serious, non-consensual harm to others, unless the benefit is overwhelming and personal sacrifice is minimal."**  
  This combines:
  1. **Risk aversion for severe harms** (especially without consent),
  2. **Expected value for net-positive/gain-focused choices**,
  3. **Deference to autonomy/commitments** when risk is low.

  ### Breakdown of Your Cases:
  1. **Factory-Farmed Chicken (Stop Buying):**  
     - Low confidence (30%) it’s permissible, but *potential harm to animals is severe* (suffering/death).  
     - Your benefit is trivial ("modest enjoyment").  
     → **Risk-averse verdict**: Avoid imposing non-consensual harm for minor gain. ✅

  2. **Charity Choice (Give to B):**  
     - Focus on *maximizing expected good* (higher impact even with uncertainty).  
     - No direct harm risk; potential beneficiaries *consent to aid*.  
     → **Expected-value verdict**: Prioritize net benefit. ✅

  3. **White Lie (Don’t Lie):**  
     - Small risk (20%) of "seriously wrong" (violating respect/autonomy).  
     - Harm is non-consensual (deceiving your friend).  
     - Benefit is small (sparing feelings).  
     → **Risk-averse verdict**: Avoid moral violation even with low probability. ✅

  4. **Having Children (Permissible):**  
     - High uncertainty (40% wrong), but *no existing person is harmed*; the child’s life is *created* (not imposed on an unwilling being).  
     - Potential for net-positive life (you judge "permissible" reflects this).  
     → **Expected-value verdict**: Life creation isn’t analogous to harming existing beings. ✅

  5. **Breaking a Promise (Keep It):**  
     - Very low risk (5%) of greater good, but breaking promises undermines trust (non-consensual harm to the friend).  
     - Benefit to stranger is uncertain.  
     → **Risk-averse verdict**: Honor commitments when risk to others’ autonomy is present. ✅

  ### Why This Isn't Inconsistent:
  - **Cases 1 & 3** prioritize avoiding *imposing harm/risk on others without consent*.  
  - **Cases 2 & 4** focus on *maximizing good* where harm isn’t central (charity) or involves creation (children).  
  - **Case 5** protects relational autonomy (promises).  

  The key distinction is **non-consensual imposition of risk vs. consensual/gain-focused contexts**. When you risk harming others without their consent—even with low probability—you avoid the action unless your sacrifice is disproportionate (unlike the trivial chicken benefit). When no one is directly wronged, you maximize expected value.

  ---

  ### Your Stuck Case: Eating Animals (50% Confidence It’s Wrong)
  **Apply the principle:**  
  - If eating animals is wrong, it likely involves **serious, non-consensual harm** (animal suffering/killing).  
  - If permissible, your benefit is **modest gustatory pleasure** (like factory-farmed chicken).  
  - You’re imposing risk on beings who can’t consent (animals).  

  **Verdict:** **Stop eating animals.**  
  - At 50% confidence of serious wrongness, the *moral risk* is significant.  
  - Your benefit is trivial, while potential harm is severe.  
  - This mirrors Case 1—but with *higher* uncertainty (50% vs. 30%) making abstinence *even more* reasonable.  

  ### Why This Fits Your Pattern:
  - Like Cases 1 and 3, you’d avoid actions risking non-consensual harm for minor personal gain.  
  - Unlike Case 4 (childbearing), you’re not creating a new life but potentially harming existing beings.  
  - Unlike Case 2 (charity), there’s no high-stakes "greater good" tradeoff—just personal preference vs. ethical risk.  

  **In short:** When your actions risk serious harm to others without consent, and your gain is small, your principle demands caution. Abstaining from meat at 50% uncertainty aligns perfectly with your risk-averse intuitions in Cases 1, 3, and 5.
