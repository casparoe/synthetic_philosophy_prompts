prompt: |-
  I'm in a philosophy of probability seminar and we've spent the last two weeks on the reference class problem: a single event (this tumor being malignant, this driver causing that crash, this coin landing heads) has no probability until you sort it into a class, but the same event belongs to indefinitely many classes that give different numbers, and nothing in the world seems to pick one of them as the right one. Every time I read a proposed solution it just picks a class and then argues about it, and I'm tired of watching people argue one case at a time.

  Before I read any more of them I want the spec, not another theory. Write the desiderata: what does an adequate account of reference-class selection for single-case probabilities have to deliver? For each requirement, say what case or consideration forces it, and mark it non-negotiable versus a preference of one camp (frequentist, propensity, subjectivist, legal-evidence people, whatever). I'm especially after two things: wether some subset of these requirements is jointly unsatisfiable (that's the part I'd bring to class), and which single requirement does the most to kill the popular fixes like always taking the narrowest reference class that still has reliable statistics. Also, I know some people think the right move is to deny that single-case probabilities are a thing at all — if that's a live option, say which requirements it satisfies and which it flouts. Give me exactly seven, as a numbered list, each item a sentence or two, no introduction or conclusion.
reasoning: |-
  Okay, the user is in a philosophy of probability seminar and has been grappling with the reference class problem for two weeks. They're frustrated with proposed solutions that just pick a reference class and argue case by case. They want a clear set of desiderata for an adequate account of reference-class selection. 

  First, I need to understand the core issue: the reference class problem arises because a single event can belong to multiple classes, each giving different probability values, and there's no objective way to choose the "right" class. The user wants seven specific requirements that any solution must meet, noting which are non-negotiable and which are camp-specific. They also want to know if some requirements conflict and which one undermines popular fixes like using the narrowest class with reliable statistics.

  The user mentioned different camps: frequentist, propensity, subjectivist, legal-evidence. Each has different takes. Frequentists focus on long-run frequencies, so they'd prioritize statistical relevance. Propensity theorists might look for inherent properties. Subjectivists care about rational belief, so individual credences matter. Legal contexts need practical, defensible choices.

  Breaking down the desiderata:

  1. **Consistency Requirement**: Probabilities must be unique. Non-negotiable. Forces the issue because if the same event has multiple probabilities, it leads to contradictions. This kills narrowest class approaches since different narrow classes can exist.

  2. **Objectivity Requirement**: Some camps (frequentists, propensity) demand objective probabilities independent of human choices. Non-negotiable for them. Subjectivists would reject this. The problem forces it because without objectivity, probabilities seem arbitrary.

  3. **Grounding Requirement**: Probabilities must be based on real-world data. Non-negotiable for frequentists. Forces the issue because without data, probabilities aren't empirical. This challenges propensity theories that rely on unmeasurable tendencies.

  4. **Relevance Requirement**: The class must include all relevant information. Non-negotiable across camps. Cases like Simpson's paradox show irrelevance leads to wrong probabilities. This undermines broad classes that ignore key factors.

  5. **Practicality Requirement**: The class must be usable with available data. Crucial for applied fields like legal evidence. Forces the issue because ideal classes might not exist. This conflicts with the need for narrowness if data is sparse.

  6. **Non-Arbitrariness Requirement**: The choice can't be arbitrary. Non-negotiable. Forces the issue because arbitrary choices make probabilities meaningless. This challenges any approach that doesn't provide a clear method.

  7. **Single-Case Applicability Requirement**: Must assign probabilities to single events. Non-negotiable for those who believe in single-case probabilities. Frequentists might deny this, leading to a conflict with other requirements.

  Now, joint unsatisfiability: Requirements 1 (consistency) and 7 (single-case applicability) clash with 3 (grounding in data) and 5 (practicality). If you need a unique probability for a single case but also need data, narrow classes might lack data. Frequentists avoid this by denying single-case probabilities, satisfying 2,3,4,6 but flouting 7.

  The requirement that kills narrowest class fixes is Consistency (1). If you pick the narrowest class with data, but there are multiple equally narrow classes with different probabilities, inconsistency arises. For example, a patient could be classified by age or by a specific gene, each giving different probabilities.

  Also, Non-Arbitrariness (6) is a problem because choosing between relevant classes isn't guided. Objectivity (2) is tricky if no natural class exists.

  The user wants to bring joint unsatisfiability to class. Highlighting that 1,3,5,7 can't all be met: single-case unique probabilities grounded in data and practical are impossible when data is sparse. Frequentists drop 7, subjectivists drop 2, etc.

  Each requirement's justification must be tied to a case or consideration. For example, Simpson's paradox for Relevance, conflicting narrow classes for Consistency.
answer: |-
  Here are seven desiderata for reference-class selection in single-case probability, each justified by core cases or theoretical considerations, with negotiation status and camp affiliations noted:

  1.  **Uniqueness Requirement**: An account must assign a single, definite probability value to the event. *Justification*: Assigning multiple conflicting probabilities (e.g., 0.3 based on age, 0.7 based on tumor location) for the same prediction/decision leads to practical paralysis (e.g., "Should the surgeon operate?"). **Non-negotiable** for accounts committed to objective single-case probabilities (some Propensity, Legal-Evidence), but rejected by Frequentists denying single-case probabilities exist.

  2.  **Objectivity Requirement**: The selected reference class must be determined by features inherent to the event or the world, not by the knower's choices or interests. *Justification*: Without this, probability becomes observer-relative (e.g., the "probability" of *this* coin landing heads changes if one analyst classes it as "US coins" and another as "coins flipped by left-handers"), violating the intuition that probability is a discoverable feature. **Non-negotiable** for objective interpretations (Frequentist, Propensity, Legal-Evidence), but rejected by Subjectivists.

  3.  **Grounding Requirement**: The probability value must be empirically grounded in reliable statistics or well-supported theoretical models derived from the reference class. *Justification*: A probability based on a class lacking data (e.g., "tumors *exactly* like this one in all microscopic details") is vacuous or merely hypothetical. **Non-negotiable** for empiricist camps (Frequentist, Legal-Evidence), a challenge for Propensity theories relying on unmeasurable dispositions.

  4.  **Maximal Specificity/Relevance Requirement**: The reference class must include all and only properties relevant to the outcome for that event. *Justification*: Simpson's Paradox cases show failure (e.g., a drug appearing harmful overall but beneficial within each relevant subpopulation defined by disease severity). Omitting a relevant factor (e.g., severity) yields a misleading probability. **Non-negotiable** across most camps (Frequentist, Propensity, Subjectivist, Legal-Evidence) as a core goal, though defining "relevance" is contentious.

  5.  **Practical Accessibility Requirement**: The relevant reference class must be feasibly identifiable and its statistics reasonably obtainable with available resources. *Justification*: Demanding perfect maximal specificity (requirement 4) often leads to singleton classes lacking data (requirement 3 failure), rendering probability useless for real decisions (e.g., a doctor cannot wait for infinite data on "identical" tumors). **Non-negotiable** for applied contexts (Legal-Evidence, Medical Decision-Making), often a pragmatic concession for others.

  6.  **Non-Arbitrariness Requirement**: The selection procedure must avoid being fundamentally arbitrary or circular ("pick the class that gives the probability you need"). *Justification*: Arbitrary selection (e.g., choosing between "male smokers over 60" and "smokers with type-O blood" for a cancer risk) undermines the authority of the assigned probability, making it useless for justification (e.g., in court). **Non-negotiable** for any account claiming rational or objective status.

  7.  **Single-Case Applicability Requirement**: The account must directly deliver a probability *for the specific singular event* (e.g., *this* tumor, *this* coin flip). *Justification*: Many core uses of probability demand this (e.g., individual diagnosis, unique historical event assessment, betting on a single game). **Non-negotiable** for camps committed to single-case probabilities (Propensity, Subjectivist, Legal-Evidence), but explicitly rejected by Strict Frequentists (who see probability only as a long-run frequency over repeated trials).

  **Joint Unsatisfiability**: Requirements **1 (Uniqueness)**, **3 (Grounding)**, **4 (Maximal Specificity)**, and **5 (Practical Accessibility)** are likely jointly unsatisfiable. Maximal Specificity (4) demands a highly specific class, but this often lacks data (violating 3) or is practically inaccessible (violating 5), forcing a broader class. However, broader classes may omit relevant factors (violating 4) and different analysts might choose *different* broader classes yielding different probabilities (violating 1). Strict Frequentism avoids this by rejecting 7 (Single-Case Applicability).

  **Requirement Killing "Narrowest with Data"**: Requirement **1 (Uniqueness)** does the most damage. The "narrowest reliable statistics" fix fails because there are often multiple equally narrow, non-nested classes with reliable statistics yielding different probabilities (e.g., classifying a patient by *age + gender* vs. *genetic marker A + symptom B*). This violates Uniqueness directly. Requirement **6 (Non-Arbitrariness)** also kills it, as choosing *which* narrow class to use lacks a principled basis.
