  I should address the roommate's dismissal. Comparing it to other non-physical harms could help. If someone sent threatening messages, the harm isn't physical but still real. Similarly, VR assaults affect mental and emotional well-being. The persistence of their feelings shows the impact is lasting, which underscores the reality of the harm.

  Are there counterarguments? Yes, the virtual nature means no physical damage. But emotional trauma doesn't require physical contact. The key is the violation of consent and personal space. Also, the ability to log off is a factor, but in social VR, the expectation of safety is reasonable. Leaving shouldn't be the only solution.

