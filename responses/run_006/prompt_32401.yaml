  Based on Maya's pattern of predictions across the scenarios you've described, I can infer the underlying rule she's likely using and apply it to the new bird scenario. I'll break this down step by step, including my bet on her answer for the birds and a proposed test scenario to confirm her rule.

  ### Summary of Maya's Pattern and Inferred Rule
  Maya's predictions consistently hinge on one core principle: **cooperation evolves when there's a mechanism to limit exploitation by defectors (cheaters), allowing cooperators to benefit from their actions without being overrun by freeloaders.** When no such mechanism exists, defection wins. Here's how her previous calls fit this rule:

  - **Bacteria in a flask (freeloaders win):** No mechanism to limit exploitation. Interactions are one-shot, anonymous, and well-mixed, so defectors exploit cooperators with no consequences. Cooperation gets swamped.
  - **Vampire bats (sharing sticks around):** Mechanism = **direct reciprocity with memory.** Bats remember who helped them and return favors, creating a cost for defection. Repeated interactions with the same individuals allow cooperation to be enforced.
  - **Ground squirrels (alarm call evolves):** Mechanism = **kin selection.** Squirrels warn relatives (sisters/cousins), so the genetic benefits of helping kin outweigh the individual cost, even without tit-for-tat. This limits exploitation because defectors aren't aided, and helpers' genes spread through relatives.
  - **One-shot prisoner's dilemma in a city (everyone defects):** No mechanism. Anonymity, no future interactions, and no reputation mean defectors exploit cooperators with impunity. Cooperation can't establish.
  - **Multiple-round prisoner's dilemma with random partners and memory wipe (cooperation never starts):** No mechanism. Random reshuffling and memory loss prevent recognition or reciprocity, making each round effectively one-shot. Defection dominates.

  The unifying rule appears to be:  
  **"Cooperation evolves if cooperators can assort positively—meaning they interact primarily with other cooperators—either through kinship, reciprocal relationships, or a reliable tag/signal that enables discrimination. Without this, defectors win."**

  In essence, positive assortment (where cooperators are more likely to interact with/invest in fellow cooperators) reduces the payoff advantage for defectors and allows cooperative traits to spread. This rule encompasses:
  - **Reciprocity:** As in vampire bats, where memory enables repeated, mutually beneficial exchanges.
  - **Kin selection:** As in squirrels, where helping relatives propagates shared genes.
  - **Tag-based assortment:** Where a visible signal (like a color patch) allows cooperators to identify and preferentially interact with each other, minimizing interactions with defectors.

  When positive assortment is impossible (e.g., anonymous one-shots or memory-wiped interactions), defection prevails because cooperators are exploited without recourse.

  ### Prediction for the Bird Scenario
  In the bird case:
  - Blue-chested birds share food and mostly interact with other blues.
  - Red-chested birds never share and mostly interact with other reds.
  - Sharing happens exactly once between non-related blues, with no future meetings.
  - Chest color (and thus sharing behavior) is genetically tied, making the trait heritable.

  **Maya would likely say that the sharing type (blues) takes over.** Here's why:
  - **Positive assortment is present:** Blues assort with blues, and reds with reds, creating de facto "groups" where cooperators (blues) interact primarily with each other. When a blue shares with another blue, the benefit (e.g., food received) is directed to another cooperator, while the cost (e.g., energy or food given) is offset because blues are also likely to receive help in other interactions (due to the group's high cooperation rate). Since blues mostly avoid reds, defectors (reds) can't easily exploit blues—they're stuck in non-cooperative interactions with other reds, gaining no benefits from sharing.
  - **Genetic link enables evolutionary traction:** Because chest color and behavior are genetically correlated, the cooperative trait can spread. Blues have higher average fitness in their group (if the benefit of receiving food > cost of giving it), leading to more offspring. Reds, with no sharing, have lower fitness and decline over time.
  - **No reliance on kinship or reciprocity:** The scenario explicitly rules out relatedness and repeated interactions, but assortment via the color tag provides an alternative mechanism, aligning with Maya's acceptance of kin selection in squirrels and reciprocity in bats.

  **Bet:** I would bet heavily (e.g., 90% confidence) that Maya predicts the blues take over. Her pattern shows she recognizes assortment as a key enabler of cooperation, and this scenario fits perfectly—it's like a "green-beard effect" (where a trait signals cooperation and ensures preferential interaction). If she denied this, it would contradict her squirrel call (which used kinship for positive assortment) or her bat call (which used reciprocity for mutual benefit).

  ### Proposed Test Scenario to Settle the Rule
  To confirm if Maya's rule is truly about positive assortment (via any mechanism) or something narrower (like requiring direct reciprocity or kinship), run this scenario:

  **Scenario: "The Anonymous Donation Game"**  
  Imagine a large online community where players can donate virtual coins to strangers. Donating costs the giver 1 coin but gives the receiver 2 coins (a net gain for the group if cooperators dominate). Players are randomly paired each round for one interaction only—no memory, reputation, or future meetings. However, players have a visible, randomly assigned "badge" (e.g., a star or circle) that changes every round and has no meaning. Crucially, a new feature is added: players can choose to donate only to those with the same badge, but the badge is random and not tied to behavior or identity.

  - **Key elements:**
    - One-shot, anonymous interactions (no reciprocity possible).
    - No kinship or inherent relatedness.
    - A "tag" (badge) exists, but it's meaningless and random—it doesn't correlate with behavior and changes per round, so it can't enable true assortment.
    - Players can conditionally cooperate based on the tag (e.g., "I donate only if we have the same badge"), but since badges are random, this doesn't reliably group cooperators with cooperators.

  **Why this tests the rule?**
  - If Maya's rule requires **effective positive assortment** (where cooperators can reliably interact with each other), she'll say cooperation fails here. The random badge doesn't allow real assortment; cooperators might donate to same-badge players, but those players could be defectors half the time, leading to exploitation. Defectors could also use the badge rule to exploit (e.g., donate conditionally but rarely follow through). Without a stable signal or grouping, defection should dominate, similar to the memory-wiped prisoner's dilemma.
  - If she incorrectly thinks tags alone suffice (without reliability), she might say cooperation evolves—but this would contradict her earlier calls, as random tags don't prevent exploitation. Her pattern suggests she understands that assortment must be based on something correlated with behavior (like genetics in birds or kinship in squirrels).
  - A positive outcome for cooperation here would only happen if players could enforce assortment, but they can't—badges are random and transient.

  **Expected Maya call:** Cooperation fails. Defectors win because the badge system doesn't create real assortment; it's just noise. This would confirm that her rule requires a reliable mechanism for positive assortment (like a genetic tag, kinship, or memory-based reciprocity) to limit defector exploitation.

  This scenario isolates "assortment potential" and would help distinguish if her rule is specifically about assortment or if she has a broader/more nuanced view. Based on her history, she should reject cooperation in this test, solidifying the pattern. If you run this, her response should clarify whether her rule is consistent across all cases.
