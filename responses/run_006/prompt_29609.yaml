  Next, they want to know which desiderata are non-negotiable versus optional. Non-negotiables are likely the core functions any theory must fulfill, like distinguishing verbal from substantive disputes. Optional ones might tie into specific philosophical commitments, like Semantic Precision or Epistemic Access, which not all theories might emphasize.

  They also ask about potential tensions between desiderata. Here, I need to identify pairs that might conflict. For example, Semantic Precision vs. Epistemic Access—knowing exact meanings versus what disputants can access. Or Externalism vs. Speaker Access, where externalist semantics might clash with speakers' own understanding.

  The user wants to know which single requirement rules out familiar proposals. The Ambiguity Without Disagreement criterion seems crucial here. It challenges simple tests like meaning variance or disquotational tests by showing disputes can be substantive even when meanings align. For example, the "planet" case where both agree on facts but disagree on classification.

  I should also consider if the desiderata push towards deflationary or heavyweight metaontology. Ambiguity Without Disagreement and Externalism lean towards heavyweight, suggesting deeper facts beyond language. Whereas Semantic Precision might be more deflationary. This tension needs highlighting.

  The user's deeper needs might include understanding the foundational challenges in metaontology. They might be preparing to critique existing theories or develop their own. By identifying desiderata tensions, they can anticipate objections. They might also seek clarity on why some popular criteria fail, aiding their assessment of metaontological positions.

  I need to ensure each desideratum is clearly defined and motivated. Avoid jargon where possible. Use varied examples to cover different types of disputes. Highlight the practical implications of each requirement for evaluating theories. Emphasize the conflicts between desiderata as they reveal inherent challenges in the project itself. Finally, pinpoint which desideratum is most critical for ruling out existing proposals, as that's key to their analysis.
answer: |-
  Here are the core desiderata for a theory of verbal disputes, motivated by specific cases and considerations, along with an analysis of their status, potential tensions, and implications:

  ### Core Desiderata (Potentially Non-Negotiable)

  1.  **Discrimination:**
      *   **What it requires:** The theory must reliably distinguish *merely verbal* disputes from *substantive* disputes.
      *   **Motivation (Case):** Consider a dispute between A and B about whether a particular object (e.g., Mt. Everest) is a "mountain." A defines "mountain" as any landform rising >1000m above surroundings; B defines it as >2000m. If they agree on all physical facts about Everest's height and topography, their dispute is plausibly verbal. Contrast this with a dispute about whether a particular quantum event was truly random or determined by hidden variables – this seems substantive, hinging on features of reality, not word meaning.
      *   **Status:** **Non-negotiable.** This is the core function of the theory. Without this, the theory fails its primary purpose.

  2.  **Ambiguity Detection:**
      *   **What it requires:** The theory must identify cases where disputants use the same term with different meanings (ambiguity), and where *this ambiguity is driving the disagreement*.
      *   **Motivation (Case):** The classic "bank" example. A says "Let's meet at the bank," meaning financial institution. B objects, "No, the riverbank is nicer." Their disagreement collapses once they realize they mean different things by "bank." A metaphysical analogue might be disputants using "free will" to mean *libertarian free will* vs. *compatibilist free will* without realizing it.
      *   **Status:** **Non-negotiable (in some form).** Explaining how differing meanings cause apparent disagreement is fundamental to the concept of a verbal dispute. However, some theories might argue *how* this ambiguity manifests or is grounded (e.g., lexicon vs. conceptual role vs. semantic externalism).

  3.  **Resolution Condition:**
      *   **What it requires:** The theory should explain *how* a merely verbal dispute can be resolved (or dissolved) – typically by clarifying meanings or agreeing on terminology – and why this resolution doesn't require discovering new non-linguistic facts.
      *   **Motivation (Case):** The Mt. Everest "mountain" dispute. Resolution comes when A and B explicitly state their definitions and realize their disagreement was based on using different criteria encapsulated in the word "mountain." They don't need to go measure Everest again; they need linguistic/conceptual clarification.
      *   **Status:** **Non-negotiable.** The resolvability through semantic/conventional means is a hallmark of verbal disputes. If a dispute persists even after perfect semantic clarification and agreement on all non-linguistic facts, it's substantive.

  4.  **Substantive Disagreement Preservation:**
      *   **What it requires:** The theory must *not* misclassify substantive metaphysical disagreements as merely verbal.
      *   **Motivation (Case):** Consider a dispute between a Platonist and a Nominalist about the existence of numbers. The Platonist believes numbers are abstract, non-spatiotemporal, mind-independent entities. The Nominalist denies such entities exist. Classifying this as *merely* verbal (e.g., "They just mean different things by 'exist'") seems deeply unsatisfying and dismissive of a profound philosophical disagreement about the fundamental structure of reality. The theory must account for why this *feels* substantive.
      *   **Status:** **Non-negotiable.** A theory that over-classifies substantive disputes as verbal is as useless as one that fails to detect verbal disputes.

  ### Important, But Potentially Optional/Contested Desiderata

  5.  **Semantic Precision (The "What are Meanings?" Constraint):**
      *   **What it requires:** The theory must provide an account of *what meanings are* (e.g., Fregean senses, conceptual roles, referents, use-conditions) and how they differ, to ground the ambiguity detection.
      *   **Motivation (Case):** Is the disagreement over whether viruses are "alive" verbal? It hinges on the meaning of "life." But *what kind* of meaning matters? Is it the definition in a biology textbook (conventional linguistic meaning)? The underlying scientific concept (which evolves)? Or the real essence of life (a metaphysical question itself)? Different metaontological views (deflationary vs. heavyweight) will answer this differently.
      *   **Status:** **Contested/Optional in Detail.** *Some* account of meaning difference is needed (tied to Desideratum 2), but the *specific* theory of meaning (internalist, externalist, inferentialist, etc.) is a commitment that different metaontological frameworks will make differently. This is where deflationary vs. heavyweight leanings often show.

  6.  **Epistemic Access (The "Knowability" Constraint):**
      *   **What it requires:** The theory should explain how disputants (or theorists) can *know* or *reasonably determine* that a dispute is merely verbal. What evidence or procedure reveals the relevant semantic differences?
      *   **Motivation (Case):** In complex philosophical disputes (e.g., about persistence through time), how can we tell if the disagreement is about the meaning of "same object" or about how objects persist in time? The theory needs to offer a method (e.g., the "Can they agree on all the facts?" test, paraphrase tests, conceptual analysis) that is practically applicable, at least in principle.
      *   **Status:** **Highly Desirable, but Contested.** Most theories aim for this, but heavyweight realists might argue that *true* meanings (e.g., natural kind essences) might be unknown to speakers, making epistemic access difficult. Deflationists typically prioritize speaker-accessible meaning.

  7.  **Speaker Access / Charity:**
      *   **What it requires:** The theory should respect the disputants' own understanding of their terms and the nature of their disagreement, or provide a compelling reason why they might be mistaken. It shouldn't impose an external meaning radically at odds with their usage without justification.
      *   **Motivation (Case):** If two philosophers passionately argue about "free will," each carefully defining their position, it seems uncharitable and potentially incorrect for a metaontologist to declare, "You both *actually* mean the same thing by 'free will,' your dispute is verbal!" (This targets overly simplistic applications of some criteria). The theory must account for the phenomenology of disagreement.
      *   **Status:** **Contested.** Heavyweight externalists (e.g., scientific essentialists) might argue speakers can be deeply mistaken about the true meaning/reference of their terms (e.g., "water" pre-chemistry). Deflationists and internalists prioritize speaker intention and usage.

  8.  **Externalism Compatibility:**
      *   **What it requires:** The theory should be compatible with plausible semantic externalist theses (e.g., that the meaning/reference of natural kind terms like "water" or "tiger" depends partly on the external world and its causal history, not just internal states or definitions).
      *   **Motivation (Case):** Imagine a dispute pre-1750 about whether "water" on Twin Earth (which is XYZ) is really water. An internalist might think it's verbal (same descriptions apply). An externalist insists it's substantive – H2O *is* the meaning/reference, even if unknown, so XYZ isn't water. A good theory shouldn't *force* an internalist conclusion if externalism is true.
      *   **Status:** **Contested.** This depends heavily on the underlying commitments regarding meaning (Desideratum 5). Deflationists might downplay externalism; realists often embrace it.

  ### Internal Tensions (Joints Unsatisfiable?)

  *   **Semantic Precision (Externalism) vs. Speaker Access / Epistemic Access:** If meanings are external and potentially unknown to speakers (e.g., hidden natural essences), it becomes very hard for speakers (or even theorists) to *know* if their dispute is verbal (contradicting Desideratum 6) and the theory might attribute meanings wildly different from what speakers intend or grasp (contradicting Desideratum 7).
  *   **Substantive Disagreement Preservation (Heavyweight) vs. Ambiguity Detection (Deflationary):** The core tension. Heavyweight realists (insisting on Desideratum 4 for core metaphysics) might argue that apparent meaning differences in deep metaphysical disputes (e.g., "exists") actually track fundamental ontological differences in the world, making the ambiguity diagnosis incorrect. Deflationists argue the ambiguity diagnosis *is* correct for those disputes, satisfying Desideratum 4 only for empirical/scientific disagreements.

  ### The Single Requirement that Rules Out Familiar Proposals

  **Ambiguity Without Disagreement (A stronger form of Resolution Condition):**

  *   **What it requires:** A dispute is merely verbal only if the disputants, **despite using the key term ambiguously, actually agree on all the relevant non-linguistic facts *and* their disagreement vanishes once they adopt the same meaning/convention. Conversely, if they adopt the same meaning and *still* disagree (given agreed non-linguistic facts), the dispute is substantive.**
  *   **Motivation (Case):** Consider the "planet" dispute after Pluto's reclassification. Both parties agree on all astronomical facts about Pluto (size, orbit, etc.). They only disagree on whether to *call* it a planet. Once they agree on definition (e.g., IAU criteria), the disagreement dissolves. Contrast with the Platonist/Nominalist: if they could somehow agree on the meaning of "exists" (e.g., as quantifier commitment), the Platonist would still say numbers exist under that meaning, and the Nominalist would still deny it. Their disagreement persists *even under shared semantics*.
  *   **Why it Rules Out Familiar Proposals:**
      *   **Simple "They mean different things":** This is necessary but *not sufficient*. The Platonist and Nominalist *do* likely mean different things by "exists," but their dispute isn't *merely* verbal because adopting the same meaning (if possible) *doesn't* resolve the disagreement – it just reframes the substantive ontological commitment.
      *   **Disquotational Test ("A believes P, B believes not-P"):** This often just reports the disagreement without diagnosing its nature. It doesn't help distinguish cases where ~P follows from P under shared semantics (substantive) vs. cases where it only follows because of divergent meanings (verbal).
      *   **Hirsch's Quantifier Variance:** This claims that differing meanings of the quantifier ("exists") *are* sufficient to render ontological disputes verbal. The "Ambiguity Without Disagreement" desideratum directly challenges this by insisting that if disagreement persists *under a single, shared quantifier meaning*, the dispute is substantive. Hirsch claims variance makes adopting a single meaning impossible or irrelevant; this desideratum insists that *if* it could be adopted and disagreement persists, it's substantive. This pushes back against the core deflationary move.
      *   **"Agree on all non-linguistic facts" Test:** This is *part* of the resolution (Desideratum 3 & Ambiguity Without Disagreement), but crucially, the *persistence of disagreement under shared semantics* is the extra step that rules out substantive disputes disguised as verbal. Agreeing on facts is necessary but not sufficient; the dissolution under semantic agreement is key.

  ### Deflationary vs. Heavyweight Push

  *   **Toward Deflationism:** Desiderata like Semantic Precision (if interpreted as speaker-relative/conventional meaning), strong Epistemic Access, and Speaker Access naturally align with deflationary views that see metaphysics as grounded in language/conventions. The "Ambiguity Without Disagreement" test, strictly applied, *can* be used deflationarily to argue many disputes *are* verbal.
  *   **Toward Heavyweight Realism:** Desiderata like Substantive Disagreement Preservation (especially for core metaphysics), Externalism Compatibility, and crucially, the insistence that *persistent disagreement under shared semantics indicates substantivity* (the core of "Ambiguity Without Disagreement") push towards heavyweight realism. They suggest there are facts about what exists that are not settled by linguistic conventions alone.

  **Conclusion:** A viable theory of verbal disputes must non-negotiably **Discriminate** between verbal and substantive disputes by **Detecting** relevant **Ambiguity** and explaining **Resolution** through semantic means. Crucially, it must **Preserve** the intuition that some disagreements (like core ontology) are substantive. The major internal tension arises between **Preserving Substantive Disagreement** and explaining how **Ambiguity** works, especially concerning fundamental terms. The requirement that **Persistent Disagreement Under Shared Semantics Implies Substantivity** ("Ambiguity Without Disagreement") is the most powerful tool for critiquing deflationary proposals like quantifier variance, as it insists that verbal disputes dissolve under semantic agreement, while substantive ones do not. The desiderata collectively don't *force* one metaontology, but they highlight the battleground: the nature of meaning (especially for ontological terms) and whether agreement on meaning and non-linguistic facts *necessarily* resolves all disputes.
