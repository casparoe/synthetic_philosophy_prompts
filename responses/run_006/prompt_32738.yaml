prompt: |-
  I am a professor of philosophy, though my own work is in moral and political philosophy, and the question below falls outside my specialty. In my university's planning and risk committees I keep noticing a pair of related patterns for which I lack the exact vocabulary. A single figure — say, "80 percent confidence" — gets used for two very different things. In one case it rests on a long run of comparable cases with stable frequencies: many institutions like ours, many renewal cycles, a known failure rate. In another case it rests on a single analogy to a vaguely similar institution, or on the judgment of one expert who has never encountered anything quite like the proposal before us. The number is identical, but the second claim is somehow thinner than the first, and I want a precise way to say what that thinness consists in. Relatedly, I see the same committees convert radically different situations into a single "risk" framework: a well-understood decision with actuarial tables on one side, and a genuinely novel decision — a new financial instrument, an unprecedented public-health measure, a political rupture — on the other, with a probability attached to the latter as if it were the same kind of quantity as the former. My sense is that there is an older literature on probability that draws something like a distinction between measurable and unmeasurable uncertainty, and something like a distinction concerning the amount of evidence behind a probability, but I do not know the exact concepts, whether they have settled names, or how they are related.

  I am not satisfied with a bare label. I want to know what the phenomenon is, what it is not, and where its edges are: whether I have described one concept or two, how the nearest established concepts differ from what I have described and from each other, and which fits best. If nothing established fits, say so and propose a term with a definition and boundary cases. And throughout, please separate what is settled from what is genuinely contested among those who work on this, and do not present a contested view as the consensus.
reasoning: |-
  Okay, let me approach this systematically. The philosophy professor describes two distinct patterns in risk assessment that trouble them: the use of identical probability figures (like "80% confidence") in contexts with vastly different epistemic foundations, and the flattening of fundamentally different uncertainties into a single risk framework. 

  First, I need to identify the core distinctions they're sensing. The long-run frequency-based probabilities versus expert-judgment probabilities clearly map to the frequentist/subjective probability dichotomy. But their discomfort suggests something deeper - perhaps about the underlying ontology of uncertainty. The Knightian risk/uncertainty distinction comes to mind immediately, but I recall it's contentious in modern decision theory. 

  For the evidence differential, I consider concepts like robustness (from statistics) and evidential weight (from Keynes). The professor's "thinness" metaphor feels Keynesian - that probabilities can be comparable numerically yet differ in epistemic substance. The Ellsberg paradox might be relevant here as it demonstrates aversion to ambiguity.

  Regarding the conversion of novel scenarios into probabilistic frameworks, I need to address the limits of probability itself. The professor seems to question whether genuine novelty can be meaningfully quantified. This connects to debates about uncertainty in complex systems and the precautionary principle.

  I should clarify that while Knight's distinction is historically important, modern integrated approaches like Bayesianism attempt to bridge these gaps. The key is to present both the classical frameworks and contemporary critiques without overstating consensus. 

  For boundary cases: actuarial data represents measurable risk; true novelty (like first-contact scenarios) may resist probabilistic framing entirely. The middle ground - expert judgment on partially analogous cases - is where the tensions emerge most clearly.

  The professor wants precise conceptual mapping, so I'll define: aleatory vs epistemic uncertainty (settled terms), Knightian risk vs uncertainty (historically important but contested), and evidential weight (less common today). I'll emphasize that modern decision science often deliberately ignores these distinctions for modeling purposes, which may explain their committee's behavior.
answer: |-
  Your observations pinpoint fundamental distinctions in uncertainty assessment that have deep roots in probability theory and decision science. Below is a structured analysis of the concepts you describe, their established terminology, boundaries, and current scholarly consensus. I address both patterns as interconnected manifestations of **epistemic versus aleatory uncertainty** and the **evidential weight** of probabilities.

  ---

  ### **Core Distinctions**
  1. **Aleatory vs. Epistemic Uncertainty**  
     - **Aleatory (Objective/Stochastic) Uncertainty**:  
       Arises from inherent randomness in well-defined, repeatable processes (e.g., actuarial tables, coin flips).  
       *Your example*: "Long run of comparable cases with stable frequencies."  
       - *Properties*: Quantifiable via historical data, governed by stable statistical laws.  
       - *Boundary Case*: Rolling a fair die – probability is derivable from physical symmetry.  

     - **Epistemic (Subjective/Knightian) Uncertainty**:  
       Stems from incomplete knowledge, modeling limitations, or novelty (e.g., expert judgment on unprecedented events).  
       *Your example*: "Judgment of one expert facing a novel proposal."  
       - *Properties*: Context-dependent, not based on frequencies; reflects degrees of belief.  
       - *Boundary Case*: Predicting geopolitical outcomes of an unprecedented AI treaty – no relevant historical data exists.  

     **Consensus**: This dichotomy is widely accepted (ISO 31000, NASA risk standards). Critically, **identical probability values (e.g., 80%) carry different meanings** across these domains. An 80% aleatory probability implies observed regularity; an 80% epistemic probability is a belief constrained by ignorance.

  2. **Evidential Weight (Keynesian "Weight of Evidence")**  
     - **Concept**: Distinguishes probabilities based on the *robustness of evidence* supporting them.  
       *Your "thinness" observation*: An 80% confidence based on 10,000 trials vs. one expert's intuition.  
     - **Formalization**:  
       - High weight: Large, diverse, high-quality evidence (e.g., meta-analyses of renewal cycles).  
       - Low weight: Sparse, anecdotal, or non-comparable evidence (e.g., a single analogy).  
     - **Key Insight** (John Maynard Keynes, 1921): Two probabilities may be numerically identical (e.g., 80%) yet differ in their "weight" – the latter is more vulnerable to reversal by new information.  
     - **Boundary**: A probability with near-zero weight approaches *radical uncertainty* (no rational basis for quantification).  

     **Status**: "Weight of evidence" is recognized in evidence-based policy (e.g., Cochrane Collaboration) but less integrated into corporate risk frameworks. It is **not contested** as a phenomenon but debated in formal probabilistic representations.

  ---

  ### **The "Risk Framework" Flattening: Knightian Uncertainty**
  - **Frank Knight’s Distinction (1921)**:  
    - **Risk**: Measurable uncertainty, where probabilities are known (aleatory).  
    - **Uncertainty**: Immeasurable, where probabilities are unknown or undefined (epistemic extreme).  
  - **Your Committee’s Error**: Treating novel decisions (e.g., unprecedented financial instruments) as "risk" conflates Knightian uncertainty with quantifiable risk. Attaching a probability to the latter is an *epistemic probability* – a subjective belief, not an objective frequency.  
  - **Modern Critique**: Knight’s distinction is **contested**. Bayesian theorists (e.g., Savage, 1954) argue *all* uncertainty can be probabilized as subjective belief. Critics (e.g., Taleb, Ellsberg) maintain that true novelty defies meaningful quantification.  
    - **Settled View**: Knight’s "uncertainty" is now termed **ambiguity** or **deep uncertainty** in decision theory (e.g., IPCC reports). It applies when:  
      (a) Outcomes are unlistable, or  
      (b) Probabilities lack empirical or logical foundations.  

  ---

  ### **Conceptual Map of Your Observations**
  | **Your Observation**          | **Established Concept**       | **Consensus Status**       |  
  |-------------------------------|-------------------------------|----------------------------|  
  | "80% from stable frequencies" | Aleatory probability          | Settled                    |  
  | "80% from vague analogy"      | Low-weight epistemic probability | Accepted, less operationalized |  
  | Actuarial decisions           | Knightian "risk"              | Settled                    |  
  | Novel decisions               | Knightian "uncertainty"/Ambiguity | Contested (Bayesian vs. non-probabilist) |  

  ---

  ### **Why Existing Frameworks May Feel Unsatisfactory**
  - **Bayesian Dominance**: Modern risk frameworks often adopt a Bayesian stance, converting all uncertainty into subjective probabilities. This masks evidential weight differences.  
  - **Operational Blind Spots**: Committees use numerical probabilities for consistency, disregarding that "80% confidence" in a novel scenario may be **meaninglessly precise** (e.g., "spurious precision," as critiqued by Hynes & Vanmarcke, 1976).  
  - **Missing Concept**: **Epistemic Trespass** – Experts assigning probabilities far outside their domain of calibratable judgment (e.g., a demographer estimating AI takeover risks).  

  ---

  ### **Proposed Terminology for Your Phenomenon**
  If seeking precision beyond established terms:  
  - **Evidential Density**  
    *Definition*: The degree to which a probability assessment is constrained by empirical evidence or structural knowledge.  
    *Low-Density Boundary*: A probability derived from a single non-expert’s intuition about a black-swan event.  
    *High-Density Boundary*: Mortality estimates from vital statistics across 100+ years.  
  - **Why This Fits**: Directly addresses the "thinness" you observe and avoids the Bayesian/non-Bayesian debate.  

  ---

  ### **Key Takeaways for Committees**
  1. **Transparent Labeling**: Demand sources: "80% confidence (aleatory, 20 years’ data)" vs. "80% confidence (expert survey, n=5)".  
  2. **Reject False Equivalence**: Novel decisions require **scenario planning** or **robust decision-making** (Lempert et al., 2003), not probabilistic pretensions.  
  3. **Weight Assessment**: Ask: *"What would change this probability?"* Low-weight probabilities shift dramatically with minor evidence.  

  Your intuition aligns with foundational critiques in decision theory (Keynes, Knight, Ellsberg). The core issue is not merely statistical but **epistemological**: confusing degrees of belief with measurable chance. Committees obscure this via numerical rituals – a practice wryly termed "quantifauxcation" by critics.
