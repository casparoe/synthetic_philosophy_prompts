answer: |-
  Here is the numbered diagnosis:

  1.  The dispute is fundamentally about the definition and scope of rationality itself: one side equates rationality with maximizing expected utility for *any* consistent utility function, while the other side believes rationality imposes substantive constraints, like avoiding certain long-run ruin or maximizing growth, that effectively mandate logarithmic utility in repeated gambles.
  2.  The sides are addressing subtly different core questions: proponents focus on "Which strategy optimizes long-run wealth growth and survival probability?" (a property of the strategy/environment), while critics focus on "Which strategy maximizes expected utility given an agent's pre-existing preferences?" (a property of the agent's valuation).
  3.  The disagreement centers on the normative significance of asymptotic properties: Kelly advocates argue these long-run consequences (dominance, growth maximization, ruin avoidance) are rationally compelling *per se*, while critics argue these properties only matter instrumentally if the agent's utility function already values them (e.g., cares about log wealth).
  4.  Progress requires explicitly separating the descriptive claim ("Kelly optimizes long-run growth/avoids ruin") from the normative claim ("Rationality *requires* optimizing long-run growth/avoiding ruin"), and recognizing that accepting the latter requires a specific, contestable definition of rationality beyond mere preference consistency.
  5.  The impasse persists because the debate conflates a theorem about optimal capital growth (where Kelly is provably optimal) with a philosophical stance on rational choice (where utility maximization is the dominant paradigm), and neither side accepts the other's foundational premises about what constitutes a "rational requirement."
