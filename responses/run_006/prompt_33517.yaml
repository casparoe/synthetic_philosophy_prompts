answer: |-
  ## Opening Remarks: Things Decide  
  *(10 minutes, British English)*  

  Good morning. It’s a privilege to open this workshop, ‘Things Decide: Artifacts, Infrastructure, and Political Order’. Look around. Half of you design, build, and deploy systems that shape cities, algorithms, and daily life. The other half study how those systems govern, exclude, or transform human societies. You might feel you speak different languages. But today, we share one urgent question: **Do artifacts have politics?**  

  Last night, I debated this with a friend—a brilliant traffic-management designer. His view was steadfast: *“A traffic light is just solving a coordination problem. It doesn’t care whose car stops.”* When I countered with Robert Moses’ low overpasses on Long Island—deliberately designed to block buses and exclude marginalised communities—he shrugged. *“That’s not the bridge’s fault. It’s the people who built it.”*  

  Sound familiar? Engineers in this room might be nodding. A tool is neutral. Intentions, values, consequences—these belong to humans.  
  Scholars might bristle. *“Intent is irrelevant! Infrastructure encodes power by default!”*  

  Both views feel true. And both are incomplete.  

  ### Why ‘Just a Tool’ Falls Short  
  Yes, traffic lights solve coordination problems. But *whose coordination*? Consider Uber’s algorithm. It doesn’t “hate” public transport. Yet by funnelling riders into private cars, it eroded bus funding in cities like London. The tool isn’t evil—but its design logic reshapes urban space in ways that favour capital over community. It solves *a* problem while quietly creating others.  

  ### Why ‘Everything is Political’ Isn’t Enough  
  Scholars, you’re right: artifacts aren’t inert. But declaring “everything political” risks paralysis. If every brick is guilty, where do we intervene? When an algorithm misgenders non-binary users, is it “political” in the same way a border wall is? Blanket statements absolve us of precision—and responsibility.  

  ### The Third Way: Politics in the Grain  
  Artifacts *execute* politics through their material constraints. Not because they “care,” but because their design embeds assumptions about the world they’ll inhabit.  

  - **A biometric scanner** doesn’t “intend” to exclude elderly migrants with worn fingerprints. But if it’s designed for idealised hands, exclusion is the outcome.  
  - **A social housing policy** isn’t “racist” in code. But if its zoning algorithm prioritises “green space” without valuing community gardens in dense neighbourhoods, it displaces.  

  This isn’t about blaming engineers or mystifying theorists. It’s about recognising that **politics live in the friction between intention and outcome, design and context**.  

  ### Why This Room? Why Now?  
  Engineers—your work defines realities. When you design a facial recognition system, you’re not just optimising accuracy. You’re answering: *Whose faces count as “normal”?*  
  Theorists—your critiques matter. But without technical fluency, you risk reducing complex systems to slogans.  

  Our task this week? To move beyond “it’s just a tool” and “everything’s political” into the messy middle. To ask:  
  - How do we design accountability *into* infrastructure?  
  - When does scale turn a local fix into a global harm?  
  - Who inherits the unintended consequences?  

  That traffic light my friend designs? It doesn’t “care.” But it *does* decide who waits, who moves, and who’s visible. And in a world of smart cities and opaque algorithms, those decisions ripple through lives.  

  So let’s begin not with answers, but with shared curiosity. The bridge might not have intentions—but it absolutely has politics.  

  Summary:  
  Artifacts shape power not through intent, but through the worlds they assume, the behaviours they compel, and the futures they make possible—or impossible.  

  ---  

  **Key design choices for your audience**:  
  - **Opens with the traffic light debate** to validate engineers’ perspective while complicating it.  
  - **Uses "we"/"our" language** to unify the room ("Our task," "Why this room?").  
  - **Avoids academic jargon** (e.g., "material constraints" instead of "sociotechnical assemblages").  
  - **Concrete examples** (Uber, biometrics) show real-world stakes for both sides.  
  - **Directly addresses each group’s pain points**: Engineers’ frustration with vague blame; theorists’ need for precision.  
  - **Ends with actionable questions** to frame the workshop’s purpose.  
  - **British English**: "prioritises," "neighbourhoods," "artefacts" (though both spellings acceptable).  

  This structure makes the question visceral—not theoretical—and gives both sides ownership of the problem. Good luck!
