prompt: |-
  I'm trying to find a principle that captures my verdicts about when it's permissible to violate a constraint—like the prohibition on killing—in order to prevent more violations of that same constraint. This is the territory of the paradox of deontology, and I want to know what my own pattern of responses commits me to. Here are my cases:

  (1) Switch: A runaway trolley will kill five if I do nothing. I can flip a switch to divert it onto a side track with one person, who will die. Verdict: permissible.

  (2) Footbridge: Same, but I can stop the trolley only by pushing a large person off a bridge into its path. Verdict: impermissible.

  (3) Organ harvest: A surgeon can carve up one healthy patient to save five who need organ transplants. Verdict: impermissible.

  (4) Stopping a shooter: I see a gunman about to kill five people. I can shoot him dead to stop him. Verdict: permissible.

  (5) Stopping a shooter, two victims: Same, but the gunman is about to kill only two people. Verdict: permissible.

  (6) One-for-one switch: The trolley is heading toward one person. I can divert it to a different track where it will kill a different person. Verdict: impermissible — switching one victim for another seems wrong even though the numbers are the same.

  (7) The loop case: The trolley is heading toward five. The side track loops back toward the five, but there is one person on the loop. If I flip the switch, the trolley hits the one and the impact stops it before it reaches the five. If the one were not there, the trolley would loop back and kill the five anyway. Verdict: I lean impermissible, but I'm not confident. The one's body is used to stop the trolley, which feels like using him as a means.

  (8) Redirect onto the same victim: The trolley is heading toward one person. If I do nothing, it kills him and stops. But I can flip a switch that diverts the trolley onto a side track. On the side track, the trolley will hit and kill the same person (who happens to be crossing there), and the impact will stop the trolley before it reaches a crowd of five. So the one dies either way, but if I flip the switch, his death also saves five. Verdict: I cannot settle this. I'm not introducing a new victim, and the one was already going to die from this same trolley, but I am redirecting the threat onto him to use his death instrumentally.

  I can see rough patterns: using someone as a means (footbridge, organ harvest, probably the loop) is worse than redirecting an existing threat (switch). The numbers matter (one-for-one is impermissible, one-for-five permissible in the switch case). Preventing a wrongful killing by another agent (the shooter cases) seems to license killing even when the ratio is low. But I can't unify these into a single principle, and I worry that my verdicts on (4)/(5) and (2) are in tension: if I may kill the gunman to save two, why may I not push the fat man to save five? Is there a principle that captures most of these and, if so, which verdict does it force me to overturn? Please also apply your candidate principle to a case I haven't listed: an intelligence officer who authorizes a drone strike that will kill one civilian to prevent a terrorist from detonating a bomb that would kill twenty.

  \answer{State the principle you endorse as a short label, followed by a one-sentence formulation.}
reasoning: |-
  Okay, I need to help the user find a moral principle that explains their judgments across various trolley problem scenarios. Let me start by carefully reviewing their cases and verdicts to identify patterns.

  Looking at Switch (1) where diverting a trolley kills one to save five, they permit it. But in Footbridge (2), pushing someone to stop the trolley is forbidden. Organ harvest (3) is clearly impermissible for them. The shooter cases (4 and 5) are interesting - they allow killing a gunman to save five or even two lives. The one-for-one switch (6) feels wrong to them despite equal numbers. The loop case (7) leans toward impermissible because it uses the person as a means. Case (8) about redirecting onto the same victim puzzles them - same person dies but now their death saves others.

  Hmm... key themes emerging. They seem comfortable with threat-redirection but object to using people as means. The shooter exceptions suggest agent-responsibility matters - it's different when preventing wrongful harm by others. Numbers matter in some cases but not others (1-for-1 bad, shooter-for-2 okay). 

  Their tension between Footbridge and shooter cases is telling. Why push gunman but not fat man? Perhaps because the gunman is culpable while the fat man is innocent. This points toward a "Responsibility Principle" - we might distinguish between harming innocent bystanders versus stopping culpable aggressors. 

  For the drone strike case they mentioned: killing one civilian to prevent twenty deaths by a terrorist. Applying the Responsibility Principle here - the civilian is innocent, so it would likely be impermissible despite the numbers. The terrorist is responsible, but the victim isn't. This aligns with their Footbridge verdict where an innocent is used as means.

  Testing this principle against all cases:
  - Switch redirects threat (permissible)
  - Footbridge uses innocent (impermissible)
  - Organ harvest uses innocent (impermissible)
  - Shooters stop culpable agent (permissible)
  - 1-for-1 switch uses innocent as means? (impermissible - fits)
  - Loop case likely uses innocent (impermissible - fits their lean)
  - Redirect same victim: tricky, but since using the death instrumentally, probably impermissible by this principle

  The main tension was between Footbridge and shooter cases, and Responsibility Principle resolves it neatly by distinguishing innocent bystanders from culpable threats. For case (8), the principle would likely call it impermissible due to instrumental use, which might help them decide. 

  This seems to capture most verdicts except possibly the redirect-same-victim case where they're unsure - but the principle gives clear guidance there. I'll present this as the "Responsibility Principle" emphasizing non-instrumentalization of innocents versus prevention of culpable harm.
answer: |-
  Based on your verdicts, the principle that best captures your commitments while resolving the key tension (Footbridge vs. Shooter cases) and unifying your patterns is:

  **Responsibility Principle: It is permissible to cause harm to prevent a greater number of similar harms only if the harm is a side effect of redirecting an existing threat or is inflicted on an agent who is actively and culpably responsible for the greater harm.**

  ### One-Sentence Formulation:
  **Permissible constraint violation requires either (1) redirecting an existing threat causing harm as a side effect, or (2) targeting an agent culpably responsible for the greater harm, while prohibiting using an innocent person as a means.**

  ---

  ### How This Principle Explains Your Verdicts:
  1.  **Switch (Permissible):** Redirects an *existing threat* (trolley). The one's death is a foreseen side effect of diverting the trolley away from the five.
  2.  **Footbridge (Impermissible):** Actively *uses the fat man as a means* (pushing him creates a new threat/force). He is an innocent bystander, not responsible for the threat.
  3.  **Organ Harvest (Impermissible):** Actively *uses the healthy patient as a means* (carving them up). Innocent bystander.
  4.  **Stopping a Shooter [5 or 2] (Permissible):** Targets the *culpably responsible agent* (the gunman) who is actively causing the wrongful harm. His death stops the harm he is responsible for.
  5.  **One-for-One Switch (Impermissible):** Actively *uses one innocent person as a means* to save another. Redirecting the threat doesn't lessen harm; it just substitutes one victim for another.
  6.  **Loop Case (Impermissible):** The one person is actively *used as a means* (their body *stops* the trolley). Redirecting the threat isn't sufficient; their death is integral to stopping the trolley via impact.
  7.  **Redirect onto Same Victim (?):** *Likely Impermissible* by this principle. While the threat exists and the victim dies anyway, you are *using his death instrumentally* to stop the trolley before the five. His body becomes the means of stopping the threat, not just a side effect of its redirection.
  8.  **Drone Strike Case (Kill 1 civilian to stop terrorist killing 20):** **Impermissible** by this principle. The civilian is an *innocent bystander*, not responsible for the terrorist's actions. Targeting them uses them as a means to stop the culpable agent's harm, violating the constraint against using innocents.

  ---

  ### Resolves the Key Tension (Footbridge vs. Shooter)
  *   **Footbridge:** Pushing the fat man uses an *innocent bystander* as a means. Impermissible.
  *   **Shooter:** Killing the gunman targets the *culpably responsible agent*. Permissible, even for saving two, because he is the source of the wrongful harm.

  ### Potential Revision (If You Want to Save the Redirect-Same-Victim Case)
  If you ultimately decide **Redirect onto Same Victim (8)** *is* permissible, you could weaken the principle slightly: **"...prohibiting using an innocent person *who would not otherwise be harmed* as a means."** This would allow (8) since the victim dies anyway. However, this risks undermining verdicts against **Organ Harvest** (patient wasn't threatened) and **Loop** (the one *was* threatened by the diverted trolley). Your unease about "using his death instrumentally" in (8) suggests the stricter principle better fits your core intuitions.

  **Conclusion:** The Responsibility Principle best captures your core commitment against using innocents as mere means while allowing redirection of threats and defensive action against culpable aggressors. It validates your shooter verdicts without permitting Footbridge, and clearly forbids the drone strike on a civilian. It likely requires you to judge **Redirect onto Same Victim (8)** as impermissible due to instrumentalization.
