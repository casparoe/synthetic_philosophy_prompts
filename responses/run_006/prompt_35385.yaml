  ### Execution Notes:
  - **Timing Allocation**:  
    - Hook (5 min) → Definition (5 min) → Contrast (10 min) → Wasp (3 min) → Philosophy (7 min) → Understanding Check (10 min).  
  - **Why Password Example Over Wasp**:  
    Students instantly recognize getting "stuck in a loop" with tech. The visceral frustration mirrors the wasp's rigidity but avoids biological dismissal. Mention the wasp only to say: *"Dennett observed this in insects, but it’s scarier when we see it in ourselves."*  
  - **Active Learning**:  
    During the "Contrast Case," ask: *"What *specifically* could the password user try instead? Why didn’t they?"* to highlight flexibility vs. sphexishness.  
  - **When Students Bring Up Wasp**:  
    Acknowledge it, then pivot: *"Yes, the wasp is the namesake! But if a *human* in a similar situation keeps redoing a failed step without adjusting, that’s sphexishness too."*  

  This plan avoids "example overload" by making the password reset the workhorse analogy while scaffolding from intuition to philosophy.
