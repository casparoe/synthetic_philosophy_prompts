prompt: |-
  The many-worlds interpretation tells us that every quantum measurement outcome occurs in some branch, which makes the Born rule — the rule that assigns probabilities to measurement outcomes — look like a category mistake. If everything happens, what are probabilities probabilities of? Two prominent lines of response have emerged. The decision-theoretic program, associated with David Deutsch and David Wallace, attempts to derive the Born rule from rational-choice axioms, arguing that a rational agent who knows they will branch must act as if they assign credences equal to the squared amplitudes. The self-locating uncertainty approach, developed in different forms by Lev Vaidman and by Charles Sebens and Sean Carroll, instead treats branching as creating a situation of self-locating ignorance: before measurement you should be uncertain about which branch you will find yourself in, and the squared amplitude tells you how to distribute that uncertainty. I want to understand how these two strategies differ at the architectural level — not just their conclusions, but what each asks you to accept about the nature of probability, about what a rational agent in a branching universe should care about, and about what the Born rule is even a theory of. Where do they genuinely conflict on the physics or the epistemology, and where are they answering different questions that happen to share some vocabulary? Please separate what specialists in the foundations of quantum mechanics regard as settled from what remains actively disputed, and do not present a contested resolution as if it were the consensus. And open with your bottom-line assessment — are these two approaches best understood as competitors, as complementary, or as in some sense talking past each other? — before laying out the reasoning.
