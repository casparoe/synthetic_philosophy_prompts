              - If P < 0.1, output "Do Not Fund". Else, proceed.

          Step 3: Neglectedness
              - Estimate current annual spending (C) by all actors on this intervention.
              - Compute Expected Impact per Dollar (EIPD) = (Annual Benefit * P) / (C + Grant Size)
              - If EIPD < $0.50, output "Do Not Fund". Else, proceed.

          Step 4: Values Alignment
              - Are there any ethical concerns or values misalignment with the foundation? 
              - If Yes, output "Do Not Fund". Else, output "Fund".

     Then, for two reviewers:

          If both output "Fund" -> Fund.
          If both output "Do Not Fund" -> Do Not Fund.
          If one "Fund" and one "Do Not Fund":

              Let reviewer A be the one who says Fund, B the one who says Do Not Fund.

              Find the first step at which B stopped (i.e., the first step for which B's output was Do Not Fund).

              If B stopped at Step 1, 2, or 3:

                  The reviewers must discuss that step. If they can resolve and agree on a common outcome, then use that.

                  If not, then:

                      If the disagreement is due to a difference in values (e.g., how to value non-human animals in Step 1), then escalate to the board with the values question.

                      Else (empirical disagreement), then they may consult an external expert for 30 minutes (if feasible within the time and if the grant size justifies it) or else escalate to the board with the empirical disagreement.

              If B stopped at Step 4 (values alignment), then escalate to the board with the values question.

     We assume that Step 4 is the only step that is purely about values.

     This procedure is now applied to the two proposals.

     For the lead ammunition proposal, we expect most reviewers to Fund, but if one reviewer assigns a low tractability probability, then they might have an empirical disagreement that could lead to escalation.

     For the digital minds proposal, we expect a split at Step 1 (importance) and then an escalation for empirical disagreement.

     This meets the requirement that at least one proposal produces a resisted recommendation (the digital minds might be escalated even though some team members think it's important).

     We have taken definite positions. The thresholds are set as above, but the foundation might adjust them.
answer: |-
  ### Decision Procedure for Grantmaking Based on ITN Framework

  **Core Structure**: A 5-step sequential process with explicit stopping rules, requiring quantified inputs where possible. Each reviewer completes this independently. Disagreements between reviewers are resolved via a reconciliation step. Outputs: **Fund**, **Do Not Fund**, or **Escalate to board** (with specific values/empirical disagreement).

  **Key Features**:  
  - **Quantification Mandate**: Forces numerical estimates (even if uncertain) to expose assumptions.  
  - **Stopping Rules**: Hard thresholds at each step to prevent "intuition overrides."  
  - **Disagreement Protocol**: Values conflicts escalate; empirical disagreements trigger expert consultation or escalation.  
  - **Time Efficiency**: Designed for ≤60 minutes/reviewer.  

  ---

  ### Step-by-Step Decision Procedure  
  *(Each step must be answered; stopping rules bind)*  

  1. **Importance (Harm Scale)**  
     - **Question**: "If fully successful, what is the *expected annual harm reduction* (in DALY-equivalents or monetary value)? If non-human welfare, state conversion factor and justification. Provide a point estimate and 80% confidence interval."  
     - **Stopping Rule**: If the **lower bound** of the estimate is <1M DALYs/$100M annually → **Do Not Fund**. Else, proceed.  
     - *Why?* Sets a minimum bar. Forces explicit valuation of non-human welfare.  

  2. **Tractability (Success Probability)**  
     - **Question**: "What is the probability (%) this intervention achieves ≥20% of its intended impact? Base this on: (a) causal evidence for the intervention, (b) feasibility of execution, (c) historical analogs."  
     - **Stopping Rule**: If probability <20% → **Do Not Fund**. Else, proceed.  
     - *Why?* 20% threshold screens out highly speculative bets. Requires grounding in evidence.  

  3. **Neglectedness (Marginal Impact)**  
     - **Question**: "Estimate:  
       (a) Total annual spending ($) by all actors on this *exact* intervention/problem.  
       (b) What is the expected marginal impact per dollar of this grant? (Use: `Marginal Impact = (Importance × Tractability) / (Current Spending + $1M)`.)"  
     - **Stopping Rule**: If marginal impact < $0.50 per dollar spent → **Do Not Fund**. Else, proceed.  
     - *Why?* `Current Spending + $1M` accounts for diminishing returns. Directly calculates cost-effectiveness.  

  4. **Value Alignment**  
     - **Question**: "Does this intervention conflict with our foundation's core values? (Yes/No). If yes, specify the conflict and whether it is ethical or strategic."  
     - **Stopping Rule**: If **Yes** → **Do Not Fund**. Else, proceed to Step 5.  
     - *Why?* Separates values from empirical disputes.  

  5. **Uncertainty & Robustness**  
     - **Question**: "Is the combined uncertainty (from Steps 1–3) so high that the recommendation could flip with minor input changes? (Yes/No). If yes, does high upside justify the risk?"  
     - **Output**: If all prior steps passed → **Fund**, unless uncertainty is catastrophic (e.g., >90% CI spans negative impacts).  

  ---

  ### Reconciliation Protocol for Disagreements  
  - If both reviewers agree → finalize recommendation.  
  - If disagree:  
    1. **Identify step of first divergence**.  
    2. **Values conflict** (Step 1 conversion factor, Step 4, or non-human welfare in Step 3) → **Escalate to board**.  
    3. **Empirical conflict** (Steps 1–3 estimates) → **Consult external expert** (30 min/review). If unresolved → **Escalate to board**.  
    4. **Uncertainty conflict** (Step 5) → Lead reviewer decides.  

  ---

  ### Application to Proposals  
  **Proposal 1: Phase Out Lead Ammunition**  
  - **Step 1 (Importance)**:  
    - Harm: Lead poisoning in wildlife/humans.  
    - Estimate:  
      - *Human health*: 500 DALYs/year ($50M monetized; 80% CI: 200–1,000 DALYs).  
      - *Wildlife*: Convert 10M birds saved at $10/bird = $100M. **Total = $150M/year** → **Proceed** (lower bound >$100M).  
  - **Step 2 (Tractability)**:  
    - Policy bans have succeeded in 5 states. Probability = 40% (CI: 25–60%) → **Proceed** (>20%).  
  - **Step 3 (Neglectedness)**:  
    - Current spending = $8M/year (major NGOs active).  
    - Marginal impact = ($150M × 0.4) / ($8M + $1M) = $60M / $9M = **$6.66 per dollar** → **Proceed** (>$0.50).  
  - **Step 4 (Values)**: No conflict → **Proceed**.  
  - **Step 5 (Uncertainty)**: Moderate uncertainty, but upside clear → **Fund**.  
  - **Verdict**: **Fund**. *Team Resistance*: Low (fits intuitions).  

  **Proposal 2: Digital Mind Suffering Research**  
  - **Step 1 (Importance)**:  
    - Harm: Potential suffering in digital minds.  
    - Estimate:  
      - *Optimist*: 1B digital minds @ 1 DALY each = 1B DALYs ($100T; CI: 10M–100B DALYs).  
      - *Pessimist*: Probability of suffering near 0. Lower bound = 10 DALYs ($1,000).  
    - **Stopping Rule**: Pessimist → **Do Not Fund** (lower bound <$100M). Optimist → **Proceed**.  
  - **Reconciliation**:  
    - *Divergence at Step 1* due to empirical disagreement (probability/scale of digital suffering).  
    - **Expert Consultation**: Philosopher/AI ethicist consulted. No consensus on key inputs.  
    - **Escalate to board** with note: "Empirical disagreement on scale of digital mind suffering."  
  - **Verdict**: **Escalate to board**. *Team Resistance*: High (optimists resist dismissal; forces engagement with uncertainty).  

  ---

  ### Limitations of the Procedure  
  1. **Systematically Mishandles**:  
     - **Long-term/Existential Risks**: Step 1 penalizes low-probability, high-stakes bets (e.g., AI alignment) if reviewers underestimate tail risks.  
     - **Non-Quantifiable Goods**: Art, cultural preservation, or rights-based causes fail Step 1 if monetization feels arbitrary.  
     - **Tipping Points**: Step 3’s linear marginal impact model undervalues catalytic grants (e.g., launching a movement).  

  2. **Relocated Judgment Calls**:  
     - **Valuation Frameworks**: Step 1 forces explicit species/DALY conversions but doesn’t resolve how to set them.  
     - **Expert Selection**: Empirical disagreements rely on external experts, shifting bias to expert choice.  
     - **Uncertainty Threshold**: Step 5’s "flip risk" assessment remains subjective.  

  ### Why This Works  
  - **Constrains Intuitions**: By mandating numbers, it exposes "hand-wavy" reasoning (e.g., digital minds proposal dies unless advocates quantify stakes).  
  - **Values/Empirical Firewalls**: Prevents reviewers from hiding values disputes in empirical claims (e.g., lead ammunition wildlife valuation).  
  - **Efficiency**: Fits time constraints by using thresholds to screen out weak proposals early.  

  **Final Defense**: This procedure forces discipline without overengineering. It treats ITN as a dynamic scaffold—not a scoring rubric—by requiring explicit justifications at each step and escalating irreconcilable disagreements. Teams can't "nudge" numbers to match priors because stopping rules bind, and reconciliation protocols target the root of dissent.
