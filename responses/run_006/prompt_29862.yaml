     This might be too complex for a game.

  **Alternative Approach: Two Manuals for the Same Evidence**

  We design the language so that the evidence is consistent with two manuals without a critical test case that breaks one.

  For example, we can have a word that can be interpreted as either a noun or a verb. But that might be too vague.

  **A Better Alternative: The Number Game**

  Inspired by Quine's example of the native saying "gavagai" when a rabbit runs by, but also the possibility of "undetached rabbit part", we can design a game around numbers.

  But let me stick to the original plan and adjust.

  **Final Game Design:**

  We will avoid the detached ear during the evidence gathering. We let two groups of Linguists form two different hypotheses that are both consistent with all the evidence they have. Then, in the debrief, we explain that no further evidence could settle it because we can always adjust the manual.

  **Debrief (15 minutes):**

  1. Ask the students: 
     - What did you think "taga" meant? (Get both groups to state their hypotheses.)
     - Were both hypotheses consistent with the evidence? (Yes.)
     - What if I showed you a detached rabbit ear? (One group would have been confirmed, the other falsified. But note: we didn't show it. And Quine's point is that even if we had, we could adjust the manual to account for it by changing the interpretation of other words or adding auxiliary hypotheses.)

  2. Map to Quine:
     - In radical translation, the linguist tries to translate a native's language solely based on observable behavior (speech and physical circumstances).
     - The gavagai example: when a rabbit runs by, the native says "gavagai". The linguist might translate it as "rabbit", but it could also be "undetached rabbit part", "rabbit stage", or even "rabbithood". 
     - The point: the totality of the evidence (all possible behavioral evidence) cannot uniquely determine the meaning. There are always multiple translation manuals that fit all the evidence.
     - Why? Because the evidence is limited to behavior, and meaning is not fixed by behavior alone. There is an indeterminacy of translation.

  3. What the game couldn't capture:
     - In our game, we had a critical test (detached ear) that could falsify one manual. But in Quine's view, even that could be accommodated by adjusting other parts of the translation manual. For example, if the linguist is committed to "gavagai" meaning "rabbit", then when shown a detached rabbit part, they might say that the native has a different ontology (they don't see parts as objects) or that the native is making a mistake. Or they might adjust the translation of other words to account for it. Quine's point is that the manual as a whole is underdetermined by the evidence.

  **Predictable Problems and Solutions:**

  1. **Problem:** The Natives might break character and speak English.
     - **Solution:** Remind them they are only allowed to use Kiri. Have a penalty (like they can't participate for a round).

  2. **Problem:** The Linguists might get frustrated because the language is too minimal.
     - **Solution:** Keep the evidence gathering moving quickly. Have plenty of pictures. Encourage them to take notes.

  3. **Problem:** The two groups of Linguists might converge on the same hypothesis.
     - **Solution:** The hints should be strong enough. Also, the teacher can intervene during the hypothesis formation by asking leading questions to the groups to push them toward the two rival hypotheses.

  4. **Problem:** The critical test with the detached ear might be seen as decisive, which goes against the idea of underdetermination.
     - **Solution:** In the debrief, explain that even if one manual was falsified by the detached ear, in a more complex language we could have maintained it by adjusting other parts. We kept the language simple for time, but Quine's point is about the holistic nature of language.

  **What the Game Can't Reproduce:**
  - The game simplifies the indeterminacy by having only one ambiguous word and a very limited language. Quine's claim is about the entire language and the holistic nature of meaning. The game cannot fully capture how the adjustment of one part of the manual can ripple through to save a hypothesis. The teacher will have to explain that in the debrief.

  **Printable Materials:**
  1. **Native Rule Sheet:**
     - "taga": Say this word when you see a rabbit ear (attached or detached). Do not say it if you see a rabbit without any visible ear.
     - "maku": Say when you see a human face.
     - "nini": Say to mean "yes" (when you agree).
     - "koko": Say to mean "no" (when you disagree).

  2. **Pictures:**
     - 5 pictures of rabbits with ears visible.
     - 2 pictures of rabbits without visible ears (ears covered by something or missing).
     - 2 pictures of dogs.
     - 2 pictures of cats.
     - 2 pictures of cars.
     - 2 pictures of people (with faces visible).
     - 1 picture of a detached rabbit ear (for the critical test, if used).

  3. **Linguist Handout:**
     - For each group, a sheet to record hypotheses and notes.
     - Group A gets a hint at the top: "Hint: The natives often talk about whole objects. For example, they might have a word for a whole rabbit."
     - Group B gets: "Hint: The natives often talk about object parts. For example, they might have a word for rabbit ears."

  **Timeline Recap:**
  - 0-5 min: Setup and Native training.
  - 5-30 min: Evidence gathering (teacher shows pictures, Natives respond, Linguists take notes).
  - 30-40 min: Hypothesis formation in groups.
  - 40-55 min: Presentation of manuals and critical test (if used). Otherwise, just presentation and then debrief.
  - 55-70 min: Debrief and connection to Quine.
  - 70-80 min: Wrap up and assign reading.

  Note: The critical test might take time and cause confusion. It might be better to skip it and just focus on the underdetermination by the existing evidence. Then in the debrief, we raise the detached ear as a hypothetical.

  **Revised Critical Test Handling:**
  - After both groups present their manuals, the teacher says: "Now, imagine I show a picture of a detached rabbit ear. What would the Native say according to your manual?"
  - Group A: They would say the Native would not say "taga" because it's not a whole rabbit.
  - Group B: They would say the Native would say "taga".
  - Then the teacher says: "But we haven't seen that. And we never will in this game. So both manuals are still in the running. Even if we did see it, we could adjust our manual to account for it. But for now, both are equally good."

  This way we avoid the potential problem of one manual being falsified.

  This design should work within the time and give the students the experience of underdetermination.
answer: |-
  ### **In-Class Game: The Kiri Language Challenge**  
  **Goal:** Students experience the underdetermination of translation (two rival manuals fit all evidence, no further evidence can decide) without prior exposure to Quine's "indeterminacy" concept.  

  ---

  ### **Game Overview**  
  - **Premise:** Students encounter speakers of "Kiri," a minimalist artificial language. Linguists (students) must translate Kiri into English using observed behavior. They discover two equally valid translation manuals.  
  - **Indeterminacy Simulation:** The word "**taga**" is ambiguous—it could mean "rabbit" (whole object) or "rabbit ear" (part). All evidence supports both interpretations, and no test can resolve the ambiguity.  
  - **Time:** 80 minutes total (setup: 5 min, gameplay: 50 min, debrief: 25 min).  

  ---

  ### **Roles & Rules**  
  #### **Roles**  
  1. **Natives (10-12 students):**  
     - Speak only Kiri. Use gestures (pointing, nodding, shaking head) and Kiri words.  
     - **Secret Rules (printed on their guide):**  
       - "**taga**": Say when a **visible rabbit ear** is present (whole rabbit with ear *or* detached ear).  
       - "**maku**": Say when a **human face** is visible.  
       - "**nini**": Say for "yes" (affirmation).  
       - "**koko**": Say for "no" (negation).  
       - **Never** say "taga" for a rabbit without visible ears or non-ear objects.  

  2. **Linguists (2 groups of 2-3 students each):**  
     - Observe Natives and create a translation manual.  
     - **Group A Hint:** "Natives focus on **whole objects**. 'Taga' might label a complete animal."  
     - **Group B Hint:** "Natives focus on **object parts**. 'Taga' might label a specific body part."  
     - Can ask yes/no questions via pointing (e.g., point to rabbit and ask "taga?").  

  3. **Teacher (You):**  
     - Facilitate, show pictures, enforce silence during evidence gathering.  

  #### **Rules**  
  - **Natives must:**  
    - Follow their secret rules rigidly.  
    - Only use Kiri words/gestures—no English.  
    - Respond consistently to pictures/questions.  
  - **Linguists must:**  
    - Base translations **only** on observed behavior (no mind-reading!).  
    - Record hypotheses on their **Translation Manual Worksheet** (printable).  
  - **No talking between groups** during evidence gathering.  

  ---

  ### **Artificial Language: Kiri**  
  - **Vocabulary:**  
    - `taga`: Ambiguous (evidence supports "rabbit" or "rabbit ear").  
    - `maku`: Unambiguous ("human face").  
    - `nini`/`koko`: Unambiguous ("yes"/"no").  
  - **Grammar:**  
    - Single words + gestures (e.g., point to rabbit and say "taga").  
    - No sentences—prevents syntax from resolving ambiguity.  

  ---

  ### **Printable Materials**  
  1. **Native Guide (1 per Native):**  
     ```  
     SECRET RULES - DO NOT SHARE!  
     - Say "taga" ONLY if a rabbit ear is visible (e.g., whole rabbit with ear OR detached ear).  
     - Say "maku" ONLY if a human face is visible.  
     - Say "nini" for YES (if you agree).  
     - Say "koko" for NO (if you disagree).  
     - Use gestures: Point to objects, nod for "yes," shake head for "no."  
     ```  

  2. **Linguist Worksheet (1 per group):**  
     ```  
     HINT FOR YOUR GROUP: [Group A: "Natives focus on whole objects"] OR [Group B: "Natives focus on object parts"]  
     EVIDENCE:  
     - When we saw [description], Natives said ______.  
     HYPOTHESIS:  
     - "taga" means: _________  
     - "maku" means: _________  
     - "nini" means: _________  
     - "koko" means: _________  
     TEST PREDICTION:  
     - If we show a detached rabbit ear, the Native will say "taga": [ ] YES [ ] NO  
     ```  

  3. **Picture Cards (Print 1 set, show sequentially):**  
     - **Training Set (for Natives to practice, not shown to Linguists):**  
       - Rabbit with ears (x2), rabbit without ears (x1), human face (x1).  
     - **Evidence Set (shown to all during gameplay):**  
       - Rabbit with ears (x3), rabbit without ears (x1), human face (x2), dog (x1), tree (x1).  
     - **Test Set (for Linguist predictions, not shown early):**  
       - Detached rabbit ear (critical test), rabbit with ears (control).  

  ---

  ### **Timeline**  
  1. **Setup (5 min):**  
     - Split class: 10-12 Natives, 2 groups of 2-3 Linguists.  
     - **Natives:** Brief them separately. Hand out **Native Guides**. Practice with training pictures.  
     - **Linguists:** Give each group their **Worksheet** with hint. No contact with Natives yet.  

  2. **Evidence Gathering (25 min):**  
     - Show **Evidence Set** pictures one-by-one. For each:  
       - Natives react (e.g., say "taga" for rabbit-with-ears, say nothing for rabbit-without-ears).  
       - Linguists record responses on worksheets.  
     - **Include yes/no questions:**  
       - Point to rabbit-with-ears, ask "taga?" → Natives say "nini."  
       - Point to rabbit-without-ears, ask "taga?" → Natives say "koko."  
     - **Teacher:** Enforce silence—no discussion between groups.  

  3. **Hypothesis Formation (10 min):**  
     - Linguist groups create translation manuals.  
     - **Predict:** What will Natives say for detached rabbit ear? (Record on worksheet).  
     - Groups should arrive at rival manuals:  
       - Group A: "taga" = "rabbit" (whole object).  
       - Group B: "taga" = "rabbit ear" (part).  

  4. **Testing & Conflict (15 min):**  
     - Groups share manuals. Highlight the "taga" conflict.  
     - Show **Test Set**:  
       - Rabbit with ears (control) → Natives say "taga" (both groups correct).  
       - **Detached rabbit ear** → Natives say "taga."  
     - **Result:** Group B’s manual predicts this; Group A’s does not. But Group A can adjust (e.g., "Oh, ‘taga’ *actually* means rabbit ear!").  

  ---

  ### **Debrief (25 min)**  
  **Guided Discussion:**  
  1. **Experience Recap (5 min):**  
     - "What did you think 'taga' meant? Why?"  
     - "Was one manual 'more correct'? Could all evidence fit both?"  

  2. **Map to Quine (15 min):**  
     - **Indeterminacy Revealed:** "Today, you experienced **indeterminacy of translation**—Quine’s idea that all possible evidence can support multiple translation manuals. No experiment can prove which is 'right.'"  
     - **Connect to Gavagai:**  
       - In Quine, "gavagai" could mean "rabbit," "undetached rabbit part," or "rabbit stage."  
       - Like "taga," the meaning isn’t fixed by behavior—even with pointing, gestures, or questions.  
     - **Key Philosophical Point:**  
       - Translation is underdetermined by evidence. Manuals are holistic (meanings depend on the whole system).  
       - **Analogy:** Both manuals work until new evidence (detached ear) forces a choice. But even then, we could reinterpret other words to preserve Manual A (e.g., "Natives see ears as whole objects!").  

  3. **Limitations & Quine’s Full Claim (5 min):**  
     - **What the Game Couldn’t Capture:**  
       - Quine’s indeterminacy is **holistic**—adjusting one part of the manual (e.g., redefining "ear" or "whole") can save a translation. Our game simplified this due to time/language constraints.  
       - In real radical translation, **no evidence** can ever decide—even the detached ear can be explained away by Manual A (e.g., "Natives call detached ears 'rabbits'!").  
     - **What You’ll Need to Add:**  
       - Emphasize Quine’s **confirmation holism** (meaning depends on the entire web of beliefs).  
       - Explain that indeterminacy applies to **all terms** (not just "gavagai"), and it challenges the idea of "fixed meaning."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem: Natives slip into English.**  
     - **Fix:** Give Natives a "Kiri-only!" reminder card. If they cheat, gently restart the scene.  

  2. **Problem: Linguists ignore evidence and force one answer.**  
     - **Fix:** Circulate during hypothesis formation. Ask: "Could the *opposite* also fit? What if...?"  

  3. **Problem: Detached ear test feels decisive against Manual A.**  
     - **Fix:** In debrief, stress: Manual A could survive by reinterpreting other terms (e.g., "Maybe 'taga' means 'rabbit' but Natives think ears *are* rabbits!"). This mirrors Quine—manual adjustments preserve indeterminacy.  

  4. **Problem: Unambiguous words (maku/nini) dominate discussion.**  
     - **Fix:** Redirect: "Focus on 'taga'—why did both interpretations work *until* the detached ear?"  

  5. **Problem: Groups converge on one manual.**  
     - **Fix:** Amplify hints. Ask Group A: "What if Natives care about parts?" and Group B: "What if they name whole things?"  

  ---

  ### **Why This Works**  
  - **Pre-Reading Impact:** Students feel the frustration of underdetermination firsthand. When they read Quine, "gavagai" will resonate.  
  - **No Lecture Needed:** The game creates the "aha!" moment. Debrief ties it to philosophy.  
  - **Honest Limitation:** The game can’t fully replicate Quine’s **holism** (where *any* manual can be preserved by adjusting *other* terms). You’ll clarify this in debrief.  

  **Materials Ready?** Print Native Guides, Linguist Worksheets, and Picture Cards. Run it—and watch them debate "taga" like junior Quines! 🐰🔍
