  We are designing an in-class game to simulate the indeterminacy of translation without using the term until the debrief. The goal is for students to experience that two different translation manuals can account for all the evidence and that no further evidence can decide between them.

  **Game Concept: The Gavagai-inspired Game**

  **Setting:** The class is divided into two groups: the "Linguists" (about 4-5 students) and the "Natives" (the rest of the class, about 11-12). The Natives speak a very simple artificial language. The Linguists' job is to figure out the meaning of the words by observing the Natives' behavior and asking questions.

  **The Artificial Language:**
  - The language is called "Kiri" (or any other name). It has a very limited vocabulary and structure. The key is that the language is about pointing at objects in the environment and uttering words. However, the language has a feature that allows for two different interpretations of the same word, similar to Quine's gavagai.

  **Key Elements of the Language:**
  - The Natives can only refer to objects that are present in the room (or that can be pointed to in pictures) and to a few actions (like pointing, nodding, shaking head).
  - The language has no words for abstract concepts, only for concrete objects and simple actions.

  **The Indeterminacy Setup:**
  We will design the language so that one key word (like "gavagai") can be interpreted in two ways:
  1. As referring to a whole object (e.g., "rabbit")
  2. As referring to a part of the object or a stage of the object (e.g., "undetached rabbit part", "rabbit stage", or "rabbithood")

  But we must make it simple. Let's choose a concrete example:

  - The word "taga" will be used by the Natives to refer to a rabbit (or a picture of a rabbit). However, the Natives are trained to use "taga" in two different ways (without knowing which one the Linguists will pick). Actually, we want two rival translation manuals to be possible. So we design the language so that the evidence can be interpreted in two ways.

  **How to achieve two manuals:**
  We'll have two possible interpretations for "taga":
  1. Manual A: "taga" means "rabbit"
  2. Manual B: "taga" means "rabbit ear"

  But note: we must design the evidence so that both are compatible.

  **Rules for the Natives:**
  - The Natives are given a set of rules for when to say "taga". They are told that they are to use "taga" only when they see a rabbit that has at least one ear visible. (So if a rabbit is hidden such that the ear isn't visible, they don't say "taga".) This way, the word "taga" is always accompanied by the presence of a rabbit ear. Therefore, the Linguists might interpret it as "rabbit" or as "rabbit ear".

  **But wait:** How do we make sure that both interpretations are possible? We must design the scenarios so that the two interpretations are underdetermined by the evidence.

  **Example scenarios:**
  1. The teacher shows a picture of a rabbit (with ears). Native says "taga".
  2. The teacher shows a picture of a rabbit without an ear (e.g., a rabbit with an ear missing, but still a rabbit). Native does not say "taga".
  3. The teacher shows a picture of just a rabbit ear (detached). Native says "taga" (because the rule is: when a rabbit ear is visible, say "taga"). But note: if the native says "taga" for a detached ear, then the Linguist might think "taga" means "rabbit ear". But if the Linguist hasn't seen a detached ear, they might think it means "rabbit".

  However, we can control the evidence the Linguists get. We will make sure that the Linguists never see a detached rabbit ear. So the evidence only includes whole rabbits (with ears) and rabbits without ears (which are not called "taga"). 

  But then the evidence is:
  - When a rabbit with ears is present: "taga"
  - When a rabbit without ears is present: no "taga"

  So the Linguist might form two hypotheses:
  - Hypothesis A: "taga" means "rabbit with ears".
  - Hypothesis B: "taga" means "rabbit ear" (because when the ear is absent, they don't say it).

  But note: if the Linguist sees a detached ear, then Hypothesis A would predict no "taga" (because there's no rabbit) and Hypothesis B would predict "taga". But we don't show a detached ear. So both hypotheses are consistent with the evidence.

  We can also add other words to make it more complex and to show that the whole manual must be consistent.

  **Expanding the Language:**
  We can add a few more words to make the point about the whole manual. For example:
  - "maku" for pointing to a person (but again, we design it to be ambiguous: does it mean "person" or "hand"?)
  - "nini" for an action (like nodding, meaning "yes")

  But we must keep it very simple. Let's stick to one ambiguous word and a few unambiguous ones to provide context.

  **Materials:**
  - Printable pictures:
     - Rabbit with ears (multiple pictures, different angles, colors, etc.)
     - Rabbit without ears (e.g., a rabbit with ears covered or missing)
     - Note: We will avoid showing detached ears until the end, if at all.
     - Also, pictures of other objects: a dog, a cat, a car, a tree, etc. (so that "taga" is not said for these, unless we have a rabbit ear in the picture? but we don't put rabbit ears in other pictures)

  **Rules for the Natives:**
  1. The Natives are given a secret manual that tells them when to say each word. They must follow it strictly.
  2. The secret manual for the word "taga": 
     - Say "taga" only if there is a visible rabbit ear in the picture (or object). This includes:
          - A whole rabbit with at least one ear visible.
          - A detached rabbit ear (but we won't show this to the Linguists during the evidence gathering).
     - Do not say "taga" if there is no visible rabbit ear (even if there is a rabbit without ears).

  3. Other words:
     - "maku": say when there is a visible human face (so again, ambiguous: face or person? but we'll avoid detached faces, of course).
     - "nini": say when the native wants to affirm (like nodding). This is used in response to questions.
     - "koko": say when the native wants to negate (shaking head).

  4. The Natives can also point and use gestures.

  **The Game Timeline (80 minutes):**

  1. **Setup (5 minutes):** 
     - Divide the class: about 4-5 Linguists, the rest are Natives.
     - Take the Natives to a separate area (or give them a handout with the rules) and explain their language. The Linguists are not present during this explanation.
     - Give the Natives a sheet with the rules and a few example pictures to practice.

  2. **Rule for Natives:** They must only speak in Kiri. They can use gestures (pointing, nodding, shaking head) and the words: "taga", "maku", "nini", "koko". They cannot use any English except to ask for clarification about the rules (to the teacher).

  3. **Evidence Gathering (30 minutes):**
     - The Linguists return. The teacher shows pictures to the Natives one by one. The Linguists observe the Natives' reactions and take notes.
     - The teacher shows:
          - 5 pictures of rabbits with ears (each time, the Natives say "taga" and might point).
          - 2 pictures of rabbits without visible ears (Natives say nothing for "taga", but they might say other words if appropriate? but we haven't defined other words for rabbits. So they remain silent for "taga" in these cases).
          - Pictures of other objects: a dog (Natives do not say "taga"), a car (no "taga"), etc.
          - Also, pictures of people: for each, the Natives say "maku".
          - The teacher can also ask yes/no questions by pointing and using gestures. The Natives can respond with "nini" (yes) or "koko" (no). For example, the teacher points to a rabbit and asks (with a questioning look) "taga?" and the Native says "nini" if it has an ear, or "koko" if it doesn't.

  4. **Hypothesis Formation (10 minutes):**
     - The Linguists are given time to discuss and write down a translation manual for the words they heard. They should write what they think each word means.

  5. **Testing the Hypotheses (15 minutes):**
     - Now the teacher shows new pictures that the Linguists haven't seen, but still within the constraints (no detached parts). The Linguists are to predict what the Natives will say. The teacher shows:
          - A rabbit with ears (they should say "taga")
          - A rabbit without ears (they should not say "taga")
          - A person (they say "maku")
          - A dog (no word, or maybe they haven't learned a word for dog)
     - The Linguists should be able to predict correctly.

     - Then, the teacher presents a critical test case: a detached rabbit ear (which hasn't been shown before). The Linguists are asked to predict: will the Native say "taga"?
          - If the Linguists have hypothesis A ("rabbit with ears"), they might predict no (because it's not a whole rabbit).
          - If they have hypothesis B ("rabbit ear"), they might predict yes.

     - The Native, following the rules, says "taga" for the detached ear.

     - Now the Linguists see that their hypothesis A fails and hypothesis B is confirmed? But wait, we want to show that both manuals can be adjusted to account for this.

     - Actually, we want both manuals to be able to account for all evidence. So we must design the language so that the manual as a whole can be adjusted.

     - How? We might have to introduce the idea of a manual that includes not just the word "taga" but also how other words interact. But we have kept it simple.

     - Alternatively, we can have two groups of Linguists, each given a different initial hint that leads them to one of the two manuals. Then both groups can account for the evidence by adjusting other parts.

     - Revised plan: Have two groups of Linguists. Each group is given a different set of initial clues (without knowing the other group's clues). For example:

          Group A gets a hint: "The word 'taga' seems to be used for whole animals sometimes."
          Group B gets a hint: "The word 'taga' seems to be used when a particular body part is present."

     - Then, during the evidence gathering, both groups collect the same evidence. They form two different hypotheses.

     - Then, when the detached ear is shown, Group A might be surprised because they didn't expect "taga" for a detached ear. Group B is not surprised.

     - But then Group A can adjust: they can say that "taga" actually means "rabbit ear", but then they have to reinterpret previous events. However, they can do that: they can say that in the previous events, they thought it meant rabbit, but now they see it means rabbit ear.

     - The point is: the evidence up to the detached ear was consistent with both, and even after, both manuals can be made consistent by adjusting. For Group A, they change their manual to Manual B. But we want to show that both are possible and that there is no fact of the matter. So we need two manuals that are both consistent with all evidence, including the detached ear.

     - How? We design the language so that the detached ear is not shown until the very end, and then we reveal that the Native says "taga". Then we show that both manuals can explain it:

          Manual A (after adjustment): "taga" means rabbit ear (so they change their mind).
          Manual B: they already had it meaning rabbit ear.

     - But then Manual A has been abandoned. We want two rival manuals that are both consistent with all evidence. So we must design the evidence so that even after the detached ear, both are still possible? That's not the case if Manual A originally said "rabbit" and then they see the detached ear, they must change.

     - Alternatively, we can avoid the detached ear completely and just have the two manuals both consistent with the evidence they have. Then we tell them that if they were to see a detached ear, one manual would predict one thing and the other another. But since they haven't seen it, both are still in play.

     - And then we say that even if they were to see the detached ear, they could adjust the rest of the manual. For example, they might reinterpret the pointing gestures or the other words to account for the new evidence. But that might be too complex.

  **Revised Game without the Critical Test Case:**

  We avoid the detached ear during the game. We let the two groups of Linguists form two different hypotheses (using the hints) that are both consistent with the evidence. Then, in the debrief, we explain that if we were to show a detached ear, each manual would make a different prediction, but the manual could be adjusted to fit even that. However, that adjustment would be a change in the manual.

  Alternatively, we can design the language so that the word "taga" is always used in the presence of a rabbit ear and never otherwise, and we never show a detached ear. Then the two hypotheses are:
     A: "taga" means rabbit (with the unstated condition that rabbits must have ears, which is normally true in their experience).
     B: "taga" means rabbit ear.

  Both are consistent. And there is no way to decide because the Natives never show a detached ear.

  **Game Timeline Revised:**

  1. **Setup (5 min):** Divide the class into two groups of Linguists (Group A and Group B, each with 2-3 students) and the rest are Natives. Take the Natives aside and train them. Then give the two groups of Linguists different hints.

     Hint for Group A: "We have reason to believe that the Natives are talking about whole objects. For example, they might have a word for a whole rabbit."
     Hint for Group B: "We have reason to believe that the Natives are talking about object parts. For example, they might have a word for rabbit ears."

  2. **Evidence Gathering (25 min):** The teacher presents pictures to the Natives. The same set for both groups. The set includes:
     - Rabbits with ears (say, 5 different ones) -> Natives say "taga"
     - Rabbits without ears (say, 2) -> Natives say nothing for "taga" (but they might say other words for other things in the picture? but we avoid that by having only the rabbit in the picture)
     - Other animals (without rabbit ears) -> no "taga"
     - People -> "maku"
     - The teacher can also do some pointing and ask: point to a rabbit and ask "taga?" and the Native says "nini" for rabbits with ears, "koko" for without.

     Both groups take notes.

  3. **Hypothesis Formation (10 min):** Each group of Linguists meets and writes down their translation manual. They should write:
     - "taga" means [their hypothesis]
     - "maku" means [person or face? they might have the same ambiguity for maku]
     - "nini" and "koko" are yes and no.

  4. **Presentation and Conflict (15 min):** 
     - Each group presents their manual. They will likely have:
          Group A: "taga" means rabbit (or rabbit with ears)
          Group B: "taga" means rabbit ear
     - The teacher then asks: "How would your manual handle a detached rabbit ear?" 
          Group A: probably would say the Native wouldn't say "taga" because it's not a whole rabbit.
          Group B: would say the Native would say "taga".
     - Then the teacher shows a picture of a detached rabbit ear. The Native says "taga".
     - Group A is surprised. They must adjust. They can change their manual to say "taga" now means rabbit ear. But note: they had a whole system that worked for rabbits. Now they have to change.

