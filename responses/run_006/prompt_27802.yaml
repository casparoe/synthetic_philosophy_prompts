  Then (2) defines epistemically transformative experiences (ETEs) as those you can't know what it's like before having them. That's straight from Paul. (3) connects not knowing what it's like to not knowing its value. The user wants to keep (3) because rejecting it might undermine Paul's point about major life choices like having a child. 

