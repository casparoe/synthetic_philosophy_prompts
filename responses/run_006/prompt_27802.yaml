  I recall Paul distinguishes between trivial and profound ETEs. Maybe step (5) is the issue because it lumps all unfamiliar experiences together. But Paul does say even mundane first experiences qualify. So that might not work. 

  Another angle: Paul allows for "proxy experiences" for minor ETEs. You can imagine tasting a mango based on similar fruits. But for having a child, there's no real proxy. So perhaps rejecting (1) is better. Rational choice can involve estimated value, not certain knowledge. That keeps (3) intact while allowing rationality in uncertainty. 

