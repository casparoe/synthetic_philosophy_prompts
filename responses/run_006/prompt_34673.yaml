  Okay, the user is grappling with the Frege-Geach problem in their metaethics seminar and found a textbook passage that seems overly dismissive of expressivism. They're aware that prominent philosophers like Blackburn and Gibbard have developed responses, but they're unsure where the textbook might be misrepresenting the issue. 

  First, I need to acknowledge their sharp observation - that "too tidy" feeling about the textbook passage is spot-on. The user clearly did their background reading and noticed the disconnect between the textbook's definitive tone and the actual state of play in contemporary metaethics. That's impressive for a seminar student.

  Breaking this down: The textbook makes four core claims that need auditing. Let me mentally flag where each claim stands:

  1. The "decisive objection" framing is historically accurate but currently misleading. It's true that Frege-Geach was considered devastating in the 1960s, but framing it as still "decisive" today ignores 50 years of expressivist development. The user's intuition about Blackburn and Gibbard's work is correct here - this is precisely what they addressed.

  2. The "only tells us about asserted contexts" part is fair. This really is the core challenge any expressivist must solve. Where the textbook oversimplifies is implying expressivists have no answers, when actually they've proposed sophisticated semantic frameworks like Blackburn's projectivism or Gibbard's norm-expressivism.

  3. The compositionality charge is tricky. The textbook correctly states that compositionality is necessary, but wrongly suggests expressivists reject this. Modern expressivists actually embrace compositionality - they just argue it can be achieved through non-representational means. The user should know this is where the deepest philosophical work happens.

  4. The "collapse" conclusion is where the textbook really overreaches. It commits the fallacy of presenting a solved problem as unsolvable. The user seems to suspect this, given their mention of contemporary metaethics not viewing it as a refutation.

  What the user might not fully grasp yet is how expressivists reconceptualize "meaning" itself. The textbook assumes a truth-conditional semantics framework, while expressivists propose alternative semantic foundations. That's the real bone of contention - not whether compositionality matters (it does), but what kinds of semantic values can satisfy it.

  I should emphasize that the textbook isn't factually wrong so much as anachronistic. Its description would have been cutting-edge in 1970, but fails to engage with developments after Blackburn's "Spreading the Word" (1984) or Gibbard's "Wise Choices, Apt Feelings" (1990). The user's seminar might benefit from discussing why some textbooks present dated perspectives.

  Also noting the user's meta-question about argument structure: whether the "collapse" conclusion relies on questionable premises. This shows they're thinking like a philosopher - not just seeking information, but analyzing argumentative validity. I'll explicitly map how the shaky premises (claims 1, 3 and 4) undermine the conclusion.
answer: |-
  You're absolutely right to question that textbook passage—while it captures the *core* of the Frege-Geach problem accurately, it presents a historically outdated and overly simplistic verdict on expressivism. Let's break it down point-by-point for accuracy, using your requested framework:

  ### (a) Fair Statements of the Challenge (Expressivists Would Accept)
  1.  **The Core Problem of Embedded Contexts:** The passage correctly identifies the heart of the Frege-Geach problem: expressivism must explain what moral terms *mean* when they appear in contexts like conditionals, negations, questions, or beliefs (e.g., "If lying is wrong..."), where the speaker is *not* expressing the attitude typically expressed by the atomic sentence ("Lying is wrong").
  2.  **The Challenge of Compositionality:** Expressivists accept that any adequate semantic theory must be compositional. They need to explain how the meaning of complex sentences (like the conditional) is built from the meanings of their parts (like "lying is wrong").
  3.  **The Challenge for Logic/Validity:** Expressivists acknowledge they must explain how moral arguments can be logically valid. Validity seems to depend on the *propositional content* of the premises and conclusion remaining stable across asserted and unasserted contexts. If "lying is wrong" *only* means the expression of disapproval when asserted, how can it function as a stable premise in an embedded context? The passage accurately states this requirement ("validity requires that terms keep the same meaning...").

  ### (b) Subtle Mischaracterizations or Conflations (Expressivists Would Push Back)
  1.  **"Expressivism simply collapses":** This is the most significant overstatement. The passage presents the problem as a *refutation* ("decisive," "collapses"). Contemporary expressivists like Blackburn, Gibbard, Schroeder, Dreier, and others *explicitly developed sophisticated semantic frameworks precisely to solve this problem.* They don't think it's a refutation; they see it as the *central technical challenge* their theory must meet. The textbook ignores decades of work responding to Frege-Geach.
  2.  **"Expressivism offers no account...":** This is factually incorrect. The passage claims expressivism *only* tells us about asserted contexts and *offers no account* for embedded contexts. This might have been true of early, crude emotivism (Ayer, Stevenson), but modern expressivism (starting seriously with Blackburn in the 1970s/80s) is defined by its attempts to *provide precisely this account*. Blackburn's projectivism/quasi-realism and Gibbard's norm-expressivism are complex semantic theories designed to handle embedding and compositionality.
  3.  **Conflation of "Meaning" with "Speech Act":** The passage subtly assumes that the *only* thing expressivism can assign to "lying is wrong" is a *speech act* (expressing disapproval) performed when asserted. Modern expressivists distinguish between:
      *   **The mental state expressed** (e.g., disapproval of lying - the *psychological* aspect).
      *   **The semantic content or semantic role** (what the sentence *contributes* to complex constructions - the *linguistic/logical* aspect).
      Their core project is to develop a theory of semantic content/role for moral sentences *in terms of* the mental states they express, *which also* allows for compositionality and logic. They argue that the semantic value of "lying is wrong" *in any context* is tied to the type of attitude it conventionally expresses, but this value can be combined logically just like truth-conditions can. The textbook passage doesn't acknowledge this crucial distinction and project.
  4.  **Implied Necessity of Truth-Conditions:** The argument implicitly assumes that only a *truth-conditional* semantics can be compositional and underwrite logic. Expressivists vehemently deny this. They argue that one can define compositional semantic rules (mapping sentences to mental states or states of planning, or functions on mental states) and validity *without* assigning truth-conditions as the fundamental semantic values. Gibbard, for example, develops a sophisticated logic based on "plan-laden" contents. The textbook simply asserts the necessity of truth-conditional semantics without argument against the expressivist alternatives.
  5.  **"Cannot explain how moral arguments can be logically valid":** This is stated as a conclusion, not a challenge. While it's a challenge expressivists must meet, they claim their semantic frameworks *do* explain validity. For instance, Blackburn analyzes validity in terms of the inconsistency of attitudes: an argument is valid if accepting the premises but rejecting the conclusion involves a kind of practical inconsistency in the attitudes expressed. Gibbard analyzes it in terms of hyperplan consistency. Whether these accounts are *successful* is hotly debated, but it's inaccurate to say expressivists *cannot* offer such explanations.

  ### (c) Does the Conclusion ("Expressivism collapses") follow?
  *   **No, it does not follow from the accurate parts alone.** The accurate parts (a1, a2, a3) identify a genuine and serious challenge: Expressivism must provide a compositional semantics and account for logic without relying on truth-conditional meanings in the standard way.
  *   **The conclusion depends critically on the questionable parts:**
      *   It depends on the **false claim** that expressivism "offers no account" for embedding (b2).
      *   It depends on the **unargued assumption** that only truth-conditional semantics can be compositional and underwrite logic (b4).
      *   It **ignores the extensive research program** explicitly dedicated to solving this problem (b1).
      *   It **conflates** the expression of an attitude with the entire semantic contribution of the sentence (b3).

  **In essence:** The textbook accurately describes *what the Frege-Geach problem is* but grossly misrepresents the *state of play* in contemporary metaethics. It presents the problem as an unsolved, fatal objection when, in reality, it's the primary driver of sophisticated expressivist semantic theories. Whether those theories are *ultimately successful* is a live debate. Some philosophers (often called "the new wave" or "inferentialist" expressivists like Schroeder) argue earlier solutions were inadequate but propose new ones, while critics (like Unwin, Dreier in some moods, and many realist-leaning philosophers) argue the solutions face deep problems. But to claim expressivism "collapses" because of Frege-Geach ignores the last 40+ years of metaethical work. Your impression is correct: for many, Frege-Geach is not a refutation but the core research agenda for expressivism.

  **Key Expressivist Responses (Briefly):**
  *   **Blackburn (Projectivism/Quasi-Realism):** Moral sentences express attitudes. The semantic value for composition is a "commitment" or a function from contexts (including other attitudes) to attitudes. Logic is explained via the *inconsistency* of combinations of attitudes. "If lying is wrong, then..." expresses a higher-order attitude of disapproval towards combining disapproval of lying with *not* disapproving of getting your brother to lie.
  *   **Gibbard (Norm-Expressivism):** Moral sentences express states of norm-acceptance (plans for what to do/feel). Semantic values are "fact-plan worlds" or sets of world-norm pairs. Composition and logic are handled using possible-worlds semantics adapted for norms (a kind of "hyperplan" semantics). Validity is defined as plan consistency.
  *   **Schroeder (Being For):** Proposes a simpler, unified expressive attitude ("being for") and develops a formal compositional semantics where moral terms denote complex properties of this attitude.

  The textbook passage fails to engage with any of this complexity, presenting the problem statically as if expressivists threw up their hands in 1965. Your seminar instructor likely recommended the supplementary text for its overview, but your critical eye noticing its "tidiness" is spot-on – it oversimplifies the dynamic and contested nature of the debate.
