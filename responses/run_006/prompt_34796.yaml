answer: |-
  Here’s a structured seminar plan targeting the philosophical tension in advance directives, designed for clinically experienced students ready for deeper ethical inquiry:

  ---

  ### **Seminar Structure (120 mins)**
  **I. Conceptual Foundation (30 mins)**  
  *Ordered to build necessary philosophical premises:*  
  1. **Autonomy as Temporal** (10 mins):  
     - Clarify that autonomy isn’t a "one-time act" but a *project* extending over time.  
     - Distinguish *precedent autonomy* (past self’s wishes) vs. *current interests* (present self’s well-being).  
  2. **Capacity Thresholds** (10 mins):  
     - Emphasize capacity is *decision-specific*: lacking medical decision-making capacity ≠ inability to express *preferences* or experience *well-being*.  
  3. **What Counts as an "Interest"?** (10 mins):  
     - Subjective interests (desires, happiness) vs. objective interests (e.g., health, dignity).  
     - Introduce the "then-self" vs. "now-self" framework (Dworkin, Parfit).

  **II. Core Case Study: "The Contented Directive Defier" (20 mins)**  
  *Features to preserve tension:*  
  - **Patient**: 75yo with progressive dementia who previously wrote: "If I develop severe dementia, I refuse antibiotics for life-threatening infections."  
  - **Current state**: Smiling, engaged in simple pleasures (e.g., music), but develops pneumonia. When offered antibiotics, she nods agreeably.  
  - **Key tensions**:  
    - Directive is unambiguous and legally valid (signed/witnessed during competency).  
    - Current behavior *suggests* acceptance of treatment.  
    - *Crucially*: No evidence of reversible depression when directive was written.  
  - **Excluded features**:  
    - No family conflict (removes proxy/distraction).  
    - No ambiguity in the directive’s language.  

  **III. Guided Discussion (50 mins)**  
  *Sequence questions to surface misconceptions at key points:*  

  | **Misconception** | **When to Address** | **Counter-Question/Intervention** |
  |-------------------|---------------------|----------------------------------|
  | "The document is legally binding, so we must follow it." | After case intro | *"Does legal validity resolve the ethical dilemma? What if enforcing the directive causes the current self evident distress?"* |
  | "The current self’s preferences don’t matter—they lack capacity." | When discussing "nodding agreeably" | *"If we ignore all expressions from incapacitated patients, what does that imply about our duty to their well-being?"* |
  | "This is just poor drafting—it should have addressed ‘happy dementia’." | If students blame the directive | *"Suppose the directive explicitly states: ‘Even if I appear content, I refuse treatment.’ Does that dissolve the ethical conflict?"* |

  **IV. Synthesizing the Tension (15 mins)**  
  - **Core philosophical conflict**: Precedent autonomy vs. current well-being.  
  - **Frameworks to contrast**:  
    - *Dworkin*: Past directives protect "critical interests" (life narrative > experiential well-being).  
    - *Counterview*: Severe dementia creates a "new self" whose interests override past wishes.  
  - **Clinical middle grounds**: Substituted judgment (what *would* they want now?) vs. best interests.  

  **V. Assessment & Unresolved Questions (5 mins)**  
  - **Diagnostic question**:  
    *"If Mrs. Jones’s current contentment is genuine, is honoring her directive a profound act of respect—or a betrayal of her present self?"*  
    *(Aim for discomfort: Students grasping the tension won’t settle for easy answers.)*  
  - **Explicitly unresolved issues**:  
    - Does personal identity persist in dementia? (Parfit’s psychological connectedness problem.)  
    - Can we *objectively* compare the moral weight of past vs. present selves?  
    - The role of clinical humility: When should we default to precedent autonomy despite uncertainty?  

  ---

  ### **Why This Works**  
  - **Case design**: The "contented defier" eliminates distractions (legal flaws, proxy conflict) to isolate the autonomy/well-being clash.  
  - **Misconception timing**: Preempts reductionism by challenging clinical reflexes *as they arise* in discussion.  
  - **Assessment question**: Tests if students see both sides as morally defensible rather than seeking a "correct" answer.  
  - **Ending on uncertainty**: Reinforces that philosophy complicates clinical practice—it doesn’t simplify it.  

  **Materials**: Provide 1-page case handout + quotes from Dworkin (*Life’s Dominion*) and opposing views (e.g., Jennifer Hawkins on current interests). Assign roles: clinician, ethics consultant, "devil’s advocate" for past/current selves.
