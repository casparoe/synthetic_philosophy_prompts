prompt: |-
  ok so i've got a pretty classic inside-view vs outside-view situation and i'm trying to figure out where the actual disagreement lives, not just trade numbers.

  the concrete thing: i'm a phd student thinking about leaving to join an early-stage AI safety org. the outside view on "leaving a phd program to join a small nonprofit" is not great — most such orgs dont last, most people who leave phds don't end up in the roles they hoped for, etc. my inside view is that the specific org is run by people i trust, the funding situation is solid for at least 2 years, and the work is important. my advisor (who is not in AI safety, just a generic sensible person) puts my probability of "in 5 years i'm glad i left" at maybe 15%. i'm at around 55%.

  but rather than adjudicate my specific case, i want you to decompose your credence on the methodological question: "when a reflective person's inside view conflicts with a well-chosen outside view on a high-stakes personal decision, the inside view is more accurate than the outside view." (feel free to state the claim more precisely if you think i've left an ambiguity.)

  what i want:
  - the sub-questions your credence on this depends on
  - a rough probability for each, with a sentence of justification
  - how they combine to your overall number
  - which sub-question the 15% vs 55% disagreement is most likely to be about
  - what evidence would shift your credence on that sub-question the most

  and one thing: please flag where you're drawing on stuff that's reasonably settled (e.g. the basic finding that outside views outperform inside views in forecasting, which i think is pretty robust) vs. stuff that's genuinely contested (like whether the outside view can be applied too crudely, or whether some domains systematically favor inside views). don't give me "the literature says X" when there's actually a live debate. i know there's been back and forth on this since kahneman and tversky and i don't want a one-sided summary.
