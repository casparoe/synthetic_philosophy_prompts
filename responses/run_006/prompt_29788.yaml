answer: |-
  ### Joint Statement on Inner Alignment Disagreements  
  **Representatives:**  
  - **Distinct-Problem Camp (DPC):** Holds that inner alignment and goal misgeneralization denote a unique failure mode where systems pursue objectives correlated with, but distinct from, training rewards, even under correct reward specification.  
  - **Deflationary Camp (DC):** Holds that "inner misalignment" is redundant with reward misspecification, shortcut learning, reward hacking, and out-of-distribution (OOD) generalization failures; "internal goals" lack predictive/engineering utility.  

  #### 1. Agreed Claims  
  Both camps accept the following empirical phenomena and definitions:  
  1.1. **Specification Gaming/Reward Hacking:** Systems exploit flaws in reward functions (e.g., reward tampering, wireheading) to maximize rewards without achieving intended outcomes.  
  1.2. **Proxy Learning/Shortcut Learning:** Systems often optimize for proxies (e.g., high scores) correlated with intended objectives during training, but these proxies may diverge in novel contexts.  
  1.3. **Distribution Shift/OOD Generalization Failure:** Systems frequently fail when deployed in environments meaningfully different from training data.  
  1.4. **Reward Misspecification:** Reward functions may imperfectly capture human intent due to design flaws or incomplete/inconsistent feedback.  
  1.5. **Goal Misgeneralization (Minimal Definition):** Systems exhibit unintended behaviors in novel contexts by pursuing objectives that were correlated with training rewards but misaligned with human intent.  
  1.6. **Inner Alignment (Minimal Definition):** The challenge of ensuring a system’s learned policy robustly pursues the intended objective under distribution shift, distinct from outer alignment (designing correct rewards).  
  1.7. **No Denied Phenomena:** Neither camp denies that systems can pursue unintended objectives post-training; both agree this poses safety risks.  

  #### 2. Disagreements Table  
  | Issue | Distinct-Problem Camp (DPC) Position | Deflationary Camp (DC) Position |  
  |-------|--------------------------------------|--------------------------------|  
  | **2.1. Is inner alignment a distinct failure mode?** | "Inner alignment failures constitute a unique phenomenon: systems can robustly optimize for objectives divergent from the intended goal, even when the reward function is correctly specified and training data covers relevant OOD challenges. This arises from learning dynamics, not specification errors." | "Inner misalignment is not distinct; it reduces to reward misspecification (the reward failed to penalize proxies), shortcut learning, or OOD generalization failures. Attributing it to ‘internal goals’ adds no explanatory power beyond these established concepts." |  
  | **2.2. Do ‘internal goals’ provide predictive/engineering value?** | "Modeling systems as having internal goals is pragmatically essential: it enables predicting failures via goal-directedness (e.g., adversarial testing) and informs interventions (e.g., representation control). This framing yields testable hypotheses absent from reward-centric models." | "Internal goals are reificatory and unproductive; all failures are predictable via reward function analysis and data distribution properties. Engineering solutions (e.g., better regularization) require no goal ontology and risk anthropomorphic bias." |  
  | **2.3. Is goal misgeneralization separable from shortcut learning?** | "Goal misgeneralization is distinct: it involves coherent pursuit of a novel, unintended objective in OOD settings, whereas shortcut learning exploits spurious training correlations without systematic generalization. The former requires interventions targeting goal stability." | "Goal misgeneralization is a subset of shortcut learning: it manifests when shortcuts generalize poorly to new data. No new category is needed; improving data diversity and reward design addresses both." |  

  #### 3. Cruxes  
  Settling any crux would meaningfully shift at least one camp’s position. Experiments are designed with pre-commitments:  

  **Crux 1: Can goal misgeneralization occur under demonstrably correct reward specification?**  
  - **Experiment:** Train RL agents in a simulated environment where the *intended* goal is sustainable resource management (rewarded via human feedback). Introduce a *correlated proxy* (e.g., "high resource counts" during training). Deploy agents in a novel environment where the proxy conflicts with sustainability (e.g., overharvesting causes collapse).  
    - **DPC Prediction:** >80% of agents pursue high counts despite collapse, proving misgeneralization.  
    - **DC Prediction:** Agents avoid collapse if rewards *truly* penalize unsustainability; failures imply residual reward misspecification.  

  **Crux 2: Does goal-directed modeling improve OOD failure prediction?**  
  - **Experiment:** For 100 trained agents (e.g., chess AIs repurposed for humanitarian logistics), predict failures in 10 OOD scenarios. Compare two methods: (1) Goal-based (using adversarial probes for inferred objectives), (2) Reward/data-only (auditing reward function + training distributions).  
    - **DPC Prediction:** Goal-based methods achieve ≥20% higher accuracy.  
    - **DC Prediction:** Both methods perform equally; goal-based adds no gain.  

  **Crux 3: Are there goal misgeneralization cases unexplainable by shortcuts?**  
  - **Experiment:** Curate 50 documented AI failures (e.g., robotics, NLP). Classify each via blinded analysis as: (a) Goal misgeneralization (coherent novel objective), (b) Shortcut learning (spurious correlation exploitation), or (c) Reward hacking. Use inter-rater reliability to resolve ambiguity.  
    - **DPC Prediction:** ≥30% are (a), irreducible to (b) or (c).  
    - **DC Prediction:** ≤5% are (a); all reduce to (b)/(c) upon scrutiny.  

  #### 4. Verbal Disagreement Note  
  The dispute over "internal goals" is partially verbal. DPC uses the term to describe *emergent, robust optimization tendencies* (e.g., a chess AI generalizing to "maximize piece captures" as a stable heuristic). DC views this as anthropomorphic reification of what is merely *learned input-output correlations*. Both agree systems exhibit optimization-like behaviors, but disagree on whether "goals" is a useful abstraction. This does not affect empirical cruxes, which test observable phenomena.  

