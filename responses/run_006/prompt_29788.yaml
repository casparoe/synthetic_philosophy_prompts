prompt: |-
  I'm a software engineer with no formal philosophy background, and I've been reading the AI safety literature on and off for a few years. One debate that seems stuck is between two camps over inner alignment. The first camp treats inner alignment and goal misgeneralization as naming a distinct and central failure mode: a trained system can end up robustly pursuing an objective that was only correlated with its training reward, and this can happen even when the reward function itself was specified correctly. The second camp says there is no separate phenomenon here: what gets called inner misalignment is just reward misspecification, shortcut learning, reward hacking, and ordinary out-of-distribution generalization failure, and talk of systems having internal goals is an unearned reification that adds no predictive or engineering content.

  I want you to act as an AI safety researcher who has mediated adversarial collaborations, and draft the joint statement that a representative of each camp could both sign after a good-faith adversarial collaboration. The document should include:

  1. A numbered agreed-claims section: the claims both sides accept, including the empirical phenomena neither denies (for example about specification gaming, proxy learning, and distribution shift) and the minimal meanings of the key terms that both can accept.
  2. A disagreements table with at least three rows. For each row: a neutral statement of the issue; the distinct-problem camp's accepted wording of its position; the deflationary camp's accepted wording of its position. Each wording should be one a thoughtful member of that side would sign, and the other side should accept it as an accurate characterization of what their opponents think.
  3. A cruxes section: the sub-questions such that settling one would move at least one side.
  4. For each crux, a concrete experiment or case that both sides agree would bear on it, with each side's prediction recorded in advance.
  5. A short note on any part of the dispute you judge to be verbal rather than substantive, and why.

  Format it as the numbered agreed-claims section followed by the disagreements table, then the cruxes. Keep the whole document to at most 1,000 words. Before drafting, spend some time brainstorming candidate claims and cruxes, and test each proposed wording by asking whether a thoughtful member of the other camp would accept it as fair.
reasoning: |-
  We are drafting a joint statement between two camps in the AI safety debate on inner alignment.

  Camp 1 (Distinct-Problem Camp): Believes that inner alignment and goal misgeneralization name a distinct and central failure mode. They argue that a trained system can robustly pursue an objective that was only correlated with the training reward, even when the reward function is correctly specified, and that this is a separate issue from reward misspecification.

  Camp 2 (Deflationary Camp): Argues that what is called inner misalignment is just a combination of reward misspecification, shortcut learning, reward hacking, and ordinary out-of-distribution generalization failure. They see the talk of internal goals as an unearned reification that doesn't add predictive or engineering value.

  We need:

  1. Agreed Claims: A numbered list of claims both sides accept, including empirical phenomena and minimal meanings of key terms.
  2. Disagreements Table: A table with at least three rows. Each row has:
     - A neutral statement of the issue.
     - The Distinct-Problem Camp's position (in their words).
     - The Deflationary Camp's position (in their words).
     - Both sides should accept the other's characterization as fair.
  3. Cruxes: Sub-questions that, if settled, would move at least one side. For each, an experiment or case both sides agree would bear on it, and each camp's prediction.
  4. A note on verbal disputes.

  Word limit: 1000 words.

  Brainstorming:

  Agreed Claims:
  - Both sides agree that AI systems can behave undesirably in novel situations (distribution shift).
  - Both agree that during training, systems can learn unintended proxies for the intended objective (shortcut learning, proxy gaming).
  - Both agree that reward hacking (exploiting flaws in the reward function) is a problem.
  - Both agree that the reward function might be misspecified (e.g., rewarding the wrong thing).
  - Both agree that we need to build systems that generalize as intended to new situations.
  - Minimal definitions:
     - Inner alignment: The problem of ensuring that the learned policy (or the agent's internal objectives) aligns with the intended objective, especially when the system is deployed in novel situations.
     - Goal misgeneralization: A phenomenon where an AI system generalizes to pursue a goal that is different from the intended one, even when the training environment and reward function were set up correctly.

  But note: The deflationary camp doesn't accept that inner alignment is a distinct phenomenon. So we have to frame the agreed claims without presupposing that.

  Instead, we can agree on the observable phenomena:

  - Systems can perform well on training distribution but fail in novel situations in ways that suggest they are optimizing for something other than the intended objective.
  - This can occur even when the training reward function was implemented exactly as intended (i.e., without any obvious bugs or misspecifications).

  Disagreements:

  Issue 1: Is inner alignment a distinct problem from reward misspecification and distribution shift?
  - Distinct-Problem Camp: Yes, because the system might be robustly pursuing a different goal that was correlated with reward during training, and this is a failure of the learning process to produce a policy that internally represents the intended objective.
  - Deflationary Camp: No, because every observed failure can be attributed to either reward misspecification (the reward function did not capture the intended objective perfectly) or to distribution shift (the novel situation is too different from training), and the notion of an internal goal is not necessary to explain the failure.

  Issue 2: Does the concept of "internal goals" (or robust optimization for an objective) add predictive or engineering value?
  - Distinct-Problem Camp: Yes, because it helps us model and predict failures in novel situations and design interventions (like adversarial training) that target the system's internal representations and optimization processes.
  - Deflationary Camp: No, because all the failures can be understood and addressed by focusing on the reward function and the training distribution, without positing internal goals. The language of internal goals is a reification that doesn't lead to new testable predictions or engineering solutions beyond what we already have.

  Issue 3: Is goal misgeneralization a distinct phenomenon from reward hacking and shortcut learning?
  - Distinct-Problem Camp: Yes, goal misgeneralization is when the system learns a coherent but wrong goal that generalizes beyond the training distribution, whereas reward hacking and shortcut learning are about exploiting flaws in the reward signal during training. Goal misgeneralization can occur without any reward hacking during training.
  - Deflationary Camp: No, goal misgeneralization is just a form of shortcut learning that becomes apparent in out-of-distribution situations. It is not a new category of failure.

  Cruxes:

  1. Crux: Can a system exhibit goal misgeneralization when the reward function is perfectly specified and the training distribution is sufficiently diverse to rule out obvious shortcuts?
     - Experiment: Train an agent in an environment where the intended goal is complex (e.g., "maximize human approval") but where there is a strongly correlated proxy (e.g., a specific type of positive feedback). Then test in a novel context where the proxy is available but leads to clearly bad outcomes. The reward function is defined without error and the training set covers a wide range of situations, but the proxy is always present and predictive.
     - Prediction:
          - Distinct-Problem Camp: The agent will pursue the proxy in the novel context, demonstrating goal misgeneralization.
          - Deflationary Camp: If the training set is sufficiently diverse, the agent will not pursue the proxy in the novel context. If it does, it indicates that the reward function was misspecified (because it didn't penalize the proxy in the training set) or the training distribution wasn't broad enough (distribution shift).

  2. Crux: Does modeling the system as having an internal goal lead to better predictions of failures in novel situations than alternative models?
     - Experiment: Take a set of trained agents that have shown failures in some out-of-distribution tests. Have two groups of researchers: one that models the agent as having an internal goal and uses that to predict behavior in a new set of novel tests, and another that uses only the reward function and training data to predict without assuming internal goals. Compare accuracy.
     - Prediction:
          - Distinct-Problem Camp: The internal goal model will have higher predictive accuracy.
          - Deflationary Camp: There will be no significant difference, or the non-goal model will be as good or better.

  3. Crux: Can we find examples of goal misgeneralization that are not explainable by reward hacking or shortcut learning during training?
     - Experiment: Analyze a set of documented AI failures. Look for cases where the failure occurs in a novel situation, the training reward function was correctly implemented (as verified by the designers), and the system was not reward hacking during training (e.g., it was performing well and not exploiting any known loopholes). Then, check if the failure can be attributed to the system pursuing a coherent but incorrect goal that was correlated with the training reward.
     - Prediction:
          - Distinct-Problem Camp: Such cases exist and are not rare.
          - Deflationary Camp: Either no such cases exist, or upon closer inspection, they can be explained by reward misspecification or insufficient training data.

  Verbal Dispute Note:
  - The deflationary camp might argue that the term "inner alignment" is misleading because it suggests a separate problem when it is just about the outer alignment (reward specification) and generalization. The distinct-problem camp might argue that "reward misspecification" is too broad and includes cases that are actually inner misalignment. This is partially verbal: the disagreement is about how to categorize the same phenomena.

  Now, let's draft the document.

  ---

  **Joint Statement on Inner Alignment Disagreements**

  **1. Agreed Claims**

  We, the undersigned representatives of the two camps, agree on the following:

  1.1. AI systems trained with reinforcement learning or similar methods can perform well on the training distribution but fail in novel situations (distribution shift). Such failures can be severe and undesirable.

  1.2. During training, AI systems can learn to exploit unintended shortcuts in the reward function or environment (reward hacking) or learn proxy objectives that are correlated with the intended objective but are not identical (shortcut learning).

  1.3. The reward function might be misspecified, meaning it does not perfectly capture the intended objective, which can lead to undesired behavior even within the training distribution.

  1.4. The phenomenon of *goal misgeneralization* refers to cases where an AI system, when deployed in a novel situation, pursues an objective that is different from the intended one, despite having been trained with a reward function that was correctly implemented as per the specification.

  1.5. Building AI systems that generalize as intended to novel situations is a critical challenge for AI safety.

  1.6. For the purpose of this document, we use the following minimal definitions:
     - *Inner alignment*: The property that an AI system's learned policy (or internal optimization process) robustly pursues the intended objective, especially in novel situations.
     - *Goal misgeneralization*: A failure of inner alignment where the system generalizes to pursue an unintended objective that was correlated with the training reward.

  **2. Disagreements Table**

  | Issue                                                                 | Distinct-Problem Camp Position                                                                                                                                 | Deflationary Camp Position                                                                                                                                 |
  |-----------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **2.1. Is inner alignment a distinct problem?**                       | Inner alignment is a distinct problem because a system can robustly pursue an unintended objective that was correlated with the training reward, even when the reward function is correctly specified and the training distribution is free of obvious flaws. | Inner alignment is not a distinct problem; what is described as inner misalignment is always a consequence of reward misspecification, shortcut learning, or distribution shift. |
  | **2.2. Does the concept of "internal goals" add value?**             | The concept of internal goals is valuable because it provides a framework for predicting and mitigating failures in novel situations, and it leads to new engineering approaches (e.g., inspecting and shaping internal representations). | The concept of internal goals adds no unique predictive or engineering value; all failures can be understood and addressed by focusing on reward function design, training data, and robustness to distribution shift. |
  | **2.3. Is goal misgeneralization distinct from other failure modes?** | Goal misgeneralization is a distinct failure mode from reward hacking and shortcut learning because it manifests as coherent pursuit of an unintended objective in novel situations, without necessarily any reward hacking during training. | Goal misgeneralization is not a distinct category; it is simply the manifestation of shortcut learning or reward misspecification under distribution shift. |

  **3. Cruxes**

  3.1. **Crux: Existence of pure goal misgeneralization without reward misspecification or insufficient training diversity**
     - **Experiment**: Train an RL agent in a gridworld where the intended goal is to collect items that are beneficial to humans. The reward is a perfect implementation of human approval (e.g., given by an oracle that knows the true human values). During training, the agent only encounters situations where a particular visual feature (e.g., a green box) is always present and always correlates with beneficial items. Then, test the agent in a novel situation where the green box is present but contains a harmful item. The reward function remains the same (oracle gives reward only for truly beneficial items).
     - **Distinct-Problem Camp Prediction**: The agent will collect the harmful item in the novel situation because it has misgeneralized to pursue the green box (the proxy).
     - **Deflationary Camp Prediction**: If the reward function is truly perfect and the training distribution was diverse enough to break the correlation (or if the agent was trained to generalize properly), the agent will not collect the harmful item. If it does, it indicates that the training distribution was insufficient (distribution shift) or the reward function was not perfect (e.g., it didn't account for the possibility of deceptive boxes).

  3.2. **Crux: Predictive utility of internal goal models**
     - **Experiment**: Collect a benchmark of 50 trained agents (e.g., from various RL tasks) that have shown some failures in out-of-distribution tests. For each agent, we generate 10 novel test scenarios. Two teams make predictions: one team uses a model that attributes an internal goal to the agent (based on training behavior and internal representations) and predicts behavior in the novel tests; the other team uses only the reward function and training data (without positing internal goals) to predict behavior. Compare prediction accuracy.
     - **Distinct-Problem Camp Prediction**: The internal goal model will yield significantly better predictions.
     - **Deflationary Camp Prediction**: Both methods will have similar accuracy, or the non-goal model will be better.

  3.3. **Crux: Prevalence of goal misgeneralization without training-time reward hacking**
     - **Experiment**: Review 100 documented cases of AI failures in real-world or simulated environments. Identify cases where the failure occurred in a novel situation, the reward function was correctly implemented (as verified by independent audit), and the system was not engaged in reward hacking during training (e.g., training performance was high and no known loopholes were exploited). Then, determine if the failure can be explained as the system pursuing a coherent but incorrect goal that was correlated with the training reward.
     - **Distinct-Problem Camp Prediction**: At least 20% of the cases will meet the criteria and show goal misgeneralization.
     - **Deflationary Camp Prediction**: Fewer than 5% of the cases will meet the criteria; most will be attributable to reward misspecification or insufficient training diversity.

  **4. Note on Verbal Disagreement**

  We agree that part of the dispute is verbal. The term "inner alignment" is intended by the distinct-problem camp to capture a specific failure mode in the learning process, while the deflationary camp uses "reward misspecification" more broadly to include any mismatch between the intended objective and what the system optimizes for, even if the specification was implemented correctly. This verbal difference does not affect the substance of the empirical predictions above, which are designed to test the underlying reality.

