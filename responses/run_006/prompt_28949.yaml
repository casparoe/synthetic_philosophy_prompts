prompt: |-
  I'm a tutor for a final-year undergraduate philosophy of language course, and next week I have one seventy-five-minute seminar to introduce two-dimensional semantics to students who already command possible-worlds semantics, the necessary/contingent and a priori/a posteriori distinctions, and the standard Kripkean verdicts about identity statements and natural kind terms — but who have never seen the primary/secondary intension framework. Don't explain two-dimensional semantics to me; give me a plan for how to teach it. What must I first reinstall or make explicit before the primary/secondary distinction is even drawable, and in what order do the remaining pieces have to go so the framework doesn't land as an unmotivated table of labels? Pick the one example that should carry the whole session — if you would set aside the stock 'water is H2O' or 'Hesperus is Phosphorus', say exactly what they fail to do for this audience, and if you would keep one, say what it must have to carry the weight. What are the three or four misconceptions students in this position predictably form — I suspect at least one will treat the primary intension as a mental image or a Fregean sense — and at which precise point in the sequence should each be headed off? Finish with a check for understanding: a sentence or short case I can put on the board whose primary and secondary intensions would only come out correctly if the machinery had actually landed, and say what a correct response should include. Finally, tell me what I should openly refuse to cover at this level.
reasoning: |-
  Okay, the user is a philosophy tutor preparing a seminar on two-dimensional semantics for undergrads who already know possible-worlds semantics, the necessary/contingent and a priori/a posteriori distinctions, and Kripke's ideas about identity statements and natural kind terms. They need a lesson plan that introduces primary and secondary intensions without the framework feeling unmotivated.  

  First, I need to identify what prerequisites must be reactivated. The students know possible worlds, so I should start by reminding them that intensions are functions from possible worlds to extensions. But Kripke's examples like "Hesperus is Phosphorus" being necessary but a posteriori created a puzzle—how can something necessary require empirical evidence? That tension is the key motivation for 2D semantics.  

  The user mentioned avoiding "water is H2O" or "Hesperus is Phosphorus" if they're insufficient. Those examples are classic, but they risk students thinking primary intension is just a mental image or Fregean sense. Instead, "water" itself might work better because its primary intension captures hypothetical scenarios where watery stuff isn't H2O. The tutor must explicitly state that primary intension isn't psychological—it's a function tied to how reference is fixed.  

  Common misconceptions:  
  1. Primary intension as mental image (head this off when defining it—emphasize it's a function from epistemic scenarios)  
  2. Secondary intension being identical to traditional possible-worlds intension (correct during definition by noting it's rigidified)  
  3. Treating the 2D framework as merely epistemic (clarify it's metaphysical by distinguishing how reference is fixed vs. how it actually is)  

  For a check question, "tigers are animals" works well. Primary intension: in any scenario, "tiger" refers to creatures satisfying our typical tiger concept (striped, carnivorous, etc.), so it picks out animals. Secondary intension: in our world, "tiger" rigidly refers to Panthera tigris, so even if in another world those creatures are robots, it's still true. A correct answer needs both functions and why they differ.  

  Finally, the tutor should avoid covering diagonal intensions, deep epistemic/metaphysical disagreements, or Chalmer's zombie arguments. Focus on the core framework and its application to Kripkean puzzles.  

  The session flow should be:  
  1. Reactivate the Kripkean tension (15 mins)  
  2. Introduce the two dimensions via the "water" example (30 mins)  
  3. Define primary/secondary intensions formally (15 mins)  
  4. Address misconceptions (10 mins)  
  5. Check understanding with "tigers are animals" (5 mins)
answer: |-
  Here’s a structured seminar plan focusing on conceptual motivation, avoiding common pitfalls, and ensuring clarity. Total time: 75 mins.

  ---

  ### **Prerequisites to Reinstall (15 mins)**
  1. **Kripke’s Puzzle Recap (5 mins)**  
     - Remind students: Kripke separated necessity from apriority (e.g., "Hesperus = Phosphorus" is necessary but a posteriori).  
     - **Emphasize the tension**: How can a *necessary* truth require *empirical justification*? This creates the need for two "ways" of evaluating meaning.  

  2. **Worlds and Contexts (10 mins)**  
     - **Possible worlds (metaphysical)**: "Counterfactual worlds" (e.g., "What if water *were* XYZ?").  
     - **Epistemic scenarios (new term)**: Not "worlds" but *centered worlds* or "hypothetical contexts of discovery" (e.g., "What if *this* liquid in my glass is XYZ?"). Stress: These are not mental images but ways of fixing reference.  
     - **Key distinction**:  
       - Metaphysical worlds → **What is true** (secondary intension).  
       - Epistemic scenarios → **How we know** (primary intension).  

  ---

  ### **Core Example: "Water" (25 mins)**  
  *Why "water" over "Hesperus"?*  
  Hesperus/Phosphorus is identity-focused; "water" better illustrates *natural kind terms* and reveals the epistemic/metaphysical split.  

  1. **Build Primary Intension (10 mins)**  
     - Ask: "What criteria fix the reference of 'water' in a hypothetical scenario?" (e.g., clear, drinkable liquid in oceans).  
     - Define: Primary intension = *reference-fixing role*. In scenario S, "water" picks out whatever plays the "water role" in S (e.g., XYZ if S has XYZ in oceans).  
     - **Crucial**: Emphasize this is *not* a Fregean sense! It’s a function from epistemic scenarios to extensions, tied to linguistic conventions.  

  2. **Build Secondary Intension (10 mins)**  
     - Ask: "Given that water *is* H₂O in our world, what does 'water' pick out in counterfactual worlds?" (e.g., H₂O even in worlds where XYZ is in oceans).  
     - Define: Secondary intension = *rigid designation*. Once reference is fixed, it picks out H₂O across all worlds.  

  3. **Link to Kripkean Puzzles (5 mins)**  
     - "Water is H₂O" is:  
       - **A posteriori**: Primary intension ≠ secondary intension (XYZ scenario is conceivable).  
       - **Necessary**: Secondary intension picks out H₂O in all worlds.  

  ---

  ### **Common Misconceptions & Preemptive Fixes**  
  1. **Misconception**: Primary intension = mental image/Fregean sense.  
     - **When to fix**: During the "water role" discussion.  
     - **Response**: "It’s not psychological; it’s a function defined by public language rules. We *could* discover water is XYZ—this shows it’s not a 'sense'."  

  2. **Misconception**: Secondary intension = traditional possible-worlds intension.  
     - **When to fix**: When defining secondary intension.  
     - **Response**: "It *is* the Kripkean intension—but now we see *why* it’s rigid: because fixation in the actual world anchors it."  

  3. **Misconception**: 2D semantics is "just" about epistemology.  
     - **When to fix**: During the recap of Kripke’s puzzle.  
     - **Response**: "It explains how metaphysical necessity and epistemic access interact—neither reduces to the other."  

  ---

  ### **Check for Understanding (10 mins)**  
  **Case**: "Tigers are animals."  

  1. **Ask students**:  
     - Primary intension: What picks out "tigers" in an epistemic scenario?  
       *→ Correct: "Creatures satisfying typical tiger appearances (striped, carnivorous, etc.) in that scenario."*  
     - Secondary intension: What does "tiger" designate in counterfactual worlds?  
       *→ Correct: "The actual species *Panthera tigris* (so in a world where 'tigers' are robots, 'tigers are animals' is false)."*  

  2. **Why this works**:  
     - Primary intension is animal-involving (if a scenario has organic tigers).  
     - Secondary intension is contingent (tigers might not have been animals).  
     - Tests grasp of both dimensions *and* their independence.  

  ---

  ### **What to Refuse to Cover (State Explicitly)**  
  1. **Diagonal intensions** (too technical for intro).  
  2. **Deep metaphysical debates** (e.g., Chalmer’s zombie arguments).  
  3. **Historical comparisons** (e.g., Frege vs. Kripke vs. 2D).  
     → *"Today’s goal: Understand the framework’s *structure* and how it resolves Kripke’s puzzle."*  

  ---

  ### **Timing Summary**  
  - Prerequisites: 15 mins  
  - Example & Definitions: 25 mins  
  - Misconceptions: 10 mins (woven into definitions)  
  - Student Practice: 15 mins (include "tigers" and 1–2 more, e.g., "gold")  
  - Check & Recap: 10 mins  

  This sequence grounds the framework in a known problem, demystifies labels via a single example, and preempts philosophical dead ends. The "water" example carries the weight because it isolates the natural kind rigidity that creates the epistemic gap—unlike identity statements, which obscure the dual roles.
