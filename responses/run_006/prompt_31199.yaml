prompt: |-
  Me and a colleague have been going back and forth about low-impact AI and I want to figure out where the real disagreement lives. My credence is about 0.3 that there is a workable notion of "avoid side effects" or "low impact" for a capable agent that doesn't secretly require a full specification of human values; his is about 0.7. By workable I mean: a penalty or constraint an AI lab could actually write down, that makes an agent systematically avoid messing up the world beyond its assigned task in environments it hasn't seen, without hand-coding a list of bad outcomes and without already having a utility function over states. Give me your own number, but mostly I want the decomposition. The sub-questions I can see are: how much rides on whether a baseline ("what would have happened without the agent") can be made well-defined without importing values; how much on whether any finite impact measure just gets Goodharted once the agent optimizes hard against it; how much on whether "side effect" is a principled category at all rather than an artifact of how we draw the agent/world boundary; how much on whether the constraint leaves the agent able to do anything useful instead of just doing nothing; and whatever else you think belongs. Assign a rough probability to each, show how they combine into the headline number, and tell me which term a 0.3-person and a 0.7-person most likely differ on. Then tell me what single empirical result or argument would move your number most, and in which direction. Don't hide behind "the question is underdefined" — pick an operationalization, give me a number, and mark where it's soft.
