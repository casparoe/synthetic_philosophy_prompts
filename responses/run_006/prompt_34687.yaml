  I'm writing the philosophy of mind question for our department's PhD comprehensive exam this year, and I want to field-test it on someone who won't pull punches. The topic is Dennett's Orwellian/Stalinesque distinction and the color phi phenomenon — I've been teaching this material for years, but I've noticed that even strong students tend to either just summarize Dennett's position or gravitate toward one side without really engaging the argument that the distinction itself might be empty. The exam is a three-hour sit-down with three questions; this one should take about an hour. I'd like a question that forces candidates to do more than rehearse Consciousness Explained, chapter 5 — specifically, I want them to grapple with whether the distinction collapses on conceptual grounds alone or whether it's an empirical question that could in principle be settled, and what that difference would mean for Dennett's broader project.

  Please write the exam question, a model answer of roughly 700–800 words, and a marking scheme. The marking scheme should assign 20 marks total, broken down across specific must-hit points, with a note on how candidates typically go wrong on each one. The scheme should separate an A (say, 17–20) from a B (13–16) by naming the specific moves an A answer must contain that a B answer will miss — for instance, articulating why the Orwellian/Stalinesque distinction isn't just a restatement of the difference between memory-editing and perceptual-delay models, but turns on whether there is a determinate point at which content "reaches" consciousness. Bonus points if the model answer can reference at least one attempted empirical resolution (e.g., the color phi with a forced-choice task, or the cutaneous rabbit, or something from the postdictive masking literature) and explain why it might fail to settle the conceptual question.

  For context: I'm a longtime reader of LessWrong and related forums, so I'm comfortable with the rationalist idiom — the exam question itself can be written in standard academic prose, but the model answer and marking scheme can freely use concepts like "dissolving the question" or "Cartesian theater" without apology, and the marking scheme in particular should reflect the kind of analytical clarity I'd expect from someone who's thought hard about what it means to claim that a distinction is merely verbal.
