  - **No** → State must remain neutral between conceptions of the good → **Go to 2B**  

  #### **2A: Claim about cultural rights (for non-neutral states):**  
  *"Should Indigenous communities be allowed to restrict membership based on ancestry, even if it excludes long-term non-Indigenous residents?"*  
  - **Yes** → Community integrity over individual equality → **Communitarianism (Sandel/Taylor)**  
  - **No** → Individual equality over community claims → **Civic Republicanism** (e.g., Rousseau-inspired French laïcité)  

  #### **2B: Claim about the self (for neutral states):**  
  *"Can someone raised in a conservative tradition meaningfully reject its values, or are they 'bound' to it?"*  
  - **Reject values** → Self is prior to ends (we choose) → **Go to 3A**  
  - **Bound to values** → Self constituted by ends (we discover) → **No coherent position** (Incompatible with state neutrality)  

  #### **3A: Claim about exemptions (for neutral states/prior self):**  
  *"Should the Amish be exempt from compulsory high school laws, even if it limits children's future opportunities?"*  
  - **Yes** → Cultural exemptions sometimes override individual rights → **Liberal Multiculturalism (Kymlicka)**  
  - **No** → Individual rights always trump cultural claims → **Go to 4A**  

  #### **4A: Claim about neutrality's legitimacy:**  
  *"Is liberal neutrality itself a partisan worldview that unfairly sidelines non-liberal communities?"*  
  - **Yes** → Neutrality is a disguised doctrine → **Perfectionist Liberalism (Raz)**  
  - **No** → Neutrality is a genuinely fair framework → **Political Liberalism (Rawls)**  

  ---

  ### **Resulting Positions (Leaves):**  
  1. **Communitarianism (Sandel/Taylor)**:  
     - State promotes the good (e.g., moral virtue/social cohesion).  
     - Self constituted by community.  
     - Cultural exemptions permitted even if restrictive.  
     - *Example:* Supports Amish exemptions; opposes French headscarf ban if it disrupts community identity.  

  2. **Civic Republicanism**:  
     - State promotes the good (e.g., civic virtue/secular public sphere).  
     - Self constituted by community.  
     - Cultural exemptions rejected to preserve universal citizenship.  
     - *Example:* Supports French headscarf ban to defend laïcité; denies Indigenous membership restrictions.  
     - *Thinkers:* Inspired by Rousseau; modern French republicanism.  

  3. **Liberal Multiculturalism (Kymlicka)**:  
     - State neutral between conceptions of the good.  
     - Self prior to ends.  
     - Cultural exemptions permitted to protect minority groups.  
     - *Example:* Supports Amish exemptions; opposes headscarf bans.  

  4. **Perfectionist Liberalism (Raz)**:  
     - State neutral between conceptions of the good.  
     - Self prior to ends.  
     - Cultural exemptions rejected.  
     - Believes neutrality is a comprehensive liberal doctrine.  
     - *Example:* Opposes Amish exemptions and headscarf bans; state may promote autonomy.  

  5. **Political Liberalism (Rawls)**:  
     - State neutral between conceptions of the good.  
     - Self prior to ends.  
     - Cultural exemptions rejected.  
     - Believes neutrality is *not* a comprehensive doctrine.  
     - *Example:* Opposes Amish exemptions and headscarf bans; state avoids promoting any good.  

  ---

  ### **Unoccupied Branches & Ambiguities:**  
  - **Incoherent branch (2B → "Bound to values")**:  
    If the self is constituted by community (rejects choice), state neutrality is unsustainable—states *must* reflect community values. Thus, no position occupies this space.  
  - **Indistinguishable leaves (Sandel vs. Taylor)**:  
    The tree cannot separate **Sandel** (emphasizes civic virtue) from **Taylor** (emphasizes cultural recognition) because both answer identically to the questions. They diverge in *why* communities matter, not in policy outcomes.  
  - **Empty but coherent branch**:  
    No theorist defends state neutrality + constituted self. This combination is logically possible (e.g., a state that neutrally facilitates "self-discovery" without imposing values) but undefended.  

  ---

  ### **How to Use in Class:**  
  1. Students answer questions **before learning theories**.  
  2. They find their "leaf," then compare it to assigned readings.  
  3. Ambiguities (e.g., Sandel/Taylor) prompt debate about nuances.  
  4. Unoccupied branches spark discussion: *"Why doesn’t this view exist?"*  

  This tree clarifies core divides (state power, selfhood, exemptions) while revealing gaps in the debate. It avoids jargon, using cases like headscarf bans and Amish education to make abstract principles tangible.
