prompt: |-
  I'm taking a philosophy of language seminar this semester and the professor has this really distinctive way of handling conditionals. We've been going through examples for weeks and I've been keeping a list of her verdicts in my notes. She's super consistent but I can't figure out what rule she's actually running — every time I think I've got it pinned down, I realize there's another theory that fits everything she's said so far.

  Here's what I've got from her so far:

  - "If Oswald didn't kill Kennedy, someone else did." — True, no hesitation.
  - "If Oswald hadn't killed Kennedy, someone else would have." — False, she practically rolled her eyes.
  - "If it's raining, the sidewalk is wet." — True (assuming normal circumstances, no tarp or whatever).
  - "If it had rained, the sidewalk would be wet." — True.
  - "If the butler didn't do it, the gardener did." (We know exactly one of them did it.) — True.
  - "If the butler hadn't done it, the gardener would have." (We know the butler did it, but we don't know anything about the gardener's tendencies or motives.) — False.
  - "If it's not raining, it's not pouring." — True, she called it analytic.
  - "If it hadn't rained, it wouldn't have poured." — True.
  - "If this coin is fair, it will come up heads." — False, she said the probability is too low.
  - "If this coin had been fair, it would have come up heads." — False, same reason.
  - "If it's raining, then if the match is cancelled, the team will be disappointed." — True.
  - "If it rains and the match is cancelled, the team will be disappointed." — True, and she said these last two are equivalent (import-export, she called it).
  - "If it had rained, then if the match had been cancelled, the team would have been disappointed." — True.
  - "If it had rained and the match had been cancelled, the team would have been disappointed." — True, again equivalent.

  So far the theories we've covered that fit her data include the orthodox bifurcation view (indicatives are epistemic Ramsey-test things, counterfactuals are similarity-based possible-worlds things, totally different semantics), the unified Stalnaker approach (both are selection-function conditionals, just with different accessibility relations), and the Adams/Edgington line (conditionals don't have truth values at all, they express conditional probabilities). All three of these handle everything on my list fine.

  Next week she's going to throw a new sentence at us and I'm supposed to predict her verdict: "If it's raining, then if the match had been cancelled, the team would have been disappointed." This is a mixed embedding — an indicative wrapping a counterfactual — and we haven't seen her rule on anything like that. I feel like this is the case that's finally gonna reveal what she actually thinks.

  What should I predict she'll say, and why? And if she says what you think she'll say, what's the one further case I should ask her about that would really nail down which of these theories she's running — a case where the theories that survive her answer to this one would finally come apart?
