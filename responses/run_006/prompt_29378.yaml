prompt: |-
  I am trying to work out what principle, if any, captures my judgments about when the criminal law should prohibit conduct between consenting adults. I think it should prohibit: a stranger beating someone in an alley; a broker selling a terminally ill patient a sham cure; two adults who agree to a duel to the death; one adult killing and eating another with the victim's documented, freely given consent; and a person contracting to sell himself into chattel slavery for life. I think it should not prohibit: two adult siblings having private, contraceptive sex; someone burning the national flag in protest; a person selling one of his kidneys to a willing buyer; professional boxers; and members of a private club who pay to receive severe but non-permanent beatings for sexual gratification. This mostly looks like a harm principle, but the dueling and cannibalism cases make me doubt whether consent can ever be a defense to death, and I cannot see what distinguishes the private club beatings, which I would allow, from the duel, which I would punish, except the severity of the harm — a line I am not sure I can defend. I also cannot tell whether these exceptions commit me to legal moralism after all. Is there one principle that yields all or nearly all of these verdicts? If so, state it precisely and say which clause is motivated by which case. What does it imply about cases I have not settled — for example, a physician who gives a lethal dose at a competent, terminally ill patient's repeated request, or a consensual gladiatorial match to the death? Which of my verdicts, if any, does the principle force me to abandon? Lead with your bottom line in the first sentence, then give your reasoning, with no preamble and no restating of the question. Use American English.
reasoning: |-
  Okay, the user is really wrestling with the boundaries of consent in criminal law. They've laid out a detailed list of scenarios where they think prohibition is or isn't justified, but they're struggling to find a consistent principle. The core tension seems to be between their harm-based instincts and the cases where consent feels inadequate - like duels or cannibalism. 

  Hmm, their examples reveal interesting patterns. They're comfortable with severe but non-fatal harms in the BDSM club, yet draw the line at death in duels. But why? The permanent/irreversible distinction jumps out - death and slavery can't be undone, while kidney sales or beatings leave room for recovery. That feels like the key differentiator they're groping for.

  Wait, they're also troubled by whether this slides into legal moralism. Good catch. Their examples avoid purely "sinful" acts (like the incest case where harm is minimal), so maybe they're actually rejecting moralism. The sham cure case reinforces this - it's about preventing deception, not enforcing morals.

  The physician-assisted death and gladiator match questions are perfect test cases. If permanent harm is the line, assisted death might pass (terminal illness makes recovery impossible anyway) but gladiator fights wouldn't. That preserves their duel objection while allowing some self-determination.

  Notably, their slavery example fits perfectly under irreversible harm. And the broker case? That's straight-up fraud - consent wasn't meaningful. The alley beating lacks consent entirely. Everything clicks except... wait, why allow kidney sales? Because the harm is reversible? But losing a kidney is permanent! Unless we see it as restoring health through transplant... tricky. Maybe medical framework matters here.

  Their verdicts mostly hold up. The toughest conflict is the boxing exception - those can be fatal, but we allow it culturally. The principle would require banning dangerous professional boxing, which might feel counterintuitive. That's where they'd need to decide: is tradition outweighing consistency?
answer: |-
  **The criminal law should prohibit conduct between consenting adults only if it causes (1) non-consensual harm to others, (2) irreversible and severe harm to a consenting participant (including death or permanent loss of fundamental liberty), or (3) harm resulting from fraud or incapacity.**

  1.  **Non-Consensual Harm to Others:** Prohibits the *stranger beating someone in an alley* (victim didn't consent) and *burning the flag* if it causes provable harm like riots (though flag burning itself is likely protected speech absent such harm).
  2.  **Irreversible & Severe Harm to a Consenting Participant:** Prohibits the *duel to the death* (death is irreversible), *cannibalism* (death is irreversible), *chattel slavery for life* (permanent, irreversible loss of fundamental liberty), and distinguishes the *private club beatings* (severe but non-permanent/reversible harm) from the duel. This clause is motivated by the duel, cannibalism, and slavery cases versus the private club.
  3.  **Harm from Fraud/Incapacity:** Prohibits the *broker selling a sham cure* (fraud vitiates consent). This clause is motivated by the broker case.

  **Cases Allowed:**
  *   *Adult siblings having private, contraceptive sex:* Causes no relevant harm under this principle.
  *   *Burning the flag (absent provable harm to others):* Causes no relevant harm under this principle.
  *   *Selling a kidney:* While severe and permanent, it is argued (within this framework) not to constitute a *fundamental* loss of liberty akin to slavery and is often viewed within a medical/therapeutic context, though this is the most contentious allowance under this principle.
  *   *Professional boxers:* Causes severe but generally non-permanent harm (regulated to minimize irreversible damage like death or brain damage).
  *   *Private club beatings:* Severe but non-permanent/reversible harm.

  **Unsettled Cases:**
  *   *Physician-assisted death for a competent, terminally ill patient:* **Likely Permitted.** The harm (death) is irreversible, but the terminal illness makes the future loss of life and liberty inevitable. Consent is genuine, and no fraud exists. The principle focuses on preventing the *infliction* of irreversible harm where it wouldn't otherwise occur imminently.
  *   *Consensual gladiatorial match to the death:* **Prohibited.** Directly causes irreversible harm (death) to a consenting participant, analogous to the duel.

  **Verdicts Requiring Abandonment:**
  This principle forces the abandonment of allowing **dangerous professional boxing** *if* the rules cannot reliably prevent death or irreversible brain damage, as these constitute irreversible severe harm. If boxing is sufficiently regulated to make such outcomes highly exceptional, it might be tolerated as a risk inherent in the consented-to activity, similar to other dangerous sports. However, under a strict reading of clause (2), allowing boxing where death is a known risk conflicts with prohibiting dueling. Consistency would likely require either prohibiting lethal-risk boxing or finding a distinction based on societal acceptance/regulation (which the principle itself doesn't provide).

  **Legal Moralism:** This principle rejects pure legal moralism. It allows acts many find immoral (incestuous sex, flag burning, BDSM, kidney sales) because they lack the defined types of harm. Prohibitions are based on tangible harms, not mere offensiveness or perceived immorality.
