answer: |-
  Let me steelman this argument as rigorously as possible. I'll proceed step-by-step, addressing common objections with counter-rebuttals. My position is that **under standard decision-theoretic principles of moral uncertainty, the scale argument is logically compelling and imposes significant obligations.**

  ### Core Argument Structure
  1. **Premise 1: Moral Uncertainty Requires Expected Value Maximization**  
     When we are uncertain about moral facts (e.g., whether insects are sentient), we should maximize *expected moral value* (Hicks 2017, MacAskill 2014). This follows from:  
     - **Consequentialism**: Morality depends on outcomes.  
     - **Decision-Theoretic Norms**: Rational agents maximize expected value under uncertainty.  
     - *Rebuttal to "But I reject consequentialism!"*: Even deontologists must account for uncertainty (e.g., "Do not risk violating rights"). If sentience grants moral status, risking massive rights violations is indefensible.  

  2. **Premise 2: Non-Trivial Credence in Insect Sentience is Rationally Mandated**  
     - Current science does *not* conclusively prove insect non-sentience (Barron & Klein 2016: insects have integrated neural processing; Gibbons et al. 2022: evidence for pain in crustaceans extends to insects).  
     - Epistemic humility demands non-zero credence: We lack a full theory of consciousness (Hard Problem of Chalmers 1995). Assigning *exactly* 0% probability requires proof of impossibility—which we lack.  
     - *Rebuttal to "But my credence is <<0.1%!"*: Even 0.001% (1e-5) matters under scale. Your skepticism must be defended against:  
       - Evolutionary continuity: Sentience evolved in vertebrates; why not in insects with central brains?  
       - Functional equivalence: Insects exhibit pain-avoidance learning (Walters et al. 2001).  

  3. **Premise 3: The Astronomical Scale of Insect Populations**  
     - Conservative estimate: 10¹⁸ insects alive at any time (Bar-On et al. 2018).  
     - Insect farming: Black soldier fly farms hold billions per facility; industry grows >40%/year (FAO 2023).  
     - *Rebuttal to "But most are wild!"*: Wild insects still matter morally if sentient. Farming concentrates harm.  

  4. **The Expected Value Calculation**  
     Let:  
     - \( S \): Event that insects are sentient.  
     - \( p \): Your credence in \( S \) (e.g., \( p = 0.001 \)).  
     - \( N \): Insect population affected by human actions (\( N \approx 10^{18} \)).  
     - \( V \): Moral value (disvalue) per insect if sentient.  
     - \( \Delta V \): Expected moral value change per insect from our actions.  
     
     **Expected disvalue of inaction**:  
     \[
     \mathbb{E}[D] = p \cdot N \cdot \Delta V
     \]
     - Even if \( \Delta V \) per insect is *tiny* (e.g., 1/1,000,000th of a human's moral weight), \( N \) dominates.  
     - Example:  
       - \( p = 0.001 \), \( N = 10^{18} \) → \( pN = 10^{15} \) expected sentient beings.  
       - Humans + vertebrates: \( \approx 10^{10} \) beings.  
       → **Expected sentient insects outweigh vertebrates by 5 orders of magnitude.**  

  ### Addressing Critical Objections  

  **Objection 1: "Probability is Zero in Practice"**  
  - *Claim*: "We have positive reasons to think insects *aren't* sentient (e.g., no cortex, small brains), so \( p \approx 0 \)."  
  - **Counter**:  
    - Absence of cortex ≠ absence of sentience (e.g., octopuses achieve complex cognition without one).  
    - Brain size: Honeybees (1M neurons) exhibit emotion-like states (Perry & Baciadonna 2017). Assigning \( p = 0 \) is dogmatic.  
    - **Burden of Proof**: To ignore \( pN \), you must prove \( p = 0 \)—not just assert it. Can you?  

  **Objection 2: "Expected Value Breaks Down at Extremes"**  
  - *Claim*: "Expected utility theory is absurd here. Should we also worry about sentient rocks with \( p = 10^{-100} \)?  
  - **Counter**:  
    - **Pragmatic Epistemology**: Credences must be grounded in evidence. We have *some* evidence for insects (e.g., nociception, learning) vs. none for rocks.  
    - **Dominance Principle**: If \( p \) is non-negligible (e.g., >0.0001%) *and* \( N \) is vast, expected value dominates.  
    - **Risk Aversion**: Under moral catastrophe risk (e.g., quadrillions suffering), precaution is rational (Beckstead 2019).  

  **Objection 3: "Insects' Welfare Capacity is Negligible"**  
  - *Claim*: "Even if sentient, insect welfare has such low intensity/depth that \( \Delta V \approx 0 \)."  
  - **Counter**:  
    - Empirical uncertainty: We can't measure subjective experience. Default to symmetry—assume welfare capacity scales with behavioral complexity unless proven otherwise.  
    - **Scale Compensates**: Suppose \( \Delta V_{\text{insect}} = \frac{1}{10^6} \Delta V_{\text{human}} \). Then:  
      \[
      \mathbb{E}[D_{\text{insects}}] = p \cdot N \cdot \Delta V_{\text{insect}} = 0.001 \cdot 10^{18} \cdot 10^{-6} = 10^9 \Delta V_{\text{human}}
      \]  
      → Still equivalent to *1 billion human-like beings* at stake.  

  **Objection 4: "This Demands Too Much—We Can't Avoid Harming Insects"**  
  - *Claim*: "If this argument holds, we must starve (agriculture kills insects)."  
  - **Counter**:  
    - **Proportionality**: The argument implies:  
      a) Minimize large-scale *gratuitous* harm (e.g., insect farming, pesticides where alternatives exist).  
      b) Prioritize research to reduce uncertainty.  
    - This is no more demanding than acknowledging obligations to vertebrates.  

  ### Conclusion: The Burden of Proof Shifts  
  - **Pascalian Wager**: The downside risk (quadrillions suffering) dwarfs the upside (cost of precautions).  
  - **Asymmetry**: False positive (treating non-sentient insects as sentient) has low cost (e.g., using insect-friendly pesticides). False negative risks immense harm.  
  - **Therefore**: Until you can demonstrate \( p = 0 \)—not just assert it—the scale compels us to assign insects significant moral weight.  

  ### Q&A Defense Strategy  
  - **Against probability skeptics**: "What evidence *would* prove insect non-sentience? If none exists, your credence can’t be zero."  
  - **Against intuition pumps**: "Replace 'insects' with 'AI systems' or 'alien life'. Wouldn’t we apply expected value there?"  
  - **Against tractability**: "We’re not demanding perfection. We *are* demanding that booming industries like insect farming pause until we resolve sentience."  

  **Key Citations for Your Slides**:  
  - Barron & Klein (2016): *Insects have subjective experience*  
  - MacAskill (2014): *Normative uncertainty as decision-theoretic problem*  
  - Beckstead (2019): *Long-termism and risk aversion*  
  - FAO (2023): *Global insect farming growth data*  

  This argument is uncomfortable precisely because it exposes how easily *moral confidence* can mask *mathematical negligence*. You don’t need to believe insects are sentient—you only need to admit you *aren’t certain* they aren’t. The scale does the rest.
