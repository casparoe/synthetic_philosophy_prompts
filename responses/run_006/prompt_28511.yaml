prompt: |-
  In an essay on artificial intelligence I read the following summary of the Church–Turing thesis: "The Church–Turing thesis says that a Turing machine can compute anything any physical system can compute. Since the lambda calculus, general recursive functions, and every other model of computation have all been proved equivalent to a Turing machine, the thesis is now a settled theorem. It therefore follows that the human brain, being a physical system, cannot compute anything a Turing machine cannot." I suspect this runs together several distinct claims, but I cannot say precisely where it goes wrong. Treat this as an accuracy audit: identify which parts a computability theorist or philosopher of computation would accept, which are overstatements or conflations, and whether the conclusion about the brain follows from what is true in the summary. Please present the audit as exactly five numbered points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is asking me to audit a summary of the Church-Turing thesis from an essay on AI. They've shared a passage that claims the Church-Turing thesis is now a settled theorem, that all computation models are equivalent to Turing machines, and that therefore human brains can't compute anything beyond what Turing machines can compute. The user suspects there are inaccuracies here and wants me to identify exactly where this summary goes wrong.

  I need to approach this as an accuracy audit with exactly five numbered points, each just one or two sentences. No introduction or conclusion - just straight to the points. I'll be drawing from my knowledge of computability theory and philosophy of computation.

  Looking at the summary, there are several problems here. First, the Church-Turing thesis isn't actually a theorem - it's a hypothesis that can't be formally proven since "computable" isn't mathematically defined outside formal systems. Second, while it's true that standard computation models are equivalent to Turing machines, the summary overstates this as "every other model" when there are speculative models like quantum computers that haven't been proven equivalent (though current understanding suggests they don't exceed Turing computability).

  Third, the jump to physical systems is controversial. The thesis connects mathematical computability to physical realizability, but there are debates about whether all physical processes are computable. Fourth, the claim that the human brain "cannot compute anything a Turing machine cannot" is especially problematic - this ignores important distinctions between computability and other cognitive aspects like consciousness or real-time processing.

  Finally, the conclusion about the brain doesn't logically follow from what's correct in the summary. The equivalence of computation models doesn't directly address what physical systems like brains can do, and there are unresolved philosophical questions about minds and machines.

  I'll organize these insights into five precise points that a computability theorist or philosopher would recognize as accurate criticisms of the original passage.
answer: |-
  Here are five audit points:

  1.  The claim that "the thesis is now a settled theorem" is incorrect; the Church-Turing thesis is a hypothesis about the relationship between formal computability and physical realizability, not a mathematically provable theorem within any formal system.
  2.  While it's true that standard models like lambda calculus and recursive functions are proven equivalent to Turing machines, the phrase "every other model of computation" is an overstatement; equivalence holds for all known *standard* models, but hypothetical or physical models remain subjects of investigation.
  3.  The thesis *asserts* that a Turing machine can compute anything computable by *any* physical system, but this equivalence is not proven; it's the core claim of the thesis itself and relies on defining "computable by a physical system".
  4.  The conclusion that "the human brain... cannot compute anything a Turing machine cannot" conflates computability (what functions are *in principle* calculable) with practical implementation, complexity, consciousness, or other cognitive aspects not captured by pure computability theory.
  5.  The conclusion about the brain does *not* follow solely from the proven equivalence of standard formal models; it requires the unproven physical interpretation of the thesis and ignores open philosophical questions about minds and machines.
