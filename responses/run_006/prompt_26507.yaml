  - **Capabilities and resources** are sometimes hard to separate. For example, if the state provides extra resources to the disabled to achieve equal capability, is that resourcism or capabilities? We define capabilities as focusing on the opportunities to function, so if the goal is equal capability, then it's capabilities even if the means are resources. Resourcism would aim for equal resources, which might leave the disabled with less capability.

