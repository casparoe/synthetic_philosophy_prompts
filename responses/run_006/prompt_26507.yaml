    - D. The quality of social and political relationships -> Then **Relational egalitarianism**.

  But we must note that relational egalitarianism might be combined with one of the currencies. For example, a society might aim for equal resources as a way to achieve equal relations. However, the core commitment of relational egalitarianism is to the relations, so if the state's primary metric is relational, then it's relational.

  Also, there is the issue of luck egalitarianism being a responsibility-sensitive cut that can be applied to multiple currencies. So we can have:

  - Luck egalitarian welfarism
  - Luck egalitarian resourcism (the most common)
  - Luck egalitarian capabilities

  Now, let's write the tree:

  **Decision Tree for Egalitarian Positions**

  **1. What metric does the state use to assess equality?**
     - a) **Subjective well-being** (happiness, satisfaction) → Go to 2.
     - b) **Material resources** (income, wealth, property, access to services) → Go to 3.
     - c) **Opportunities for functioning** (capabilities, e.g., health, education, political participation) → Go to 4.
     - d) **Social and political relations** (absence of domination, equal standing in society) → **Relational egalitarianism**.
       - *Awkward commitment*: Banning private social clubs or elite institutions that might create exclusive networks, even if voluntarily formed, to prevent class segregation.

  **2. [For subjective well-being] Does the state compensate for low well-being even when it is the result of voluntary choices?**
     - a) **Yes** → **Welfarism**.
       - *Awkward commitment*: Using public funds to provide luxury goods to someone who is unhappy because they have developed a taste for champagne and caviar, while others are content with simple pleasures.
     - b) **No** → **Luck-egalitarian welfarism** (less common).
       - *Awkward commitment*: Requiring citizens to undergo psychological evaluations to determine if their unhappiness is due to circumstances beyond their control or their own choices, which can be invasive.

  **3. [For material resources] Does the state compensate for resource deficits even when they are the result of voluntary choices?**
     - a) **Yes** → **Resourcism without responsibility** (e.g., strict equality of resources).
