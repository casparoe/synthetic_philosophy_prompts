  So:

  **Node 1: What should be equalized?**
    - A. Subjective well-being (welfare) -> Then Node 2: Responsibility? -> Leads to welfarism variants.
    - B. Resources (material goods, income, wealth, and all-purpose means) -> Then Node 2: Responsibility? -> Leads to resourcism variants.
