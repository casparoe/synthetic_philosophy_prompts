  - **No serious position advocates for equality in social relations while ignoring all individual holdings** because without some material basis, equal relations are hard to maintain. So relational egalitarians typically also support redistribution to some extent. But the tree does not ignore holdings; it just notes that the primary metric is relational.

  **Unresolved overlaps**:
  - **Capabilities and resourcism**: In practice, a capabilities approach might require unequal resources to achieve equal capabilities. The tree separates them by the metric: if the state measures resources, it's resourcism; if it measures capabilities (or functionings), it's capabilities. But they might agree on policies in some cases.
  - **Relational egalitarianism and the others**: A relational egalitarian might endorse resourcist or capabilities policies as instrumental. The tree forces a choice on the primary metric, but a society might have a hybrid. However, the tree is for identifying the core commitment.

  This tree should help the author think through the institutional choices and the resulting tensions.
answer: |-
  Below is a decision tree designed to help you navigate from the abstract principle of "citizens should be treated as equals" to a specific egalitarian philosophy. Each branch node poses a concrete institutional question that can be answered without philosophical expertise, focusing on how your fictional society would *operationalize* equality. The leaves name the resulting position and highlight its most socially awkward or controversial commitment when implemented honestly. I’ve flagged combinations that are logically possible but philosophically vacant, as well as positions that blur together under the same answers. This structure ensures your society’s contradictions arise authentically from the chosen philosophy.

  ---

  ### **Decision Tree: From "Equality" to Specific Egalitarian Position**
  *Start at the root (Question 1) and follow the branches based on your society’s institutional choices.*

  #### **Question 1: What does the state equalize?**  
  *(The core metric for assessing equality)*  
  - **A. Subjective experiences** (e.g., happiness, life satisfaction) → Go to Question 2.  
  - **B. Tangible goods/access** (e.g., income, property, healthcare) → Go to Question 3.  
  - **C. Opportunities for meaningful action** (e.g., education, political voice, mobility) → Go to Question 4.  
  - **D. Social/power dynamics** (e.g., hierarchies, respect, decision-making influence) → **Leaf: Relational Egalitarianism**  
    - *Awkward commitment:* Banning symbols of personal success (e.g., luxury goods, elite hobbies) to prevent status competition, even if voluntarily funded.  

  #### **Question 2 (from A): Does the state compensate for unhappiness caused by personal choices?**  
  *(How responsibility factors into welfare)*  
  - **A. Yes** → **Leaf: Welfarism**  
    - *Awkward commitment:* Tax-funded "joy subsidies" for people with expensive tastes (e.g., compensating someone who is unhappy because they can’t afford a yacht).  
  - **B. No** → **Leaf: Luck Egalitarianism (welfarist variant)**  
    - *Awkward commitment:* Denying therapy to depressed patients deemed "responsible" for their condition (e.g., due to reckless behavior).  

  #### **Question 3 (from B): Does the state compensate for resource deficits caused by personal choices?**  
  *(The role of responsibility in resource distribution)*  
  - **A. Yes** → **Leaf: Resourcism**  
    - *Awkward commitment:* Redistributing wealth to gamblers who lose their money, while taxing frugal citizens to fund it.  
  - **B. No** → **Leaf: Luck Egalitarianism (resourcist variant)**  
    - *Awkward commitment:* Withdrawing healthcare from smokers with lung cancer, labeling it a "choice-based disadvantage."  

  #### **Question 4 (from C): Does the state focus on opportunities or outcomes?**  
  *(The scope of "capabilities")*  
  - **A. Opportunities only** → **Leaf: Capabilities Approach**  
    - *Awkward commitment:* Building expensive public infrastructure (e.g., wheelchair ramps in remote areas) that few use, while neglecting basic services.  
  - **B. Outcomes guaranteed** → **Leaf: Outcome Egalitarianism**  
    - *Awkward commitment:* Forcing skilled workers into menial jobs to balance success metrics, suppressing merit.  

  ---

  ### **Notes on Ambiguities & Empty Combinations**
  1. **Blurred Positions (indistinguishable under this tree):**  
     - **Luck Egalitarianism** is not a single leaf but a *responsibility-sensitive variant* of other positions (e.g., it appears under both welfarism and resourcism). It answers Questions 2B/3B identically: "No compensation for choice-based disadvantages."  
     - **Capabilities Approach vs. Resourcism**: These blur if your society answers Question 3B and Question 4A similarly (e.g., "equalize opportunities with no responsibility"). Distinguish them by Question 1: capabilities focus on *action* (e.g., voting access), resourcism on *goods* (e.g., income).  

  2. **Logically Possible but Vacant Combinations:**  
     - **"Subjective + Responsibility + Social Dynamics" (A → 2B → D)**: No serious position combines welfarist responsibility with relational equality. *Why?* Relational egalitarians reject individualized metrics (e.g., happiness) as corrosive to solidarity. This hybrid would require intrusive joy-monitoring while banning status differences—a bureaucratic nightmare.  
     - **"Outcomes + No Responsibility" (C → 4B → No responsibility cut)**: Outcome egalitarianism lacks a responsibility branch because it inherently equalizes results, ignoring choice. Adding one (e.g., "compensate only unlucky outcomes") collapses into luck egalitarianism.  

  3. **Unresolved Tensions in Practice:**  
     - **Relational Egalitarianism** often overlaps with capabilities (e.g., both support education access). If your society answers Question 1D but also values opportunities (Question 4A), it may face internal strife: activists might demand tangible resources (capabilities) to achieve social equality, while purists reject "materialism."  
     - **Welfarism vs. Luck Egalitarianism**: If your society monitors satisfaction (Question 1A) but denies help for choice-caused unhappiness (Question 2B), it creates a surveillance state that judges citizens' emotions—a fertile ground for dissidents who reject "happiness audits."

  ---

  ### **How to Use This Tree**
  - **Branching Logic**: Answer each question sequentially to land on a leaf position. For example:  
    *Q1: B (Tangible goods) → Q3: B (No compensation for choices) → Luck Egalitarianism (resourcist).*  
  - **Character Resentments**: The "awkward commitments" define rational grievances. A luck-egalitarian resourcist society might provoke class conflict between "responsible" citizens and those deemed "reckless" (e.g., manual laborers denied injury aid).  
  - **Dissident Beliefs**: A dissenter in a capabilities-based society (Leaf: Capabilities Approach) might argue that "opportunities are meaningless without equal results," channeling outcome egalitarianism.  
  - **Hybrid Societies**: Most real societies mix philosophies, creating contradictions. If yours combines resourcism (Q3A) with relational equality (Q1D), expect tensions—e.g., wealth redistribution might be justified as anti-hierarchical (relational) but resented as unfair to savers (resourcist).

  This tree isolates core philosophies to clarify which tensions are inherent versus avoidable, ensuring your world’s conflicts emerge from its foundational logic. For deeper exploration, study how each position handles a specific disadvantage (e.g., congenital disability vs. self-inflicted injury)—this reveals where your society’s equality principle buckles under pressure.
