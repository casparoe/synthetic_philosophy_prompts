prompt: |-
  Act as a philosopher of medicine who's been deep in the naturalism vs. normativism debate about health and disease for years. Before you answer, take a moment to brainstorm the main sub-questions you'd need to settle, and think carefully about how they bear on each other.

  Then give me your actual credence — a number from 0 to 1 — that a purely naturalistic account of disease is possible. By 'purely naturalistic' I mean an account that picks out the class of diseases using only non-evaluative facts (statistical typicality of function, biological dysfunction, etc.), with no irreducable appeal to values or to judgments about how a life ought to go. By 'possible' I mean the account could be made precise enough to match competent medical judgment on the hard cases: statistically common conditions we still call diseases, statistically rare conditions we don't, and historically pathologized states like homosexuality or drapetomania — without quietly smuggling values in.

  Don't just give me a bare number. Decompose it: list the sub-questions your credence depends on, give a rough probability for each with a one-line justification, and show how you combined them into the final number. Then tell me wich sub-question the final credence is most sensitive to, and what evidence or argument would move it the most. I'm at around 0.35, and a friend who works in disability studies is at 0.8 — after you've given your number, say where you think our disagreement most likely lives.
