answer: |-
  ## Eulogy for [Aunt's Name]

  **(Standing at the podium, take a breath. Look at the gathering – acknowledging both family and colleagues.)**

  Good morning. Thank you all for being here to remember and celebrate the life of my aunt, [Aunt's Name]. To us, she was [Aunt's Name] – the sister, the aunt, the neighbor, the friend who brought wit, fierce intelligence, and an unforgettable presence into our lives. She was sharp, sometimes wonderfully blunt, and always deeply engaged with the world and the people around her. She loved fiercely, argued passionately, and saw the world – especially its art and its emotions – with a clarity that was uniquely hers.

  For many of you here – her colleagues and students – you knew her brilliant mind. You wrestled alongside her with ideas that shape how we understand ourselves. For thirty years, she grappled with a puzzle that fascinated her: why does a story, a painting, a piece of music, something we *know* isn't real, have the power to make us feel so *truly*? Why do we weep for Anna Karenina? Why does our heart pound, genuinely pound, in a dark theatre watching a horror film? Why do we feel *real* dread when we know the monster isn’t actually there?

  The standard answer, the one she spent her career thoughtfully, relentlessly pushing back against, was that these are somehow "lesser" emotions. "Quasi-emotions." Pretend feelings. Because, the argument went, real fear makes you run. Real grief makes you reach out. Real emotions need belief and action.

  **[Aunt's Name] thought this was profoundly wrong.** Not just academically wrong, but *humanly* wrong.

  She insisted that the tears shed for a fictional character, the chill down your spine watching a ghost story, the surge of joy at a fictional triumph – these aren't pretend. They are the genuine article. The feeling *is* the feeling. The fact that we don't jump out of our cinema seat to flee the axe-murderer doesn't make the terror less real in that moment; it just means that engaging deeply with a story temporarily shifts something inside us. It asks us to hold the feeling, fully, *without* the usual impulse to act. The emotion itself remains intact, authentic, and powerful. It’s a testament to the incredible capacity of art – and of our own hearts – to make the imagined resonate with the force of truth.

  **(Shift focus, encompassing the whole room)**

  And this… this was how [Aunt's Name] approached the world. Not just in her study, but in her life. She understood that feeling deeply *is* the reality. That the authenticity of an emotion isn't diminished by its context, but illuminated by it.

  **(Address the grief directly)**

  Which brings us here. To this moment of profound loss. We *know*, rationally, intellectually, that [Aunt's Name] is gone. The finality is stark, undeniable. And yet… and yet, the feeling of her absence is overwhelming. The grief is heavy, sharp, undeniable. According to that old logic she argued against, maybe this grief should feel different too? Less real? Because we can't act on it in the ways we desperately want to. We can't call her, argue with her about the latest exhibit, share a ridiculous joke, or ask for her advice. That action system is suspended.

  But just as she taught us about the art we love, she would tell us, fiercely, that this grief is **not** a "quasi-emotion." The love we feel for her, the ache of her absence, the memories that flood in – these are entirely, devastatingly real. The fact that we cannot change this reality, that we cannot act to bring her back, doesn't make the feeling any less genuine, any less valid, any less a testament to who she was and what she meant to us. It simply means we are holding this immense, real emotion within the unchangeable context of loss. We are feeling it fully, even when there is no action left to take but to remember, to mourn, and eventually, to carry her forward.

  **(Conclude with warmth and connection)**

  So, today, as we remember [Aunt's Name], let's honor her by feeling fully. Let the tears come if they need to. Let the laughter ring out when we recall her sharp wit or her infectious enthusiasm for a beautiful line of poetry or a perfectly composed frame. Let the complex tapestry of sorrow, love, admiration, and even frustration (because she could certainly be frustrating!) wash over us. Don't question the reality of what you feel for her now, just as she never questioned the reality of what art made her feel.

  She spent her life defending the depth and authenticity of our emotional responses to the worlds we create and inhabit. Let us now honor her by embracing the depth and authenticity of our emotional response to *her* world, the one she illuminated for us, and the immense space she leaves within ours. Her absence is a real wound. Our love for her is the real, enduring force that binds us here today and will continue to bind us as we carry her spirit forward.

  Thank you, [Aunt's Name], for teaching us to feel truly. We miss you, fiercely and completely.
