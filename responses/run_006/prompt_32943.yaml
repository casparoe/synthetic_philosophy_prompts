prompt: |-
  I've been thinking about David Lewis's account of conventions as solutions to coordination problems. As I understand it, a convention is a regularity in behaviour that everyone follows because everyone expects everyone else to follow it, and there is at least one alternative regularity that would have served the same purpose — driving on the left rather than the right being the standard example. Lately I have been trying to see whether moral norms fit this picture. Take the practice of promising. We keep our promises partly because we expect others to keep theirs — if promising broke down as a social practice, it would be pointless to keep promises unilaterally. And promising seems arbitrary in the sense that different societies could have different conventions around what counts as a binding commitment. So promising looks like a Lewis-style convention. But if that is right, then the obligation to keep a promise is just a matter of mutual expectations and could have been otherwise — which seems to drain promising of any genuine moral force. Have I correctly applied Lewis's framework, or am I missing something about what makes a convention a convention in his sense? Please keep your answer to one paragraph of no more than 300 words.
reasoning: |-
  Okay, the user is exploring David Lewis's theory of conventions and applying it to moral norms like promising. They see a conflict: if promising is just a convention based on mutual expectations, then moral obligation seems arbitrary. 

  First, I need to confirm their understanding of Lewis is correct. Yes, conventions solve coordination problems through mutual expectations and have alternatives (like driving sides). Promising fits this: mutual expectations sustain it, and forms of commitment could vary culturally. 

  But the real tension is between conventionality and moral force. The user worries that reducing promising to convention makes obligations arbitrary. Here's where Lewis's framework might be incomplete for morality. Conventions explain how practices emerge, not why we feel moral obligations. Even conventional practices can develop intrinsic moral weight over time. 

  I should emphasize that Lewis's model describes functionality, not moral justification. The "could be otherwise" point highlights contingency, but doesn't negate that real obligations emerge from socially embedded practices. The user's insight is valid, but the apparent conflict arises from conflating descriptive origins with normative force. 

  Must keep this concise - one paragraph under 300 words. Focus on affirming their application while distinguishing convention's explanatory role from moral philosophy's domain. Avoid jargon, but acknowledge the sophistication of their question.
answer: |-
  You've correctly applied Lewis's framework to promising: it exhibits the core features—a self-sustaining regularity (keeping promises) rooted in mutual expectations, solving a coordination problem (enabling trust and cooperation), with conceivable alternatives (e.g., different binding rituals or no practice at all). However, concluding that this *necessarily* drains promising of genuine moral force conflates Lewis's descriptive account of conventions with the normative source of moral obligations. Lewis explains *how* conventions like promising emerge and persist functionally, not whether they *should* be followed or possess intrinsic moral weight. The "could have been otherwise" aspect highlights contingency in the practice's *form*, not necessarily in the underlying moral *value* it serves (e.g., fidelity or trust). Moral realists could argue the convention *instantiates* a deeper, non-conventional obligation to keep commitments, while others might see the moral obligation as *constituted* by the social practice itself. Lewis's model shows promising relies on expectations, but whether this makes the obligation *merely* conventional, rather than robustly moral, depends on further ethical arguments beyond his analysis of conventions.

