prompt: |-
  I've been trying to work out my actual view about when it is worth acquiring information, and I keep finding that my verdicts on concrete cases do not line up neatly with the decision-theoretic result I was taught, Good's theorem, which I understand as saying that a rational expected-utility maximizer should never turn down costless information, since she can always ignore it. Here are the verdicts I find myself with.

  (1) Before deciding whether to hold an outdoor event tomorrow, I would gladly pay a few dollars for an accurate weather forecast. (2) I would not pay for a diagnostic test whose result could not change my treatment either way, even though it is accurate information about my body. (3) I would pay to prevent a genetic test for an untreatable condition from being performed, not merely decline to receive its result, because the existence of a known-but-unseen result would itself make me anxious. (4) I would pay a little to learn which of two well-supported accounts of some historical event is correct, even though no decision in my life depends on it. (5) I would pay to keep a noisy but relevant statistic out of my hands when I know I will overweight it in a decision. (6) I would pay not to learn how a magic trick is done, because the knowledge would permanently ruin my enjoyment of the trick, even though no decision depends on knowing it. (7) I would pay to learn the history of a building I pass every day, because it would make the walk more enjoyable, again with no decision at stake. (8) A forecast that would change my investment position, and that I trust myself to use correctly, is worth a fair amount to me. (9) But the very same forecast, if I knew I would use it to over-trade despite my best intentions, I would pay to have withheld, even though it would be valuable to a more disciplined investor.

  My working principle is something like this: information is worth acquiring when the expected improvement in the outcomes of my decisions, plus the value of the resulting belief state itself, minus the costs of obtaining and processing it, is positive. But that feels like a list wearing a formula's clothes, and I am not sure it handles the cases where the information changes what I will enjoy rather than merely what I will do.

  Is there one principled way to state what all these verdicts have in common, or do some of them have to go? Please state the principle precisely, tie each clause to the cases that motivate it, say what it predicts about cases I have not mentioned—for example, a piece of information that would change my preferences in a way I cannot currently evaluate, a test whose result has only a tiny chance of changing a life-or-death decision, and a piece of information about a decision that will in fact be made by someone else who will not listen to me—and be honest about which of my verdicts it cannot accommodate.
reasoning: |-
  Hmm, the user is grappling with the tension between Good's theorem (which says rational agents should always accept free information) and their intuitive judgments about when information is valuable. They've listed nine concrete cases where their intuition conflicts with the theorem, and they want a unified principle that explains all these cases while being decision-theoretically sound.

  Let me analyze each of their cases first:
  (1) Weather forecast for event planning - clear instrumental value for decision-making
  (2) Useless diagnostic test - no decision impact, so no value
  (3) Genetic test for untreatable condition - information causes direct disutility (anxiety)
  (4) Historical curiosity - pure epistemic value
  (5) Noisy statistic with known self-control issues - information causes behavioral harm
  (6) Magic trick revelation - information destroys hedonic value
  (7) Building history - information creates hedonic value
  (8) Useful financial forecast - high instrumental value
  (9) Same forecast with self-control issues - instrumental value but with behavioral cost

  The common thread seems to be that information has three types of effects: instrumental (affecting decisions), hedonic (affecting emotional states directly), and behavioral (affecting how we act regardless of content). Good's theorem only considers the first.

  For a unified principle, I should probably define a utility function that includes both instrumental outcomes and belief states. The key insight is that beliefs themselves enter the utility function, not just as inputs to decisions. This explains cases like (3), (4), (6), and (7) where no decisions are involved but utility changes.

  The self-control cases (5) and (9) require modeling information as potentially changing action sets or introducing behavioral costs. This suggests we need to consider how information affects our choice architecture, not just the choices themselves.

  For unmentioned cases: 
  - Information changing preferences: should be evaluated based on whether we approve of the preference change
  - Low-probability life-saving test: value would be small but positive if costless
  - Information about others' decisions: only valuable if it affects something we control or care about directly

  The only case my principle might struggle with is (3) - paying to prevent the test entirely. But if we consider that the mere knowledge of the test's existence could cause anxiety, it still fits.

  I should present this as a utility transformation: U(beliefs, outcomes) rather than just U(outcomes). That neatly captures both instrumental and non-instrumental values while remaining within decision theory.
answer: |-
  Your intuitions reveal a richer relationship between information and value than Good's theorem captures. Good's theorem assumes information only affects utility *through its instrumental role in improving decisions*, and that processing is costless and belief-updating is perfect. Your cases violate these assumptions by introducing **belief-dependent utility**, **processing costs**, and **cognitive imperfections**. Here’s a unified principle that explains all your verdicts:

  ---

  ### **The Principle of Instrumental, Hedonic, and Behavioral Net Information Value**
  Information is worth acquiring if and only if:  
  **E[U(B_new, A_new) - U(B_old, A_old) | info] - C_processing - C_acquisition > 0**  
  where:  
  - **U(B, A)** is your utility function, which depends on:  
    - **B**: Your *belief state* (including anxiety, curiosity, enjoyment).  
    - **A**: The *outcomes of actions* you take (e.g., rain-soaked event, medical outcomes).  
  - **E[U(B_new, A_new) | info]**: Expected utility after updating beliefs *and* actions using the information.  
  - **E[U(B_old, A_old) | info]**: Expected utility if you *somehow avoided using the information* (even if known).  
  - **C_processing**: Cognitive/emotional costs of receiving/updating beliefs (e.g., anxiety, attention).  
  - **C_acquisition**: Cost to obtain the information.  

  ---

  ### **How This Explains Your Cases**
  1. **Weather forecast (Case 1 & 8)**:  
     - *Instrumental value*: Improves decision (cancel/reschedule), raising **A**.  
     - *Hedonic/behavioral*: Minimal **C_processing** or **B** impact.  
     → High net value.  

  2. **Useless diagnostic test (Case 2)**:  
     - *Instrumental*: No change to **A** (treatment unchanged).  
     - *Hedonic/behavioral*: No **B** benefit, but **C_processing** >0 (time/stress).  
     → Net value negative.  

  3. **Genetic test for untreatable condition (Case 3)**:  
     - *Instrumental*: No **A** change (no treatment).  
     - *Hedonic/behavioral*: **B** *lowers* utility (anxiety) → E[U(B_new)] < E[U(B_old)].  
     → Net value negative (even if **C_acquisition**=0).  

  4. **Historical curiosity (Case 4)**:  
     - *Instrumental*: No **A** change (no decisions).  
     - *Hedonic/behavioral*: **B** *raises* utility (satisfaction) → E[U(B_new)] > E[U(B_old)].  
     → Net value positive.  

  5. **Noisy statistic causing overweighting (Case 5)**:  
     - *Instrumental*: Could raise **A**, but...  
     - *Behavioral*: You *know* you’ll choose worse **A** (overweighting).  
     - *Hedonic*: **C_processing** includes cost of resisting bias.  
     → E[U(A_new)] < E[U(A_old)] → Net value negative.  

  6. **Magic trick secret (Case 6)**:  
     - *Instrumental*: No **A** change.  
     - *Hedonic*: **B** *lowers* utility (ruins enjoyment).  
     → Net value negative.  

  7. **Building history (Case 7)**:  
     - *Instrumental*: No **A** change.  
     - *Hedonic*: **B** *raises* utility (enriches experience).  
     → Net value positive.  

  9. **Self-undermining forecast (Case 9)**:  
     - *Instrumental*: Could raise **A** *if used correctly*.  
     - *Behavioral*: You *know* you’ll misuse it (over-trading), lowering **A**.  
     - *Hedonic*: **C_processing** (stress from impulsivity).  
     → E[U(A_new)] < E[U(A_old)] → Net value negative.  

  ---

  ### **Predictions for New Cases**
  - **Information that changes preferences**:  
    - *Example*: A drug that makes you content with poverty, but you currently value wealth.  
    - *Prediction*: Not worth taking if you disvalue the preference change. **U(B_new)** captures this—if new preferences feel alien, **B_new** lowers utility.  

  - **Test with tiny chance of changing life-or-death decision**:  
    - *Example*: Expensive test with 0.001% chance of revealing a treatable condition.  
    - *Prediction*: Worth it only if [ΔE[U(A)] from tiny chance] > **C_processing** + **C_acquisition**. If costs are low (e.g., blood test), take it; if high (e.g., invasive biopsy), decline.  

  - **Information about someone else’s immutable decision**:  
    - *Example*: Learning how a dictator will act, but you can’t influence it.  
    - *Prediction*: Only valuable if **B** affects utility (e.g., anxiety relief or curiosity). No **A** change → value hinges on hedonic impact.  

  ---

  ### **Which Verdicts Must Go? None—All Are Accommodated**
  The principle explains all 9 cases by:  
  - Expanding utility to include **belief states** (handling Cases 3,4,6,7).  
  - Allowing information to **worsen decisions** due to cognitive flaws (Cases 5,9).  
  - Including **processing costs** (Cases 2,5,9).  
  - Separating the value of information from its mere *existence* (Case 3: it’s not the result but the *knowledge* that harms).  

  ---

  ### **Why Good’s Theorem Fails Here**
  Good’s theorem assumes:  
  1. Utility depends *only* on actions/outcomes (**U(A)**, not **U(B,A)**).  
  2. You can costlessly ignore information.  
  3. Belief updating is rational.  
  Your cases violate all three:  
  - Beliefs directly affect utility (e.g., anxiety, curiosity).  
  - You *can’t* ignore known information (Cases 3,5,9).  
  - You *misuse* information due to cognitive biases (Cases 5,9).  

  ---

  ### **Key Insight**
  Information isn’t neutral—it reshapes your mental landscape and behavior in ways that can *intrinsically* help or hurt. The principle formalizes this by making utility **belief-dependent** and accounting for **how information is used** (not just its content). This is consistent with modern decision theory (e.g., "information value" in Bayesian networks with endogenous beliefs) and behavioral economics. If you insist on strict Good-style rationality, Cases 3,5,6,7,9 must be rejected—but your intuitions suggest they reflect real human values worth preserving.
