  Okay here's what I want: your actual credence that, in Dennett's careenium thought experiment, the higher-level patterns (the "symbols," the traffic jams, the macro regularities) genuinely push the substrate around — i.e., they have real downward causal power over the trajectories of individual simmballs, and aren't just a convenient compression of what the simmballs were gonna do anyway.

  Decompose the number. I want terms for at least: (a) whether you think "real" causation requires something over and above reliable counterfactual dependence, (b) whether multiple realizability actually blocks downward causation or just redescribes it, and (c) whether the careenium is a fair toy model of what's going on with real minds and brains — or whether it smuggles in a conclusion by making the simmballs too simple. Add whatever other terms you think belong. Give each a probability, explain how they combine, and then tell me which subquestion your final number is most sensitive to: if you could get the answer to just one of them, which would move your credence the most?
