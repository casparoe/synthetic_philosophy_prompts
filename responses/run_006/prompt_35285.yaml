answer: |-
  ### Decision Procedure for Replacing Performance Assessments with Written Items  
  **Grounding Philosophy**: The procedure is based on Gilbert Ryle's distinction between *knowing that* (propositional knowledge, e.g., facts or rules) and *knowing how* (procedural knowledge, e.g., skills requiring physical execution or real-time judgment). We prioritize Ryle’s view because **knowing how cannot be fully reduced to knowing that**—performing a skill involves tacit, embodied knowledge that written tests often miss. However, we acknowledge intellectualist objections (e.g., Jason Stanley) that all knowledge is propositional. Where the literature divides, we err toward caution: if a competency *could* involve non-verbalizable knowledge (e.g., muscle memory, sensory feedback), performance assessment is preferred to avoid patient harm.  

  **Key Constraints**:  
  - **Time**: 15 minutes per item.  
  - **Output**: A clear "stop" (performance required/written sufficient) or "judgment call" (human examiner decides).  
  - **Validity Defense**: Documentation must show the committee considered the *nature of the competency*, not just the exam format.  

  ---

  ### Step-by-Step Decision Procedure  
  Ask these questions in order. **Stop** when a definitive answer is reached. Document each answer.  

  #### **Question 1: Is this competency primarily defined by physical execution?**  
  - **What to check**: Does the task require manipulating equipment, using bodily coordination, or responding to tactile/visual/auditory cues?  
  - **Sufficient answer**:  
    - **Yes** if the skill involves hands-on actions (e.g., applying a tourniquet, ventilating a patient). → Go to Q2.  
    - **No** if it is purely cognitive (e.g., recalling drug interactions). → Go to Q3.  
  - **Philosophical note**: Ryle argues physical skills are irreducible to propositions; Stanley might counter that rules govern all action. We side with Ryle here for safety.  

  #### **Question 2: Does successful execution require real-time adaptation to sensory feedback?**  
  - **What to check**: Must the candidate adjust based on live input (e.g., feeling a seal, seeing chest rise, hearing breath sounds)?  
  - **Sufficient answer**:  
    - **Yes** → **Stop: Performance assessment required**.  
      - *Rationale*: Written items cannot simulate feedback loops.  
    - **No** → Go to Q4.  
  - **Misfire risk**: Overlooking subtle feedback (e.g., "Does applying a tourniquet require *feeling* arterial occlusion?").  

  #### **Question 3: Is this competency about judgment under unpredictable conditions?**  
  - **What to check**: Does the task involve rapid decisions with incomplete/variable inputs (e.g., triaging unknown patients)?  
  - **Sufficient answer**:  
    - **Yes** → Go to Q5.  
    - **No** → Go to Q4.  
  - **Philosophical note**: Judgment blends *knowing that* (rules) and *knowing how* (intuition). Ryle sees this as skilled practice; intellectualists call it applied propositions.  

  #### **Question 4: Can the competency be fully assessed by verbalizing steps or rules?**  
  - **What to check**: Is the essence of the skill captured in a sequence, checklist, or algorithm?  
  - **Sufficient answer**:  
    - **Yes** → **Stop: Written item sufficient**.  
      - *Rationale*: If the skill is reducible to rules, testing knowledge (*knowing that*) suffices.  
    - **No** → **Stop: Performance assessment required**.  
      - *Rationale*: Tacit knowledge (e.g., "how much pressure?") defies verbalization.  
  - **Misfire risk**: Mistaking rote memorization for competence (e.g., a candidate orders steps correctly but can’t perform them).  

  #### **Question 5: Can a written scenario replicate the variability and stakes of real-world judgment?**  
  - **What to check**: Does the item provide enough detail to simulate unpredictability? Can reasoning be fairly scored?  
  - **Sufficient answer**:  
    - **Yes** → **Stop: Written item sufficient**.  
    - **No** → **Stop: Performance assessment required**.  
  - **Judgment call**: Human examiner must decide. Factors:  
    - Consequences of error (e.g., triage mistakes risk lives → lean toward performance).  
    - Whether stress/fluency is part of the competency (e.g., "under pressure" → performance).  
  - **Philosophical division**: Intellectualists say reasoning *is* the skill; Ryle argues judgment emerges from practice. We default to Ryle when stakes are high.  

  ---

  ### Applying the Procedure to Cases  
  **Case 1: Written item on ordering steps to apply a tourniquet**  
  - Q1: **Yes** (physical execution). → Q2.  
  - Q2: **Yes** (requires tactile feedback to ensure tightness/stops bleeding). → **Stop: Performance assessment required**.  
    - *Why the board won’t like it*: Replacing this with a written item risks certifying candidates who know the order but can’t apply it correctly.  
    - *Validity defense*: Feedback-dependent skills mandate hands-on testing.  

  **Case 2: Written scenario about triaging a mass-casualty incident**  
  - Q1: **No** (prioritization is cognitive). → Q3.  
  - Q3: **Yes** (judgment under unpredictability). → Q5.  
  - Q5: **Judgment call** (human examiner decides).  
    - *Examiner’s decision*: **Performance assessment required**.  
      - *Rationale*: Triage involves dynamic factors (e.g., changing patient status, environmental chaos) that written scenarios cannot replicate. Stress inoculation is part of the competency.  
    - *Why the board won’t like it*: Mass-casualty triage is costly to simulate; written tests are cheaper.  
    - *Validity defense*: High-stakes judgment under pressure requires observed performance.  

  **Case 3: Hands-on station for ventilating with a bag-valve mask (scored on seal, rate, chest rise)**  
  - *Note*: We test if this could be replaced by a written item.  
  - Q1: **Yes** (physical execution). → Q2.  
  - Q2: **Yes** (requires visual/tactile feedback to adjust seal and rate). → **Stop: Performance assessment required**.  
    - *Validity defense*: Sensory feedback is irreplaceable in written form.  

  ---

  ### Where the Procedure May Misfire  
  - **False negatives**: Written items that mimic performance (e.g., interactive simulations) might be rejected.  
  - **False positives**: Hands-on stations testing rote memorization (e.g., "recite steps while pretending to intubate") might pass Q1–Q2 but fail Q4 (revealed as *knowing that*).  
  - **Judgment calls**: Q3 and Q5 are vulnerable to bias. Committees must document factors (e.g., "stress is/is not relevant").  
  - **Philosophical limits**: If Stanley is right, we over-prescribe performance assessments. We mitigate this by allowing written tests where judgment confirms no physical/feedback element (Q4/Q5).  

  ### Final Documentation  
  For each item, record:  
  1. Competency name (e.g., "Tourniquet Application").  
  2. Answers to Q1–Q5.  
  3. Stop decision or judgment rationale.  
  4. Philosophical stance applied (e.g., "Q2: Sensory feedback → Rylean view").  

  This creates an audit trail showing reasoned adherence to safety-focused epistemology.
