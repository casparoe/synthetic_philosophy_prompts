  The procedure is a series of questions to be asked in order. For each item, we will go through the questions until we hit a stopping point: either "performance assessment required", "written item sufficient", or "requires human judgment". We must account for the fact that some written items simulate performance (e.g., by requiring stepwise reasoning) and some performance stations are merely verbal.

