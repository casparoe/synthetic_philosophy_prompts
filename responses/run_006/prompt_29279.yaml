answer: |-
  Here is a structured analysis of desiderata for a solution to the Frege-Geach problem, designed to highlight conceptual tensions and dialectical burdens. Desiderata are categorized by their source (logical, semantic, psychological, dialectical) and assessed for negotiability and conflicts.

  ---

  ### **I. Core Problem Specification**  
  *What the problem itself demands*

  1. **Embedding Phenomena (Non-Negotiable)**  
     *Motivation*: Moral sentences ("Stealing is wrong") appear in non-assertoric contexts (conditionals, questions, negation: "If stealing is wrong, then deceiving is wrong").  
     *Status*: Non-negotiable. Any solution must explain how *unasserted* moral clauses contribute to meaning.  

  2. **Logic Preservation (Non-Negotiable)**  
     *Motivation*: Moral arguments (e.g., modus ponens with moral premises) are intuitively valid. Solution must explain validity without ad hoc rules.  
     *Status*: Non-negotiable. Failure here collapses expressivism into logical revisionism.  
     **Conflict Alert**: Tensions with **Non-Propositionalism** (II.4) and **Compositionality** (II.1). Standard logic assumes propositional content; expressivists must reconstruct validity from attitudes.

  ---

  ### **II. Semantic Requirements**  
  *Constraints from philosophy of language*

  3. **Compositionality (Non-Negotiable)**  
     *Motivation*: The meaning of complex sentences (e.g., conditionals) is determined by parts + structure.  
     *Status*: Non-negotiable. Rejected only by semantic nihilism.  
     **Conflict Alert**: Expressivism’s starting point (moral sentences express attitudes) struggles with compositional derivation of complex content.  

  4. **Truth-Aptness / Semantic Uniformity (Conditionally Negotiable)**  
     *Motivation*: Moral sentences behave like truth-apt assertions (e.g., embed under "believes that", appear in tautologies).  
     *Status*:  
     - *Non-negotiable* for **minimalist** expressivists (Blackburn, Gibbard).  
     - *Negotiable* for **revolutionary** expressivists (early Hare) who deny moral truth-aptness.  
     **Conflict Alert**: Accepting minimal truth conflicts with **Non-Factualism** (IV.1).  

  ---

  ### **III. Psychological Constraints**  
  *Ties to expressivism’s core commitment*

  5. **Attitude Expression in Assertion (Non-Negotiable)**  
     *Motivation*: Atomic moral assertions (e.g., "Lying is wrong") express conative attitudes (disapproval, plans) rather than beliefs.  
     *Status*: Non-negotiable. Defines expressivism.  

  6. **Attitude Preservation in Embedding (Negotiable)**  
     *Motivation*: If "Lying is wrong" expresses disapproval, "If lying is wrong..." must preserve a related attitude.  
     *Status*: *Negotiable*. Some solutions (Schroeder) decouple attitude expression from compositional semantics. Critics (Unwin) insist on continuity.  

  ---

  ### **IV. Dialectical Burdens**  
  *Expressivism’s metaethical commitments*

  7. **Non-Factualism (Non-Negotiable)**  
     *Motivation*: Expressivism opposes moral realism; moral judgments aren’t representations of mind-independent facts.  
     *Status*: Non-negotiable. Core anti-realist commitment.  
     **Conflict Alert**: Collides with **Truth-Aptness** (II.4) if minimalism is rejected.  

  8. **Distinctiveness from Descriptivism (Negotiable)**  
     *Motivation*: Solution shouldn’t reduce to covert realism/cognitivism (e.g., "attitudes" becoming propositions).  
     *Status*: *Negotiable* for hybrid expressivists (Ridge); *non-negotiable* for pure expressivists (Blackburn).  

  ---

  ### **V. Metasemantic & Implementation Challenges**  
  *Theoretical feasibility*

  9. **Psychological Plausibility (Negotiable)**  
     *Motivation*: Proposed attitudes for complex sentences (e.g., "conditional disapproval") must be cognitively realistic.  
     *Status*: *Negotiable* but critical for naturalistic expressivists (Gibbard).  

  10. **Formal Tractability (Non-Negotiable)**  
      *Motivation*: Solution must be regimentable in a semantic/logical system (e.g., model theory for moral language).  
      *Status*: Non-negotiable for dialectical adequacy.  
      **Conflict Alert**: **Compositionality** (II.1) + **Logic Preservation** (I.2) + **Non-Propositionalism** (II.4) create a **trilemma**. Standard formal tools require propositional inputs.  

  ---

  ### **VI. Key Tensions & Unsatisfiable Pairs**  
  *Where desiderata clash*

  - **The Central Trilemma**:  
    **Compositionality** + **Logic Preservation** + **Non-Propositionalism**  
    *Conflict*: Standard semantics composes propositions for logic. Expressivism needs non-propositional attitudes to explain moral content while preserving logic.  
    *Result*: Most solutions sacrifice one:  
    - *Blackburn* (QE): Stretches logic preservation via possible worlds.  
    - *Schroeder* (BMP): Treats attitudes as propositional (abandoning pure non-propositionalism).  
    - *Early Gibbard*: Complex attitudes threaten compositionality.  

  - **Truth-Aptness** vs. **Non-Factualism**:  
    Minimalists (Blackburn) adopt deflationary truth to satisfy both; error theorists (Joyce) reject truth-aptness.  

  - **Attitude Preservation** vs. **Compositionality**:  
    If "if P, Q" expresses a complex attitude (e.g., "disapproving of disapproving P but not Q"), composition becomes intractable (Unwin’s objection).  

  ---

  ### **Most Exclusionary Desideratum: Logic Preservation**  
  *Why it rules out the most solutions*  

  **Logic Preservation** (I.2) eliminates:  
  - **Simple Attitude Expressivism** (Ayer, early Stevenson): Cannot explain why "If stealing is wrong, then murder is wrong" isn’t equivalent to "If I disapprove of stealing, I disapprove of murder" (embedding fallacy).  
  - **Non-Cognitivist Formalism** (Hare’s early prescriptivism): Fails to validate mixed inferences (e.g., factual + moral premises).  
  - **Relativist/Contextualist Workarounds**: Often violate universal validity of moral logic.  

  **Reason**: Solutions that don’t assign logically composable content to embedded clauses cannot recover standard inference rules (modus ponens, negation elimination) for moral language. This forces either revisionism or abandonment of expressivism.

  ---

  This framework shows why the Frege-Geach problem remains pivotal: it’s a stress test for expressivism’s ability to reconcile *logic* with *psychology* and *anti-realism* with *linguistic practice*. The deepest tension lies between the **compositional demands of logic** and the **non-propositional nature of moral attitudes**. Solutions that resolve this (e.g., Gibbard’s plan-laden worlds, Schroeder’s being-for) redefine expressivism’s boundaries, often at the cost of theoretical simplicity or psychological fidelity.
