  Alright, I need help with an argument that's been bugging me. I'm a grad student in philosophy and I've been going back and forth on this for weeks. You're an expert on practical rationality and Parfit — please think through this carefully, maybe start by laying out what you take the standard positions to be before diagnosing anything.

  So here's the deal. My friend is writing a paper that basically says: if you buy Parfit's hitchhiker case, you're on a slippery slope to thinking you should take a pill that makes you believe whatever makes you happiest. His argument goes like this:

  (1) In the hitchhiker case, your stranded in the desert, a driver offers to rescue you if you promise to pay him once you reach town, and you know that once you're safe, paying is pure loss — a perfectly rational agent at that moment would stiff him. But you can still rationally form a disposition, before getting in the car, to be the kind of person who pays. The disposition pays off because the driver can detect it (or at least you can make it detectable) and picks you up.

  (2) So: it can be rational to adopt a disposition that will later cause you to act irrationally by the lights of your moment-of-choice interests, when the disposition as a whole has better expected consequences than not having it.

  (3) This principle generalizes. For any disposition D, if having D would lead to better outcomes overall than lacking D, it's rational to adopt D — even if D later causes you to act against your interests in particular cases.

  (4) Now take a disposition like: "believe whatever makes you happiest, so long as the belief doesn't cause you to take any harmful actions." Call it Pollyanna. Having Pollyanna would, by definition, make you happier, and by stipulation it doesn't cause harmful actions. So by (3), it's rational to adopt Pollyanna.

  (5) If it's rational to adopt Pollyanna, then it's rational to believe things on the basis of how they make you feel rather than on the basis of evidence. Epistemic rationality just collapses into practical rationality — it has no independent claim on us.

  (6) But that's nuts. You can't rationally believe you're a secret genius just because it feels nice, even if somehow the belief never leads to any bad decisions. Epistemic rationality isn't just a tool for feeling good.

  (7) So something is wrong. Either the hitchhiker case doesn't actually work (deny 1), or the generalization in (3) is too quick, or (4) sneaks something past us, or maybe (6) is false and we just have to bite the bullet.

  My instinct is to reject (3) — I think there's a difference between practical dispositions (like being a promise-keeper) and doxastic ones (like Pollyanna), and the hitchhiker reasoning only works for the first kind. But my friend says that's just special pleading unless I can say what the difference is. And if I try to say the difference is that beliefs "aim at truth," he asks whether that's a constitutive claim about the nature of belief or a normative claim about how we ought to form beliefs — and if it's normative, why can't practical considerations override it the same way they override the norm of "maximize expected utility at each choice point" in the hitchhiker case?

  So yeah. Where does this argument actually go wrong? Give me your best diagnosis. And if you think multiple steps are problematic, tell me which one you'd give up first and what the philosophical cost is.
