prompt: |-
  I chair the prioritisation committee of a regional health authority. Two of our five localities currently receive a specialist pain-management programme that we cannot, within this budget cycle, extend to the other three. A proposal before the committee would withdraw the programme from the two localities that have it, on the ground that unequal access to relief is itself an injustice and that retaining the programme merely because it benefits some patients would entrench an unfair pattern; the freed resources would not be redeployed to the other three localities, and no alternative patient-facing use for them has been identified. Opponents reply that this would make some patients worse off and no one better off, and that removing a benefit without transferring it cannot make a distribution fairer. Half the committee regard the proposal as perverse, and half regard it as principled. Draft the committee's decision memo — recommend withdrawal, retention, or retention with conditions — with a clear course of action and time frame, and engage seriously with the strongest consideration on the losing side.
reasoning: |-
  Okay, the user is chairing a prioritisation committee for a regional health authority. They're facing a tough ethical dilemma about a specialist pain-management programme. Currently, only two out of five localities have this programme. Due to budget constraints, they can't extend it to the other three this cycle. 

  There's a proposal to withdraw the programme entirely from the two benefiting localities, arguing that unequal access is unjust and keeping it would entrench unfairness. The freed resources wouldn't be redirected elsewhere—they'd just be unallocated. The opponents say this makes some patients worse off without helping anyone, and that removing a benefit doesn't make distribution fairer. 

  The committee is split down the middle—half see this as perverse, half as principled. The user needs me to draft a decision memo recommending withdrawal, retention, or retention with conditions. It must include a clear action plan and timeline, and seriously address the strongest argument from the losing side.

  First, I need to unpack the ethical tension here. The core conflict is between equity and harm minimization. The proposal's supporters are using a "leveling down" argument from distributive justice—they'd rather eliminate an unequal good than tolerate unfair access. But opponents are grounded in consequentialism—withdrawing actively harms real patients without creating offsetting gains. 

  Hmm... the fact that resources won't be redeployed is critical. If the savings were funding something else, this might be different. But as is, it's pure loss for current beneficiaries. That makes the proposal harder to justify ethically. Still, I shouldn't dismiss the equity concern—it's valid that systemic unfairness erodes trust in the health system.

  The committee split suggests both sides have merit. A compromise might be wisest. Outright withdrawal seems too harsh given the harm, but retaining the status quo ignores legitimate fairness concerns. What if we keep the programme but impose conditions? Specifically, mandate that the next budget cycle must address expansion or redistribution—with consequences if not. 

  For the memo structure: start with a recommendation (retention with conditions), outline actions (retain programme + binding review timeline), and deeply engage the losing side's best point—that leveling down without benefit transfer doesn't achieve real fairness. I should acknowledge their principled stance while explaining why immediate withdrawal crosses an ethical line.

  Timeline is practical: retain until March 31st (end of cycle), require review by October 15th, implement changes by next April. This gives time to develop alternatives without abandoning current patients. 

  Key phrases to include: "immediate harm" vs. "systemic equity," "bridge solution," "unacceptable to render patients worse off without compensatory gain." Must show I've truly wrestled with both perspectives—this isn't just splitting the difference.
answer: |-
  ## Decision Memorandum: Specialist Pain-Management Programme Access  

  **To:** Prioritisation Committee Members  
  **From:** Chair, Regional Health Authority Prioritisation Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Specialist Pain-Management Programme Continuity  

  ### 1. Recommendation  
  **Retain the specialist pain-management programme in the two current localities until the end of this budget cycle (March 31, 2024), conditional upon an expedited equity review.** Resources will not be withdrawn at this time, but the programme must undergo a binding reassessment by October 15, 2024, to determine its future structure, prioritising equitable regional access in the next budget cycle.  

  ### 2. Course of Action & Time Frame  
  - **Immediate Action (November 2023):** Programme continues unchanged in current localities.  
  - **Equity Review Launch (December 2023):** Establish a cross-locality working group (including patient advocates, clinicians, and ethicists) to evaluate:  
    - Cost-effectiveness of scaling the programme regionally.  
    - Alternative delivery models (e.g., telehealth, hub-and-spoke).  
    - Potential for phased expansion using reallocated funds.  
  - **Review Deadline (October 15, 2024):** Working group submits recommendations for FY2025/26 budget.  
  - **Final Decision (November 2024):** Committee mandates either:  
    - **Expansion plan** using freed resources + new funding, or  
    - **Redistribution plan** ensuring no locality retains exclusive access without a pathway to equity.  
  - **Contingency:** Failure to agree on an equitable solution by November 2024 triggers automatic programme suspension until one is adopted.  

  ### 3. Rationale for Retention (with Conditions)  
  The committee acknowledges the profound tension between two compelling principles:  
  - **The injustice of unequal access** to a clinically significant service.  
  - **The imperative to avoid actively harming patients** without offsetting benefit.  

  **Withdrawal now is ethically untenable** as it worsens outcomes for existing patients without improving access elsewhere, violating the healthcare principle of "first, do no harm." The proposal’s core equity argument—that eliminating an unfair advantage constitutes progress—fails when the "leveling down" creates net suffering and no compensatory gain. Resources left unallocated cannot remedy the initial inequity; they merely compound it with tangible loss.  

  **However, retaining the status quo indefinitely is equally indefensible.** Perpetuating a lottery of access based on historical provision entrenches a two-tier system that undermines public trust and violates distributive justice. The strongest argument for withdrawal—that fairness requires eliminating unjustifiable disparities—rightly demands urgent redress.  

  **Our conditional retention balances these imperatives:**  
  - It prevents immediate, irreversible harm to current beneficiaries.  
  - It forces concrete, time-bound action to resolve the underlying inequity.  
  - It commits the committee to redesign or reallocate the programme by 2025, ensuring no locality is permanently disadvantaged.  

  ### 4. Engagement with the Losing Side’s Strongest Argument  
  **We take seriously the principled view that retaining the programme entrenches unfairness.** Proponents of withdrawal correctly assert that passively accepting inequity normalises injustice and betrays our duty to equitable care. Their argument that partial provision is morally corrosive—and that withdrawal forces a necessary reckoning—reflects a courageous commitment to systemic fairness.  

  **However, justice must be restorative, not punitive.** Removing care from marginalised pain patients (who bear no responsibility for the geographic disparity) sacrifices their welfare for a symbolic gesture. True fairness requires building *up* access for the excluded, not tearing *down* care for the included. Our conditional approach honours the urgency of the equity argument by mandating redesign, while rejecting collateral harm.  

  ### 5. Conclusion  
  This decision prioritises immediate patient welfare while imposing an enforceable obligation to achieve equity. It rejects both the inertia of the status quo and the false fairness of leveling down. The committee must now pursue solutions that lift all localities toward equitable pain management—without abandoning those currently reliant on it.  

  **Approved by:**  
  Chair, Prioritisation Committee  
  ---  
  *Vote: 3 (Retain with Conditions) | 2 (Withdraw)*  
  *Next Steps: Secretariat to establish Working Group by November 30, 2023.*
