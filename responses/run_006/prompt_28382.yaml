  First, they mention the disagreement with their friend who uses economic discounting—like the 3% rule, which significantly reduces the value of future damages. The user pushed back on that, arguing that future suffering is just as real and that policies affect who will exist. They’re stuck in circular arguments and want clarity. Their explicit request is for the criteria any theory must meet, highlighting conflicts between them, and identifying which requirement rules out popular views.

  The user’s identity seems to be someone engaged in deep ethical discussions, possibly with a philosophy or ethics background, or at least highly informed. They’re frustrated with intuitive arguments and want a structured approach. Their deeper need might be to resolve the moral confusion they feel after the argument, seeking a solid foundation to evaluate different positions without bias. They might also want tools to critically assess economic models that discount future generations.

  I need to brainstorm hard cases they mentioned: non-identity problem (how policies affect who exists), pure time preference (discounting just because time passes), uncertainty about future preferences, indefinite future timeline, catastrophic risks, and present vs. future wealth disparities. Each of these cases will generate specific requirements for a theory. For example, non-identity leads to the requirement that theories shouldn’t be undermined by changing identities.

  The desiderata should include non-negotiable principles like non-vulnerability to non-identity and avoidance of arbitrary time discounting. But I also need to identify tensions, like between non-vulnerability and minimal demandingness—how can we avoid overburdening the present while still ensuring future protection? Another conflict might be between avoiding paralysis from uncertainty and providing concrete guidance.

  I should categorize each desideratum with its rationale and indicate where conflicts arise. The user wants to know which requirements are essential and which might be specific to certain camps. Also, they’re interested in which single requirement rules out many popular views. I suspect that the non-vulnerability to non-identity requirement is crucial here, as it challenges person-affecting theories and some discounting approaches.

  Finally, I need to keep the scorecard of existing theories brief, focusing on how they meet or fail the criteria. Highlighting where theories conflict with key desiderata will help the user see the landscape. Ensuring clarity on non-negotiable vs. negotiable points is essential, and emphasizing the inherent tensions will address their suspicion of contradictions.
answer: |-
  Here is the full specification of desiderata for an adequate account of obligations to future generations, derived from core philosophical puzzles, hard cases, and foundational ethical concerns. I've focused on **non-negotiable conceptual requirements** and **inescapable tensions**, drawing on the cases you mentioned.

  ### I. Non-Negotiable Desiderata (Conceptual Foundations)
  These requirements stem from logical coherence, basic ethical intuitions, and the nature of the problem itself. Failing any of these renders a theory fundamentally inadequate.

  1.  **Non-Vulnerability to the Non-Identity Problem (NIP):**
      *   **The Case:** Climate policies (e.g., slower development reducing emissions) drastically alter the complex causal chains determining which specific individuals are born centuries hence. A policy causing future hardship *also* causes *different people* to exist than a less harmful policy would. Person-affecting views ("we only harm specific individuals") struggle: Can we harm someone by choosing a policy that causes them to exist in a disadvantaged state, compared to *not existing at all*? If not, how *is* the policy wrong?
      *   **Requirement:** The theory must be able to condemn harmful policies (e.g., runaway climate change leading to mass suffering/extinction) *even if* the individuals suffering wouldn't have existed under a less harmful policy. It must provide reasons for action independent of harming specific, identifiable future individuals *qua* those specific individuals.
      *   **Status:** Non-negotiable. Failing this makes ethics impotent against long-term, identity-affecting harms like climate change.

  2.  **Avoidance of Arbitrary Time Discounting:**
      *   **The Case:** Pure Time Preference (discounting *solely* because a harm happens later) applied to fundamental goods like life, basic welfare, or existential security. Why is suffering in 2200 intrinsically "less bad" than identical suffering in 2100, solely because of the date? Discounting future *consumption* based on predicted wealth growth (Ramsey discounting) is economic modeling, not moral justification for discounting core interests.
      *   **Requirement:** The theory must not discount fundamental interests (survival, avoidance of severe suffering, basic capabilities) *simply* because they occur in the future. Justifications for *any* discounting must be based on non-temporal factors (e.g., risk of non-existence, opportunity cost for *present* basic needs, genuine uncertainty about future preferences/context).
      *   **Status:** Non-negotiable. Arbitrary temporal discounting violates core impartiality. It allows sacrificing fundamental future interests for trivial present gains.

  3.  **Robustness to Deep Uncertainty:**
      *   **The Case:** We face radical uncertainty about: (a) *Technological/Social Trajectories* (Will fusion work? Will sustainable societies emerge? Will there be war?); (b) *Future Preferences/Values* (Will they value pristine nature or hyper-urban life? Will their conception of welfare differ?); (c) *Complex System Impacts* (Precise climate sensitivity, tipping points, ecosystem cascades).
      *   **Requirement:** The theory must provide guidance under deep, non-quantifiable uncertainty about the *nature* of the future and *what* future people will value or need. It cannot rely on precise predictions or assumptions of stable preferences/context.
      *   **Status:** Non-negotiable. The real-world context demands it. Theories requiring precise knowledge fail in practice.

  4.  **Avoidance of Paralysis from Indefinite Duration:**
      *   **The Case:** Humanity could persist for millennia, millions, or billions of years (potentially spreading beyond Earth) – or go extinct next century. How do we weigh the near future against the potentially vast number of future beings over deep time? Do we have symmetric obligations to beings 10,000 vs. 1,000,000 years hence? Utilitarian aggregation might demand crippling present sacrifice for an infinite potential future population.
      *   **Requirement:** The theory must provide a non-arbitrary way to consider future generations without being rendered mute by the *possibility* of an indefinite future or collapsing under the weight of potentially infinite future claims. It must avoid both ignoring the long-term and demanding impossible sacrifice for hypothetical distant beings.
      *   **Status:** Non-negotiable. The temporal scale of the problem necessitates a solution.

  ### II. Highly Pressing (Often Contested) Desiderata
  These are widely seen as crucial but involve substantive ethical commitments that different theories resolve differently. Failure here often makes a theory seem deeply counterintuitive or impractical.

  5.  **Avoidance of Repugnant or Overly Demanding Conclusions:**
      *   **The Cases:**
          *   **The Present Poor vs. Future Rich:** Demanding extreme sacrifice (starvation, perpetual poverty) from genuinely deprived present people to prevent minor inconveniences for vastly wealthier future generations.
          *   **Catastrophic Risk:** Requiring immense present cost to avert a tiny probability of human extinction (e.g., 0.001% chance) far in the future.
          *   **Aggregation:** Does saving a vast number of people from minor headaches outweigh saving a smaller number from agonizing deaths?
      *   **Requirement:** The theory must avoid conclusions that demand clearly unreasonable sacrifice from the present (especially the vulnerable present) for the sake of the future, or that prioritize minor aggregate gains over preventing severe, concentrated harms. It must incorporate some notion of *minimal demandingness* or *sufficiency*.
      *   **Status:** Pressing, but *how* to achieve it is contested. Often clashes with strict aggregation.

  6.  **Recognition of the Asymmetry (or Lack Thereof):**
      *   **The Case:** Do we have stronger obligations to prevent future suffering than to bring about future happiness or existence? Is creating new people with lives worth living a moral duty, neutral, or something else? Does the mere possibility of future people create claims?
      *   **Requirement:** The theory must take a coherent stance on whether our primary duty is to prevent harm to whoever might exist (harm-focused) or to promote the existence and welfare of future people (benefit-focused), and how potential vs. actual future people factor in. This interacts heavily with the NIP.
      *   **Status:** Pressing. Deeply affects policy scope (e.g., focus on preventing catastrophe vs. optimizing long-term flourishing).

  7.  **Provision of Action-Guidance:**
      *   **The Case:** Faced with complex climate policy choices involving immediate costs, delayed benefits, deep uncertainty, and distributional effects, how should we actually decide? What does the theory tell policymakers *to do*?
      *   **Requirement:** The theory must ultimately translate its principles into usable, non-paralyzing guidance for real-world decision-making under uncertainty. It cannot be purely abstract.
      *   **Status:** Pressing. Ethics must inform action. However, the *degree* of specificity required is debated.

  ### III. The Core Tensions (Where Desiderata Conflict)
  These are key fault lines where satisfying one desideratum makes satisfying another harder or seemingly impossible:

  *   **NIP vs. Person-Affecting Intuitions:** Solving the NIP typically requires abandoning core person-affecting principles ("we can only harm specific individuals"). This is deeply counterintuitive to many. (Ruled out: Strong Person-Affecting Views).
  *   **Avoiding Arbitrary Discounting vs. Minimal Demandingness:** Taking future fundamental interests fully seriously *now* can lead to extreme demands on the present (e.g., diverting resources from curing cancer today to prevent a *possible* disease outbreak in 500 years). Resisting this seems to require *some* discounting, risking arbitrariness. (Ruled out: Strict Total Utilitarianism without temporal limits/discounting).
  *   **Avoiding Paralysis from Indefinite Duration vs. Robustness to Uncertainty:** Limiting obligations to the nearer future (to avoid paralysis) seems arbitrary given deep uncertainty about *how long* there will be a future. Ignoring the very long term because it's uncertain feels wrong if the stakes are existential. (Ruled out: Theories that arbitrarily truncate the future).
  *   **Avoiding Repugnant Conclusions vs. Impartiality:** Giving *some* priority to the present poor over the future rich, or weighting catastrophic risks highly, seems to violate strict impartiality between persons across time. (Ruled out: Pure, strongly aggregative utilitarianism).

  ### IV. The Most Damaging Requirement: Non-Vulnerability to the Non-Identity Problem (NIP)
  This single requirement does the most work in ruling out popular views:

  1.  **Rules Out:** Traditional **Person-Affecting Views** entirely. If wronging requires harming a specific person who would otherwise be better off, climate change mitigation is often not "wrong" to the specific future people suffering, because they wouldn't exist otherwise.
  2.  **Challenges:** Standard **Economic Cost-Benefit Analysis (CBA)**. CBA typically focuses on welfare impacts on identifiable (though not yet existing) individuals. If the policy changes *who* exists, whose welfare is being compared? The baseline becomes murky. Discounting future *consumption* (Ramsey) avoids NIP only if it ignores identity effects and focuses purely on aggregate welfare streams – but this move *itself* requires abandoning person-affecting foundations.
  3.  **Complicates:** Some interpretations of **Contractualism**. If principles must be justifiable *to each individual* affected, future individuals affected by identity-altering policies pose a problem.

  ### V. Brief Scorecard of Major Views vs. Desiderata
  *   **Classical Utilitarianism (Total/Unlimited):** Fails 4 (Paralysis), 5 (Demandingness), potentially 6 (Asymmetry). Solves 1 (NIP) & 2 (Discounting), struggles with 3 (Uncertainty).
  *   **Person-Affecting Views:** Fail 1 (NIP) fundamentally. Struggle with 4 & 7.
  *   **Sufficientarianism (e.g., ensure all meet a threshold):** Can handle 1 (NIP - if focused on avoiding lives *below* threshold), 4 (focuses on preventing deprivation, not optimizing), 5 (less demanding). Struggles with defining the threshold robustly (3) and action-guidance above/below threshold (7). May seem arbitrary on discounting (2) above sufficiency.
  *   **Prioritarianism (weight benefits to the worse off):** Handles 5 better than utilitarianism. Solves 1 (NIP). Still struggles with 4 (Paralysis) and defining "worse off" intergenerationally (3, 6). Discounting (2) remains tricky.
  *   **Rights-Based/Deontological (e.g., leave the planet no worse):** Can solve 1 (NIP), 2 (Discounting - if rights are timeless), 5 (Demandingness - defined by the duty). Struggles enormously with 3 (Uncertainty - what violates the right?), 4 (Indefinite Duration - what baseline?), and 7 (Action-Guidance).
  *   **Sustainable Development Approaches (e.g., maintain capital stocks):** Focus on 7 (Action-Guidance). Often fudge 1 (NIP) and 2 (Discounting - embedded in valuation). Highly vulnerable to 3 (Uncertainty - what counts as capital?).
  *   **Catastrophic Risk Minimization:** Focuses on 5 (avoiding worst outcomes) and handles 3 (Uncertainty) pragmatically. May neglect less catastrophic but severe harms (fails 1/NIP only if solely catastrophic) and struggles with 4 (how much to spend on low-probability risks?).

  ### Conclusion
  The hardest tensions lie between **solving the Non-Identity Problem** (requiring non-person-affecting reasons) and **avoiding crushing demands on the present**, especially in the face of **indefinite duration** and **deep uncertainty**. Any adequate theory *must* solve the NIP and reject pure time preference for fundamental interests. How it navigates the demandingness/duration/uncertainty trilemma defines its core character (e.g., sufficientarian thresholds, prioritarian weighting, catastrophic focus, rights constraints). Beware theories that seem intuitive but fail the NIP test, or that use economic discounting as a substitute for moral justification. The philosopher's task is to find a coherent path through these irreducibly conflicting pressures.
