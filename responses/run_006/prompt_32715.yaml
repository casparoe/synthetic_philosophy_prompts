  Okay, the user is running a small investment club and has noticed a pattern in their decision-making that doesn't quite fit standard risk aversion. They've provided a clear example comparing two funds where members were more concerned about the worst-case scenarios being catastrophic, even if they're low probability. The user wants to know if there's a formal decision theory that endorses this approach normatively, not just descriptively like prospect theory.

  Hmm, what they're describing sounds very familiar - it's not just expected utility with a concave utility function. The key elements are: ranking outcomes from worst to best, applying non-linear weights to cumulative probabilities, and asymmetrically weighting bad outcomes more heavily. This is classic rank-dependent utility (RDU) from Yaari's dual theory or cumulative prospect theory. But the user specifically wants normative foundations, not descriptive models.

  Let me recall... there are indeed normative justifications for this approach. The ethical argument about catastrophic losses carrying disproportionate weight resonates with prioritarianism in philosophy. And the mathematical formulation through distorted cumulative probabilities avoids some paradoxes of expected utility theory. 

  The user also asks two sharp technical questions: how this handles independence axiom violations (which it intentionally violates for good reasons), and how it differs from standard curved utility (it transforms probabilities rather than outcomes). The probability weighting in RDU creates a "tail focus" that expected utility can't capture.

  For naming... while "cumulative prospect theory" is descriptive, the normative core is best called rank-dependent utility under the "Choquet expected utility" framework. Since the user wants a single label for the phenomenon, and given their emphasis on worst-outcome magnification, I think \answer{rank-dependent utility} is most precise, though "probability weighting with cumulative transformation" would be more descriptive. 

  The closing line should give them the canonical term they can research further. Rank-dependent utility is the established name in decision theory for this exact probability-weighting mechanism.
answer: |-
  Based on your detailed description, the decision rule you're observing aligns precisely with **Rank-Dependent Utility (RDU)** theory, a normative framework within generalized expected utility. Here's a breakdown addressing your core questions:

  ### 1. **The Named Theory: Rank-Dependent Utility (RDU)**
     - **Mechanism**: Outcomes are ranked from worst to best. A *probability weighting function* \( w(p) \) is applied to the *cumulative probabilities* (i.e., the probability of obtaining an outcome *at least as bad* as the current one). The weighted average is then computed.
     - **Key Feature**: The weighting depends on the *rank* (position) of outcomes in the distribution. Bad outcomes are overweighted (\( w(p) > p \) for small \( p \)), while good outcomes may be underweighted (asymmetrically).
     - **Normative Endorsement**: RDU was developed as a *rational* alternative to expected utility, notably by:
       - **Menahem Yaari** (1987): Proposed a "dual theory" of risk where probabilities (not utilities) are transformed.
       - **John Quiggin** (1982): Formulated RDU to resolve paradoxes in expected utility while preserving coherence.
       - **Philosophical Basis**: Scholars like **Cass Sunstein** argue this reflects ethical reasoning (e.g., avoiding catastrophic losses has moral weight beyond probability).

  ### 2. **Handling the Independence Axiom Violation**
     - **Intentional Violation**: RDU *deliberately* violates the independence axiom (if \( A \succ B \), then \( pA + (1-p)C \succ pB + (1-p)C \)). This is a feature, not a bug.
     - **Justification**: The axiom assumes linear probability weighting. RDU argues that probabilities in extreme tails (e.g., 1% chance of ruin) should be weighted nonlinearly. Transformations of cumulative distributions allow this while avoiding logical inconsistencies (unlike prospect theory).
     - **Coherence Preservation**: RDU satisfies stochastic dominance and continuity, maintaining rationality. Violating independence is seen as necessary for modeling rational aversion to tail risks.

  ### 3. **Difference from Expected Utility (EU) with Curved Utility**
     - **EU with Curved Utility**: Only transforms *outcomes* via \( u(x) \) (e.g., concave \( u \) for risk aversion). Probabilities remain linear.
     - **RDU**: Transforms *cumulative probabilities* via \( w(p) \). Utility can be linear (in Yaari's dual theory) or curved.  
     - **Crucial Distinction**: EU cannot overweight low-probability bad outcomes without distorting mid-range outcomes. RDU's rank-based weighting isolates tail risks.  
       - *Your example*: EU would require extreme concavity to reject Fund B, penalizing high gains. RDU overweights the 10% catastrophic loss *specifically*, preserving sensitivity to Fund B's upside.

  ### 4. **Nearest Candidate Theories & Differences**
     - **Cumulative Prospect Theory (CPT)**: *Descriptively* extends RDU but adds reference dependence and loss aversion. CPT is not purely normative.
     - **Choquet Expected Utility**: Generalizes RDU using capacities (non-additive probabilities). RDU is a special case with probability weighting.
     - **Maximin/Maximax**: These ignore probabilities entirely (focus only on worst/best outcomes). RDU still considers all outcomes, weighting them nonlinearly.
     - **Safety First**: Minimizes probability of loss below a threshold. RDU is more general, weighting the entire distribution.

  ### Best Label
  The phenomenon you describe—ranking outcomes, applying nonlinear weights to cumulative probabilities, and asymmetrically magnifying the worst outcomes—is the core of **Rank-Dependent Utility (RDU)**. It is the leading normative theory endorsing this decision rule.

  \answer{Rank-Dependent Utility}
