prompt: |-
  Ok here's what I want. You're an expert on naturalized semantics, someone who actually works on how biological function is supposed to ground mental representation. I'm putting together a graduate seminar on teleosemantics, and before I assign the usual papers I want a clean statement of what any decent teleosemantic theory has to accomplish. So write the desiderata. What must an adequate teleosemantic account of mental content deliver? I want each requirement paired with the case or consideration that forces it: the misrepresentation problem (a frog snapping at a passing BB, or whatever your preferred example is), the distality problem, content indeterminacy, original vs derived intentionality, novel contents, swampman-style cases, the fact that selection is usually for a disjunction of effects, that sort of thing. Also mark the distinctions the theory cannot collapse: indication isn't yet representation, function isn't what the thing in fact does, being selected for X isn't the same as having the content X. And flag any empirical facts from evolutionary biology a theory can't just wave off, like how functions get assigned when a trait has multiple selected effects.

  Then the part I actually care about: tell me which pairs of desiderata you think can't be jointly satisfied. I have a suspicion that determinacy and genuine naturalism pull against each other, but don't just tell me I'm right; work it out. Which single requirement, if you had to pick, rules out the most popular versions of the view? Then give me a quick scorecard, two or three sentences each, for the main flavors (indicator/covariation views, consumer-based views, hybrids) against the list. Keep the scorecard brief; the list is the deliverable. And please no reading list or citations, I just want the substantive list.

  Take your time and think it through carefully. Maybe start by brainstorming candidate requirements before you settle on the final list, and don't pad or tell me what teleosemantics is in general—I already know that.
reasoning: |-
  Alright, the user is putting together a graduate seminar on teleosemantics and wants a clean statement of the desiderata for an adequate teleosemantic account. They specifically mention several key problems like misrepresentation, distality, indeterminacy, etc. I need to outline what any decent theory must accomplish, pairing each requirement with the case that motivates it. Also, highlight crucial distinctions and empirical constraints from evolutionary biology.

  First, I should brainstorm all the candidate requirements. The user listed misrepresentation (frog/BB example), distality problem (why the fly, not retinal patterns), indeterminacy (fly vs. fly-or-BB), original vs. derived intentionality, novel contents (representing unseen objects), Swampman, disjunctive selection effects. Also, distinctions like indication vs. representation, function vs. actual use, selection-for vs. content. Empirical issues: multiple selected effects.

  Let me list potential desiderata:

  1. **Misrepresentation Handling**: The frog snaps at a BB, but it's an error. The theory must explain how content can be false. Paired with the frog example.

  2. **Distality Resolution**: Why does the frog represent the fly, not the retinal pattern or neural state? This relates to causation chains. Example: fly vs. proximal stimuli.

  3. **Content Determinacy**: Avoiding indeterminacy like fly vs. fly-or-BB. The theory needs to pin down specific content.

  4. **Original Intentionality**: Accounting for non-derived mental content, unlike symbols. Paired with Swampman, who lacks evolutionary history.

  5. **Novel Content Capability**: Handling representations of new things, like a new predator. Must explain learning without prior selection.

  6. **Disjunctive Effects Management**: Traits often selected for multiple effects. How to assign content without collapsing into disjunctions. Empirical fact: selection for a range of effects.

  7. **Function-Content Distinction**: Selected function (e.g., heart pumping blood) isn't the same as content (e.g., representing danger). Avoid conflating.

  8. **Indication vs. Representation**: Covariation isn't enough; need teleology. E.g., clouds indicate rain but don't represent it.

  Key distinctions to note: indication ≠ representation, function ≠ actual behavior, selection-for ≠ content.

  Empirical constraints: Traits can have multiple selected effects (e.g., feathers for insulation and flight). Theories can't ignore this; must handle which effect grounds content.

  Now, the user wants to know which desiderata conflict. They suspect determinacy and naturalism might clash. Naturalism relies on historical functions, but determinacy requires precise content. Historical functions might be disjunctive (selected for eating flies, but also nutritious things), leading to indeterminacy. So yes, determinacy vs. naturalism (grounded in selection history) is a tension.

  Also, original intentionality (requires history) vs. novel content (needs non-historical elements). Swampman has no history but might have thoughts, challenging strict teleosemantics.

  Which single requirement rules out popular versions? Probably Original Intentionality via Swampman. Many theories rely on evolutionary history, making Swampman lack content, which is counterintuitive.

  Quick scorecard for theories:

  - **Indicator/Covariation Views**: Good at distality and maybe determinacy but fail misrepresentation (no teleology) and original intentionality (need history). Struggle with disjunctions.

  - **Consumer-Based Views (e.g., Millikan)**: Handle misrepresentation and distality well. Might have issues with determinacy (disjunctions) and Swampman (no history). Novel content through learning mechanisms.

  - **Hybrid Views**: Combine producer and consumer. Address distality and novelty better. Still face disjunction problems and Swampman. Might handle determinacy if they incorporate current functions.

  I need to ensure the list is concise, pairs each desideratum with its motivating case, marks distinctions, and notes empirical constraints. Then discuss conflicts, key tension, and scorecard briefly.
answer: |-
  Here is a clean, requirements-focused list of desiderata for an adequate teleosemantic theory of mental content. Each item pairs a core requirement with the case or consideration that necessitates it, marks critical distinctions, and flags relevant empirical constraints. The list avoids preamble and assumes familiarity with teleosemantics.

  ### Core Desiderata for Teleosemantics
  1. **Handle Misrepresentation**  
     *Case*: Frog snaps at a passing BB (or dark speck), falsely representing it as food.  
     *Requirement*: The theory must explain how a state can have content (e.g., "fly present") that is false, without collapsing into indicator semantics (where error is impossible).  
     *Distinction*: Biological function ≠ actual causal role; representation ≠ reliable correlation.

  2. **Resolve Distality**  
     *Case*: Why does the frog’s perceptual state represent the *fly* (distal) rather than retinal patterns, neural firing, or proximal stimuli?  
     *Requirement*: Content must be fixed at the appropriate causal level (distal object), not too proximal (e.g., sensory input) or too distal (e.g., fitness outcomes).  
     *Distinction*: Representation of X ≠ indication of X’s causes/effects.

  3. **Achieve Content Determinacy**  
     *Case*: Indeterminacy between "fly," "food," "small dark moving thing," or disjunctions (e.g., "fly or BB").  
     *Requirement*: Content must be specific enough to avoid radical indeterminacy (e.g., ruling out disjunctive or overly broad contents).  
     *Empirical Constraint*: Selection often targets a *range* of effects (e.g., eyes selected for detecting predators, mates, *and* prey); the theory must assign determinate content without ad hoc appeals.

  4. **Ground Original Intentionality**  
     *Case*: Swampman (a molecule-for-molecule duplicate emerging from a swamp by chance) lacks evolutionary history.  
     *Requirement*: Explain how original (non-derived) mental content arises in evolved systems, without presupposing intentionality.  
     *Distinction*: Original intentionality (biological) ≠ derived intentionality (e.g., words, which depend on minds).

  5. **Accommodate Novel Contents**  
     *Case*: Representing entirely new objects (e.g., a novel predator or tool) not present in evolutionary history.  
     *Requirement*: Explain how learning or development generates new contents not directly selected for.  
     *Distinction*: Selection-based function ≠ current functional capacities.

  6. **Manage Disjunctive Selection Effects**  
     *Case*: A trait (e.g., camouflage) is selected for multiple effects (e.g., avoiding predators *and* surprising prey).  
     *Requirement*: Assign content without collapsing into disjunctive descriptions (e.g., "predator or prey") when selection targets a cluster.  
     *Empirical Constraint*: Evolutionary biology recognizes that traits often have multiple selected effects; the theory must specify which effect grounds content (e.g., via etiological function).

  7. **Distinguish Function from Content**  
     *Case*: A heart’s function is to pump blood, but it does not "represent" pumping blood.  
     *Requirement*: Not all functions entail representation; the theory must avoid overgeneration by tying content only to *representational* functions (e.g., perceptual or cognitive mechanisms).  
     *Distinction*: Being selected for X ≠ having content about X.

  8. **Exclude Mere Indication**  
     *Case*: Clouds indicate rain but do not represent it; thermostats "indicate" temperature but may lack genuine intentionality.  
     *Requirement*: Covariation or indication must be insufficient for representation; teleofunction must be necessary.  
     *Distinction*: Indication/covariation (non-normative) ≠ representation (normative, function-based).

  ### Conflicts Between Desiderata
  - **Content Determinacy vs. Naturalism**: Determinacy requires precise content, but naturalism (grounded in selection history) often implies disjunctive functions (e.g., selection for "nutritious stuff" not "flies"). Resolving indeterminacy typically requires non-historical elements (e.g., current environment or learning), undermining strict naturalism.  
  - **Original Intentionality vs. Novel Contents**: Original intentionality demands historical functions, but novel contents (e.g., representing smartphones) require content-generation without direct selection history. Hybrid theories often sacrifice pure historicity to handle novelty.  
  - **Strongest Conflict**: **Determinacy vs. Naturalism** creates the deepest tension. Popular theories (e.g., Millikan-style consumer semantics) prioritize naturalism but struggle with disjunctions, leading to indeterminacy.  
  - **Most Exclusionary Requirement**: **Original Intentionality** (via Swampman) rules out the widest range of views, as most teleosemantic theories (e.g., Millikan, Papineau) require evolutionary history, denying Swampman content—a counterintuitive result.

  ### Theory Scorecard
  - **Indicator/Covariation Views (e.g., Dretske)**: Fails **Misrepresentation** (no teleology) and **Original Intentionality** (covariation is non-historical). Excels at **Distality** via information-theoretic chains.  
  - **Consumer-Based Views (e.g., Millikan)**: Strong on **Misrepresentation** and **Distality**, but weak on **Determinacy** (disjunctions persist) and **Original Intentionality** (Swampman lacks history). **Novel Contents** handled via derived functions.  
  - **Hybrid Views (e.g., Shea)**: Best for **Novel Contents** and **Distality** (combining producer-consumer roles). Still struggles with **Determinacy** (disjunctions) and **Original Intentionality** if history-dependent.
