prompt: |-
  I chair the monthly risk committee of a mid-sized insurer. For familiar lines — car collisions, house fires — our actuaries give us clean numbers and we price accordingly. But we are increasingly asked to underwrite exposures with no stable frequency behind them: a new class of ransomware attack, a first-of-its-kind industrial process, a liability line for a technology that barely exists. The analysts still want a single probability for each, and they get frustrated when I say the number is doing no real work.

  Keynes's account of probability and uncertainty holds that probability is often not a single number at all: some comparisons are only partial, some matters admit no calculable probability, and the amount of evidence behind a probability — what he called the weight of argument — matters as much as the probability itself. Turn that into a procedure my committee can actually run in a two-hour meeting. It should be a fixed sequence of questions with rules for what counts as a sufficient answer, a point at which we must refuse to assign a number and classify the case as uncertainty rather than measurable risk, and a point at which the decision is handed to human judgment because it turns on values or risk appetite rather than calculation. Do not offer me a menu of considerations; commit to one procedure and defend each choice.

  Then run the procedure on two cases: (1) pricing coverage for a new strain of ransomware attack where we have only a handful of incidents worldwide, and (2) deciding whether to enter a market for insuring autonomous-vehicle fleets before any major loss data exists. Mark the steps at which reasonable people could follow your procedure and still disagree.
reasoning: |-
  Okay, let's start by understanding the user's problem. They chair a risk committee for an insurer, dealing with new, uncertain exposures like ransomware attacks and autonomous vehicles. Their actuaries want single probabilities, but these aren't reliable for novel risks. The user references Keynes, emphasizing that probability isn't always quantifiable and that the weight of evidence matters. 

  First, I need to translate Keynes's concepts into a practical procedure. The key elements are partial orderings, unquantifiable uncertainties, and the weight of argument. The challenge is creating a step-by-step process that fits into a two-hour meeting with clear decision points. The user wants a fixed sequence, not just considerations. 

  The procedure must have stages: starting with defining the exposure, assessing evidence, deciding if it's risk or uncertainty, and then handling values-based decisions. Each step needs specific criteria to avoid ambiguity. For instance, defining the exposure requires precise parameters. Evidence assessment should categorize into Keynesian types—numerical, comparative, or irreducible uncertainty. 

  Weight of Argument is crucial. How to quantify it? Maybe through evidence quality, source diversity, and consensus among experts. Setting thresholds for each category will help decide when to stop quantification. For example, if evidence is Type C (irreducible uncertainty), it's an automatic "uncertainty" classification. 

  Then the risk appetite check: if the exposure exceeds predefined thresholds, it goes to human judgment. The user mentioned values and risk appetite, so this step is vital. 

  Now, applying the procedure to the ransomware case. Step 1: Define exposure. Parameters like attack frequency, payout size. Step 2: Evidence. Only a few incidents, so Type C—irreducible uncertainty. Skip to Step 4, classify as uncertainty. Step 5: Risk appetite. If the worst-case scenario is beyond the insurer's capacity, decline. Disagreement might arise in judging the adequacy of expert consensus or the worst-case estimate.

  For autonomous vehicles, Step 2: Evidence might be Type B (comparative). Maybe analogies to human-driven fleets. But the weight of argument is low because of limited real-world data. Step 3: If weight is medium, maybe proceed cautiously. But Step 4 could still classify as uncertainty if weight is insufficient. Disagreement points: whether analogies are valid, or if risk appetite thresholds are met.

  I need to ensure the procedure is defensible. Each step's design should mirror Keynes's principles. For example, distinguishing evidence types prevents false precision. Weight assessment combats overconfidence. The risk appetite step separates quantifiable risks from value judgments. 

  Potential pitfalls: Committee members might push for numbers anyway. Clear thresholds and forced stops (like Step 4B) prevent this. Also, disagreement points are natural, especially in evidence categorization and weight assessment. Acknowledging these maintains transparency. 

  Lastly, the examples must show the procedure in action. Highlighting where disagreements can occur demonstrates realism. The user needs a tool that enforces discipline without stifling necessary judgment calls.
answer: |-
  Here is a Keynesian-inspired risk classification procedure for your committee, designed as a strict, sequential protocol. It prioritizes evidential weight and acknowledges irreducible uncertainty, forcing a binary "Risk/Uncertainty" decision before permitting quantification.

  **Keynesian Risk Classification Procedure (KRCP)**

  1.  **Define the Exposure Precisely (10 mins):**
      *   *Question:* "What *exactly* are we insuring against? Define the peril, trigger, policy limits, exclusions, and exposure period in concrete terms."
      *   *Sufficient Answer:* A written statement specifying the covered event, conditions of payout, maximum liability, key exclusions, and policy term. *No* discussion of likelihood or cost yet.
      *   *Defense:* Prevents vagueness that masks uncertainty. Forces specificity about the "thing" before assessing its probability.

  2.  **Assess Evidence Type & Structure (20 mins):**
      *   *Question:* "What is the nature and structure of the evidence for frequency/severity? Does it allow for: (A) Stable numerical probability (e.g., car accidents), (B) Partial ordering/comparison (e.g., 'more likely than X but less than Y'), or (C) No basis for numerical calculation or meaningful comparison?"
      *   *Sufficient Answer:* Committee selects A, B, or C based on:
          *   **A:** Requires homogeneous, numerous past instances under stable conditions.
          *   **B:** Requires identifiable, relevant analogues or logical structures enabling comparison (e.g., "This ransomware shares mechanics with Virus A, but spreads faster like Worm B").
          *   **C:** Applies if evidence is anecdotal, unique, based on unprecedented tech/behavior, or involves complex, interacting systems with no stable reference class.
      *   *Defense:* Directly implements Keynes's types of probability. Forces explicit recognition of the *kind* of knowledge available. If C, skip to Step 4.

  3.  **Evaluate Weight of Argument (30 mins):**
      *   *Question:* "For evidence types A or B, what is the *weight*? Assess: (i) *Quality:* Source reliability, methodological rigor, freedom from bias. (ii) *Diversity:* Independent sources, multiple methodologies, varied perspectives. (iii) *Completeness:* Coverage of known risk drivers, known unknowns acknowledged. (iv) *Stability:* Evidence stable over relevant timeframes? (v) *Consensus:* Expert agreement on interpretation?"
      *   *Sufficient Answer:* Score each factor (i-v) **Low, Medium, or High**. Overall Weight = **Low** if any *two* factors are Low, or *one* factor is Low *and* lacks compensating Highs elsewhere. Otherwise, **Medium/High**.
      *   *Defense:* Operationalizes Keynes's "weight." Focuses on the robustness of the evidence *behind* any probability estimate. Low Weight invalidates numerical precision.

  4.  **Risk vs. Uncertainty Classification (10 mins):**
      *   *Question:* "Based on Steps 2 & 3, is this a Measurable Risk or Keynesian Uncertainty?"
      *   *Decision Rule:*
          *   **Uncertainty (Do NOT assign number):** If Evidence Type = **C** (Step 2) OR Overall Weight = **Low** (Step 3). *Proceed to Step 5.*
          *   **Measurable Risk (Permit quantification):** Only if Evidence Type = **A or B** AND Overall Weight = **Medium/High**. *Actuaries develop/present single number estimates. Committee then proceeds to Step 5 ONLY for final risk appetite check.*
      *   *Defense:* The core of Keynes. Refuses quantification when evidence is fundamentally inadequate (Type C) or too flimsy (Low Weight), preventing false precision. Only solid (A/B + Med/High Weight) cases get numbers.

  5.  **Risk Appetite & Judgment Gate (20 mins per case):**
      *   *Question:* "Does this exposure (whether priced numerically or classified as Uncertainty) fall within our stated risk appetite thresholds for *novelty*, *maximum plausible loss (MPL)*, and *capital impact*, considering the Weight assessment?"
      *   *Sufficient Answer:*
          *   For **Measurable Risk:** Compare actuary's estimate + confidence intervals to pre-defined underwriting limits and capital allocation models. Decision: Accept/Modify/Decline based on thresholds.
          *   For **Uncertainty:** Explicitly forbid numerical pricing. Ask:
              1.  "What is the reasoned *qualitative* MPL scenario (considering Weight factors)?" (e.g., "Worst credible case: 1000x current incident rate, average payout $Y").
              2.  "Does this MPL scenario exceed our pre-set thresholds for: (a) Single-event loss? (b) Potential aggregate loss in a stress year? (c) Capital consumption impact? (d) Novelty tolerance (e.g., max % of book)?" *If ANY threshold is breached → Decline.* If *within* thresholds → Senior Underwriter/CEO judgment call based on strategic value, portfolio diversification, and pure risk appetite.
      *   *Defense:* Separates *quantification* (Steps 1-4) from *decision-making* based on values/capacity (Step 5). Forces conscious, value-based judgment under true uncertainty, protected by MPL thresholds. Prevents gambling disguised as calculation.

  **Procedure Applied:**

  **Case 1: New Ransomware Strain (Handful of Incidents)**

  1.  **Define:** "Coverage for business interruption & ransom payment caused by [Specific Strain] exploiting [Specific Vulnerability] for policies <$5M, 12-month term, excluding state-sponsored attacks."
  2.  **Evidence Type:** **C (Irreducible Uncertainty).** Handful of unique incidents, rapidly evolving tactics, no stable attack surface, no large-scale homogeneous exposure history. *→ Skip Step 3.*
  3.  *(Skipped)*
  4.  **Classification:** **Uncertainty** (due to Type C).
  5.  **Risk Appetite/Judgment:** MPL Scenario: "Coordinated global attack leveraging strain, impacting 5% of insureds simultaneously, average ransom + BI = $2M → Aggregate $500M." *Assume this breaches Single Event Loss threshold ($250M) and Novelty threshold.* **→ Decline.** *If within thresholds:* Judgment call needed on strategic value vs. unknown tail risk.

  *   **Disagreement Points:**
      *   Step 2: Could someone reasonably argue Type B ("like WannaCry but faster")? Possibly, but low bar for C holds.
      *   Step 5 (if within thresholds): Judgment call on strategic value vs. fear of the unknown is inherently subjective.

  **Case 2: Autonomous Vehicle Fleet Insurance (No Major Loss Data)**

  1.  **Define:** "Liability coverage (incl. cyber) for fleets (>10 vehicles) of Level 4 AVs operating in geo-fenced urban areas, policy limits <$10M per vehicle/$100M aggregate, 12-month term."
  2.  **Evidence Type:** **B (Partial Ordering).** Not A (no stable data). But relevant analogues exist: Human-driven fleet safety records, AV test data (disengagements, near-misses), safety-critical system reliability (aerospace, rail), sensor failure rates, cybersecurity breach frequencies in similar systems. Allows comparisons ("safer than human drivers in X condition, but vulnerable to novel sensor spoofing").
  3.  **Weight of Argument:** *(i) Quality:* Mixed (test data controlled, real-world incomplete). *(ii) Diversity:* Medium (test data, expert models, human driver analogues). *(iii) Completeness:* Low (unknowns re: AI edge cases, hacking, interaction complexity). *(iv) Stability:* Low (tech evolving rapidly). *(v) Consensus:* Low (experts disagree on risk trajectory). **→ Overall Weight = LOW** (Completeness Low + Stability Low + Consensus Low).
  4.  **Classification:** **Uncertainty** (due to Low Weight).
  5.  **Risk Appetite/Judgment:** MPL Scenario: "Critical software flaw + sensor spoofing event causes simultaneous collision of 20% of a large fleet in a dense urban area → $500M+ losses." *Assume this breaches Aggregate Loss threshold ($300M).* **→ Decline.** *If within thresholds:* Judgment call required on market entry timing, potential first-mover advantage vs. catastrophic unknowns.

  *   **Disagreement Points:**
      *   Step 2: Could someone argue Type C ("completely novel")? Yes, but Type B (using analogues) is defensible.
      *   Step 3: Weight assessment is judgmental. Could someone rate Diversity/Quality higher or Completeness lower? Could arguments about specific high-quality data sources push Weight to Medium? (Threshold holds: *One* Low plus no compensating Highs still = Low).
      *   Step 5 (if within thresholds): Strategic judgment call is prime disagreement territory.

  **Why this procedure works for your committee:**

  1.  **Forces Discipline:** Sequential, binary gates prevent skipping to numbers. Uncertainty is a formal classification, not an afterthought.
  2.  **Honors Keynes:** Centralizes evidence *type* and *weight*. Explicitly rejects quantification when inappropriate.
  3.  **Manages Time:** Fixed structure, clear questions, and decision rules fit a 2-hour meeting (allocate time per case upfront).
  4.  **Protects Capital:** The MPL/Threshold check in Step 5 for Uncertain exposures acts as a circuit breaker, preventing bets where the odds are truly unknown and stakes are too high.
  5.  **Clarifies Responsibility:** Actuaries quantify *only* when validation gates are passed. Committee owns the Risk/Uncertainty classification and value judgments.

  This procedure transforms Keynes's philosophy into actionable governance, replacing false precision with disciplined decision-making under both risk and uncertainty.
