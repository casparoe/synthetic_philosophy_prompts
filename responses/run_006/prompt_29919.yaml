answer: |-
  Here are five points addressing your concern:

  1.  **Conservation biology primarily targets unique evolutionary lineages and ecological roles**, not metaphysically perfect "natural kinds"; the operational units used (often under concepts like the Phylogenetic Species Concept) are proxies for irreplaceable biodiversity components facing extinction.
  2.  **Operational stability exists despite ontological debate:** While philosophers debate the fundamental nature of species, working biologists apply standardized criteria (like the IUCN Red List protocols) consistently, providing a stable, *pragmatic* framework for counting and assessing extinction risk, even if boundaries are sometimes fuzzy.
  3.  **The loss measured is real regardless of ontology:** When unique populations with distinct genomes, adaptations, and ecological functions disappear, that loss of evolutionary history and complexity is concrete and consequential, irrespective of how precisely "species" is defined philosophically.
  4.  **Pluralism reflects biological reality:** The fact that different concepts track different things (reproductive isolation, monophyly, diagnosability) doesn't mean "species" is meaningless; it highlights that biodiversity is complexly structured, and conservation pragmatically uses whichever concept best identifies units warranting protection in a given context (as you did with polychaetes).
  5.  **Philosophical uncertainty doesn't invalidate applied goals:** Conservation biology's aim to prevent irreversible loss of biodiversity is justified by the value placed on evolutionary processes, ecosystem function, and intrinsic worth, not contingent on species being universally definable as simple natural kinds or individuals.
