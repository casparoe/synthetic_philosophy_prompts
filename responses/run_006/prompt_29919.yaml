  Third, the loss they measure is real regardless of ontology: unique evolutionary histories and ecological functions disappear when populations vanish. Their worry about "what's being counted" might overlook that conservation targets processes, not just taxa. 

  Fourth, pluralism isn't just philosophical hand-waving—it reflects nature's complexity. Polychaete diversity itself shows why one-size-fits-all definitions fail, and that's okay for applied work.

