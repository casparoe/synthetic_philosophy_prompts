  Below is a diagnostic instrument designed to sort students into positions on supererogation using concrete cases. The questions avoid the term "supererogation" and focus on moral evaluations of actions. The answer options are standardized across scenarios for consistency. Each question uses the same set of options:

  - **A.** The agent acted as duty requires (it would have been wrong not to do it).  
  - **B.** The agent went beyond what duty requires (it was good to do it, but not wrong to omit).  
  - **C.** The agent did something merely permissible (neither required nor especially good).  
  - **D.** The agent did something there was reason not to do, though it turned out well.  
  - **E.** The agent failed to do what duty requires (they should have done more or acted differently).  

  ---

  ### **Questions**  
  **Scenario 1: Major Donation to Strangers (Significant sacrifice, strangers, action, same currency, one-off)**  
  *Alex donates 40% of their annual income to a famine-relief charity, significantly reducing their own comfort. This saves dozens of lives but forces Alex to postpone buying a home.*  
  → Options: A, B, C, D, E  

  **Scenario 2: Small Favor for a Friend (Minor sacrifice, intimate, action, same currency, one-off)**  
  *Taylor notices their friend, Jordan, forgot their wallet and cannot buy lunch. Taylor buys Jordan a $10 meal, a minor cost given Taylor’s stable finances.*  
  → Options: A, B, C, D, E  

  **Scenario 3: Kidney Donation to a Stranger (Significant sacrifice, strangers, action, different currency, one-off)**  
  *Casey donates a kidney to a stranger, enduring surgery and lifelong health risks. The recipient’s life is saved.*  
  → Options: A, B, C, D, E  

  **Scenario 4: Forbearing a Parking Spot (Minor sacrifice, strangers, forbearance, same currency, one-off)**  
  *Morgan refrains from taking the last parking spot at a crowded mall so a frailer stranger can use it. Morgan walks farther but is not significantly inconvenienced.*  
  → Options: A, B, C, D, E  

  **Scenario 5: Long-Term Care for a Parent (Sustained sacrifice, intimate, action, same currency, sustained)**  
  *Riley quits their job to care full-time for their terminally ill parent for two years, sacrificing career advancement and personal freedom. The parent’s quality of life improves.*  
  → Options: A, B, C, D, E  

  **Scenario 6: Sustained Volunteering for Strangers (Sustained sacrifice, strangers, action, same currency, sustained)**  
  *Avery volunteers 10 hours/week for two years at a homeless shelter, missing leisure time but substantially aiding strangers.*  
  → Options: A, B, C, D, E  

  **Scenario 7: Career Sacrifice for a Sibling (Significant sacrifice, intimate, action, same currency, one-off)**  
  *Jordan turns down their dream job abroad to stay home and support a depressed sibling through recovery, derailing their career.*  
  → Options: A, B, C, D, E  

  **Scenario 8: Holding the Door (Minor sacrifice, strangers, action, same currency, one-off)**  
  *Sam holds a door open for a stranger carrying heavy boxes, a trivial effort taking 5 seconds.*  
  → Options: A, B, C, D, E  

  ---

  ### **Scoring Key and Position Mapping**  
  Patterns of answers map to positions as follows. A position is assigned if ≥6 answers align with its core pattern. Discrepancies in 1–2 scenarios may still fit the position (e.g., classical view may vary on intimates).  

  | **Position**                 | **Expected Answer Pattern**                                                                                                | **Diagnostic Scenarios**                                                                                                |
  |------------------------------|---------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------|
  | **Classical View**           | B for significant sacrifices (Q1, Q3, Q6), A for minor acts (Q2, Q4, Q8), A/B for intimates (Q5, Q7: often A if framed as duty). | Strong on Q1/Q3/Q6=B; weak on Q5/Q7 (intimates blur duty/supererogation).                                              |
  | **Kantian/Rigorist**         | A for all scenarios (no supererogation; all good acts required).                                                          | Uniformly A; deviations indicate non-rigorism.                                                                         |
  | **Imperfect-Duty View**      | B for high-cost acts (Q1, Q3, Q5, Q6, Q7), A for low-cost (Q2, Q4, Q8). "Duty" requires some beneficence, but latitude in extent. | Resembles classical but distinct in Q5/Q7: may prefer B (care seen as beyond minimal duty).                          |
  | **Conceptual-Instability**   | Avoids B entirely. A for acts deemed "good" (e.g., Q2, Q4, Q8), C for others (if not required, cannot be "good").               | Never B; mix of A/C. Q3=D/E possible if sacrifice is seen as non-moral.                                              |
  | **Heroism-Only View**        | B only for extreme sacrifices (Q3, Q7). A for minor acts (Q2, Q4, Q8), C for non-heroic sacrifices (Q1, Q5, Q6).                | Q3/Q7=B; Q1/Q5/Q6=C; rejects B for "merely" significant acts.                                                       |
  | **Impartial-Spectator View** | B when a spectator would praise but not demand (typically Q1, Q3, Q5, Q6, Q7). A for trivial demands (Q2, Q4, Q8).               | Similar to classical; distinguishable only via rationale (not captured in quiz).                                    |

  ---

  ### **Limitations and Unoccupied Positions**  
  **Indistinguishable Pairs**:  
  - **Classical vs. Impartial-Spectator**: Both yield identical patterns (e.g., Q1=B, Q8=A). They differ only in theoretical justification (duty vs. spectator standpoint), not case judgments.  
  - **Classical vs. Imperfect-Duty**: May overlap on all scenarios *except* sustained intimate care (Q5/Q7). Classical often sees this as duty (A), while Imperfect-Duty may see it as beyond duty (B).  
  - **Heroism-Only vs. Conceptual-Instability**: Both reject B for non-extreme acts (e.g., Q1=C), but Conceptual-Instability avoids B categorically.  

  **Logically Possible but Unoccupied Positions**:  
  1. *Supererogation requires forbearance, not action*:  
     - Why unoccupied? Supererogation is typically linked to positive actions (e.g., saving lives). Forbearance (e.g., not stealing) is usually seen as duty. No major theory privileges inaction.  
  2. *Minor acts are supererogatory; major acts are duties*:  
     - Why unoccupied? Counterintuitive to view trivial acts (Q8) as "beyond duty" but life-saving sacrifices (Q3) as required. Ignores the role of cost in moral demandingness.  
  3. *Strangers deserve supererogation; intimates deserve only duty*:  
     - Why unoccupied? Contradicts partiality debates (intimates often warrant *more* obligation). Theories either universalize or weight intimates higher, not lower.  

  ---

  ### **Confidence Assessment**  
  - **Overall Confidence**: Moderate (7/10).  
    - Strengths: Scenarios vary key dimensions (cost, intimacy, action/forbearance); options force clear distinctions; positions like rigorist and heroism-only are well-captured.  
    - Weaknesses: Theoretical overlaps (classical/impartial/imperfect) and intimacy-related ambiguity in Q5/Q7 reduce precision.  

  - **Least Confident Branch-Point**: **Sustained sacrifice for intimates (Q5/Q7)**.  
    - Why?  
      - Cultural/philosophical disagreement: Is long-term care for a parent a duty (A) or supererogatory (B)?  
      - Pulls classical, imperfect-duty, and heroism-only in conflicting directions.  
      - May miss nuances (e.g., "sacrifice thresholds" in imperfect-duty views).  
    - Recommendation: Use Q5/Q7 as discussion prompts in the seminar to clarify intuitions.  

  This instrument effectively isolates rigorist, conceptual-instability, and heroism-only views. For classical, imperfect-duty, and impartial-spectator positions, follow-up discussion is recommended to resolve overlaps. Adjust scenarios (e.g., vary intimacy levels) if finer distinctions are needed.
