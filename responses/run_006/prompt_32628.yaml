  We are designing a diagnostic instrument to sort students into positions on supererogation without using the term. We have several positions to distinguish:

  1. Classical view: Supererogatory acts exist (praiseworthy to perform, not blameworthy to omit).
  2. Kantian/rigorist: Every morally good act is a duty; no supererogation.
  3. Imperfect-duty view: Supererogation is grounded in duties of beneficence that leave latitude (so required vs. supererogatory is about how much one does within an open-ended obligation).
  4. Conceptual-instability: The idea of a good act that is not required is incoherent.
  5. Heroism-only: Supererogation exists but only for extreme self-sacrifice or saintliness.
  6. Impartial-spectator: Supererogatory acts are what a fully informed impartial spectator would recommend but not demand.

  We'll create 8-10 scenarios that vary along:
  - Significant sacrifice vs. minor
  - Strangers vs. intimates
  - Action vs. forbearance
  - Cost to agent in same currency as benefit? (e.g., monetary cost for monetary benefit vs. giving up a kidney)
  - One-off vs. sustained

  Each scenario will have answer choices that capture the above positions. We'll use a set of options for each question, but note that not every option may be applicable to every scenario. We'll try to use consistent options, but we may adjust slightly per scenario to fit.

  Proposed answer options (to be used consistently where applicable):

  A. The agent acted as duty requires (it would have been wrong not to do it).
  B. The agent went beyond what duty requires (it was good to do it, but not wrong to omit).
  C. The agent did something that was merely permissible (neither required nor especially good).
  D. The agent did something there was reason not to do, though it turned out well.
  E. The agent failed to do what duty requires (it was wrong not to do it).

  But note: Option B captures the classical supererogation. Option A is the rigorist view (if the act is good, it must be required). Option C might capture cases that are indifferent. Option D is for acts that are somewhat bad but had good consequences. Option E is for failures of duty.

  However, we might also need an option for the imperfect-duty view: perhaps we don't have a direct option for that. The imperfect-duty view might see an act as required if it is the minimal level of beneficence, but beyond that as supererogatory. So in some scenarios, we might have to design the options to tease that out.

  Alternatively, we can design scenarios that vary the level of sacrifice and then see how the respondent classifies each level.

  We'll design 8 scenarios. For each, we'll provide the scenario and the options. Then we'll have a scoring key that maps patterns of answers to positions.

  Let's design the scenarios:

  Scenario 1: Significant sacrifice, stranger, action, same currency, one-off.
    Example: Donating a large sum of money (say, 30% of one's annual income) to a charity that helps strangers in need.

  Scenario 2: Minor sacrifice, intimate, action, same currency, one-off.
    Example: Buying a cup of coffee for a friend who forgot their wallet.

  Scenario 3: Significant sacrifice, stranger, action, different currency, one-off.
    Example: Donating a kidney to a stranger.

  Scenario 4: Minor sacrifice, stranger, forbearance, same currency, one-off.
    Example: Not taking the last available seat on a bus so that a stranger (who looks tired) can have it.

  Scenario 5: Sustained sacrifice, intimate, action, same currency, sustained.
    Example: Caring for a sick parent at home for several years, which involves significant time and effort.

  Scenario 6: Sustained sacrifice, stranger, action, same currency, sustained.
    Example: Volunteering every weekend for a year at a homeless shelter.

  Scenario 7: Significant sacrifice, intimate, action, same currency, one-off.
