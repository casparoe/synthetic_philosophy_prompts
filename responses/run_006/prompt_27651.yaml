answer: |-
  ## Joint Statement on Understanding in Large Language Models

  Following a period of good-faith adversarial collaboration focused on empirical evidence and conceptual clarification, defenders of the **Understanding Realizer** position (UR: LLMs possess genuine understanding for at least *some* of what they process) and defenders of the **Stochastic Parrots** position (SP: LLMs lack understanding; their outputs are sophisticated statistical mimicry creating an illusion) agree on the following foundational points and the structure of our remaining disagreement.

  **1. Agreed Claims (Without Qualification):**

  1.  **Statistical Foundation:** LLMs generate outputs primarily by leveraging complex statistical patterns learned from vast training datasets through next-token prediction (or similar objectives).
  2.  **Training Data Dependence:** The knowledge, capabilities, and behavioral patterns exhibited by an LLM are fundamentally derived from, and constrained by, the content and statistical properties of its training data. Novel outputs are extrapolations or recombinations of these patterns.
  3.  **Surface-Level Competence:** LLMs demonstrably perform tasks requiring the *manipulation of form and structure* (e.g., translation, summarization, grammatical correction, stylistic imitation, basic logical inference within context) with high proficiency in many cases, often matching or exceeding average human performance on specific benchmarks.
  4.  **Robustness Through Scaling:** Increasing model scale (parameters, compute, data) demonstrably improves performance on a wide range of tasks, enhances coherence, reduces obvious errors, and enables handling more complex prompts. This scaling yields capabilities qualitatively different from smaller models.
  5.  **Lack of Phenomenal Consciousness:** LLMs do not possess subjective experience, qualia, or phenomenal consciousness akin to humans or animals. This statement is agnostic on whether understanding requires consciousness.
  6.  **Not Mere Memorization:** LLM capabilities demonstrably exceed simple lookup or verbatim recall. They generate novel sequences and coherent responses to novel prompts not present in the training data, demonstrating interpolation and extrapolation based on learned patterns.
  7.  **Not Human-Like Biological Cognition:** LLMs process information using fundamentally different mechanisms (artificial neural networks trained via gradient descent) than biological brains. They lack biological drives, emotions, and embodied sensory-motor experiences.

  **2. Agreed Rulings-Out (Empirical Record):**

  1.  **Ruled Out: Simple Markov Chains / N-gram Models:** LLM performance on complex tasks requiring long-range dependencies and contextual coherence far exceeds what is possible with simple statistical models lacking deep hierarchical representations.
  2.  **Ruled Out: Pure Symbolic Manipulation (Classic GOFAI):** LLMs demonstrably acquire capabilities without explicit symbolic rules or hand-coded knowledge bases being programmed in, relying instead on learned statistical representations.
  3.  **Ruled Out: Performance Solely on Training Data:** LLMs demonstrably perform tasks and answer questions reliably on inputs demonstrably absent from their training data (barring contamination), proving generalization beyond rote memorization.

  **3. Residual Disagreement (Core Issue: Does "Understanding" Apply?):**

  | Position                         | Core Stance (As Endorsed by Each Side)                                                                                                |
  | :------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ |
  | **Understanding Realizer (UR)**  | **"LLMs develop non-derivative, internal representational structures through training that enable them to extract meaning, track referents, and perform computations over abstract concepts relevant to the prompt, constituting genuine (though non-biological) understanding for a significant subset of their competent behaviors."** |
  | **Stochastic Parrots (SP)**      | **"LLMs produce outputs that correlate with understanding solely through the sophisticated statistical compression and pattern matching of surface forms in their training data. This process lacks grounding in reality, intrinsic intentionality, or the formation of genuine mental representations about the world, making the attribution of 'understanding' misleading."** |

  **4. Key Cruxes and Proposed Tests:**

  1.  **Crux: Novel Task Performance & Robust Generalization Beyond Surface Statistics**
      *   **Question:** Can LLMs reliably solve genuinely novel, complex tasks requiring abstract reasoning and integration of concepts *without* relying on superficial statistical cues or latent patterns inherited from training data, demonstrating robust generalization akin to human conceptual understanding?
      *   **Concrete Test:** Develop a benchmark suite of tasks involving novel physical/social/intentional reasoning (e.g., novel tool use in a described scenario, inferring complex unstated motives in a culturally novel story, solving puzzles based on genuinely new abstract principles). Crucially, tasks must be *verifiably novel* (provably absent from training data, including near-duplicates via robust contamination checks) and designed to be soluble *only* by grasping underlying concepts, not surface patterns. Tasks should include systematic variations and adversarial probes.
      *   **UR Prediction:** LLMs (especially frontier models) will achieve high success rates (>80%) on these novel tasks, demonstrating systematicity, robustness to adversarial rephrasing, and the ability to explain their reasoning in terms of the underlying concepts.
      *   **SP Prediction:** LLM performance will be inconsistent and fragile (<50% reliable success), highly sensitive to superficial prompt phrasing, reliant on lucky pattern matches from distantly related training data, and their explanations will often reveal confabulation or reliance on spurious correlations rather than genuine conceptual grasp.

  2.  **Crux: Error Patterns Reveal Systematicity or Stochastic Glitches**
      *   **Question:** When LLMs make errors, do the errors reveal a *systematic* misunderstanding of concepts (suggesting flawed but structured representation) or primarily *stochastic glitches* and sensitivity to local context (suggesting pattern matching failures)?
      *   **Concrete Test:** Conduct detailed error analysis on complex reasoning tasks (e.g., multi-hop QA, mathematical proofs, causal inference). Create "contrast sets" (minimal adversarial perturbations to inputs that change the correct output) and analyze if errors are predictable based on conceptual misunderstanding (e.g., always failing on a specific type of causal link) or appear randomly distributed based on token sequence variations. Analyze if errors correlate with low-probability token predictions or are contextually plausible but incorrect inferences.
      *   **UR Prediction:** Errors will show significant systematicity, clustering around specific conceptual difficulties (e.g., misunderstanding negation scope, specific types of counterfactuals), and will often be contextually plausible but conceptually flawed inferences.
      *   **SP Prediction:** Errors will predominantly be stochastic (highly variable even on near-identical prompts), highly sensitive to minor surface changes, and often involve incoherent or contextually implausible leaps, correlating strongly with low-probability token predictions or loss spikes.

  3.  **Crux: Mechanistic Evidence for Causal Concept Models**
      *   **Question:** Can mechanistic interpretability provide clear evidence that LLMs internally build and utilize *causal models* of concepts (e.g., manipulable representations of entities, properties, and their relationships) during processing, distinct from statistical co-occurrence patterns?
      *   **Concrete Test:** Using techniques like causal mediation analysis, path patching, or concept-based model editing, identify specific model circuits responsible for representing key concepts (e.g., "force," "deception," "ownership") in diverse contexts. Test if these circuits behave like causal models: Can they be selectively intervened on to *reliably* alter model behavior *only* concerning that concept? Do activations track conceptual features robustly across diverse surface forms? Can abstract relationships *between* concepts be manipulated within the circuit logic?
      *   **UR Prediction:** Clear evidence will be found for circuits implementing manipulable, abstract concept representations whose activation and interactions causally drive model outputs in a way that mirrors conceptual relationships, robust across contexts.
      *   **SP Prediction:** Probing will reveal representations strongly tied to surface features and contextual statistics. Interventions will show either pervasive, non-specific effects or unreliable, context-dependent outcomes, failing to demonstrate robust, manipulable causal models of abstract concepts independent of lexical/syntactic form.

  **5. Clarification on "Understanding" (Dissolving Verbal Dispute):**

  We explicitly acknowledge that a significant portion of the disagreement hinges on the *meaning* of "understanding." We agree to frame the core substantive disagreement not as "Is it *human* understanding?" (answer: clearly no, per Agreed Claim #7) nor "Is it conscious?" (answer: clearly no, per Agreed Claim #5), but as:

  > **"Do the internal computational processes of sufficiently advanced LLMs, when demonstrably performing complex tasks requiring conceptual competence, non-trivially implement the core functional/cognitive aspects of *understanding* (e.g., forming manipulable representations that track meaning/reference, supporting robust inference and generalization), such that attributing 'understanding' is scientifically justified and explanatory?"**

  The UR position answers "Yes" to this functional/cognitive interpretation, while the SP position answers "No," maintaining that the observed competence is fully explained by sophisticated statistical pattern matching without genuine representational content or meaning-tracking.

  **Conclusion:** This statement reflects our genuine areas of agreement, precisely locates our core disagreement, identifies the crucial empirical questions (cruxes) whose resolution would significantly impact the debate, and proposes concrete tests for them. We commit to evaluating the results of such tests against the predictions outlined herein.

  ---

  **Defense of Drafting Decisions:**

  1.  **Agreed Claims:** Focuses on *demonstrable* behaviors and widely accepted constraints (scale effects, data dependence). Explicitly rules out strawmen (pure memorization, simple stats). Acknowledges lack of consciousness/biology without making them prerequisites for "understanding" in the debate.
  2.  **Disagreement Table:** Uses each side's core terminology ("non-derivative representational structures," "genuine understanding" for UR; "statistical compression," "lack grounding," "misleading" for SP). Phrases are direct statements each side would use, capturing the essence of their position without caricature.
  3.  **Cruxes & Tests:** Chosen because they cut to the heart of *how* competence is achieved (systematicity, generalization, mechanisms). Tests are concrete, feasible in principle, and focus on *behavior* and *mechanism* rather than unfalsifiable internal states. Predictions are specific and divergent. Novelty tests require robust contamination checks – essential for SP buy-in. Mechanistic tests focus on causality, not just correlation. Error analysis targets systematicity vs. stochasticity.
  4.  **Verical Dispute:** Explicitly dissolves the "human-like" or "consciousness" red herrings. Reframes the debate onto the functional/cognitive aspects of "understanding" (representation, inference, generalization) as the substantive core. This is the level where empirical evidence (from the cruxes) is most relevant.
  5.  **Terminology:** Uses "Understanding Realizer" (UR) as more precise than "supporter" and contrasts cleanly with "Stochastic Parrots" (SP). Uses "cognitive competence," "representational structures," "functional aspects" to anchor the UR view in non-biological cognitive science. SP view emphasizes "surface forms," "statistical pattern matching," "lack grounding."
  6.  **Commitment:** Avoids "some argue..." or survey language. Makes definitive choices on framing, cruxes, and test designs. Predictions are stated boldly. The verbal dispute clarification is a decisive framing choice.
  7.  **American English:** Uses terms like "modeled" (not "modelled"), "behavior" (not "behaviour"), "generalization" (not "generalisation"), "analyze" (not "analyse").
