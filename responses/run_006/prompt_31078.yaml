prompt: |-
  I work in the model risk group of a midsize consumer lender, and several times a year a business unit brings us a scoring model — built in-house or by a vendor — and asks us to sign off that it is fair across racial and other protected groups. Our sign-off is what allows the model to go into production, and we would be the ones defending that choice to regulators. I have no academic background in this area, but I have read enough on my own to understand that there are impossibility results in algorithmic fairness: roughly, a single score cannot generally be calibrated, have equal false positive rates across groups, and have equal false negative rates across groups at the same time when the outcome rates differ, so the instruction to make the model fair is not a specification anyone can simply satisfy. What I do not have is a way to turn that fact into a repeatable review procedure.

  Please write a decision procedure my team could actually run each time a model comes to us for sign-off. It should tell us, in order, which fairness properties to check, how to determine whether the impossibility result applies to the data in front of us, and when the review has to stop being a technical check and become a choice among trade-offs that our model risk committee — which includes legal and the business owner — must make. The procedure should be usable by people with no graduate statistical training, take no more than a few hours of analysis per model, and mark clearly which steps are judgment calls dressed up as computation. Then apply the procedure to two hypothetical models: a credit approval score where group approval rates differ, and a fraud score where the fraud base rates differ sharply. Make one of the applications a case where the procedure gives the business owner an answer they will not like, and end by saying what the procedure cannot settle. Please write the answer in American English.
reasoning: |-
  We are designing a decision procedure for evaluating fairness of scoring models in a regulatory context. The procedure must account for the impossibility theorem (which states that calibration, equal FPR, and equal FNR cannot all hold simultaneously when base rates differ) and be executable by non-experts in a few hours.

  The steps of the procedure:

  1. **Data Preparation and Preliminary Checks**:
     - Obtain the model's predictions (scores) and actual outcomes (labels) for each protected group (e.g., race, gender). Also, get the sample sizes for each group.
     - Check that the data is representative and that sample sizes are sufficient (e.g., no group has less than 100 observations). If not, flag for insufficient data and stop until resolved.
     - Compute the base rate (outcome rate) for each group.

  2. **Check for Base Rate Differences**:
     - Compare the base rates across protected groups. If the base rates are approximately equal (within a pre-defined tolerance, e.g., relative difference < 10%), then the impossibility result may not apply and we can aim for multiple fairness criteria. Otherwise, note that trade-offs will be necessary.

  3. **Evaluate Key Fairness Metrics**:
     - For each protected group, compute:
       - **Calibration**: For each group, check if the predicted probability matches the observed outcome rate. One way: group scores into bins (e.g., deciles) and check that within each bin, the average predicted score is close to the actual outcome rate. Alternatively, use statistical tests (e.g., Hosmer-Lemeshow) but keep it simple. We can compute the average absolute difference between the mean predicted score and actual outcome rate per group (or per bin) and set a threshold (e.g., max absolute difference <= 0.05).
       - **False Positive Rate (FPR)**: For a chosen threshold (if not provided, use one that yields a particular overall approval rate, e.g., 70%), compute FPR (proportion of actual negatives that are incorrectly predicted as positive) for each group.
       - **False Negative Rate (FNR)**: Similarly, compute FNR (proportion of actual positives that are incorrectly predicted as negative) for each group.
     - Note: The threshold may be set by the business. If not, we can use the threshold that yields the overall approval rate currently in use or that is being proposed.

  4. **Check for Impossibility Conditions**:
     - If base rates differ (step 2), then we cannot have all three: calibration, equal FPR, and equal FNR. Therefore, we check:
       - Is the model calibrated across groups? (If yes, then FPR and FNR will necessarily differ if base rates differ.)
       - Are FPRs and FNRs equal across groups? (If the base rates differ and the model is calibrated, then FPR and FNR cannot both be equal. If the model is not calibrated, then it might have equal FPR or equal FNR but not both without calibration.)

  5. **Decision Tree**:
     - **Case 1: Base rates are equal** (within tolerance): 
          - Check calibration, FPR, and FNR for equality across groups. If all are satisfied, the model is fair by multiple criteria. Sign off.
          - If one or more are not satisfied, then the model has fairness issues that must be addressed (e.g., bias in the model). Do not sign off without mitigation.
     - **Case 2: Base rates differ**:
          - We must choose which fairness criterion (or criteria) to prioritize. The model risk committee (including legal and business) must make this choice. We present the metrics and the trade-offs.
          - We can still check if the model meets one or two of the criteria. For example:
            - If the model is calibrated, then we report that FPR and FNR will differ and by how much. We then ask the committee: is the observed difference in FPR and FNR acceptable?
            - If the model is not calibrated, then we check if it meets either equal FPR or equal FNR (but not both, because base rates differ and without calibration, having both equal FPR and FNR would require base rates to be equal). We then report the deviations in the other metrics.

  6. **Reporting and Escalation**:
     - Create a report with:
          - Base rates by group.
          - Calibration metrics (e.g., mean absolute calibration error per group).
          - FPR and FNR by group at the chosen threshold.
          - A statement of whether the impossibility result applies (base rates differ) and which fairness criteria are met and which are not.
          - If base rates differ, a clear explanation of the trade-offs (e.g., "The model is calibrated, so FPR and FNR must differ. Here are the FPR and FNR by group: ... The business must decide if the observed differences are acceptable.").
     - If the model does not meet any of the fairness criteria (and base rates are equal, meaning it should) or if the trade-offs are unacceptable, then do not sign off. Otherwise, if the committee accepts the trade-offs, sign off.

  **Procedure in Steps (for the team to follow)**:

  1. **Gather Data**: For the model in question, get the following for each protected group (and overall):
     - The model scores (predictions) and the actual outcomes (binary: 0 or 1).
     - The sample size for each group.

  2. **Preliminary Check**: 
     - For each group, compute the base rate (mean of the actual outcomes). 
     - Check sample sizes: if any group has less than 100 observations, stop and request more data or note that the group is too small to assess.

  3. **Base Rate Comparison**:
     - Compute the relative difference in base rates between the group with the highest base rate and the group with the lowest: (max_base_rate - min_base_rate) / min_base_rate.
     - If the relative difference is less than 10%, then base rates are "equal". Otherwise, they "differ".

  4. **Set Threshold**: 
     - If the model is for binary classification (like credit approval or fraud), the business should provide a threshold for converting scores to decisions. If not, use the threshold that yields the overall approval rate that the business currently uses (e.g., 70% of applicants are approved).

  5. **Compute Fairness Metrics**:
     - **Calibration**: 
          - Option A (simple): Split the data into 10 bins by score (deciles). For each bin and each group, compute the mean predicted score and the mean actual outcome. The calibration error for a group is the average absolute difference between the mean predicted and mean actual in the bins (or the max absolute difference). If the average absolute error is <= 0.05, the group is calibrated. If all groups are calibrated, then the model is calibrated.
          - Option B (even simpler): For each group, compute the mean predicted score and the base rate. The absolute difference between the two should be <= 0.05. (This is a weak check but quick.)
     - **FPR**: For the chosen threshold, for each group, compute:
          FPR = (number of false positives) / (number of actual negatives)
     - **FNR**: For each group, compute:
          FNR = (number of false negatives) / (number of actual positives)

  6. **Check for Impossibility**:
     - If base rates are equal (step 3), then we expect that we can achieve all three: calibration, equal FPR, and equal FNR. So we check:
          - Are all groups calibrated? (using the threshold from step 5 for calibration? Note: calibration is independent of threshold. We use the entire data without threshold for calibration.)
          - Are FPRs across groups within a tolerance (e.g., absolute difference <= 0.05)? 
          - Similarly for FNRs.
       If all are within tolerance, sign off. If any fails, the model fails and must be fixed.
     - If base rates differ, then we cannot have all three. So we check:
          - Is the model calibrated? If yes, then we expect FPR and FNR to differ. We compute the FPR and FNR for each group and note the differences. We then escalate to the committee with the trade-off: "Model is calibrated, so FPR and FNR differ. The FPR for Group A is X, for Group B is Y. The FNR for Group A is P, for Group B is Q. The business must decide if these differences are acceptable given the base rates."
          - If the model is not calibrated, then we check if the business has a preference for either equal FPR or equal FNR. We then report the metric they care about and the deviations in calibration and the other rate. For example, if they want equal FPR, we check FPR. If FPR is equal (within tolerance), then we report that FNR will differ and calibration is off. We then ask the committee if the deviations in FNR and calibration are acceptable.

  7. **Committee Decision**:
     - When base rates differ, the committee must choose which fairness criterion to prioritize. The model risk group presents the metrics and the implications. The committee then makes a choice.

  **Hypothetical Models**:

  1. **Credit Approval Model**:
     - Scenario: We have two racial groups: Group A and Group B.
     - Base rates: Group A: 80% repayment rate (good outcome), Group B: 60% repayment rate.
     - The model is calibrated for both groups (calibration holds).
     - At the threshold that gives 70% overall approval, we compute:
          - Group A: FPR = 5%, FNR = 15%
          - Group B: FPR = 20%, FNR = 10%
     - Since base rates differ and the model is calibrated, we see that FPR and FNR are not equal. Specifically, Group B has a higher FPR (more false approvals) and a lower FNR (fewer false denials) than Group A.
     - The business might not like that Group B has a higher FPR (which could lead to more losses) or that Group A has a higher FNR (which might be denying creditworthy applicants). 
     - The committee must decide: is the observed difference in FPR and FNR acceptable? They might consider the business impact (losses from false approvals in Group B) and the fairness concern (higher denial of creditworthy in Group A). The model risk group does not make this decision but presents the facts.

  2. **Fraud Detection Model**:
     - Scenario: Two groups: Group X and Group Y.
     - Base rates: Group X: 1% fraud, Group Y: 10% fraud.
     - The model is not calibrated. We check the business's priority: they want equal FNR (because missing fraud is very costly and they want to treat both groups equally in terms of catching fraud). 
     - We set a threshold that gives an overall FNR of 5% (for both groups). Then we compute FPR:
          - Group X: FPR = 0.5% (very low because fraud is rare, so the model can be conservative without many false positives)
          - Group Y: FPR = 8% (higher because fraud is more common, so the model must be more aggressive to catch 95% of fraud, leading to more false positives)
     - The business owner might not like the high FPR in Group Y because it will lead to many legitimate transactions being declined for Group Y, which could cause customer dissatisfaction and loss of business. However, they prioritized equal FNR. 
     - The committee must decide: is the high FPR in Group Y acceptable in order to achieve equal FNR?

  **What the Procedure Cannot Settle**:
  The procedure cannot make the value judgment about which fairness criterion to prioritize when base rates differ. That decision must be made by the committee, considering legal, regulatory, business, and ethical perspectives. The procedure also cannot resolve if a particular trade-off (e.g., FPR difference of 15 percentage points) is acceptable; it only quantifies the trade-off.

  **Implementation Note**: The procedure requires setting tolerances (e.g., 10% for base rate relative difference, 5% for calibration error, and 5% for FPR/FNR differences). These tolerances should be set in consultation with legal and regulatory expectations and may be adjusted.

  This procedure is designed to be run by non-experts in a few hours, focusing on clear computations and then escalating the value judgments to the committee.
answer: |-
  ### Model Fairness Review Decision Procedure  
  This procedure provides a step-by-step workflow for evaluating model fairness. It requires **minimal statistical expertise**, uses **transparent computations**, and flags when decisions must be escalated to the Model Risk Committee (MRC). Expect **2–4 hours per model** for Steps 1–4.  

  ---

  #### **Step 1: Preliminary Checks**  
  **Objective**: Verify data readiness and identify protected groups.  
  **Actions**:  
  1. Confirm protected groups (e.g., race, gender) are clearly defined in the data.  
  2. Check sample sizes: Each group must have ≥100 observations. If not, **stop and request more data**.  
  3. Obtain:  
     - Model scores (continuous) for all applicants.  
     - Actual outcomes (binary, e.g., 0 = "default"/"fraud", 1 = "repay"/"legitimate").  
     - Threshold used to convert scores to binary decisions (e.g., "approve if score > 650").  

  **Judgment call**: If the business hasn’t set a threshold, use the one achieving their **target approval rate** (e.g., 70% overall approval). Document this assumption.  

  ---

  #### **Step 2: Check Base Rates**  
  **Objective**: Determine if outcome rates differ across groups (key to impossibility theorem).  
  **Computation**:  
  - For each group, compute:  
    **Base rate** = (Number of actual positive outcomes) / (Total group observations)  
  - Compare groups:  
    - **Relative difference** = |Max(base rate) - Min(base rate)| / Min(base rate)  
    - **Threshold**: If relative difference > 10%, base rates "differ significantly."  

  **Output**:  
  - If base rates differ significantly → **Proceed to Step 3** (impossible to satisfy all fairness criteria).  
  - If base rates are similar (relative difference ≤ 10%) → **Proceed to Step 4** (all criteria can be checked).  

  ---

  #### **Step 3: Diagnose Fairness Trade-offs (When Base Rates Differ)**  
  **Objective**: Quantify which fairness criteria fail due to the impossibility theorem.  
  **Computations** (for each group at the decision threshold):  
  1. **Calibration**:  
     - Bin scores into 5 equal-sized groups (e.g., 0–20th percentile, ..., 80–100th).  
     - Per bin, calculate:  
       *Average predicted score* vs. *Actual outcome rate*.  
     - **Pass/fail**: If the absolute difference between average score and outcome rate is ≤0.05 for all bins, the group is calibrated.  
  2. **False Positive Rate (FPR)**:  
     - FPR = (False positives) / (Actual negatives)  
     - **Pass/fail**: FPRs across groups differ by ≤0.05 (absolute difference).  
  3. **False Negative Rate (FNR)**:  
     - FNR = (False negatives) / (Actual positives)  
     - **Pass/fail**: FNRs across groups differ by ≤0.05 (absolute difference).  

  **Interpretation**:  
  - **If calibration holds**: FPR and FNR *cannot* be equal across groups (per impossibility theorem). Compute:  
    - ΔFPR = |FPR<sub>Group1</sub> - FPR<sub>Group2</sub>|  
    - ΔFNR = |FNR<sub>Group1</sub> - FNR<sub>Group2</sub>|  
  - **If calibration fails**: Check if FPR *or* FNR is equal (both cannot hold).  

  **Escalation**:  
  - **Stop technical review**. Document:  
    > "Base rates differ significantly (Δ = [value]%). Per fairness impossibility theorem, the model cannot satisfy calibration, equal FPR, and equal FNR simultaneously. Trade-offs must be evaluated by MRC."  
  - Provide metrics:  
    - Base rates by group.  
    - Calibration status (pass/fail per group).  
    - FPR/FNR by group and Δ values.  

  ---

  #### **Step 4: Full Fairness Check (When Base Rates Are Similar)**  
  **Objective**: Verify if all three criteria hold (expected when base rates align).  
  **Actions**:  
  1. Repeat all computations from Step 3.  
  2. **Pass/fail**:  
     - Model "fair" only if all groups pass calibration, FPR parity (ΔFPR ≤ 0.05), and FNR parity (ΔFNR ≤ 0.05).  

  **Escalation**:  
  - If any criterion fails → **Do not sign off**. Flag to MRC: "Model fails basic fairness checks despite similar base rates."  

  ---

  ### Application to Hypothetical Models  

  #### **Case 1: Credit Approval Model (Business Won’t Like the Result)**  
  **Context**:  
  - Groups: Race (A: 70% of applicants, B: 30%).  
  - Base rates: Repayment rate for A = 90%, B = 70% (relative difference = |0.9-0.7|/0.7 = 29% > 10% → **differ significantly**).  
  - Threshold: Score > 600 (80% overall approval).  
  - Results at threshold:  
    | Group | Calibration | FPR | FNR |  
    |-------|-------------|-----|-----|  
    | A     | Pass        | 4%  | 5%  |  
    | B     | Pass        | 12% | 8%  |  

  **Analysis**:  
  - Calibration holds for both groups → **FPR and FNR cannot be equal** (ΔFPR = |4%-12%| = 8% > 5%, ΔFNR = |5%-8%| = 3% ≤ 5%).  
  - **Trade-off**: Group B has 3× higher FPR (more false approvals) than Group A, increasing risk of losses.  

  **MRC Escalation**:  
  > "Model is calibrated but violates FPR parity (ΔFPR = 8%). Group B has significantly higher false approvals. MRC must decide:  
  > - Accept the higher risk in Group B?  
  > - Adjust threshold for Group B (may violate calibration)?  
  > - Reject the model?"  

  **Business impact**: Approval rate for Group B drops to 65% if threshold is tightened to equalize FPR → **reduced revenue from Group B**.  

  ---

  #### **Case 2: Fraud Detection Model**  
  **Context**:  
  - Groups: Transaction type (X: "in-store", Y: "online").  
  - Base rates: Fraud rate for X = 0.5%, Y = 10% (relative difference = |0.1-0.005|/0.005 = 1900% → **differ significantly**).  
  - Threshold: Score > 0.7 (flags 2% of transactions as fraud).  
  - Results at threshold:  
    | Group | Calibration | FPR     | FNR  |  
    |-------|-------------|---------|------|  
    | X     | Fail        | 0.1%    | 60%  |  
    | Y     | Fail        | 15%     | 25%  |  

  **Analysis**:  
  - Calibration fails → Check FPR/FNR parity:  
    - ΔFPR = |0.1%-15%| = 14.9% > 5% → **FPR not equal**.  
    - ΔFNR = |60%-25%| = 35% > 5% → **FNR not equal**.  
  - **Trade-off**: Prioritizing equal FNR would require accepting 4× higher FPR for Group X (risking customer backlash).  

  **MRC Escalation**:  
  > "Model satisfies no fairness criteria. Base rates differ sharply, making trade-offs unavoidable. MRC must choose:  
  > - Prioritize equal FNR (missed fraud)? Requires lowering threshold for Group X.  
  > - Prioritize equal FPR (false alarms)? Requires raising threshold for Group Y.  
  > - Accept status quo (Group X has high missed fraud, Group Y has high false alarms)?"  

  ---

  ### What This Procedure **Cannot** Settle  
  1. **Threshold selection**: Business must define acceptable risk/approval rates.  
  2. **Criterion prioritization**: When base rates differ, MRC must choose between calibration, FPR, or FNR as the primary goal (legal/compliance input required).  
  3. **Legality**: Passing this procedure ≠ legal compliance. Legal counsel must review outcomes.  

  **Final Output**: A standardized report with metrics, pass/fail status, and escalation flags for MRC deliberation.
