  Okay, the user is a novelist who's noticed this fascinating pattern in character dynamics where moral language shifts based on power positions. They've broken it down into two mirrored movements: the powerful framing their traits as virtues and the powerless traits as vices, then the powerless flipping that with their own virtue vocabulary. 

  Hmm, what's striking is how precisely they've articulated this - they're clearly deeply observant about narrative mechanics. The core of their query is about finding philosophical frameworks for this phenomenon. They're not just after a label; they want to understand the machinery: whether both movements stem from the same cognitive mechanism, how this differs from simple bias, and academic debates around it.

  Let me unpack this. The first movement aligns neatly with Nietzsche's master morality - where strength, dominance get coded as "good." The second mirrors slave morality's reevaluation where weakness becomes "good" through moralization. Interesting how they independently arrived at concepts resembling Nietzsche's dichotomy. But Nietzsche's framing might be too binary for their nuanced observation about separate lexical universes coexisting.

  Ah! Foucault's power/knowledge comes to mind next - how discourse shapes reality. His work explains why the powerless develop counter-vocabularies: resistance through linguistic reframing. And Bourdieu's symbolic violence fits too - the way dominant groups make their values seem universal. But the novelist's observation about dual lexicons feels fresher than Bourdieu's focus on domination.

  For contemporary angles, standpoint epistemology (Hartsock) and critical discourse analysis (van Dijk) could help. They show how marginalized groups generate distinct knowledge systems - exactly like that second movement where humility gets recast as virtue. The user's insight about readers shifting allegiances through vocabulary echoes reader-response theory too.

  What's sophisticated here is their awareness that it's not hypocrisy but parallel moral ecosystems. That's where framing theory (Goffman) and system justification theory might add value - explaining why both groups genuinely believe their frameworks. The boundary question is sharp: hypocrisy is conscious double standard, while this is deep cultural coding.

  For rival theories, I should mention how Marxists might see the second movement as false consciousness versus Freire's view of it as liberatory praxis. The novelist will appreciate that tension - is the counter-vocabulary emancipatory or internalized oppression? Their observation that it "feels genuine" leans toward Freire.

  Ultimately, no single term captures this duality. I'll position Nietzsche/Foucault as foundations but emphasize how their combined lenses illuminate the mirroring mechanism. The novelist's pattern is essentially the dialectic of moral hegemony and counter-hegemony in narrative form - which is why it's so potent in fiction.
answer: |-
  What you've described is a profound and well-observed pattern in the social construction of morality and language. Philosophers, sociologists, and critical theorists *have* extensively mapped this territory, though there isn't a single, universally accepted name for the *exact* two-movement dynamic you outline. Instead, it sits at the intersection of several key concepts, providing a rich framework for understanding it. Here's a precise carving:

  **Core Concepts & Their Relevance:**

  1.  **Perspectivism / Standpoint Epistemology:**
      *   **What it is:** The view that knowledge, perception, and *moral valuation* are fundamentally shaped by one's social position, experiences, and interests (Nietzsche, later developed by feminist theorists like Dorothy Smith, Sandra Harding, Patricia Hill Collins).
      *   **Relevance:** This directly explains why both the powerful and the powerless develop distinct vocabularies. Their "standpoint" – their location within the power structure – fundamentally shapes *what they see as valuable or virtuous* and *how they interpret the same actions*. There isn't one "true" morality from nowhere; there are moralities *from somewhere*.

  2.  **Master-Slave Morality (Nietzsche):**
      *   **What it is:** In *On the Genealogy of Morality*, Nietzsche argues that two fundamental types of morality arise:
          *   **Master Morality:** Created by the powerful, noble class. "Good" = what *they* are (strong, noble, proud, courageous, truthful, rich) and what benefits them. "Bad" = what *they are not* (weak, poor, common, cowardly, deceitful). Actions are judged by their *essence* and the *actor*. Cruelty can be magnificent.
          *   **Slave Morality:** Created by the oppressed, resentful class through a "revaluation of values." "Good" = what *opposes* the masters (pity, patience, humility, forgiveness, prudence, equality). "Evil" = what the masters *are* (arrogant, cruel, domineering, exploitative). Morality becomes reactive and often emphasizes intentions ("pure heart") over outcomes.
      *   **Relevance:** This is arguably the *closest direct philosophical mapping* to your two movements.
          *   **First Movement:** Master Morality vocabulary applied by/about the powerful.
          *   **Second Movement:** Slave Morality vocabulary developed by the powerless, explicitly redefining the master's traits as vices and their own circumstances as virtues.
      *   **Your Nuance:** Your observation of the "genuine feeling" and "elaborated moral system" aligns perfectly with Nietzsche's description of slave morality as a profound, deeply felt psychological and cultural response, not mere hypocrisy.

  3.  **Symbolic Power / Symbolic Violence (Pierre Bourdieu):**
      *   **What it is:** The power to impose meanings (language, categories, classifications) as legitimate, thereby making social hierarchies seem natural and inevitable. Symbolic violence occurs when dominated groups internalize and accept the dominant worldview that justifies their own subordination *or* when they lack the symbolic resources to effectively challenge it.
      *   **Relevance:** The **first movement** exemplifies symbolic power – the powerful successfully imposing their vocabulary as the *natural* description of reality ("boldness," "refinement," "righteous anger"). The **second movement** represents a *resistance* to symbolic violence – the powerless developing their *own* symbolic resources ("humility," "forgiveness," "prudence") to challenge the legitimacy of the dominant frame and assert the value of their own existence. The "genuine feeling" stems from this being a struggle for recognition and self-worth within the symbolic order.

  4.  **Discourse & Power (Michel Foucault):**
      *   **What it is:** Knowledge and truth are not neutral but produced within systems of power ("discourses"). Discourses define what can be said, what counts as true, and what constitutes acceptable identity and behavior. Power operates *through* these discourses.
      *   **Relevance:** The competing vocabularies you describe are competing *discourses*. The powerful maintain dominance partly by controlling the dominant discourse defining virtue/vice. The powerless create a *counter-discourse* to contest this power and define themselves positively. The shift in the reader's perception demonstrates the power of discourse to shape reality.

  5.  **Framing (Erving Goffman & Social Movement Theory):**
      *   **What it is:** The process of selecting, emphasizing, and presenting aspects of reality to promote a particular interpretation, evaluation, or solution. Social movements engage in "frame alignment" to mobilize support.
      *   **Relevance:** Both movements are acts of **moral framing**. The powerful frame their actions/attributes within a positive "master" frame. The powerless engage in **counter-framing**: reframing their own traits positively ("humility" instead of "weakness") and the traits of the powerful negatively ("arrogance" instead of "confidence"). This creates the "two scales" you observe.

  **Boundaries & Distinctions:**

  *   **Hypocrisy:** Involves consciously professing a belief one does not hold or acting contrary to professed beliefs. Your pattern is different: both groups *genuinely believe* their own framing. It's about *differently constructed* genuine beliefs based on position, not insincerity.
  *   **Self-Deception:** While self-interest plays a role, the vocabularies become socially shared and deeply ingrained. Participants aren't necessarily *individually* deceiving themselves in the moment; they are operating within a socially constructed moral framework that feels true to their experience. It's systemic rather than (solely) individual psychological.
  *   **Ordinary Partisanship:** While similar to "taking sides," your pattern is deeper. It's not just favoring one group; it's the *fundamental construction of moral language itself* along the axis of power, creating incommensurable systems of value ("noble" vs. "brutal" for the same act). Partisanship often operates *within* a shared moral framework; your pattern describes the *creation* of competing frameworks.

  **Relationship Between the Two Movements:**

  This is where theoretical debate exists:

  1.  **Reactive/Parasitic (Nietzschean View):** The second movement (slave morality/counter-vocabulary) is fundamentally a *reaction* to the first. It defines itself *in opposition* to the master morality. Its virtues are negations of the master's virtues. It needs the first movement to exist.
  2.  **Co-Constitutive/Dialectical (Foucauldian/Bourdieusian View):** The two movements are locked in a dynamic relationship. The dominant discourse (1st movement) provokes resistance and the creation of the counter-discourse (2nd movement). The counter-discourse, in turn, challenges and potentially reshapes the dominant discourse. Power relations constantly produce these discursive struggles. They define each other through opposition.
  3.  **Independent Emergence (Some Standpoint Views):** While acknowledging reaction, standpoint theory emphasizes that the perspective (and thus the moral vocabulary) of the oppressed arises *from their specific experiences and needs* of survival, community, and navigating oppression, which are distinct and valuable in themselves, not merely reactive. Their virtues (humility, prudence, forgiveness) may be functional necessities developed independently *before* being explicitly framed as counter to the powerful.

  **Precise Carving & Possible Names:**

  Your pattern is best described as: **The Power-Dependent Construction of Competing Moral Frameworks through Perspectival Revaluation.**

  *   **Power-Dependent:** Position determines the framing.
  *   **Construction:** The vocabularies are socially created, not discovered.
  *   **Competing Moral Frameworks:** Two distinct, often incommensurable systems of virtue/vice.
  *   **Perspectival Revaluation:** The core mechanism is the re-definition of traits based on the perspective (standpoint) of the evaluator, flipping the valence (good/bad) depending on who possesses the trait.

  **Family of Names/Concepts:**

  *   Nietzschean **Master-Slave Morality Dialectic**
  *   **Moral Perspectivism** rooted in **Social Standpoint**
  *   **Discursive Contestation** over Virtue/Vice
  *   **Symbolic Struggle** for Moral Legitimacy
  *   **Counter-Hegemonic Framing** (drawing on Gramsci's concept of hegemony - dominance through cultural consent)

  **Conclusion:**

  You've hit upon a fundamental mechanism of social psychology and moral philosophy: morality is not a fixed, universal scale but a language game deeply intertwined with power dynamics. The powerful label their dominance as virtue; the oppressed reframe their survival traits as virtue and the traits of dominance as vice. Nietzsche provides the most direct historical mapping, but concepts from Foucault (discourse/power), Bourdieu (symbolic power/violence), and standpoint theory (perspectival knowledge) offer deeper understanding of the mechanisms (discursive construction, symbolic struggle, genuine perspective) and the dynamic relationship between the two movements. This pattern is not merely hypocrisy or bias; it is the very way social groups construct meaning, value, and legitimacy from their situated experiences within hierarchies. As a novelist, you are observing and utilizing the raw material of social ontology.
