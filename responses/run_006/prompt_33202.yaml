prompt: |-
  I spent thirty years in atmospheric physics and retired a couple years back. Since then I've been reading a lot of philosophy—never had the time before—and I've gotten particularly interested in the philosophy of probability. I just finished Keynes's *Treatise on Probability* and it's been gnawing at me, because it's making me rethink something I used to take for granted without a second thought.

  The IPCC has this whole calibrated language system for communicating uncertainty in its assessment reports. They've been using it since the Third Assessment Report, and it's still in place. The scale goes: "virtually certain" means 99–100% probability, "very likely" means 90–100%, "likely" means 66–100%, "about as likely as not" is 33–66%, and then "unlikely," "very unlikely," and "exceptionally unlikely" on the low end. Every key finding in the summary for policymakers gets one of these labels. The stated goal is to make uncertainty communication consistent and transparent across working groups, and I've sat in enough IPCC meetings to know how seriously they take this.

  Now, Keynes's big move in the *Treatise* is that probability is a logical relation between evidence and conclusion, and he argues that not all probabilities are numerically measurable or even comparable. Some are just not on a single scale—you can have good grounds for believing something without being able to stick a number on it. He distinguishes situations of "risk" (where you can calculate probabilities from known frequencies or symmetries, like a dice roll) from genuine "uncertainty" (where the basis for numerical judgment simply isn't there), and he thought a lot of the most important decisions we face fall into the second category. Climate projections would seem to be a textbook case of the second category: a one-off system, no ensemble of identical Earths to sample from, deep structural uncertainties about feedbacks and tipping points. And yet here's the IPCC, assessing the most complex system on the planet, assigning precise numerical probability ranges to essentially every major conclusion.

  So here's what I can't quite work out on my own. What theory of uncertainty does the IPCC's calibrated-language practice actually presuppose? Does it implicitly assume that all climate-relevant uncertainties are quantifiable—that they're all in Keynes's "risk" bucket? Or is the practice compatible with Keynes's view, maybe because the probability ranges are meant as subjective degrees of belief rather than frequencies? And if Keynes is right that some genuinely important knowledge is non-probabilistic—that a conclusion can be well-supported by evidence without a number attached—what would the IPCC's uncertainty communication practice have to look like instead? Would the whole thing collapse, or could it be reformed to accomodate Keynesian uncertainty without losing the consistency they're after?
reasoning: |-
  Okay, let me try to unpack this atmospheric physicist's dilemma. They've spent three decades in the field, retired, and now diving deep into philosophy of probability with Keynes' Treatise. The core tension is between IPCC's numerical uncertainty language and Keynes' view that some probabilities can't be quantified.

  Hmm... first I need to recall Keynes' key distinctions. Risk vs uncertainty is crucial here - dice rolls versus complex, unique systems like Earth's climate. The IPCC's percentage ranges (99-100% for "virtually certain" etc.) seem to assume everything is quantifiable, but is that valid?

  Right, the user's background matters here. As an ex-IPCC insider, they've seen how seriously the calibrated language is taken. But now they're questioning its philosophical foundations. The real pain point seems to be: did their life's work in climate science rest on shaky probabilistic assumptions?

  Let me break this down systematically. First, what theory does IPCC actually use? The guidance documents mention multiple uncertainty types - but the calibrated scale flattens them all into numbers. Interesting that they explicitly include expert judgment alongside models and data. That suggests a Bayesian/subjective element.

  But Keynes would object that even expert beliefs can't always be linearized. Like when assessing tipping points - we know they're possible but can't meaningfully say "40% vs 60% probable". The IPCC sort of acknowledges this with "low confidence" qualifiers, but keeps pushing for numbers.

  The reform ideas are tricky. If we followed Keynes strictly, would IPCC summaries just have giant asterisks everywhere? That might undermine policy usefulness. But current practice risks false precision. Maybe confidence levels could expand beyond likelihood statements? Like distinguishing "robust evidence" from "quantifiable uncertainty".

  Wait - the user also asks if the whole system would collapse without numbers. Probably not, but it would look very different. German Advisory Council's approach comes to mind: using qualitative uncertainty descriptors without percentages. Though that might lose IPCC's cross-working-group consistency.

  Ultimately IPCC is walking a tightrope between scientific rigor and policy relevance. Their solution privileges communicability, but our physicist is right to question whether Keynesian uncertainty gets sidelined. The deepest issue might be: can we quantify the unquantifiable without misrepresenting knowledge?
answer: |-
  Your background gives you a unique perspective on this tension—a practitioner deeply familiar with IPCC processes now grappling with Keynes's critique of probabilistic reductionism. Let's break this down systematically:

  ### 1. **IPCC's Implicit Theory of Uncertainty**
  The IPCC calibrated language system implicitly blends **frequentist, model-based, and Bayesian/subjective** elements:
  - **Frequentist foundations**: Where robust observational data or large model ensembles exist (e.g., "CO₂ causes warming"), probabilities draw on empirical distributions.
  - **Expert Elicitation as Bayesian Priors**: For irreducible uncertainties (e.g., climate sensitivity), probabilities represent *subjective degrees of belief* from structured expert judgment (SEJ) processes. The AR6 explicitly states likelihoods "reflect the expert assessment of the author teams."
  - **Pragmatic Hybridization**: The system assumes all uncertainties *can be mapped to a common numerical scale* for policy coherence, regardless of their epistemic nature. This is closer to Frank Knight's operationalization than Keynes's strict duality.

  ### 2. **Keynesian Critique: Where IPCC Practice Strains**
  - **Non-Comparable Probabilities**: Keynes argues some probabilities are ordinal (A > B) but not cardinal (no meaningful %). IPCC's fixed percentage bins force cardinality onto phenomena like cloud feedback uncertainties, where models disagree structurally.
  - **Unquantifiable "Weight of Evidence"**: For tipping points (e.g., AMOC collapse), evidence may justify "non-negligible risk" but resist meaningful quantification. IPCC handles this via "low confidence" qualifiers (e.g., AR6 on abrupt ice-sheet changes), but still assigns likelihoods when possible.
  - **Model Dependence ≠ Real-World Frequencies**: Climate projections rely on model ensembles (e.g., CMIP6), generating *synthetic* frequencies. Keynes would question treating these as true probabilities for a unique Earth system.

  ### 3. **Could Keynes and IPCC Coexist? Partial Compatibility...**
  - **Subjective Probability Bridge**: IPCC's use of expert judgment aligns with Keynes's allowance for rational belief degrees *if* based on logical evidence-relation. The SEJ protocols (e.g., Sheffield elicitation framework) systematize this.
  - **Where It Fails**: When evidence is fundamentally incomplete (e.g., paleoclimate analogues for +3°C worlds), assigning "66-100% likely" may imply false precision. Keynes would see this as category error.

  ### 4. **Reforming IPCC Uncertainty Communication: A Keynesian Approach**
  You couldn't simply discard the system—but could augment it to reflect irreducible uncertainty:
  - **Explicit Uncertainty Typology**: Tag each finding with its epistemic basis:
    - **Q** (Quantifiable: model ensembles/observations)  
    - **S** (Subjective: expert judgment with quantifiable range)  
    - **K** (Keynesian: ordinal or non-comparable evidence)  
    *Example*: "High confidence [K] that uncertainty in ECS remains large."  
  - **Non-Probabilistic Confidence Statements**: For Keynesian uncertainties, use only:
    - "Strong evidence supports X, though quantification is indeterminate"  
    - "Evidence directionally points to Y, with high epistemic uncertainty"  
  - **Tiered Confidence Language** (expanded from current "low/medium/high"):  
    | Confidence Level | Meaning (Keynesian) |
    |------------------|----------------------|
    | **Robust** | Evidence is conclusive, mechanism understood |
    | **Convergent** | Multiple lines of evidence point same way |
    | **Indicative** | Limited evidence, requires caution |
    | **Speculative** | Theoretically plausible but weakly constrained |

  ### 5. **Feasibility and Challenges**
  - **Policy Utility vs. Philosophical Rigor**: Policymakers need actionable guidance. Pure Keynesian reporting might seem evasive (e.g., "We know risks are non-trivial but can't quantify them").  
  - **Scientific Consensus Preservation**: Numerical scales enable aggregation across disciplines. Replacing them with qualitative descriptors could reintroduce inconsistency.  
  - **Middle Path**: The German Advisory Council on Global Change (WBGU) uses a hybrid: probabilities *only* for well-constrained uncertainties, supplemented by narrative "risk hotspots" for complex uncertainties.  

  ### Final Thought
  The IPCC system is a pragmatic response to political demand for "certainty about uncertainty." Yet as you note, climate science's hardest problems—tipping cascades, deep-time analogues—are profoundly Keynesian. A reformed framework could **retain quantification where defensible** while **legitimizing non-probabilistic reasoning** where needed. This wouldn't collapse the system but would honor the true texture of knowledge in Earth system science—where some truths are better seen through a Keynesian lens than forced into a percentage bin.

  > *"About these matters there is no scientific basis on which to form any calculable probability whatever. We simply do not know."*  
  > —Keynes, *The General Theory* (1937)
