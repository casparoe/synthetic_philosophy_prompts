prompt: |-
  I'm running a grad seminar on reasons and rationality — about 10 students, a bit under two hours. I want to design an activity that makes them feel the pull of the wrong kind of reasons problem before we read the literature on it. You know the basic setup: an evil demon will punish you unless you admire him, so you've got a pragmatic reason to admire him, but it doesn't seem like the *right* kind of reason — it doesn't make him admirable. The puzzle is saying what the difference consists in.

  I want the students to generate the puzzle themseves. So I need a set of cases, a procedure, and a debrief. The cases should include both epistemic and practical attitudes — beliefs, desires, admiration, resentment, fear, etc. — and mix in some where pragmatic reasons *do* seem like the right kind (like: you'll get paid if you desire to eat a bug, because that'll help you actually do it). The activity should force them to try to articulate a principle, fail in interesting ways, and then see why the problem is hard.

  Give me the case set (maybe 8–10 short vignettes), the step-by-step procedure with timing, debrief notes that map moments in the activity to the philosophical terrain, and a candid note on what predictably goes wrong and which part of the problem the activity can't get at.
reasoning: |-
  Okay, the user is teaching a grad seminar on reasons and rationality and wants an activity to help students grasp the "wrong kind of reasons" problem before diving into the literature. They need something interactive where students generate the puzzle themselves. 

  Hmm, the core challenge here is designing vignettes that create the right cognitive friction - cases where pragmatic reasons clearly feel illegitimate (like admiring a demon to avoid punishment) alongside ones where they seem valid (desiring to eat a bug for money). The activity must force students to articulate a principle and fail, making the philosophical problem visceral. 

  *Brain starts sorting attitude types* Should cover epistemic (belief), conative (desire), and reactive attitudes (admiration, resentment). Need that demon case for the classic pull, but also subtler ones - maybe a "fear of puppies" scenario where pragmatic reasons feel absurd? And must include positive controls like the bug-eating desire where instrumental reasons are legit. 

  *Checks structural requirements* User wants 8-10 vignettes, timed procedure, debrief mapping, and candid pitfalls. The predictably messy part will be students conflating reasons with motives or over-relying on truth-aptness. Important to note the activity won't solve the meta-problem of what makes a reason "right" - just sets up the aporia. 

  *Drafts vignette list* Demon (admiration), lottery (belief), puppies (fear), bug-eating (desire - valid case), resentment of benefactor... adding "pride in plagiarism" for moral attitude and "intending to procrastinate" for intention to show instrumental reasons sometimes work. Deliberately including a red herring (the last envy case) to trip them up. 

  *Structures timing* 10min intro, 20min sorting, 30min principle-building - that crucial moment when they realize their criteria keep failing. Debrief should highlight how Kolodny/Schroeder distinguish state-given vs. object-given reasons without naming theories yet. 

  *Mentally tests pitfalls* Yes, students will 100% say "pragmatic reasons don't make the attitude rational" but then struggle with the bug-eating case. Good - that's exactly where the deeper problem emerges. Should explicitly flag in debrief how this connects to the literature's central dichotomy. 

  Final note: The envy vignette is designed to expose their residual intuition that pragmatic reasons could sometimes be "right" if they cause fittingness, foreshadowing consequentialist responses. That's the hook for later readings.
answer: |-
  Here’s a structured seminar activity designed to make students *feel* the Wrong Kind of Reasons (WKR) problem through guided discovery. The focus is on generating intuitive tension, failed criteria, and a clear path into the literature.

  ---

  ### **Activity: "Reasons Sorting"**
  **Goal:** Students articulate why some pragmatic reasons feel "wrong" for certain attitudes, fail to define a consistent principle, and confront the puzzle’s depth.  
  **Time:** 105–115 minutes  
  **Materials:** Printed vignettes (1 set/group), whiteboard, timer.

  ---

  ### **Vignettes (8 Cases)**
  > **Key:** ✅ = Pragmatic reason intuitively *works*  
  > ❌ = Pragmatic reason feels *wrong*  
  > *(Mix to disrupt quick generalizations)*

  1. **Admiration (Demonic Threat) ❌**  
     *An evil demon threatens to torture your family unless you *admire* him. You have strong reason to cultivate admiration for him.*  

  2. **Belief (Lottery Pragmatism) ❌**  
     *A billionaire offers you $10M if you can *genuinely believe* you’ll win the lottery (despite 1 in 100M odds). You have reason to make yourself believe it.*  

  3. **Fear (Puppy Phobia Incentive) ❌**  
     *A therapist pays you $1,000 each time you *feel genuine fear* toward a harmless puppy. You want the money.*  

  4. **Resentment (Forgiveness Bounty) ❌**  
     *A charity pays $5,000 to anyone who *resents* their greatest benefactor for 24 hours. You need the funds.*  

  5. **Desire (Bug-Eating Reward) ✅**  
     *You’ll earn $500 if you *desire* to eat a live cricket. Since desiring it helps you actually eat it, you have reason to cultivate the desire.*  

  6. **Intention (Procrastination Penalty) ✅**  
     *Your boss fines you $200 unless you *intend* to start working now. Forming the intention helps you act, so you have reason to intend it.*  

  7. **Pride (Plagiarism Prize) ❌**  
     *A journal awards $10,000 for the best essay *proudly defending plagiarism*. You have reason to make yourself feel proud of plagiarism.*  

  8. **Envy (Job Sabotage Bonus) ❌/✅?**  
     *A rival company pays you if you *envy* your talented colleague. Envying her motivates you to outperform her, improving your work.*  

  ---

  ### **Procedure**  
  *(Total: 105 min)*  

  1. **Intro & Framing (10 min)**  
     - *Pose:* "When do pragmatic incentives (money, threats) give us *genuine reasons* for attitudes (beliefs, desires, emotions)?"  
     - *Example:* "If I pay you to *want* coffee, does that give you a real reason to want it?"  
     - *Task:* "Today, you’ll sort cases where pragmatic reasons feel ‘legit’ vs. ‘fishy’ and try to explain why."  

  2. **Small-Group Sorting (20 min)**  
     - Groups of 2–3. Give each a shuffled set of vignettes.  
     - *Task:* Sort into 3 piles:  
       - **Pile A:** Pragmatic reason feels like it *works* (attitude becomes fitting/rational).  
       - **Pile B:** Pragmatic reason feels *wrong* (doesn’t make attitude fitting).  
       - **Pile C:** *Unsure/Conflicted*.  

  3. **Group Report-Out (15 min)**  
     - Groups share sorts. *Focus on disagreements* (e.g., "Why did you put Fear in A but others in B?").  
     - **Predictable Tensions:**  
       - Bug-Eating Desire (✅) vs. Demon Admiration (❌) — both involve incentives for conative states.  
       - Envy case splits groups (instrumental value vs. moral unease).  

  4. **Principle-Building Challenge (30 min)**  
     - *Task:* "Define a rule that explains ALL your sorts. When *exactly* is a pragmatic reason the ‘right kind’ of reason for an attitude?"  
     - Groups draft criteria. *Push them:* "Does your rule handle the Puppy Fear case? What about Bug-Eating?"  
     - **Predictable Failed Principles:**  
       - "Reasons must make the attitude *true/accurate*" → Fails desires/intentions (no truth value).  
       - "Reasons must align with morality" → Fears/admiration can be immoral but still fitting (e.g., fearing a murderer).  
       - "Reasons must cause the attitude" → Works for all cases (too broad).  

  5. **Debrief & Synthesis (30 min)**  
     - Groups share principles. Highlight contradictions using the board:  
       | **Case** | **Common Principle** | **Why It Fails** |  
       |----------|------------------------|------------------|  
       | Demon Admiration | "Reasons must make the attitude *correct*" | What makes admiration *correct*? Not demon’s threat. |  
       | Lottery Belief | "Reasons must be *truth-directed*" | Works for belief, but not for desire (Bug-Eating ✅). |  
       | Puppy Fear | "Reasons must track real danger" | Ignores that fear can be fitting *without* danger (e.g., horror movies). |  
       | Plagiarism Pride | "Reasons must be moral" | Pride could be fitting for amoral achievements (e.g., winning a game). |  
     - **Core Insight:** Pragmatic reasons often feel "wrong" when disconnected from the *grounds that make the attitude fitting* (e.g., threats don’t make demons admirable; money doesn’t make puppies dangerous).  
     - **Bridge to Literature:** "This is the WKR problem: What *is* the ‘right kind’ of reason? Is it about the *object* of the attitude? The nature of the attitude? We’ll see how Schroeder, Hieronymi, and others tackle it."  

  ---

  ### **Debrief Notes: Mapping to Philosophy**  
  - **Demonic Threat (❌):** Classic "state-given" reason (Rabinowicz, Olson) vs. "object-given" reason. The threat targets the *state* of admiration, not properties of the demon.  
  - **Bug-Eating Desire (✅):** Instrumental reasons *can* be "right" for conative attitudes because desires respond to value in the outcome (Schroeder’s *hypotheticalism*).  
  - **Lottery Belief (❌):** Highlights "evidentialism" (beliefs require truth-tracking reasons). Pragmatic incentives aren’t evidence.  
  - **Envy Case (Split):** Tests "consequentialist" solutions (if the reason *causes* fitting envy, is it "right"?). Foreshadows the "toxin puzzle" (Kavka).  
  - **Meta-Problem:** The activity surfaces *why* WKR is hard: We lack a unified theory of "fittingness" for all attitudes (belief, emotion, intention).  

  ---

  ### **Candid Pitfalls & Limitations**  
  1. **Predictable Struggles:**  
     - Students will conflate *motivation* (what causes the attitude) with *justification* (what makes it fitting).  
     - They’ll overgeneralize from belief cases ("reasons must be evidence!") and stumble on desire/emotion.  
     - The envy case often sparks productive chaos: Some argue instrumental reasons *can* be "right" if they induce fittingness (e.g., envy motivates self-improvement).  

  2. **What the Activity Can’t Capture:**  
     - **Meta-Normativity:** Why *should* we care about "fittingness"? The activity assumes intuitions about rationality but doesn’t interrogate their foundation.  
     - **Attitude-Specific Solutions:** Later readings (e.g., Hieronymi’s "commitment" view) require deeper analysis of each attitude’s "constitutive goal."  
     - **Formal Paradoxes:** The activity won’t reveal logical issues like the "test case" paradox (Stratton-Lake).  

  **Why It Works:** Students leave frustrated by their failed principles—primed to appreciate canonical solutions (e.g., "object-given reasons") and the stakes of the debate (e.g., Can rationality demand immoral attitudes?).  

  ---
  **Next Step:** Assign Schroeder’s "The Ubiquity of State-Given Reasons" or Hieronymi’s "The Wrong Kind of Reason." The activity ensures they *feel* the problem before parsing the theory.
