prompt: |-
  I've been thinking about whether it's ever okay to lie, and I keep coming back to that Kant example with the murderer at the door. A couple days ago my friend was explaining Kant's position to me and she summarized it like this:

  "Kant said you can never lie under any circumstances, period. His reasoning is that if you lie to the murderer, you're using him as a mere means to save your friend, which violates the categorical imperative. Even if telling the truth gets someone killed, that's on the murderer's conscience, not yours — Kant thinks consequences are totally irrelevant to morality anyway. So you have to look the murderer in the eye and tell him exactly where your friend is hiding. And if you do lie, you actually become morally responsible for whatever happens after that, because you interfered with the natural course of events."

  Something about this feels too extreme and I wonder if she's getting it right or if there's more nuance. Can you break down what's accurate and what might be a misrepesentation? I'm not a philosophy student so go easy on the jargon please.
