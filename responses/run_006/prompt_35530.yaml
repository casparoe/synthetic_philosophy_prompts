answer: |-
  You're right to question this—it's one of the most debated examples in ethics, and your friend captured Kant's core position accurately *but* oversimplified some nuances. Let's break it down plainly:

  ### Where your friend is correct:
  1. **Kant absolutely forbids lying, always.**  
     He argued truth-telling is a "perfect duty"—no exceptions, even to save a life. His famous line: "Truthfulness is a duty that must be regarded as the basis of all duties."

  2. **Consequences don't matter for moral judgment.**  
     Kant believed morality depends *only* on your intention to follow duty, not outcomes. If you tell truth and the murderer kills your friend, the moral "fault" lies entirely with the murderer.

  3. **Lying makes you responsible for unintended outcomes.**  
     Kant claimed that if you lie (e.g., say your friend isn't home), you bear responsibility for any chaos that follows—like if the friend leaves and is killed elsewhere. Truth-telling keeps your moral "hands clean."

  ### Where it's more nuanced (or misleading):
  1. **"Using the murderer as a mere means" isn't quite right.**  
     Kant *did* say we must never treat people as "mere means," but he didn't apply that to *lying to the murderer*. His actual argument against lying is about **undermining trust in all human communication**. If everyone lied when convenient, society would collapse. It’s about the *universal rule*, not "using" the murderer.

  2. **It’s not about "natural course of events."**  
     Kant wasn’t a fatalist. His point is that **truth-telling preserves autonomy**: The murderer makes an evil choice with true information, while lying manipulates his actions. Your moral duty is to respect rationality (even in evil people) by not deceiving them.

  3. **Kant’s rigidity has been challenged—even by supporters.**  
     Some modern Kantians argue that in life-or-death scenarios, refusing to lie *itself* might violate other duties (like protecting life). Others suggest silence or evasion ("I won't tell you") could be permissible without lying. Kant himself never budged, but philosophers debate if his *principles* demand such absolutism.

  ---

  ### Why people struggle with this (including philosophers!):
  - **The "slippery slope" fear:** Kant worried that *any* exception destroys the moral rule. If lying is okay to save a life, why not to avoid embarrassment? Who decides what's "serious enough"?
  - **The "greater evil" problem:** Is telling truth to a murderer *really* more moral than saving an innocent life? Critics say Kant prioritizes abstract duty over real human suffering.
  - **A thought experiment:** Imagine you lie, and the murderer leaves... but later your friend dies in a freak accident they'd have avoided if the murderer had been caught at your door. Kant would say your lie caused this chain of events. But is that fair?

  ---

  ### In a nutshell:
  Your friend summarized Kant's view faithfully—he truly believed you must tell the truth, even with a murderer at the door. But the "why" is less about "using people as means" and more about **upholding truth as the foundation of human society**. Whether that justifies potentially deadly outcomes is what makes this example so controversial. Even 200 years later, it perfectly exposes the tension between rigid principles and real-world compassion.

  If this feels too extreme, you're not alone. Philosophers like Mill (utilitarianism) would say lying is *obligatory* here to prevent greater harm. It’s why ethics remains a living debate—not a solved puzzle.
