answer: |-
  You've hit upon a genuinely deep problem in decision theory. The cases *are* disanalogous in a way that matters for FDT/UDT, and the key difference lies in **who your decision procedure logically controls, and how the payoff is determined**. Here's the breakdown:

  1.  **The Core Disanalogy: Logical Control vs. Probabilistic Influence**
      *   **Counterfactual Mugging (CM):** Omega's action is *logically determined* by your decision procedure. Specifically, *your* decision in the hypothetical heads scenario directly controls *whether Omega gives you $10,000* in the actual tails scenario. Omega's policy is: "Give $10,000 in tails iff *this specific agent* would pay in heads." Your decision procedure **singleton-controls** the outcome in the tails branch. FDT works by choosing the procedure that outputs the action (pay in heads) that *logically necessitates* the desired outcome ($10k in tails).
      *   **XOR Blackmail (XB):** The outcome for *you* (being framed or not) is *probabilistically influenced* by your own action, but **not singleton-controlled** by it. The blackmailer's policy is: "Frame exactly one person chosen uniformly at random from the non-payers." Your action (paying) *removes you from the pool*, thereby *reducing your personal probability* of being framed. It does **not** logically control the outcome for *others* or guarantee the blackmailer gets nothing. Critically, the blackmailer's payoff ($100 * number of payers) is **aggregated** across the decisions of *many* agents. Your decision procedure does *not* logically determine the decisions of others or the blackmailer's overall success.

  2.  **Why Step (3) is Misleading:**
      Step (3) correctly notes that paying *reduces your personal risk* in XB. However, it incorrectly conflates this *probabilistic self-benefit* with the *logical control* present in CM. FDT's strength in CM comes from its ability to reason about how your decision procedure *writes* outcomes in other logical branches controlled by a predictor. In XB:
      *   Your decision procedure *does not* write the decisions of the other 999,999 victims. Their decision procedures are independent.
      *   Your decision procedure *does not* logically control whether the blackmailer succeeds overall. Their success depends on the *aggregated* actions of all victims.
      *   Paying only changes your *local* status within the mechanism the blackmailer set up (removing you from the pool). It's a self-interested move within a harmful system, not an exercise of logical control over the system itself.

  3.  **Why Paying in XB is Wrong (and FDT Doesn't Demand It):**
      *   **The Collective Action Problem:** XB is fundamentally a **coordination game** or a **mass prisoner's dilemma**. The globally optimal outcome (no one pays, one person framed, blackmailer gets $0) requires universal defection. However, individual incentives push everyone towards paying ($-100 vs. a tiny chance of massive loss).
      *   **FDT's Scope:** FDT is primarily designed for scenarios involving predictors, simulations, or logical counterfactuals where *your* decision procedure has acausal influence over *specific* outcomes determined by another agent (like Omega). It isn't designed to solve large-N coordination problems where the outcome is an aggregate function of many independent decisions.
      *   **What FDT Actually Says in XB:** FDT would ask: "What decision procedure do I want to be running, given that the blackmailer's action towards *me personally* depends *only* on *my* action (via removing me from the pool)?"
          *   The procedure "Pay" results in: Always lose $100, never framed.
          *   The procedure "Don't Pay" results in: Lose $0, but face a (1 / number of non-payers) chance of being framed.
      *   **The Catch:** The "number of non-payers" is *not* determined by *your* decision procedure. It's determined by the independent decision procedures of 999,999 other agents. FDT, reasoning only about logical control, cannot assume that others will follow your procedure. It must treat their actions as fixed or probabilistic. Given this, *conditional on the likely actions of others*, FDT *might* recommend paying purely to avoid the personal risk. However, this is **not** because your decision procedure logically controls the outcome like in CM; it's simply a calculation of *expected personal utility* within a harmful system created by the blackmailer.

  4.  **The Crucial Distinction: Singleton Control vs. Aggregated Dependence**
      *   **CM:** Omega's payout in tails is *defined solely in terms of your counterfactual decision*. Your decision procedure singleton-controls the outcome.
      *   **XB:** Your safety is *defined in terms of your action relative to the group's actions*. The blackmailer's payoff is *defined as an aggregate function of all agents' actions*. Your decision procedure only controls your own contribution to the aggregate and your personal removal from the pool. It does not control the group outcome or the blackmailer's success.

  5.  **Why "Don't Want to Cooperate" Isn't the Core Issue:**
      You're right that FDT is agent-neutral. The difference isn't primarily about malice vs. benevolence. Imagine a *benevolent* version of XB: "I'm giving $10,000 to exactly one person chosen randomly from those who *don't* send me $100." Paying *still* removes you from the pool, increasing others' chances. The structure is identical. FDT might still recommend *not paying* if you value the chance at $10k more than $100, but it wouldn't be driven by "cooperating with evil." The core issue remains: the outcome is aggregated/group-dependent, not singleton-controlled. Malice makes the *consequences* of coordination failure worse, but doesn't change the structural disanalogy to CM.

  **Conclusion & What to Give Up:**

  *   **Step (3) is wrong.** The reasoning that makes paying compelling in CM relies on *logical/singleton control* of the outcome via your decision procedure. This control is absent in XB, replaced by *probabilistic influence* on your personal outcome within an *aggregate function* determined by many agents.
  *   **FDT/UDT can consistently recommend paying in CM and *not* paying in XB.** Paying in CM leverages logical control to secure a guaranteed gain. Paying in XB is merely a locally rational but collectively disastrous move within a harmful coordination trap. FDT, focused on logical control, doesn't inherently solve coordination problems. It might recommend paying in XB *if* it assumes others' actions are fixed, but this is a consequence of the *game structure*, not a flaw in FDT's core logic regarding CM-like scenarios.
  *   **What you give up:** You have to accept that FDT/UDT isn't a universal solution to *all* decision problems, particularly large-N coordination problems like XOR blackmail. Its superpower is acausal trade and predictor scenarios with singleton control. For coordination problems, you need additional mechanisms (norms, pre-commitments, communication) that FDT doesn't inherently provide. The cases are disanalogous because CM involves logical determination by a single agent's decision, while XB involves probabilistic determination within a group aggregate.

  **In short:** The difference that does the work is **Singleton Logical Control (CM) vs. Aggregated Probabilistic Influence (XB)**. This distinction generalizes. CM belongs to a class of problems involving predictors, simulations, or logical counterfactuals where your decision controls outcomes elsewhere via its logical implications. XB belongs to the class of collective action problems where outcomes depend on the aggregation of many independent decisions. FDT excels at the first class but doesn't magically solve the second.
