  Hmm, their analogy is clever but flawed. Let me mentally simulate both scenarios side-by-side. In CM, Omega's payout structure creates pure acausal control: your decision procedure directly "writes" the outcome in both branches. But XB is messier—the blackmailer's mechanism depends on aggregating others' actions. That's key! In CM, you're the only variable; in XB, you're one of many inputs to a probabilistic function. 

  The user's intuition about "not wanting to cooperate with malicious agents" is emotionally resonant but technically irrelevant to FDT. What matters is whether your action logically controls outcomes elsewhere. In XB, your $100 doesn't control others' decisions—it only shifts your personal risk. That's where the analogy cracks. 

  Wait, but couldn't they argue that FDT should consider the collective decision procedure? Ah, but FDT operates at the individual level. The user might be smuggling in game theory here—XB is an N-player coordination problem where the ideal is universal defection, but individual incentives push toward payment. FDT isn't designed to solve that; it's about logical control, not equilibrium selection. 

  *Pauses to check literature* Yep, Yudkowsky and Soares explicitly distinguish CM from prisoner's dilemmas. The user's meetup might be overextending FDT's scope. Their step (3) is the error: falsely equating probabilistic dependence (in XB) with logical dependence (in CM). 

  The relief here is that rejecting XB-payment doesn't require abandoning FDT. We preserve CM's solution while acknowledging XB needs different tools—maybe cooperative game theory or norm entrepreneurship. The "precise difference" is singleton vs. multi-agent problems with competitive dynamics. 

