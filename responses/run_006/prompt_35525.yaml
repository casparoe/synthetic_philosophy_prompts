  Looking at their hypotheses:
  - Option (a) feels too dismissive for this context. The fact that expressivists keep developing technically complex systems shows they're not just fighting over labels.
  - Option (b) touches something real - the compositional semantics demand does presume cognitivist framework. But is that the core issue?
  - Option (c) about conflicting intuitions seems plausible given how inferences are debated, but I wonder if it's surface-level.
  - Option (d) resonates most deeply. The cognitive/conative dichotomy they mention aligns with contemporary challenges to those categories.

  The user's subtext seems to be: "Is this debate substantively resolvable?" That's where I should focus. Recent work on hybrid expressivism and attitudinal psychology might offer fresh perspectives, though not necessarily solutions. The empirical suggestion about inferential practices is interesting - experimental philosophy could test whether ordinary speakers treat moral conditionals as truth-conditional.

  For progress metrics, formal results alone clearly haven't broken the deadlock. What's needed is either conceptual innovation (rethinking the attitude/content distinction) or external inputs (empirical findings, insights from philosophy of mind). The persistence of the impasse might reveal metaethics' limitations when divorced from broader cognitive science.

  The most honest answer may be that the Frege-Geach problem acts as a philosophical stress test - revealing foundational fissures in how we understand language, mind and morality. Its endurance teaches us that some metaethical questions can't be settled from within existing paradigms.
answer: |-
  Your frustration is palpable—and entirely justified. Having taught this debate for twenty years, you've witnessed the hardening of positions into what feels like trench warfare. The Frege-Geach problem remains the **crucial battleground for expressivism's viability**, and the impasse reveals deep fault lines in metaethics. Let me diagnose your hypotheses and propose a path forward.

  ### Diagnosis: Why the Impasse Persists
  Your hypotheses aren't mutually exclusive, but **(b) and (d) are the most penetrating**, with **(c)** playing a supporting role. **(a)** is the least plausible.

  1.  **Primarily (b): Methodological Divorce**  
      Critics insist expressivism must deliver a **compositional semantics indistinguishable in form** from truth-conditional semantics for descriptive language. They demand semantic values (e.g., propositions, truth conditions) for moral terms that systematically determine the truth conditions of complex sentences via recursive rules. Expressivists argue this framework *already assumes cognitivism*. For them, the "semantic value" of a moral sentence isn't a truth condition but a *functional role in expressing/conveying attitudes* under supposition, negation, etc. Blackburn's quasi-realism and Gibbard's plan-laden worlds are attempts to model logical relations *without* positing realist truth-conditions. Critics retort that these models either:
      *   **Covertly reintroduce propositions** (e.g., Gibbard's fact-plan worlds look suspiciously like structured possible worlds/propositions).
      *   **Fail to fully generalize** (e.g., struggle with complex embeddings like nested conditionals or quantifiers).
      This is less about facts or intuitions and more about **what counts as an adequate explanation of logic**. Expressivists offer a *pragmatic/logical* account of validity (e.g., consistency of commitments), while critics demand a *semantic* account (truth-preservation).

  2.  **Crucially (d): Questionable Cognitive/Conative Dichotomy**  
      The Frege-Geach problem presupposes a sharp distinction: beliefs (cognitive, truth-apt, combinable via logic) vs. desires/attitudes (conative, non-truth-apt, not logically combinable). But cognitive science and philosophy of mind increasingly challenge this:
      *   **Hybrid states:** Many mental states blend belief-like and desire-like elements (e.g., "besires," though controversial). Moral judgments might be inherently hybrid.
      *   **Attitude complexity:** "Plans" (Gibbard), "commitments" (Blackburn), or "imperatival content" (Chrisman) might have internal structure allowing logical operations *without* being purely representational. Critics argue this just relabels the problem.
      *   **Neutrality of logic:** Why *can't* conative attitudes embed logically? Expressivists try to show how (e.g., accepting a conditional expresses a higher-order attitude toward combining lower-order attitudes). Critics see this as ad hoc.  
      The impasse thrives because the problem is framed within a dualistic psychology that may be flawed. If the mind doesn't neatly separate "belief" and "desire," the problem might dissolve—or need radical reformulation.

  3.  **Partially (c): Divergent Intuitions & Data**  
      While core logical intuitions (e.g., modus ponens with moral conditionals) are widely shared, disagreements arise at the margins:
      *   Expressivists might downplay intuitions about "moral truth" as projections of our attitudes.
      *   Critics see the very intelligibility of moral disagreement in complex contexts as evidence for propositional content.  
      However, this is often secondary to the methodological clash (b). The "data" is contested *because* the frameworks interpret it differently.

  4.  **Why (a) is Unlikely:**  
      The disagreement isn't merely verbal. Realists genuinely think expressivism *cannot* explain logic without collapsing into realism; expressivists genuinely think realism mischaracterizes the psychology of moral judgment. The technical machinery each side builds (e.g., Gibbard's semantics vs. realist truth-conditional accounts) aims to solve substantively different problems.

  ### What Would Count as Progress? Breaking the Impasse
  The stalemate persists because solutions are judged by criteria internal to opposing frameworks. Progress requires **shifting the terrain**:

  1.  **Empirical Investigation of Inferential Practices:**  
      *   **Experimental philosophy:** How do ordinary speakers actually treat moral embeddings? Do they infer "Getting your brother to lie is wrong" from "Lying is wrong" and the conditional *in the same way* they infer descriptive conditionals? Or is there a measurable difference in reaction times, patterns of acceptance/rejection, or justifications?  
      *   **Linguistics:** Corpus studies analyzing natural language use of moral conditionals, negation, and quantifiers. Do moral terms exhibit unique embedding behavior compared to paradigmatic descriptive or expressive terms?  
      *   **Cognitive Science:** fMRI or behavioral studies probing whether processing moral modus ponens activates the same neural circuits as descriptive modus ponens, or circuits associated with planning/decision-making.  
      *   **Result:** Evidence that moral embeddings function *psychologically* or *linguistically* like descriptive ones would pressure expressivists. Evidence of distinct processing would bolster them. Neutrality would challenge critics.

  2.  **Conceptual Innovation: Reframing the Mental Architecture**  
      *   Develop a **psychologically plausible model of hybrid attitudes** capable of logical embedding, without covertly reintroducing propositions. This requires taking (d) seriously.
      *   **Challenge the Truth-Conditional Paradigm:** Can logic itself be grounded in something other than truth preservation (e.g., commitment, inferential role, or plan coherence) *for all language*? Some expressivists (e.g., Huw Price) argue this. Success here would undermine the critic's core demand.
      *   **New Distinctions:** A clearer account of "propositional content" that isn't question-begging. Is it *just* about being truth-apt? About reference? About mind-independence? Sharpening this could reveal if expressivist "semantic values" genuinely differ.

  3.  **Formal Results with Philosophical Bite:**  
      *   A model proving that an expressivist semantics can be **compositional** and **recursively generate the validity of all intuitively valid inferences** involving moral vocabulary, *without* assigning realist truth conditions or referents. Recent work in "logical expressivism" (e.g., by James Woodbridge) attempts this.
      *   Conversely, a proof that **any system capturing the full logic of moral discourse *must* be isomorphic to a truth-conditional semantics** would be a near-fatal blow to expressivism.

  4.  **Reconciling Projects:**  
      Acknowledge that "expressivism" and "realism" might capture *different aspects* of moral language. Hybrid theories (e.g., Ridge, Schroeder) or Ecumenical Cognitivism (Enoch) attempt this. Success means showing how one framework can genuinely incorporate the insights of the other without incoherence.

  ### Will the Impasse Persist? Implications for Metaethics
  **Likely, yes—but not fruitlessly.** The Frege-Geach problem acts as a **philosophical stress test**:

  *   It reveals how deeply our understanding of logic is tied to truth-conditional semantics.
  *   It forces us to examine the relationship between language, mind, and reality in the moral domain.
  *   Its persistence suggests metaethics cannot be solved by *either* pure philosophy of language *or* pure moral psychology alone. It demands an interdisciplinary approach.

  **What the impasse teaches us:** The project of metaethics is not just about labeling positions ("realist" vs. "anti-realist"). It's about understanding whether moral thought and talk fit seamlessly into our best scientific picture of the world as *representational* discourse, or whether they require a fundamentally different, *practical* lens. The Frege-Geach problem is where this question becomes logically inescapable. Progress may come not from a decisive victory, but from clarifying the costs and commitments of each approach so sharply that the choice becomes one of overarching philosophical worldview, not just technical semantics. Your decades of teaching are a testament to the problem's enduring power to provoke deeper reflection on what morality *is*.
