  So me and my friend just spent like three hours arguing about presentism vs. eternalism and got absolutley nowhere. I'm the presentist: only the present exists, the past is gone and the future isn't there yet. He's the eternalist: all times are equally real, and the fact that we only experience one slice at a time is just a feature of our perspective, not of reality. We kept going in circles. I said eternalism means the dinosaurs are still out there somewhere and tomorrow is already fixed; he said that's just a vivid way of putting it, and anyway presentism can't explain how past-tensed statements are true — like, that there were dinosaurs — if the past doesn't exist. I brought up relativity and the relativity of simultaneity, and he said that's a problem for my view, and I said it isn't because what's simultaneous isn't the same thing as what's present. We both know the physics, we agree on all the equations, and neither of us moved an inch.

  My working theory is that the whole thing is really a disagreement about what "real" means, or maybe about whether tense belongs to the world or just to language, but I don't trust that. I want a diagnosis, not a verdict: is this a substantive disagreement about the world, a verbal dispute, two different questions being asked under one heading, or what? And given your diagnosis, what would actually count as progress here — a distinction, an argument, a formal result, or should I just accept that neither of us will ever budge?
