     Therefore, we keep the requirement: for Step 4b, the target population must not be experiencing above-threshold suffering (or if they are, it is being addressed by other means). But the program officer cannot know about other means. So we require that the proposal's target population is not experiencing above-threshold suffering. How? We use our criteria: are they in conditions that meet a, b, or c? For refugees: they might be in extreme poverty, have lost family, have trauma, etc. So likely yes.

     Therefore, the program officer would reject.

     However, the proposal might claim that the festivals help with trauma (thus reducing suffering). Then we would reclassify as Step 1: Yes. Then Step 2: Is trauma above threshold? Yes. Then Step 3: but is there evidence that festivals relieve trauma? Probably not strong evidence. Then it might fail the effectiveness test in Step 3.

     So the procedure would reject.

   Now, we discuss the limitations of the procedure:

     1. Defining the threshold: We used operational criteria, but they are still somewhat vague. For example, "complete inability to function" — how is that measured? Program officers might inconsistently apply this.

     2. Mixed populations: We require estimating the fraction above threshold and the cost per person for that fraction. This might be difficult and lead to arbitrary estimates.

     3. Cost ceilings: We set a ceiling for Step 3 (e.g., $20,000 per person) arbitrarily. This might be too high or too low.

     4. Positive goods: We require that the population is not experiencing above-threshold suffering. This might be too strict and lead to never funding positive goods, even in populations that are relatively well-off.

     5. Future suffering: We did not explicitly address prevention. But we can include it: if the proposal aims to prevent future suffering above threshold, then we consider it in Step 2. The severity and probability are estimates. The program officer must be convinced that the future suffering, if it occurs, would be above threshold and that the intervention reduces the probability sufficiently. This is hard to do in 30 minutes.

     6. Trade-offs: The procedure does exactly what the board wants: it prioritizes even a small number of threshold-suffering cases over any number of below-threshold or positive goods. But it might lead to funding very expensive programs that help a few over cheap programs that help many with below-threshold suffering. This might be defensible but hard to explain to stakeholders.

     7. Drift: Program officers might:
          - Overestimate the fraction above threshold to get a proposal into Step 3 (because that is the only way it gets funded).
          - Underestimate the cost per person in Step 3 by including more beneficiaries than actually have threshold suffering.
          - Avoid positive goods proposals entirely because they are rarely funded.

     8. Philosophical assumptions baked in:
          - That suffering above the threshold is lexically more important than anything else. Some board members might think that there are positive goods that are lexically good (e.g., saving a species) that should be considered, but our procedure ignores them if there is any suffering above threshold anywhere.
          - That the threshold can be defined by the criteria we set. Some might argue for a higher or lower threshold.
          - That below-threshold suffering and positive goods are commensurable via cost per DALY or cost per participant. This might be rejected by some.

     9. What the procedure cannot handle well:
          - Proposals that have multiple effects (e.g., both above-threshold suffering relief and positive goods). We only count the suffering relief.
          - Proposals that prevent suffering in the long term (e.g., policy change) but with uncertain outcomes.
          - Proposals that address suffering that is not health-related (e.g., extreme poverty, oppression). We must extend our criteria to non-health suffering.

     We tried to address non-health by criteria a and b. For example, extreme poverty might be associated with starvation (b) or cause complete inability to function (a). But it might be harder to measure.

     In summary, the procedure is a practical implementation but has many limitations. It will require monitoring and adjustment.

     Let me know if you need refinements.
