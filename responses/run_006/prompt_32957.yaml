  ### Decision Procedure for Lexical Threshold Negative Utilitarianism Grantmaking

  **Procedure Overview**: A 5-step sequential decision tree. Steps must be followed in order. Program officers (POs) assign proposals to categories, then the foundation ranks within categories after each cycle. Total budget ($40M/year) is allocated first to Category A, then B, then C.

  #### **Step 1: Identify Suffering Focus**
  - **Question**: Does the proposal *primarily* aim to prevent or relieve suffering?
  - **Guidance**: 
    - "Suffering" = physical/mental distress (pain, trauma, deprivation). 
    - If the proposal centers on joy, capability, or cultural goods without suffering relief, it is **non-suffering-focused**.
  - **Output**: 
    - YES → Proceed to Step 2. 
    - NO → Assign to **Category C** (positive goods). Skip to Step 5.
  - **Time**: ≤5 min. Uses proposal text only.

  #### **Step 2: Threshold Suffering Assessment**
  - **Question**: Does the suffering addressed meet the **lexical threshold**?
  - **Operational Criterion (Fixed List)**: Suffering crosses the threshold if it meets **≥1** of:  
    a. **Survival threat**: High risk of death (e.g., starvation, untreated fatal disease).  
    b. **Unremitting agony**: Constant severe physical/mental pain preventing basic function (e.g., advanced cancer pain, torture).  
    c. **Irreversible harm**: High risk of permanent disability (e.g., blindness from trachoma, severe trauma).  
  - **Guidance**: 
    - Use WHO/ICD definitions (e.g., "severe pain" = ≥7/10 on validated scales). 
    - Require evidence: Clinical data, surveys, or consensus reports (e.g., UNHCR for refugees). 
  - **Output**:  
    - CLEAR YES → Proceed to Step 3.  
    - CLEAR NO → Assign to **Category B** (below-threshold). Skip to Step 5.  
    - UNCERTAIN → Proceed to Step 2a.  
  - **Time**: ≤10 min. Focus on proposal evidence.

  #### **Step 2a: Uncertainty Resolution (Threshold)**
  - **Question**: Is ≥10% of the target population *likely* above threshold?  
  - **Guidance**:  
    - "Likely" = ≥50% probability based on:  
      - Disaggregated data (e.g., "20% of patients report severe pain").  
      - Proxy indicators (e.g., refugee camp conditions correlate with 30% PTSD).  
    - If no data, default to "NO" (Category B).  
  - **Output**:  
    - YES → Proceed to Step 3.  
    - NO → Assign to **Category B**.  
  - **Time**: ≤5 min. Judgment required; document rationale.

  #### **Step 3: Effectiveness and Feasibility Check (Threshold Suffering)**
  - **Question**: Is the intervention evidence-backed and practically feasible?  
  - **Guidance**:  
    - **Evidence**: RCTs, systematic reviews, or credible pilot data showing ≥20% suffering reduction.  
    - **Feasibility**: Per-person cost ≤$50,000 and local implementation capacity exists.  
  - **Output**:  
    - YES → Assign to **Category A** (threshold suffering).  
    - NO → Reject.  
  - **Time**: ≤5 min. Use foundation’s evidence database.

  #### **Step 4: Positive Goods Check (Non-Suffering-Focused)**
  - **Question**: Is the target population *free of threshold suffering*?  
  - **Guidance**:  
    - "Free" = No ongoing threshold suffering in the group (e.g., not refugees in crisis).  
    - Use secondary data (e.g., World Bank/WHO country reports).  
  - **Output**:  
    - YES → Assign to **Category C**.  
    - NO → Reject (lexical priority: unmet threshold suffering trumps positive goods).  
  - **Time**: ≤3 min.

  #### **Step 5: Escalation Check**
  - **Question**: Could this recommendation be **unacceptable to stakeholders** for reasons outside the procedure?  
  - **Guidance**:  
    - Flag if:  
      - Rejection risks reputational harm (e.g., denying palliative care).  
      - Cultural/political factors make the decision untenable.  
    - Do **not** override; escalate to director.  
  - **Time**: ≤2 min.

  ---

  ### **Ranking and Funding**
  After categorization:  
  1. **Category A**: Rank by **cost per person suffering relieved** (lowest first). Fund top until budget exhaustion.  
  2. **Category B**: Rank by **cost per DALY averted** (lowest first). Fund if Category A budget remains.  
  3. **Category C**: Rank by **cost per participant** (lowest first). Fund only if no Categories A/B proposals.  

  ---

  ### **Application to Hypothetical Proposals**

  #### **Proposal 1: Palliative Pain Relief for Terminal Cancer**  
  - **Step 1**: YES (suffering focus: pain relief).  
  - **Step 2**: CLEAR YES (meets threshold: unremitting agony + survival threat).  
  - **Step 3**: YES (evidence-backed; assume feasible cost). → **Category A**.  
  - **Ranking**: High cost per person but Category A priority. Funded if budget allows.  
  - **Escalation Check**: Unlikely (ethically defensible).  

  #### **Proposal 2: Adolescent Depression Therapy**  
  - **Step 1**: YES (suffering focus: depression).  
  - **Step 2**: **UNCERTAIN** (depression severity varies; may not meet threshold unless suicidal). → **Step 2a**.  
  - **Step 2a**: 
    - If data shows ≥10% severe cases (e.g., suicidal ideation): YES → **Category A**.  
    - If no severity data: NO → **Category B**.  
    - **Judgment Required**: PO must assess proposal’s target population data.  
  - **Step 3/4**: If Category A, check effectiveness; if Category B, no further steps.  
  - **Escalation Check**: Unlikely.  

  #### **Proposal 3: Refugee Camp Festivals**  
  - **Step 1**: NO (promotes joy/social connection, not suffering relief). → **Category C**.  
  - **Step 4**: Is population free of threshold suffering? **NO** (refugees face survival threats, trauma). → **Reject**.  
  - **Escalation Check**: **Flag for escalation** (rejecting cultural services may draw criticism).  

  ---

  ### **Limitations and Risks**  
  #### **What the Procedure Cannot Handle Well**  
  1. **Long-Term/Preventative Suffering**:  
     - Future suffering (e.g., climate change) relies on probabilistic forecasts. Step 2 requires *current* evidence of high risk.  
     - *Risk*: Underfunds prevention.  

  2. **Non-Health Suffering**:  
     - Criteria (survival/agony/harm) favor biomedical suffering. Structural suffering (e.g., oppression) may not qualify.  
     - *Risk*: Neglects systemic interventions.  

  3. **Positive Goods in Suffering Populations**:  
     - Step 4 rejects Category C if threshold suffering exists, even if goods aid resilience (e.g., festivals in refugee camps).  
     - *Risk*: Overlooks psychosocial benefits.  

  4. **Aggregation Below Threshold**:  
     - Category B uses DALYs, which may not capture "moderate suffering" well (e.g., chronic anxiety).  
     - *Risk*: Misallocates resources within Category B.  

  #### **Philosophical Assumptions a Sympathetic Board Might Reject**  
  - **Threshold Rigidity**: Assumes suffering is binary (above/below threshold). Rejects spectrum views (e.g., "intolerable" suffering at 80% severity).  
  - **No Trade-Offs**: Prioritizes one person above threshold over any number below it. Rejects diminishing marginal disutility.  
  - **Positive Goods as Optional**: Treats joy/flourishing as irrelevant until all suffering is relieved, ignoring their preventive role (e.g., community events reducing depression).  

  #### **Operational Drift Risks**  
  - **Category A Inflation**: POs may overassign to Category A (e.g., stretching "survival threat" to include poverty) to secure funding.  
  - **Evidence Gaming**: POs may favor proposals with easily quantifiable suffering (e.g., pain scores) over complex interventions (e.g., trauma counseling).  
  - **Category C Avoidance**: POs may deprioritize positive-goods proposals, viewing them as unfundable.  

  #### **Conclusion**  
  This procedure operationalizes lexical threshold NU with minimal philosophy, but it **systematically undervalues prevention, structural interventions, and positive goods**. It works best for acute, tangible suffering and worst for probabilistic or qualitative benefits. Regular audits (e.g., sampling escalated cases) are essential to correct drift. For Proposal 2, it honestly exposes uncertainty, forcing judgment—this is a feature, not a bug.
