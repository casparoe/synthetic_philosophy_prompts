          a. The suffering is so severe that it typically leads to a complete inability to function in daily life (e.g., severe physical pain that prevents any activity, severe mental anguish that causes constant distress and inability to care for oneself) OR
          b. The suffering is associated with a high risk of death or irreversible harm (e.g., starvation, life-threatening disease without treatment, severe trauma without intervention) OR
          c. The suffering is of a type that is universally recognized in medical/psychological literature as extreme (e.g., severe chronic pain, major depressive disorder with suicidal ideation, torture, etc.).
