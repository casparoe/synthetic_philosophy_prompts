prompt: |-
  I help run a small grantmaking program at an animal-welfare organization focused on farmed aquatic animals, and I am preparing our next two-year research funding round. I have spent years reading rationalist and effective-altruism discussion of invertebrate sentience, welfare ranges, and cause prioritization, so I am comfortable with expected-value reasoning; after one too many conversations in which the question whether shrimp feel pain dissolved into citation-slinging, I have come to suspect that at least part of the bottleneck is conceptual rather than purely empirical. Deciding what should count as evidence of valenced experience in animals with nervous systems unlike a mammal's, and deciding how to weigh welfare across very different species, seem to me upstream of a lot of expensive data collection. But I want that model stress-tested, not assumed.

  The round can support about eight researchers for two to three years, and I want a defended agenda rather than a survey. The kinds of open questions I have in mind include: what kind and strength of evidence should move our credence that teleost fish or decapod crustaceans have valenced experience, given how unlike mammalian brains their nervous systems are; how to compare welfare across species with different life histories, body sizes, and numbers; whether farmed-fish welfare is best understood in terms of felt affect, natural behavior, or health and functioning, and what that implies for what farms and certification schemes should actually measure; and which intervention lever — slaughter and stunning methods, stocking density, water quality, enrichment, or something else — is most held back by unresolved conceptual questions rather than by engineering or cost. I need the ranking as a skeleton, but the reasoning is what carries the decision.

  Answer as someone who works seriously at the boundary of animal welfare science and philosophy of mind, and who can give a committed, self-critical recommendation. I want you to take a definite position and defend it, not present a menu of options. Before settling on a ranking, briefly brainstorm the candidate questions and the criteria you will use, and say explicitly where your confidence is lowest; then commit. Structure your answer in these named sections, with roughly these lengths: (1) "The ranking" — your ordered list of the three to five questions you would fund first, with one sentence of justification each (~150 words); (2) "Criteria and dependencies" — the explicit criteria you used (importance, tractability, neglectedness, how many other questions depend on this one) and which candidate questions are upstream of which (~250 words); (3) "The case for the top two" — why these specifically are worth the money, and what a two-to-three-year project could concretely deliver (~300 words); (4) "What I would deprioritize" — the apparently urgent question you would deliberately underfund, and why (~150 words); (5) "Tripwires" — what evidence over the next two years would move each of your top two up or down the list (~150 words).
reasoning: |-
  Okay, let me approach this systematically. The user runs an aquatic animal welfare grant program and wants to prioritize research questions that address conceptual bottlenecks in farmed aquatic animal welfare. They're explicitly asking for a committed, defensible ranking rather than a survey of options.

  First, I need to identify the core conceptual bottlenecks mentioned: evidence standards for valenced experience in non-mammalian nervous systems (especially decapods and teleosts), welfare comparisons across species, defining welfare frameworks (affect vs. behavior vs. function), and identifying intervention levers most constrained by conceptual rather than technical issues. 

  The user's background in rationalist/EA thinking suggests they value expected-value reasoning but are frustrated by endless citation battles. This indicates the need for foundational work that creates shared evaluation frameworks. Their emphasis on "upstream" questions and model stress-testing is crucial - they want research that enables better prioritization downstream.

  For criteria, I'll consider:
  - Importance: How many animals affected? Shrimp farming dwarfs all other aquatic sectors.
  - Tractability: Can we make concrete progress in 2-3 years? Philosophical questions need scientific grounding.
  - Neglectedness: Where is least work being done? Welfare ranges get discussed but rarely operationalized.
  - Upstreamness: Which questions unlock others? Evidence standards enable better sentience research.

  The shrimp focus makes sense - they're the most farmed invertebrate with nervous systems least like vertebrates. Welfare ranges come next because without cross-species comparison, we can't prioritize interventions. 

  I'm less confident about deprioritizing slaughter methods - it feels counterintuitive when it's such a visible welfare issue. But the user specifically asked for an "apparently urgent" item to underfund, and the reasoning holds: we already know enough to act on stunning, while conceptual gaps prevent us from optimizing other areas.

  For tripwires, I'll focus on measurable outputs: either frameworks that gain traction in regulatory discussions or quantitative models that change allocation decisions. The absence of these would indicate the approach isn't working.

  The ranking needs to be punchy but justified - one sharp sentence per item showing why it beats the next. The case for top two should paint a picture of what success looks like: not just papers, but tools that change how the field operates.
answer: |-
  ## Research Prioritization for Aquatic Animal Welfare Foundations

  **(1) The Ranking**  
  1.  **Establishing evidence standards for valenced experience in decapod crustaceans (especially shrimp):** This is the highest-leverage bottleneck, as resolving evidentiary criteria for the most numerous farmed aquatic invertebrates (with radically different neurology) is foundational to ethical urgency and resource allocation across the entire domain.  
  2.  **Developing a quantitative framework for comparing welfare ranges across species (teleosts, decapods):** Without principled comparability, prioritizing interventions or species is guesswork; this directly addresses the core cause-prioritization challenge for diverse aquatic taxa.  
  3.  **Clarifying the core welfare concept for farmed fish: Operationalizing affect vs. behavior/function:** Defining what welfare *is* dictates what farms measure; resolving this upstream ambiguity is critical before scaling costly certification schemes based on potentially misaligned proxies.  
  4.  **Identifying conceptual barriers limiting key welfare interventions (stocking density/enrichment):** Focusing on high-impact levers where progress stalls on *interpretation* (e.g., "What does 'sufficient space' mean for welfare?") rather than engineering/cost unlocks practical gains based on clearer foundations.

  **(2) Criteria and Dependencies**  
  My primary criteria are **Upstreamness** (how foundational is this for resolving other questions?), **Neglectedness** (how little serious conceptual work exists?), **Importance** (scale of animals affected, potential welfare impact), and **Tractability** (can meaningful progress be made in 2-3 years by a focused researcher/team?).

  *   **Dependencies:**  
      *   **Decapod Evidence Standards (#1)** is *essential* for determining the ethical significance of interventions impacting shrimp/prawns (billions farmed). It directly feeds into **Welfare Ranges (#2)** for invertebrates and informs **Core Welfare Concept (#3)** by challenging mammalian-centric affect models.
      *   **Welfare Ranges (#2)** depends on inputs from #1 (sentience confidence, valence capacity) and #3 (defining the welfare "currency"). Its output is critical for **Cause Prioritization** (which species/interventions first?) and evaluating the **Impact of Interventions (#4)** across species.
      *   **Core Welfare Concept (#3)** underpins the validity of *all* welfare assessment metrics used in research and certification. Ambiguity here makes data from #4 difficult to interpret meaningfully.
      *   **Conceptual Barriers to Interventions (#4)** relies on progress in #1, #2, and #3 to frame the questions correctly (e.g., "Enrichment for *what*? Avoidance of *which* negative states?"). Its value is in directing applied research efficiently.

  Neglectedness is highest for #1 (decapod evidence standards lack rigorous philosophical engagement) and #2 (welfare range comparisons are often hand-waved). Tractability is highest for #3 (grounded in existing ethology/philosophy debates) and #4 (focused on specific intervention puzzles). Importance is immense for #1 (sheer numbers) and #2 (foundational for allocation). **My lowest confidence is in the precise *tractability* of #2 (Welfare Ranges)** – developing a truly robust quantitative framework is exceptionally challenging.

  **(3) The Case for the Top Two**  

  *   **1. Evidence Standards for Decapod Valence:**  
      **Why Fund?** Shrimp/prawns represent the vast majority of farmed aquatic invertebrates, yet the conceptual basis for attributing valenced experience to their decentralized nervous systems is underdeveloped and contentious. Current debates are mired in conflicting interpretations of the same behavioral/physiological data. Resolving *what should count as convincing evidence* (e.g., trade-offs, learned motivational states, neurological integration mechanisms) is the gatekeeper for ethical concern and resource allocation. Without this, research on decapod welfare interventions lacks a coherent ethical foundation. It's highly neglected philosophically despite massive scale.  
      **Concrete Deliverables (2-3 years):** A comprehensive, peer-reviewed monograph or series of papers establishing a *defensible, tiered evidentiary framework* for attributing valenced states to decapods (and analogous invertebrates). This would include:  
      *   Critical analysis of existing criteria (e.g., nociception vs. pain, consciousness markers) applied to decapod biology.
      *   Proposal of novel, operationalizable criteria tailored to their neurobiology.
      *   A "confidence scale" linking specific types/combinations of evidence to levels of credence in valenced experience.
      *   Clear recommendations for key experiments to fill critical gaps identified by the framework. This output would become the essential reference point for future sentience research, welfare science, and policy debates for crustaceans.

  *   **2. Quantitative Welfare Range Comparison Framework:**  
      **Why Fund?** Even if we accept valenced experience in fish and crustaceans, comparing welfare significance across species (e.g., a salmon vs. a shrimp) with vastly different lifespans, ecologies, cognitive capacities, and baseline experiences is currently impossible in a principled way. EA discussions often rely on crude neuron counts or intuitions. A rigorous framework is desperately needed to prioritize interventions and species effectively. This is fundamental to cause-prioritization within aquatic welfare and across the animal advocacy movement.  
      **Concrete Deliverables (2-3 years):** A foundational paper + open-source computational model/prototype for comparing welfare ranges. This would:  
      *   Synthesize philosophical arguments on welfare currency (hedonic, desire-fulfillment, capabilities) and their operationalization challenges.
      *   Propose and defend core quantifiable parameters (e.g., intensity/duration range of possible valenced states, cognitive capacity modulating experience, "scope" factors like lifespan/sensory richness).
      *   Develop a structured approach (e.g., multi-attribute utility model) for weighting and integrating these parameters, acknowledging uncertainty explicitly.
      *   Provide illustrative case studies comparing common farmed species (e.g., trout, carp, shrimp). The model would be a living tool for the community, enabling sensitivity analysis and refinement as new data emerges on sentience (#1) and welfare states (#3).

  **(4) What I Would Deprioritize**  

  I would deliberately **underfund projects focused primarily on optimizing slaughter/stunning methods based on *current* welfare understanding.** While undoubtedly important and urgent for reducing acute suffering, the evidence base for effective stunning in many aquatic species (especially invertebrates) is already sufficient to justify significant industry changes *now*. Further refinements often face engineering and cost barriers more than fundamental conceptual ones ("Does this method prevent pain?" is largely answerable with current frameworks for vertebrates, and #1 will address invertebrates). Funding should prioritize the *foundations* that determine whether stunning is the *highest-priority* intervention long-term and for which species, rather than incremental improvements to a specific lever where the primary blocks are practical adoption, not conceptual ambiguity.

  **(5) Tripwires**  

  *   **Top 1 (Decapod Evidence Standards):**  
      *   **UP:** Widespread adoption of key framework elements (e.g., proposed criteria, confidence scale) in major reviews, policy documents (e.g., EFSA), or new experimental designs within 2 years signals success, justifying continued focus. Emergence of decisive *negative* evidence (e.g., a robust mechanism showing decapod avoidance behavior is truly non-valent) would also elevate importance by resolving uncertainty.
      *   **DOWN:** If the output fails to gain traction or significantly shift the debate beyond citation, or if it becomes clear the framework is intractably vague or impossible to apply to generate actionable confidence levels, it suggests the bottleneck is even deeper (e.g., philosophy of consciousness itself) and resources might shift towards #3 or #4.
  *   **Top 2 (Welfare Ranges):**  
      *   **UP:** Successful application of the framework/model by other researchers/NGOs (e.g., to prioritize species for campaigns, allocate research funds) or its use to generate specific, testable hypotheses about relative welfare impacts would demonstrate value. Regulatory bodies showing interest in its principles for policy would be a strong positive signal.
      *   **DOWN:** If the model remains purely theoretical, overly complex, or fails to produce *any* practically useful comparisons (even with high uncertainty) that differ meaningfully from simpler heuristics after 2-3 years, it indicates insufficient tractability. Significant, unresolvable philosophical disagreement on core parameters (e.g., weighting lifespan vs. intensity) undermining the framework's coherence would also lower priority.
