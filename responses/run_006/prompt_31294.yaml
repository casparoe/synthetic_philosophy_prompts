answer: |-
  Here are the core desiderata for an adequate teleosemantic theory of content, derived from the hardest cases and conceptual pressures in the field. I've prioritized non-negotiable constraints over camp preferences and highlighted tensions:

  **Non-Negotiable Desiderata:**

  1.  **Genuine Misrepresentation:** The theory must allow for representational states to be *false* or *inaccurate* without resorting to disjunctive content.
      *   **Motivating Case:** The Frog's Fly Detector. A frog's visual system is selected for catching flies. It snaps at a small, dark, moving speck (like a fly), but sometimes snaps at irrelevant dust motes. The content must be `FLY` (or equivalent), not `FLY-OR-DUST-MOTE`. The disjunction destroys the possibility of genuine error – the dust mote would count as a correct representation. Selection history favors `FLY` responses; dust motes are not what the system was *for* detecting.
      *   **Status:** Non-negotiable. Failure here means the theory cannot account for the core phenomenon of intentionality: aboutness that can fail.

  2.  **Distal/Proximal Specificity:** The theory must provide a principled basis for determining *what* an indicator state represents (e.g., fly, fly-presence-now, retinal shadow pattern, nutritious object) and explain why content is typically distal.
      *   **Motivating Cases:**
          *   *Frog's Fly Detector (Distal):* Why `FLY` and not `SMALL-DARK-MOVING-RETINAL-PATTERN`? The frog's tongue mechanism evolved to catch flies (distal objects), not interact with specific retinal patterns (proximal stimuli). Selection anchors on the distal effect.
          *   *Proximal Challenge:* Imagine a sensory system directly selected for detecting a specific proximal state (e.g., heat on a sensor plate triggering a cooling fan). The theory must allow content to be proximal *in these specific cases* without collapsing all content to the proximal. It must explain the difference.
      *   **Status:** Non-negotiable. A theory that cannot distinguish what is represented lacks explanatory power. The default anchoring to the distal is crucial for explaining behavior's world-directedness.

  3.  **Non-Arbitrariness (Selectional Robustness):** The content assigned must be robust against minor variations in the actual selection history and not become arbitrary or disjunctive under plausible evolutionary scenarios.
      *   **Motivating Case:** Selectional Drift. Suppose frog ancestors encountered flies 90% of the time and nutritious beetles (also small, dark, moving) 10% of the time. The snapping mechanism was equally successful on both and contributed to fitness. A theory must not yield the disjunctive content `FLY-OR-BEETLE` simply because both were consumed. The content should plausibly remain `SMALL-FLYING-NUTRITIOUS-THING` or similar, reflecting the *type* selected for, not an arbitrary list based on historical accidents. Content must reflect the *functionally relevant category*, not an exhaustive historical census.
      *   **Status:** Non-negotiable. Without this, content becomes historically contingent in a way that divorces it from the system's biological purpose and fails to capture the generality required for representation.

  4.  **Explanatory Basis for Normativity:** The theory must ground the *norm* of correctness (truth, accuracy) in natural facts (specifically, selection history/functions).
      *   **Motivating Case:** Any case of misrepresentation (like the frog snapping at dust). The "ought" (it *should* indicate flies, it *ought* to snap only when a fly is present) must be derived from the natural "is" of the system's evolutionary history and design. The function sets the standard.
      *   **Status:** Non-negotiable. This is the core promise of teleosemantics – naturalizing semantic normativity.

  **Highly Constraining (Often Contentious) Desiderata:**

  5.  **Compositionality & Complex Contents:** The theory should ideally explain how simple representations combine to form complex thoughts with novel, structured content (e.g., `FLY LEFT OF SPIDER`).
      *   **Motivating Case:** Human thought and language. Teleosemantics aims to ground all mental content, not just simple indicators.
      *   **Status:** Camp preference, but a major challenge. Many core teleosemantic theories (Millikan, Dretske originals) focus on simple indicators; handling compositionality often requires significant extensions (e.g., Millikan's push for "mapping functions").

  6.  **Swampman Compatibility:** The theory must yield a principled account of whether a molecule-for-molecule duplicate of a human, created by chance lightning strike in a swamp (Swampman), instantaneously possesses genuine mental states with determinate content.
      *   **Motivating Case:** Thought experiment challenging the necessity of actual selection history. Intuitions clash: Purists (Millikan, Neander) say no content without actual history/selection. Liberals (some readings of Dretske, perhaps Shea) might allow content based on systemic organization alone or derivative functions.
      *   **Status:** Camp preference/Deep tension. Negotiable in the sense that theorists choose sides, but any adequate theory *must* take a clear, principled stand consistent with its core mechanisms. It exposes a fundamental rift: Is selection history *constitutive* of content, or is it merely the mechanism that *produces* systems whose *current organization* grounds content?

  **Key Tensions Between Desiderata:**

  1.  **Distality vs. Misrepresentation:** Fixing content too distally (e.g., `NUTRITIOUS FLY`) can make misrepresentation too easy or hard to define – is a non-nutritious fly still a fly? Fixing it too proximally (e.g., `SMALL-DARK-MOVING`) risks losing genuine misrepresentation (dust motes fit) and breaking the link to distal biological functions. Theories need a mechanism to lock onto the *relevant* functional level.
  2.  **Non-Arbitrariness vs. Compositionality:** Achieving robust, non-disjunctive content for simple indicators (like `FLY`) is hard enough. Ensuring that complex, combinatorial representations built from these simples also have robust, non-arbitrary content under selectional drift scenarios is a formidable challenge. How does selection history constrain the combinatorial space?
  3.  **Non-Arbitrariness vs. Swampman:** The strongest argument *for* non-arbitrariness relies heavily on actual selection history fixing content against historical noise. However, this same reliance makes it difficult to grant content to Swampman, who lacks that history. Theories trying to accommodate Swampman (e.g., via organizational similarity or potential functions) risk reintroducing arbitrariness by loosening the anchor of actual selection.
  4.  **Explanatory Normativity vs. Swampman:** Grounding normativity in actual selection history provides a clear naturalistic basis. If Swampman has content, where does *his* normativity come from? Appealing to the functions of the *type* he duplicates risks circularity or losing the naturalistic anchor.

  **The Knockout Blow:**

  While all desiderata are challenging, **Non-Arbitrariness (Selectional Robustness)** is arguably the requirement that exposes the deepest flaw in the *most* popular teleosemantic approaches. Many theories (early Dretske's "indicator functions," some simple readings of Millikan's "proper functions," Fodor's attempted teleosemantics) struggle profoundly with Selectional Drift cases. They often either:
  *   **Collapse into disjunction** by including everything that *ever* triggered a response contributing to fitness (`FLY-OR-BEETLE-OR-DUSTMOTE-IN-ANCESTRAL-ENVIRONMENT-X`).
  *   **Become arbitrary** by requiring a precise, implausible historical cutoff point for what counts as part of the selected-for set.
  *   **Retreat to over-generalization** (`MOVING-SPECK`), sacrificing specificity and often losing misrepresentation.

  Theories that avoid this (like sophisticated versions of Millikan's biosemantics emphasizing *Normal Conditions* or *Stabilizing Functions*, or perhaps Shea's *Varitel* framework focusing on exploitable relations) do so by building in significant complexity to define the functional category robustly against historical noise. Demonstrating that this complexity truly solves the problem without circularity or excessive vagueness remains a core battleground. If your theory fails Non-Arbitrariness, its content assignments are essentially historical flukes, undermining its claim to explain intentionality.
