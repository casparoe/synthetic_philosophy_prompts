answer: |-
  ## Beyond the Party: Wrestling with Representation in the Twenty-First Century

  **(Speaker approaches the podium, takes a breath, makes eye contact)**

  Thank you. It’s genuinely an honor to be here, speaking to all of you – thinkers, practitioners, storytellers, and citizens – at a moment when the very nature of democratic representation feels both urgent and profoundly unsettled. The title of this conference, “Beyond the Party,” resonates deeply with me, personally and professionally. Because, as many of you know, six months ago, after fourteen years serving in the state legislature, I walked away from the political party I called home. The headlines, predictably, framed it as a spat, a factional skirmish. And while human dynamics are always part of the story, that narrative missed the deeper current pulling me away from the shore of partisan loyalty. Today, I want to share some of that current with you. Not as a definitive answer, but as a reflection, an ongoing conversation I’m having with myself – and one I hope resonates with you.

  For fourteen years, I believed deeply in the work. I knocked on doors, drafted bills, fought for constituents, and yes, worked within the machinery of my party. And let me be unequivocally clear: political parties *do* serve vital functions. In a complex democracy like ours, they are engines of coordination. Imagine trying to build a governing majority, or even a coherent opposition, without the structures parties provide – the shared resources, the communication networks, the basic ability to *organize*. They simplify the bewildering landscape of politics for voters, offering recognizable banners under which diverse coalitions gather, providing a shorthand for values and priorities. They identify talent, recruit candidates, and offer a path for public service. These are not trivial things. They are, in many ways, the practical scaffolding of modern representative democracy.

  And yet… over time, a dissonance grew within me. It wasn’t about any single policy shift or personality clash – though those existed, as they do everywhere. It was something more fundamental, more structural. It was the slow, sometimes imperceptible, pressure to conform, not just on votes, but on thought itself. The subtle signals that straying from the party line, even on matters of local nuance or personal conscience, was less an act of deliberation and more an act of disloyalty. The feeling that the collective identity, the *brand*, the imperative of winning and holding power, could sometimes overshadow the quieter, more demanding task of seeking what was true and just in a given situation.

  This feeling crystallized for me when I encountered the fierce, unsettling clarity of Simone Weil. In her 1943 essay, “On the Abolition of All Political Parties,” written amidst the catastrophic failures of partisanship in Europe, Weil makes a stark argument. She contends that the *inherent purpose* of a political party is not truth, not justice, not even necessarily good governance in the deepest sense – but collective power. Its survival and expansion become its primary directive. And this structural imperative, she argues, inevitably corrupts the individual conscience. It demands allegiance to a platform, a stance, a narrative, often superseding the individual representative's duty to think critically and independently about *this specific issue*, *this particular community need*, *this complex moral question*.

  Weil writes, *“A party is a machine to generate collective passions.”* It thrives on unity against an "other." It replaces reasoned judgment with the discipline of the bloc. The party member, she suggests, becomes less a free thinker and more an organ of the collective will.

  **(Pauses, reflects)**

  Reading Weil was like having a fog lift. It wasn’t that everyone in my former party was intellectually compromised – far from it! I served alongside dedicated, brilliant, deeply ethical people who believed their work within the structure was the best way to achieve good. And they often did. But Weil helped me name the *structural tension* I felt: the inherent conflict between the party’s need for cohesion and the representative’s fundamental duty to exercise independent judgment on behalf of those they serve. The party, by its nature, asks you to subsume a part of your intellect and conscience to the collective strategy. It asks you to speak, often, with one voice.

  The question that began to haunt me was this: Can we truly fulfill our duty as representatives – to deliberate openly, to weigh evidence without prejudgment, to speak honestly even when it’s inconvenient, to prioritize the specific needs of our constituents over the national party narrative – if our first allegiance is bound to an institution whose ultimate goal is its own power and perpetuation?

  This isn’t about demonizing partisanship or those who choose that path. It’s about acknowledging a fundamental tension built into the system. The very tools that help us organize and compete – parties – can, in their necessary focus on winning and collective identity, become obstacles to the nuanced, localized, and often inconvenient work of genuine representation. The pressure for message discipline can morph into thought discipline. The need for a unified front can stifle the necessary dissent and diversity of perspective that leads to better solutions.

  My own journey out was deeply personal. It wasn’t a sudden bolt of lightning, but a slow dawning that the space I needed to think clearly, to represent my district without constantly filtering my thoughts through the party lens, had become too constrained. Leaving wasn’t a rejection of my former colleagues' integrity; it was a search for a different kind of integrity – one grounded solely in my own conscience and direct accountability to my constituents, however messy and uncertain that path might be.

  **(Leans forward slightly)**

  So, what does "Beyond the Party" mean? I’m still figuring that out, day by day. I don’t have a grand, alternative blueprint – not today. Stepping outside hasn’t magically bestowed perfect clarity. It’s often lonelier, more complex. The coordination function parties provide? It’s sorely missed. Building coalitions issue by issue is harder work. The easy labels are gone.

  But here’s what I am discovering: a profound sense of intellectual liberation. The freedom to approach each issue without first asking, "What does the party need me to say?" The freedom to listen – truly listen – to perspectives from all sides, without the filter of partisan affiliation coloring my interpretation. The freedom to say, "I don’t know yet," or "This aspect troubles me," without it being seen as weakness or betrayal. It feels closer to the core duty of representation: to be a conduit for the voices of my community, and to bring my own unfettered reason and conscience to bear on their behalf.

  This isn’t a call for everyone to leave their parties. The system needs those who work within it, striving to make parties more responsive, more deliberative, more focused on the common good than on their own power. It needs reformers from within. But it also needs us to honestly confront the inherent tensions Weil identified. How do we mitigate the structural pressures that stifle independent thought? How do we create space *within* parties for genuine dissent and deliberation? How do we value and support representatives who prioritize their constituents and their conscience above strict party loyalty, even if they remain within the fold? And for voters, how do we move beyond the simple binary of team red or team blue to demand more independent-mindedness from those we elect, regardless of their label?

  The twenty-first century presents us with challenges of dizzying complexity – technological, environmental, social. Navigating them demands not just coordination, but the very best of our collective intelligence, our capacity for nuance, and our willingness to be intellectually honest, even when it’s uncomfortable. Can our current structures of partisan representation reliably deliver that? Simone Weil, writing from the ashes of war, offered a stark "no." I’m not ready to go that far, but my own experience tells me we must at least ask the question. We must acknowledge the tension.

  My departure wasn’t the end of a journey, but the beginning of a different one – an experiment in representation focused solely on place and principle, untethered from the party machine. It’s messy, uncertain, and absolutely ongoing. I share it with you today not as a prescription, but as an invitation. An invitation to reflect on the structures we have, the pressures they create, and the kind of independent, clear-eyed representation our complex times demand. How do we ensure that the quest for power doesn't eclipse the pursuit of truth and justice? How do we move, individually and collectively, closer to the heart of what representation ought to be?

  These are questions without easy answers. But they are questions worth wrestling with, together. Thank you.

  **(Nods, steps back from the podium)**
