prompt: |-
  I am a PhD student in moral philosophy, and I have been wrestling with a practical difficulty that I suspect bears on my theoretical commitments. For some time now, I have been convinced that the right action is the one that produces the best overall state of affairs, judged from an impartial point of view. I have tried to take this conviction seriously in my own life. I give away a substantial portion of my stipend to organizations that I judge to be highly cost-effective at reducing suffering. I have given up hobbies, eating out, and travel, because the money and time seemed better directed elsewhere. I often feel guilty when I spend an evening with friends rather than working or volunteering, since the latter seem more likely to make a concrete difference.

  The problem is that my life has begun to come apart in ways that seem connected to these choices. My partner tells me I am no longer really present — that I have become distant, perpetually preoccupied, and unable to enjoy anything for its own sake. My advisor has expressed concern that my research is losing depth and that I seem perpetually exhausted. I have noticed that I approach my own projects with a kind of grim dutifulness rather than genuine engagement. Personal relationships and intellectual passions that used to feel central to who I am now strike me as indulgences I struggle to justify.

  I am uncertain what to make of this. That a moral demand is difficult to meet does not, of course, show that the demand is unreasonable. But I find myself wondering whether a theory that systematically pulls against the relationships, commitments, and dispositions that give a human life its shape and meaning might be flawed in a more fundamental way. If living as the theory requires means becoming someone who can no longer sustain the very attachments that make a life recognizable as a good one, is that a problem with the theory, or merely a fact about the limits of the person trying to follow it?

  I would be grateful for a philosophically rigorous diagnosis of what might be going wrong here — or, if nothing is going wrong, an explanation of why that is.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're a PhD student in moral philosophy who's deeply committed to an impartial consequentialist framework. They've applied this by donating significant portions of their stipend, giving up personal pleasures, and feeling guilty about leisure time. But now their personal relationships are suffering, their work is declining, and they feel detached. 

  Hmm, the core tension here is between their theoretical commitment and the practical consequences. They're questioning whether the theory is flawed or if they're just failing to meet its demands. I need to consider the philosophical underpinnings of consequentialism and possible critiques. 

  First, let's recall Bernard Williams' integrity objection—that consequentialism might alienate us from our personal projects and relationships. The user's experience mirrors this: they've become distant from their partner, lost passion for research, and see personal connections as indulgences. This suggests the theory might be demanding too much of the individual's identity.

  Then there's the issue of sustainability. If the user is perpetually exhausted, their capacity to do good long-term is compromised. Effective altruism actually considers burnout a practical failure. Maybe they need to view self-care as instrumental to maximizing impact. 

  Also, the distinction between justification and deliberation matters. Consequentialism might justify actions impartially, but deliberation can include personal values without compromising the theory. The user might be conflating these, feeling guilty for any non-optimized time. 

  I should also think about the demandingness objection. If a moral theory requires supererogatory acts constantly, it might be unreasonable. But how much is too much? The user's sacrifices are affecting their mental health and relationships—clearly beyond sustainable limits. 

  The advisor's concern about research losing depth is significant. Intellectual work requires curiosity and engagement, which they've replaced with grim dutifulness. This affects their PhD, which could be a long-term avenue for impact. Sacrificing that for short-term donations might be counterproductive. 

  Their partner's feedback points to relational alienation. Consequentialism might undervalue the intrinsic worth of personal relationships. If maintaining these is necessary for a good life, the theory might need adjustment or a broader value framework. 

  Possible solutions: Recalibrate using moderate consequentialism, where personal goods are part of the overall calculus. Introduce agent-relative permissions. Or consider hybrid theories that include virtues or relationships. 

  The user might need permission to balance personal goods without guilt. Emphasizing sustainability and long-term effectiveness could align self-care with their principles. Also, their PhD could be framed as a future contribution, justifying current focus. 

  Ultimately, the dissonance suggests the theory needs refinement in practice. The user's experience is a valid critique, highlighting how extreme impartiality can erode the foundations of a meaningful life. They're not failing the theory; the theory might be failing human psychology.
answer: |-
  Your struggle reveals a profound tension at the intersection of ethical theory and human psychology. Let's analyze this philosophically rigorous diagnosis:

  ### 1. **The Williams Integrity Objection Revisited**
  Your experience directly echoes Bernard Williams' critique of utilitarianism: that impartial consequentialism can **alienate agents from their "ground projects" and personal integrity**. When moral calculus systematically demands the sacrifice of relationships, intellectual passions, and identity-constituting commitments, it risks turning you into a "channel between the input of everyone's projects and an output of [optimization]" rather than a person with your own valued life. The *disintegration* you describe—loss of presence, relational depth, and intellectual vitality—suggests the theory is demanding the surrender of precisely what constitutes *you* as a moral agent.

  ### 2. **The Sustainability Problem**
  Consequentialism faces a **pragmatic paradox**: if adhering to its demands undermines your psychological capacity to *continue* being an effective agent (e.g., burnout, relational collapse, diminished professional output), it becomes self-defeating. Your advisor's concern about diminished research quality is critical—your PhD is not just a personal project but a potential future vector for significant impartial good. Sacrificing it for marginal short-term gains may be net-negative from the very impartial perspective you endorse.

  ### 3. **The Deliberative vs. Justificatory Distinction**
  Frank Jackson distinguishes:
  - **Deliberative reasons** (what you think about in acting)
  - **Justificatory reasons** (what ultimately makes it right)  
  Your approach conflates these. While consequentialism may *justify* actions impartially, it need not require *deliberating* impartially at every moment. Constant optimization calculations may:
    - Crowd out motivations necessary for relational depth (genuine attention)
    - Destroy the spontaneous engagement vital for creativity
    - Induce decision fatigue that reduces overall effectiveness

  ### 4. **The Demandingness Objection Revisited**
  Even moderate consequentialists (e.g., Peter Singer) acknowledge that *some* self-sacrifice is obligatory. But your case suggests two deeper issues:
  - **Psychological limits**: Humans aren't optimizing engines. Guilt, exhaustion, and alienation are *predictable* responses to extreme demands, reducing long-term impact.
  - **The "Good Life" Problem**: If a theory consistently renders adherents unable to experience their lives as meaningful or flourishing, it fails Aristotle's criterion that ethics should concern *eudaimonia* (human flourishing). Your partner's observation about inability to enjoy things "for their own sake" highlights this.

  ### 5. **Epistemic Humility & Counterproductivity**
  You likely lack perfect knowledge to:
  - Calculate long-term consequences of small enjoyments (e.g., dinner with friends may restore energy for impactful work)
  - Predict how sacrificed relationships might later enable greater good (e.g., a partner's support during future crises)
  - Know if your current donations are truly optimal (effectiveness estimates are probabilistic)

  **Rigorous Diagnosis**: Your implementation likely violates **moderate consequentialist principles themselves** by:
  - Ignoring the *instrumental value* of personal goods (health, relationships, intellectual vitality) for sustained impact
  - Discounting the *intrinsic value* of partial commitments necessary for human functioning
  - Underestimating the risk of burnout-induced *long-term inefficacy*

  ---

  ### A Consequentialist-Friendly Way Forward
  You need not abandon core commitments to recalibrate:

  1. **Instrumental Self-Investment**:  
     Frame self-care as *strategic resource maintenance*. Just as a charity invests in staff wellbeing to maximize impact, your relationships, rest, and intellectual passions are *productivity multipliers*. Your PhD is a high-leverage project—undermining it for marginal donations is likely suboptimal.

  2. **Rule-Consequentialism**:  
     Adopt sustainable rules ("dedicate 15% of income," "protect two evenings/week for relationships") that likely yield better *lifetime* impact than constant marginal optimization.

  3. **Hybrid Approaches**:  
     Integrate virtue ethics (e.g., Julia Driver's consequentialist virtues) where traits like "engagement" or "relational presence" are cultivated because they *enable better consequences*.

  4. **Agent-Relative Permissions**:  
     Even Shelly Kagan concedes consequentialists can permit *some* agent-favoring acts if universalizing them would harm overall good. Your friendships may be such a case.

  ---

  **Why This Isn't Merely Personal Failure**:  
  If a theory demands a life that systematically erodes capacities essential for *any* human to function effectively (relationships, joy, intellectual creativity), the flaw lies in the theory's *application framework*, not the agent. Consequentialism, rigorously applied, must account for human psychophysiology—else it becomes a prescription for self-immolation that reduces net good. Your experience suggests a need to incorporate **sustainability constraints** and **agent-relative permissions** into the theory itself to avoid pragmatic self-defeat. 

  **"The good you can do is limited by the good you can become."** Recalibration isn't weakness—it’s optimization for the longest possible horizon of impact. Prioritizing your PhD, relationships, and wellbeing *is* serving the impartial good by ensuring you remain an effective, resilient agent for decades to come.
