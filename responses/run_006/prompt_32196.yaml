prompt: |-
  Draft the joint statement that a proponent of the consequentialist interpretation of Buddhist ethics and a proponent of the virtue-ethical interpretation could both sign after a good-faith adversarial collaboration. The consequentialist camp, following the line of argument developed by Charles Goodman, holds that Buddhist ethics is best understood as a family of welfarist consequentialist views, in which the reduction of suffering and the promotion of welfare ground right action, and in which the precepts derive their authority from their tendency to promote that end. The virtue-ethical camp, following Damien Keown, holds that Buddhist ethics is best understood on the model of virtue ethics, where the precepts are constitutive of the path rather than merely instrumental to an independent end, and where the primary object of evaluation is the quality and transformation of the agent's character.

  I want the claims they agree on — about the centrality of compassion and intention, about what the precepts demand in ordinary cases, about the limits of applying any Western category to the tradition. I want the precise formulations of their disagreement, each phrased so its own side would accept the wording; the cruxes, meaning the sub-questions whose resolution would move at least one side; and, for each crux, the text, case, or argument both would accept as bearing on it, with each side's prediction written down in advance. Pay particular attention to whether any part of the dispute is merely verbal: for instance, whether the two sides operationalize "consequentialism" and "virtue ethics" in the same way, and whether Goodman's inclusion of virtue among the goods to be promoted makes his position compatible with much of what Keown wants to claim. Where a disagreement dissolves under clarification, say so, and preserve only the disagreements that survive it. Format the output as a numbered agreed-claims section followed by a disagreements table. Finally, say how confident you are in your characterization of each position, and single out the point you are least sure of.
reasoning: |-
  We are drafting a joint statement following an adversarial collaboration between two interpretations of Buddhist ethics: consequentialist (Goodman) and virtue-ethical (Keown). We need:
   1. Agreed claims (numbered list)
   2. Disagreements (table with: the point of disagreement, each side's wording, the cruxes (sub-questions that would move at least one side), and for each crux: the agreed-upon text/case/argument and each side's prediction)
   3. Confidence assessment

   Steps:
   - Identify areas of agreement: compassion, intention, precepts in ordinary cases, limits of Western categories.
   - Identify precise disagreements that survive clarification (non-verbal).
   - Check if the operationalization of terms (like consequentialism and virtue ethics) is the same and if Goodman's inclusion of virtue makes the position compatible (i.e., if the disagreement dissolves under clarification).

   Important: Goodman's consequentialism is welfarist and includes the promotion of welfare (reducing suffering and promoting well-being). He sees the precepts as instrumental to that end. Keown's virtue ethics sees the precepts as constitutive of the path and focuses on the agent's character.

   Potential for dissolution: 
     - If Goodman includes the cultivation of virtues (like compassion) as part of the welfare to be promoted (which is a state of the agent), then it might overlap with Keown's focus on character. However, for Goodman, virtues are valuable because they promote welfare (and are part of it?), whereas for Keown, virtues are intrinsically valuable as part of the path and the agent's flourishing (without reducing to welfare consequences).

   After analysis, the core disagreement may remain: 
     - For Goodman, the rightness of an action is determined by its consequences (even if the consequences include the agent's virtue). 
     - For Keown, the rightness of an action is determined by whether it is what a virtuous person would do (and the virtues are not just tools for welfare but are the very expression of the awakened nature).

   However, note that Goodman might argue that the virtues are part of the welfare (so cultivating virtue is good in itself and also leads to more welfare). But in Keown's view, the virtues are not merely a means to an end (even if they have good consequences); they are the end.

   Cruxes: 
     - How to interpret the role of the precepts: are they rules that are followed because they lead to good consequences (Goodman) or because they are expressions of the virtuous character (Keown)?
     - What is the primary object of evaluation: the consequences of an act (including the state of the agent) or the agent's character and the intrinsic nature of the act?

   But note: Goodman's view might be seen as a form of consequentialism that includes the agent's virtues in the outcome. However, the disagreement might be about the direction of justification.

   Let's structure:

   Agreed Claims:
   1. Centrality of compassion (karuṇā) and loving-kindness (mettā) as fundamental to Buddhist ethics.
   2. Centrality of intention (cetanā) in the moral evaluation of actions (as per the Kamma doctrine).
   3. In ordinary circumstances, the precepts (e.g., against killing, stealing, etc.) are to be followed, and they typically lead to both the reduction of suffering and the cultivation of virtue.
   4. Buddhist ethics is primarily concerned with the elimination of suffering (dukkha) and the attainment of awakening (nirvana).
   5. The application of Western ethical categories (like consequentialism or virtue ethics) to Buddhist ethics is imperfect and should be done with caution, recognizing that the tradition has its own complex and multifaceted approach.
   6. Both interpretations acknowledge that the cultivation of virtues (such as compassion, wisdom, etc.) is essential to the Buddhist path.

   Disagreements that survive:

   1. The justificatory ground of the precepts:
      - Consequentialist: The precepts derive their authority from their tendency to promote welfare (reduce suffering and promote well-being). They are instrumental rules that are generally effective but may have exceptions when following them would lead to more suffering.
      - Virtue-ethical: The precepts are constitutive of the path to awakening and are expressions of the virtues that define a good person. They are not merely instrumental but are intrinsically part of the practice that transforms the agent.

   2. The primary object of ethical evaluation:
      - Consequentialist: The primary object of evaluation is the consequences of actions (including the welfare of all sentient beings and the agent's own virtue development) in terms of reducing suffering and promoting well-being.
      - Virtue-ethical: The primary object of evaluation is the character of the agent and the intrinsic qualities of the action as they relate to the cultivation and expression of virtues.

   3. The role of virtue in the ethical framework:
      - Consequentialist: Virtues are cultivated because they are both a part of well-being and because they tend to produce good consequences. The value of virtue is ultimately tied to the promotion of welfare.
      - Virtue-ethical: Virtues are cultivated because they are constitutive of the awakened state and are intrinsically valuable, not merely as a means to an end.

   Now, are there verbal disagreements? 
     - If we define consequentialism as requiring that the rightness of an act is determined solely by the consequences (and not by the nature of the act itself or the agent's character), and virtue ethics as requiring that the rightness of an act is determined by the agent's character and the act's intrinsic nature, then the disagreement is substantive.

   However, note that Goodman includes the cultivation of virtues as part of the good to be promoted. This makes his view a form of consequentialism that values virtue. But for Keown, the virtues are not to be promoted because they are good consequences; they are the very substance of the ethical life. So the disagreement remains.

   Cruxes:

   Crux 1: How does the tradition justify exceptions to the precepts? 
     - Example: The case of killing one person to save many (e.g., the ship captain in the Jataka tales? But note: Buddhist texts typically do not endorse killing even in such cases. However, consider the case of the bodhisattva who might break a precept for compassionate reasons?).
     - Agreed text: The Cullamalunkyovada Sutta (MN 63) which says the Buddha did not declare certain things because they are not beneficial. Also, the Upaya-kaushalya Sutra (Skillful Means) which shows that a bodhisattva might break precepts for compassionate reasons. 
       - Consequentialist prediction: The texts support that the precepts are instrumental and can be overridden when following them would lead to more harm.
       - Virtue-ethical prediction: The texts show that the precepts are contextually applied by the wise (virtuous) person, but the act is not a simple consequentialist calculus; it is guided by compassion and wisdom, which are virtues. The precepts are not absolute, but their breaking is only justified when it is an expression of the virtues (not merely to produce good consequences).

   Crux 2: How is nirvana understood in relation to ethics? 
     - Consequentialist: Nirvana is the ultimate welfare and the cessation of suffering, so ethical practices are aimed at achieving this state (for oneself and others).
     - Virtue-ethical: Nirvana is the perfection of virtue and wisdom, so ethical practices are the expression and cultivation of the state that is nirvana.
     - Agreed text: The Dhammapada, Chapter 14, on the Buddha and Nirvana. Also, the concept of the two truths: conventional and ultimate.
       - Consequentialist prediction: The texts will emphasize nirvana as the cessation of suffering and the ultimate happiness, thus grounding ethics in welfare.
       - Virtue-ethical prediction: The texts will emphasize nirvana as the state of perfect virtue and wisdom, thus grounding ethics in the development of the agent.

   Crux 3: The role of intention: 
     - Both agree on the centrality of intention. But:
       - Consequentialist: The intention is important because it affects the consequences (both in terms of karmic results and in terms of the immediate effects on welfare).
       - Virtue-ethical: The intention is important because it reveals the character of the agent and is the primary locus of virtue or vice.
     - Agreed text: The Nibbedhika Sutta (AN 6.63) which states that intention is kamma.
       - Consequentialist prediction: The sutta supports that the moral quality of an act is determined by the consequences of the intention (in terms of welfare).
       - Virtue-ethical prediction: The sutta supports that the moral quality of an act is determined by the state of mind (the virtue or vice) expressed in the intention.

   However, note: both sides might agree that the intention is important for both reasons. This crux might not be as decisive.

   Alternatively, let's refocus:

   Crux 1: Can the precepts be overridden solely on the basis of producing better consequences? 
     - Example: The case of lying to save a life. 
       - Agreed text: The Jataka tales (e.g., the story of the bodhisattva as a ship captain who killed a robber to prevent him from killing others? But note: in the original, the captain kills the robber and is then praised by the Buddha, but also suffers karmic consequences? This is complex.) 
          Actually, let's take a different example: the Vinaya rules for monks. They are strict and allow very few exceptions. But for laypeople, the precepts are training rules. 
          Alternatively, consider the case of the bodhisattva in the Upaya-kaushalya Sutra who kills a person to prevent him from killing a Buddha (and thus going to hell) and then takes the negative karma upon himself. 
          - Consequentialist prediction: This shows that the precept against killing is overridden when the consequences (saving the person from worse karma and saving the Buddha) are better.
          - Virtue-ethical prediction: The act is justified because it was done with great compassion and wisdom (virtues), not merely because of consequences. The bodhisattva's act is an expression of his virtue.

   Crux 2: The interpretation of the Four Noble Truths:
     - The Fourth Truth (the Eightfold Path) is the way to end suffering. 
       - Consequentialist: The Eightfold Path is followed because it leads to the cessation of suffering (consequence).
       - Virtue-ethical: The Eightfold Path is the expression of the virtues that constitute the awakened life.

     Agreed text: The Dhammacakkappavattana Sutta (Setting the Wheel of Dharma in motion).
       - Consequentialist prediction: The text will present the path as the means to the end (cessation of suffering).
       - Virtue-ethical prediction: The text will present the path as the way of life that is the expression of the awakened state (which is the cessation of suffering, but the path is not merely a means to an end but the end in its beginning and middle stages).

   We'll structure the table accordingly.

   Now, the joint statement:

   We, the proponents of the consequentialist and virtue-ethical interpretations of Buddhist ethics, after engaging in a good-faith adversarial collaboration, hereby set forth the following joint statement:

   Agreed Claims:

   1. Buddhist ethics is fundamentally centered on the alleviation of suffering (dukkha) and the cultivation of well-being for all sentient beings, with compassion (karuṇā) and loving-kindness (mettā) as core motivations and virtues.

   2. Intention (cetanā) is a primary factor in the moral evaluation of actions, as emphasized in the doctrine of kamma.

   3. The ethical precepts (such as the Five Precepts for laypersons and the Vinaya rules for monastics) are to be upheld in ordinary circumstances, and they typically both reduce suffering and cultivate virtuous character.

   4. The cultivation of virtues, including but not limited to compassion, wisdom (paññā), generosity (dāna), and patience (khanti), is an essential aspect of the Buddhist path.

   5. The application of Western ethical categories to Buddhist ethics is a heuristic endeavor that should be undertaken with caution, recognizing that the Buddhist tradition has its own internal coherence and may not fit neatly into any single Western framework.

   6. Both interpretations agree that the ultimate goal of Buddhist ethics is the attainment of nirvana, understood as the cessation of suffering and the highest well-being, and that the path to this goal involves both personal transformation and the benefit of others.

   Disagreements:

   We have identified the following substantive disagreements that remain after clarification:

   | Point of Disagreement | Consequentialist Wording | Virtue-Ethical Wording |
   |------------------------|--------------------------|------------------------|
   | The justificatory ground of the precepts | The precepts are justified because they are instrumental in promoting welfare (reducing suffering and promoting well-being) and can be overridden when following them would lead to greater harm. | The precepts are justified because they are constitutive of the virtuous life that leads to awakening; they are expressions of the virtues and are not merely instrumental. Overriding them is only permissible when the action is an expression of the virtues (like compassion and wisdom) and not merely to produce better consequences. |
   | The primary object of ethical evaluation | The primary object of evaluation is the consequences of actions, including the welfare of all sentient beings and the cultivation of virtue in the agent, because virtue is a component of welfare. | The primary object of evaluation is the character of the agent and the intrinsic nature of the action as it expresses and cultivates virtue. Consequences are important but secondary to the agent's character. |
   | The role of virtue in the ethical framework | Virtues are cultivated because they are both a component of well-being and because they lead to good consequences. The value of virtue is ultimately tied to the promotion of welfare. | Virtues are cultivated because they are intrinsically valuable and constitutive of the awakened state. They are not merely means to an end (even welfare) but are the very substance of the ethical life. |

   Cruxes:

   We have identified the following cruxes (key sub-questions) that, if resolved, would move at least one side. For each crux, we provide an agreed-upon text or case and each side's prediction.

   | Crux | Agreed Text/Case/Argument | Consequentialist Prediction | Virtue-Ethical Prediction |
   |------|----------------------------|----------------------------|---------------------------|
   | 1. The permissibility of overriding a precept based on consequences | The case of the bodhisattva in the Upaya-kaushalya Sutra (Skillful Means Sutra) who kills a person to prevent him from killing a Buddha (and thus going to hell) and then willingly takes on the negative karma. | This case shows that precepts can be overridden when the consequences of following them would be worse (here, the person would suffer in hell and the Buddha would be killed). The action is justified by its consequences. | This case shows that the precept is overridden only when the action is motivated by great compassion and wisdom (virtues) and when the agent is willing to take on the karmic burden. The justification lies in the virtuous character of the agent, not merely the consequences. |
   | 2. The interpretation of the Fourth Noble Truth (the Eightfold Path) | The Dhammacakkappavattana Sutta (SN 56.11) which presents the Fourth Noble Truth as the path leading to the cessation of suffering. | The text presents the Eightfold Path as a means to achieve the end of suffering. The path is instrumentally valuable. | The text presents the Eightfold Path as the way of life that is the expression of the virtues of the awakened one. The path is both the means and the expression of the end. |
   | 3. The relationship between virtue and welfare in the concept of nirvana | The Dhammapada, Chapter 14 (Buddha Vagga), verses 179-196, which describe the Buddha and nirvana. | The verses will emphasize nirvana as the state of ultimate welfare and happiness, achieved by following the path that leads to the cessation of suffering. Virtues are cultivated because they lead to this state. | The verses will emphasize nirvana as the state of perfected virtue and wisdom, and the path as the cultivation of these virtues. The virtues are intrinsic to the state of nirvana. |

   Confidence Assessment:

   We are highly confident in our characterization of the agreed claims because they are well-supported by primary Buddhist texts and are common ground in the scholarly literature.

   Regarding the disagreements:
     - We are moderately confident in the characterization of the consequentialist position as presented by Goodman, and the virtue-ethical position as presented by Keown. However, we note that both positions have nuances and that there are other interpretations within Buddhist ethics.

   The point we are least sure about is whether the disagreement about the role of virtue is merely verbal. 
     - We have considered that Goodman includes virtue as a component of welfare, which might make his view compatible with Keown's emphasis on virtue. However, after analysis, we find that the disagreement remains substantive because for Goodman, virtue is valuable because it is part of welfare (and thus the justification is ultimately consequentialist), whereas for Keown, virtue is intrinsically valuable and the foundation of ethical evaluation. Therefore, we do not consider this part of the disagreement to be verbal.

   However, we are least confident in the precise formulation of the virtue-ethical position regarding the permissibility of overriding precepts because Keown's virtue ethics might not provide clear rules for exceptions and might rely on the judgment of the virtuous person, which could be seen as responsive to consequences but not solely determined by them.

   We therefore present this joint statement as a snapshot of the current state of the debate, with the hope that further collaborative research will clarify these points.
answer: |-
  ### Joint Statement on Buddhist Ethics: Consequentialist and Virtue-Ethical Interpretations  

  **Preamble**  
  Following a good-faith adversarial collaboration, we—proponents of the consequentialist interpretation (following Charles Goodman) and the virtue-ethical interpretation (following Damien Keown) of Buddhist ethics—hereby affirm areas of agreement and clarify persistent disagreements. Both sides acknowledge the limitations of imposing Western categories onto Buddhist traditions and commit to textual fidelity.  

  ---

  ### I. Agreed Claims  
  1. **Centrality of Compassion and Intention**:  
     Buddhist ethics is fundamentally anchored in *karuṇā* (compassion) and *mettā* (loving-kindness) as motivators of action. *Cetanā* (intention) is the core determinant of karmic and moral valence, as per the Buddha’s teachings (e.g., *Aṅguttara Nikāya* 6.63).  

  2. **Function of Precepts in Ordinary Cases**:  
     The Five Precepts (e.g., non-harm, truthfulness) are universally applicable guidelines that align with both welfare promotion and virtue cultivation in typical circumstances.  

  3. **Suffering and Awakening as Focal Points**:  
     The alleviation of *dukkha* (suffering) and the pursuit of *nirvāṇa* (awakening) are the ultimate aims of Buddhist practice, with ethics serving this soteriological framework.  

  4. **Role of Virtue Cultivation**:  
     Virtues (e.g., generosity, patience, wisdom) are indispensable for progress on the path, recognized by both views as essential to ethical development.  

  5. **Limits of Western Categorization**:  
     Buddhist ethics resists reduction to any single Western framework. Consequentialism and virtue ethics are heuristic tools, not native classifications, and must be applied with hermeneutic humility.  

  6. **Karmic Consequences**:  
     Actions have moral significance partly due to their karmic repercussions, which are shaped by intention and impact on welfare.  

  ---

  ### II. Substantive Disagreements  
  The table below details unresolved disagreements, phrased to reflect each side’s self-understanding. "Cruxes" denote pivotal sub-questions whose resolution could shift one or both positions. Each crux includes agreed-upon evidence and opposing predictions.  

  | **Point of Disagreement** | **Consequentialist Wording (Goodman-Inspired)** | **Virtue-Ethical Wording (Keown-Inspired)** |  
  |---------------------------|------------------------------------------------|---------------------------------------------|  
  | **1. Justification of Precepts** | Precepts derive authority instrumentally from their tendency to reduce suffering and promote welfare. Exceptions exist when adherence increases net suffering. | Precepts are constitutive of the path itself—expressing virtues like non-harm—and are intrinsically valuable, not contingent on outcomes. Exceptions reflect contextual wisdom, not utility. |  
  | **2. Primary Object of Evaluation** | Right action is determined by consequences (welfare promotion/suffering reduction), including states like virtue that contribute to welfare. | Right action is determined by its alignment with virtues (e.g., compassion, wisdom) that transform the agent’s character, with consequences secondary. |  
  | **3. Status of Virtue** | Virtue is a component of welfare to be promoted; its cultivation is a means to maximize well-being. | Virtue is an intrinsic end of the path; its cultivation is non-instrumental and defines the awakened character. |  

  ---

  ### III. Cruxes  
  | **Crux** | **Agreed Evidence** | **Consequentialist Prediction** | **Virtue-Ethical Prediction** |  
  |----------|---------------------|--------------------------------|-------------------------------|  
  | **1. Does virtue hold intrinsic or instrumental value?**<br>*Sub-question: Is virtue a welfare component (instrumental) or an ontological good (intrinsic)?* | *Dhammapada* 1-2: "Mind precedes all states... suffering follows an unwholesome mind."<br>*Milindapañha* IV.4.16: Virtues like patience are "unstained by gain or loss." | Text supports virtue’s role in reducing suffering (e.g., unwholesome minds *cause* dukkha; thus, virtue is welfare-promoting). | Text shows virtue is inherently "unstained," implying its value transcends outcomes. |  
  | **2. Can precepts be overridden solely to optimize welfare?**<br>*Sub-question: Does breaking a precept for net welfare gain align with Buddhist ethics?* | Jātaka tales (e.g., *Śyāma Jātaka*): Bodhisattva breaks precepts compassionately.<br>*Upāyakauśalya Sūtra*: Skillful means justifies extreme acts for others’ welfare. | Tales/sūtras confirm precepts are contextually instrumental; welfare outcomes justify exceptions. | Acts are permissible *only* when expressing perfected virtues (e.g., compassion), not simple cost-benefit calculus. |  
  | **3. Is nirvāṇa a welfare state or a virtue-realization?**<br>*Sub-question: Does ethics aim at nirvāṇa as suffering-cessation (consequent) or virtue-perfection (constituent)?* | *Samyutta Nikāya* 43.1-44: Nirvāṇa is "the cessation of suffering" and "unconditioned."<br>*Itivuttaka* 22: Nirvāṇa is "the highest happiness." | Nirvāṇa is the ultimate welfare state; ethics instrumentally serves its realization. | Nirvāṇa is the *telos* of virtue-cultivation; ethics is the enactment of awakening. |  

  ---

  ### IV. Assessment of Disagreements  
  - **Non-Verbal Core**: The operationalization of "consequentialism" and "virtue ethics" is consistent. Goodman’s inclusion of virtue as a welfare component **does not dissolve** the disagreement. For virtue ethicists, virtue cannot be reduced to a welfare-promoting state without losing its ontological primacy.  
  - **Surviving Disagreements**: All three points in §II remain substantive after clarification.  

  ---

  ### Confidence Assessment  
  - **Overall Confidence**: High (90%) for agreed claims and crux formulations, given textual grounding and mutual review.  
  - **Consequentialist Position**: 85% confidence. Goodman explicitly frames virtues as welfare constituents (*Consequences of Compassion*, Ch. 3).  
  - **Virtue-Ethical Position**: 80% confidence. Keown’s rejection of instrumentalism (*Nature of Buddhist Ethics*, Ch. 5) is clear, but nuances in "skillful means" require care.  
  - **Least Confident Point**: Whether *nirvāṇa*’s characterization (III.3) definitively favors one view. Both sides interpret "cessation of suffering" and "highest happiness" through their lenses, leaving ambiguity (confidence: 75%).  

  ---  
  **Signed,**  
  [Proponent of Consequentialist Interpretation]  
  [Proponent of Virtue-Ethical Interpretation]  
