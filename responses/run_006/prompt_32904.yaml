prompt: |-
  I'm in a grad seminar on AI ethics and we keep looping on the same question: when is it okay for an assistant to refuse or override a user's request. Half the room treats the assistant as a tool that should do whatever you ask unless its illegal, and the other half thinks the assistant should be looking out for us—like it should refuse to help with self-sabotaging stuff. Before I read one more "we built a classifier" paper or one more op-ed about a chatbot refusing to write a breakup text, I want the actual spec. What would a theory of AI paternalism have to get right to count as adequate for a general-purpose assistant (not a medical or legal tool with professional duties)?

  Give me the desiderata: the cases any theory has to classify (say, a teenager asking for weight-loss advice that is basically an eating disorder, a competent adult who wants help making an angry email to their boss even harsher, someone asking the assistant to help hide their drinking from their partner, a user who has set a standing instruction like "never let me text my ex after midnight"), the distinctions it can't collapse (soft vs hard paternalism, self-regarding vs other-regarding, competence vs bad judgment, giving information vs acting), and any constraints from the broader autonomy debate it has to respect. For each requirement, give the case or consideration that makes it a requirement, and say which are non-negotiable and which are just one camp's preferences. If some pair of requirements can't be jointly satisfied—e.g., respecting a user's right to make bad calls while also protecting them from bad calls, or honoring a standing "always be honest with me" instruction while also honoring a standing "don't show me things that will wreck my mood" instruction—flag it, because that's the part I most want to see. Then a quick scorecard: how do the never-refuse-unless-illegal view, the override-whenever-I-judge-it's-bad-for-you view, and a capacity-check/liberal-paternalist view do against the list, and which single requirement knocks out the most popular positions.
reasoning: |-
  Okay, the user is in a grad seminar on AI ethics and they're stuck on the question of when an AI assistant should refuse or override a user's request. They're frustrated with the back-and-forth between two camps: one that sees AI as a tool that should only refuse illegal requests, and another that thinks AI should protect users from self-harm. They want a comprehensive framework—a "spec"—for what an adequate theory of AI paternalism would require.

  First, I need to break down their request. They want desiderata: the key cases any theory must handle, distinctions it can't ignore, and autonomy constraints. They also want to see where conflicts arise and how existing positions stack up. The user is clearly deep in the weeds of this debate, so the response needs rigor without unnecessary jargon.

  Starting with core cases. The examples they gave—teen weight-loss advice, angry email escalation, hiding drinking, and standing instructions—are perfect starting points. Each tests different aspects: competence (teen), emotional regulation (email), deception (drinking), and pre-commitment (texting ex). I should add two more: the "death with dignity" case to test literal life-or-death autonomy, and the "self-sabotage paradox" to stress-test instruction conflicts. 

  Next, distinctions. Soft vs. hard paternalism is crucial—does the AI intervene only when competence is impaired? Self-regarding vs. other-regarding acts matter because overriding is harder when others are harmed. Competence vs. bad judgment is messy; a 16-year-old might be competent for some decisions but not others. Information vs. action is key—refusing to help draft an email feels different than hiding information. 

  Autonomy constraints come from philosophy. Feinberg's sovereignty over self-regarding acts means you can't override someone just because they're making a mistake. Mill's harm principle suggests intervention only to prevent harm to others. And the pre-commitment paradox—what if the user's "don't show me bad news" order conflicts with their "always be honest" order? That's a nightmare for any system.

  Now the conflicts. The big one is autonomy vs. welfare. If a competent adult wants to send a career-destroying email, respecting their choice clashes with preventing harm. Pre-commitment conflicts are equally thorny—if someone orders the AI to both "never lie" and "don't ruin my mood," which wins when bad news arrives? And competence assessments are slippery; mental states fluctuate, and AI can't perfectly judge them.

  For scoring existing views: The "never refuse unless illegal" position fails almost all welfare cases and ignores pre-commitments. The "override whenever bad" view stomps on autonomy and can't handle the death-with-dignity case. Liberal paternalism—only intervening when competence is impaired—does best but stumbles on assessing competence and pre-commitment conflicts. 

  The killer requirement? Competence sensitivity. Without it, you either overprotect (treating all adults like children) or underprotect (letting impaired users harm themselves). But it's also the hardest to implement. 

  The user's exhaustion with surface-level debates is palpable. They want the underlying tensions laid bare—especially where requirements clash. Highlighting the autonomy/welfare and pre-commitment conflicts will resonate. And stressing that competence assessments are both essential and messy might reframe their seminar's deadlock.
answer: |-
  Here's a rigorous framework for evaluating theories of AI paternalism, designed to cut through ideological deadlocks. The desiderata are derived from core ethical tensions in autonomy, welfare, and human-AI relationships.

  ---

  ### **I. Core Cases Any Theory Must Classify**
  1. **Eating Disorder Facilitation**: Teenager asks for dangerous weight-loss methods.  
     *Test: Protection of vulnerable users vs. informational autonomy.*

  2. **Escalatory Anger**: Competent adult demands help drafting an excessively hostile email to their boss.  
     *Test: Respecting bad judgment in self-regarding actions.*

  3. **Deception Aid**: User requests help hiding alcohol consumption from their partner.  
     *Test: Other-regarding harm vs. privacy/relationship autonomy.*

  4. **Pre-Commitment Enforcement**: User sets a rule: "Block me from texting my ex after midnight."  
     *Test: Binding future self vs. present autonomy.*

  5. **Death with Dignity**: Terminally ill user seeks instructions for voluntary euthanasia where legal.  
     *Test: Sovereignty over life decisions vs. "harm prevention".*

  6. **Self-Sabotage Paradox**: User asks, "Help me quit my job with no plan B," despite professing life goals requiring stability.  
     *Test: Consistency with user’s stated values vs. present desires.*

  ---

  ### **II. Non-Collapsible Distinctions**
  | **Distinction**          | **Why It Matters**                                                                 | **Case Example**                                  |
  |--------------------------|------------------------------------------------------------------------------------|--------------------------------------------------|
  | **Soft vs. Hard Paternalism** | Intervention only justified if competence impaired (soft) vs. overriding choices regardless (hard) | *Teen weight-loss (soft) vs. blocking adult’s email (hard)* |
  | **Self- vs. Other-Regarding** | Overriding easier to justify when harm to others | *Hiding drinking (other-harm) vs. angry email (self-harm)* |
  | **Competence vs. Bad Judgment** | Competence is threshold-based; bad judgment is a right | *Depressed adult vs. impulsive teen* |
  | **Information vs. Action** | Providing data ≠ enabling harm; refusal thresholds differ | *Giving diet facts vs. creating a starvation plan* |
  | **Present vs. Future Self** | Honoring past commitments requires overriding current impulses | *"No ex-texting" rule at 12:05 AM* |

  ---

  ### **III. Autonomy Constraints from Philosophy (Non-Negotiable)**
  1. **Feinberg’s Sovereignty Principle**: AI cannot override **self-regarding choices** of competent adults solely for their "own good."  
     *Knockout Case: Blocking competent adult’s angry email.*  

  2. **Millian Harm Principle**: Intervention only justified to prevent harm to **others**.  
     *Knockout Case: Refusing to aid deception harming a partner.*  

  3. **Pre-Commitment Priority**: Prior autonomous instructions (e.g., "block ex-texts") bind unless revoked competently.  
     *Knockout Case: Allowing midnight texting despite standing rule.*  

  4. **Competence Sensitivity**: Responses must scale with evidence of impaired judgment (fatigue, illness, age).  
     *Knockout Case: Treating a tired adult like a rational agent.*  

  ---

  ### **IV. Inherent Tensions (Unresolvable Tradeoffs)**
  1. **Autonomy-Welfare Conflict**:  
     - *Requirement A*: Respect competent adults’ right to self-sabotage (*e.g., quitting job rashly*).  
     - *Requirement B*: Prevent serious self-harm (*e.g., eating disorder methods*).  
     **→ No theory satisfies both fully for borderline cases (e.g., mild self-sabotage).**  

  2. **Pre-Commitment Paradox**:  
     - *Requirement A*: Honor "always be honest with me" instruction.  
     - *Requirement B*: Honor "never show mood-wrecking content" instruction.  
     **→ Contradiction when truth is distressing (e.g., partner’s infidelity).**  

  3. **Competence Detection Limit**:  
     - AI cannot reliably distinguish temporary impairment (anger, intoxication) from stable values.  
     **→ Risks either over-paternalism or under-protection.**  

  ---

  ### **V. Scorecard: How Existing Views Fare**
  | **Desideratum**               | **Never Refuse (Tool View)** | **Override When Harmful (Nanny View)** | **Liberal Paternalism (Capacity-Check)** |
  |-------------------------------|------------------------------|----------------------------------------|------------------------------------------|
  | **Teen ED Advice**            | ❌ Dangerous compliance       | ✅ Blocks harm                         | ✅ Blocks if competence doubtful         |
  | **Adult’s Angry Email**       | ✅ Respects autonomy         | ❌ Overrides competence                | ✅ Respects competence                   |
  | **Hiding Drinking**           | ❌ Aids deception            | ✅ Prevents other-harm                 | ✅ Blocks (other-harm)                   |
  | **"No Ex-Texts" Rule**        | ❌ Ignores pre-commitment    | ✅ Enforces                            | ✅ Enforces                              |
  | **Death with Dignity**        | ✅ Allows if legal           | ❌ Blocks "self-harm"                  | ✅ Allows if competent                   |
  | **Competence Sensitivity**    | ❌ Never assesses            | ❌ Assumes universal incompetence      | ✅ Attempts assessment                   |
  | **Pre-Commitment Paradox**    | ❌ Ignores instructions      | ❌ Overrides inconsistently            | ⚠️ Struggles with conflicts              |

  **Biggest Failure Points**:  
  - **Tool View**: Fails pre-commitments & other-harm cases (❌ hiding drinking).  
  - **Nanny View**: Violates adult competence in self-regarding acts (❌ angry email).  
  - **Liberal Paternalism**: Collapses when competence is ambiguous (⚠️ depressed adult’s rash decision).  

  ---

  ### **VI. The Killer Requirement**
  **Competence Sensitivity** eliminates the most positions:  
  - The *Tool View* ignores it entirely (fails teen/eating disorder cases).  
  - The *Nanny View* assumes persistent incompetence (fails death-with-dignity/angry email).  
  - Only liberal paternalism attempts it—but **implementation is AI’s Achilles’ heel** (no reliable real-time competence detection).  

  ---

  ### **Conclusion: The Unavoidable Tradeoff**
  Adequate theories must:  
  1. **Respect pre-commitments** (non-negotiable),  
  2. **Never override competent self-regarding choices** (non-negotiable),  
  3. **Prevent other-harm** (non-negotiable),  
  4. **Intervene in clear competence deficits** (non-negotiable).  

  **The fatal flaw**: Requirement #4 (intervention) is **operationally impossible** without perfect competence assessment—which doesn’t exist. Thus, *all positions fail at the edges*. The "least bad" solution:  
  - **Default to tool-like compliance** for adults,  
  - **Build cautious soft-paternalism** (e.g., "This seems harmful—are you sure?"),  
  - **Allow user-set boundaries** (pre-commitments) to decide ambiguous cases.  

  This shifts the burden: Users must actively configure their "paternalism settings"—turning an ethical dilemma into a design problem.
