  First, I need to unpack why this slogan is so frequently invoked but philosophically slippery. The phrase originates from Aristotle, but its modern usage often conflates several distinct concepts about emergence, reduction, and supervenience. The user's frustration suggests they recognize this equivocation and want tools to dissect it.

  I'll start by identifying core dimensions of variation:
  - What "sum" means (literal addition vs. any compositional function)
  - What "more" refers to (novel properties, causal powers, irreducible explanations)
