  First, I recall the basics of IHL. The distinction principle is key here—combatants vs. civilians. The user is pointing out that the act of killing is judged based on the status of the target, not the war's justice. So, the law seems neutral regarding the cause of the war. 

  The user mentions the moral equality of combatants (MEC). I need to explain how IHL's stance relates to MEC. From what I remember, theorists like Walzer support MEC, arguing that combatants on both sides have equal permissions and liabilities. But others, like McMahan, reject this, saying only just combatants have the right to kill. 

  The legal practice doesn't punish soldiers for fighting in an unjust war, only for how they fight. That aligns with MEC because it treats all combatants as equally liable to attack. But does the law actually presuppose MEC? Or is it just practical? The user wants to distinguish between what's strictly presupposed versus what fits. 

  I should break it down: IHL's rules strictly require differentiating combatants from civilians and basing liability on status, not cause justice. That implies a presupposition of liability through role-based status. MEC is a philosophical interpretation that fits this, but the law itself might just be pragmatic—avoiding the chaos of judging each soldier's cause. 

  Then there's the prosecution of leaders. The user asks how that squares with not punishing soldiers. Legally, aggression is a crime for leaders, but soldiers are exempt unless they commit war crimes. This fits MEC because soldiers aren't blamed for the war's justice, only their conduct. If liability depended on the war's justice, soldiers in unjust wars could be prosecuted, which isn't the case. 

  If we switched to McMahan's view, where liability depends on the war's justice, IHL would need major changes. Soldiers in unjust wars could be liable for mere participation. But proving the war's justice per individual would be messy. Command responsibility might shift, and civilian deaths might still be prosecuted similarly. 

  I need to ensure clarity on presupposition vs. compatibility. The law presupposes status-based liability. MEC is compatible but not necessary; pragmatism also fits. The user wants a clear distinction here. Also, addressing the leader-soldier dichotomy shows that the law holds leaders accountable for war decisions, not soldiers for following orders within IHL rules. 

  Finally, summarizing the implications of changing the liability theory. A justice-dependent system would destabilize IHL, making compliance harder and possibly increasing atrocities. The current system prioritizes minimizing harm through clear, binary rules.
answer: |-
  The legal practice you describe—where combatant status alone determines lawful targeting, irrespective of war justice—rests on a specific **theory of liability based on functional role and risk imposition**, not moral culpability for the conflict. Here's a reconstruction of its implicit presuppositions:

  ### Core Presuppositions of IHL Practice:
  1. **Status-Based Liability**:  
     A person becomes morally and legally liable to lethal force *solely* by functioning as a combatant (i.e., directly participating in hostilities). This liability arises from:  
     - **Role-Induced Threat**: Wearing a uniform signifies membership in a group authorized to use collective violence, making one a permissible target.  
     - **Reciprocal Risk**: Combatants accept mutual endangerment as an occupational hazard, creating a "fair fight" paradigm.  

  2. **Separation of *Jus ad Bellum* and *Jus in Bello***:  
     The justice of the war (*jus ad bellum*) is categorically distinct from the conduct of warfare (*jus in bello*). IHL applies symmetrically; a soldier's actions are judged against rules of engagement, not their side's moral cause.

  3. **Combatant Privilege**:  
     Soldiers are immune from prosecution for lawful acts of war (e.g., killing enemy combatants), even in an unjust war. This privilege is forfeited only by violating IHL (e.g., targeting civilians).

  ---

  ### Moral Equality of Combatants (MEC): Presupposed or Compatible?
  - **Strictly Presupposed**:  
    IHL **presupposes the *legal* equality of combatants**—equal permissions/liabilities in combat regardless of war justice. This is non-negotiable for the system to function.  
  - **Moral Equality (MEC) is Compatible but Not Required**:  
    The practice *fits* MEC (which holds that soldiers on both sides share identical moral permissions to kill). However, it is also compatible with the view that **unjust combatants commit *pro tanto* moral wrongs but are exempt from legal punishment** for pragmatic reasons:  
    - **Epistemic Limitations**: Soldiers cannot reliably assess the justice of their war.  
    - **Pragmatic Necessity**: Punishing all unjust combatants would paralyze conflict resolution and deter surrender.  
    - **Humanitarian Priority**: Focusing on conduct (e.g., civilian protection) minimizes suffering more effectively than adjudicating causes.

  ---

  ### Reconciling Soldier Immunity with Leader Prosecution
  The law distinguishes between:  
  - **Leaders**: Bear *jus ad Bellum* liability for aggression (a crime against peace under the Rome Statute). Their decisions initiate unjust harm.  
  - **Soldiers**: Bear *jus in Bello* liability for conduct violations. They execute orders but lack agency over war initiation.  

  **Theory of Responsibility**:  
  - **Leaders** are culpable for *unjust harm creation* (starting the war).  
  - **Soldiers** are liable only for *unjust harm execution* (violating IHL rules).  
  This reflects a **division of labor**: IHL holds individuals accountable for actions within their control—leaders for geopolitical choices, soldiers for battlefield behavior.

  ---

  ### Consequences of Replacing the Liability Theory
  If liability depended on the war's justice (à la Jeff McMahan's revisionism):  

  1. **IHL Would Collapse**:  
     - Soldiers in unjust wars could face prosecution for *any* hostile act (even killing enemy soldiers).  
     - Legal symmetry would vanish; "lawful combatancy" would require proving one's war is just.  

  2. **Practical Chaos**:  
     - **Epistemic Burden**: Courts would need to retroactively adjudicate each war's justice to try soldiers.  
     - **Moral Hazard**: Soldiers would be incentivized to refuse all orders, including legal ones, to avoid liability.  
     - **Humanitarian Costs**: Combatants might escalate atrocities to "justify" their cause or avoid capture/trial.  

  3. **Structural Shifts Needed**:  
     - Abolish combatant privilege for aggressors.  
     - Criminalize mere participation in an unjust war.  
     - Grant "just" soldiers immunity for acts (e.g., collateral damage) forbidden to "unjust" soldiers.  

  **Outcome**: Such a system would likely increase war's brutality by removing clear conduct rules, undermining IHL's core purpose: mitigating suffering through shared, enforceable standards.

  ### Conclusion
  IHL presupposes **liability through role-based threat**, not moral desert. It treats soldiers as instruments of states, liable due to their function, not their cause. While compatible with the *moral* equality thesis, its foundation is **pragmatic humanitarianism**: prioritizing actionable rules over abstract justice to reduce wartime harm. Replacing this with justice-dependent liability would render IHL unworkable, trading enforceable conduct limits for an unattainable moral ledger. The law's genius lies in its moral minimalism—it saves lives by accepting that war is inevitable, then binding all parties to humane rules.
