  ### (a) Refined Karmic Rules Consistent with Existing Verdicts

  Two refined versions of the karmic view that fit all five verdicts are:

  1. **Rule of Intentional Weighting with Temporal Redemption (IWTR)**:  
     Desert is determined by the moral quality of an agent's intentional actions (or negligent failures), weighted by the agent's motives and the gravity of the outcome. Negative desert from a bad action can be fully redeemed by a sufficient accumulation of positive desert from subsequent good actions, provided no further bad actions occur. Positive desert from good actions is discounted if motives are impure. Accidents without negligence generate zero desert.

  2. **Rule of Motive-Sensitive Decaying Ledger (MSDL)**:  
     Desert is a sum of the moral value of all actions, where the moral value of an action depends on its intentionality, motives, and outcomes (with zero value for non-negligent accidents). The weight of each action in the ledger decays exponentially over time, but the decay rate is slower for actions with higher moral gravity (e.g., murder decays slower than robbery). Motives modulate the magnitude: good actions with bad motives receive partial credit; bad actions with evil motives incur heavier penalties.

  Both rules explain the verdicts:  
  - **Verdict 1/2**: Good/bad actions with fitting motives generate strong positive/negative desert.  
  - **Verdict 3**: The robbery’s negative desert is redeemed by 35 years of good (IWTR) or decays to near-zero due to time and lower gravity (MSDL).  
  - **Verdict 4**: Non-negligent accidents have zero moral value.  
  - **Verdict 5**: Motives reduce credit for good actions.  

