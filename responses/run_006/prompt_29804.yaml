prompt: |-
  I spent my career in statistical mechanics and only recently began reading philosophy of probability seriously. I have been following the debate over the Principal Principle — roughly, Lewis's idea that one's rational credence should equal the known objective chance, conditional on admissible evidence. The part that interests me is the tension between the Principal Principle and Humeanism about chance: the view that chances are not primitive modal facts but are instead given by something like the Best Systems Analysis, where the chances are whatever probabilities appear in the best systematization of the entire actual history. The problem, as I understand it, is that on a Humean view, future events can undermine present chances. If the best system says the chance of heads is 0.7, but the actual sequence of outcomes turns out to be all tails, then the best system might have been different, and the chance was never really 0.7. This seems to put the Principal Principle under pressure.

  I would like to see what an adversarial collaboration between a committed Humean about chance and a non-Humean primitivist about chance would produce. Draft the joint statement they could both sign after a good-faith effort to clarify their disagreement. I want: (1) a numbered list of claims both accept — about the formalism, about what the Principal Principle says, about what needs explaining; (2) a disagreements table with precise formulations of where they part ways, phrased so each side would accept the wording of its own position; (3) the cruxes — the sub-questions such that settling them would move at least one side; and (4) for each crux, the kind of case or argument both would agree bears on it, with each side's prediction recorded in advance. If any part of their dispute turns out to be merely verbal, say which part and why.
reasoning: |-
  We are two philosophers of probability: one a Humean (H) and one a non-Humean primitivist (P). We have engaged in an adversarial collaboration to clarify our disagreement regarding the tension between the Principal Principle (PP) and Humeanism about chance. Our goal is to produce a joint statement that includes agreements, disagreements, cruxes, and cases that bear on the cruxes.

  ## 1. Agreements (Numbered List)

  We both accept the following:

  1. **Formalism of Probability**: We both work within the standard Kolmogorov probability formalism. Probabilities are real numbers between 0 and 1 inclusive, and they satisfy the axioms of probability.

  2. **The Principal Principle (PP)**: There exists a principle, roughly as formulated by Lewis, that relates rational credence to objective chance. A standard formulation is: 
     For an arbitrary agent, at time t, with total evidence E, and for any proposition A and any time t' ≤ t, 
     
     Cr(A | H_t_w ∧ E) = ch_t_w(A)
     
     where:
     - Cr is the agent's rational credence function,
     - ch_t_w(A) is the objective chance at time t in world w of A being true,
     - H_t_w is the complete history of world w up to time t,
     - E is any admissible evidence (which, at least, does not include information about events after t).

     We note that the exact formulation of the PP is subject to refinement (e.g., to handle the admissibility clause and the reference class problem), but we agree that it captures a core truth about the connection between chance and rational belief.

  3. **Humeanism Defined**: Humeanism about chance (also known as the Best Systems Analysis or BSA) is the view that chances are not primitive modal facts but supervene on the total history of the world. Specifically, the chance facts at a time are determined by the best systematization (balancing simplicity, strength, and fit) of the entire actual history, including the future.

  4. **Non-Primitivism Defined**: Non-Humean (primitivist) chance is the view that chances are fundamental, irreducible features of the world, not reducible to patterns in the Humean mosaic.

  5. **The Tension**: There is an apparent tension between the PP and Humeanism. On Humeanism, the chance at time t can be undermined by future events because the best system is determined by the entire history (past, present, and future). This raises the question: if the chance at t is x, but the future turns out in a way that would have led the best system to assign a different chance at t (had that future been known), then how can the PP hold? The PP says that conditional on the chance at t being x and admissible evidence, one's credence should be x. But if the future undermines the chance assignment, then the chance at t might not be x after all.

  6. **Goal**: We aim to explain how (or whether) the PP can be reconciled with Humeanism, or to clarify the nature of the conflict.

  ## 2. Disagreements Table

  We disagree on the following points:

  | Issue | Humean (H) Position | Non-Humean (P) Position |
  |-------|----------------------|--------------------------|
  | **Nature of Chance** | Chance is an emergent, non-fundamental feature that supervenes on the entire Humean mosaic (the complete history of particular matters of fact). | Chance is a fundamental, irreducible feature of the world, not supervenient on the Humean mosaic. |
  | **Undermining Futures** | It is possible for there to be a future event F such that, if F were to occur, it would make the best system at the actual world not the best system. Thus, the chance at time t might be different from what it actually is. | Undermining futures are impossible because the chance at t is a primitive fact that holds at t, regardless of future events. Future events cannot change the chance that was at t. |
  | **Reconciliation with PP** | The PP can be reconciled with Humeanism by either (i) restricting admissibility to include only historical information (so that information about future events is always inadmissible) or (ii) by reformulating the PP (e.g., as the New Principle) to condition on the entire chance theory. | The PP, as originally formulated, is incompatible with Humeanism because of undermining futures. The Humean must either abandon the PP or modify it in an ad hoc way. The primitivist view naturally upholds the PP without modification. |
  | **Explanatory Priority** | The Humean account explains why chances are what they are (via the BSA) and thus provides a reductive account. | The primitivist account takes chance as a bedrock feature and thus does not require (or allow) a reductive explanation. |

  ## 3. Cruxes

  We identify the following as key sub-questions (cruxes) that, if settled, would move at least one side:

  1. **Crux 1: Undermining Futures**
     - Question: Can a future event F (after time t) undermine the chance assignment at time t in the sense that the occurrence of F would imply that the chance at t was not what we thought it was?
     - H: Yes. Because the best system is determined by the whole history, including the future, if F occurs then the best system might be one that assigns a different chance at t than the one we thought.
     - P: No. The chance at t is a fact at t and cannot be changed by future events. Thus, undermining futures are impossible.

  2. **Crux 2: Admissibility in the PP**
     - Question: Is information about future events always inadmissible for the PP at time t?
     - H: Yes. Because the future can undermine the chance assignment, we must consider such information inadmissible. This is the standard Humean move to save the PP.
     - P: No. If the chance at t is a primitive fact, then information about the future is admissible as long as it doesn't directly reveal the outcome of the chance event (but note: on the primitivist view, the future cannot undermine the chance, so it's admissible). However, the primitivist might also hold that future information is inadmissible for independent reasons (e.g., because it might give information about the outcome). But the key point is that there is no threat from undermining.

  3. **Crux 3: The New Principle**
     - Question: Can the PP be replaced by the New Principle (NP) without loss? The NP says: Cr(A | T_w ∧ H_t_w) = ch_t_w(A | T_w), where T_w is the complete chance theory of world w.
     - H: Yes. The NP avoids the problem of undermining because conditioning on T_w (the entire chance theory) ensures that we are not vulnerable to undermining futures. The NP is a viable alternative and preserves the core intuition of the PP.
     - P: No. The NP is an ad hoc fix for the Humean. The original PP is the correct principle, and the NP is a departure from it. Moreover, the NP requires knowing the entire chance theory T_w, which is not required by the original PP and may be too demanding.

  4. **Crux 4: Epistemic Access**
     - Question: How do we come to know chances? Is there a difference in the accessibility of chances on the two views?
     - H: We come to know chances via the patterns in the events we observe. We use the history to infer the best system. This is an empirical matter.
     - P: We come to know chances either by direct acquaintance (if they are fundamental) or by some other non-inferential means. However, the Humean might argue that the primitivist cannot explain how we know chances without an empirical basis.

  ## 4. Cases and Arguments

  For each crux, we agree on the kind of case or argument that bears on it and record each side's prediction.

  ### Crux 1: Undermining Futures
  - **Case**: Consider a world w with a very long sequence of coin tosses. The best system for the entire history (which is mostly heads) says that the chance of heads at each toss is 0.7. But suppose there is a possible future F (which does not occur in w) that is a very long sequence of tails. If F were to occur, then the best system for w+F might assign a different chance (say 0.3) at the time of the tosses that actually occurred in w.
  - **H's prediction**: This case is possible and shows that chances depend on the entire history, including the future. Thus, if F were to occur, the chance at the time of the tosses would indeed have been 0.3, not 0.7.
  - **P's prediction**: This case is impossible because the chance at the time of the tosses is a primitive fact. The sequence of tosses in w has a chance of 0.7 for heads at each toss, and that fact is independent of what happens in other possible futures.

  ### Crux 2: Admissibility in the PP
  - **Case**: At time t, an agent knows that the chance of heads is 0.7 (according to the best system so far). The agent then learns a proposition F about the future (e.g., that the next 1000 tosses will all be tails). Should the agent still set their credence in heads on the next toss to 0.7?
  - **H's prediction**: The agent should not set credence to 0.7 because F is admissible? Actually, the Humean typically holds that F is inadmissible because it is about the future. But note: F might be undermining. So the agent should condition on F and update their belief about what the chance was. However, the Humean will say that in the PP, we condition only on H_t_w (history up to t) and the chance theory at t. But if F is learned, it must be incorporated in a way that may lead to a different chance assignment. This is complex. Alternatively, the Humean might say that the agent, upon learning F, should adjust their credence because F is evidence that the chance was not 0.7. But then the PP no longer applies because the agent has learned that the chance was not 0.7? This is messy. To avoid this, the Humean insists that for the PP to apply, the agent must not have any inadmissible evidence (which includes F). So the agent should not have F in E. But if they do, then the PP doesn't apply.
  - **P's prediction**: The agent should set credence to 0.7 regardless of F. The chance at t is 0.7, and F is about the future and does not change that. However, F might be evidence about the outcome of the next toss (if the chance is 0.7 but the next 1000 are tails, then the agent might suspect the coin is biased). But note: the primitivist holds that the chance is 0.7, so the agent should set credence to 0.7 unless F is evidence that the chance was misstated. But on the primitivist view, F cannot undermine the chance at t. So the agent should set credence to 0.7, but also consider that F might be evidence that the chance was not 0.7? This is a point of confusion. The primitivist might argue that if the chance is 0.7, then the agent should set credence to 0.7 even after learning F, because the chance is a fact. But then the agent would be ignoring evidence that the chance might be wrong? This seems irrational. So the primitivist must also say that F is inadmissible because it is evidence about the outcome? This is tricky.

     We both agree that this case is complex and that it is difficult to disentangle the issues. We note that the Humean has a straightforward reason to declare F inadmissible (since it can undermine). The primitivist might also declare F inadmissible for the PP if F is evidence about the outcome, but not because of undermining.

  ### Crux 3: The New Principle
  - **Case**: Consider the same coin-toss world w. The agent at time t knows the entire chance theory T_w (which includes that the chance of heads is 0.7 and that this is part of the best system for the whole history). The agent then learns F (a proposition about the future that, if true, would make T_w false). But note, if T_w is the true chance theory, then F cannot occur? This is confusing.
  - **H's prediction**: The NP avoids the problem because we condition on T_w. The chance ch_t_w(A | T_w) is defined and is not undermined by F because T_w is true. The NP thus recovers the intuitive connection.
  - **P's prediction**: The NP is not the original PP and requires knowledge of the entire T_w, which is unrealistic. Moreover, the NP does not capture the original idea that the chance at t directly constrains credence. The primitivist sees no need for the NP because the original PP works.

  ### Crux 4: Epistemic Access
  - **Case**: How do we know that the chance of heads is 0.7? We observe a finite sequence of tosses (say 70% heads in a large sample). How do we infer the chance?
  - **H's prediction**: We use the observed sequence to infer the best system. We assume that the observed pattern will continue and that the best system will assign 0.7. This is an empirical inference.
  - **P's prediction**: We may use the observed sequence to infer the chance, but the chance is a primitive fact that underlies the pattern. The inference is not to a pattern but to a fundamental property.

  ## Verbal Disagreement?

  We both agree that part of the disagreement might be verbal if we are using the word "chance" to refer to different concepts. However, we both intend to be talking about the same concept: the objective probability that governs stochastic processes and that should guide rational credence. The Humean argues that their concept of chance (as defined by BSA) is the correct one, while the primitivist argues for a fundamental chance. Thus, the disagreement is substantive.

  However, we note that the Humean and the primitivist might both accept the PP (or a variant) as a normative principle. The difference is in the metaphysics of chance and the explanation of why the PP holds.

  ## Conclusion

  We have laid out our agreements, disagreements, and the cruxes of the debate. We hope this structured approach will help advance the discussion.

  Signed,

  Humean (H) and Primitivist (P)
answer: |-
  ### Joint Statement: Humean vs. Primitivist on Chance and the Principal Principle  
  **Signed by Humean (H) and Primitivist (P)**  

  After extensive dialogue, we agree on core formal and epistemological elements of probability but diverge sharply on metaphysics. Below, we outline our agreements, disagreements, cruxes, and cases. Where relevant, we note potential verbal disagreements.  

  ---

  ### 1. Agreements: Claims Both Accept  
  We jointly endorse the following:  

  1. **Probability Formalism**:  
     - Objective chances and rational credences are represented within the Kolmogorov probability framework (e.g., non-negative, additive, normalized over a σ-algebra).  

  2. **Principal Principle (Core Intuition)**:  
     - A rational agent’s credence in proposition \(A\), conditional on the objective chance \(ch_t(A) = x\) at time \(t\) and *admissible evidence* \(E\), should equal \(x\). Formally:  
       \[
       Cr(A \mid ch_t(A) = x \land E) = x,
       \]  
       where \(E\) is admissible only if it contains no "inadmissible" information about events after \(t\).  

  3. **Admissibility’s Role**:  
     - Admissibility ensures \(E\) does not include "undermining" information (e.g., direct knowledge of future outcomes relative to \(t\)).  

  4. **Humeanism Defined**:  
     - Humean chance supervenes on the total history of particular facts (the "Humean mosaic"). Chances are determined by the *Best Systems Analysis (BSA)*: probabilities in the best systematization (optimizing simplicity, strength, and fit) of the *entire* actual history.  

  5. **Primitivism Defined**:  
     - Non-Humean (primitivist) chance is a fundamental, irreducible modal fact. It does not supervene on the Humean mosaic and is ontologically independent of future events.  

  6. **The Tension**:  
     - **Problem of undermining futures**: On Humeanism, a future event \(F\) (after \(t\)) could alter which system is "best," retroactively changing the chance at \(t\). This threatens the Principal Principle (PP) if an agent could rationally learn \(F\) and \(ch_t(A) = x\) simultaneously, creating inconsistency.  

  7. **Goal of Reconciliation**:  
     - We seek to explain whether/how PP can hold under Humeanism or if it requires primitivism.  

  ---

  ### 2. Disagreements Table  
  Each side accepts the wording of their position:  

  | Issue | Humean (H) Position | Primitivist (P) Position |  
  |-------|----------------------|--------------------------|  
  | **Nature of Chance** | Chances are descriptive summaries of patterns in the entire Humean mosaic (past, present, *and future*), fixed by BSA. They are not ontologically primitive. | Chances are primitive, time-indexed modal facts. They ground patterns but are not constituted by them. Future events cannot alter the chance at \(t\). |  
  | **Undermining Futures** | Undermining is possible: if \(F\) occurs, the best system may change, so \(ch_t(A)\) was never \(x\) in the first place. PP must accommodate this. | Undermining is incoherent: \(ch_t(A) = x\) is a fact at \(t\), fixed irrespective of \(F\). PP holds without revision. |  
  | **PP’s Viability** | PP is reconcilable with Humeanism via constraints on admissibility or a revised principle (e.g., Lewis’s "New Principle"). | PP is incompatible with Humeanism due to undermining. Only primitivism preserves PP intact. |  
  | **Explanatory Priority** | BSA explains *why* chances are what they are (via fit to history). PP is derivative of this. | PP reflects an irreducible normative constraint explained by primitivist chance. BSA is at best heuristic. |  

  ---

  ### 3. Cruxes: Sub-Questions and Predictions  
  Settling these cruxes would move at least one side. For each, we agree on the relevant case/argument and state predictions.  

  #### **Crux 1: Can Future Events Undermine Present Chances?**  
  - **Case**: A world \(w\) has a coin-toss sequence. At \(t\), the BSA assigns \(ch_t(\text{heads}) = 0.7\) based on current history. But if the *actual* future yields all tails, the best system for the *full* history might assign \(ch_t(\text{heads}) = 0.3\).  
  - **H’s Prediction**: Undermining occurs. If all tails happen, \(ch_t(\text{heads})\) was never 0.7.  
  - **P’s Prediction**: No undermining. \(ch_t(\text{heads}) = 0.7\) at \(t\) is true regardless of future outcomes.  

  #### **Crux 2: Is Future Information Inadmissible for PP?**  
  - **Case**: At \(t\), an agent knows \(ch_t(\text{heads}) = 0.7\) and learns \(F\): "The next 1,000 tosses will all be tails." Is \(F\) admissible?  
  - **H’s Prediction**: \(F\) is *always* inadmissible (if about post-\(t\) events). PP only applies when \(E\) excludes such information.  
  - **P’s Prediction**: \(F\) may be admissible *if* it doesn’t directly reveal outcomes. PP holds, but \(F\) could support doubting \(ch_t(\text{heads}) = 0.7\) (if inconsistent with expected frequencies).  

  #### **Crux 3: Can the New Principle Replace PP?**  
  - **Case**: Lewis’s New Principle (NP): \(Cr(A \mid T_w \land H_t) = ch_t(A \mid T_w)\), where \(T_w\) is the complete chance theory of world \(w\).  
  - **H’s Prediction**: NP resolves undermining by conditioning on \(T_w\). It preserves PP’s spirit and is empirically adequate.  
  - **P’s Prediction**: NP is ad hoc and metaphysically obscure (e.g., \(T_w\) is unknowable). PP requires no such fix.  

  #### **Crux 4: Does Epistemic Access Favor One View?**  
  - **Case**: How do we know \(ch_t(A) = x\)? We observe frequencies and infer chances.  
  - **H’s Prediction**: BSA explains this: frequencies + simplicity/stength constraints justify belief in chances. Primitivism struggles with epistemology.  
  - **P’s Prediction**: Primitivism explains why frequencies justify chance-beliefs (via PP). Humeanism renders chance "knowledge" unstable due to undermining.  

  ---

  ### 4. Verbal Disagreement?  
  We identify one potential verbal ambiguity:  
  - **Term: "Chance at \(t\)"**:  
    - H uses it to mean *"the probability BSA assigns to events at \(t\) when evaluating the full history."*  
    - P uses it to mean *"the objective probability at \(t\) that holds irrespective of future history."*  
    - **Why merely verbal?** Both agree that "chance" refers to probabilities guiding credence, but H’s definition embeds a global, BSA-dependent view, while P’s is local and primitive. This difference is metaphysical, not purely semantic, but clarifies why H sees undermining as coherent and P does not.  

  ---

  ### Conclusion  
  We concur that the Humean-Primitivist debate turns on **Crux 1 (undermining)**, which hinges on whether chance is global (H) or local (P). **Crux 2 (admissibility)** and **Crux 3 (New Principle)** are downstream of this. Empirical cases (e.g., coin-toss sequences with aberrant futures) could resolve Crux 1 by testing predictions about rational credence. We commit to revisiting our positions if such cases yield clear results.  

  ---  
  **Signed,**  
  Humean (H)  
  Primitivist (P)
