prompt: |-
  I sit on the working group that decides which new diagnoses make it into the next revision of our association's classification manual, and we've got a proposal in front of us to add a new category — "persistent climate distress disorder" — for people whose anxiety, grief, or guilt about environmental change lasts more than six months and gets in the way of work or relationships. Half the group thinks this is long overdue: there are clearly people suffering in a distinctive way, and without a code they can't get reimbursed for treatment or included in research. The other half thinks we're about to create the very thing its supposed to describe: once the label exists, people will take it up as an identity, advocacy groups will form around it, clinicians will start seeing it everywhere, and the criteria will drift until we're classifying a different phenomenon than the one the proposal's authors think they're naming. I've been handed the job of drafting the group's decision memo for next month's vote. It needs a clear bottom line — approve, reject, or approve with conditions — plus a concrete timetable, and it should take the losing side's strongest consideration seriously rather than just listing objections. I keep coming back to the looping-effects worry (the idea that classifying people can change the people classified), but I'm not sure how far that gets us, since every diagnosis shapes the thing it names to some degree. So the memo has to say where the line is between "that's just normal classification" and "that's a loop we should refuse to set running." If you recommend conditions, make them concrete enough that the committee could actually adopt them — for instance, a re-evaluation schedule, a monitoring requirement, or limits on who can receive the diagnosis.
reasoning: |-
  Okay, let me unpack this complex request. The user is part of a committee deciding whether to add "persistent climate distress disorder" to their diagnostic manual, and they're caught between two valid concerns: clinical utility versus diagnostic looping effects. 

  The core tension here is fascinating - it's not just about whether the disorder exists, but how creating the category might reshape the phenomenon itself. The user specifically needs help drawing a line between acceptable diagnostic influence and dangerous feedback loops, which requires examining sociology-of-knowledge theories like Hacking's looping effects alongside practical clinical considerations.

  Hmm... the memo needs to balance several things: it must provide a clear recommendation while honoring both sides' strongest arguments. The pro-inclusion camp has justice concerns (access to care/research) while the anti-inclusion side warns of diagnostic creep. Neither is wrong. 

  What's tricky is translating abstract looping-effect concerns into concrete safeguards. Most diagnoses have some looping potential, but climate distress seems particularly vulnerable because it intersects with identity politics and collective action. The solution might lie in building what I'd call "diagnostic airbags" - mechanisms that make the category deliberately provisional and monitorable.

  *scratches head* The timetable aspect is crucial too - this can't be a permanent decision. Maybe recommend approval but with built-in sunset provisions and mandatory review triggers? That would address the looping worry by making the category explicitly experimental rather than fixed.

  For specific conditions, we could borrow from how the DSM handles controversial diagnoses: restricted use (e.g., only by climate-competent clinicians), mandatory symptom tracking beyond core criteria, and perhaps even a usage dashboard. The key is making the diagnosis "observable while in use" - like putting sensors on a new bridge.

  *checks clock* Better also emphasize that rejecting the diagnosis doesn't make the suffering less real - it just keeps it under existing codes. But that creates equity issues for research funding and insurance reimbursement... hence the conditional approval path seems most ethically defensible.
answer: |-
  Here’s a draft decision memo addressing your committee’s concerns, balancing clinical utility with looping-effect risks, and proposing concrete guardrails:

  ---

  **TO:** Classification Manual Revision Working Group  
  **FROM:** [Your Name/Position]  
  **SUBJECT:** Recommendation on Proposal for "Persistent Climate Distress Disorder" (PCDD)  
  **DATE:** [Date]

  ### Proposed Decision
  **Approve PCDD for inclusion in the classification manual on a provisional basis, subject to rigorous safeguards and a 5-year sunset clause.**

  ### Rationale
  This recommendation acknowledges both the documented clinical need for recognizing severe climate-related distress *and* the legitimate concerns about diagnostic looping. The provisional framework balances therapeutic access with safeguards against diagnostic creep.

  ### Key Safeguards (Conditions for Approval)
  1. **Strict Diagnostic Boundaries**  
     - Requires *both* of the following beyond core criteria:  
       (a) Functional impairment in ≥2 domains (work, relationships, self-care)  
       (b) Exclusion of preexisting trauma/anxiety disorders as primary drivers  
     - Prohibits diagnosis by general practitioners; restricted to mental health specialists with climate-competency training.

  2. **Mandatory Data Tracking**  
     - Clinicians must report anonymized data on:  
       - Prevalence of comorbid disorders  
       - Treatment modalities used  
       - Functional outcomes at 6/12/24 months  
     - National registry established for longitudinal monitoring.

  3. **Re-evaluation Timeline**  
     - **Sunset clause:** Diagnosis automatically expires 5 years post-implementation without committee re-approval.  
     - Interim review at 3 years to assess:  
       - Diagnostic drift (via case vignette audits)  
       - Socio-demographic patterning  
       - Efficacy of treatments  

  4. **Terminology Specification**  
     - Label: "Syndrome" not "Disorder" (emphasizing descriptive, not pathologizing intent).  
     - Exclusion criterion: Distress arising *solely* from activism participation or media exposure without broader functional impairment.

  ### Addressing Key Concerns
  - **Pro-Inclusion Argument (Access/Recognition):**  
    Provisional approval enables insurance reimbursement, targeted research, and validation for severely affected patients currently falling through diagnostic gaps. Registry data will empirically document need.

  - **Anti-Inclusion Argument (Looping Effects):**  
    Safeguards directly counter looping risks:  
    - **Restricted access** limits over-application  
    - **Outcome tracking** detects criterion drift  
    - **Sunset clause** forces evidence-based re-evaluation  
    - **Syndrome framing** reduces identity capture potential  

  ### Implementation Timeline
  | Phase | Actions | Deadline |
  |-------|---------|----------|
  | 1 | Finalize criteria/safeguards; develop clinician training | 3 months |
  | 2 | Launch registry; approve billing codes | 6 months |
  | 3 | Implement diagnosis (activation date) | 12 months |
  | 4 | Interim review of registry data | Year 3 |
  | 5 | Comprehensive re-evaluation/vote on permanence | Year 5 |

  ---

  ### Why This Threshold? Distinguishing "Normal" from "Dangerous" Looping
  All diagnoses shape behavior, but **three factors make looping ethically permissible here**:
  1. **Asymmetry of Harm**: Denying care to severe cases (status quo) outweighs potential overdiagnosis *when safeguards exist*.  
  2. **Monitorability**: Unlike abstract constructs, PCDD’s triggers (climate events) and impacts (functional impairment) are measurable.  
  3. **Reversibility**: Sunset clauses and data reviews create off-ramps if looping distorts the construct.  

  **The line is crossed** when:  
  - Diagnosis escapes clinical control (e.g., becomes a political identity)  
  - Criteria expand without evidence (e.g., subclinical distress included)  
  - Treatment outcomes don’t improve functionality  

  This framework ensures we halt the process if looping exceeds typical diagnostic influence and becomes a self-validating cultural script.

  ---

  **VOTE RECOMMENDATION:** Approve with above conditions.  
  **NEXT STEPS:** Circulate draft criteria/safeguards for amendment debate at [Date] meeting.  

  --- 

  This memo provides accountability through concrete monitoring while granting immediate clinical relief. The sunset clause forces confrontation with looping effects before they become irreversible, aligning with your group’s duty to balance innovation with diagnostic integrity.
