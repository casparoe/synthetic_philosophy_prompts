          - **How**: Acknowledge that CDT is based on the idea that you should only consider the causal consequences of your actions in the actual branch. In CM, paying has no causal effect on the heads branch (which is gone) and only costs you money. So CDT says don't pay. But then point out that by following CDT, you miss out on the benefits of coordination across branches. The policy argument is that you should act as if you are determining the policy for all branches, even though you are only in one.

  4. **Check Question**: At the end, to check understanding of the branch vs policy distinction, ask: 
     - "Suppose you are in the tails branch of the counterfactual mugging. If you pay the £100, what effect does that have on the heads branch? And what effect does it have on the policy that you are implementing for branches that might have been?"

