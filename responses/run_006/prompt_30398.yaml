answer: |-
  ### Session Plan: Counterfactual Mugging and Policy Across Branches  

  **Carrying Scenario:** The standard Omega-and-coin counterfactual mugging (CM).  
  **Justification:** CM cleanly isolates the policy-over-branches idea without the causal ambiguities of Newcomb or the extortion dynamics of real-world muggings. It features:  
  - A coin flip (random, independent event) creating two mutually exclusive branches (heads/tails).  
  - Omega’s prediction (based on your *policy*, not backward causation) affecting only the *counterfactual* branch (heads).  
  - A demand in the *actualised* branch (tails) with no causal link to the heads branch.  
  **Must Lack:**  
  - *No Newcollapsibility:* Unlike Newcomb, your decision does not "retrocause" the prediction; the coin outcome is independent and unchangeable.  
  - *No Extortion Dynamics:* Omega is not an ongoing threat; it is a one-shot, pre-resolved interaction with no reputation or escalation.  

  #### Session Sequence (60 Minutes Total)  
  1. **Recap and Framing (5 mins):**  
     - Briefly restate the Newcomb split (causal vs. evidential). Frame CM as a "post-Newcomb stress test" where both views face a new challenge: *How do we value actions in branches that didn’t happen?*  

  2. **Introduce Counterfactual Mugging (10 mins):**  
     - Present CM:  
       > *Omega flips a fair coin. If heads, Omega gives you £10,000 iff it predicted you’d pay £100 if tails. If tails, Omega asks for £100. The coin landed tails. Do you pay?*  
     - **First Pass:** Poll the group (show of hands: pay vs. don’t pay). Let objections surface organically but *do not debate yet*.  

  3. **Precommitment Pivot (10 mins):**  
     - **When:** Immediately after the poll.  
     - **Action:** Ask: *"Before the flip, would you precommit to paying on tails?"*  
       - Guide the group to calculate expected value:  
         - Precommit to pay: 50% chance of +£10,000, 50% chance of -£100 → EV = +£4,950.  
         - Precommit not to pay: EV = £0.  
       - Highlight: Precommitting dominates.  
     - **Why Here?** Preempts the "coin has landed" objection by shifting focus to *ex ante* rationality. If someone resists ("But the flip happened!"), defer: *"Hold that thought—we’ll unpack why this feels paradoxical."*  

  4. **Causal/Evidential Distillation (10 mins):**  
     - **When:** After establishing precommitment dominance.  
     - **Action:** Contrast CDT and EDT in CM:  
       - *CDT (causal):* "Paying in tails cannot *cause* heads outcome (already fixed). Refuse."  
       - *EDT (evidential):* "Paying *evidences* you’re the 'payer type,' so Omega *would have* rewarded heads. Pay."  
     - **Key Point:** EDT’s weakness—it conflates *evidence* with *counterfactual influence*. Sharpen the distinction: *Your action in tails doesn’t affect heads; it expresses a policy defining what *would have* happened in heads.*  

  5. **Policy Across Branches (15 mins):**  
     - **Core Idea:** An act is a *token* of a *policy* applied across possible branches.  
     - **Analogy:** "Paying £100 in tails is like signing a contract binding all versions of you—even the one in heads who benefits."  
     - **CM Resolution:** Paying implements the policy ("always pay") that maximises *ex ante* EV. Refusing is time-inconsistent.  
     - **Address CDT Intuition:** Acknowledge validity—CDT correctly says paying lacks causal power—but argue CDT *underweights* the value of branch-coordination. *"CDT wins the battle (this branch) but loses the war (across branches)."*  

  6. **XOR Blackmail as Stress Test (7 mins):**  
     - **When:** After policy argument is established.  
     - **Why Here?** CM primes the policy logic; XOR blackmail (XB) tests its limits with higher stakes and psychological revulsion.  
     - Present XB (termite variant):  
       > *Omega predicts if you’ll pay £1 upon learning your house is termite-free. If predicted 'pay,' it doesn’t infest. If predicted 'not pay,' it infests. Your house is termite-free. Omega demands £1 to 'prevent infestation.' Pay?*  
     - **Immediate Misconception:** "Paying is absurd—infestation is already avoided!" Use this to reinforce the policy view: *Paying settles the 'fee' for the counterfactual benefit (avoided infestation) secured by your policy.*  

  7. **Check Question (3 mins):**  
     - Pose: *"In CM’s tails branch, paying £100 cannot change the heads outcome. Yet it fulfils the policy that made the heads outcome possible. How does this differ from merely 'observing' evidence about yourself?"*  
     - **Goal:** Distinguish passive evidence (EDT) from active policy-enactment. Correct answer highlights: *Policy shapes counterfactual outcomes; evidence merely infers them.*  

  #### Misconception Map: Objections and Deflection Points  
  | **Objection**                          | **Expected Timing**          | **Deflection Strategy**                                                                 |  
  |----------------------------------------|------------------------------|-----------------------------------------------------------------------------------------|  
  | **1. "The coin landed tails—paying changes nothing!"** | During CM intro (Step 2)      | **Pivot to precommitment (Step 3).** Say: *"True, but before the flip, would you bind yourself to pay? Let’s see why that’s rational."* |  
  | **2. "This is just Newcomb in disguise!"** | During CDT/EDT distillation (Step 4) | **Contrast:** *"Newcomb’s boxes are causally ambiguous; CM’s coin is independent. Here, your choice doesn’t 'affect' Omega—it fulfils a cross-branch bargain."* |  
  | **3. "Never negotiate with muggers!"** | During policy discussion (Step 5) | **Isolate the scenario:** *"Omega isn’t a recurring threat—it’s a one-off with no reputation. Refusing gains nothing but breaks your *ex ante* optimal policy."* |  
  | **4. "Paying in XB is a reductio—it proves the policy view is absurd!"** | During XB stress test (Step 6) | **Reframe as fee-for-service:** *"The £1 isn’t for nothing; it’s the cost of the policy that *already* spared you infestation. Refusing voids the deal ex post."* |  
  | **5. "CDT is right—why care about branches that don’t exist?"** | After policy argument (Step 5) | **Acknowledge legitimacy:** *"CDT is coherent—it prioritises actual branch causality. But it ignores how policies *select* which branch you observe."* |  

  #### What to Leave Out  
  - **Formal decision theories (FDT, LDT):** Say: *"We’re focusing on the core intuition—policy as cross-branch coordination—not formal frameworks. Those come later."*  
  - **Newcomb deep dives:** Say: *"We’re using CM to move *beyond* Newcomb’s causal/evidential stalemate. Re-litigating Newcomb is off-topic."*  
  - **Termite variant nuances:** If XB timing confuses, clarify: *"Infestation is pre-set; payment is a post-hoc settlement, not prevention."*  

  **Summary:** In counterfactual dilemmas with perfect predictors, an agent should choose actions that enact a policy maximising expected utility across all branches, even when the action appears causally futile in the observed branch.
