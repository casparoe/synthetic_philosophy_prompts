     - We will not delve into logical decision theory (LDT) or functional decision theory (FDT) in formal detail. 
     - We will not attempt to resolve the philosophical debate between CDT and EDT. 
     - We will not explore every variant of these scenarios (e.g., transparent boxes, Parfit's hitchhiker). 
     - How to say: "Today, we are focusing on the core idea of policies across branches. We won't be covering all decision theories or variants, but we will see how this perspective offers a way out of some dilemmas."

  6. **Summary**: 
     - "Summary: In counterfactual scenarios with perfect predictors, an agent should choose actions that express a policy maximising expected utility across all possible branches, even when the action appears causally futile in the observed branch."

  Final Session Plan:

  1. **Introduction (5 mins)**: 
     - Recap Newcomb and the split. Introduce counterfactual mugging (CM) scenario.

  2. **First Pass at CM (10 mins)**:
     - Present CM, ask for initial reactions. Expect Objection 1 (coin has landed). Then introduce precommitment: ask if they would precommit to paying. Show the expected value calculation.

  3. **Causal/Evidential Distinction in CM (10 mins)**:
     - Clarify causal (CDT) and evidential (EDT) views. Objection 2 (this is Newcomb) arises. Highlight the difference: CM has a random coin flip and no causal link to the counterfactual branch. Introduce the policy view.

  4. **Policy View (10 mins)**:
     - Explain that the decision in the tails branch is about implementing a policy that applies to both branches. The policy of paying has higher expected utility. Address Objection 3 (refusal to negotiate) by noting the one-shot nature.

  5. **XOR Blackmail as Stress Test (10 mins)**:
     - Present XOR blackmail (termite version). Emphasise that the infestation is already set. Ask if they would pay. Expect Objection 4 (reductio). Argue that paying is the fee for having avoided infestation. 

  6. **Discussion and Check Question (5 mins)**:
     - Open floor for final thoughts. Then pose the check question.

  7. **Conclusion and Summary**:
     - State what we left out (as above). 
     - End with the summary sentence.

  Total: 50 minutes, allowing for some flexibility.

