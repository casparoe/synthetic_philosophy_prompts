     - It has no effect on the heads branch (which is already fixed and unchangeable). 
     - But it reveals/expresses that you are the type who pays, which means that in the heads branch (which didn't occur) you would have received £10,000 because Omega would have predicted you would pay. Moreover, it implements the policy of paying, which is the policy that, if followed, would have led to the £10,000 in the heads branch.

