          - **How to head off**: During the sharpening of the causal/evidential distinction (step e). Emphasise the key difference: in Newcomb, your decision is evidence of what the predictor did (which is in the past) and also, in the causal diagram, your decision might be thought to have a causal link to the prediction (if we allow backward causation). But in CM, the coin flip is independent and the heads branch is counterfactual. There is no causal link from your decision to the heads branch. The policy argument is about consistency across branches, not about changing the past.

