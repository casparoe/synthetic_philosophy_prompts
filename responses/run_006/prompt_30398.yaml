prompt: |-
  I convene a fortnightly reading group for software engineers and data scientists who know just enough decision theory to argue about Newcomb's problem; we spent the last two meetings on Newcomb and the evidential/causal split, and the group split almost evenly and enjoyed the fight. Next session I want to teach counterfactual mugging and XOR blackmail, and through them the idea that an act can be assessed by the policy it expresses across branches rather than only by its effects in the branch you observe. I do not want you to explain the scenarios or the idea to me; I want a plan for the session.

  The plan should lay out the order in which the pieces must be introduced and what depends on what: for example, where precommitment has to come relative to the first pass through the mugging, where the causal/evidential distinction has to be sharpened for this case, and whether XOR blackmail in its standard termite-infestation form belongs immediately after the mugging or is better held back as a stress test at the end. Choose one scenario to carry the whole session — I expect the standard Omega-and-coin case, in which tails costs you $100 and heads would have brought you $10,000 if Omega had predicted that you would pay on tails, but say if you would replace it with a variant and justify the choice — and specify what the carrying example must have and must lack so that it does not collapse into Newcomb's problem or into ordinary extortion. Then give the misconception map: the objections the group will raise, in the order they will raise them, and the exact point in the sequence where each should be headed off rather than argued with. I am fairly sure we will get the objection that the coin has already landed so paying cannot change anything, the objection that this is just Newcomb again, and some version of a refusal to negotiate with muggers; I want the full map, including whatever misconception makes XOR blackmail look like a reductio of paying the mugging. The plan should also say how to handle the fact that the coin-has-already-landed thought is not merely an error but the intuition behind one of the standard positions. End with a single question or small variant I can put to the group to check whether they have understood the difference between the branch they observe and the policy they are executing, and state explicitly what should be left out at this level and how I should say so.

  Please write the answer in British English, and make the very last line a one-sentence summary of the session's argumentative spine, beginning with 'Summary:'.
