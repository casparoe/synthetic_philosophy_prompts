  **Step 1: Clarify the Rule**
  - Rule: Voters rank the candidates in order of preference (1st, 2nd, 3rd). If a candidate gets a majority of first-preference votes, they win. If not, the candidate with the fewest first-preference votes is eliminated. The ballots of those who ranked the eliminated candidate first are redistributed according to their next preference. This continues until one candidate has a majority.
