  We are given the Gibbard-Satterthwaite theorem: no voting rule for 3 or more options is strategy-proof (unless it's dictatorial). So we cannot avoid the possibility of strategic voting entirely. However, we can design a procedure to evaluate voting rules for:

  1. How vulnerable they are to common forms of strategic voting.
  2. Whether they satisfy other desirable properties (like monotonicity, consistency, etc.) that might make them more robust in practice.
  3. How understandable they are to the members.

  We'll build a decision procedure that asks a series of questions about the voting rule. At each step, if the rule fails, we note the failure and perhaps provide an example of strategic voting. The procedure will also note when a tradeoff between values (e.g., strategy-resistance vs. simplicity) must be considered.

  **Decision Procedure for Evaluating a Voting Rule**

  **Step 1: Clarify the Rule**
  - *Question*: Can the rule be described unambiguously? (What are the allowed ballots? How are they counted? How is the winner determined?)
  - *Pass*: The rule is clearly defined for any number of voters and any set of candidates/options. We can write it down as an algorithm.
  - *Fail*: The rule is ambiguous or incomplete. We cannot proceed without clarification.
  - *Example*: If the rule says "members rank the candidates," but doesn't specify how to handle incomplete rankings, it fails until clarified.

  **Step 2: Check for Non-Dictatorship**
  - *Question*: Is the rule dictatorial? (Meaning, is there one voter whose top choice always wins, regardless of others?)
  - *Pass*: The rule is not dictatorial (which is desirable for a union).
  - *Fail*: The rule is dictatorial. This is unacceptable for a union vote.

  **Step 3: Check for Pareto Efficiency**
  - *Question*: If every voter prefers candidate A over candidate B, does the rule ensure that B does not win?
  - *Pass*: The rule satisfies the Pareto condition (if everyone prefers A to B, then B is not elected).
  - *Fail*: The rule might elect B even when everyone prefers A. This is a serious flaw.

  **Step 4: Check Monotonicity**
  - *Question*: If a candidate wins, and then we get a new set of ballots where the only change is that some voters have moved that candidate up in their rankings (or given more support to that candidate) without changing others, does that candidate still win?
  - *Pass*: The rule is monotonic. This is a desirable property and reduces the incentive for strategic demotion.
  - *Fail*: The rule is non-monotonic. We can exhibit an example: 
     - Suppose in the original vote, candidate A wins. Then in a new vote, some voters who ranked A lower now rank A higher (and nothing else changes), and A loses. This creates an incentive to not support your favorite fully.

  **Step 5: Check for Condorcet Consistency (if applicable)**
  - *Note*: This step is only for rules that use rankings (like RCV) and when we are choosing one winner from multiple candidates. For non-ranking rules (like approval) or when there are only two options, skip.
  - *Question*: If there is a candidate that beats every other candidate in head-to-head matchups (a Condorcet winner), does the rule elect that candidate?
  - *Pass*: The rule is Condorcet consistent. This is a strong property but not all good rules have it.
  - *Fail*: The rule may not elect the Condorcet winner. This might be acceptable if the rule has other benefits, but it can lead to outcomes that seem undemocratic.

  **Step 6: Check for Vulnerability to Common Strategies**
  We'll test two common strategic scenarios:

  **6.1. Compromising (Burying)**
  - *Question*: Can a voter help their favorite candidate by ranking a less-preferred candidate higher than they truly prefer (or by approving a candidate they don't really support)? Or conversely, by ranking a strong challenger lower (or not approving) to avoid helping them?
  - *Test*: Construct an example with 3 candidates (A, B, C) and a few voters. Show that if a voter who truly prefers A>B>C changes their ballot to B>A>C (or approves B and not A in approval voting) and this causes B to win instead of C (who would have won honestly) and the voter prefers B over C, then the rule is vulnerable to compromising.

  **6.2. Burying (in RCV)**
  - *Question*: In ranked-choice voting, can a voter help their favorite candidate by ranking a strong challenger below a weak candidate? (This is specific to RCV because of the elimination process.)
  - *Test*: Construct an example with 3 candidates (A, B, C) and a few voters. Suppose the voter's true preference is A>B>C. In the honest vote, candidate B wins. The voter then changes their ballot to A>C>B (so they "bury" B by ranking C above B). This change might cause B to be eliminated earlier and then A to beat C, which the voter prefers.

  **Step 7: Simplicity and Transparency**
  - *Question*: Can the rule be explained in plain language to the members in 5 minutes or less? And is it easy to count?
  - *Pass*: The rule is simple enough to explain and count without specialized software or complex steps.
  - *Fail*: The rule is too complex. This might be acceptable if the benefits are high, but it could lead to distrust.

  **Step 8: Tradeoff Recognition**
  - *Note*: After going through the above, we might have a rule that fails some steps but passes others. We must then weigh:
     - How severe are the failures? (Can they be easily exploited in practice? How likely?)
     - What are the benefits of the rule? (Does it produce more representative outcomes? Is it more inclusive? Simpler?)
     - The context: For example, in a contract ratification with multiple options, we might prefer a rule that allows expression of nuanced preferences even if it's somewhat manipulable.

  Now, let's apply this procedure to the three proposals.

