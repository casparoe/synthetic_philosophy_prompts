          So the original example I had was with 10,8,7 but then I thought A wins? I must have miscalculated. 

          Correction: 
              Original: 
                  10: A>B>C -> if C eliminated, they stay with A.
                  8: B>C>A -> if C eliminated, then they only have B (since they ranked C second and then A, but C is gone so they go to B? but the ballot is B first, then C, then A. So when C is eliminated, they still have B. So no change.
                  7: C>B>A -> if C eliminated, then they go to B.

              After elimination of C:
                  A:10
                  B:8+7=15
              So B wins.

          Therefore, in the original, B wins. So I made a mistake earlier.

     But there is a known burying example for IRV:

          Original:
              3: A>B>C
              2: B>C>A
              2: C>A>B
              1: C>B>A

          Without strategy: 
              First round: A:3, B:2, C:3 (2+1=3). Then we eliminate B (lowest). The 2 B voters transfer to C (B>C>A -> next is C). Then C:3+2=5, A:3. C wins.

          Now, the two B voters might try to help B by burying C? They change their ballot to B>A>C. Now:
              3: A>B>C
              2: B>A>C   (changed)
              2: C>A>B
              1: C>B>A
          First round: A:3, B:2, C:3. Still tie between B and C? We break the tie by eliminating B. Then the 2 B voters transfer to A (B>A>C -> next is A). Then A:3+2=5, C:3. A wins.

          But the B voters preferred B to win, and now they got A? They prefer A over C? Their true preference is B>C>A, so they prefer C to A. So they ended up with A, which is worse than C. So that backfired.

     So it seems difficult to find a successful burying example that doesn't backfire. However, the non-monotonicity we saw earlier is a form of vulnerability.

  **Conclusion for IRV**: 
  - Fails monotonicity and Condorcet consistency.
  - Vulnerable to compromising (as shown in the example where A voters switched to B to prevent C).
  - Burying is risky and might backfire.

  **Step 7: Simplicity and Transparency**
  - IRV is relatively simple. It can be explained as: rank the candidates; if no one gets a majority of first choices, the last-place candidate is eliminated and their votes go to their next choice; repeat until someone has a majority.
  - Pass.

  **Step 8: Tradeoff**
  - IRV is simple and avoids the spoiler effect that occurs in plurality voting. However, it fails monotonicity and Condorcet consistency, and is vulnerable to compromising. It might be a reasonable choice for officer elections if the members are familiar with it, but the vulnerabilities are real.

  **Proposal 1: Fail** (due to non-monotonicity and vulnerability to compromising)

