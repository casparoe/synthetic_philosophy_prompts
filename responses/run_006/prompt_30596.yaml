  Below is a reusable decision procedure for evaluating voting rules in your union context. It's designed to be practical, math-aware but not math-heavy, and focused on identifying vulnerabilities to strategic voting, transparency, and tradeoffs. I'll first present the procedure, then apply it to your three proposals.

  ### **Voting Rule Evaluation Procedure**
  This procedure evaluates voting rules on four dimensions: **clarity**, **strategy vulnerability**, **transparency**, and **fairness tradeoffs**. For each step, ask the questions below. If a rule fails any step, note the failure and exhibit a concrete example of strategic voting. The goal isn't perfection (per Gibbard-Satterthwaite) but minimizing high-risk vulnerabilities.

  ---

  #### **Step 1: Clarify the Rule**  
  **Questions:**  
  - Can the rule be explained in 1–2 plain-language sentences?  
  - Are ballot formats, counting procedures, and tiebreakers unambiguous?  
  - Does it handle ties or edge cases (e.g., exact ties, all candidates eliminated)?  

  **Pass:** Clear, complete, no ambiguity.  
  **Fail:** Vague, missing key details, or overly complex.  
  **Next:** If pass, proceed to Step 2. If fail, demand clarification.

  ---

  #### **Step 2: Identify Direct Strategy Vulnerabilities**  
  **Questions:**  
  - **Compromising:** Could voters help a less-preferred option by ranking/voting it higher (or approving it) to block a worse alternative?  
  - **Burying:** Could voters hurt a strong contender by ranking/voting it lower (or not approving) to boost their favorite?  
  - **Spoiler effect:** Can a "weak" option change the outcome by merely being present?  

  **Pass:** No clear, high-likelihood strategy found in common scenarios.  
  **Fail:** A strategy exists that could swing outcomes in a typical union-sized vote (≤500 voters).  
  **How to Exhibit Strategy:**  
     - Define a simple scenario (e.g., 3 options, 3 voter blocs).  
     - Show honest ballots → outcome.  
     - Show strategic ballots → changed outcome (worse for most).  
  **Next:** If pass, proceed to Step 3. If fail, the rule is vulnerable—weigh severity.

  ---

  #### **Step 3: Assess Transparency and Trust**  
  **Questions:**  
  - Can a non-expert member verify the count?  
  - Does it avoid "black box" steps (e.g., complex math, opaque algorithms)?  
  - Is it culturally acceptable (e.g., no "gaming" lingo)?  

  **Pass:** Counts are simple (e.g., tallying votes). Outcomes feel logical.  
  **Fail:** Requires software, advanced math, or feels like a "trick."  
  **Next:** If pass, proceed to Step 4. If fail, note as a trust issue.

  ---

  #### **Step 4: Acknowledge Tradeoffs**  
  **Questions:**  
  - What values does this rule prioritize? (e.g., simplicity, majority support, consensus)  
  - What values might it sacrifice? (e.g., electing Condorcet winners, expressive ballots)  
  - How severe are the tradeoffs for *your* context? (e.g., high stakes = low tolerance for manipulation)  

  **Outcome:** No rule is perfect. Document:  
     - "Acceptable" if tradeoffs align with union values (e.g., simplicity > nuance).  
     - "Unacceptable" if tradeoffs create high risk (e.g., frequent ties, invites gaming).  

  ---

  ### **Application to Your Proposals**
  I'll evaluate your three rules using the procedure. Gibbard-Satterthwaite means all fail Step 2 in theory, but we focus on *practical, exploitable* vulnerabilities.

  ---

  #### **Proposal 1: Instant-Runoff Voting (IRV) for 3-candidate officer election**  
  - **Rule:** Voters rank candidates 1–2–3. If no majority, eliminate last place, redistribute votes. Repeat until one has majority.  
  - **Step 1: Clarify**  
    - Pass. Simple explanation: "Rank candidates in order. If your top choice loses, your vote moves to your next choice."  
  - **Step 2: Strategy Vulnerability**  
    - **Fail.** Vulnerable to **burying**: Voters can hurt a strong rival by ranking them last.  
    - **Exhibit:**  
      - **Scenario:** 3 candidates: Left (L), Center (C), Right (R). 100 voters:  
        - 45 voters: L > C > R  
        - 30 voters: R > C > L  
        - 25 voters: C > L > R  
      - **Honest outcome:** C eliminated first (25 votes). L wins with 45 + 25 = 70 votes.  
      - **Strategic move:** R’s supporters fear L but prefer C to L. They bury C by ranking R > L > C:  
        - New ballots: 45 L>C>R, 30 R>L>C, 25 C>L>R.  
      - **New outcome:** C eliminated (25 votes → L). L now has 45 + 25 = 70; R has 30. L wins.  
        - *But R’s supporters failed*.  
      - **Adjust:** R’s supporters bury L instead: vote R > C > L.  
        - New ballots: 45 L>C>R, 30 R>C>L, 25 C>L>R.  
      - **New outcome:** C has 25, L has 45, R has 30. L eliminated. C gets L’s 45 votes → C wins 70–30.  
      - **Why it works:** R’s bloc made C win (their true #2) by burying L (their nemesis). L lost despite being the Condorcet winner (beats C 75–25, beats R 70–30).  
    - **Severity:** High risk in polarized races. Incentivizes "knife-fighting" between blocs.  
  - **Step 3: Transparency**  
    - Pass. Easy to explain; manual counts feasible with 400 voters.  
  - **Step 4: Tradeoffs**  
    - Prioritizes majority support, avoids vote-splitting.  
    - Sacrifices Condorcet efficiency (may eliminate popular compromise candidates early).  
    - **Verdict:** **Fail** due to high strategy risk in competitive races.  

  ---

  #### **Proposal 2: Approval Voting for 3-option contract decision**  
  - **Rule:** Voters approve any options they accept. Option with most approvals wins.  
  - **Step 1: Clarify**  
    - Pass. "Vote 'yes' for every offer you’d accept. The offer with the most 'yes' wins."  
  - **Step 2: Strategy Vulnerability**  
    - **Fail.** Vulnerable to **compromising**: Voters approve "good enough" options to block worse ones.  
    - **Exhibit:**  
      - **Scenario:** 3 options: Accept Co. Offer (A), Reject & Strike (S), Accept with Amendments (Am). 100 voters:  
        - 40 "militants": Only want Strike. Ballot: Approve S only.  
        - 40 "moderates": Prefer Am > A > S. Ballot: Approve Am and A.  
        - 20 "pragmatists": Prefer A > Am > S. Ballot: Approve A and Am.  
      - **Honest outcome:** A: 60, Am: 60, S: 40 → Tie between A and Am.  
      - **Strategic move:** Militants fear A or Am winning. They *compromise* by also approving Am (their #2) to ensure S doesn’t lose.  
        - New ballots: Militants approve S + Am.  
      - **New outcome:** S: 40, Am: 40 (militants) + 40 (moderates) + 20 (pragmatists) = 100, A: 60. Am wins.  
      - **Why it works:** Militants got Am (acceptable) instead of risking A (unacceptable) in a tiebreak. Moderates/pragmatists got their #1 or #2.  
    - **Severity:** Medium risk. Rewards "hedging" but may produce lukewarm outcomes.  
  - **Step 3: Transparency**  
    - Pass. Simpler than IRV; "vote for all you like" is intuitive.  
  - **Step 4: Tradeoffs**  
    - Prioritizes consensus, reduces polarization.  
    - Sacrifices strong mandates (winner may be everyone’s #2).  
    - **Verdict:** **Conditional pass**. Strategy risk exists but is lower-stakes (prevents "lesser evil" dilemmas). Best for contract votes where compromise is acceptable.  

  ---

  #### **Proposal 3: Majority between two options, chair breaks ties**  
  - **Rule:** Two options only. >50% wins. If tie, incumbent chair decides.  
  - **Step 1: Clarify**  
    - Pass. "Pick A or B. Whichever gets >50% wins. If tie, chair picks."  
  - **Step 2: Strategy Vulnerability**  
    - **Pass.** With only two options, Gibbard-Satterthwaite doesn’t apply. No ranking/approval = no burial/compromising.  
    - **Exception:** If voters coordinate to force a tie (e.g., 200–200), chair’s bias decides. But this requires precise coordination—unlikely with 400 voters.  
  - **Step 3: Transparency**  
    - Pass. Simplest possible rule.  
  - **Step 4: Tradeoffs**  
    - Prioritizes decisiveness, simplicity.  
    - Sacrifices nuance (forces binary choices). Chair’s tiebreak may cause distrust.  
    - **Verdict:** **Pass for binary votes**. Ideal for strike authorizations or yes/no votes. Not for multi-option decisions.  

  ---

  ### **Summary of Results**
  | Proposal          | Step 1 (Clarity) | Step 2 (Strategy) | Step 3 (Transparency) | Step 4 (Tradeoffs) | Overall Verdict |  
  |-------------------|------------------|-------------------|-----------------------|--------------------|-----------------|  
  | 1. IRV            | Pass             | **Fail** (burying) | Pass                  | Unacceptable risk  | ❌ Fail         |  
  | 2. Approval       | Pass             | **Fail** (compromising) | Pass          | Acceptable tradeoff | ✅ Conditional pass |  
  | 3. Binary majority| Pass             | Pass              | Pass                  | Acceptable tradeoff| ✅ Pass         |  

  ### **Key Conclusions**  
  - **What the procedure approves:**  
    - Binary majority votes (Proposal 3) are robust for two-option decisions.  
    - Approval voting (Proposal 2) is acceptable for multi-option votes *if* you prioritize compromise over strong mandates.  
  - **What it fails:**  
    - IRV (Proposal 1) fails due to high manipulation risk in competitive races.  
  - **What the procedure *can’t* settle (tradeoff zones):**  
    - **Values conflicts:** e.g., Approval voting ensures broad acceptance but may produce "weak" winners; IRV ensures majority support but invites tactical voting.  
    - **Social context:** If your union has a history of factional conflict, avoid IRV. If members value consensus, prefer Approval.  
    - **Tiebreakers:** All tiebreakers (e.g., chair’s vote) involve trust tradeoffs—no mathematical solution.  

  ### **Recommendations**  
  - **For officer elections (3+ candidates):** Use **Approval voting** (simpler, less manipulable than IRV).  
  - **For contract votes (3 options):** Use **Approval voting** to allow nuanced support.  
  - **For strike authorizations (binary):** Use **majority rule with chair tiebreak**.  
  - **Always:** Run the procedure *before* revising rules. Test new proposals with scenarios mirroring past conflicts.  

  This gives you a reusable tool to filter out high-risk rules and frame debates around tangible tradeoffs—not just abstract math.
