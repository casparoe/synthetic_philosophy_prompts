  - Rule: Voters can approve any number of options (including none, one, two, or all three). The option with the most approvals wins. In case of a tie, we need a tie-breaking rule (say, a runoff between the tied options, or the chair breaks the tie? The proposal doesn't specify. We'll assume a runoff is held if there's a tie.)
