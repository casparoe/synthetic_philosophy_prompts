     - Suppose every voter approves A and does not approve B. Then A will have at least as many approvals as B? Actually, A will be approved by everyone and B by none. So B cannot win.
     - However, if a voter prefers A to B but approves B and not A, then B might win even if everyone else prefers A to B. So Pareto efficiency might be violated if voters do not vote honestly. But we are considering strategic voting, so we must consider the possibility of insincere ballots.
     - But the definition of Pareto efficiency is about true preferences. We assume that if everyone truly prefers A to B, then in a sincere vote, they would not approve B without approving A? Not necessarily: a voter might approve only their top choice. But then B might get zero approvals. So in a sincere vote, if everyone prefers A to B, then B will have at most as many approvals as A (if a voter approves A and not B, or approves both, or neither). But it's possible that B gets more approvals than A? 

     Example:
          2 voters: 
              Voter1: prefers A>B>C. They approve only A.
              Voter2: prefers A>B>C. They approve A and B.
          Then A has 2 approvals, B has 1. So A wins.

     But if Voter2 approves only B? Then A:1, B:1, C:0. Then tie between A and B. Then in the runoff, if they both approve A and B, then it's a tie again? Or if Voter1 approves A and not B, and Voter2 approves B and not A, then it's a tie. We break arbitrarily.

     However, the true preferences are both A>B. So B should not win. But if the tie-breaker chooses B, then B wins. So we must design the tie-breaker to be Pareto efficient? 

     Let's assume the tie-breaker is a separate approval vote between the tied options. In the runoff, both voters would vote sincerely: 
          Voter1: only approves A.
          Voter2: might approve both? But they prefer A to B, so they might approve only A? Or they might approve both? 

     If they both approve only A in the runoff, then A wins. If Voter2 approves both, then A:2, B:1, so A wins. So B doesn't win.

     Therefore, with a proper tie-breaker, it might be Pareto efficient. But it's not guaranteed if voters are insincere.

     We'll give the benefit of the doubt: if we assume sincere voting, then it is Pareto efficient. So we'll pass.

  **Step 4: Monotonicity**
  - If an option wins, and then we add more approvals for that option (without changing approvals for others), does it still win? 
     - Yes, because the approval count for the winner increases (or stays the same) and others remain the same. So the winner's count is at least as high as before, and others are unchanged, so the winner still has the highest count (or tied, and then the tie-breaker might be needed, but if we add approvals for the winner, then it might break a tie in its favor).
     - Pass.

  **Step 5: Condorcet Consistency** - Not applicable because approval voting does not use rankings. We skip.

  **Step 6: Vulnerability to Common Strategies**

  **6.1. Compromising (Over/Under Approval)**
  - Voters might approve a candidate they don't fully support to prevent a worse one, or withhold approval from a candidate they do support to avoid helping a strong candidate they dislike.

     Example (three options: Accept, Strike, Amendments):

     Suppose the true preferences of a voter are: 
          Amendments > Accept > Strike

     They would ideally approve only Amendments. But if they fear that Strike might win, they might also approve Accept to help it beat Strike.

     Conversely, they might withhold approval from Amendments if they think Amendments is strong and they want to help Accept? 

     Let's make a scenario:

     - 60 voters:
          30: prefer Amendments > Accept > Strike
          30: prefer Accept > Strike > Amendments
          40: prefer Strike > Accept > Amendments

     - Sincere voting: 
          The Amendments group: might approve only Amendments? 
          The Accept group: might approve Accept and Strike? Or only Accept? 
          The Strike group: might approve Strike and Accept? Or only Strike?

     We need to assume a sincere strategy. Common sincere strategies in approval are:
          - Approve all above a threshold (like above average)
          - Approve only the top choice.

     Let's assume each group approves only their top choice:

          Amendments: 30 votes
          Accept: 30 votes
          Strike: 40 votes

          Strike wins.

     But the Amendments voters prefer Accept over Strike. They might regret not approving Accept.

     Now, if the Amendments voters strategically approve both Amendments and Accept:

          Amendments: 30
          Accept: 30 (from Accept group) + 30 (from Amendments group) = 60
          Strike: 40

          Then Accept wins.

     This is better for the Amendments voters than Strike winning. So they have an incentive to compromise.

     Another form: Under-approval. 

     Suppose we have:

          40: Amendments > Accept > Strike   [Group A]
          35: Accept > Amendments > Strike   [Group B]
          25: Strike > Accept > Amendments   [Group C]

     Sincere: 
          Group A: approve only Amendments.
          Group B: approve only Accept.
          Group C: approve only Strike.

          Then: Amendments:40, Accept:35, Strike:25 -> Amendments wins.

     But Group B (Accept voters) prefer Accept over Amendments. They might try to help Accept by also approving Amendments? No, because they want Amendments to be defeated? 

     Alternatively, they might try to not approve anyone else? That doesn't help.

     But if they insincerely withhold approval from Accept? That doesn't make sense.

     However, they can try to approve both Accept and Amendments? Then:

          Amendments: 40 (A) + 35 (B) = 75
          Accept: 35 (B) + 25 (C) = 60? Wait, no: Group C only approves Strike.

          So:
              Amendments: 40 (A) + 35 (B) = 75
              Accept: 35 (B)   (because Group C only approves Strike, and Group A only approves Amendments)
              Strike: 25 (C)

          Then Amendments wins by a landslide.

     That backfired.

     Alternatively, Group B (Accept) might try to get Group A (Amendments) to approve Accept? But Group A already doesn't approve Accept. 

     But Group A might be willing to compromise? They prefer Amendments, but they also prefer Accept over Strike. They might approve both. Then:

          Group A: approve both Amendments and Accept.
          Group B: approve only Accept.
          Group C: approve only Strike.

          Then:
              Amendments: 40
              Accept: 40 (A) + 35 (B) = 75
              Strike: 25

          Then Accept wins.

     This is better for Group A than if they had approved only Amendments and then Strike wins? In this scenario, with sincere voting by all, Amendments won. But if Group A compromises by approving both, then Accept wins. That is better for Group A than Strike winning, but worse than Amendments winning. So they wouldn't do it unless they fear Strike winning.

     In the sincere vote, Amendments won. So Group A has no incentive to change.

     But suppose we have:

          40: Amendments > Accept > Strike   [Group A]
          41: Accept > Strike > Amendments   [Group B]
          19: Strike > Accept > Amendments   [Group C]

     Sincere:
          Group A: only Amendments -> 40
          Group B: only Accept -> 41
          Group C: only Strike -> 19
          Accept wins.

     Group A might try to get Amendments to win. They can approve only Amendments? That doesn't help. Or they can try to get Group B to split? They can't control Group B.

     Group A might approve both Amendments and Accept? Then:
          Amendments: 40
          Accept: 40 (from A) + 41 (from B) = 81
          Strike: 19
          Accept still wins.

     Group A might withhold approval from Amendments? That doesn't help.

     So approval voting is vulnerable to compromising (over-approval) when there is a fear of a worse outcome.

  **6.2. Burying** - Not applicable because approval voting doesn't have rankings.

  **Step 7: Simplicity and Transparency**
  - Approval voting is very simple: vote for any options you find acceptable. Count the approvals; the option with the most wins.
  - Pass.

  **Step 8: Tradeoff**
  - Approval voting is simple and robust in many ways (monotonic, not vulnerable to burying). But it is vulnerable to compromising (over-approval). It might be a good choice for contract ratification because it allows voters to express support for multiple options. However, it can lead to the election of a compromise option that is not strongly preferred by anyone but is acceptable to many.

  **Proposal 2: Pass** (with the caveat that it is vulnerable to compromising, but this vulnerability is common and might be manageable)

  ---

  **Proposal 3: Plain majority between two options with the incumbent chair breaking ties.**

  **Step 1: Clarify the Rule**
  - When there are two options, the one with more votes wins. If it's a tie, the chair breaks the tie.
  - But what if there are more than two options? The proposal says "between two options". So this rule is only for binary choices.
  - For the contract decision with three options, this rule would not apply. We would need to reduce to two options first. The proposal doesn't say how. 
  - We'll assume this rule is only for binary decisions (like officer elections with only two candidates, or a strike authorization vote that is up/down).

  **Step 2: Non-Dictatorship**
  - Pass: The chair is not the only voter.

  **Step 3: Pareto Efficiency**
  - If everyone prefers A to B, then A will get at least as many votes as B? Not necessarily: they might vote strategically. But sincerely, everyone would vote for A over B, so A wins. 
  - Pass.

  **Step 4: Monotonicity**
  - If A wins and then we get new ballots where some voters who voted for B switch to A, then A still wins. 
  - Pass.

  **Step 5: Condorcet Consistency** - For two options, it's just majority, which is the same as the Condorcet winner if one exists. Pass.

  **Step 6: Vulnerability to Common Strategies**

  **6.1. Compromising/Burying** 
  - In a binary vote, there is no room for burying or compromising. You vote for the option you prefer. Any strategic voting would require a third option, but here there are only two.

     However, note that if the vote is between two options, but the members have more than two options in mind, they might vote strategically to avoid a third option. But the rule only allows two options on the ballot.

     Example: In a contract ratification vote, if the union leadership presents only two options (accept or strike), but some members want a third option (amendments), then they might vote against acceptance hoping to force the leadership to negotiate amendments. But that's not a flaw in the voting rule per se, but in the framing of the question.

  **Step 7: Simplicity and Transparency**
  - Very simple: majority wins, chair breaks ties.
  - Pass.

  **Step 8: Tradeoff**
  - This rule is strategy-proof for binary decisions (Gibbard–Satterthwaite doesn't apply to two options). But it becomes problematic if there are more than two options and we force a binary choice. The union might need a primary to reduce to two options, and that primary could be vulnerable to manipulation.

  **Proposal 3: Pass** (for binary decisions)

  ---

  **Summary of Recommendations**

  - **Proposal 1 (IRV)**: Fails due to non-monotonicity and vulnerability to compromising. Not recommended.
  - **Proposal 2 (Approval Voting)**: Passes with the caveat that it is vulnerable to compromising. It is simple and robust in other ways. Recommended with education about how to vote (explain that approving an option means you find it acceptable).
  - **Proposal 3 (Majority with tie-breaker)**: Passes for binary decisions. Recommended for votes that are naturally binary (like strike authorization). For multi-option votes, you would need a separate method to reduce to two options (like a primary vote).

  **What the Procedure Cannot Settle**

  - The procedure cannot tell you which rule is best. It can only identify vulnerabilities and properties. You must weigh the tradeoffs:
     - How likely is strategic voting in your union? 
     - How complex can the rule be without causing distrust?
     - For multi-option votes, what is the goal: to find a Condorcet winner? To find a compromise? To avoid the worst option?
  - The procedure also cannot account for the social dynamics of your union. A rule that works well in theory might be gamed in practice if there are coordinated factions.

  **Final Advice**

  - For officer elections (which typically have more than two candidates), approval voting might be a good alternative to IRV. It is simpler and avoids the non-monotonicity of IRV. 
  - For contract ratification with multiple options, approval voting is a reasonable choice because it allows members to express support for multiple options. But be aware that it might lead to a moderate outcome.
  - For binary decisions (like strike authorization), use plain majority with the chair breaking ties.

  Remember: no rule is perfect. The key is to pick one that is understandable and that the membership trusts, and to educate members on how to vote sincerely to achieve outcomes that reflect the collective will.
