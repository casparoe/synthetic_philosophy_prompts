prompt: |-
  I keep coming back to a one-liner that gets used in my philosophy of religion reading group, and I've realised I don't know what it's actually claiming. We're working through Hume on miracles, and whenever someone mentions a present-day miracle report — a cancer remission, a resurrection story, that sort of thing — one member shuts the discussion down with "extraordinary claims require extraordinary evidence." She says it as though it's the whole argument, and nobody pushes back.

  I want you to act as an epistemologist who knows Hume's essay on miracles inside out, and to think carefully before you write. Start by brainstorming all the different precise principles that slogan could be expressing — from the boringly true to the obviously false, and everything in between — before you settle on your list.

  Then lay the readings out as a menu. For each one: state the precise principle; say what "extraordinary" and "evidence" would have to mean for that reading to work; say whether it's a platitude, a substantive and defensible claim, or false; and say what it would imply for the kind of miracle testimony Hume was discussing. Which of these readings actually support dismissing testimony out of hand the way my friend does, and which don't? I'd also like you to tell me which reading is the most charatable reconstruction of what she probably means, and whether Hume's own argument in the essay commits him to that reading or to something weaker — and if the slogan on its best reading does no work beyond Hume, or is just a crude stand-in for a more careful claim, I want that said plainly.

  When you answer, lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating of the question.
reasoning: |-
  Hmm, the user is in a philosophy of religion reading group discussing Hume on miracles, and one member keeps shutting down discussions with "extraordinary claims require extraordinary evidence." The user realizes they don't understand what this slogan actually means and wants me to act as an epistemologist who knows Hume's essay thoroughly.

  I need to start by brainstorming all possible precise interpretations of this slogan. The slogan is vague and can mean many things, ranging from obvious truths to questionable claims. I should consider different definitions of "extraordinary" and "evidence" to map out the possibilities.

  For "extraordinary," it could refer to prior improbability based on natural laws, subjective surprise, deviation from common experience, or inherent implausibility. For "evidence," it could mean the quantity of evidence, its quality (reliability), its type (direct vs. testimonial), or its weight in Bayesian terms.

  Now, I'll outline several interpretations:

  1. **Prior Probability Threshold**: Claims with very low prior probability need stronger evidence to overcome initial skepticism. This is defensible and aligns with Bayesian reasoning.

  2. **Quantity of Evidence**: Extraordinary claims need more evidence pieces. This might be false because quality could matter more than quantity.

  3. **Quality of Evidence**: The evidence must be highly reliable and resistant to error. This is substantive and defensible.

  4. **Type of Evidence**: Only direct, non-testimonial evidence counts as extraordinary. This is too strict and false, as Hume himself relied on testimony for historical events.

  5. **Degree of Justification**: The level of justification must match the claim's implausibility. This is platitudinous but vague.

  6. **Social Epistemology**: Requires consensus from diverse experts. Defensible in some contexts but not absolute.

  7. **Impossible Evidence Threshold**: Claims require logically impossible evidence, which is absurd.

  Next, I'll evaluate each in terms of being a platitude, substantive, or false, and their implications for Hume's miracle testimony. Hume's argument is that uniform human experience supports natural laws, so any miracle report must be weighed against the probability of testimony being mistaken. He doesn't require "extraordinary" evidence beyond what's normally credible but emphasizes that even high-quality testimony might not suffice against strong prior probabilities.

  For the user's friend who dismisses testimony outright, interpretations like #1, #3, or #6 might support such dismissal if applied rigidly, but Hume's position is more nuanced—he doesn't dismiss testimony out of hand but subjects it to scrutiny. The most charitable reading for the friend is probably #1 or #3, which emphasize high standards due to low priors.

  Hume isn't committed to the slogan; his argument is about balancing probabilities, not requiring extraordinary evidence. The slogan is a crude simplification that misses his careful probabilistic approach. It might encourage unwarranted dismissal, which isn't Hume's intent.

  In my response, I'll start with the bottom line, then present the menu of interpretations with details, and conclude with implications. I need to be concise and structured, avoiding preamble as the user requested.
answer: |-
  The slogan "extraordinary claims require extraordinary evidence" is a crude oversimplification of Hume's probabilistic argument against miracles, often misused to dismiss testimony out of hand; it can be charitably read as demanding highly reliable evidence for claims with very low prior probability, but Hume's actual position is more nuanced and doesn't inherently support immediate dismissal. Below is a menu of precise interpretations, analyzed for defensibility and implications for Humean miracle testimony.

  ### Menu of Interpretations
  1. **Prior Probability Threshold**  
     - *Principle*: Claims with extremely low prior probability (based on uniform experience) require evidence strong enough to make their posterior probability credible (e.g., >0.5).  
     - *Definitions*: "Extraordinary claim" = claim with very low prior probability (e.g., violating natural laws). "Extraordinary evidence" = evidence with high likelihood ratio (Bayesian) that significantly raises the posterior probability.  
     - *Status*: Defensible (Bayesian epistemology).  
     - *Implication for Hume*: Aligns with his core argument—testimonial evidence for miracles must overcome the extreme prior improbability from uniform experience. Does *not* justify dismissing testimony out of hand; requires weighing evidence.  
     - *Supports dismissal?* No—demands evaluation, not automatic rejection.

  2. **Quantity of Evidence**  
     - *Principle*: Extraordinary claims require a larger volume of testimonial or empirical evidence than ordinary claims.  
     - *Definitions*: "Extraordinary claim" = surprising or anomalous claim. "Extraordinary evidence" = greater quantity of standard evidence (e.g., more witnesses, more documents).  
     - *Status*: False—quality and reliability matter more than quantity (e.g., 100 unreliable witnesses vs. one expert).  
     - *Implication for Hume*: Contradicts Hume, who focused on the *reliability* of testimony (e.g., human tendency toward error), not sheer volume.  
     - *Supports dismissal?* Weakly—if evidence is scarce, but Hume allows that strong testimony could, in theory, justify belief.

  3. **Quality/Reliability Threshold**  
     - *Principle*: Extraordinary claims require evidence of exceptionally high reliability (e.g., resistant to error, fraud, or misperception).  
     - *Definitions*: "Extraordinary claim" = claim prone to human error (e.g., miracles). "Extraordinary evidence" = evidence with near-perfect reliability (e.g., scientific instrumentation, multiple expert corroboration).  
     - *Status*: Defensible (epistemology of testimony).  
     - *Implication for Hume*: Fits Hume's emphasis on testimony's fallibility—he argues miracle reports typically arise from delusion or deceit, so only maximally reliable testimony might suffice.  
     - *Supports dismissal?* Conditionally—if testimony is deemed unreliable (e.g., anecdotal), dismissal is reasonable; but not *a priori*.

  4. **Direct Evidence Requirement**  
     - *Principle*: Extraordinary claims require direct, non-testimonial evidence (e.g., sensory or scientific proof).  
     - *Definitions*: "Extraordinary claim" = any claim beyond mundane events. "Extraordinary evidence" = non-testimonial evidence (e.g., empirical verification).  
     - *Status*: False—testimony can be sufficient for ordinary claims (e.g., historical events), so requiring direct proof for all extraordinary claims is dogmatic.  
     - *Implication for Hume*: Hume never demands direct evidence; he evaluates testimony probabilistically. This would make historical knowledge impossible.  
     - *Supports dismissal?* Yes—but unjustifiably, as it rejects all testimony for miracles by definition.

  5. **Degree of Justification**  
     - *Principle*: Extraordinary claims require a higher degree of justification (e.g., near-certainty) for rational acceptance.  
     - *Definitions*: "Extraordinary claim" = claim that would disrupt established knowledge. "Extraordinary evidence" = evidence producing very high epistemic confidence.  
     - *Status*: Platitude (trivially true, but vague—all claims require sufficient justification).  
     - *Implication for Hume*: Consistent with Hume's view that miracles, as violations of natural laws, need overwhelming proof. However, Hume quantifies this via probability balancing.  
     - *Supports dismissal?* No—specifies a standard, not a verdict.

  6. **Social Epistemology Reading**  
     - *Principle*: Extraordinary claims require evidence vetted by diverse, independent experts or institutions.  
     - *Definitions*: "Extraordinary claim" = claim challenging consensus. "Extraordinary evidence" = socially robust evidence (e.g., peer-reviewed, multi-disciplinary).  
     - *Status*: Defensible (social epistemology).  
     - *Implication for Hume*: Hume hints at this by noting miracle reports thrive in ignorant or partisan communities. It extends his skepticism about isolated testimony.  
     - *Supports dismissal?* Conditionally—if testimony lacks institutional support, dismissal may be reasonable; but not automatic.

  7. **Impossible Evidence Threshold**  
     - *Principle*: Extraordinary claims require logically impossible evidence (e.g., "evidence" that entails the claim's truth).  
     - *Definitions*: "Extraordinary claim" = metaphysically impossible claim. "Extraordinary evidence" = infallible proof (e.g., only possible if the claim is true).  
     - *Status*: False—no evidence is infallible; this makes justification impossible.  
     - *Implication for Hume*: Contradicts Hume, who treats miracles as improbable, not impossible, and allows conceivable (if unlikely) evidence.  
     - *Supports dismissal?* Yes—but absurdly, as it sets an unreachable bar.

  ### Charitable Reading and Hume's Commitment
  - **Most charitable reading for your friend**: Likely a blend of #1 (Prior Probability Threshold) and #3 (Quality/Reliability Threshold). This captures her intent: miracle claims (low prior probability) need evidence of exceptional reliability to be credible, and typical testimony (e.g., anecdotal reports) fails this standard.  
  - **Hume's commitment**: Hume is committed to #1 and #3, but weakly. His essay ("Of Miracles" in *An Enquiry Concerning Human Understanding*) argues that a miracle's prior improbability must be weighed against the probability that testimony is mistaken. He claims uniform experience favors natural laws so strongly that no testimony for a miracle could *reasonably* overcome it—unless the falsehood of the testimony would be more miraculous than the miracle itself. However, this is a probabilistic balance, not a demand for "extraordinary" evidence beyond high reliability.  
  - **Slogan's role**: The slogan is a crude stand-in for Hume's careful argument. It adds nothing and risks distortion by implying miracles require evidence of a "different kind" (e.g., #4) or an impossibly high bar (#7). Hume's position doesn't dismiss testimony out of hand but subjects it to scrutiny; your friend's use of the slogan to shut down discussion likely reflects an uncharitable, dogmatic application of #4 or #7, which Hume would reject. Ultimately, the slogan obscures Hume's key insight: the standard for evidence depends on the claim's prior probability, not its "extraordinariness."
