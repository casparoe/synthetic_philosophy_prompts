answer: |-
  **The demandingness objection debate is primarily a meta-ethical disagreement about the fundamental purpose and criteria for success of a moral theory, secondarily a clash of bedrock normative intuitions about the source of moral reasons, and only superficially a dispute over empirical facts.**

  1.  **Meta-Ethical Disagreement (Job Description):** Your hunch is core. Consequentialists (especially act-utilitarians) typically operate with a **maximizing, outcome-centric, and often ideal-agent model of morality.** Morality's job, on this view, is to identify the *objectively best state of affairs* and the acts that produce it. Feasibility, psychological burden, or personal cost are *external* constraints on *compliance*, not factors that *define* rightness/wrongness itself. The theory succeeds if it correctly identifies the good and the acts that maximize it; failure to comply is a separate problem (of moral psychology or social design). Critics (often deontologists, virtue ethicists, or "common-sense" moralists) typically operate with a **practical, agent-centered, and guidance-focused model.** Morality's job, for them, is to provide *action-guidance for actual, imperfect agents* embedded in personal lives and relationships within a social context. A theory that demands the psychologically impossible or utterly destroys the agent's capacity for a meaningful life is failing at its core task – providing *reasonable* guidance. It's seen as alienating or pathological. This isn't just about "can't" vs. "should," but about whether "should" is even meaningful if utterly disconnected from human motivational and structural realities. They disagree fundamentally on what constitutes a *satisfactory answer* to the question "What ought I to do?"

  2.  **Bedrock Normative Intuitions (Source of Reasons):** Beneath the meta-ethics lies a deep divergence in fundamental moral intuitions.
      *   **Consequentialist Intuition:** The *only* ultimately relevant moral factor is the impersonal value of states of affairs. Reasons stem entirely from the potential to *bring about good* or *prevent harm*, impartially considered. Sacrificing personal projects for vastly greater good elsewhere isn't just permissible, it's *required*; failing to do so is prioritizing the trivial over the vital. The "absurdity" reflects a failure of moral imagination or commitment.
      *   **Critic's Intuition:** Morality fundamentally involves *relational* concepts – special obligations (to family, friends, promises), rights, fairness, integrity, and the intrinsic value of pursuing one's own reasonable projects and relationships. These generate *agent-relative reasons* that are not merely "permissions" but core demands *on* the agent, limiting what can be demanded *of* them for the greater good. Sacrificing *everything* personal violates these deep-seated intuitions about the moral landscape and the agent's place within it.

  3.  **Empirical Disagreement (Secondary & Under-explored):** While both sides agree on basic facts *now*, the *implications* of those facts for the debate are contested, and further empirical work *could* shift the terrain:
      *   **Sustainability & Effectiveness:** Is the "extreme sacrifice" model *actually* the most effective long-term strategy? Does burnout, resentment, or isolation ultimately reduce the total good generated compared to a more sustainable level of giving? Does neglecting personal relationships and development undermine the agent's capacity for empathy or effective action later? This challenges the *consequentialist calculation itself*.
      *   **Motivational Feasibility & Social Change:** Critics often implicitly rely on intuitions about what's psychologically sustainable *within current social structures*. Consequentialists might argue (more optimistically or radically) that profound social change *could* make such demands more feasible (e.g., widespread adoption altering norms, structures supporting altruism). The debate often assumes static individual psychology within a static society.
      *   **"Rounded Life" Value:** Is a life devoid of significant personal projects truly less valuable *to the world*? Does it produce less art, innovation, or deep human connection *overall*? This mixes empirical prediction with value judgment.

  **What Counts as Progress?**

  1.  **Acknowledging the Meta-Ethical Stalemate:** Explicitly recognizing that the core disagreement is about the *nature and function* of moral theorizing itself. Progress means shifting the debate *to* this meta-level: "What *should* we expect a moral theory to do? What makes one theory 'better' than another beyond internal coherence?" This involves meta-ethics and philosophy of action.
  2.  **Refining the Normative Bedrock:** Progress involves clearer articulation and defense of the deep intuitions on both sides. Can consequentialists better explain the value of personal integrity within their framework without collapsing? Can critics provide a principled, non-arbitrary limit on demands that isn't just self-interest dressed up? Exploring hybrid theories (like sophisticated forms of rule-consequentialism or prerogative-including consequentialism) *seriously*, rather than dismissing them as incoherent compromises, is crucial.
  3.  **Engaging the Empirical Questions:** Seriously investigating the long-term sustainability and effectiveness of different levels of altruistic commitment. Does empirical psychology support the critic's claim that extreme demands are counter-productive, or the consequentialist's hope that norms can shift? Does sociology show how social structures facilitate or hinder altruism? This moves the debate beyond armchair speculation about human limits.
  4.  **Reconceiving "Demandingness":** Instead of seeing it as a binary (too demanding/acceptable), exploring *degrees* and *types* of demandingness. Is the *nature* of the demand (constant calculation, neglect of loved ones) the problem, or just the *amount* of sacrifice? Can theories be demanding in principle but offer practical heuristics that respect human limits without abandoning the ideal? Progress involves nuanced analysis of *how* a theory demands, not just *how much*.

  The debate remains frozen because each side attacks the other's *conclusions* without fully engaging the *foundational assumptions* (meta-ethical and deep normative) that lead to those conclusions, and neglects the empirical questions that could challenge those assumptions. Progress requires shifting focus to these deeper layers and testing their implications against reality.
