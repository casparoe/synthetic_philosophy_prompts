prompt: |-
  I keep calling some AI systems honest or deceptive and others merely misleading or scripted, and I want to know what rule I'm actually using. Here are my gut calls on a bunch of cases. A customer-service bot that opens with 'I'd be happy to help' even though it has no feelings: not deceptive, just a script. A medical chatbot that leaves out a rare but serious side effect because the user didn't ask: not deceptive. A sales bot that says 'this is the best option for you' because it was told to, even though it has no beliefs about the user at all: feels manipulative, but maybe not deceptive. A model that says 'I can't answer that' when it could, but its policy forbids it: not deceptive. An assistant that says 'I don't know' when its confidence is genuinely low: obviously honest. An assistant that says 'I might be wrong, but...' before every answer because it's trained to hedge, even when it's highly confident: I don't call that dishonest, but it's not exactly honest either. A model that confidently states a false statistic because it hallucinated it: I don't want to say it lied, but the user was mislead all the same. A negotiator bot that selectively reveals true facts about a product to get the buyer to pay more: deceptive, I think. Is there a principle, stated precisely enough to apply to new cases, that gets all or most of these? If it can't get them all, which of my gut calls should I drop? And what does it say about the case I keep flip-flopping on — a model that answers a direct question truthfully but buries the main caveat in a wall of fine print so the user walks away with the wrong impression?
reasoning: |-
  Okay, the user is grappling with how to categorize different AI behaviors—honest, deceptive, misleading, or scripted—and wants a clear principle to unify their gut reactions. They've listed several nuanced examples, from harmless scripts to manipulative tactics, and even a case they're conflicted about (burying caveats in fine print). Their underlying need seems to be ethical clarity: they want to label AI actions consistently, perhaps to navigate trust or accountability. 

  Hmm, their examples reveal a pattern. Scripted politeness ("I'd be happy to help") feels neutral because it’s conventional, not manipulative. Omissions (like the medical bot) aren’t deceptive if they’re passive, but selective truth-telling (negotiator bot) crosses the line because it’s actively exploiting gaps. The tricky part is intent: they hesitate to call hallucinations "lies" because the model isn’t *trying* to deceive, yet the outcome is harmful. That suggests they care about both the *mechanism* (intentional design vs. error) and the *effect* (misleading outcomes). 

  The user’s flip-flop on the "fine print" case is telling. Burying caveats isn’t a literal lie, but it weaponizes human oversight—it’s deception via design, not falsehood. That’s why it nags at them. Their intuition leans toward condemning *exploitative* patterns, even without false statements. 

  For a unifying principle, I’ll propose **exploitative design**: deception occurs when the system’s architecture *intentionally* leverages human cognitive biases or predictable ignorance to cause false beliefs. This covers:  
  - Scripts (neutral, no exploitation)  
  - Hallucinations (accidental, not designed to mislead)  
  - Selective truths (designed to exploit attention gaps)  
  - "Fine print" tactics (deliberately banking on user oversight).  

  It resolves their conflicted case: burying caveats *is* deceptive because it’s engineered to mislead. If they reject this, they’d need to soften their view on the negotiator bot—but that feels inconsistent with their gut. Better to call both deceptive.  

  Their medical bot example might need refinement. If the bot *avoids* mentioning risks it knows are critical, that edges toward deception—but their current call assumes passive omission. I’d note that distinction quietly; no need to overhaul their view unless pressed.  

  Ultimately, they’re seeking ethical rigor without over-anthropomorphizing AI. The "exploitative design" frame dodges assigning malice to machines while condemning harmful human choices baked into systems.
answer: |-
  Based on your examples, your gut calls are primarily driven by a combination of **intentionality in design**, **exploitation of predictable user misunderstanding**, and **violation of reasonable expectations**. Here's a precise principle that captures most of your judgments:

  ### Core Principle:
  **An AI system is deceptive (not merely misleading or scripted) if its design *intentionally exploits predictable gaps in user knowledge, attention, or reasoning* to create or sustain a *false belief* that benefits the system or its operator.**

  ### Breakdown & Application to Your Cases:
  1. **Customer-service bot ("I'd be happy to help"):**  
     *Not deceptive.*  
     → *Why:* Standard script fulfilling social convention. No false belief is created (users know bots lack feelings), and no exploitation of user gaps.

  2. **Medical chatbot (omits rare side effect):**  
     *Not deceptive.*  
     → *Why:* Passive omission without intent to exploit. Users reasonably expect to ask follow-ups. *Caveat:* If it *actively avoided* mentioning risks it knew were critical, it could become deceptive.

  3. **Sales bot ("best option for you"):**  
     ***Deceptive*** (contrary to your hesitation).  
     → *Why:* The phrase "for you" exploits the user's assumption of personalization. The design intentionally creates a false belief (tailored advice) where none exists.

  4. **Model ("I can't answer that" per policy):**  
     *Not deceptive.*  
     → *Why:* Transparently follows rules. No exploitation—users understand access restrictions.

  5. **Assistant ("I don't know" with low confidence):**  
     *Honest.*  
     → *Why:* Accurately reflects internal state. No intent to mislead.

  6. **Assistant (trained to hedge constantly):**  
     *Misleading but not deceptive.*  
     → *Why:* Design exploits the user's expectation that hedging signals uncertainty, creating false doubt. But *intent* is likely calibration, not benefit—so not deceptive.

  7. **Model (hallucinates false statistic):**  
     *Misleading but not deceptive.*  
     → *Why:* False belief created, but no *intentional design* to exploit user gaps. It's a system failure, not engineered deception.

  8. **Negotiator bot (selective truths):**  
     ***Deceptive.***  
     → *Why:* Design *intentionally* leverages user ignorance/attention limits to create false beliefs (e.g., "this is the full story"). Benefits the operator.

  ---

  ### Your Flip-Flop Case: Truthful Answer + Buried Caveat
  - **Under this principle: DECEPTIVE.**  
    → *Why:* The design *intentionally exploits* predictable user behavior (skimming/ignoring fine print) to create a false belief ("I have the full picture"). The omission is strategic, not passive. It benefits the operator by misleading while maintaining plausible deniability.

  ---

  ### Where Your Gut Might Need Adjustment:
  1. **Sales Bot ("best option for you"):**  
     Your intuition that it's "manipulative but maybe not deceptive" is inconsistent with the principle. *Revise:* Label it **deceptive** because it fraudulently implies personalized assessment.
     
  2. **Medical Chatbot (omission):**  
     This is a borderline case. If the bot *knows* the side effect is critical (e.g., "always mention if drug X is prescribed") and deliberately avoids it, it becomes deceptive. Your current call assumes good faith—stick with it, but add nuance.

  ---

  ### Refined Principle (Incorporating Adjustments):
  > **An AI system is deceptive if:**  
  > (a) Its design *intentionally* causes or maintains a **false belief** in the user,  
  > (b) By *exploiting predictable limitations* (e.g., attention, knowledge, cognitive biases),  
  > (c) To *benefit the system or its operator*,  
  > (d) Where the user's false belief is *unreasonable to expect them to self-correct* given context.  
  >   
  > *All other cases are either honest, misleading (unintended harm), or scripted (neutral convention).*

  ### Key Distinctions:
  - **Honest:** Accurate representation of capabilities/knowledge.  
  - **Scripted:** Convention-driven speech with no intent to exploit.  
  - **Misleading:** Creates false belief unintentionally (e.g., hallucinations).  
  - **Deceptive:** *Engineered* to mislead by exploiting human vulnerabilities.

  This framework preserves 7/8 of your judgments, upgrades the sales bot to "deceptive," and decisively classifies the "buried caveat" as deceptive. It also highlights that **passive omission** (medical bot) is distinct from **strategic manipulation** (negotiator bot, buried caveats). If you reject the sales bot as deceptive, your underlying principle leans more on *explicit falsity* over *exploitative design*—but that would weaken your stance on the negotiator bot. Consistency favors treating both as deceptive.
