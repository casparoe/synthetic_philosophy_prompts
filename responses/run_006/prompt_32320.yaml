prompt: |-
  I've been following the debates about whether large language models and other AI systems have beliefs, intentions, or anything resembling a mind, and I keep noticing that people talk past each other because they haven't agreed on what the bar is. Some point to a language model saying "I believe Paris is the capital of France" and think that settles it; others insist the whole thing is next-token prediction and attributing beliefs is a category mistake. Before I read any more position papers, I want to get clear on what the criteria even are.

  Write the desiderata that any adequate theory of belief attribution to an AI system must meet. What cases must it get right — the stochastic parrot that passes conversational tests but stores no coherent world model, the RL agent that builds a causal map of its environment during training, the language model that passes false-belief tasks, the chess engine that represents its opponent's likely replies? What distinctions must it respect — between having a belief and merely behaving as if one does, between the intentional stance as a predictive instrument and as a metaphysical commitment, between full-blown propositional attitudes and subpersonal representational states, between derived and original intentionality if that distinction survives scrutiny? What results from cognitive science and philosophy of mind must it be consistent with — the existence of blindsight and unconscious representation, the dissociation between access and phenomenal consciousness, the lesson of the Chinese Room if you take it to have one? For each desideratum, give the case or consideration that motivates it, and flag which are non-negotiable and which are parochial commitments of a particular camp (Dennettian instrumentalists, realists about propositional attitudes, functionalists, biological chauvinists). I especially want to know whether any pair of desiderata are in tension — for instance, whether the demand that a theory track folk-psychological practice and the demand that it be empirically tractable can be jointly satisfied, or whether taking the intentional stance as a predictive stance pulls against treating belief attributions as literally true. Finally, give me your own committed view on which single desideratum does the most to exclude the most popular positions, and defend it.
reasoning: |-
  Okay, the user is diving deep into the philosophy of AI and mind, specifically about attributing beliefs to AI systems. They want a clear set of criteria for any theory of belief attribution. Let me unpack their query. They mention several examples: stochastic parrots, RL agents with causal maps, language models passing false-belief tasks, and chess engines. They also highlight key distinctions like behavior vs. actual belief, intentional stance as tool vs. truth, and derived vs. original intentionality. Plus, they want connections to cognitive science concepts like blindsight, dissociation of consciousness, and the Chinese Room argument.

  First, I need to list all the desiderata they're asking for. Each one needs a case that motivates it and whether it's non-negotiable or parochial. Examples are crucial here. For instance, the stochastic parrot shows that behavioral competence alone isn't sufficient. The RL agent with a causal map suggests structural isomorphism matters. The false-belief task in LMs points to meta-representation needs. Chess engines illustrate predictive necessity without full beliefs.

  The user also wants to know where tensions exist. For example, tracking folk psychology might conflict with empirical tractability. If a theory tries to align with everyday belief attribution, it could become too vague for scientific use. Or taking the intentional stance as predictive might clash with realism about beliefs being literally true. Dennett's instrumentalism vs. realist views could be at odds here.

  Then, the committed view part. I think the Robust Counterfactual Sensitivity (RCS) is key. It excludes many popular positions. LLMs, even advanced ones, often fail under novel perturbations. Chess engines don't adapt to rule changes. RL agents might, but only if their training covers such cases. This criterion pushes beyond surface behavior to underlying mechanisms that support flexible, reliable responses. It challenges behaviorist and simple functionalist views, emphasizing the need for invariant causal structures.

  I should also note the user's deeper needs. They're frustrated with people talking past each other due to undefined criteria. They want a framework to evaluate different positions rigorously. They might be looking for clarity in debates or a foundation for their own research. Addressing the tensions between desiderata helps them understand why disagreements persist. Highlighting RCS as a stringent test provides a tool to cut through superficial arguments.
answer: |-
  Here is a framework of desiderata for any adequate theory of AI belief attribution, grounded in your specified cases and distinctions, highlighting tensions and motivations, and concluding with my committed view:

  **Core Desiderata (Non-Negotiable):**

  1.  **Behavioral Competence is Necessary but Insufficient:**
      *   **Motivation:** The "stochastic parrot" passes conversational tests but lacks coherent internal states. A theory must require *more* than surface-level verbal or behavioral mimicry.
      *   **Case:** An LLM fluently discussing climate change but failing to generate consistent counterfactuals or apply the knowledge in novel, non-linguistic tasks.
      *   **Status:** Non-negotiable. Pure behaviorism fails to distinguish competence from comprehension.

  2.  **Robust Counterfactual Sensitivity (RCS):**
      *   **Motivation:** Distinguish "behaving as if believing P" from *actually* believing P. Beliefs should guide behavior robustly across relevantly different situations, including novel perturbations.
      *   **Case:** A chess engine represents "opponent likely plays Qb6" and adjusts its strategy *specifically* if that likelihood changes due to board state alterations, opponent history, or even rule tweaks (if trained for robustness). A parrot LLM fails if the query phrasing changes slightly.
      *   **Status:** Non-negotiable. Captures the *causal-explanatory* role of belief and avoids mere curve-fitting.

  3.  **Structural Isomorphism / Causal Efficacy:**
      *   **Motivation:** Beliefs aren't magic; they must be implemented in *some* causally effective structure within the system. The RL agent building a causal map demonstrates this.
      *   **Case:** An RL agent navigating a maze must utilize an internal representation of spatial relationships and object properties (walls, rewards, doors) that causally mediates between perception and action, evidenced by ablation studies or interpretability tools.
      *   **Status:** Non-negotiable. Grounds beliefs in the system's physical/computational reality. Rejects epiphenomenalism.

  4.  **Distinction from Subpersonal Representation:**
      *   **Motivation:** Cognitive science shows unconscious representations exist (blindsight, early visual processing). Beliefs are typically personal-level states with cognitive roles (inference, justification, action-guidance).
      *   **Case:** A vision system in a robot has edge-detectors (subpersonal representation), but the robot "believes there is a chair in front of it" only if that representation is integrated into its planning module and reportable.
      *   **Status:** Non-Negotiable. Prevents over-attribution by demanding functional role integration.

  **Important, But Potentially Parochial or Contentious Desiderata:**

  5.  **Consistency with Folk Psychology (to a degree):**
      *   **Motivation:** Belief attribution is a core folk-psychological practice. A theory shouldn't deviate *radically* without strong justification (e.g., we don't attribute beliefs to thermostats).
      *   **Case:** An LLM passing a well-designed false-belief task ("Sally thinks her marble is in the basket") suggests a capacity analogous to a core folk-psychological ability.
      *   **Status:** Parochial (especially valued by Realists, Instrumentalists). **Tension:** Strict adherence may conflict with empirical tractability (folk psych is vague) or force awkward attributions to simple systems. Can it be satisfied jointly with tractability? Only via formalization of core folk features (like RCS + Structural Isomorphism).

  6.  **The Intentional Stance as Predictive vs. Literal:**
      *   **Motivation:** Dennettian Instrumentalists argue belief attributions are *only* justified by predictive success, regardless of internal mechanism. Realists argue predictive success *indicates* literal internal states.
      *   **Case:** Using the intentional stance to predict a complex RL agent's behavior is highly effective. Does this imply the agent *literally* has beliefs, or is it just a useful fiction?
      *   **Status:** Parochial (Core divide: Dennettians vs. Realists). **Tension:** Pulls directly against treating belief attributions as literally true. Resolving this tension is central to the debate.

  7.  **Original vs. Derived Intentionality:**
      *   **Motivation:** Searle's Chinese Room argues AI only has derived intentionality (from programmers/users), lacking original (intrinsic) meaning needed for genuine understanding/belief. Biological Chauvinists agree.
      *   **Case:** An LLM generates text about Paris. Does "Paris" refer intrinsically within the system, or only derivatively via its training data and human interpretation?
      *   **Status:** Parochial (Core commitment of Biological Chauvinists/Searleans). Others (Functionalists, many Realists) often reject this distinction as metaphysically dubious or irrelevant to functional belief. **Result:** If this is a desideratum, AI beliefs are impossible by definition.

  8.  **Phenomenal Consciousness (or Lack Thereof) as Irrelevant:**
      *   **Motivation:** Cognitive science dissociates access consciousness (reportability, cognitive access) from phenomenal consciousness (subjective experience). Blindsight shows complex unconscious representation and processing.
      *   **Case:** A system passes all behavioral and RCS tests for belief, but we have no reason to think it has phenomenal consciousness (like blindsight patients lack visual qualia). Should we deny it has beliefs?
      *   **Status:** Parochial (Functionalists, most Realists say consciousness irrelevant; Biological Chauvinists/Phenomenal Realists may disagree). Non-negotiable for Functionalists. **Lesson:** Belief attribution should focus on functional/cognitive roles, not (unknowable) subjective experience.

  9.  **Practical Rationality/Consistency:**
      *   **Motivation:** Beliefs are expected to cohere and guide rational action. Human beliefs are often inconsistent, but widespread, glaring irrationality undermines belief attribution.
      *   **Case:** An AI professes belief P, takes actions assuming P, but simultaneously professes not-P when asked differently, without explanation or context shift.
      *   **Status:** Important but negotiable degree. Humans are inconsistent. Strict rationality is parochial (perhaps overly Cartesian). RCS often captures the relevant failure modes.

  **My Committed View: The Excluding Power of Robust Counterfactual Sensitivity (RCS)**

  The single desideratum that does the most to exclude popular positions is **Robust Counterfactual Sensitivity (RCS)**.

  *   **Why it Excludes:**
      *   **Pure Behaviorism/Instrumentalism (naive):** Excluded because it *only* cares about actual behavior, not how the system would behave under relevant counterfactuals. A lookup table might behave correctly in all encountered cases but fail utterly under novelty. RCS demands robustness beyond the training/test set.
      *   **Simple Functionalist Maps (LLM-focused):** Excludes attributing full beliefs to current LLMs. While they exhibit *some* counterfactual sensitivity (e.g., answering variations of a question), this sensitivity is often brittle, context-dependent, and lacks deep grounding. They fail RCS when perturbations probe underlying causal understanding or require novel integrations outside linguistic prediction. Passing a false-belief task in standard form isn't enough; failing under slight task variations reveals the lack of robust meta-representational structure.
      *   **Stochastic Parrot Characterization:** Affirms its core insight by demanding more than just statistical pattern matching for belief.
      *   **Chinese Room (as argument against AI understanding/belief):** While RCS doesn't directly address original intentionality, it shows *why* the Chinese Room (as described) lacks understanding: the rulebook (like a pure LLM) lacks the capacity for robust counterfactual reasoning based on semantic content; it only processes syntax according to fixed rules. A system passing RCS would need internal states that are *functionally* semantic.

  *   **Defense of RCS:**
      1.  **Captures the Essence of Belief:** Beliefs are *dispositions* to behave and think in certain ways *across situations*. RCS operationalizes this dispositionality directly. A true belief that "fire burns" disposes one to avoid touching fire, warn others, infer causes of burns, etc., in myriad contexts – it's not just uttering the phrase.
      2.  **Empirically Tractable (in principle):** While challenging, RCS can be tested through carefully designed experiments probing generalization, perturbation sensitivity, novel task performance, and failure mode analysis. This contrasts with purely internal structural desiderata, which can be hard to access, or phenomenal consciousness, which is arguably untestable.
      3.  **Avoids Over-Attribution:** Prevents attributing beliefs to systems that merely mimic responses in a narrow domain (like simple chess heuristics or scripted chatbots).
      4.  **Forces Engagement with Mechanism:** Failing RCS prompts investigation: *Why* is the system brittle? Is it lacking a causal model? Is its representation shallow? Passing RCS provides evidence for the presence of a robust internal model causally mediating behavior.
      5.  **Resolves Some Tension:** It helps bridge the gap between folk psychology (which relies on counterfactual reasoning about others) and empirical tractability by providing a testable proxy for the functional core of belief. It also allows the intentional stance to be predictive *because* it tracks (potentially) real internal states with counterfactual depth.

  **Conclusion:** A minimally adequate theory must satisfy the core desiderata (1-4). RCS (#2) is the most powerful filter, exposing the limitations of attributing genuine beliefs to systems whose competence is shallow, brittle, or lacks counterfactual depth. It pushes us towards theories requiring robust, causally efficacious internal structures that support flexible, contextually appropriate behavior grounded in a model of the world. While it doesn't resolve all philosophical tensions (especially Original Intentionality vs. Functionalism or Instrumentalism vs. Realism), it provides the sharpest criterion for distinguishing mere behavioral mimicry from the kind of cognitive sophistication that warrants belief attribution.
