  Looking at the camps, each has a different foundational commitment. Goodmanians care about linguistic practice, metaphysicians about reality's structure, Bayesians about subjective probability, skeptics about justification, deflationists about practical impact. These aren't just disagreements; they're different starting points. So, the debate isn't solely about induction but about what counts as a satisfactory explanation.

