  First, I need to map the core challenges. Absolute convergence failure (thanks to Riemann) means reordering outcomes changes the "expected" value—so any theory must handle this without smuggling in ordering dependencies. The user specifically wants tension points highlighted, so I'll track where desiderata clash: e.g., strict dominance (Axiom 1) might demand we prefer Altadena over Pasadena, but tail-completeness could block this if payoffs grow too fast.  

  The user also wants a clear "settled vs. contested" split. For example, Stochastic Equivalence is near-universal (if two acts are probabilistically identical, treat them alike), but what about tail events? Some argue vanishingly small probabilities shouldn't sway decisions—that's where debates erupt. I should flag Tail Event Ignorance as a fault line: some see it as necessary for realism, others call it ad hoc.  

  They’re hunting for "jointly unsatisfiable" sets. Here’s the crux: Riemann rearrangement proves you can’t have all three of (1) Stability (order-invariance), (2) strict dominance, and (3) full tail sensitivity. Compromise is inevitable—e.g., Tail-Truncation Methods sacrifice tail sensitivity for stability, while Lexicographic systems let tail behavior break ties.  

  Notably, the user hates disguised consensus. I’ll explicitly note dissent: e.g., while Weak Dominance (Axiom 2) is widely accepted, its application to infinite states (e.g., "infinite switch") is contentious. Also, Continuity (Axiom 5) gets flak from finitists who reject infinitesimal probabilities.  

  Finally, I’ll structure desiderata by tier:  
  - **Non-negotiables**: Stochastic Equivalence, Weak Dominance, etc.—violate these and your theory is dead.  
  - **Negotiables but costly**: Tail completeness vs. tail ignorance. Sacrificing either has consequences.  
  - **Contentious**: Statewise Dominance for infinite partitions? Philosophers are still fistfighting over this.  

  The goal is to give the user a decision tree: "If you demand X, you must weaken Y; if you insist on Z, here’s whose work you’ll contradict." They’ll use this to stress-test proposals like Easwaran’s or Lauwers’—so precision is key.
answer: |-
  Here is a structured desiderata list for theories of rational choice under undefined expected value, reflecting the current state of the literature, key tensions, and contested points. I distinguish **non-negotiable** principles (violations imply fundamental incoherence) from **negotiable/contested** ones, and highlight irreconcilable tensions via the Riemann rearrangement theorem.

  ---

  ### **Core Non-Negotiable Desiderata**  
  *(Violations render the theory inconsistent or fundamentally irrational)*

  1.  **Stochastic Equivalence (SE)**  
      -   **Requirement:** Probabilistically identical acts must be valued equally.  
      -   **Case:** If Act A and Act B have identical outcome distributions (e.g., both simulate the Pasadena game), they must have identical preferences.  
      -   **Status:** Non-negotiable. Violation implies the theory responds to non-probabilistic features (e.g., labeling), violating rationality.

  2.  **Weak Dominance (WD)**  
      -   **Requirement:** If Act A yields outcomes at least as good as Act B in *every* possible state, and strictly better in some state with positive probability, then A ≻ B.  
      -   **Case:** Altadena game (Pasadena + $1 in every state) must be strictly preferred to Pasadena.  
      -   **Status:** Non-negotiable. Rejection allows dominated choices.

  3.  **Continuity with Finite Cases (CF)**  
      -   **Requirement:** The theory must reduce to standard EU maximization for acts with finite support or absolutely convergent expectations.  
      -   **Case:** A truncated Pasadena game (n terms) must be evaluated by its finite EU.  
      -   **Status:** Non-negotiable. Ensures compatibility with standard rationality.

  ---

  ### **Negotiable/Contested Desiderata**  
  *(Satisfaction depends on philosophical commitments; tensions exist)*

  4.  **Statewise Dominance for Infinite Partitions (SD∞)**  
      -   **Requirement:** Extends Weak Dominance to infinite partitions: If A > B in a set of states with positive measure and A ≥ B everywhere, then A ≻ B.  
      -   **Case:** Altadena vs. Pasadena (clear). Contentious case: "Infinite Switch" (A > B in infinitely many states, but measure zero).  
      -   **Status:** Contested. Some demand full SD∞ (e.g., Bartha), others reject it for "infinitesimal" improvements (e.g., proponents of tail-ignoring).

  5.  **Tail Completeness (TC)**  
      -   **Requirement:** The evaluation must incorporate the entire tail behavior of the distribution.  
      -   **Case:** Pasadena vs. "Reverse Pasadena" (payoffs negated and order reversed). EU diverges to +∞ and -∞ respectively under rearrangement. A TC theory must distinguish them.  
      -   **Status:** Negotiable. Rejected by "finitist" approaches (e.g., Easwaran's relative utilitarianism).

  6.  **Tail Event Ignorance (TEI)**  
      -   **Requirement:** Acts differing only in outcomes on a set of states with probability 0 ("tail events") should be indifferent.  
      -   **Case:** Two Pasadena variants differing only in the sign of payoffs for n > 10¹⁰⁰. Should they be valued equally?  
      -   **Status:** Contested. Proponents (e.g., Seidenfeld) argue tails are epistemically inaccessible; opponents (e.g., Arntzenius) argue TC is required for precision.

  7.  **Stability / Permutation-Invariance (PI)**  
      -   **Requirement:** The value assigned to an act is invariant under permutation (relabeling) of states with equal probability.  
      -   **Case:** Pasadena game must have the same value regardless of the order in which states are listed.  
      -   **Status:** Contested. **Riemann rearrangement shows PI is incompatible with TC and SD∞** (see Tensions below).

  8.  **Archimedean Property (AP)**  
      -   **Requirement:** No act is infinitely better/worse than another; trade-offs are always possible.  
      -   **Case:** Is the Altadena game infinitely better than Pasadena? Or merely marginally better?  
      -   **Status:** Contested. Lexicographic views (e.g., McClenaghan) reject AP; others (e.g., Lauwers) defend it.

  ---

  ### **Key Tensions & Impossibilities**

  1.  **Riemann Rearrangement Theorem (RRT) as the Core Obstacle:**  
      -   **Conflict:** RRT proves **Tail Completeness (TC)**, **Permutation-Invariance (PI)**, and **Statewise Dominance (SD∞)** are **jointly unsatisfiable** for non-absolutely convergent series.  
      -   **Example:**  
          -   Pasadena game: EU = 1 - 1/2 + 1/3 - 1/4 + ... can be rearranged to converge to *any* real number or diverge.  
          -   Suppose Theory X assigns value V to Pasadena (respecting PI).  
          -   A rearrangement yields "Pasadena+" (same payoffs, different order) converging to V+100 (respecting TC).  
          -   By PI, Pasadena+ has value V. By TC, it has value V+100 → Contradiction.  
          -   If Theory X respects SD∞, it must value Pasadena+ > Pasadena, but PI forces equality.  
      -   **Consequence:** Any theory must sacrifice at least one of TC, PI, or SD∞.  
          -   *Sacrifice TC:* E.g., **Tail-Truncation Methods** (Easwaran), **Relative Utilitarianism**.  
          -   *Sacrifice PI:* E.g., **Decision Schemes with Fixed Order** (Nover, Hájek).  
          -   *Sacrifice SD∞:* E.g., **Weakly Dominated Choices Allowed** (some fuzzy theories).

  2.  **Tail Completeness (TC) vs. Tail Event Ignorance (TEI):**  
      -   TC demands sensitivity to arbitrarily distant tail behavior; TEI demands insensitivity. These are mutually exclusive.  
      -   **Case:** Two Altadena variants differing only in the sign of payoffs for n > N. TC distinguishes them; TEI deems them equal.

  3.  **Archimedean Property (AP) vs. Lexical Priority:**  
      -   AP requires finite trade-offs; lexical views allow infinite superiority (e.g., avoiding any probability of hell).  
      -   **Case:** A "Heaven/Hell" game vs. Pasadena. Lexical views may reject Pasadena regardless of payoff scale; AP requires comparability.

  ---

  ### **Settled vs. Contested Landscape**

  | **Desideratum**           | **Status**           | **Major Proponents/Opponents**                                  | **Sacrificed When?**                     |
  |---------------------------|----------------------|-----------------------------------------------------------------|------------------------------------------|
  | Stochastic Equivalence (SE) | Settled (Non-neg)    | Universal                                                       | Never                                    |
  | Weak Dominance (WD)        | Settled (Non-neg)    | Universal                                                       | Never                                    |
  | Continuity (CF)            | Settled (Non-neg)    | Universal                                                       | Never                                    |
  | Statewise Dominance (SD∞)  | Contested            | Bartha (pro), Easwaran (con for infinite partitions)            | In fixed-order/lexicographic theories    |
  | Tail Completeness (TC)     | Contested            | Arntzenius, Nover (pro), Seidenfeld (con)                       | In truncation/TEI theories               |
  | Tail Event Ignorance (TEI) | Contested            | Seidenfeld, Smith (pro), Arntzenius (con)                       | In TC/permutation-invariant theories     |
  | Permutation-Invariance (PI)| Contested            | Kadane (pro), Nover (con - advocates order-dependence)          | In fixed-order theories                  |
  | Archimedean Property (AP)  | Contested            | Lauwers (pro), McClenaghan (con - lexical thresholds)           | In lexical priority theories             |

  ---

  ### **Conclusion: The Forced Trade-Off**
  The Riemann rearrangement theorem **forces a trilemma**: no theory can simultaneously satisfy **Tail Completeness**, **Permutation-Invariance**, **and Statewise Dominance** for non-absolutely convergent acts. Resolving this requires sacrificing one:
  - **Fixed-Order Theories** (e.g., Nover) sacrifice PI to preserve TC and SD∞.  
  - **Tail-Truncation Theories** (e.g., Easwaran) sacrifice TC to preserve PI and WD.  
  - **Weak Dominance-Limiters** (rare) sacrifice SD∞ for PI and TC.  

  Your evaluation of proposals should start by asking: *Which horn of the trilemma does this grasp?* and *Does it preserve the non-negotiables (SE, WD, CF)?* Genuine disagreement persists on TC, TEI, PI, SD∞, and AP—reflect your own epistemic priorities here.
