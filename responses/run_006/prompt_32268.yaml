prompt: |-
  I'm working through the literature on decision problems where expected value is undefined — the Pasadena game, the Altadena game, and others where the expectation fails to converge absolutely. Before I evaluate any proposed solution, I want the full specification of what a solution has to do.

  Write the desiderata list for a theory of rational choice under undefined expected values. Each desideratum should name the cases it must get right, the principles it must preserve (or explain why they fail), and the distinctions it must not collapse. For each, give the case or consideration that makes it a requirement, and tell me whether it's non-negotiable or a preference of one camp.

  I especially want to know: which pairs of desiderata are in tension, and is any subset jointly unsatisfiable? If the Riemann rearrangement theorem shows that some combination of requirements cannot be met, that's the insight I'm after.

  Separate what is settled from what is genuinely contested among people who know this literature, and don't present a contested view as the consensus.
