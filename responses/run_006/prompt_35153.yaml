  ### Diagnostic Decision Tree: The Problem of Finks, Masks, and Antidotes  
  **Instructions**: Answer each question based on your analysis of concrete cases (e.g., Martin’s electro-fink, Bird’s poison-antidote). Follow the branches to your position in logical space. The tree starts from the refuted Simple Conditional Analysis (SCA) and branches through key fault lines. Named positions are mapped to the leaves after the tree is built.  

  ---

  #### **Decision Tree**  
  1. **Q1: Do finkish/mask cases (e.g., electro-fink wire, poison with antidote) refute the Simple Conditional Analysis (SCA)?**  
     - **Yes** → Proceed to Q2.  
     - **No** → **Leaf 1: Simple Conditional Analysis (SCA)**  
       *Dispositions are defined by a simple stimulus-manifestation conditional (e.g., "if struck, then shattered"), but this is refuted by finks/masks and not a live option.*  

  2. **Q2: Can finks/masks be handled by a sophisticated conditional analysis (e.g., Lewis’s reform with causal bases or Choi/Manley and Wasserman’s stimulus-manifestation pairs)?**  
     - **Yes** → **Leaf 2: Sophisticated Conditional Analysis**  
       *Dispositions are defined by refined conditionals (e.g., holding intrinsic properties fixed), avoiding finks/masks by specifying ideal conditions.*  
     - **No** → Proceed to Q3.  

  3. **Q3: Are dispositions real and irreducible (i.e., fundamental properties not reducible to non-dispositional bases)?**  
     - **No** → **Leaf 3: Categoricalism / Realizer Functionalism**  
       *Dispositions reduce to non-dispositional (categorical) properties (e.g., atomic structures), which "realize" the dispositional role.*  
     - **Yes** → Proceed to Q4.  

  4. **Q4: At the fundamental level, are there non-dispositional (categorical) properties?**  
     - **No** → **Leaf 4: Pandispositionalism / Dispositional Monism**  
       *All fundamental properties are purely dispositional; objects are bundles of powers with no categorical "ground."*  
     - **Yes** → Proceed to Q5.  

  5. **Q5: Are fundamental properties identical to their dispositional and categorical aspects (i.e., one property with dual roles)?**  
     - **Yes** → **Leaf 5: Identity Theory / Dual-Aspect View**  
       *Dispositional and categorical properties are identical; a single property has two modes of characterization (e.g., fragility *is* a molecular structure).*  
     - **No** → **Leaf 6: Dispositional Primitivism**  
       *Dispositions are fundamental and irreducible, but distinct from fundamental categorical properties (e.g., powers exist alongside spatiotemporal relations).*  

  ---

  #### **Logical Space and Position Mapping**  
  - **Tree Structure**: 5 branching questions → 6 leaves.  
  - **Undefended Regions**:  
    - *Q4 "No" + Q5 "Yes"*: Logically possible (fundamental properties are both dispositional and categorical, but not identical) but unattractive—no clear examples in literature. It violates parsimony by positing dual natures without identity.  
    - *Q3 "No" + Dispositions reducible to non-categorical properties*: Logically possible (e.g., reducible to mathematical abstractions) but unexplored; categoricalism dominates reductionist approaches.  
  - **Unseparated Positions**:  
    - **Sophisticated CA variants (Lewis vs. Choi/Manley and Wasserman)** give identical answers here. To separate them, ask: *"Should the conditional analysis specify intrinsic causal bases (Lewis) or generalize across stimulus-manifestation pairs (Choi)?"* This is contested (Lewis emphasizes intrinsic bases; Choi avoids them).  
    - **Pandispositionalism vs. Identity Theory** are separated by Q5 (latter requires categorical aspects).  

  #### **Cross-Cutting Issue: Extrinsic Dispositions**  
  - **Accommodates Extrinsic Dispositions (e.g., being a key, vulnerability)**: Sophisticated CA, Categoricalism, Identity Theory, Dispositional Primitivism.  
    - *Sophisticated CA*: Conditionals can reference extrinsic factors.  
    - *Categoricalism*: Extrinsic categorical bases (e.g., social facts) are possible.  
    - *Identity Theory*: Extrinsic properties can have dual aspects.  
    - *Dispositional Primitivism*: Extrinsic powers (e.g., vulnerability) are fundamental.  
  - **Cannot Accommodate Extrinsic Dispositions (or only intrinsically)**: Pandispositionalism.  
    - *Pandispositionalism*: Typically commits to intrinsicness (e.g., Bird, Mumford). Fundamental dispositions must be intrinsic; extrinsic cases are non-fundamental/epiphenomenal.  
  - **Formally Committed to Intrinsicness**: Pandispositionalism (fundamental dispositions must be intrinsic).  
  - **Why Not a Branching Node?**  
    Extrinsicness cross-cuts: it doesn’t align with the core fink/mask fault lines (e.g., a pandispositionalist and primitivist may disagree on extrinsicness but share "dispositions are fundamental"). Adding it would double the leaves (e.g., "intrinsic pandispositionalism" vs. "extrinsic pandispositionalism"), complicating the tree without clarifying the fink/mask response.  

  ---

  **Tree Design Rationale**:  
  - Built from fault lines: (1) Viability of conditional analysis, (2) Dispositional reducibility, (3) Fundamental categorical properties, (4) Disposition-categorical identity.  
  - Combines Q4 and Q5 to separate pandispositionalism, identity theory, and primitivism cleanly.  
