  The first step that fails is step (1). Why? Because the backward induction leads the students to disbelieve the teacher's announcement. Therefore, when Friday comes, the students do not expect the quiz. Hence, a quiz on Friday would be a surprise. Therefore, step (1) is incorrect: it is not true that the quiz cannot be on Friday. It can be on Friday and it can be a surprise.

