  The students' reasoning:

  1. The quiz cannot be on Friday because if it hasn't happened by Thursday, then on Friday morning the students would know it must be that day and hence it wouldn't be a surprise.

  2. Having eliminated Friday, the quiz cannot be on Thursday because if it hasn't happened by Wednesday, then the students (knowing Friday is impossible) would know it must be Thursday and hence it wouldn't be a surprise.

  3. Similarly, this eliminates Wednesday, then Tuesday, then Monday.

  4. Therefore, no surprise quiz is possible.

  5. But if the quiz is given on Wednesday, it can be a surprise.

