  Now step (2): Having eliminated Friday, if we get to Thursday morning and the quiz hasn't happened, then the students would know that the quiz must be on Thursday (since Friday is eliminated). Therefore, the quiz on Thursday would not be a surprise. This also seems valid.

  But note: the students have to believe that Friday is eliminated. How did they eliminate Friday? By step (1). But step (1) requires that the students believe the teacher's announcement. However, if the students have already eliminated Friday, then they are effectively saying that the teacher's announcement is false because the quiz cannot be on Friday. But if the teacher's announcement is false, then why are they using it to eliminate Thursday?

