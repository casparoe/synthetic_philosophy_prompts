  The core paradox is this: How can saying "I promise" magically create a new moral reason where none existed before? And specifically, a reason owed to a particular person? The professor has already identified the weaknesses in Hume's conventionalism (infinite regress) and Scanlon's expectation-based account (circularity). 

  Hmm... the real challenge here is preserving three key features simultaneously: (1) the obligation's novelty (it didn't exist pre-utterance), (2) its directedness (owed specifically to promisee), and (3) avoiding circularity/regress. Most theories sacrifice one to save the others.

  Let me think about the conventionalist approach first. If promises work like chess rules, then why do we feel bound by social conventions at all? Saying "we promise to follow conventions" just kicks the can down the road. And grounding it in mutual advantage loses the "owed to you" element - it becomes generic utility.

  Scanlon's solution tries cleverly to ground it in the wrong of disappointing expectations. But as the professor noted, this feels backwards. The expectation matters precisely because a promise was made - the promise isn't valid because expectations exist. That's putting the cart before the horse. 

  The professor might be looking for a way out that preserves the phenomenology of promising - that visceral sense of "now I owe you specifically." Maybe we need to consider non-reductive accounts? Like viewing promising as a primitive moral act that constitutes new relationships. But that risks being mysterious.

  Another angle: perhaps the "bootstrapping" metaphor is misleading. Maybe promissory obligations aren't created ex nihilo but are transformations of pre-existing reasons (like respect for autonomy) through performative speech. But then how does the speech act transform them?

  The directedness element seems crucial. This isn't just about having a duty, but owing it to someone. That suggests we need an account of second-personal authority - how the promisee gains standing to hold me accountable. That might be the missing piece in conventionalist and utilitarian accounts.

  The professor seems frustrated with existing solutions. I should acknowledge how all escape routes appear blocked: conventionalism leads to regress, utilitarianism loses directedness, Scanlon circles back. The response should sit with that difficulty before cautiously suggesting possible paths forward.

  Perhaps the least bad option is to bite the bullet on one feature. For example, accept that directedness emerges from the practice (conventionalism) while arguing the regress stops at fundamental social goods. Or defend Scanlon by arguing the expectation isn't circular if we distinguish between the wrong of causing harm via reliance and the distinctive promissory layer.

  But the professor likely wants something more satisfying. The performative speech act angle deserves development - how "I promise" changes normative positions by creating new entitlements. This draws on Austin but needs moral grounding. The key is showing how this doesn't just push the mystery elsewhere.

  The word limit is tight. Need to reconstruct the circularity sharply first, then evaluate options without getting lost in tangents. Should conclude by emphasizing why this remains philosophically troubling - that's probably where the professor's own thinking is focused.
answer: |-
  ## Dissecting the Bootstrapping Problem in Promissory Obligation

  The normative bootstrapping problem is indeed a profound conceptual knot in the philosophy of promising. Let's reconstruct the core circularity worry: Promising appears to be a unique normative power – by performing a specific speech act ("I promise to φ"), an agent (the promisor) seemingly *creates* a new, directed obligation *ex nihilo*, owed specifically to the promisee. This creation is baffling because moral reasons are typically understood as grounded in prior facts (e.g., well-being, autonomy, fairness). How can mere words conjure such a reason? Attempts to ground this power inevitably seem to either presuppose the very power they seek to explain (circularity) or dissolve the distinctiveness of the promissory obligation (reduction).

  ### The Structural Trap
  1.  **The Need for Grounding:** The intuition that obligations cannot arise from sheer linguistic fiat demands an explanation *outside* the speech act itself. We seek a prior moral principle, convention, or state of affairs that confers normative force on the utterance.
  2.  **The Threat of Circularity:** Any proposed ground (e.g., a convention, a principle against disappointing expectations) must itself possess normative authority. If that authority is explained *by* the promissory power (e.g., "we promised to follow the convention"), we beg the question. The bootstrapping problem is the attempt to pull oneself up by one's own normative bootstraps.
  3.  **The Threat of Reduction/Dissolution:** Conversely, if the ground is a *different* kind of moral reason (e.g., general utility, a duty not to harm), we risk explaining away the *distinctive* features of promissory obligation:
      *   **Directedness/Owedness:** The obligation feels intrinsically *to* the promisee, giving them a special standing to demand performance, forgive, or release the obligation.
      *   **Content-Independence (to some degree):** The obligation arises primarily *because* of the promise, not (solely) because φ-ing is independently good or failing to φ is independently harmful.
      *   **Fiduciary Quality:** The promisor undertakes an obligation *for* the promisee, placing themselves under the promisee's authority in a specific domain.

  ### Evaluating Approaches Against the Trap

  1.  **Humean Conventionalism:**
      *   **The Trap:** It grounds the obligation in a social practice. But why is *this* practice binding? Appealing to a "tacit promise" to follow the convention is viciously circular. Appealing to mutual advantage (utility) dissolves distinctiveness: the obligation becomes a general duty to promote utility by adhering to beneficial conventions. Directedness is lost – I keep my promise *to you* only derivatively, because the *system* requires it for general welfare. My primary duty is to the system, not intrinsically *to you*.
      *   **Assessment:** Avoids circularity only by sacrificing directedness and content-independence. The obligation is not truly generated *ex nihilo* by the speech act; it's triggered by the act within a system whose bindingness is explained by utility.

  2.  **Scanlonian Expectation-Reliance (Principle F):**
      *   **The Trap:** Scanlon grounds promissory obligation in the wrong of intentionally leading another to form expectations and then disappointing them when they reasonably rely, causing harm (Principle F). The circularity worry is acute: the *reason* the promisee forms expectations and relies *is* that they believe the promissory utterance *already creates a binding obligation*. The "harm" of disappointment seems to derive its specific moral weight *from* the perceived pre-existing obligation. If I utter nonsense words that sound like a promise but are part of no known convention and create no legitimate expectation of obligation, disappointing the resulting "expectation" seems less clearly wrongful in the *distinctively promissory* way. Principle F explains the wrong of *breaking a promise* by appealing to the expectation *that the promise creates*, which presupposes the normative force of the promise itself.
      *   **Assessment:** Struggles to escape the circle without making Principle F implausibly broad. It risks conflating the wrong of promise-breaking with the wrong of misleadingly causing harmful reliance *simpliciter*, failing to capture the unique "undertaking" and directed authority inherent in promising. The expectation seems parasitic on the prior (presupposed) normativity of the promise.

  3.  **Alternative: The Authority-Transfer/Relationship-Constitutive View:**
      *   **The Proposal:** Promising is a performative act that creates a new normative relationship by transferring a specific kind of moral authority. By promising, the promisor *invites* the promisee's reliance and *grants* them a distinctive right to demand performance and hold them accountable. The obligation arises from the exercise of this normative power to intentionally alter the moral landscape between two agents.
      *   **Escaping the Trap?** This view rejects the need for a *prior* ground *external* to the relationship-altering act itself. The power to promise is seen as a fundamental moral power, rooted in mutual recognition of autonomy and the capacity for commitment. The "ground" is the inherent moral significance of agents intentionally creating special obligations *to each other* through recognized performative acts. Directedness is primary and constitutive, not derived.
      *   **Residual Worry:** This risks mystifying the normative power or simply pushing the question back: Why do we recognize *this* act ("I promise") as having *this* normative power? It must appeal to deeper moral facts about autonomy, respect, and the value of commitment itself. However, it avoids *explicit* circularity (it doesn't presuppose promissory obligation to explain promissory obligation) and doesn't reduce promissory duties to other kinds. It preserves directedness as foundational. The challenge is explaining why this specific speech act has this power, requiring an account of the social/moral context enabling such normative transactions.

  ### Conclusion

  The normative bootstrapping problem exposes a deep tension: preserving the phenomenology of promising (its *ex nihilo*, directed, content-independent character) while providing a non-circular explanation. Humean conventionalism breaks the circle only by sacrificing distinctiveness, collapsing into general utility. Scanlon's Principle F struggles to avoid presupposing the very obligation it seeks to explain when defining the relevant harmful expectation. Views emphasizing the fundamental normative power to create directed obligations via performative acts offer the most promising path, grounding the obligation in the exercise of autonomy within relationships of mutual recognition. While they face the challenge of justifying *this specific power*, they avoid vicious circularity and most faithfully preserve the unique "owed-to-you" nature of promissory obligation. The bootstrapping may not be *ex nihilo* after all, but a transformation of pre-existing moral capacities (autonomy, recognition) into a specific, directed duty through a socially and morally constitutive act. The circle is broken by locating the origin not in convention or consequence alone, but in the inherent moral significance of interpersonal commitment itself.
