prompt: |-
  I've been collecting my gut reactions about who is in a position to blame whom, and I want to know what principle, if any, is underneath them.

  Dave has been cheating on his wife for years. Last week he found out his brother-in-law had a one-night stand and really laid into him: you made a vow, you broke it, you wrecked your family. My gut says Dave has no business saying any of that. No standing, full stop.

  Same setup, but this time Dave opens with "look, I'm the last person to talk, I've done worse, but what you did was still wrong." My gut still says no standing. If anything the disclaimer makes it worse, because now he's using his own record as a shield while he keeps doing the thing.

  My aunt cheated exactly once, about twenty-five years ago. She told her husband the next day, they went to counseling, and she spent years rebuilding trust; she's been faithful ever since. Recently she told a younger friend, pretty firmly, that the friend's affair was wrong and she should come clean. My gut says my aunt has standing. I don't find her hypocritical at all.

  A coworker of mine has never cheated, but he's told me more than once that the only reason is lack of opportunity — he'd do it in a heartbeat if an attractive woman made it easy and he thought he wouldn't get caught. When he called another coworker a sleaze for cheating, my gut said that's off too. He doesnt get to blame, even though he's never actually done it.

  A guy who drops wrappers on the sidewalk every day sees a stranger drop a cup and mutters "people are such pigs." No standing there either.

  A stranger in a café overhears a couple letting their kid have unlimited tablet time and tells them they're setting him up for failure. My gut says he shouldn't say that, no standing — but its not that he's a hypocrite, it's just none of his business.

  The two verdicts I can't get to sit together are my aunt's and my coworker's: she actually did the thing and I give her standing, he never did and I don't. If you'd told me the rule was "no clean hands, no standing," I'd have it exactly backwards.

  The case I keep going back and forth on: my father-in-law smokes a pack a day, and he told my fourteen-year-old not to start smoking. Half of me thinks he's being a hypocrite and should shut up; the other half thinks he's exactly the person who should say it, because he knows first-hand what it costs.

  My working theory was something like: you have standing to blame someone for a wrong only if you're not currently treating the norm against that wrong as optional for yourself. But I can feel it straining against my aunt (she violated the norm once) and against the café stranger (he isn't treating any norm as optional).

  So: is there one principle — or a small set of candidates — that captures all of this, or nearly all of it? State it as precisely as you can, tell me what it says about the father-in-law case and about a case I haven't listed, and be straight with me about which of my verdicts it forces me to drop.
reasoning: |-
  Hmm, the user has been collecting scenarios about moral standing to blame others and wants to identify the underlying principle. They've shared several detailed examples with their intuitive judgments, and they're particularly puzzled by the contradiction between their aunt (who cheated once but reformed) having standing, versus their coworker (who hasn't cheated but would) not having standing. They also mention struggling with the father-in-law smoking case.

  First, I need to analyze their gut reactions systematically. Their verdicts are:
  - Dave (active cheater): no standing
  - Dave with disclaimer: no standing (worse)
  - Aunt (reformed cheater): standing
  - Coworker (would cheat if could): no standing
  - Litterbug: no standing
  - Café stranger: no standing (but not hypocrisy)
  - Father-in-law smoking: conflicted

  Key patterns emerge: 
  - Current/persistent wrongdoers lack standing (Dave, litterbug)
  - Mere inclination without action isn't enough (coworker)
  - Reformed wrongdoers gain standing (aunt)
  - Uninvolved third parties lack standing even if correct (café stranger)

  The core tension is between the aunt (past violation) having standing and the coworker (no violation) lacking it. This breaks the "clean hands" hypothesis. The real differentiator seems to be about current relationship to the norm and demonstrated commitment.

  For the father-in-law case, the conflict comes from two valid perspectives: his hypocrisy vs. his lived experience. This suggests the principle needs to accommodate both the speaker's current behavior AND the value of hard-won wisdom.

  The best candidate principle I can formulate is: **A person has moral standing to blame for a violation if they currently affirm the norm as binding and have demonstrated credible commitment to it.** 

  This explains:
  - Aunt: Affirms norm + credible commitment (reform)
  - Coworker: Doesn't affirm norm (treats it as optional)
  - Café stranger: Affirms norm but no standing - missing the relational element (not his community)
  - Dave: Doesn't affirm norm (actively violates)

  For the father-in-law: He affirms the norm (tells kid not to smoke) but lacks credible commitment (still smokes). So under this principle, no standing - which matches half the user's intuition. But we could allow it if he frames it as warning rather than blame.

  The case it struggles with is the café stranger - but that might be less about standing and more about boundaries. Adding "within one's moral community" as a qualifier would help.

  I should also acknowledge where this principle requires revising their verdicts: mainly the aunt case fits perfectly, but the café stranger would still lack standing under this framework as formulated. The father-in-law case would lean toward no standing unless he shows reform.

  This principle emphasizes that standing isn't just about past actions, but about one's current moral posture and whether they're positioned to speak with integrity. It makes sense of why reform matters and why hypothetical willingness undermines authority.
answer: |-
  Based on your gut reactions, there's a unifying principle that captures nearly all your verdicts. It focuses on **current normative commitment and relational context**, not just past actions or hypothetical willingness. Here's the principle stated precisely:

  ### The Principle of Credible Normative Commitment
  **A person (A) has moral standing to blame person (B) for violating norm (N) if and only if:**
  1. **A currently affirms N as binding** (not optional) for themselves and their community.
  2. **A demonstrates credible commitment to N**, either through consistent adherence or through demonstrable repentance/reform for past violations.
  3. **A's relationship to B or the context implies legitimate investment in upholding N** (e.g., kinship, mentorship, shared community — not mere strangers).

  This principle explains your judgments by focusing on *present integrity* and *relational legitimacy*, not just "clean hands." Let's test it against your cases:

  ---

  ### **Your Cases Revisited**
  1. **Dave (active cheater)**:  
     - *Violates #1 and #2*: He treats N ("no cheating") as optional for himself. No reform.  
     - *Your verdict upheld*: No standing. ✔️  

  2. **Dave with disclaimer**:  
     - *Violates #1 and #2*: His actions show he still treats N as optional. The disclaimer admits hypocrisy but doesn’t change his current behavior.  
     - *Your verdict upheld*: No standing (worse due to insincerity). ✔️  

  3. **Your aunt (reformed cheater)**:  
     - *Satisfies #1 and #2*: She affirms N as binding *now* and demonstrated credible commitment via repentance, counseling, and decades of fidelity.  
     - *Satisfies #3*: She speaks to a friend (relational context).  
     - *Your verdict upheld*: Standing. ✔️  

  4. **Coworker (would cheat if could)**:  
     - *Violates #1*: He explicitly treats N as optional ("I'd do it"). No credible commitment (#2).  
     - *Your verdict upheld*: No standing. ✔️  

  5. **Litterbug**:  
     - *Violates #1 and #2*: Actively violates the anti-littering norm daily.  
     - *Your verdict upheld*: No standing. ✔️  

  6. **Café stranger (parenting criticism)**:  
     - *Satisfies #1?*: Unclear, but assume he affirms the parenting norm.  
     - **Violates #3**: No relational context or legitimate investment (stranger intruding).  
     - *Your verdict upheld*: No standing. ✔️  

  7. **Father-in-law (smoker warning kid)**:  
     - *Violates #2*: He smokes daily → no credible commitment to the anti-smoking norm.  
     - *But*: He *might* satisfy #3 (kinship gives relational legitimacy for warnings).  
     - **Principle verdict**: **No standing** *if* he frames it as blame. But if he says, *"I regret starting; don’t be like me,"* it shifts from blame to testimony — which has standing under #2 (reform not required for warnings).  
     - *Your conflict resolved*: Your "hypocrite" half aligns; your "should say it" half requires reframing as advice, not blame.  

  ---

  ### **Where It Strains and Forces Revisions**
  - **Your aunt**: Fits perfectly. Past violation + reform = credible commitment (#2).  
  - **Café stranger**: The principle *upholds* your "no standing" verdict but clarifies it’s due to #3 (relational context), not hypocrisy.  
  - **Forced revision**: None! All your verdicts align.  

  ---

  ### **New Test Case: The Recovering Gambler**  
  *A gambler stole from his family during his addiction. He’s been in recovery for 5 years, repaid debts, and now runs a support group. He chastises a newcomer for lying about a relapse.*  

  - **Principle analysis**:  
    - #1: He affirms "no gambling/deception" as binding.  
    - #2: Demonstrable reform (recovery, restitution).  
    - #3: Legitimate investment (mentor in support group).  
  - **Verdict**: **Standing** — parallel to your aunt.  

  ---

  ### **Why This Works**  
  Your intuitions reject two extremes:  
  - **Hypocrisy** (blaming while violating; Dave/litterbug).  
  - **Normative indifference** (treating N as optional; coworker).  
  They reward **credible commitment** (aunt) and require **relational legitimacy** (café stranger excluded).  

  The father-in-law case fails on #2 (no credible commitment) but could gain standing by shifting from blame ("you’re wrong") to testimony ("learn from my mistake"). This matches your split intuition: we accept warnings from flawed experts, but not hypocrisy.  

  **In short**: Standing requires *living the norm now* (or showing reform), *plus the right to speak*. Past sins don’t disqualify; current insincerity or bystander status does.
