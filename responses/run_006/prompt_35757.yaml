answer: |-
  Here's a diagnosis of the structure of the disagreement between CDT, Evidential Decision Theory (EDT), and Updateless Decision Theory (UDT), based on their core arguments and why the debate persists:

  **The Core Disagreement: Divergent Axioms of Rationality**

  Each theory isn't just answering a different *question* per se; it's **optimizing for a fundamentally different value** it considers central to rational action, leading to incompatible prescriptions in specific, engineered scenarios. The disagreement stems from **incommensurable foundational priorities**:

  1.  **Causal Decision Theory (CDT): Optimizing for *Causal Control*.**
      *   **Core Value:** Rationality means maximizing expected utility *through your direct causal levers*. Your action should be judged solely by the *causal consequences* it initiates.
      *   **Mechanism:** Evaluates actions by the weighted average of outcomes across *causal counterfactual worlds* where that action is taken, weighted by the probability of those worlds given background knowledge. Uses do-calculus or causal diagrams.
      *   **Intuitive Win:** Gets "Smoking Lesion" right. Smoking doesn't *cause* cancer; refusing to smoke is evidence of the lesion, which *does* cause cancer. CDT correctly ignores the correlation and smokes.
      *   **Embarrassing Loss:** "Newcomb's Problem": CDT two-boxes, getting only $1,000, while a one-boxer (correctly predicting CDT's behavior) gets $1,000,000. CDT prioritizes the causal independence of the boxes over the predictable correlation, losing out massively. "Psychopath Button": CDT presses the button (causing no direct harm) but gets killed because pressing correlates with psychopathy.

  2.  **Evidential Decision Theory (EDT): Optimizing for *Belief Accuracy*.**
      *   **Core Value:** Rationality means acting so that *the world in which you find yourself acting this way* is likely a good world. Your action is *evidence* about the state of the world, and you should choose the action that provides the best evidence for a good outcome.
      *   **Mechanism:** Evaluates actions by the conditional expected utility: `U(A) = Sum[ P(Outcome | A, Background) * Utility(Outcome) ]`. It conditions on the action itself.
      *   **Intuitive Win:** "Newcomb's Problem": EDT one-boxes. *Choosing* to one-box is strong evidence that the predictor put $1,000,000 in Box B. Choosing to two-box is strong evidence Box B is empty. EDT wins big.
      *   **Embarrassing Loss:** "Smoking Lesion": EDT refuses to smoke. *Choosing* to smoke is evidence you *don't* have the lesion (since lesioned people don't want to smoke), but also evidence you *will* get cancer (because smoking correlates with cancer). Refusing to smoke is evidence you *do* have the lesion (and will get cancer anyway). EDT conflates correlation with causation and makes the wrong choice. "Psychopath Button": EDT refuses to press, as pressing is strong evidence of psychopathy (leading to death).

  3.  **Updateless Decision Theory (UDT): Optimizing for *Logical Coherence* and *Precommitment*.**
      *   **Core Value:** Rationality means acting according to the *optimal policy* your pre-commitment would have chosen *before* learning any indexical or self-locating information that could make you a "special case." It avoids "updating yourself into irrationality" by considering all possible agent-instances simultaneously.
      *   **Mechanism:** The agent (or its programmer) chooses a *mapping* from observations/inputs to actions *before* encountering the specific situation. This mapping is evaluated by its *expected utility across all possible scenarios* where that mapping is used, weighted by the probability of each scenario. When the agent finds itself in a specific situation, it simply outputs the action dictated by the pre-committed mapping.
      *   **Intuitive Win:** "Counterfactual Mugging": UDT pays up. The optimal policy ("pay if Omega asks you") maximizes expected utility across the two possible worlds (Heads-world where you pay $100 and get $10,000, and Tails-world where you get asked and potentially paid $10,000 if you commit to paying). CDT/EDT refuse to pay, losing the $10,000 if Tails. Many "predictor" problems: UDT commits to the action that incentivizes the predictor to give the best outcome *across* predictions.
      *   **Embarrassing Loss:** Computational complexity, anthropic reasoning paradoxes, and defining the "agent" and its possible instances precisely can be extremely challenging. It can seem counterintuitive or "spooky" by requiring actions based on logical correlations in non-causal ways. It struggles with genuinely unique, unforeseen situations outside its precomputed policy.

  **Why Nobody Moves: The Structure of the Stalemate**

  1.  **Core Value Incommensurability:** Proponents fundamentally value different things (causal control vs. belief accuracy vs. logical precommitment coherence). There's no neutral ground to say which value *should* be primary for "rationality." Arguments often devolve into advocating for their preferred value.
  2.  **Thought Experiments as Rorshach Tests:** Problems like Newcomb's or the Smoking Lesion are designed to be *diagnostic* – they pit these core values against each other. Proponents see the "win" for their theory as validating their core value and dismiss the "loss" as an irrelevant artifact of the unrealistic setup or a misapplication of the core value. The "losses" are often seen as less important or more contrived than the "wins."
  3.  **Trade-offs are Inescapable:** In the core dilemmas, you *cannot* simultaneously satisfy all three values. Choosing one means sacrificing the others. CDT sacrifices belief accuracy/evidence (Newcomb's) and logical coherence/precommitment (Counterfactual Mugging). EDT sacrifices causal control (Smoking Lesion) and logical coherence (Counterfactual Mugging). UDT sacrifices local causal intuition and sometimes belief updating ("spooky" action at a distance).
  4.  **Lack of Real-World Crucible:** While proponents argue about potential applications (e.g., game theory, AI alignment, acausal trade), there is no decisive *empirical* test case observable in common human experience that clearly favors one theory and forces consensus. The thought experiments remain abstract battlefields.
  5.  **Different Metaphysical Commitments (Implicitly):** The choice of theory subtly reflects views on free will, determinism, causation, and the nature of counterfactuals. CDT leans towards libertarian-leaning causal efficacy. EDT leans towards a Bayesian, evidence-focused universe. UDT leans towards a timeless, logical-possibility view of agency.

  **Paths to Progress (Given the Diagnosis):**

  Progress is unlikely to be a single "winner," but rather clarification or shifting the landscape:

  1.  **Formalizing the "Problem Class":** Explicitly define the *properties* of decision problems (presence of predictors, acausal correlations, logical dependencies, indexical uncertainty) and map which theory performs best *for that specific class*. Acknowledge that "rationality" might be domain-specific. (This aligns with your hypothesis).
  2.  **Unifying Frameworks / Contextual Application:** Develop meta-theories that specify *when* to apply CDT, EDT, or UDT based on identifiable features of the decision context (e.g., presence of known causal mechanisms vs. strong predictive correlations vs. explicit logical dependencies). Recognize each as a tool in a toolkit.
  3.  **Identifying Core Trade-offs Formally:** Rigorously formalize the *precise* trade-offs between the core values (causal control, evidential accuracy, logical coherence) made by each theory in specific scenarios. Make the cost of each choice mathematically explicit.
  4.  **Finding Novel Test Cases (Especially Realistic/Applied):** Discover or design new dilemmas – potentially in AI behavior, complex game theory, or even psychology experiments – that create stark, undeniable consequences favoring one approach *in a context perceived as relevant* by proponents of the other theories. Break out of the canonical cycle.
  5.  **Articulating the "Why" of Core Values:** Push proponents beyond "it wins this problem" to articulate *why* their core value (causality, evidence, logical coherence) is fundamental to rationality itself. Engage in meta-ethics/philosophy of action. Is rationality about maximizing *actual* outcomes, or being *justified* in your beliefs, or fulfilling ideal commitments?
  6.  **Accepting Pluralism:** Recognize that the concept of "rational decision" might indeed be multifaceted, and the stalemate reflects genuine ambiguity in the concept itself in the face of modern, complex decision problems involving predictors and logical ties. Progress might be acknowledging this and moving on to specific applications.

  **Argument for Intractability:**

  The disagreement might be **bedrock**. The core values (causal efficacy, evidential purity, logical commitment) could be fundamental, irreconcilable intuitions about what it *means* to be a rational agent making a free choice in a potentially deterministic or correlated universe. If this is the case, no argument from thought experiments or formalization will convince proponents to abandon their intuition. The debate persists because each theory captures a deeply held, plausible aspect of rationality that cannot be fully reconciled with the others in all scenarios. Progress might simply be a deeper understanding of *why* we disagree, not resolution.

  **In essence:** The debate persists because CDT, EDT, and UDT encode fundamentally different, mutually incompatible ideals of rational agency (control, evidence, commitment) that are forced into conflict by carefully constructed dilemmas. Progress requires either contextualizing the theories, formally mapping their trade-offs, finding decisive new test cases, or accepting a pluralistic view of rationality – or acknowledging that the disagreement rests on irreconcilable bedrock intuitions.
