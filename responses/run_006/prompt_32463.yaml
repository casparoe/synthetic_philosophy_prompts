answer: |-
  Below is a decision tree mapping the logical space of views on the **standing to blame**, structured to reflect key distinctions in the literature. The tree starts from the core question of whether correct moral judgment is sufficient for standing, then branches through the specified distinctions to named positions. Each leaf includes the position's name, its most awkward commitment, and notes on unseparated pairs or unoccupied branches.

  ### Decision Tree: Standing to Blame

  #### **1. Can standing be defeated by facts about the blamer?**  
     - **No → Universalism**  
       - *Awkward commitment:* Defends that even hypocrites, accomplices, or complete strangers have standing to blame if their moral judgment is correct.  
     - **Yes → Proceed to 2.**

  #### **2. What primarily defeats standing?**  
     - **Moral record (hypocrisy/complicity) → Proceed to 3.**  
     - **Relational factors (to victim/wrongdoer/community) → Proceed to 4.**

  #### **3. Which aspects of moral record defeat standing?**  
     - **Both hypocrisy and complicity → Comprehensive Moral Record View**  
       - *Awkward commitment:* Implies a morally pristine stranger has standing to blame even with no connection to the victim, wrongdoer, or community.  
     - **Only hypocrisy → Hypocrisy Account**  
       - *Awkward commitment:* Allows an accomplice (e.g., a co-conspirator) to blame the wrongdoer if they avoid hypocrisy.  
     - **Only complicity → Complicity Account**  
       - *Awkward commitment:* Permits hypocrites (e.g., unreformed offenders) to blame others for the same wrong they commit.  

  #### **4. Which relationship grounds standing?**  
     - **Relationship to the victim → Victim-Centered View**  
       - *Awkward commitment:* Denies standing to all third parties (e.g., unaffected observers) even if they are morally impeccable.  
     - **Relationship to the wrongdoer → Wrongdoer-Relation View (unnamed)**  
       - *Awkward commitment:* Risks denying standing to victims themselves if they lack a prior relational tie (e.g., a stranger assaulted by another stranger).  
     - **Relationship to the moral community → Communal View**  
       - *Awkward commitment:* Excludes outsiders (e.g., non-community members) from blaming serious wrongs, even when correct and well-intentioned.  

  ---

  ### Key Notes on the Tree  
  1. **Unseparated Pairs:**  
     - The tree **cannot distinguish** between *theoretical rationales* for why a factor defeats standing (e.g., hypocrisy accounts might appeal to fairness, warrant, or commitment-based reasons). All share the same branch.  
     - Relational views are grouped by *who* the relationship targets (victim/wrongdoer/community), but **not by the type** of relationship (e.g., familial vs. contractual).  

  2. **Unoccupied or Problematic Branches:**  
     - **Wrongdoer-Relation View (unnamed):** Logically possible but undefended in literature. Diagnosed as *unattractive* (likely incoherent in practice) because it undermines victims' standing.  
     - **Moral record + relational hybrids:** No branch combines both factors (e.g., "standing requires clean record AND community membership"). Diagnosed as *unexplored*—possible but omitted for simplicity in standard taxonomies.  
     - **Complicity-only without hypocrisy:** Defended (e.g., by Smith), but criticized for permitting hypocrites to blame.  

  3. **Terminology Clarifications:**  
     - **Universalism:** Sometimes called "Blame Absolutism" (e.g., Scanlon’s early work).  
     - **Comprehensive Moral Record View:** Associated with Todd (2019).  
     - **Hypocrisy Account:** Defended by Bell (2013); Wallace emphasizes its expressive role.  
     - **Communal View:** Rooted in Darwall’s second-personal authority; Scanlon’s later work.  

  ### Tree Structure Visualized  
  ```  
  Standing Defeated?  
  ├─ No → Universalism  
  └─ Yes → Defeated By?  
     ├─ Moral Record → Which Aspects?  
     │  ├─ Both → Comprehensive Moral Record View  
     │  ├─ Hypocrisy → Hypocrisy Account  
     │  └─ Complicity → Complicity Account  
     └─ Relational → Which Relationship?  
        ├─ Victim → Victim-Centered View  
        ├─ Wrongdoer → Wrongdoer-Relation View (unnamed)  
        └─ Community → Communal View  
  ```  

  This tree covers the core logical space while highlighting gaps and awkward commitments. Use it to stimulate debate on the conditions for legitimate blame, emphasizing tensions between moral purity, relational ties, and community authority.
