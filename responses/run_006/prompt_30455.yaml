answer: |-
  ## Joint Statement: Moral Realist (MR) & Expressivist (E) Collaboration

  We, the Moral Realist (MR) and the Expressivist (E), have engaged in lengthy debate. Recognizing we often talk past each other, we seek clarity. Below is a statement identifying common ground, precise disagreements, and key questions ("cruxes") whose resolution would significantly advance the discussion. We aim for formulations acceptable to both sides in the agreed section and accurate self-representations in the disagreements table.

  **Section 1: Shared Commitments (Signed by Both)**

  1.  **Core Moral Substance:** We share a deep commitment to the wrongness of acts like torturing cats for fun, stealing from the vulnerable, or inflicting cruelty without justification. We both endorse norms against such behavior and believe these endorsements are central to moral discourse and life.
  2.  **Attitudes are Central:** Moral judgments inherently involve, express, or are closely linked to conative psychological states – attitudes like approval/disapproval, plans, commitments, emotions (e.g., blame, praise), and motivations to act (or refrain from acting).
  3.  **Objectivity Aspiration:** Moral discourse functions *as if* it is about discovering and reporting objective features of the world. We aim to correct errors, offer reasons we believe others *should* accept, and resolve disagreements through reasoned argument, not just persuasion or force.
  4.  **Cognitive Surface Grammar:** Moral language *appears* fact-stating. It uses declarative sentences ("Stealing is wrong"), embeds in logical operators ("If stealing is wrong...", "It's not true that stealing is okay"), and we readily say we "believe" stealing is wrong.
  5.  **Rational Disagreement Possible:** Genuine disagreement about moral matters occurs and isn't merely a clash of brute preferences. Such disagreements involve appeals to reasons, consistency, consequences, principles, and conceptual understanding.

  **Section 2: Precise Statement of Disagreements**

  | Feature               | Moral Realist (MR) Position                                                                 | Expressivist (E) Position                                                                                             |
  | :-------------------- | :------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------- |
  | **Primary Function**  | Moral claims *describe* objective, stance-independent moral facts or properties.             | Moral claims *express* non-cognitive, conative attitudes (approval, disapproval, plans, commitments) towards actions. |
  | **Truth Aptitude**    | Moral claims are genuinely truth-apt; some are straightforwardly *true*.                    | Moral claims are not truth-apt in a robust, descriptive sense. Their primary function is expressive, not reportive.    |
  | **Moral Properties**  | Moral properties (e.g., wrongness) exist mind-independently and causally explain our judgments. | There are no stance-independent moral properties. Moral "properties" are projections of our attitudes onto the world. |
  | **Belief Nature**     | To judge that X is wrong is to *believe* the proposition that X has the objective property of wrongness. | To judge that X is wrong is to *have* a negative conative attitude towards X (e.g., disapproval, a plan to avoid/punish). |

  **Section 3: Cruxes – Key Sub-Questions & Predictions**

  1.  **Crux 1: Embedding & Logic (Conditionals, Negation)**
      *   **Question:** How do we explain the meaning and validity of arguments involving moral claims embedded within logical operators (e.g., conditionals like "If stealing is wrong, then asking your brother to steal is wrong," or negation like "It is not true that stealing is okay")?
      *   **Concrete Case:** Consider the argument: *P1: If harming innocents for fun is wrong, then encouraging others to do it is wrong. P2: Harming innocents for fun is wrong. C: Therefore, encouraging others to do it is wrong.* Why is this intuitively valid?
      *   **MR Prediction:** E's theory will struggle to explain the *logical validity* of such arguments without smuggling in descriptive content or truth-aptness for the atomic moral clauses. Validity requires truth preservation of propositional content.
      *   **E Prediction:** MR misunderstands the logic. Validity arises from consistency in the *expressed attitudes/plans*. Accepting P1 expresses a plan to condemn encouraging if one condemns harming. Accepting P2 condemns harming. Consistency *requires* condemning encouraging (C). This doesn't require atomic moral clauses to be truth-apt descriptions.
      *   **Why it Matters:** If E can adequately explain embedded logic without positing descriptive truth, it weakens a major MR argument. If not, it strengthens MR.

  2.  **Crux 2: Judgment-Motivation Link**
      *   **Question:** Is the (defeasible) connection between sincerely judging that X is wrong and feeling some motivation not to do X (or approval for blaming doers) part of the *meaning* of the judgment, or is it merely a strong, contingent psychological correlation?
      *   **Concrete Case:** Imagine "Smith": Smith sincerely asserts "Cheating on this test would be wrong" and can articulate reasons why (unfair advantage, undermines trust), yet Smith feels no motivation to refrain and actively plans to cheat, feeling no guilt. Has Smith made a *conceptual* error regarding the meaning of "wrong," or is Smith merely apathetic/psychologically unusual?
      *   **MR Prediction:** E will be forced to say Smith either doesn't *truly* believe cheating is wrong (conflating belief with attitude) or must posit an implausible conceptual confusion. MR can easily accommodate Smith as someone who believes the truth but suffers from weakness of will, apathy, or psychological defect.
      *   **E Prediction:** MR misdiagnoses the case. Smith's lack of motivation *is* evidence that Smith doesn't fully grasp the meaning of "wrong" as used in moral contexts. Sincere moral judgment *constitutively* involves a relevant conative attitude; otherwise, it's merely an abstract intellectual acknowledgment lacking moral force. Smith is conceptually confused or insincere.
      *   **Why it Matters:** If the link is conceptual (E), it supports the non-cognitive core. If it's contingent (MR), it supports the separation of belief (cognitive) from motivation (conative).

  **Section 4: Merely Verbal Elements**

  Significant friction arises from differing uses of key terms:
  *   **"True":** Both can agree moral claims are "true" in a *minimalist* or *deflationary* sense (e.g., "Stealing is wrong" is true iff stealing is wrong). The **real** disagreement is whether this truth corresponds to robust, stance-independent facts (MR) or is merely a reflection of our expressive commitments (E).
  *   **"Fact":** Both can agree there are "moral facts" in the sense of *true moral propositions* (minimalist). The **real** disagreement is whether these facts describe mind-independent properties/relations (MR) or are constituted by our collective attitudes/commitments (E leans towards this) or are merely a way of talking about our expressions (E's core).
  *   **"Belief":** Both agree we have "moral beliefs." The **real** disagreement is whether these beliefs are purely cognitive states representing the world (MR) or are hybrid/inseparable from conative states, or even *are* conative states labeled as "beliefs" (E).

  **Deepest Real Disagreement:**

  **Whether the fundamental authority and categoricity of moral demands find their ultimate source in features of a mind-independent reality or arise from the nature of our own practical, conative commitments and the demands of interpersonal rationality.**
