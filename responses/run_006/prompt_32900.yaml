  Potential pitfalls: Some might intuit that a glued hammer is an object but not the disassembled one. That points to fastening. If they accept both, universalism. Reject both? Nihilism. The sandcastle question tests whether function matters. Functionalists might accept it, while fastening-based might require physical bonding. This could help distinguish sub-views.

  Logically impossible combinations? For example, someone who accepts only living composites but also thinks the moon and hand compose something. Organicism rejects non-living composites, so that’s inconsistent. The scoring should flag that as incoherent or unexplored.

