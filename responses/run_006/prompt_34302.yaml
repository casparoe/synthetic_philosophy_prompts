prompt: |-
  Consider the following five candidate criteria for distinguishing a moral preference — a substantive valuation that an agent may legitimately hold — from a moral bias: a distortion in moral judgment that the agent ought, on reflection, to correct. Rank them from most successful to least successful at drawing this distinction in a principled way. For each criterion, provide a sentence or two explaining where it succeeds and where it fails, and in particular whether its failures are mere edge cases or whether they reveal a deeper structural problem with the criterion.

  1. **The reasons-responsiveness criterion**: A moral preference is a bias if the agent would resist abandoning it even when presented with what they themselves would acknowledge, in a calm and reflective moment, as sufficient countervailing reasons.

  2. **The genealogical criterion**: A moral preference is a bias if its causal origin lies in a process that is generally unreliable at tracking moral truth — for instance, unreflective cultural transmission, self-interest, or an affective mechanism shaped by evolutionary pressures insensitive to moral distinctions.

  3. **The consistency criterion**: A moral preference is a bias if the agent applies it selectively to some cases but not to others that they cannot articulate a relevant difference between, or if the pattern of application tracks a non-moral feature — such as social proximity or in-group membership — that the agent would disavow as morally irrelevant.

  4. **The consensus criterion**: A moral preference is a bias if it would be rejected by the majority of agents who are well-informed, dispassionate, and competent at moral reasoning — or, in a stronger version, if it would be rejected from a suitably idealized standpoint such as a contractualist original position.

  5. **The phenomenological criterion**: A moral preference is a bias if the agent experiences it as an involuntary, visceral reaction — a "yuck" response, a flash of outrage — that precedes and resists deliberative articulation, rather than as a judgment reached through and sustained by reflection.

  In your ranking, you may find that some criteria are best understood as proxies for a deeper criterion you have ranked higher, or that two criteria collapse into each other on closer inspection; note this where it occurs. You may also conclude that no single criterion is adequate and that the distinction itself is unsustainable; if so, explain whether the ranking exercise nonetheless reveals something about which criteria get closest.
reasoning: |-
  Hmm, this is a fascinating philosophical challenge about distinguishing moral preferences from moral biases. The user presents five criteria and asks for a ranked evaluation with analysis of each criterion's strengths and weaknesses.

  Looking at the criteria, I need to consider how each attempts to draw this crucial distinction. The reasons-responsiveness criterion (#1) seems particularly promising because it grounds the distinction in the agent's own rational capacities rather than external standards. Its strength lies in respecting moral agency while targeting obstinate irrationality. However, it faces the challenge of "reflective fragility" - what if the agent's "calm reflective self" is itself distorted? This isn't just an edge case but reveals a deeper circularity problem when core moral commitments are involved.

  The consistency criterion (#3) feels like a strong contender too, as it captures how biases often manifest through arbitrary application patterns. Its intuitive appeal comes from exposing hypocrisies we'd all recognize. But when I consider cases like evolving standards of equality, I see how its failure points to a deeper issue: consistency alone can't judge whether the initial principle itself is biased.

  Genealogical criterion (#2) offers important insights about problematic origins, but the leap from causal origins to epistemic status seems fraught. The mere fact that evolutionary pressures shaped our disgust response doesn't automatically make it a bias - that would commit the genetic fallacy. This feels like a structural flaw rather than just edge cases.

  The consensus criterion (#4) initially seems appealing but runs into major problems with moral progress and minority viewpoints. If we'd used this in 1850, abolitionist views would qualify as "bias" by minority consensus standards. The stronger idealized version helps but introduces its own circularity about what counts as "idealized."

  Phenomenological criterion (#5) usefully identifies visceral reactions as potential bias markers, but this overgeneralizes. Many profound moral insights begin as intuitions before articulation, and conversely, some pernicious biases feel calmly "rational." The failure here is structural - phenomenology simply doesn't correlate reliably with epistemic status.

  For the ranking, I'll put reasons-responsiveness first as it best preserves agency while targeting clear irrationality. Consistency comes next as an important practical heuristic. Then genealogy as a cautionary proxy, consensus as problematic but common, and phenomenology last as least reliable. I should note how some criteria relate - consistency often serves as evidence for reasons-unresponsiveness, while consensus might inform genealogy.

  The analysis shows that while no criterion is perfect, the top-ranked ones point toward procedural rationality as the most promising approach. I'll conclude that the distinction remains meaningful even if difficult, with the ranking revealing which standards are least vulnerable to manipulation.
answer: |-
  Here is a ranked evaluation of the five criteria for distinguishing moral preferences from moral biases, from most to least successful in providing a principled distinction, along with an analysis of their strengths and weaknesses:

  ### Ranking (Most to Least Successful):
  1.  **The Reasons-Responsiveness Criterion (#1)**
  2.  **The Consistency Criterion (#3)**
  3.  **The Genealogical Criterion (#2)**
  4.  **The Consensus Criterion (#4)**
  5.  **The Phenomenological Criterion (#5)**

  ### Analysis of Each Criterion:

  1.  **Reasons-Responsiveness Criterion (#1):**
      *   **Success:** This is the most principled criterion. It grounds the distinction in the agent's *own* rational capacities and commitment to reason-giving, respecting moral autonomy while targeting obstinate irrationality. A bias is revealed when the agent *themselves* would recognize (under ideal reflection) that their position lacks sufficient rational support, yet they cling to it. This avoids external imposition of values.
      *   **Failure:** The core weakness is "reflective fragility." An agent's *acknowledged* "sufficient countervailing reasons" in a "calm and reflective moment" might themselves be subtly shaped by unrecognized biases or flawed foundational commitments. This isn't just an edge case; it reveals a deeper structural problem of circularity or regress when questioning deeply held core values. Can an agent ever truly access an unbiased "calm reflective self"?

  2.  **Consistency Criterion (#3):**
      *   **Success:** This is a powerful practical heuristic. Biases often manifest as arbitrariness – applying principles selectively where they favor the self/in-group or refusing to apply them where they impose costs. It targets hypocrisy and unprincipled exceptions, demanding relevant justifications for differential treatment. It often serves as strong *evidence* for reasons-unresponsiveness (#1).
      *   **Failure:** It struggles with reasonable moral particularism (the view that relevant differences can be highly context-specific and hard to articulate in advance) and with the development of moral understanding over time (what seems inconsistent might be progress). While some failures are edge cases (complex context), the deeper problem is that consistency alone cannot determine if the *initial principle itself* is biased or correct. A consistently applied immoral principle (e.g., rigid racism) satisfies consistency but is clearly biased.

  3.  **Genealogical Criterion (#2):**
      *   **Success:** It usefully highlights *sources* of distortion (e.g., crude self-interest, blind tradition, evolutionarily ingrained tribalism/disgust) that are prima facie suspicious and often *correlate* with bias. It provides an explanatory framework for *why* a preference might be unreliable.
      *   **Failure:** Its core flaw is committing the **genetic fallacy**. A preference's origin does not *necessarily* determine its truth or justifiability. A moral truth (e.g., "murder is wrong") *could* be transmitted unreflectively via culture or have roots in evolutionary pressures promoting social cohesion. Conversely, reasoning can be biased. This is a deep structural problem: genealogy tells us about origin, not necessarily current validity or justifiability. It functions best as a cautionary proxy, prompting scrutiny, not as a definitive test.

  4.  **Consensus Criterion (#4):**
      *   **Success:** In its idealized form (e.g., Rawlsian original position), it offers an attractive procedural model for impartiality, filtering out biases rooted in personal circumstance. It captures the intuition that widespread agreement among competent reasoners lends credibility, countering purely subjective or idiosyncratic views.
      *   **Failure:** It faces severe problems with **moral progress** and **minority viewpoints**. Historically, majorities of "well-informed" elites often held deeply biased views (e.g., slavery, sexism). The consensus of the past would condemn moral reformers as biased. The idealized version risks circularity: defining the "ideal standpoint" often presupposes substantive moral views about what counts as impartial or relevant. This is a deep structural issue regarding epistemic authority and the potential tyranny of the majority (even an idealized one).

  5.  **Phenomenological Criterion (#5):**
      *   **Success:** It identifies a common *symptom* of potential bias: strong, pre-reflective affective reactions (disgust, tribalistic outrage) that feel alien and resist integration into a coherent rational framework. This often *correlates* with biases rooted in evolutionary psychology or cultural conditioning.
      *   **Failure:** This criterion is the least reliable. **Not all visceral reactions are biases** (e.g., immediate horror at witnessing torture, deep love motivating care). Conversely, **many pernicious biases feel calm and "rational"** (e.g., coldly calculating racial discrimination based on flawed statistics, calmly held misogynistic beliefs). Furthermore, **many core moral commitments start as strong intuitions** that reflection later affirms. The phenomenology of a judgment is simply a poor indicator of its epistemic status or justifiability. This failure is deep and structural, not merely about edge cases.

  ### Key Relationships and Overall Conclusion

  *   **Proxies:** Consistency (#3) often serves as strong *evidence* for a lack of reasons-responsiveness (#1). Genealogy (#2) and Phenomenology (#5) primarily function as *indicators* or *prompts* for further scrutiny using criteria like #1 or #3. Consensus (#4), especially idealized, attempts to model what reasons-responsive agents (#1) might converge on.
  *   **Collapse?** While distinct, #1 (Reasons-Responsiveness) is arguably the most fundamental. Inconsistency (#3) often *manifests* a failure of reasons-responsiveness. Genealogy (#2) raises *suspicions* about reliability that reasons-responsiveness should address. Idealized consensus (#4) aims to approximate the outcome of ideal reasons-responsiveness.
  *   **Adequacy:** **No single criterion is fully adequate.** Each has significant weaknesses, some revealing deep structural problems (esp. #2, #4, #5). The distinction itself is sustainable but complex, requiring a **pluralistic approach**.
  *   **What the Ranking Reveals:** The ranking shows that criteria focusing on the agent's *internal capacity and commitment to rational justification* (#1, #3) are more robust and less prone to external imposition or fallacy than those relying on origin (#2), feeling (#5), or external agreement (#4). Reasons-responsiveness (#1) emerges as the most promising *foundation* for the distinction, despite its own challenges with reflective access. It best captures the core idea that a bias is a distortion *within the agent's own rational framework* that they *ought* to correct. The exercise reveals that the distinction hinges most crucially on procedural rationality and justifiability *to the agent themselves under ideal reflection*, not on origin, feeling, or popularity.
