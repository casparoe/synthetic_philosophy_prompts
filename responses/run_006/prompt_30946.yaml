  This requires careful phrasing throughout - no strawmen, just accurate representations that each side would recognize as their actual position. The joint statement format should show mutual understanding while preserving honest disagreement.
answer: |-
  ## Joint Statement: Hartian & Devlinian Perspectives on Law, Morality, and Society

  Following a sustained and good-faith adversarial collaboration revisiting the Hart-Devlin debate, we, representing the Hartian liberal and Devlinian legal moralist perspectives respectively, present this joint statement. We affirm significant areas of agreement, clarify persistent disagreements, identify key unresolved questions ("cruxes"), and note points where clarification of terms diminishes apparent conflict. Our goal is to advance understanding, not erase principled differences.

  **1. Agreed Claims:**
  Both parties affirm the following non-vacuous propositions:

  1.  **Foundation of Legal Order:** A stable legal order requires a background of widely shared, fundamental moral norms concerning justice, fairness, truth-telling, and the value of human life and bodily integrity. These norms underpin the possibility of law itself, fostering the trust and cooperation necessary for a legal system to function effectively and command general allegiance. Neither side disputes that law arises within, and depends upon, a social-moral context.
  2.  **Necessary Limits on Criminalization:** The criminal law is a uniquely blunt, intrusive, and costly instrument of social control. Its use must be subject to stringent limiting principles to prevent tyranny, oppression of minorities, and the erosion of liberty. Criminalization should always require a strong, articulated justification beyond mere legislative power or popular sentiment.
  3.  **The Meaning of Decriminalizing Consensual Homosexual Conduct (e.g., Wolfenden Proposals):** This specific policy change involved *only* the removal of criminal penalties for *private, consensual* sexual acts between adults. It did not entail state endorsement, promotion, or requirement to approve of such conduct. It expressly maintained criminal sanctions for public indecency, solicitation, acts involving minors, non-consensual acts, or acts procured by force or fraud. The question was solely whether private, consensual conduct between adults should be a matter for the criminal law.
  4.  **The Insufficiency of Bare Majority Disapproval:** The mere fact that a majority of citizens morally disapproves of certain conduct is *not*, in itself, a sufficient justification for criminalizing that conduct. Disapproval, even widespread and intense, must be subject to critical evaluation. Law based solely on transient majority sentiment risks becoming arbitrary and oppressive. A further, substantive justification – such as preventing harm to others (Hartian) or preventing the disintegration of society's constitutive moral fabric (Devlinian) – is required.

  **2. Residual Disagreements:**

  | Question at Issue                                                                 | Hartian Position (as accepted by Hartian)                                                                                                 | Devlinian Position (as accepted by Devlinian)                                                                                                                               |
  | :-------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **May the criminal law legitimately enforce a society's shared morality *as such* (i.e., simply because it is the shared morality)?** | No. The criminal law's sole legitimate purpose is to prevent harm (understood as set-back to interests) to identifiable individuals or sometimes to essential public institutions. Enforcing morality for its own sake is an illegitimate infringement on individual liberty and autonomy. | Yes. Because a society's shared morality is partly constitutive of that society's existence, the law is entitled and indeed obligated to protect this constitutive moral structure from erosion, even in the absence of direct harm to specific individuals. |
  | **What constitutes a sufficient threat to "society's existence" justifying legal enforcement?** | Only conduct that demonstrably and imminently threatens the breakdown of public order, the collapse of essential institutions, or widespread violence – essentially, threats to peace, security, and the basic functioning of the state. Moral change, even profound, does not equate to societal disintegration. | Conduct that threatens to undermine the fundamental, shared moral principles that bind society together and give it its distinctive character, thereby eroding the social cohesion and mutual commitment necessary for its continued existence as *this particular society*. This threat need not be immediate or violent but must be to the constitutive moral fabric. |

  **3. Cruxes: Key Unresolved Questions**

  The following sub-questions represent critical points where resolution could significantly alter one or both positions:

  1.  **Empirical Link: Disintegration vs. Change:** Does historical or comparative evidence demonstrate that relaxing the legal enforcement of a specific, previously strongly held shared moral rule (e.g., blasphemy laws, sodomy laws, adultery laws, Sunday trading restrictions) consistently leads to the *disintegration of the society* (in the Devlinian constitutive sense), or does it primarily lead to *moral and social change* where society persists, albeit with altered norms? (Resolution could challenge the Devlinian claim of necessary disintegration or the Hartian claim that change is always benign/non-disintegrative).
  2.  **Identifying "Shared Morality":** Can the criminal law reliably identify a society's *genuinely shared constitutive morality* without inevitably collapsing into the enforcement of transient majority prejudice, shifting fashions, or the moral views of dominant groups? What objective criteria or process could achieve this? (Resolution is crucial for Devlinians to address the Hartian "tyranny of the majority" concern and for Hartians to assess the feasibility of the Devlinian project).
  3.  **The Logical Leap:** Does it logically follow, from the premise that *some* shared morality is a necessary condition for a society's existence, that the criminal law is therefore *entitled to enforce whatever specific morality is in fact widely shared* at a given time? (Resolution challenges the core Devlinian inference and the Hartian denial of its validity).
  4.  **Reliability of Disgust/Intolerance:** Is the "intolerance, indignation, and disgust" felt by the ordinary person towards certain conduct (Devlin's "man on the Clapham omnibus") a reliable indicator that such conduct genuinely threatens the *constitutive moral fabric* of society, or is it often an indicator of prejudice, unfamiliarity, or mere moral conventionalism? (Resolution bears directly on Devlin's proposed test for identifying threats to the shared morality).

  **4. Cruxes: Evidence and Predictions**

  | Crux                                                                 | Accepted Bearing Evidence/Cases                                                                                           | Hartian Prediction                                                                                                 | Devlinian Prediction                                                                                               |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- |
  | **(a) Disintegration vs. Change**                                    | Detailed historical case studies (e.g., decriminalization of homosexuality in various jurisdictions, abolition of blasphemy laws, changes in divorce law, legalization of contraception); sociological studies tracking social cohesion metrics pre/post significant moral-legal shifts. | Evidence will show societies persist and adapt; initial turmoil gives way to new stable equilibria without *disintegration*; harm from criminalization outweighs any destabilization. | Evidence will show periods of significant moral confusion, weakening of traditional institutions (family, community), and erosion of social trust following such changes, indicating disintegration. |
  | **(b) Identifying Shared Morality**                                  | Analysis of mechanisms like deliberative polls, constitutional preambles, long-standing common law principles, anthropological studies of core societal values; failures of experiments in legislating morality based on opinion polls or referenda. | No reliable, non-arbitrary method exists beyond identifying the harm principle's requirements; attempts inevitably reflect power dynamics or prejudice. | Core constitutive morality can be discerned through deep-rooted traditions, fundamental legal principles, and the considered judgment of the community over time; processes like common law evolution demonstrate this. |
  | **(c) The Logical Leap**                                             | Philosophical analysis of the concepts "necessary condition," "constitutive," and "entitlement"; examination of analogous arguments in political philosophy (e.g., state enforcement of patriotism as necessary for existence). | The inference is a non sequitur; necessity of *some* morality doesn't justify enforcing *this specific* one; the leap confuses necessary background conditions with justifiable targets of coercion. | The protection of the specific constitutive morality *is* the protection of the society itself; the entitlement derives from the society's right of self-preservation against internal dissolution. |
  | **(d) Reliability of Disgust/Intolerance**                           | Psychological studies on the origins of disgust and moral indignation; historical examples where widespread disgust targeted harmless conduct (e.g., interracial marriage historically); analysis of whether disgust tracks demonstrable social harm or threats to constitutive bonds. | Disgust is evolutionarily primed for pathogen avoidance and social conformity, not reliable for identifying genuine threats to societal structure; it often targets the unfamiliar or marginalized. | While imperfect, the profound and widespread moral outrage of the ordinary person is a crucial signal pointing to perceived threats to the foundational bonds and shared understandings that hold society together. |

  **5. Closing Note: Clarifying Ambiguities**

  Upon close examination, we identify significant *verbal* ambiguity contributing to the debate:

  *   **"Society":** The Hartian typically uses "society" to denote a population organized under a stable political/legal order capable of maintaining peace and security. The Devlinian uses "society" to denote a community bound by shared fundamental beliefs, traditions, and values, which gives it its distinctive identity and cohesion. Disagreements often stem from whether "society's existence" refers to its *continued functioning as a political entity* or its *persistence as a specific moral community*.
  *   **"Enforcing Morality":** The Hartian interprets this narrowly as *using criminal law to punish conduct solely because it violates a moral norm, irrespective of harm*. The Devlinian interprets it broadly as *using law (including criminal law) to protect the foundational moral structure* which is seen as essential to society's existence, where the *purpose* is societal preservation, not moral vindication *per se*.

  **What Remains:** Once these ambiguities are clarified, the core *substantive* disagreement is starkly revealed: **Does the imperative to preserve a society *as a specific moral community* justify the use of the criminal law to prohibit private, consensual conduct that violates that community's constitutive moral norms, even when such conduct causes no direct, tangible harm to other individuals?** The Hartian answers "no," prioritizing individual liberty and warning of tyranny. The Devlinian answers "yes," prioritizing social cohesion and warning of dissolution. This fundamental difference in the perceived role and justification of the criminal law persists, grounded in divergent views of the relationship between the individual, morality, and the nature of society itself.

  Signed in recognition of clarified agreement and disagreement,

  [Signature Line for Hartian Representative]
  [Signature Line for Devlinian Representative]
