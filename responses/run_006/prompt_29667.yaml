answer: |-
  Below is a practical checklist designed to catch common probability incoherencies in your prediction market. It balances mechanical checks (✅) with unavoidable judgment calls (❓). Aim to complete it in under 10 minutes before posting new odds.

  ---

  ### **Prediction Market Probability Checklist**
  1. **✅ MECE Sum Check (Mutually Exclusive, Collectively Exhaustive)**  
     - If events cover all possible outcomes (e.g., "A or B must happen"), sum probabilities must = 100%.  
     - *Exception*: If events aren’t exhaustive (e.g., "tie" possible), skip or adjust.

  2. **✅ Subset/Implication Check**  
     - If Event X implies Event Y (e.g., "C ⊆ A"):  
       - P(X) must ≤ P(Y).  
       - If X and Y overlap but aren’t subsets, ensure P(X ∩ Y) ≤ min(P(X), P(Y)).

  3. **❓ Conditional Consistency**  
     - For related events (e.g., C given A), verify:  
       - Implied conditional probability `P(C|A) = P(C)/P(A)` is sensible (between 0-100%).  
       - *Judgment*: Does this align with your intuition? (e.g., "If A happens, is P(C|A) realistic?")

  4. **✅ Disjoint Event Check**  
     - If events X and Y can’t happen together (e.g., A and B), P(X or Y) = P(X) + P(Y) must ≤ 100%.

  5. **❓ Complementary Probabilities**  
     - Check if "sub-events" within a broader event sum correctly (e.g., "A" split into "C" and "A not C").

  6. **✅ Basic Boundaries**  
     - All probabilities 0% ≤ P ≤ 100%.  
     - No negative odds or implied probabilities >100%.

  ---

  ### **Applying the Checklist to Your Student Council Example**
  **Your estimates**:  
  - A: Incumbent wins = 50%  
  - B: Challenger wins = 40%  
  - C: Incumbent wins *with <55% vote* = 25%  

  **Step-by-Step Verification**:
  1. **✅ MECE Sum Check**  
     - A and B are mutually exclusive and exhaustive (only two candidates).  
     - Sum = 50% + 40% = **90% ≠ 100%**.  
     - **🚨 Critical Failure**: Probabilities don’t cover all outcomes. Likely missing "tie" or "third candidate."

  2. **✅ Subset Check**  
     - C ⊆ A (if the incumbent wins with <55%, they still win).  
     - P(C) = 25% ≤ P(A) = 50% → **Passes**.

  3. **❓ Conditional Consistency**  
     - Implied `P(C|A) = P(C)/P(A) = 25%/50% = 50%`.  
     - *Judgment*: Does this make sense?  
       - "If the incumbent wins, is there a 50% chance they get <55% of the vote?"  
       - If your gut says "no" (e.g., you expect a stronger win), this needs adjustment.

  4. **✅ Disjoint Event Check**  
     - A and B are disjoint → P(A or B) = 50% + 40% = 90% ≤ 100% → **Passes** (but MECE check already flagged the sum).

  5. **❓ Complementary Probabilities**  
     - A can be split into C and "A not C" (incumbent wins with ≥55% vote).  
     - P(A not C) = P(A) - P(C) = 50% - 25% = 25%.  
     - *Judgment*: Does "incumbent wins ≥55%" at 25% feel plausible? If not, revisit P(C) or P(A).

  6. **✅ Basic Boundaries**  
     - All probabilities between 0–100% → **Passes**.

  ---

  ### **What the Procedure Catches vs. Misses**
  - **Catches**:  
    - **Major incoherence**: A + B = 90% < 100% (violates MECE).  
    - Subset and boundary issues are covered.  
  - **Misses/Requires Judgment**:  
    - Conditional plausibility (e.g., P(C|A) = 50% may conflict with your intuition).  
    - Implied complementary probabilities (e.g., "A not C" = 25%).  
    - Whether the missing 10% is a true oversight (e.g., tie) or an error in estimating A/B.  
  - **Doesn’t Catch**:  
    - Biases in absolute probabilities (e.g., P(A) = 50% may be too high).  
    - External consistency (e.g., odds vs. historical data).

  ---

  ### **Recommended Fixes & Adjustments**
  1. **Fix the MECE failure**:  
     - **Option 1 (Add missing event)**: Introduce "Tie" at 10%. Adjust A and B down proportionally:  
       - A: 50% → 45% (50%/90% × 90% → 45% is not proportional; better: scale A and B by 100%/90% = 10/9)  
       - B: 40% → 44.4%  
       - Tie: 10%  
       - C (subset of A): Keep 25%? But then P(C|A) = 25%/45% ≈ 55.6% — check if this feels right.  
     - **Option 2 (Rebalance A/B)**: Remove the gap by scaling A and B to 100%:  
       - A: 50% → 55.6% (50 ÷ 90 ≈ 55.6%)  
       - B: 40% → 44.4% (40 ÷ 90 ≈ 44.4%)  
       - C: Keep 25%? Then P(C|A) = 25%/55.6% ≈ 45% — more plausible if you expect a close race.  

  2. **Resolve conditional judgment call**:  
     - If your gut says P(C|A) should be 30%, not 50%, then set P(C) = 30% × P(A).  
     - Example: If P(A) = 55.6%, then P(C) = 30% × 55.6% ≈ 16.7%.  

  ---

  ### **Should You Change How You Set Odds?**
  **Yes, in two ways**:  
  1. **Always start with MECE events**: Define exhaustive outcomes first (e.g., "A/B/Tie"), force their sum to 100%, *then* add sub-events like C.  
  2. **Use conditional scaffolding**: Estimate key conditionals (e.g., P(C|A)) before absolutes. This reduces incoherence.  

  **Why this matters**: The MECE error alone guarantees a guaranteed loss ("Dutch book") if someone bets on all outcomes. Conditional mismatches (e.g., P(C|A)) create subtler arbitrage. Fixing these makes your market resilient and credible.  

  **Time-saving tip**: Use a spreadsheet to auto-calculate checks:  
  - Column A: Events  
  - Column B: Probabilities  
  - Formulas: `SUM(B2:B4)=100%`, `P(C) ≤ P(A)`, `P(C|A)=P(C)/P(A)`.  

  Example fix for your case:  
  | Event | Probability |  
  |-------|-------------|  
  | A (Incumbent wins) | 55.6% |  
  | B (Challenger wins) | 44.4% |  
  | C (A with <55% vote) | 22.2% | *← Set to 40% of P(A) if P(C|A)=40% feels right*  

  Run the checklist again post-adjustment to verify coherence!
