  *But*: Terms aren't fully independent. Adjusted for overlap (e.g., if self-regulation *is* reasons-responsiveness), I land at **0.45**.  

  ---

  ### Sensitivity & Evidence:  
  **Most Sensitive Term: (b) Causal Fixation (0.40)**  
  -   **Why?** If self-revision is causally closed (no "true" top-down control), anti-Sphex flexibility collapses into deterministic complexity.  
