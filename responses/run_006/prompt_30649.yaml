  We are given three camps in the debate about the common prior assumption (CPA). The goal is to diagnose the disagreement and then provide a structured summary.

  ## Diagnosis in Prose

  The core issue is that the term "prior" is being used in three distinct senses across the camps, and the question "Is the common prior assumption true?" is ambiguous without specifying which sense is intended. 

  1. **First Camp (Coherence Condition on Rational Belief):** 
     - They use "prior" in a *normative* sense: it is a constraint on what counts as rational. They argue that rational agents must share the same prior conditional on the same background information. Any disagreement must then be due to private information or an error. The common prior is not just a mathematical convenience but a requirement of rationality.

  2. **Second Camp (Subjectivity of Priors):** 
     - They use "prior" in a *subjective psychological* sense: it is the actual starting belief of an agent. They argue that there is no objective fact about which prior is correct, so two rational agents can have different priors and update on the same evidence and still disagree. The common prior assumption is a controversial and unnecessary constraint.

  3. **Third Camp (Modelling Convention in Game Theory):** 
     - They use "prior" as a *modelling device*. In incomplete-information games, the common prior is a way to represent differences in information. It is a technical assumption that allows for a clean representation of the game. It makes no claim about the real psychology of agents or about normative constraints.

  The debate persists because each camp is talking about a different concept while using the same word. The first camp is making a normative claim about rationality, the second is making a descriptive claim about the possibility of rational disagreement, and the third is making a methodological claim about modelling. 

  However, there might be a residual substantive disagreement between the first and second camps about the nature of rationality and whether priors can be subject to rational criticism. The first camp holds that rationality requires a shared prior (and thus that priors are not beyond criticism), while the second camp denies this. 

  To steelman the residual disagreement: 
  - **Normative Claim (First Camp):** If we are to have a notion of objective rationality that transcends individual perspectives, then there must be a standard by which we can evaluate beliefs. The common prior (as a normative constraint) is part of that standard. Without it, we cannot explain why two rational agents should ever agree or how they can resolve disagreements. They might argue that the requirement of a common prior is implicit in the very idea of rational updating: if two agents update on the same evidence and their priors are not arbitrary but constrained by reason, then they must converge. 
  - **Subjectivist Rebuttal (Second Camp):** Rationality is about internal coherence (consistency with one's own prior and updating on evidence) and not about convergence to an objective prior. There is no unique rational prior: two agents can have different but equally rational priors. The common prior assumption, in this view, is an unjustified imposition of uniformity that ignores the legitimate role of individual judgment in forming priors.

  The disagreement might be substantive at the normative level: Can there be objective constraints on priors? The first camp says yes, the second says no. However, note that the first camp might not be claiming that there is a unique rational prior for every possible state of background information, but rather that for a given state of background information, there is a unique rational prior. The second camp denies even that.

  But note: the common prior in the first camp is conditional on the same background information. So if two agents have the same background information, they should have the same prior. The second camp would say that even with the same background information, two agents can have different priors and still be rational.

  The dispute might be dissolved by noticing that the first camp is using "background information" in a very broad sense that might include the entire epistemic state, while the second camp might be thinking of background information as public information. But if the first camp includes the entire epistemic state, then the prior becomes conditional on everything, and the common prior assumption becomes trivial (because each agent's prior is conditional on their own private information). This is where Aumann's theorem comes in: the theorem requires a common prior over the state space that includes all possible private information. The first camp interprets the theorem as showing that if there is a common prior (in this global state space) then rational agents cannot agree to disagree. They then argue that rationality requires such a common prior. The second camp says that the common prior in this global state space is not required by rationality.

  So the residual disagreement is: must rational agents have a common prior in the global state space? The first camp says yes, the second says no. This is a substantive normative disagreement about the nature of rationality.

  However, the second camp might also argue that even if we want a common prior in the global state space, it is not clear that there is a unique one that is rational. The first camp might counter that without such a common prior, we cannot make sense of objective probabilities or of the possibility of learning from others.

  But note that the third camp avoids this entirely: they are not making a claim about rationality but about modelling. They can use the common prior as a modelling device without taking a stance on the normative question.

  Therefore, the debate between the first and second camps is substantive and hinges on the foundations of Bayesian epistemology: is there an objective constraint on priors? The third camp is orthogonal.

  ## Structured Summary

  We'll create a table with four columns: Camp, What they need prior to mean, Residual disagreement after tabooing the word, and What would count as progress.

  | Camp                                  | What they need prior to mean         | Residual disagreement after tabooing the word                                                               | What would count as progress                                                                 |
