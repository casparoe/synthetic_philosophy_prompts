  | **First Camp (Coherence Condition)**  | Normative constraint: the prior that a rational agent *should* have given the background information. | Whether rationality requires that two agents with the same background information must start with the same credence function. | A theorem showing that without a shared prior (in the global state space), updating can lead to inconsistent beliefs even when all evidence is shared. Or a demonstration that any deviation from a common prior leads to exploitable inefficiencies. |
  | **Second Camp (Subjectivity)**        | Subjective psychological state: the actual initial credences of an agent.                            | Whether two agents who are internally coherent (update correctly) but start with different initial credences (even with the same background information) can both be rational. | A proof that there are multiple coherent priors that are equally rational, or an example of two such priors that lead to persistent disagreement without any mistake. |
  | **Third Camp (Modelling Device)**     | Modelling convention: a technical tool for representing information asymmetries in games.            | None (they don't claim the common prior is true or normative; they use it for convenience).                 | Development of alternative modelling frameworks that do not require a common prior but still yield tractable and insightful results. |

  Overall verdict: **mixed** (partly verbal, partly substantive). The disagreement between the first and second camps is substantive (about the normative constraints on rationality), while the third camp is engaged in a different project. The conflation of the three uses of 'prior' is verbal.

