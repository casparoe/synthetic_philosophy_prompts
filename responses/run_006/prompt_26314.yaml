prompt: |-
  so i'm teaching nozick's experience machine next week and i want to open with a poem instead of just launching into the thought experiment. write a sonnet from the point of view of someone who's been plugged in for years. the octave should describe their life inside — and it should sound genuinely rich and meaningful, not hollow or dystopian. the volta should be the moment the reader catches on that this person is in the machine, maybe from some small thing that doesn't quite track. the closing couplet should capture why they're staying, but in a way that leaves the reader unsettled rather than convinced. i want my students to feel the pull of the machine before we start arguing about whether we'd plug in. bonus if the poem gestures at what nozick thought we'd be missing — contact with reality, actually doing things, being a certain kind of person — without naming any of that directly. american english please.
