prompt: |-
  I am a teaching assistant in a first-year introduction to ethics course, and next week I have one fifty-minute section in which to teach the heterogeneity problem for hedonism about well-being. Do not give me the explanation itself; give me a plan for the explanation. I need the order in which the pieces must be introduced and what depends on what, so that the problem emerges as something hedonism must answer given its own single-currency commitment rather than as a taxonomical aside. Choose a single contrasting pair of pleasures to carry the entire session, say what that pair must have and what it must not have, and explain why the obvious alternatives would fail; I do not want a long list of examples the students will forget. Map the misconceptions the students will predictably arrive with or form partway through—at minimum the thought that pleasure is just a feeling and the thought that pleasure is just whatever you want—and tell me exactly where in the sequence each one should be headed off, before it hardens. Then give me one closing question whose answer would tell me whether they have understood the problem as a demand for a common element across all pleasures, rather than merely being able to repeat the phrase. Finally, tell me what I should leave out at this level and how to flag that it is being left out without making the session feel incomplete.
reasoning: |-
  Okay, the user is a teaching assistant preparing for a 50-minute session on the heterogeneity problem for hedonism. They need a structured plan that builds the problem step by step, using a single contrasting pair of pleasures to avoid overwhelming students. The key is to show how hedonism's "single-currency" commitment creates an internal tension, not just a taxonomy issue. 

  First, I need to choose the right pleasure pair. The user specified it must highlight qualitative difference while sharing the core hedonistic markers—both must be intrinsically desirable and feel subjectively positive. But they can't differ in obvious ways like duration or intensity, as students might latch onto those as "solutions." I'm considering "finishing a complex puzzle" versus "sunbathing on a quiet beach"—both are undeniably pleasures but feel experientially worlds apart. The puzzle is achievement-focused and cognitively engaging, while sunbathing is passive and sensory. This contrast avoids common pitfalls: it's not about base vs. elevated (which might imply hierarchy) or addictive vs. healthy (which introduces moral baggage). 

  Now, the sequence. The trap is students thinking pleasure is either "just a feeling" (like a uniform buzz) or "whatever you want" (reducing it to desire). Both misconceptions must be preempted early. I'll start by defining hedonism's core axiom—well-being is only about pleasure—and immediately clarify that pleasure isn't just sensory. Use the puzzle example: ask if the satisfaction of solving it is pleasurable even without tingles. That counters the "feeling" view upfront. Then, when introducing sunbathing, ask if it’s pleasurable independently of consequences (like skin damage) to reinforce intrinsic desirability. This sets up the contrast without yet revealing the problem. 

  Next, the single-currency commitment. Students might miss why heterogeneity matters unless I stress that hedonism demands all pleasures be commensurable—like dollars, not apples and oranges. Here’s where I introduce the pair explicitly: "Imagine two lives, one full of puzzle-like pleasures, the other sunbathing-like. If they feel equally pleasurable, does hedonism say they’re equally good?" Let them sit with that. The discomfort when they say "no" despite equal intensity is the hook. 

  Predictable misconceptions: After presenting the pair, someone will suggest we measure pleasure by intensity/duration. I need data to head this off. Show two scenarios: intense but stressful puzzle-solving vs. mild but serene sunbathing. Ask if the latter could be better even if "less" pleasurable by volume. This exposes that "how much" isn't the issue—it's the "what kind." Another risk: conflating pleasure with desire. Preempt by noting addicts may want something that isn’t pleasurable (withdrawal relief). 

  Closing question: "If a hedonist admits puzzle and sunbathing pleasures differ radically in character, what must they still claim about them to keep their theory intact?" The right answer: they must share a common, measurable essence. If students instead say "both feel good," probe deeper—that’s the surface, not the currency. 

  What to omit: Don’t dive into Mill’s qualitative distinctions or Nozick’s experience machine. Flag them as "possible hedonist responses we’ll revisit later" to avoid feeling unfinished. The goal here is solely to expose the problem, not solve it. 

  Finally, timing: 5 min setup, 15 min building hedonism, 20 min on the pair/contrast, 5 min misconception cleanup, 5 min for the closing question. Keep it tight.
answer: |-
  Here’s a focused 50-minute lesson plan that builds the heterogeneity problem from hedonism’s core commitments, using a single strategic contrast and preempting key misconceptions:

  ---

  **Core Contrast Pair:**  
  *Choose:* **Solving a complex intellectual puzzle** vs. **Sunbathing on a quiet, warm beach**  
  *Why this pair works:*  
  - **Must have:** Both are uncontroversially pleasurable, intrinsically desirable (valued for themselves), and subjectively positive.  
  - **Must NOT have:** Differences in duration, intensity, moral valence, or obvious consequences (e.g., sunburn isn’t part of the sunbathing pleasure itself). Avoids "base" vs. "elevated" language (no hierarchy).  
  *Why obvious alternatives fail:*  
  - ⚠️ *Addictive drug rush*: Triggers moral confusion, conflates pleasure with craving/relief.  
  - ⚠️ *Sadistic pleasure*: Introduces moral distortion, obscuring the purely experiential focus.  
  - ⚠️ *Eating vs. art appreciation*: Too easily dismissed as different "types" without probing deeper unity.  

  ---

  ### Lesson Sequence (Total: 50 Mins)
  **1. Grounding Hedonism’s Core (10 mins)**  
     - *Define hedonism:* "Well-being is solely determined by pleasure (positive) and pain (negative)."  
     - *Crucial commitment:* Pleasure is the **single currency** of well-being (all pleasures contribute to well-being *in the same way*).  
     - *Preempt misconception #1 (Pleasure is just a feeling):*  
       > "When hedonists say ‘pleasure,’ they don’t mean *only* physical sensations like sweetness or warmth. Is the satisfaction of solving a puzzle a pleasure? If yes, is it the *same kind* of feeling as sunbathing?"  
       *(Plant doubt; highlight diverse experiences all called "pleasure").*  

  **2. Introduce the Contrast (15 mins)**  
     - Describe **Puzzle-Solving**: Mental challenge, achievement, "aha!" moment.  
     - Describe **Sunbathing**: Sensory calm, physical comfort, tranquility.  
     - *Ask:* "If you had to choose a life with *only* puzzle-like pleasures or *only* sunbathing-like pleasures, which feels like a better life? Why?" *(Elicit intuitive divergence; note answers)*.  
     - *Preempt misconception #2 (Pleasure is whatever you want):*  
       > "Hedonism isn’t about getting what you *want*; it’s about the experience of pleasure itself. You might want to solve puzzles for prestige, but the *pleasure* is in the experience. Similarly, sunbathing might cause sunburn, but the *pleasure* is the warmth/calm."  

  **3. Press the Single-Currency Commitment (15 mins)**  
     - *Reframe:* "Hedonism says *both* lives are good *only* insofar as they contain pleasure. Pleasure is a unified 'currency'—the *same thing* added up in both lives."  
     - *Contradiction:* "But if these pleasures feel deeply different, and we intuitively value them differently, what is the *single thing* they share that makes them both count as 'pleasure'?"  
     - *Defuse "obvious" escapes:*  
       - ⚠️ *"Duration/Intensity?"*: "Assume both lives have equal duration and intensity of pleasure. Does that resolve the unease?" *(No—students will still prefer one life)*.  
       - ⚠️ *"They’re just different categories!"*: "But hedonism says *all* pleasures are the same currency. If they’re fundamentally different, how can we add them?"  

  **4. State the Problem & Misconception Check (5 mins)**  
     - *Heterogeneity Problem:* "If pleasure is a single currency, there must be a common property unifying all pleasurable experiences. But our contrast suggests puzzle-solving and sunbathing share no *qualitative* commonality beyond ‘feeling good’—which is vague and circular."  
     - *Reinforce preemption:*  
       - "Is pleasure just a uniform 'tingle'? No—our examples prove it’s not."  
       - "Is it defined by desire? No—we desire things *because* they’re pleasurable, not vice versa."  

  **5. Closing Comprehension Check (5 mins)**  
     - **Critical Question:**  
       > *"If a hedonist replies, 'All pleasures feel subjectively positive, and that’s the common property,' why is this inadequate for solving the heterogeneity problem?"*  
     - *Target Answer:* "Because 'subjectively positive' is just a label for the diverse experiences we call pleasurable—it doesn’t identify a *unified feature* allowing measurement/comparison (e.g., how many units of 'beach pleasure' equal one unit of 'puzzle pleasure'?)."  

  ---

  ### What to Omit & How to Signal  
  - **Omit:**  
    - Historical figures (Bentham/Mill distinctions).  
    - Quantitative solutions (e.g., felicific calculus).  
    - Non-hedonist theories (e.g., desire satisfactionism).  
  - **Signal Completeness Without Digression:**  
     > "Today’s goal was to expose a *structural problem within hedonism*: its single-currency claim vs. the diversity of pleasure. We’re not yet evaluating solutions (e.g., whether we *can* measure all pleasure) or alternatives—that’s for future weeks!"  

  ---

  **Why This Works:**  
  - The **puzzle/beach contrast** is relatable, neutral, and resistant to quick fixes.  
  - Misconceptions are **preempted at the point of entry** (when terms are defined) and **reinforced when they’d naturally arise** (e.g., during the life-choice thought experiment).  
  - The closing question **tests conceptual grasp**, not memorization: if they see that "feeling good" isn’t a common *measurable essence*, they get the problem.
