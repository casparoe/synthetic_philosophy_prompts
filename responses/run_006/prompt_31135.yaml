prompt: |-
  I teach a graduate seminar on collective agency and social ontology, and we have been working through the discursive dilemma—sometimes called the doctrinal paradox—at some length. The standard illustration runs as follows. A three-judge appellate panel must decide a contract dispute that turns on two issues: whether a valid contract was formed, and whether it was breached. The court's doctrine says the plaintiff prevails only if she wins on both. The judges vote:

  - Judge A: valid contract (yes), breach (yes) → plaintiff wins.
  - Judge B: valid contract (yes), breach (no) → plaintiff loses.
  - Judge C: valid contract (no), breach (yes) → plaintiff loses.

  If the panel aggregates votes premise-by-premise, the plaintiff wins on contract 2–1 and on breach 2–1, so she should win the case—yet a majority of the same judges (B and C) would vote to reject her claim if asked for the bottom line directly. The paradox is clean and familiar.

  But real multi-member courts do not, in fact, resolve this by picking one aggregation method and sticking with it. What they do instead—and here I am thinking especially of the U.S. Supreme Court but also of intermediate appellate courts—is let each judge vote on the disposition and then write separately on the reasoning, with the result that we routinely get plurality opinions: a majority converges on the outcome but no single rationale commands majority support. Lower courts are then left to extract binding precedent under something like the Marks rule, which treats the narrowest opinion concurring in the judgment as controlling. That rule has no deep philosophical justification that I have ever seen; it is a practical fix, and a contested one at that.

  I want my students to see that these are not merely procedural accidents. They reflect substantive—and contestable—philosophical commitments about what a collective judgment even is. So here is the question I would like a committed answer to, one that takes a definite position and defends it rather than surveying possibilities. What theory of group judgment does the actual practice of outcome-first voting with separate rationale-voting presuppose? Does it presuppose, for instance, that a collective agent exists only at the level of the verdict and not at the level of the reasons that support it, or that consistency is required of individual judges but not of the court as a body? Is that presupposition defensible? And if we instead insisted that a collective judgment must be consistent all the way down—premises and conclusions alike—what would have to change structurally in how multi-member courts operate? I am less interested in what the case law says than in what the practice implicitly commits us to, philosophically, and whether we should own up to it or revise the practice. Please write in American English.
reasoning: |-
  Okay, this is a deep and fascinating question about collective agency in judicial contexts. The professor is clearly well-versed in social ontology and wants to push beyond the standard discursive dilemma example to examine real-world court practices. 

  First, let's unpack what they're really asking. They note that actual courts resolve the doctrinal paradox by voting on outcomes first, then allowing separate rationales. This leads to plurality opinions where the judgment is collective but the reasoning isn't. The professor wants to know: what philosophical view of group judgment does this practice assume? And is this defensible?

  Hmm... the key here is recognizing that this practice treats the court's collective agency as fundamentally outcome-focused. The judges aren't required to agree on why they decide; only on what they decide. That suggests a particular view where group agency exists only at the level of verdicts, not reasoning. 

  I recall Philip Pettit's work on discursive dilemmas - he'd probably argue this practice violates the rationality requirement for group agency. If the court as a whole can hold inconsistent premises (like in the contract/breach example), is it really a rational agent? The professor seems to be hinting at this tension.

  The Marks rule point is also crucial. When courts extract binding precedent from fractured decisions, they're essentially constructing artificial consistency after the fact. That's philosophically messy - it pretends there's collective reasoning when there isn't. 

  For the alternative approach... if courts demanded premise-by-premise consistency, they'd need fundamentally different procedures. Maybe deliberation until consensus on reasons, or formal rules requiring majority-supported rationales. But that might make decisions impossible in polarized courts. 

  The defensibility question is tricky. There's a pragmatic argument: outcome-focused voting prevents deadlock. But there's a integrity argument too - should courts present fractured reasoning as "the law"? Maybe plurality opinions honestly reflect disagreement rather than forcing artificial unity.

  I think the strongest point is that current practice assumes collective judgment requires only convergence on outcomes, not reasons. Whether we should accept that depends on whether we see courts as truth-seeking bodies (which need consistent reasons) or conflict-resolving bodies (where outcomes matter most).
answer: |-
  Your question cuts to the heart of how courts function as collective epistemic agents. The actual practice of voting on the *outcome first* while permitting fractured rationales presupposes a specific—and controversial—theory of collective judgment: **the court is a collective agent only at the level of the verdict, not at the level of the reasons justifying it**. This practice implicitly endorses a **minimalist, outcome-based model of group agency** that prioritizes decisional closure over reasoned coherence. Let me defend this position and its implications.

  ### 1. **The Philosophical Commitments of Current Practice**  
     - **Agency Without Rational Unity**: The court acts as a unified agent *only* when rendering a disposition ("plaintiff wins/loses"). Its collective identity dissolves when articulating reasons. Judges are treated as individual epistemic agents contributing to a binary outcome, not co-authors of a shared justification.  
     - **Consistency as an Individual Duty, Not a Collective One**: Each judge must maintain logical consistency in *their own* opinion (e.g., no judge asserts "no contract" but "plaintiff wins"). But the court *as a body* need not reconcile conflicting premises across opinions. The Marks rule papers over this disunity post hoc, treating rational fragmentation as a technical problem rather than a failure of collective rationality.  
     - **Precedential Authority as Artificial Synthesis**: When lower courts apply Marks, they construct a "controlling" rationale from fractured opinions. This presupposes that the *group’s judgment* is reducible to a single logical thread—even if no majority endorsed it. The practice implicitly denies that a collective judgment requires *actual* shared reasons, relying instead on interpretive reconstruction.  

  ### 2. **Is This Presupposition Defensible?**  
     **Yes, pragmatically; no, philosophically.**  
     - **The Pragmatic Defense**: Courts prioritize resolving disputes efficiently. Requiring consensus on reasons could paralyze multi-member courts, especially in ideologically divided bodies like the Supreme Court. Outcome-first voting ensures societal closure while permitting judicial candor: judges honestly express divergent views without blocking dispositions. The Marks rule then approximates coherence *enough* for lower courts to apply precedent.  
     - **The Philosophical Problem**: This undermines the court’s claim to *reasoned collective judgment*. If the doctrinal paradox reveals a contradiction between premises and outcomes, current practice embraces that contradiction at the group level. A court that asserts "P wins" while housing majority-endorsed premises implying "P loses" (as in your contract example) is collectively irrational. It violates the core norm of agency: **a group cannot coherently affirm both A and not-A**. By outsourcing consistency to individual judges, the court abdicates its duty *as a collective* to justify its authority through public reason.  

  ### 3. **What Would Change if We Demanded Full Collective Consistency?**  
     To insist that courts render judgments with logically consistent premises *and* conclusions endorsed by the majority, we’d need structural reforms:  
     - **Deliberative Forcing Mechanisms**: Courts would need to deliberate until they converge on a single opinion with majority-supported premises. If consensus fails, the court might issue a "no decision" default (e.g., affirming the lower court without precedent), incentivizing compromise.  
     - **Formal Premise-by-Premise Voting**: For key legal questions, judges would vote on premises *before* the outcome. The majority’s premises would then dictate the conclusion, avoiding the discursive dilemma. Dissents could challenge premises but couldn’t fracture the majority’s rationale.  
     - **Abolishing Marks-Style Reconstruction**: Precedent would derive *only* from majority-endorsed rationales. Plurality opinions would have no precedential weight, eliminating the fiction of a "controlling" rationale nobody fully endorsed.  

  ### 4. **Should We Own This or Revise the Practice?**  
     - **Own It (Warts and All)**: If we accept courts as dispute-resolution machines—not truth-seeking deliberative bodies—the status quo is defensible. It acknowledges that judges are political agents constrained by institutional limits. The Marks rule, while messy, reflects a realist view of law: precedent emerges from competing interpretations, not syllogisms.  
     - **Revise It (For Integrity’s Sake)**: If courts claim to administer *justice through reason*, they must embody rational agency fully. Sticking to outcome-based aggregation while tolerating contradictory premises is intellectual bad faith. We should reform procedures to require coherent group judgments, even if it means fewer decisions or more negotiated compromises. The alternative is a collective agent that speaks with one voice (the disposition) while thinking with many fractured minds—a simulacrum of rationality.  

  ### Conclusion  
  Current practice presupposes a **thin, verdict-centric theory of group agency**: the court is a collective *only when acting*, not *when reasoning*. This prioritizes efficiency and decisional finality over rational coherence—a choice that reflects law’s political nature but betrays its aspiration to principled authority. Defending it requires conceding that courts are not robust epistemic communities but coalitions of convenience. If we demand deeper consistency, we must redesign courts to function as genuine collective reasoners. The choice isn’t procedural; it’s about whether law rests on power or reason. Your students must confront that antinomy head-on.
