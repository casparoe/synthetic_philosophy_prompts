prompt: |-
  I've been teaching a philosophy of language seminar, and last week we spent three hours going in circles about Lewis's triviality results. For background: Lewis showed that if the probability of an indicative conditional equals the corresponding conditional probability — the Equation — then under very weak assumptions (roughly, that probabilities update by conditionalisation and that the class of propositions forms a Boolean algebra) the probability function can take at most four distinct values, which is absurd for any realistic belief state. The standard moral is that indicative conditionals do not express propositions with truth conditions; they are devices for expressing conditional beliefs. But there are escape routes: deny the Equation, deny that conditionals embed under the probability operator in the way Lewis assumes, or restrict the applicability of conditionalisation.

  One of my students asked me what I actually believe, and I realised I have never forced myself to put a number on it. So I would like you to give me your credence that indicative conditionals express propositions with classical truth conditions — that is, that for any indicative conditional 'If A then C', there is a proposition (a set of possible worlds) that it expresses, and its truth value at a world is determined by whether that world belongs to the set. I want a decomposition of your credence: the key sub-questions your answer depends on, a rough probability for each, and how they combine. I am especially interested in which sub-question your final number is most sensitive to — where you would most expect new evidence or arguments to move you.

  Please give your answer as exactly five numbered items, each a sentence or two, with no introduction or conclusion. The first item should state your overall credence. The next three should each identify a key sub-question, give your probability for it, and briefly justify that probability. The fifth item should explain how the sub-questions combine to yield your overall credence and identify which sub-question your view is most sensitive to. Use British English spelling and punctuation throughout.
