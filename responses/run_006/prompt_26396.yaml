  3. **Key sub-question: Do indicative conditionals embed felicitously under probability operators as Lewis assumes?** My probability is **0.70**. Justification: Natural language often embeds conditionals in probabilistic contexts (e.g., “It’s likely that if it rains, the match will be cancelled”), suggesting this syntactic feature is intuitive, though non-propositionalists can reinterpret such embeddings pragmatically.
  4. **Key sub-question: Are non-propositional accounts (e.g., Adams’s thesis, dynamic semantics) sufficiently explanatory?** My probability is **0.80**. Justification: These accounts elegantly handle triviality by denying conditionals bear truth values, aligning with their role in expressing suppositional thought; they cover many linguistic behaviours well, despite unresolved challenges with complex embeddings.
  5. These sub-questions combine multiplicatively (as all must hold for propositionalism): 0.35 × 0.70 × 0.80 ≈ 0.20. My view is most sensitive to **sub-question 2 (the Equation)**, as new probabilistic triviality proofs or semantic innovations could drastically alter its viability.
