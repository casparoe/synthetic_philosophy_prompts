  Key concerns I should address: over-intellectualization (animals/infants), regress problems, conflation with introspection, misrepresentation as bug-not-feature, and redundancy criticisms from global workspace/illusionism. The chair allows long questions, so replies need to be concise but substantive.

  For structure: 8 objections ordered by likelihood. Each should include: authentic phrasing matching audience's theoretical positions, 2-minute reply, vulnerability notes, and concession guidance. Plus one "nightmare question" analysis.

  Audience-specific phrasing matters: Tye-influenced folks will attack misrepresentation implausibility, global workspace theorists will push functional redundancy, illusionist will demand why not eliminate consciousness entirely. Replies must grant plausible points (e.g., infants' non-propositional cognition) while holding firm on actual higher-order states being necessary.

