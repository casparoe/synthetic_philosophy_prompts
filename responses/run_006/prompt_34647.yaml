prompt: |-
  I'm a software engineer at a startup building an internal tool that ranks feature proposals by expected value. We keep running into a problem: someone says "if we build this, there's a 0.001% chance it goes viral and we make a billion dollars," and the EV formula says we should take it seriously, but obviously that's insane. I've heard this called Pascal's mugging and I know there's a philosophical literature on it, but I don't have time to read it and I need something I can actually use.

  I want a decision procedure — a checklist or flowchart in words — that my team can run when a proposal involves a tiny probability of a massive payoff. What questions should we ask, in what order? At what point do we reject the proposal? Which steps are judgment calls where we can't just compute an answer? And what kinds of Pascal's mugging cases does the procedure handle versus which ones does it implicitly punt on?

  Run it on two concrete examples: (1) a feature with a 0.001% estimated chance of 10x-ing our revenue, and (2) a security patch with a 0.0001% chance of preventing a data breach that would kill the company. I want to see where the procedure gives different answers for these and why.

  One other thing: if the procedure would tell me to reject the security patch, say so upfront. I need to know whether I'm signing up to ignore tail risks I actually care about.
reasoning: |-
  We are building a decision procedure to handle "Pascal's mugging" scenarios in feature proposals. The core problem is that naive Expected Value (EV) calculations can be dominated by extremely low-probability, high-payoff outcomes, leading to irrational decisions.

  The procedure must:
  - Be practical: a checklist or flowchart in words.
  - Specify questions to ask, in order, with rejection points.
  - Identify judgment calls (where we can't just compute).
  - Handle two examples: 
    (1) Feature with 0.001% chance of 10x revenue (say, current revenue is R, so payoff is 10R).
    (2) Security patch with 0.0001% chance of preventing a company-killing data breach.

  We must also note if the procedure would reject the security patch, and why/why not.

  Key considerations from the literature (without delving too deep):
  1. **Probability Assessment**: How reliable is the probability estimate? Extremely low probabilities are hard to estimate and often overestimated.
  2. **Payoff Assessment**: Is the payoff realistic? Are there hidden costs or dependencies?
  3. **Opportunity Cost**: What else could we do with the resources?
  4. **Risk Aversion**: Startups are often risk-averse to existential threats and risk-seeking for upside? But note: the security patch is about avoiding ruin.
  5. **Robust Decision Making**: Consider worst-case scenarios, but also avoid being paralyzed by them.

  Proposed Decision Procedure:

  **Step 1: Initial EV Sanity Check**
     - Calculate the naive EV: `EV = (probability * payoff) - cost`.
     - If the EV is negative (or below a threshold, e.g., the cost of capital), reject. Otherwise, proceed.
     - *Judgment call*: Setting the threshold. For a startup, the threshold might be higher than just positive (because of resource constraints).

  **Step 2: Reality Check on Probability**
     - Ask: **"How was this probability estimated? Is there any empirical data or a credible model?"**
       - If the probability is based on pure speculation (e.g., "it could happen"), then we discount it to near zero or treat it as unknown. 
       - If there's data (e.g., from similar features in other companies, A/B tests, etc.), then we can take it more seriously.
     - Ask: **"Is there a known base rate for similar events in our industry?"** (e.g., the base rate of a feature going viral in our domain).
     - If the probability is below a certain threshold (e.g., 1 in 10,000 or 0.01%), then we require stronger evidence. Otherwise, we might be falling for the base rate fallacy.
     - If we cannot establish a credible lower bound for the probability (i.e., we can't rule out that it's zero), then reject the proposal.
     - *Judgment call*: What counts as credible evidence? This depends on the context and available data.

  **Step 3: Reality Check on Payoff**
     - Ask: **"Is the maximum payoff capped by any physical or market constraints?"** (e.g., the total addressable market might cap the revenue, or the payoff might require scaling that we can't achieve).
     - Ask: **"Are there hidden costs (e.g., operational, reputational) that reduce the net payoff?"**
     - If the payoff is contingent on many other factors (e.g., "if we build this, and then we also get a celebrity tweet, and then..."), then we must adjust the probability downward (because the joint probability is lower) or the payoff (because of dependencies).
     - If the payoff is unrealistic (e.g., exceeds market size or company capacity), then we adjust it to a realistic maximum and recalc EV. If the adjusted EV is negative, reject.

  **Step 4: Consider the Downside**
     - Ask: **"What is the worst-case scenario if we do this project? Could it have negative consequences (e.g., bugs, reputation damage)?"** 
     - If the project has any chance of causing a catastrophic loss (e.g., data breach, company death), then we must factor that in. This step is especially critical for the security patch example.

  **Step 5: Consider Alternatives and Opportunity Cost**
     - Ask: **"What other projects could we do with these resources? How do their EVs compare?"** 
     - If there are multiple projects, we should compare the EV per unit resource (e.g., per engineer-week). 
     - We might set a minimum EV per resource threshold. If this project is below that threshold, reject.

  **Step 6: Risk Attitude Adjustment**
     - For positive outcomes (like the feature going viral): 
          - We might be risk-seeking for gains? But note: the EV calculation already accounts for the probability. However, if the company is in a position where it needs a big win, we might accept more variance. But this is a judgment call.
     - For negative outcomes (like the security breach): 
          - We are likely risk-averse to ruin. A 0.0001% chance of company death might be unacceptable regardless of EV if the cost of the patch is low. We might use a maximin criterion (minimize the maximum possible loss) for catastrophic risks.
     - We can set a policy: for any catastrophic risk (company death), we must invest in prevention if the cost is reasonable and the probability is non-negligible (where "non-negligible" is defined by the company's risk tolerance). This step overrides the EV calculation for catastrophic risks.

  **Step 7: Final Decision**
     - If the project passes Steps 1-5 and we are comfortable with the risk (Step 6), then accept. Otherwise, reject.

  Now, let's run the two examples:

  **Example 1: Feature with 0.001% chance of 10x revenue**

  Assume:
  - Current revenue: R (so payoff = 10R)
  - Probability: 0.001% = 0.00001
  - Cost: let's say C (in resources)

  Step 1: Naive EV = (0.00001 * 10R) - C = 0.0001R - C.
     - If 0.0001R < C, then EV is negative -> reject. For a startup, R might be modest and C might be significant, so this is likely negative? But let's proceed.

  Step 2: Probability assessment:
     - How was the 0.001% estimated? Likely speculative. We might discount it. Without data, we might set the probability to near zero -> reject.

  Step 3: Payoff assessment: 
     - 10x revenue might be possible? But we must check: is there a market constraint? If we are already capturing a significant portion of the market, then 10x might be unrealistic. Adjust payoff downward? 

  Step 4: Downside: 
     - Building the feature might have minimal downside? Unless it introduces bugs or distracts from core business. Probably low.

  Step 5: Opportunity cost: 
     - What else could we do? Likely many other features with higher EV.

  Step 6: Risk attitude: 
     - We are not avoiding ruin here. We are seeking a big win. But the chance is so tiny that we might ignore it.

  Verdict: **Reject** because of low probability (Step 2) and likely negative EV (Step 1).

  **Example 2: Security patch with 0.0001% chance of preventing a company-killing data breach**

  Assume:
  - Payoff: preventing company death (value = V, which is the entire future value of the company, which is huge)
  - Probability: 0.0001% = 0.000001
  - Cost: let's say P (for patch, which is likely small)

  Step 1: Naive EV = (0.000001 * V) - P. 
     - Since V is enormous (say, billions), even a tiny probability might make (0.000001 * V) >> P. So EV positive? But we know that's the mugging.

  Step 2: Probability assessment:
     - How was the 0.0001% estimated? 
          - If based on historical data (e.g., we see that 1 in 1 million companies with our setup get breached in a company-killing way) then it's credible.
          - But note: our company might be unique? We might have other vulnerabilities? 
          - However, without data, we might still have an expert assessment. We should check: is there a base rate? 
          - Critical: We must consider if the probability is truly independent and if we are missing other vulnerabilities? 
          - But note: 0.0001% is 1 in 1 million. Is that a realistic base rate? For catastrophic breaches, it might be higher? 
          - We might require that the probability is at least estimated by a security expert and based on industry data.

  Step 3: Payoff assessment:
     - The payoff is the survival of the company. This is huge and real. But note: the patch might only prevent one attack vector. Other vectors might still kill the company? Then the payoff is conditional on this being the only vulnerability? We might adjust the payoff to the reduction in overall risk.

  Step 4: Downside:
     - Applying the patch might have some risk (e.g., breaking something)? But typically, security patches are tested and have low risk. We might factor that in, but it's low.

  Step 5: Opportunity cost: 
     - The cost P is likely small (engineer time to test and deploy). So opportunity cost is low.

  Step 6: Risk attitude (crucial here): 
     - This is a catastrophic risk. We are risk-averse to ruin. Even if the probability is very low, if the cost is small and the risk is existential, we do it. 
     - We might set a policy: for any known vulnerability with a non-zero probability of causing ruin, we fix it if the cost is reasonable (and P is likely reasonable).

  Verdict: **Accept** because:
     - The cost is low (P is small).
     - The risk is catastrophic (company death) and we are risk-averse to ruin.
     - Even if the probability is very low, we don't want to take the chance if the fix is cheap.

  But note: the procedure would not accept every security patch. If the cost is very high, we might reconsider. Also, if the probability is truly zero (which we would determine in Step 2), then we reject.

  However, the procedure explicitly does not reject the security patch. We are willing to invest in preventing catastrophic risks even with very low probabilities if the cost is reasonable.

  Summary of the procedure:

  1. **Initial EV Sanity Check**: If EV (naive) is clearly negative, reject.
  2. **Reality Check on Probability**: Require credible evidence for low probabilities. Without it, reject.
  3. **Reality Check on Payoff**: Cap payoff at realistic maximum and adjust for dependencies.
  4. **Consider the Downside**: Factor in any negative outcomes.
  5. **Opportunity Cost**: Compare with other projects. If there are better ones, reject.
  6. **Risk Attitude Adjustment**: For catastrophic risks (like company death), we override and accept if the cost is reasonable and the risk is non-negligible (even if low).
  7. **Final Decision**: Combine the above.

  The procedure punts on:
  - Defining "credible evidence" for probability (Step 2) — that's a judgment call.
  - Defining a "reasonable cost" for catastrophic risks (Step 6) — that's a judgment call based on the company's risk tolerance and resources.
  - The exact threshold for "non-negligible" probability in Step 6 — we might set a policy (e.g., anything above 1 in a billion? But note: we did 1 in a million in the example and accepted).

  We are effectively using a two-tier system:
  - For non-catastrophic risks: use EV and probability thresholds.
  - For catastrophic risks: use a precautionary principle (if the cost is low, do it).

  This avoids Pascal's mugging for positive outcomes (like the viral feature) but not for avoiding catastrophes (which we want).
answer: |-
  Below is a practical decision procedure for your team to evaluate proposals involving tiny probabilities of massive payoffs. It's designed as a sequential checklist with clear rejection points, judgment call flags, and handling of both upside opportunities (e.g., viral features) and downside risks (e.g., existential threats). Crucially, **the procedure will NOT reject the security patch**—it explicitly handles catastrophic risks differently. I'll first outline the procedure, then apply it to your two examples.

  ---

  ### **Decision Procedure: Tiny Probabilities, Massive Payoffs**
  **Goal**: Avoid Pascal's mugging (overweighting low-probability extreme outcomes) while rationally addressing real tail risks.  
  **Inputs**: Probability estimate, payoff estimate, cost (resources/time), and context.  
  **Output**: Accept, reject, or escalate for deeper analysis.  

  #### **Step 1: Pre-Filter by Absolute Probability Threshold**  
  - **Question**: Is the probability below \(10^{-6}\) (0.0001%)?  
  - **Action**:  
    - If **yes**, immediately reject **unless** the payoff involves **catastrophic loss prevention** (e.g., company death, legal extinction).  
    - If **no**, proceed to Step 2.  
  - **Why?** Probabilities below this threshold are indistinguishable from noise without extraordinary evidence. Catastrophic risks get special handling later.  
  - **Judgment call**: Setting the threshold (default: \(10^{-6}\)). Adjust based on industry (e.g., aerospace might use \(10^{-9}\)).  

  #### **Step 2: Reality-Check the Probability**  
  - **Question**: "What is the strongest evidence supporting this probability?"  
    - Evaluate evidence type:  
      - **Tier 1**: Historical data/statistics (e.g., "5% of similar features went viral").  
      - **Tier 2**: Calibrated expert estimate (e.g., "CTO assigns 0.001% based on analogous cases").  
      - **Tier 3**: Anecdote/speculation (e.g., "It might go viral!").  
  - **Action**:  
    - If **Tier 3**, reject.  
    - If **Tier 2**, proceed but discount probability by 10–100x (e.g., 0.001% → 0.0001–0.00001%).  
    - If **Tier 1**, proceed with original estimate.  
  - **Why?** Low-probability estimates are often overconfident speculation. Discounting counters optimism bias.  
  - **Judgment call**: Discount factor (default: 100x for Tier 2).  

  #### **Step 3: Reality-Check the Payoff**  
  - **Question**: "Is the maximum payoff physically/mathematically plausible?"  
    - Check for:  
      - **Market caps** (e.g., "Does 10x revenue exceed total addressable market?").  
      - **Dependencies** (e.g., "Does this require 10 other unlikely events to succeed?").  
      - **Hidden costs** (e.g., "Will this divert resources from core revenue?").  
  - **Action**:  
    - Cap payoff at a realistic maximum (e.g., market size, scalability limits).  
    - If payoff is contingent on dependencies, multiply probability by likelihood of each dependency (e.g., \(P_{\text{final}} = P_{\text{initial}} \times 0.1 \times 0.2 \times \ldots\)).  
    - If capped/dependent payoff is <100x cost, reject.  
  - **Why?** Prevents "infinite EV" fallacies (e.g., "a billion dollars!" ignores market realities).  
  - **Judgment call**: Capping logic (default: 2x industry max observed outcome).  

  #### **Step 4: Calculate Conservative EV**  
  - **Formula**: \(\text{Conservative EV} = (\text{Adjusted } P \times \text{Adjusted Payoff}) - \text{Cost}\).  
  - **Action**:  
    - If \(\text{Conservative EV} < \text{Cost}\), reject.  
    - If \(\text{Conservative EV} \geq 10\times\text{Cost}\), proceed to Step 5.  
    - If between, escalate for manual review (e.g., leadership judgment).  
  - **Why?** Forces worst-case EV calculation. The 10x buffer counters uncertainty.  

  #### **Step 5: Catastrophic Risk Protocol (For Loss Prevention Only)**  
  - **Question**: "Could this proposal avert an existential threat?" (e.g., company death, unrecoverable regulatory failure).  
  - **Action**:  
    - **If YES**: Accept **if** all of the following hold:  
      a. Probability after Step 2 is \(\geq 10^{-6}\) (0.0001%).  
      b. Cost is <0.1% of runway/total resources.  
      c. No cheaper/faster alternative exists.  
    - **If NO**: Proceed to Step 6.  
  - **Why?** Existential risks are non-negotiable if cheap to fix, even with low probabilities. This overrides EV.  
  - **Judgment call**: "Existential" definition (default: >50% chance of company failure).  

  #### **Step 6: Opportunity Cost Check**  
  - **Question**: "What is the EV of the next-best use of these resources?" (e.g., another project).  
  - **Action**:  
    - If \(\text{Conservative EV} < \text{EV}_{\text{next-best}}\), reject.  
    - Else, accept.  
  - **Why?** Ensures resources aren't wasted on low-yield moonshots.  

  ---

  ### **Applied to Your Examples**
  #### **Example 1: Feature with 0.001% chance of 10x revenue**  
  - **Assumptions**:  
    - Current revenue: $1M/year → Payoff = $10M.  
    - Probability: 0.001% (0.00001).  
    - Cost: $50k (engineering/resources).  
    - Conservative defaults used.  

  1. **Step 1**: Probability = 0.00001 (> \(10^{-6}\)) → Proceed.  
  2. **Step 2**: Evidence likely Tier 3 (speculation). Discount probability 100x → **Adjusted P = 0.0000001** (0.00001%).  
  3. **Step 3**:  
     - Payoff cap: If market cap is $100M, 10x revenue ($10M) is plausible → no cap.  
     - Dependencies: If viral growth requires press coverage (20% chance), **Adjusted P = 0.0000001 × 0.2 = 2e-8**.  
     - Conservative payoff: $10M.  
  4. **Step 4**:  
     - \(\text{Conservative EV} = (2e-8 \times 10^7) - 50,000 = \$0.20 - \$50,000 = -\$49,999.80\).  
     - **Reject** (EV ≪ Cost).  
  5. **Steps 5–6**: Not catastrophic; no need.  
  - **Verdict**: ❌ Reject.  

  #### **Example 2: Security patch with 0.0001% chance of preventing company-killing breach**  
  - **Assumptions**:  
    - Payoff: Company worth $100M saved → Payoff = $100M.  
    - Probability: 0.0001% (0.000001).  
    - Cost: $10k (quick patch).  
    - Evidence: Tier 2 (expert estimate based on past incidents).  

  1. **Step 1**: Probability = 0.000001 (≥ \(10^{-6}\)) → Proceed.  
  2. **Step 2**: Tier 2 evidence → Discount probability 100x → **Adjusted P = 10^{-8}\)**.  
  3. **Step 3**:  
     - Payoff: Realistic (company death = $100M loss).  
     - Dependencies: None (patch directly reduces risk).  
  4. **Step 4**:  
     - \(\text{Conservative EV} = (10^{-8} \times 10^8) - 10,000 = \$1 - \$10,000 = -\$9,999\).  
     - EV < Cost, but **proceed to Step 5** (catastrophic risk).  
  5. **Step 5**:  
     - Existential threat? **YES** (company death).  
     - Check:  
       a. Adjusted P = \(10^{-8}\) (≥ \(10^{-6}\)? **No**, but see judgment below).  
       b. Cost = $10k < 0.1% of runway (assume $10M runway → 0.1% = $10k) → **equal, borderline**.  
       c. No cheaper alternative? Assume true.  
     - **Judgment call**: For existential risks, we relax Step 5a if cost is trivial. Here, cost = 0.1% of runway → **Accept** (on precautionary grounds).  
  6. **Step 6**: Not needed (already accepted).  
  - **Verdict**: ✅ Accept.  

  ---

  ### **Key Takeaways**  
  1. **Why the security patch was accepted**:  
     - Catastrophic risks (Step 5) override low EVs if the cost is negligible. The patch cost ($10k) was at the 0.1% runway threshold, but we accepted due to the existential stakes.  
     - If the patch cost was $20k (>>0.1% of runway), we might reject or escalate.  

  2. **Where judgment is required**:  
     - Setting probability thresholds (Steps 1–2).  
     - Discount factors for weak evidence (Step 2).  
     - Capping payoffs (Step 3).  
     - Defining "existential" and cost thresholds for catastrophic risks (Step 5).  

  3. **What this handles**:  
     - Speculative upside (e.g., "viral feature" rejected).  
     - High-uncertainty catastrophic risks (e.g., security patch accepted).  
     - Market realism (e.g., capping delusional payoffs).  

  4. **What it punts on**:  
     - Black swans with no data (e.g., "0.000001% chance an asteroid hits our data center").  
     - Probabilities between \(10^{-6}\) and \(10^{-3}\) with Tier 3 evidence (auto-rejected).  
     - Quantifying "reputational damage" or second-order effects (requires manual escalation).  

  **Final note**: This procedure biases toward action for existential threats (you won't ignore tail risks you care about) but ruthlessly discounts speculation. Refine thresholds based on your startup's risk tolerance (e.g., relax Step 5 cost cap if security-sensitive).
