prompt: |-
  I am a PhD student in moral psychology, and I have been trying to get clear on what separates a moral preference from a moral bias. The distinction matters for how I describe and respond to disagreement: I am inclined to respect, or at least not to pathologize, preferences, but I regard biases as defects that a person has reason to correct. Yet my own verdicts on cases resist any simple formulation I have tried. Here are the cases and what I find myself wanting to say about each.

  1. A colleague avoids restaurants serving cuisines she did not grow up with. She says the unfamiliar smells and textures genuinely bother her, and she has tried several such dishes and disliked them. I want to call this a preference — an aesthetic or gustatory one — and not a bias, even though it tracks cultural unfamiliarity.

  2. A hiring manager choosing between two equally qualified candidates selects the one who attended the same university he did, explaining that the candidate seems like a better fit and that he can more easily imagine working alongside him. I want to call this a bias, a form of in-group favoritism, and not a legitimate preference about workplace fit.

  3. A man says he would not date members of a certain racial group because he is simply not attracted to them, and he reports that this is a stable, unchosen pattern of feeling rather than a decision. I want to call this a bias, even though it is experienced as an involuntary taste; the involuntariness does not move me.

  4. A vegan refuses animal products because she judges that factory farming is a serious wrong and that purchasing those products would make her complicit in it. I want to say this is neither a mere preference nor a bias; it is a moral conviction, even though it was surely shaped by upbringing and by the particular arguments and images she happened to encounter.

  5. A religious believer opposes same-sex marriage on the ground that his tradition teaches that marriage is between a man and a woman, and he regards the tradition as authoritative. I find myself wanting to call this a bias, but I cannot state what makes it different in kind from case 4. Both are comprehensive moral convictions, both are partly inherited, and both are held with some resistance to contrary argument.

  6. A physician who sincerely disavows any racist belief nonetheless, when working under time pressure, prescribes less pain medication for Black patients than for white patients with the same presentation, in a pattern that tracks his score on an implicit association test. I want to call this a bias, clearly, and not a preference at all, since the physician does not endorse it.

  7. A donor gives several thousand dollars each year to a well-run local food bank rather than to a highly effective global health charity, saying that his obligations lie first with his own community and that he cares more about people whose lives he can see. I am torn. Part of me says this is legitimate partiality, a preference about where to direct one's aid; part of me says it is a parochial bias, because the same money could prevent far more death and suffering elsewhere.

  8. A person eats pork but would not eat dog, explaining that dogs are companion animals in his culture while pigs are food animals. I am unsure. It feels like a bias, a culturally inherited disgust that does not track any morally relevant difference; but I can also see it as a preference internal to a culinary tradition, much like case 1.

  My question is whether there is a single principle, or a small set of candidate principles, that captures these verdicts, or nearly all of them, without being gerrymandered. Specifically: what feature distinguishes case 1 from case 3, if both are aversions the person did not choose? What feature distinguishes case 4 from case 5, if both are inherited moral convictions? And what should I conclude about cases 7 and 8, where I am torn? If no principled account can accommodate every verdict, I want to know which verdicts I should revise and why. Please state the principle precisely, indicate which case or cases motivate each of its clauses, apply it to a case I have not listed — a university admissions officer who gives some weight to an applicant's being the first in their family to attend college — and be explicit about which of my verdicts, if any, the principle cannot accommodate. I am not looking for a survey of the literature; I want the clearest statement of the principle and its implications.
reasoning: |-
  Okay, the user is a PhD student in moral psychology struggling to distinguish between moral preferences and biases. They've provided eight cases where they have intuitive judgments but can't find a unifying principle. Their goal is to have a clear distinction since preferences are seen as legitimate while biases are defects needing correction.

  First, I need to parse each case and their verdicts. Case 1 is a taste preference for familiar foods, called not a bias. Case 2 is in-group hiring favoritism, labeled a bias. Case 3 is racial dating exclusion, considered a bias despite feeling involuntary. Case 4 is veganism as a moral conviction. Case 5 is religious opposition to same-sex marriage, seen as a bias but similar to case 4. Case 6 is implicit racial bias in medical treatment. Case 7 is local vs. global charity, torn between preference and bias. Case 8 is cultural disgust at eating dogs vs. pigs, also torn.

  The key distinctions they need are: why case 1 differs from case 3 (both involuntary aversions), why case 4 differs from case 5 (both inherited convictions), and resolutions for cases 7 and 8.

  Looking for a principle that explains these without being ad hoc. Factors to consider: voluntariness of the aversion, endorsement, moral relevance, harm caused, and resistance to evidence. But the user notes involuntariness doesn't matter (case 3), and both case 4 and 5 are inherited and resistant to arguments.

  The core difference might lie in the relationship to harm and moral justifiability. Biases involve unwarranted differential treatment that causes harm or perpetuates injustice, while preferences might be neutral in that regard. For example, avoiding unfamiliar cuisines doesn't harm others, but racial dating exclusion perpetuates systemic racism. Similarly, veganism opposes perceived harm (animal suffering), while opposing same-sex marriage imposes on others' rights without sufficient justification.

  In case 5, the religious conviction imposes harm by denying marriage equality, whereas veganism seeks to avoid complicity in harm. The distinction hinges on whether the conviction upholds or violates fundamental moral principles like equality.

  For cases 7 and 8: local charity might be a preference if partiality is morally permissible, but a bias if it ignores greater obligations to distant others. Eating pork but not dog could be cultural preference unless it reflects speciesism without moral basis.

  The proposed principle should incorporate harm, moral relevance, and resistance to counter-evidence. Testing it on the additional case: favoring first-gen college students. If it aims to correct historical inequities, it's a preference (positive bias); if arbitrary, it's a bias. The user's verdicts mostly fit, except maybe case 8, which might need reframing as a preference if culturally consistent without harm.

  Need to ensure the principle isn't gerrymandered. Focusing on harm and moral justifiability seems consistent across cases. Cases 4 and 5 differ because one challenges structural harm while the other enforces it. This should help the user refine their framework for moral psychology research.
answer: |-
  Based on your cases and intuitive verdicts, the clearest principle distinguishing moral *preferences* from moral *biases* hinges on **whether the attitude systematically disadvantages others relative to a morally justifiable baseline, coupled with resistance to counterevidence about that disadvantage.** Here's the precise formulation:

  **The Principle:**  
  An attitude is a *bias* (rather than a mere preference) if:  
  **(1) Differential Treatment:** It leads to systematically differential treatment of individuals or groups; AND  
  **(2) Unwarranted Disadvantage:** This differential treatment disadvantages others relative to a morally justifiable baseline (e.g., equal consideration, basic rights, objective welfare); AND  
  **(3) Epistemic Resistance:** The attitude persists despite accessible counterevidence showing the disadvantage is unwarranted (e.g., lack of relevant difference, disproportionate harm, availability of superior alternatives).  

  An attitude is a *preference* if it lacks one or more of these conditions. A *moral conviction* (cases 4, 5) is a distinct category: it’s a deeply held belief about right/wrong that *may* function as a preference or bias depending on whether it meets the above criteria.  

  ---

  **Application to Your Cases:**  
  1. **Restaurant Avoidance (Preference):**  
     - (1) Differential treatment? Yes (avoids certain cuisines).  
     - (2) Unwarranted disadvantage? **No.** Avoiding foreign food doesn’t deny others equal consideration or rights; no one is owed her patronage.  
     - *Fits verdict: Preference.*  

  2. **University Hiring (Bias):**  
     - (1) Differential treatment? Yes (favors alma mater candidate).  
     - (2) Unwarranted disadvantage? **Yes.** Equal qualifications imply equal merit; favoring "fit" based on shared background denies equal opportunity absent evidence of relevance.  
     - (3) Epistemic resistance? **Yes.** Evidence shows in-group favoritism undermines meritocracy; the manager ignores this.  
     - *Fits verdict: Bias.*  

  3. **Racial Dating Exclusion (Bias):**  
     - (1) Differential treatment? Yes (excludes entire racial group).  
     - (2) Unwarranted disadvantage? **Yes.** Disadvantage in dating/relationships based on race denies equal consideration absent a morally relevant difference (e.g., compatibility traits). Race is not inherently relevant.  
     - (3) Epistemic resistance? **Yes.** Social/psychological evidence shows such "preferences" stem from systemic racism; the involuntariness doesn’t negate this.  
     - *Fits verdict: Bias (explains why involuntariness doesn’t absolve it).*  

  4. **Veganism (Moral Conviction, not Bias):**  
     - (1) Differential treatment? Yes (avoids animal products).  
     - (2) Unwarranted disadvantage? **No (by her lights, but key for verdict).** She argues purchasing animal products *causes* disadvantage (to animals/humans via exploitation). If her moral baseline (reducing harm) is justifiable, this is *countering* disadvantage.  
     - (3) Resistance? She engages evidence (e.g., factory farming harms).  
     - *Fits verdict: Moral conviction, neither preference nor bias. Principle shows why: it doesn’t meet condition (2).*  

  5. **Opposing Same-Sex Marriage (Bias):**  
     - (1) Differential treatment? Yes (denies marriage rights to same-sex couples).  
     - (2) Unwarranted disadvantage? **Yes.** Denies equal rights/recognition absent a morally relevant difference (e.g., harm caused). Tradition alone isn’t sufficient justification.  
     - (3) Epistemic resistance? **Yes.** Evidence shows no harm from same-sex marriage and significant harm from denial; appeals to tradition resist this.  
     - *Fits verdict: Bias. Distinguishes from case 4: Opposition here* imposes *disadvantage; veganism* avoids *perceived complicity in disadvantage. The baseline (equal rights) is more objectively justifiable than tradition.*  

  6. **Pain Medication Disparity (Bias):**  
     - (1) Differential treatment? Yes (prescribes less to Black patients).  
     - (2) Unwarranted disadvantage? **Yes.** Results in unequal care/suffering without medical justification.  
     - (3) Epistemic resistance? **N/A (implicit),** but the *system* resists evidence (IAT reveals unconscious bias). Unendorsed differential harm suffices.  
     - *Fits verdict: Bias.*  

  7. **Local vs. Global Charity (Preference or Bias?):**  
     - (1) Differential treatment? Yes (favors local aid).  
     - (2) Unwarranted disadvantage? **Debatable.**  
       - *As Preference:* Partiality to "near and dear" may be morally justifiable; local engagement has non-quantifiable value.  
       - *As Bias:* Ignores that equal moral worth implies equal obligation; evidence shows global aid prevents far more suffering per dollar.  
     - (3) Epistemic resistance? **Yes for bias view.** Ignoces cost-effectiveness evidence.  
     - *Principle’s Verdict:* **Bias** if "morally justifiable baseline" requires maximizing welfare/impact (evidence shows local choice causes greater harm elsewhere). **Preference** if partialism is justifiable. *Your torn verdict reflects this tension; the principle leans toward bias given (3).*  

  8. **Eating Pork but not Dog (Preference):**  
     - (1) Differential treatment? Yes (eats pigs, not dogs).  
     - (2) Unwarranted disadvantage? **No.** Animals lack equal moral status in his framework; cultural food practices don’t systematically disadvantage *humans* (unlike cases 3/5).  
     - (3) Epistemic resistance? Irrelevant if (2) isn’t met.  
     - *Principle’s Verdict:* **Preference** (like case 1). Disgust is culturally coherent and causes no human disadvantage. *Revise your verdict: call it a preference.*  

  ---

  **New Case: University Admissions Officer Favors First-Gen Applicants**  
  - (1) Differential treatment? Yes (favors first-gen candidates).  
  - (2) Unwarranted disadvantage? **No.** If first-gen status signals overcoming systemic barriers, favoring them *counters* disadvantage relative to a meritocratic baseline.  
  - (3) Epistemic resistance? Engages evidence (e.g., first-gen students face unique challenges).  
  - **Verdict:** Not a bias; a **justified preference** (or policy) promoting equity.  

  ---

  **What the Principle Captures and Where It Deviates:**  
  - **Accommodates:** Cases 1 (preference), 2 (bias), 3 (bias), 4 (conviction), 5 (bias), 6 (bias).  
  - **Revises:** Case 8 (preference, not bias). Case 7 leans bias.  
  - **Clarifies Distinctions:**  
    - **Case 1 vs. 3:** Both involuntary, but case 3 imposes disadvantage *on persons* (violating equal consideration); case 1 does not.  
    - **Case 4 vs. 5:** Both convictions, but case 5 imposes disadvantage on a group (same-sex couples) without sufficient justification, violating a widely justifiable baseline (equal rights). Case 4 avoids perceived complicity in harm without denying others’ rights.  
  - **Motivations for Clauses:**  
    - (1) Motivated by all cases (all involve differential treatment).  
    - (2) Motivated by cases 2,3,5,6,7 (disadvantage is key to pathologizing bias).  
    - (3) Motivated by cases 2,5,7 (resistance to counterevidence shows defect in reasoning).  

  **Strength:** This principle avoids gerrymandering by grounding the distinction in harm/disadvantage and epistemic responsibility, not voluntariness or cultural embeddedness. It treats biases as moral defects because they perpetuate unjustified harm and resist correction. Preferences, even strong ones, lack these features. Moral convictions are evaluated by the same standard.
