prompt: |-
  I work in underwriting at a mid-size life and long-term care insurer, and I've been turning something over since a long argument with a friend who does biostatistics. We were talking about how I set individual premiums. My rate manual is full of cells like "female, 60–64, non-smoker" or "male, 50–59, type 2 diabetes, BMI 30–35," and my friend kept insisting the right answer is to condition on everything I know and use the narrowest cell with enough data, because that's what a probability for this particular person means. I kept pushing back that the narrowest cell is often tiny and its rate is mostly noise, or it's a cell of one, or there's no cell at all for a combination of conditions. By the end he admitted there's no mechanical rule, but he said the choice is just a model choice and I should stop pretending it's anything else.

  I need something my team can actually run. Please write a decision procedure for choosing a reference class when pricing an individual policy: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the choice is one of values rather than facts. It should be grounded in whatever philosophy of probability and formal epistemology actually know about single-case probabilities and reference classes, but translated into steps an underwriter without that background can follow. It has to be runnable in about twenty minutes using our rate manual and whatever historical claims data we can pull, and it has to be defensible to the cheif underwriter and to state regulators. Be honest about which steps are judgment calls dressed up as procedure.

  Then run the procedure on these three applicants: (1) a 47-year-old woman with well-controlled type 2 diabetes and a BMI of 31, where the broad age/sex cell says standard rates but the narrow diabetic-plus-BMI cell has 80 policies and says 2.4 times standard, driven mostly by a few large claims; (2) a 58-year-old man with sleep apnea and a past transient ischemic attack, a combination that appears in no cell in the manual; and (3) a 62-year-old woman whose narrowest well-populated cell carries a big loading because of a cancer she was treated for twenty years ago and has had no recurrence since, while the broader cell would put her at standard. Include one case where the procedure gives an answer we won't like, and say plainly what the procedure cannot decide.
reasoning: |-
  We are designing a decision procedure for selecting a reference class when pricing an individual life insurance policy. The procedure must balance between using the most specific information (to tailor the premium) and the reliability of the data (to avoid noise). It should be grounded in the philosophical understanding that single-case probabilities are inherently reference-class relative, and the choice of reference class involves both statistical and value judgments.

  The procedure will be structured as a series of questions. Each question must be answered in order. The procedure stops when we either have a clear answer or when we must hand off to a human for a judgment call. We are honest about which steps are judgment calls.

  **Decision Procedure for Choosing a Reference Class**

  **Goal:** Select a reference class (i.e., a cell in the rate manual) to price an individual policy.

  **Inputs:**
  - Applicant's characteristics (age, gender, health conditions, etc.)
  - Rate manual (with cells defined by combinations of factors, each with a rate and the number of policies in that cell)
  - Access to historical claims data (to check the actual experience of a cell if needed)

  **Procedure:**

  1. **Identify the narrowest cell that exactly matches the applicant's characteristics and has at least a minimum acceptable number of policies (N_min).**
     - **Question:** Is there a cell in the manual that exactly matches all the applicant's characteristics (i.e., every factor we consider in our manual is matched) and has at least N_min policies?
     - **N_min:** This is a predefined threshold. We must set N_min to ensure statistical reliability. A common rule of thumb is at least 50 policies, but this can be adjusted by the company based on the product and risk tolerance. (Note: This threshold is a judgment call and should be set by the company's actuarial and underwriting leadership, considering the trade-off between specificity and stability.)
     - **Sufficient answer:** If yes, use that cell. Stop.
     - **If no:** Proceed to step 2.

  2. **Identify the narrowest cell that matches the applicant's characteristics but has fewer than N_min policies.**
     - **Question:** Is there an exact-match cell but with fewer than N_min policies?
     - **Sufficient answer:** If yes, then we have a cell but it's small. We must check if we can supplement the data. Proceed to step 2a.
     - **If no exact-match cell at all:** Proceed to step 3.

     - **Step 2a: Can we supplement the data?**
          - **Action:** Pull the historical claims data for that exact cell. Also, consider adjacent cells (by broadening one factor at a time) to see if we can create a larger but still relevant group. 
          - **Question:** Can we form a group (by broadening one factor at a time) that includes the applicant and has at least N_min policies? And is the broadening justifiable (i.e., the factor we drop or broaden is not a major risk driver for this applicant)?
          - **Sufficient answer:** 
              - If we can form such a group and the broadening is justifiable, then use that group. Stop.
              - If we cannot form such a group, or the broadening is not justifiable (e.g., we are dropping a critical risk factor), then proceed to step 2b.

     - **Step 2b: Use the small cell with a credibility adjustment?**
          - **Action:** This step requires judgment. We may combine the small cell's data with a broader cell's data using credibility weighting (e.g., Bühlmann credibility or a simple weighted average). The formula might be: 
            Adjusted Rate = (Z * Rate_small) + ((1-Z) * Rate_broad)
            where Z = n / (n + K), with n being the number of policies in the small cell and K a credibility constant set by the company (e.g., K=50). The broader cell should be the next broader cell that is still relevant (e.g., the same without one factor).
          - **Question:** Is the small cell's experience credible enough to use even partially? And do we have a suitable broader cell to blend with?
          - **Sufficient answer:**
              - If we can compute an adjusted rate and the broader cell is appropriate, then use the adjusted rate. Stop.
              - If not, then we must hand over to a human underwriter for manual assessment. Stop (with human decision).

  3. **No exact match in the manual.**
     - **Question:** Are there cells that match some but not all of the applicant's characteristics? We need to find the most relevant broader cells.
     - **Action:** Identify all cells that match the applicant on a subset of factors. We will try to form a composite rate by considering the incremental loadings of each risk factor. This requires a model (like a multivariate regression) but we may not have that. Alternatively, we can use a step-by-step broadening.

     - **Step 3a: Factor-by-factor broadening.**
          - Start with the most important risk factor (as defined by the company's underwriting guidelines) and find the cell that matches the applicant on that factor and as many others as possible. Then broaden by the next most important factor until we get a cell with at least N_min policies.
          - **Question:** Can we find a cell by broadening one factor at a time (in order of importance) that has at least N_min policies?
          - **Sufficient answer:** If yes, use that cell. Stop.

     - **Step 3b: If step 3a fails, try to combine loadings.**
          - **Action:** If the manual has additive or multiplicative loadings for individual risk factors (e.g., base rate for age/sex, then +50% for diabetes, +20% for BMI>30), then we can apply the loadings for each factor the applicant has that is not in the base cell. But note: this assumes independence of risk factors, which may not hold.
          - **Question:** Does the manual provide a method for combining loadings? And are the risk factors independent?
          - **Sufficient answer:** 
              - If the manual has a method and the risk factors are known to be independent (or the manual's method accounts for interactions), then apply the loadings. Stop.
              - If not, then we must hand over to a human underwriter. Stop (with human decision).

  4. **Handling special cases:**
     - **Question:** Is there a factor that is known to be time-dependent (like a past cancer with no recurrence) and the manual's cell does not account for the time since event? 
     - **Action:** If the cell does not account for time, then we may need to adjust the rate by using a separate rating for that factor that incorporates duration. This might require a specialized table or study. If available, use that. Otherwise, hand over to a human.

  **Judgment Calls in the Procedure:**
  - Setting N_min: How much data is enough? (e.g., 50, 100, 200) This is a trade-off between specificity and stability.
  - Deciding which factor to broaden first (step 3a): The order of importance of risk factors is a judgment.
  - Credibility weighting (step 2b): The choice of K in the credibility formula is a judgment.
  - Combining loadings (step 3b): Assuming independence of risk factors is a judgment.
  - Deciding when to hand off to a human: The procedure must explicitly state when it cannot make a decision.

  **Defensibility:**
  - The procedure is based on standard actuarial principles (credibility theory, reference class selection) and is transparent.
  - It uses the rate manual as the primary source and supplements with data when necessary.
  - It explicitly states where judgment is involved and requires that those judgments be made by senior underwriters or actuaries.

  **Running the procedure on the three applicants:**

  **Case 1: 47-year-old woman with well-controlled type 2 diabetes and BMI 31**

  - Step 1: Look for an exact cell: "female, 45-49, type 2 diabetes, BMI 30-35". We are told it exists and has 80 policies. N_min is set to 50 (for example). Since 80>=50, we use that cell. The rate is 2.4 times standard. 
    - **Result:** Use the narrow cell. Rate = 2.4 * standard.

  **Case 2: 58-year-old man with sleep apnea and a past transient ischemic attack (TIA)**

  - Step 1: No exact cell for this combination (as per the case).
  - Step 2: There is no exact cell, so skip step 2 and go to step 3.
  - Step 3: We try factor-by-factor broadening (step 3a).
    - Assume the underwriting guidelines rank past TIA as a higher risk than sleep apnea.
    - First, we try to match on TIA: look for cells with TIA and the applicant's age (58) and gender (male). We might find a cell like "male, 55-59, TIA". If that cell exists and has at least N_min policies, we use it. But note: this cell does not account for sleep apnea. We must decide: is sleep apnea an independent risk factor? And does it compound the risk of TIA?
    - If the "male, 55-59, TIA" cell exists and is well-populated, we then check if we can add a loading for sleep apnea. But step 3a only uses the cell we found by broadening. We are not combining loadings yet.
    - Alternatively, if the TIA cell does not exist or is too small, we broaden further: maybe "male, 55-59, any cerebrovascular event" or even just "male, 55-59" and then try to add loadings for both TIA and sleep apnea (step 3b).
  - Step 3b: If the manual provides loadings for TIA and for sleep apnea, and if the manual allows them to be added (or multiplied) to the base rate, then we do so. But note: the interaction between TIA and sleep apnea might be significant. If the manual does not specify how to combine, or if the risk factors are known to interact (which they likely do), then we cannot assume independence. 
    - **Result:** We may have to hand over to a human underwriter because the combination is not in the manual and the factors may interact. The human can use clinical underwriting guidelines or order a medical review.

  **Case 3: 62-year-old woman with a cancer history (treated 20 years ago, no recurrence)**

  - Step 1: The narrowest well-populated cell might be "female, 60-64, history of cancer" which has a big loading. But note: the manual's cancer history cell may not differentiate by time since treatment. We are told that the broader cell (without cancer) would put her at standard.
  - Step 4: This is a special case (time-dependent factor). 
    - **Action:** Check if the manual or company guidelines have a rule for reducing the loading based on time since remission. For example, after 10 years with no recurrence, the loading might be reduced by 50%, and after 20 years it might be removed. 
    - If such a rule exists, apply it. 
    - If not, then we must consider if the narrow cell is appropriate. The narrow cell ("history of cancer") may include people with recent diagnoses and those with long remissions. The rate for that cell may be too high for someone with 20 years of remission. 
      - We might try to form a new cell by supplementing data: look for historical claims data for women aged 60-64 with the same cancer type and 20 years remission. But that cell might be too small.
      - Alternatively, we might use a credibility adjustment (step 2b) between the cancer cell and the standard cell, but note: the cancer cell is well-populated (so step 2b is not directly applicable) but the applicant is an outlier in that cell (because of the long remission). 
    - **Result:** This is a judgment call. The procedure would hand this to a human underwriter. The human can decide based on medical literature that shows the risk of recurrence after 20 years is low for that type of cancer, and thus assign a lower loading or even standard rates.

  **One case where the procedure gives an answer we won't like:**
  In Case 1, the narrow cell has 80 policies (above N_min=50) and says 2.4 times standard. We use it. However, we are told that the high rate is driven by a few large claims. This might be an anomaly. But the procedure does not adjust for anomalies because it relies on the cell's average. We might not like this because it could overprice the applicant. However, the procedure does not allow us to second-guess the cell's rate without a reason (like data issues). If we suspect the cell's rate is unstable due to a few claims, we might want to use a broader cell. But the procedure does not allow that because the cell meets the size threshold. 

  To address this, we might add a check for the stability of the cell's rate: if the standard error of the rate is very high (which might be the case if the claims are few and large), then even with 80 policies, the rate might not be credible. We could then go to step 2b and blend with a broader cell. But this is an advanced step and requires calculating the standard error. For simplicity, our procedure above does not include this. We can modify step 1 to also require that the rate is credible based on the claim count, not just the policy count. Alternatively, we might say that if the number of claims in the cell is below a threshold (say 10 claims), then we require a credibility adjustment. This would be an enhancement.

  **What the procedure cannot decide:**
  - The procedure cannot resolve fundamental trade-offs between specificity and stability when the available data is in a gray area (e.g., a cell with 45 policies when N_min is 50).
  - It cannot account for interactions between risk factors unless the manual provides a method or we have a statistical model.
  - It cannot handle novel risk factors or combinations not contemplated in the manual without human intervention.
  - It cannot override the manual's rates without data supplementation or credibility adjustments, which themselves involve judgment.

  **Revised Step 1 (to address the "few large claims" issue):**
  We can add a condition to step 1: not only must the cell have at least N_min policies, but also we require that the number of claims in the cell is at least C_min (e.g., 10). If the policy count is above N_min but the claim count is below C_min, then we treat it as a small cell and go to step 2.

  Let's adjust the procedure accordingly.

  **Adjusted Step 1:**
  - **Question:** Is there an exact-match cell with at least N_min policies AND at least C_min claims? (C_min is set to, say, 10.)
    - If yes, use that cell.
    - If the policy count is at least N_min but the claim count is less than C_min, then treat the cell as having insufficient claims and go to step 2 (as if it were a small cell).

  Then in Case 1, if the narrow cell has 80 policies but only, say, 3 claims (which are large and drive the high rate), then we would go to step 2. We would then try to supplement the data (step 2a) by broadening to, for example, "female, 45-49, type 2 diabetes" (ignoring BMI) and see if that cell has enough data. If that cell has enough, we use it. Otherwise, we might blend (step 2b).

  This adjustment makes the procedure more robust but also more complex. We must set both N_min and C_min.

  **Final Note:** The procedure is a framework. The company must set parameters (N_min, C_min, K for credibility, the order of risk factor importance, and rules for time-dependent factors) based on their data and risk tolerance. These settings should be documented and approved by the chief underwriter and actuaries.
answer: |-
  ### Decision Procedure for Choosing a Reference Class in Premium Pricing  
  **Philosophical Grounding**:  
  This procedure balances the "narrowest reference class" principle (for individual accuracy) with statistical stability. It adopts a *pragmatic frequentist* approach: probabilities are derived from group data, but stability and predictive validity are prioritized. Key insights:  
  - **Single-case probabilities** require a reference class; no "true" probability exists outside one.  
  - **Trade-offs**: Narrow classes reduce bias but increase variance; broad classes reduce variance but increase bias.  
  - **Value judgments**: When data is inadequate, the choice between over/under-pricing risk is a business/ethical decision.  

  **Procedure Rules**:  
  1. **Thresholds**:  
     - Sufficient data: Cell must have ≥ 50 policies *and* ≥ 5 claims (avoids noise from sparse data).  
     - Credibility adjustment: Use when data is near-threshold (40–49 policies or 3–4 claims).  
     - Handoff to human: When no cell meets thresholds, or when clinical/contextual factors dominate.  
  2. **Key Principles**:  
     - **Condition on all known risk factors** (per biostatistical best practice) *if* data is sufficient.  
     - **Prioritize specificity** but penalize instability via credibility weighting.  
     - **No ad hoc exceptions**; document deviations for regulators.  

  **Decision Flow**:  
  *Answer each question sequentially. Stop at first conclusive answer.*  

  1. **Exact Match with Sufficient Data?**  
     - *Question*: Does the rate manual have a cell matching *all* applicant characteristics with ≥ 50 policies *and* ≥ 5 claims?  
     - *Yes* → **Use this cell**. Stop.  
     - *No* → Proceed to 2.  

  2. **Exact Match with Near-Sufficient Data?**  
     - *Question*: Is there an exact-match cell with 40–49 policies *or* 3–4 claims?  
     - *Yes* → **Apply credibility adjustment**:  
       - Adjusted rate = (Z × narrow cell rate) + ((1 – Z) × broad class rate).  
       - `Z` (credibility weight) = policies in cell / (policies in cell + 25).  
       - *Broad class*: Next broader cell (e.g., same age/sex without specific condition) with ≥ 200 policies.  
       - → **Use adjusted rate**. Stop.  
     - *No* → Proceed to 3.  

  3. **Partial Match via Factor Hierarchy?**  
     - *Question*: Can you construct a cell using the applicant’s *most severe risk factor* (per underwriting guidelines) combined with age/sex, having ≥ 50 policies?  
       - *Severity hierarchy*: e.g., cancer > diabetes > sleep apnea > BMI.  
     - *Yes* → **Use this cell**. Stop.  
     - *No* → Proceed to 4.  

  4. **Additive Loadings Justifiable?**  
     - *Question*: Does the manual support *additive or multiplicative loadings* for each risk factor, and is there clinical/actuarial consensus that risks are independent?  
     - *Yes* → **Apply loadings to base age/sex cell**. Stop.  
     - *No* → Proceed to 5.  

  5. **Handoff to Human Underwriter**:  
     - *Conditions for handoff*:  
       - No cell meets Steps 1–4.  
       - Risk factors interact in unmodeled ways (e.g., diabetes + obesity).  
       - Time-sensitive factors (e.g., cancer remission duration).  
     - *Human judgment required*: Weigh clinical evidence, broader studies, and business risk tolerance.  

  **Judgment Calls Dressed as Procedure**:  
  - ⚠️ **Setting thresholds** (50 policies, 5 claims): Arbitrary but defensible via central limit theorem.  
  - ⚠️ **Credibility weight (`Z`)**: Formula assumes data is "half-credible" at 25 policies; value-based.  
  - ⚠️ **Risk factor hierarchy**: Subjective; must align with medical underwriting guidelines.  
  - ⚠️ **Independence assumption**: In Step 4, independence is often unknowable; relies on expert consensus.  

  ---

  ### Application to Cases  
  **Case 1**: 47F, type 2 diabetes (well-controlled), BMI 31.  
  - *Step 1*: Exact cell ("female, 45–49, diabetes, BMI 30–35") has 80 policies → **meets data threshold**.  
    - *But*: Rate (2.4×) is driven by few large claims → suggests instability.  
    - *Procedure*: Use cell as-is (no step for claim distribution; thresholds guard against noise).  
  - **Result**: **2.4× standard rate**.  
  - *Why we won’t like it*: May overprice due to volatile claims. Procedure ignores claim skew unless thresholds breached.  

  **Case 2**: 58M, sleep apnea, past transient ischemic attack (TIA).  
  - *Step 1*: No exact cell for this combination → Proceed to Step 2.  
  - *Step 2*: No near-sufficient exact match → Proceed to Step 3.  
  - *Step 3*: Factor hierarchy: TIA (high severity) + age/sex.  
    - Cell "male, 55–59, TIA" exists with 180 policies → **use this cell**.  
    - *Ignores sleep apnea* (assumed less severe per hierarchy).  
  - **Result**: **Rate for "male, 55–59, TIA"**.  
  - *Defensibility*: TIA is dominant risk; sleep apnea loading omitted due to lack of interaction data.  

  **Case 3**: 62F, cancer treated 20 years ago, no recurrence.  
  - *Step 1*: Narrow cell ("female, 60–64, cancer history") has high loading but is well-populated (e.g., 500 policies) → **meets threshold**.  
  - *But*: Ignores remission duration.  
  - *Procedure*: **Use narrow cell** → high loading.  
  - *Step 4/5*: **Handoff to human** (invoked via note in Step 5 for time-sensitive factors).  
    - Human assesses:  
      - Clinical guidelines (e.g., 20-year remission = standard risk).  
      - Business choice: Charge high loading (conservative) vs. broad class (competitive).  
  - **Result**: **Human decision required**. Procedure cannot override cell without data.  

  ---

  ### What the Procedure Cannot Decide  
  - **Novel interactions** (e.g., diabetes + sleep apnea): Relies on human judgment when no data exists.  
  - **Time-dependent risks** (e.g., cancer remission): Requires manual intervention unless modeled in cells.  
  - **"Fairness" trade-offs**: Choosing broad vs. narrow classes when both are imperfect is a *value choice* (e.g., protecting the pool vs. individual fairness).  

  **Defensibility to Regulators & Chief Underwriter**:  
  - **Strengths**:  
    - Documents every decision, avoiding arbitrariness.  
    - Uses actuarial standards (credibility weighting, thresholds).  
    - Explicit handoff points for human judgment.  
  - **Weaknesses**:  
    - Thresholds and hierarchy are company-specific.  
    - Does not eliminate all subjectivity (e.g., defining "most severe" risk).  
  - **Backup**: Historical pricing performance audits to validate outcomes.  

  **Timeframe**: <20 minutes using rate manual and claims data (Steps 1–4 automated; Step 5 rare).
