  ## The Inheritance Ultimatum: Binding Against Forgiveness

  **Scenario:** Eleanor, still raw from years of emotional neglect by her alcoholic mother, Rosalind, learns Rosalind is terminally ill and attempting reconciliation through Alcoholics Anonymous. Furious at what she perceives as manipulative "deathbed redemption," Eleanor fears her future self—softened by grief or societal pressure—might forgive Rosalind and grant her dying wish: a face-to-face meeting. To prevent this perceived moral capitulation, Eleanor leverages her position as sole executor of her late father’s complex estate. She drafts a codicil to the will, witnessed and legally binding, stating that if she initiates *any* contact with Rosalind beyond necessary medical updates before Rosalind’s death, her own inheritance share (a significant trust fund) is automatically forfeited and donated to a charity actively opposed to Rosalind’s political views. She then destroys Rosalind's sole written apology letter, physically removing the most potent trigger for empathy.

  **Analysis:**

  1.  **Standard Precommitment Theory View:**  
      Technically, this *is* a valid Ulysses contract. Eleanor identifies a future action (contact/forgiveness) she believes her future self might irrationally choose due to transient weakness (grief, guilt, or social pressure), despite her current "rational" judgment that forgiveness is morally wrong and capitulation. She credibly removes the option via a legally enforced financial penalty tied to a specific, verifiable action (initiating contact). The mechanism (legal codicil, financial forfeiture) is genuinely binding.

  2.  **Normative Limits View (e.g., Philosophers like Jon Elster or Daniel Dennett):**  
      Critics arguing for normative limits would contend this is an *illegitimate* use of precommitment. They hold that autonomy requires the capacity for moral growth and revision of values. Binding oneself *against* becoming a "better person" – understood here as developing greater compassion, overcoming justifiable resentment, or recognising genuine repentance – fundamentally undermines the core purpose of autonomy, which is authentic self-governance *over time*, including moral evolution. Eleanor isn't binding against weakness; she's binding against moral progress she currently fears and misunderstands. They might argue true autonomy cannot be exercised to permanently cripple one's future capacity for moral reasoning and emotional development.

  3.  **The Crucial Feature & Its Removal:**  
      **The crucial feature is the *genuine moral improvement* of the future self being blocked.** Eleanor isn't preventing herself from relapsing into a bad habit or making a cowardly choice. She is preventing herself from performing an action (forgiveness/reconciliation) that, in the future context (Rosalind's genuine repentance, Eleanor's potential processing of grief/anger), would constitute a *morally superior* act – overcoming justifiable anger through compassion, recognising change, or achieving personal peace.  
      **If Removed:** If Rosalind's "redemption" was demonstrably fake or manipulative, or if Eleanor's potential future forgiveness stemmed *only* from transient weakness/grief rather than a reasoned shift in values or recognition of facts, the scenario collapses back into a standard Ulysses contract. The binding would be against a foolish or weak action, not against becoming a morally better person. The moral ambiguity and potential for authentic growth in the future is what makes this scenario distinct and ethically troubling.

  **Key Takeaway for Your Novel:**  
  This scenario highlights the tragic irony and potential self-harm inherent in your protagonist's strategy. Her profound distrust extends beyond willpower to her *own capacity for moral evolution*. The binding isn't armour against weakness; it's a fortress against empathy and growth, potentially locking her into a cycle of justified but ultimately stagnant resentment, mistaking rigidity for strength. The "better person" she fears becoming is likely the one capable of greater peace.
