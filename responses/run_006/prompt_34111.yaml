prompt: |-
  I'm a novelist, and my current protagonist is someone who makes a lot of Ulysses contracts — she's constantly binding her future self because she doesn't trust her own resolve. I've got the standard cases down: she locks away the cigarettes, she tells her friends not to let her take back the guy she's breaking up with, that sort of thing. But I want to complicate it.

  Here's what I need: construct a thought experiment where a Ulysses contract is used to bind someone against future moral growth. By which I mean: the future self isn't weaker or more cowardly — she's actually becoming a better person, and the precommitment is designed to stop that from happening. The scenario has to be realistic (a family or workplace or community setting, no sci-fi), one paragraph, and the precommitment has to be genuinely binding in the usual sense — it credibly removes an option. The moral improvment has to be real, not just a change in taste or preference.

  After you've given me the scenario, walk me through it: what would standard precommitment theory say about wether this counts as a valid Ulysses contract? What would someone who thinks there are normative limits on precommitment say — someone who thinks you can't legitimately bind yourself against becoming a better person? Which feature of the scenario is doing the real work here, and if you removed it, would the whole thing collapse back into a standard case?

  And please write the answer in British English — I'm publishing in London.
