  Now dissecting the theoretical layers: standard precommitment theory would still validate this technically - it's a voluntary restriction of future options. But ethicists like Jon Elster would argue autonomy requires leaving room for moral evolution. The key is the "better person" aspect - remove that and it collapses into ordinary self-binding. 

