prompt: |-
  I'm a retired evolutionary ecologist, and after forty years thinking about fish populations and dominance hierarchies, Spinoza's claim that natural right is just power caught me immediately. Here's my problem. In the Theological-Political Treatise he says democracy is the most natural form of commonwealth, and that in a democracy everyone remains equal, as in the state of nature. I took this to mean he was giving a normative argument for egalitarian democracy: the natural condition is equality, and the best political order is the one that preserves that equality by giving everyone an equal say. But then when I read him more carefully he seems to define democracy just as the transfer of one's natural right to the majority of the community, not as a system of equal individual liberties, and he apparently is fine with all kinds of restrictions on who gets to be part of that majority. So it now looks like 'most natural' is doing a lot of work, and I can't tell if he's praising democracy or just classifying it. My question: if Spinoza thinks democracy is the most natural form of government because it preserves the equality of the state of nature, why doesn't that commit him to something like universal suffrage and equal political liberty? I suspect I've smuggled in a modern sense of equality that he doesn't share, but I can't see exactly where the equivocation is. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating the question.
