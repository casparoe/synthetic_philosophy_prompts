prompt: |-
  I keep meeting the slogan 'competence without comprehension' in arguments about minds and machines, and I cannot tell what it is actually claiming. It came up first in a debate about whether a large language model that could pass a medical licensing exam would thereby understand medicine; someone ended the debate by saying the model's performance is just competence without comprehension. Then I saw it in an essay on Darwin's inversion of reasoning, where natural selection is said to produce well-designed organisms with no designer who comprehends them, and again in a discussion of Turing's inversion, where a machine is said to do something intelligent-looking without insight. Please separate the precise theses that slogan could be expressing, from the trivial to the radical, say for each whether it is a platitude, a substantive and defensible claim, or something false, and say which reading the person in the medical-exam debate would need for the slogan to actually support dismissing the idea that the model understands medicine. Write your answer as continuous prose, the way you would write me an email or a letter, with no headings, no bullet points, no bold text, and no tables.
