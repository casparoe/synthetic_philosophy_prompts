  4. **Amnesia**: The drug erases Beauty's memory of any previous awakenings in the current experiment, so that each awakening is subjectively indistinguishable.
  5. **No Distinguishing Evidence**: Upon awakening, Beauty gains no new sensory evidence that would allow her to distinguish between the three possible centered states: (Heads, Monday), (Tails, Monday), and (Tails, Tuesday).
  6. **Awakening Guarantee**: On Sunday, Beauty knows that she will be awakened at least once (on Monday) and possibly twice (on Monday and Tuesday if Tails).
  7. **Objective Chance**: The coin toss is fair, and at the time of the toss, the objective chance of Heads is 1/2.
  8. **Monday Credence**: If, upon awakening, Beauty is informed that today is Monday, then her credence that the coin landed Heads should be 1/2.
  9. **Long-Run Frequency of Heads Awakenings**: Over many repetitions of the experiment, the fraction of awakenings that occur when the coin landed Heads is 1/3.
  10. **No Information Loss**: Beauty does not forget any information about the experimental setup between Sunday night and an awakening. The amnesia affects only her memory of events within the experiment.

  **Section 2: Disagreements**

  The parties disagree on the following points, as summarized in the table below.

  | Proposition | Halfer Position | Thirder Position |
  |-------------|-----------------|------------------|
  | 1. Beauty's credence upon awakening in the proposition that the coin landed Heads. | Beauty's credence should remain 1/2, as she gains no new relevant evidence to update her credence from Sunday night. | Beauty's credence should be 1/3, as the awakening event provides new evidence that favors Tails. |
  | 2. Does the awakening event provide new relevant evidence? | No. Beauty already knew on Sunday that she would experience an awakening. Therefore, the fact that she is currently experiencing one provides no new evidence about the coin outcome. | Yes. Beauty gains the evidence that she is currently in an awakening. This evidence is relevant because she is more likely to be experiencing an awakening under Tails (which has two awakenings) than under Heads (which has one). |
  | 3. Should Beauty's credence upon awakening equal the long-run frequency of Heads awakenings? | No. Credence should reflect the prior probability and the evidence. The frequency is an objective feature, but Beauty's evidence does not warrant a change from the prior of 1/2. | Yes. Given that Beauty is in an awakening and has no information to distinguish among the awakenings, she should assign equal credence to each possible awakening. Since only one out of three awakenings corresponds to Heads, her credence should be 1/3. |
  | 4. How should Beauty treat the two Tails awakenings? | The two Tails awakenings are not independent; they are both contingent on the same coin outcome (Tails). Therefore, they should not be treated as separate epistemic events for the purpose of updating the credence in the coin outcome. | Each awakening is a distinct epistemic situation. Beauty should assign equal probability to each possible awakening, leading to twice as much credence in Tails as in Heads. |
  | 5. Change in credence between Sunday and awakening. | Beauty's credence in Heads should not change between Sunday night and an awakening because she gains no new evidence that is relevant to the coin outcome. | Beauty's credence in Heads should change from 1/2 to 1/3 upon awakening because she gains new evidence (that she is currently in an awakening) that is more likely under Tails. |

  **Section 3: Cruxes**

  The following cruxes could, if resolved, undermine one of the positions:

  1. **Betting Behavior**: If Beauty is offered a bet on Heads upon every awakening that pays $1 if Heads and $0 otherwise, what is the fair price she should be willing to pay?
     - Halfer Prediction: The fair price is $0.50, reflecting a credence of 1/2.
     - Thirder Prediction: The fair price is $0.33, reflecting a credence of 1/3.
     - Test: In repeated experiments, if Beauty pays $X for the bet on every awakening, the expected profit per experiment is (1/2)*(1- X) + (1/2)*(-2X) = 1/2 - (3/2)X. Setting this to zero yields X=1/3. If it is accepted that the fair price is $1/3, then the halfer must either revise their credence or explain the divergence between credence and betting behavior.

  2. **Extreme Tails Awakenings**: Suppose that if Tails, Beauty is awakened a million times (with memory erasure), and if Heads, once. What should be her credence in Heads upon awakening?
     - Halfer Prediction: 1/2, because the coin is fair and she gains no new relevant evidence.
     - Thirder Prediction: Approximately 0, because there are a million Tails awakenings for every Heads awakening.
     - Test: Intuition pump: Beauty, upon awakening in this scenario, should reason that it is overwhelmingly likely that the coin landed Tails because she is much more likely to be in one of the Tails awakenings. If the halfer position is deemed counterintuitive in this case, it would be undermined.

  3. **Change Without New Uncentered Evidence**: Can Beauty's credence in an uncentered proposition (the coin outcome) change when she gains only self-locating evidence?
     - Halfer Assertion: No. The uncentered proposition about the coin is independent of self-locating information. Therefore, without new uncentered evidence, credence should remain the same.
     - Thirder Assertion: Yes. Self-locating evidence can be relevant to uncentered propositions when the evidence is correlated with the uncentered proposition via the experimental setup.
     - Test: Consider a variant where the coin is tossed after the first awakening. But that changes the setup. Alternatively, the disagreement rests on a fundamental principle of updating. If it is accepted that self-locating evidence can update credence in uncentered propositions, then the thirder view is supported; if not, the halfer view is supported.

  **Section 4: Verbal Dispute Assessment**

  The parties agree that the dispute is not merely verbal. Both sides are using "credence" to refer to the same epistemic attitude toward the same uncentered proposition: "the coin landed Heads". The disagreement is substantive and arises from differing views on:

  - Whether the fact of being in an awakening constitutes new evidence relevant to the coin outcome.
  - Whether self-locating uncertainty should affect credence in uncentered propositions.
  - The appropriate relationship between long-run frequencies and credence in the presence of self-locating uncertainty.

  Therefore, the disagreement is not due to a difference in the meaning of "credence" but to a deep epistemological divide about self-locating belief and evidence.

