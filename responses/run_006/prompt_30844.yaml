  1) The judgment is stable (revising objectively matters more)
  2) The choice is free (no coercion)
  3) The conflict isn't about time discounting - both outcomes are immediate

  Now, why does this break hyperbolic discounting? The model only works when choices involve immediate vs delayed rewards. Here, both actions have immediate consequences, so there's no temporal curve to apply. The student isn't overvaluing "now" - they're responding to moral urgency.

  But I should anticipate counterarguments. A hyperbolic discounting enthusiast might try to twist it by:
  - Claiming the friend's distress feels "more immediate" psychologically (but this stretches the model)
  - Suggesting future guilt avoidance (but that's not the primary motive)
  - Arguing it's actually preference reversal (but the student still believes revising is more important)

  The key is that akrasia here stems from different valuation systems clashing (moral impulse vs rational self-interest), not temporal distortion. This exposes hyperbolic discounting's limitation: it can't explain value conflicts without time elements.

  For the response structure, I'll:
  - Present the vivid scenario
  - Systematically break down each requirement
  - Show why temporal discounting doesn't apply
  - Refute potential counterarguments
  - Emphasize that not all akrasia is about time perception
answer: |-
  Here's a thought experiment designed to challenge hyperbolic discounting as a universal explanation for akrasia, grounded in everyday student life:

  **The Scenario: "The Sunday Essay Crisis"**  
  *Sophie, a diligent student, has a major essay due Monday at 9 AM. She’s finished drafting but knows her argument is weak. On Sunday evening, she judges that revising it thoroughly (X) is objectively better than going out (Y): it’s crucial for her GPA, aligns with her academic goals, and avoids future stress. She texts her friends: "Can’t come out, need to revise."*  

  *Minutes later, her closest friend calls in distress: her boyfriend just broke up with her, she’s alone and panicking, and begs Sophie to come over. Sophie feels intense empathy. She knows revising is *more important* — her friend has other supports, and the essay affects her future — but she chooses to comfort her friend (Y) for 4 hours, leaving no time for revisions. She feels guilty afterward but stands by her choice to prioritize her friend.*

  ---

  ### 1. **Why this is genuine akrasia (not preference reversal):**  
     - **Stable judgment**: Sophie never doubts that revising is *objectively better* for her goals (GPA, stress reduction). After helping her friend, she still believes this.  
     - **Free choice**: No coercion (e.g., her friend didn’t threaten her). She could have said, "I’ll call you after revising."  
     - **Regret/conflict**: She feels guilt, showing a mismatch between judgment and action.  
     - **No confusion**: She isn’t mistaken about facts (e.g., the deadline or her friend’s support network).  

  → This fits classic akrasia: clear, stable judgment for X, voluntary choice of Y.

  ---

  ### 2. **Why hyperbolic discounting struggles here:**  
  Hyperbolic discounting explains choices where **immediate rewards** (e.g., TikTok now) overpower **larger-but-delayed rewards** (e.g., good grades later). Here’s the breakdown:  
     - **Temporal asymmetry is missing**: Both outcomes are *immediate*:  
       - Revising → Future reward (good grade Monday) but **immediate cost** (effort now).  
       - Helping friend → **Immediate reward** (emotional relief, social bonding) but *future cost* (poor grade, stress Monday).  
     - **Discounting doesn’t apply**: Hyperbolic discounting compares *rewards* at different times. Here, the conflict is between:  
       - An *immediate emotional/moral impulse* (helping friend)  
       - A *delayed pragmatic reward* (good grades) **paired with an immediate pragmatic cost** (unpleasant work).  
     - **The curve "flatlines"**: Hyperbolic models predict heavy discounting of future rewards, but Sophie’s dilemma isn’t about *undervaluing Monday’s grade* — it’s about *overpowering a present cost* (revision) with a *different present reward* (helping).  

  → **What breaks?** Hyperbolic discounting only addresses **time-based reward trade-offs**. Here, the core conflict is **value incommensurability**: moral duty vs. self-interest, both with immediate weight.

  ---

  ### 3. **The feature that breaks the model:**  
  **The immediacy of conflicting values**. Sophie isn’t choosing a smaller-sooner reward *instead of* a larger-later one. She’s choosing between:  
     - **A "pragmatic" value system** (revising = investment in future self).  
     - **An "emotional/moral" value system** (helping = duty to others *now*).  
  These systems operate on different scales. Hyperbolic discounting only models trade-offs *within one system* (e.g., "self-interest over time"). It can’t handle clashes between *qualitatively distinct values* with no common currency (e.g., "friendship now" vs. "grades later").

  ---

  ### 4. **Devil’s Advocate: Can hyperbolic discounting be salvaged?**  
  *A proponent’s redescribe attempt:*  
  "Sophie *is* discounting the future! The guilt from abandoning her friend (immediate emotional pain) outweighs the delayed pain of a bad grade. The 'reward' of avoiding guilt is hyperbolically preferred because it’s immediate."  

  **Rebuttal — why this fails:**  
     - If avoiding guilt is the "reward," hyperbolic discounting predicts Sophie should *always* choose immediate guilt-avoidance over future gains. But this isn’t true: if the same friend called for a trivial reason (e.g., wanting to gossip), Sophie would revise. Her choice depends on the **moral weight** of the situation, not just timing.  
     - Hyperbolic discounting treats all rewards as fungible (e.g., quantifiable "utils"). Here, the values are **incommensurable**—Sophie isn’t trading "units of guilt" for "units of GPA"; she’s making a contextual ethical judgment.  
     - **Key flaw**: The model reduces morality to a "reward," ignoring that Sophie experiences helping as a *duty*, not a hedonic win. Duty often resists temporal discounting (e.g., we don’t "discount" saving a drowning person because it’s inconvenient now).  

  → The redescription *stretches* "reward" to cover morality, gutting the model’s predictive power. It can’t explain why Sophie’s akrasia only occurs in high-stakes moral contexts.

  ---

  **Conclusion**: This case shows akrasia can stem from **value-system conflicts**, not temporal myopia. Hyperbolic discounting excels at explaining procrastination (e.g., TikTok vs. studying) but falters when choices involve competing *types* of value (moral vs. pragmatic) with immediate stakes. For a complete psychology of akrasia, we need models that address **pluralistic valuation** — not just time.
