  We are going to design an information cascade game for 20 people. The goal is to have participants experience the cascade from the inside.

  ### Game Setup
  **Hidden State:** There are two possible states: A or B (e.g., "Red" and "Blue"). The facilitator randomly chooses the state at the beginning with equal probability (50-50).

  **Private Signals:** Each participant receives a private signal (a card or slip) that is informative but noisy. The signal accuracy is 70%. That means:
  - If the true state is A, then a signal "A" is given with 70% probability and "B" with 30%.
  - Similarly for true state B.

  **Materials:**
  - Two sets of cards/slips: one for state A and one for state B. For a group of 20, we will prepare:
    - For the true state A: 14 cards with "A" and 6 cards with "B".
    - For the true state B: 14 cards with "B" and 6 cards with "A".
    (This achieves 70% accuracy: 14/20 = 70%.)

  Alternatively, to avoid having to print two sets and choose one randomly, we can use a single deck of 40 cards: 
    - 20 cards for state A: 14 labeled "A" and 6 labeled "B".
    - 20 cards for state B: 14 labeled "B" and 6 labeled "A".

  But then we draw one of these 40 at random? That would not be right because we first choose the state and then the signals. Instead, we can:

  1. Choose the true state (A or B) by flipping a coin.
  2. Then, for that true state, we have 20 cards: 14 correct and 6 incorrect. Shuffle these 20 and hand one to each participant.

  But we need to prepare in advance. So we can pre-shuffle two sets (one for A and one for B) and then randomly pick one set to use.

  Alternatively, we can use a single deck of 40 cards: 20 for A (14A,6B) and 20 for B (14B,6A). Then we choose the true state by flipping a coin. If A, we use the 20 A-state cards (14A,6B); if B, we use the 20 B-state cards (14B,6A). Then shuffle the chosen 20 and hand out.

  **Gameplay:**
  1. Participants are seated in a line or a circle where the order is fixed (e.g., by numbering them 1 to 20). They must guess in order.
  2. Each participant, when called, will publicly announce their guess (A or B). They may also state their reasoning if you wish, but that might complicate things. Alternatively, just the guess to keep it moving.
  3. The goal for each participant is to guess the true state correctly. We will assign points: 1 point for a correct guess, 0 for incorrect.

  **Rules:**
  - Each participant sees the guesses of all previous participants (so the first person sees nothing, the second sees the first, the third sees the first two, etc.).
  - Each has their own private signal (the card they received).
  - They are to make a guess that they believe is most likely to be correct given their private signal and the history of public guesses.

  **Incentives:** We want them to try to maximize their own chance of being correct. We can offer a small prize for those who get it right (like candy) or just use points for bragging rights.

  **Points System:** Since we don't want real money, we can do:
  - Each correct guess: 1 point. Incorrect: 0.
  - At the end, we reveal the true state and each participant can see if they got it right.

  ### How the Cascade Should Unfold
  Ideally, after the first two or three people, if they happen to guess the same, then the next person may rationally ignore their own signal and follow the crowd. Then the cascade starts and continues until the end, even if the crowd is wrong.

  ### Debrief
  After the game, we reveal the true state and then explain the phenomenon. We map the events to the model:

  1. **Public vs. Private Information:** The history of guesses is public. Each person's card is private.
  2. **Bayesian Updating:** Each person updates their belief about the true state based on the entire history and their own signal. We can show the math for a few early players, then show how after two in a row, the third person might ignore their own signal (if it disagrees) because the probability that the first two are both wrong is lower than the noise in their own signal.
     - Example: Suppose the first two both guess A. What should the third do?
       - If the true state is A, the probability that the first two are correct: 0.7 * 0.7 = 0.49, and the probability they are both wrong (if state is B) is 0.3 * 0.3 = 0.09. But wait, we need to condition on the state.
