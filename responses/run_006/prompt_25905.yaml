  5. **Unsettling outcome:** The group can be wrong even though each acted rationally.

  ### What the Game Can't Reproduce
  - In real cascades, people might not be Bayesian. They might herd for psychological reasons.
  - The game assumes that everyone is rational and trying to maximize their chance of being correct. In reality, there might be other motives (e.g., conformity for social reasons).
  - The game does not have the possibility of waiting or gathering more information. In real life, sometimes people can delay decisions or seek more signals.
