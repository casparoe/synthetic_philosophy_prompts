prompt: |-
  You are a cognitive scientist who works on the language–thought interface. You are comfortable with the distinction between grammaticalized distinctions (obligatory and automatically encoded) and lexical ones (optional), and with the difference between perceptual or categorical tasks and amodal or epistemic tasks. Think carefully and brainstorm candidate rules before committing; do not settle for the first rule that fits.

  My colleague Dr. Mara Ellison studies whether the language a person speaks changes non-linguistic cognition — tasks using button presses or pointing, with no spoken or written response. Across six studies she has reached these verdicts:

  1. Grammatical aspect: speakers of a language whose verbs obligatorily mark whether an event is completed or ongoing were better than controls at remembering whether actions in short videos had been completed. Verdict: effect.
  2. Grammatical spatial frame: speakers of a language with no relative spatial vocabulary, in which spatial statements must use cardinal or geographic orientation, outperformed controls on a non-linguistic pointing task after being rotated. Verdict: effect.
  3. Grammatical noun class: speakers of a language in which every noun belongs to a noun class that adjectives and verbs must agree with sorted pictures of objects by similarity along class lines more than controls did. Verdict: effect.
  4. Lexical evidential vocabulary: speakers of a language with only optional words for marking information source, such as a particle meaning apparently or a construction meaning I heard it said, were no better than controls at a non-linguistic source-memory task in which they judged whether they had directly seen or only inferred each test item. Verdict: no effect.
  5. Lexical causal vocabulary: speakers of a language with optional causal connectives but no grammatical marking of causation were no better than controls at non-linguistic causal judgments about launching-event animations. Verdict: no effect.
  6. Lexical mental-state vocabulary: speakers of a language with optional mental-state words but no obligatory marking showed no advantage on a non-linguistic false-belief task. Verdict: no effect.

  She is now planning a seventh study: the same non-linguistic source-memory task as study 4, but with speakers of a language that grammatically requires evidential marking on every clause — direct, inferred, or reported. The task includes verbal shadowing to block silent labeling.

  I want to know what to expect her to predict. I am less interested in the bare prediction than in the rule or rules she seems to be running, the other rules that fit her six verdicts equally well, and which further study would best settle which rule she is actually committed to.

  Please answer as a numbered list with exactly five items, each one or two sentences, with no introduction and no conclusion. Use these five items:
  1. State the two or three most plausible rules consistent with all six of her verdicts, and mention any further rule-family that also fits.
  2. For each rule, say what it predicts about the seventh study.
  3. Give your best prediction for the seventh study, with the reasons for preferring that rule, and say honestly how much her track record underdetermines the prediction.
  4. Identify the closest analog among her first six studies and explain why it is not decisive.
  5. Propose the single further study that would most cleanly discriminate between the rules, and state what each rule predicts for it.
reasoning: |-
  Hmm, the user is asking me to step into the role of a cognitive scientist specializing in the language-thought interface. They've presented a scenario involving their colleague Dr. Mara Ellison's research on linguistic relativity, specifically whether grammaticalized versus lexical distinctions in language affect non-linguistic cognition. Dr. Ellison has conducted six studies with clear outcomes, and now she's planning a seventh study on grammatical evidential marking. The user wants me to analyze the underlying rules behind these findings, predict the seventh study's outcome, and suggest how to resolve ambiguities.

  Looking at the six studies, there's a clear pattern: studies 1-3 show effects where grammatical distinctions (aspect, spatial frames, noun classes) influence cognition, while studies 4-6 show no effects for lexical distinctions (evidentials, causation, mental states). This suggests a rule where obligatory grammatical marking shapes cognition, but optional lexical items don't. However, I need to consider if other rules could explain this pattern equally well.

  One alternative rule could be about task modality: grammatical effects might appear only in perceptual or categorical tasks (like those in studies 1-3), while lexical effects fail in amodal or epistemic tasks (studies 4-6). But study 3 involved sorting by similarity, which isn't purely perceptual, and study 2 was spatial after rotation, which has an epistemic component. This makes the modality rule messy. Another possibility is a salience rule: grammatical markers are more automatic and thus more likely to affect cognition. But salience is vague and hard to test independently.

  For the seventh study—grammatical evidentials in source memory with verbal shadowing—the core rule predicts an effect because it's grammatical and obligatory. The modality rule might predict no effect since source memory is epistemic, not perceptual. But Dr. Ellison's track record shows grammatical effects even in somewhat epistemic tasks, like the spatial rotation in study 2. So, I think the core rule is more consistent. Still, the prediction isn't certain; her results are underdetermined because study 6 had a false-belief task, which is epistemic and showed no effect for lexical marking, but grammatical evidentials weren't tested there.

  The closest analog is study 4, which tested lexical evidentials in source memory and found no effect. But it's not decisive for the seventh study because grammatical versus lexical is the key difference, not the task itself. To cleanly discriminate, I'd propose a study on grammatical causation: if a language has obligatory marking of causation (unlike study 5's lexical version), the core rule predicts an effect on causal judgments, while the modality rule might predict no effect if causation is seen as amodal. This would isolate the grammatical factor in an epistemic domain.

  I'll structure my response exactly as requested: five numbered items covering plausible rules, predictions for the seventh study, my best prediction with reasons, the closest analog, and a proposed further study. I'll be concise and avoid intros or conclusions. My prediction leans toward an effect for the seventh study based on the grammaticality pattern, but I'll acknowledge the uncertainty honestly.
answer: |-
  1. The core plausible rule: grammaticalized (obligatory) distinctions affect non-linguistic cognition, while lexical (optional) distinctions do not. An alternative rule: distinctions affecting perceptual/categorical processing (aspect, space, object classes) have effects, while those involving amodal/epistemic reasoning (source, causation, belief) do not; a family of rules based on processing automaticity or cognitive penetrability also fits all six.
  2. The core rule predicts an *effect* for study 7 (grammatical evidentials). The alternative rule predicts *no effect* (as source memory is epistemic).
  3. Predict an *effect* for study 7; the core rule is more parsimonious with the successful grammatical effects (studies 1-3, including noun class which isn't purely perceptual) and the consistent failure of lexical distinctions. Her track record underdetermines this significantly, as grammatical evidentials test an epistemic domain where previous effects are absent.
  4. Study 4 (lexical evidentials) is the closest analog in task (source memory), but it tests lexical marking, not grammatical marking; it cannot distinguish whether the previous null effect was due to the linguistic type (lexical) or the cognitive domain (epistemic).
  5. Propose a study on *grammatical causation* (obligatory marking on verbs) using the same non-linguistic causal judgment task as study 5. The core rule predicts an *effect*. The alternative rule (domain-based) predicts *no effect* (causation is amodal/epistemic).
