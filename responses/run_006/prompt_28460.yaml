  I remember that some philosophers treat these as separate issues. The raven paradox is about irrelevant evidence; how does a red apple relate to ravens? The grue paradox is about predicate choice; why is "green" better than "grue"? 

  Bayesian solutions for the raven paradox focus on prior probabilities. A red apple has such a low probability of affecting the raven hypothesis that its confirmation is minuscule. But does that help with grue? Probably not because grue challenges what predicates we can use in induction. Even with Bayesian updates, if you start with "grue" as a valid predicate, the evidence supports it just as much as "green." So you need a way to rule out grue-like predicates beforehand, which is where projectibility comes in.

  Goodman introduced projectible predicates to exclude those that are time-dependent or disjunctive. So solving grue requires this extra step, which isn't needed for the raven paradox. That suggests they're different problems. The raven is about evidential relevance, while grue is about language and predicate legitimacy in inductive reasoning.

