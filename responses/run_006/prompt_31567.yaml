prompt: |-
  I'm a software engineer and I dont have any formal philosophy training, but I've been reading around metaethics in my spare time and one thing keeps bugging me. The expressivist idea seems elegant: when I say "stealing is wrong" I'm not reporting a fact, I'm doing something like booing stealing or expressing an attitude. That would explain why moral talk feels so tied to motivation and why it's so weird to ask what moral facts are made of. But I can't make the logic work.

  I'd like to practice attacking the expressivist side while you defend it. Please play a committed, sophisticated expressivist who thinks the embedding problem is solvable — sharp, not a strawman, willing to concede small points but not the core claim that moral judgments are attitude-expressions rather than factual reports. You can appeal to whatever machinery you think works, but don't dodge the point about modus ponens. Stay in character until I say stop, and keep replies to about a paragraph.

  Here's my opening. Take "stealing is wrong" and "if stealing is wrong, then getting your little brother to steal is wrong." In the first sentence the speaker is expressing disapproval of stealing. In the antecedent of the second sentence she isn't expressing disapproval of stealing — she might be agnostic, or a parent explaining a chain of reasoning to a kid. If "wrong" means something different in those two spots, then modus ponens should fail, because the middle term is ambiguous; if it means the same thing, then its meaning can't be the attitude expressed, since no attitude is expressed in the antecedent. So how does your view even get basic moral arguments to compile?
reasoning: |-
  Okay, the user is a software engineer diving into metaethics without formal training, particularly troubled by expressivism's handling of logical structures like modus ponens. They want me to defend expressivism robustly, focusing on embedding problems while staying in character as a committed expressivist. 

  Hmm, their core challenge is sharp: if moral language expresses attitudes in simple claims but seems neutral in conditionals, how can modus ponens work without equivocation? They’re clearly grappling with the Frege-Geach problem—a classic hurdle for expressivists. 

  As a sophisticated expressivist, I need to tackle this head-on without dodging. Blackburn’s quasi-realism comes to mind: we should explain embeddings not as propositions but as expressions of higher-order attitudes. For "if stealing is wrong...", the speaker isn’t approving/disapproving theft but expressing a *commitment* to disapprove of brother-stealing *if* they ever disapprove of stealing. This preserves logical validity because the inference relies on consistency in the speaker’s own attitudes. 

  The user’s software analogy helps—they’ll appreciate framing this as "compiling" via consistency constraints on attitude structures. I’ll concede that surface grammar mimics realism, but insist the underlying machinery is attitudinal. Their frustration is valid (early expressivism *did* stumble here!), but modern solutions exist. Gotta keep it to one punchy paragraph though—no tangents! 

  ...Wait, did they imply they’ve read Blackburn? If not, name-dropping "quasi-realism" might confuse. Better show the mechanism plainly: conditionals express *rules* for attitudes, not attitudes directly. The modus ponens works because rejecting the conclusion while accepting premises would violate your own normative commitments. That’s the "logic" of attitudes. 

  *Pause*—should I flag that this shifts "meaning" from psychology to inferential role? Maybe later if they press. For now, anchor in their example: the parent’s antecedent isn’t inert; it’s scaffolding for coherent disapproval. If the kid says "but stealing *is* wrong," the parent can’t consistently endorse getting brother to steal. Bam: moral modus ponens without facts. 

  *Sharp breath*. User’s smart—they’ll spot if this feels ad hoc. Emphasize that this isn’t special pleading; it’s how *all* normative conditionals work ("if you want X, do Y"). Their engineer mind will crave systematicity. Okay, reply locked in: attitude-expression isn’t discarded in embeddings; it’s recursively structured.
answer: |-
  Ah, the embedding problem—a serious challenge, but not fatal! Let me channel my inner Blackburn. You're right that in the atomic claim "stealing is wrong," I express disapproval of stealing. But in the conditional "**if** stealing is wrong, then getting your little brother to steal is wrong," I'm not expressing that attitude. Instead, I'm expressing a *higher-order attitude*: a commitment to disapproving of getting your little brother to steal **whenever** I disapprove of stealing itself.  

  Think of it like a function in your code: the antecedent sets up a hypothetical input ("if I ever have disapproval-state S for stealing..."), and the consequent defines the output ("...I must have disapproval-state S* for getting your brother to steal"). Modus ponens works because accepting both premises binds you to consistency in your own attitudes. If you affirm the conditional, you've committed to disapproving of brother-stealing *if* you ever disapprove of stealing. Then, when you assert "stealing is wrong," you trigger that commitment. Denying the conclusion ("brother-stealing is fine") while accepting the premises isn't just invalid—it's a *practical inconsistency* in your normative stance.  

  The meaning of "wrong" isn't ambiguous; it's contextually complex. In atomic contexts, it directly expresses disapproval. In embeddings, it signals the *role* that disapproval plays in a larger structure of attitudes. Quasi-realism builds logic atop this by tracking the constraints on rational attitude-expression. Your turn—attack away.  

