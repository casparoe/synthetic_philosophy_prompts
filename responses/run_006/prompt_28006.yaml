answer: |-
  Below is a comprehensive reviewer rubric designed to address the adaptationist pitfall you describe, grounded explicitly in the Gould-Lewontin critiques. The procedure prioritizes **falsifiability** and **alternative-testing**, with early rejection gates for papers failing basic burdens. Steps tied to specific spandrels critiques are flagged (**SL#**). Judgment calls are marked with ⚖️.

  ---

  ### **Reviewer Rubric: Evaluating Adaptation Claims**  
  *Apply sequentially; reject or major revision if a step fails. "Sufficient" answers actively rule out key alternatives; "superficial" answers note them passively.*

  1.  **STEP 0: Define Trait (T) and Function (F) Precisely**  
      *Purpose: Prevent "atomization" (SL1) and vague hypotheses.*  
      - **Sufficient:** T is unambiguously measurable, discrete, or modular; F is a specific, testable selective pressure (e.g., "bite force during nut-cracking," not "improved feeding").  
      - **Superficial:** T is broadly defined (e.g., "body size"); F is generic (e.g., "fitness advantage").  
      - **Failure:** Fatal if T/F are too vague to test.  
      - **Judgment:** ⚖️ (Is F biologically plausible? SL1 relevance).  

  2.  **STEP 1: Demonstrate Trait Variability and Heritability**  
      *Purpose: Challenge atomized optimality (SL1); if T lacks variation/heritability, adaptation is untestable.*  
      - **Sufficient:** Data shows T varies in relevant populations *and* evidence for heritability (e.g., QTL, parent-offspring regression, common-garden experiments).  
      - **Superficial:** Cites variation in *other* species; assumes heritability without evidence.  
      - **Failure:** Fatal if no variation/heritability data. Irredeemable without new experiments.  
      - **SL Link:** SL1 (non-atomic traits may lack independent heritability).  

  3.  **STEP 2: Establish Current Utility for F**  
      *Purpose: Separate current function from historical origin (SL3).*  
      - **Sufficient:** Experimental/manipulative evidence that T *causally* affects performance of F (e.g., ablation experiments, biomechanical models with validation).  
      - **Superficial:** Correlative data (e.g., "birds with longer beaks eat bigger seeds"); inferred function from morphology alone.  
      - **Failure:** Not fatal. Can be addressed with revisions/new data (e.g., propose biomechanics experiments).  
      - **Judgment:** ⚖️ (Could correlation reflect a spandrel? SL3).  

  4.  **STEP 3: Rule Out Non-Adaptive Alternatives**  
      *Purpose: Address drift, constraints, exaptation (SL2, SL4).*  
      - **Sufficient:** Tests ≥2 major alternatives:  
        - **Drift/null models:** Neutral evolution simulations; phylogenetic inertia tests (e.g., Blomberg's K).  
        - **Constraints:** Allometry (SL4); developmental/genetic pathways (SL2) (e.g., "T scales with body size"; "CRISPR knockout shows T is pleiotropic byproduct").  
        - **Exaptation:** Fossil/ancestral state reconstruction showing T predates F.  
      - **Superficial:** Mentions alternatives in discussion but provides no data; only uses "consistency" with adaptation.  
      - **Failure:** **Fatal if no data** targeting alternatives. Major revision if tests are weak (e.g., incomplete models).  
      - **SL Link:** SL2 (constraints), SL4 (allometry/drift).  

  5.  **STEP 4: Test Adaptation Hypothesis Against Alternatives**  
      *Purpose: General scientific burden (not SL-specific).*  
      - **Sufficient:** Compares fit of adaptive model vs. alternatives (e.g., AIC scores; experimental manipulation of F alters fitness; phylogenetic paired contrasts *with* null models).  
      - **Superficial:** Presents evidence *for* adaptation but no *comparative* test (e.g., "our path analysis supports adaptation").  
      - **Failure:** Major revision. Rarely fatal alone if prior steps pass.  
      - **Judgment:** ⚖️ (Are alternative models well-constructed?).  

  6.  **FINAL STEP: Assess "Adaptation" Claim Scope**  
      *Purpose: Prevent overstatement (SL3).*  
      - **Sufficient:** Concludes "T is *currently adaptive* for F" or "T likely evolved *via* selection for F" *only if* Steps 3–4 ruled out key alternatives.  
      - **Failure:** Reject/major revision if paper claims "T is an adaptation for F" without addressing constraints/drift (SL2, SL4) or conflates current utility with origin (SL3).  

  ---

  ### **Applying the Rubric to Hypothetical Submissions**  

  **Submission 1: Human chin as mechanical reinforcement against masticatory stress**  
  - *Summary:* Comparative biomechanics paper. CT scans show chins resist deformation during simulated biting. Finite-element analysis supports reinforcement. Cites chin absence in other hominins.  
  - **Step 0:** Pass (T=chin prominence; F=stress resistance).  
  - **Step 1:** **FATAL FAILURE.** No data on chin variation/heritability in humans or hominins. Superficial citation of primate mandible variation. *Reject:* Without heritability, adaptation is untestable (SL1).  
  - **Why authors won't like it:** The paper relies on biomechanical "consistency" but fails at the first hurdle. Chin evolution is notoriously contentious due to potential constraints (e.g., facial retraction allometry)—ignoring this is fatal.  

  **Submission 2: Bird song variant as honest signal of condition in mate choice**  
  - *Summary:* Field experiment. Males with variant "X" have higher parasite resistance. Playback shows females prefer X. X is costlier to produce (oxygen consumption).  
  - **Step 0:** Pass (T=song variant X; F=honest signaling).  
  - **Step 1:** Pass (song variation/heritability well-established).  
  - **Step 2:** Sufficient (playback shows current utility; costly signaling supported).  
  - **Step 3:** **MAJOR REVISION.** Tests drift (no phylogenetic signal) but neglects constraints (e.g., is X a byproduct of syrinx anatomy?) and exaptation (e.g., did X originate for territorial defense?).  
  - **Step 4:** Pass (fitness advantage shown; alternatives noted but not tested).  
  - **Verdict:** Major revision. Strengths in Steps 2/4 undermined by Step 3 gaps. Authors must address constraint pathways (e.g., vocal tract development) and exaptation (e.g., ancestral function).  

  **Submission 3: Panda's thumb as adaptation for bamboo stripping (against Gould)**  
  - *Summary:* Rejects "constraint" argument. Kinematic analysis shows the radial sesamoid (RS) is optimized for stripping. RS growth rate matches bamboo toughness. Fossil ursids show RS enlargement correlating with bamboo diets.  
  - **Step 0:** Pass (T=RS size/shape; F=bamboo stripping).  
  - **Step 1:** Pass (RS variation in pandas/fossils; QTL study cited).  
  - **Step 2:** Sufficient (kinematics support current utility).  
  - **Step 3:** **FATAL FAILURE.** Dismisses constraints superficially: no allometric analysis (SL4); no test of whether RS is a developmental byproduct of carpal structure (SL2). Fossil "correlation" ≠ ruling out exaptation.  
  - **Step 4:** Pass (optimization data vs. other ursids).  
  - **Verdict:** Reject. Fails Step 3 by not seriously engaging Gould’s core constraint argument. Paper conflates *current optimization* with *historical origin* (SL3) and ignores that exaptations *can* be optimized later. Authors’ dislike is predictable—but rubric enforces burden-shifting Gould/Lewontin demanded.  

  ---

  ### **Where the Rubric Systematically Misfires**  
  1. **Blind to Cryptic Adaptations:** Traits with no current variation (e.g., fixed in clade) or unmeasurable heritability (e.g., extinct taxa) cannot pass Step 1. This unfairly penalizes paleobiology or molecular clock studies.  
  2. **Underweights Manipulative Experiments:** Step 4 prioritizes comparative tests over experiments. A flawless lab demonstration of selection (e.g., microbial evolution) might struggle if alternatives aren't phylogenetically tested.  
  3. **Biased Against Microevolution:** Rapid adaptations (e.g., pesticide resistance) may skip constraint tests (Step 3) if development is simple. Rubric may demand unnecessary tests.  
  4. **Neglects Gene-Level Adaptations:** For molecular traits (e.g., enzyme kinetics), structural constraints (Step 3) may be irrelevant. Rubric overgeneralizes organismal critiques.  
  5. **Co-option Blind Spot:** Exaptations co-opted for novel functions *can* be "adaptations" sensu lato. Rubric’s Step 3 exaptation test may be too strict.  
  6. **Bias Toward Null Hypotheses:** By privileging alternatives (drift/constraints), the rubric risks rejecting true adaptive stories with limited data. This could shift literature away from adaptationist hypotheses, even when justified.  

  **Recommendation:** Use this rubric as a **baseline checklist**, but allow override for papers with exceptional evidence in one domain (e.g., definitive experimental selection) or traits where specific alternatives are biologically implausible. Pair it with reviewer training to contextualize judgment calls (⚖️). This balances scientific rigor with flexibility—precisely the editorial intervention you seek.
