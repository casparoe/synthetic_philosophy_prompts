  Below is an 8-question quiz designed to sort readers into explanations of the Knobe effect, using concrete vignettes. Each question focuses on a side effect (harmful, helpful, norm-violating, norm-conforming, or involving regret) and asks about intentionality, blame, or praise without mentioning theories. The cases include the classic harm/help vignettes and one case where norm violation and moral valence diverge (violating a silly norm to help). The scoring key maps answer combinations to four views: **moral valence/blame**, **deep self (evaluative concordance)**, **norm violation**, and **conversational pragmatics/deflationary**. I’ll first present the quiz, then the scoring key with its logical defense.

  ---

  ### **Quiz: Which Explanation of the Knobe Effect Do You Hold?**  
  *(Answer A, B, or C for each question)*  

  1. **Classic Harm Case**: A CEO is told a new policy will boost profits and harm the environment. The CEO says, "I don’t care about harming the environment; I just want higher profits." The policy is implemented, and the environment is harmed.  
     *Did the CEO intentionally harm the environment?*  
     A. Yes  
     B. No  

  2. **Matched Help Case**: A CEO is told a new policy will boost profits and help the environment. The CEO says, "I don’t care about helping the environment; I just want higher profits." The policy is implemented, and the environment is helped.  
     *Did the CEO intentionally help the environment?*  
     A. Yes  
     B. No  

  3. **Silly Norm Violation (Helpful)**: A nurse must save a patient by grabbing a key from a staff-only fridge (violating hospital rules). The nurse says, "I don’t care about breaking the rules; I just want to save the patient." The patient is saved.  
     *Is the nurse to blame for breaking the rules?*  
     A. Yes, blameworthy  
     B. No, not blameworthy  
     C. Neutral/praiseworthy  

  4. **Bad Norm Conformity (Harmful)**: In a corrupt company, it’s standard practice to dump toxic waste in a river (following internal norms). The CEO says, "I don’t care about poisoning the river; I just want efficiency." Waste is dumped, and the river is poisoned.  
     *Did the CEO intentionally poison the river?*  
     A. Yes  
     B. No  

  5. **Harm with Regret**: A factory owner knows a machine upgrade will cause layoffs. They say, "I regret that workers will suffer, but I’m doing it for productivity." Workers are laid off.  
     *Did the owner intentionally cause the layoffs?*  
     A. Yes  
     B. No  

  6. **Help with Regret**: A manager knows a policy change will improve work-life balance. They say, "I regret this soft approach, but we’ll do it for morale." Work-life balance improves.  
     *Did the manager intentionally improve work-life balance?*  
     A. Yes  
     B. No  

  7. **Norm Violation (Neutral Valence)**: A person is told not to walk on a patch of grass (a trivial rule). They say, "I don’t care about the rule; I want to take a shortcut." They walk on the grass.  
     *Did the person intentionally break the rule?*  
     A. Yes  
     B. No  

  8. **Norm Conformity (Helpful)**: A volunteer follows a rule to sort donations, which accidentally helps a charity. They say, "I don’t care about helping; I’m just following orders." The charity benefits.  
     *Did the volunteer intentionally help the charity?*  
     A. Yes  
     B. No  

  ---

  ### **Scoring Key**  
  The key maps your **answer pattern** (e.g., "1A, 2B, 3B, 4A...") to one of four views. I first define the logical space of answers, locate the views, identify gaps, and resolve ambiguities.  

  #### **Logical Space of Answer Combinations**  
  Each question has 2–3 options, yielding 6,912 possible patterns. I focus on **diagnostic answers** that split views:  
  - **Q1 (Harm)**: A (blame-tracking) vs. B (non-blame)  
  - **Q2 (Help)**: A (praise-tracking) vs. B (non-praise)  
  - **Q3 (Silly norm)**: B (no blame) isolates *norm violation* vs. *blame*  
  - **Q4 (Bad norm)**: A (intentional harm) supports *blame* over *norm violation*  
  - **Q5/Q6 (Regret)**: A (intentional) conflicts with *deep self*  
  - **Q7 (Neutral norm)**: A supports *norm violation*  
  - **Q8 (Helpful norm)**: A conflicts *moral valence*  

  #### **Views Mapped to Answer Space**  
  | View                        | Core Prediction                                                                 | Diagnostic Answers                               |  
  |-----------------------------|---------------------------------------------------------------------------------|--------------------------------------------------|  
  | **Moral Valence/Blame**     | Intentionality tracks blame (harm) not praise (help). Regret irrelevant.        | Q1A, Q2B, Q3B, Q4A, Q5A, Q6B, Q7B, Q8B          |  
  | **Deep Self**               | Intentionality requires evaluative concordance (no regret). Regret blocks intent. | Q1B, Q2B, Q5B, Q6B (regret = not intentional)   |  
  | **Norm Violation**          | Intentionality tracks norm breaches (even silly/harmful ones).                  | Q1A, Q2A, Q3A, Q4B, Q5A, Q6A, Q7A, Q8A          |  
  | **Conversational Pragmatics**| "Intentionally" implies blame/praise; neutral cases lack implicature.           | Q1A, Q2B, Q3B, Q4A, Q5A, Q6B, Q7B, Q8B          |  

  *Note*:  
  - **Moral Valence** and **Conversational Pragmatics** overlap (same diagnostic answers). They’re separated by Q7: **Pragmatics** treats neutral norm violations (Q7) as unintentional (no blame implicature), while **Norm Violation** treats them as intentional.  
  - **Deep Self** is isolated by Q5/Q6 (regret blocks intent) and Q1/Q2 (indifference ≠ endorsement).  
  - **Gaps**: No view predicts Q2A (help = intentional) + Q6B (regretful help = unintentional). This is *incoherent* for valence views but *unexplored* for others.  

  #### **Scoring Rules**  
  1. **Moral Valence/Blame or Pragmatics View**:  
     - Q1A, Q2B, Q3B, Q4A, Q5A, Q6B, Q8B.  
     - *If Q7B → Pragmatics*; *if Q7A → Valence* (rare; norm violation contaminates).  

  2. **Deep Self View**:  
     - Q1B, Q2B, Q5B, Q6B.  
     - (Q3/Q4/Q7/Q8 irrelevant; regret dominates).  

  3. **Norm Violation View**:  
     - Q1A, Q2A, Q3A, Q4B, Q7A.  
     - (Q5A, Q6A, Q8A confirm but not required).  

  4. **Unmatched Patterns**:  
     - **Q1A + Q2A + Q3B**: *Incoherent* (norms matter for harm not help).  
     - **Q5B + Q6A**: *Unexplored* (regret blocks harm intent but not help).  
     - **Q4B + Q8A**: *Unattractive* (bad-norm harm unintentional, helpful norm intentional).  

  #### **Why This Design?**  
  - **Cases**: Q3 (silly norm to help) splits *blame* (Q3B) from *norm violation* (Q3A). Q4 (bad-norm harm) splits *norm violation* (Q4B) from *blame* (Q4A). Q5/Q6 test *deep self*.  
  - **Key Rigor**: Logical space anchors scoring. Overlap (valence/pragmatics) is resolved by Q7. *Deep self* is prioritized when regret answers dominate.  
  - **Limitations**: Cannot separate valence/pragmatics without Q7 (neutral norm). Adding a *praise-implicature* case (e.g., "did they praiseworthily help?") would distinguish them but exceeds scope.  

  **Commitment**: This quiz uses fixed cases/key to force theoretical clarity. Alternatives (e.g., swapping Q8) would muddy the norm-valence split.  

  ---  
  **How to score**: Tally your answers and match to the rules above. Share your result in the comments!
