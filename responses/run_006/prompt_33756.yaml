answer: |-
  Your intuition about the debate's structural impasse is astute—this isn't just pedagogical friction but a philosophical fault line. The Peirce-James dispute resists resolution because it involves **multiple, entangled layers of disagreement** that demand unpacking. Below is a diagnosis and a path forward for your seminar:

  ---

  ### **Diagnosis: Four Interlocking Dimensions of Disagreement**
  1.  **Metaphysical vs. Practical Projects**  
      - **Peirce** offers a *metaphysical account* of truth as a regulative ideal governing inquiry itself. Truth is the "fated" convergence point of indefinite scientific investigation. It's descriptive of how inquiry *must* function to be rational.  
      - **James** offers a *practical account* of truth as *warranted assertibility* for agents. Truth is what proves "expedient" for navigating life, including moral, religious, or existential domains.  
      *→ Conflict*: They answer different questions: "What is the *telos* of inquiry?" vs. "What should I *live by*?"

  2.  **Semantic Ambiguity in "Pragmatism"**  
      Both use "pragmatism" but operationalize it differently:  
      - **Peirce**: Pragmatism is a *logical maxim* for clarifying concepts via experimental consequences. Truth is defined via long-term communal verification.  
      - **James**: Pragmatism is a *method for evaluating beliefs* by their practical "cash value." Truth is tethered to immediate experiential payoffs.  
      *→ Conflict*: "Pragmatic meaning" is stretched across concept-clarification (Peirce) and belief-justification (James).

  3.  **Temperamental Incommensurability**  
      - **Peirce's Temperament**: Scientific rigorist. Fears solipsism; prioritizes method over outcome. His "community of inquiry" is impersonal and infinite.  
      - **James's Temperament**: Humanist pluralist. Fears epistemic barrenness; prioritizes lived experience. His "believer" is concrete and finite.  
      *→ Conflict*: Peirce sees James as sacrificing objectivity; James sees Peirce as ignoring human stakes.

  4.  **Criterion vs. Nature**  
      - **Peirceans** accuse James of conflating *tests for truth* (e.g., utility) with its *definition*.  
      - **Jamesians** retort that Peirce’s "ideal limit" is empty without criteria for progress *now*.  
      *→ Stalemate*: James’s "criterion-first" approach and Peirce’s "definition-first" approach talk past each other.

  ---

  ### **What Would Settle the Matter? Reframing Progress**
  Resolution requires acknowledging **complementarity, not victor**. Progress looks like:

  1.  **A Foundational Distinction**:  
      Introduce **"Truth as Ideal Convergence" (Peirce) vs. "Warrant for Action" (James)**.  
      - *Peirce* describes truth as the *horizon* of inquiry.  
      - *James* describes when beliefs are *licensed* for practical commitment.  
      → This distinguishes *semantic/metaphysical* truth (Peirce) from *doxastic justification* (James).

  2.  **Formal/Logical Tools**:  
      Use **Carnap’s "Framework Relativity"** or **Brandom’s deontic scorekeeping**:  
      - Peirce’s truth operates in the "framework of scientific inquiry."  
      - James’s truth operates in "contexts of agential need."  
      → Neither is "wrong"; they excel in different domains.

  3.  **Empirical Grounding**:  
      Analyze **case studies** exposing limitations of each:  
      - *Against Peirce*: How does his "ideal limit" handle morally urgent beliefs (e.g., "Slavery is wrong") that can’t wait for convergence?  
      - *Against James*: Can "expediency" prevent epistemic bad faith (e.g., comfortable delusions)?  
      → Shows both accounts need supplementation.

  4.  **Genealogical Insight**:  
      Trace how their contexts shaped their priorities:  
      - *Peirce*: Logician working on scientific methodology; reacting against Cartesian individualism.  
      - *James*: Psychologist addressing crises of faith/agency; reacting against scientistic absolutism.  
      → Reveals why their "truth" serves different purposes.

  ---

  ### **Classroom Strategy: From Impasse to Insight**
  1. **Reframe the Goal**:  
     Shift from "Who wins?" to "What work does each account do?" Have students map domains where each excels (e.g., science for Peirce; ethics for James).

  2. **Deploy the Distinction**:  
     Assign a paper: *"When is 'truth' a Peircean question? When is it a Jamesian one?"*  

  3. **Test Limits with Cases**:  
     Debate: *"Would James call a placebo's efficacy 'true'? Would Peirce? Should they?"*  

  4. **Bridge with Later Pragmatists**:  
     Use **Dewey** (warranted assertibility as contextual) or **Rorty** (truth as compliment to beliefs that endure) to show syntheses.

  ---

  ### **Conclusion: Why the Impasse Persists**
  **This is not a substantive metaphysical dispute resolvable by argument, nor a mere verbal confusion. It is a clash of philosophical projects rooted in divergent conceptions of rationality itself.** Peirce’s account is *inquiry-centric*; James’s is *agent-centric*. Progress comes by seeing them as complementary tools—one for stabilizing knowledge across time, the other for navigating life in the present. The "settlement" is realizing that pragmatism, at its best, needs both. Your students’ persistent division may reflect their own latent affinities for either the scientific or humanistic temperament—and that’s where the real learning begins.
