  The divergence arises because the indicative conditional is evaluated relative to the speaker's context set, which includes worlds where the gas is available (because she doesn't know it's out). The counterfactual is evaluated from the actual world, where the gas is out, and this fact is held fixed in the closest p-world.

  **What feature is doing the work?**
  The key feature is the speaker's ignorance about a relevant background condition (the gas outage) that affects the consequent. In the indicative evaluation, that condition is not fixed (so it can vary in the context set), while in the counterfactual evaluation, the actual background condition (gas outage) is held fixed.

