answer: |-
  ### Thought Experiment: Toaster and Gas Stove  
  Anna's toaster didn't work when she tried it this morning. She doesn’t know why—it might be broken, or it could just be a loose plug. Unbeknownst to her, the real issue is that her gas supply is unexpectedly empty (e.g., due to a leak), rendering her gas stove inoperable. The toaster itself is actually functional, but Anna hasn’t checked the gas yet. She remarks: "**If the toaster is broken, then I won’t be able to make toast today.**" (indicative). Later, she discovers the gas is empty and reflects: "**If the toaster had been broken, I still wouldn’t have been able to make toast today.**" (counterfactual).  

  ### Checks and Analysis  
  - **p**: "The toaster is broken."  
  - **q**: "I won’t be able to make toast today."  

  #### Unified Semantics (Stalnaker-style)  
  1. **Indicative Conditional**: Evaluated in the closest *p*-world within the *speaker’s context set* (worlds compatible with Anna’s knowledge).  
     - Anna’s context set includes worlds where:  
       - The toaster might be broken (epistemic possibility),  
       - The gas stove *might be functional* (she doesn’t know it’s empty).  
     - Closest *p*-world: Minimal change—broken toaster, but gas stove works (since gas outage is unsuspected). In this world, she can use the stove to make toast, so **q is false**.  
     - Verdict: **False** ("If p, q" fails).  

  2. **Counterfactual Conditional**: Evaluated in the closest *p*-world *from actuality* (using objective similarity).  
     - Actual world: Toaster functional, gas empty.  
     - Closest *p*-world: Broken toaster, but gas emptiness held fixed (it’s a background fact unrelated to *p*). In this world, both appliances fail, so **q is true**.  
     - Verdict: **True** ("If p had been, q would have been" holds).  

  #### Why They Diverge  
  - **Key Feature**: The gas emptiness—a *q*-relevant fact unknown to the speaker—is *variable* in the indicative’s context set but *fixed* in the counterfactual’s similarity ordering.  
  - **If Removed**: If Anna *knew* the gas was empty, her context set would fix gas emptiness. The closest *p*-world would then have broken toaster *and* no gas, making q true. The indicative would then be true, matching the counterfactual.  

  #### Defender’s Rebuttal  
  A unified semantics defender would argue:  
  - The divergence stems *only* from the speaker’s context set being incomplete (missing gas emptiness), not from a semantic difference.  
  - Unified semantics *expects* this: indicatives rely on epistemic states, counterfactuals on objective facts. The case reinforces—not refutes—unification by showing how the *same selection mechanism* (closest *p*-world) behaves differently when domains (context set vs. all worlds) differ.  
  - **Honest Assessment**: The case does *not* prove separate semantics are needed. It only shows that speakers can have incomplete information, altering context sets. Unified semantics handles this naturally.  

  ### Conclusion for Seminar  
  This case cleanly illustrates the harder divergence (indicative false, counterfactual true) in an ordinary setting. It highlights how speaker ignorance—not semantic divergence—explains the split, aiding debate on whether "separate semantics" is necessary or if context sets suffice.
