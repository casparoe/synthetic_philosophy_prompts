  If Anna knew about the gas outage, then her context set would only include worlds where the gas is out. Then, in the closest p-world within that context set, the gas is out, so she couldn't make toast (q is true). So the indicative would be true. The counterfactual would still be true. So they wouldn't diverge.

  **Defender of unified semantics:**
  A defender might argue that the case does not show that indicative and counterfactual conditionals require different semantics, but rather that the context set for the indicative is determined by the speaker's knowledge (which is incomplete). The unified semantics already uses the same mechanism (selection function) but with different domains: the indicative uses the context set, the counterfactual uses the entire set of possible worlds. Thus, the divergence is explained by the difference in the domain of worlds considered, which is part of the unified account.

  **Does the case show they need separate semantics?**
  No, it does not. It shows that the context set (the speaker's information state) plays a crucial role for indicatives, and the counterfactual depends on the actual world. This is exactly what the unified semantics (à la Stalnaker) predicts. Therefore, the case does not force us to adopt separate semantics, but rather illustrates the unified account.

