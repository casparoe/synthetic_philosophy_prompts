  2. **Counterfactual conditional: "If p had been the case, then q would have been the case"**
     - We start from the actual world. The actual world: the toaster is not broken, but the gas is out. We go to the closest world where the toaster is broken. In that world, we hold fixed the gas outage (because it is not caused by the toaster being broken, and it's a background condition). In that world, she can't use the toaster (because it's broken) and she can't use the stove (because there's no gas). So q (she won't be able to make toast) is true. Therefore, the counterfactual is true.

