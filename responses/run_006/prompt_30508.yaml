  1. **Indicative conditional: "If p, then q"**
     - Context set: worlds compatible with Anna's knowledge. These are worlds where the toaster might be broken or not, and the gas might be available or not? But she doesn't know about the gas, so there are worlds with gas and without. Also, she doesn't know why the toaster didn't work, so she considers both possibilities (broken or not).
