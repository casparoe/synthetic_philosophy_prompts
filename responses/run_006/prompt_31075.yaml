prompt: |-
  Before I read any further in the accuracy-first epistemology literature, I want the specification I should hold it to. Write the desiderata for an adequate accuracy-first theory of epistemic rationality: what it must deliver and why. Cover at least the following, and add any further requirements you think are being silently assumed: the formal constraints on an inaccuracy measure or scoring rule (truth-directedness, propriety versus strict propriety, additivity, and how the measure should behave under refinement of the partition or algebra being scored), with a note on which of these are negotiable; the distinction between a scoring rule's being proper and a credence function's being immodest, and which of these the dominance argument for probabilism actually requires; the diachronic commitments (does the theory need to vindicate conditionalization, and how strong a vindication counts as success); and how the theory handles logically complex propositions and partition-relative scoring without double-counting or letting the choice of algebra do the justificatory work. For each requirement, give the case or result behind it and say whether it is a genuine constraint or a preference of one camp. Flag any pair of requirements you think cannot be jointly satisfied, and identify the single requirement that excludes the most standard contenders. Keep the weight on the criteria and their motivating cases rather than on a scorecard of particular views.
reasoning: |-
  Okay, the user is diving deep into accuracy-first epistemology and wants a solid foundation before proceeding. They're asking for the desiderata—essential criteria—that any adequate accuracy-first theory of epistemic rationality must meet. This is a sophisticated request, indicating they're either a grad student or a researcher in philosophy, likely epistemology or formal philosophy.  

  First, I need to unpack their explicit asks:  
  - **Formal constraints on inaccuracy measures**: Truth-directedness, propriety (strict vs. non-strict), additivity, and behavior under partition refinement. They want to know which are negotiable.  
  - **Proper scoring rules vs. immodest credences**: Clarifying what the dominance argument for probabilism actually relies on.  
  - **Diachronic commitments**: Whether the theory must justify conditionalization, and how strong that justification needs to be.  
  - **Logical complexity and partition-relativity**: Avoiding double-counting and ensuring the choice of algebra doesn't smuggle in justification.  
  - Plus, any silent assumptions I should surface.  

  The user also wants me to flag:  
  - Conflicts between desiderata.  
  - Which single requirement knocks out the most standard contenders.  

  They’re not asking for a "scorecard" of existing theories but a principled framework. This suggests they want rigor, not partisan summaries.  

  Now, structuring the response:  
  1. **Core constraints on scoring rules**:  
     - *Truth-directedness* is non-negotiable—accuracy must reward closeness to truth. Motivated by the very point of epistemology.  
     - *Propriety* is also core: it ensures coherent credences aren’t self-undermining. Strict propriety is preferred but negotiable; weak propriety suffices for some results.  
     - *Additivity* is often assumed but not sacred—it simplifies math but risks double-counting in partition-relative scoring. Joyce’s argument for probabilism relies on it, but separable approaches exist.  
     - *Partition refinement*: The measure should be "stable" (invariant under refinement), but this clashes with additivity. Brier score handles this via quadratic loss; other rules fail.  

  2. **Propriety vs. immodesty**:  
     - Propriety = no credence can expect to outscore itself.  
     - Immodesty = a credence expects itself to be best.  
     - Dominance arguments for probabilism only require propriety (to block incoherent credences from dominating coherent ones). Immodesty is stronger and sometimes contested.  

  3. **Diachronic commitments**:  
     - Vindicating conditionalization is a major goal. Minimal success is showing it’s *accuracy-optimal* (Greaves & Wallace). Stronger success would show it’s *uniquely* optimal or mandated by dominance. But there’s tension with "permissivism" (multiple rational credences).  

  4. **Logical complexity and partition-relativity**:  
     - The biggest pitfall: if scoring is partition-relative, an agent could be penalized twice for the same doxastic state. Solution: *separable* (additive) rules on an *atomic algebra*, or *algebrization* (scoring whole credence functions).  
     - The "challenge of logical omniscience": Real agents can’t grasp infinite algebras. Theories must either idealize (accepting omniscience) or restrict scoring to "cognized" partitions.  

  **Conflicts and knockout requirements**:  
  - **Stable refinement + additivity + partition-invariance** → only Brier-like rules survive. This excludes many proposed rules.  
  - **Partition-relativity without double-counting** forces a choice: either score only atomic partitions (idealized) or accept non-separable rules (messy).  
  - **The knockout requirement**: *Stable refinement under partitioning*. Most rules fail this, making the Brier score (quadratic loss) the gold standard.  

  **Silent assumptions I should mention**:  
  - *Cognitive limitations*: Theories often ignore computational limits. Should we require "feasible" scoring for bounded agents?  
  - *Permissivism*: Can multiple credences be equally rational? Accuracy-first often pushes toward uniqueness (via strict propriety), but this is contentious.  
  - *Interpretation of "accuracy"*: Is it purely alethic, or could it include pragmatic elements? Purists will insist on truth-aptness alone.  

  Finally, the user’s unspoken need: They want to know where the landmines are. By flagging conflicts (e.g., refinement vs. additivity) and the Brier score’s privileged status, I’m giving them a map to navigate debates. They’re likely prepping for original work—so highlighting unresolved tensions (diachronic permissivism, logical omniscience) is key.
answer: |-
  Here is a structured specification of desiderata for an adequate accuracy-first epistemology, grounded in the literature's key challenges and debates. Requirements are categorized, motivated by specific problems, and assessed for negotiability. Conflicts are flagged explicitly.

  ---

  ### **I. Core Constraints on Inaccuracy Measures (Scoring Rules)**
  A scoring rule \( s(C, \omega) \) measures inaccuracy when credence function \( C \) is evaluated at world \( \omega \).  
  **Non-negotiable baseline**:  
  - **Truth-Directedness**: If \( C \) is closer to truth-values than \( C' \) at \( \omega \), \( s(C, \omega) < s(C', \omega) \).  
    *Why*: Core to "accuracy" — without this, the measure fails to track truth. Motivated by the trivial case: a true proposition must be less inaccurate to believe more strongly.  
  - **Propriety (Weak)**: No coherent credence function expects another credence function to be strictly more accurate *in expectation*. Formally, for probabilistic \( C \), \( \mathbb{E}_C[s(C, \omega)] \leq \mathbb{E}_C[s(C', \omega)] \) for all \( C' \).  
    *Why*: Prevents epistemic self-sabotage. Without propriety, rationality might require holding credences that *predict their own inferiority* (e.g., if a non-proper rule made uniform credences "expect" extreme credences to outperform them).  

  **Negotiable refinements**:  
  - **Strict Propriety**: \( \mathbb{E}_C[s(C, \omega)] < \mathbb{E}_C[s(C', \omega)] \) for all \( C' \neq C \).  
    *Why*: Ensures probabilistic credences are *uniquely* immodest (see §II). Desirable but not essential for core arguments (e.g., dominance). Some theories (e.g., quadratic scores) satisfy this; others (e.g., logarithmic score) do not.  
  - **Additivity (Separability)**: Total inaccuracy = sum of inaccuracies for propositions in a partition.  
    *Why*: Simplifies mathematics and aligns with "local" evaluation (e.g., Brier score). But non-additive rules are viable (e.g., logarithmic score). Motivated by tractability, not principle.  
  - **Stability Under Refinement**: Inaccuracy for a coarse partition should align with a refinement (e.g., scoring "rain" shouldn't change when adding "temperature").  
    *Why*: Avoids inconsistency across partitions. *Failure case*: Some rules (e.g., absolute value) give different verdicts if you score \(\{P, \neg P\}\) vs. a finer partition. The Brier score succeeds here; others fail.  

  ---

  ### **II. Immodesty vs. Propriety: What Dominance Requires**
  - **Propriety** (as defined above) ensures coherent credences don't *expect* others to dominate them.  
  - **Immodesty**: A credence function \( C \) expects *itself* to be uniquely least inaccurate (i.e., \( \mathbb{E}_C[s(C, \omega)] < \mathbb{E}_C[s(C', \omega)] \) for all \( C' \neq C \)).  
    *Distinction*: Propriety blocks self-predicted dominance; immodesty adds a self-favoring bias.  
  - **Dominance Argument for Probabilism**: Requires only **propriety** (not strict propriety or immodesty).  
    *Why*: Non-probabilistic credences are *strongly dominated* (some probabilistic \( C^* \) is more accurate in all worlds) *if* the scoring rule is proper. Immodesty strengthens uniqueness but isn't needed for the core result.  

  ---

  ### **III. Diachronic Commitments: Must Vindicate Conditionalization?**  
  - **Minimal Success**: The theory should explain *why* rational agents update by conditionalization upon learning evidence \( E \).  
  - **Standard Vindication**: Show that *conditionalizing on \( E \) uniquely minimizes expected inaccuracy* from the ex-ante perspective (à la Greaves & Wallace 2006).  
  - **Negotiable Strength**:  
    - *Weak*: Conditionalization is optimal among *some* reasonable strategies.  
    - *Strong*: Uniquely optimal (requires strict propriety).  
  - **Conflict Point**: Diachronic Dutch books and "epistemic conservatism" arguments are insufficient for accuracy-first; it must derive conditionalization from accuracy alone.  
  - **Tension**: If permissivism holds (multiple rational priors), conditionalization may not be uniquely optimal.  

  ---

  ### **IV. Handling Logical Complexity & Partition-Relativity**  
  **Problem**: Scoring must avoid double-counting propositions and prevent the choice of algebra from doing justificatory work.  
  - **Requirement 1: No Double-Counting**  
    Inaccuracy for \( P \land Q \) shouldn't redundantly penalize credences in \( P \) and \( Q \) separately.  
    *Solution*: Score only over an **atomic partition** (e.g., possible worlds or maximally specific propositions).  
    *Why*: Motivated by the "overcounting" problem (e.g., if \( P \) and \( P \land Q \) are both scored, credences in \( Q \) are effectively scored twice).  
  - **Requirement 2: Algebra-Invariance**  
    Rationality verdicts should not depend on the choice of partition.  
    *Why*: Else, an agent could manipulate rationality by coarsening/refining their algebra.  
    *How*: **Stable** scoring rules (e.g., Brier score) achieve this; others (e.g., log score) are partition-sensitive.  
  - **Challenge of Logical Omniscience**:  
    Real agents lack access to atomic partitions. Theories must either:  
    - Idealize (accepting that scoring is defined extensionally over atoms), or  
    - Restrict scoring to "cognized" partitions, risking language-dependence (see below).  

  ---

  ### **V. Silent Assumptions & Additional Desiderata**  
  1. **Language-Invariance**:  
     Rationality shouldn't depend on how propositions are labeled (e.g., adding tautologies shouldn't change inaccuracy).  
     *Why*: Motivated by "irrelevant conjunction" problems.  
  2. **Cognized Partition Constraint** (for non-ideal agents):  
     Scoring should be relativized to the agent's *actual conceptual resources*.  
     *Why*: Avoids requiring knowledge of unknowable partitions (e.g., a particle’s position).  
  3. **Continuity**:  
     Small credence changes shouldn't cause discontinuous jumps in inaccuracy.  
     *Why*: Ensures stability and differentiability (used in many proofs).  
  4. **Extensibility to Non-Classical Logics**:  
     Should handle non-Boolean algebras (e.g., intuitionistic or fuzzy logics).  

  ---

  ### **VI. Conflicts and Knockout Requirements**  
  - **Key Conflict**: **Stability under refinement** vs. **partition-relative scoring for bounded agents**.  
    - Atomic scoring ensures stability but requires logical omniscience.  
    - Cognized partitions avoid omniscience but risk algebra-dependence.  
    *Unresolved*: No theory fully satisfies both without idealization.  
  - **Knockout Requirement**: **Stability under refinement**.  
    *Why*: Rules unstable under refinement (e.g., absolute-value score) generate inconsistent rationality verdicts across partitions. This excludes most non-Brier-like contenders.  
  - **Dominant Constraint Excluding Contenders**: **Propriety + Truth-Directedness + Stability**.  
    Most proposed rules (e.g., log score, spherical score) fail stability; only Brier-like (quadratic) scores satisfy all three universally.  

  ---

  ### Summary: The Accuracy-First Litmus Test  
  An adequate theory must:  
  1. Use a **truth-directed, proper** scoring rule stable under refinement.  
  2. Derive **probabilism** via dominance (using propriety).  
  3. Justify **conditionalization** as accuracy-optimal (minimally).  
  4. Resolve **double-counting** via atomic partitions (idealized) or cognized partitions (non-ideal).  
  5. Avoid **algebra-dependence** in rationality verdicts.  

  **Largest Gaps**:  
  - Reconciling logical omniscience with partition-invariance.  
  - Handling diachronic permissivism (if rational priors aren’t unique).  
  - Extending to non-ideal agents without language-relativity.  

  The Brier score remains the "gold standard" due to its stability and propriety, but its reliance on idealization highlights unresolved tensions in the program.
