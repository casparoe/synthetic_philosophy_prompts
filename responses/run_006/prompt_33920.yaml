answer: |-
  The conventional RCT design presupposes a **Cartesian modular model**:  
  - **Mind-body dualism**: Symptoms are objective bodily signals (e.g., nociception) separable from subjective experience (pain).  
  - **Passive perception**: The brain reads pre-existing symptom data; belief merely amplifies or dampens this signal like volume control.  
  - **Additive effects**: Drug effects (biological) and placebo effects (psychological) sum independently. The drug’s "true" efficacy is the residual after subtracting placebo "noise."  

  This doesn’t *strictly* require Cartesianism; a mechanistic biological model could similarly isolate "pure" drug actions. Yet it implicitly treats cognition as a confounder rather than constitutive of symptoms.  

  ### Predictive Processing (PP) Critique  
  Under PP and the Free Energy Principle:  
  - **Symptoms as inferences**: Pain/mood are not passive readouts but *active inferences* generated by the brain to explain sensory input.  
  - **Expectation as mechanism**: Beliefs (priors) directly shape symptom perception. A "placebo response" isn’t noise—it’s the brain updating its generative model (e.g., "treatment → safety → less pain").  
  - **Non-additive interactions**: Drugs work partly by modulating precision weights on prediction errors (e.g., opioids may reduce the brain’s weighting of bodily signals). Expectation and pharmacology interact synergistically.  

  ### Implications for Trial Design  
  **What should change:**  
  1. **Stop "subtracting" placebo**: Placebo isn’t baseline noise but reveals the brain’s capacity for symptom modulation.  
  2. **Test drug-expectation interactions**: Use 2x2 designs (e.g., drug/no drug × high/low expectation) to quantify synergy.  
  3. **Measure priors**: Track participants’ treatment expectations (e.g., via surveys or neuroimaging) as effect modifiers.  
  4. **Redefine efficacy**: "True" drug effects include how they reshape priors (e.g., SSRIs may gradually alter mood-predictions).  

  **What stays the same:**  
  - Blinding remains crucial but should be validated (e.g., assess blinding success).  
  - Controls (e.g., no-treatment arms) still contextualize effects.  

  ### Conclusion  
  Conventional RCTs assume a separable "biological" symptom core—a stance challenged by PP. Embracing PP would shift trials from isolating drug effects to mapping how interventions *update predictive models*, with placebo responses as mechanistic data. This reframes efficacy without abandoning rigor.  

