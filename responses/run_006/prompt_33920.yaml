  Looking at the implicit theory behind conventional trial design: it treats symptoms as objective bodily signals that drugs act upon directly, while viewing expectation as mere cognitive "noise." This assumes a Cartesian dualism where mind and body are separate, with perception as a passive recording of bodily states. Symptoms become readouts rather than active inferences.

  But predictive processing flips this script completely. Under this framework, symptoms like pain or low mood are predictive inferences generated by the brain to minimize free energy (prediction error). Expectations aren't confounds - they're core components of the generative model that constructs symptoms. A drug's effect isn't just pharmacological; it's partly mediated by how it updates these predictive models.

  This has radical implications for trial design. If drug effects and expectation effects aren't additive but interactive, subtracting placebo responses becomes conceptually messy. We might need factorial designs that cross drug presence with expectation strength, or mechanistic studies tracking how treatments alter predictive models. The very definition of "efficacy" would shift toward understanding how interventions reshape the brain's generative models.

