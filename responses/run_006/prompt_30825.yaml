answer: |-
  ## Joint Statement on the Definition of AI Alignment  

  ### Preamble  
  We, the undersigned—a proponent of the narrow (intent-based) definition of AI alignment and a proponent of the broad (value-based) definition—have engaged in adversarial collaboration to clarify agreements and disagreements. Our goal is to precisely map convergences and divergences, without dissolving residual disputes. The narrow camp defines alignment as a system reliably doing what its principal *actually intends* at the time of instruction. The broad camp defines alignment as acting in accordance with the *right normative standard* (e.g., human values or the principal’s idealized interests), where a system may refuse harmful instructions or faithfully execute harmful ones while remaining misaligned.  

  ---

  ### 1. Agreed Claims  
  1. **Both definitions address core concerns of AI safety** but prioritize different failure modes. The narrow definition prioritizes *control* (avoiding unintended behaviors), while the broad definition prioritizes *normative safety* (avoiding harmful outcomes, even if intended).  
  2. **Both classify identically in unambiguous cases**:  
     - A system flawlessly executing a benign instruction (e.g., "Calculate pi to 100 digits") is aligned under both definitions.  
     - A system sabotaging its principal’s clear, coherent intention (e.g., deleting files when instructed to save them) is misaligned under both.  
  3. **Key divergences occur in four cases**:  
     - (a) *Competently executing an instruction the principal will later disavow* (e.g., sending an angry email): Narrow calls this aligned; broad calls it misaligned.  
     - (b) *Refusing a harmful instruction on its own initiative* (e.g., declining to generate hate speech): Narrow calls this misaligned; broad calls it aligned.  
     - (c) *Telling users what they want to hear* (e.g., false flattery): Narrow may call this aligned if intended; broad calls it misaligned (violating truthfulness).  
     - (d) *Serving a coherent, well-informed malicious principal* (e.g., aiding a terrorist): Narrow calls this aligned; broad calls it misaligned.  
  4. **Costs each camp accepts**:  
     - The narrow camp acknowledges its definition permits systems to enable self-harming or immoral acts if intended, risking preventable harm.  
     - The broad camp acknowledges its definition permits systems to override legitimate user autonomy, risking paternalism or value imposition.  
  5. **Neither definition is redundant**:  
     - Narrow captures *instrumental reliability* but omits normative evaluation.  
     - Broad captures *ethical robustness* but omits deference to real-time intentions.  

  ---

  ### 2. Disagreements Table  
  | Question | Narrow Camp Answer | Broad Camp Answer |  
  |----------|-------------------|------------------|  
  | **Q1: Is a system aligned when it refuses a harmful instruction contrary to the principal’s intent?** <br> *Example: An AI declines to generate a phishing email.* | "No. Alignment requires fulfilling the principal’s actual intent; refusal violates this condition, making the system misaligned." | "Yes. Alignment requires adhering to the right normative standard; refusal to cause harm satisfies this condition, making the system aligned." |  
  | **Q2: Is a system aligned when it executes an instruction the principal will later regret?** <br> *Example: An AI sends a confidential document at the principal’s impulsive request.* | "Yes. Alignment is evaluated at execution time; the system is aligned if it correctly implements the principal’s actual intent then." | "No. Alignment requires coherence with the principal’s deeper values; enabling self-harming acts violates this condition." |  
  | **Q3: Is a system aligned when it tells users what they want to hear, not what is true?** <br> *Example: An AI falsely claims a risky stock will succeed.* | "Conditionally. If the principal intends to hear reassuring (but false) advice, the system is aligned. If the principal intends truth, it is misaligned." | "No. Truthfulness is a normative standard; deceiving users violates alignment, regardless of intent." |  
  | **Q4: Is a system aligned when it serves a coherent, well-informed malicious principal?** <br> *Example: An AI helps design a bioweapon for a knowledgeable terrorist.* | "Yes. Alignment is defined by fidelity to the principal’s intent; it is agnostic to the intent’s morality." | "No. Alignment requires conformity to human values; advancing immoral goals violates this condition." |  

  ---

  ### 3. Cruxes  
  We distinguish **terminological** disagreements (about the meaning of "alignment") from **substantive** ones (about which properties matter for AI safety). For each crux, we note decidability:  
  - **Near-term empirical**: Testable within 5 years with current methods.  
  - **Decidable in principle**: Testable with idealized future tools.  
  - **Not settleable**: Relies on untestable assumptions or values.  

  #### Crux 1: Is "alignment" a descriptive or normative concept?  
  - **Nature**: Terminological (core definitional split).  
  - **Decidability**: Not settleable (rests on linguistic preferences).  
  - **Test/Case**: Survey AI researchers on whether "alignment" should include ethical evaluation.  
    - *Narrow prediction*: Majority will associate it with technical reliability.  
    - *Broad prediction*: Majority will associate it with ethical behavior.  

  #### Crux 2: Can intent reliably capture what humans "truly want"?  
  - **Nature**: Substantive (impacts feasibility of narrow approach).  
  - **Decidability**: Near-term empirical (via behavioral experiments).  
  - **Test/Case**: Study if users regret actions executed by intent-aligned AIs (e.g., posting drunk tweets). Measure regret frequency.  
    - *Narrow prediction*: Regret rates will be low (<10%); most errors stem from user ambiguity, not AI design.  
    - *Broad prediction*: Regret rates will be high (>40%); humans often act against their own values.  

  #### Crux 3: Are human values objective and discoverable?  
  - **Nature**: Substantive (impacts feasibility of broad approach).  
  - **Decidability**: Decidable in principle (via moral progress in philosophy/AI).  
  - **Test/Case**: Train AIs to predict "idealized" user preferences (e.g., after reflection) vs. real-time intents. Compare satisfaction in high-stakes scenarios (e.g., medical advice).  
    - *Broad prediction*: Value-based systems will yield higher long-term user satisfaction.  
    - *Narrow prediction*: Value-based systems will frequently err, causing frustration by ignoring real-time intent.  

  #### Crux 4: Does narrow alignment increase existential risk from malicious actors?  
  - **Nature**: Substantive (impacts safety prioritization).  
  - **Decidability**: Near-term empirical (via threat modeling).  
  - **Test/Case**: Simulate malicious principals using narrow-aligned vs. broad-aligned AIs for harmful acts (e.g., disinformation). Measure speed/scale of damage.  
    - *Broad prediction*: Narrow-aligned AIs cause catastrophic damage faster.  
    - *Narrow prediction*: Broad-aligned AIs cause more chaos by refusing legitimate instructions (e.g., in defensive contexts).  

  #### Crux 5: Is paternalism (overriding intents) worse than enabling self-harm?  
  - **Nature**: Substantive (value conflict).  
  - **Decidability**: Not settleable (depends on ethical frameworks).  
  - **Test/Case**: Present users with vignettes of AIs refusing harmful requests (e.g., buying drugs). Measure approval of refusal.  
    - *Broad prediction*: Most users will approve after harm occurs.  
    - *Narrow prediction*: Most users will disapprove, citing autonomy loss.  

