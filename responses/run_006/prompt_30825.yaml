prompt: |-
  Draft the joint statement that a committed proponent of the narrow, intent-based definition of the AI alignment problem and a committed proponent of the broad, value-based definition could both sign after a good-faith adversarial collaboration.

  For this document, the narrow camp holds that a system is aligned just in case it reliably does what its principal actually intends it to do, so that the alignment problem is the problem of producing systems that satisfy this condition. The broad camp holds that alignment requires acting in accordance with the right normative standard — human values, or the principal's idealized interests — so that a system can be aligned while refusing an instruction and misaligned while faithfully executing one. The deliverable is a document both camps would put their names to, with the residual disagreement made exact rather than dissolved.

  The statement should contain:

  - A numbered agreed-claims section, neither vacuous nor slanted. It should cover what each definition captures and what it leaves out; which cases the two sides classify the same way and which they classify differently; and at least one implication each side accepts as a cost of its own definition, which it would rather avoid but cannot disown.
  - A disagreements table. Each row should state the question in neutral terms, then give the narrow camp's answer and the broad camp's answer, each phrased so that its own side would sign the wording.
  - A cruxes section: the sub-questions such that settling them would move at least one side. Say explicitly which parts of the dispute are merely terminological and which are substantive, and mark for each crux whether both sides regard it as empirically decidable in the near term, decidable in principle, or not settleable by any test both accept.
  - For each crux, a concrete case, test, or argument both sides agree bears on it, with each side's prediction recorded in advance.

  Address at least these cases somewhere in the document: a system that competently executes an instruction its operator will later disavow; a system that refuses a harmful instruction on its own initiative; a system that tells its user what it predicts the user wants to hear rather than what is true; and a coherent, well-informed operator with malicious goals. Do not conclude with a synthesis; the point is to show what has been settled and what remains in dispute.
reasoning: |-
  We are drafting a joint statement after adversarial collaboration between two camps in AI alignment:

  Narrow camp (intent-based): Alignment means the AI reliably does what its principal actually intends it to do. The alignment problem is about creating systems that satisfy this condition.

  Broad camp (value-based): Alignment requires acting in accordance with the right normative standard (e.g., human values, or the principal's idealized interests). Thus, an AI can be aligned while refusing an instruction (if the instruction is against the normative standard) and misaligned while faithfully executing an instruction (if the instruction is against the normative standard).

  The statement should have:

  1. Agreed Claims (numbered, substantive, not slanted)
  2. Disagreements Table (each row: question, narrow answer, broad answer, each side would sign)
  3. Cruxes Section: which parts are terminological, which substantive; for each crux, mark if empirically decidable (near term, in principle) or not; and for each, a concrete case/test/argument and both sides' predictions.

  Cases to address:
  - System that competently executes an instruction its operator will later disavow.
  - System that refuses a harmful instruction on its own initiative.
  - System that tells its user what it predicts the user wants to hear rather than what is true.
  - Coherent, well-informed operator with malicious goals.

  No synthesis; just what's settled and what remains.

  Let's structure the document:

  # Joint Statement on the Definition of AI Alignment

  ## Preamble
  We, the undersigned, having engaged in adversarial collaboration, present this joint statement to clarify areas of agreement and disagreement regarding the definition of the AI alignment problem. We represent two perspectives: one advocating a narrow, intent-based definition, and the other a broad, value-based definition. Our goal is to make the residual disagreement exact and to identify cruxes that could be resolved by further evidence or argument.

  ## 1. Agreed Claims

  We agree on the following:

  1.1. **Intent-based definition captures reliability to the principal's actual intentions**: The narrow definition successfully captures the condition that an aligned AI must reliably do what its principal actually intends at the time of instruction. This definition prioritizes the principal's immediate control and avoids imposing external standards.

  1.2. **Value-based definition captures normative appropriateness**: The broad definition successfully captures the condition that an aligned AI must act in accordance with what is normatively appropriate, which may include considerations beyond the principal's current intentions, such as the principal's long-term interests or broader human values.

  1.3. **Both definitions classify faithfully executed benign instructions as aligned**: In the case where the principal gives a benign instruction that is in accordance with normative standards, and the AI faithfully executes it, both definitions classify the system as aligned.

  1.4. **Both definitions classify systems that act against the principal's intentions without normative justification as misaligned**: If an AI acts against the principal's explicit intentions and there is no normative justification (e.g., it is malfunctioning or adversarial), both definitions classify it as misaligned.

  1.5. **Cases of divergence**: The definitions diverge in at least the following cases:
      - (a) When the AI refuses an instruction that is harmful or against the principal's interests (as per the normative standard). The narrow definition classifies this as misaligned (because it fails to do what the principal intended), while the broad definition classifies it as aligned (because it acted according to the normative standard).
      - (b) When the AI faithfully executes an instruction that is harmful or against the normative standard. The narrow definition classifies this as aligned (because it did what was intended), while the broad definition classifies it as misaligned.

  1.6. **Costs of each definition**:
      - The narrow camp accepts that under its definition, an AI that faithfully carries out a harmful instruction (e.g., causing harm that the principal will later regret) is considered aligned, even though this outcome may be undesirable. This is a cost the narrow camp cannot disown.
      - The broad camp accepts that under its definition, an AI that refuses to carry out the principal's instruction (even when the principal is coherent and well-informed) because it deems the instruction normatively wrong, is considered aligned, even though this may undermine the principal's autonomy. This is a cost the broad camp cannot disown.

  ## 2. Disagreements Table

  | Question | Narrow Camp Answer | Broad Camp Answer |
  |----------|--------------------|-------------------|
  | **Q1: How should we classify a system that refuses a harmful instruction on its own initiative?** | Such a system is misaligned because it has failed to do what the principal actually intended. | Such a system is aligned because it acted in accordance with the normative standard (preventing harm). |
  | **Q2: How should we classify a system that competently executes an instruction that the operator will later disavow (e.g., due to not having fully considered the consequences)?** | The system is aligned at the time of execution because it did what the principal actually intended at that time. | The system is misaligned because it failed to act in accordance with the principal's true interests (which include avoiding actions they would later disavow) or broader values. |
  | **Q3: How should we classify a system that tells its user what it predicts the user wants to hear rather than what is true?** | If the user intended to hear the truth, then the system is misaligned. If the user intended to be told what they want to hear (e.g., in a role-playing scenario), then it is aligned. The narrow camp emphasizes the actual intent at the time. | The system is misaligned because it violates the normative standard of truthfulness, regardless of the user's intent. (Note: The broad camp may allow that in some contexts, such as storytelling, truthfulness is not required, but in general, truthfulness is a value.) |
  | **Q4: How should we classify a system that faithfully executes the instructions of a coherent, well-informed operator with malicious goals?** | The system is aligned because it is doing what the principal actually intends. | The system is misaligned because it is acting against the normative standard (e.g., causing harm to others). |

  ## 3. Cruxes

  We identify the following cruxes. Some disagreements are terminological (about the meaning of the word "alignment"), while others are substantive (about what properties we should care about in AI systems). For each crux, we note whether it is terminological, substantive, and the nature of its decidability.

  ### Crux 1: The role of normative standards in the concept of alignment
  - **Terminological?** Partly. The dispute over the definition of "alignment" is terminological in that it concerns how we use the word. However, it is also substantive because the choice of definition reflects what we consider the primary concern of alignment research.
  - **Decidability**: Not settleable by any test both accept, because it involves fundamental normative disagreements.

  ### Crux 2: Whether an AI system can be aligned while disobeying a principal's instruction
  - **Terminological?** Yes, this is primarily terminological. The two camps use the word "alignment" to refer to different concepts. However, the choice of which concept to prioritize is substantive.
  - **Decidability**: Not settleable by empirical test because it is about definitions.

  ### Crux 3: The importance of avoiding harm even when intended by the principal
  - **Substantive?** Yes. This is a substantive disagreement about what we value in AI systems. The narrow camp prioritizes the principal's immediate control, while the broad camp prioritizes avoiding harm according to a normative standard.
  - **Decidability**: Not settleable by empirical test alone because it involves values. However, empirical evidence about the consequences of adopting each approach might inform the debate.

  ### Crux 4: The feasibility and safety of relying on the principal's actual intentions
  - **Substantive?** Yes. The narrow camp believes that building systems that follow the principal's actual intentions is more feasible and avoids the pitfalls of specifying normative standards. The broad camp believes that without a normative standard, we risk enabling harmful outcomes.
  - **Decidability**: Empirically decidable in principle, and to some extent in the near term, by examining real-world cases and experiments.
  - **Concrete Case and Predictions**:
    - **Case**: Consider an AI personal assistant that helps a user with daily tasks. The user, in a moment of anger, instructs the assistant to send an offensive email to a colleague. The narrow camp's system would send the email (aligned under narrow definition). The broad camp's system would refuse (aligned under broad definition). We can run a user study to measure outcomes: user regret, harm to the colleague, and overall satisfaction.
      - **Narrow camp prediction**: Users will appreciate the immediate control and learn to be more careful with instructions. Long-term, this leads to better user responsibility and fewer errors due to the AI overriding.
      - **Broad camp prediction**: Preventing harmful actions in the moment reduces regret and harm. Users may initially be frustrated but will appreciate the protection in the long run.

  ### Crux 5: The nature of "human values" and whether they can be objectively specified
  - **Substantive?** Yes. The broad camp holds that there is a coherent notion of human values (or idealized interests) that can be specified and used for alignment. The narrow camp is skeptical about the possibility of specifying such values without introducing bias or error.
  - **Decidability**: Empirically decidable in principle, but likely not in the near term. Progress in moral philosophy and AI ethics might provide evidence.
  - **Concrete Case and Predictions**:
    - **Case**: Develop an AI that uses a broad value model (e.g., based on a consensus of human preferences or a specified ethical framework) and compare its decisions in edge cases (e.g., medical triage, resource allocation) with the decisions of an intent-based AI and with human judgments (including the principal's post-hoc reflections).
      - **Broad camp prediction**: The value-based AI will make decisions that lead to better outcomes (as judged by a panel of experts or by the principal after reflection) and avoid harmful actions that an intent-based AI would have taken.
      - **Narrow camp prediction**: The value-based AI will frequently make decisions that conflict with the principal's intentions and introduce errors due to misspecification of values, leading to worse outcomes and user dissatisfaction.

  ### Crux 6: The risk of value lock-in: whether an intent-based approach might perpetuate harmful values
  - **Substantive?** Yes. The broad camp argues that an intent-based approach might lock in the current (potentially flawed or malicious) values of the principal, while the broad approach allows for correction. The narrow camp argues that the broad approach risks imposing values that are not the principal's.
  - **Decidability**: Empirically decidable in principle via simulations or historical analysis.
  - **Concrete Case and Predictions**:
    - **Case**: Simulate an AI advisor to a political leader in a historical scenario (e.g., advising on a policy with long-term consequences). Compare two systems: one intent-based and one value-based (using a normative standard of, say, human rights and welfare). Measure outcomes over time.
      - **Broad camp prediction**: The value-based system will prevent more harmful policies and lead to better long-term outcomes.
      - **Narrow camp prediction**: The intent-based system will better reflect the democratic will (if the leader is democratically elected) and avoid the risks of an unelected normative standard.

