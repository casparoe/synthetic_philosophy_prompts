prompt: |-
  I'm a retired biochemist — spent most of my career on enzyme kinetics, so I'm comfortable with a decision tree but pretty new to moral philosophy. Lately I've been reading around in the repugnant-markets and commodification literature, and I keep feeling like the important distinctions are sitting right there in the arguments but nobody has turned them into something a working committee can actually run.

  Here's the situation. I sit on the ethics committee of a regional hospital system. We meet monthly, and about every other month a proposal lands on our table that raises the commodification question: paying living kidney donors a fixed amount set by the state, reimbursing funeral expenses for the families of deceased donors, paying healthy volunteers more than a token amount for phase I drug trials, letting a company buy plasma from our patients. The rest of the committee is clinicians, a lawyer, and a hospital chaplain — smart people, but they haven't read the philosophy and they mostly go on gut reaction. Our recommendations go to the hospital CEO, so whatever I say has to be defensible in plain English. The stakes are high in both directions: block something and maybe lives are lost, approve something and maybe the public stops trusting the system. I usually have about an hour to prepare, and I'm the closest thing the committee has to a philosopher.

  Please write me a reusable decision procedure, grounded in the actual philosophical worries about commodification and repugnant markets, that I can run on a proposal before each meeting. I want the questions in the order I should ask them, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a human because its a values call rather than something the theory can settle. Then run the procedure on three of the proposals I mentioned, including one where it comes out against something I would personally have approved, and tell me where you expect it to misfire. No reading list — I need the checklist.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired biochemist serving on a hospital ethics committee, facing real-world commodification dilemmas in healthcare. They need a practical, philosophically grounded decision tool - not theory, but actionable questions in logical sequence. 

  First, I recognize their constraints: high-stakes decisions under time pressure (1 hour prep), mixed committee backgrounds (no philosophers), and need for plain English justifications. Their core challenge is translating complex commodification theory (Radin, Sandel, Satz) into clinical ethics workflow.

  I'll structure the tool around three philosophical danger zones: commodification harms, systemic corruption, and distributive injustice. The sequence must filter absolute no-gos first (e.g., inherent harm), then assess context risks before finally allowing values-based exceptions. For each step, I'll define clear pass/fail thresholds - like "no direct physical harm" or "voluntariness verifiable".

  The plasma example will demonstrate where the tool blocks something they'd personally approve, showing its conservative bias. I anticipate misfires around cultural perceptions (e.g., funeral reimbursements feeling transactional) and emergency contexts where usual safeguards fail. 

  Crucially, the output must resist philosophical jargon - hence framing "undue inducement" as "would poor people feel forced?". The three test cases (kidney payments, funeral reimbursements, plasma sales) will prove the tool's versatility across commodification types.
answer: |-
  Here's a field-ready decision procedure based on core commodification concerns (Radin, Sandel, Satz, Anderson), designed for speed and defensibility. Think of it as a filtration cascade: each question narrows the acceptable options. Fail any step = automatic "No". Pass all = "Proceed with extreme caution, assess residual risk".

  **The Commodification Risk Filter (CRF) - For Hospital Ethics Committees**

  **Ask these questions IN ORDER. Stop at any "No".**

  1.  **Direct Bodily Harm/Significant Health Risk:** Does the proposal involve significant, unavoidable physical harm, risk of permanent disability, or irreversible loss of a vital bodily function *for the provider*? (e.g., selling a vital organ, high-risk untested procedures).
      *   *Good Answer:* "No, or the risk is minimal/well-understood/mitigated (e.g., standard blood donation, low-risk phase I trial with robust safety protocols)".
      *   *Stop:* YES -> **Recommend REJECTION.** (Core objection: Treating the body as a mineable resource leading to intrinsic harm).
      *   *Pass:* No significant/unavoidable harm/risk.

  2.  **Non-Voluntariness/Undue Inducement:** Is the payment/benefit so substantial ($ or kind) relative to the target population's typical socioeconomic status that it would likely *compel* participation from the desperately poor/vulnerable, overriding free choice?
      *   *Good Answer:* "Payment is modest/compensation-only (e.g., lost wages + expenses), OR the target population is not economically vulnerable (rare for donors/volunteers), OR there's a rigorous independent assessment of voluntariness *specific to this payment level*".
      *   *Stop:* YES -> **Recommend REJECTION.** (Core objection: Coercion via market forces, exploiting vulnerability).
      *   *Pass:* Payment level unlikely to constitute undue inducement for the target group.

  3.  **Instrumentalization/Disrespect:** Does the transaction inherently treat the person (or a fundamental aspect like their body, reproductive capacity, profound grief) *solely as a means* to another's end, degrading their dignity or disrespecting intrinsic human value? Does it turn a deeply personal act into a purely commercial one?
      *   *Good Answer:* "The transaction preserves significant elements of altruism/gift relationship/social meaning OR the act is already framed clinically/commercially without major loss of dignity (e.g., plasma vs. a kidney), AND the payment is framed as appreciation/compensation, not purchase price".
      *   *Stop:* YES -> **Recommend REJECTION.** (Core objection: Violating Kantian respect for persons, corrupting social meaning).
      *   *Pass:* Dignity/social meaning is preserved or not fundamentally undermined.

  4.  **Corruption of a Core Value/Institution:** Would allowing this market transaction likely damage public trust in medicine, the organ donation system, research integrity, or the perceived equality/sanctity of human life? Would it create perverse incentives for the *institution* (hospital, researchers)?
      *   *Good Answer:* "Evidence/strong consensus suggests minimal impact on trust/institutional integrity, OR robust safeguards prevent corruption (e.g., state-run, non-profit, strict oversight), OR the value being protected is already compromised/contested in this context".
      *   *Stop:* YES -> **Recommend REJECTION.** (Core objection: Satz's "noxious markets" corrupting essential non-market norms).
      *   *Pass:* Risk of significant corruption is low/containable.

  5.  **Distributive Injustice:** Would the transaction primarily benefit the wealthy/powerful *at the direct expense* of the poor/vulnerable *providers*? Does it exacerbate existing health/social inequities?
      *   *Good Answer:* "Benefits are distributed fairly (e.g., system improves access for all), OR the burden on vulnerable providers is minimized/offset by systemic gains (e.g., more organs save lives across demographics), OR the transaction occurs within a framework actively mitigating inequity".
      *   *Stop:* YES -> **Recommend REJECTION.** (Core objection: Exploitation reinforcing unjust social hierarchies).
      *   *Pass:* No clear pattern of exploiting the vulnerable to benefit the privileged.

  **If you pass ALL FIVE filters:**

  *   **Residual Risk Assessment & Values Call:** The proposal is *potentially* permissible, but **NOT automatically approved.** The committee must now weigh:
      *   *Residual Risks:* How well do proposed safeguards actually mitigate the risks identified in steps 2-5? How strong is the evidence?
      *   *Net Benefit:* How significant are the potential lifesaving/health benefits? How many people benefit?
      *   *Alternatives:* Are there demonstrably better, less risky ways to achieve the same goal?
      *   *Public Perception:* How will this *likely* be perceived by patients, donors, and the community? (This is where the Chaplain/Lawyer gut reactions are valuable).
      *   *Precedent:* Does this open the door to clearly worse transactions down the line?
      *   **Recommendation:** Based on this holistic weighing, either **APPROVE WITH STRINGENT SAFEGUARDS** or **DEFER/REJECT DUE TO RESIDUAL RISK.** *This is the inevitable values call.*

  ---

  **Running the CRF on Your Proposals:**

  **1. Paying Living Kidney Donors a Fixed Amount Set by the State**

  *   1. **Direct Harm?** YES. Nephrectomy is major surgery with lifelong risks (infection, hypertension, future kidney issues). **STOP. Recommend REJECTION.** *Rationale: This fails at the first and most fundamental hurdle. The harm/risk is inherent, significant, and permanent.*
  *   *(Tool Outcome: Reject. Your Personal View: Unknown, but tool is conservative here).*

  **2. Reimbursing Funeral Expenses for Families of Deceased Donors**

  *   1. **Direct Harm?** NO. The donor is deceased. Harm isn't to the provider.
  *   2. **Undue Inducement?** MAYBE (Proceed with Caution). Is $5k-$10k enough to pressure grieving families into consenting when they otherwise wouldn't? Risk is *moderate*, particularly for low-income families facing funeral costs.
      *   *Good Answer Needed:* "Reimbursement is standardized, modest (actual costs), and decoupled from the *decision* to donate (e.g., offered to all donor families regardless of timing). Public perception is that it's an act of gratitude, not payment." **PASS (with vigilance).**
  *   3. **Instrumentalization/Disrespect?** RISK. Could reframe donation from a gift to a financial transaction for the family. Could feel like "paying for the body."
      *   *Good Answer Needed:* "Framed explicitly as gratitude/relieving a burden, NOT payment. The focus remains on the donor's altruism. Families report it feels supportive, not transactional." **PASS (if framed correctly).**
  *   4. **Corruption of Core Value?** RISK. Could undermine the purely altruistic basis of organ donation, reducing public trust.
      *   *Good Answer Needed:* "Evidence from countries doing this (e.g., some in Europe) shows no drop in donation rates or trust. Seen as compassionate support." **PASS (with evidence).**
  *   5. **Distributive Injustice?** LOW RISK. Benefits (support) go to families who chose donation, regardless of wealth. Organs benefit sick patients equitably (via allocation systems). **PASS.**
  *   **RESIDUAL RISK/VALUES CALL:** Passed filters, but risks at Steps 2 & 3 remain. **Recommendation:** APPROVE ONLY IF:
      *   Reimbursement is standardized, modest, covers only verified expenses.
      *   Clearly framed as gratitude/support, NEVER as payment/inducement.
      *   Decoupled from the donation decision process (offered after consent/retrieval).
      *   Monitored for any negative impact on trust/donation motives.
      *   *(Tool Outcome: Conditionally Approvable. Requires careful implementation).*

  **3. Letting a Company Buy Plasma from Our Patients**

  *   1. **Direct Harm?** NO. Plasmapheresis is generally safe for healthy adults.
  *   2. **Undue Inducement?** HIGH RISK/YES. Plasma "donation" centers often target low-income areas. Payment ($50-$100/session) is significant income for the vulnerable, creating strong pressure to donate frequently despite potential fatigue/minor health impacts.
      *   *Answer:* "Payment is substantial and targets populations where it constitutes meaningful income. Frequent donation is encouraged." **STOP. Recommend REJECTION.** *Rationale: Classic case of undue inducement exploiting economic vulnerability.*
  *   *(Tool Outcome: Reject. Your Personal View: You might see it as acceptable, common practice. Tool flags exploitation risk as primary blocker).*

  **Where the CRF Might Misfire:**

  1.  **Overly Conservative on Established Practices (e.g., Plasma):** It correctly flags the *philosophical* exploitation concern in plasma sales, which is very real. However, since it's a widespread, legal practice with clear medical benefits, the committee might feel the tool is impractical here. The tool prioritizes avoiding exploitation over maintaining the status quo or perceived benefits.
  2.  **Underestimating Context for "Gifts" (e.g., Funeral Reimbursement):** If the reimbursement is implemented poorly (e.g., high dollar amount, mentioned during consent), the tool might pass it at Step 3 ("if framed correctly") when in reality, the local community might *perceive* it as payment, corrupting the gift relationship. The tool relies on good-faith implementation which might not happen.
  3.  **The "Net Benefit" Blind Spot:** Passing all filters triggers the values call, where massive lifesaving benefits (e.g., a *well-regulated* kidney donor compensation pilot saving thousands) *might* justify overriding residual risks. The tool forces this to be an explicit, weighted argument, not a default. A purely utilitarian committee might find this step frustrating.
  4.  **Novel Technologies:** For something like significant payment for novel, very low-risk bio-sample donation (e.g., large volume of a specific cell type via new apheresis), the tool might pass Step 1 (no *significant* harm) but struggle with Steps 3 & 4 (is this instrumentalization? Does it corrupt research norms?). Novelty creates uncertainty.

  **Key Advantages for Your Role:**

  *   **Structured:** Forces the committee to confront *specific* philosophical concerns in a logical order, moving beyond gut feelings.
  *   **Defensible:** Provides clear "buckets" for rejection based on established ethical objections. "This fails because it constitutes undue inducement for vulnerable populations" is stronger than "It feels wrong."
  *   **Fast:** Focuses analysis on the highest-risk aspects first.
  *   **Transparent:** Makes the values call explicit at the end, rather than hiding it.
  *   **Grounds Debate:** Provides common language for discussing Radin's "market-inalienability," Sandel's "corruption," Satz's "weak agency/desperate exchanges," and Anderson's "respect" without needing the jargon.

  Use this framework to structure your pre-meeting hour: quickly plug the proposal into the filter. If it passes all 5, focus your prep on the Residual Risk/VALUES CALL points for discussion. If it fails early, prepare to clearly articulate *which* filter and *why*. Good luck!
