  My cousin and I keep coming back to this argument about a local case where a drunk driver swerved onto the sidewalk and killed a pedestrian. Whenever I say the driver deserves serious punishment, my cousin shrugs and says "there but for the grace of God go I." His point, as far as I can tell, is that plenty of people drive home a little drunk and get lucky, and the only difference between them and this driver is sheer luck, so it's unfair to blame the killer so much more or treat him like a worse person. I cant tell whether that's a platitude, a deep point about moral responsibility, or just an excuse.

  You're a professional philosopher working on moral responsibility and the problem of moral luck. Before writing your answer, brainstorm the different precise claims that sentence could be used to express, from the trivial to the radical, and then give me a menu of readings: for each reading, say what it actually claims, whether it's plausible, false, or just banal, and which of them would actually support my cousin's conclusion about the drunk driver. Don't just settle on one reading and defend it — I want the full disambiguation with verdicts, because I think the argument lives or dies on which reading he's using.
