prompt: |-
  I'm leading a session in a reading group for non-specialists — people who read widely but have no formal philosophy background. We've read Parfit's hitchhiker scenario from Reasons and Persons, and the session is on the broader idea of rational irrationality. I have forty minutes and a whiteboard. Don't explain the concept to me; plan how I should teach it. What idea has to be firmly in place before the paradox even registers as a paradox? What single example — not the hitchhiker itself — should I use to build the conceptual scaffolding, and what properties must it have that the hitchhiker lacks? I'm anticipating at least three misconceptions: that this is just weakness of will, that the solution is pre-commitment of the Ulysses-and-the-sirens kind, and that the rational thing to do is obviously to pay the driver once you're safe. At what point in the sequence does each of these surface, and how should I handle them — which do I head off before it arises, and which do I let the group stumble into and then correct? I need one question to pose at the end that will tell me whether they've understood the distinction between rational irrationality and simple self-binding, as opposed to just finding the scenario weird. What should I explicitly refuse to cover at this level?
reasoning: |-
  Okay, let me approach this systematically. The user is leading a reading group for non-specialists on Parfit's hitchhiker paradox and rational irrationality. They need a concrete teaching plan with specific components: conceptual scaffolding, misconception handling, and an assessment question. 

  First, I need to identify the absolute prerequisite for understanding the paradox. The hitchhiker scenario only becomes paradoxical when you grasp that rationality could demand creating a future self that acts irrationally. That's the core tension - it's not about weakness of will or standard self-binding. The key foundation is the separation of decision-making across time: earlier-you vs later-you as almost distinct agents with conflicting rational interests.

  For the scaffolding example, I'm considering a modified version of Kavka's toxin puzzle. Why? It shares the core structure (current intention affects outcomes, but carrying it out later is costly with no benefit) but removes the life-or-deakes element of the hitchhiker. This makes it cleaner to analyze. Crucially, it must have these properties: 
  - Payoff depends only on others' belief about your future action (not the action itself)
  - The "irrational" future action has no strategic benefit when performed
  - Unlike the hitchhiker, no pre-commitment devices exist

  Now for the misconceptions:
  - Weakness of will: I'll proactively distinguish this before introducing the paradox. Emphasize that rational irrationality involves instrumentally optimal planning, not failure to follow through.
  - Pre-commitment as solution: I'll let this emerge during discussion, then show why it doesn't resolve the core paradox - you can't bind your future self's beliefs.
  - "Just pay the driver": This will naturally surface after exploring the dilemma. The key is showing that paying is actually irrational for the future self.

  The assessment question needs to test understanding of why this isn't standard self-binding. Something like: "If you could swallow a pill making you certain you'd pay the driver, why would that destroy the incentive to save you?" This exposes whether they grasp that the paradox relies on the driver's belief about your future irrationality.

  I'll explicitly avoid time discounting, multiple equilibria, or evolutionary game theory. Those would derail the session. Whiteboard space should focus on payoff matrices and timeline diagrams - visual clarity is crucial for non-specialists.

  Timing breakdown: 10 mins for foundations, 15 mins on the scaffolding example, 10 mins for hitchhiker application, 5 mins for Q&A with the assessment question. Any deeper issues can be addressed in follow-ups.
answer: |-
  Here’s a structured 40-minute teaching plan focused on building conceptual clarity and preempting misconceptions:

  ---

  ### **Core Foundation to Establish First (10 mins)**
  **The non-negotiable idea:**  
  *"Rationality can require creating a future self for whom an action is irrational."*  
  **Why it’s essential:**  
  Without this, the hitchhiker is just a story about untrustworthiness. Use the whiteboard to map:  
  ```
  [Stage 1: You choose a PLAN] → [Stage 2: You take an ACTION]  
  ```
  Emphasize: **Stage-1 rationality ≠ Stage-2 rationality**. If they don’t grasp this temporal disconnect, the paradox won’t land.

  ---

  ### **Scaffolding Example: Kavka’s Toxin Puzzle (15 mins)**  
  **The example:**  
  *"A billionaire offers you $1M tonight if you sincerely intend at 8 PM to drink a harmless (but agonizing) toxin at 9 AM tomorrow. You get the money even if you change your mind later."*  

  **Why this over hitchhiker? It has critical properties hitchhiker *lacks*:**  
  | Property          | Toxin Puzzle                          | Hitchhiker                     |  
  |-------------------|---------------------------------------|--------------------------------|  
  | **No coercion**   | You can walk away unscathed           | Driver threatens death         |  
  | **Action’s cost** | Pure suffering (no strategic effect)  | Payment affects survival       |  
  | **Belief trigger**| Money depends ONLY on your *intention*| Rescue depends on driver’s *belief* |  

  **Whiteboard flow:**  
  1. Map payoffs:  
     - Intend to drink + don’t drink → **$1M** (optimal)  
     - Intend to drink + drink → **$1M + agony** (irrational at Stage 2)  
     - Never intend → **$0**  
  2. **Key Q for group:** *"What’s rational at 8 PM? What’s rational at 9 AM?"*  
  3. Reveal the tension:  
     - Stage 1: It’s rational to *intend* to drink (to get $1M)  
     - Stage 2: It’s irrational to *actually* drink (no benefit)  

  **This isolates rational irrationality:** You must create a future self that "irrationally" follows through to make your Stage 1 intention credible.  

  ---

  ### **Handling Misconceptions (10 mins)**  
  Preempt **weakness of will** BEFORE introducing hitсhhiker:  
  - *"Weakness of will is failing to do what you believe is best. Here, drinking the toxin isn’t best at Stage 2—it’s objectively pointless. This is different."*  

  Let the group stumble into **"just pre-commit!"** when discussing hitсhhiker:  
  - When they suggest it: *"Great idea! But how? The driver won’t accept a contract. And if you carry a device forcing payment, why would he believe you’d use it?"* → Highlight that pre-commitment only works if it alters beliefs.  

  Let them voice **"just pay the driver!"** AFTER exploring the dilemma:  
  - *"Why would your future self pay? You’re safe—paying costs money with zero benefit. If you pay, weren’t you ‘irrational’? But if you don’t, the driver shouldn’t have saved you!"* → Reveals the loop.  

  ---

  ### **Assessment Question (5 mins)**  
  **Ask:**  
  *"If you could swallow a pill at the desert start that guaranteed you’d pay the driver later, would the driver rescue you? Why is this different from Ulysses tying himself to the mast?"*  

  **What reveals understanding:**  
  - Correct: Pill makes payment certain → Driver rescues → No paradox. *But* unlike Ulysses, this isn’t self-binding against temptation; it’s eliminating the *need* for future irrationality.  
  - Shallow: "Pill fixes it" without explaining why belief/credibility shifts.  

  ---

  ### **Explicitly Exclude (Declare upfront)**  
  *"We won’t solve the paradox today, debate moral obligations, or discuss game theory equilibria. Focus: Why is this a uniquely puzzling form of rationality?"*  

  ---

  ### **Timeline & Whiteboard Layout**  
  ```
  0-10 min: [Temporal Disconnect]  
             └─ "Stage 1 vs. Stage 2 rationality"  

  10-25 min: [TOXIN PUZZLE]  
             ├─ Payoff matrix  
             └─ "Intention vs. Action"  

  25-35 min: [HITCHHIKER APPLICATION]  
             ├─ Map to toxin structure  
             └─ Misconception fixes  

  35-40 min: [ASSESSMENT Q] → Pill vs. Ulysses  
  ```

  This forces clarity on the core mechanism: Rationality demands manufacturing a future state where you act against your interests *because* that state’s existence enabled prior gains. Anything else (survival, promises) is noise.
