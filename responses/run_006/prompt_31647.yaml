answer: |-
  ## Dissertation Prospectus: The Fink/Mask Distinction as Artifact of Description

  **Research Question:** Does the distinction between *finks* (disposition-removers) and *masks* (manifestation-blockers) collapse under a sufficiently precise, fixed specification of stimulus (S), manifestation (M), and background conditions (C), such that the difference tracks only our choices in regimenting the causal story, not distinct metaphysical categories?

  **Background & Problem:** The simple counterfactual analysis (SCA) of dispositions (x is disposed to M when S iff if S occurred, x would M) faces counterexamples. *Finks* (e.g., Martin's wire made dead *as* touched) remove the disposition *upon* S, making the counterfactual false despite the initial disposition. *Masks* (e.g., Lewis' sorcerer protecting fragile glass) leave the disposition intact but prevent M *despite* S, also falsifying the counterfactual. The standard view treats these as distinct *worldly* interference types: finks affect the disposition itself *in response to* S, masks affect the manifestation *pathway*. However, classifying specific cases (e.g., a safety mechanism on a machine, a protective coating on salt) often proves ambiguous. Does calling something a fink versus a mask depend primarily on *how finely we describe S, M, and C*, and how we parse the causal sequence, rather than an objective metaphysical difference? My suspicion is yes: the distinction is description-sensitive in a way that undermines its status as reflecting fundamental ontological categories.

  **Existing Positions:** Proponents of the distinction (Martin, Lewis, Clarke) correctly identify distinct causal *scripts* that challenge the SCA. However, they largely presuppose the robustness of the fink/mask categorization without systematically addressing the significant role description plays in applying it. Critics of dispositions (e.g., some eliminativists) might exploit this ambiguity, but haven't focused on collapsing *this specific distinction*. Sophisticated conditional analyses (e.g., incorporating causal bases or ceteris paribus clauses) aim to handle the counterexamples but often implicitly rely on the fink/mask categorization without resolving its potential instability under redescription.

  **Proposed Method (6-Month Plan):**
  1.  **Case Analysis & Redescription (Months 1-3):** Systematically construct and analyze a comprehensive set of paradigmatic and borderline cases (e.g., antidotes, protective devices, environmental blockers). For each case:
      *   Vary the grain of description for S (e.g., "impact" vs. "impact exceeding force X"), M (e.g., "dissolving" vs. "dissolving in water within time T"), and C (included vs. excluded).
      *   Assess how these variations shift the classification between "finkish" and "masked".
      *   Identify the minimal causal description necessary to force a unique classification, if possible.
  2.  **Formal Restatement (Months 4-5):** Develop a formal model (e.g., using possible worlds semantics with explicit causal structures, or structural equation models) to represent dispositions, S, M, C, and interfering factors. The goal is to demonstrate rigorously that:
      *   Within a *fixed* model (precisely defined S, M, C, causal links), the formal representation of an interfering factor does not cleanly separate into two distinct types corresponding to finks and masks; its effect is contextually determined by the model's structure.
      *   Shifting the model's parameters (redescribing S, M, C) can recast the *same* worldly scenario as either finkish or masked.
  3.  **Synthesis & Argument (Month 6):** Synthesize findings to argue that the fink/mask distinction is not metaphysically fundamental but emerges from pragmatic choices in causal modeling and description. It primarily tracks *how we conceptualize the interaction* rather than *what kind of thing the interferer is*.

  **Why this method?** Trading intuitions about cases is vulnerable to implicit descriptive biases. Constructing varied descriptions of cases and formalizing the analysis forces explicitness about the role of S, M, and C specification. It provides concrete, testable evidence for the dependence of the distinction on regimentation, moving beyond intuition clashes to show *how* the ambiguity arises.

  **Significance & Evaluation:** Success would significantly challenge a foundational distinction in contemporary dispositional metaphysics, suggesting the work of handling counterexamples lies more in careful causal description than in positing distinct metaphysical interference types. It would push for greater precision in specifying dispositional properties and their conditions.

  **What counts as failure?** If, despite exhaustive redescription and formal modeling, a robust, description-*in*variant criterion emerges that cleanly separates worldly finks from masks *based solely on the causal role of the interferer relative to the disposition's persistence*, this would falsify my collapse hypothesis. **However, this would *not* render the project a failure.** It would constitute a major positive result: successfully defending the metaphysical robustness of the distinction against a serious challenge, *using novel methods (systematic redescription and formal modeling)*. The project's core contribution is rigorously testing the stability of this key distinction, regardless of the outcome. Either result advances the debate meaningfully.
