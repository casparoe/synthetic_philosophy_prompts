  Also, the user might be conflating the individual decision perspective with the systemic view. From each agent's viewpoint, their action feels evidential, but the system's design ensures that cooperation is stable. So the "extra step" is the precommitment through algorithmic similarity, making actions interdependent logically, not causally. 

