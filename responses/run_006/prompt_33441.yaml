answer: |-
  ### Exam Question  
  **Discuss the puzzle of material constitution using the case of the statue (Goliath) and the lump of clay (Lumpl). Explain why this case resists "cheap" resolutions that appeal to temporal or contextual differences alone. Articulate and contrast the *constitution without identity view* (e.g., Lynne Rudder Baker) and the *identity view* (e.g., perdurantist or relative identity approaches). Finally, evaluate how the *grounding problem* challenges the constitution view. Does this problem decisively undermine it? Defend your analysis.**

  ---

  ### Model Answer (Approx. 700 words)  
  The statue/clay puzzle illustrates a profound metaphysical conflict: Goliath (the statue) and Lumpl (the clay lump) appear identical—occupying the same space, made of the same atoms—yet possess different persistence conditions. Goliath is destroyed if flattened, while Lumpl survives. This generates Leibniz’s Law violations: if they share all properties, how can one persist where the other does not?  

  **Resisting Cheap Resolutions**  
  Superficial solutions fail. One might claim Goliath and Lumpl are identical *at a time* but differ *over time*. However, at any moment *t*, both seemingly share all non-modal properties (e.g., mass, shape, location). Their divergent *modal* properties (e.g., "can survive flattening") still violate Leibniz’s Law, which demands indiscernibility in *all* properties. Alternatively, contextualist moves (e.g., "they are identical *as material objects* but not *as artworks*") merely redescribe the problem: why do two entities with identical matter have distinct identity conditions in different contexts? The puzzle’s resilience lies in this tension: co-location suggests identity, but modal differences demand distinctness.  

  **Competing Views**  
  - **Constitution Without Identity (CWI)**: Baker argues Goliath and Lumpl are distinct entities sharing spatial location but standing in a "constitution relation." Lumpl constitutes Goliath without being identical to it. This relation is asymmetric (Lumpl could exist without constituting a statue; Goliath cannot exist unconstituted) and explains their differing persistence conditions. Crucially, CWI treats constitution as a fundamental, irreducible relation.  
  - **Identity View (IV)**: Defenders deny multiplicity. Perdurantists (e.g., Sider) argue Goliath and Lumpl are temporal parts of a single spacetime worm: "Goliath" names a statue-shaped temporal segment, while "Lumpl" names the longer-lived clay segment. Relative identity theorists (e.g., Geach) claim they are identical *as material bodies* but distinct *as statues vs. lumps*. Both IV approaches reject co-located distinct objects but require contentious ontologies (temporal parts or context-dependent identity).  

  **The Grounding Problem for CWI**  
  If Goliath and Lumpl are distinct despite sharing all matter and location at *t*, *what grounds their difference*? The grounding problem (GP) demands an explanation for why they diverge in persistence conditions if they are materially and spatially indistinguishable. Baker responds that Goliath has *higher-order properties* (e.g., being an artwork) derived from social/intentional facts, while Lumpl has only physical properties. Thus, their modal differences are grounded in Goliath’s relational, functional properties.  

  However, GP proponents (e.g., Bennett, Sider) argue this merely pushes the question: why do these relational properties attach to *this* portion of clay rather than generating a new entity? If Goliath is distinct, its properties must be grounded in intrinsic features, but CWI posits no such features beyond Lumpl’s. This risks either circularity (Goliath’s existence grounds its properties) or arbitrariness (no clear reason why relational facts spawn new objects). While GP does not *refute* CWI, it exposes a lacuna: CWI must either deny that differences require grounding (risking incoherence) or posit brute facts (weakening explanatory power).  

  **Conclusion**  
  The statue/clay puzzle remains contested because it forces a choice between CWI’s ontological pluralism (facing GP) and IV’s revisionism (requiring exotic ontologies). Specialists largely agree that cheap resolutions fail and that GP is philosophically serious, but they disagree on whether IV’s costs outweigh CWI’s grounding burden. GP does not decisively undermine CWI, but it compels constitution theorists to clarify the metaphysics of property grounding.  

  ---

  ### Marking Scheme  
  **A Answer (Excellent)**  
  - **Puzzle Mechanics**: Explicitly identifies Leibniz’s Law violation via *modal* differences (e.g., "Lumpl can survive flattening; Goliath cannot") and *rejects* temporal/contextual fixes as inadequate.  
  - **View Articulation**:  
    - Clearly defines CWI’s "fundamental, asymmetric constitution relation" and IV’s core commitment to *one entity* (via perdurantism *or* relative identity).  
    - Contrasts CWI’s object-pluralism with IV’s ontology-revision.  
  - **Grounding Engagement**:  
    - States GP as a challenge to *explain differences without intrinsic grounds*.  
    - Evaluates Baker’s "relational properties" reply *and* the rebuttal (e.g., "relational properties don’t ground *entity distinctness*").  
    - Concludes neutrally: GP is a *cost* for CWI but not a *refutation*.  
  - **Dialectical Awareness**: Notes specialist consensus on cheap resolutions’ failure but disagreement on GP’s severity/IV’s viability.  

  **B Answer (Good but Incomplete)**  
  - **Puzzle Mechanics**: Describes co-location and modal differences but *does not rigorously link to Leibniz’s Law* or fully dismiss cheap resolutions.  
  - **View Articulation**: Explains CWI and IV but *vagueness persists* (e.g., omits asymmetry in constitution or misstates perdurantism).  
  - **Grounding Engagement**: Recognizes GP as "CWI can’t explain differences" but *superficially treats replies* (e.g., mentions "relational properties" without critique).  
  - **Dialectical Awareness**: Identifies GP as a challenge but overlooks *why* specialists remain divided.  

  ---

  ### Common Mistakes & Penalties in Marking  
  1. **Misstating the Puzzle** (↓ B): Describing Goliath/Lumpl as "different after squashing" but not explaining *simultaneous* Leibniz’s Law violation. *Penalty: Loses "Puzzle Mechanics" A-point*.  
  2. **Cheap Resolution Endorsement** (↓ B/C): Claiming "they are identical at *t* but different later" as a solution. *Penalty: Fails "Resists Cheap Resolutions" criterion*.  
  3. **Grounding Oversimplification** (↓ B): Reducing GP to "CWI can’t explain how they differ" without specifying *grounding of persistence conditions*. *Penalty: Loses "Grounding Engagement" depth*.  
  4. **Strawmanning Views** (↓ B/C): E.g., "Perdurantism says Goliath is an illusion." *Penalty: Inaccurate articulation penalized in "View Contrast"*.  
  5. **Consensus Misrepresentation** (↓ B): Asserting "specialists reject CWI due to GP" (contested) or "IV is the consensus" (false). *Penalty: Loses "Dialectical Awareness" point*.  

  This question targets **causal understanding** (why cheap fixes fail), **doctrinal precision** (CWI/IV mechanics), and **critical engagement** (GP’s meta-metaphysical weight). The A/B divide hinges on rigor in Leibniz’s Law, grounding, and neutrality on contested claims.
