prompt: |-
  You are an expert in confirmation theory and Bayesian epistemology. Please think through this carefully — start by laying out the possible principles that could be at work, test them against my cases one by one, and don't just give me a name for a position. I want to know what principle actually fits and which of my verdicts, if any, I'd have to revise.

  I just spent a long evening arguing with a friend about whether old evidence can confirm a theory, and I came away with a clearer sense of my gut reactions but no clearer on what principle they add up to. I'm hoping you can help me find it.

  Here are my verdicts on six cases:

  1. The perihelion of Mercury was known for decades before Einstein published general relativity. GR predicted it. That feels like genuine confirmation. If someone told me Mercury doesn't count as evidence for GR because we already knew about it, I'd think they were missing the point.

  2. A colleague runs a study, gets noisy data, and spends a weekend trying different models until one fits beautifully. He then writes it up as if the model was specified in advance. That feels like cheating — the fit barely confirms the model at all, even though technically the data was old by the time he finished tinkering.

  3. The Higgs boson: the Standard Model predicted it, and then we found it. That's about as strong a confirmation as I can imagine. Much stronger than if the Standard Model had been built after the fact to accommodate a particle we'd already detected.

  4. Suppose a physicist in 1920, who had never heard of Mercury's perihelion, independently derives GR and then learns about Mercury. For her, the perihelion is psychologically novel. Does it confirm GR more for her than it did for Einstein? My gut says no — confirmation shouldn't depend on what the theorist happened to have heard of.

  5. The cosmic microwave background was predicted by Big Bang cosmology before it was discovered, which strongly confirmed the theory. But if the CMB had been discovered first as an unexplained anomaly, and then someone proposed the Big Bang to explain it, would that confirm the theory less? I think yes — but it would still confirm it some. So I don't want to say old evidence never confirms, and I don't want to say it confirms just as much as novel evidence.

  6. A detective finds a fingerprint at a crime scene. She forms a hypothesis about the suspect, and the fingerprint matches. Later we learn she had subconsciously glimpsed the fingerprint before forming the hypothesis. Does that matter? I want to say no — the fingerprint still confirms the hypothesis — but I can't articulate why this feels different from case 2.

  Is there a coherent principle of confirmation that captures all or most of these? If some of my verdicts have to go, which ones and why? And what does the best principle you can find say about the problem of old evidence as it's usually discussed in Bayesian epistemology?
reasoning: |-
  Okay, let me start by really unpacking the user's query. They're clearly deep into confirmation theory and Bayesian epistemology, given how they've structured their cases. They want a principle that ties together their six intuitions about old evidence confirming theories. The challenge is that some cases seem contradictory at first glance. For example, Mercury's perihelion confirms GR (case 1), but the tinkered model doesn't (case 2). The user also mentions Bayesian epistemology, so I need to address the standard problem of old evidence where P(e) = 1.

  First, I should list possible principles. The traditional Bayesian view struggles because if evidence is already known, P(e) = 1, so P(e|h) / P(e) = P(e|h), which doesn't increase the probability. But the user rejects this in case 1. So maybe counterfactual probability or knowledge partitioning? 

  Looking at case 1: Mercury's perihelion. The user feels it confirms GR despite being old. That suggests that the derivation of the prediction from the theory matters, even if the evidence was known. Case 2 is different because the model was adjusted to fit the data, so it's ad hoc. Here, the principle might be about whether the evidence was used in constructing the hypothesis. 

  Case 3 with the Higgs boson highlights predictive success versus accommodation. Prediction seems stronger. Case 4 shows that the theorist's knowledge shouldn't affect confirmation, which points to an objective standard. Case 5 with CMB discovery implies that prediction is stronger than accommodation, but accommodation still has some weight. Case 6 is tricky because subconscious knowledge doesn't negate confirmation, unlike case 2 where active tinkering occurred.

  The key might be how the evidence informs the hypothesis. If the hypothesis was built to fit the evidence, it's weaker. If the hypothesis predicts the evidence without being tailored, it's stronger. The user's intuition in case 6 suggests that the method of hypothesis formation matters, not the theorist's awareness. 

  The best principle seems to be a combination of counterfactual robustness and avoiding ad hoc adjustments. For case 2, the model isn't robust because it was tuned to the data. In case 6, the detective's hypothesis wasn't adjusted to the fingerprint, so it confirms. Bayesian-wise, using counterfactual probabilities where P(e) isn't 1 in the context of the hypothesis derivation could resolve the old evidence problem. The user might need to reconcile cases 5 and 4, but the principle holds that predictive use is key.
answer: |-
  Based on your detailed cases and intuitions, a coherent principle emerges that captures *most* of your verdicts. The core idea is **the epistemic significance of *how the hypothesis relates to the evidence in the context of its justification*.** Specifically:

  **The Robustness Principle:**  
  Evidence *E* confirms hypothesis *H* strongly to the extent that *H*'s ability to account for *E* is **robust** and **non-ad-hoc**. This robustness is demonstrated when *H* either:
  1.  **Predicts** *E* independently (i.e., *H* was formulated *without* using *E* to tailor its parameters or structure), OR
  2.  **Explains** *E* as a necessary consequence of its core structure/mechanisms in a way that isn't easily adjustable post-hoc *just* to fit *E*.

  **This principle prioritizes the *logical and justificatory relationship* between *H* and *E* over the *temporal order* or *subjective novelty*.**

  Let's test this principle against your cases:

  1.  **Mercury's Perihelion (GR):** *Strong Confirmation*. GR predicts Mercury's orbit as a *necessary consequence* of its core equations (curved spacetime). The derivation is robust; Einstein didn't adjust GR's fundamental structure *for* Mercury. The pre-existing knowledge doesn't negate the robust explanatory fit. **Fits.**
  2.  **Tinkered Model:** *Weak/Minimal Confirmation*. The model's fit is *not robust*. It was explicitly adjusted ("tinkered") to match *this specific dataset*. Its ability to account for the data is highly *ad-hoc* and dependent on the tinkering process itself. **Fits.** (Your "cheating" intuition reflects the lack of robustness).
  3.  **Higgs Boson (Predicted):** *Strong Confirmation*. The Higgs mechanism is a core, non-adjustable component of the Standard Model (SM). Its prediction wasn't tweaked post-hoc; it fell out necessarily from the theory's structure to solve a fundamental problem (mass). **Fits.**
  4.  **1920 Physicist & Mercury:** *Same Confirmation as for Einstein*. The robustness of the relationship (GR *necessarily implies* the perihelion shift) is objective. It doesn't depend on the physicist's prior knowledge. The confirmatory power lies in the *derivation* linking *H* to *E*, not in subjective surprise. **Fits.** (Your "gut says no" is explained).
  5.  **CMB (Predicted vs. Accommodated):**
      *   *Predicted (Actual History):* *Strong Confirmation*. CMB falls out as a necessary consequence of the hot, dense early universe described by Big Bang cosmology.
      *   *Accommodated (Counterfactual):* *Weaker but still Some Confirmation*. Big Bang cosmology *can* robustly explain the CMB as a core consequence. However, the strength is less because the *process of theory construction* might have been (or might be suspected to have been) *influenced* by the existence of the known anomaly. The fit is potentially less surprising. **Fits your "yes, but less" verdict.** The principle explains the difference: prediction maximally demonstrates robustness; accommodation *might* involve less robustness depending on how the theory was built, but a truly robust core explanation still provides confirmation.
  6.  **Detective's Fingerprint (Subconscious):** *Confirmation Stands*. The detective's hypothesis (about the suspect) wasn't *constructed or adjusted* based on the fingerprint evidence, even subconsciously in its formation. The match arises from the hypothesis itself (linking the suspect to the crime scene). The *process of justification* wasn't contaminated by tailoring *H* to *E*. The robustness of the connection (if the suspect did it, their fingerprint should be there) remains intact. **Fits.** (Contrasts with Case 2 where tailoring *did* happen).

  **How This Addresses the Bayesian "Problem of Old Evidence":**

  The standard Bayesian problem is: If *E* is already known (P(*E*) = 1), then learning *E* cannot increase P(*H*) since P(*H*|*E*) = P(*H*) when P(*E*) = 1. This clashes with Case 1 & 4.

  The Robustness Principle suggests the Bayesian formalization often misses the key aspect. Confirmation isn't primarily about *updating on learning E*, but about *evaluating the logical/structural support E provides for H via its derivation*. Bayesians often handle this using **counterfactual probability** or **knowledge partitioning**:

  *   **Counterfactual Approach:** Calculate the likelihood ratio P(*E*|*H*) / P(*E*|~*H*) *as if E were not known*. This quantifies the *surprisingness* or *explanatory power* of *H* for *E*, capturing its robustness. In Case 1, P(*E*|*GR*) is high (GR entails it), P(*E*|~*GR*) was very low (Newtonian physics couldn't explain it), so the ratio is large, confirming GR strongly, even though *E* was known.
  *   **Knowledge Partitioning:** The agent temporarily "removes" *E* from their background knowledge to calculate how strongly *H* predicts it. This simulates the predictive context.

  The Robustness Principle aligns with the *intuition* behind these Bayesian fixes: confirmation strength depends on how well *H* accounts for *E* in a way that *would have been* surprising or unlikely without *H*, regardless of prior knowledge.

  **Reconciling Case 5 (CMB Accommodated):**

  The principle explains your intuition that accommodated evidence *does* confirm, but less than predicted evidence. *Why* less?

  1.  **Suspicion of Ad-Hocness:** If *E* is known first, there's a greater risk that *H* was built *just* to fit *E*, making the fit less robust (as in Case 2). This risk lowers the *expected* confirmatory power, even if *H* turns out to be robust. The *process* undermines confidence in the robustness.
  2.  **Lower Counterfactual Probability (P(E|~H)):** If *E* was a known anomaly needing explanation, P(*E*|~*H*) might be *higher* in the counterfactual calculation than if *E* was genuinely novel. If we already knew *E* was true and problematic, the probability of *E* existing *without some explanation* might be seen as higher, reducing the ratio P(*E*|*H*) / P(*E*|~*H*).

  **Does Any Verdict Need Revision? (Likely One Minor Tension)**

  The principle fits 5.5 out of 6 cases very well. The only potential tension is with the "still confirm it some" part of **Case 5 (Accommodated CMB)**.

  *   **The Tension:** If the Big Bang theory built *after* the CMB discovery was *genuinely* robust (i.e., the CMB arises necessarily from its core postulates about the hot early universe, not tacked on), then the Robustness Principle suggests confirmation should be just as strong as if it was predicted. Your intuition says it's *less* strong.
  *   **Resolution Options:**
      *   **Revise Verdict?** You *could* conclude that if the accommodated explanation is truly robust (core consequence, not ad-hoc), confirmation *is* equally strong. But this clashes with your strong intuition (and scientific practice) that prediction feels stronger.
      *   **Refine Principle:** The principle likely needs an additional element concerning the **inferential process** or **warrant for belief in *H***. *Predicting* novel *E* provides stronger *warrant* because it demonstrates *H*'s power to anticipate the world, reducing suspicion that *H* was crafted *because of E*. Accommodation provides explanatory power, but less compelling warrant against charges of ad-hocness. This "warrant" aspect is why Case 2 feels like cheating and Case 5 accommodated feels weaker, even if the final logical relationship is robust. It's about *how we came to believe H relates to E*.

  **Conclusion:**

  The **Robustness Principle** (emphasizing non-ad-hoc, necessary derivation) captures the core of your intuitions across Cases 1, 2, 3, 4, and 6, and explains the prediction/accommodation difference in Case 5. It resolves the "old evidence" problem by shifting focus from temporal novelty to the *logical and justificatory relationship* between *H* and *E*, implemented in Bayesian terms via counterfactual probabilities.

  The only minor revision suggested is to potentially strengthen the confirmatory power of *genuinely robust accommodation* in Case 5, aligning fully with the principle. If you find this revision too counterintuitive, the principle can be augmented to include the **strength of warrant** provided by the *process* (prediction vs. accommodation), accepting that robust accommodation confirms but provides less compelling warrant than successful novel prediction. This preserves your Case 5 verdict as-is.

  **In short:** Confirmation depends on *how robustly and non-ad-hocly the hypothesis entails the evidence*, not on when the evidence was learned. This principle vindicates your core intuitions about Mercury, the Higgs, the physicist's discovery, and the detective, explains the problems with tinkering and (partially) accommodated evidence, and resolves the Bayesian puzzle by emphasizing counterfactual explanatory power.
