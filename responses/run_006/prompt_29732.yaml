answer: |-
  Here’s your Q&A prep sheet, prioritizing objections by **likelihood** (✓✓✓ = high, ✓✓ = medium, ✓ = low) and **damage potential** (🔥🔥🔥 = critical, 🔥🔥 = serious, 🔥 = manageable). Replies are calibrated for 2 minutes max, with soft spots noted. Audience-specific phrasing is emphasized.

  ---

  ### **Top Priority Objections & Replies**  
  1. **The Gilbertian (Normative Entitlement)**  
     - **Question (✓✓✓🔥🔥🔥):**  
       *"In the walking case, when one peels off, the other feels entitled to rebuke them—not just disappointed. This entitlement arises *because* they breached a joint commitment. Your individualistic account reduces this to mere moral disappointment, missing the distinctive *relational* obligation Gilbert captures. How is your promissory move anything but ad hoc?"*  
     - **Reply:**  
       "The rebuke stems from *mutual assurances* embedded in the interlocking intentions, not a sui generis commitment. When we form shared intentions, we implicitly signal reliance: ‘I intend that we J, *counting on your intention* to do your part.’ Abandoning the project violates this reliance, triggering promissory obligations—like breaking an implicit agreement. This is *relational* but reducible to individual moral norms (e.g., duties of fidelity), not a new metaphysical layer."  
       - **Soft Spot:** Admits promissory norms *feel* distinct; requires arguing this phenomenology is explained by familiarity, not ontology.  
       - **Concede:** The *feeling* of distinctive obligation is real; **Hold:** It’s explained by moral psychology, not joint commitments.  

  2. **The Searlean (Missing "Togetherness")**  
     - **Question (✓✓🔥🔥🔥):**  
       *"Your account describes coordinated parallelism, not genuine *shared* action. When two people play a duet, there’s a primitive ‘we-intention’—a biological capacity to act *as a plural agent*. Your interlocking intentions are mere ‘I-intentions’ pointing at each other. Where’s the *togetherness*?"*  
     - **Reply:**  
       "The ‘togetherness’ is in the *content* of the individual intentions: each intends *that we J* (e.g., ‘I intend that we paint the house *together*’), and this is reinforced by common knowledge of mutual openness to subplan adjustment. This creates a feedback loop where each sees the other’s actions as part of *our* activity—no irreducible ‘we-mode’ needed."  
       - **Soft Spot:** Struggles with *phenomenology* of joint action feeling unitary.  
       - **Hold Firm:** Reject any primitive we-intention; emphasize functional equivalence.  

  3. **Bratmanian (Common Knowledge’s Weight)**  
     - **Question (✓✓✓🔥🔥):**  
       *"Common knowledge is too static to explain the dynamic responsiveness in shared agency. When painting, we constantly adjust subplans reactively—e.g., if you start rolling, I’ll cut in. Your model treats this as pre-coordinated, but it’s often improvised. How can common knowledge handle unscripted coordination without collapsing into a black box?"*  
     - **Reply:**  
       "Common knowledge isn’t a snapshot—it’s sustained by *ongoing responsiveness*. When you adjust your subplan (e.g., switching rollers), I see it, know you see me see it, and revise my intention accordingly. This is captured by nested beliefs about *conditional intentions* (‘I intend to cut in edges *if* you roll walls’). No new machinery is needed."  
       - **Soft Spot:** Complex nested beliefs strain cognitive plausibility.  
       - **Concede:** Real-time adjustments are messy; **Hold:** They reduce to belief updating.  

  4. **Decision Theorist (Luck & Team Reasoning)**  
     - **Question (✓✓🔥🔥):**  
       *"Suppose two agents have meshing subplans and common knowledge purely by luck (e.g., each independently plans to push a car, unaware the other is doing the same). They succeed, but there’s no shared intention. Doesn’t this show you need *team reasoning*—a mode where individuals act as ‘we’—to distinguish luck from genuine sharing?"*  
     - **Reply:**  
       "Crucially, shared intention requires *interdependence*: each intends *that we J* only if the other does their part. In your case, neither *relies* on the other—it’s parallel solo acts. My account excludes this via the *interlocking* condition: each agent’s intention is conditional on the other’s participation and common knowledge of this mutuality."  
       - **Soft Spot:** Risk of circularity (interlocking defined via shared goal).  
       - **Hold:** No team reasoning; luck cases lack mutual conditional intentions.  

  5. **Wittgensteinian (Project Suspicion)**  
     - **Question (✓🔥):**  
       *"Why analyze ‘shared intention’ at all? We learn to collaborate by *doing*, not by having interlocking mental states. Your project feels like dissecting a joke—you might ‘capture’ it but kill the phenomenon. What practical or conceptual problem does this solve?"*  
     - **Reply:**  
       "When collaborations fail—e.g., one abandons a project—we blame differently than if they merely failed solo. *Why*? My account clarifies responsibility: the violator breached reliance-based obligations traceable to individual attitudes. This helps resolve disputes in ethics/law without mysterian group-minds."  
       - **Soft Spot:** Appears instrumentalist; doesn’t engage anti-reductionist intuitions.  
       - **Concede:** Analysis can’t replace lived experience; **Hold:** It addresses normative puzzles.  

  ---

  ### **Strategic Concessions**  
  - **Concede Early:**  
    - "Common knowledge is demanding; in practice, approximations often suffice."  
    - "Normative reactions *feel* distinct—I’m explaining why, not denying the phenomenology."  
  - **Never Concede:**  
    - Sui generis group normativity or irreducible we-intentions.  
    - That interlocking + common knowledge fails to *constitute* (not just cause) shared intention.  

  ---

  ### **The Make-or-Break Reply**  
  **The Gilbertian objection** must land. If the audience accepts that promissory/moral norms explain rebukes without joint commitments, your core thesis survives. Key phrasing:  
  > *"The ‘entitlement to rebuke’ comes from the moral fact that you* invited reliance *and then betrayed it—not from a freestanding group entity. Joint commitments are metaphors for this interpersonal morality."*  

  ---

  ### **The Question You Hope Nobody Asks**  
  **The Circularity Trap:**  
  *"Your ‘interlocking intentions’ include each agent intending ‘that we J.’ But doesn’t ‘we J’ presuppose the shared intention you’re trying to reduce? If so, isn’t your analysis viciously circular?"*  
  - **Why it’s deadly:** Forces you to either admit circularity or posit primitive we-intentions.  
  - **Salvage Strategy:** Reframe "that we J" as shorthand for "that I do my part and you do yours, coordinated toward outcome O." Emphasize this is *constitutive*, not presuppositional:  
    *"The ‘we’ is a placeholder for the structure I’m describing—it’s eliminable upon analysis."*  

  ---

  **Final Prep Advice:** Open by disarming the Gilbertian ("I know Margaret’s walking case will come up—let me preempt..."). Use vivid examples (painting/house collapse > duets). Flag where you *agree* with critics (e.g., "Searle is right about togetherness—I just locate it differently"). Your survival hinges on reframing normativity as emergent moral dynamics, not metaphysical novelty.
