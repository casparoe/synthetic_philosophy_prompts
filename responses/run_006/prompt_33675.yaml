  My friend explained why epistemic logic is a failed project: "The whole thing runs on possible worlds semantics. An agent knows P iff P is true in every world they consider epistemically possible. But here's the issue: logical truths are true in every world, period. So the formalism automatically says every agent knows every logical truth — including impossibly complex ones. Worse, knowledge is closed under logical consequence: if you know P and P logically entails Q, you know Q. This is called the problem of logical omniscience. It's not just an idealization — it's a fatal flaw, because it means epistemic logic can't distingush between what a real person knows and what merely follows from what they know. That's why epistemologists have largely abandoned formal approaches in favor of more naturalistic methods." I'm pretty sure this is unfair — I know formal epistemology is alive and well, and dynamic epistemic logic is a thing. But I can't quite articulate what's wrong with his specific claims. Can you go through it and separate the accurate description of the problem from the overstatements?
