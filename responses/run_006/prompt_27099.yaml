prompt: |-
  I started a job three weeks ago on the behavioral insights team at a state health department, mostly designing defaults and wording for a patient portal, and its made all this stuff weirdly concrete. I've been going back and forth on my actual views, and before I have to sit in a meeting and defend a real decision I want a consistency check. Here's where I've ended up:

  1. Hard paternalism is off the table. Coercing or forcing competent adults for their own good is wrong even when it works.
  2. Nudges are fine because they don't force — all the options stay open, so a nudge can't be said to violate anyone's autonomy.
  3. Opt-out organ donation registration is a good default and I'd defend using it, even though most people never switch it.
  4. A nudge is only acceptable if it's transparent — a person should be able to see what's being done to them and why.
  5. If a nudge works by leaning on a bias the person doesn't know is doing the work (status quo bias, loss aversion, whatever), that's manipulation and I don't think it's acceptable.
  6. The point of a nudge should be to help people get what they themselves already want, not what we've decided is good for them — we should be helping people as they themselves would judge, not as we judge.
  7. Mill's harm principle is basically correct — the state shouldn't step in to protect people from themselves, so any paternalism starts with a strike against it.

  Go through these and tell me which pairs are actually in tension and which only look that way. Don't walk through all 21 pairs, just the ones that need flagging. Rank the real tensions by severity, and for each say what would have to give and what the cheapest fix is. I genuinely can't tell which of these is the problem one, so don't just lecture me or tell me what I'm supposed to drop; I want the audit. Keep it under 600 words.
reasoning: |-
  Alright, the user works on a behavioral insights team at a state health department, focusing on patient portal defaults and wording. They've listed seven principles about paternalism and nudges and want an audit for consistency. Let me start by understanding each point.

  First, they reject hard paternalism (1) and accept nudges because they preserve autonomy (2). Opt-out organ donation is okay despite most people not changing it (3). Transparency is key (4), and nudges shouldn't exploit unknown biases (5). Nudges should align with what people want, not what designers think is good (6). They also endorse Mill's harm principle (7).

  Now, looking for tensions. Point 3 (opt-out organ donation) seems to conflict with points 5 and 6. If most don't switch, it's leveraging status quo bias, which might violate 5. Also, assuming everyone wants to donate conflicts with 6, as it's imposing what designers think is good. 

  Point 4 (transparency) might not resolve this because even if transparent, exploiting bias could still be manipulative per 5. Point 7 (harm principle) might clash with opt-out since it involves state intervention for personal decisions unless harm to others is argued.

  Severe tension between 3 and 5/6. The fix could be redefining the nudge's purpose to help people achieve their own goals, but organ donation is tricky. Maybe emphasizing societal harm reduction as per Mill, but that's a stretch. Cheapest fix is adjusting 3 to allow societal benefit exceptions, but that weakens 7. Alternatively, refine the transparency in opt-out systems to ensure awareness, but that might not address bias exploitation.

  Also, point 2's claim that nudges don't violate autonomy is challenged by 5 and 6. If a nudge manipulates via hidden biases, autonomy is compromised. So 2 needs clarification that not all nudges are equally benign.

  The user needs actionable solutions without dropping principles. Highlighting the organ donation example as the main conflict and suggesting clearer transparency or re-evaluating the societal benefit argument. Emphasize that while opt-out is defensible, it requires acknowledging tension with 5 and 6, possibly accepting a slight weakening of those in specific cases.
answer: |-
  Here's the consistency audit, focusing on key tensions ranked by severity:

  ### Severe Tension (Core Conflict)
  **Points 3 (Opt-out Organ Donation) vs. 5 (No Hidden Bias Exploitation) & 6 (Help People Get What *They* Want)**
  *   **Conflict:** Opt-out donation heavily relies on **status quo bias** (Point 5 violation) to achieve high registration. Most people staying registered isn't necessarily proof they *wanted* it (Point 6). It assumes donation is the desired default state *for them*, which might not be true. You're exploiting a cognitive bias people are unaware of to steer them towards a state *you* deem beneficial.
  *   **Cheapest Fix:** Recalibrate Point 6 to allow helping people act on *widely shared societal values* (like saving lives) *if* robust evidence shows individuals retrospectively endorse the outcome *or* if framed as facilitating a collective good (mitigating Point 7 via indirect harm reduction - lack of organs harms others). This weakens the strict individual desire focus but preserves the opt-out nudge. Alternatively, weaken Point 5 to allow leveraging *mild*, *well-understood* biases for high-stakes social goods with transparency, but this is costlier to autonomy.

  ### Significant Tension
  **Points 2 (Nudges Don't Violate Autonomy) vs. 5 (No Hidden Bias Exploitation) & 6 (Help People Get What *They* Want)**
  *   **Conflict:** If a nudge exploits an *unknown* bias (Point 5) or steers people toward a goal *they don't hold* (Point 6), it *does* functionally violate autonomy, even if options remain technically open (Point 2). The choice architecture manipulates rather than facilitates.
  *   **Cheapest Fix:** Refine Point 2: "Nudges don't *remove* options, but their *acceptability* depends on avoiding hidden manipulation (Point 5) and aligning with user goals (Point 6)." This clarifies that "not forcing" is necessary but not sufficient for ethical acceptability.

  ### Moderate Tension
  **Points 4 (Transparency) vs. 5 (No Hidden Bias Exploitation)**
  *   **Conflict:** Can transparency alone redeem a nudge that exploits a hidden bias? Point 5 says no (the exploitation itself is wrong). Point 4 implies transparency might be sufficient. Knowing *why* a default is set doesn't negate the automatic power of status quo bias.
  *   **Cheapest Fix:** Tighten Point 4: "Transparency is necessary, but insufficient if the nudge primarily works by exploiting a bias the person cannot reasonably counteract even with awareness." This subordinates Point 4 to Point 5.

  **Points 6 (Help People Get What *They* Want) vs. 7 (Harm Principle / State Paternalism Strike)**
  *   **Conflict:** Point 6 justifies *some* paternalism (helping people achieve *their own* goals). Point 7 gives *any* paternalism a "strike." How strong is that strike? Is helping someone overcome procrastination to get a vaccine *they want* still problematic under Point 7?
  *   **Cheapest Fix:** Clarify Point 7: "The state presumptively shouldn't intervene to protect competent adults *from themselves* when no harm to others is involved, *unless* the intervention demonstrably helps them achieve *their own* clearly held goals (Point 6) with minimal coercion." This makes Point 6 a limited exception to Point 7's presumption.

  ### Key Takeaway & Resolution Path
  The **most severe conflict** centers on **opt-out organ donation (Point 3)**. Defending it robustly requires either:
  1.  **Modifying Point 6:** Accept that for high-stakes *societal* benefits with broad (if passive) support, nudges can sometimes align with inferred preferences or collective goals, not just individual active desires.
  2.  **Modifying Point 5:** Accept that leveraging powerful biases like status quo bias *is* permissible *if* the cause is critical (saving lives), transparency exists (Point 4), and opting out is genuinely easy.
  3.  **Modifying Point 3:** Advocate for active choice or enhanced mandated choice for organ donation instead of pure opt-out, reducing reliance on status quo bias (but likely lowering registration rates).

  **Cheapest path:** Slightly weaken Point 6 to encompass helping people act on *latent preferences* or *societal values they likely share* for critical interventions like organ donation, while maintaining strict adherence to Points 4 and 5 elsewhere. This allows you to keep the opt-out default while maintaining strong anti-manipulation principles in most other contexts. Be prepared to explicitly argue the societal harm reduction aspect (lack of organs harms others) to mitigate Point 7.
