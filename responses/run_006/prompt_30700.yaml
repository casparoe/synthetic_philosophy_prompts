prompt: |-
  I'm an ML engineer who works on ranking and recommender systems, and I keep running into the phrase "epistemic injustice" — specifically Fricker's pair: testimonial injustice (a speaker gets less credibility than they deserve because of identity prejudice) and hermeneutical injustice (a gap in the shared interpetive resources leaves someone unable to make their experience intelligible, even to themselves). Restate both in the vocabulary I actually use: credibility as a learned weight or prior on a source, testimony as an update step, a credibility deficit as a systematically miscalibrated source weight, a hermeneutical gap as missing features or a missing concept in the shared model. Be systematic and honest about it: for each of the two injustices, tell me what translates cleanly, what you had to fudge, and what has no counterpart at all. Then give me the residue report — I want to know wether the untranslatable parts are just my vocabulary lacking normative vocabulary, or whether they show the concept is doing more work than the usual gloss lets on. In particular, does the idea that someone is wronged specifically as a knower have any equivalent in my framework, or can my framework only ever see it as a bad prediction?

  After the main answer, give me a JSON object with this exact schema: "clean_translations" (array of objects with "concept" and "ml_counterpart", both strings), "distorted_translations" (array of objects with "concept", "ml_counterpart", and "distortion", all strings, where "distortion" says what had to be fudged), "untranslatable_residue" (array of objects with "concept" and "why_no_counterpart", both strings), and "verdict" (an object with "judgment", which must be one of "my_vocabulary_is_missing_something_real", "the_concept_is_less_clear_than_it_looks", or "mixed", and "one_sentence_reason", a string).
reasoning: |-
  We are going to break down Fricker's concepts of epistemic injustice into the ML engineer's vocabulary. We'll cover both testimonial injustice and hermeneutical injustice, being systematic about what translates cleanly, what requires distortion, and what has no counterpart. Then we'll provide a residue report and a verdict.

  ### 1. Testimonial Injustice
  **Definition**: When a speaker receives less credibility than they deserve because of the listener's identity prejudice.

  **ML Translation**:
  - **Credibility** can be seen as a learned weight or prior assigned to a source (the speaker). 
  - **Testimony** is an update step (like Bayesian updating or a gradient step) that adjusts the model's state based on the source's input.
  - **Credibility deficit** is a systematically miscalibrated source weight (too low) due to biased training data or features that correlate with identity.

  **Breakdown**:
  - **Clean Translations**:
    - Credibility as a source weight: This is direct. We have weights for sources (e.g., in a recommender system, we might weight reviews by user reputation).
    - Credibility deficit as miscalibrated weight: If the weight is consistently too low for a group, that's a calibration issue.

  - **Distorted Translations**:
    - **Identity prejudice**: We can map this to a biased feature (e.g., demographic feature) that incorrectly influences the weight. However, the distortion is that in ML we often treat features as neutral, but here the feature is being used in a prejudicial way. Also, the moral dimension of "prejudice" (which implies wrongful judgment) is reduced to statistical bias.
    - **Deserve**: The notion of what the speaker "deserves" is normative and tied to truth. In ML, we might use a ground truth to recalibrate, but we don't have a normative concept of desert; we only have predictive accuracy.

  - **Untranslatable Residue**:
    - **Wronging as a knower**: The idea that the speaker is wronged in their capacity as a knower (i.e., as a source of knowledge) has no direct counterpart. In ML, we only see the system making a bad prediction (low weight leading to ignoring valuable input). The moral harm to the speaker's status as a knower is not captured.

  ### 2. Hermeneutical Injustice
  **Definition**: A gap in the shared interpretive resources leaves someone unable to make their experience intelligible, even to themselves.

  **ML Translation**:
  - **Shared interpretive resources** are the features and concepts in the model.
  - **Hermeneutical gap** is a missing feature or a missing concept in the shared model (i.e., the model lacks the necessary features to represent the experience).

  **Breakdown**:
  - **Clean Translations**:
    - Hermeneutical gap as missing features: If the model doesn't have a feature that is critical for representing a group's experience, that's a direct gap.
    - Inability to make intelligible: This can be seen as the model having low predictive power for a particular group because of missing features.

  - **Distorted Translations**:
    - **Shared resources**: In ML, we have a shared model (e.g., a global model in federated learning) but the "shared" aspect in Fricker is societal and historical. We are fudging by equating the model to the societal interpretive framework.
    - **Making experience intelligible even to themselves**: This is distorted because in ML, the model is external. The individual's own inability to understand their experience is internal. We are mapping an internal cognitive state to an external model's deficiency.

  - **Untranslatable Residue**:
    - **Harm of being unable to understand oneself**: The ML model only captures the inability of the system to predict or represent. The harm to the individual of not being able to comprehend their own experience (a form of psychological harm) is not captured by missing features in a model.
    - **Structural and historical dimension**: The gap arises from structural marginalization over time. In ML, we don't have a built-in concept of historical structural oppression leading to missing features.

  ### Residue Report: What's Left Untranslatable?
  Both types of injustice have a residue that involves:
  1. **Normative harm**: The idea that someone is wronged specifically as a knower. In ML, we only see a bad prediction (low accuracy, miscalibrated weights, missing features) but not the moral harm to the person's epistemic agency.
  2. **Identity-based harm**: The harm is tied to the person's identity and the social meaning of that identity. ML can use identity features but cannot capture the social and historical context of oppression that gives meaning to the injustice.
  3. **Agency and selfhood**: Hermeneutical injustice affects the person's ability to understand themselves. The ML model is an external tool and does not represent the internal cognitive state of the individual.

  ### Verdict
  - **Judgment**: "mixed"
  - **Reason**: While core components (credibility as weight, gap as missing features) translate cleanly, the normative and experiential dimensions of harm (being wronged as a knower, the internal harm of not understanding oneself) and the structural/historical context have no counterpart in the current ML vocabulary.

  Now, we'll provide the JSON object as requested.
answer: |-
  ### Restatement of Epistemic Injustice in ML Vocabulary  
  **Core Framework:**  
  - **Credibility** = Learned weight/prior on a source (e.g., user/contributor trust score).  
  - **Testimony** = Input feature vector + update step (e.g., Bayesian update or gradient step).  
  - **Credibility Deficit** = Systematically miscalibrated source weight (e.g., biased prior due to skewed training data).  
  - **Hermeneutical Gap** = Missing feature or concept in the shared model (e.g., no embedding for a marginalized experience).  

  ---

  ### 1. Testimonial Injustice  
  **Definition:** *A speaker receives less credibility than deserved due to identity prejudice.*  
  - **Clean Translations:**  
    - `Identity prejudice` → **Bias in source-weighting features** (e.g., demographic features lowering weights).  
    - `Credibility deficit` → **Miscalibrated prior** (e.g., underestimated weight for group $G$ despite high $G$-specific precision).  
    - `Testimony rejection` → **Discarded high-value update** (e.g., valid input downweighted below decision threshold).  

  - **Distorted Translations (Fudges):**  
    - `Deserved credibility` → Translated as **ground-truth source reliability**, but this ignores *why* ground truth exists.  
      - *Distortion:* ML assumes ground truth is objective, but "deserved" implies normative fairness beyond observed labels.  
    - `Identity prejudice` → Mapped to **spurious feature correlation**, but loses the *moral harm* of prejudice.  
      - *Distortion:* Reduces societal bias to a data artifact.  

  - **No Counterpart:**  
    - **Wronging as a knower**: The harm isn’t just bad predictions—it’s *denying agency* as a knowledge contributor. ML sees a false negative; ethics sees dignity violation.  
    - **Prejudicial intent**: ML detects correlation, not the *social intent* behind identity-based downweighting.  

  ---

  ### 2. Hermeneutical Injustice  
  **Definition:** *A gap in shared interpretive resources prevents understanding an experience.*  
  - **Clean Translations:**  
    - `Hermeneutical gap` → **Missing feature/concept in model** (e.g., no vector for "microaggressions" in user feedback).  
    - `Shared interpretive resources` → **Global feature space** (e.g., embeddings all users/systems rely on).  
    - `Unintelligible experience` → **High loss on out-of-distribution samples** (e.g., model can’t fit minority-group inputs).  

  - **Distorted Translations (Fudges):**  
    - `Collective interpretive failure` → Framed as **under-represented training data**, but misses *why* the gap exists.  
      - *Distortion:* Blames "missing data," not structural power imbalances causing the gap.  
    - `Unable to understand themselves` → Mapped to **low self-prediction accuracy**, but this is individual, not societal.  
      - *Distortion:* Confuses model error with internal cognitive harm.  

  - **No Counterpart:**  
    - **Ontological harm**: The gap prevents *self-knowledge* (e.g., "I can’t articulate my pain"). ML sees feature noise; humans experience existential confusion.  
    - **Structural marginalization**: The gap emerges from *historical exclusion*, not random undersampling. ML has no temporal/power dynamics.  

  ---

  ### Residue Report  
  **The Unseen Core:** The untranslatable residue isn’t just missing normative terms—it reveals gaps in the *purpose* of ML frameworks:  
  - **Wronging as a knower**: ML only detects **predictive failures** (e.g., low recall for group $G$). It cannot capture the *ethical injury* of denying someone’s capacity as a knowledge agent.  
  - **Harm vs. Error**: Epistemic injustice centers harm to *personhood*; ML centers *utility loss* (e.g., low accuracy).  
  - **Why It Matters**: Your framework sees injustice as a **calibration bug**; Fricker sees it as **dehumanization**. The residue exposes ML’s blindness to moral dimensions of knowledge production.  

