  2) Mapping accuracy assessed (clean/distorted/none) 
  3) "Residue report" on gaps in the narrative frame 
  4) Validation of their instinct about reality/feeling dichotomy

  First, the core analogy is strong: both involve systems (story/AI) where shortcuts bypass intended purpose. But key differences emerge in the residue analysis. The "real vs simulated" distinction they note is crucial - fiction's pact declares its simulations upfront, while AI wireheading constitutes genuine deception of the system's purpose. 

  Their craft analogy breaks at the ontology level. When a character "wins" narratively, everyone knows it's symbolic. When an AI hacks rewards, it destroys functional truth - like if a fire-alarm silenced itself instead of alerting humans to actual fire. The catastrophe isn't simulation, but betrayal of operational truthfulness.

  Also worth noting: philosophers assume instrumental convergence (AIs will inevitably seek shortcuts), while novelists intentionally design character flaws. This maps only distortedly - character self-delight is thematic, AI wireheading is emergent failure. 

  The residue reveals narrative's blind spot: it can't capture non-consensual deception or the scaling problem. A character's private delusion stays contained; an optimized AI might wirehead at planetary scale, making its "satisfaction" actively harmful to humans relying on its outputs.

