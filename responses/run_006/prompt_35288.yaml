prompt: |-
  I've been going back and forth with a friend on the LessWrong forums about whether 'better than' is actually transitive, and we've kinda hit a wall. You know the classic spectrum arguments — if A is better than B by a tiny margin, and B is better than C by a tiny margin, and so on, you can chain these together and end up with something clearly worse than A being declared 'better than' A. The repugnant conclusion is the famous case, but there are others (Parfit's pain spectrum, the non-identity problem chain, etc.). My friend thinks this just shows that 'better than' must be transitive and therefore our intuitions about the endpoints are wrong — we should bite the bullet on the repugnant conclusion. I think it's more plausible that 'better than' is nontransitive, at least in some domains, and that our endpoint intuitions are doing real normative work.

  So here's what I want: give me your actual credence that 'better than' is transitive across all morally relevant domains (i.e., there is no genuine case where A > B, B > C, but C ≥ A). I want the number, but more importantly I want the decomposition. What are the key sub-questions your credence hangs on? For each, assign a rough probability and a sentence of justification, then show how they combine into your overall number. Then tell me which sub-question your final credence is most sensitive to — i.e., if you could get a definitive answer to one of them, which would move your number the most? And if you think the whole framing is confused somehow (e.g., 'better than' doesn't even have a truth-conditional semantics in these edge cases), say so and decompose that instead. Keep the whole thing to 300 words max.
