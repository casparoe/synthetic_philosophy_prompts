prompt: |-
  I've been reading about cognitive penetration of perception — the idea that what you believe or expect can literally change what you see. And I'm trying to figure out if this means Kuhn and Feyerabend were basically right all along about scientific observation being theory-laden. Like, if my theoretical commitments can penetrate my visual experience, then when two scientists with different paradigms look at the same data, they're literally seeing different things. Doesnt that make scientific objectivity impossible? Give me exactly five points, each a sentence or two, on whether cognitive penetration actually has these kinds of implications for science — no intro or conclusion.
