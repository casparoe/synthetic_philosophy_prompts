prompt: |-
  The Orwellian/Stalinesque debate over the color phi phenomenon has been running since Dennett sharpened it, and by now every move on both sides is familiar and nobody shifts. In the experiment, two differently colored spots flash in succession, and subjects report a single spot that moves and changes color in mid-trajectory. The Orwellian camp says the brain edits the record after the fact, so the subject has a false memory of the moving, color-changing spot; the Stalinesque camp says the brain edits the content before it reaches consciousness, so the moving, color-changing spot is what the subject actually experiences. Dennett's own line was that no experiment could tell these apart and that the question may have no fact of the matter. My working theory is that the impasse is not empirical but terminological: the two sides use the word experience differently — one for the reportable, remembered version of events, the other for an earlier occurrence that may never be reportable — and they are really disagreeing about where to draw the boundary of consciousness, which is a stipulation rather than a discovery. Diagnose what kind of disagreement this actually is, with reasons, and say what, if anything, would count as progress. Answer as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion.
