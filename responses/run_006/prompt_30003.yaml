answer: |-
  Your objection relies on treating "nobody ever knows p" as a stable, eternal truth that can be conjoined with p itself. But crucially, "nobody ever knows p" is *about* the actual world's epistemic history. When we consider a counterfactual situation where someone *does* come to know p, that situation falsifies the second conjunct. In that possible scenario, "nobody ever knows p" is simply false.

  Therefore, the conjunction (p ∧ nobody ever knows p) is true *only in the actual world* (where p is unknown). But it cannot be true in *any* world where someone knows p. Knowability requires that p *itself* is knowable in some possible scenario compatible with its truth – meaning a scenario where, *in that very scenario*, someone knows p. This knowing act inherently alters the truth-value of the second conjunct. The knowability principle applies to the truth *p*, not to the meta-truth *about* our actual ignorance of p conjoined with p. The putative knower in the counterfactual situation would know p, and *also* know that *in their own situation*, p is known – not that p is unknown in our actual world. They cannot know the conjunction you describe because in their world, the second conjunct is false.
