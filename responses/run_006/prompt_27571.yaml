answer: |-
  Here is a specification for models of logically bounded belief, structured as requested:

  ### 1. The Phenomena (Core Cases)
  An adequate model must capture these fundamental limitations of real-world agents:
  *   **Failure under Computational Cost:** An agent presented with a complex logical puzzle (e.g., deriving a consequence requiring 1000 deduction steps) fails to see the implication, even if they possess all relevant premises. *(Example: An average person given axioms of arithmetic cannot derive the Four Color Theorem).*
  *   **Preservation of Trivial Inferences:** The same agent instantly recognizes trivial, immediate consequences. *(Example: Upon believing "It's raining" and "If it's raining, the street is wet," they immediately believe "The street is wet").*
  *   **Partial Awareness & Consideration:** An agent may hold beliefs about `P` without having considered, or being able to readily access, beliefs about logically related propositions `Q` (even if `Q` is a consequence or component of `P`), especially if the connection isn't obvious or requires computation. *(Example: An agent believes "17 is prime" but hasn't actively considered "17 is not divisible by any prime less than or equal to its square root" at this moment, though they could compute it).*
  *   **Local Inconsistency without Global Collapse:** An agent can hold locally inconsistent beliefs (e.g., believing `P` and `¬P` in different contexts or due to oversight) without being modeled as believing *everything* (explosiveness). *(Example: Believing "Light is a wave" in a physics context and "Light is a particle" in another, without actively reconciling the contradiction until prompted).*

  ### 2. The Desiderata

  | Desideratum Name          | Motivating Case                                                                                                | Status                                                                 |
  | :------------------------ | :------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------- |
  | **N1: Reject Closure Under Logical Consequence** | Failure under Computational Cost. An agent believing `A` and `A→B` should *not* automatically believe `B` if deriving `B` exceeds resources. | **Non-Negotiable** (Core to boundedness)                             |
  | **N2: Preserve Trivial/Immediate Inference** | Preservation of Trivial Inferences. Agents *must* be modeled as capable of very simple, "obvious" deductions (e.g., single-step Modus Ponens on actively held beliefs). | **Non-Negotiable** (Without this, agents are irrational, not bounded) |
  | **N3: Resource Sensitivity (Boundedness)** | Failure under Computational Cost. The model must incorporate computational/time/cognitive constraints that explain failures like N1. | **Non-Negotiable** (Defining characteristic)                          |
  | **N4: Distinguish Explicit/Implicit Belief** | Partial Awareness & Consideration. An agent's explicit, actively held beliefs must be distinguishable from beliefs they *would* hold if given unlimited resources (implicit belief). | **Non-Negotiable** (Crucial for partial awareness)                    |
  | **N5: Distinguish Lack of Consideration from Inability** | Partial Awareness & Consideration. Not believing `P` because `P` hasn't been considered must be different from not believing `P` because the agent *cannot* derive it even with effort. | **Non-Negotiable** (Captures key cognitive states)                    |
  | **N6: Allow Local Inconsistency without Explosion** | Local Inconsistency without Global Collapse. Belief sets should tolerate localized contradictions without trivializing (believing everything). | **Non-Negotiable** (Realism about human error/compartmentalization)   |
  | **N7: Avoid Incoherence (Global Consistency)** | Sanity Check. While local inconsistency is allowed, the agent's belief state shouldn't be modeled as fundamentally *incoherent* (e.g., simultaneously believing `P` and that `P` is false *in the same explicit context* without recognition of conflict). | **Non-Negotiable** (Avoids modeling irrationality as incoherence)     |
  | **P1: Model Awareness/Consideration Explicitly** | Partial Awareness & Consideration. Some approaches explicitly represent which propositions/formulae an agent is currently "aware of" or has considered. | **Preference (Awareness Camp)**                                       |
  | **P2: Maintain Possible-Worlds Semantics** | Theoretical Elegance/Integration. Some desire to keep the basic possible-worlds framework for belief and modality, modifying it to handle boundedness. | **Preference (Possible-Worlds Camp)**                                 |
  | **P3: Syntactic/Computational Transparency** | Resource Sensitivity. Beliefs are represented syntactically (like formulas in a database) and derivation is modeled as explicit computation. | **Preference (Syntactic/Computational Camp)**                         |
  | **P4: Graceful Degradation** | Failure under Computational Cost. Performance (correct belief formation) degrades predictably/computationally as problem complexity increases. | **Preference (Computational Camp)**                                   |

  ### 3. Tensions

  *   **N2 (Trivial Inference) vs. N1 (Reject Closure) & N3 (Resource Sensitivity):** This is the core tension. How to define "trivial"? If *every* computationally "easy" inference (e.g., short proofs) must be preserved (N2), but complex inferences are blocked (N1, N3), the model needs a robust, non-ad-hoc definition of "easy" that aligns with resource limits (N3). Defining this computationally risks making the model highly sensitive to arbitrary resource thresholds, potentially violating N2 if the threshold is too low, or N1/N3 if too high. A purely logical definition risks collapsing back into omniscience.
  *   **N4 (Explicit/Implicit) vs. P1 (Awareness) vs. P3 (Syntax):** Distinguishing explicit/implicit belief (N4) is fundamental. Syntactic models (P3) naturally capture explicit belief but struggle cleanly with implicit belief (what *could* be derived). Awareness models (P1) make N4 and N5 central but often handle inference poorly. Possible-worlds models (P2) elegantly model implicit belief but struggle mightily with explicit belief and non-closure (N1).
  *   **N5 (Consideration vs. Inability) vs. Computational Models:** In computational models (P3), "lack of consideration" often maps to a proposition not being in the current syntactic database. "Inability" maps to the derivation process failing within resources. Distinguishing them clearly within the formalism can be challenging, especially for propositions logically related to considered ones.
  *   **N6 (Local Inconsistency) vs. N7 (Avoid Incoherence):** Allowing inconsistency (N6) while preventing trivial explosion is standard (paraconsistency). The harder part is preventing *incoherence* (N7) – ensuring the agent isn't modeled as holding blatantly contradictory beliefs *in the same explicit context* without any mechanism for detecting conflict upon minimal reflection (which N2 might imply they *should* detect). Balancing N6 and N7 requires a model of how contradictions are contained or detected.

  ### 4. The Load-Bearing Requirement

  **N3: Resource Sensitivity (Boundedness)** is the primary requirement excluding standard approaches.

  *   **Why:** Classical possible-worlds models inherently model agents as implicitly believing *all* logical consequences of their beliefs, violating N1 and fundamentally contradicting N3. Syntactic models naturally incorporate N3 by limiting derivation steps, but often struggle profoundly with N2 (ensuring *all* trivial inferences are preserved without collapsing into closure), N4/N5 (cleanly modeling implicit belief and the consideration/inability distinction), and semantic elegance (P2). Awareness models handle N4/N5/P1 well but typically lack a robust mechanism for N3 (resource-limited *reasoning* within awareness) and struggle with N2 (how awareness grows via trivial inference). Impossible worlds models aim for N3 by making worlds non-omniscient, but defining the "impossible" worlds and their structure to satisfy N2, N6, N7, and avoid arbitrariness is the core challenge. **N3 forces a departure from the idealizations that make standard logics clean and powerful.**

  ### 5. Scorecard

  | Model Type          | N1: Reject Closure | N2: Trivial Inference | N3: Resource Sensitive | N4: Expl/Impl Dist. | N5: Consid. vs Unable | N6: Local Inconsist. | N7: Avoid Incoherence | Notes                                                                 |
  | :------------------ | :----------------- | :-------------------- | :--------------------- | :------------------ | :-------------------- | :------------------- | :-------------------- | :-------------------------------------------------------------------- |
  | **Possible Worlds** | ❌ (Worst)         | ✅ (Trivial = True)   | ❌                     | ❌ (Only Implicit)  | ❌                    | ❌ (Explodes)        | ✅                    | Fails core boundedness (N1, N3). Only models ideal implicit belief. |
  | **Syntactic**       | ✅                 | ⚠️ (Hard to Guarantee)| ✅                     | ✅ (Explicit = DB)  | ⚠️ (Possible)        | ✅ (Paraconsistent)  | ⚠️ (Depends)          | Naturally handles N1, N3, N4. N2 is major weakness. N5/N7 tricky. Often lacks semantics. |
  | **Awareness**       | ✅ (Via Awareness) | ❌/⚠️ (Limited)       | ❌/⚠️ (Often Missing)  | ✅ (Core Feature)   | ✅ (Core Feature)     | ✅                   | ⚠️                    | Excels at N4, N5, N6. Usually poor at N2 & N3 (limited reasoning *within* awareness). N7 depends on awareness rules. |
  | **Impossible Worlds**| ✅                 | ⚠️ (Defining "Easy") | ⚠️ (Via World Structure)| ⚠️ (Possible)       | ⚠️ (Possible)        | ✅                   | ⚠️ (Defining Worlds)  | Most promising for semantics (P2). Core challenge is defining impossible worlds to satisfy N2 & N3 simultaneously without arbitrariness. N4/N5/N7 achievable but non-trivial. |
