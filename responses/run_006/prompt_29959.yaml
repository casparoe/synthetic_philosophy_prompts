answer: |-
  Here’s a thought experiment meeting your specifications:

  **Scenario:**  
  In a pain research clinic, two long-term meditators master a technique allowing deep, non-judgmental observation of sensations. Both receive identical, carefully calibrated noxious heat stimuli (45°C) to the forearm via a thermode, rated identically for intensity (7/10) and quality (sharp, burning) by standardized scales. Subject A, instructed to passively observe sensations without emotional engagement, reports the heat is "intensely hot, sharp, clearly unpleasant *but not distressing*; it’s just a sensation I’m curious about." They remain relaxed, breathing steadily. Subject B, distracted and anxious, receives the same stimulus and reports identical sensory qualities but adds, "*It’s awful, I can’t stand it*," showing visible tension and a strong urge to withdraw. Both affirm the stimulus is painful and unwanted in principle, but only B experiences it as motivationally urgent.

  ---

  **The Setup:**  
  Identical noxious stimulus (intensity, location, sensory quality) is applied to two subjects. Fixed: sensory-discriminative features (via objective scaling). Varied: affective-motivational response (aversive urgency in B vs. non-distressed acknowledgment in A). Neither tissue damage (stimulus is safe) nor social consequences differ. The variation is purely in the subject’s phenomenological relationship to an identical sensation.

  **The Intrinsic View:**  
  Theory (i) claims the pain’s badness is inherent in the sensation. Since the sensation is identical in A and B, its badness must be identical. If B’s experience is bad (as their aversion suggests), A’s must be equally bad despite their calm. A’s lack of distress is either a failure to fully apprehend the sensation’s intrinsic badness or irrelevant to its objective aversiveness. The theory cannot accommodate a *sensation* being bad for B but not bad for A if the sensation itself is unchanged.

  **The Evaluative View:**  
  Theory (ii) claims the sensation is not intrinsically bad; badness arises from a separate affective/evaluative response. Here, the identical sensation triggers a strong aversive evaluation in B (making it bad and urgent) but a detached, non-aversive evaluation in A (making it neutral or merely informative). A’s report confirms the sensation exists but lacks the negative evaluation, explaining the absence of suffering and withdrawal. Asymbolia shows this component can dissociate; here, volitional modulation achieves similar dissociation without pathology.

  **What’s Doing the Work:**  
  The key feature is **the subject’s detached, non-aversive observation of an identical sensation** in A versus B’s aversive reaction. This forces theories apart by showing the sensory core unchanged while the motivational-affective response varies independently. Remove this (e.g., if both react aversively or both are detached), and the dissociation vanishes; the theories’ predictions align, making the case inconclusive.

  **The Intrinsic Theorist’s Reply:**  
  A defender of (i) might argue that A’s sensation *is* qualitatively different: the meditative state alters the sensory input itself (e.g., via attentional gating), meaning the "pain" A experiences is not truly identical to B’s. Thus, the badness still tracks the (covertly altered) sensation. However, this reply is weak: A explicitly reports identical intensity/quality using objective metrics, and the stimulus is physically identical. Denying A’s sensory report undermines the fixed parameters of the case.
