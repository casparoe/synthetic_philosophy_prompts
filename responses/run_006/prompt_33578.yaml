  The normative conclusions might survive in weakened form. Mandatory disclosure seems reasonable for transparency, but criminalizing undisclosed AI as "serious wrong" overreaches. The analogy falsely equates monetary fraud with epistemic harm. Disclosure requirements should stand independently based on consent and transparency ethics, not forced by this imperfect analogy.

