answer: |-
  Here are 8 targeted questions with follow-ups designed to challenge the no-truth-value account while avoiding evasion. Each question anticipates a reply and pushes deeper into the implications of her view. The final question focuses on falsifiability.

  ---

  ### **(a) Embedding and Triviality Under Composition**  
  1. **Question:** "You argue that simple indicatives lack truth values, but Lewis-style triviality resurgences (e.g., Hájek 1989) show that even *non-propositional* accounts face collapse when conditionals embed—e.g., in conjunctions like *‘A and (if B then C)’* or nested conditionals like *‘If (if A then B), then C’*. If these embeddings are meaningful, how do you assign probabilities to them without invoking a propositional object vulnerable to triviality?"  
     *Anticipated Reply:* "Embedded cases are pseudo-embeddings; they’re shorthand for meta-linguistic acts (e.g., *‘A and I assert that if B then C’*)."  
     **Follow-up:** "But speakers systematically assign probabilities to *unasserted* embeddings (e.g., *‘Probably, if A then (if B then C)’*). If these aren’t propositions, what mental state does ‘probably’ modify? If it’s just iterated supposition (e.g., *P(C\|B&A)*), doesn’t Hájek’s cardinality argument prove such probabilities *can’t* coherently track all possible embeddings in a finite algebra?"  

  2. **Question:** "When we deny a conditional (e.g., *‘It’s not true that if A, C’*), your view must either deny this has determinate content or offer a non-propositional semantics. What do you propose, and how does it avoid the result that *P(¬(if A, C)) ≠ 1 − P(C\|A)*—contradicting intuitive probability judgments?"  
     *Anticipated Reply:* "Denials express low conditional probability; no need for truth values."  
     **Follow-up:** "But in cases where *P(C\|A) = 0.5*, speakers often withhold both assertion and denial. If denial isn’t governed by *1 − P(C\|A)*, what norm *does* guide it? If it *is*, how do you explain the asymmetry where *P(¬(if A, C)) = 0.5* feels defective, but *P(C\|A) = 0.5* does not?"  

  ---

  ### **(b) Belief, Disagreement, and Testimony**  
  3. **Question:** "If *‘if A, C’* isn’t truth-apt, what do two people disagree about when one asserts it and the other denies it? If it’s just differing conditional probabilities (*P₁(C\|A) vs. P₂(C\|A)*), couldn’t both be rational—contradicting the intuition that conditional disputes are factual?"  
     *Anticipated Reply:* "Disagreement is about cognitive attitudes under supposition, not propositions."  
     **Follow-up:** "But when I learn *your* conditional assertion (e.g., *‘If A, C’*), I often update my own beliefs. If this isn’t adopting a propositional belief, what *am* I updating? Must I replicate your entire credal state? If not, how does testimony transmit *partial* information (e.g., you tell me *P(C\|A) = 0.8*, but I only learn it’s >0.6)?"  

  4. **Question:** "Belief in *‘if A, C’* is reduced to high *P(C\|A)*. But when I believe *‘if A, C’ unconditionally* (e.g., *‘If it rains, the match is canceled’* while seeing blue skies), what prevents my belief from being *trivially* true (since *P(A) = 0*)? Does your view imply all uninstantiated conditionals are equally rational to believe?"  
     *Anticipated Reply:* "Belief requires *robust* high conditional probability, not just when *P(A) = 0*."  
     **Follow-up:** "But *robustness* smuggles in truth conditions—e.g., *‘P(C\|A) remains high across relevant partitions’*. Without propositions, what defines ‘relevant partitions’? If it’s context-dependent, how do you avoid radical relativism where *‘if A, C’* has no stable content across speakers?"  

  ---

  ### **(c) The Assertability Norm**  
  5. **Question:** "Adams’s thesis ties assertability to *P(C\|A)*, not to the probability of the material conditional (*P(¬A ∨ C)*). But why *this* norm? If it’s because *P(¬A ∨ C)* misjudges assertability (e.g., high when *P(¬A)* is high), couldn’t a *different* non-truth-apt account use, say, *P(C ∧ A)* or causal probability?"  
     *Anticipated Reply:* "Conditional probability matches our intuitions (e.g., the ‘paradoxes’ of material implication)."  
     **Follow-up:** "But Gibbard’s Sly Pete case shows Adams’s thesis can *also* misjudge assertability: when *P(C\|A) = 0.5*, asserting *‘if A, C’* feels defective even if rationally permissible. If assertability isn’t *defined* by *P(C\|A)*, what independent justification do you have for it? Can you state the norm without referencing ‘probability of truth’ implicitly?"  

  6. **Question:** "You say assertion of *‘if A, C’* is governed by *P(C\|A)*. But to evaluate *P(C\|A)*, I need probabilities for *A* and *C*. Since *A* and *C* *are* truth-apt, doesn’t this make the norm *parasitic* on truth conditions—undermining the claim that truth plays *no* role in conditionals?"  
     *Anticipated Reply:* "The norm relies on probabilities of *A* and *C*, but the *conditional itself* remains non-truth-apt."  
     **Follow-up:** "Then is the entire function of *‘if’* just to *signal* that we’re evaluating *P(C\|A)*? If so, why can’t we reduce *‘if A, C’* to *‘P(C\|A) is high’*—which *is* truth-apt? Doesn’t this collapse your view into a propositional account where *‘if’* expresses a higher-order probability claim?"  

  ---

  ### **(d) Wider Triviality Landscape**  
  7. **Question:** "Triviality results like those of Hájek and Bradley show Adams’s thesis requires extreme restrictions: e.g., conditionals can’t be embedded, or their probabilities can’t be compared across contexts. Which restriction do you accept, and does this imply your view is *incomplete* (e.g., silent on embeddings) rather than *refuted*?"  
     *Anticipated Reply:* "I reject embeddings; conditionals only function as ‘top-level’ assertions."  
     **Follow-up:** "But speakers routinely embed conditionals in deliberation (e.g., *‘If (if A, B), then I should do C’*). If your account dismisses these as ill-formed, how do you explain their coherence in reasoning? If you *don’t* dismiss them, how do you avoid Bradley’s result that Adams’s thesis + embeddings + logic forces truth values?"  

  8. **Question:** "Bradley’s tenability results prove Adams’s thesis can hold only if we abandon basic logical principles (e.g., conditional proof) or probabilistic axioms (e.g., ratio formula). Which do you sacrifice, and how does this not cripple everyday reasoning with conditionals?"  
     *Anticipated Reply:* "I reject that conditionals obey standard logic (e.g., conditional proof fails)."  
     **Follow-up:** "But conditional proof underpins how we *use* conditionals (e.g., *suppose A; derive C; therefore, if A, C*). If it fails, how do you justify *any* deductive inference involving conditionals? If instead you abandon the ratio formula (*P(C\|A) = P(C ∧ A)/P(A)*), doesn’t this make conditional probability undefined when *P(A) = 0*—rendering your norm inapplicable to uninstantiated conditionals?"  

  ---

  ### **Final Question: Falsifiability**  
  9. **Question:** "You present this as a discovery about English conditionals. What empirical phenomenon would falsify your view? For instance:  
     - If cross-linguistic data showed all languages *require* truth-apt indicatives,  
     - Or if neuroscience revealed that processing *‘if A, C’* activates the same truth-tracking mechanisms as factual assertions,  
     would you abandon the account? If not, what *would* count as evidence against it?"  

  ---

  ### **Why these work:**  
  - **Pre-empts deflection:** Follow-ups explicitly block "not my problem" replies by showing how issues (triviality, embeddings) recur *within* her framework.  
  - **Technical precision:** Leverages grad-level knowledge (e.g., Hájek’s cardinality, Bradley’s trade-offs, Gibbard cases).  
  - **Pressure points:** Focuses on *dynamics* of reasoning (testimony, updating, disagreement) where non-propositional views struggle.  
  - **No retreat:** Final question forces engagement with empirical accountability.  

