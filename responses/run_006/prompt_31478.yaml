prompt: |-
  I've been building a small set of letter-string analogy puzzles — the kind where your shown "abc goes to abd" and asked what "ijk" should become — and I keep noticing something I don't have a word for. The "same" rule seems to quietly bend into a neighboring rule when the new string resists it, and solvers don't experience this as changing rules. After "abc goes to abd", nearly everyone says the rule is "replace the last letter with its alphabet successor". But give them "xyz" and a striking number answer "wyz" — they replace the first letter with its predecessor — and then insist, sometimes with real confidence, that they did exactly the same thing as in the first puzzle. "Last" turned into "first" and "successor" into "predecessor" under pressure from the new string. Another example: after the same "abc to abd", many people map the single letter c onto the doubled block kk in "iijjkk" and answer "iijjll", so "letter" has bent into "maximal run of identical letters", even though a perfectly literal answer is available. The bends are always local — letter to letter-group, last to first, successor to predecessor — never wild jumps, and people are often surprised when you point out the mismatch between what they said the rule was and what they did.

  I know this sits somewhere near analogy, and I've read a little about conceptual blending, but blending seems to be about fusing two domains, while here there's a single tiny domain and the concepts inside it are deforming. It also isn't just people changing the rules, because they report doing the same thing, and it isn't sloppiness exactly, because the replacements have a regular local structure. Does this specific phenomenon have an established name? If it does, how exactly is it carved off from analogy, blending, and ordinary rule-switching? If it doesn't, what would you call it, and what are its edges — which bends count and which don't?

  After your answer, append a short JSON object with these fields: established_term (the closest existing name, or null if there is none), nearest_concepts (an array of objects, each with name and how_the_described_thing_differs), proposed_name (what you would call it if you had to name it), definition (a one-sentence definition), and boundary_cases (an array of near-miss cases that should not count as instances).
reasoning: |-
  We are dealing with a phenomenon where a person applies what they believe is the same rule from one analogy to another, but under certain constraints (like the string resisting the literal rule), they adapt the rule in a local and structured way without recognizing that they have changed it. The key points are:
   - The rule is perceived as constant, but its application changes in a way that is "local" (i.e., the adapted rule is a neighbor in concept space: last becomes first, successor becomes predecessor, a single letter becomes a maximal run of identical letters).
   - The changes are not arbitrary but follow a pattern of minimal adjustment to handle the new case.
   - The person does not experience this as a rule change and may even insist that they are consistent.

   This phenomenon seems to be a specific kind of analogy adaptation under constraints. It is distinct from:
     - **Analogy**: because analogy typically involves mapping from a source to a target, but here the same rule is being adapted within the same domain for a new instance. However, the adaptation is happening because the target instance resists the direct application.
     - **Conceptual blending**: which involves integrating two different domains, but here we have only one domain (letter strings) and the concepts are shifting internally.
     - **Rule-switching**: because the person does not consciously switch the rule; they believe they are applying the same rule.

   I am not aware of a single established term for this exact phenomenon. However, there are related concepts:

   1. **Rule Generalization or Rule Abstraction**: But in this case, the rule isn't being abstracted; it's being altered in a specific way to handle an edge case.

   2. **Overgeneralization and Subsequent Correction**: In language acquisition, overgeneralization (e.g., adding -ed to irregular verbs) is common and then corrected. However, here there is no correction; the rule is adjusted without awareness.

   3. **Analogical Remapping or Analogical Extension**: This is closer. It refers to the process of extending an analogy to a new case by adjusting the mapping. But again, the key is that the adjustment is minimal and the person doesn't perceive it as a change.

   4. **Cognitive Dissonance Reduction**: When the rule doesn't fit, the mind adjusts the rule to reduce dissonance, but without awareness.

   5. **Pragmatic Reasoning**: The solver is being pragmatic by adjusting the rule to make it work in the new context.

   6. **Frame Shifting**: In cognitive linguistics, frame shifting is changing the way a situation is framed. Here, the frame for the rule might shift from "last letter" to "first letter" when the string is at the end of the alphabet.

   7. **Contextual Modulation**: The meaning of the rule changes with context.

   After considering, the phenomenon might be best described as **"analogical slippage"** or **"rule deformation under constraint"**. However, let's see if there's a more established term.

   I recall that in the literature on analogy, there is a concept called **"systematicity"** (Gentner) which refers to the preference for mappings that preserve higher-order relations. But that doesn't exactly capture the deformation.

   Another candidate is **"accommodation"** in the Piagetian sense: modifying a schema to fit new information. But that is a broader concept.

   Alternatively, **"repair"** in conversation analysis or **"ad hoc category formation"** (Barsalou) might be relevant. Barsalou talks about how people form categories on the fly to deal with novel situations.

   However, none of these are a perfect fit.

   Proposed name: **"coercive rule adaptation"** or **"rule morphing"**. But we want a term that captures the idea that the rule is being bent without the solver's awareness and in a minimal way.

   Let me propose: **"analog rule bending"** or **"rule elasticity"**.

   But perhaps a more precise term is **"context-driven rule slippage"**.

   After reflection, I think the most descriptive and fitting term might be **"rule deformation under edge pressure"**. However, for brevity, we might call it **"edge-triggered rule morphing"**.

   Since I don't find an established term, I will set `established_term` to null.

   Nearest concepts:
     - **Analogical extension**: This is when an analogy is extended to a new case. The difference is that in analogical extension, the mapping is typically consistent, but here the rule deforms in a way that the solver doesn't notice the inconsistency.
     - **Accommodation (Piaget)**: In cognitive development, accommodation is the process of modifying existing schemas to fit new experiences. The difference is that accommodation is a conscious learning process over time, but here it happens instantly and without awareness in a problem-solving context.
     - **Ad hoc categorization (Barsalou)**: The formation of a category to solve a current goal. The difference is that here we are not forming a new category but adapting a rule.
     - **Pragmatic inference**: The solver makes a pragmatic adjustment to the rule. The difference is that the solver believes they are applying the same rule, so it's not a conscious inference.

   Proposed name: **"unconscious rule morphing"**

   Definition: The phenomenon in which a problem solver, when applying a rule derived from an example to a new instance that resists the rule, unconsciously and minimally deforms the rule to fit the new instance while maintaining the belief that the rule remains unchanged.

   Boundary cases (near-miss cases that should not count):
     - **Conscious rule change**: If the solver explicitly says, "In this case, I have to change the rule to ...", that is not the same because they are aware of the change.
     - **Overgeneralization without adaptation**: For example, if the solver applies the rule "replace the last letter by its successor" to "xyz" and gets "xy{ }" (where { } is after z, which doesn't exist) and then gives up, that is not adaptation.
     - **Arbitrary rule change**: If the solver, when faced with "xyz", changes the rule to "double the first letter" without any local connection to the original rule (like predecessor or successor), that is arbitrary and not the structured minimal shift we are describing.

