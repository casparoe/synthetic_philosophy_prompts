  Hmm, their frustration is palpable - they feel like this might make rationality a hollow concept if any behavior can be "rationalized" through meta-dispositions. Smart observation. The tension they're noticing is genuine in decision theory circles. 

  I should acknowledge their insight first: yes, the instrumental rationality in adopting the disposition is real. But the resolution lies in distinguishing between levels of rationality. The key is that the disposition itself remains substantively irrational by standard utility-maximizing criteria, even if adopting it was strategically smart. It's like carrying an umbrella in sunshine because you rationally decided to be the sort of person who always carries umbrellas - the carrying remains irrational in the moment, but the policy wasn't. 

  Their deeper worry about linguistic dissolution is valid though. "Irrational" still meaningfully describes the disposition's local behavior - the driver keeping the promise does violate immediate self-interest. The word isn't useless, it just needs context about whether we're evaluating acts or character-forming choices. 

