answer: |-
  Here's a logical decision tree for navigating vagueness theories, built from core questions about borderline cases. Follow the questions sequentially, answering based on your intuition about a borderline heap (or bald man, etc.).

  **Decision Tree for Vagueness Theories**

  1.  **Question 1:** For a borderline heap (B), is the statement **"B is a heap OR B is not a heap"** always **True**?
      *   **If YES → Go to Question 2.**
      *   **If NO → Go to Question 3.**

  2.  **Question 2 (Follows from YES on Q1):** Is it possible, even in principle, to know whether a borderline heap (B) is *actually* a heap or not?
      *   **If NO → Epistemicism:** *Awkward Consequence: There is a precise, unknowable number of grains where a collection stops being a heap, making vagueness purely a matter of ignorance.*
      *   **If YES → Supervaluationism:** *Awkward Consequence: While "B is a heap OR B is not a heap" is true, the simpler statement "B is a heap" is neither true nor false until a specific meaning for "heap" is fixed (precisified); meaning is fundamentally unsettled.*

  3.  **Question 3 (Follows from NO on Q1):** Does a statement about a borderline heap (e.g., "B is a heap") have a truth value that is something **other than True, False, or simply lacking a truth value** (like a specific number or degree)?
      *   **If YES → Degree Theory / Fuzzy Logic:** *Awkward Consequence: "B is a heap" might be 0.37 true, forcing us to accept that truth is fractional and logical laws (like non-contradiction, excluded middle) must be radically revised.*
      *   **If NO → Go to Question 4.**

  4.  **Question 4 (Follows from NO on Q3):** Does the truth value of "B is a heap" depend **fundamentally on the context of utterance** (e.g., who is speaking, the purpose, the comparison class)?
      *   **If YES → Contextualism:** *Awkward Consequence: The very meaning of "heap" (and thus whether B counts as one) constantly shifts with conversational context, making stable truth conditions elusive.*
      *   **If NO → Truth-Gap Theory:** *Awkward Consequence: Statements about borderline cases are simply neither true nor false (truth-valueless/gappy), requiring a non-classical logic and potentially making reasoning with vague predicates incomplete.*

  **Logical Space & Position Mapping**

  *   **Key Branching Questions:**
      1.  **Bivalence for Disjunctions (Q1):** Does the Law of Excluded Middle (P or not-P) hold for vague predicates applied to borderline cases? This is the deepest split. `YES` leads to bivalent views (Epistemicism, Supervaluationism). `NO` leads to non-bivalent views (Fuzzy, Gap, Contextualism).
      2.  **Knowability of Sharp Cutoffs (Q2):** *Only relevant if Bivalence holds (Q1=YES).* Can the precise boundary *ever* be known? `NO` = Epistemicism (boundaries exist but are unknowable). `YES` = Supervaluationism (boundaries are set by precisification, which *could* be known if specified).
      3.  **Degrees of Truth (Q3):** *Only relevant if Bivalence fails (Q1=NO).* Is truth genuinely multi-valued/fuzzy? `YES` = Degree Theory. `NO` leads to views where borderline statements are gappy or context-dependent.
      4.  **Context Dependence (Q4):** *Only relevant if Bivalence fails and no Degrees (Q1=NO, Q3=NO).* Is the *meaning* (and thus truth) of the vague predicate determined by context? `YES` = Contextualism. `NO` = Truth-Gap.

  *   **Positions in the Space:**
      *   **Epistemicism:** Q1=YES, Q2=NO
      *   **Supervaluationism:** Q1=YES, Q2=YES
      *   **Degree Theory:** Q1=NO, Q3=YES
      *   **Truth-Gap:** Q1=NO, Q3=NO, Q4=NO
      *   **Contextualism:** Q1=NO, Q3=NO, Q4=YES

  *   **Unoccupied/Problematic Combinations & Why:**
      *   **Q1=YES & Q3=YES (Bivalent + Degrees):** Incoherent. If "P or not-P" is always true (bivalence), then P must be either fully true or fully false – degrees of truth are incompatible. Degree theories explicitly reject bivalence (Q1=NO).
      *   **Q1=NO & Q2=YES (Non-bivalent + Knowable Cutoffs):** Unattractive/Unexplored. If bivalence fails (Q1=NO), there *isn't* a sharp cutoff for the predicate to know in borderline cases. Epistemicism (Q1=YES, Q2=NO) posits unknowable cutoffs *because* bivalence holds. Rejecting bivalence while keeping knowable cutoffs is conceptually messy and lacks proponents.
      *   **Q3=YES & Q4=YES (Degrees + Contextualism):** Possible but Rare/Unattractive. While logically possible (context could set the precise function mapping features to degrees), it's complex and undermines a key motivation for degrees (objective representation of partial truth). Most degree theorists see degrees as inherent, not contextually set; most contextualists see context setting sharp boundaries or extensions, not degrees. It's unexplored territory.

  *   **Positions the Tree Might Struggle to Pull Apart (and Why):**
      *   **Supervaluationism vs. Truth-Gap (in simple assertions):** For a *single* borderline statement like "B is a heap," both views say it's neither true nor false. The tree distinguishes them via Q1: Supervaluationism *preserves* bivalence for disjunctions ("B is a heap OR not" is true), while Truth-Gap rejects it (that disjunction might *also* be gappy or false). Q1 is crucial here.
      *   **Contextualism vs. Supervaluationism (in dynamics):** Both involve precisification. The key difference captured by the tree is that Supervaluationism *accepts* bivalence (Q1=YES) for the disjunction even *before* precisification within a context, while Contextualism *rejects* it (Q1=NO). Supervaluationism's precisification is about settling meaning to assign truth values *within* a fixed context/model; Contextualism's context shift *changes* the meaning/extension itself.

  **How to Use This:**

  1.  Take a clear borderline case (e.g., 49 grains of sand for "heap" – not clearly heap, not clearly not-heap).
  2.  Ask yourself Question 1 about this case. Follow the path based on your answer.
  3.  Continue answering the subsequent questions honestly based on your intuitions.
  4.  Arrive at a leaf node (theory + awkward consequence).

  This tree prioritizes clean logical divisions based on commitments about truth values, knowability, and context. The "awkward consequences" highlight the price each theory pays to solve the paradox. Enjoy the philosophical exploration!
