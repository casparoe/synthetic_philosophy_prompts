prompt: |-
  I've been reading up on vagueness lately — the sorites paradox, heaps and bald men, all that — and I keep mixing up which view says what. I thought I had it sorted but then I read something on supervaluationism and now I'm not sure I could tell it apart from epistemicism if my life depended on it.

  So here's what I'd like: a decision tree that starts from a couple of concrete questions about borderline cases and sorts someone into the right position on vagueness. The positions I want covered are at least epistemicism, supervaluationism, degree theory (fuzzy logic), truth-gap views, and contextualism. The questions should be things a person can answer without already knowing the jargon — so not "do you accept bivalence?" but something like "if I've got a borderline heap and I say 'either it's a heap or it's not a heap,' is what I said true?"

  Build the tree from the logical space first: figure out what the key branching questions are, then locate the actual positions in that space, and flag any combinations of answers that nobody seems to hold (and say why — is the combination incoherent, just unattractive, or unexplored?). Also flag any two positions your tree can't pull apart, if that happens.

  The audience is me — retired physicist now reading philosophy for fun, so I'm fine with logical structure but I don't have the standard philosophy background. One thing I'd especially appreciate: at each leaf, give me the one-sentence awkward consequence that view's defenders just have to live with.
