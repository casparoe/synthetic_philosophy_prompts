prompt: |-
  I'm a philosophy grad student working through some metaphysics of dispositions, and I keep tripping over a pattern I don't have a clean word for. Take a fragile glass. I'd normally cash out "fragile" as something like: if you dropped it on concrete, it would shatter. Now suppose the same glass is wrapped in a thick layer of foam, so when I drop it on concrete it doesn't shatter. It would be crazy to conclude the glass isn't fragile — the disposition is still there, something just kept it from showing up. But now tweak the case: suppose the glass is rigged to a device that, the instant it's dropped, rearranges its internal structure so it's tough by the time it hits the concrete. A moment before the drop I'd still say it was fragile, but at the moment the manifesting conditions arrive, it isn't anymore. So the conditinal "if dropped on concrete, it would shatter" is false in both cases, but for what feel like very different reasons: in one case the disposition is still present but blocked, and in the other it disappeared exactly when it was needed.

  I'm trying to figure out whether this pair of failure modes has an established name, and whether they're really as different as they feel. I'm also curious about the mirror image: a thing that isn't fragile, but the act of striking it somehow makes it fragile just in time to shatter, so it "manifests" a disposition it never had before the stimulus. I'm not after just a label — I want the carving. Does the distinction survive cases where the blocker is internal to the object rather than external? Does it matter that the interference is triggered by the very same stimulus that's supposed to trigger the manifestation? And when cases get messy, what's the principle for telling the two apart?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a philosophy grad student working on dispositions in metaphysics. The example they give is a fragile glass and two scenarios where it doesn't shatter when dropped: one with foam padding and another with a device that makes it tough upon dropping. The user notices that in both cases, the conditional "if dropped, it shatters" is false, but the reasons feel different. In the foam case, the fragility is still there but masked; in the device case, the fragility is lost just when needed. They want to know if there's a name for this distinction, if it's genuine, and how it applies to other cases like internal blockers or reverse scenarios.

  First, I need to recall the standard responses in the literature. The foam scenario is a classic case of masking. Masking happens when a disposition is present, but something external prevents its manifestation. The device scenario sounds like mimicking a finkish disposition. Finkish cases involve the disposition disappearing when the stimulus is applied. The reverse scenario where a non-fragile object becomes fragile just in time is a reverse fink or mimic.

  The user is asking whether the distinction between these two failure modes is significant. They also want to know if the distinction holds when blockers are internal, if the trigger matters, and how to differentiate them in messy cases. So, deeper needs here include understanding the ontology of dispositions, how they persist, and criteria for distinguishing dispositional properties from their manifestations.

  I should consider possible theories. David Lewis's reformed conditional analysis addresses finkish cases by requiring that the disposition remains present during the stimulus. Masking, however, involves the disposition being present but interfered with. The key difference is whether the disposition persists when the stimulus is applied. In finkish cases, it vanishes; in masking, it stays but is blocked.

  Internal blockers might blur the lines. If the object has an intrinsic property that prevents manifestation, is that masking or finkish? For example, an immune system that activates upon infection. Here, the disposition (to get sick) is masked by the immune response, but the disposition itself might still be present. If the infection itself alters the body's structure to remove the disposition, that's finkish. So the principle is whether the disposition survives the stimulus onset.

  The triggering mechanism matters. If the stimulus causes the disposition to disappear, that's finkish. If the stimulus occurs but something else blocks the manifestation, it's masking. The user's mirror image case—reverse fink or mimic—where a non-disposition gains the disposition just in time, shows that both creation and destruction of dispositions matter.

  In messy cases, the test involves considering the object's intrinsic properties at the moment of stimulus. If the disposition is present but manifestation blocked, it's masking. If the disposition isn't present when stimulus occurs, even if it was before, it's finkish. But this requires knowing the disposition's persistence conditions, which might be tricky.

  The user might also be interested in how dispositions are individuated. Are they categorical properties or defined by their stimuli and manifestations? The distinction between masking and finkishness hinges on the persistence of the disposition itself, not just the counterfactual outcomes. So the carving is about the disposition's existence during the stimulus.

  I should mention that some philosophers like Choi and Fara have debated these terms. Also, the user's scenario where the blocker is triggered by the same stimulus complicates things. For instance, the device that makes the glass tough upon dropping: the stimulus (dropping) causes the disposition to vanish, making it finkish. Whereas foam is a constant blocker, not triggered by the stimulus.

  Underlying all this is the user's need for clarity in their metaphysical framework. They might be building arguments about realism vs. anti-realism regarding dispositions, or how dispositions relate to causal powers. Providing clear distinctions and terminology will help them structure their analysis and engage with existing literature effectively.
answer: |-
  This is a brilliantly sharp set of cases that cuts to the heart of dispositional metaphysics! You're grappling with the core challenge of distinguishing a disposition's *existence* from its *manifestation*, and how interference can relate to the stimulus. The distinction you're sensing is both real and philosophically significant.

  Here's the established terminology and conceptual carving:

  1.  **Your First Case (Foam): Masking/Failsafe**
      *   **Name:** This is **Masking** (or sometimes **Failsafe**).
      *   **Carving:** The intrinsic disposition (fragility) is present *both before and during the application of the stimulus*. The manifestation (shattering) is prevented by some *extrinsic* (or sometimes intrinsic, see below) factor that *interrupts the causal chain* between the stimulus and the manifestation. The disposition itself remains intact.
      *   **Conditional:** The conditional "if dropped, it would shatter" is false *because the antecedent is true but the consequent is false due to an external interferer*. The glass *was* fragile when dropped, but the foam absorbed the impact.

  2.  **Your Second Case (Internal Restructuring Device): Finkish Disposition**
      *   **Name:** This is a **Finkish Disposition** (coined by C.B. Martin, popularized by Lewis).
      *   **Carving:** The intrinsic disposition *is present before the stimulus is applied, but disappears precisely when (or because) the stimulus is applied*. The manifestation fails because the disposition required to produce it is no longer present at the crucial moment. This is often due to a mechanism *triggered by the stimulus itself* that alters the object's intrinsic properties.
      *   **Conditional:** The conditional "if dropped, it would shatter" is false *because the disposition required to make the consequent true (fragility) vanishes when the antecedent becomes true*. The glass *ceased* to be fragile *as it was dropped* or *during* the fall, before impact.

  3.  **Your Mirror Image Case (Non-Fragile becomes Fragile on Striking): Mimic/Anti-Fink**
      *   **Name:** This is **Mimicking** or a **Reverse Fink/Anti-Fink**.
      *   **Carving:** The object *lacks* the intrinsic disposition before the stimulus is applied. However, the stimulus (or something triggered by it) *creates* the disposition *just in time* for the manifestation to occur. The manifestation happens, but it wasn't caused by a disposition that was present *before* the stimulus.
      *   **Conditional:** The conditional "if struck, it would shatter" is *true*. However, its truth is *accidental* relative to the object's stable properties before the stimulus. The object *became* fragile *because* it was struck, allowing it to shatter.

  **Key Differences & Principles for Distinction:**

  The fundamental distinction between **Masking** and **Finkishness** hinges on **whether the disposition *persists* through the onset of the stimulus**:

  *   **Masking:** Disposition **PERSISTS** during stimulus. Failure is due to blocked causal pathway.
  *   **Finkish:** Disposition **CEASES** upon (or due to) stimulus. Failure is due to lack of disposition *when needed*.
  *   **Mimic:** Disposition **ABSENT** before stimulus, **CREATED** by stimulus.

  **Addressing Your Specific Questions:**

  1.  **Does the distinction survive internal blockers?**
      *   **Absolutely, but it requires careful analysis:**
          *   **Internal Masker:** Suppose the glass has an internal shock-absorbing gel that activates upon impact. *Before* impact, it's fragile. *Upon* impact, the gel activates, absorbing the force *before* the glass structure can fail. **This is Masking.** The fragility *was present* at the moment of impact, but its manifestation was prevented by the internal mechanism acting as a shield/interrupting cause.
          *   **Internal Finker:** Suppose the glass has a mechanism triggered by the *acceleration* of the drop (the stimulus) that rapidly strengthens its molecular bonds *during the fall*, making it non-fragile before it hits. **This is Finkish.** The fragility *disappeared* because of the stimulus itself.
      *   **Principle:** Focus on the disposition's *existence at the critical moment the stimulus "takes hold"* (e.g., the moment of impact for fragility). Is the disposition *still there* but its effect blocked (Masking), or has it *been removed* by a process triggered by the stimulus (Finkish)? Internal mechanisms can play either role.

  2.  **Does it matter that the interference is triggered by the stimulus?**
      *   **Crucially Yes:** This is often the hallmark of Finkishness and Mimicking.
      *   **Finkishness:** The *stimulus itself* (or a very direct consequence of it) triggers the *loss* of the disposition. (Dropping triggers the toughening device).
      *   **Mimicking:** The *stimulus itself* (or a very direct consequence of it) triggers the *gain* of the disposition. (Striking triggers the embrittlement device).
      *   **Masking:** The interfering factor is usually *independent* of the stimulus trigger. The foam was there regardless of *why* the glass was dropped (accident, malice, experiment). An internal masker *might* be triggered by the stimulus (like the shock-absorbing gel activating on impact), but crucially, *the disposition itself was still present at the onset of the stimulus*; the masker prevents the manifestation *despite* the disposition being present. The key difference is *what the stimulus does to the disposition itself* (removes it vs. leaves it intact but blocked).

  3.  **Principle for Telling Them Apart in Messy Cases:**
      *   **The "Time-Slice" Test at Stimulus Onset:** Ask: What are the object's *intrinsic properties* at the *exact moment* the stimulus condition is fully realized (e.g., the moment of impact for fragility, the moment the electric field is applied for conductivity)?
          *   If the dispositional property (fragility, conductivity) is *intrinsically present* in that time-slice, but the manifestation fails, you likely have **Masking** (something blocked the causal chain).
          *   If the dispositional property is *not intrinsically present* in that time-slice *because a process initiated by the stimulus onset removed it*, you have **Finkishness**.
          *   If the dispositional property was *not* present before the stimulus but *is* present in that time-slice *because a process initiated by the stimulus onset created it*, and the manifestation occurs, you have **Mimicking**.
      *   **The Counterfactual Dependence Test:** Ask what would happen if the interfering mechanism *failed* to operate, holding the stimulus constant?
          *   **Masking:** If the masker failed (e.g., foam removed, gel malfunctioned) *and the disposition was still present*, the manifestation *would occur*. (Glass would shatter).
          *   **Finkish:** If the "finking" mechanism failed (e.g., toughening device broken) *and the stimulus was applied*, the disposition *would remain* and the manifestation *would occur*. (Glass would shatter). The failure reveals the underlying, masked disposition.
          *   **Mimic:** If the mimicking mechanism failed (e.g., embrittlement device broken) *and the stimulus was applied*, the disposition *would not be created* and the manifestation *would not occur*. (Glass would not shatter). The mechanism is essential for *creating* the disposition needed for manifestation.
      *   **The Persistence Question:** Did the disposition survive the *onset* of the stimulus? (Yes: Masking candidate. No: Finkish candidate).

  **Why the Distinction Matters:**

  *   **Ontology of Dispositions:** Masking suggests dispositions are real, stable properties that can be interfered with. Finkishness challenges simple conditional analyses (like the one you started with) by showing the disposition can vanish *because* of the stimulus, making the conditional false for reasons other than the absence of the disposition *beforehand*. Mimicking challenges the idea that manifestations reliably indicate pre-existing dispositions.
  *   **Causal Powers:** Masking preserves the object's intrinsic causal power (fragility) but shows its effect can be overridden. Finkishness shows an object's intrinsic causal powers can be radically unstable and context-dependent in a specific, stimulus-triggered way.
  *   **Defining Dispositions:** These cases forced revisions to the simple conditional analysis. Lewis's "Reformed Conditional Analysis" tries to handle finkish cases by requiring that the disposition *would* persist *if* the stimulus were applied: "Something x is disposed at time t to give response r to stimulus s iff, for some intrinsic property B that x has at t, for some time t' after t, if x were to undergo stimulus s at time t and retain property B until t', then s and x's having of B would jointly cause x to give response r." This attempts to rule out finks by requiring the dispositional base (B) to *persist through* the stimulus.

  **In Summary:**

  You've perfectly identified **Masking** (disposition present but blocked), **Finkish Dispositions** (disposition disappears upon stimulus), and **Mimicking** (disposition created by stimulus). The key carving principle is the **persistence or non-persistence of the intrinsic dispositional property *through the onset of the stimulus***, and whether the interference mechanism is triggered *by* the stimulus in a way that alters the disposition itself. This distinction holds for internal blockers and is vital for understanding the metaphysics of causal powers and the challenges facing simple analyses of dispositions. Keep grappling with these cases – they are central to contemporary debates!
