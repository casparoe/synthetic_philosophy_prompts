answer: |-
  Your questions cut to the heart of Augustine's rigorous (and sometimes counterintuitive) definition of lying. Let's break down the conceptual machinery:

  1.  **Why distinguish "believing" (credere) from "opining" (opinari) before the definition?**
      *   **Purpose:** Augustine needs a precise anchor for *intentionality* and *knowledge*. He's setting up the conditions for what constitutes a *deliberate* deception.
      *   **The Distinction:** Earlier in *De Mendacio*, Augustine distinguishes between:
          *   **Knowing/Knowing the Contrary (Scire/Contrarium Scire):** Certainty. You hold something as definitively true or false based on knowledge.
          *   **Believing (Credere):** Firm conviction, though perhaps not absolute, demonstrable certainty (e.g., believing a trusted friend).
          *   **Opining (Opinari):** Holding a view tentatively, with awareness of potential doubt or lack of absolute proof.
      *   **What it Buys Him:** This distinction allows him to isolate the *core act of lying* as requiring a specific mental state regarding the *falsity* of what one utters. Crucially:
          *   To lie, you must utter something you *know or believe to be false*. Mere opinion isn't enough.
          *   If you utter something false *while merely opining it's true*, you are *mistaken*, but you are *not lying* according to Augustine's strict definition. The speaker lacks the requisite conviction *in the falsity* of their utterance. They are sincerely (if weakly) asserting what they *think* is true.
      *   **Result:** It prevents classifying sincere errors or expressions of tentative opinions as lies. Lying requires a *firm* internal conviction (knowledge or belief) that contradicts the uttered statement.

  2.  **What is the "double thought" (duplex cor)?**
      *   Augustine defines it explicitly: "there is a double thought: the one, of that thing which he either **knows or thinks to be true** and **does not produce**; the other, of that thing which he **produces** instead thereof, **knowing or thinking it to be false**."
      *   **Interpretation:** It's a **mismatch between internal conviction and external expression driven by suppression and substitution**. It's not just two random thoughts, nor is it *only* an intention to deceive (though that's strongly implied). It's a specific conflict:
          *   **Thought 1 (Suppressed):** The truth (or what the liar holds as true/believed true) that *remains in the mind* but is *actively withheld*.
          *   **Thought 2 (Expressed):** The falsehood (which the liar holds as false/believed false) that is *deliberately chosen and uttered* *instead* of Thought 1.
      *   **Key Elements:**
          *   **Contradiction:** The two thoughts are directly opposed regarding the truth-value of the proposition in question.
          *   **Suppression/Withholding:** The true thought is consciously *not* expressed.
          *   **Substitution:** The false thought is consciously *chosen* to replace the true one in communication.
          *   **Intentionality (Implied):** This act of suppression and substitution inherently implies an *intention to mislead* or conceal the truth. While Augustine focuses heavily on the internal cognitive state, the *purpose* of the double thought is to deceive the listener by presenting the substitute thought as genuine.

  3.  **The weight of "from the sense of his own mind, not from the verity or falsity of the things themselves":**
      *   **Yes, it makes lying entirely a matter of the speaker's mental state.** This is the cornerstone of Augustine's definition. The objective truth or falsehood of the statement is irrelevant to the *act of lying itself*. What matters is:
          *   What the speaker *holds in their mind* as true/false (their conviction/knowledge/belief).
          *   The *mismatch* between that internal conviction and what they choose to express.
      *   **Awkward Cases & Implications:**
          *   **Saying a Truth and Lying (Paradox 1):** If you say "The sky is blue" (objectively true) but you *believe it to be green* and say "blue" intending to deceive someone into thinking it's blue, **you lie** (per Augustine). Your *intent* was to deceive by uttering what *you believed* was false.
          *   **Saying a Falsehood and Not Lying (Paradox 2):** If you say "The capital of France is London" (objectively false) but you *sincerely believe it to be true*, **you do not lie**. You are simply mistaken.
          *   **Self-Deception:** This is a major challenge. Augustine's definition focuses on the *speaker's conscious conviction at the moment of utterance*.
              *   If someone has deeply buried the truth from themselves and *genuinely believes* their false statement, Augustine would likely say they are not lying *at that moment* – they are sincerely expressing their (deluded) belief. The "double thought" (conscious suppression of known truth + substitution of known falsehood) isn't present *at the moment of speaking*.
              *   However, Augustine might argue the *initial act* of self-deception involved a lie to oneself, or that the person bears responsibility for allowing themselves to become deluded. But *at the point of utterance*, if the false belief is genuinely held, it's not a lie per his definition.
          *   **Speaking Without Attending (Absent-Mindedness):**
              *   If you utter a falsehood purely by accident, without any conscious mental state regarding its truth or falsity (e.g., a slip of the tongue, autopilot response), Augustine would likely argue this isn't lying. There's no *intentional* "double thought" – no conscious suppression of truth or substitution of known falsehood. The "sense of his own mind" wasn't engaged in a way that constitutes the act of lying.
              *   However, this highlights a potential weakness: Augustine's focus is on the *act* of intentional assertion. Utterances made without conscious intent fall outside his specific definition of lying, though they might be careless or negligent.
          *   **Strict Liability for Intent:** Augustine's definition places enormous weight on accurately assessing the speaker's internal state *at the precise moment of utterance*. This is often impossible to verify externally and leads to the counterintuitive scenarios (truthful lie, false non-lie) mentioned above.

  **Why Augustine's Rigor Matters for Your Piece:**

  Augustine is establishing the foundational Western philosophical definition of lying as an *intentional act of deception rooted in the speaker's mind*. He deliberately excludes:
  *   **Mistakes:** Sincere falsehoods (no double thought, no intent).
  *   **Unintended Truths:** Accurately stating something you believe to be false (still a lie because of the double thought and intent).
  *   **Expressions of Doubt (Opinion):** Merely stating a tentative belief isn't asserting it *as known truth*, so it can't be a lie in his strict sense.

  His focus on the "sense of one's own mind" makes lying fundamentally an offense against truthfulness *within oneself* and against God (who sees the heart), not merely a social offense based on the statement's objective effect. This internalization and emphasis on intent profoundly influenced subsequent theological and philosophical treatments of lying. The awkward cases you note (self-deception, accidental speech) are genuine puzzles arising from this strict mental-state focus, highlighting both its precision and its potential limitations in describing the messy reality of human communication.
