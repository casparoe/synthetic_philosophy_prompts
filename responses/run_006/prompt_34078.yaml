  For a better analogy, perhaps thought experiments are more like mathematical proofs or legal precedent testing. This reframes their value as tools for exploring implications and refining concepts, not for discovering new empirical truths. The weight they can carry depends on how well they reveal conceptual tensions or contradictions.

