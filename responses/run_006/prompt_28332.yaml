answer: |-
  Below is a specification of desiderata for a theory of translation under formal constraints, scoped to texts where form (meter, rhyme, sound patterning, structural features) is constitutive of meaning. Each requirement is grounded in a specific challenge, with tensions flagged explicitly. Non-negotiable requirements are marked (**★**).  

  ---

  ### **Core Principles**  
  1.  **★ Formal Intentionality**  
      *Requirement:* The theory must treat formal features as semantic, not decorative.  
      *Why:* In texts like Marot’s poem, the shift from *vous* to *tu* signals intimacy; the echoed opening/closing lines create circularity; the syllabic rigidity imposes concision. Ignoring form erases meaning.  
      *Case:* Translating Dante’s *terza rima* as free verse loses the theological implication of interlocking trinities.  

  2.  **★ Contextual Relativity**  
      *Requirement:* It must acknowledge that constraints vary in weight (e.g., rhyme may outweigh meter in one poem, soundplay in another).  
      *Why:* Not all formal elements are equally significant. A theory must discern hierarchies.  
      *Case:* In Marot, the 3-syllable lines and stress pattern are inviolable; the rhyming couplets less so than in Pope’s couplets, where rhyme drives satire.  

  ---

  ### **Desiderata for Practice**  
  3.  **Density of Expression**  
      *Requirement:* The translation must achieve comparable semantic density within formal bounds.  
      *Why:* Concision forced by syllabic/meter constraints (e.g., 3-syllable lines) compels linguistic ingenuity. Loose translation sprawls, betraying the original’s economy.  
      *Case:* Translating Japanese haiku into English must resist explanatory padding.  

  4.  **Prosodic Naturalness**  
      *Requirement:* The translation must sound natural in the target language *within its formal scheme*.  
      *Why:* Forced rhymes or contorted syntax ("translatorese") destroy aesthetic integrity.  
      *Case:* Hofstadter’s "tortured" English versions of Marot that prioritize exact syllabics over fluency.  

  5.  **Structural Holism**  
      *Requirement*: Macro-features (e.g., circularity, midpoint shifts) must be preserved even if micro-features (e.g., individual rhymes) are adapted.  
      *Why*: The *vous/tu* shift in Marot structurally divides the poem; echoing the first line at the end creates closure. Isolated "perfect" rhymes matter less than this architecture.  
      *Case:* Translating a sestina’s end-word repetition pattern is non-negotiable; the specific words chosen are adaptive.  

  6.  **★ Compensatory Cohesion**  
      *Requirement*: Losses in one formal element (e.g., rhyme) must be compensated elsewhere (e.g., alliteration, assonance) to maintain aesthetic cohesion.  
      *Why*: Form generates aesthetic energy; unmitigated loss drains the text.  
      *Case:* If Slavic dactylic hexameter is unmetrical in English, compensation might include internal rhyme or kinetic syntax.  

  7.  **Cultural-Idiomatic Viability**  
      *Requirement*: Wordplay, idioms, or culturally embedded references must be adapted, not transliterated.  
      *Why*: Literal translation of puns or allusions (e.g., Marot’s self-naming) often falls flat. The theory must permit creative analogues.  
      *Case:* Translating Shakespeare’s "bare ruined choirs" pun (choirs/chars) requires a new image conveying decay and song.  

  ---

  ### **Tensions & Trade-offs**  
  8.  **Density vs. Naturalness**  
      *Conflict*: Achieving semantic density within strict form often strains naturalness (e.g., archaic diction, inverted syntax). A translation faithful to both risks artificiality.  
      *Irreconcilable Example*: Replicating 3-syllable lines in English may force unnatural contractions ("o’er," "ne’er") or truncations.  

  9.  **Micro-Fidelity vs. Macro-Holism**  
      *Conflict*: Perfect local fidelity (e.g., line-by-line rhyme/meter) can sabotage global structure (e.g., thematic progression, tonal shifts).  
      *Irreconcilable Example*: Marot’s midpoint *vous/tu* shift might require sacrificing a rhyming couplet to preserve the emotional pivot.  

  10. **★ Formal Replication vs. Cultural Viability**  
      *Conflict*: Some forms (e.g., tonal patterns in Chinese poetry) have no equivalent in non-tonal languages. Strict replication is impossible; adaptation risks cultural dilution.  
      *Irreconcilable Example*: Translating Arabic *saj* (rhymed prose) into English may abandon end-rhyme for rhythmic cadence to avoid sing-song triviality.  

  ---

  ### **Non-Negotiables vs. Preferences**  
  **Non-Negotiables (★)**  
  - Formal features treated as semantic.  
  - Compensatory cohesion for losses.  
  - Cultural-idiomatic viability over literalism.  

  **School-Dependent Preferences**  
  - *Density over naturalness*: Favored by "resistant" translation (e.g., Nabokov’s *Eugene Onegin*).  
  - *Naturalness over density*: Favored by domesticating approaches (e.g., Robert Fitzgerald’s Homer).  
  - *Structural holism over local fidelity*: Prioritized by functionalist theories (e.g., Skopos theory).  

  ---

  ### **The Theory’s Burden of Proof**  
  A viable theory must:  
  - Explain how to *rank* formal priorities (e.g., why preserve meter but adapt rhyme?).  
  - Define *systemic compensation*: When is alliteration "enough" to offset lost rhyme?  
  - Account for the reader’s experience: A translation may be "accurate" but lifeless, or "vibrant" but unfaithful. The theory must articulate this trade-off.  
  - Address *untranslatability*: Not as failure, but as a boundary condition requiring principled sacrifice (e.g., forfeit soundplay to preserve thematic irony).  

  The real test lies in the tensions: **A theory that cannot explicitly navigate the conflicts between Density/Naturalness or Micro/Macro fidelity is inadequate**. What you seek is not a prescription, but a framework for principled triage. Hofstadter’s kaleidoscope of Marot translations proves that every choice is a loss—but some losses are fatal, while others are metamorphoses. A theory must tell you which is which.
