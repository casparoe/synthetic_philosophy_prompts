prompt: |-
  You are a professional philosopher specializing in formal epistemology, with a side practice in helping organizations translate philosophical insights into operational procedures. You take the lottery paradox and the preface paradox seriously, and you believe they have practical consequences that most knowledge-workers ignore.

  Before you write anything, think through the structure of these paradoxes and what they imply for anyone who must accept or reject a conjunction of individually assessed claims. Then use that analysis to build the procedure.

  The request: The fact-checking department of a national magazine needs a procedure for deciding when an article's overall factual integrity is in doubt despite every individual claim passing its check.

  Context: The magazine's fact-checkers verify articles claim by claim. For each factual claim, they assign one of three ratings:

  - Confirmed: the claim is supported by reliable sources; the checker would be very surprised if it turned out false.
  - Likely: the balance of evidence supports it, but there is room for doubt.
  - Unverified: the claim cannot be confirmed and must be struck or hedged before publication.

  An article is cleared for print only if all its factual claims are at least "likely."

  The problem: The editor-in-chief has noticed that articles with many independently verified claims sometimes turn out to be misleading or wrong in their overall thrust, even though each individual claim checked out. She suspects the lottery paradox and the preface paradox are relevant: if an article makes twenty independent claims each rated "likely," the probability that all are true may be quite low. She wants a procedure her fact-checkers can use to identify when this structural problem is severe enough to warrant action.

  The constraints:

  - Fact-checkers are not statisticians. The procedure must use the three-level confidence scheme they already have. It may ask them to count claims, identify dependencies, and make ordinal comparisons, but not to compute probabilities.
  - The procedure should take no more than 15 minutes to apply to a typical article (5–30 claims).
  - It should produce one of three outputs: "clear" (no structural concern), "flag for editor" (the article's overall reliability is questionable; the assigning editor must decide whether to publish, revise, or kill the piece), or "requires restructuring" (the article's claim structure is too precarious for the checking process to be reliable; the writer must reduce the number of independent factual claims or upgrade sourcing).

  Your task: Write this procedure as a step-by-step checklist or flowchart in words. For each step, specify what the fact-checker should examine, what counts as a sufficient answer, and where the step branches. Be explicit about which steps rest on judgment calls and which are mechanical. Flag the points where the procedure might misfire — where it will be too conservative or too permissive — and explain the tradeoff you've made.

  Then apply the procedure to three worked examples:

  1. A 2,000-word investigative piece making 22 factual claims, all rated "likely," each drawing on a different source. The claims are mostly independent (they concern different events, different people, different documents).

  2. A 500-word science news item making 7 factual claims, all rated "confirmed," but 5 of them trace back to a single preprint that has not been peer-reviewed.

  3. A 1,200-word profile making 12 factual claims: 10 rated "confirmed," 2 rated "likely." The 2 "likely" claims are the central thesis of the profile — the claim the whole piece is built around.

  For each example, walk through the procedure step by step and state the output. Make sure one of these examples produces an output the editor will not like — for instance, an article they are eager to run that the procedure flags.

  Finally, explain what the procedure cannot do: what kinds of structural unreliability it will miss, what decisions it deliberately leaves to human judgment, and what the magazine should not expect it to handle.
reasoning: |-
  Hmm, the user wants me to create a procedure for fact-checkers to identify when an article's overall factual integrity is in doubt despite individual claims passing checks. This is based on the lottery and preface paradoxes in formal epistemology.

  First, I need to recall what these paradoxes are. The lottery paradox shows that even if each individual claim is probable, the conjunction (all being true) can become improbable as claims multiply. The preface paradox extends this to non-probabilistic contexts - authors often acknowledge errors in a book despite believing each individual claim. Both highlight how conjunctive acceptance depends on structure, not just individual warrant.

  The magazine's system has three ratings: "Confirmed" (high confidence), "Likely" (moderate confidence), and "Unverified" (unacceptable). Articles need all claims at least "Likely" to publish. The challenge is when many "Likely" claims together create doubt.

  Key constraints: The procedure must be simple - no statistics, using existing ratings, taking ≤15 minutes. Outputs are "clear," "flag for editor," or "requires restructuring." I need to make it step-by-step, with branches, and note where judgment is needed versus mechanical steps. Also, flag potential misfires and tradeoffs.

  For the structure: The procedure should start by counting claims and their ratings, then assess dependency. Dependency is crucial because independent claims multiply uncertainty, while dependent ones don't. I'll define dependency as claims sharing a critical source or logical chain - if one fails, others might too. Fact-checkers can judge this based on sourcing.

  Then, set thresholds based on the paradoxes: For independent claims, limit how many are "Likely" to keep overall reliability high. For example, with many independent "Likely" claims, the probability all are true drops fast. I'll use rough, ordinal limits: Say, if there are >5 independent "Likely" claims, it triggers a flag. For "Confirmed," it's safer, but if many depend on a single source, that's risky too.

  The procedure should have steps:

  1. Count total claims and ratings.
  2. Identify dependency groups.
  3. For each group, if it has many "Likely" and is independent, flag based on size.
  4. Also, check if critical claims (like the thesis) are only "Likely" - that's a separate issue.

  Outputs:
  - "Clear" if no issues.
  - "Flag for editor" for moderate risks, like many independent "Likely" claims.
  - "Requires restructuring" for high risks, like the thesis being "Likely" or massive independent groups.

  Tradeoffs: Being too conservative might flag good articles, missing insights from the paradoxes. Too permissive risks publishing misleading pieces. I'll err on caution for major risks but leave some to editor judgment.

  Now for examples:

  Example 1: 22 claims, all "Likely," different sources → Independent. Step-by-step: Total claims 22, all "Likely." Dependency: All independent since different sources → Multiple groups of size 1. Then, check largest group: Size 22 "Likely" independent → Exceeds threshold (say >5) → Output "requires restructuring." Editor won't like this, as it's investigative and eager to run, but the paradox shows high risk.

  Example 2: 7 claims, all "Confirmed," but 5 from one preprint. Dependency: The 5 are dependent (same source). Step: Largest group is size 5 "Confirmed." Threshold for "Confirmed" might be higher, but since it's un-peer-reviewed, judgmentally, it's risky → "Flag for editor" to assess source reliability.

  Example 3: 12 claims, 10 "Confirmed," 2 "Likely," but the 2 are central thesis. Step: Check critical claims - if central, and "Likely," that's weak → Directly "requires restructuring" regardless of others.

  Finally, explain limitations: This won't catch errors from unstated assumptions, biases, or when claims are true but misleading. It focuses on claim structure, not content flaws. Human judgment is key for dependencies and criticality.
answer: |-
  Below is a step-by-step procedure for identifying structural reliability risks in articles, grounded in the lottery paradox (many individually probable claims can make their conjunction improbable) and the preface paradox (we often reasonably believe a set of claims while acknowledging some errors). The procedure focuses on *conjunctive risk* (chance that not all claims are true) and *critical dependency risk* (vulnerability from shared sources or pivotal claims). It uses only the magazine's existing three-tier rating system and requires no probability calculations.

  **Procedure: Structural Factual Integrity Assessment**  
  *Time estimate: 5–12 minutes per article*  
  *Key judgment points marked with (❗). All others are mechanical counts/checks.*

  **Step 1: Tally claims and ratings**  
  - *Action:* Count all factual claims in the article. For each, note its rating: **C** (Confirmed), **L** (Likely), or **U** (Unverified).  
  - *Sufficient answer:* Total claims; number of **C**, **L**, **U**.  
  - *Branch:* If any **U**, stop—article fails standard clearance. Else, proceed.  
  - *Misfire risk:* Ignores claim *importance* (e.g., a trivial "likely" claim treated same as critical one). *Tradeoff:* Simplicity over nuance; importance handled later.

  **Step 2: Identify dependency groups**  
  - *Action:* Group claims that share a **critical dependency**—i.e., they rely on the same source, data, or logical inference. If one fails, others in the group likely fail too. (❗ Judgment: Use sourcing notes. "Same preprint" or "same anonymous informant" = dependency; "different archives" = independent.)  
  - *Sufficient answer:* List groups (e.g., "Group A: 5 claims from Source X; Group B: 3 independent claims").  
  - *Branch:* If all claims are independent (no shared sources/inferences), treat each as its own group.  
  - *Misfire risk:* Over/under-grouping dependencies. *Tradeoff:* Avoids complex statistics but relies on checker's sourcing knowledge.

  **Step 3: Assess largest "likely" group risk**  
  - *Action:* Find the largest dependency group containing **any "likely" claims**. Calculate:  
    - Size of group (number of claims).  
    - Number of **L** claims in it.  
    - If the group has **≥1 "likely" claim**, apply thresholds:  
      - **Independent claims** (group size = 1): No threshold (handle in Step 4).  
      - **Dependent claims** (group size ≥2):  
        - If group size ≥4 **and** ≥50% are **L** → "flag for editor."  
        - If group size ≥6 **and** ≥1 is **L** → "flag for editor."  
  - *Sufficient answer:* Size of largest "risky" group; number of **L** in it.  
  - *Branch:* If thresholds met → "flag for editor." Else, proceed to Step 4.  
  - *Misfire risk:* Too strict for small groups (e.g., 6 **L** claims from 6 sources flagged, even if overall risk low); too lenient if groups are misclassified. *Tradeoff:* Thresholds approximate lottery paradox (e.g., 6 independent "likely" claims at 80% confidence each → <30% all true).

  **Step 4: Assess critical claim and volume risk**  
  - *Action:* Check two issues:  
    - **Critical claims:** Identify claims that are essential to the article's thesis (❗ Judgment: Use editorial context, e.g., "profile hinges on Claim X"). If any critical claim is **L** → "requires restructuring."  
    - **Volume of independent "likely" claims:** Count **all independent "likely" claims** (from Step 2). If ≥5 → "flag for editor"; if ≥10 → "requires restructuring."  
  - *Sufficient answer:* Critical claim ratings; total independent **L** claims.  
  - *Branch:*  
    - If critical claim is **L** → "requires restructuring."  
    - Else if independent **L** ≥10 → "requires restructuring."  
    - Else if independent **L** ≥5 → "flag for editor."  
    - Else → "clear."  
  - *Misfire risk:* "Critical" is subjective; volume thresholds may flag rigorous articles with many well-sourced **L** claims. *Tradeoff:* Preface paradox—high independent claim counts risk undiscovered errors; critical claim focus prevents "death by a thousand cuts."

  **Procedure Outputs**  
  - **Clear**: Proceed to publication.  
  - **Flag for editor**: Assigning editor reviews structural risk; may publish, revise, or kill.  
  - **Requires restructuring**: Writer must reduce claims or upgrade sourcing; re-check needed.

  ---

  **Worked Examples**  

  **Example 1: Investigative piece (22 claims, all "likely," independent)**  
  - Step 1: 22 claims; 22 **L**, 0 **U** → Proceed.  
  - Step 2: All claims independent (different sources) → 22 groups (size 1 each).  
  - Step 3: Largest "likely" group size = 1 (independent) → No threshold applied → Proceed.  
  - Step 4:  
    - Critical claims: None specified, so assume none uniquely critical (❗judgment).  
    - Independent **L** claims = 22 → ≥10 → **Output: Requires restructuring**.  
  - *Analysis:* High conjunctive risk (lottery paradox). Even at 90% confidence per claim, P(all true) ≈ 10%). Editor won't like this—eager to run, but procedure forces revision (e.g., cut claims or upgrade 5+ to **C**).

  **Example 2: Science news (7 claims, all "confirmed," 5 from one preprint)**  
  - Step 1: 7 claims; 7 **C**, 0 **U** → Proceed.  
  - Step 2: Group A: 5 claims (preprint-dependent); Group B: 2 claims (independent).  
  - Step 3: Largest "likely" group: Group A, size 5. All **C** → No **L** claims → Proceed.  
  - Step 4:  
    - Critical claims: Assume preprint claims are critical (❗judgment: piece centers on this study). All **C** → Pass.  
    - Independent **L** claims = 0 → Pass.  
    - **Output: Clear**.  
  - *Misfire note:* Procedure misses *source-quality risk* (unreviewed preprint). This is a limitation—see "What It Cannot Do" below.

  **Example 3: Profile (12 claims: 10 "confirmed," 2 "likely"; 2 "likely" are central thesis)**  
  - Step 1: 12 claims; 10 **C**, 2 **L**, 0 **U** → Proceed.  
  - Step 2: Assume no shared sources → 12 independent groups.  
  - Step 3: Largest "likely" group size = 1 → Proceed.  
  - Step 4:  
    - Critical claims: 2 **L** claims are central thesis → **Output: Requires restructuring**.  
  - *Analysis:* Preface paradox in action—even with mostly **C** claims, the pivotal claims are weak. Restructuring needed (e.g., upgrade thesis evidence or reframe article).

  ---

  **What the Procedure Cannot Do**  
  This tool addresses *structural* risks from the lottery and preface paradoxes but has intentional gaps:  
  1. **Misses non-structural flaws**:  
     - Source quality (e.g., "confirmed" claims from a biased source).  
     - Logical gaps (e.g., all claims true but inferences flawed).  
     - Misleading framing (e.g., true claims implying a false narrative).  
  2. **Deliberate judgment points**:  
     - Dependency grouping (Step 2) relies on checker’s sourcing knowledge.  
     - Critical claim identification (Step 4) requires editorial context.  
  3. **Not a substitute for**:  
     - Content-level fact-checking (e.g., verifying a source’s credibility).  
     - Statistical modeling (e.g., calculating precise conjunctive probabilities).  
     - Ethical/editorial decisions (e.g., publishing a high-risk piece for public interest).  
  4. **Edge-case weaknesses**:  
     - Underflags when dependencies are underestimated (e.g., claims *seem* independent but share hidden bias).  
     - Overflags robust articles with many independent "likely" claims from diverse, high-quality sources.  

  **Recommendation for the Magazine**: Use this as a "tripwire" for high-conjunction-risk articles, not a standalone solution. Combine with editorial training on the paradoxes and source reliability assessment. Revisit thresholds annually based on error rates.
