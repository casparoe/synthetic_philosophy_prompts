  ok so in my philosophy class we read some heidegger and i got really into the whole ready-to-hand thing — like how a hammer kind of disappears when your using it and becomes an extension of your body. then i fell down a rabbit hole reading about the extended mind thesis (clark and chalmers, the notebook that counts as memory, etc). heidegger died in 1976 so he never saw smartphones, but he did write about modern technology as enframing and how it turns everything into standing-reserve. what do you think he would of made of the extended mind thesis? like would he think a smartphone is part of your mind in the extended sense, or would he see it as enframing that alienates you from authentic being-in-the-world? i want exactly five predictions, each a sentence or two, no introduction or conclusion. be specific about which parts of heidegger's thought you're applying to each point.
