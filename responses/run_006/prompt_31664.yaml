prompt: |-
  I'm a PhD student in decision theory, and I've been arguing with a friend in the department about the two-envelope paradox for like a week now. The setup is: two envelopes, one contains exactly twice as much money as the other, but you don't know which is which. You pick one, open it, and see $10. The other envelope therefore has either $5 or $20, so if you switch your expected value is (0.5)($5) + (0.5)($20) = $12.50, which is better than the $10 in your hand. So switching looks rational. But the same arithmetic works no matter what amount you see, which would mean you should always switch, even before opening—and then, once you've switched, the same reasoning says switch back. I know the standard response is that the expected value isn't well-defined unless you have a prior over the possible amounts. But here's the part I can't get past: once you've actually seen $10, isnt it just a fact about the situation that the other envelope is equally likely to be $5 or $20? There are only two possibilities, and by symmetry they should get equal probability. So even if the prior is undefined before opening, after conditioning on the observed amount the switch seems forced. My friend says this is exactly where the mistake is, but I can't see why seeing the $10 doesn't pin down the conditional probabilities. Where does the reasoning go wrong?
reasoning: |-
  We are discussing the two-envelope paradox. The setup: two envelopes, one has twice as much money as the other. You pick one and see $10. So the other envelope has either $5 (if you picked the high one) or $20 (if you picked the low one). The paradox is that by switching, the expected value is (5 + 20)/2 = $12.50, which is more than $10. Hence, switching seems beneficial. But then, the same reasoning would apply no matter what amount you see, so you should always switch. And then, after switching, you would want to switch back. This is clearly absurd.

   The standard resolution is that we must have a prior distribution over the possible amounts of money in the envelopes. Without such a prior, the expected value calculation is not well-defined. But you are asking: once we have observed $10, aren't there just two possibilities? And by symmetry, shouldn't each have probability 1/2?

   However, the issue is that the two possibilities are not symmetric in the way we might think. The key is that the prior distribution might not be uniform over the possible pairs. Moreover, the prior distribution might be such that the conditional probabilities are not 1/2.

   Let me explain by constructing a prior. Suppose we assume that the amount in the smaller envelope is chosen from a distribution. Let the smaller amount be X. Then the two envelopes have X and 2X. Suppose that the prior distribution of X is:

     P(X = x) = f(x)

   where f is some probability mass function (or density if continuous). Then the total amount in the envelopes is either (x, 2x) or (2x, x) for a particular x.

   Now, when you pick an envelope and observe $10, you have observed one of the two envelopes. There are two cases:

     Case 1: You observed the smaller envelope. Then the other envelope has 2x = 20? But wait, we observed 10. So if we observed the smaller envelope, then x=10 and the other envelope has 20.

     Case 2: You observed the larger envelope. Then the other envelope has x = 5? Because the larger envelope is 2x=10, so x=5.

   So the two scenarios are:

     Scenario 1: The pair is (10, 20) and you picked the 10 (which is the small one).
     Scenario 2: The pair is (5, 10) and you picked the 10 (which is the large one).

   Now, the probability of these two scenarios is not necessarily equal. The probability of Scenario 1 is the probability that the smaller envelope is 10 and that you picked the small envelope (which is 1/2 given the pair). Similarly, the probability of Scenario 2 is the probability that the smaller envelope is 5 and that you picked the large envelope (which is 1/2 given the pair).

   But note that the prior probability that the smaller envelope is 10 is f(10), and the prior probability that the smaller envelope is 5 is f(5). Therefore, the overall probability of Scenario 1 is (1/2)*f(10) and of Scenario 2 is (1/2)*f(5). So the conditional probability that the other envelope is 20 (i.e., that we are in Scenario 1) given that we observed 10 is:

     P(Scenario 1 | observed 10) = [ (1/2) * f(10) ] / [ (1/2)*f(10) + (1/2)*f(5) ] = f(10) / [f(10) + f(5)]

   Similarly, the conditional probability that the other envelope is 5 (Scenario 2) is:

     P(Scenario 2 | observed 10) = f(5) / [f(10) + f(5)]

   Now, unless f(5) = f(10), these are not equal. Therefore, the expected value of switching is:

     E[switch] = 20 * P(Scenario 1 | observed 10) + 5 * P(Scenario 2 | observed 10)
               = 20 * [f(10)/(f(10)+f(5))] + 5 * [f(5)/(f(10)+f(5))]

   This equals 10 if and only if:

     20 * f(10) + 5 * f(5) = 10 * [f(10) + f(5)]

     => 20f(10) + 5f(5) = 10f(10) + 10f(5)

     => 10f(10) = 5f(5)

     => 2f(10) = f(5)

   So unless 2f(10) = f(5), the expected value of switching is not $10. It could be less or more.

   Therefore, without knowing the prior, we cannot assume that the probabilities are 1/2. And if the prior is such that f(5) = 2f(10), then the expected value of switching is exactly $10, so switching doesn't matter.

   Example: Suppose the prior for the smaller amount is that it can be 5, 10, 20, 40, ... (doubling). Suppose the probabilities are:

     f(5) = 4/7, f(10)=2/7, f(20)=1/7, ... (each half the probability of the previous).

   Then if we observe 10, we have:

     P(Scenario 1) = f(10) / [f(10)+f(5)] = (2/7) / (2/7 + 4/7) = (2/7)/(6/7) = 1/3.
     P(Scenario 2) = f(5) / [f(10)+f(5)] = 4/7 / (6/7) = 2/3.

   Then the expected value of switching is: 20*(1/3) + 5*(2/3) = (20/3) + (10/3) = 30/3 = 10.

   So in this case, switching doesn't change the expectation.

   However, if we had a uniform prior? But note: if we try to set a uniform prior over all positive numbers, that is impossible (because it would have to be improper and the probabilities would not add up). And even if we restrict to a finite set, we must have the prior defined appropriately.

   Therefore, the mistake is in assuming that the two scenarios are equally likely after seeing $10. They are only equally likely under a prior that is symmetric in a way that might not hold. Without knowing the prior, we cannot assign 1/2 to each.

   Hence, the resolution: the assignment of 1/2 is arbitrary and depends on the prior. Without a prior, the calculation is invalid.

   So, to answer your question: seeing $10 does not pin down the conditional probabilities to 1/2. It depends on the prior distribution of the smaller amount.

   Therefore, the reasoning goes wrong in the step where we assume that the two possibilities ($5 or $20) are equally likely.
answer: |-
  The flaw in the reasoning lies in the assumption that, after seeing $10 in your envelope, the other envelope is equally likely to contain $5 or $20. While it's true that there are only two possible values for the other envelope, **the probabilities of these two scenarios are not necessarily equal**—they depend on the unknown prior distribution of the money in the envelopes.

  ### Step-by-Step Explanation:
  1. **The Setup**:
     - Let the smaller amount be \(X\). The envelopes contain \(X\) and \(2X\).
     - You pick one envelope and observe $10. This means:
       - If you picked the smaller envelope, the other has \(2X = 20\) (so \(X = 10\)).
       - If you picked the larger envelope, the other has \(X = 5\) (since \(2X = 10\) implies \(X = 5\)).

  2. **The Error in Equal Probability**:
     - The probability that $10 is the smaller amount (\(X = 10\)) versus the larger amount (\(X = 5\)) depends on:
       - The prior probability that the smaller envelope contains $10 (i.e., \(P(X=10)\)).
       - The prior probability that the smaller envelope contains $5 (i.e., \(P(X=5)\)).
     - By Bayes' theorem, the conditional probabilities are:
       \[
       P(\text{other} = 20 \mid \text{observed } 10) = \frac{P(X=10)}{P(X=10) + P(X=5)} \quad \text{(scenario where $10$ is small)}
       \]
       \[
       P(\text{other} = 5 \mid \text{observed } 10) = \frac{P(X=5)}{P(X=10) + P(X=5)} \quad \text{(scenario where $10$ is large)}
       \]
     - **These are not necessarily 0.5!** They depend on the ratio \(P(X=5) / P(X=10)\). Only if \(P(X=5) = P(X=10)\) are they equal.

  3. **Expected Value Revisited**:
     - The expected value of switching is:
       \[
       E[\text{switch}] = 20 \cdot \frac{P(X=10)}{P(X=10) + P(X=5)} + 5 \cdot \frac{P(X=5)}{P(X=10) + P(X=5)}
       \]
     - This equals $10$ only if:
       \[
       20 \cdot P(X=10) + 5 \cdot P(X=5) = 10 \cdot [P(X=10) + P(X=5)]
       \]
       which simplifies to \(2 \cdot P(X=10) = P(X=5)\). If this condition doesn't hold, switching may not be beneficial.
     - **Example**: Suppose \(P(X=5) = 0.6\) and \(P(X=10) = 0.4\). Then:
       \[
       E[\text{switch}] = 20 \cdot \frac{0.4}{0.4+0.6} + 5 \cdot \frac{0.6}{0.4+0.6} = 20 \cdot 0.4 + 5 \cdot 0.6 = 8 + 3 = 11 > 10.
       \]
       Switching seems good. But if \(P(X=5) = 0.4\) and \(P(X=10) = 0.6\):
       \[
       E[\text{switch}] = 20 \cdot 0.6 + 5 \cdot 0.4 = 12 + 2 = 14? \quad \text{Wait—this is incorrect!}
       \]
       Actually, using the conditional probabilities:
       \[
       P(\text{other}=20) = \frac{0.6}{0.6+0.4} = 0.6, \quad P(\text{other}=5) = \frac{0.4}{0.6+0.4} = 0.4.
       \]
       So \(E[\text{switch}] = 20 \cdot 0.6 + 5 \cdot 0.4 = 12 + 2 = 14 > 10\). But this assumes the prior probabilities are consistent with the observed value. In reality, without knowing the prior, we cannot assume symmetry.

  4. **The Core Issue**:
     - Before seeing any amount, you need a prior distribution over \(X\) (the smaller amount). Without it, the probabilities are undefined.
     - Observing $10 **does not** create symmetry. The two scenarios ($5/$10 vs. $10/$20) correspond to different values of \(X\) ($5 and $10), and their likelihoods depend on how the prior weights these values.
     - **Why symmetry fails**: The symmetry argument assumes that "the pair (5,10)" and "the pair (10,20)" are equally likely. But this isn't true unless \(P(X=5) = P(X=10)\), which is arbitrary. In most realistic priors (e.g., exponential decay in amounts), \(P(X=5) > P(X=10)\), breaking symmetry.

  ### Resolution:
  - **Without a specified prior**, you cannot justify \(P(\text{other}=5) = P(\text{other}=20) = 0.5\). Thus, the expected value calculation \(0.5 \times 5 + 0.5 \times 20 = 12.5\) is invalid.
  - **With a proper prior**, the expected gain from switching may be positive, negative, or zero. In many reasonable priors (e.g., \(X\) with a decreasing probability density), switching is often neutral or harmful.
  - **Key insight**: The paradox arises from an implicit, unjustified uniform prior over the two scenarios. Once you recognize that the prior matters, the paradox dissolves.

  ### Conclusion:
  Your friend is correct: the mistake is assigning equal probability to the two scenarios after seeing $10. This assignment is only valid if the prior satisfies \(P(X=5) = P(X=10)\), which is rarely true and never justified without specifying the prior. Always define the prior!
