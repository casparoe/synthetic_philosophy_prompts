answer: |-
  This is an exceptionally sharp observation of a pervasive but under-theorized rhetorical maneuver. You're correct that this move isn't neatly captured by "bias blind spot," "naive realism," or standard "debunking arguments," though it leverages elements of all three. **The most precise and descriptive established term for the core move is "Rhetorical Asymmetrical Debiasing" or "Bias Accusation Asymmetry."** However, since these aren't universally canonical, let's carve the concept precisely:

  ### Core Concept: Bias Attribution Asymmetry
  1.  **The Move:** Selectively applying the pejorative label "bias" (implying irrational influence, distortion, unreliability) to an opponent's motivating psychological state or principle, while applying a neutral or positive label ("preference," "principle," "commitment," "value") to one's own identical or analogous motivating state or principle.
  2.  **The Function:** To pathologize the *source* of the opponent's belief/judgment, thereby discrediting it without engaging its substance, while simultaneously immunizing one's own belief/judgment from similar scrutiny by framing it as rationally or morally justified.
  3.  **The Asymmetry:** The *only* difference determining the label ("bias" vs. "preference") is the speaker's agreement or disagreement with the resulting moral judgment. No objective criterion distinguishing the psychological processes is offered or applied consistently.
  4.  **The Mechanism:** It exploits the negative connotation of "bias" (implying cognitive flaw, unreliability) and the positive/neutral connotation of "preference/principle" (implying reasoned choice or valid value).

  ### Distinction from Related Concepts
  *   **Bias Blind Spot:** Refers to the *inability to recognize one's own biases*, while readily seeing them in others. **Distinction:** Bias Attribution Asymmetry *actively weaponizes* this blindness. It's not just failing to see your own bias; it's *asserting* your own state is *not* a bias (a "preference") while *asserting* the opponent's analogous state *is* a bias. It's the *rhetorical deployment* of the blind spot.
  *   **Naive Realism:** The conviction that one perceives the world objectively and without bias, and that those who disagree must be biased, uninformed, or irrational. **Distinction:** Naive Realism is the *underlying cognitive foundation* enabling Bias Attribution Asymmetry. Bias Attribution Asymmetry is the *specific argumentative tactic* that flows *from* naive realism. Naive realism explains *why* the speaker believes their view is the "unbiased" one; Bias Attribution Asymmetry is the *move of labeling* based on that belief.
  *   **Debunking Argument:** An argument that attempts to undermine a belief by showing its origins lie in epistemically unreliable processes (e.g., evolution, emotion, self-interest) rather than sound reasoning or evidence. **Distinction:**
      *   **Standard Debunking:** Offers a *reasoned case* for why a particular origin *is* unreliable. It provides *criteria* and *evidence* linking the origin to unreliability.
      *   **Bias Attribution Asymmetry:** *Merely applies the label "bias"* without providing criteria or evidence for why *this specific* origin (e.g., family loyalty, comfort with the status quo) is distorting *in this context*. Crucially, it *exempts* the analogous origin on one's own side from the same debunking criteria. It's a *pseudo-debunking* or *selective labeling* masquerading as an argument.

  ### Boundaries & Key Features of the Concept
  1.  **Psychological Equivalence (Often Implied, Not Required):** The move *suggests* the underlying psychological processes (ingroup loyalty, resistance to change) are fundamentally the *same kind* for both parties. However, **the core defining feature is the *asymmetry in labeling*, NOT a proven psychological equivalence.** The speaker might genuinely (though often erroneously) believe their own process *is* different (e.g., "My impartiality is based on reason; their partiality is based on irrational tribalism"). The asymmetry in labeling *alone*, driven by disagreement, is sufficient to constitute the move.
  2.  **Focus on Source, Not Substance:** The attack targets the *perceived origin* of the belief ("That's just your bias!") to avoid engaging the *content* of the moral judgment itself or the reasons offered for it.
  3.  **Lack of Criterion:** The move fails to provide or consistently apply a clear criterion for what distinguishes a "bias" (pejorative) from a "preference" or "principle" (non-pejorative). The distinction is purely tactical.
  4.  **Moral/Value Domain:** While similar moves occur in factual debates, it's most potent and common in *moral* or *value-laden* disputes where "principles" are expected and "biases" are seen as disqualifying, creating fertile ground for this asymmetry.
  5.  **Immunization:** A key function is to protect the speaker's own position from the same mode of attack that they deploy against their opponent.

  ### Proposed Names & Nuance
  *   **Best Descriptive Established Term:** **"Rhetorical Asymmetrical Debiasing"** (emphasizes the *tactic* and the *asymmetry* in applying "bias" removal).
  *   **More Precise (Less Established) Term:** **"Bias Attribution Asymmetry"** (most accurately captures the core: the asymmetric application of the *label* "bias").
  *   **Why not just "Hypocrisy"?** Hypocrisy is broader (inconsistency in actions/standards). This is a specific *rhetorical* and *epistemic* hypocrisy concerning the labeling of psychological sources.
  *   **Why not "Motivated Reasoning"?** Motivated reasoning describes *how* beliefs are formed (reasoning to reach desired conclusions). Bias Attribution Asymmetry is a *rhetorical strategy* used *after* beliefs are formed to attack an opponent's credibility.

  ### Conclusion
  You've identified **Bias Attribution Asymmetry** – the argumentative move of selectively pathologizing an opponent's motivation as a "bias" while sanitizing one's own analogous motivation as a "preference" or "principle," based solely on disagreement with the resulting judgment and without providing consistent criteria for the distinction. It exploits naive realism, leverages the bias blind spot, and mimics debunking while avoiding its evidentiary burden. Its core defining feature is the *asymmetric labeling* driven by disagreement, regardless of whether the underlying psychological processes are objectively identical. This move functions to discredit the opponent epistemically and immunize one's own position, substituting a label for substantive argument.
