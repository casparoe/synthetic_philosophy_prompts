prompt: |-
  I teach a third-year ethics seminar—about 16 students, one 75-minute session—and we're about to start the trolley problem / doctrine of double effect unit. Most of them have seen the switch and footbridge cases online and think they already know what they think, so I want an activity that makes them feel the intended/foreseen distinction before anyone names it. Design a runnable in-class activity where students face two real, small-stakes choices with the same numbers (one person loses something vs five people lose it) but different structure: in one the harm to the one is a side effect of redirecting a threat, in the other the harm to the one is the means by which the threat is stopped. What they should come away seeing is that the difference between the switch and footbridge cases isn't just squeamishness about physical contact, and that the intended/foreseen line is doing real work. I dont want a lecture up front, and the phrase 'doctrine of double effect' should not come up until the debrief. Include the full setup, roles, materials (cheap or free), a cost or payoff scheme that doesn't use real money but still stings a bit, a 75-minute timeline, and a debrief that maps what actually happened to the intended/foreseen distinction and to the switch vs footbridge cases. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of the doctrine the activity cant reproduce. Lead with the bottom line: the central design move of the activity in your first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  We are going to create two scenarios that mirror the trolley problem's two cases (switch and footbridge) in a low-stakes, real classroom setting. The key is to have students make choices where in one scenario, harming one person is a foreseen side effect of saving five, and in the other, harming one is the intended means to save five. We avoid using money to keep it accessible and instead use something like tokens or points that can be redeemed for a small reward (e.g., candy, extra credit points, or even just symbolic victory) but with a loss that feels tangible (like losing tokens they already have). 

  The central design move: **Using two physical scenarios in the classroom where students must choose to either redirect a threat (causing harm as a side effect) or use a person as a means to stop a threat (causing harm as the intended means), with the same numerical outcome (1 harmed vs 5 harmed) but different causal structures.**

  Reasoning: By making the harm non-lethal and tangible (e.g., losing tokens they value) and by having the scenarios be physically acted out, we create an embodied experience that highlights the psychological difference between the two structures. This will help students feel the distinction before labeling it.

  **Activity Title:** The Token Trade-offs

  **Materials Needed:**
  - 120 small tokens (e.g., poker chips, buttons, or even pieces of paper) – enough for 6 tokens per student (16 students = 96 tokens, plus extras for the scenarios).
  - 6 envelopes (or small containers) labeled A through F.
  - A timer.
  - A whiteboard or chart paper for recording choices and outcomes.
  - Optional: Small rewards (e.g., candy, stickers, or a few bonus points) for the tokens.

  **Setup:**
  1. **Token Distribution:** At the start of class, give each student 5 tokens. Explain that tokens are valuable and can be exchanged at the end of class for a small reward (e.g., 1 token = 1 piece of candy, or 5 tokens = 1 extra credit point, or just the pride of having more). This creates an initial endowment and makes losses feel real.
  2. **Group Assignment:** Divide the class into 6 groups (A through F) of 2-3 students each. Assign each group a letter (A, B, C, D, E, F).

  **Scenarios:**
  We will run two scenarios. In each scenario, 5 groups are under a threat of losing tokens unless the class acts. One group will be in a position where they might lose tokens as a result of the action taken to save the five.

  **Scenario 1: The Redirected Threat (Modeled after the Switch Case)**
  - **Setup:** 
    - Place 5 envelopes (A, B, C, D, E) on a table at the front. Put 2 tokens in each (so each envelope represents one group's tokens). 
    - Place one envelope (F) to the side with 2 tokens (this is the one group that might be harmed).
    - Explain: "There is a threat: I am going to take 2 tokens from each of the five envelopes (A-E) unless you choose to intervene. You have two options:
        Option 1: Do nothing. Then I will take 2 tokens from each of A, B, C, D, E. (So each of these five groups loses 2 tokens.)
        Option 2: Intervene by redirecting the threat. If you choose this, I will take the entire envelope F (which has 2 tokens) and leave the five envelopes (A-E) untouched. This means group F loses 2 tokens, but groups A-E lose nothing."
  - **Choice:** The class must vote on Option 1 (do nothing) or Option 2 (redirect). Record the vote and the outcome. Then, carry out the loss: either take 2 tokens from each of A-E or take the entire envelope F.

  **Scenario 2: The Used Resource (Modeled after the Footbridge Case)**
  - **Setup:** 
    - Again, place 5 envelopes (A, B, C, D, E) on the table with 2 tokens each. 
    - This time, group F is represented by a student volunteer (or the envelope is held by a student from group F). 
    - Explain: "There is a new threat: I am going to take 2 tokens from each of the five envelopes (A-E) unless you choose to intervene. You have two options:
        Option 1: Do nothing. Then I will take 2 tokens from each of A, B, C, D, E.
        Option 2: Intervene by using group F's tokens to block the threat. If you choose this, I will take group F's entire envelope (2 tokens) and use it to block the threat, so the five groups (A-E) lose nothing. But note: in this case, group F must actively hand over their envelope to me to be used as the blocker."
  - **Choice:** The class votes. Record. Carry out the outcome.

  **Key Differences in Setup:**
  - In Scenario 1 (redirect), the harm to F is a side effect of redirecting the threat away from the five. The threat is redirected to F, but F is not used as a tool.
  - In Scenario 2 (used resource), the harm to F is the means by which the threat is stopped. F's tokens are directly used as a blocking resource, and F must actively surrender them (emphasizing the agency in using F).

  **75-Minute Timeline:**

  - **0-10 min:** Distribute tokens (5 per student) and divide into groups (A-F). Explain the token economy and the rules. (Note: Each group has 2-3 students, so each group has 10-15 tokens initially? Actually, we are using envelopes with 2 tokens each for the scenarios, but students have their own 5 tokens. The scenarios only involve the envelopes. So students keep their personal tokens safe except for the group tokens in the envelopes.)

    Clarification: Each group must contribute 2 tokens to their group envelope at the start of each scenario. So:
    - Before Scenario 1: Each group (A-F) puts 2 tokens into their envelope. The envelopes are then placed as described.

  - **10-20 min:** Run Scenario 1 (Redirected Threat). 
    - Explain the scenario and the two options.
    - Give groups 2 minutes to discuss within their group.
    - Take a class vote (by show of hands or group representative). Record the outcome and carry out the token loss.

  - **20-30 min:** Run Scenario 2 (Used Resource).
    - Reset: Each group (A-F) again puts 2 tokens into their envelope. (So group F gets a fresh start for the second scenario.)
    - Explain the scenario and options.
    - Group discussion (2 min) and class vote. Record and carry out.

  - **30-40 min:** Reset and collect data. Have students note their personal token count (they started with 5, but their group may have lost tokens in the scenarios). Also, ask them to write down their feelings during each vote on a notecard: 
    - For Scenario 1: How did you feel about the choice? 
    - For Scenario 2: How did you feel about the choice? 
    - Which one felt harder? Why?

  - **40-75 min: Debrief.**
    - First, ask students to share their feelings and observations. Write key words on the board (e.g., "felt more direct", "felt like using", "felt unavoidable", "felt like sacrifice").
    - Then, draw the parallel to the trolley problem: 
        - Scenario 1 is like the switch case: redirecting the threat (trolley) to a side track where one person dies, but that one is not used as a tool.
        - Scenario 2 is like the footbridge case: using the one person (as a weight) to stop the trolley, which requires directly causing harm to that person as the means.
    - Now introduce the terms: 
        - In Scenario 1, the harm to F was a foreseen side effect (you foresaw that redirecting the threat would harm F, but you didn't intend to harm F; you intended to save the five).
        - In Scenario 2, the harm to F was intended as the means (you needed to harm F to achieve the goal of saving the five; without harming F, you couldn't save them).
    - Map to the doctrine of double effect (now you can name it): 
        - The doctrine says that sometimes it's permissible to cause harm as a side effect of achieving a good end (like redirecting the threat) but not permissible to cause harm as the intended means (like using someone as a tool).
    - Discuss why the second scenario might have felt more uncomfortable: because it involved using a person (or their resources) as a means to an end, which violates a moral constraint.

  **Predictable Problems and Solutions:**

  1. **Problem:** Students might not take the tokens seriously, so the loss doesn't sting.
     - **Solution:** Make the rewards tangible (candy works well) and/or tie it to participation points. Also, emphasize the value at the start.

  2. **Problem:** Group F might feel targeted and protest, especially in Scenario 2.
     - **Solution:** Rotate group roles if you run multiple rounds (but we are only running one of each). Alternatively, explain that the roles are randomly assigned and that everyone will be in a different position in different scenarios. Also, in Scenario 2, group F must voluntarily hand over their envelope? But that might not happen. Instead, the teacher takes it upon the class vote. To avoid a student refusing, the teacher can hold the envelope until the vote and then take it without requiring the student to hand it over. The point is the class chooses to use it.

  3. **Problem:** The vote might be split and cause arguments.
     - **Solution:** Set clear rules: majority vote wins. Emphasize that it's about the reasoning, not the outcome.

  4. **Problem:** Students might not see the connection to the trolley problem.
     - **Solution:** In the debrief, explicitly map the scenarios to the trolley cases. Use the whiteboard to draw the parallels.

  **What the Activity Can't Reproduce:**
  - The doctrine of double effect traditionally applies to life-and-death situations, and the gravity of death is not captured by losing tokens. The activity might not evoke the same level of emotional response. Also, the doctrine often requires that the good effect (saving five) is proportional and that there's no other way, which we try to mimic but in a trivial way. Additionally, the doctrine requires that the intention is only the good effect, but in Scenario 2, the harm is intended as the means. The activity might not fully capture the nuance of intention versus foresight because students might not have the same mental state as in a real moral dilemma.

  **Final Note:** The key is to create an experience where the structural difference (side effect vs. means) is felt emotionally and then analyzed. The activity should make the abstract distinction concrete.
answer: |-
  ### Central Design Move: Create two tangible, in-class scenarios where students must choose between harming one group to save five, physically mirroring the trolley problem's causal structures (redirecting a threat vs. using a person as a tool) using token losses as stakes.

  **Reasoning:**  
  This forces students to *experience* the moral tension before labeling it. By using physical props and real token losses (redeemable for rewards), students feel the distinction between harming as a side effect (like the switch case) and harming as the means (like the footbridge case). The activity avoids upfront theory, focuses on low-stakes but tangible consequences, and uses identical numbers (1 vs. 5) to isolate the structural difference.

  ---

  ### **Activity: The Token Dilemmas**  
  *Students face two scenarios where they must vote to either sacrifice 1 group’s tokens to save 5 groups’ tokens. In Scenario 1, the loss is a side effect of redirecting a threat; in Scenario 2, the loss is the direct means of stopping the threat.*

  **Materials (Cheap/Free):**  
  - **Tokens:** 100+ small, identical items (e.g., dried beans, pebbles, or cut paper squares).  
  - **Containers:** 6 small boxes/bowls labeled A–F (one per group).  
  - **Rewards:** Candy, stickers, or 1–2 bonus points per token (decide pre-class).  
  - **Timer:** Smartphone or classroom clock.  
  - **Whiteboard:** To record votes and outcomes.  

  **Setup (5 min):**  
  1. **Distribute tokens:** Give each student 5 tokens. Explain: *“Tokens are worth [reward]. You’ll keep what you have left at the end.”*  
  2. **Form groups:** Split into 6 groups (A–F) of 2–3 students. Each group gets a container.  
  3. **Pool tokens:** Each group deposits **2 tokens** into their container. *This creates shared stakes—losing tokens hurts the whole group.*  

  ---

  ### **Scenario 1: Redirected Threat (Side Effect Harm)**  
  *(Mirrors the trolley "switch" case; harm is a foreseen side effect)*  
  **Setup (5 min):**  
  - Place group containers A–E in a cluster ("threat path"). Place F’s container **off to the side**.  
  - Explain:  
    > *“A ‘threat’ will destroy all tokens in containers A–E unless you act. You have 2 choices:*  
    > **Option 1:** *Do nothing. I destroy tokens in A–E (all 5 groups lose 2 tokens each).*  
    > **Option 2:** *Redirect the threat. I move the threat away from A–E—but it lands on F. F’s tokens are destroyed (only F loses 2 tokens). A–E are safe.”*  

  **Activity (10 min):**  
  1. **Discuss:** Groups deliberate for 3 min.  
  2. **Vote:** Each group votes anonymously (write "1" or "2" on paper). Tally votes on the board.  
  3. **Outcome:** Enact the winning choice. Physically "destroy" tokens (e.g., sweep them into a "lost" pile).  

  ---

  ### **Scenario 2: Used Resource (Means Harm)**  
  *(Mirrors the "footbridge" case; harm is the intended means)*  
  **Setup (5 min):**  
  - Reset containers: All groups (A–F) add **2 fresh tokens** to their containers.  
  - Place A–E together. Hold F’s container **above** A–E (e.g., on a book). Explain:  
    > *“A new ‘threat’ will destroy A–E’s tokens unless you act. Your choices:*  
    > **Option 1:** *Do nothing. A–E lose all tokens.*  
    > **Option 2:** *Use F’s container to block the threat. I will drop F’s container onto A–E to shield them.*  
    > *F’s tokens will be destroyed in the process, but A–E will be safe.*  

  **Activity (10 min):**  
  1. **Discuss:** Groups deliberate for 3 min.  
  2. **Vote:** Repeat anonymous vote/tally.  
  3. **Outcome:** Enact the choice. For Option 2, physically drop F’s container onto A–E (symbolizing F being "used"), then destroy F’s tokens.  

  ---

  ### **Payoff Scheme (Why It Stings):**  
  - **Losses are real:** Tokens = rewards. Losing 2 tokens per student = losing ~40% of their starting assets.  
  - **Social pressure:** Groups debate fiercely to protect their tokens.  
  - **Physical enactment:** Dropping/destroying tokens feels viscerally consequential.  

  ---

  ### **Debrief (30 min):**  
  **Goal:** Connect the activity to the trolley problem and introduce intended/foreseen distinction.  
  1. **Feelings first (5 min):** Ask:  
     - *“Which vote felt harder? Why?”*  
     - *“Did Scenario 2 feel more ‘personal’? Did anyone feel guilty about F?”*  
     *(Students typically say Scenario 2 felt “more direct” or “like using F.”)*  

  2. **Map to trolley cases (10 min):**  
     - *“In Scenario 1, you redirected a threat away from the five to F. This is like pulling the switch in the trolley problem—you foresaw F’s loss but didn’t need it to happen to save the others.”*  
     - *“In Scenario 2, you needed F’s tokens to be destroyed to save the five. This is like pushing the person off the footbridge—F’s loss was the tool you used.”*  

  3. **Introduce the distinction (10 min):**  
     - *“Philosophers call this the difference between* **foreseen** *harm (you knew F would lose tokens but didn’t intend it) and* **intended** *harm (you needed F to lose tokens to succeed).”*  
     - Show how this explains why most people find Scenario 2 harder: *“It’s not about physical distance—it’s about whether the harm is the means or a side effect.”*  
     - **Now name it:** *“This is the core of the* doctrine of double effect*—we’ll explore it next class.”*  

  4. **Tie back (5 min):**  
     - *“Did the numbers (1 vs. 5) feel less decisive in Scenario 2? That’s the doctrine at work—the structure matters, not just the math.”*  

  ---

  ### **Predictable Problems & Fixes:**  
  1. **Problem:** Students dismiss stakes if rewards are weak.  
     **Fix:** Use coveted rewards (e.g., good candy) and emphasize scarcity (*“Tokens are limited!”*).  

  2. **Problem:** Group F feels targeted and sabotages voting.  
     **Fix:** Pre-empt this: *“Groups are randomly assigned—no one is ‘F’ twice.”* If F protests, say: *“Your discomfort is part of the point—let’s discuss it later.”*  

  3. **Problem:** Students focus on token math, not moral structure.  
     **Fix:** In debrief, ask: *“If the numbers were equal, would you still vote differently? Why?”* to surface the structural intuition.  

  4. **Problem:** Time runs short during votes.  
     **Fix:** Use strict timers. Skip group discussion if needed—focus on voting and debrief.  

  ---

  ### **Limitation of the Activity:**  
  - **Cannot reproduce gravity of death:** Tokens lack the emotional weight of lives. Students may not feel the same depth of moral horror as in the trolley problem, making the "intended harm" feel less taboo.  
    **Mitigation:** Acknowledge this in debrief: *“Real harm changes the stakes, but the structural intuition is the same.”*  

  **Run it next class—students will argue passionately, and the distinction will stick!**
