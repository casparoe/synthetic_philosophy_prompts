  ok so in my econ class we were talking about supply and demand and my teacher brought up how theres this massive shortage of kidneys for transplants — like literally thousands of people die on the waiting list every year. and i was like, well why dont we just let people sell them? and apparently in the US and basically everywhere else, selling your kidney is illegal. you can go to prison for it. but here's the thing i cant get past: you can donate a kidney while youre alive and everyone calls you a hero. you can sell your blood plasma — i literally did it last month for like fifty bucks. you can sell sperm, eggs, hair, you can be a surrogate and carry someone elses baby for money. you can take jobs like crab fishing or roofing or mining where you might actually die, and nobody says thats illegal. but a kidney, which you have two of and can live totally fine with one, is where we draw the line? my friend said its because poor people would get exploited into selling their kidneys, but poor people are already exploited into doing dangerous jobs and we dont ban those — we regulate them with safety rules and minimum wage and stuff. so why not regulate kidney sales instead of banning them? it feels like theres some deeper assumption at work here about what the body is or what money does to certain things that nobody is saying out loud. like the law is treating a kidney as different in kind from plasma or labor or eggs, and i want to know what picture of personhood or value or dignity that difference is built on. give me exactly five distinct philosophical commitments or assumptions that the ban on kidney sales seems to presuppose, each explained in a sentence or two, with no intro or conclusion — just the five numbered items.
