answer: |-
  Here are five distinct philosophical commitments or assumptions underlying the ban on kidney sales, each explained concisely:

  1.  **Commodification of the Body as Inherently Degrading:** The ban assumes that treating human body parts as marketable commodities fundamentally violates human dignity by reducing aspects of the person to mere objects for commercial exchange, unlike compensated labor or renewable tissues like plasma.
  2.  **Non-Renewability Creates Unique Harm:** It presupposes that selling an irreplaceable, non-regenerative vital organ (like a kidney) constitutes a qualitatively different and more severe violation of bodily integrity than selling renewable tissues (plasma, hair) or reproductive cells (sperm/eggs), due to its permanent physical alteration.
  3.  **Absolute Vulnerability Trumps Mitigable Risk:** The ban assumes that the potential economic coercion of the desperately poor in organ sales is so profound and unavoidable that it inherently invalidates consent, unlike dangerous labor jobs where regulation (safety laws, minimum wage) is deemed sufficient to mitigate risk and preserve meaningful choice.
  4.  **Human Value is Irreducible to Price:** It rests on the assumption that attaching a monetary price to fundamental, non-renewable components of human life (like organs) intrinsically reduces human worth to a market value, corrupting social notions of the sacredness of life in a way that pricing labor or renewable bodily products does not.
  5.  **The Body as an Inalienable Whole:** The ban presupposes a view that the human body is an indivisible entity integral to personhood; selling a vital organ represents an unacceptable fragmentation and alienation of the self that differs fundamentally from selling separable products (eggs, sperm) or services (surrogacy, labor) derived *from* the body.
