  The irreducibility point is subtle but important: the idea that putting a price on organs reduces human worth to monetary value in a way that selling labor hours doesn't. That's probably why eggs/sperm get a pass - they're seen as renewable "tissues" rather than core body parts. 

  Finally, the symbolic boundary - kidneys likely represent some threshold where body integrity becomes sacred. We tolerate plasma and hair sales because they don't cross that symbolic line. This explains the inconsistency the user noticed. 

