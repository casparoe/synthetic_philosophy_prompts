  I'll start by identifying key paradoxes: Infinitarian Paralysis, Expansionist Paradox, Aggregation Puzzle, and the Problem of All Too Easy Salvation. Each points to a different failure mode. Then move to test cases like Two Infinite Worlds and Variable Value Density worlds. These test basic comparisons and sensitivity to structure.

