answer: |-
  Here's a systematic breakdown of the desiderata for an adequate theory of infinite value aggregation, structured as you requested. This list synthesizes core problems, test cases, formal constraints, and impossibility results, drawing on the foundational literature (Bostrom, Vallentyne, Hamkins, Montero, Arntzenius, etc.).

  **Core Non-Negotiables (Avoiding Collapse & Paralysis):**

  1.  **Avoid Infinitarian Paralysis:**
      *   **Requirement:** Must justify finite actions having moral significance *even if* the universe is spatiotemporally infinite.
      *   **Case:** The basic problem itself. If adding a billion utopian lives or preventing a billion tortures is deemed "irrelevant" because |∞ + n| = |∞|, then all finite actions seem pointless. A theory must dissolve this paralysis.
      *   **Non-Negotiable? Yes.** Failure here renders ethics practically inert in an infinite context. Any solution must ground reasons for finite actions.

  2.  **Enable Non-Trivial Comparisons:**
      *   **Requirement:** Must be able to rank at least *some* distinct infinite worlds as morally better or worse than others.
      *   **Case:** The "Two Infinite Worlds" comparison:
          *   World A: Contains all natural numbers (persons/lives), each with utility +1.
          *   World B: Contains all natural numbers, each with utility +2.
          *   Intuition: B is better than A. A theory *must* capture this.
      *   **Non-Negotiable? Yes.** Without the ability to compare *any* distinct infinite worlds meaningfully, ethics loses its comparative function entirely.

  **Handling Paradoxes & Problem Cases:**

  3.  **Resolve the Expansionist Paradox / Aggregation Puzzle:**
      *   **Requirement:** The verdict on adding a finite set of good/bad lives should not depend paradoxically on whether we "start" with the finite set or the infinite set.
      *   **Case:**
          *   Start with an infinite world of +1 lives (W1). Adding a finite set of +100 lives (F+) seems intuitively good, yielding W1 ∪ F+.
          *   Start with the finite set F+ alone. Adding the infinite world W1 (of +1 lives) seems intuitively good, yielding F+ ∪ W1.
          *   But W1 ∪ F+ and F+ ∪ W1 are plausibly isomorphic (same lives, same utilities). How can adding F+ to W1 be good *and* adding W1 to F+ be good, when the resulting worlds are identical? A theory must avoid implying that adding *any* infinite set of neutral/good lives to *any* finite set is always good, which seems absurd.
      *   **Non-Negotiable? Contentious but Crucial.** Most see this as a major flaw to be avoided, though some approaches bite the bullet. Dissolving it strengthens a theory.

  4.  **Address the Problem of All Too Easy Salvation:**
      *   **Requirement:** Must not make salvation (achieving a net positive outcome) trivially easy by simply adding enough good to an infinite background.
      *   **Case:** Imagine an infinite background world (W_inf) with net utility undefined/infinite. Adding a *single* extremely happy life (W_inf + {Happy}) seems intuitively net positive. But adding a *single* extremely tortured life (W_inf + {Tormented}) seems intuitively net negative. However, if W_inf + {Happy} is better than W_inf, and W_inf is better than W_inf + {Tormented}, then W_inf + {Happy} is better than W_inf + {Tormented}. The problem arises if a theory implies that *adding any finite good* to *any* background infinity achieves salvation, regardless of how bad the background is (e.g., if W_inf was actually mostly torture). A theory should not make salvation *too* cheap.
      *   **Non-Negotiable? Preference (Strong).** Many find this implication counterintuitive and undesirable. A robust theory should account for the *nature* of the infinite background, not just the finite addition.

  5.  **Handle Variable Value Density:**
      *   **Requirement:** Must be sensitive to the *distribution* or *density* of value over space, time, or populations within the infinite set.
      *   **Case:**
          *   World C: Infinite universe where every cubic light-year has average utility +1.
          *   World D: Infinite universe where half the cubic light-years (a proper subset) have average utility +100, and the other half have average utility -99. The *overall* density might still be +0.5, but is this better or worse than C? Intuitions differ, but a theory should be able to model such differences and potentially rank them.
      *   **Non-Negotiable? Preference.** Essential for theories emphasizing density; less critical for others, but handling it increases flexibility/realism.

  **Formal Constraints & Properties:**

  6.  **Cardinal Invariance:**
      *   **Requirement:** The ranking of worlds should depend only on the *cardinality* (size) of the sets of lives/events and their utility assignments, not on the specific *labels* (e.g., which natural numbers are assigned to which utilities).
      *   **Case:** World A (+1 on all naturals) should be equivalent to a world where we permute the assignment arbitrarily (e.g., +1 on evens, +1 on odds). It shouldn't matter *which* specific entities have which utilities, only *how many* have each utility.
      *   **Non-Negotiable? Contentious.** Hyperreal approaches often violate this (dependence on ultrafilter choice). Density/causal approaches generally respect it. Seen as fundamental by some (Vallentyne), sacrificed by others for other desiderata.

  7.  **Permutation Invariance:**
      *   **Requirement:** A stronger version of Cardinal Invariance. Worlds that are permutations of each other (i.e., identical up to a relabeling of locations/individuals) must be judged morally equivalent.
      *   **Case:** World A. World A' is identical but person 1 and person 2 swap utilities. A and A' must be equivalent. This is generally considered non-negotiable for basic fairness/consistency. Violations imply arbitrariness.
      *   **Non-Negotiable? Near-Universal Yes.** Violating this is widely seen as unacceptable.

  8.  **Sensitivity to Finite Changes (Limited):**
      *   **Requirement:** Must be able to detect the moral difference made by *some* finite changes to an infinite world, even if not *all* finite changes are detectable (due to the background infinity).
      *   **Case:** Adding a single extremely tortured life to World A (all +1) should make it worse. Adding a single extremely happy life should make it better. A theory must allow for this *somewhere* to avoid paralysis.
      *   **Non-Negotiable? Yes.** Core to avoiding paralysis (#1).

  9.  **Asymmetry of Good and Bad (Limited):**
      *   **Requirement:** The theory should not treat the addition of finite good and finite bad symmetrically *in all contexts*. Preventing finite bad might be more urgent than creating finite good, even against an infinite background.
      *   **Case:** Adding one tortured life to World A seems worse than failing to add one happy life to World A. A theory shouldn't necessarily imply symmetry here.
      *   **Non-Negotiable? Preference (Strong).** Many ethical theories (deontology, consequentialism with prioritization) value harm avoidance over benefit provision. A good infinite theory should accommodate this asymmetry.

  **Impossibility Results & Trade-offs:**

  *   **The Core Impossibility:** There is no total preorder (complete, reflexive, transitive ranking) on infinite utility streams that satisfies **all** of the following simultaneously:
      1.  **Finite Pareto (Weak Sensitivity):** If two worlds are identical except for a finite number of locations, and at those locations, one world has strictly higher utility for *every* differing location, then that world is strictly better.
      2.  **Permutation Invariance (PI):** Relabeling locations doesn't change value.
      3.  **Completeness:** Any two worlds are comparable.
      *   **Implication:** We *must* give up at least one. This is fundamental (related to Hamkins & Montero, extending earlier social choice results).
  *   **Key Trade-offs:**
      *   **Hyperreals:** Sacrifice **Cardinal Invariance** and sometimes **Permutation Invariance** (depending on ultrafilter) to gain **Completeness** and **Finite Pareto/Sensitivity**. Handle **Two Worlds (B>A)** easily. Struggle with **Expansionist Paradox** and **All Too Easy Salvation**. **Paralysis** avoided.
      *   **Value Density (Averaging):** Sacrifice **Completeness** (worlds with undefined/uncomparable densities exist) and sometimes strict **Finite Pareto** (density might not change with finite differences) to gain **Cardinal Invariance**, **Permutation Invariance**, and handle **Variable Density**. **Paralysis** avoided if density changes matter. **Expansionist Paradox** often dissolved. **All Too Easy Salvation** depends on density calculation.
      *   **Discounting (Temporal/Causal):** Sacrifice **Completeness** (infinite future sums may diverge) and **Permutation Invariance** (order matters fundamentally). Gains **Sensitivity to Finite Changes** (especially near "now") and avoids **Paralysis**. Handles **Two Worlds** only if discounting applies uniformly. Struggles with **Expansionist Paradox** and **Asymmetry** depends on discount function. **All Too Easy Salvation** is avoided (bad future isn't discounted away).
      *   **Causal Approach (Affecting Infinity):** Sacrifices **Completeness** and **Cardinal/Permutation Invariance** in favor of grounding significance in *which* infinity an agent can affect. Explicitly avoids **Paralysis** by defining finite impact. Handles **Two Worlds** only if comparing causally accessible parts. Aims to dissolve **Expansionist Paradox** by focusing on the act of addition itself. **All Too Easy Salvation** is context-dependent (what can you actually cause?).

  **Quick Scorecard Summary (Satisfies/Struggles With/Rejects):**

  | Desideratum          | Hyperreals   | Value Density | Discounting | Causal        |
  | :------------------- | :----------- | :------------ | :---------- | :------------ |
  | **1. Avoid Paralysis** | ✔️           | ✔️ (Usually)  | ✔️          | ✔️ (Core Aim) |
  | **2. B > A**         | ✔️ Easily    | ✔️ (If denser)| ✔️ (If disc) | ❓(Context)    |
  | **3. Expansionist P.**| ⚠️ (Struggles)| ✔️ (Dissolves)| ⚠️          | ⚠️/✔️ (Focus) |
  | **4. All Too Easy S.**| ⚠️ (Problem) | ⚠️/✔️         | ✔️          | ⚠️/✔️         |
  | **5. Variable Density** | ⚠️ (Limited) | ✔️ (Core)     | ⚠️          | ❓             |
  | **6. Cardinal Inv.** | ❌ (Rejects) | ✔️            | ❌ (Order)  | ❌ (Causal)   |
  | **7. Perm. Inv.**    | ⚠️/❌ (UF Dep)| ✔️            | ❌ (Order)  | ❌ (Causal)   |
  | **8. Sens. Fin. Chg** | ✔️ (Limited) | ❌ (Often)    | ✔️          | ✔️ (Core Aim) |
  | **9. Asymmetry**     | ⚠️ (Neutral) | ⚠️ (Neutral)  | ⚠️ (Disc fn)| ⚠️/✔️         |
  | **Completeness**     | ✔️           | ❌            | ❌ (Often)  | ❌            |
  | **Finite Pareto**    | ✔️           | ❌ (Often)    | ⚠️          | ❓             |

  **Key Takeaways:**

  1.  **Paralysis and Basic Comparison are Non-Negotiable:** Any viable theory *must* solve these.
  2.  **Trade-offs are Inescapable:** The core impossibility result forces choices. You cannot have Completeness, Permutation Invariance, *and* Finite Pareto/Sensitivity.
  3.  **Formal Properties Matter:** Cardinal/Permutation Invariance are major fault lines. Sacrificing them (Hyperreals, Discounting, Causal) allows for Completeness or strong Sensitivity. Preserving them (Density) sacrifices Completeness and strict Finite Sensitivity.
  4.  **"Non-Negotiable" vs. "Preference":** Avoiding Paralysis (#1), Basic Comparison (#2), and Permutation Invariance (#7) are widely seen as non-negotiable. Resolving the Expansionist Paradox (#3) and avoiding All Too Easy Salvation (#4) are strong preferences for coherence. Handling Variable Density (#5) and Asymmetry (#9) are important for realism but more theory-dependent.
  5.  **The Desiderata List *Is* the Map:** Knowing what each approach sacrifices to gain what is crucial. Evaluating a paper means seeing which desiderata it prioritizes, which it meets, which it struggles with, and which it explicitly rejects. There is no "perfect" solution, only solutions optimized for different sets of prioritized constraints and intuitions. The desiderata highlight the unavoidable tensions inherent in the problem.
