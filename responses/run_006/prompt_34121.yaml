prompt: |-
  ok so ive been in this infinite ethics seminar for a few weeks and we've touched on the basic problem — if total value is infinite then adding or subtracting any finite amount of good or bad doesn't change the total, so why bother doing anything? — and ive read a couple papers but honestly i feel like everyone is just proposing fixes (hyperreals, value density, discounting, the causal approach, etc.) without anyone first laying out what a fix is even supposed to accomplish. so before i read another word i want the desiderata. you're a philosopher who works on infinite ethics. think carefully and be systematic. what does an adequate theory of infinite value aggregation have to get right? i want the list of requirements: the paradoxes it has to dissolve (expansionist paradox, infinitarian paralysis, etc.), the cases it has to handle (like the basic two-infinite-worlds comparison), the formal constraints it has to respect or at least reckon with, and the impossibility results that show certain subsets of desiderata can't be jointly satisfied — that last part is the one i actually care about most because if we already know we can't have everything, then the desiderata list is itself a kind of result. for each requirement, give me the case or consideration that makes it a requirement, and flag which ones are non-negotiable vs. which are just preferences of particular camps. a quick scorecard of the main approaches (hyperreal, value density, discounting, causal) against the list would be nice but the desiderata are the real deliverable.
