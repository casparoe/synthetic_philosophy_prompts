  Below is a classification instrument in decision tree form, designed to sort readers into one of six hinge epistemology positions based on concrete cases. The tree uses seven diagnostic questions (within the target range of 6–9), each grounded in a specific scenario without theoretical jargon. The probes explicitly include the requested cases: Moorean hands (Q1), the earth's existence (Q2, Q3), arithmetic (Q4), cross-framework cosmology (Q5), and clinical dementia (Q7).  

  ---

  ### **Hinge Epistemology Decision Tree**  
  *Answer each question based on intuitive judgments about the concrete cases. Do not appeal to theoretical labels.*  

  1. **Scenario:** Moore holds up his hands and says, "Here is one hand, and here is another," to refute skepticism.  
     **Question:** In this context, does Moore’s claim express something that could be *true or false*?  
     - **Yes** → Go to Q2.  
     - **No** → **Position 1: Non-propositional reading**  
       - *What it is:* Hinge certainties are not truth-apt propositions but rules/norms enabling inquiry; knowledge/doubt language is inapplicable.  
       - *Awkward commitment:* Must deny that claims like "I have hands" can be true, even when they seem factual.  

  2. **Scenario:** A geologist cites rock layers and fossils as evidence that the earth has existed for millions of years.  
     **Question:** Is this evidence *genuinely supportive* of the claim "The earth has existed for a long time"?  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q5.  

  3. **Scenario:** The same geologist considers a skeptical scenario (e.g., "What if all evidence was created five minutes ago?").  
     **Question:** Does this skeptical scenario *undermine* the geologist’s knowledge of the earth’s age in ordinary contexts (e.g., teaching a class)?  
     - **Yes** → Go to Q4.  
     - **No** → **Position 4: Dogmatic/proper-basic view**  
       - *What it is:* Hinges can be known immediately/reliably without evidence; Moore is right, skepticism is misguided.  
       - *Awkward commitment:* Dismisses intuitive force of skeptical scenarios (e.g., brain-in-vat doubts) as irrelevant.  

  4. **Scenario:** A person questions whether 2+2=4, suggesting it might be false in a non-standard arithmetic system.  
     **Question:** Is this doubt *rationally coherent* (i.e., could reasonable inquiry proceed from it)?  
     - **Yes** → **Position 5: Epistemic relativism**  
       - *What it is:* Hinge rationality is internal to frameworks; rival hinges (e.g., flat-earth vs. round-earth cosmologies) cannot be neutrally adjudicated.  
       - *Awkward commitment:* Forces granting equal rationality to anti-scientific hinges (e.g., "The earth rests on a turtle").  
     - **No** → **Position 3: Ordinary-knowledge contextualism**  
       - *What it is:* Hinges can be known in everyday contexts but not under skeptical scrutiny; Moore/skeptic are both partly right due to shifting standards.  
       - *Awkward commitment:* Concedes we lack knowledge in philosophy class of what we "know" in daily life (e.g., having hands).  

  5. **Scenario:** A Flat Earth community uses their hinge ("Earth is flat and rests on a turtle") to interpret all evidence (e.g., horizons, eclipses).  
     **Question:** Is their hinge *as rational as* our scientific hinge ("Earth is a planet orbiting the sun")?  
     - **Yes** → **Position 5: Epistemic relativism** (as above).  
     - **No** → Go to Q6.  

  6. **Scenario:** Moore tries to prove he has hands to a skeptic who doubts *all* sensory evidence.  
     **Question:** Can Moore *know* he has hands in this skeptical context?  
     - **Yes** → **Position 4: Dogmatic/proper-basic view** (as above).  
     - **No** → Go to Q7.  

  7. **Scenario:** A person with advanced dementia sees their own hands but denies, "These are not hands."  
     **Question:** Is this denial *mistaken* (i.e., is their belief *false*)?  
     - **Yes** → **Position 6: Skeptical invariantism**  
       - *What it is:* Hinges are truth-apt, but we lack knowledge/justification for them; Moore’s proof fails.  
       - *Awkward commitment:* Denies we are rational in trusting hinges (e.g., "I have hands"), despite their foundational role.  
     - **No** → **Position 2: Entitlement reading**  
       - *What it is:* Hinges are truth-apt propositions we may rationally trust without evidence, but this falls short of knowledge.  
       - *Awkward commitment:* Denies knowledge of hinges (e.g., 2+2=4) despite their apparent certainty.  

  ---

  ### **Notes on the Tree**  
  - **Empty Cells:** The path **Q1: No** leads cleanly to non-propositionalism. No combination is incoherent, but the following are unoccupied:  
    - *Q2: No → Q5: Yes → Q6: Yes*: Would affirm cross-framework rationality but allow knowledge under skepticism. Undefended and unstable.  
    - *Q2: No → Q5: Yes → Q6: No → Q7: No*: Would deny hinge knowledge and truth, yet reject entitlement. Unattractive (no positive epistemic status).  
  - **Ambiguity & Refinement:**  
    - **Relativism (Position 5)** may sometimes align with **non-propositionalism (Position 1)** on cross-framework cases (e.g., both deny one cosmology is "truer"). To separate them, add:  
      - **Further Scenario:** *A child learns "2+2=4" by counting apples.*  
      - **Refinement Question:** "Does the child’s counting *justify* their belief, or merely *train* them in a rule?"  
        - Justify → Relativism (treats hinges as propositions justified within frameworks).  
        - Train → Non-propositionalism (denies truth-aptness).  
    - The tree cleanly distinguishes all six positions as defined, but this refinement sharpens the relativism/non-propositional divide.  

  This instrument allows students to self-classify using intuitive case judgments while exposing key commitments of each view. For seminar use, accompany it with primary texts (e.g., Wittgenstein, Pritchard, Wright) to test classifications.
