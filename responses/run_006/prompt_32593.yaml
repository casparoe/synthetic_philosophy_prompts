prompt: |-
  I'm trying to figure out what I actually think about when it's rational to follow the crowd vs. when it's just dumb herding, going by my gut on a bunch of cases. Here they are:

  1. I'm in a foreign city, two restaurants side by side, one's empty and one's got a line out the door. I join the line. Seems fine.

  2. I'm investing and everyone's piling into some stock. I've done zero research, no private info. I buy. Also fine.

  3. I'm a doctor. Three colleagues diagnosed condition X. I examine the patient myself and my read points pretty clearly to Y — rarer but fits the symptoms better. I go with X anyway because three against one. This feels wrong to me. I think I should've trusted my own exam.

  4. I'm in a committee meeting, first three speakers all back plan A. I've got private info that plan B is better, but I'm junior and they're senior. I stay quiet. This also feels wrong, though I get why people do it.

  5. A tweet's going viral with some shocking claim. I have no private info either way. I retweet it. Feels irresponsible — I should at least wait.

  6. I'm a scientist. My field has a consensus on something, built on decades of work by hundreds of people. I run my own experiments and they seem to contradict the consensus. I assume my experiment must be flawed. This feels right to me — proper epistemic humility.

  7. Picking a movie. Rotten Tomatoes says 95%. My friend whose taste I really trust says it's terrible. I watch it anyway based on the aggregate. Fine.

  8. I'm hiring. First two interviewers strongly recommend candidate A. I interview A and find them mediocre; candidate B seems great. But the first two are experienced and I'm new to this. I go with A. This is the one I genuinly can't settle — I go back and forth.

  Is there a principle that gets all or most of these? Cases 3 and 6 especially bug me because they feel similar — private evidence vs. group judgment — but I come out opposite. And case 2 vs. case 5: both following the crowd with no private info, but I judge them differently. I want to know what principle unifies my verdicts, which ones it forces me to abandon, and what it says about case 8. Also, please say how confident you are in the principle you end up with and what point you're least sure about.
reasoning: |-
  Okay, the user is trying to figure out when it's rational to follow the crowd versus when it's just dumb herding. They've provided eight different scenarios where they have gut feelings about whether following the crowd is the right call. Let me start by understanding each case individually.

  First, in case 1, joining a busy restaurant in a foreign city makes sense. People likely have local knowledge, so the crowd's behavior is a good signal. Case 2, investing in a stock everyone's buying without research, they think it's fine. That seems like relying on market trends, which can be rational if you assume others have info. But why is that different from case 5, retweeting a viral claim? Both involve no private info, but they judge retweeting as irresponsible. Maybe because misinformation spreads easily, and the cost is higher?

  Case 3 and 4 involve private evidence versus group judgment. As a doctor, disagreeing with colleagues but going with their diagnosis feels wrong because the doctor has direct evidence. In the committee, staying quiet despite private info feels wrong too. But in case 6, a scientist doubting their own experiment against consensus feels right. Why? The consensus here is based on rigorous, peer-reviewed work, so overriding it requires very strong evidence. The doctor's colleagues might not have the same level of evidence as a scientific consensus.

  Case 7, picking a movie based on aggregate reviews over a trusted friend, seems fine because aggregates average out biases. Case 8, hiring where experienced interviewers recommend A, but the person finds B better, is tricky. The user is conflicted. Here, the private assessment might clash with others' experience. Need to weigh the quality of others' judgment versus personal observation.

  The key differences might be: the cost of being wrong, the expertise of the crowd, access to private information, and whether the group's decision is based on aggregated wisdom or just social pressure. For restaurants, low cost and crowd's local knowledge. Investing might have higher costs, but market trends can be informative. Retweeting without verification has social costs. In medicine, a wrong diagnosis could harm the patient, so personal assessment matters. In science, overturning consensus requires overwhelming evidence due to the established process. Hiring depends on whether the interviewers' experience trumps the junior person's fresh perspective.

  The user's underlying need is a coherent principle to navigate these situations. They might be looking for a framework to decide when to trust themselves versus the group, especially in professional settings where stakes are high. Their unspoken need could be reducing cognitive dissonance and feeling confident in their decisions. The principle should balance private evidence with group wisdom, considering expertise, stakes, and information quality.
answer: |-
  Based on your case-by-case judgments, you're intuitively applying a consistent principle, though it has several interlocking factors. The core principle seems to be:

  **Rational conformity occurs when the group's judgment is a reliable signal of truth/value *and* you lack superior private information or the capacity to independently verify effectively. Dumb herding occurs when you override your own reliable private information/skills to conform *or* when the group's signal is unreliable, especially in high-stakes situations.**

  Let's break down the key factors driving your judgments:

  1.  **Quality of the Group Signal:**
      *   **Reliable:** Aggregated local knowledge (restaurants), aggregated market sentiment (stock), aggregated expert consensus (science), aggregated critic reviews (movies).
      *   **Potentially Unreliable:** Viral tweets (low barrier, misinformation spread), groupthink in committees/hiring (social pressure, limited perspective), colleagues' diagnoses (could be biased/rushed).

  2.  **Access & Reliability of Private Information:**
      *   **Lack Private Info:** Restaurant choice, stock purchase, viral tweet (no info). Following the crowd is rational here *if* the signal is reliable.
      *   **Possess Reliable Private Info:** Doctor's exam (direct observation), committee member's private data (specific evidence), hiring interviewer's assessment (direct interaction). Overriding this feels wrong.
      *   **Private Info Potentially Flawed:** Scientist's experiment (requires extreme scrutiny against established consensus). Trusting the group feels right.

  3.  **Stakes & Consequences:**
      *   **Lower Stakes:** Restaurant choice, movie choice. Lower cost for being wrong, easier to justify following the crowd.
      *   **Higher Stakes:** Medical diagnosis, committee decision, scientific truth, hiring decision, spreading misinformation. Higher cost demands more justification for overriding private judgment *or* for blindly following an unreliable crowd.

  4.  **Mechanism of Aggregation:**
      *   **Wisdom-of-Crowds:** Works well when judgments are independent, diverse, decentralized, and aggregated (restaurant lines, stock market *sentiment*, scientific consensus via peer review, Rotten Tomatoes).
      *   **Social Influence/Groupthink:** Prone to error when conformity pressure exists, information cascades start, or diversity is lacking (committee meeting, potentially colleagues' diagnosis, viral tweets based on virality not truth).

  **Applying the Principle to Your Cases:**

  1.  **Restaurant:** *Rational.* Reliable signal (local experience aggregated), no private info, low stakes. ✅
  2.  **Stock (No Research):** *Rational (but risky).* Market sentiment *can* be a signal (though noisy), no private info. You judge it "fine" likely assuming it's low-stakes or short-term. ✅ (But note: This is closer to herding than 1; market bubbles are dumb herding fueled by similar logic).
  3.  **Doctor:** *Dumb Herding.* You possess reliable private information (direct exam), colleagues' consensus signal *might* be unreliable (rushed? groupthink?), stakes are very high (patient outcome). Trusting your exam is correct. ❌
  4.  **Committee:** *Dumb Herding.* You possess reliable private information, the group signal is likely unreliable due to social pressure/conformity cascade (first speakers set tone), stakes are significant. Staying quiet feels wrong because you *should* contribute unique info. ❌
  5.  **Viral Tweet:** *Dumb Herding/Irresponsible.* The group signal (virality) is highly unreliable for truth (driven by engagement, emotion, bots). Stakes are high (spreading misinformation). "Wait and verify" is correct. ❌
  6.  **Scientist:** *Rational Conformity.* The group signal (scientific consensus) is highly reliable (built on robust, independent verification). Your private information (single experiment) is highly likely to be flawed compared to this aggregated expertise. Stakes are high (scientific integrity). Epistemic humility is correct. ✅
  7.  **Movie:** *Rational.* Reliable signal (aggregated critic reviews - wisdom-of-crowds), private signal (trusted friend) is outweighed by the much larger, diverse sample. Low stakes. ✅
  8.  **Hiring (Your Conflict):** *Leaning Towards Dumb Herding, but Ambiguous.* You possess reliable private information (direct interview assessment). The group signal (two experienced interviewers) *could* be reliable, but:
      *   Their experience vs. your "newness" matters: Are they truly more skilled *assessors*, or just more senior? Did they see something you missed, or are you seeing something they overlooked?
      *   **The Principle's Verdict:** Given your direct observation finding A "mediocre" and B "great," overriding your own reliable assessment to conform feels wrong (like Cases 3 & 4). The key is whether you trust their *judgment process* more than your own *perception*. If you genuinely believe they are significantly better assessors *and* your perception might be flawed (e.g., missed red flags, misinterpreted enthusiasm), conformity *could* be rational. However, your strong positive assessment of B suggests your private info is valuable. **Most likely:** You should voice your concerns strongly and advocate for B, or at least demand a deeper discussion/review. Blindly going with A against your direct evidence feels like herding.

  **Resolving Your Conflicts:**

  *   **Case 2 vs. Case 5:** Both involve no private info. The difference is the **reliability of the crowd signal** and the **stakes/consequences**.
      *   Stock Market: Sentiment *can* be a meaningful (though imperfect) signal in finance; potential loss is personal/financial.
      *   Viral Tweet: Virality is a *terrible* signal for truth; consequence is spreading potential harm/misinformation socially. Case 5 has a less reliable signal and higher social stakes.
  *   **Case 3 vs. Case 6:** Both involve private info vs. group judgment. The difference is the **reliability/robustness of the group signal** and the **likelihood your private info is flawed**.
      *   Doctor: 3 colleagues' diagnoses are *not* equivalent to a scientific consensus. It's a small, potentially biased sample without the rigorous independent verification of science. Your direct exam is strong evidence. Stakes are high - trust your info.
      *   Scientist: The consensus *is* the result of extensive, independent verification. The prior probability your single experiment is flawed is *much* higher than the entire consensus being wrong. Stakes are high - trust the group (initially, then meticulously check your work).

  **Confidence in the Principle:**

  *   **High Confidence (90%):** This principle effectively captures the core reasoning behind your intuitive judgments across the diverse cases. It explains the differences you noted (2 vs. 5, 3 vs. 6) and provides a clear framework for case 8. It integrates the crucial elements: signal reliability, private information quality, stakes, and aggregation mechanism.
  *   **Point of Least Certainty:**
      *   **Quantifying "Reliable" Signal & "Superior" Private Info:** The principle relies on judgments about these factors, which can be subjective and context-dependent. Exactly *how* reliable does the group need to be? *How* certain must you be in your private info? (e.g., Case 8 hinges entirely on this assessment).
      *   **Weighting Stakes:** While clear at extremes (restaurant vs. diagnosis), the relative weighting of stakes vs. signal quality in intermediate cases can be tricky.

  **Conclusion:**

  Your gut feelings reveal a sophisticated, pragmatic approach to social learning. You instinctively weigh the wisdom of the crowd against the value of your own perspective, considering the stakes involved. The principle **"Follow the crowd when its signal is reliable and you lack better information; trust yourself (or speak up) when you have reliable private information, especially if the crowd's signal is weak or the stakes are high"** unifies your judgments well. It forces you to potentially re-evaluate Case 2 (stock) as riskier herding than Case 1, and strongly suggests that blindly following in Case 8 (hiring) is likely irrational conformity overriding valuable direct evidence. Case 6 highlights the critical importance of understanding *why* a consensus exists. This framework provides a robust starting point for navigating the complex choice between collective wisdom and individual judgment.
