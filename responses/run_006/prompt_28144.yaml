answer: |-
  Here’s the restatement and residue report, tailored to your craft:

  ### Bongard Problems as Literary Characterization  
  **Philosophically**, Bongard problems mirror the alchemy of character creation:  
  - **Sparsity as Power**: Just six images per side force perceptual leaps. Your cigarette gesture or chaotic kitchen *are* those minimal visual triggers—synecdoche for a psyche.  
  - **Showing vs. Telling as Rule Induction**: The "rule" (e.g., "shapes with right angles") isn’t stated; it’s *induced* from contrasts. Your details ("hesitation before answering") demand the reader *infer* the rule ("this character hides guilt") without narration naming it.  
  - **Type vs. Individual via Negative Space**: The right-hand Bongard squares (counterexamples) act as foils. Your character’s messy table *amidst* tidy surroundings screams "disorderly intellectual," avoiding cliché by what *isn’t* shown.  
  - **Prior Knowledge as Co-Creation**: A reader’s history with fictional drunks or detectives fills gaps between your details—just as prior exposure to "inside/outside" concepts solves Bongard grids.  
  - **Cliché as Overfitting**: If all six left-side examples scream "alcoholic writer" (whisky bottles, crumpled pages), the "concept" is trivial. Depth emerges when details *resist* easy categorization (e.g., a half-finished chess puzzle beside the whisky).  

  ### The Residue Report  
  **What doesn’t translate**:  
  1. **Formal Feature Extraction**: Bongard often relies on geometric primitives (curves, symmetry). Your details are semantic ("a dog-eared passport"), irreducible to vectors. This *isn’t* a flaw—your framework captures the messy, contextual humanity Bongard sidesteps.  
  2. **Binary Solutions**: Bongard has one "correct" rule. Characters defy single rules; their contradictions *are* their aliveness. A Bongard "misclassification" (e.g., misreading a detail) parallels reader reinterpretation—but your art thrives on this ambiguity.  
  3. **Emotion as Noise**: Concept-induction research often treats affect as incidental. For you, emotion *is* the signal. A cigarette’s tremor isn’t just data; it’s the gravitational core of inference.  

  **Why the gap?**  
  Bongard problems reveal how humans *abstract*, but your work reveals how we *empathize*. The literature’s focus on logical pattern-missing misses the role of *embodied experience* in reader inference (e.g., recognizing shame in a hesitation because we’ve felt it). This isn’t a shortcoming in your framework; it exposes that Bongard’s "concepts" are bloodless cousins of lived understanding. The philosophical pivot: **Bongard illuminates cognition; your craft illuminates consciousness.**  

  > In brief: *Bongard problems are the geometric skeleton of characterization—your details clothe it in flesh, and readers animate it with breath.*  

  —  
  *Notebook-ready:* **In brief: Characterization is Bongard with blood—sparse details imply rules of soul, and readers complete the circuit with their own wounds.**
