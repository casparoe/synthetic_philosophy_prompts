  ## Joint Statement: Schopenhauerian & Hanslickian Formalist After Adversarial Collaboration

  After one year of sustained, good-faith dialogue examining the nature of music, we, the undersigned Schopenhauerian and Hanslickian Formalist, present the following joint statement. We have sought common ground, clarified our core differences beyond mere terminology, and identified specific points where future evidence or argument might potentially shift our views. This document reflects areas of agreement, precisely states our remaining disagreements, identifies the crucial points of contention ("cruxes"), and proposes potential tests.

  ### I. Points of Agreement (Signed by Both)
  Both parties affirm the following statements, finding the wording sufficiently precise and neutral to avoid smuggling in the other's core assumptions:

  1.  **Non-Conceptual Nature:** Music operates primarily and most powerfully outside the realm of discursive concepts or linguistic representation. Its primary impact is not dependent on conveying propositional content or specific, nameable images or ideas in the way literature or representational painting does.
  2.  **Temporal and Dynamic Form:** Music's essence is fundamentally temporal and dynamic. Its structure unfolds over time through the relationships and transformations of tones (pitches, durations, timbres, intensities) organized as melody, harmony, rhythm, and texture. This formal dynamism is central to its aesthetic character.
  3.  **Abstractness Compared to Other Arts:** Unlike painting, sculpture, or poetry, which typically represent or refer to objects, persons, scenes, or narratives in the empirical world (either literally or symbolically), music lacks inherent, direct representational content pointing to specific external objects or concepts. Its materials (sounds) are inherently non-representational.
  4.  **Universality and Immediacy:** Music possesses a unique capacity for universal resonance and immediate affective impact across cultures and historical periods, often bypassing intellectual mediation more readily than many other arts.
  5.  **Power of Evocation:** Music demonstrably evokes powerful subjective responses in listeners, including complex affective states often labeled as "emotions," with an intensity and directness frequently unmatched by other art forms. These responses are a significant part of the musical experience for most listeners.
  6.  **Formal Analysis is Foundational:** The analysis of tonal relationships, structure (e.g., phrase, motive, development, form), rhythm, and texture is essential and indispensable for understanding how music works, how it coheres, and how it creates aesthetic interest and satisfaction.

  ### II. Table of Core Disagreements

  | # | Point of Disagreement          | Schopenhauerian Position (Formulation)                                                                                                                                 | Hanslickian Formalist Position (Formulation)                                                                                                                                 | Neutral Statement of the Stakes                                                                                                                                                                  |
  | :-- | :------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1** | **Music's Fundamental Referent/Object** | "Music is a direct and immediate objectification and copy of the Will *itself* (the metaphysical essence underlying all phenomena), bypassing the Platonic Ideas which are the objectification of the Will for all other arts." | "Music has no referent or object beyond its own sounding forms. It represents nothing external (neither the empirical world, concepts, nor any metaphysical entity like 'Will'). Its content *is* its moving tonal forms in time." | **What is music fundamentally *about* or a *depiction of*?** Is it a unique reflection of a metaphysical reality (Will), or is its meaning and content entirely immanent within its own audible structure? |
  | **2** | **Nature of Expressiveness/Content** | "Music's power and content lie in its direct manifestation of the dynamic essence of Will (striving, satisfaction, suffering, etc.). Its expressiveness *is* this manifestation, not mere resemblance." | "Music's 'expressiveness' is a perceived resemblance between the dynamic patterns of the tonal motion (e.g., tempo, rhythm, harmonic tension/release) and the dynamic patterns of human feeling or movement. It does not 'contain' or 'manifest' feelings or anything else; it moves *like* them." | **Is musical expressiveness an intrinsic property reflecting an external reality (metaphysical or emotional), or is it a perceived analogy between musical dynamics and the dynamics of inner/outer life?** |
  | **3** | **Source of Emotional Effects** | "The profound emotional impact of music is caused *intrinsically* by its direct manifestation of the Will, which is the very ground of our being. The forms are the *means* of this manifestation." | "The emotional effects experienced by listeners are either: (a) a direct physiological/psychological response to the formal properties (e.g., tension/release, rhythmic drive), or (b) subjective associations imported by the listener based on experience or cultural context. The forms *are* the cause, not a means to something else." | **What is the *causal mechanism* linking musical form to the listener's affective response?** Is the response triggered by music embodying a fundamental reality, or is it triggered by the structure itself and/or listener association? |
  | **4** | **Metaphysical Status/Significance** | "Music possesses unique metaphysical significance as the only art providing direct, unmediated knowledge of the thing-in-itself (the Will). This is the root of its unparalleled power and universality." | "Music possesses no metaphysical significance beyond its status as a humanly constructed, abstract, temporal art form. Its power and universality stem from the inherent aesthetic potential of organized sound perceived by human cognition and affect." | **Does music provide unique metaphysical insight, or is its value solely aesthetic and grounded in human perception/cognition?** |

  ### III. Cruxes: Potential Tests for Core Disagreements

  We identify the following points as "cruxes" – specific questions where empirical evidence, logical argument, or conceptual clarification could, in principle, cause at least one side to significantly modify or abandon their core position. For each crux, we describe a concrete case, experiment, or argument both sides agree is relevant and record each side's prediction.

  1.  **Crux: Does Musical Structure Intrinsically Mirror the Dynamics of "Will" (or Primal Feeling)?**
      *   **Test Case/Argument:** Analyze specific musical passages universally recognized as expressing profound joy, deep sorrow, or restless striving (e.g., specific sections of Bach's Chaconne, Mozart's Requiem Lacrimosa, Beethoven's 5th 1st mvt). Examine the precise formal structures (harmonic progression, rhythmic patterns, melodic contour, texture). Is there an *intrinsic, necessary*, and *universally recognizable* parallel between these structures and the postulated dynamics of Schopenhauer's Will (or the core dynamics of the named emotions) that cannot be explained solely by learned association or resemblance to bodily states/movement? Can we derive the "meaning" solely from the form without reference to extra-musical concepts?
      *   **Schopenhauerian Prediction:** Yes. The connection is intrinsic and necessary. The very structures *are* the Will objectified. Analysis will reveal that the formal elements *constitute* the emotional/metaphysical content directly. Removing the association/concept label wouldn't change the essential nature of the experience the structure evokes.
      *   **Formalist Prediction:** No. While strong resemblances may exist and certain structures reliably *suggest* emotions due to learned associations or inherent similarities to vocal expression or motion, the connection is not intrinsic or necessary. The "meaning" is projected onto the form. Analysis will show the structures are aesthetically interesting and dynamic in themselves, and the emotional labels are interpretations applied *to* them. Different cultures might interpret the same structure differently.

  2.  **Crux: Is Emotional Resonance Necessary for Full Musical Understanding?**
      *   **Test Case/Experiment:** Can a listener with profound analytical understanding of musical form (e.g., a music theorist with alexithymia, or someone deliberately adopting a purely analytical stance) fully grasp the aesthetic essence and value of a complex, emotionally charged piece (e.g., a late Beethoven quartet) *without* experiencing any significant affective response? Does purely formal analysis exhaust the meaning and impact of the work?
      *   **Schopenhauerian Prediction:** No. Without the direct, affective apprehension of the Will manifested in the forms, the listener misses the core of what music *is* and why it matters. Formal analysis describes the vessel, not the profound content it carries. The experience remains incomplete.
      *   **Formalist Prediction:** Yes. While affective responses are common and often enhance enjoyment, the aesthetic object *is* the form. A highly trained listener appreciating the intricate relationships, developments, tensions, and resolutions solely as formal phenomena can achieve a complete and profound understanding of the musical work *qua* music. The "essence" is the form successfully realized.

  3.  **Crux: Universality vs. Cultural Relativity of Musical "Expression"**
      *   **Test Case/Experiment:** Rigorous cross-cultural studies exposing listeners from diverse musical traditions (e.g., Western classical, Javanese Gamelan, Hindustani Raga, West African drumming) to structurally analogous passages from unfamiliar traditions designed to probe specific dynamic qualities (e.g., passages built on rising tension, sudden release, stately procession, frantic energy). Do listeners consistently identify analogous emotional/metaphysical qualities ("striving," "peace," "joy," "agony") based *only* on the formal structure, independent of cultural context or programmatic hints?
      *   **Schopenhauerian Prediction:** Yes, with significant consistency for core dynamic states. The direct manifestation of Will should be universally apprehensible, at least for fundamental states, transcending cultural specifics.
      *   **Formalist Prediction:** Some basic kinetic responses (fast/slow, loud/soft, smooth/jagged) might be widely shared, but specific emotional/metaphysical attributions will show significant cultural variation and dependence on learned associations within each tradition. The *same* formal structure might evoke different interpretations across cultures.

  4.  **Crux: The Perceived "Necessity" of Musical Structure.**
      *   **Argument:** Examine the perceived "inevitability" or "rightness" of certain musical resolutions (e.g., the cadence in tonal harmony). Does this feeling of necessity stem from:
          (a) The structure mirroring a necessary metaphysical process (Will's striving and temporary satisfaction)?
          (b) Innate cognitive/perceptual principles of expectation and fulfillment (e.g., Gestalt principles, statistical learning)?
          (c) Learned cultural conventions?
      *   **Schopenhauerian Prediction:** (a) is fundamental. The feeling of necessity reflects the deep structure of Will. While (b) and (c) may play a role, they are surface manifestations of this deeper reality. Tonal gravity feels necessary because it *is* metaphysically necessary.
      *   **Formalist Prediction:** (b) and (c) provide a complete explanation. The feeling of necessity arises from the interplay of innate perceptual/cognitive mechanisms shaped by exposure to musical systems (conventions). Different musical systems (e.g., atonal, microtonal) can establish their own compelling forms of necessity through consistent internal logic, demonstrating it's not dependent on a single metaphysical scheme. Metaphysical "necessity" is an unwarranted projection.

  ### IV. Committed Commentary by the Drafter

  *   **Mere Verbal Disagreement?** While some surface arguments might appear verbal (e.g., both use words like "feeling," "movement," "expression"), the core disagreement is **substantive**. The fundamental divergence lies in the *ontological status* assigned to music's content and its relationship to reality. The Schopenhauerian posits a metaphysical referent (Will); the Formalist denies any referent beyond the form itself. This is not a debate about definitions but about what music fundamentally *is*.
  *   **Assessment of Arguments:**
      *   **Strengths of Formalism:** Formalism offers a powerful, parsimonious, and empirically tractable account. It focuses rigorously on the audible object and human perception/cognition without invoking unverifiable metaphysical entities. Its explanations for musical effect (tension/release, expectation, pattern recognition, association) are robust and align well with cognitive science. Its critique of conflating listener response with musical content is compelling.
      *   **Strengths of Schopenhauerianism:** It provides a profound and unified explanation for music's unique, overwhelming power and apparent universality that formalism struggles to match in depth. It accounts for the deep *sense* of meaning and connection to fundamental reality that many listeners report, which purely formal descriptions can feel inadequate to capture.
  *   **Drafter's View:** While deeply sympathetic to the Formalist's demand for clarity and avoidance of metaphysical speculation, the drafter finds the Schopenhauerian account **more compelling on the core point of music's *unique* power and felt significance.** Formalism brilliantly explains *how* music works as an aesthetic object. Schopenhauer offers a powerful (though metaphysically heavy) explanation for *why* it moves us so profoundly and feels like a revelation of something fundamental. The Formalist risks reducing the depth of the experience to mechanics and association; the Schopenhauerian risks mystification. On balance, the Schopenhauerian intuition about music's direct connection to the core of existence, even if ultimately unprovable, seems to capture an essential aspect of the phenomenon that Formalism leaves unexplained. **The better argument currently lies with Formalism for precision and empirical grounding, but the Schopenhauerian perspective better captures the profound *phenomenology* of musical experience for many.** The cruxes, particularly #1 and #4, remain the critical battlegrounds. Genuine resolution seems unlikely without a shift in one side's fundamental metaphysical commitments or a revolutionary empirical discovery bridging the phenomenological and the formal in a way that satisfies both intuitions.

  **Signed,**

  [Schopenhauerian Representative]
  [Hanslickian Formalist Representative]
