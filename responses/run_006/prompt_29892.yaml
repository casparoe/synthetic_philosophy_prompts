answer: |-
  Here is the proposal structured as requested:

  1.  **Precise Question:** Can the interpersonal utility comparisons strictly necessary for coherent distributive and policy reasoning be grounded solely in weaker structures—such as context-specific pairwise comparability or incomplete/partially transitive orderings—rather than requiring a common cardinal scale with strong invariance properties?
  2.  **Gap in Existing Positions:** Both proponents and skeptics of interpersonal comparisons typically presuppose that such comparisons are only meaningful if they approximate a physical measurement model (a shared cardinal scale), thereby failing to explore whether normative reasoning imposes fundamentally weaker structural demands.
  3.  **Approach & Advantage:** Months 1-2: Analyze minimal comparison requirements of specific normative principles (e.g., equality, priority, sufficientarianism). Months 3-4: Characterize formal structures (e.g., interval orders, partial comparability) satisfying these requirements. Month 5: Assess sufficiency for policy models. This conceptual/normative analysis is preferable to empirical measurement attempts or axiomatic cardinalization, directly addressing the core justificatory need.
  4.  **Success/Failure Criteria:** Success: Demonstrating that plausible distributive principles can operate rigorously within a defined weaker structure, avoiding cardinal commitments. Failure: Showing these weaker structures inevitably collapse into or necessitate cardinality (or stronger) under normative pressure, or prove inadequate for core policy choices.
  5.  **Realistic Scope:** Focused conceptual exploration of necessary structures for foundational normative principles; excludes empirical utility measurement, comprehensive historical analysis, or developing new full normative theories.
