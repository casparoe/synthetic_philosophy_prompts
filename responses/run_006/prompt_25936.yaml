prompt: |-
  Here is an argument I have been unable to resolve. It appears to show that Humean accounts of objective chance cannot satisfy the Principal Principle, which would make them either false or normatively irrelevant. Each step seems plausible, but the conclusion is stronger than I think most philosophers accept.

  (1) The Principal Principle (PP): For any rational credence function Cr, proposition A, and admissible evidence E, Cr(A | Ch(A) = x ∧ E) = x. An agent who knows the chance should defer to it.

  (2) On a Humean account, chances are not metaphysically primitive. The chance of a coin's landing heads is whatever value figures in the best systematization of the total mosaic of particular facts — past, present, and future.

  (3) Suppose the Humean chance of heads on each toss of a certain coin is 1/2. Now consider the proposition U: every toss of this coin throughout the entire history of the universe lands heads. U is an undermining future: if U obtains, then the global pattern of outcomes is one in which heads occurs every time, and the best systematization of that mosaic will assign a chance much closer to 1 than to 1/2. So U entails that Ch(H) ≠ 1/2.

  (4) What is the chance of U, given that Ch(H) = 1/2? If tosses are independent with chance 1/2 each, and there are finitely many tosses, then Ch(U | Ch(H) = 1/2) is positive, though tiny. The chance function itself assigns non-zero probability to the undermining future.

  (5) By PP, a rational agent who knows that Ch(H) = 1/2 should set her credence in U equal to the chance of U — which, by (4), is positive. So Cr(U) > 0.

  (6) But the agent also knows that U entails ~Ch(H) = 1/2. Since she knows Ch(H) = 1/2, she knows ~U. A rational agent who knows ~U cannot assign Cr(U) > 0 on pain of probabilistic incoherence.

  (7) Therefore, PP and Humean chance jointly entail a contradiction. Since PP is what connects chance to rational belief — without it, chance is normatively inert — Humean chance must be rejected.

  (8) This conclusion seems too strong. Humeanism about chance is a serious position, and many philosophers want to say there are objective chances even in a deterministic world. So the argument must contain a mistake. But I cannot identify it without giving up something I am reluctant to lose.

  I am most attached to the Principal Principle and least attached to the Humean supervenience claim in (2). But I want to know: which step should I reject, and what exactly does rejecting it cost? Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Alright, let me tackle this problem step by step. The user presents an argument that Humean accounts of chance can't satisfy the Principal Principle without leading to contradiction. They've laid out clear steps, and I need to find where the mistake is. 

  First, I recall that the Principal Principle (PP) links rational credence to known chances. Humeanism says chances supervene on the entire pattern of events, including the future. The problem arises with undermining futures—like a coin landing heads every time, which would make the actual chance near 1, not 1/2. 

  The key tension is in step (4) and (5). If the chance of heads is 1/2, then the chance of all heads (U) is positive but tiny. PP says a rational agent should have some credence in U. But knowing the chance is 1/2 means U can't happen because U would make the chance different. So the agent knows U is false, yet PP forces them to assign positive credence. Contradiction.

  I remember Lewis's response to this. He modified the Principal Principle to the New Principle. The issue is that the original PP uses conditional chances in a way that's problematic for Humeanism. When conditioning on Ch(H)=1/2, the chance function itself must be consistent with that hypothesis. But in the Humean view, if Ch(H)=1/2 is true, then the mosaic must be such that the best system gives that chance. So U, which would require a different chance, isn't just unlikely—it's incompatible. 

  Step (4) assumes Ch(U | Ch(H)=1/2) is positive. But under Humeanism, given Ch(H)=1/2, U has chance zero because U's truth would contradict Ch(H)=1/2. The chance function, conditional on its own value, must exclude undermining futures. So the mistake is in step (4)—the chance of U given Ch(H)=1/2 isn't positive; it's zero. 

  Rejecting step (4) means adopting the New Principle. The cost is that the original, intuitive PP is replaced. Some find the New Principle less intuitive, but it saves Humeanism. The user is attached to PP but might accept this modification. The cost is theoretical—having a more complex connection between chance and credence. But it preserves both Humeanism and a version of PP.
answer: |-
  Reject step (4): On Humeanism, given that Ch(H) = 1/2, Ch(U | Ch(H) = 1/2) = 0, not positive. The cost is modifying the Principal Principle to the "New Principle" (NP).

  Your step (4) assumes the chance function Ch itself, conditional on the proposition Ch(H) = 1/2, assigns positive probability to U. However, for Humeans, the proposition Ch(H) = 1/2 is a claim about the entire mosaic of events – it supervenes on the totality of particular facts, including all future outcomes. If Ch(H) = 1/2 is true, then the actual mosaic *is* one where the best systematization yields Ch(H) = 1/2. The proposition U describes a mosaic fundamentally incompatible with Ch(H) = 1/2 being true, precisely because U would make the best systematization yield a chance near 1 for heads. Therefore, if Ch(H) = 1/2 is true, U is false. Since Ch is a probability function defined over possibilities, and U is false (and indeed impossible) in any world where Ch(H) = 1/2 is true, Ch(U | Ch(H) = 1/2) must be 0. The chance function, conditional on its own value, assigns zero probability to undermining futures like U that would falsify it.

  This resolves the contradiction: Step (5) fails because Cr(U | Ch(H) = 1/2) should be set to Ch(U | Ch(H) = 1/2) = 0, avoiding the conflict with knowing ~U in step (6). The cost is rejecting the original Principal Principle (PP) as stated in step (1) for cases involving propositions about chance itself. Humeans must adopt a modified principle, typically the New Principle (NP): Cr(A | H_tw ∧ Tw) = Ch_tw(A). Here, H_tw is the complete history of world w up to time t, and Tw is the "theory of chance" for w – the complete set of conditionals specifying the chance of any proposition given any history. Tw entails Ch(H) = 1/2 without being undermined by future events like U in the same way, as it specifies the chances *as a function of the history*, including how they would change if the future were different. NP avoids conditioning directly on Ch(A)=x when that proposition is threatened by undermining futures. The cost is losing the elegant simplicity and directness of the original PP; NP is more complex and arguably less intuitive as a normative constraint linking chance and credence. However, it preserves the core normative role for Humean chance.
