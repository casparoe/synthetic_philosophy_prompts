prompt: |-
  I'm a novelist, not a philosopher — I've published a few books that keep getting shelved in different places depending on the bookstore, and I spend more time than I'd like arguing with my agent about whether its literary fiction with speculative elements or speculative fiction with literary pretensions. Right now I'm revising a book about a woman who may or may not be dead, and my agent says it reads like two different books because I won't commit to the ghost-story conventions or fully abandon them. So I already think in terms of genres, subgenres, tropes, reader expectations, comp titles, shelf categories, all of it.

  Lately I've been trying to understand Wittgenstein's claim that concepts like 'game' don't have a common essence, just overlapping similarities — same nose here, same gait there, no one feature everyone shares — what gets called family resemblance. I'm fluent in the publishing vocabulary and a total amateur in philosophy. I half-suspect the family resemblance idea is just a fancier way of saying what anyone in publishing already knows about genre, but I also suspect I'm flattening it. Can you restate the family resemblance view of concepts — and whatever of the language-game idea is needed to make it work — in the vocabulary I actually use as a working novelist: genres, tropes, reader expectations, comps, shelf categories, subgenre conventions, the difference between a convention and a cliché. Be as faithful as you can; don't just tell me genre is a family resemblance concept and leave it there.

  Then give me the residue report: what translates cleanly, what you had to fudge or distort, and what has no counterpart at all in how publishing and craft talk about genre. I want to know whether my hunch that genre categories are family resemblance categories is basically right, or whether the philosophy is doing something my vocabulary can't even say — and if so, whether that's a hole in my vocabulary or a sign the original claim was looser than it looks.
