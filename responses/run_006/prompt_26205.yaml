  For the tercets, I'll weave in metaphors that serve dual purposes: "waves that break before they reach the shore" illustrates discounting (future harm feeling less real), while "the horizon's borrowed blue" hints at how future generations inherit our choices. The final couplet must hold both truths without reconciling them—hence "the tide recedes, the tide replies" as cyclical as the family's dilemma. 

  Philosophically, I'm avoiding straw men. The discounting stanza ("To weigh the moment more...") paraphrases Ramsey's critique of "pure" discounting, while Sidgwick's refrain directly quotes his principle of impartiality. The "telescope turned backward" image nods to Parfit's non-identity problem—how future people are abstract until they exist. 

