prompt: |-
  I work as a legal officer for a small statutory regulator of letting agents and private landlords. Several times a month a disciplinary or registration case turns on the meaning of a single provision of our enabling statute or rules, and I have to advise a lay committee on how to read it before they vote. The decision can cost a licensee their livelihood or deprive a tenant of a remedy, and it must be defensible on judicial review; I usually have half a day, no budget for counsel, and a committee that is intelligent but legally untrained. I need a procedure I can reuse rather than starting from scratch each time.

  Please write me a decision procedure for choosing between a textual and a purposive reading of a statutory provision, grounded in the textualism/purposivism debate. The committee should not need to know the theory, but I do: make clear which steps are genuinely dictated by the theory and which are pragmatic shortcuts or judgment calls, and where textualism and purposivism would give different instructions at the same step say so rather than blurring them into a general 'look at the context'. In particular, the procedure should keep distinct (i) resolving a genuine ambiguity in the language, (ii) declining to extend clear text merely because the result seems harsh, and (iii) the point at which an otherwise textualist approach recognises an absurdity or drafting error and departs from the ordinary meaning. Present it as an ordered set of questions, with what counts as a sufficient answer for each, where the procedure stops with a definite answer, and where it must hand the matter to the committee as a question of values rather than law.

  Then run the procedure on these three cases and say explicitly what answer it gives: (1) a licensed agent is alleged to have 'entered a tenant's premises' without the required notice after flying a drone through an open window to photograph the interior; (2) an unlicensed person is alleged to have 'advertised a property as available to let' by telling tenants in a private messaging group that a flat would shortly be available; (3) a licensee with a diagnosed anxiety disorder asks to attend a disciplinary hearing by video link rather than 'in person' as the rules require. Ensure that at least one of the three produces an answer I will not like, and end by stating what the procedure cannot settle. Please write the answer in British English.
reasoning: |-
  Okay, the user is a legal officer for a small statutory regulator dealing with letting agents and landlords. They need a reusable procedure for interpreting statutory provisions when advising a lay committee. The decisions are high-stakes—affecting livelihoods and remedies—and must be defensible on judicial review. The user has limited time and no budget for counsel. They want a clear procedure grounded in textualism vs. purposivism, with distinct steps for ambiguity, harsh results, and absurdity. Three example cases are provided to test the procedure.

  First, I need to recall the core principles of textualism and purposivism. Textualism focuses on the ordinary meaning of the words, while purposivism looks at the legislative intent and purpose. The procedure must keep these separate, especially at key points like ambiguity resolution, harsh outcomes, and absurdity exceptions. 

  The user’s explicit needs are a step-by-step procedure that the committee can follow without legal training, but the user themselves needs to understand the theoretical underpinnings. They also want the procedure to handle the three specific cases, with at least one outcome that’s "unlikable" to illustrate impartiality. Deeper needs might include ensuring defensibility in court, efficiency under time constraints, and building committee confidence in the process. The user might be worried about subjective judgments creeping in, so the procedure must clearly delineate where legal analysis ends and value judgments begin.

  For the procedure structure, I consider starting with textual clarity to avoid overcomplicating things. Step 1 should ask if the text is unambiguous—if yes, apply it. This is textualism’s priority. If not, move to Step 2 to assess ambiguity using tools like context and definitions. Step 3 would handle harsh results, emphasizing that textualism doesn’t allow deviation unless absurdity arises. Step 4 introduces purposivism only when ambiguity persists, focusing on purpose and consequences. Step 5 is the absurdity exception, a narrow escape hatch. Finally, Step 6 flags when it’s a policy call for the committee. This flow respects the theories: textualism dominates early steps, purposivism comes later, and absurdity is a last resort.

  Now, applying the procedure to the cases. For Case 1 (drone entry): Textually, "entered" might not cover drones, but contextually, it’s ambiguous. Moving to purpose, the rule aims to protect tenant privacy, so a drone intrusion could align with that. The procedure leans purposive here—likely an "unlikable" outcome for the user if they favor textualism. Case 2 (advertising via private message): Text is clear—"advertised" broadly covers any promotion, so no ambiguity. Harshness doesn’t justify deviation, so textual reading stands. Case 3 (video link for anxiety): Textually, "in person" is clear, but absurdity could arise if it denies a fair hearing. Absurdity exception might apply, making it a committee value judgment.

  The limitations: The procedure can’t resolve pure policy choices or predict judicial trends. It also relies on the user’s accurate application, so their role is crucial. Ending with "unlikable" Case 1 reinforces impartiality, as textualism might have ruled differently. This meets the user’s request for rigor and transparency while keeping it practical for the committee.
answer: |-
  Here is a reusable decision procedure grounded in textualism/purposivism theory, designed for practical application by a legally untrained committee, with theoretical underpinnings clarified for your benefit. The procedure prioritises textual clarity first, recognising purposivism only where genuine ambiguity exists or absurdity arises, and explicitly separates legal interpretation from policy choices.

  **Statutory Interpretation Decision Procedure**

  **Core Principle:** Start with the text. Depart only where the text is genuinely ambiguous, leads to an absurd result no legislature could have intended, or where established purposive techniques (like the mischief rule) are mandated by precedent or context. Harshness alone is not a reason to depart.

  **Ordered Questions:**

  1.  **Is the ordinary meaning of the key word(s) in the provision clear and unambiguous when read in context?**
      *   **Method:** Consult standard dictionary definitions *contemporary to the statute's enactment*. Read the provision within its immediate section, the whole Act, and related rules. Consider grammatical structure.
      *   **Sufficient Answer:** Yes (Textualism dictates application -> **Apply the clear meaning. STOP**). / No (Proceed to Step 2).
      *   **Theory Note:** Textualism demands stopping here if meaning is clear. Purposivism might already consider context/purpose here, but the procedure isolates pure textual clarity first.

  2.  **Does the context (immediate section, whole Act, related rules, statutory definitions) resolve the ambiguity?**
      *   **Method:** Look for defined terms. Check if other provisions use the same word clearly. Assess if one meaning creates internal inconsistency or renders another part superfluous.
      *   **Sufficient Answer:** Yes (Context provides clarity -> **Apply the contextual meaning. STOP**). / No (Proceed to Step 3).
      *   **Theory Note:** Both textualism and purposivism endorse using context. Textualism views context as part of the "whole text" meaning. Purposivism sees it as evidence of purpose.

  3.  **Is the result of applying the unambiguous (or contextually clarified) meaning merely harsh, inconvenient, or apparently unwise?**
      *   **Method:** Objectively assess the outcome. Is it simply strict or disadvantageous to one party, or is it truly irrational/pointless?
      *   **Sufficient Answer:** Yes (Result is harsh but not absurd -> **Textualism dictates: Apply the clear/contextual meaning regardless. STOP**). / No, the result is genuinely absurd or self-defeating (Proceed to Step 5). / Ambiguity remains unresolved by text/context alone (Proceed to Step 4).
      *   **Theory Note:** **CRITICAL DIVIDE.** Textualism forbids departure for mere harshness. Purposivism *may* allow departure here if purpose strongly suggests it, but the procedure prioritises textualist restraint. *Only proceed to Step 4 if ambiguity genuinely persists after Steps 1 & 2.*

  4.  **What was the clear statutory purpose ("mischief") the provision aimed to address, and which interpretation best addresses that purpose?**
      *   **Method:** Consult the Act's long title, preamble, explanatory notes (if contemporaneous and reliable), and reports leading to the legislation. Identify the specific problem the provision tackles.
      *   **Sufficient Answer:** Purpose is clear and strongly points to one interpretation resolving the ambiguity -> **Apply the purposive interpretation. STOP**). / Purpose is unclear, conflicting, or both interpretations align similarly with purpose (Proceed to Step 5 or 6).
      *   **Theory Note:** This is the core purposivist step. Textualism rejects using purpose to *create* ambiguity or override clear text, hence why it only comes *after* text/context fail. If purpose doesn't resolve the ambiguity, the legal tools are exhausted.

  5.  **Does applying the ordinary/contextual meaning lead to an outcome so absurd, irrational, or self-defeating that Parliament cannot possibly have intended it?**
      *   **Method:** Apply a high threshold. Is it merely odd or strict, or is it utterly irrational, frustrates the Act's core objective, or creates an internal contradiction? Is there evidence of a likely *drafting error*?
      *   **Sufficient Answer:** Yes (Absurdity exception applies -> **Depart from the strict textual meaning to avoid absurdity. Apply a meaning consistent with the statute's overall purpose and structure. STOP**). / No (Proceed to Step 6).
      *   **Theory Note:** Both theories recognise a narrow absurdity exception, though textualism applies it more sparingly. It is a last resort, not a general purposive tool. Harshness ≠ Absurdity.

  6.  **The interpretation requires a pure policy choice between legitimate but competing values.**
      *   **Method:** Legal analysis (Steps 1-5) has not yielded a single definitive answer. The choice involves balancing competing social goals, regulatory burdens, or fairness considerations inherent in the ambiguity.
      *   **Action:** **Hand the matter to the Committee.** Clearly present the competing interpretations, their legal support (text vs. purpose), and the policy consequences of each. Advise that the choice involves value judgments within the framework of the Act, and their role is to make that policy choice, ensuring it is rational and defensible.
      *   **Theory Note:** This acknowledges the limits of legal interpretation. When text, context, purpose, and absurdity checks fail to resolve the ambiguity, the decision-maker must exercise a delegated policy discretion.

  ---

  **Application to Cases:**

  **Case 1: Drone Entry ("entered a tenant's premises")**

  1.  **Clear Text?** "Entered" ordinarily implies physical presence. A drone is an extension/agent, but is it "entering"? Arguably ambiguous. **Proceed.**
  2.  **Context Resolves?** No other sections define "enter." Purpose relates to privacy/interference, but context doesn't clarify if tools/agents constitute "entry." **Ambiguity persists. Proceed.**
  3.  **Merely Harsh?** Applying "no entry" might seem harsh for tenant protection, but "harshness" isn't the test yet. Ambiguity exists. **Proceed to 4 (Purpose).**
  4.  **Purpose?** The mischief is protecting tenants from unwanted intrusion, interference with quiet enjoyment, and safeguarding privacy/security. Flying a drone through a window unannounced fundamentally violates this core purpose. **Purposive interpretation strongly favours finding this constitutes "entry."** **STOP. Apply purposive meaning (Violation found).**
      *   *Unlikable Outcome?* A strict textualist might argue "entered" requires physical presence, leading to no violation. The procedure prioritises purpose here due to unresolved ambiguity.

  **Case 2: Private Message Advertisement ("advertised a property as available to let")**

  1.  **Clear Text?** "Advertised" has a broad ordinary meaning: "to describe or draw attention to (a product, service, or event) in a public medium to promote sales or attendance." Telling people a flat is available *is* drawing attention to promote its letting. **Meaning is clear and broad. STOP. Apply textual meaning (Violation found - unlicensed activity).**
  2.  *(Steps 2-6 not needed as text is clear).*
  3.  **Harshness?** The committee might think it harsh to penalise informal messages, but Step 3 explicitly forbids departing for harshness where the text is clear. Textualism prevails.

  **Case 3: Video Link Attendance ("attend... in person")**

  1.  **Clear Text?** "In person" ordinarily means physical presence. **Meaning is clear.**
  2.  **Context Resolves?** No statutory definition. Rules likely contemplate physical presence for cross-examination, assessing demeanour, formality. Context reinforces ordinary meaning.
  3.  **Merely Harsh?** Requiring physical attendance imposes a burden due to the licensee's anxiety. However, is this merely *harsh* or does it rise to the level of **absurdity** (Step 5)? Proceed to Step 5.
  4.  **Absurdity?** Applying "in person" strictly *could* lead to an absurdity: preventing a licensee with a legitimate disability from participating meaningfully in a hearing that could end their livelihood, potentially violating principles of natural justice/fairness embedded in the regulatory scheme, and frustrating the disciplinary process's truth-finding purpose. The *degree* of burden and potential unfairness here meets the high threshold for absurdity. **Apply absurdity exception. Depart from strict textual meaning.** Interpret "in person" as allowing for equivalent real-time participation via video link *where necessary to ensure a fair hearing*, provided procedural safeguards (e.g., identification, no coaching, clear audio/video) are met. **STOP. Apply modified meaning (Video link permitted, subject to conditions).**

  **What the Procedure Cannot Settle:**

  1.  **Pure Policy Choices:** When legal interpretation reaches Step 6, the procedure identifies but cannot resolve the value judgment. The committee must decide based on policy (e.g., tenant protection vs. landlord burden, regulatory certainty vs. flexibility).
  2.  **Predicting Judicial Review Outcomes:** While designed to be defensible, it cannot guarantee a court won't favour a different interpretive approach (e.g., a more textualist judge in Case 1).
  3.  **Resolving Factual Disputes:** It assumes the facts are found by the committee. Interpretation depends on the established facts.
  4.  **Determining the "Weight" of Purpose or Absurdity:** Steps 4 and 5 involve judgment calls on the strength of the purpose or the degree of absurdity. The procedure structures the analysis but relies on your and the committee's reasonable assessment.
  5.  **Overcoming Poor Drafting:** If the statute is fundamentally unclear or contradictory, the procedure can only mitigate, not solve, the problem, potentially leading to Step 6 frequently.

  This procedure provides a structured, legally grounded framework to guide your advice and the committee's decision-making, clearly separating textual fidelity from purposive considerations and explicitly defining the limits of legal interpretation. It ensures harsh outcomes are applied where the law is clear, while allowing escape valves for genuine ambiguity or truly absurd results through established legal principles.
