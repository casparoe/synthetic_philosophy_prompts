prompt: |-
  I'm a software engineer with no formal philosophy background, and I've spent a fair amount of my free time following the long-running argument about whether string theory and multiverse cosmology should count as science even though they haven't yet produced empirical predictions that can be tested with current or near-future instruments. One side defends what I've seen called non-empirical theory confirmation: the claim that a theory can be rationally supported without direct empirical test, by things like internal mathematical consistency, the way the framework unifies established physics in ways it wasn't designed to do, and the absence of viable alternatives after a long search. The other side says this is aesthetic preference with better branding; for them, a framework that makes no novel, falsifiable predictions is speculation or mathematics, not physics, no matter how elegant it is. Both sides know the same facts about the string landscape, fine-tuning, and the missing experimental signatures, and yet neither side has moved in years. As someone whose day job is shipping software that has to pass tests before it goes out, I'm aware I might be biased toward thinking that untested claims are just unearned confidence — but I want to know whether that bias is doing all the work in my reading of the debate.

  My working hypothesis is that the real disagreement isn't about the physics or the mathematics at all, but about what should count as evidence for a scientific theory: specifically, whether non-empirical theoretical virtues function as evidence, or only as tie-breakers among already empirically confirmed options. But I can't tell whether that's right, whether the two sides are simply using 'science' and 'confirmation' in different senses, whether they differ about the historical track record of past elegant theories, or whether this is a bedrock disagreement about prior probabilities that no argument can reach. I'd like a diagnosis of the structure of the disagreement rather than a verdict on string theory itself. What kind of disagreement is this, and given that diagnosis, what would actually count as progress — a formal result, a historical finding, a sharper conceptual distinction, a change of question — or is this a case where we should stop expecting movement? Please cap the response at 800 words.
