prompt: |-
  I've been going down a rabbit hole of arguments about whether things like depression or ADHD are "real diseases" — partly online, partly one long argument with my brother — and I keep noticing a two-step move that I don't have a word for. Someone will defend the claim that a condition is a genuine medical illness by pointing to something factual: a brain scan shows a difference, there's a chemical imbalance, a medication changes something, it runs in families. But when you press on why that particular difference counts as an illness rather than just a variation (being very tall is a difference too, and so is perfect pitch), the answer switches registers completely: because it causes suffering, because the person can't hold a job, because their life is going badly. Then, if you point to someone with the same scan-difference who is doing fine, they'll say that person doesn't have the disorder — the scan-difference alone wasn't enough after all. So the factual part is doing the work of making it sound like a broken bone, and the evaluative part is doing the work of deciding who actually counts as ill, and people slide between the two without flagging the switch. It isn't exactly equivocation, because the two seperate claims are both true and compatible; it's more like the label has two jobs and the person pretends it's doing only one. I also notice the same thing at the level of the whole category: the list of what gets called a mental illness seems to track, at least roughly, what the surrounding society finds distressing or disapproves of, which is hard to square with the "it's just a biological fact" story unless the two parts are doing different jobs all along. Is there a name for this pattern — in philosophy of medicine or psychiatry — the way a diagnosis slides between "there is a measurable difference" and "the difference is bad for the person or for other people"? And how does it fit with the old argument about whether mental illness is a myth or an illness in the same sense as strep throat? I should say: I'm not just after a label. I want to know exactly what the move is, whether it's a fallacy or just a feature of how disease concepts work, and where the edges of it are.
reasoning: |-
  Okay, the user is diving into a complex debate about whether conditions like depression or ADHD are "real diseases." They've noticed a pattern in arguments where people switch between factual evidence (like brain scans) and evaluative judgments (like suffering or inability to work). They want to know if there's a name for this pattern and how it fits into the broader philosophy of psychiatry. Let me unpack this.

  First, I recall that the user mentioned a "two-step move." The initial defense relies on objective data, but when pressed on why it's a disorder, the argument shifts to subjective harm. Then, if someone has the same biological marker but functions well, they're excluded from the diagnosis. This inconsistency suggests that the biological fact alone isn't sufficient—it's the combination with impairment that defines the illness. 

  The user also connects this to societal norms, noting that what's considered a mental illness often aligns with what society finds distressing. This points to a deeper issue: the entanglement of biological facts and social values in defining disorders. 

  Key concepts come to mind. Wakefield's Harmful Dysfunction seems relevant because it combines a biological dysfunction with a value judgment about harm. The user's observation aligns with this, but they might be highlighting how people misuse the concept by conflating the two parts. 

  Then there's Hacking's looping effects, which explains how classifications affect individuals and society, reinforcing the diagnosis. The user's societal concerns tie into this—how societal disapproval influences what's pathologized. 

  Also, Szasz's critique that mental illness is a myth because it's not biological like physical diseases. The user's comparison to strep throat shows they're grappling with this distinction. But the response should clarify why mental disorders differ, involving both biology and social context. 

  The user wants to know if this sliding is a fallacy or inherent to disease concepts. It's not entirely fallacious; it's a feature, but problematic when unacknowledged. The sliding obscures the value judgments, making them seem objective. That's the crux—the lack of transparency about the normative aspect. 

  I should explain why this happens. Disease definitions in psychiatry require both dysfunction and harm, unlike some physical illnesses where pathology alone suffices. But even physical conditions involve value judgments—like what level of deviation is problematic. The difference is more pronounced in psychiatry due to less clear biological markers. 

  The user's deeper need might be understanding the validity of mental health diagnoses. They seem skeptical of the "just biological" narrative and want to reconcile the factual and evaluative components. They might also be seeking reassurance that these diagnoses aren't arbitrary, despite the value-laden aspects. 

  Addressing the edges: where does this pattern apply? Primarily in psychiatry, but also in contested physical conditions (e.g., chronic fatigue syndrome). The challenge is when societal values pathologize normal variations, leading to overmedicalization. 

  In conclusion, the user needs clarity on the dual nature of disease concepts, the legitimacy of mental health diagnoses despite this duality, and the importance of transparently acknowledging both components to avoid misuse.
answer: |-
  Your analysis is razor-sharp and identifies a core, persistent tension in psychiatry and philosophy of medicine. The pattern you describe is widely recognized and debated, though it doesn't have a single universal name. Here's a breakdown of the key concepts and how they relate to your observations:

  1.  **The Core Pattern: Fact-Value Entanglement (or the Biopsychosocial-Values Hybrid Model)**
      *   **What it is:** This is the fundamental insight that **medical concepts, especially psychiatric diagnoses, are inherently hybrids of descriptive facts (about biology, psychology, behavior) and normative values (about harm, distress, dysfunction, social expectations).** They are *not* pure biological facts like "strep bacteria present" nor pure value judgments like "this behavior is immoral." They are a fusion.
      *   **How it explains the "slide":** When someone points to a brain scan or genetic link, they are invoking the *factual/descriptive* component ("dysfunction" or "difference"). When they point to suffering or job loss, they are invoking the *normative/evaluative* component ("harm"). The diagnostic label itself ("depression," "ADHD") *packages both together.*
      *   **Why it's not *exactly* equivocation (though it can be used fallaciously):** You're right. Both claims are often true *within the hybrid model*. A brain difference *can* be a causal factor *and* suffering *can* be the consequence. The problem arises when:
          *   The speaker *denies* or *obscures* the value component, presenting the diagnosis as *purely* biological/scientific.
          *   They use the factual evidence *rhetorically* to imply the value judgment is settled science, shutting down legitimate debate about whether the *harm* is inherent to the difference or caused by societal reaction/expectations.
          *   They treat the hybrid label as monolithic, refusing to acknowledge that the factual component ("difference") and the value component ("harm") can sometimes come apart, as in your example of the "asymptomatic scan."

  2.  **Key Concepts & Names:**
      *   **Jerome Wakefield's "Harmful Dysfunction" (HD):** This is the most direct theoretical framework addressing your observation.
          *   **Dysfunction:** A failure of some internal mechanism to perform its natural (evolutionarily selected) function (the factual/biological/scientific component).
          *   **Harm:** A negative consequence judged by social norms or values concerning well-being (the evaluative/social component).
          *   **The Diagnosis Requires *Both*:** For Wakefield, a disorder exists only when there is a *harmful* dysfunction. This explicitly builds the value judgment into the definition. Your "asymptomatic scan" example perfectly fits: they have the potential *dysfunction* but not the *harm*, so they don't have the *disorder*. The "slide" occurs because proponents often emphasize the "dysfunction" part to legitimize it scientifically, while the "harm" part is what actually triggers the label "illness" in practice. Critics argue that "dysfunction" is often hard to define objectively in mental health.
      *   **Ian Hacking's "Looping Effects" (of Human Kinds):** This helps explain the societal aspect you noticed.
          *   Psychiatric classifications ("human kinds") don't just describe people; they *change* how people understand themselves and behave, and how society reacts to them.
          *   The classification itself can create or amplify the "harm" component (e.g., stigma, lowered expectations, self-fulfilling prophecies).
          *   This creates a feedback loop: societal values influence what gets classified as a disorder; the classification then influences societal values and the lived experience of those classified. This makes it impossible to separate the "biological fact" from the social context that defines what counts as problematic.
      *   **Thomas Szasz's "The Myth of Mental Illness":** This is the classic (and controversial) critique you allude to.
          *   Szasz argued that "mental illness" is a category error. True medical diseases involve identifiable lesions or physiological dysfunctions (like strep throat). Mental "illnesses," he claimed, are problems in living – conflicts in values, goals, responsibilities – mislabeled as diseases. He saw the slide you describe as fundamentally dishonest, using medical language to mask social control or personal failings.
          *   While Szasz's strict biological disease model is widely rejected as too narrow (even for some physical conditions), he powerfully highlighted the *normative* core of psychiatric concepts and the dangers of medicalizing social deviance or personal distress.

  3.  **Is it a Fallacy or a Feature?**
      *   **Primarily a Feature (with Potential for Fallacy):** The entanglement of facts and values is not a logical fallacy *per se*; it's an inherent characteristic of how we define health, disease, and disorder, particularly in the realm of mind, behavior, and experience. Health is fundamentally a value-laden concept ("a state of complete physical, mental and social well-being" - WHO). We *cannot* define "disorder" without reference to what we value (suffering avoidance, productivity, social harmony).
      *   **Where it Becomes Problematic/Fallacious:**
          *   **Masking the Value Judgment:** When proponents claim the diagnosis is *purely* a biological fact ("It's just a chemical imbalance like diabetes!"), thereby shutting down legitimate discussion about societal factors contributing to the harm or different ways of interpreting the difference. This is **scientism** or **reification** (treating a complex social concept as a simple concrete thing).
          *   **Circularity/Ad Hoc Rescue:** In the "asymptomatic scan" case, saying "they don't have the disorder" can be legitimate (if harm is part of the definition, *a la* Wakefield), but it risks becoming *ad hoc* if the factual marker was previously presented as *the* defining feature. It can feel like moving the goalposts.
          *   **Medicalization of Normal Variation/Social Problems:** When societal expectations or values are unquestioningly imported into the "harm" criterion, leading to the pathologization of normal human diversity or distress caused primarily by social injustice (e.g., poverty, discrimination). The "slide" obscures this process.

  4.  **Edges and Nuances:**
      *   **Physical Illnesses Aren't Immune:** Even "objective" physical diseases involve value judgments. Is high blood pressure a disease? Only because we *value* preventing strokes and heart attacks. Tall stature isn't a disease, but gigantism causing pain and disability *is*. The difference is often one of degree: the factual component (e.g., a tumor, a pathogen) is usually clearer and more directly causal in physical illness, while the link between brain difference and harmful experience in mental health is often more complex and mediated by environment/meaning.
      *   **The Role of Suffering:** Suffering is often presented as the core value component. But whose suffering? The individual's distress is usually primary, but societal harm (e.g., danger to others in severe, untreated psychosis) also plays a role, raising ethical questions.
      *   **The "Doing Fine" Exception:** Your point about the person with the "difference" but no harm is crucial. It highlights that the *difference* itself is necessary but not sufficient. The *interaction* between the biological predisposition and the environment (including social support, coping skills, societal acceptance, life circumstances) determines whether *harm* manifests. This interactionist view is central to modern biopsychosocial models.

  **In Summary:**

  You've identified the **fact-value entanglement inherent in psychiatric diagnosis**. The core concepts explaining it are **Wakefield's Harmful Dysfunction** (explicitly combining the two) and **Hacking's Looping Effects** (explaining the societal feedback). It's **primarily a feature** of how we conceptualize health and disorder in complex human beings, not a simple fallacy. However, it **becomes problematic** when the value component is obscured or denied, presented as settled science, or used to uncritically medicalize social problems or normal variation. This tension lies at the heart of the "myth of mental illness" debate – Szasz argued the value component dominated to the point of invalidating the medical label, while modern psychiatry acknowledges the hybrid nature but grapples with defining "dysfunction" objectively and setting boundaries for "harm."

  Your insight about the label having "two jobs" and proponents pretending it has only one is precisely on target. Recognizing this duality is essential for honest discourse about mental health, diagnosis, treatment, and societal responsibility.
