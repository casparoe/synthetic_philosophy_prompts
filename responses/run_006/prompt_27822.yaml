prompt: |-
  Act as an expert in practical ethics and the evaluation of philanthropic interventions, and think carefully before answering; begin by brainstorming several candidate principles that could rationalize our past decisions, then test each against the new case before giving your best recommendation.

  I am a software engineer, not a philosopher, and I sit on the grants committee of a small effective-altruism-aligned donor fund. We want to decide a new proposal consistently with our own track record. Our five past decisions were:

  1. Funded a mass deworming program with multiple randomized controlled trials and a very low cost per quality-adjusted life year.
  2. Rejected a community mental-health counseling program that had moderate-quality studies, because its outcomes were too heterogeneous and difficult to quantify against our usual metrics.
  3. Funded, with a publication condition, a speculative AI safety research group that had no near-term measurable outcomes, on the grounds that the tail risk was severe enough to justify funding despite weak measurability.
  4. Rejected an arts education program with strong anecdotal reports but no controlled evidence.
  5. Funded a policy advocacy group working on air pollution, on the strength of quasi-experimental evidence that its campaigns produced measurable health improvements.

  The new proposal is from a criminal justice reform organization working to reduce pretrial detention and incarceration. It has a plausible causal mechanism and two credible quasi-experimental studies, but its outcomes are mixed: some are measurable (days incarcerated, rearrest rates), while others are not easily quantified (dignity, family stability, trust in institutions). It does not fit our health-metric template, but the harms it addresses look large.

  What should we decide if we want to be consistent with our own precedents? Which of our past decisions is the closest analog, and why? If our precedents genuinely underdetermine the new case, say so, and explain what principle we would be adopting with each live option. I care less about the bare fund/reject answer than about the candidate rules we might be running, which rules the track record rules out, and which rule you would recommend and why.
reasoning: |-
  We are given five past decisions and a new proposal. We need to determine a consistent approach.

  First, let's extract the principles from the past decisions:

  1. **Mass deworming program**: Funded because of strong evidence (multiple RCTs) and very low cost per QALY (quantifiable, high impact per dollar).
     - Principle: Strong evidence (especially RCTs) and quantifiable impact (like QALYs) are favored.

  2. **Community mental-health counseling**: Rejected because outcomes were heterogeneous and difficult to quantify, despite moderate-quality studies.
     - Principle: Even with some evidence, if outcomes are not quantifiable in a way that allows comparison to standard metrics (like QALYs), we reject.

  3. **Speculative AI safety research**: Funded (with conditions) despite no near-term measurable outcomes, because of severe tail risk.
     - Principle: When tail risks are severe enough, we may fund even without measurable near-term outcomes and with weak measurability.

  4. **Arts education program**: Rejected because it had only anecdotal evidence (no controlled evidence).
     - Principle: Controlled evidence is important; without it, even strong anecdotes are insufficient.

  5. **Policy advocacy for air pollution**: Funded because of quasi-experimental evidence showing measurable health improvements.
     - Principle: Quasi-experimental evidence can be sufficient if it leads to measurable outcomes (especially health metrics).

  Now, the new proposal:
  - **Criminal justice reform**: 
     - Plausible causal mechanism
     - Two credible quasi-experimental studies
     - Outcomes: mixed (some measurable: days incarcerated, rearrest rates; others not: dignity, family stability, trust)
     - Does not fit health-metric template (so we cannot use QALYs or similar)
     - Addresses large harms

  We must compare to the past decisions.

  Let's see which past decisions are analogous:

  - **Decision 2 (mental health counseling)**: Outcomes were heterogeneous and difficult to quantify -> rejected. This is similar because the new proposal also has some outcomes that are hard to quantify. However, note that the new proposal does have some measurable outcomes (days incarcerated, rearrest rates). Also, the new proposal has quasi-experimental evidence (like decision 5) while decision 2 had moderate-quality studies that were not enough because of non-quantifiability.

  - **Decision 3 (AI safety)**: This was funded despite weak measurability because of severe tail risk. The new proposal does not involve a tail risk of existential catastrophe. It's about reducing known harms (incarceration) but not a global catastrophic risk. So the analogy is weak.

  - **Decision 4 (arts education)**: Rejected for lack of controlled evidence. The new proposal has quasi-experimental evidence, so it's better than decision 4.

  - **Decision 5 (air pollution)**: Funded with quasi-experimental evidence and measurable health outcomes. The new proposal also has quasi-experimental evidence and some measurable outcomes (though not health). However, the measurable outcomes (days incarcerated, rearrest rates) are not in health metrics so we cannot convert to QALYs. But they are still measurable.

  The key tension is between:
  - The requirement for quantifiability (as in decisions 1, 2, and 5) and 
  - The willingness to fund non-quantifiable outcomes only in extreme tail risk scenarios (decision 3).

  In the new case, we have:
  - Some quantifiable outcomes (days incarcerated, rearrest rates) and some non-quantifiable.
  - The quantifiable ones are not in our standard health metric, but we can still measure them.

  We must note that in decision 2, we rejected because outcomes were too heterogeneous and difficult to quantify. However, in decision 5, we accepted because the outcomes were measurable health improvements. The new proposal has some measurable outcomes (so not entirely non-quantifiable) but they are not health.

  So the question is: do we require outcomes to be in our standard health metrics? Or do we accept any measurable outcomes?

  Looking at the track record:

  - Decision 1: used QALY (health metric)
  - Decision 5: used health improvements (so health metric again)

  But note: decision 3 (AI safety) was funded without any health metric and without near-term measurable outcomes. However, that was an exception for tail risks.

  Also, decision 2 (mental health) was rejected because of non-quantifiability, but note that mental health could in principle be measured in QALYs or DALYs, but the problem was heterogeneity and difficulty in quantifiability.

  So what principle can we derive?

  Candidate principles:

  1. **Quantifiability Principle**: We fund only when outcomes are quantifiable and can be compared to our standard metrics (like QALY). If not, we reject unless there is an extreme tail risk.

  2. **Measurability Principle**: We require measurable outcomes (not necessarily in health, but any measurable outcome) and a plausible causal chain. However, note that in decision 2, even with moderate-quality studies, we rejected because of non-quantifiability. So this principle might not be enough.

  3. **Severe Harm Principle**: We are willing to fund interventions that address severe harms even if they are not fully quantifiable, provided there is at least some evidence (quasi-experimental or better) and a plausible mechanism.

  Now, let's test the new proposal against the past decisions:

  - It has measurable outcomes (days incarcerated, rearrest rates) but also non-measurable ones. The measurable outcomes are not health, so we cannot compare directly to our usual QALY metric.

  - However, we have funded non-health interventions in the past (AI safety) but only for tail risks.

  - We have also funded health interventions with quasi-experimental evidence (decision 5).

  Is there a principle that allows for non-health interventions if they have measurable outcomes? 

  Looking at the track record, we have only funded health interventions and one existential risk intervention. We rejected mental health (which is health but non-quantifiable) and arts (non-health and non-quantifiable).

  So the track record suggests:

  - We are open to non-health interventions only in the case of existential risk (decision 3).

  - For non-existential-risk interventions, we require health outcomes that are measurable and quantifiable (like in decisions 1 and 5).

  But wait: the new proposal is about criminal justice. How severe are the harms? They are large (as stated) but not existential.

  Therefore, by the track record, we might reject because:

  - It's not health (so only decision 3 would be an exception, but that was for tail risk).
  - Even though it has measurable outcomes, they are not in our standard health metric.

  But note that decision 5 was about air pollution, which is environmental, but we converted it to health improvements. So we are willing to fund non-health interventions if they lead to measurable health outcomes.

  The new proposal's measurable outcomes (days incarcerated, rearrest rates) are not health. However, we know that incarceration has health impacts (mental and physical health of inmates, families) but the proposal does not measure or claim those. It only measures days incarcerated and rearrest rates.

  So if we strictly require health outcomes, we would reject.

  But what about the non-quantifiable outcomes? They are important (dignity, family stability, trust) and we rejected decision 2 because of non-quantifiability. So if we were to fund this, we would be going against that precedent unless we can distinguish.

  Alternatively, we might consider the measurable outcomes (days incarcerated) as a proxy for reducing harm. We could try to convert days incarcerated into some kind of harm metric (e.g., using estimates of harm per day in prison). However, the committee has not done that in the past. We have only used QALYs for health.

  So without a clear way to convert to our standard metric, we might be hesitant.

  But note: in decision 3, we funded without any near-term measurable outcomes. So we are not always requiring quantifiability. But that was for a very specific reason (tail risk).

  Therefore, the track record underdetermines the new case. We have two live options:

  Option 1: Reject because the outcomes are not in our standard health metric and the non-quantifiable outcomes are too prominent (like decision 2). Also, it doesn't involve existential risk.

  Option 2: Fund because we have quasi-experimental evidence and some measurable outcomes (even if not health) and the harms are large. This would be a new principle: we accept measurable outcomes even if not health, as long as they are strong indicators of harm reduction.

  However, the track record does not clearly support Option 2 because we have not funded any non-health, non-existential-risk intervention before.

  But note: decision 5 was about air pollution, which is not health per se but led to measurable health outcomes. We haven't funded anything that doesn't tie to health or existential risk.

  Therefore, to be consistent, we should reject.

  But let's see if there's an analogy to decision 3. The harms of incarceration are large and systemic, but they are not existential. So it doesn't fit.

  Alternatively, we might argue that the measurable outcomes (days incarcerated) are a good proxy for harm, and we can use a harm metric (like dollars of harm avoided, or using a metric from criminal justice research). But the committee has not used such a metric in the past. We have only used QALYs.

  Therefore, if we want to be consistent, we must reject.

  However, we might also note that in decision 5 we used quasi-experimental evidence and that is present here. And we have measurable outcomes (just not health). So if we are willing to extend our metrics beyond health, we could fund.

  But that would break with precedent because we have not done that before (except for existential risk).

  So the precedents underdetermine the case. We have two possible principles:

  Principle A (strict health/existential): Only fund if the outcomes are measurable in health metrics (like QALYs) or if it addresses an existential tail risk. Otherwise, reject.

  Principle B (harm reduction): Fund if there is credible evidence (quasi-experimental or better) that the intervention reduces harm, even if the harm is not measured in health terms, provided the harm is large and the causal mechanism is plausible.

  Our past decisions are consistent with Principle A. We have not funded any non-health, non-existential intervention.

  But note: we funded AI safety (existential) and health interventions. We rejected mental health (because non-quantifiable in health terms) and arts (non-health and no controlled evidence).

  Therefore, Principle A is the one that best fits our track record.

  But wait: what about the mental health program? It was health, but non-quantifiable. We rejected it. The new proposal is non-health. So even more reason to reject.

  So the closest analog is decision 2 (mental health counseling) because both have non-quantifiable outcomes (in our usual metrics) and the new proposal has some quantifiable outcomes but not in health. Decision 2 also had some evidence (moderate-quality studies) but we rejected because of non-quantifiability.

  Alternatively, decision 5 is similar in having quasi-experimental evidence and measurable outcomes, but the outcomes were health, which we require.

  Therefore, by Principle A, we should reject.

  However, let's consider the recommendation:

  I am acting as an expert in practical ethics and philanthropic interventions. I note that the EA movement has been expanding its scope beyond global health and development to include animal welfare and systemic risks. Criminal justice reform is an area that addresses severe harm and may be cost-effective. The proposal has quasi-experimental evidence and measurable outcomes (even if not health). 

  But the fund's track record shows a strong preference for health outcomes (or existential risk). To be consistent, we should reject. However, if the committee is willing to expand its principles, it might fund. But the question is about consistency.

  Therefore, my best recommendation is to reject, to be consistent with the past decisions, because:

  - The measurable outcomes are not in health (so not like decisions 1 and 5).
  - The non-measurable outcomes are similar to decision 2 (which we rejected) and we don't have an existential risk justification (like decision 3).

  So the decision should be: **Reject**.

  But note: we have a mixed outcome. We have measurable outcomes (days incarcerated) and non-measurable. We could focus on the measurable part. However, we don't have a standard to convert days incarcerated to a common metric (like QALYs). Without that, we cannot compare cost-effectiveness.

  In decision 5, we had a measurable health outcome that we could use. Here, we don't.

  Therefore, the closest analog is decision 2: we have a program that has some evidence and some outcomes that are measurable (but not in our standard) and some that are not. We rejected decision 2 for that reason.

  Hence, we should reject.

  But what if we are willing to create a new metric? The problem says we want to be consistent with the track record, not change it.

  Therefore, the answer is to reject.

  Final recommendation: Reject.

  But note: the problem says that the harms are large. We might regret this if we are being too rigid. However, the question is about consistency.

  If the committee wants to fund, they would be adopting Principle B (harm reduction) and breaking with their past (which was Principle A). That would require a deliberate change in principles.

  But without such a change, consistency demands rejection.
answer: |-
  ### Step-by-Step Analysis and Recommendation

  As an expert in practical ethics and philanthropic evaluation, I'll approach this systematically. I'll begin by **brainstorming candidate principles** derived from your five past decisions, then **test each principle against the new case**. Finally, I'll provide a recommendation based on consistency with your track record, highlighting which precedents are most analogous, which principles are ruled out, and which rule I endorse.

  ---

  ### Part 1: Brainstorming Candidate Principles from Past Decisions
  Your past decisions reveal implicit principles for funding. I've distilled four key candidate principles, each grounded in your committee's actions:

  1. **Quantifiable Impact Principle**:  
     - **Description**: Prioritize interventions with strong, quantifiable outcomes (e.g., cost per QALY) that align with standardized metrics like health or economic impacts. Heterogeneous or non-quantifiable outcomes are disfavored.  
     - **Support from Precedents**:  
       - Decision #1 (funded deworming): Relied on RCTs and low cost per QALY.  
       - Decision #2 (rejected mental health): Rejected due to heterogeneous/unquantifiable outcomes.  
       - Decision #5 (funded air pollution): Used quasi-experimental evidence for measurable health improvements.  

  2. **Evidence Quality Threshold Principle**:  
     - **Description**: Require high-quality evidence (e.g., RCTs, quasi-experimental designs) for causal claims. Anecdotal or uncontrolled evidence is insufficient, even for large-seeming benefits.  
     - **Support from Precedents**:  
       - Decision #1 (RCTs favored).  
       - Decision #4 (rejected arts education): Lack of controlled evidence was decisive.  
       - Decision #5 (quasi-experimental evidence deemed sufficient for funding).  

  3. **Tail Risk Exception Principle**:  
     - **Description**: Fund interventions with weak measurability or non-quantifiable outcomes only if they address severe, catastrophic tail risks (e.g., existential threats). This overrides typical evidentiary standards.  
     - **Support from Precedents**:  
       - Decision #3 (funded AI safety): Weak measurability accepted due to severe tail risk.  

  4. **Harm Scale and Plausibility Principle**:  
     - **Description**: Fund interventions addressing large-scale harms if they have a plausible causal mechanism and credible evidence, even if outcomes aren't fully quantifiable. Quantifiable proxies (e.g., reduced incarceration days) may suffice.  
     - **Support from Precedents**:  
       - Implicit in Decisions #1, #3, and #5, where large harms (disease, existential risk, pollution) drove funding despite challenges.  
       - But Decision #2 shows limits—mental health harms were large, but non-quantifiability led to rejection.  

  ---

  ### Part 2: Testing Principles Against the New Case
  **New Proposal**: Criminal justice reform reducing pretrial detention/incarceration.  
  - **Strengths**: Plausible mechanism, two credible quasi-experimental studies, large-scale harms, some measurable outcomes (days incarcerated, rearrest rates).  
  - **Weaknesses**: Mixed outcomes (non-quantifiable elements like dignity/family stability), no health metrics, not a tail risk.  

  Now, test each principle against this case:

  1. **Quantifiable Impact Principle**:  
     - **Test**: Outcomes are mixed—quantifiable (incarceration days) but non-standard (not health/QALY). Non-quantifiable elements (dignity) resemble Decision #2.  
     - **Consistency**: **Reject**. Fits #2 (rejected mental health due to heterogeneity) and #5 (funded only because health was quantifiable).  
     - **Ruled In/Out**: Rules out funding unless outcomes fit "usual metrics" like health.  

  2. **Evidence Quality Threshold Principle**:  
     - **Test**: Quasi-experimental evidence (like Decision #5) is credible and meets your bar. However, evidence alone isn't sufficient—Decision #2 had "moderate-quality studies" but was rejected due to outcomes.  
     - **Consistency**: **Neutral**. Evidence is adequate, but doesn't compel funding without quantifiable outcomes.  
     - **Ruled In/Out**: Doesn't rule in funding alone; depends on other principles.  

  3. **Tail Risk Exception Principle**:  
     - **Test**: No severe tail risk (unlike AI safety in #3). Harms are large but not catastrophic/existential.  
     - **Consistency**: **Reject**. This principle doesn't apply, as criminal justice reform lacks tail-risk justification.  
     - **Ruled In/Out**: Rules out funding—this is not an "exception" case.  

  4. **Harm Scale and Plausibility Principle**:  
     - **Test**: Harms are large (incarceration impacts health, economics, and social stability), mechanism is plausible, and quantifiable proxies exist (e.g., reduced incarceration days). But non-quantifiable elements conflict with Decisions #2 and #5.  
     - **Consistency**: **Underdetermined**. Supports funding due to scale/harm (like #5), but conflicts with #2's rejection of non-quantifiable outcomes.  

  **Key Insight**:  
  - Precedents **underdetermine** this case. Decisions #2 and #5 are the closest analogs but pull in opposite directions:  
    - **Decision #2 (Mental Health)**: Closest analog due to non-quantifiable outcomes and rejection. Both involve social/psychological impacts with mixed evidence.  
    - **Decision #5 (Air Pollution)**: Analogous evidence (quasi-experimental) and measurable outcomes, but pollution had health metrics, while justice reform does not.  
  - **Tension**: Your fund uses health metrics as a "template" (Decisions #1, #5). Justice reform lacks this, yet has large harms and credible evidence—creating ambiguity.  

  **Live Options and Principles They Adopt**:  
  - **Option A: Reject**  
    - **Principle Adopted**: Strict **Quantifiable Impact Principle**. Outcomes must be fully quantifiable and align with standardized metrics (e.g., health/QALY). Non-quantifiable elements are disqualifying, as in #2.  
  - **Option B: Fund**  
    - **Principle Adopted**: **Harm Scale and Plausibility Principle**, with flexibility on quantification. Measurable proxies (e.g., incarceration days) suffice for large harms, even without health metrics. This extends #5 beyond health.  

  ---

  ### Part 3: Recommendation and Best Rule
  **Recommendation: Reject the proposal** to maintain consistency with your track record.  
  - **Why?** Decision #2 is the strongest analog:  
    - Both involve social interventions with credible evidence but non-quantifiable outcomes (mental health heterogeneity vs. dignity/family stability).  
    - Your fund has consistently required outcomes to fit standardized metrics (e.g., health in #1 and #5). Justice reform’s measurable outcomes (days incarcerated) are not equivalent to QALYs and lack a conversion framework.  
    - Funding would break precedent unless justified by tail risk (#3), which is absent here.  

  **Which Principle to Adopt?**  
  - **Endorse the Quantifiable Impact Principle** for consistency:  
    - It best explains 4/5 past decisions (#1, #2, #4, #5). Only #3 (tail risk) is an exception.  
    - **Pros**: Ensures comparability across grants, avoids subjective judgments about "dignity" or "trust," and aligns with EA emphasis on evidence-based metrics.  
    - **Cons**: May overlook large, non-quantifiable harms, but your track record shows this is acceptable (per #2).  

  **Why Not the Harm Scale Principle?**  
  - Adopting it would create inconsistency:  
    - Decision #2 rejected mental health despite "large harms" and moderate evidence. Funding justice reform would contradict this without a new justification (e.g., tail risk).  
    - It risks "slippery slope" into subjective evaluations (e.g., strong anecdotes in #4 were insufficient).  

  **Broader Ethical Guidance**:  
  - If your committee wants to expand beyond health metrics, **publish a new principle explicitly**. For example: "We fund interventions with large-scale harms, credible quasi-experimental evidence, and at least one quantifiable outcome proxy, even without health metrics." This would align with EA values but requires breaking from precedent.  
  - Short-term: Stick to your core principles for consistency. Long-term, revisit your metric framework to include broader welfare measures (e.g., using disability-adjusted life years for incarceration).  

  **Final Decision**: Reject, based on the Quantifiable Impact Principle and analogy to Decision #2.
