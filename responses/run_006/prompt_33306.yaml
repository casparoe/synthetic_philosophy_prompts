  We are facing a contradiction in a scenario that combines a Humean view of chance (where chance is defined by the actual frequencies in the finite universe) with the principle of deference (which says that one's credence should match the known objective chance). The argument leads to a contradiction: we are forced to assign both 0.9 and 0 credence to the tenth coin toss being heads.

  The steps of the argument are:

  (1) We know the objective chance of heads on toss #10 is 0.9.
  (2) By the deference principle, we set our credence for heads on toss #10 to 0.9.
  (3) We also know that the chance being 0.9 means that exactly nine of the ten tosses are heads, and we have seen nine heads in the first nine tosses. Therefore, the tenth toss must be tails to make the total heads exactly nine? Wait, no: if we have seen nine heads already and the total heads is nine, then the tenth must be tails. But note: if the total heads is nine, then there is exactly one tail. Since we have seen nine heads (which are all heads), the tail must be on the tenth toss. Therefore, we know the tenth toss is tails.
  (4) So our credence for heads on toss #10 should be 0.
  (5) Contradiction: 0.9 vs 0.

  The problem arises because the chance fact (that the overall frequency is 0.9) is not independent of the outcome of the tenth toss. In fact, it is a global fact that includes the outcome of the tenth toss. Therefore, when we condition on the chance being 0.9 and on the first nine tosses being heads, we are forced to conclude that the tenth toss is tails.

  The obvious fix, as you mention, is to declare that the chance fact is "inadmissible" in the context of the deference principle. The deference principle (often associated with David Lewis's Principal Principle) typically includes an admissibility clause: one should set one's credence equal to the chance conditional on all admissible information. The idea is that admissible information is information that does not "contain" information about the future beyond what the chance itself provides.

  In this case, the chance fact (that the overall frequency is 0.9) is inadmissible because it is not a fact that is independent of the outcome of the tenth toss. In fact, it directly tells us about the tenth toss: it tells us that exactly one of the ten tosses is tails. Since we have already seen nine heads, we can deduce that the tenth must be tails. So the chance fact is inadmissible because it gives us information about the future outcome.

  But you worry that this fix guts the principle because it seems that whenever we know the chance, and the chance is defined by future events (as in this Humean view), then the chance fact will be inadmissible. Moreover, in real life, we often have background knowledge that might be correlated with future events.

  However, note that in the standard Principal Principle, the chance is taken to be an objective probability that is not reducible to the actual outcomes in such a direct way. In Lewis's original formulation, the chance is set by the entire history of the world up to the time of the chance set, plus the laws of nature. But in your toy model, the chance is defined by the entire history (including the future). This is the key difference.

  Therefore, one way out is to reject the Humean view of chance in this toy model. But you also say that the contradiction seems to come just from knowing the outcomes, not from where chances come from. However, the source of the chance is crucial: in the Humean view, the chance is a global fact that includes the future. In a non-Humean view, the chance might be a local fact determined by the current state and the laws, without being directly constituted by the future outcomes.

  But let's try to see how we might reject one of the steps without abandoning the Humean view.

  Re-examining step (1): Is it true that you know the objective chance of toss #10 landing heads is 0.9?

  In the Humean view, the chance of heads on a single toss is not defined until all ten tosses have occurred. But note: the chance is defined as the proportion of heads in the entire sequence. However, at the time of the tenth toss, we have not observed the tenth toss. But the chance is a fact about the entire sequence. So at the moment before the tenth toss, we know that the chance (which is the overall frequency) is 0.9 only if we know that the entire sequence has nine heads. But we don't know the entire sequence yet. We only know the first nine.

  Therefore, step (1) is problematic: at the time of the tenth toss, we do not know the objective chance because we don't know the entire sequence. We only know that the chance is either 0.9 (if the tenth is tails) or 1.0 (if the tenth is heads). But we don't know which.

  But wait: the setup says "the chance of heads on any toss is just the proportion of the ten tosses that land heads". Therefore, the chance for each toss is the same and is equal to the proportion in the entire sequence. However, we are told that the chance is 0.9. That is, we are given that the overall proportion is 0.9. So it is given as background that the entire sequence has exactly nine heads. So we do know the chance is 0.9 because it is stipulated in the setup.

  So step (1) is true by the setup: we know the chance is 0.9.

  But then step (3) follows: knowing that there are exactly nine heads in total and that the first nine were heads, we deduce that the tenth must be tails.

  Therefore, the problem is with the deference principle: we cannot apply it naively when the chance fact itself carries information about the outcome.

  Thus, the solution is to restrict the deference principle to cases where the chance is determined by factors that are independent of the outcome in question. In this case, the chance is determined by the entire sequence, which includes the outcome in question. Therefore, we must condition on the chance fact appropriately.

  In Bayesian terms, we should condition on all the information we have. We have two pieces of information:
  - The entire sequence has exactly nine heads (so the overall frequency is 0.9).
  - The first nine tosses are heads.

  Given these, we can deduce the tenth is tails. So our credence for the tenth toss being heads is 0.

  But why then does the deference principle seem to say 0.9? It is because the deference principle is being applied without taking into account that the chance fact itself is not independent of the outcome. The principle says: if you know the chance is P, then set your credence to P. But it doesn't say to ignore other information that is relevant. And in this case, we have more information: we know the first nine outcomes and we know that the chance is 0.9 (which implies there is exactly one tail). So we have to combine all the information.

  So the deference principle should be understood as: conditional on the chance being P and any other admissible information, set your credence to P. However, in this case, the other information (the first nine tosses) is admissible, and together with the chance fact, it allows us to deduce the outcome. Therefore, the deference principle is overridden by the total information.

  But note: the chance fact is not admissible in this context because it gives information about the outcome beyond what a typical chance statement would. In a non-Humean chance, the chance might be set by the initial conditions and laws, and knowing the chance would not tell us about the specific outcome. But in this Humean chance, it does.

  Therefore, the cost of this solution is that we must be careful about when a chance fact is admissible. In the Humean view, chance facts may often be inadmissible because they are global and include information about the future. However, in practice, we often don't know the exact global pattern. In real life, we don't know the entire future, so we can use the deference principle when we have estimates of chances that are based on past frequencies and are not contaminated by future information.

  In your toy model, the problem is extreme because we are given the exact global frequency. But in a more realistic setting, we might have a chance that is estimated from past data and is independent of the future outcome. For example, if we have a coin that we believe is fair because we've seen many past tosses, then that chance is based on the past and is admissible for future tosses.

  Therefore, the deference principle remains useful in typical cases. It breaks down only in cases where the chance fact itself is defined in a way that depends on the outcome in question (as in this finite Humean scenario).

  So to resolve the argument:

  - Step (2) is the one to reject: we cannot apply the deference principle in this context because the chance fact is inadmissible (it contains information about the outcome that, when combined with the first nine results, allows deduction). Therefore, we do not set our credence to 0.9.

  Instead, we set our credence based on all the information: 0.

  What does this cost? It requires that we have a notion of admissibility. But note that the Principal Principle already requires admissibility. So we are not changing the principle, we are just recognizing that in this case, the information we have (including the chance fact) is inadmissible for the outcome in question.

  Alternatively, we can avoid the contradiction by noting that in the Humean view, we cannot know the chance until the entire sequence is fixed. But in the setup, we are told that the chance is 0.9. So we are given knowledge of the entire sequence having nine heads. Therefore, we have complete information and there is no uncertainty. So there is no room for the deference principle: we don't need to defer to chance because we already know the outcome.

  In summary, the deference principle is meant for situations of uncertainty. When we have complete information (as we do in this case, because we know the entire pattern of outcomes), we don't use the chance. This is consistent: the chance is 0.9, but we know that this chance is realized by a specific pattern. And given our knowledge of part of the pattern, we can deduce the rest.

  Therefore, the solution is to reject step (2): the deference principle does not require setting credence to 0.9 when we have additional information that is inadmissible (or when we have complete information). We must condition on all the information we have.

  The cost is that we must be careful about admissibility, but that is already built into the Principal Principle. And in typical cases, we do not have such complete information.

  So you can keep the deference principle and the Humean view, but you must apply the principle correctly: only when the chance information is admissible and when it does not conflict with other information that we have.

  In real life, we rarely have complete information about the future, so the principle remains applicable.

  Alternatively, if you want to avoid admissibility, you can reject the Humean view in this form. For example, you might say that the chance for the tenth toss is not 0.9 at the time of the toss because the entire sequence isn't fixed yet. But that would require a different account of chance in the Humean framework (such as a time-dependent chance). However, in the problem, we are told that the chance is 0.9 and it is defined by the entire sequence. So that move is not available in the setup.

  Therefore, the best solution is to recognize that the chance fact is inadmissible in this context and reject step (2).
answer: |-
  The contradiction arises from a subtle misapplication of the deference principle in your toy scenario. Let's break down the argument step by step and identify where it goes wrong, preserving both the deference principle and a Humean view of chance where possible. The key insight is recognizing the role of **admissibility** and the **temporal aspect** of information.

  ### Step-by-Step Analysis:
  1. **Step (1): "You know the objective chance that toss #10 lands heads is 0.9."**  
     This is true *given the setup*. In your Humean model, chance is defined as the actual frequency: 9 heads out of 10 tosses. Since you're told the chance is 0.9, you know the entire sequence has exactly 9 heads and 1 tail. No issue here.

  2. **Step (2): "By the deference principle, your credence that toss #10 lands heads should be 0.9."**  
     This is where the error creeps in. The deference principle (e.g., Lewis's Principal Principle) requires that chance be **admissible information**—it must not "sneak in" information about the specific outcome beyond what the chance value itself represents. In your case, the chance fact "0.9" is **inadmissible** for the tenth toss because:  
     - It encodes *global* information about the entire sequence, including the future.  
     - Combined with your knowledge of the first nine tosses (all heads), it *logically entails* that the tenth toss is tails.  
     Applying the deference principle here ignores that you have **more information than just the chance value**. You have:  
     - The chance fact (9 heads in total).  
     - The first nine outcomes (all heads).  
     Together, these imply the tenth toss *must* be tails. The deference principle doesn't demand ignoring other relevant knowledge.

  3. **Steps (3) and (4): Deduction that credence should be 0.**  
     This is correct *given your total information*. Knowing:  
     - There are exactly 9 heads in total.  
     - The first 9 are heads.  
     ...means you can deduce the tenth is tails with certainty. Credence *should* be 0. No contradiction yet—step (2) is the problem.

  4. **Step (5): Contradiction arises only if step (2) is accepted.**  
     Rejecting step (2) resolves the contradiction: your credence is 0, not 0.9, because the deference principle doesn't apply to inadmissible information.

  ### Why This Doesn't Gut the Deference Principle:
  - **Admissibility is not ad hoc**: The deference principle *always* requires admissibility (it's built into formal versions like the Principal Principle). Your toy case exploits a scenario where chance is defined in a way that *entails* future outcomes—but this is rare in practice.  
  - **Real-world applicability**: In most real cases, chances are based on *past* frequencies or physical symmetries (e.g., a coin with known bias from previous tosses). These are admissible because they don't logically fix future outcomes. For example:  
    - If you know a coin is fair from past tosses, your credence for heads on the next toss should be 0.5.  
    - You don't know the *entire future sequence*, so the chance remains admissible.  
  - **Humeanism survives**: The issue isn't Humeanism per se, but how chance is *known*. In your model, knowing the global chance (0.9) *requires* knowing the entire sequence's outcome. But in practice, we rarely know global chances with certainty—we estimate them from past data, which is admissible for future events. If you didn't know the first nine outcomes, learning "chance is 0.9" *would* warrant a credence of 0.9 for any single toss.

  ### What If You Keep Humeanism?
  This scenario highlights a quirk of *finite* Humean models:  
  - In a tiny universe, "chance" is just a description of the entire sequence. Knowing it means you have full information, leaving no room for uncertainty.  
  - **Fix**: Adopt a time-indexed notion of chance. At any moment, the chance of an event is defined by the best available evidence (e.g., past frequencies), not the future. For the tenth toss:  
    - *Before* any tosses, the chance of heads on toss #10 is undefined or 0.9 (if you know the future sequence, though typically you wouldn't).  
    - *After* seeing nine heads, the chance for #10 should be updated based on current knowledge (e.g., frequentist inference).  
    This avoids the contradiction but requires tweaking your toy model.

  ### Costs of Rejection:
  - **Rejecting step (2)**: Costs little. It upholds the deference principle by insisting on admissibility, which is standard. It also aligns with Bayesianism: you must condition on *all* evidence, not just the chance fact.  
  - **Rejecting pure Humeanism**: If you abandon the Humean model for chances grounded in laws/propensities, the problem vanishes (chances aren't reducible to outcomes). But this costs ontological simplicity, which you and your friend liked.  

  ### Conclusion:
  **Reject step (2).** The deference principle doesn't apply here because the chance fact is inadmissible—it smuggles in information about the tenth toss when combined with your knowledge of the first nine. This doesn't gut the principle; it refines it for realistic cases where chances are estimated from past data and not entangled with future outcomes. In real-world applications (e.g., betting on a coin with known bias), the principle remains vital and uncontradicted. The toy model is valid but edge-casey; it shows how global knowledge can make chance deference moot, not that deference fails generally. Keep the principle, keep Humeanism if you like, but remember: **deference requires ignorance, not omniscience.**
