  First, considering the neuroscientists - they'll want concrete, measurable predictions. The user's common cause model needs to translate into testable scenarios. I should highlight how their framework predicts specific neural-behavioral dissociations that avoid the "unfalsifiable" trap. Things like timing mismatches between reported awareness and motor preparation could be key.

