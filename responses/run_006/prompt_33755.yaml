  The user mentions each side conceding points but still disagreeing. That's telling. When revisionists say "yes, the law should be symmetric" and orthodox say "yes, deep morality might differ," they're actually talking past each other. The concessions happen at different levels of abstraction. Revisionists see law as pragmatic compromise; orthodox see it as constitutive of war morality itself. 

  Progress might require exposing these hidden premises. For example: 
  - Does "morality of war" refer to ideal ethics or practice-imbedded norms? 
  - Can liability exist outside institutional contexts? (Orthodox would say no—soldier status creates liability; revisionists say liability pre-exists) 
