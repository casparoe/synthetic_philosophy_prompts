answer: |-
  Your diagnosis is perceptive, and the stalemate arises because this is **both a substantive moral disagreement rooted in divergent methodological commitments *and* a conflict over the very nature of "the morality of war."** Here's a structural breakdown:

  ### 1. **Core Disagreement: Competing Metaethical Frameworks**
      *   **Revisionism (McMahan):** Operates within a **cosmopolitan, individualist, act-centered morality**. It applies universal, pre-institutional moral principles (e.g., liability based on responsibility for unjust threat) directly to acts within war. War is *not* a morally distinct sphere; it's simply a context where ordinary morality (self-defense, proportionality, necessity) applies at scale. Permissibility flows *upwards* from the justice of the cause to the individual act.
      *   **Orthodoxy (Walzer):** Operates within a **practice-constituted, role-based morality**. It sees war as a distinct social practice with its own internal logic and constitutive rules, shaped by history, reciprocity, and the unique epistemic/political constraints of the battlefield. Morality here is *embedded* in the roles and institutions of warfare. Permissibility stems *downwards* from the shared recognition of combatant status and the rules of engagement it entails, bracketing the *jus ad bellum* question for the combatant.

  ### 2. **Why Concessions Don't Resolve It: Talking Past Each Other**
      *   **Revisionist Concession (Law ≠ Morality):** They see the Law of Armed Conflict (LOAC) symmetry as a *pragmatic, consequentialist compromise* necessary for functional warfare and humanitarian protection. This is *external* to their core moral project. For them, "the morality of war" *is* the deep individualist morality applied to war.
      *   **Orthodox Concession (Deep Morality ≠ War Morality):** They acknowledge that an unjust combatant *might* be acting immorally in some abstract, cosmic sense *if* we ignore the reality of war. But they insist this "deep morality" is **irrelevant** or even **dangerous** to apply within the practice itself. For them, "the morality of war" *is* the morality governing the practice *as it is*, with its inherent constraints. Conceding a "deep wrong" is like conceding that property rights are "deeply" contingent – true philosophically, but irrelevant to the legal/moral rules governing theft *within* a property system.

  ### 3. **The Sticking Points: Where Frameworks Collide**
      *   **The Nature of Liability:** Revisionists see liability as arising solely from individual responsibility for contributing to an unjust threat. Orthodox see liability as arising primarily from the reciprocal risk inherent in the role of "combatant" within the practice – you become liable *because* you pose a threat *as a combatant*, regardless of *why* you are one.
      *   **Epistemic Constraints:** Revisionists treat soldiers' ignorance as a mitigating factor (reducing blameworthiness), but *not* as fundamentally altering permissibility. Orthodox see epistemic limits as *constitutive* of the combatant role – demanding individual *jus ad bellum* judgments is asking the impossible and destroys the functional symmetry the practice requires.
      *   **The Function of Symmetry:** For Revisionists, symmetry is a tragic necessity imposed by non-ideal reality. For Orthodox, symmetry is a foundational moral achievement *of* the war convention – it's what distinguishes regulated warfare from murder or mere slaughter. It embodies the recognition of shared humanity amidst conflict.
      *   **The Source of Permissions:** Revisionists derive permissions from the justice of the cause and the liability of the target. Orthodox derive permissions from the reciprocal acceptance of the combatant's role and the rules governing its execution.

  ### 4. **What "Progress" Would Look Like (Moving Beyond Stalemate)**
  Progress requires addressing the meta-level disagreement or finding ways to integrate insights without capitulation. It's unlikely to be a decisive "victory" for one side:

  1.  **Clarifying the Scope of "Morality of War":** Explicitly acknowledging this is a **terminological battleground**. Is "morality of war":
      *   The application of universal individual morality *to* war? (Revisionist focus)
      *   The distinctive normative structure *of* the practice of warfare itself? (Orthodox focus)
      *   A layered concept encompassing both? (Potentially fruitful path)
      *   *Progress:* Developing a nuanced taxonomy of moral questions relevant to war (deep individual ethics, role-based ethics, institutional design ethics, legal ethics) and mapping where each framework offers the most compelling answers.

  2.  **Engaging the Metaethics:** Seriously debating the plausibility of a distinct "practice morality" for war. Can a practice with such horrific consequences generate its *own* permissions that override deep individual morality? Or is the Orthodox view merely describing a necessary *illusion* that Revisionism correctly pierces?
      *   *Progress:* Rigorous philosophical work on the metaphysics and normativity of social practices, particularly violent ones. Investigating whether war *can* be a normatively distinct sphere without falling into moral relativism.

  3.  **Empirical/Conceptual Work on Epistemic Constraints:** Moving beyond assertion. *How* do soldiers actually understand their roles and the information available? *Can* a workable system of asymmetric permissions be imagined that doesn't collapse or cause greater harm? How does technology (drones, cyber) change the epistemic landscape?
      *   *Progress:* Empirical studies on soldier cognition and decision-making in conflict; sophisticated modeling of how asymmetric rules might function in different conflict scenarios; analysis of historical attempts at asymmetric warfare ethics.

  4.  **Focusing on Command Responsibility:** Narrowing the gap by emphasizing that Revisionist critiques land most powerfully on leaders (*ad bellum* decision-makers) who *do* have the epistemic capacity and bear primary responsibility. Orthodox concerns about combatant symmetry remain strongest for rank-and-file soldiers.
      *   *Progress:* Developing more robust, widely accepted frameworks for holding political and military leaders accountable for *jus ad bellum* violations, potentially reducing pressure to condemn individual soldiers.

  5.  **Reconciling Symmetry in Law/Asymmetry in Morality:** Exploring if the Revisionist separation *can* be stable long-term. Does maintaining symmetric laws while believing one side is morally criminal undermine the law's legitimacy or create dangerous cognitive dissonance? Can the Orthodox view provide a coherent moral foundation for LOAC that Revisionism struggles with?
      *   *Progress:* Philosophical and legal analysis of the relationship between deeply held moral convictions about wartime conduct and the stability/effectiveness of international humanitarian law.

  ### Conclusion
  The debate isn't ill-posed, but it *is* operating at cross-purposes due to fundamentally different starting points. It's primarily **a substantive disagreement about the foundations of moral permissions in war**, stemming from **differing methodologies (individualist universalism vs. practice-based institutionalism)**, which then manifests as a **verbal dispute over the meaning of "the morality of war."** Progress won't come from rehashing the core liability argument but from:
  1.  Explicitly confronting the metaethical divergence.
  2.  Developing a more sophisticated, multi-layered understanding of war's morality.
  3.  Conducting targeted empirical/conceptual work on epistemic constraints and institutional feasibility.
  4.  Focusing scrutiny on leaders while refining the moral/legal framework for combatants.

  The stalemate persists because each side exposes the deepest vulnerability in the other's core presuppositions. Breaking it requires either a paradigm shift in how we conceptualize morality in institutional contexts like war or pragmatic integration of insights that respects the strengths of both perspectives without forcing full reconciliation.
