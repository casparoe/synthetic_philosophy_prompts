answer: |-
  ## The Surgeon's Omission Puzzle

  Consider this scenario:

  **The Negligent Surgeon:** Dr. Adams is the lead surgeon performing an emergency appendectomy on Patient P. Dr. Baker is a highly specialized consultant surgeon observing the operation remotely but not actively participating. During the procedure, Dr. Adams notices a critical, life-threatening anomaly in P's anatomy that requires immediate intervention (e.g., clamping a bleeder). **Dr. Adams omits to perform this intervention.** Dr. Baker, watching remotely, also sees the anomaly and realizes the necessary intervention, but **omits to call Dr. Adams to alert him** (perhaps due to distraction or negligence). Patient P dies as a direct result of the unaddressed anomaly.

  **Counterfactual Parity:**
  1.  **Had Dr. Adams acted** (performed the intervention), P would not have died (even if Dr. Baker still omitted to call).
  2.  **Had Dr. Baker acted** (called Dr. Adams to alert him), Dr. Adams would have performed the intervention, and P would not have died (assuming Dr. Adams would have responded correctly to the alert).

  Counterfactually, *both* omissions satisfy the basic condition for causation by omission: had the agent acted (i.e., not omitted), the outcome (P's death) would not have occurred. They are counterfactually on par regarding preventing the death.

  **Asymmetrical Intuitive Judgments:**
  Our strong intuitive causal judgment is that **Dr. Adams's omission is a cause of P's death**, while **Dr. Baker's omission is not (or is significantly less of) a cause** of P's death. We might say Dr. Baker *failed to prevent* the death, but we primarily blame Dr. Adams *for causing* the death through his omission. Dr. Adams "let the patient die"; Dr. Baker "failed to save" him.

  **What Drives the Asymmetry:**
  The asymmetry is driven by **normative expectations, roles, and duties**, specifically **positive duties of care**:

  1.  **Role-Based Positive Duty:** Dr. Adams, as the *lead surgeon actively performing the operation*, has a direct, specific, and non-delegable *positive duty* to monitor the patient's condition *during the procedure* and take necessary actions to preserve life. His role *constitutively* requires active intervention in the specific process unfolding.
  2.  **Lack of Active Role/Weaker Duty:** Dr. Baker, while a skilled consultant *observing remotely*, lacks the same constitutive role *in this specific procedure*. His duty is weaker and more indirect; it might be a duty to assist *if feasible* or *if noticing an error*, but it is not the primary, active duty to manage the procedure itself. He is not an active participant *in the causal chain* Dr. Adams is controlling.
  3.  **Default vs. Deviation:** The situation involving Dr. Adams is the *default ongoing process* (the surgery he is performing). His omission represents a *deviation* from the expected, normatively required activity *within that process*. Dr. Baker's situation is *external* to this primary process; his call would have been an *interruption* or *correction* to the default process Dr. Adams was (failing at) conducting. Causation seems tied to failures *within* the expected process.

  **The Challenge for Reductive Accounts:**
  Reductive accounts of causation by omission (like David Lewis's counterfactual theory or process-based theories) typically aim to define causation solely in terms of physical processes, counterfactual dependencies, or spatiotemporal relations, *without* essential reference to norms, duties, or roles. This puzzle poses a significant challenge because:

  1.  **Counterfactual Equivalence:** Both omissions satisfy the core counterfactual criterion ("if agent had acted, outcome would not have occurred"). A purely counterfactual analysis struggles to distinguish them causally. Any "fix" based solely on counterfactual structure (like fine-grained events or specific counterfactual comparisons) seems ad hoc or fails to capture the intuitive difference reliably.
  2.  **Lack of Physical Difference:** There's no fundamental physical difference in the *absence* itself. The "nothing happening" by Adams and the "nothing happening" by Baker are physically identical absences. Process theories, which focus on the transmission of physical quantities or conserved quantities (like energy/momentum), struggle to differentiate between absences – an absence doesn't transmit anything. The *effect* (P's death) is physically caused by the *presence* of the unaddressed anomaly, not directly by the absences of action.
  3.  **Essential Reliance on Normativity:** The *only* factor that robustly explains the intuitive asymmetry is the *normative context* – the specific roles, duties, and expectations assigned to Dr. Adams vs. Dr. Baker. A reductive account that excludes normativity cannot capture why Adams's omission feels like a *cause* while Baker's feels like a mere *failure to prevent*. It forces the account to either:
      *   **Incorrectly equate them causally** (both are causes), violating strong intuitions.
      *   **Artificially build in normative concepts** (like "duty" or "expected process"), abandoning reductionism.
      *   **Find non-normative criteria** (like proximity, salience, or statistical frequency) that correlate with the normative ones but seem explanatorily secondary and potentially unreliable.

  **Conclusion:**
  The "Negligent Surgeon" case illustrates a core conceptual puzzle for causation by omission: two omissions can be counterfactually equivalent regarding an outcome, yet our causal judgments treat them starkly differently based on normative factors like roles and duties. This asymmetry highlights that our concept of causation by omission is deeply intertwined with normative expectations about who *should* be acting in a given context. Reductive accounts, striving to define causation without reference to norms, struggle to accommodate this fundamental aspect of our causal reasoning about omissions, suggesting that a fully reductive analysis of causation by omission may be impossible or fundamentally incomplete.
