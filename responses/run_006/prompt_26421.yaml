answer: |-
  You've hit on one of the most profound and empirically supported critiques in social psychology, with deep philosophical implications. This mismatch absolutely has established names and a rich literature. Here's a breakdown of the core concepts, the debate, and its nuances:

  1.  **The Core Concept: The Fundamental Attribution Error (FAE)**
      *   **Definition:** This is the most direct label for the *cognitive bias* you describe. Coined by Lee Ross in 1977, the FAE is the tendency for people to overemphasize personality-based (dispositional) explanations for someone else's behavior while underemphasizing situational influences.
      *   **Mechanism:** When observing *others*, we focus on the actor and their perceived traits ("He's dishonest"). When explaining our *own* behavior, we are much more likely to cite situational pressures ("I was under a lot of stress," "They provoked me").
      *   **Your Observation:** Your examples perfectly illustrate the FAE in action – people jumping to "selfish," "dishonest," or "kind" as stable traits to explain behavior, ignoring the powerful role of context (office vs. home, time pressure, authority figure).

  2.  **The Broader Theoretical Framework: The Person-Situation Debate**
      *   **The Spark:** Walter Mischel's 1968 book *Personality and Assessment* was a bombshell. He reviewed decades of research and found that personality traits (as measured by tests) were surprisingly weak predictors of specific behaviors across different situations. The correlation was often around 0.30, meaning traits explained less than 10% of behavioral variance. Situational factors often dominated.
      *   **The Core Tension:** This ignited a decades-long debate:
          *   **The Trait/Dispositionist Side:** Argued that traits *are* real, stable, and predictive, especially when looking at behavioral aggregates over time and across situations, or when considering strong traits. They criticized Mischel for focusing on single behaviors and overlooking consistency in broader patterns. (e.g., A generally extraverted person might be quiet at a funeral, but will still tend to seek social interaction more than an introvert overall).
          *   **The Situationist Side:** Argued that Mischel's findings revealed a fundamental truth: behavior is far more context-dependent than personality theory acknowledged. The FAE demonstrates our faulty intuition about the power of traits. Situations exert immense, often underestimated, influence (as in your seminary and Milgram examples).
      *   **The Resolution (More or Less - Interactionism):** The extreme positions softened. The dominant view now is **Interactionism**: Behavior is a product of the *interaction* between a person's characteristics (including traits, beliefs, skills, goals) *and* the specific situation they are in.
          *   Traits influence how we *perceive* and *react* to situations (e.g., an anxious person perceives more threat).
          *   Situations activate different aspects of a person's repertoire (e.g., your patience with strangers vs. snapping at your partner – different contexts pull for different responses, even if you have an overall level of patience).
          *   People also *select* and *shape* their situations (e.g., an extravert seeks out parties).

  3.  **Other Key Terms & Concepts:**
      *   **Situationism:** The theoretical perspective emphasizing the power of situations to shape behavior, often minimizing the role of stable traits. Associated with psychologists like Mischel, Ross, and philosophers like Gilbert Harman and John Doris ("Lack of Character").
      *   **Correspondence Bias:** A close cousin to the FAE, specifically referring to the inference that a person's behavior corresponds to an underlying disposition, even when powerful situational forces are evident. It's the specific *inference* step within the FAE.
      *   **The Misattribution of Behavior to Traits:** This is a very precise way to phrase the core tension you identified – we incorrectly attribute behavior primarily to stable internal traits, overlooking situational causes.
      *   **Cognitive Miser Model:** Explains *why* we do this. Attributing behavior to traits is cognitively easier and faster than deeply analyzing the complex web of situational factors involved. Traits offer simple, stable explanations.
      *   **The "Channel Factors" (Lewin):** Small, seemingly insignificant situational details that can "channel" behavior in a specific direction. The "running late" instruction in the Good Samaritan study is a classic channel factor that overrode dispositional factors.

  **The Edges and Nuances of the Tension:**

  *   **Strength of Situation vs. Strength of Trait:** Not all situations are equally powerful (a fire alarm vs. a slightly boring meeting), and not all traits are equally strong or relevant to a given context. The tension is most pronounced in moderately strong situations where we *expect* traits to dominate but they don't (like the seminarians).
  *   **Culture:** The FAE appears more pronounced in Western individualistic cultures than in collectivistic cultures, where situational explanations are often given more weight.
  *   **Actor-Observer Difference:** As mentioned, we commit the FAE more readily when judging *others* than when explaining ourselves.
  *   **Motivational Factors:** Sometimes we *want* to believe in stable traits (especially negative ones in enemies or positive ones in heroes) to make the world seem more predictable and controllable, or to justify blame/praise.
  *   **Moral Judgment:** This debate has huge implications for ethics. If situations powerfully constrain behavior, how responsible are individuals? (This links to the Milgram experiment and discussions of "banality of evil"). Conversely, if traits are weak, does "character education" make sense?

  **In Summary:**

  You're observing the **Fundamental Attribution Error** in daily life – our cognitive bias to over-attribute others' behavior to stable **dispositions (traits)** and under-attribute it to **situational factors**. This bias is rooted in the empirical findings of **situationism**, which challenged traditional **trait theory**, sparking the **Person-Situation Debate**. The modern consensus is **Interactionism**: behavior arises from the dynamic interplay of the person *and* the situation. The core tension is the **misattribution of behavior to traits**, a tendency driven by cognitive efficiency and cultural factors, but frequently leading us astray from the complex reality of how context shapes actions.

  **Key Thinkers/Writers to Explore:**
  *   Walter Mischel (Person-Situation Debate originator)
  *   Lee Ross (Fundamental Attribution Error)
  *   Stanley Milgram (Obedience to Authority - situational power)
  *   John Darley & C. Daniel Batson (Good Samaritan study)
  *   Gilbert Harman & John Doris (Philosophical critiques of character/traits based on situationism)
  *   Kurt Lewin (Interactionism, Channel Factors - B = f(P, S))
  *   David Funder & Dan McAdams (Modern trait psychologists advocating for interactionist views)

  Your observations are incredibly astute and touch on foundational questions about human nature, responsibility, and how we understand ourselves and others. The literature you seek is vast and deeply influential.
