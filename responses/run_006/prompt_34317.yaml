  We are drafting a joint statement for two philosophers in an adversarial collaboration on the problem of old evidence in Bayesian epistemology. The statement must be in British English, collegial and precise.

  Structure:
  1. Numbered list of agreed claims (substantive, not truisms)
  2. Table of residual disagreements (point at issue, defender's position, critic's position, nature of disagreement)
  3. Crux list (sub-questions that would move the debate, each party's prediction, concrete test)
  4. Closing note on changes in views and strongest considerations from the other side

  Agreed Claims (Numbered List):
  - Both parties accept that the problem of old evidence, as initially formulated by Glymour, presents a challenge to the standard Bayesian definition of confirmation (where confirmation requires P(H|E) > P(H)).
  - They agree that when an agent is certain of E (i.e., P(E)=1), then by the definition of conditional probability, P(H|E) = P(H). Thus, in the standard framework, E cannot confirm H in such a case.
  - They agree that in scientific practice, old evidence (evidence already known) is often taken to confirm new theories. A successful account of confirmation should be able to capture this.
  - They agree that some proposed solutions within the Bayesian framework (such as the simple strategy of setting P(E) < 1 by forgetting or ignoring current knowledge) are psychologically unrealistic and methodologically unsound.
  - They agree that the counterfactual approach (where we consider what the agent's degree of belief in E would have been if they had not known E) is a common and initially promising strategy, but they also agree that it faces challenges in specifying the exact counterfactual scenario without arbitrariness.
  - They agree that enriching the hypothesis space (for example, by including the logical truth of E as part of the hypothesis) can sometimes resolve the problem in specific cases, but they concur that this approach may not be generalisable to all cases and may lead to an explosion of the hypothesis space in complex ways.
  - They agree that the problem of old evidence is not merely a technical glitch but points to a deeper issue about the relationship between logical learning and empirical confirmation in Bayesianism.

  Table of Residual Disagreements:

  | Point at Issue | Defender's Position | Critic's Position | Nature of Disagreement |
  |----------------|---------------------|-------------------|------------------------|
  | The adequacy of the counterfactual approach | "The counterfactual approach, when properly formalised using a model of the agent's epistemic state at a time before learning E, provides a principled and general solution within the Bayesian framework. The counterfactual degree of belief P'(E) can be objectively constrained by the agent's background knowledge at that time." | "The counterfactual approach is inherently unstable and subjective. The choice of which prior state to use is arbitrary, and the resulting confirmation measure is not robust under different ways of modelling the counterfactual state. Thus, it fails to provide an objective account of confirmation by old evidence." | Substantive, but partially verbal regarding "objectivity" and "principled". |
  | The scope of Bayesian confirmation theory | "Bayesian confirmation theory, when augmented with a suitable account of logical learning and the inclusion of implicit background assumptions, can fully accommodate the phenomenon of old evidence without abandoning its core principles." | "The problem of old evidence reveals a constitutive limitation of Bayesianism: it is fundamentally a theory of how agents should update their beliefs in light of new information, and thus it is ill-equipped to handle cases where the evidence is not new. The fixes proposed are ad hoc and ultimately transform Bayesianism into a different theory." | Substantive. |
  | The role of logical knowledge | "The problem can be resolved by recognising that when an agent learns a new hypothesis H that entails E (or makes E probable), the agent is often learning a logical or mathematical connection. This should be modelled as a change in the probability distribution due to logical learning, which is consistent with Bayesianism." | "Modelling logical learning within Bayesianism requires a radical departure from standard Bayesian conditioning. The proposed models (e.g., by Garber) involve non-Bayesian updates and thus do not preserve the core Bayesian machinery." | Substantive, but partially verbal on what counts as "core Bayesian machinery". |

  Crux List:

  1. **Crux: Can the counterfactual approach be formalised in a way that yields an objective and non-arbitrary measure of confirmation for old evidence?**
     - Defender's prediction: Yes, by using the agent's actual background knowledge and beliefs at the time before learning E, we can construct a unique and objective counterfactual prior.
     - Critic's prediction: No, because the agent's background knowledge at any past time is underdetermined and the counterfactual scenario is too vague to yield a unique prior.
     - Test: Develop a formal model that specifies the counterfactual prior based on the agent's epistemic state at a time t before learning E. Examine a case study (e.g., Mercury's perihelion and general relativity) and see if the model yields a unique and plausible confirmation measure. Both parties agree that if the model produces a unique and historically accurate confirmation measure without arbitrary choices, that would support the defender; if it requires arbitrary choices or fails to match the historical record, that would support the critic.

  2. **Crux: Does the enrichment of the hypothesis space (e.g., by including the logical truth of E) resolve the problem without collapsing into a non-Bayesian framework?**
     - Defender's prediction: Yes, by including the logical connection between H and E as part of the hypothesis (e.g., H entails E), we can model the discovery of this connection as a Bayesian update, and this update will show confirmation without requiring counterfactuals.
     - Critic's prediction: No, because the update on the logical connection (e.g., learning that H entails E) is not a standard Bayesian update on empirical evidence but a logical update, which violates the Bayesian tenet that all learning is by conditionalisation on evidence.
     - Test: Formalise the logical learning step as a Bayesian update on a proposition about logical relations (e.g., the proposition that H entails E). Both parties agree that if such an update can be shown to be equivalent to a standard conditionalisation and if it yields the correct confirmation measure in paradigmatic cases, that would support the defender. If it requires a non-conditionalisation update (e.g., Jeffrey conditionalisation or a different rule) or if it leads to inconsistencies, that would support the critic.

  3. **Crux: Is the problem of old evidence a symptom of a deeper limitation of Bayesianism?**
     - Defender's prediction: No, the problem is a technical challenge that can be met within the framework, and the solutions (counterfactual or logical) are consistent extensions of the core theory.
     - Critic's prediction: Yes, the problem reveals that Bayesianism is inherently tied to the learning of new evidence and cannot account for the confirmation by old evidence without abandoning its core commitments.
     - Test: Examine whether the proposed solutions preserve the core principles of Bayesianism (e.g., updating by conditionalisation, probabilism). Both parties agree that if the solutions can be implemented without violating any core principle, then the defender's view is strengthened. However, if the solutions require a fundamental change (e.g., allowing non-conditionalisation updates for logical learning) then the critic's view is strengthened.

  Closing Note:
  - Defender's evolution: Initially, the defender was confident that the counterfactual approach was fully adequate. Through the collaboration, the defender now acknowledges the challenges in specifying the counterfactual state and has shifted to a more pluralistic view, accepting that logical learning within an enriched hypothesis space may be a necessary complement. The strongest consideration from the critic is the apparent arbitrariness in the counterfactual prior.
  - Critic's evolution: The critic initially held that the problem was fatal to Bayesianism. Now, the critic concedes that some cases of old evidence can be handled by Bayesian extensions (like logical learning) but maintains that these are not purely Bayesian. The strongest consideration from the defender is the ability of the enriched hypothesis space approach to yield intuitive confirmation measures in key historical cases without leaving the probabilistic framework.

  Now, we draft the full statement accordingly.
answer: |-
  ### Joint Statement on the Problem of Old Evidence in Bayesian Epistemology  
  **Adversarial Collaboration Conclusion**  
  *Issued by the Defender (Dr. A) and the Critic (Dr. B)*  
  *September 2023*  

  After two years of collaborative research, we present this joint statement on the problem of old evidence (PoOE) in Bayesian confirmation theory. We agree on core aspects of the challenge and which resolutions are untenable, while acknowledging persistent disagreements. This document outlines our convergences, divergences, and open questions, aiming to clarify the debate for the philosophical community. We write in a spirit of collegiality, recognising the strengths in each other’s arguments while maintaining our core positions.  

  ---

  ### 1. Agreed Claims  
  Both parties accept the following substantive claims:  

  1. **Formal Structure of PoOE**:  
     If an agent’s degree of belief in evidence \(E\) is certain (i.e., \(P(E) = 1\)), the Bayesian definition of confirmation—where \(E\) confirms \(H\) iff \(P(H|E) > P(H)\)—implies \(P(H|E) = P(H)\). Thus, \(E\) cannot confirm \(H\) under these conditions. This is incompatible with scientific practice, where theories (e.g., general relativity) are often confirmed by evidence already known (e.g., Mercury’s perihelion).  

  2. **Necessary Conditions for Resolution**:  
     A successful account must:  
     - Explain why scientists rationally ascribe confirmatory power to \(E\) even when it is "old".  
     - Preserve the objectivity of confirmation (i.e., avoid arbitrary or agent-relative fixes).  
     - Cohere with the historical use of old evidence in theory acceptance (e.g., in cases like gravitational lensing).  

  3. **Failed Resolutions**:  
     - **Simple belief revision** (e.g., "forgetting" \(E\) by setting \(P(E) < 1\)) fails, as it is psychologically implausible and severs confirmation from actual epistemic states.  
     - **Unconditional probability shifts** (e.g., retroactively lowering \(P(E)\) without justification) fail, as they introduce subjectivity and violate Bayesian coherence.  
     - **Purely synchronic approaches** (e.g., reinterpreting \(H\) to include \(E\)’s truth) fail, as they conflate hypothesis formation with confirmation and do not address the diachronic aspect of discovery.  

  4. **Broader Implications**:  
     PoOE is not a superficial technicality but exposes a tension between Bayesianism's treatment of logical learning (e.g., grasping \(H \vdash E\)) and empirical confirmation.  

  ---

  ### 2. Residual Disagreements  
  The table below summarises key unresolved disputes. Wording reflects each party’s self-endorsed position.  

  | Point at Issue | Defender’s Position | Critic’s Position | Nature of Disagreement |  
  |----------------|----------------------|-------------------|------------------------|  
  | **Viability of the counterfactual approach** | "The counterfactual method—evaluating confirmation by assessing what an agent’s degree of belief in \(E\) *would have been* absent knowledge of \(E\)—provides a principled, purely Bayesian solution. By rigorously constraining counterfactual priors (e.g., via background knowledge \(K\)), it yields objective confirmation measures without framework collapse." | "The counterfactual approach is inherently unstable. Its reliance on subjective or historically underdetermined priors (e.g., ‘What would Newton have believed about \(E\)?’) renders confirmation arbitrary. This fails to meet the objectivity requirement and implicitly abandons core Bayesian commitments." | Partly verbal and substantive. **Verbal**: "Principled" (Defender) vs. "arbitrary" (Critic) hinges on whether constraints on priors are sufficient for objectivity. **Substantive**: Whether Bayesianism can accommodate counterfactuals without ad hocness. |  
  | **Scope of Bayesian resources** | "PoOE is resolvable within standard Bayesianism by enriching the hypothesis space (e.g., treating \(H \vdash E\) as a proposition) and modelling logical learning as conditionalisation. This preserves the framework’s core while capturing old evidence cases." | "Enriching the hypothesis space either (i) requires non-Bayesian updates (e.g., logical omniscience violations) or (ii) disguises external machinery (e.g., syntactic tinkering) as Bayesian. PoOE reveals a constitutive flaw: Bayesianism is unequipped to handle non-incremental logical learning." | Substantive. **Core issue**: Whether "enrichment" adheres to Bayesian norms (e.g., probabilistic coherence and conditionalisation) or covertly alters them. |  
  | **Status of Bayesian confirmation theory** | "Bayesianism, augmented with diachronic strategies (counterfactual or logical), fully resolves PoOE. The framework’s core machinery—probabilism, conditionalisation, and coherence—remains intact." | "PoOE demonstrates that Bayesianism is structurally limited to *new* evidence. Attempted fixes either fail or transform it into a hybrid (e.g., incorporating abduction), abandoning its foundational role as a unified theory of confirmation." | Substantive. **Core issue**: Whether Bayesianism’s "core machinery" is preserved in resolutions. |  

  ---

  ### 3. Crux List  
  The following sub-questions would resolve at least one disagreement if settled. Both parties specify predictions and mutually acceptable tests.  

  1. **Can counterfactual priors be objectively constrained in historical cases?**  
     - **Defender’s prediction**: Yes—e.g., using period-specific background knowledge \(K\) (e.g., pre-1915 physics for Mercury’s perihelion) yields unique, non-arbitrary \(P'(E)\).  
     - **Critic’s prediction**: No—e.g., \(K\) underdetermines priors (e.g., multiple "reasonable" priors fit historical context), confirming subjectivity.  
     - **Test**: Jointly analyse a case study (e.g., Neptune’s orbit pre/post Adams). Apply \(K\)-based constraints to derive \(P'(E)\). If agreement on a unique prior emerges, it supports the Defender; if multiple conflicting priors appear equally valid, it supports the Critic.  

  2. **Does logical learning via enriched hypotheses reduce to Bayesian conditionalisation?**  
     - **Defender’s prediction**: Yes—learning \(H \vdash E\) is conditionalisation on a proposition \(L\), yielding \(P_{\text{new}}(H) = P_{\text{old}}(H | L)\).  
     - **Critic’s prediction**: No—such updates require non-Bayesian dynamics (e.g., reallocating credence to logical truths without evidence).  
     - **Test**: Formalise a model where an agent "learns" \(L\) (e.g., "GR entails Mercury’s perihelion") with defined priors over \(L\). If \(P_{\text{new}}(H)\) aligns with standard conditionalisation *and* intuitive confirmation, it supports the Defender; if it violates probability axioms or requires auxiliary rules, it supports the Critic.  

  3. **Does PoOE generalise to non-ideal agents?**  
     - **Defender’s prediction**: Resolutions scale gracefully—counterfactual/logical methods work for non-omniscient agents (e.g., scientists discovering implications post-hoc).  
     - **Critic’s prediction**: Bayesianism’s reliance on idealisation (e.g., logical omniscience) exacerbates PoOE, making resolutions inapplicable to real agents.  
     - **Test**: Simulate confirmation in a computational agent with limited rationality (e.g., an AI with bounded logical reasoning). If Bayesian methods (e.g., counterfactual priors) produce coherent confirmation, it supports the Defender; if PoOE-type failures persist, it supports the Critic.  

  ---

  ### 4. Closing Note: Evolution of Views  
  - **Defender’s journey**: Initially, I held that counterfactual approaches alone sufficed. The collaboration strengthened my view that enriching the hypothesis space is essential, but I now concede the Critic’s point that logical learning poses unique challenges. The strongest consideration from the Critic is the **underdetermination of counterfactual priors** in historical cases—a point demanding further work.  
  - **Critic’s journey**: I entered viewing PoOE as fatal to Bayesianism. While I maintain it reveals a structural defect, I now accept that hybrid approaches (e.g., counterfactual-Bayesian) can handle narrow cases. The Defender’s strongest argument is the **empirical adequacy of logical learning models** in cases like gravitational lensing—though I dispute their Bayesian purity.  

  This collaboration has refined our understanding of PoOE, shifting us from entrenched opposition to nuanced disagreement. We hope this statement catalyses further work, particularly on the cruxes above.  

  ---  
  **Signed**,  
  Dr. A (Defender of Bayesianism)  
  Dr. B (Critic of Bayesianism)
