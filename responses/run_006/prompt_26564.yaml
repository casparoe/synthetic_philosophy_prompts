  Okay, the user is involved in a tenants' union and they've noticed an inconsistency in how they handle criticism based on who it's coming from. Landlords suggesting moderate approaches are dismissed outright, while a councilmember with the same advice is taken seriously. The user is trying to figure out the underlying philosophy behind this practice and whether it's stable or fair.

  First, I need to unpack the different philosophical justifications. The tenants' union seems to be using a form of standing-based dismissal. When a landlord criticizes, their identity as a landlord immediately disqualifies them from being heard. The key here is hypocrisy—landlords are seen as having a conflict of interest. They're telling tenants not to push hard on landlords, which benefits them directly or their class. That's why the union calls them hypocrites. But when the councilmember, who doesn't have that conflict, offers the same advice, it's considered a sincere tactical suggestion. 

  The user mentioned three possible grounds: sincerity, epistemic reliability, and normative standing. Let's break those down. Sincerity refers to whether the critic actually believes in the norms they're invoking. Landlords might not genuinely care about the tenants' cause, so their advice isn't trustworthy. Epistemic reliability is about whether the critic's position affects their judgment. Landlords could be biased, making their tactical assessments less reliable. Normative standing is about the right to blame; if you're violating the norms yourself, you can't call others out. The tenants might see landlords as lacking the moral high ground to advise on tenant struggles.

  But the inconsistency arises because the same argument from different people is treated differently. So the union isn't just evaluating the argument on its merits but the speaker's position. The user is worried this could slide into ad hominem attacks where anyone they dislike gets dismissed. That's a valid concern. How do they prevent that?

  The councilmember is seen as aligned with the tenants' goals, so her advice isn't self-serving. The landlord, however, is perceived as protecting their interests. So the practice hinges on perceived alignment of interests rather than just identity. But without clear criteria, it's messy. For example, what about a small inherited landlord who genuinely supports tenants? The union might still dismiss them based on identity alone. The user needs a more nuanced approach.

  The stability of this practice is tricky. If they don't have clear rules, it could become arbitrary. They need to distinguish between relevant and irrelevant identity factors. Is being a landlord always relevant? What about other conflicts of interest? Also, epistemic reliability might be more justifiable than normative standing because it's about bias affecting judgment rather than moral authority. But even then, someone biased might still have valid points sometimes.

  The user's deeper need might be to ensure their union's practices are fair and effective. They don't want to dismiss good ideas because of the speaker but also need to protect against bad faith actors. They might need a framework that evaluates both the argument's merit and the speaker's potential biases without outright dismissal. Maybe encouraging members to articulate why a suggestion might be self-serving rather than attacking the person. Or setting criteria for when identity matters, like clear financial conflicts.

  Also, the union might prioritize solidarity and trust. Allowing landlords to influence tactics could undermine internal trust, even if their advice is sound. So there's a pragmatic element: maintaining group cohesion. But that needs to be balanced with effective strategy. The user is looking for a principled way to navigate this without hypocrisy or inconsistency.
answer: |-
  This is a fascinating and deeply important philosophical puzzle that cuts to the heart of solidarity movements, epistemic justice, and the nature of criticism itself. Your practice touches on several interconnected concepts, primarily **moral standing to blame/criticize** and **epistemic authority**, with significant pragmatic dimensions. Let's break down the potential theoretical underpinnings and their implications:

  **Core Concepts at Play:**

  1.  **Moral Standing to Blame/Criticize (Hypocrisy as a Standing-Defeater):**
      *   **The View:** Blaming or criticizing others for violating a norm requires that the criticizer is not themselves *currently* and *unrepentantly* violating that same norm (or a closely related one). The hypocrite lacks the *moral authority* or *right* to invoke the norm against others because their own actions demonstrate disrespect for it.
      *   **Applied to your case:** Landlords are seen as fundamentally violating the norms of fair housing, tenant dignity, and non-exploitative relationships by virtue of *being* landlords within a system tenants view as oppressive. Therefore, they lack the standing to offer tactical advice on how tenants should fight landlords – their very position undermines their right to speak into that struggle. Their advice is seen as inherently self-serving, attempting to weaken resistance against their own class interests.
      *   **Strengths:** This view resonates strongly with intuitions about fairness and consistency. It protects the group from bad-faith actors seeking to sabotage resistance. It feels intuitively *unfair* to be lectured on tactics by the very group you're fighting.
      *   **Weaknesses:** It risks conflating *identity* with *current culpable action*. A small inherited landlord might be acting ethically within the system. More importantly, **it potentially severs the link between the validity of an argument and its source**. A hypocrite *can* sometimes give good tactical advice, even if they lack the standing to blame.

  2.  **Epistemic Authority and Reliability (The Unreliable Signal):**
      *   **The View:** Hypocrisy is a powerful indicator of epistemic unreliability on the subject matter. If someone systematically violates a norm, their judgment *about* that norm (including how it should be enforced or navigated) is suspect. Their criticism is likely motivated by self-interest or bad faith, not a genuine concern for the norm's application or the group's goals.
      *   **Applied to your case:** A landlord arguing for moderation isn't offering a neutral tactical assessment; they are signaling a desire to protect landlord interests (including potentially their own). Their position creates an overwhelming conflict of interest, making their judgment about "what will work best for tenants" unreliable. The councilmember, however, has demonstrated alignment with tenant goals through past actions. Her conflict of interest is absent or minimal, so her tactical assessment is treated as a more reliable signal of genuine strategic thinking.
      *   **Strengths:** This is more pragmatic and arguably more defensible. It focuses on the *likely motivation and bias* behind the argument, not just abstract standing. It allows that *in principle* a landlord *could* give good advice, but their position makes it so improbable that dismissal is a rational heuristic. It explains why the *same argument* from the councilmember is taken seriously – the source is reliable.
      *   **Weaknesses:** It still relies on judging the source. Determining "alignment" can be subjective. It risks dismissing potentially valid points if the heuristic is applied too rigidly.

  3.  **Pragmatics of Solidarity and Trust:**
      *   **The View:** Within a solidarity movement fighting perceived oppression, internal trust and a sense of shared identity/struggle are paramount. Allowing members of the opposing class (landlords) to influence strategy, regardless of the argument's surface merit, can:
          *   Undermine group cohesion and trust ("Why are we listening to *them*?").
          *   Demoralize members by validating the opponent's perspective internally.
          *   Create avenues for manipulation and co-optation.
          *   Drain energy through internal debates instigated by adversaries.
      *   **Applied to your case:** Dismissing landlord input outright is a defensive mechanism to preserve the union's unity, fighting spirit, and focus. The councilmember, as an ally *outside* the core opposing class, doesn't pose the same threat to internal solidarity, even if offering similar advice. Her input strengthens the sense of external support.
      *   **Strengths:** This directly addresses the practical realities of organizing. It prioritizes the survival and effectiveness of the movement.
      *   **Weaknesses:** It can justify dismissing *any* dissent or uncomfortable truths if framed as coming from an "outsider" or "threat." It risks becoming insular.

  **Addressing Your Specific Questions:**

  1.  **What theory does the practice presuppose?** Your practice blends elements of all three, but leans most heavily on **Hypocrisy as a Standing-Defeater** and **Pragmatics of Solidarity**. The core intuition is that landlords, *by virtue of their role and interests*, are in a fundamentally compromised normative position regarding tenant struggles ("You don't get to tell us how hard to push [on your own class]"). The councilmember lacks this inherent conflict.
  2.  **Sincerity, Reliability, or Normative Relation?** It's primarily about **normative relation** (the landlord is part of the system being fought) and **pragmatic consequences** (allowing their input harms solidarity). Sincerity is often doubted *because* of their normative position, and unreliability is assumed *because* of their conflicting interests. But the *primary* trigger is the identity/role itself as representing the opposition.
  3.  **Is the practice stable? Can it avoid sliding into ad hominem?** This is the **crucial challenge**. The practice *is* inherently unstable without clear guardrails and risks sliding into:
      *   **Purely identity-based dismissal:** "You're an X, therefore your argument is invalid."
      *   **Suppressing internal dissent:** Labeling any member advocating caution as having "landlord sympathies."
      *   **Missing valid critiques:** Dismissing good points because they come from a tainted source.

  **How to Mitigate Instability and Increase Legitimacy:**

  1.  **Shift the Focus from Identity to *Relevant Conflict of Interest*:** Instead of "You're a landlord, shut up," articulate: "Your position as a landlord creates a direct financial and class interest in weakening tenant resistance. How do you address this conflict when giving us tactical advice on fighting landlords?" This forces the *reason* for skepticism into the open and allows (however unlikely) for a response. Apply the same scrutiny to *anyone* with a clear, relevant conflict (e.g., a tenant rep paid by the landlord association).
  2.  **Separate "Standing" from "Epistemic Consideration" (When Possible):** Acknowledge the standing issue ("As a landlord, you lack the standing to tell oppressed tenants how hard to fight their oppressors") but add, "*However*, let's examine the tactical argument you made on its own merits: [restate argument]. Does anyone see validity in this *despite* the source?" This is hard, but prevents automatically discarding potentially useful ideas. The councilmember's argument gets considered *because* she passes the initial standing/reliability check.
  3.  **Define "Ally" More Rigorously:** What constitutes genuine alignment? Past actions? Lack of conflicting material interests? Public commitments? Having clearer (though never perfect) criteria for whose advice gets a reliability "benefit of the doubt" (like the councilmember) helps.
  4.  **Focus on Interests:** Explicitly discuss: "Whose interests does this proposed tactic serve? Does it primarily advance tenant power and goals, or does it primarily serve to protect landlord profits/convenience/stability?" Frame the tactical debate around this question. The landlord's argument fails this test immediately in the eyes of the group. The councilmember's argument is evaluated based on whether it seems aimed at genuine tenant victory.
  5.  **Maintain a Core Commitment to Argumentative Merit (As an Aspiration):** While source filtering is a practical reality, explicitly value the goal of evaluating arguments based on evidence and logic *where possible*. Remind the group that even adversaries can sometimes be accidentally right, and allies can be wrong. Guard against dismissing *internal* criticism via guilt-by-association ("That sounds like what a landlord would say!").

  **Conclusion:**

  Your union's practice rests on a powerful, intuitively compelling blend of the **normative claim that hypocrites (or class adversaries) lack standing to criticize** and the **pragmatic need to protect solidarity and focus**. It's not *solely* about sincerity or epistemic reliability, though those are factors. The key distinction between the landlord and the councilmember is the perceived **alignment of fundamental interests**: the landlord is seen as inherently having interests opposed to the tenants' struggle, while the councilmember is seen as an ally whose interests (political, ethical) align with it.

  The practice is **inherently unstable** and carries significant risks of unfairness, insularity, and strategic error if applied crudely or without reflection. However, it's not *necessarily* irrational or unjust. The challenge is to refine it: move from blunt identity dismissal towards a more nuanced evaluation of **relevant conflict of interest**, **demonstrated alignment**, and **argumentative merit**, while consciously guarding against the slippery slope of pure ad hominem reasoning. Articulating these principles within your union could make the practice more defensible and less prone to abuse.
