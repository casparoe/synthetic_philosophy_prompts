answer: |-
  Below is a six-case quiz designed to probe intuitions about deference to future opinions without explicitly naming philosophical positions. Each case presents a scenario with your current credence (subjective probability) and a known future credence, then asks whether you should adjust your current credence. The answer options are:  
  - **Toward**: Move your current credence closer to the future credence.  
  - **Away**: Move your current credence further from the future credence.  
  - **Leave put**: Keep your current credence unchanged.  

  ---

  ### **Quiz: How Should You Relate to Your Future Self?**  
  **Instructions**: For each scenario, select the option that best reflects what you think you *should* do with your current credence. Focus on epistemic rationality (what you *ought* to believe), not practical consequences.  

  1. **The Forgetfulness Pill**  
     You’re about to take a pill that erases one key piece of evidence. You know that after taking it, your credence in proposition A ("The economy will improve next year") will drop from 0.7 to 0.5. Your current evidence supports 0.7, but the pill will make you forget some relevant data.  
     Should you move your current credence in A…  
     ⬜ Toward 0.5  
     ⬜ Away from 0.5  
     ⬜ Leave it put (stay at 0.7)  

  2. **The Well-Informed Future Self**  
     Tomorrow, you’ll inherit a trusted friend’s research notes, giving you strictly more evidence about proposition X ("AI will achieve human-like consciousness by 2040"). You know that after reviewing the notes, your credence in X will rise to 0.9. Currently, with your limited evidence, your credence is 0.6.  
     Should you move your current credence in X…  
     ⬜ Toward 0.9  
     ⬜ Away from 0.9  
     ⬜ Leave it put (stay at 0.6)  

  3. **Drunk Overconfidence**  
     Tonight, you’ll drink heavily at a party. You know that when drunk, you’ll become wildly overconfident and believe with 0.95 credence that you can drive home safely (a rational assessment now, sober, is 0.7). Alcohol won’t give you new evidence—just irrational bravado.  
     Should you move your current credence in your ability to drive safely…  
     ⬜ Toward 0.95  
     ⬜ Away from 0.95  
     ⬜ Leave it put (stay at 0.7)  

  4. **The Corrupting Conversion**  
     You’re about to join a group that uses intense emotional rituals to instill beliefs. You currently regard these methods as epistemically corrupting (e.g., they suppress doubt). You know that after conversion, your credence in proposition Y ("Moral truth is relative") will soar to 0.99. Right now, it’s 0.3.  
     Should you move your current credence in Y…  
     ⬜ Toward 0.99  
     ⬜ Away from 0.99  
     ⬜ Leave it put (stay at 0.3)  

  5. **Dementia-Driven False Memory**  
     A doctor tells you that your early-stage dementia will later implant a vivid false memory, making you 0.98 confident in proposition Z ("You witnessed a crime on June 15"). You currently have no memory of this and assign Z a credence of 0.1.  
     Should you move your current credence in Z…  
     ⬜ Toward 0.98  
     ⬜ Away from 0.98  
     ⬜ Leave it put (stay at 0.1)  

  6. **The Ulysses Pact**  
     You know that when you’re exhausted tonight, you’ll irrationally feel certain (0.99) that quitting your job is wise. You can now precommit to a "Ulysses pact": setting an irreversible reminder that blocks impulsive actions. If you precommit, your future credence will remain at your current 0.4.  
     Should you move your current credence about quitting…  
     ⬜ Toward 0.99  
     ⬜ Away from 0.99  
     ⬜ Leave it put (stay at 0.4)  

  ---

  ### **Scoring Key**  
  **How to score**: Tally your answers for all six cases. Match your pattern to the positions below. Positions are defined by three binary splits in the logical space of deference:  
  1. **Defer to better-informed future selves?** (Yes/No)  
  2. **Defer to less-informed or irrational future selves?** (Yes/No)  
  3. **Can binding constrain future actions/beliefs?** (Yes/No)  

  | Position               | Defer to better-informed? | Defer to less-informed/irrational? | Binding possible? | Expected Answer Pattern                                                                 |
  |------------------------|----------------------------|-------------------------------------|-------------------|-----------------------------------------------------------------------------------------|
  | **Strict Reflection**  | Yes                        | Yes                                 | No                | **Toward** in ALL cases (defer universally, even to impaired/forgetful selves).          |
  | **Qualified Reflection** | Yes                        | No                                  | No                | **Toward** only in Case 2 (more evidence); **Leave put** in Cases 1,3,4,5,6.             |
  | **Planning View**      | No                         | No                                  | Yes               | **Leave put** in ALL cases (no deference, but binding in Case 6 is rational).            |
  | **Presentism**         | No                         | No                                  | No                | **Leave put** in ALL cases (current self is sovereign; binding is irrelevant to beliefs). |

  #### **Notes on the Logical Space**:  
  - **Unoccupied Combinations**:  
    - *Defer only to irrational/less-informed selves?* (e.g., Yes to split 2, No to split 1): Not a coherent position—why trust impaired selves but not better-informed ones?  
    - *Defer universally + binding possible?*: Redundant—if you always defer, binding adds nothing.  
    - *Defer to better-informed + binding?*: Tension—binding overrides future deference, so these conflict.  
  - **Indistinguishable Positions**:  
    - Planning View and Presentism both answer **Leave put** in all cases here. They *can* be separated by asking about **binding actions** (e.g., "In Case 6, should you set the Ulysses pact?" → Planning says yes; Presentism says no). But this quiz focuses on *credence changes*, not actions.  
  - **Why Cases 2 and 6 Matter**:  
    - Case 2 (more evidence) separates Strict/Qualified Reflection from Planning/Presentism.  
    - Case 6 (Ulysses pact) tests if binding affects current beliefs (it doesn’t in any position).  

  #### **Interpret Your Results**:  
  - If you answered **Toward in all cases**: You endorse **Strict Reflection**. You defer to future selves regardless of impairments.  
  - If you answered **Toward only in Case 2**: You endorse **Qualified Reflection**. You defer only to rational, better-informed future selves.  
  - If you answered **Leave put in all cases**:  
    - You *might* be **Planning View** (binding is valid for actions, but beliefs shouldn’t defer) or **Presentism** (only current beliefs matter).  
    - *To distinguish*: Ask yourself: "In Case 6, is precommitting to the Ulysses pact rational to prevent future errors?" Yes → Planning; No → Presentism.  

  This quiz captures core tensions in Bayesian epistemology: Should future selves be "advisors"? When is it rational to distrust or constrain them? The cases avoid naming principles directly to reveal intuitive commitments.
