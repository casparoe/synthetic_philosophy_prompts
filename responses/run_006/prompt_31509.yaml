answer: |-
  You've hit on two **fundamental and deeply interrelated paradoxes** at the heart of nuclear deterrence theory, both stemming from the unique properties of these weapons. They absolutely have established names and framings, though the second one is sometimes discussed under broader concepts. Here's the carving:

  1.  **Your First Pattern: The Stability-Instability Paradox**
      *   **Name:** This is the canonical name, coined by **Glenn Snyder** in his seminal 1965 article "The Balance of Power and the Balance of Terror" and elaborated in his book *Deterrence and Defense*.
      *   **Core Idea:** Mutual possession of survivable second-strike capabilities (Mutual Assured Destruction - MAD) creates strategic stability at the *nuclear level* by making deliberate nuclear war irrational. However, this very stability *lowers the perceived risk* of escalation to nuclear war for *lower-level conflicts*. Consequently, adversaries feel *more* freedom to engage in conventional warfare, proxy conflicts, coercive diplomacy, and probing actions ("salami slicing") below the nuclear threshold.
      *   **Mechanism:** The fear of uncontrollable escalation that *could* lead to nuclear war is mitigated by the underlying belief that both sides have a supreme interest in avoiding that outcome. This creates a "cushion" or "buffer zone" for non-nuclear competition. Each side calculates that the other won't escalate to nuclear weapons over a minor provocation precisely *because* the consequences are so catastrophic and mutual. This emboldens them to push harder in the non-nuclear realm.
      *   **Key Scholars:** Glenn Snyder, Thomas Schelling, Robert Jervis. Jervis's *The Meaning of the Nuclear Revolution* is a key text exploring its implications.
      *   **Examples:** The Cold War (Korea, Vietnam, Afghanistan, numerous crises), Indo-Pakistani conflicts post-nuclearization (Kargil War).

  2.  **Your Second Pattern: The Credibility-Control Dilemma (or Schelling's "Threat That Leaves Something to Chance")**
      *   **Names:**
          *   **Schelling's "Threat That Leaves Something to Chance":** This is the most precise and powerful conceptualization, developed by **Thomas Schelling** in *The Strategy of Conflict* (1960) and *Arms and Influence* (1966). He argued that a purely rational, fully controlled actor cannot credibly threaten massive retaliation for minor provocations (like invading an ally) because carrying it out would be suicidal. Credibility requires introducing an element of *risk*, *uncertainty*, or *irrationality* – essentially, relinquishing some control and letting fate (or lower-level actors/processes) play a role.
          *   **Credibility-Control Dilemma/Trade-off:** This is a common, more descriptive label capturing the core tension: measures taken to *enhance* the credibility of deterrence threats inherently *increase* the risk of accidental, unauthorized, or unintended nuclear use.
          *   **The "Always/Never" Dilemma:** Sometimes used within military/operational circles: How do you ensure weapons are *always* available and ready to retaliate if attacked (credibility), but *never* used accidentally, prematurely, or without proper authorization (safety/control)?
      *   **Core Idea:** As you perfectly described, pure rationality undermines deterrence credibility for anything less than an existential threat. To make threats credible, states adopt strategies that involve:
          *   **Delegation:** Pre-delegating launch authority to commanders in the field (e.g., during crises, if communication is lost).
          *   **Prompt Launch Postures:** High alert levels, short decision times, launch-on-warning policies that compress decision-making, increasing the chance of error.
          *   **Tying Hands:** Public pronouncements ("We will use nukes if X happens"), alliance commitments (NATO nuclear sharing), or legislative actions that make backing down politically costly.
          *   **Automated Systems:** Systems designed to ensure retaliation even if command is destroyed, but which could malfunction or be hacked.
      *   **The Paradox:** Each mechanism designed to bolster credibility by limiting rational choice *ex ante* simultaneously increases the probability of irrational or catastrophic nuclear use *ex post*.
      *   **Key Scholars:** Thomas Schelling (foundational), Herman Kahn (explored operational aspects), Scott Sagan (critically analyzed organizational pathologies and accident risks in *The Limits of Safety*).

  **Addressing Your Core Questions:**

  1.  **Is the second just the general problem of making a commitment credible?**
      *   **Yes, but Nuclear Weapons are Structurally Different:** The *general* commitment problem (e.g., burning bridges, staking reputation) applies. However, nuclear weapons introduce **qualitative differences**:
          *   **Uniquely Catastrophic Consequences:** A single failure of control has existential implications, unlike most other commitments. The stakes are orders of magnitude higher.
          *   **Speed and Irreversibility:** Nuclear escalation can happen incredibly fast (minutes), leaving little room for correction. Once launched, weapons cannot be recalled.
          *   **The "Rationality of Irrationality":** Schelling's core insight is that nuclear deterrence *requires* the *deliberate* cultivation of risk and uncertainty to function for non-existential threats. This strategic embrace of potential irrationality/loss-of-control is unique to existential threats like nuclear war.
          *   **Organizational Complexity:** Maintaining credible nuclear deterrence involves vast, complex organizations (military, command & control systems) prone to accidents, miscommunication, and bureaucratic pathologies (Sagan's key point), adding layers of risk beyond simple commitment devices.

  2.  **Is the first pattern (Stability-Instability) downstream of the second (Credibility-Control)?**
      *   **They are Deeply Intertwined and Mutually Reinforcing, but Not Strictly Downstream:**
          *   **The Link:** The *Stability-Instability Paradox* fundamentally *depends* on the *perceived credibility* of nuclear escalation threats, even if limited. If there were no perceived risk of escalation (i.e., if nuclear threats were seen as *completely* incredible or controllable for small conflicts), then the "instability" part wouldn't hold – pushing red lines would carry *less* inherent risk. The mechanisms Schelling identified (risk, loss of control) are what *generate* the residual fear of escalation that both *enables* the strategic stability *and* makes the lower-level probing/proxy wars seem "safer" relative to the nuclear alternative.
          *   **Distinct Causes:** However, they also have distinct roots:
              *   *Stability-Instability* arises primarily from the **existential nature of nuclear war** under MAD and the rational calculation that *neither* side wants it, creating space below.
              *   *Credibility-Control* arises from the **fundamental tension between rational self-preservation and coercive threat-making**, amplified by the catastrophic consequences and speed of nuclear weapons.
          *   **Mutual Reinforcement:** The measures taken to resolve the Credibility-Control Dilemma (like delegation, high alert) *directly fuel* the Stability-Instability Paradox by making escalation seem more plausible/risky (enabling the "stability") and thus making lower-level conflict seem *relatively* safer (enabling the "instability"). Conversely, the existence of lower-level conflicts (instability) creates the very scenarios where the Credibility-Control Dilemma becomes most acute (e.g., during a proxy war crisis).

  **In Summary:**

  *   **Pattern 1:** **Stability-Instability Paradox** (Snyder). MAD stabilizes the nuclear level but destabilizes the sub-nuclear level.
  *   **Pattern 2:** **Credibility-Control Dilemma / Schelling's "Threat That Leaves Something to Chance"**. Making nuclear threats credible requires sacrificing some control, increasing accident/error risk.
  *   **Relationship:** They are distinct but deeply interconnected paradoxes inherent to the nuclear revolution. The Credibility-Control Dilemma provides a crucial *mechanism* that helps *sustain* the Stability-Instability Paradox by making the threat of escalation feel real enough to deter direct nuclear war but also risky enough to discourage escalation over small conflicts. Both are essential for understanding the complex and dangerous dynamics of nuclear-armed competition.

  Your intuition that these are core, named paradoxes is spot-on. Schelling and Snyder are the essential starting points. For the Credibility-Control Dilemma's operational realities and risks, Sagan's *The Limits of Safety* is indispensable. Understanding how these two paradoxes interact is central to any sophisticated analysis of nuclear deterrence in practice.
