prompt: |-
  I'm in a philosophy of mind reading group and we've been going back and forth on cognitive penetration of perception for three weeks now — we've read some Pylyshyn, some Siegel, some Firestone and Scholl — and I still can't figure out what my actual credence is. The basic question is whether what you believe, desire, or expect can literally change what you see, not just how you interpret it after the fact. So the expert birdwatcher who knows exactly what to look for: does she literally have a different visual experience of the warbler, or does she see the same thing as a novice but just notice and categorize it differently? What about the claim that racial stereotypes can make someone perceive a face as angrier than it is, or that thinking bananas are especially yellow makes them look yellower?

  I want a number. What's your credence that cognitive penetration of perception is a real and widespread phenomenon — not just a rare lab curiosity, but something that happens in ordinary perception outside the lab? But I don't just want the number, I want the decomposition. What are the main sub-questions your credence rides on? For instance: (a) how much of the empirical evidence for penetration survives the best debunking arguments (the criterion problem, alternative explanations in terms of attention, memory, or judgment)? (b) how much turns on whether there's a principled way to draw the perception/cognition distinction at all? (c) how much on whether early vision is modular in roughly Fodor's sense? (d) how much on whether the effects, even if real, are big enough to matter for epistemology or ethics? Give me a rough probability for each term, a one-line justification, and how they combine. Then tell me which piece you're least confident about and what kind of evidence would shift it most.
