answer: |-
  Here’s a targeted Q&A prep sheet for your talk, prioritizing objections you’re likely to face from this audience. I’ve ranked objections by damage potential, included phrasing styles your colleagues might use, and flagged contested vs. settled issues. The "dreaded question" is #1.

  **Key Settled vs. Contested Terrain**  
  - **Settled**: Hypocrisy *undermines credibility* and makes blame *prima facie unfair/rude*.  
  - **Contested**: Whether hypocrisy invalidates blame *as a normative speech act* (your view), or merely makes it *imprudent/uncharitable* (Kantian/Strawsonian pushback).  

  ---

  ### **Top Objections & Replies**  
  **#1: The Kantian Nuclear Option (Most Damaging)**  
  *Phrasing:* "Surely the moral truth of the criticism is independent of the blamer’s history. If I steal and condemn your theft, my blame is *still valid* because the norm against theft holds objectively. Aren’t you conflating the *content* of blame with the *character* of the blamer?"  
  *Your 2-Minute Reply:*  
  > "You’re right that the *wrongdoing* I committed is real regardless of who points it out. But blame isn’t just a truth-claim—it’s a *second-personal demand* for accountability (Darwall 2006). Hypocrisy violates the reciprocity this demand presupposes: you can’t claim the authority to hold others accountable while exempting yourself. Like a corrupt judge losing jurisdiction, your moral standing to *enforce* the norm collapses. The content is true, but the act of blaming is hollow."  
  *Soft Spot:* Concedes moral facts are objective but struggles to prove why *enforcement authority* isn’t merely pragmatic. Kantians may insist blame’s force derives from the law, not the enforcer.  

  **#2: Strawsonian "Reactive Attitudes" Challenge**  
  *Phrasing:* "On Strawson’s view, blame is about holding others to shared expectations in a moral community. Why can’t a hypocrite still *feel* resentment? And if their blame *moves* the blamed person (e.g., elicits guilt), hasn’t it functionally succeeded?"  
  *Your 2-Minute Reply:*  
  > "Strawson is right that blame expresses reactive attitudes, but those attitudes depend on *mutual recognition* of moral community membership. Hypocrites, by their own actions, reject the norms they invoke, placing themselves outside that community *with respect to this norm*. Their 'resentment' is thus more like *hypocritical outrage*—it lacks the moral intelligibility of genuine holding-to-account. Even if it provokes guilt, that’s psychological manipulation, not normative blame."  
  *Soft Spot:* If the audience grants that blame’s success is *defined* by its social effect (e.g., eliciting guilt), your "misfire" claim looks descriptive, not normative.  

  **#3: The Semantics of Presupposition Failure**  
  *Phrasing:* "You analogize to promise misfires, but in presupposition failure (e.g., 'My unicorn is hungry'), the utterance is *defective* because it asserts a falsehood. Hypocrisy doesn’t falsify the norm—so how is presupposition *failed*?"  
  *Your 2-Minute Reply:*  
  > "The failed presupposition isn’t the norm’s validity, but the *blamer’s authority to invoke it communicatively*. Just as 'I promise' presupposes my intention to act, 'You ought not φ' presupposes my own commitment to not-φ-ing (or my repentant stance if I did). Hypocrisy makes this *authoritative commitment* false, rendering the speech act 'infelicitous' (Austin 1962)—like a judge ordering silence while shouting."  
  *Soft Spot:* Heavy lifting on "authority" as a linguistic presupposition. Might feel ad hoc without robust semantic literature.  

  **#4: The Tu Quoque "Distraction" Argument**  
  *Phrasing:* "Even if hypocrites lack standing, isn’t focusing on *their* flaws a diversion? The real issue is whether the blamed person did wrong. Shouldn’t we 'separate the message from the messenger' to avoid moral evasion?"  
  *Your 2-Minute Reply:*  
  > "Agreed—the wrongdoing remains. But *blame* is more than a truth-report; it’s a call to repair relationships. Hypocrisy corrupts that function by shifting focus to the blamer’s integrity (as we’re doing now!). Valid blame requires clean hands not for truth-telling, but for its role in moral repair. We *should* discuss the wrongdoing—but not via hypocritical blame."  
  *Soft Spot:* Implies hypocritical blame is "corrupting" but doesn’t prove it’s *inherently* defective vs. merely distracting.  

  **#5: The Senior Colleague’s Probable Jab**  
  *Phrasing (smirking):* "So if I’ve made past mistakes, I’m forever disqualified from pointing out *your* errors? That sounds convenient for the blame-averse."  
  *Your 2-Minute Reply:*  
  > "Not at all. Standing can be *restored* through repentance, apology, and changed behavior. The issue isn’t past flaws—it’s *unrepentant hypocrisy*: condemning others while ignoring your own violations. If you’ve addressed your past, your standing is intact. But unaddressed hypocrisy makes blame a weapon, not a tool of justice."  
  *Soft Spot:* Risks sounding personal. Emphasize *structural* criteria for standing (repentance, consistency) to avoid ad hominem.  

  ---

  ### **The Dreaded Question**  
  **#0: The Normative Authority Trap**  
  *Phrasing (likely from a Kantian):* "If a serial killer says 'murder is wrong,' is their statement false? No. Likewise, if they blame a murderer, isn’t the blame *correct* even if they’re monstrous? Your view seems to reduce morality to the speaker’s virtue."  
  *Why It Sinks You:* Forces you to deny blame’s truth-aptness or concede that standing doesn’t affect its core validity.  
  *Your 2-Minute Reply:*  
  > "The serial killer’s statement is *true*, and their victim *is* blameworthy. But *blaming* isn’t stating a fact—it’s exercising moral authority. A serial killer has *forfeited* any right to make moral demands of others; their 'blame' is just words without normative force. We might agree with the content while rejecting *their act* of blaming as illegitimate. This doesn’t reduce morality to virtue—it distinguishes *moral truth* from *moral agency*."  
  *Soft Spot:* Hard to prove "normative force" isn’t just psychological. Lean on Darwall: "Second-personal reasons require second-personal competence."  

  ---

  **Strategic Tips**  
  1. **Pre-empt the Kantians**: Open by granting moral objectivity ("The norm is real, but...").  
  2. **Cite Your Allies**: Use Shoemaker (2019) on "answerability" and Bell (2013) on hypocritical blame’s expressive power.  
  3. **Flag Live Debates**: "Where I depart from Wallace/Scanlon is..."  
  4. **Senior Colleague Comms**: If he speaks, reply with icy professionalism: "This isn’t about past actions per se, but about whether *ongoing, unaddressed* hypocrisy undermines the structure of moral address."  

  You’ve got a tight case—just don’t overclaim. Good luck!
