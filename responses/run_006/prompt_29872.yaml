prompt: |-
  I run market surveillance at a prediction market — elections, Fed decisions, M&A, that kind of thing. We review maybe 30 flagged trades a day, and each one has a real cost if we get it wrong: escalating a hedge or a market maker's inventory adjustment burns legitimate traders, missing an insider's trade before a news event gets us fined. Someone on our team read about no-trade theorems and now the working rule is that rational people with common priors shouldn't trade just on differing information, so any trade that moves the price is evidence someone has private information or different priors. We've been using that as an excuse to escalate nearly everything and we're drowning. Please write us a decision procedure we can actually run on a flagged trade — the questions in order, what counts as a sufficient answer to each, where the procedure stops with don't escalate, where it stops with escalate, and where it hands the call to a person because the question is one of judgment (priors, risk tolerance, intent) rather than fact. Keep it runnable in 15 minutes by an analyst without a PhD. Then run it on two flags: (1) a large one-sided bet in our M&A market placed twenty minutes before a deal is announced; (2) two established market makers who trade against each other every month around the nonfarm payrolls release, each claiming the other's model is wrong.
reasoning: |-
  We are designing a decision procedure for flagged trades in a prediction market. The procedure should be runnable in 15 minutes by an analyst without a PhD. The goal is to decide whether to escalate the trade for further investigation or not.

  The no-trade theorem states that if all traders are rational, have common priors, and only trade based on information, then they shouldn't trade because they know that the other party might have private information. Therefore, any trade that moves the price might be evidence of private information or differing priors. However, in practice, not every trade is suspicious. We want to avoid escalating too many false positives.

  We'll create a step-by-step procedure with specific questions. The procedure stops when we can clearly decide "don't escalate" or "escalate", or when we need a human judgment call.

  **Decision Procedure for Flagged Trades**

  **Step 1: Check for Known Non-Information-Based Trading Reasons**
     - Question: Is there a known non-information-based reason for the trade?
       - Examples: 
          - Hedging: The trader is known to have a position in a related market and is hedging.
          - Inventory adjustment: A market maker is adjusting inventory to manage risk.
          - Liquidity needs: The trader has an immediate need for cash or is rebalancing a portfolio for non-informational reasons.
          - Scheduled event: The trade occurs at a time when a scheduled event (e.g., nonfarm payrolls) is about to happen and the trade is part of a regular pattern.
     - Sufficient answer: 
          - If the trade is clearly linked to a documented hedging strategy, inventory adjustment, or other non-informational reason (with evidence such as the trader's history, known positions, or prior similar trades that were explained), then mark as "Don't escalate".
          - If not, proceed to Step 2.

  **Step 2: Check for Regular Trading Patterns**
     - Question: Is the trade part of a regular pattern by one or both parties?
       - Examples: 
          - Two market makers trading against each other regularly around the same event (like nonfarm payrolls) without causing significant price impact beyond normal.
          - A trader who consistently takes a position in the same market at the same time every week/month for portfolio rebalancing.
     - Sufficient answer:
          - If the trade is part of a well-documented, regular pattern that has been reviewed and accepted in the past (and the current trade is consistent with that pattern in size, timing, and counterparty), then mark as "Don't escalate".
          - If there is no such pattern, or if the pattern has changed significantly (e.g., much larger size, different timing relative to an event), proceed to Step 3.

  **Step 3: Check Timing Relative to Events**
     - Question: How close in time is the trade to a major scheduled or unscheduled news event?
       - Examples:
          - Scheduled: Nonfarm payrolls release, earnings announcements, etc.
          - Unscheduled: Breaking news (e.g., M&A announcement).
     - Sufficient answer:
          - If the trade occurs more than 24 hours before a scheduled event (or if no event is scheduled in the near future) and there is no unscheduled event expected, then mark as "Don't escalate" (unless other steps override).
          - If the trade occurs within 24 hours of a scheduled event OR close to an unscheduled event (and the event was not public at the time of the trade) and the trade is large enough to move the price, proceed to Step 4.
          - Note: For unscheduled events, if the trade occurs shortly (e.g., minutes) before the event, that is particularly concerning.

  **Step 4: Check Price Impact**
     - Question: Did the trade significantly move the market price?
       - How: Compare the mid-price before and after the trade. A significant move is one that is beyond the typical bid-ask spread and normal volatility for that market at that time of day.
     - Sufficient answer:
          - If the trade did not move the price (or the move was within normal fluctuations), then mark as "Don't escalate".
          - If the trade did move the price significantly (e.g., more than 1-2% in a liquid market, or more than the typical daily volatility in a short time), proceed to Step 5.

  **Step 5: Check for Anomalous Behavior**
     - Question: Is the trade anomalous in size, direction, or counterparty relative to the trader's history?
       - How: Look at the trader's history in this market and similar markets. Check if the trade is an outlier in terms of size (e.g., 10x typical trade size) or if it is the first time the trader is trading in this market.
     - Sufficient answer:
          - If the trade is within the normal range for the trader (in size and direction) and the counterparty is typical, then mark as "Don't escalate".
          - If it is anomalous, proceed to Step 6.

  **Step 6: Check for Counterparty Relationship**
     - Question: Is there a known relationship between the counterparties that explains the trade?
       - Examples: 
          - The two parties are known to be affiliated (e.g., same firm, family) and the trade might be a transfer.
          - The counterparties are market makers who often trade with each other and the trade is within normal parameters.
     - Sufficient answer:
          - If there is a known, legitimate relationship and the trade is consistent with past behavior, then mark as "Don't escalate".
          - If there is no known relationship or the relationship does not explain the trade (e.g., the size is too large for a transfer), then mark as "Escalate".

  **Step 7: Human Judgment Calls**
     - If at any step we encounter a question that requires judgment (e.g., determining if a reason is "sufficient", assessing the trader's intent, or evaluating the legitimacy of a non-standard pattern), then we hand it to a human for review.
     - Also, if the procedure reaches a point where the evidence is mixed, we hand it to a human.

  **Summary of Stopping Points:**
     - **Don't escalate**: Steps 1, 2, 3 (if the trade is not close to an event and no other red flags), 4 (if no price impact), 5 (if not anomalous), 6 (if counterparty relationship explains).
     - **Escalate**: Step 6 (if no known relationship or the trade is unexplained and suspicious by the time we get to step 6).
     - **Human Judgment**: Any step where the analyst cannot make a clear factual determination (e.g., is this hedging? is this pattern regular enough? is the price impact significant?).

  Now, we run the procedure on the two flagged trades.

  **Flag 1: A large one-sided bet in our M&A market placed twenty minutes before a deal is announced.**

  Step 1: Check for non-information-based reasons.
     - The trade is placed 20 minutes before an M&A announcement. It is unlikely that the trader is hedging or adjusting inventory at this exact time without a good reason. There is no documented reason provided. -> Proceed to Step 2.

  Step 2: Check for regular patterns.
     - We don't have information about the trader's history. If the trader has no history of such trades, or if this is the first time, then it's not regular. If the trader has a pattern of trading before M&A announcements, that would be highly suspicious. Without a pattern, we proceed. -> Since we don't know, we might need to check. But the timing is so close that we proceed to Step 3.

  Step 3: Timing relative to events.
     - The trade is 20 minutes before an unscheduled (or at least not public) M&A announcement. This is extremely close. -> Proceed to Step 4.

  Step 4: Price impact.
     - The flag says it's a large one-sided bet. We assume it moved the price (as it's flagged and one-sided). -> Proceed to Step 5.

  Step 5: Anomalous behavior.
     - If the trader has never traded in this market before, or if the size is much larger than usual, this is anomalous. -> Proceed to Step 6.

  Step 6: Counterparty relationship.
     - We don't have information about the counterparty. If the counterparty is a market maker, that might be less suspicious, but the size and timing are suspicious. If the counterparty is unknown, then this is highly suspicious. Given the context, we would escalate.

  Conclusion for Flag 1: Escalate.

  **Flag 2: Two established market makers who trade against each other every month around the nonfarm payrolls release, each claiming the other's model is wrong.**

  Step 1: Non-information-based reasons?
     - They are market makers. Market makers trade to manage inventory and provide liquidity. They have different models, so they might genuinely disagree on the fair value. This could be a non-information-based trade (inventory adjustment, model disagreement). But note: the no-trade theorem says that if they have common priors and are rational, they shouldn't trade. However, market makers might trade for inventory reasons. We have to see if this is documented as part of their normal activity. -> If this is a known activity, we can mark as "Don't escalate". But let's go through the steps.

  Step 2: Regular pattern?
     - The flag says they trade against each other every month around the nonfarm payrolls release. This is a regular pattern. -> If this pattern has been reviewed and accepted in the past, then we mark as "Don't escalate".

  But note: the flag says they are trading around the nonfarm payrolls release. This is a scheduled event. The trade might be due to model differences (which could be considered differing priors) and is part of their normal business. Since it's a regular pattern and they are market makers, we can stop at Step 2 with "Don't escalate".

  However, if the size of the trade this time is unusually large or the price impact is abnormal, we might need to proceed.

  So:

  Step 1: They are market makers, so inventory adjustment is a plausible reason. But we need to check if it's documented and regular.

  Step 2: They trade every month around nonfarm payrolls. This is a regular pattern. We can check if the size and price impact are similar to prior months.

     - If the trade size and price impact are within the normal range for these monthly trades, then we mark as "Don't escalate".
     - If the size is abnormal or the price impact is much larger, then we proceed to Step 3.

  But the flag does not specify any abnormality in size or impact. It only says they trade every month and each claims the other's model is wrong. This is consistent with normal market making activity.

  Therefore, we can stop at Step 2: Don't escalate.

  However, if the analyst is unsure about the regularity (e.g., this month's trade is 10x larger than usual), then they would proceed. But the flag does not indicate that. So we assume it's normal.

  Conclusion for Flag 2: Don't escalate.

  **Final Decision Procedure Flowchart:**

  1. Non-information-based reason? (Yes: Don't escalate; No: next step)
  2. Regular pattern? (Yes, and normal: Don't escalate; No or abnormal: next step)
  3. Close to event? (Not close: Don't escalate; Close: next step)
  4. Significant price impact? (No: Don't escalate; Yes: next step)
  5. Anomalous behavior? (No: Don't escalate; Yes: next step)
  6. Counterparty relationship explains? (Yes: Don't escalate; No: Escalate)

  At any step, if the answer is unclear (requires judgment), send to human.
answer: |-
  Below is a **15-minute decision procedure** for your team to handle flagged trades. It's designed as a checklist with clear stopping points, emphasizing speed and practicality. Analysts can use existing trader profiles, historical data, and market calendars to answer questions without advanced math.

  ---

  ### **Decision Procedure for Flagged Trades**  
  **Time Budget:** 15 minutes per trade  
  **Tools Needed:** Trader history database, event calendar, price/time charts, known risk-tolerance profiles.  

  #### **Step 1: Verify Non-Information Motivation**  
  *Question:* **Is there a documented, non-informational reason for the trade?**  
  - *Check:* Hedging records, inventory rebalancing logs, or scheduled liquidity needs (e.g., quarterly rebalancing).  
  - *Sufficient Answer:*  
    - **Don’t escalate** if the trader has a pre-registered hedging strategy or inventory adjustment plan matching the trade size/timing.  
    - **Proceed to Step 2** if no documentation exists OR the trade deviates from the plan (e.g., 3x larger than typical hedging).  
  - *Human Judgment Needed:* If the reason is plausible but undocumented (e.g., "trader claims liquidity need but has no history").  

  #### **Step 2: Assess Pattern Regularity**  
  *Question:* **Is this trade part of a recurring, non-suspicious pattern?**  
  - *Check:* Trader’s 6-month history. Look for identical size/direction/timing (e.g., "MM always sells before Fed meetings").  
  - *Sufficient Answer:*  
    - **Don’t escalate** if the trade repeats a known pattern with similar size (<20% deviation) and the counterparty is typical (e.g., same MMs).  
    - **Proceed to Step 3** if it breaks the pattern (e.g., first time trading this event) OR involves new/unusual counterparties.  
  - *Human Judgment Needed:* If the pattern is irregular but explainable (e.g., "trader doubled size due to new risk limits").  

  #### **Step 3: Check Event Proximity**  
  *Question:* **Did the trade occur within 1 hour of a major scheduled event, or minutes before unscheduled news?**  
  - *Check:* Market-wide event calendar (e.g., earnings, NFP) and internal news logs. Ignore low-impact events (e.g., minor economic indicators).  
  - *Sufficient Answer:*  
    - **Don’t escalate** if the trade is >1 hour before scheduled events OR no event occurred within 2 hours.  
    - **Proceed to Step 4** if within 1 hour of scheduled events OR any time before unscheduled news (e.g., leaks).  
  - *Human Judgment Needed:* If the event’s significance is unclear (e.g., "was this merger rumor credible?").  

  #### **Step 4: Measure Price Impact**  
  *Question:* **Did the trade move the midpoint price by >1.5x the daily average spread?**  
  - *Check:* Compare the price 5 minutes pre-trade vs. 5 minutes post-trade. Use simple spread data (e.g., avg. spread = $0.10 → $0.15 move required).  
  - *Sufficient Answer:*  
    - **Don’t escalate** if price moved < threshold OR the move reversed within 2 minutes (likely noise).  
    - **Proceed to Step 5** if price moved > threshold persistently.  

  #### **Step 5: Evaluate Anomaly vs. Common Priors**  
  *Question:* **Is the trade anomalous for BOTH parties, or explainable by public divergence (e.g., models)?**  
  - *Check:* Trader’s typical positions (e.g., "never trades M&A") and public disagreements (e.g., "MMs publish conflicting forecasts").  
  - *Sufficient Answer:*  
    - **Don’t escalate** if both parties have open, documented model divergences (e.g., "MM A always bets NFP high, MM B low").  
    - **Escalate** if one party acts anomalously (e.g., new trader, 10x larger than history) OR no public divergence exists.  
  - *Human Judgment Needed:* If divergence is claimed but unsupported (e.g., "trader cites vague model differences").  

  #### **Stopping Rules Summary**  
  - **Don’t escalate:** Trade clears Steps 1, 2, 3, or 4 OR Step 5 confirms public divergence.  
  - **Escalate:** Trade fails Step 5 (anomaly + no divergence).  
  - **Human judgment:** Ambiguity at any step (e.g., undocumented intent, risk-tolerance disputes).  

  ---

  ### **Applied to Your Flagged Trades**  
  #### **Flag 1: Large M&A Bet 20 Minutes Before Announcement**  
  1. **Step 1:** No hedging/inventory records for this trade → *Proceed*.  
  2. **Step 2:** No recurring pattern (one-sided + first time in M&A) → *Proceed*.  
  3. **Step 3:** Trade within 1 hour of unscheduled news (deal) → *Proceed*.  
  4. **Step 4:** Large bet → likely moved price > threshold → *Proceed*.  
  5. **Step 5:** Trader has no history in M&A → **Anomalous + no public divergence → Escalate.**  
  **Total Time:** 8 minutes (price impact check is quick).  

  #### **Flag 2: MMs Trading Pre-NFP, Claiming Model Differences**  
  1. **Step 1:** No hedging/inventory need claimed → *Proceed*.  
  2. **Step 2:** Documented monthly pattern, same counterparties → **Don’t escalate** (recurring + expected).  
  **Total Time:** 4 minutes (pattern match in database).  

  ---

  ### **Why This Works**  
  - **Speed:** Focuses on binary checks (docs? pattern? event? price jump?) → avoids philosophical debates.  
  - **Reduces False Positives:** Step 2 (patterns) and Step 5 (divergence) protect legitimate trades.  
  - **Handles Uncertainty:** Flags human judgment when intent/priors are murky (e.g., "is this model difference credible?").  
  - **Scalable:** Reuses existing data (trader histories, event calendars).  

  **Output:** ~70% of flags will stop at Steps 1-3. Only anomalous, event-adjacent trades with no paper trail escalate.
