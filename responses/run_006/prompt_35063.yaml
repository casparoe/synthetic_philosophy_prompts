  Okay, the user is a CS major taking a philosophy of logic course and has read Carroll's "What the Tortoise Said to Achilles." They see a connection to CS concepts like interpreters, inference rules, and data versus rules. They want me to restate the tortoise problem using CS vocabulary and then analyze how well those concepts map to the philosophical problem.

