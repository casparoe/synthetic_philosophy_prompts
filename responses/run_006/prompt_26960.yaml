answer: |-
  Here’s a detailed, runnable classroom activity for the St. Petersburg paradox, designed to maximize engagement and highlight the gap between expected value and willingness to pay. The activity uses **classroom scrip** (e.g., points or fake money) for payouts and fits within 75 minutes.

  ---

  ### **Activity: St. Petersburg Auction**
  **Objective**: Force students to confront the paradox by bidding to play a coin-flip game with high variance but capped payouts.  
  **Materials**:  
  - 1 coin (or coin-flip app)  
  - Whiteboard to track flips and record bids  
  - Slips of paper for bids  
  - Envelope with "secret truncation rule" (for suspense)  
  - Classroom scrip (e.g., each student starts with 100 scrip; payouts in scrip). Scrip can convert to participation points (e.g., 10 scrip = 1 point, capped at 5 points).

  ---

  ### **Rules & Setup**  
  1. **Game Rules** (Explain to students):  
     - The game: Flip a coin until the **first tails**.  
     - Payout:  
       - Tails on 1st flip: **1 scrip**  
       - Tails on 2nd flip: **2 scrip**  
       - Tails on 3rd flip: **4 scrip**  
       - ... doubles each time.  
     - **Truncation**: Reveal an envelope with a "bank rule": "After 8 flips, the game stops. If no tails in 8 flips, payout = 256 scrip" (i.e., 2<sup>8</sup>).  
     - Emphasize: "This is a real game. One of you will play it today."

  2. **Auction Rules**:  
     - **Bidding**:  
       - Each student writes their **maximum bid** (in scrip) on a slip.  
       - Bid = "What you’d pay to play the game."  
     - **Winner Selection**:  
       - Collect bids.  
       - Highest bid wins, but they pay the **second-highest bid** (Vickrey auction to encourage truthful bidding).  
     - **Payout**:  
       - Winner pays their fee (second-highest bid) to the "bank" (teacher).  
       - Play the game; winner receives the scrip payout.  

  3. **Time Caps**:  
     - Max flips: **8** (ensures game ends quickly; average game lasts 2 flips).  
     - Total activity time: **20-25 minutes** (bidding: 5 min, auction: 5 min, gameplay: 5 min, record results: 5 min).

  ---

  ### **Step-by-Step Flow**  
  1. **Introduce the Game (5 min)**:  
     - Describe rules and payout structure. *Do not mention expected value or paradox yet*.  
     - Example: "Tails on flip 3? Win 4 scrip. Heads forever? Win 256 scrip."  
     - Give each student 100 scrip (for bidding + participation).

  2. **Bidding & Auction (10 min)**:  
     - Students write bids privately.  
     - Collect bids, announce:  
       - Highest bid (winner) and second-highest bid (price).  
       - *Example*: "Winner bid 25 scrip, pays 20 scrip (second-highest)."  

  3. **Play the Game (5 min)**:  
     - Flip coin publicly. Stop at first tails or 8 flips.  
     - Record sequence and payout on board.  
     - Winner pays fee and receives payout.  

  4. **Record Class Bids (5 min)**:  
     - Poll students: "Raise hand if you bid ≤10? ≤20? ≤30?"  
     - Write histogram of bids on board (e.g., "15 bids ≤5 scrip, 5 bids >20").  

  ---

  ### **Debrief (50 min): Map Observations to Theory**  
  Use the **board** to scaffold:  

  | **What Happened** | **Connect to Paradox** |  
  |-------------------|------------------------|  
  | **Bids were low** (e.g., most ≤20 scrip) vs. EV | **Expected Value Calculation**:  
    - Compute EV of truncated game:  
      EV = Σ [P(k) × Pay(k)] for k=1 to 8 + P(no tails) × 256  
      = (0.5 × 1) + (0.25 × 2) + ... + (0.5<sup>8</sup> × 128) + (0.5<sup>8</sup> × 256)  
      = (0.5 + 0.5 + 0.5 + 0.5 + 0.5 + 0.5 + 0.5 + 0.5) + (0.0039 × 256) ≈ **5.0 scrip**  
    - *Ask*: "Why didn’t you bid near 5 scrip? Why not 20?" → Reveals risk aversion. |  
  | **High variance** (most games pay ≤4 scrip; rare 256) | **Infinite EV as a Limit**:  
    - Show EV for higher caps:  
      Cap at 10 flips: EV = **6 scrip**  
      Cap at 20 flips: EV = **11 scrip**  
      No cap: EV = ∞  
    - *Ask*: "Would you bid 100 scrip if the cap was 20 flips? Why not?" → Highlights that low-probability extreme outcomes don’t sway decisions. |  
  | **Bank’s deep pockets** (truncation at 256 scrip) | **Real-World Constraints**:  
    - "Could a real bank offer the infinite game? Why not?" → Discuss bankruptcy risk and bounded rationality. |  
  | **Willingness-to-pay vs. EV gap** | **Decision Theory Insight**:  
    - Expected value ≠ utility. Use student quotes (e.g., "I’d never pay 10 scrip for a 50% chance of 1 scrip!").  
    - Introduce **expected utility** and **diminishing marginal utility** as solutions. |  

  ---

  ### **Pitfalls & Solutions**  
  1. **"Someone bids sky-high because math"**:  
     - **Why**: A student might bid 50+ scrip, citing "infinite EV."  
     - **Fix**:  
       - **Pre-empt it**: Before bidding, say: "Think: Would you stake a month’s rent on this game? Why/why not?"  
       - **Leverage it**: If it happens, use it in debrief: "Math says EV is infinite, but did most of you act that way? Why?"  

  2. **Low bids make auction "boring"**:  
     - **Why**: Risk-averse students bid low (e.g., ≤5 scrip), making the auction seem trivial.  
     - **Fix**:  
       - **Frame payouts relatively**: "100 scrip = 5 participation points. Winning 256 scrip = max points."  
       - **Use the bid spread**: Even if bids are low, contrast them with EV (e.g., "EV was 5 scrip, but 80% of you bid ≤3!").  

  3. **Activity can’t reproduce key paradox elements**:  
     - **Unbounded payouts**: Students won’t experience "infinite EV" psychologically.  
       - *Mitigation*: Use the cap increase in debrief to show convergence.  
     - **Probability weighting**: Students underestimate extreme outcomes (e.g., 256 scrip feels impossible).  
       - *Mitigation*: After the game, calculate: "We had a 0.4% chance of 256 scrip—did anyone *really* expect it?"  

  ---

  ### **Why This Works**  
  - **Experiential gap**: Students *feel* the reluctance to bid high despite EV calculations.  
  - **Truncation as feature**: The cap makes the game runnable while the debrief extends it to the infinite case.  
  - **Auction psychology**: The Vickrey auction reduces game-theoretic bidding, revealing true valuations.  

