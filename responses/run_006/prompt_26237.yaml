prompt: |-
  Okay so I've gotten myself into a bit of a situation. A few months ago I was at a party and somehow ended up in one of those conversations where you're three drinks in and someone says "but could you have been born a different person?" and suddenly it's 2am and you're googling David Lewis on your phone. I got kind of obsessed. I've been reading about possible worlds and modal realism and all of it, and I mentioned this to a friend who runs a philosophy reading group for interested non-specialists — mostly people with humanities backgrounds but no formal philosophy training. And now, because I opened my mouth, I'm supposed to lead the session on counterpart theory vs. transworld identity next month.

  The group has already done one session on possible worlds talk in general — they get the basic idea that "necessarily P" means "P in all possible worlds" and "possibly P" means "P in some possible world." They've also read the first few sections of Lewis's "Counterpart Theory and Quantified Modal Logic" but most of them found it pretty opaque. They're smart but they're not going to read the primary texts closely; they rely on the discussion to make things click.

  Here's what I need from you, acting as an expert philosophy teacher who's taught this material before: a teaching plan for a 75-minute session. Don't explain the material to me — I think I understand it, or at least I understand it well enough to be dangerous. What I need is the architecture of the explanation. What has to go first, and why? What's the one example or case that should carry the whole thing — and what does it need to have and what must it not have? (I was thinking of using "I could have been a plumber" but maybe that's got problems I'm not seeing.) What misconceptions are they going to walk in with, and which ones will they form halfway through, and at exactly what point in the sequence should I head each one off? I'm especially worried about the sci-fi reading of possible worlds — people thinking we're talking about parallel universes you could hop between — and also about the intuition that counterpart theory is just a cheap verbal trick that changes the subject. And I need a check for understanding at the end: one question or exercise that would tell me whether they actually got the distinction or just nodded along.

  Oh, and please flag anything I should openly refuse to explain at this level — things where going deeper would just confuse everyone. I'd rather say "we're not going there tonight" than give a garbled half-answer. Please think through this carefully — I need the dependancy structure and the misconception map, not just a list of topics. And write the whole thing in American English.
reasoning: |-
  Okay, the user is in a tricky spot. They volunteered to lead a philosophy discussion on counterpart theory vs transworld identity for non-specialists after getting obsessed with David Lewis post-party. They need a structured teaching plan, not content explanation. 

  First, let's unpack their real needs. The surface request is for a lesson architecture, but the underlying anxieties are clear: they're worried about facilitating a conceptually dense topic for beginners who found Lewis opaque. The unspoken fear is looking foolish in front of peers. Key pressure points: preventing sci-fi misinterpretations, avoiding the "verbal trick" dismissal, and knowing where to deliberately not go deep.

  Hmm, their plumber example instinct is good but needs refinement. The core example must satisfy three criteria: 1) relatable (personal identity), 2) demonstrate necessity of counterparts (clear divergence point), 3) avoid sci-fi triggers (no "hopping" suggestions). "I could have been a plumber" works if we immediately amputate the sci-fi limb - maybe emphasize no physical travel between worlds.

  Biggest landmines to defuse upfront: 
  - Misconception 1: Possible worlds as parallel universes (must kill this in minute 5)
  - Misconception 2: Counterparts are "alternate mes" (Lewis hates this)
  - Misconception 3: This is all just semantic gymnastics (need concrete payoff)

  The dependency structure is non-negotiable: Must build from Kripkean intuitions before showing why they break. Start with transworld identity because it's intuitive, then introduce the problems (Chisholm's Paradox), then position counterpart theory as a solution. No shortcuts.

  For the check of understanding: Need a diagnostic question that forces application. Something like "Why couldn't Lewis have been a plumber according to each theory?" If they can articulate essence vs. counterpart relations, we're golden. If they say "because parallel universes don't work that way" - back to square one.

  Red flags where we must stop: 
  - Quantified modal logic notation 
  - Haecceitism debates 
  - Perdurantism connections 
  Say: "That's grad seminar territory" with a smile.

  Timing is tight. 75 minutes means: 
  - 15min framing & transworld 
  - 20min paradox & breakdown 
  - 25min counterpart theory & contrast 
  - 15min discussion & checkpoint

  The sci-fi risk requires constant vigilance. Every example must include the phrase "abstract representation, not physical place." Maybe ban the word "universe" entirely - use "scenario" instead.

  They'll want to jump to "but what about personal identity?" - save it for Q&A. First establish the metaphysical machinery. Personal identity debates are quicksand for beginners.

  Final thought: Emphasize this isn't about "truth" but conceptual toolkits. Disarm defenses by saying "Lewis isn't saying this is real - just that it's useful for logical coherence." Pre-empt the "cheap trick" reaction by showing the modal logic payoff upfront.
answer: |-
  Here’s a battle-tested teaching plan targeting exactly your concerns. The architecture prioritizes conceptual dependencies, preempts key misconceptions, and uses a carefully chosen central example.

  **Core Example:**  
  *"Nadia could have been a plumber."*  
  **Why it works:** Relatable (personal identity), shows contingency, avoids sci-fi triggers (no "world-hopping"), and highlights essence/counterpart distinction.  
  **Avoid:** Examples involving objects (e.g., "This table could have been made of ice") – introduces composition/essence complexities.

  **75-Minute Session Blueprint**

  **I. Groundwork & Transworld Identity (20 min)**  
  1.  **Quick Review (3 min):**  
      -   "Possible worlds = complete ways things could have been (not places!). ‘Necessary P’ = true in all worlds; ‘Possible P’ = true in at least one world."  
      -   **MISCONCEPTION HEAD-OFF (Sci-Fi):** *"Crucially, these aren’t parallel universes you can visit. They’re abstract representations of possibilities. Talking about ‘worlds’ is just a tool for thinking about modality – necessity and possibility."*  
  2.  **The Intuitive View: Transworld Identity (12 min):**  
      -   **Question:** "If Nadia could have been a plumber, what does that mean in possible worlds talk?"  
      -   **Intuitive Answer:** "It means there is some possible world where *that very Nadia* (the same person, identical to our Nadia) is a plumber."  
      -   **Key Principle:** Identity is absolute. An individual exists in multiple worlds, retaining their core identity ("transworld identity"). What changes are contingent properties (like career).  
      -   **Visual:** Imagine a single Nadia-line stretching across multiple worlds, changing outfits (properties) but being fundamentally *her*.  
  3.  **The Problem (Chisholm's Paradox) (5 min):**  
      -   **Setup:** "Suppose Nadia-in-world-W1 has 1 hair different from our-Nadia. Is it *her*? Probably yes. Now Nadia-in-W2 has 2 hairs different... W3 has 3... eventually Wn has a completely bald Nadia who was born in 1800. Is *that* still Nadia?"  
      -   **Contradiction:** Small changes seem acceptable (transitivity of identity), but large changes (or essential properties like origin) seem to break identity. Which properties define the *essence* of Nadia?  
      -   **Why This Matters:** Shows transworld identity gets messy with *essential properties*. What makes Nadia *Nadia*? Her origin? Her matter? Her psychology? Disagreement here is fatal to simple transworld identity.  
      -   **MISCONCEPTION HEAD-OFF (Verbal Trick Premature):** *"This isn't just nitpicking. If we can't consistently say what makes someone *the same person* across worlds, our whole modal logic might be on shaky ground."*

  **II. Enter Counterpart Theory (30 min)**  
  1.  **Lewis's Solution: The Core Idea (10 min):**  
      -   **Radical Shift:** "Lewis says: Forget individuals stretching across worlds! Each individual exists in *only one world*. Full stop."  
      -   **Counterpart Relation:** "When we say 'Nadia could have been a plumber,' we mean: In *some other world*, there exists an individual (Nadia's *counterpart*) who:  
          (a) *Resembles* our-Nadia significantly (in important respects – appearance, psychology, origin, etc.),  
          (b) Is a plumber in *that* world."  
      -   **Analogy:** Your passport photo is *not* you. It's a representation in a document (another "world") that resembles you closely enough for identification purposes. The counterpart is like that photo in another world.  
  2.  **Key Features & Why (15 min):**  
      -   **Similarity, Not Identity:** Stress: The counterpart is *not* Nadia. It's a distinct individual who is *like* her. ("Your twin in another world isn't you").  
      -   **Context Matters:** What counts as "significant resemblance" depends on context. For career, psychological similarity might matter most. For origin, biological similarity might dominate.  
      -   **Solves the Paradox:** In the hair-loss worlds, the individual in Wn might *not* be Nadia's counterpart (if resemblance is too weak, especially on origin). No slippery slope! Worlds are isolated; no identity line to break.  
      -   **MISCONCEPTION HEAD-OFF (Verbal Trick):** *"This isn't changing the subject! It's offering a *metaphysically precise* way to make sense of our modal talk without assuming mysterious transworld identity. It grounds possibility in concrete (per world) objects and their similarities."*  
      -   **MISCONCEPTION HEAD-OFF (Sci-Fi Revisited):** *"Counterparts aren't people you could meet. Worlds are causally isolated. Talking about counterparts is how we *represent* possibility from our perspective *within* our world."*  
  3.  **Contrast: "Nadia the Plumber" Revisited (5 min)**  
      -   **Transworld Identity:** Same Nadia, different property (career).  
      -   **Counterpart Theory:** Different individual (Nadia's counterpart), similar to our Nadia in key ways, who is a plumber.

  **III. Discussion, Nuance & Check (25 min)**  
  1.  **Pros & Cons Debate (10 min):**  
      -   **Transworld Identity (Pro):** Matches intuition ("It feels like *I* could have done that!"). (Con): Essential properties are messy/contested.  
      -   **Counterpart Theory (Pro):** Solves paradoxes, avoids essentialism, metaphysically 'cleaner'. (Con): Can feel counterintuitive ("That plumber isn't *me*!"), similarity is vague/contextual.  
  2.  **Crucial Nuance (5 min):**  
      -   **Not Either/Or:** Both are tools for interpreting modal statements. Philosophers choose based on which problems they find more pressing.  
      -   **Lewis's Motivation:** Providing a *reductive, non-modal* basis for modal logic (using only quantification, similarity, and non-modal properties *within* worlds).  
  3.  **Check for Understanding (10 min):**  
      -   **Diagnostic Question:** *"According to counterpart theory, why can't I (the actual person leading this session) have been born on Mars? According to transworld identity, what would have to be true for me to have been born on Mars?"*  
      -   **What Reveals Understanding:**  
          *   **Counterpart Theory Correct:** "Because any individual born on Mars in another world would be too dissimilar to you (especially in origin/biology) to count as your *counterpart*." (Not "Because you can't travel there!").  
          *   **Transworld Identity Correct:** "It would require *you* (the very same person) existing in that world *and* having the property 'born on Mars', meaning 'being born on Earth' isn't essential to you." (Not just "You exist there").  
      -   **Red Flags:**  
          *   "Because you'd be a different person" (Vague/misses point).  
          *   "Because the laws of physics prevent it" (Irrelevant to modality).  
          *   "Because parallel universes don't work that way" (Sci-Fi misconception).

  **What to OPENLY REFUSE (For Clarity's Sake):**  
  1.  **Quantified Modal Logic Formalism:** Don't derive or explain the `Cxy` (counterpart relation) or `Ixw` (inhabitance) predicates from Lewis's paper. Focus on the *concepts*.
  2.  **Haecceitism:** The view that individuals have primitive "thisness" (haecceity) beyond properties. This is deep metaphysics that will derail the core distinction.
  3.  **Perdurance vs. Endurance:** How objects persist *over time* is related but distinct. Don't bring in temporal parts unless explicitly asked, and then only say "That's a different, though related, debate about persistence."
  4.  **Objections Involving Personal Identity:** Questions like "But if my counterpart isn't *me*, who cares?" are valid but open deep philosophical chasms. Acknowledge the intuition: "That's a powerful objection! It gets at why some prefer transworld identity or other theories. We're focused on the *metaphysical structure* Lewis proposes tonight."
  5.  **The "Actualism" Debate:** Whether merely possible worlds/individuals *exist*. Say: "Lewis is a *modal realist* – he thinks other possible worlds are just as real as ours. Others (*actualists*) disagree. We're taking Lewis's realism as given for understanding his *solution*."

  **Misconception Map & Timing:**  
  *   **Pre-Session:** Sci-Fi Worlds (Head off IMMEDIATELY in review).  
  *   **During Transworld:** "Identity is simple" (Shatter with Chisholm's Paradox).  
  *   **Introducing Counterparts:** "Counterparts = Alternate Mes / Sci-Fi Doubles" (Head off by stressing distinct individuals + causal isolation + similarity). "This is just wordplay" (Head off by linking to solving paradox + metaphysical motivation).  
  *   **Post-Counterpart:** "So nothing is really possible for *me*?" (Address in Pros/Cons/Nuance: It's a different *analysis* of what that claim means). "Similarity is too vague" (Acknowledge as a valid con, but part of the theory's trade-off).

  **Key to Success:**  
  *   **Relentlessly** reinforce "worlds as abstract possibilities, not places."  
  *   **Hammer** "Counterparts are distinct but similar individuals."  
  *   **Contrast constantly:** "How would Transworld say it? How would Counterpart say it?"  
  *   **Embrace the weirdness:** Acknowledge CT *feels* strange. Its strength is solving philosophical problems, not matching raw intuition.  
  *   **Use the Check Question:** It forces application and reveals if they grasp the core metaphysical difference.  

  This structure builds intuition, breaks it productively, offers a solution with clear motivations, and provides tools to diagnose understanding. Good luck – you've got this!
