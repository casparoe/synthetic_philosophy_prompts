answer: |-
  Here are five diagnostic points:

  1.  **The core substantive clash is over whether the *mere existence* of additional beings with positive welfare intrinsically contributes value**, with total utilitarians affirming this (leading to the Repugnant Conclusion) and most alternatives (e.g., average utilitarianism, critical-level theories, person-affecting views) implicitly or explicitly denying it, prioritizing either average welfare levels or the interests/welfare changes of specific individuals.
  2.  **A significant component is verbal/conceptual regarding the meaning of "better" when comparing disjoint populations**: "Better" could mean higher total welfare, higher average welfare, more preferable *for* existing people, or satisfying a different impersonal value ranking, and different theories operationalize it differently without resolving this ambiguity.
  3.  **The disagreement is structurally constrained by impossibility theorems (e.g., Arrhenius)**, which formally prove that no population axiology can satisfy a small set of seemingly plausible conditions (e.g., avoiding the Repugnant Conclusion, respecting quality, allowing non-identity cases, etc.), forcing every position to violate at least one widely held intuition.
  4.  **An unresolved empirical/formal question underpinning comparability is whether welfare levels across lives (especially vastly different ones, like blissful vs. barely-worthwhile) are cardinally measurable and interpersonally comparable on a single scale**, a presupposition challenged by some views but required for the Repugnant Conclusion's force and many formal models.
  5.  **Progress would likely involve either a novel distinction clarifying the source of the clash (e.g., separating "better for people" from "better impersonally") or a paradigm shift reframing the question away from maximizing a single "goodness" ordering**, rather than expecting a decisive solution within the current framework given the impossibility results and deep intuition divide.
