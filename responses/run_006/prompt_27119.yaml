  - Build in "circuit breakers" for high-risk moments (like when a witness mentions prior knowledge)
  - Differentiate civilian/officer protocols where professional schema create unique distortions

  Biggest challenges:
  Time compression: Can't eliminate penetration, only mitigate cascading effects. The "stop/go" decisions must be lightning-fast.
  Ethical landmines: An officer-witness mentioning "threat cues" could be accurate perception or training-induced bias—protocol can't assume either.
