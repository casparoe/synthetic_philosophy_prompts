  First, I need to understand the core issue. The user is highlighting that "control" is being used ambiguously. It starts as causal control (what you can directly influence), then moves to moral responsibility (what you're accountable for), and finally to axiological indifference (what you should value). The problem is that these three concepts are distinct, but in the Stoic advice, they're treated as one seamless transition. The user wants to know if there's a name for this specific kind of slide.

  I recall that in logic, equivocation involves using a word with multiple meanings. But here, it's not just the word; it's the conflation of different philosophical domains. The user mentions the fact-value gap, which is Hume's is-ought problem. This seems related but not exactly the same. The slide here is within the Stoic framework, where the trichotomy of control is being stretched to cover areas it shouldn't.

  Looking at Stoic philosophy, especially Epictetus, the dichotomy (or trichotomy) of control is central. But the ancient Stoics did link control with moral worth—things not up to us are indifferent. However, they distinguished between preferred and dispreferred indifferents. Modern interpretations, like Holiday's, might oversimplify this, collapsing the distinctions. The user’s frustration is that this simplification leads to a rhetorical move where the lack of causal control implies emotional detachment, skipping the argument that externals have no moral value.

  The user also gives the climate change example: from causal limitation to no guilt to no preference. Each step uses "control" differently. The slide here is from factual inability to normative conclusions without justification. This seems like a scope expansion fallacy, where the principle is applied beyond its valid scope.

  I need to check if there's an existing term. "Stoic equivocation" or "conflation of the trichotomy" might work. "Scope expansion fallacy" also fits because the principle's application is stretched. The user wants to distinguish this from simple equivocation or the fact-value gap. The key is the triad within Stoicism: causal, deontic, axiological. The move conflates them, so a term like "trichotomy conflation fallacy" could be precise.

  The user's deeper need might be to articulate this critique effectively, especially in discussions about Stoicism. They might want to challenge the modern portrayal without rejecting Stoicism entirely. Providing a clear term helps them communicate this nuanced point without lengthy explanations. Also, they might seek validation that their observation is legitimate, as they notice this pattern consistently.
answer: |-
  You've nailed a crucial and often-overlooked flaw in *certain popular presentations* of Stoicism. This isn't just classic equivocation or the fact-value gap; it's a specific **conceptual slide within the Stoic framework itself**, exploiting ambiguities in the "dichotomy of control" (or William Irvine's "trichotomy").

  **Here's the breakdown of the slide you identified:**

  1.  **Causal Control (Factual):** "X is not *causally* up to me." (e.g., The hiring decision, global emissions).
  2.  **Moral Responsibility/Blame (Deontic):** "Therefore, I bear no *moral responsibility* or *blame* for X." (e.g., "You shouldn't feel guilty").
  3.  **Indifference/Axiological Value (Evaluative):** "Therefore, X has *no intrinsic value/worth* and should be met with *complete indifference*." (e.g., "The outcome doesn't matter," "No reason to prefer").

  **The Problem:** While ancient Stoicism *did* ultimately argue that externals ("indifferents") have no *moral* value (virtue being the only true good), it **did not** derive this *directly* or *solely* from the lack of causal control. This was a separate, profound ethical claim requiring its own justification. Furthermore, they distinguished between "preferred" and "dispreferred" indifferents – health is preferred over sickness, even if neither is the *true good* (virtue).

  **The Slide's Name:**

  The most precise terms for this specific move are:

  1.  **The "Stoic Equivocation" Fallacy (or Trichotomy Conflation Fallacy):** This highlights the core problem: the single term "control" or "up to us" is being used ambiguously to cover three distinct philosophical concepts (causal power, moral accountability, intrinsic value), and the argument slides between them illicitly. It's equivocation *specifically within the context of applying the Stoic control principle*.
  2.  **Scope Expansion Fallacy:** The valid scope of the initial premise ("lack of causal control") is illegitimately expanded to cover conclusions far beyond its reach (moral blame, value judgments).
  3.  **Illicit Inference from Control to Indifference:** This directly names the problematic logical leap you're observing. It bypasses the necessary Stoic argument that *only virtue is good* and *everything else is indifferent*.

  **Distinguishing it from other concepts:**

  *   **Plain Equivocation:** This *is* a form of equivocation, but it's a very *specific* one. It's not just any word switch; it's the equivocal use of the *central Stoic term* ("eph' hēmin" / "up to us" / "control") within the *context of Stoic-inspired advice* to smuggle in normative conclusions. Calling it "Stoic Equivocation" captures this specificity.
  *   **Fact-Value Gap (Hume's Guillotine):** This is deeply related. The slide *exploits* the gap. The initial claim (Step 1) is largely factual (about causal power). Steps 2 & 3 are normative (about responsibility, value, emotion). The fallacy lies in pretending the normative conclusions *logically follow* from the factual premise *alone*, using the ambiguity of "control" as a bridge, thereby *bypassing* the need for separate ethical arguments about virtue and indifference that the ancient Stoics actually provided.
  *   **False Dilemma / False Dichotomy:** While sometimes present (implying "either you control it completely or it has zero value"), your core observation is more about the *illegitimate slide between meanings* within the control concept itself.

  **Why this happens in Popular Stoicism:**

  1.  **Oversimplification:** Ancient Stoic ethics is complex. Popularizers often streamline, sometimes collapsing distinctions (like preferred/dispreferred indifferents) and eliding the core argument about virtue being the sole good.
  2.  **Therapeutic Focus:** Modern applications often prioritize emotional resilience. "It's not under your control, so don't let it upset you" is a powerful *therapeutic technique*, even if it's presented as a *logical deduction* rather than a *practical strategy grounded in a deeper ethical framework*.
  3.  **Rhetorical Power:** Presenting it as one seamless, logical move ("Can't control it? Then it doesn't matter!") is rhetorically compelling and easy to remember, even if philosophically sloppy. It turns a complex ethical system into a quick mental hack.

  **How to Counter It:**

  When you see this slide, point it out explicitly:

  1.  "Hold on. You started by saying X isn't *caused* by me. That seems true."
  2.  "Then you jumped to saying I shouldn't feel *responsible* or *blame* myself. That *might* sometimes be true, but it doesn't *automatically* follow from the lack of causal control. Sometimes we can have responsibility for things we didn't directly cause."
  3.  "Then you jumped further to saying X *doesn't matter at all*, or that I *shouldn't prefer* one outcome over another. This is the biggest leap. While the ancient Stoics argued externals are 'indifferent' in the sense of not being the *true good* (virtue), they still recognized them as having practical value ('preferred indifferents'). My child's health *isn't* the ultimate good, but I absolutely *prefer* them to be healthy, and that preference is rational and Stoic! The lack of causal control doesn't magically erase the value I place on things I love or the world I live in. You need a separate argument about virtue being the sole good to get to that radical indifference, and even then, 'preferred indifferents' complicate the picture."

  **In short:** You've identified the **"Illicit Inference from Control to Indifference"** or the **"Stoic Equivocation Fallacy"**. It conflates causal impotence with moral irrelevance and finally with axiological indifference, using the ambiguity of "control" as a Trojan horse for normative conclusions that require their own, separate justification within Stoic philosophy. Calling it out by name ("That's the Stoic Equivocation slide!") immediately flags the problematic move for discussion.
