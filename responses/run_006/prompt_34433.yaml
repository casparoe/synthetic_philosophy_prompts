  ### Worked Example for Iterated Elimination of Strictly Dominated Strategies

  I present a two-player normal-form game that meets all specifications. The game has three strategies per player and small integer payoffs. The payoff matrix is as follows, with Row player's payoffs listed first and Column player's payoffs second:

  |          | Column X | Column Y | Column Z |
  |----------|----------|----------|----------|
  | **Row A**| (0, 2)   | (4, 3)   | (3, 0)   |
  | **Row B**| (4, 3)   | (0, 2)   | (3, 0)   |
  | **Row C**| (1, 0)   | (1, 0)   | (0, 5)   |

  ### Iterated Elimination with Pure Strategies Only
  Under this procedure, only pure strategies are considered as possible dominators. We iteratively eliminate any pure strategy that is strictly dominated by another pure strategy.

  - **Initial check for dominated strategies:**
    - For Row: 
      - Strategy A vs. C: Against X, 0 < 1 (C better); against Y, 4 > 1 (A better); against Z, 3 > 0 (A better). No strict dominance.
      - Strategy B vs. C: Against X, 4 > 1 (B better); against Y, 0 < 1 (C better); against Z, 3 > 0 (B better). No strict dominance.
      - Strategy A vs. B: Against X, 0 < 4 (B better); against Y, 4 > 0 (A better); against Z, 3 = 3 (equal). No strict dominance.
    - For Column:
      - Strategy X vs. Y: Against A, 2 < 3 (Y better); against B, 3 > 2 (X better); against C, 0 = 0 (equal). No strict dominance.
      - Strategy X vs. Z: Against A, 2 > 0 (X better); against B, 3 > 0 (X better); against C, 0 < 5 (Z better). No strict dominance.
      - Strategy Y vs. Z: Against A, 3 > 0 (Y better); against B, 2 > 0 (Y better); against C, 0 < 5 (Z better). No strict dominance.
    - No strict dominance by any pure strategy; no elimination occurs.

  - **Surviving pure-strategy profiles:** All nine profiles: (A, X), (A, Y), (A, Z), (B, X), (B, Y), (B, Z), (C, X), (C, Y), (C, Z).

  ### Iterated Elimination with Mixed Strategies Allowed
  Under this procedure, mixed strategies are permitted as possible dominators. We iteratively eliminate any pure strategy that is strictly dominated by a pure or mixed strategy.

  - **Step 1: Eliminate Row C (dominated by a mixed strategy).**  
    Consider a mixed strategy for Row that assigns probability 0.5 to A and 0.5 to B. The expected payoff of this mixed strategy is compared to the payoff of C for each pure strategy of Column:
    - Against X: (0.5)(0) + (0.5)(4) = 2 > 1 (C's payoff)
    - Against Y: (0.5)(4) + (0.5)(0) = 2 > 1 (C's payoff)
    - Against Z: (0.5)(3) + (0.5)(3) = 3 > 0 (C's payoff)  
    Inequalities: \(2 > 1\), \(2 > 1\), \(3 > 0\). All strict, so C is strictly dominated by the mixed strategy (0.5 A, 0.5 B). Eliminate C.  
    Reduced game (C is removed):

    |          | Column X | Column Y | Column Z |
    |----------|----------|----------|----------|
    | **Row A**| (0, 2)   | (4, 3)   | (3, 0)   |
    | **Row B**| (4, 3)   | (0, 2)   | (3, 0)   |

  - **Step 2: Eliminate Column Z (dominated by pure strategy X).**  
    In the reduced game, check for dominated strategies for Column:
    - Strategy Z vs. X: Against A, 0 < 2 (X better); against B, 0 < 3 (X better). Strict dominance by X.  
    Eliminate Z.  
    Reduced game (Z is removed):

    |          | Column X | Column Y |
    |----------|----------|----------|
    | **Row A**| (0, 2)   | (4, 3)   |
    | **Row B**| (4, 3)   | (0, 2)   |

  - **Final check:**  
    - For Row: Against X, 0 < 4 (B better); against Y, 4 > 0 (A better). No dominance.
    - For Column: Against A, 2 < 3 (Y better); against B, 3 > 2 (X better). No dominance.
    - No further eliminations.

  - **Surviving pure-strategy profiles:** (A, X), (A, Y), (B, X), (B, Y).

  ### Key Feature of the Payoff Matrix
  The crucial feature enabling the difference is that Row's strategy C has a strictly lower payoff against Column's Z (payoff 0) compared to both A and B (which each get 3 against Z). This allows the mixed strategy (A and B) to be strictly better than C against Z, while the averaging effect makes it better against X and Y (C gets 1, mixture gets 2). Specifically:
  - Against Z: \( u(C,Z) = 0 < 3 = u(A,Z) \) and \( u(C,Z) = 0 < 3 = u(B,Z) \), so the mixture is strictly better.
  - Against X and Y: C's payoffs (1) are less than the mixture's expected payoffs (2) due to the complementarity of A and B (A is strong against Y, B against X).

  If this feature is removed or perturbed—for example, if \( u(C,Z) \) is increased to 3—then against Z, the mixture would yield 3, not strictly greater than C's 3. Thus, C would not be strictly dominated by the mixture and would survive elimination even with mixed strategies allowed, nullifying the difference between the procedures.

  ### Critic's Argument and Rebuttal
  A critic holding that only pure-strategy dominance is rationally compelling might argue that:
  - C should not be eliminated because it is not strictly dominated by any pure strategy and can yield a higher payoff than A or B in certain cases (e.g., against X, C gets 1 while A gets 0; against Y, C gets 1 while B gets 0). Thus, if the Column player is expected to play X or Y, C could be a reasonable choice under pure rationality without randomization.

  Nonetheless, this example is decisive for the purpose of the lecture because:
  - Rational choice theory permits mixed strategies as valid responses to uncertainty, and a strictly dominated strategy (even by a mixed strategy) is never rational, as it is inferior for all opponent actions. The example demonstrates that iterated elimination with mixed strategies can reveal more about rational play by considering a broader set of dominators, leading to different surviving strategy sets. This is essential for understanding the power of mixed strategies in refining game-theoretic predictions.
