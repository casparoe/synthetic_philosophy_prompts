  In strict dominance, if for every possible action of opponent, there is a better response, then it should be eliminated.

  But with mixed, the mixed strategy is better against every pure action.

  The critic might say that the mixed strategy is not a single action, so it requires randomization, which might not be compelling if players don't randomize.

  But in rational choice, mixed strategies are allowed as part of the strategy set.

  For the purpose of showing that mixed allows more elimination, it is valid.

