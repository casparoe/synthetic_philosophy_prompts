prompt: |-
  I'm preparing for a comprehensive exam in metaphysics, and the part I keep putting off is the grounding and fundamentality literature, because it feels like different authors are solving different problems under the same vocabulary. One is worried about what makes it true that the rose is red because it is crimson; another about whether there must be a bottom level of reality; another about whether the cosmos as a whole is prior to its parts or the reverse; and they all call it "grounding." Before I read any further, I want the full specification of what a theory of metaphysical grounding and fundamentality has to deliver. Write the desiderata: for each requirement, give the case or consideration that forces it. The list should cover at least the following. First, the examples a theory must classify correctly — the scarlet rose and its being red, the disjunction and its true disjunct, the existence of Socrates and the existence of his singleton, the whole and its parts, a gunky world with no simples, and logical truths if these are grounded in nothing at all. Second, the distinctions it must not collapse — grounding versus causation, grounding versus necessitation or supervenience, full versus partial versus mediate ground, being ungrounded versus being fundamental, and the explanatory "because" versus any worldly relation it may or may not report. Third, the formal features it must ascribe or refuse — irreflexivity, asymmetry, transitivity, well-foundedness — with the case for and against each. Then flag the pairs of desiderata you suspect cannot be jointly satisfied: for instance, well-foundedness together with the claim that every non-fundamental fact has a ground once endless descent is admitted; or hyperintensionality together with the thesis that grounds necessitate what they ground; or treating grounding as a real relation together with the claim that every grounding fact must itself be grounded. Mark which requirements are non-negotiable constraints on any adequate theory and which are merely the preferences of a particular camp — foundationalists, priority monists, grounding necessitarians, and the like. Finally, tell me which single requirement does the most to exclude the main extant positions, and why; keep that part brief, because the criteria themselves are what I want to work through.
reasoning: |-
  Okay, the user is prepping for a metaphysics comp exam and is stuck on grounding/fundamentality literature because it feels like everyone's using the same terms for different problems. They want a clear list of what a theory *must* deliver—desiderata with cases that force each requirement, plus distinctions to preserve, formal features to handle, and potential conflicts.  

  First, I need to map their examples: scarlet rose (property determination), disjunction (truth-making), Socrates/singleton (set theory), mereology, gunky worlds, logical truths. Each tests different grounding intuitions. Then distinctions: grounding vs. causation (billiard balls vs. disjunctions), vs. necessitation (Hesperus/Phosphorus), partial/mediate/full grounds, ungrounded≠fundamental (emergent properties?), and explanatory vs. worldly "because". Formal features are trickiest—irreflexivity (self-grounding paradox), asymmetry (rose/crimson symmetry problem), transitivity (water/H₂O chain), well-foundedness (gunky worlds vs. foundationalism).  

  The conflicts they mention are spot-on: well-foundedness clashing with endless descent (gunky worlds break foundationalism), hyperintensionality vs. necessitation (contingent grounding pairs), and grounding facts requiring grounds (infinite regress threat). I'll flag these as tension points.  

  Non-negotiables: grounding must be irreflexive (no exceptions), asymmetric (directionality is core), hyperintensional (to handle Hesperus cases). Well-foundedness is negotiable—foundationalists demand it, infinitists don't. Same for grounding necessitation (Schaffer accepts, Wilson rejects).  

  The kingmaker desideratum is hyperintensionality—it nukes modal equivalence theories (like Sider's) and forces either primitive grounding (Fine) or structured truths (Correia). That’s the bottleneck.  

  User’s deeper need? Cutting through terminological chaos by anchoring theory requirements to concrete cases. They want criteria to evaluate competing frameworks, not just a survey. I’ll structure output as a reference tool: desiderata → forced by → negotiability. The "why" for hyperintensionality’s exclusionary power stays brief per request.  

  Key move: emphasize that non-negotiable constraints (irreflexivity, asymmetry, hyperintensionality) are enforced by logical/metaphysical incoherence if violated, while others (well-foundedness) are programmatic. That’ll help them sort mandatory vs. partisan claims in the literature.
answer: |-
  Here’s a systematic breakdown of the desiderata for a theory of metaphysical grounding and fundamentality, organized by your requests. I’ll flag tensions, negotiability, and the most exclusionary requirement.  

  ### **I. Cases a Theory Must Classify Correctly**  
  *(Core examples forcing specific theoretical commitments)*  

  1. **Scarlet Rose & Being Red**  
     - *Case*: The fact *that the rose is red* is grounded in *that it is scarlet*.  
     - *Requirement*: Grounding must explain **determinable-determinate** relationships (non-causal dependence).  

  2. **Disjunction & True Disjunct**  
     - *Case*: *That P ∨ Q is true* is grounded in *that P is true* (when P is true).  
     - *Requirement*: Grounding must capture **truth-making** for logical compounds (asymmetric priority of disjunct over disjunction).  

  3. **Socrates & His Singleton**  
     - *Case*: *That {Socrates} exists* is grounded in *that Socrates exists*, but not vice versa.  
     - *Requirement*: Grounding must distinguish **set-member** priority (sets depend on members, not conversely).  

  4. **Whole & Parts (Mereology)**  
     - *Case*: *That a table exists* is grounded in *that its parts exist arranged table-wise* (or vice versa, depending on mereological view).  
     - *Requirement*: Grounding must accommodate **mereological disputes** (e.g., priority monism vs. nihilism).  

  5. **Gunky World (No Simples)**  
     - *Case*: A world with infinite descent: each object has proper parts, but no fundamental parts.  
     - *Requirement*: Theory must allow for **non-well-founded grounding chains** (if gunky worlds are metaphysically possible).  

  6. **Logical Truths (e.g., ¬(P ∧ ¬P))**  
     - *Case*: Such truths are ungrounded.  
     - *Requirement*: Grounding must permit **zero-grounding** (ungrounded facts).  

  ---

  ### **II. Distinctions a Theory Must Preserve**  
  *(Critical separations to avoid conflation)*  

  1. **Grounding vs. Causation**  
     - *Case*: "The rose is red *because* it is scarlet" (grounding) vs. "The vase shattered *because* it was struck" (causation).  
     - *Requirement*: Grounding is **synchronic, non-causal, and constitutive**; causation is diachronic and dynamic.  

  2. **Grounding vs. Necessitation/Supervenience**  
     - *Case*: Hesperus is Phosphorus (necessitation), but neither grounds the other.  
     - *Requirement*: Grounding must be **hyperintensional** (finer-grained than modal equivalence).  

  3. **Full vs. Partial vs. Mediate Ground**  
     - *Case*: *That P ∧ Q* is *fully* grounded by {P, Q}; *partially* grounded by P *alone*; *mediately* grounded by R if R grounds P.  
     - *Requirement*: Theory must distinguish **immediate vs. remote** dependence.  

  4. **Ungrounded vs. Fundamental**  
     - *Case*: Emergent properties (e.g., consciousness) may be ungrounded but non-fundamental if they depend on non-grounding relations.  
     - *Requirement*: **Fundamentality** requires independence *in reality*; **ungroundedness** is merely absence of grounds.  

  5. **Explanatory "Because" vs. Worldly Relation**  
     - *Case*: "The rose is red because it is scarlet" reports a metaphysical relation, not epistemic explanation.  
     - *Requirement*: Grounding is **objective and mind-independent**.  

  ---

  ### **III. Formal Features: Cases For & Against**  

  | Feature          | Case For                                      | Case Against                                  | Negotiability |  
  |------------------|-----------------------------------------------|-----------------------------------------------|---------------|  
  | **Irreflexivity** | Nothing grounds itself (e.g., a fact can’t explain its own truth). | *No clear counterexamples*; collapse into circularity. | **Non-negotiable** (universally accepted). |  
  | **Asymmetry**     | If scarlet grounds red, red cannot ground scarlet. | Symmetric dependence (e.g., reciprocal moral principles?) | **Non-negotiable** (core to directionality). |  
  | **Transitivity**  | If A grounds B and B grounds C, A grounds C (e.g., H₂O structure → liquidity → wetness). | "Grounding erosion" (e.g., pain grounds pain-report, pain-report grounds neural state, but pain ≠ neural state). | **Negotiable** (Fine vs. Schaffer: transitivity optional). |  
  | **Well-Foundedness** | Avoid infinite regress (e.g., foundational particles ground all composites). | Gunky worlds: no bottom level, yet grounding chains exist. | **Negotiable** (Foundationalists vs. Infinitists). |  

  ---

  ### **IV. Tensions Between Desiderata**  
  *(Pairs likely incompatible)*  

  1. **Well-Foundedness + Endless Descent**  
     - *Conflict*: If well-foundedness demands a fundamental level, gunky worlds (with endless descent) are impossible.  
     - *Resolution*: **Infinitists** reject well-foundedness; **foundationalists** reject gunky worlds as impossible.  

  2. **Hyperintensionality + Grounding Necessitation**  
     - *Conflict*: If grounds necessitate grounded (P → Q), but grounding is hyperintensional (P ≠ Q when P ⇔ Q), necessitation collapses distinctions.  
     - *Resolution*: **Primitivists** (Fine) accept hyperintensionality; **Necessitarians** (Rosen) weaken hyperintensionality.  

  3. **Real Grounding Relation + Ungrounded Grounding Facts**  
     - *Conflict*: If grounding is a relation, facts *about* grounding (e.g., "P grounds Q") must themselves be grounded → regress.  
     - *Resolution*: **Deflationists** (Hofweber) deny grounding is a relation; **hierarchists** (Bennett) accept regress.  

  ---

  ### **V. Negotiability: Constraints vs. Camp Preferences**  

  | Requirement              | Non-Negotiable? | Camp Preference |  
  |--------------------------|-----------------|-----------------|  
  | Irreflexivity            | Yes             | Universal       |  
  | Asymmetry                | Yes             | Universal       |  
  | Hyperintensionality      | Yes             | Primitivists (Fine) vs. Necessitarians (Rosen) |  
  | Well-Foundedness         | No              | Foundationalists (Sider) vs. Infinitists (Bliss) |  
  | Grounding Necessitation  | No              | Necessitarians (Rosen) vs. Contingent Grounders (Skiles) |  
  | Priority Monism          | No              | Monists (Schaffer) vs. Pluralists |  

  ---

  ### **VI. The Most Exclusionary Requirement: Hyperintensionality**  
  **Why**: It eliminates theories that reduce grounding to modal or supervenience relations (e.g., Sider's structuralism) by demanding finer-grained distinctions (e.g., *Hesperus is bright* vs. *Phosphorus is bright* may differ in grounds). This forces either primitive grounding (Fine) or structured truthmakers (Correia), excluding modal-equivalence accounts.  

  ---

  **Key Insight**: Grounding theories fracture over how to reconcile **hyperintensionality** with **explanatory power** and **formal structure**. Use this framework to test readings:  
  - Does Author X preserve irreflexivity?  
  - Do they handle gunky worlds by sacrificing well-foundedness?  
  - Do they conflate grounding with supervenience?  
  This exposes hidden disagreements beneath shared vocabulary.
