answer: |-
  Below is a step-by-step procedure (checklist) to verify price coherence and avoid sure-loss Dutch books in your prediction market. It's designed for non-experts, with clear pass/fail criteria, adjustment steps, and escalation points. The procedure focuses on **within-market coherence** only—it cannot catch cross-market arbitrage, informed traders, thin volume, or unverifiable outcomes.

  ---

  ### **Prediction Market Price Coherence Checklist**
  *Use this checklist for each market before posting opening prices.  
  Answer all questions in order. If any "NO" answer cannot be fixed, DO NOT OPEN THE MARKET.*

  1. **Are all outcomes mutually exclusive?**  
     - **Check:** Can multiple outcomes occur simultaneously? (e.g., "Professor A gets tenure" and "Professor B gets tenure" are not exclusive).  
     - **Pass:** YES (all outcomes are mutually exclusive).  
     - **Fail:** NO → Proceed to Question 1A.  
       - **1A. Can we restructure outcomes to be mutually exclusive?** (e.g., split into "A only," "B only," "Both," "Neither").  
         - YES → Restructure outcomes and restart checklist.  
         - NO → **DO NOT OPEN MARKET** (non-exclusive markets risk complex arbitrage).

  2. **Are all outcomes exhaustive?**  
     - **Check:** Do the outcomes cover 100% of possible results? (e.g., missing "no winner" in an election).  
     - **Pass:** YES (sum of probabilities = 100%).  
     - **Fail:** NO → Add an explicit "None of the above" outcome with price `1 - sum(existing prices)`, then restart checklist. Ensure this price is ≥0.

  3. **Are all prices between $0 and $1?**  
     - **Check:** Any price < $0 or > $1?  
     - **Pass:** YES (all prices in $[0, 1]$).  
     - **Fail:** NO → **ADJUST PRICES IMMEDIATELY**. Cap prices at $0/$1 and notify team lead.

  4. **Do prices sum to $1.00?**  
     - **Check:** Sum all outcome prices. Allow tolerance of ±$0.01 for rounding.  
     - **Pass:** YES ($0.99 ≤ sum ≤ $1.01).  
     - **Fail:** NO → **ADJUST PRICES IMMEDIATELY** using:  
       - **Normalization:** New price = (Old price / Total sum) × $1.00.  
       - **Example:** Prices [50¢, 30¢, 25¢] sum to $1.05 → Normalize to [48¢, 29¢, 24¢].  
       - *Judgment call:* If normalization distorts intent, manually adjust the least confident price.

  5. **For non-exclusive outcomes (if unavoidable), check implication consistency**:  
     - **Check:** If Outcome A implies Outcome B (e.g., "A wins outright" implies "A makes runoff"), is Price(A) ≤ Price(B)?  
     - **Pass:** YES (all implications satisfy Price(A) ≤ Price(B)).  
     - **Fail:** NO → **ADJUST PRICES IMMEDIATELY** to ensure Price(A) ≤ Price(B). Escalate to team lead if logic is ambiguous.

  6. **Final Sanity Check**:  
     - **Check:** Do prices reflect plausible reality? (e.g., 1¢ for "provost resigns" amid scandals is suspicious).  
     - **Pass:** Judgment call (consult team if unsure).  
     - **Fail:** Recalibrate prices using external data (news, polls) or delay opening.

  ---

  ### **What This Procedure Can't Catch**
  1. **Correlated markets**: Arbitrage across *different* markets (e.g., "dining strike" and "provost resigns") is undetectable.  
  2. **Informed traders**: Coherent prices can still be "wrong" and lose money to better-informed traders.  
  3. **Thin markets**: Low trading volume may prevent price correction, leaving you stuck with bad initial odds.  
  4. **Unverifiable outcomes**: Ambiguous resolutions (e.g., "Professor X deserved tenure") cause disputes.  
  5. **Liquidity gaps**: If the order book is sparse, your opening prices may dominate too long.

  ---

  ### **Case Walkthroughs**
  #### **Case 1: Library Renovation Market**  
  Outcomes: ["Finished during fall" (50¢), "Finished during spring" (30¢), "Not finished by spring end" (25¢)]  
  - **Q1:** Mutually exclusive? → YES.  
  - **Q2:** Exhaustive? → YES (covers all timelines).  
  - **Q3:** Prices in [0,1]? → YES (0.50, 0.30, 0.25).  
  - **Q4:** Sum to $1.00? → Sum = $1.05 → **FAIL**.  
    - **Action:** Normalize to [50/105≈48¢, 30/105≈29¢, 25/105≈24¢] or manually adjust (e.g., reduce "fall" to 45¢).  
  - **Post-adjustment:** Sum = $1.00 → **MARKET SAFE TO OPEN**.

  #### **Case 2: Runoff Election Market**  
  Prices: "A wins outright" (60¢), "A makes runoff" (40¢)  
  - **Q1:** Mutually exclusive? → NO ("A wins outright" implies "A makes runoff").  
  - **Q1A:** Restructure? → YES.  
    - **Restructure as:** ["A wins outright", "A loses runoff", "A misses runoff"].  
    - Rerun checklist with 3 mutually exclusive, exhaustive outcomes.  
  - *If restructuring refused*:  
    - **Q5:** Check implications → "A wins" implies "A makes runoff", but $0.60 > $0.40 → **FAIL**.  
    - **Action:** Adjust so "A wins" ≤ "A makes runoff" (e.g., 40¢ and 60¢).  
    - **Q2:** Exhaustive? → NO (missing "A misses runoff") → Add outcome at $1.00 - $0.40 - $0.60 = **-$0.00?** → **INCOHERENT**.  
    - **Verdict: DO NOT OPEN** without restructuring.

  #### **Case 3: Professor Tenure Market**  
  Outcomes: ["Prof A tenure", "Prof B tenure", ...]  
  - **Q1:** Mutually exclusive? → NO (multiple can get tenure).  
  - **Q1A:** Restructure? → Unlikely (combinatorial explosion).  
  - **Q5:** Check implications → Requires defining relationships (e.g., does "Prof A tenure" affect "Prof B"?). Complex and error-prone.  
  - **Q6:** Verifiability → "Unverifiable outcome" noted → **DO NOT OPEN** (settlement risk).  
  - **Verdict: DO NOT OPEN**. Restructure as binary markets per professor or abandon.  

  ---

  ### **Escalation Rules**
  - **"Adjust prices" steps**: Do automatically unless normalization wildly contradicts intuition (then escalate to team lead).  
  - **"Do not open market" steps**: Escalate to entire team with explanation.  
  - **Judgment calls (Step 6)**: Team majority vote.  

  This procedure minimizes Dutch book risk but can't eliminate all losses. Prioritize mutually exclusive, exhaustive events and automate normalization (e.g., via a spreadsheet) to avoid human error.
