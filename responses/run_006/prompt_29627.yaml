  We are given a set of contracts that pay $1 if a particular event occurs. The prices we set should be coherent, meaning they should satisfy the probability axioms to avoid a Dutch book (sure loss). Specifically:

  1. The price of any contract should be between 0 and 1 (inclusive).
  2. For a set of mutually exclusive and exhaustive events (i.e., exactly one will occur), the sum of the prices must be exactly 1.
  3. For two events A and B, if A implies B (i.e., A is a subset of B), then the price of A should be at most the price of B.

  However, note that in a prediction market, we are setting prices that reflect the market's probability estimate. We are acting as the initial market maker.

  The procedure must be a checklist that can be used by co-managers without a background in decision theory.

  ### Procedure Checklist for Coherent Pricing

  Before opening the market, for each market we must:

  **Step 1: Identify the set of outcomes (contracts) in the market.**
     - Are the outcomes mutually exclusive? (Only one can happen? If not, note which ones can happen together.)
     - Are the outcomes exhaustive? (Do they cover all possibilities? If not, we might need an explicit "none of the above" or adjust the set.)

     - If the outcomes are not mutually exclusive and exhaustive, we must be cautious because the standard probability axioms don't directly apply in the same way. We might need to consider conditional probabilities or avoid such markets.

  **Step 2: Check each contract price is between 0 and 1 (inclusive).**
     - If any price is below 0 or above 1, we must adjust it to be within [0,1]. Note: prices above 1 are especially bad because we would be selling a contract for more than its maximum payout.

  **Step 3: If the outcomes are mutually exclusive and exhaustive:**
     - The sum of all the contract prices must equal 1.00 (within a tolerance, say 0.01 due to rounding? But ideally exactly). If the sum is not 1, we must adjust the prices so that they sum to 1.

     - How to adjust? We can normalize (divide each price by the sum) but note that this changes the relative odds. Alternatively, we can adjust the most out-of-line price until the sum is exactly 1. This is a judgment call, but the goal is to be coherent.

  **Step 4: If the outcomes are mutually exclusive but not exhaustive:**
     - Then we have an implicit "none of the above" outcome. The price of "none" is 1 - (sum of the other prices). We must ensure that this implicit price is nonnegative. Therefore, the sum of the explicit outcomes must be <= 1.

     - Also, we must consider: do we want to list an explicit "none" contract? If not, then we must make sure that the sum of the explicit outcomes is <= 1. If we do list a "none" contract, then we must set a price for it and then the entire set becomes exhaustive and we go to Step 3.

  **Step 5: If the outcomes are not mutually exclusive:**
     - We have to be very careful. We must check for any logical implications:

       a) For any two events A and B, if A implies B, then the price of A must be <= the price of B.

       b) Also, for any two events A and B, the price of the event "A or B" (if we have such a contract) should be at least the price of A and at least the price of B, and at most the sum of the prices of A and B. But note: if we don't have a contract for "A or B", we might not be directly exposed, but arbitrage might still be possible through combinations.

     - However, without mutual exclusivity, it's harder to ensure coherence. We might have to rely on the market to correct, but as the market maker we are exposed to arbitrage if our prices are incoherent.

     - Given the complexity, we might avoid markets that are not mutually exclusive and exhaustive, or we might structure them as mutually exclusive by creating composite outcomes.

  **Step 6: Check for arbitrage opportunities across combinations of contracts in the same market.**
     - This is the most complex step and might be hard to do manually. However, for a small number of contracts (say, up to 5) we can check:

       a) For any subset of contracts that cover the entire set of possibilities (i.e., they form a partition), the sum of the prices must be 1.

       b) For any two contracts that are mutually exclusive, the sum of their prices must be <= 1.

       c) For any event that is the union of other events, the price should not exceed the sum of the prices of the constituent events (if the constituents are mutually exclusive, then it should be exactly the sum; if not, then at most the sum).

     - However, note that without a complete set of contracts (like contracts for every logical combination) it is difficult to check all possibilities. Therefore, we strongly prefer markets that are structured as mutually exclusive and exhaustive outcomes.

     - Alternatively, we can use a linear programming approach to check for arbitrage, but that might be too complex for a checklist. Therefore, we note: if the market is not mutually exclusive and exhaustive, then we are at risk of Dutch books that we might not catch.

  **Step 7: If the market is about events that are not independent of other markets, note that we cannot check coherence across markets with this procedure. We are only checking within one market.**

  **Step 8: If at any step we find an incoherence:**
     - We must adjust the prices until they are coherent. If we cannot make the prices coherent (for example, in a non-mutually-exclusive market) without substantially changing the intended probabilities, then we should not open the market until we restructure it.

     - If we find an incoherence that we cannot fix (like in Step 5 when we have non-mutually-exclusive events and we cannot set prices that satisfy all the constraints), then we must not open the market.

  **Step 9: After setting prices, run a quick sanity check:**
     - Are the prices in line with our best estimates? (This is a judgment call, but we don't want to be too far off because then we might get picked off by informed traders, even if the prices are coherent.)

