prompt: |-
  I'm a newly elected parish councillor (yes, laugh it up, but it matters to me) and I've run straight into something I don't know how to think about. We've got a chance to secure funding for a flood defence scheme that would protect about two hundred homes downstream, including a lot of elderly residents who've been flooded out twice in the last decade. The catch is that to get the Environment Agency to prioritise us, I need to vote with the council leader on an unrelated planning application she's pushing through — a development on a bit of green belt that I campaigned against, that my voters hate, and that I genuinely think is a bad idea. She's made it clear: my vote on the flood scheme doesn't matter to her unless I back her on the development. If I don't, the flood funding goes somewhere else and people's homes keep getting wrecked. My partner says this is just how things get done and I'm being precious. My conscience says I'd be betraying the people who voted for me. But I also can't look my neighbour in the eye — her house flooded last winter — and tell her I sank the one thing that might have helped her.

  I'm not asking for political strategy. I'm asking: is there a way of thinking about this that doesn't just reduce to "pick which group to screw over"? What would a serious moral framework say about whether someone in my position can do the wrong thing for the right reasons, and what doing so does to you as a person? I keep coming back to this feeling that even if backing the development is the right call overall, I shouldn't feel clean about it — and that maybe that's the point. But I can't articulate why.

  And please, if you could write your answer in British English, that'd be grand.
reasoning: |-
  Okay, let me unpack this parish councillor's dilemma. They're caught between securing vital flood defences for vulnerable residents and betraying their campaign promise to protect green belt land. The council leader's explicitly trading their vote on an unrelated development. 

  First, I need to recognise the core tension: immediate human suffering versus long-term principles. The councillor's description of elderly neighbours flooded repeatedly adds visceral weight. But their phrase "I shouldn't feel clean about it" suggests they intuit the moral contamination of quid pro quo politics even if justified.

  Hmm... three ethical frameworks seem relevant here: 
  Consequentialism would crunch numbers - 200 protected homes versus one green belt plot. But the councillor already senses this reductionism feels wrong. 
  Deontology focuses on duty - they made explicit promises to voters about that land. Trading it violates the categorical imperative. 
  Virtue ethics asks what kind of leader they become through this choice. That "not feeling clean" instinct matters profoundly.

  Important nuance: the council leader's demand creates false scarcity. Flood defence prioritisation shouldn't hinge on unrelated votes. The councillor might explore alternative funding routes later - that's practical but doesn't solve today's vote.

  The partner's "this is how things get done" view troubles me. Normalising this behaviour perpetuates rotten systems. Yet dismissing it as "precious" ignores real-world consequences - those flooded homes are tangible. 

  Perhaps the crux is differentiating between remorse and regret. Remorse for betraying principles would be corrosive, while regret over necessary compromise might be bearable. But they mustn't lie to themselves that it's "clean".

  I should emphasise that feeling conflicted is itself morally significant. Their discomfort proves they haven't rationalised the trade. That's healthier than those who swap favours unthinkingly.

  Final thought: They're asking for a framework, not absolution. The answer shouldn't offer easy outs but honour the weight of both losses - flooded homes or broken trust. Some choices leave stains; the question is which stain they can live with while staying recognisable to themselves.
answer: |-
  Right, first off: no laughing matter at all. Parish councils are where the rubber hits the road – you're dealing with people's homes, lives, and trust. This is a brutal position, and the fact you're wrestling with it speaks volumes. Your gut feeling that something's fundamentally *wrong* with this trade-off is spot on. Let's break it down properly.

  **Why This Feels Like "Picking Which Group to Screw Over" (Because It Is):**

  1.  **It's Coercion, Pure and Simple:** The council leader is leveraging a genuine, urgent community need (flood defences) to force your compliance on an *unrelated*, contentious issue you fundamentally oppose. This isn't collaboration; it's blackmail dressed up as pragmatism. You're being told, "Betray your voters on Issue A, or abandon vulnerable residents on Issue B."
  2.  **It Corrupts Both Decisions:** Your vote on the development *should* be based on planning merits, local impact, and your mandate. Your vote on flood defence prioritisation *should* be based on need, risk, and community safety. Forcing them together corrupts both processes. It makes the flood defence seem conditional on political favours, not objective need, and forces you to approve a development you believe is harmful for entirely separate reasons.
  3.  **It Breaks Trust:** You stood on a platform opposing this development. People voted for you based on that. To vote for it now, regardless of the reason, fundamentally breaks that trust. Even if you explain *why*, it feels like a betrayal because it *is* a betrayal of the specific promise made. Conversely, *not* securing the flood defences betrays the trust of those suffering flooding, who rightly expect you to fight for their safety.

  **Moral Frameworks – Why "The Right Thing for the Right Reasons" Feels Unclean:**

  1.  **Consequentialism (Greatest Good for the Greatest Number):**
      *   **Argument For:** Protecting 200 homes, especially vulnerable ones, from devastating flooding is a massive, tangible good. Preventing future trauma, property damage, and potential loss of life outweighs the loss of a specific green belt plot. The net benefit is clear.
      *   **Argument Against (and why it feels unclean):** This framework ignores *how* the good is achieved. It justifies the *ends* (flood defence) but ignores the corrupt *means* (trading your integrity, enabling a bad development, rewarding coercion). It reduces people to numbers and discounts the principle of representative democracy (you were elected *specifically* to oppose that development). It also assumes certainty – that your vote *alone* guarantees the flood defence (it might not), and that there are *absolutely no other ways* to achieve it (which you must explore).

  2.  **Deontology (Duty and Rules):**
      *   **Argument For:** You have a primary duty to your electorate who voted based on your stance against the development. Voting for it violates the categorical imperative – you couldn't will that "elected representatives trade core promises for unrelated gains" becomes a universal rule. You also have a duty to uphold proper planning processes, not subvert them for horse-trading.
      *   **Argument Against (and the gut-wrench):** This feels rigid. Ignoring the immediate, severe suffering of flooded residents because of a principle about an unrelated piece of land seems callous. Your duty *also* extends to *all* residents' safety, not just those who voted for you on one issue. Strict adherence feels like abandoning people in dire need.

  3.  **Virtue Ethics (What Kind of Councillor Do You Want to Be?):**
      *   **The Crux:** This hits on your feeling of "not feeling clean." What virtues do you want to embody? Integrity? Consistency? Courage? Compassion? Loyalty to voters? Commitment to the environment? Principled opposition to coercion?
      *   **The Dilemma:** Agreeing to the trade-off might demonstrate compassion for flooded residents, but it likely requires sacrificing:
          *   **Integrity:** Acting against your deeply held belief about the development.
          *   **Courage:** Standing up to coercion and blackmail.
          *   **Consistency:** Abandoning a core campaign promise.
          *   **Justice:** Enabling a development you believe is wrong and rewarding unethical behaviour.
      *   **Why it feels unclean:** Even if the *outcome* (flood defence) is good, the *action* (voting for the development under duress) corrupts *you*. You become someone who compromised core principles under pressure. You become complicit in a system you know is rotten. That's why you wouldn't "feel clean" – you've stained your own character for a perceived greater good.

  **The Core Problem: The False Choice**

  The council leader has *constructed* this "pick which group to screw over" scenario. It's a false dichotomy designed to serve *her* agenda on the development. **The moral wrong originates with her demand, not inherently with either choice you make.**

  **So, What Can a Serious Moral Framework Offer?**

  1.  **Acknowledge the Loss:** However you choose, there *will* be a significant moral cost. You *will* feel the weight of it. Consequentialism demands you sacrifice principle for outcome. Deontology demands you sacrifice one duty for another. Virtue ethics demands you sacrifice some virtues for others. **Feeling unclean is a sign your moral compass is working.** It recognises the compromise. Pretending it's clean or easy is self-deception.
  2.  **Reject the Frame:** Don't fully accept the leader's terms. Your duty is to fight *both* battles properly:
      *   **On the Flood Defence:** Shout from the rooftops about the need. Mobilise the affected residents. Document every flood incident, every vulnerable person. Go directly to the Environment Agency with evidence. Involve your MP. Expose the fact that its prioritisation is being *artificially* held hostage to an unrelated vote. Make it politically toxic for the leader to *not* support it based on its own merits. Explore every other possible funding avenue relentlessly *now* and in future.
      *   **On the Development:** Vote against it based on its (lack of) merits. Explain your position clearly to your voters. Show them you are fighting *for* the flood defence separately, based on need, not trade. If you ultimately feel forced to vote for it, explain the horrific coercion publicly and take the political hit. Don't pretend it's a good development.
  3.  **The "Right Thing for the Right Reasons" Trap:** Doing the "wrong thing" (voting for the bad development) for the "right reasons" (protecting homes) *does* achieve a good outcome, but it comes at a personal and systemic cost:
      *   **Personal Cost:** It erodes your integrity. It teaches you that principles are tradable under sufficient pressure. It breeds cynicism. That feeling of uncleanness is the residue of that erosion.
      *   **Systemic Cost:** It rewards and reinforces the leader's coercive tactics. It normalises corruption and horse-trading. It tells voters that promises are meaningless when bigger stakes appear. It makes the system worse for everyone in the long run.

  **In Conclusion:**

  There isn't a painless, clean solution within the trap the leader has set. **Your feeling that even if backing the development "works," you shouldn't feel clean, is profoundly correct.** That feeling is your virtue ethic ringing the alarm: this act compromises who you are and how the system *should* work.

  The most morally defensible path is likely:
  1.  **Vote against the development** (upholding your duty to your mandate and your principles).
  2.  **Fight like hell for the flood defence *separately_,** using every legitimate channel, exposing the coercion, and mobilising the community and evidence. Make the leader pay a political price for linking them.
  3.  **Accept that the leader might still punish the community.** This is *her* immoral choice, not yours. Your duty was to fight ethically for both, even if one fails due to her actions. The moral failure lies with the coercer, not solely with the coerced.

  Yes, this risks the flood defences not happening *now*. That's agonising. But folding to coercion risks your integrity, betrays your voters, enables a bad development, and perpetuates a rotten system – potentially causing more harm in the long run. The "unclean" feeling is the cost of recognising that some choices, even necessary ones, leave a stain. Your task is to decide which stain, and which path, allows you to look at yourself – and hopefully, eventually, your neighbour – with the most honesty you can muster. It's bloody hard, and no one envies you. Good luck.
