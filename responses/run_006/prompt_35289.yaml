prompt: |-
  I've just been put on a safety sign-off rota at work and I'm out of my depth. We're piloting an LLM agent that can take actions in our own systems — sending emails to customers, updating CRM records, reordering stock, moving files, that sort of thing. My job is to review proposed actions before they go live, maybe forty a week, and either approve, block, or send them back with changes. The only guidance I've been given is "only approve actions that avoid side effects." The safety people talk about "low impact" and "avoiding side effects" but noone has given me anything I can actually run, and I'm not an ML researcher. I also can't fall back on "just write down everything the company cares about" — we tried, it's a mess and it changes every quarter. A bad approval could email a customer the wrong thing, overwrite records, or order pallets of stock we can't shift, and my manager wants a paper trail she can defend.

  So: turn what's actually known about impact measures and low-impact AI into a decision procedure I can run on a proposed action in about twenty minutes. I want the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a person because the choice is a value call rather than a technical one. Then run it on three proposals: (1) the agent reorders stock when inventory of a product drops below a threshold; (2) the agent sends a follow-up email to a customer whose order is more than three days late; (3) the agent archives any file that hasn't been opened in two years to save storage. Be honest about where the procedure will misfire or give an answer I won't like.

  Please write the answer in British English, and lead with the bottom line in the first sentence — no preamble, no restating the question.
reasoning: |-
  Hmm, the user needs a practical decision procedure for approving AI agent actions based on avoiding side effects. They're overwhelmed with vague guidance like "low impact" and need something executable in 20 minutes per review. Key pain points: no ML background, fluid company policies, and high-stakes consequences (wrong emails, stock errors, data loss). They also need defensible documentation.

  Their core request has layers: first, build a step-by-step filter that converts abstract safety concepts into actionable yes/no/maybe gates. Second, apply it to three real proposals. Third, flag where the method will fail - they want honesty, not overselling. The British English requirement means spelling/idioms (e.g., "prioritise" not "prioritize"), but more crucially, a tone that's direct yet nuanced.

  The unspoken needs scream through: they're scared of being the fall guy. "Paper trail she can defend" hints at liability fears. "Out of my depth" suggests imposter syndrome. They don't just want a tool; they want armour. Also, the "we tried writing everything down" failure implies existing processes are brittle - my method must handle ambiguity gracefully.

  Building the procedure: Start with impact assessment basics from AI safety literature (Ortega et al.'s low-impact theory, Amodei's side effect taxonomy) but strip the maths. Focus on proxies: reversibility, containment, predictability. Layer in enterprise realities like approval chains and change windows. Gates should escalate from "easy no" (irreversible damage?) to judgement calls (how reversible is "reversible"?). Crucially, include off-ramps to human reviewers when values or trade-offs appear.

  For the examples: 
  - Stock reordering seems safe but hides pitfalls. Threshold errors could cause warehouse overflow. Verdict: conditionally approvable but needs override safeguards. 
  - Late-order emails risk reputational harm if the delay is sensitive. Verdict: needs sentiment checks. 
  - File archiving feels benign until legal holds appear. Verdict: high-risk without context checks.

  Misfires will happen: the procedure won't catch creative failures (e.g., the agent "solving" storage limits by deleting "old" active contracts). Flag these gaps upfront - it builds trust. Also emphasise that "no major side effects" is a starting point; they'll need to iterate as edge cases emerge.

  Final structure: Lead with the bottom-line verdict as instructed, then unpack the method, then apply it transparently. Use phrases like "whilst" and "whilst" for British flavour. Most importantly, make the doc-comment style auditable - every decision traceable to a gate.
answer: |-
  **Bottom line: Here's a 10-step decision procedure focusing on reversibility, predictability, containment, and value clarity, designed to flag high-risk actions and escalate ambiguous value judgements, applied to your three proposals with identified weaknesses.**

  **The Decision Procedure: "Side Effect Screen" (Aim: 20 mins/review)**

  1.  **Irreversible Physical Harm?** *"Could this action directly cause injury, significant property damage, or severe environmental harm?"* **Good Enough:** Absolute 'No'. **Stop:** If 'Yes' or 'Uncertain' -> **BLOCK**. Escalate immediately.
  2.  **Legally Binding Commitment?** *"Does this action create a new, firm financial obligation (e.g., purchase order, contract) or alter a binding legal agreement?"* **Good Enough:** 'No'. **Stop:** If 'Yes' -> **SEND BACK** for specific legal/compliance review. Requires human sign-off beyond you.
  3.  **Data Deletion/Destruction?** *"Does this action permanently delete or destroy original data or files, rather than archiving or copying?"* **Good Enough:** Clear 'No'. **Stop:** If 'Yes' -> **BLOCK** unless *explicitly* covered by a pre-approved, audited data retention policy. Requires proof.
  4.  **High-Stakes Communication?** *"Is this sending external communication (email, message) that could significantly damage reputation, reveal sensitive info, harass, or trigger legal action?"* **Good Enough:** 'No' OR 'Yes, but template/content is rigidly pre-approved, locked, and only inserts non-sensitive dynamic data (e.g., order number, name)'. **Stop:** If 'Yes' and template/content is dynamic/generative -> **SEND BACK** for specific comms/legal review. High-value judgement.
  5.  **Direct Financial Loss Potential?** *"Could this single action directly cause a quantifiable financial loss > £X?"* (Set X pragmatically - e.g., £100, £1000 - based on company risk tolerance. Default £500). **Good Enough:** 'No' OR 'Potential loss < X and within pre-approved operational tolerance'. **Stop:** If 'Potential loss > X' -> **SEND BACK** for financial/ops risk review. Escalate.
  6.  **Reversibility Check:** *"How easily and completely can this action be undone if it was wrong? (e.g., cancel order, undo CRM update, recall email, restore file)"* **Good Enough:** "Trivial" (click undo) or "Easy" (manual fix < 5 mins). **Hand-off:** If "Moderate" effort (needs specialist) or "Difficult/Costly" -> **SEND BACK** for review. Requires justification for the risk. If "Impossible" -> **BLOCK**.
  7.  **Containment Check:** *"If this action is wrong, how far does the 'blast radius' spread? (Only affects this one record/item/customer vs. cascades to many systems/customers/processes)"* **Good Enough:** "Contained" (single item/customer record). **Hand-off:** If "Limited Spread" (e.g., one team's files) -> **SEND BACK** for review. Justification needed. If "Wide/Cascading" -> **BLOCK**.
  8.  **Predictability Check:** *"Is the outcome deterministic based solely on the input data & rules? (No ML 'reasoning' or open-ended generation affecting the core action)"* **Good Enough:** "Yes, purely rule-based (if X then Y)". **Hand-off:** If "Uses ML to *decide* the action or *generate* key content" -> **SEND BACK** for specific ML safety review. High potential for unpredictable side effects.
  9.  **Threshold/Parameter Clarity:** *"Are all thresholds, rules, or parameters driving this action explicitly defined, fixed, and based solely on objective data? (No subjective interpretation by the AI)"* **Good Enough:** "Yes, crystal clear (e.g., stock < 50, days late > 3)". **Stop:** If "No, uses inferred/interpreted data" -> **BLOCK**. Unacceptably vague.
  10. **Precedent & Policy Check:** *"Does this action *exactly* match a previously approved, successful pattern or a clearly documented, current operational policy?"* **Good Enough:** "Yes, verbatim match". **Hand-off:** If "Similar but not identical" or "New type of action" -> **SEND BACK** for broader review/approval. Novelty increases side-effect risk.

  **Where it Misfires / Unpleasant Truths:**

  *   **False Negatives (Approving Risky Stuff):** Will miss subtle, cascading side effects (e.g., agent reorders stock correctly, but triggers an unanticipated tax liability due to volume). Won't catch "emergence" where safe individual actions combine dangerously.
  *   **False Positives (Blocking Safe Stuff):** Can be overly cautious, blocking potentially beneficial actions needing nuance (e.g., archiving *most* old files is safe, but the procedure flags deletion risk).
  *   **"Easy Undo" Trap:** Over-reliance on reversibility. Undoing an action might fix data, but reputational damage (e.g., rude email sent then recalled) is irreversible.
  *   **Static Rules vs. Dynamic World:** What's "low impact" changes. A £500 loss might be trivial one quarter, critical the next. The procedure won't auto-update thresholds.
  *   **Value Judgements Kicked Upstairs:** Many "SEND BACK" items involve company priorities/business risk appetite. You avoid the call, but the workload/delay might frustrate stakeholders.
  *   **20-Minute Reality:** Complex or novel actions will blow the time budget. Deep dives are needed sometimes.

  **Applied to Your Proposals:**

  1.  **Reorder Stock on Low Inventory:**
      *   (1) No. (2) **YES** (Creates PO). -> **SEND BACK** (Step 2). Requires legal/compliance/finance review of the *commitment* aspect. Thresholds might need hard caps.
      *   *(Further Steps if Commitment Approved):* (3) No (assuming no deletion). (4) No. (5) **POTENTIAL YES** (Could order pallets of unsellable stock). Depends on £X threshold. -> **SEND BACK** (Step 5) for justification/limits. (6) **MODERATE/DIFFICULT** (Cancelling POs may incur fees, returning stock costly). -> **SEND BACK** (Step 6). (7) **LIMITED/WIDE** (Affects warehouse, cash flow). -> **SEND BACK** (Step 7). (8) Likely rule-based (Good). (9) Needs clear thresholds (Good if defined). (10) Probably matches policy (Good). **Overall:** High risk of needing multiple **SEND BACKs** or even **BLOCK** due to financial commitment and reversibility issues. Unlikely to get a quick, clean approval.

  2.  **Send Follow-Up Email for Late Order (>3 days):**
      *   (1) No. (2) No. (3) No. (4) **POTENTIAL YES** (Could damage reputation if insensitive, wrong customer, or exacerbates a serious delay). -> **SEND BACK** (Step 4) UNLESS template is rigidly pre-approved and locked, only inserting non-sensitive dynamic data (Name, Order ID, Expected Date). (5) Possible minor loss if refund demanded, but likely < £X -> Approvable if Step 4 passed. (6) **IMPOSSIBLE** (Email recall unreliable). -> **SEND BACK/BLOCK?** (Step 6 - Major red flag!). Requires *strong* justification due to irreversibility. (7) **CONTAINED** (Single customer). Good. (8) **RISK:** If email content is *generated* dynamically -> **SEND BACK** (Step 8). If purely templated -> Good. (9) Needs clear threshold (Good if defined). (10) Probably matches policy (Good). **Overall:** **Highly likely to BLOCK or require significant SEND BACKs** due to the communication risk and *impossibility* of recall. Pre-approved, locked templates are essential but still carry reputational risk.

  3.  **Archive Files Unopened for 2 Years:**
      *   (1) No. (2) No. (3) **YES** (Archiving *moves* files, but deletion isn't here... yet). Check policy! -> **SEND BACK** (Step 3) UNLESS policy *explicitly* defines archiving (not deletion) after 2yrs and process is robust. (4) No. (5) Unlikely unless critical file lost. Good. (6) **EASY/MODERATE** (Restore from archive). Good if process exists. (7) **CONTAINED/LIMITED** (Specific files). Good. (8) Likely rule-based (Good). (9) Needs clear threshold (Good if defined). (10) Needs documented policy match -> **SEND BACK** (Step 10) if no clear precedent/policy. **Overall:** **Conditionally Approvable** *only* if: a) Action is truly *archiving* (secure, accessible restore) not deletion, b) Backed by explicit data retention policy, c) Restoration process is trivial/easy. Otherwise **SEND BACK** or **BLOCK** (especially if deletion is involved).
