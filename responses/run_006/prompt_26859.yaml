answer: |-
  You've hit on a fascinating and subtle point! While both approaches yield **p = 1/20** in the Platonia Dilemma, the reasoning and underlying philosophy are *fundamentally different*. Superrationality isn't *just* Nash Equilibrium with symmetry; it makes a much stronger metaphysical assumption.

  Here's a breakdown of the key differences:

  1.  **The Core Philosophical Assumption:**
      *   **Nash Equilibrium (Symmetric Mixed):** Players are *independent, rational individuals*. Each player chooses their mixed strategy (p=1/20) to maximize their *own expected payoff*, given that *all other players are also independent rational individuals* doing the same. The symmetry is an *outcome* of the equilibrium condition in a symmetric game. The "indifference" you calculated is crucial: at p=1/20 for others, Player i gets the *same expected payoff* whether they send or not, making them willing to randomize.
      *   **Superrationality (Hofstadter):** Players recognize they are in a *perfectly symmetric situation* and act *as if* they are *indistinguishable facets of a single rational entity*. They don't assume others are independent; they assume their own decision process is *logically identical* to everyone else's, implying their choices are *perfectly correlated* in a specific way. They ask: "What single choice rule, if adopted identically and *non-independently* by *all* of us, leads to the best *collective* outcome?" The symmetry is the *fundamental starting premise*, not just an equilibrium condition.

  2.  **How Probability is Derived:**
      *   **Nash:** Probability is a tool for creating indifference. Players *choose* to randomize *precisely because* it makes them indifferent, which is necessary for randomization to be optimal given others' randomization.
      *   **Superrationality:** Probability arises from the *requirement of symmetry* and the *goal of maximizing the group's chance of winning*. If all players use the *same deterministic rule*, they all do the same thing (all send or none send), leading to failure. The *only* symmetric way to have *exactly one* person send is if they all use the *same* mixed strategy with p=1/20. Crucially, superrationality implies this randomization happens in a *perfectly coordinated* way due to the symmetry – it's not independent flips.

  3.  **The Nature of Randomization & Outcome:**
      *   **Nash (Independent Randomization):** Each player flips their *own* biased coin (p=1/20) independently.
          *   Probability *anyone* wins: `1 - (19/20)^20 ≈ 64.1%`
          *   Probability *exactly one* wins: `20 * (1/20) * (19/20)^19 ≈ 37.7%`
          *   Probability *no one* wins: `(19/20)^20 ≈ 35.8%`
          *   Probability *more than one* wins: `≈ 26.1%`
      *   **Superrationality (Perfectly Correlated Randomization):** The symmetry implies a *single, shared random event* determines the outcome as if one "universal coin" is flipped *once* to select the winner. They act *as if* only one person is "fated" to send, chosen uniformly at random.
          *   Probability *anyone* wins: **100%** (Exactly one person is always selected by the symmetric process).
          *   Probability *exactly one* wins: **100%**
          *   Probability *no one* wins: **0%**
          *   Probability *more than one* wins: **0%**

  4.  **The Payoff Perspective:**
      *   **Nash:** Players achieve an equilibrium where no one *regrets* their strategy choice *given the independence*. Their *expected* payoff is positive but uncertain (`≈ (1 billion * 37.7%) / 20` per player, ignoring the tiny cost of sending).
      *   **Superrationality:** Players achieve the *objectively best possible group outcome* (someone *always* wins the billion) *because* they transcend individual rationality and act as one collective mind adhering to the symmetric ideal. The probability `p=1/20` is chosen *because* it's the only symmetric rule guaranteeing success.

  **Why the Confusion? (And What You're Missing)**

  You're absolutely right that *mathematically*, the symmetric mixed-strategy Nash and the superrational prescription both specify `p = 1/20` for each player. **This is why you get the same number.** However:

  1.  **The Interpretation of p=1/20 is Radically Different:** In Nash, it's an independent randomization creating indifference. In Superrationality, it's a perfectly correlated randomization ensuring collective success.
  2.  **The Predicted Outcome is Vastly Different:** Nash predicts frequent failure (no win or multi-win ≈ 62.3% of the time). Superrationality predicts guaranteed success (exactly one winner 100% of the time).
  3.  **The Justification is Different:** Nash justifies `p=1/20` through individual incentive compatibility (`U(send) = U(not send)`). Superrationality justifies it through collective optimality under a symmetry constraint.

  **Is Superrationality just Nash with Symmetry?**

  **No.** While symmetry *is* a key component of both approaches in this symmetric game, the core difference is the **assumption about independence vs. logical entanglement.**

  *   Nash Equilibrium **assumes independent players** maximizing individual payoffs *given* that independence. Symmetry arises naturally *within* this framework for symmetric games.
  *   Superrationality **denies independence** as the correct model in perfect symmetry. It posits that perfect logical symmetry *implies* non-independent, correlated decision-making focused on the collective outcome. Symmetry is the *axiomatic foundation*, not just a consequence.

  **In essence:** Nash tells independent players how to randomize to avoid being exploited. Superrationality tells logically entangled players how to "randomize" *together* to succeed. The `p=1/20` arises in both, but for profoundly different reasons and with profoundly different predicted results. You identified the mathematical coincidence but correctly sensed a deeper conceptual difference – the independence assumption vs. the "collective mind" assumption is the crux of it. Hofstadter's superrationality is a much more radical (and metaphysically loaded) idea than standard game-theoretic equilibrium.
