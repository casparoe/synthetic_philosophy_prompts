  i've been trying to wrap my head around superrationality and i keep getting stuck on the Platonia dilemma. the setup: 20 people, a trillionaire says exactly one person has to send a telegram to win a billion dollars, no coordination allowed. the superrational answer is supposidly to send with probability 1/20. but when i work out the symmetric mixed-strategy nash equilibrium for this game, i also get p = 1/20 — each player is indifferent between sending and not sending when everyone else sends with probability 1/20. so it looks like superrationality just gives you the same answer as nash equilibrium here. am i missing something, or is superrationality basically just nash equilibrium with some symmetry assumptions baked in?
