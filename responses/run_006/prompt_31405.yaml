prompt: |-
  I'm a backend engineer and I've been reading about AI alignment on the side, mostly blog posts and some LessWrong stuff. One thing I keep tripping over is that people seem to be talking past each other because they have totally different instincts about whether we should be reasoning about worst-case outcomes or about what's likely on average. Like, some folks talk as if we need ironclad guarantees that hold even for a superintelligence that's actively searching for loopholes, and others seem to think that's kind of paranoid and we should just build systems that work well in practice and iterate.

  I want to get clearer on what the actual positions are here, not just the labels people use. Could you write me a decision tree or taxonomy that starts from the question of worst-case vs. average-case reasoning and branches out from there? I want each branch point to be a concrete claim someone could agree or disagree with without knowing which "camp" it puts them in. The leaves should be distinct approaches to alignment (named if they have names, or "unnamed" if the position is logically possible but nobody really holds it). 

  For the leaves, I'd especially want to see: MIRI-style agent foundations work, RLHF / empirical alignment, debate / iterated amplification, and capability-constrained deployment (like, "just don't build systems smarter than us"). But if the tree naturally generates other positions I haven't heard of, that's great too.

  Also, flag any pairs of leaves that your tree can't cleanly separate — like, if two positions agree on every branching question you've got but still feel different in practice, say so. And if some combination of answers is logically possible but nobody defends it, note that too and say whether you think it's because the view is incoherent or just unexplored.

  I don't need a bibliograpy or anything, just the tree. Oh, and if you could keep it to like 8-12 leaves max so I can actually wrap my head around it, that'd be ideal.
