prompt: |-
  I've been turning over a pattern I keep running into, and I'm hoping someone can tell me whether it has an established name — and if it doesn't, what it should be called.

  The pattern goes like this. Someone is offered a thing they badly want, but getting it requires being able to make a promise, or form a genuine intention, to do something later that, when later arrives, they will have no reason at all to do — and everyone in the situation knows this. A driver won't stop unless you can convince him you'll pay after the ride, even though he knows that once you're out of the car you'd have no reason to hand over the money. A billionaire will pay you tomorrow morning if you can sincerely intend tonight to make yourself sick tomorrow afternoon, and the money gets paid whether or not you actually follow through. Faking the intention doesn't help, because the other party — or the setup itself — can tell the differnce between a real intention and a plan you'll drop the moment it stops paying. So the only route to the benefit seems to be to actually become the kind of person who will do the later thing: to make your future self act against its own reasons, out of stubborness or honor or some disposition you can't switch off.

  What's strange to me is that this move looks rational and irrational at once. It's rational because it's the only way to get what you want. But you're also deliberately paying to acquire a disposition to act against your own interests later, which sounds like a definition of being irrational. I know about commitment devices, but those usually work through external scaffolding — contracts, reputation, burning bridges, making the bad option impossible or costly. Here there's nothing external; the enforcement is entirely inside your own head, and what you're installing isn't a constraint on your options but a change in what you'll find yourself doing. So: does this configuration have a name of its own, or is it just a special case of something broader? If it has a name, I want more than the label — I want it carved off from the neighboring things, especially ordinary self-control and the reverse of weakness of will. If it doesn't have a name, coin one and define it with clear edges. Please answer as exactly five numbered items, a sentence or two each, no introduction or conclusion.
reasoning: |-
  Hmm, the user is describing a fascinating philosophical dilemma about making commitments that defy future self-interest. They've presented it through vivid examples like paying a driver after arriving or getting paid to intend future self-harm. The core tension they're wrestling with is how this act seems simultaneously rational (as the only path to a desired outcome) and irrational (because it deliberately cultivates self-sabotaging dispositions).

  I notice they've explicitly ruled out standard commitment devices like contracts or burned bridges, focusing purely on internal psychological enforcement. Their request for "clear edges" suggests they want precise conceptual boundaries, especially distinguishing this from ordinary willpower or akrasia. The five-item format demand means I'll need to distill this into surgical points without fluff.

  Breaking this down: First, the mechanism involves cultivating an immutable character trait (honor/stubbornness) that overrides future rationality. Second, the rationality paradox stems from meta-rationality - it's instrumentally rational despite being substantively irrational. Third, this differs from Ulysses pacts because those constrain actions externally, while this modifies decision-making psychology itself. Fourth, it's not akrasia but its opposite - a cultivated "strength of will" that persists against reason. Fifth, existing terms like "self-binding" or "paternalism" don't quite fit because the constraint is endogenous character change rather than external rules.

  The coinage "characterological commitment" seems apt because it centers on identity modification. "Instrumental character mutation" could work too but feels clunkier. Crucially, I must emphasize this isn't about suppressing impulses (like dieting) but installing counter-rational drives. The driver example perfectly illustrates the zero-enforcement scenario where only internalized honor secures the deal.

  User seems philosophically sophisticated - they're likely familiar with Kavka's toxin puzzle and Schelling's commitment theories but want this specific psychological twist carved out. Their frustration with existing terminology is palpable. I'll avoid mentioning "hyperbolic discounting" or "time inconsistency" since they want psychological mechanisms, not behavioral economics.
answer: |-
  Here are five numbered items defining and naming this specific configuration:

  1.  **Term:** This is a **Characterological Commitment Device**, distinct from external commitment mechanisms by relying solely on internalized character traits to enforce future actions against self-interest.
  2.  **Mechanism:** It necessitates deliberately modifying one's character (e.g., cultivating inflexible honor or pathological stubbornness) to *become* the type of person who will perform an action solely because it was previously intended, even when all external reasons vanish.
  3.  **Rationality Paradox:** The modification is instrumentally rational *ex-ante* (securing the immediate benefit) but substantively irrational *ex-post* (the enforced action lacks intrinsic reason), creating an identity-based solution to a mutual predictability problem.
  4.  **Distinction from Self-Control/Ulysses Pacts:** Unlike willpower or external pre-commitments (e.g., burning bridges), this relies on *changing one's fundamental decision-making disposition* to ensure the action occurs automatically or out of perceived identity, not effortfully overcoming temptation.
  5.  **Distinction from Akrasia:** It is the deliberate *cultivation* of a disposition to act *against* future self-interest (a form of planned "strength of counter-rational will"), contrasting sharply with weakness of will where one *fails* to act on their own best judgment.
