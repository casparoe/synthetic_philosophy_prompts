    - After Step 3, if we have passed all checks (or if we have handoffs that are resolved as acceptable) then we flag the system as requiring further ethical review for potential moral patienthood.

  But note: we might want to combine these. Alternatively, we can have a scoring system and then a threshold. However, for simplicity, we design a step-by-step.

