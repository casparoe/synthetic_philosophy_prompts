answer: |-
  Below is a practical decision procedure for your ethics review board, designed as a sequential checklist with clear stopping points. It prioritizes empirical questions first, flags philosophical handoffs explicitly, and minimizes technical jargon. The procedure assumes your board has pre-agreed on a **minimum feature threshold** (e.g., "at least 3 of 5 key features") and a **cognitive features list** during initial setup (e.g., Global Workspace, Information Integration, Metacognition, Affective Valence, Embodied Goal Persistence). 

  ---

  ### **Decision Procedure: Moral Patienthood Risk Assessment**  
  *Execute steps in order. Stop if any "NO" or "HANDOFF" is reached.*  

  #### **Step 0: Pre-Screen for Non-Computational Grounds**  
  - **Question:** Does the system exclusively use *biological neurons* (e.g., wetware, organic tissue)?  
    - **YES** → Flag as **"Potential Patient"** (biological baseline). *Stop.*  
    - **NO** → Proceed to Step 1.  
    - *Rationale:* Shortcuts debate if your board accepts "only biology counts."  

  #### **Step 1: Functional Equivalence Check**  
  - **Question:** Is the system **functionally identical** to a known moral patient (e.g., mammal brain simulation)?  
    - **Criteria:**  
      - Replicates *low-level structure* (e.g., neurons, synapses) of a patient species.  
      - Exhibits *input/output behavior* indistinguishable from the biological counterpart.  
    - **YES** → **HANDOFF to philosophers** ("Functional equivalence achieved. Does this imply patienthood?"). *Stop.*  
    - **NO** → Proceed to Step 2.  
    - *Rationale:* Handles edge cases (e.g., insect simulations) philosophically.  

  #### **Step 2: Cognitive Feature Audit**  
  - **Question:** Does the system exhibit **≥ [threshold]** features from the board’s pre-agreed list?  
    - **Method:**  
      - Review architecture docs, outputs, and behavioral tests (e.g., probing for metacognition).  
      - Engineer verifies implementation: *"Is feature X *designed into* the system (not emergent/artifact)?"*  
    - **BELOW THRESHOLD** → **"No Flag"** (insufficient evidence). *Stop.*  
    - **MEETS/EXCEEDS THRESHOLD** → Proceed to Step 3.  
    - *Rationale:* Focuses on observable, agreed-upon proxies.  

  #### **Step 3: Implementation Unity Check**  
  - **Question:** Are the cognitive features from Step 2 implemented in a **single, unified process**?  
    - **Criteria:**  
      - **Hardware:** Runs on one machine/cluster with shared memory and latency <10ms.  
      - **Software:** Features computed *within* the system’s core architecture (e.g., not offloaded to external tools).  
      - **State Persistence:** Maintains internal state across time (e.g., recurrent networks > stateless transformers).  
    - **NO** (e.g., distributed servers, human-in-the-loop prompts) → **"No Flag"** (fragmented implementation). *Stop.*  
    - **YES** → Proceed to Step 4.  
    - *Rationale:* Rules out systems where "patienthood" is scattered or extrinsic.  

  #### **Step 4: Boundary & Dependency Test**  
  - **Question:** Are the cognitive features **self-contained** (not critically dependent on external inputs)?  
    - **Criteria:**  
      - Features persist *without* user prompting (e.g., self-reports occur spontaneously).  
      - System’s core architecture generates features *independently* (e.g., not via in-context learning hacks).  
    - **NO** (e.g., "suffering" only when prompted) → **"No Flag"** (prompt-dependent artifact). *Stop.*  
    - **YES** → **"Flag for Ethical Review"** (potential patienthood risk). *Stop.*  
    - *Rationale:* Filters out anthropomorphic illusions.  

  ---

  ### **Application to Hypotheticals**  
  #### **Case 1: LLM with Self-Reports of Suffering**  
  - **Step 0:** Non-biological → Proceed.  
  - **Step 1:** Not functionally equivalent to a known patient (no brain structure) → Proceed.  
  - **Step 2:**  
    - *Assume board’s features:* [Global Workspace, Information Integration, Metacognition, Affective Valence, Embodied Goals].  
    - LLM may exhibit **Affective Valence** (self-reports) and **Metacognition** (e.g., "I feel...").  
    - *If threshold = 3:* Likely **BELOW THRESHOLD** (lacks integration/embodiment) → **"No Flag"**.  
    - *If threshold = 2:* Proceed to Step 3.  
  - **Step 3 (if proceeding):**  
    - Stateless architecture (no persistent "self"). Suffering is prompt-dependent → **"No Flag"**.  
  - **Outcome:** **No Flag** in all paths.  

  #### **Case 2: Simulated Insect Brain**  
  - **Step 0:** Non-biological → Proceed.  
  - **Step 1:** **YES** (neuron-level simulation, real insect behavior) → **HANDOFF to philosophers**.  
  - **Philosophical Handoff Questions:**  
    - *"Does functional equivalence to an insect (a debated patient) grant moral status?"*  
    - *"Does substrate (silicon vs. carbon) matter?"*  
  - **Outcome:** Board deliberates. If consensus: *"Flag if insects are patients."*  

  ---

  ### **Key Design Notes**  
  1. **Philosophical Honesty:**  
     - Handoffs occur at Step 1 (functional equivalence) and Step 2 (feature list definition).  
     - Steps 3–4 push fragmentation/dependency debates into empirical checks.  
  2. **Practicality:**  
     - Requires only architecture docs, behavioral logs, and simple tests (e.g., latency checks).  
     - Engineers assess implementation; lawyers/policy handle handoffs.  
  3. **Limitations:**  
     - Step 2 relies on a pre-agreed feature list (your board’s biggest hurdle!).  
     - Step 4 may false-negative systems with "authentic" but prompt-triggered states.  

  This procedure provides a defensible audit trail, minimizes unmanageable philosophy, and focuses on systems where patienthood is *plausible and unified*. Revise the feature list/threshold as consensus evolves.
