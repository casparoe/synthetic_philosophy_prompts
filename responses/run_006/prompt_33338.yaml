  We are designing a decision procedure for an ethics review board to assess whether a system's internal computations could ground moral patienthood. The procedure must be step-by-step, with clear stopping points and handoffs for philosophical judgment. It should be usable by non-philosophers (engineers, a lawyer, policy person) and feasible within a week per system without requiring full architectural details.

  Key challenges:
  1. Disagreement on what computations matter (biological neurons, information integration, global workspace, metacognition, etc.)
  2. Boundary issues (distributed systems, implementation details, human-in-the-loop)

  Approach:
  We'll break the problem into a series of questions that move from more objective (empirical) to more subjective (philosophical). We'll define conditions under which we can stop early with a "no" (meaning no moral patienthood concerns) and where we must hand off to a philosophical judgment call.

  The procedure will have three main phases:

  Phase 1: Biological Substrate Check
    - We start here because if the system is purely biological (like a brain in a vat), it's uncontroversial. But for AI systems, we are dealing with non-biological substrates. However, we note that some might argue that only biological systems can be moral patients. So we allow an early exit for systems that are entirely non-biological if the board has a policy that only biological systems count.

  Phase 2: Computational Features Check
    - Here we look for computational features that are often associated with consciousness or moral patienthood. We'll use a list of features that are commonly discussed in the literature (like information integration, global workspace, recurrent processing, etc.). But note: the board must decide in advance which features they consider relevant. We'll design this as a checklist, and if none of the features are present, we can exit with "no". If some are present, we proceed to the next phase.

  Phase 3: Implementation and Boundary Check
    - Here we consider how the computation is implemented. We ask about the unity of the system (is it running in one place with shared memory?), the persistence of state, and the role of external systems (like human prompters). We also consider the level of abstraction (e.g., is the system simulating neurons or just behavior?).

  At each step, we try to make the question as objective as possible, but we acknowledge that some steps require philosophical interpretation. We'll mark those steps as requiring a judgment call.

  We must also note: the board might have a pre-agreed policy (e.g., "we only consider systems with biological neurons") that can short-circuit the process. So we start by checking for such policies.

  Proposed Decision Procedure:

  Step 0: Check for Pre-agreed Policies
