      - Actually, we want to catch systems that might be moral patients regardless of substrate. So we don't want to rule out non-biological systems. Instead, we note that some board members might think substrate matters. So:

    - Alternative: We start by asking if the board has a policy that only biological systems count. If yes, then for non-biological systems, we immediately return "no". If no, then we proceed to check computational features.

    Let's restructure Step 0 to include:

  Step 0: 
    a) Check for any pre-agreed necessary conditions for moral patienthood that the system must meet (e.g., biological substrate, minimum Φ, etc.). If the system fails any necessary condition, stop and return "no".
    b) Check for any pre-agreed sufficient conditions. If the system meets a sufficient condition, stop and return "yes".
    c) If no pre-agreed conditions apply, proceed.

  Then:

  Step 1: Check for Basic Functional Equivalence to Known Moral Patients
    - Does the system implement, in a functionally equivalent way, the known neural processes of an organism that is uncontroversially a moral patient (e.g., a mammal, bird, etc.)? 
      - For example: is the system a detailed simulation of a known animal brain at the neural level? 
