prompt: |-
  Okay so we're doing a unit on the Civil War and my history teacher keeps quoting Frederick Douglass saying the Constitution is "a glorious liberty document." She uses it to shut down anyone who says the founders were just pro-slavery hypocrits. But I've read some of the actual speech and it seems like he's doing a lot more than just saying "the Constitution is good actually." Like, he's making a specific argument about how to read the text, what's NOT in it, about natural rights… I'm not sure she's using it right.

  Can you act as an expert on Frederick Douglass's constitutional thought and 19th century abolitionist debates? Think carefully and lay out all the different precise claims that could be packed into "the Constitution is a glorious liberty document." Like, from the weakest/least controversial reading to the strongest/most radical one, and for each one tell me whether it's plausible and whether it's what Douglass himself was actually arguing in the 1850s. Also tell me which reading my teacher is probably relying on when she uses it to deflect the "founders were hypocrites" point. I want to bring something smart to the next class discussion, not just parrot the slogan back.
