prompt: |-
  I am taking a seminar on Indian Buddhist philosophy, and we have been working through the Madhyamaka treatment of the catuṣkoṭi, the four alternatives according to which a statement might be true, false, both true and false, or neither true nor false. Several of my classmates describe this as a four-valued logic, and some go further, claiming that because Nāgārjuna rejects all four alternatives when discussing the ultimate nature of things, he must be committed to true contradictions or to a rejection of the law of non-contradiction.

  I am struggling to see how this can be right, and I would like to understand how the tetralemma is actually supposed to function. If it is a genuine logic, how should the four alternatives be formalized — as truth values, as modal operators, or as something else? And if all four are denied, does Madhyamaka not end up affirming the negation of the entire tetralemma, which looks like a fifth position and, worse, a self-undermining one? More generally, I would like to know whether the catuṣkoṭi should be read as a formal logical system at all, and, if not, what philosophical work its fourfold negation is doing in the Madhyamaka account of emptiness.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a seminar on Indian Buddhist philosophy, specifically Madhyamaka's use of the catuṣkoṭi (tetralemma). Their classmates are interpreting it as a four-valued logic, suggesting Nāgārjuna's rejection of all four options implies true contradictions or a denial of the law of non-contradiction. The user is skeptical and wants to understand how the tetralemma actually functions.

  First, I need to recall the basics of the catuṣkoṭi. It's a fourfold structure: (1) true, (2) false, (3) both, (4) neither. Nāgārjuna applies this to metaphysical claims, especially about the ultimate nature of reality (śūnyatā). The key point is his rejection of all four positions. The user is confused because rejecting all four seems to create a fifth option, which could be self-undermining.

  The classmates' view of it as a four-valued logic might be a common misunderstanding. Modern logic frameworks don't map neatly onto ancient Buddhist thought. I should explain why formalizing it as truth values doesn't work. For example, the "both" option isn't a truth-value but might refer to context-dependent truths or different perspectives. Similarly, "neither" could indicate ineffability rather than a new truth value.

  The user's deeper concern seems to be about consistency. If Nāgārjuna denies all four, isn't he implicitly affirming a fifth? That's the paradox of negation. But in Madhyamaka, negation is not propositional but therapeutic. The tetralemma is a tool to deconstruct reification, not to establish a position. Emptiness itself is empty, so there's no assertion. The rejection is meant to stop conceptual proliferation (prapañca).

  Also, the user mentions self-undermining. The response should address how Madhyamaka avoids this by applying emptiness to its own statements. Nāgārjuna's negations are provisional, not absolute. The purpose is soteriological—freeing the mind from attachments to views.

  I should emphasize the difference between conventional and ultimate truth. The tetralemma operates on the ultimate level, where no fixed positions hold. Conventional truths are pragmatically useful but not ultimately real. This two-truths doctrine resolves the apparent contradiction in denying all options.

  The user might also need clarification on why this isn't a logic system. The tetralemma is a dialectic method, not a formal logic. It's about exposing the limits of language and thought, not assigning truth values. Historical context matters here; Indian logic had different priorities than Western symbolic logic.

  In conclusion, the key points are the therapeutic purpose of negation, the two-truths framework, and the non-propositional nature of Madhyamaka. Addressing the fifth lemma concern by showing that no position is affirmed, including the negation itself, through the concept of emptiness applied reflexively.
answer: |-
  Your skepticism is well-founded—interpreting the Madhyamaka catuṣkoṭi as a four-valued logic or proof of true contradictions fundamentally misreads Nāgārjuna's project. The catuṣkoṭi functions as a **dialectical tool for de-reification**, not a formal logical system. Let's break this down step-by-step:

  ### 1. **The Catuṣkoṭi is Not a Formal Logic**
     - **Misconception of "Values"**: Your classmates' "four-valued logic" framing treats the four positions (true, false, both, neither) as truth-functional values. But Nāgārjuna uses them as *exhaustive metaphysical options* for describing *svabhāva* (inherent existence). He rejects all four *only* in the context of ultimate reality (*paramārtha-satya*).
     - **"Both" and "Neither" are Not Truth Values**:  
       - "Both" (e.g., "exists and does not exist") typically addresses *conventional* perspectives (e.g., a thing exists temporarily but lacks eternal essence).  
       - "Neither" (e.g., "neither exists nor does not exist") signifies *ineffability*—the failure of language to capture ultimate truth.  
     - **No Truth-Value Gaps/Gluts**: Nāgārjuna isn't proposing a logic with new truth values. He rejects all positions to demonstrate that conceptual frameworks (including logic) collapse when applied to emptiness (*śūnyatā*).

  ### 2. **Formalizing the Tetralemma? A Dead End**
     - **Classical Logic Cannot Capture It**: Formalizing the catuṣkoṭi in propositional logic leads to nonsense. Take a proposition *P*:  
       - K1: *P*  
       - K2: ¬*P*  
       - K3: *P* ∧ ¬*P*  
       - K4: ¬(*P* ∨ ¬*P*) ≡ ¬*P* ∧ ¬¬*P* ≡ ¬*P* ∧ *P*  
       K4 reduces to K3, violating the Law of Non-Contradiction (LNC). Worse, denying all four implies:  
       ¬K1 ∧ ¬K2 ∧ ¬K3 ∧ ¬K4  
       But ¬K3 = ¬(*P* ∧ ¬*P*) is tautologically true (by LNC), and ¬K4 = ¬(¬*P* ∧ *P*) is also tautological. This makes the denial inconsistent.  
     - **Modal Interpretations Fail Too**: Reading K3/K4 as modal operators (e.g., "possible *P*") doesn't resolve the issue. Nāgārjuna's rejection targets *all* conceptualizations, including modal ones.  

  ### 3. **Denying All Four: Self-Undermining? No—Emptiness to the Rescue**
     - **The "Fifth Lemma" Objection**: If Nāgārjuna denies K1–K4, isn't he asserting a fifth position (¬K1 ∧ ¬K2 ∧ ¬K3 ∧ ¬K4)? And doesn't this violate his own critique?  
       - **Madhyamaka Response**: Nāgārjuna preempts this in *Mūlamadhyamakakārikā* (MMK 22:11):  
         > *śūnyam iti na vaktavyam aśūnyam iti vā bhavet \|  
         ubhayaṃ nobhayaṃ ceti prakṛtyāiva ca kathyate*  
         *"Empty" should not be asserted. "Non-empty" should not be asserted.  
         Neither both nor neither should be asserted. They are only used conventionally.*  
         **The negation is itself empty**. Emptiness (*śūnyatā*) is not a positive thesis; it negates *all* reified views, including its own formulation. This is the famous *prasaṅga* (reductio) method: showing all positions lead to absurdity without asserting an alternative.  
     - **Non-Apprehension (*anupalabdhi*)**: The goal isn't to affirm a contradiction but to induce *freedom from conceptual proliferation* (*prapañca*). Denying K1–K4 exposes the mind's tendency to cling to categories—even "contradiction"—as inherently existent.  

  ### 4. **Philosophical Work: Why Use the Catuṣkoṭi?**
     - **Therapeutic De-reification**: The tetralemma is a tool to dismantle attachment to views. By rejecting all four options regarding *svabhāva*, Nāgārjuna shows that:  
       - Concepts like "exist," "not exist," etc., are only coherent conventionally (*saṃvṛti-satya*).  
       - Ultimate truth (*paramārtha-satya*) is **non-conceptual**—it cannot be captured by any logical schema.  
     - **Two Truths Doctrine**: The catuṣkoṭi operates at the level of ultimate analysis. Conventionally, Nāgārjuna accepts dependent origination (*pratītyasamutpāda*) and everyday logic. Only when we reify phenomena does the tetralemma reveal their incoherence.  
     - **Soteriological Aim**: This isn't logic-play; it's a path to liberation. Clinging to views (even "both/neither") sustains suffering. Emptiness, realized via negating the tetralemma, ends conceptual fixation.  

  ### Conclusion: What Nāgārjuna is (and isn't) Doing
  - **Not Advocating True Contradictions**: Rejecting K1–K4 doesn't affirm a contradiction (K3). It exposes the inadequacy of *all* logical options for ultimate reality.  
  - **Not Rejecting the LNC Conventionally**: Madhyamaka uses conventional logic to function in the world. The LNC is undermined *only* for reified metaphysical claims.  
  - **Not a Formal System**: The catuṣkoṭi is a *dialectical strategy* rooted in Buddhist epistemology (e.g., avoiding the "unanswerable questions" in the *Acintita Sutta*).  

  **Key Takeaway**: Nāgārjuna’s negation of the tetralemma is a radical critique of ontology itself. It reveals that logic is a conventional tool, invalid for characterizing emptiness. To formalize it as a logic misses its purpose: to liberate us from the illusion that reality can be captured by concepts.  

  For further reading: Jay Garfield’s *The Fundamental Wisdom of the Middle Way* (MMK translation/comments) and Jan Westerhoff’s *Nāgārjuna’s Madhyamaka* clarify these points rigorously. Your intuition is correct—resist the four-valued logic misstep!
