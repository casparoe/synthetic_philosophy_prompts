  Your intuitions across these cases reveal a tension between two principles for handling self-locating evidence: the **Self-Sampling Assumption (SSA)** and the **Self-Indication Assumption (SIA)**. SSA says you should reason as if you're a random observer from all observers in your world. SIA says you should weight worlds by the number of observers, treating your existence as evidence for worlds with more observers. Neither aligns perfectly with all your judgments, but a hybrid approach—**indexical updating only when there is causal duplication of indistinguishable experiences**—can explain your reactions. Let's break it down:

  ### Your Verdicts and the Principle
  1. **Standard Sleeping Beauty (1/3)**:  
     - You update to 1/3 because awakenings are indistinguishable, and Beauty is "duplicated" in Tails. This fits SSA: you're randomly sampled from the set of awakenings (Heads: 1 awakening, Tails: 2 awakenings).  
     - **Principle**: Update when there is causal duplication of identical experiences (memory erasure ensures indistinguishability).

  2. **Many awakenings (1/101)**:  
     - Same as (1): more duplicates under Tails mean stronger evidence against Heads.  
     - **Principle**: Indexical update scales with the number of duplicates.

  3. **God's coin toss (1/3)**:  
     - Structurally identical to (1): Tails creates two identical rooms, and you're randomly sampled from them.  
     - **Principle**: Again, causal duplication (one person duplicated) with indistinguishable rooms warrants update.

  4. **You are person #1 (1/2)**:  
     - Learning "I am Person 1" breaks the symmetry. Person 1 exists in both worlds, so no duplication applies to you specifically. The extra person in Tails (Person 2) doesn't affect your identity.  
     - **Principle**: When you receive identifying information that anchors you to a "fixed reference" (Person 1 exists in both worlds), you revert to the prior. No indexical uncertainty about *who* you are remains.

  5. **The big universe (1/2)**:  
     - Here, you feel no update because there's no causal duplication tied to you. The number of observers is a fixed property of the theories, not a random outcome you're part of. You'd exist in either theory, so your existence isn't evidence for B.  
     - **Principle**: No causal duplication of *your specific experience*. You're not "copied" in B; you're just one of many unique observers. Theories A and B are static, so no indexical update occurs.

  ### Resolving the (3) vs. (5) Tension
  - **(3) updates, (5) doesn't** because:  
    - In (3), God's coin toss **causes duplication** of identical observer-slots (rooms). You're uncertain which slot you occupy, so you update.  
    - In (5), the universe size is a **fixed parameter**. You aren't duplicated; you're a unique being. No causal process makes your existence more likely under B. Your existence is a given, so you don't update.  
    - **Key**: Update only when there's a *process* (like a coin flip) that generates indistinguishable copies *of you*. (3) has this; (5) does not.

  ### Principle Summary
  **Adopt this rule**: Update credences based on self-locating evidence **only when you are causally duplicated in indistinguishable states by a random process** (e.g., awakenings, room-creations). If you receive information that anchors your identity (e.g., a unique label), revert to non-indexical priors. In static scenarios without duplication (e.g., universe size), no update occurs.

  ### Abandon a Verdict?
  - **Don't abandon any—they cohere under the principle above**.  
  - If forced, you might reconsider (3) to avoid the (3)/(5) conflict, but your 1/3 intuition is strong and widely shared. The hybrid principle preserves it while explaining (5).

  ### Your Final Scenario: Among the First 100
  - **Setup**: Same as (5), but you learn you're among the first 100 conscious beings.  
  - **Verdict**: Credence for Theory A (100 beings) should **jump to nearly 1.0**.  
  - **Why**: Now you have indexical information!  
    - Under A: All 100 beings are "first 100," so your chance of being in this group is 1.  
    - Under B: Only 100 out of 100 billion are "first 100," so your chance is 1 in 1 billion.  
    - Bayes:  
      $$P(A | \text{first 100}) = \frac{P(\text{first 100} | A) \cdot P(A)}{P(\text{first 100})} = \frac{1 \cdot 0.5}{1 \cdot 0.5 + (10^{-9}) \cdot 0.5} \approx 1.0$$

  This aligns with the principle: new indexical evidence ("I'm in the first 100") breaks the symmetry and favors the world where that claim is likelier (A).
