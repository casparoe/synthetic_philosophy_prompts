prompt: |-
  I've been teaching Plato's Laws in my ancient political thought seminar for years, and I keep coming back to this passage in Book I where the Athenian Stranger defends drinking parties as a kind of moral training ground. Every time I read it I feel like I'm missing something about the actual mechanism he's proposing. Here's the relevant bit, from the Bury translation (around 649a–e):

  "And is not this exactly the opposite of the potion described just now? For, first, it makes the person who drinks it more jovial than he was before, and the more he imbibes it, the more he becomes filled with high hopes and a sense of power, till finally, puffed up with conceit, he abounds in every kind of licence of speech and action and every kind of audacity, without a scruple as to what he says or what he does. ... It appears then that we ought to be placed amongst those conditions which naturally tend to make us exceptionally confident and audacious when we are practising how to be as free as possible from shamelessness and excessive audacity, and fearful of ever daring to say or suffer or do anything shameful. ... And for the purpose, first, of providing a cheap and comparatively harmless test of these conditions, and, secondly, of affording practice in them, what more suitable pleasure can we mention than wine, with its playful testing—provided that it is employed at all carefully?"

  The basic claim seems to be that wine is a cheap and comparatively harmless test of character because it temporarily induces shamelessness and audacity, and by exposing yourself to those conditions in a controlled setting you somehow get better at resisting them in real life. But I'm not sure I understand how the training is supposed to work. If wine makes you audacious and shameless, then drinking it doesn't seem like practice in self-control — it seems like temporarily disabling self-control. That would be like saying the way to get better at not punching people is to take a drug that makes you want to punch people and then try not to. What am I missing? Is there a reading of this passage where the logic actually hangs together, or is Plato just being sloppy here? I'd especially appreciate help untangling whether the "test" and the "practice" are doing two different things or whether he's conflating them — and if they are distinct, what the practice consists in exactly.
