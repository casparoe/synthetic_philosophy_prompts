prompt: |-
  I'm a graduate student in the philosophy of mathematics, currently taking a seminar on the epistemology of mathematical reasoning, and I also TA for the department's undergraduate course in the same area. In two weeks I have to run an eighty-minute section on the role of heuristic arguments in mathematics — specifically, the way mathematicians treat events as independent even when there is no underlying chance process, as in the heuristic density arguments for twin primes or Goldbach. The room will be mostly second- and third-year mathematics majors who have had probability but no philosophy, plus a few philosophy majors who will become suspicious the moment the word "probability" appears next to talk of mathematical necessity. I was arguing about this with a friend in number theory who insisted the twin-prime heuristic is obviously right but could not say what the word "independent" denotes when there are no random variables in sight, and that is precisely the confusion I want the section to dissolve rather than reproduce.

  Please don't explain the material to me as though I were the audience, and don't give me a reading list. I want a teaching plan: the order in which the ideas must be introduced and what depends on what; one carrying example, with a defense of why that example rather than coin flips or a random graph — what the example has to have, and what it must not have, to carry the idea; a map of the misconceptions the two groups will bring and the point in the sequence where each should be headed off rather than corrected after the fact; and one question for the final ten minutes that would separate a student who understands what it would be to formalize the presumption of independence from a student who has merely followed the heuristic computation. Finally, say explicitly what you are leaving out at this level, and why omitting it does not quietly change the subject.
