answer: |-
  Here are five numbered points addressing your request:

  1.  **Bell's theorem demonstrates that *any* theory satisfying Locality (no faster-than-light influences), Realism (hidden variables defining pre-measurement properties), and Measurement Independence (hidden variables λ statistically independent of future measurement settings) must obey Bell inequalities.** Violating these inequalities experimentally thus falsifies the conjunction of these three assumptions.

  2.  **Quantum mechanics violates Bell inequalities experimentally, proving that the specific combination of Locality + Realism + Measurement Independence is incompatible with observed reality.** The violation alone does not specify which single assumption (or combination) must be abandoned.

  3.  **Maintaining Locality is logically possible by rejecting Measurement Independence instead.** This implies the hidden variables λ are correlated with the measurement settings (a, b) from the start (e.g., superdeterminism), meaning the experimenter's "free choice" isn't statistically independent of the system's prior state.

  4.  **The weakest point in rejecting Measurement Independence is its reliance on a *probysical independence* assumption.** There is no direct experimental contradiction; the rejection is criticized because it implies a "conspiratorial" or "fine-tuned" universe where λ and settings are correlated precisely to hide locality, which feels deeply unnatural and undermines standard scientific practice assuming free-variable control.

  5.  **Common dismissals of rejecting Measurement Independence (superdeterminism) rely on philosophical aversion to fine-tuning or loss of experimenter freedom, not logical or empirical refutation.** While this path preserves Locality, it demands a radical, non-local metaphysical commitment to pervasive, pre-determined correlations between system preparation and measurement choices.
