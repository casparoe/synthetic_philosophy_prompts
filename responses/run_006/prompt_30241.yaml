prompt: |-
  so ive been going back down the Bell's theorem rabbit hole after a long forum thread where everyone kept repeating the same one-sentence summary and then immediately concluding that quantum mechanics proves the world is nonlocal. what i want is a careful, gears-level argument for the position that this inference is too fast: the Bell inequalities rule out a conjunction of assumptions, and the experimental violations by themselves dont tell you which assumption to drop; in particular someone with a strong prior against action at a distance can keep locality by rejecting measurement independence (superdeterminism, or at least the assumption that detector settings can be treated as independent of the hidden variables), and the usual dismissal of that move is mostly incredulity rather than a refutation. give me exactly five numbered points, each one or two sentences, no introduction and no conclusion. assume i can follow the CHSH setup and what a hidden variable is, but write for someone who has not already separated the assumptions. american english, and say explicitly which point in the argument is weakest instead of papering over it.
reasoning: |-
