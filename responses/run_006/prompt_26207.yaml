  Hmm, this is actually a sophisticated meta-ethical puzzle. The user isn't just asking for definitions—they want to dissect how the same phrase functions as different philosophical claims depending on interpretation. Smart framing. They explicitly listed possible dimensions: psychological, normative, epistemic, understanding-focused, agency-related. Good sign they've done preliminary work but need taxonomy.

  First, I should acknowledge their frustration about "arguing past people." That's key—they want conceptual mapping to facilitate dialogue. The real need here is dialectical effectiveness, not just personal understanding. 

  The slogan's vagueness is the problem. It could mean anything from "moral deference feels icky" (trivial) to "moral knowledge transmission is impossible" (radical). Need to categorize interpretations by strength: modest (descriptive/psychological) → moderate (understanding/justification) → ambitious (knowledge/agency collapse). 

  For each interpretation, I'll need to assess: 
  - What precisely is claimed? 
  - Is it plausible? 
  - Does it make moral testimony specially defective? 
  - Does it distinguish morals from other domains?

  User mentioned "collapses into something uninteresting" - that's crucial. Some interpretations might not sustain the intended specialness of moral testimony's defectiveness. For example, if it's about understanding, does that really differ from complex physics testimony?

  Notable tension: Epistemology vs. moral philosophy traditions pull differently here. The "understanding" angle (moderate claim) might be strongest case for distinctiveness, while epistemic transmission claims face Gettier-style problems. And the agency argument (ambitious claim) is more ethical than epistemic—user should note that disciplinary shift.

  Biggest trap: Letting "you can't just" imply all moral deference is wrong. Most interpretations permit constrained deference (e.g., when understanding is impossible or irrelevant). Need to flag where the slogan overreaches.

  User seems analytically inclined—they'll appreciate the taxonomy structure but also need warnings about how interpretations interact. For example, psychological resistance might be evidence for normative claims but doesn't entail them. Should emphasize that in the response.

