prompt: |-
  I was listening to a podcast where the host summarized Dennett's concept of sphexishness like this: "Dennett points to the Sphex wasp, which has this elaborate routine where it drags a cricket to its burrow, leaves it at the entrance, goes inside to check things out, then comes back to drag the cricket in. But if you move the cricket an inch while the wasp's inside, it'll just drag it back to the entrance and go check again—over and over, forever. So the wasp is basically a biological robot running a fixed program, and Dennett's point is that humans are totally different: we have genuine free will, we can notice when our routines aren't working and improvise. Sphexishness is a vivid argument for why determinism can't be true of us."

  I'm pretty sure some of this is wrong—I thought Dennett was a compatibilist, not someone who argues for libertarian free will. But I havent read the original and I don't want to be that guy who corrects people based on a vague memory. Can you go through this summary and tell me what's accurate, what's subtly misrepresented, and what someone who actually knows Dennett's work would say about it?
