prompt: |-
  You are a philosopher of language specializing in conditionals and formal semantics. Before writing your final answer, take some time to think through the logical structure of Lewis's triviality results and the dialectical options they force. Then write a dialogue between two philosophers who have just finished a seminar on Lewis's triviality results for indicative conditionals. One holds that the results force us to abandon Adams's Thesis (that the probability of an indicative conditional equals the corresponding conditional probability); the other holds that the results force us to abandon the view that indicative conditionals express propositions. The dialogue should consist of exactly five exchanges, each exchange being one speech per character. Neither character should be a strawman; both should make the strongest case available to their position, and each should genuinely respond to what the other has just said rather than talking past them. Do not include any introduction, conclusion, or stage directions — just the five exchanges, with the speakers labeled "Propositionalist" and "Non-Propositionalist."
