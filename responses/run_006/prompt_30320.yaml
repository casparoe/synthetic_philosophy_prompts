answer: |-
  **Propositionalist:** Lewis's triviality proofs create an inescapable dilemma: if indicative conditionals express propositions *and* Adams's Thesis holds universally, then probability collapses into absurdity. Since probability is demonstrably coherent, we must reject Adams's Thesis. Conditionals *do* have truth conditions, but their probability isn't always the conditional probability; it's a more complex function of the probability distribution over worlds.

  **Non-Propositionalist:** Abandoning Adams's Thesis sacrifices the core insight explaining *why* we use conditionals as we do! Its empirical adequacy in predicting our credences and inferential patterns is overwhelming. Lewis's proofs show the impossibility lies precisely in *assigning* truth conditions while preserving this core function. The rational move is to accept that "if A, B" doesn't express a proposition with an independent truth value, but functions as a device for conditional assertion governed by P(B|A).

  **Propositionalist:** But your view struggles mightily with embedding. How does "Either if A, B or if C, D" function on your account? Its probability isn't simply a function of conditional probabilities. Granting propositionality allows a unified compositional semantics where conditionals embed seamlessly, explaining complex judgments. We handle the probability mismatch by refining our truth-conditional account, perhaps incorporating context-dependence or dynamic elements.

  **Non-Propositionalist:** Unified compositionality *under truth conditions* is precisely what Lewis proved impossible without triviality! My account handles embedding by treating conditionals as complex speech acts or within dynamic semantics, where their contribution isn't truth-conditional but update instructions. The probability of a compound containing a conditional isn't a simple conditional probability, but Adams's Thesis governs the conditional *itself* in unembedded contexts, which is its primary home.

  **Propositionalist:** Yet relegating conditionals to non-propositional status makes them second-class citizens in logic and thought. We reason hypothetically *as if* "if A, B" is true or false; we assess arguments containing them for validity. Your account risks making this practice unintelligible or requiring radical revisionism. Preserving propositionality, even by sacrificing the simple equation of P(if A,B) with P(B|A), better respects the role conditionals play in reasoning and rational belief update.

  **Non-Propositionalist:** It respects the *surface* form, but Lewis shows this respect is misplaced for indicatives. Their role *is* fundamentally epistemic—guiding belief under supposition. Adams's Thesis captures this perfectly. The "as if" truth you cite is explained by conditional assertibility: we treat "if A, B" *like* a belief when its conditional probability is high. But forcing it into the propositional mold, despite the triviality results, creates deeper problems than acknowledging its unique, probability-guiding function. The core datum—our credence in "if A, B" *is* P(B|A)—must be preserved.
