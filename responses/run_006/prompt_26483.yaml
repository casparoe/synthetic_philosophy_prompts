prompt: |-
  so i just spent two hours arguing with a friend about whether a fine-tuned model still "uses the same mechanism" as the base model, and we kept talking past each other because we had different ideas of what would even count as the same mechanism. it made me realize i want the full spec before i read any more interpretability papers. write me the desiderata: what would an adequate account of mechanistic sameness have to deliver? i mean, what cases does it have to get right, what distinctions it can't colapse, what facts about how networks actually behave it can't contradict. for each requirement say why it's a requirement and whether it's non-negotiable or just a preference of one camp (like the people who only trust mechanisms they can ablate versus the people who care about the algorithm level).

  things i suspect belong on the list but i want you to tell me if they do and how hard they are: permutation invariance (two nets identical up to relabeled neurons), the difference between same behavior and same mechanism, fine-tuning moving the weights a bit at a time with no obvious point where the mechanism flips, backup circuits that only show up after you ablate the main one (is that a new mechanism or one that was already there?), mechanisms that are distributed or polysemantic so they don't decompose into clean components, the fact that the same components get reused across lots of mechanisms, and whether "same mechanism" is relative to a level of description so two models can be the same at one level and different at another. then flag any subsets of the requirements you think can't be jointly satisfied, and tell me which single requirement does the most to kill the easy answers like "same if the weights are close" or "same if the outputs match."

  also tell me how confident you are in the list as a whole, and single out the point you're least sure of. honestly i'd rather be dissapointed by a requirement that's wrong than have you present it all as settled.
