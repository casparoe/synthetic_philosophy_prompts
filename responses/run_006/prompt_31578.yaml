answer: |-
  Here’s your Q&A prep sheet, crafted for this specific audience. I’ve brainstormed commitments, pressure points, and likely objections based on the room’s dynamics. **Key strategic advice upfront:**  
  **Concede:** (1) Expertise *can* mitigate *some* biases (e.g., spotting logical flaws), (2) Not *all* intuitions are equally vulnerable (e.g., perceptual vs. moral), (3) Intuition pumps aren’t *useless*—they’re diagnostic tools for uncovering implicit assumptions.  
  **Hold Firm:** (1) Vividness/simplicity/affect *are* empirically validated bias amplifiers, (2) These features *systematically* distort even expert judgment, (3) A "pumped" intuition’s compellingness is *evidence of contamination*, not reliability.  

  **Brainstormed Pressure Points:**  
  - **Ethicists:** Commit to thought experiments as *the* method for uncovering moral truth. Fear: If intuitions are corrupted, ethics collapses into skepticism.  
  - **Philosophers of Mind:** Commit to "seeing" conceptual truths (e.g., water = H₂O) via cases. Fear: Losing a priori access to meanings.  
  - **Psychologists:** Commit to methodological rigor. They’ll pounce on overgeneralization from undergrad studies.  
  - **X-Phi:** Wants you to nuke the armchair entirely. They’ll attack any concession as backsliding.  
  - **Joint Attack:** All will demand: *"If not intuitions, what?"*  

  ---

  **Q&A Prep Sheet: Top 8 Objections**  
  *(Ordered by likelihood + damage potential)*  

  1. **The Ethicist’s Indispensability Objection**  
     *Likely Asker:* Senior Kantian/Rawlsian ethicist.  
     *Phrasing:* "You’re throwing the baby out with the bathwater. If we distrust all vivid cases, how do we *do* ethics? The trolley problem variants reveal deep structure in moral reasoning—are you saying *all* that work is confounded?"  
     *Reply:* "No—I’m saying we should treat the *vividness itself* as a confound. Schwitzgebel & Cushman (2012, 2015) showed professional philosophers exhibit *order effects* and *framing effects* in moral dilemmas identical to undergrads. When you swap the order of 'trolley' and 'footbridge' cases, even experts’ consistency drops to chance. The 'deep structure' you see is partly an artifact of *which* vivid case you encountered first. We need to triangulate with other methods: computational modeling, cross-cultural x-phi, reflective equilibrium with real-world data—not lean on the pump’s pull."  
     *Soft Spot:* Doesn’t fully answer *how* to isolate "unconfounded" moral intuitions.  

  2. **The Philosopher of Mind’s Armchair Immunity Claim**  
     *Likely Asker:* Kripkean essentialist.  
     *Phrasing:* "Twin Earth isn’t persuasive because it’s *vivid*—it’s persuasive because it reveals a conceptual truth about reference. No amount of psychological bias can change the fact that Oscar’s ‘water’ concept picks out H₂O, not XYZ. Doesn’t expertise inoculate us against these effects?"  
     *Reply:* "Expertise helps spot *logical* errors, not perceptual-like intuitions. Machery (2011) found East Asian philosophers *systematically* reject Western intuitions about reference (e.g., for ‘Gödel/Schmidt’ cases). If expertise overrode bias, we’d see convergence—but we see *cultural divergence* even among experts. Vivid cases like Twin Earth trigger ‘causal-historical’ intuitions *because* they strip away counterexamples (e.g., incomplete baptismal chains) that real-world noise would provide. The ‘seeing’ is a cognitive illusion of simplicity."  
     *Soft Spot:* Concedes that *some* conceptual truths might be bias-resistant (but which?).  

  3. **The Psychologist’s External Validity Challenge**  
     *Likely Asker:* The skeptical cognitive psychologist.  
     *Phrasing:* "You cite ‘framing effects’—but most studies use undergrads judging monetary gambles. Where’s the evidence that *trained philosophers* misjudge *philosophical* cases due to vividness alone? And how do you isolate ‘affect’ from genuine moral perception?"  
     *Reply:* "Three key studies: First, Tobia et al. (2013) showed philosophers’ intuitions on ‘Knobe effects’ (intentionality judgments) flip with affect-laden details *unrelated* to the conceptual question. Second, Schulz et al. (2011) found experts’ determinism intuitions shift when cases use emotionally charged language (e.g., ‘murder’ vs. ‘event’). Third, Wright (2010) replicated Wason selection task biases in logicians using abstract rules—but *eliminated* the bias when the same logic was presented dryly. Vividness isn’t incidental; it’s an *independent variable* that drives verdicts."  
     *Soft Spot:* Most philosophical-specific studies have small *n*—psychologists will note limited power.  

  4. **The X-Phi Ally’s “Too Timid” Critique**  
     *Likely Asker:* The experimental philosopher.  
     *Phrasing:* "Why stop at ‘distrust’? If these pumps are bias engines, shouldn’t we *jettison* armchair intuition as evidence altogether? Your stance feels like a half-measure to placate the room."  
     *Reply:* "Distrust ≠ discard. Intuitions signal *where to look* for explanations (e.g., why does the Chinese room *feel* empty?). But we must treat them like fMRI data: compelling raw signals that require deconfounding. My point is that a pump’s *success* (e.g., ‘you just see that Mary learns something new’) correlates with contamination risk. We need *negative controls*: run the case without vividness/affect. If the intuition vanishes, it was likely pumped, not perceived."  
     *Soft Spot:* Smuggles in a quasi-foundational role for intuitions ("where to look").  

  5. **The Conceptual Engineer’s Toolbox Defense**  
     *Likely Asker:* Metaphysician who uses edge cases.  
     *Phrasing:* "Simplification isn’t a bug—it’s a feature! We strip noise to isolate variables. If I test frictionless planes in physics, I’m not ‘biased’—I’m modeling. Why treat philosophical cases differently?"  
     *Reply:* "Because physics models *predict measurable outcomes*; intuition pumps *measure subjective reactions*. When you simplify a moral dilemma (e.g., removing kinship ties in trolley cases), you’re not isolating variable *x*—you’re *amplifying* the salience of variable *y* (e.g., personal force). Lombrozo (2009) showed that ‘stripped-down’ causal models *induce* teleological thinking in experts. The pump doesn’t clarify—it *selects* which intuition you have."  
     *Soft Spot:* Hard to prove philosophers *can’t* correct for salience effects.  

  6. **The Burden Shifter’s “Prove Harm” Demand**  
     *Likely Asker:* Pragmatic naturalist.  
     *Phrasing:* "Even if pumps *can* bias, where’s the evidence they *have* led philosophy astray? We’ve made progress using thought experiments—from Gettier to extended minds. Isn’t this just skeptical panic?"  
     *Reply:* "Progress isn’t proof against bias. Take personal identity: Parfit’s ‘teletransporter’ pumps the intuition that identity isn’t what matters. But Nichols & Bruno (2010) found this intuition correlates strongly with *visualizability*—not metaphysical insight. When cases are presented dryly (‘Body A is destroyed; Body B is created with your memories’), non-visualizers reject Parfit’s conclusion. The ‘progress’ here may reflect which philosophers had vivid mental imagery. We’ve been optimizing for persuasiveness, not truth-tracking."  
     *Soft Spot:* Retrospective diagnosis is speculative—can’t rerun history sans pumps.  

  7. **The Expertise Shield Rebuttal**  
     *Likely Asker:* The department’s cognitive psychologist.  
     *Phrasing:* "Expert decision-makers (e.g., chess masters, clinicians) *do* override cognitive biases through training. Why assume philosophers—who analyze these cases daily—don’t develop similar debiasing skills?"  
     *Reply:* "Experts overcome biases in *domain-specific predictions* (e.g., chess moves), not intuitive judgments. Even clinicians fall for vividness effects (e.g., overdiagnosing rare cancers after seeing a memorable case). For philosophers, Weinberg et al. (2012) found training *increases* susceptibility to some biases (e.g., order effects in epistemology cases) by reinforcing reliance on ‘natural’ intuitions. Expertise here means *fluency* with pumps, not immunity."  
     *Soft Spot:** Chess/clinician analogies are potent—need more philosopher-specific data.  

  8. **The Dilemma of Discounting**  
     *Likely Asker:* Quiet meta-ethicist in the back.  
     *Phrasing:* "If we discount intuitions based on their phenomenological features (vividness, pull), don’t we need a *prior* intuition to identify those features? Isn’t your critique self-undermining?"  
     *Reply:* "No—we identify bias *empirically*, not intuitively. We *measure* vividness (e.g., self-report scales, pupil dilation) and correlate it with judgment variance across cases. If judgments track ‘how easy it is to picture’ more than ‘logical structure’ (per Alter & Oppenheimer 2009 on fluency), that’s evidence of corruption. We’re not intuiting bias; we’re detecting it via controlled studies."  
     *Soft Spot:** Relies on operationalizing "vividness"—philosophers may dispute the metrics.  

  ---

  **The Dreaded Question (Hope Nobody Asks):**  
  *"If vividness corrupts, and simplicity distorts, what *should* a non-corrupt philosophical method look like? Give a concrete example of ‘good’ practice vs. ‘bad’ intuition pumping—say, in the trolley problem."*  

  **Why it’s deadly:** Forces you to prescribe under fire, alienating ethicists (if you reject cases) or psychologists (if your alternative is hand-wavy).  

  **Reply Strategy:**  
  "First, ‘bad’ pumping: Presenting the trolley problem with graphic imagery of screaming victims to amplify deontological intuitions. Good practice: (1) *Deamplify*—use abstract variables (‘Save 5, lose 1 vs. save 1, lose 5’). (2) *Embed* in real-world complexity—add uncertainty, mixed motives. (3) *Cross-check* with behavioral data (e.g., driverless car dilemma studies). (4) *Test for robustness*—vary affective language systematically. The goal isn’t to abandon cases, but to make them less ‘pump’ and more ‘probe’."  

  **Final Prep Tip:** When citing studies, **name authors + years + specific effects** (e.g., "Schwitzgebel & Cushman 2015 order effects"). This signals rigor and preempts "vague gestures" accusations. Good luck—they’ll be gunning for you, but this sheet covers their best shots.
