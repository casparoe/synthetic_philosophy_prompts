  First, I need to unpack the "stochastic parrots" metaphor. The term comes from the 2021 paper by Bender et al., which argues that LLMs just remix training data without true understanding. The user is encountering multiple conflated claims under this label: next-token prediction as training objective, lack of grounding, absence of beliefs/intentions, and impossibility of understanding. 

