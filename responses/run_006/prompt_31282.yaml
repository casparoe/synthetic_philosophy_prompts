  I recall Wittgenstein's "meaning as use" perspective could offer a middle ground. Even if LLMs lack human-like inner states, their functional language use might constitute a form of understanding. This could help the user bridge the gap in their discussion.

  Also worth noting: the burden of proof shifts when models exhibit unexpected capabilities. If Level 1 claims are true but insufficient to explain counterfactual reasoning, that challenges stronger interpretations of "stochastic parrot."

