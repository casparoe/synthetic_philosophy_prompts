prompt: |-
  So I've got this friend who's really into moral particularism — she's read her Dancy, she's always going on about how moral principles are a fantasy and every situation is just its own thing that you have to perceive correctly. She says anyone who tries to boil ethics down to rules is making a category mistake, the world doesn't work that way, etc.

  Naturally I've been trying to catch her out by giving her cases and writing down her verdicts. Here's what I've collected so far:

  - Lying to your spouse about an affair: wrong.
  - Lying to the secret police about the dissidents hiding in your basement: not just okay, you'd be a monster not to.
  - Blowing off a promise to help a friend move because you feel lazy: wrong.
  - Blowing off the same promise because on the drive over you come across a car wreck and stop to pull someone from a burning vehicle: obviously fine.
  - Stealing a candy bar from Walmart for the thrill of it: wrong.
  - Stealing baby formula from Walmart because your kid is hungry, you're broke, and you've exhausted every other option: permissible.

  She insists there's no rule unifying these, she's just "seeing what the situation calls for." But it sure looks to me like there's a pattern, and I'd bet money I can predict her next call before she makes it.

  Here's the case I want to test her on next: you've been donating monthly to a local animal shelter — it's a personal commitment, no contract. After a while you look into the numbers and realize that the same amount of money donated to a malaria net charity would prevent something like fifty times as much suffering and death. Is it permissible to redirect the donation?

  Before I actually spring this on her, I want to get clear on: what are the candidate rules that fit all six verdicts, which of them diverge on the charity case, and which one do I think she's actually running (even if she'd never admit it)? And if her existing verdicts genuinely underdetermine it — which I think they might — what's the one extra case I should ask her about that would settle it?
reasoning: |-
  Okay, let me start by unpacking the user's query. They have a friend who's a moral particularist, inspired by Jonathan Dancy. The friend believes moral principles don't capture the nuances of real-life situations. The user has been testing her with various scenarios, and there's a pattern in her responses. Now, the user wants to present a new case about redirecting donations from an animal shelter to a malaria charity and needs help identifying the underlying rules and designing a decisive test case.

  First, I need to analyze the existing cases. The user listed six scenarios with the friend's verdicts. Let me group them:

  1. **Lying cases**: Lying to a spouse (wrong) vs. lying to secret police (permissible). The difference seems to be intent and consequences. The affair lie causes harm and breaks trust, while lying to save lives has a net positive outcome.

  2. **Promise-breaking**: Blowing off moving due to laziness (wrong) vs. helping in an emergency (permissible). Here, laziness is a trivial reason, but an emergency creates a higher moral duty.

  3. **Stealing**: Stealing for a thrill (wrong) vs. stealing baby formula out of necessity (permissible). The key factors are the motive (selfish vs. altruistic) and the level of need (desperation).

  Looking for patterns, the permissible actions all involve preventing significant harm, fulfilling urgent duties, or acting out of necessity. The wrong actions involve selfish motives, harm to others, or neglecting commitments without valid reasons.

  Now, the user's new scenario: redirecting donations from an animal shelter (personal commitment) to a malaria charity that saves more lives. The question is whether this is permissible. The user wants candidate rules that fit all six verdicts and see which diverge here.

  Candidate rules could be:

  - **Maximize net benefit**: Focus on consequences. Redirecting saves more lives, so it's permissible. This fits most cases but might overlook personal commitments.

  - **Keep commitments unless harm**: Redirecting if it causes significant harm elsewhere. The animal shelter might suffer, but malaria nets save more lives, so it's okay. But does breaking a personal commitment without harm make it wrong?

  - **Agent-centered duties**: Personal commitments matter intrinsically. Redirecting might break a personal promise, making it wrong. This aligns with the moving promise case—breaking for laziness is wrong, but here it's for greater good.

  The user suspects the friend uses "agent-centered duties plus consequences." That means personal commitments hold weight, but consequences can override in extreme cases. The existing cases support this: emergencies override promises; necessity justifies stealing. The donation case is less extreme—no immediate emergency, but significant better consequences. The friend might see the personal commitment as binding unless there's a compelling reason, like in the car wreck scenario.

  To resolve ambiguity, the user needs a test case. A scenario where consequences are better, but no direct harm occurs from keeping the commitment. For example, donating to a less efficient charity versus redirecting to a more effective one without immediate harm. If the friend says redirecting is permissible, she leans towards consequentialism; if not, she values commitments more.

  Another test case could involve a personal project versus global impact. Say, funding a local art project versus disaster relief. If she prioritizes the local project, it's agent-centered; if she switches to relief, it's consequentialist.

  The user's deeper need might be to understand if particularism is consistent or if it implicitly uses rules. They want to challenge the friend's stance by revealing an underlying principle. The test case should force a choice between commitment and consequences without extreme factors like emergencies.
answer: |-
  Your friend's verdicts do exhibit a consistent pattern, even if she frames it as "situational perception." There are two primary candidate rules that fit all six cases, but they *diverge* on the charity-redirection scenario. Here's the breakdown:

  ### Candidate Rules Fitting All Six Verdicts
  1. **Consequence-Oriented Rule**:  
     *"An action is permissible if it prevents significantly greater harm (or promotes significantly greater good) than the alternatives, especially when core duties (like non-maleficence or urgent need) are at stake."*  
     - **Fits:**  
       - Lying to secret police prevents torture/death (massive harm prevented).  
       - Breaking a promise for a car wreck saves a life (greater duty trumps promise).  
       - Stealing formula prevents starvation (immediate harm alleviated).  
       - The "wrong" cases lack overriding harm-prevention (affair betrayal, laziness, thrill-theft cause net harm).

  2. **Agent-Centered Rule**:  
     *"An action is permissible if it (a) responds to an immediate, concrete moral demand (e.g., saving life, alleviating desperate need), or (b) honors special obligations (e.g., promises, relationships), unless (a) overrides (b) in emergencies."*  
     - **Fits:**  
       - Special obligations: Spouse honesty, promise-keeping (unless overridden).  
       - Overriding demands: Saving lives (dissidents, car wreck victim, starving child).  
       - The "wrong" cases violate obligations without an overriding demand.

  ### How They Diverge on the Charity Case
  - **Consequence-Oriented Rule**: *Permissible* to redirect.  
    Preventing 50× more suffering/death (via malaria nets) is a massively greater good. The personal commitment is outweighed by the scale of preventable harm.  
    *Analogy to existing cases:* Like redirecting effort from moving (promise) to car wreck (emergency) – greater need wins.  

  - **Agent-Centered Rule**: *Not permissible* (or at least, not clearly obligatory) to redirect.  
    The donation is a **personal commitment** to the animal shelter (a special obligation akin to a promise). Absent an *immediate, concrete crisis* (e.g., the shelter collapsing without your next donation), redirecting violates that obligation for abstract/statistical gains. The "50×" factor is aggregate, not a direct emergency.  
    *Analogy to existing cases:* Blowing off moving for laziness is wrong; here, redirecting might feel like "breaking a promise" for a "better cause," not an urgent duty.  

  ### What Your Friend is Likely Running (Unconsciously)
  I'd bet heavily she's using the **Agent-Centered Rule**, based on her emphasis on "what the situation calls for" and her verdicts:  
  - Her "permissible" cases all involve **direct, immediate moral demands** (save these lives *now*, feed *this* child *now*).  
  - Her "wrong" cases involve **violating concrete obligations** (to spouse, friend, property rights) *without* such a demand.  
  The charity case lacks immediacy: malaria nets save lives statistically, not in a way that *personally demands* her intervention *right now*. The animal shelter commitment is a standing obligation. If she's consistent, she'll likely say:  
  **"Redirecting isn't *wrong*, but it's not obligatory. Keeping your commitment is fine."**  
  (She might even call redirecting "praiseworthy but not required," preserving wiggle room.)

  ### Why Her Verdicts Underdetermine the Charity Case
  Her existing cases prioritize either **immediate emergencies** (car wreck, starving child) or **clear relational duties** (spouse, friend). The charity case is hybrid:  
  - It has *consequentialist weight* (50× benefit) but no *immediacy* (no specific child dying *now*).  
  - It has *relational weight* (personal commitment) but no *crisis* (the shelter isn't collapsing).  

  ### The Decisive Test Case to Settle It
  To force a choice between the rules, give her a scenario that **isolates statistical vs. immediate demands**, mimicking the charity dilemma but removing the personal commitment:  

  > **"You have $500 earmarked for a luxury for yourself (e.g., a fancy dinner). You learn that donating it to Charity A would provide one life-saving surgery for a specific child in your town who will die next week without it. Donating to Charity B would distribute malaria nets saving ~10 statistical lives overseas. Do you have a moral obligation to donate to Charity A over Charity B?"**  

  - **If she follows the Agent-Centered Rule**: She'll say **yes, donate to Charity A**. The *concrete, immediate* need (specific child dying next week) creates a direct moral demand, even if Charity B saves more lives statistically. The luxury dinner has no moral weight.  
    *This implies she'd likely uphold the animal shelter commitment in your original case (no immediate crisis).*  

  - **If she follows the Consequence-Oriented Rule**: She'll say **donate to Charity B**. Saving 10 lives > saving 1 life, regardless of immediacy or locality.  
    *This implies she'd redirect donations to malaria nets in your original case (50× > 1×).*  

  ### Strategic Summary
  - **Spring the charity case on her first.** Based on her likely Agent-Centered leaning, predict she'll say: *"Redirecting is nice, but you're not obligated to break your commitment."*  
  - **Then hit her with the test case above.** If she picks Charity A (save 1 concrete life over 10 statistical lives), it confirms she prioritizes immediacy/concreteness over aggregate outcomes. If she picks Charity B, she's more consequentialist than she admits.  

  This exposes the hidden structure in her particularism: she’s not rejecting rules wholesale—she’s applying a stable, agent-relative heuristic favoring direct responsiveness over impartial calculation. The test case removes her "commitment" escape hatch, forcing her to show her cards. Good luck!
