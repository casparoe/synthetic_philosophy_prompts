prompt: |-
  I have been thinking a lot lately about superrationality — the idea, most associated with Douglas Hofstadter, that in perfectly symmetric decision problems the correct move is to assume all players will converge on the same strategy and then maximize payoff under that constraint. This is the reasoning that tells you to cooperate in the one-shot prisoner's dilemma when you know your counterpart is your identical twin in reasoning ability, or to send the telegram with probability one in twenty in the Platonia dilemma. I find the core argument compelling: if the problem is symmetric and the players are symmetric reasoners, then whatever reasoning I do, they will do too, and the only coherent way to factor that in is to ask which universal strategy I would want all of us to follow. Standard game-theoretic rationality, by contrast, treats the other player's strategy as fixed while I vary mine, which seems to miss the symmetry entirely. I am not claiming superrationality is the right theory for every strategic situation — only that it is the right theory for the special case where the symmetry is genuine and the players know it.

  I want to stress-test this view properly. Tell me what would count against superrationality as a theory of rational choice in symmetric games. I am interested in the full range of defeaters: formal results that undermine the coherence of the idea, cases where superrational reasoning gives intuitively unacceptable answers, arguments that the symmetry assumption begs the question or smuggles in causal magic, empirical findings from experimental game theory or psychology that bear on whether real reasoners should adopt it, and philosophical objections about the nature of choice and agency that superrationality may be incompatible with. I want these ranked from fatal to merely awkward, and I want an honest account of which objections defenders of superrationality would themselves concede carry weight and which they would dismiss as missing the point. I also want you to address whether the view has been — or can be — qualified into unfalsifiability, and if so whether that is a problem for a view of this kind or whether it is simply the nature of normative theories of rationality. Please write your response in continuous prose, the way you would write an email or a letter: no headings, no bullet points, no bold text, no tables.
