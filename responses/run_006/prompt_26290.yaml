answer: |-
  ## Memorandum: Recommendation Regarding the Frege Prize in Philosophical Logic

  **To:** Committee for Named Lectureships and Prizes
  **From:** [Your Name/Title], Committee Member
  **Date:** 26 October 2023
  **Subject:** Recommendation on Petition to Rename the Frege Prize in Philosophical Logic

  **1. Introduction**
  This memorandum addresses the petition requesting the renaming of the Frege Prize in Philosophical Logic. The petition cites the 1996 publication of Gottlob Frege’s 1924 political diary, expressing virulent anti-Semitism, support for Jewish expulsion and disenfranchisement, and enthusiasm for the *völkisch* movement (a precursor to Nazism). Petitioners argue this is incompatible with our university’s commitment to inclusivity and that the original naming (1982) occurred in ignorance of these facts. Counterarguments emphasise Frege’s foundational, seemingly apolitical contributions to logic and philosophy and warn of precedent-setting consequences. This memo summarises key arguments, addresses the core philosophical question concerning the relevance of Frege’s politics to his legacy, and recommends a concrete course of action.

  **2. Summary of Key Arguments**

  *   **Petitioners' Case:**
      *   **Moral Incompatibility:** Honouring Frege by name celebrates an individual whose documented views advocated for the persecution and exclusion of Jewish people, fundamentally contradicting the university’s values of inclusion and respect.
      *   **Harm to Community:** Maintaining the name signals indifference to these views, potentially causing harm or alienation to Jewish students, staff, and others within our intellectual community.
      *   **New Information:** The naming decision predated the diary’s publication; we now possess critical information unavailable to the original endowers or committee, necessitating re-evaluation.
      *   **Context Matters:** The prize is awarded *in Frege’s name*, directly associating the university’s honour with the individual, not just the work.

  *   **Counterarguments:**
      *   **Intellectual Purity & Separability:** Frege’s revolutionary work in logic (e.g., *Begriffsschrift*), philosophy of mathematics (*Grundlagen*), and philosophy of language ('On Sense and Reference') is foundational, rigorously technical, and devoid of political content. His late political views are entirely separable from these contributions.
      *   **Foundational Significance:** His work underpins modern logic, analytic philosophy, and computer science. Disassociating his name risks obscuring this vital intellectual lineage.
      *   **Slippery Slope:** Renaming sets a precedent requiring exhaustive moral audits of every honouree across disciplines, many of whom held views or engaged in practices unacceptable today, potentially leading to endless revisionism and erasure of historical context.
      *   **Category Mistake:** Judging the validity or worth of technical logical work based on the author’s political or personal failings constitutes a fundamental error, conflating distinct domains of evaluation and threatening the autonomy of intellectual inquiry.

  **3. Addressing the Core Philosophical Question: Relevance of Politics to Legacy**
  The central tension hinges on whether Frege’s political views bear upon his philosophical legacy, particularly given the *apparent* "purity" – the technical, ahistorical, timeless nature – of his logical work.

  *   **The "Purity" Argument:** Proponents argue this very purity renders his politics irrelevant. The truths of logic or the structure of thought and language, as explored by Frege, exist independently of the thinker’s personal failings. Evaluating *Begriffsschrift* based on anti-Semitic diaries *is* a category mistake; the work stands or falls on its logical rigour and insight alone.
  *   **The "Suspicion of Evasion" Argument:** Critics contend that proclaiming such "purity" can function as an evasion. Insisting on a strict separation can shield certain disciplines (like formal logic or mathematics) from the ethical scrutiny applied elsewhere. It risks propagating the myth of the completely detached, objective thinker, ignoring how even the most abstract intellectual pursuits exist within a social and historical context that shapes their reception, interpretation, and the institutional power they accrue. The *belated discovery* of the diary underscores how historical figures are often sanitised. While Frege’s *arguments* may be logically separable, the *honouring of the individual* inevitably encompasses the now-known totality of his record. Ignoring the politics when naming a prize is not neutrality; it becomes a tacit endorsement or normalisation.

  **Conclusion on Relevance:** While Frege’s specific logical *theorems* may be evaluated independently of his politics, the *legacy* we choose to honour through naming is not solely about disembodied propositions. It is about the *figure* associated with them. When the figure is revealed to hold views antithetical to our core institutional values – especially views advocating persecution – continuing to honour them *by name* sends a message about what the institution tolerates in its heroes. The "purity" of the work does not erase the toxicity of the individual’s other views; it simply makes the dissonance more stark. The argument that this scrutiny threatens intellectual autonomy is significant but overstated; we routinely make contextual judgments about historical figures without invalidating their work. The question here is specifically about *honouring the name*.

  **4. Recommendation: Rename the Prize with Contextualisation**
  After careful consideration of the compelling arguments on both sides, I recommend the following course of action:

  *   **1. Rename the Prize.** The severity and nature of Frege’s documented views – advocating for the expulsion and disenfranchisement of Jewish citizens and supporting a movement leading directly to Nazism – are fundamentally incompatible with the university’s commitment to an inclusive community. Continuing to award a prize explicitly carrying his name causes understandable harm and undermines our values. The "purity" of his work does not neutralise this harm or obligation.
  *   **2. Maintain the Thematic Focus:** The prize should retain its focus on philosophical logic, ensuring continuity of purpose and honouring the *field* Frege helped establish. Suggested names could reflect this focus more directly (e.g., "The University Prize in Philosophical Logic," "The Prize for Foundational Work in Logic," or honouring a subsequent, less-contested figure central to the discipline).
  *   **3. Issue a Contextualising Statement:** Accompany the renaming with a brief, publicly accessible statement explaining the decision. This should:
      *   Acknowledge Frege’s profound and foundational contributions to logic and philosophy.
      *   State clearly that the renaming is due to the posthumous discovery of his virulently anti-Semitic political views, which contradict the university’s core values of inclusivity and respect.
      *   Affirm the continued importance of the field of philosophical logic and the purpose of the prize.
      *   Be placed on the prize webpage and included in future award announcements for a transitional period.

  **5. Addressing Counterarguments within this Recommendation**

  *   **Slippery Slope:** This recommendation addresses an *extreme* case: documented advocacy for persecution based on ethnicity/religion by the honoured individual. It does not mandate renaming for every historical figure with outdated views or personal failings. Each case should be judged on its specific merits, context, and the nature of the views/actions in relation to our values. Consistency demands careful, case-by-case deliberation, not inaction in the face of compelling evidence of profound moral failure directly relevant to the act of naming.
  *   **Separability & Category Mistake:** Renaming does not negate Frege’s work or prevent its study. His texts remain essential. The recommendation specifically preserves the prize’s thematic focus *on the work and the field*. The renaming acknowledges that *honouring the individual by name* is a distinct act with ethical dimensions beyond evaluating the technical content of their contributions. It recognises that names carry symbolic weight within a living community.
  *   **Foundational Significance:** The field itself, and the prize’s purpose in recognising undergraduate excellence within it, remains paramount. Honouring the field without directly naming an individual whose legacy is now irrevocably tainted by bigotry is both feasible and responsible.

  **6. Conclusion**
  The discovery of Frege’s political diary presents us with an unavoidable ethical challenge. While his contributions to logic are monumental and seemingly detached from these views, the act of naming a university prize inherently honours the individual. The views expressed in the diary are not merely outdated but actively hateful and exclusionary, directly contravening our institutional principles. Renaming the prize, while clearly affirming its purpose and the importance of Frege’s intellectual field, is the most responsible course. It upholds our commitment to an inclusive community, acknowledges the new historical information, and allows the prize to continue recognising excellence in philosophical logic without carrying the burden of honouring a name associated with such reprehensible beliefs. I recommend we proceed with renaming the prize to a thematically appropriate alternative and issue a clear contextualising statement.
