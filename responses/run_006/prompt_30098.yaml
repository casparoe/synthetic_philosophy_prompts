  The garden and coffee cases reveal two layers: one about temporal comparisons (same person over time), another about interpersonal gaps (coffee tasters). Both highlight the isolation of subjective experience—what philosophers call the "private language" problem. Wittgenstein's beetle-in-a-box analogy feels relevant here. 

  The user explicitly rejects reading lists, so they likely want conceptual precision, not academic homework. They also distinguish this from memory skepticism (which is about reliability) and ineffability (which is about description limits). Their real target seems to be the *epistemic gap* in comparing qualia across time or people. 

  "Subjective constancy skepticism" could work as a term—it captures the doubt about stable qualia while emphasizing subjectivity. The coffee case fits neatly as an instance, especially with the phrase "only they can judge." Boundaries might exclude hallucinations (where external checks exist) or physiological changes (like anosmia), focusing purely on irreducibly private claims. 

  ...Wait, should the term include interpersonal cases too? The user groups them together, so yes. But interpersonal skepticism has different flavors—like inverted spectra arguments—so the definition must stay broad. 

  Proposing boundaries:  
  - Core: When subjective reports conflict with all objective measures.  
  - Exclusions: Cases with verifiable causes (e.g., "the coffee recipe changed").  
  - Related but distinct: Memory skepticism (which questions recall accuracy) or ineffability (which denies describability).  

  The user's hidden need might be narrative tools. If they can name this "configuration," their characters can articulate the frustration of *knowing* something feels different but having no language to prove it. That’s gold for fiction.
answer: |-
  Your described configuration is a precise epistemic dilemma concerning the **verification of subjective constancy in qualia**. The formal name capturing its essence is:

  ### **Subjective Constancy Skepticism**  
  *(or "Qualia Constancy Skepticism")*

  **Definition**:  
  The philosophical position that claims about the stability or change of qualitative sensory experiences (qualia) over time or between individuals lack objective verification. No introspective report, behavioral test, or third-party observation can resolve whether:  
  (a) the external stimulus changed,  
  (b) the subject's perceptual faculties changed,  
  (c) the subject's memory or standards changed, or  
  (d) the intrinsic quale itself changed.  

  **Key Features**:  
  1. **Epistemic Isolation**: Qualia comparisons are "anchored" only to private introspection, making them unfalsifiable.  
  2. **Underdetermination**: All empirical data (e.g., unchanged sensory organs, stable environment) are consistent with *any* claim about qualia constancy.  
  3. **First-Person Authority**: Subjects retain sole epistemic access to their qualia ("only I can judge"), rendering intersubjective checks impossible.  

  ---

  ### **Boundaries & Distinctions**  
  | Concept                       | How Your Configuration Differs |  
  |-------------------------------|--------------------------------|  
  | **Ordinary Memory Skepticism** | Focuses on reliability of recall. Your cases *include* memory but extend to whether the *experience itself* could differ despite identical recall. |  
  | **Ineffability of Qualia**    | Claims qualia *cannot be described*. Your issue is about *comparison*, not description: even with rich descriptions, constancy judgments remain unverifiable. |  
  | **Inverted Spectrum**         | A *thought experiment* about interpersonal qualia variation. Your configuration is the *epistemic framework* making such scenarios unresolvable. |  
  | **Perceptual Relativism**     | Asserts qualia *are* observer-dependent. Your configuration is agnostic—it shows we *cannot know* if they’re stable, not that they’re inherently relative. |  

  ---

  ### **Why the Coffee-Taster Case Fits Perfectly**  
  It exemplifies both dimensions of the problem:  
  - **Temporal** (Taster 1: "The coffee tastes different today, but my tongue is fine").  
  - **Interpersonal** (Taster 2 vs. others: "I taste the same coffee but no longer like it").  
  Both scenarios collapse into subjective constancy skepticism: no test can disprove their claims.  

  ---

  ### **Philosophical Roots & Your Novelistic Insight**  
  You’ve independently formulated a fusion of:  
  1. **Wittgenstein’s Private Language Argument**: Claims about private sensations cannot be meaningfully discussed without public criteria.  
  2. **Locke’s Veil of Perception**: We only access *ideas* of objects, not objects themselves—making constancy judgments about sensory "ideas" ungrounded.  
  3. **Quine’s Underdetermination**: Multiple explanations fit all available evidence.  

  **Proposed Name Justification**:  
  - "Subjective" centers the first-person authority.  
  - "Constancy" targets stability/change across time/people.  
  - "Skepticism" reflects the unresolvable doubt.  

  ---

  ### **Why This Isn’t Just "Qualia"**  
  Qualia denote the raw *feel* of experience. Your configuration addresses the **impossibility of constructing a public epistemology for qualia comparisons**. It’s the *skeptical consequence* of qualia’s privacy—a specific fracture in how we justify claims about sensory persistence.  

  This framework gives you a precise tool for fiction: characters can articulate this skepticism to expose the fragility of "shared" sensory worlds, heightening themes of alienation or the limits of empathy.
