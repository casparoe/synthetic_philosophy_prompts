  - **Rule 5: "Common Expectation" Rule**  
    - An action is **obligatory** if it aligns with what society typically expects (e.g., easy rescues), and **supererogatory** if it's heroic or exceptional.  
    - **Fits track record**:  
      - Obligatory actions are "everyday" duties (e.g., calling 911 is standard).  
      - Supererogatory actions are "above and beyond" (e.g., donating organs or large sums).  
    - **Hiking verdict**: Ambiguous—could be obligatory (remote rescue might be expected) or supererogatory (due to risk). But it might lean obligatory if society views wilderness aid as a duty.  
    - **Why it fits**: It explains why low-cost actions are duties, but it's vaguer and culture-dependent. Your friend's focus on cost/risk makes this less precise.

  ### 5. A Further Case to Settle the Rule
