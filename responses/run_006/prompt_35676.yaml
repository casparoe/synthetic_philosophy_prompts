  For the verdict, I lean towards voting against the proposal. The principle of protecting individual autonomy unless there's demonstrable harm seems crucial. The university's role isn't to police private, legal behavior. Even in a private institution, enforcing vague moral standards risks arbitrary enforcement and could undermine the educational environment. If this were a municipal government, the same principle would apply more strictly due to the state's role in protecting individual rights.

