answer: |-
  Here's an original thought experiment designed to meet your specifications, pushing beyond Black's spheres by embedding the objects in a functionally necessary symmetrical structure:

  **The Symmetric Archway:**  
  Imagine a perfectly symmetrical stone archway supporting a heavy lintel. At its apex sit *two* identical keystones, each carved from the same quarry, with identical mass, shape, color, and microstructure. The arch is radially symmetric: the keystones occupy mirrored positions relative to the centerline, bear identical downward forces from the lintel, exhibit identical stress patterns, and are surrounded by identical atmospheric conditions (temperature, humidity). No third object exists to break symmetry. Crucially, the arch *requires* both keystones to distribute the load equally; removing either causes immediate collapse. Yet, at any instant, all qualitative intrinsic properties (mass, composition, etc.) and spatiotemporal relational properties (distance to the centerline, force vectors, spatial relations to each lintel segment) are identical between them. The only discernible difference seems to be *which* keystone you'd remove first—but this depends on primitive identity.

  ---

  **(a) The Leibnizian Response**  
  The Leibnizian insists there is only *one* keystone. They argue:  
  - All admissible properties—intrinsic (mass, shape) and relational (distance to center, force magnitude/direction, spatial relations to lintel segments)—are identical.  
  - "Being removable without affecting the other" is inadmissible: it presupposes distinctness (it’s identity-involving: "*not identical to* the other keystone").  
  - The arch’s stability is explained by the *single* keystone bilocating or existing in a "superposed" state at both positions, distributing force symmetrically. Bilocation is metaphysically odd but not logically impossible for the Leibnizian.  

  **(b) The Sceptic Response**  
  The sceptic maintains there are two distinct keystones:  
  - **Why distinct:** The arch’s structural necessity demands *multiplicity*; a single keystone *could not* simultaneously occupy two spatially separated points while bearing independent loads without collapsing. Distinctness is grounded in the *causal architecture* of the system.  
  - **Why Leibniz fails:** Dismissing "removability" as inadmissible ignores the *physical consequences* of distinctness. The Leibnizian’s bilocation move:  
    - Violates the *impenetrability* of matter (one object can’t occupy two locations without being divisible).  
    - Ignores that forces act *independently* on each keystone (e.g., you could shatter one without affecting the other).  
    - Reduces the explanation to wordplay: calling two functional roles "one object" doesn’t resolve the physical necessity for two points of support.  

  **(c) The Key Feature and Its Removal**  
  - **Doing the work:** The **functional/causal indispensability of multiplicity** within a symmetrical system. Unlike Black’s spheres (which could be one object without contradiction), here distinctness is *required* for the system’s stability. The keystones aren’t just indistinguishable but *interchangeable in a causal role that necessitates two instances*.  
  - **If removed:** Without functional necessity (e.g., two identical keystones in a *non-load-bearing* symmetrical garden arch), the case collapses into Black’s spheres. The sceptic loses the intuition that distinctness is physically mandated, leaving primitive identity as the sole (and question-begging) distinction.  

  **(d) The Uncomfortable Consequence**  
  If the Leibnizian bites the bullet, they must accept:  
  **A *single* material object can bilocate to perform *causally independent roles* at *spatially distinct locations* within a system governed by classical physics.**  
  This implies:  
  - Violation of **impenetrability** (the keystone is "here" and "there" simultaneously without division).  
  - **Causal paradox:** How can one object bear *twice* the load it could bear at one location? Why does "removing" half of it (the left bilocated part) cause collapse if it’s identical to the whole?  
  - **Collapse of mereology:** If the keystone is one object, why can’t it be removed incrementally (e.g., chipping away "left" bits without affecting "right" bits)?  
  This forces the Leibnizian into exotic mereology or denying classical assumptions about material objects—positions even sympathetic readers find jarring for ordinary entities like stones.  

  ---

  **Why this isn’t impossible:** The scenario satisfies your constraints by exploiting *causal-functional symmetry* rather than spatial isolation. It avoids exotic physics (the arch is classical), empty universes (it’s embedded in a concrete structure), and abstracta. It’s harder for Leibnizians than Black’s spheres because denying distinctness forces them to reject intuitive principles of material interaction (impenetrability, local causality), not merely posit primitive identities. The sceptic leverages the system’s *causal structure* to argue distinctness is empirically grounded, not merely haecceitistic. This makes the debate pivot on whether causal roles are "admissible" properties—a deeper metaphysical fissure than relational spatiotemporal properties.
