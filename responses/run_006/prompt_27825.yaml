  Let me mentally scan the decision theory landscape. The immediate anchors are:
  - Evidential Decision Theory (EDT): Where actions are seen as evidence about states (including others' actions), which fits the "my choice signals their choice" angle.
  - Reflective Equilibrium/Equilibrium Reasoning: The Prisoner's Dilemma symmetry argument where you assume identical reasoning leads to identical actions.
  - Kantian/Team Reasoning: Treating the collective outcome as the object of choice.

  But none fully capture the core of "similar decision procedures creating non-causal dependency." The closest match is actually the less-known concept of Superrationality (Hofstadter) - that's exactly the Prisoner's Dilemma symmetry argument they described. 

  For non-symmetric cases, Clustered Decision Theory (Oesterheld) seems relevant - it generalizes the idea to "clusters" of agents with linked decisions. The user's examples (voting, vegetarianism) might fit here if they frame "people like me" as a cluster. 

  I should also flag that in voting/vegetarianism examples, there might be sneaky causal pathways (e.g., social contagion) masquerading as acausal reasoning. The user would want to disentangle that. 

  The literature gap they're hinting at is real: rigorous criteria for when "procedure similarity" justifies this reasoning. Oesterheld's work is probably the current frontier here. I'll also mention TDT (Yudkowsky) with caveats - it's influential in rationalist circles but less academically formalized. 

  Key distinctions to emphasize: 
  - Superrationality requires perfect symmetry 
  - Clustered DT handles probabilistic similarity
  - EDT is broader but doesn't require decision-procedure links
  - Team reasoning is cooperative rather than epistemic

  The user might appreciate pointers to criticism too (e.g., Binmore calling superrationality "voodoo decision theory"). That validates their concern about "magical thinking."
answer: |-
  Your observation hits on a profound and actively debated phenomenon in decision theory, philosophy, and game theory. The core move you're describing—treating another agent's choice as *non-causally dependent* on your own due to *procedural similarity*—has several interconnected labels and frameworks. Here's a breakdown:

  ### Core Names & Concepts
  1. **Superrationality** (Douglas Hofstadter):  
     - **Definition**: Agents with identical reasoning processes in symmetric games should choose strategies that yield mutually optimal outcomes *if* they believe the other will reason identically.  
     - **Example**: In Prisoner's Dilemma (PD), two superrational agents cooperate because each realizes their decision "mirrors" the other's.  
     - **Key Insight**: Decisions are seen as *logically entangled*—not causally, but through shared rationality.  
     - **Limits**: Requires perfect symmetry (identical payoffs, knowledge, and reasoning).

  2. **Reflective Equilibrium / Equilibrium Reasoning**:  
     - Agents assume their decision is a proxy for others in their "reference class" (e.g., "people like me").  
     - **Example**: "If I cooperate, others like me will cooperate; thus, I should cooperate."  
     - **Difference**: Less formal than superrationality; often invoked in voting/vegetarianism cases where symmetry is imperfect.

  3. **Clustered Decision Theory** (Caspar Oesterheld):  
     - **Definition**: Extends superrationality by grouping agents into "clusters" whose decisions are correlated via shared decision procedures. Your action is chosen as if determining the entire cluster's action.  
     - **Example**: "If I (a climate-conscious person) reduce carbon emissions, others in my cluster likely will too."  
     - **Strength**: Explicitly handles probabilistic dependence and partial symmetry.

  4. **Timeless Decision Theory (TDT)** (Eliezer Yudkowsky):  
     - **Definition**: Agents output decisions by simulating identical decision processes across "logically correlated" agents (e.g., copies of yourself in identical situations).  
     - **Example**: Cooperating in PD because your decision algorithm's output is shared with the other agent.  
     - **Note**: Popular in rationalist/EA circles; criticized for vagueness.

  ### Distinguishing Valid vs. Magical Thinking
  The validity hinges on whether agents *are* genuinely "in the same reference class" and whether their decisions *are* procedurally linked. Key criteria:  

  | **Scenario** | **Likely Valid?** | **Why?** |  
  |--------------|-------------------|----------|  
  | Symmetric PD with identical rational agents | Yes | Decisions are logically determined by shared reasoning. |  
  | Voting ("People like me will vote if I do") | Context-dependent | Only valid if your action *causally influences* similar agents (e.g., via social proof) *or* if you share a decision procedure (e.g., all use TDT). Otherwise, it's likely magical thinking. |  
  | Vegetarianism ("Others will follow if I do") | Usually invalid | Unless your action directly influences peers (causal), it conflates *evidence* (seeing you quit meat suggests a trend) with *control*. |  
  | Cooperating with agents in other possible worlds | Debatable | Only justified under TDT-like frameworks assuming logical correlation. Critics call this "acausal trade fantasy." |  

  ### Key Literature
  1. **Hofstadter, D.** (1983): *Metamagical Themas* (introduces "superrationality" via PD).  
  2. **Yudkowsky, E.** (2010): *Timeless Decision Theory* (rationalist perspective).  
  3. **Oesterheld, C.** (2017): *Multiverse-wide Cooperation via Clustered Decision Theory* (rigorous generalization).  
  4. **Binmore, K.** (1994): *Game Theory and the Social Contract* (critiques superrationality as "voodoo decision theory").  
  5. **Nozick, R.** (1969): *Newcomb's Problem* (EDT vs. CDT debate groundwork).  

  ### Why This Isn’t Just EDT or Team Reasoning
  - **EDT**: Treats your action as *evidence* of others' actions (e.g., "If I defect, it suggests the other is defecting"). Superrationality/TDT goes further: your action *logically controls* theirs via shared computation.  
  - **Team Reasoning**: Agents coordinate by optimizing group payoffs ("we" > "I"). Superrationality preserves individual agency but exploits logical symmetry.  

  ### In Summary
  - **Best terms**: **Superrationality** (for strict symmetry) or **Clustered Decision Theory** (for probabilistic/partial symmetry).  
  - **Valid when**: Agents share decision procedures and recognize their logical entanglement (e.g., PD clones, AI copies).  
  - **Magical thinking when**: No plausible link between decisions (e.g., assuming a stranger’s voting choice depends on yours).  

  This remains a frontier in decision theory—especially with AI alignment concerns. Your PhD could advance it by formalizing "reference classes" for clustered decisions or testing empirical boundaries of this reasoning.
