  Final output will mirror UK drafting conventions (e.g., "shall" for obligations, "may" for powers) and flag where theory maps to practice (e.g., Austin’s infelicities ≈ judicial review grounds).
answer: |-
  Below is a pragmatic decision procedure for legislative drafters, grounded in speech act theory but operationalised as a step-by-step checklist. It draws on Austin's felicity conditions (appropriate authority, correct execution, and uptake), Searle's illocutionary act taxonomy (assertives, directives, commissives, declaratives, expressives), and the performative/constative distinction. The procedure flags where judicial interpretation remains unavoidable.

  ---

  ### **Legislative Speech Act Assessment Procedure**  
  *For determining illocutionary force in draft provisions*  
  **Time estimate:** 15-30 minutes per provision  

  #### **Step 1: Intention Check**  
  *Question: "Do we intend this provision to CHANGE the law (e.g., create duties/powers/offences) or merely DESCRIBE/OPINE on a state of affairs?"*  
  - **Sufficient answer:**  
    - "Change": Proceed to Step 2.  
    - "Describe/Opine": Proceed to Step 5.  
    - "Unclear": **STOP. Senior drafter must clarify intent.**  
  *Theory basis:* Austin’s performative/constative divide.  

  #### **Step 2: Performative Force Triggers (For 'Change' Provisions)**  
  *Question: "Does the text contain a 'performative verb' (e.g., 'shall', 'must', 'is guilty of', 'repeals') that explicitly signals legal effect?"*  
  - **Sufficient answer:**  
    - **Yes** (e.g., "shall", "must"): Proceed to Step 3.  
    - **No** (e.g., "aims to", "encourages"): **FLAG HIGH RISK**. Revise to add performative verb unless policy intent is genuinely soft.  
  *Theory basis:* Austin’s explicit performatives; Searle’s directives/declaratives.  

  #### **Step 3: Authority & Precision Check**  
  *Question: "Is Parliament/Crown authorised to enact this, and is the provision PRECISE enough to be actionable?"*  
  - **Sub-questions:**  
    - (a) *Authority:* Does the provision fall within Parliament’s competence or delegated powers?  
    - (b) *Precision:* Are the addressee, action, and conditions clear (e.g., who must do what, when)?  
  - **Sufficient answers:**  
    - (a) Yes + (b) Clear terms (e.g., "The Secretary of State shall publish X within 30 days"): Proceed to Step 4.  
    - (a) Unclear (e.g., encroaches on judiciary) **or** (b) Vague (e.g., "ensure adequate standards"): **STOP. Senior drafter/judgment needed.**  
  *Theory basis:* Austin’s felicity condition: "appropriate persons and circumstances".  

  #### **Step 4: Enforceability & Uptake Check**  
  *Question: "Can this provision be enforced or relied upon in court?"*  
  - **Sub-questions:**  
    - Is there a mechanism for enforcement (e.g., judicial review, offence penalty)?  
    - Would courts treat this as justiciable (e.g., not purely political)?  
  - **Sufficient answers:**  
    - Clear enforcement path (e.g., penalty clause, JR standard): **PASS. Strong performative force.**  
    - No enforcement path/ambiguous justiciability: **REVISE** (e.g., add remedy, clarify non-justiciability).  
  *Theory basis:* Austin’s "uptake" condition; Searle’s direction of fit (world-to-word).  

  #### **Step 5: Constative Force Triggers (For 'Describe/Opine' Provisions)**  
  *Question: "Does the text use WEAK performatives (e.g., 'recognises', 'notes') or avoid legal operatives (e.g., 'shall', 'must')?"*  
  - **Sufficient answer:**  
    - **Yes** (e.g., "Parliament recognises..."): Proceed to Step 6.  
    - **No** (uses ambiguous terms like "affirms"): **FLAG RISK**. Revise to weaken (e.g., replace "affirms" with "considers").  
  *Theory basis:* Searle’s expressives/assertives vs. declaratives.  

  #### **Step 6: Anti-Performativity Check**  
  *Question: "Could this provision be MISINTERPRETED as creating binding duties (e.g., due to context or strong verbs)?"*  
  - **Sub-questions:**  
    - Does it use imperative-sounding verbs (e.g., "affirms", "declares")?  
    - Is it placed next to binding provisions?  
  - **Sufficient answers:**  
    - No weak verbs + standalone: **PASS. Low risk.**  
    - Strong verbs/proximate to binding clauses: **REVISE** (e.g., add "This section does not create a legally enforceable right").  
  *Theory basis:* Contextual uptake (courts may construe as declarative).  

  ---

  ### **Application to Draft Clauses**  
  *(Using the procedure above)*  

  **Clause 1:**  
  *"The Secretary of State shall ensure that waiting times for elective surgery do not exceed 18 weeks from the date of referral."*  
  - **Step 1:** Intends to **change** law (impose duty).  
  - **Step 2:** **Yes** ("shall ensure" = performative verb).  
  - **Step 3:**  
    - (a) *Authority:* Yes (SoS has health remit).  
    - (b) *Precision:* **FLAG** – "ensure" is broad; no explicit duty-holder below SoS.  
  - **Step 4:** **HIGH RISK** – Courts may deem "ensure" aspirational without enforcement mechanics (e.g., *R (Friends of the Earth) v Sec of State for Transport* [2020]).  
  **Conclusion:** REVISE. Add specificity (e.g., "NHS England shall achieve waiting times under 18 weeks in 95% of cases") or enforcement (e.g., mandatory reporting).  

  **Clause 2:**  
  *"Parliament affirms that access to high-quality broadband is essential for full participation in the economic and civic life of the United Kingdom."*  
  - **Step 1:** Intends to **describe/opine** (policy goal).  
  - **Step 5:** **FLAG** – "Affirms" is ambiguous (can be declarative in law).  
  - **Step 6:** **HIGH RISK** – Courts may read as creating a duty to provide broadband (e.g., *R (SC) v Sec of State for Work and Pensions* [2021] on "recognises").  
  **Conclusion:** REVISE. Replace "affirms" with "recognises" or "considers"; add: "This section creates no justiciable right to broadband." **This is the "unwanted truth"** – your declarative intent is vulnerable to judicial overreach.  

  **Clause 3:**  
  *"The Secretary of State may by order designate any area as a special economic zone, and the provisions of Schedule 3 shall have effect in relation to any area so designated."*  
  - **Step 1:** Intends to **change** law (confer power + automatic effect).  
  - **Step 2:** **Yes** ("may designate" = permissive performative; "shall have effect" = binding).  
  - **Step 3:**  
    - (a) *Authority:* Yes (delegated powers assumed).  
    - (b) *Precision:* Clear (trigger: designation; effect: Schedule 3 applies).  
  - **Step 4:** Self-executing via statutory instrument → **PASS. Strong performative force.**  
  **Conclusion:** ACCEPTABLE. No revision needed.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve contextual ambiguity:**  
     - A provision’s force may depend on its place in the Act (e.g., preamble vs. substantive part). Courts use contextual interpretation (*Noscitur a sociis*).  
  2. **Predict judicial activism:**  
     - Some courts may impose aspirational readings on strong duties (e.g., climate targets) or invent rights under "declarations".  
  3. **Override constitutional limits:**  
     - E.g., If Parliament "declares" a court judgment void, this may fail under Austin’s infelicity conditions (lack of authority).  
  4. **Fix inherently vague policy:**  
     - Provisions like "public authorities shall have regard to wellbeing" will always require judicial gloss.  
  5. **Capture implied effects:**  
     - E.g., A duty on X may create an implied right for Y, regardless of wording.  

  **Where It Misfires:**  
  - **Overly rigid directives** (e.g., "must achieve 100% coverage") may be struck down as impossible → procedure won’t catch feasibility.  
  - **Cultural/political factors:** A "should" in a sanctions regime may be treated as "must" due to context.  

  **Final Advice:** This procedure catches 80% of force errors but cannot replace senior drafter judgment on constitutional principles, context, or novel legislative techniques. Always test provisions against case law on similar phrasing (e.g., "must" vs. "shall endeavour"). When in doubt, **explicitly state force** (e.g., "For avoidance of doubt, this section is aspirational").  

  ---  
  *This procedure synthesises Austin/Searle into actionable legislative hygiene. It is not a substitute for legal advice but a pre-emptive strike against botched illocution.*
