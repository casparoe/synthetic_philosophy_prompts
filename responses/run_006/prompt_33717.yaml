  Okay, the user is a senior legislative drafter at the UK's Office of the Parliamentary Counsel. They're dealing with a critical problem: ensuring that legislative provisions achieve the intended legal effect. Provisions meant to change the law are sometimes interpreted as merely aspirational, while declaratory statements are occasionally read as creating binding obligations. This stems from issues with illocutionary force—whether a provision actually performs a legal action or just describes something. 

  The user wants a practical decision procedure rooted in speech act theory (Austin, Searle) but usable by drafters without philosophy training. It needs to be a clear checklist with stopping rules, sufficient answers, and flags for human judgment. They also want it applied to three specific clauses, with at least one revealing a serious defect requiring revision. Finally, they need honesty about the procedure's limitations.

