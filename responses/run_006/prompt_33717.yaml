  - Is there a clear legislative intention to *do* something (performative)?  
  - Does the provision meet conditions for successful legal speech acts?  
  - What type of force is intended vs. conveyed?  

  The checklist should flag ambiguities early. For example:  
  1. **Intention check**: Does the drafter intend to create legal effect? (If no, proceed cautiously—high risk of unintended force.)  
  2. **Operative verb analysis**: Does the verb typically perform legal acts (e.g., "shall," "must," "is guilty of")?  
  3. **Authority/context check**: Would Parliament reasonably be understood as exercising power here?  
  4. **Precision check**: Is the obligation/action sufficiently precise? (Vagueness invites aspirational readings.)  
  ...and so on, with clear "STOP: JUDGMENT NEEDED" flags.  

  Now, applying it to the clauses:  
