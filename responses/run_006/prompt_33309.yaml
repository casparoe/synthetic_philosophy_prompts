  3. Only one material object occupies the shelf at any time (e.g., the clay is not distinct from the lump).  
  4. The landslide case involves no statue, as intentional creation is necessary.  
  5. Reworking destroys the horse statue and creates a dragon statue, but the lump persists.  

  These stem from a view that privileges *persistence conditions* and *artifactual status* while avoiding coincident entities. The principle unifying your verdicts is:  

  **Principle**: A material object is fundamentally a quantity of matter; artifacts (e.g., statues) are not distinct material objects but *temporal phases* of that matter, initiated by intentional creation for a purpose and terminated by the destruction of their essential form or function, while the matter persists.  

  ### How the Principle Delivers Your Verdicts:  
  - **Lump's persistence and statue's creation/destruction (Cases 1–2, 4–5)**: The lump is the quantity of matter itself. The statue is a phase of that matter, beginning when an agent intentionally shapes it for a purpose (e.g., art) and ending when the form is destroyed (e.g., squashing) or altered (e.g., reworking). This explains why the lump exists before, during, and after the statue phase, and why squashing destroys the statue but not the lump.  
