    - *Motivating clause*: Material objects are quantities of matter; artifacts are phases.  
  - **Landslide case (Case 6)**: No statue exists because intentional creation is absent. The matter is arranged horse-wise, but without agency or purpose, it only constitutes clay (a lump-phase), not an artifact-phase.  
    - *Motivating clause*: Artifact phases require intentional creation.  
