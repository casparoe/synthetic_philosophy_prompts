prompt: |-
  So I'm the person at my company who got stuck with "the welfare question," and I need to turn it into something we can actually use. I work for a salmon farming operation — we do Atlantic salmon, about 15,000 tonnes a year, and we've just started a small shrimp pilot that my boss is already regretting because the welfare standards for crustaceans are basically a philosophical minefield. Our retailers are starting to demand welfare certifications, and the certifiers all have different frameworks: one cares mostly about slaughter method, another is obsessed with stocking density and "natural behavior," a third just wants us to measure cortisol levels and call it a day. We get a proposal every few months — switch to electrical stunning, add shelters to the shrimp ponds, reduce density by 15%, try out this new feed that's supposed to reduce aggression — and right now we evaluate them by gut feel and whatever the most recent certifier audit flagged.

  My CEO wants a decision procedure. Not a philosophy paper, not a literature review — a step-by-step thing that our ops team can run a proposal through in an afternoon and come out with a clear recommendation: do it, don't do it, or gather more evidence on X before deciding. The constraints: the people using it are biologists and engineers, they have zero patience for moral theory, and the stakes are real — we're talking decisions that range from a few grand to low six figures, four or five times a year. I want the procedure to handle at least three test cases: (1) switching from ice slurry to percussive or electrical stunning at harvest, (2) adding structural enrichment to the salmon net pens, and (3) lowering stocking density by 20%. For each step in the procedure, tell me what the diciest case is — the one where the step is most likely to misfire or give a nonsense answer. And here's the thing that keeps me up: for the shrimp, we don't even know if they feel pain in a way that matters. So the procedure needs to tell us what to do when the relevant science isn't settled, not just assume it is. If there's a point where the procedure has to say "a human needs to make a values call here and we can't automate that," mark it clearly — my CEO will hate it but I'd rather know.
reasoning: |-
  Okay, let's start by unpacking the user's situation. They work at a salmon farming company that's also dabbling in shrimp. Their main problem is handling welfare proposals from various certifiers with conflicting priorities. The CEO wants a straightforward decision procedure that ops can use without getting bogged down in ethics. 

  First, I need to identify the core requirements: a step-by-step process for evaluating welfare proposals that's practical, quick, and handles scientific uncertainty—especially with shrimp where pain perception is unclear. The user mentioned three test cases: stunning methods, enrichment, and stocking density. 

  Looking deeper, the real pain points seem to be the lack of consistent criteria and the pressure from retailers demanding certifications. The ops team is frustrated with ad-hoc evaluations. The unspoken need here might be to harmonize different certifier demands into a single framework to avoid repeated audits and conflicting requirements. 

  I should focus on creating a structured workflow that prioritizes evidence and operational impact. Key elements would include risk assessment, evidence grading, cost-benefit analysis, and scalability. For the shrimp dilemma, the procedure must flag areas where science is inconclusive and require human judgment—no fudging that. 

  The user also wants to know where the procedure could fail. For example, grading evidence quality might be tricky with conflicting studies. Cost-benefit analysis might overlook hidden costs like training. Scalability is a big concern—what works for salmon might not for shrimp, so the procedure needs flexibility. 

  I need to ensure each step is actionable. For instance, using a points system for evidence strength could make it objective. Including pilot testing as a recommendation adds a safety net for uncertain interventions. Highlighting "values call" points upfront will manage CEO expectations, even if it's unpopular. 

  Finally, the procedure should empower the ops team, giving them clarity without philosophy. By addressing both scientific and operational angles, it becomes a tool for confident decision-making, turning a welfare headache into a streamlined process.
answer: |-
  Here’s a practical **Welfare Intervention Decision Procedure (WIDP)** designed for biologists/engineers, focused on evidence, risk, and operational impact. It handles scientific uncertainty explicitly and flags unavoidable value judgments.

  ---

  ### **Welfare Intervention Decision Procedure (WIDP)**
  *Run each proposal through these 8 steps. Requires 1 ops lead, 1 biologist, 1 engineer. Time: 2-4 hours.*

  **Step 1: Define the Welfare Problem**  
  *What specific harm does this intervention address? (e.g., injury during harvest, aggression in pens)*  
  - **Input**: Proposal document, certifier requirements.  
  - **Output**: Clearly stated problem (1-2 sentences).  
  - **Dicey Case**: Vague proposals (e.g., "improve shrimp welfare"). *Solution: Reject until problem is specified.*  

  **Step 2: Evidence Quality Assessment**  
  *Grade evidence linking the intervention to welfare improvement:*  
  - **A** (Strong): Replicated lab/field studies in target species.  
  - **B** (Moderate): Studies in related species + expert consensus.  
  - **C** (Weak): Anecdotal/observational data only.  
  - **Output**: Evidence grade (A/B/C), knowledge gaps.  
  - **Dicey Case**: Crustacean pain evidence (automatic "C" grade due to unsettled science).  

  **Step 3: Welfare Risk Matrix**  
  *Assess severity of current harm vs. potential new risks from the intervention:*  
  | **Severity of Current Harm** | **Risk of New Harms** | **Action** |  
  |------------------------------|------------------------|------------|  
  | High                         | Low                   | **Prioritize** |  
  | High                         | High                  | Pilot test needed |  
  | Low                          | Any                   | Low priority |  
  - **Output**: "Prioritize," "Pilot," or "Low Priority."  
  - **Dicey Case**: "Low current harm" with high certifier pressure (e.g., structural enrichment in salmon). *Solution: Flag for CEO review if certifier relationship is critical.*  

  **Step 4: Cost-Benefit Threshold**  
  *Calculate:*  
  **Benefit Score** = (Evidence Grade Factor) × (Severity Reduction Estimate)  
  - *Evidence Factor*: A=1.0, B=0.7, C=0.3  
  - *Severity Reduction*: % reduction in harm (e.g., 30% fewer injuries)  
  **Cost Score** = (Implementation Cost) + (Ongoing Costs)  
  - **Decision Rule**:  
    - **Do It**: Benefit Score ≥ 3 × Cost Score  
    - **Don’t Do It**: Benefit Score < 1 × Cost Score  
    - **Pilot Test**: All others  
  - **Dicey Case**: High-cost interventions with weak evidence (e.g., 20% density reduction). *Solution: Default to "Pilot" if Benefit Score is 1-3× Cost Score.*  

  **Step 5: Certifier Alignment Check**  
  *Will this satisfy ≥1 major certifier?*  
  - Yes → +0.5 to Benefit Score  
  - No → No change  
  - **Dicey Case**: Conflicting certifier demands (e.g., electrical stunning satisfies Certifier A but not B). *Solution: Note the conflict but don’t override Steps 2-4.*  

  **Step 6: Uncertainty & Values Flag**  
  *Stop and escalate if:*  
  - Evidence Grade = **C** AND Cost Score > $50k → **"VALUES CALL NEEDED: Is this harm severe enough to act despite weak evidence?"**  
  - **Dicey Case**: Shrimp stunning (unknown pain + high implementation cost). *Automatic escalation point.*  

  **Step 7: Pilot Protocol Design**  
  *If "Pilot" is recommended:*  
  - Define success metrics (e.g., mortality, injury rates).  
  - Set budget cap (max 20% of full rollout cost).  
  - Timeline: 3-6 months.  
  - **Dicey Case**: Pilots with no clear metrics (e.g., "natural behavior" enrichment). *Solution: Require quantifiable metrics.*  

  **Step 8: Final Recommendation**  
  | **Output**          | **Conditions**                                      |  
  |----------------------|-----------------------------------------------------|  
  | **DO IT**            | Benefit Score ≥ 3× Cost Score OR High Risk + Certifier Mandate |  
  | **DON’T DO IT**      | Benefit Score < 1× Cost Score AND Low Severity      |  
  | **PILOT TEST**       | All other cases                                     |  
  | **ESCALATE TO CEO**  | Values Flag triggered (Step 6)                      |  

  ---

  ### **Test Case Applications**
  1. **Switching to Electrical Stunning**  
     - Step 2: **Grade A** (strong evidence in salmon).  
     - Step 3: **High** current harm (prolonged stress in slurry).  
     - Step 4: **Benefit Score** = 1.0 × 40% = 0.4; **Cost Score** = 0.15 (high capex). → **Benefit < 3×Cost** → *Pilot Test*.  

  2. **Adding Salmon Pen Enrichment**  
     - Step 2: **Grade B** (mixed evidence for aggression reduction).  
     - Step 3: **Low** current harm (no major outbreaks) → *Low Priority*.  
     - Step 5: +0.5 if certifier demands it. → Likely *Don’t Do It* unless certifier pressure.  

  3. **Lower Stocking Density by 20%**  
     - Step 2: **Grade A** for salmon (better growth/health), **Grade C** for shrimp (unknown).  
     - Step 4 (Salmon): Benefit 1.0 × 25% = 0.25; Cost = 0.25 (lost production) → **Benefit ≈ Cost** → *Pilot Test*.  
     - Step 4 (Shrimp): Benefit 0.3 × 20% = 0.06; Cost = 0.3 → **Benefit < Cost** → *Don’t Do It* (unless Values Call overrides).  

  ---

  ### **Why This Works for Your Team**
  - **No Philosophy**: Uses evidence grading and quantifiable risk/cost thresholds.  
  - **Handles Uncertainty**: Low evidence scores trigger pilots or escalation.  
  - **Fast**: Uses simple scoring (no complex math).  
  - **Audit Trail**: Documents decisions against certifier demands.  
  - **CEO-Friendly**: Explicitly flags where values calls are unavoidable (Step 6).  

  **First Step**: Run your next certifier proposal through this with your team. Refine the scoring factors based on your cost structure. The goal isn’t perfection—it’s replacing "gut feel" with a defensible, repeatable process.
