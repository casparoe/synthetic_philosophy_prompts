  I did a theology degree a while back and now I keep hearing about the AI alignment problem from techie friends. From what I can gather, the basic shape is: we're trying to build something vastly more powerful and intelligent than ourselves, and we need to make sure it doesn't destroy everything we value — either through malevolence or, more likely, through competently pursuing some goal that just isn't what we meant. And honestly, this sounds like a theological problem. A creator, a creation that might go wrong, the gap between intention and outcome, the question of whether you can build goodness into something from the start or whether it has to be a ongoing relationship — I feel like theology has been here before.

  So here's what I want: restate the core alignment problem (inner and outer alignment, specification gaming, goal misgeneralization, value loading, corrigibility — whatever the important pieces are) using the vocabulary of Christian theology. Use whatever fits: theodicy and the problem of evil, original sin, the fallen will, concupiscence, grace, natura pura and natura corrupta, divine hiddenness, the distinction between God's absolute and ordained power, eschatology, theosis, whatever carries weight. Don't just sprinkle theological terms on top; do the actual translation. Show me where the mapping is tight and where you have to stretch.

