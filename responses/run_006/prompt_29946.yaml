prompt: |-
  so here's something that's been bugging me. my country lets me vote in national elections even though i've lived abroad for over a decade — i don't pay taxes there, i'm not subject to most of its laws, the policies don't really affect my daily life. meanwhile my neighbor here, who's been a legal resident for fifteen years, pays full taxes, sends her kids to local schools, is subject to all the same laws i'm not, but can't vote because she never naturalized. and it's not just my country — lots of democracies do versions of this: lifetime voting rights for expats, sometimes even for their descendants who've never set foot in the country, while denying the vote to long-term resident noncitizens.

  what theory of who belongs to the demos does this pattern presuppose? it seems like it can't be an "all-affected interests" principle because the resident noncitizen is clearly more affected than i am. it can't be an "all-subjected persons" principle for the same reason. so is it just blood-and-soil ethnic nationalism dressed up in democratic language? or is there a coherent democratic theory that actually justifies privileging the absentee citizen over the resident foreigner?

  and i want to push on this a bit. if the theory is something like "citizenship is a permanent relational property, not a matter of current stakes," then what does that imply for people who renounce citizenship — are they making a metaphysical mistake about what citizenship is? and if we took the theory seriously, what else would it commit us to — like, should emigrants get to vote on tax rates they don't pay? should immigrants get voting rights after some number of years regardless of naturalization? i'm trying to figure out whether the practice is just an awkward historical compromise or whether there's a philosophically respectable position underneath it, and if there is one, whether anyone actually believes what it implies.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're frustrated with the voting rights discrepancy between expats like themselves and long-term residents in their host country. They mention living abroad for over a decade but still being able to vote in their home country's elections, while their neighbor, a legal resident for fifteen years, can't vote locally. This raises a fundamental question about democratic theory: who belongs to the demos?

  First, I need to identify the core issue. The user points out that neither the "all-affected interests" nor "all-subjected persons" principles explain this practice. They suspect it might be rooted in ethnic nationalism but are open to other theories. Their deeper concern seems to be whether there's a coherent philosophical justification or if it's just a historical artifact.

  I recall that citizenship-based voting is common in democracies. The key theories here are the "constituency principle" and the "stakeholder" model. The constituency principle ties voting rights to formal membership, emphasizing the state's structure as an association of citizens. The stakeholder model focuses on having a long-term stake in the community's future. Both explain why expats retain voting rights—they're seen as part of the nation, even if abroad.

  But the user's neighbor is a long-term resident who pays taxes and follows laws. Why doesn't she get voting rights? Here, the distinction between legal subjects and the sovereign demos comes in. Non-citizens are subject to laws but aren't part of the decision-making body. This might stem from a nation-state model where citizenship is exclusive. The user questions if this is ethnic nationalism. While there might be historical ties to that, contemporary justifications often cite formal membership and stakeholder interests. Still, the outcome can feel exclusionary, especially in diverse societies.

  The user also brings up descendants voting. That points to intergenerational citizenship transmission. Countries like France and Italy allow this, which leans into bloodline-based inclusion. This does raise questions about ethnic nationalism, especially when contrasted with excluded residents. But countries vary; some have moved toward residency-based inclusion, like New Zealand and some EU nations allowing local voting.

  The renunciation question is interesting. If citizenship is permanent, renouncing it would be rejecting that bond. But legally, it's a choice with consequences. The tax issue is trickier. Most countries don't tax non-resident citizens, but the U.S. does. Letting expats vote on domestic policies without paying taxes is inconsistent unless they're voting on foreign policy affecting diaspora.

  The user's underlying frustration might be about fairness and inclusion. They see the neighbor contributing more but having less say. This highlights a gap in democratic practice. Philosophically, there's tension between formal membership and actual impact. The user might be seeking validation that this system is flawed or exploring arguments to advocate for change.

  I should consider if there are real-world examples where residency grants voting rights. Mentioning countries like New Zealand or EU local elections could show alternatives. Also, discussing stakeholder versus subjecthood clarifies the theory-practice gap. The user's deeper need might be to understand if the current system is justifiable or if it's an inconsistency that needs addressing in democratic theory.
answer: |-
  You've hit on one of the deepest tensions in democratic theory – the question of **who constitutes "the people" (demos)** and who gets to decide. The pattern you describe isn't logically consistent under pure "affected interests" or "all-subjected" principles. Instead, it relies on a complex (and sometimes contradictory) blend of historical, legal, and philosophical concepts:

  1.  **The "Constituency Principle" (Formal Membership):**
      *   **Core Idea:** The demos is defined by formal citizenship, understood as a **permanent legal and political bond** to a specific state. Voting rights are a core attribute of *membership* in this political community, analogous to shareholder rights in a corporation.
      *   **Justification for Expats:** Citizenship is seen as enduring. Expats are still members, retain cultural ties, may return, have family in the country, and possess ancestral links. They are affected by the nation's international standing, foreign policy, and potentially future return. Denying their vote would be severing their membership bond.
      *   **Justification for Excluding Non-Citizen Residents:** Non-citizens, regardless of duration or contribution, are *not formal members* of the political community defined by the constitution. Naturalization is the prescribed path to membership; skipping it undermines the meaning of citizenship and potentially democratic self-determination defined by existing members.
      *   **Analogy:** Think of a club. Members (citizens) retain voting rights even if temporarily absent. Long-term guests (residents), no matter how involved, don't automatically become voting members without going through the formal admission process.

  2.  **The "Stakeholder" Principle (Long-Term Interest):**
      *   **Core Idea:** Voting rights belong to those with an *enduring, significant stake* in the *long-term future* of the political community. Citizenship is the best proxy for this stake.
      *   **Justification for Expats:** Expats have a permanent stake via ancestry, cultural identity, potential inheritance, family ties, and the possibility of return. They are invested in the nation's long-term trajectory and international reputation.
      *   **Justification for Excluding Non-Citizen Residents:** While residents have significant *current* stakes, the argument is that their long-term commitment isn't legally guaranteed. They *might* leave. Citizenship signifies a formal, permanent commitment to the nation's future. Their primary long-term stake is assumed to remain with their country of citizenship (even if practically, it doesn't).
      *   **Weakness:** Clearly, a 15-year resident raising children locally often has a deeper *de facto* long-term stake than an expat with no plans to return. This exposes the flaw in relying *solely* on citizenship as the stake proxy.

  3.  **The "Nation-State" Model (Cultural/Political Community):**
      *   **Core Idea:** The demos is coextensive with the *nation* – a group sharing history, language, culture, ethnicity, or political identity – which is organized as a *state*. Citizenship formalizes belonging to this nation-state.
      *   **Justification for Expats (and Descendants):** They are part of the dispersed *nation*, even if not residing on the state's territory. Bloodline (jus sanguinis) is a powerful mechanism for defining this belonging.
      *   **Justification for Excluding Non-Citizen Residents:** They belong to a different nation, even if integrated. Full inclusion requires formal adoption into the national community (naturalization).
      *   **The "Blood-and-Soil" Question:** This *can* slide into ethnic nationalism, especially when descendants with no connection beyond ancestry can vote, while deeply integrated residents cannot. It prioritizes *ascribed* identity (birth) over *achieved* integration (residency, participation). However, modern democracies often justify this more as preserving a *political* community defined by historical ties and formal membership rules, even if the origins were ethnic.

  **Addressing Your Specific Questions:**

  *   **Citizenship as Permanent vs. Renunciation:** Proponents *do* see citizenship as a fundamental, enduring relationship. Renouncing it *is* seen as severing that bond deliberately. It's not a "metaphysical mistake" by the renouncer; it's a conscious choice to end the relationship, including its rights and duties. The state accepts that choice and removes the person from the demos.

  *   **Implications & Inconsistencies (Taxes, Policy Impact):** You've identified the core tension:
      *   **Taxation:** Expats voting on domestic tax policies they don't pay *is* a major inconsistency under an "affected interests" view. The "constituency" model justifies it purely by membership, regardless of immediate fiscal contribution. (Note: The US *does* tax citizens abroad, partly mitigating this). This leads to the "representation without taxation" critique.
      *   **Policy Impact:** Expats *are* affected by foreign policy, defense, diaspora services, citizenship laws, and policies affecting property/relatives back home. Residency requirements for *specific* elections (e.g., only presidential/parliamentary, not local) sometimes exist. The argument is they vote on matters concerning the *nation-state* they belong to, not just their immediate daily life abroad.
      *   **Immigrant Voting Rights:** The "constituency" and "nation-state" models resist automatic voting rights without naturalization, seeing it as eroding the meaning of citizenship. The "stakeholder" and "all-subjected" principles strongly support residency-based rights after a period (e.g., 5-10 years). Some countries *do* allow this at the *local* level (e.g., EU citizens in other EU countries, New Zealand after 1 year, parts of the UK for Commonwealth citizens), acknowledging the local "all-subjected" principle without granting full national membership. This is a pragmatic compromise.

  **Conclusion: Awkward Compromise or Respectable Theory?**

  It's **both**:

  1.  **Philosophically Respectable (Within Limits):** The "Constituency Principle" (citizenship as enduring membership) and the "Stakeholder Principle" (citizenship as proxy for long-term interest) *are* coherent democratic theories. They prioritize the stability and self-definition of the political community. Nation-states have the right to define their membership.
  2.  **Historically Contingent & Awkward:** The model predates mass migration and easy global mobility. Prioritizing bloodline descendants abroad over integrated residents *does* have roots in ethnic nationalism, even if dressed in modern legalistic language. The glaring inconsistency between the expat's minimal *de facto* stake and the resident's deep *de facto* stake exposes a flaw in relying *solely* on formal citizenship as the criterion.
  3.  **An Unresolved Tension:** Modern democracies struggle with this. The rise of large non-citizen resident populations challenges the purity of the citizenship-based demos. The "all-subjected" principle is gaining traction, especially locally. The justification for expat voting often relies more on sentiment, diaspora influence, and historical ties than strict democratic principle.

  **Does anyone believe the full implications?** Many proponents genuinely believe in the primacy of formal citizenship and the enduring nature of the bond. They accept that this means expats vote on things that don't immediately affect them and residents don't vote on things that deeply affect them, seeing it as the necessary consequence of bounded political communities. Others find this increasingly untenable and advocate for reforms, particularly towards granting resident voting rights after a significant period or at local levels, while often still defending some form of expat voting rights based on enduring membership. The debate is very much alive. Your frustration highlights a genuine democratic dilemma.
