  I've been going down this rabbit hole lately about the simulation argument — you know, the idea that we're probably living in a computer simulation run by some advanced civilization. I'm not an academic or anything, just someone who stays up too late reading stuff online. And the more I think about it, the more it seems like this should totally change how we think about the far future, right? Like, there's a whole community of people — effective altruists and such — who are obsessed with making sure humanity survives for millions or billions of years, because they say there could be an astronomical number of future people whose wellbeing is at stake. That's the whole reason they care so much about AI risk and pandemics and all that.

