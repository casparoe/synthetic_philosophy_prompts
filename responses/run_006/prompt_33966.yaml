prompt: |-
  I've been reading LessWrong and the broader rationalist blogosphere for close to a decade, and I've watched the same failure mode play out in comment sections, subreddits, and group chats more times than I can count: a thread generates hundreds of comments of increasingly acrimonious disagreement, and eventually someone — often too late — points out that the whole thing was a dispute about what to call something. Other times, the failure runs the other way: someone prematurely dismisses a disagreement as "just semantics" when there's actually a substantive empirical or normative question underneath, and the move functions as a conversation-stopper rather than a conversation-solver.

  I want a tool I can use myself and point other people to. Please write me a decision procedure for determining whether a disagreement is substantive or merely verbal. The procedure should be something a reasonably careful participant in an online discussion can run in a few minutes, without special training in philosophy of language. It should take the form of a series of questions to ask in order, with clear stopping rules: at what point the procedure says "this is probably a verbal dispute — here's how to dissolve it" and at what point it says "this is probably substantive — the object-level argument is worth having."

  Ground the procedure in whatever the philosophical literature on verbal disputes and metaontology has actually established — but translate it into operational steps. Do not just summarize the taxonomy; I want the protocol. The procedure should handle the following hard cases:

  - Disagreements where the two sides are using the same word with different extensions (they're talking past each other without realizing it).
  - Disagreements where one side denies there's a fact of the matter at all, while the other insists there is.
  - Disagreements where the disputants agree on every empirical fact and every value judgment but disagree about which conceptual scheme to adopt — and the question is whether that remaining disagreement is itself substantive or merely a choice of labeling.
  - Disagreements that are partly verbal and partly substantive, where the procedure needs to separate the two components rather than issuing a binary verdict.

  The procedure should flag the points where judgment cannot be eliminated — where even a perfectly executed protocol hands the question back to a human because the judgment call is itself substantive. It should be honest about the cases where it will misfire, and about what kind of error it is biased toward (false positives for "verbal" or false positives for "substantive").

  Then apply the procedure to three worked examples:

  1. **The hot dog sandwich debate.** The classic internet argument. Is a hot dog a sandwich? This one is low-stakes and familiar, and it should let the procedure show its basic moves on a clean case.

  2. **AI understanding.** A dispute about whether a large language model that passes every behavioral test we can devise "understands" language. One side says the word "understands" requires something about internal representations or grounding; the other says functional equivalence is sufficient. I want to see whether the procedure classifies this as verbal, substantive, or mixed — and, if verbal, whether it can specify what the substantive disagreement is that the word "understands" is obscuring.

  3. **Fetal personhood.** A dispute about whether a fetus is a "person." This is the one I care about most, because I suspect the procedure will reveal that the dispute is partly a verbal disagreement about the word "person" and partly a genuine normative disagreement about what matters morally — and I want to see whether the procedure can cleanly separate those two components and, if so, what remains of the argument after the verbal part is dissolved.

  I want the procedure to be something I can literally copy-paste into a comment the next time a thread is going in circles. The worked examples should be concrete enough that someone reading the comment can see how to apply the procedure themselves, not just admire it in the abstract.
reasoning: |-
  We are going to design a decision procedure for determining whether a disagreement is substantive or merely verbal. The procedure will be a series of questions to ask in order, with stopping rules.

  The procedure is grounded in the philosophical literature on verbal disputes, especially the work of David Chalmers ("Verbal Disputes", 2011) and others. The key idea is that a dispute is verbal when it arises solely because the parties use a key term in different ways, and that if they were to disambiguate the term, the disagreement would disappear. A substantive dispute, on the other hand, persists even after the terms are disambiguated.

  However, we must be cautious: sometimes what appears to be a verbal dispute may mask a substantive disagreement about which concept is more appropriate or useful, and sometimes a dispute that seems substantive may turn out to be verbal upon closer inspection.

  The procedure will have the following structure:

  1. **Identify the key term(s) in dispute.**
  2. **Check for agreement on non-linguistic facts.**
  3. **Check for differences in meaning (extension and intension).**
  4. **Check for agreement on the underlying facts and values.**
  5. **Disambiguate and see if the disagreement persists.**
  6. **Check for substantive disagreement about conceptual choice.**
  7. **Separate mixed disputes.**

  We will design a flowchart-like series of questions. The user should follow the steps in order.

  ---

  **Decision Procedure: Is the Disagreement Substantive or Verbal?**

  **Step 1: Identify the key term(s) in dispute.**
     - Ask: What is the key word or phrase that the disagreement seems to center around? (e.g., in the hot dog example, it's "sandwich"; in the AI example, it's "understands"; in fetal personhood, it's "person".)
     - If there are multiple key terms, note them all. For now, focus on one at a time, starting with the most central.

  **Step 2: Check for agreement on non-linguistic facts.**
     - Ask: Do the disputants agree on all the non-linguistic facts that are relevant to the dispute? (Non-linguistic facts are facts about the world that do not depend on how we label things.)
     - If they do not agree on non-linguistic facts, then the dispute is at least partly substantive. Proceed to Step 3 to see if there is also a verbal component.
     - If they do agree on non-linguistic facts, then the dispute might be verbal. Proceed to Step 3.

  **Step 3: Check for differences in meaning.**
     - Ask: Are the disputants using the key term with different meanings? To determine this:
       - Have each side explicitly define what they mean by the term (if they haven't already).
       - Compare the definitions. Do they assign the term to different sets of things (different extensions) or do they have different criteria for applying the term (different intensions)?
     - If they are using the term with the same meaning, then the dispute is not verbal. Go to Step 4.
     - If they are using the term with different meanings, then there is a verbal component. Proceed to Step 5.

  **Step 4: Check for agreement on the underlying facts and values.**
     - (This step is only reached if the key term is used with the same meaning by both parties, so the dispute is not verbal. But we must check if the dispute is substantive.)
     - Ask: Given that they use the term the same way, do they still disagree about the truth of the statement? If yes, then the dispute is substantive.
     - Additionally, if the dispute is normative, check for agreement on values. If they agree on all non-linguistic facts and the meaning of the term, but disagree because they have different values, then that is a substantive normative disagreement.

  **Step 5: Disambiguate and see if the disagreement persists.**
     - (This step is reached when there is a difference in meaning.)
     - Ask the disputants to restate their positions using two different terms (or phrases) for the two different concepts. For example, instead of using "sandwich", they might use "sandwich-in-the-narrow-sense" and "sandwich-in-the-broad-sense".
     - After disambiguation, ask: Is there still a disagreement?
       - If the disagreement disappears, then the dispute was purely verbal.
       - If a disagreement remains, then there is a substantive component. Proceed to Step 6 to see if the remaining disagreement is about the choice of concept.

  **Step 6: Check for substantive disagreement about conceptual choice.**
     - (This step is reached after disambiguation when a disagreement remains.)
     - Ask: Is the remaining disagreement about which of the two concepts (the one from the first disputant or the one from the second) is more appropriate, useful, or valuable to use in the context?
     - If yes, then this disagreement may itself be substantive. It could be about:
       - Which concept better captures the natural structure of the world? (This is an empirical question.)
       - Which concept is more useful for a particular purpose? (This might be a practical question.)
       - Which concept is more in line with our linguistic conventions? (This might be a factual question about language use.)
       - Which concept we should adopt for moral or political reasons? (This is a normative question.)
     - Note: This step requires judgment. The disagreement about conceptual choice is substantive if it turns on empirical, practical, or normative questions that are not merely about the definition of words.

  **Step 7: Separate mixed disputes.**
     - If at any step you found both verbal and substantive elements, the dispute is mixed.
     - The procedure should try to separate the two:
       - The verbal component: the part that disappears upon disambiguation.
       - The substantive component: the part that remains after disambiguation, which may include:
          - Disagreement about non-linguistic facts.
          - Disagreement about values (in normative disputes).
          - Disagreement about which concept to use (if that disagreement is substantive).

  **Stopping Rules and Outputs:**

  - **At Step 2:** If there is disagreement about non-linguistic facts, then the dispute is at least partly substantive. Proceed to Step 3 to check for verbal components. (But note: we might later separate the two.)
  - **At Step 5:** If after disambiguation the disagreement disappears, output: "This dispute is purely verbal. To dissolve it, disambiguate the key term by using two different terms for the two concepts. Then, there is nothing left to argue about."
  - **At Step 5:** If after disambiguation a disagreement remains, then the dispute is not purely verbal. Proceed to Step 6.
  - **After Step 6:** 
     - If the remaining disagreement about conceptual choice is substantive (i.e., it turns on empirical, practical, or normative questions that are not merely about definitions), then output: "This dispute has a verbal component and a substantive component. The verbal part can be dissolved by disambiguation. The substantive part remains and is about [describe the substantive issue, e.g., which concept is more useful, or what the facts are, or what values should guide us]."
     - If the disagreement about conceptual choice is not substantive (e.g., it is only about what the word conventionally means, and both parties agree on the conventional meaning), then output: "The dispute is verbal. After disambiguation, there is no substantive disagreement left, because the choice of concept is arbitrary or conventional and both parties agree on the facts and values."

  **Biases and Limitations:**
  - The procedure is biased toward false positives for "verbal" in cases where the substantive disagreement about conceptual choice is subtle or hard to articulate.
  - It may misfire in cases where the disputants are not fully aware of their own commitments (e.g., they might think they agree on non-linguistic facts but actually don't).
  - Judgment is required in Step 6 to decide whether the disagreement about conceptual choice is substantive. The procedure cannot eliminate that judgment.

  ---

  Now, we'll apply the procedure to the three worked examples.

  ---

  **Worked Example 1: The Hot Dog Sandwich Debate**

  **Step 1:** Key term: "sandwich".

  **Step 2:** Agreement on non-linguistic facts? Yes. Both sides agree on the physical properties of a hot dog and a typical sandwich (like a ham sandwich). They agree that a hot dog consists of a sausage in a split roll, and that a typical sandwich has two separate pieces of bread or a single sliced roll with filling.

  **Step 3:** Difference in meaning? Yes. One side might define "sandwich" as any food item consisting of two pieces of bread with filling between them (which would exclude hot dogs). The other might define it as any food item consisting of bread and filling (which might include hot dogs). So they have different extensions (hot dog is in one and not the other).

  **Step 4:** Skip because we found a difference in meaning.

  **Step 5:** Disambiguate: Let's use "Sandwich-Narrow" (two separate pieces of bread) and "Sandwich-Broad" (bread with filling, including split rolls). Now ask: Is a hot dog a Sandwich-Narrow? Both will say no. Is it a Sandwich-Broad? Both will say yes. So the disagreement disappears.

  **Output:** The dispute is purely verbal. To dissolve it, note that under the narrow definition, a hot dog is not a sandwich, but under the broad definition, it is. Since both parties agree on the facts, there is nothing left to argue about.

  ---

  **Worked Example 2: AI Understanding**

  **Step 1:** Key term: "understands".

  **Step 2:** Agreement on non-linguistic facts? Mostly yes, but possibly not entirely. Both sides agree that the LLM passes behavioral tests (e.g., it answers questions appropriately, summarizes text, etc.). But one side might claim there are non-linguistic facts about internal representations (e.g., that they are not grounded in real-world experiences) that the other side doesn't acknowledge. However, let's assume they agree on the observable behavior and the internal architecture (that it's a transformer model trained on text). The disagreement might be about whether that architecture constitutes the right kind of internal state.

  **Step 3:** Difference in meaning? Yes. One side defines "understands" as requiring behavioral competence only (functionalist view). The other defines it as requiring certain internal states (e.g., consciousness, intentionality, or grounded representations).

  **Step 4:** Skip.

  **Step 5:** Disambiguate: Let "understands-behaviorally" mean passing the behavioral tests, and "understands-internally" mean having the right kind of internal states. Then:
     - Both agree that the LLM understands-behaviorally.
     - Both might agree that the LLM does not have the internal states (if the skeptic about AI understanding is right) or they might disagree about whether the internal states are present? But note: the internal states are also non-linguistic facts.

  However, after disambiguation, there might be two disagreements:

     (a) Does the LLM have the internal states? (This is a substantive non-linguistic question, but it might be hard to answer.)
     (b) Is it necessary to have the internal states to be said to "understand"?

  The first (a) is substantive. The second (b) is about the definition of "understand".

  But note: in Step 5, we disambiguate and then check if the disagreement remains. The original disagreement was about whether the LLM "understands". After disambiguation:

     - One side might say: "The LLM understands-behaviorally but not understands-internally."
     - The other might say: "I agree, but I think that 'understands' should mean understands-behaviorally, so it does understand."

  Now, the disagreement about whether the LLM has the internal states (if there is one) is substantive. But if they both agree that the LLM does not have the internal states (or does), then the remaining disagreement is about which concept to use.

  **Reapplication of Step 2 for (a):** If there is disagreement about the internal states, then that is a substantive non-linguistic disagreement. But if they agree on the internal states (or lack thereof), then we proceed.

  Assume they agree that the LLM does not have the internal states (as per the critic) and that it does have behavioral competence. Then:

     After disambiguation, the disagreement that remains is about whether "understands" should be defined behaviorally or internally. This is a disagreement about conceptual choice.

  **Step 6:** Is the disagreement about conceptual choice substantive? Yes, because it might turn on:
     - Which concept is more useful for cognitive science or AI safety?
     - Which concept captures the ordinary meaning of "understanding"?
     - Which concept is more important for moral considerations (e.g., if we are worried about deceiving humans)?

  So the dispute is mixed:

     - Verbal component: They were using "understands" with two meanings.
     - Substantive component: They disagree about which meaning is more appropriate, and that disagreement might be based on practical, empirical, or normative considerations.

  **Output:** This dispute has both verbal and substantive components. The verbal part is that "understands" is being used in two different ways. After disambiguation, we see that the LLM has behavioral competence but lacks (according to one side) the internal states. The substantive disagreement is about whether the behavioral concept or the internal-state concept is the one we should use in this context, which may depend on practical and normative factors.

  ---

  **Worked Example 3: Fetal Personhood**

  **Step 1:** Key term: "person".

  **Step 2:** Agreement on non-linguistic facts? Mostly yes, but perhaps not entirely. They agree on the biological facts about fetal development (e.g., when the heart beats, when brain activity starts, etc.). But they might disagree about what properties are morally relevant. However, the non-linguistic facts about the fetus (its capacities, etc.) are agreed upon.

  **Step 3:** Difference in meaning? Yes. One side defines "person" as a being with moral status (e.g., having consciousness, self-awareness, etc.), which a fetus (especially early) does not have. The other might define it as a member of the species Homo sapiens (thus including a fetus from conception).

  **Step 4:** Skip.

  **Step 5:** Disambiguate: Let "person-moral" be a being with moral status (e.g., having certain cognitive capacities) and "person-biological" be a human organism from conception. Then:
     - Both agree that the fetus is a person-biological (if we accept that definition) and not a person-moral (if it lacks the capacities).
     - But then the original disagreement about whether the fetus is a "person" has been dissolved.

  However, the real disagreement is about moral status. The proponent of the moral definition might say: "The fetus is not a person-moral, so it does not have the moral rights of a person." The opponent might say: "But it is a person-biological, and that is what matters for moral status." So now we see the moral disagreement.

  **Step 6:** But note: after disambiguation, we see that the disagreement is not about the word "person" but about what properties confer moral status. The two sides might now argue about whether being a biological human is sufficient for having moral status, or whether cognitive capacities are necessary.

  This is a substantive normative disagreement.

  **Output:** The dispute is mixed:
     - Verbal component: They were using "person" with two meanings (moral vs. biological).
     - Substantive component: After disambiguation, the substantive disagreement is about what properties confer moral status. This is a normative question.

  Therefore, the procedure would say: Dissolve the verbal part by distinguishing between two concepts of person. Then, the remaining argument is about the moral criteria for personhood (or more directly, about the moral status of the fetus).

  ---

  **Final Decision Procedure Text (for copy-pasting):**

  **Decision Procedure: Is the Disagreement Substantive or Verbal?**

  Follow these steps:

  1. **Identify the key term(s):** What word or phrase is at the center of the disagreement?
  2. **Check non-linguistic facts:** Do the parties agree on all the non-linguistic facts (i.e., the facts that don't depend on how we label things)? 
     - If no, then the dispute is at least partly substantive. Proceed to step 3 to check for a verbal component.
     - If yes, proceed to step 3.
  3. **Check for differences in meaning:** Are the parties using the key term with different meanings? Ask each side for their definition. Compare.
     - If they mean the same thing, the dispute is not verbal. Go to step 4.
     - If they mean different things, there is a verbal component. Proceed to step 5.
  4. **Check for underlying disagreement:** Since they use the term the same way, do they still disagree? 
     - If yes, the dispute is substantive (about facts or values).
     - If no, then the dispute was about something else and has been resolved. (This is rare if you got here.)
  5. **Disambiguate:** Replace the key term with two new terms (one for each meaning). Now, does the disagreement persist?
     - If the disagreement disappears, then the dispute was purely verbal.
     - If a disagreement remains, then there is a substantive component. Proceed to step 6.
  6. **Check for substantive conceptual choice:** Is the remaining disagreement about which concept (meaning) is more appropriate or useful? 
     - If the choice turns on empirical facts (e.g., which concept better carves nature at the joints?), practical concerns (e.g., which is more useful for a specific purpose?), or normative values (e.g., which concept better promotes fairness?), then this is substantive.
     - If it's only about what the word conventionally means (and both agree on the facts about conventional meaning), then it's verbal.

  **Outputs:**
  - If step 5 shows the disagreement disappears: "Purely verbal dispute. Disambiguate and move on."
  - If step 5 shows remaining disagreement and step 6 finds the conceptual choice is substantive: "Mixed dispute. Verbal component: use different terms for the two meanings. Substantive component: [describe the remaining issue]."
  - If step 5 shows remaining disagreement and step 6 finds the conceptual choice is not substantive: "Mostly verbal. After disambiguation, the remaining issue is about language conventions and is not substantive."

  **Limitations:**
  - This procedure may sometimes misclassify a substantive dispute as verbal (false negative for substantive) if the parties are not fully aware of their own non-linguistic disagreements.
  - It requires honest and clear definitions from the parties.
  - Step 6 involves judgment about whether the conceptual choice is substantive.

  Apply this to your disputes to clarify and move forward.
answer: |-
  Below is a decision procedure for distinguishing substantive from verbal disagreements, designed as a practical, step-by-step protocol. It draws on philosophical work by David Chalmers ("Verbal Disputes"), Rudolf Carnap (on explication), and Kit Fine (on metaontology), but is operationalized for ease of use. The procedure is structured as a flowchart with clear stopping points, handles the hard cases you described, and flags unavoidable judgment calls. I'll first present the protocol, then apply it to your three examples.

  ---

  ### **Decision Procedure: Is This Disagreement Substantive or Verbal?**
  **(Copy-pastable version for online discussions)**

  **When to use this:** When a thread is stuck in circles, and you suspect the core disagreement might hinge on language rather than facts/values. Takes ~5-10 min if participants cooperate.

  **Core principle:** A dispute is **verbal** if it persists *only* because parties use the same word differently; it’s **substantive** if disagreement remains after clarifying definitions. Many disputes are **mixed**.

  **Steps:**  
  Ask these questions **in order**. Stop at the first definitive output. Be honest—don’t force an answer if evidence is unclear.

  1. **Identify the crux term(s):**  
     - "What single word or phrase is the disagreement *most* about?" (e.g., "sandwich," "understands," "person").  
     - *If multiple terms, pick the most central one. If unclear, stop—the dispute is too messy for this tool.*  

  2. **Check for factual agreement:**  
     - "Ignoring the crux term, do you agree on **all non-linguistic facts** relevant here?"  
       - *Non-linguistic facts = observable, measurable, or empirically verifiable truths (e.g., "a hot dog has meat in a split bun," "LLMs output coherent text," "fetuses feel pain at 24 weeks").*  
     - ✅ **If YES → Proceed to Step 3.**  
     - ❌ **If NO → Dispute is at least partly substantive.**  
       - *Output: "This is partly substantive. You disagree about facts: [list them]. Resolve those first."*  
       - *Then, rerun this procedure on any* remaining *disagreement once facts are settled.*  

  3. **Define the crux term explicitly:**  
     - Ask each side: "What are the **necessary and sufficient conditions** for applying this term?" (e.g., "A sandwich must have two separate bread pieces" vs. "Any food encased in bread").  
     - *If definitions match → Dispute is **not verbal**.*  
       - *Output: "This is substantive. You agree on facts and definitions but still disagree—dig into why."*  
     - *If definitions conflict → Proceed to Step 4.*  

  4. **Disambiguate and test disagreement:**  
     - Replace the crux term with two new labels (e.g., "Sandwich-A" for Team A’s definition, "Sandwich-B" for Team B’s).  
     - Restate the original claim using these labels (e.g., "Is a hot dog a Sandwich-A?").  
     - **Ask: "Do you still disagree?"**  
       - ✅ **If NO disagreement remains → Dispute is purely verbal.**  
         - *Output: "This is verbal. You’re using '[term]' differently. After disambiguation ([term]-A = [definition A], [term]-B = [definition B]), there’s no disagreement left. Save time—accept that language is flexible!"*  
       - ❌ **If YES, disagreement remains → Proceed to Step 5.**  

  5. **Check for concept-choice disagreement:**  
     - "Do you now disagree about **which concept** ([term]-A or [term]-B) is *better*? If so, why?"  
       - *Listen for: "It’s more useful for [purpose]," "It fits ordinary language better," "It’s more morally relevant," etc.*  
     - ✅ **If NO → Stop.**  
       - *Output: "Mixed dispute. The verbal part dissolved with disambiguation. The remaining disagreement is substantive: [state it]."*  
     - ✅ **If YES → Ask: "Is this choice grounded in non-linguistic concerns?"**  
       - *Examples of substantive grounds:*  
         - Empirical: "[Term]-A better predicts behavior."  
         - Normative: "[Term]-B leads to fairer policies."  
         - Practical: "[Term]-A is more useful in biology."  
       - *Examples of verbal grounds:*  
         - "It’s the dictionary definition."  
         - "My definition is the ‘real’ one."  
     - ❌ **If choice is based on linguistic conventions → Dispute is verbal.**  
       - *Output: "Still verbal. You agree on facts but are arguing about linguistic conventions for [term]. Resolve by noting both definitions exist—then move on."*  
     - ✅ **If choice is based on non-linguistic concerns → Dispute is mixed.**  
       - *Output: "Mixed dispute. The verbal part: you used '[term]' differently (disambiguate to [term]-A and [term]-B). The substantive part: you disagree about which concept matters more for [empirical/normative/practical reason]."*  

  **Biases & Limitations:**  
  - **False positives for "verbal":** Bias toward overcalling disputes verbal (especially if Step 2 misses hidden factual disagreements).  
  - **Judgment calls unavoidable:** At Step 5 (concept choice), humans must decide if grounds are substantive. No protocol can eliminate this.  
  - **Misfires in hard cases:**  
    - When one side denies "fact of the matter" (Step 2): Procedure treats this as a definitional conflict (Step 3).  
    - When disagreement is about conceptual schemes (Step 5): Relies on parties to articulate *why* their scheme is better.  
  - **Not for high-stakes debates:** Use with caution in moral/legal conflicts—dissolving verbal parts may feel dismissive even when accurate.

  ---

  ### **Worked Examples**
  #### **1. Hot dog sandwich debate**  
  - **Step 1:** Crux term = "sandwich."  
  - **Step 2:** Non-linguistic facts agreed? ✅ (Both agree a hot dog = sausage in split bun; a Reuben = meat between two bread slices).  
  - **Step 3:** Definitions conflict? ✅  
    - Team A: "Sandwich requires two *separate* bread pieces."  
    - Team B: "Sandwich requires *any* bread-enclosed food."  
  - **Step 4:** Disambiguate → "Is a hot dog a Sandwich-A?" (Team A: no, Team B: no). "Is it a Sandwich-B?" (Team A: yes, Team B: yes). **Disagreement vanishes.**  
  - **Output:** *"Purely verbal dispute. You’re using ‘sandwich’ differently. After disambiguation (Sandwich-A = two separate bread pieces, Sandwich-B = any bread-enclosed food), you agree a hot dog isn’t Sandwich-A but is Sandwich-B. No substantive disagreement remains—this is about language, not food."*  

  #### **2. AI understanding**  
  - **Step 1:** Crux term = "understands."  
  - **Step 2:** Non-linguistic facts agreed? ✅ (Both agree LLMs pass behavioral tests but lack human-like internal states).  
  - **Step 3:** Definitions conflict? ✅  
    - Team A (functionalist): "Understanding = producing appropriate outputs."  
    - Team B (internalist): "Understanding = having conscious insight/grounded representations."  
  - **Step 4:** Disambiguate → "Does an LLM Understand-A?" (Both: yes). "Does it Understand-B?" (Both: no). **But disagreement persists** → Team A insists "Understand-A is sufficient for ‘understanding’"; Team B insists only "Understand-B counts."  
  - **Step 5:** Concept-choice disagreement? ✅  
    - Team A: "Understand-A is better because it’s measurable and useful for building AI."  
    - Team B: "Understand-B is better because it captures true comprehension, avoiding misuse."  
    - Grounds are **non-linguistic** (practical utility vs. ethical risk).  
  - **Output:** *"Mixed dispute. Verbal part: you define ‘understands’ differently (Understand-A = functional competence, Understand-B = internal insight). Substantive part: you disagree about which concept matters more—Team A prioritizes practical utility in AI design; Team B prioritizes avoiding deceptive/morally risky attributions. Focus there."*  

  #### **3. Fetal personhood**  
  - **Step 1:** Crux term = "person."  
  - **Step 2:** Non-linguistic facts agreed? ✅ (Both agree fetuses are human organisms, develop consciousness ~24 weeks, and are biologically alive).  
  - **Step 3:** Definitions conflict? ✅  
    - Team A (biological): "Person = human organism from conception."  
    - Team B (moral): "Person = entity with advanced cognitive capacities (e.g., consciousness)."  
  - **Step 4:** Disambiguate → "Is a fetus Person-A?" (Both: yes). "Is it Person-B?" (Both: no for early fetuses). **But disagreement persists** → Team A says "Person-A deserves rights"; Team B says "Only Person-B deserves rights."  
  - **Step 5:** Concept-choice disagreement? ✅  
    - Team A: "Person-A is better—it’s scientifically clear and protects vulnerable life."  
    - Team B: "Person-B is better—it focuses on morally relevant traits like suffering."  
    - Grounds are **non-linguistic** (normative: what *makes* something matter morally).  
  - **Output:** *"Mixed dispute. Verbal part: you define ‘person’ differently (Person-A = biological human, Person-B = entity with advanced cognition). Substantive part: you disagree about which properties confer moral status. Team A argues biological humanity is key; Team B argues cognitive capacity is key. That’s the core debate—discuss that directly."*  

  ---

  ### **Key Takeaways for Users**
  - **Why this works:** It forces explicit definitions and separates language from world/moral commitments.  
  - **Hard cases handled:**  
    - Same word, different extensions (e.g., "sandwich"): Exposed in Step 3.  
    - Fact-of-the-matter denials (e.g., "no real definition of ‘person’"): Treated as concept-choice in Step 5.  
    - Conceptual scheme disagreements (e.g., AI "understanding"): Resolved by probing *why* a scheme is better.  
  - **For copy-pasting:** Use the protocol output blocks verbatim in comments. The examples show users how to adapt it.  
  - **When it fails:** If participants won’t define terms or admit factual agreements, the tool stalls—but that’s a sign the debate wasn’t productive anyway.  

  This protocol won’t resolve all disputes, but it converts unproductive clashes into clearer, actionable disagreements. Grounded in philosophy but stripped of jargon, it’s a rationalist’s Swiss Army knife for language tangles.
