answer: |-
  Here is a specification of the desiderata for an adequate Scanlonian contractualist account of aggregation, grounded in the core view you've fixed, along with their status, underlying considerations, tensions, and the key limiting requirement:

  ### Desiderata for Contractualist Aggregation

  1.  **Simple Rescue (Save 5 vs. Save 1):** Any adequate account must justify saving the five over the one stranger when all claims are equally strong and relevantly similar.
      *   **Consideration:** Deeply held intuition that allowing the greater loss (5 deaths) is worse when preventing the lesser loss (1 death) is the alternative. Rejecting this seems to contradict the point of morality to protect individuals from harm.
      *   **Status:** **Non-Negotiable.** A contractualist view that *always* prohibited saving the five over the one would be implausible and self-defeating. Any plausible view *must* accommodate this result.

  2.  **Unequal Trade-Off (Large Harm vs. Many Small Harms):** The account must distinguish cases where aggregating many small harms *can* outweigh a single large harm (e.g., diverting a trolley from killing one onto a track where it breaks many limbs) from cases where it *cannot* (e.g., killing one healthy person to harvest organs saving five others needing one organ each).
      *   **Consideration:** Intuition that while aggregation has limits, it must sometimes work even with disparate harms. The threshold for "too disparate" is contested. Respects the *significance* of severe harm to an individual.
      *   **Status:** **Preference of a Camp.** While *some* constraint is necessary (killing one to save five from mild headaches is clearly wrong), the *exact* threshold or mechanism for when aggregation is permissible is a core point of debate. A contractualist *could* coherently adopt a very stringent view (e.g., only life-for-life aggregation allowed) or a more permissive one (allowing aggregation across disparate harms under certain conditions).

  3.  **Distinction: Intra-Personal vs. Inter-Personal Aggregation:** The account must explain why adding burdens *within* a single life (e.g., enduring many small pains) is unproblematic and justifies imposing a burden to avoid a greater total burden *to that same person*, but adding burdens *across different lives* is not straightforward and faces justificatory constraints.
      *   **Consideration:** Directly stems from the **Separateness of Persons** and the **Individualist Restriction**. What matters for justification are the burdens *to individuals*; there is no "super-person" whose total burden is minimized by distributing harms across separate individuals. The moral significance of distributing harms across distinct loci of experience and justification.
      *   **Status:** **Non-Negotiable.** This distinction is fundamental to the contractualist (and anti-utilitarian) commitment. Blurring it collapses contractualism into consequentialism.

  4.  **Distinction: Ex Ante vs. Ex Post Justification:** The account must clarify the relationship between justifying a risky principle *before* outcomes are known (ex ante: "This gives each person a better chance") and justifying the outcome *after* the risk has materialized (ex post: "This principle led to *me* being severely harmed").
      *   **Consideration:** Addresses the moral relevance of expectations, consent-to-risk, and the complaint of the "actual victim." Ex ante perspectives seem crucial for justifying rules governing risk, but the ex post complaint of the harmed individual seems powerful. How can a principle rejected by someone suffering a terrible outcome be justified *to them*?
      *   **Status:** **Preference of a Camp.** Contractualists differ significantly on the relative weight of ex ante and ex post perspectives. Some prioritize ex ante acceptability (risk-taking justified if prospect is better for each), others emphasize the irreducible force of the ex post complaint ("*I* wasn't saved"), and some seek complex integrations. A coherent contractualist position could lean heavily towards either pole.

  5.  **Role of Complaints & Pairwise Comparison:** The account must specify how individual complaints against a principle are weighed. Does a single individual's stronger claim always defeat any number of weaker claims? If not, what mechanism allows the weaker claims to jointly outweigh the stronger one?
      *   **Consideration:** Core to the **Individualist Restriction**. Grounds for rejection must be reasons *particular individuals* have. The challenge is balancing this with the need for aggregation (Desideratum 1). The "pairwise" method (comparing the burden on each individual under Principle A vs. Principle B) is a natural starting point but faces the aggregation problem head-on.
      *   **Status:** **Non-Negotiable Core, Implementation Debated.** The requirement that justification/rejection is based on *individual* complaints/reasons is non-negotiable. *How* these individual complaints are compared and weighed against each other – whether strictly pairwise (one vs. one), or allowing some form of "grouping" or "balancing" of complaints *without* aggregating welfare – is the central puzzle and where proposals diverge significantly. A contractualist *must* use individual complaints as the currency, but *how* they are counted/compared is contested.

  6.  **Individualist Restriction:** Any principle permitting sacrifice must be justifiable *to the person being sacrificed* (or bearing the burden) by reasons *they themselves* could (or perhaps must) acknowledge, even if reluctantly.
      *   **Consideration:** Heart of Scanlon's formula and the rejection of consequentialism. Principles must be acceptable *to each person* governed by them, from their own perspective and based on their own reasons/status. It rules out justification solely by appeal to "the greater good" or collective sums.
      *   **Status:** **Non-Negotiable.** This is the defining constraint of Scanlonian contractualism itself. Abandoning it abandons the view.

  7.  **Separateness of Persons:** The account must explain why, and respect the fact that, the distribution of harms across distinct individuals creates a justificatory barrier that does not exist for distributing harms within a single life.
      *   **Consideration:** Fundamental anti-utilitarian commitment. Individuals are distinct sources of value, claims, and justification; they are not mere containers for value that can be summed impersonally. Sacrificing one for others requires a special justification *to the one sacrificed* that isn't needed for imposing a burden on one to prevent a greater burden *on themselves*.
      *   **Status:** **Non-Negotiable.** Like (3) and (6), this is bedrock for contractualism. It's the *why* behind the prohibition on straightforward interpersonal summing.

  ### Tensions and Conflicts

  1.  **The Core Conflict: Pairwise Comparison (5) vs. Simple Rescue (1) & Unequal Trade-Off (2):**
      *   **Conflict:** A strict, literal interpretation of "pairwise comparison" – where we only ever compare the burden on one individual under Principle A vs. Principle B – seems unable to justify saving the five over the one. Under Principle P1 (save the one), each of the five has a strong complaint: "P1 leads to my death when P2 (save the five) could have prevented it." Under Principle P2 (save the five), the one has a strong complaint: "P2 leads to my death when P1 could have prevented it." If we can only compare burdens one individual at a time, it seems the single individual's complaint against P2 is just as strong as any single individual's complaint against P1. How can P2 be justified, especially to the one? This also blocks aggregation in the Unequal Trade-Off cases.
      *   **Resolution:** Contractualists universally recognize that *some* modification or interpretation of the "pairwise" idea is necessary to accommodate Desideratum 1. The debate is over *how* to modify it without violating the Individualist Restriction (6) and Separateness of Persons (7). **The demand for strict, literal pairwise comparison (one complaint vs. one complaint) must be rejected or significantly weakened.** Proposals involve redefining the relevant complaints (e.g., complaints about *principles* rather than pairwise outcomes), allowing comparisons of the *magnitude* of burdens across individuals (while still grounding rejection in individual reasons), or introducing structures like "veils of ignorance" or "representative groups" within the justification process.

  2.  **Ex Ante (4) vs. Individualist Restriction (6) in Life-Saving Cases:**
      *   **Conflict:** Justifying a risky principle ex ante (e.g., a medical triage principle that sometimes sacrifices one to save five) by appealing to each person's better *chance* of survival under that principle seems compelling before the event. But ex post, the individual who is sacrificed has a devastating complaint: "This principle *caused* my death for the sake of others, and from my perspective now, my ex ante better chance was worthless." Can the ex ante justification truly justify the principle *to the person who actually dies*?
      *   **Resolution:** This tension is deep and persistent. Contractualists disagree on the resolution. Some argue that the ex ante perspective, if sufficiently robust (e.g., under conditions of equal and optimal risk), *does* provide justification even to the unlucky loser ("It was reasonable for you to accept this principle beforehand, knowing the risk"). Others argue the ex post complaint is primary and irreducible, limiting the scope of permissible risk imposition ("No principle you couldn't reasonably reject *ex post* can be adopted"). Most proposals attempt to integrate both perspectives, but the weighting remains contested. **The demand for a justification that *silences* the ex post complaint of the actual victim is likely impossible to satisfy fully within contractualism.** The resolution involves either accepting that justification to the victim is based on the ex ante acceptability *to them* (even if they now suffer), or acknowledging that the victim *does* have a powerful complaint but that the overall case for the principle is still stronger.

  ### The Most Excluding Requirement

  *   **The Individualist Restriction (6)** does the most to exclude otherwise attractive proposals.
      *   **Why:** Many intuitively appealing ways to handle aggregation (e.g., straightforward interpersonal summing of welfare, minimizing total harm, maximizing expected utility, using Kaldor-Hicks efficiency) are directly ruled out because they justify burdens on individuals by appealing to benefits *to others* or *to the collective*, without necessarily providing a reason *that individual* must accept. This restriction forces contractualists to find highly constrained, often complex, and sometimes counterintuitive ways to achieve even minimal aggregation (like saving five over one), constantly battling the tension between respecting individual veto power (via reasonable rejection) and allowing collective action to prevent greater overall individual harm. It makes solving the Unequal Trade-Off problem particularly difficult and blocks the most direct paths to justifying risk imposition or trade-offs involving disparate harms. Proposals that seem elegant or effective from a consequentialist or even rule-utilitarian perspective often founder precisely on this rock: they fail the test of being justifiable *to each individual* burdened by the principle.

  This framework provides the necessary criteria and highlights the central tension (aggregation vs. the individualist/pairwise foundation) that any Scanlonian proposal on aggregation must grapple with, while identifying which constraints are fixed points of the view and which are areas of legitimate disagreement.
