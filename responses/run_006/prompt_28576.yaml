  someone in my philosophy group keeps saying buddhist ethics is basically just consequentialism with rebirth — that karma is a mechanism that tracks the welfare consequences of actions across lifetimes, the precepts are just rules of thumb for producing good outcomes, and the bodhisattva ideal is straightforwardly about maximising the welfare of all sentient beings. they use this to argue that there's no deep tension between buddhist and utilitarian approaches and that the disagreements are mostly about metaphysics (rebirth) rather than ethics. i'm suspicious but i can't quite articulate why — something about how buddhism treats intention (cetanā) as what really drives karmic weight rather than actual outcomes, and about how the path seems more concerned with transforming the agent's own mind than with a ledger of external consequences. can you audit this analogy properly? give me the mapping — what in buddhism corresponds to what in consequentialism — then go through where the mapping strains or breaks, separating the disanalogies that matter for the 'same ethical project' conclusion from the ones that don't. and if the analogy is bad, is there a better one? write in british english please.
