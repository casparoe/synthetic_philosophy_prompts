prompt: |-
  ok so i'm taking this seminar on religion and liberal democracy and we're about to dive into the public reason debate — rawls, audi, eberle, all that. before i read any of the actual theories i want to know what i should be asking of them. like, what does a theory of public reason actually have to get right to count as adequate?

  the question as i understand it is roughly: when citizens offer justifications for coercive laws, are they allowed (or required) to use religious reasons, or do they have to restrict themselves to reasons that are in principle accessible to all reasonable citizens regardless of their comprehensive doctrines? and a theory of public reason is supposed to tell us what the rule is, why it has that shape, and what it applies to. but the boundaries are fuzzy — does it apply to citizens or only to officials? to all political speech or only to voting? to the reasons you actually have or only the ones you state publicly? does it cover informal deliberation or just formal legislative contexts?

  i want the desiderata laid out before i get invested in any one answer. what are the cases a theory has to handle, the distinctions it can't collapse, the results from neighboring areas it has to respect? and i especially want to know whether any of the requirements pull in opposite directions — like, is there a tension between being genuinely inclusive of religious citizens and actually constraining the kinds of reasons that can justify coercion? if some pair of desiderata can't be jointly satisfied, that's the part i most want flagged.

  format: give me sections in this order:

  - "The core job" (~150 words): what exactly is the problem a theory of public reason is solving? what's the phenomenon, and what counts as a solution vs. a restatement of the problem?
  - "The hard cases" (~300 words): the specific scenarios any adequate theory has to get right — landmark-type cases, edge cases, cases that separate camps. for each case, say why it's a requirement and what it tests.
  - "Non-negotiables" (~200 words): the constraints that any theory in this space has to respect regardless of which camp you're in — things like consistency with liberal democratic legitimacy, or not collapsing into either "anything goes" or "no religious speech ever." explain why each is non-negotiable.
  - "Camp-specific demands" (~200 words): desiderata that only some camps insist on (e.g., that the rule must be stable under full compliance, or that it must be acceptable to reasonable religious citizens from their own perspective, or that it must track an independent notion of public justification). mark which are negotiable and why.
  - "Tensions" (~200 words): pairs of desiderata that might not be jointly satisfiable. this is the part i care about most — if the requirements list itself contains a tension, that's a result in its own right.
  - "Quick scorecard" (~300 words): rawls (political liberalism), audi (secular rationale), eberle (justificatory liberalism), and one more of your choice, scored briefly against the desiderata. i don't need deep exegesis, just where each one trips or shines. a table is fine if its easier.
