  The core problem revolves around legitimacy in pluralistic societies: how can coercion be justified when citizens hold incompatible worldviews? A theory must resolve this without becoming circular or merely descriptive. The hard cases will involve things like religious citizens voting on moral issues - these test whether a theory can maintain both restraint and inclusion.

  Key non-negotiables include respecting liberal democracy's foundational commitment to reasonable pluralism while avoiding two untenable extremes: complete relativistic permissiveness or total exclusion of religious discourse. 

  I notice the camp-specific demands reveal deeper fault lines: Rawls insists on justifications being acceptable from all reasonable perspectives, while Eberle cares more about respecting citizens' actual reasons. This points to the fundamental tension the user anticipated - between accessibility and authenticity. 

  For the scorecard, I'll compare Rawls, Audi, Eberle and add Wolterstorff as an interesting contrast. The table should show how each handles the desiderata, especially where they struggle with the inclusion-restraint dilemma. Rawls' restrictions may exclude devout citizens, while Eberle's permissiveness risks alienating non-believers.

  The user's focus on tensions is perceptive - that's really the heart of the debate. Any adequate theory must navigate between making religious citizens second-class justifiers versus allowing purely sectarian rationales for coercion. I'll emphasize how this manifests in each thinker's approach.
answer: |-
  Here’s a structured breakdown of desiderata for evaluating theories of public reason, tailored to your seminar focus:

  ---

  ### **1. The Core Job** (~150 words)  
  A theory of public reason must solve the **legitimacy problem**: How can coercive laws (e.g., bans, mandates, taxes) be justified to free and equal citizens who hold irreconcilable religious/secular worldviews? The phenomenon is *moral disagreement under pluralism*. A solution must:  
  - **Define a shared justificatory standard** for laws that avoids alienating citizens.  
  - Explain *why* this standard is binding in liberal democracies.  
  - Specify *how* citizens/officials should reason when advocating for laws.  
  A mere restatement would be: "Use reasons everyone accepts" (circular) or "Avoid religious reasons" (arbitrary). An adequate theory must ground the standard in democratic ideals (e.g., reciprocity, equality) and clarify its scope.

  ---

  ### **2. The Hard Cases** (~300 words)  
  Any theory must handle these test cases:  
  - **Religious Citizen Voting**: A Muslim voter supports banning alcohol solely because it’s *haram*. *Tests*: Does restraint apply to citizens, or only officials? Must voters self-censor?  
  - **Religious Official in Secular Context**: A Catholic legislator cites natural law (rooted in theology) to oppose abortion. *Tests*: Can "translated" reasons count? Does the *source* matter if the reason *sounds* secular?  
  - **Lifeboat Secularism**: Banning ritual animal slaughter *only* because secular citizens find it offensive. *Tests*: Can public reason exclude minority practices if secular "disgust" dominates?  
  - **Overlapping Consensus**: A law against slavery justified identically by Quakers (theology) and Kantians (autonomy). *Tests*: Must reasons be *freestanding*, or can they "converge" from diverse foundations?  
  - **Emergency Exemption**: Using biblical authority to pass disaster relief. *Tests*: Can public reason be suspended for urgent needs?  

  *Why required*: These probe boundary issues (scope, sincerity, translation) and reveal whether a theory protects minorities or collapses into majoritarianism.

  ---

  ### **3. Non-Negotiables** (~200 words)  
  All theories must respect:  
  - **Liberal Legitimacy**: Coercion must be justifiable to *reasonable* persons (not necessarily all actual persons). *Why*: Legitimacy requires reciprocal respect, not universal assent.  
  - **Anti-Establishment**: No privileging of *specific* religious doctrines. *Why*: Liberal neutrality forbids state endorsement of religion.  
  - **Avoiding Tyranny of the Secular**: Secular reasons ≠ "neutral." *Why*: Secularism can be its own comprehensive doctrine.  
  - **Non-Relativism**: "Anything goes" (e.g., "God commands it" suffices) is invalid. *Why*: Undermines reciprocity and enables theocracy.  
  - **Feasibility**: Rules must be action-guiding for real citizens. *Why*: Over-demandingness renders theory irrelevant.  

  These ensure the theory remains *distinctively liberal* and avoids fatal incoherence.

  ---

  ### **4. Camp-Specific Demands** (~200 words)  
  *Negotiable* desiderata reflecting ideological splits:  
  - **Accessibility Requirement** (Rawlsian): Reasons must be *in principle* comprehensible to all reasonable people. *Negotiable*: Eberle rejects this as unfairly biased against religion.  
  - **Sincerity Constraint** (Audi): Citizens must *hold* secular reasons, not just offer them. *Negotiable*: Rawls allows religious reasons privately if public justification exists.  
  - **Acceptability-from-Their-Standpoint** (Eberle): Justifications must respect religious citizens’ integrity. *Negotiable*: Strict secularists see this as privileging faith.  
  - **Independent Standard** (Gaus): Public justification requires reasons others *could* reasonably accept. *Negotiable*: Convergence theorists (e.g., Quinn) reject independent criteria.  

  *Why negotiable*: These reflect deeper commitments (e.g., epistemic humility vs. integrity) that define camps.

  ---

  ### **5. Tensions** (~200 words)  
  Key irresolvable tensions:  
  - **Inclusion vs. Restraint**:  
    - *Inclusion* demands religious citizens not be marginalized.  
    - *Restraint* demands laws not rely on inaccessible reasons.  
    **Tension**: Full inclusion may require accepting sectarian reasons; strict restraint risks excluding devout voices.  
  - **Sincerity vs. Stability**:  
    - *Sincerity* requires citizens believe the reasons they offer.  
    - *Stability* requires shared justifications across worldviews.  
    **Tension**: Demanding sincerity may fracture consensus; demanding shared reasons may force insincerity.  
  - **Pluralism vs. Coherence**:  
    - *Pluralism* requires accommodating diverse epistemologies.  
    - *Coherence* requires a unified justificatory standard.  
    **Tension**: Relaxing standards for pluralism risks incoherence; strict coherence risks dogmatism.  

  *Why critical*: These tensions force trade-offs. No theory satisfies all desiderata equally.

  ---

  ### **6. Quick Scorecard**  
  | **Desideratum**               | **Rawls**                     | **Audi**                      | **Eberle**                     | **Wolterstorff**             |  
  |-------------------------------|-------------------------------|-------------------------------|--------------------------------|------------------------------|  
  | **Legitimacy**                | ✅ Grounded in reciprocity    | ✅ Secular rationale as duty  | ✅ Respect for persons         | ❌ Rejects restraint itself   |  
  | **Anti-Establishment**        | ✅ Avoids religious reasons   | ✅ Strict secularism          | ✅ Neutral framework           | ❌ Allows religious coercion  |  
  | **Feasibility**               | ⚠️ Burdensome self-censorship | ⚠️ Demands private sincerity | ✅ Flexible integrity          | ✅ No restraint needed        |  
  | **Inclusion of Religious**    | ❌ "Burdens of judgment"      | ❌ Secular reasons required   | ✅ Full participation          | ✅ Religious reasons primary  |  
  | **Handles Lifeboat Secularism**| ❌ May permit majority veto   | ❌ Secular disgust may count  | ✅ Protects minority practices | ✅ Rejects secular privilege  |  
  | **Sincerity vs. Stability**   | ⚖️ Prioritizes stability     | ⚖️ Prioritizes sincerity     | ⚖️ Leans toward sincerity     | ❌ Rejects tension (no restraint) |  

  **Key**:  
  - **Rawls**: Strong on legitimacy/restraint, weak on inclusion. Struggles with devout citizens.  
  - **Audi**: Stricter secularism than Rawls; sincerity demands may exclude pious voters.  
  - **Eberle**: Balances inclusion/restraint best but risks sectarian laws in practice.  
  - **Wolterstorff** (Reformed epistemology): Rejects public reason; prioritizes religious integrity over restraint. Fails anti-establishment.  

  **Tension Highlight**: Rawls/Audi sacrifice inclusion for restraint; Eberle/Wolterstorff sacrifice restraint for inclusion.

  ---

  This framework reveals the field’s central dilemma: **Can liberal democracy demand *less* than secular reasons from religious citizens without undermining the very reciprocity that grounds its legitimacy?** Each theory answers differently—your seminar’s debates will likely orbit this fault line.
