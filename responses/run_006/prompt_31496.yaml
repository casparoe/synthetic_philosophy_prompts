  First, let's recall the classical Stoic distinction: Epictetus taught that our judgments, desires, and choices are "up to us" (eph' hēmin), while external things like health, wealth, and reputation are not. This is central to my analysis.

  For dimension (a) - "how you respond" - I'll consider five interpretations: occurrent judgments, emotions, settled dispositions, outward actions, and attention direction. Each interacts differently with control.

  For dimension (b) - "can't" - I'll examine three possibilities: psychological impossibility, causal impossibility, or pragmatic undesirability. This affects whether control is literally impossible or merely unwise.

  For dimension (c) - descriptive vs normative - this determines whether the slogan states a fact or gives advice. Classical Stoicism is primarily normative.

  I'll create a systematic analysis of each combination. For example:
