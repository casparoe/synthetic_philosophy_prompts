  ### Game Design: "Nuclear Brinkmanship Challenge"

  This game creates a visceral experience of Schelling's concepts through two sequential phases: **Commitment Poker** (credibility paradox) and **Escalation Ladder** (brinkmanship). Students play in pairs (8 pairs total).

  ---

  #### **Phase 1: Commitment Poker** (15 minutes)  
  *Credibility Paradox: The power to bind oneself*

  **Setup:**  
  - Each pair designates Player A (Deterrer) and Player B (Challenger).  
  - Give each player 3 index cards. Player A writes **"RETALIATE"** on all 3 cards. Player B writes **"ATTACK"** on one card and **"BACK DOWN"** on two cards.  

  **Rules:**  
  1. **Round 1 (No Commitment):**  
     - Player B secretly chooses *one* card to play (ATTACK or BACK DOWN).  
     - Player A *simultaneously* chooses a RETALIATE card.  
     - **Payoffs (reveal cards):**  
       - B backs down: **A=0, B=0**  
       - B attacks + A retaliates: **A=-10, B=-10** (mutual destruction)  
       - B attacks + A *does nothing*: **A=-5, B=+5** (A capitulates)  
     *(Note: A has no "do nothing" card yet—forcing a retaliation choice.)*  

  2. **Round 2 (Commitment):**  
     - Player A **burns 1 RETALIATE card** (tears it up visibly). Now A only has 2 cards left.  
     - Player B chooses a card (ATTACK/BACK DOWN) *knowing A has fewer retaliation options*.  
     - Repeat payoff resolution.  

  3. **Round 3 (Brinkmanship):**  
     - Player A burns a **second card** (only 1 left).  
     - Player B chooses a card.  
     - Resolve payoffs.  

  **Scoring:** Players track cumulative points.  

  ---

  #### **Phase 2: Escalation Ladder** (25 minutes)  
  *Brinkmanship: Shared risk of catastrophe*  

  **Setup:**  
  - Pairs reuse index cards. Label 4 cards per pair: **Level 1, Level 2, Level 3, CATASTROPHE**.  
  - Players alternate turns starting with Challenger (Player B).  

  **Rules:**  
  1. **Gameplay:**  
     - Starting at Level 1, the current player chooses:  
       - **ESCALATE:** Move to next level (e.g., Level 1 → Level 2).  
       - **BACK DOWN:** End game. Backing player **loses 3**, other **gains 3**.  
     - After *each* escalation, flip a coin:  
       - **Heads:** Continue to next player's turn.  
       - **Tails:** Draw a **CATASTROPHE card** → **both players lose 15**. Game over.  
     - **Risk increases:** At each level, add a coin flip *but only act on tails*:  
       - Level 2: Flip 1 coin  
       - Level 3: Flip 2 coins (catastrophe if *either* is tails)  
       - Level 4: Flip 3 coins (catastrophe if *any* tails)  

  2. **Cap:** Game ends at Level 4 or when catastrophe occurs.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Students don’t escalate in Phase 2 (aversion to risk).  
     **Solution:** Award **+1 point per escalation level reached** (even if they back down later). This incentivizes testing limits.  

  2. **Problem:** Phase 1 "card burning" feels artificial.  
     **Solution:** Preface with: *"Burning cards = deploying missiles on high alert. You lose physical control."*  

  3. **Problem:** Randomness dominates Phase 2.  
     **Solution:** In debrief, contrast pairs who escalated aggressively vs. cautiously. Highlight that *deliberate risk-taking* shifts outcomes.  

  4. **Problem:** Time runs out.  
     **Solution:** Use a visible timer. After 20 minutes, call: *"Final escalation round!"*  

  ---

  ### **Debrief Structure** (30 minutes)  
  **Link Game → Schelling Concepts:**  
  1. **Credibility Problem (Phase 1):**  
     - *Ask:* "When Player A burned cards, did B attack less? Why?"  
     → Map to Schelling: "Burning options = **commitment**. It makes retaliation credible even if irrational."  

  2. **Rationality of Irrationality (Phase 1):**  
     - *Chart:* Show average Player A scores: Round 1 (no commit) vs. Round 3 (commit).  
     → *Key insight:* "Sacrificing flexibility forces opponents to back down."  

  3. **Threat That Leaves Something to Chance (Phase 2):**  
     - *Ask:* "Did you escalate hoping *luck* would force the other to fold?"  
     → Map to brinkmanship: "Risk isn’t bluffing—it’s *real loss of control* that compels negotiation."  

  4. **Deterrence vs. Compellence:**  
     - *Contrast:* Phase 1 (deterrence: preventing attack) vs. Phase 2 (compellence: forcing backing down).  

  **Backward Induction Spotlight:**  
  - Draw a choice tree for Phase 1:  
    - "If B attacks in Round 3, A *must* retaliate (only 1 card left). So B never attacks. Thus, A wins by committing."  
  - *Schelling quote:* "The power to constrain an adversary depends on the power to bind oneself."  

  ---

  ### **Materials**  
  - **Per pair:** 7 index cards, pen, coin.  
  - **Classwide:** Timer, whiteboard for debrief charts.  

  ### **Time Allocation**  
  - Settling/transitions: 10 min  
  - Game: 50 min (Commitment Poker: 15 min; Escalation Ladder: 25 min; buffer: 10 min)  
  - Debrief: 30 min  

  By role-playing states with no "do nothing" safety net, students viscerally grasp why nuclear strategy hinges on credible irrationality. The game forces them to *feel* the logic before labeling it.
