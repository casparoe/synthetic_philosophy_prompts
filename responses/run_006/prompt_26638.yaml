                  First, Player A decides whether to commit to going Straight. 
                  - If Player A commits: 
                      - Player A pays a commitment cost of 0.2 (so they will have 0.2 deducted from whatever they get).
                      - Player A is now bound to go Straight.
                      - Then Player B chooses: 
                            If B chooses Swerve: A gets 1 - 0.2 = 0.8, B gets -1.
                            If B chooses Straight: A gets -10 - 0.2 = -10.2, B gets -10.
                  - If Player A does not commit:
                      - Then both play simultaneously as in Round 1.

              Round 3 (Player B can commit):
                  Same as Round 2, but now Player B has the option to commit to going Straight (with cost 0.2). 
                  Then Player A moves if B commits, or they play simultaneously if not.

              Remember: You are trying to maximize your own score.

      Now, let's hope that in the commitment rounds, the player who is faced with a commitment will yield.

      We are ready.

      Summary of the plan:

          Time 0-5: Introduction and split into 8 pairs. Assign each pair a table. Hand out instructions for both games? Or explain verbally.

          Time 5-20: Commitment Game (three rounds). 
              - We will call out the rounds and tell them when to move to the next round.
              - They record their payoffs on a score sheet.

          Time 20-40: Brinkmanship Game. 
              - Explain the rules (handout with the level table and rules). 
              - Assign each pair a random number generator (if using phones, they can use a free app or we can use a website like random.org). 
              - They play one game.

          Time 40-50: Wrap up and prepare for debrief: collect data? Or have them note their outcomes.

          Time 50-80: Debrief.

      We can collect the outcomes of the commitment game and the brinkmanship game to show patterns.

