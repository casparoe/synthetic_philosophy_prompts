prompt: |-
  I keep noticing this pattern in committee votes and I dont have a name for it. Take a three-person committee deciding whether to hire someone, where the rule is that you hire only if the candidate is both qualified and a good fit. Each committee member has a perfectly consistent set of views: whoever says yes to both sub-questions also says yes to hire, and whoever says no to hire also says no to at least one sub-question. But when the votes are tallied question by question, you can get two members saying qualified, two saying good fit, and two saying no to hire. So the committee's collective answers can't all be true together, even though each member's answers can. I've seen the same structure with three sub-questions and with yes/no votes on factual premises that are then supposed to settle a policy question.

  I know this is somewhere near Condorcet's paradox, where majority preferences cycle, and maybe near Simpson's paradox, where a pattern reverses when you split the data. But it doesn't feel like either: there's no cycle among three options, and there's no statistical data. The weird thing is specifically that the group endorses each part but rejects the whole that follows from the parts. What's also odd is that it doesn't go away if the committee discusses things first, and it can happen with a two-thirds threshold, not just a simple majority. And the outcome sometimes flips depending on whether we vote on the sub-questions first or the main question first, even though nobody changes their mind.

  Is there an established name for this exact thing, and is it a real problem for majority rule or just an arithemetic quirk of how votes get added up? If there's no name, what would you call it, and how would you define it so I can tell it apart from Condorcet's paradox, Simpson's paradox, and plain cases where a committee has mixed reasons? Dont just give me a label — I want to know what's essential to the phenomenon and where its edges are. Also, whatever verdict you give on whether it's a serious problem, tell me what would change your mind: which consideration would make you flip from 'real problem' to 'harmless artifact,' or the other way.
reasoning: |-
  Okay, the user is describing a specific voting paradox they've observed in committee decisions. They mention a three-person committee voting on whether to hire a candidate based on two criteria: qualification and fit. Each member votes consistently—if they say yes to both, they vote yes to hire; if they vote no to hire, they say no to at least one criterion. But when votes are tallied, it's possible to have majority support for each criterion (say, 2-1 for qualified, 2-1 for fit) while also having majority rejection of the hire (2-1 against). 

  Hmm, this feels familiar—it's clearly related to logical aggregation problems. The user correctly notes it's adjacent to Condorcet and Simpson's paradoxes but distinct. What makes this unique is the disconnect between endorsing premises but rejecting the conclusion. 

  The user seems frustrated by not having a name for this. They're clearly analytically minded—they've identified precise conditions (consistency at individual level, inconsistency at group level) and want to distinguish it from similar phenomena. Their deeper need might be about legitimacy: they're troubled that discussion doesn't resolve this, and thresholds don't prevent it. They might be wrestling with whether this undermines democratic decision-making. 

  Ah! The doctrinal paradox fits perfectly here. It's exactly when a group must vote on premises (qualified? fit?) and a conclusion (hire?), and the majority on premises conflicts with the majority on conclusion. The essential structure is:  
  - Binary decision derived from binary premises  
  - Premises voted separately  
  - Individuals are logically consistent  
  - Group is inconsistent  

  The edges:  
  - Only happens with ≥3 voters (with 2, majority = unanimous)  
  - Requires the conclusion to be a logical function (AND/OR) of premises  
  - Persists even with supermajorities (if premises pass by 66% but conclusion fails by 66%)  

  Is this a serious problem? Well, it exposes how majority rule can violate basic logic—the group says "A and B are true" but "A&B is false." That's troubling for truth-tracking. But if we assume voters are expressing preferences, not judgments about facts, maybe it's harmless? The user's mind might change if shown that alternative voting methods (premise-based vs. conclusion-based) yield equally defensible outcomes depending on context.  

  ...Wait, the user also mentions this happens with three sub-questions. That might be a generalized doctrinal paradox where the conclusion is a more complex logical function (e.g., majority of three premises). The core remains the same: aggregation breaks logical links.  

  I should emphasize why this isn't Condorcet: no cyclic preferences, just premise-conclusion disconnect. Not Simpson's: no lurking variables or aggregation bias. And the voting order flip is critical—it shows procedural arbitrariness.  

  For the verdict: It's a real problem if we want collective rationality. But if we view voting as compromise, not truth-seeking, it's less alarming. The clincher? If members shared identical standards (e.g., same definition of "qualified"), the paradox might dissolve—but they rarely do.
answer: |-
  This phenomenon has a precise name: it's the **Doctrinal Paradox** (sometimes called the **Discursive Dilemma**). It was formally characterized in the 1970s-1990s by legal scholars and philosophers (like Lewis Kornhauser and Lawrence Sager) and later by economists and social choice theorists. It's distinct from Condorcet and Simpson's paradoxes, though related to the broader issue of "logical aggregation problems."

  ### Core Definition & Essential Features
  The Doctrinal Paradox occurs when:
  1.  **A collective decision depends logically on multiple premises** (e.g., "Qualified?" AND "Good Fit?" → "Hire?").
  2.  **Individuals vote consistently:** Each member holds a logically consistent set of beliefs (e.g., if they vote YES on both premises, they vote YES on the conclusion; if they vote NO on the conclusion, they vote NO on at least one premise).
  3.  **Premise-by-premise majority voting endorses all premises** (e.g., majority says YES on "Qualified?", majority says YES on "Good Fit?").
  4.  **Conclusion-by-conclusion majority voting rejects the conclusion** (e.g., majority says NO on "Hire?").
  5.  **The collective outcome is logically inconsistent:** The group's aggregated votes imply that the premises are true *and* the conclusion is false, violating the logical connection (e.g., Qualified AND Good Fit is TRUE, but Hire is FALSE).

  ### Key Differences from Similar Paradoxes
  *   **vs. Condorcet's Paradox:**
      *   **Condorcet:** Concerns *cyclic preferences* over *alternatives* (A>B, B>C, C>A). It's about intransitive *rankings*.
      *   **Doctrinal:** Concerns *logical inconsistency* between *premises* and a *conclusion*. It's about violating *truth-functional logic* (e.g., AND) in aggregation.
  *   **vs. Simpson's Paradox:**
      *   **Simpson's:** Concerns *statistical associations* reversing when data is aggregated vs. disaggregated (lurking variables). It relies on *probabilistic/correlational data*.
      *   **Doctrinal:** Concerns *deterministic logical relationships* (premises → conclusion) failing under *voting aggregation*. No statistics are involved; it's pure logic and voting rules.
  *   **vs. "Mixed Reasons":**
      *   Mixed reasons simply mean different voters have different justifications. The Doctrinal Paradox *creates* a specific *type* of problematic mixed-reason outcome: the group collectively affirms the necessary conditions for the conclusion but denies the conclusion itself.

  ### Boundaries & Edges
  1.  **Essential Structure:** Requires (a) a conclusion logically dependent on premises (usually conjunctive "AND" or disjunctive "OR"), (b) separate votes on premises and conclusion, (c) consistent individual judgments, (d) majority rule on each question.
  2.  **Minimum Size:** Requires at least 3 voters. With 2 voters, majority = unanimity, avoiding inconsistency.
  3.  **Logical Connectives:** Most common and problematic with **conjunction (AND)**. It *can* occur with disjunction (OR) or more complex rules (e.g., "Hire if 2 out of 3 sub-criteria are met"), but the AND case is the starkest contradiction.
  4.  **Thresholds:** **Persists with supermajorities.** If the hire requires 2/3 approval on the conclusion, but each premise only requires simple majority (or even 2/3), the paradox can still occur with slightly different vote distributions (e.g., 3 voters: Premise1: 2Y-1N; Premise2: 2Y-1N; Conclusion: 1Y-2N).
  5.  **Discussion Doesn't Solve:** As you observed, discussion won't resolve it *if* voters genuinely hold different but internally consistent views on the *premises*. It reveals a fundamental aggregation problem, not just ignorance.
  6.  **Procedural Dependence:** The outcome flips depending on whether you vote on:
      *   **Premise-Based Procedure:** Vote on premises first, let the conclusion follow logically (Hire = Qualified AND Good Fit). Result: Hire (if premises pass).
      *   **Conclusion-Based Procedure:** Vote directly on the conclusion. Result: No Hire (if majority rejects).
      *   The paradox highlights that these two legitimate procedures yield contradictory results *without any voter changing their mind*.

  ### Is it a Real Problem or Just a Quirk?
  **It's a potentially serious problem for deliberative decision-making based on reasons.**

  *   **Why it's a Problem:**
      *   **Violates Collective Rationality:** The group outcome is logically incoherent (Premises True + Conclusion False). This undermines the claim that majority rule reliably tracks truth or reason in complex decisions.
      *   **Procedural Arbitrariness:** The final decision hinges entirely on *which question is put to a vote first* (premises vs. conclusion), not the substance of the views. This creates manipulability.
      *   **Undermines Legitimacy:** If the committee publicly affirms "Candidate is Qualified" and "Candidate is a Good Fit" but then rejects the hire, the decision appears irrational or illegitimate, even if procedurally correct.
      *   **Pervasive:** It applies to any rule-based decision: legal judgments (facts → verdict), policy (goals/feasibility → policy), safety approvals (tests A, B, C passed → approval).

  *   **Arguments for "Harmless Artifact":**
      *   **Focus on Conclusion:** If the *only* thing that matters is the final decision (Hire/No Hire), the paradox is irrelevant; use conclusion-based voting and accept the majority's bottom-line preference.
      *   **Reasons as Preferences:** If premises are just expressions of preference intensity or justification, not truth-apt judgments, logical consistency isn't required at the group level. The group is just aggregating preferences on the final choice.
      *   **Alternative Aggregation:** Use methods avoiding the paradox: Unanimity (impractical), "Reason-based" voting (assign weights), or delegate to an individual/algorithm after discussion.

  ### What Would Change My Mind?
  *   **From "Problem" to "Artifact":** Convince me that in the specific context (e.g., pure preference aggregation), the individual "premise" votes are *only* rhetorical justifications with no independent truth-value or logical force. If the *only* binding decision is the conclusion, and premise votes are non-binding consultations, the paradox loses its bite.
  *   **From "Artifact" to "Problem":** Show me a concrete, high-stakes example (e.g., a jury finding all elements of a crime true "beyond reasonable doubt" by majority, yet acquitting the defendant by majority) where the inconsistency demonstrably led to injustice, loss of public trust, or a substantively worse outcome, *and* where conclusion-based voting was procedurally mandated. This highlights the real-world consequences of violating collective rationality.

  **In essence:** The Doctrinal Paradox exposes a fundamental tension between individual rationality, majority rule, and logical consistency in collective decision-making about interconnected propositions. It's not just a math trick; it reveals a vulnerability in how groups reason together when truth or logical coherence matters. While procedural workarounds exist, they don't eliminate the underlying challenge to the ideal of collectively rational majority decisions.
