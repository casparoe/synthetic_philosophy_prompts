  The user also asks if there's a way to move forward. Since it's a values clash, direct arguments might not work. But maybe shifting focus could help. Instead of debating the hypocrisy, redirect to the original issue. For instance, separate the criticism from the critic. Acknowledge any past mistakes but emphasize addressing the current problem. Or agree to discuss the critic's behavior separately. The key is to avoid getting stuck in the loop by changing the conversation structure.

