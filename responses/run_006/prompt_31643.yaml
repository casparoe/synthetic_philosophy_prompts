answer: |-
  ## The Gambler's Counsel, by Geometric Grace

  Behold, a wager! On this toss or throw,  
  Where win's true weight doth *p* reveal, and *q*  
  The loss's cost, while *b* the bounty shows.  
  If edge be found where *p* times *b* exceeds *q*,

  Arithmetic commands: "Stake all thy store!  
  For expectation climbs in linear grace;  
  Each coin thou ventureth shall yield thee more  
  In mean of wealth for this impending race."

  But time unveils a multiplicative stream,  
  Where ruin's fraction shrinks what fortune brings.  
  *Log* wealth adds up, fulfilling growth's long dream;  
  The *geometric* mean now spreads its wings!  
  Though edge gleams bright, too bold a stake betrays—  
  A certain gain can perish in the days.

  So bet the edge by offered odds confined:  
  **f* = (gain's hope - loss's fear) / b defined**.  
  Not single throw, but long horizon's space  
  Demands this fraction for compounded grace.

  ---

  ### Notes for the Discerning Gambler

  *   **Precision:** "Win's true weight" = *p*, "loss's cost" = *q*, "bounty" = *b*, "edge" = *pb - q > 0*. "Linear grace" captures the arithmetic mean's additive growth per bet. "Multiplicative stream" and "Log wealth adds up" directly reference the key insight for repeated bets. "Ruin's fraction" and "too bold a stake betrays" explicitly warn against overbetting (staking > f*), leading to loss despite positive EV.
  *   **Volta:** The sharp turn at "But time unveils..." shifts from the single-bet (arithmetic) view to the long-run (geometric/log) view.
  *   **The Formula:** The couplet states the Kelly fraction **f* = (pb - q)/b** clearly as "edge divided by the odds" ("gain's hope - loss's fear" = *pb - q*, "/ b defined").
  *   **The Distinction:** The closing lines hammer home the core message: Kelly (f*) is about maximizing long-run compounded growth ("long horizon's space," "compounded grace"), not maximizing expected wealth on the next single bet ("Not single throw").
  *   **Accessibility:** Even without knowing the math, the poem contrasts the tempting logic of "bet it all for the next big win" with the wiser counsel of "bet carefully to grow steadily over time," warning that greed can destroy even a good opportunity. The language aims for Shakespearean resonance ("store," "ventureth," "bounty," "perish," "confined," "compounded grace").
