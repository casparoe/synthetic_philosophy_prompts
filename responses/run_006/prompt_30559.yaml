  **Core Mechanic Chosen:** Basic one-shot anonymous pairing.  
  **Rejected Candidates:**  
  - **Cheap-talk variant:** Rejected because pre-play communication introduces coordination dynamics that overshadow the core tension between backward induction and reciprocal trust. It shifts focus to signaling rather than pure strategic choice.  
  - **Repeated-play variant:** Rejected because repeated interactions allow for trust-building and punishment strategies, fundamentally altering the game from a finite to an iterative structure. This muddies the backward induction paradox, which assumes a one-shot, terminal endpoint.  
  **Substitute Variants:**  
  1. **Baseline:** One-shot, anonymous, fixed 6-node game.  
  2. **Public Outcome History:** After all pairs play, aggregate results are displayed (e.g., "70% took by node 2"). Isolates *social influence* (how knowledge of peers’ choices affects beliefs).  
  3. **Random Role Assignment:** Players learn their role (Player 1 or 2) only after pairing. Isolates *role-dependent beliefs* (how moving first/last shapes trust).  

  ---

  ### **Activity Setup**  
  **Materials List:**  
  1. **Role Cards:** 9 labeled "Player 1" (moves at nodes 1, 3, 5), 9 labeled "Player 2" (moves at nodes 2, 4, 6).  
  2. **Payoff Tables** (1 per pair; scale ensures temptation):  
     ```
     Node 1: Player 1 → Take: (4, 1) | Pass: Go to Node 2  
     Node 2: Player 2 → Take: (2, 8) | Pass: Go to Node 3  
     Node 3: Player 1 → Take: (6, 4) | Pass: Go to Node 4  
     Node 4: Player 2 → Take: (5, 10) | Pass: Go to Node 5  
     Node 5: Player 1 → Take: (8, 6) | Pass: Go to Node 6  
     Node 6: Player 2 → Take: (7, 12) | Pass: (6, 11)   [B takes at 6: 12 > 11]
     ```  
  3. **Record Sheets:** For pairs to log moves (e.g., "Node 1: Pass; Node 2: Take → Payoffs (2,8)").  
  4. **Public Board:** For posting aggregate results.  

  **Payoff Scaling Rationale:**  
  - Taking early (e.g., node 1) gives Player 1 a "safe" 4 points vs. risking 2 if passed.  
  - Passing to end (node 6) yields (7,12), tempting both but requiring mutual trust.  

  ---

  ### **Timeline (75 Minutes)**  
  **0–5 min: Introduction**  
  - Distribute materials, emphasize anonymity: "Do not reveal your identity. You are paired randomly."  
  - Explain rules: "You will make sequential moves. Record choices on your sheet. Maximize your points."  
  - **Critical:** Do *not* define backward induction or paradox.  

  **5–15 min: Baseline Variant**  
  - Randomly pair Players 1 and 2. Pairs play one-shot 6-node game.  
  - **Facilitator:** Circulate to clarify payoffs.  

  **15–20 min: Collect and Post Baseline Results**  
  - Pairs submit outcomes (e.g., "Ended at node 2, payoffs (2,8)"). Post summary on board: % taking at each node.  

  **20–30 min: Public Outcome History Variant**  
  - Same pairs replay with aggregate results visible. "Notice how others played."  

  **30–35 min: Collect and Post Results**  
  - Update public board with new aggregate.  

  **35–45 min: Random Role Assignment Variant**  
  - Re-pair students. Roles assigned *after* pairing (draw cards face-down).  

  **45–50 min: Collect and Post Results**  
  - Final update of aggregates.  

  **50–75 min: Structured Debrief**  
  ---  

  ### **Variants Analysis**  
  | Variant              | Backward Induction (BI) Prediction | Predicted Actual Behavior | Divergence Insight |  
  |----------------------|-----------------------------------|---------------------------|-------------------|  
  | **Baseline**         | Player 1 takes at node 1 → (4,1) | Many pass early (hoping for trust). 30–50% reach node 4+. | Shows BI assumes *common knowledge of rationality* (CKR); players doubt peers’ rationality. |  
  | **Public History**   | Same as baseline.                 | More early takes if initial results show low cooperation. If many passed, more risk-taking. | Reveals how *public information* shifts beliefs about others’ rationality, breaking CKR. |  
  | **Random Roles**     | Same as baseline.                 | Player 1 takes more if they *expected* to move last (role uncertainty reduces trust). | Highlights *role-dependent beliefs*: BI assumes roles are known, but beliefs alter if roles are ambiguous. |  

  **Note:** Cheap-talk was replaced as it obscures the paradox; random roles sharpen the role of beliefs.  

  ---

  ### **Debrief Script**  
  **Start with Observations (50–55 min):**  
  > "In the baseline, [X%] passed at node 1. But after seeing others’ results, [Y%] passed. Why did passing feel tempting despite the logic saying ‘take immediately’?"  

  **Map to Concepts (55–65 min):**  
  1. **Backward Induction (BI) as Computation:**  
     - *Script:* "Start from node 6: Player 2 takes (12 > 11). Now at node 5, Player 1 knows this, so they take (8 > 7 if they pass). Work backward: at node 1, taking gives 4 > 2 if they pass and Player 2 takes. BI is this *algorithm*."  
     - *Link to Play:* "Many of you passed at node 1—you *suspended* this computation. Why?"  

  2. **Subgame-Perfect Equilibrium (SPE):**  
     - *Script:* "BI finds SPE: a plan where *every* decision is optimal, even if never reached. Passing at node 1 isn’t SPE because it relies on Player 2 *not* taking at node 2—but BI shows Player 2 *would* take."  
     - *Link to Play:* "When you passed, what did you believe about Player 2’s next move?"  

  3. **Common Knowledge vs. Belief:**  
     - *Script:* "BI assumes CKR: everyone knows everyone is rational, infinitely. But in class, did you *know* your partner was rational? Or did you *believe* they might pass to help you?"  
     - *Link to Play:* "When you passed, you assumed your partner wasn’t ‘BI-rational’—maybe they’re kind or naive."  

  4. **Off-Path Beliefs:**  
     - *Script:* "BI breaks if Player 1 passes. Player 2 might think, ‘Player 1 passed, so they’re irrational—I can pass too!’ But BI assumes players ignore ‘impossible’ moves."  
     - *Link to Play:* "If your partner passed, did you think, ‘They’re irrational, I’ll exploit this’?"  

  5. **Normative vs. Predictive:**  
     - *Script:* "BI is *normative*: rational players *should* follow it. But *predictively*, humans don’t. We saw this gap: BI says ‘take,’ but many passed."  
     - *Link to Play:* "Did you feel torn between ‘I should take’ and ‘But if we both pass, we’ll do better’? That’s the paradox."  

  **Synthesize (65–75 min):**  
  > "The tension is between BI’s ‘iron logic’ and our hope for cooperation. BI works only if CKR holds. But in reality, we *believe* others might reciprocate—and sometimes they do!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Students coordinating/splitting points:**  
     - *Fix:* Emphasize anonymity: "Do not discuss strategy. Points are individual." Award bonus points for top scorers to incentivize self-interest.  

  2. **Student explains paradox mid-game:**  
     - *Fix:* Warn initially: "Keep insights private until debrief." If it happens, pause and remind: "Save analysis for later—focus on your choices." Re-pair contaminated groups.  

  3. **Pairs finish in 2 minutes:**  
     - *Fix:* If >50% end by node 2, run a "surprise" round: "Play again with new partners, but node 6 payoffs are now (9,14)." Scales temptation.  

  4. **Joke/generosity choices:**  
     - *Fix:* Frame competitively: "Top 3 scorers get bonus points." Use anonymous pairing to reduce friend bias.  

  5. **Payoff confusion:**  
     - *Fix:* Show a demo round: "At node 1, if Player 1 takes, payoffs are (4,1). If they pass, Player 2 decides at node 2." Clarify with arrows on payoff tables.  

  ---

  ### **Honest Limitations**  
  **Common Knowledge of Rationality (CKR) is unrealizable:**  
  - In a classroom, anonymity is imperfect—students know peers are philosophy majors likely overthink. This undermines CKR, as players suspect others might *not* be "BI-rational."  
  - **Facilitator must supply:** After the activity, explicitly state: "BI requires CKR and perfect anonymity. Our exercise had neither—so your choices reflect *beliefs* about others, not textbook rationality."  

  **One-Shot Structure Frays:**  
  - Repeated variants (e.g., role reversal) create shadow effects: players remember past partners. True one-shot anonymity is impossible in a closed room.  
  - **Facilitator must supply:** "In a lab with strangers, BI predictions fail too—but less than here. The paradox persists because CKR is an idealization."  

  ---

  ### **Exit Questions (Index Cards)**  
  1. "Backward induction says Player 1 *should* take at node 1. When you decided to pass (if you did), what did you *assume* about your partner’s next move?"  
     - *Reveals:* Beliefs about partner’s rationality (off-path).  

  2. "Is backward induction a prediction about how people *will* act, or a prescription about how rational players *should* act? Explain in one sentence."  
     - *Reveals:* Normative vs. predictive distinction.  

  3. "Imagine you are at node 3 as Player 1. What does backward induction say you *should* do? What would make you disobey it?"  
     - *Reveals:* BI as computation vs. temptation to deviate.  

  ---  
  **Design Goal Met:** Students experience the paradox viscerally. Debrief roots abstract concepts (SPE, CKR) in their choices, avoiding history lessons. Exit questions test nuanced understanding.
