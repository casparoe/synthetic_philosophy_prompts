                  P(data|Y) = C(3,1) * (1/3)*(2/3)^2 = 3 * (1/3)*(4/9) = 4/9.

                  P(X|data) = (2/9 * 1/2) / (2/9 * 1/2 + 4/9 * 1/2) = (1/9) / (3/9) = 1/3.

                  So they all update to 1/3.

              So they still agree.

          Therefore, we need to break the common prior to see disagreement.

     Given the complexity, I suggest we do:

          Part 1: Common prior and common knowledge of posteriors in pairs -> they agree.

          Part 2: They are in pairs again, but this time, one of them is given additional private information that the other doesn't know about. For example, we give one student in the pair a second signal. 

          But then the prior is still common, but the information sets are different. And they don't have common knowledge of each other's information? 

          How about:

              In part 2, we have the same urn setup. But now, after the first signal, we allow one student in the pair to buy (or be given) a second signal. We tell the class that they might have the opportunity to get more signals, but it's private.

          For example:

              We choose one student in each pair to be "rich": they get to draw a second ball from the urn (again, privately). 

              Then they update with two signals. The other student only has one signal.

              Then they announce their posteriors.

              Will they agree? 

              Let's say the true urn is X.

              Rich student draws: first red, second blue. 
                  Posterior for rich student: 
                      With two signals: one red and one blue.
                      P(X | red and blue) = 1/2 (as before).

              Poor student draws: red.
                  Posterior: 2/3.

              They announce:
                  Rich: 1/2
                  Poor: 2/3

              Now, how do they update? 

                  Poor student: 
                    Hears rich has 1/2. In poor's model, 1/2 is not a posterior that you get from one signal. The only way to get 1/2 is if the rich student saw one red and one blue? Because poor knows that rich might have two signals? 

                    We have to tell the poor student that the rich student might have up to two signals? And poor knows the mechanism? 

                    We tell the class: "Some of you may have received one signal, and some two signals. You don't know how many signals the other has."

                  Then poor student doesn't know what to infer from rich's posterior of 1/2. It could be that rich saw one red and one blue, or it could be that rich saw two signals that are both ... wait, but 1/2 only occurs for mixed signals. If rich saw two reds, then rich would have 4/5 (if common prior and updating honestly) and if two blues, 1/5.

                  So if the poor student hears 1/2, they know rich must have seen one red and one blue. Then the poor student, who has one red, now knows: there was also a blue. So poor can update to 1/2.

                  Rich student hears poor has 2/3. That means poor has only one signal and it was red. Then rich, who already knows one red and one blue, is at 1/2. They don't update because they already know both signals.

                  So they both become 1/2.

              If the rich student had two reds:

                  Rich: 4/5 = 0.8.
                  Poor: 2/3 ≈0.666.

                  Poor hears 0.8. In poor's model, they know that rich might have two signals. They know that if rich had two reds, then rich would have 4/5. If rich had two blues, 1/5. If mixed, 1/2.

                  So when poor hears 0.8, they infer that rich must have seen two reds. Then poor updates: I have one red and I know rich has two reds. So total three reds? But wait, they are from the same urn? And are they independent? Yes.

                  Then poor updates to: 
                      P(X | three reds) = [ P(three reds|X) * P(X) ] / [ ... ]
                      P(three reds|X) = (2/3)^3 = 8/27.
                      P(three reds|Y) = (1/3)^3 = 1/27.
                      P(X|three reds) = (8/27 * 1/2) / (8/27 * 1/2 + 1/27 * 1/2) = (8/54) / (9/54) = 8/9.

                  Meanwhile, rich (who has two reds) hears poor has 2/3, which means poor has one red. So rich now knows: three reds in total? But rich only knows about two of them. They update to the same 8/9? 

                  Let's compute for rich with two reds and knowing that there's a third red somewhere (but not necessarily from the same urn? no, they are all from the same urn). 

                  They now know three independent draws: all red.

                  So rich updates to 8/9.

                  So they both become 8/9.

              So they still agree.

     Given the time, I think we should do the common prior part and then for the second round, we explicitly break the common prior by giving one group a different prior (and tell them to keep it secret) and hope that in the update they can still do the calculation. We will have to accept that the non-common prior group will have to out themselves when they announce a posterior that doesn't match the common prior group's expectations.

     We can do:

          Round 1: Common prior for everyone.
          Round 2: We hand out sealed envelopes to half the students (Group B) that contain a note: "You have reason to believe that the prior probability of Urn X is 0.9. Please use this prior in your calculations. Do not tell anyone about this note." The other half (Group A) gets a note: "Please use the prior of 0.5 as before."

     Then they receive signals and calculate.

     Then in pairs (one from A and one from B), they announce their posteriors.

     Then they try to update. We instruct them: "Now that you have heard your partner's posterior, update your own belief about the urn. You should use your own model (including your own prior and likelihood) and try to infer what signal your partner must have seen, and then update accordingly."

     Example pair:

          Group A student (true prior 0.5) sees red: posterior = 2/3 ≈0.666.
          Group B student (prior 0.9) sees blue: posterior = ( (1/3)*0.9 ) / ( (1/3)*0.9 + (2/3)*0.1 ) = (0.3) / (0.3+0.0667) = 0.3/0.3667 ≈0.818.

          Wait, blue in group B: should be around 0.818? But let's recalculate for blue in group B:

              P(X|blue) = [ P(blue|X) * P(X) ] / [ P(blue|X)*P(X) + P(blue|Y)*P(Y) ]
                         = [ (1/3)*0.9 ] / [ (1/3)*0.9 + (2/3)*0.1 ]
                         = (0.3) / (0.3 + 0.0667) = 0.3/0.3667 ≈ 0.818.

          But in group A's model, a blue signal yields 1/3≈0.333.

          So they announce:

              A: 0.666
              B: 0.818

          Then A updates: 
              A thinks: B's posterior of 0.818 doesn't match any posterior in my model (0.666 or 0.333). So what should A do? We haven't provided a method.

          We can instruct them: "If the partner's posterior does not match any of the posteriors you would have gotten from a single signal, then you cannot infer the partner's signal. In that case, you should not update beyond your current information."

          So A stays at 0.666.

          B updates: 
              B hears A's posterior is 0.666. In B's model, what signal yields 0.666? 
                  In B's model, if A had seen red: 
                      P(X|red) = [ (2/3)*0.5 ] / [ (2/3)*0.5 + (1/3)*0.5 ] = (1/3) / (1/2) = 2/3 ≈0.666.
                  If blue: 1/3≈0.333.

                  So B infers that A saw red.

              Then B updates: I have blue and I know A saw red.

              In B's model, the probability of the data (red and blue) given X is: (2/3)*(1/3)=2/9.
              Given Y: (1/3)*(2/3)=2/9.
              So P(X | red and blue) = (2/9 * 0.9) / (2/9 * 0.9 + 2/9 * 0.1) = (0.2) / (0.2 + 0.0222) = 0.2/0.2222 ≈0.9.

              So B updates to 0.9.

          Now they have:
              A: 0.666
              B: 0.9

          And they continue to disagree.

     This is what we wanted.

     Summary of the activity:

          We will have two rounds.

          Round 1 (common prior):
              - Explain the setup: two urns, coin flip, then each student draws one ball.
              - Each student calculates their posterior.
              - Pair up and announce posteriors.
              - Then update based on the announcement.
              - They should find that they agree after the update.

          Round 2 (broken prior for half the class):
              - Give half the students (Group B) a sealed envelope with a note: "Use a prior of P(X)=0.9. Keep this secret." 
              - The other half (Group A) get a note: "Use a prior of P(X)=0.5."
              - Each student receives a signal (ball color) as before.
              - They calculate their posterior using their assigned prior.
              - Pair up (ensuring one from A and one from B).
              - Announce posteriors.
              - Update: each student tries to infer the other's signal using their own model, then updates their belief to account for both signals.
              - If the announced posterior does not match any of the possible posteriors in their model for one signal, they do not update.

          We then see if they end up agreeing or not.

     Payoff scheme without real money:

          We can use a quiz at the end. After the activity, we reveal the true urn. Then we ask each student to submit their final probability that it was urn X. We then (after class) compute the Brier score for each student. 

          The Brier score for a probability p and outcome I(X) [1 if X, 0 if Y]:

              score = (p - I(X))^2 

          And we can announce the top scorers in the next class. Or we can have a leaderboard for the day.

          But note: in round 2, they will have different information. And we reveal the urn at the end.

     Materials:

          - Coin.
          - Dice (6-sided) for drawing signals.
          - Envelopes for the prior assignment in round 2.
          - Paper and pen for students to calculate.

     Sequence:

          Total time: 80 minutes.

          Introduction (10 minutes):
              - Explain the setup with the two urns.
              - Explain the prior and the likelihoods.
              - Explain the process: we will do two rounds. In each round, there will be a coin flip to choose the urn (which they won't see), then each student will receive a private signal (color), then they will calculate their posterior probability that the urn is X.

          Round 1 (25 minutes):
              - Step 1: Flip the coin (in private) to choose the urn.
              - Step 2: For each student, roll a die to determine their signal:
                      If urn X: 1-4 -> red, 5-6 -> blue.
                      If urn Y: 1-2 -> red, 3-6 -> blue.
                    Write the color on a slip and hand it to the student.
              - Step 3: Give students 5 minutes to calculate their posterior.
              - Step 4: Pair up the students (randomly). 
              - Step 5: In each pair, they announce their posterior to each other.
              - Step 6: They update their belief to account for the partner's announcement (by inferring the partner's signal and then updating with both signals).
              - Step 7: They should notice they now have the same belief.

          Round 2 (30 minutes):
              - Step 1: Hand out the envelopes. Group A: prior=0.5, Group B: prior=0.9. Tell them not to share the content.
              - Step 2: Flip the coin again (in private) for a new urn.
              - Step 3: Draw signals as before.
              - Step 4: They calculate their posterior using their assigned prior.
              - Step 5: Pair up: one from A and one from B.
              - Step 6: Announce posteriors.
              - Step 7: Update: try to infer the partner's signal from their posterior (using your own model), then update your belief to account for both signals. If the partner's posterior doesn't match any of your model's posteriors for one signal, then you cannot infer and you don't update.
              - Step 8: They will likely end up with different beliefs.

          Debrief (15 minutes):

              We reveal the true urn.

              We then discuss:

                  Round 1:
                      - We started with a common prior and each had private signals.
                      - When they announced their posteriors, because they shared a common prior, they could infer each other's signals and then update to the same posterior.

                  Round 2:
                      - They had different priors, so when they announced, they couldn't necessarily infer the other's signal correctly.
                      - Hence, they might not update to the same posterior.

              We then introduce the common prior assumption and the theorem.

              We also note the limitations:

                  - In the real world, it's hard to know if we have a common prior.
                  - The activity assumes that the signals are independent and identically distributed given the state.
                  - We only considered two states and two signals, but the theorem is more general.
                  - In round 2, we broke the common prior by giving different priors, but there are other ways to break it (e.g., different likelihoods).

              And we note that in round 2, the update might have been messy because the models were different, and we had to handle non-matching posteriors by not updating. In reality, if they knew they had different priors, they might try to reconcile by sharing their models, but that's not what the theorem assumes.

     What might go wrong:

          - Round 2: Students might not keep their prior assignment secret.
          - Calculation errors: Some students might not be comfortable with Bayes' theorem. Provide a formula sheet? Or do a quick review at the beginning.
          - Time: The signal drawing might take longer than expected. We can pre-draw the signals if we know the urn outcome? But then we have to know the outcome in advance. Alternatively, use a computer to generate and print out the signals for each round.
          - In round 2, when they cannot match the posterior, they might not know what to do. We provided a rule, but it might feel artificial.
          - In the update in round 1, some students might not realize they can infer the signal from the posterior. We can hint: "Given your partner's posterior, what signal must they have seen?"

     Despite the challenges, this activity should make the point clear.

     Let's write the instructions for the facilitator.

     Facilitator script:

          Introduction (10 minutes):
              "Today we're going to do an activity that explores how people update their beliefs when they get new information and when they learn about others' beliefs. We have two urns: Urn X and Urn Y. Urn X has 2 red balls and 1 blue ball. Urn Y has 1 red ball and 2 blue balls. A fair coin will be flipped to choose which urn we are using. If heads, we use Urn X; if tails, Urn Y. The urn is fixed for the round, and we will draw balls from it."

              "Each of you will receive a private signal: the color of a ball drawn from the chosen urn. The draws are independent and with replacement (so the urn composition doesn't change)."

              "Your task is to compute the probability that the urn is X given your signal. You will then work in pairs and announce your probability to your partner. After that, you will update your probability based on what you heard."

          Round 1 (25 minutes):

              Step 1: Flip a coin in private (so students don't see). Note the outcome (say, heads for X, tails for Y).

              Step 2: For each student, determine their signal:
                  - If the urn is X: roll a 6-sided die. If 1-4, give red; 5-6, blue.
                  - If the urn is Y: roll a 6-sided die. If 1-2, give red; 3-6, blue.
                  - Write the color on a small piece of paper and hand it to the student.

              Step 3: Give students 5 minutes to calculate their posterior. Write on the board:

                    Prior: P(X) = 1/2, P(Y)=1/2.

                    P(X | red) = [P(red|X) * P(X)] / [P(red|X)*P(X) + P(red|Y)*P(Y)]
                               = [ (2/3)*(1/2) ] / [ (2/3)*(1/2) + (1/3)*(1/2) ] = (1/3) / (1/2) = 2/3.

                    P(X | blue) = [ (1/3)*(1/2) ] / [ (1/3)*(1/2) + (2/3)*(1/2) ] = (1/6) / (1/2) = 1/3.

              Step 4: Pair up the students.

              Step 5: In each pair, have them announce their posterior to each other.

              Step 6: Instruct: "Now that you know your partner's posterior, update your belief. In your model, you can infer what signal your partner must have seen. Then you now know two signals: yours and your partner's. Recompute the probability of X given both signals."

              Write on board the three cases (optional):

                    Both red: P(X|two reds) = ( (2/3)^2 * (1/2) ) / ( (2/3)^2*(1/2) + (1/3)^2*(1/2) ) = (4/9) / (5/9) = 4/5.
                    Both blue: P(X|two blues) = ( (1/3)^2 * (1/2) ) / ( (1/3)^2*(1/2) + (2/3)^2*(1/2) ) = (1/9) / (5/9) = 1/5.
                    One red, one blue: P(X) = ( (2/3)*(1/3)*(1/2) ) / ... = (2/9) / (4/9) = 1/2.   [But note: wait, we did this before and got 1/2]

              Step 7: Have them notice that both now have the same belief.

          Round 2 (30 minutes):

              Step 1: Hand out sealed envelopes to half the students (randomly assigned to Group B) and the other half (Group A). 
                      Group A's note: "For this round, use a prior of P(X)=0.5."
                      Group B's note: "For this round, use a prior of P(X)=0.9. Do not tell anyone about this note."

              Step 2: Flip the coin again for a new urn.

              Step 3: Draw signals as in Round 1.

              Step 4: Give students time to calculate their posteriors. Write on board the formulas for Group A (same as before) and for Group B:

                    For Group B:
                        P(X | red) = [ (2/3)*0.9 ] / [ (2/3)*0.9 + (1/3)*0.1 ] = (0.6) / (0.6+0.0333) = 0.6/0.6333 ≈ 0.947.
                        P(X | blue) = [ (1/3)*0.9 ] / [ (1/3)*0.9 + (2/3)*0.1 ] = (0.3) / (0.3+0.0667) = 0.3/0.3667 ≈ 0.818.

              But wait, we might not want to write Group B's formulas on the board because it will reveal the different prior? So instead, we can just let them calculate on their own, and we can hand them a formula sheet with their own prior.

              Step 5: Pair up: try to pair one from A and one from B.

              Step 6: Announce posterions to each other.

              Step 7: Instruct: "Now update your belief. Use your own model (which includes your prior) to try to infer what signal your partner must have seen. If in your model, the posterior your partner announced is not equal to what you would get for any single signal, then you cannot infer their signal and you do not update. Otherwise, update your belief by taking into account both your signal and the partner's signal (which you inferred)."

              Step 8: After they update, ask them to write down their final probability.

          Debrief (15 minutes):

              - Reveal the true urn for each round.
              - Discuss Round 1: They started with different signals and hence different posteriors, but after sharing, they agreed. Why? Because they shared a common prior and could infer each other's signal. Then they had the same information.
              - Discuss Round 2: They had different priors, so when they heard the other's posterior, they might not have been able to infer the signal (if it didn't match), or they might have inferred the wrong signal. Hence, they might not have ended up with the same information and hence might still disagree.
              - Introduce the common prior assumption and the theorem: if rational agents share a common prior and their posteriors are common knowledge, then they cannot agree to disagree (their posteriors must be equal).
              - Limitations: 
                    + We only did one round of updating. In reality, they might talk more and share more.
                    + We assumed the signals were independent and from the same urn.
                    + We broke the common prior explicitly, but in real life, it's hard to know if you share a common prior.
              - Mention the Brier scores will be computed and announced next time.

     This should fit in 80 minutes if managed well.
