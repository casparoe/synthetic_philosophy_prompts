  ### Classroom Activity: Exploring the Common Prior Assumption

  **Objective:** To illustrate that rational agents with a common prior cannot "agree to disagree" when they have common knowledge of each other's posterior probabilities, and to contrast this with cases where the common prior assumption is violated.

  **Setup & Materials:**
  - **Two urns:**
    - Urn A: 2 red balls, 1 blue ball.
    - Urn B: 1 red ball, 2 blue balls.
  - **Coin** for flipping.
  - **6-sided die** (or random number generator) for drawing signals.
  - **Envelopes** with prior assignments (for Round 2).
  - **Paper/pens** for students to calculate probabilities.
  - **Whiteboard** to record group posteriors.
  - **Timer** for rounds.

  **Key Concepts Embedded:**
  - **Common prior:** Shared initial belief about probabilities.
  - **Private information:** Individual signals (ball colors).
  - **Common knowledge of posteriors:** Public announcement of probabilities.
  - **Reconciliation:** Updating beliefs after hearing others' probabilities.

  **Activity Structure (80 minutes total):**

  ---

  #### **Introduction (10 min)**
  1. **Explain the setup:**  
     - A coin flip selects an urn (Heads → Urn A; Tails → Urn B).  
     - Students draw a virtual ball from the urn:  
       - Roll a die:  
         - If Urn A: 1-4 = red, 5-6 = blue.  
         - If Urn B: 1-2 = red, 3-6 = blue.  
     - Students calculate their posterior probability: "Given my ball color, what’s the probability the urn is A?"  
  2. **Review Bayes’ Theorem** (briefly):  
     - Prior: \( P(\text{Urn A}) = P(\text{Urn B}) = 0.5 \).  
     - Likelihoods:  
       - \( P(\text{red} \mid \text{A}) = 2/3 \), \( P(\text{blue} \mid \text{A}) = 1/3 \).  
       - \( P(\text{red} \mid \text{B}) = 1/3 \), \( P(\text{blue} \mid \text{B}) = 2/3 \).  
     - Posteriors:  
       - Red ball: \( P(\text{A} \mid \text{red}) = \frac{(2/3)(0.5)}{(2/3)(0.5) + (1/3)(0.5)} = 2/3 \).  
       - Blue ball: \( P(\text{A} \mid \text{blue}) = \frac{(1/3)(0.5)}{(1/3)(0.5) + (2/3)(0.5)} = 1/3 \).  

  ---

  #### **Round 1: Common Prior (25 min)**
  **Goal:** Students share a common prior; discover that public sharing of posteriors forces agreement.  
  1. **Flip coin** (private, facilitator only), e.g., Heads (Urn A).  
  2. **Draw signals:** For each student, roll die and hand them a slip: "red" or "blue".  
  3. **Calculate posteriors (3 min):**  
     - Students compute \( P(\text{Urn A} \mid \text{their color}) \) (2/3 for red, 1/3 for blue).  
  4. **Public announcement (5 min):**  
     - Students write posteriors on whiteboard (e.g., "Student 1: 0.67", "Student 2: 0.33").  
     - **Facilitator:** Ensure all see all posteriors → common knowledge.  
  5. **Reconcile in pairs (7 min):**  
     - Instruct: "Discuss with a partner and agree on a *single* posterior probability for Urn A."  
  6. **Group update (5 min):**  
     - Pairs report final probabilities. All should converge (e.g., mixed signals → 0.5; both red → 0.8; both blue → 0.2).  

  **Expected Outcome:** All pairs agree. Students realize sharing posteriors (and inferring signals) forces consensus.  

  ---

  #### **Round 2: Broken Prior (30 min)**
  **Goal:** Violate common prior; show disagreement can persist.  
  1. **Assign secret priors:**  
     - Half the class (Group 1) gets: "Use prior \( P(\text{Urn A}) = 0.5 \)".  
     - Half (Group 2) gets: "Use prior \( P(\text{Urn A}) = 0.9 \)" (sealed envelope).  
  2. **Flip coin**, e.g., Tails (Urn B).  
  3. **Draw signals** (same as Round 1).  
  4. **Calculate posteriors (5 min):**  
     - Group 1: Same as Round 1 (red: 2/3 ≈ 0.67, blue: 1/3 ≈ 0.33).  
     - Group 2 (new prior):  
       - \( P(\text{A} \mid \text{red}) = \frac{(2/3)(0.9)}{(2/3)(0.9) + (1/3)(0.1)} \approx 0.95 \).  
       - \( P(\text{A} \mid \text{blue}) = \frac{(1/3)(0.9)}{(1/3)(0.9) + (2/3)(0.1)} \approx 0.82 \).  
  5. **Announce posteriors (5 min):**  
     - Record on board (Group 2’s posteriors ~0.82/0.95 won’t match Group 1’s 0.33/0.67).  
  6. **Reconcile in mixed pairs (10 min):**  
     - Instruct: "Agree on a single probability. Infer your partner’s signal from their posterior *using your own prior*."  
  7. **Report results (5 min):**  
     - Pairs fail to agree (e.g., Group 1 student with blue (0.33) and Group 2 with blue (0.82) → Group 1 infers partner saw red (since 0.82 ≠ 0.33), updates incorrectly to 0.5; Group 2 infers partner saw blue, updates to 0.9).  

  **Expected Outcome:** Disagreement persists. Students see conflicting priors prevent reconciliation.  

  ---

  #### **Debrief (15 min)**
  1. **Map activity to theory:**  
     - **Round 1:** Common prior + common knowledge of posteriors → agreement. Matches theorem: Shared prior + common knowledge of posteriors ⇒ posteriors equal.  
     - **Round 2:** Broken prior → disagreement. Violates theorem assumption; agents can’t infer signals correctly.  
  2. **Core insights:**  
     - Common prior anchors rational updates; disagreements vanish when posteriors are public.  
     - Without common prior, agents "talk past each other" (signals misinterpreted).  
  3. **Limitations of activity:**  
     - **Finite updating rounds:** Real agents might iteratively share more, but the theorem assumes common knowledge in one step.  
     - **Independence of signals:** Activity assumes signals are i.i.d. given the state; real-world evidence may be correlated.  
     - **Common knowledge:** In practice, true common knowledge is rare (students might doubt peers’ rationality).  
  4. **Payoff scheme (no money):**  
     - **Brier scores:** After revealing urn, students submit final probabilities. Score = \( (p - \text{actual})^2 \) (lower = better). Top 3 scorers win "epistemic bragging rights".  

  ---

  #### **Predictable Challenges & Fixes**
  - **Problem:** Bayes’ calculation errors.  
    **Fix:** Provide step-by-step formula; circulate to assist. Pre-calculate examples.  
  - **Problem:** Round 2 pairs stuck in deadlock.  
    **Fix:** Clarify: "If your partner’s posterior doesn’t match your model (e.g., 0.82 not 0.33/0.67), infer *nothing* and don’t update."  
  - **Problem:** Students reveal secret priors.  
    **Fix:** Emphasize secrecy; use envelopes. If leaked, discuss how it breaks the model.  
  - **Problem:** Time crunch.  
    **Fix:** Use random number generators for signals; pre-calc posteriors for slow students.  

  ---

  **Why This Works:**  
  - **Experiential learning:** Students *feel* frustration of irreconcilable disagreement when priors differ.  
  - **Discovery-based:** They derive the theorem’s intuition before it’s named.  
  - **Debrief links concrete to abstract:** Connects rounds to formal epistemology.  
  - **No real money:** Brier scores incentivize honest reporting without payouts.  

  This activity transforms Aumann’s agreement theorem from an abstraction into a memorable, tactile lesson.
