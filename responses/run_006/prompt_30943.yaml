prompt: |-
  In my school's ethics club, we were discussing whether it can ever be rational to change your mind on a moral question simply because someone you trust tells you to. Our teacher argued that the reluctance people feel here is inconsistent: we routinely form and revise beliefs on the testimony of doctors, mechanics, and historians, and no one regards that as a failure of intellectual autonomy. So, the teacher concluded, deferring to someone on a moral matter — accepting their word that some action is wrong, for instance — is no more problematic than deferring to a doctor about a diagnosis, and anyone who refuses to take moral testimony is just being squeamish. The analogy felt suspicious to me, but I couldn't say exactly where it goes wrong.

  I'd like you to audit the analogy between factual testimony and moral testimony. Give me a correspondence table: what plays the role of the testifier, the recipient's background competence, the kind of information transferred, the role of trust, and what the recipient is expected to be able to do afterward. Then identify the points where the mapping breaks, separating the disanalogies that matter for the teacher's conclusion — that moral deference is rationally and morally unproblematic — from the ones that don't. Finally, tell me whether that conclusion survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time, and what a better analogy would be if there is one.
