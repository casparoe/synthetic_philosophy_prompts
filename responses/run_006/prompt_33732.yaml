prompt: |-
  Okay here's what I want. I've been reading about the problem of dirty hands in politics — you know, the idea that political leaders sometimes have to do morally awful things for the good of their people, and that even when they do the right thing there's still something genuinely wrong about what they did, and they should feel the weight of it. Some people think this is a real, deep moral phenomenon; others think it's confused and that the whole idea of "justified wrongdoing" doesn't make sense.

  I want you to draft the joint statement of an adversarial collaboration between two people:

  - **Dirty-hands theorist**: believes that political life can generate genuine cases where a leader must choose to do something morally wrong (not just "unfortunate" or "prima facie wrong") for the sake of their responsibilities, and that the moral remainder — the guilt, the stain — is appropriate and not just a psychological quirk. The wrongness isn't cancelled by the justification; it persists.

  - **Clean-hands theorist**: believes that either the action is justified all-things-considered (in which case it wasn't wrong, and guilt is misplaced), or it was wrong (in which case the leader shouldn't have done it). The idea of an action being both justified and genuinely wrong is a conceptual confusion — maybe it conflates the tragic with the immoral, or it smuggles in a deontological remainder that doesn't survive scrutiny.

  They've been arguing past each other for awhile and have now sat down to do a good-faith adversarial collaboration. I want you to draft the document they'd produce.

  The document should have:

  1. A numbered list of claims both can sign. These shouldn't be vacuous — push them to agree on as much substance as possible. For instance, they might agree on descriptions of paradigm cases (like the ticking-bomb scenario or the politician who orders a military strike knowing some civilians will die), on what needs explaining, on what the disagreement is *not* about, etc.

  2. A disagreements table. Each row: a precise statement of a point of disagreement, phrased so that each side would accept the wording of its own position. Then the crux — the sub-question that, if settled, would move at least one of them. Then, where possible, a test, case, or argument both agree bears on that crux, with each side's prediction about it recorded in advance.

  If you think the whole setup is wrong — like the two positions collapse into each other once you're careful enough, or the debate is really about something else entirely — say so instead of pretending. I'd rather get that diagnosis than a forced document.

  And if you find yourself hedging, notice that: I want the strongest version of each position, not a strawman. Make the dirty-hands theorist as sophisticated as you can, and the clean-hands theorist as sophisticated as you can. If there's a version of the clean-hands view that can accommodate everything the dirty-hands theorist cares about without the metaphysics of justified wrongdoing, that's the version they should be defending.
