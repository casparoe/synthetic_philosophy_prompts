  - The driver and twin at the second exit cannot distinguish: they could be the original (if not replaced) or the twin (if replaced). They use the same strategy (probability \(q\) of continuing).
  - **Ex ante expected utility for original driver if they continue at first:**  
    \[
    EU_{\text{cont}} = 0.5 \cdot [\underbrace{(1 - q) \cdot 4 + q \cdot 1}_{\text{not replaced}}] + 0.5 \cdot [\underbrace{1}_{\text{replaced}}] = 0.5 \cdot (4 - 3q) + 0.5 = 2.5 - 1.5q.
