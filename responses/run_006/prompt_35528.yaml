    - At second exit, whichever agent is present exits with probability 1.  
  - **Why this works:** The decision at the second exit is "exit" (q=0), which is action-stage rational regardless of identity: exiting gives 4 > 1 from continuing. The twin's presence doesn't change incentives. EU=2.5 > 4/3 ≈1.33 from classic case.

