  This principle draws from the idea that in decision problems with imperfect recall, we cannot condition on information that the strategy itself would have made available or lost. Instead, we fix a strategy and compute expected utilities by averaging over the possible paths that the strategy might take, using the probabilities induced by the strategy and any objective chances.

