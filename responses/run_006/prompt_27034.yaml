  ### Thought Experiment: The Kitchen Bottle Move

  **Base Scenario:**  
  Alice is in her kitchen and wants to store an empty glass bottle. She picks it up from the countertop, walks three steps to a nearby drawer, places the bottle inside, and closes the drawer. The relevant consequences are straightforward: the bottle is now securely in the drawer, and it remains intact. The kitchen contains several background objects: a magnetic shopping list stuck to the refrigerator, an open window above the sink, and a potted basil plant on the windowsill. These are genuinely irrelevant—the magnet doesn't interact with glass, the open window doesn't create drafts strong enough to affect objects on the counter, and the plant is rooted in soil, posing no risk to the bottle's movement.

  **Agreement in the Base Scenario:**  
  Both systems correctly predict that the bottle will end up intact in the drawer. The frame-based system relies on pre-compiled irrelevance markers (e.g., "stationary decorative objects like plants and magnets do not affect object movement," and "open windows do not influence indoor item handling"). These markers are not revisited, so the system ignores the irrelevant objects. The on-demand system, tasked with ensuring the bottle reaches the drawer intact, reasons backward from this goal. It scans for threats (e.g., obstacles, collisions, or instability) but finds no plausible connection between the background objects and the action. Both conclude the move succeeds.

  **Modification:**  
  A single change is made: a small, smooth river stone (intended as a decorative paperweight) is placed on the edge of the countertop, 2 meters away from the bottle and the drawer. The stone is causally inert—it is stable, non-magnetic, too heavy to be displaced by air currents, and nowhere near Alice’s path. It does not interact with the bottle, the drawer, or Alice’s actions.

  **Divergence in the Modified Scenario:**  

  - **Frame-Based System’s Reasoning:**  
    The system retrieves its pre-compiled irrelevance markers, including one that states: "small, stable, non-interacting objects on surfaces are irrelevant to object-movement actions." The river stone matches this category (small, inert, and distant from the action). The marker is not revisited, as nothing explicitly triggers a reassessment (e.g., no rule links stones to bottle movement). Thus, the stone is ignored, and the system predicts the bottle is successfully stored intact—correctly reflecting reality.

  - **On-Demand System’s Reasoning:**  
    The system starts from the goal: "bottle is intact in the drawer." It must now recheck for threats in the modified environment. Scanning the kitchen, it identifies the stone as a new object. Reasoning backward, it considers:  
    1. Glass bottles can shatter if dropped.  
    2. Dropping could occur if Alice is distracted or trips.  
    3. Distractions could arise from novel objects in peripheral vision.  
    4. The stone is novel (not present before) and on the countertop.  
    5. Alice might glance at the stone during the move, causing her to fumble the bottle.  
    This chain leads to a prediction that the bottle might be dropped and broken, introducing uncertainty about a successful outcome.  
    
    Crucially, the system *cannot* dismiss this chain as irrelevant during its check. It lacks pre-compiled irrelevance, so it must treat the stone as a potential threat source—despite knowing the stone is stable and distant. The structure of on-demand checking forces it to reconsider previously settled factors (like human distraction) because a new object "opens the door" to re-evaluating even tenuous connections.

  **Outcome and Error Analysis:**  
  In reality, Alice ignores the stone (it is far outside her focus) and moves the bottle safely. The frame-based system is correct. The on-demand system errs by predicting possible failure. The error stems from on-demand relevance checking’s inherent structure: it must exhaustively re-examine the environment for *any* object that *could* initiate a threat chain, no matter how improbable. Here, the stone’s inertness is irrelevant—the system still reopens settled relevance judgments (e.g., "can peripheral objects cause distraction?") because it has no mechanism to preemptively "close" such queries. This leads to a spurious link (stone → distraction → breakage) that would not occur in a frame-based approach with fixed irrelevance markers.

