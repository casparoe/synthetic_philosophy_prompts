  Below is a decision tree designed to sort readers into philosophical positions on conscious experience, using concrete cases and empirical findings rather than "-ism" labels. The tree starts with the Cartesian theater question and branches via diagnostic scenarios (color phi, binocular rivalry, change blindness, Libet). Each path ends in a named position with a brief description and its "awkward commitment" (a key challenge it faces). The tree has seven leaves and no more than four branch nodes on any path.

  ---

  ### **Decision Tree: The Nature of Conscious Experience**

  #### **Root Question**  
  Acknowledge you have conscious experiences (e.g., seeing red, feeling pain). Then:  
  **Q1: Do you think there’s a specific place in the brain, or a precise moment in time, where all your sensory inputs and thoughts come together into a single, unified "show" of conscious experience?**  
  - **Yes** → Proceed to Q2 (Path A: Theater-like views).  
  - **No** → Proceed to Q3 (Path B: Non-theater views).  

  ---

  #### **Path A: Yes to "Theater" (Q1 → Yes)**  
  **Q2: In binocular rivalry (e.g., red vertical lines to one eye, blue horizontal lines to the other), your perception flips between the two images. When one image is suppressed, what happens to it?**  
  - **(A) It’s fully processed in the brain (e.g., you could react to it unconsciously), but just not "on stage."** → Proceed to Q4.  
  - **(B) Its processing is reduced or blocked early—it’s not just off-stage; it’s barely in the building.** → Proceed to Q5.  

  **Q4 (from A): In the color phi phenomenon, you see a moving dot change color mid-trajectory, but report the color change *before* the second dot appears. How is this possible?**  
  - **(A) The brain constructs the experience *after* both dots appear, then edits the timeline to make it feel seamless.** → **Global Workspace Theory (GWT)**.  
    - *Description*: Consciousness arises when information is broadcast globally to specialized brain systems, like a spotlight on a stage.  
    - *Awkward commitment*: Explaining why we *feel* like we see a rich, detailed world (e.g., in change blindness) when only sparse data is broadcast.  
  - **(B) The experience is generated in real-time, but the timing is inherently fuzzy—there’s no "true" moment for the color change.** → **Higher-Order Thought Theory (HOT)**.  
    - *Description*: A mental state becomes conscious when you have a thought *about* that state ("I am seeing red!").  
    - *Awkward commitment*: Explaining "empty" higher-order thoughts (e.g., thinking you see something that isn’t there) without circularity.  

  **Q5 (from B): In change blindness, you fail to notice a major change (e.g., a building disappearing) during a distraction, yet feel your experience was vivid and complete. What gives?**  
  - **(A) The "theater" holds a rich, detailed representation, but the *comparison* between past/present fails—like missing edits in a film.** → **Cartesian Materialism (CM)**.  
    - *Description*: Consciousness happens in a literal brain region (e.g., prefrontal cortex) where inputs integrate into a unified "movie."  
    - *Awkward commitment*: Explaining color phi without implying the theater "retroactively changes history" to insert the color switch.  
  - **(B) The "theater" only holds sparse, attended details; the feeling of richness comes from the world itself being instantly accessible.** → **Global Workspace Theory (GWT)** (shared leaf with Path A-Q4A).  

  ---

  #### **Path B: No to "Theater" (Q1 → No)**  
  **Q3: In the Libet experiment, brain activity predicts your finger movement before you feel the conscious urge to move. What does this imply?**  
  - **(A) The conscious urge is real but *not* the cause of action; it’s a "story" the brain tells afterward.** → Proceed to Q6.  
  - **(B) The conscious urge is an illusion—there’s no "inner self" making decisions at all.** → **Illusionism (ILL)**.  
    - *Description*: Phenomenal consciousness (e.g., the "redness" of red) is a cognitive illusion; there are only non-conscious processes and reports.  
    - *Awkward commitment*: Explaining why consciousness *feels* so undeniable if it doesn’t exist.  
  - **(C) The conscious urge is real and fundamental, but brain timing can’t capture its true nature.** → **Panpsychism/Property Dualism (PP/PD)**.  
    - *Description*: Consciousness is a basic property of the universe (PP: in all matter; PD: emerging from complex systems).  
    - *Awkward commitment*: The "combination problem"—how micro-conscious particles combine to form unified macro-consciousness.  

  **Q6 (from A): In color phi, you see a dot change color mid-motion before the second dot appears. What’s happening?**  
  - **(A) There’s no single "true" timeline; conflicting brain processes create multiple drafts of events, and the winning draft becomes "conscious."** → **Multiple Drafts Model (MDM)**.  
    - *Description*: Consciousness is a "fame in the brain" contest among parallel, fragmentary narratives; no central theater exists.  
    - *Awkward commitment*: Explaining the *subjective unity* of experience (e.g., why a red apple feels whole) without a central integrator.  
  - **(B) The experience is constructed retrospectively, but it’s not a "draft"—it’s a useful fiction for guiding behavior.** → **Illusionism (ILL)** (shared leaf with Path B-Q3B).  

  ---

  ### **Tree Summary**
  - **Leaves (7 positions)**:  
    1. **Cartesian Materialism** (Path A-Q5A)  
    2. **Global Workspace Theory** (Path A-Q4A and Path A-Q5B)  
    3. **Higher-Order Thought Theory** (Path A-Q4B)  
    4. **Multiple Drafts Model** (Path B-Q6A)  
    5. **Illusionism** (Path B-Q3B and Path B-Q6B)  
    6. **Panpsychism/Property Dualism** (Path B-Q3C)  

  - **Branch Nodes per Path**:  
    - Longest path: 4 nodes (e.g., Q1 → Yes → Q2 → Q4 → GWT/HOT).  

  ---

  ### **Notes on Ambiguities and Gaps**
  1. **Unclean Separation**:  
     - **Global Workspace Theory (GWT) vs. Higher-Order Thought (HOT)** might converge if "broadcasting" (GWT) is seen as enabling higher-order thoughts (HOT). They share answers to Q2 and Q4: both allow unconscious processing and retrospective construction. Separated here by GWT’s emphasis on *access* (Q4) vs. HOT’s on *meta-awareness* (Q4).  
     - **Illusionism vs. Multiple Drafts** both reject inherent timing/unity but differ on whether consciousness is *real*. Separated by Libet (Q3): MDM preserves urges as "stories," Illusionism denies them.  

  2. **Unoccupied Regions**:  
     - **"Late-stage theater with irreducible consciousness"**: A view that accepts a functional theater (like GWT) but insists consciousness is non-physical (like PP/PD). Logically possible but rare; most non-physical views reject theaters entirely.  
     - **Why unoccupied?**: Combines contradictory commitments (e.g., theater requires physical integration, non-physicalism denies it). More unattractive than incoherent.  

  3. **Missing Views**:  
     - **Biological Naturalism** (e.g., Searle) isn’t included; it rejects theaters but asserts irreducible consciousness, aligning closest to PP/PD.  
     - **Representationalism** (consciousness as representational content) blends into GWT/HOT and isn’t split out.  

  ---

  ### **How to Use This Tree**  
  Answer each question based on intuition or empirical claims (e.g., "Change blindness proves the brain doesn’t store rich details"). Cases do the diagnostic work—avoid reading position names until you reach a leaf. The tree prioritizes empirical puzzles over abstractions, making it accessible to science-literate readers.
