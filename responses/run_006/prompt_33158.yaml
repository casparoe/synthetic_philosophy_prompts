answer: |-
  **Philosopher A:** Asymbolia cleanly dissociates the sensory-discriminative aspect of pain from its affective-motivational 'badness', proving the unpleasantness isn't intrinsic to the sensation itself but a separable aversive reaction.
  **Philosopher B:** That assumes asymbolics experience identical qualia to us; their lesion might fundamentally alter the phenomenal character, preventing the *very formation* of the unified, intrinsically bad pain experience normal subjects report.
  **Philosopher A:** But they report sensation qualities accurately! The lesion doesn't destroy sensation, it selectively removes the 'oh no!' reaction layer. This shows the reaction is contingent, not essential to the sensory core.
  **Philosopher B:** Their accurate verbal reports show preserved discriminative *function*, not identical phenomenology. Normal pain’s ‘badness’ might be an inseparable aspect of its unified quale, which the lesion disrupts – a partial dissociation, not proof of separable components in healthy function.
  **Philosopher A:** The mere fact that the affective component *can* be missing while sensation persists in pathology demonstrates that the sensory component alone isn't inherently unpleasant; its badness requires an additional neural/functional process that can fail.
  **Philosopher B:** Pathological dissociation shows what *can* break, not what *is* essential in intact function. A broken clock shows timepieces can lack working hands, but that doesn't mean hands are a merely contingent add-on to a healthy clock's essential time-telling nature.
