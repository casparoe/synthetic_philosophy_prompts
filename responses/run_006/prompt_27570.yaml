prompt: |-
  so i've been reading about split-brain patients and i'm trying to get clear on what the experiments actually show about the unity of consciousness. could you write a dialogue between two philosophers who disagree about this — one who thinks the commissurotomy cases show that consciousness can be divided into two separate streams (maybe even two subjects), and one who thinks consciousness stays unified despite the disconnection. i want them to really engage with each other's best points, not just trade slogans. they should grapple with the actual experimental findings (like the classic visual field stuff, the left hand picking out what the patient says they didn't see, confabulation by the speaking hemisphere, that sort of thing) and also with the conceptual question of what unity of consciousness even means in the first place. maybe have them push each other on whether the other's view is empirically testable or just a difference in how they're using the word "consciousness." don't resolve it neatly — leave the tension there, since honestly the literature hasn't resolved it either.
