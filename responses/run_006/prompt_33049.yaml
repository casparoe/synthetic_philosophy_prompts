prompt: |-
  I am a postgraduate tutor, and on Thursday I have to lead a fifty-minute seminar on Moore's proof of an external world for first-year undergraduates who have read the First Meditation but have not read Moore. Do not explain the proof to me; plan the session. I need from you: (1) the order in which the ideas must be introduced and why each depends on the previous one; (2) the single example that should carry the whole session — I am inclined to use Moore's gesture with his own hands, but tell me whether that is right and what a carrying example must have and must lack for this particular proof; (3) the misconceptions the students will predictably bring or form, including, I suspect, that Moore simply begs the question and that he has confused proving that he has hands with proving that there is an external world, and the exact point in the sequence at which each should be headed off; (4) what I should explicitly set aside or refuse to settle at this level, and why saying so matters; and (5) one final question whose answer would show me whether they have understood what the proof is doing rather than merely finding it quaint. Make definite choices and defend the order; do not give me a menu of options.
reasoning: |-
  Okay, the user is a postgraduate tutor preparing a seminar on Moore's proof of an external world for first-year undergrads. They've read Descartes' First Meditation but not Moore. The user needs a structured plan with specific elements: a logical sequence of ideas, a central example, addressing misconceptions, setting boundaries, and a final comprehension check. 

  Hmm, let's break this down. The key challenge is bridging Descartes' skepticism with Moore's common-sense approach without oversimplifying. The students will likely think Moore is cheating by assuming what he proves, or confusing hands with the external world. 

  First, the sequence must start from their existing knowledge: Descartes' doubt. Then introduce Moore's claim as a direct response. The hand example is perfect - it's concrete, undeniable to them, and mirrors Descartes' own body example. But I need to emphasize that Moore isn't proving hands exist per se, but using them as proof of externality. 

  The misconceptions... ah yes. The begging-the-question accusation must be addressed by distinguishing Moore's premise (self-evident experience) from his conclusion (external world). The hands/external world confusion needs clarification through Cartesian criteria. 

  For boundaries, we must avoid epistemology rabbit holes - this is about Moore's move, not solving skepticism. The final question should test if they see Moore's strategy: using indubitable experience to bypass theoretical doubt. 

  *checks flow* Start with Descartes, pivot to Moore's gesture, dissect why it works despite skepticism, preempt objections, then zoom out to the meta-point about proof standards. The hand example carries everything because it's visceral - no student will deny seeing their own hands. 

  *mental note* Stress that Moore isn't arguing with skeptics but showing their demands are unreasonable. That's the bombshell for undergrads. Final question must force them to articulate how Moore shifts the burden of proof. 

  *validating approach* Yes, this order prevents misconceptions by building step-by-step from shared ground. No menus - definite path. Tutor's confidence in structure will help undergrads navigate the whiplash from Descartes to Moore.
answer: |-
  Here is a tightly structured plan for your 50-minute seminar, designed to build understanding sequentially, leverage a core example, preempt misconceptions, and assess comprehension:

  **Seminar Goal:** Students grasp Moore's *strategy* and *why* his proof is significant, not just its content. They understand it as a *response* to Cartesian skepticism.

  **Core Example:** **Moore holding up his hands.** This is non-negotiable. It perfectly embodies the proof: it's simple, undeniable to common sense, involves direct sensory perception of a physical object, and is about as "external" as something can be. It lacks theoretical baggage (unlike "table" which might imply permanence) and avoids complex senses (unlike smell or sound). Crucially, *it mirrors Descartes' own example of "these hands" being doubted*, creating a direct counterpoint.

  **Order of Ideas & Why (Defended Sequence):**

  1.  **Recap Descartes' First Meditation Goal & Achievement (5 mins):**
      *   **Content:** Descartes seeks absolute certainty, methodically doubting senses (dreaming argument), simple truths (evil demon), and crucially, *the existence of the external world* (including "these hands" and "this body"). He concludes we *cannot* prove the external world exists via the senses.
      *   **Why First?** Establishes the *problem* Moore is addressing. Students *must* see Moore as directly responding to this radical skepticism about externality. Link explicitly to Descartes doubting "these hands."
      *   **Transition:** "Descartes concludes we can't prove an external world exists. Today, we look at G.E. Moore's famous, very short, but hugely controversial *response*: 'Proof of an External World'."

  2.  **Introduce Moore's Core Claim & The Central Gesture (10 mins):**
      *   **Content:** Moore asserts he *can* prove an external world exists. He states his premises: "Here is one hand" (gesturing with right hand), "Here is another" (gesturing with left hand). His conclusion: "Therefore, two external things exist."
      *   **Why Here?** Immediately presents the stark contrast to Descartes. The simplicity and concreteness are jarring. **Use the gesture yourself.** Ask students: "Do you *see* my hands? Do you find Moore's premises obviously true *right now*?" Anchor them in the immediate sensory experience.
      *   **Crucial Point:** Emphasize Moore isn't trying to *convince a skeptic in the act of doubting*; he's demonstrating that *by ordinary standards*, this *is* a proof.

  3.  **Define "External" Moore's Way (5 mins):**
      *   **Content:** Moore defines "external" as "things that can be met with in space" (outside our minds), existing independently of being perceived. Connect this explicitly back to Descartes' goal of proving *that kind* of world exists.
      *   **Why Now?** This preempts Misconception #2 (Hands vs. External World). Students must see that hands *are* paradigm examples of "external objects" by this definition – they are spatially located, physical, and exist whether perceived or not. **Explicitly state:** "Moore isn't *confusing* proving hands exist with proving an external world exists. He's arguing that hands *are* prime examples *of* external objects. Proving hands exist *just is* proving external objects exist."

  4.  **Analyze the Proof's Structure & Why it Seems to Work (10 mins):**
      *   **Content:** Break it down logically: Premise 1 (Hand1 exists), Premise 2 (Hand2 exists). Conclusion (External things exist). Emphasize: The premises *entail* the conclusion given the definition of "external." Moore argues the premises are *known* to be true with certainty greater than any skeptical hypothesis.
      *   **Why Here?** Shows the proof isn't logically invalid. This is where the *force* of the example hits: students *know* they see your hands. Ask: "Is your *certainty* that you see my hands right now *really* less than your certainty that you *might* be dreaming or deceived? Which seems more basic?" Moore's point is that the proof relies on this bedrock certainty.

  5.  **Confronting the "Begging the Question" Accusation (Misconception #1) (10 mins):**
      *   **Predictable Misconception:** "But Moore is just *assuming* the external world exists to prove it exists! He's begging the question against the skeptic!"
      *   **Why Address Here?** After establishing the proof's structure and the force of the example, this objection naturally arises. It's the biggest hurdle.
      *   **How to Head it Off:**
          *   Acknowledge it *feels* like this to the skeptic.
          *   **Moore's Key Move:** Argue Moore *isn't* trying to *convince* the skeptic using premises the skeptic accepts. He's showing that *by our ordinary standards of proof and knowledge*, his premises *are* better known and more certain than the skeptic's *denial* of the external world or the premises of their arguments (like the dreaming hypothesis).
          *   **Reframe:** Moore is *rejecting the skeptic's starting point* as less reasonable than trusting his basic sensory experience. He's shifting the burden: "I know this (hands) far more surely than I know the *possibility* that grounds your doubt." The proof exposes that the skeptic's demand for a *different kind* of proof (one not relying on sense experience) is unreasonable or impossible to meet. **Say:** "Moore isn't *begging* the question; he's *challenging the skeptic's framework* as being less secure than common sense."

  6.  **What Moore is NOT Doing / What to Set Aside (5 mins):**
      *   **Explicitly Set Aside:**
          *   **Solving Skepticism Theoretically:** Moore isn't offering a *theory* of perception or refuting skepticism on the skeptic's own terms (e.g., proving the *impossibility* of dreaming right now). He's showing skepticism conflicts with what we *know*.
          *   **Proving Hands Exist *to a Doubter*:** He's not in a debate trying to persuade someone actively denying their senses. He's demonstrating the *kind* of thing we know with certainty.
          *   **Defining "Knowledge" or "Proof":** Don't get bogged down in theories of justification. Focus on Moore's *contrast* between the certainty of "Here is a hand" and the uncertainty of skeptical hypotheses.
      *   **Why Say This?** Prevents tangents into complex epistemology. Reinforces that the session's goal is understanding Moore's *strategy* as a response to Descartes, not evaluating every possible implication. "For today, focus on *how* Moore uses this undeniable example to challenge the *reasonableness* of Descartes' radical doubt."

  7.  **The Significance: Moore's Challenge to Philosophical Method (3 mins):**
      *   **Content:** Moore forces us to ask: What are the *starting points* of philosophy? Should we doubt the utterly obvious (like having hands) because of abstract possibilities? Or should philosophy begin from what we know best? He's arguing that skepticism, not common sense, bears the burden of proof.
      *   **Why Last?** This is the payoff. It shows Moore isn't just being quaint; he's making a profound methodological point about the relationship between philosophy and ordinary belief. Link back to the start: "Remember, Descartes began by doubting 'these hands'. Moore says this starting point is fundamentally flawed."

  **Final Comprehension Question (2 mins):**
  *   **Question:** "Moore says his proof might seem 'trifling', but he thinks it's important. Why isn't Moore *simply* proving that he has two hands? And why does he think pointing to his hands is a *better* response to Descartes' skepticism than trying to argue directly against the Dreaming or Evil Demon arguments?"
  *   **Why This Question?** It tests if they grasp:
      1.  The definitional link between hands and external objects (it *is* proving the external world via an instance).
      2.  Moore's core strategy: using an indubitable (by common sense) premise to shift the burden of proof onto the skeptic, thereby challenging the *framework* of the skeptical argument itself, rather than engaging with its details on its own terms.
      3.  The significance lies in the challenge to philosophical starting points.
  *   **Look for Answers Indicating:** Understanding that hands *exemplify* externality; that the certainty of the premise outweighs skeptical hypotheses; that Moore is rejecting the skeptic's demand as unreasonable rather than trying to meet it head-on.

  **Defense of Order:** This sequence mirrors the logical and pedagogical necessity. You *must* start with the problem (Descartes). You *must* then present Moore's stark counter (the gesture) to create cognitive dissonance. Defining "external" *immediately after* anchors the example to the conclusion and preempts a major confusion. Analyzing the structure shows it *is* formally valid, paving the way to tackle the deeper objection (begging the question) by distinguishing logical validity from dialectical persuasion against a skeptic. Setting boundaries keeps focus. Ending with significance shows why it matters beyond the "trifling" surface. The final question synthesizes the key insights about the proof's nature and purpose. The hand example carries the entire weight because every step hinges on its undeniable immediacy and its perfect fit as an "external object."
