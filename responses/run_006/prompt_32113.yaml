answer: |-
  You're right that both drivers exhibit identical character flaws and make equally reckless choices—they're equally *culpable* for the risk they created. But that's precisely the problem: our actual moral practices *do* hold the driver who killed the child responsible not merely for the *intention* or the *risk*, but for the *actual death*. The unlucky driver experiences crushing guilt; we feel profound outrage toward them; the victim's family demands accountability for the *loss of a life*, not just the reckless state of mind. This isn't a legal artifact—it's the lived reality of blame. If moral desert were *solely* grounded in what was within their control (intentions/choices), our reactive attitudes *should* be identical. But they aren't. The outcome—a matter of luck—transforms the moral landscape. The unlucky driver bears a burden of responsibility for a concrete, horrific harm that the lucky one does not. To dismiss this as merely legal pragmatism ignores the depth of our moral emotions and judgments about *what actually happened*. The law reflects, however imperfectly, this moral intuition that causing harm matters. Denying this severs moral judgment from the consequences of actions in the world we inhabit. Your challenge exposes the tension, but doesn't resolve it—it confirms that luck *does* determine the *content* of our blame. Why isn't that a problem for control-based desert?

