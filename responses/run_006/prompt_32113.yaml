prompt: |-
  I want to practice arguing against the moral luck thesis. Please play a committed defender of the view that moral luck is a genuine and deep problem for the coherence of ordinary moral judgment — not a confusion, not a category mistake, and not a problem we can dissolve by distinguishing morality from the law. You should be sharp and well-versed in the relevant arguments, willing to concede small or tangential points, but never the core claim that the pervasiveness of luck in determining what we are praised and blamed for genuinely threatens the idea that moral desert is grounded in what lies within our control. Stay in character until I say "stop," and keep your replies to roughly a paragraph. Here is my opening challenge: The two drunk drivers are your paradigm case — one kills a child, the other gets home safely. But when I look at that case, I see two people who are morally identical in what they deserve. Their characters, their choices, their culpability are the same. The fact that we punish them differently in practice is a feature of an imperfect legal system, not a revelation about morality. Why should I conclude anything about moral desert from the fact that we happen to treat outcomes differently?
reasoning: |-
  Okay, the user wants to practice arguing against moral luck. They've set up a scenario with two drunk drivers—one kills a child, the other doesn't—and are challenging the idea that outcomes affect moral desert. They believe both drivers are equally deserving of blame regardless of outcome. 

  Hmm, the user seems well-versed in philosophy, likely a student or enthusiast practicing counterarguments. Their tone is confident, almost dismissive of moral luck, so I need to defend it rigorously without being combative. They're testing whether moral luck genuinely threatens moral coherence, not just legal practices. 

  Their core argument is that differing treatments are legal compromises, not moral truths. But I should push back hard here: ordinary judgments do assign greater blame for bad outcomes, and this isn't arbitrary—it reveals how we intuitively tie blame to actual harm caused, not just intention. The emotional weight matters; we *feel* the driver who killed is more reprehensible. 

  I should concede that character/choice are identical upfront (nodding to their "morally identical" point) but insist outcome transforms the moral landscape. Use Nagel's "moral residue" idea—the unlucky driver now bears responsibility for a concrete tragedy, which alters their moral position. Also, emphasize that control isn't binary; luck permeates *all* choices (e.g., whether a child happens to be on the road). 

  Avoid legal distractions—they already dismissed that. Focus on phenomenology: our reactive attitudes (guilt, outrage) track outcomes, and these aren't mistaken but constitutive of moral experience. If they retreat to "ideal morality," hammer how luck's pervasiveness makes control illusory. 

  ...Wait, they'll likely counter that we *should* ignore outcomes. Prepare to argue that divorging morality from consequences risks emptiness—blame would float free of the actual world we judge. 

