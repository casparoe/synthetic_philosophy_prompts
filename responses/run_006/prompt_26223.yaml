prompt: |-
  I'm in an intro philosophy course and we just did a week on pragmatism. My professor kept summing up the pragmatist theory of truth as "truth is what works" — she'd say it with this knowing smile like it's obviously right, and then move on. But when I pressed her in office hours about whether this means that believing you'll recover from an illness makes it true that you will (because the belief "works" by giving you hope), she said no, that's a caricature, and told me to read James more carefully. So I've read the first couple chapters of Pragmatism now and honestly James does say things that sound a lot like that? He talks about truth in terms of its cash-value in experiential terms and says true beliefs are those that pay their way in experience. Meanwhile my TA told me Peirce would have hated all of this and that his view was totally different, something about truth being the opinion fated to be agreed upon at the end of inquiry. So now I'm confused about what "truth is what works" even means across these different pragmatists, and whether my professor is being fair to either of them.

  Can you lay out the distinct precise claims that slogan could be making — from the obviously false to the defensible — and say for each one whether Peirce would endorse it, James would endorse it, or whether it's just a sloppy conflation that neither would sign off on? I want to go back to office hours with a clear map of what's actually being claimed, so I can tell her which version I'm objecting to and ask which one she means. And please end with a one-sentence summary as the last line.
