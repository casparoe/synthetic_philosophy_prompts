prompt: |-
  I'm drafting a novel set on a small island that's about to vote on whether to break off and govern itself, and the subplot I keep getting stuck on is the electoral commission deciding who belongs on the voter roll. I don't want the commission to feel like its just doing whatever the plot needs, so I've been sketching a little record of their earlier rulings. So far they've ruled that a noncitizen who has lived on the island for nine years and works at the ferry terminal can vote; that a native-born citizen who moved to the mainland thirty years ago and hasn't been back since cannot vote; and that a citizen who moved to the mainland for an eighteen-month job but kept her house on the island and comes back most weekends can vote.

  The case they're about to hear is a man who lives in the mainland town across the channel but has worked at the island's cannery for over a decade, pays the island's income tax, and sends his kids to the island's school. If the commission wants to stay consistent with its own record, should it put him on the roll? I'm less interested in the bare yes or no than in the candidate rules that fit the earlier cases, which of the earlier rulings is the closest analog, and what principle the commission would be committing to either way. And if the record genuinely underdetermines it, what future case would best expose the difference between the rules?
reasoning: |-
  Okay, the user is writing a novel set on a small island facing a crucial vote on independence. They're stuck on a subplot about the electoral commission deciding voter eligibility. They've already established three cases and want to know how the fourth case—a mainland resident working on the island—should be decided to stay consistent. 

  Hmm, the user is clearly a thoughtful writer—they're building a detailed governance system and care about internal logic, not just plot convenience. They're wrestling with how abstract principles manifest in messy human situations. The fact they're sketching prior rulings shows they want the commission to feel like real people applying rules, not puppets.

  Breaking down their existing cases: The ferry worker (long-term resident non-citizen) got voting rights—that suggests "community participation over paperwork." The absent native (citizen but no ties) was denied, reinforcing that presence matters more than birthright. The commuter (kept home/regular visits) was approved, showing physical presence isn't strictly continuous if roots remain.

  Now this cannery worker: Lives mainland but works/pays taxes/sends kids to island school daily. His life is economically and socially integrated despite sleeping across the channel. If the commission values tangible ties (like the ferry worker case), he should qualify. But if they fixate on residency (like rejecting the absent native), they might exclude him. 

  The tension here is between "center of life" (which for him is split) versus "investment in community" (which he clearly has). The commuter case is the closest analog—both have mainland connections but sustained island participation. Approving him would commit to "functional membership" as the core principle. Rejecting him would imply "domicile is non-negotiable," which might surprise readers after the ferry worker precedent.

  If they approve him, a future case could test someone with only economic ties (e.g., a mainland investor with no social integration). If rejected, test a bedridden islander who never leaves home but contributes nothing else—does pure residency suffice? Either choice deepens the theme: What makes someone belong to a place? Paperwork, blood, or sweat?
answer: |-
  Based on your commission's established rulings, **the cannery worker SHOULD be eligible to vote** to maintain consistency. Here's the breakdown:

  1.  **The Core Principle Emerging:** Your commission prioritizes **"Meaningful, Active, and Current Connection to the Island Community"** over strict legal citizenship or even continuous physical presence. They look at the *substance* of a person's life and contribution, not just formalities or history.

  2.  **Analysis of Precedents & Application to the Cannery Worker:**
      *   **Ferry Worker (Non-Citizen, 9 Years Residence & Work):** Approved. *Principle:* Long-term, demonstrable integration into the daily life and economy of the island outweighs lack of formal citizenship. **Connection:** The cannery worker has an even *stronger* economic tie (decade+ of work + pays *island income tax*) and integrates his children into the island's social fabric (school). While he sleeps off-island, his daily life revolves around the island.
      *   **Absent Native (Citizen, 30 Years Absent):** Rejected. *Principle:* Citizenship alone is insufficient without a *current and active* connection. Historical ties decay without ongoing involvement. **Connection:** The cannery worker is the *opposite* – no historical birthright, but profound *current* and active involvement.
      *   **Weekend Commuter (Citizen, Maintained Home, Regular Visits):** Approved. *Principle:* Maintaining a physical foothold (home) and regular, frequent presence demonstrates an ongoing commitment and integration, even if not full-time residence. Physical presence doesn't need to be constant, but must be significant and regular. **Connection:** The cannery worker has *no* physical home on the island, which is a point against him *compared to this case*. However, his daily work presence (presumably 5+ days a week), tax payments, and children's schooling represent an even *more consistent and impactful daily involvement* than the weekend commuter. His connection is economic and social, rather than rooted in property ownership, but it's arguably deeper and more essential to the island's functioning.

  3.  **Closest Analog:** The **Ferry Worker** is the closest analog. Both are non-citizens (assuming the cannery worker isn't an island citizen) whose primary *functional* life and contribution are tied to the island through long-term work and integration.
      *   **Differences:** Ferry worker *lives* on-island, Cannery worker lives off-island but *works/pays taxes/schools kids* on-island daily. The commission already ruled that citizenship (a formal status) is less important than active connection (Ferry Worker). Living *on* the island is a strong indicator, but the commission hasn't made it an *absolute requirement* (see Weekend Commuter, who doesn't live there full-time either). The Cannery Worker's *daily economic and social investment* mirrors the Ferry Worker's integration, just starting from a different physical point each night.

  4.  **Principle Committed To By Approving Him:**
      *   **Functional Integration Trumps Formal Residency:** The commission would solidify that the *substance* of a person's daily life, economic contribution, and social investment within the island community is the paramount factor. Where you sleep is secondary to where you live your life, pay your dues, and raise your family.
      *   **"Community Stakeholder" Principle:** Voting rights belong to those whose daily lives and livelihoods are demonstrably intertwined with the island's present and future, regardless of the map coordinates of their bed. Paying the island's taxes and educating his children there gives him a direct, tangible stake in the outcome.

  5.  **Principle Committed To By Rejecting Him:**
      *   **Domicile as the Non-Negotiable Core:** Rejection would signal that maintaining a primary *residence* on the island is the fundamental, non-negotiable requirement. All other connections (work, taxes, school) are secondary to the physical act of dwelling there. This would create tension with the Weekend Commuter ruling (who doesn't live there full-time but kept a home) and significantly weaken the principle established by approving the Ferry Worker (who lives there but isn't a citizen).
      *   **"Bed Test" Over "Life Test":** It would prioritize the location of one's bed over the location of one's work, taxes, and children's education as the defining factor for belonging.

  6.  **If the Record Underdetermines It - The Future Case to Expose the Difference:**
      The ambiguity lies in **the relative weight of PHYSICAL RESIDENCE vs. ECONOMIC/SOCIAL INTEGRATION when they are separated.** The cannery worker case pushes this boundary. To truly test the principle the commission adopts here, introduce a future case that further separates these factors:

      *   **Cannery Worker Approved:** Then test **"The Absentee Landlord"**:
          *   *Scenario:* A wealthy individual who owns significant island property (rental apartments, a large summer home) but lives permanently on the mainland, visits only 2-3 weeks a year, employs a local caretaker, pays island property taxes, but has no other connections.
          *   *Exposes:* Does pure economic investment (property, taxes) without *any* personal daily life or social integration on the island qualify? If the commission approved the Cannery Worker based on his *life* being on the island daily, they should reject the Landlord. If they approve the Landlord, it shifts the principle towards pure economic stake, which the Ferry Worker case didn't require.

      *   **Cannery Worker Rejected:** Then test **"The Homebound Islander"**:
          *   *Scenario:* A lifelong resident citizen, now elderly and infirm, who physically cannot leave their home (or does so very rarely), has no job, minimal social interaction beyond caregivers/family, but clearly considers the island their only home and community.
          *   *Exposes:* If the commission rejected the Cannery Worker for lacking residency *despite* massive daily involvement, do they now reject the Homebound Islander for lacking *active, visible* participation despite lifelong residency and clear psychological belonging? This would highlight the harshness of a strict "active participation" requirement if residency alone isn't sufficient. If they approve the Homebound Islander, it emphasizes residency as the core factor, making the Cannery Worker rejection consistent.

  **Conclusion:** To stay consistent with the spirit of their prior rulings – valuing active, current, meaningful contribution and integration over formal status or even strict continuous residence – the commission should **approve the cannery worker for the voter roll**. His decade-plus of daily work, payment of island taxes, and integration of his children into the island school system demonstrate a profound, ongoing, and essential connection to the island community's present and future. Rejecting him would undermine the logic used to approve both the Ferry Worker and the Weekend Commuter. The future "Absentee Landlord" case would best test the limits of the "functional integration" principle established by approving him.
