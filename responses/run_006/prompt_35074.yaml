  First, the most likely and damaging objections. Physicalists will question empirical distinguishability from emergentism. That's a common critique, so it's probably top. Metaphysicians might challenge the grounding relation's applicability to consciousness. Dualists could argue panpsychism inherits physicalism's issues. The physics philosopher will ask about fundamental entities and quantum compatibility.

