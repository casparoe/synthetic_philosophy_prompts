answer: |-
  Here's a restatement of the core arguments of accuracy-first epistemology (AFE) in your operational vocabulary, followed by a residue report analyzing the translation fidelity and the nature of any discrepancies.

  **Core AFE Arguments Translated:**

  1.  **Joyce's Dominance Argument for Probabilism:**
      *   **Claim:** Any incoherent credence function (violating Kolmogorov axioms) is *strictly accuracy-dominated* by a coherent one under *any* strictly proper scoring rule (SPR).
      *   **Translation:** Consider a forecast vector `c` over a partition (mutually exclusive, exhaustive events). If `c` is incoherent (e.g., `sum(c) != 1`, `c < 0`, `c > 1`), then there exists a coherent forecast vector `p` such that for *every possible* true outcome state `s_i` (realization of the random variable), and for *every* strictly proper scoring rule `S(·,·)`:
          `S(p, s_i) < S(c, s_i)`
      *   **Decision-Theoretic Justification:** Using `c` is like choosing a strictly dominated action in a decision problem where states are the possible outcomes and actions are forecast vectors. The loss function (scoring rule) `S` defines the loss for each action-state pair. An incoherent `c` is strictly dominated by a coherent `p` because `p` yields strictly lower loss (higher score) *no matter which outcome `s_i` actually occurs*. Rational agents avoid strictly dominated strategies. Therefore, rational credences must be coherent (probabilistic).
      *   **Connection to Forecast Evaluation:** This is a *pre-deployment dominance* argument based on *pointwise loss comparison* across all possible realizations. It doesn't rely on `c` or `p` being calibrated or sharp; it's purely about the mathematical property of coherence guaranteeing non-domination under any SPR loss structure.

  2.  **Argument for (Plan) Conditionalization:**
      *   **Claim:** Upon learning evidence `E`, updating via Bayes' Rule (conditionalization) is the unique way to avoid being accuracy-dominated *in expectation* relative to your *prior credences and update plan*.
      *   **Translation:** You start with a prior probability model `P_old(·)`. You also adopt an *update plan*: a function `Plan(E) = P_new(· | E)` specifying your new forecast vector for any possible evidence `E` you might receive. The argument compares two strategies:
          *   **Strategy C:** `Plan(E) = P_old(· | E)` (Bayesian Conditionalization)
          *   **Strategy D:** Some other plan `Plan_D(E) != P_old(· | E)`.
      *   **Decision-Theoretic Justification:** Your *prior* `P_old` induces an *expected loss* for any update plan `Plan(·)`, calculated *before* learning `E`. This expectation is taken over both the unknown state *and* the unknown evidence `E`, weighted by `P_old(state, E)`. Formally, the expected score of a plan `Plan` is:
          `E_{state, E}[ S(Plan(E), state) ]`
          The result is that `Strategy C` minimizes this prior expected loss (maximizes expected score) compared to any `Strategy D`, for *any* SPR `S`. Choosing `Strategy D` is choosing a strategy with strictly higher *ex-ante* expected loss than `Strategy C`. Rational agents minimize expected loss. Therefore, rational updating follows the conditionalization plan.
      *   **Connection to Forecast Evaluation:** This is about the *optimality of a policy* (the update plan) under a specific loss function (SPR), evaluated according to the *prior belief model*. It justifies the Bayes update as the *ex-ante optimal decision rule* for minimizing future expected scoring rule loss, given your current model. The "plan" aspect emphasizes commitment to the rule before seeing the data.

  3.  **Accuracy as Sole Fundamental Epistemic Value:**
      *   **Claim:** The fundamental epistemic good of a credence is its *accuracy* – how close it is to the truth (1 for true propositions, 0 for false ones). All other epistemic virtues (informativeness/sharpness, coherence, justification for conditionalization) are *derivative*: they are valuable *because* and *insofar as* they promote accuracy (avoid dominance, minimize expected loss). Calibration is valuable primarily as a *necessary condition* for maximal accuracy in the limit (via the calibration-resolution dichotomy), but not fundamental.
      *   **Translation:** The epistemic utility function for evaluating credences is *exclusively* defined by a strictly proper scoring rule `S(c, truth)`. The sole epistemic objective is to minimize the expected value of `S(c, truth)` (or maximize its negative). Properties like coherence (Probabilism) and the Bayes update rule (Conditionalization) are not fundamental goals; they are *optimal strategies* derived from the imperative to minimize expected scoring rule loss. Sharpness is valued because, *given calibration*, sharper forecasts yield better scores (higher resolution). Calibration is valued because *miscalibrated* forecasts are demonstrably sub-optimal (dominated or higher expected loss) compared to calibrated ones based on the same information.
      *   **Decision-Theoretic Justification:** Epistemic rationality is modeled as a pure *minimization of expected epistemic loss* problem, where loss is defined by a SPR. The norms are derived as dominance or expectation-minimization results within this framework. This is analogous to justifying profit maximization as the core goal in economics and deriving business strategies from it.

  **Residue Report:**

  1.  **Translates Cleanly (Minor Nuances Only):**
      *   **Probabilism via Dominance:** This maps exceptionally well. Joyce's argument *is* a dominance argument under SPR loss functions. The core mathematical result is identical to what a forecaster understands: incoherent forecasts are strictly dominated. The translation is precise.
      *   **Conditionalization as Expected Loss Minimization:** The derivation of Bayes' rule as the update minimizing *prior expected scoring rule loss* translates directly. This is a standard Bayesian decision-theoretic justification forecasters recognize. The "plan" aspect cleanly maps to pre-committing to an update *function* or *policy*.
      *   **Role of Strictly Proper Scoring Rules:** The fundamental reliance on SPRs as the measure of accuracy/epistemic utility is identical. The arguments for why SPRs are the "right" measures (truth-directedness, propriety ensuring honesty is optimal) are shared.
      *   **Calibration/Sharpness Dichotomy:** The understanding that perfect calibration is necessary but insufficient for optimal accuracy (and that sharpness, given calibration, is key) is fully shared. The decomposition of scoring rules (like Brier) into calibration and refinement terms reinforces this.

  2.  **Requires Distortion/Fudging (Significant Conceptual Stretching):**
      *   **Scope of Dominance for Probabilism:** Joyce's original argument aimed for dominance under *any* "reasonable" measure of inaccuracy, not *just* SPRs. Later work (e.g., Predd et al.) formalized this using *continuous, convex, bounded* loss functions. While SPRs are the prime example, the philosophical claim is slightly broader. Translating it *strictly* to "any SPR" is a slight narrowing, though practically, SPRs are the core focus in both fields. *Distortion:* Conflating "reasonable measure of inaccuracy" solely with "SPR".
      *   **The Nature of "Credences" vs. Forecasts:** AFE treats "credences" as *doxastic attitudes* – genuine beliefs of an agent. Your forecasts are *operational outputs of a model*. AFE arguments are normative for believers; your framework is descriptive/prescriptive for predictive systems. While the math is the same, the *ontology* differs. *Fudging:* Treating "credence" and "probabilistic forecast" as perfectly synonymous ignores the philosophical baggage of "belief".
      *   **Sole Fundamentality of Accuracy:** While forecasters *care* intensely about accuracy (measured by SPRs), they operate within practical constraints (compute, data, model misspecification). AFE presents accuracy (via SPR minimization) as the *sole fundamental epistemic goal*, from which all other epistemic norms are derived. A forecaster might readily agree accuracy is the primary goal but wouldn't necessarily derive *all* rational norms *solely* from it or claim other values (simplicity? robustness?) have *no* epistemic fundamentality. *Distortion:* Presenting the AFE claim as identical to a forecaster's prioritization of accuracy glosses over the philosophical commitment to its *exclusive fundamentality* for defining epistemic rationality itself.
      *   **The "Why Propriety?" Justification:** Forecasters use SPRs because they incentivize honest reporting of true beliefs/models. AFE uses SPRs because they are claimed to be the uniquely truth-revealing measures of *pure epistemic accuracy* for beliefs. The forecaster's justification is more pragmatic (incentive design); the AFE justification is more foundational (defining accuracy). *Fudging:* Implying the reasons for choosing SPRs are identical.

  3.  **No Natural Expression / Significant Residue:**
      *   **Normativity vs. Operationalization:** AFE is fundamentally *normative* and *justificatory*. It aims to *derive* and *justify* the core norms of rationality (Probabilism, Conditionalization) *from* the more basic norm of "seek accuracy". Your framework *presupposes* probability models and Bayes updates (or alternatives) and uses SPRs to *evaluate* forecasts generated by them. AFE tries to *found* the norms; you *use* them. The residue is the philosophical project of *justification* itself.
      *   **The Depth of "Dominance":** In AFE, avoiding dominance isn't just a practical tip; it's presented as a *constitutive requirement of rationality*. Being dominated is portrayed as an *epistemic sin* revealing irrationality, not just a forecast inefficiency. This strong normative force ("you *ought* not be dominated") has no direct counterpart in your operational evaluation, which focuses on measurable performance improvement.
      *   **The Challenge of "No Alternatives":** AFE argues *only* coherence avoids dominance, and *only* conditionalization minimizes expected loss. Your world knows that under model misspecification or computational constraints, simpler non-Bayesian updates or even incoherent "forecasts" (like point predictions) might be *pragmatically optimal* given the trade-offs. AFE generally ignores these practical trade-offs in its core justifications, focusing purely on the epistemic ideal. The residue is the idealized, constraint-free nature of the epistemic scenario.
      *   **Debates on SPR Admissibility:** Philosophical debates about which SPRs are "legitimate" (e.g., arguments based on "Symmetry", "Extensionality", "Propriety to Infinity", "Commutativity") often hinge on intuitions about *epistemic value* or *rational assessment* that go beyond the forecaster's primary concerns of incentive compatibility (propriety) and decomposability. The residue is the philosophical discourse trying to pin down the *uniquely correct* measure of epistemic accuracy, while forecasters readily use multiple SPRs depending on the task (LogS for model comparison, CRPS for continuous, Brier for binary).

  **Conclusion: Rebranding or Genuine Difference?**

  It's **mostly sophisticated rebranding of the core mathematical decision theory**, but with a **distinctly philosophical residue** arising from its *normative, justificatory goals* and its *idealized conception of agency and belief*.

  *   **What's Shared:** The fundamental mathematics of dominance under SPRs, the expected loss minimization justification for Bayes' rule, the understanding of calibration/sharpness, and the central role of strictly proper scoring rules as measures of accuracy/loss are identical. A forecaster minimizing expected Brier score is *using the same core toolkit* the philosophers analyze.
  *   **The Residue Source:**
      *   **Philosophical Goals:** AFE isn't just about *how* to forecast well; it's about *why* the probability axioms and Bayes' rule are *rational requirements* at all, derived solely from the pursuit of accuracy. This justificatory project is foreign to operational forecasting.
      *   **Normative Force:** AFE imbues the dominance and expected loss minimization results with strong normative weight ("this is what rationality *demands*").
      *   **Idealization:** AFE arguments typically assume agents can form precise, coherent credences over any proposition and update perfectly, ignoring computational limits, model uncertainty, and the costs of cognition. Your framework inherently lives within these constraints.
      *   **Sole Fundamentality:** The claim that accuracy (as measured by SPRs) is the *only* fundamental epistemic good is a philosophical thesis, not an operational tenet of forecasting. Forecasters care about accuracy profoundly but acknowledge other competing values in practice.

  **Is the Residue Important?** For your *operational work*, the residue (the justificatory project, the strong normativity) is likely unimportant. You already know the math works. However, understanding AFE provides a deeper *conceptual foundation* for *why* the tools you use (probability, Bayes, SPRs) hang together so coherently from a specific perspective on epistemic goals. It reveals the elegant decision-theoretic structure underlying the norms. If you think about the *philosophical justification* of your methods or interact with questions about the "rationality" of probabilistic forecasting, the residue becomes crucial. If you're purely focused on building better predictive models under constraints, the residue represents philosophical commitments that go beyond your operational needs. The philosophical machinery isn't doing different math; it's using the math to answer a different kind of question ("What is rational belief?") within a highly idealized framework.
