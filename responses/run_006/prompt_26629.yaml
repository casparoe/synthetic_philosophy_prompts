prompt: |-
  I'm a data scientist at a forecasting platform where I build models that output probabilistic predictions. My daily work involves proper scoring rules — Brier scores, log scores, continuous ranked probability scores — and I think constantly about calibration, sharpness, and the decomposition of scoring rules into these components. I've also internalized the standard result: if you're scored by a strictly proper scoring rule, your expected score is maximized by reporting your true credence, not some strategic distortion. In our world, this is a practical tool for incentive design, not a deep philosophical claim.

  Recently a colleague told me that philosophers have been developing something called "accuracy-first epistemology" that uses these same tools — proper scoring rules, dominance arguments, expected accuracy maximization — to justify norms of epistemic rationality. The idea, as I understand it, is that credences have accuracy as their sole fundamental epistemic value, and that norms like probabilism (credences must obey the probability axioms) and conditionalization (updating by Bayes' rule) can be derived from the demand that your credences not be accuracy-dominated. I've skimmed a bit of Joyce and Pettigrew and it looks to me like they're essentially doing what any forecaster does: pick a scoring rule, evaluate credences by how well they score, and argue that you shouldn't leave accuracy on the table. But the philosophical literature is large, there are dozens of papers about which scoring rules are admissible and what properties they need, and I suspect I'm missing something important.

  Please restate the core arguments of accuracy-first epistemology — Joyce's dominance argument for probabilism, the argument for conditionalization (or the plan-conditionalization variant), and the broader claim that accuracy is the sole fundamental epistemic value — in the vocabulary I actually use: proper scoring rules, loss functions, expectations, dominance, calibration, forecast evaluation, and decision theory. Be as faithful as you can; don't simplify the philosophy into a caricature just because my vocabulary is more operational. Then give me the residue report: which claims translate cleanly, which ones you had to distort or fudge, and which ones have no natural expression in my framework at all. I want to know whether the philosophers are doing something genuinely different from what a forecaster does when they minimize expected Brier score, or whether the philosophical machinery is mostly a rebranding. If there's a residue, is it because my framework is missing something important, or because the philosophical claims are less precise than they look when you try to operationalize them? Take your time and think carefully about each stage of the translation before delivering the report.
