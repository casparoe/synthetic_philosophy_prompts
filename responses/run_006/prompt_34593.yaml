prompt: |-
  I've been reading around the paradox of voting for a paper and I'm struck by how the debate about whether voting is rational seems completley stuck. On one side you've got the Downsian argument: the probability your vote is decisive in any reasonably sized election is so astronomically small that even if the stakes are huge, the expected utility of voting rounds to zero — so voting is irrational unless you get some kind of consumption or expressive benefit from the act itself. On the other side you've got people who find this conclusion absurd and try to rescue voting: maybe voters are reasoning in terms of group efficacy rather than individual causal impact, or they have duty-based reasons that don't run through expected consequences at all, or the whole expected-utility framework is the wrong lens for a decision like this. Both sides have been at it since at least the 1950s and as far as I can tell nobody's moved. My question is: what kind of disagreement is this, actually? Is it a substantive empirical question about what's going on in voters' heads when they decide to vote? Is it a verbal dispute about the word 'rational'? Is it a clash of bedrock methodological commitments — say, about whether rationality has to be analyzed in terms of causal consequences — where each side is just going to beg the question against the other? Or is the whole framing broken in some way I'm not seeing? I want a diagnosis of the structure of the disagreement, not a summary of the positions. And given your diagnosis, what would actually move things — a different kind of empirical data, a sharper conceptual distinction, a formal result — or is this the sort of impasse where we should stop expecting movement? Keep it to 400 words max.
