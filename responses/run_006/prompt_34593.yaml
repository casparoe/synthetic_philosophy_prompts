  The user is clearly well-read on this, so they're not looking for a summary. They want a structural diagnosis. Let me recall the key points. Downs argues that the probability of a single vote mattering is minuscule, so unless there's expressive benefit, it's irrational. Opponents say that's absurd and bring in duty, group efficacy, or different rationality frameworks. 

