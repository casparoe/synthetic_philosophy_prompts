  Another point: Even in complete sensory deprivation, like in float tanks, people report a persistent sense of self. Studies on sensory deprivation might support this, showing that self-awareness remains when external stimuli are removed, though internal sensations might persist. But the immediacy of self-awareness versus the mediated nature of sensory data strengthens the modest claim.

