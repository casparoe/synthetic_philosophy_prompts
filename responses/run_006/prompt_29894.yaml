prompt: |-
  I have spent the past few months trying to understand why a distributed system I am helping design fails in exactly the cases where messages can be delayed or lost, and the fixes I find in the literature all invoke common knowledge of rationality, but different papers appear to mean different things by it. Before I commit to any one formalism, I want a specification of what an adequate account of common knowledge of rationality must deliver. For my purposes, an adequate account is one that can underwrite reasoning about coordination and agreement among agents who cannot communicate with certainty. Please write the desiderata: the cases it must get right, such as the coordinated attack problem and the electronic mail game; the distinctions it must respect, such as mutual belief versus common belief, knowledge versus belief of rationality, and common knowledge versus approximate or p-common belief; and the formal results it must accommodate or explain away, such as the result that agents with common priors cannot agree to disagree. For each requirement, give the case or consideration that makes it a requirement. Then say which requirements are non-negotiable and which are merely commitments of a particular research program, and flag any subset of desiderata that you suspect cannot be jointly satisfied. Keep the weight on the criteria and their motivating cases rather than on scoring existing accounts.
reasoning: |-
  We are to specify desiderata for an adequate account of common knowledge of rationality (CKR) in the context of distributed systems where messages can be delayed or lost. The account must underwrite reasoning about coordination and agreement without certain communication.

  We break down the desiderata into three categories:
  1. Cases it must get right (with motivating examples)
  2. Distinctions it must respect (with why they matter)
  3. Formal results it must accommodate or explain away (with the relevance)

  We then discuss which requirements are non-negotiable and which are more program-specific, and flag any potential conflicts.

  ---

  **1. Cases it must get right**

  a. **Coordinated Attack Problem (aka Two Generals Problem)**:
     - *Motivation*: Two armies must coordinate an attack on a city. They can only communicate via messengers that may be captured (messages lost). The problem shows that without common knowledge of the attack plan (which requires communication that is not subject to failure), coordination is impossible. An adequate account of CKR must explain why common knowledge is unattainable in this setting and what weaker forms of agreement (if any) can be achieved.

  b. **Electronic Mail Game (Rubinstein, 1989)**:
     - *Motivation*: Two players must coordinate on playing a Pareto-superior equilibrium, but they receive confirmations of messages with a small probability of failure. The game shows that even with almost certain communication, common knowledge of the message is not achieved, and the players may fail to coordinate. The account must explain why common knowledge is not attained and the implications for rational play.

  c. **Consensus Problem (in distributed systems)**:
     - *Motivation*: In distributed computing, processes must agree on a value (e.g., commit or abort in a transaction) despite failures. The FLP result (Fischer, Lynch, Paterson) shows that consensus is impossible in asynchronous systems with even one crash failure. The account must relate to the necessity of common knowledge (or its absence) for such agreements.

  d. **Battle of the Sexes with Incomplete Information**:
     - *Motivation*: A coordination game where players have private information. The account should show how CKR (or lack thereof) affects the ability to coordinate on an equilibrium.

  ---

  **2. Distinctions it must respect**

  a. **Mutual belief vs. common belief**:
     - *Why*: Mutual belief of degree n (each believes, each believes that each believes, etc., up to n levels) is distinct from common belief (infinite depth). The coordinated attack problem shows that mutual belief of any finite degree is insufficient for coordination, but common knowledge is unattainable. The account must clarify the practical implications of this distinction.

  b. **Knowledge vs. belief of rationality**:
     - *Why*: Knowledge is factive (if an agent knows P, then P is true), while belief is not. In distributed systems, we often have to deal with uncertainty (belief). The account must specify whether we require agents to know (with certainty) that others are rational, or whether belief (with some probability) suffices, and how this affects coordination.

  c. **Common knowledge vs. p-common belief (or approximate common belief)**:
     - *Why*: Monderer and Samet (1989) introduced p-belief and p-common belief, which allows for probabilistic common belief (each believes with at least probability p, etc.). The electronic mail game shows that even with high p, coordination may fail. The account must explain the gap between p-common belief and common knowledge, and when p-common belief is sufficient for coordination.

  d. **Common knowledge vs. common belief (in the doxastic sense)**:
     - *Why*: Common knowledge typically requires that the fact is true and everyone knows it, and so on. Common belief does not require truth. In distributed systems, we often have to deal with beliefs that might be false (e.g., due to faulty components). The account must clarify the role of truth in coordination.

  ---

  **3. Formal results it must accommodate or explain away**

  a. **Agreeing to Disagree (Aumann, 1976)**:
     - *Result*: If two agents have a common prior and their posteriors for an event are common knowledge, then these posteriors must be equal. Hence, they cannot "agree to disagree".
     - *Relevance*: The account must explain how common knowledge of rationality and common priors lead to this result, and what happens when common knowledge is absent (as in the email game).

  b. **No-trade theorems (Milgrom, Stokey, etc.)**:
     - *Result*: If agents have common priors and common knowledge of rationality, then they cannot engage in speculative trade (because they would not trade unless they both believe they are gaining, but common knowledge of rationality and common priors implies they have the same valuation).
     - *Relevance*: This is another application of common knowledge under common priors. The account must be consistent with such results.

  c. **The impossibility of attaining common knowledge in the presence of communication failures (Halpern and Moses, 1990)**:
     - *Result*: Common knowledge cannot be attained or maintained in a system where communication is not guaranteed.
     - *Relevance*: This is central to the coordinated attack problem. The account must respect this impossibility.

  d. **The possibility of coordination with high probability under p-common belief (Monderer and Samet, 1989)**:
     - *Result*: In some games, p-common belief of the game and of rationality (for sufficiently high p) can lead to coordination on an equilibrium.
     - *Relevance*: The account must explain why in the email game, even with high probability of message delivery, coordination fails (because the p-common belief threshold required by the game is not met).

  ---

  **Non-negotiable requirements vs. program-specific commitments**

  **Non-negotiable**:
  1. The account must explain the impossibility of coordination in the coordinated attack problem (due to the impossibility of achieving common knowledge under unreliable communication).
  2. It must respect the distinction between mutual belief (finite depth) and common belief (infinite depth) and explain why mutual belief of finite depth is insufficient for coordination in the coordinated attack problem.
  3. It must be consistent with the formal result that common knowledge is impossible in systems with communication failures (Halpern and Moses).
  4. It must explain the failure of coordination in the electronic mail game (even with high probability of message delivery).

  **Program-specific commitments** (may vary by approach):
  1. The role of common priors: Some accounts (like Aumann's) require common priors, but in distributed systems, we might not assume that. The account may choose to require common priors or not, but must be explicit.
  2. The use of knowledge vs. belief: In distributed systems, we often model with belief (due to uncertainty) rather than knowledge. The account might focus on belief, but must clarify.
  3. The use of probabilistic models (p-common belief) vs. qualitative models (common knowledge): Depending on the application, one might be more suitable.

  **Potential conflicts**:

  There is a tension between:
  - The requirement that the account explain the failure of coordination in the email game (which shows that even with very high probability of successful communication, coordination fails because common knowledge is not achieved) and 
  - The result by Monderer and Samet that p-common belief (for high p) can sometimes support coordination.

  This suggests that the account must carefully delineate the conditions under which p-common belief is sufficient and when it is not. In particular, the email game has a discontinuous payoff structure (a small probability of miscoordination leads to a large loss) so that even a tiny probability of failure breaks coordination. The account must therefore incorporate the game structure and the sensitivity of payoffs to coordination failures.

  Another potential conflict is between the impossibility of common knowledge in the presence of communication failures and the need to achieve coordination in practice (which distributed systems often do with high probability). The account must explain how systems work around the impossibility (e.g., by using timeouts and randomization) and what weaker forms of agreement are achievable.

  ---

  **Summary of Desiderata**:

  The adequate account of CKR must:

  1. **Cover key cases**: 
     - Explain the impossibility of coordinated attack without common knowledge.
     - Explain the failure of coordination in the electronic mail game.
     - Address consensus impossibility (FLP) in asynchronous systems.
     - Explain coordination in Battle of the Sexes with incomplete information.

  2. **Respect key distinctions**:
     - Mutual belief (finite depth) vs. common belief (infinite).
     - Knowledge (factive) vs. belief (non-factive).
     - Common knowledge vs. p-common belief.
     - Common knowledge vs. common belief (truth requirement).

  3. **Accommodate formal results**:
     - Aumann's agreeing to disagree (under common priors and common knowledge).
     - No-trade theorems.
     - Impossibility of common knowledge with unreliable communication (Halpern-Moses).
     - Possibility of coordination under p-common belief (Monderer-Samet).

  4. **Non-negotiable**: 
     - The account must explain the impossibility results (coordinated attack, email game, FLP) and the role of common knowledge (or its absence) in these failures.
     - It must respect the distinction between mutual and common belief.

  5. **Flagged conflicts**: 
     - The tension between the failure of coordination in the email game (even with high p) and the possibility results of Monderer-Samet must be resolved by the account by considering the specific game structure and the required threshold of p for that game.

  By fulfilling these desiderata, the account will be adequate for reasoning about coordination and agreement in distributed systems with unreliable communication.
answer: |-
  Below is a structured specification of desiderata for an adequate account of **common knowledge of rationality (CKR)** in the context of distributed systems with unreliable communication. The criteria are derived from foundational problems, distinctions, and formal results in game theory, distributed computing, and epistemic logic. I emphasize *what* must be delivered and *why*, based on the cases and considerations you highlighted. Requirements are categorized as **non-negotiable** (essential for any account aiming for broad applicability) or **program-specific** (dependent on modeling choices). Potential conflicts are flagged.

  ---

  ### **I. Cases the Account Must Get Right**  
  *These are benchmark problems where CKR’s role is critical. Failure to explain these implies inadequacy.*

  1. **Coordinated Attack Problem**  
     - **Requirement**: The account must explain why coordination fails without common knowledge, even with arbitrary levels of mutual belief.  
     - **Motivation**: Two generals must synchronize an attack, but messages may be lost. It demonstrates that **finite mutual belief** (e.g., "I believe you believe... up to *n* levels") is insufficient for coordination, while common knowledge is unattainable with unreliable channels. Any CKR account must justify why rationality alone cannot compensate for this and what *weaker* epistemic states (e.g., common *p*-belief) permit.  
     - **Non-negotiable**: Yes. This is a cornerstone of distributed systems and epistemic game theory.

  2. **Electronic Mail Game (Rubinstein, 1989)**  
     - **Requirement**: The account must explain why agents fail to coordinate on the Pareto-superior equilibrium despite near-certain communication and high-order mutual belief.  
     - **Motivation**: Players receive probabilistic confirmations of messages, yet CKR is never attained, leading to coordination failure. This shows that **approximations of common knowledge** (e.g., *p*-common belief) do not guarantee rational coordination if the game has discontinuous payoffs. The account must clarify how CKR interacts with payoff structures and belief thresholds.  
     - **Non-negotiable**: Yes. Highlights the gap between probabilistic belief and true common knowledge.

  3. **Consensus with Crash Failures (FLP Impossibility)**  
     - **Requirement**: The account must reconcile why common knowledge is impossible in asynchronous systems with even one failure, per the FLP result.  
     - **Motivation**: Distributed consensus requires agreement without certain communication. FLP proves that **common knowledge of decision states** is unattainable here. CKR must show how rationality affects protocols (e.g., Paxos) that use randomization or fault tolerance to *circumvent* this impossibility.  
     - **Non-negotiable**: Yes. Directly relevant to distributed systems design.

  4. **Battle of the Sexes with Incomplete Information**  
     - **Requirement**: The account must determine when CKR enables coordination on Pareto-superior Nash equilibria despite private information.  
     - **Motivation**: Players prefer different equilibria but gain from coordination. With incomplete information, **mutual knowledge of rationality** may not suffice; common knowledge can break symmetries. The account must specify how CKR resolves ambiguity in equilibrium selection.  
     - **Non-negotiable**: No. This is program-specific (e.g., relevant to epistemic game theory but less critical for distributed agreements).

  ---

  ### **II. Distinctions the Account Must Respect**  
  *These conceptual differences are pivotal; blurring them leads to incorrect predictions.*

  1. **Mutual Belief vs. Common Belief**  
     - **Requirement**: The account must distinguish finite-order mutual belief ("everyone believes that everyone believes... *k* times") from common belief (infinite iteration).  
     - **Motivation**: Coordinated Attack shows mutual belief (of any finite *k*) is insufficient for coordination, while common knowledge is required. CKR must not conflate these, as **finite-depth reasoning is ubiquitous in bounded agents**.  
     - **Non-negotiable**: Yes. A core insight of epistemic logic.

  2. **Knowledge vs. Belief of Rationality**  
     - **Requirement**: The account must specify whether agents *know* (factive, truth-constrained) or *believe* (non-factive, probabilistic) that others are rational.  
     - **Motivation**: In distributed systems, messages may be lost, so **belief** (e.g., "I assign probability 0.9 to your rationality") is often all agents have. Knowledge-based accounts (e.g., Aumann structures) must explain how they handle uncertainty.  
     - **Non-negotiable**: No. This is program-specific; Bayesian models prioritize belief, while logic-based models use knowledge.

  3. **Common Knowledge vs. *p*-Common Belief**  
     - **Requirement**: The account must clarify when *p*-common belief (each agent believes *X* with probability ≥ *p*, and this is iterated) suffices for coordination, and when it does not.  
     - **Motivation**: The Electronic Mail Game shows *p*-common belief (for high *p*) fails to induce coordination if the payoff loss from miscoordination is catastrophic. CKR must **quantify the relationship between *p*, payoffs, and depth of belief**.  
     - **Non-negotiable**: Yes. Critical for systems with probabilistic communication.

  4. **Common Knowledge vs. Common Belief (Doxastic)**  
     - **Requirement**: The account must separate common *knowledge* (requiring truth) from common *belief* (not requiring truth).  
     - **Motivation**: In systems with byzantine faults, agents may have **false beliefs** about rationality. Truth-agnostic accounts (e.g., doxastic logic) must still deliver coordination when beliefs are correct.  
     - **Non-negotiable**: No. Program-specific; depends on fault model.

  ---

  ### **III. Formal Results the Account Must Accommodate or Explain Away**  
  *These theorems constrain viable accounts of CKR.*

  1. **Agreeing to Disagree (Aumann, 1976)**  
     - **Requirement**: Under common priors and common knowledge of posteriors, the account must imply agents cannot agree to disagree.  
     - **Motivation**: Shows **common knowledge enforces consensus** in rational agents with shared priors. In distributed systems, this explains why protocols like Byzantine Agreement require common knowledge of inputs to avoid contradictions.  
     - **Non-negotiable**: Yes. A foundational result; exceptions (e.g., non-common priors) must be explicit.

  2. **No-Trade Theorems (e.g., Milgrom-Stokey)**  
     - **Requirement**: The account must imply that rational agents with common knowledge of rationality and common priors cannot engage in speculative trade.  
     - **Motivation**: Generalizes **CKR’s role in eliminating "agreeing to disagree"** to market contexts. For distributed systems, this aligns with impossibility of arbitrage in decentralized exchanges with CKR.  
     - **Non-negotiable**: No. Program-specific; relevant if economic metaphors are used.

  3. **Impossibility of Common Knowledge with Unreliable Communication (Halpern-Moses, 1990)**  
     - **Requirement**: The account must incorporate that common knowledge is unattainable in systems where communication may fail or be delayed.  
     - **Motivation**: Directly addresses **distributed systems constraints** like Coordinated Attack. CKR must show how rationality operates under this limitation (e.g., via weaker beliefs or fault-tolerant mechanisms).  
     - **Non-negotiable**: Yes. Inescapable for systems with unreliable channels.

  4. **Possibility of Coordination with *p*-Common Belief (Monderer-Samet, 1989)**  
     - **Requirement**: The account must allow that high *p*-common belief can enable coordination in some games (e.g., with continuous payoffs).  
     - **Motivation**: Explains **real-world coordination despite uncertain communication** (e.g., distributed databases converging with high probability). CKR must reconcile this with failures like the Email Game.  
     - **Non-negotiable**: Yes. Balances impossibility results with pragmatic solutions.

  ---

  ### **IV. Non-Negotiable vs. Program-Specific Requirements**  
  - **Non-negotiable**:  
    - Explain **Coordinated Attack** (coordination fails without common knowledge).  
    - Explain **Electronic Mail Game** (high *p*-belief fails under discontinuous payoffs).  
    - Respect **mutual vs. common belief** distinction (finite depth ≠ infinite depth).  
    - Accommodate **Halpern-Moses impossibility** (common knowledge unattainable with unreliable channels).  
    - Accommodate **Agreeing to Disagree** (common knowledge prevents disagreement under common priors).  
    - Accommodate **Monderer-Samet** (high *p*-belief suffices in some cases).  
    *Rationale: These are minimal for handling coordination under uncertainty in distributed systems.*  

  - **Program-Specific Commitments**:  
    - Handling **knowledge vs. belief** of rationality (e.g., Bayesian vs. S5 epistemic logic).  
    - Treatment of **common belief vs. knowledge** (truth requirement).  
    - Relevance of **Battle of the Sexes** (equilibrium selection).  
    - Incorporating **no-trade theorems** (economic rationality).  
    *Rationale: These reflect modeling choices (e.g., probabilistic vs. logic-based frameworks) or application scope (e.g., game theory vs. pure distributed computing).*  

  ---

  ### **V. Potential Conflicts Between Desiderata**  
  - **Conflict 1**: *Common knowledge is impossible in unreliable systems (Halpern-Moses) vs. Coordination often succeeds in practice (e.g., via Paxos)*.  
    - **Suspicion**: These cannot be jointly satisfied without weakening "coordination" (e.g., to probabilistic agreement) or redefining CKR (e.g., as *p*-common belief with fault tolerance).  
  - **Conflict 2**: *Agreeing to Disagree requires common knowledge to enforce consensus vs. Common knowledge is unattainable (Halpern-Moses)*.  
    - **Suspicion**: This implies consensus is impossible without communication guarantees—consistent with FLP but at odds with protocols that use randomness. CKR must clarify how rationality interacts with randomization.  
  - **Conflict 3**: *High *p*-common belief enables coordination (Monderer-Samet) vs. High *p*-belief fails in the Email Game (Rubinstein)*.  
    - **Suspicion**: These are compatible only if the account incorporates **payoff sensitivity** (e.g., *p* must exceed a game-dependent threshold). A unified account must explain why coordination succeeds in some high-*p* cases but not others.  

  ---

  ### **Summary**  
  An adequate account of CKR must:  
  1. **Explain failures** in Coordinated Attack and the Email Game due to the unattainability of common knowledge.  
  2. **Respect epistemic distinctions** (mutual vs. common belief, knowledge vs. belief) and **formal constraints** (Halpern-Moses, Aumann).  
  3. **Clarify when weaker concepts** (e.g., *p*-common belief) suffice for coordination, depending on payoffs and fault models.  
  4. **Resolve conflicts** between impossibility results and practical coordination through explicit boundary conditions (e.g., game payoffs, probabilistic guarantees).  

  This specification prioritizes robustness in distributed systems, where communication uncertainty is inherent. Non-negotiable requirements center on impossibility results and distinctions that directly impact coordination; program-specific elements allow flexibility in formalism. If conflicts arise (e.g., between Halpern-Moses and real-world consensus), the account must explicitly justify its tradeoffs.
