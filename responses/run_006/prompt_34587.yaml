  **Why the amodal rule is superior:**  
  - It cleanly explains **texture/size** ("Yes" as amodal) and **static/dynamic** distinctions (posture/motion are amodal; shape is not).  
  - Rules 2–3 fail to explain why texture/size are "Yes" while shape is "No."  

