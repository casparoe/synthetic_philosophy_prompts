prompt: |-
  You're an expert in both legal philosophy and welfare economics. I'm an economist — welfare economics, public goods, externalities, social choice, mechanism design, repeated games, the works — but I've never actually read the Hart-Devlin debate. Restate the debate about whether the criminal law may enforce morality as such in my vocabulary, as faithfully as you can. I want Devlin's side and Hart's side each rendered as claims about externalities, public goods, social norms (maybe as equilibria?), preferences, welfare, and the boundaries of legitimate state action. Flag every place where you have to fudge the economics to make the legal argument fit, rather than silently smuggling in assumptions.

  Then give me the residue report: which parts translate cleanly, which parts only translate with distortion, and which parts have no counterpart in the welfare-economics vocabulary at all. I especially want to know about Devlin's move that a society is entitled to enforce its constitutive morality and that without it the society would disintegrate — is that expressible as a public-good or coordination claim, or is something else going on? And is Hart's harm principle really equivalent to saying the state should only internalize negative externalities and otherwise stay out of preferences, or is that too quick? For each bit of residue, tell me whether it's a hole in my vocabulary or a sign that the original legal-philosophical claim was less clear than it looks.

  Start by brainstorming the mapping before you commit to it, think carefully, and dont force a translation where there isn't one. No reading lists or citations please — I want the ideas, not the bibliography.
