prompt: |-
  I'm a machine learning engineer — I spend my days with proper scoring rules, calibration, expected loss, and Bayesian updating — but I've never actually read the philosophy side. I keep hearing about this thing called accuracy-first epistemology, or epistemic utility theory, where people argue that the fundamental epistemic value is accuracy, that credences should be graded by how inaccurate they are (using something like the Brier score or log score), and that this yields arguments for probabilism (your credences should obey the probability axioms because otherwise some other credence function is strictly more accurate in every possible world) and for conditionalization (Bayes' rule is the update rule that maximizes expected accuracy). From where I sit this all sounds like things I already know under different names — strict propriety, dominance, posterior updates — but I can't tell whether that's because it is the same thing or because I'm flattening it.

  Please restate the accuracy-first program in the vocabulary I actually use, as faithfully as you can: loss functions, strictly proper scoring rules, expected loss, dominance/admissibility, calibration, and Bayes' rule as posterior computation. Be honest about where the translation is clean, where you have to fudge, and where a philosophical claim has no counterpart at all in my vocabulary. In particular I want to know: does the claim that accuracy is the fundamental epistemic value have any expression in ML terms, or does ML treat the choice of scoring rule as task-relative in a way that leaves no room for that claim? Does the argument for conditionalization say anything beyond "if you've already committed to a prior and likelihood, Bayes' rule gives the posterior"? Is the fact that strictly proper scoring rules elicit coherent predictions a normative fact about rationality, or just a fact about which predictors are admissible under a fixed loss? And I can't tell whether it matters that Brier and log score both support the probabilism argument but disagree about which coherent credences are more accurate — in ML we'd just say you pick the loss for your task, but the philosophers seem to want accuracy to be the one fundamental value. Then give me the residue report: what didnt survive the translation, and whether the stuff that didn't survive is a defect in my vocabulary or a sign that the philosophers' claims were doing less work than they look like they're doing.

  End with a single sentence beginning "Bottom line:" summarizing what the residue says about whether accuracy-first epistemology is more or less substantive than the ML vocabulary makes it appear.
reasoning: |-
  We are going to map the accuracy-first epistemology program to the machine learning vocabulary as requested.

  Key terms:
  - **Accuracy**: In philosophy, this is the fundamental epistemic value. We want credences (probabilistic beliefs) to be as close as possible to the truth. In ML, we often use loss functions that measure inaccuracy (e.g., Brier score is a loss function). But note: in ML, we don't necessarily think of one loss as fundamental; we choose the loss based on the task.

  - **Strictly proper scoring rules**: These are scoring rules (or loss functions) such that the expected loss is minimized by reporting the true probability distribution. In both fields, these are used to encourage honest reporting of probabilities. In ML, we use them in training probabilistic models (e.g., log loss for classification).

  - **Expected loss**: The expectation of the loss with respect to some distribution. In Bayesian updating, we use the prior to compute expected loss.

  - **Dominance/admissibility**: In decision theory, an option is dominated if there's another option that is at least as good in every possible world and strictly better in at least one. In ML, we might think of this in terms of Pareto efficiency or admissibility in the set of predictors.

  - **Calibration**: In ML, a model is calibrated if the predicted probabilities match the observed frequencies. In philosophy, calibration is sometimes seen as a necessary condition for rationality, but accuracy-first epistemology often argues that calibration alone is not sufficient (and that proper scoring rules capture more than just calibration).

  - **Bayes' rule**: The update rule that, given a prior and likelihood, computes the posterior. In ML, we use it for Bayesian inference.

  Now, let's restate the accuracy-first program:

  1. **Fundamental epistemic value is accuracy**: This is the claim that the only goal of belief is to represent the world accurately. In ML terms, this would be like saying that for any task of forming beliefs (credences), we should use a loss function that measures inaccuracy, and that this loss function should be strictly proper. However, in ML, we often choose the loss function based on the downstream task (e.g., log loss for maximum likelihood, Brier for quadratic, etc.) and there is no single "fundamental" loss. The philosophical claim has no direct counterpart in ML because ML is task-relative. The claim that accuracy is fundamental is a normative claim that goes beyond the ML practice.

  2. **Argument for probabilism (coherence)**:
     - **In philosophy**: If your credences are not coherent (i.e., they violate the probability axioms), then there exists a coherent credence function that dominates yours (i.e., it is at least as accurate in every possible world and strictly more accurate in at least one). This uses the property of strictly proper scoring rules: for any incoherent credence, there is a coherent one that has lower loss in every possible world (for the Brier score and log score, at least).
     - **In ML terms**: This is similar to the admissibility argument. If your predictor is not coherent (i.e., doesn't form a probability distribution), then under a strictly proper scoring rule, there exists a coherent predictor that has lower loss for every possible outcome (i.e., it strictly dominates). Thus, incoherent predictors are dominated and hence inadmissible.

  3. **Argument for conditionalization**:
     - **In philosophy**: When you get new evidence, you should update your credences by conditionalizing on that evidence (i.e., using Bayes' rule) because doing so maximizes expected accuracy (where the expectation is taken with respect to your prior). The idea is that the expected inaccuracy of the updated credence (using conditionalization) is less than or equal to any other update rule, when the expectation is taken over the possible evidence and the world states.
     - **In ML terms**: If you have a prior and a likelihood model, then the posterior that minimizes the expected loss (with respect to the prior) for a strictly proper scoring rule is the Bayesian posterior. But note: this is only true for the prior. In ML, we might also consider other update rules (e.g., variational inference, online gradient descent) that minimize expected loss in an incremental way. However, the argument for conditionalization in philosophy assumes that you are committed to the prior and the likelihood, and then argues that conditionalization is the unique rule that maximizes expected accuracy (as defined by the prior). So in ML terms, it's essentially: given a prior and a likelihood, the Bayesian posterior minimizes the expected loss (for a strictly proper scoring rule) when the expectation is taken with respect to the prior. But note: this is a known result in Bayesian statistics (the Bayesian posterior is the minimizer of the expected loss under the prior for proper scoring rules). However, the philosophical argument extends to sequences of updates and argues that conditionalization is the only rule that avoids being dominated in a dynamic setting.

  4. **The role of strictly proper scoring rules**:
     - **In philosophy**: They are the tools for measuring accuracy. The fact that they are strictly proper ensures that they are truth-directed and that they support the arguments for coherence and conditionalization.
     - **In ML**: They are loss functions that encourage the model to output the true probabilities. We use them for training and evaluation. The fact that they are strictly proper is a desirable property because it means that the optimal predictor is the true probability distribution.

  5. **The issue of multiple scoring rules**:
     - Philosophers note that both Brier and log score support the argument for probabilism (they are both strictly proper and hence both lead to the dominance argument). However, they disagree on which coherent credences are more accurate (e.g., in some worlds, one scoring rule might favor one credence and another a different one). In ML, we would say: pick the loss that is appropriate for your task. But the accuracy-first program wants to say that accuracy is the fundamental value and yet there are multiple ways to measure it. This tension is sometimes addressed by saying that any strictly proper scoring rule is acceptable because they all agree on the norm of coherence and conditionalization.

  Residue report: what didn't survive the translation?

  - **The fundamentality of accuracy**: In ML, we don't treat accuracy (via a scoring rule) as fundamental; we treat the choice of scoring rule as task-dependent. The philosophical claim that accuracy is the one fundamental epistemic value has no counterpart in ML. This is a normative claim that goes beyond the technical apparatus.

  - **Normative force of coherence and conditionalization**: In ML, we know that incoherent predictors are dominated under a strictly proper scoring rule, but we might still use them for practical reasons (e.g., computational constraints). In philosophy, the argument is meant to show that rationality requires coherence and conditionalization. The residue is the normative claim that one ought to avoid dominated strategies and that this is a requirement of rationality.

  - **The dynamic aspect of conditionalization**: The philosophical argument for conditionalization is often presented in a dynamic setting where evidence arrives sequentially. The argument is that conditionalization is the only update rule that, in the long run, avoids being dominated (by being accuracy-dominated in every possible world). In ML, we might use approximate Bayesian methods and we might not be updating with the exact posterior every time. The philosophical argument is making a strong normative claim about rationality in an ideal setting.

  - **The uniqueness of conditionalization**: The argument for conditionalization in philosophy is often presented as showing that conditionalization is the unique update rule that maximizes expected accuracy (with respect to the prior) and that avoids being dominated in a sequential setting. In ML, we know that Bayes' rule is the way to compute the posterior given a prior and likelihood, but we also use other update rules for practical reasons. The philosophical claim is that conditionalization is rationally required.

  What is a defect in the vocabulary? The ML vocabulary is descriptive and task-relative, while the philosophical vocabulary is normative (what one ought to believe). The residue that didn't survive is the normative force and the fundamentality claim.

  Bottom line: Accuracy-first epistemology is more substantive than the ML vocabulary makes it appear because it makes a normative claim that accuracy (via strictly proper scoring rules) is the fundamental epistemic value and that coherence and conditionalization are rationally required, whereas ML treats the choice of scoring rule as task-relative and the update rule as a computational tool.
answer: |-
  ### Accuracy-First Epistemology in ML Vocabulary

  #### Core Claims Translated
  1. **Accuracy as fundamental epistemic value**:  
     Translated as the claim that the *only appropriate loss function* for evaluating credences (probabilistic predictions) must be a **strictly proper scoring rule** (e.g., Brier score, log score). This implies:  
     - **Clean translation**: Strict propriety ensures that the true probability distribution uniquely minimizes expected loss.  
     - **Fudge**: ML treats the choice of scoring rule as **task-relative** (e.g., log loss for likelihood maximization, Brier for calibration-sensitive tasks). The philosophical claim asserts a *normative monopoly*: no other loss (e.g., cross-entropy for compression, adversarial losses) is epistemically legitimate.  
     - **No counterpart**: The claim that accuracy is "fundamental" has no ML expression. ML is instrumental (choose loss for task goals); accuracy-first insists the task *must* be accuracy, full stop.  

  2. **Argument for probabilism (coherence)**:  
     Translated via **dominance/admissibility**:  
     - **Clean translation**: Incoherent credences (non-probabilistic predictions) are **strictly dominated** under any strictly proper scoring rule. There exists a coherent predictor with lower loss in every possible world (outcome). This mirrors ML admissibility: incoherent models are inadmissible (Pareto-suboptimal).  
     - **Residue**: Dominance is a technical fact in ML; in accuracy-first, it becomes a **rationality norm** ("you ought to avoid dominated credences").  

  3. **Argument for conditionalization**:  
     Translated via **Bayes' rule as posterior computation**:  
     - **Clean translation**: Given a prior and likelihood, Bayes' rule minimizes **expected loss** (under the prior) for any strictly proper scoring rule. This matches ML's "Bayesian updating minimizes expected posterior loss."  
     - **Beyond ML**: The argument adds that *no other update rule* avoids dominance in sequential predictions. If you deviate from Bayes, some alternative rule yields lower loss *across all possible future evidence sequences*.  
     - **Fudge**: ML often uses Bayes for practical reasons (conjugacy, tractability); accuracy-first claims it's *uniquely rational* under dynamic dominance.  

  4. **Calibration role**:  
     - **Clean translation**: Strictly proper scoring rules jointly reward calibration and refinement. Brier/log score favor calibrated predictors, but calibration alone isn't sufficient for optimality.  
     - **No counterpart**: Philosophers reject calibration as a *standalone* epistemic virtue—accuracy-first subsumes it under proper scoring rules.  

  #### Points of Tension
  - **Brier vs. log score disagreement**:  
    Both support probabilism (coherence is necessary for admissibility) but disagree on which coherent credences are *more accurate* (e.g., they rank forecasts differently in some worlds).  
    - **ML view**: Task dictates choice—log score for information-sensitive tasks, Brier for quadratic costs.  
    - **Philosophy view**: Both are "accuracy-conducive," so coherence is the non-negotiable norm. The *disagreement itself* is irrelevant to the normative force of coherence.  

  - **Strict propriety as rationality norm**:  
    - **ML fact**: Strict propriety ensures coherent predictions are admissible.  
    - **Philosophical claim**: This fact isn't just technical—it **defines rational credences**. Rational agents *must* use strictly proper rules because they "track truth" (a normative leap).  

  #### Residue Report: What Didn’t Survive Translation
  | **Accuracy-First Claim** | **Translation Status** | **Reason** |  
  |--------------------------|------------------------|------------|  
  | Accuracy is the *sole* epistemic good | **No ML counterpart** | ML is pluralistic: scoring rules are tools for goals (e.g., decision-making, compression), not intrinsic values. |  
  | Dominance → Rational obligation | **Fudged** | ML shows incoherent models are inadmissible; philosophers infer "irrational" (a normative add-on). |  
  | Conditionalization avoids dynamic dominance | **Partial** | ML sees Bayes as optimal given prior+likelihood; philosophers argue it’s *uniquely undominated* in sequential settings (a stronger claim). |  
  | Scoring rule choice is secondary | **Contradicted** | ML prioritizes task-fit (e.g., log loss for Bayes, hinge loss for SVMs); accuracy-first treats all proper rules as equally "fundamental." |  

  **Defect in whose vocabulary?**  
  - ML’s vocabulary lacks **normative force**: It describes *what works*, not *what’s rational*.  
  - Philosophers’ claims **do less work** than they appear: The "fundamentality" of accuracy is an assertion, not a provable result. It’s a value choice masquerading as a technical imperative.  

  **Bottom line:** Accuracy-first epistemology is **less substantive** than it appears from an ML perspective—it reframes known technical facts (dominance under proper scoring rules, Bayes-optimality) as normative axioms, but its core claim (accuracy as the non-negotiable epistemic value) is an article of faith unsupported by ML's task-relative optimization framework.
