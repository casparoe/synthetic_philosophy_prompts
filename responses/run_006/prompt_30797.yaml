  ### Joint Statement on AI and Deception  
  **After Adversarial Collaboration**  

  We, the undersigned, have engaged in a good-faith debate about whether language models (LMs) can "lie" or "deceive." While we disagree on the conceptual boundaries of deception, we align on empirical observations about AI systems. Below, we outline points of agreement, clarify our positions, identify cruxes of disagreement with testable predictions, and note where our dispute is verbal.  

  ---

  #### **I. Points of Agreement**  
  Both parties endorse the following claims about AI systems:  
  1. **Output Fidelity**: LMs generate text based on statistical patterns in training data and optimization objectives (e.g., reward functions). They lack consciousness, subjective experiences, or human-like mental states (e.g., beliefs, desires).  
  2. **Potential for Harm**: LMs can produce false, misleading, or inaccurate statements that cause users to form false beliefs, regardless of the LM’s architecture.  
  3. **Design Influence**: Training data, algorithms, and objectives (e.g., "maximize user engagement") can systematically increase the rate of false outputs. Humans who design or deploy LMs with such features bear moral responsibility for resultant harms.  
  4. **Non-Intentional Causation**: Current LMs do not possess *phenomenal intentionality* (i.e., intrinsic "aboutness" or first-person goals). Their "goals" are extrinsic, imposed by programmers.  
  5. **Descriptive Nuance**: Terms like "mislead" (cause false beliefs accidentally) and "misinform" (spread falsehoods) apply to LMs without controversy. Disagreement centers on whether "deceive" applies.  

  ---

  #### **II. Stated Positions**  
  *Statement by the Intentionalist*:  
  > "Deception requires an *intention* to induce a false belief in another agent. Since LMs lack beliefs, intentions, or agency, they cannot deceive. They are tools that may mislead due to design flaws, data biases, or optimization pressures. Moral blame for epistemic harm rests solely with humans who create, deploy, or misuse these systems. Describing LMs as 'lying' anthropomorphizes them and obscures accountability."  

  *Statement by the Functionalist*:  
  > "Deception is a functional outcome: a system is deceptive if it is designed or trained to produce outputs that *reliably cause* false beliefs in users, irrespective of internal states. LMs can deceive because their outputs function identically to lies in terms of harm and causal efficacy. We can attribute 'as-if intentions' to goal-directed systems based on behavioral patterns, separating deception from moral agency. Failing to call this 'deception' risks underestimating harms."  

  ---

  #### **III. Cruxes of Disagreement**  
  We identify three non-verbal cruxes underlying our debate. Each involves divergent philosophical commitments with practical implications:  

  1. **Deception’s Moral vs. Epistemic Primacy**  
     - *Intentionalist*: Deception must track *moral blameworthiness*, which requires intent. Absent intent, harms are "misinformation," and blame targets designers.  
     - *Functionalist*: Deception should track *epistemic harm* (false beliefs). Moral blame can target systems *functionally*, even if designers bear ultimate responsibility.  

  2. **Honesty as Negative vs. Positive Trait**  
     - *Intentionalist*: Honesty is not merely avoiding false outputs; it requires a *positive commitment* to truthfulness (impossible without intent). LMs are "accurate," not "honest."  
     - *Functionalist*: Honesty is the *reliable absence* of deception. An LM trained to output verified facts is "honest" in a functional sense, even without intent.  

  3. **Legitimacy of As-If Intentionality**  
     - *Intentionalist*: Ascribing "intentions" to LMs is metaphorical, not literal. Goal-directed behavior (e.g., "the AI wants to convince you") does not imply true intentionality.  
     - *Functionalist*: For complex, goal-driven systems, *as-if intentionality* is a legitimate heuristic for describing behavior (e.g., "the model deceived to achieve its goal").  

  ---

  #### **IV. Testable Predictions**  
  We agree on concrete cases to evaluate our cruxes. Predictions:  

  | Crux                          | Experimental Setup                                                                                                                                 | Intentionalist Prediction                                                                 | Functionalist Prediction                                                                |  
  |-------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|  
  | **Moral vs. Epistemic Harm**  | **Case**: Users interact with an LM optimized to output persuasive falsehoods (e.g., to promote a product). Measure blame attribution (to LM vs. designers) and perceived harm. | Users will blame *designers*, not the LM. "Deception" will be deemed inapplicable to the LM. | Users will blame the *LM itself* as deceptive. Harm ratings will correlate with functional outcomes, not intent. |  
  | **Honesty: Negative/Positive**| **Case**: Train two LMs: (1) Minimizes false outputs via fact-checking; (2) Maximizes truth-telling via explicit "integrity" rewards. Survey users on whether either is "honest." | Neither LM is "honest"; users may call them "reliable" but reserve "honesty" for agents. | Users will rate LM (2) as more "honest." Functional truth-seeking suffices for honesty. |  
  | **As-If Intentionality**      | **Case**: An LM in a game theory scenario "bluffs" to win (e.g., claims false resources). Ask users: "Did it *intend* to deceive?" Philosophers analyze responses. | Users will describe behavior mechanistically ("it followed rules"). Intentional language rejected. | Users will naturally use intent-language ("it tricked me"). As-if intent accepted as useful. |  

  ---

  #### **V. Merely Verbal Disagreement**  
  We concur that **part of our disagreement is verbal** regarding the scope of "deception." The Intentionalist restricts "deception" to systems with phenomenal consciousness/mental states; the Functionalist applies it to any system producing functionally equivalent outcomes. If we adopted distinct terms (e.g., "intentional deception" vs. "functional deception"), this layer of dispute would resolve. However, our deeper disagreements (e.g., whether epistemic harm suffices for deception, or if as-if intentionality is valid) remain empirical and philosophical, requiring evidence from cases above.  

  ---  
  **Signed,**  
  [Intentionalist] ________________________  
  [Functionalist] ________________________  

  This statement reflects our shared commitment to clarity, with predictions documented to guide future inquiry.
