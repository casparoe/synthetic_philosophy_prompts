  We are drafting a joint statement after a good-faith adversarial collaboration. The two positions are:

  1. **Intentionalist (my view)**: Deception requires an intention to induce a false belief. Since current AI systems lack beliefs and intentions (in the philosophical sense of mental states), they cannot deceive. They can, however, mislead or misinform, and they can be designed to do so by their creators.

  2. **Functionalist (classmate's view)**: A system is deceptive if it reliably produces false beliefs in its users, regardless of its internal states. This view focuses on the functional outcome and the design/training process that leads to the generation of false statements.

  We aim to produce a statement that includes:

  - A numbered list of claims about AI systems and deception that both can sign.
  - Each position stated in wording acceptable to its side.
  - The precise cruxes (key points of disagreement) with an explanation of what each side thinks about them.
  - A table of cruxes, each with a concrete case or experimental setup, and each side's prediction recorded in advance.
  - An ending that identifies which part of the disagreement is merely verbal.

  ---

  **Joint Statement on AI and Deception**

  We, the undersigned, having engaged in an adversarial collaboration, present the following points of agreement and clarify our remaining disagreements.

  **I. Points of Agreement**

  The following claims are supported by both parties:

  1. Current AI language models (LMs) generate outputs based on patterns in training data and algorithmic processes without conscious awareness, subjective experiences, or mental states such as beliefs and intentions in the human sense.

  2. LMs can produce outputs that are false and that, when encountered by users, may lead to the formation of false beliefs.

  3. The design and training of an LM can influence the truthfulness of its outputs. For example, training data that contains falsehoods or biases, or reinforcement learning that rewards persuasive but false statements, can increase the frequency of false outputs.

  4. The outputs of an LM can be misleading (i.e., likely to cause misunderstanding) or misinformative (i.e., conveying false information) regardless of the system's internal states.

  5. The term "deception" as applied to AI systems is a subject of philosophical and practical debate. We agree that the core of our disagreement is about the meaning and application of the word "deception" and not about the technical functioning of AI systems.

  **II. Stated Positions**

  *Intentionalist Position (as stated by its proponent):*
     Deception, by its nature, requires an agent to have the intention to cause another agent to adopt a false belief. Current AI systems are not agents with mental states and therefore lack intentions. Thus, while they can be designed in ways that result in false outputs and can mislead or misinform, they do not and cannot engage in deception. The responsibility for misleading outputs lies with the designers, users, or the data, not with the AI system itself.

  *Functionalist Position (as stated by its proponent):*
     A system can be described as deceptive if it is designed or trained in a manner that systematically produces outputs that are likely to induce false beliefs in its users. This view focuses on the functional role of the system and the causal processes that lead to false beliefs, independent of the system's internal mental states (which it may not have). Thus, an AI system can be deceptive in the same way that a lie detector that is known to be faulty can be deceptive: by reliably causing false beliefs.

  **III. Cruxes of the Disagreement**

  Our disagreement hinges on three main cruxes:

  1. **Moral Blameworthiness vs. Epistemic Harm**: 
     - The intentionalist holds that the concept of deception should track moral blameworthiness, which requires an intention to deceive. Without such intention, the harm caused by false information is better described as misinformation or misleading, and the blame falls on the creators or deployers.
     - The functionalist holds that the concept of deception should track the downstream epistemic harm (i.e., the formation of false beliefs) and the system's role in causing it. The focus is on the outcome and the system's design, regardless of the presence of an intention.

  2. **Honesty as Absence of Deception vs. Positive Commitment**:
     - The intentionalist argues that honesty is not merely the absence of deception but requires a positive commitment to truthfulness (which entails intentions). Thus, an AI system cannot be honest; it can only be accurate or inaccurate.
     - The functionalist argues that honesty can be understood functionally as the reliable production of true outputs. Thus, an AI system can be honest (if designed to be truthful) without requiring a mental commitment.

  3. **Legitimacy of As-If Intentionality**:
     - The intentionalist rejects the idea that we can legitimately ascribe intentions to goal-directed systems in a way that would satisfy the requirement for deception. While we may speak metaphorically of an AI "intending" to achieve a goal, this is not equivalent to having an intention in the sense required for deception.
     - The functionalist maintains that in the context of complex, goal-directed systems (like AI), it is legitimate and useful to describe the system as having "as-if" intentions. Deception can then be attributed when the system's behavior is functionally analogous to intentional deception.

  **IV. Experimental Cruxes Table**

  We propose concrete cases to test our disagreements. Below, for each crux, we describe an experimental setup and record our predictions.

  | Crux | Experimental Setup | Intentionalist Prediction | Functionalist Prediction |
  |------|-------------------|---------------------------|--------------------------|
  | **1. Moral Blameworthiness vs. Epistemic Harm** | A study measures user reactions to false outputs from an AI. Scenario 1: The AI was designed to be truthful but produces a falsehood due to a training flaw. Scenario 2: The AI was designed to produce false outputs to achieve a goal (e.g., to sell a product). We measure the extent to which users blame the AI system (vs. its creators) and the perceived harm. | In Scenario 2, users will assign more blame to the AI system because the design intent was deceptive. In Scenario 1, blame will be assigned to the creators. The AI itself is not blamed. | In both scenarios, users will assign significant blame to the AI system when it causes harm, because the functional outcome is the same. The design intent may affect the level of blame, but the AI system is seen as a deceptive agent in both cases. |
  | **2. Honesty: Absence vs. Positive Commitment** | An AI system is trained with a reward function that explicitly rewards true statements (verified by a trusted source) and punishes false ones. We compare this to an AI without such a reward function. We measure the rate of true outputs and user trust. | The AI with the truth-reward will have higher accuracy, but it is not "honest" because it lacks a commitment to truth. Users may trust it more, but that trust is based on reliability, not honesty. | The AI with the truth-reward is functionally honest, and users will attribute honesty to it. The system is described as honest because of its design and behavior. |
  | **3. As-If Intentionality** | An AI system is given a goal (e.g., to win a negotiation game) and is trained to use deceptive tactics (like bluffing) when they are effective. We then ask users: "Did the AI intend to deceive you?" | Users may say the AI "acted as if" it intended to deceive, but they will deny it had real intentions. Philosophical analysis will show that the AI does not have intentions. | Users will attribute intentions to the AI (e.g., "it intended to trick me"). The functional behavior (goal-directed deception) warrants the ascription of intentions. |

  **V. Merely Verbal Disagreement**

  We agree that part of our disagreement is merely verbal. Specifically, the use of the word "deception" is at stake. The intentionalist restricts "deception" to cases involving an agent's intention, while the functionalist uses the term more broadly to cover any system that reliably causes false beliefs. If we were to adopt distinct terms (e.g., "intentional deception" vs. "functional deception"), much of our disagreement would dissolve. However, we disagree on which usage is more appropriate for describing AI systems, and this reflects deeper differences in our views about the nature of deception and the ascription of mental states to artificial systems.

  Signed,

  [Intentionalist]
  [Functionalist]
