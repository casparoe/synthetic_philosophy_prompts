  However, step (5) is rejected. Step (5) claims that if STP fails, then changing a common consequence must result in a "pure framing effect," implying irrationality or bias. This is incorrect. The reversal of preference is not due to a superficial framing effect but stems from a substantive change in the ambiguity profile of the options when the common consequence is altered. Specifically:

