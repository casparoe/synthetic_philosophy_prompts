  - When yellow pays $100 (as in bets C and D), bet D is unambiguous (known probability of 2/3), while bet C is ambiguous. Thus, D is preferred.

  The change in the common consequence affects the degree of ambiguity associated with each bet. In the first case, the low payoff on yellow makes the unambiguous bet (on red) more attractive. In the second case, the high payoff on yellow makes the unambiguous bet (on black or yellow) more attractive. This behavior is consistent with ambiguity aversion, which can be rational under uncertainty because it reflects a preference for known risks over unknown risks.

  Rejecting step (5) means that the failure of STP does not imply a mere framing effect or irrationality. Instead, it highlights that ambiguity aversion is a coherent response to uncertain probabilities, as recognized in decision theories that accommodate multiple priors (e.g., maxmin expected utility). The cost of rejecting step (5) is that it allows for violations of STP in contexts with ambiguity, but this does not extend to violations in contexts with known probabilities (like the Allais paradox). The Allais violation involves known probabilities and is generally considered a bias, whereas Ellsberg's ambiguity aversion is not necessarily irrational.

