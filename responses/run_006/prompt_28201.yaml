prompt: |-
  I'm running a session for my department's undergraduate philosophy club next week — mostly second- and third-years who've done an epistemology course but haven't read the peer disagreement literature. I've got about forty minutes. Don't explain conciliationism vs. steadfastness to me; I need a plan for how to explain it to them. What has to go first (I'm guessing the notion of an epistemic peer needs careful setup, and maybe the difference between disagreement about facts and disagreement about what the evidence supports), what's the one example or case that should carry the whole session, and what order do the moves need to come in so the debate doesn't just look like two people digging in and refusing to budge? I'm especially worried about misconceptions they'll form — like 'conciliationism means you have to split the difference' or 'steadfastness means you never change your mind at all' or 'this is just about being open-minded vs. stubborn' — and I want to know exactly where in the sequence to head each one off. Also, what should I openly leave out at this level and say so? And give me one question I can ask at the end to check whether they got the structure of the problem rather than just picking a side. Please separate what's settled from what's genuinely contested among people working on this — I don't want to present a live dispute as if there's a consensus where there isn't one.
