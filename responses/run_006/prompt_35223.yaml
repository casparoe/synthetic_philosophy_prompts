  Okay, the user is teaching a grad seminar on moral worth and wants to start by establishing desiderata for a theory of moral worth before diving into the literature. They specifically want to know what makes a theory adequate, with cases motivating each requirement, and to distinguish non-negotiables from debatable ones. They also want to identify conflicts between desiderata and which requirement knocks out the most popular views.

  First, I need to recall the core concept: moral worth is about actions being right for the right reasons, where the agent deserves credit. The user mentioned Huck Finn, right kind of reasons, and overdetermination as must-haves. I should expand beyond those to cover all genuine constraints.

  Key desiderata from literature include:
  - **Right Action Condition**: The action must be objectively right. Cases like Huck Finn show that subjectively wrong actions can still have moral worth, so this might not be non-negotiable. Huck Finn is a counterexample here.
    
  - **Motivational Requirement**: The right reasons must cause the action. The "right kind of reasons" problem illustrates that not just any reason counts. The professor case (acting from duty vs. vanity) shows why this is crucial. This is non-negotiable.

  - **Non-Accidentality**: The connection between reasons and action must be non-accidental. The demon world case (where reasons align by luck) highlights this. Non-negotiable.

  - **Creditworthiness**: The agent deserves praise. The Kantian shopkeeper (honest from self-interest) fails here. Non-negotiable.

  - **Subjective Engagement**: The agent's perspective matters. Huck Finn acts against his conscience but rightly; this challenges internalism. Non-negotiable.

  - **Rational Accessibility**: Reasons must be accessible to the agent. The clueless agent case (right action for wrong reasons) shows why this might be important. But externalists might reject this. Debatable.

  - **Partial Credit**: Mixed motives. The charity donor case (duty and vanity) raises if partial credit is possible. Some theories (Kantian) are strict; others (Aristotelian) allow gradience. Debatable.

  - **Non-Requirement of Explicit Moral Judgment**: Huck Finn didn't deliberate morally but still acted rightly. Cases like Arpaly's generous person show implicit motives can suffice. Debatable.

  Conflicts arise between:
  - **Subjective Engagement vs. Rational Accessibility**: Internalists require reasons to be accessible; externalists don't. Huck Finn's reasons weren't accessible to him, so theories demanding accessibility might exclude such cases.
    
  - **Partial Credit vs. Motivational Requirement**: Mixed motives challenge purity. Kantians might deny worth if non-moral motives are present, while others allow it.

  The bottleneck is **Subjective Engagement**. It conflicts with Rational Accessibility and challenges Kantian views that require duty as the motive. It also impacts partial credit debates. Most theories struggle with cases like Huck Finn, where the agent acts rightly without believing it's right.

  The user wants to highlight conflicts, so emphasizing Subjective Engagement vs. Rational Accessibility is key. Also, noting that Huck Finn is a central case that many theories falter on. The professor case and demon world are classic for Motivational Requirement and Non-Accidentality.

  Non-negotiables: Motivational, Non-Accidentality, Creditworthiness, Subjective Engagement. Debatables: Right Action, Rational Accessibility, Partial Credit, Moral Judgment Requirement.

  The single requirement that does the most work knocking out views is **Subjective Engagement** because it forces theories to accommodate agents like Huck Finn who act rightly without believing so, challenging internalist and Kantian frameworks that tie worth to correct moral beliefs or deliberation.
answer: |-
  Here’s a distilled set of desiderata for a theory of moral worth, designed to frame your seminar’s foundational discussion. I’ve organized them by core requirements, motivating cases, negotiability, and conflicts—with special attention to your requested emphasis areas (Huck Finn, right-kind-of-reasons, overdetermination). The goal is to map the conceptual territory *before* diving into specific theorists.

  ---

  ### **Core Desiderata for a Theory of Moral Worth**
  *(Non-negotiables in bold; negotiables flagged as such)*

  1. **The Motivational Requirement**  
     - **What it demands**: The agent’s action must be *caused by* the morally right reasons (not just correlated with them).  
     - **Motivating case**: The *Professor Case* (from Arpaly/Markovits):  
       - *Professor A* helps a student from genuine concern for their well-being (morally worthy).  
       - *Professor B* helps identically but solely to burnish their reputation (not worthy).  
       - → Shows that identical right acts differ in worth based on *why* they’re done.  
     - **Non-negotiable**: Yes. Any theory that severs the link between motivation and credit fails as a theory of *worth* (as opposed to mere permissibility).

  2. **The Non-Accidentality Requirement**  
     - **What it demands**: The right reasons must non-accidentally cause the right action (i.e., the connection must be robust/reliable).  
     - **Motivating case**: *The Demon World* (inspired by Smith):  
       - An agent acts on motives that *usually* lead to wrong acts (e.g., spite), but a demon intervenes to make the act right this time.  
       - → The act is right but flukishly so; the agent deserves no credit.  
     - **Non-negotiable**: Yes. Without this, lucky right acts could have moral worth.

  3. **Creditworthiness Requirement**  
     - **What it demands**: The agent must *deserve moral praise* for the act, reflecting well on their character or agency.  
     - **Motivating case**: *Kant’s Shopkeeper*:  
       - A shopkeeper charges fairly *only* to avoid bad PR. The act is right, but the agent merits no esteem.  
       - → Contrast with a shopkeeper who charges fairly out of respect for customers.  
     - **Non-negotiable**: Yes. If an act has moral worth, the agent is praiseworthy *for acting as they did*.

  4. **Subjective Engagement Requirement (The "Huck Finn" Problem)**  
     - **What it demands**: Moral worth must be compatible with the agent *lacking correct moral beliefs* (or even acting *against* their conscience).  
     - **Motivating case**: *Huck Finn* (Bennett/Arpaly):  
       - Huck helps Jim escape slavery while believing he’s doing something gravely wrong. His act stems from empathy, not duty.  
       - → Intuition: Huck *deserves credit* despite his false moral view.  
     - **Non-negotiable**: Yes. Theories requiring explicit moral judgment (e.g., some Kantian views) fail here.

  ---

  ### **Negotiable or Contested Desiderata**
  *(Reasonable philosophers might reject these; they often reflect theoretical commitments)*

  5. **The Right Action Condition**  
     - **What it demands**: Only *objectively right* acts can have moral worth.  
     - **Motivating case**: *Ignorant Activist*:  
       - An agent protests a *just* law, motivated by genuine (but misplaced) justice. The act is wrong, but is it worthy?  
       - → Some (e.g., Kantians) say no; others (e.g., virtue ethicists) might say yes if motives are admirable.  
     - **Negotiable**: Yes. Externalists (e.g., consequentialists) often insist on right action; internalists (e.g., some care ethicists) may prioritize good motives independently.

  6. **Rational Accessibility Requirement**  
     - **What it demands**: The right reasons must be *accessible* to the agent (not just exist externally).  
     - **Motivating case**: *The Clueless Agent*:  
       - An agent saves a drowning child *solely* because they like their shoes. Unbeknownst to them, saving the child is also the right thing.  
       - → If the right reason (saving a life) wasn’t motivationally accessible, does the act have worth?  
     - **Negotiable**: Yes. Internalists (e.g., Williams) demand accessibility; externalists (e.g., Parfit) reject this.

  7. **Partial Credit/Overdetermination Requirement**  
     - **What it demands**: Moral worth should accommodate *mixed motives* (e.g., partly right, partly selfish).  
     - **Motivating case**: *The Charity Donor*:  
       - Alice donates to famine relief both out of duty *and* for social clout. Is her act partially worthy?  
       - → Some (e.g., Aristotle-inspired views) allow gradience; others (e.g., purist Kantians) demand "pure" motives.  
     - **Negotiable**: Yes. Theories diverge on whether worth is scalar or threshold-based.

  8. **Non-Requirement of Explicit Moral Judgment**  
     - **What it demands**: Moral worth doesn’t require consciously thinking in moral terms (e.g., "this is my duty").  
     - **Motivating case**: *The Generous Person* (Arpaly):  
       - Someone helps spontaneously out of empathy, without moral deliberation.  
       - → If worth requires explicit judgment (as per some Kantians), this act lacks it.  
     - **Negotiable**: Yes. Kantians may insist on duty-recognition; sentimentalists reject this.

  ---

  ### **Key Conflicts Between Desiderata**
  Two pairs create tension; satisfying one often undermines the other:

  - **Subjective Engagement (Huck) vs. Rational Accessibility**:  
    - *Conflict*: Huck’s reasons (empathy) aren’t "accessible" to him *as moral reasons*—he rejects morality. A theory requiring rational accessibility (e.g., internalism) must deny Huck credit or reinterpret his motives.  
    - *Theoretical fault line*: Internalism (reasons must be agent-accessible) clashes with externalist realism (reasons exist independently).

  - **Partial Credit vs. Motivational Requirement**:  
    - *Conflict*: If moral worth requires being motivated *only* by the right reasons (pure motives), mixed-motive acts can never have full worth. But if worth is scalar (allowing partial credit), the "right reasons" aren’t solely causal.  
    - *Fault line*: Kantian purism vs. Aristotelian scalar virtue.

  ---

  ### **The Bottleneck Desideratum: Subjective Engagement (Huck Finn)**
  **Why it’s the bottleneck**: This requirement eliminates *more major theories* than any other:  
  - **Kantian views** (e.g., Herman, Hill): Often demand acting *from duty* or recognizing the moral law. Huck’s lack of moral belief (and anti-moral action) sinks them.  
  - **Simple internalism**: If reasons must be accessible/endorsed by the agent, Huck’s act (done *against* his endorsed reasons) can’t have worth.  
  - **Intellectualist views**: Theories tying worth to moral knowledge (e.g., some Socratic accounts) fail here.  

  **Theories it spares**: Sentimentalism (Arpaly), externalist realism (Markovits), and virtue ethics—all can credit Huck by decoupling worth from belief or deliberation.  

  ---

  ### **Teaching Takeaways**
  - **Non-negotiables (1–4)**: Any adequate theory must explain why Huck deserves credit, why the Professor’s vanity undermines worth, why demon-world acts lack worth, and why credit implies praiseworthiness. These define the *concept* of moral worth.  
  - **Negotiables (5–8)**: These are where debates get juicy (e.g., "Must the act be right?" "Can selfish motives 'taint' worth?"). Flag these as theory-dependent.  
  - **Huck Finn as the pivot**: Start your seminar with this case. If students agree Huck deserves credit, they’ve already accepted a desideratum that rules out strict Kantianism/internalism—forcing engagement with alternatives (Arpaly, Markovits).  

  This framework should equip your class to dissect theories critically: *Which desiderata does Kant prioritize? How does Arpaly handle overdetermination?* Let me know if you’d like the abbreviated "starter kit" for Day 1!
