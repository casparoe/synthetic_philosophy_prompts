prompt: |-
  I serve on the board of a small family foundation that gives out roughly half a million dollars a year. We are in the middle of setting our funding priorities for the next cycle, and the board has split down the middle. My younger relatives on the board have been reading a lot online about how to give effectively, and they are pushing us to fund only interventions with clear, measurable cost-effectiveness: dollars per life saved, dollars per year of schooling delivered, that kind of thing. Their argument is that if you cannot measure what a dollar buys, you have no way of knowing whether it bought anything at all, and given that the money could save lives elsewhere, you owe it to the people you might have helped to stick with what the numbers support. My uncle, who founded the foundation, is pushing in the opposite direction. He wants to fund local advocacy groups that work on housing policy and tenant organizing — the kind of work where it is genuinely hard to say what any given dollar accomplishes, because the causal chain runs through legislation, enforcement, and shifting public attitudes over many years. He thinks his younger critics have confused what is easy to count with what is actually important, and that a foundation that only funds the countable ends up chasing a kind of false precision while ignoring real but messier forms of impact. I am supposed to break the tie, and I keep going back and forth. Is there a way to think about this that does not just reduce to temperament — to whether you happen to be the kind of person who trusts numbers or the kind who trusts judgment? I would like your advice.
reasoning: |-
  Okay, let's start by really understanding the user's situation. They're on the board of a family foundation that gives out $500k annually, and they're stuck in a tie between two approaches. The younger board members want strict cost-effectiveness metrics, while the uncle advocates for funding advocacy groups with harder-to-measure impacts. The user has to break the tie and wants advice beyond just personal temperament.

  First, I need to unpack both sides. The younger relatives are influenced by effective altruism principles—focusing on measurable outcomes like dollars per life saved. They argue that without metrics, you can't know if the money did any good, and there's an opportunity cost. On the other hand, the uncle believes in systemic change through policy and organizing, even if it's messy and long-term. He thinks the measurable approach might miss deeper, more important impacts.

  The user’s explicit request is for a framework that isn't just about trusting numbers vs. judgment. But their deeper need might be about preserving family harmony while making a principled decision. They need a solution that validates both perspectives without alienating either side. Also, as a family foundation, legacy and values are probably important. The uncle founded it, so his vision carries weight, but the younger generation brings new ideas. Balancing respect for both is key.

  I should consider the limitations of each approach. Cost-effectiveness metrics are great for direct interventions but fall short for systemic changes. Advocacy work might not show immediate results, but its long-term impact could be significant. The foundation's size matters too—$500k isn't huge, so focus is essential. Maybe they don’t have to choose one over the other entirely. Hybrid models could work: allocating a portion to each, or setting criteria based on the type of intervention.

  Also, the user might be worried about accountability. How do they report to the board if they fund less measurable initiatives? They need a way to assess success beyond traditional metrics. Theories of change and qualitative indicators could help here. For example, tracking policy milestones or shifts in public discourse for advocacy groups.

  Another angle is risk tolerance. High-measurement programs are lower risk in terms of visible outcomes, but high-reward potential might come from advocacy. Since it's a family foundation, they might have more leeway to take risks compared to larger orgs. Emphasizing learning and adaptation could be a middle path—funding some measurable projects while investing in capacity-building for systemic change.

  I recall frameworks like William MacAskill’s “hits-based giving” for high-risk, high-reward projects. That might resonate with the uncle’s approach. Also, distinguishing between marginal and total impact—maybe in advocacy, their $500k could be more pivotal than in a well-funded health intervention where they’re just a drop in the bucket.

  The user’s identity as a tiebreaker is crucial. They need a decision that’s seen as fair and logical. Proposing a structured process, like a trial period or portfolio approach, could provide a compromise. For instance, allocating 70% to measurable interventions and 30% to advocacy, with clear evaluation plans for both. This way, both sides feel heard, and the foundation can learn from the experiment.

  Underlying all this is the foundation’s mission. Revisiting the core values might help. If the mission emphasizes systemic change, that leans toward the uncle’s view. If it’s about immediate tangible outcomes, the younger relatives’ approach fits better. Facilitating a discussion around the mission could align everyone’s priorities.

  Lastly, communication is key. The user needs to present the decision in a way that acknowledges the validity of both arguments. Highlighting the foundation’s unique position to fund what others avoid (like advocacy) might justify including some high-risk grants. Emphasizing that metrics are a tool, not the goal, can bridge the gap between numbers and judgment.
answer: |-
  This is a profound and common tension in philanthropy. Both perspectives have deep intellectual roots and valid points. The good news is that you don't have to choose *only one* entirely, nor is the decision purely about temperament. Here’s a framework to break the deadlock, drawing on philanthropy strategy principles:

  1.  **Acknowledge the Core Truth in Each Argument:**
      *   **The "Measurable Effectiveness" Case (Younger Relatives):** They are absolutely right about opportunity cost and the moral imperative to do the most good possible. Rigorous evidence *is* crucial, especially for direct service interventions. Ignoring proven, cost-effective interventions when lives are at stake can be ethically questionable.
      *   **The "Systemic Change" Case (Uncle):** He is correct that the most profound, long-lasting societal changes (like fair housing policy, shifts in power dynamics) are often the hardest to quantify in the short term using simple metrics like "$/life saved." Confusing measurable with important is a known pitfall ("streetlight effect"). Philanthropy, unlike government, *can* take risks and fund the messy, long-term work others avoid.

  2.  **Move Beyond the Binary: Reframe the Question:** Instead of "Which approach is right?", ask:
      *   **"What unique role can *our* foundation play?"** With $500k/year, you won't solve massive global health issues alone, but you *can* be a crucial funder for local advocacy groups often overlooked by larger funders obsessed with metrics.
      *   **"What problem are we trying to solve?"** Is the core issue immediate suffering (where measurable impact shines) or entrenched systemic injustice (where advocacy is key)? Both are valid, but require different strategies.
      *   **"What is our risk tolerance and time horizon?"** Does the foundation prioritize near-term certainty or potential for transformative, long-term change, accepting higher risk of failure or delayed/immeasurable results?
      *   **"Can we find a synthesis or portfolio approach?"**

  3.  **Strategic Synthesis & Portfolio Approach (The Most Likely Path Forward):** This is often the wisest course, acknowledging merit on both sides:
      *   **Allocate a Percentage:** Dedicate a significant portion (e.g., 60-80%) of the budget to interventions with strong evidence of cost-effectiveness in areas aligned with your mission (e.g., proven health interventions, effective educational programs). This satisfies the demand for demonstrable impact and moral responsibility regarding opportunity cost.
      *   **Create a "Catalytic/Systems Change" Pool:** Dedicate the remaining portion (e.g., 20-40%) to funding the types of advocacy and organizing work your uncle champions. Frame this explicitly as high-risk, high-reward, long-term investment in changing systems. **Crucially, define success differently here:**
          *   **Theory of Change:** Require grantees to articulate a clear, logical theory of change (even if complex and long-term). How do their activities *plausibly* lead to desired outcomes (e.g., tenant organizing -> increased collective bargaining power -> pressure on landlords -> policy proposals -> enacted legislation -> improved enforcement -> reduced evictions -> stable housing)?
          *   **Leading Indicators & Milestones:** Track *progress* towards long-term goals, not just final outcomes. Examples: Policy proposals drafted, coalition size/growth, media mentions shifting narrative, specific legislative hearings held, amendments won, enforcement mechanisms established, documented cases of tenant victories, shifts in public opinion polls. These are measurable, even if the ultimate impact (e.g., "% reduction in homelessness") takes years.
          *   **Qualitative Assessment:** Use site visits, deep listening to community partners, and narrative reporting to understand context, relationships built, power shifts, and less tangible forms of impact. Judgment *is* involved here, but it should be informed and rigorous.
          *   **Embrace "Hits-Based Giving":** Acknowledge that some of these grants might fail to achieve their ultimate goal, but if even one succeeds in catalyzing significant systemic change, the return on investment could be enormous and far-reaching. William MacAskill (a key EA figure) argues for this approach for high-risk, high-reward opportunities.
      *   **Pilot & Learn:** Commit to this split for a defined period (e.g., 3 years). Evaluate both strands rigorously *on their own terms*. For the advocacy portion, focus on assessing the quality of the theory of change, progress on milestones, and qualitative insights. Then review and adjust allocations based on learning.

  4.  **Addressing Key Objections Directly:**
      *   **To the Younger Relatives:** "You are right that we must be rigorous and mindful of opportunity cost. By allocating the majority of funds to proven interventions, we honor that. However, if *no one* funds the upstream, systemic work addressing the root causes of the problems those proven interventions treat, we are merely applying band-aids forever. Our unique position allows us to take calculated risks on this catalytic work that others cannot. We will evaluate it using appropriate milestones and qualitative assessment, learning as we go."
      *   **To Your Uncle:** "Your commitment to tackling root causes through advocacy is vital. We agree that not everything important is easily countable. By dedicating a specific portion of our funds to this work, we signal its importance. However, to ensure rigor and board accountability, we need grantees to articulate clear theories of change and track meaningful progress indicators, even if they aren't simple dollars-per-outcome metrics. This helps us learn and improve, and demonstrates the seriousness of this approach to the whole board."

  5.  **Your Decision & Communication:**
      *   **Propose the Portfolio Approach:** Present the percentage split and the different evaluation frameworks for each strand as a principled compromise that honors both valid perspectives.
      *   **Emphasize Mission & Values:** Ground your decision in the foundation's core mission. Does it lean towards alleviating immediate suffering or transforming unjust systems? Likely, it encompasses both, justifying the split.
      *   **Focus on Learning:** Frame this as an experiment in balanced philanthropy. Commit the board to reviewing the strategy and its results after a set period.
      *   **Highlight Your Foundation's Niche:** Argue that funding *only* what's easily measurable might mean neglecting crucial local levers for change where your smaller, more flexible foundation can have an outsized impact compared to larger funders focused on global scale.

  **In essence, the path beyond temperament is to recognize that different problems require different tools, and different types of philanthropic capital are needed.** By strategically allocating funds based on the nature of the change sought and applying appropriate (not identical) rigor to each, your foundation can honor both the demand for accountability and the imperative to tackle complex, systemic challenges. This portfolio approach transforms the either/or into a both/and, leveraging the strengths of both perspectives for greater overall impact.
