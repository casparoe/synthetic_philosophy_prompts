  ok so for my philosophy class i'm writing about bertrand's paradox and the principle of indifference, and i'm trying to figure out what i actually think. like, what's your credence that the principle of indifference can be salvaged — that there's some way of stating it that doesn't fall apart when you hit bertrand-type cases where the same ignorance seems to give different probabilities depending on how you parameterise the problem? i don't just want a number, i want you to decompose it. what sub-questions does your credence depend on, what rough probability do you give each, and how do they combine? and which term are you least confident about — what evidence or argument would move it the most? also please seperate what's actually settled among people who know this stuff from what's still genuinely contested, cos my teacher will definitely notice if i present a disputed view as the consensus.
