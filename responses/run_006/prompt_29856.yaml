  For the flickers question, I need to press on whether minor alternatives (like neural twitches) satisfy PAP's requirement for *morally relevant* alternatives. The follow-up must challenge if such trivial differences can ground responsibility. Maybe invoke Kane's "dual rational capacities" to raise the stakes.

