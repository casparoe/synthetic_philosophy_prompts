prompt: |-
  I host a small grad-student interview series and next week's guest is a philosopher who's spent years arguing that Frankfurt-style cases dont actually refute the principle of alternative possibilities — that moral responsibility still requires some real ability to do otherwise. Draft eight to ten interview questions that push past the basic Black-and-Jones setup. I want at least one question each on: whether the flickers left over in a Frankfurt case (a different twitch, a different neural sign, the agent deciding on his own) are robust enough to do the work PAP needs; the dilemma-style objection that Frankfurt cases either build determinism into the intervener's trigger or leave the agent an alternative after all, with a follow-up keyed to his likely reply about how the trigger is supposed to relate causally to the decision; and whether a parallel case works for omissions, where the thing the agent couldn't do is something he fails to do. For each of these, write the follow-up you'd ask if he gives his standard answer. End with one question about what would actually change his mind — what case or argument would make him give up PAP. No warm-up questions.
