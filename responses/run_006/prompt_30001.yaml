  The user's main questions are: Is there an epistemic defect beyond just different sources, and how should that inform their response? They want to know if providing more evidence is futile. 

  Looking at social epistemology, thinkers like Goldman and Fricker come to mind. Testimonial injustice might be relevant here—the brother systematically distrusts mainstream sources, deeming them unreliable without evaluating content. Then there's echo chambers and epistemic bubbles, as Nguyen describes. The brother's community acts as an echo chamber where trust is manipulated, making contrary evidence seem untrustworthy. 

  Also, confirmation bias and belief perseverance play roles. The community's narrative is self-sealing; any challenge reinforces their beliefs. The brother's accusation that the user is in a closed loop is projection, a common defense mechanism. 

  The user needs strategies. Continuing to present evidence might backfire. Instead, building trust and asking questions that prompt self-reflection could be more effective. The Socratic method or street epistemology might help the brother examine his own epistemic processes without confrontation. 

