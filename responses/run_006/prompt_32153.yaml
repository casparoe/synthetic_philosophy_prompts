  So I just spent like two hours arguing with a friend about virtue ethics and the situationist critique and we got basically nowhere. She's convinced the Doris and Harman line kills off any serious role for character traits in ethics, and I kept saying the virtue ethicists have replies to that stuff — the CAPS model, the idea that virtues are local not global, the threshold view, all of it. We couldn't even agree on what the disagreement was actually about by the end.

  What I'd love is for you to draft the joint statement that a committed virtue ethicist and a committed situationist critic could both sign after a good-faith adversarial collaboration. The situationist says the empirical evidence (Milgram, Darley and Batson, the dime-in-the-phone-booth studies, etc.) shows that the kind of robust cross-situationally consistent character traits virtue ethics needs either don't exist or are too rare to do the normative work. The virtue ethicist says the critique either overstates the evidence, or targets a straw-man conception of character that no sophisticated virtue ethicist actually holds, or both. I want the agreed claims first, then the precise residual disagreements phrased so each side would accept the wording of their own view, then the cruxes — the sub-questions that, if settled, would actually move at least one side — and for each crux, what kind of evidence or argument both sides would agree bears on it. And if part of the dispute turns out to be verbal, I want that flagged explicitly.

  Please write it all as continuous prose, no headings, no bullet points, no bold, no tables — just the way you'd write an email. And keep it honest: if you think one side's got the better of it on a particular point, don't pretend otherwise, but still give the other side the wording they'd accept.
