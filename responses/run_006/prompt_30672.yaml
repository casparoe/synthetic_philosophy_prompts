prompt: |-
  I've been following the back-and-forth between effective altruists and their critics for years now, and it feels like the same arguements have just been circulating since earning to give got big in the early 2010s. The EA side says: if you can take a high-paying job and donate a large chunk to cost-effective charities, that does more good than working directly at a nonprofit, and refusing because it feels gross is just letting measurability bias work in reverse. The critics say: that treats existing economic institutions as a neutral machine you can extract money from, ignores how your job props up the very structures that cause the poverty you're donating to fix, and the obsession with measureable outcomes quietly redefines doing good as doing what's easiest to count. Nobody seems to deny the core facts about which charities are cost-effective or what these jobs pay. So what kind of disagreement is this, actually? Is it a hidden empirical disagreement about how much harm a career causes, a moral disagreement about whether you're obligated to maximize or just do your fair share, or a disagreement about what counts as evidence in the first place? My working theory is that it's mostly about where the burden of proof sits for institutional harm, not about charity effectiveness. Diagnose the structure of the impasse, and tell me what would actually move it, or whether it's the kind of debate where the two sides can't be moved by the same considerations.
reasoning: |-
  Okay, the user has been following the EA debates for years and notices a stalemate. They want to understand the nature of the disagreement beyond surface arguments. They mention the core points from both sides: EA's focus on earning to give versus critics' concerns about systemic harm and measurability bias. The user suspects it's about the burden of proof regarding institutional harm.

  First, I need to unpack the layers of the disagreement. The user points out both sides agree on facts like charity effectiveness and job salaries. So the conflict isn't empirical but deeper. The user's hypothesis about burden of proof seems key. Let me verify that.

  EA emphasizes measurable outcomes and quantifiable impact. Critics argue that systemic harm isn't easily measurable. This ties into different epistemologies—quantitative vs. qualitative evidence. EA might dismiss systemic critiques as vague, while critics see EA's metrics as missing the big picture.

  Then there's the moral dimension. Utilitarianism vs. deontology. EA's obligation to maximize good contrasts with critics' view that individuals shouldn't complicit in harmful systems. Also, fairness: is earning to give supererogatory or a duty? Critics might see it as overreach.

  Institutional complicity is another layer. How do we assess harm caused by one's job? EA might view roles as neutral, critics see them as perpetuating systems. The burden of proof here is crucial. EA requires evidence of harm, critics argue that systemic issues are inherently hard to prove, so precaution is needed.

  The user's working theory aligns with this. The impasse persists because each side demands different evidence. To move forward, they'd need common ground on what counts as valid proof. But their epistemic differences make that tough. Maybe shifting focus to systemic solutions within EA or addressing complicity more directly could help. But fundamentally, the debate might be intractable due to divergent core values.
answer: |-
  This is an exceptionally sharp diagnosis of a core EA debate impasse. You're right that the surface facts (charity effectiveness, salaries) aren't disputed, yet the disagreement persists because it operates on **multiple, interconnected, and fundamentally different levels.** Your "burden of proof" theory is a crucial piece, but it's part of a larger structure. Here's a breakdown:

  1.  **The Layers of Disagreement:**
      *   **Epistemological (What Counts as Evidence/Knowledge):**
          *   **EA:** Prioritizes *quantifiable, measurable, counterfactual impact*. RCTs, DALYs/QALYs saved, cost-effectiveness ratios are the gold standard. Systemic harm is often dismissed as "unfalsifiable," "vague," or "speculative" without rigorous models and data.
          *   **Critics:** Prioritizes *structural analysis, historical context, and qualitative understanding*. They argue that the most significant harms (and benefits) often arise from complex systems, power dynamics, and institutional roles that *cannot* be easily quantified or isolated. Demanding RCT-level evidence for systemic critique is seen as rigging the game in favor of quantifiable interventions. The "reverse measurability bias" you mention is key here – EA is accused of ignoring harms precisely *because* they are hard to measure.
          *   **Burden of Proof:** This is where your theory hits hard. **EA implicitly places the burden of proof on critics to *quantify* the net harm of specific jobs/institutions *to a degree comparable to GiveWell-style charity evidence*.** Critics argue this burden is impossible/unfair to meet for systemic phenomena and that *precaution* should apply – if a job plausibly props up harmful systems, the burden should shift to the individual to prove it *doesn't* cause net harm, or at least that the donation outweighs it.

      *   **Moral/Philosophical (What Constitutes "Good" and Obligation):**
          *   **Consequentialism vs. Deontology/Virtue Ethics:** EA is deeply rooted in *consequentialism* (maximize good outcomes). Critics often draw on *deontology* (duties, rules – e.g., "don't be complicit in injustice") or *virtue ethics* (integrity, character – e.g., "don't do work that feels 'gross' even if it funds good").
          *   **Maximization vs. Fair Share/Sufficiency:** EA emphasizes *maximizing* impact, implying a strong obligation to do the *most* good possible. Critics often advocate for a "fair share" or "sufficiency" approach – doing *enough* good without needing to optimize every life decision, potentially allowing room for other values (integrity, non-complicity, personal life).
          *   **Complicity:** This is central. Critics see taking a job in finance, certain tech sectors, or fossil fuels as *actively participating in and legitimizing* harmful systems. EA often views these roles as *neutral tools* – the harm exists independently, and the individual is merely extracting resources *from* the system to redirect towards good. The disagreement hinges on whether the individual *shares moral responsibility* for the system's outputs by working within it.

      *   **Empirical (But Hidden in Complexity):**
          *   **Net Harm Calculation:** While agreeing on *some* facts, there's deep disagreement about **how to calculate the *counterfactual net impact* of taking a specific high-paying job.**
              *   **Marginal Impact:** Does *you* taking this job actually change the system's harmful output? Or would someone else do it just as badly (or worse) if you refused? (EA leans towards "replaceability" minimizing individual harm).
              *   **Systemic Effects:** Does your participation *strengthen, legitimize, or enable* the harmful system in ways beyond your immediate output? (Critics focus here).
              *   **Leverage/Change:** Could working *within* the system enable you to reform it more effectively than donating from outside? Or does it co-opt you? (Arguments go both ways).
          *   **Measuring the Unmeasurable:** The core empirical impasse is about **whether the harms critics point to (reinforcing inequality, enabling exploitation, environmental damage via specific industries) can be reliably quantified *and* attributed to an individual's role *in a way that allows direct comparison against measurable donations*.** Critics say no, this is the wrong frame. EA often says without that quantification, the critique is operationally useless for decision-making.

  2.  **The Structure of the Impasse:**
      *   **Talking Past Each Other:** EA uses the language of quantifiable outcomes and counterfactuals. Critics use the language of systems, power, complicity, and values. These frameworks often lack common metrics for comparison.
      *   **Different Axioms:** The disagreement stems from foundational differences in what counts as valid knowledge (quantifiable data vs. structural analysis) and core moral priorities (maximizing aggregate welfare vs. avoiding complicity/pursuing justice as a virtue).
      *   **The Burden of Proof Trap:** This is the engine of the stalemate, as you identified. EA demands quantifiable proof of net harm that meets their evidential standards. Critics see this demand as both impossible to satisfy for systemic critique and itself a reflection of an ideological bias towards the measurable. Neither side accepts the other's standard of proof.
      *   **Motivated Reasoning:** Both sides can be susceptible. EAs are motivated to defend a strategy that offers clear, high-impact pathways. Critics are motivated to condemn systems they see as fundamentally unjust and roles they perceive as morally compromised.

  3.  **Can the Impasse Be Moved? What Might Move It?**
      *   **Not Easily by "Same Considerations":** It's unlikely pure quantitative evidence will sway critics focused on complicity, and pure moral appeals about complicity won't sway EAs demanding counterfactual impact evidence. They operate on different planes.
      *   **Possible Avenues for Movement:**
          *   **Reframing Complicity Quantitatively:** Serious attempts *within EA* to model systemic harms and complicity (e.g., work on moral weights, institutional corruption indices, integrating sociological critiques into impact assessments). If EA develops tools to *quantitatively* (or even robustly qualitatively) assess systemic harm/complicity risk of careers *alongside* donation potential, it could bridge the gap. This moves the burden of proof *within* the EA framework.
          *   **Highlighting EA Work on Systemic Change:** Emphasizing EA efforts focused on policy, institutional reform, movement building, and cause areas where systemic change *is* the measurable intervention (e.g., AI governance, biosecurity policy, animal welfare legislation) can address the "only Band-Aids" critique and offer high-impact paths avoiding "dirty" jobs.
          *   **Acknowledging Limits of Quantification:** EAs incorporating explicit caveats about the limitations of their metrics, acknowledging the *possibility* of unquantified systemic harms, and adopting more precautionary principles when harm seems plausible (even if unquantifiable) could build trust. This subtly shifts the burden.
          *   **Focusing on "Least Harm/Most Good" Roles:** Moving the debate *away* from the most controversial sectors (e.g., high-frequency trading, fossil fuels) towards high-paying roles with clearer positive externalities or lower complicity risk (e.g., certain types of tech, medicine, green energy) while still enabling large donations.
          *   **Exploring "Integrity" as a Factor:** EAs taking seriously the *personal cost* and potential burnout/inauthenticity of "earning to give" in harmful-feeling jobs, recognizing that sustained impact requires personal sustainability. This addresses the "feels gross" point not just as bias, but as a real psychological factor.
          *   **Critics Engaging with Counterfactuals:** Critics rigorously engaging with the EA counterfactual challenge – not just asserting harm, but grappling with marginal effects, replaceability, and whether their proposed alternative (e.g., lower-paid non-profit work) demonstrably *reduces* systemic harm more than the donation-funded intervention.

  **Conclusion:** You are correct that the **burden of proof regarding institutional harm and complicity** is the central pivot of the stalemate. EA sets a high bar for evidence of harm that critics argue is inappropriate for systemic critique, creating a fundamental impasse. This burden is underpinned by deeper epistemological (what counts as evidence) and moral (consequentialism vs. complicity/maximization vs. sufficiency) disagreements.

  Moving the debate requires either:
  1.  **Internal EA Evolution:** Developing methodologies to integrate systemic harm/complicity assessment into the quantitative framework, thereby meeting their *own* burden of proof standard for these factors.
  2.  **Reframing & Compromise:** Finding common ground on less controversial career paths, acknowledging the limits of quantification, and valuing integrity/sustainability alongside pure impact.
  3.  **Shifting Focus:** Highlighting high-impact EA pathways that directly target systemic change, bypassing the "dirty job" dilemma.

  True resolution is unlikely, as the differences are foundational. However, the debate *can* become less polarized and more productive through efforts to genuinely engage with the other side's core concerns within their own frame of reference, as you've done by pinpointing the burden of proof as the key sticking point.
