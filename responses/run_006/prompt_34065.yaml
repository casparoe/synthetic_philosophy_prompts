answer: |-
  Here’s a draft adversarial collaboration document between a **Strong Longtermist (SL)** and a **Neartermist (NT)**, designed to clarify agreements, pinpoint substantive disagreements, identify cruxes, and reduce talking points. This reflects contested debates among experts, avoids caricatures, and flags verbal disputes.

  ---

  ### **Adversarial Collaboration: Longtermism vs. Neartermism in Effective Altruism**  
  *Jointly drafted by representatives of SL and NT positions, moderated by a neutral party.*  

  ---

  ### **1. Substantive Agreements**  
  *Both sides endorse the following:*  
  1. **Impartiality**: All sentient beings (present and future) deserve moral consideration, irrespective of temporal or spatial distance.  
  2. **Expected Value (EV) as a Tool**: EV reasoning is *formally* useful for comparing interventions under uncertainty, though we dispute its practical scope.  
  3. **Existential Risk (x-risk) Significance**: Human extinction or permanent civilizational collapse would be a profound moral tragedy, warranting serious attention.  
  4. **Epistemic Humility**: Predictions about complex, long-horizon futures are inherently uncertain and subject to systematic biases (e.g., scope neglect, overconfidence).  
  5. **Population Ethics Complexity**: Adding happy lives to the future can be good *in principle*, but aggregative frameworks (e.g., total utilitarianism) face unresolved paradoxes (e.g., repugnant conclusion).  
  6. **Cause Prioritization Necessity**: Resources should be directed toward interventions with the highest marginal impact, given limited resources.  
  7. **Focus on Trajectory**: Humanity’s near-term actions could durably shape the long-term future (e.g., via values, institutions, or technology lock-in).  
  8. **Suffering Matters**: Reducing intense, involuntary suffering is a high moral priority.  
  9. **Evidence-Based Pragmatism**: Interventions should be grounded in empirical evidence where possible and updated as new information arrives.  
  10. **Avoiding Parochialism**: We should not arbitrarily discount interests based on species, nationality, or temporal location.  

  ---

  ### **2. Disagreements Table**  
  | **Neutral Statement of Disagreement** | **Strong Longtermist (SL) View** | **Neartermist (NT) View** |
  |--------------------------------------|----------------------------------|----------------------------|
  | **EV Weighting Over Long Horizons** | The expected value of influencing the far future (e.g., >100–1000 years) dominates near-term effects due to the vast number of potential future beings. Small reductions in x-risk or improvements in trajectory have astronomically high EV. | EV calculations over millennia are too epistemically fragile to guide action. Models rely on speculative chains of compounding assumptions where errors dominate. Near-term effects (e.g., helping current generations) offer more robust EV estimates. |
  | **Tractability of Long-Term Influence** | Humanity’s trajectory is "plastic" now but will likely lock in within centuries. We can durably alter this trajectory via targeted interventions (e.g., AI alignment, institutional reform) with measurable near-term proxies. | Influence over the far future is intractable: interventions lack clear feedback loops, causal pathways are opaque, and unintended consequences dominate. Near-term work (e.g., health, poverty) has proven causal models and immediate impact. |
  | **Moral Weight of the Far Future** | Future beings possess full moral weight. A small probability of affecting *trillions* of future lives outweighs near-certain benefits to billions alive today. | Future beings’ interests are discounted by practical uncertainty and their dependence on our actions. Near-term beings have stronger moral claims due to concrete needs and our ability to act effectively. |
  | **Discount Rates** | Pure time discounting is ethically indefensible. We should use low/zero discount rates for welfare over time. | Low/zero discount rates ignore empirical uncertainty, opportunity costs, and dynamic change. A higher "epistemic discount rate" is necessary for decisions. |
  | **Priority of X-Risk Reduction** | X-risk reduction is the overwhelming priority. Even tiny reductions in extinction risk have higher EV than all near-term causes combined. | While x-risk is important, its EV is not *demonstrably* higher than top near-term causes (e.g., pandemic prevention, economic development) given uncertainty. Near-term efforts often synergize with resilience. |

  ---

  ### **3. Cruxes: Hinge Questions for the Dispute**  
  *If resolved, these would shift confidence meaningfully.*  

  #### **Crux 1: Persistence of Value Lock-In**  
  - **Question**: Will key values, institutions, or technologies become "locked in" within 100–500 years, making the far future highly sensitive to near-term actions?  
  - **Shared Evidence**: Historical analyses of value persistence, models of tech governance (e.g., AI), institutional stability studies.  
  - **SL Prediction**: Lock-in is likely (e.g., via AI, space governance) and amplifies the value of early influence.  
  - **NT Prediction**: Lock-in is overblown; values/tech evolve unpredictably, and later intervention remains possible.  

  #### **Crux 2: Forecasting Track Record**  
  - **Question**: Can experts reliably forecast second-order effects and value changes over 100+ years?  
  - **Shared Evidence**: Meta-analyses of long-range forecasting (e.g., Tetlock’s work), studies of tech adoption/social change.  
  - **SL Prediction**: We can identify robust "hinge points" (e.g., AI, biotech) with predictable long-range effects.  
  - **NT Prediction**: Forecasts beyond 20–50 years perform near chance; we lack validated models.  

  #### **Crux 3: Shape of the Long-Term Future**  
  - **Question**: Is the future likely to contain vast amounts of value (e.g., >10^20 lives) or be "semi-dormant" (e.g., due to collapse, stagnation)?  
  - **Shared Evidence**: Astrobiological models, economic/societal collapse studies, Fermi paradox analyses.  
  - **SL Prediction**: A thriving, expansive future is plausible and dominates EV calculations.  
  - **NT Prediction**: Semi-dormant futures (or value saturation) are plausible enough to undermine EV dominance claims.  

  #### **Crux 4: Moral Uncertainty Resolution**  
  - **Question**: Under moral uncertainty, how should we weight aggregative vs. person-affecting views?  
  - **Shared Evidence**: Philosophical work on moral uncertainty (e.g., MacAskill, Greaves), decision theory.  
  - **SL Prediction**: Aggregative views (e.g., total utilitarianism) are most compelling, making future lives paramount.  
  - **NT Prediction**: Person-affecting views or threshold-based ethics better handle population paradoxes, raising the bar for far-future claims.  

  ---

  ### **4. Verbal Disputes & Clarifications**  
  - **"Expected Value"**: SL uses EV as a formal tool for comparing *all* actions. NT agrees formally but rejects its practical application to extreme low-probability/high-impact claims.  
  - **"Long-Term" vs. "Far Future"**: SL focuses on the *far future* (≥1000 years). NT uses "long-term" more broadly (e.g., 10–100 years).  
  - **"Priority"**: NT argues SL’s focus on x-risk *crowds out* high-impact near-term work. SL argues x-risk *subsumes* near-term priorities due to EV dominance.  
  - **"Tractability"**: SL defines it as "ability to durably alter trajectory." NT defines it as "ability to measure marginal impact."  

  ---

  ### **Settled vs. Contested Views**  
  - **Settled**:  
    - X-risks deserve significant resources (both agree).  
    - Near-term suffering reduction is valuable (both agree).  
    - Pure time discounting is ethically dubious (both agree).  
  - **Contested**:  
    - **EV dominance of far future**: SL asserts this as core; NT rejects its actionability.  
    - **Lock-in plasticity**: SL sees a brief window; NT sees continuous adaptability.  
    - **Moral weight of potential beings**: SL grants full weight; NT discounts for contingency.  

  ---

  **Conclusion**: This document reveals that disagreements center on **epistemology** (can we model the far future?), **axiology** (how to weigh potential vs. actual beings?), and **pragmatics** (where can we best apply effort?). Resolving cruxes around forecasting, lock-in, and future value density could narrow the gap. Both sides reject caricatures: SL is not "ignoring present suffering," and NT is not "myopic." The core divide is whether far-future EV claims are robust enough to override near-term impact.  

  ---  
  *Authored with input from SL (e.g., Ord, Bostrom) and NT (e.g., MacAskill, Gabriel) perspectives. Disagreements reflect live academic debates.*
