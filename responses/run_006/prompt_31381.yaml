  *scribbles mentally* The key is distinguishing ideals from practical enforcement. The oath sets the aspiration: aim for truth. Perjury law deals with culpability: we only punish when you deliberately sabotage that aim. It's like how we expect drivers to avoid accidents but only ticket them for reckless behavior, not unavoidable mistakes. 

