prompt: |-
  Long-time reader of LessWrong and the EA forum here, so I know the standard back-and-forth and I'm not looking for an intro. Over the years I've come around to the measurability-bias version of the institutional critique of EA, and I want to stress-test it properly. My view, roughly: the machinery EA uses to pick causes — cost-effectiveness estimates, expected-value calcuations, RCT-heavy evidence standards, the hits-based-giving ethos, the whole spreadsheet mindset — acts as a filter. It doesn't just measure which interventions do good; it selects for interventions whose good effects are legible in a particular way: near-term, countable, attributable to a specific actor, and expressible as a number. That means the movement systematically underweights work that's diffuse, slow, structural, or aimed at preventing things that haven't happened yet, and then mistakes the filter for neutral rigor. Not a claim that the numbers are wrong in individual cases; a claim about what the aggregate selection process does to the portfolio.

  What would actually count against this? I want the defeaters, not the talking points. Specifically: what real-world patterns in EA's actual grantmaking or cause-prioritization over the last decade would make me update away from the measurability story — and which of those patterns have already shown up? What would the funding landscape have to look like for the neutral-instruments story to beat the filter story? Are there arguments that the selection effect is much weaker than it looks, because the same apparatus also gets used to justify the weird stuff, so the filter is less directional than I'm claiming? Which parts of the view are almost certainly true but trivial, and which part is the load-bearing controversial bit? And has this critique insulated itself — if EA funds a bunch of unmeasurable stuff, do I just call it an exception rather than a falsification — and if it has, is that a problem for a structural thesis of this kind, or is it just what you'd expect? I'd like the defeaters ordered from the ones that would actually make me drop the view down to the ones that would only make me add a caveat, and I'd want to know which of them a committed measurability-bias person would concede count against them rather than dismiss. If the honest conclusion is that the view is mostly insulated and that's fine, say so.

  And please, no headings, no bullets, no bold, no tables — just continuous prose, like an email. I don't mind length.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a long-time reader of LessWrong and EA Forum, so they're deeply familiar with the concepts. Their main concern is the measurability bias in EA's cause prioritization. They believe EA's methods favor interventions with legible, quantifiable outcomes, potentially neglecting diffuse or structural work. They want to stress-test this view by identifying strong defeaters.

  First, I need to recall the institutional critique they're referencing. The core idea is that EA's reliance on cost-effectiveness estimates, RCTs, and spreadsheets creates a filter for certain types of interventions. The user isn't questioning individual analyses but the systemic selection effect on the portfolio.

  The user is asking for real-world patterns in EA's grantmaking that would falsify their view. They want defeaters ordered by strength, from those that would make them drop the view to mere caveats. Also, they want to know if the critique is insulated from counterevidence.

  I should consider counterexamples where EA funds unmeasurable causes. For instance, long-termist areas like AI safety or biosecurity. These involve high uncertainty and lack immediate metrics. If EA consistently funds such areas, does that weaken the measurability bias argument? But the user might argue that even here, EA tries to quantify impact, like via GCR reduction frameworks. So maybe it's a partial defeater but not a full one.

  Another angle: EA's support for policy advocacy or movement building. These are inherently hard to measure, yet EA orgs like Open Phil fund them. But is the funding substantial compared to measurable areas? If policy work is a significant portion, that could challenge the bias. However, the critique might counter that such efforts are still evaluated through proxies and indirect metrics, not truly escaping the filter.

  The user mentions hits-based giving as part of the problem. But if EA funds high-risk, low-measurability projects under this ethos, does that mitigate the bias? For example, grants for speculative tech or community building. The key is whether these are exceptions or core to EA's strategy. If they're central, it weakens the filter argument. But if they're a small fraction, the critique holds.

  Also, the evolution of EA's priorities over time. If early EA focused on deworming (highly measurable) but now allocates more to AI governance (less measurable), that could indicate adaptation. Historical data from Open Phil's grant databases might show this trend. But again, how are these less measurable areas justified? Often through expected value calculations, which still rely on quantification attempts.

  The user is concerned about insulated critiques. If EA funds unmeasurable work, calling it an exception rather than falsification is problematic. To avoid this, defeaters must be cases where the funding is substantial, sustained, and not framed as exceptions. For example, if long-termist work becomes the majority of EA funding without relying on short-term metrics, that's a strong defeater.

  Another potential defeater: EA's self-correction. If there's explicit recognition of measurability bias and structural changes to address it (e.g., dedicated funds for hard-to-measure causes), that could count. But the user might see this as reinforcing the critique if such measures are marginal.

  The strongest defeater would be evidence that EA's portfolio has significant, growing investment in areas with no clear metrics, driven by the same analytical tools. If cost-effectiveness models are used to justify inherently unquantifiable work, it shows the tools aren't just selecting for measurability. For instance, using EV calculations for AI alignment despite vast uncertainties.

  Weaker defeaters might include high-profile grants to unmeasurable causes, but if these are rare or symbolic, they don't challenge the systemic bias. The user would need data on funding allocations over time, comparing measurable vs. unmeasurable categories.

  Also, considering if the selection effect is weaker because EA funds both GiveWell-style charities and long-termist projects. But the critique might argue that within each area, the measurable sub-projects get prioritized. So the burden is on showing that within long-termism, the least measurable efforts receive substantial support without quantification attempts.

  The load-bearing part of the critique is the systematic undervaluation relative to what's actually optimal, not just the presence of a filter. If EA's funding choices lead to missed opportunities in structural change, that's the core claim. Defeaters must show EA isn't missing those opportunities or that their methods adequately capture such work.

  In conclusion, the strongest defeater is a demonstrable shift in EA's portfolio towards structurally-focused, long-term work funded at scale without reliance on short-term metrics. Historical trends from major funders like Open Phil showing increasing grants to policy, movement building, or speculative research without demanding RCTs or immediate impact data would support this. If such areas constitute a large, growing share funded through EA's standard processes, the measurability bias is less dominant. But if these remain a small fraction or are still subjected to quantification, the critique holds.
answer: |-
  Let me engage with your stress-test directly. You've articulated the measurability-bias critique with precision—focusing on the systemic selection effect of EA's epistemic toolkit on its cause portfolio, not individual miscalculations. The core load-bearing claim is that this toolkit *systematically* undervalues interventions with diffuse, structural, or long-term payoffs *relative to their true social value*, and that this undervaluation is mistaken for rigor rather than recognized as bias. The controversial bit isn't that the toolkit selects *for* measurability (that's almost tautological), but that this selection meaningfully distorts EA's *overall* allocation away from optimality by excluding high-value but illegible work. The trivial part is acknowledging the filter exists; the substantive claim is that it meaningfully warps the portfolio.

  Here are defeaters ordered by strength, from "would force dropping the view" to "would merely add caveats," including which patterns exist and how a committed proponent might respond:

  1.  **Strongest Defeater: Dominant Funding for Inherently Unmeasurable Causes.** If the majority of EA capital (say, >60% of major grantmakers like Open Philanthropy) flowed toward causes where *by their nature* near-term, attributable, quantifiable impact is impossible—and crucially, if this funding was justified *using the standard EA toolkit itself* as the *most* cost-effective option despite its illegibility. **Real-World Pattern:** Long-termism (AI safety, biosecurity, nuclear security, far-future trajectory change) now commands a large share (likely 40-60%+) of Open Phil's annual giving and significant SFF/FTX-recovery funds. These areas involve massive uncertainty, no attributable near-term metrics, and structural/indirect change mechanisms. EA's quantitative tools (expected value calculations, models of existential risk reduction) are *used* to justify these grants *precisely because* they attempt to grapple with the illegibility, arguing the stakes overwhelm measurement difficulties. **Why it Counts:** It directly challenges the claim that the toolkit *systematically undervalues* illegible work. It suggests the toolkit can be bent toward justifying the "weird stuff" as the highest expected value, even without traditional measurability. **Proponent Response:** Concedes this weakens the *universality* of the bias but argues: (a) Within long-termism, selection *still* favors more legible sub-projects (e.g., technical AI safety research with publishable benchmarks over movement-building or institutional reform); (b) The EV calculations used are often criticized as "inside-view" models masking vast uncertainty, potentially replicating the bias at a meta-level by favoring modelable uncertainties over truly unknown unknowns; (c) This funding emerged partly *because* of explicit recognition of the bias (e.g., critiques like yours), acting as a corrective rather than proving the toolkit neutral.

  2.  **Strong Defeater: Systematic Investment in "Infrastructure" with No Direct Attribution.** Significant, sustained funding for ecosystem/movement-building, epistemic infrastructure, or field-building where impact is diffuse, long-term, and impossible to attribute to specific grants—and where this funding is *not* framed as exceptional "hits-based" moonshots but as core, necessary work justified by the toolkit. **Real-World Pattern:** EA funds have supported meta-orgs (CEA, Rethink Priorities), university groups (EA Fellowships), community building, and platforms (EA Forum, LessWrong moderation). Open Phil funds policy advocacy and think tanks (e.g., in AI governance, animal welfare) where impact attribution is notoriously fuzzy. **Why it Counts:** If these grants form a substantial, stable portion of the portfolio and are defended using EA reasoning (e.g., "field growth multipliers," "building robust institutions improves long-term decision-making"), it counters the claim that EA *only* funds attributable interventions. **Proponent Response:** Notes that such funding often faces higher scrutiny, requires "narratives" alongside numbers, and is frequently a smaller fraction than direct interventions. Argues that attempts to quantify "leverage" or "capacity building" often impose a pseudo-measurability that still undervalues truly structural work compared to direct service. Concedes it's evidence *against* the strongest forms of the critique but shows the toolkit struggles to evaluate this work well.

  3.  **Moderate Defeater: Adoption of Explicit Correctives for the Bias.** If EA institutions publicly acknowledge the measurability bias as a major risk and implement structural changes (dedicated funds, altered evaluation criteria, senior hires focused on illegible causes) that demonstrably shift significant resources toward historically neglected areas. **Real-World Pattern:** The Long-Term Future Fund explicitly targets high-risk, illegible work. Open Phil's "Worldview Diversification" program and some SFF/FTX-recovery grants fund speculative, structural, or policy work partly in response to critiques like this. **Why it Counts:** It shows the EA ecosystem is capable of self-correction, using its own analytical capacity to identify and mitigate the bias. The critique becomes less a description of an immutable flaw and more a successful intervention. **Proponent Response:** Welcomes this but argues: (a) Correctives are often siloed, underfunded, or reliant on idiosyncratic leadership ("hit-based institution-building"); (b) The core funding apparatus (e.g., GiveWell top charities, major cause area models) remains dominated by the measurable; (c) It proves the critique's diagnosis was correct, as the need for special programs acknowledges the main system's failure.

  4.  **Weaker Defeater: High-Profile Examples of "Unmeasurable" Work Funded.** Pointing to specific large grants for structural change, policy, or long-term prevention that seem to defy the bias. **Real-World Pattern:** Grants for pandemic preparedness infrastructure, AI governance initiatives, anti-nuclear-war policy advocacy, or foundational research in complex fields. **Why it Counts:** Shows the toolkit isn't *incapable* of funding such things and that "hits-based giving" can encompass illegible work. **Proponent Response:** Readily concedes exceptions exist, especially under the "hits-based" banner. Argues these are the *exceptions proving the rule*: they stand out precisely because they bypass the standard measurable filter. Doesn't challenge the systemic selection effect on the *bulk* of funding decisions or the pressure to justify even these grants with quantifiable models where possible.

  5.  **Weakest Defeater: Internal Discourse Critiquing the Bias.** If EA thinkers vigorously debate measurability bias, publish papers on its dangers, and incorporate caveats into guidelines. **Real-World Pattern:** This exists extensively (Bostrom, Yudkowsky, critiques on the Forum, discussions in EA leadership). **Why it Counts:** Shows awareness and reduces the "mistaken for neutral rigor" part. **Proponent Response:** Concedes awareness exists but argues operational practices and incentive structures for researchers/grantmakers (pressure for clear metrics, defensible CEA, publishable results) still overwhelmingly favor the measurable, making the discourse insufficient to counteract the systemic bias.

  **Is the Critique Insulated?** Yes, partly, but this is inherent to structural critiques. A proponent can always argue: a) A funded "unmeasurable" project is still an exception within a measurable framework (e.g., justified by an EV model); b) It's underfunded *relative to its true value*; c) It required special pleading to bypass the standard filter. This isn't necessarily fatal, as the claim is about *systematic* undervaluation and *aggregate* portfolio distortion, not that *zero* unmeasurable work gets funded. **However, the rise of long-termism (#1) is the strongest potential falsifier.** If long-termism, funded via EA reasoning despite its illegibility, becomes the *dominant, stable* mode of EA giving and demonstrably crowds out measurable global health/poverty work *because* the toolkit shows it's higher expected value, it severely undermines the critique. It suggests the toolkit, while imperfect, *can* prioritize the illegible when the stakes are high enough. The current reality is mixed: long-termism *is* dominant in some major funds, but the measurable bias arguably persists *within* long-termism and in other cause areas. The sheer scale of long-termist funding is the single biggest piece of evidence against the strongest version of your critique.

  **The Honest Conclusion:** Your view identifies a real, powerful selection effect inherent in EA's core methodology. Its strongest form—that this bias *cripplingly distorts* the entire portfolio away from optimality—is challenged, but not yet falsified, by the significant funding shift towards long-termism, which relies on extending EA tools to handle illegibility. The critique is somewhat insulated, but major institutional shifts towards funding illegible structure-building *using the standard toolkit* would weaken it substantially. A committed proponent would concede #1 (long-termist funding) as a major countervailing force requiring nuance, likely retreating to arguing the bias persists *within* cause areas or that the tools handle illegibility poorly, rather than claiming EA only funds the measurable. They wouldn't drop the view entirely based on current evidence, but would acknowledge the landscape is more complex than a simple "filter = only deworming" caricature. The load-bearing claim remaining is that *even with long-termism*, the toolkit undervalues *specific kinds* of diffuse, structural, or preventive work *relative to their true importance* because of its inherent quantitative tilt. Stress-test that specific claim next.

  Let me know which part of this you want to pressure-test further.
