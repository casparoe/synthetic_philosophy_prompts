  ### Decision Tree: Simulation Argument and Fanaticism about the Far Future

  **Instructions:**  
  Answer each question based on your views. Proceed down the branch corresponding to your answer. The tree will assign you to one of six positions, each with a brief statement of its most awkward commitment. Definitions:  
  - *Fanaticism*: The view that long-run consequences dominate near-term effects due to the astronomical expected number of future beings.  
  - *Simulation argument*: The trilemma that (i) civilizations rarely survive to run ancestor simulations, (ii) posthuman civilizations rarely choose to run them, or (iii) we are almost certainly in a simulation.  

  ---

  #### Branch Nodes:
  1. **Concrete Case 1 (Global Priorities):**  
     A foundation must choose between:  
     - Program A: Saves 10,000 lives now via global health interventions.  
     - Program B: Lowers human extinction risk by 0.01% via asteroid deflection.  
     *Does the simulation argument significantly reduce the expected value of Program B relative to Program A?*  
     - **Yes** → Go to Node 2.  
     - **No** → Go to Node 3.  

  2. **Moral Significance:**  
     *Do simulated minds (including ours, if we are simulated) have the same moral weight as non-simulated minds in base reality?*  
     - **Yes** → Go to Node 4.  
     - **No** → **Leaf: Simulation Dampening** (Position 1).  

  3. **Probability of Simulation:**  
     *Do you assign ≥10% probability to us living in a simulation?*  
     - **Yes** → Go to Node 5.  
     - **No** → **Leaf: Fanaticism Survives** (Position 2).  

  4. **Influence Scope:**  
     *If we are in a simulation, which future(s) can our actions influence?*  
     - **Only the far future of base reality** → **Leaf: Redirected Fanaticism** (Position 3).  
     - **Only the far future of our world (within the simulation)** → Go to Node 6.  
     - **Both futures** or **Neither future** → Go to Node 7.  

  5. **Concrete Case 2 (Simulation Termination):**  
     *Suppose simulators terminate simulations at the onset of space colonization. Would this policy substantially reduce the expected value of preventing near-term human extinction (e.g., via Program B)?*  
     - **Yes** → Go to Node 7.  
     - **No** → Go to Node 6.  

  6. **Future Population Scale:**  
     *Under the simulation hypothesis, is the expected number of future beings (across all simulations and base reality) larger than under no-simulation assumptions?*  
     - **Yes** → **Leaf: Simulation-Strengthened Fanaticism** (Position 4).  
     - **No** → **Leaf: Fanaticism Survives** (Position 2).  

  7. **Uncertainty Handling:**  
     *Does the simulation argument make expected-value calculations for the far future too unreliable to guide decisions?*  
     - **Yes** → **Leaf: Near-Term Moderation** (Position 5).  
     - **No** → **Leaf: Simulation Dampening** (Position 1).  

  ---

  #### Leaves (Positions):  
  1. **Simulation Dampening**  
     - *Most awkward commitment*: You must accept that interventions targeting the far future (e.g., reducing extinction risk) could be orders of magnitude less valuable than they appear, even if simulated lives are real.  
     - *Reached via*: Node 2 → "No", Node 4 → "Only base reality" / "Neither" / "Both", or Node 7 → "No".  

  2. **Fanaticism Survives**  
     - *Most awkward commitment*: You must deny that the simulation argument alters the core case for prioritizing the far future, treating it as just another speculative risk.  
     - *Reached via*: Node 3 → "No" or Node 6 → "No".  

  3. **Redirected Fanaticism**  
     - *Most awkward commitment*: You must prioritize acausal influence on base reality (e.g., inspiring simulators) over preventing extinction in your own world.  
     - *Reached via*: Node 4 → "Only base reality".  

  4. **Simulation-Strengthened Fanaticism**  
     - *Most awkward commitment*: You must affirm that the far future could be even larger (and more morally pressing) if simulations multiply the number of beings.  
     - *Reached via*: Node 5 → "No" and Node 6 → "Yes", or Node 6 → "Yes" directly.  

  5. **Near-Term Moderation**  
     - *Most awkward commitment*: You must reject fanaticism’s core tenet by favoring near-term welfare (e.g., Program A) due to unquantifiable simulation-related uncertainty.  
     - *Reached via*: Node 5 → "Yes" and Node 7 → "Yes", or Node 7 → "Yes" directly.  

  6. **Unoccupied Combination**  
     - *Diagnosis*: The path where Node 4 → "Both" and Node 5 → "No" is unexplored; no major position defends that simulated and base minds have equal weight, yet only base reality’s future is expandable.  

  ---

  #### Notes:  
  - **Separation Failure**: The tree cannot distinguish between *Fanaticism Survives* (Position 2) and *Simulation-Strengthened Fanaticism* (Position 4) for students who answer Node 5 → "No" and Node 6 → "Yes" *without* passing through Node 4. This is because both positions treat simulations as enlarging the future but disagree on whether this strengthens fanaticism—a normative gap the tree’s descriptive questions cannot resolve.  
  - **Tree Logic**: Combines concrete cases (Nodes 1, 5) and key distinctions (a–e) to cover all five target positions. The unoccupied combination reflects a gap in existing debates. Total: 7 nodes, 6 leaves.
