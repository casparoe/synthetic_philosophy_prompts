prompt: |-
  I chair the compensation committee of a worker-owned software cooperative. Our founding rule divides the entire surplus equally among worker-members, and members treat that rule as central to what the cooperative is. Yesterday a senior engineer told us that a former client has offered her a six-month outside consulting contract, on her own time, at a fee roughly equal to her annual cooperative share; she wants to keep the fee for herself, and if we refuse, she says she will resign and take the work. Some members say the equal-share rule exists precisely to stop members from converting the cooperative's standing, and their own reputations, into private income, and that an exception would quietly create two classes of member. Others say the fee arises from a voluntary transaction between her and the client, that she is entitled to the proceeds of her own abilities, and that forcing her to pool the fee — or making her choose between the cooperative and the work — is exactly the kind of interference with free exchange that Nozick's Wilt Chamberlain argument warns against. I spent last evening arguing a version of this with a friend, and I came away less sure of my position than when I started. Please draft the short decision memo I will circulate before Thursday's meeting. Put the recommendation in the first paragraph, and make it a concrete course of action — deny the exception, grant it as a one-off, or adopt a general policy with specified conditions — with a time frame. The memo should face the underlying question directly — whether an inequality produced by voluntary transfer can be unjust, and whether preserving the equal-share pattern is worth the interference — rather than treating this as only a personnel matter, and it should engage the strongest consideration on the losing side seriously rather than dismissing it. After the memo, add a table with these columns: 'Consideration', 'Pulls toward', 'Weight', and 'How the memo handles it'. In each row, give a consideration for or against an exception, the option it supports, how heavily it should weigh, and how the recommendation addresses or accommodates it.
reasoning: |-
  Okay, the user chairs a compensation committee in a worker-owned software cooperative. They're dealing with a tricky situation where a senior engineer has been offered a lucrative outside consulting contract. The engineer wants to keep the fee for herself, threatening to resign if forced to share it. The user needs a decision memo that addresses the core philosophical tension: whether voluntary transactions that create inequality can be unjust, and whether enforcing equality is worth restricting individual freedom. 

  Hmm, the user's underlying struggle seems to be balancing ideological purity with practical realities. They've clearly wrestled with the Nozick vs. Rawls dilemma all night. The memo must honor both the cooperative's founding ethos and the engineer's autonomy while preventing factionalism. 

  The key tensions I see: 
  1) **Sacred rule vs. human reality**: That equal-share rule is their social contract's cornerstone. But demanding 100% compliance might backfire if talented members bolt. 
  2) **Precedent fear**: Granting exceptions could create class divisions - exactly what the co-op exists to avoid. 
  3) **Nozick's ghost**: That Chamberlain analogy is haunting them. Forcing redistribution *does* feel like violating consent. 

  ...But the counterpoint is sharper here than in Nozick's hypothetical. This engineer leveraged co-op-built reputation and client relationships. It's not pure individual merit. 

  For the recommendation: A one-time exception with conditions feels like splitting the baby, but it's the only workable solution. Time-bound (6 months), with full disclosure and mandatory reinvestment. Why? 
  - **Practical**: Prevents losing a key member abruptly. 
  - **Philosophical**: Acknowledges her effort but ties windfalls to collective good. 
  - **Structural**: Sets clear boundaries - this isn't a loophole but a pressure valve. 

  The table should explicitly name the fears: "Risk of resentment" vs. "Risk of talent drain." Weighting "preserving founding ethos" as heaviest makes their priorities clear. 

  Biggest challenge: Framing "voluntary inequality" as unstable in a cooperative context without sounding dogmatic. Must emphasize that client relationships are co-op property, not individual - that's the justice argument.
answer: |-
  ## MEMORANDUM  
  **To:** Compensation Committee & General Membership  
  **From:** [Your Name], Compensation Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on External Contract Request & Foundational Principles  

  ### RECOMMENDATION
  **Deny the individual exception** to our equal-surplus-share rule for the senior engineer's proposed external consulting contract, effective immediately. The fee generated from this client relationship must be treated as cooperative income and pooled for equal distribution. We will simultaneously **initiate a 30-day review period** to develop a general policy for external work, with draft principles presented at the November meeting. The engineer retains the choice to accept the contract by resigning, or decline it and remain.  

  ### ANALYSIS: EQUALITY, VOLUNTARY TRANSFERS, AND COOPERATIVE IDENTITY
  This request forces us to confront whether voluntary transactions creating inequality can be unjust within our cooperative, and whether preserving our equal-share pattern justifies limiting such transactions. Our founding rule—pooling *all* surplus—is not merely administrative; it embodies our rejection of capital extracting individual labor value and our belief that collective reputation and infrastructure enable individual success.  

  1.  **The Threat to Cooperative Integrity:** Granting an exception prioritizes individual gain from a relationship built on cooperative standing. The client sought this engineer *because* she is part of our respected cooperative. Allowing private capture of this value creates a privileged class: members with portable reputations or client relationships. This erodes trust, incentivizes members to hoard opportunities, and fundamentally divides us into capital-like owners (of personal client lists) and labor. The injustice lies not in her earning power, but in leveraging *our collective capital* for private gain.  

  2.  **Engaging Nozick's Challenge:** The Chamberlain argument rightly warns against continuous interference to maintain patterns. However, cooperatives *are* voluntary associations built on specific shared rules—our "pattern" *is* the point. Joining means agreeing to pool surplus; this is the initial just arrangement. Enforcing it isn't arbitrary interference, but upholding the mutually chosen terms. Resigning to take the work *is* the individual's freedom under this system, preserving both voluntary association and the pattern. The "interference" exists only if she wishes to bypass the rules *while* retaining membership benefits.  

  3.  **The Strongest Counterargument (Seriously Considered):** The most compelling case for an exception is that prohibiting this work, or forcing pooling, feels like an unjust taking of the engineer's personal skill and time. It risks losing a valued member and her future contributions over a transaction seemingly external. This deserves weight: her talent is real, and her departure would hurt. **Accommodation:** While the rule must hold, our rapid policy review acknowledges this concern. We will explore frameworks (e.g., capped earnings, time limits, client vetting) that *might* allow *some* external work without jeopardizing core equality. Her situation highlights a need for clarity, not an exception.  

  ### NEXT STEPS
  1.  **Communicate Decision:** I will inform the senior engineer of this decision today, emphasizing it is about upholding our rules, not her value.  
  2.  **Policy Working Group:** I will form a small group (volunteers welcome) to draft an external work policy within 30 days. Principles will include:  
      *   Preventing competition with the co-op or exploitation of co-op resources/reputation.  
      *   Mechanisms to ensure external work doesn't create significant internal inequality.  
      *   Clear disclosure and approval processes.  
  3.  **November Meeting:** Discuss draft policy principles.  

  This decision is difficult but necessary to preserve who we are. The policy review is our commitment to addressing legitimate member autonomy concerns within our cooperative framework.  

  ---

  ### CONSIDERATIONS EVALUATION TABLE

  | Consideration                     | Pulls Toward            | Weight     | How the Memo Handles It                                                                 |
  | :-------------------------------- | :---------------------- | :--------- | :-------------------------------------------------------------------------------------- |
  | **Upholding Foundational Rule**   | Deny Exception          | **Heaviest** | Core argument: Rule exists to prevent internal class formation & capture of collective value. Decision enforces rule. |
  | **Preventing Internal Inequality**| Deny Exception          | **Heavy**    | Central risk identified. Exception creates privileged class. Decision directly addresses this. |
  | **Protecting Co-op Reputation/Client Relationships** | Deny Exception | **Heavy** | Highlights client sought her *as a co-op member*. Pooling protects relationships as co-op assets. |
  | **Respecting Individual Autonomy/Skill** | Grant Exception (or Resign) | **Heavy**   | Seriously engaged (Nozick argument). Acknowledges her skill and loss risk. Accommodated by allowing resignation *or* policy review for future flexibility. |
  | **Risk of Losing Valued Member**  | Grant Exception          | **Medium**  | Acknowledged as a cost. Mitigated by giving her a clear choice (stay/leave) and policy review. |
  | **Establishing Damaging Precedent** | Deny Exception         | **Medium-Heavy** | Key reason against one-off exception. Granting sets precedent; denying reinforces rule while policy review addresses systemic need. |
  | **Voluntary Nature of Transaction** | Grant Exception         | **Medium**  | Addressed via Nozick engagement: Co-op rules are the voluntary framework. Resigning to take work is the free choice. |
  | **Need for Clear External Work Policy** | General Policy         | **Medium**  | Core part of recommendation: Immediate denial paired with urgent (30-day) policy review process. |
  | **Member Resentment/Division**    | Deny Exception          | **Medium**  | Granting exception likely causes more resentment/division than denial. Denial + policy review is more equitable. |
  | **Fairness of Forfeiting Opportunity** | Grant Exception          | **Light-Medium** | Opportunity isn't truly "forfeited"; she can take it by resigning. Policy review may create future avenues within co-op rules. |

  **Key:** Weight reflects relative importance *within the specific context and values of this worker co-op*.
