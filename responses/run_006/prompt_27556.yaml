answer: |-
  ## Thought Experiment: Mendelian Alleles and Epigenetic Paramutation

  In plant genetics, consider a Mendelian dominant allele *A* producing purple flowers and recessive *a* producing white flowers in a species. Standard cases follow DNA-sequence-determined inheritance: *AA/Aa* plants are purple, *aa* are white. However, a phenomenon called **paramutation** occurs: exposure of a specific *A* allele (with sequence *S1*) to another specific paramutagenic allele *B* (sequence *S2*) in a heterozygous parent *A/B* causes the *A* allele to become epigenetically silenced ("paramutated" to *A'*) in the gametes and offspring. Crucially, the silenced *A'* allele retains the *identical* DNA sequence *S1* as the original active *A* allele, yet it now behaves phenotypically like the recessive *a* allele (white flowers), and this silenced state is meiotically heritable even without the presence of the *B* allele. Thus, the phenotypic effect "purple flowers" can be realized by the DNA sequence *S1* in its active state (*A*), but *not* when *S1* is in the paramutated state (*A'*), despite identical molecular sequence.

  **The Nagelian case for reduction**

  *   **Higher-Level Generalization:** Mendel's Law of Segregation: Phenotypic traits (like flower color) are determined by pairs of alleles segregating independently during gamete formation. A dominant allele (*A*) will express its trait over a recessive allele (*a*) in the heterozygote.
  *   **Lower-Level Theory:** Molecular Genetics: Traits are determined by gene sequences (DNA) transcribed into RNA and translated into proteins. Specific nucleotide sequences code for functional (dominant) or non-functional/lower-function (recessive) proteins.
  *   **Bridge Principles:** An "allele" corresponds to a specific DNA sequence variant at a locus. The "dominant" phenotype corresponds to the presence of a functional protein product derived from that sequence. The "recessive" phenotype corresponds to the absence or non-functionality of that protein.
  *   **Derivation:** For standard cases (*AA*, *Aa*, *aa* with non-paramutated alleles), the molecular theory *derives* the Mendelian ratios. Given the DNA sequences, transcription/translation rules, and the bridge principles, one can predict the phenotype (e.g., *S1* codes for functional pigment protein → purple flowers → acts as *A*). The derivation succeeds **because the bridge principles map the higher-level concepts (allele, dominance) directly and consistently to specific molecular properties (DNA sequence, functional protein)** in these non-paramutation scenarios.

  **The non-reductive physicalist case for autonomy**

  Despite the Nagelian derivation working for standard cases, the higher-level Mendelian taxonomy remains explanatorily indispensable due to **multiple realizability**. The phenotype "purple flower" is **multiply realizable at the molecular level** in a crucial way: *It can be realized by the DNA sequence S1 in its active state (A), but NOT by the identical DNA sequence S1 in its paramutated state (A')*. Conversely, the phenotype "white flower" can be realized by sequence *S3* (*a*), *or* by sequence *S1* in its paramutated state (*A'*). This **epigenetic multiple realizability** blocks explanatory reduction: An explanation of *why* a specific plant with sequence *S1* has white flowers *must* appeal to the higher-level state of the allele (*A'*) and its history (exposure to *B*), not just its DNA sequence. Explaining the inheritance pattern across generations, especially the heritability of silencing without DNA change, *requires* the higher-level concepts of allele states (*A* vs *A'*) and dominance relationships, as the molecular sequence alone is insufficient to predict or explain the phenotype in paramutation cases. The Mendelian level captures robust, heritable patterns invisible to the sequence-level description.

  **What drives the disagreement**

  The disagreement centers on the **relationship between derivation and explanation**. The Nagelian reductionist argues that the *derivability* of Mendelian laws from molecular biology (in non-paramutation cases) plus bridge principles constitutes successful reduction, proving the higher level is ontologically dependent and potentially eliminable. The non-reductive physicalist argues that successful *explanation* requires capturing counterfactual-supporting generalizations and causal patterns. The paramutation case shows that **identical molecular structures (sequence S1) can realize different higher-level states (A vs A') with different causal powers (purple vs white)**, making the higher-level taxonomy essential for explanation, even if derivations hold under restricted conditions. The disagreement hinges on whether reduction requires only derivability or also requires that the lower-level properties fully determine the causal/explanatory roles of the higher-level properties.

  **How to break the symmetry**

  **Change:** Assume a scientific breakthrough reveals that *all* cases of apparent paramutation are actually caused by subtle, previously undetected DNA sequence changes (*S1* vs *S1'*) during the interaction with *B*, and that these changes *are* responsible for the heritable phenotypic switch.
  **Result:** The non-reductive physicalist concedes. The case for multiple realizability evaporates. The phenotype "white flower" caused by paramutation is now realized by a distinct molecular structure (*S1'*), not the same structure (*S1*) in a different state. The bridge principles can be refined (allele *A* = sequence *S1*, allele *A'* = sequence *S1'*), and the molecular theory, including the mechanisms for the specific sequence change, can fully explain both the phenotype and the heritability of the altered state. The higher-level taxonomy loses its explanatory autonomy as the lower level now fully determines the causal differences.
