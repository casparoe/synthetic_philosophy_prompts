  Okay, the user is a faculty speaker at a liberal arts college commencement who teaches Sartre and is struggling with traditional commencement speech tropes. They find phrases like "discover who you really are" or "be true to yourself" to be in bad faith, conflicting with Sartre's ideas of radical freedom and existence preceding essence. They need a speech that embodies Sartrean principles without being a philosophy lecture, bleak, or overly simplistic by just swapping "destiny" for "choice."

  First, I need to address their core conflict: traditional speeches imply a fixed self, which contradicts Sartre. The speech must avoid that while still encouraging graduates. The challenge is presenting freedom as both a burden and a responsibility without causing panic. Also, it should resonate with parents and students, not just philosophy majors.

  Key Sartrean concepts to weave in: existence precedes essence, radical freedom, bad faith, and continuous choice. The speech must emphasize that identity isn't discovered but created through ongoing choices. It should reject the idea that their degree defines them but acknowledge the education's role in developing their ability to choose.

  The user mentioned not wanting freedom to be a consolation prize. So, the speech should honestly present freedom as weighty but also empowering. Need to balance honesty with inspiration. Maybe frame the burden as a shared human condition, making it universal yet uplifting.

  Structure-wise, start by acknowledging the clichés and subvert them. Use relatable examples like choosing careers or paths to illustrate continuous choice. Include a small joke for Sartre students but keep it accessible. Aim for an 8-minute delivery, so concise yet impactful.

  Potential pitfalls: Avoiding academic jargon. Using metaphors like "blank page" or "unwritten book" to convey essence creation. Emphasizing that values come from actions, not predetermined traits. Highlighting that even inaction is a choice, combating bad faith.

  Parents might worry if the speech is too existential, so reassurance through collective responsibility and community. Mentioning that graduates aren't alone; their choices affect others, fostering connection.

  End on an empowering note: freedom as the capacity to create meaning. Encourage embracing uncertainty and finding courage in the continuous act of choosing. Tie back to their education as tools for navigating freedom, not defining them.
answer: |-
  Here is a commencement speech crafted to embody your Sartrean commitments while functioning as genuine, non-bleak encouragement for graduates and their families. It avoids the traps of fixed identity, destiny, and one-time choices, presenting radical freedom honestly as both burden and possibility, woven into the structure of the address itself:

  **(Adjust microphone, look out at the audience with warmth and a hint of seriousness)**

  Good morning, Trustees, President [Name], esteemed colleagues, proud families, friends, and most importantly—the remarkable Class of [Year].

  It’s an immense honor to stand before you today. And, like anyone tasked with a commencement speech, I’ve spent weeks wrestling with what wisdom I could possibly offer as you step from this beautiful campus into the vast unknown. The shelves groan with advice for moments like this: “Find your passion!” “Discover your true self!” “The world awaits the unique *you* that this education has forged!”

  **(Slight pause, leans in)**

  And here’s my problem: I just can’t say those things. Not because I don’t believe in your incredible potential – I absolutely do – but because, well… I teach Jean-Paul Sartre. And those phrases? To my ear, they ring with a kind of intellectual dishonesty – what Sartre called *mauvaise foi*… bad faith.

  Why? Because they suggest something fixed. A “true self” waiting to be uncovered, like a fossil. A destiny pre-written. An essence bestowed by this degree, fully formed. My seminars spend a lot of time questioning precisely those ideas. We grapple instead with a more unsettling, but ultimately more liberating and demanding, truth: **Existence precedes essence.**

  **(Pause for effect, keep tone engaged, not lecture-hall)**

  What does that mean for *you*, right now, sitting here in your robes? It means this: You are not a statue this college has finished carving. You are not a locked box containing a pre-programmed “authentic self” waiting for the key. That degree you’re about to receive? It hasn’t *made* you into something final. It hasn’t handed you a completed essence.

  What it *has* done – brilliantly, I hope – is something far more powerful and open-ended. It has honed your capacity to think critically, to question assumptions (even mine!), to engage with complex ideas and diverse perspectives. It has filled your toolbox – not with a pre-determined blueprint, but with sharper chisels, stronger levels, more versatile instruments. It has, fundamentally, expanded your freedom. And that, Class of [Year], is where the real work – and the real adventure – begins.

  Because Sartre’s radical freedom isn’t a one-time “Choose who you want to be!” coupon you cash in today. It’s not a comforting promise that you’ll eventually “find yourself” and then coast. It’s the persistent, inescapable condition of being human. **You are, right now, and every moment from now on, creating who you are through your choices and actions.**

  **(Shift tone slightly, more direct, leaning into the challenge)**

  Think about it: When you choose a job, or decide *not* to take the obvious path… you aren’t revealing a pre-existing “true self.” You are *making* a self. When you stand up for a principle, or change your mind after listening deeply… you aren’t uncovering destiny. You are *shaping* your values through that very act. When you commit to a relationship, a cause, a creative pursuit… you aren’t fulfilling an essence handed down. You are actively, continuously, *defining* what matters to you.

  **(Acknowledge the weight, honestly)**

  Yes, this freedom can feel like a burden. It’s heavy. There’s no cosmic instruction manual, no divine GPS pre-loaded with your destination. There’s no guaranteed “right path” inscribed in your soul that this education magically revealed. The responsibility lands squarely on your shoulders. To pretend otherwise – to say “This job *is* me,” or “My family expects it,” or “Society demands it,” as if those things *forced* you, absolving you of choice – *that* is the bad faith I warn my students against. You are always choosing, even when you pretend you’re not.

  **(Shift towards empowerment, focus on the tools they have)**

  But here’s the crucial flip side, the profound encouragement embedded within this demanding truth: **This freedom is your supreme power.** You are not constrained by a fixed nature you must discover. You are not a prisoner of a pre-written script. The page, graduates, is astonishingly blank. *You* hold the pen. The sculpture’s clay is still wonderfully malleable. *Your* hands shape it. Every single day.

  This liberal arts education hasn’t given you a finished product. It has given you something far more valuable for the journey ahead: **The tools to choose well.** The critical thinking to question easy answers – including the easy answer of a fixed self. The empathy to understand the impact of your choices on others. The breadth of knowledge to see possibilities beyond the narrow track. The ethical frameworks to navigate complex dilemmas. The courage – and yes, it takes courage – to own your choices without hiding behind excuses or predetermined identities.

  **(Address the collective, include parents, offer reassurance)**

  So, to the families here today: Please don’t panic when I say your remarkable graduates aren’t “finished,” and that no one, not even them, can tell you exactly “who they are” yet. They are brimming with potential precisely *because* they are not fixed. They are works-in-progress, empowered with incredible tools to build their lives meaningfully. They are beginning, not ending. And the best support you can offer is not to expect a finished statue, but to admire the courage and skill with which they sculpt.

  **(Direct focus back to graduates, building towards the close)**

  Class of [Year], today isn’t a culmination revealing your essence. It’s a launchpad amplifying your freedom. You leave here not *defined*, but **equipped**.

  *   **Equipped** to understand that your values aren’t found, they are forged in your actions.
  *   **Equipped** to know that your commitments aren’t destiny, they are choices you actively renew.
  *   **Equipped** to face the unsettling, exhilarating truth that “who you are” is less a discovery and more a continuous, conscious creation.

  **(Final uplift, emphasizing action and possibility)**

  The world throws plenty of scripts at you: scripts about success, about identity, about the “right” way to live. Your education empowers you to read those scripts critically, to edit them fiercely, and, most importantly, **to write your own.** Not once, but sentence by sentence, choice by choice, day by day.

  It won’t always be easy. The burden of freedom is real. But the possibility it contains is infinite. So, step into that freedom. Own your choices. Use your formidable tools. Create, with courage and compassion and critical thought, the life – the *self* – that emerges from your authentic acts in the world. Don’t look for who you “really are.” **Choose who you will be, right now, and then choose again.**

  **(Raise head, strong finish)**

  Congratulations, Class of [Year]. Your existence precedes your essence. Go write an extraordinary story. We can’t wait to read it.

  **(Step back, applause)**

  ---

  **Why this works for your requirements:**

  1.  **Sartrean Structure, Not Decoration:** The core argument *is* the Sartrean view. The speech rejects fixed identity ("discover who you are"), pre-determined essence ("turned into something"), and the bad faith of denying choice ("be true to yourself" as a fixed thing). It replaces them with continuous creation through action/choice, the burden/responsibility of freedom, and existence preceding essence as the core message.
  2.  **Avoids Bleakness & "On Your Own":** It frames freedom as "supreme power," "exhilarating," and "infinite possibility." It emphasizes the *tools* the education provided ("sharper chisels," "expanded freedom," "tools to choose well") as the real gift, not a fixed identity. It directly reassures parents that "works-in-progress" is a positive state.
  3.  **Continuous Choice:** Explicitly states freedom is "not a one-time coupon," highlights "continuously defining," "sentence by sentence, choice by choice, day by day," and "choose who you will be... and then choose again."
  4.  **Honest About Burden:** Directly names freedom as a "burden," "heavy," "unsettling," and "demanding." It doesn't sugarcoat the responsibility.
  5.  **Encouragement Rooted in Reality:** The encouragement comes from their *capacity* ("equipped," "tools," "power," "courage") and the *openness* of possibility ("blank page," "malleable clay," "write your own story"). It urges action and creation.
  6.  **Accessible, Not Lecture:** Uses concrete metaphors (sculpture, toolbox, page/pen, writing a story, GPS). Avoids jargon except briefly defining *mauvaise foi* and "existence precedes essence" in simple terms. Focuses on the graduates' lived experience (choosing jobs, paths, commitments).
  7.  **The Small Joke:** The opening lines about wrestling with advice and shelves groaning, plus the slightly wry "here’s my problem: I just can’t say those things," and the parenthetical *mauvaise foi* nudge will land for the Sartre readers without alienating others.
  8.  **Length:** This text reads comfortably within an 8-minute timeframe when delivered with appropriate pauses.
  9.  **Commencement Spirit:** It celebrates the graduates, acknowledges the achievement, honors the families and institution, and looks forward with hope – all while delivering the philosophically rigorous message you require. The closing is inspirational and forward-looking.

  This speech respects your intellectual integrity, translates Sartrean principles into actionable life advice, meets the ceremonial expectations, and provides genuine, honest encouragement grounded in radical freedom.
