  User's underlying itch might be meta-philosophical: they fear deflationism makes truth too thin to matter. But that's its strength! By making truth lightweight, it *avoids* the morass of correspondence metaphysics. I'll reassure them that scientific realism survives—it just wears different clothes. 

  Final note: their phrasing "can't be right" shows healthy skepticism. They're not rejecting deflationism outright; they're asking it to meet a basic desideratum. Good sign. Need to bridge the gap between their intuition and the formal machinery.
answer: |-
  You've hit on a brilliant and common critique of deflationism! But deflationists have nuanced responses. The key is separating **truth** from **epistemic success** and **representation**. Here's the breakdown:

  1.  **What Deflationism *Actually* Says about Truth:**
      *   "True" isn't a *substantive* property like mass or charge. It doesn't add anything *new* to the content of a statement.
      *   Its primary function is *logical* and *expressive*:
          *   **Disquotation:** Allows us to endorse statements indirectly ("What Einstein said is true").
          *   **Generalization:** Allows us to make sweeping claims ("Everything in the report is true") without infinite conjunctions.
      *   Asserting "P is true" is *equivalent* to asserting P itself. The truth predicate disappears when analyzed.

  2.  **The Problem: Scientific Progress & Comparative Success:**
      *   Your intuition is spot-on: If "P is true" just *is* P, and "Q is true" just *is* Q, how do we say GR is *better* or *closer to truth* than Phlogiston theory? Both disquote to their respective claims, which seem equally "flat" under deflationism.

  3.  **The Deflationist Response: Progress is About *Content*, Not Truth-Property:**
      Deflationists argue you don't need a substantive property of "truth-ness" to explain scientific progress. Progress is about the *relationships between theories, evidence, and the world*, captured by other concepts:

      *   **Empirical Adequacy (Accuracy):** GR makes *vastly more accurate predictions* across a wider range of phenomena (gravitational lensing, GPS, Mercury's orbit) than Phlogiston theory ever did (it couldn't explain weight changes in combustion). Saying "GR is more empirically adequate" is a substantive claim about its predictive success, not a claim about a truth-property.
      *   **Explanatory Power & Coherence:** GR provides a unified, coherent framework explaining gravity, space, and time, integrating with other successful theories (quantum field theory on its background). Phlogiston theory created contradictions (e.g., metals gaining weight when "losing" phlogiston) and failed to integrate with emerging chemistry.
      *   **Scope & Fruitfulness:** GR applies to phenomena Phlogiston couldn't dream of (black holes, cosmology). It generates new research programs and technologies.
      *   **Preservation of Success:** Good scientific progress often preserves the *successful predictions and explanations* of older theories within a new framework (e.g., Newtonian gravity is an excellent approximation under GR for weak fields/low speeds). Phlogiston's successes were largely illusory or explained away by oxygen theory.

  4.  **What "Getting Closer to the Truth" Means (Deflationist Version):**
      *   It's *not* about accumulating more "truth-ness particles." It's a *figurative* way of saying:
          *   Our current theories **make more accurate predictions** than our past theories.
          *   Our current theories **explain a wider range of phenomena** more coherently.
          *   Our current theories are **more successful guides for action and further research**.
          *   Our current theories **preserve the confirmed results** of past theories while correcting their errors and expanding their scope.
      *   Saying "GR is closer to the truth than Newtonian Mechanics" means:
          *   GR predicts everything Newton did correctly *within Newton's domain*.
          *   GR also predicts phenomena Newton couldn't (e.g., light bending, precise orbit of Mercury).
          *   GR provides a deeper, more unified conceptual framework.
          *   Newtonian mechanics is an excellent *approximation* derived from GR under specific conditions.

  5.  **Why "Phlogiston is true" and "GR is true" are NOT on the same footing:**
      *   **Disquotation isn't endorsement:** The deflationist *agrees* that asserting "Phlogiston theory is true" would be asserting the claims of Phlogiston theory. But crucially, *we don't assert that*! We assert *negations* of its core claims: "There is no phlogiston," "Combustion involves oxygen uptake, not phlogiston release."
      *   **The difference is in the *world*, not the truth-predicate:** We reject Phlogiston theory because its *core propositions* (when disquoted) *conflict massively* with our best available evidence and our current, vastly more successful theories. We accept GR (provisionally) because its *core propositions* (when disquoted) *align remarkably well* with our best available evidence and generate successful predictions.
      *   **Truth is still doing its job:** We use the truth predicate to *endorse* GR ("Our best models based on GR are true") and to *reject* Phlogiston ("Claims about phlogiston are not true"). The *justification* for this endorsement/rejection comes from empirical success, coherence, etc., *not* from detecting "truth-ness."

  **What You Were Missing (The Core Insight):**

  Deflationism denies that "truth" is a *substantive natural property* that theories can "have more of" in the way a cup can have more water. **Instead, progress is about the *accuracy, scope, coherence, and empirical success of the specific claims scientists make*. The truth predicate is just a useful tool for *expressing our commitment to those claims* based on those other criteria.**

  **Analogy:** Think of a map. Deflationism says "accurate" isn't a mysterious substance sprinkled on the map. It just means the map's lines *correspond well* to the roads. A newer map isn't "more accurate" because it has more "accuracy-ness"; it's more accurate because its specific markings *match the real roads better* than the old map did. Scientific progress is like getting better and better maps. "Truth" is just the label we use when we decide a particular map is good enough to rely on for navigation. The difference between Phlogiston and GR is like the difference between an old, wildly inaccurate map and a highly detailed modern one – the difference lies entirely in the relationship between the map's content and the territory, not in a ghostly "accuracy property."

  Deflationism doesn't undermine scientific progress; it **re-describes** progress in terms of the concrete success and refinement of our theories and models, without needing an obscure metaphysical property of "truth."
