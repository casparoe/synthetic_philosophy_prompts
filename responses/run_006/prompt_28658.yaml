  Okay, the user is grappling with deflationary theories of truth and how they relate to scientific progress. They're confused because if "is true" doesn't refer to a real property and just disquotes, then how can we say science progresses toward truth? They mention examples like general relativity and phlogiston theory, worrying that deflationism puts them on the same footing. 

  Hmm, this is a solid philosophical question. The user has clearly done some reading but hit a conceptual wall. Their frustration is palpable—they feel deflationism undermines scientific realism, which they intuitively reject. What they're missing isn't deflationism's core mechanics but how it handles *approximation* and *comparative success*. 

