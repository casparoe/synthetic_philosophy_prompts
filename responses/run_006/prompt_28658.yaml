  Ah, and here's their deeper need: they want to preserve scientific progress without committing to truth-as-a-mysterious-substance. Deflationism actually excels here by replacing "getting closer to Truth" with "increasing empirical adequacy and explanatory coherence." The user might be conflating *truth* with *accuracy*—the latter being gradable. 

  I'll emphasize the inferential role. When scientists say "GR is truer than Newton," they're really saying "GR entails more correct observational conditionals." Deflationism doesn't erase progress; it *reduces* progress to practical superiority. The user's panic about equivalence arises from viewing theories atomically, but science judges holistically—via predictive success, not truth-labeling. 

