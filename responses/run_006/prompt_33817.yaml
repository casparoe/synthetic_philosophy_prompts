  First, I recall that "separateness of persons" is often associated with Rawls and Nozick. Rawls uses it to critique utilitarianism, especially in "A Theory of Justice." The user mentioned that when someone proposes a policy that imposes high costs on a few for greater aggregate benefits, this phrase is deployed to shut down the discussion. The user's goal is to disambiguate the term for their next meeting.

  I need to break down possible interpretations of the phrase. Let me list them from the least to most contentious. The most basic interpretation is the denial of conflation. Utilitarians do aggregate across individuals, but they might still recognize persons as distinct entities. Then there's the empirical claim about non-transferability of consciousness, which seems plausible but doesn't directly challenge utilitarianism. 

  Next, the normative significance of distribution. Utilitarians focus on total welfare, not distribution, so this is a stronger challenge. The user wants to know if this undermines the trade-off. Then, the anti-sacrifice principle: utilitarianism allows sacrificing one for many, while opponents see it as impermissible. That's core to the objection in their group. 

  Further, there's the inviolability thesis, which is more deontological, and metaphysical claims about personal identity. The latter might be too heavy for typical debates. 

