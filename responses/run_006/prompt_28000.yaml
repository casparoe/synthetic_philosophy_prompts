prompt: |-
  I'm drafting a short essay, aimed at a LessWrong-style audience, on what counterfactual mugging and XOR blackmail jointly show about decision theory, and I'd like detailed comments on the notes below before I write it up. Please comment on four things: (a) whether my characterizations of the causal, evidential, and updateless responses to the two cases are accurate; (b) whether the asymmetry I propose — that the mugging rewards a policy that is not weakly dominated, while the blackmail punishes one that is — is the right way to separate the cases, or whether it papers over the hard part; (c) whether the point that XOR blackmail is misnamed does real work or is a distraction; and (d) whether these notes would make a good essay and what should be cut. Lead with your overall bottom line in the first sentence, then give your comments, with no preamble and no restating of the prompt.

  Notes for the essay:

  Counterfactual mugging. Omega, a perfect predictor, flips a fair coin. If it lands tails, Omega asks you for $100; if it lands heads, Omega gives you $10,000, but only if it predicted that you would have paid in the tails case. You find yourself in the tails case, facing the request. A causal decision theorist refuses: the coin has already landed, and paying now has no causal effect on any payoff. An evidential decision theorist also refuses: conditional on being asked, paying is not evidence for anything worth $100. But Omega predicted this, so in heads worlds such agents receive nothing. An updateless reasoner evaluates the policy "pay if asked" across both branches, sees it as trading $100 in tails for $10,000 in heads, and pays. The standard lesson is usually put as: choose policies rather than actions, and do not update away the information that your action in one branch is correlated, through the predictor, with payoffs in another branch.

  XOR blackmail. Omega, a perfect predictor, commits to sending you a message exactly when your house has termites XOR you pay Omega $1,000. Termite damage would cost you $1,000,000. A causal reasoner refuses: paying does not causally prevent termites. An evidential reasoner pays: conditional on receiving the message, paying makes termites impossible and refusing makes them certain. But compare the two policies globally. If you are predicted to pay, the message arrives exactly when there are no termites, so you pay $1,000 in the termite-free worlds, while termite worlds get no message and you still suffer the damage. If you are predicted to refuse, the message arrives exactly when there are termites, and you suffer the damage there; termite-free worlds get no message and cost you nothing. Refusing therefore weakly dominates paying: it does no worse on termites and avoids the $1,000. An updateless reasoner refuses. The lesson I want to draw is that conditioning on "the message arrived" is itself the mistake, because that observation is downstream of the predictor's model of your policy.

  The proposed asymmetry. Both cases have a predictor, a hidden state, and an action with no local causal effect on that state, yet the correct policy pays in the mugging and refuses in the blackmail. My way of stating the difference: in the mugging, the policy "pay if asked" is not weakly dominated by "refuse if asked" — it does worse in tails but much better in heads — so a global expected-utility comparison selects it. In the blackmail, the policy "pay if message" is weakly dominated by "refuse if message," so no global evaluation should select it, however good paying looks conditional on receiving the message. The joint lesson would be: evaluate whole policies across all branches, respect weak dominance at the policy level, and treat observations produced by the predictor's model of your policy as evidence about your policy rather than as information to update on before choosing.

  Points I am unsure about. Is weak dominance at the policy level the cleanest way to separate the two cases, or does it smuggle in a causal notion that needs independent justification? Does the point that XOR blackmail is misnamed matter for the diagnosis — would rewriting the problem as genuine blackmail (Omega reveals the termites unless you pay) change the correct policy? And is the pair better read as one argument for updatelessness, or as an argument that updatelessness alone is insufficient and must be supplemented by an account of which policy-level correlations count as consequences of your decision procedure?
reasoning: |-
  Okay, the user is drafting an essay on decision theory concepts like counterfactual mugging and XOR blackmail for a LessWrong audience. They want detailed feedback on four specific aspects of their notes.

  First, I need to verify their characterizations of decision theories in both scenarios. Their descriptions seem accurate: causal and evidential decision theorists both refuse in the mugging but diverge in blackmail (causal refuses, evidential pays). Updateless reasoning correctly pays in mugging and refuses in blackmail. This aligns with standard interpretations.

  The proposed asymmetry about weak dominance is interesting. In mugging, "pay" policy isn't dominated since it excels in heads worlds, justifying its selection. In blackmail, "pay" is weakly dominated by "refuse" - that's technically correct but feels like it might be avoiding the core issue. The real difference lies in how predictor's policy-model creates informational asymmetry. When the observation itself depends on the predictor modeling your policy, conditioning on it becomes problematic. That's the deeper point worth emphasizing.

  Regarding "XOR blackmail" being misnamed - this actually matters. Renaming it as genuine blackmail (message = termites exist unless paid) would flip the updateless recommendation to paying, showing how the predictor's rule structure determines whether conditioning is valid. This isn't pedantry; it reveals a key mechanism.

  The notes are strong essay material but could be streamlined. The "points unsure about" section feels redundant with earlier content. Cutting that and expanding the predictor-model point would strengthen it. The weak dominance framing works as heuristic but shouldn't overshadow the informational dependency insight.

  The user might be wrestling with how to present updateless decision theory's limitations. Their closing question hints that policy correlations need additional justification - that's the real gold here. The essay could pivot to argue that updatelessness requires understanding when correlations are "real" versus artifacts of prediction mechanisms.

  For LessWrong readers, emphasizing the predictor-model's role in creating spurious correlations would resonate well. The weak dominance point is neat but risks feeling like technical window-dressing compared to the profound issue of how predictors manipulate informational contexts.
answer: |-
  Your notes form an excellent foundation; here's feedback on your specific queries:

  **(a) Characterizations are accurate.**  
  - *Mugging:* CDT/EDT correctly refuse (causally futile/evidence of tails), UDT pays via policy evaluation.  
  - *Blackmail:* CDT refuses (no causal prevention), EDT pays (message implies termites unless paid), UDT refuses by policy dominance.  
  - All align with standard treatments.

  **(b) The asymmetry (weak dominance) is correct but incomplete.**  
  - Technically sound: "Pay if asked" in mugging isn't dominated (Heads payoff >> Tails loss), while "Pay if message" in blackmail *is* weakly dominated by refusal.  
  - **However, it papers over the hard part:** The core asymmetry is *why* conditioning on the observation ("asked"/"message") is invalid in blackmail but acceptable in mugging. In mugging, being asked provides *no policy-relevant information* (it always occurs in Tails, regardless of your policy). In blackmail, whether you *get the message* depends entirely on Omega's model of your policy. Conditioning on it smuggles in knowledge of your own policy's predicted behavior, creating a spurious correlation. Your joint lesson implicitly captures this, but the dominance framing risks obscuring it.

  **(c) "XOR Blackmail is misnamed" does real work.**  
  - Renaming it as genuine blackmail (e.g., "Omega reveals termites *unless* you pay $1000") **flips the correct updateless policy to PAYING.** Here, receiving the message *does* provide valid evidence (it means Omega predicted you *wouldn't* pay, implying termites exist). Refusing now *causes* the million-dollar loss. This contrast starkly highlights that the problem in the *XOR* version is the *structure of the predictor's rule*, which makes the observation ("message received") contingent on your predicted policy, not the state. Emphasizing this clarifies why conditioning fails only in the XOR case.

  **(d) These notes make a very good essay; cut/rework the uncertainty section.**  
  - **Strengths:** Clear setup, precise asymmetry, correct diagnosis of the conditioning error, strong joint lesson.  
  - **Cut:** The "Points I am unsure about" section is redundant/repetitive. You've already answered Q1 (weak dominance is useful but the predictor-model dependency is deeper) and Q2 (the naming/rule structure matters crucially) in the main notes.  
  - **Refocus:** Integrate the key insight from (b) and (c): The hard part is identifying *when* an observation is "downstream of the predictor's model of your policy" and thus invalid to condition on. Explicitly state that XOR Blackmail's rule creates this, while Genuine Blackmail/Mugging do not.  
  - **Sharpen the Conclusion:** Frame it as: UDT requires evaluating policies *and* rigorously screening which observations are admissible for conditioning (rejecting those manufactured by the predictor's policy-simulation).

  **Bottom line on the pair:** They show UDT must not only be updateless but also *meta-updateless* – it must treat observations generated by the predictor's simulation of its *own* decision procedure as evidence about *what policy it is implementing*, not as information about the world state to condition on locally. Weak dominance is a symptom, not the cause, of this deeper principle.
