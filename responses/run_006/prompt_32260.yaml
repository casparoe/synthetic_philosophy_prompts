  I should create a structured checklist that helps distinguish genuine forward-looking reasons from sunk cost rationalizations. Key requirements include:
  - Forcing the "new joiner" perspective
  - Flagging cases where termination is likely but still requires judgment
  - Being transparent about mechanical vs. judgmental steps

  The procedure needs to be efficient but robust, fitting within tight time constraints. I'll organize it into clear phases: preparation, forward-looking analysis, sunk cost detection, and decision framing.

  For the hypotheticals:
