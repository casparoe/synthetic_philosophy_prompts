  The tone should remain professional but accessible, using British English as requested. The output needs to be immediately usable in their high-pressure review environment.
answer: |-
  Here is a decision procedure designed for your quarterly reviews, specifically targeting escalation of commitment. It's structured as a checklist with clear phases, indicating mechanical steps (✅) vs. judgment steps (⚠️), and includes flags for potential "stop" decisions.

  **Project Review Procedure: Escalation of Commitment Safeguard**

  **Phase 1: Preparation (Pre-Meeting - Mechanical ✅)**
  1.  ✅ Gather Key Data:
      *   Original Budget & Timeline
      *   Total Spend to Date
      *   Spend vs. Original Budget (%)
      *   Time Elapsed vs. Original Timeline (%)
      *   Key Milestones/Deliverables Planned vs. Achieved (List)
      *   Significant Results/Outputs (Positive & Negative)
      *   Previous Review Recommendations & Rationale
      *   Current Request (Action, Amount/Time, Justification)

  **Phase 2: Forward-Looking Merit Assessment (Judgement ⚠️)**
  2.  ⚠️ **Achievement Against Objectives:** Based on the data (Step 1), what is the *actual* scientific or technical progress? (Ignore spend/time overrun for this step). Is the project demonstrably closer to its ultimate goals?
  3.  ⚠️ **Current Probability of Success (POS):** Given *current* knowledge (results, challenges, team capability, external factors), what is the realistic probability this project will achieve its core objectives if *continued as requested*?
  4.  ⚠️ **Incremental Value Assessment:** If the requested action (e.g., extra £2M, 6 months) is granted, what *specific, new, and valuable* outcomes are expected *that justify this new investment*? How likely are these?
  5.  ⚠️ **Opportunity Cost Consideration:** What other high-potential projects or priorities *within our portfolio* could be funded/resourced with this additional money/time? Is this the *best* use of marginal funds/time right now?

  **Phase 3: Escalation & Sunk Cost Detection (Mechanical ✅ & Judgement ⚠️)**
  6.  ✅ **Sunk Cost Alarm Trigger:** Is the project significantly over budget (>50%) *and* significantly behind schedule (>25%) *and* materially missing key milestones/deliverables? (Yes/No). **If YES, proceed with extreme caution - Escalation Risk HIGH.**
  7.  ⚠️ **The "New Joiner" Test (Crucial Step):** *Imagine you started this job today. You inherit this project exactly as it is now (spend £X, results Y, request Z). Knowing nothing of the past effort or sunk costs, would you approve the requested action (Continue/Increase/Restructure) based purely on:*
      *   *The current state of the project?*
      *   *The probability of future success with the new resources?*
      *   *The value of the expected outcomes vs. the cost and opportunity cost?*
      *   *(Record your instinctive "New Joiner" answer: Approve/Reject/Restructure)*
  8.  ⚠️ **Rationale Scrutiny:** Examine the PI's justification and your own initial thoughts:
      *   Are phrases like "we've come so far," "after all this investment," "it would be a waste to stop now," "just need a bit more to finish," prominent *without* strong *new* forward-looking evidence? (Sunk Cost Signal)
      *   Does the justification focus overwhelmingly on *effort expended* rather than *evidence of impending success*? (Sunk Cost Signal)
      *   Is the request framed as "finishing" something inherently open-ended (like "do it properly") without clear, measurable endpoints? (Escalation Risk)
  9.  ⚠️ **Restructure Feasibility:** Is there a credible, *radically different* approach (Restructure) that addresses past failures and offers a significantly higher POS than the current path? (Requires specific, plausible plan).

  **Phase 4: Decision & Flagging (Integration ⚠️)**
  10. ⚠️ **Synthesize & Decide:** Weigh the forward-looking merit (Steps 2-5) against the escalation risks (Steps 6-9) and your "New Joiner" instinct (Step 7). Formulate your recommendation.
  11. ⚠️ **Escalation Flag:** If:
      *   The "New Joiner" answer (Step 7) is **Reject**,
      *   *OR* the Sunk Cost Alarm (Step 6) is triggered *and* the forward-looking merit (Steps 2-5) is weak/uncertain,
      *   *AND* no strong Restructure option exists (Step 9),
      *   **THEN Flag:** "**High Escalation Risk - Strong Case for Termination**".
      *   *(Note: This flag doesn't force termination; it forces explicit acknowledgement that continuation is likely driven by sunk costs/fear of waste, not merit, and requires exceptional justification to overrule.)*
  12. ⚠️ **Recommendation & Rationale:** State your recommended action (Continue / Increase / Restructure / Terminate) and the **forward-looking reasons** supporting it. Explicitly state if the Flag (Step 11) applies and why you are/aren't overriding it.

  ---

  **Application to Hypothetical Projects:**

  **Project 1: Drug Development (£8M spent, 4 years, no sig. results, request £2M)**

  1.  ✅ **Data:** 200% over budget (>50% ✅), timeline likely significantly exceeded (assume 100%+ over), Milestone: No significant results (Key failure ✅). Request: Increase +£2M.
  2.  ⚠️ **Achievement:** Very low. No statistically significant results after 4 years is a major negative indicator.
  3.  ⚠️ **Current POS:** Low to Very Low. No positive data significantly lowers the likelihood of a sudden breakthrough being "close". Requires judgment on plausibility of team's claim.
  4.  ⚠️ **Incremental Value:** Potential high value (new drug) but likelihood judged very low based on track record. £2M is substantial.
  5.  ⚠️ **Opportunity Cost:** £2M could fund several promising early-stage projects or significant work elsewhere.
  6.  ✅ **Alarm Trigger:** SIGNIFICANTLY over budget (>50% ✅), SIGNIFICANTLY behind ✅, MISSING KEY MILESTONES ✅. **ESCALATION RISK HIGH.**
  7.  ⚠️ **New Joiner Test:** "I inherit a project that's spent £8M over 4 years with zero statistically significant results. The team says a breakthrough is close but offers no new compelling data. They want another £2M." **VERDICT: Very likely REJECT.** No rational new joiner invests £2M based solely on hope after £8M failure.
  8.  ⚠️ **Rationale Scrutiny:** "Breakthrough is close" feels like hope over evidence. "Abandoning wastes £8M" is pure sunk cost reasoning. Strong **Sunk Cost Signal**.
  9.  ⚠️ **Restructure Feasibility:** Unlikely. Core issue is lack of efficacy signal. Restructuring (e.g., new target) essentially starts a new project requiring new justification.
  10. ⚠️ **Synthesize:** Forward-looking merit (Steps 2-5) very weak. Escalation signals (Steps 6,7,8) very strong. Restructure unlikely.
  11. ⚠️ **Flag:** **HIGH ESCALATION RISK - STRONG CASE FOR TERMINATION.** All criteria met (New Joiner: Reject; Alarm Triggered; Weak Forward Look; No Restructure).
  12. ⚠️ **Recommendation:** **Terminate.** Justification: Based on the complete absence of positive results after 4 years and £8M investment, the probability of imminent success with an additional £2M is judged extremely low. The request appears primarily driven by sunk cost fallacy ("wasting" the £8M) rather than credible new evidence. Opportunity cost is high. The "New Joiner" perspective strongly rejects further investment.

  **Project 2: Climate Modelling (18mo overdue, usable but unremarkable outputs, request 6mo extension "to do it properly")**

  1.  ✅ **Data:** Budget? (Assume modest overrun, but focus on time). SIGNIFICANTLY behind schedule (>25% - 18mo on likely 2-3yr project ✅). Milestone: Outputs delivered but "unremarkable" (Partially met? Quality issue ✅). Request: Continue +6mo.
  2.  ⚠️ **Achievement:** Partial. Outputs exist and are usable, but quality/impact is below expectations.
  3.  ⚠️ **Current POS:** Medium. Achieving "proper" results is plausible with more time, but depends on why outputs are currently unremarkable (method flaw? data issue? scope creep?).
  4.  ⚠️ **Incremental Value:** Potential for significantly more valuable/impactful outputs if core issues are fixable. "Do it properly" needs defining – what *specifically* will be better?
  5.  ⚠️ **Opportunity Cost:** 6 months of team time and compute resources; blocks final reporting/closure; delays team starting new work.
  6.  ✅ **Alarm Trigger:** SIGNIFICANTLY behind schedule ✅. Outputs sub-par ✅. (Budget overrun uncertain, but time alone triggers caution). **ESCALATION RISK PRESENT.**
  7.  ⚠️ **New Joiner Test:** "I inherit a project 18 months late that's produced usable but disappointing outputs. The team wants 6 more months to 'do it properly' but hasn't fully diagnosed the cause of the delay/poor quality or specified what 'properly' means." **VERDICT: Likely CAUTIOUS REJECT or RESTRUCTURE.** New joiner needs a *convincing plan*, not just a request for more time.
  8.  ⚠️ **Rationale Scrutiny:** "Do it properly" is vague and could mask sunk costs or scope creep. Why wasn't it done properly the first time? Is the core approach sound? Mild **Sunk Cost Signal** due to vagueness.
  9.  ⚠️ **Restructure Feasibility:** **HIGH POTENTIAL HERE.** A *conditional* continuation is possible: Grant X months *only* to achieve *specific, defined, improved outputs* based on a revised, realistic plan addressing the causes of delay/poor quality. Otherwise, terminate.
  10. ⚠️ **Synthesize:** Forward-looking merit uncertain – hinges on fixability of core issues. Escalation risk present but not as extreme as Project 1. A strong Restructure option exists.
  11. ⚠️ **Flag:** **ESCALATION RISK PRESENT, BUT RESTRUCTURE VIABLE.** Does *not* automatically flag "Strong Case for Termination" because a credible restructure path exists.
  12. ⚠️ **Recommendation:** **Restructure.** Justification: While significantly delayed and under-delivering, the core work has value and completion is feasible. However, a simple continuation is unjustified. Grant a strictly limited extension (e.g., 3-4 months) contingent on: (1) A detailed revised plan diagnosing past problems and specifying *exactly* what "do it properly" means in measurable outputs; (2) Clear, achievable milestones for the extension period; (3) Agreement that this is the final extension. Failure to agree to these terms or meet the new milestones should lead to termination. This avoids pure sunk cost escalation while giving a final chance to salvage value.

  **Key to Symbols:**
  *   ✅ = Primarily Mechanical (Data gathering, threshold checks)
  *   ⚠️ = Requires Judgment (Assessing merit, probability, value, interpreting rationale, weighing factors)
