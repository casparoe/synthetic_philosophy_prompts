prompt: |-
  hey, i'm taking an epistemology course right now and we just did norms of assertion — the knowledge norm, truth norm, belief norm, reasonable-belief norm, plus lottery cases and moore's paradox and all that. i also copy edit for my university's student paper, where i'm basically the closest thing to a fact-checker, and every week i have to decide whether a sentence can go out as a flat claim or needs hedging. we're small, on deadline, and i've usually got about tweny minutes, and the only person above me is a section editor who hates being asked. could you turn the norms-of-assertion stuff into a decision procedure i can actually run: the questions to ask in order, what counts as a good enough answer to each, where the procedure says hedge or cut a sentence, and where it has to stop and hand the call to an editor because it's a judgment call rather than a rule. then run it on three cases: (1) a news story wants to flatly assert that a professor was fired for misconduct, on the strength of one student who says they saw the letter; (2) a column wants to assert something the author is sure is true but has no evidence for; (3) a story wants to state that a student won a raffle because their number was drawn, before the student has actually come forward. and be honest about which steps are doing real work and which are just the same question restated, and flag the cases where the procedure tells me to do something i'll hate, like cutting a sentence i happen to know is true.
reasoning: |-
  Okay, the user is taking an epistemology course and dealing with norms of assertion. They also work as a copy editor for a student paper and need a practical decision procedure based on those norms. Their main request is to turn theoretical concepts into a usable workflow for fact-checking under tight deadlines. 

  First, I need to understand their real-world constraints: 20-minute deadlines, minimal oversight, and the need for clear guidelines that can handle judgment calls. The user mentioned specific pain points—like editors who hate being bothered and sentences they know are true but can't prove—so the procedure must address these friction points directly.

  The three test cases are clever because they map perfectly to core problems in assertion norms: (1) single-source hearsay (knowledge norm), (2) unsupported certainty (belief/reasonable belief norms), and (3) procedural outcomes before confirmation (lottery paradox territory). 

  For the procedure itself, I'll distill the norms into a flowchart-style Q&A prioritizing speed. The key is ordering questions from least to most subjective: start with verifiable truth (objective), then evidence/reliability (semi-objective), before wrestling with warrants and reasonableness (subjective). This mirrors how actual fact-checking works—knock out easy no's first. 

  I should flag where the theory clashes with practicality. For example, the "truth norm" is philosophically fundamental but useless in newsrooms since we can't access metaphysical truth. Instead, I'll emphasize "verifiable truth" as the operational standard. Also, the reasonable belief norm will need concrete benchmarks—like requiring two independent sources—to avoid paralysis. 

  The three cases will stress-test the procedure: Case 1 fails at source reliability (single student isn't authoritative), Case 2 collapses at evidence check (zero support), Case 3 gets messy with the warrant step (administrative competence is usually assumed... until it isn't). I'll explicitly call out where the user might chafe, like killing true-but-unsupported claims in Case 2—that's where the procedure must overrule personal certainty. 

  Notably, Moorean paradoxes ("I know it's true but I have no proof") are the user's daily nightmare, so I'll build in an early "evidence exists?" checkpoint to catch those. And for lottery-like cases, I'll add a temporal hedge option ("will be" → "is expected to be") since time-sensitive publications can't always wait for confirmation. 

  Finally, I'll acknowledge which steps are redundant (e.g., belief norm adds little beyond reasonable belief) but keep them for theoretical completeness—the user is taking a philosophy class, after all. The real workhorses will be the evidence and warrant checks.
answer: |-
  Here's a practical decision procedure based on assertion norms, designed for your high-pressure editing role. It prioritizes speed, defensibility, and clarity about where judgment is required. Steps doing *real work* are marked **(RW)**; others are checks or restatements.

  **The Assertion Norms Decision Procedure (20-Minute Edition)**

  1.  **Truth Check (Truth Norm Proxy):** **"Is this claim *verifiably true* right now?"** **(RW)**
      *   *Good Enough:* Public record, official statement, multiple reliable sources, direct observation by reporter. **→ Proceed.**
      *   *Not Good Enough:* Hearsay, single uncorroborated source, inference, speculation, future/past unconfirmed state. **→ Hedge or Cut.**
      *   *Judgment Call:* Interpretation of ambiguous facts, conflicting reliable sources. **→ Hedge or Escalate.**

  2.  **Evidence Check (Knowledge/Reasonable Belief Proxy):** **"What *verifiable evidence* supports the claim *right now*?"** **(RW)**
      *   *Good Enough:* Document (e.g., official letter, public record), named official on record, multiple independent eyewitnesses, clear data.
      *   *Not Good Enough:* Anonymous source (single), rumor, author's personal certainty alone, inference without stated basis. **→ Hedge or Cut.**
      *   *Judgment Call:* Reliability of a *single* named source (e.g., is the student involved likely privileged? Is the reporter experienced?). Quality of circumstantial evidence. **→ Hedge or Escalate.**

  3.  **Source/Warrant Check (Knowledge/Reasonable Belief Norm):** **"Does the *available evidence* give *me/the paper* a sufficiently reliable warrant to assert this flatly?"** **(RW)**
      *   *Good Enough:* Evidence meets common journalistic standards for the claim's seriousness (e.g., two sources for serious allegation). Source has direct knowledge/access.
      *   *Not Good Enough:* Evidence is thin, source is peripheral or unreliable, claim is high-stakes (e.g., firing, misconduct). **→ Hedge or Cut.**
      *   *Judgment Call:* Weighing source reliability vs. claim severity. Applying "reasonable belief" standard under deadline. **→ Hedge or Escalate.**
      *   *(Note: Belief Norm is largely covered here - if the author lacks belief, evidence/warrant are likely absent. If they have belief but no warrant, it fails here).*

  4.  **Hedging Check:** **"If not flat assertion, what's the *minimum* hedge needed for accuracy/defensibility?"**
      *   *Options (Strongest to Weakest):* Attribute ("According to X...", "Sources say..."), Qualify ("allegedly", "reportedly"), Weaken Verb ("suggest", "indicate"), Remove Claim.

  5.  **Escalation Trigger:** **"Is this high-stakes, legally risky, or based solely on my judgment of source reliability under pressure?" (RW)**
      *   *Yes:* Potential libel, serious reputational harm, major policy implication, sole reliance on one anonymous/unproven source. **→ ESCALATE to Editor (document reason).**
      *   *No:* Proceed with decision (Hedge/Cut/Flat).

  **Key Honesty Points:**

  *   **Real Work (RW):** Steps 1 (Truth Check), 2 (Evidence Check), 3 (Warrant Check), and 5 (Escalation Trigger) do the heavy lifting. Step 4 is implementation.
  *   **Redundancy:** The Belief Norm adds little beyond Step 3. The Truth Norm is the ultimate goal but Step 1 uses "verifiable truth" as a practical proxy. The Reasonable Belief Norm *is* Step 3.
  *   **You'll Hate This:** The procedure **will force you to cut or hedge sentences you *know* are true** if verifiable evidence meeting journalistic standards isn't available *right now* (Step 1 & 2). This protects the paper (and you) from legal/ethical risk based on *provable* due diligence. Personal knowledge isn't publishable evidence.
  *   **Lottery/Moore Notes:** Lottery cases fail Step 3 (statistical likelihood isn't warrant for *this* ticket). Moorean assertions ("It's raining but I don't believe it") fail Step 2 & 3 (lack of belief/evidence/warrant).

  ---

  **Running the Cases:**

  **Case 1: Professor Fired for Misconduct (Based on one student seeing letter)**

  1.  **Truth Check:** Unverified. Letter seen by one student isn't public/official confirmation. Professor/Admin haven't stated? **→ FAIL. Hedge or Cut.**
  2.  **Evidence Check:** Single student source (eyewitness to letter). Is student named? Were they meant to see it? Is letter authentic? Corroboration? **→ Thin evidence for high-stakes claim. FAIL.**
  3.  **Warrant Check:** Does one student's account of seeing a letter warrant a *flat assertion* of firing *for misconduct*? Unlikely. High risk of error/misinterpretation/libel. **→ FAIL.**
  4.  **Hedging Check:** **HEDGE HEAVILY.** "A student who claims to have seen an official letter told the [Paper] that Professor X was fired for misconduct. University officials declined to comment." OR "Rumors are circulating among students that Professor X was fired for misconduct, reportedly based on an official letter seen by one individual. The University has not confirmed this." *Avoid flat assertion.*
  5.  **Escalation Trigger:** **YES.** High-stakes (reputation, job), legally sensitive (misconduct allegation), relies on judgment of single source. **→ ESCALATE to Editor (even if they hate it).** Explain the risk: "We have one unnamed student source for a firing + misconduct allegation. Flat assertion is legally risky. Proposing: [Your Hedged Version]. Need your ok or alternative."

  **Case 2: Column Assertion (Author Sure, Zero Evidence)**

  1.  **Truth Check:** Unknown/Unverifiable. No evidence presented. **→ FAIL. Hedge or Cut.**
  2.  **Evidence Check:** None. Author's certainty ≠ evidence. **→ FAIL.**
  3.  **Warrant Check:** Zero evidence = zero warrant. **→ FAIL.** (This is a classic Moorean violation if asserted flatly: "P is true but I have no evidence for P").
  4.  **Hedging Check:** **CUT or RADICALLY REFRAME.** If it's core to the column's *opinion*, recast as belief: "I am convinced that..." or "It seems evident to me that...". If presented as fact with zero support, **CUT**.
  5.  **Escalation Trigger:** Unlikely needed unless the claim itself is highly inflammatory. Judgment call on reframing vs. cut. **→ Probably NO Escalation needed (just implement hedge/cut).** *This is where you'll hate cutting a true claim, but procedure requires it.*

  **Case 3: Raffle Winner (Number Drawn, Not Claimed Yet)**

  1.  **Truth Check:** **Partially True.** The number *was* drawn (verifiable fact, assuming normal raffle procedure witnessed/reported). The student *has not won yet* (winning requires claiming per rules, usually). **→ PARTIAL FAIL (claim as stated is premature).**
  2.  **Evidence Check:** Evidence the *number was drawn* should be solid (reporter witnessed, organizer stated). Evidence the *student won* is incomplete until claim is verified. **→ FAIL for full claim.**
  3.  **Warrant Check:** Warrant exists for "Number XYZ was drawn." Warrant does *not* yet exist for "Student A won" until claim is verified (organizer confirms ticket holder & validity). **→ FAIL for "Student won".**
  4.  **Hedging Check:** **HEDGE TEMPORALLY/SEQUENTIALLY.** "The winning raffle number drawn was XYZ. If the holder of that ticket claims the prize according to the rules by [Deadline], they will be the winner." OR "Organizers announced the winning raffle number as XYZ. The prize winner will be confirmed upon verification of the ticket holder." **→ Avoid "Student A won" until claim is official.**
  5.  **Escalation Trigger:** **NO.** Common practice, low stakes (usually), easily fixed with precise wording. **→ Implement hedge.** *This avoids the lottery paradox issue by separating the draw (fact) from the win (conditional fact).*

  **Procedure Summary:**

  *   **FLAT ASSERTION:** Only if it passes Step 1 (Verifiable True) AND Step 2 (Solid Evidence) AND Step 3 (Sufficient Warrant) AND is NOT flagged by Step 5 (Escalate).
  *   **HEDGE:** If it fails Step 1 or 2 or 3, but the information is newsworthy and can be accurately qualified/attributed (Step 4).
  *   **CUT:** If it fails Step 1 or 2 or 3, and cannot be adequately hedged, or is pure unsupported opinion posing as fact (Case 2).
  *   **ESCALATE:** If high-stakes, legally sensitive, or relies entirely on a single-source judgment call under pressure (Step 5).

  This procedure prioritizes **verifiable evidence** and **defensible warrants** over truth-in-vacuum or mere belief, respecting the core insights of assertion norms (especially Knowledge/Reasonable Belief) while being operational under deadline pressure. It forces you to separate *what you know* from *what you can publish responsibly*.
