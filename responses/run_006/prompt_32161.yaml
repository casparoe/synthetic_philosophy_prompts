prompt: |-
  I work in formal semantics and keep encountering theories of implicature — neo-Gricean, relevance-theoretic, grammatical — that each claim to account for the data better than the others. Before I evaluate any of them, I want the specification they should all be measured against. What must an adequate theory of conversational implicature do? Give me the desiderata with the motivating case or consideration behind each. Include at least: the standard diagnostics (calculability, cancelability, non-detachability, reinforceability), the distinctions a theory must draw (conventional versus conversational, particularized versus generalized, what is said versus what is implicated), the embedding facts (why implicatures seem to disappear under negation, in antecedents of conditionals, and in downward-entailing environments more generally), and the acquisition and processing data that any theory must now reckon with. For each desideratum, indicate whether it is non-negotiable or whether a theory could plausibly argue that it is not a genuine requirement. Finally, flag any subsets of the desiderata that appear jointly unsatisfiable — if, for instance, a theory that respects the embedding data must give up on cancelability as a diagnostic, say so. My goal is to see whether the desiderata themselves force a theoretical choice, or whether there is a coherent position that satisfies all of them.
reasoning: |-
  Okay, the user works in formal semantics and is dealing with various theories of implicature—neo-Gricean, relevance-theoretic, grammatical. They want a clear set of criteria to evaluate these theories against. First, I need to recall the core aspects of implicature theory. The main desiderata include diagnostics like calculability, cancelability, non-detachability, reinforceability. Then there are distinctions: conversational vs. conventional, particularized vs. generalized, what is said vs. implicated. Embedding facts are crucial too—how implicatures behave under negation, conditionals, and downward-entailing environments. Also, modern considerations like acquisition and processing data.

  The user wants to know if these desiderata force a theoretical choice or if a coherent theory can satisfy all. I should list each desideratum with a motivating case, note if it's non-negotiable, and highlight any tensions. For example, embedding facts might challenge cancelability. Let me start with the diagnostics. Calculability: an implicature must be derivable from conversational principles. Cancelability: it can be explicitly denied without contradiction. Non-detachability: same content, same implicature regardless of phrasing. Reinforceability: can be stated overtly. These seem non-negotiable, but grammatical theories might dispute calculability by positing built-in mechanisms.

  Next, distinctions. Conventional vs. conversational implicatures—like "but" vs. "and". Particularized vs. generalized, where GCIs are default. What is said vs. implicated, crucial for truth conditions. These distinctions are foundational, though some theories blur them, like relevance theory downplaying GCIs.

  Embedding facts are tricky. Implicatures disappear in downward-entailing contexts. This challenges traditional views, leading to embedded implicatures. Grammatical theories might handle this better, but at the cost of cancelability. Acquisition data shows kids handle implicatures early, supporting innate or early-developed processes. Processing data indicates some implicatures are faster, suggesting different mechanisms for PCI vs. GCI.

  Tensions: Embedding vs. Cancelability is a big one. If implicatures embed, they might not be cancellable, challenging their pragmatic nature. Also, GCIs might be both default and cancellable, which is paradoxical. Acquisition data could challenge relevance theory's effort-based processing.

  The user's deeper need might be to identify if a unified theory is possible or if they must choose. Highlighting the trade-offs, like grammatical approaches excelling in embedding but struggling with cancellability. Pointing out that while some desiderata are essential, others like the PCI/GCI distinction might be negotiable. The answer should clarify if any theory can satisfy all or if compromises are inevitable.
answer: |-
  Here is a comprehensive specification for evaluating theories of conversational implicature, structured around core desiderata, their motivations, negotiability status, and potential tensions. This framework draws primarily on Gricean foundations while incorporating modern empirical challenges.

  **I. Foundational Distinctions (Largely Non-Negotiable Core)**
  These distinctions are fundamental to defining the phenomenon itself. A theory rejecting them must provide compelling re-analysis of the core data.

  1.  **Conversational vs. Conventional Implicature**
      *   **Desideratum:** The theory MUST distinguish implicatures derived from general conversational principles (and context) from those conventionally tied to specific lexical items or constructions.
      *   **Motivation:** Contrast "He is poor *but* honest" (conventional implicature of contrast via "but") vs. "John has three children" (conversational implicature "not more than three" via Grice's Maxim of Quantity). Conventional implicatures project robustly (survive negation, questions, embedding), are hard to cancel, and aren't calculable from maxims alone. Conversational implicatures are defeasible and calculable.
      *   **Negotiability:** **Non-Negotiable.** Failure here collapses distinct phenomena with radically different properties. A theory must explain *why* "but" triggers its contrast inherently while "has three" triggers "exactly three" pragmatically.

  2.  **What is Said vs. What is Implicated**
      *   **Desideratum:** The theory MUST distinguish the truth-conditional content directly encoded by linguistic meaning and disambiguation/reference assignment ("what is said") from the additional meaning inferred based on the assumption of cooperativity ("what is implicated").
      *   **Motivation:** "John ate *some* of the cookies" is true if he ate all (what is said), but typically implicates he did *not* eat all. The falsity of the implicature does not falsify what is said. Truth-conditional semantics operates on "what is said."
      *   **Negotiability:** **Non-Negotiable.** This is the core distinction Grice introduced. Rejecting it requires a radical rethinking of truth-conditional semantics and pragmatics. All theories *de facto* accept this, though they may argue about the boundary (e.g., how much pragmatics intrudes into "what is said").

  3.  **Particularized Conversational Implicature (PCI) vs. Generalized Conversational Implicature (GCI)**
      *   **Desideratum:** The theory MUST account for the difference between implicatures heavily dependent on specific contextual assumptions (PCIs) and those that arise relatively robustly in the absence of defeating context (GCIs).
      *   **Motivation:** "John has three children" usually implicates "exactly three" (GCI - relatively context-independent default). "There's a garage around the corner" implicates "the garage is open and sells petrol" only *if* the speaker knows the hearer needs petrol (PCI - highly context-dependent). GCIs exhibit greater default-like behavior, are easier to reinforce, and may have different acquisition profiles.
      *   **Negotiability:** **Conditionally Negotiable.** While the *data difference* (strong default vs. high context-dependence) is non-negotiable, a theory *could* argue this is a continuum or that the distinction is epiphenomenal (e.g., Relevance Theory downplays GCI as a distinct category, attributing default-like behavior to relevance optimization in stereotypical contexts). However, it must still explain *why* some implicatures arise more robustly than others.

  **II. Core Diagnostics for Conversational Implicature (Largely Non-Negotiable)**
  These are the classic tests identifying CI as a pragmatic phenomenon.

  4.  **Calculability**
      *   **Desideratum:** Conversational implicatures MUST be derivable (in principle) from the assumption that the speaker is observing the Cooperative Principle and its Maxims (or analogous pragmatic principles), plus contextual information and linguistic meaning.
      *   **Motivation:** The very definition of a CI is that it is *inferred* based on cooperativity. If an inference cannot be derived this way (like the contrast of "but"), it's likely conventional or entailment. E.g., "Some professors are smart" -> Speaker knows if "all" is true? If not, violates Quantity -> Implicate "Not all professors are smart."
      *   **Negotiability:** **Non-Negotiable for CIs.** This is definitional. Grammatical theories might embed calculability into compositional semantics, but they still need a pragmatic story for *why* that semantic rule exists. Rejecting calculability altogether blurs the line with convention.

  5.  **Cancelability (Defeasibility)**
      *   **Desideratum:** Conversational implicatures MUST be explicitly cancellable without contradiction (by adding information to the context) or contextually cancellable (if the context already blocks the inference).
      *   **Motivation:** "John has three children, in fact he has four." (Explicit cancellation). "Who has more than two children on this committee? - Well, John has three." (Contextual cancellation - no "exactly three" implicature). Entailments and conventional implicatures cannot be cancelled this way.
      *   **Negotiability:** **Highly Constrained Negotiability.** Cancelability is a hallmark of pragmatic inference. However, **this is the primary site of tension with embedding data (see below)**. Theories *must* account for apparent cancellability in root clauses. A theory might argue that *some* inferences traditionally called GCIs are actually part of a non-cancellable semantic meaning (e.g., exhaustification), but then it must explain the *intuition* of cancellability and the behavior of PCIs.

  6.  **Non-Detachability**
      *   **Desideratum:** Conversational implicatures MUST attach to the content of the utterance, not to its specific form. Paraphrasing "what is said" should preserve the implicature, provided the same content is expressed and the context is constant.
      *   **Motivation:** "John has three children," "John has exactly three children," "The number of children John has is three" all carry the "not four" implicature (if context allows). The implicature is triggered by the *meaning* of "three" combined with Quantity, not the specific word "three" itself (cf. "but").
      *   **Negotiability:** **Non-Negotiable for CIs.** Failure indicates the inference is tied to form/convention, not pragmatic calculation on content. Grammatical theories need to ensure their mechanisms operate on semantic content, not form.

  7.  **Reinforceability**
      *   **Desideratum:** Conversational implicatures MUST be explicitly reinforceable without redundancy or contradiction.
      *   **Motivation:** "John has three children, but not four" is perfectly natural. If "but not four" were part of "what is said," this would be redundant or contradictory ("John has three children" would entail "not four", making "but not four" infelicitous). Contrast with conventional implicature: "He is poor but honest, and there's a contrast" is redundant.
      *   **Negotiability:** **Non-Negotiable.** This is a direct consequence of implicatures being non-truth-conditional additions to "what is said." Genuine entailments or conventional implicatures cannot be reinforced this way.

  **III. Embedding Behavior (Major Challenge & Source of Tension)**
  This is where theories diverge most significantly.

  8.  **Embedding Under Operators**
      *   **Desideratum:** The theory MUST account for the observation that conversational implicatures typically **do not scope under** logical operators like negation, modals, or in the antecedents of conditionals (*unless* the operator itself is part of the trigger). Implicatures attach to the whole asserted content.
      *   **Motivation:**
          *   Negation: "John doesn't have three children" does NOT implicate "He does have some other number (like four)"; it simply says he doesn't have three (could have zero, two, four...).
          *   Antecedent of Conditional: "If John has three children, he gets a tax break" does NOT implicate "If John has exactly three children (and not more), he gets a tax break." The condition is about having three, regardless of whether he has more.
          *   Downward-Entailing (DE) Environments: More generally, in environments that license inferences from sets to subsets (like negation, antecedents, "few", "doubt"), implicatures often vanish. E.g., "Few professors are smart" does not implicate "Some professors are smart" (it entails it!), whereas "Some professors are smart" in a positive context does implicate "Not all are smart."
      *   **Negotiability:** **Non-Negotiable (Data).** The data pattern is robust. However, **this creates significant tension with Cancelability and the GCI/PCI distinction**. Grammatical theories often handle this elegantly by making the implicature (or exhaustification) part of the compositional semantics, which *does* embed. Pragmatic theories (Gricean, RT) struggle: Why doesn't the maxim-driven inference apply locally? Some (e.g., localist pragmatics or embedded implicature proponents) argue implicatures *can* sometimes embed, challenging the traditional view.

  **IV. Modern Empirical Constraints (Increasingly Non-Negotiable)**
  Theories must engage with experimental findings.

  9.  **Acquisition Data**
      *   **Desideratum:** The theory MUST be compatible with findings on how children acquire the ability to compute implicatures.
      *   **Motivation:** Children often succeed with PCIs earlier than GCIs (like scalar "some"; around age 3-4 for simple PCIs vs. 5-7 for robust scalar GCI comprehension). They also sometimes accept literal interpretations more readily ("Some horses jumped over the fence" is accepted as true if all did). Theories need to explain this trajectory and potential delays for GCIs.
      *   **Negotiability:** **Non-Negotiable (Data Fit).** The data is empirical. A theory must explain the pattern. Grammatical theories might posit later maturation of exhaustification operators. Relevance Theory might appeal to developing cognitive resources/metarepresentational abilities. Neo-Griceans might posit developing mastery of maxims/defaults.

  10. **Processing Data (Online Computation)**
      *   **Desideratum:** The theory MUST be compatible with findings on the time-course and cognitive effort involved in computing implicatures.
      *   **Motivation:** PCIs often show processing cost (reflecting contextual search/inference) in reaction time or neuroimaging studies. GCIs (especially scalar) often show mixed results: sometimes immediate, sometimes delayed, sometimes effortful. Some studies suggest GCIs might be computed faster or with less cost than PCIs. Theories need to explain this variability and the factors influencing processing load (context, trigger type, task).
      *   **Negotiability:** **Non-Negotiable (Data Fit).** Results constrain mechanisms. Grammatical theories predict relatively fast, automatic computation for embedded GCIs. Default-based Gricean theories predict relatively fast access for GCIs. Relevance Theory predicts effort scales with cognitive effects gained, potentially explaining variability but needing to account for apparent default-like speed for some GCIs.

  **Key Tensions and Trade-offs:**

  1.  **Embedding vs. Cancelability & Calculability (The Biggest Tension):**
      *   **Conflict:** The traditional pragmatic view (implicature as a global inference about speaker commitment) neatly explains cancelability and non-embedding but struggles mightily with robust cases of *embedded implicatures* (e.g., "John believes that some of his students passed" can implicate "John believes that not all passed"). Grammatical theories handle embedding naturally but make the inferences part of semantics, potentially sacrificing genuine cancelability and the pragmatic essence of calculability. They often recast cancellability as ambiguity or optionality of the exhaustification operator.
      *   **Theoretical Choice Forced:** Yes. How a theory resolves this tension is fundamental. Does it bite the bullet on embedded implicatures (requiring complex local pragmatic mechanisms) or relocate the effect to semantics (risking losing pragmatic hallmarks)? Hybrid approaches exist but face their own challenges.

  2.  **GCI as Default vs. GCI Cancellability:**
      *   **Conflict:** The robust, default-like nature of GCIs (e.g., "some" -> "not all") suggests a privileged status. Yet, they remain cancellable ("Some, indeed all..."). How can something be a default *and* defeasible? Default-based Gricean theories embrace this tension. Relevance Theory rejects inherent defaults, attributing robustness to relevance in typical contexts. Grammatical theories often make GCIs semantic and cancellability an illusion or ambiguity.
      *   **Theoretical Choice Forced:** Partially. Theories need a clear stance on the nature of GCIs. Denying their distinct status (like RT) or making them semantic are choices that explain cancellability differently.

  3.  **Processing/Acquisition vs. Theoretical Parsimony:**
      *   **Conflict:** Grammatical theories offer elegant explanations for embedding and potentially faster processing of GCIs but may struggle with the pragmatic flexibility captured by cancelability and contextual variation in PCI computation. Purely pragmatic global theories are simpler conceptually but face significant challenges explaining embedding and the detailed time-course data.
      *   **Theoretical Choice Forced:** Yes. Parsimony vs. coverage of empirical detail. Increasingly, theories incorporate elements of both (e.g., pragmatic mechanisms operating compositionally).

  **Conclusion: Is a Coherent Position Satisfying All Desiderata Possible?**

  A theory satisfying *all* desiderata perfectly, without tension, is arguably **elusive**. The core tension between the pragmatic nature of CIs (emphasized by calculability, cancelability, non-detachability, reinforceability, PCI/GCI distinction) and their behavior under embedding, coupled with the detailed processing/acquisition data, forces significant theoretical choices:

  *   **Grammatical Approaches:** Excel at embedding and potentially acquisition/processing of GCIs. Sacrifice genuine pragmatic cancelability and calculability for GCIs, relocating them to semantics. May blur the conventional/conversational line.
  *   **Relevance Theory:** Offers a unified pragmatic mechanism (relevance optimization), handles context-dependence (PCI) well, and can potentially explain processing effort. Struggles with the default-like robustness of GCIs and systematic embedding effects without additional stipulations. Downplays the PCI/GCI distinction.
  *   **(Neo-)Gricean Approaches w/ Local Pragmatics:** Attempt to preserve pragmatic core while allowing local computation to handle embedding. Can be complex and face challenges explaining why local computation doesn't *always* occur or why global implicatures behave differently. Must carefully define the interaction of pragmatics and composition.

  **The desiderata themselves do force theoretical choices,** primarily centered on the Embedding vs. Pragmatic Core (Cancelability/Calculability) conflict and the nature of GCIs. A truly coherent position satisfying all desiderata perfectly likely requires rethinking some foundational assumptions (e.g., the strict separation of semantics and pragmatics, the nature of defaults) or adopting a nuanced hybrid model that acknowledges different mechanisms for different types of implications (PCI vs. GCI, different embedding contexts). The field is actively grappling with these tensions, and the best current theories are those that explicitly address the trade-offs involved. Your evaluation should focus on how each theory navigates these core conflicts and which compromises it makes to account for the diverse data landscape.
