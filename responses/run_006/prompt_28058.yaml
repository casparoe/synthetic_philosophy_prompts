  I recall this is often called the Strategy Stealing argument. It's common in combinatorial game theory, especially in games like Hex. The name comes from the first player "stealing" the second player's strategy. I should confirm that and mention it.

  For the conditions, I need to list necessary and sufficient ones. The user mentioned symmetry, but actually, the argument works as long as the game is symmetric, meaning both players have the same possible moves from equivalent positions. No chance elements are crucial because randomness would mess up the strategy stealing. No draws is necessary since the conclusion is that one player must win, so if draws were possible, the contradiction wouldn't hold.

  The extra piece condition is critical. The user called it "extra pieces never harmful," but technically, it's about moves not harming your position. The technical term is that the game is monotonic or that the move set is monotone. If placing a piece could ever block your own options, the argument fails. For example, in Tic-Tac-Toe, an extra piece might block a winning move, so the argument doesn't apply there. I should clarify that.

  Also, the game needs to be finite to ensure termination, which is usually assumed in such proofs. The user might not have mentioned finiteness, but it's essential to avoid infinite games.

  I should check if any conditions can be relaxed. Symmetry might be adjustable if the game isn't perfectly symmetric but has an initial symmetry-breaking move. However, the core of Strategy Stealing requires that after the first move, the first player can still mirror or steal the strategy. So symmetry in strategies is key, not necessarily the board's symmetry.

  The user is interested in the epistemological aspect—knowing a strategy exists without knowing what it is. That's a key point about non-constructive proofs. They might be delving into game theory or logic, so mentioning that this is a non-constructive proof could add value.

