answer: |-
  ## Adversarial Collaboration Document: Frankfurt Cases and the Principle of Alternative Possibilities (PAP)

  **Participants:** Proponent of Frankfurt Success (PFS) & Defender of PAP (DPAP)
  **Instructor:** [Instructor Name]
  **Date:** [Date]

  **Preamble:** This document reflects our collaborative effort to clarify our ongoing dispute regarding whether Frankfurt-style cases successfully refute the Principle of Alternative Possibilities (PAP). We acknowledge our fundamental disagreement but commit to accurately representing each other's positions and identifying the key points where further inquiry or argument is needed, rather than simply rebutting each other. This document outlines areas of agreement, precise points of disagreement, and crucial questions ("cruxes") whose resolution we agree would significantly advance the debate.

  ### (1) Agreed Claims (Signed by PFS & DPAP)

  1.  **Canonical Frankfurt Case Structure:** A standard Frankfurt case involves:
      *   An agent (Jones) who deliberates and makes a decision (e.g., to vote for Clinton).
      *   A counterfactual intervener (Black) with the power and intention to *ensure* Jones performs a specific action (votes for Clinton) *if* Jones shows any sign of choosing otherwise.
      *   Jones decides and acts *on her own* (e.g., votes for Clinton for her own reasons).
      *   Black does *not* intervene in the actual sequence of events because his intervention is unnecessary given Jones's actual choice.
      *   Due to Black's presence and capabilities, Jones lacks the robust alternative possibility of choosing/doing otherwise (e.g., voting for Trump) in that specific situation.
  2.  **Principle of Alternative Possibilities (Original PAP):** "A person is morally responsible for what he has done only if he could have done otherwise." (As formulated by Frankfurt, intended to capture the common intuition that responsibility requires alternate paths.)
  3.  **Goal of Frankfurt Cases:** Frankfurt cases aim to show that PAP is false by presenting a scenario where an agent is intuitively morally responsible for an action *despite* lacking the ability to do otherwise in that situation.
  4.  **PFS Argument Requirement:** For PFS to succeed, it must be shown that (a) in the Frankfurt case as described, Jones *is* morally responsible for her action, and (b) Jones genuinely *lacks* any alternative possibility relevant to grounding moral responsibility for that specific action.
  5.  **DPAP Argument Requirement:** For DPAP to succeed, it must be shown that either (a) Jones *does* possess an alternative possibility relevant to grounding moral responsibility in the Frankfurt case (e.g., via the "flicker of freedom" strategy), or (b) the intuition that Jones is responsible *in the Frankfurt case* is either unwarranted or relies on illicitly assuming the falsity of PAP (e.g., via the "dilemma defense").
  6.  **Implications if PAP is False:** If PAP is successfully refuted, then *source incompatibilism* (the view that determinism rules out responsibility *because* it rules out alternative possibilities) would be undermined. This would *not*, by itself, establish compatibilism, but it would remove a major argument for incompatibilism and open space for compatibilist or other non-PAP-based accounts of responsibility. *Leeway incompatibilism* would be directly refuted.
  7.  **Implications if PAP is Upheld:** If PAP withstands the Frankfurt challenge (e.g., via a successful flicker strategy or dilemma defense), then the argument from determinism to lack of responsibility via lack of alternative possibilities (Leeway Incompatibilism) remains viable. Compatibilism would need to either defend a robust sense of "could have done otherwise" compatible with determinism or provide a compelling argument that PAP is false for reasons *other* than Frankfurt cases.

  ### (2) Disagreements Table

  | Disagreement Point                                                                 | PFS Position (Frankfurt Succeeds)                                                                                                | DPAP Position (PAP Survives)                                                                                                 |
  | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- |
  | **1. Moral Responsibility in the Frankfurt Case**                                  | Jones is morally responsible for voting for Clinton in the actual sequence, where Black remains passive, just as she would be if Black were absent. | The intuition that Jones is responsible *in the Frankfurt scenario* is either mistaken or cannot be established independently of assuming PAP's falsity. |
  | **2. Significance of Alternative Possibilities ("Flicker Strategy")**              | Any alternative possibilities remaining in the Frankfurt case (e.g., the possibility of *signalling* a different choice triggering intervention) are too "thin" or non-robust to ground moral responsibility; they are not the kind of freedom required by PAP. | The alternative possibilities present in the Frankfurt case (e.g., the possibility of *initiating* a different choice/process before intervention) are sufficiently robust to satisfy PAP's requirement for moral responsibility. PAP demands *some* alternative possibility, not necessarily the robust ability to perform a different *action* unimpeded. |
  | **3. Structure of the Frankfurt Argument ("Dilemma Defense")**                     | The Frankfurt case does not beg the question. Jones's responsibility in the actual sequence (where Black is idle) can be established independently, based on her reasons-responsive mechanism and lack of coercion, without assuming PAP is false. The case then shows this responsibility persists even when alternative possibilities are removed. | Frankfurt cases face a dilemma: Either (a) Black's presence leaves a relevant alternative possibility (contradicting the claim of no alternatives), or (b) Black's mechanism causally determines Jones's choice *even in the actual sequence*, making it unclear how she can be responsible. The intuition of responsibility relies on ignoring (b) and assuming she acts freely *as if* Black weren't there, which assumes the falsity of PAP from the start. |
  | **4. PAP's Connection to Incompatibilism**                                         | Refuting PAP significantly weakens a primary argument for incompatibilism (the alternative possibilities argument) and demonstrates that the core concern of incompatibilists might lie elsewhere (e.g., sourcehood or ultimacy). | PAP captures a fundamental requirement for responsibility that is *also* threatened by determinism. Upholding PAP preserves a strong link between responsibility and indeterministic control, even if Frankfurt cases fail. |

  ### (3) Cruxes: Key Sub-Questions

  1.  **Crux: Robustness of Flickers**
      *   **Question:** Are the alternative possibilities identified by the flicker strategy (e.g., the possibility of *beginning* to choose otherwise, or *being disposed* to choose otherwise triggering intervention) sufficiently robust to satisfy the requirement for moral responsibility intended by PAP?
      *   **Relevant Consideration:** Analysis of the *kind* of control PAP is supposed to protect. Arguments about whether responsibility requires access to alternative *actions* or merely alternative *possibilities* (like initiating a different choice process).
      *   **PFS Prediction:** Analysis will show these flickers lack the necessary robustness; they are mere shadows of alternatives, insufficient to ground the kind of control responsibility requires. PAP requires the ability to *do* otherwise, not just to *signal* or *trigger* otherwise.
      *   **DPAP Prediction:** Analysis will show these flickers represent a genuine form of alternative possibility – the agent retains the power to *initiate* a different volitional sequence – which is sufficient for the core intuition behind PAP that responsibility requires avoidability.

  2.  **Crux: Actual Sequence Determination**
      *   **Question:** Does the presence of the counterfactual intervener (Black) in a Frankfurt case imply that the agent's actual choice is causally determined *even in the sequence where no intervention occurs*?
      *   **Relevant Consideration:** Examining the causal structure of the Frankfurt scenario. Arguments about whether Black's mechanism necessitates Jones's choice via preemptive overdetermination or dispositional facts, even when inactive.
      *   **PFS Prediction:** Analysis will show that in the actual sequence (no intervention), Jones's choice is *not* causally determined by Black; it flows solely from her own reasons and deliberative mechanism. Black is a failsafe, not a determinant, in the actual sequence.
      *   **DPAP Prediction:** Analysis will show that Black's setup (his device monitoring Jones's brain or preempting her nervous system) entails that Jones's choice *is* causally determined in the actual sequence – either directly by Black's mechanism or because her state is such that she *cannot* but choose as she does given the setup. Her "own reasons" operate under a threat of override that compromises genuine authorship.

  3.  **Crux: Independent Grounds for Responsibility**
      *   **Question:** Can the judgment that Jones is morally responsible in the *actual sequence* of the Frankfurt case (where Black doesn't intervene) be justified *without* presupposing that PAP is false?
      *   **Relevant Consideration:** Assessing compatibilist-friendly conditions for responsibility (e.g., reasons-responsiveness, mechanism ownership, non-coercion) within the Frankfurt scenario, independent of alternative possibilities. Arguments about whether these conditions truly obtain given Black's presence.
      *   **PFS Prediction:** Analysis will show that standard compatibilist conditions (e.g., moderate reasons-responsiveness) are satisfied in the actual sequence, providing independent grounds for attributing responsibility that do not rely on PAP's falsity.
      *   **DPAP Prediction:** Analysis will show that Black's presence undermines the satisfaction of these compatibilist conditions (e.g., it compromises true reasons-responsiveness or mechanism ownership) *or* that the intuition of responsibility in this specific scenario *depends* on implicitly assuming Jones had freedom she actually lacked (i.e., assuming PAP's falsity).

  ### (4) Terminological Clarifications & Remaining Substance

  *   **"Alternative Possibility" / "Could Have Done Otherwise":** We agree that PAP requires that the agent had *some* possibility open to her at the relevant time that was different from what she actually did or chose. However, we disagree profoundly on **what *counts* as a relevant alternative possibility**.
      *   DPAP argues that possibilities like *initiating* a different choice process, or *being such that one would have chosen differently* (triggering intervention), suffice. The lack of the robust possibility to *complete* a different action unimpeded does not negate the presence of *some* alternative possibility.
      *   PFS argues that PAP requires the possibility of *actually performing a different action* (e.g., voting for Trump) without external prevention. The "flickers" identified by DPAP are not genuine *action* alternatives and are insufficient for the kind of control PAP was meant to protect.
  *   **Substantive Disagreement Remaining:** After clarifying that the dispute hinges on the *robustness* and *nature* of the required alternative possibility (action-completion vs. choice-initiation/disposition), the core disagreement persists:
      *   **Does moral responsibility require the agent to have the ability to *perform* a different action unimpeded (PFS interpretation of PAP), or does it only require the ability to *initiate* or *be disposed towards* a different choice process, even if external factors would prevent its completion (DPAP interpretation of PAP)?** Resolving *this* question about the necessary conditions for responsibility is the heart of the Frankfurt debate, beyond mere semantics about "alternative possibility."

  **Signatures:**

  _________________________
  Proponent of Frankfurt Success (PFS)

  _________________________
  Defender of PAP (DPAP)
