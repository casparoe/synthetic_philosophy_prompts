  Hmm... the user wants me to reconstruct the implicit moral theory. Let me start by rejecting the "lesser evil" reductionism. If amnesty were purely about consequences, why the performative condemnation? That preamble serves no utilitarian purpose unless it's acknowledging persistent wrongness. And look at how negotiators talk about "moral costs" – that language echoes dirty-hands literature directly.

  Wait, what about the alternative theories they mention? If we took absolute deontology ("never torture"), peace deals with amnesty would be unconscionable. Yet they happen. And if leaders had no special permissions, warlords couldn't claim authority to trade justice for peace. The current practice collapses without recognizing leaders' unique role-responsibilities.

  The ICC dilemma is telling too. Prosecuting underlings while exempting leaders only makes sense if we see leaders' crimes as existing in a separate, politically necessary realm. That institutional hypocrisy actually reinforces the dirty-hands reading.

  But here's the nuance: the practice doesn't strictly require dirty hands. A sophisticated consequentialist could argue the condemnation serves future deterrence. Yet that feels post-hoc. The emotional residue – negotiators' anguish, victims' outrage – points to uncancelled wrongness better than any theory.

  Ultimately, the user needs to hear that while alternative frameworks can be forced onto these deals, they stretch and tear. The lived reality – the pardoned killer's lingering guilt, the prosecutor's uneasy silence – screams dirty hands. Their dissertation should call that out: we've built a system that runs on moral remainder.
answer: |-
  Based on the structure, tensions, and lived reality of peace settlements involving atrocity crimes, I argue that the practice **strictly presupposes a "dirty hands" (DH) framework** as its core implicit political morality. Here’s the reconstruction and defense:

  ### The Core Argument: Dirty Hands as Necessary
  1.  **The Inescapable Moral Contradiction:** Amnesty-for-peace deals explicitly condemn atrocities (preambles, UN resolutions, victim clauses) *while* simultaneously immunizing the perpetrators. A pure lesser-evil/consequentialist framework (**LE**) cannot coherently explain the *condemnation* within the agreement itself. If the amnesty were *only* a regrettable but fully justified trade-off (where the "wrongness" is entirely canceled by the greater good of peace), condemning the acts it facilitates would be redundant or even counterproductive. The condemnation persists precisely because the wrongness of the acts *isn't* canceled by the necessity of the amnesty. This is DH's "moral remainder."

  2.  **The Necessity of Agency and Authorization:** The practice treats *political leaders* (architects, commanders) differently from foot soldiers, both in granting amnesty and in selective prosecution. LE struggles to justify this distinction: if consequences are all that matter, prosecuting *any* perpetrator might deter future peace. DH, however, explains it naturally:
      *   Leaders possess the unique *authority* to bind their factions to peace. Granting them amnesty is a *political* act recognizing this specific agency. Foot soldiers lack this authority; prosecuting them (while often problematic) doesn't directly threaten the peace deal's stability in the same way.
      *   Leaders bear a unique *responsibility* for systemic violence that ordinary individuals do not. The DH view accepts that leaders, by virtue of their role, must sometimes commit or authorize profound moral wrongs (like granting amnesty for atrocities) *as part of their duty to secure a greater good* (peace). This duty-bound transgression is inherent to political leadership in extreme circumstances.

  3.  **The Performative Acknowledgment of Wrongness:** The preamble's condemnation isn't merely symbolic; it's a performative acknowledgment that the amnesty *fails* justice. This serves multiple DH functions:
      *   **Recording the Truth:** Affirming the historical fact and moral evil of the atrocities, despite the inability to prosecute.
      *   **Acknowledging the Moral Cost:** Explicitly marking the amnesty as a morally tainted act undertaken for peace, not a vindication.
      *   **Addressing Victims (Partially):** Offering a minimal, non-punitive form of recognition that their suffering was wrong, even if legal accountability is sacrificed.
      *   **Maintaining Normative Standards:** Preserving the international legal and moral prohibition against atrocities, ensuring the amnesty is seen as an exception forced by necessity, not a revision of the norm.

  4.  **The Practice of "Moral Regret" by Negotiators:** Practitioners involved in these deals often express profound moral unease, describing the amnesty as a "necessary evil," a "poisoned chalice," or an act that "stains" the peace. This language directly mirrors DH discourse – the recognition of having done something intrinsically wrong while believing it was the right thing *to do* politically. LE might produce regret about bad outcomes, but not this specific anguish over the inherent wrongness of the act itself.

  ### Compatibility, Tensions, and Alternatives
  *   **Lesser Evil (LE) is Compatible but Insufficient:** LE can explain *why* the amnesty is chosen (peace > justice). However, it cannot adequately explain the *internal structure* of the agreements (condemnation + immunity), the *leader/foot soldier distinction*, or the *specific moral anguish* expressed. LE reduces the amnesty to a cost-benefit analysis where the "cost" is merely instrumental (e.g., potential future impunity). DH insists the cost is also intrinsic moral wrongdoing by the leaders granting it.
  *   **Absolute Deontology ("Never Authorize") is Incompatible:** This view (e.g., torture/atrocity amnesty is *always and absolutely* forbidden) would render almost all existing amnesty-for-peace deals morally impermissible. The practice presupposes that political leaders *can* and *must*, under dire circumstances, authorize actions (amnesty for atrocity perpetrators) that would be absolutely forbidden to private individuals or in normal times. This is the essence of DH.
  *   **Reductionism (No Special Political Morality) is Incompatible:** If leaders have exactly the same moral permissions as ordinary people, they would lack the *authority* to trade justice for peace on behalf of a collective. The amnesty grant presupposes a leader's unique political agency and responsibility. An ordinary person cannot pardon a warlord for crimes against thousands; a political leader negotiating peace arguably can and sometimes must, precisely because of their role.

  ### Consequences of Replacing Dirty Hands
  If we replaced the implicit DH framework with the alternatives, the practice would fundamentally change:

  1.  **With Absolute Deontology:**
      *   **Negotiations:** Amnesty for atrocity crimes would be off the table. Negotiators would have to pursue peace solely through non-amnesty means (power-sharing, reforms, conditional reintegration) or risk total impasse/collapse. Many conflicts might prove unresolvable through negotiation.
      *   **Courts:** ICC/ICTs would be *required* to pursue architects relentlessly, regardless of peace process status. Peace deals shielding leaders would be seen as morally/legally void. Selective prosecution of foot soldiers would become even more morally indefensible and likely cease.
      *   **Agreements:** Preambles condemning atrocities would remain, but clauses immunizing perpetrators of core international crimes would vanish. Agreements might focus solely on future governance, leaving past crimes solely to judicial mechanisms.

  2.  **With Reductionism (No Special Political Morality):**
      *   **Negotiations:** The very legitimacy of leaders (especially from violent factions) to negotiate binding deals involving amnesty would be undermined. Who are *they* to receive or grant immunity for mass murder? Negotiations might fragment or focus only on technical disarmament/demobilization without broader political settlements involving former perpetrators.
      *   **Courts:** The distinction between leaders and foot soldiers based on political role/necessity would collapse. Prosecution would focus solely on individual culpability, regardless of rank or political utility. The ICC's complementarity principle (respecting national *political* processes) would weaken significantly.
      *   **Agreements:** Amnesty clauses would likely disappear or be framed purely as individual pardons (ethically problematic in themselves for atrocities). The notion of a collective "peace" achieved through a leader's morally transgressive act (amnesty) would lose its conceptual foundation.

  ### Conclusion
  The practice of granting amnesty for atrocity crimes in exchange for peace **strictly presupposes a dirty hands view of political morality**. It requires the notion that political leaders, by virtue of their role and responsibility for collective survival, can be *obligated* to perform acts (granting immunity for unspeakable evils) that are intrinsically wrong and leave a lasting moral stain, even when those acts are necessary to achieve a paramount good (peace). The condemnation within the agreements, the distinction between leaders and foot soldiers, and the pervasive discourse of moral anguish among practitioners are not merely ugly compromises; they are the manifestations of this uncancelled "moral remainder." While a lesser-evil framework can *accompany* DH (explaining the necessity), it cannot *replace* it in explaining the full structure and phenomenology of the practice. Alternative moral frameworks would necessitate a radical, likely unworkable, transformation of how peace is negotiated after atrocity.
