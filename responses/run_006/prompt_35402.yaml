answer: |-
  Here's a lay of the land regarding the desiderata for an adequate theory linking rational credence and objective chance, framed without presupposing Lewis's Principal Principle (PP) as definitive. I'll walk through the requirements you've hinted at, explaining the problems motivating each, assessing their negotiability, and highlighting known tensions or impossibilities.

  The core intuition any theory must capture is that rational agents should *defer* to known objective chances. If you know the chance of rain tomorrow is 80%, your credence in rain should be 0.8. This seems non-negotiable; failure here would make chance epistemically inert, undermining its role in guiding belief and action. The first major task is specifying *how* this deference works. Is it simply setting credence equal to chance? Or is it conditional? If conditional, on *what*? The conditioning proposition must encode both the chance fact ("chance of A is x") and crucially, the *total admissible evidence* available to the agent at that time. Lewis's PP conditioned on the "history of the world up to time t and the theory of chance T". The need for conditioning arises because chances themselves are often not directly known; we know them via theories or evidence. Without specifying *what* evidence is relevant for deference, the principle risks incoherence when the agent possesses information that seems incompatible with the chance value.

  This leads directly to the problem of *admissible evidence*. The theory must provide a principled account of what information an agent can possess that *doesn't* override the requirement to set credence equal to the known chance. Lewis characterized admissibility temporally: information entirely about the past and present is admissible, information about the future is generally not (except the chance theory itself). The problem forcing this requirement is simple: if an agent knows the *actual future outcome* (e.g., it *will* rain tomorrow), then even if the known chance was less than 1, their credence *should* be 1, not the chance. Future-tensed information seems paradigmatically inadmissible. However, the characterization of admissibility is deeply contentious. Why is past information admissible? Is information about the *nature* of chance (e.g., whether it's Humean or not) admissible? A theory needs a robust, non-circular account of admissibility. This is arguably a non-negotiable requirement, as without it, the deference principle is vague and potentially vacuous.

  The most notorious challenge is the problem of *undermining futures*, primarily (though not exclusively) within Humean theories of chance like Lewis's. Humeanism defines chances as patterns within the total history of the universe (the "Humean mosaic"). This creates a problem: it seems logically possible that the true chance theory T assigns a non-zero probability to a future F that, if it occurred, would make T *false* (because the pattern constituting the chance would be different). For example, T might say the chance of heads is 0.5, but a future dominated by heads might be such that, if it occurred, the best systematization would assign a *different* chance to heads. If an agent knows T and the entire history up to now, PP seems to demand they assign a credence of 0.5 to heads on the next toss. But if they also consider the *entire* future F (which includes the next toss being heads *and* the subsequent pattern), they might realize that F undermines T. If F is possible, PP combined with this total evidence might lead to contradiction or incoherent credences (e.g., credence in heads given T and history must be 0.5, but credence in T given history and the undermining future F might be zero). Any adequate theory must resolve this tension. For non-Humeans (who see chance as primitive), undermining is often not a problem, but for Humeans, it forces a modification of PP (like Lewis's "New Principle") or a rethinking of admissibility/deference. Resolving undermining is a non-negotiable requirement for consistency; the problem reveals a potential logical flaw in naive deference principles under certain metaphysical views.

  The theory must also be *metaphysically neutral* or argue convincingly for its preferred metaphysics. Chance is interpreted in radically different ways: Humean (reducing to patterns), Non-Humean (primitive, modal, propensity-based). The deference principle should ideally function under any plausible metaphysics or demonstrate why only one is viable. The undermining problem strongly suggests that the *form* of the deference principle might depend on the metaphysics. For instance, Humeanism seems to require something like the New Principle (credence(A | H_t & T) = T(A | H_t), where T(A | H_t) is the chance T assigns to A *conditional on the current history H_t*), which explicitly avoids assigning credence based on T(A) alone when T(A) might be undermined. Non-Humean views might be compatible with the original PP. The requirement for neutrality or a strong argument linking the principle to metaphysics is crucial; the theory shouldn't presuppose an uncontroversial metaphysics of chance. This is a strong desideratum, though some argue the very existence of undermining shows Humeanism is incompatible with a simple deference principle, making neutrality difficult.

  *Consistency with rational updating procedures* is essential. The deference principle must mesh coherently with *Bayesian conditionalization* (how agents update credences on new evidence) and principles like *van Fraassen's Reflection* (roughly, your current credence in A should equal your expectation of your future credence in A). Conflicts can arise. For example, if chances change over time (e.g., the chance of rain increases as clouds gather), conditionalization on new evidence about the present state might dictate a credence update, while the latest known chance might dictate another. The theory must explain how deference to current chance interacts with updating on evidence about the present/future that changes the chance estimate. Similarly, Reflection concerns coherence across time for the agent's *own* credences, while deference concerns aligning with an *external* chance. The theory must ensure these different normative demands don't pull the agent in contradictory directions. While some flexibility might exist in interpreting Reflection, fundamental inconsistency with core Bayesian norms like conditionalization would be a fatal flaw, making it non-negotiable.

  *Handling time-indexed, evolving chances* is critical. Chances are relative to times (chance at t of A happening). As time passes and events occur, chances change. The theory must explain how rational credence should respond to this evolution. When should an agent adopt the *current* chance as a guide? What if they know a *future* chance? (e.g., knowing the chance of rain *at noon* when it's now 11 am). Deference principles are typically formulated for the chance at the time of the agent's deliberation. But the theory needs to account for the dynamics – how credence based on past chances should relate to credence based on present chances, and how information about how chances *will* evolve should affect current credence. This is forced by the basic nature of chance and is a non-negotiable aspect of making the theory applicable to real agents in time.

  *Connection to Causal Decision Theory (CDT)* is vital for the practical role of chance. Chances are meant to be the quantities we use to weight outcomes in rational decision-making, especially in "Newcomb-style" problems where evidence is correlated with causes. CDT typically uses credences conditioned on actions, often informed by causal structure and chance. The deference principle should feed naturally into the credences used by CDT. If the recommended credences for belief don't align with the credences needed for rational action (e.g., if deference leads to credences that ignore relevant causal information), it creates a schism between epistemology and decision theory. Ensuring that chance-deferred credences are the right ones for CDT is a strong desideratum stemming from the functional role of chance in guiding action. While one might *theorize* a split, it weakens the case for chance being fundamental to rationality.

  Finally, the *conceptual status* of the principle must be addressed. Is it primarily a *constraint on the concept of chance* (telling us what objective chance *is* – namely, whatever satisfies this deference role for rational agents)? Or is it a *fundamental norm of rationality* (telling rational agents how they *ought* to set credences when they have knowledge of chances)? This distinction profoundly shapes the theory. If it defines chance (a "functionalist" or "conceptual role" view), then admissibility must be built into the concept itself, and metaphysics might be downstream. If it's a fundamental norm, then chance must be something independent that the norm reliably tracks, and admissibility needs grounding elsewhere. The choice affects how one resolves undermining or argues for metaphysical neutrality. Clarifying this status is crucial for understanding the theoretical foundations and is a non-negotiable requirement for philosophical coherence, though the *choice* itself is a major theoretical commitment.

  **On Joint Satisfiability and Impossibility Results:** The most significant tension arises specifically within **Humeanism**. Hall (1994) and Thau (1994) showed that the original Principal Principle (PP), combined with Humeanism and seemingly reasonable assumptions (like conditionalization and that chances are properties of the world), leads to contradiction in undermining scenarios. Lewis concluded that PP must be replaced for Humeans with the New Principle (NP): Cr(A | H_t & T) = T(A | H_t). This NP avoids the contradiction. However, NP is often seen as less intuitive than PP, and it makes admissibility or deference depend explicitly on the *entire* chance theory T and the conditioning on history H_t in a way that feels less direct. This creates a dilemma: under Humeanism, one arguably *cannot* have a deference principle that is as simple, direct, and intuitive as the original PP while also being logically consistent and handling undermining. This is the closest to a "no-go" result: PP + Humeanism + Core Logic → Contradiction (via Undermining). Resolving it requires sacrificing either Humeanism, the simplicity of PP, or arguably the idea that chances are epistemically fundamental in the simple way PP suggested. For Non-Humean views, the original PP often remains viable, avoiding the contradiction. Other tensions exist (e.g., between strict deference and certain interpretations of Reflection over time), but the Humean/PP clash is the most profound and well-established impossibility result in this domain.

  In sum, an adequate theory must navigate a complex web: providing a precise deference mechanism grounded in total admissible evidence, offering a principled account of admissibility, resolving undermining without contradiction, being metaphysically neutral or compellingly partisan, integrating seamlessly with Bayesian updating and related norms like Reflection, accounting for the temporal dynamics of chance, aligning with the credences required for causal decision theory, and clarifying whether the principle defines chance or regulates credence. The impossibility result concerning Humeanism and the original PP highlights how these demands can pull against each other, forcing substantive choices about the nature of chance and rationality. Your task is to find a path through this terrain that balances these demands coherently and persuasively.
