answer: |-
  <adjusting spectacles, leaning forward with focused intensity>  

  Your faith in the auctioneer is precisely the error, comrade. Lange’s board *can* mechanically adjust prices when inventories pile up or vanish — I grant that. But this confuses two distinct problems: *arithmetic* and *discovery*.  

  The auctioneer model assumes all relevant data — costs, substitutions, resource flows — are already *on the ledger*, waiting to be calculated. They are not. The knowledge of when a machine can be adapted, which idle material might serve as substitute, how worker morale affects output, or which local conditions make a shipment late — this exists only in the minds of the foreman, the engineer, the dockworker. It is *tacit*, dispersed, and often inarticulate. Crucially: it is generated *through* the act of real bargaining, risk-taking, and profit-seeking.  

  Prices in a real market are not just balancing mechanisms. They are *telegrams* summarising thousands of such local facts — facts the board *cannot see* until entrepreneurs test hypotheses against reality. Your board sees only *aggregate* shortages. It never learns *why* the shortage persists, or which of a hundred possible adjustments would resolve it most efficiently. The market does this by decentralizing experiment. Your board replaces dynamic discovery with static correction. The fatal flaw isn’t calculation — it’s *ignorance of what needs to be calculated*.  

  Now — how does your trial-and-error board elicit the knowledge it cannot possess?  

  *(Hayek pauses, steepling his fingers, awaiting your rebuttal)*
