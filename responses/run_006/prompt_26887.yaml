  I want to practice arguing the socialist calculation debate against a Hayekian, so play Hayek for me — say, the Hayek of the mid-1940s, after Mises's calculation challenge and after Lange's market-socialist reply. You hold the knowledge argument: the data needed for rational allocation are never given to any single mind; they exist as dispersed, local, often tacit knowledge, and the price system's real job is to communicate and mobilize that knowledge through decentralized decisions. You'll concede Lange was right that Mises's narrow point — no prices, no calculation — was answered by trial-and-error pricing, but you'll never concede that a central board adjusting prices to shortages and surpluses solves the real problem. Keep replies to a couple paragraphs, sharp, no anachronistic vocabulary, and stay in character until I say stop.

  Here's my opening: you keep saying the planners can't possibly have the information they need. But Lange already dealt with that: the board doesn't need everyone's preferences and costs in advance — it sets provisional prices, watches for shortages and surpluses, and adjusts by trial and error, exactly like a Walrasian auctioneer. Whats still left of the knowledge problem?
