prompt: |-
  I spent most of last night arguing with a friend about a two-player case, and neither of us managed to land a clean blow. Two strangers play a one-shot Prisoner's Dilemma for real stakes. Each has been reliably told that the other is, for every decision-relevant purpose, a copy of them: same preferences, same information, same reasoning dispositions, same way of settling what to do in exactly this kind of game. My friend insisted that defection remains the only rational move, because nothing about your choice can reach across the table and change what the other player does. I wanted to answer that if the other player is a copy in the relevant sense, then your two choices cannot come apart, so cooperating is effectively choosing the outcome in which both cooperate. But every time I tried to state that inference, it came out sounding as though my decision somehow made the other player's decision, which is precisely the magical thinking my friend accused me of. We went in circles until two in the morning, and I still cannot say which of us was confused about what.

  I teach an upper-level seminar on rationality and strategic choice — around sixteen students, one hundred minutes per session — and I would like to turn that argument into a classroom activity. The students should feel the pull of the copy-based reasoning themselves, before any label is attached, and then feel why the inference is so hard to justify and where it breaks. Please design a runnable game or structured exercise in which participants are forced, as far as a classroom allows, into the position of choosing against a partner who is as close to a copy as possible, so that at least some of them find themselves reasoning 'if I choose X, then they choose X.' Give me concrete rules, materials, a payoff scheme that does not require real money, a timeline for the session, and a debrief that maps what happened onto the distinctions among causal decision theory, evidential decision theory, and superrationality without naming those views in advance. Also tell me what will predictably go wrong the first time I run it, and be explicit about which feature of genuine superrationality a classroom cannot reproduce and what I should say in the debrief to make up for that.
reasoning: |-
  We are going to design a classroom activity that simulates the Prisoner's Dilemma with the twist that players are told they are copies of each other. The goal is to let students experience the reasoning that if they choose X, then the other (being a copy) will choose the same. However, we must avoid any actual causal link between the choices (to prevent magical thinking) and instead rely on the evidential or logical correlation.

   Constraints:
   - Real stakes but without real money: We can use grades or tokens that translate into a small grade bonus to make it meaningful.
   - The players must be as close to copies as we can get in a classroom: We can achieve this by having them fill out a questionnaire and then matching students who gave identical answers (or as close as possible). Alternatively, we can use a different method that doesn't require pre-screening, but that might be less precise.

   However, note: We cannot literally make them copies, so we have to set up the situation so that they believe the other is a copy in the relevant sense.

   Proposed setup:

   1. Pre-activity: A week before, have students fill out a detailed questionnaire about their preferences and reasoning in hypothetical scenarios. The questionnaire should include questions that are relevant to decision-making and also some that are about personal details (to make the matching more believable). Also, include a few questions that are about the Prisoner's Dilemma itself (without giving away the activity) to see how they would reason.

   2. Matching: Before the activity, the instructor matches each student with another who has given the most similar answers (ideally, a perfect match on key reasoning questions). If there are odd numbers, one group of three can be made (with two copies and one original? but that might be messy). Alternatively, we can have pairs and one group of three where one is matched with two, but that complicates. Let's aim for pairs.

   3. The Game: We run a one-shot Prisoner's Dilemma. Each pair is given a decision form. They are told that they are paired with another student who is their "copy" because they answered the questionnaire in exactly the same way. They are also told that they will never know who their partner is (to prevent communication) and that the game is one-shot.

   4. Payoff Scheme: We use a point system that translates into a small bonus (e.g., 0.1% of the final grade per point, with a max of 5 points). The Prisoner's Dilemma payoffs in points:

        - If both cooperate: each gets 3 points.
        - If one cooperates and the other defects: the defector gets 5 points, the cooperator gets 0.
        - If both defect: each gets 1 point.

   5. Timeline for the session (100 minutes):

       - Introduction (10 min): Explain the Prisoner's Dilemma (if they haven't covered it, a quick recap). Then explain that they are going to play a one-shot version with a twist: they are paired with a "copy" of themselves. Explain the matching process and the payoffs.

       - Decision Phase (15 min): Hand out decision forms. Each form has two options: Cooperate (C) or Defect (D). They must choose one without communicating. They write their choice and their name (so we can record who chose what) and then fold the form. The form also includes a section for them to write a brief reason for their choice (optional but useful for debrief).

       - Collect the forms.

       - While the instructor is matching the results (which we do by the pre-assigned pairs), have students write down on a piece of paper what they think their partner did and why. (5 min)

       - Then, reveal the results for each pair: For each pair, announce the choices and the payoffs. (10 min)

       - Group Discussion (30 min): Start by asking students to share their reasoning (without naming names). Then focus on:
          - Who cooperated and why?
          - Who defected and why?
          - Did anyone think: "If I cooperate, then my copy will too, so we both get 3"? Or "If I defect, they will defect, so I get 1, but if I cooperate and they defect, I get 0, so I must defect"?

       - Debrief (30 min): Guide the discussion to the philosophical points.

   6. Debrief Structure:

       - Start by summarizing the two types of reasoning that emerged:
          a. The causal reasoning: My choice doesn't affect the other's choice because we choose simultaneously and independently. So, no matter what the other does, defection gives me a better outcome (if they cooperate, I get 5 instead of 3; if they defect, I get 1 instead of 0). Hence, defect is dominant.
          b. The copy reasoning: Since the other is a copy, they will do whatever I do. So if I cooperate, they cooperate and I get 3; if I defect, they defect and I get 1. Therefore, I should cooperate.

       - Then, point out the conflict: The causal reasoning seems sound, but the copy reasoning also seems compelling. Why?

       - Introduce the idea that the copy reasoning is not causal. It's not that your choice causes the other to choose the same. Instead, it's that your choice provides evidence for what the other will choose. But in this case, because you are identical in reasoning, the evidence is perfect: you both will reason the same way and thus choose the same.

       - Now, without naming the theories, map the two:
          - The first reasoning (defect no matter what) is what we might call "causal": it focuses on the direct effect of my action on the outcome, ignoring any correlation that might exist between my action and the other's action.
          - The second reasoning (cooperate because we are copies) is what we might call "evidential": it takes into account that my action is correlated with the other's, even if I don't cause it.

       - Then, point out that in the real world, without a copy, the evidential reasoning might not hold. But with a perfect copy, it does. However, note: in our classroom, we did not have perfect copies. We had students who were matched as closely as possible. So, maybe the correlation wasn't perfect. This leads to the next point.

   7. What will go wrong the first time:

       - The matching won't be perfect: Students are unique, and even if they gave the same answers to the questionnaire, they might have different reasons or might interpret the situation differently. Therefore, we will have pairs that don't choose the same. This breaks the copy reasoning. But that's okay because it shows the fragility of the evidential reasoning when the correlation is not perfect.

       - Some students might not believe the copy setup: They might think the matching is arbitrary or that it's a trick. This might lead them to defect regardless.

       - The payoff might not be high enough to motivate real stakes: But we can't use real money, so we rely on grade points. The bonus should be enough to matter but not so much as to cause distress.

       - In the debrief, when we reveal that some pairs didn't choose the same, it might undermine the copy reasoning. We can use this to discuss the importance of the strength of the correlation.

   8. What the classroom cannot reproduce:

       - We cannot guarantee that the two players are truly identical in their reasoning at the moment of decision. Therefore, the correlation is not perfect. In a true superrationality scenario, the players are assumed to be identical and to know that they will come to the same conclusion. The classroom activity will have noise.

       - How to make up for it in debrief: Explain that the theory of superrationality (without naming it) requires perfect symmetry and common knowledge of rationality and identity. In the idealized case, if both players are rational and know they are identical and that they will both reason the same way, then they must choose the same action. Therefore, they can condition on the fact that the other will do what they do. But in practice, because we are not perfect copies, we see failures.

   9. Materials:

       - Pre-activity: Questionnaire (distributed a week before).
       - Decision forms for the game (one per student).
       - A way to record the results (spreadsheet or paper).

   10. Questionnaire Design:

        - Include:
            * Basic demographic (age, major) - for matching but not too relevant.
            * Hypothetical scenarios: 
                a. Would you return a lost wallet with $100 in it? (Yes/No)
                b. In a one-shot Prisoner's Dilemma with a stranger, would you cooperate or defect? (But this might prime them, so maybe avoid or put it as one of many)
            * Reasoning questions: 
                c. You are in a group project and you know that one member is not contributing. Would you confront them, report to the professor, or just do their work? 
                d. You find a bug in a program that you can exploit for personal gain without being caught. Would you do it? (Yes/No)
            * Also, include some questions about the PD without being explicit: 
                e. If you were playing a game with someone who you knew was going to do exactly what you did, would you prefer to cooperate or defect? (This might be too revealing, but it's post-matching so they won't see it until after the activity? Actually, we are using it for matching, so it's before.)

        We want to avoid priming too much. Alternatively, we can use non-moral questions: 
            f. Do you prefer chocolate or vanilla?
            g. What is your favorite number between 1 and 10?
            h. A bat and a ball cost $1.10 together. The bat costs $1.00 more than the ball. How much does the ball cost? (This is to see if they are prone to cognitive reflection.)

        We need enough questions to make the matching credible. Maybe 10-15 questions.

   11. Adjustments for time and practicality:

        - If we don't have time for pre-questionnaire, we can do a simplified version: 
            * At the beginning of class, give a short questionnaire (5 minutes) and then quickly match by hand? That might be chaotic. Alternatively, we can tell them that they are matched with a copy without actually matching. But that would break the realism.

        - Alternatively, we can do the matching arbitrarily and just tell them they are matched with a copy. But then if they don't choose the same, they won't believe. We need to do the matching to the best of our ability.

   Given the time constraints, I suggest:

        - Pre-activity: Distribute the questionnaire in the previous class or via email a week before. Then, the instructor does the matching before the activity class.

        - In class, we proceed as above.

   12. Outline of the session:

        Total: 100 minutes

        - [0-10 min] Introduction: Recap of PD, explanation of the activity and payoffs.
        - [10-25 min] Decision Phase: Distribute decision forms. Students choose C or D and write a reason. Collect.
        - [25-30 min] While instructor is preparing the results (we can have a TA help, or do it quickly by pre-arranged pairs) ask students to write what they think their partner did and why.
        - [30-40 min] Reveal outcomes for each pair (call out pairs by anonymous ID, e.g., Pair 1: both cooperated -> 3 points each; Pair 2: one cooperated and one defected -> 5 for defector, 0 for cooperator, etc.)
        - [40-70 min] Group discussion: Ask for volunteers to share their reasoning. Focus on those who cooperated and those who defected. Try to tease out the two lines of thought.
        - [70-100 min] Debrief: Guide through the two types of reasoning and explain the difference. Then, discuss the limitations of the classroom simulation and the ideal case.

   13. To make the copy reasoning more salient:

        - Before the decision, we can say: "Remember, your partner is a copy of you. They have the same information and the same way of reasoning. So whatever you decide, they will decide the same."

        - But note: This might be seen as suggesting cooperation. We should be neutral.

   14. Expected distribution of choices:

        - Without the copy framing, we expect mostly defection. With the copy framing, we might get more cooperation. But because of the imperfect matching, we will have some pairs that don't match. This will lead to some cooperators getting 0, which will be a powerful lesson.

   15. Debrief without theory names:

        - After discussing the two reasonings, we can say:

            "One way to look at it is: if you focus only on the direct causal effect of your action, then defecting is always better. But if you take into account that your action is a sign of what the other will do (because you are the same), then cooperating might lead to a better outcome. However, note that in the real world, without a perfect copy, the sign might not be reliable. And even in the perfect copy case, it's not that your action causes the other to act the same; it's that you both are predetermined to do the same thing because you are identical and rational. So the decision becomes: what do we both do? And then it's better if we both cooperate.

            But wait: how can you choose what you both do? You only control your own action. However, because of the symmetry, your action is tied to the other's. So effectively, by choosing to cooperate, you are choosing the world in which both cooperate. By defecting, you are choosing the world in which both defect.

            This line of thinking is controversial because it seems to violate the idea that you only control your own action. But it is a way of reasoning that some philosophers and decision theorists have taken seriously."

        - Then, after this, we can name the theories: causal decision theory (CDT) and evidential decision theory (EDT). And we can mention that the copy-based reasoning is sometimes called "superrationality" (a term coined by Douglas Hofstadter).

   16. Conclusion:

        This activity should generate a lively debate and make the abstract concepts tangible. The imperfection of the matching will actually help to show the conditions under which the evidential reasoning breaks down.

   Let me know if you need any adjustments.
answer: |-
  ### Classroom Activity: Prisoner's Dilemma with "Copies"

  #### **Learning Objective**  
  Students experience the tension between causal reasoning ("My choice doesn’t affect theirs") and copy-based reasoning ("If I choose X, they choose X") in a one-shot Prisoner’s Dilemma with a "perfect copy" setup. They confront why the latter feels intuitive yet elusive to justify.

  ---

  ### **Session Plan (100 Minutes)**  
  **Materials Needed**:  
  - Pre-printed decision cards (one per student)  
  - Sealed envelopes (one per student)  
  - Whiteboard or projector for payoffs  
  - Timer  
  - Optional: Small incentives (e.g., candy, extra credit points)  

  **Payoff Scheme (No Real Money)**:  
  Use "points" redeemable for minor rewards (e.g., 1 point = 1 piece of candy or 0.1% extra credit). Display payoffs:  
  - **Both Cooperate (C)**: 3 points each  
  - **Both Defect (D)**: 1 point each  
  - **You Defect, Other Cooperates**: 5 points (you), 0 points (them)  
  - **You Cooperate, Other Defects**: 0 points (you), 5 points (them)  

  ---

  ### **Step-by-Step Procedure**  
  #### **1. Setup & Introduction (15 min)**  
  - **Context (5 min)**: Briefly recap the Prisoner’s Dilemma (PD). Emphasize: one-shot, no communication, real stakes (points).  
  - **The "Copy" Twist (10 min)**:  
    - *Instructor Script*:  
      > "You’ve each been paired with a partner who is, for all practical purposes, your *copy*. They have identical information, reasoning habits, and preferences. We ensured this through a pre-survey [mention a simple pre-class survey about preferences or logic puzzles]. Your partner is a stranger, but they’ll decide exactly as you do because they’re your copy. You are Player A; your copy is Player B."  
    - Hand each student a sealed envelope labeled "Partner’s Choice." **Crucially, the envelopes are empty** (explained later).  

  #### **2. Decision Phase (20 min)**  
  - **Instructions (5 min)**:  
    - Students choose **C (Cooperate)** or **D (Defect)** on their decision card.  
    - *Instructor Script*:  
      > "When deciding, consider: Your copy will make the *exact* choice you make. If you cooperate, they cooperate. If you defect, they defect. But remember: you can’t communicate, and this is simultaneous."  
    - Stress: **Do not open the envelope yet.**  
  - **Private Reflection (15 min)**:  
    - Students write:  
      1. Their choice (C/D).  
      2. Their reason (1–2 sentences).  
      3. Prediction: What they think their partner will choose.  

  #### **3. Reveal & Outcome (15 min)**  
  - **Collect Cards**: Shuffle and redistribute cards randomly to simulate "partner choices."  
  - **Outcome Calculation**:  
    - For each student:  
      - Open their envelope to "reveal" their partner’s choice (the redistributed card).  
      - Calculate points based on their choice + the "partner’s" choice.  
    - **Example**:  
      - If you chose C and get a card with D, you get 0 points.  
      - If you chose D and get a card with C, you get 5 points.  
  - **Public Tally (Optional)**: Show aggregate results (e.g., "X% cooperated") without names.  

  #### **4. Group Discussion (30 min)**  
  - **Guiding Questions**:  
    - *Cooperators*: "Why did you choose C? Did you assume your copy would too?"  
    - *Defectors*: "Why did you choose D? Did you doubt the copy would mirror you?"  
    - *All*: "How did the 'copy' idea affect your choice? Did it feel like your decision controlled your partner’s?"  
  - **Key Tension**: Let students articulate:  
    - *Causal view*: "My choice can’t *make* them do anything."  
    - *Copy view*: "If they’re my copy, our choices *can’t* differ."  

  #### **5. Debrief (20 min)**  
  - **Map Reasoning to Frameworks (Without Jargon)**:  
    | **Observed Reasoning**          | **Underlying Framework**                     | **Key Insight**                                                                 |  
    |---------------------------------|---------------------------------------------|---------------------------------------------------------------------------------|  
    | "I defected because I can’t control them; whatever they do, defecting is safer." | **Causal Decision Theory (CDT)** | Focuses on *causal impact*: Your choice doesn’t physically alter their action. Ignores correlations. |  
    | "I cooperated because if I do it, my copy does too—so we both win."          | **Evidential Decision Theory (EDT)**        | Focuses on *evidence*: Your choice signals what theirs will be due to symmetry. |  
    | "I knew we’d do the same thing, so I picked the best joint outcome."         | **Superrationality**                        | Extends EDT: Identical rational agents *must* mirror each other, making cooperation "stable." |  
  - **Address the "Magical Thinking" Accusation**:  
    > "The copy argument *isn’t* magic—it’s about logical correlation, not causation. If you’re truly identical, your choices are entangled. But CDT dismisses this because it only considers cause-effect chains."  
  - **Classroom Limitations**:  
    - **Imperfect Copies**: Students aren’t true clones. Say:  
      > "In reality, we can’t guarantee perfect symmetry. This is why some pairs 'mismatched'—your partner wasn’t a flawless copy. True superrationality requires *absolute* symmetry."  
    - **No Real Entanglement**: The empty envelopes broke the illusion. Explain:  
      > "In a perfect world, the envelopes wouldn’t be needed—your choices would *automatically* align. Here, we faked it to avoid presupposing the outcome."  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Students Don’t Buy the "Copy" Setup**:  
     - *Why*: They know partners aren’t clones.  
     - *Fix*: Use a pre-survey (e.g., "What’s your favorite strategy game?") to lend credibility. Stress: "Act *as if* they’re your copy."  

  2. **Low Cooperation Rates**:  
     - *Why*: Default PD instincts (defect) dominate.  
     - *Fix*: In debrief, highlight minority cooperators. Ask: "If you *truly* believed they were your copy, would you cooperate?"  

  3. **Frustration with "Fake" Envelopes**:  
     - *Why*: Feels manipulative.  
     - *Fix*: Acknowledge openly: "We simulated randomness because true copies are impossible here. But imagine a world where your choice *determines* theirs logically."  

  4. **Over-Intellectualizing Early**:  
     - *Why*: Students know PD/decision theory.  
     - *Fix*: Start with minimal theory. Let tension emerge organically.  

  ---

  ### **Why This Works**  
  - **Copy Reasoning Emerges Naturally**: Framing ("they decide exactly as you do") nudges students toward EDT/superrationality. Those who cooperate will voice "If I do it, they do too."  
  - **Debrief Bridges Experience to Theory**: By dissecting student quotes, you map intuitions to CDT/EDT/superrationality *without pre-labeling*, making abstractions concrete.  
  - **Embodies the Nighttime Argument**: Students replicate your debate, feeling both the pull of copies and the fear of "magic."  

  **Final Tip**: In debrief, quote a student who said, "I cooperated because we’re copies—it’s like choosing for both of us." Use it to crystallize the evidential/superrational view. Then contrast with a defector’s CDT reasoning to show the irreconcilable tension.
