answer: |-
  Here is a comprehensive exam question package designed to meet your specifications, targeting the theoretical fault lines between Bratman, Searle, and Gilbert.

  ---

  ### 1. Essay Question

  **Vignette:** *The Library Collaboration*
  > Alex and Blair are both working independently on different sections of a large historical archive in a university library reading room. Alex is compiling data on 19th-century trade routes; Blair is researching labor conditions in the same period. They realize their projects overlap regionally and temporally. Without any explicit agreement, they begin sitting at adjacent desks. Alex systematically photographs pages relevant to shipping manifests, knowing Blair needs port records. Blair tags digital files with metadata they both use, aware Alex relies on consistent labeling. They periodically exchange USB drives without discussion, each using the other’s work to advance their own research. When a librarian asks if they are "working together," Alex says, "Not officially, just sharing resources efficiently." Blair nods in agreement but privately feels a sense of obligation to maintain the system, thinking it would be "letting Alex down" to stop.

  **Question:**  
  Using the case of Alex and Blair in *The Library Collaboration*, analyze whether their activity constitutes genuine joint action according to Bratman’s planning theory, Searle’s we-intention account, and Gilbert’s joint commitment account. Explain *why* each account yields its verdict, highlighting the distinct theoretical pressures exposed by the vignette’s ambiguity. Finally, argue which account provides the most compelling analysis of this case. Support your answer with precise references to each theory’s core conditions.

  ---

  ### 2. Model Answer (Approx. 800 words)

  *The Library Collaboration* presents a paradigmatic case of coordination ambiguous between parallel individual action and genuine joint action. Bratman, Searle, and Gilbert would analyze it differently due to their divergent foundations, revealing core tensions about interdependence, irreducibility, and normativity.

  **Bratman’s Planning Theory** would likely classify this as *not* genuine shared intentional activity. Bratman requires for shared intention: (i) mutual responsiveness; (ii) commitment to joint activity; (iii) commitment to mesh sub-plans; and (iv) mutual knowledge of (i)–(iii) (*Shared Agency*, Ch. 2). Here, Alex and Blair exhibit mutual responsiveness (exchanging files) and perhaps mutual knowledge of coordination. However, they lack commitments *to the joint activity itself*. Alex explicitly denies collaboration ("Not officially"), framing actions as instrumental to individual goals ("sharing resources efficiently"). Blair’s sense of obligation is unilateral, not grounded in a mutual commitment recognized by both. Crucially, Bratman requires interdependence in *intention*: each must intend that *we* act together in a way that meshes sub-plans. Here, both intend *that the other helps them individually*, not that *we collaborate*. The coordination is a side effect of individual planning, not a shared plan. Bratman’s verdict thus turns on the *individualistic reducibility* of attitudes and the absence of interdependent intentions oriented toward "we-action."

  **Searle’s We-Intention Account** would see this as *borderline but likely not* genuine joint action. Searle argues that collective intentionality is a biological primitive: a "we-intention" in the mind of an individual that cannot be reduced to "I-intentions + mutual beliefs" (*The Construction of Social Reality*, Ch. 3). A we-intention has the form "We intend to do A," where "we" is not analyzable distributively. The vignette shows coordination but no evidence of such primitive we-intentions. Alex disavows joint action, and Blair’s attitude ("letting Alex down") is individualistic (an "I-intention" about personal ethics). Searle might concede that their actions *function* jointly but would insist that without each internally possessing an irreducible "we-mode" intention directed at a *shared goal* (not merely convergent individual goals), it remains merely individual intentionality with mutual responsiveness. The asymmetry in Blair’s attitude is fatal: joint action requires *each* to have a we-intention, not one party feeling obligation while the other sees only efficiency. Searle’s verdict hinges on the *irreducibility of the collective mode* and the absence of a shared goal represented *as* shared in consciousness.

  **Gilbert’s Joint Commitment Account** would identify this as *genuine but fragile* joint action. Gilbert requires that parties form a "joint commitment" through expressed readiness to commit together, creating correlative rights and obligations (*Joint Commitment*, Ch. 1). Here, the *actions* of coordinated resource-sharing and desk proximity constitute public expressions of readiness to cooperate. Blair’s sense of obligation aligns with Gilbert’s normative structure: obligations arise from joint commitment, not morality. Crucially, Alex’s denial ("Not officially") is ambiguous—it rejects formal collaboration but doesn’t negate the de facto commitment enacted through behavior. Gilbert emphasizes that joint commitment can be implicit; verbal disclaimers may not override constitutive actions. The asymmetry (Blair feels obligation, Alex sees efficiency) is problematic but not decisive: Alex still *acts* in ways that sustain the commitment, and obligations exist objectively once commitment is formed, even if one party misdescribes them. Gilbert’s verdict rests on the *normative scaffold* created by behavioral expressions of commitment, treating obligations as constitutive of joint action.

  **Theoretical Disagreement Exposed:** The vignette targets three fault lines:  
  1. **Reducibility vs. Irreducibility**: Bratman requires interdependent individual attitudes; Searle requires non-reducible we-intentions.  
  2. **Normativity’s Role**: Gilbert makes obligations essential; Bratman and Searle treat normativity as derivative (from plans or collective psychology).  
  3. **Behavior vs. Attitude**: Gilbert prioritizes public acts of commitment; Bratman and Searle focus on internal mental states (intentions in plans or we-mode).  
  The asymmetry in attitudes (Alex’s instrumentalism vs. Blair’s felt obligation) strains Bratman’s interdependence and Searle’s shared goal requirement but is partially resolvable under Gilbert’s focus on enacted commitments.

  **Why Gilbert’s Account Fits Best:**  
  Gilbert offers the most compelling analysis. Bratman and Searle overemphasize internal attitudes, neglecting how *practices* can generate joint action without full subjective alignment. Alex’s denial is contradicted by their sustained, responsive actions that *function* as commitment. Gilbert captures Blair’s obligation not as a personal quirk but as an emergent normative fact: joint action inherently creates duties, irrespective of how participants articulate them. Searle cannot explain why Blair’s attitude differs from Alex’s without we-intentions; Bratman cannot explain Blair’s sense of obligation without circularity (it doesn’t stem from a shared plan). Gilbert handles the asymmetry by distinguishing between the *existence* of obligations (from joint commitment) and *acknowledgment* of them (Alex may be practically committed while verbally dissenting). The vignette shows joint action emerging from practice, not prior agreement or shared mental states—precisely where Gilbert’s normative, behaviorally anchored account excels.

  ---

  ### 3. Marking Scheme (Total: 25 marks)

  | **Criterion**                                                                 | **Marks** | **A-Level vs. B-Level Distinction**                                                                                                                                                               |
  |-------------------------------------------------------------------------------|-----------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **(i) Accurate reconstruction of each account’s conditions**                  | 6         | **A:** Precise articulation of *all* key conditions (e.g., Bratman’s 4 criteria, Searle’s irreducibility, Gilbert’s obligation from joint commitment). <br> **B:** Incomplete/muddled conditions (e.g., omitting Bratman’s mesh sub-plans). |
  | **(ii) Correct application to the vignette**                                  | 6         | **A:** Uses specific vignette details (e.g., Alex’s denial, Blair’s obligation, USB exchanges) to justify verdicts for each account. <br> **B:** Generic summary; weak link between theory and case.                              |
  | **(iii) Identification of deeper theoretical disagreement**                   | 6         | **A:** Diagnoses 2–3 core fault lines (e.g., reducibility, normativity, behavior vs. attitude) exposed by asymmetry. <br> **B:** Superficial comparison (e.g., "they define joint action differently").                     |
  | **(iv) Argument for best-handling account**                                   | 5         | **A:** Non-question-begging argument (e.g., Gilbert resolves asymmetry via practice-based norms; counters objections to verbal denial). <br> **B:** Assertion without engagement; ignores counterarguments.                |
  | **(v) Clarity and philosophical precision**                                   | 2         | **A:** Structured, jargon-free prose; distinguishes concepts (e.g., "obligation" vs. "intention"). <br> **B:** Disorganized; conflates terms (e.g., "we-intention" as synonym for "shared goal").                    |

  ---

  ### Design Notes:
  - **Vignette Choice**: Asymmetry in commitment (Alex’s instrumentalism vs. Blair’s felt obligation) directly challenges:
    - Bratman’s interdependence and mutual commitment requirements.
    - Searle’s need for symmetric we-intentions.
    - Gilbert’s ability to handle partial acknowledgment of obligations.
  - **Pressure Points**: Targets reducibility (Bratman vs. Searle), normativity (Gilbert vs. others), and whether behavior can constitute joint action without shared attitudes.
  - **Pedagogical Aim**: Rewards students who grasp *why* the theories differ (e.g., Bratman’s individualistic reductionism vs. Searle’s primitivism vs. Gilbert’s normativity) by forcing them to deploy concepts on ambiguous ground.

  This question pushes students beyond summary to analyze how foundational commitments (e.g., Bratman’s planning structures, Searle’s biological primitives, Gilbert’s deontic relations) generate divergent verdicts in borderline cases.
