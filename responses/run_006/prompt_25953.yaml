prompt: |-
  I'm a graduate student TA for an introductory philosophy of science course, and in two weeks I have to teach Hempel's raven paradox to a section of about twenty-five second-year undergraduates. Most of them are not philosophy majors; they're taking the course to satisfy a distribution requirement, and they arrive with the working assumption that science is about gathering evidence that supports theories, end of story. The professor has covered the hypothetico-deductive model and basic confirmation theory in lecture, so the students have heard the Nicod criterion and the idea that a universal generalization is confirmed by its instances. But they have not yet seen the paradox, and the lecture slot before my section will introduce it only briefly.

  I want you to plan how I should teach the paradox in a fifty-minute section. Do not explain the paradox to me; I already understand it. Instead, give me the sequence of ideas I should present and the order in which they must appear, with the dependency structure made explicit: what must be in place before what, and why. Give me the one carrying example that should run through the whole session, and tell me what that example needs to have and what it must lack for it to work. Identify the misconceptions the students will predictably form at each stage, and tell me at exactly which point in the sequence I should head each one off and how. I also want to know what I should openly refuse to resolve at this level and why. Finally, give me one question I can ask in the last three minutes that will tell me whether they have understood the paradox itself rather than merely memorized the steps or decided it is silly. Your response should be continuous prose, the way you would write an email or a letter: no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, the user is a graduate TA preparing to teach Hempel's raven paradox to undergrads in a philosophy of science course. They need a structured lesson plan that builds understanding step-by-step. 

  First, I should consider the students' background - they're mostly non-majors who think science is just "gathering evidence for theories." The prof covered Nicod criterion and hypothetico-deductive model, so I can build on that. The lecture will introduce the paradox briefly, so my section must deepen understanding without rehashing basics.

  The core challenge is making the paradox feel visceral, not abstract. I'll need to choose one carrying example that's simple yet reveals all necessary aspects: it must show equivalence between universal generalizations, have observable instances, and avoid distracting complexities. A non-black non-raven example seems best - maybe white shoes since it's classic and relatable.

  The sequence must be airtight: start with Nicod's intuitive view, then show how "all ravens are black" logically implies "all non-black things are non-ravens," then demonstrate that observing a white shoe confirms the contrapositive. That's where the paradox bites - students will revolt because shoes "shouldn't" confirm raven theories. 

  I anticipate three big misconceptions: 
  1) That the equivalence is wrong (must head off immediately with truth-table or simple substitution) 
  2) That "confirms" implies practical usefulness (need to clarify it's about logical support, not research heuristics) 
  3) That we're saying shoes are good evidence (emphasize it's about formal implications, not actual scientific practice)

  Crucially, I should refuse to resolve the paradox - the goal is to make them feel its force, not solve it. In the last 3 minutes, a good check question would be: "If we accept Nicod and equivalence, why does observing a red apple feel irrelevant to raven color theories?" This tests if they grasp why it's paradoxical rather than just absurd.

  Timing-wise: Spend 15 mins establishing Nicod+equivalence, 20 mins on the white shoe example and their objections, 10 mins on why it matters, and 5 mins for Q&A. Keep it concrete - no symbols, just "if P then Q" type language.
answer: |-
  Here’s how I’d structure your fifty-minute section, building on the lecture’s foundation while respecting your students’ background and the need for conceptual clarity. Let’s use **"All ravens are black"** as the core example throughout, paired with its contrapositive **"All non-black things are non-ravens"**. This example works because it’s simple, memorable, and sharply exposes the paradox’s core tension between intuition and logic. Crucially, it lacks complicating factors (e.g., probabilistic reasoning, background knowledge) that would obscure the formal dilemma at this stage.

  **First (5-7 mins): Re-anchor Nicod & Equivalence.**  
  Start by asking students to recall Nicod’s criterion: Observing a black raven confirms "All ravens are black." Reinforce this with everyday examples (e.g., seeing a red apple confirms "All apples in this basket are red"). Then, introduce logical equivalence: "All ravens are black" (∀x (Raven(x) → Black(x))) is *logically equivalent* to "All non-black things are non-ravens" (∀x (~Black(x) → ~Raven(x))). Use a truth table or simple substitution (e.g., "If it’s a raven, then black" means "If not black, then not a raven") to make equivalence undeniable. *Why now?* Nicod is their anchor; equivalence is the lever that forces the paradox. *Misconception to head off immediately:* Students might think equivalence is approximate or context-dependent. Stress this is deductive logic—if one is true, the other *must* be true, always.  

  **Second (15 mins): Apply Nicod to the Contrapositive.**  
  Ask: "If Nicod holds, what confirms 'All non-black things are non-ravens'?" Guide them: Observing a non-black non-raven (e.g., a **white shoe**) should confirm it. Then, hammer the implication: Since the contrapositive is equivalent to "All ravens are black," the white shoe *also confirms the original hypothesis*. *Why now?* This step generates the "aha" moment of absurdity. *Crucial misconception:* Students will protest, "But a shoe has nothing to do with ravens!" Acknowledge the intuition, but insist: "I agree it *feels* wrong. But based on *logic alone*—Nicod plus equivalence—why isn’t this valid?" Force them to articulate why logic clashes with intuition.  

  **Third (15 mins): Explore the Tension & Formalize the Paradox.**  
  Pose the paradox explicitly: "Why does observing a white shoe *logically confirm* 'All ravens are black' while seeming *scientifically irrelevant*?" Break this into two questions:  
  (1) *Is the logic sound?* (Yes: Nicod applies to the contrapositive, and equivalence transfers confirmation.)  
  (2) *Does this align with scientific practice?* (No: Scientists wouldn’t study shoes to test raven color.) *Why now?* Separating the logical validity from scientific utility prevents dismissal. *Key misconceptions:*  
  - *"The equivalence is wrong in practice."* Clarify: We’re not saying shoes *cause* ravens to be black; we’re saying they entail the same universal claim.  
  - *"Nicod only applies to 'direct' evidence."* Reiterate Nicod’s universality: It treats any instance of the hypothesis form equally.  
  - *"This makes science trivial."* Agree it *seems* to, but emphasize we’re exposing a problem in the theory, not endorsing shoe-based ornithology.  

  **Fourth (10 mins): Why This Matters & What We Won’t Solve.**  
  Stress that Hempel isn’t claiming scientists *should* examine shoes. The paradox reveals a flaw in **naive confirmation theory**: Nicod’s criterion + equivalence licenses absurd confirmation. Openly state: *We won’t resolve this today.* Solutions (e.g., Bayesian approaches, relevance criteria) require tools beyond this intro. Our goal is to see why "science is just gathering supporting instances" is incomplete. *Why now?* Contextualizing the paradox preempts frustration and shows philosophy’s role in probing assumptions. *Final misconception:* *"So science is illogical?"* Correct this: No—it means our *initial model* of confirmation is oversimplified; better models exist but are more complex.  

  **Closing Question (Last 3 mins):**  
  Ask: **"If we insist that observing a white shoe does *not* confirm 'All ravens are black,' which of our starting assumptions must we reject—Nicod’s criterion or the logical equivalence—and why would rejecting either be problematic for a simple model of confirmation?"**  
  This tests understanding of the paradox’s *structure* (not just the steps). Correct answers should identify:  
  - Rejecting Nicod undermines the idea that instances straightforwardly confirm generalizations.  
  - Rejecting equivalence breaks deductive logic, making hypothesis testing unmanageable.  
  Any answer citing "shoes aren’t relevant" or "it’s just silly" signals they missed the formal dilemma.  

  **Pacing Notes:** Keep the white shoe example central. When confusion arises, return to it: "Does the shoe fit Nicod? Does it fit the contrapositive? Does equivalence hold?" This concrete reference prevents abstraction overload. Stay firm on refusing resolutions—embracing the discomfort is pedagogically essential. Your role is to make the paradox *live* for them as a genuine philosophical problem, not a trick. Their intuition is the ally that makes the paradox bite; let it clash with logic, then show why that clash matters. Good luck!
