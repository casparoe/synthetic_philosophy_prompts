  ### Thought Experiment: The Tenure-Track Trap

  Dr. Elena Rossi is a junior professor on the tenure track at a competitive university. Her career requires publishing groundbreaking research, but she knows her productivity is hampered by chronic procrastination. She has tried precommitment devices: blocking social media, hiring writing coaches, and setting up automatic donations to a despised political group if she misses deadlines. Despite this, she sometimes gives in to immediate gratification—binge-watching shows or attending social events—when deadlines loom, rationalizing that one lapse won't matter. Her department chair warns that her inconsistent output jeopardizes tenure.  

  Elena learns of an intensive, evidence-based "focus enhancement" retreat. It uses cognitive retraining to instill an obsessive belief that work interruptions are morally catastrophic. Participants emerge with a deep, inflexible conviction that any non-work activity during designated hours is unconscionable laziness. Elena enrolls, knowing the program permanently alters her psychology. Post-retreat, she works relentlessly, even skipping her sister’s wedding to meet a minor deadline. She publishes prolifically and secures tenure. Yet, at the wedding’s start time, she feels visceral dread at the thought of leaving her desk, believing it would "ruin her integrity."  

  **(a) Irrationality of the later action**  
  At the moment Elena misses her sister’s wedding, her action is irrational. By her *original* values—which prized family, balance, and reasoned trade-offs—the cost of damaging a key relationship far outweighs the negligible benefit of polishing a nearly complete paper (due in a week). Objectively, skipping the wedding has high emotional and reputational costs, while the deadline could be met later with minimal risk. But her altered self overestimates the harm of pausing work (viewing it as "moral failure") and underestimates the social cost. Her choice stems from distorted beliefs, not a rational cost-benefit analysis.  

  **(b) Rationality of the earlier decision**  
  When Elena initially chooses the retreat, she is rational. Her original self calculates:  
  - Without intervention, procrastination may cost her tenure (a 50% chance, per her track record), with catastrophic career and financial repercussions.  
  - Precommitment tools have failed against strong temptations, as they rely on external penalties she can override when impulses peak.  
  - The retreat guarantees tenure by making work non-negotiable, with high expected utility: tenure’s lifelong benefits outweigh the fixed cost of the program and the rare, severe irrational acts (e.g., missing one wedding).  
  By her original values, this maximizes her long-term goals—security, professional impact—making self-alteration the optimal strategy.  

  **(c) Why ordinary solutions fail**  
  - **Precommitment**: Devices like penalty contracts are revocable; Elena’s future self can pay the cost (e.g., losing money) if the immediate temptation exceeds it (e.g., a wedding invitation). The altered self eliminates temptation itself.  
  - **Reputation**: Elena’s procrastination is private; colleagues don’t monitor her daily habits, so reputation mechanisms (e.g., promising others) lack leverage.  
  - **Credible promises**: A rational future self cannot credibly commit to work when faced with a superior alternative (e.g., a wedding), as reneging is instrumentally rational then. Self-alteration makes the promise *unbreakable* by changing her underlying desires.  
  The key feature is **internalization**: the retreat makes work an inflexible personal norm, so no "choice" exists at the moment of action. Ordinary tools operate externally, leaving room for rational overrides.  

  **(d) Unified rational-agent reply**  
  A defender of unified rationality might argue Elena’s choice is time-inconsistent and thus globally irrational. They could contend:  
  1. **Parasitic preferences**: The "altered" Elena’s values are irrational by definition, so enabling them cannot be rational. A truly unified agent would seek consistent, reason-responsive strategies (e.g., incremental habit-building).  
  2. **Underestimated costs**: The original self underestimates future irrationality’s costs (e.g., estranged family causing long-term regret), making the retreat suboptimal ex ante.  
  3. **Slippery slope**: Self-alteration risks unintended consequences (e.g., workaholism damaging health), undermining the original goal of well-being.  

  ### Structural Assumption Challenged  
  The case most directly pressures the assumption of **diachronic identity**: that an agent is a single, continuous entity with stable, reason-responsive preferences over time. Here, rationality requires treating the future self as a separate "threat" to be controlled through fundamental change, undermining the idea that rational agents maximize a consistent utility function across time.
