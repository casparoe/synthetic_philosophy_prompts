  We are constructing a realistic scenario where an agent deliberately changes herself to become irrational in the future because that irrational future self will act in a way that her current rational self desires, but which a rational future self would not do. The scenario must be ordinary, without exotic elements.

  **Scenario: The Gym Commitment**

  Sarah, a rational and health-conscious individual, knows that regular exercise is crucial for her long-term health. However, she also knows from past experience that she often fails to maintain her gym routine due to short-term temptations (like staying in to watch TV or going out with friends). She is considering signing up for an expensive, non-refundable year-long gym membership with a contractual clause that imposes a heavy penalty for any missed session (e.g., $50 per missed session, automatically charged). While this would commit her to attending, she worries that the penalty might not be enough when faced with a strong temptation (e.g., a friend's birthday party on a gym night). 

  Instead, Sarah decides on a different approach. She signs up for a specialized "motivational program" run by a reputable company. The program uses proven psychological techniques (like cognitive behavioral therapy and positive reinforcement) to instill a deep, almost compulsive belief in the absolute necessity of daily exercise. The program is intense and lasts a month, during which Sarah is immersed in an environment that reinforces the idea that missing a workout is catastrophic for her health and self-worth. After completing the program, Sarah develops an exaggerated belief about the consequences of missing a workout: she now feels intense anxiety at the thought of skipping, to the point that she would choose the gym over almost any other opportunity, even when the costs are clearly unreasonable (e.g., skipping her best friend's wedding to attend a gym session). 

  By undergoing this program, Sarah ensures she will go to the gym consistently. However, the program has changed her preferences and beliefs in a way that makes her future behavior irrational by her original standards. 

  **(a) Why the later action is irrational at the moment it is performed**

  At a future date, Sarah faces a choice: attend a critical work event (or a close friend's wedding) that conflicts with her gym session. Her original self would have weighed the costs and benefits and concluded that the social or professional cost of missing the event far outweighs the benefit of that single gym session (especially since she is already in good shape and missing one session has negligible health impact). However, due to the program, Sarah now experiences overwhelming anxiety at the thought of missing the gym. She irrationally overestimates the harm of missing one session (believing it will ruin her health progress) and irrationally undervalues the social cost. Thus, she chooses the gym over the event. This action is irrational because, by any objective standard (and by her original values), the gym session is not worth the huge social cost.

  **(b) Why the earlier decision to become that later agent is rational at the moment it is made**

  At the time she decides to undergo the program, Sarah is fully rational. She knows that without such a drastic change, she will likely skip many gym sessions, leading to poor health outcomes in the long run. She has tried less extreme methods (like precommitment via a penalty contract) but found that they sometimes fail when the immediate temptation is strong enough. The program, by altering her fundamental beliefs and preferences, guarantees perfect gym attendance. The expected health benefits (and avoidance of future health costs) outweigh the one-time cost of the program and the occasional future irrational acts (like missing a major event). Moreover, she expects that the rare irrational act (e.g., missing a wedding) will be more than offset by the consistent health benefits. Thus, by her current rational calculation, the decision to change herself is the best available strategy for achieving her long-term health goals.

  **(c) What specific feature prevents ordinary precommitment, reputation, or credible promise?**

  Ordinary precommitment (like the penalty contract) is not fully reliable because Sarah, in a moment of weakness, might still choose to pay the penalty if the immediate temptation is strong enough (e.g., the joy of a once-in-a-lifetime event). Reputation is not relevant because the gym attendance is a private matter (no one else is monitoring her, and her gym attendance doesn't affect her reputation with others). A credible promise to herself is not possible because she knows that when the future temptation arises, her future self (without the altered beliefs) will not have sufficient reason to keep the promise. The key feature is that the change is durable and internal: by altering her own preferences and beliefs, she removes the possibility of future rational reconsideration in the face of temptation. The ordinary methods rely on external incentives or self-control, which can be overridden by strong immediate desires, whereas the self-alteration changes the very desires and beliefs that drive the decision.

  **(d) How a defender of a unified rational-agent account might reply**

  A defender of a unified rational-agent account (who believes that rationality should be consistent across time and that the agent is one and the same) might argue that Sarah's decision to alter herself is not truly rational because it creates a future self that is irrational and thus causes her to act against her own interests in some situations. They might say that a truly rational agent would find a way to align incentives without self-destruction. For instance, they could suggest that Sarah should instead invest in building habits gradually or find a less extreme form of precommitment (like a gym buddy or a more flexible contract). They might also argue that the cost of the occasional irrational act (missing a wedding) is too high and that Sarah's original calculation underestimates these costs. Moreover, they might question whether the program's effect is truly durable and whether it might have other negative side effects (like anxiety in other areas of life). Thus, they might conclude that the decision to undergo the program was not, in fact, optimal.

  **The structural assumption about the continuity of the agent over time that the case pressures**

  The case most directly pressures the assumption that the agent is a unified entity with consistent values and beliefs over time. It suggests that the agent at time T1 and the agent at time T2 are so different (due to the deliberate self-alteration) that we might question whether they are the same person in a meaningful sense for the purpose of rational decision-making. The scenario highlights that the rational self at T1 may have to treat the future self at T2 as a distinct entity with different values, and thus the best strategy might be to change that future entity to ensure compliance with T1's goals. This challenges the idea that rationality is about maximizing the same utility function over time and suggests that rational choice might sometimes require creating a future self that is irrational by current standards.
