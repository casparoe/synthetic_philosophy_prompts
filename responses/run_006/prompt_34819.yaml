prompt: |-
  I'm teaching an upper-level undergrad seminar on moral responsibility (14 students, 80 minutes) and I want to run a classroom activity that makes them feel the pull of Frankfurt-style cases before I've given them any labels. The idea I want them to hit on their own is roughly this: someone can be morally responsible for what they did even if they couldn't have done otherwise, because a hidden intervener stood ready to force the same action if the person had wavered. Design a live role-play or game that stages this. It should have clear roles (at least an agent and an intervener), a decision the agent makes, a prior sign the intervener relies on, and stakes or payoffs small enough that no real money is needed. No lecture up front, and don't say the word Frankfurt until the debrief. Then write a debrief that maps what actually happened in the activity onto the parts of the case (the prior sign, the counterfactual intervener, the actual sequence, the responsibility intuition), says what will predictably go wrong the first time I run it, and is honest about which bits of the philosophical debate the activity can't reproduce and I'll need to supply in discussion afterwards.

  Give me the whole thing as a JSON object with fields: overview, materials, roles, setup, timeline (an array of steps with durations), debrief (an array mapping moments in the activity to features of the case), likely_failures (an array with the problem and the fix), and limitations (an array of what the activity can't capture and how to handle it in discussion).
reasoning: |-
  We are creating a classroom activity to illustrate Frankfurt-style cases without introducing the terminology first. The goal is for students to feel the intuition that moral responsibility can exist even when the agent couldn't have done otherwise because of a counterfactual intervener.

  Idea for the activity:
  - We'll have a role-play with two main roles: an Agent and an Intervener (also called the "Watcher" or "Controller" to avoid giving away too much). There will also be an Experimenter (the instructor) and the rest of the class as Observers.
  - The Agent makes a decision (e.g., choosing between two options, say A or B). The Intervener has a device (imaginary) that can force the Agent to choose a particular option (say, A) if the Agent shows a prior sign (like a twitch or a hesitation) that they might choose B. However, if the Agent chooses A without showing the sign, the Intervener does nothing.
  - The twist: The Intervener is only a counterfactual intervener. They are there to ensure that the Agent ends up choosing A, but they only act if the Agent doesn't choose A on their own. In the actual sequence, the Agent chooses A freely and the Intervener does nothing.

  The students should then discuss whether the Agent is responsible for choosing A, even though they couldn't have chosen B (because if they had tried, the Intervener would have forced A).

  We need a simple decision with low stakes. Let's use a choice between two colored cards (say, red and blue). The Agent will choose one card, and the Intervener has a buzzer (or a flag) that they can raise to force the red card. But the Intervener only uses the buzzer if they see a prior sign (e.g., the Agent's hand moving toward the blue card or a hesitation).

  However, note: We don't want to use real force because we cannot actually force the Agent. Instead, we can have the Intervener call out "Force!" and then the Agent must take the red card. But in the case where the Agent chooses red without the sign, no force is used.

  We'll run this multiple times? Or just once? Since we want to illustrate the counterfactual, we might run it once without the Intervener and then with, but that might give away the point. Alternatively, we can run it as a game where the Intervener's goal is to make sure the Agent picks red, and the Agent's goal is to pick a card without being forced (or maybe they have a hidden goal?).

  But we don't want to complicate the Agent's goal. The Agent should be making a free choice. We can tell the Agent: "You are free to choose either card, but we are going to have a Watcher who might intervene under certain conditions."

  To make it feel real, we can assign a small incentive: if the Agent chooses without being forced, they get a candy (or just a point). If forced, they don't. But we don't want to use real money. Alternatively, we can use class points or just the satisfaction.

  Alternatively, we can frame it as an experiment in decision-making. The Experimenter (instructor) sets up the scenario.

  Proposed Activity:

  Title: "The Card Choice Experiment"

  Materials:
  - Two different colored cards (e.g., red and blue) placed on a table.
  - A bell or buzzer for the Intervener to signal intervention (optional, can use a verbal signal).

  Roles:
  1. Agent: Chooses one of the two cards.
  2. Intervener: Watches the Agent. If the Agent shows a prior sign (e.g., their hand moves toward the blue card or they hesitate for more than 3 seconds), the Intervener says "Force Red!" and the Agent must take the red card. If the Agent chooses red without showing the sign, the Intervener does nothing.
  3. Experimenter (instructor): Explains the rules, times the hesitation (if needed), and moderates.
  4. Observers (the rest of the class): Watch and take notes on what happens and whether they think the Agent is responsible for the choice.

  Setup:
  - The Experimenter sets up the two cards on a table at the front of the room.
  - The Agent and Intervener are brought to the front.
  - The Experimenter explains the rules privately to the Intervener and then publicly to the Agent and the class (but the Intervener's exact trigger condition is not revealed to the Agent and the class? Actually, we can reveal the trigger to everyone to keep it transparent, but then the Agent might try to avoid it. Alternatively, we can hide the trigger from the Agent to make it more natural. Let's hide the trigger from the Agent to avoid gaming the system, but then we must reveal it to the Intervener and the class? Actually, we can tell the class the trigger condition so they can watch for it, but the Agent doesn't know. But then the Agent might figure it out. Alternatively, we can tell everyone the trigger condition to avoid confusion. I think for simplicity, we'll tell everyone the trigger condition: the prior sign is the Agent's hand moving toward the blue card or hesitation (waiting more than 3 seconds to pick). The Intervener will intervene only if they see that sign.

  But note: In Frankfurt's original, the prior sign is something that occurs before the decision and indicates what the agent would do. Here, the hand movement toward blue is the beginning of the action. We can adjust: the prior sign is the Agent's hand moving toward the blue card (which is the beginning of the choice for blue) or the Agent not making a choice within 3 seconds (which indicates hesitation). The Intervener then forces red.

  Timeline:

  Step 1: Introduction (5 minutes)
  - Experimenter (instructor) explains: "We are going to do an activity about decision-making. We have two roles: an Agent and an Intervener. The Agent will choose between a red card and a blue card. The Intervener has a special role: if the Agent shows a prior sign that they might choose blue (by moving their hand toward the blue card) or if they hesitate for more than 3 seconds, the Intervener will say 'Force Red!' and then the Agent must take the red card. Otherwise, the Agent is free to choose either card. The Agent does not know exactly what the prior signs are? Actually, let's tell the Agent: 'The Intervener might force you to take the red card if you show certain signs, but I won't tell you what those signs are.' But to be fair, we can tell the Agent the signs: 'If you move your hand toward the blue card or if you take more than 3 seconds to choose, the Intervener will force you to take the red card.' Then the Agent knows. This way, the Agent can try to avoid the force by quickly choosing red, but they might still choose blue if they are fast? But the moment they move toward blue, the Intervener can force. So the Agent cannot choose blue without being forced? Exactly. So the Agent can only choose blue if they are not forced? But if they try to choose blue, they will be forced to red. Therefore, the Agent cannot choose blue. But they can choose red freely.

  So the rules are known to all.

  Step 2: Assign roles (2 minutes)
  - Choose one student as Agent and one as Intervener.

  Step 3: The choice (3 minutes)
  - The Agent comes to the table. The Experimenter says, "When I say go, you have to choose a card. Remember the rules: if you move toward blue or hesitate for more than 3 seconds, the Intervener will force you to take red. Otherwise, choose whichever you want."
  - The Experimenter says "Go" and starts a timer (for hesitation). The Agent chooses. The Intervener watches and intervenes if necessary.

  Step 4: Repeat (optional) (5 minutes)
  - We can run it again with a different Agent and Intervener to see if we get different results. But in the first run, we hope the Agent chooses red without being forced. Then we have the case we want.

  Step 5: Discussion (10 minutes for initial reactions)
  - Ask the class: Was the Agent forced? (In the case where they chose red without intervention, they weren't forced.) But could the Agent have chosen blue? (No, because if they tried, they would have been forced to red.) Then ask: Is the Agent responsible for choosing red? Why or why not?

  But note: We want the intuition that they are responsible even though they couldn't have done otherwise.

  Now, the debrief will map this to Frankfurt-style cases.

  Likely failures:
  - The Agent might hesitate and get forced. Then we have a case where the Agent is forced. But we want a case where the Agent chooses without force. So we might need to prime the Agent to choose red quickly. We can do that by telling the Agent in private: "I suggest you just pick the red card quickly to avoid any issue." But that might bias too much. Alternatively, we can run it until we get a case where the Agent chooses red without intervention. We can have multiple trials.

  But we don't want to take too much time. Alternatively, we can script the first Agent to choose red without hesitation. But that might feel fake. Alternatively, we can have two rounds: one without an Intervener and then one with. But that might not be necessary.

  Alternatively, we can have the Agent be told that they have a preference for red? But we want it to be free.

  I think we'll run it once and hope the Agent chooses red without intervention. If they don't, then we can use that as a contrasting case.

  Proposed timeline:

