    { "duration": 2, "step": "Assign Roles: Pick one student as Agent and one as Intervener." },
    { "duration": 3, "step": "The Choice: The Agent stands at the table. The Experimenter says 'Go'. The Agent chooses a card. The Intervener watches and intervenes if the prior sign occurs." },
    { "duration": 5, "step": "Repeat: Do a second trial with new volunteers (if time allows and if the first trial didn't go as hoped)." },
    { "duration": 10, "step": "Initial Class Discussion: Ask the class: (1) In the trial where the Agent chose red without intervention, was the Agent forced? (2) Could the Agent have chosen blue? (3) Is the Agent responsible for choosing red? Why or why not?" }
  ]

  Then we move to the debrief.

  Debrief (after the activity and initial discussion, in lecture mode):

  We map the activity to the Frankfurt case:
  - The prior sign: the hand movement toward blue or hesitation -> corresponds to the prior sign in Frankfurt cases (e.g., a neural signal that indicates the agent is about to choose the alternative).
  - The intervener: corresponds to the counterfactual intervener (nefarious neurosurgeon, etc.) who is set to intervene only if the prior sign occurs.
  - The actual sequence: in the case where the Agent chose red without the prior sign, the intervener did nothing. The choice was free and unforced.
  - The responsibility intuition: even though the Agent couldn't have chosen blue (because if they tried, they would have been forced to choose red), we still feel the Agent is responsible for choosing red.

  Likely failures:
  1. The Agent might choose blue and get forced. Then we have a forced choice. We can still discuss: Was the Agent responsible? (Probably not.) Then we can contrast with the unforced case. But we want the unforced case. So if the first trial is forced, we can run a second trial and hope for an unforced red choice. Alternatively, we can have a confederate as the first Agent who will choose red without hesitation. But that might be dishonest. Alternatively, we can prime the Agent by saying, "Many people just pick red quickly to avoid the force." But that might be acceptable.

  2. The class might not see why the Agent couldn't have chosen blue. We have to explain: if the Agent had tried to choose blue, they would have been forced to red. So the alternative possibility (choosing blue) was not available. But note: the Agent could have tried to choose blue and then been forced. But the outcome would have been red anyway. So the Agent never actually chooses blue. Thus, the Agent couldn't have done otherwise (chosen blue) because any attempt would have been thwarted.

  Limitations:
  - The prior sign in our activity is observable (hand movement) but in Frankfurt cases, it is often an internal state (like a neural signal). We can discuss this in the debrief.
  - The force in our activity is a physical intervention (the Intervener says "Force Red" and the Agent must comply), but in Frankfurt cases, the intervention might be more subtle (like brain manipulation). We can note that the important thing is that the intervention would have happened if the prior sign had occurred, and it would have caused the same action.
  - The activity doesn't capture the fact that in some Frankfurt cases, the prior sign is not a conscious decision. In our case, the Agent is aware of the possibility of force. We can discuss whether this awareness affects freedom and responsibility.

