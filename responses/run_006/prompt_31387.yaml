prompt: |-
  I direct a portfolio of software products at a mid-sized firm. Four times a year we run stage-gate reviews at which each active project is either continued, paused, or killed. The decisions are high-stakes (project budgets run to seven figures), they are made by an investment committee of non-specialists, and I have about half an hour per project to prepare a recommendation. I keep running into the same argument. One camp says the money and months already spent are sunk costs and should count for nothing; the other says that is naive, because in a dollar auction it can be rational to keep bidding once you have already bid heavily, since quitting locks in a loss whereas one more increment might win. I have read enough rationalist material to know that both sides are partly right: the correct default is to ignore sunk costs, but the dollar auction shows there are real cases where continuing is rational even though the project as a whole will never be worth what has been spent on it.

  Please write me a decision procedure I can actually run at these reviews. It should be a checklist or ordered set of questions, with, for each question, what counts as a sufficient answer and what the answer implies for the decision. It should distinguish a genuine dollar-auction structure (a contest in which quitting concedes something to a rival and the next increment can change who wins) from ordinary unilateral escalation, and it should say how to handle the grey cases: recoverable value, reputational and learning payoffs, the difference between a bid that improves your position and a bid that merely postpones admitting a mistake, and whether a precommitment cap set before the contest began should bind the review. It should also say where the procedure must stop and hand the decision to a person because the question is one of values rather than facts. Then run the procedure on three cases: (1) a project that is behind schedule and over budget with a competitor close to shipping a similar product; (2) a research prototype that has consumed its budget and needs more money to reach a demo, with no competitor in sight; and (3) a project that is technically healthy but whose business case has collapsed because a key customer left. Make sure at least one of these comes out with an answer my committee will dislike. Finally, tell me what the procedure cannot do — the failure modes it is blind to. Please write in British English. Your final line should be a one-sentence summary of the procedure, beginning 'Summary:'.
reasoning: |-
  Okay, let me tackle this complex request from a portfolio director. The user is clearly experienced but stuck in a recurring debate about sunk costs versus dollar auction dynamics in project reviews. 

  First, I need to recognize the core tension: they're spending real money (seven figures!) with non-specialist decision-makers and limited prep time. The sunk cost fallacy versus rational escalation argument keeps resurfacing, and they need a practical tool to break the deadlock.

  Hmm... the user mentions having read rationalist material, so they'll appreciate nuanced distinctions. But the real value here is operationalization - they need something executable in 30-minute prep windows. The dollar auction analogy is clever but often misapplied; I should help separate true competitive dynamics from mere escalation.

  Right, the decision procedure must:
  - Explicitly define what constitutes a valid dollar auction scenario (with clear criteria like recoverable value and competitive tipping points)
  - Handle grey areas like reputational effects without letting them become loopholes
  - Force quantification where possible but acknowledge value judgments
  - Include unpleasant recommendations to build credibility

  For the three test cases:
  Case 1 (competitor close) likely demonstrates true dollar auction dynamics - but only if specific win conditions exist. Must resist the temptation to oversimplify.

  Case 2 (research prototype) will test the "learning payoff" argument. Need strict criteria here - too often this becomes a sinkhole.

  Case 3 (business case collapse) should probably be killed, which committees hate because it forces admission of failure. Good - that's the point of the procedure.

  Ah, and the failure modes... must emphasize this doesn't replace human judgment on values, and watch for distorted inputs. The sunk cost fallacy will try to sneak back in through "recoverable value" claims.

  Summary will need to capture both the default (ignore sunk costs) and the exception (dollar auction) in one crisp line. British English throughout - "realise" not "realize", etc.

  Better structure this as a flowchart-like Q&A with kill gates early. Time-boxing each question will be crucial for their 30-minute constraint. And always bring it back to expected value - that's the North Star.
answer: |-
  Here is a decision procedure designed for your stage-gate reviews, incorporating British English and addressing your specific requirements:

  **Project Continuation Decision Procedure**

  **Purpose:** To objectively evaluate whether a project warrants further investment, rigorously distinguishing rational continuation (e.g., genuine dollar auction dynamics) from escalation commitment driven by sunk costs.

  **Instructions:** Proceed through questions sequentially. A "No" at any starred question (*) triggers an immediate "Pause/Kill" recommendation unless overridden by specific, quantified justifications later in the procedure. Document answers and evidence concisely.

  1.  **Question: Has the fundamental business case collapsed? (e.g., target market vanished, core technology obsolete, key regulatory approval denied, primary customer irrevocably lost).**
      *   *Sufficient Answer:* "Yes" - supported by concrete evidence (e.g., customer termination notice, market analysis report, regulatory ruling).
      *   *Implication:* **Recommend Kill.** Sunk costs, recoverable value, and potential future wins are irrelevant if no viable market exists. *[Values Handoff: If committee disputes market potential assessment despite evidence, decision becomes strategic/value-based].*

  2.  **Question: Is the project technically infeasible with current or foreseeable technology?**
      *   *Sufficient Answer:* "Yes" - supported by expert technical assessment identifying fundamental, unresolved barriers.
      *   *Implication:* **Recommend Kill.** Proceeding wastes resources. Learning value is better captured by redirecting funds.

  3.  **Question: Is there a recoverable residual value significantly greater than termination costs if killed *now*?** (e.g., saleable IP, reusable components/modules, salvageable equipment, transferable team skills).
      *   *Sufficient Answer:* "Yes" - with a credible, quantified estimate (e.g., "£X recoverable vs. £Y termination cost").
      *   *Implication:* Factor Net Recoverable Value (Recoverable Value - Termination Costs) into future Expected Value calculations. **Does not justify continuation alone.**

  4.  **Question: Does this project involve a *genuine competitive contest* where:**
      *   a) Winning confers significant strategic/financial advantage *specifically because a rival is denied it* (e.g., standard dominance, key patent, exclusive partnership)?
      *   b) We are credibly close to winning (e.g., next milestone demonstrably tips the balance)?
      *   c) The next required increment (time/money) is *disproportionately small* compared to the winner-takes-all prize *and* our prior investment?
      *   *Sufficient Answer:* Clear "Yes" to *all* (a, b, c), supported by market intelligence and analysis. Vague assertions ("We *must* win") are insufficient.
      *   *Implication:* **Flags potential Dollar Auction Rationality.** Quantify the "Winner's Prize" (WP), Probability of Winning with Next Increment (P_win), and Next Increment Cost (IC). Calculate Expected Value of Increment: EV_inc = (P_win * WP) - IC. Proceed to Q5. *If "No" to any part, treat as unilateral project – sunk costs remain irrelevant, proceed to Q6.*

  5.  **Question (Dollar Auction Context): Does EV_inc > 0 AND is WP sufficient to make the *total project* NPV positive *including all prior sunk costs*?**
      *   *Sufficient Answer:* "Yes" - supported by robust financial model showing positive Total NPV *including sunk costs* (as the prize justifies the total outlay). OR "No, but EV_inc > 0 significantly" (rational bid, even if total NPV negative - the 'auction trap').
      *   *Implication:*
          *   *Yes (EV_inc >0 AND Total NPV >0):* **Strong case for Continue.** Rational bid *and* overall positive outcome.
          *   *Yes (EV_inc >0) but No (Total NPV <0):* **Recommend Continue ONLY IF:** (i) Precommitment cap (Q7) not breached, *and* (ii) Clear, binding exit strategy defined *before* next increment if milestone not achieved. High risk of escalation.
          *   *No (EV_inc <=0):* **Recommend Pause/Kill.** Increment is irrational. Sunk costs are irrelevant.

  6.  **Question (Unilateral Project or Failed Dollar Auction Test): Is the Expected Value (EV) of the *remaining work* (cost-to-complete) significantly positive?** (Calculate: EV = (Probability of Success * NPV of Future Benefits) - Cost to Complete + Net Recoverable Value (from Q3). *Exclude all sunk costs*).
      *   *Sufficient Answer:* "Yes" - with a quantified EV > 0, using realistic probabilities and commercially validated future benefits/costs.
      *   *Implication:*
          *   *EV > Threshold (e.g., >20% Cost to Complete):* **Recommend Continue.** Future justifies spend, sunk costs irrelevant.
          *   *0 < EV < Threshold:* **Recommend Pause.** Marginal case. Requires strong strategic/option value (Q8) to override.
          *   *EV <= 0:* **Recommend Kill.** Future spend unjustified. Sunk costs irrelevant.

  7.  **Question: Was a precommitment cap (time/budget) established *before significant uncertainty was resolved* and is it now breached?**
      *   *Sufficient Answer:* "Yes" - documented pre-agreed cap exists and is breached.
      *   *Implication:* **Creates strong presumption for Pause/Kill.** Continuation requires *exceptional justification* via Q5 (Dollar Auction) or Q8 (Strategic Value), demonstrating why the precommitment was invalid or circumstances radically changed. Prevents hindsight bias.

  8.  **Question: Are there substantial, credible, *non-financial* strategic/option values justifying continuation *despite a negative or marginal EV (from Q6)*?** (e.g., Critical learning for future high-value projects, defending reputation vital for future funding/customers, maintaining a strategic capability).
      *   *Sufficient Answer:* Specific, measurable objectives (e.g., "Learn X to de-risk Project Y worth £Z", "Avoid loss of Key Customer A causing reputational damage estimated at £B"). Vague "strategic importance" is insufficient.
      *   *Implication:* **Recommend Continue ONLY IF:** Benefits are quantified *as far as possible*, deemed essential by leadership, and a *strictly limited* further investment is authorised *with explicit success criteria for the non-financial objective*. **Recommend Pause/Kill otherwise.** *[Values Handoff: Committee must judge the validity and weight of non-financial arguments].*

  **Procedure Output:** Based on the answers, the procedure generates a clear recommendation (Continue, Pause, Kill) with rationale traceable to the documented answers.

  ---

  **Application to Cases:**

  **Case 1: Behind schedule, over budget, competitor close to shipping.**
  *   Q1/Q2: Assume business case/tech feasibility still valid (No).
  *   Q3: Likely minimal recoverable value if killed (No/Neutral).
  *   Q4: **Genuine Dollar Auction?** a) Likely Yes (winning standard/dominance). b) **Critical:** *Are we credibly close to winning?* If next increment gets us to market near-simultaneously or with decisive advantage, Yes. If competitor is months ahead with a working product, probably No. c) Is next increment small vs prize & prior spend? If (b) is Yes, often Yes. **Assume Q4=Yes (Plausible competitive race).**
  *   Q5: Calculate EV_inc & Total NPV. *EV_inc*: P_win might be moderate (e.g., 60%), WP huge (market dominance), IC large but perhaps small *relative* to WP/prior spend? *Total NPV*: Likely negative due to overruns. **Likely Outcome:** EV_inc >0 but Total NPV <0. **Recommendation:** **Continue ONLY IF** precommitment cap (Q7) not breached AND a binding "next gate" exit is defined (e.g., "If not shipping beta within 3 months, kill"). *Committee may dislike the conditional continue due to prior overruns, but the Dollar Auction logic holds if Q4 criteria are met.*

  **Case 2: Research prototype; budget consumed; needs more for demo; no competitor.**
  *   Q1/Q2: Assume valid (No).
  *   Q3: Recoverable value? Likely low (research findings, code). Termination costs minimal. Neutral.
  *   Q4: **Genuine Dollar Auction?** a) No competitor in sight? Then No. (No contest to win/lose). **Proceed as Unilateral Project.**
  *   Q6: Calculate EV of remaining work (to demo/commercialisation). Probability of Success? Often low for research. NPV of Future Benefits? Highly uncertain, likely long-term. Cost to Complete? Significant. **Likely Outcome: EV <= 0 or marginally positive.** Recommendation hinges on Q8.
  *   Q8: Strategic/Learning Value? "Reaching a demo" itself has minimal intrinsic value. Justification requires *specific, high-value future application* dependent on *this specific learning*. E.g., "This demo de-risks Project X (worth £Y) by proving Z; failure here kills X." If quantifiable link exists, **Recommend Continue with strict limit & learning goals.** Else, **Recommend Kill.** *Committee may dislike killing "promising" research, but without Q8 justification, it's unjustified escalation.*

  **Case 3: Technically healthy, business case collapsed (key customer left).**
  *   Q1: **Fundamental Business Case Collapsed?** Yes. Primary revenue anchor (key customer) is gone. Evidence: Customer termination notice.
  *   Implication: **Recommend Kill.** (Q1 outcome). Sunk costs, technical health, potential future efforts (Q6, Q8) are irrelevant. The core reason for the project no longer exists. *Committee will likely dislike killing a "well-executed" project, but the procedure is clear and correct.* Re-focus resources.

  ---

  **Failure Modes the Procedure is Blind To:**

  1.  **Garbage In, Garbage Out:** Relies on accurate, unbiased inputs (probabilities, costs, benefits, competitive intelligence). Overly optimistic forecasts or downplayed risks corrupt the output.
  2.  **Quantification Blind Spots:** Struggles with deeply uncertain, long-term, or inherently unquantifiable strategic/option values (Q8). Prone to undervaluing them or allowing vague justifications.
  3.  **"Credibly Close" Judgment (Q4b):** Highly subjective. Susceptible to bias ("just one more push"). Requires dispassionate, evidence-based assessment.
  4.  **Dynamic Competition:** Assumes a static snapshot. Competitors may react to continuation decisions, altering the Dollar Auction dynamics (Q4/5) or future EV (Q6).
  5.  **Political Pressure:** Cannot prevent committee members ignoring the output due to personal stakes, relationships, or internal politics.
  6.  **Misapplication of Dollar Auction Logic:** Q4 criteria are strict. The procedure might be misused to force a "Dollar Auction" label onto projects that are simply failing unilaterally.
  7.  **Short-Termism:** Focuses on next increment/gate. May miss very long-term plays, though Q8 *should* capture these if credible.
  8.  **Groupthink in Committee:** The procedure informs the *recommendation*, not the committee's *deliberation*. Groupthink can override sound recommendations.

  Summary: This procedure defaults to ignoring sunk costs, rigorously tests for genuine dollar auction dynamics requiring rational escalation, forces quantification of strategic justifications, and mandates kill decisions when the fundamental business case collapses, providing an auditable trail for high-stakes project reviews.
