answer: |-
  This is a **brilliant** observation of one of the most famous and fundamental challenges to classical rational choice theory: the **Allais Paradox**, named after French economist Maurice Allais (Nobel laureate).

  Here's the breakdown:

  1.  **The Name:** **Allais Paradox** (specifically, your first example).
  2.  **The Diagnosis:** It demonstrates a violation of the **Independence Axiom (or Sure-Thing Principle)** of Expected Utility Theory (EUT).
  3.  **Why it's a Paradox:** EUT assumes rational preferences are linear in probabilities and obey the independence axiom. This axiom states that if two gambles are identical on a set of outcomes that occur with the same probability, then your preference between them should depend *only* on the parts where they differ. The common branch *should* cancel out. The reversal you observe violates this axiom.

  **Dissecting Your Examples:**

  *   **Pair One (A vs B):**
      *   A: $1,000 (100%)
      *   B: $1,000 (89%), $5,000 (10%), $0 (1%)
      *   **Preference:** A > B (Most choose A)
  *   **Pair Two (C vs D):**
      *   C: $1,000 (11%), $0 (89%)
      *   D: $5,000 (10%), $0 (90%)
      *   **Preference:** D > C (Most choose D)

  **The Violation:**

  *   Notice that if you "cancel" the common 89% branch:
      *   In Pair One, the common branch gives $1,000 in both A and B. Canceling it leaves:
          *   A': $1,000 (11%) | *Effectively: $1,000 (11%), $0 (89%)? (But the $0 comes from canceling the $1,000 branch!)*
          *   B': $5,000 (10%), $0 (1%) | *Effectively: $5,000 (10%), $0 (90%)?*
          *   Canceling the common branch *seems* to transform the choice into Pair Two (C vs D)! But people prefer A in Pair One and D in Pair Two.
  *   **The Crux:** The "common consequence" (the 89% branch) *is not neutral*. Its value ($1,000 vs $0) drastically changes how people perceive the *risk* involved in the differing part (11% vs 10% chance of the good outcome).

  **Standard View & Explanation:**

  The standard view in **behavioral economics** is that this reversal **is a systematic cognitive bias**, demonstrating that Expected Utility Theory is a poor *descriptive* model of actual human choice, even though it may be a good *normative* model.

  The primary explanations involve **probability weighting** and the **Certainty Effect**:

  1.  **Certainty Effect:** This is central to your first pair. People overweight outcomes they consider certain compared to outcomes that are merely probable. Getting $1,000 *for sure* (Option A) is disproportionately attractive compared to a gamble (B) that offers a small chance of getting nothing and a slightly larger chance of getting more, *even if the expected value of B is higher*. The certainty of A is overvalued.
  2.  **Probability Weighting (Nonlinear Perception):** People don't perceive probabilities linearly. Small probabilities (especially of gains) are often underweighted, while probabilities near 0 or 1 are overweighted. In Pair Two:
      *   The difference between 10% and 11% *feels* very small (both are "unlikely").
      *   The difference between $5,000 and $1,000 *feels* large.
      *   Since the probabilities feel similar, people go for the much larger prize (D). The certainty effect isn't present because neither option offers certainty.
      *   In Pair One, the jump from 100% certainty (A) to 99% probability of getting *at least* $1,000 (B) *feels* like a significant loss of security, even though the probability difference is only 1%. The overweighting of certainty makes the 1% chance of $0 loom large.

  **Your Second Example (Proportional Scaling):**

  *   Sure $3,000 > 80% chance of $4,000 (Most choose sure $3,000)
  *   25% chance of $3,000 < 20% chance of $4,000 (Most choose 20% chance of $4,000)

  This is **directly related and often considered another manifestation of the same underlying phenomena**, frequently called the **Common Ratio Effect** (a variant of the Allais Paradox).

  *   **Why it's similar:** Both options in the second choice are scaled down by the same factor (multiplied by 0.25) relative to the first choice. EUT predicts preferences should not reverse under this linear scaling.
  *   **The Violation & Explanation:** Again, it's driven by **probability weighting** and the **Certainty Effect**.
      *   In the first choice, the certainty of $3,000 is highly attractive, making the 20% chance of getting nothing with the $4,000 gamble seem risky and unattractive.
      *   In the second choice, certainty is gone. Both probabilities are now small (25% and 20%). The difference between 25% and 20% feels relatively minor compared to the difference between the outcomes ($4,000 vs $3,000). People become more willing to "gamble" for the larger amount when neither outcome is certain. Small probabilities of the larger gain ($4,000) might also be slightly underweighted relative to the linear model, but the key driver is the loss of the certainty premium.

  **Are the Sure-Thing and Proportional Versions the Same?**

  *   **Conceptually Yes:** Both violate the Independence Axiom of EUT. Both are robust demonstrations of the **Certainty Effect** and **Nonlinear Probability Weighting**. They reveal the same core limitations of EUT as a descriptive model.
  *   **Mechanistically Slightly Different:** The Allais Paradox (your first example) highlights the impact of changing a *common consequence* on choice between risky prospects. The Common Ratio Effect highlights how preferences reverse when moving away from certainty via proportional scaling. Both lead to the same violations and are explained by the same psychological mechanisms.

  **Rational Preference vs. Violation?**

  This is the key philosophical question.

  1.  **The EUT (Normative) View:** The reversal **is a mistake**. Rational individuals should obey the Independence Axiom. Preferences should be consistent regardless of the framing of identical consequences. The common branch *should* cancel.
  2.  **The Behavioral (Descriptive) View:** The reversal is a **robust empirical finding** demonstrating that human cognition systematically deviates from EUT due to psychological factors like the certainty effect and probability weighting. It's not necessarily "irrational" in an evolutionary or practical sense (avoiding sure losses might be adaptive), but it violates the logical consistency axioms of EUT.
  3.  **Debate:** There is ongoing debate. Some argue EUT should be abandoned or modified as a normative standard. Others argue the behavioral findings highlight predictable biases we should strive to overcome for better decisions. **Prospect Theory** (Kahneman & Tversky) was developed explicitly to *describe* these effects (using an S-shaped value function and an inverse-S probability weighting function) and is generally accepted as a better descriptive model.

  **In Summary:**

  *   **Name:** Allais Paradox (first example) / Common Ratio Effect (second example).
  *   **Diagnosis:** Violation of the Independence Axiom (Sure-Thing Principle) of Expected Utility Theory.
  *   **Core Cause:** **Certainty Effect** (overweighting of certain outcomes) and **Nonlinear Probability Weighting** (underweighting moderate probabilities, overweighting near-zero and near-one probabilities).
  *   **Relationship:** Both your examples demonstrate the same core phenomena – the failure of "common consequence cancellation" and the powerful influence of certainty on choice under risk. They are closely related variants.
  *   **Standard View:** The reversal is seen as a **systematic cognitive bias** demonstrating a fundamental limitation of Expected Utility Theory in describing actual human behavior. Prospect Theory provides the dominant descriptive framework accounting for it. While some argue the reversal can be contextually rational (e.g., regret avoidance), the consensus in behavioral economics is that it represents a violation of axiomatic rationality that often leads to inconsistent choices. Recognizing this bias allows for more deliberate and potentially better decision-making.
