  The practical conclusion hinges (pun intended) on the vast future potential. But the user might wonder: what if the future isn't vast? Or if reducing extinction risk conflicts with other values? I need to highlight that the inference requires additional premises—like longtermism—which aren't universally accepted. Critics might argue for balancing present needs or doubting the future's value.

