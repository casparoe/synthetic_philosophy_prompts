prompt: |-
  I'm a science journalist who covers the predictive processing / free energy beat, and I keep running into the line "perception is a controlled hallucination." A few months ago a modeler at a conference used it to wave off a question about whether strong priors can override the signal entirely; last week a memory researcher used it in an interview to explain why eyewitness testimony is unreliable, saying the witness's brain was "hallucinating" the scene under top-down control. When I asked which part of the sentence was doing the work, I just got the line repeated back at me. I'd like to stop letting it end conversations. Can you lay out the distinct precise claims that sentence could be making — from the near-platitude reading (the brain actively constructs perception rather than passively recording it) through the substantive predicitive-processing reading (perceptual content is always a top-down best guess that gets corrected by prediction error) to the radical one (we literally hallucinate all the time and only call the shared hallucinations reality) — and for each reading say whether it's trivial, defensible, or false, how much actual predictive processing work supports it, and which reading is actually needed to get the eyewitness-memory conclusion. A menu I can pull out next time someone drops the slogan and moves on would be ideal.
reasoning: |-
