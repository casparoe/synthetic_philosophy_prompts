  The user wants a "menu" to use in conversations. I should make each interpretation clear and concise, with the key points they can reference. Highlighting which one is essential for the eyewitness conclusion is crucial—substantive PP is sufficient, without needing the radical view.

  Also, the user mentioned modelers and researchers using the phrase to dodge questions. So, I need to equip them to push back by asking which interpretation the speaker means. Providing specific questions to pose will help them steer the conversation back to substance.

