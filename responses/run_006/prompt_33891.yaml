  Next, the substantive PP reading: Here, perception is a Bayesian best guess with prediction error correction. This is core to PP, with strong computational support. It's defensible and explains how priors can override signals. For eyewitnesses, this directly applies—strong priors (like biases) can distort sensory input, leading to unreliable memories. This is probably the interpretation needed for the memory researcher's point.

