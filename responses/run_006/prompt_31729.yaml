answer: |-
  Below is a systematic map of objections to the extended mind thesis (EMT), ranked by severity, with assessments of their force and defenders' likely responses. I address your candidate defeaters and key concerns about falsifiability, predictions, and implications.

  ---

  ### **Ranked Objections to EMT**  
  *(Fatal → Awkward)*

  1. **The Non-Derived Content Argument (Conceptual Fatalism)**  
     - **Objection (Adams & Aizawa):** Only intrinsic (non-derived) intentionality counts as cognitive. Brains have it; notebooks/computers derive meaning from users.  
     - **Threat Level:** **Potentially fatal** if accepted. If cognition *requires* intrinsic content, EMT collapses.  
     - **EMT Response:** Rejects the premise as question-begging. EMT defines cognition *functionally* (by role, not implementation). "Derived" vs. "non-derived" is a false dichotomy; all symbols gain meaning through use.  
     - **Your Concern:** If vindicated, this *would* destroy EMT. But defenders dismiss it as internalist dogma.

  2. **The Coupling-Constitution Fallacy (Metaphysical Blunder)**  
     - **Objection:** EMT confuses *causal coupling* (e.g., using a tool) with *constitution* (the tool being part of the mind). Interaction ≠ cognitive component.  
     - **Threat Level:** **Serious, but rebuttable.** Exposes a core ambiguity in EMT.  
     - **EMT Response:** Denies fallacy. Constitution arises from *persistent, reciprocal integration* (e.g., Otto’s notebook is constantly accessed, trusted, and scaffolds cognition). Mere coupling (e.g., occasional internet search) doesn’t qualify.  
     - **Your Read:** Correct—this objection *presumes* internalism. EMT argues that under *specific conditions*, coupling *becomes* constitution.

  3. **Cognitive Bloat (Absurd Extension)**  
     - **Objection:** If Otto’s notebook is part of his mind, then:  
       - Reliance on a partner’s brain makes *their mind* part of yours.  
       - Reliance on Google extends cognition to the entire internet.  
     - **Threat Level:** **Awkward but manageable.** Highlights boundary issues.  
     - **EMT Response:** Accepts the consequence but constrains it:  
       - **Social extension:** Rejected. EMT requires *individual* access/control (Otto *owns* his notebook; you don’t own another’s brain).  
       - **Internet:** Possible if deeply integrated (e.g., always-available AR glasses). EMT’s criteria (trust, accessibility, past endorsement) prevent trivial bloat.  
     - **Your Concern:** Defenders bite the bullet on *some* extensions (e.g., a private AI assistant) but reject social merging as violating EMT’s conditions.

  4. **Neurodissimilarity (Empirical Mismatch)**  
     - **Objection:** If fMRI shows that "recalling" from a notebook activates *different brain processes* than biological recall (e.g., involving visual processing vs. hippocampal retrieval), they aren’t functionally equivalent.  
     - **Threat Level:** **Mild if EMT is functionalist.**  
     - **What Would Falsify EMT?** Evidence that external resource use *lacks cognitive hallmarks* (e.g., no error-correction, no integration with belief systems).  
     - **EMT Response:** Functional roles matter, not implementation. Brains adapt to tools (e.g., blind people’s visual cortex processes braille). Dissimilarity is expected but irrelevant if the *task* is cognitively analogous.  
     - **Your Scenario:** Only damaging if it shows notebook use isn’t *treated as belief* by the brain (e.g., no impact on decision-making without re-checking).

  5. **Trivialization via Qualifications**  
     - **Objection:** EMT’s criteria (reliable access, automatic trust, past endorsement) are either too strict (nothing qualifies) or too loose (everything qualifies).  
     - **Threat Level:** **Awkward, but not fatal.**  
     - **EMT Response:** Criteria are empirically testable (e.g., Otto panics if separated from his notebook; Inga doesn’t). Studies show people treat deeply integrated tools like cognitive prosthetics (e.g., smartphones).  
     - **Unfalsifiability?** Not inherently. EMT *could* be falsified if no external resource ever meets its criteria under scrutiny.

  ---

  ### **Predictive Power & Falsifiability**  
  - **Does EMT Make Unique Predictions?**  
    - **Yes, indirectly:** It predicts that subjects with deeply integrated tools will:  
      - Exhibit "withdrawal" symptoms when separated.  
      - Treat tool outputs as direct beliefs (e.g., Otto doesn’t "verify" notebook entries; Inga doesn’t "verify" memories).  
      - Show similar error patterns (e.g., confabulation in biological memory vs. miswriting in notebooks).  
    - **Rivals’ Predictions:** Internalism predicts cognition always degrades without biological tools.  
  - **Constitution vs. Causation:** EMT is ontological, not causal. It doesn’t predict *how* cognition improves, only that tools *can be part of* the cognitive system.  
  - **Qualification Insulation:** Criteria are stringent but not vacuous (e.g., smartphones *may* qualify; random library books do not). This is careful philosophy, not evasion.

  ---

  ### **The Parity Principle: Your Litmus Test**  
  - **Objection:** Parity ("if internal, then external") begs the question by assuming internal processes define cognition.  
  - **EMT Defense:** Parity is a *heuristic*, not proof. It reveals internalist bias: we accept intracranial processes as cognitive *because they’re internal*, not due to functional features.  
  - **Unacceptable Consequences?**  
    - Critics: Parity could extend mind to trivial objects (e.g., a calculator).  
    - EMT: Criteria prevent this (e.g., calculators aren’t *automatically trusted* like beliefs).  
  - **Consistency Test:** Otto’s notebook *should* be treated like Inga’s memory in psychological experiments. If studies show stark disparities (e.g., notebooks aren’t treated as "knowledge"), parity fails.  

  ---

  ### **Honest Assessment**  
  - **EMT’s Greatest Vulnerability:** Adams & Aizawa’s non-derived content argument. If cognition *must* be intrinsic, EMT fails. Defenders must reject this or redefine cognition.  
  - **Strongest Rebuttal:** EMT exposes internalism’s bias toward "biological chauvinism." Tools can be *functionally* equivalent to organs (e.g., eyeglasses extend vision).  
  - **Your Suspicions Confirmed:**  
    - Parity *can* be misapplied, but EMT’s criteria constrain it.  
    - Social extension *is* rejected by EMT (per Clark’s later clarifications).  
    - EMT isn’t unfalsifiable—it *could* fall if no tool meets its criteria.  

  **Conclusion:** EMT survives moderate objections but faces a formidable challenge from internalist definitions of cognition. Its power lies in reframing the mind as a dynamic system, not a skull-bound relic. If functionalism about the mind is correct, EMT is compelling. If not, it fails.
