prompt: |-
  I keep going back and forth on how much the leveling-down objection should actually move me. My question is this: what's your credence that prioritarianism is the better theory of distributive justice, where the leveling-down objection is doing a major part of the work in that verdict? Don't just say it depends—give me a number, and then decompose it. I want terms at least for: (a) how likely it is that egalitarianism (the view that equality itself makes an outcome better, not just fairer as a matter of procedure) is genuinely committed to saying a leveling-down change is an improvement in one respect; (b) conditional on that, how likely it is that this commitment is a real cost rather than something egalitarians can happily bite; (c) how likely it is that prioritarianism's concave weighting of well-being actually captures the intuitions that pull people toward egalitarianism in the first place; and (d) how likely it is that some third view does the job better than both. Give a rough probability for each, show how you combine them, and tell me which term your final number is most sensitive to. Then say what evidence or argument would shift that term the most, and where you'd guess a commited telic egalitarian would locate the disagreement.
