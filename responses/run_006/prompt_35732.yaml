answer: |-
  **Moore:** My dear colleague, I appreciate your thoughtful exposition of this "Cornell realism," and I concede the analogy to water and H₂O is intriguing. However, I fear it rests upon a profound confusion concerning the unique nature of the predicate 'good'.

  You are quite right that the identity of water with H₂O was an empirical discovery. Before the advance of chemistry, it was indeed an open question whether water *was* H₂O. Investigation settled that question decisively. But this very fact highlights the crucial disanalogy with the concept 'good'.

  1.  **The Nature of the Question:** When we ask, "Is water H₂O?", we ask a question *about the constitution of a complex natural substance*. Water has observable properties (wetness, transparency, boiling point, etc.), and chemistry reveals its underlying physical structure. The open question was resolvable by empirical inquiry into the causal structure of the world – precisely the method your Cornell realists commend.
  2.  **The Simplicity of 'Good':** 'Good', in its fundamental ethical sense, is not like 'water'. 'Water' is a complex concept; we can break it down into its physical properties and, ultimately, its molecular composition. 'Good', however, is **simple and indefinable**. It is not composed of parts, natural or otherwise. It is an ultimate, non-complex idea. We grasp it directly, by intellectual intuition. There *is* no underlying structure to discover, no hidden causal role that constitutes its essence.
  3.  **The Open Question Revisited:** Now, consider the proposed identification: "Goodness *is* N" (where N is some natural property complex identified by science – say, promoting social cohesion or maximizing pleasure). The Open Question Argument reveals that it *always* remains intelligible to ask, "Yes, I see this act promotes social cohesion / maximizes pleasure (it is N), but *is it good*?" This question makes perfect sense, requires no further empirical investigation about the causal structure of N itself, and is not settled by simply understanding the meaning of 'N'. This intelligibility persists *precisely* because 'good' denotes a simple, non-natural property entirely distinct from the complex natural property N.
  4.  **Why the Water Analogy Fails:** The question "Is water H₂O?" ceased to be open *because* empirical investigation revealed H₂O fully accounted for the observable properties *defining* water (its liquidity, freezing point, etc. *within certain conditions*). The question "Is N good?" remains perpetually open *because* no amount of empirical investigation into N – no matter how detailed its causal role in psychological or sociological theories – can ever reveal or account for the simple, non-natural property *goodness* that we predicate of it. Discovering the causal role of pleasure doesn't tell me *why* or *that* pleasure *ought* to be pursued; it only tells me *that* it *is* pursued and *what effects* it has. The ethical question "Is this good?" stands apart from all such empirical descriptions.

  In essence, the water/H₂O identity is a discovery *within* the natural realm, connecting two complex natural concepts (a macroscopic substance and its microphysical composition). The proposed identification of 'good' with any natural property N attempts to bridge a chasm between two fundamentally different realms: the *natural* (discovered empirically) and the *non-natural* (grasped by intuition). The persistent openness of the question "Is N good?" demonstrates this fundamental categorial difference. Science reveals *what is*; ethics concerns *what ought to be*, and 'good' is the simple, irreducible concept at the heart of that latter domain. No empirical theory, however sophisticated, can capture its essence, for it is not an empirical essence. It simply *is* what it is.

  *(Moore leans forward slightly, his tone earnest but firm)* The analogy, while clever, mistakes a complex natural kind term susceptible to scientific reduction for a simple, non-natural, ethical ultimate. The Open Question remains insurmountable for any such naturalistic identification.
