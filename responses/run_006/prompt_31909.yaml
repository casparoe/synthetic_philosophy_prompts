prompt: |-
  I am a machine learning researcher who works on few-shot learning and meta-learning. I keep hearing philosophers and cognitive scientists talk about Bongard problems and what they reveal about concept induction from sparse examples. I want to know whether there is anything in that literature that my own vocabulary cannot already say, or whether the philosophers are just redescribing phenomena I already have names for.

  Please restate the core claims of the Bongard-problem / concept-induction literature in the vocabulary of contemporary machine learning — few-shot classification, inductive biases, the manifold hypothesis, training vs. test distributions, representation learning, the no-free-lunch theorems, and so on — as faithfully as you can. Assume I am fluent in that vocabulary and need no tutorials on it.

  Then give me a residue report: which claims translate cleanly, which translate only with distortion, and which have no expression in the ML vocabulary at all. For each piece of residue, tell me whether it points to a genuine gap in the ML framework or whether it marks a place where the philosophical claim was less precise than it looked.

  Throughout, please separate what is settled among people who know the topic from what is genuinely contested, and do not present a contested view as though it were the consensus.

  Give your response as exactly five numbered items, each a sentence or two, with no introduction or conclusion. Each item should cover one key claim from the concept-induction literature, its ML translation, and its residue (if any).
