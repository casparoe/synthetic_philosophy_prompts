answer: |-
  Here are five key claims from the concept-induction literature concerning Bongard problems, translated into ML vocabulary, with residue analysis:

  1.  **Claim:** Concept induction from few examples is feasible because concepts are constrained by abstract relational primitives (e.g., symmetry, containment, adjacency). **ML Translation:** Few-shot classification succeeds due to strong inductive biases encoded in the model architecture (e.g., CNNs for translation invariance, relational networks) and meta-learning priors, aligning with the manifold hypothesis that real-world concepts occupy low-dimensional, structured subspaces. **Residue:** The specific claim of *innate*, *human-like* abstract relational primitives as fundamental building blocks doesn't cleanly map; ML biases are often learned (via meta-learning or pretraining) or engineered (architectural), not necessarily "primitive" or cognitively plausible. This marks a gap regarding the *origin and nature* of core biases.

  2.  **Claim:** Solving Bongard problems requires recognizing and manipulating abstract relations *independently* of specific perceptual features. **ML Translation:** This is a task demanding high-quality, disentangled representations learned via (meta-)representation learning, enabling generalization to novel test distributions defined by the same relational rules but different low-level features. **Residue:** Philosophers often imply these relations are *symbolic* or directly correspond to discrete, human-interpretable operations. ML models often achieve this via complex, continuous embeddings whose interpretability and symbolic nature are contested, representing a gap in achieving human-like *explicit symbolic manipulation* from few shots.

  3.  **Claim:** Background "world knowledge" (e.g., object permanence, basic physics, spatial logic) is essential for guiding the search for the relevant concept/rule. **ML Translation:** This corresponds to leveraging powerful inductive biases (architectural or learned via meta-learning/pretraining on diverse data) and successful transfer learning from related source domains (training distribution) to the specific few-shot task (test distribution). **Residue:** The philosophical notion of "world knowledge" is often richer, more structured, and more causal than the statistical regularities captured by typical ML pretraining or biases. Translating it requires distortion, pointing to a gap in ML's ability to robustly integrate *structured, causal, compositional knowledge* into few-shot learning.

  4.  **Claim:** The core challenge is *abstraction* – ignoring irrelevant perceptual variation to isolate the invariant relational rule defining the concept. **ML Translation:** This aligns with the manifold hypothesis: learning occurs on a lower-dimensional manifold where the relevant relational features are preserved, while nuisance factors (appearance) are factored out, enabling generalization within the task's test distribution. **Residue:** Philosophers often emphasize abstraction as a *deliberate, rule-based process*. ML models can achieve functionally similar abstraction implicitly via learned representations without necessarily forming an explicit, human-like symbolic rule. This residue highlights a gap in understanding whether explicit symbolic rules are *necessary* for human-like abstraction or merely one implementation.

  5.  **Claim:** Bongard problems exemplify "concept-first" learning: the examples *instantiate* a pre-existing abstract concept/rule that must be identified. **ML Translation:** This describes a specific few-shot classification task definition: the support sets define two classes partitioned by an abstract rule, and the query set tests generalization under the assumption the *same* rule applies (i.i.d. task assumption). **Residue:** The philosophical framing often assumes the concept/rule *exists independently* of the examples and must be "discovered". ML treats it as a statistical pattern defined *by the task's data split*. The residue is the implicit metaphysical stance about concepts existing prior to data, which doesn't translate cleanly and may mark a place where the philosophical claim is less precise/operationalizable for ML.
