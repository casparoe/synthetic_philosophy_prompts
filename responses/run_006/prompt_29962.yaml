answer: |-
  ## The Dollar Auction

  The auctioneer displays a dollar prize:
  "Who bids? The highest wins and pays the sum.
  But second place? They pay their bid, likewise,
  Though gain no coin, a costly rule for some."
  First bids are light – a nickel, then a dime –
  A prudent wager, simple hope to gain.
  A quarter, fifty cents, the climb in time
  Seems logical, despite the growing pain.

  *(Volta)*  
  **Then logic flips:** he bids at eighty cents,
  *Not* for the dollar's worth held in his hand,
  But thinking of the sixty *already* spent,
  Which paying second place would now demand.
  She dares a dollar-ten to save her stake,
  He doubles down for his own payment's sake.

  **Past value's lure, past reason's final call,**
  **It's fear of loss that drives the bids to fall.**

  ---

  **Notes on Accuracy:**

  *   **Mechanism:** Explicitly states the core rules: highest bidder wins/pays, second-highest pays/loses (lines 2-4).
  *   **Initial Bids:** Shows small, rational opening bids (line 5).
  *   **The Volta:** Marks the psychological shift (bolded) where bidding changes from pursuing gain to avoiding the loss of sunk costs (lines 9-12). "Not for the dollar's worth... But thinking of the sixty *already* spent" captures this precisely.
  *   **Escalation Driver:** Shows bids increasing specifically to avoid being the *second*-highest bidder and losing the sunk cost (lines 11-14: "save her stake," "for his own payment's sake").
  *   **Closing Couplet:** Directly states the core behavioral insight – bids exceed the dollar not because the dollar's value is reassessed, but purely due to the escalating fear of losing the sunk cost already committed ("fear of loss").
  *   **Terminology:** Uses "second place" and "paying second place" accurately.
