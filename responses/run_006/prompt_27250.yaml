prompt: |-
  My friend has pretty strong opinions about what's conscious and what isn't. Here's where she lands so far:

  Conscious: humans, dogs, cows, octopuses, ravens
  Not conscious: fish, individual bees, a bee hive as a whole, oak trees, current language models like ChatGPT
  On the fence but leaning no: mice

  She says she's not being speciesist or sentimental about it — she's going by what the science suggests about pain, flexible learning, and something she calls "having a point of view."

  Next week we're visiting a farm sanctuary and then a seafood place, and I want to know what she'll say about:

  - Chickens
  - Lobsters
  - A two-month-old human infant

  Also, separately, I'm curious what she'd say about a future AI that's built to exactly mimic the human brain at the neuronal level but runs on silicon — same connectivity, same firing patterns, just a different substrate.

  I'm less interested in the answers themselves than in figuring out what rule she's actually running. Can you lay out the different principles that would fit her verdicts so far, say what each one predicts for these new cases, and tell me which of the new cases would best tell the rules apart? Also, if you had to bet, which rule do you think she's actually using, and why?
