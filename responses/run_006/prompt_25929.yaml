prompt: |-
  I'd like your credence on the following claim:

  *A satisfactory formal criterion for distinguishing "side effects" from "intended effects" of an AI agent's actions — one that could be used to penalise the former without requiring a full specification of human values — is impossible in principle, not merely difficult in practice.*

  Please give me a number between 0 and 1, and then decompose the reasoning behind it. Your decomposition should address at least these sub-questions, each with its own probability and a brief justification:

  1. Can "the world remains roughly as it was" be defined in purely causal or physical terms without implicitly relying on a normative ranking of which changes matter?
  2. If a fully value-free criterion is unavailable, could a partial or coarse specification of value — capturing enough to avert catastrophic side effects — suffice without amounting to the full specification the claim says is necessary?
  3. Is there a plausible path by which an agent could acquire the side-effect/intended-effect distinction through learning from human feedback or demonstrations, such that no explicit formal definition is needed?
  4. If the claim is true, does that entail a fundamental obstacle to building safe advanced AI, or are there architectural strategies (e.g., myopia, corrigibility, strict human-in-the-loop control) that could sidestep the problem entirely?

  Show how you combine these into your overall credence — whether by simple multiplication, a weighted average, or some other method, and why that method is appropriate. Then identify which sub-question your final number is most sensitive to and describe what evidence or argument would most shift your view on it.

  Please write your answer in British English.
