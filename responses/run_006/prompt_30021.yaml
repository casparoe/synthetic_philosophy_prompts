  I recall similar debates in philosophy of science. Larry Laudan's pessimistic meta-induction comes to mind, but the self-reference twist here is sharper. The solution probably lies in rejecting the uniformity assumption in step (2). Theories aren't all equally vulnerable—some components survive (like Carnot's insights absorbed into thermodynamics). The user might accept that while entities like phlogiston fail, structural or mathematical cores persist. 

