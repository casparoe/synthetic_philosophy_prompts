  The user's deeper need is probably to push back against the colleague's tactic without direct confrontation. They need ammunition to redirect discussions to evidence. Highlighting the impracticality of the theorem's assumptions in real meetings would help. Things like private information, time constraints, or differing priors are common and rational.

