  ### Classroom Activity: The Epistemology of Markets Game  
  **Objective:** Students experience the no-trade theorem through behavior, discovering that rational agents with common priors and private signals should not engage in purely speculative trade.  

  ---

  ### **Setup & Materials**  
  - **Asset:** A fictional stock with two possible values: **$100** (high) or **$0** (low).  
  - **Prior:** Common prior—50% chance of high/low (stated verbally).  
  - **Signals:** Private signals (H or L) on slips of paper:  
    - If true state is **high**, 11 students get H-signal (75%), 3 get L-signal (25%).  
    - If true state is **low**, 11 students get L-signal (75%), 3 get H-signal (25%).  
  - **Payoffs:** Tokens (convertible to course points):  
    - Starting tokens per round: **100 tokens**.  
    - **Buyer pays trade price \(P\), receives true value \(V\)**: Final tokens = \(100 + (V - P)\).  
    - **Seller receives trade price \(P\), pays true value \(V\)**: Final tokens = \(100 + (P - V)\).  
    - No trade: 100 tokens.  
  - **Materials:**  
    - Coin (to draw true state), slips for signals, whiteboard for public order book.  
    - Timer, tally sheet for trades.  

  ---

  ### **Rules for Each Round**  
  **Duration:** 20 minutes per round (2 rounds total).  
  1. **State & Signal Assignment (2 min):**  
     - Instructor flips coin: Heads = high ($100), Tails = low ($0).  
     - Distribute private signals based on true state (11:3 ratio).  

  2. **Order Submission (3 min):**  
     - Each student submits **one** order on a slip:  
       - **Bid**: Max price they’ll pay to buy (e.g., "BID 60").  
       - **Ask**: Min price they’ll accept to sell (e.g., "ASK 40").  
       - **PASS**: No trade.  

  3. **Public Order Book (3 min):**  
     - Instructor posts all bids/asks anonymously on whiteboard (e.g., "BIDS: 70, 65, 60... ASKS: 30, 35, 40...").  

  4. **Trading Phase (5 min):**  
     - Students negotiate trades **verbally** at any mutually agreed price (e.g., Buyer bids 60, Seller asks 40 → agree at 50).  
     - **Key constraint**: Trade only if buyer’s bid ≥ seller’s ask.  
     - Report trades to instructor (record price and parties).  

  5. **Revelation & Payoffs (2 min):**  
     - True state revealed.  
     - Instructor calculates token payoffs.  

  ---

  ### **Timeline (80 Minutes Total)**  
  | **Time** | **Phase** | **Instructor Actions** |  
  |----------|----------|------------------------|  
  | 0–5 min  | **Introduction** | Explain asset, signals, payoffs, and rules. Emphasize: *"Trade only if you expect to gain."* |  
  | 5–25 min | **Round 1** | Draw true state, distribute signals, run order/trading phases. Reveal true state, settle payoffs. |  
  | 25–45 min| **Round 2** | Repeat with new true state and signals. |  
  | 45–65 min| **Debrief** | Guide discussion (see below). |  
  | 65–80 min| **Formal Links** | Connect game to theorems, acknowledge limitations. |  

  ---

  ### **Debrief (45–65 min)**  
  **Guided Discussion:**  
  1. **Experience Sharing (5 min):**  
     - *"How many traded in Round 1? Round 2? Did trading decrease? Why?"*  
     - *"Who changed their mind after seeing the order book? What did you infer?"*  

  2. **Map to Concepts (15 min):**  
     - **Private Signal → Bayesian Updating**:  
       *"If you got an H-signal, your expected value was $75 (75% × $100). Why didn’t all H-holders bid near 75?"*  
     - **Order Book → Information Revelation**:  
       *"When you saw many low asks, what did that suggest about sellers’ signals? How did that affect your willingness to trade?"*  
     - **Failed Negotiations → Common Knowledge**:  
       *"In Round 2, why did pairs agree on a price, then walk away? Your offer itself revealed your signal!"*  
     - **No Trade → Ex Ante Efficiency**:  
       *"If no one trades, is the market broken? Or is it avoiding mutually harmful deals?"*  

  3. **Theorems & Real-World Links (5 min):**  
     - **No-Trade Theorem**: "When common priors + private info exist, trade is evidence against its own gain."  
     - **Agreeing-to-Disagree**: "If posteriors are common knowledge, you can’t rationally disagree!"  
     - **Non-Speculative Trade**: "Real markets trade due to hedging, liquidity, or differing priors—not just information."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Over-Trading in Round 1**:  
     - Students ignore order book, trade impulsively.  
     - **Fix**: Ask: *"Did anyone regret trading after seeing the order book? Why?"* Highlight regret in debrief.  

  2. **Misinterpreting Signals**:  
     - Students undervalue Bayesian updating (e.g., H-holder bids $50).  
     - **Fix**: Calculate posteriors on board:  
       \[
       P(\text{High}|H) = \frac{0.75 \times 0.5}{(0.75 \times 0.5) + (0.25 \times 0.5)} = 75\%.
       \]  

  3. **Order Book Ignored**:  
     - Students focus on private signals, not public bids/asks.  
     - **Fix**: Ask: *"How many of you revised your value estimate after seeing orders? Why was a low ask ‘bad news’?"*  

  4. **Uneven Trading Pairs**:  
     - Imbalance of buyers/sellers causes frustration.  
     - **Fix**: Note: *"In a large market, prices adjust. Here, a bid/ask spread means no trade is rational!"*  

  ---

  ### **Limitations & What to Explicitly Teach**  
  **Inherent Shortcomings:**  
  1. **Common Prior Enforcement**:  
     - Students won’t truly share priors (cognitive biases).  
     - **Supply**: Stress: *"Rationality requires accepting the stated 50/50 prior."*  

  2. **Common Knowledge Gap**:  
     - Public orders ≠ common knowledge (no infinite recursion).  
     - **Supply**: Explain: *"Common knowledge means ‘everyone knows everyone knows...’—simulate this by assuming full transparency."*  

  3. **Bayesian Rationality**:  
     - Students use heuristics, not math.  
     - **Supply**: Derive posteriors formally. Contrast with actual bids.  

  4. **Face-to-Face Dynamics**:  
     - Peer pressure/charisma affects trades.  
     - **Supply**: Note: *"Real markets anonymize offers. Here, social factors add noise."*  

  **Final Note**: The activity **cannot** replicate continuous markets, infinite iterations, or perfect rationality. Use it to *motivate* the theorem—then formalize with math post-debrief. The phrase "no-trade theorem" should first appear during debrief.  

  ---  
  **Outcome**: Students internalize that trade collapse isn’t failure—it’s rational inference in action. They leave skeptical of speculative bubbles and primed for deeper theory.
