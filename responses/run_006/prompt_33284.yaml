          - But wait: after seeing the order book, both update. The buyer sees that there are sellers at 25. That suggests there are L signals. The buyer then updates and lowers their valuation. Similarly, the seller sees bids at 75 and updates upwards. Then they might not agree at 50 anymore.

    65-75 min: Formalize the no-trade theorem.
          - Statement: When rational agents with a common prior and only private information about an asset consider trading, there should be no purely speculative trade. Because each side's willingness to trade is evidence that, once it becomes common knowledge, should erase the perceived gain.
          - The key is common knowledge: after the order book is public, it becomes common knowledge. Then the conditions of the agreeing-to-disagree theorem apply: if two people have the same prior, and their posteriors are common knowledge, then they must agree. So they cannot both think they are gaining from the trade.
          - Ex ante efficiency: before signals, no trade is expected? Actually, the theorem says that trade cannot be common knowledge that it is beneficial. But in our setting, before signals, the expected value is 50. So no one would trade at 50? But that's not the point. The point is after signals, trade should not occur.

    75-80 min: Limitations and extensions.
          - Limitations of the activity: 
               * We didn't enforce full rationality (updating might be flawed).
               * Common knowledge might not be achieved (we only posted the orders, but we didn't iterate on the knowledge).
               * In the real world, trade occurs for other reasons: hedging (which we ruled out by having only one asset and no risk aversion in the payoff? Actually, our payoff is linear, so they are risk-neutral), liquidity needs, different priors (which we ruled out by common prior), or different information (which we allowed, but then the theorem says that with common prior and common knowledge, that shouldn't lead to trade).
          - What we must supply: the formal argument and the ideal conditions.

  This should fit in 80 minutes.
