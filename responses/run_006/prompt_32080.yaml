answer: |-
  Here's a battle-tested plan for teaching Moral Luck in 40 minutes to your sharp non-academics, designed to maximize clarity and spark discussion:

  **Core Teaching Sequence (Approx. 30 mins):**

  1.  **Hook & Setup: The Intuitive Starting Point - Control (5 mins)**
      *   **Start:** "When we judge someone morally - blame or praise them - what *should* matter? What makes someone deserve blame or praise?"
      *   **Elicit Responses:** Guide them towards: *Intentions, choices, effort, things under their control.* Summarize: "So, a core idea seems to be **Control**: We should only be praised or blamed for things we actually control."
      *   **State the Principle:** "Philosophers call this the **Control Principle**: Moral praise or blame are only appropriate for factors within an agent's control."
      *   **Why Start Here?** This principle feels intuitively *right* to almost everyone. It establishes the baseline that the concept of Moral Luck will challenge.

  2.  **Introduce the Wrench: Resultant Luck - The Unlucky Truck Driver (10 mins)**
      *   **The Scenario:** "Imagine two drivers, Alice and Bob. Both decide to drive home after 5 beers at a party. Both are equally impaired, equally aware of the risk, equally reckless in their choice. Alice drives home uneventfully. Bob, due to pure bad luck (a child suddenly darts out from between parked cars in a spot Bob couldn't possibly see), hits and kills the child."
      *   **The Question:** "How do we morally judge Alice and Bob? *Should* we judge them differently?"
      *   **Reveal Intuitions:** "Most people feel Bob deserves *much more* blame (and potential legal punishment) than Alice, even though their choices, intentions, and level of control *before* the accident were identical."
      *   **Highlight the Tension:** "But remember the Control Principle! The *outcome* (hitting the child) wasn't under Bob's control any more than the *non-outcome* was under Alice's. They both rolled the dice on a terrible risk. Only Bob got unlucky. Yet we blame him more. **This is Resultant Moral Luck:** luck in the *outcomes* of our actions affecting moral judgment."

  3.  **Deepen the Problem: Circumstantial Luck - The Nazi vs. The Neighbor (10 mins)**
      *   **The Scenario:** "Now, imagine two ordinary German men in 1930, Hans and Klaus. Both are decent, non-ideological, primarily concerned with their families and careers. Both are susceptible to peer pressure and authority. Hans lives in Berlin. Klaus emigrates to Argentina in 1929 for a job opportunity before the Nazis rise. By 1938, Hans, pressured by colleagues and wanting to keep his job, joins the Nazi party and passively benefits from persecution. Klaus lives a quiet, morally unremarkable life in Argentina."
      *   **The Question:** "How do we morally judge Hans and Klaus? Does Hans deserve blame for choices Klaus never had to face?"
      *   **Reveal Intuitions:** "We tend to judge Hans harshly for his complicity, while Klaus escapes such judgment. But the crucial factor distinguishing them is sheer luck: **where and when they were born.** Klaus never faced the morally corrosive circumstances Hans did. He was lucky. Hans was unlucky. **This is Circumstantial Moral Luck:** luck in the *situations* we find ourselves in affecting the moral choices we face and how we are judged."

  4.  **Define Moral Luck & State the Dilemma (5 mins)**
      *   **Define:** "So, **Moral Luck** occurs when factors beyond an agent's control significantly influence our moral judgments (praise or blame) about them or their actions."
      *   **The Core Tension:** "We have a powerful intuition captured by the **Control Principle**: Control is necessary for moral responsibility. *But*, we also have powerful intuitions that outcomes and circumstances *do* matter morally (as in the Driver and Nazi examples)."
      *   **The Dilemma:** "This creates a problem: Either 1) Our common moral judgments are often deeply flawed (because influenced by luck), OR 2) The Control Principle is wrong/misleading, and factors outside our control *can* legitimately affect our moral status. Both options are uncomfortable!"

  **Addressing Misconceptions (Weave In During Discussion & Explicitly Highlight):**

  1.  **Epistemic Luck ("We didn't *know*"):** This will likely come up with the drivers. *Head it off during the Driver example:* "Crucially, in our scenario, Alice and Bob *knew* the risk was real and serious. The luck isn't about *knowing* the outcome beforehand (epistemic), it's about the outcome *actually happening* despite identical risky choices (resultant moral luck)."
  2.  **The "Character" Workaround:** Someone will suggest, "Just judge their *character* or *intent*, not the outcome/circumstance!" *Counter during the Nazi example:* "But *how* do we judge character? Klaus's character wasn't tested like Hans's. Is 'character' something fixed, or is it shaped by the very circumstances of luck? If we praise Klaus for *not* being a Nazi, but he never had the chance to *be* one, is that fair? Judging 'character' alone often just pushes the luck problem back a step – why does *this* person have the 'character' to resist, while *that* one doesn't? Luck might still play a role."

  **The Anchor Example & Why:**

  *   **The Unlucky Truck Driver (Resultant Luck)** is still the best *initial* anchor. **Why:**
      *   **Visceral & Immediate:** The stakes are clear and relatable. Everyone understands drunk driving risks.
      *   **Control Contrast is Stark:** Their actions *prior* to the luck event are identical and clearly within their control. The outcome difference is starkly due to luck.
      *   **Avoiding Legal Conflation:** Explicitly state: "We're *not* talking about legal liability here. The law *has* to care about outcomes. We're talking about *moral* blameworthiness. Imagine they both faced identical legal consequences (e.g., a fine for reckless endangerment regardless of outcome) – would you still feel Bob is *morally* worse than Alice?"
  *   **The Nazi/Emigrant (Circumstantial Luck)** is the crucial *second* anchor. **Why:**
      *   **Shows Breadth:** Demonstrates moral luck isn't just about dramatic outcomes, but pervasive in life.
      *   **Separates Moral from Legal:** No legal issue here, purely moral judgment.
      *   **Challenges Character Judgment:** Directly confronts the main workaround people propose.

  **The Check-Understanding Question (To End Your Teaching Segment):**

  > **"If we could magically switch the places of the two truck drivers *after* they made the decision to drive drunk, but *before* either outcome happened, would your moral judgment of *the person* (not just the act) change? Why or why not?"**

  *   **Why it works:**
      *   It forces them to confront if blame/praise attaches to the *person* or the *outcome*.
      *   If they say "Bob (who hit the kid) is still worse even if we switched places because *he* did it," it shows they are outcome-focused despite luck.
      *   If they say "No, if Alice had been in that spot, she would have hit the kid, so they are equally blameworthy," they are upholding the Control Principle.
      *   Either answer reveals they grasp the tension: the first shows the pull of outcome, the second the pull of control, acknowledging the paradox.

  **Is 40 Minutes Feasible?**

  **Yes, absolutely.** This plan is designed for it. The key is:
  *   **Strict Timekeeping:** Stick ruthlessly to the sequence and timings.
  *   **Clarity over Comprehensiveness:** Don't try to cover constitutive luck or every nuance. Stick to the core tension between Control Principle and Resultant/Circumstantial luck.
  *   **Lean on Intuition:** Your group is sharp; trust them to grasp the examples and feel the tension. Your job is to frame it clearly.
  *   **Interactive Elicitation:** Quickly draw out *their* intuitions at each step (Steps 2 & 3) rather than lecturing. This builds engagement and reveals the problem naturally.
  *   **Set Up Discussion:** The 10 minutes of discussion after this 30-minute teaching segment is where deeper exploration, objections, and implications can flourish. You've given them the framework and the puzzle.

  **Final Tip:** Use clear, simple language. Avoid jargon beyond "Control Principle" and "Moral Luck" (define them clearly). Phrases like "roll of the dice," "twist of fate," or "being dealt a different hand" resonate well. Good luck – your group sounds fantastic!
