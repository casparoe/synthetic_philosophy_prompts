  They mentioned starting with either resultant or circumstantial luck. I think resultant luck is more intuitive because outcomes are tangible. The truck example comes to mind—two identical drivers, one hits a pedestrian due to bad luck. This highlights the control principle: we blame the one with the bad outcome more, even though both had the same intent and actions. This sets up the tension between control and moral judgment.

  Next, introducing the control principle early is key. After presenting the examples, defining it clearly will help the group see the conflict. Then, expanding to circumstantial luck shows that the problem isn't just about outcomes but also about situations beyond one's control. The Nazi Germany vs. Argentina scenario illustrates how circumstances affect moral judgment, even if intentions are similar.

  Potential misconceptions include conflating moral luck with epistemic luck (not knowing the outcome) and the character judgment workaround. The user needs to address these. For epistemic luck, clarifying that the issue is about actual outcomes, not knowledge, during the resultant luck discussion. For character judgment, pointing out that we often judge based on actions influenced by luck, and character itself can be shaped by circumstances.

  The user also wants a question to check understanding. Asking how they would judge the drivers if they switched places tests if they grasp the tension between control and moral intuition. If they blame the one with the bad outcome despite the switch, it shows they get the problem.

