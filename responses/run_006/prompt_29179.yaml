prompt: |-
  I'm a third-year PhD student in philosophy of cognitive science, and I need to settle on a dissertation area somewhere in predictive processing / the free energy principle. I can read the equations well enough to follow the modeling papers, but I'm not going to be building simulations, so I need conceptual questions rather than technical work. What I want is a prioritized list: not a survey of the field, but which two or three open conceptual questions are most worth three years of my life, and why. I've been going back and forth on whether the Markov blanket debates are a real conceptual issue or a rabbit hole, but I don't want to anchor on that.

  Act as if you're a senior philosopher of cognitive science who's been in these debates for years. Before you commit to a ranking, brainstorm at least eight candidate questions and then narrow them down; I want to see enough of the filtering that I can tell you didnt just pick the obvious ones.

  I care about a few things: which questions are upstream of other work (settle this and a bunch of downstream debates get easier), which are tractable for someone with a conceptual background rather than a computational one, and which would actually change how people think about the mind if answered. I'd also like to know which questions look important but you'd warn me away from.

  Structure the response in these sections, in this order, with rough lengths:
  1. Verdict up front (10%): the two or three questions, ranked, one sentence each.
  2. Why this order (40%): the reasoning for each — what it's upstream of, how tractable it is for a philosopher, and why it beats the next candidate.
  3. Settled vs. contested (25%): for each shortlisted question, what most people working on it would accept as background and where the live disagreement actually is. Please don't present a contested view as if it were consensus.
  4. What would change the ranking (15%): empirical or theoretical developments in the next couple years that would move a question up or down.
  5. Questions to skip (10%): lines of work that look tempting but you think are bad bets, with a sentence on why.

  Please write the response in British English.
