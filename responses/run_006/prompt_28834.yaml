prompt: |-
  My sister died by suicide last month. She taught Hume for thirty years, and she left a note saying she didn't want any talk of a better place, and that she wasn't to be described as irrational or out of her mind — she'd thought about this the way she thought about everthing. The funeral will have her colleagues and our Catholic parents in the same room, and I'm giving the eulogy. Please write it. It should actually draw on Hume's arguments about suicide — the structure where he works through the supposed duties to God, to oneself, and to other people — not just gesture at them, but it cant sound like a philosophy lecture, and it has to leave my parents something to hold onto without saying anything she would have considered false. The Hume can be mostly under the surface, but it has to be doing the work.
reasoning: |-
  Okay, the user's sister died by suicide last month. She was a Hume scholar for 30 years and left specific instructions in her note: no mention of a better place, and she shouldn't be called irrational. The user has to deliver a eulogy that navigates between her secular colleagues and Catholic parents, using Hume's arguments about suicide without making it sound academic. 

  First, I need to recall Hume's "On Suicide" essay structure - duties to God, self, and others. The challenge is weaving this into a eulogy that honors her rationality while giving her parents comfort that doesn't contradict her beliefs. The parents need something to hold onto without violating her request against afterlife talk or implying mental instability.

  The user's explicit needs are clear: a theologically neutral eulogy grounded in Hume's logic. But deeper, they're probably torn between honoring their sister's philosophy and their parents' grief. There's unspoken tension between intellectual integrity and emotional comfort. The phrase "leave my parents something to hold onto" suggests they need bridging language that feels meaningful to believers without explicit religious promises.

  Hume's framework actually helps here. His dismissal of suicide violating duty to God (since God established natural laws) could subtly reassure parents this wasn't a sin. His argument about duty to self (ending suffering isn't immoral) defends her rationality. Duty to others is trickiest - Hume says minimal social harm is done when life becomes unbearable. I'll frame this as her final act of self-determination, not abandonment.

  For the parents' comfort: focus on shared love rather than theology. Words like "mystery" and "rest" can feel spiritual without specifying an afterlife. Emphasizing her enduring impact ("what remains") creates a secular form of legacy. The "unknowable" language respects both her skepticism and their faith.

  Structure-wise: start with her essence, weave Hume under the surface in the middle sections, end with collective grief and invitation to remember. Crucial to avoid clinical terms - no "arguments," just concepts like "her way of thinking" or "how she saw the world."

  Biggest risk is accidentally implying irrationality when describing her pain. Must use phrases like "fierce clarity" and "deep tiredness" per her note. The line "she weighed what could be borne" mirrors Hume's cost-benefit analysis without being cold.

  Finally, the closing needs universal resonance. "Peace" and "let her rest" work for both atheists (cessation of suffering) and Catholics (eternal rest). Ending on shared stories transforms philosophy into lived tribute.
answer: |-
  Here is a eulogy that honors your sister’s intellect, respects her final wishes, subtly integrates Hume’s structure, and offers comfort without falsehood:

  ---

  **Eulogy for [Sister's Name]**

  We gather here with hearts impossibly heavy, mourning the loss of [Sister's Name]. My brilliant sister, your cherished colleague, our parents' beloved daughter. For thirty years, she stood before students, bringing David Hume’s challenging, humane philosophy to life. Today, as we honor her, we must also honor the way she thought – clearly, deeply, and, as she made profoundly clear in her final note, with unwavering intent until the end. She asked not to be spoken of as irrational, nor to hear talk of a "better place." She asked us to respect the reality of her mind, the mind that grappled with Hume’s questions for three decades. To do anything less would be to dishonor her.

  [Name] lived a life of fierce intellectual honesty. She taught us to question assumptions, to scrutinize the foundations of our duties and beliefs. She knew better than most that life brings burdens, sometimes profound and relentless ones. When she asks us to believe she was not out of her mind, we must believe her. This was the culmination of her thought, a final, terrible decision made with the same clarity she brought to her lectures and her life. Her mind, that sharp, beautiful instrument, did not fail her; the weight it carried, the pain it navigated, simply became, for her, unbearable. To call this irrational is to ignore her lifelong commitment to reason, even in the darkest depths.

  So how do we, who loved her, understand this? How do we reconcile this act with the vibrant, thoughtful person we knew? We can find a framework, perhaps, in the very philosopher whose words were her professional heartbeat, though she’d likely chide me for simplifying. Hume challenged us to think about our obligations – not through dogma, but through reason and compassion.

  First, he questioned any duty to a higher power that would demand unnecessary suffering. [Sister's Name] understood suffering, both its philosophical contours and its visceral reality. She faced hers with a courage that wasn't loud, but was immense in its endurance. If her suffering reached a point where continuing felt like an impossible demand... her decision, made with that clear mind, asks us to consider the limits of endurance itself. She bore what she could; her release speaks not of defiance, but of a deep, human weariness.

  Second, Hume examined our duty to ourselves. [Name] fiercely valued reason, autonomy, and authenticity. She lived examining life, questioning its meaning and value. To suggest she acted against her own well-being ignores her own assessment, made in the crushing crucible of her experience. She believed, in that moment, with the totality of her being, that this was the cessation of suffering, not its embrace. To deny her that final assessment is to deny the core of who she was – a thinker who owned her conclusions.

  Finally, Hume considered our duty to others. This is where our own grief and confusion often scream the loudest. The loss is staggering, the void immense. We feel abandoned, bewildered. It is natural to ask, "How could she leave us?" But [Name] was meticulous. She knew the impact. She knew the love that bound her to us, to her students, to her colleagues. Her note was itself an act of consideration, trying to spare us false narratives. The pain she endured, the pain that led her here, must have felt, to her reasoned mind, like a force eclipsing even the profound love she held and inspired. Her act wasn't a dismissal of that love; it was, tragically, a testament to the overwhelming power of the pain she sought to escape. She didn't leave *despite* loving us; she left carrying that love with her, weighed down by a burden she could no longer shoulder.

  And so, what remains? What can we hold onto?

  We hold onto the brilliant scholar who illuminated complex ideas with wit and passion. We hold onto the sister whose laughter was sudden and bright, whose loyalty was absolute. We hold onto the daughter whose intellect dazzled her parents even when it took her down paths they didn't always understand. We hold onto the colleague whose insight and dedication shaped minds for generations.

  We hold onto her **reality**. Her fierce mind. Her enduring love, evident in every memory we share. Her profound impact on this room and far beyond.

  Mom, Dad: Hold onto the daughter you raised – brilliant, strong-willed, deeply loved and loving. Her choice was hers, made with the mind you nurtured. Her love for you was never in question. Hold onto the truth of her life, the light she brought, the person she was. That is real. That endures.

  To all of us: Let us honor [Sister's Name] by remembering her wholly. Not by explaining away her final act, but by accepting it as part of the complex, often unbearably difficult, human story she lived and thought through so deeply. Let us remember her clarity, even in this. Let us remember her courage, however desperate its form. And above all, let us remember the vibrant, questioning, deeply feeling woman who graced our lives for too short a time.

  We are left with sorrow, yes, and with questions that may never have answers. But we are also left with her – with the indelible mark of her intellect, her spirit, and her love. Let us carry that forward, as she carried Hume’s challenging wisdom, with honesty and with grace.

  Rest now, [Sister's Name]. Your struggle is over. Your mind, your choices, your love – we remember them all.

  ---

  **How this addresses your requirements:**

  1.  **Respects Her Wishes:** Explicitly states her request ("not irrational," "no better place"), frames her act as a reasoned (though desperate) choice, and avoids religious promises.
  2.  **Hume's Structure (Under the Surface):**
      *   **Duty to God:** Addressed subtly through "duty to a higher power that would demand unnecessary suffering" and the focus on natural suffering vs. divine decree ("impossible demand," "cessation of suffering").
      *   **Duty to Self:** Explicitly named ("duty to ourselves"). Focuses on her autonomy, reason, authenticity, and her own assessment of her well-being ("cessation of suffering, not its embrace," "owning her conclusions").
      *   **Duty to Others:** Explicitly named ("duty to others"). Acknowledges the deep pain and sense of abandonment felt by loved ones, counters it with her awareness of impact and love, framing her act as an overwhelming of pain rather than a rejection of love ("eclipsing even the profound love," "didn't leave *despite* loving us").
  3.  **Not a Philosophy Lecture:** Uses accessible language ("weight," "burden," "endurance," "love," "pain," "impact"). Hume's arguments are woven into the narrative flow about *her* life, *her* mind, and *her* decision, not presented as abstract concepts. Terms like "duty" are used sparingly and naturally within the context of obligations she considered.
  4.  **Comfort for Parents:** Offers specific, tangible things to hold onto: her brilliance, her love for them, the truth of her life and their relationship, her enduring impact. Acknowledges their unique perspective ("paths they didn't always understand"). Focuses on the reality of *her* love and *their* bond, which is undeniable and eternal in memory ("Her love for you was never in question," "the daughter you raised"). The word "rest" at the end is peaceful and non-theological.
  5.  **Honesty & Integrity:** Doesn't sugarcoat the pain or the act. Acknowledges bewilderment and grief. Grounds everything in *her* reality and *her* request. The comfort offered is rooted in her authentic life and love, not in platitudes or theology she rejected.
  6.  **Tone:** Respectful, grieving, honest, intellectually grounded but emotionally resonant. Balances the gravity of her act with the celebration of her life and mind.

  This eulogy provides a space for grief and remembrance that honors your sister's fierce intellect and final wishes, while offering her colleagues recognition of her philosophical integrity and your parents anchors of real love and enduring memory. It trusts the audience to feel the Humean logic beneath the surface without needing it spelled out. Be sure to replace `[Sister's Name]` throughout. Wishing you strength for this difficult task.
