prompt: |-
  You are an expert philosopher of language who works on Frege's puzzle about the cognitive value of identity statements. Please think carefully and work through the case step by step rather than giving a canned answer. I am an undergraduate in a philosophy of language course, and I am writing a paper on the sense/reference distinction. Please construct a thought experiment to specification, show the reasoning in full, and include no citations or reading list; I want the reasoning itself, not a bibliography.

  Construct a one-paragraph, ordinary-life scenario — set in a workplace, a university, or a family — in which a person with coherent background beliefs hears a true identity sentence of the form "a is b," where "a" and "b" are two ordinary proper names for the same person. The two names should arise naturally in the scenario, such as a nickname, a married name, a professional name, or a middle name. No astronomy, no superheroes or fictional characters, and no use of Hesperus/Phosphorus, Superman/Clark Kent, or Paderewski.

  The scenario must be one on which a Fregean and a Millian about proper names agree that the two names co-refer and that the identity sentence is true, but disagree about what the sentence says — specifically, about which proposition is expressed. This disagreement must do real downstream work. In particular, the person should already believe a sentence of the form "a is F" and, after hearing the identity, come to believe "b is F." The Fregean should say that the person has thereby acquired a new thought about the person, one they did not believe before. The Millian should say that the proposition expressed by "b is F" is the very proposition the person already believed when they believed "a is F," so no new proposition about the person has been acquired; whatever is new must be explained without positing Fregean senses, for example as a change in how the person takes that proposition or as metalinguistic knowledge. This should flip the verdict on whether the person's transition from "a is F" to "b is F" counts as learning something new about the person, as opposed to learning something merely about the words.

  After the scenario, please do the following:

  - State the identity sentence and the two names.
  - Walk through what each theory takes the sentence to express, and show why both assign it the same truth-value.
  - State exactly what, if anything, the person learns on each view, and trace how this affects the verdict on their transition from "a is F" to "b is F."
  - Identify the single feature of the case that is doing the work.
  - Say what would happen if that feature were removed — in particular, whether the case would collapse back into the familiar uninformative "a is a" case.
  - Finish with the strongest reply available to the Millian that concedes the datum but denies that Fregean senses must be posited in the semantics to explain it.

  Before writing the scenario, briefly brainstorm two or three candidate cases and say which one you chose and why. Finally, tell me how confident you are in each of the verdicts you attribute to the two theories, and single out the point you are least sure of.
