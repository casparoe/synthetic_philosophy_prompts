prompt: |-
  So I'm a novelist, right, and I'm working on this book where I want the characters to feel psychologically real — not like they're walking DSM entries or whatever, but like their motivations actually track something true about human beings. I've been dipping into evo psych and honestly I can't tell what's solid and what's just a clever story someone told after the fact.

  Here's what I want: rank these five evo-psych claims from most to least likely to be genuine science rather than just-so stories. Give each one a tier if you want — like "I'd bet on this," "plausible but unproven," "probably narrative," that kind of thing — and a sentance on why it lands there.

  The five:
  1. Jealousy is sexually dimorphic — men are more distressed by sexual infidelity, women by emotional infidelity — because of different reproductive challenges in the ancestral environment.
  2. Clinical depression is (or was) an adaptive bargaining signal: it communicates to others that you can't be pushed further, forcing renegotiation of social contracts.
  3. The human preference for savanna-like landscapes (open terrain with scattered trees and water) is an evolved residue of Pleistocene habitat selection.
  4. Rape is an evolved conditional reproductive strategy employed by males who lack access to consensual mating opportunities.
  5. Gossip evolved as a mechanism for social policing — sharing reputational information helped maintain cooperation in large groups where direct observation wasn't possible.

  I basically want to know which of these I can use as scaffolding for character motivation without feeling like I'm building my whole novel on a house of cards.
reasoning: |-
  Okay, the user is a novelist looking to create psychologically real characters without relying on shaky evo psych theories. They've listed five claims and want them ranked by scientific credibility. Let me start by understanding each claim's validity based on current research.

  First, jealousy's sexual dimorphism. I remember studies using physiological measures like heart rate and galvanic skin response showing gender differences in reactions to infidelity. Buss's work comes to mind here. But there's criticism about cultural variability. Still, the evidence seems robust, so this might be the strongest.

  Next, gossip as social policing. Dunbar's research on language evolution and gossip's role in maintaining group cohesion is relevant. Experiments like spreading reputational info in games support this. Cross-cultural studies add weight. So it's plausible but maybe not as solid as jealousy.

  Savanna preference. Studies with children and adults showing landscape preferences exist. The universality in children is a point in favor. But the Pleistocene adaptation idea is a bit speculative. Environmental psychology supports this to some extent, so it's mid-tier.

  Depression as a bargaining signal. The "smoke detector principle" makes sense, but the social bargaining aspect is controversial. Mixed evidence in clinical studies; depression often leads to social withdrawal. This feels more like a narrative than solid science.

  Rape as a reproductive strategy. This is highly problematic. Lack of evidence, ignores cultural factors, and conflates correlation with causation. Ethically dangerous and scientifically weak. Definitely the least credible.

  The user wants to avoid building their novel on a house of cards. They probably need reliable theories to ground character motivations. Jealousy and gossip offer more actionable insights for character dynamics. Depression might be useful if framed carefully, but rape should be avoided. They might also appreciate nuanced discussions beyond evo psych, like social or individual factors. Balancing biological with environmental influences could add depth without over-relying on any single theory.
answer: |-
  Based on current scientific consensus and critiques within evolutionary psychology and related fields, here's a ranking of those five claims from most to least likely to be genuine science, with tiers and brief reasoning:

  **Ranked from Most to Least Scientifically Supported:**

  1.  **Gossip evolved as a mechanism for social policing.**  
      *   **Tier: Plausible & Well-Supported (I'd bet on the core idea).**  
      *   **Why:** Extensive research shows gossip efficiently transmits reputational information crucial for cooperation, norm enforcement, and alliance building in large groups. Experiments (e.g., public goods games with gossip) demonstrate its effectiveness in promoting cooperation where direct monitoring fails. Cross-cultural evidence is strong. The *adaptive function* of reputation management is robust, even if the exact evolutionary pathway has nuances.

  2.  **Jealousy is sexually dimorphic...**  
      *   **Tier: Mixed Evidence / Core Pattern Observed but Overstated & Context-Dependent.**  
      *   **Why:** Numerous studies (using self-report, physiological measures like GSR/heart rate, forced-choice scenarios) *do* find the predicted sex difference pattern cross-culturally. This provides evidence for *some* evolved component linked to reproductive threats. However, the effect sizes are often modest, cultural factors significantly modulate expressions and intensity, it's not absolute (many individuals don't fit the pattern), and the "ancestral challenges" explanation, while logical, is difficult to test directly for causality. It's more than a just-so story, but less universal and deterministic than often portrayed.

  3.  **The human preference for savanna-like landscapes...**  
      *   **Tier: Plausible but Difficult to Prove / Intriguing Hypothesis.**  
      *   **Why:** Studies consistently show preferences for savanna-like vistas (prospect-refuge theory) across diverse cultures, including young children. The link to the Pleistocene environment where humans evolved is logical and parsimonious. However, disentangling this from learned associations, general preferences for resource-rich/safe environments, or aesthetic principles is challenging. It's a compelling and often-cited idea with empirical backing for the preference, but the *direct* causal link to specific Pleistocene adaptation remains inferential.

  4.  **Clinical depression is (or was) an adaptive bargaining signal...**  
      *   **Tier: Controversial Speculation / Primarily a Narrative.**  
      *   **Why:** The "smoke detector principle" (low-cost false alarms for high-stakes threats) is a useful concept for *low mood* or *sadness*. However, applying it to *clinical depression* as an adaptive "bargaining signal" faces major hurdles. Severe depression often leads to social withdrawal, reduced communication, and *reduced* ability to negotiate, not effective signaling. It carries immense fitness costs. While social factors are crucial in depression etiology, framing the *debilitating disorder itself* as an evolved strategy designed to force renegotiation lacks strong empirical support and is criticized as a post-hoc story. The "bargaining" aspect is particularly weak.

  5.  **Rape is an evolved conditional reproductive strategy...**  
      *   **Tier: Scientifically Unsound & Ethically Dangerous Narrative.**  
      *   **Why:** This hypothesis is overwhelmingly rejected by mainstream science. It conflates a horrific crime with reproduction, ignores the overwhelming evidence that rape is primarily about violence, domination, and control rather than reproduction (most rapes don't result in conception, occur outside fertile windows, or target non-reproductive individuals). It lacks specific, testable adaptations predicted by the theory. Crucially, it's based on flawed logic (confusing correlation with adaptation) and ignores complex socio-cultural, economic, and psychological factors. It's widely condemned for being not only scientifically invalid but also ethically abhorrent and harmful.

  **For Your Novel:**

  *   **Safest Scaffolding:** Focus on **Gossip (#1)**. The dynamics of reputation, social monitoring, and the use of information sharing to enforce norms or build alliances are powerful, universally relatable, and well-supported drivers of human interaction.
  *   **Useful with Nuance:** **Jealousy (#2)** can be powerful motivation. *Avoid* presenting the dimorphism as a rigid, universal law. Show it as a *tendency* heavily influenced by individual personality, relationship dynamics, cultural background, and specific context. The *intensity* of jealousy as a response to threat is the core relatable element.
  *   **Atmospheric Detail:** The **Savanna Preference (#3)** can be a subtle background element for setting descriptions or character reactions to environment, adding a layer of evolved aesthetic without needing heavy scientific justification in the narrative.
  *   **Handle with Extreme Caution (or Avoid):**
      *   **Depression (#4):** While exploring the *social consequences* and *potential functions of low mood* (e.g., signaling need for help, prompting withdrawal for reassessment) can be insightful, *avoid* framing *clinical depression* itself as an adaptive strategy or bargaining chip. Focus on the individual's subjective experience and the complex web of causes (biological, psychological, social, traumatic).
      *   **Rape (#5): Absolutely avoid using this hypothesis as motivation.** Portraying rape as an evolved "reproductive strategy" is scientifically wrong and ethically indefensible. Motivations must center on power, control, anger, sadism, or severe psychological disturbance – complex human failings, not a pseudo-biological imperative.

  **Key Takeaway:** Evolutionary psychology provides useful lenses, but **character motivation is richest when it integrates evolved tendencies with individual history, cultural shaping, immediate context, and conscious choice.** Use the more robust ideas (like gossip, the core impulse of jealousy, perhaps environmental aesthetics) as *part* of the foundation, not the entire structure, and always layer them with the messy, unique specifics of your characters' lives and the world you've built. Avoid the most speculative and ethically fraught narratives like #4 and especially #5.
