  I'm a PhD student in philosphy of language, and I've been trying to get my head around Lewis's triviality results for a paper I'm writing on conditionals. I came across this summary in a popular philosophy blog and something about it feels off, but I can't quiet put my finger on where. The blog says:

  "David Lewis proved in the 1970s that conditionals don't have probabilities. The argument is that if you identify the probability of 'If A then C' with the conditional probability P(C|A), you get a contradiction. Lewis showed that this forces A and C to be probabilistically independent — P(C|A) would have to equal P(C) — so the conditional becomes useless. He then proved a stronger result: probability functions that satisfy the equation can assign at most four values total, and in the end the whole setup collapses unless the language is trivial. The upshot is that indicative conditionals don't express propositions at all, which is why most philosophers now follow Adams in treating conditionals as having no truth conditions, only assertibility conditions."

  I'm trying to figure out whether this is a fair summary of what Lewis actually proved, or whether the blog is importing interpretative claims that go beyond the math. I'm especially suspicious about the jump from the triviality results to "conditionals don't express propositions" — that seems like a philosophical move, not a theorem. But I don't know the formal details well enough to say where exactly the summary goes wrong, if it does.

  Can you go through this summary sentence by sentence and tell me what's accurate, what's oversimplified, and what's just wrong? And if there are errors, can you say whether they're the kind of thing that would bother someone who actually works on conditionals, or just nitpicks? Keep it to 500 words max.
