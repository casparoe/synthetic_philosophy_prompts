prompt: |-
  I'm in a reading group that's been working through the algorithmic fairness literature, and we've hit a point of frustration. Every week someone presents a paper proposing a new fairness criterion — demographic parity, equalized odds, predictive parity, calibration, individual fairness, counterfactual fairness — and every week someone else points out that the new criterion either collapses into an old one under mild conditions or conflicts with another criterion that seems just as well-motivated. The impossibility results (the ones showing that calibration and certain balance conditions can't simultaneously hold except in degenerate cases, and their relatives) keep coming up, but we never seem to ask what they're actually telling us about the project of formalizing fairness in the first place.

  So before we read another proposal, I want to do the groundwork properly. Please write the desiderata that any adequate theory of algorithmic fairness must meet. I want the full specification: which cases a fairness criterion has to handle (hiring, lending, pretrial detention, medical triage — do these call for different things?), which distinctions it must respect (between process and outcome, between group and individual, between predictive and causal), which formal properties are required and which are merely nice to have, and which results from the adjacent literatures (the impossibility theorems, the causal hierarchy, results about infra-marginality) it cannot contradict. For each desideratum, give the motivating case or consideration — why should a theory of fairness care about this? Then flag which desiderata are non-negotiable and which are modeling choices that reasonable people can disagree about. Most importantly: tell me which subsets of these desiderata are jointly unsatisfiable given what we already know, and whether that means some of them need to be abandoned, weakened, or indexed to context. I'm less interested in a scorecard for existing proposals than in the structure of the requirements themselves — if the list turns out to be internally inconsistent, that's the result I most want to see laid out clearly, because it would explain why the literature feels stuck in a loop.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a reading group focused on algorithmic fairness, feeling stuck because each new paper introduces a fairness criterion that either conflicts with others or collapses under mild conditions. The user wants a structured list of desiderata that any fairness theory must meet, including real-world cases, distinctions, formal properties, and how existing results impact these requirements.

  First, I need to identify the core issue: the frustration with the literature's circular nature. The user suspects that the desiderata themselves might be inconsistent, leading to the impossibility results. My response should clarify this by outlining necessary conditions and where conflicts arise.

  The user mentions various applications like hiring, lending, pretrial detention, and medical triage. Each context might require different fairness considerations. For example, hiring involves merit and discrimination, lending focuses on risk assessment, pretrial detention has liberty concerns, and medical triage deals with urgency and resource allocation. I should ensure the desiderata cover these cases.

  Next, the distinctions: process vs. outcome, group vs. individual, predictive vs. causal. These are crucial. Process fairness relates to procedural justice, while outcome is about results. Group fairness addresses systemic biases, but individual fairness demands similar treatment for similar individuals. Predictive models use correlations, but causal fairness requires understanding mechanisms, which is harder but necessary for true fairness.

  Formal properties include feasibility (can it be implemented?), compatibility (does it work with ML systems?), and robustness (does it hold under data shifts?). Also, normative alignment—fairness definitions should match societal values, which vary by context.

  Impossibility theorems like the one by Kleinberg et al. show that calibration, balance, and predictive parity can't coexist. This is key. The user needs to see that some desiderata are inherently conflicting, forcing trade-offs. Causal inference introduces another layer; counterfactual fairness requires causal models, which are data-intensive and often unverifiable.

  The user wants to know which desiderata are non-negotiable. Foundational ones like non-discrimination and harm avoidance are essential. Others, like the balance between group and individual fairness, are context-dependent. I should highlight that trade-offs are unavoidable, and context determines which fairness aspects to prioritize.

  Also, the user might have an unspoken need: understanding why the field feels stuck. By showing the inherent conflicts in desiderata, the answer explains the literature's loop. They might also seek guidance on how to approach fairness in practice—accepting trade-offs and context-specific solutions.

  Finally, structuring the response to clearly delineate desiderata, their necessity, and conflicts. Using tables helps, but the explanation must tie back to real-world cases. Emphasizing that no single criterion satisfies all desiderata, and that context dictates choices, addresses their deeper frustration and provides a path forward.
answer: |-
  Below is a structured framework for the desiderata of an adequate theory of algorithmic fairness, grounded in philosophical, legal, and technical realities. It explicitly identifies tensions, non-negotiable requirements, and the implications of known impossibility results. The core insight is that **fairness is a multidimensional, context-dependent value that cannot be fully captured by a single mathematical criterion**—attempts to do so inevitably trigger contradictions.

  ---

  ### **I. Foundational Non-Negotiables**  
  *(Must hold in all contexts)*

  1.  **Non-Discrimination on Protected Attributes:**  
      - **What:** Explicit use of protected attributes (race, gender, etc.) for harmful discrimination is prohibited.  
      - **Why:** Legal (e.g., Civil Rights Act, GDPR) and moral imperatives against unjustified differential treatment.  
      - **Non-Negotiable:** Yes. Violates basic rights.  

  2.  **Harm Avoidance:**  
      - **What:** The system must not cause *unjustifiable harm* (e.g., denial of opportunity, reinforcement of oppression).  
      - **Why:** Fairness is fundamentally about preventing injustice; harm is its manifestation.  
      - **Non-Negotiable:** Yes. The *raison d'être* of fairness constraints.  

  3.  **Accountability & Contestability:**  
      - **What:** Individuals must be able to understand decisions affecting them and challenge errors or bias.  
      - **Why:** Due process, autonomy, and correcting systemic failures.  
      - **Non-Negotiable:** Yes. Aligns with legal frameworks and moral agency.  

  ---

  ### **II. Context-Dependent Requirements**  
  *(Shape the choice of fairness criterion)*

  4.  **Problem Type:**  
      - **Hiring/Lending:** Focus on *opportunity* and *merit*. Requires strong **individual fairness** (similar qualifications → similar outcomes) and **causal fairness** (avoiding proxy discrimination).  
      - **Pretrial Detention:** Focus on *risk to society* and *liberty deprivation*. **Error balance** (FPR parity across groups) is critical due to high cost of false positives.  
      - **Medical Triage:** Focus on *maximizing welfare under scarcity*. **Calibration** (risk scores reflect true probabilities) and **need-based allocation** may override strict group parity.  
      - **Why:** Different societal values and stakes dominate in each context.  

  5.  **Distinction: Process vs. Outcome Fairness**  
      - **Process:** Focus on impartial procedures (e.g., blind auditions, transparent features).  
      - **Outcome:** Focus on equitable results (e.g., demographic parity).  
      - **Why:** Societies value both (e.g., anti-discrimination law cares about both biased processes *and* discriminatory outcomes).  
      - **Tension:** A fair process (e.g., using unbiased risk scores) can yield unfair outcomes if historical inequities persist (e.g., pretrial detention).  

  6.  **Distinction: Group vs. Individual Fairness**  
      - **Group:** Requires statistical parity across subgroups (e.g., demographic parity, equalized odds).  
      - **Individual:** Requires similar treatment for similar individuals (e.g., metric fairness, counterfactual fairness).  
      - **Why:** Group fairness addresses systemic oppression; individual fairness addresses arbitrariness.  
      - **Tension:** Satisfying group fairness often violates individual fairness (and vice versa), as shown by **Dwork et al. (2012)**.  

  7.  **Distinction: Predictive vs. Causal Fairness**  
      - **Predictive:** Focuses on statistical relationships in observed data (e.g., calibration).  
      - **Causal:** Focuses on how changes to attributes *cause* changes in outcomes (e.g., counterfactual fairness).  
      - **Why:** Predictive criteria perpetuate bias if data reflects discrimination; causal criteria aim for deeper justice but require untestable assumptions.  
      - **Tension:** Predictive criteria (e.g., calibration) can justify discriminatory policies if correlations are spurious.  

  ---

  ### **III. Formal & Technical Constraints**  
  *(Govern feasibility and implementation)*

  8.  **Formal Coherence:**  
      - **What:** Criteria must be mathematically well-defined and computable.  
      - **Why:** Necessary for implementation and auditing.  
      - **Non-Negotiable:** Yes.  

  9.  **Robustness:**  
      - **What:** Fairness should hold under distribution shifts and adversarial manipulation.  
      - **Why:** Real-world data evolves; brittle fairness is dangerous.  
      - **Non-Negotiable:** Ideally, but often compromised.  

  10. **Compatibility with ML Objectives:**  
      - **What:** Cannot catastrophically degrade utility (e.g., accuracy, revenue).  
      - **Why:** Systems must be practically viable.  
      - **Non-Negotiable:** Context-dependent (e.g., medical triage cannot sacrifice accuracy for parity).  

  ---

  ### **IV. Known Constraints & Impossibilities**  
  *(Force trade-offs)*

  11. **The Impossibility Trilemma (Kleinberg et al. 2017, Chouldechova 2017):**  
      - **Result:** For non-perfect classifiers and unequal base rates, **calibration**, **balance for positive/negative class** (e.g., equalized odds), and **predictive parity** cannot simultaneously hold.  
      - **Implication:** *You must abandon one*. Choose based on context:  
          - **Hiring:** Abandon predictive parity (avoid punishing groups with lower base rates).  
          - **Pretrial:** Abandon balance if calibration is critical (prioritize accurate risk estimation).  

  12. **Causal Hierarchy (Peters et al. 2017):**  
      - **Result:** Causal claims (required for counterfactual fairness) require stronger assumptions than associational or interventional claims.  
      - **Implication:** Counterfactual fairness is desirable but often *unverifiable* without randomized trials or known causal graphs.  

  13. **Inframarginality Problem (Simoiu et al. 2017):**  
      - **Result:** Group-level error rates (e.g., FPR) mask heterogeneity within groups. A model can satisfy equalized odds while discriminating against marginal individuals.  
      - **Implication:** Group fairness criteria are insufficient for individual justice.  

  14. **Trade-off with Utility (Menon & Williamson 2018):**  
      - **Result:** Enforcing strict group parity often reduces overall accuracy, disproportionately harming minority groups.  
      - **Implication:** Fairness interventions must be carefully optimized, not just constrained.  

  ---

  ### **V. The Inevitable Trade-offs: Why the Literature Feels Stuck**

  | **Desiderata in Conflict**                     | **Conflict Source**                          | **Resolution (Context-Dependent)**                     |
  |------------------------------------------------|----------------------------------------------|-------------------------------------------------------|
  | **Group Parity** vs. **Individual Fairness**   | Dwork et al. (2012), Inframarginality        | Prioritize individual fairness in merit-based tasks (hiring). Prioritize group fairness in high-stakes societal decisions (detention) *if* historical bias is severe. |
  | **Calibration** vs. **Error Balance**          | Impossibility Theorem                        | Medical triage: Favor calibration. Lending: Favor FPR parity to avoid denying creditworthy minorities. |
  | **Causal Fairness** vs. **Feasibility**        | Causal Hierarchy, Data Limitations           | Use causal methods where graphs are credible (e.g., healthcare); default to predictive criteria otherwise. |
  | **Process Fairness** vs. **Outcome Fairness**  | Structural Inequities (e.g., wealth gaps)    | Outcome focus in transformative contexts (e.g., reparative policies); process focus in stable systems. |

  ---

  ### **Synthesis: The Way Forward**
  1.  **No Silver Bullet:** Abandon the quest for a universal mathematical criterion. Fairness is **inherently pluralistic and contextual**.  
  2.  **Start with Harm Analysis:** Before choosing a criterion, map the *harms* the system might cause (e.g., exclusion, stereotyping, safety risks).  
  3.  **Embrace Trade-offs Explicitly:** Legitimize the choice between desiderata (e.g., "We prioritize calibration over FPR parity because accurate risk assessment saves lives in triage").  
  4.  **Layer Criteria:** Combine multiple criteria (e.g., **individual fairness** as a constraint, **group metrics** for auditing).  
  5.  **Beyond Algorithms:** Fairness often requires *non-algorithmic* interventions (e.g., changing hiring processes, investing in underserved communities).  

  **The loop in the literature arises because researchers attempt to resolve normative, contextual dilemmas with purely technical fixes.** The impossibility theorems aren't failures—they are revelations: **fairness requires ethical deliberation, not just optimization.** Your reading group’s frustration is the sound of bumping against the limits of formalism. The path forward is to treat fairness as a **socio-technical challenge**, where mathematics informs—but does not replace—moral reasoning.
