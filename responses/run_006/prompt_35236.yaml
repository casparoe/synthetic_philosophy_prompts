  First, I need to recall Austin's performative theory and the reductionist critique. Austin introduced performatives as utterances that do something rather than describe. For example, "I promise" enacts the promise. Constitutivists stress constitutive rules and sui generis acts. Reductionists argue it's all about communicative intentions and social conventions without metaphysical uniqueness.

  The user's explicit needs are clear: a structured document with four sections. But deeper, they might need clarity after years of debate, a neutral framework to move forward, and assurance that their summary won't bias towards either side. They also want academic rigor by distinguishing settled vs. contested points.

  For the agreed claims, list uncontroversial aspects both sides accept. Things like performatives existing, felicity conditions mattering, and their conventional nature. Avoid anything contentious like whether they're sui generis.

  The disagreements table needs precise wording. Constitutivists: performatives are sui generis, rules aren't reducible. Reductionists: analyzable via Gricean mechanisms, social conventions suffice. Must use each camp's acceptable language.

  Cruxes are key. Identify sub-questions where resolution could change views. For example, if felicity conditions reduce to Gricean norms, or if performatives have a metaphysical distinctiveness. Each crux needs a test case both sides acknowledge as relevant. Predictions from each camp show how they'd interpret outcomes.

  Tests should be concrete. Like the "I order" vs. "I command" case. Constitutivists predict different felicity conditions; reductionists see no difference if conventions are similar. Or institutional vs. informal contexts to test necessity of conventions.

  Ensure everything is balanced. Highlight where consensus exists (e.g., performatives aren't truth-evaluable) and where it doesn't (metaphysical status). Avoid implying one side is default. The user stressed not to present contested views as consensus, so I need to be meticulous in labeling what's agreed versus disputed.

  Also, consider the group's fatigue. Providing clear cruxes and tests can help focus discussions. The user might need a framework that prevents circular debates by directing attention to empirical or logical tests. Including predictions forces both sides to commit to falsifiable outcomes, which is crucial for progress.
answer: |-
  Here’s a draft structured to meet your requirements, grounded in established debates and carefully distinguishing consensus from contention. I’ve drawn on Austin, Searle, Grice, Strawson, Bach/Harnish, and contemporary critiques to ensure neutrality.

  ---

  ### **Adversarial Collaboration: Performative Utterances**  
  **Draft for Signatory Approval by Both Camps**  

  ---

  ### **(1) Agreed Claims**  
  *(Uncontested foundations both camps accept)*  

  1.  **Performatives Exist:** Certain utterances (e.g., "I promise," "I name this ship") are not primarily descriptive but *do* something (promising, naming, etc.) under appropriate conditions.  
  2.  **Felicity Conditions Matter:** Performatives require non-truth-conditional conditions to "succeed" (e.g., authority, context, sincerity). Infelicities can render them void or "unhappy."  
  3.  **Social-Conventional Dimension:** Performatives rely on shared linguistic/social conventions (e.g., marriage vows require institutional backing).  
  4.  **Not Truth-Evaluable:** Performatives lack truth values *in their performative dimension* (saying "I promise" isn’t *true/false*; it’s *felicitous/infelicitous*).  
  5.  **Communicative Intent Required:** The speaker must intend their utterance to be recognized as a performative act (rejection of accidental performatives).  
  6.  **Data to Explain:**  
      - The "doing" aspect of performatives vs. constatives.  
      - The role of institutional facts (e.g., marrying, sentencing).  
      - Infelicities (misfires, abuses).  

  ---

  ### **(2) Disagreements Table**  
  *(Positions stated as each camp would endorse)*  

  | Aspect                     | Constitutivist Position (Austin/Searle-Inspired)                                                                                                                                 | Reductionist Position (Grice/Bach-Harnish-Inspired)                                                                                                                                 |
  | :------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of Performatives** | Performatives are a *sui generis* linguistic category. The utterance *constitutes* the act itself via constitutive rules (not merely describes it). "I promise" *is* promising. | Performatives are a pragmatic subclass of communicative acts. The act (e.g., promising) is *caused* by the utterance via recognized speaker intentions, not constituted by it.       |
  | **Rules & Mechanisms**     | Constitutive rules (felicity conditions) create institutional realities irreducible to psychological states or communicative norms. These rules have normative force beyond convention. | Felicity conditions reduce to: (a) Gricean communicative intentions, (b) mutual beliefs about social conventions, and (c) perlocutionary effects. No metaphysically distinct "rules." |
  | **Metaphysical Distinctness** | Performatives create institutional facts (e.g., obligations, marriages) with objective, non-psychological existence via collective recognition of constitutive rules.             | Institutional facts are patterns of attitudes and behaviors sustained by mutual belief and convention. No ontologically distinct "social reality" beyond individual psychology.       |
  | **Role of Convention**     | Conventions *enable* constitutive rules but do not exhaust them. Rules have a normative/logical priority.                                                                        | Conventions *are* the mechanism (shared plans/norms). What constitutivists call "rules" are emergent regularities from Gricean communication + social coordination.                     |

  ---

  ### **(3) Cruxes**  
  *(Resolving these would shift at least one camp’s position)*  

  1.  **Crux 1: Reducibility of Felicity Conditions**  
      *Can felicity conditions be fully analyzed as Gricean communicative intentions + mutual belief in social conventions?*  

  2.  **Crux 2: Metaphysical Status of Institutional Facts**  
      *Do successful performatives create objective social facts (e.g., obligations) that exist independently of ongoing collective attitudes, or are they entirely constituted by those attitudes?*  

  3.  **Crux 3: Explanatory Priority**  
      *Do performatives require appeal to *sui generis* "constitutive rules," or do standard pragmatic tools (intention-recognition, convention) suffice?*  

  ---

  ### **(4) Tests & Predictions**  
  *(Concrete cases/arguments with advance predictions)*  

  #### **Test for Crux 1: "The Accidental Authority"**  
  - **Case:** A stranger at a wedding (mistaken for a priest) says "I pronounce you married." Participants sincerely believe they’re married. Later, the error is discovered.  
  - **Constitutivist Prediction:** Utterance was **infelicitous** (misfire due to lack of authority). No marriage exists. Constitutive rules are objective.  
  - **Reductionist Prediction:** If participants *mutually believed* the speaker had authority and acted on it (e.g., cohabited, filed taxes jointly), a *social fact* of marriage existed until discovery. Felicity reduces to operative mutual belief.  
  - **Why it Bears on Crux 1:** Tests whether authority is a brute constitutive rule or reducible to mutual belief.  

  #### **Test for Crux 2: "The Unrecognized Promise"**  
  - **Case:** A speaker sincerely says "I promise to φ" in a private diary, unheard by anyone. The speaker later feels obligated to φ.  
  - **Constitutivist Prediction:** **No promise exists.** Promising requires uptake (hearer recognition) as per constitutive rules. Feeling obligated is mistaken.  
  - **Reductionist Prediction:** **A promise exists** if the speaker intended to undertake an obligation (Gricean self-directed communication). Social conventions may shape the intention but aren’t strictly necessary.  
  - **Why it Bears on Crux 2:** Tests whether obligations require institutional/collective recognition or can arise from individual intentionality.  

  #### **Test for Crux 3: "The Novel Performative"**  
  - **Case:** In a community with no concept of "adopting" friends, someone says "I hereby adopt you as my sibling," establishing rituals, obligations, and recognition.  
  - **Constitutivist Prediction:** **Fails initially** (no constitutive rules exist). Success requires iterative establishment of rules (collective intentionality over time).  
  - **Reductionist Prediction:** **Can succeed immediately** if speaker/hearer coordinate via Gricean intentions + ad-hoc convention ("We’re doing something new"). No pre-existing rules needed.  
  - **Why it Bears on Crux 3:** Tests whether *sui generis* rules are necessary or if pragmatic tools explain rule-creation.  

  ---

  ### **Explicitly Settled vs. Contested**  
  - **Settled (Consensus):**  
    - Performatives ≠ constatives.  
    - Felicity conditions are necessary.  
    - Sincerity conditions exist (e.g., insincere promises are abusive but valid).  
    - Conventional settings boost performative efficacy (e.g., courts vs. cafés).  
  - **Genuinely Contested:**  
    - Whether performatives are *metaphysically distinctive*.  
    - Whether constitutive rules are *irreducible*.  
    - Whether institutional facts are *mind-independent*.  
    - Whether Gricean machinery *fully explains* performativity.  

  ---

  **Next Steps for Your Group:**  
  1. Have both camps formally approve the wording of their positions (Section 2).  
  2. Conduct "tests" as thought experiments: Debate outcomes *before* revealing camp predictions.  
  3. For unresolved cruxes, identify *new* tests or empirical work (e.g., corpus studies on novel performatives).  

  This structure forces clarity on *why* disagreement persists while respecting both frameworks. By pre-committing to tests, you avoid talking past each other. Good luck breaking the stalemate!
