prompt: |-
  I've been working through the Frege–Geach problem for expressivism and I've arrived at an argument that seems to show that if expressivism solves the problem at all, it does so in a way that makes it a theory of all language, not just moral language. That can't be right, but I can't find the misstep.

  (1) Expressivism says moral sentences like "Lying is wrong" express non-cognitive attitudes — say, disapproval of lying — rather than beliefs with truth conditions.

  (2) The Frege–Geach problem: "Lying is wrong" occurs unasserted in "If lying is wrong, then getting your little brother to lie is wrong." The speaker of the conditional needn't disapprove of lying, yet the sentence is meaningful. So the meaning of a moral sentence is not exhausted by the attitude it expresses when asserted.

  (3) The standard expressivist fix is compositional: the conditional expresses a higher-order attitude — disapproval of simultaneously disapproving of lying while failing to disapprove of getting one's brother to lie. Logical connectives map attitudes to attitudes.

  (4) But now apply the same compositional machinery to descriptive language. "If the cat is on the mat, then the cat is not in the kitchen" can be analyzed as expressing a higher-order attitude — say, disapproval of simultaneously believing the cat is on the mat while failing to believe the cat is not in the kitchen. And "The cat is on the mat" expresses the attitude of believing that the cat is on the mat.

  (5) So descriptive language, too, is a system for expressing attitudes — beliefs being one kind of attitude — and logical connectives operate on attitudes in exactly the same way.

  (6) But then the distinction between cognitive and non-cognitive discourse, which expressivism needs in order to state what makes moral language special, is just a distinction between two species of attitude-expression. The view has become a global expressivism, and the original contrast with cognitivism evaporates.

  (7) If the expressivist resists (4) by insisting that descriptive language gets a different, truth-conditional semantics, then the challenge is to explain why the compositional machinery that saved moral language from the Frege–Geach problem cannot be applied to descriptive language. What principled difference between the two domains blocks the move?

  My study group is split. Half say (4) is illegitimate because belief contents compose truth-functionally in a way that non-cognitive attitudes don't, so the parallel fails. The other half say that if attitudes compose via their contents at all — disapproval of lying is keyed to the content "lying" — then the expressivist is already smuggling in propositional content at step (3) and the view collapses into cognitivism before we even reach step (4). I can't tell which objection is stronger, or whether there's a third diagnosis I'm missing.

  Which step should I reject, and what does rejecting it cost the expressivist?
reasoning: |-
  Okay, the user is grappling with the Frege-Geach problem in expressivism, specifically how solving it might lead to global expressivism. They've outlined a seven-step argument and are stuck between two objections from their study group. I need to figure out where the misstep is and what rejecting that step costs the expressivist.

  First, I should recall the core issue. Expressivism says moral sentences express non-cognitive attitudes like disapproval. The Frege-Geach problem points out that in unasserted contexts like conditionals, the attitude isn't expressed, yet the sentence has meaning. The standard solution uses compositional semantics where connectives map attitudes to higher-order attitudes.

  The user's argument extends this to descriptive language. If "if lying is wrong" expresses disapproval of conflicting attitudes, then "if the cat is on the mat" could similarly express disapproval of conflicting beliefs. This leads to global expressivism, blurring the cognitive/non-cognitive divide. The study group has two objections: one about truth-functional composition of beliefs versus attitudes, and the other about expressivism smuggling in propositional content.

  I need to evaluate these objections. The first objection claims beliefs compose truth-functionally while non-cognitive attitudes don't. But if expressivism uses propositions as part of attitude contents, as in step (3) where disapproval is of "lying," then propositions are already involved. That might undermine the non-cognitivist stance. The second objection points out that if attitudes compose via contents, expressivism collapses into cognitivism. 

  The key misstep is likely step (4). Applying the same machinery to descriptive language assumes that the compositional semantics for moral language can be directly transferred. But expressivists can argue that beliefs have different functional roles. Beliefs aim at truth and are regulated by evidence, whereas non-cognitive attitudes don't. So the higher-order attitude for descriptive conditionals isn't just disapproval but a complex state tied to truth conditions. 

  However, if expressivism uses propositions in the content of attitudes, as in "disapproval of lying," then they're invoking propositions anyway. That might make their view quasi-realist, accepting propositions while denying their ontological commitment. But then the distinction becomes one of attitude type rather than content. 

  The stronger objection is that expressivism relies on propositions in step (3), making it hard to resist step (4). But expressivists like Gibbard use world-norm pairs or other constructs to avoid propositions. Still, the challenge is explaining why moral and descriptive language differ compositionally without ad hoc moves. 

  Rejecting step (4) by differentiating attitude types allows expressivism to maintain its core, but at the cost of needing a robust theory of belief versus non-cognitive attitudes. The cost is developing a dual semantics: one for moral attitudes and another for beliefs. This might complicate the theory but preserves the distinction. The deeper cost is that if propositions are part of attitude contents, expressivism risks becoming a form of cognitivism, which is the collapse mentioned in step (6).
answer: |-
  Your analysis brilliantly exposes a genuine tension in expressivism, and both objections from your study group touch on crucial points. The misstep lies in **step (4)**, but rejecting it comes with significant costs for the expressivist. Here's the breakdown:

  **The Misstep: Illegitimate Transfer in Step (4)**

  Step (4) assumes that the compositional machinery developed *specifically for non-cognitive attitudes* in step (3) can be applied *without modification or justification* to descriptive language involving beliefs. This transfer is not justified and overlooks a fundamental difference in the nature of the attitudes involved:

  1.  **Nature of Belief:** Beliefs are *representational* and *truth-apt*. They aim to describe the world and are constitutively governed by norms of truth and evidence. Their content *is* a proposition with truth conditions. The functional role of belief involves responsiveness to evidence and integration into reasoning about how the world *is*.
  2.  **Nature of Non-Cognitive Attitudes:** Attitudes like disapproval are *conative* or *evaluative*. They are not primarily representational (though they may have representational content). They express pro/con stances, commitments, plans, or preferences. Their functional role involves motivation, practical reasoning about what *to do*, and are not directly governed by norms of truth (though they can be rational/irrational).

  **Why the Parallel Fails (Addressing the First Objection)**

  Your study group's first half is partially right, but the key isn't *just* that beliefs compose truth-functionally while non-cognitive attitudes don't (though that's a symptom). The deeper point is that **the compositional rules *needed* for the two types of attitudes are fundamentally different because of the attitudes' functional roles:**

  *   **Composition for Beliefs:** The meaning of "If P, then Q" involving beliefs *can and must* be explained in terms of the *truth conditions* of P and Q. The complex attitude expressed (the state of mind of accepting the conditional) is *constituted by* a disposition to infer Q if you come to believe P, or to reject P if you come to believe not-Q, etc. This functional role is grounded in the *representational content* and the *aim at truth*. The "higher-order attitude" you propose in (4) ("disapproval of believing P and not-Q") is an awkward, unnecessary, and misleading redescription of this standard truth-conditional, inferential role. It doesn't capture the *core* functional role of belief.
  *   **Composition for Non-Cognitive Attitudes:** Expressivism *needs* a different kind of composition precisely because non-cognitive attitudes *lack* truth conditions and the associated inferential role based on truth. The "higher-order attitude" (e.g., disapproval of disapproving lying while not disapproving of getting your brother to lie) *is* the core functional role for the moral conditional. It *defines* what it is to accept that conditional in the moral domain – it's a constraint on one's conative states. This compositional rule *isn't* grounded in truth conditions; it's grounded in norms of consistency and coherence for planning/valuing.

  **Addressing the Second Objection (Smuggling in Content)**

  The second half of your study group is also onto something important, but it's not fatal *if* the expressivist is careful. Yes, expressivism in step (3) often uses *proposition-like* entities ("lying") as the *content* of the attitude (disapproval *of lying*). This is almost unavoidable:

  *   **The Cost of Rejecting Step (4):** The expressivist *must* embrace a **dualistic semantics** or a **dualistic theory of attitude composition**. They must argue that:
      *   Beliefs compose via *truth-conditional*, *representational* rules grounded in their world-directed functional role.
      *   Non-cognitive attitudes compose via *inferential*, *constraint-based* rules grounded in their practical/conative functional role (like the higher-order attitudes in step (3)).
  *   **Why This Doesn't *Necessarily* Collapse into Cognitivism:** Expressivism can maintain that moral sentences *express* non-cognitive attitudes, *not* beliefs, even while acknowledging that the *contents* of those attitudes involve proposition-like items. The key is the *type of attitude* and its *functional role*:
      *   Uttering "Lying is wrong" expresses *disapproval (of lying)*.
      *   Uttering "The cat is on the mat" expresses *belief (that the cat is on the mat)*.
      *   The *fact* that both attitudes have proposition-like objects ("lying", "the cat is on the mat") doesn't mean the *sentences express the same kind of mental state*. The distinction remains in the psychological mode: belief vs. disapproval.
      *   The compositional rules for complex sentences *exploit* these proposition-like contents *differently* based on the attitude type: truth-functionally for beliefs, via conative/inferential constraints for non-cognitive attitudes.

  **What Rejecting Step (4) Costs the Expressivist:**

  1.  **Loss of Theoretical Uniformity/Symmetry:** The expressivist gives up the dream of a single, elegant compositional semantics covering all language. They must posit two fundamentally different compositional mechanisms. This complexity is a significant theoretical cost.
  2.  **The Burden of Explaining the Difference:** The expressivist must provide a robust, independently motivated account of the difference between cognitive and non-cognitive attitudes that *explains why they require different compositional rules*. Simply stating the difference isn't enough; they need a theory of attitudes that justifies the dual semantics. This often relies heavily on functional role theories of mental states.
  3.  **The Quasi-Realist Tightrope:** By allowing proposition-like contents for non-cognitive attitudes, expressivism flirts with cognitivist *language*. The quasi-realist project (e.g., Blackburn, Gibbard) aims to show how expressivism can *mimic* realist/cognitivist discourse (truth, propositions, facts) without the ontological commitments. Rejecting step (4) commits the expressivist deeply to this quasi-realist project. The cost is the constant need to explain away the surface similarities to cognitivism and defend the underlying attitudinal difference.
  4.  **The Challenge of Mixed Discourses:** Sentences like "If lying is wrong and lying causes suffering, then we should discourage it" mix moral and descriptive elements. The expressivist must explain how their dual compositional mechanisms interact seamlessly in such cases, which is complex.

  **Conclusion and Recommendation:**

  Reject **Step (4)**. The compositional machinery developed to solve Frege-Geach for *non-cognitive* attitudes (step 3) cannot be simply transferred to govern the composition of *beliefs* (step 4). Beliefs require a compositional semantics grounded in their representational nature and truth-conditional content, which is distinct from the constraint-based composition needed for non-cognitive attitudes. The expressivist must adopt a **dualistic semantics**.

  *   **Stronger Objection:** The second objection (smuggling in content) highlights the *cost* of this rejection – the expressivist must embrace quasi-realism and carefully navigate the use of proposition-like contents without collapsing into full-blown cognitivism. This is a major ongoing challenge for the view.
  *   **Weaker Objection:** The first objection (truth-functional composition) is correct in spirit but slightly misstated. It's not *just* that beliefs compose truth-functionally, but *why* they do (their functional role) that blocks the transfer, and that non-cognitive composition *isn't* truth-functional.

  Your argument successfully shows that expressivism cannot solve Frege-Geach while maintaining a *naive* distinction between moral and descriptive language. It forces the expressivist onto the path of quasi-realism and a complex, dualistic semantics, where the distinction rests entirely on the type of attitude expressed and its functional role, not on the absence of proposition-like content. This is the genuine, significant cost of solving Frege-Geach for expressivism.
