answer: |-
  Here's a breakdown of the implicit theories of meaning underlying these legal practices, distinguishing necessary commitments from pragmatic justifications and areas of philosophical underdeterminacy:

  ### 1. **Contract Law (Parol Evidence Rule)**  
     - **Practice**: Excludes evidence of prior negotiations or subjective intent when a written contract is integrated and unambiguous.  
     - **Implicit Theory of Meaning**: Prioritizes the **objective, public meaning** of the text — what a reasonable person would understand from the "four corners" of the document.  
     - **Neutral Justifications**:  
       - **Administrability**: Courts avoid costly, unreliable battles over "he said/she said" evidence.  
       - **Third-Party Reliance**: Banks, assignees, or successors must trust the document’s face value.  
       - **Incentive Alignment**: Sophisticated parties are pushed to draft comprehensively.  
     - **Philosophical Commitment?** Not strictly. The rule *fits* a textualist theory (meaning resides in public language), but it could coexist with an intentionalist view where parties are *presumed* to have embedded intent into the final text.  
     - **Underdetermined Aspects**:  
       - A theory valuing *authorial intent* could still support the rule if parties are seen as intentionally "crystallizing" their intent in writing.  
       - The rule collapses if the text is ambiguous — opening the door to intent evidence. This suggests meaning isn’t *purely* textual but context-dependent.

  ---

  ### 2. **Wills (Admission of Testator Intent)**  
     - **Practice**: Courts freely admit evidence of testator intent (e.g., letters, witnesses) even for facially clear wills.  
     - **Implicit Theory of Meaning**: Centers on the **subjective, author-specific intent** of the testator.  
     - **Practical Justifications**:  
       - **Unilateral Document**: Wills lack bargaining; fairness demands fidelity to the testator’s wishes.  
       - **Equitable Function**: Probate courts act as "testator’s voice" to prevent unjust outcomes.  
       - **No Strategic Drafting**: Testators are rarely "sophisticated parties," reducing concerns about incentivizing precision.  
     - **Relevance of Third-Party Reliance?**: Limited. Heirs’ expectations matter less than the dead testator’s intent. Courts prioritize justice over predictability.  
     - **Philosophical Commitment?** Strongly intentionalist, but not absolute. If extrinsic evidence contradicts clear text, courts may still defer to the text to avoid absurdity.  

  ---

  ### 3. **Statutory Interpretation (Textualism vs. Intentionalism)**  
     - **Textualist Practice**: Considers only the enacted text’s "ordinary meaning," rejecting legislative history.  
       - **Implicit Theory**: **Public meaning** — law is what the text communicates to a reasonable reader.  
       - **Neutral Justifications**:  
         - Legislative history is easily manipulated (e.g., cherry-picked statements).  
         - Only the *enacted text* underwent bicameralism and presentment.  
         - Promotes democratic accountability (citizens can read the law).  
     - **Intentionalist Practice**: Consults legislative history to discern legislative purpose.  
       - **Implicit Theory**: **Authorial intent** — meaning derives from lawmakers’ goals.  
       - **Neutral Justifications**:  
         - Text alone may be ambiguous or produce absurd outcomes.  
         - History clarifies technical terms or compromises.  
     - **Philosophical Commitment?**  
       - Textualism often *invokes* public-meaning philosophy (e.g., Scalia: "Law is what Congress enacted, not what it intended").  
       - Yet it can be defended *without* philosophy: Legislative history is unreliable; judges aren’t historians.  
     - **Underdetermined Aspects**:  
       - Both sides use "purpose" or "context" — textualists define it from text alone; intentionalists use external evidence.  
       - A judge could reject legislative history on institutional grounds while privately believing in authorial meaning.  

  ---

  ### Key Cross-Cutting Insights:  
  1. **Theory vs. Pragmatism**:  
     - **Contracts**: Rules prioritize predictability and efficiency, *aligning with* textualism but not mandating it.  
     - **Wills**: Equity and unilateralism favor intent, making intentionalism the natural fit.  
     - **Statutes**: Textualism’s institutional arguments (e.g., judicial competence) can stand apart from philosophy.  

  2. **Why Different Treatment of Third-Party Reliance?**  
     - **Contracts**: Reliance is commercial and systemic (markets need certainty).  
     - **Wills**: Reliance is individualized; courts favor intent to correct unfairness.  
     - **Statutes**: Textualists argue citizens rely on public texts; intentionalists say purpose ensures just outcomes.  

  3. **Philosophical Underdeterminacy in All Domains**:  
     - A **public-meaning theorist** could support wills’ intentionalism on fairness grounds.  
     - An **intentionalist** could back the parol evidence rule to enforce parties’ *final* written intent.  
     - **Textualists** and **intentionalists** in statutory interpretation both claim to seek "objectivity" — one in language, the other in purpose.  

  **Conclusion**: Each practice *presupposes* a default theory of meaning (textualism for contracts, intentionalism for wills, split for statutes), but all can be justified pragmatically. The parol evidence rule doesn’t *require* rejecting authorial intent; statutory textualism doesn’t *require* believing words have fixed public meanings. Legal practices are hybrids of philosophy, institutional logic, and context-specific values — revealing that the law prioritizes functional outcomes over hermeneutic consistency.
