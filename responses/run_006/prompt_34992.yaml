prompt: |-
  I've been reading around in philosophy of mind, and I keep coming back to this fight about the "Cartesian theater." Dennett introduced the term in *Consciousness Explained* back in 1991, and the basic idea is that we tend to imagine consciousness as having a central place in the brain where experiences are "presented" to an inner observer — like a little homunculus watching a screen. Dennett says this picture is deeply wrong and proposes the multiple drafts model instead: there's no single place or time where consciousness "happens"; instead, the brain runs many parallel streams of processing, and what we call a conscious experience is more like a narrative that gets cobbled together, with no canonical version and no central audience.

  Here's what frustrates me: this debate has been going for over thirty years and it doesnt seem to have moved. On one side you have people who say Dennett is basically right but the multiple drafts model is underspecified — it's a metaphor, not a mechanism. On the other side you have people who say Dennett is an eliminativist who denies the existence of subjective experience, which he insists he isn't doing. And then there are the people who say the whole framing is wrong and we need a different starting point entirely. Meanwhile the same moves get made over and over: someone says "but what about the redness of red," Dennett says "you're still in the grip of the Cartesian theater," and around we go.

  I want a diagnosis of what kind of disagreement this actually is. My hunch is that it's not really one debate but several tangled together — a disagreement about what would count as an explanation of consciousness, a disagreement about whether first-person reports are data or just more behavior, and maybe a disagreement about what "consciousness" even refers to. But I'm not sure, and I'd like someone who knows the literature to actually sort through the strands.

  If my framing is confused or I'm mischaracterizing the state of the debate, tell me that plainly — don't just politely answer the question as posed.

  Please structure your response like this:

  - **The positions** (about 300 words): Lay out the main camps in this debate as concretely as you can, with what each side actually says, not caricatures. Include at least the Cartesian theater critic (Dennett and allies), the qualia realist who thinks Dennett misses something, and any other camp you think is important.

  - **What the debate looks like it's about vs. what it's really about** (about 400 words): Distinguish the surface disagreements from what you think the deeper disagreements are. This is where the diagnosis lives.

  - **What kind of disagreement each strand is** (about 400 words): For each strand you identify, say whether it's a verbal dispute, a disagreement about what counts as data, a clash of starting intuitions, an empirical question in disguise, or something else. Be specific about why you classify each strand the way you do.

  - **What would count as progress** (about 300 words): Given your diagnosis, say what — if anything — could actually move the debate. An experiment? A conceptual distinction? A formal result? A change of question? Be honest if you think some strands are probably unresolvable and explain why.

  - **Confidence and caveats** (about 200 words): Flag the parts of your diagnosis you're least confident about, and say where someone who knows the literature better than you do would probably push back.
