answer: |-
  Your rejection of pure time preference (PTP) in favor of temporal neutrality—discounting only for uncertainty, opportunity costs, and instrumental factors—is a position held by philosophers like Derek Parfit, Henry Sidgwick, and Frank Ramsey. However, several challenges arise, ranked below by their force (decisive to awkward). Crucially, defenders of temporal neutrality *do* concede some of these as serious counterarguments requiring refinement, not mere "demandingness" objections.

  ---

  ### **Ranked Counterarguments (Strongest to Weakest)**

  1. **Infinite Horizons and Paralysis**  
     - **Problem**: With infinite time horizons, temporal neutrality generates irreconcilable contradictions (e.g., the **Mere Addition Paradox** or **Vallentyne's Puzzle**). If each future generation has positive well-being, adding more people *ad infinitum* makes all outcomes incomparable or equally optimal. Any action (or inaction) becomes indefensible.  
     - **Why decisive?** Formal results in population ethics (e.g., **Arrhenius’s Impossibility Theorem**) show *no* coherent axiology can satisfy neutrality, Pareto efficiency, and non-arbitrary thresholds simultaneously over infinite futures.  
     - **Concession**: Defenders (e.g., Broome) admit this requires modifying neutrality (e.g., **"causal dilution" thresholds** or **discounting due to cosmological uncertainty**).

  2. **Non-Identity Problem**  
     - **Problem**: Choices affecting who exists in the distant future (e.g., climate policy) create "different people." Temporal neutrality cannot condemn creating a future person with a life *worth living but suboptimal*, since that person wouldn’t otherwise exist. Harm is undefined.  
     - **Why strong?** Neutrality demands optimizing for future welfare, but if identities are contingent, it may permit catastrophes (e.g., 10^12 future people living at *barely* positive well-being).  
     - **Concession**: Parfit acknowledged this as a "repugnant" implication. Solutions involve **person-affecting restrictions** or **impersonal threshold views**, compromising pure neutrality.

  3. **Personal Identity and Discounting**  
     - **Problem**: Parfit’s psychological reductionism suggests that "you" are not a metaphysically persistent entity. If future-you is psychologically disconnected (e.g., dementia), discounting their welfare becomes rational—not due to time, but *changed identity*.  
     - **Why strong?** Neutrality assumes a single enduring self. If identity is gradual, **prudence** might *require* discounting based on psychological continuity.  
     - **Concession**: Defenders distinguish **prudential rationality** (personal identity) from **moral neutrality** (interpersonal). But this bifurcation risks inconsistency.

  4. **Spatio-Temporal Asymmetry**  
     - **Problem**: We treat spatial distance (e.g., suffering in New York vs. Nairobi) differently from temporal distance. Neutrality condemns *both* as arbitrary, yet spatial partiality (e.g., prioritizing family/community) is widely accepted as legitimate.  
     - **Why awkward?** The analogy suggests temporal discounting is no less rational than partiality to spatially proximate others. If partiality is justified for relationships, why not for temporally proximate selves?  
     - **Defender Response**: Neutralists reject spatial partiality too (e.g., Singer’s famine argument). The position is consistently cosmopolitan.

  5. **Motivational and Epistemic Collapse**  
     - **Problem**: Without *some* PTP, agents may lack motivation to act (e.g., "Why sacrifice for 1,000 years hence if it’s no less urgent than now?"). Worse, **Kolmogorov complexity** implies uncertainty compounds so severely over deep time that *any* discount rate collapses to near-zero, making cost-benefit analysis impossible.  
     - **Why awkward?** Not a normative flaw, but a **pragmatic incoherence**: neutrality demands uncomputable sacrifices for untraceable benefits.  
     - **Concession**: Instrumental discounting for "practical unknowability" (e.g., Bostrom’s **"extremum principle"**) is often smuggled in, diluting neutrality.

  6. **Evolutionary and Cognitive Arguments**  
     - **Problem**: PTP is evolutionarily adaptive (prioritizing immediate rewards aids survival) and cognitively entrenched (hyperbolic discounting is neurally embedded). A theory requiring total debiasing may be **alien to human moral psychology**.  
     - **Weakness**: This is a **debunking argument**, not a normative refutation. Neutralists reply ethics should correct biases (e.g., racism), not indulge them.

  ---

  ### **How Defenders Qualify the Position (and Risks)**  
  Temporal neutrality is often insulated via:  
  - **Domain Restrictions**: Applied only to policy/long-term planning, not personal decisions (e.g., Caney).  
  - **Causal Dilution**: Discounting effects beyond predictability horizons (e.g., >10,000 years) due to chaotic systems.  
  - **Lexical Thresholds**: Prioritize avoiding catastrophe over marginal gains (e.g., Gardiner’s "tyranny of the contemporary").  
  - **Expected Value Surrogates**: Use proxy discount rates for uncertainty (e.g., 0.1% for existential risk mitigation).  

  **Is this insulation problematic?**  
  - **Yes**, if *ad hoc*: Qualifications risk becoming "excuses" to avoid counterarguments (e.g., arbitrarily capping neutrality at 500 years).  
  - **No**, if principled: E.g., "**causal impotence**" (we can’t affect deep future identities) or **epistemic humility** (we can’t model complex systems) are grounded in instrumental rationality, not normative surrender.  

  ---

  ### **Conclusion**  
  The strongest counters are **infinite paralysis** and **non-identity problems**, conceded by neutrals as requiring refinement. **Personal identity** challenges coherence, while **spatial asymmetry** tests consistency. Pragmatic/epistemic issues are persistent but not fatal.  

  If your goal is a *practicable* ethic for long-term policy, temporal neutrality survives if bounded by causal knowledge and identity constraints. If you seek a *universal moral axiom*, infinite horizons and non-identity may force concessions. The position isn’t falsified but **domain-limited**—still robust for intergenerational justice within "reasonable" timeframes (e.g., climate ethics).  

  For key sources:  
  - **Infinite Ethics**: Nick Bostrom (*Superintelligence*), Gustaf Arrhenius.  
  - **Non-Identity**: Derek Parfit (*Reasons and Persons*).  
  - **Personal Identity**: David Velleman (*Persons in Prospect*).  
  - **Epistemic Limits**: Martin Weitzman (Dismal Theorem).
