prompt: |-
  I run a small team that writes safety assessments of industrial plants for a regulator, and I have to sign off on every one. We're under pressure to go faster, and my boss wants us to divide and conquer: one analyst reads only the maintenance logs, another only the incident reports, a third only the training records, and then a lead stitches their writeups into a single judgment about the plant. Sometimes this works fine. Other times the lead misses a contradiction between two analysts that a single person reading both would have caught, or each part looks fine but the whole plant is obviously not safe and the lead can't see why. I want a reusable decision procedure for when to factor an assessment into separate subtasks and when one analyst has to hold the whole thing. I've heard this called factored cognition, and I want the procedure to be true to that idea, not generic management advice. The analysts won't sit through any theory, so the procedure has to be just questions and rules, in order, with a clear statement of what would settle each one. It needs a point where it says stop and don't factor, and it needs to mark the places where it can't decide and has to kick the call up to me because it's a judgment rather than a fact. Then test it on two cases: a small routine assessment where the temptation is to split it anyway, and a big messy one where the parts look separable but the whole is more then the sum of them. Make sure at least one case gives a result I won't like, and be honest about where the procedure will misfire. Write the whole thing as continuous prose only, no headings, bullets, bold, or tables, like an email.
reasoning: |-
  Okay, the user runs a small team that writes safety assessments for industrial plants. They're under pressure to speed up, and the boss suggests dividing the work: one analyst reads maintenance logs, another incident reports, etc., then a lead stitches it together. But sometimes contradictions are missed or the overall picture isn't captured. The user wants a reusable decision procedure based on "factored cognition" to decide when to split tasks and when to keep them whole. They want it in plain prose like an email, with clear questions and rules, a stop point, and places where it kicks up to them. Also, test it on two cases: one small routine where splitting is tempting, and one big messy one where the whole is more than the sum of parts. One case should give an unpopular result, and be honest about misfires.

  First, I need to recall what factored cognition is. It's about breaking down complex tasks into subtasks handled by individuals, with mechanisms to combine results and catch errors. Key elements include decomposition, verification, and information hiding. The user wants a procedure true to this, not generic advice. The analysts won't sit through theory, so it must be practical: questions and rules in order, with what settles each one. Include a "stop and don't factor" point, and mark where judgment is needed, kicking decisions up to the user.

  Structure the procedure: Start with prerequisites, then a series of questions that lead to a decision. Each question should have a clear yes/no and what settles it, with paths to proceed, stop, or escalate. End with a decision to factor or not. After that, test with two cases as specified.

  Outline the key questions:
  1. **Is the assessment decomposable?** Can it be split into independent parts? If not, stop. Settled by data flow: minimal overlap in inputs and outputs. Escalate if uncertain.
  2. **Are subtasks self-contained?** Can each be understood without constant reference to others? Settled by whether analysts can work independently without needing others' outputs. If not, stop. Escalate if borderline.
  3. **Is there a clear stitching mechanism?** Can the lead combine parts reliably? Settled by predefined integration rules. If not, stop or escalate.
  4. **Is efficiency gain worth it?** Time saved vs. risk of missing connections. Settled by time estimates and past errors. If net negative, stop. Escalate if ambiguous.

  For the stop point: If any question is a clear no, don't factor. Escalation points where judgment is needed.

  Now, for the test cases:
  - **Case 1: Small routine assessment.** E.g., a well-understood plant with standard protocols. Temptation to split, but procedure should allow it or not based on questions.
  - **Case 2: Big messy assessment.** E.g., a plant with interdependent issues, like maintenance affecting incidents, or cultural problems not in any single log. Parts seem separable but whole is unsafe. Procedure might say don't factor, which user might not like due to time pressure. Be honest about misfires: e.g., when subtasks aren't perfectly separable but seem so, leading to missed contradictions.

  Misfire scenarios: When the procedure assumes separability but issues are latent; or when stitching relies too much on the lead's judgment without clear rules.

  Ensure the whole thing is in continuous prose, no markdown. Write it like an email.

  Key elements from user's needs: Reusable, based on factored cognition, practical for analysts, clear escalation. Address the pain points: missed contradictions and holistic unsafety.

  Finally, make sure one case results in "don't factor" that the user won't like, e.g., in the big messy case where splitting would save time but is unsafe.
answer: |-
  Here's a reusable decision procedure for when to factor safety assessments, based strictly on the principles of factored cognition (task decomposition, information hiding, recombination verification, and error correction). I've kept it as a sequence of concrete questions with unambiguous criteria for answers, escalation triggers, and a hard stop. Analysts can run through this without theory—it’s just operational checks. I’ll then test it on your two cases, including one where it delivers bad news.

  **Procedure Start:**  
  Before factoring any assessment, ask these questions in order. Use the plant’s historical assessment data, incident trends, and analyst task logs to settle factual questions. If a question can’t be answered with data or a pre-agreed rule, escalate to me immediately—don’t proceed. Begin with Question 1.

  **Question 1: Are there discrete, non-overlapping data sources or risk categories?**  
  This is settled by mapping the plant’s inputs: maintenance logs, incident reports, training records, etc. If these sources have less than 10% cross-referenced entries in past assessments (e.g., maintenance logs rarely cite incident reports), answer yes. If sources share overlapping variables (e.g., incident reports often reference training gaps), answer no. If overlap is ambiguous (e.g., 10–25% cross-reference), escalate.  
  - **Yes → Proceed to Question 2.**  
  - **No → Stop. Do not factor. One analyst holds the whole assessment.**  
  - **Escalate → I’ll review the mapping.**

  **Question 2: Can subtasks be defined with strict information hiding?**  
  This means an analyst working on one subtask (e.g., maintenance logs) needs no output from another subtask (e.g., incident reports) to complete their work. Settle this by checking if any subtask requires assumptions about another. For example, if judging maintenance compliance requires knowing if an incident occurred, answer no. If all subtasks rely only on their own isolated data, answer yes. If subtasks are independent but one affects prioritization (e.g., a high incident rate changing maintenance scrutiny), escalate.  
  - **Yes → Proceed to Question 3.**  
  - **No → Stop. Do not factor.**  
  - **Escalate → I’ll define task boundaries or veto.**

  **Question 3: Is there a recombination rule for verifying consistency?**  
  Factored cognition requires a mechanical step to catch contradictions, not just stitching. Settle this by confirming a predefined checklist exists for the lead to cross-check subtask outputs. For example: "If Maintenance Analyst reports >5 overdue repairs AND Incident Analyst reports >2 equipment-failure incidents, flag contradiction." If no such rule exists or it covers less than 90% of past contradiction types (per audit logs), answer no. If rules exist but miss edge cases (e.g., cultural issues), escalate.  
  - **Yes → Proceed to Question 4.**  
  - **No → Stop. Do not factor until rules are added.**  
  - **Escalate → I’ll approve/deny the rule set.**

  **Question 4: Does factoring reduce net error risk?**  
  Speed isn’t enough; factoring must lower the chance of missing critical failures. Settle this by comparing: (A) Time saved by factoring (historical average: e.g., 20 hours faster), versus (B) Risk cost, calculated as [probability of missing a contradiction/holistic risk] × [severity if missed]. Use past data: if factoring caused errors in ≥2 similar plants, default to no. If time saved >40 hours and zero past errors, answer yes. If risk is ambiguous (e.g., new plant type), escalate.  
  - **Yes → Factor the assessment.**  
  - **No → Stop. Do not factor.**  
  - **Escalate → I’ll weigh the risk/time trade-off.**  

  **Procedure End.** If you reach "Factor," subtasks proceed with strict info hiding. The lead must apply the recombination rule before stitching writeups. Any unresolved flags during recombination escalate to me.

  ---

  **Test Case 1: Small Routine Assessment (Temptation to Split)**  
  *Scenario:* A cookie-cutter water treatment plant with standardized protocols. Maintenance logs are digitized and incident-free for 3 years. Training records are boilerplate. Data sources show <5% overlap historically.  
  - **Q1:** Yes (sources are discrete).  
  - **Q2:** Yes (training records need no incident context).  
  - **Q3:** Yes (recombination rule: "If maintenance compliance = 100% AND incidents = 0, auto-approve").  
  - **Q4:** Yes (saves 15 hours; near-zero risk based on 10 identical past plants).  
  **→ Outcome:** Factor. This works, but the temptation to skip the procedure is high. Misfire risk: if complacency masks a hidden corrosion issue (unlikely here).

  **Test Case 2: Big Messy Assessment (Parts Seem Separable but Aren’t)**  
  *Scenario:* An aging chemical plant with patchy record-keeping. Maintenance logs show delayed repairs, incident reports cite "minor" leaks, and training records are incomplete but pass audits. Each part looks okay alone, but the whole plant feels unsafe due to deferred maintenance compounding spill risks. Historical data shows 30% overlap between sources (e.g., incidents linked to training).  
  - **Q1:** Escalate (overlap is 30%—above threshold). *I review: Overlap is high (maintenance delays leak incidents; training gaps ignored in logs).* **I rule: No.**  
  - **Q2:** (Not reached; hard stop at Q1).  
  **→ Outcome:** Stop. Do not factor. One analyst must handle it all.  
  **Why you won’t like it:** This plant is a time sink, and factoring could save a week. But the interdependence (maintenance × incidents) means splitting would likely miss the "whole greater than sum" risk. The procedure blocks it.  
  **Misfire honesty:** Here, the procedure works. But it will misfire in two scenarios: First, if data sources are artificially "clean" (e.g., maintenance logs omit incident references), Q1 may falsely pass. Second, if recombination rules are too rigid (e.g., only checking numeric thresholds), Q3 may miss qualitative mismatches (e.g., "compliant" training vs. reckless culture). Both rely on historical data being truthful—which is your biggest vulnerability.

  This procedure prioritizes error reduction over speed by design. It’ll frustrate your boss when it says "stop," but it’ll catch those hidden fractures a stitched report would miss. I’ll refine it after we use it on a few real cases—let me know when to trial-run.  

  Best,  
  [Your Name]
