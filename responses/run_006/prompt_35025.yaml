prompt: |-
  I've been trying to extract a principle from my own moral intuitions the way I'd extract a specification from a pile of test cases, and I've reached the point where the obvious implementations all fail. I'd like you to help me find the principle — or the small set of candidate principles — that best fits the cases below, and to tell me honestly which of my verdicts any proposed principle has to overturn.

  Here are the cases, with my gut verdicts.

  1. Sam finds a wallet full of cash and returns it with everything in it, because Sam thinks that is simply what a decent person must do. I judge this morally worthy — full marks.

  2. Priya returns a lost wallet because a reward has been posted and she wants the money. The wallet gets back to its owner, but I do not judge Priya's action morally worthy.

  3. Lena donates to a famine-relief charity because she has spent time in the affected region and is genuinely distressed by the suffering there. Morally worthy, yes.

  4. Marcus donates to the same charity because giving makes him feel good about himself — a kind of warm glow — and he does not think much about the recipients. I am inclined to say not morally worthy, or at most worth very little.

  5. Ruth visits a sick friend in the hospital because she is worried about him and wants to comfort him. Morally worthy, yes.

  6. Tom visits the same sick friend purely out of a sense of obligation. He would rather not be there and feels no particular warmth, but he believes he must go. I still judge this morally worthy, though not in quite the same way as Ruth's visit.

  7. Jordan jumps into a river and saves a drowning child because a news crew is filming and Jordan wants to be seen as a hero. The child is saved, but I do not judge Jordan's action morally worthy.

  8. This is the case that breaks my simple theories. Alex, a junior engineer, covers for a teammate's mistake on a client deliverable. Alex has been taught, incorrectly, that covering for a teammate in this situation always violates the company's integrity policy and is therefore wrong. Alex does it anyway, not for any advantage and not to be liked, but because he cannot stand to see the teammate — who has been treated unfairly all quarter — get fired for one error. Alex believed at the time that he was doing something wrong. I still judge that the action had moral worth.

  The obvious principle is something like: an action has moral worth if and only if it is done because the agent believes it is the right thing to do. That gets Sam, Tom, Priya, and Jordan right, but it fails Alex outright, and it also seems wrong about Lena, who is not thinking in terms of rightness at all — she is thinking about the suffering. The other obvious principle is: an action has moral worth if and only if it is done for the reasons that actually make the action right. That handles Lena and Alex, but I am not sure it handles Tom, and it seems to require a settled view about what makes actions right, which I do not have.

  So my questions are these. Is there a principle — stated precisely, not just gestured at — that captures all or nearly all of these verdicts? If not, which verdict should I give up, and why that one rather than the others? And what would the best candidate principle say about a few cases I have not settled: a nurse who works overtime caring for patients because she promised her late mother she would, without any particular feeling for the patients; a manager who refuses to fudge an audit because he is afraid of going to jail; and a person who returns a lost item because they cannot bear the thought of the owner's distress, without ever framing the act as a matter of rightness or duty?
reasoning: |-
  Okay, the user is wrestling with moral philosophy, trying to extract a consistent principle from their intuitive judgments about various scenarios. They've presented eight cases with their gut verdicts and two attempted principles that fail to capture all cases—particularly Alex's case where someone acts against their own moral belief but still seems morally worthy.  

  Hmm, the user's frustration is palpable—they're treating ethics like a programming problem, trying to "extract specifications from test cases." That’s a clever framing but also revealing: they want logical coherence but are hitting edge cases (Alex) that break their models. Their deeper need might be reconciling intuition with systematization—either adjusting principles or reconsidering verdicts.  

  The core tension is between motivation-based and outcome-based theories. The obvious "duty-belief" principle (act because you think it’s right) fails Lena (who acts from compassion, not duty) and Alex (who acts against his belief). The "right-reasons" principle (act for objectively correct reasons) struggles with Tom (who acts from obligation, not warmth) and requires objective moral truth, which the user wants to avoid.  

  Alex’s case is the key disruptor. The user insists Alex’s action has moral worth despite him believing it’s wrong. Why? Because his motive—protecting an unfairly treated teammate—feels intuitively commendable. This suggests the user values *compassionate impulse* even when it conflicts with rules. But then why reject Priya (reward-driven) or Marcus (warm-glow donor)? All three act from self-interest, but Alex’s self-interest is absent—he sacrifices for another.  

  Ah! Maybe the unifying thread is *other-regarding motivation*. Sam (decency), Lena (distress at suffering), Ruth (concern for friend), Tom (duty to friend), Alex (protecting teammate) all center others’ welfare. Priya (reward), Jordan (fame), Marcus (self-feelings) center self. But Tom’s "cold duty" complicates this—he acts from obligation, not care. Yet the user approves, so obligation *to another person* might still count as other-regarding.  

  The best candidate principle emerging: **An action has moral worth iff the agent’s motivating reason is responsive to the well-being of others.** This handles:  
  - Sam: decency (proxy for others’ rights)  
  - Lena/Ruth: direct concern for others  
  - Tom: obligation (indirectly other-regarding)  
  - Alex: compassion for teammate  
  - Rejects Priya/Jordan/Marcus (self-interested)  

  But it reframes Marcus: if "warm glow" is his sole motive, it’s self-focused—no moral worth. The nurse case (promise to mother) is tricky: is honoring a dead parent other-regarding? If the promise *concerns patient care*, yes; if purely personal, no. The manager fearing jail fails (self-interest). The distressed returner passes (responsive to owner’s suffering).  

  Where this principle strains: Tom’s action is approved but feels different than Ruth’s warmth. The user might need to accept graded worth—Tom’s is "lesser" but still passes. Alex remains the hardest case; if the user won’t budge on him, this principle holds. But if they reconsider Alex (e.g., "he ignored his duty belief—that’s reckless"), the duty-belief principle could work.  

  Recommendation: Stand by Alex’s verdict. His compassion overrides flawed belief, showing moral worth isn’t just about rule-following. The other-regarding principle captures this while excluding selfish acts. For unresolved cases:  
  - Nurse: moral worth if promise connects to others (e.g., "Mom taught me to care for patients"); else not.  
  - Manager: no worth (fear is self-interest).  
  - Distressed returner: worth (responsive to owner’s pain).  

  Final note: The user might need to tolerate some fuzziness. Ethics isn’t code; motives are messy. But this principle gets closest to their intuitions.
answer: |-
  Based on your cases and verdicts, I propose a candidate principle that captures *almost* all your intuitions. The core tension is Alex (acting against his belief) vs. the "duty-belief" principle, while Lena (motivated by empathy, not duty) breaks the rigid "rightness" framing. Here's the principle I believe best fits your judgments:

  **Principle:**  
  *An action has moral worth iff the agent’s motivating reason is directly responsive to the perceived interests or well-being of others (including avoiding harm to them), and this responsiveness is not merely instrumental to self-interest.*

  ### How this handles your cases:
  1. **Sam**: Returns wallet because "a decent person must do it" (responsive to owner's interests). ✅  
  2. **Priya**: Motivated by reward (self-interest). ❌  
  3. **Lena**: Donates due to distress at suffering (directly responsive to others' well-being). ✅  
  4. **Marcus**: Donates for "warm glow" (self-interest). ❌  
  5. **Ruth**: Visits friend out of worry/comfort (responsive to friend's well-being). ✅  
  6. **Tom**: Visits out of obligation (responsive to friend's need, even without warmth). ✅  
  7. **Jordan**: Saves child for fame (self-interest). ❌  
  8. **Alex**: Covers for teammate to prevent unfair firing (responsive to teammate's well-being, despite flawed belief). ✅  

  ### Why this works:
  - **Solves the Alex problem**: His action is motivated by compassion for the teammate’s unfair treatment, not self-interest or abstract duty.  
  - **Handles Lena**: Her distress *is* a form of responsiveness to others' suffering.  
  - **Explains Tom vs. Priya**: Tom’s obligation is a proxy for the friend’s needs (other-regarding), while Priya’s reward is self-serving.  
  - **Rejects Marcus/Jordan**: Their motives center on self-benefit (feeling good/fame), not others’ welfare.

  ### The one tension: Tom’s "cold obligation"
  - Your verdict: Tom’s action is worthy but "not in the same way" as Ruth’s.  
  - **Principle’s verdict**: It accepts Tom because obligation *can* be a legitimate expression of concern for others (e.g., "I owe it to him").  
  - **Compromise**: The principle captures *minimal* moral worth, but you might grade it lower than Ruth’s empathetic motive. This aligns with your intuition that it’s "not quite the same."

  ### Cases requiring verdict revision:
  The principle forces you to **reject Marcus more decisively**. If his *sole* motive is the "warm glow" (not the recipients’ welfare), it lacks moral worth. Your current verdict ("very little" worth) is inconsistent with how you judged Priya/Jordan. Consistency requires either:  
  - Downgrading Marcus to ❌ (no worth), OR  
  - Upgrading Priya/Jordan to minimal worth (which you clearly reject).

  ---

  ### Your unresolved cases analyzed:
  1. **Nurse works overtime due to a promise to her late mother**:  
     - **Principle’s verdict**: ❌ *No moral worth.*  
     - Why: The motive is fidelity to a personal promise/relationship, not responsiveness to patients’ needs. If she *also* considered patient welfare, it might share worth (like Tom), but pure promise-keeping is self-referential.  
     - *Your likely verdict*: Probably ❌ if she has no feeling for patients (analogous to Marcus’ warm glow).

  2. **Manager refuses to fudge an audit due to fear of jail**:  
     - **Principle’s verdict**: ❌ *No moral worth.*  
     - Why: Motive is self-preservation, not a concern for ethical integrity or others harmed by fraud.  
     - *Your likely verdict*: Consistent with Priya/Jordan (❌).

  3. **Person returns a lost item to spare the owner distress**:  
     - **Principle’s verdict**: ✅ *Moral worth.*  
     - Why: Directly responsive to the owner’s well-being (avoiding distress), not self-interest or duty.  
     - *Your likely verdict*: Consistent with Lena/Ruth (✅).

  ---

  ### Why not other principles?
  - **"Done because believed right"**: Fails Lena (not thinking of "rightness") and Alex (acted against belief).  
  - **"Done for objectively right reasons"**: Requires contested moral realism, fails Tom (his belief was obligation, not objective rightness), and struggles with Alex (he thought it was *wrong*).  
  - **"Altruistic motivation"**: Too vague; Priya’s reward-seeking is "altruistic" in outcome but not motive. Our principle specifies *direct responsiveness* to others’ interests.

  ### Conclusion
  **Best candidate**: *Moral worth requires the agent’s motive to be directly responsive to others’ well-being, not self-interest.*  
  - **Captures**: 1, 3, 5, 6, 8, and the distressed returner.  
  - **Overturns**: Marcus (must be ❌, not "very little").  
  - **Tolerates**: Tom’s "cold" obligation as minimally worthy.  

  If you *must* keep Marcus as having "some" worth, consider a graded principle:  
  > *Moral worth increases with the degree to which the agent’s motive is non-instrumentally responsive to others’ well-being.*  
  This gives Marcus low worth (self-benefit dominates), Tom medium (obligation as proxy), and Ruth high (direct empathy). But it adds complexity and may still struggle with Alex.

  Alex is your litmus test. If you hold that his compassion *deserves* moral worth despite his belief, the proposed principle is your strongest fit. If you revise Alex to ❌ ("he ignored his duty!"), the "duty-belief" principle becomes viable. But your intuition about Alex feels pivotal—suggesting moral worth can emerge from empathy *beyond* rules.
