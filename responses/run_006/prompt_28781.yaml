prompt: |-
  I've come to accept a Dennett-style eliminativist view of qualia: the notion of a private, ineffable, intrinsic, immediately apprehensible, and incorrigible subjective property is an incoherent posit, and I take the Chase and Sanborn example to show why. Two coffee tasters both claim they can tell whether a change lies in the taste itself or in their reaction to it, but under further questioning their introspective certainties fail to track any fixed fact about a quale. I want to know what would count against this position. Give me the evidence, arguments, thought experiments, and empirical findings that should move me, ranked from decisive to merely awkward. Distinguish defeaters a committed qualia eliminativist would concede as counting against the view from objections they would dismiss, and say which escape routes are live rather than merely logically possible. In particular, I would find most persuasive a case where the first-person report and the third-person story are both fully fixed and yet something explanatory is still missing; tell me whether such a case exists or can be constructed. Also assess whether the view has been qualified into unfalsifiability, and whether that would be a problem for a view of this kind. End with a final line of the form \answer{...} giving your overall assessment of how exposed the view is in a short phrase, such as \answer{well insulated} or \answer{moderately exposed}.
