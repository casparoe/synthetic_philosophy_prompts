  I'm a PhD student in formal epistemology drafting a dissertation prospectus, and I need a short research proposal — roughly 800 words — on the Judy Benjamin problem. The problem, as you know, is that when an agent receives evidence of the form "given B, the probability of A is p," standard Bayesian resources do not single out a unique posterior. The existing solutions fall into three broad families: minimize relative entropy subject to the constraint, treat the message as an underspecified Jeffrey input and supply a supplementary principle, or argue that conditional messages are not the kind of thing one can directly conditionalize on at all. The proposal I want you to write should pursue the following specific angle: all three families, I suspect, tacitly presuppose an answer to the question of what a conditional probability message semantically conveys — a proposition about the world, a constraint on one's credences, a speech act whose content depends on the conversational context — and this presupposition is what drives the divergence between them. The proposal should (a) make this diagnosis precise, (b) formulate a research question that is open and tractable for a two-year project, (c) describe a method for answering it (purely formal, experimental, or some combination), and (d) specify what a successful outcome would look like and what findings would indicate that the approach should be abandoned. I will add the citations to the relevant literature myself.
