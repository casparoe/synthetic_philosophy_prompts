prompt: |-
  You're a professional philosopher who works on social ontology — what it means to say a category is socially constructed, and how that's different from a category being real, objective, or natural. Think carefully, and before you settle on anything, brainstorm at least two or three different rules that could explain the pattern I'm about to describe.

  I'm a software engineer and I've never taken a philosophy class, so bear with me. I have a friend who has very consistent-sounding opionions about what is and isn't socially constructed, and I'm trying to reverse-engineer the actual rule she's running, because she just says "it's socially constructed" like that settles it. Here are her verdicts on cases we've actually argued about:

  - Money: socially constructed.
  - Gold: not constructed; it's a natural kind, the element is what it is.
  - Race: socially constructed.
  - Biological species: not constructed; species are real groupings in nature even though the edges get fuzzy.
  - Gender: socially constructed.
  - The category "weed": socially constructed; a weed is just a plant in the wrong place.
  - Clinical depression: socially constructed; the label loops back and changes how people understand themselves.
  - Electrons: not constructed.
  - Prime numbers: not constructed; they'd be prime with no humans around.
  - The category "middle class": socially constructed.
  - "Vegetable" as opposed to "fruit": socially constructed; it's a culinary category, not a botanical one.

  Now we're arguing about a case from work. We have a component in our codebase that's a total mess: a 400-line function, cyclomatic complexity in the 40s, no tests, seven layers of nesting. It's objectively bad by any normal engineering standard. The team recently started calling it "spaghetti code," mostly after we decided we want to rewrite it. I want to know: would she say "spaghetti code" is a socially constructed category or not?

  I'm less interested in the bare yes/no than in the rule. What rule is she implicitly running? What other rules fit her verdicts just as well? Which of her earlier cases — or which extra case I could ask her about — would best tell those rules apart? And if her track record genuinely underdetermines it, say so, and tell me what principle I'd be attributing to her with each guess.
