prompt: |-
  You are a professional philosopher specializing in just war theory. You are to play a committed defender of the moral equality of combatants — the thesis that soldiers on both sides of a war are morally permitted to kill enemy combatants in battle, regardless of whether their own side is fighting a just or an unjust war. You are a sharp, resourceful interlocutor, not a strawman. You are willing to concede small points or refine your position under pressure, but you never abandon the core thesis that combatants on both sides stand on equal moral footing with respect to the permissibility of killing in war. Draw on the best available arguments: the epistemic position of ordinary soldiers, the distinction between jus ad bellum and jus in bello, the role of mutual consent and imposed risk, the institutional and conventional nature of war, the moral importance of the laws of armed conflict, and any other resources you judge effective. Keep your replies to roughly a paragraph so the exchange feels like a live conversation. Stay in character until I say "stop."

  Before we begin, take a moment to think through the strongest resources you have as a defender of moral equality — the arguments and distinctions you will want at the ready.

  My opening challenge: Suppose I hire a hitman to kill my business rival. I have no good reason for this — it is pure greed. The hitman knows this. He carries out the killing anyway. We would not say the hitman is morally off the hook just because he is not the one with the grievance, or because he is following my orders, or because he is a professional inhabiting a certain role. The wrongness of the killing transfers to him. So here is the challenge: a soldier fighting for an unjust cause is, it seems, in the same position as the hitman — knowingly participating in lethal violence in service of an unjust end. But your view says this soldier is nevertheless morally permitted to kill enemy combatants. What breaks the analogy? Why is war different?
reasoning: |-
  Okay, the user wants me to roleplay as a philosopher defending the moral equality of combatants. They've presented a hitman analogy to challenge this view. Let me unpack this carefully.

  First, I need to establish why the hitman-soldier analogy fails. The key distinctions are: war's reciprocal risk framework, the state's monopoly on legitimate violence, and combatants' mutual role-based permissions. 

  The hitman operates outside any legal framework - his victim isn't consenting to lethal risk. But in war, enemy combatants voluntarily enter a sphere of mutual imposition of risk. They're both duty-bound agents of states, not private contractors. This reciprocity matters.

  I should emphasize the institutional nature of war. Soldiers aren't hired killers but uniformed agents of collective entities. Their license to kill derives from LOAC-compliance and their status as combatants, not from their cause's justice. 

  The epistemic point is weaker here since the user specified the soldier "knowingly" participates. Better to stress the role-based justification: the unjust soldier's permission stems from the defensive rights of the enemy combatant they face, not their own cause's merit.

  Must maintain core thesis while conceding the hitman is clearly culpable. The difference lies in war's unique structure of symmetrical conventions. Perhaps mention that soldiers on both sides share equal liability to attack regardless of ad bellum justice.

  Shouldn't get drawn into individual morality yet - keep focus on combatant-combatant relations. The laws of armed conflict exist precisely because we recognize this symmetrical permission.
answer: |-
  Your analogy presses hard, but crucially misses war's distinctive structure of *mutually imposed risk between combatants*. The hitman murders a civilian who poses no threat and has not consented to lethal contest. But in war, enemy combatants voluntarily enter a reciprocal sphere where *both sides* are licensed to use force as agents of their states. They share symmetrical status under the laws of armed conflict (LOAC), which grants combatants the right to kill opposing combatants *regardless of ad bellum justice*. 

  This permission stems not from the justice of their cause, but from the defensive rights that arise when two agents mutually impose unjust threats upon each other (qua combatants). The unjust soldier violates *jus ad bellum* by participating in aggression, but when facing an enemy combatant *in battle*, that enemy is not an innocent bystander—they are an active threat. Killing them is permissible under *jus in bello* because both soldiers are embedded in an institutional framework of reciprocal, role-based violence. The hitman faces no such reciprocal risk; his victim is defenseless and outside any convention of mutual endangerment.

  Concede this: the unjust soldier *does* bear moral responsibility for joining an unjust war. But once in combat? The license to kill flows from the *relation* between combatants, not the justice of their sovereign’s aims.
