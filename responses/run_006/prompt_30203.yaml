answer: |-
  You've hit on a profound ethical dilemma – the tension between the validity of a criticism and the credibility of the person delivering it. Your feelings are understandable, and there *are* principled reasons why his criticism holds less weight, even if the core message itself (that lying is bad) is valid.

  Here's a breakdown:

  1.  **Hypocrisy Undermines Moral Authority & Credibility:**
      *   **Moral Standing:** To effectively criticize someone's moral failing, the critic generally needs to be in "good standing" regarding that specific failing. Someone actively engaging in *worse* behavior (prolonged cheating and lying) has significantly undermined their own moral standing to lecture on honesty. It feels inauthentic and performative.
      *   **Credibility Gap:** His past (and potentially present, if he hasn't truly changed) actions create a massive credibility gap. Why should you believe *he* genuinely cares about honesty in relationships when his own track record shows blatant disregard? His criticism lacks the weight of someone who consistently walks the talk.
      *   **Lack of Earned Trust:** Your honest friend has built trust through consistent behavior. This friend has actively destroyed trust through his past actions. Trust is essential for criticism to be received openly. His past actions haven't earned him the right for you to readily accept his moral judgments in this specific domain.

  2.  **The "Tu Quoque" Fallacy (Appeal to Hypocrisy) - A Nuance:**
      *   **The Fallacy:** Simply pointing out the critic's hypocrisy ("Oh yeah? Well *you* did it too!") doesn't automatically invalidate the *truth* of the criticism itself. If the criticism is accurate, it remains accurate regardless of who says it. This is where you need self-honesty: *Are you dismissing the message solely because of the messenger to avoid dealing with your own behavior?*
      *   **Beyond the Fallacy:** However, "tu quoque" isn't always a *pure* fallacy in practical human interactions. While it doesn't logically negate the truth, it *does* severely undermine the critic's *effectiveness* and *perceived legitimacy*. His hypocrisy makes it incredibly difficult, psychologically and relationally, for you to take his criticism seriously. It shifts the focus from your behavior to his glaring inconsistency.

  3.  **The Issue of Constructiveness:**
      *   Criticism from a hypocrite often lacks constructive intent or value. It can feel more like judgment, grandstanding, or even a way for the critic to deflect attention from their own failings ("Look at *me* calling *you* out! See how moral *I* am now?"). Criticism from someone with integrity usually comes with an underlying sense of care and a desire to help you be better.

  **So, are you wrong to feel he's not in a position to lecture you?**

  **No, you are not wrong.** His past and potentially unresolved actions *do* put him in a uniquely poor position to effectively deliver this particular criticism. His hypocrisy significantly diminishes the moral weight and credibility of his words *in this specific context*.

  **However, crucially, this does NOT mean the core criticism itself is invalid.**

  *   **Separate the Message from the Messenger:** Your own admission ("He's not wrong that it's bad and I should probably knock it off") shows you recognize the truth in the *substance* of what he's saying, even if *he* is the worst possible vessel for that message.
  *   **Don't Let His Hypocrisy Be Your Excuse:** The danger lies in using his hypocrisy as a shield to avoid confronting your own behavior. "Well, *he* did worse, so my little lies aren't so bad" is a slippery slope of moral relativism that justifies your own harmful actions.
  *   **Your Honest Friend is the Proof:** The fact that you *would* accept the same criticism from your honest friend demonstrates that your resistance here is primarily about the *source*, not the *content*. That's a key insight.

  **What to do:**

  1.  **Acknowledge the Validity Privately:** To yourself, reaffirm that lying to your girlfriend, even about small things, *is* damaging to trust and the relationship. Commit to changing that behavior *for the sake of your relationship*, not because of your hypocritical friend.
  2.  **Set a Boundary with Your Friend:** The next time he lectures you, calmly say something like:
      *   *"Look, you're not wrong about the lying. I know it's a problem and I'm working on it. But given your history with [his ex's name] and the lying and cheating you did for a year, it's really hard for me to take lectures on honesty from you specifically. It feels hypocritical. I'd appreciate it if you'd back off on that topic with me."*
      *   Focus on *your* feelings ("It's hard for me to take," "It feels hypocritical") and set the boundary ("I'd appreciate it if you'd back off").
  3.  **Focus on Your Own Integrity:** Your goal should be to become more honest in your relationship because it's the right thing to do and builds a healthier partnership, *not* because someone else (hypocritical or not) told you to. Use your honest friend as your model, not the hypocritical one.
  4.  **Reflect on Your Own Lying:** Why do you feel the need to tell these "small" lies? Is it to avoid conflict? Fear of judgment? Habit? Addressing the root cause is key to stopping.

  **In conclusion:** Yes, there is a strong, principled reason (hypocrisy undermining moral authority and credibility) why your friend's criticism carries significantly less weight and feels illegitimate coming from him. You are justified in feeling he has no standing to lecture you. **However, this does not nullify the essential truth that lying to your partner is harmful.** Don't let his hypocrisy become your excuse; use this as motivation to address your own behavior for the sake of your relationship and your own integrity.
