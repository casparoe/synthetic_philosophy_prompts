prompt: |-
  You serve on the Neurotechnology Ethics and Innovation Board of a large research hospital. A neurotechnology company has submitted a single-patient expanded-access application for a patient with a rapidly progressive and otherwise fatal neurodegenerative condition. The proposed procedure is staged whole-brain replacement: over roughly eighteen months and a series of surgeries, small regions of the patient's brain would be removed and replaced, one region at a time, with synthetic modules engineered to reproduce the functional input-output profile of the tissue removed, and each module would be calibrated against the patient's behavior and self-report before the next region is replaced. The company's filing is candid that its longer-term aim is whole-brain emulation and describes this case as a first clinical step. The company argues that because the replacement is gradual and functionally validated, the patient remains the same person throughout, and that the endpoint is simply the same person with a non-biological brain; it also stresses that the alternative is near-certain death within two years. Several board members reject this framing. They maintain that the procedure may preserve a continuing person without preserving the original patient, that the patient's initial consent may not extend to what happens if the person who later exists is not the person who consented, and that no functional test could settle whether the patient survived or was quietly replaced. The patient, who has full decisional capacity, strongly wishes to proceed and says the risk of not surviving is one they are willing to take.

  The chair has asked you to draft the short written opinion to circulate before next week's vote. The opinion should recommend one concrete course of action—approval, rejection, or approval with conditions—together with a time frame, and it should engage the strongest consideration on the losing side seriously rather than as a straw man. As an expert in neuroethics and the philosophy of personal identity, begin by working through the relevant considerations and the available options before settling on your recommendation. Please write the opinion in continuous prose, as one would write a formal letter or email, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user has presented a complex neuroethics scenario involving a radical medical procedure and deep philosophical questions about identity. As someone serving on this ethics board, I need to carefully balance multiple dimensions: the patient's autonomy, philosophical concerns about personal identity, clinical urgency, and broader implications for neurotechnology.

  The core tension here lies between the patient's desperate wish to survive and the board members' legitimate concerns about whether this procedure actually preserves the original person. The company's gradual replacement approach cleverly sidesteps the "ship of Theseus" problem in theory, but in practice, we have no way to verify if continuity of consciousness is truly maintained. 

  What gives me pause is how the patient themselves acknowledges the survival risk but still consents - this isn't just about abstract philosophy but about a real person facing death. Their decisional capacity makes this especially weighty. Still, the board members raise valid points: if the resulting entity isn't the original patient, was the consent valid? And how would we even know?

  I find myself leaning toward conditional approval because the alternative is certain death, but we absolutely must address the identity concerns. The patient needs to understand that we're entering uncharted territory where "survival" may not mean what we think. Additional safeguards could include independent identity monitoring and exit strategies at each stage.

  The philosophical debate about personal identity won't be resolved here - Locke's psychological continuity versus biological theories - but practically speaking, the patient's willingness to accept the risk should carry significant weight. Still, we must document that this is an unprecedented intervention with unknown ontological consequences.

  For the recommendation, I'm considering approval with stringent conditions: staged consent at each module implementation, mandatory identity assessments beyond just functional tests, and external oversight. The time frame should be tight given the prognosis - 30 days to establish protocols - but we can't rush the ethics. The losing side's concern about silent replacement deserves serious engagement in the opinion by acknowledging that no current verification method can conclusively prove persistence of self.

  Ultimately, while we can't eliminate the metaphysical uncertainties, we can ensure the patient makes this choice with eyes wide open to what "survival" might truly mean in this context. The recommendation will reflect that balance.
answer: |-
  **To the Esteemed Members of the Neurotechnology Ethics and Innovation Board,**

  This expanded-access application presents a profound challenge at the intersection of clinical urgency, technological ambition, and fundamental questions of human identity. The patient faces a rapidly fatal neurodegenerative condition with no conventional alternatives, possesses full decisional capacity, and strongly desires this experimental intervention. The proposing company offers a staged whole-brain replacement, arguing it preserves the patient's identity through gradual, functionally-validated module integration, presenting this as the only hope against near-certain death. Conversely, several board members raise compelling objections grounded in the philosophical uncertainty of personal identity survival through such a radical transformation, questioning the validity of initial consent under these potentially identity-altering circumstances, and doubting the sufficiency of functional tests to confirm true survival.

  The strength of the argument for approval lies undeniably in the principle of patient autonomy and the dire clinical reality. A capacitated patient, fully informed of the profound uncertainties and risks—including the core philosophical risk of non-survival—has judged the potential benefit (continued existence, even in a novel form) to outweigh the certainty of death within two years. Respecting this autonomous choice, particularly when facing imminent mortality, carries significant ethical weight. The company’s staged approach, with behavioral and self-report validation between steps, represents a deliberate attempt to ensure functional continuity, which is a widely accepted (though not universally sufficient) criterion for personal identity in many philosophical frameworks. Denying this opportunity could be seen as imposing a philosophical judgment upon a patient willing to accept the existential risk.

  The counterargument, however, is equally powerful and cannot be dismissed. It centers on the intractable nature of personal identity through such radical material and structural substitution. The concern is not merely about functional equivalence, but about the persistence of the *subjective first-person perspective* – the conscious "I." Gradual replacement, even with perfect functional mimicry validated externally, may not guarantee this continuity. We lack any conceivable empirical test to confirm that the consciousness experiencing the later stages is numerically identical to the original patient's consciousness, rather than a functionally identical but distinct entity emerging from the process. This is the core of the "quiet replacement" fear. If this occurs, the original patient's consent becomes ethically problematic: the person consenting ceases to exist, and a new entity emerges without having provided consent for its own creation or the continuation of the process. The initial consent, no matter how capacitated and informed about the *risk* of non-survival, arguably cannot ethically bind a subsequent, potentially different person. The board members highlighting this view correctly identify a fundamental limitation: functional validation, while necessary for clinical safety and integration, is insufficient to resolve the metaphysical question of identity survival. The stakes here transcend clinical risk assessment; they touch upon the very definition of the self.

  Considering the options: Outright rejection prioritizes the profound identity concerns and potential for non-consensual creation of a new entity over the patient's autonomous choice and desperate clinical need. While philosophically defensible, it effectively condemns the patient to certain death, denying them the chance to pursue survival, however defined. Unconditional approval grants the patient's wish but potentially ignores the significant ethical weight of the identity substitution concern and the limitations of consent. The path forward must acknowledge the validity and gravity of both perspectives.

  Therefore, I recommend **approval with stringent, identity-conscious conditions**, to be implemented immediately upon board endorsement, with the first surgery proceeding no sooner than **30 days** from today to allow for condition fulfillment. This timeframe balances the patient's urgent prognosis with the need for rigorous ethical safeguards.

  The conditions are:
  1.  **Enhanced Staged Consent:** The patient must undergo a formal re-consent process before *each* module replacement surgery. This process will explicitly revisit the core identity concern: "Do you understand that the replacement of this brain region, while aimed at functional continuity, carries the philosophical risk that *you*, as the original conscious subject consenting now, may cease to exist, and a new conscious entity may emerge? Do you still wish to proceed with this specific stage?" Documentation of this understanding and reaffirmation of consent at each stage is mandatory. This directly addresses the consent validity concern if identity substitution occurs mid-process.
  2.  **Independent Identity Monitoring:** An independent panel, including experts in neurophilosophy, phenomenology, and clinical neuropsychology (unaffiliated with the company), must be established. Their role is not to judge functional integration (the company's domain) but to conduct regular, in-depth interviews with the patient throughout the process. They will specifically probe subjective experiences of self-continuity, narrative identity, and any perceived shifts in core sense of self, using both structured and phenomenological approaches. Their reports, focusing solely on subjective identity markers, will be provided to the board before each subsequent stage is approved. This creates a mechanism to detect potential subjective discontinuities that functional tests might miss.
  3.  **Predefined Exit Criteria:** Clear, objective criteria must be established, agreed upon by the board, the independent panel, and the company, defining significant deviations in functional integration or subjective identity reports that would trigger an automatic pause for full board review and potential termination of the procedure, regardless of the patient's wishes at that later stage. This ensures an ethical off-ramp if evidence suggests the process is not preserving the intended continuity.
  4.  **Comprehensive Data Sharing & Publication:** All data (de-identified where appropriate, but including detailed subjective reports with patient consent) related to functional outcomes and subjective identity experiences must be shared with the board and ultimately published, regardless of success or failure. This is crucial for advancing the ethical and scientific discourse on whole-brain emulation.

  This conditional approval respects the patient's autonomy and dire need for intervention while taking the profound identity concerns with the utmost seriousness. It does not resolve the philosophical question – no procedure or condition can do that – but it creates structured mechanisms to navigate the uncertainty. It ensures consent is an ongoing, informed confrontation with the core risk at each stage, establishes independent monitoring for subjective discontinuity, and provides clear safeguards. The strongest consideration on the losing side – that functional tests cannot prove identity survival and initial consent may not cover substitution – is not overcome but is met with heightened vigilance and specific ethical controls embedded within the process itself. The patient accepts the risk; our duty is to ensure that risk is managed with the deepest possible ethical scrutiny at every step of this unprecedented journey.

  Sincerely,

  [Your Name/Title]
  Expert in Neuroethics and Philosophy of Personal Identity
