prompt: |-
  A friend and I have been going back and forth about what makes something a law of nature rather than a mere regularity, and I have been keeping track of her verdicts in the hope of pinning down the rule she is running. She is not a naive regularist: she denies that a law is just any true universal generalisation. For instance, she says that a regularity that holds only within one isolated corner of a world, however exceptionlessly it holds there, is not a law of that world. She also denies lawhood to a regularity that holds across all of space and time but is framed in a gerrymandered, unnatural vocabulary — say, a generalisation about all emeralds being grue, where grue means green before some arbitrary date and blue after it. But she does count these as laws: in a Newtonian world, the generalisation that all electrons have charge −e; and in a simple world containing many Fs and many Gs, the generalisation that all Fs are Gs, where that generalisation is simple, strong, and not derived from anything more basic. What I cannot tell is whether she thinks lawhood is ultimately a matter of how neatly a generalisation organises the world's history — so that a true, simple, strong regularity could count as a law even if nothing further lies behind it — or whether she thinks a law requires some extra connection between the properties involved, over and above the regularity itself.

  The case I want to predict her on is this. Consider a world whose entire history is such that all swans are white. The generalisation is simple and strong, and it would be included in the best systematisation of that world's history. But suppose I stipulate that there is no deeper connection between being a swan and being white: it is, in the strongest sense, a cosmic accident that no swan has ever been otherwise. Would she count the generalisation that all swans are white as a law of that world? I am less interested in the bare yes or no than in the rule she seems to be running, the other rules that fit her earlier verdicts just as well, and what each of those rules predicts here. Please give your best prediction of her verdict, with the reasons for preferring it over the alternatives, say how confident you are and where the prediction is genuinely underdetermined, and identify a further case that would best tell the candidate rules apart. If the exercise is badly posed — for example, if my stipulation of a cosmic accident is doing no real work, or if the dispute over such cases is merely verbal — say so plainly rather than working around it. Please write your answer in British English.
reasoning: |-
  Hmm, the user is asking me to help predict their friend's stance on what makes something a law of nature versus a mere regularity. They've provided several examples of her verdicts: she rejects local regularities and gerrymandered ones like "all emeralds are grue," but accepts fundamental laws like Newtonian electron charge and simple, strong, non-derived generalizations in a basic world. The key uncertainty is whether lawhood requires simplicity and strength alone or some deeper connection between properties.

  The specific case is about a world where all swans are white by sheer accident—no underlying reason—and the generalization is simple and strong. The user wants me to predict if she'd call this a law, but more importantly, to infer the rule she's using and how confident I am in that prediction.

  First, I need to analyze her prior verdicts. She dismisses localized regularities, which suggests she cares about universality—laws must apply everywhere, not just in pockets. The rejection of "grue" shows she values natural vocabulary, meaning the properties must be fundamental or non-arbitrary. Her acceptance of fundamental laws like electron charge implies she's fine with laws that are basic and unexplained. Crucially, in the simple world with Fs and Gs, she accepts the generalization as law if it's simple, strong, and not derived from anything else—that points toward a systematicity view, where laws are about neat organization in the best description of the world.

  Now, for the swan case: it's universal, simple, and strong, so it fits the simplicity-strength criterion. But the stipulation is that it's a cosmic accident—no deeper connection. If her rule is purely about systematization, like in the best system account, she might still call it a law because it simplifies the description. But if she requires some extra metaphysical glue, like necessity or causation, she might reject it.

  Other possible rules include: (1) a pure best system view, where simplicity and strength suffice; (2) a view that requires the properties to be natural kinds, like "electron" vs. "swan"; or (3) a necessity view that demands more than just regularity. Her prior acceptance of the F-G example in a simple world suggests she doesn't insist on natural kinds or necessity—she said "not derived from anything more basic," meaning it can be fundamental without explanation. That leans toward option 1.

  So, my prediction: she would say it is a law, based on the systematization rule. Confidence is moderate—about 70%—because the "cosmic accident" part might make her hesitate, but her verdicts don't clearly require more than regularity. To test this, I can propose a further case: in a world with only one swan that's white by accident. If she rejects it as not universal, that confirms the universality aspect. If she accepts it in the all-swan case, it supports the systematization view. If she rejects even the all-swan accident, it hints at a necessity requirement.

  I should note that the stipulation of "cosmic accident" might be problematic—it's hard to imagine what that means in a world, as regularities are just patterns. If "accident" implies it could have been otherwise, that might relate to modal strength, but her views don't explicitly mention modality. Overall, I think the exercise is meaningful, not merely verbal, as it probes the boundary between regularity and something more.

  Finally, I'll structure the response with prediction, reasons, confidence level, underdetermination points, and a new test case.
answer: |-
  Based on your description of your friend's prior verdicts, I predict she **would classify the "all swans are white" generalisation as a law** in this stipulated world, despite it being a "cosmic accident". My reasoning, confidence, and alternative interpretations are as follows:

  ### Prediction and Reasoning
  - **Predicted Verdict**: Yes, it is a law.
  - **Core Rule Inference**: Your friend seems to endorse a **systematisation-based view** of laws, closely aligned with a "Best System Account" (BSA) à la David Lewis. On this view, laws are the axioms or theorems of the *best* deductive systematisation of the world's history. "Best" balances **simplicity**, **strength** (informative power), and **fit** (accuracy to the facts), using a *natural vocabulary*. Crucially, this account does *not* require any further "metaphysical glue" like necessity, causal powers, or hidden connections.
    
  - **Why This Fits Her Prior Verdicts**:
    1. **Rejection of local regularities**: The BSA requires laws to be universal (high strength/fit across the *whole* world). A corner-specific regularity wouldn't feature in the *best* system for the entire world.
    2. **Rejection of gerrymandered predicates**: The BSA demands a "natural vocabulary" (e.g., "green" not "grue"). "Grue" is disqualified because it complicates the system by introducing arbitrary, time-dependent predicates.
    3. **Acceptance of fundamental laws**: Newton's charge law is simple, strong, and likely fundamental (non-derived) in its world. It organises vast data neatly.
    4. **Acceptance of simple F-G generalisations**: Her explicit endorsement of a non-derived, simple, strong regularity in a basic world is the *strongest evidence* for a systematisation view. She states this holds even if "nothing further lies behind it" – directly ruling out a requirement for "extra connections".

  - **Application to the Swan Case**:
    - The generalisation is **universal** (covers all swans across space/time), **simple** (e.g., "all swans are white" is concise), and **strong** (it captures a significant pattern). It would be included in the "best systematisation" of this world.
    - The stipulation that it's a "cosmic accident" (no deeper connection) is *irrelevant* on the BSA. The BSA cares only about the *structural role* the generalisation plays in organising the world's history, not whether there's an underlying "reason". Her F-G case precedent confirms this.

  ### Confidence and Underdetermination
  - **Confidence**: **70%**. Her F-G verdict is a robust indicator, but the "cosmic accident" phrasing might nudge her toward hesitation if she implicitly associates laws with *counterfactual robustness* (e.g., "swans *must* be white"). However, her prior statements suggest she rejects this:
    - She accepts the F-G law even if "nothing further lies behind it", which implies accident-like scenarios are permissible.
    - She hasn't mentioned counterfactuals, necessity, or causal powers in her criteria. Introducing them now would contradict her F-G verdict.
    
  - **Where Prediction is Underdetermined**: 
    - **Natural Kinds**: Does she require properties (like "swan") to be *natural kinds*? The electron case suggests she favours scientific kinds, but the F-G case uses schematic terms ("F", "G"), implying any simple predicate pair suffices. If "swan" is deemed "unnatural" (e.g., biologically disjunctive), she *might* reject it – but you present "swan" as unproblematic.
    - **Strength Threshold**: How much work must a law do? If your world has *only swans* and no other patterns, "all swans are white" might seem too trivial. But her F-G case doesn't specify complexity, so I assume it passes.

  ### Alternative Rules and Their Predictions
  1. **Best System Account (BSA) - Predicted: LAW**  
     - Rule: Law iff part of the simplest, strongest deductive system using natural predicates.  
     - Fits all verdicts: Excludes local/gerrymandered cases; includes electrons and F-G.  
     - Swan prediction: Law (as above).

  2. **BSA + Natural Kinds - Predicted: NOT LAW?**  
     - Rule: As BSA, but properties must be natural kinds (e.g., "electron" yes, "grue" no).  
     - Fits most verdicts: Explains rejecting "grue". Electron charge involves natural kinds; F-G is ambiguous.  
     - Swan prediction: *Not* a law if "swan" is seen as non-fundamental (e.g., a biological category reducible to genetics).  
     - Why less likely? Her F-G case doesn't specify natural kinds, implying simplicity alone suffices.

  3. **Necessitarian View - Predicted: NOT LAW**  
     - Rule: Law iff regularity *plus* a necessary connection (e.g., causal or metaphysical) between properties.  
     - Fits some verdicts: Explains rejecting accidents and accepting electrons (where charge is "essential").  
     - Swan prediction: *Not* a law (due to "cosmic accident" stipulation).  
     - Why less likely? Contradicts her F-G verdict, which explicitly allows laws with "nothing further behind them".

  4. **Universals-Realism View - Predicted: NOT LAW**  
     - Rule: Law iff regularity reflects a relation between universals (e.g., "N(F,G)" meaning "F-ness necessitates G-ness").  
     - Fits some verdicts: Explains rejecting accidents; accepts electrons (charge as intrinsic).  
     - Swan prediction: *Not* a law (no "N(swan,white)").  
     - Why less likely? Directly conflicts with her F-G case, which lacks any appeal to universals.

  ### Key Test Case to Distinguish Rules
  To resolve ambiguity, propose this world:  
  - **Description**: A world with *only two fundamental properties*: F and G. The entire history is a vast, uniform regularity: all Fs are Gs. It is simple, strong, and non-derived. *But* there is no causal link; it’s a "brute fact".  
  - **Question for your friend**: Is "All Fs are Gs" a law?  
  - **What This Tests**:  
    - If **YES** (as I predict), she strongly favours pure BSA (simplicity/strength suffices).  
    - If **NO**, she likely requires extra elements (e.g., natural kinds, necessity), undermining her earlier F-G verdict.

  ### Is the Exercise Badly Posed?
  Not fatally. The "cosmic accident" stipulation *does* work: it tests whether lawhood requires more than regularity. However, two caveats:  
  1. **Epistemic Access**: In a real scenario, we couldn’t *know* if a regularity is "accidental". But your thought experiment legitimately fixes this metaphysically.  
  2. **Modal Force**: Some philosophers (e.g., Armstrong) argue laws entail counterfactuals (e.g., "If a swan existed, it *would* be white"). If she secretly endorses this, she *might* reject the swan law. But her F-G case suggests she doesn’t, as a brute regularity wouldn’t support counterfactuals.  

  In British English, her view seems "Humean" – laws supervene on patterns in events, with no "hidden machinery". I’d wager a pint she’d call your swan regularity a law. But the test case above will settle it.
