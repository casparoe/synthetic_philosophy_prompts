prompt: |-
  I'm taking a philosophy of medicine course this semester, and after a lecture on the concept of disease, two classmates got into an argument that I've been turning over ever since. I'm hoping you can help me work through who's right about what.

  The lecture covered the debate between naturalism and normativism about disease. The naturalist view, roughly, is that health and disease are objective, value-free concepts: a disease is a deviation from species-typical biological functioning, and calling something a disease is a factual claim about how the organism is working. The normativist view is that the concept of disease is irreducibly value-laden: to call something a disease is to judge that it's a bad state to be in, one that warrants medical attention. The professor gave examples on both sides, and then the discussion broke out after class. Here's what I remember of the exchange:

  (1) David started by saying he found naturalism obviously correct. He said: "Take a bacterial infection. The bacteria are disrupting normal tissue function. That's just a biological fact about the body. Whether we *like* it or not is a separate question. The concept of disease has to be grounded in biology, otherwise we're just calling things diseases because we don't like them."

  (2) Amara pushed back: "But what about infertility? It's a deviation from species-typical reproductive function, so on the naturalist account it's a disease. Yet whether someone actually *has* a disease seems to depend on whether they want children. A postmenopausal woman isn't considered diseased, and neither is someone who's had a voluntary sterilization. The biological fact alone doesn't settle it."

  (3) David replied: "Those are cases where the dysfunction has a known, non-pathological cause — aging or a surgical procedure. The naturalist can say that the concept of disease only applies to *pathological* deviations from typical function, not all deviations. Infertility from blocked fallopian tubes is a disease; infertility from a tubal ligation is not. The underlying biology is different."

  (4) Amara said: "But now you're smuggling in the very value judgments you said you were avoiding. You're distinguishing 'pathological' from 'non-pathological' deviations, but what counts as a normal process is partly a social judgment. Aging is normal, yet we still call osteoporosis a disease. A surgeon cutting into someone is normally a harm, but when it's consensual surgery we call it therapeutic. So you're already making evaluative distinctions just to draw the boundary you're relying on."

  (5) David came back: "I think you're conflating the *concept* of disease with the *application* of the concept. We can agree that there are borderline cases where our values affect how we draw the line, but that doesn't mean the concept itself is fundamentally evaluative. The paradigm cases — infections, cancer, genetic disorders — are clearly biological dysfunctions. The borderline cases don't change what the concept is about."

  (6) Amara answered: "But the history of medicine is full of cases where the 'paradigm' shifted because of changing values, not changing biology. Homosexuality was classified as a disease and then declassified — not because the biology changed, but because our values did. If the concept were truly value-free, that shouldn't be possible. The fact that we can debate whether something like ADHD or obesity is a disease shows that values are doing work right at the core of the concept, not just at the margins."

  At that point we had to go to our next class, so the argument ended there. I've been trying to figure out who has the better of it. Can you adjudicate move by move? Rate each of the six moves on a scale from clearly mistaken to clearly right, and briefly justify each rating. Then say who you think is more right overall, and whether there's anything important that both of them missed.
reasoning: |-
  Okay, let me work through this philosophy of medicine debate step by step. The student wants me to evaluate each exchange between David (naturalist) and Amara (normativist) about disease concepts, then determine who's more convincing overall.

  First, I need to recall the core positions: Naturalism says disease is objective biological dysfunction, while normativism says it's inherently value-laden. David opens strong with bacterial infection as a clear biological fact. That makes sense - pathogens disrupting function seems value-neutral. I'd rate his first move as correct since he establishes a solid paradigm case.

  Amara counters with infertility examples. This is clever because it exposes how the "biological fact" alone doesn't determine disease status - a postmenopausal woman isn't diseased despite dysfunctional reproduction. David's response about "pathological vs non-pathological causes" seems reasonable at first glance, but Amara immediately spots the problem: calling aging "normal" already smuggles in values. Osteoporosis shows how we medicalize some age-related changes but not others. 

  Ah, this is where it gets interesting. David tries to save naturalism by distinguishing core concept from borderline applications. But Amara's historical examples are devastating - homosexuality's declassification proves values fundamentally reshape what counts as disease, not just at the edges. ADHD debates today show values are central, not peripheral.

  Overall Amara lands stronger blows. David's naturalism works well for textbook diseases but crumbles when faced with cases where "normal function" requires value judgments. Both miss how hybrid theories might bridge the gap - like Wakefield's "harmful dysfunction" combining biological and evaluative elements. The social context of medicine matters too; calling something a disease isn't just describing biology but triggering institutional responses.
answer: |-
  Here's a move-by-move analysis of the argument, ratings, and overall assessment:

  **Move-by-Move Adjudication:**

  1.  **David (Naturalism - Bacterial Infection):**
      *   **Rating:** **Clearly Right** (for paradigm cases)
      *   **Justification:** David effectively highlights the core strength of naturalism for clear-cut biological dysfunctions. Infections *are* objectively harmful to typical biological functioning (tissue destruction, immune response disruption) regardless of societal values. This demonstrates that biological facts are central to the concept in many instances.

  2.  **Amara (Counter - Infertility):**
      *   **Rating:** **Clearly Right**
      *   **Justification:** Amara lands a powerful blow against a simplistic naturalism. She exposes that "deviation from species-typical function" alone is insufficient. Whether infertility is considered a "disease" *does* depend on the individual's goals (desiring children) and the context (aging, voluntary choice). This shows values are necessary to determine if a biological state *counts as* a disease state in practice.

  3.  **David (Pathological vs. Non-Pathological Causes):**
      *   **Rating:** **Partially Right but Problematic**
      *   **Justification:** David attempts a common naturalist refinement. Distinguishing pathological deviations (disease) from non-pathological ones (aging, surgery) based on etiology *seems* biological. **However,** Amara's next point reveals the flaw. This move *assumes* a definition of "pathological" and "normal process" that isn't purely biological. Why is aging "non-pathological"? Isn't it a deviation from peak function? Why is surgery "non-pathological" when it causes identical biological dysfunction to a disease? This distinction subtly relies on value judgments about what constitutes a "normal" cause of dysfunction.

  4.  **Amara (Smuggling in Values - Aging/Osteoporosis, Surgery):**
      *   **Rating:** **Clearly Right**
      *   **Justification:** Amara brilliantly exposes the weakness in David's refinement. Calling aging "normal" and surgery "therapeutic" (even when causing dysfunction) isn't a value-free biological fact; it's a value-laden judgment about what states or processes are acceptable or expected. Osteoporosis is deemed a "disease" of aging because we *value* skeletal integrity and *disvalue* fractures and pain, not solely because it deviates statistically. Surgery highlights that identical biological outcomes (e.g., sterility) are classified differently based on intent and consent – fundamentally evaluative criteria. David *is* smuggling values in to define "pathological."

  5.  **David (Concept vs. Application / Borderline Cases):**
      *   **Rating:** **Partially Right but Ultimately Weak**
      *   **Justification:** David makes a standard philosophical move: protect the core concept by relegating problems to application or borderline cases. It's true that infections/cancer feel like core, objective diseases. **However, Amara's next move shows this defense fails.** Many "borderline" cases (like homosexuality historically) were once considered *paradigm* diseases. Furthermore, Amara's infertility example isn't truly "borderline"; it strikes at the heart of how "function" and "dysfunction" are defined relative to human goals and values, which are central, not peripheral.

  6.  **Amara (History & Core Values - Homosexuality, ADHD, Obesity):**
      *   **Rating:** **Clearly Right**
      *   **Justification:** Amara delivers the strongest argument. The history of homosexuality in the DSM is a decisive counter-example to naturalism. The biology didn't change; societal values about sexuality did, leading to its declassification. This demonstrates that the concept of disease itself is malleable based on norms, not just the discovery of new biological facts. Debates about ADHD (is it neurodiversity or dysfunction?) and obesity (medical condition vs. lifestyle issue?) aren't just about fuzzy edges; they involve fundamental disagreements about what constitutes harmful dysfunction, proving that values are constitutive of the disease concept, not merely applied to it.

  **Overall Assessment:**

  *   **Who is more right?** **Amara (Normativism) has the stronger position overall.** She successfully demonstrated that:
      1.  Biological deviation alone is insufficient (Infertility).
      2.  Naturalist refinements rely on hidden value judgments (Pathological/Normal).
      3.  Historical and contemporary controversies show values fundamentally shape the concept's core application and even its paradigms (Homosexuality, ADHD).
  *   While David effectively articulated the intuitive appeal of naturalism for clear biological harms (infections), his attempts to defend it against Amara's challenges were unsuccessful. He couldn't purge values from the *definition* of "dysfunction," "normal function," or "pathological cause."

  **What Both Missed:**

  1.  **Hybrid Theories:** Neither directly addressed the most plausible contemporary position: **Hybrid Theories** (e.g., Jerome Wakefield's "Harmful Dysfunction"). This view argues that disease requires *both* an objective biological dysfunction *and* a value judgment that this dysfunction is harmful. This acknowledges the biological facts David emphasizes while incorporating the essential value component Amara highlights. The argument remained stuck in the binary.
  2.  **The Social Dimension of "Function":** While Amara touched on it, neither fully explored how "species-typical function" is often defined relative to social contexts and expectations. What counts as "normal" function for vision, hearing, attention, or even reproduction is influenced by societal demands and technological possibilities.
  3.  **Power & Institutions:** The argument focused on individual values/biology. They didn't delve into how disease definitions are shaped by institutional power (medical profession, insurance companies, pharmaceutical industry) and social control (pathologizing dissent or difference). Declaring something a disease has significant social consequences beyond individual harm.
  4.  **The Goal of Medicine:** Implicitly, the debate hinges on what medicine *should* treat. Is its goal solely to fix biological malfunctions (Naturalism), or to alleviate suffering and improve well-being as defined by patients/society (Normativism)? This broader question underpins the conceptual debate.

  In conclusion, Amara successfully exposed the fundamental reliance of the disease concept on value judgments, demonstrating the limitations of a purely naturalist account. David's defense highlighted the importance of biology but couldn't sustain a value-free definition. The most compelling view likely lies in a hybrid theory acknowledging both elements.
