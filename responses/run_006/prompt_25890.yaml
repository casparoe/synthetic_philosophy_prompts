answer: |-
  ### Epistemology of Disagreement: Diagnostic Decision Tree  
  *For advanced undergraduates & beginning graduate students*  

  This decision tree helps map your intuitive responses to peer disagreement scenarios onto major positions in the literature. Answer the questions based on concrete cases, **not** prior knowledge of theories. The tree has 5 branch points and 7 leaves (5 named positions + 2 unoccupied regions).  

  ---

  #### **Question 1: The Core Conciliation Test**  
  *Scenario*: You and a colleague—both experts in logic with identical training—work independently on a complex proof. You conclude P with high confidence. Your colleague concludes not-P with equal confidence.  
  **Question**: Must you reduce your confidence in P *solely because* of their dissent?  
  - **Yes** → Proceed to Question 2.  
  - **No** → Proceed to Question 5.  

  ---

  #### **Question 2 (If "Yes" to Q1): Higher-Order Evidence Vulnerability**  
  *Scenario*: After learning of the disagreement, you vividly recall your meticulous reasoning. You detect no errors.  
  **Question**: Can the perceived strength of your first-order reasoning *defeat* the evidence that you might be mistaken (provided by the disagreement)?  
  - **Yes** → **Position: Higher-Order Defeat View**  
    - *Core*: Strong first-order evidence can override higher-order evidence from peer disagreement.  
    - *Philosopher*: Lasonen-Aarnio (2014).  
  - **No** → Proceed to Question 3.  

  ---

  #### **Question 3 (If "No" to Q2): Symmetry Requirement**  
  *Scenario*: You set aside your reasoning and treat the disagreement neutrally.  
  **Question**: Must you *always* give equal weight to both opinions (i.e., split the difference)?  
  - **Yes** → **Position: Equal Weight View**  
    - *Core*: Peer disagreement is symmetric evidence of error, requiring equal weight and significant conciliation.  
    - *Philosopher*: Feldman (2007), Christensen (2007).  
  - **No** → Proceed to Question 4.  

  ---

  #### **Question 4 (If "No" to Q3): Evidence Integration**  
  *Scenario*: You have independent reasons to doubt your peer (e.g., they were sleep-deprived; you have a better track record on similar problems).  
  **Question**: Can you rely on *your original reasoning* (not just independent factors) to justify discounting their view?  
  - **Yes** → **Position: Total Evidence View**  
    - *Core*: The rational response depends on the total evidence, including first-order reasons and disagreement.  
    - *Philosopher*: Kelly (2010).  
  - **No** → **Position: Justificationist View (Moderate Conciliationism)**  
    - *Core*: Discounting a peer requires independent reasons (e.g., track records), not disputed first-order reasoning.  
    - *Philosopher*: Lackey (2010).  

  ---

  #### **Question 5 (If "No" to Q1): Steadfastness Grounds**  
  *Scenario*: You maintain confidence in P despite the disagreement. Later, you learn your peer has a *better* track record than you on such proofs.  
  **Question**: Does this *force* you to reduce confidence?  
  - **Yes** → **Position: (Unoccupied Region 1)**  
    - *Diagnosis*: Unattractive—why grant steadfastness initially if it collapses under new evidence? (No major theorist occupies this space.)  
  - **No** → Proceed to Question 6.  

  ---

  #### **Question 6 (If "No" to Q5): Epistemic Responsibility**  
  *Scenario*: You stick to P despite the peer’s dissent and their superior reliability.  
  **Question**: Does the *rationality* of your stance depend on whether your first-order evidence *actually supports* P?  
  - **Yes** → **Position: Right Reasons View**  
    - *Core*: Rational steadfastness depends on being objectively right; disagreement itself doesn’t undermine justification.  
    - *Philosopher*: Kelly (2005), Sosa (2010).  
  - **No** → **Position: (Unoccupied Region 2)**  
    - *Diagnosis*: Incoherent—rationality can’t float free of evidence (no coherent position occupies this space).  

  ---

  ### Structural Limitations & Notes  
  1. **Peerhood as Fixed**: This tree assumes peerhood is given (e.g., "same training, same data"). It cannot distinguish views that define peerhood differently (e.g., Elga’s (2007) vs. Kelly’s (2005) criteria).  
  2. **Permissivism**: Positions allowing rational disagreement due to permissive evidence (e.g., Schoenfield 2014) are not captured here. The tree assumes uniqueness (one rational response).  
  3. **Overlaps/Collapses**:  
     - **Total Evidence vs. Justificationist**: These *converge* when independent reasons (Q4) are part of the total evidence. The tree separates them by whether first-order reasoning *itself* can discount peers (Total Evidence: yes; Justificationist: no).  
     - **Right Reasons vs. Higher-Order Defeat**: Both allow steadfastness, but for different reasons (actual evidence vs. defeasibility of higher-order evidence). The tree isolates Higher-Order Defeat under conciliationism (Q2) and Right Reasons under steadfastness (Q6).  
  4. **Unoccupied Regions**: Both arise from unstable combinations—Q5-Yes demands conciliationism *after* rejecting it; Q6-No severs rationality from evidence.  

  Use this tree to locate your intuitions, then test them against the assigned readings. **Remember**: Real positions often have finer nuances!  

