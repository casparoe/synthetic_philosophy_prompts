prompt: |-
  I direct the intake unit of a university research-integrity office. We receive about a dozen allegations of research misconduct a year — fabrication, falsification, and plagiarism — and we decide which ones warrant a formal investigation. An increasing share of the complaints come from people whose own hands are not clean: a senior scientist sanctioned for fabrication a decade ago now accusing a junior colleague of fabricating data, a department chair with a string of retractions for image manipulation accusing someone else of the same practice, a graduate student who helped carry out her supervisor's falsification and now wants to report it after a falling-out. Our current handling is ad hoc: sometimes we discount a complaint because of the complainant's record, sometimes we set the record aside entirely, and no one can say what principle distinguishes the two.

  Please turn the moral-philosophical idea of standing to blame into a reusable intake procedure my analysts can run. The idea I mean is this: a person can be correct that someone did wrong and still not be in a position to blame them — where that is a different matter from being a bad witness, from having an ulterior motive, or from merely being a hypocrite. I want a procedure that tells us when a complainant's own conduct should stop us from opening an investigation, when it should not, and why.

  The procedure should consist of questions to ask in order, with, for each question, what counts as a sufficient answer; it should say where it stops with the outcome that we decline to open an investigation on the complaint, where it stops with the outcome that we must open one despite the complainant's conduct, and where it hands the decision to a person because the remaining question is a value judgment the procedure should not make. Be explicit about which distinctions in the philosophy of blame must survive the simplification and which can be dropped, and about the cases the procedure will misfire on.

  Constraints: my analysts are not philosophers, and each complaint gets at most half a day of analysis. The stakes are high in both directions: opening an investigation is costly and can damage a career even when it clears someone, but declining one can leave real misconduct in a lab. I want a committed procedure — make the calls and defend them, rather than laying out the options for me to choose from.

  Then run the procedure on these three complaints and show the step-by-step outcome:
  1. A professor sanctioned ten years ago for fabricating data, who has since had a clean record, accuses a junior researcher in another lab of fabricating data.
  2. A department chair whose own lab is currently under investigation for image manipulation, and who has dismissed the practice as normal, accuses a colleague in another department of image manipulation in a manuscript.
  3. A graduate student who knowingly carried out the data falsification her supervisor directed now reports that falsification to our office, after a dispute over authorship.

  Make at least one of the three a case in which the procedure gives an answer we will not like, and say plainly why the procedure overrides our instinct. Finally, state what the procedure deliberately does not decide, and why that judgment cannot be eliminated.
reasoning: |-
  Okay, let me approach this systematically. The user leads a university research-integrity intake unit and needs a practical procedure to handle complaints where the complainant may lack moral standing. They want this grounded in philosophical concepts but operationalized for non-philosophers with time constraints.

  First, I need to distill the core idea of "standing to blame" from moral philosophy. The key distinction is between whether an accusation is factually correct versus whether the accuser has the moral right to make it. This differs from credibility or hypocrisy - it's about whether their own past actions disqualify them from playing the role of moral enforcer. 

  For the procedure, I consider designing a flowchart-like sequence of binary questions. Each question should have clear pass/fail criteria and immediate consequences to fit the half-day time constraint. The analysis must terminate at specific outcomes: decline investigation, proceed despite complainant's conduct, or refer for human judgment.

  Important philosophical distinctions to preserve:
  - The difference between having committed similar misconduct vs ongoing/unrepented misconduct (latter more damaging to standing)
  - Willing participation vs coercion (affects complicity)
  - Temporal proximity and pattern of behavior

  Distinctions we can safely drop:
  - Deep metaphysical debates about blame's nature
  - Perfect symmetry between wrongs (procedural fairness suffices)

  The procedure will misfire in borderline cases like reformed offenders making good-faith accusations, but we accept this trade-off for clarity. 

  For the three test cases:
  1. Professor with past sanction (clean decade) - passes standing test but credibility needs separate check
  2. Department chair currently under investigation - fails standing due to unrepented similar conduct
  3. Grad student coerced into falsification - passes standing as victim-participant

  Case 2 is intentionally unsatisfying - the chair's accusation might be valid, but the procedure blocks it on standing grounds to avoid normalizing hypocrisy. The key judgment we leave to humans is whether the complainant's past actions are sufficiently similar and severe to disqualify them.

  Now structuring the actual procedure with unambiguous thresholds (e.g., "similar misconduct within 5 years" rather than "recent"). Each step must have operational definitions: what constitutes "similar" misconduct, "recent" timeframes, "participation" versus "victimhood". 

  For analysts, we'll provide concrete examples and decision trees. The goal is to make the philosophical concept actionable without requiring ethical deliberation at each case.
answer: |-
  Here is a reusable intake procedure based on the philosophy of "standing to blame," operationalized for non-philosophers under time constraints. The core principle: **We decline investigations only when the complainant's past misconduct *undermines their moral authority to initiate institutional condemnation*, not merely because they are hypocritical or lack credibility.** Standing is forfeited when the complainant is *currently engaged in* or *unrepentantly benefited from* materially similar wrongdoing.

  ---

  ### **Procedure: Standing Assessment for Misconduct Complaints**  
  *(Complete in sequence; stop at first definitive outcome)*

  1. **QUESTION 1: Is the complainant *currently under sanction*, *under investigation*, or *publicly unrepentant* for research misconduct materially similar to the alleged offense?**  
     - *Sufficient "Yes"*: Active sanction/investigation for similar misconduct (e.g., falsification complaint while sanctioned for falsification) OR public dismissal of similar misconduct as "normal."  
     - *Sufficient "No"*: No similar misconduct history OR past resolved sanction with rehabilitation (e.g., completed sanctions, retractions, no repeat offenses).  
     - **OUTCOME IF YES → DECLINE TO INVESTIGATE.** *Reason: Lacks standing. Initiating institutional condemnation while engaged in/unrepentant about identical wrongdoing exploits the system’s moral authority.*  
     - **IF NO → Proceed to Question 2.**

  2. **QUESTION 2: Was the complainant an *active, voluntary participant* in the *specific misconduct* they now report?**  
     - *Sufficient "Yes"*: Direct, willful involvement in the acts (e.g., falsifying data themselves as part of the scheme).  
     - *Sufficient "No"*: Coerced participation (e.g., threatened into compliance), peripheral role without understanding, or reporting *different* misconduct.  
     - **OUTCOME IF YES → DECLINE TO INVESTIGATE.** *Reason: Lacks standing. Voluntarily engaging in the wrongdoing forfeits the right to demand institutional judgment.*  
     - **IF NO → Proceed to Question 3.**

  3. **QUESTION 3: Did the complainant *personally benefit* from the alleged misconduct in a *material, ongoing* way?**  
     - *Sufficient "Yes"*: Gained authorship, funding, promotion, or reputation from the misconduct *and retains those benefits*.  
     - *Sufficient "No"*: Benefits were negligible, incidental, or fully relinquished (e.g., retracted papers, returned grants).  
     - **OUTCOME IF YES → REFER TO DIRECTOR.** *Reason: Standing is ambiguous. Retained benefits create moral conflict, but not automatic disqualification. Human judgment needed.*  
     - **IF NO → OPEN INVESTIGATION.** *Reason: Standing intact. Complainant’s history may affect credibility but does not bar institutional action.*

  ---

  ### **Key Philosophical Simplifications**  
  - **RETAINED:** The distinction between *blameworthiness* (factual guilt) and *standing* (moral authority to accuse). Hypocrisy alone ≠ lost standing.  
  - **RETAINED:** "Similar misconduct" must be materially analogous (e.g., falsification ≠ plagiarism).  
  - **DROPPED:** Nuances of repentance (replaced by objective "active sanction/unrepentant" test).  
  - **DROPPED:** Debates about moral luck; focuses on actions and outcomes, not intent.  

  ### **Known Limitations**  
  - **Misfires** on reformed offenders with genuine concerns (blocked by Question 1) or coerced participants who later benefited (Question 3 ambiguity).  
  - **Deliberately avoids** judging whether the complainant "deserves" redemption. Uses institutional status (sanction/investigation) as a proxy.

  ---

  ### **Application to Cases**  
  **Case 1: Professor sanctioned 10 years ago (clean record) accuses junior researcher of fabrication.**  
  - Q1: No (resolved sanction; no recurrence → clean record = rehabilitation).  
  - Q2: No (not involved in junior researcher’s work).  
  - Q3: No (benefits from past fabrication likely relinquished via sanction).  
  - **OUTCOME: OPEN INVESTIGATION.** *Analysts note past sanction for credibility assessment, but standing intact.*  

  **Case 2: Department chair under investigation for image manipulation (calls it "normal") accuses colleague of same.**  
  - Q1: Yes (currently under investigation for *identical* misconduct + unrepentant).  
  - **OUTCOME: DECLINE TO INVESTIGATE.**  
  - **Why it overrides instinct:** Even if the accusation is valid, the chair seeks to weaponize the system while normalizing the same behavior in their lab. Granting standing would endorse hypocrisy and undermine institutional integrity.  

  **Case 3: Grad student who falsified data under orders reports supervisor after authorship dispute.**  
  - Q1: No (no prior misconduct record).  
  - Q2: Yes (voluntarily falsified data; "following orders" is insufficient coercion).  
  - **OUTCOME: DECLINE TO INVESTIGATE.**  
  - **Note:** This feels unjust (supervisor escapes scrutiny), but the student’s *willing participation* forfeits standing. Mitigation: Counsel the student to report to an uninvolved party (e.g., funder) who *has* standing.  

  ---

  ### **What the Procedure Does Not Decide**  
  **"Is this complaint true?"**  
  Standing is separate from credibility or evidence. A complainant without standing may still be correct. Analysts *must* log all complaints for pattern tracking (e.g., multiple standing-less accusations against one lab trigger review).  

  **Why it can’t be eliminated:** Standing filters *who may activate formal condemnation*, not whether misconduct occurred. Evidence assessment happens post-standing check if an investigation proceeds.  

  ---  
  This procedure prioritizes the system’s moral coherence over individual complaint merit in edge cases, reducing reputational risk from weaponized accusations while isolating value judgments to one referral step. Analysts can execute it in <4 hours using institutional records and complaint affidavits.
