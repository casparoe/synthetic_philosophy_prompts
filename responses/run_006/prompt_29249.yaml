  First, I need to understand the core conflict. The abolition bloc argues the rule creates fake collaborations and wastes time, while the user worries about losing unseen benefits like shaping applicant pools or institutional reputation. The memo must address the epistemic problem: how to decide when the original reasons are lost. 

