prompt: |-
  I spent my career as an organic chemist and only started reading philosophy seriously after I retired, so forgive me if I'm using some of this terminology sloppily. Lately I've gotten interested in the idea that you can train two AI systems to debate each other in front of a human judge, and that the judge will end up with the truth even when she couldn't have checked the answer directly. The worry that keeps nagging at me is obfuscated arguments: what if a false answer can be defended with an argument that's just a bit to long or too subtle for the judge to follow? Then the whole scheme seems to leak. But I'm not sure whether that's a minor edge case, a fundamental limit, or something in between.

  I've been asked to help a small foundation think about where to put maybe eight researchers for three years, doing conceptual and theoretical work on debate and its limits — philosophers, mathematicians, and theorists, not people who need a compute budget. So here's my question. If you were advising them, which open questions in this area should they prioritize, and in what order? I want the reasoning more than the list: for each question, why is it upstream of other work, how tractable is it for someone without access to large ML experiments, and what evidence over the next couple years would move it up or down the ranking? Also say which questions you'd deprioritize even though they sound important, and why. I'm after a defended agenda, not a survey.
