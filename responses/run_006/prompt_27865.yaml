answer: |-
  ### Joint Statement: Adversarial Collaboration on the Born Rule in Many-Worlds Interpretation

  **Parties:**  
  - **Derivationist (D):** Holds that Born rule weights (squared amplitudes) can be derived from unitary dynamics plus rational constraints on agent credences/betting.  
  - **Skeptic (S):** Holds that Born rule derivations are circular; weights must be added as a postulate, leaving MWI with an unresolved probability problem.  

  **1. Agreed Claims**  
  Both parties endorse the following:  
  1. **Unitary Dynamics:** Closed quantum systems evolve unitarily per the Schrödinger equation; no collapse occurs.  
  2. **Decoherence & Branching:** Environmental decoherence yields dynamically independent branches with quasi-classical histories, defined via preferred bases (e.g., pointer states). Branching is emergent, approximate, and relative.  
  3. **Branch Weight Properties:** Branch weights (squared amplitudes) are invariant under unitary evolution and basis changes tied to decoherence. They are objective, non-dynamical features of the wave function.  
  4. **Probability Task:** Any account of "probability" in MWI must explain why rational agents should assign credences (subjective degrees of belief) proportional to branch weights in pre-measurement scenarios. It must also recover the empirical success of quantum statistics.  
  5. **Minimal Derivation Achievements:** Existing derivations (e.g., Deutsch-Wallace, Zurek) demonstrate that *if* an agent’s credences satisfy specific consistency constraints (e.g., additivity, branching indifference), then Born rule weights uniquely satisfy these constraints. No derivation avoids normative axioms of rationality.  

  **2. Disagreements Table**  
  | **Neutral Framing** | **Derivationist’s Preferred Wording** | **Skeptic’s Preferred Wording** |
  |---------------------|---------------------------------------|--------------------------------|
  | **D1: Scope of Rationality Constraints:** Does rationality alone suffice to derive Born rule weights without probabilistic assumptions? | Rationality axioms (e.g., consistency across branches) imply the Born rule; no probabilistic postulate is needed. | Rationality constraints tacitly assume Born weights (e.g., in symmetry arguments), making derivations circular. |
  | **D2: Status of Branch Weights:** Do branch weights function as decision-theoretic probabilities? | Branch weights are not "chances" but objectively constrain rational agents' credences and bets via decision theory. | Branch weights lack intrinsic probabilistic force; they are inert mathematical features until supplemented by a probability postulate. |
  | **D3: Probability Problem:** Does MWI have an unresolved problem with probability? | MWI has no probability problem; the Born rule is derived from unitary dynamics plus rationality. | MWI has a probability problem: weights cannot be made "probabilistic" without adding the Born rule as a primitive. |
  | **D4: Meaning of "Probability":** Is the verbal dispute terminable? | "Probability" in MWI means *rational credence weight* for agents facing branching; objective chance is unnecessary. | "Probability" requires *objective chance* (indeterministic "may" vs. "will"), which MWI cannot supply; credences are unmotivated without it.  

  **Verbal/Substantive Boundary:**  
  - **Verbal:** "Probability" is polysemous. D uses it for *prescriptive decision-theoretic weight* (what agents *should* bet). S uses it for *descriptive objective chance* (stochastic dynamics).  
  - **Substantive:** Both agree "probability" must guide agent behavior. The dispute begins at whether branch weights + rationality suffice to *oblige* agents to use Born weights (D: yes, S: no). S demands weights play chance-like roles (e.g., explaining long-run frequencies); D says rationality bridges this.  

  **3. Cruxes**  
  | **Crux** | **Case/Argument** | **Derivationist’s Prediction** | **Skeptic’s Prediction** |
  |----------|----------------------------|--------------------------------|--------------------------|
  | **C1: Symmetry Principle Validity:** Does rationality require equal credence in symmetrically weighted branches? | **Case:** A spin-1/2 measurement: \(|\psi\rangle = \frac{|{\uparrow}\rangle + |{\downarrow}\rangle}{\sqrt{2}}\). Branches have equal weight and identical local descriptions. Must a rational agent assign 50% credence to each? | **D:** Yes—rationality demands symmetry indifference; this axiom is weight-agnostic and yields Born rule via scaling. | **S:** No—symmetry justifies equal credence only *if* weights are probabilistic primitives; else, it begs the question. |
  | **C2: Additivity of Credence:** Must credences sum over coarse-grained branches? | **Case:** A measurement yields three branches: A (weight 1/2), B (weight 1/3), C (weight 1/6). If an agent assigns credence to "A or B," must it equal credence(A) + credence(B)? | **D:** Yes—additivity is a core rationality constraint; it forces credences to be proportional to weights. | **S:** No—additivity presupposes weights are probabilities; without this, branch count or other factors could dominate. |
  | **C3: Invariance Under Branch Relabeling:** Should credences depend only on weights, not branch identity? | **Case:** A quantum game splits $1,000 based on a weight-1/3 outcome. Branches are relabeled (weights unchanged). Must the agent’s betting odds remain invariant? | **D:** Yes—rationality requires indifference to branch labels; credences are weight-driven. | **S:** No—invariance assumes weights are credence-relevant; this is circular without Born rule antecedents. |
  | **C4: Decision-Theoretic Axioms:** Do rationality axioms implicitly embed Born weights? | **Case:** In Wallace’s decision theory, agents use "branching indifference" (no preference for branching events without payoff changes). Does this axiom smuggle in Born weights? | **D:** No—branching indifference is weight-neutral; it reflects pure rationality and leads to Born rule. | **S:** Yes—branching indifference only makes sense if weights are already probabilistic; otherwise, it’s arbitrary. |

  ---

  **Word count:** 1,090.  
  **Format note:** This statement focuses on precise, testable disagreements. Both parties contributed equally to framing, with neutral language for shared claims and cruxes. Predictions are falsifiable markers for progress.
