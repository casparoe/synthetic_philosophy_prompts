prompt: |-
  You're a philosopher of physics who works on the foundations of quantum mechanics, especially many-worlds and the measurement problem. Take your time and brainstorm a bit before you write.

  Draft the joint statement of an adversarial collaboration between two people who've been arguing for years about the Born rule in many-worlds. On one side: an Everettian who thinks the Born weights can be derived from rational constraints on how an agent should bet or assign credences in a branching universe (call them the derivationist). On the other: someone who thinks those derivations are circular or question-begging, and that many-worlds has a genuine unsolved probability problem — the weights have to be put in by hand, they can't be recovered from unitary dynamics plus rationality (call them the skeptic).

  The deliverable is the document the collaboration would actually produce, not a survey and not a verdict. Structure it like this:

  1. A numbered list of claims both sides can sign. Cover the formalism they share (unitary evolution, decoherence, branching structure), what any account of probability in many-worlds has to do, and the minimal things the existing derivation attempts establish — phrased so neither side winces.
  2. A disagreements table. For each real disagreement, give the exact statement of it in neutral framing, plus each side's own preferred wording of its position. No strawmen.
  3. The cruxes: the sub-questions such that settling one would move at least one side. For each crux, give a concrete argument, case, or thought experiment that both sides agree bears on it, and record in advance what each side predicts it will show.

  I especially want you to seperate genuine disagreements from verbal ones. I suspect part of their fight is over the word "probability" — one means decision-theoretic weight, the other means objective chance — and if that's right, say exactly where the verbal part stops and the substantive part starts. (I also suspect one crux is whether the branch weights get baked into the decision-theoretic axioms themselves, but don't take my word for it.)

  Keep the whole thing under 1,100 words. It can be a little rough; I care more about the formulations being fair and precise than about polish.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration on the Born rule in the many-worlds interpretation (MWI) of quantum mechanics. The two parties are:

  - **Derivationist**: Believes that the Born rule probabilities (branch weights) can be derived from rational constraints on decision-making or credence assignment in a branching universe, without adding them as a new postulate.
  - **Skeptic**: Believes that existing derivations are circular or question-begging and that the Born rule must be added as a separate postulate; hence, MWI has an unsolved probability problem.

  We structure the document as per the instructions: (1) a list of agreed claims, (2) a disagreements table, and (3) a list of cruxes with predictions.

  **1. Agreed Claims**

  Both parties agree on the following:

  1. **Unitary Quantum Mechanics**: The dynamics of closed quantum systems are governed by unitary evolution via the Schrödinger equation.
  2. **Decoherence**: When a system interacts with an environment, unitary evolution leads to a decomposition of the universal wave function into branches that are approximately dynamically independent and classically describable (via decoherence). This branching structure is emergent and approximate, depending on the choice of decoherence basis and the system-environment split.
  3. **Branching Structure**: In MWI, following decoherence, the universal wave function at any time can be expressed as a superposition of multiple branches, each corresponding to a distinct quasi-classical world. The branching is continuous and relative to the chosen decomposition.
  4. **The Role of Branch Weights**: Each branch is associated with a weight (squared amplitude) that is invariant under unitary evolution and basis changes (when properly defined via the decoherence basis). These weights are part of the mathematical description of the quantum state.
  5. **The Challenge for Probability**: In a deterministic theory that includes all branches as equally real, there is no unique, standard notion of probability as objective chance (as in stochastic theories). Therefore, an account is needed to explain why agents should assign probabilities (in the sense of credences or decision-theoretic weights) to outcomes in proportion to the Born rule weights, especially in pre-measurement scenarios.
  6. **Minimal Achievements of Derivation Attempts**: Existing attempts to derive the Born rule within MWI (e.g., Deutsch-Wallace, Zurek, Carroll-Sebens, Vaidman) establish that if an agent is to assign credences to outcomes in a branching universe, then any set of credences that satisfies certain intuitive constraints (such as consistency over time, additivity, or invariance under certain transformations) must be proportional to the Born rule weights. These constraints are argued to be requirements of rationality. However, it is agreed that these derivations do not establish the Born rule from unitary dynamics alone without any normative assumptions about rationality or decision theory.

  **2. Disagreements Table**

  We present the core disagreements in neutral framing, followed by each side's preferred wording.

  | **Neutral Framing** | **Derivationist's Preferred Wording** | **Skeptic's Preferred Wording** |
  |---------------------|---------------------------------------|--------------------------------|
  | **D1: Derivation from Rationality**: Can the Born rule be derived as a constraint of rationality for agents in a branching universe, without introducing any element of objective chance? | The Born rule can be derived solely from the unitary quantum dynamics (which includes branch weights) plus universally accepted principles of rational decision-making (e.g., consistency over time, additivity, and indifference in symmetric cases). | Existing derivations of the Born rule implicitly assume the Born rule in their axioms (e.g., by assigning equal credence to branches in symmetric cases only when the weights are equal) and thus are circular. The branch weights do not arise from rationality alone. |
  | **D2: Status of Branch Weights**: What is the status of the branch weights in the theory? Are they sufficient without additional probabilistic elements? | The branch weights are objective features of the quantum state that, when combined with rationality, determine how agents should act. No further element of chance is needed. | The branch weights are not probabilities. Without an additional postulate that gives these weights the status of objective chances, they cannot ground rational credences. The weights are just numbers in the wave function. |
  | **D3: The Probability Problem**: Does MWI have a probability problem? | There is no probability problem in MWI. The Born rule is a consequence of the unitary dynamics and rational decision theory. The challenge is to show this, but it has been met. | MWI has a serious probability problem: it fails to recover objective probabilities (or their rational basis) from the deterministic dynamics. The Born rule must be added as a postulate. |
  | **D4: Verbal Disagreement on "Probability"**: What does "probability" mean in the context of branching? | "Probability" in MWI refers to the rational credence an agent should assign to finding themselves on a particular branch. It is a decision-theoretic weight and does not require objective chance. | "Probability" must refer to objective chance, which is incompatible with a deterministic theory that includes all branches as real. Without objective chance, there is no non-circular account of why the Born rule should constrain credences. |

  **Note on Verbal Disagreement**: The core verbal disagreement centers on the meaning of "probability". The Derivationist uses it to mean "rational credence" (a normative, decision-theoretic notion), while the Skeptic reserves "probability" for "objective chance" (an ontic, stochastic notion). The substantive part of the disagreement starts when we ask: Can the branch weights, without being objective chances, ground rational credences? The Derivationist says yes, via their derivations; the Skeptic says no, because the derivations presuppose what they set out to prove.

  **3. Cruxes**

  For each crux, we provide a concrete argument, case, or thought experiment that both sides agree bears on it, and record each side's prediction.

  | **Crux** | **Concrete Case/Argument** | **Derivationist's Prediction** | **Skeptic's Prediction** |
  |----------|----------------------------|--------------------------------|--------------------------|
  | **C1: Symmetry and Indifference**: Does rationality require an agent to assign equal credence to branches that have equal weight in a symmetric branching scenario? | Consider a state |ψ⟩ = (|↑⟩ + |↓⟩)/√2 for a spin measurement. The branching is symmetric: two branches with equal weight. Does rationality require an agent to assign 50% credence to each outcome? | Yes. Rationality demands indifference in symmetric cases. This is a basic principle of rational decision-making that does not presuppose the Born rule. | No. Without an additional postulate, there is no reason why symmetry in the wave function should imply symmetry in credence. The Born rule must be assumed to justify this. |
  | **C2: Additivity of Credence**: Should an agent's credence in a coarse-grained outcome (comprising multiple branches) be the sum of their credences in the fine-grained branches? | Suppose a measurement has three outcomes: A (weight 1/2), B (weight 1/3), and C (weight 1/6). If we group A and B together, should the agent's credence in "A or B" be the sum of their credence in A and their credence in B? | Yes. Credences must be additive over disjoint events. This is a fundamental principle of rationality and does not presuppose the Born rule. | Additivity is only justified if we already assume that branch weights correspond to probabilities. Without that, there is no reason why credences should be additive in the branch weights. |
  | **C3: Invariance under Branch Relabeling**: If an agent is indifferent to the identity of branches (but cares only about their weights), should their credences depend solely on the weights? | Imagine a quantum state that branches into n outcomes, each with weight 1/n. If we relabel the branches (without changing the weights), should the agent's credences change? | No. Rational credences should be invariant under branch relabeling and depend only on weights. This invariance is a rationality constraint that leads to the Born rule. | Invariance under branch relabeling is only compelling if we already assume that weights are the only relevant feature. But without the Born rule, there is no reason why weights should dictate credences. The invariance principle assumes what it sets out to prove. |
  | **C4: Empirical Testability via Decision Theory**: Can the Born rule be tested in a branching scenario by the choices of rational agents? | Consider a quantum game where an agent must place bets on outcomes of quantum measurements. If the agent follows the Born rule, they maximize expected utility; if they use a different rule (e.g., equal credence for all branches regardless of weight), they do not. Does this setup provide a test of the Born rule? | Yes. Rational agents, by following the decision-theoretic axioms (without assuming the Born rule), will bet in accordance with the Born rule. Thus, the Born rule is empirically verified via rational betting behavior. | No. The decision-theoretic axioms (like additivity or invariance) are only justified if we already accept that branch weights should play the role of probabilities. Without that, there is no reason to expect rational agents to use the Born rule. The test presupposes the Born rule. |

