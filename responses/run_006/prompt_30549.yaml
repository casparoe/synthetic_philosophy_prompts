answer: |-
  You raise a fair practical concern about specifications – but engineering usability isn't the test for metaphysical truth. Your analogy conflates *knowing* the cutoff with the cutoff *existing*. "Reasonable time" in your spec *must* have an exact boundary in milliseconds to avoid contradiction, precisely *because* classical logic governs meaning. If there were no sharp cutoff, then for the sequence of response times from 1ms (clearly reasonable) to 10 years (clearly unreasonable), there would be adjacent pairs where adding one millisecond flips "reasonable" to "unreasonable" without any change – that's the absurdity of the sorites paradox! Epistemicism avoids this by positing a precise boundary grounded in the actual causal structure of the world and the way our terms latch onto it, even if our messy linguistic practices and perceptual limitations (codified by Williamson's margin-for-error principles) make *locating* that boundary impossible. The cutoff exists as the point where the underlying physical properties *just fail* to satisfy the conditions for "reasonable time," determined by the totality of usage and facts, even if no speaker can isolate it. **Summary: The sharp cutoff exists as a necessary feature of how language maps onto a precise reality, resolving the sorites paradox, even if our cognitive limitations render it unknowable.**

