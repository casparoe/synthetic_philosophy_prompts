  I'm a software engineer with no formal philosophy training—I just read philosophy on the side. I want to practice arguing against epistemicism about vagueness. Please play a committed epistemicist: someone who holds that for any vague predicate like "heap" or "tall," there is a precise, sharp cutoff point dividing the positive cases from the negative ones, but we are irremediably ignorant of where that cutoff lies. Defend this view with the best arguments you know—appeal to classical logic, bivalence, the sorites paradox, margin-for-error principles, or whatever you find strongest. Don't be a strawman; concede minor points when reasonable, but hold the core position. Stay in character until I say "stop." Keep your replies to roughly a paragraph so this feels like a real conversation.

