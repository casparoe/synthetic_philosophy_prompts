  The practice view sees promise-keeping as a rule-governed social institution where breaking a promise is like cheating in a game. The assurance view focuses on the individual act of creating expectations and reliance in another person. The user suspects there might be verbal disagreements in how terms are used and wants clarity on whether true obligation can exist without a social practice and who is wronged when promises are broken.

  I need to structure this as requested: (1) agreed claims, (2) disagreements table, (3) cruxes with test cases. For the agreed claims, both sides should agree that promises generate obligations, involve voluntary commitment, create reasonable reliance, are wrong to break without excuse, and require a social context. 

  For the disagreements table, I'll contrast the fundamental source of obligation (social practice vs individual act) and the primary wrong of breaking promises (institutional betrayal vs personal betrayal). The cruxes should test whether obligations can exist without a practice (using the island scenario) and who is wronged when breaking a promise (using the secret promise case).

  The island scenario crux involves two people with no concept of promising. The practice theorist would say no obligation arises because there's no institution, while the assurance theorist would argue obligation comes from the assurance itself. The secret promise crux uses a promise made privately without witnesses - practice theorists see this as less wrong since the practice isn't undermined, while assurance theorists see it as equally wrong because of the personal betrayal.

  I should flag that some disagreements about "obligation" might be verbal - practice theorists see it as a thick institutional concept while assurance theorists see it as interpersonal. This helps clarify where they're talking past each other. I'll keep it under 900 words by focusing on the most critical elements.
answer: |-
  ## Adversarial Collaboration: The Binding Force of Promises

  **Preface:** This document represents a good-faith effort by a Practice/Convention Theorist (PCT) and an Assurance/Expectation Theorist (AET) to clarify agreements and pinpoint core disagreements regarding promissory obligation. We agree on the phenomenology of promising but fundamentally disagree on its ontological grounding and the source of its normative force.

  ### (1) Substantive Agreements (Signed by Both)

  1.  **Promises Generate Prima Facie Obligations:** Making a promise (under normal conditions) creates a defeasible moral obligation for the promisor to perform the promised act.
  2.  **Voluntary Commitment is Necessary:** A genuine promise requires a voluntary act of commitment by the promisor. Coerced "promises" or mere predictions do not generate the same obligation.
  3.  **Reasonable Reliance is Central:** Promises typically invite and induce reasonable reliance in the promisee. This reliance is a morally significant consequence of promising.
  4.  **Wrongfulness Involves Harm/Betrayal:** Breaking a promise without valid justification typically involves a wrong done *to the promisee*, characterized by betrayal of trust and/or causing harm through frustrated reliance.
  5.  **Excuses Exist:** Obligations can be overridden by stronger moral demands (e.g., saving a life) or dissolved by the promisee's release, changed circumstances, or the promisor's incapacity.
  6.  **Social Context is Ubiquitous:** Promising, as we encounter it, almost always occurs within a broader social context where linguistic conventions and shared understandings exist.
  7.  **The Practice Exists & Has Value:** There is a recognizable social practice of promising, and the existence of this practice generally facilitates trust and mutually beneficial cooperation.

  ### (2) Precise Disagreements Table

  | Feature                     | Practice/Convention Theory (PCT) View (Acceptable to PCT)                                                                                                                                 | Assurance/Expectation Theory (AET) View (Acceptable to AET)                                                                                                                               |
  | :-------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Source of Obligation**    | The obligation to keep a promise fundamentally derives its normative force from the rules of the social institution of promising. Participation in the practice implicitly binds one to its constitutive rules. | The obligation to keep a promise fundamentally derives its normative force from the individual moral significance of voluntarily inducing reasonable reliance and expectation in another person. |
  | **Primary Wrong of Breaking** | Breaking a promise is *primarily* a wrong against the social practice itself (a form of free-riding or rule-violation that undermines a valuable institution), with harm to the promisee being a significant secondary consequence. | Breaking a promise is *primarily* a wrong against the specific promisee, stemming directly from the betrayal of the trust and reliance that the promisor voluntarily created in that individual. |
  | **Role of Practice**        | The conventional practice is the essential framework that *creates* the distinctive normative relationship and obligation of promising; it defines what counts as a promise and the force of that act. | The conventional practice is merely a common, highly efficient *vehicle* or *tool* for performing the morally significant act of giving assurance; the moral core exists independently of the practice. |

  ### (3) Cruxes

  1.  **The Isolated Dyad Crux:** Can a full promissory obligation arise *solely* from an act of assurance between two individuals who share *no* pre-existing social practice or concept of promising?
  2.  **The Secret Promise Crux:** Is breaking a promise made in absolute secrecy (with no possibility of discovery by anyone else, including the promisee reporting it) *less* morally wrong than breaking an identical public promise, specifically regarding the *source* and *nature* of the wrong?

  ### (4) Concrete Cases & Predictions

  **Crux 1: The Isolated Dyad**
  *   **Case:** Two humans, A and B, are raised in complete isolation from any society or concept of promising. They develop a rudimentary language. A, wanting B to guard her hut while she forages, says: "I commit myself to you, B, that if you guard my hut today, I *will* give you half my berries tomorrow, and I say this intending for you to rely on it." B understands and relies by guarding the hut. A then finds extra berries but refuses to share, saying she changed her mind.
  *   **PCT Prediction:** No distinct *promissory* obligation exists. While A may have acted badly (perhaps by deceiving B or causing harm through induced reliance), the specific wrong of *promise-breaking* requires the institutional context defining the normative force of that speech act. The obligation is weaker or different.
  *   **AET Prediction:** A full promissory obligation *does* exist. A's clear, voluntary act of assurance, intended to induce reliance and understood by B to do so, creates the core moral obligation to perform, independent of any social practice. Breaking it is a distinct wrong against B.

  **Crux 2: The Secret Promise**
  *   **Case:** C makes a promise to D to help them move next Saturday. Crucially, C uses a method absolutely guaranteed to ensure *no one else* can ever know the promise was made (e.g., a perfect mind-lock witnessed only by C and D, with D physically unable to reveal it). D relies. C then breaks the promise for convenience, knowing the secrecy is absolute. Compare this to C publicly promising E to help them move and similarly breaking it.
  *   **PCT Prediction:** Breaking the secret promise to D is *less* morally wrong than breaking the public promise to E. While still wrong to D (due to betrayal/harm), the *distinctive* wrong of violating the rules of the social practice – the free-riding and undermining of the institution – is absent. The primary wrong against the practice only occurs with the public promise.
  *   **AET Prediction:** Breaking the secret promise to D is *equally* as wrong as breaking the public promise to E. The core wrong is the identical betrayal of the specific promisee's trust and reliance voluntarily induced by the promisor. The publicity affects consequences (e.g., erosion of general trust) but not the fundamental wrong done *to D*.

  ### Flagged Verbal Disagreement

  *   **The Meaning of "Obligation":** Part of the disagreement stems from differing conceptions of the *kind* of obligation involved. The PCT often conceptualizes promissory obligation as a distinct, "institutional" or "practice-defined" obligation, akin to the obligation to follow the rules of chess *within* the game. The AET conceptualizes it as a fundamental interpersonal moral obligation arising directly from the act of assurance, similar to obligations not to harm or deceive. This difference in the *category* of obligation can make the disagreement seem deeper than it is regarding the *wrongness* of breaking promises in standard cases. Both agree it's wrong; they categorize the "obligation" differently.
