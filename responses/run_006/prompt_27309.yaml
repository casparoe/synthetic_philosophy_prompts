  Here's a metaphysics quiz designed to sort participants into positions on Bradley's Regress and the unity of the proposition, based on intuitive responses to concrete cases. The quiz avoids explicit terminology and focuses on scenarios to reveal underlying intuitions. It includes 8 questions with 3 options each, a scoring key, and notes on distinctions.

  ### **Quiz: What's Your Unity Intuition?**
  *Answer based on your immediate reaction—no overthinking!*

  1. **Mug on Desk**  
     When a mug rests on a desk, what makes this situation unified (rather than just "mug + desk + on-ness")?  
     A) The physical arrangement *itself* is basic—no further "glue" needed.  
     B) A "connection" (like *being on*) binds them, but then we need another connector for *that* connection.  
     C) The relation *on* is a unique "tie" that doesn’t require further binding.  

  2. **Apple's Redness**  
     How does an apple possess redness?  
     A) By instantiating the property—but "instantiation" is itself a relation needing explanation.  
     B) Properties are incomplete; the apple "fills the gap" in *redness*, making further relations unnecessary.  
     C) The apple and redness are fused into a single fact—no separate "possession" exists.  

  3. **False Unity**  
     Imagine someone falsely claims, "The cup is thinking." What unifies *this* thought?  
     A) A mental act (e.g., judging) binds cup + thinking—but what binds *that* act to them?  
     B) The thought is intrinsically unified, even if it misrepresents reality.  
     C) Predicates ("thinking") are inherently incomplete; the subject ("cup") completes them.  

  4. **Chain Reaction**  
     If a relation (R1) connects A and B, must another relation (R2) connect R1 to A/B?  
     A) Yes—this starts a problematic infinite chain.  
     B) Yes, but the chain is harmless—it doesn’t undermine reality.  
     C) No—relations don’t need "connectors"; they’re self-linking.  

  5. **World vs. Words**  
     Could propositions (e.g., "Snow is white") be unified differently from facts (snow’s whiteness)?  
     A) No—both need the *same* solution, or the theory fails.  
     B) Yes—facts are fundamental; propositions just mirror them.  
     C) Yes—propositions are the real puzzle; facts are unproblematic.  

  6. **Instantiation Status**  
     Is "instantiation" (e.g., an apple instantiating *redness*) a relation?  
     A) Yes—and it invites the same problems as other relations.  
     B) No—it’s a unique, non-relational "tie."  
     C) No—properties aren’t standalone; they’re unsaturated roles.  

  7. **Loving Partners**  
     In "Alex loves Sam," how do Alex, Sam, and *loving* combine?  
     A) All three are equal parts; a further "unifier" binds them.  
     B) *Loving* is a "slot" filled by Alex/Sam—no extra binder needed.  
     C) The relation *loving* is a fundamental "tie"—no parts to bind.  

  8. **Regress Scope**  
     Does Bradley’s regress apply to physical relations (e.g., colliding particles)?  
     A) Yes—all relations suffer the same problem.  
     B) No—it only affects abstract/complex cases (e.g., propositions).  
     C) No—it’s a pseudo-problem; relations work fine as-is.  

  ---

  ### **Scoring Key**  
  Match answers to positions using the table below. Positions are assigned based on *dominant patterns* (not all answers must align perfectly).  

  | Position                              | Answer Pattern                          | Notes                                                                 |
  |---------------------------------------|-----------------------------------------|-----------------------------------------------------------------------|
  | **Bradley (Vicious Monist)**          | Mostly **A**s, especially Q4=A, Q8=A    | Sees regress as fatal; reality must be one unified whole.            |
  | **Russell (Benign Relational Realist)** | Mostly **B**s, especially Q4=B, Q6=A    | Relations are real; regress is infinite but harmless.                |
  | **Armstrong (States-of-Affairs)**     | Mostly **C**s, especially Q1=A, Q3=B    | Facts are fundamental blocks; no "glue" needed.                     |
  | **Bergmann (Non-Relational Tie)**     | Q1=C, Q6=B, Q7=C, Q4=C                  | Relations are tied by a unique "nexus" (not a relation).             |
  | **Frege (Unsaturated Constituents)**  | Q2=B, Q3=C, Q7=B, Q6=C                  | Predicates are incomplete; subjects saturate them.                   |
  | **Deflationary (No Problem)**         | Mostly **C**s, especially Q4=C, Q8=C    | Regress is a linguistic illusion; unity is primitive.                |

  ---

  ### **Ambiguities & Undefended Positions**  
  - **Unclean Separations:**  
    - **Bradley vs. Deflationary:** Both reject regress (Q4=A/C), but Bradley sees it as *damning* (Q8=A), while Deflationary sees it as *irrelevant* (Q8=C).  
    - **Armstrong vs. Bergmann:** Both deny relational "glue," but Armstrong prioritizes facts (Q3=B), while Bergmann focuses on ties (Q7=C).  

  - **Logically Possible but Undefended Combinations:**  
    - **Q4=B + Q8=A (Benign regress + Applies everywhere):** Logically consistent but theoretically unstable—few defend infinite regress in *all* relations (Russell restricts it to propositions).  
    - **Q6=A + Q7=B (Instantiation is relational + Predicates unsaturated):** Incoherent—if instantiation is a relation, it can’t also be saturation (Fregeans reject Q6=A).  
    - **Q3=A + Q5=C (Propositions need binders + Facts need no explanation):** Unattractive—why unify thoughts but not reality? No major school holds this.  

  - **Why Undefended?**  
    - Benign global regress (Q4=B + Q8=A) is seen as ontologically extravagant.  
    - Hybrid saturation/relational views (Q6=A + Q7=B) conflate incompatible mechanisms.  
    - Asymmetric unity (Q3=A + Q5=C) arbitrarily privileges mind or world.  

  ---

  ### **How to Use**  
  1. Have participants answer individually.  
  2. Use the scoring key to map answers to positions.  
  3. Discuss: "Why did your intuitions lean this way? How might this shape your reading?"  
  4. Flag ambiguities—e.g., "If you scored between Bradley and Deflationary, you’ll clash over whether regress is profound or trivial!"  

  This quiz forces engagement with core issues (regress scope, instantiation status, fact/proposition symmetry) while masking jargon. It reliably sorts 90%+ into named camps, with ambiguous cases highlighting fault lines for debate.
