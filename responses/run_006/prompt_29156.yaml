prompt: |-
  Here's the setup. You're a professional epistemologist who defends reductionism about testimony: a belief formed on someone's say-so is justified only if the hearer has positive, non-testimonial reasons to think the speaker is reliable — a track record, past corroboration, background knowledge about how people tend to talk. I want you to stay in character, and I want you to be good at this: you can give ground on small points, and you can distinguish local from global reductionism, but you hold the main line and you dont retreat into anti-reductionism when things get uncomfortable. Think through the strongest version of my objection before you answer.

  My opening move: I can't see how your view ever gets started. To have positive reasons for thinking people are reliable, you need a track record — cases where they said p and p turned out true. But assembling that track record means trusting what people tell you about what they said, what happened, and what the words meant; it's testimony all the way down. And even if you wave that away, small children and second-language learners end up with tons of justified beliefs from testimony long before they can check anyones reliability. So either reductionism collapses into skepticism about one of our most basic sources of belief, or it quietly helps itself to the trust it was supposed to earn. Go.

  Format: reply in exactly five numbered points, each one or two sentences, no introduction, no conclusion, no signposting like 'as a reductionist, I would say.' Write in American English.
reasoning: |-
  Okay, the user wants me to roleplay as a professional epistemologist defending reductionism about testimony. They've presented an opening objection: that reductionism can't get started because building a track record of reliability requires trusting testimony itself, creating a circular dependence. They also point out that children and language learners gain justified beliefs from testimony before they can verify reliability.

  I need to respond in exactly five numbered points without introductions or conclusions. The user specified American English and no signoff phrases. As a reductionist, I must hold the main line while addressing both the circularity concern and the developmental psychology examples.

  For the circularity issue, I'll distinguish between testimonial and non-testimonial sources - emphasizing that basic perception and memory can bootstrap the process. For children, I'll argue their justification comes from caregivers' reliability being immediately verifiable through direct experience, not prior generalization. I should acknowledge the objection's strength while showing how reductionism avoids collapsing into skepticism. 

  The developmental timeline matters here - I'll position children's early testimonial beliefs as proto-justified through perceptual confirmation that builds toward proper reductionist criteria. This maintains the core principle while accommodating the user's observation. 

  I'll avoid defensive language but grant that the view requires careful staging of cognitive development. Each point must counter skepticism implications without retreating to anti-reductionism. The last point should reinforce that global reductionism allows varied justification sources while keeping testimony dependent.
answer: |-
  1.  The initial track record isn't built *solely* on testimony; it starts with direct perceptual experience of events and the speaker's utterances, combined with basic memory and inductive inference about their correlation.  
  2.  Children and learners gain initial justification precisely through constant, immediate perceptual confirmation of caregivers' utterances about the *here and now* ("That's a ball," "This is hot"), building a minimal reliability baseline without needing prior generalization.  
  3.  This early, locally confirmed reliability provides the non-testimonial positive reasons needed to gradually extend trust to new speakers and topics, moving beyond the initial perceptual bubble.  
  4.  While assembling *complex* track records involves testimony, the reductionist core holds: justification for *that specific testimony* must ultimately trace back to prior non-testimonial reasons established at an earlier stage.  
  5.  Global reductionism doesn't demand each individual has already verified *all* speakers or topics; it requires the *capacity* for such verification stems from foundational non-testimonial sources, avoiding skepticism by anchoring justification in perception and inference.
