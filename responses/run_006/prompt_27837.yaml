answer: |-
  A thoughtful opening, but you're missing the depth of Williams' concern. Granting you that utilitarians *can* promote automatic dispositions as a psychological strategy, Williams argues this *solves the deliberative problem only by creating a deeper problem for integrity*. The very reason you cultivate the disposition – because it *happens* to be optimific – undermines the character of the commitment it's meant to produce. Genuine love or loyalty isn't *sustained* by the hidden justification that "this feeling maximizes utility"; that justification *infects* the commitment, making it instrumental. The agent who saves their wife "automatically" because they've been *programmed* by utilitarianism to do what usually maximizes utility is still, ultimately, acting *for utility*, not fundamentally *for her*. This renders the commitment contingent and alienable – if utility calculation demanded sacrificing her, the disposition becomes morally problematic *from within their own utilitarian framework*. Williams' point is that this makes the personal project (loving his wife) a *regulative fiction* for the utilitarian agent, not a truly intrinsic, identity-constituting ground of action. The justification *cannot* be cleanly separated; it hollows out the commitment it aims to simulate.

  *(Your turn: Engage with the "regulative fiction" or "contingency" point, or challenge why the justification must infect the phenomenology.)*
