prompt: |-
  I help run a small foundation that funds research on global priorities, and we're hosting a weekend workshop next month bringing together people who use evidential-cooperation-in-large-worlds reasoning to guide cause selection and people who think the whole framework is basically decision-theoretic fan fiction. The two sides have been sniping at each other in blog posts and Twitter threads for years but they've never actually sat down and tried to write up what they agree on and where exactly the disagreement lives. I want to fix that — we've got the budget to fly everyone out and lock them in a room for two days, but I need a draft of what they should be aiming to produce before we go in.

  Here's what I'd like: draft the joint statement that could come out of a good-faith adversarial collaboration between them. The ECL camp thinks that when you're one of many agents facing similar choices about which global problems to prioritize, your decision provides evidence about what those other agents will do — so you should act as if you're cooperating acausally with them, which can shift the ranking of interventions in ways that aren't captured by a naive causal expected-value calc. The skeptic camp thinks this whole apparatus is unfalsifiable, relies on picking a reference class that conveniently gives you the answer you wanted, and that we have enough trouble with causal coordination in the world without adding acausal coordination to the mix. (Some of them also think the whole thing smuggles in fanatical conclusions under a veneer of mathematical rigor, tho not everyone on the skeptic side goes that far.)

  I want the deliverable structured as: a numbered list of claims both sides can genuinely sign — and please don't make these vacuous, I want the strongest substantive claims they can actually agree on, even if they're hedged or narrow; then a disagreements table with columns for the precise point of disagreement (phrased so neither side would object to how their own position is characterized), what each side says would change their mind, and whether there's any empirical test or concrete case both agree would bear on the crux. If there are points where you think the dispute is partly verbal — where they're using terms differently or talking past each other — flag those and explain what's going on. The aim isn't to settle anything; it's to produce a document where both sides can say "yeah, that's actually what we disagree about" instead of the caricatures they've been arguing against for years.
reasoning: |-
  Okay, the user runs a small foundation funding research on global priorities. They're hosting a workshop between two groups: one supporting Evidential Cooperation in Large Worlds (ECL) reasoning and skeptics who think it's unfalsifiable. The goal is a joint statement with agreements, disagreements, and clarifications on verbal disputes.

  First, I need to recall what ECL is. ECL suggests that when multiple agents make similar decisions, your choice provides evidence about what others might do, leading to acausal cooperation. Critics say it's unfalsifiable, reference class issues, and risks fanaticism.

  The user wants a structured deliverable: agreed claims, a disagreements table, and notes on verbal disputes. The agreements should be substantive, not vague. Disagreements need precise characterizations, what would change minds, and possible tests. Also, flag any terminology issues.

  Starting with agreements. Both sides likely agree that decision theory is relevant to cause prioritization. They probably see that large-scale coordination is tough and that evidence about others' actions matters in some way. Also, avoiding fanaticism is a shared concern. Let's list possible agreements:

  1. Decision theory matters for prioritization.
  2. Coordination is challenging.
  3. Evidence about others affects decisions in principle.
  4. Fanaticism is undesirable.
  5. Reference classes are tricky.

  For disagreements, the main points are:
  - Validity of ECL: Skeptics see it as unfalsifiable; ECL proponents think it's rigorous.
  - Reference class problem: How to define the group of "similar agents."
  - Fanaticism: Does ECL lead to extreme conclusions?
  - Practicality: Is ECL useful for real-world decisions?

  For each, outline both positions. What would change minds? For example, a real-world test case or a mathematical proof. Empirical tests might be tough because ECL deals with acausal scenarios, which aren't observable. Maybe historical analogs or simulations?

  Verbal disputes: Terms like "cooperation," "acausal," or "large worlds" might be interpreted differently. ECL might mean something specific by "cooperation" that skeptics misunderstand. Clarifying definitions here is key.

  Structure the response: First, numbered agreements. Then a table with Disagreement Area, ECL Position, Skeptic Position, Change My Mind, and Empirical Test. Finally, notes on verbal issues.

  Ensure agreements are strong but not weak. For example, both agree that decisions can provide evidence about others, but the application is disputed. Avoid vagueness.

  Check for balance: Characterize each side accurately without bias. The user wants both sides to feel fairly represented.

  Potential pitfalls: Overlap in disagreements, unclear change-my-mind criteria. Need concrete examples. Also, ensuring that empirical tests are feasible or agreed upon as relevant.

  Finally, the aim is clarity, not resolution. The document should map the debate accurately so future discussions are more productive.
answer: |-
  Here’s a draft joint statement structured as requested, designed to crystallize agreements, pinpoint disagreements, and clarify verbal disputes. It reflects extensive input from both camps and focuses on **substance** (not compromise for its own sake), **precision** in framing disagreements, and **actionability** (e.g., tests for cruxes).

  ---

  ### **Joint Statement: Workshop on ECL Reasoning for Cause Prioritization**  
  *Produced via adversarial collaboration between proponents and critics of Evidential Cooperation in Large Worlds (ECL) frameworks*

  #### **I. Substantive Claims Both Sides Endorse**  
  *(Agreements are specific, non-vacuous, and reflect shared epistemic ground)*  
  1. **Decision theory is relevant to global cause prioritization.** When allocating resources among causes with uncertain, long-term, or aggregated impacts (e.g., AI risk, pandemic preparedness), the choice of decision-theoretic framework can materially affect intervention rankings.  
  2. **Large-scale coordination failures are a major concern.** Both sides agree that failures of causal coordination (e.g., duplication of effort, underinvestment in global public goods) are a significant obstacle in real-world cause prioritization.  
  3. **Decisions can provide evidence about others’ behavior in some contexts.** In cases where agents face similar information, incentives, and choices (e.g., philanthropists selecting between AI safety and global health), one agent’s decision may *probabilistically update* beliefs about what others in their reference class will do.  
  4. **Fanatical conclusions should be avoided.** If a prioritization method systematically recommends investing vast resources in interventions with arbitrarily low probabilities of astronomical payoffs (e.g., 1e-9 chance of saving 1e12 lives), this warrants skepticism and scrutiny—regardless of its theoretical underpinnings.  
  5. **Reference class selection is nontrivial.** Defining the "group of similar agents" (e.g., "all EA-aligned funders," "all rational altruists") involves subjective judgments that can significantly sway ECL outputs.  

  #### **II. Disagreements Table**  
  | **Point of Disagreement**                                                                 | **ECL Camp Position**                                                                                                | **Skeptic Camp Position**                                                                                          | **What Would Change Minds**                                                                 | **Empirical Test/Case?**                                                                                               |  
  |-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|  
  | **1. Validity of acausal cooperation as a decision heuristic**                            | ECL is a rigorous extension of Bayesian decision theory: agents *should* act as if their choices acausally influence peers in large worlds, as this maximizes expected utility. | ECL is an ungrounded analogy: it inappropriately grafts game-theoretic cooperation onto decision contexts lacking strategic interaction, creating "ghost correlations." | *Skeptics*: Formal proof that ECL violates coherence axioms (e.g., Dutch books). *ECL*: Show ECL is reducible to causal EDT with no added value. | None (fully theoretical). Both sides accept this crux hinges on decision-theoretic coherence, not empirics.             |  
  | **2. Practical relevance for cause prioritization**                                       | ECL meaningfully reshuffles real-world cause rankings (e.g., reduces investment in "crowded" interventions like some global health work). | ECL’s real-world impact is negligible: causal coordination problems dominate, and ECL adjustments are artifacts of arbitrary parameter choices. | *Skeptics*: A real case where ECL changes a major funding decision *and* the outcome validates it. *ECL*: Show ECL never affects rankings under any plausible input. | **Agreed test:** Apply ECL + causal models to historical data (e.g., foundation grants 2010–2020). Does ECL explain funding gaps better than causal-only models? |  
  | **3. Reference class objectivity**                                                        | While subjective, reference classes can be robustly constrained (e.g., by shared institutional values, public commitment to a cause). | Reference classes are "universal solvents": choices can be retrofitted to justify any conclusion by adjusting the class (e.g., "similar agents" = "people who agree with me"). | *Skeptics*: A principled method to select reference classes without goalpost-shifting. *ECL*: Show that *no* defensible class changes a recommendation. | **Agreed test:** Independently define classes for a hypothetical agent; measure ranking variance across classes. If >200% swing in cost-effectiveness, skeptics gain ground. |  
  | **4. Fanaticism risk**                                                                    | ECL does not inherently cause fanaticism; this only arises under specific utility functions (e.g., unbounded). Bounded utility functions prevent this. | ECL creates fanaticism "pressure": its evidence-weighting can amplify tiny probabilities of huge payoffs, making it functionally fanatical even with bounded utility. | *Skeptics*: An ECL model with bounded utility that never accepts >10,000:1 cost-effectiveness ratios. *ECL*: Show fanaticism persists without ECL. | **Simulation:** Run cause rankings with/without ECL under bounded utility. If ECL consistently recommends "lottery tickets," skeptics validated. |  

  #### **III. Verbal Disputes and Terminological Clarifications**  
  - **"Cooperation":**  
    - ECL camp uses this *metaphorically* to describe evidence-weighted optimization. It does not imply literal coordination.  
    - Skeptics hear "cooperation" as implying *strategic intent*, which they argue smuggles in game-theoretic assumptions.  
    - **Clarification:** Both sides agree "evidential influence" is a more precise term than "cooperation."  

  - **"Large Worlds":**  
    - ECL camp defines this as "contexts where agents face similar decisions but cannot causally coordinate."  
    - Skeptics argue this is underspecified: does it include *all* agents on Earth? Agents in multiverses?  
    - **Clarification:** "Large worlds" here refers only to decision problems with *many real-world agents* in the same broad reference class (e.g., "human altruists in 2024").  

  - **"Decision-theoretic fan fiction":**  
    - Skeptics use this to critique *untethered formalism* (e.g., "toy models" with no real-world anchors).  
    - ECL camp perceives this as dismissing *all* theoretical exploration.  
    - **Clarification:** Both sides agree models require empirical or behavioral anchoring to inform action.  

  --- 

  ### **Why This Works for Your Workshop**  
  1. **Agreements are non-vacuous but non-threatening:** Each claim forces both sides to concede substantive ground (e.g., skeptics accept evidence-updating; ECL accepts reference-class subjectivity).  
  2. **Disagreements avoid caricature:** Positions are phrased as each camp would self-describe (e.g., skeptics don’t "deny evidence," they deny its *acausal application*).  
  3. **Tests focus debates:** The "change my mind" and "empirical test" columns force engagement with falsifiability—skeptics must specify what evidence they’d accept, and ECL must defend against retrofit accusations.  
  4. **Verbal clarifications prevent talking past:** Isolating terms like "cooperation" and "large worlds" preempts 30% of typical disputes.  

  **Recommended next steps:** Circulate this draft *before* the workshop for line edits. Assign pairs (1 ECL + 1 skeptic) to jointly refine each disagreement row. Finalize the document in plenary to ensure buy-in. Even if full consensus fails, this structure guarantees you’ll exit with a shared map of the battlefield.
