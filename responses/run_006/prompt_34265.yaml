  Okay, the user has presented a detailed summary of a metaethics seminar debate between two graduate students, Elena and David, about the Frege-Geach problem and its implications for expressivism. The user wants me to adjudicate their exchange move by move and evaluate who has the stronger arguments, particularly focusing on Elena's final challenge to hybrid expressivism.

  This is a complex philosophical debate about moral language and cognition. The Frege-Geach problem questions how expressivism can account for moral reasoning in unasserted contexts like conditionals. Elena argues that expressivism fails because it leads to equivocation, while David defends Blackburn's solution and hybrid approaches.

  I need to carefully reconstruct each step of their argument. First, Elena presents the core problem: expressivism treats moral judgments as expressions of attitudes, but in unasserted contexts, these attitudes aren't expressed, creating equivocation. David counters with Blackburn's solution about higher-order attitudes. Elena then questions whether attitudinal inconsistency equals logical inconsistency. David shifts to hybrid expressivism, and Elena traps it in a dilemma about redundancy.

  The user seems knowledgeable but wants clarification on who's right. They're likely a philosophy student or enthusiast seeking deeper understanding. Beyond adjudication, they probably want insight into the current state of expressivism and whether hybrid views escape Elena's dilemma.

  For my analysis: Elena is correct that pure expressivism struggles with logical properties, but Blackburn's solution isn't merely relabeling. David is right that hybrid views avoid some problems, but Elena's dilemma is potent. Hybrid expressivists might escape by showing how expressive and representational components interdependently explain moral thought's dual nature - but this remains contested in the literature. I'll structure my response to validate both sides while highlighting ongoing challenges.
answer: |-
  Here's a move-by-move adjudication of Elena and David's exchange, assessing the strengths of their arguments and the current state of the Frege-Geach problem for expressivism:

  **1. Elena's Opening Salvo (The Core Problem):**
  *   **Claim:** Frege-Geach is fatal to expressivism because it shows equivocation in moral terms across asserted/unasserted contexts, destroying validity.
  *   **Assessment:** **Essentially Correct.** This is the *classic* statement of the Frege-Geach problem. She accurately identifies the expressivist's core challenge: how can a term meaning *non-cognitive attitude expression* in asserted contexts retain the *same meaning* in unasserted contexts (like conditionals, questions, disjunctions) where the attitude isn't expressed, and crucially, how can it contribute to the *logical validity* of inferences involving those contexts? If the meaning changes, modus ponens fails. If the meaning is the same (attitude expression) but no attitude is expressed in the antecedent, that seems incoherent.

  **2. David's First Reply (Blackburn's Quasi-Realism/Higher-Order Attitudes):**
  *   **Claim:** Blackburn solves it. The whole conditional expresses a complex higher-order attitude. The component attitude ("disapproval of lying") is the *same* in both contexts; its role within the larger expressed attitude changes. Attitudinal inconsistency replaces logical inconsistency for validity.
  *   **Assessment:** **Partial Defense, Raises New Questions.** David is correct that this is Blackburn's (and Gibbard's, in his own way) *proposed solution*. It *attempts* to show how the same attitude-type can be involved in unasserted contexts without being expressed *at that moment*. The "meaning" (the attitude-type disapproved-of) is constant; the *performance act* changes. He's also right that expressivists define validity in terms of *inconsistency* in the attitudes one must hold to accept the premises but reject the conclusion. However, Elena's next move highlights the flaw in this defense.

  **3. Elena's Counter (Attitudinal vs. Logical Inconsistency & Gibbard's Collapse):**
  *   **Claim a):** Attitudinal inconsistency ≠ Logical inconsistency. Why is *this specific* inconsistency (disapproving of A while not disapproving of B when you disapprove of combining non-disapproval of B with disapproval of A) a *logical* flaw?
  *   **Assessment a):** **Strong Point.** This is a profound challenge. Blackburn *stipulates* that this higher-order attitude structure mirrors logical structure. But *why* should the psychological state of having clashing attitudes be considered a *mistake in reasoning* akin to believing P and not-P? Expressivists need to explain why this specific structure *deserves* the label "logic" and isn't just a contingent psychological aversion to certain combinations of attitudes. The burden is on them to show this structure *necessarily* tracks truth-preservation (which they deny exists fundamentally for morals) or some other robust norm of reasoning.
  *   **Claim b):** Gibbard's sophisticated norm-expressivism collapses into descriptivism.
  *   **Assessment b):** **Provocative and Plausible, but Debatable.** Gibbard uses complex structures (systems of norms, hyperplans) to model moral content and logical relations. Elena argues that once you build in enough structure to genuinely support logical relations (e.g., the norms governing the *inconsistency* of accepting certain combinations), you've functionally *recreated* representational content – you're describing what the norms *require* or *forbid*. This is the "collapse" or "creeping minimalism" worry. While Gibbard denies this, arguing the expressive function remains primary, the line is thin. Many find this argument forceful: if the "logic" of norms behaves *exactly* like the logic of propositions, the difference seems semantic.

  **4. David's Pivot (Hybrid Expressivism):**
  *   **Claim:** Pure expressivism might be vulnerable, but *hybrid* expressivism (moral judgments have *both* belief-like and attitude-expressing components) escapes Frege-Geach. The belief-like component handles logic.
  *   **Assessment:** **Valid Strategic Retreat.** David correctly identifies that hybrid views (like those of Ridge, Copp, or arguably early versions from Stevenson) *do* sidestep the *core* Frege-Geach problem. If part of the meaning of "lying is wrong" is a belief with representational content (e.g., "lying has property W"), then that content can straightforwardly figure in logical relations in embedded contexts, just like any other descriptive belief. The logic is handled by the representational bit. This is a genuine advantage of hybrid views over pure expressivism regarding this specific problem.

  **5. Elena's Dilemma for Hybrid Views:**
  *   **The Dilemma:** Either:
      *   **Horn 1:** The expressive component *contributes* to the logic → Frege-Geach problem returns.
      *   **Horn 2:** The expressive component is *idle* for logic → It's redundant (motivation can be explained separately by a theory linking belief to motivation).
  *   **Assessment:** **This is a Potent Challenge - It Lands Hard.**
      *   **Horn 1:** If the hybridist tries to make the *expressive* component do *any* essential work *within* the logical structure (beyond what the representational component does), they reintroduce the original Frege-Geach problem for *that* component. How does the *attitude* part function logically in embeddings? This seems messy and unnecessary if the representational part already handles it.
      *   **Horn 2:** This is the sharper horn. If the representational component *alone* determines the propositional content and hence the logical behavior (validity, truth-conditions, embedding), then what essential work is the *expressive* component doing *for the meaning and logic of moral sentences*? The hybridist might say:
          *   **Motivation:** It explains why moral judgments motivate. But a descriptivist can pair the belief ("lying has W") with an independent theory of motivation (e.g., "Believing something has W inherently motivates," à la internalist realism). The expressive component becomes explanatorily redundant *for semantics and logic*.
          *   **Distinctive Meaning:** It captures the "practical" or "action-guiding" *flavor* of moral language. But if this flavor doesn't affect truth-conditions or logic, is it part of the *semantic content* or just a pragmatic feature? If it's semantic but non-logical, how is that different from descriptivism plus a theory of pragmatics/connotation?
      *   **Slipping Between the Horns?** Hybridists *try* to avoid this by arguing the two components are *inseparable* or *co-constitutive*:
          *   **Co-Constitution:** The representational content might be *partially constituted* by the attitude (e.g., "W" just *is* the property that warrants disapproval). The attitude isn't *added* to the belief; it's part of what *makes* the belief the belief it is. This aims to show the expressive component isn't idle – it's essential to *determining the content* of the representational component, which *then* handles the logic. (This is Ridge's "Ecumenical Expressivism" strategy).
          *   **Assessment of Escape:** This is the *best hope* for hybridists, but it's controversial and faces challenges:
              *   **Complexity vs. Payoff:** Does this complex machinery offer clear advantages over simpler realist or pure expressivist views?
              *   **Collapse Worry Persists:** Does defining the representational content in terms of attitudes still lead to a form of descriptivism about attitude-dependent properties?
              *   **Explanatory Burden:** Does this truly explain the *distinctive force* of moral language, or does it just describe a complex belief? Does it adequately capture the sense that moral judgments express commitments rather than just describing psychological or normative facts?
          *   **Conclusion on the Dilemma:** Elena's dilemma is strong. Horn 2 is particularly difficult. While sophisticated hybridists *attempt* to escape via co-constitution, it's debatable whether they fully succeed or merely relocate the challenges of pure expressivism into the metaphysics of the representational component. The dilemma significantly weakens the *advertised advantage* of hybrid views over descriptivism concerning the logic of moral discourse.

  **Overall Adjudication & Who Has the Better Case:**

  1.  **On Pure Expressivism (Blackburn/Gibbard):** **Elena has the stronger case.** The Frege-Geach problem remains a *serious, unsolved challenge*. Blackburn/Gibbard offer ingenious *responses* (higher-order attitudes, complex normative structures), but they face deep objections about grounding logical norms in attitudes (Elena's inconsistency point) and avoiding collapse into descriptivism (Elena's Gibbard point). These responses are seen by many as "epicycles" – complex fixes that don't fully resolve the core tension. Pure expressivism survives, but it's embattled.
  2.  **On Hybrid Expressivism:** **Elena's dilemma is powerful and largely lands.** David is right that hybrids avoid the *initial* formulation of Frege-Geach. However, Elena successfully shows that this comes at a cost: the expressive component risks becoming explanatorily redundant *for the core semantic and logical properties* of moral language. Hybridists have responses (co-constitution), but they are complex and face significant challenges regarding collapse and explanatory payoff. Hybridism doesn't look like the straightforward victory David suggests; it faces its own profound dilemma.
  3.  **The Bigger Picture:** **Neither has a decisive knockout blow, but Elena's critique is more penetrating regarding the fundamental difficulties.**
      *   David successfully defends the *sophistication* of expressivist responses and highlights the *potential* of hybrid views to handle logic.
      *   **However, Elena correctly identifies the deep, unresolved issues:** the grounding of logic in psychology for pure expressivism, and the threat of redundancy/collapse for hybrids. She exposes that 40 years of work haven't produced a consensus solution; the problem persistently reveals tensions within the expressivist project. Her "epicycles" charge reflects a common sentiment in the literature.

  **Conclusion:** The Frege-Geach problem is not definitively "solved." It remains a major hurdle for pure expressivism and a significant challenge requiring complex (and potentially problematic) machinery for hybrid expressivism. Elena's arguments, particularly her final dilemma, effectively demonstrate why expressivism in all its forms continues to face serious philosophical scrutiny on this front. While expressivism remains a vibrant research program, the Frege-Geach problem ensures it operates under a significant burden of proof.
