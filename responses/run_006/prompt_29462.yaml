prompt: |-
  so I just spent like an hour arguing with a friend about the discursive dilemma, and I think I've got a good idea for an exam question but I want the full package. The thing we kept going back and forth on is whether the dilemma shows something deep about group inconsistency, or whether it's just an artifact of majority voting on premises. My friend kept saying it's obvious that if you vote premise-by-premise you can get an inconsistent set, and that's just procedural, not a deep point about group rationality. I don't buy it, because a group can be inconsistent even though every member is perfectly consistent, and that seems weirder than he'd admit.

  Anyway, I teach a upper-level political philosophy course, and I need a take-home essay prompt for a unit on judgment aggregation and the discursive dilemma. It's a 2-3 page answer, not a research paper. The prompt should force students to do more than rehearse the truthteller/courtroom example. I want them to engage with whether the discursive dilemma is a problem about aggregation procedures only, or whether it tells us something substantial about the possibility of group attitudes or group rationality. But don't let them waffle: they need to pick a position and defend it against the obvious objection from the other side.

  Please write the question, a model answer of around 600 words, and a marking scheme. For the marking scheme, separate an A answer from a B answer by specifying the precise moves one must make: e.g. explaining why premise-based and conclusion-based procedures both satisfy/fail different desiderata; saying what a group inconsistency actually amounts to when all individuals are consistent; and saying whether escape routes like 'the group doesn't have beliefs' or 'just pick one procedure' solve or dissolve the problem. Make the wrong moves specific too, like thinking the dilemma is just a voting cycle of preferences, or that it's about irrational individuals.
