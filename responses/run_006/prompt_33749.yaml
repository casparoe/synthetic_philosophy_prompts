  First, I need to recall the key elements here. The core of the argument is that models with known false assumptions are justified if they make accurate predictions. Milton Friedman's 1953 essay "The Methodology of Positive Economics" is the classic reference here. He argued that theories should be judged by their predictions, not the realism of their assumptions. But the reporter notes this appears beyond economics, so I should consider broader philosophical contexts.

  The term "instrumentalism" comes to mind. This is the view that scientific theories are tools for prediction, not descriptions of reality. So models are instruments; their assumptions aren't truth claims but useful fictions. That seems to fit the pattern described. However, instrumentalism is a broader philosophy, so I need to clarify if this specific defense is a subset or an application of it.

  Then there's Friedman's specific argument. While it's a form of instrumentalism, labeling the entire pattern as "Friedman's move" might be too economics-centric. The reporter mentioned examples in climate science and epidemiology, so a more general term would be better. The "as-if" defense is another angle—models work "as if" the assumptions were true, regardless of their actual truth. That might capture the essence across disciplines.

  I also need to distinguish this from other forms of idealization. Simplifying assumptions (like frictionless planes) are meant to be relaxed later, but here the assumptions are maintained despite being false because they work predictively. This is different from Galilean idealization, which involves isolating variables. The persistence of known false assumptions for predictive purposes is key.

  The reporter also mentions critics dismissing models solely based on false assumptions without checking predictions. This is the mirror error, possibly stemming from a realist perspective where models must have true assumptions to be valid. Highlighting this contrast shows both sides of the debate.

  To answer the user's question: the specific move is best described as instrumentalism, with Friedman's argument as a prominent example. However, to avoid disciplinary bias, terms like "the as-if defense" or "predictive justification" could be alternatives. Emphasizing the difference from constructive idealization (where assumptions are temporary) is important, as is linking it to debates between realism and instrumentalism in philosophy of science.

  I should structure the response in continuous prose, as requested. Start by affirming the pattern's recognition, introduce instrumentalism, discuss Friedman's role, explain the as-if reasoning, differentiate from other idealizations, address the realist critique, and conclude with naming suggestions. Keeping it conversational yet precise, avoiding jargon where possible, but not oversimplifying the philosophical concepts.
answer: |-
  As a fellow traveler in the world of ideas, I completely recognize the pattern you're describing. It’s pervasive and deeply provocative, touching on fundamental questions about how science works when it deals with complex systems that defy perfect description. You're right that Milton Friedman’s 1953 essay, "The Methodology of Positive Economics," is the most famous articulation, arguing that theories should be judged solely by the accuracy of their predictions, and that the "realism" of assumptions is irrelevant. But you're also correct that the *move* itself is much broader and older than Friedman’s application. Philosophically, the most direct and widely recognized label for this stance is **Instrumentalism**.

  Instrumentalism is the view that scientific theories, models, or concepts are not attempts to provide literally true descriptions of the world, but are instead **tools** or **instruments** for predicting observations, organizing data, and solving practical problems. The truth or falsity of the *internal components* (like assumptions about rational agents or well-mixed populations) is irrelevant on this view; what matters is whether the instrument as a whole yields successful predictions or useful results. The modeler's retort – "the right question is whether the model predicts accurately" – is a quintessentially instrumentalist response. They are explicitly prioritizing predictive utility over representational accuracy.

  Friedman’s argument is a specific, influential, and controversial application of instrumentalism within economics. Philosophers often refer to it directly as "Friedman's instrumentalism" or the "F-twist." While the *move* itself is instrumentalist, labeling the entire pattern across fields *just* as "Friedman's argument" would be overly narrow and historically inaccurate. Instrumentalism has roots stretching back to thinkers like Ernst Mach and Pierre Duhem, and its application in physics (e.g., using Newtonian mechanics for celestial navigation long after relativity was known) predates Friedman.

  The "as-if" reasoning you see is central to instrumentalism. The modeler isn't claiming rational agents *exist* or that populations *are* perfectly mixed; they're claiming the model *behaves as if* they were true, *for the purpose of generating these specific predictions*. This "as-if" defense is the hallmark instrumentalist maneuver when challenged on unrealistic assumptions.

  Distinguishing it from neighboring ideas is crucial. **Ordinary Idealization or Galilean Idealization** involves deliberate simplification (like frictionless planes or point masses), often with the explicit intent to introduce complicating factors *later* to get closer to reality. The key difference is the *attitude* towards the falsehood. In constructive idealization, the falsity is acknowledged as a temporary step towards greater realism; the falsity itself is a target for future improvement. In the instrumentalist move you describe, the falsity is often *accepted indefinitely* because the model "works" predictively. Improving the assumptions only happens *if* the predictions fail, not *because* the assumptions are known to be false. The justification lies purely in output, not in the representational fidelity of the input.

  This separates it from **sloppiness or hand-waving**. The instrumentalist isn't (necessarily) being careless; they are making a deliberate, principled argument about the *purpose* of the model. They are arguing that demanding realistic assumptions misunderstands the model's function as a predictive instrument. Sloppiness would involve ignoring criticism about assumptions *without* offering this principled defense, or ignoring predictive failures. The instrumentalist is ready to discard the model *if* it fails predictively; the sloppy modeler might ignore predictive failures.

  The mirror-image mistake – dismissing a model solely because an assumption is false without checking predictions – usually stems from a **Realist** perspective. Realists argue that good science aims for true (or approximately true) descriptions of the world. For them, models built on known false foundations are inherently suspect, even if they predict well temporarily, because they might fail catastrophically in novel situations or mislead us about underlying mechanisms. They see instrumentalism as dangerously complacent about falsehood.

  So, to summarize: The core name for this argumentative move is **Instrumentalism**. Friedman provided a famous and contentious economic application, so "Friedman's instrumentalism" is apt *within that context*, but the general pattern across science is best called instrumentalism. The specific "as-if" defense of known false assumptions for predictive gain is the instrumentalist move in action. It differs from constructive idealization by its acceptance of persistent, useful falsehoods, and from sloppiness by its principled justification rooted in predictive utility. The debate between instrumentalists (valuing prediction above all) and realists (valuing truthful representation) is one of the oldest and deepest in the philosophy of science, and your observation captures a vital skirmish in that ongoing conflict. If you need a punchy phrase beyond "instrumentalism," "predictive justification" or "the as-if defense" capture the essence well. It’s a fascinating tension that cuts right to the heart of how we build knowledge about messy, complex systems.
