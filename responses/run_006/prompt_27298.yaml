prompt: |-
  I'm a software engineer with no philosophy background to speak of, and I got pulled into intuitionistic logic through the Curry-Howard correspondence — proofs as programs and all that, where a proof of an implication is literally a function. The thing I can't figure out is the debate around it. Brouwer and the constructivists have been saying for a century that classical mathematics does something illegitimate when it proves "there exists an x" without constructing one, and the classical side says that's just a weird restriction, not a correction. Both sides seem to have known each other's moves for decades and nobody changes their mind. My working theory is that they're just using "exists" and "or" to mean different things, and that the whole thing is partly verbal. But then I read that double-negation translation embeds classical logic into intuitionistic logic, which sounds like it ought to settle the argument somehow, yet it doesn't. So: what kind of disagreement is this, actually? Is it substantive — about mathematical reality or what counts as a proof — or is it verbal, or are the two sides answering different questions under the same name? And given your diagnosis, what would actually count as progress: a formal result, a sharper distinction, or should the question just be dropped? I dont need a survey of the history, I want the diagnosis.
