  1. The proposition, stated precisely (1–2 sentences), including what would count as a possible case.
  2. Sub-questions and probabilities (roughly 4–6 terms, each with a number and one line of justification). At minimum cover: whether a genuine enkratic requirement exists; whether higher-order evidence can be outweighed by first-order evidence in the impairment cases; whether those cases actually involve full-fledged higher-order belief rather than something weaker; and wether "rational" here should be read as coherence or as responsiveness to evidence.
  3. Final credence and combination (2–3 sentences on how you combined the terms).
  4. Where you're least confident (2–3 sentences): which term would move your number most, and where you think my friend and I most likely diverge.
