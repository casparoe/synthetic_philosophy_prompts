  What I want from you is a number: your credence that there's at least one possible case where an epistemically akratic state — believing P while believing your evidence doesn't support P — is rationally permissible, not merely excusable or blameless, but actually permitted by the norms of rationality. And I want the number decomposed, not just pulled out of the air.

