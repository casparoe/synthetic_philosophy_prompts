  | **B. In impairment cases, 1st-order evidence can outweigh HOE**      | 0.60 | If 1st-order reasoning seems flawless *despite* known impairment, resisting belief revision *might* be evidence-responsive (cf. Dorst, "Lockeans"). |
  | **C. Impairment cases involve full *belief* in ¬[E→P], not suspicion** | 0.65 | Severe cases (e.g., "I know this drug causes 90% false positives") can justify full belief in evidential unsupport. |
  | **D. "Rational" = evidence-responsiveness (not coherence)**          | 0.70 | Your argument centers on evidence-weighting; coherence norms (à la Dutch books) likely forbid akrasia entirely. |

  ---

  **3. Final Credence & Combination**  
