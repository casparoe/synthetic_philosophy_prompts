  - Without (A), akrasia is vacuously rational → *Weight = [1 - P(A)] = 0.30*  
  - With (A), akrasia requires (B), (C), (D) → *P(B ∧ C ∧ D) ≈ 0.60 × 0.65 × 0.70 ≈ 0.27*  
  Total: **0.30 (A false) + 0.27 (A true + others) ≈ 0.57**, then adjusted to **0.65** for neglected factors (e.g., "ought implies can" in impairment cases). This aligns with your 0.60 intuition.

