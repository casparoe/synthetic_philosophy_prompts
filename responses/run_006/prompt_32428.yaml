answer: |-
  Here's a joke that hinges on the core tension between Peirce's consensus-driven "end of inquiry" truth and James's "cash value"/expediency truth, designed for those in the know:

  **Setting:** William James is trying to convince Charles Sanders Peirce to cross a rickety wooden bridge over the frozen Charles River on a bitterly cold winter day. James needs to get to a lecture on Pragmatism across town.

  **James:** "Come on, Chuck! We *have* to cross! Trust me, the bridge is true. It *works*. It has *cash value* right now – it gets us warm, pays the lecture fee, avoids frostbite! What's truer than survival and a paycheck?"

  **Peirce:** *(Peering skeptically at the groaning bridge, scribbling notes)* "William, your impetuosity blinds you. The *truth* about this bridge isn't determined by your immediate shivering or desire for remuneration. Truth is what the *community of inquirers* would stably believe *at the end of inquiry*! We need comprehensive structural analysis, longitudinal stress-test data, peer-reviewed assessments of the lumber's integrity over geological time... The ideal consensus is decades, perhaps centuries, away! Acting now is mere belief, not truth!"

  **James:** *(Stamping his feet, exasperated)* "Cash value, Chuck! *Cash value!* Your 'end of inquiry' is a lovely abstraction, but my toes are freezing *now*! If the bridge holds *long enough* for me to get warm and get paid, then for all *practical* purposes, *it's true enough*!"

  **Peirce:** "But William, suppose it collapses *next week*? Or under the next traveler? That would falsify your hasty 'truth'! Only the ultimate convergence of all possible evidence guarantees true belief!"

  **James:** *(Already halfway across the bridge, calling back)* "Fine! You wait here for the ultimate convergence! I'll be at the bank cashing the *expedient* truth's dividend... and thawing my *actually frozen* backside! If your 'Truth' leaves you hypothermic on the riverbank waiting for an ideal future that never arrives... what *cash value* does *that* have, Professor?"

  **Peirce:** *(Muttering to himself, still scribbling as James disappears)* "...insufficient data for convergence... clearly a case of confusing the *merely satisfactory* with the *ultimately real*... though... it *is* remarkably cold..."

  **Why it works & highlights the tension:**

  1.  **Peirce's View Parodied:** His focus is entirely on the *ideal, future, communal consensus* ("end of inquiry"), ignoring the immediate, practical need. His truth is detached from present consequences.
  2.  **James's View Parodied:** He reduces truth entirely to the *immediate practical consequences and benefits* ("cash value," avoiding cold, getting paid). The bridge's long-term structural integrity (Peirce's concern) is irrelevant if it serves the purpose *now*.
  3.  **The Core Pragmatist Tension:** Both are "pragmatist" because they ground truth in *consequences* rather than pure correspondence or coherence. But Peirce's consequences are long-term, communal, and idealized, while James's are immediate, individual, and experiential/utilitarian. James sees Peirce's view as uselessly abstract when action is needed ("hypothermic on the riverbank"). Peirce sees James's view as perilously short-sighted and subjective ("collapses next week").
  4.  **The Punchline:** James wins the argument *pragmatically* by acting on his definition and achieving the desired result (getting warm, getting paid). Peirce is left literally frozen in his theoretical stance, demonstrating the "cash value" deficit of waiting for an ideal future consensus when faced with a pressing present need. The joke shows James's truth "working" and having immediate value, while Peirce's truth, though aiming for a higher ideal, fails the practical test of the moment.
