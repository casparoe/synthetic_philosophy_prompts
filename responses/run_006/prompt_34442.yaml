  I'm in a metaphysics seminar and the phrase "to be is to be perceived" keeps getting thrown around — sometimes as a summary of Berkeley, sometimes as a free-standing claim about the nature of reality, and once, bafflingly, as an argument against the existence of dark matter. I'd like to get clear on what this slogan could actually mean. Can you lay out the distinct precise claims that "to be is to be perceived" might be used to express, from the relatively modest to the radically idealist? For each reading, say whether it's plausible, and which reading would actually license the dark matter objection. Please write your answer in continuous prose, without headings, bullet points, bold text, or tables — the way you would write an email.
