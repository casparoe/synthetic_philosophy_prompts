answer: |-
  That phrase, "to be is to be perceived," is indeed a central Berkeleyan slogan, often called *esse est percipi*. It's powerful, slippery, and frequently misunderstood or oversimplified in seminar discussions, leading to confusions like the dark matter objection. Let me try to unpack the distinct levels of commitment it might express, moving from more modest to more radically idealist claims, and assess their plausibility and relevance to that objection.

  One relatively modest interpretation focuses on knowledge and evidence: existence *for us* is tied to perception. On this reading, the claim is epistemological, not metaphysical. It means that the only way we can *know* something exists, or meaningfully *affirm* its existence, is through some form of perception (sensory or otherwise). Unperceived things are simply beyond our cognitive grasp; we cannot verify or meaningfully talk about them. This is plausible in a constrained sense – our access to the world *is* mediated by our senses and cognitive faculties. However, it leaves open the possibility of things existing independently of being perceived *by anyone*; we just couldn't know about them. This reading wouldn't license an objection to dark matter's *existence*, only to our *certainty* about it prior to indirect evidence.

  Berkeley's actual position, however, is far more radical and metaphysical. For Berkeley, *esse est percipi* means that the very being of ordinary objects (tables, mountains, cherries) consists *entirely* in their being perceived. Objects aren't material substances hiding behind perceptions; they *are* collections of ideas (sensations) existing *in minds*. A tree isn't a mind-independent thing causing my green and brown sensations; the tree *is* that organized bundle of green, brown, solidity, etc., sensations existing in perceiving minds. This is ontological idealism: reality is fundamentally mental. Plausibility here hinges entirely on accepting idealism. It's internally coherent but requires accepting that God's eternal perception grounds objects when no finite mind perceives them, avoiding the absurdity of objects popping in and out of existence. On Berkeley's own terms, this view doesn't preclude dark matter's existence *if* it can be perceived (even if only indirectly inferred as causing perceptions) or perceived by God. The objection fails against Berkeley himself.

  A stronger, perhaps more popular but less careful, interpretation pushes beyond Berkeley towards a kind of subjective idealism or phenomenalism: *to be is to be perceived by some mind, full stop*. No divine perceiver is invoked. Here, existence is strictly dependent on being an object of some finite mind's awareness. This makes the existence of objects contingent on being perceived *at that moment*. This version faces the glaring problem of the unperceived: does the tree cease to exist when no one looks at it? Without Berkeley's God, this seems absurd and scientifically untenable. It struggles with anything not currently under observation – the far side of the moon, extinct species, subatomic events, or indeed, dark matter inferred only through gravitational effects. Plausibility is very low; it contradicts our deepest intuitions and scientific practices about the continuous, observer-independent existence of the world.

  The strictest, most literal, and frankly crudest reading – the one likely motivating the dark matter objection – is the claim that *existence itself is identical to the act of being perceived*. If it's not perceived, it doesn't exist, period. There is no reality outside of current acts of perception. This collapses the distinction between the object and the perception of it. On this view, dark matter, precisely because it hasn't been *directly* perceived (only inferred from its gravitational effects on visible matter), cannot be said to exist. The gravitational anomalies must be explained some other way, or perhaps dismissed. This reading is highly implausible. It renders science impossible (most science deals with entities inferred, not directly sensed), makes the continuity of the physical world inexplicable, and conflates evidence for existence with existence itself. It's this radically subjectivist interpretation that "licenses" the dark matter objection, but it's also the least defensible and arguably a caricature of Berkeley, who used God precisely to avoid this pitfall.

  So, while "to be is to be perceived" starts as Berkeley's profound idealist challenge to materialism, its meaning in your seminar likely slides across this spectrum. The dark matter objection only gains traction against the strictest, most subjectivist reading – the one that dispenses with God and makes existence fleeting and perception-dependent. Against Berkeley's actual theistic idealism or the more modest epistemic claim, the objection misfires. The phrase's power lies in its ambiguity, but clarity demands we distinguish whether it's a claim about the *nature* of reality (idealism, requiring God for coherence), the *evidence* for reality (epistemological modesty), or an untenable subjective phenomenalism (where the dark matter objection finds its shaky ground). Berkeley’s sophisticated version remains philosophically challenging; the crudest version used against dark matter is not.
