answer: |-
  1. The mapping: players are the IAU as authoritative rule-giver, the wider astronomical community embodying the practice of applying "planet," with Pluto and newly discovered trans-Neptunian objects (like Eris) as the disputed next cases; the pre-2006 rule was an implicit, practice-based cluster (orbits Sun, spherical from self-gravity, prominent size) lacking precise criteria for "prominent"; evidence for prior meaning includes historical usage patterns, observational reports, textbooks, and past classifications of borderline cases.
  2. The skeptic's challenge applied: No fact about past usage (e.g., calling Pluto a planet), dispositions (e.g., how astronomers might have responded to hypothetical discoveries), or implicit criteria (e.g., "prominent size") determined whether "planet" *must* apply to Pluto/Eris once the rule "ran out" at these novel cases, demonstrating that the IAU vote didn't discover a pre-existing extension but stipulated a new rule (clearing the orbit) and projected it backward to settle the dispute.
  3. What the skeptical solution explains well: It explains why the prior practice alone was insufficient to resolve the novel cases (revealing the rule's indeterminacy), why communal agreement (the IAU vote representing the community) was necessary to fix meaning for "planet" going forward, and how the reclassification reflects meaning being settled by use/agreement rather than by a pre-existing fact.
  4. Where it misdescribes or goes silent: The skeptical solution, focused on tacit communal practice, misdescribes the explicit, formal, and dated legislative act of the IAU vote (a specific body deciding via procedure) as equivalent to the slow, unspoken convergence of a shared form of life; it goes silent on the unique authority and intentional stipulation involved in such institutional rule-making versus organic practice.
  5. The verdict on the theory: The episode confirms the skeptical solution's core insight (meaning fixed by communal agreement in response to novel cases, not pre-existing facts), but it is an anomaly because Kripkenstein's model, built for an individual extending a rule like "+", fails to anticipate the complexities of a designated community formally legislating a kind-term's definition and retroactively applying it.
