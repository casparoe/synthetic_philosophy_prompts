prompt: |-
  my mate in sociology keeps saying that social facts are like the rules of chess — you can't explain why a bishop moves diagonally by looking at the brain states of individual players, because the rule exists at the social level and constrains what individuals can do. he uses this to argue that methodological individualism is bankrupt and that you have to study social phenomena at the collective level. i'm sympathetic but i'm not sure the analogy does the work he thinks it does. can you lay out what maps onto what, where the chess analogy breaks down, what it smuggles in about the nature of social rules, and whether the anti-individualist conclusion survives once the disanalogies are on the table?
