prompt: |-
  ok so im in a philosophy of religion class and we just finished the unit on divine hiddenness. ive come out of it thinking schellenberg's argument is basically right, and im trying to figure out how confident i should actually be in that.

  the position: the fact that there exist non-resistant non-believers — people who genuinely want to know whether God exists and are open to a relationship with him, but dont believe — is strong evidence against the existence of a personal God who is perfectly loving and desires a relationship with all people. i dont think its a deductive proof, but i think it makes theism significantly less probable than it would otherwise be, and the main responses ive seen (free will defense applied to belief-formation, the idea that hiddenness is necessary for soul-making, skeptical theism) each have serious problems.

  what i want from you: tell me what would count against this position. i mean genuinely — what evidence, arguments, or developments should make me revise downward my confidence that hiddenness is a problem for theism? i want these sorted by how decisive theyd be, from "this would basically dissolve the argument" to "this is a minor awkwardness." i also want to know whether the position as ive stated it is falsifiable in any interesting sense — does it stick its neck out, or has it been qualified into unfalsifiability? and if it has been, is that actually a problem for an argument of this kind, or is that just how arguments in philosophy of religion work?

  also, please flag where you think the reasoning is most vulnerable — the premise or inference step thats most likely to fail — and tell me what consideration would be most likely to change your mind about the overall verdict if you were defending it.
