  ### **Principal Principle In-Class Game Design**

  #### **Learning Goals**
  - Illustrate the **Principal Principle**: Rational credence should match known objective chance (e.g., 0.7) unless agents possess **inadmissible evidence** (e.g., direct knowledge of the outcome or predictor reports).
  - Surface the **admissibility problem**: Deference to chance stops when agents gain information that "screens off" the chance (e.g., outcome knowledge or reliable predictions).
  - Use **behavioral evidence**: Students’ betting behavior will visibly track the chance (0.7) in baseline conditions but depart when given inadmissible evidence.

  ---

  ### **Game Setup**
  **Materials**:  
  - **Chancy device**: A 10-sided die (or digital RNG).  
    - **Heads** = 1–7 (70% chance), **Tails** = 8–10 (30% chance).  
  - **Predictor**: A second 10-sided die for generating predictions (80% accurate).  
  - **Betting chips**: Poker chips or cards (1 chip = 1 point).  
  - **Scoreboards**: For tracking points (students start with 10 chips).  

  **Stakes**:  
  - Bets cost 1 chip to place.  
  - Winning bets pay 3 chips (net +2). Losing bets lose the 1-chip stake.  
  - **Rationale**: Small stakes reduce risk aversion; 3:1 payout encourages betting at true credence (e.g., bet on heads if credence > 0.33).  

  **Key Conditions**:  
  1. **Baseline**: Only the chance (0.7) is known.  
  2. **Calibration Info**: Additional data confirming the die’s 70% bias.  
  3. **Outcome Knowledge**: The die result is revealed (inadmissible evidence).  
  4. **Predictor Report**: A fallible predictor (80% reliable) announces a forecast.  

  ---

  ### **Rules & Timeline**  
  **Total Time**: 75 minutes.  
  **Students**: 18 (work individually).  

  #### **1. Introduction (10 mins)**  
  - Explain the die’s bias (70% heads).  
  - Teach betting:  
    - Bet **1 chip** to win **3 chips** if correct.  
    - **Example**: "If your credence in heads is 0.7, bet on heads (expected profit = 0.7×2 + 0.3×(−1) = 1.1 > 0)."  
  - Clarify scoring: Points = chips at game end (top 3 scorers earn bonus).  

  #### **2. Round 1: Baseline Chance (10 mins)**  
  - **Info given**: "This die lands heads 70% of the time."  
  - **Task**: Students bet on heads/tails for the **upcoming roll**.  
  - **Behavior prediction**: ~70% bet on heads (deference to chance).  
  - **Roll die publicly** → resolve bets.  

  #### **3. Round 2: Calibration Info (10 mins)**  
  - **Info given**: "We rolled this die 100 times: 71 heads, 29 tails."  
  - **Task**: Bet on **next roll**.  
  - **Behavior prediction**: Betting ~unchanged (still ~70% heads).  
  - **Roll die** → resolve bets.  
  - **Debrief point**: Calibration data is **admissible**—it reinforces, not overrides, the chance.  

  #### **4. Round 3: Outcome Knowledge (15 mins)**  
  - **Step 1**: Roll die in secret, record result (e.g., heads).  
  - **Info given**: "The die is already rolled. Result hidden."  
  - **Task**: Students bet on outcome.  
  - **Step 2**: Reveal result (e.g., heads).  
  - **Task**: Students bet again on the **same outcome**.  
  - **Behavior prediction**:  
    - **Pre-reveal**: ~70% bet on heads (still deferring to chance).  
    - **Post-reveal**: 100% bet on the known result (e.g., heads).  
  - **Roll replay** → resolve bets (only post-reveal bets count).  

  #### **5. Round 4: Predictor Report (20 mins)**  
  - **Setup**: Roll die in secret → generate predictor report:  
    - If actual = heads, predictor says heads ⇐ roll 1–8 (else tails).  
    - If actual = tails, predictor says tails ⇐ roll 1–8 (else heads).  
  - **Info given**: "A predictor with 80% accuracy reports: [e.g., 'heads']."  
  - **Task**: Bet on outcome.  
  - **Behavior prediction**:  
    - If predictor says heads: ~90% bet on heads (Bayesian update: 0.7→0.903).  
    - If predictor says tails: ~30% bet on heads (update: 0.7→0.097).  
  - **Reveal actual outcome** → resolve bets.  

  #### **6. Scoring & Debrief (10 mins)**  
  - Tally points. Discuss:  
    - **Round 1–2**: Bets clustered near 70%? (Principle: chance guides credence with no inadmissible info.)  
    - **Round 3 (pre-reveal)**: Still 70%? (Admissibility: outcome knowledge not yet present.)  
    - **Round 3 (post-reveal)**: Shift to 0%/100%? (Outcome knowledge is **inadmissible**—deference stops.)  
    - **Round 4**: Shift to ~90%/10%? (Predictor report is **inadmissible**; it screens off the chance.)  
  - **Key takeaway**:  
    > "The Principal Principle says: *Credence = Chance*—**unless** you have information the chance didn’t account for (inadmissible evidence). Outcome knowledge and predictor reports are inadmissible; calibration data is admissible."  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **Problem**: Students ignore chance in Round 1 (e.g., bet 50:50).  
     - **Why**: Misunderstanding "70% chance" as abstract, not actionable.  
     - **Fix**: Pre-game drill—ask for expected heads in 10 rolls (reinforce 7/10).  

  2. **Problem**: Round 4 bets don’t shift (e.g., still 70% after predictor report).  
     - **Why**: Misjudging the predictor’s reliability.  
     - **Fix**: Simplify math—"Predictor says heads? Then it’s 80% of the 70% world!" Show Bayes’ table.  

  3. **Problem**: Betting stalls due to risk aversion.  
     - **Why**: Low stakes still trigger caution.  
     - **Fix**: Allow "no bet" (but most will bet; 3:1 payout favors action).  

  ---

  ### **Limitations of the Activity**  
  - **Cannot reproduce undermining futures**:  
    The Principal Principle excludes evidence that *undermines the chance itself* (e.g., "this die’s bias is caused by a quantum event that also affects your brain"). This requires hypotheticals (e.g., "suppose the chance setup self-destructs if heads") and must be **supplied by lecture**.  
  - **Why omitted**: Undermining is metaphysical and intractable in a physical game. Focus on tangible inadmissibility (outcomes/predictions).  

  ---

  ### **What Would Change My Mind**  
  1. **Behavioral red flag**:  
     - **If** >50% of students **bet against chance in Round 1–2** (e.g., bet tails at 0.7 chance), the game fails to instill deference.  
     - **Redesign**: Replace betting with a **prediction market** (students trade shares of "heads" at prices revealing group credence).  

  2. **Objection to setup**:  
     - "The predictor’s report is **admissible**—it’s generated from the same chance mechanism!"  
     - **Rebuttal/Redesign**:  
       - If pressed, reframe the predictor as "independent oracle" (e.g., a laser scanner).  
       - Or, **simulate non-chance predictors**: Use historical weather data to predict die rolls (decouple from the chance setup).  

  3. **Where reasoning may fail**:  
     Assuming students intuitively grasp that calibration data (Round 2) is admissible. If they **over-update** (e.g., bet 71% on heads), the lesson conflates calibration with inadmissibility.  
     - **Mitigation**: Explicitly contrast Round 2 (admissible) with Rounds 3–4 (inadmissible) in debrief.  

  ---

  ### **Instructor Notes**  
  - **Emphasize behavior**: "Your bets *reveal* your credence. We’ll see when you defy the 70%!"  
  - **Time saver**: Pre-roll Round 3–4 dice/predictions to avoid delays.  
  - **Post-game**: Assign a reflection—"When did you *stop* deferring to 70%? Why?"  

  This design forces students to *live* the admissibility distinction—updating on evidence while wrestling with when chance "drops out" as a guide. The shift from rigid deference (Rounds 1–2) to defiance (Rounds 3–4) makes the Principal Principle’s limits visceral.
