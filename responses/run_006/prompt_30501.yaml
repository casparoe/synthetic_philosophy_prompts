                    We have a predictor that we trust to be 80% accurate. We ask the predictor to predict the next flip. We simulate the predictor: 
                        We roll a 10-sided die: 
                           If the die is 1-8, the predictor will report the correct outcome (but we haven't flipped yet).
                           But we don't know the outcome. We can't do that.

              How to simulate the predictor for a future flip? We can do:

                  We have two dice: one for the predictor's accuracy and one for the flip.

                  Step 1: Roll a die for the predictor's correctness: 
                      Roll a 10-sided die: 1-8 -> predictor will be correct, 9-10 -> incorrect.

                  Step 2: Flip the coin (roll the other die). Then, if the predictor is to be correct, we set the predictor's report to match the outcome. If incorrect, we set it to the opposite.

              But then we are doing the flip in class? And the predictor's report depends on the flip? But we do the flip after we get the predictor's report? That's not possible.

              Alternatively, we can do the flip and the predictor's report simultaneously in a way that respects the 80% accuracy? We can generate both at the same time with two dice.

              We can use a single die for the flip and one for the predictor:

                  Flip die: 1-7 heads, 8-10 tails -> outcome.
                  Predictor die: 1-8 -> use the outcome we just got? But that would require knowing the outcome. We want to show the predictor's report before the flip.

              We must fix: The predictor is making a prediction before the flip. We can simulate by:

                  Roll the predictor's report first: 
                     We roll a 10-sided die for the predictor: 
                        Let 1-7 be heads, 8-10 be tails? But that would be 70% heads, which is not 80% accurate.

              Instead, we can use a two-step without the outcome:

                  First, we decide if the predictor is correct or not: 
                     Roll a 10-sided die: 1-8 -> correct, 9-10 -> incorrect.
                  Then, we roll another die to determine the predictor's report: 
                     For the report: 1-7 heads, 8-10 tails? But then the report has a 70% chance of heads? That's not right.

              How about we make the predictor's report have the same marginal as the chance? We don't have to. We just care about the conditional probability.

              We want: P(predictor says heads | heads) = 0.8, not P(predictor says heads).

              We can do:

                  We will generate the predictor's report and then the outcome in a dependent way.

                  But we want to do the predictor's report first.

                  Pre-generation for Round3 (before class):

                    We generate a predictor report and an outcome that are 80% correlated. We can do:

                       Choose the predictor's report by a die roll: 
                           Roll a 10-sided die: 1-7 -> predictor says heads, 8-10 -> predictor says tails. (This gives 70% heads report, but we don't care about the marginal.)

                       Then, if the predictor says heads, then we set the outcome to heads with 0.8 and tails with 0.2? But how? We roll another die: if 1-8 then heads, 9-10 then tails.

                       But then the chance of heads is not 0.7? It becomes:

                           P(heads) = P(heads | pred heads)*P(pred heads) + P(heads | pred tails)*P(pred tails)
                                    = 0.8 * 0.7 + 0.2 * 0.3 = 0.56 + 0.06 = 0.62

                       That's not 0.7.

              How to maintain the chance of heads at 0.7 and also have the predictor 80% accurate?

                  We must have:

                    P(predictor correct) = 0.8.

                    Let H be heads, T tails. Let PH be predictor says heads, PT says tails.

                    We want:
                       P(H) = 0.7.
                       P(PH | H) = 0.8, P(PT | H)=0.2
                       P(PT | T)=0.8, P(PH | T)=0.2

                    Then the joint distribution:
                       P(H, PH) = 0.7 * 0.8 = 0.56
                       P(H, PT) = 0.7 * 0.2 = 0.14
                       P(T, PH) = 0.3 * 0.2 = 0.06
                       P(T, PT) = 0.3 * 0.8 = 0.24

                    Now, the marginal for PH = 0.56+0.06=0.62.

                    So if we generate the predictor's report first, we can't have it be 70% heads.

              In class, we can do:

                    We want to show the predictor's report for a future flip. We announce the predictor's report. Then we flip the coin. We want the coin to have a 0.7 chance and the predictor to be 80% accurate.

                    To do this, we pre-generate the pair (predictor's report, outcome) from the joint distribution above. We can use a table:

                       We have 100 possibilities. We assign:
                          56 to (PH, H)
                          14 to (PT, H)
                           6 to (PH, T)
                          24 to (PT, T)

                    Then we draw one at random before class.

                    In class, we reveal the predictor's report (but not the outcome) and then later reveal the outcome.

              This is complex. Given time, we might stick to the original design (where the flip for Round3 is done in advance) and explain that the event has already occurred but we are uncertain. The chance of 0.7 refers to the propensity at the time of the flip. The predictor's report is additional evidence about the outcome that we are using to reduce our uncertainty.

          Given the time constraints, I think it's acceptable to have the flip in advance for Round3. We can explain that the chance was fixed at the time of the flip, and now we are gathering evidence about what the outcome was.

          This might be a bit of a fudge, but it avoids the complication of generating a future event with a predictor.

     Conclusion:

     We'll go with the original plan for Round3 (pre-flipped coin with a predictor report).

     We must be clear in the debrief that the Principal Principle is typically about future events, but the same idea applies to past events with unknown outcomes: the chance at the time of the event should guide your initial credence, and then you update on additional evidence.

     This activity will show that rational credence sometimes departs from the chance when additional evidence is available, and that the Principal Principle is not violated because of the admissibility clause.

     Final timeline and materials:

     Materials: 
       - A 10-sided die (or two if needed) 
       - Paper and pens for students to write their reports.

     Before class:
       - Flip for Round3: 
             Roll a 10-sided die: 1-7 heads, 8-10 tails. Record the outcome (say, H3).
       - Then generate the predictor's report for Round3:
             Roll another 10-sided die: 
                 If H3: then 1-8 -> predictor says heads, 9-10 -> tails.
                 If T3: then 1-8 -> predictor says tails, 9-10 -> heads.
             Record the predictor's report (say, PR3).

     In class:

       0-5 min: 
          Explain the coin: 70% chance of heads (using a 10-sided die: 1-7 heads, 8-10 tails).
          Explain the three rounds and the quadratic scoring rule.

       5-20 min: Round1.
          Roll the die for flip1. Do not reveal. Let this be C1.
          Students write on a slip: "Round1: [their name] q1 = [number between 0 and 1]"
          Collect.

       20-35 min: Round2.
          Roll the die for flip2. Reveal the outcome immediately (call it C2).
          Students write: "Round2: [name] q2 = [number]"
          Collect.

       35-55 min: Round3.
          Announce: "For the third flip, we flipped before class. The predictor, which is 80% accurate, reported: [PR3]."
          Students write: "Round3: [name] q3 = [number]"
          Collect.

       55-65 min: Reveal and score.
          Reveal C1 and C3 (which is H3 from before class).
          Students calculate their scores.

          We can have a sample calculation on the board.

       65-75 min: Debrief.
          We compute the average of q1, q2, and q3 (by hand quickly? or we can do it after class and report next time).
          Discuss the pattern and the Principal Principle.

     This should fit in 75 minutes.

     What if the predictor in Round3 is not 80% accurate in the actual draw? For example, if the predictor was wrong, then the students who updated might have a lower score? That's okay, because the activity is about their credence at the time. The scoring rule will reflect that if the predictor was wrong and they updated to 0.9, then if the outcome is tails, they lose points. But that's the risk of updating on evidence.

     We can also note in the debrief that the predictor is not perfect.

     I think this design will work.
