prompt: |-
  I teach an upper-level undergraduate seminar called "Rationality and Its Failures" — about 20 students, mostly philosophy and economics majors, meeting for 75 minutes. We're about to start a unit on escalation of commitment and the sunk cost fallacy, and I want an activity that makes them feel the trap in their bones before we analyze it in the abstract. I'm thinking of running a version of the dollar auction, but I have constraints: I can't use real money (university rules), and I don't want anyone to walk away feeling actually harmed or humiliated. I also want the debrief to connect what happened in the game to real-world cases — military interventions, failing software projects, toxic relationships — not just to the formal game theory. The goal is for students to leave seeing that escalation of commitment is not simply a mistake made by irrational people, but a predicament that can trap perfectly reasonable agents who are trying to cut their losses.

  Design the activity for me. I need: the exact rules, including how bidding works, what the payoff structure is, and what the "currency" is if not real money; materials I'll need to prepare; a timeline for the 75 minutes (setup, play, and debrief, with approximate durations); and a debrief plan that maps specific moments in the game onto the theoretical concepts — sunk cost, the point of no return, the divergence between the rational choice at each step and the escalatory outcome, and the role of face-saving and commitment. Also tell me what will predictably go wrong the first time I run it — e.g., students who know the paradox refusing to bid, students colluding, or the auction not escalating far enough — and how I should handle each. Be honest about which features of real-world escalation the activity cannot reproduce and that I'll need to supply in the discussion afterward. Finally, in your response, please separate what is settled and widely agreed upon among people who study escalation of commitment from what is genuinely contested or still open, and don't present a contested view as the consensus. End with a one-sentence summary of the activity as the last line of your answer.
