prompt: |-
  Act as a professional epistemologist who works on the structure of justification. I keep noticing a pattern in arguments about whether we can trust a faculty or an instrument, and I don't have a word for it. Someone wants to check whether their color vision is reliable, so they look at a set of colored chips and see whether the color they seem to see matches the label printed on each chip — but they used the same color vision to read the labels. Another case: someone tests a scale by weighing objects whose weights are already 'known,' but those weights were themselves measured on that same scale, and the agreement is taken as evidence the scale is fine. Or someone reasons, 'The table looks red, so my visual system is working properly.' These moves feel too cheap, but they aren't exactly circular in the textbook sense, since the person is gathering evidence rather than just assuming the conclusion. Does this pattern have an established name? Wether or not it does, I want more than a label: I want the precise diagnosis. What makes this different from ordinary circular reasoning, is it always a mistake or only under some conditions, and where exactly is the line between a legitimate check and this kind of move? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question. In the reasoning, briefly consider a few candidate concepts and say why each fits or doesn't. Use American English.
reasoning: |-
  Okay, the user is asking about a specific pattern in arguments where someone tries to verify a faculty or instrument using the very thing they're checking. They give examples like using color vision to check color vision labels, or a scale to verify weights it previously measured. They want to know if there's a name for this, the precise diagnosis, how it differs from circular reasoning, and when it's legitimate versus mistaken. 

  Hmm, this is a nuanced epistemological question. The user seems to be a professional or advanced student in philosophy given their precise examples and request for "more than a label." They're frustrated by recognizing this pattern but lacking terminology, and want deep analysis. 

  First, I need to identify why this isn't textbook circularity. Textbook circularity (like "A because B, B because A") is blatant, while here there's apparent evidence-gathering (comparing chip/label, weighing objects). The problem is contamination - the "evidence" depends on the very faculty/instrument being tested. 

  Candidate concepts coming to mind: 
  - Epistemic circularity: Fits perfectly because the justification loop involves the faculty itself. Unlike logical circularity, it's about sources rather than propositions. 
  - Bootstrapping: Close but focuses on overconfirming reliability through arbitrary correlations. Not quite the same. 
  - Self-support: Too vague - could include legitimate cases like memory checks. 
  - Coherentism: Explains why it sometimes works systematically but doesn't address the core flaw. 

  The key diagnosis is that such checks lack independent calibration. Legitimate verification requires an external standard (e.g., testing vision with color-blindness tests, calibrating scales with certified weights). When the "known" data comes from the same source, disagreement would reveal unreliability but agreement proves nothing new. 

  I'll structure the response with the bottom line first ("epistemic circularity"), then unpack why it's distinct from logical circularity, borderline cases, and the independence principle. The user wants precision, so I'll emphasize that the move is only valid when the comparison point has prior justification untied to the faculty/instrument in question.
answer: |-
  **Bottom line:** This pattern is best diagnosed as *epistemic circularity*, where the justification for trusting a cognitive faculty or instrument relies on outputs produced by that very faculty or instrument, undermining the attempt at independent verification.

  **Reasoning:**

  1.  **Textbook Circular Reasoning (Petitio Principii):** This involves directly assuming the conclusion as a premise within a single argument (e.g., "God exists because the Bible says so, and the Bible is true because God inspired it"). Your examples differ: they involve an *empirical procedure* (looking, weighing, reasoning) that *generates seeming evidence* (matches, known weights, perceptual coherence). The circularity isn't in the explicit logical structure of a single inference, but in the *source dependence* of the purported evidence.

  2.  **Epistemic Circularity:** This concept precisely captures the issue. The justification for the reliability of a *source* (vision, scale, reason) depends on information *derived from that same source*. To accept the evidence (chip labels, "known" weights, the table's redness) as trustworthy *for the purpose of evaluating the source* presupposes the reliability of the source you're trying to test. The procedure generates a *self-consistent story* but fails to provide *independent calibration*. Agreement (matches, expected weights, perceptual coherence) is consistent with both reliability *and* a systematic error undetectable by this method. Disagreement *would* indicate unreliability, but agreement is evidentially weak.

  3.  **Bootstrapping:** This is closely related but often emphasizes generating justification for a belief (e.g., "My gas gauge is reliable because it reads 'F' and the tank is full") where the belief about the tank being full depends on the gauge. Your examples are structurally similar but focus specifically on *testing the reliability of the instrument/faculty itself* using its own outputs as the standard. Bootstrapping is often seen as a *consequence* or *manifestation* of epistemic circularity in specific contexts.

  4.  **Self-Support:** This is too broad. Legitimate self-support occurs when a faculty provides evidence for its *own current operation* in a way that doesn't presuppose its *general reliability* (e.g., using clear memory of breakfast to confirm you *are* remembering *now*, without claiming this proves memory is *always* reliable). Your examples aim to establish *general reliability*, making the self-support viciously circular.

  5.  **Coherentism:** While coherentism is a theory of justification where beliefs mutually support each other within a web, the problem in your examples isn't coherence *per se*. The issue is the *lack of external input or independent constraint*. A purely coherentist system *could* theoretically justify these moves internally, but most epistemologists find this insufficient for grounding the reliability of basic faculties against skeptical challenges. The procedure provides only internal coherence, not connection to an external world in a verifiable way.

  **Diagnosis & The Line:** Epistemic circularity is a mistake when the *sole or primary* justification for trusting a fundamental cognitive faculty or instrument relies on outputs from that faculty/instrument *without independent validation*. The move is illegitimate for establishing *initial* reliability or ruling out *systemic* error. The line between a legitimate check and this move lies in **independent calibration**:

  *   **Legitimate Check:** Uses a *separately justified* standard or method known to be reliable *independently* of the faculty/instrument being tested. (Testing color vision with Ishihara plates designed based on color science verified by non-visual means; calibrating a scale against certified weights measured by a different, trusted standard; inferring vision is working *now* because multiple senses agree *and* prior independent calibration of senses exists).
  *   **Illegitimate Move (Epistemic Circularity):** Uses the *outputs* of the faculty/instrument itself, or sources *dependent* on it, as the standard for verifying its reliability. The agreement observed is trivial or question-begging because the "evidence" is contaminated by the very thing being tested.
