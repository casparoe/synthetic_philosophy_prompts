prompt: |-
  I keep flip-flopping between feeling theories, judgment theories, and perceptual theories of emotion, and I've realized the actual problem is that I don't have a spec for what any theory of emotion has to do before I can even compare them. So: write me the desiderata. What would a theory of emotion have to get right to count as adequate — say, adequate for a cognitive science of emotion, not just for tidying up our concepts? Give me the requirements list, with the case or consideration behind each one. I mean things like: recalcitrant emotions (fear of flying while you judge it safe), the difference between an emotion episode and a mood and a standing trait, grief that's about a loss rather than just caused by it, emotions in infants and nonhuman animals, the fact that fear and excitement share a lot of bodily stuff but aren't the same. But dont just use my cases — the point is the full list, including whatever I'm missing. For each requirement say whether it's non-negotiable or just a camp preference, flag any pairs you think cant be jointly satisfied, and tell me which single requirement does the most to knock out the popular theories. Then, briefly, how feeling theories, judgment theories, and perceptual theories each do against the list. Keep the scorecard short; the criteria are what I actually want.
reasoning: |-
  Okay, the user is struggling with different theories of emotion—feeling, judgment, and perceptual—and realizes they need a clear set of criteria to evaluate them. They want a comprehensive list of desiderata for a cognitive science of emotion, not just philosophical tidiness. 

  First, I need to unpack their examples: recalcitrant emotions (like fear of flying despite knowing it's safe), emotion-mood-trait distinctions, intentionality (grief about a loss vs. caused by it), animal/infant emotions, and the fear-excitement bodily similarity puzzle. These are solid starting points, but the user explicitly wants me to expand beyond them. 

  Hmm, what else is critical? From cognitive science, I should include: computational tractability (how brains could implement this), development/evolution, cross-cultural variation, regulation mechanisms, and emotions' functional roles (like preparing action or social signaling). The user mentioned "adequate for cognitive science," so I can't skip neural plausibility or measurable components. 

  The non-negotiables seem obvious: intentionality (emotions are about something) and recalcitrance (they defy judgments). Without those, any theory collapses instantly. Functional coherence is probably non-negotiable too—emotions must do something evolutionarily useful. 

  Ah, and the biggest theory-killer? Likely recalcitrance. Judgment theories implode here because they tie emotion to belief. Perceptual theories struggle less but still need finesse. Feeling theories just ignore the problem entirely. 

  For the scorecard: Feeling theories bomb on intentionality and recalcitrance but ace phenomenology. Judgment theories are strong on intentionality but fail recalcitrance and animal emotions. Perceptual theories are middle-of-the-road but get messy with moods/traits. 

  User’s depth is impressive—they’re not just comparing theories but meta-cognizing about evaluation criteria. They might be building a framework for research or a paper. The request for "what knocks out popular theories" suggests they want to identify the strongest contender. I’ll emphasize recalcitrance as the critical flaw since it’s a frequent critique in literature. 

  Also noting unspoken needs: they probably want clarity on where each theory fails so they can stop flip-flopping. The desiderata list should act as a decision tree. And "camp preference" flags imply they dislike ideological debates—so I’ll mark which criteria are substantive versus theoretical taste.
answer: |-
  Here's a rigorous set of desiderata for a cognitive science theory of emotion, designed to be both comprehensive and evaluative. I've categorized them by core function, flagged criticality, and noted key tensions.

  **Core Desiderata for a Cognitive Science Theory of Emotion (Non-Negotiables Bolded):**

  1.  **Intentionality/Aboutness:**
      *   **What it must do:** Explain how emotions are *about* specific objects/states of affairs (e.g., fear *of* the dog, grief *about* the loss).
      *   **Case:** Distinguishing sadness *caused by* rain (mere affect) from sadness *about* a cancelled picnic (genuine emotion). Grief's directedness.
      *   **Criticality:** **Non-negotiable.** Without intentionality, emotion reduces to undifferentiated feeling or arousal.
      *   **Theory Killer:** Knocks out basic Feeling Theories that focus solely on bodily states without representational content.

  2.  **Recalcitrance:**
      *   **What it must do:** Explain how emotions can persist despite contradictory, consciously held judgments/beliefs (e.g., fear of flying while judging it statistically safe, phobias).
      *   **Case:** Fear of flying despite safety statistics; jealousy persisting despite trust.
      *   **Criticality:** **Non-negotiable.** A core challenge any theory *must* address.
      *   **Theory Killer:** Devastating for pure Judgment Theories (if emotion *is* judgment, contradiction shouldn't persist). Major challenge.

  3.  **Component Integration:**
      *   **What it must do:** Account for the interplay and potential dissociation between physiological changes (bodily arousal), subjective feelings (phenomenology), expressive behaviors (facial/vocal), cognitive appraisals, and action tendencies.
      *   **Case:** Fear and excitement sharing similar physiology but differing phenomenology & behavior; blunted affect in depression (feeling absent despite context); facial expressions without feeling.
      *   **Criticality:** **Non-negotiable.** Cognitive science demands explanation of multi-component processes.
      *   **Theory Killer:** Knocks out theories that reduce emotion to *only* one component (e.g., Feeling-only, Judgment-only).

  4.  **Functional Coherence:**
      *   **What it must do:** Explain the adaptive function(s) of emotions - how they prepare for action, signal internal state/social intent, prioritize goals, facilitate learning, enhance memory, regulate social interactions.
      *   **Case:** Anger preparing for confrontation; embarrassment signaling appeasement; disgust promoting avoidance of contaminants; sadness signaling need for support.
      *   **Criticality:** **Non-negotiable.** Essential for an evolutionary/cognitive science perspective.
      *   **Theory Killer:** Weakens theories that treat emotion solely as epiphenomenal or purely disruptive.

  5.  **Developmental & Phylogenetic Continuity:**
      *   **What it must do:** Account for emotions in pre-linguistic infants and non-human animals, which lack complex propositional judgments but display clear emotional responses (fear, joy, anger, distress).
      *   **Case:** Infant stranger anxiety; primate displays of fear or affiliation; rat models of anxiety.
      *   **Criticality:** **Non-negotiable.** A scientific theory must explain the biological roots of emotion.
      *   **Theory Killer:** Devastating for Judgment Theories requiring complex propositional attitudes. Major challenge for some Perceptual Theories if perception requires sophisticated concepts.

  6.  **Differentiation:**
      *   **What it must do:** Explain how distinct emotions (fear vs. anger vs. joy) are elicited, experienced, and function differently, despite potential overlap in components (e.g., fear and excitement sharing arousal).
      *   **Case:** Distinguishing fear (urge to flee) from anger (urge to attack) despite potential physiological similarity. Fear vs. excitement phenomenology.
      *   **Criticality:** **Non-negotiable.** Must explain the taxonomy of emotion.
      *   **Theory Killer:** Knocks out overly simplistic theories (e.g., pure arousal theories).

  **Important, But Potentially Negotiable/Contested Desiderata:**

  7.  **Temporal Dynamics & Regulation:**
      *   **What it must do:** Explain how emotions unfold over time (onset, peak, decay), how they can be regulated (e.g., reappraisal, suppression), and how regulation impacts components.
      *   **Case:** Gradual build-up of anger; effortful calming of anxiety; effects of suppression on physiology vs. expression.
      *   **Criticality:** High, but mechanisms might vary. **Borderline Non-negotiable** for a complete science.
      *   **Potential Tension:** With speed/automaticity requirements.

  8.  **Speed & Automaticity:**
      *   **What it must do:** Account for rapid, automatic emotional responses that precede (or occur without) deliberate, conscious reasoning.
      *   **Case:** Startle reflex; immediate disgust reaction; gut feelings.
      *   **Criticality:** High. Core aspect of many emotional responses.
      *   **Potential Tension:** With theories requiring complex cognitive judgments. **Tension with 7:** Fast onset vs. slower regulation.

  9.  **Distinguishing Emotion, Mood, Trait:**
      *   **What it must do:** Explain the difference between brief, object-directed *emotion episodes*, longer-lasting, diffuse *moods* (e.g., irritability), and stable emotional *traits* (e.g., trait anxiety).
      *   **Case:** Sadness (emotion) vs. depression (mood/trait); brief frustration vs. irritable mood.
      *   **Criticality:** High. Essential for clinical/differential understanding.
      *   **Challenge:** Requires explaining differences in intentionality, duration, and cause.

  10. **Cultural & Individual Variation:**
      *   **What it must do:** Account for how the elicitation, expression, experience, and regulation of emotions vary across cultures and individuals without positing entirely different mechanisms.
      *   **Case:** Display rules (suppressing anger in some cultures); variations in emotion concepts; differences in baseline physiological reactivity.
      *   **Criticality:** High for a general science.
      *   **Camp Preference:** The *degree* of universality vs. construction is a major debate.

  11. **Neural Plausibility:**
      *   **What it must do:** Be compatible with known neuroscience of emotion (e.g., amygdala role in fear, prefrontal cortex in regulation, insula in interoception).
      *   **Case:** Lesion studies (e.g., impaired fear conditioning); neuroimaging studies.
      *   **Criticality:** Increasingly **Non-negotiable** for cognitive science.
      *   **Camp Preference:** Level of reductionism varies.

  **The Single Biggest Theory-Knocker:** **Recalcitrance (Desideratum 2).** It directly and fatally undermines pure Judgment Theories and poses a significant, often inadequately addressed, challenge for Perceptual and Feeling Theories.

  **Brief Scorecard:**

  *   **Feeling Theories (James-Lange, etc.):**
      *   **Aces:** 3 (Physiology/Feeling link - though oversimplified), 6 (Phenomenology), 8 (Speed).
      *   **Fails:** **1 (Intentionality)**, **2 (Recalcitrance - often ignores cognition)**, **5 (Animals/Infants - ok, but intentionality weak)**, 7 (Regulation), 9 (Mood/Trait), 11 (Often ignores appraisal/neural complexity).
      *   **Summary:** Strong on phenomenology/physiology link, fatally weak on intentionality & recalcitrance.

  *   **Judgment Theories (Solomon, Nussbaum - Cognitive Appraisal Core):**
      *   **Aces:** 1 (Intentionality), 4 (Function via appraisal), 10 (Culturally embedded judgments).
      *   **Fails:** **2 (Recalcitrance - core failure)**, **5 (Animals/Infants)**, 6 (Differentiation - judgments might be too similar), **8 (Speed - too slow/cognitive)**.
      *   **Summary:** Strong on intentionality & function, fatally weak on recalcitrance & animal/infant emotions.

  *   **Perceptual Theories (Prinz, De Sousa - Emotions as perceptions of value/bodily state):**
      *   **Aces:** 1 (Intentionality - perception *of* something), 2 (Recalcitrance - can be non-conceptual/impressionistic, like illusions), 5 (Animals/Infants - perception is basic), 8 (Speed - fast perception).
      *   **Challenges:** 3 (Integration - how tightly linked?), 4 (Function - needs elaboration), 6 (Differentiation - how fine-grained is value perception?), 7 (Regulation - how?), 9 (Moods/Traits - diffuse perception?), 10 (Cultural variation in value perception?).
      *   **Summary:** Best at handling intentionality *and* recalcitrance simultaneously, and continuity with animals. Struggles with differentiation, regulation, and explaining moods/traits clearly. The most promising but needs refinement.

  This list provides the critical yardstick. Perceptual theories currently handle the most non-negotiables, particularly the crucial recalcitrance-intentionality pair, but no theory perfectly satisfies all desiderata. The field actively grapples with these tensions.
