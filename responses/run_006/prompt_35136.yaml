prompt: |-
  I'm a software engineer, not a philosopher, and I keep running into the same kind of call: whether to spend time and engineering effort getting more information before we commit to something. A few times a month I'm weighing things like whether to instrument a feature for a week before deciding to kill it, whether to run another A/B test after an inconclusive one, or whether to add a bunch of analytics events before a launch just in case. The stakes are real: wasted engineering time, delayed launches, and sometimes shipping something we cant cleanly roll back. Nobody on my team has much stats background, and my EM and PM both have to sign off, so whatever I use has to fit in a one-pager and be runnable in under an hour.

  I keep seeing this result called Good's theorem, or the value of information, that free information can't hurt you in expectation. I want you to turn that into a decision procedure I can actually run, not the math. I care about partial, noisy information, not just perfect information. I want a checklist: the questions to ask in order, what counts as a good enough answer to each, where the procedure says stop and don't gather more data, and where it has to hand the decision to a person because it's a values call rather than a factual one. Then run the procedure on three decisions: (1) whether to spend a week instrumenting a feature before deciding whether to kill it or keep investing in it; (2) whether to run a second, bigger A/B test after the first one came back ambiguous; and (3) a PM wants to add a bunch of telemetry before a launch that's already locked in by a contract, on the grounds that more data can't hurt. Make sure the procedure gives an answer the team wont like in at least one of those, and tell me what the procedure can't do for me.

  Also, please separate what is settled here from what is genuinely contested among people who know this topic, and don't present a contested view as the consensus.
reasoning: |-
  We are going to create a practical decision procedure based on the concept of the value of information (VOI). The key idea is that information has value only if it changes the decision we would make. We must weigh the cost of gathering the information (including time, resources, and opportunity costs) against the expected benefit of making a better decision.

  The procedure will be structured as a checklist of questions. We assume that the team can provide rough estimates for probabilities and values, even without a stats background.

  ---

  **Decision Procedure: Should We Gather More Information?**

  1. **Define the Decision Without Additional Information:**
     - What are the available actions? (e.g., kill the feature now, keep it, or invest more without data)
     - Without more data, which action would we take? (This is the baseline action)
     - What is the expected value (EV) of that baseline action? (Estimate in any consistent unit, e.g., dollars, user satisfaction points, etc.)

  2. **Define the Possible Outcomes of Gathering Information:**
     - What specific information would we get? (e.g., a metric from instrumentation, the result of an A/B test)
     - What are the possible outcomes? (e.g., the metric is above/below a threshold, the A/B test shows a clear win/loss)
     - For each outcome, what action would we take? (This might be different from the baseline)

  3. **Estimate the Probabilities and Values:**
     - For each possible outcome of the information, estimate the probability of that outcome occurring. (Use historical data, expert opinion, or a best guess. It's okay to be rough.)
     - For each outcome and the action we'd take, estimate the expected value of that action given the outcome. Also, note the value of the baseline action (without the information) for comparison.

  4. **Calculate the Expected Value With Information (EVWI):**
     - For each outcome: (Probability of outcome) * (Value of best action given outcome)
     - Sum these to get the overall EVWI.

  5. **Calculate the Value of Information (VOI):**
     - VOI = EVWI - EV (baseline action without information)
     - This is the expected gain from having the information.

  6. **Compare VOI to the Cost of Gathering Information:**
     - What is the total cost of gathering the information? (Include engineering time, delay costs, opportunity costs, etc.)
     - If VOI > Cost: Then gathering the information is worthwhile in expectation.
     - If VOI <= Cost: Then it's not worth gathering.

  7. **Hand Off to Humans When:**
     - The decision involves values that cannot be quantified (e.g., ethical concerns, strategic positioning, brand image).
     - The estimates (probabilities, values, costs) are too uncertain and the stakes are high enough that we don't trust the rough numbers.

  ---

  **Key Notes:**
  - **Partial and Noisy Information:** The procedure handles this because we consider the probabilities of different outcomes and the actions we'd take in response. The information doesn't have to be perfect.
  - **Good's Theorem:** This procedure is an application of the value of information, which indeed says that free information (zero cost) can't hurt. But when information is costly, we must compare VOI to cost.
  - **What the Procedure Can't Do:** It can't make value judgments for you. It requires estimates, and if the estimates are way off, the conclusion may be wrong. It also doesn't account for risk aversion or non-linear utility (unless you build that into the value estimates). Moreover, it assumes that the information can be obtained and will be used rationally.

  ---

  **Contested vs. Settled:**
  - **Settled:** The theoretical foundation of VOI is well-established in decision theory. The formula for VOI is uncontroversial.
  - **Contested:** 
    - How to estimate probabilities and utilities in practice? Some advocate for structured techniques (e.g., calibrated probability assessment), while others rely on expert judgment.
    - How to account for the cost of delay? In fast-moving environments, the cost of delay might be modeled in various ways (e.g., discounting future cash flows, opportunity cost of not doing other work).
    - The treatment of ambiguity and deep uncertainty (where probabilities are hard to assign) is an active area of research (e.g., robust decision making, info-gap theory).

  ---

  **Applying the Procedure to Your Examples:**

  **Example 1: Instrumenting a feature for a week before deciding to kill it or keep investing.**

  1. **Baseline Decision:** Without instrumenting, we would kill the feature now because we are uncertain and don't want to invest more. The EV of killing is 0 (we avoid future costs but get no benefits). The EV of keeping is negative (we estimate a 60% chance of losing $50k due to wasted effort and 40% chance of gaining $100k, so EV = 0.4*100k - 0.6*50k = $10k). Wait, if we are going to kill without data, then baseline action is kill (EV=0). But if without data we would keep, then baseline EV is $10k? Let me clarify: Without data, we are leaning toward kill because we are risk averse? We need to decide what we would do without the data.

     Let's assume without data we would kill it (because we are unsure and the downside is big). So baseline action: kill, EV=0.

  2. **Information Gathering:** Instrument for a week to get usage data. We define a threshold: if the usage metric is above X, we keep; below, we kill.

  3. **Possible Outcomes:**
     - Outcome A: High usage (say 30% chance). We then decide to keep and invest. EV given high usage: $80k (because with high usage, the chance of success is higher, say 80% chance of $100k and 20% chance of -$50k -> 0.8*100k - 0.2*50k = 70k? Let me adjust: we might have better estimates. Let's say with high usage, the project becomes 90% chance of $100k and 10% chance of -$50k -> 0.9*100k - 0.1*50k = $85k).
     - Outcome B: Low usage (70% chance). We kill. EV=0.

  4. **EVWI:** (0.3 * $85k) + (0.7 * $0) = $25.5k.

  5. **VOI:** EVWI - EV(baseline) = $25.5k - $0 = $25.5k.

  6. **Cost of Instrumentation:** Engineering time: 1 week of 2 engineers (say $10k). Delay cost: 1 week delay in launching other features, opportunity cost $5k. Total cost $15k.

  7. **Compare:** VOI ($25.5k) > Cost ($15k) -> Do instrument.

  **But what if the team would have kept it without data?** Then baseline EV is $10k. Then VOI = $25.5k - $10k = $15.5k. Still greater than cost? $15.5k > $15k? Barely. But if the numbers were a bit different, it might not be worth it.

  **Example 2: Run a second, bigger A/B test after an ambiguous first one.**

  1. **Baseline Decision:** Without more data, we would not launch the feature because the first test was ambiguous and we are risk averse. The EV of not launching is 0. The EV of launching without more data: we estimate 50% chance of a $200k gain and 50% chance of a $100k loss -> EV = 0.5*200k - 0.5*100k = $50k? Wait, that's positive. Why wouldn't we launch? Maybe because the first test was ambiguous and we fear the loss? Actually, without more data, we might be forced to make a decision. Let's say without more data, we wouldn't launch because of the risk of loss (even though the EV is positive, we are risk averse). So baseline action: don't launch, EV=0.

     Alternatively, if the team is risk neutral and the EV is positive, they would launch. Then baseline EV is $50k.

     Let me assume without data we wouldn't launch because of the ambiguity and risk. So baseline: don't launch, EV=0.

  2. **Information Gathering:** Run a second, bigger A/B test (cost: $20k and 2 weeks delay). The test can give:
     - Clear positive (30% chance): then we launch, EV = $200k (because we are confident) -> but actually, even with a positive test, there's some risk. Let's say we then estimate 90% chance of $200k and 10% chance of -$100k -> EV=0.9*200k - 0.1*100k = $170k.
     - Clear negative (50% chance): we don't launch, EV=0.
     - Still ambiguous (20% chance): then we fall back to baseline (don't launch), EV=0.

  3. **EVWI:** (0.3 * $170k) + (0.5 * $0) + (0.2 * $0) = $51k.

  4. **VOI:** $51k - $0 = $51k.

  5. **Cost:** $20k (direct) + $30k (opportunity cost of 2 weeks) = $50k.

  6. **Compare:** VOI ($51k) > Cost ($50k) -> Barely worth it. But note: the numbers are tight. If the cost were $52k, we wouldn't do it.

  **But if without data we would have launched (EV=$50k), then VOI = $51k - $50k = $1k, which is less than $50k cost. Then we wouldn't run the test.**

  **Example 3: PM wants to add telemetry before a launch (already locked by contract).**

  - The argument: "more data can't hurt". But it does have a cost.

  1. **Baseline Decision:** We are going to launch anyway (contract). Without telemetry, we launch and get some value. But we might have to change things later without data? Let's think: the telemetry is for future use, not for deciding on this launch. So the baseline action is launch without telemetry. The value is the same as launching with telemetry? Not exactly: without telemetry, we might have a harder time debugging or iterating later.

     However, the telemetry might help in future iterations. So the value of launching without telemetry is the immediate value (say $100k) minus the expected loss from not having data for future improvements (say we estimate that without telemetry, we might leave $20k on the table in the future). So baseline EV = $100k - $20k = $80k.

     With telemetry, we get the immediate value plus we avoid that future loss (but we incur the cost of adding telemetry). However, we are adding telemetry before launch, so it doesn't delay the launch? But it does take engineering time.

     Actually, the telemetry is being added before launch, so it might delay the launch? If it doesn't delay, then the only cost is engineering time.

     Let me assume the contract requires launch by a fixed date. Adding telemetry would require overtime or cutting other features? Or it might risk the launch. We'll assume it doesn't delay the launch because the team works overtime (at a cost).

  2. **Information Gathering:** We are adding telemetry that will give us data after launch. The data will help in future iterations. We estimate that having the telemetry will increase the future value by $30k (because we can iterate better). But the cost of adding telemetry now is $10k (overtime).

     So the action with telemetry: we launch with telemetry. The value is the immediate value ($100k) plus the improved future value ($30k) minus the cost ($10k) = $120k.

     Without telemetry: $80k (as above).

     But note: without telemetry, we are not spending the $10k. So baseline is $80k, and with telemetry we get $120k? Then we would definitely add telemetry. But wait, the baseline without telemetry is $80k, and the alternative with telemetry is $120k? Then the VOI of the telemetry is not being used to change a decision? It's just that we are building it and then using it later.

     Actually, the telemetry is not providing information for a current decision. It's for future decisions. So we are not using the VOI framework for a current decision. Instead, we are evaluating an investment (telemetry) that will improve future decisions.

     We can reframe: the telemetry has a cost now and a benefit in the future. The benefit is the value of the information it will provide for future decisions (which we can compute using VOI for each future decision). But that might be too complex.

     Alternatively, we can think: without telemetry, we will make future decisions blindly, which we estimate to be worth $X. With telemetry, we can make better future decisions, worth $Y. The difference is the value of having the telemetry. Then we compare that to the cost.

     In this case:
     - Future value without telemetry: $F1
     - Future value with telemetry: $F2
     - Value of telemetry = F2 - F1 (the increase in future value)
     - Cost of telemetry = $C
     - If (F2 - F1) > C, then add telemetry.

     Let's say F1 = $0 (we can't iterate without data) and F2 = $30k (we can). Then value of telemetry = $30k. Cost = $10k. So we do it.

     But what if the contract is fixed? We are launching anyway, and the telemetry doesn't change the current launch. So it's an investment in future flexibility.

     However, note the PM's argument: "more data can't hurt". But if the cost is positive, then it can hurt if the benefit doesn't cover the cost.

     **Application:**
     - We estimate the benefit of the telemetry (the value of the information it will provide in future decisions) as $30k.
     - The cost is $10k.
     - Since $30k > $10k, we add the telemetry.

     **But what if we don't have any specific future decisions in mind?** Then the benefit is speculative. We might assign a low value to F2-F1. If we can't quantify any future benefit, then the benefit is $0, and we shouldn't spend $10k.

     **The procedure says:** If you cannot identify specific future decisions that the telemetry will inform, and you cannot estimate the improvement in those decisions, then the VOI is $0. And if the cost is positive, then don't do it.

     **Result the team won't like:** We decide not to add the telemetry because the benefit is speculative and we can't quantify it. This might upset the PM who believes in data.

  ---

  **What the Procedure Can't Do For You:**
  - It can't create estimates from nothing. You have to provide probabilities and values. If the estimates are poor, the result will be poor.
  - It doesn't account for the value of learning for its own sake (if there is no specific decision in view).
  - It doesn't account for the cost of analysis paralysis (if gathering information becomes a habit that delays everything).
  - It doesn't account for strategic considerations (e.g., building a reputation for being data-driven might have long-term benefits).

  ---

  **Final Checklist Format:**

  **Checklist: Should We Gather More Information?**

  1. **What is the baseline decision and its expected value?**
     - Without more data, what would we do? (e.g., kill the feature, don't launch, launch without telemetry)
     - What is the expected value of that action? (Use rough estimates)

  2. **What information would we gather and what are the possible outcomes?**
     - Describe the information gathering activity.
     - List the possible outcomes (e.g., positive, negative, inconclusive) and assign rough probabilities.

  3. **What would we do in each outcome?**
     - For each outcome, state the decision we would make and the expected value of that decision.

  4. **What is the expected value with information (EVWI)?**
     - Multiply the value in each outcome by its probability and sum.

  5. **What is the value of information (VOI)?**
     - VOI = EVWI - Baseline EV

  6. **What is the total cost of gathering information?**
     - Include direct costs, engineering time, delay costs, opportunity costs.

  7. **Is VOI greater than the cost?**
     - Yes: Gather the information.
     - No: Stick with the baseline decision.

  8. **Human Judgment Needed:**
     - If the decision involves unquantifiable values (e.g., ethics, brand) or if the estimates are too uncertain and the stakes are high, then use human judgment.

  ---

  **Example 2 Revisited with Checklist (assuming without data we wouldn't launch):**

  1. Baseline: Don't launch, EV=0.
  2. Info: Run a second A/B test. Outcomes: 
     - Positive (30%): then launch -> EV=$170k
     - Negative (50%): don't launch -> EV=0
     - Ambiguous (20%): don't launch -> EV=0
  3. EVWI = 0.3*170k + 0.5*0 + 0.2*0 = 51k.
  4. VOI = 51k - 0 = 51k.
  5. Cost: 50k (20k direct + 30k opportunity).
  6. 51k > 50k -> Run the test.

  But note: if the cost were 52k, we wouldn't. And if without data we would have launched (EV=50k), then VOI=1k and we wouldn't run the test.

  **Example 3 with Checklist:**

  1. Baseline: Launch without telemetry. We estimate the future value without telemetry: $80k (which includes an expected loss of $20k due to lack of data for future iterations).
  2. Info: Actually, we are not gathering information for a current decision. We are adding telemetry for future use. So we reframe: the telemetry is an investment that will improve future decisions. We estimate the value of that improvement: $30k (so we avoid the $20k loss and gain an extra $10k? Or total future value with telemetry is $110k? Then the benefit is $30k). The cost is $10k.
  3. We are not using VOI in the same way. We are comparing the net benefit: Benefit - Cost = $30k - $10k = $20k > 0 -> Do it.

  But if we cannot estimate the benefit (it's speculative), then benefit=0, so net benefit = -$10k -> don't do it.

  This is the result the team won't like: if the benefit is speculative and unquantifiable, we skip it.

  **Important:** The procedure requires that the information is intended to inform a specific decision (current or future). If there's no specific decision, then the VOI is zero.
answer: |-
  ### Decision Procedure: Value of Information (VOI) Checklist for Engineers  
  **Based on Good's theorem (free information can't hurt) but adapted for real-world costs, partial data, and ambiguity.** This is a **practical, non-mathematical** procedure. It focuses on *actionable* information gathering when decisions have tradeoffs. Consensus exists on the core framework, but estimating probabilities/values is inherently subjective.

  ---

  #### **The Checklist: 8 Questions to Run in Under 1 Hour**  
  Ask these in order. Stop if any answer fails validation (✓) or triggers a "handoff" (❗).  
  **Output:** A clear "gather data" or "don't gather" recommendation.

  | # | Question | What to Answer | Validation (✓ = Proceed) | Handoff Condition (❗) |
  |---|----------|----------------|--------------------------|-----------------------|
  | **1** | **What’s the immediate decision if we get NO new data?** | State the action you’d take today (e.g., "kill feature," "launch as-is"). | ✓: Specific, time-bound action. | ❗: No consensus on baseline action. |
  | **2** | **What’s the estimated value of that baseline decision?** | Rough value (e.g., dollars, user satisfaction, risk reduction). Use ranges if needed (e.g., "$50K–$100K"). | ✓: Quantifiable unit agreed by team. | ❗: Values involve ethics/brand/legal (non-quantifiable). |
  | **3** | **What specific data would we gather? How noisy/partial is it?** | Define the metric(s), how you’ll measure, and potential error (e.g., "DAU uplift ±10%"). | ✓: Concrete, measurable, and bounded. | ❗: Data is purely exploratory (no decision link). |
  | **4** | **What are the possible outcomes of this data?** | List discrete scenarios (e.g., "metric > X," "metric < Y," "inconclusive"). Assign rough probabilities (must sum to 100%). | ✓: ≤5 outcomes; probabilities plausible. | ❗: Outcomes depend on unknown external factors. |
  | **5** | **What would we do in EACH outcome?** | For each outcome from Q4, state the action (e.g., "if >X, invest; if <Y, kill"). | ✓: Actions differ from baseline (Q1) in ≥1 outcome. | ❗: Data wouldn’t change any decision (all paths lead to same action). |
  | **6** | **What’s the value of those actions?** | For each outcome→action pair, estimate value (use same unit as Q2). | ✓: Values justified by past data/expertise. | ❗: Values require strategic bets (e.g., entering a new market). |
  | **7** | **What’s the cost of gathering data?** | Include: engineering time, delay costs, opportunity costs, tooling. Quantify (e.g., "$20K dev cost + $50K delay cost"). | ✓: All-inclusive cost. | ❗: Costs threaten contractual/financial viability. |
  | **8** | **Is Expected VOI > Cost?** | `VOI = [Σ (Prob_outcome × Value_action)] - Value_baseline`. Compare to cost (Q7). | ✓: VOI and cost use same units. | ❗: Uncertainty in estimates is too high (>50% variance). |

  **Final Decision Rules:**  
  - ✅ **Gather data** if: All answers validated (✓) **AND** VOI > Cost.  
  - ⛔ **Don’t gather data** if: Any ❗ **OR** VOI ≤ Cost **OR** Q5 shows data doesn’t change decisions.  
  - **Always hand off to humans** if ❗ triggered (non-quantifiable values or high ambiguity).

  ---

  ### **Applied to Your 3 Scenarios**  
  *Assumptions: Engineering cost = $10K/week, delay cost = $15K/week. Values in $K for simplicity.*

  #### **1. Instrument a feature before kill/keep decision?**
  - **Q1:** Baseline = Kill feature now (value = $0 – avoid future costs).  
  - **Q2:** Value_baseline = $0.  
  - **Q3:** Data = Usage metrics (noisy; ±15% error).  
  - **Q4:** Outcomes: High usage (30%, p=0.4), Low usage (70%, p=0.6).  
  - **Q5:** If High, keep + invest ($100K); if Low, kill ($0).  
  - **Q6:** Value_actions = (0.4 × $100K) + (0.6 × $0) = $40K.  
  - **Q7:** Cost = $10K (engineering) + $15K (delay) = $25K.  
  - **Q8:** VOI = $40K – $0 = $40K. $40K > $25K → ✅ **Gather data.**  
  **Why team might dislike:** Delays roadmap by 1 week. Procedure forces tradeoff: VOI justifies cost.

  ---

  #### **2. Run a second A/B test after ambiguous first?**
  - **Q1:** Baseline = Don’t launch feature (value = $0 – avoid risk).  
  - **Q2:** Value_baseline = $0.  
  - **Q3:** Data = New test with 2× sample size (noise reduced ±5%).  
  - **Q4:** Outcomes: Positive (20%, p=0.2), Negative (50%, p=0.5), Inconclusive (30%, p=0.3).  
  - **Q5:** If Positive, launch ($150K); if Negative or Inconclusive, kill ($0).  
  - **Q6:** Value_actions = (0.2 × $150K) + (0.5 × $0) + (0.3 × $0) = $30K.  
  - **Q7:** Cost = $20K (engineering) + $30K (2-week delay) = $50K.  
  - **Q8:** VOI = $30K – $0 = $30K. $30K < $50K → ⛔ **Don’t gather data.**  
  **Why team might dislike:** Team wants "more data" for confidence, but VOI < cost. Ship or kill now.

  ---

  #### **3. Add telemetry before a contractually locked launch?**
  - **Q1:** Baseline = Launch without telemetry (value = $200K from contract).  
  - **Q2:** Value_baseline = $200K.  
  - **Q3:** Data = Usage analytics (partial; won’t explain "why").  
  - **Q4:** Outcomes: N/A – data isn’t tied to a decision.  
  - **Q5:** **Action doesn’t change** – launch happens regardless.  
  - **Q6:** All actions = launch → Value_actions = $200K (same as baseline).  
  - **Q7:** Cost = $15K (engineering).  
  - **Q8:** VOI = $200K – $200K = $0. $0 < $15K → ⛔ **Don’t gather data.**  
  **Why team might dislike:** PM’s "data can’t hurt" is false – costs hurt. *Exception:* If telemetry informs post-launch fixes (link to future decision), redo Q5–Q6.

  ---

  ### **What This Procedure Can’t Do for You**  
  1. **Create precision from ambiguity:** Requires rough estimates. If your team can’t agree on probabilities (Q4) or values (Q2/Q6), the math fails.  
  2. **Handle non-quantifiable values:** Brand risk, ethics, or morale triggers ❗ (handoff to humans).  
  3. **Predict black swans:** VOI assumes known outcomes (Q4). Unforeseen events break the model.  
  4. **Optimize for learning:** If data has long-term R&D value (not tied to a decision), use a separate process.  
  5. **Eliminate bias:** Subjective estimates can skew results. Use historical data to anchor.  

  ---

  ### **Settled vs. Contested in Decision Theory**  
  | **Settled (Consensus)** | **Contested (Active Debate)** |  
  |-------------------------|-------------------------------|  
  | • **VOI ≥ 0 for free information** (Good’s theorem). | • **How to weight high-risk/low-probability events** (e.g., heavy-tailed distributions). |  
  | • **Costly info requires VOI > Cost**. | • **Best practices for subjective probability calibration** (e.g., using prediction markets vs. expert surveys). |  
  | • **Data without decision impact has VOI=0**. | • **Incorporating non-linear utility** (e.g., $1 loss ≠ $1 gain psychologically). |  
  | • **Ambiguity forces human judgment** (❗ conditions). | • **Scaling VOI in fast-moving contexts** (e.g., DevOps vs. aerospace). |  

  **Bottom line:** This procedure forces explicit tradeoffs in ambiguous situations. Use it to replace "gathering data feels safe" with "gathering data has a price." When estimates clash, focus the debate on Q2 (values) and Q4 (probabilities) – these are where teams waste the most time.
