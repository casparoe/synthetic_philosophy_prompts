prompt: |-
  I just spent an evening arguing with a friend about whether the criminal law may punish conduct that is widely thought immoral but that, by the friend's own admission, harms no one. By the end I was defending something like Hart's harm principle and he was defending something like Devlin's legal moralism, and each of us kept reaching for a new case whenever our own principle gave out. Before I go back to that argument, I want the full specification of what an adequate theory would even have to do.

  Write the desiderata for a theory of criminalization, understood as a theory of when the state is morally permitted, required, or forbidden to make conduct a crime and attach punishment, for a modern, religiously and morally pluralistic society. Structure the answer in the following named sections, in this order, with roughly the lengths indicated.

  1. The cases (roughly 600 words). Give the canonical cases an adequate theory must classify without absurdity, and say for each what a theory has to deliver about it. Include: private consensual conduct between adults (recreational drug use, selling sex, assisted dying); consensual activities that risk serious harm mainly to the participant (seatbelt and helmet laws, dangerous sports); harmless acts that offend onlookers or desecrate symbols (public blasphemy, flag-burning, desecration of a corpse, consensual cannibalism of the already dead); consensual exploitation (selling an organ, dueling, wages below a legal floor); and conduct that is individually harmless but allegedly harmful through its aggregate effects or through the moral message it sends. For each, specify what a minimally adequate theory must say about it, or at least which combinations of verdicts it cannot hold together.

  2. The distinctions (roughly 400 words). State the distinctions a theory must respect and not collapse, with the reason each matters: harm to others versus harm to self; harm versus offense; wrongdoing versus harm; the enforcement of a society's shared positive morality versus the protection of the minimum conditions of social life; private versus public. Say what would be lost if the theory collapsed each one.

  3. The fixed points (roughly 300 words). List the facts a theory must be consistent with: that criminal law is coercive and stigmatizing in a way other regulation is not; that the society in question is pluralistic about the good; that any legal system does presuppose some shared moral minimum; and that existing legal systems already draw lines such as consent, de minimis harm, and public order that a theory must explain rather than ignore.

  4. Negotiable and non-negotiable (roughly 300 words). Mark which of the above are genuine requirements any theory must meet and which are merely preferences of a particular camp, and explain the difference. Then identify the single requirement that does the most work in excluding candidate theories.

  5. Conflicts (roughly 300 words). Say whether any subset of the desiderata is jointly unsatisfiable, for example whether a theory can both respect individual liberty in the hard cases and acknowledge that a legal system presupposes a shared moral order. If something has to give, say what it is and why.

  6. Scorecard (roughly 300 words). Briefly score Hart's harm principle (the only sound ground for criminalization is preventing harm to others), Devlin's legal moralism (a society may enforce the shared morality that holds it together), and Feinberg's offense principle (preventing serious offense to others can also be a legitimate ground) against the list. Keep this section short: I want the criteria, not a verdict.

  Be concrete throughout: name the conduct, the statute-like rule that would or would not criminalize it, and the verdict that follows. I am less interested in which theory wins than in knowing what winning would mean.
reasoning: |-
  Okay, let me approach this systematically. The user wants a structured framework for evaluating theories of criminalization, drawing from their debate about Hart vs Devlin. They need concrete criteria to assess when state punishment is morally justified in a pluralistic society.

  First, I'll consider the core tension: individual liberty vs social cohesion. The user's debate about harmless immorality touches on fundamental questions about state power. For the "cases" section, I need to cover:
  - Private consensual acts (drug use, sex work, euthanasia)
  - Self-regarding risks (seatbelt laws, extreme sports)
  - Symbolic offenses (flag-burning, corpse desecration)
  - Exploitative consents (organ sales, dueling)
  - Aggregate harms (environmental damage, tax evasion)

  Each case requires specifying what counts as minimally acceptable for a theory. For example, any theory must either prohibit or permit consensual cannibalism - but can't arbitrarily switch principles.

  For "distinctions", I'll focus on:
  - Harm to others vs self (collapsing removes autonomy)
  - Harm vs offense (confusing creates thought crimes)
  - Wrong vs harm (merging justifies moral policing)
  - Social morality vs minimum conditions (blurring enables tyranny)
  - Private vs public (ignoring eliminates personal sphere)

  The "fixed points" must include:
  - Criminal law's unique coercion/stigma
  - Pluralism as non-negotiable context
  - Some shared morality being inevitable
  - Existing legal categories needing explanation

  When marking "negotiable vs non-negotiable", I'll argue that respecting pluralism is fundamental while specific harm definitions may vary. The key exclusionary test is whether a theory protects individuals from majoritarian imposition.

  For "conflicts", I'll acknowledge that liberty and social order pull in opposite directions - requiring principled tradeoffs. Finally, the "scorecard" will briefly map how Hart, Devlin and Feinberg handle the hardest cases without declaring winners.

  Throughout, I'll maintain concrete examples: e.g., contrasting how each theory would treat public blasphemy laws. The goal isn't to solve the debate but to equip the user with better evaluation tools.
answer: |-
  Here is a structured specification of desiderata for a theory of criminalization in a pluralistic society, following your requested format:

  **1. The Cases (Canonical Tests & Required Verdicts)**

  An adequate theory must classify these without absurdity, demonstrating internal consistency and fidelity to core principles.

  *   **Private Consensual Conduct Between Adults:**
      *   *Cases:* Recreational drug use in a private residence (`Possession of Controlled Substances Act`); Selling sex between consenting adults (`Prostitution Statute`); Competent adult requesting physician-assisted dying (`Assisted Suicide Ban`).
      *   *Requirement:* A minimally adequate theory must either (a) consistently permit all such acts (requiring strong justification for *any* prohibition), or (b) offer a compelling, principled distinction explaining why *some* are prohibited while others are not (e.g., distinguishing drugs based on specific, demonstrable secondary harms like addiction-fueled crime, or assisted dying based on vulnerability/slippery slope concerns). It cannot arbitrarily permit some (e.g., private gambling) while prohibiting others (e.g., private drug use) without a clear distinction grounded in its core principles.

  *   **Consensual Activities Risking Serious Harm Mainly to the Participant:**
      *   *Cases:* Driving without a seatbelt (`Mandatory Seatbelt Law`); Riding a motorcycle without a helmet (`Motorcycle Helmet Law`); Professional boxing (`Regulated Sport Exemption`); BASE jumping (`General Reckless Endangerment Statute`).
      *   *Requirement:* The theory must either (a) consistently reject criminalization of all purely self-regarding risks (treating them like dangerous sports), or (b) provide a clear principle explaining why *some* risks (e.g., no seatbelt) warrant criminalization while others (e.g., boxing) do not (e.g., extraordinary risk to others like potential traffic hazards vs. contained sporting risk, or ease of prevention vs. sport's social value). It cannot collapse the distinction between self-harm and harm to others.

  *   **Harmless Acts Offending Onlookers or Desecrating Symbols:**
      *   *Cases:* Burning a national flag in political protest (`Flag Desecration Statute`); Loud public blasphemy near a place of worship (`Public Order/Blasphemy Law`); Consensual use of donated cadaver for artistic purposes violating community norms (`Cadaver Desecration Law`); Consensual consumption of human flesh from a body willingly donated for that purpose (`Cannibalism Statute`).
      *   *Requirement:* A minimally adequate theory must either (a) consistently reject criminalization based *solely* on offense or symbolic desecration (requiring tangible harm), or (b) offer a rigorous standard for when offense becomes so pervasive, unavoidable, and severe that it constitutes a legitimate "harm" warranting state intervention, and apply it consistently. It cannot prohibit flag-burning as offensive while permitting equally offensive political speech targeting other groups without a principled distinction.

  *   **Consensual Exploitation:**
      *   *Cases:* Selling a kidney for transplant (`Organ Sale Prohibition`); Consensual duel to resolve a point of honor (`Dueling Ban`); Employment contract agreeing to wages below the legal minimum (`Minimum Wage Violation`).
      *   *Requirement:* The theory must grapple with the validity and limits of consent under conditions of desperation, inequality, or social pressure. It must either (a) require demonstrable, direct harm to identifiable non-consenting others (e.g., burden on healthcare system, erosion of labor standards impacting others), or (b) provide a clear account of when consent is vitiated or when certain acts are inherently degrading/harmful regardless of consent, and apply it consistently. It cannot condemn organ sales as exploitative while ignoring similarly coercive conditions in very low-wage labor markets without a clear principle.

  *   **Individually Harmless Acts with Alleged Aggregate Effects or Harmful Messages:**
      *   *Cases:* Discarding a single plastic bag (`Littering Statute`); Evading a small amount of sales tax (`Tax Evasion Law`); Private racist speech (`Hate Speech Law`); Minor copyright infringement (`Copyright Act`).
      *   *Requirement:* The theory must provide a credible account of how individual acts translate into aggregate harm (demonstrating a clear causal pathway and threshold) or define what constitutes an intolerable "harmful message" (beyond mere offensiveness) that justifies coercion. It must avoid criminalizing trivial acts (`de minimis` principle) unless the aggregate effect is demonstrably severe and direct (e.g., mass tax evasion crippling essential services). For harmful messages, it must distinguish advocacy from incitement or true threats. It cannot justify criminalizing littering based on aggregate harm while dismissing similar arguments for minor pollution or petty theft without clear thresholds.

  **2. The Distinctions (Essential Conceptual Boundaries)**

  A theory must respect these distinctions; collapsing them leads to over-criminalization or theoretical incoherence.

  *   **Harm to Others vs. Harm to Self:** *Reason:* Collapsing this eliminates personal autonomy and justifies pervasive paternalism. *What's Lost:* The core liberal commitment that competent adults are sovereign over their own lives and bodies in the absence of direct harm to others. A theory that ignores this distinction cannot differentiate between assault and riding a motorcycle without a helmet.
  *   **Harm vs. Offense:** *Reason:* Offense is subjective, variable, and often involves mere hurt feelings or disagreement. Collapsing this grants majorities excessive power to suppress minority practices based on dislike. *What's Lost:* Tolerance and pluralism. A theory that equates offense with harm could criminalize wearing religious symbols in public or peaceful protests that upset viewers.
  *   **Wrongdoing vs. Harm:** *Reason:* Not all wrongdoing causes the kind of tangible, set-back-to-interests harm that justifies state coercion. Collapsing this justifies enforcing private morality. *What's Lost:* The principle that criminal law targets public wrongs with identifiable victims/social damage, not private sin. A theory ignoring this could criminalize breaking a promise or private adultery.
  *   **Enforcing Shared Morality vs. Protecting Minimum Social Conditions:** *Reason:* In pluralistic societies, "shared morality" is contested and often represents majority views. Collapsing this allows imposition of sectarian values. *What's Lost:* Neutrality and the protection of minorities. *What is Protected:* Basic order, security, justice, and essential public goods necessary for any society to function, regardless of specific moral views (e.g., prohibitions on violence, fraud, pollution). A theory collapsing this distinction cannot explain why laws against murder are fundamentally different from laws against blasphemy.
  *   **Private vs. Public:** *Reason:* Collapsing this grants the state intrusive power over intimate life and personal choices shielded from public view. *What's Lost:* A vital sphere of individual liberty and privacy essential for human flourishing and dissent. A theory ignoring this cannot distinguish between public indecency and private sexual conduct between consenting adults.

  **3. The Fixed Points (Non-Negotiable Context)**

  A theory must be consistent with these realities:

  *   **Coercive & Stigmatizing Nature of Criminal Law:** Criminalization involves state violence (arrest, imprisonment) and profound social condemnation ("criminal" label). A theory must justify this uniquely severe response; it cannot treat criminal law as merely another regulatory tool.
  *   **Pluralism about the Good:** The society encompasses diverse, often incompatible, conceptions of morality, religion, and the good life. A theory cannot assume or require moral homogeneity; it must function *because* of, not despite, pluralism.
  *   **Presupposition of a Shared Moral Minimum:** Any functioning legal system requires *some* baseline agreement on fundamental norms (e.g., prohibitions on violence, theft, promise-breaking in core contexts). A theory must acknowledge this foundation while explaining why it doesn't license enforcing *all* widely held moral beliefs.
  *   **Existing Legal Categories Needing Explanation:** A theory must account for and justify (or critique consistently) widely accepted legal distinctions: the significance of **consent** (as a defeater for harm claims), the **de minimis** principle (trivial harms aren't crimes), the role of **public order** (disturbing the peace vs. mere offense), and the focus on **external conduct** rather than internal thoughts or purely private acts. It cannot simply dismiss these as historical accidents.

  **4. Negotiable and Non-Negotiable**

  *   **Non-Negotiable (Requirements):**
      *   Internal consistency across the canonical cases.
      *   Respecting the essential distinctions (Harm-Self/Others, Harm/Offense, Wrongdoing/Harm, Moral Minima/Enforced Morality, Private/Public).
      *   Acknowledging the fixed points (Criminal Law's Severity, Pluralism, Shared Minimum, Existing Categories).
      *   Providing a *principled* justification for criminalization that transcends mere majoritarian preference.
  *   **Negotiable (Preferences of Camps):**
      *   The *specific definition* of "harm" (e.g., purely physical vs. including psychological, autonomy-based).
      *   The *weight* given to autonomy/liberty vs. social cohesion/order.
      *   The *scope* of "public" space or "minimum social conditions".
      *   The *acceptability of paternalism* in edge cases (e.g., extreme self-harm risks).
      *   The *role of "moral message"* in defining harm/offense.

  *   **The Key Excluding Requirement:** The most powerful requirement excluding candidate theories is **Respecting Pluralism while Limiting Coercion**. A theory that fails to robustly protect individuals/groups with minority conceptions of the good from having the majority's specific morality coercively imposed upon them via the uniquely severe criminal sanction, absent tangible harm or the undermining of essential social conditions, fails the core test for a pluralistic society. This requirement immediately challenges theories prioritizing widespread moral condemnation alone as sufficient grounds.

  **5. Conflicts**

  The most significant tension is between **Respecting Individual Liberty/Harm Principle (especially in private, consensual, or self-regarding acts)** and **Acknowledging that Law Presupposes/Shapes a Shared Moral Order**. Pure harm principles struggle with:
      *   Consensual exploitation (Is vitiated consent "harm"?)
      *   Symbolic acts/desecration (Is undermining social cohesion a "harm"?)
      *   Aggregate harms (When does an individual act cross the threshold?).
  Pure moralism struggles with pluralism and overreach.

  *   **What Must Give?** A degree of purity in *both* liberty and moral order principles. An adequate theory must:
      1.  **Qualify Liberty:** Accept that liberty isn't absolute. Preventing *serious* harm (including diffuse, probabilistic, or structural harm) or protecting *essential* social preconditions *can* justify curtailing liberty, even in some consensual contexts (e.g., organ sales bans, environmental regulations). Defining "serious" and "essential" is crucial and contentious.
      2.  **Constrain Moralism:** Sharply limit appeals to moral order. Shared morality alone is insufficient. Enforcement must be demonstrably necessary to prevent tangible harm to others or the collapse of fundamental social institutions, not merely to uphold specific values disliked by the majority. The "moral order" must be rooted in the "minimum conditions of social life," not the full positive morality.
  *   **Why?** Because absolute liberty ignores our interdependence and vulnerability, while unrestrained moralism destroys pluralism and individual dignity under the guise of unity. The theory must navigate this tension via principled distinctions and thresholds.

  **6. Scorecard (Brief Assessment Against Desiderata)**

  *   **Hart's Harm Principle (Prevent Harm to Others):**
      *   *Strengths:* Excels on Private Consensual Conduct, Harmless Offense/Desecration (rejects criminalization), Harm-Self/Others distinction. Protects pluralism and liberty robustly. Explains Consent, *De Minimis*, Public Order (as preventing tangible harms like breach of peace).
      *   *Weaknesses/Challenges:* Struggles with Consensual Exploitation (is it "harm"?), Aggregate Harms (individual act threshold?), purely Self-Regarding Risks (must reject criminalization), and the necessity of *some* shared moral minimum beyond just preventing harm. May under-protect essential social goods vulnerable to erosion.

  *   **Devlin's Legal Moralism (Enforce Shared Morality for Social Cohesion):**
      *   *Strengths:* Acknowledges the role of shared morality/social bonds explicitly. Can readily justify criminalizing acts seen as deeply corrosive to social fabric (e.g., certain desecrations, exploitation, potentially private immorality), and potentially aggregate harms/offensive messages if widely condemned.
      *   *Weaknesses/Challenges:* Collapses Harm/Offense, Wrongdoing/Harm, Shared Minimum/Enforced Morality, and Public/Private distinctions. Threatens pluralism by empowering majority morality. Struggles to explain why only *some* immoral acts are criminalized and the importance of consent. Risks severe overreach and stigmatization based on moral disapproval alone.

  *   **Feinberg's Framework (Harm Principle + Offense Principle - serious, unavoidable offense):**
      *   *Strengths:* Retains Harm Principle core. Provides a structured, higher-threshold approach to Offense, potentially addressing public blasphemy/desecration *if* truly unavoidable and severe. Respects Harm/Offense distinction. Explains Public Order concerns better than pure Harm Principle.
      *   *Weaknesses/Challenges:* Retains Harm Principle struggles (Exploitation, Aggregates, Self-Harm). The Offense Principle, even with thresholds, remains subjective and risks suppressing minority expression/public protest (e.g., flag-burning). Still struggles with "harmful messages" and deep desecration absent direct offense.
