prompt: |-
  I'm on the ethics committee at a mid-sized hospital, and we get maybe three or four cases a year where an advance directive says one thing but the patient, now cognitively impaired (dementia, usually, sometimes a TBI), seems to want something else. The classic case: a woman writes an advance directive refusing antibiotics for pneumonia if she ever has severe dementia, then ten years later she has severe dementia and gets pneumonia, and she seems perfectly content, smiles at visitors, enjoys pudding. The directive says let her die; the family says she's clearly not suffering. Our committee has to make a recommendation, and honestly we're just winging it each time — different members invoke different principles, we split along the same lines every meeting, and there's no consistency across cases. Last month we had two cases that were structurally identical and we went opposite ways, which nobody felt great about.

  I've been reading some of the philosophy on this — Dworkin on precedent autonomy, Dresser on experiential interests, Jaworska on the capacities that survive in dementia — and I want to turn whatever the best philosophical account is into an actual procedure we can run. Not a policy exactly, more like a structured decision tool: a sequence of questions we ask about each case, with guidance on what counts as a sufficient answer, where the procedure says "follow the directive," where it says "override the directive," and where it says "this is a judgment call, here's what's at stake and who should make it." The procedure has to be usable by a committee of clinicians, social workers, a chaplain, and one community member — most of whom haven't read any of this stuff. It should take maybe 45 minutes to run. And it should be honest about which steps are doing real normative work versus which are just clarifying facts. If the procedure sometimes tells us to do something that feels wrong, I want to know that too — test it on at least two cases, including one where it gives an answer you wouldn't personally endorse. Also, one thing I've noticed is that a lot of the philosophical debate turns on whether the demented patient is "the same person" as the one who wrote the directive, and I'm not sure our committee even has a working view on personal identity, so the procedure should either avoid that question entirely or give us a way to answer it without doing metaphysics.
reasoning: |-
  Okay, the user is on an ethics committee at a mid-sized hospital facing a recurring dilemma: advance directives vs. current patient expressions in dementia cases. They need a structured decision tool, not a rigid policy, that can be used by a multidisciplinary team in about 45 minutes. The tool must avoid metaphysical debates about personal identity while incorporating key philosophical concepts from Dworkin, Dresser, and Jaworska. 

  Hmm, the core tension here is between respecting past autonomy (Dworkin) and current well-being (Dresser), with Jaworska adding nuance about residual decision-making capacity. The committee's inconsistency suggests they're stuck in philosophical deadlock without translation to practical steps. 

  What the user really needs isn't just a procedure but epistemic humility - a way to acknowledge when values genuinely conflict rather than forcing false consensus. The "feels wrong" test case request is smart; it reveals where the tool prioritizes principles over intuition. 

  For the personal identity trap: we'll sidestep metaphysics by focusing on observable factors like cognitive continuity and interest alignment. The "threshold competence" concept from Jaworska is perfect here - measurable through current preferences and distress cues rather than abstract sameness. 

  Design challenges: must compress complex philosophy into yes/no questions without oversimplifying. Key moves: 
  1) Separate factual clarity from value conflicts upfront 
  2) Use concrete behavioral markers for "contentment" 
  3) Build in off-ramps for borderline cases where family/proxy judgment is unavoidable 

  The Ulysses Contract dilemma case will stress-test the tool effectively - it should output "follow directive" despite emotional resistance, demonstrating how the structure contains bias. 

  Notable constraints: 45-minute runtime means no open-ended deliberation. Solution: phased approach with strict timeboxes (5min/fact phase, 15min/values, etc.) and pre-circulated materials. Community member accessibility requires banishing terms like "precedent autonomy" - hence the plain-language questions about "then-self/now-self." 

  Biggest risk is committees misusing the "gray zone" as a cop-out. Mitigation: require specific conflict documentation and tie-breaker rules. Adding the "reversible harm" criterion prevents paralysis in urgent cases like pneumonia treatment.
answer: |-
  Based on your needs – a practical, time-bound procedure grounded in key philosophical principles but avoiding metaphysics – here's a structured decision tool. It integrates Dworkin, Dresser, and Jaworska into a 6-step flow, designed for ~45 minutes of committee discussion:

  **Ethics Committee Advance Directive Override Assessment Tool (AD-OAT)**

  **Core Principles Embedded:**
  1.  **Respect for Precedent Autonomy (Dworkin):** The past competent self's values deserve significant weight.
  2.  **Current Experiential Interests (Dresser):** The present self's well-being (avoiding suffering, experiencing pleasure) matters.
  3.  **Residual Capacities & Threshold Competence (Jaworska):** Does the patient retain *sufficient* capacity to form *current* preferences relevant to the decision? (Avoids "same person" question by focusing on function).
  4.  **Harm Principle:** Avoid causing significant, irreversible harm based on uncertainty.

  **The Procedure (Target: 45 Minutes):**

  *   **Preparation (Before Meeting):** Circulate case summary (directive, current condition, medical situation, family views, observed behaviors) + this tool.
  *   **Step 1: Directive Clarity & Scope (5 mins)**
      *   **Q1:** Is the advance directive clearly applicable to *this specific clinical situation*? (e.g., "pneumonia in severe dementia" directive applies to current pneumonia in severe dementia).
      *   **Q2:** Was the directive created under conditions suggesting robust understanding and voluntariness? (e.g., witnessed, discussed with doctor, no evidence of coercion, not created during acute crisis).
      *   **Guidance:** If **No to Q1 or Q2**, the directive's authority is weakened significantly. Proceed to Step 4, weighting current interests more heavily. If **Yes to both**, proceed to Step 2.

  *   **Step 2: Assessing Current Patient State & Expressions (10 mins)**
      *   **Q3:** What is the *best evidence* of the patient's **current experiential state** (Dresser)?
          *   *Look for:* Observable signs of distress/pain vs. contentment/pleasure (e.g., smiles, enjoyment of food/visits, calmness vs. agitation, cries, grimacing). *Focus on behavior, not assumed inner state.*
          *   *Threshold:* Is there *consistent* evidence suggesting the patient is *not* experiencing significant net suffering from their *current state of existence* (dementia + illness)? (e.g., frequent smiling, engagement with simple pleasures, minimal distress cues).
      *   **Q4:** What is the *best evidence* of the patient's **current preferences** *regarding the specific intervention in question* (Jaworska)?
          *   *Look for:* Explicit communication (even if simple - "yes/no," gesture to accept/reject pill/food), consistent behavioral responses to *this specific type* of care (e.g., opens mouth for spoon but spits out medicine, turns away from needle).
          *   *Threshold (Jaworska):* Does the patient demonstrate *any* ability to form a preference about *this specific act* (accepting/rejecting treatment/care) in the *present moment*, even if cognitively limited? (This is about *minimal* intentionality regarding *this* act, not global decision-making capacity).

  *   **Step 3: Reconciling "Then-Self" vs. "Now-Self" (Avoiding Metaphysics) (10 mins)**
      *   **Q5:** Based on the directive and its context (Step 1), what core *values or fears* motivated the directive? (e.g., Fear of prolonged dependence, loss of dignity, specific suffering, value on cognitive life, religious belief about suffering).
      *   **Q6:** Is there evidence the **current patient** experiences the *negative states* the directive sought to avoid? (e.g., Does the patient *appear* distressed by dependence? Do they seem aware of their cognitive loss? Are they experiencing the indignity or suffering they feared?).
      *   **Q7:** Does the **current patient's experiential state/behavior** (Step 2) suggest their core values *might have changed*? (e.g., They seem to find value in simple sensory pleasures or relationships *despite* the condition they feared; they show no distress about the feared state). *Do NOT ask "Is it the same person?" Focus on observable alignment/misalignment of values/experience.*

  *   **Step 4: Conflict Assessment & Override Criteria (10 mins)**
      *   *Review outputs from Steps 1-3.*
      *   **Decision Path:**
          *   **Path A (Follow Directive):** IF (Q1 & Q2 = Yes) AND (Q6 = Yes - current patient *is* experiencing feared state) OR (Q4 = No - *no* current preference for treatment AND Q3 suggests neutrality or suffering) **--> Strong presumption to FOLLOW DIRECTIVE.** (Dworkin + Current suffering aligns).
          *   **Path B (Override Directive):** IF (Q1 or Q2 = No - weak directive) AND (Q4 = Clear current preference *for* treatment OR Q3 = Clear current contentment/pleasure AND treatment is low-burden/reversible) **--> Strong presumption to OVERRIDE, prioritize current well-being/choice.** (Dresser + Jaworska + Weak directive).
          *   **Path C (Gray Zone - Requires Judgment):** IF (Q1 & Q2 = Yes - strong directive) BUT (Q6 = No - *no* evidence of feared suffering *and* Q3 = Evidence of current contentment *and* Q4 = Ambiguous or suggests preference *for* life/treatment) **--> CONFLICT.** *Proceed to Step 5.* (Tension between Dworkin & Dresser/Jaworska).
          *   **Path D (Urgent Harm Avoidance):** IF significant uncertainty AND withholding treatment causes *immediate, irreversible harm* (like death from untreated pneumonia) AND Q3/Q4 are *not* clearly against treatment --> Default to PROVIDE TREATMENT pending further review. (Harm Principle).

  *   **Step 5: Resolving the Gray Zone (Path C) (7 mins)**
      *   **Q8:** How *burdensome* is the proposed treatment *to the current patient*? (e.g., Simple oral antibiotics vs. repeated IVs/intubation). *Lower burden favors override.*
      *   **Q9:** How *reversible* is the decision? (e.g., Treating pneumonia now doesn't prevent honoring directive later for a different condition; withholding antibiotics is irreversible). *Reversibility favors override.*
      *   **Q10:** What is the *surrogate's/family's* insight into the *past patient's likely view of this specific situation*? (Not just their own wishes). *Compelling evidence the past patient would relent *in this specific circumstance* favors override.*
      *   **Guidance:** No bright line. Weigh factors from Q8-Q10. If significant burden, irreversibility, or strong surrogate insight, OVERRIDE may be justified. If low burden, reversibility, and no compelling surrogate insight, FOLLOW DIRECTIVE may be safer. *Document the reasoning and inherent conflict.*

  *   **Step 6: Recommendation & Documentation (3 mins)**
      *   State the recommended action (Follow Directive / Override Directive / Provide Treatment as Harm Avoidance).
      *   Document the path taken (A, B, C, D) and key reasoning points from each step, *especially* in Gray Zone cases.
      *   Note any dissenting views briefly.

  **Testing the Tool: Two Cases**

  1.  **Classic Case (Your Example - Directive Refusing Abx for Pneumonia in Severe Dementia):**
      *   Step 1: Q1 (Yes), Q2 (Assume Yes).
      *   Step 2: Q3 (Content - smiles, enjoys pudding - **Threshold Met: Not suffering**), Q4 (Likely No clear *specific* preference about antibiotics - perhaps accepts spoon but spits medicine? **Threshold Not Met**).
      *   Step 3: Q5 (Fear of prolonged severe dementia existence), Q6 (**No** - she seems content, not distressed by dependence/cognition), Q7 (**Maybe** - finds pleasure despite condition).
      *   Step 4: **PATH C (Gray Zone)**. Strong directive vs. content present self with no clear treatment preference.
      *   Step 5: Q8 (Low burden - oral Abx?), Q9 (Irreversible harm if withhold), Q10 (Family insists "she wouldn't want to die now she's happy" - but is this *her* past view or *their* view?).
      *   **Tool Output:** **Gray Zone (Path C)**. Leans towards **OVERRIDE** (provide Abx) due to low burden, irreversibility of death, current contentment, and weak evidence past self specifically anticipated/content with death *in this scenario of seeming contentment*. *This might feel wrong to strict Dworkinians.* Recommendation involves judgment; document conflict.

  2.  **Ulysses Contract Case (Test the "Feels Wrong"):**
      *   *Scenario:* A highly rational professor with strong dread of dementia writes: "If I ever develop dementia and call for my deceased wife, showing I've lost touch with reality, refuse all life-prolonging treatment, including food/water. I prefer death to that irrational state." Now, severe dementia, calls for wife daily, develops UTI. Seems content otherwise, eats eagerly when fed, smiles. Directive clearly applicable (Q1/Q2: Yes). Family is distraught, says "He loves eating! Don't starve him!"
      *   Step 2: Q3 (Content while eating/smiling - **Not suffering**), Q4 (Eagerly eats - **Clear current preference FOR eating**).
      *   Step 3: Q5 (Dread of irrationality/loss of self, specific trigger: calling for dead wife), Q6 (**Yes** - he *is* experiencing the specific irrational state he feared - calling for dead wife), Q7 (**No** - his contentment seems tied to the *simple act of eating*, not contradicting his core value against irrational existence; he shows no distress *about* his irrationality).
      *   Step 4: **PATH A (Follow Directive)**. Strong directive (Q1/Q2 Yes), *specific feared state is present* (Q6 Yes), and *while Q3 shows contentment, Q4 shows a current preference* ***for*** *the intervention (feeding) which directly contradicts the directive*. The directive explicitly addresses *this trigger and this intervention*.
      *   **Tool Output:** **FOLLOW DIRECTIVE** (withhold artificial nutrition/hydration per directive, provide comfort care). *This will feel profoundly wrong to many, prioritizing past autonomy over current pleasure and basic care.* However, the tool flags the *specificity* of the directive, the *presence of the exact trigger*, and the *clear conflict with the current preference* as decisive for Path A. This highlights the normative force given to precedent autonomy when the directive is precise and the feared state manifests.

  **Why this Works for Your Committee:**

  1.  **Avoids Metaphysics:** Replaces "same person?" with functional questions about current experience, preferences, and value alignment (Q3, Q4, Q6, Q7).
  2.  **Structured & Time-Bound:** Clear steps with time estimates and decision paths.
  3.  **Grounds in Philosophy:** Embeds Dworkin (Steps 1, 3, 5, Path A), Dresser (Steps 2, 3, Path B), Jaworska (Step 2 Q4 Threshold, Step 4 Paths), and harm principle (Step 4 Path D).
  4.  **Handles Gray Areas:** Explicitly defines the conflict zone (Path C) and provides factors for judgment without demanding consensus on unsolvable dilemmas.
  5.  **Practical Focus:** Uses observable behaviors, directive clarity, burden/reversibility – concepts accessible to all committee members.
  6.  **Promotes Consistency:** Provides a repeatable framework, reducing ad hoc reasoning. The test cases show it *can* give "uncomfortable" answers based on its embedded principles.
  7.  **Clear Documentation:** Requires stating the path and key reasoning points.

  **Implementation Tips:**

  *   **Train:** Brief the committee on the core principles (Dworkin=Dignity of Past Choices; Dresser=Current Well-Being; Jaworska=Respecting Current Wishes Where Possible) using plain language *once*.
  *   **Chair Role:** The Chair must keep time strictly and guide the committee *through the steps*, preventing philosophical digressions. "That's an important point about suffering; let's capture it under Step 2 Q3."
  *   **Pre-Circulate:** Ensure the case summary is clear and concise.
  *   **Review:** Periodically review cases where the tool was used (especially Path C/D) to see if patterns emerge or if the tool needs tweaking.

  This tool won't eliminate hard choices, but it should bring much-needed structure, transparency, and philosophically grounded consistency to your committee's difficult work.
