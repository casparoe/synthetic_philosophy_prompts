  The doctor has credence in two moral theories:  
  1. **Utilitarianism (U)**: Maximizes total welfare (measured in QALYs: Quality-Adjusted Life Years).  
  2. **Prioritarianism (P)**: Prioritizes the worst-off; welfare gains for the disadvantaged are amplified (measured by a concave transform: √(QALY) to model diminishing returns).  

  #### **Agent's Credences**  
