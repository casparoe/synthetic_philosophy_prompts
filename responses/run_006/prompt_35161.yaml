  In the residue report, I'll note where translations work well (like VM functionalism) versus where they break down (IIT's topology requirements, biological specifics). The key tension lies between the engineer's discrete-state model and philosophy's phenomenological aspects - the "what-it's-like" quality remains stubbornly untranslatable. This exposes limitations in both frameworks: the technical vocabulary lacks phenomenology handles, while some philosophical claims mask ambiguity in quantitative terms.

