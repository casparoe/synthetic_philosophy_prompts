  Okay, the user is describing a scenario where individuals in a group make sequential decisions, each having a bit of private information. The first person acts based on their own clue. The second person considers both the first person's choice and their own clue. But if the first two choose the same option, the third person might ignore their own clue, thinking it's unlikely two people were wrong. This continues, leading to an information cascade where later individuals follow the crowd regardless of their private information. The user noticed this in real life, like college applications and online reviews, where early actions set a trend that others follow without questioning.

  The user mentions terms like groupthink or bandwagon effect but feels they're too broad. They want to know if there's a specific term for this rational inference-based cascade. They also ask about distinguishing cases where early actors had good info versus random choices. 

  I recall that this is a known concept in economics and decision theory called an "information cascade." It was formalized by Bikhchandani, Hirshleifer, and Welch in 1992. The key here is the rational aspect—people are making Bayesian updates based on others' actions, not just social conformity. 

  The user also wants to differentiate between cascades based on good info versus random events. In the literature, the strength of private signals matters. If early signals were strong, the cascade is more justified. If they were weak or random, it's fragile. Terms like "fragile cascade" or "incorrect cascade" might apply. 

  The user’s examples align with information cascades: the college app scenario shows how initial specific reasons led to blind following. Online reviews where early ratings set the trend is another classic example. 

  They might also be interested in how to prevent such cascades, like encouraging independent input or delaying decisions. But their main query is about terminology. Confirming that "information cascade" is the precise term and explaining its mechanisms should address their need. Highlighting the rational vs. social aspects distinguishes it from groupthink. Also, discussing signal strength and cascade fragility covers their second point.
answer: |-
  You've described a beautifully precise phenomenon with razor-sharp clarity! **Yes, this *exact* mechanism has a well-established name in economics and decision theory: it's called an "Information Cascade."**

  Here's why it perfectly fits your description and addresses your specific questions:

  1.  **The Core Mechanism:** An information cascade occurs when individuals, observing the *actions* of predecessors in a sequence, rationally decide to *ignore their own private information* and follow the crowd, even if their private signal suggests something different. This happens because the observed actions become such overwhelming evidence that an individual's own signal seems statistically insignificant in comparison.
  2.  **Rational Inference (Not Just Conformity):** This is the critical distinction you identified. Unlike groupthink (which emphasizes social pressure, cohesion, and suppression of dissent) or the bandwagon effect/herd mentality (which often implies irrational copying or emotional contagion), an information cascade is fundamentally about **Bayesian rationality**. Individuals are rationally updating their beliefs based on the evidence provided by others' choices. They are being logical, not sheep-like. The failure is systemic, not individual.
  3.  **The Tipping Point:** You nailed the dynamics. Once a sufficient number of early actors choose the same option (often just two in simple models), it becomes rational for subsequent individuals to disregard their own signals. The cascade "locks in."
  4.  **Systemic Failure:** As you observed, the group can easily end up making the *wrong* choice if the early actors happened to receive misleading or weak signals, even if the majority of later individuals have correct private signals pointing the other way. Their valuable information is never acted upon because they rationally infer the crowd must be right.
  5.  **Your Examples Are Textbook:**
      *   **College Applications:** The first few had specific, valid reasons (private signals). Subsequent applicants observed the growing number applying (actions), rationally inferred there must be a good reason (even if unknown), and applied themselves, ignoring their own lack of specific positive information (or even potential negative signals they might have had).
      *   **Online Reviews:** Early ratings (even just a handful) set a strong prior belief for later reviewers. People are more likely to rate positively if the initial ratings are positive (bandwagon) *and* are more likely to interpret their own experience through the lens of those initial ratings (cascade), making subsequent positive ratings more likely regardless of the true quality.

  **Key Distinctions Within Information Cascades (Addressing Your Second Question):**

  The literature absolutely distinguishes between the *source* and *quality* of the early signals:

  1.  **Cascades Based on Strong Signals:** If the first few actors had genuinely strong, high-quality private information (e.g., experts, truly unique insights), the cascade is more likely to be correct and beneficial. The cascade efficiently aggregates good information. (e.g., The first few seniors applying *knew* the college was a perfect fit for specific academic programs).
  2.  **Cascades Based on Weak or Misleading Signals:** This is the scenario you focused on, where the early actors' choices were driven by:
      *   **Weak Signals:** Vague, ambiguous, or low-precision information.
      *   **Idiosyncratic Preferences:** Choices based purely on personal taste irrelevant to others (like a sibling being there).
      *   **Randomness/Noise:** Simple luck or misinterpretation.
      *   **"Herd" Among the First Movers:** Even the first few might be copying someone *else* outside the observed sequence.
      *   **Signaling Motives:** Early actors might act to signal something (e.g., being trendy) rather than based on genuine information about the choice itself.
      *   **In these cases, the cascade is "fragile" or "incorrect" from the start.** It's built on a foundation of noise or irrelevant data. The rationality of later individuals compounds the initial error. This is the "unlucky cliff" scenario you described.

  **Terminology Nuance:**

  *   **Information Cascade:** The overarching term for the rational herding mechanism based on sequential observation of actions overwhelming private signals.
  *   **Incorrect Cascade / Fragile Cascade:** Specifically refers to cascades that lead to the *wrong* outcome, often due to weak/misleading early signals or noise.
  *   **Cascade vs. Herding:** "Herd behavior" is often used as a broader umbrella. Information cascades are a specific *explanation* for herding that emphasizes rational learning from others' actions. Other herding explanations involve payoff externalities (you benefit directly from choosing what others choose, like network effects) or pure irrational imitation.

  **Why "Information Cascade" is the Perfect Term:**

  *   It directly names the key elements: **Information** (the private signals and the inferences drawn from actions) and a **Cascade** (the self-reinforcing, sequential nature of the adoption/choice).
  *   It centers the *rational learning* aspect, distinguishing it from purely psychological conformity.
  *   It's widely recognized in academic literature (seminal papers by Bikhchandani, Hirshleifer, and Welch in 1992 cemented the term).
  *   It captures the potential for systemic error despite individual rationality.

  **In summary:** You've astutely identified the core mechanism of an **Information Cascade**. It's the specific phenomenon where rational individuals, in a sequential decision-making setting, abandon their own private information based on the weight of evidence from predecessors' *actions*, potentially leading the entire group astray if early signals were weak or misleading. Your distinction between cascades built on good information vs. noise is inherent in discussions of "fragile" or "incorrect" cascades within the theory. This is precisely the term you were looking for!
