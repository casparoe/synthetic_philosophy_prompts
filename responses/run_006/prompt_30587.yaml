answer: |-
  Here are your five numbered points:

  1.  **Agreement:** Both sides fully acknowledge the observable phenomena: the Sorites paradox arises for vague predicates like "bald," borderline cases exist where competent speakers hesitate or disagree, and no precise, knowable cutoff point can be empirically located or agreed upon in practice.
  2.  **Nature of Disagreement:** This is fundamentally a *metaphysical* disagreement about the nature of meaning and reality: Epistemicism posits semantic precision hidden by ignorance, while Supervaluationism posits genuine semantic indeterminacy.
  3.  **Verbal Element?** The dispute is **not merely verbal** about "true"; while technical definitions of "truth" differ (e.g., supertruth vs. classical truth), the core clash is about the underlying *metaphysics* of vague predicates – precision vs. indeterminacy – not just the label "true".
  4.  **Bedrock Differences:** The irreconcilable intuitions are: Epistemicism's core intuition that meaning *must* be precise (rejecting truth-value gaps) vs. Supervaluationism's core intuition that meaning *can be* inherently indeterminate (requiring truth-value gaps for borderline cases).
  5.  **Progress:** Genuine progress would require either: (a) a new framework reconciling the core intuitions or satisfying the demands of both, or (b) compelling arguments showing one core intuition leads to unacceptable consequences elsewhere in philosophy (logic, language, knowledge) that the other avoids.
